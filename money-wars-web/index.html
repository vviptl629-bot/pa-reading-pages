一派质疑新桥能否按承诺控制和管理深发展，有人说新桥不是真正的投资方，而是掮客。这个谣言显然是编造出来的，而且这一派意见不相信新桥会接受账面净资产1.65倍的报价，因此，主张把深发展的控制权卖给另一家投资方，也就是萧遂宁所说愿意按净资产2至2.5倍出价的那一方。另一派的意见是政府必须“重合同，守信用”，完成与新桥的交易。最终，两派意见达成共识，由萧遂宁向新桥摊牌，也就是萧向我们转达的三点，如果新桥在2月12日之前接受这三个条件，就与新桥完成交易，否则就放弃新桥。", "就这样，双方都走到了十字路口，携手并进还是分道扬镳就要看我们如何答复市政府的要求。此次萧所转达的不是讨价还价，而是真正的最后通牒。如何回答，必须准确拿捏。一方面，我们需要认真考虑政府提出的条件，给予积极响应，这样给支持与新桥交易的领导以足够的弹药；另一方面，我也不打算轻易接受政府的新条件，因为关于价格的条件违反过去的协议，焉知我们此次答应了新要价，政府方面是否还会变卦？毕竟，他们的要价已经改了很多次了，这次也是口说无凭，我们需要政府方面把这些条件付诸文字，才能给予正式回复。轮到我说话了，我字斟句酌地说：“我方对于市政府支持新桥控股并管理深发展表示欢迎和感谢。”我确认，对于要求新桥承诺至少五年不退出的要求，我们完全接受。实际上，我们尽调的一个结论就是要彻底改造深发展至少需要三五年的时间。对于政府提出的第二个条件，也就是要价，我说我手头上有几份文件，不知道萧行长是否熟悉其中的内容。这些文件显示，政府方面同意“价格区间为截止到2002年6月底深发展账面净资产值的0.8倍到1.5倍”。我从中抽出两份文件，把有关的段落读给他听。一份是新桥应政府方面的要求提供的一份承诺函，其中提到了价格区间；另一份是深发展于2002年8月6日向央行呈递的报告，其中也确认与新桥达成一致的价格区间。所以政府方面提出的新要价在两个方面违反之前的约定：第一，账面净资产的截止日应该是2002年的6月底，而不是政府此时提出的9月底；第二，新要价的倍数增加了。我说的意思并非拒绝深圳的新条件，而是要让萧知道，反复无常不是我们这一方。然后我提醒萧遂宁，新桥和市政府在2002年6月21日签署的框架协议给予新桥独家谈判的权利，而且这个权利是没有截止期的，如果政府方面与其他潜在的投资者接洽，就违反了这个有法律约束力的协议。", "最后我说，为了表示最大的诚意，我们愿意以双方商定的价格区间的上限，即2002年6月净资产价值的1.5倍交易。但如果政府方面坚持按2002年9月账面净资产值的1.65倍作价，则必须把这个要求形成文字，这样我们才可以认真考虑并回复。我的发言很简短，力求严谨，一边说，一边让他看过去形成的文件。", "我的话音一落，萧的第一个反应就是“我的天啊”！他的语调不高，但足以表达他的震惊。显然，他和他的前任王骥一样对他们参与之前新桥和深圳方面的协议、其他形成文字的共识以及向上级主管部门报告并不十分了解。大概他感到中了埋伏，就像下象棋，正在得意洋洋步步紧逼，马上就要抬手将对手一军了，突然被人反将一军，而且几乎是死棋，如果不是狼狈，也有些尴尬。萧尤其对深发展在2002年8月6日向央行呈交的报告有兴趣，因为那份文件证实，深圳方面已经接受了的价格区间，而且向央行正式上报。他仔细审阅了那份文件之后，又在自己的公文包裹翻来覆去，但找不到此件的副本。我说您别找了，我手头上仅此一份，回到香港之后传真给你。虽然在谈判桌上你来我往互不相让，但我不得不承认萧遂宁的专业性。", "他看到这些文件后表现出的惊讶是真情表露，不是装出来的。他确实对有些背景一无所知。我相信，他如果事先知情，尤其是深发展正式向央行递交的报告，他不会不加解释就抛出显然违反之前协议的新条件。"], "wcount": 7917}, {"icon": "9", "title": "第九章 风云诡谲", "paras": ["我忙着应付萧遂宁，欧巍则去了台湾。他听说周林在那里出差，就紧随其后，在2003年2月12日飞往台北，想探个究竟。欧巍刚一落地就打电话告诉我，他了解到周林到台北的目的是与台湾的中国信托商业银行谈判，希望他们收购深发展。", "看来，我们确实有了竞争对手了，而周林已转而支持中国信托。到底是什么促使他发生转变，我们无从得知，只能猜测，我则更多是自责，因为自己的不慎失去了他的信任。看来，这件事变得愈来憨复杂了。", "台湾的中国信托想要控制一家中国大陆的银行，这很好理解。自上世纪90年代初以来，许多台湾企业在大陆投资了数十亿美元。对于台企来说，大陆人口超过10亿，市场前景广阔，且海峡两岸语言相同、文化相通，有地利人和之便。台湾本土的银行市场已经饱和，总人口才2000多万，银行就有50多家。随着台企不断向大陆拓展，台湾银行也想在大陆市场分一杯羹，而大陆的发展潜力几乎是无限的。除了中国信托的介入，还有更命人不安的消息笼罩着我们。在深圳，我们听说有人散播谣言，说新桥打算购买深发展股份后，马上转手卖给中国信托。这个谣言意在一石二鸟，既抹黑了新桥的形象，把我们说成一个掮客，又将中国信托抬高成真正的收购方。正是出于对这些谣传的顾虑，市长才提出要求新桥锁定五年投资期的条件。而我们毫不犹豫地明确承诺，新桥会在至少五年内保持对深发展的控制权，希望我们坚定的态度能够平息谣言。", "媒体的嗅觉敏感。此时，不少中外媒体都开始猜测，新桥投资深发展一案已经触礁。2月14日，萧遂宁接受了一家国内媒体的采访，对美国《华尔街日报》上的一篇关于深发展交易遇阻的文章做出反应。萧向媒体表示，谈判仍以“健康、友好和正常的方式”进行。他的描述当然是为了平息舆论。按照他的要求，新桥也发表一个声明，表示谈判进展如常。但是媒体并不买账，光从标题就可以看出来。在萧接受采访当天，《上海新闻晨报》的标题是〈跨国恋扑朔迷离〉。其后，《粤港信息日报》在《价格分歧严重，深发展举步维艰》的标题下报道称：“深发展和新桥的婚约已陷入撕破脸皮的尴尬境地。”《中国证券报》质疑：“深发展，何日云开见月明？”同时，萧也接受了我的要求，以书面形式将深圳方面的新提案用传真发给我们，其中包括新的正式要价，为深发展2002年9月账面净资产的1.65倍。但是他的信又使事情复杂化了。他在信中说，新桥必须在七天内无条件接受所有条款，而深圳方面则不受价格条款的约束。我马上给萧打电话，说您要求我们无条件接受，但贵方却不受价格条款约束，这不是不讲道理吗？他无言以对。", "我们很难判断深圳方面是否还有诚意。要求对方接受自己的要求，接受之后，自己又可以随时改变要求。那我为什么还要接受，图个什么？这就像说，我要你无条件放下武器，但你放下之后，我保留一枪打死你的权力。我对他说，双方已经有了多轮磋商，签署了各种文件，还算不算数？他说，你说的那些文件，我很多都没有见过，无法评论。我说，这样吧，我把文件都给您复制一份，明天去深圳面交。他同意了。", "看起来，不让这个交易脱轨是愈来愈难了。", "次日，我驱车前往深圳。为了节省时间，我约萧遂宁在皇岗口岸深圳一侧见面。我们本来想找一个安静的餐厅或酒店，但口岸周围没有，就决定在过境大厅前的停车场见面。我俩在我的面包车里相对而坐，打开车门，清风徐来。那天天气很好，阳光明媚，温暖而不炎热。停车场很空旷，来往车辆不多，竟然是个闹中取静之处。", "我把手头上所有文件都给他整理出一套复印件，供他参考。这其中包括框架协议、净资产值调整协议和普华永道聘用协议、新桥对于定价的承诺函，以及深发展递交给央行的报告。萧一边翻阅，我一边给他解释文件的背景和来龙去脉。我希望萧能够通过这些文件理解我们的立场不是没有根据的。我说，“现在深圳方面要提价，但又不肯承诺会遵守自己的要价。如果我们单方面同意了，等于认可之前所有的协议都失效了。如果你们以后再变卦，我们就没有了任何契约的保护。这公平吗？”萧一边阅读文件，一边喃喃自语：“我的天呀！我的天呀！”他显然意识到，他被自己一方蒙在鼓里，他本来和我谈判的时候理直气壮，此时有些泄气。因为他此时明白了，所有这些文件对新桥来说构成了无懈可击的契约，深圳方面不是想放弃就可以一走了之而不承担责任的。这是他始料未及的。", "我也意识到，深圳政府的领导，可能也不完全了解己方根据这些文件需要承担的责任。这时萧开始替市政府担忧了，他知道如果深圳方面想退出交易，或者未经新桥同意更改合同条款的话，新桥有权去打官司。他口中喃喃，又像在和我说话，又像是自言自语，大意是看来新桥手中握有“重磅炸弹”呀。他大概不知道再说什么好，只是说他必须遵从市政府的指令，要求我们正式回复他的函，我们愿意怎么说就怎么说，但是一定要提及之前协议中的相关条款。", "回到香港后我起草了两封信。第一封是写给萧遂宁的，附上了我的合伙人唐开罗几天前发给中国信托的信。在信中，唐开罗警告中国信托，如果不立即停止干扰新桥与深圳的交易，新桥将对其采取法律行动。信中说：谨提请贵方注意，贵方与深发展股权出售方的协商妨碍我方完成在深发展的投资并干扰了我方独家交易的权利，我方将采取一切可以采取的法律手段捍卫自己的权利，其中包括但不限于在美国得克萨斯州对中国信托提起“侵权性干涉”诉讼。根据美国法律，如果被告（中国信托）有意导致第三方（深圳政府）违反了与原告（新桥）的合同，给原告带来了经济损失，原告可以发起“侵权性干涉 （tortious interference）”诉讼，要求索赔。唐开罗警告中国信托停止并不再尝试此类干涉行为，否则新桥准备对其发起诉讼。我们之所以打算在美国得州发起诉讼，是因为TPG和新桥的后台服务一包括财务会计—都设在该州，而中国信托在美国也持有资产并经营业务，受美国法律的管辖。而且，据律师们说，得州法院更倾向保护此类案件的受害方。致萧遂宁的函附上新桥给中国信托的律师函，一是为了向深圳方面表明新桥捍卫自身权益的决心，二是为了澄清新桥图谋将深发展转手给中国信托的谣言。", "第二封是我写给萧遂宁的公函，签署日期是2003年2月17日。我在信中写道，新桥和深圳政府双方签署了一系列具有法律约束力的协议，将交易价格定在2002年6月账面净资产值的0.8至1.5倍之间。我强调，新桥愿意接受区间内的最高价，即账面净资产的1.5倍。为了表示我方尽快完成此交易的最大诚意并顾及到贵方的一些切实考虑，我在此向您重申我在上一次会谈中所提出的价格提议：新桥准备接受双方已同意的价格区间的最上限，即深圳发展银行2002年6月30日的财务报表所反映的其净资产账面值的1.5倍。我们不是不愿意接受对方提出的1.65倍的价格，但是前提是对方也接受这个新的要价，但是萧遂宁死活不肯吐这个口，只是要求我们接受深圳的报价，而深圳方自己却不受此约束。这样，双方的谈判就陷入了僵局。深圳方面并不否认双方之前签署的协议等文件的存在和有效性，也没有说这些文件中的任何内容有误，但就是置之不理。", "我们知道，市政府内部有些领导支持与新桥的交易，有些持反对意见。", "如果我们在价格问题上卡住，那么只能给反对派以口实；如果久拖不决，只怕是有些支持的领导也不再支持，这样对我们更加不利。况且，布朗姆和庞德曼也说了：我们不该因为区区2500万美元价差，就困在原地，止步不前。经过一番内部讨论后，我们决定致函深圳方，正式接受1.65倍账面净资产的报价（以深发展2002年9月30日披露的财报为准），但说清该价格应对双方均有约束力。我在2003年2月21日致深圳市党委书记和市长的信是这么说的：新桥投资审查委员会紧急斟酌辩论了市政府的新报价和提议，决定在2002年6月各方所签署的转让收购协议及各附属协议的框架下，接受市政府的报价和提议，以此完成价格谈判。此决定并不代表新桥放弃各方之前所签署的各项协议的效力和权力，反映了新桥一以贯之与深圳市政府通力合作的诚意。", "信中关键的一句是，“以此完成价格谈判”。我们希望此信能打破僵局，推进交易。我们接受深圳方面的最新要价，也会给深圳政府内部支持新桥的领导注入更多信心。我想，深圳现在总没理由推三阻四了吧。", "信发出之后，我给萧打电话听听他的反应。他的态度仍然模棱两可，只是说事情“正朝着好的方向发展”。深圳方面会怎么出牌呢？没过几天，我们就知道了。听说，市政府开了会，参会的除了书记、市长，还有两三位副市长、副秘书长，以及周林。他们讨论了新桥的正式反馈，争论了一番，最后多数赞成与新桥继续推进，书记拍板做了决定。萧遂宁将政府的决定转达给我们。我们都感到欣慰。双方决定由新桥和深发展分别发表公告，回击关于交易遇到麻烦的传言。新桥在2月25日的公告中说，“深圳市政府与新桥关于深发展股权转让交易的谈判在如常进展，双方在转让价格上亦达成一致。”周林似乎也抛弃前嫌，与我们重归于好，亲自在公告稿中加上一句话：深发展自“年初就显示出了强劲的业绩成长态势”。一经发表，公告马上受到中外媒体的关注，记者纷纷来电要求了解详情。但新桥方面决定不予置评。价格敲定了，双方继续就其他细节展开谈判。2月26日午饭后，我驱车前往深圳，同行的还有唐开罗、刘伟琪和团队的新成员陈菲菲。在那里，我们和萧的团队开会，讨论了几个尚未落实的问题，包括新桥可以获得多少董事会席位，拟转让股份的具体数字，以及深发展配股筹资的具体时间表。双方达成共识：深圳将采取一系列措施，确保新桥拥有深发展董事会的控制权，任命大多数的董事，并有股权反摊薄的权利，以保证新桥的持股比例不低于17.9%。深圳方面还同意去做证监会的工作，批准深发展的配股方案，并在新桥入股之前完成募资。双方还同意，政府所控的几个实体应立刻将所持有的深发展股份存入托管账户，以便之后转让给新桥。这天会议结束的时候，我感觉很接近终点了。一周后（3月2日），我方律师给深圳方的律师发送了一份详细的条款清单，包括了近三个月来讨论的股权买卖协议基本条款。这些条款将体现在最终买卖协议中。", "深圳的律师三天后就返还了修改后的版本。双方又经过了三四轮的讨论之后，看来终稿又一次触手可得了。正当一切顺利的时候，突然出现了一个急转弯。从双方接触初始就有共识，新桥将获得深发展的控制权，这是投资的前提条件，深圳方面从来心知肚明，并反复向我们保证这正是政府的意愿。而且，就在几天前，萧遂宁还和我们讨论政府方面要采取哪些措施以确保新桥可以获得董事会的多数席位。深发展有17个董事席位，要取得控制权，新桥至少要能任命9名董事。但此时周林提出，顶多给我们8个席位。由于他是董事长，在其他董事的赞成和反对票旗鼓相当的时候，他的一票等于有最终决定权。我们再次强调，新桥拥有董事会的控制权是交易的前提条件。其实三个月前，我们也许会同意周林的建议，因为那时我们对他完全信任；但是此时，互信已经变成了互疑。对于他此时的建议，我们只能视为与我们争夺控制权，在交易进程中设置障碍。在这个意义上，我虽然自责失去他的信任，但后来也庆幸因此把控制权牢牢掌握在自己手中。如果当时没有发生矛盾，我们也许就不会如此在意，也许就会埋下隐患。经过一番你来我往，深圳方面最终同意给予新桥明确的控制权。其实，政府方面对于转让控制权从来没有保留，之所以出现波折，完全是因为周林。当然最终他还是要服从市政府的意愿。", "谈判重回正轨，眼前的障碍排除了，曙光再现。但是，另一条消息又让我们不安起来。我们听说，台湾中国信托的董事长辜仲谅近期拜访了市委书记、副秘书长等人。在会议上，辜仲谅提出，愿意以净资产2.5倍的对价收购深发展的控制权（而新桥和深圳方面议定的价格是1.65倍）。据说辜还讲了新桥坏话，说我们是短期投机者，还说布朗姆和庞德曼亲口告诉他，新桥压根儿没把这笔交易放在心上。这些当然都是胡说八道。但真相不重要，重要的是，市领导动摇了，想转而和中国信托签约。辜仲谅是否说了新桥的坏话我们无从证实，但在此关键时刻，事关新桥的声誉，我们宁可信其有，不可信其无，必须粉碎这些不实之词，保护自己的权益。我们反制的办法就是请布朗姆和庞德曼联名给书记和市长致函，重申新桥长期持有深发展的承诺，而非只想赚一笔快钱就跑路。这封信似乎起了作用，双方的团队并没有停下脚步。到了3月19日，新的条款清单接近定稿。一般情况下，各方会在清单上先签字，以锁定商议好的条款，并着手起草最终协议。但是萧还在等待政府方面最后审批能签字。不过他信心十足，说到了现阶段审批就是走个流程。他建议我们不要干等着，应该立即着手下一阶段的任务一起草最终的协议文本。次日（3月20日）传来美国入侵伊拉克的消息，第二次海湾战争打响。", "顿时，全球的金融市场陷入混乱。不过对我们而言，一切照旧。萧和他的团队正和我们密切合作，确定最终协议文本。3月25日，新桥的律师把第一稿发给了政府方审阅。", "与此同时，迹象表明，周林没有停止作梗。我们忧心忡忡，因为我们清楚，他之前能为我们牵线搭桥，此时就有本事给我们挖坑。我们配合萧的团队，加班加点，全力向终点冲刺，希望能够再快一点，以防夜长梦多。我们的担心不无道理。我们很快打听到，周日（3月30日），市政府的领导又召开了高层会议。会上具体发生了什么，我们无从得知，但是从东拼西凑的消息来看，领导们在是否和新桥签署最终协议上又产生分歧。最终市长定调，说深圳方面需要尽快和新桥达成交易。而周林在会上力挺中国信托，理由是出价更高。持不同意见的人说，竞拍过程早已结束，政府也已和新桥签了框架协议及各种文件，如果此时退出，有可能被新桥起诉。市长认同这个观点，说政府签署的承诺就必须遵守。但是周林表示不同意，说如果新桥起诉，他愿意承担责任，而且他还可以说，他代表政府签署协议时，未经授权。", "但不少人都知道，新桥的代表已经和书记、市长、副市长、市政府副秘书长等政府领导见过了。况且签署框架协议的时候，副秘书长也在场见证。如果说，市政府的领导对框架协议并不知情，也从未授权周林签字，很难说得过去。最后，会议还是决定和新桥完成最终协议。我们的耐心经住了考验，决心没有动摇，胜利在望。既然市政府正式决定与新桥完成交易，双方的律师紧密配合敲定条款清单的最终文本，同时推进最终协议的文本。到了4月中旬，双方已经确定了条款清单的终稿，准备签署。但是萧说，还要等政府走完内部审批流程，才能最终签字，这大概需要一周。", "后来我们得知，周林没有放弃支持中国信托取新桥而代之，中国信托更是不遗余力地争取，甚至表示，如果新桥真的以违约为由，对政府提起诉讼，中国信托将替深圳政府支付法律费用和损失赔偿金。我听说之后心想，中国信托的掌门人真是商人呀，以为什么都可以用钱买，连政府的声誉都是他们拿出几个钱来就可以不顾的吗？", "其实我和辜家很熟悉，我在沃顿教书的时候，辜家的几位大少都是那里的学生。我认识辜振甫先生，他曾是台湾和大陆对话的机构海峡交流基金会的董事长，他的家族控制台湾水泥（简称“台泥”）。几年之后，他这一脉的传人还请我担任过台泥的独立董事，可见关系很好。我、布朗姆、庞德曼和唐开罗也认识中国信托的辜仲谅。但为了争夺深发展，他们一点情面也不顾了，甚至不惜造谣中伤。中国信托的首席财务官来找我，说是想和新桥分一杯羹。此人是沃顿毕业生，见了以前的教授，非但不持弟子礼，而且言词颇为傲慢，表示不达目的绝不罢休。当时，正值中国各级政府领导层换届，深圳市政府也不例外。宋海去广州走马上任了，继任主管金融的新副市长陈应春初来乍到，并不熟悉深发展交易的所有背景，但他清楚这笔交易备受瞩目、不乏争议，所以谨小慎微。我不免担心，换了个新人，是否一切都要从头开始。没有等很久，在4月21日，陈邀请我和欧巍在市政府的餐厅里共进晚餐。晚餐之前，我和欧巍先去陈应春办公室和他见面。陈对我们表示热情欢迎。他个子高，身板笔挺，说话大嗓门。他留意到我盯着他办公桌上的一尊火炮模型，就告诉我，他是炮兵团预备役的上校，有时周末去参加训练，皇葱弥凭买.因饱秘品涨母本熄饮区鮤宝物钊隔量世鸡预盗檬盐贵国我不禁肃然起敬。他戴着一副黑框眼镜，文质彬彬，看起来更像是一名文官，而非武将。不过，我想他声音洪亮大概与当炮兵有关系：大炮轰鸣的时候，非得大嗓门不可吧。参加晚饭的还有萧遂宁和副秘书长余伟良。席间，陈谈笑风生。他说虽然市政府要谨慎行事，但与新桥完成交易的承诺不变。他的一席话，打消了我们的顾虑。", "此后，深圳方面的步伐加快了。萧遂宁建议，为了节省时间，我们跳过签署条款清单这一环节，直接准备签署最终的买卖合同。我们同意，随即请我方的律师发过去一份最终协议的文本。代表深圳方面在法律上把关的是政府的法务部门以及外部的君合律师事务所，他们修改了我方律师的文本，并于4月25日发还。到了这一步，万事俱备只欠东风了，萧要求我们准备好在五一劳动节之前签署最终协议。"], "wcount": 6790}, {"icon": "10", "title": "第十章 功败垂成", "paras": ["就在双方的团队都以为大功即将告成，情势突然急转直下。在预定签约的前一晚（2003年4月29日），萧遂宁打来电话，说时间表有变。他本来要去与副市长见面，但是副市长把见面的时间推迟到五一长假之后。是他还是市政府又有了别的想法？我们不得而知。萧从来守口如瓶，从他那里试探不出任何蛛丝马迹。我们还是通过自己的渠道去打听，到了深夜，我们大概摸清了情况。原来当天上午，市政府又开了会，议事日程上包括深发展的交易。在会上，有些领导又要推翻成议，重新考虑深发展的出售。整个事情十分蹊跷，据说首先发难的是陈应春，他在会上提议政府应同时与新桥和中国信托谈判。他和我们见面时，曾信誓旦旦地表态，说会履行与新桥交易的承诺，虽然我们知道没有上级领导的批准，他的话不算数，同样，我们估计没有上面的暗示，他也不会提出这样的建议。", "事态的发展令人心烦。市政府已与新桥谈判一年有余，双方签有框架协议，此时半路杀出个程咬金。虽然陈应春的说法貌似不偏不倚，但是他的意图明显是为中国信托开路。我想他的提议一定让与会的很多人感到意外，因为不久之前，市领导已经再次议决与新桥交易，此后双方还正式发表了联合公告，以消弭市场疑虑和传言，因此，双方的团队才紧锣密鼓地把交易文件都准备好了。而此时，陈却力挺改弦更张，而且说得如此云淡风轻，好像理应如此。", "可以想象，没有书记的首肯，副市长不会这么做的。我猜测，一定是周林说服了书记，转而支持中国信托。因此，陈的提议立即得到了书记的响应，也就不足为奇了。书记表示，如果两家公司开出的条件相同，应优先考虑新桥，这当然是为了体现表面上的公平。我们估计，这一整戏都是经过精心设计的，实际就是给政府态度转变做铺垫。在之前的一次会议上，市长曾经表态支持与新桥推进交易，此时风向突变，市长想必也感到意外，听说他反对陈的提议。书记认为，这个项目应该价高者得；市长则认为，政府既然已同意与新桥交易，就应该履行诺言，他也担心，如果政府违约，可能面临新桥的起诉。", "然而，最终决定权在书记手上，市长拗不过书记。", "此后，萧遂宁再次停止了与我们的合作。问他为什么停下来了，他说没有进一步的指示。除此之外，一问三不知。天津人有句俏皮话：一问三不知，神鬼怨不得。让人感到无奈。当我们了解到一些内幕之后，顿时目瞪口呆。政府内部，一把手和二把手之间出现这么大的分歧，实属罕见。书记态度的改变确实让我们黯然神伤，但市长如此坚持原则，甚至与顶头上司相左，也命我们颇感意外。从我们的角度看，原来书记支持，市长冷漠，此时市长支持，书记冷漠。一冷一热，我们都感受到了。无论如何，书记发话了，一锤定音。5月6日，我们收到深发展的一封律师函，说因为安排到期，新桥派驻的过渡期管理委员会已经被终止。这等于下了逐客命。看来市政府已经义无反顾地决定与中国信托谈判，周林也没必要再虚与委蛇了，他只希望我们赶紧卷舖盖走人。此时此刻，千言万语也无法表达我的心情。我不会轻言放弃，这时竟然心灰意冷。真是山穷水尽疑无路，下一步何去何从？我毫无头绪。当然，新桥所有的合伙人也深感失望。还有别的办法吗？几乎是没了。我们曾经暗示可能会采取法律行动，可是从来没有认真打算走这一步。通过法律途径向市政府施压，迫使其重回谈判桌上，似乎不太现实。在中国，鲜有“民告官”的成功案例，更何况是外资。但思索再三，反复讨论之后，新桥的合伙人还是做出一个决定，不能不战而降，还要想方设法挽救这个交易。我们仍想说服市政府完成交易。框架协议规定，双方应通过“友好协商”解决任何争议，如果协商不成，可以寻求国际仲裁。倘若我们决定申请仲裁，在这之前，我们还必须遵照协议，完成“友好协商”的过程。收到逐客令后，我起草了一封致市政府的函，署名人是我和唐开罗，在取得新桥两位联席主席同意后发出。信的名义收件人是萧遂宁，但实际上是写给市政府领导的，想达到两个目的：第一希望政府回心转意；第二也是为了立此存照，表明我们已经满足了框架协议先礼后兵的要求，争取友好协商解决争议，如果不行，我们有权申请国际仲裁。我们在5月6日的信中说：遗憾的是在过去的几个月中贵方对此框架协议多处、多次严重违约。我方曾在2003年2月12日双方正式会议时及此后向贵方多次指出这些问题，要求友好协商解决。但经过几个月的友好协商，贵方的违约行为并没有得到纠正。例如，贵方与台湾“中国信托”就深发展股权转让一事的接触完全违背了该协议…•另据“中国信托”称，是深圳市政府的代表主动与其接触的。如贵方所知，我方在2003年2月14日致函“中国信托”，警告它停止对贵我双方合同的侵权性干涉，我方亦告知其我方保留对其采取法律行动的权利.⋯贵方诸多的违约可以说都没有解决.因此，我方有权在任何时间诉诸包括仲裁在内的法律行动。敬请勿谓言之不预。除了警告，还有劝说：", "“重合同、讲信用”是已故周恩来总理制定的中国政府对外交易历来的准则，也是国际商业的基本行为准则。我方再次要求深圳市政府信守协议和诺言，尊重并认真执行贵我双方签订的包括该协议在内的所有协议，取信于外国投资者，与我方长期合作。但我们还是怀抱一丝希望：", "如果深圳市政府有意停止与“中国信托”就深发展股权转让一事接触，纠正违约的行为，以诚信执行与我方的协议并签署双方已经完成的文件，请立即答复知会我方为盼。", "这封信有中英文两个版本，抄送给了市政府的主要领导，包括书记、市长、副市长，等等。尽管我们希望政府领导能够重视我们的警告，但我们并不乐观。不得不承认，我们很可能与此次交易已经失之交臂。考虑到前期的付出，且成功近在咫尺，此次失败可谓惨痛，但看来我们已无计可施。在哪裹投资都不愿意与政府产生纠纷，更别说打官司了。但我们仍不愿意放弃。走到这一步，来之不易，虽然尽调结果证实资产质量确实非常糟糕，但我们仍然坚信如果任命懂行的管理层，采用世界最好的经营方式，创建严格的风控系统，可以扭转乾坤。若此时知难而退，不但前功尽弃，而且新桥的声誉也会受损。我们知道，金融行业的许多领导都希望此项交易成功，很多人将深发展引进外资和先进管理视为银行业改革的一次重要尝试。有些朋友鼓励我们要锲而不舍，有一位甚至说，“你要是不战而退就对不住国家。”其实这些朋友对于我们在投资上是否成功丝毫没有兴趣，但是他们对于银行业的改革十分关注，把深发展项目视为改革开放的晴雨表。", "新桥的合伙人经过深入讨论后，决定还要去拼搏一下。下这个决心并不容易，必须考虑后果，是否会影响我们在中国的业务。让我欣慰的是，包括庞德曼、布朗姆和唐开罗在内的所有合伙人都支持这个决心。我们决定从以下几个方面着手—首先，在美国得州起诉台湾的中国信托。其次，庞德曼致函温家宝总理投诉。庞德曼在信中说：我们非常遗憾地告知阁下，如下所述，深圳市故意违反了该交易下各方于去年签订、并已由中华人民共和国相关政府机关批准的有约束力的协议。虽然我公司在过去多个月中通过友好协商和讨论作出旨在解决分歧的巨大努力，深圳市仍在继续违反该已经签署的协议，同时向我们隐瞒了事实真相，以致给该交易的顺利完成造成了重大障碍。", "他在信的结尾写道：", "尊敬的温总理阁下，新桥是一家美国公司，我们的各方面的专业行为均严格遵守美国和中国的法律。我们也相信中国政府鼓励、支持并欢迎像我公司这样的国际著名公司参与到以诚信为本的中国银行业的改革之中。我们将保证在我们的投资完成后继续实施国际最佳做法。在过去的许多个月中，我们一直希望深圳市政府能够践行其所作的承诺，并履行其协议。但事实令我们非常失望。我们要做的另一件事是去北京向监管机构告状，请求支持。", "最后一步是国际仲裁。这是写入框架协议中的争议解决方法。我们希望尽量避免，除非最终迫不得已。就在此时，非典（SARS）疫情暴发。2003年3月底，疫情始于香港和广东，到了5月，已经扩散至内地。每天，香港都报道非典死亡人数。随着人数不断增加，整个香港人心惶惶。学校停课，街上空无一人。偶尔有人出门，也都戴着口罩，香港繁华的城市生活一下陷入停滞，一片死寂。数以干计的人感染，好几百人丧生。这是最艰难的时刻。好几个月之后，疫情才被控制住。疫情在5月份达到巅峰，除非必要，几乎没人外出。5月7日，我飞往北京，机上寥寥几名乘客，全都戴着口罩，因为害怕感染，几乎无人摘下口罩吃饭。", "我带了一大箱文件，其中有新桥和深圳市政府之间的所有协议以及深发展和市政府向上级政府提交的材料。文件箱很重，我只好用一辆可折叠式小车拖着。这些文件可以证明，新桥和深圳方面已经存在契约关系。", "北京大街上行人稀少。北京和香港一样，报纸、电视上每天报道最新死亡人数和新增病例。随着数字攀升，社交活动几乎全部中止。北京实施了严格的隔离措施，学校停课，一些公司也关门歇业。北京交通是出了名的拥堵，但此时也畅通无阻了。我去了银监会，接见我的是副主席唐双宁和司长南京明。我指着一大箱子文件对他们说，这些文件证明新桥和深圳有法律约束力的协议，但是深圳市政府违反了协议。我们希望能通过协商的方式解决；如果解决不了，新桥不排除提请国际仲裁。但我们希望不至于走到这一步，希望银监会能出面帮助解决争端。", "我说得很直白，但他俩似乎无动于衷，说，银监会不负责解决争端，只负责审查收购方是否具备相关资质。这就谈不下去了，我带了那么多文件，他们连碰都没碰。我满怀希望而来，垂头丧气地离去。我不顾染疾的风险专程来北京见他们，碰了一鼻子灰，铩羽而归。在北京我还拜访了其他一些官员。他们告诉我，如果书记和市长意见分歧，其他人很难掺和或站队。有的人对新桥遇到的麻烦表示同情，但也没有好的建议。看起来，事情能否有转机，只能寄希望于温家宝总理对庞德曼的信表态。深圳方面对于我和唐开罗的信无动于衷，非但如此，而且变本加厉。深发展5月12日发布公告，宣布终止过渡期管理委员会。暗斗变成了明争。于是，一个问题摆在了面前：要不要公开反驳？如果要，如何反驳？我的电话几乎被记者打爆了。最终，我们发布了一则简要声明，重申相关协议继续有效，且具有法律约束力，真诚希望深圳方面能够信守承诺，履行协议义务。你来我往的声明一出，媒体再次大做文章。对于媒体来说，无论好消息还是坏消息，有消息都是值得报道的新闻。中外媒体纷纷报道称，新桥收购深发展谈判破裂，英国的《金融时报》甚至把消息放在头版。当初框架协议公布颇为轰动，媒体报道称拟议的交易或将成为中国银行业改革的分水岭。此时谈判破裂，又引起了一波不小的骚动。而此次，市场将交易的失败解读为改革遭遇的一次重大挫折。新桥行事的作风是尽量低调，避开媒体的关注。这也是因为在投资行业，尤其在做大项目时，消息走漏就可能导致功亏一篑，因为竞争对手无处不在。如果深发展的交易没有变成公开讯息，也不会半路杀出个台湾的中国信托。但是这一次，想低调也不行了，我们已经成为媒体关注的焦点。", "新桥公开响应一定出乎深圳方面的意料。我想换了其他投资者，在这种情况下会黯然退场，他们一定没想到新桥会公开叫板，唱对台戏。首席谈判代表萧遂宁出面，想撇清市政府与此事的关系。他对媒体说，此次收购是深发展与外国投资者之间的商业交易，政府只是旁观者，并不干预。他的说法是欲盖弥彰，如果真是如此的话，那么怎么会轮到他代表深发展发言呢？毕竟，他本人是交通银行的高管嘛。媒体也不买账，因为他作为深圳市首席谈判代表的身份早已公开了。", "就在此时，萧约见。我本以为这是个积极的信号，可是我又错了。", "2003年5月13日下午三点左右，我和同事赶到深发展总部。萧要求先和我私下聊聊。摒去左右之后，他只说了一句话：在正式会议上，他会代表市政府的领导向新桥传话。我明白了，他的意思是说我不是来谈判的，只是个传声筒，在会上你不要反驳我，免得大家难堪。然后我们来到了大会议室，双方团队在会议桌前对面坐下。", "简短的开场白之后，萧说，市政府从未接触过第三方，也从未与中国信托谈判。此次交易是一个商业决策，作出决策的是持有深发展股票的几个实体，而非市政府。因此，市政府与此次收购毫无关系。", "他基本上重复了几天前对媒体讲的那一套。我想在场所有人，包括萧在内，都清楚这个说法根本站不住脚。这就是他为什么会提前和我打招呼，先堵住我的嘴，不要反驳。我也知道，此时此刻，多说无益。市政府的领导肯定认为，只要不承认政府是决策方，就算新桥诉诸法律，政府也能置身事外。", "我觉得这些手法有些蹩脚，甚至可笑，但又让人哭笑不得，应了一句成语：掩耳盗铃一自己捂上耳朵就以为别人都听不见了。我们手头上有政府决策的文字证据，这是无法抵赖的。", "我也不反驳他，而是从书包裹拿出一沓文件。第一份便是广东省呈北京的文件副本，文件的末尾说：“为此，我省人民政府同意深圳市的意见，特请示国务院批准同意深圳发展银行引进美国新桥投资集团公司作为战略投资者入股并相对控股。”我又给他看了另一份文件，其中写道：“（2002年）5月10日，深圳市委书记黄丽满、市长于幼军向朱镕基总理汇报了深圳在若干服务贸易领域率先对外开放，先行先试为全国探路的一些设想、思路和建议，总理原则上表示同意，并指示：要认真分析、权衡利弊，只要对深圳的建设发展有好处，对深圳提高竞争力有好处，对全国发展也有好处，确实是利大于弊的，就可以大胆探索试验。”文件最后说：“恳请批准引进美国新桥投资集团公司作为战略投资者入股深圳发展银行，并允许其相对控股。”这些都不是保密文件，而是与新桥收购深发展相关的往来信息，但显然萧和他的团队都没有看过，我曾给他看过其他交易文件，每次他都惊讶不已，不由得用他的口头禅喃喃自语：“我的天呀，我的天呀。”他也从来没见过这两份，压根儿不知道它们的存在。读完之后，能言善辩的他目瞪口呆，连“我的天呀”都说不出来了。他不知道，我们手中有多少文字证据，我们到底掌握多少筹码。政府方面否认参与了此次收购，想要脱身，但这些文件轻而易举地推翻了深圳方面的说辞。"], "wcount": 5598}, {"icon": "11", "title": "第十一章 背水一战", "paras": ["和深圳市政府打官司，我们犹豫再三，想尽量避免；对于插足的第三方，我们则毫不客气。2003年5月14日，新桥在美国得州对台湾的中国信托商业银行提起诉讼，指控其“侵权干涉”新桥收购深发展，要求其“停止并不再”干扰。各大媒体很快报道了此事，其中英文媒体包括《华尔街日报》、英国的《金融时报》、美国的《商业周刊》、香港的《南华早报》等等，有些还上了头条。中国内地的《财经新闻周刊》、台湾的《经济日报》等等中文报刊也有报道。5月23日，美国《商业周刊》发文，题为〈中国银行业的长城〉，小标题是〈新桥管理中资银行计划搁浅—提起诉讼，前所未闻之举。〉文章指出，新桥的挫败事关重大：", "这是一桩能够永久改变中国银行业的交易。2002年10月，美国新桥投资公司同意收购深圳发展银行控制权，中国政府乐见其成，甚至在收购的最终细节敲定之前，就允许新桥派管理团队进驻。中国的监管机构和银行家们似乎终于做好准备，允许外资控股，带领中国商业银行走向繁荣发展的新纪元。", "关于这场法律纠纷，记者报道如下：", "对于在华的外国投资者，即使再走投无路，一般也不会轻易走法律途径，生怕把关系搞砸了。可是，新桥这家投资机构却不按常理出牌。据知情人士透露：“深圳市政府还没意识到，与他们打交道的人有些疯狂。”那位知情人士不是别人，正是鄙人。这位记者打来电话，对我们提起诉讼表示惊讶，说：“在中国做生意，没有人敢告官。”我心说，深圳方面恰恰也是抱着这样的想法，以为新桥就此罢休。我不知道该说什么，脱口而出：“我们大概有些疯狂。”其实那时我们还没有告官，告的不过是插足的中国信托。但我们也没有排除不得已的时候告官，那就是破釜沉舟了。看上去，我好像整天光在忙深发展的事了，其实，我手里还有一堆新桥的其他工作要处理。我们起诉中国信托的同时，我在做去纽约出差的准备，目的是出席有关韩一银行的仲裁听证。", "2000年，新桥收购韩一银行时与韩国政府签署的合同规定，韩一银行对存量资产中的不良资产有权以足值卖还给政府，也就是向政府索赔所有历史遗留的不良资产造成的损失，如果双方就索赔额产生分歧，则可通过仲裁解决。由于索赔是连续三年，每年结算一次，每年都可能要仲裁一次。其实，韩国政府一直是严守合同的，但是赔偿用的是纳税人的钱，为了政治上的需要一对纳税人好交代，政府必须至少做出力争少赔偿的姿态，所以对于每年的索赔，都例行公事一样提请仲裁，而每次在开庭之前都与我方和解，基本上满足韩一银行的要求。尽管每年都要走一遍仲裁再和解的过场，但双方的关系依旧融洽，都是抱着专业的态度来解决问题的。2003年的仲裁庭设在纽约，作为新桥的代表，我必须出我于5月23日抵达纽约，入住了奥米尼.伯沙尔酒店 （Omni BerkshirePlace）。刚一入住，就收到了一通电话，来自中国银行新任董事长萧钢，他也兼任中银香港的董事长。他打电话来是因为我是中银香港的独立董事兼稽核委员会主席。他说，出事了，中银香港的总裁刘金宝被抓，接任的总裁和广北，正在从北京赶往香港。我大吃一惊，因为临行前刚刚与刘在中银大厦吃了晚饭。我问，刘金宝犯了什么事？萧钢说他也不知道，还在打听。", "中银香港的总裁被抓在香港是个惊天动地的大事，因为中银香港在2002年7月才刚刚完成重组上市，开了中资银行海外上市之先河，至今不过10个月。我在上市之前加入了中银香港的董事会，并担任稽核委员会主席。稽核（审计）委员会主席是个高风险的位置。因为就在两年前（2001年），美国最大的能源交易公司安然倒闭，引来了股民的集体诉讼，首当其冲的就是审计委员会主席和独立董事，被控有失察之责。此时中银香港总裁被抓，是否在任上有违规违法的行为，损伤了银行的利益，不得而知。如果有，稽核委员会也难辞失察之过。我无法睡觉了，马上电话召开稽核委员会的会议，对“刘金宝事件”展开独立调查。从那天起，几乎每天彻夜开会。我们还成立了一个特别调查委员会，除了稽核委员会全体成员参加，还请了香港大律师梁定邦担任特委会主席。纽约和香港的时差正好12个小时，香港那头天刚破晓，纽约这边夜幕拉开，我不得不连轴转。", "我出差完毕回到香港之后，对于刘金宝事件的调查仍然继续，一共搞了好几个月。最终稽核委员会与特别委员会都做出结论，没有在中银香港发现任何违规违法的事情，而且没有任何一笔私相授受的贷款，也没有对银行造成任何损失。我们将调查报告公诸于世，最终平息了市场的疑问。后来我们才知道，他的主要问题是在中国银行上海分行的任上发生，但他在香港也有违规的行为，只不过并未涉及中银香港本身。上市之前，在中银香港系统中，内地派来的高管的名义工资和实际工资有很大的差别，差额放在一个“小金库”中，这笔钱的归属并不清晰（但肯定不属于中银香港），有时用作员工福利活动的支出。在上市前夕，刘和其他几个高管把这笔钱分了，后来法院认定为贪污。但我认为他们多少有点冤，因为他们犯规的根源在于对某些高管实施的名实不符的薪酬制度。后来中银香港在独立董事的推动下采纳了名副其实的薪酬制度，从根本上杜绝了此类问题。", "刘金宝事件并非偶然。比如更大的一个案子是中国银行广东开平支行前后三任行长侵吞了4.83亿美元之巨，之后逃亡海外。此三人归案前后用了20年。如果不是中国银行在2001年全国联网之后发现巨大亏空，案犯还不会收手。多年以来，大小银行和金融机构的高管因为贪腐成为阶下囚的层出不穷，前赴后继。究其原因，还是因为体制上的缺陷，主要是银行内部缺少制衡和风控机制，因此可能监守自盗，中饱私囊，或者贪污受贿，私相授受，或者吃裹扒外，违规贷款。这些问题的存在也说明银行的改革迫在眉睫。奥米尼.伯沙尔酒店位于纽约市曼哈顿区的中心。我原以为，抵达后的第二天就去见律师，为仲裁案做准备。但美国律师们一时半会儿不肯见维覆尽空染人需先鸪堡希悲费：径准谨疑：奖平遥瘠路机品法签显量体，间或到中央公园去骑马。那时纽约有个马厩，在曼哈顿上西区，叫做克莱蒙特骑术学院（TheClaremont Riding Academy）。马厩有好几层，养的都是良种马，楼层之间安装了马匹走进走出的坡道，就跟几层楼的停车场一样。在那里，有经验的骑师就可以租上一匹马，骑着穿过繁忙的曼哈顿街区，混入车流之中，一直走进中央公园。我租了一匹马叫“浪人”，就是“日本浪人”的英文翻译（Ronin）。这匹马高大、矫健、俊美。马厩的管理员说，“浪人”晚上经常去纽约都会大歌剧院，客串参加演出，简直就是个明星。中央公园里有一个风景绝佳的水库，绕着水库是跑马径，在那儿跑马，非常惬意。", "《华尔街日报》的一位记者找到我，要采访我们就深发展打官司的事，我回答了她的问题。她又要拍照，我拒绝了。她知道我会在中央公园骑马，就派了摄影师，在我跑马的路上设伏。", {"img": "m14-1", "cap": "第十一章插图"}, "2003年5月纽约市曼哈顿区，笔者在马背上。", "后来文章发表在《华尔街日报》所属的《远东经济评论》杂志（Far EasternEconomic Review）上，插图是一幅跨两页的照片，显示我骑在高头大马之上，两眼发呆，一脸茫然，身后就是纽约的高楼大厦。大概那时我正在为手头的几件事困扰，心事重重。人在纽约，但是收购深发展的事仍是工作的重点。虽然双方基本上停止接触，但是我们在各方面的努力始终没有松懈。此时，我得知市长于幼军已调任湖南省任副省长。他是支持新桥的，如今他已调任，我们翻盘的机会变得更加渺茫。我还听说，银监会曾要求周林进京汇报深发展的收购情况，但市政府不让他去。看起来市政府态度强硬，寸步不让。", "我们的选项不多。即便能阻止中国信托或其他第三方插足，也无法强迫市政府把深发展卖给我们。我们当时并不知道，市政府转让深发展股权，是箭在弦上，不得不发，无法卖给第三方，最终还是要找新桥的，只要我们坚持，还是有希望的。但这其中的奥妙，只有事后才能看出来。", "我们对交易前景愈来愈不乐观。5月30日星期五，我在纽约与庞德曼共进早餐，他认为这笔交易已经无药可救。不得不说，我的感觉也差不多。起诉中国信托到底是否有用？我看得出来，布朗姆和庞德曼心裹没谱，其实谁也不知道。如果新桥和中国信托都无法如愿以偿，那我们何苦变成中国信托的冤家对头。做生意谁想树敌呢？", "但是，我们还是没打算放弃。我总认为，谋事在人，成事在天，所以我们只能尽全力去“谋”。如果自己放弃了，天也不会帮我们。我们知道，深圳和北京的不少领导，包括监管机构，对于新桥收购深发展的交易乐见其成。国内外的媒体也基本如此，这对于我们来说是鞭策。我们和市政府谈判破裂，甚至可能对簿公堂，但国内媒体对新桥的报道基本是正面的，至少是如实的，没有一家报纸指摘我们，这多少出乎我的意料，因为毕竟新桥是外资。可见国内的舆论也支持这个交易，外媒更关注的是此事对中国银行业改革的风向标意义。6月10日，《华尔街日报》刊登了〈新桥收购深发展触礁对中国改革的启示〉一文，比较如实地简述了此事的来龙去脉：5月中旬，深发展宣布终止与新桥的合同，收回了新桥管理银行的授权，但未透露具体原因。几天后，新桥在美国得州对中国信托商业银行（由鼎鼎有名的台湾辜氏家族掌管）提起诉讼，状告该银行明知新桥享有与深发展的独家谈判权，却仍与深发展谈判，妨碍了新桥的交易。这篇报道认为打破僵局的关键在于深圳一方，而新桥是在走平衡木，一方面想通过诉讼向政府方面施压，另一方面也想方设法不伤及政府颜面，而将其拉回谈判桌。报道还说：", "中国政府高层表示过支持新桥的交易。5月份，银监会主席刘明康证实中央政府赞成此项交易。但有些观察家认为，这种交易取决于地方政府，北京不会发号施令的。新桥方面称深圳市政府和深发展违反了有法律约束力的协议，如果无法完成交易，可能会对政府方和深发展提起诉讼。但知情人士透露，新桥似乎在竭力避免与深圳市政府正面冲突，而希望找到完成交易的途径。我们需要等待两个结果：一是对中国信托的诉讼，二是温家宝总理对庞德曼投诉信的回应。很快有消息了。2003年7月9日，我去银监会拜访了刘明康主席。一落座，他就说本来早就要约我见面，但听说我去了美国，只好等我回来。他说，中国驻美大使将庞德曼的信转交给了温家宝总理，温总理已委托负责银行和金融口的副总理黄菊了解此事，黄菊要求银监会针对庞德曼的信调查。刘主席想见我的目的是转达高层领导的反馈。", "央行和银监会都曾表示支持新桥收购深发展。但刘主席告诉我，根据两个监管部门的建议，温总理和黄副总理的正式表态将是：中央政府和监管机构都支持这笔交易，但归根结底这是一笔商业交易，产生的任何问题需要交易双方来解决。银监会已向深圳市委书记和市长表示，支持这笔交易。", "我还了解到，银监会通知深圳市领导，深发展管理不善，银监会将检查其经营状况。另外，要批准一家台湾银行接管深发展，“难度很大”。这是因为大陆和台湾的监管机构之间没有正式往来，因此没有官方机制来协调监管。我想“难度很大”是个委婉的表达方式，出自监管部门之口，那意思就是不可能。如果根本得不到监管批准，中国信托也就不可能对新桥构成任何威胁，但这并不等于说，深圳一定会请新桥重回谈判桌。", "我们仍然看不到深圳方面有任何松动的迹象。我们和深圳方面争执下去的决心也开始动摇。深圳方面似乎已经把新桥忘了，此时任命了深发展的新管理层，周林升任董事长，行长的职位由一位新人担任。", "有些知情的人士告诉我，深发展的交易已经黄了。在我们看来也是如此。但也有的人鼓励我们不要放弃。我们最终决定孤注一掷，背水一战。9月16日，新桥的律师根据框架协议的规定向总部位于巴黎的国际仲裁法院提请仲裁。我随即通知了深圳首席谈判代表萧遂宁。新桥提起仲裁后，市政府那边忙活起来了。深圳方面找了许多人从中调解，或对我们施压，想让我们撤诉，但没有一个中间人可以拿出一个打破僵局的方案。后来萧遂宁说，深圳方面对我们很恼火。这可想而知。", "他们传过话来，要求新桥撤销仲裁，说新桥先撤诉，深圳方面才会考虑恢复与新桥的谈判。而我们的立场是，双方回到谈判桌上之后，新桥自然会撤诉。结果双方都寸步不让。", "有些布朗姆的熟人联系他，想说服他使新桥罢手。其实，他认为打官司无济于事，但也不主张不战而退。别人劝他的效果适得其反，更使他坚定了斗下去的决心。有个中间人说，如果新桥把单伟建开除，深圳方面就会重返谈判桌。布朗姆断然拒绝。他是个有原则的人，不会因为一笔交易牺牲自己的合伙人。当然，他也没有那么大的权力，毕竟我们是个合伙人的组织。我知道，深圳有些人对我很有意见，认为我是新桥咬住不放的罪魁祸首。这样说倒也没错，但我和其他合伙人并非故意刁难，只是争取让交易重回正轨而已。走到这一步，我们是迫不得已。我表示，如果深圳愿意恢复谈判，我可以退出。如果这能挽救交易，我甘居幕后。到了2003年11月，深圳的立场开始软化了。有一天，我正在和欧巍一起吃午餐，他接到了政府副秘书长余伟良的电话。余提出一个妥协方案：他要新桥写封信，表示会考虑撤诉。我想，只要政府同意恢复谈判，写这封信是没问题的。信发出去之后不久，深圳方面表示，愿意与唐开罗会面。我们以为事情有转机了，至少唐开罗可以当面判断对方的诚意。", "但就在他起身前往深圳时，我们又接到讯息，说除非新桥先撤销仲裁，否则政府官员不会见他。看来，政府内部的强硬派又占了上风。但显然，政府内部意见有分歧。", "深圳方面起初不把仲裁当回事，大概以为我们虚张声势。后来又想迫使新桥撤诉，也没有达到目的。之后，他们打算干脆置之不理。最终，他们意识到躲不过去，终于聘请了律师，但这家律所好像完全没有国际仲裁的经验。仲裁庭要求深圳方在11月22日之前应诉，他们在截止期的前几天，才向仲裁庭请求将期限延长一个月至12月22日。仲裁庭驳回请求，只同意将应诉期限延长到11月28日。不久之后，大概是因为律师未能阻止仲裁程序，深圳方面解聘了这家律所，另请了一家，但也同样糟糕。譬如，根据双方协议的规定，仲裁的工作语言是英语，也许是因为深圳律所的英语不好，也许是因为他们想故意拖延，总之，他们用中文回复仲裁庭，且拒绝提供翻译文本。可以想象，这让不懂中文的国际仲裁机构非常不快，严词驳回。看着深圳的律师进退失据，我们不由觉得有些好笑，我心想，这样的律师只能给深圳市政府帮倒忙呀。"], "wcount": 5741}, {"icon": "12", "title": "第十二章 水到渠成", "paras": ["时光荏苒，不觉到了2004年，深发展交易谈判过程已近两年，我们还未打破僵局。然而春节后不久，一位监管官员告诉我，中央政府高层仍然强烈希望我们推进此项交易。他建议新桥的董事长致信中国领导人，表达对中国市场以及为深发展带来国际最佳经营方式的承诺。他还具体建议说，此信应该包括新桥的资历、新桥一流团队的介绍、在银行方面的经验等。另外，信应该提及深圳方面希望新桥撤回仲裁请求，新桥表示理解，也希望以友好方式达成交易。我们理解这是深圳方面传递过来的积极信号，他们大概想恢复谈判，但又要不失颜面，因此要我们采取主动。我们乐意配合，重获深圳的好感。毕竟我们的目的是做成交易，而非争个输赢。", "但事情也不是这么简单。深圳方面需要有个台阶下，但他们要搭的台阶很复杂。一家香港公司的董事长和我们取得了联系。此人是香港商界的名人，我们几个合伙人都与他很熟。他提出一个方案，由他的公司和新桥共同组建一个合资公司甲，各持50%股权，其下再设子公司乙；甲公司持有乙公司60%股权，新桥直接持有乙公司40%的股权，然后乙公司投资控制深发展。这样从表面上看，香港公司和新桥在甲公司的层面平起平坐，而甲公司控制乙公司，但实际上新桥直接和间接持有子公司70%的股权，是实际控制人。这位港商朋友说，深圳方面认为这个结构是可以接受的。这个结构可谓用心良苦，看上去是个很聪明的主意，但也许聪明过头了。我想深圳和这位港商对于银行监管不熟悉，大概没有考虑到，银行监管部门是否允许一家港商或任何非金融类的公司投资中国的一家银行，更不要说控制了。但谁知道呢，也许深圳方已经做通了工作，监管可以破例批准，以打开死结。", "2004年2月6日，我给那位港商写了一份备忘录，列出了新桥与深圳方面之前商定的所有条款，然后说：“如果交易包括所有这些条款，那么新桥准备完成交易•。”换言之，以他们的名义，做我们原来设计好的交易，几方各得其所。也是顾及深圳方面的敏感，我不便出面，对于关键问题，我只能和萧遂宁通电话非正式沟通。到了2月底，萧说，深圳方面准备让交易重回轨道，他本人也在想方设法使双方走出死胡同。鉴于对方意愿比较明朗了，新桥决定撤回仲裁请求。我将此决定告知银监会主席刘明康，他听了很高兴。新桥随即在2004年3月25日正式致函银监会，表示新桥已经决定撤诉。就这样，双方的纠纷算是结束了，我们希望这些表达诚意的举动可以得到深圳方的响应。", "就在我们以为重大突破就在眼前之时，那家港商变卦了，他们不再满足当少数股东，而要真正与新桥平起平坐。这让我想起了渔夫和金鱼的故事，一旦愿望满足，就有了新的愿望，得陇望蜀呀。这是个原则问题，我们表示无法接受。我们愿意与港商成为合作伙伴，但要改造深发展，新桥必须有控制权，否则我们丝毫不感兴趣，我们的立场从头就没有变。正当我们以为又无路可走的时候，港商突然通知我们不再打算参与。就这样，来得快，去得也快。我们想，他们要么不甘于做少数股东，要么认为离开了他们，新桥还是一筹莫展，还会回头接受他们的条件。但这时，深圳方面突然热络起来，表示出尽快完成交易的强烈愿望，也不再计较面子问题。要尽快成交，双方都不愿意让事情复杂化，双边交易最直截了当。我们兵分两路，明面上，欧巍和刘伟琪几乎每天都去深圳，和萧遂宁的团队落实最终合同文本。我在幕后与萧通电话解决交易中的重大问题。主要条款在深圳方面离开谈判桌前就已商定了，双方都无意重新再揭开这口锅。价格仍将是账面净资产的1.65倍。深发展最新公布的账面净资产约为40亿元人民币，按照当时的汇率，1.65倍约等于8.3亿美元。深圳将出售18%的股权给新桥，总价格约为1.5亿美元。萧一定是接到了市政府的行动号令，加快了步伐。他在4月1日说，双方应尽快签署最终文件，为此目的，新桥方应该放弃进一步尽调。他说，继续尽调会带来新的不确定性，深圳方面不愿意等了，只想一鼓作气完成交易。深圳方面这么着急，是好事，我们就怕他们再打退堂鼓。但是要求我们放弃尽调，使我们犯难了。新桥的过渡期管委会在一年前就被踢出深发展了，我们对于其后深发展的资产中又增添了多少不良资产，不得而知，如果不去了解清楚，一头扎进去，要承担巨大的风险。何去何从，我们一时拿不定主意。", "在新桥内部，就是否接受萧遂宁的要求展开了争论。先是唐开罗、欧巍和我三人开电话会议讨论。我和欧巍都一致认为，必须趁热打铁，尽快完成交易，不必再做尽调。我说，虱子多了不咬（意即感觉不到虱子咬_机：架暴晟乐生了双委一冬整银步击但尘点弃奈业深整儒鲍简腰咖是有必要进一步尽调，否则可能掉进无底洞。讨论了半天，莫衷一是。", "通常在这种情况下，听听庞德曼的意见会有帮助。当晚，我给他打电话，把情况告诉他。他思考了一下说，同意我的意见，如果必须在两者之间做出抉择，而不能两全其美的话，他宁可放弃进一步尽调，而不能失去完成交易的时间窗口。这事就这么定了。这一次，深圳方面需要获得银监会的批准才能与新桥签署最终文件。这时，周林也转而支持与新桥的交易了，也许他回心转意了，也许他看出来市政府已经下了决心。总之，他和萧遂宁一起去银监会争取绿灯。银监会只提出了一个要求，即新桥同意锁定至少五年的投资期。一年前，我曾向深圳方面口头承诺过，所以这不是个问题。但是我们的承诺是有条件的，这就是新桥必须拥有对深发展的控制权。如果失去了控制权，我们就不得不退出。", "5月12日，我与银监会的刘主席通了电话，他同意我们建议的措词：", "“在新桥能作为控股股东而行使所有权利的前提下，新桥将在五年内不出售或转让深发展的股份。”此外他也同意，银监会准许外籍人士担任深发展的董事长和行长。对于新桥来说，这一点也是至关重要的，因为我们希望聘任世界上最好的管理银行的专家担任这些职务，而无论国籍，这就不能排除外籍人士。银监会对此非但没有异议，而且也希望如此，因为银监会和新桥的目的是一致的，都希望把银行搞好，把最好人和经营方式引进来。当然最终人选还需要银监会的审批。", "到了此时，我们已经可以看到马拉松的终点了，深圳和新桥并肩冲刺。", "次日，即5月13日，人行宣布对深发展实行差额存款准备金率，要求该行在央行保留高于同业比例的存款准备金。存款准备金率是央行的一种货币政策。所有商业银行都必须在央行保留一定比例的存款，所以央行被称为“银行的银行”。如果存款准备金率提高，银行可用于放贷的资金就减少。因此，如果央行想收缩货币供给，减少银行系统中的货币量，可以提高存款准备金率；反之，想扩张货币供给，可以降低存款准备金率。通常，央行对所有银行或某一类银行规定相同的存款准备金率。比如，对大行的要求比小银行高。但央行对个别银行实施不同准备金率的情况极为罕见，要求某行的存款准备金率高于同行意味着降低该行相对同行的放贷能力，也就是给该行的资产扩张踩煞车。为什么对深发展区别对待？人行称深发展2004年一季度违规最为严重，“贷款增长过快”。该银行的贷款规模在此期间增长了60%以上。一个季度增长60%！给人的感觉是在撒钱。这些新增贷款有多少放给了信用不良的借款人，我们无从得知。可我们知道，深发展由于贷款增长速度太快，在2003年耗尽了流动性，不得不向央行寻求资金支持。自然，所有这些问题都让我们担心，如果我们不能及时入股，可能会回天乏术。我本来以为，虱子多了不咬。但此时不得不担心，虱子太多了也能把血吸干。最终文件的签署仪式定于5月29日（星期六）上午10时半在深圳举行。", "自从一年多前谈判中断以来，我就没有和周林交谈过。那天早上我给他打了电话，他听上去很高兴，我们重新合作，不计前嫌。正巧，他马上就要主持召开董事会批准新桥交易，他说董事会的批准没有问题。欧巍和刘伟琪代表新桥前往深圳签署最终文件。我留在香港，焦急地等待消息，祈盼别在最后一刻出现变故。一直等到下午12时半左右，我才收到欧巍发来的邮件，报告说所有文件都已签署。周林也打来电话，说一切都已按计划完成。", "与深圳方面的谈判就此落下了帷幕。从我第一次与周林会面，花了两年多的时间才走到这一步。但事情还没有完结，最终交割还要取决于一系列的审批。这个项目好像没完没了，何时才能到头，我仍然吃不准。", "尽管银监会同意双方签约，该交易仍需取得包括银监会在内几个监管部门的最终批准。能否获得所有的审批，仍然难以预料。但我希望最难的坎已经迈过去了。", "2004年5月31日（周一），我帮助起草的新桥入主深发展已经签约的公告在媒体上发表了。我们提前给《华尔街日报》的记者吃了小灶，所以当天早上深发展公告亮相的同时，该报的报道就抢先其他媒体出来了。", "这一消息又让市场吃了一惊，在中外媒体上引起了不小的轰动，因为市场早就以为交易天折了，谁知竟然起死回生。这笔交易两年前公之于众之时，让市场吃了一惊；过了一年，交易破裂，又让人惊讶；如今再见逆转。我希望事不过三，别再有变故了。我们一般不主动接触媒体。由于这个项目一波三折，其中不乏唇枪舌剑，甚至闹到了国际仲裁庭，为了避免触动敏感，我们更需要低调，与媒体保持距离。更何况，最终交割还有待于审批，还有大量工作要做，所以此时也没有什么可说的。但国内外媒体还是争相报道最新消息。英国的《经济学人》评论道：“外资对中国的银行首次收购将很难复制。”报道说：经过两年十分曲折的恋爱过程，从友好谈判，到遭遇违约，乃至难堪的国际诉讼，新桥投资，一家不甘于逆来顺受的美国私市股权投资公司，赶在世界上最大的金融机构之前，成为首个获得中资银行控股权的外国机构。汇丰银行、花旗集团、渣打银行、亚洲开发银行和世界银行旗下的国际金融公司也一直在竞购中资银行的股份。但到目前为止，只有新桥成功了。文章的末句说：“这是第一笔外资控股中资银行的交易，也可能是很长一段时间内的最后一笔了。J我们向人行和银监会提交了所有需要审批的文件，但等了两个月，仍然没有批复。我们搞不清楚为何要拖这么久，更担忧的是深发展的经营还是一如既往，仍在积累风险。签约后，我们将原过渡期管委会的成员派回了深发展，但没有再使用委员会的名称。和之前一样，新桥派驻的人员只是对呈报到总行信贷审查委员会的大额贷款有否决权，而无权审批也并不了解分行的贷款或该行可能承担的其他风险。所有迹象都表明，“一如既往”就是个问题。我们无法预料监管审批需要多久，虽然相信只是时间早晚。说来凑巧，负责审批的一位官员是银监会的南京明司长，他认识王骥，就是市政府当初指派的第一位首席谈判代表。他俩都是天津人。南司长知道王骥认识我，曾经与我谈判，就请王骥私下向我打听新桥对深发展的“真正用意”。他大概以为我们递交的报告都是官样文章，不足为信。能否信任新桥，把这家全国性银行交到我们手里管，他心中没底，所以请王骥来侧面了解。虽然我和王骥谈判时谈崩了，但双方不失相互尊重。他打来电话说明用意之后，我说，我给您写封信吧，把我们的想法告诉您，您可以转交给南司长。自打王骥不再担任首席谈判代表之后，他经历了不少坎坷。那时，他还是深商行的行长，但后来，听说因为得罪了领导，被解职不说，还因涉嫌腐败接受调查。然而经过调查，他被宣告无罪。被控之后又被认定是清白的，极其少见，几乎闻所未闻，可见其操守无可指摘。但他的职业生涯已然被毁，连工作都没有了。", "7月31日，我给王骥发了一封邮件，答复了南司长的若干问题。信是写给王骥的，这样我可以不必客气，直言不讳。我写道：担的地步。我们已经有一年多的时间对这家银行的内部状况一无所知，而在这一年当中，它的新增贷款大幅度增长，以至资本金严重不足，甚至出现流动性的严重问题不得不向人行拆借，而在这种受银监会和人行双重严格监督之下，它居然在今年又大幅度“跃进”，成为全国商业银行新增贷款之最，以致人行不得不对其强加差额准备金。在股东明确的情况下，这个银行的管理都是如此铤而走险，在两个股东转让的过渡期，其风险之大，可想而之。恐怕不是银监会训筋一番就可以控制住的。以我之愚见，这个银行恐怕是不能再糟了，已经完全搞砸了：在任何其他国家，它早就破产而被国家接管了。以其不良资产的规模，它的账面资本金本来就已经是自欺欺人的笑话。人行的流动支持使它得以维持。", "了解了这个情况，对于任何没有银行投资管理经验的国际投资者，不要说付12亿元人民币，白给他都未必敢要。我们之所以敢要而且敢于付如此价钱，就是因为根据我们的经验有相当的把握。", "我的信得到了南京明的好评，他告诉王骥，我说得“不错，有道理”。", "我松了一口气，期盼早点获批。", "但事实再次证明，我过于乐观了。银监会显然认为，此项目影响太大，必须由国务院拍板。要国务院审批，可能增加变量，而且时间也短不了。到了2004年8月底，银监会仍在不断发函询问新桥在美国监管机构是哪家，为什么新桥没有涵盖其所有被投资企业的合并财务报表，以及我们持有深发展股份的实体将注册于何地。我解释说，在美国没有专门机构监管新桥类非银行金融公司；新桥没有合并财务报表，是因为新桥每期基金的有限合伙人可能不同，无法合并。最后，新桥是一家在美国特拉华州注册的公司。国务院会批吗？我不久听说，人行行长、银监会主席、主管银行和金融口的黄菊副总理都表示同意，但还需要总理的亲笔批示。新桥派驻的贷款把关团队很快发现了一笔非常可疑的贷款，金额高达15亿元人民币，几乎是刚刚发放就成了不良贷款。2004年底深发展的账面净资本只有区区40多亿元人民币，仅这一笔不良贷款，就占了银行资本的35%以上！在世界其他市场，这样一笔坏账可能会使整个银行倒闭。这笔贷款的对象是个新成立的公司，贷款的目的据说是要在农村建设互联网，但该公司没有任何资本，也从未从事过相关的业务。当我们发现这笔贷款时，借款公司的股权已经转让，变成了一家房地产开发公司，而且大部分借来的钱已经不知去向，新股东说收购股权的时候大部分资金就已经没有了。虽然我们还没有入主深发展，却立即组织催收这笔贷款。我专门给这笔贷款起了一个代号，叫做“又大又坏”（Big and Bad或B&amp;B），取自于童话故事又大又坏的大灰狼。", "但我们很快就发现，收回贷款的希望渺茫。入主深发展之后，我这个股东代表亲自披挂上阵，找借贷公司的新股东反复谈判，其后，深发展又打了十几年的官司，直到新桥退出多年之后，这笔贷款的本金 在2015年6月勉强收回。毫无疑问，“又大又坏”使某些人发了横财一不义之财，但我们始终无法查清谁是真正的受益人。不懂如此，让我觉得十分无奈而且哭笑不得的是，我们追到的每个人都抱怨自己是受害者，因为他们接手借款实体之后，都发现得不偿失。", "对于深发展而言，“又大又坏”是个特例吗？很难讲。在我们尽职调查的过程中，发现了很多在过去多年之中产生的不良贷款，只不过金额巨大，莫此为甚，而且做得肆无忌惮，连审贷的记录都缺失，让人触目惊心。银行的钱就这么撒出去了，而且雁过无痕，无法追踪。可以说“又大又坏”是体制改革前银行业状况的一个缩影。政府作为股东基本缺位，银行为内部人控制，几乎母须向任何人负责，也无人问责。结果是，决定银行资产质量的是放款人的良心，其次才是能力。当然，有很多优秀的银行从业人员，但几粒老鼠屎就可能坏了一锅粥，根本原因是制度缺失。", "已经很难，而改造一个银行体制则是难上加难。但当时中央、央行以及银监会的领导知难而上，不遗余力，银行体系的改革相当成功，此乃国之大幸。正因为如此，到了2008年，美欧的金融风暴席卷全球，而中国的银行体制岿然不动，全赖几年前的改革成功。即便如此，在离交割如此临近之时发现了那笔“又大又坏”，还是令我们大跌眼镜，在新桥内部引发了颇多争议。我们本来想等到深发展完成配股增资之后再交割入主，此时则决定一旦获得国务院的批准，就立即完成交割。刻不容缓，拖得越久，银行和股东承担的风险就越大。萧遂宁了解深发展面临的各类问题，其中包括“又大又坏”。2004年11月29日，他在自己的办公室会见了我。经过一番讨论，他和我就以下三点达成共识：首先，针对“又大又坏”等不良资产，深圳方面向新桥提供适当的补偿或担保；其次，深圳方面将出售该银行股份所得款项的一部分借给新桥，用于认购该银行后续发行的新股，包括配股计划，以确保新桥的股份不被摊薄；第三，深圳将用收到的其余款项，购买深发展发行的30年期可转换债券，其转换权转让给新桥。", "可转换债券的持有人可按约定的行权价格，将债券转换成发行公司的股份。债券持有人若不将债券转换成股票，就可在债券到期后收回本金和利息。转换权通常与债劵捆绑在一起，但也可以分开。我们提议政府持有债券，而将转换权交给新桥，这样新桥就可选择按照行权价，购买更多股票。", "虽然萧认同我的提议，但说需要得到市政府的同意。然而，他的语气让我感觉他并不抱希望。最终，我们什么也没有得到。在等待最终批准的期间，我们把全部精力都放在深发展的风险控制上，生怕再产生“又大又坏”。我们指示过渡管理团队在收购完成前，除了正常类贷款可以到期酌情展期外，不再发放新的贷款。这不过是暂时止血的措施。到了这个时候，我们的竞争对手仍然穷追不舍。12月3日，我们听说，平安保险集团向市政府表达了收购深发展的兴趣。这使我想起了钱钟书的讽刺小说《围城》。他的故事将婚姻比喻成一个城堡，城墙里的人看到的都是问题，拼命要逃出来，而城墙外的人想象的都是好处，拼命要钻进去。新桥此时进了城，每天要解决层出不穷的问题，但城外的人都以为我们中了大奖，拼尽全力要挤进来。我们既要忙着亡羊补牢，又要提防有人虎口夺食。"], "wcount": 7049}, {"icon": "13", "title": "第三部分 脱胎换骨 · 第十三章 任重道远", "paras": ["望穿秋水，终于收到了所有批复。交割日定于2004年12月30日星期四。整个交易过程，从头到尾，耗时30个月，两倍于我们花在韩一银行收购上的时间。比之韩一银行，深发展的谈判内容和交易结构要简单得多，不过就是股权买卖而已，但我觉得压力大得多，因为有那么多的跌宕起伏、一波三折，乃至得而复失、失而复得，其间充满了不确定性和交替而来的希望和失望。终于要交割了，大家都如释重负而且倍感欣慰。这的确是一个史无前例的交易：在共和国的历史上，还从未有外资控制中国的一家全国性银行。", "但交割日平淡无奇，甚至无声无息，没有任何仪式。资金和股票过户由新桥财务部门处理了。那天，我远在马来西亚，最后一次主持韩一银行的董事会。在经过五年改造和增长之后，新桥已经签约将这家韩国银行卖给渣打银行。在2004年的最后一周，我们办成了两件大事，正式入主深发展，几乎同时退出韩一银行。新桥不愧为改造银行的专业户。", "为何不庆祝一下呢？说实话，当时我们都没有想到这个问题。原因很简单，一个是到了此刻，我们已经有点麻木了。在过去几个月，各种迹象表明成交已是铁板钉钉的事，只是时间早晚，所以当这一天终于来到时，兴奋劲已经过了。其实不光是我们，就连媒体也是如此。签署最终协议时大量报道，但到了交割的时候，媒体几乎没有关注。而且，获得深发展的控制权固然不易，但我们入主以后的道路更加艰难，任重道远。", "我记得当初与韩国政府艰苦谈判了15个月，终于签署最终合同之后，我给庞德曼打电话报喜，他说：“祝贺。真正棘手的部分开始了。”我笑了，回答道：“说得没错，既然杀了，就得吃掉它（Now that wehave slaughtered it, we will have to eat it）。”这是美国人的一种表达方式，直译成中文有些蹩脚，也许不知所云，其实意思就是既然捕获了，以后伺候和调教就是我们自己的事啦。事实证明以后的路更难走。", "改造韩一银行的过程艰难困苦，但我们最终取得了很大的成功。我期待深发展也能如此，尽管我们知道深发展的问题复杂得多。新桥需要组成新董事会、新的管理团队，包括更换董事长和行长。除了新桥合伙人之外，我们还聘请了一批成就卓著的专业人士来担任董事和监事。在美国和香港，上市公司只有董事会，没有监事会，而中国的上市公司两者兼有，类似一些欧洲国家。监事的职责是确保董事会按照既定的规则和条例履行职责。监事会权力通常不如董事会大，但意见在决策中仍具份量。银行里最重要的职位是行长。面试了数字候选人后，我们决定聘请韦杰夫（Jeffrey Williams）先生担任这一要职。他是美国人，能说一口流利的中文。他身材高大，举止温和，履历无可挑剔一拥有哈佛大学的学士和硕士学位，在花旗银行、美国运通银行和渣打银行有多年工作经验，主要在台湾，也在大陆工作过。我们需要一个熟悉国际最佳经营方式的人，当时很少有本地的银行家够格。而要找到一位能说流利中文的外国银行家，无异于大海捞针。我觉得韦杰夫人才难得，其履历经验近乎完美。只有庞德曼有一丝隐忧，因为很难判断此位候选人是否有改造问题银行所需的铁腕。", "我邀请蓝德彰博士（Jack Langlois）担任董事长，他和我曾在摩根共事过。他是一位饱学之士，专门研究中国历史，尤其是元、明两代历史的专家。碰到一个洋人，比我还熟悉中国某朝代的历史，让我自愧不如。", "他在普林斯顿大学获得博士学位，加入摩根之前，曾担任鲍登学院（Bowdoin College）历史系主任。作为一名历史学家兼语言学家，蓝德彰的中文功底比不少中国人还好，且操一口标准普通话。记得有次摩根的董事长来访，在北京人民大会堂举办答谢晚宴。当时北京人习惯在6点钟就开晚饭了。到了8时半左右，客人已经离开，蓝德彰走到我的桌子旁，开玩笑说：“如何都作鸟兽散了？”我听了哈哈大笑，佩服他的中文功底，用这样的表达方法，中国人中都不多见，他的中文造诣可见一斑。而且他的日文也同样流利。当时，蓝德彰在摩根士丹利于中国设立的一家机构工作。虽然深发展董事长是一个非执行职位，不是全职，但他仍需取得大摩高管层的许可，而大的投行一般不允许雇员兼职的。怎么办呢？事有凑巧，机会来了。", "2004年10月26日一早，蓝德彰打电话告诉我，大摩的董事长兼首席执行官裴熙亮（Philip Purcell） 到访北京，将于上午9时与央行行长会面。我看了看手表，已经8时45分了。我赶紧给央行行长办公室打电话，也是运气好，居然就打通了。我请行长帮助游说裴熙亮，允许蓝德彰担任深发展董事长。", "我想，如果中国央行行长直接要求的话，裴熙亮大概很难驳这个面子。", "果然，三天后蓝德彰来电，说摩根士丹利批准了。", "在这里加一点花絮。李光耀先生也曾是摩根银行国际顾问委员会的成员，也参加了那次蓝德彰说客人早“作鸟兽散”的宴会。与李光耀伉俪同桌的有我和内人，还有当时的治金部长刘淇等人。席间，李先生说，“一个人三十年之内从贫到富不难，一个国家三十年从贫到富非常难。”当然他讲的是在他的治下，新加坡在三十年之中，从极度贫穷变成了发达国家。李光耀和新加坡的成就，有目共睹，但我忍不住问他，“国务资政，在这三十年当中，您有没有犯过错误？”那时李已经从总理职务上退了下来，担任国务资政（Senior Minister）。在座的谁也没有料到，他不假思索地说：“有。”此言一出，出乎意料，大家都竖起耳朵。他接着说：“我们过早地解放了新加坡的妇女。”他这么一说，我太太不干了。她是个北京人，直性子，多少有些口无遮拦，说，“您怎么能这么说，这不是性别歧视吗？”我偷偷看了李夫人一眼，她只是笑，一言未发。", "李先生讲，“你不明白。中国人几千年的传统不是一朝一夕就能改变的。中国的女人不愿嫁给不如她的男人，中国的男人不愿意娶比他强的女人。我们解放了妇女，让她们接受高等教育，结果我们造成了一个社会问题：很多受到高等教育的妇女嫁不出去。”我觉得他说得有道理，当时在摩根我的部门工作的几个中国女孩就没有结婚。我太太还没完，争辩说，“如果我没受过教育，一天到晚在家里呆着，百无聊赖，可能就跑出去搞婚外情，这不是也造成社会问题吗？”李先生说，“你这么说话，是因为你受过教育，如果你没有受过教育，可能连想都不敢这么想。”满座哄堂大笑。", "李光耀先生就是个很直率的人，有什么说什么，少有顾忌。", "比如有一次我和他散步时问他，新加坡为什么把工业园区设在苏州，而不是当时也在竞争的烟台。他说，中国科考制度时，三分之二的进士都来自江浙，所以新加坡投资的工业园区要设在人聚集的地方。他还说，新加坡之所以能够发达起来，得益于1960至70年代中国比较乱，没有集中精力搞经济建设，否则根本没有新加坡的机会。为什么呢？因为新加坡华人的祖先下南洋，都是去干苦力讨生活的，而最好的人留在中国，所以中国才是人荟萃之地。如果中国搞经济建设，新加坡是难以匹敌的。他说正因如此，新加坡决定从中国引进人，方式是给优才生以奖学金，到新加坡去留学，条件是学成之后必须在那裹工作几年。", "若干年之后，在我参加的一次会议上，李光耀和基辛格在台上对话，李很骄傲地说新加坡的中学生获得了若干名数理化的奥林匹克大奖，而获奖者除了一名之外，都是中国大陆来的留学生。", "他说一个国家三十年从贫到富非常难这番话的时候是1994年，现在30年过去了，中国已经从贫穷变成了中等富裕的国家，而中国的人口规模，是新加坡的200多倍，发展到这种程度，又不知比新加坡困难多少倍。", "中国的成就之伟大，印证了李光耀的话：中国如果集中精力搞经济建设的话，其竞争力可以超过任何国家，因为中国有人。我们要改造深发展，也需要最好的人才。", "言归正传。", "我们还邀请了另一位经验丰富的前摩根银行家约翰.奥尔茨（John T.Olds）加入深发展的董事会。他曾在摩根工作了二十多年，甚至竞争过董事长席位，失利之后应新加坡前总理李光耀聘请，担任星展银行副董事长兼首席执行官。他在任职期间，大幅改善了星展的运营和盈利状况，因此备受赞誉。我认为他的经验，特别是在管理亚洲银行方面的经验，对我们极有价值。", "我们邀请的董事会其他成员还包括法兰克. 纽曼（Frank Newman）和米高. 奥汉仑（Mike O'Hanlon）。两人都是资深银行家，和新桥团队长期密切合作。纽曼在1980年代曾任美洲银行的首席财务官，那时就认识了布朗姆，在1990年代他担任信罕银行的董事长兼首席执行官。奥汉仑当时是雷曼兄弟（Lehman Brothers）金融服务部门主管，曾经带领团队为新桥收购韩一银行提供顾问服务。他们两位都曾被新桥任命为韩一银行的董事，勤勉敬业，思考问题深思熟虑，发表意见直言不讳。", "我的同事唐开罗、欧巍和戴德时（Tim Dattels）也加入董事会。戴德时曾任投行高盛亚洲主管，后加入新桥任合伙人。根据与市政府的默契，我没有立即加入董事会，保持低调，但这并不妨碍我和董事会成员及管理层的互动与合作。虽然我在深发展内没有头衔，但我对此项投资深感责任重大，几乎每天都参与重要决策。", "人行和银监会的领导都殷切希望我们迅速改善深发展的经营状况，也给予我们大力支持。2004年12月23日，在交割的一周前，我与银监会主席刘明康通了电话。他说，监管部门都清楚深发展内部的问题和潜在的风险，所以，“如果新桥竭尽全力，将深发展的局面彻底扭转，我们不会忘记给你们记一功。”我当天的日记里记录了他接下来说的话：你们团队查出深发展内部的诸多问题和风险。如果有需要，人行金融稳定局会提供流动性支持。如果深发展总行层面出现困难和问题，请向我们报告因为深发展是上市公司，所以银监会和人民银行将配合证监会提供政策支持。刘明康所说的政策支持是指增资配股等需要证监会和银监会审批的事项。他接着说：关于牌照和许可证，我们将给予适当的宽限，合情合理地采用软标准和新标准，帮助深发展渡过困难期。在此点上人民银行和银监会有共识，愿意提供帮助。作为一家靠近边境的全国性银行，你们可利用香港的资源，成为改革开放的桥头堡。你们要有独立、能干的新团队、新人、新思维。请与市政府保持密切合作。", "开设新分行和提供新产品需要牌照和许可证。对于资本不足或管理不善的银行，监管当局通常不会允许其扩张。但就我们的情况而言，监管部门很清楚深发展的问题，渴望看到局面扭转。他所说的软标准，也就是说监管适度网开一面，帮助深发展摆脱困境，使其可以用增长来解决诸多的问题。", "刘明康英语流利。这时，他突然改说英语：", "“请告诉你的合伙人，一旦发生任何紧急情况，比如银行挤兑，人民银行和银监会将随时准备提供流动性支持。”为什么说英文呢？我的理解是他希望我能向新桥的美国合伙人准确转达银行资本充足率的最低要求是8%，而深发展在2004年底披露的账面资本充足率不过是2.3%，而真实情况是负数，如果没有监管宽限，深发展在此刻就要关门。在中国的银行业，深发展并非唯一资本金不足的。他补充道：“我们还会向广东发展银行提供一揽子救助计划。直到银行系统整顿完毕才能皆大欢喜。”不过，刘明康说，不要让深发展的管理层知晓这种隐性监管支持，否则他们会失去解决问题的紧迫感。", "刘的话充分反映了监管部门对深发展状况的担忧。他们会尽力帮助深发展，但需要我们尽一切努力扭转局面。如他所言，监管当局面临着改革和清理整个银行体系的艰巨任务。深发展并非唯一陷入困境的银行，但可能是链条中最薄弱的一环，一旦出问题，可能产生难以想象的连锁效应。无论是对于新桥投资，还是对于监管部门，救治深发展都是一场输不起的苦战。过了新年就是2005年，中国银行业改革的新时代打开了。深发展率先成为第一家，也是唯一一家由外资接管控制权的全国性银行。接下来的两年里，中国五大商业银行中的四家（中、工、建、交）完成重组，各自从全球顶尖银行中引入战略投资者，并在香港证券交易所成功上市。", {"img": "m16-1", "cap": "第三部分插图"}, "2005年1月25日，笔者在新桥入股深发展酒会上致词。", {"img": "m16-2", "cap": "第三部分插图"}, "2005年1月25日，新桥入股后深发展的首任董事长蓝德彰致词。", {"img": "m16-3", "cap": "第三部分插图"}, "2005年1月25日，中国人民银行行长周小川在新桥入股深发展酒会上致词。", {"img": "m16-4", "cap": "第三部分插图"}, "2005年1月25日，TPG董事长兼新桥联席董事长庞德曼与笔者在新桥入股深发展酒会休息室。", {"img": "m16-5", "cap": "第三部分插图"}, "2005年1月25日，新桥入股深发展酒会上，从左至右：欧巍、蓝德彰、韦杰夫、庞德曼、布朗姆、周小川、唐开罗等人。右起第二位是笔者。"], "wcount": 4992}, {"icon": "14", "title": "第十四章 百废待兴", "paras": ["新年伊始，万象更新，我们充满希冀，也心怀焦虑。深发展有了新的董事会、董事长和行长，预期会有更多变革。但是，改变什么？如何实施？谁会受影响？尚且无人知晓。深发展改造的重担落在新行长韦杰夫的肩膀上。", "出师不利。2005年2月初，距我们取得控制权不过一个月左右，我就向韦杰夫抛出了一个严峻问题：“1月份存款为什么减少了30亿元？”我当时和他一起看财务报表，发现存款锐减。这让我很不安。深发展资本严重不足，不良贷款太多，就靠流动性一也就是源源不断的存款一赖以维持经营。如果存款下降，流动性枯竭了，深发展就危了，挤兑可以造成银行倒闭。所谓挤兑，就是许多客户在很短一段时间内争先提取存款。", "韦杰夫镇定自若。他解释道，存款下降是季节性的，受年初假期的影响（2005年春节落在2月9日）。他打包票，下个月存款一定回升。但事与愿违，存款在2月份继续下降，而且速度加快，此时已经流失了70亿元。", "我台心如焚，提醒章杰夫，深发展资本金严重不足，就靠存款带来的流动性支撑着，存款下降危及生存。当然，万不得已，可以向央行申请流动性的支持一向央行借钱。但谁都知道，上了央行的救命机，就很难下来了，因为市场都会知道我们有麻烦了，大家避之犹恐不及，谁也不敢与我们做生意了，同业拆借一银行之间相互贷款一也会枯竭，那就等于倒了，只能等着央行接管了。这是天大的事，必须危机处理。韦杰夫依旧泰然自若。他让我放心，用不了几个月，存款都会回来。我希望他是对的，但我警告他，100亿元是红线，如果存款流失突破了100亿元，深发展将岌岌可危。", "3月2日，我接到报告，存款流失已达103亿元。恰巧那天唐开罗打来电话，他也忧心忡忡，他还不知道存款流失已经到了濒危的程度，他说一想到那笔“又大又坏”，就夜不能寐。我告诉他那还不是当务之急呢。", "整个情况使新桥团队都惴惴不安。我们好不容易取得控股权，才两个月，深发展居然面临危机。我和几位同事又与韦杰夫详谈了一回，他仍然是不慌不忙。我都胡涂了，不知道是他过于乐观，还是我们过于悲观。我完全无法判断他的底气从何而来。", "我问他，银行的高管中，谁负责分行和存款业务。", "“我负责。”他答道，“没有别人。”此时我才发现，他还没有创建起一个真正的管理团队。我大吃一惊。深发展是个全国性的银行，当时约有200个分支行，分布在全国的主要省份，员工超过7000人。俗话说，一个好汉三人帮，一个篱笆三个桩，他一个人怎么能管的过来，如何能不顾此失彼？我问他为什么没有一个管理团队。“我不知道能信任谁”，韦杰夫解释说，“人人都说别人不是好人。”他说得也不错。接管深发展之后，我每天都接到告状信，不是说这个人监守自盗，就是说那个人以权谋私，还有任人唯亲，德不配位的，不一而足，让人眼花缭乱，难辨真侨。韦杰夫刚加入，又是个外国人，如何分辨孰是孰非、孰好孰坏？难怪他谁也信不过。但是他的这种管法不是坐以待毙吗？亡羊补牢犹未晚也，但一刻不能等了。经过商议，新桥的合伙人决定立即采取行动。章杰夫曾在几家全球顶级银行任职，资历无可挑剔，但他的职业履历都是在好银行，没有改造问题银行的经验。在好银行工作，只要循规蹈矩、按部就班，照既定方针办就行了。但是深发展是问题银行，急需拨乱反正，彻底改造，他就束手无策了。这就好像一个专业司机可以把车开得很好，但是如果没有修过车，那么抛锚之后可能一筹莫展。", "我们需要的，是有领导问题银行转型经验的人。没有这样的人掌舵，深发展就可能要搁浅。我再次拜会银监会主席刘明康，告诉他深发展的情况极为严峻，新任行长不行，需要换人，换一个有改造问题银行经验的人。他听了之后很吃惊，面容严肃地说：“伟建，自打中华人民共和国成立，这是我们第一次批准外国人担任全国性银行的行长，这是件大事，国务院特批的。还不到三个月，你们就要换人，这个影响太大了，使不得。”我说，我也知道这是个大事，我们也不想临阵换将。但是深发展已经陷入流动性危机，再这么搞下去，可能有倒闭的风险，那后果就更为严重了。", "“那不行”，他斩钉截铁地说，“我们绝对不会允许这样的事情发生。”顿了一下，他说，“好吧，你们如果认为必要，可以换行长，但是必须低调，不能惊动市场。”我还告诉他，韦杰夫不知道该信任谁。他说，“搞背对背考核嘛，群众的眼睛是雪亮的。”新桥合伙人召开电话会议，讨论韦杰夫去留的问题。庞德曼常说，做控股性投资的，如果今天觉得应该更换首席执行官，就不能等到明天，也就是说必须当机立断，才能尽快止损。我转达了刘明康主席的意见，要低调处理，不要惊动市场。当然，更换第一把手需要有合适的人选，我们还要物色。我们商量的结果是由我代行最高权力，给韦杰夫两个选择：一个是接受这个安排，在名义上继续担任行长，但必须听命于我；另一个就是马上辞职。庞德曼一开始就担心韦杰夫没有扭转乱局的铁腕，被他不幸言中。此时，他怀疑韦杰夫不会接受这种有名无实的安排。他说，没有哪个首席执行官会答应。我说，我想他会的。凭着我几个月来对他的观察，知道他性格中的柔性多于刚性，所以应该能够委曲求全。后来果不其然。我在深发展没有担任任何职务，既不是董事，也非高管，凭什么指手画脚，甚至发号施令呢？我请韦杰夫任命我任行长高级顾问，这样我就多少有些名正言顺了。紧接着，我着手组建最高决策机构。一般而言，银行的行长和其他高管组成领导班子，称之为行长办公会议。但韦杰夫并没有使用这个机制，大概是因为他谁也信不过。我当然也不知道谁应该被委以重任，负责什么部门。早在1月份，我就向韦杰夫建议通过一个360度考核来选拔高管。所谓360度，就是每个考核对象的上下左右的同事以匿名的方式对其人的工作表现评估。但他没有理会。此时我立即付诸执行，基本采用了新桥内部年度考核的模式。考核的对象是支行长级别以上的干部，而并非全员考核，因为考核的目的是选拔干部。", "两周之后，考核的结果产生了。但只在我的手中掌握，并没有公之于众。据我们所知，深发展以前从未做过此类考核。从结果看，员工们非常重视，踊跃参与。所有考核对象的结果汇总在一大张电子表格中，一目了然。我发现考核的结果很能说明问题：比如，资产质量较好的分支行，高管得分一般较高；资产质量差的，得分就低。这套考核也许比较粗糙，因为搞得匆忙，但达到了目的。正如刘明康所说，群的眼睛是雪亮的。他们心中有杆秤，客观地衡量干部的质量，考核就像一个民意测验，将他们的意愿表达了出来。我选出得分最高的几个高管，作为核心管理团队的候选人。我对他们每个人都做了背景调查，方法是找很多人谈话，收集各方面的意见，深入了解被调查对象的背景，靠什么担任现任的职务，口碑和业绩的情况。", "之后，我又面试了甄选出来的候选人。我必须确定，这些人不但有能力，而且还能服。通过这个过程，我确定了最终人选，邀请他们加入新领导团队，由这些人组成最高的决策机构，我将其命名为“策略委员会”。这个委员会的成员有：刘宝瑞，时任深发展副行长；胡跃飞，时任广州分行行长；周立，时任杭州分行行长。我想，他们三位加上韦杰夫和我，将是一套很强的班子。我打算破格提拔胡跃飞和周立。这不合常规，但特殊情况下需要特殊手段。从组织上看，中国的许多银行的分行就像封建割据，有相当大的自主权，尤其在贷款决策上，几乎可以自行其是，母须总行的批准。一个省级的分行，就像一个区域性的总部，控制着省内若干支行。比如，广州是省会城市，广东省人口约1亿。杭州是浙江省会，浙江人口约5500万。这两省都是巨大的市场，人口众多，相对富庶。", "深发展不良率整体偏高，但不良贷款分布不均，一些分行的不良贷款水平远高于其他分行。尽管深发展的风险管理体系总体上较差，但有些分行资产质量较高。比如胡跃飞的广州分行和周立的杭州分行就是资产质量较高的地方。相比之下，虽然深圳分行贷款仅占全行总额的30%，但不良贷款则占全行总额约70%-80%，俨然成了重灾区。", "为什么不良贷款分布如此不均匀？我读过经济学家易纲在二十一世纪初的一项研究报告，专门分析这个问题。发表报告时，他担任央行行长顾问，后于2018年3月成为人行行长，他是一位成就卓著的学者，拥有美国伊利诺伊伊大学的博士学位和印第安纳大学的终身教职。我在沃顿商学院任教时，曾任学术期刊《中国经济评论》（China EconomicReview）主编，易纲常为这份期刊撰稿。该项研究中，易纲先将全国各地划分为两种：富裕地区和贫困地区；再将全国各地归入两类：一类历来有良好的信用文化，另一类则无。“文化”的定义是一套信仰和习惯的体系。对银行来说，良好的信用文化也意味着一套约定俗成的体系，放贷的决策取决于借款人的偿还能力或信用资质，而不是个人关系或政府政策。按照易纲的分析，有些地区从文化上还债意愿比较高，而另一些地区比较低。这或许与贫富程度相关，但并非完全如此。如果一个地区平均债务违约率低，可以理解为该地有良好的信用文化。易纲用二维图展示了各地的四种分类结果：（1）富裕且有良好的信用文化；（2）富裕但无良好的信用文化；（3）贫困但有良好的信用文化；（4） 贫困且无良好的信用文化。传统观点认为，贫困地区之所以信用文化薄弱，是因为企业偿债能力较弱，而易纲的分析结果发现并非如此。他的研究显示，甘肃等一些贫困省份的贷款质量较好，而广东等一些富裕省份的贷款质量出人意料地差。他认为，造成这一状况的是各地独特的信用文化。", "我觉得易纲的分析很到位，有助于银行因地制宜管理风险。但他的发现也给我留下一个印象：贷款的质量可能更多取决于分行的地理位置，而不是风险管理体系。一家分行如果位于广东、河南等信用文化薄弱的地区，就可能难以维持较好的资产质量。此外，不良信用文化还会传染。我记得英国《经济学人》曾报道，亚洲金融危机期间，从韩国到印度尼西亚，银行都遇到过借款人“策略性违约”，即借款人即使有偿债能力，也要拖欠银行贷款，因为见到其他人违约，觉得只有自己还债吃亏了。", "但深发展各地分行的资产质量的分布却让我很惊讶。按说广东的信用文化不强，但广州分行贷款质量总体较好；相比之下，上海是中国最发达的大都市，信用风险一般被认为较低，但上海分行贷款质量却出人意料的差。为何如此？易纲的分析错了吗？不，他的分析相当靠谱，源于实际数据。那为何深发展是例外呢？造成差异的关键，显然是分行行长们。优秀的分行行长，即使身处信用文化弱的市场，也能带领分行管好贷款质量；反之，差劲的分行行长，即使身处信用文化强的市场，也会生成大量不良贷款。有些市场的确更难做，但好的分行行长能克服当地不良的信用文化；而不称职的分行行长，即使在最好的信用环境中，也难免坏账堆积如山。人，是决定性因素。这对于我来说是巨大的启示。造成差异的另一个因素，是深发展的组织架构。如上所述，每个分行都像是分封的诸侯国，按自己的信贷标准运营，各自做出信贷决策，造成各地贷款质量千差万别，全靠分行行长的素质。而按照国际最佳的银行管理模式，全行应该有统一的信贷标准和决策机制，而不是分行各行其是。", "所以，胡跃飞能在信用文化薄弱的广东管好贷款质量，是很了不起的。", "同样，周立在浙江也表现出色。两人都比较资深，除了担任分行行长外，还有总行行长助理的职称，仅比副行长低一级。我认为，提拔他俩不会引起争议，而且会给管理层带来一股新风。", "我分别找胡跃飞和周立谈话，告诉他们要组建策略委员会，请他们加入。虽然韦杰夫和我都无权授予他们新职称一那是董事会的权力且需经银监会批准，但我提议立即让胡跃飞主管所有分行业务。这通常是资深副行长的职责。这意味着，所有分行的行长向他报告，他可以抓当务之急的工作，比如吸收存款。鉴于深发展面临流动性危机，这是除总行行长外最重要的职位。我知道胡跃飞能胜任。他时年43岁，从17岁起已在银行业干了26年。他28岁时加入了深发展，随后一路晋升。让我惊讶的是，胡跃飞竟然谢绝，说宁愿留在广州分行，没有兴趣调到总行工作，还说自己的能力不足，无法担当重任，比较适合管分行。还有人拒绝提升，让我大跌眼镜。我认真听他的解释，不知道他是谦辞，还是认真的。我急需组建一支管理团队，而他是理想的人选之一，我没工夫跟他兜圈子，说，“给你24个小时考虑，如果不接受，你就辞职算了，反正你不能回广州分行了。”这下轮到他惊讶了。“为什么？”他问道，“为什么我不能继续管我的分行？难道我不称职吗？”他的问题没毛病，我也得说出个理由。我回答到：“拿破仑说过，‘不想当将军的士兵，不是好士兵。’如果你不想升职，说明你没那么出色。既然如此，你不如走人。”我并不百分百确定拿破仑说过此话，只是依稀记得在哪儿读过。不管怎样，此时此刻，我觉得这句话很恰当。激将法果然奏效，次日，他接受了新职位。看来，拿破仑的金句比军功影响更为深远。说服周立没有如此周折。他比胡跃飞年长两岁，已在深发展工作了13年。他拥有金融学博士学位，曾在南开大学任教，可谓聪明能干。我请他执掌深圳分行。深圳分行地位特殊，是深发展最大的分行，此时下辖全行225家分支行中的89家。深圳分行是重灾区，不良资产集中，如果这个分行不逆袭，深发展就没法扭亏为盈。和胡跃飞一样，周立起初也推辞。也许是因为中国传统文化提倡谦让，就像历史上想让群臣拥立的皇帝，登基前还要三辞三让。我没耐心搞这些装模作样的过场，而是单刀直入说，你要么接受，要么走人。他选择了接受。", "3月19日，我们在深发展总行32楼会议室召开了策略委员会第一次会议。参会的有五人：韦杰夫、刘宝瑞、胡跃飞、周立和我。讨论了三个议题：", "成立策略委员会； 创建新的组织结构； 更换分行的管理层。 会议纪要是这样记录的：", "章杰夫行长在决策过程中需要大家强有力的支持，但现有行长办公会议成员太多，导致很多问题议而不决。根据考核结果，韦杰夫邀请刘宝瑞、胡跃飞、周立和自己一同组成“策略委员会”，这个委员会将成为顾问机构，协助总行行长制定战略与政策。实际上，此后所有重大决策都出自这个委员会。第一次会议决定，刘宝瑞负责零售银行业务。新桥在尽调和规划的时候，就将雾售定为新发展方向，减少对公业务的依赖。胡跃飞负责对公业务和除深圳分行之外的所有分行。周立负责深圳分行。会议纪要记录了我们面对的难题：", "单伟建在会上指出，用人唯亲盛行严重危害银行管理和业务，不能再容忍。与会者都认识到深发展的下列现状：", "• 缺少优秀的分行行长；", "• 缺少优秀的管理团队；", "• 各分行业务依然薄弱，风险太大。", "我在会上建议，委员会决策换掉绝大多数省级分行的行长。我们还对总行的关键职位做了人事调整，包括任命陈蓉为风险管理总监。她年懂37岁，大约半年前从英国留学回来，目前担任信贷部总经理，考核打分和口碑都不错。我拿出一份基于考核结果而拟定的任免人员名单。委员会经过充分的讨论，征求了对候选人和当地市场状况了解的老员工意见，修改并确定了名单，主要是更换大部分分行的行长。", "这是对深发展管理层的重大改组。我的一些新桥同事认为过于激进，不大赞成。他们担心深发展已经很脆弱，可能受不了勐药，主张循序渐进的改革方式。", "但我认为，深发展已病入膏肓，急需大手术。我们在和时间赛跑，拖得越久，就越危险。深发展需要止血一止住存款流失，更需要骨髓移植，用新的红细胞取代病细胞，恢复造血功能。在我看来，勐药的利远大于弊。果然，管理层变动的消息一公布，犹如重磅炸弹落地。一些被免职的人不肯善罢罢休。情势变得异常紧张。我坚信我们所作所为都是对的，都是为了银行和员工的利益。我们的人事决策完全基于考核结果和业绩，并不针对个人。们根据考核结果提拔人，很客观，向员工发出了有力的信号一未来晋升不看关系，只看业绩，只要干得好，就有前途。我相信这极大地鼓舞了士气。", "3月10日，新晋升的风险总监陈蓉邀请我在首届员工信贷风险管理培训班上讲话。一开始，我就问大家，有谁认为深发展是中国一流银行，请举手。", "没有一只手举起来。在场的30多名员工中，没有谁认为深发展在中国银行业能名列前茅。接下来我问：", "“那么有多少人认为，我行在中国银行业位居中流？”几只手稀稀拉拉举起来了。", "“嗯，不到20%”，我数完说道。", "“那多少人认为，我行是垫底的？”更多的手举了起来。", "我环顾一圈，说：“好，大多数。”有些人全程都没举手。", "“所以有人认为，我行压根儿不存在？”我打趣道，引来一阵笑声。看来听已经放松了。", "此时，我可以看出大家在认真听，脸上表露出兴趣和热情。", "“看来”，我继续说，“大多数人认为我行排名垫底。我们都在深发展工作，却认为它不是一家优秀银行，这实在可悲。我们需要反思，为什么会这样。”", "我指出，并非所有分行都不好，杭州、广州、南京等分行的资产质量就不错。导致分行之间的差异往往是分行长，而非市场或其他外部因素。", "“有志者事竟成”，我说道，“只要坚持不懈，没有什么办不到的，但前提是有合理的奖惩机制。”", "接着，我讲了有效奖惩机制的重要性。我说，一般而言，国有企业效率不高，但也有搞得很好的国企。我举了一些例子，包括新加坡航空公司和中国的宝钢（我当时任宝钢的独立董事兼审计委员会主席）。而民企也有搞得不好的，比如美国的安然公司，不久前破产。既然如此，为什么还要搞巿场经济呢？", "大家看上去迷茫，陷入了沉默。他们大概从未思考过这个问题，其实答案也不是那么显而易见。“我仔细琢磨过这个问题”，我继续说，“中国有过几千年的君主制度，我们都知道那套制度不好，但历史上也有些时期，国家繁荣强盛。那我们为什么认为君主制就不好呢？”一位女生举起了手，怯生生地答道：“因为昏君太多了？”“没错”，我说道，“君主制的问题在于无法淘汰昏君。”“同样，过去国有体制的问题在于缺少淘汰机制，亏损的企业照样生存。”我继续说，“而市场经济提供了优胜劣汰的机制，所以只有比较优秀的企业得以生存。因此存在的就合理，而不合理的就不存在了。所以这个机制更好。”此时，我切入正题：“那我们怎样打造好银行？以史为鉴，我们也要有奖优惩劣的制度，引进人才，同时淘汰不称职的人，将这套制度融入我们的文化，我行就一定能成为好银行。”环顾四周，我看到有人点头，有人微笑。我开始激发大家主人翁意识。", "“深发展是属于谁的？”我问道，“是属于我的？还是你的？其实，它是属于我们大家的，包括你我、股东、员工和客户，也包括所有的存款人和借款人。作为几千名员工之一，每个人都要有主人意识，‘我就是银行的主人’，只有这样，银行才能进步，个人的事业也才能进步。”我从来相信主人翁意识的力量，这就是为什么改革之初，包产到户，允许个体户的发展释放了巨大的生产力。一个人如果把任何工作当作自己的事情，那什么事情都能干好，不懂的也会主动去学。因此有主人翁意识至关重要。", "我直言，深发展问题成堆，但最大的两个是管理不善和士气低落。针对听众是风险管理培训班的学员，我说必须改变我行的文化，培育良好的信用文化，把借款人的信用资质作为贷款决策依据。“这关系到我行的生死存亡”，我说，“如果人人都对创造良好的信用文化做出贡献，我行一定会成为好银行。”我的演讲结束了，学员们热烈鼓掌，看得出他们真心赞同我的话。我的讲话登上了深发展的内部出版物。我们希望更多的员工清晰了解到，新桥作为控股股东，致力于将深发展打造成好银行，如此才能使员工在职业上获得成功。这正是我要传递给员工的讯息。", "韦杰夫启动了一项重大改革，他称之为“One Bank”。这个词还真不好翻译，但意思是银行管理必须一统天下，而非各自为政，从这个意义上来讲，我们只有“一个银行”或“One Bank”。新政策的内涵是总行信贷审查委员会统一负责信贷决策，以此来确保贷款质量标准化。此举剥夺了分行行长的信贷审批权，他们现在只负责营销银行产品和提交贷款申请。各分行的信贷主任直接向总行首席信贷官负责，而不向分行行长负责。这套制度可防止分行基于个人关系放贷，还解放了一线的行长们，让他们把最大的精力用在营销贷款上。“One Bank”的内涵还包括在人力资源、风险管理和薪酬方面，深发展将有统一控制与标准。“One Bank”这个口号言简意赅，很容易理解，也很容易接受，因此一炮打响，使所有员工都看清了新方向。", "同时，在胡跃飞的领导下，对公业务和分行业务迅速改观，最突出的成就是止住了存款流失。几个月内，存款回流，流动性状况开始改善。短短两个月内，2005年一季度流失的全部存款几乎全部回流了。这主要归功于胡跃飞设立的简单激励制度：员工奖金与吸存金额挂钩。有些员工甚至劝说亲属来深发展存钱。深发展从此蒸蒸日上，存贷款规模在新桥持股期间持续增长。有个更大问题亟需解决，那就是堆积如山的不良贷款。任何背负着大量不良的分行，若不先收回旧贷款，会因为资金短缺而不能发放新贷款。在不良的沉重负担下，深发展无法成长。", "虽然胡跃飞化解了存款危机，但深发展的财务状况仍然很糟，以至于在4月5日，前摩根银行的资深银行家约翰.奥尔茨辞任深发展董事。他说担心深发展风险隐忧太大了。我知道，他生怕这家银行早晚会出事，自己被牵连，玷污了一世的名声。他的行为我们都理解，但是当然也使我们很被动。幸好，他作为董事参与度不高，因此他的辞任不影响董事会的正常运作。其他独立董事，如蓝德彰、纽曼、奥汉隆，则与新桥团队及深发展管理层同舟共济，紧密配合，努力将银行带上正轨。奥尔茨的辞职突显了深发展的困境，但更显出董事会其他成员的勇气和信心，义无反顾地帮助深发展转型。", "在改造问题银行方面，有个屡试不爽的模式，即将其一分为二：一家负责管理所有正常贷款的“好银行”，以及一家负责管理不良贷款的“坏银行”。好银行没有历史包袱，轻装上阵，在新的管理和风控体系下，健康增长；而坏银行则专注于清收不良贷款。庞德曼在与合伙人一起收购美国储蓄银行时，开创了这一模式。新桥收购韩一银行时，也是这套路子。对美国储蓄银行和韩一银行，政府持有坏银行并承担相应责任，新股东只需管理好银行。而对深发展，新桥接手的既有好资产，也有坏资产，都是自己的责任。我们决定在深发展内部创建“资产管理部”，实际上就是内部的“坏银行”，承接全行的不良贷款。卸掉不良贷款的包袱后，其他分支行就能专心管理和发放正常贷款，所有不良贷款由资产管理部负责清理。我的心中已有这个部门负责人的最佳人选。4月1日，我们召开策略委员会会议。经我提议，委员会决定，聘请原市政府首席谈判代表王骥担任资产管理部一把手。王骥虽然经历了一些坎坷，但仍精力充沛，干劲十足。在丢掉深商行行长一职前，他曾因成功清理了大量不良贷款而广受赞誉。他也许讲策略不够，但他专心致志的毅力和毫不妥协的精神有余。他绝不放过任何“老赖”。追债需要勇气，甚至有人身危险，有些债务人可能走极端。而王骥无所畏惧，且格外积极。他因为莫须有的罪名接受调查，最终被证明完全清白，他还将深圳党委组织部给他的证明信拿给我看。但他此时没有工作，渴望重回职业正轨。在我眼里，资产管理部一把手非他莫属，我对新桥的同事讲，王骥将是“不良资产沙皇”（“NPLTsar”）。"], "wcount": 9254}, {"icon": "15", "title": "第十五章 新官上任", "paras": ["为了彻底改造深发展，策略委员会做出了一些重大决策，包括关键的人事变动、不良贷款处理系统等。但我仍觉得，这些远远不足以使深发展步入正轨。深发展亟需变革，而在韦杰夫的领导下，变革来得太少太慢了。2005年4月9日，我致函韦杰夫，指出了一连串迫在眉睫的重大问题：我们已经改革了分行管理，也请策略委员会成员分管零售业务、对公业务和分行，显著提升了组织稳定性，大大鼓舞了全行上下的士气。随着下周北京分行行长换人，分行人事改革的另一只靴子也将落地，那些不受此次改革影响的分行行长也会随之打消顾虑。一季度数据显示，损益表的表现超出预算，但资产负债表有所收缩，明显低于预算，存贷款均比预算低40亿元左右。再加上30亿元左右的存款变成了付息成本更高的邮政存款，除非我们迅速弥补零售存款流失，并扩大贷款规模，否则，未来几个季度的净利息收入不容乐观。“损益表的表现超出预算”是指盈利超出计划指标，是好事。“资产负债表有所收缩”是指总资产和总负债有所下降，这是坏事。一个银行的资产负债表收缩，对当期的利润不会有很大的影响，但对未来的利润会产生负面影响。信中提到的“邮政存款”是把双刃剑。虽然存贷款利率都由央行控制，但大公司可通过协商获得高于普通零售客户的存款利率。中国庞大的邮政系统也是吸存机构，从客户那里吸收存款，然后将资金存入银行。邮政系统凭借巨大的规模和广泛的网络，拥有强大的议价能力，能拿到最高的利率。为了补足存款，深发展拿了不少邮政存款，但必须支付高于市场的利率，因此拖累了利润率。我继续写道：", "虽然我们没有具体形成文字的战略规划，我们的共识是要大力发展零售业务，同时保持对公业务增长，这一战略构想也体现在新桥/摩根士丹利的分析模型中。我们希望用三年左右的时间，使对公和零售业务量达到旗鼓相当。当然，我们的假定是，能够通过配股和/或其他手段，补足深发展的资本金。同时，我们也能够使其风控体系与国际接轨。", "为了达成今年的计划和未来几年的战略目标，我们还有多项迫在眉睫的任务。我将任务一一列出，包括统一各分行和总部信贷管控团队的信贷政策与程序。我提醒他，我们需要改进财务政策以激励员工，尤其是设计不良贷款清收的激励机制。“总行很多部门依然混乱，”我写道，“我们辞去一位高级风控官后，至今无人顶替。”分行行长不知该向谁询问风控政策。针对诸如此类的问题，我说：“很遗憾，我们之前的决策被置之不理，这可能会带来更多恶果。”我们需要大力发展零售业务，削减冗员，充实关键岗位，包括首席财务官、首席技术官和人力资源主管。", "我觉得当务之急那么多，得不到解决，必须把利害关系说清楚。我是这样结尾的：“以上就是我的所思所想。最近两次策略委员会会议来不及讨论这些问题，所以我把它们写下来，希望立即推动变革，而不是坐等每周例会。”章杰夫的回复一如既往地波澜不惊，没有反驳任何要点。但我不知道他是否和我一样感到紧迫，会不会果断出手解决问题。4月15日，我们又召开了一次策委会会议。“资产管理沙皇”王骥应邀加入了策委会。会上虽然讨论了多个迫切问题，但未提出具体的行动计划或时间表，所以我颇感失望。次日，我给与会人员写了一份很长的备忘录，再次强调我们的短板和要务：我感觉昨日策略委员会上讨论不良资产管理方案虽然费时良多，但收效不高，并没有形成一个统一而可长期实施的意见。关键问题在于思路不统一，方案不清晰，可操作性没有充分论证，使得我们讨论的基础比之上一次策略委员会并没有显著的进步，结果围着早有定论的，该不该做此事、彼事，无休止的论证，莫衷一是。而基本原则都没有取得一致意见，以致不知下一步如何推进。除了由周立先生主理的深圳分行内部剥离不良资产的方案是比较明确以外，其他的整体方案仍然一概模煳。深圳分行的方案无可厚非，但却有点本位主义。在我看来，当务之急有二：一是各分行必须发展新业务，二是需要尽快剥离深圳分行的不良贷款。同时，总行应向深圳分行注入首批资金，部分补偿剥离的不良贷款，以使深圳分行恢复增长。", "我憨来憨深入地参与深发展的运营，向韦杰夫和其他高管发号施令，因此，我和韦杰夫的关系急转直下。我对重要的事情久拖不办感到难以容忍，而韦杰夫无疑对我的篡权行为感到恼火，但他是把话藏在肚子里的人，所以我俩也很难靠沟通解决分歧。这个关系变得难以维系。一周后，他出手了。2005年4月21日，庞德曼从首尔打电话给我，说他和唐开罗收到了韦杰夫的来信，信中要求新桥停止对深发展管理的干涉。否则，韦杰夫威胁说，他就拒绝在2004年审计后的财务报表上签字。深发展作为一家上市公司，如果不能按时发布经审计的年度报告，其后果不言而喻。", "其实我比他出手还早，就在庞德曼收到那封信的头一天，布朗姆、庞德曼、唐开罗和我在首尔已经碰面。我们议决为深发展物色新的首席执行官。我牢记银监会刘主席的告诫，要“避免惊动市场”，所以我建议仍然让韦杰夫留任，但向新首席执行官报告。所以，当次日韦杰夫的信送达的时候，我们觉得无可再议，就按照头一天的决策办。", "4月22日，蓝德彰和新桥的几位同事一庞德曼、布朗姆、唐开罗、欧巍、刘伟琪以及我一在新桥的香港办公室开会，讨论怎样为深发展物色新首席执行官。此事必须谨慎万分，因为这项任命除了需要董事会的支持外，还需要监管的批准。我们必须找一个资历无可挑剔的人，因为在现阶段，我们承担不起监管的否决。更重要的是，任何潜在人选，无论在银行业里经验多么丰富、资历多么深厚，都可能在深发展翻船，因为深发展实在积重难返。这就是韦杰夫的教训。去哪儿找这样一位让我们信得过的候选人？人生时常遇到一些时刻，给人以似曾相识的感觉，此时即是如此。新桥在入股韩一银行一年后，就决定换掉首席执行官，那时我们面临的困境与现在几乎一模一样。", "蓝德彰出了个点子，我们全都忍不住击节赞叹。他提议请法兰克.纽曼担任代理首席执行官，并同步物色一位长期的首席执行官。我们大家都和纽曼很熟，他是一位经验丰富、受人尊敬的银行家，当过银行首席执行官，曾帮助好几家陷入困境的金融机构转型，包括1980年代的富国银行（Wells Fargo）和美洲银行，以及1990年代的信罕银行。他接受新桥的任命，担任韩一银行董事5年，其间给我们留下了深刻印象。而且，他已经当了几个月的深发展董事。美中不足的是，他不讲中文。", "在此紧要关头，第一要务是找到改造银行的专家，其他考虑都属次要。", "在人选上，我们不能再出错了，否则新桥的威信扫地，员工、监管和市场对深发展的信任也会受到重挫。纽曼在业内备受尊敬，我们对他知根知底，完全信得过。", "庞德曼说，不会说中文未必是个坏事，也可能是个好事，因为不会有人找他走后门。中国银行体制中之所以产生了那么多不良，就是因为有人走后门。", "问题是，纽曼本人是否愿意接受这份工作。他和妻子住在纽约，从来没有在国外长居的经验，他们肯举家搬到异国他乡的深圳吗？事有凑巧，纽曼定于当天为其他事情飞抵香港。我们大家决定到机场去迎候他，因为布朗姆和庞德曼也定于当天飞离香港，之前正好有时间和纽曼见面。当天下午，新桥团队和蓝德彰一起驱车前往机场。", "纽曼下了飞机，看到迎候的阵容，一定很吃惊，不知出了什么事。我们请他先移步至机场沃尓沃酒店的一个会议室。一落座，布朗姆开门见山，对纽曼合盘托出，然后我们轮流介绍了情况。讲完后，大家齐刷刷地看着他，忐忑地等待回应。那一刻，纽曼仿佛是我们的救星。别人长途飞行都穿便装，而纽曼不同。虽然刚落地，他穿着正式，西装革履，一丝不苟。这是他一贯的作风。我意识到，自我认识他起，从未见他穿休闲服装。他头顶羊毛编织的贝雷帽，卓尔不群。我13岁的女儿曾说，无法想象纽曼叔叔脱掉西装上床睡觉的样子。在她眼里，纽曼从举止到外表，都堪称完美绅士。他的行事方式亦张弛有度，言谈温和，又不失自信，他做事严肃认真，注重细节。后来，就是因为他的风范，在中国银行业赢得了“最英式的美国人”的赞誉。这是因为中国人的印象中，英国人讲究绅士风度，而美国人比较随便。但纽曼则相反。纽曼提了几个问题，看得出来他饶有兴趣，也明白我们真的别无选择。", "简短问答之后，他同意接受任命。就这样，解决了一个天大的问题，不亚于一个小小奇迹。不过，纽曼只同意临时代理首席执行官一职，为期6个月，或直到我们找到长期的首席执行官为止。尽管如此，我们已经谢天谢地了。实际上，中国的银行体系中不设首席执行官，每家银行都设一位董事长和一位行长，有时一个人两个职务一肩挑，有时董事长是实质上的首席执行官，有时操刀的是行长。但我们既然打算让韦杰夫继续担任行长，么办？那将使我们进退维谷。这时蓝德彰又有了想法。“纽曼何不与我掉换位置？”他建议说。", "经过几秒钟，我们才反应过来，蓝德彰是在提议，由纽曼接替他担任董事长。这是无私奉献之举，体现了他的高风亮节。当时在中国，蓝德彰是唯一外籍的全国性银行董事长，声名显赫，业内人人皆知。然而为了深发展的利益，他毫不犹豫地自愿放弃这个头衔。这个点子妙在，从董事会和监管的角度看，这次变动只是新桥委派董事的角色互换，用这种方法把他放在第一把手的位置，是最快不过的捷径。", "当然，说比做容易。监管部门和董事会都知道，蓝德彰是非执行董事长，而接任的纽曼将是一位执行董事长，具体管事的。虽然董事会热情支持，立刻批准了纽曼的任命，但银监会的批复姗姗来渥。纽曼不等收到监管正式批复，就于五一长假后走马上任了。结果，银监会以创纪录的速度，批准深发展任命纽曼为董事长兼首席执行官，纽曼成为中国银行系统中唯一拥有首席执行官头衔的人。纽曼曾是美国政府高官，在克林顿总统主政期间任美国财政部副部长，如此丰富的资历，也可能有助于他迅速获批。事实证明，我们选对人了，很幸运。纽曼喜欢这个新岗位，我们也信任他。不知不觉之中，他的临时任命变成了长期性的，在新桥持股期间，他一直担任董事长兼首席执行官。", "中国于1999年启动了银行业改革，国有银行将不良贷款从资产负债表上剥离，转移到财政部出资设立的国有资产管理公司。在2002至2003年前后，央行对国有银行注资重组。深发展就没那么幸运了，因为地方政府仅持有深发展18%股份，既无责任也无财力将它从不良贷款的泥潭中救出来，我们盼望从政府那里获得的各种财援皆成泡影。", "关键在于，一次性清理不良贷款，很难称得上是体制改革。管理不善的银行，只要管理方式不变，还会源源不断地产生不良贷款。就像一条船漏水了，光是把水舀出去避免不了沉船，必须把漏洞补上才行。", "纽曼回答媒体提问时，自谦是“银行修理工”。他知道如何填补漏洞，明白需要有效的风险管理系统，从源头上杜绝不良贷款。贷款业务必有风险，借款人未来的还款能力总有可能受损。若对信贷控制过严，就可能阻碍放贷，减少银行收入；过松，就控制不住贷款质量。良好的风险管理系统可让银行在扩大贷款规模的同时，将不良率保持在可控的最低水平。早在新桥入主前，过渡期管理团队就已收紧了深发展的信贷控制，但那只是权宜之计。为了让深发展能够健康发展，还必须创建一套有效的风险控制系统。纽曼着手加强深发展的总行信贷控制系统。他从香港聘请了李文活（Simon Lee）担任首席信贷官。李曾在多家国际银行任职，经验丰富。现在，所有分行都有授信额度约束，超过额度需由李文活领导的信贷委员会审批。各分行的信贷主任直接向总行首席信贷官报告，而不再向分行行长报告。最重要的是，首席执行官，即纽曼本人，既非信贷委员会成员，也无权放贷。同样，负责客户关系的前线人员，包括各分行行长，也没有贷款审批权，只可以发起贷款申请。另一方面，信贷主任无权发起贷款申请，只有审批权。贷款申请和审批的分离就形成了相互制衡机制，杜绝了靠关系搞贷款。", "纽曼还聘请了王博民担任首席财务官。王曾在台湾的台新银行担任高管，他说普通话，没有语言障碍，很容易地融入了管理层。资产管理部在王骥的带领下，工作极其高效。一般来说，好面子的员工不愿意做坏账催收工作，因为既无乐趣，也可能没前途，有时还很危险。你永远不知道，走投无路的债务人能干出什么事来。对银行来说，最简单的做法就是通过拍卖处置不良，将债权大幅打折出售给专做催收的资产管理公司。但深发展不能这么做，至少在新桥控股的头几年里不能。原因是，一方面，中国的不良资产交易的市场尚不发达，不良资产未必卖得出去；另一方面，深发展资本薄弱，需要资金，承受不了资产大幅打折出售。资产管理部成立之初，我就主张按不良贷款回收金额的比例，给部门负责人和成员提成发奖金，创建与市场上独立的资管公司一样的薪酬激励制度。这套制度立竿见影，第一年，资管部收回了现金15亿元，相当于2005年初深发展资本金总额的三分之一，而这些都是在账上趴了多年的呆账。第二年，资管部又收回了20多亿元。如此这般，这个部门从“垃圾站”变成了“摇钱树”。员工的工作积极性很高。王骥告诉我，某位员工有次骑摩托车执行收债任务时，弄断了一根手指（因工伤事故，不是被打断的，虽然此类风险不能排除）。医生缝合了断指，但他没有严格遵照医嘱休养，很快又骑着摩托车去上班，结果那根手指没有保住。当然，我们不希望员工损害身体健康，但这个故事体现了那个部门员工奋不顾身的敬业精神。渐渐地，资管部提成丰厚，成了全行羡慕的对象。合理的薪酬体系，是改善银行运营、提升效率和生产力的关键。深发展以前实行的薪酬制度类似铁饭碗.没有与业绩和贡献挂钩。我当年在内蒙建设兵团种地，太知道大锅饭制度只会养懒汉。", "有一次纽曼接受美国《机构投资者》杂志采访时谈到深发展改革前的薪酬制度：“比如说，你的年收入是10万元人民币，其中60%为工资，40%为奖金，无论你干得好坏，甚至就算不出勤，你每年都稳拿10万。”薪酬制度改革之后，深发展的薪酬与个人的贡献和公司的业绩挂钩。新制度很受欢迎，调动了员工的积极性。“大多数美国人不知道，中国搞的是市场经济。”纽曼告诉记者说，“重赏之下，必有勇夫。”在成熟市场，银行对高风险客户收取高利率，对低风险客户收取低利率。有了风险定价能力，银行就能与信用资质较差的客户做业务，通过高利率弥补贷款损失。世界上几乎所有的市场都是如此，今天的中国也不例外。但2005年的中国并非如此，当时利率由央行决定，偏离基准利率的空间很小，银行无法通过风险定价的方式让贷款利率准确反映风险。结果，银行抢着和信用资质好的大客户做生意，这些通常是国企。2000年代初的银行业改革后，这一趋势反而憨演愈烈，因为银行职员须对产生的不良贷款负责，所以更加需要避险。深发展对公业务的客户大多是中小企业。中小企业的定义是员工少于1000人、年营业收入低于4亿元的企业，这些通常是高风险借款人。相比之下，大型国企还款能力要强得多，因此贷款也安全得多。深发展很难抢到大型国企的业务，因为它们与大的国有银行关系更密切，而深发展规模太小，大国企根本看不上。", "既然深发展抢不到信用最好的国企的生意，也无法根据风险作价，调整利率，专注中小企业贷款，如何做大对公业务呢？对于深发展，这是个巨大的矛盾和挑战：又要增长，又要控制风险敞口，所谓要鱼与熊掌兼得，这可能吗？纽曼的对策有二。一是想出办法降低对中小企业贷款的风险，二是大力发展零售业务。胡跃飞是策委会的成员。他在担任广州分行行长期间创新了一个产品，叫做“供应链金融”。他发现，有些中小企业虽然自身的资信较差，但它们的客户可能是资信好的大企业，如果小企业把从大企业应收的账款拿来做质押获取贷款，那么对于银行来说，还贷的风险就从小企业转移到大企业的应收账，而大企业违约不支付的风险要低得多。如果把诸多的应收款放入一个押品池中，那么押品的风险更进一步分散。而且押品池子里的应收款可以滚动使用，旧的支付了又有新的放进来，这样化高风险为低风险，银行和作为供货商的小企业就可以保持长期贷款的关系。小供货商借助大客户的良好信用，能享受较优惠的贷款条件。应收账款的回款资金直接流入深发展，用于归还小供货商的贷款。胡跃飞的这个产品，还真做到了鱼与熊掌兼得。", "百度百科词条“供应链金融”简要介绍了这款产品的历史，恰如其分地肯定了深发展的成就：“2001年下半年，深圳发展银行在广州和佛山两家分行开始试点存贷融资业务（全称为“动产及贷权质押授信业务”），年底授信余额即达到20亿元人民币⋯.深发展于2006年在国内银行业率先推出‘供应链金融’品牌，迄今累计授信出账超过8000亿元。”令我惊讶的是，在岌岌可危、问题缠身的深发展，竟有分行行长能发明新产品大幅改善资产质量。新桥入股前，广州分行的成功大概没有引起足够的重视。但纽曼慧眼识珠，立刻发现了此产品的潜力，随即以“供应链金融”为品牌在全行推广。通过这款产品，深发展既与中小企业做生意，又几乎母须承担他们自身的风险，这促成了对公贷款规模的快速增长。2006年是深发展在纽曼领导下的第一个完整年度，对公贷款规模比上年增长超过30%，供应链金融服务荣获“第二届深圳市金融创新奖”，被中小学企业协会、中国银行业协会和中国《金融时报》评选为“最佳中小企业融资方案”。与此同时，纽曼大力推进零售业务的发展。当时中国的零售银行市场尚处于起步阶段，许多消费者是第一次借抵押贷款，第一次办信用卡。中国人口过十亿，随着居民富裕程度的提高，市场潜力巨大。一年后，深发展的“成绩单”显示，零售贷款的质与量都有长足进步，居然已可比肩全球顶尖银行。深发展2006年年报称：“2006年，零售贷款录得87.1%的增幅，增长率在全国性商业银行中排名第三。零售贷款资产质量持续改善，虽然受到历史存量不良贷款的影响，但不良率仍由年初的2.23%下降至1.24%，其中2006年发放的需售贷款的不良率仅为0.07%。2006年度，信用卡有效卡量比上年增长49%，信用卡佣金收入录得71%的增幅。”2006年底，深发展交出了亮眼的成绩单：总资产比前一年增长了17%；净利润从上年的3.11亿元增长到14.12亿元人民币，增幅高达354%。纽曼对自己和深发展的成就倍感欣慰，高兴地告诉《机构投资者》：", "“在我参与过的转型中，这是最快的一次。J新桥的同事们也兴奋。事实证明，请纽曼担任首席执行官，可谓天时地利人和。他在各方面的表现都超出预期。他就任后，再也没提自己只是短期担任首席执行官或哪天要离职。作为深发展转型的掌舵人，纽曼赢会神地听对方说话。如果同意，他会说“这个主意很棒”；如果不以为然，他也不会置之不理，而会说“有道理，不过..”，然后给出自己的看法。像他那样极具耐心、善于沟通的领导，我还是第一次见到。", "举一个例子：纽曼领导下的头几年里，深发展有一位袁姓独董，是新桥入股前留任的。他在董事会会议上扯开嗓门说话，仿佛在吵架。与纽曼意见相左时，袁先生常常直接呛纽曼，甚至出言不逊，令在场所有人感到难堪。他是我父母的同乡，操着山东口音，因此，他的行为让我替他尴尬。我曾在会议间隙把袁先生拉到一旁，和气地劝他放低音量：“您嗓门低一些会更有说服力。”然而，纽曼从没被袁先生惹毛过。他会耐心等待袁发表完长篇大论，道一句“多谢高见”，然后讲述自己的看法或询问他人意见。他一次又一次巧妙地化解了紧张局面，让我惊叹他的雅量。有时，我甚至怀疑是否同声翻译把袁先生的不逊之词过滤掉了，改成了恭维话，还是纽曼真正修养到了苏东坡所说干大事者必备的品德：“猝然临之而不惊，无故加之而不怒。”我自愧不如。苏东坡的标准，第一句我可以做到，第二句我再三提醒自己，但是到了关键时刻，就经常忘了。总之，在董事会的有力支持下，纽曼出色地实施了一系列行动和计划，总是能超额完成对董事会的承诺。作为中国银行业的首位外籍董事长兼首席执行官，纽曼备受市场和媒体的关注，他的美名很快从深发展内部传到了市场上。2006年，中央电视台将纽曼评为20位“中国经济年度人物”之一，对外国人来说可谓殊荣。那是新桥和深发展的快乐时光，前景令人鼓舞。然而，深发展尚未完全摆脱困境，转型之路依然漫长。2006年底，深发展还面临着不少问题，比如虽然资本充足率提升了，但仍然只有3.7%（2004年的账面值为2.3%）；不良贷款率降低了，但仍然高达8%（2004年账面值为11.4%），所有这些指标仍然远低于监管要求。纽曼这位“银行修理工”不负众望，但深发展仍急需补充资本。不久，我们的募资工作就遇到了难以克服的阻碍。", {"img": "m18-1", "cap": "第十五章插图"}, "银行成立20周年庆祝酒会HEN DEVELOPMENT BANKRSARY CELEEFSTION COCKTAI2007•12", {"img": "m18-2", "cap": "第十五章插图"}, "2010年2月，深发展董事长纽曼在春节期间看望员工。"], "wcount": 8293}, {"icon": "16", "title": "第十六章 改土归流", "paras": ["本章标题的涵义也许不是一目了然。“改土归流”是明清两代在少数民族地区采取的治理政策，将“土司”管理改成朝廷委派的“流官”制度。“土”，指土司，世袭罔替，所以相对固定；而“流”是流动的，朝廷任免的官吏。本章的重头戏是“股权分置改革”，也是某种意义上的改土归流，把不流通的法人股变成流通股。股权分置一法人股和流通股并存一是中国股市早期设计的产物，解决当时的一些问题，比较“土”，早晚要淘汰。改革的目的是“全流通”，与国际市场并轨。2005年5月，我被正式提名为深发展董事。随着银行转型加速推进，收购过程中你来我往而引起的任何不快都已云消雾散。此时，深圳方面没有人再在意我是否成为董事。此前，我虽然在深发展内部没有任何名份，但也积极参与了它的重组、改造和运营。又过了几个月，我的董事任职才获得到监管部门的批准。自打纽曼担任首席执行官后，我就无需那么参与深发展的管理了，但我所创建的策略委员会、资产管理部等制度和架构在纽曼的治下仍然延续了下来，继续发挥作用。", "纽曼大权在握之后，我把精力转移到了募资上，以解决深发展资本金严重不足的问题。我们本来指望通过配股募资，而配股需要证监会的批准。在交割之前，深发展没有拿到批准，之后，也迟迟拿不到批准。", "员们以为少进少出，就可以维持股价和市场指数。尤其在市场低迷之时，监管的限制更变本加厉。直至2024年的今天仍然有人说中国的股市不是投资市场，而是融资市场，只是用来圈钱，而不是给投资者创造收益的。其实，A股市场也不是一个很好的融资市场。非但上市很困难，上市公司在股市上融资也困难。", "境外成熟的股票市场，包括中国的香港，都不是这么管理的。首先，入市是注册制，按照标准和规则管理，监管几乎没有任意权。上市公司如果要发行股票，除了要遵守上市规则之外，再无其他限制。大股东如果要减持，除了有锁定期和防止内幕交易的窗口限制，也基本自由。而内地的监管不同，入市需要批准，仅仅符合上市标准还不行，证监会有很大的任意权，有时候为了支撑股市，干脆停止批准入市，减少股票发行量，以为这样就可以挺住市场。上市公司要发新股，无论是配售还是定向增发，都要证监会的批准。有时候因为要支撑股市，干脆关闸，不许增发。而且关闸的时间可以很长，没有限期，所以上市企业也不能指望股市提供可靠的资本来源。那么想一想，上市要达到什么目的？如果上市是一锤子的买卖，企业靠在股市融资来发展就几乎不可能。如果大股东想减持，那么限制就更多，比如在某段时间减持不能超过一个极小的百分比，全部减持需要若干年时间，等等。", "过去二三十年的历史证明，这样的限制政策并没有促成股市的健康发展，也没有使整体市值节节攀升。而恰恰相反，股市时有大起大落，时而长期低迷。原因很简单，不能自由出入的市场不是真正的市场。这就是为什么许多优质的中国企业都寻求在海外上市。流水不腐，户枢不蠹。如果是一潭死水，不可能养出一群活蹦乱跳的大鱼。", "因此，周林在2002年就拟定的深发展配股计划，到了2005年，仍然毫无进展，证监会就是不批，也不提供任何理由。更有意思的是，证监会的目的和银监会是冲突的。银监会迫切需要深发展募资以补足资本金，而证监会要限制或禁止增发，深发展被夹在中间，动弹不得。深发展曾多次争取，证监会不明确说“不”，但就是不批。所以配股方案长期搁浅。因此，上市企业要花很多资源和时间去游说证监部门。多少年了，我时不时发现，当初打过交道的不少证监和交易所的官员因为贪腐锒铛入狱，其中不乏很有能力的人。是因为这些人太贪婪，品德不好？当然这是一个因素，但还有一个体制的因素，就是他们手中的权力太大了，对于企业来说是生杀予夺之权。权力产生腐败，所以贪腐 屡见不鲜。", "2005年5月中旬，我带着深发展的副行长刘宝瑞和新任首席财务总监王博民，拜会了证监会主席尚福林。这次会面还是银监会帮助安排的，因为银监会敦促深发展尽快融资补足资本金。那次会面统共不足半小时。", "尚主席彬彬有礼，但很坦诚地说深发展不可能很快获得配股许可。他说，这与深发展够不够格无关，而是因为上市公司发行新股募资一律暂停，证监会已下令关闸，正在制定“股权分置改革”的政策，何时开闸不知道，但在可见的将来，别想了。股权分置改革简称为“股改”，是中国股市发展历程中的一个重大的里程碑。1990年代初，新中国的证券交易所刚刚创建，许多国企重组成了股份制公司，然后通过公开上市发行新股，在沪深交易所挂牌交易。在早期的制度安排下，上市发行的是新股，而国有股不向公众出售，也不在市场上交易，因为那时根本没有考虑政府要减持股权。这些不可交易的股份，就称之为“法人股”或“非流通股”，而可以在公开市场交易的股份则称之为“流通股”。法人股虽然不能在股票市场中自由买卖，但可以在场外私下交易。当时明文规定，两种不同类别的股“同股同权”，也就是法人股除了不能在公开市场交易外，其投票权、分红权等等，都是与流通股相同的。新桥所持的深发展股份正是法人股。由于法人股不能在公开市场买卖，缺少流动性，所以其场外交易的价格往往比流通股包含很大的折扣。这也是为什么我们在收购深发展的过程中，要和卖方谈判价格，而定价基础和流通股的市价毫无关系。长期以来，监管部门一直表示，随着股市逐渐成熟，就要改革制度，与国际接轨，最终会准许法人股变成流通股。时至2005年，法人股变成流通股的改革势在必行，否则股市就有些畸形，无法成熟。因为在任何成熟的股票市场，上市公司所有股票除了按规则短期锁定的以外，都可以自由交易。但按照证券监管部门通常的思路，股票交易量的增加和股价是成反比的，他们担心一旦允许法人股流通，就会对市值产生压力，流通股东就会不满，这是他们必须防止的。", "中国的股市创建之初，企业公开上市时发行的新股懂占总股数的一个很小的比例，而绝大部分都是不可流通的法人股。证监会担心，一旦允许法人股流通，就如开闸泄洪，对股价产生巨大的压力。最终，证监会出台了一个股权分置改革的政策，主要内涵是要求每个上市公司的法人股股东对流通股股东提供补偿，美其名日“对价”，以换取流通股东投票尤许法人股流通。“补偿”的理由是假设流通股增加了会对股价造成下行压力而使流通股东受损。其实后来的实践证明，多数法人股转成流通股之后股价非但没有下跌，反而上涨，而且涨幅和“补偿”多少无关。但不管怎么说，股改政策就是基于这个似是而非的理论形成的。而且，也是为了减少对股价的压力，证监会叫停了所有新股上市或在股市增发的活动。", "深发展的配股计划就撞到了这个节骨眼上，动弹不得。我们如果早一年入股深发展，就有可能在股市大门关上之前完成配股募资。可惜，历史没有如果。", "我从来认为，运气是决定投资结果的重要因素。成功的另一个关键要素是判断力，好的投资者多谋善断。第三个要素是勤奋和锲而不舍。这三个要素缺一不可。此时深发展运气不济，拿不到批准。但好像幸运之门又换了一个方向打开：财主找上门了。就在此时，美国的通用电气资本（GE Capital）找到我们，表示有兴趣对深发展投资。", "通用电气资本当时是全球顶尖的金融机构之一，在75个国家开展业务，可惜2008年全球金融危机后一蹶不振，最终拆分出售。找我们接洽时，通电资本正在亚洲积极扩张，希望投资中国银行业。通电资本是新桥几期基金的投资者，所以双方熟悉。它的团队认为，在新桥的控股和管理下，深发展是优质投资目标。我们虽然未放弃配股，但是认为，通过向通电资本定向增发来募资，至少可部分满足深发展的资本需求。新桥认为通电资本是个很好的合作伙伴，又是个金融领域的战略投资者，可以助深发展一臂之力。根据当时的银行监管法规，外资投资中国的银行，投资方必须是合格的境外投资者，单一持股不得超过20%，而所有境外投资者合计持股不得超过25%。作为一家大型金融机构，通电资本当然具备投资资格。按照新桥加通电资本持股不超过25%为限，我们计算出通电资本可以投入一亿美元，换取约7%的法人股新股。以此算出来的股价相当于新桥投资成本的2.5倍左右，但仍显著低于流通股的市值。在这个估值和增发的基础上，所有股东的股权比例会被摊薄7%，但每股所含的净资产会增加，如果市净率（股价对净资产的倍数）不变的话，股价应该上涨，因此对所有的股东都有利。", "我牵头与通电资本的代表谈了三个多月。通电资本虽说是全球型的大金融机构，资本实力极为雄厚，一亿美元对于这个公司是沧海一粟，但是他们在谈判时也是锱铢必较。", "2005年9月28日，纽曼与通用电气公司的董事长兼首席执行官杰弗里.", "伊梅尔特（Jeffrey Immelt）在北京签署协议。通用电气公司是通电资本的母公司，是全球名列前茅的大公司，其董事长亲自出面，专程飞到北京签字，可见重视。我们也认为这是件大事，把签字仪式安排在人民大会堂，比我们当初投资深发展的签字以及后来的交割都隆重得多。虽然是我主导的谈判，但我并没有参加签字仪式，因为从理论上讲，这是深发展和通用的交易，新桥不过是扮演了穿针引线的角色。顺便说一下，通用电气资本在当时是个如日中天的全球性大金融机构。", "我在摩根做投行时做过它的顾问。记得在1990年代中期，有一次我陪同它的董事长兼首席执行官盖瑞.温特（Gary Wendt） 乘坐私人飞机从香港去沈阳，看一个发电厂的融资项目。飞机上通电资本团队成员谈话时签贝集破来研的北做品酒易塑版，酱秀奖金：需路摄众查学温未基超：导调来一辆卡车，上面架一个飞机喷射发动机，发动起来，把机场跑道的雪融化，使得专机可以降落。降落之后，发现驾驶舱舷窗玻璃被冰块撞出一道缝，飞机只好停飞修理。因为当时没有直飞航班，我们全班人马只能坐民航的班机辗转返回香港。若干年后，董事长伊梅尔特退休，通用电气也陷入困境，一蹶不振。报纸中披露出来通用的高管花费过高，伊梅尔特本人任职期间，不但乘专机出行，而且每次两架飞机同飞，其中一架备用，其成本可想而知。但是因为和通电资本的温特一行飞过一次，我知道私人飞机如果出点儿故障，确实也耽误事。", "通电资本要投资的金额虽然不大，但是雪中送炭，会给深发展注入急需的资本金。签约之后，双方额手相庆。可是，定增也需证监会批准，此时好运到头了。接下来的几年里，深发展反复申请，银监会也帮助做工作，但证监会却一直没有批准，最后不了了之。勤陆品态鹎凿甲沯虫康宥玺齑鲍很火峨搓皆葱繟绲髅蹁凶膦紫鋆的鸓悲早晚可以解决，车到山前必有路，船到桥头自然直嘛。结果，一直找不到路，也看不到桥洞，而是四处碰壁。", "证监会为何不批呢？不同的时间有不同的原因。此时的原因很简单，就是股改。股改的官方政策是在自愿的基础上，但是，对任何未完成股改的上市公司，一律不批准任何募资计划，以此迫使上市公司实施股改。", "这有点像当年我们上山下乡，都是被自愿的。我们颇感沮丧，又无可奈何。但祸兮，福之所倚，最终我们因祸得福：增发失败也意味着我们不必稀释股份，而深发展也没有因此停止发展。银监会知道，深发展之所以未能募资，不是我们没有尽力而为，而是因为不可控因素。因此，虽然资本充足率远低于监管要求，但银监会延续了宽容的态度，为深发展赢得了时间。幸运的是，中国的经济腾飞和高涨的储蓄率，使深发展能够持续扩大存款规模，再也没有出现流动性紧张的问题。在经过试点之后，从2005年8月份起，股权分置改革全面铺开。虽然我们理解股改的重要性，但无意参与。为什么呢？因为新桥根本没有意愿将法人股换成流通股在市场上一点一点抛售。我们持有的股份形成控制权，拆散了就失去了控制权，当我们准备退出时，控制权可以卖出溢价。我们的打算从来是，将来退出时，将所持所有股份作为整体卖给战略投资人。而且，要深发展拿出与其他上市公司类似的股改方案也不现实。当时已经出笼的股改方案是由法人股东向流通股东送股，以换取后者投票同意法人股转成流通股。送股的方式一般是10送3，也就是说每10只流通股可以获得3只法人股。对于国有控股的公司，国有法人股可能占总股数的70%到80%，送得起。譬如法人股占80%，流通股占20%，那么10送3等于流通股拿到6%的额外股份。结果是法人股东的股份从80%减到74%，而流通股的比例增加到26%。然而，深发展的法人股统共不过20%多，如果按照10送3的比例，全部拱手相让也不够。所以深发展最初打算不参加股改，毕竟政策很明确，参加与否自愿。", "后来事实证明，我们过于天真了。", "证监部门开始巧妙地施压。根据深交所的规则，我们与通电资本的协议须及时披露，并由交易所批准后公告。签约当天，深发展递交了公告文稿，但交易所拒不接受。主管官员们说，深发展必须承诺股改，他们才会批准公告。这本来是两件不相干的事情，而且我们并无股改计划，无法承诺。既然我们递交了公告稿，按理说就满足了上市规则，但两天后，深交所公开谴责深发展未能及时披露与通电资本的协议，让我们哭笑不得，又无可奈何。这就像警察命令司机停车，然后以违章停车为由开罚单，简直是不讲道理，令人抓狂。其实，我们一直与深交所保持着良好的工作关系，多年来交易所的官员给我们很多帮助。深交所不能强逼我们股改，于是就找法子引导我们，当然有时手法形同要挟。他们明知深发展情况特殊，不能和其他上市公司一样送股，却硬要我们做无米之炊。我去找主管官员发牢骚，说这是强人所难。他们只是笑，既不辩解，也不让步，但态度很明确，不管你们是否乐意，有多大困难，如何想方设法，深发展必须实施股改。不得已，我们只好制定一套股改方案。按股改政策，任何股改方案须得到三分之二流通股东的批准，而深发展有几十万散户。我觉得这简直就是与虎谋皮，就像新桥去问流通股东：“送多少股，你们才会投支持票？”那岂不是多多益善吗？由于其他上市公司送股都很慷慨，流通股东的期望值被拉高了，我们根本无法满足。我们和深交所及持深发展流通股比例比较大的公募基金讨论了各种方案，虽然百般努力，未能产生一个令各方满意的方案。", "股改启动近一年后，深交所对我们失去了耐心。2006年3月31日，深发展向交易所提交了经审计的财务报告，但官员告知我们，除非深发展给出股改时间表，否则不接受审计报告。不能按时发布年报违反上市规则，后果严重。我们别无选择，只得加紧制定股改方案。经过大量的工作、讨论和协商，深发展于2006年5月29日公布了股改方案。根据方案，在股价浮动到一定区间时，深发展专门向流通股东支付一笔特别股息，而法人股东没份。这种区别对待实际上是利益转移，通过深发展将法人股东的利益转让给流通股东。利益转让是证监会股改政策的实质，只不过各个公司转让的形式和价值不同而已。", "我们的方案和其他上市公司的相比，根本区别在于新桥不免费送股。我们认为所持的股票是有限合伙人的财产，新桥无权慷他人之慨。但我们同意，如果股价在市场上的走势高于或低于某个特定区间，深发展就向流通股股东支付特别股息。深发展资本金短缺，本不该支付现金股息，但为了完成股改，不得已而为之。", "我们认为方案对于流通股东是有吸引力的。我们相信深发展的股价被低估了，因为股改通不过，深发展募资的计划受阻，当然影响它的市值；如果方案获批，深发展前途一片光明，股价也会随之上涨。流通股东也应该认识到，即使特别股息没有其他上市公司的股改方案让利来得丰厚，但如果获批，股价会飙升，获益的是他们自己；反之，如果方案被否决，深发展股价也会遭到拖累，受伤害的也是流通股东。新桥近期内不打算出售所持股份，所以至少在短期内，股价的涨跌与新桥无关。但许多流通股东持股的目的是为了短期交易，所以阻止方案的通过不符合他们自己的利益。我们推断，如果流通股东比较理性的话，会同意这个方案。然而，我们也没有低估阻力。“如果说深发展是驶向成功的列车”，纽曼在6月对一家全国性报纸说，“那么股改就是目前最难上的坡。”纽曼说的没错。接下来的一个月左右，我和深发展及新桥同事一道，拜访了许多持有深发展股票的公募基金和其他主要股东，游说他们投赞成票。纽曼也与一些大股东交谈，频繁接受媒体采访，宣传我们的方案。", "我向一位又一位基金经理解释了深发展遇到的困难，取得的进步，为何这次股改将为募资和腾飞铺平道路。我还告诉他们，这是我们能提供的最好方案，再挤也挤不出来了；如果流通股东否决方案，只会搬起石头砸自己的脚。有些人将信将疑，但许多人表示了理解和支持。看来股改方案有望通过。", "2006年7月17日，深发展在总部礼堂召开了特别股东大会，对方案表决。按照规则，网上表决已于四天前开始。现场计票结果显示，按股数计算，出席会议的流通股东中有三分之二支持此方案。但根据规则，需由包括弃权股东在内所有参与投票的流通股东三分之二批准，换言之，弃权算作反对。加上在线表决的票数，结果仅有39%的流通股赞成，31%反对，24%弃权，离三分之二赞成票的门坎还差得远呢。表决结束后，深发展股价应声下跌了18%。果不其然，受损的是流通股东自己。但我想很多流通股东并不傻，他们知道深发展早晚会被监管部门逼着完成股改，因此这次否决了，下次新桥和深发展还要拿出对他们更为有利的方案。当时媒体上出现最多的词汇是“博弈”，股改就是两类股东之间的巨大博弈。"], "wcount": 6909}, {"icon": "17", "title": "第十七章 稍纵即逝", "paras": ["山穷水尽疑无路，柳暗花明又一村。这又一村还真在眼前若隐若现了。股改方案被否决之后过了大约一周，我收到邀请，去会见平安保险集团的董事长马明哲，说是要商谈共同入股南方航空的事。时不时有人来找我们寻求合作，所以我也没有多想。", "2006年7月28日，我来到深圳。那时平安的总部还在一栋并不起眼的办公楼裹。中午，我见到了马明哲，以及总经理兼首席财务官张子欣。作为一位成功的企业家，马明哲大名远扬，但这是我们第一次谋面。他高大魁梧、身姿挺拔，留短发，加上略微黝黑的皮肤，看上去不像生意人，更像一名退伍军人。他在二十世纪八十年代末创立了平安，以后该公司迅速发展壮大，其时已经成为次于中国人寿的中国第二大保险公司。成立初期，平安引入了摩根士丹利和高盛作为战略投资者。2006年，平安已经在港交所及沪交所两地上市，市值高达150亿美元。马明哲热情接待了我。寒暄之后，切入正题。很快，他亮明真正目的。", "原来投资南航只不过是一个幌子，他的真实意图是想入股深发展。马给我的诱饵是，平安支持深发展的股改，有一个方案，而且他说平安入股后，新桥可以继续保留控制权，并享有卖出期权。也就是说，新桥决定退出时，可以按照之前约定的行权价将股份卖给平安。所谓卖出期权，也称之为沽权，英文是Put Option，是指在一定期限内，按照已经确定的行权价，卖出股票的权利。一般而言，期权是个权利，而非义务，持有者可以决定是否行权。", "按照与深圳市政府以及银监会的约定，新桥承诺五年之内不退出，此时我们仍然在锁定期内。这一点马明哲是清楚的，他想和我谈判的是，当锁定期结束时，新桥把股票卖给平安。", "马明哲惦记深发展不是一两天了。就在新桥入主前那个月，平安还没有放弃努力横刀夺爱。其实在我和马见面之前，他通过各种渠道也表达过对收购深发展的兴趣，但我们没有认真考虑。因为那时新桥刚刚完成收购，正忙着大刀阔斧地改革，根本不可能考虑退出。而当下，我们在股改问题面前一筹莫展，马的提议有点像久旱逢甘霖，最起码使人感到飘来了一片云，虽然还未涉及具体。那天，我们只是简单聊了聊他的大概想法。但我心想，这事儿有门儿，只要新桥继续拥有深发展的控股权，平安入股对双方来说都是利好，能够帮助深发展解决募资和股改两大难题，一举两得。", "控制一家全国性银行是马明哲战略构想的重要步骤。平安在2003年收购了一家很小的银行，原来叫做福建亚洲银行，既无分支机构，也无零售牌照。收购后，平安将其更名为平安银行。我后来才知道，就在我和马见面当天，平安与深圳市商业银行签署了协议，收购后者89%的股份。深商行就是王骥曾经任行长的那家银行。我想那天马和他的团队也够忙的：像刘伯承在打淮海战役时说过的一句话，吃一个（福建亚洲银行）、夹一个（深商行）、还看着一个（深发展），胃口大得很。", "平安银行和深商行都没有全国性的牌照。深商行是城市银行，只能在所在的城市发展业务。而深发展是拥有全牌照的全国性银行，可以在国内任何地方发展业务，总资产规模大约是深商行的三倍。如果深商行是条河，那么深发展就是海，一望无边。平安拿到深发展，犹如鲤鱼跃龙门，可以成龙。", "两周之后，平安的张子欣和理乍得德.", "杰克逊 （Richard Jackson）来见我。张子欣是土生土长的香港人，说着一口流利的英语，地道的英伦腔。他拥有剑桥大学的博士学位，加入平安前是麦肯锡（McKinsey）的全球合伙人。加入平安后一路晋升，历任首席财务官、首席运营官，及至平安集团的总经理。他40出头，戴一副浅棕色的眼镜，面容清癯，有点儿少白头，所以显得比实际岁数更老练。", "理乍得德.杰克逊是个英国人，五十岁出头，有些不苟言笑，但也还随和。他曾为花旗银行打拼了20年，还担任过花旗韩国的总经理，不过我和他在韩国并未交集。马明哲任命他主管平安收购的第一个小银行，深商行并入后，他管的平安银行才开始有些规模。后来中国的金融圈内称纽曼是“最英式的美国人”，而杰克逊则是“最美式的英国人”，大概是因为他说话直来直去，并非人们想象中英国绅士的客套。平安是个令人尊重的大公司，又是一家金融机构，如此郑重其事，我们也需认真对待。眼下我们正苦于股改碰壁，如果平安能够帮忙，无疑是雪中送炭。他们两人把平安的提议摆在了桌面上：深发展向平安定向增发新股，使平安获得51%的股权；同时，平安给予新桥沽权，在五年锁定期后，新桥有权以行权价把所持深发展的股票卖给平安。他们尚且没有报出行权价，此时只是想知道我们对交易架构有什么意见。在我看来，架构没问题。我们对五年不退出的承诺非常在意，沽权的方式解决了这个问题：在锁定期满之前我们仍然持有股权，沽权等于给我们将来退出一个保底价，关键是什么行权价。再者，如果能够通过增发的方式一次性补足深发展的资本金，而增发的价格合理，那么所有股东都会欢迎。", "不过，我担心一次性增发51%的股份是否过于激进，因为这会导致总股数翻倍，现有股东被摊薄一半，而每股收益被腰斩。我寻思着，如果少一些，比如增发30%，股东或许更愿意接受。同时，平安可以通过从市场上公开收购21%的老股，达到持股51%的目的。如果在市场是收购老股，有助于推高股价，股民肯定高兴。但我也想知道，他们打算如何支持股改。如果股改不能完成，一切都是空谈。在接下来的几周里，双方围绕这几个问题谈判，但是没有产生一个双方都可以接受的方案。9月5日，马明哲又让杰克逊来见我。这次他更主动，表示马非常希望能和新桥做成交易。他提出，平安给新桥沽权的行权价按照使新桥的投资获得35%的内部收益率（Internal Rate of Return或IRR）计算。内部收益率等于年化复合收益率，就如同把钱存在银行里，银行支付每年35%的利率，而且利滚利。", "但听完他的详细描述之后，我明白，平安要给的并不是个沽权。沽权是个单方面的权力，可以行使也可以不行使。平安要的是新桥承诺在锁定期过后用这个价格把所持股票转让给平安，所以不只是权利，而且还是责任。在一般情况下，平安的出价不能不算合理，一个投资按35%的RR计算，五年就可以回收4.5倍。但是在深发展的投资上，我认为这个回报率是不够的。我们在这个项目上倾注了大量的心血、资源和时间，从收购到改造，我们呕心沥血、殚精竭虑。改造已经初见成效，如果最终成功，我们可以获得的回报应该远不止于此。到底多少，我们自己也不知道，所以我们期望的回报要更高一些。在此次谈判前的三年中，中国经济每年实现了两位数的增长，2006年国内生产总值的实际增长率将达12.7%，而且这个势头方兴未艾，在这样的宏观条件下，银行的价值会水涨船高，我们哪能现在就接受一个封顶的价格呢？", "我对杰克逊说，“平安如此厚爱，让我们受宠若惊，很感谢你们表示可以帮助深发展股改。完成股改确实是当务之急。”但是，我话锋一转，很客气地告诉他如果是真正的沽权，我们可以行使也可以不行使，35%的IRR没有问题。但如果是必卖的价格，并不能打动我们。为什么呢？沽权等于是保底，如果将来市场价格上升了，我们可以不行使沽权，按将来的市值卖。但如果是必卖的价格，等于是封顶价。过了两天，杰克逊又来见我。他还是不同意给新桥真正的沽权，他说需要我们承诺将来退出时必须把股权卖给平安。如果我们把股权卖给第三方，平安要到达持股比例的目标就落空了，这不行。为了让我们一定卖给平安，他可以加码，同意给新桥45%的IRR。如果是35%的IRR，五年可以实现的价值是投资成本的4.5倍，而45%的IRR，倍数就增加到6倍。我动心了，觉得这个回报率相当不错了，而且是担保的。我说可以考虑。", "我把杰克逊的提议转告给了合伙人，大家和我的看法一致，认为可以接受。价格从来都是任何交易最为核心和关键的问题。就这样，我们在这个关键问题上和平安达成了一致。", "与此同时，我们还在和深交所探讨股改的方案。9月6日那天，我拜访了深交所，和他们探讨了一个又一个新方案，但他们一一否决了。看来，除非我们按照他们的说法“吐点儿血”，也就是说送一些股给流通股东，否则什么方案也通不过。开了半天会，一无所获。当初在评估深发展项目之时，从未想到还会有股权分置改革这种事。其实，不可预见的政策改变，一直是在中国投资的一个巨大风险。从原则上来讲，送股是不可能的，因为这是我们投资者的资产，我们怎么有权力免费送人呢？但是不送，又无路可走。我们可以拖，但深发展拖不起，只有跨过这个门坎才能向证监会申请增发募资，否则深发展就没有资本金可以发展了。现在我们成骑虎之势，进不得退不得，如之奈何？现在看来，也许平安能帮助我们解开这个套。", "9月底，双方又见面了。这次，杰克逊带了不少人，其中包括平安聘任的顾问团。在新桥一方除了我，还有潘德邦、陈琪和钟德俊，以及海问律所的江惟博。看这个阵势，就知道双方都很有诚意。", "讨论的主题是深发展的股改方案。经过一番商议，一个方案浮出了水面：平安方面同意，作为向平安定向增发一揽子计划的一部分，深发展向流通股东派发“看涨期权”（Call Option）权证，每10个流通股派发10份权证。看涨期权和沽权的作用相反。沽权也可以被称之为“看跌期权”，持有者在股价跌到行权价之下，就赚了，跌得越低，赚得越多；而看涨期权使持有者在股价涨到行权价之上就赚钱，涨得越多，赚得越多。如果看涨期权的行权价已经低于股票的市值，被称之为价内 （in themoney）期权，反之则是价外 （out of the money）期权。即便价外期权也有价值，因为是个权利，如果股价上涨，超过行权价，持有者自然可以行权而获利。不用说，已经是“价内”的期权价值更大，反映在市价和行权价的差别上。我们考虑的是向流通股东提供价内期权。我们判断，这个方案对于流通股东应该有足够的吸引力。双方就向平安定增的股价也达成了一致，每股8元，相对于20个交易日收盘价的均价加一定溢价。定增的规模为总股数的30%。向平安定增是关键，对深发展意义重大。我们成天为资本金不足发愁，如此一来，可以彻底摆脱这个烦恼。平安还同意在公开市场要约收购深发展的股票，收购的股票占总股数的比例不超过26%。所谓“要约收购”是股市的专用词，指买方按固定价格在股市上公开收购指定的股票，直到预定的股权比例。平安在市场上收购深发展的股票，会抬高股价，如此一来，派发给流通股东的看涨期权就更值钱了。这样，不但流通股东会高兴，相信监管部门也会乐观其就在此时，海问的江惟博律师提出了一个问题。他说，如果新桥现在就同意将深发展的股份卖给平安，即使是过了锁定期才交割，这仍然属“远期出售”，因此有悖新桥5年内不退出的承诺。而且，如果“远期出售”，我们可能会立即失去投票权。这两者对于新桥来说都是无法接受我提了几个解决这个问题的想法，但杰克逊都不屑一顾。他说平安的律师认为只要新桥不过户股票，就不会失去投票权。但双方的律师一碰头，马上取得一致意见，认为新桥失去投票权的风险确实存在。谈判就此卡壳了。", "此时，国庆节7天长假已经开始了。我建议双方在放假期间加班，解决所有未决的问题，争取在节后开市之前敲定协议。但是平安团队不愿意加班，要么是因为他们已有了假日的安排，要么他们觉得这几个问题无解，为此牺牲假期不值当，总之，他们不同意在假期见面。我担心的是夜长梦多，事情一拖就可能拖黄了。但是对方好像不在乎，没有同样的紧迫感。新桥在全亚洲投资，所以我经常在亚洲各国之间飞来飞去，为不同项目奔波。而且，我很少放假，一个地方有假期了，我就飞到没有假期的地方去出差。那时我没把和儿女一起度假看得很重，经常为了工作牺牲原本应该和孩子们在一起的时间。转眼之间，他们长大了，现在轮到他们没时间和我玩儿了，这让我懊悔当初。做父母的人生中的第一要务应该是与孩子多花时间。既然国内放假了，我就飞去了越南的河内，看一些投资项目。10月4日，我正和越南一家银行的行长吃午饭，接到马明哲的来电。我对同席的人说，“抱歉，失陪一下。”然后离席去讲电话。", "他问道，“伟建，你说下一步该怎么走 能把深发展的交易完成？”他看来很着急。我心想，皇帝急，大臣不急，要是您的团队也着急就好了。我对他解释了双方碰到的难题，为什么律师认为远期出售股份的安排不妥。但是，我说我有一些新想法，应该能够解决这个问题，您要是有兴趣的话，我吃完饭之后再给您打回去。他说，好，等你的电话。", "几个小时后，我们又通了电话。", "我说：“您看这样行不行：平安向新桥发出一个不可撤销的要约，收购我们所持深发展的全部股份，要约价格就是按双方已经说定的内部收益率计算。但是新桥暂时不接受这个要约。”按照合同法，一方提出收购要约，另一方正式接受之后，双方才产生合同。如果一方提出要约，而另一方还没有接受，那么双方就不存在合同关系。我建议平安向新桥发出的要约，是敞口、不可撤销的；我们拿在手里，不做任何反应；在锁定期之后，我们一旦接受，双方之间形成合同关系。在接受之前，双方之间并无契约关系，因此也就没有律师们所担心的“远期出售”的问题了。", "马明哲关心的当然是怎么才能确保新桥会在锁定期之后接受要约，把股份卖给平安。他说：“按照你的建议，你们可以高枕无忧了，任何时候接受要约，平安必须买你们的股份。但我们怎么确定你们最终会接受呢？”我说，“我们现在没法承诺，否则，就会被视为与平安形成了合同，律师说的那些问题就无法解决。但是我们可以承诺永远不会卖给任何第三方。这样，新桥只剩下两个选择，要么不卖，要卖就只能卖给平安。”马接着问：“如果你们永远不卖呢？”我已经预料到他的问题了，回答说，“从理论上讲，新桥有权永远不卖。但新桥赚钱的方式是靠实现投资回报，永远不卖就永远实现不了。我们的每期基金都是有限期的，锁定期之后，我们必定要退出。”我进一步建议，“您的要约可以有个截止期，比如在新桥投资5周年之后的几个月内到期。如果我们在期限之内不接受，又不能卖给任何第三方，那么我们就永远无法退出，等于钻进了死胡同，对我们有什么好处呢？”马静默了几秒钟，然后说，你把这个想法告诉杰克逊，和他商量一下。那天我忙得团团转，一个会接着另一个。到了傍晚，我抽空给杰克逊发了一条短信，约他通话。次日才和他通上电话。不料，他不假思索，一口拒绝了我的方案，说律师不会同意的。不知何故，我和他很难沟通，不管我提什么建议，他的第一反应就是不行。我央求他不要急着说不，先去和律师商量一下。我从来认为，不能把律师的意见当圣旨，凡事都要问个为什么。律师未必总是正确，而且很多律师，未必能想出解决问题的办法，但善于把别人提出的任何建议都批驳的体无完肤，能够帮助人解决复杂问题的律师才是真正的好律师。10月6日星期五，我和杰克逊加上他的顾问团开了电话会议，参会的也包括他的律师。当时我刚刚抵达香港机场，等候转机飞往东京。会开了45分钟。结果，没有一个律师反对我的方案，只是提出一些技术性的问题。我一一解答之后，他们表态说方案可行，新桥的投票权也不会成为问题，而且这个方式对双方都有利，因为平安也不希望新桥在退出之前失去控制权。他们还认为，这么做还有助于股民和监管部门接受与平安的一揽子计划。", "有了律师的背书，杰克逊仍然举棋不定，说要再考虑考虑。我提醒他，此时是周五，要想完成交易，双方必须在24个小时之内就全部主要条款达成一致，然后在周日召开董事会，批准交易，这样在下周一市场开盘之前我们可以通知深交所，申请深发展的股票停牌，发公告。这个时间窗口非常重要，因为双方约定增发新股的股价是8块一股，懂比节前20个交易日平均收盘价有些微溢价，如果在开市时不能停牌，股价涨上去，这个交易就可能做不成了，因为董事会、股民和监管部门都会认为增发价太低了。可是一直等到周六下午，他才给我打电话。让我吃惊的是，平安方面又变卦了。本来说好给新桥要约的收购价以45%的IRR计算，现在他们要降到40%。而且，平安也不打算在二级市场上做要约收购了。", "我断然告诉他：不行。平安是否在二级市场上收购股票悉听尊便，但要把给新桥的内部收益率降下来，这个交易就告吹了，根本没有讨论的余地。", "我知道，杰克逊既无杀伐决断的本事，也无这等权力，回去商量之后还会来找我。我担心的不是平安就此一走了之，而是剩下的时间不够了。果然，周日下午他来电，而且只是建议当晚开电话会议。会上，他不再坚持降低IRR，但要求深发展对平安增发的价格从每股8元降到7.25元。他还强调说，这是平安能出的最高价了。", "证监会有规定，上市公司定向增发价格不得低于前20个交易日股票收盘价均值的90%，或不低于前一日收盘价。平安的最新报价，还是高于前者，但低于后者，给市场的观感不大好。而且，到了这个节骨眼了，平安来了这么一出，变化之大，让我有点瞠目结舌。如果只是涉及新桥，我也许可以擅断，但降低增发价涉及深发展和所有股民的利益，不是我一个人可以说了算的，必须征求新桥合伙人和深发展董事会的意见。我后来想，所有这些颠三倒四，可能都是杰克逊自作主张，在最后一分钟对我施压，以改善交易条件。其实他的反复，对于平安而言，都无关大局，平安不可能因小失大，为了几个小便宜，放弃整个交易。譬如RR的问题，我毫不退让，他就缩回去了。我当时没有想到，应该直接给马明哲打电话。但马要求我和杰克逊谈，所以在我的心理上设置了一个障碍，觉得绕过杰克逊不妥。不管怎么说，我只好和他纠缠。时间就这么一分一秒过去了。", "我对杰克逊说，我会向内部转告他的新提议。当时我满脑子盘算的是，时间已经所剩无几，深发展必须赶在次晨开盘前停牌，而新桥内部召开电话会议也需要时间。", "10月9日早上7:30，新桥召开电话会议。我在会上报告说，平安在最后一分钟改变主意了，要求降低增发价，否则就打退堂鼓。与会者听了都很失望，但商量之后，还是决定完成交易对于深发展来说利大于弊，董事会、股民和监管部门会理解的。但是此时已经没有时间在开市前和董事们打招呼了，我们只好先要求深交所停牌，之后召开董事会讨论。", "此时已是早上8点了。股市9:30开盘，我们必须和时间赛跑。谁知，杰克逊又节外生枝，发来一封邮件，要求将合约中的适用法律更改为中华人民共和国法，本来新桥的提议是新桥方指定适用法。按照习俗，适用法律应该是双方都不在的管辖区的法律，譬如中国香港或新加坡。之前，平安没有提出异议，我们以为这是个已决问题，不料在此刻冒出来了。", "我看了看他邮件上标明的时间：上午8:49，离市场开盘还有41分钟。到了此时了，他不给我打电话，而是发邮件，毫不担心我可能没有及时收到。我拒绝了他的建议，反过来建议使用英国法律。他不同意，又反建议用香港法律，香港仲裁解决任何争议。他邮件的时间显示9:06。我接受了，因为我觉得双方各让一步是公平的，更重要的是，没时间了。", "我算是服了。他这种谈判方法简直就像两人面对面开车，看谁先躲闪。", "我要是不勐打方向盘，就和他同归于尽了。因为确实没时间了，连形成文字的时间都没有了。放下和杰克逊的电话，我立即拨通了深发展董事会秘书徐进，请他通知深交所，深发展的股票停牌，之后，通知所有的董事，在当天下午召开董事会。", "此前，平安团队中的证券交易顾问在会上曾说，股票停牌很简单，只要给交易所打个电话就行了。他们是专家，我们信以为真。结果根本不是那回事。过了一会儿，徐进来电话，说股票交易一日两场，上午下午各一场，问了深交所，如果停牌，必须在上午9点之前申请，否则只能等到下午。这是因为9点到9点半之间是盘前交易时段，深交所在这个时段接受并登记买卖盘订单，所以过了9点就不再接受上午场停牌申请。而且，按规定，停牌申请必须是书面的，要提供理由，不是打个电话就行。所以，此时最快可以停牌的时间是下午场。无奈之下，我们只得赶出一份书面申请。徐进将我起草的申请送达深交所，虽然他对为何停牌一无所知，我在申请上写的原因也含煳其词，只说董事会要讨论股改和增发。", "就在此时，我又收到了杰克逊的邮件说，根据马明哲的要求，深发展不必停牌了，平安决定退出交易。这犹如当头一棒，打得我晕头转向。果不其然，那天股市大涨，深发展的股价也一路上扬。后来我听说，马对我们没能及时停牌很不满，认为我们是故意拖延时间，想利用股市上涨来抬价，所以他干脆取消了交易。其实我们根本无从判断股市走向，而且真心要完成交易，未能及时停牌的责任在他自己的团队，而不在我方。杰克逊拖拖拉拉，到最后一刻还在变来变去，最后坐失良机。", "我恳求杰克逊不要取消交易，否则机会不再。我还对他承诺，虽然股价上涨了，新桥还会坚守商定的增发价格。但他无动于衷，说马总已经作出决定，说什么也没用。", "我心想，平安内部的沟通肯定有问题。杰克逊不懂中文，而马明哲的英文水平有限，他俩之间的交流肯定会产生误会。后来，马告诉我，那天开市之前，他曾打电话给深交所的理事长，对方对深发展的停牌申请毫不知情，因此他断定我们压根儿没有申请停牌。其实，是理事长不知道，他的手下拒绝了深发展董秘的电话申请。", "事已至此，我们只好再次联系深交所，撒回停牌申请，如此反复，让我觉得十分难堪。更难堪的是，我还不得不给每位董事打电话，一一解释，为什么先是通知召开，现在又要取消董事会，但还要保密，不能把整个故事和盘托出。我觉得丢尽了面子，干出如此不靠谱的事情。谁想到，事情还没完。杰克逊在12:01又来邮件了，说收到马总指示，要求深发展在午间歇市时再次申请停牌。我心想，您就不能打电话吗？如此关键时刻，这么重大的事情，您就发个邮件了事。要是我没及时看到您的邮件怎么办？那岂不要误大事？我想那时马明哲大概已经从深交所理事长那裹得知，深发展确实及时申请停牌，但被驳回，没有停牌的责任不在我们，所以他改变了主意，还想完成交易。", "但我一口回绝了杰克逊。出尔反尔的事我做不来，宁可丢了买卖，也不可丢了信誉。申请停牌是个大事，岂能一会儿要，一会儿不要，一会儿又要？召开董事会也是大事，通常要至少提前三天通知，今天事发突然，只好紧急召开，通知之后，又取消，已经非常尴尬，岂能一而再，再而三，如何向董事解释？无论如何，今天开不成会了，只能等明天再说。结果，没有明天了。那一天，深发展的股价飙升6%，收每股8.69元，此后，头也不回地每天往上走，年底最后一个交易日的收盘价冲到了14.47元。按照这个势头，董事会绝不会接受平安7.25元的报价。机会的窗口关闭了。有时，做大买卖就像打仗，战机稍纵即逝。"], "wcount": 9019}, {"icon": "18", "title": "第十八章 天壤之别", "paras": ["虽然在董事会和纽曼的出色领导下，深发展的经营面貌显著改善，但资本金仍然捉襟见肘。要实现转型增长，就必须突破这个瓶颈。好比我们把船舵修好了，漏洞堵上了，发动机也打着了，但油箱中缺油，船无法全速前进。不完成股改，证监会是不会批准深发展募资的。如果平安的交易达成，一切问题会迎刃而解。谁料阴差阳错，煮熟的鸭子竟飞走了。我们只好回到起点，和流通股东盟商股改方案。其实，流通股东并非一个不变的整体，股票每天都在易手，股东的构成随之每天变化，所以我们瞄准的也是移动目标。但不管谁是流通股东，冀求的无非是股价上涨和法人股东输送利益。如果股改不能完成，这两者都不可得。我们专门组织了一个股改团队，成员包括新桥和深发展的高管。", "韦杰夫辞去了行长的职务。深发展需要一位新行长，我们把交通银行深圳分行行长萧遂宁给挖过来了。萧曾是我们的谈判对手，很不好对付，双方曾经唇枪舌剑、互不相让。此人为人正直、坚持原则、又小心谨慎。在专业上，他知识渊博，经验丰富，和我们很有共同语言。棋逢对手，将遇良才，他赢得了新桥团队的尊敬。当然，他之所以愿意加盟，大概对我们也有同感。更重要的是，改造深发展功德无量又极具挑战，对于愿意有所作为的他也是机会难得，所以没费多少口舌，他就走马上任了。他深知深发展亟需补充资本金，上任之后第一件事就是负责股改。", "萧是电气工程师出身，搞了很多年水力发电。他拥有多个专利，最不可思议的是，其中包括一个可以植入人体的微型装置，用于阻塞对肿瘤的供血。他知识面之宽，员工开玩笑说他“地上的事无所不知，天上的事也知道一半。”此人是谈判高手，我们早已领教，此时要与流通股东谈判，非他莫属。", "新股改方案逐渐成形：深发展向流通股东派发认股权证，或称看涨期权，类似平安之前的提议。认股权证可收一箭双雕之效：既可以争取股东对股改的支持，又可以筹钱补充资本金。认股权证应该对股东很有吸引力，特别是“价内”权证—行权价低于市场价。如果不想行权，卖给别人，马上可以赚钱。2006年底，深发展的股价已经涨到了14.47元，在短短不到三个月，与跟平安当初谈好的增发价（每股7.25元）相比，几乎翻了一番。因此，权证的行权价也可以相应定得比较高。", "认股权证对包括新桥在内的法人股东不利，因为他们没份儿。当权证被行使时，法人股东的股权就被摊薄了。但我们觉得为了完成股改，这是必须付出的代价。", "股改团队分头出击，拜访持股较多的流通股东，和他们协商，在他们反馈的基础上修改方案。我们也征求了证监会的意见，将其反映在方案之中。万事俱备之时，在深交所卡壳了。按照公布的规定，股改方案是法人股和流通股两群股东之间相互协商的产物，最终交由流通股东大会批准，监管部门母须事先审批。深发展第一次付诸表决的股改方案，深交所没有参与意见。但此次不同了，深交所要求必须经其批准之后，方案能向股民公布。深交所认为，光是认股权证还不够，法人股东还要向流通股东赠送“真金白银”。其实，监管部门也不是没事找事，横插一杠，而是担心深发展的方案再次流产，影响大局。当大部分上市公司已经股改完毕，而深发展是仅存的钉子户之一，深交所担心深发展成为改革大功告成的绊脚石。在他们看来，法人股东出血越多，流通股东批准的可能性就越高，而新桥和其他法人股东的利益则不是监管部门所关心的。", "此时，证监会又出台了两项新规，给发行权证设置了新的障碍。第一，未完成股改的公司不得发行权证；第二，发行权证的公司需有三年分红的记录。而深发展多年没有分红了。这就把我们难住了。", "深交所的一位领导建议：“你们可以发认股权证，但不是认购新股，而是买法人股东所持有的股份。”我说，您这不是变相要求我们赠送自己的股份吗？我们不能答应。", "第一次股改方案曾经打算向流通股东定向分红，我们勉强同意了。这次，我们提出既定向分红，满足必须有分红历史的新规，又加上派发认股权证，这样应该可以使证监部门满意了吧。可是一波未平一波又起，2006年9月，银监会又出台新规：资本充足率不达目标银行不能现金分红。这项新规不无道理，因为现金分红会进一步消耗银行的资本金。", "但是两个监管机构的新规相互矛盾，使深发展进退失据。我们与深交所交涉了好几个月，毫无进展，尽管官员们都表示愿意帮助深发展走出股改阴霾。本来，证券监管部门是证监会，不是证交所，但是，股改全面铺开后，大部分与股改相关的权力下放给了证交所，所以我们要与深交所密切协商。股改接近尾声，监管部门完成任务的压力愈来愈大，也急于和我们一起找出路。我们则不断想办法，拿出一个又一个方案，希望能够同时满足监管和流通股东的要求。", "天无绝人之路。2007年4月，转机出现。深发展的股价突破20元关口，月底直逼25元。市场行情回暖带动了深发展的股价上涨，而由于第一季度业绩攀升，深发展跑赢了大盘。2007年一季度，深发展的净利润同比增长129%，而这个增长是在2006年对2005年同比增长超过350%的基础上实现的，因此更为难得。此时，市场普遍认为深发展的管理日臻完善，若能打破股改僵局，股价还有更大的上升空间。因此，本来监管部门逼着我们“吐血”一赠送股份，现在从流通股东的角度看，无论法人股东吐多少血，与完成股改后股价上涨的空间比起来都算不了什么。4月11日，我专程拜会了深交所的总经理张育军和其他领导。大概牛市也使他们兴奋，他们的情绪很好，态度变了，对于我们新提出的股改方案表示支持，至少没有像前几次一样一口否决。张育军建议我们与大的流通股东盟商，听取他们的意见，获得支持。这些建议很中肯。此后的几天内，我和萧遂宁逐个拜访了几家大股东，他们合计持有深发展约30%的流通股。这些股东主要是共同基金，但也有合格境外投资机构。和境内机构有所不同，境外机构更关心的不是从法人股东身上割下几两肉，而是希望股改方案尽快通过，打开股价上升的空间，所以支持任何方案。到了此时，境内的股东也希望深发展尽快过关，但他们还是很在意股改带给他们的直接好处。完成一轮对大股东拜访之后，我给张育军写了一封信，汇报沟通的结果以及股东们提出的建议。我写道，他们都强烈要求尽快完成股改，只有这样，深发展才能募集所需的资本金，从而实现更快的增长。他们都相信，一旦股改完成，深发展股价将会大涨。特别是境外机构，更关注的是股价的走势，而不是法人股东能赠送什么，他们也知道深发展缺少资本金，现金分红等于釜底抽薪，对银行并不利，他们倒是更愿意获得“价内”的认股权证。", "流通股东的反馈对于监管部门很重要，比我们对监管部门的说服力要大得多，毕竟，方案能否通过取决于流通股东。走访流通股东竟然产生了意想不到的效果。股市敏锐地察觉到，深发展的新方案即将出笼且有望通过，市场评论员们添油加醋，助推了股价的上涨。在我们和流通股东磋商的同时，深发展的股价每天都在上涨。股东们都兴高采烈喜笑颜开，因此也特别通情达理。我从不指望靠走运成事，但是，这次我觉得运气真来了，挡也挡不住。从年初至4月底，深发展的股价居然暴涨80%。市场欢欣鼓舞，公布股改新方案的时机到了。萧遂宁再次向深交所当面汇报了最新方案。之后他打来电话，说沟通很顺利，深交所满意，并建议他去一趟北京，将方案报证监会审批。经过反复磋商，我们修改了股改方案。新方案包含两部分：第一，向流通股东派送红股，就是按持股比例送新股（不再是现金分红）；二是向包括法人股东在内的所有股东派发认股权证（之前的方案法人股拿不到权证）。股息用红股而不是用现金支付是为了同时满足证监会和银监会的不同的要求：证监会要求有分红的历史能发权证，所以必须分红；银监会不许现金分红，所以只能用股票当红利。由于股票红利只派送给流通股东，而法人股东没份，这就相当于将法人股东的股权摊薄7%。我们曾表示法人股东所持股份不能拱手相让，当然被摊薄的效果和赠送股票差不多，但至少从形式上我们信守了承诺。方案第二部分是向全体股东以10：1的比例派发认股权证。因为流通股东可获得股票分红，因此相应地也会获得更多认股权证。行权价格为方案公告前20天平均收盘价的85%。2007年5月8日，萧遂宁向证监会报了方案，得到首肯。三天后，深发展董事会正式通过初步方案。之所以称之为初步，是因为公告之后还要收集流通股东的反馈，再决定是否修改。当天，深发展股票收盘价为27.85元。在不到一年的时间里，股价翻了两番。以当天收盘价计算，流通股东所获红股实际价值超过10亿元，与之前被否决的现金分红方案相比，增加了50倍。5月14日，初步方案在深交所备案。16日，深交所批准方案，同日对外公布。虽然一切向好，但是要获得三分之二以上流通股东的支持绝非易事。任务依然艰巨，我们两面出击，加大游说力度。一方面，我们举办了为期五天的路演。我和萧遂宁带队拜访流通股大股东，说服他们投赞成票。这些大股东，我们有的是初次见面，有的之前已经打过交道了。另一方面，我们还请了一家行事低调的公关公司制定媒体传播策略，以赢得散户的支持。据深发展2007年年报显示，深发展的股民人数超过25万。我和公关公司并肩作战，几乎每天都接受记者采访，向他们介绍相关情况。同时，公关公司积极接触媒体渠道，主动提供背景讯息，为我们站台。媒体也很满意，因为我们有求必应，有问必答。公关公司向我们提供媒体的反馈，包括网上聊天室讨论的内容，以便我们能够实时反应。我们不遗余力，全身心投入。曾经有一篇质疑深发展业绩的负面报道，但是刚发布，立即被其他关注深发展的媒体批驳得体无完肤。这是一个积极的信号，说明我们在赢得这场公关战。", "路演重要的一站是中国太平洋保险公司，它是国内最大的保险公司之一。太保很看好深发展，短短数月内，大举买进深发展股票，一跃成为第一大流通股东。5月21日，我在上海拜访了太保首席投资官杨文斌和他的同事。无须我赘述，他们对深发展的股改方案耳熟能详。深发展能够起死回生，命他赞叹不已，同时也对深发展的增长潜力表示乐观。毫无疑问，他会投赞成票。谈着谈着，他突然说：“我们有个想法。”他停顿了一下，接着说：", "“我们想投资10亿元人民币，买深发展新股。”我很意外。我是来谈股改的，但是也不会放过任何融资的机会。我不知道他是不是来真的。我问：“你打算出什么价？”杨文斌答道：“当然是市场价，每股28元。”深发展的股票是在5月11日停牌的，原因是很快就要公布股改方案。那天的收盘价是27.85元。定向增发一般都是折价发行，但是，太保愿意接受平价。我认为，平价增发对深发展来说是件好事，也向市场发出强烈信号：深发展第一大流通股东支持新方案，而且不光说漂亮话，还打算拿出真金白银大规模投入，知行合一。", "我很有把握我的合伙人会赞成杨文斌的建议。果不其然，他们在电话上都表示同意。我趁热打铁，立即请海问的律师起草协议。到了第二天股市收盘时，新桥和太保就协议文本达成了一致。这在投资行业简直就是光速。深发展董事会本来就定于次日开会，再次商讨股改方案，我想借机在会上报告和太保的交易。", "在董事会会议上，我向各位报告，我们接触过的流通股东对初步方案反应很好，但我还是建议进一步改善方案，使之对股东更有吸引力。原因是我们这一次必须稳打必胜，不能有闪失，所以宁滥勿缺，确保最终方案百分百通过。我建议增加认股权证的数量，从10：1的比例派发，增加到10：1.5。法人股东也有权获得权证，因此没有摊薄的问题。权证的发放量增加50%对深发展更有利，因为会带来更多的资本金。我们还对权证存续期做了调整：三分之二的权证存续期为6个月，行权价为每股19元，相当于初步方案公告日前20个交易日平均收盘价的81.20%；三分之一的权证存续期为12个月，行权价同样为19元。董事会赞成并通过了我的意见。可惜，向太保增发的方案根本就没有上会讨论，原因是萧遂宁事先征求证监会的意见，没有获得支持。证监会的态度是，只要股改还没有完成，就不会批准任何增发。太保的方案因此胎死腹中。", "深发展5月24日正式公告最终股改方案。5月25日，深发展股票复牌。股市有涨跌停板的制度：在一个交易日内，股价波动的幅度不得超过10%，未完成股改的公司股票涨跌幅不能超过5%。深发展复牌首日，开然毫不奇怪。深发展复牌后的表现说明，市场欢迎我们的方案，预期方案会通过。网上舆论也印证了这一点，绝大多数人表示要投赞成票。我们觉得胜算十拿九稳。深发展定于6月8日下午2时半召开特别股东大会，而网上投票两天前就已开始，超过98%的股东投了赞成票。开会当天，我驱车从香港去深发展的总部参加大会。因为法人股东并不参与投票，所以我是否在场都无所谓，我之所以参加，是要见证这个历史时刻，并向在场参加投票的股东当面致谢。", "从技术上来讲，当天开了两个股东会。前一个投票表决股改方案，但仅包括派送红股的提案；后一个表决认股权证的提案。为什么不在同一个会上表决两个不同的提案呢？因为证监会规定没有分红历史的上市公司不得派送权证。所以前一个股东会要先创建分红的历史，这样才取得了召开后一个股东会的资格。其实，两个会议之间没有休会，在场的股东谁也没动窝儿。后来，《南方周末》杂志刊登了一篇题为〈深发展股改内幕〉的报道，详细记述了当天戏剧性的场面。报道副标题是〈从马里亚纳到珠穆朗玛〉。马里亚纳海沟是地球上的最深处，而珠穆朗玛峰当然是地球上的最高点，从万丈深渊到刺破青天的峰顶，就是我们过去几年经历的写照，如坐过山车，跌宕起伏，惊心动魄。该报道描述了股东大会上的一幕：6月8日下午5时，深圳发展银行大厦6楼会议室，深发展临时股东大会第二次股改方案的投票结果即将宣布。董事长法兰克.纽曼在接到打印出来的投票统计数据时，略为迟疑了一下，没有立即宣布结果，而是邀请坐在前排的深发展所有高管走到台上。", "当现场安静下来，纽曼宣布：深发展股改和权证的两个提案分别以流通股99.05%和96.4%的高票获得通过。话音甫落，全体高管兴奋地相互拥抱、握手，现场掌声阵阵…", "99.05%，是截至目前所有上市银行和大市值公司股改流通股中最高的通证券市场最富争议的股改之路。此时，一位高瘦而精悍的中年男子侧过身来，面带微笑地向《南方周末》记者说道：“从马里亚纳（世界最深海沟）到珠穆朗玛！”"], "wcount": 5724}, {"icon": "19", "title": "第四部分 皆大欢喜 · 第十九章 深巷酒香", "paras": ["有关深发展的种种利好消息一经传开，深发展俨然成了香气四溢的美酿。最先找上门来的是通用电气资本。纽曼与通用电气的第一把手伊梅尔特曾签署过增发协议，后来增发被监管拦下了。转眼两年多过去了。既然深发展已经完成了股改，通电资本又萌生了旧梦重圆的想法。根据早前的协议，深发展将按每股5.247元的价格，向通电资本增发。但此时股价涨到30元左右，监管不可能批准如此大的折扣。通电资本的项目负责人不肯罢休，威胁要起诉深发展违约。我认为他不过是虚张声势罢了，因为合同上明文规定，交易须经监管部门批准，而监管拒批当然不是深发展的错。而且时过境迁，此时还想以原来的作价买股，无异刻舟求剑。", "2007年7月中旬，通电资本考虑到当时的股价，提议修改合同，将增发价提高到每股20元。这个价格还是比市价低了三分之一左右，所以监管仍可能拒批，但我们觉得有义务帮通电资本试一把。证监会的官员再次明确表示，按照规则，上市公司定向增发，“发行价格不得低于定价基准日前20个交易日公司股票均价的90%”。通电资本不同意按这个规则定价，最终双方还是分道扬镳了。但是，垂涎深发展控制权的大有人在。和先前的平安保险集团一样，许多投资者看好深发展的增长潜力。在中国，无论对内资还是外资，新桥仍是唯一控制全国性银行的私人投资机构，许多人觊觎这个稀有资产。", "宝钢的于业明高个子，戴眼镜，发际线略微后移，一派学者风范。我和他是老相识了。他在宝钢财务部工作时，我在摩根，担任宝钢的财务顾问，那时就认识了。摩根想做宝钢日圆债汇率对冲保值的业务，我和他反复谈判，但最终他选了出的条件更好的另一家银行。我当财务顾问很尽职，殚精竭虑，有问必答。后来我们很熟悉了，我大概心理松懈了，有一次他问了一个问题，我不假思索坦言不知道。满屋人哈哈大笑，笑得我莫名其妙。这时干业明说，竟然还有单先生不知道的事情。我才意识到欠考虑了，让我很惭愧。后来我担任宝钢的独立董事兼审计委员会主席，交往就更多了。", "当时宝钢的总经理是谢企华，是我最为尊重的企业一把手之一，是个女强人。强将手下无弱兵，宝钢的高管个个能干，而且年轻才俊。谢企华出身财务部，在这个部门培养了许多年轻有为的干将，于业明便是其中之一。此时，他刚刚离开宝钢财务公司一把手的职务，升迁到集团公司高管的层次，主管集团下属的多家金融子公司。宝钢集团利润丰厚，资金充裕，业务已扩及金融领域，持有证券公司、投资信托、保险公司和银行的股权，其野心还不止于此。华宝投资和华宝信托是宝钢金融板块的成员公司，掌管宝钢这两家子公司的于业明，在金融板块扩张中的作用举足轻重。", "于业明心思缜密，足智多谋。10月的一个下午，我在上海浦东瑞吉酒店40楼的咖啡厅与他见面。落座后，我们只是一般地闲聊，没有特定的题目。我们曾讨论过新桥投资华宝信托的想法，也讨论过华宝入股深发展，但都没有深入。突然，他话锋一转说，宝钢愿意支付溢价收购新桥持有的深发展股权。", "我毫无心理准备，听了很惊讶。我的第一反应是不可能。因为深发展的改造工作尚未完成，而新桥的控股地位对深发展顺利转型至关重要。而且，我认为银监会也不大可能支持一家钢铁公司控制一家银行。许多国家的法规都禁止工业或非金融机构控制银行，例如美国于1956年颁布的《银行控股公司法》就有明文规定。虽然中国还没有这样的法规，但银行监管部门应该会遵循类似的原则。更何况，此时还不是时候，新桥承诺五年之内不退出，此时离期满还有两年多。", "在中国市场，能控股一家全国性银行是可望而不可即的事情，所以我们也不想过早退出。一般说来，私市股权投资的商业模式要求必须有退出战略，以实现价值。但有时抓到像深发展这样可遇而不可求的资产，我就觉得不能永久性持有是一件很可惜的事情。但是这些问题于业明都考虑到了。他提议，宝钢购买新桥有限合伙人在深发展中的经济权益，从而成为新桥在深发展项目上唯一有限合伙人，新桥仍然作为普通合伙人行使控制权，宝钢则照例向普通合伙人支付管理费和利润分成。通常，私市股权投资公司的普通合伙人在做投资或退出决策时，母须征询有限合伙人的意见。如果新桥想出售一家企业，只需在交易完成后通知有限合伙人即可。但按照于业明的想法，宝钢要收购的不是深发展的股份，而是新桥有限合伙人的权益，因此决定权就不在新桥，而在其有限合伙人。一般而言，有限合伙人可以在二级市场上出售在某个基金中的权益。从理论上讲，有限合伙人转让权益是母须监管审批的，因为实行控制权的普通合伙人没有变化。但是转让有限合伙人的权益，需要他们自己批准。我想，只要价格合适，他们会批准的。我认为他的想法简洁明了，富有创意，优点一目了然。我感叹的是，这么好的想法，远在天边近在眼前，我居然从未想到过。“这个想法太棒了”，我对他说，“我就没想过可以采用这个架构。你真不简单。”他回答得很谦虚：“还不是跟你学的。J我还是将信将疑。“深发展的股价可不低”，我提醒他，“每股40元上下。”于业明已经做足了功课，反过来问我：“用建行的股份来支付，你们会接受吗？”“会啊，当然会”，我毫不犹豫，立即回答。", "中国建设银行是四大国有银行之一，2005年上市，在此之前的重组过程中，宝钢与美洲银行、新加坡主权财富基金淡马锡，以及其他战略投资者几乎同时入股建行。我估摸宝钢此时所持建行股票的价值约为原始投资的五六倍。建行市值约为1700亿美元，股票交投活跃，极易变现，如果在香港交易所出售数十亿美元的建行股票套现易如反掌。在我看来，建行股票与现金没有什么区别。难怪于业明对深发展的高股价没有望而生畏。就好像我十年前买了一幅毕加索，而他几乎在同时收购了一幅梵高。两幅画都同步升值了，如果交换，一物换一物，谁也没有出高价。对于宝钢来说，持有深发展的权为版瓮亇盟贱摿栗违墙烈力；连晟界森藉铜奢浓晷破行的两缥地森履禧制了深发展。", "于业明考虑得如此详细，面面俱到，我心中暗暗称奇。但我压抑住兴奋，问他：“你们领导同意吗？”“还没有”，他说。“如果你觉得可行，我就拿回去在内部讨论。”我告诉他，这个想法可行，愿意帮助推进。", "2007年10月19日，于业明和我以传真方式签署了《宝钢集团有限公司和新桥合作与投资框架协议》，宝钢将收购新桥投资深发展的股权持有公司中有限合伙人所有权益（新桥雇员所持有的权益除外）。宝钢支付的收购价为协议签署日前五个交易日的平均收盘价，算下来每股40.5元，总价值约为20亿美元，将近是新桥投资成本的13倍左右。新桥的有限合伙人将获利丰厚，因此我相信他们会乐于批准这个交易。恰巧，新桥将于10月24日在美国亚利桑那州的斯科茨代尔市（Scottsdale, Arizona）举行投资者年会，我们可以借机向有限合伙人报告与宝钢的协议，争取批准。", "亚利桑那州中有大片沙漠，斯科茨代尔市也建在沙漠之中。那裹气候炎热，度假酒店四周都是热带植物。我出去跑步，感觉和我当初在内蒙戈壁种地时的地貌有些相似：在空旷的戈壁，远山看起来就在眼前，但是放马跑一天，也未必跑到，因此有“望山跑死马”一说。在这种地方跑步，气温高，容易脱水，要小心别跑过了头，耗尽体力跑不回来了。但这是个度假的好地方。可我们一刻都没闲着。那天上午，新桥的主要合伙人与有限合伙人的顾问委员会开会，其中的一项议题就是宝钢的收购。我做了简介，回答了问题，就将议案付诸表决。表决通过，由顾问委员会向全体有限合伙人建议接受宝钢的收购要约。在后来的一两天内，我们收到了全部有限合伙人的书面批准。", "作为交易的一部分，深发展还将向宝钢增发新股。12月3日，深发展公告将向宝钢集团定向增发1.2亿股股票。此次发行将占深发展总股数的5%，发行价按照监管规定，定为公告前五个交易日股票收盘均价的90%，即每股35.15元。深发展将募资42.18亿元，这个规模的注资，无异于给深发展打一剂强心针。", "宝钢的交易需要银监会的批准。我觉得交易内容中规中矩，批准应该没有问题。12月28日，我去北京拜会银监会。那天天色昏暗，一早就下雪，空气污染造成的雾霾像浓烟一样，让人喘不过气来。雨雪交加之下，道路泥泞，交通不畅。早上8:20左右，我来到银监会办公室。等了大约半小时，刘明康主席才匆匆赶来。原来他也遇上堵车耽误了。他说只给我10分钟的时间，接下来还有别的安排。我简要报告了有关宝钢的交易。他很干脆地说，银监会不会允许任何工业企业控制银行，虽然新桥理论上是实施控股的普通合伙人，但有限合伙人只有一家也不行，因为可能对普通合伙人影响太大。至于深发展向宝钢增发5%股份的方案，他表示可以接受，但银监会不会批准给宝钢董事会席位，也是基于同样的道理，工业企业不能影响银行的决策。我知道，这是符合发达国家对于银行监管的国际惯例。10分钟到了，他起身离去，来去匆匆。", "作为监管领导，刘明康是个举轻若重的人，事无巨细，他都亲力亲为，所以总是极为忙碌，兢兢业业。宝钢没有放弃，继续努力，争取获得批准，但四处碰壁。不久宝钢领导班子调整，新领导当中，有的对推动这笔交易不感兴趣，有的因为监管反对望而却步。几个月后，我在宝钢总部与新任董事长徐乐江及首席财务官马国强见了一面。我们都承认监管这一关实在跨不过去，同意放弃这笔交易。一件好事，就这样算了。", "对于深发展来说，募集资本金之难，难于上青天。2005年，通电资本要入资，未果；2006年平安要入资，功败垂成；2007年，太平洋保险要入资，功亏一篑；2008年，宝钢入资的计划无疾而终。命运如此多舛，但没有难倒我们，深发展的管理团队，在纽曼的领导下，竟然就做成了无米之炊，使这家银行持续而且健康增长，用利润逐步补充了资本金。", "2008年5月，马明哲再次找上门。", "马是个意志坚定的人，非常有主见。他聘请了大批优秀人才管理平安的各项业务，这样自己可以抽出身来，将大部分时间花在思考、研究和制定集团战略上。他非常健谈，乐意与访客分享、讨论自己源源不断的想法，同时也渴求访客的观点。他穿着随意朴素，身上唯一的奢侈品是一款带过滤嘴的棕色细支香烟，在我这个不吸烟的人看来别致而稀有。他烟瘾很大，一支接一支。马明哲是个锲而不舍的人。我体会他的战略构想是将平安打造成一家涵盖保险、银行和资产管理三大板块的金融控股公司。那时，平安的寿险业务是全国第二，紧随中国人寿之后，而且大有后来居上之势。他已通过收购和合并两家小银行，打造出银行业务板块—平安银行。但银行业务只占平安集团业务总量的不足10%，其余几乎全是保险业务。一家金融控股公司最要紧的是旗下有一家全国性银行，而马明哲的宏图大业还缺这样一块拼图。", "2006年，平安与深发展控股权失之交臂。如果深发展股价回落到约定的每股7.25元附近，交易还有救，可后来深发展股价持续攀升，一发不可收十。那次与平安交易的失败，新桥因祸得福，到了2007年10月31日，深发展的每股价超过48元，是一年前平安需要支付价格的六倍多。回过头看，平安当年取消交易可谓是大错特错。", "巧的是，就在2006年，平安与深发展的交易功败垂成之际，另一条大鱼浮出了水面。广东发展银行成立于1988年，与深发展几乎同时，其总部设在广州，业务也遍布全国。广发行的总资产比深发展多大约40%，但账面不良贷款率约为新桥入主之前深发展不良率的两倍。广东省政府将其重组，剥离了不少不良资产，大幅降低了不良率，然后公开招标拍卖。广发行全国性银行牌照令不少国内外买家垂涎三尺，平安也是其中之一。", "当初新桥与深圳市签署收购深发展框架协议时，很少有国内外的投资者对管理不善、坏账累累的中国商业银行感兴趣。新桥对深发展成功的改造，以及国有大银行重组上市的成功，都产生了巨大的示范效应，让投资者对中国的银行业刮目相看。即便是广发行这样的问题银行，以前无人问津，今日趋之若鹜，对广发行的争夺异常激烈。有资格拿下广发行85%股份的投标方有三家，平安是其中之一。但经过一年多紧张刺激的多轮竞标，平安不敌由美国花旗银行、中国人寿、中信信托和国家电网组成的竞标团。继深发展之后，这是中国政府第二次出售全国性银行的控股权，也是最后一次。但是这一次，控股方是由中外几家大机构组成，其实谁也不真正控制。控股方委托花旗管理，同时任命了代表中方的董事长。", "花旗和新桥一样，受外资持股比例的限制，所以花旗懂持广发行20%的股份。大约十年后，花旗将所持股份卖给了中国人寿，从而退出。如果中目标是平安，那么作为国内投资者，可以控股。可惜又一条大鱼从平安的指缝中熘走了。2008年一季度，随着全球股市开始徘徊，中国股市也显疲态。深发展股价回落到30元上下波动。那段时间，深发展在纽曼的领导下继续快速转型壮大。2007年，深发展延续了上一年迅勐发展态势，总资产同比增长了35%，净资产同比增长了28%，净利润同比增长了88%。不良贷款率已经从2004年的11.4%降到了2007年的5.62%。势头喜人。", "深发展资本充足率已靠利润积累上升至5.77%，达到监管要求的8%指日可期，因为通过股改发行的权证的行权将会带来新的资本。深发展的前景从未如此明朗。", "正是在这样的背景下，2008年5月8日，马明哲请我在上海浦东香格里拉大酒店喝茶。谈什么，平安并购部负责人刘善学已经做了铺垫。他花了两个多小时，和我商讨平安对收购深发展重新燃起的兴趣。", "刘善学是马来西亚华人，操着一口流利的英语和汉语。他和张子欣、杰克逊一样，是马明哲的左膀右臂。马曾告诉我，他引入了一支全是韩国人组成的消费金融专家团队，打开平安的消费金融业务。这在中国实乃非凡之举。马不拘泥于国籍，不拘一格，聘用最优秀的人担任高管职位，天下英才，为我所用，很有胸襟，了不起。", "刘善学告诉我，平安又对收购深发展产生了浓厚的兴趣。我讲了我们最关心的三个要点，请他报告给老板。第一，最重要的，也是压倒一切的，是无论做什么，我们珍爱自己的声誉。这也是我一贯做事的原则。凡是有损声誉的事情，我们不干，给多少钱也不干。我说上一次的交易功败垂成，仅在短短几小时内，平安一会儿要求深发展停牌，一会儿要求不停，一会儿又要求停，没有考虑如此反复会给深交所和深发展董事会留下什么印象，会给我们的声誉造成什么影响。希望此类事情不再发生。第二，我们很在意将来谁控制深发展。我们看不上的买方，出多高的价钱都不卖；我们能看上的买方必须具备良好的声誉和资质，且打算长期持有。即便新桥退出了，我们也非常关心深发展的未来，因为它的未来将永远和我们的名声息息相关。如果将来搞砸了，我们仍然难辞其咎，因为可以说我们当初找错了买方。而我们的确钟意平安，认为平安是一流企业。第三，不用说，价格非常重要，新桥要争取最大的投资价值，但只要合理，我们就会考虑。当我和马明哲坐下来喝茶时，他已经知道了我和刘善学谈话的内容。他又重申了刘之前表达的兴趣。当然，出自他的口，份量就大多了。他说平安很想和新桥探讨出一个交易方案。", "我心裹有数，新桥的五年锁定期来年年底就到期了，所以此时开始探讨退出不算太早。在上次未遂的交易方案中，平安会对新桥所持的深发展股份发出不可撤销的收购要约，作价相当于新桥的投资获得45%的内部收益率。从那以后，深发展股价飙升，翻了两番，此时谈作价，就要用新方式了。对新桥来说，平安还是一个难得的买家，声名卓著，规模庞大，保险业务和银行业务互补性很强，可以相得益彰。我心裹想，像您这样的买家，我们打着灯笼都没处找，您愿意谈，我求之不得呢。", "心裹这么想，嘴上却不紧不慢。做买卖就像谈恋爱，半推半就才能增加热度，急着投怀送抱反而易启轻慢。当然，这也是因为我们有时间。我说，“新桥五年锁定期明年年底才到期，所以不急，但是很乐意听听您的想法，先谈起来。”又过了18天，2008年5月26日，我再次与马明哲和刘善学会面，在香港的香格里拉大酒店一起吃午饭。经过一番讨论，马表示愿意出价每股39.9元。这个价格比当天市价高出约60%。反映了控股权溢价，与年初市价相差不多。我觉得这个报价颇为公允。我参与了无数次谈判，但其实我讨厌讨价还价，不得已而为之。马明哲一出口，我就认为可以接受，而且很坦白地告诉了他。我这样直来直去，未必明智，因为大凡太容易了，对方心里就会犯嘀咕，是否报价太高了，他怎么不假思索就接受了呢？英语中有个说法，叫做“买方懊悔”（buyer's remorse），意思就是说买之前欲望强烈，买了之后心裹犯嘀咕，是不是出价太高了，自己犯错误了？如果讨价还价一番，觉得把价格压到对方无路可退了，心裹反而踏实，之后也不大会懊悔。在任何并购交易中，双方就价格达成一致是最困难也是最重要的一环，这是个关键，其他的都是技术问题，虽然可能很复杂，但一般不会关系成败。此时价格达成一致了，平安和新桥的团队都像上足了发条的机器，准备全力以赴投入。"], "wcount": 6763}, {"icon": "20", "title": "第二十章 近在咫
