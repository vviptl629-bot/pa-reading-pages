<style>
html{
  --bg:#ffffff; --panel:#f5f6f7; --panel2:#eceef0; --line:#c9ced4;
  --text:#111418; --muted:#555e68; --accent:#0E9488; --deep:#0E9488;
  --amber:#a16207; --green:#15803d;
  --topbar-bg:rgba(255,255,255,.94); --para:#1a1f24;
  --mark-bg:rgba(14,148,136,.08); --badge-bg:rgba(14,148,136,.08); --badge-border:#0E9488;
  --overlay:rgba(0,0,0,.35);
  --mark-text:rgba(251,191,36,.35);
}
:root{--sidebar:280px; --topbar:56px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.85;-webkit-font-smoothing:antialiased;
}
.topbar{
  position:fixed;top:0;left:0;right:0;height:var(--topbar);z-index:50;
  background:var(--topbar-bg);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 20px;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#08110f;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px}
.brand .sub{color:var(--muted);font-weight:400;font-size:13px}
.lib-btn{flex:none;display:inline-flex;align-items:center;gap:5px;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;transition:background .18s}
.lib-btn:hover{background:rgba(14,148,136,.08)}
@media(max-width:720px){.lib-btn{padding:5px 9px;font-size:12px}}
.searchwrap{margin-left:auto;position:relative}
.searchwrap input{
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:8px 12px 8px 34px;width:230px;font-size:14px;outline:none;
  transition:border-color .2s;
}
.searchwrap input:focus{border-color:var(--accent)}
.searchwrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);stroke:var(--muted)}
.menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:6px 10px;font-size:18px;cursor:pointer}
.layout{display:flex;padding-top:var(--topbar);min-height:100vh}
.sidebar{
  position:fixed;top:var(--topbar);bottom:0;left:0;width:var(--sidebar);
  background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:16px 0 40px;z-index:40;
}
.sidebar::-webkit-scrollbar,.main::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb,.main::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.toc-hint{font-size:11px;letter-spacing:2px;color:var(--muted);padding:6px 20px 12px;text-transform:uppercase}
.toc-hint .total{display:block;letter-spacing:0;font-size:11px;color:var(--muted);margin-top:6px;text-transform:none}
.toc-ch{margin-bottom:2px}
.toc-ch-title{
  display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;
  font-weight:600;font-size:14px;user-select:none;color:var(--text);
}
.toc-ch-title:hover{background:var(--panel2)}
.toc-ch-title.active{color:var(--accent);background:var(--mark-bg);font-weight:700}
.toc-ch-title .num{
  flex:none;width:24px;height:24px;border-radius:6px;background:var(--panel2);
  color:var(--accent);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700;
}
.toc-ch-title .name{flex:1;line-height:1.35}
.toc-ch-title .wc{flex:none;font-size:10.5px;color:var(--muted);font-weight:400;opacity:.8}
.toc-ch.hidden{display:none}
.main{margin-left:var(--sidebar);flex:1;padding:44px 24px 120px;min-width:0}
.paper{max-width:820px;margin:0 auto}
.chapter{margin-bottom:80px;scroll-margin-top:80px}
.chapter-head{margin-bottom:36px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.chapter-head .badge{
  display:inline-block;background:var(--badge-bg);color:var(--accent);
  border:1px solid var(--badge-border);border-radius:6px;padding:2px 10px;font-size:12px;
  letter-spacing:2px;margin-bottom:14px;
}
.chapter-head h1{font-size:30px;line-height:1.35;font-weight:800;letter-spacing:.5px}
.chapter-head .wcmeta{font-size:13px;color:var(--muted);margin-top:10px}
.chapter-head .wcmeta b{color:var(--accent);font-weight:700}
.para{margin:0 0 18px;color:var(--para);text-align:justify}
.bookfig{margin:26px 0;text-align:center;cursor:zoom-in}
.bookfig img{max-width:100%;max-height:560px;border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.12)}
.bookfig.bfbig{cursor:zoom-out}
.bookfig.bfbig img{max-width:none;max-height:none;width:auto;box-shadow:0 4px 24px rgba(0,0,0,.3)}
.bookfig figcaption{font-size:12px;color:var(--muted);margin-top:8px}
mark{background:var(--mark-text);color:var(--amber);border-radius:3px;padding:0 2px}
.side-tabs{display:flex;gap:4px;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.side-tabs button{flex:1;background:none;border:1px solid var(--line);color:var(--muted);
  border-radius:7px;padding:7px 4px;font-size:12.5px;cursor:pointer;transition:all .15s}
.side-tabs button.on{color:var(--accent);border-color:var(--deep);background:var(--badge-bg);font-weight:700}
.side-panel{display:none}.side-panel.on{display:block}
.hl-y{background:rgba(251,191,36,.42);border-radius:2px;padding:1px 0;cursor:pointer}
.hl-g{background:rgba(74,222,128,.38);border-radius:2px;padding:1px 0;cursor:pointer}
.hl-b{background:rgba(96,165,250,.32);border-radius:2px;padding:1px 0;cursor:pointer}
.hl-bold{font-weight:800}
.selbar{position:fixed;z-index:155;display:none;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:5px;gap:4px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.selbar.show{display:flex;flex-wrap:wrap;max-width:340px}
.selbar button{border:none;background:var(--panel2);color:var(--text);border-radius:7px;
  padding:7px 10px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:5px}
.selbar button:hover{background:var(--accent);color:#08110f}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.dot.y{background:#fbbf24}.dot.g{background:#4ade80}.dot.b{background:#60a5fa}
.excerpt-item{position:relative;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.excerpt-item:hover{background:var(--panel2)}
.excerpt-item .etext{font-size:13px;line-height:1.7;color:var(--text);word-break:break-word}
.excerpt-item .emeta{font-size:11px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.excerpt-item .edel{color:var(--muted);border:none;background:none;cursor:pointer;font-size:14px;padding:2px 6px}
.excerpt-item .edel:hover{color:#f87171}
.excerpt-item .ecolor{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px}
.excerpt-empty{padding:30px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
.excerpt-tools{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.excerpt-tools button{flex:1;min-width:70px;background:var(--panel2);border:1px solid var(--line);
  color:var(--text);border-radius:7px;padding:7px;font-size:12px;cursor:pointer}
.excerpt-tools button:hover{border-color:var(--accent);color:var(--accent)}
.excerpt-search{margin:10px 16px 4px;width:calc(100% - 32px);background:var(--panel2);
  border:1px solid var(--line);color:var(--text);border-radius:7px;padding:8px 10px;font-size:13px;outline:none}
.progress{position:fixed;top:var(--topbar);left:0;height:2px;background:var(--accent);z-index:60;width:0}
.totop{
  position:fixed;right:24px;bottom:28px;width:44px;height:44px;border-radius:50%;
  background:var(--panel2);border:1px solid var(--line);color:var(--accent);
  font-size:20px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:30;
}
.totop.show{display:flex}
@media(max-width:800px){
  :root{--sidebar:0px}
  .brand .sub{display:none}
  .brand>span:nth-child(2){display:none}
  .topbar{gap:10px;padding:0 12px}
  .searchwrap{margin-left:auto;flex:1;max-width:190px}
  .searchwrap input{width:100%}
  .menu-btn{display:block;flex:none}
  .sidebar{transform:translateX(-100%);transition:transform .25s;width:82vw;max-width:320px}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:30px 16px 100px}
  .chapter-head h1{font-size:24px}
  body{font-size:15.5px}
  .overlay{position:fixed;inset:0;background:var(--overlay);z-index:35;display:none}
  .overlay.show{display:block}
}
/* FOCUS-READ-MODE v1 */
/* ---------- 专注阅读（全屏）模式 ---------- */
.focus-btn{flex:none;display:inline-flex;align-items:center;gap:5px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:700;background:transparent;cursor:pointer;white-space:nowrap;transition:border-color .18s,color .18s;font-family:inherit}
.focus-btn:hover{border-color:var(--accent);color:var(--accent)}
body.focus-mode .topbar,body.focus-mode .sidebar,body.focus-mode .progress,body.focus-mode .overlay,body.focus-mode .selbar,body.focus-mode .totop{display:none!important}
body.focus-mode .layout{padding-top:0}
body.focus-mode .main{margin-left:0;padding:0}
body.focus-mode .paper{max-width:var(--focus-width,760px);margin:0 auto;padding:64px 30px 160px}
body.focus-mode .para{font-size:var(--focus-fs,19px);line-height:var(--focus-lh,2);letter-spacing:.01em}
body.focus-mode .chapter{margin-bottom:100px}
body.focus-mode .chapter-head{margin-bottom:48px}
body.focus-mode .chapter-head h1{font-size:32px}
body.focus-mode .bookfig{margin:36px 0}
.focus-tools{position:fixed;z-index:210;right:18px;top:18px;display:none;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:6px 8px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
body.focus-mode .focus-tools{display:flex}
.focus-tools button{min-width:32px;height:30px;border:none;background:transparent;color:var(--text);border-radius:7px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;padding:0 8px}
.focus-tools button:hover{background:var(--panel2);color:var(--accent)}
.focus-tools .ft-exit{color:var(--accent);border-left:1px solid var(--line);border-radius:0 7px 7px 0;margin-left:2px;padding-left:10px}
.focus-tools .ft-label{font-size:11px;color:var(--muted);padding:0 4px;white-space:nowrap}
.focus-hint{position:fixed;z-index:210;bottom:22px;left:50%;transform:translateX(-50%);display:none;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:7px 16px;font-size:12px;color:var(--muted);box-shadow:0 4px 18px rgba(0,0,0,.1);opacity:.92;pointer-events:none}
body.focus-mode .focus-hint{display:block}
@media print{.book-title{color:#000!important;border-bottom:2px solid #000!important}.book-title:empty::before{content:''!important}}
@media print{.focus-btn,.focus-tools,.focus-hint{display:none!important}body.focus-mode .topbar,body.focus-mode .sidebar,body.focus-mode .progress,body.focus-mode .overlay,body.focus-mode .selbar,body.focus-mode .totop{display:none!important}}

@media print{
  html{
    --bg:#fff;--panel:#fff;--panel2:#fff;--text:#000;--muted:#000;--line:#000;
    --accent:#000;--para:#000;--badge-bg:#fff;--mark-bg:#fff;
  }
  body{background:#fff!important;color:#000!important;font-size:11pt}
  .topbar,.sidebar,.progress,.totop,.overlay,.selbar{display:none!important}
  .layout{display:block;padding:0}
  .main{margin:0;padding:0}
  .paper{max-width:none}
  .chapter{margin-bottom:24px;page-break-after:auto}
  .chapter-head{border-bottom:1px solid #000;padding-bottom:8px;margin-bottom:16px}
  .chapter-head h1{font-size:20pt;color:#000}
  .para{color:#000!important}
  mark{background:none;color:#000;font-weight:bold}
}
.rt-wrap{position:relative;flex:none;display:inline-flex}
.read-timer{display:inline-flex;align-items:center;gap:6px;height:34px;color:var(--muted);font-size:13px;font-weight:600;background:transparent;border:1px solid var(--line);border-radius:8px;padding:0 10px;white-space:nowrap;cursor:pointer;font-family:inherit}
.read-timer:hover{border-color:var(--accent);color:var(--accent)}
.read-timer .rt-dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.read-timer.live .rt-dot{background:var(--accent);box-shadow:0 0 0 3px rgba(14,148,136,.16)}
.read-timer b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:700}
.rt-pop{position:absolute;right:0;top:calc(100% + 8px);z-index:300;width:262px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:0 12px 34px rgba(0,0,0,.13);display:none;text-align:left;font-weight:400;font-size:13px;line-height:1.6}
.rt-pop.show{display:block}
.rt-pop h4{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:700}
.rt-pop .rt-big{font-size:22px;color:var(--accent);font-weight:800;margin-bottom:8px;font-variant-numeric:tabular-nums}
.rt-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.rt-row:last-child{border-bottom:0}
.rt-row span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-row b{color:var(--text);font-variant-numeric:tabular-nums;flex:none}
.rt-bars{display:flex;align-items:flex-end;gap:4px;height:58px;margin:8px 0 6px}
.rt-bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.rt-bar i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.rt-bar.today i{opacity:1;box-shadow:0 0 0 1px var(--deep)}
.rt-bar em{font-size:10px;font-style:normal;color:var(--muted);white-space:nowrap}
.rt-tip{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
@media(max-width:720px){.read-timer{height:30px;padding:0 7px;font-size:12px}.rt-label{display:none}.rt-pop{right:-40px;width:242px}}
@media print{.rt-wrap,.rt-pop{display:none!important}}

/* MOBUI-v1 */@media(max-width:720px){.undo-btn{display:none!important}.split-reader{display:none!important}}
</style>



<style id="simpleEditStyle">
/* ===== SIMPLE-EDIT-v2 默认纯阅读 + 按需改字 ===== */
/* 只有正在编辑的那一段才有提示框；其余段落保持纯阅读，无任何框 */
/* DUPTITLE-v1 正文首段与标题重复时隐藏该行（不删DOM，仅视觉隐藏）*/
.dup-title-line{display:none!important}
.dup-title-line + p{margin-top:0}
@media print{.dup-title-line{display:none!important}}
/* BOOKTITLE-v1 书名大标题（空白可编辑）*/
.book-title{font-size:30px;font-weight:800;line-height:1.35;color:var(--text);
  margin:6px 0 26px;padding:0 0 14px;border-bottom:2px solid var(--accent);
  cursor:text;outline:none;min-height:1em}
.book-title:empty::before{content:'点击此处输入书名大标题…';color:var(--muted);font-weight:600;opacity:.7}
[data-pid].se-editing{outline:1px solid var(--amber);outline-offset:2px;border-radius:2px;cursor:text;background:rgba(251,191,36,.05)}
/* 改过的段落：极轻左边框痕迹（打印去掉） */
/* EDITUI-FIX: 改字后不再显示橙色竖框，段落保持纯阅读外观 */
/* 文字被删空的段落：隐藏整段（含残留竖线装饰），撤销后自动恢复 */
[data-pid].se-empty{display:none!important}
/* 工具条里的改字按钮 */
#editBtn{white-space:nowrap}
/* 顶栏「回到上一版」按钮 */
.undo-btn{flex:none;display:inline-flex;align-items:center;gap:5px;color:var(--muted);border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:border-color .18s,color .18s}
.undo-btn:hover{border-color:var(--accent);color:var(--accent)}
.undo-btn.hasundo{border-color:var(--amber);color:var(--amber)}
.undo-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:370;background:#111418;color:#fff;font-size:12px;padding:7px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
.undo-toast.show{opacity:.94}
@media print{.undo-btn,.undo-toast{display:none!important}p[data-edited="1"],h2[data-edited="1"]{box-shadow:none!important;padding-left:0!important}[data-pid].se-editing{outline:none!important;background:none!important}}
</style>

<!-- EDITUI-FIX-v1 -->
<style data-mobovf>
/* MOBOVF-v1 防止手机横向滑动 */
html,body{overflow-x:hidden!important;max-width:100%!important}
body{position:relative}
.mob-topbar{max-width:100vw!important;box-sizing:border-box!important}
</style>
</head>

<div class="progress" id="progress"></div>
<header class="topbar">
  <button class="menu-btn" id="menuBtn">☰</button>
  <div class="brand">
    <span class="mark">金</span>
    <span>金钱风云</span>
    <span class="sub">/ 单伟建 · 商业回忆录</span>
  </div>
  <a class="lib-btn" href="../pa-library.html" title="返回阅读库">◧ 书库</a>
<button class="focus-btn" id="focusBtn" title="专注阅读：隐藏界面元素、放大正文；Esc 退出">⛶ 专注阅读</button>
  <div class="searchwrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>

  <div class="rt-wrap">

        <span class="bk-dot" id="bkDot"></span>
        <span class="bk-msg" id="bkMsg">备份与同步未连接</span>

        <button class="bk-btn" id="bkImport" title="从文件恢复数据">导入</button>
        <button class="bk-btn primary" id="bkSync" title="立即与云端同步">☁ 同步</button>

  </div>
</header>
<div class="overlay" id="overlay"></div>
<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="side-tabs">

<script>
const DATA = [{"icon": "前", "title": "前言 非凡之旅", "paras": ["2008年，以美国为首的西方世界陷入了一场空前的金融和经济危机。危机始于雷曼兄弟的破产，这家曾是美国第四大的投资银行，有着150年的历史，它的破产导致美国整个金融体系摇摇欲坠。危机之中，美国、英国及欧洲多国的政府都出手援救银行体系，注入大量资金，使许多银行免于破产。", "然而有这么一家重要的银行，在全球经济危机之前就因为不良贷款累累、资本金严重不足而陷于困境。但是其后并没有获得任何政府资金的支持，却居然扭亏为盈，转弱为强，最终茁壮成长，取得巨大成功。这团。", "一家美国投资公司何以接管并控制中国一家全国性银行？而深发展如何从濒临破产的边缘，在没有政府资金支持的情况下，绝处逢生，成为一家资产质量优秀、资本金充足、高速增长且利润强劲的金融机构新桥的团队如何与监管部门配合，又采取了哪些前所有为的改革措施和方针，从而为银行和全体股东创造了巨大的价值？", "这是一个真实的故事，其来龙去脉引人入胜。譬如故事中细说了在美国涉及一家台湾金融机构的诉讼、中国政府对于外资的支持、中外人士混合组成的董事会如何在一位美国银行家带领下推动一连串改革。", "故事情节曲折，出人意表，而最终结局圆满。本书作者单伟建，正是他率领新桥的团队收购了深发展的控制权，又主导了它的改造。他以内幕人的身份，披露不为人知的秘密，其中不乏扣人心弦的情节。故事所展示的不仅是外资在中国市场化改革中所面临的机遇和挑战，更是中国银行体制改革中利用外资所遇到的问题和取得的巨大成果。", "我有幸参与其中，成为深发展的董事长和首席执行官。我是员工中唯一的外国人，对中文一窍不通。我和中国同事们相互配合，群策群力，使深发展从羸弱不堪走向健康成长。我们的经历异乎寻常。我结交了很多中国朋友，我为他们感到骄傲。", "单伟建以其深刻的洞察力和独特的视角讲述了一个非凡的故事。通过此书，读者可以更多地了解中国、中国的银行体制内部运作的机制、私市股权投资的奥秘以及如何险中取胜。", "法兰克.纽曼（Frank N.Newman）", "深圳发展银行董事长兼首席执行官（2005-2010）", "美国信罕银行董事长兼首席执行官（1996-1999）", "美国财政部副部长（1993-1995）", "2021年10月31日"], "wcount": 898}, {"icon": "序", "title": "自序 十年一剑", "paras": ["这是我的第三本拙作。承蒙读者厚爱，前两本—《走出戈壁》和《金钱还攻略》都成了畅销书。本书的英文版于2023年2月在美国出版，也成为畅销书。三本书都是先有英文版，再继之以中文版。但是中文版并非译自英文版，而是本人的中文原作。虽然中英版本的故事脉络相同，但有些内容不同。这是因为用哪种语言写作，就要用哪种语言思考，进入该种语言特定的语境，而不同语境的表达方式各异，因此只有原作才能使读者原汁原味地体会到作者要表达的意思。比如，我在此书中引用《史记》作者司马迁的话说：“谚日‘力田不如逢年，善仕不如遇合’”一再怎么辛苦种地，不如碰上风调雨顺之年；再怎么会做官，不如碰上知人善任的伯乐。中文读者马上可以理解古谚的意思，这是中国两千多年前老祖宗总结出的智慧。而英文版当然不能用同样的方式表达。即如“伯乐”两个字，对于没有中国文化背景的英文读者，岂非对牛弹琴？当然“对牛弹琴”也是成语。总之，对于中文读者，典故和成语是积累了几千年的智慧结晶，言简意赅，便于表达和理解。其实英文的原作也是如此，包含很多约定俗成的典故，来自诸如《圣经》或莎士比亚等等，翻译成中文，同样蹩脚。比如英语世界常用的表达方式“墙上写的字”（The writing on the wall），来自《圣经》故事，可以翻译成“不祥之兆”，但完全失去了原文典故的丰富含义及可以引发的生动想象，即墙上之字是来自上帝之手。再有美国人常说的“Catch 22”，来自小说书名，直译是“第二十二条军规”，那就莫名其妙了，可以译成“进退两难，左右为难”，但显然失去了原味和不少含义。", "不用说，成就一本书不容易，需要投入大量时间和精力，而且旷日持久。我的本职工作是投资。作为太盟投资集团的执行董事长，我往往忙得不可开交。总有人问我何以有时间写作，我的回答很简单。工作不能等，尤其是操盘投资收购项目，犹如打仗，要争分夺秒，甚至夜以继日，否则机会可能稍纵即逝。而写作并无期限，有时间就动笔，没时间就放下。比如此书从十几年前就开始构思，五、六年前动笔，而英文版出版之后，又用了一年多的时间写成中文版。只要锲而不舍、持之以恒，就功夫不负有心人，所谓有志者事竟成。能将此书献给读者，是我莫大欣慰。", "我写作此书的目的并非仅仅讲述一个引人入胜的故事，而是因为这个故事折射出一个辉煌的时代，也填补一个文献的空白。这个故事的大背景就是中国的改革开放以及由此造成而堪称奇迹的经济腾飞。私市股权投资 （Private Equity）是上世纪八十年代末新兴的行业，发展至今，在世界主要市场中都在扮演一个不可或缺的角色，尤其大型收购项目，几乎每日见诸报刊，影响市场和经济。但是在第二部拙作《金钱攻略》之前，尚无一本内幕人记述的收购、改造并最终退出目标公司全过程的详解，所以私市股权行业一直给外行以深不可测之感，好像很神秘。《金钱攻略》多少填补了这个文献中的空白，揭开了私市股权投资的面纱。", "但中国市场与国外有很大的不同，而改革开放的进程就必然是动态的，在这个市场中做控股性的投资，本来无路可寻，必须独辟蹊径，所以这段经历就弥足珍贵，值得加载史册，其中的经验教训，也值得他人借鉴。在过去的五年中工作忙碌之余出版三部书，各两个文字的版本，一共六本，用了大量时间。因此剩余给家人和朋友的时间就极少了。我深深感激他们的牺牲和支持。", "此书得益于陈雪女士的润色。在这个故事发生期间，陈雪先是《中国证券报》的记者，后来成为《财经》杂志的记者，跟踪报道始终，所以她是个见证人，最有资格帮助修改此书。", "我的秘书郭晓敏女士是我最得力的助手，帮助我整理资料和稿件，做出极大的贡献，在此表示感谢。香港《信报财经月刊》及《信报财经新闻》总编辑邓传锵先生是资深报人。他在2020年找到我，主动提出由信报出版社出版《走出戈壁》繁体字的中文版，给了我很大的鼓舞。2024年7月，他又提出由信报出版社出版此书，而且立即组织出版社的团队快速跟进。还不足两个月，此书就付梓了，其效率之高，堪称神速，在出版界闻所未闻。信报出版社担任此书编辑的李海潮先生和他的团队工作非常勤奋，与作者互动密切且及时，我往往收到李先生在午夜之后发来的邮件，其敬业精神，可见一斑。由于他们的努力和专业精神，才能将如此精美的书籍呈献给读者。在此向邓传锵先生、李海潮先生和信报出版社的团队致谢。", "我还要感谢曾任深圳发展银行副行长（后任平安银行行长）的胡跃飞先生、曾任深圳发展银行副行长的周立先生，以及曾任平安保险集团并购部门负责人的刘善学先生，他们提供了本书中许多珍贵的历史照片，为本书平添色彩。此书的出版恰值新桥投资收购深圳发展银行控股权20周年之际，正好以此纪念，也了却一桩心愿。", "单伟建", "2024年8月17日于东京"], "wcount": 1926}, {"icon": "1", "title": "第一章 突如其来", "paras": ["在来往维多利亚港两岸的轮渡上凭栏而立，向南望去，香港岛的景色历历在目。最先映入眼帘的是中环的高楼大厦，鳞次栉比，直耸云香。中环依山傍水，其南是太平山，又名扯旗山，英国人称作维多利亚峰。举目远眺，漫山覆盖着郁郁葱葱的林木，高低不齐的楼宇星罗棋布，镶嵌在一片葱绿之中。回首向北，看到的是九龙半岛，高楼大厦一栋挨着一栋，伸延到横亘东西的山麓。塞拉利昂突兀于绵延起伏的山脉中央。", "维港之中，百舸争流，两岸，一片繁忙。", "香港地处亚热带，没有中国北方意义上的冬天，最冷的1月及2月份，温度也很少低过摄氏10度。3月，空气开始潮湿，扯旗山的顶端经常云雾缭绕，有的日子里大雾低垂到半山甚至中环。一进入4月，雾气散尽，天气晴朗时艳阳高照，气温也随之上升。北方还是春寒料峭，这里已经开始暑气蒸腾了。香港4月的气温难以预料，在有的年份，日间平均温度在摄氏20度上下，颇为宜人。而2002年是个注定不寻常的一年，在本书故事开始的4月1日，出奇的热，气温高达近30度，此后一直到9月，白昼的温度徘徊在30到33度之间。港岛四周环水，因为洋流的调节，即便在盛暑时节，气温几乎从不超过33度，但极为潮湿。香港可能是全球人口最为密集之地。据统计，市区人口密集的程度是纽约市区的12倍。香港房地产之昂贵，更是高居世界之首。在世纪之交，扯旗山顶上豪宅每平方米的售价超过100万港币。", "在本世纪初，港岛中环附近的天星码头还在，往来于九龙尖沙咀和港岛中环的渡轮在此停靠。码头上有个标志性建筑，始建于1925年。中环的地价日益高涨，填海造地愈发划算，结果是维多利亚港越填越窄。到了2007年，天星码头拆除了，在它的前面填出了一大块平地。有趣的是，港湾越窄，摆渡的船只横渡的时间反而越长。何以如此呢？", "因为港湾变窄使得穿湾而过的海水流速加快，就好像把水管的出口用手堵住一半流速加快一样，如果渡轮直行对岸，势必被海流冲得偏离航向，所以必须先逆流走个斜角，在港湾中间再掉头顺流走个反斜角，画完大三角，才能抵达对面的码头。坐落在天星码头附近的香港国际金融中心就是建在填海造出来的地上，占地甚广，集办公楼、商场和酒店为一体。办公楼的第一期，高39层，在1998年开张。第二期高88层，到2003年才完工。", "我在1998年离开供职5年的美国摩根银行（JPMorgan，后来摩根银行被大通银行所收购，改名为摩根大通银行），加入美国新桥投资公司。新桥的香港总部在当年搬入刚刚建成的国际金融中心一期办公楼的20层。", "新桥是一家私市股权投资公司，于1994年创办。有两家创办机构，一家是得克萨斯太平洋集团（Texas Pacific Group），后来名字简化为TPG，其创办人及主席是戴维. 庞德曼（David Bonderman），另一家是布朗姆投资合伙人（Blum Capital Partners），其创始人和主席是迪克.布朗姆（Dick Blum）。庞德曼和布朗姆均担任新桥的联席主席。我和唐开罗（Dan Carroll）任联席管理合伙人。TPG是在美国得克萨斯州创办的，总部却在旧金山，布朗姆投资合伙人的总部也在旧金山。庞德曼和布朗姆是好友，时而在世界各地周游，对亚洲都相当熟悉。他们注意到中国市场的发展前景，决定成立专门投资中国的新桥投资集团，后来新桥投资的范围扩大到整个亚洲。唐开罗是新桥的第一名雇员。2002年4月1日这一天，天高云淡，空气清澈，能见度很好，站在中环办公室窗前，维港对岸九龙山峦上的绿色植被清晰可见。我进了办公室尚未坐定，秘书说客人已到会议室了。", "来访者名叫张钊，是熟人，美国德汇律师事务所（Dorsey &amp; Whitney）的合伙人。这家律所总部位于美国明尼阿波利斯市，在香港设有办事处。其合伙人包括美国前副总统沃尔特.蒙代尔（Walter FrederickMondale）。张钊是德汇在香港的头儿，仪表堂堂，身高一米八几，戴眼镜，文质彬彬。那时他刚刚四十出头，还是单身，我见到他就不由想起钻石王老五的说法。他毕业于北京国际关系学院，在中国政法大学获得硕士学位，之后去美国留学，于明尼苏达大学获得法学博士学位。毕业后他成为美国持牌律师，已经十几年了。他的客户里应该有不少中国企业。他面带微笑还露出一丝羞怯，仿佛是说不好意思打扰。坐定之后，寒暄了几句，张钊就单刀直入：“伟建，新桥有兴趣收购一家中国的全国性银行吗？”要是换个人，一定会认为这个问题来得突兀，但他之所以来找我，应该有几分把握会得到一个肯定的答复。为什么呢？因为我所带领的新桥团队，两年前刚刚从韩国政府手中成功收购了韩国第一银行的控股权，收购的过程异常曲折复杂，所以全球媒体跟踪密集报道，因此业内广为人知。新桥投资因此役名声大噪，市场上都知道我们是收购、治理“问题银行”的专家。张钊应是慕名而来，但我们相互认识，他也就没有必要绕圈子了。韩国第一银行的收购是怎么回事呢？韩一银行曾经是韩国最大的商业银行。1997年亚洲金融危机来袭，韩国经济遭受重创，很多银行倒闭或濒临破产，韩国政府最终出手将摇摇欲坠的韩一银行收归国有。危机之中，哀鸿遍野，资本外逃。到1997年末，韩国的外汇存底懂剩89亿美元，按照当时资本外逃的速度，仅可以维持不到一周的时间，韩国政府就会失去外汇支付能力了。在韩国面临外债违约风险的关键时刻，国际货币基金组织和世界银行提供了一个规模达580亿美元的紧急救援计划，可谓雪中送炭。但是救援的条件是韩国政府将其国有化的两大银行出售给外国投资者，以引进“信贷文化”，不但改造这些银行，而且带动韩国整个银行体制的改革。", "就是在这个背景之下，我带领新桥的团队，经过旷日持久、艰苦卓绝的谈判，最终收购了韩一银行的控股权。我们敢于收购一个问题银行，在于新桥的合伙人在历史上有过收购和改造银行的经验。俗话说，没有金刚钻，不揽瓷器活儿。我们懂得如何创建风险控制系统，如何创建信贷文化，从而严格控制不良资产的产生。银行之所以破产，就在于不良资产造成的损失超过了银行自身的资本金，所以控制了不良资产的产生，就保证了银行的健康。", "对于外行来讲，银行是个深不可测的机构，好像有的是钱，大小企业和个人都可以去借钱。但是银行的钱从何而来？主要是各类客户在银行的存款或者银行在市场上借来的钱，为此银行支付利息。银行再将钱贷给企业和个人，收取利息。贷款利息高于存款利息，银行的盈利模式就是赚取其间的“利差”。利差收入每年懂占一笔贷款的极小比例一大约在1%和3%之间，如果一笔贷款收不回来，若干笔贷款多少年的利差收入都无法抵销损失。管理银行最大的诀窍，就是知道如何将贷款损失减至最小，使银行可以保持稳定的盈利。这叫做风险控制，简称风控。风控是大学问。银行破产就在于没有搞好风控。什么叫信贷文化呢？简单说，就是银行要根据客户偿还贷款的能力来判断是否提供贷款、提供多少、什么期限、何种利率。这听起来理所当然，但在1997年亚洲金融危机之前，亚洲各国的很多银行都不是如此经营的。从韩国到日本到印度尼西亚，银行贷款大多基于政府的经济政策一是否支持某些行业或企业，或基于银行员工和借贷方之间的关系。当整个经济不断增长、市场欣欣向荣的时候，借贷方即便无力还本，也可以借新还旧；但是危机一来，银行要收回贷款，才发现许多借贷方根本无力偿还。大量的不良贷款导致银行倒闭。要避免危机再次发生，在整个银行系统引进信贷文化就成了当务之急。", "新桥收购韩一银行的控股权，创建了信贷文化，在第一年就扭亏为盈。", "就是看到这个，张钊才来找我。", "张钊告诉我，他所说的是深圳发展银行，是个问题银行，不良率—不良贷款占总贷款的比例一很高，所以必须改造， 能扭转困局。这当然充满风险和挑战，但是深圳是改革开放的特区，市场化程度高于其他地区，政策支持外资，使之发挥作用，有效地改造这家银行。我说，要改造一家银行，投资人必须有控制权，否则再有本事也无能为。取得控制权可能吗？张钊说，不但可能，这正是深圳市政府的想法。市政府现在是深发展的最大股东，因此有控制权，任命了高管和大部分董事，如果新桥取而代之，也可以获得控制权。他介绍说，深发展是一家全国性银行，是中国13家股份制商业银行之一，也是第一家上市公司，深圳股票交易所的第一只股票，代码是000001。它在全国各地都有分、支行网络，但集中在沿海地区和主要大城市，也就是比较富裕、经营环境较好的地区。", "改革开放是中国过去20几年经济发展的主旋律，但是外资控制一家全国性银行还是前所未闻。深圳处于改革开放的前治，市场化的胆子大，步伐快，曾经受到邓小平的赞扬。深圳也是一个试验区，如果有政策性的突破，在深圳最有可能。但是深圳市政府有意向外资转让控制权，也侧面说明了深发展的问题严峻。其实不光深发展是个问题银行，当时整个中国的银行体制都是坏账累累，资不抵债，这已经是一个公开的秘密，只是因为财政的支持，才得以维持。正是在2002年前后，中国开始了银行体制的改革，首先从国有四大银行着手，即工商银行、农业银行、中国银行和建设银行。这一年，朱镕基总理亲自推动，在人民银行的指导下，这些大银行聘请了国际上最大的会计师事务所查账，搞清家底。真是不查不知道，查清楚了吓一跳。据人民银行估计，中、农、工、建四大银行的平均不良贷款率约为30%。根据国际信用评级机构标准普尔（Standard &amp; Poor's）的研判，这30%的比例还是这些银行“近年来显著改善了信贷和风险管理控制”后的结果，而中国银行体制整体面临的问题极为严峻：标准普尔估计，中国银行业如果只是依靠自身的能力至少需要10年、甚或20年，才能将平均不良贷款率降至尚属可控的5%。而要达到这个目的，核销不良资产的成本大概需要5180亿美元，相当于中国2001年估计的1.1万亿美元国内生产总值的近一半。换言之，当时中国银行业的问题比1997年亚洲金融危机中的韩国更为严重。不同之处在于那时的韩国政府已经山穷水尽、国库空虚，没有国际组织的救助就束手无策。相比之下，中国政府的财政实力相当雄厚，因此有能力为银行业纾困。这就是为什么中国储户从来不担心存款的安全。那时候，中国并没有像美国、韩国和其他一些发达国家所常见的存款保险制度，但当银行需要救助的时候，可以指望政府出手。投资犹如考古，有时一个意外的线索就能导致重大的发现，也有的时候，美丽的传说最终被证明是无稽之谈。一个考古学家，要凭着专业知识和丰富的经验判断线索是否可靠，还要经过反复验证和实地考察才能最终确定。考古学家深知即便是可靠的线索，也未必会引致重大的发现，而考古工作艰苦漫长，充满不确定性。但是掌握了一个可能引致重大发现的线索，仍然会感到兴奋，一种期待但审慎的兴奋。张钊起身告辞的时候，我心中荡漾的就是这种审慎的兴奋感。他所介绍的是否能够变成一个真正的投资机会还很难说，但是从方向上来讲，是值得探讨的。银行业是一个严格监管的行业，准入门坎极高，外资收购中国一家全国性银行的控制权，根本不在市场想象的范围之内。深圳市政府寻求出售控制权，想必是因为这家银行亟需救治。但是否还有救，全是未知数，只有在调查之后才能做出判断。新桥的内部有个共识，即投资银行是在一个国家的经济上下赌注。当时中国经济是在全球主要经济当中增长速度最快的，因此银行的增长潜力也是巨大的。如果能够获得控制权，煞住使深发展陷入困境的不良贷款风险，成功改造它就应该有相当的把握。当然前提是它还有救。如果银行的亏损窟窿太大，没有政府救助，我们也回天乏术。我请张钊向深圳方面反馈，新桥有兴趣探讨收购深圳发展银行的控制"], "wcount": 4693}, {"icon": "2", "title": "第二章 慧眼识珠", "paras": ["一周之后，我在张钊的德汇律所见到了深发展的行长周林先生。那一天是2002年4月8日。同事欧巍与我同行。欧巍只有30几岁，但已有多年工作经验。他曾在科尔尼咨询公司（A.T. Kearney）任职，后来加入了美国信罕银行（Bankers Trust）。他先于我3年加入新桥投资。他的普通话、广东话和英文都很地道。他将是深发展项目中一员主要干将。", "德汇的办公室设在太古广场一期的30层。港人有个习惯，就是把室内的空调开到最冷的档次，似乎要恶补户外的炎热，因此走到哪里，一进门就像进了冷藏室。在缺少能源的日本，长期执行节能措施，包括夏季室内空调的设置不能低过摄氏25度。而香港能源全部靠进口，包括从内地进口电力，但从来没有任何节能政策，包括餐馆在内的公共场所，经常把空调设置在摄氏16度。德的办公室也是如此，一进去我就感到凉飕飕。", "张钊热情接待了我们，将我们介绍给已经坐在会议室中的周林。周起身握手，说刚刚从深圳赶过来。周看上去50岁左右，中等身材，很结实，谈话的时候，脸上笑容可掬，给人随和可亲的感觉。他是学理工出身，曾经在国务院发展研究中心工作，后来调到深圳市体改委担任副主任，不久进入了银行业，先是担任广东发展银行深圳分行的行长，之后成为深发展的行长，已经5年了。显然，张钊已经向周林介绍了新桥，所以他多少了解我们收购银行的业绩。他说，深圳市政府致力于改革开放，希望通过引进有经验、合格的外资，把深发展搞好。我们都明白，“搞好”言外之意是深发展目前的情况欠佳。他说，“根据我了解的情况，新桥是个合格的，也是最合适的投资方，因为你们懂得银行，也了解中国的国情。”他所说的“合格”，是指从银行监管的角度，只有够资格的机构投资者有可能获得批准控制一家银行。合格的门坎很高，有监管的严格规定，对于外资还有特别的限制。不合格的，有钱也不能收购银行的控制我和欧巍一边听他介绍，一边频频点头表示赞同。他接着说，市政府持有深发展大约20%左右的股权，分散在几家市政府控制的实体手中，政府有支配和出售权。银行现存问题是有相当数量的不良资产，贷款损失造成资本金严重不足，亟需补充。他粗略估计深发展大约需要40亿元人民币才可能达到监管要求的资本充足率。", "深发展资本金不足并不令人意外，当时中国每家银行都或多或少存在资本金不足的问题，但是深发展的总资产在当时不过1200亿元左右，有这么大的资本缺口，让我们很吃惊。一般来讲，一个银行的资本金占总资产的比例达到5%就够了，当然这是假设资产的质量是好的。按照这个比例，深发展的全部净资产一也就是资本金一不过需要60亿元人民币，而它的缺口就有40亿元，也就是说现有的资本金不足所需的三分之一。我赞赏他的坦率，但同时，我猜测真实的情况可能比他说得还要糟。我心想，这么大的窟窿，怎么填，由谁来填呢？周林看出我挂在脸上的疑惑，不慌不忙地说，“我们已经有了补充资本金的方案”。他解释说，作为上市公司，深发展可以通过配股的方式发行新股，从现有股东中募集资本金。配股是股票增发的一种方式，现有股东可以获得一定比例的认购权，比如每10股配3股，定价一般比公司股票市价打一个折，比如只有市价的70%或80%。大部分股东不会放弃这么大的便宜，因此参加认购。这样公司就可以募集到所需的资本金。当然也不排除有些股东放弃行使认购权。为了确保成功，发行公司需要聘请投资银行，也称之为证券公司，承销新股的发行。承销商要保证将认购权按照持股的比例发放到股东的手中，如果认购出现缺口，承销商就要包销，也就是自己出钱认购股东认购不足的部分。未来承销商或者自己持有这部分股票，或者择机在市场上慢慢脱手。但对于发行股票的公司来讲，有了承销商的包销，足额认购就得到了保证。周林说，深发展已经聘请了上海海通证券作为承销商。海通是中国最大的券商之一，所以发行成功没有悬念。用配股的方式募资等于是股东出钱填补资本金的窟窿。如果新桥收购了市政府所持有的股权，是否参加配股呢？参加了，就等于按比例去填窟窿，承担老股东应该承担的损失；如果不参加，那么新桥所收购的股权就会被摊薄。假设原来持有2亿股，占20%的股权，但是由于增发，总股数从10亿变成了20亿，那么2亿股占总股数的比例就从以前的20%摊薄到增发后的10%。持股比例减少就可能失去控制权。这不是进退两难吗？", "周林说，不需要增发很多。现在股票市值很高，是账面净资产的5倍左右。所以每10股配3股就足够募集40亿元了。如果新桥买了政府所持有的股份，不参加配股，那么只是摊薄30%，也就是说20%的股权摊薄成15%左右，仍然是单一最大股东。当时在海外资本市场上，银行股的交易价格一般不超过账面净资产的两倍，这个倍数称为“市净率”，也就是市值对净资产的比率。在国内股市，深发展股价市净率居然高达5倍，让人感到不可思议。这么高的市净率反映两个因素：一是中国经济处于高速发展阶段，所以市场期待银行总资产和盈利也快速增长；二是中国股市尚不成熟，具有很大投机性，股价并不真正反映公司的实际价值。深圳证券交易所是在1990年12月成立的，到那时只有不到12年历史。", "我觉得周林说得很有意思，我也长了见识。看来他把可能存在的问题和解决方案都想得比较透彻了。在国外，如果一个银行糟到这种程度，它面临的只有两种可能：破产倒闭或政府接管。而在中国，它不但继续经营，而且受到股票市场的热捧。在发达国家中，一般都有存款保险制度，如果银行破产，无法支付客户存款，那么存保制度就会出资支付，使存户免受一部分损失。一般而言，存款保险公司是国家全资拥有，比如美国的联邦储蓄保险公司、韩国储蓄保险公司等等，所以银行破产之后，先由国家的储蓄保险公司接管，之后或者关闭，或者清理后再出售。2015年之前，中国没有存保制度，但是一般期待政府会用国库的钱偿还零售存户的。1998年海南发展银行破产，人民银行决定将其关闭，但是足额支付了境外债务和境内居民储蓄存款的本金和利息。政府接管的例子还有新桥在2000年所收购的韩国第一银行。当年韩国政府将韩一银行出售给新桥的时候，所有不良资产造成的缺口都由政府出钱填补了。此前，我从没想到，拯救一家技术上破产的银行，还有第三种可能性，这就是周林所说的：在牛气冲天的资本市场用很高的股价增发股票，母须增发很多，就可以募集足够资本，填补银行净资产的不足。当然，这种救银行的方式大约只有在彼时的中国股市存在，是特殊情况。在国外相对成熟的股票市场，如果一个银行处于深发展当时的状况，股价应该是非常低迷的，不可能高价增发。虽然周林所说在理论上可行，我还是怀疑实际上是否办得到。我问他万一做不成，配股不成功怎么办。他笑了，说没有万一，深发展不是第一次搞配股增发了，以前也搞过，也是海通证券承销的，而且海通还因此成了大股东一没有认购的股票海通都自己吃下来了，也获得了一席董事会席位，由海通董事长王开国担任。海通此次包销，驾轻就熟，有足够信心和把握。他还说，虽然政府持股只有20%左右，但是有绝对的控制权。这是因为作为上市公司，深发展的股权非常分散，有几十万股民，散户占比72%。因此20%的股权就成了绝对最大股东，没有任何其他股东可以望其项背。第二大股东是海通，持股比率不过3%左右。因此政府得以任命董事会中大多数董事和包括董事长、行长等在内的高管。如果新桥收购了政府所持股权，也同时接管了控制董事会和管理层的权力。我和欧巍心照不宣地交换了一下眼色。我知道他和我一样，听了此话，如饮甘露。周林谈到关键了。对于新桥来讲，取得控制权是先决条件，舍此我们不会感兴趣。因为没有控制权就谈不上改造，就无法使银行摆脱困境，那么投资不可能成功。虽然张钊在上次见面的时候就说我们可以获得控制权，但我将信将疑，因为不知道如何做到。根据中国银行业监管规定，单一外国投资者占有一家中国的银行股比不得超过20%，而所有外资持股总和不能超过25%。由于这个限制，外资不可能成为大多数或控股股东。听了周的解释，我们明白了，深发展是个特例，由于股权高度分散，政府所持有股份不足20%，却足以掌握控制权。在整个中国的银行业，深发展独此一家具有这种股权特点。", "我感觉像是发现了新大陆。有了控制权，我们就可以聘任世界上最好的董事、最好的管理层，创建最好的风控体系、信贷文化，制定发展战略。根据我们的经验，我们就有把握改造这家银行，使它强壮。", "看来这个投资项目很值得探讨。", "与此同时，我和欧巍都知道，投资是否可行，还取决于许多因素和条件。其中，深发展的资产窟窿到底有多大？是否还有救？监管机构是否会批准作为外资的新桥控制一家全国性的银行？我们需要搞清楚这些以及更多的问题。我总认为，任何事情看起来过于完美，就未必是真的，天上不会掉馅饼，好事不会恰好落在我们的头上。既有利就有弊，既有机会就有风险。新桥当初收购韩一银行的时候，政府首先倾心的收购者是世界上最知名的大银行，而非新桥。只是在政府认为新桥提出的条件更有吸引力时， 看上了我们。深圳市如果要出售深发展的股权，为什么不去找世界驰名的大银行，而找到了新桥投资？如果我们谈了一半，政府移情别恋，我们岂非竹篮打水一场空？", "周林说，不必担心。我们不是没有找过国外的大银行。实际上，我们已经接触了好几家，包括美国的花旗银行和香港的汇丰银行。但是这些银行都没兴趣，“因为他们都看不懂。”我能理解为什么这些大银行看不懂。在收购韩一银行的时候，我们的竞争对手也是花旗银行和汇丰银行，到最后还是新桥胜出了。原因是大银行都比较善于收购“好”银行一资产质量好、健康的机构，而对于如何救治“坏”银行—那些不良资产过多的银行一则缺乏经验和能力。而且它们收购同样一家坏银行的成本比之像新桥这样的投资机构要高得多。为什么呢？这和监管规定有关。银行监管非常严格，如果一家银行有不良资产一不能正常还本付息的贷款或者其他必须减值的资产，则必须对不良资产拨备。拨备也叫做准备金，意思是从利润中扣除一定的数额，悠在是然板个些属一就团以探锁否桌盗应豇双产只的热后满塑婴烈润奀拨备不足的银行，那么前者就需要与后者合并财务报表，这样一来，它必须按监管规定立即补足拨备。也就是说，任何外国银行收购了深发展，需要自身立即拨备至少40亿元或者更多人民币，除此之外，还要支付收购金。这成本就太高了。新桥则不然。新桥是投资公司，不是银行，所以没有自身设计拔备的要求。因此大银行无力收购的，我们也许可以。之所以是也许，而非肯定，原因是即便对于我们，也取决于资产窟窿有多大，由谁来填补。如果资本金补充没有别的来源一政府支持或资本市场募集，而需要我们掏腰包去补足，那么我们面临的问题会和大银行一样，算不过来这笔账。了解到确实有可能控制一家全国性的银行触动了我和欧巍的兴奋点，尽管我们都没有流露出来。在此时，还很难讲这个交易有多大的可行性，能否和对方达成何种交易也是未知数。但我仍然向周林确认了新桥的初步兴趣。听了我的话，周林绽开了笑容，说“我找到了慧眼识珠的人。”他保证会配合我们做尽职调查，让我们深入查账，他也会协助我们和政府方面沟通。尽职调查是专业投资机构必须做的工作，以确保对于收购的对象知根知底，据以做投资决定。周林给我们留下的印象是聪明干练，和蔼可亲。他思维缜密，善于言辞，很有说服力。我见过很多大企业的老板，和投资者初次见面时多少摆点儿架子，谈论自己的企业就像销售员推销产品，一切完美无缺。越是如此，投资者就越警惕，因为没有一个企业没有弱点或缺点，如果老板报喜不报忧，只能说明他要么对自己的企业了解不深，要么他不肯吐露真情。不说实话，就无法创建信任，而信任是任何交易的基础。周林和我们初次见面，既说清楚了深发展是个难得的投资机会，又坦言银行存在的问题，再提出了解决问题的方法。我感到此人靠得住，可以合作。", "但我还隐约感到，他急于将这家银行出手，好像是块烫手的山药。", "说到这里，有必要介绍一下中国银行业。中国的商业银行主要有两大类：一类是全国性的，另一类是区域性的，包括各地的城市商业银行和农村商业银行等等。全国性银行在全国各地设置分行和支行，而区域性银行只能在其所在地发展业务。当年全国性银行仅有15家，包括前述的四大国有银行、交通银行以及中等规模的股份制商业银行—深发展就是其中之一。不言而喻，全国性银行当然比区域性银行的规模和发展空间要大。", "深圳发展银行是共和国历史上第一家向社会公众发行股票的股份制商业银行，1998年其上海分行开业后，逐步走向全国。深发展成立于1987年，由多家信用合作社合并组建。1988年4月7日深发展发行的股票开始在深圳证券公司的柜台交易。深圳证券交易所在1991年4月正式开业，深发展在深交所挂牌交易。深发展在全国拥有大约200家分、支行。一般而言，分行是在省会或大城市级别设立的，下辖若干支行。比如广州分行下辖的支行遍布广东省，上海分行下辖的支行遍及上海。截至2001年底，深发展共有5000名员工，总资产大约1200亿元人民币。各国银行业都受严格监管，中国也不例外。在世纪之交，中国银行业受到的控制和监管比大多数其他国家的同行更为严格。此时，中国银行业监督管理委员会一即银监会一尚未成立，所有银行由中国人民银行一简称人行或央行一监管。人行严格控制银行牌照的发放。在2000年左右，中国仅有15家全国性银行和100余家城商行以及规模微小的农村商业银行。相比之下，美国的人口只有中国的四分之一，领土面积和中国差不多，却有8000家银行。所以在中国，银行牌照是极为稀缺的资源。", "银行盈利的基本模式是赚取存款利率和贷款利率之差。在大多数国家，利率由商业银行按照市场竞争条件和客户质量自行设定。如果一家银行的存款利率低于同行，它自然很难吸取存款，而贷款利率高于同行则难以吸引借贷客户。由于竞争激烈，存款和贷款之间的利差很薄，大概在1%到2%之间。在当时的中国，利率由央行控制。央行设定贷款利率下限和存款利率上限，保证利差足够大。因此，无论银行之间竞争如何激烈，基本利差实际上是由央行保证的，比国外市场高得多，给予中国的银行很大盈利空间。可以说，有了高利差的保证，银行牌照简直就像是印钞牌照。当然，银行赚钱的前提条件是发放的贷款可以收回来，否则一笔坏账就可以抵销数笔甚至数十笔贷款所能赚来的利差。深发展就是因为产生了大量不良资产 使得资本金严重短缺。当时银行业大体情况也相似。基本利差由央行限定是中国银行业当时的特质使然。在银行体制改革之前，风险控制缺位，大量贷款收不回来，银行普遍亏损，那时如果放开利率管制，极易导致银行间恶性竞争，压缩利差空间，造成更大的亏损。因此要放开，必须先改革。这也是为什么先有国有银行改革，再有利率市场化改革。尽管有坏账问题，中国的银行资产每年都在增长。银行放的贷款收不回来，怎么还能持续新增贷款？这是因为客户在银行的存款不断增高。", "中国经济一大特点就是储蓄率高，为世界之最，储蓄占国内生产总值的比例大概在50%左右。而像印度这样的国家不过30%左右，发达国家就更低。所以中国银行业的流动性特别好一流入的钱比流出的多。尽管不少银行在技术上已资不抵债，却仍可以靠流动性维持经营。但这种经营模式很危险，因为如同一个巨大的庞氏骗局一靠新钱来补老钱，早晚是要穿帮的。更何况储蓄率会随着人口老龄化而逐步下降，长期靠吸收存款维持流动性也不可能。到了世纪之交，中央政府敏锐地意识到银行体系的软肋，开动了改革。新桥有改造银行的经验，懂得如何创建世界一流的风控系统，如果收购了深发展的控制权，就可以控制不良贷款产生，使银行资产质量提高，盈利能力增加，同时在有意无意之间实际参与中国银行体制改革。只是彼时我们未经调查，不知道这家银行是否坏账太多，不可救药了。稍有不慎，投资可能血本无归。另外，我们很难判断监管部门是否会批准外资收购一家全国性银行的控制权。毕竟，自建国以来，史无前例。尽管有这些顾虑，我们还是愿意去深入探讨。也许深发展银行是一块未经雕琢的璞玉呢。"], "wcount": 6467}, {"icon": "3", "title": "第三章 名正言顺", "paras": ["新桥是个私市股权投资公司。“私市股权”译自“Private Equity”，媒体常用的称谓是“私募股权”。但翻译成“私募”是不对的，始作俑者显然并不懂在这个用语中“Private”是什么意思，以为意指资金来源于非公开市场的募集，其实这个“私”字指的是投资去向，即投向非公开市场，或称私市。通常来说，在公开市场（Public Market）也就是在股市中购买的股权被称为“Public Equity”，即上市公司的股权；私市股权 （Private Equity）一般是非公开市场的非上市公司（也有例外）。实际上，无论是投资股市的基金一比如对冲基金，还是投资非上市公司的基金，资金来源一般都是私募的，所以区别它们的并非资金来源，而是资金的去向。因此，“Private Equity”应该翻译成私市股权。深发展是上市公司，股票在深交所交易。但我们并无兴趣到股市上去收购其流通股，况且当时A股市场尚未对外资开放。我们感兴趣的是它的控制权。政府通过几家国企所持的是法人股。法人股不在股市流通，但是可在股市之外转让。除了流通性的区别，法人股和流通股在理论上讲应该“同股同权”。在二十一世纪初，私市股权投资仍然是个新兴的行业，但是其起源可以追溯到十九世纪后期和二十世纪初期的企业并购。那个时代被称之为第二次工业革命，其标志性的特征是技术进步和现代金融制度崛起一银行和股票市场将大量私人资本注入到诸如钢铁冶炼、汽车生产和铁路建筑等大型投资项目中。1901年美国金融大亨约翰.皮尔庞特.摩根（J.P. Morgan）收购了卡内基钢铁公司。摩根掌握庞大的金融资本，他组建了有史以来世界上第一家价值10亿美元的公司一美国钢铁公司。他还将美国铁路网大面积整合在北方证券公司旗下，从而形成对铁路运输相当程度的垄断，最终导致西奥多．罗斯福总统（即老罗斯福，任期1901-1909） 根据《反托拉斯法》将其分拆。1907年美国陷入金融危机，摩根本人利用其在华尔街的巨大影响力出手拯救了金融市场。当年摩根收购卡内基钢铁公司的价格是4.8亿美元，按购买力计算，约合相当于2024年的173亿美元。摩根是个超群的金融家，拥有巨大财势。之所以用“财势”，而不用“财富”是因为他对金融界的影响以及可以调动的资金远远大于他的个人财富。他在1913年去世，留下的个人财富不过8000万美元而已（约合2024年的25亿美元），这当然是个不小的数字，但是与安德鲁.卡内基（Andrew Carnegie） 相比，就是小巫见大巫了。卡内基出售钢铁公司就收到2.25亿美元，（相当于2024年的82亿美元）。据说，约翰.D. 洛克菲勒 （John Davison Rockefeller）听到摩根的财产数字时打趣道，“我们所有人都在他的股掌之中，没想到他并不是那么有钱。J既然摩根个人财富有限，他海量收购的资金从何而来？", "简而言之，摩根用的是他人的钱，既包括股本金，也包括借贷。他所做的从根本上来讲就是私市股权投资：从机构投资者中募集资本，用于投资或收购企业；而且收购对象大多数是非上市公司。投资目的是为投资者赚取回报。私市股权投资公司是资产管理者，为投资人管钱，如果投资获取利润，管理者提取一定比例的分成，当然如果投资亏损，管理者则一无所得。一般而言，投资管理人和投资者之间的关系是合伙制，管理人为一般合伙人，而投资者被称为有限合伙人。在以收购为目标的私市股权基金中，投资者一也就是有限合伙人一一般都是大机构，包括国家主权基金，例如新加坡政府投资公司（GIC）、科威特投资局（KuwaitInvestment Authority）、中国投资公司，也包括政府或企业退休金系统，例如加拿大养老金计划投资委员会（CPPIB）、美国加州公务人员退休基金系统（CaIPERS），此外还有保险公司、大学的捐赠基金等等。一般合伙人募集基金用于投资和收购。当然基金规模越大，每笔投资的规模也越大，而且资本金辅之以贷款，可以撬动的投资规模就更大。作为一个行业，私市股权的历史比较短暂。最具有标志性的一笔交易是KKR在1988年收购纳贝斯克公司（RJR Nabisco）。KKR分别代表三个合伙人姓氏的第一个字母。纳贝斯克有两大业务板块：烟草和零食。收购价为250亿美元。这是一个典型的杠杆收购（杠杆的意思是收购资金中包括借来的钱），250亿美元收购款中的80%多来自借贷。此收购是KKR的成名作。次年，即1999年，两名《华尔街日报》记者将这笔交易写成书发表，题为《门口的野蛮人一RJR 纳贝斯克的陷落》（Barbarians at the Gate），KKR因此名噪一时。", "此后，不少私市股权投资公司相继诞生，很快成为一个庞大的行业。时至今日，在美国私市股权投资公司控制的企业数是所有上市公司总数的两倍。", "我在1998年加入新桥投资公司。那时私市股权还是个新行业。此前，我在美国摩根银行供职，办公地点在香港，负责的是中国的投资银行业务。只是因为偶然的机会我加入了投资银行，也是因为相当偶然的机会使我进入了私市股权投资行业。在进入投行之前，我在美国的沃顿商学院（Wharton School）任教。当了6年的教授之后，我有些厌倦了象牙塔中的生活。1992年邓小平南巡，促动了中国经济新一轮的改革和高速发展，一时之间，中国到处都是商机。1993年，摩根银行需要聘请一位既了解中国，也了解美国，同时又有一些金融知识的人，帮助开发在中国的投行业务。摩根的一位高管找到我，把我打动了。沃顿是美国顶尖商学院之一，但是其教授薪酬，比之投行根本无法同日而语。我至今也不明白为什么搞金融的比教授金融的报酬高这么多。我认为这是制度的不合理性。但是市场就是如此。", "就这样，我“下海”了，携全家离开美国，移居香港。", "那时香港还是英国殖民地，其主权要到1997年 回归中国。回归之后，香港实行“一国两制”，仍然沿用英国普通法，其司法体制独立于政通八达的航空枢纽，往来全世界的主要城市都有直飞航班，更不要说与中国内地的紧密联系。香港所得税率比较低，一般为15%，而最高收入税阶也不过17.5%，而且资本利得和红利都是免税的，进口商品也基本免税。所有这些，加之讯息和资本自由流动，港币自由兑换，且绑定与美元的汇率，使香港成为世界金融中心之一，更是亚洲最大的金融中心在1997年，一场空前的金融危机席卷亚洲。危机始于当年7月2日，当天泰国货币泰铢大幅贬值，触发了外资从几乎所有亚洲国家外逃，造成各国货币相继贬值，股市暴跌。在10月23日，代表港股的恒生指数在一日之内狂泻16%。当年，韩国股市损失了49%的市值，而韩币对美元的汇率暴跌66%。以美元计价，韩国股市在一年之内蒸发了82%的市值。从韩国到日本再到印度尼西亚，亚洲国家都受到了金融海啸的重创，银行体制摇摇欲坠。", "中国的银行体制也很虚弱，但因为中国实行资本管制，人民币不能自由兑换，所以没有资本外逃的问题。资本管制像一座高坝，挡住了肆虐的金融海啸。", "事有凑巧，在亚洲金融危机爆发之前的几个月，一家猎头公司的老板约我见面，说一家叫做新桥投资的美国私市股权基金要聘请一位合伙人，问我是否有兴趣考虑。", "那时我对投行已经厌倦了。我的工作需要拉关系，这不是我的强项，时而感觉像李白所云，“安能摧眉折腰事权贵，使我不得开心颜”，所以早就动了改行的念头。", "但当时我对私市股权投资行业一无所知，也未曾耳闻新桥投资公司，所以对于猎头公司送上门的机会，我一直迟疑未决。突如其来的亚洲金融危机，改变了一切。因为突然之间，资本市场和与之息息相关的投行业务都深度冻结，亚洲各国资产价值大幅度缩水，很多企业陷入资金饥渴的状态。这样的市场对投行业务是灭顶之灾，但对投资基金却是天赐良机。因此一来二去，我接受聘请加入了新桥投资公司，并于1998年新年伊始到任，开始了一段崭新的职业生涯。", "新桥的联席主席庞德曼曾说，私市股权行业中不少人都是在无意之间撞入的。他本人就是如此。他在哈佛大学法学院毕业，曾经在埃及学习伊斯兰法，也学会了阿拉伯语，然后成为一名法学教授，再后加入美国司法部任律师。缘于偶然，他被得克萨斯州一个家族投资公司看中，受聘为首席投资官，从此入行。", "我也未曾想到有朝一日会进入这个行业。但机会来临时，我同样感到难以抗拒。此时，庞德曼在行业中已经很有名望，他的成名作包括收购美国大陆航空公司，将其扭亏为盈，以及从美国政府手中收购破产了的美国储蓄银行，同样将其成功改造，这两项投资都获利颇丰。有一件事特别能反映庞德曼的做事风格。收购大陆航空公司之后，他有一次乘坐该公司的头等舱，发现送上的餐食质量很差。他把这盒饭用联邦快递直接寄给了大陆航空的首席执行官。此后该公司的餐食质量大幅度改善，因此提升了对客户的吸引和本身的竞争力。庞德曼性格直来直去，而新任的大陆航空首席执行官也是个牛人，两人时而发生碰撞。据说双方都不喜欢对方。若干年之后，那时TPG早就成功退出了大陆航空，有一次我问庞德曼，你既然不喜欢那位首席执行官，为何不把他开掉。庞德曼回答说，“他是最佳人选（He is thebest）”。庞德曼就是如此，用人在其所长，不计个人好恶。", "迪克，布朗姆是新桥的另一位联席主席，年长庞德曼七岁。他从加州大学柏克莱毕业之后一直从事投资业务，成为一家知名投资经纪公司的合伙人时刚刚30岁，为该公司历史上最年轻的合伙人。40岁那年他创立了布朗姆投资公司。布朗姆为人随和，也是个性情中人，喜怒形之于色。他酷爱登山，长跑，所以身体强健。", "唐开罗 （Dan Carroll）与我是新桥的联席管理合伙人。在收购韩国第一银行时，为了保密，新桥聘请的顾问给每个团队成员起了代号，本人的代号是“瘦子”，而唐开罗的代号是“帅哥”。他的代号名副其实。他身材高大，面容英俊，还时常笑容满面。唐开罗在哈佛和史丹福两所大学分别获得学士和工商管理硕士学位。在加入新桥之前，他曾在一家称之为汉鼎亚太（Hambrecht &amp; Quist Asia Pacific）的风险投资公司任职布朗姆、庞德曼和唐开罗都住在美国，但经常来往亚洲。尤其唐开罗，几乎每个月到访。他和我保持电话沟通。我们两个共同负责新桥，但主内的是他，我把全部时间和精力都集中在投资项目上。在二十世纪九十年代，中国市场充满风险。很多外国投资者都在此败北，血本无归的不在少数。在我加入之前，新桥所作的投资都不大成功，而且大多因投资伙伴侵蚀我方利益所致，以至于布朗姆发牢骚说新桥在所有的投资项目中都上当受骗。其实，投资失败的责任也不全在投资伙伴不够诚信，也在于新桥自己不够谨慎，投资结构有瑕疵。", "例如，新桥投资了上海的大白兔奶糖。这个品牌家喻户晓，我在儿时就熟悉。新桥投入之前，这是一个盈利企业，但是投入之后它开始亏损。为什么呢？原来新桥所投的合资企业只涵盖生产部门，不包括市场和销售部门。而我们的合作伙伴，在生产部门有控股权，在销售部门更持有100%股权。结果生产部门亏损，而利润都转移到了销售部门，所以我们亏钱，但合作伙伴却很赚钱。显然投资结构造成了双方利益不一致。如果当初双方在两个部门都持有相同的股权比例，就不会造成利益冲突。", "当时有些人认为，因为中国市场不同于发达国家，所以投资的方法必须不同。其实投资必须遵循的一些规律和准则，在所有国家都相通。譬如说投资架构必须使合作方利益一致，投资必须合乎当地的法规，一丝不苟，这些基本规则在哪里都必须遵守。后来我们从中国的投资中总结出来的经验教训就是如庞德曼所说，“无论是中国和美国还是在世界任何其他地方，我们的投资标准都不能打折扣。”庞德曼喜欢说，活着就要学习（We live to learn）。中国人的说法是活到老学到老。在任何新市场，都要逐渐学习市场规律和特点。到了2002尤其有利于改造企业，增进价值。如果无法获得控制权，那么我们的投资必须有结构性的保护，简而言之，要求控股股东或者是企业本身，提供还本并支付一定回报率的保证。因为少数股权持有者不能左右公司的运营，如果控股股东或管理层不能保证最基本的回报，我们如何有信心投资呢？在新桥内部，所有合伙人对在中国收购全国性银行的控制权感兴趣，认为是个可望而不可即的机会，但大家脑袋里都充满问号：这家银行的资产质量到底糟糕到什么程度？我们能否和卖方谈成双方都可以接受的条件？我们能否将其扭亏为盈使投资成功？外资在中国收购全国性银行的控制权是破天荒之事，并无先例可循，办得到吗？", "对于最后一个问题，我认为，中国是个不成熟的市场，无可无不可，往往并无一定之规，任何事都可能办不成，但任何事都可能办成。成败与否，事在人为。", "2000年，新桥在竞争中击败汇丰银行等对手，从韩国政府手中收购了韩一银行的控股权，轰动市场。《华尔街日报》发表社论，赞誉此项收购是韩国银行业改革的“大胆之举”和“领头羊”。在那个项目中与我合作的同事主要是唐开罗、陈德彪和潘德邦。在深发展项目中，我们核心团队的构成有所不同，主要成员包括我本人、欧巍、刘伟琪以及潘德邦。欧巍之前已经介绍过了，刘伟琪是香港人，他和欧巍一样，广东话和普通话都很地道。潘德邦也是港人，听得懂普通话，但讲得不够流利。这个团队对中国市场都很熟悉。香港太古广场是个集酒店、办公楼和购物中心为一体的综合建筑群，占地7公顷左右。毗邻的香港公园，面积更大，占地8公顷。港岛寸土寸金，拥有世界最为昂贵的办公和住宅楼，但香港公园就地处高楼大厦之间，园中一片自然风光，花木繁茂、红肥绿瘦，乌兽奇珍、鸣声上下，游人如鲫，往来不绝。香格里拉酒店就坐落在太古广场中心，是内地游客最青睐的五星级酒店之一。2002年4月19日，在香格里拉酒店的一个单间里，我们与周林再次见面，共进早餐。我方代表包括我本人、欧巍和潘德邦。双方开始谈收购深发展股份的价格。在国际市场，银行的定价通常是调整后有形资产净值的倍数。调整的方式是从账面净资产中减除对于不良资产拨备不足的部分。有形净资产不包括商誉等无形资产。调整后有形净资产就是实打实的净资产，也称之为资本金或股本金。我建议请知名的国际会计师审计深发展的资产，计算出调整后有形净资产的价值，在此基础上双方讨论以什么倍数作价。在我们看来，这是最公平合理的。", "周林表示理解。他承认深发展的拨备确实不足，但他担心经调整之后有形资产净值为负数，那么任何倍数都变得毫无意义，因为负数的任何倍都是负数，如果价格是负数，岂非意味着卖方还要倒贴买方？当然，这是荒谬的。因此他建议如果调整后的净资产为正，则以调整后的数字为基础议定比较高的倍数；而如果调整后的净资产为负，那么就不管调整后的数字，仍然按照市场对于法人股定价的惯例以账面净资产的倍数作价。", "我们表示原则上赞同，并建议在确定深发展实际净资产值之后再讨论作价。周林希望双方能够尽快签署一个新桥投资意向书。就在餐桌上，双方达成一致意见，深圳方面将给予新桥独家收购权，新桥立即开始尽职调查，将银行的资产质量和经营状况摸清，而定价的谈判则放在其后。2002年4月26日，双方签署了一份保密协议和一份意向书，此时距离双方首次见面不足一个月。意向书所表述的不仅仅是意向，也是下一步的具体安排，要点如下：", "• 新桥拟从政府手中收购深发展法人股，对价待定。但“原则上，新桥所支付的价格应该定在卖方投资成本和净资产之间”。• 深发展拟以配股方式融资，现有股东每持有10股可以认购3股新• 新桥将指派董事替代由卖方一即深圳市政府一指派的董事，以取得在董事会多数席位。", "• 新桥享有独家收购的权利，卖方和管理层承诺不会就目标股份与任何其他第三方接触或谈判买卖。按照惯例，我们在内部给每一个投资项目取个代号，以便保密。当初收购韩一银行时，项目代号是“SAFE”，这个英文字既可以当形容词也可以当名词，既是“安全”，也是“保险箱”的意思，用在银行上可谓一般而言，私市股权投资公司的决策机构是投资委员会。新桥投委会成员都是合伙人，包括两位联席主席。项目团队给投委会发了一份备忘录，着重指出外资收购全国性银行的控制权在中华人民共和国历史上没有前例，因此需要获得政府最高层级的批准：", "可想而知，该收购过程将漫长而艰难，需要得到国务院总理本人及政府主管部门的批准，其中包括央行、证券监管机构和财政部。因此，最终完成收购的可能性不容乐观。", "对任何事情，如果期待值过高，一旦不成功，就会很失望；反之，本来期待值很低，成功了喜出望外，失败了则在意料之中，不会很失望。所以，项目团队要尽量降低投委会的期待值，同时又要求投委会同意并支持进一步探讨交易的可能性。"], "wcount": 6716}, {"icon": "4", "title": "第四章 天时地利", "paras": ["周恩来总理说邓小平的行事风格是举重若轻，而他本人则是举轻若重，不是帅才。周恩来对他本人的评价当然是谦辞，他是共和国的大管家，因此事必躬亲，宵衣旰食；他对邓的评价应该是中肯的。邓小平在文革初期1966年被打倒，1973年复出，恢复国务院副总理职务。他在1976年四五事件—在天安门广场悼念周恩来而自发的大规模群众活动一后再次被打倒。当年毛泽东去世。次年，邓小平再次复出。", "1978年底，中共中央十一届三中全会上确定了邓小平核心领导地位，主掌党政军大权。但终其一生，除了在1981年到1989年之间担任中央军委主席之外，他从未担任过中共中央主席、国家元首或政府首脑的职务，而是止于中央副主席和国务院副总理之位。他甘居幕后，选贤任能，提纲挈领，以其巨大威望，主导了改革方向。", "邓小平再次复出之时，中国刚刚经历了10年文革。按照时任中共中央主席、国务院总理华国锋在1978年2月所作的《政府工作报告》所说，“整个国民经济几乎到了崩溃的边缘”，可见形势之险峻。邓小平临危受命，挽狂澜于既倒，扶大厦之将倾，其肩上之千钧重担，可想而知。在他带领下，中国走上了改革开放之路。从他再次复出到1997年去世的20年间，中国的国民生产总值按美元计翻了两番，平均每年增长率超过9%，奠定了中国高速发展的基础。可就是这位改变中国命运的巨擘，仍有闲暇下围棋、打桥牌，且时与高手切磋。其举重若轻，可见一斑。邓小平主张检验真理的标准不是书本，不是教条，不是任何人的思想，而是“实践”。“实践是检验真理的唯一标准”，舍此无他。他治理国家不是把经济体制纳入既定模式，而是“摸着石头过河”，用实践找到最佳途径，“不管黑猫白猫，能捉老鼠的就是好猫”；“发展是硬道理”。这些道理看似浅显，实则极为深刻。去掉条条框框，打破意识形态束缚，搞市场经济，极大地解放了人民的生产力和创造力，随之而来的是经济腾飞。", "1975年底，我离开上山下乡6年之久的内蒙戈壁滩。那一年，中国的国内生产总值仅有1630亿美元，人均不到178美元。那时供应极度短缺，粮食和布疋都凭票供应，几乎所有商品都供不应求，可谓极度贫穷。", "改革开放并不一路顺风，其中不少坎坷，但它造就了经济腾飞。到了2002年，中国的国内生产总值达到1.47万亿美元，是1975年的9倍；人均1148美元，超过1975年6倍。在所有大中城市，一眼望去，到处是热火朝天的建筑工地和林立的起重机。一条条崭新的高速公路和桥梁像一张铺天盖地的巨网覆盖全国，连接四方。机场、港口都是日新月异。", "邓小平市场化改革的孪生兄弟是对外开放。开放是全方位的，包括贸易、投资和人员的交往。美国总统尼克逊（Richard Nixon）在1972年访华的破冰之旅后，中美在各自首都创建了联络处。美国根据“一个中国”的政策，同时与台湾断交。1979年，中国和美国实现了外交关系正常化，联络处升格为大使馆。当年，邓小平应卡特总统（Jimmy Carter）邀请访美。在一次会议上，卡特提出请北京放宽其移民政策，以换取美国国会同意中国获得贸易最惠国的待遇。后来卡特的国家安全顾问布热津斯基（Zbigniew Brzezinski）在回忆录中写道，邓小平听了翻译之后，身体向卡特方向微倾，问：“你准备接收1000万人吗？”美国总统再也没提这个话题。", "就这样，中国的大门渐渐打开。今天，很多西方尤其是美国的观察家都认为中国在2001年加入世界贸易组织带动了其出口行业的发展。其实并非如此。早在加入世贸组织之前，中国的出口就开始激增，从1996年的515亿美元增加到2001年的1020亿美元，五年内将近翻了一番。只不过，加入世贸组织为国内市场改革提供了进一步动力，使中国经济进一步与国际市场接轨，促进了出口大发展，使中国迅速崛起为制造业强国，被视为“世界工厂”。而出口又带动了经济高速增长。", "但迅勐的发展势头也掩盖了中国经济中的一个几乎致命的弱点，这就是银行中存在大量不良资产，使得整个体系十分脆弱。在韩国、印度尼西亚等亚洲国家，当亚洲金融危机来袭时，不堪一击的银行体系几乎拖垮了整体经济。如果中国不清理银行体系中的坏账，强化银行抗风险的能力，经济发展将难以为继。而且中国在加入世贸组织时，承诺逐步对外开放银行业市场。如果国内银行不能强化自己，则根本没能力和国际金融机构竞争。所以银行体制改革迫在眉睫。", "外资收购深圳发展银行控制权的机会就在这个背景之下应运而生。那是一个改革的年代，也是一个大胆创新的年代，在那个年代，改革的方向是“与国际市场接轨”。因此有了2001年中国加入世贸组织，才有了外资参与中国银行体制改革的可能性。司马迁说：“谚日‘力田不如逢年，善仕不如遇合’”一再怎么辛苦种地，不如碰上风调雨顺之年；再怎么会做官，不如碰上知人善任的伯乐。深发展的机会，可以说是恰逢其时。2002年5月的第二个星期五，我和欧巍、刘伟琪以及张钊律师一起驱车从香港去深圳，准备第一次与市政府官员直接面谈收购深发展事宜。我对深圳既不陌生，也不熟悉。以前来都是走马观花，浮光掠影。我第一次来是在1981年，当时几乎没有留下什么印象，因为那时这只是个小镇子，人口仅有6.8万。时隔20年之后，深圳已经成为现代化大城市，人口已经激增到750万人，比之1981年增长了110倍之多。高楼大厦林立，向任何方向望去都是施工塔吊和正在拔高的建筑。一个大都市如此迅速地拔地而起在全世界都史无前例，而深圳的发展正方兴未艾。楼房街道商店公路，一切都是簇新的。相形之下，公认的国际金融中心和国际大都市香港反而显得有些陈旧和寒碜。深圳经济特区也是邓小平的创意。早在1979年4月，他就提出，“可以划出一块地方，叫特区。”深圳经济特区是1980年成立的。后来搞了四个特区，其他三个包括广东的珠海和汕头以及福建的厦门。怎么搞？邓小平说，“中央没有钱，可以给些政策，你们自己去搞，杀出一条血路来。”所谓给些政策，就是松绑，让地方政府和私人企业比较自由地去发挥。搞特区也就是搞实验。如果成功，成为全国的榜样，可以推而广之；如果失败，其影响不过囿于一隅，对全国影响不大。可谓进可攻退可守之策。因此，这座古老而且沉睡的渔村和广阔的稻田成为市场经济实验田。结果是出乎意料的巨大成功，短短几年，这块地方不只旧貌换新颜，简直就是沧海变成了桑田。深圳的高速路两侧绿树成荫，街道两边的商店鳞次栉比，人行道人来人往，摩肩接踵。年轻女性穿着适合亚热带气候色彩鲜艳的衣裙。在二十世纪八十年代，人们出行的主要交通工具是脚踏车，可是今天脚踏车几乎绝迹了，代之以小轿车。交通繁忙，尽管路修得四通八达，仍然时而堵车。", "车开到一家酒店，周林已在门口迎候，然后把我们带入一家餐厅的单间，里面已经有人在等候。周林介绍说，一位是副市长宋海，另一位是政府副秘书长刘学强。两位都热情地与我们握手表示欢迎，寒暄之后，坐下来吃饭。宋海年约50，身材适中，发际线略微退去。他和我同是北京对外贸易学院的校友（后来更名为对外经济贸易大学），早我一年毕业。他的专业是西班牙语。后来他又在南开大学获得了经济学博士学位。作为副市长，宋海分管金融，当地的银行都在他的职权范围之内，对于深发展股权的转让，他是直接负责的官员。宋海在官场上多少有些与不同，既是少数民族一满族，又是民主党派民主建国会人士。副秘书长刘学强比宋海小几岁，看上去不像官员，而像是个学者。我后来才知道，他出版过短篇小说和散文集。我读过一些，文字优美。宋海说市政府为了吸引外资不遗余力，提供优惠政策，创造良好的投资环境。他还说改革开放是国策，深圳必须走在改革前沿。深圳市愿意将深发展的股权出让，为的是请有经验有能力的投资者，用国际上先进的管理方法，把它搞得更好。他对深发展的资产质量问题只字未提，但我想大家都心照不宣：把这个包袱甩给外资，对于银行和政府都有利而无害。宋海接着说，政府内部早就形成共识，民营化是改革国企的重要途径。", "国企的问题是，如果它亏损，政府要提供补贴和支持，消耗财政资源。", "而如果是民营或外资，事情就简单多了：如果亏损，那是股东的事，与政府无关；如果盈利，政府通过税收获益。因此政府只赚不赔。所以，政府的政策是，只求所在而不求所有。所在是要企业在当地纳税。", "这套思路道理显而易见，但并非每个地方政府都想得这么明白，而且付诸实践。深圳真不愧是改革开放的前沿阵地。宋海和刘学强还说有一首打油诗，最能说明市政府对外资的政策和态度：", "你投资，我欢迎，", "你发财，我收税，", "你犯罪，我抓人，", "你破产，我不管。", "我们几个听了哈哈大笑。这的确是政府该做的事，也说明为什么深圳市要转让深发展的股权。欧巍说，应该再加上一句：“你发展，我支持。”大家再一次抚掌大笑。", "作为经济特区，深圳走在中国改革开放的前列，也代表了中国发展的方向。但深圳敢于走出这一步，也是相当大胆的。", "席间，两位市领导还给我们吃了不少定心丸。他们说，在此项交易中，政府会尽一切可能给新桥提供支持与便利。但是政府对于我们也有要求，新桥需要承诺不会把银行的总部迁离深圳。为什么会有这种担心呢？因为中国大部分全国性银行的总部都聚集在上海，市政府当然不愿意深发展跑掉。留在深圳就意味着在当地创造就业机会，纳地方税。这个要求合情合理。", "我本来担心政府会要求我们收购之后不能裁员。许多国家的政府都会有这样的要求，以保就业。我们当时并不知道深发展是否有冗员的问题，如果有，我们当然需要精简机构，才能改善经营；如果不能，就成了改造企业的巨大障碍。结果这两位官员对此只字未提，可见他们对市场化认知的深度。", "因为历史、地理位置和经济体量等种种原因，上海是中国的金融中心。", "但深圳有自己的优势，这就是市场化和开放程度更高。中国企业当时所支付的所得税通常为33%，其中包括中央和地方的税收。但作为特区，深圳有特殊的优惠政策，企业所得税懂为15%。", "令人遗憾也惊讶的是，深发展并没有从优惠税率中获得任何好处。这是因为它管理不善。我们后来了解到，该行散布在全国各地的分行都在当地纳税，上海和广州分行赚钱，要按照当地较高的税率纳税，而深圳分行亏损，无须纳税，因此也无法获得优惠税率的好处。由于不是在合并报表的基础之上根据整个公司的盈亏纳税，深发展作为一个整体实际支付的税率是40%，比一般企业支付的税率高得多。虽是初次见面，宋海和刘学强都给我们留下了很好的印象。我觉得他俩都很干练、开明，平易也开诚布公。他们诚心诚意地努力为深发展引进经验丰富的外国投资者。", "做投资，最怕的就是花费无用功和浪费资源。谈判要花多少时间，交易最终是否成功，都无法预料。在韩一银行项目上，我们和韩国政府谈判超过了一年时间，聘请了各类服务商一投资银行、会计师、律师、咨询公司，等等。说起来外行难以置信，我们最终支付的顾问费有几千万美元之多，还不算自己团队的薪酬和费用。当然有些费用的支付以交易成功为条件。交易过程中，最担心就是卖方变卦，让我们竹篮打水一场空。为了防范此种风险，投资方一般要求在一段时间之内有独家谈判的权利。在此期间卖方不得与任何第三方就此交易接触。我们有兴趣，深圳方面也急于推动这个项目。2002年6月11日，我和团队在张钊的律所香港办公室又一次和周林开会，谈判收购价格。投资谈判最难的就是价格。一般而言，价格谈妥了，其他都好谈。在这个项目上，政府的要求相对简单，转让价格越高越好，没有什么其他条件。当然，从投资方的角度看，价格越高，风险越大。如何达成一致呢？对于银行股的作价，国际市场一般看“市净率”一价格对净资产的倍数，参考市盈率一价格对利润的倍数。问题来了。在国际市场上，银行股的市净率当时在1.5到2倍之间，而深发展流通股价对应的市净率超过5倍，大大超过国际市场价格。更要命的是，因为拨备不足，它的“净”还是个虚数，在夯实之前市净率无法计算。", "几年前和韩国政府谈判，焦点是政府如何担保投资者不承担历史遗留不良资产的风险。那时问题不在于政府是否要对投资者提供保护，而在于如何提供保护。韩国政府在出售银行招标时就已明确表示要提供担保，否则没有投资者敢于问津，因为当时韩国深陷经济危机之中，出售的银行已经破产而被收归国有。但是如何界定不良，如何防范道德风险的各种机制极为复杂，所以谈判过程极其艰难，旷日持久。而今天收购深发展的谈判，焦点只有价格，按理说应该相对简单。但实际并不容易。", "双方很快在原则上形成共识，作价应该基于调整后的净资产，也就是说在必要的核销、减值和拨备一把虚的净资产夯实一之后。关于价格对调整后净资产的倍数，周林提议4倍。我说无法接受，因为当时即使是世界上最好的银行，其股价也不超过净资产值的两倍，而我们仅在两年前收购韩一银行，实际价格只是净资产的一倍而已。我们拿出国外此类交易的市场先例和其他可比数据，建议用净资产的1.5至1.7倍作价。经过一个上午再加上午饭的时间，双方你来我往，反复论证，之间的差距逐渐缩小，最终达成妥协，同意以调整后净资产值2.5倍为交易价格，我当时认为已经做出了巨大让步。", "此时，周林说，他必须请示宋海，请他定夺。说着，他走出会议室，到另一个房间去打电话。我和同事在会议室中等候，心情很松弛，仅仅用了大半天的时间，就把最棘手的问题敲定，不由欣慰。", "但是高兴的太早了。不过15分钟，周林回到会议室，脸上流露出一丝沮丧，说宋副市长坚持交易价必须是调整后净资产的5倍。我吃了一惊，心想这简直是开玩笑。周林开价4倍我们都觉得是漫天要价，结果副市长比周林更夸张。我开始怀疑周林的权限，我们认真谈判了大半天的结果，被副市长一口否决了，显然周林事先没有和领导充分沟通，在电话上也没有把我们说的道理充分转达。我老老实实告诉他，无法接受副市长的开价。看来谈判卡壳了，怎么办呢？", "“别着急。”周林笑着说。以他的判断，调整后的净资产不是需就是负数，所以多少倍都无关紧要。看来他对深发展的资产质量心里有数，知道如果充分拨备和减值之后，净资产可能归零，甚至是负数。如果是负数，当然不能让股权出让方倒贴钱给投资方，所以负数等同于雾。当然政府也不会同意以需对价转让股权，所以讨论调整后净资产的倍数是没有意义的。这个作价的方法大概行不通。唯一的办法是在未经调整的账面净资产值的基础上作价。如此作价方法，在法人股转让的市场上是有例可循的。周林说，虽然在调整后净资产基础上作价可能意义不大，但是在现阶段，我们之间的框架协议中要把这个概念写进去，而且必须写上5倍的数字。因为这个数字对于政府方面是重要的。", "我不想让谈判陷入僵局，勉强同意了，但双方都知道作价仍是悬而未决的问题，所谓5倍也只有象征意义。但是在此基础上，周林可以做下一步的工作，争取从中央到地方各级政府部门的首肯，否则交易双方达成协议也没用。下一步需要争取中央监管部门的认可。认可不是批准，而是开绿灯，同意交易双方继续向前走。对此，他有信心，但也说这需要大量工作。会后，周林去了北京。"], "wcount": 6028}, {"icon": "5", "title": "第五章 上下一心", "paras": ["深圳五洲宝馆处于深圳福田区，1997年落成。其建筑颇为壮观，远远望去像是个巨大机器人的上身。躯体是个10层楼建筑，伸展出去两翼是六、七层楼的客房。建筑四周是花园和庭院，草木红绿相间。主楼宴会厅可容纳千人聚餐。时至今日，世界上几乎所有五星级酒店品牌都在深圳聚集了，但在2002年，五洲是屈指可数的高档酒店之一。2002年6月21日，深发展派了一辆车，到香港接上我和同事，一直送到五洲宝馆。从香港中环到深圳五洲宝馆，开车只需一个小时左右，还包括两边过关时间。", "我们到达时，周林和深圳市政府副秘书长刘学强已经在酒店一层的一个大功能厅中等候。大厅正中有张条桌，上面摆着两叠文件和签字用笔，条桌后面放着两把椅子，面对大门。握手寒暄之后，周林和我在条桌后坐下。我们面前有中英文两个版本的协议，中文版是《深圳发展银行股份转让与收购意向协议》，英文版是“Framework Agreement on ShareTransfer and Acquisition”，如果翻译称中文，应该是《股份转让和收购框架协议》。两个版本有同等效力。但不知为何，两个版本的标题并不是直译。以后，双方就一直简称为《框架协议》。此前，我已将双方认可的最终协议文本用电子邮件传给了深圳方面。周林需要代表深圳市所属的股东签字，而我则代表新桥投资。我一般在签署文件之前都要再审阅一遍，确保无误。审阅之后我发现，摆在桌子上的文件，并非双方确认的、也就是我发送的最终版本，而是之前的一个版本。", "恰巧那天我的行程紧凑，在深圳办完事后，我需要马上折返香港，去位于赤鱲角的香港国际机场乘班机飞旧金山，因此没时间等候正确文本打印。我们商量了一下，决定周林和我仍然在摆在桌面上的签字页上签字，刘学强和欧巍作为见证人，并摄影留念。我离开之后，欧巍留下，和周林重新签署正确版本。", "框架协议内容比较简单，包含交易主要条款，包括新桥将收购市政府所控实体所持的深发展所有股份，占总股数不超过20%。因为转让方还没搞清要转让的具体股数，所以协议上只写了大概的股份比例。协议明确新桥将有权任命董事会多数成员以及高管团队。转让价格为每股调整后净资产的5倍，但“5”放在方括号之中，表示仍然有待协商确定。", "框架协议不是最终买卖合同，但具有法律约束力，赋予新桥以排他性收购的权利，而新桥是否完成交易仍取决于对银行尽职调查的结果。我方律师本来起草的框架协议文本并不具有法律约束力，但我坚持认为虽然我方是否完成交易仍取决于一些先决条件，但卖方向新桥转让的承诺必须有法律约束力。这是为了防止卖方变卦，使我们重蹈在韩国的覆辙。新桥与韩国政府在1998年12月31日签署《共识备忘录》，给予新桥有法律约束力的独家谈判权利，排他期4个月。结果对方熬过4个月之后，不时以退出谈判要挟，使我们陷入进退维谷的两难境地，因为我们已经花费大量时间和成本，随时可能付诸东流。这是前车之鉴，不能重蹈覆辙。", "走到这一步，双方都感到兴奋。虽然我们清醒认识到，前面的路还很长，肯定充满曲折，能否最终成功仍在未定之数，但毕竟我们迈出了第一步。", "下一步要排除的障碍还很多，包括最终确定交易价格。深圳向外资出售一家全国性银行的控制权，是改革的重大举措，需要各级主管部门批准，其中包括广东省、中央的各级监管部门一央行、证监会和财政部，最终需要国务院批准。省政府是否会支持，中央政府是否会批准，我们无法预判。但我猜市政府心中有数，否则也不会发动这个交易。我心中也多少有数，在改革开放的大势之下，只要方向正确，就大有希望。对于审批，谁也无法打包票，我们只能沉住气，审慎乐观。", "新桥团队对于市场敏感交易不陌生，知道要守口如瓶。深圳方面保密工作也做得不错。尽管如此，还是走漏了一些风声。很快，深圳一家小报报道了深发展有意引入外资，但记者并不知道新桥是谈判对象，只是说：“周林目前证实了深圳发展银行与外国银行合资洽谈正在进行的传闻，深发展有可能成为第一家有外资参股的上市股份制商业银行。”报道中有一个小题目是〈与狼共舞〉，内容大意是，经过很多曲折，中国终于加入了世贸组织，加入条件之一是逐步对外国银行开放市场。", "“因此有人喊，狼来了；有人说要与狼共舞；也有人说要把自己变成狼。但是无论怎样，大家还是有一种羊的心态。”作者讲述了一个狼诱骗小羊出圈的“寓言”：狼对一只小羊说，附近有一块丰美的水草，我帮助你干掉别的羊，让我们能够独享。小羊同意了，把其他羊一只一只地引出羊圈。当所有的羊都被狼吃掉后，小羊走出了栅栏，准备与狼一起分享那片丰美的水草。“但这时狼却瞪着血红的眼睛露出了它本来的面目说，你以为世界上真有这么好的事情吗？狼怎么会改变吃羊的本性去吃草呢？看着周林微笑而自信的表情，记者突然想起了这个故事。”对此，我一笑置之，但我意识到，这个编造出来的奇怪寓言其实反映了当时有些人的心态：外国投资者是狼，穷凶极恶。其实，很多国内的银行并不是小羊，而更像是懒猪，不思进取，坐吃央行保证的利差，风控极差，不良率高，服务质量低。它们得过且过，是因为没有竞争的威胁。若无外部刺激，不可能有所改变。我觉得，中资银行倒是应该把自己变成狼，甚至是虎，在竞争中生存。", "事实上，变化已在悄然发生，中国已经允许一些外国银行在境内设置分行网点，但限制仍然很多。比如外国银行在华分行只能从事对公司的业务，而不能从事零售业务，不能吸收雾售存款。此外，按照监管的规定，外国银行每年最多只能新开设一家分行，而且须央行批准。当时深发展约有200家分支行。如果外行每年获批开设一家分支行，创建与深发展相似规模的网络需要200年的时间。而中、农、工、建四大国有银行每家都有上万分支机构。因此，在可见的未来，外国银行不可能对中资银行构成有意义的竞争威胁。但是随着市场逐步对外开放，如果银行业不彻底改革，那么在自家市场输给外国竞争者并非不可能。要保住地盘而且进一步发展的话，必须具备与外国银行竞争的能力。", "允许外资收购深发展这样的全国性银行控制权并不是中国加入世贸组织所承诺的义务之一。如果获得批准而且收购成功，这将是改革开放银行业标志性的重大举措。我深知此事意义重大。", "获得监管批准的可能性有多大呢？周林有信心，我想是基于深圳市的决心，但他也表示并无十分把握。毕竟这是一件从未尝试过的事。框架协议签署当晚，我和10岁的女儿一起飞往旧金山。落地之后，我们到一家购物中心买东西。正在逛商店，电话铃响了，来电的是欧巍。他说刚刚得到消息，国务院的领导审阅了深圳递交的报告，画了圈之后转交其他领导征求意见。他的语调平静，轻描淡写，但是我俩都知道，这个消息意义重大。如果国务院领导在原则上不认可，就不可能交有关部门审议。在2002年，国务院总理是朱镕基。他在1991年离开上海市第一把手的位置，到北京担任了第一副总理，然后在1998年升任总理。一到国务院，他就主管经济和金融，在1993到1995年之间，他还亲自兼任人民银行行长。朱镕基以刚正不阿，作风凌厉而著称，大刀阔斧推动改革，尤其是国有企业改革，“关、停、并、转”了很多亏损企业。2001年，他亲自主导中国加入世界贸易组织的谈判。世纪之交的银行体制改革也是由他指导。此时，他的改革议程还远未结束。", "1990年，我还在沃顿商学院当教授时有机会领略了朱镕基的风采。", "当时沃顿有位校友，名叫莫若愚，是新加坡华人，祖籍上海。他曾创办一家制造家具的公司，后来卖了，赚了几亿美元。莫先生对母校慷慨捐助。经过他穿针引线和资助，沃顿在1990年暑期与上海交通大学合作，办了一期高级管理训练班。当时朱镕基是上海市委书记兼市长。这个项目获得了上海市政府的支持，参加学习班的都是上海重点培养的干部，其中不少后来出类拔萃，包括当了中央政治局委员、上海市委书记的陈良宇（后因腐败被判刑）、当了中央政治局委员、公安部长的孟建柱、当了国务院秘书长、人大副委员长的华建敏，等等。而当时他们都是上海市区一级或国企总经理级别的官员，堪称后起之秀。沃顿请我担任该项目的主任，沃顿的教授飞到上海教课。当训练班结束时，我们举办了毕业晚宴，朱镕基应邀参加。席间，我代表沃顿向朱镕基赠送了一支钢笔，同时恳请上海市政府支持沃顿来年再次与交大合作举办第二期训练班。", "朱站起身来，接过钢笔，高高举过头，挥舞着，高声宣布，“我现在就用这支笔批准沃顿商学院明年在上海举办第二期高级管理训练班！”在场的中外来宝都报以热烈的掌声。朱镕基之果断由此可见一斑。那时朱已经赢得了一个美誉：“一个图章市长。”在他当市长之前，上海批准一个外国投资项目需要层层审批。有人统计过，审批往往要经过5个委、办、20个局，盖40多个图章，而最多时则要盖126个图章。朱镕基认为这样的效率办不成事，要求改成审批只需一个机构、一个窗口、一个图章。这样一来，大大省略了审批程序，促进了上海外资的引入。外国投资者将他昵称为“一个图章市长”。", "1993年，我辞去了沃顿的教职，全家移居香港，成了摩根银行的中国首席代表。那时，朱镕基已经升任国务院第一副总理，而且在1992年10月他从原来的中央候补委员的位置直接晋升到中央政治局常委，位列中央领导第五名。他的破格提拔也可见邓小平和中共总书记江泽民知人善任，不拘一格。朱任副总理时已实际主持国务院的工作，并于1998年担任总理。1994年，摩根的国际顾问委员会在北京开会，下榻钓鱼台国宾馆。委员会成员包括新加坡前总理李光耀、美国前国务卿乔治.舒尔兹（GeorgeShultz）等政要和商界领袖。一日，我们驱车去中南海，朱镕基在紫光阁接见，我也奉陪末座。握手坐下之后，服务员端上茶水。当服务员走到李光耀面前时，朱说，李先生要喝开水，请换杯开水给他。可见朱镕基的细心。1995年摩根换了一位董事长兼首席执行官，名字叫做桑迪.华纳（Sandy Warner）。12月，华纳访华期间去拜会朱镕基。甫一坐定，朱镕基开门见山说，你们来之前，我做了功课，了解到你们不是“大摩”。如果是大摩，我是不会见的。此言一出，摩根的几个人面面相觑，一时不知所云，只能笑眯眯地望着他，等待下文。", "他接说，今天早上江主席给我打电话，问我你们是不是大摩，我对他说不是。如果是，他也不会见你们。市场称为大摩的是摩根士丹利（Morgan Stanley），也是一家美国的投行。实际上摩根银行和摩根士丹利同出一宗，都是源自于摩根财团。1933年美国通过法令，拆分商业银行和投资银行。摩根财团的投行业务拆分出去，变成了摩根士丹利；商业银行业务，则仍然留在J.P. 摩根旗下，这就是摩根银行。但是到了二十世纪九十年代，美国法律不再禁止商业银行和投资银行混业经营，因此摩根银行又进入了投行业务，成了摩根士丹利的竞争对手。所以朱镕基要做点功课搞清楚我们是哪个摩根，两者不能混为一谈。中国的最高领导人对大摩为什么有这么大的意见呢？朱镕基说，大摩“在市场上捞了一把就走了”。原来，大摩有个首席策略师，名叫巴顿.比格斯（Barton Biggs）。他在1993年宣称对中国经济“最大看好”（Maximum bullish）。那年，首批中国企业在香港上市，为未来几年更多的中企在海外上市打开了大门。中国的机会造成了香港的牛市，此前恒生指数已经在3年之内翻了一番多，从1990年的2500点左右飙升到1993年的6000点左右。而在比格斯“最大看好”之后，恒生指数几乎再次翻番，在1994年达到11,000多点。在国际投资者的追捧下，牛市帮助了中国企业在香港上市成功。", "到了1994年，比格斯的口风变了。在一份研究报告中，他警告说香港股市的泡沫即将破裂（The bubble is about to burst）。此言一出，香港股市应声大跌，到1995年初，恒生指数已跌至7000点以下。", "朱镕基认为，大摩操纵市场，并在其中“捞了一把”。", "其实，摩根银行团队成员大概并不认为摩根士丹利故意操纵市场获利，这样做是非法的，但是董事长也不会在此场合为竞争对手辩护。后来的事实证明，香港股市低迷没有持续多久，又重新上扬，在1997年7月达到16,000点左右的峰值，再其后受到亚洲金融危机冲击几近崩盘。那天朱镕基的话反映了他直言不讳的风格。", "朱镕基虽然刚毅果断，直来直去，却也虚心纳谏。", "1997年，宝山钢铁公司准备在海外发债。发债需要国际评级机构对发行机构作信用评级。世界上两家最大的评级公司分别是穆迪（Moody’s）和标准普尔（Standard &amp; Poor）。宝钢聘请了摩根做评级顾问，我是摩根团队的牵头人。宝钢董事长兼总经理是谢企华女士。谢毕业于清华大学，专业是工程和民用建筑。但她的整个职业生涯都是搞钢铁，从宝钢成立工程总指挥部时就加入了。她是全世界大钢铁公司中唯一的女性首席执行官，人称铁娘子，名副其实。在她的治下，宝钢成为世界一流的钢铁企业，无论从技术上和财务上都堪与世界领先的钢铁企业一比如日本的新日铁和韩国的浦项钢铁公司一媲美。两家评级公司对于宝钢的财务质量大为赞赏，对于谢企华本人也佩服得五体投地。最终，两家都不约而同地给了宝钢最高的信用评级一主权级，等同于给予财政部的信用评级。而且这个评级是基于宝钢独立的财务状况，假设没有国家担保。这绝对不同寻常，因为评级机构对任何企业的评级都是以该国的主权级封顶的。一般而言，所有企业最高的评级都比所在国的主权级低一个档次，即便全资国有大银行也不例外。可见宝钢之优秀。", "信用评级的意义在于，级别越高，意味着发债方违约的可能性就越低，所以发债的成本一即所需支付的利率一也就越低。到了主权级，就是低到不能再低了，和在海外发中国政府国债的利率差不多。", "后来中国四大国有银行的一个董事长，获悉了宝钢获得了主权级，大为惊讶，还发了点牢骚，说我的银行才获得了主权级减一，何以宝钢能够能与财政部同级呢？可宝钢就是这么牛，他不服也不行。作为评级顾问，我为宝钢感到十分骄傲。在谢企华的领导下，宝钢实干低调，获得主权级之后，并没有对外公布。时隔不久，穆迪变卦了，给我打电话说穆迪有了新的规定，所有企业最高信用等级只能比主权级低一等。我大为不满，说泼出去的水还能收回来吗，已经通知了我们评级结果岂能食言？但说什么也没用。我很后悔，当初没有在获得评级结果时建议宝钢立即对外公告。如果公之于众了，穆迪想收也收不回来了。穆迪的牵头人反复解释，说变卦是基于他们内部政策的改变，并非针对宝钢的。虽然穆迪变卦了，标准普尔仍然维持主权级的评级。摩根银行免费为宝钢做评级顾问，就是为了做宝钢海外发债的牵头行，现在如愿以偿，获得了宝钢聘任。那时一家中国企业在海外发债需要朱镕基批准。很快批示下来了，有个条件，大意是宝钢在海外发债要与收购亏损的钢铁企业结合起来。他大概认为宝钢实力雄厚，可以收购之后改造亏损企业。问题是宝钢之所以能够获得如此高的信用评级，是因为财务状况优秀，如果合并了亏损企业，财务状况自然受损，也就无法维持评级。", "这个批示使宝钢的领导陷入进退两难的境地。", "我想作为发债承销行的代表，我有责任向副总理做个说明。我给他写了一封信，从承销行的角度，解释说发债成功取决于发行人的信用质量，如果发行方收购了亏损企业，信用质量会受损，就无法保住债信级别，因此发债也难以成功。信发出去了，但我并没有抱多少希望会得到答复，大领导一言九鼎，岂能收回成命？没想到很快宝钢就收到了他的新批复，同意宝钢发行外债，不再附加任何条件。", "我深为折服。如此位高权重的国家领导人，如此虚怀若谷，从善如流，实在不同凡响。当时的中共总书记、国家主席是江泽民。江和朱曾在二十世纪八十年代分别担任上海市委书记和市长，所以是老搭档了。1989年，江成为中共总书记，朱接替他担任上海市委书记，直到1991年朱也调到中央工作，在江的领导下，大刀阔斧推动改革。我对江泽民也有一些直观印象。", "也是在1995年，摩根的董事长华纳在会见朱镕基之后，又去拜访了江泽民，我和其他同事陪同前往。接见的地点是人民大会堂，我估计是台湾厅，但是当时并没有留意。江主席热情地欢迎客人。", "还未落座，他就说，你们看我坐的这把椅子。", "我们一时没有搞懂他的意思。我知道人民大会堂里有不少文物，以为他的椅子是个有特别来历的古董，但又看不出奇特之处。他很快接着说，任何人坐在这个位置，也不会容许台湾独立。", "原来当时的台湾领导人李登辉获得了访美签证。此举有违美国承诺的“一个中国”原则。1979年美中建交，美国同意遵守与台湾相关的三个前提条件—断交、撤军和废约，即断绝与台湾的外交关系，从台湾撤出所有美军，废除1954年与台湾签订的《美台共同防御条约》。而在1995年，克林顿政府给了李登辉访美签证，理由是李仅以私人身份访问母校康奈尔大学。这当然说不过去，因为李是台湾现任领导人，而且多有台独言论。北京认为此举破坏了“一中原则”，台海两岸一时剑拔弩张，演化为“台湾海峡导弹危机”。江泽民在接见摩根董事长时，表明反对台独的态度，强调不光是他，任何中国领导人坐在他的位置都不会坐视不理。江向客人解释说，台湾自古以来是中国的一部分，为了说明此点，他讲了自己的经历。他1947年毕业于上海交通大学电机系，毕业后获得的第一份工作就是到台湾日月潭水电站当工程师。但当时他已经是共产党员，党组织告诉他不要去台湾，而是留在上海准备迎接解放，因此他与台湾的工作失之交臂。他说，如果不是组织让我留下来，我今天就可能是住在台湾的一名工程师。我一边听他讲，一边回想起我在1989年底第一次访台。那时我在美国宝夕法尼亚大学的沃顿商学院任教，应邀参加了台湾沈君山先生组织的“大陆访美学者访台代表团”。沈君山是台湾有名的国民党四公子之一，其父沈宗瀚曾是台湾农复会主委，其他三位公子分别是当过副总统的连战（前内政部长连震东之子）、当过外交部长的钱复（前中央研究院院长钱思亮之子），以及当过国防部长的陈履安（其父陈诚，当过副总统）。但沈君山没有从政，曾任台湾清华大学校长，离职后自称闲云野鹤，为祖国统一奔波，曾在二十世纪九十年代三度会见江泽民。我们在台湾拜访了台湾前行政院长孙运璇。孙是山东莱阳人，操着一口胶东口音。他说他在抗日战争结束后到台湾，担任日月潭水电站站长。他还说很想念家乡。沈君山告诉我们，听说大陆学者来访，已经中风坐了轮椅的孙运璇一定要在门前请人扶着站立等候。当天台北下雨，沈劝孙进屋坐等，孙不肯。结果我们因为堵车迟到一个小时，急得沈君山直跺脚，见到我们就说，“与长者约，如何迟到这么多？”这是引用《史记》中所述黄石老人训斥张良的话：“与老人期，后，何也？”我听着江泽民讲话，心里就想，一个是国家主席，一个曾是台湾的行政院长，若非命运捉弄，这俩人差点儿就在台湾的日月潭水电站同事。人生真是难料呀。话锋一转，江泽民开始谈电子工业。对于这个行业，他是内行，曾经担任过电子工业部长。他向摩根董事长询问国外电子工业最尖端发展状况。很快，我们发现他对于这个领域的知识超群。而且他讨论的问题太专业了，有些技术名词翻译不懂。江纠正了翻译几次之后，干脆讲英文。他的英文很好，应付自如。", "我发现江泽民和朱镕基一样，都把接见外宝当作学习的机会，不光是回答客人的问题或阐述自己的观点，而且不耻下问，向客人请教。你可以深切感觉到，在他们领导下，中国在积极推动市场化改革，与国际接轨，并且将外资参与作为推动改革和经济增长议程中至关重要的一部分。", "从那几次会面到新桥开始谈判收购深发展，已经过去了七、八年。在此期间，中国的国内生产总值翻了一番，加入了世贸组织，承诺向外国银行逐步打开本国的大门。这意味着，本国银行关起门来做皇帝的好景不长了。为了应对即将到来的外国银行竞争，支持经济的长期增长，银行系统必须改革，必须引进国际最佳管理模式和风控体系、改善质量、提高服务水平，才能在与外行竞争中立于不败之地。就是在这个大背景之下， 有了收购深发展这样独特的机会，而正是因为新桥有改造问题银行的经验和声誉，这个机会才摆在我们面前。这不见得就一定是个好机会，也不意味着它就唾手可得。但是帷幕已经拉开，鼓点已经敲响，深发展已经登场，新桥也已经亮相，戏一定要唱下去。"], "wcount": 8135}, {"icon": "6", "title": "第六章 紧锣密鼓", "paras": ["鼓点儿憨来憨紧，节奏憨来憨快。国务院领导对于新桥收购深发展的方案没有提出异议是一个好兆头。但我们也知道，这不过是跨出了第一步，虽然是关键的一步，但距离终点还很远，前面还有很多可见和不可见的障碍需要逾越，是否能够成功，仍是未定之数。我们还有很多工作要做，也需要与地方和中央政府的许多部门打交道，以取得支持和批准。", "与欧巍通完电话，我一边与女儿在商场里闲逛，一边脑子里不断思考。", "我不由得钦佩周林的办事能力和效率、思路密以及广泛人脉。如果按照一般程序，一个项目从下往上呈报，不但耗时，而且充满了不确定性，因为没有先例的项目，任何层级的官员都可能不敢做主，都可能把项目卡住。我想深圳市政府知道此事关系重大，没有以往的路径可循，如果没有最高层次认可，也许寸步难行，所以把报告直接上呈。上面原则上不反对，下面的工作就好做了，虽然必要程序仍然一个都少不了。我给庞德曼、布朗姆和唐开罗打了电话，转告从欧巍那里得来的消息。", "大家都很欣慰。我即将从旧金山飞往科罗拉多州的阿斯彭，参加在那里举办的新桥年会，有足够时间讨论“银元”项目。很快，我们获得消息，人民银行要求新桥提供有关自身的详细数据和讯息。我们知道，这是要审查新桥投资并购控制银行的资格。当时银行监督管理委员会尚未成立，银行的监管属人行管辖范围，包括对于投资人资格的审查。到了次年，2003年，银监会成立，银行监管的职能就转到银监会了。", "在接下来的几个月里，我们准备了很多有关新桥的资料，呈报人行。我专门准备了一份文件，详细介绍新桥及其主要合伙人投资改造银行的经验和背景，其中包括在二十世纪八十年代，布朗姆的公司投资美洲银行（Bank of America），庞德曼从美国政府手中收购已经破产的美国储蓄银行（American Savings Bank），以及新桥在2000年从韩国政府手中收购韩一银行的控制权。所有这些收购和其后的改造都相当成功，足以证明新桥投资和管理银行的资格。", "在报告中，我们着重描述了新桥作为战略金融投资者的经验和业绩，并详细回顾了新桥改造和振兴韩一银行的经验。恰巧，哈佛商学院发布了一份关于新桥收购韩一银行的案例分析。其实这个分析很粗浅，因为作者并不了解内幕，但它等于是知名的第三方对于我们业绩的印证和认可，很有帮助。还有一份比较有份量的文件，是美国国会对于庞德曼等收购美国储蓄银行的研究报告，给予此项收购和之后的成功改造以相当高的评价。这些文件对于我们的资格都是进一步的左证。", "人行不只要求新桥提供资料，也要求深发展对新桥的资历做调查，提供报告。深发展聘请了花旗集团旗下的所罗门美邦投资银行（SalomonSmith Barney）作顾问。", "所罗门团队由梁伯韬先生牵头。梁也是一位传奇人物，市场上称之为“中国红筹之父”。在境外注册和上市的中国企业被称之为红筹，境内注册而在香港上市的公司被称为H股，而股市上的龙头企业被称之为蓝筹。梁伯韬保荐了很多红筹和H股上市，因此在投资界很有名望。他中等身材，戴着一副浅色框的眼镜，说话轻声细语，操一口香港口音的普通话，给人以温文儒雅的印象。他本人对中国市场了解，又有经验，容易给人以信赖感。", "梁曾是香港本地投资银行百富勤（Peregrine）的创办人之一。百富勤生逢其时，赶上了中国企业海外上市的大潮，参与其中，一路高歌勐进，迅速增长，很快就能与美欧的头牌投行在市场上争一日之短长。但不幸的是，百富勤在1997年亚洲金融危机时栽了大跟头，竟至破产倒闭。原因是百富勤向准备保荐上市的一家印度尼西亚出租汽车公司提供了一笔2.65亿美元的过桥贷款，过桥的意思是一旦完成上市，就用上市筹来的钱归还贷款。岂料恰逢金融危机来袭，印度尼西亚的股市像亚洲所有市场一样顷刻崩塌，上市成为泡影，该公司过桥不成，无力还债，宣布破产倒闭。这家公司的名字是“平稳安全”（Steady Safe），结果是既不平稳也不安全。过桥贷款的规模相当于百富勤资本金一半，拿不回来，百富勤也因此倒闭。那个项目和梁本人没有多大关系，因为他负责的是中国市场。", "公司倒闭之后，他另谋高就，一度成了所罗门大中华区负责人。", "其实所罗门团队对于新桥比较了解，他们不掌握的数据和数据就向我们索取，双方合作很愉快。人行的调查工作很审慎，不光要求新桥和深发展提供资料，还要了解我们在美国是如何受到监管的。为此，人行要求我们从美国联邦储蓄系统—美联储一取得一封公函，证明新桥的财务状况良好。但我们无法满足这个要求，因为新桥本身并非银行，不受美联储监管。所幸美联储的有关官员对于新桥并不陌生，因为我们在收购韩一银行的时候与其打过交道。新桥收购韩一银行之后将它在美国的分行关闭，因此和美联储的官员有所交往。", "新桥收购韩一银行聘用的法律顾问是纽约的佳利（Cleary Gottlieb Steen&amp; Hamilton）律师事务所，与美联储打交道的律师叫做杰克.墨菲（Jack Murphy）。他出面代表新桥会见了美联储的官员，获得了一封美联储出具的公函。公函的日期是2002年8月8日，主要内容是：新桥资本在美国不拥有或控制银行。因此，根据《银行控股公司法》，新桥资本及其附属公司不受美联储的监管。新桥收购深圳发展银行股权不会导致其受到美国的监管，因为深发展在美国并无银行业务。因此，美联储对拟议中的交易没有银行监管的责任。尽管如此，这封公函对我们还是有帮助，因为它至少证明美联储是知道新桥的，如果我们有任何问题，它不会出具这封公函。同时，佳利律所的另一位律师理乍得.林瑟（Richard Lincer）会见了人行驻纽约的代表，进一步提供了新桥的背景讯息，尤其是投资和改造问题银行的经验和业绩。通过这些渠道，人行掌握了新桥的基本情况。", "在此期间，交易价格仍然是个悬而未决的问题。深圳市政府和人行都要求双方提供一个更确切的交易价格。我方应周林的要求，在2002年8月6日向深圳市政府提交了一份正式函件，标题为《新桥对深圳发展银行投资的承诺》。在函件中，新桥承诺支付的价格为账面净资产的0.8至1.5倍之间。这个承诺的意思是如果调整后的净资产等于或低于零，新桥所支付的价格仍然反映账面净资产的一个合理倍数。当时市场上法人股的交易价格一般都等于账面净资产值，所以新桥的承诺与市场基本一致。", "换取这个承诺的条件，是市政府对深发展在不良贷款催收和股票市场融资方面提供优惠政策，尤其是支持深发展以配股形式融资。就在同一天，深发展向人行提供了一份信函，认可新桥为合格投资者，并且报告“深圳市政府与新桥商定的最低交易价格为深发展账面净资产值的0.8到1.5倍”。", "我们当时不知道，这些文件将在交易的后期变得至关重要。", "8月10日，深发展向人行提交了一份报告，介绍新桥在收购和改造银行的经验和业绩，论证了为什么新桥为最佳选择。我们没有看到这份报告，但是周林在电话中向我简述了内容。我的感觉是写得很到位，事实清晰、分析准确、逻辑严谨、行文流畅，很具有说服力。我很赞叹周林的文笔。", "三天之后，我们获得消息，人民银行也原则上同意新桥收购深发展。我们又越过了一道坎。古人云，事以密成，语以泄败。在中外战争史上，保密往往事关胜败。", "做投资也是如此。一旦消息走漏，竞争对手就可能冒出来，意料不到的麻烦也可能接踵而至。但项目深入，参与的人多了，就很难保密。7月下旬，我与欧巍和刘伟琪一起乘车从香港去深发展总部。半路上，我接到彭博社一位记者的电话，单刀直入地问：“新桥打算投资深发展吗？J一听到此话，我就知道消息走漏了。但显然该记者是探口风，并不了解底细。我和媒体打交道的原则很简单，能说就说，不能说就不说，说出的每句话必须属实，这样才能与媒体创建信任。对于这位记者的问话，我知道既不能证实，也不能否认。因此，我说：“我们对于传言不予置评。”在深发展总部，一位高管递给我一份当天出版的《经济观察报》，其中有篇文章称汇丰银行、摩根大通银行和新桥正在争夺深发展的股权。顺便说明，摩根银行在2000年被大通曼哈顿银行（Chase ManhattanBank）收购，此后存续的实体取名为摩根大通。原来《经济观察报》的文章就是彭博社记者来电话的起因。虽然文章并非空穴来风，却也是捕风捉影。我们很清楚，汇丰和摩根大通并没有参与竞争。马上有几家主要媒体，没有像彭博社一样来电求证，而是直接转载了《经济观察报》的报道，甚至添油加醋。比如道琼斯报道称：据《经济观察报》报道，汇丰控股、摩根大通和新桥投资公司是收购中国深圳发展银行股权的竞争对手。该报道称，这家地方政府控制的银行最近获准出售其所有法人股。目前，深发展正在与三家相互竞争的对手谈判，以选择最佳的交易对象。这是新桥投资和汇丰银行再一次竞购一个银行的控制权。1999年，新桥曾击败汇丰银行，获得韩国第一银行的控制权。其实，我们知道，深圳方面接触过几家大银行，但是没有一家表示兴趣。而且即便此时发生兴趣，也不会对新桥产生威胁。因为我们已经和深圳方面签署了独家收购的框架协议，只要我们不主动退出，第三方无法插足。这些报道对于新桥来说也有积极的一面。当时，国外投资界普遍不看好中国的银行业，因为其不良资产比例过高是众所周知的事实。新桥收购深发展可能会受到市场质疑。但是如果知名的国际大行也对深发展有兴趣，至少说明并非只有新桥看走了眼。在真相大白之前，我们也没必要对市场或自己的投资者做任何解释。", "按照股市交易规则，上市公司必须对于可能影响股价的市场传言或媒体猜测做出澄清。因此，深发展于2002年7月30日停牌，随即发出一篇极短的公告，大意是并无应披露而没有披露的讯息。这是实际情况。由于我们仍然在谈判过程中，是否交易，交易的具体条件仍不确定，所以深发展认为没有可以披露的内容，也无义务做进一步说明。", "就在7月30日当天，我和同事在深发展总部与周林和他的团队会谈，共同审阅了准备向监管部门呈交的各类文件。之后，我们参观了总部大深圳发展银行总部大门", {"img": "m8-1", "cap": "第六章插图"}, {"img": "m8-2", "cap": "第六章插图"}, "香槟色的深圳发展银行总部大楼", {"img": "m8-3", "cap": "第六章插图"}, "深圳发展银行总部营业厅", "这座在1997年1月启用的大厦耗资8亿元人民币，建筑期4年。其外形像船帆，取乘风破浪之意，整个建筑的玻璃幕墙为香槟色。营业大厅很气派，顶高12米，四周是大理石柱子，显得十分宽阔，甚至有些富丽堂皇。大厅中设有营业柜台，却是很普通，甚至有些寒碜，有点像是在豪宅中摆放了廉价家具。大厅最远程的墙壁上悬着一副巨大油画，在柔和灯光照耀之下，显得色彩鲜艳。整个画面被枝繁叶茂、分处左右对称的两棵巨大榕树所笼罩。大树之间是个湖，右侧远视角处有瀑布从天而降顺着悬崖泻入湖中。大树下绿草茵茵，几只水牛或立或卧，或在吃草，悠闲自得。这幅画的名字是《福泽永年》，画家是刘宇一，他在1996专门为深发展总部大厦创作此画。画的一角有个红色印迹，大概不是印章，而是画上去的，有八个篆体但不难辨认的字：“发枝展叶，独树成林。”榕树是深圳的象征，这几个字里包含了发展，这幅画的寓意就不言而喻了。", {"img": "m8-4", "cap": "第六章插图"}, "深发展营业厅墙壁上悬挂的巨幅油画—《福泽永年》", "大楼和营业厅都很现代化，但业务方式仍然很传统。和老派银行一样，顾客要在柜台窗口与银行职员交谈。现代方式是不让顾客产生隔阂感，他们与银行员工同处一个开放的空间，在一张办公桌前对面而坐，中间没有间隔。新桥收购了韩一银行之后就改造了所有的分行营业厅，采用现代方式，和顾客近距离交谈，使客人有宝至如归之感。", "人行初步批准了拟议的交易，并将材料转送证监会和财政部审查。任何国有资产的出售都需要财政部批准，深发展为市政府所有，因此需要财政部审核。深发展是上市公司，因此也归证监会管。证监会很快表示没有异议。周林起初以为财政部可能是个难关，但是8月16日晚上，他来电说，财政部也原则上同意了。此后，人行将三家监管机构的意见再一次呈报国务院领导，并建议同意双方继续推进交易。两次呈报国务院领导之间已经过去了4个月。就算再次批准了，也仍然是初步放行。等到新桥做完尽职调查，双方达成最终协议之后，还要再走审批的程序。为什么要如此周折呢？我想这是因为外资收购全国性银行控制权前所未有，无先例可循，所以必须谨慎小心。国务院支持银行改革和对外开放，支持深圳的改革思路，只是原则上的态度，但到了具体项目上，各个监管部门要从不同角度做各自的尽职调查。在世界各国，银行都是高度监管的行业，而中国还有自己的国情特点，比如国有资产转让的规则，地方政府和中央政府之间协调，等等，所以每一步都要经过审查，才能确保万无一失。", "银行业改革是深发展交易的大背景。没有这个大背景，深圳转让银行控制权的思路根本不可能产生。中国的银行业改革是在1999年启动的，主要是针对工、农、中、建四大国有银行。当时，朱镕基任国务院总理。改革的第一步就是由财政部出资成立了四家“资产管理公司”一华融、长城、东方和信达，分别对口承接从工、农、中、建四大银行剥离出来的不良资产。如此一来，四大国有银行一举摆脱了不良资产的包袱，从病态银行变成了健康银行。四家资产管理公司的职责就是回收和清理所承接的不良资产。换言之，这些资产管理公司的职责就是背包袱，以便大银行卸包袱，轻装前进。资产管理公司的员工，也是从对口银行分离出来的，从理论上来讲，他们对这些不良资产形成的历史和现存的关系应该熟悉。这几家资管公司最后都发展成了多业务板块的金融机构，那是后话了。", "这个路数在国外的银行改革经验中有先例可循。当初庞德曼收购美国储蓄银行就开创了拆分“好银行”和“坏银行”模式，被证明行之有效。资管公司就是“坏银行”。", "通常，如果一间银行的不良资产大大超过其净资产值，就要破产倒闭了。但在当时，中国的银行，即便在技术上破产了，也没有倒闭之虞。这是因为几乎所有的银行都有国家的隐形支持或担保。但是如果大量的贷款无法回收，银行发放新贷款的能力就会欲来愈小。中国的银行虽然不良贷款累累，但由于存款还在增长，所以还可以继续放贷，但最终会像是堵塞的水管，流不出水来。从银行的资产负债表中清除不良资产就类似清理管道中的淤泥。", "中国银行体制改革的第二步是防止不良资产产生。", "一个不断产生不良资产的银行，就好像一条漏水的船。如果只是把船舱中的水舀出去，而不去堵漏洞，那么再怎么努力舀水，都是徒劳，最终也无法避免船沉。关键还是要把漏洞堵上。那么清理了不良的银行，如何保证今后不会再大量产生坏账呢？这就需要创建新的风险控制系统。这是更深层次的改革。", "银行体制改革的第三步，是引进外资，然后在海外的股票市场上市。为什么这么做呢？因为引进外资同时引进国际最佳的管理方式和风控系统，这样可以有效防范不良资产的产生。而通过上市一来募集资本金，二来必须对市场透明，接受市场的监督，促使银行的管理慎重、规范。2008年，雷曼倒闭，引发了金融危机，后来美国人称之为“全球金融危闭，就是因为1997年的亚洲金融危机之后，亚洲各国都改造了银行体制，补充了资本金，提高了风控水平。而在二十一世纪初，中国的银行也经历了类似的改革，所以到了2008年北大西洋金融危机来袭之时，亚洲各国的银行体制都相对健康。", "当初韩国政府引入外资，是无可奈何之举，因为府库空虚。而中国的银行体制改革，情形大为不同。中国政府并不缺钱，缺的是国外先进的银行管理方式，所以欢迎外资。", "在二十一世纪初的十年当中，四大国有银行都分别引入了外国战略投资者，其后成功在海外上市。在此期间，中小银行也纷纷引入外资，许多相继在境内外上市。改革后的中国银行体制在以后的全球经济危机中，经受住考验，一直保持基本健康的状态，有力地支持了中国经济的增长。", "在2002年，中国银行改革的议程尚未全部展开，具体的做法，也还在不断探讨中。目的是明确的，银行体系要革除弊端，要强身健体。为了达到这个目的，他山之石可以攻玉，一些中小银行已经开始引入外资，但都是出售少数股权，没有一家外资控股。如果新桥控制了一家全国性银行，那将代表政策上的重大突破。国务院和监管部门显然是持审慎支持和鼓励的态度，但是这条路是否能够走到底，仍在未定之数。我问周林，他对项目的前景如何判断。他说：“阴转多云。”这是天气预报的术语，意思是，渐渐看好，但尚未云消雾散。", "8月29日，深圳市委书记黄丽满邀请新桥的代表会见。我和欧巍以及所罗门的梁伯韬和黄蔼茵在周林陪同下如约前往。会见的地点是市政府招待所。我们下午5点半准时到达。宋海副市长和刘学强副秘书长已经在那里等候了。黄书记看上去只有50岁上下，衣着朴素，举止随和，没有架子，说话很干脆，一副精明能干的样子。她是在文革前从哈尔滨军事工程学院毕业的，学的是自动控制。在六十年代初期，这是很前治的学科。她毕业后在电子工业部工作，大概在10年前调到深圳，在2001年升任市委书记。一落座，她就对新桥有兴趣收购深发展表示赞许。她说深发展引进外资，是市委和市政府内部的共识，“高度一致，决心很大，此事的战略意义重大。政府决心退出企业，只当裁判员，不当球员。政府超脱出来把主要精力放在发展经济，社会基础设施建设，社会治安和精神文明建设，以及社会信用基础建设上来。”政府要创造公平的市场竞争环境，提高市场和企业的效率。深圳市是改革开放的前沿，必须带头。", "我们都懂她说的意思。在任何竞争行业中，如果政府既是企业的股东，又是行业监管者，那么就相当于既当球员，又当裁判员，不可能营造公平竞争的环境，因之市场效率也无法提高。其实她一语道破深发展问题的根源一赚不赚钱都有政府支持，就缺少动力搞好。她接着说，“深发展出让股份后，交给你们管，政府只支持，不干预。", "当然，我们选择的投资者，必须是有实力和可靠的伙伴，并且一定要有投资和管理商业银行的经验。”她对新桥集团的资质、实力和经验都表示满意。", "深发展的财务顾问梁伯韬报告说，筛选了多的战略投资人，最后判定“新桥是最佳的选择”。黄丽满赞扬了所罗门的工作，同意“将相对控股权转让给新桥有助于深发展的管理国际化及健康发展，而且可以保持深发展以深圳为基地和总部的独立性，不至于成为外国银行的分支机构”。", "这时我才意识到，新桥相对于外国银行的一个重要优势就是可以保持深发展的独立性。这一点对于深圳市是很重要的。我对书记表示感谢，也赞赏深圳市深化改革的魄力、开拓精神、战略眼光和市场化的步骤。我向她保证，新桥有经验、能力和信心改造深发展，提高其市场价值和竞争力。我还告诉她新桥将引进世界一流的管理团队和国际最佳经营方式。黄书记说她会亲自与国务院的领导沟通，争取项目尽早获批。她很有信心，此事会得到上级领导的支持。她语重心长地说，“有危机感就会进步，一定要保证成功。这项交易将是中国银行界发展的重要里程碑，为银行改革开创先例，引发模仿效应，也能获得国际金融界及投资者的认可。”但是她叮嘱在座的人，“先不要去宣传，先去做，做好再说。”我们一边谈话，一边吃饭。这次见面，持续了两个小时。我们充分体会到，市政府不但对股权转让下了决心，更重要的是，完成交易之后，会诚心诚意支持新股东对银行的改造。9月9日上午，我得到消息，国务院的领导再一次原则批准深发展交易。", "国务院领导的效率令人钦佩，不用说，深圳市政府的支持和沟通一定起了重要的作用。我赶忙打电话给庞德曼、布朗姆、唐开罗等合伙人，报告好消息。大家都很受鼓舞。", "按照政府部门的流程，国务院的批复先下达到广东省，再由省下发给深圳市，这个过程需要时间。但深发展打算引进外资已经从零星传闻变成了市场猜测的热点。深交所认为，传闻涉及可能影响股价的敏感讯息，要求深发展发公告澄清。9月11日，深发展发表公告，确认正在与外资洽谈股权转让，但并没有披露名字。公告称：为了贯彻深圳市政府在适应加入WTO的新形势下，加快推进国有企业改革与发展的战略部署，近来本行就与外资进行业务合作及引进国外战略投资者问题，和多家外资机构进行了接触和洽谈。有关部门已原则同意我行引进国外战略投资者，目前有关洽谈正在进行中，结果尚不能最后确定……", "一石激起千层浪。因为此前对于新桥的参与媒体上已有猜测，公告发表之后，中外记者纷纷打来电话询问。我选择了几个记者交代了一些背景情况，让他们的报道不至于失实，但同时又小心翼翼避免透露需要保密的讯息。到了此时，也需要将最新情况通报新桥的投资者了，免得他们从媒体上读到只言词组，会产生疑问。9月18日，我们向新桥的有限合伙人发出了一份注明“严格保密”的备忘录，简述最新进展：", "我们在上季度的报告中提到，深圳发展银行是一家中型商业银行，总资产约160亿美元，在中国主要城市设有190多家分行。其目前贷款客户的对象主要是企业，刚刚开始发展零售贷款业务。", "新桥于2002年4月起与深发展股权的出让方开始独家谈判，双方在6月21日签署了框架协议。根据这个协议，新桥预计将从深圳市政府手上收购深发展大约20%的股份。交易完成的条件包括新桥完成对收购目标尽职调查，并对结果满意，还包括必要的监管批准。交易完成之后，新桥将任命董事会大多数成员，并将控制银行高管的任命。准确的投资金额将在新桥完成尽调之后根据调整后的净资产值确定，但估计新桥的投资额将在1.2到1.5亿美元之间。我们可能支付的股价只占该银行股票市值的一个不大的百分比，这是因为我们将持有的是不可在市场上交易的“法人股”。", "在备忘录中，我们提供了更多细节，并在结尾处解释了拟议中的交易在中国市场具有里程碑式的意义。综上所述，拟议中的交易如果获得批准将标志重大的政策性突破，这将是自1949年中华人民共和国成立以来，一家外资公司首次控制了一家拥有全国牌照的国内银行。根据世贸组织的框架，中国要在2007年之后才需要对外国银行开放国内本币零售业务市场，每家外国银行每年在中国开设新的分行不能超过一家，而且还必须经过中央银行的批准。", "在备忘录中，我们还强调了中国银行业的一个独特性，即央行控制利率，贷款不能低于某个基准利率，而存款不能高于某个基准利率，因此利差是保证的，不受市场竞争的影响。这对于银行是极为有利的。而且银行零售业务的市场潜力巨大：深发展对于开发中国正在快速增长的零售银行市场，尤其是按揭或住房贷款方面，具有独特的优势。任何一个投资者都要考虑投资的回报。这个交易能够产生什么样的回报？此时我们尚且无法判断，需要进一步调查和分析。我们通常的做法是在计算机上创建一个财务模型，根据不同假设做财务预测，计算可能产生的投资结果。按照《框架协议》规定，在中央政府原则上批准后，新桥应立即接管深发展的董事会。这是因为从那个时刻起，新桥就实质上承担了深发展的风险，如果产生不良贷款，当然影响即将成为股东的新桥。我们打算派出经验丰富的银行管理人员，创建新的风控系统，以尽量减少产生新不良贷款的风险。", "而当时深发展面临的风险是巨大的，其年报显示，截至2001年底，该银行不良贷款占总贷款的比例已达到14.84%。深发展同意新桥接管其董事会，并在9月16日向市政府提交了一份紧急报告，说明为何在交易完成之前就应该邀请新桥接管管理权：尽管收购之事已获得国务院领导和主管部门的批准，但在尘埃落定之前，仍可能出现我们不愿看到的风险和变量：一是在各种不同意见的议论和兄弟银行的攀比之下，国务院领导改变初衷，叫停此事；二是由于社会传闻日益增多和广泛，使本行内部出现风险事故的可能性大大增加；今年1—8月本行不良资产增加了29亿多….", "新桥尚未入股，如何取得管理权呢？市政府的法律顾问室出了一个意见，说政府可以要求其所任命的董事授权新桥的代表，请他们作为代理在董事会上行使投票权。由于代表政府的董事占有董事会大多数席位，通过这种代理方式新桥就取得了实际控制权。当新桥正式入股之后，就有权任命自己的董事，取代政府任命的董事。", "意想不到的是，深圳证监局不同意市政府法律顾问室的意见，认为代理投票的方法不符合有关的监管规定，这个方案只好作罢。最后各方达成一致意见，由董事会直接授权新桥指定的人员对深发展实施管理权。", "政府内部的不同意见不过是个小插曲，我们完全理解政府机构小心谨慎的态度。最后采取的方式只是形式上的不同，并不影响实质。但这个插曲也让我也产生了些微的担忧。在此之前，我们和市政府或北京监管部门的沟通都是通过周林，很有效率。随着项目的进展，以后需要打交道的部门和人会愈来欲多，恐怕不是所有的事都顺风顺水。我们注重合法合规合情合理，一丝不苟，所以严格按照政府部门的指引办事，虽然有时影响效率，但双方都可以确保不留隐患。", "按照政府方面的意见，深发展的董事会授权新桥在深发展成立一个“过波期管理委员会”，其成员为新桥的代表和新桥聘请的专家。这个委员会的全部职能就是监督信贷决策，但只有否决权，而无批准权。原因在于我们在正式入股深发展之前，不能对新增贷款的质量承担责任。产生了不良资产，仍然是银行信贷部门的责任。", "这是因为贷款的风控需要一套从下而上的制度，下到分支行前线直接接触客户的员工，上至总行的风控委员会，如此才能保证贷款质量，不是一个新桥任命的委员会就可以保证的。这就好像食品安全的保证是从食材的来源、采购、运输、加工、销售等每一个环节严格把控的。监管部门有权检查，如果不符合标准的话不许出厂，但是如果出了问题，承担责任的是生产企业，而非监管部门。管理委员会只管监督和把关，而不是越俎代庖，这个角色董事会和管理层都可以接受。", "政府部门的原则批准和管理委员会的成立都是一个上市公司需要披露的重大讯息。我们和深发展的相关高管一起起草了一份简短公告，并在获得深交所批准之后于9月27日公之于众：", "深圳发展银行股份有限公司公告经政府有关主管部门批准，同意美国新桥投资集团公司作为国外战略投资者进入本行，双方将争取尽快完成此项交易，现正按要求积极进行尽职调查的有关准备工作，并将根据进展情况及时按有关规定进行讯息披露这是新桥的名前缀次出现在深发展的正式公告中。此前，虽然媒体多有猜测，但并不能确认。正式的消息相当震撼，第二天，中外媒体广泛报道。记者纷纷来电询问，而深发展和新桥方面都不再发表任何评论。但是正式公告使市场和媒体都意识到此项交易的重大意义，因为外资收购全国性银行的控制权是在新中国从未发生过的事情，可谓石破天惊。《华尔街日报》9月30日版的大标题是〈中国批准新桥的交易》，小标题是〈美国公司可能是第一家控制中国大陆一家银行的外国机构〉。文章的作者显然理解此交易和一般外资入股中资银行的本质区别一只要外资持股比例保持在25%以下，深圳发展银行将仍被视为一家本地银行，而非一家外国银行。这意味着新桥投资可以行使有效控制权，但同时该银行可以不受外国银行在华业务范围的限制。美国《商业周刊》称该交易是“中国银行业改革的重大突破”。国际信用评级机构穆迪（Moody's） 在同日调整了深发展信用评级的前景，从“稳定”提高至“看好”，并说：“穆迪公司相信，从长期看，收购将对深圳发展银行产生积极影响，由于新桥投资的积极介入，有可能使其成为更强大、更出色的商业银行。”看了穆迪的评论，我心想，是呀，交易双方的全部用意就在于此呀。"], "wcount": 10898}, {"icon": "7", "title": "第七章 唇枪舌剑", "paras": ["公告之后，深发展董事会于2002年9月29日举行会议，审议关于授权新桥过渡期管理委员会的提议。这一天是星期天，但事关重大，刻不容缓，所以周末开会。董事会开了两个半小时，最终批准了授权，并与新桥的代表签署了《深圳发展银行授权协议》。这个决定也及时通过深交所向市场公告。到那一刻为止，新桥的团队尚未对深发展的经营和财务状况做正式的尽调。这是因为在政府部门原则批准并公之于众之前，我们不可能大张旗鼓进场调查。这个工作需要投入大量的资源，不但新桥自己的团队要深入参与，而且要聘请会计师事务所、律师事务所、财务顾问、咨询公司等等，费用高昂。所以我们通常的做法是“不见兔子不撒鹰”，最起码八字有了一撇之后，才开始花大钱搞尽调。现在到时候了。我们组建了一个相当庞大的尽调队伍，除了新桥自己的人，还包括财务顾问摩根士丹利一“大摩”、审计公司普华永道（PWC）、美国佳利律师事务所、上海的方达律师事务所、科尔尼咨询公司等专业团队。而深发展聘请了梁伯韬的所罗门证券公司当财务顾问，配合我们尽调。", "这些专业团队都各尽其责，而又相互配合，新桥的团队居中指挥并协调各路人马。大摩的主要任务是和新桥团队一起创建财务模型，提供银行增资的方案；普华的工作是检查银行的资产质量，尤其是不良资产的状况；律师们要调查法律风险，比如是否有重大的违规问题，还要起草法律文件；咨询公司要研究银行业市场，分析深发展的优势和劣势，建议在新桥治下的发展战略。深发展公告之后，新桥的工作不必保密，所有负责尽调的人员都入场，在深发展员工的协助下开展工作。与此同时，我们任命了过渡期管理委员会的三位成员，其中首席是迈克尔.杨（音译名，英文名是MichaelYahng，华裔美国人，但我从来不知道他是否有中文名字，后来他担任杭州银行的董事，公开的中文文件上用的也是英文名字）。杨是一位经验丰富的银行家，也是香港风险管理协会的主席，该协会的成员包括香港所有主要银行。他拥有耶鲁大学的学士学位和哈佛大学的工商管理硕士学位。他为人随和，平易近人，说话不紧不慢，轻声细语。我们觉得他是最合适的人选：我们需要一个银行风控专家，虽然我们任命他为过渡期首席执行官，但因为他的职务是临时的，只有否决权，而没有决定权，所以必须能与其他高管合得来，取得他们的支持。", "9月30日，周林在深发展总部召开了全体管理层人员参加的会议。他首先介绍了深圳市与新桥交易的背景，然后邀请我发言。我简短介绍了新桥、我们在收购和改造银行方面的经验，以及完成交易后的一些打算。", "此时谈论如何改造这家银行显然为时过早，所以我只是一般性地讲了讲加强风控，处置不良资产，发展雾售业务，做大做强的基本思路。我看得出来，他们对即将到来的变化既兴奋又忐忑。我想这是人之常情，每个人关心公司的未来，更关心将来的变化对自己意味着什么。深发展组建了一个协助新桥尽调的核心团队。我和同事一起与他们开了会，我自己只参加了半个小时，介绍尽调的内容和要求，然后回答了问题。他们表示会尽力配合我们工作，所有讯息向投资方透明，这使我们感到宽慰。做投资，最大的风险就是对投资目标不知情。在很多时候，目标公司出于种种原因报喜不报忧。结果就是你出了买真品的价格却买了赝品或次品，导致投资失败。如果出售方向买方一五一十地指出瑕疵，往往买方非但不会望而却步，而是感到放心。在许多国家，法律规定物业出售方必须充分披露已知的瑕疵，否则买方完成交易后发现卖方应该知道而没没有了责任；如果有瑕疵卖方知道但是没有披露，买方就有权利要求卖方赔偿因瑕疵而造成的损失，只要证据充分，法庭通常支持买方的诉求。虽然买卖双方都受到合同的保护，但实际上合同和法律的保护往往不足，甚至远远不足。简单说，任何人从银行贷款都有合同责任足额偿还，但是为什么一家银行会产生不良贷款，甚至大量不良贷款呢？就是因为银行对借款人和还款能力没有做好充分的尽调，也可能因为借款人没有把财务状况向银行充分披露，甚至还有人“骗贷”。由于买卖双方的讯息不对称是经常发生的，所以违约的现象就屡有发生。由此造成的投资失误在市场上屡见不鲜。这就是尽调的重要性。", "杨和他的团队很快就取得了深发展员工的信任。这和杨本人谦和平易，专业尽职的风格不无关系。一般而言，名不正则言不顺，新桥还不是股东，而派出的团队能够被深发展的员工所接受，说明杨和团队的个人素质起了很大的作用。其实，名正也未必言顺，古人就警告“德不配位”者不能长久。而名不正却言顺，那就一定是“有德”才行呀。", "深发展是个问题丛生的银行，大部分员工应该是心知肚明的。但凡在这种地方，都会人心思变，所以我想他们对于即将到来的变化一定很期待，虽然他们尚且不知会是什么样的变化。员工的配合，使得过渡期管理委员会有效发挥作用。新桥的团队每周都会与委员会的成员开会，了解新增贷款数量和质量。", "到此时为止，新桥的谈判对象就是深发展的行长周林。他既代表深圳市政府，也代表深发展。我们之间相互沟通很有效率。其实在周林之上，还有一位董事长，但是大概因为他即将退休了，所以我们从未谋面。我当时以为深发展是行长说了算。到了来年，周林升任董事长，仍然是真正的决策者，在很长一段时间，我没有见过新行长。可见周林站在哪个位置上都是“大拿”，这是因为他能干。我想深圳想引进外资，如果没有周林张罗，事情不会进展得如此顺利。", "但这时，事情发生了变化，市政府正式指定了一名“首席谈判代表”和我们对接。此人叫王骥，是深圳商业银行的行长。深商行也是市政府控股的城市商业银行。", "2002年10月中旬，我和欧巍在深发展的总部第一次见到了王骥。他给我的第一印象就是比较“冲”。他大概40多岁，但身材和言谈举止都显得更年轻一些。他说话的时候眼睛也很活泼，情感毕露，语速快，不打喯儿。握手打了招呼之后，他开门见山，直奔主题。主题只有一个，就是股权转让的价格。他希望双方马上敲定价格。我表示此时还无法谈价格，原因是我们刚刚开始尽调，对于资产质量还没有摸底，而按照双方商定的定价原则，是在调整后的有形净资产值上加一个倍数，因此应该在尽调完成之后再谈价格。这就好像买贵金属，还不知道成色，怎么谈价格呢？王骥不同意，一定要马上谈，而且说等待对新桥没有好处，甚至暗示他可以影响尽调的结果。他这么一说让我感到极度担忧。其实会计师普华的团队，已经向我们反映王骥带来的人在银行内部四处窥探。如果王骥对配合我们工作的员工施加影响或压力，减少透明度，那么我们确实无法搞清资产质量和真正的净资产值，也搞不清财务真相。", "也许他虽然这么说，但未必有这个心，只是想吓唬我。但初次见面，对他不了解，我就不得不担心。我赶紧去找周林商量。我知道和市政府沟通，周仍然是最好的渠道。他告诉我说，宋海副市长希望把价格确定下来，定在账面净资产的1.5倍。按照双方之前的约定，如果尽调之后，得出来的调整后净资产是负值，那么新桥需要支付的价格也要在账面净资产的0.8到1.5倍之间。此时还没有完成尽调，副市长就要求我们接受价格区间的上限，我没有同意。", "次日，周林回来说，副市长坚持要我们承诺1.5倍账面净资产的价格，否则深圳方将中止交易。我很吃惊，说框架协议是有法律约束力的，岂能说中止就中止呢？我说必须按照协议执行，现在不能接受1.5倍。", "周林恳切地要求我接受副市长的要价，但我没有松动。我认为宋副市长威胁要退出交易有点虚张声势。交易进展到这个地步，双方都已经骑虎难下。这个交易不但得到了市、省和中央各部门，而且得到了国务院的原则批准，已经公诸于世，岂能如此轻易终止呢？后来事情的发展证明，我在此时没有认真考虑接受宋海的建议和周林的恳求是走了一步错棋，而且差点搞得满盘皆输。如果我当时就接受了宋的要价，可以省却很多周折和成本，对于双方都是如此。但话又说回来，没有后来的周折，也许我们对深发展的控制就不到位，因此改造也放不开手脚。这些都是后话。", "我当时的固执是基于一个基本原则，作为专业投资机构，我们必须对投资者负责，对于每一笔投资都必须知根知底，没有完成尽调，我无从判断价值，而且我确实希望如果尽调的结果证实资产质量比较糟糕，我们也许可以谈一个更好的价格。我可以感觉出来，欧巍对我的意见有保留，尽管他没有明说。他大概认为我的决定可能因小失大。后来事态的发展证明他是对的，而我是错的。但当我意识到，已经为时过晚。", "2002年11月，普华和大摩都完成了资产质量的初步评估。谜底终于揭晓了，结果比想象的还要糟。根据深发展2001年年报的披露，不良贷款比率接近15%。这已经相当惊人。但普华的初步结论是，实际不良率双倍于此，高达30%。从技术上来讲，这家银行已经破产了，哪怕不良资产部分核销，也会使净资产归零或成为负数。", "实际上深发展处于此种状态已经很久了，之所以还没有出大问题，是因为有大量存款带来的流动性支撑。但是这种局面难以持久。市政府之所以要做重大改革，就是要彻底解决问题，消除隐患。", "大摩也独立得出了类似的结论。大摩团队的负责人叫哈里森.杨（Harrison Young），他说深发展需要增资10亿美元才能达到监管要求的资本充足率，相当于80亿人民币（当时的汇率大约是一美元兑换8元人民币）。深发展配股的计划打算增资40亿人民币左右，即便完成，也只能满足监管对于资本充足率要求的50%而已。", "但是大摩的分析报告也不悲观的。尽管不良率过高，资本金缺口过大，而且在若干年内可能无法补足，但他们仍然认为新桥不应放弃。大摩的团队与我们讨论了他们的分析报告。我与哈里森很熟，在韩一银行的项目中，大摩是韩国政府的顾问，哈里森也是牵头人，我们经常打交道。他表示虽然深发展问题很多，尤其是不良率和资本金缺口都远远超过预料，但如果改换管理层，创建现代风险管理制度，用利润和市场募资相结合补充资本金，这家银行还是有希望的。大摩的模型分析了对新桥而言上、中、下三种可能性：上，可以通过未来利润和市场增资迅速补足资本金；中，如“上”行不通，争取获得监管宽容，允许深发展逐渐满足资本充足率；下，如果“上”和“中”都不行，新桥必须注资救深发展，大概需要10亿美元，但如果新桥可以获得相应的股权，也不失为好的投资。因此，我们一定要摸清监管部门会不会允许深发展在资本充足率不达标的情况下继续经营，这是我们投资的先决条件。监管在一定时间内宽容是有国际先例的。长时间以来，深发展实际上是在监管宽容的庇护之下，因为它早就资本金不足了。但如果作为外资的新桥接管了控制权，监管部门是否还会如此宽容，给深发展多少时间，这些都是我们需要和监管部门沟通之后才能知道的。深发展像是一辆陷入泥沼中的马车，必须快速拖出来，否则越陷越深，最终无法自拔。如何自拔呢？就是在经营中产生利润，逐渐补充资本金。所以，我们投资深发展是否成功取决于业务增长的速度。为此，新桥团队与财务顾问大摩以及商业咨询顾问科尔尼团队一起制定深发展未来5至7年的经营规划和财务预测。", "11月28日，新桥、大摩和科尔尼三个团队一起开电话会议，讨论财务模型的基本假设。不到十分钟，我就发现顾问们的思路和我们的想法差距很大。比如在过去的几年当中，深发展的贷款额以每年80%左右的速度增长，这是一个非常惊人的速度；也正是因为增长过快，发放贷款的标准过于宽松，所以造成了很多不良。科尔尼的财务模型的基本假设是在今后5到10年，贷款额每年增长率降低到11%。假设增长率降低是合理的，我们加强风控，贷款增长速度肯定会放缓，但从80%的增长率骤降到11%就太过了。没有足够增长，就没有足够的利润，也就不能快速补充资本金。我们无法接受这样的建议。", "通过尽调，我们知道，深发展每年存款增长的速度大约是20%左右。贷款增长超过存款增长所需的资金都是其他银行拆借来的。将拆借的钱用于长期贷款风险很大，因为拆借一般是短期的，而贷款是长期的，一旦拆借到期的时候不能继续拆借，而贷出去的钱又一时半会儿收不回来，那么银行就危了。", "但我们想深发展未来贷款的增长速度最保守也需要和存款增加的速度相匹配。所以我要求顾问们改变模型中的假设，将贷款和存款的增长速度同步，都是20%。其实这个假设仍然比较保守，给未来的管理层留有超出的余地。另一个重大问题是业务方向。新桥改造韩一银行的经验是减少对企业贷款的比重，大幅提高零售贷款一譬如对家庭的住屋按揭贷款一的比重。零售贷款比对企业贷款风险更分散而且利率更高。", "在中国国内，银行对企业贷款称之为“对公业务”，而零售贷款则称为“对私业务”。按照科尔尼的构想，未来深发展还是以对公业务为主，对私业务比例很小。这和新桥团队的思路大相径庭。当时深发展几乎没有什么对私业务，而我们的打算是大幅增加对私业务的比例，也从而减少对公业务的比例。除了风险分散和利润率高，对私业务的另一个好处蛋可坠使濯型县拗品猎奖龟隼鱿卺奖発存灵：然盐蹷丝麦赞点面黍＄私业务需要和客户近距离接触，大银行并没有明显优势，这是深发展的长处。我们的目的是要把深发展打造成一个零售银行。这是一个根本性的战略转变，而这个转变只能逐步实现。", "我要求科尔尼的团队在模型中设定，在三年之内，将深发展的对私业务从几乎为需增长到占全部贷款组合的50%。也就是说，在三年之内，对公和对私的业务将各占50%。此后，零售业务的比例还要进一步增加。", "经过两个多小时的讨论，大家接受了我所设定的目标。顾问们需要回去更新模型，重新分析和计算，看看这些目标和其他目标是否冲突，如何相互吻合。第二天，同样的一群人又召开了电话会议，讨论在修改假设和目标之后更新的财务模型产生的结果，最终大家都认为零售银行的战略可行，而且在此前提下，深发展的资产每年增长20%是可行的。", "在几周之内，我们和深圳首席谈判代表王骥多次会面谈判，但是在所有议题上都几乎毫无进展。我们发现，他对这个项目的历史和背景几乎一无所知。我不知道深圳方面是有意不让他知情，还是认为没必要。也许他的参与只是走过场，或是深圳方面想看看他是否能够谈出更有利的条件。总之，我们谈来谈去，都是在原地打转。我尽量对他解释过去达成的共识，但是他不接受我们的说法，每次都强力驳回，并提出我方认为几近不合理的条件。结果我们各持己见，谈不到一起去，双方都感觉很沮丧。有一晚，我和欧巍与宋海副市长和周林一起吃晚饭。席间，我们向宋海报告了工作进展情况，我说虽然尽调的结果显示资产质量比预期的要差，但新桥收购的意愿没有改变。然而，我对与王骥谈判陷入僵局表示失望，又无计可施。宋海重申了市政府方面对于顺利完成交易的各种承诺，说决心没有改变。市政府也认识到作为首席谈判代表，王骥缺少灵活性，说已经决定换人。将近一个月，我们没有看到深圳方面有任何动作。直到11月底，我们才接到通知，接替王骥的新任首席谈判代表是交通银行深圳分行的行长萧遂宁先生。交通银行是中国第五大银行，总部在上海，其深圳分行规模不小，下辖大约60家支行，这是因为深圳市的人口当时有900多万之多。任命萧为首席谈判代表显示出市政府对此事的重视。其实，王骥所在的深商行归市政府管，深发展也归市政府管，但交行的深圳分行是直接向设在上海的交总行报告的，并不在市政府的管辖范围之内，所以理论上讲，萧遂宁是深圳从交行借调过来的。我希望和新任代表立刻见面，但约不上。过了几天知道，萧得病了，在广州的南方医院做了手术，此时仍然在住院。11月30日是个周六，我和欧巍从香港乘火车去广州。那时还没有高铁，但列车行驶平稳，车厢中座无虚席。看窗外的景色，香港边界以内沿线都是楼房，一驶入内地，豁然开朗，一眼望去都是广袤的稻田。直到列车驶入广州郊区，楼宇多了起来，最终高楼大厦映入眼帘。广州火车站人满为患。我们穿过摩肩接踵的人群，挤出车站，坐上了一辆出租车。街道繁忙，道路拥挤，人行道上行人络绎不绝，穿着时尚。此时已经深秋，夏季的炎热消散了，天气晴朗，气温宜人。", "很快，我们来到了南方医院。这是全国最好的医学院附属医院之一。病房中，萧遂宁斜靠着枕头半躺在病床上，他的妻子坐在床边的一把椅子里。他大概50来岁，面容憔悴，显出病态，但是双眼炯炯有神。他伸出手时面无表情，握手也没有力气。我想初次见面，又是在这样的场合，不适合谈生意，所以就泛泛地询问他的手术和健康状况。他只说手术很成功，他的妻子点头认同。一说起有关银行的事情，他的精神头就来了，话匣子也打开了，从各个银行的差异到风险管理的方式，他都有很深刻的见解，侃侃而谈。我蛮惊奇地发现，我们相互之间很谈得来，对于银行业普遍存在的问题，为何会存在这些问题，如何整治，尤其是怎么才能搞好，双方有很多共同见解。虽然初次见面，我觉得与此人打交道应该不难，因为他说话有依据有逻辑，这样的人讲道理。讲道理的人是可以被说服的。同样，我也认理。只要对方能说出可以命我信服的道理，我就接受。谈判就怕碰见一个固执己见的对手，不讲道理也听不进道理，那么双方很难谈拢。谈判要成功，双方都要设身处地为对方着想，这样才能找到共同点。", "萧遂宁出院后，我们又去深圳拜访他。但他说尚且没有得到市政府的明确指示，所以无权和我们谈判。这很奇怪，政府正式通知我们他是新任的首席谈判代表，而他又不肯谈，这是演的哪戏呢？我去问周林，他说市政府内部刚刚发生了一些人事变动，原来分管银行和金融机构的副市长宋海获得提拔，即将就任广东省的副省长，此时正在交接工作，准备履新，大概顾不上深发展的交易了。而萧遂宁是个很谨慎的人，在没有获得政府的明确指示之前，他不会和我们谈判的。我们只能等待。", "当然，我们尽调工作也忙得很。尽调大军有些每天往返于香港和深圳，有些在深圳安营扎寨。我们几乎天天都和他们开会，讨论工作的情况，解决发现的问题，有条不紊地进展。", "2002年12月13日，周林带着我、欧巍和刘伟琪去拜见深圳市的市长。地点还是市政府的招待所，上次见党委书记就在这里。市长于幼军给我的第一印象是不像个官员，更像个学者，说话轻声细语，举止温文尔雅。", "他皮肤白晰，使他看上去比49岁的实际年龄要年轻。我们寒暄之后，就坐下来吃晚饭。我猜想这个见面是礼仪性的。深发展的交易已经进行8个月了，其间我们见了市委书记、副市长以及市政府副秘书长等官员，而这是第一次与市长见面。之前所见的其他官员对于深发展项目都表示了热情支持，但于市长并没有什么表露，问题也不多。也许他已经听汇报了解了情况，无需多问。为了不冷场，我找话题问他。他则有问必答，彬彬有礼。总之他给我的印象是不苟言笑，亲切但不亲热。我想市长大概高高在上，没有直接参与或主导出售深发展的决策。很久以后，我才知道我的猜想是错误的。12月19日是个星期四，我们终于坐下来与萧遂宁正式谈判。看来他手术后康复得很好，虽然仍显消瘦，但握手有劲。会谈一开始，他就拿出一张纸递给我。这是市政府任命他为全权首席谈判代表的授权书，上面盖着市政府的鲜红大印。显然，他认为有必要向我们展示凭证。我多少认为他是多此一举，谁会怀疑他是假冒的呢？他的前任王骥从来没有出示过授权书，并没有影响他代表市政府谈判。萧的举动让我感到此人做事小心谨慎，一丝不苟。", "萧的旁边坐着卖方顾问所罗门的一名员工，刘伟琪坐在我的旁边。到这时，我们已经不再考虑按照调整后的净资产为基础作价了，因为我们尽调的结果已经确定真实净资产是负数。所以谈判集中在账面净资产值的倍数。经过四个半小时谈判，毫无进展。不仅如此，还倒退了，也就是说双方的差距拉大了。一个月前，宋副市长坚持以1.5倍的账面净资产值作价，我没有答应。这一次，萧一上来就要价2.3倍，还说这是一个折扣价，因为他个人认为市政府方面应该坚持2.8倍。我听了有些着急，认为对方不是努力缩小而是有意扩大分歧。我直言不讳说，如此看来，政府方面缺乏诚意。他听了不嗔反而笑了，说，请您耐心，饭要一口一口吃，路要一步一步走。他是南方人，但是也像北京人一样客气地尊称对方为您。", "我心想，萧和王骥的风格迥异呀，王是出快拳，恨不得一拳击倒对方；而萧则是打太极拳，一拳过来，难辨虚实。这样一来，势必久拖不决。我担心夜长梦多，拖久了，热乎劲儿过去了，谈判破裂的风险就增加了。但碰上这么一个对手，急也没用。"], "wcount": 8123}, {"icon": "8", "title": "第八章 貌合神离", "paras": ["2003年中国政府换届。国家主席江泽民以及国务院总理朱镕基卸任，取而代之的是胡锦涛和温家宝。在朱镕基的任上，温家宝是副总理。新任国家领导的改革思路，与上届可谓一脉相承，萧规曹随。国务院各部委的领导在2002年底之前就开始改组、换班。对于银行业，最大的变化是银行监管的职能从人民银行分离出来，成立中国银行业监督管理委员会，简称银监会，专门负责对银行和其他金融机构的监管。", "银监会在2003年4月正式挂牌。", "自从2002年12月起，周小川担任人民银行行长。他是共和国历史上学历覆变锤帮寤虀灾鼙响验粑业藭架森仝箱撬土牮瞿迷发盐饔背王烫箱地黼天，我说中国领导人大多是学理工出身的。比如江泽民在上海交大读的专业是电机，朱镕基毕业于清华大学，学的也是电机。胡锦涛也是从清华大学毕业，专业是水利工程，温家宝毕业于北京地质学院，专业是地质构造。如此等等。他说，在文革前考大学，优等生都考理工科，成绩一般的才去学文科。", "但是周小川还是成了经济学家，而且很杰出，先后在1994和1997年度获得“孙冶方经济科学论文奖”，这是中国经济学界的最高荣誉之一。我第一次与他见面还是他担任中国银行副行长的时候，我当时在摩根银行工作，和几个同事站成一排与他及中行的几位高管握手。当他走到我跟前，一边与我握手，一边笑着说，“我读过你的论文”。那时我离开沃顿商学院的教职已经有几年的时间了，他居然读过我的论文，使我大吃一惊。后来我知道，他的兴趣和研究范围很广泛也很深入。比如他酷爱音乐，乃至写了一本介绍纽约百老汇音乐剧的专着。", "他的职业生涯始终围绕着经济和金融，担任过中国银行的副行长、人行副行长兼任外汇管理局的局长、建设银行行长、证监会主席，直到升任为人行行长。在中国银行业改革的关键时刻他担任央行的领导职务，可说是不二人选。周小川身材高挑匀称，戴眼镜，有学者的风度，也有运动员的体格。我记得有一次和他谈起企业创建核心竞争力和专业化的重要性，这是我在沃顿教过的一门课程。为了证明我的观点，我举例说：“这就像没有人每项体育运动都好一样。”周笑眯眯地看着我，眼里露出一丝诙谐，说：“我就每项体育运动都不错。”周围的人闻言大笑。虽说是玩笑话，他确实是每项体育运动俱佳。后来我看到一则新闻报道，提到美国财政部长劳伦斯.萨默斯（Lawrence Summers）访华之时和周小川约了打一场网球，开玩笑打赌，谁输了就让对方决定人民币和美元之间的汇率，结果周赢了。", "2003年1月，刘明康被任命为正在筹建中的银监会主席。4月，银监会正式挂牌。刘明康是银行专家，但饱经历练。文革期间他在苏北下乡有10年之久，又当了三年的工人，后来加入中国银行”从一般职员做起，二路升迁，再后来进入政府部门，担任过福建省的副省长、然后回到金融领域，任光大集团的董事长、人行副行长等职，在银监会之前任中国银行的董事长兼行长。我是在2002年接受刘明康的邀请担任了中银香港的独立董事，后来又兼任了稽核委员会主席（一般公司称之为审计委员会，而银行业约定俗成称之为稽核委员会，虽然英文称谓是一样的—Audit Committee）。在此前我并不认识他。但刘了解新桥收购和改造韩一银行的案例，认为我的经验可以对中银香港有所帮助，专门托人找到我，邀请我加入董事会。", "我有感于他的信任和改造银行的决心，欣然接受。那时中银香港正在筹划在香港重组上市，我有幸参与其中。刘明康是个学者型的银行家和监管官员。他戴着一副无框的眼镜，说话语气温和，思路清晰、逻辑缜密。听别人说话时眼睛盯着对方，让你感觉到他全神贯注。当时中银香港董事会上有几位独立董事能够熟练应用的工作语言只是英文。我想他是为了让独立董事充分发挥作用，也是为了银行的国际化，他用英文主持董事会。他的英文很流利也很地道。无论作为银行行长还是银监会主席，刘明康都是举轻若重，事必躬亲，管得非常细。我和不少国家的监管机构打过交道，在我看来，在他领导下，中国银监会的监管水平从一开始就是世界一流。2002年中银香港上市为国有大银行股份制改造和上市趟开了一条路，其后几年中，这些银行都成功改制上市，引进市场化机制和风险管理制度。", "这些机构和人事变化，为银行业的进一步改革奠定了基础，后来的改革措施可谓大刀阔斧。到了2002年底，我们对于深发展的尽调基本完成了。普华和大摩分别出具了调查报告。这大概是国际审计师对一家中国的银行最深入的资产质量调查，暴露了深发展不少问题，最主要的当然是大量的不良资产，比深发展披露的情况要糟糕得多。像一切上市公司一样，深发展的财务报表也是经过外部审计师审核通过的。当时普遍认为，境内的审计师不够严格。但是深发展聘请了两套审计师，国内的和国际的，国际的是全球“四大”之一，正是新桥在收购韩一银行时用的审计师事务所。当时我们对这家的专业性和严格标准非常赞赏。按理说，这家应该遵循国际标准，他们没有看出这些问题来，让我们很惊讶。我猜想这大概应了南橘北枳的典故：春秋时齐国的晏婴出使楚国时说，“橘生淮南则为橘，生于淮北则为枳，叶徒相似，其实味不同。所以然者何？水土异也。”我们和这家境外审计师的团队开了会，讨论我们发现的问题，尤其是拨备不足的问题。我们是真心实意和他们交流，并无指摘的意思。没想到他们完全不接受我们发现的问题，竭力为自己的工作辩护。更出乎意料的是，一开完会，他们就去找周林告状，指摘我们向他们施加压力，要求他们在财务报表中更多计提坏账。", "我后来意识到，我在此事上欠缺考虑。对于任何一家上市公司，我们所讨论的都是敏感讯息。这些讯息可能冲击市场和储户的信心，一旦引发信心危机，造成譬如挤兑之类的事件，后果不堪设想，甚至带来灭顶之灾。周林并没有对我们隐瞒资产质量的问题，而且承认实际净资产可能是负数。深发展历史积累下来的问题，只能假以时日，逐步解决，没有其他的方法。但家丑不可外扬，我们质疑审计师，没有顾及到他和管理层的面子。审计师的小报告，一定在他的心头上撒上了阴影。他当时没有说什么，但是不信任的种子可能就此埋下了。当我醒悟过来，为时已晚。也就是从那时起，谈判的节奏缓慢下来，但我也仅懂是有所察觉而已。2003年元且之后，我就明显感觉深圳方面的热情冷却了。我们要求开会，迟迟得不到响应。我们不知原因，只能耐心等待。普华是新桥的顾问，所以它出具的审计报告只供新桥参考，报告中的不良贷款数据让我们感到有些触目惊心。普华将深发展16%的正常类贷款划归为不良类。深发展财务报表披露的不良率是15%，两者相加，实际不良率为31%。我们不能排除普华使用的标准过于保守，但是我们也没有任何理由比他们更乐观。按照这个结果，深发展不仅仅是有个净资产窟窿，而且是个巨大的黑洞。我们更加担心投资赔本的风险。我们并无打退堂鼓之意，只是希望谈判出的价格不要太高，减低投资风险。但是令人不安的是，对方好像失去了谈判的积极性，怎么联系都不予答复。我左思右想，不知他们葫芦里卖的是什么药。", "2003年1月，《21世纪经济报道》发表文章，称新桥在深发展的交易中遇到障碍，主要问题是其资产质量问题。就在此时，代表另一家私市股权投资公司的熟人打来电话，说深圳方面已经与他们接触，询问对于深发展的兴趣。我想这两件事情不可能仅仅是巧合，我担心周林改变主意了，正在市场上寻找其他买家。", "也许我多虑了。我们在新年伊始再次与萧遂宁和他的团队见面时，气氛很友好，大家互致新年问候，谈话轻松愉快，就像以往一样。1月10日星期五，周林邀请我在深发展部门经理的年会上发言。年会是在深圳西丽湖麒麟山庄举办的。这是一个优美的去处，很像北京的钓鱼台国卖馆。那天天气特别好，阳光明媚，暖洋洋的。更让我感到温暖的是员工们的热情，对于我的致词表现出很大兴趣。当然，他们知道新桥将获得深发展的控制权，而我是新桥的代表。", "当天下午我和欧巍在交通银行深圳分行的行长办公室与萧遂宁见面，继续谈判价格。萧表示，深圳方面的要价已经从三周前的账面净资产2.3倍降到1.65倍。", "自从2002年首开谈判以来，对方的要价就没有什么合理的依据，让我感觉是漫天要价。当然，卖方希望高价，买方希望低价，情有可原。问题是，要达成一致，总要有个公认的标准。我对深圳方面主动降低要价表示欢迎，但也表示碍难接受，因为我们之前与周林达成的协议是不高于账面净资产的1.5倍，而根据尽调的结果，1.5倍都是过高了。", "在返回香港的路上，我和欧巍交换了看法。他认为，双方能够接受的股权转让价格大概是10亿元人民币（相当于当时的1.2亿美元），相当于账面净资产值的1.38倍。我觉得他说得有道理。虽然我们希望价格更接近账面净资产值，但是考虑到控股权溢价，这个数字是可以接受的。而且10亿元是个整数，吉祥数，中国人都讲究十全十美嘛。我们两个人一致认为，此事不能再拖了，日久生变，再拖下去，深圳方面变了主意就麻烦了。", "1月28日，新桥内部开了一个电话会议，我向与会的合伙人报告了我和欧巍的想法，大家都表示赞同。布朗姆和庞德曼都认为我们的妥协方案是可以接受的，并敦促我们抓住势头，早些与深圳方面达成一致，以免坐失良机。在前线谈判的团队对于深发展的资产质量和存在的问题有相当深入的了解，因此认为妥协方案已经十分合理了。但是庞德曼不以为然。他认为，妥协方案是账面净资产的1.38倍，而萧遂宁要求的是1.65倍，其间的差额为20%左右，相当于2500万美元，对于他来说，从大局来看，2500万美元是个小数字，不应成为成交的障碍。他说，“这笔交易，要么全胜要么全败，无论成败与否，2500万美元无关宏旨，因此不值得斤斤计较。”关键是要抓住时机，尽快成交。", "庞德曼有个本事，看问题时善于高屋建瓴，有战略眼光和大局观。他的几句话犹如醍醐灌顶，使我茅塞顿开，意识到我们陷入在谈判的细节当中，只见树木不见树林，很可能因小失大。这就像打仗一样，为了达到战略目的，不能计较一城一地的得失。眼下当务之急就是迅速成交，以免夜长梦多，因此1.65倍就1.65倍吧。", "2003年的春节落在2月1日，春节假期加上两头的周末大概有10天左右。", "我和妻子本来计划带着女儿到日本去滑雪，但我听说央行行长周小川和银监会主席刘明康都会到深圳过春节。银行监管的领导平时都很忙，见到的机会很少，我想此时是向他们报告深发展项目进展的好时机。此时正处于关键时刻，也需要听取他们的意见。因此，我们取消了去日本滑雪的计划，而是改成到深圳去过春节。我们在深圳“世界之窗”景观附近定了酒店，女儿学校一放假我们就驱车去了深圳。大年初二，我给萧遂宁打电话，先给他拜了年，之后约他见面。那时已经是晚饭后了，我本以为他能够在两三天内抽出时间就很给面子了，未料他在电话中爽快地说此时就可以来酒店。结果我们在当晚九点半就见了面。我想他这么愿意见我一定有好消息。没想到恰恰相反，他之所以急着见，是有坏消息。", "他直截了当地说，情况对你们不妙呀，深圳方面开始重新考虑和新桥的交易，他奉命给我们下最后通牒。深圳方面改变了要价，之前说1.65倍不算数了，现在要价是两倍，而且这是最终价格，没商量，如果我们不接受，交易就取消了。为什么此时下最后通牒，他未作任何解释。听了他的话，我感到很吃惊，又很沮丧，我们好不容易已经决定接受1.65倍的报价，他又突然变卦了。谈判的惯例，如果双方都有诚意，是尽量向对方靠拢，以求弥合差距。他倒好，反其道而行之，非但不让步，而且还大踏步向后退，这不明摆着是不打算成交吗？他也知道这种出尔反尔的做法荒唐，向我表示道歉，但说作为政府的代表，他必须服从命令，这是政府方面的决定。至于怎么做出这个决定，谁给他的指示，他一句话也不肯多说了。", "我隐约感到，周林可能要抛弃我们了。从我们交往的经验中，我知道他非常有本事，说到做到，无论是在深圳还是在北京，几乎没有他搞不定的事情。但成也萧何败也萧何，他如果反对的话，我相信这个交易是办不成的。但是我想不出他为什么会改变主意。我打电话问周林到底是怎么回事。他的回答模棱两可，既不否认，也不确认，但我立即明白了，根子就在他这裹，他想用提高要价的方法，迫使我们放弃。", "当我意识到他的用意，犹如当头挨了一棒，心头勐地一沉，我们所有的努力和希望突然可能付诸东流，这不能不让人十分沮丧。但我也知道，事情没有这么简单，深圳方面没有权利把我们赶走，双方已经签署了协议，规定价格在账面净资产的0.8到1.5倍之间，如果我们接受这个区间的上限，即1.5倍，那么双方的协议就具有法律约束力。至少，我是这么想的。2003年2月6日是周四，我去五洲宾馆，正好看到银监会主席刘明康、深圳市长于幼军和市副秘书长刘学强三个人一起在咖厅吃午饭。市长见到我第一句话就问深发展的交易进展如何。显然，他并不知道情况有变。我说，还在谈判中，我们非常期待能够尽早完成交易，但政府方面在交易价格上有些摇摆不定。除此之外，我就不好多说了。他说，很多中央领导都对这个交易感兴趣，温家宝总理的秘书也给他打电话询问进展，他们都希望这笔交易修成正果。我心想：我们倒是有意愿达成交易，但是你们那边一直推三阻四啊。但我一言未发，因为我意识到，他并不知情，可见想用抬价的方法逼退我们并不是市领导的集体决策。于幼军和刘明康离开后，刘学强留下来继续与我交谈。我把遇到的问题告诉他。他说，重大决策最终都是由政府高层拍板的，不是任何个人可以说了算的。他接着提到，最近有报道称花旗银行入股了浦东发展银行，占4%股权，股价为账面净资产的1.54倍。他说，新桥收购深发展的价格无论如何不能低过浦发行出售股权的净资产倍数。", "其实，这两者是不能比的，我们对浦发行不了解，但是仅从财务报表中可见，其不良资产的比率大大低于深发展，也就是说，其账面净资产值比深发展的要真实的多。但是我们已经决定接受政府方面之前提出的1.65倍，所以我向他保证，我们支付的倍数不会低于1.54。不久，我们通过多个渠道暗中打听，证实了周林的立场转变了，从新桥的头号支持者，变成了主要反对者。我们不清楚为何如此，但自我检讨一番，我觉得很可能是我的过错。起先，周林恳请我们接受宋海提出的账面净资产1.5倍的转股价格，我没有同意；其后，我质疑深发展的审计师。这两件事情，很可能造成周林对我的不满，也许因此使我们之间产生了嫌隙。无论如何，周林态度的改变危及整个交易，至少使前程障碍重重。我揣摩因为双方签有框架协议，且这个交易从地方到中央各级部门都知道，深圳方面也很难主动抽身，所以周林想让我们知难而退。我反复思索，如何使他回心转意，使交易重新回到正轨，但束手无策。此时，我们听说，市政府内部的意见是不一致的。正如刘学强副秘书长所说，这么大的一件事需要高层的决策。有的领导支持周林的意见，终止与新桥的交易，还有的领导认为必须遵守协议，讲信用，言出必行。", "政府内部的意见分歧使我们看到一线希望，而只要有一线希望，我们就不会放弃。果然，很快就有了峰回路转的迹象。春节后，萧遂宁约我们见面。我想，他有话要说就是好事。萧是个非常专业、沉稳并且讲道理的人。我们是谈判对手，谈判时可能互不相让，但相互敬重。不过，他虽然是首席谈判代表，但显然授权有限。这一次，他说他是带着上峰新的指示来的。他说了三点：第一，他要求新桥承诺投资深发展至少五年不退出。他解释说这是市长本人的要求；第二，他说价格应该为截止到2002年9月深发展账面净资产的1.65倍；第三，如果我们一周内不接受这些条件，市政府会和其他潜在投资者接洽，大概是要对我们施加更大的压力，他补充道，有一家第三方潜在投资者已经提出按照净资产的2至2.5倍支付对价。那意思是说，如果新桥不接受这些条件，深圳方面不愁后面有人排队。后来，我们通过各种消息来源，勉强拼凑出市政府内部意见分歧的概况。说是有两派意见，
