尺", "paras": ["高盛（Goldman Sachs）是美国数一数二的投资银行。高盛的香港办事处坐落于中环的长江集团中心。这是一幢68层高的大楼，外形方正，拔地而起，外壁由巨型玻璃幕墙构成。大楼坐落在中银大厦和汇丰银行大厦之间。中银大厦的外观像是一把手柄朝上戳在地上的菜刀，而汇丰大厦形似一艘坚起来的厌色战舰。香港人非常讲究风水。据说，风水大师会巧妙地利用建筑设计调和无形的天地之气，利用气场的威力影响运势。风水大师们似乎都认为，贝聿铭设计的中银大厦，外观像一把利刃，颇有煞气，对于处在这个风水格局内的人和事来讲，尤其不利。因此，长江中心设计的高度低于中银大厦，又高于丰大厦，这样前者的煞气就辐射到后者，而长江中心就藏在这条看不见的直线的死角之下，避开了坏风水。汇丰是英国人控制的，入乡随俗，也信风水，在楼顶上装了两个起重吊车，形似两尊大炮，炮口对准中银大厦，据说就把坏风水挡住了。", "2008年6月4日上午9时30分，我准时来到了高盛的办公地点，与马明哲的三大干将张子欣、杰克逊和刘善学会面。他们有高盛顾问团陪同，顾问团牵头的是高盛的合伙人胡祖六。大概是提前打招呼的时间太短，我的团队成员都在出差，所以新桥这边只有我一个人出席。但我在脑子里做了充足的准备，胸有成竹。会场的气氛很友好，谈判也富有建设性，双方都有强烈的愿望达成交易。就在开会时，外面天气突变，狂风大作，暴雨如注，水顺着窗玻璃倾泻下来，形成水帘，让我想起孙猴子的水帘洞。坐在舒适的会议室中，看着外面大雨倾盆，是一种享受，大概潜意识里知道大自然奈何我不得，因此有些说不出来的惬意。心情好，谈判也顺利，四个小时之后，双方对主要的交易条款基本达成一致。恰在此时，雨停了，阳光透过窗户，倾泻进来，洒落一地。回到办公室，我写了一封邮件，标题为“银元项目二号（Sterling II）—机密”，将刚才开会的内容和结果择要报告给我的同事们。项目代号是收购深发展就起的，当初是买，此时是卖，所以加了“二号”以示区别。我说看来对方很有诚意和动力，因此我对很快会达成交易相当乐观，我罗列了与平安方面达成一致的主要条款：", "第一，是交易结构。有点类似之前和宝钢的交易结构，但此次既要马上完成交易，又不违反新桥在锁定期内不退出的承诺。平安将收购新桥有限合伙人在深发展中的权益，成为新桥唯一的有限合伙人；而新桥作为普通合伙人继续控制深发展。收购价如马明哲先前提出的，为每股39.9元。到了2009年底，即新桥投资深发展满五年之后，新桥将深发展的控制权移交给平安。", "第二，新桥手上握有在股改时获得的认股权证。平安将收购这些权证，收购价是每股39.9元与权证行权价19元之间的差价。这些认股权证将于16天后（6月20日）到期。如果届时双方尚未完成交易，新桥将从平安获得贷款，用于行使认股权，行权获得的股份也是以每股39.9元的价格卖给平安，平安可以从中扣除19元用于偿还贷款。", "第三，经董事会批准之后，深发展将按每股39.9元的价格向平安增发新股，总数不超过深发展全部股份的5%。", "第四，经董事会和监管部门批准之后，平安将以每股39.9元的价格，在股市上向所有股东发出要约，收购不超过30%的深发展股份。", "第五个步骤尚待与平安方敲定细节，但初步构想是，当第四条涉及的要约收购完成后，深发展以换股的方式收购平安银行。也就是说，深发展不是用现金，而是用增发的新股收购平安银行。", "如此一来，平安银行100%并入深发展，而平安保险集团获得的是合并后深发展的股份。最后，在完成交易之后和新桥没有退出之前，平安有权获得若干深发展董事会的席位。", "按照这个构想，在第一步到第四步完成后，平安将成为深发展实际控股股东，直接和间接地持有深发展51.68%的股份，其中30%来自于要约收购，5%来自于定向增发，还有16.68%的间接持股来自于新桥有限合伙人出售的权益。", "但第五步完成之后，即深发展通过换股收购平安银行后，平安保险集团将成为深发展的绝对控股股东，持股比例不低于三分之二。这一系列交易完成后，马明哲的平安将拥有一家全国性银行，并以其为核心打造金融生态圈。他的梦想终于要实现了。", "我料想这笔交易会让深发展的股民满意，因为不管是增发或要约收购，每股定价都是39.9元，比当天收盘价25.59元高出56%。我也知道，新桥的同事会很满意。果不其然，我们的合伙人戴德时在我的邮件发出去之后12分钟内就回复了，言简意赅：“太棒了。但愿顺利。”搞投资，我常重复一个俚语—“魔鬼藏在细节里”，此言不虚。每当我们深入细节，就会遇到各种魔鬼。", "此时已是2008年中，离2009年底新桥锁定期到期还有一年半的时间。正是出于这样的考虑，我们才提出了类似于宝钢交易的方案，让平安收购有限合伙人的权益。但次日，刘善学和杰克逊在高盛的办公楼再度与我会面时说，这个法子行不通，保监会规定保险公司不得投资私市股权基金或合伙企业，所以平安保险不能成为新桥的有限合伙人。我则觉得，事在人为，有限合伙人的安排，只是个过渡，也许可以做通保监会的工作。不过，我怕的是交易步骤太多，最后流于纸上谈兵。除了收购新桥有限合伙人的权益外，平安还要认购深发展的新股，在市场上要约收购散股，还要通过换股将平安银行卖给深发展。每一步都是大动作，需要监管部门、董事会和股东的批准。我们无法确保每一步都能获得批准，更无法预估会花多少时间。不管出于什么原因，只要任何步骤行不通，整个方案就会落空。要是等到每一步都完成，新桥才能卖出手中的股权，我们怕是等不起。我们需要交易完成的确定性和明确的时间表。", "6月9日下午，我给马明哲打了个电话，讲了我的顾虑。一番长谈下来，他同意平安将无条件受让新桥有限合伙人的权益，无论其他的几个动作是否发生。此外，提前征得监管部门的批准至关重要，这些部门包括银监会、证监会和保监会。再有，因为平安和深发展的总部都在深圳，所以双方都需要获得深圳市政府的批准。我们商定对口分工：平安是保险公司，自然负责申请保监会批准；深发展是银行，负责做银监会的工作；两家都是上市公司，因此相互协作与证监会沟通。", "6月10日，我专程飞往北京，去拜会银监会主席刘明康。他一如既往地行色匆匆，热情地和我打招呼，但说只能给我20分钟的时间。在我打过交道的监管官员中，刘主席可能是最勤恳、细致入微的一位了。当时他显得有些疲惫。我简要介绍了与平安商议的交易。他以为新桥打算于五年锁定期满后再做这项交易，但我告诉他双方希望尽早开始行动，平安考虑收购的只是新桥有限合伙人的权益，而新桥作为一般合伙人在锁定期内不会退出。他没有表态，只是请我与平安谈定后再来银监会报告。", "从北京回来之后，我去深圳在政府大楼食堂与副市长陈应春共进午餐。", "我向他报告了和平安所谈的交易，他认真听完后说：“如果你们在锁定期满前完成这个交易，可能不大好。别人会以此为口实，批评新桥和市政府。”新桥不遗余力地改造深发展，扭转乾坤。我此时闻此言，多少有点失望。不过，这也并不意外，我知道五年的锁定期对政府来说很重要。我本来想，如果新桥继续担任普通合伙人，平安只收购有限合伙人的权益，这就不是问题，但政府显然不这么看。", "第二天，也就是6月14日，我与平安的顾问，高盛的胡祖六谈了谈。我和他是老相识。他在哈佛大学获得经济学博士学位后就在高盛担任经济学家，后来转去了投行部门，可能是因为厌倦搞研究，想做点实事。这和我当初离开沃顿而加入摩根的想法差不多。他是深得马明哲信任的顾问之一。", "我和他讨论了与银监会主席及副市长会面的情况。我告诉他，我的判断是如果平安仅仅收购新桥有限合伙人的权益，而新桥仍然担任普通合伙人，银监会和市政府就不会有顾虑。现在的问题是，据说保监会的规则不允许保险公司投资私市股权基金，所以平安不能当有限合伙人。我问他是否可以想出办法解决这个问题。", "经过一番讨论，他的意见是放弃平安取代新桥有限合伙人的结构，转而由平安向新桥发放看跌期权，或叫沽权，即在约定价格在一定期限向平安出售股权的权利。这个方式两年前和平安第一次交手的时候讨论过，但被律师否定了，说是形同远期出售；这回，胡祖六建议把沽权设计成真正的期权，即新桥有权行使，也有权不行使。如果不行权，新桥仍然有权将深发展股份卖给第三方，这样就不构成远期出售，也不影响新桥的投票权。其实这就是在两年前我对马明哲提出的建议。我说好，我们没有意见，就看你能不能说服平安方面。他看来很有信心。接下来的几天，我和刘善学及平安的顾问们天天见面，双方渐渐形成共识，平安方愿意给新桥沽权。经过深发展董事会批准之后，平安将会在股市上对深发展股票提出要约收购。我们认为董事会会支持的，因为要约价格会高于市值，对股民会很有吸引力，否则我们也不会把平安的建议拿到董事会上讨论。", "6月18日，我与胡祖六及其团队再次碰面。会议结束时，我觉得离达成协议就差临门一脚了。但很快，平安方面又变了主意，刘善学来见我，说鉴于股市低迷，平安对作价有了新想法。又过几天，刘通知我，平安还是愿意发给新桥沽权，但行权价要降低。当时，深发展股价较两周前的收盘价已下跌14%左右，所以平安又拿不定主意了。他建议沽权不约定行权价，只约定个区间，最终定价取决于交易时的市场价格。", "世界上哪有这样的沽权，我有权卖给你，但不知道什么价格，取决于市场价格？要是取决于市场价格，我要这沽权有什么用？我随时都可以在市场上卖嘛！我想他们要么是在打退堂鼓，但抹不开面子，用这个办法让我们知难而退：要么就干脆没过脑子，抛出这么个馊主意。平安的团队都很精明，又有高盛的高参，我判断前一种可能性更大，他们在找台阶下，只不过方法有点笨拙，谁都不是儍瓜嘛。当初我同意向前推进，就是基于马明哲的报价，这是关键中的关键，其他都是细节。现在价格变了，就像楼快盖好了，你把顶梁柱抽走了，整个楼不就塌了？", "不用说，我觉得根本没有必要讨论他的新建议。我说，平安先前的报价之所以有吸引力，是因为反映了深发展的内在价值，而内在价值不为市场波动所左右。如果平安想以股市作为交易定价基准，就不必谈了。", "就这样，来得快，去得也快，白忙了一阵。", "我的回绝斩钉截铁，不留任何念想，平安方面应该知道走进了死胡同，但并没有就此罢了。7月初，刘善学说请我在香港四季酒店的Caprice吃午饭。那是一家豪华法式餐厅，装饰讲究，餐桌宽做，之间的距离比较远，便于说话，不必担心旁边有耳。落地窗外，是维多利亚港的景色，船来船往，赏心悦目，饭菜也精致。", "这时距我们上次见面已过去快三周了，我赴约时没抱任何期望。我从来都是买卖不成情谊在。做买卖是不能强求的，有时喜出望外，有时失望，但不必伤感情，所以我俩的个人关系很好。他大概不好意思上来就谈生意，所以东拉西扯地闲聊。眼看着杯盘狼藉，他才进入正题。他还是来谈深发展的。", "他说，平安仍接受每股39.90元的价格，也愿意发给新桥沽权。我有点将信将疑，这不是又回到我们分手之前的原点了吗？他说是的，这些都没变。不过他希望深发展先收购平安银行，再向平安增发股票，然后平安在股市上做要约收购，按照这个顺序。我担心口说无凭，就在当晚给他发了一封邮件，概括了他的新建议，请他确认。不到一小时，即收到他的回复：“单（伟建），这与我的理解完全一致。非常感谢。我会在内部讨论这个方案，同时也会和高盛商量，看方案是否可行。将尽快回复。”我们等啊等，望穿秋水，却杳无音信。8月28日，我与胡祖六吃午饭。他告诉我，平安内部意见不一致，有些人不赞同沽权的形式，还是想要新桥在锁定期后必须将深发展股份卖给平安。我说，这不是又回到“远期出售”了吗？上一次律师就已经把它枪毙了，说是违反锁定期要求，而且会令新桥失去投票权。胡祖六先前在6月14日提出的是真正的洁权，持有者有权行使，也有权不行使，我们可以接受。两年前杰克逊提议的也是一种沽权，如果不是“远期出售”的问题，我们也可以接受。两者的根本区别在于，“杰克逊沽权”的行权价以固定的IRR计算，最终绝对价格随着时间推移而递增；而“胡祖六沽权”的行权价此时就固定下来，其中隐含的IRR随着时间推移而递减。但两者都可以接受，因为前者IRR足够高，后者只是个权利而非责任。", "此时平安想回到远期出售合同，而且取了“杰克逊沽权”和“胡祖六沽权”两者中最不利于新桥的内容：新桥必须卖，但由于价格已经固定，所以IRR随着时间的推移而递减。且不说律师早就说了此路不通，即便律师认可，我们也不会接受。但顺着平安的思路，我又出了一个主意：平安给新桥提供一笔贷款，金额等于交易额，新桥把深发展股份质押给平安，到了还款期，平安拿走押品抵债了事。如此，我们拿到钱，平安拿到股（以押品形式），但新桥仍然是股东，仍然可以行使投票权。我对胡祖六讲，或者“胡祖六沽权”，或者抵押贷款，两者都可以接受。抵押贷款的方式之所以可以接受，是因为新桥马上就可以拿到现金，解决了IRR随着时间推移而递减的问题。", "几天后，刘善学约见。我在上海出差，所以回复说过两天回香港再见。", "他说，我可以飞去上海和你见面。我不知道他为什么这么急切，连两三天都等不了，估计有要事相商，就答应了。次日，我们在上海花园酒店的日餐厅吃午饭。花园酒店的部分建筑在解放前是法国俱乐部，地处原法租界中心地带。此时酒店由日本大仓饭店集团经营，原法国俱乐部的建筑还在，保留了经典的法式装饰风格，包括屋顶上低头俯瞰的半裸人物浮雕。我们吃饭的那家餐厅叫做“山里”，日本料理据说很地道，但我们俩人都是醉翁之意不在酒。", "入座后，刘开玩笑地说，“马总迫不及待地要与新桥达成交易，是我们这帮人把他往后拽。”这帮人指的是马倚重的心腹大将，比老板更保守。", "这是好事，表明他们意愿仍然强烈，但我却没有那么乐观了。我感觉达成交易的最佳时机已过。此时股市疲软。从6月4日在高盛第一次开会的那天到此时，深发展的股价跌了近三分之一，只剩下每股17元左右。而双方之前商定的价格是每股39.9元，超过此时的市值1.3倍还多。我很怀疑平安能够说服自己的董事会接受如此一边倒的交易。", "“我想问你个问题，你不会赶我走吧？”他试探道。", "“只要你买单，我就不会。”我指着菜肴打趣说。", "他小心翼翼地说，“先让我把话说完，你再反应。”顿了一下，他接着说：“如果双方对所有其他条款都达成一致，你们会考虑每股35元的价格吗？J他以为我会很不高兴，因为他们把价格从39.9降到了35。其实我的期待值更低，因为毕竟市值才每股17元。但我不动声色，表示要与合伙人商量商量。刘还说，平安可以向新桥发放贷款，金额等于收购总值，待新桥的锁定期满后，新桥用深发展股票偿还即可。这本来是我的想法，和胡祖六商量过，胡祖六很聪明地把它变成平安的提议了。我当然没有意见。", "平安有了一个新的目标，最终要成为深发展绝大多数股东，即持有的股比不低于67%。达到这个目标要通过几个步骤实现。一个是收购新桥持有的股权，另一个是深发展通过换股的方式收购平安银行，如此平安对平安银行的持股就变成对深发展的持股；再一个是深发展对平安定向增发；最后一个是平安从市场上收购深发展的老股。刘的建议是，无论是从新桥手中或是从市场收购旧股，还是定增，平安都准备出同样价格，即每股35元。", "刘还抛出了一个诱饵：对于新桥持有的股权，马明哲愿意用平安保险集团的股票支付，或者现金支付，选择权在新桥。对于平安，用股票还是现金支付应该没有什么区别，况且如果用现金支付，平安还是要到市场上去以发新股的方式募资；但对于买方来说，这个选择权就极有价值。9月10日，我给庞德曼和唐开罗写了封邮件，报告说，与平安的交易近在咫尺了，“但我们不能高兴得太早。平安可能像以前那样，在这个或那个问题上改变主意。但今天的感觉很好。假如你们觉得可以接受这个价格（即每股35元），我会明天与他再次会面。”次日，我和庞德曼简短通电，但没有深谈。因为我即将飞旧金山参加一个内部会议，所以他建议见面后再讨论。当天下午我又和刘善学见面，谈了一小时。结束后，我觉得只要平安不再变动价格，我们之间就有戏了。"], "wcount": 6460}, {"icon": "21", "title": "第二十一章 惊涛骇浪", "paras": ["马明哲邀请我参观平安的张江后援中心。张江靠近上海浦东国际机场，离市中心大约有一个小时车程，上海把这个区域打造成一个规模庞大的高科技园区，许多企业在此落户。2008年9月7日，刘善学陪我一起前往。车子从园区大门驶入，沿着车道，穿过一座美丽的大花园。花园里郁郁葱葱，树影婆娑，布满了色彩缤纷的花草植被。曲径通幽，石桥流水。水边矗立的荷兰式水车，近百米高的哥德式钟塔、平添欧洲风情，与充满希腊和罗马韵味的凉亭完美地融为一体。在这座欧式花园的中心，矗立着一座建筑，约七八层高。一楼环绕着一条拱形走廊，像是西班牙修道院庭院的风格。这座园林般的建筑是6000多名员工办公的地方，后援中心在一年前投入使用。马明哲告诉我，园区的整体设计由他亲自操刀。他给我的印象是富有远见，行动力十足，拥有敏锐的商业头脑。经此一游，这个印象更深刻了。马陪我参观主楼。在一层楼上，上千名员工正在计算机前忙碌，输入客户讯息。马介绍说，整个工作流程被分解成多个简单的单元，每个员工只需要负责其中一个单元。例如，一名操作员负责输入保险客户的姓名、出生日期和身份证号码，而另一名专门输入客户的教育背景等等，客户的完整讯息是几个人分别录入计算机的。如此一来，化繁为简，一个稍经训练的中学毕业生，就可以胜任一个特定单元的工作。例如，牙科保险的理赔本来是要牙医处理的，但化繁为简之后，一个理赔单被拆成几个部分，每部分中学毕业生就可以处理，而三五个中学毕业生加起来，效果和一名牙医一样，但人力成本要低多了。", "马带我来到作业大厅，迎面看到一个巨大的电子屏幕，由专人负责操控。屏幕上显示的是一张中国地图，上面红灯闪烁，实时显示平安保险代理人的出单数量。他告诉我，整个运营流程是跟平安的股东之一丰银行学来的，管理咨询公司麦肯锡提供了帮助，但平安内部团队将其大幅优化。", "高管办公室在顶层，墙上挂着知名画家的大幅油画，马明哲说都是真迹。马的办公室靠着一个小型室内花园。我们来到一间科技感十足的会议室。落座后，他介绍了公司的概况，然后邀请我到一个餐厅吃饭。餐厅的装潢是意大利式样的，饭菜也是意大利风味。在座还有张子欣和刘善学。", "马明哲说，过去两天刘善学和我讨论的内容也正是他自己的想法，他本人依然十分期待与新桥完成深发展的交易。他还表示，欢迎新桥投资平安，如果新桥投资，他愿意提供一个董事会的席位。我的表态也很积极，说，我从一开始就看好平安，之后的所见所闻让我更加确信了这一点。不过，我暗自提醒自己，不要被表面现象搞得眼花缭乱。做投资的要以批判的眼光观察一切事物，还要了解表层之下的东西，没有深入调查之前，不能轻下结论。但不得不说，张江后援中心给我留下了深刻的印象。此后，谈判的节奏加快了。到当刻为止，双方的共识还仅在口头，没有落实到文字上。我想，他们之所以不愿意形成文字，是想保持灵活性，改变主意的话也不至过于尴尬。但一周后，我收到了刘善学的邮件，第一次把平安的提议形成文字。看来，这次他们动真格了。平安提出的交易结构分成几个步骤，对于每一个步骤，双方都已经口头达成协议。第一，平安将向新桥发放一笔贷款，金额相当于以每股35元计算新桥持有深发展股权的全部价值，将来新桥用股份偿还贷款；第二，深发展将收购平安银行，以发行的新股支付；第三，深发展向平安增发新股，作价每股35元。", "刘善学提醒我说，每股35元的价格比前一日收盘价高出118%，而且比过去30个交易日的均价高85%。他还计算出来，这个价格意味着深发展股票的市净率一即价格对2008年6月账面净资产的倍数一为4.9倍，而市盈率一即价格对2008年预测净利润的倍数一为20倍。9月14日晚，我出发前往旧金山。临行之前，我将平安的书面提议转发给了庞德曼、唐开罗以及其他的团队成员。2008年9月15日，新桥所有的合伙人齐集旧金山开会。对我来说，这不过是一日之旅，我计划当晚返回香港。我根本想不到，这一天会被加载史册。一场席卷全球的金融风暴就在这一天来临，之后以摧枯拉朽之势重创欧美经济，波及全球。那天早上看到的第一个消息就是美国第四大投资银行、有158年历史的雷曼兄弟申请破产，创下了美国历史上最大金额的破产案，就此引发了全球金融海啸。那一天，华尔街的精英们惶惶不可终日。而新桥的合伙人则安逸地围坐在TPG阳光充沛的会议室里，还没意识到外面已经天翻地覆。会议上，我们一致同意将新桥并入TPG，更名为TPG新桥（后来又变成TPG亚洲）。我们全神贯注地讨论重组亚洲业务。下午，我与庞德曼和唐开罗同车去一个地方，突然电话铃响了。来电的是一位在雷曼工作的老朋友，他说东家倒了，他的饭碗砸了。我们三个人都替他难过，立即决定向他提供一份为期一年的咨询工作，帮助他全家渡过难关。雷曼事件最终酿成了全球金融危机，在那一天，其全部冲击力还没有显现出来，但是我看到的使我回忆起十年前的亚洲金融危机，彼时，韩国有一百多家银行倒闭。我以为美欧的银行体系比亚洲的更牢固，没想到却不堪一击。而亚洲的银行因为在亚洲金融危机之后经过重组和补充资本，反而很强壮，所以当2008年金融海啸到来之时，没有一家陷入麻烦。那天晚上，我在日记中记述了惊天危机正在降临美国，弥漫全球：今天，全球市场陷入前所未有的混乱。刚抵达旧金山便得知雷曼兄弟已经申请破产，美国国际集团（AIG）摇摇欲坠，美林被美洲银行接管。美国股市暴跌500点，包括中国在内的亚洲市场遭遇跳水。当然，我所有在雷曼工作的朋友突然变成了无业游民，毕生积蓄一夜蒸发。太惨了。", "趁着大家都在，合伙人抽空聊了一下与平安的交易。其实也没有什么需要讨论的，大家都认为刘善学邮件中的提议有足够的吸引力，原则上可以接受，只是有些细节需要明确。我给马明哲打了一通电话，简单地讨论了一下这些细节。当晚，在登上返港的飞机之前，我给刘善学发了一个邮件：今天，我们在旧金山讨论了你我所关心的题目，会开的不错。我们对这个项目全力以赴，但还有不少工作要做。我刚给彼得（马明哲）打了电话，提了三个问题。", "第1， 价格还有商量的余地吗？ 第2， 你的邮件说，“要走尽调”。假设我们在价格上达成一致，在何种情况下你们还要重新谈判价格？ 第3， 假定双方都尽全力走完所有流程， 但第一步，即新桥向平安发放可交换债券（注：即平安贷款给新桥，交换深发展股份），是不以其他步骤的完成为条件或受到其他步骤影响，这个假设是否正确？之所以提出这个问题，是因为我们都知道，取得监管审批所需要的时间可能会更久。如果你在今天休息之前就能帮助我解答这些问题，我不胜感激。我在信尾预判美国政府会如何应对市场崩溃：今天，市场经历了一场腥风血雨的浩劫，即使再不情愿，美国政府在本周末也必须有所行动，防止发生系统性的灾难。飞机刚刚在香港落地，我就看到了他的回复。他说对于每股35元的价格，平安不能保证不再动摇，而下面这段话更加深了我对平安是否能够信守承诺的疑虑：在随后的初步尽调阶段，若发现在以下方面存在重大偏差，我们仍保留重新谈判价格的权利：即对不良贷款的确认和/或拨备是否充足、重大应计提而未计提的负债以及其他可能影响价值的重大问题。", "我和平安团队打交道很久了，往往要确认双方共识的时候，他们就往回缩，这次也不例外。此言一出，我就知道平安的报价此时变成了水中月、镜中花，看得见摸不着。显然，他们又缩回去了。如果在我去旧金山之前马明哲或刘善学说他们的报价是有条件的，我对他们的一揽子提议根本不会当真。", "众所周知，贷款的分类具有主观性，两个不同的人可以得出不同的结论。如果他们不接受深发展外部审计师出具的报告，而要自己去尽调以确定拨备是否充足，从而再砍价，那么双方根本没有交易的基础。在价格方面，我们毫无再让步的意愿。他的邮件还说，拟议的交易中“四个步骤环环相扣”，也就是说，如果任何一个步骤在监管审批上受阻，整个交易就崩溃了，要么就无限期拖下去。从经验上，我知道监管审批的不确定性极大，而且不可控。深发展募资的努力屡战屡败，一筹莫展就是先例。我们所关心的是新桥将来最终的退出，如果因为平安要达到的其他目的受阻而绑架了我们的退出，那我们不可能跳上这条船。刘善学之前的书面建议让我看到希望，此时这封邮件犹如当头一盆冷水。我估计过去一两天市场的极度震荡使他们临阵退缩了，这封邮件就是给自己找台阶下。我想还是与他当面谈谈，摸清真实意图。之前，他不招自来，不辞辛苦从香港飞到上海来见我，但是此时，我居然约不到他了。我想他要么就是躲着我，要么就是为什么事情忙翻了天，总之，深发展已经不是他们的兴趣所在了。不管出于什么原因，平安就这么偃旗息鼓，音信全无了。", "看起来，这笔交易已经成了金融风暴的牺牲品。", "其实，当市场条件发生变化，交易的双方改变主意是可以理解的，我也有过这样的经历，谈好的项目，已经签了合同，还没有交割，市场风云突变，目标公司的业绩大幅度下滑，我们就不愿意交割了。一般来说，合同中都有“不可抗力”的保护：如果发生了不可抗力事件，任何一方都有权退出交易。如果还没有签合同，当然一走了之未尝不可。但好说好散，何必避而不见呢？不过我揣测，刘善学授权有限，此时见到我不知该说什么，所以就躲起来了。", "金融风暴继续蔓延，欲演欲烈。小布什政府采取紧急措施应对这场系统性灾难，联储局宣布将向保险业巨头美国国际集团提供850亿美元的紧急贷款。消息公布时，我还在从旧金山飞往香港的航班上，两个月后纾困金额达到1800亿美元。包括花旗银行、美洲银行、高盛、摩根士丹利在内的几乎所有金融巨头都处在崩溃的边缘，摇摇欲坠。随着欧美失业率的飙升，整个经济很快受到牵连，遭遇重创。金融海啸铺天盖地，很快就席卷了全球的每一个角落。然而，亚洲的银行却似中流砥柱，屹立不倒，在整个危机当中，没有读到任何一家亚洲的银行倒闭或者需要政府救助的报道。这是因为亚洲的银行从1997年亚洲金融危机中汲取了教训，充实了自己的资本金并创建了有效的风险控制系统。因此，当2008年金融危机爆发时，亚洲的银行整体防御能力足够强大，抵御了冲击，而欧美银行却没这么幸运，接二连三倒闭或靠政府救助苟延残喘。但是，亚洲的股市仍与全球股市一道遭受重创。", "中国股市在2008年一直都处于低迷状态，全球股市的暴跌进一步拖垮了中国市场，A股市值急速下滑。2007年，深发展每股股价是40多元；2008年竟然跌到个位数，10月底收盘价是8.37元，比9月9日我最后一次在上海见到刘善学时的价格暴跌超过一半。事已至此，我不抱任何幻想了，不管是平安，还是任何一家别的机构，都不会愿意按照之前的价格交易的。平安的股价跌得更凶。不到一年前，平安斥资35亿美元，收购富通（Fortis）一一家具有比利时和荷兰双重背景的金融机构—5%的股份。随后富通爆雷，于2008年9月被比利时、荷兰和卢森堡三国政府收归国有。不久之后，平安表示，投资富通账面亏损23亿美元，巨亏三分之二！踩雷的平安在股市的日子也不好过，其A股股价从2007年10月24日的历史最高点149.28元暴跌至2008年10月28日的最低点19.9元，短短一年时间股价从高点跌了87％。", "一年之间，天壤之别。截至2008年10月，道指较一年前的峰值下跌了42%。对于美国而言，股灾才刚刚开始。沪港深三地股市暴跌，较2007年创下的高位下滑了65%至72%之多。", "出人意料的是，深发展的实际运营情况比以往任何时候都更加强劲。", "2008年，总资产规模同比增长了35%，经营利润同比增长了41%。这就证实了股市未必反映上市公司的内在价值，在市场极度动荡时，两者甚至毫不相关。", "但是，对于平安或任何其他有收购意向的机构而言，深发展表现得再强劲也没有用。庞德曼常说，做投资成功取决于天上多星连珠，意思是所有的条件都成熟了，恰到好处。但是此时一切都乱了套。", "就在市场动荡不安的节骨眼上，马明哲请我到上海一聚。11月7日我们共进午餐，刘善学也在场，我们又十起深发展的话题。之前的交易方案已经不提了，我们都心知肚明，时过境迁，那个交易的基础不再。马明哲此时的想法是换股，新桥用深发展的股份换取平安保险集团的股份。马曾经建议，新桥将深发展股份出售给平安时可以选择接受现金支付，或平安股票支付。我认为这个选择权很有价值。此时，股价大跌，现金支付变得不现实—平安要支付极高的溢价，才能使我们动心，而且即便平安拿得出来这么多现金，说服自己的董事会和股东会支付这么高的溢价恐怕也不可能。考虑到深发展和平安的股价都大幅度缩水了，换股就比较实际了。就像当初宝钢建议用建行的股份换取深发展的股份，我打比方说如同用毕加索换梵高，谁都不吃亏。我深信，此时市场是超卖了，早晚还会反弹，那时再脱手换来的平安股份，也能实现价值和退氏。", "话虽如此，我还是觉得换股对新桥未必有利。我们控制深发展，可以通过自己的努力不断提高其价值，这就是我们一定要拿到控制权的初衷。如果换成平安股票，我们就成了微不足道的少数股东，不过就是搭个顺风车，即便拿到一两个董事席位，我们对于平安未来的发展能够施加的影响也微乎其微。以控股权换少数股东权益，除非溢价很高，否则不划算。而且何时市场回暖？何时新桥可以完成退出？最终实现多少价值？这些都是未知数。所以换股的概念有可取之处，但不切实际。", "马明哲的建议毕竟很有建设性，我说回去认真思考一下，看看如何优化换股框架，从而解决以上顾虑。2008年11月14日，庞德曼来沪。当时我们在上海投资的一家租赁公司失控了，虽然新桥是100%的股东，但是新桥的经营团队在更换管理层的时候处理不当，引起反弹，管理层居然夺了权，把新桥的经营团队赶出去了，甚至动了手。以并购为主的私市股权投资公司，除了投资团队之外，还有经营团队，负责投后管理，主要的职责是帮助被投公司的管理层，而不是越俎代庖。为被投公司选择最好的管理团队是经营团队的主要任务，如果认为管理层不过硬，就要换，就像我们换了深发展的第一把手一样。我虽然不赞成新桥经营团队的一些做法，但也不能眼见两、三亿美元的投资泡汤。为了解决这个危机，我跑去上海，和我的另一个同事黄德炜合作，夺回管理权。当时造反的管理层把持着经营执照和公章，自以为得计。所以我们请大老板庞德曼到上海来，面见市委书记和其他的市领导，请求政府支持。", "这个夺权和反夺权的故事很精采，在此只能一笔带过，简单说，在得到庞德曼认可之后，我自封为该公司的董事长兼首席执行官。黄德炜与我密切配合，在市政府的支持下，最终取得胜利。我们任命了新的管理层，发展了公司业务，最终新桥以近三倍的投资回报退出。既然庞德曼来沪，我就安排他去拜访马明哲，顺便参观平安的张江中心。我想让庞德曼对平安有个感官上的认识，我认为张江中心最有代表性。如果我们将来真是与平安换股，我们的合伙人必须进一步了解这家公司，光是我自己的了解还是不够的。与庞德曼同行的，还有新桥的另一位合伙人戴德时，他也是深发展的董事之一。马明哲和他的团队隆重接待庞德曼一行，马亲自当导游领着客人参观。", "我已经来过一次了，不再有新奇之感，但对于庞德曼和戴德时来说，却是大开眼界。参观完毕，我们在大会议室入座，马明哲用幻灯片辅助，详细介绍了他对平安的规划和愿景。不得不说，他的简报很打动人心。", "会后，我们移步高管餐厅，一边吃午饭，一边继续交流。这一餐吃了两个半小时。离开张江的时候，庞德曼已对换股产生了浓厚的兴趣。我也认为换股大方向可取，但之前提到的一些问题也需要一揽子解决。", "马明哲建议按照平安和深发展各自的市值等值换股。我认为，新桥所持的深发展股份应该包含控制权溢价，这 公平合理。自2006年第一次和平安接触以来，双方协商过的所有交易架构中，控制权溢价都是双方认可的，甚至不言而喻。而且，我也不愿意持有平安的普通股，因为股价波动，所以下行风险太大，当时谁知道市场还有多大下跌的空间？我们只能接受可以兜底的可转债或优先股之类。还有一个大问题就是如果深发展以换股的形式收购平安银行，以什么比例换股，如何确定两家银行的相对价值，使得双方的股民都能接受，这些都是需要解决的问题。我把思路整理了一下，用邮件与随庞德曼访沪的戴德时讨论。我在11月23日的邮件中写道：庞德曼似乎也倾向新桥与平安换股⋯•我也支持换股，不过细节条款仍需商定。我认为尽快敲定交易是有利的，因为平安银行自身发展很快（注：言外之意是如果晚了马明哲就不需要深发展了），而深发展也需要资本金。那天离开平安后援中心时，彼得（马明哲）问我，想要多少控制权溢价。我让他出价。给你一点双方打交道的历史背景：2006年10月，深发展股价在7块钱的时候，彼得愿意出价22块⋯.前不久，股价在20块左右，他出价40块。所以，我觉得只要他愿意出超过市价一倍的控股权溢价，就在公允范围之内。目前股价在10块钱左右，如果谈22块，相当于回到了2006年的水平。如果是这个价格，我是不愿意用现金出售的，因为目前市场十分低迷，深发展的市盈率仅有7倍左右。但是平安的股价同样低迷。倘若我们能换平安的证券，应该不错，市场上涨，我们手里的证券也能水涨船高。就在这封邮件中，我抛出一个可以降低风险的想法：", "至于要从平安交换什么证券，我的想法是最好拿到可在市场交易的可转债，如果不行，可转换优先股也行。无论哪一种，都应该支付合理的年息。转股价格可按当前的市值约定…如此一来，我们的退出能够实现的价值就有了托底保障，而且我们可能通过转股获得价值上行的空间………", "可转债的工作原理是，持有人可按照转股价，将债券转换为股票。如果股价上涨超过转股价，持有人就可以行使转换权，将债券转成普通股，获取价差收益；若股价等于或低于转股价格，则不必转换，而是持有到期，收取本金。总之，可转债让投资者既可以享受到股价上涨的收益，同时又规避股价下跌的风险，两全其美。", "我还考虑了其他几个交易步骤：", "此项交易的复杂之处在于，平安保险集团需要将平安银行纳入深发展而换取深发展的股份。我的想法是，应该以净资产额对净资产额计算换股的比例。这个意见以前和对方讨论过.关于深发展发新股给平安保险集团，发行价应该按现在的市价或略高于市价，既要让深发展的股民满意，也要满足平安保险集团对股权比例的要求⋯..", "其实用深发展的净资产额对平安银行的净资产额计算两个银行的相对价值，深发展可能吃亏，因为深发展的净资产额，也就是资本金不足，而平安银行资本金充足，所以深发展与平安银行相比，总资产规模的相对比例大于净资产的相对比例。但是也没有更合理而又简单的方了，为了避免扯皮，这是一个可以接受的选择。", "戴德时理解了我的全部想法，建议我把方案拿到12月8日召开的新桥投资委员会上讨论，以获得原则上的批准。给投委会的备忘录提议出售深发展股份，换取平安发行的可转债。此外，我还建议新桥直接投资平安，金额不超过15亿美元。备忘录详述通过几个步骤，使深发展和平安银行合并，而平安保险集团将持有合并后的银行实体51%至60%的股权。备忘录分析了为什么新桥应该考虑直接投入平安集团：从平安的角度看，深发展可以填补其长期战略中缺失的一环。马明哲希望为平安打造三大业务支柱一保险、财富管理和银行。通过打通后台，三大业务之间的交叉销售，将产生巨大的协同效应⋯.", "马明哲希望将平安保险集团的整个网络变成合并后银行的延伸分支行网络，将4000多万保险客户变成银行客户。根据平安的愿景，通过销售多种金融产品，平安的客户数量将在五年之内从目前的4000万增长至一亿。为达到这些目的，马明哲也希望给新桥提供入股平安的机会，因为他欣赏新桥对全球投资机会、对中国、对银行业的深入了解，希望新桥成为合作伙伴。对此，他相信平安的大股东汇丰银行会支持，或至少不会反对。", "新桥的投委会一致同意按照我提出的方案与平安协商。", "12月11日，唐开鸡、戴德时、团队的新成员黎雪蕾和我一起造访平安的张江中心。我们与马明哲、张子欣、理乍得德和刘善学共进午餐。餐后，双方展开了深入讨论。这次我们在张江足足待了6个小时。讨论期间，我提出深发展的股票作价为其市值的两倍，其中的一倍代表控股溢价，此价格的基础上，新桥以深发展股票交换成平安发行的可转债，转股价格定在平安当前股价上下。我们还详细讨论了交易框架和各个组成部分。然而，对于支付溢价购买深发展股票的提议，马明哲渥疑不定了。", "恰在此时，纽曼向董事会提出一项超乎寻常的建议：深发展应一次性核销所有不良贷款。董事会决议通过。其实，管理层对贷款分类很审慎，不良贷款拨备计提也充分，不必全部核销。然而，纽曼预计2009年及之后，市场环境或将更加严峻，深发展应借助2008年创纪录的利润，一次性将资产负债表清理干净。后来我听说，这个想法是行长萧遂宁向纽曼推荐的，看来管理层取得了共识。之所以说这个决定不同凡响，是因为核销共需140多亿元的资金，对深发展可谓巨额。仅核销不良贷款一项，就需要大约86亿元；他还要再额外计提55亿元的贷款拨备。一般来说，100%核销“次级”贷款并不需要，因为已经按照规定计提了20%的拨备。但纽曼认为，此举将使不良贷款拨备覆盖率超过100%，让深发展成为中国资产负债表最干净的银行。最终，拨备覆盖金额增加至70多亿元。核销和拨备将深发展2008年利润几乎用罄，只剩下6亿元。此举异常大胆，因为盈利变得如此微薄可能会对股价造成压力，因此负面影响我们和平安的谈判。深发展在纽曼的管理之下，不良贷款率从2004年公布的11.4%（实际不良贷款率远高于这个数字）降低到2007年的5.6%。新桥入主深发展后，实施了新的、更加严格的风险控制系统，新发放的贷款质量很高，新增不良贷款率几乎可以忽略不计。促使深发展和纽曼全部核销不良贷款的原因是2008年银监会发布的新规，要求银行逐步将不良贷款拨备覆盖率提高至不低于150%。拨备覆盖率指准备金与不良贷款余额的比率。如此一来，保留不良贷款的成本会远高于核销的成本。我曾询问过银监会主席刘明康，为何要规定如此严苛的拨备覆盖率。一般而言，100%的覆盖率到顶了，因为一个坏账最多是100%损失掉嘛，何必再超出50%？他说，他不大相信银行公布的不良率，认为大量被划分为“关注”类的贷款最终都会变成“次级”类或分类等级更低的贷款（次级类或以下一可疑类和损失类一都统称为不良贷款）。超额拨备的要求会迫使银行核销不良，改善资产负债表，反过来又会促进整个银行体系的健康发展。我想，这个新监管规定是银监会能够采取的最有效手段以降低银行的不良率，在深发展身上充分体现出来。尽管银监会的新规促使深发展痛下决心，清理资产负债表，但对不良贷款一锅端是不必要的，也不是新规的要求。深发展完全可以按部就班，逐步核销和增加拨备。这样财务报表上的利润就会好看得多。但是纽曼认为，此时深发展终于有资本清除垃圾，此时不做，更待何时？仅去年一年，拨备前及税前的利润超过80亿元，增长了41%。对于一锅端的建议，新桥的团队举双手赞成，因为我们相信明智的战略投资者，也就是潜在的买家，就像我们一样，不会只看短期利润，而会更关注银行的资产质量和长期增长的潜力。纽曼在2021年11月1日（我当时在写本书的英文版）回复我的邮件中剖露了当时做决策的心路历程：核销不良贷款，我当时毫不疑虑。2008年末，银监会已经做了相关政策吹风会，表示不良贷款拨备覆盖率要求将会不断提高，可能会直奔200%以上。最终，银行业的不良覆盖率的标准确实达到甚至超过200%，虽然各个银行的分类严格程度不同。银监会还鼓励银行在年底前清空不良贷款。", "对深发展的长远发展来说，拨备覆盖率会是熬来欲重的负担。从以上两个方面考虑，现在就是刮骨疗毒的绝佳机会。截至2007年末，深发展不良贷款余额大约为125亿元，贷款损失准备金为60亿元左右，2007年贷款拨备金计提约20亿元（在贷款损失准备金之上）。但125亿元乘以200%（注：指最终行业达到的拨备覆盖率）就是250亿元！拨备覆盖率要求不断提高意味着，未来数年内，除了损失准备金外，我们还需要从利润中额外计提150到200亿元的拨备金。", "这样一算，结果很清楚：200%的拨备覆盖率意味着，每一元不良贷款将会占用两元的利润。这就意味着，如果我们能核销100亿元的不良贷款，深发展就能省下100亿元的利润。所以我们就如此做了。", "2008年底，我们核销了约100亿元不良贷款，还剩余约20亿元风险最低的不良贷款，按150%到200%的覆盖率要求来算，大约需要30亿至40亿元拨备金，而此前我们已经计提了20亿元的拨备。", "另一方面，核销不良还会带来其他无形的好处。过高的不良率就像悬在深发展头顶的一团乌云，在银监会、投资者和公众眼中，“深发展就是一家有严重信用问题的银行”。借此机会，如果能将深发展从乌云下拉出来，置于阳光之下，它就能成为中国最优秀、资产负债表最健康的银行之一。这将给深发展带来巨大的好处，而且还能带来有形的、源源不断的利润。根据我们的测算，我相信深发展一定可以步出乌云笼罩。", "事实证明，纽曼的想法完全正确。来年，即2009年，深发展的利润和资本金增长非常强劲，资本充足率创多年以来的新高，跻身于中国资产负债表最优的大型银行之列。", "12月19日，我与平安的杰克逊和刘善学在香港会面。我告诉他们，深发展决定一笔勾销绝大部分不良贷款，这样一来，年度财务报表所报告的利润会所剩无几。我知道，杰克逊是经验丰富的银行家，他一定会赞赏清除不良的计划。但我也看得出来，核销的力度之大，让他们略感震惊，也让他们犯嘀咕，此举会对深发展的股价造成多大的压力？如果股价暴跌，会使我们之间的交易变得更为复杂。我倒是一点儿也不担心。为了深发展的长期健康和增长，我们在做正确的事情。此外，我感觉平安短期内还未做好推进交易的准备，在深发展股票溢价问题上，双方还远未达成一致。平安曾不止一次表示，对深发展尽调完成后，他们可能重新考虑作价。在我看来，他们这么说的潜台词就是，考虑到深发展比较高的不良率，平安有理由继续讨价还价。此时深发展一次过清理门户之后，他们没有砍价的借口了。当然，如果深发展股价跌到谷底，也会增加双方达成交易的难度。", "果不其然，深发展的不良核销计划让平安方面相当担忧。12月23日，我在深圳和马明哲见面。他说，平安的资本市场部担心，如此大幅计提以及核销会在未来一段时间内使深发展股价承压。他此前曾表示过，对于新桥所持的深发展股，可以考虑60%至100%的溢价，但现在他连60%也不愿意考虑了，而是建议等深入尽调之后，再谈价格。", "我认为这样做根本行不通。深发展和平安都是上市公司，如果要尽调，双方都要事先公告。假如连价格都没有谈拢，最后达不成交易的风险极大。如果平安经过调查之后扬长而去，那么市场一定假设他们看出了什么不得了的问题，那么深发展的声誉就会严重受损。而且，在达成基本协议之前，新桥也不愿意大张旗鼓地对平安做尽调，因为白费工夫和资源的风险太大。由于盈利可观，迭加2007年认股权证行权带来的资本注入，深发展2008年的资本充足率已经到达8.6%。但银监会对资本充足率的要求更严格了，从之前的8%提至10%或以上。银监会希望深发展通过增发补充资本金。如果与平安成交，增发的问题就迎刃而解了，但在当下只好搁置。我在马明哲的办公室逗留了两个半小时，之后驱车回香港。第二天就是平安夜了。车到中环时，我看到所有的高楼大厦装饰的红绿相间的圣诞彩灯都大放光彩，四处洋溢着欢乐气氛，伴随着圣诞赞歌的音乐。但此时，与平安交易的希望之火却暗淡了。当晚，我给新桥合伙人写了一封邮件，结论是：“至少，短期内与平安成交无望。”"], "wcount": 11132}, {"icon": "22", "title": "第二十二章 春江水暖", "paras": ["世界在一片惨淡中迎来了2008年圣诞节。无数投资者、消费者、上班族和他们的家人遭受了全球经济危机的重创。欧美许多大型金融机构倒闭，个人破产的数字和失业率双双飙升。尽管欧美各国政府实施了前所未有的救助，向市场注资数万亿美元，西方银行仍深陷困境。", "在远离风暴中心的亚洲，情况略好一些。中国2008年经济增长率达到了傲人的9%，不过也是七年来新低，且第四季度年化增长率只有6.8%，处于十年来最严重的经济减速阶段。中国股市熊气弥漫。没人知道前景如何，何时才能否极泰来。投资者和政策制定者都在探究危机的成因，寻找重振经济的对策。", "我和女儿一起前往加拿大滑雪胜地惠斯勒（Whistler） 度假。我尽量将工作抛在脑后，但有时仍在滑雪缆车上查看手机。我反思危机中戏剧性的事件，写了几篇评论文章，整理和分享见解。其中一篇题为《首尔银行业危机的解决方案》（The Seoul Solution to the Banking Crisis），发表在《华尔街日报》上。标题是报纸编辑起的，用了巧妙的双关语，根本无法翻译成中文：Seoul（首尔）与sole同音，后者是独一无二的意思，既隐喻十年前亚洲金融危机期间新桥在韩国银行体系重组中的作用，也暗指眼下危机的唯一解决方案。我在文中解释说，新桥在收购韩一银行的过程中，创造了一种处置不良资产的方法，最终对投资者和政府都是最有利的，此时美国政府接手了大量不良资产，可以考虑用相同的办法处理。", "我的文章文章开宗明义叙述了美国金融体系面临的灾难和政府所处的困境：面对现实吧，美国金融体系基本上已破产。美国政府已代表纳税人承诺向金融机构提供7万多亿美元的注资和担保。美国财政部长蒂莫西.盖特纳（Timothy Geithner）周二表示，政府将再向“公私投资基金”《Public-Private Investment Fund）投入1万亿美元，用于收购银行不良资产。但问题在于，不是银行不想卖不良贷款，而是不知如何作价，因为不良资产的市场交易寥寥无几，缺少流动性。怎么办？我介绍了十年前新桥在韩国的发明。我们在收购韩一银行时，历史遗留资产中产生的损失是政府的责任，但是如何计算损失却是个几乎无解的难题。按理说，如果不良资产可以在市场中买卖，自然就会发现公允价格，问题是：由于市场缺乏不良资产的买卖，也就是基本上没有市场，我们意识到短期内无法确定不良资产的公允价值。因此，双方同意未来用“买或卖”的选择权方式确定资产价值。具体来说，在未来的三年里，每到周年左右，韩一银行对历史遗留资产报价，政府可选择接受，而支付原值和现值之间的差价；或者，如果政府方面认为韩一银行把资产作价太低，因此要支付的差价太高，政府有权按原值收购该资产，之后在市场上处置，也许可以获得更高的价格，从而减少损失。", "按照这个安排，在新桥收购之时，不必与政府扯皮如何对遗留资产作价。因为那时如果真要定价的话，价格一定非常低，政府需要拿出的钱就会非常多。当时新桥几乎全盘接收了历史遗留资产，而用“买或卖”的方式，在未来的三年内处置。随着时间的推移，新桥可以搞清这些资产的真正价值，而且资产的质量可能随着经济复苏而改善，这样政府需要承担的不良资产损失就最小化了。在文章结尾处，我建议美国政府用同样的方法向投资者出售不良资产，使价值最大化。而投资者因为在若干年内有权得到补偿，所以也不承担风险。这种方法既能节省纳税人的钱，又能鼓励投资者帮助清理银行资产负债表。2009年1月7日下午，我刚从上海飞抵香港，就收到了马明哲发来的邮件，约我通电话。我预料他会找我。尽管双方对深发展股份的定价分歧比较大，但我知道他是不会轻易放弃的，起码要再试一试。马说，他已和副市长陈应春谈过，陈支持这笔交易。“我还没和团队谈过”，他说，“但我想知道，双方能否各让一步？”“您怎么想？”我问。“我们无法接受100%溢价。你能否接受，在今天的市价上加80%，也就是每股18元？”我那时还没看到当天的收盘价，马上查了查，发现已从前一天的10.30元跌到了9.90元。我没有直接回答他的问题，只是说：既然我们在谈换股，就不只是深发展的股价，还要确定平安的股价，这样才能确立两只股票的相对价值。甜在煎提H灵柔来的剁慢价如暴肆婆贷森鹿的那废熟权人及枣乐展！", "我们就能弥合差距”，我建议道。", "“我们需要同时确定两个价格，即确定两只股票的交换比率。”我举了个例子。2008年9月，巴菲特 （Warren Buffett） 向高盛投资50亿美元，购买了年股息率10%的优先股和认股权证。借助认股权证，巴菲特可按比公告前一天高盛收盘价低8%的价格，将优先股转成普通股。巴菲特持有的优先股和可转债类似。我想让马明哲了解的是，巴菲特那笔交易的转股价低于股票市价。巴菲特的是市场先例，可以参考。", "马明哲似乎已经猜到了我的心思，说：“我的团队希望转股价是一段时间内市价的均值。”我觉得可行，因为平安股价已从前一年低点持续上扬，无论是一个月还是两个月的均值都低于当前市价。如果平安方肯让我方选择计算平均价的时间段，双方或许能弥合差距。", "“我们先研究一下，看看多长的时间段对我方最有利”，我说。“除了巴菲特投资高盛这个案例外，我们还会研究一些可转债定价的市场先例。”我知道市场先例对马很有用，他需要用先例来说服自己的团队、董事会和股东。对于定价，他最关心的还是市场反应，因为平安的声誉因富通（Fortis）投资失利而受损，所以他必须格外小心。关于他之前建议的新桥对平安的额外投资，他已不再感兴趣。他说，平安不缺钱，而且两笔交易一指换股和额外投资一捆绑起来过于复杂，不利于监管审批。我表示理解，但建议他先不急于关门，新桥看重平安的市场优势，希望成为平安的长期合作伙伴，可以等到深发展交易完成后再考虑投资平安。", "当天，我给合伙人发了一封邮件，给出这样的结论：“我认为马明哲的提议很接近我们的要求。如果可转债的转股价等于或接近股票市价，那么无论有没有一点利息，这笔交易都值得考虑，当然前提是对平安的尽调结果满意。”我当时设想，如果要拿平安的可转债，必须先对它做尽调。", "次日，即1月8日，马明哲和我又谈了一次。他说可以接受一个月或两个月平均价中敦低者为可转债的转股价。当时，一个月的均价比平安1月7日收盘价低约9%，而两个月的均价则低20%。平安股的市价在1月8日当日又下跌了6.5%。重要的是，马愿意在转股价上给我们折扣。他补充说，希望可转债的票面年利率不超过1%。“只有当深发展股票的市价保持在每股10元以上，我们才会同意定价18元”，他说，“否则平安最多只能给你们80%溢价。”这点可以理解。为了自己的股东的利益，他不能接受太高的溢价。我告诉他，下周深发展将宣布对不良核销与特别拨备的消息，届时深发展股价不知会受到怎样的影响，最好等到尘埃落定之后双方再谈。马说，平安在市场上持续收购深发展的股票，此时已经掌握5%的股份，可惜已经顶到监管允许的上限。“否则我们会继续买入，支撑深发展股价。”他说，“不管怎么说，我先在内部争取共识吧。”马明哲或许已准备就绪，但新桥这边有的合伙人却态度游移了。布朗姆看了我的报告后，回复道：", "“我认为首要问题就是单（伟建）上次提到的：现在是否是出售深发展的时机？当前股价比我们几个月前的心理价位低70%。我相信，法兰克《纽曼）改造深发展成就出色。随着美国、欧洲、中国、印度甚至连不丹都财政政策放水，未来一两年新增的流动性有5万多亿美元之巨。我们在经历这么多曲折之后，最不该做的就是过早脱手深发展。”庞德曼表示附和：“我看了布朗姆对深发展的意见。如果还不太晚的话，应该慎重考虑是否应该现在就卖。”", "马明哲在1月13日晚上打来电话。他注意到，当天深发展宣布大规模核销与拨备后，股价颇为坚挺，所以想继续推动交易。他仍希望以每股18元收购深发展股份，并提议平安可转债的转股价等于平安股票的10至30个交易日平均价，在这个区间内，以对新桥最有利的数为准。可转债的票面年利率则定为1%。我告诉他，新桥还没做决定下一步怎么走。因为我知道，布朗姆和庞德曼还没有打定主意是否卖。不过我说会在美国参加新桥年会的时候跟合伙人讨论他的提议。马则请我在出发前和平安的总经理张子欣见一面，一起过一下交易的基本框架。头年11月份，美国总统大选产生了第一位非洲裔总统一奥巴马（BarackObama），他的就职典礼在2009年1月20日举行。布朗姆的太太是美国的参议员，担任奥巴马就职典礼主席，给我弄了两张票。我就带着正在美国上学的儿子去参加。那天，华盛顿特区晴空万里，阳光灿烂，但冷得出奇。国家广场人山人海。我们坐的位置显然是贵宝区，就在宣誓就职的国会山大阳台下面不远的地方。坐在我们身旁的是几个大名人，包括主持电视节目的奥普拉. 温弗瑞（Oprah Winfrey）、黑人领袖杰西.", "杰克逊（Jesse Jackson）、演员丹泽尔.华盛顿（DenzelWashington）等。我一直东张西望，但没有认出就坐在身边的名演员丹泽尔.华盛顿，直到回家后，妻子从我拍的照片中认出了他。他留着浓密胡须，一点也不像电影中的样子。妻子责怪我错过了和他打招呼的好机会。", "“你怎么会认不出他？！”她质问我，觉得不可思议。她是他的影迷，其实我也很欣赏他的演技。“他也没认出我呀”，我开玩笑说。闻言，她差点被食物噎到。", "次日，和儿子分道扬镳，他回去上学，我则飞往旧金山。", "1月22日，新桥合伙人在TPG位于加利福尼亚大道（California Avenue）的办公室开会，讨论平安的最新提议。除了庞德曼、布朗姆、唐开罗之外，亚洲的同事通过电话接进会场。那时新桥已与TPG合并，所以TPG的联合创办人吉姆. 科尔特（Jim Coulter） 和首席投资官乔纳森．科斯雷特（Jonathan Coslet） 等也在场。纽曼打电话接通现场。我详细介绍了与马明哲商讨的交易方案，力陈它是值得考虑的。我解释说，按照这个交易架构，新桥将以深发展的股份换取平安的可转债，交换的比例会反映出深发展的溢价。交换之后，如果市场回暖，平安股价上涨，我们可以获取进一步升值的好处；如果股价持续不振或下跌，我们可以在可转债到期时赎回本金，即账面值，以及利息，也是很好的回报，不会有下行风险。因为深发展和平安都是中国的金融机构，所以两只股的股价走势有较强的正相关性，往往同步涨跌。所以拿着平安的证券或深发展的股票，升值的潜力都差不多。经过两小时商议，我们达成了共识，我获准继续推进与平安的交易。", "当全球其他地方的股市持续下行时，中国股市开始回暖。2月9日，我在深圳与张子欣及杰克逊会面时，深发展股价已自年初飙涨了40%多。平安股票分别在上海的A股市场和香港的H股市场挂牌交易。因为H股的流动性远高于A股，所以我要求H股的可转债。而对于平安，A股或H股没有区别。", "我和同事黎雪蕾在深圳的平安总部与张子欣及杰克逊谈了整整一天，但无结果。他们希望对深发展股票收购价设置18元的上限，而不再考虑先前提出的80%溢价。我觉得那个价格只有在深发展股价处于10元左右时合理，而此时股价已达13.75元。平安股价也已大幅走高。新桥如果接受18元这个上限，那么不仅手中深发展股票的名义溢价将减少约30%，还必须为平安股票支付溢价。我主张两只股票的相对价值不能改变，随着市场的涨落，一荣俱荣，一损俱损。我说，除非对平安可转债的转股价也设置上限，否则对深发展股价设置上限是不合理的。张子欣告诉我，中金公司和高盛（都是平安的财务顾问）都说，监管不大可能批准平安发行可转债。他说如果新桥一定要，平安会努力争取获批。我说不必了。如果平安的财务顾问都认为可能性不大，新桥就没必要坚持，否则双方都会面临监管审批的不确定性。杰克逊建议再重新考虑某种形式的沽权。", "我说，光是沽权还不够。可转债包含两个性质：", "其一是债券，保护持有者的下行风险；", "其二是股权性质，如果股价涨了，持有者可以转股获得升值。", "而沽权是“看跌期权”，只相当于可转债所包含的债券性质，还要加上一个“看涨期权”一购买平安股票的期权，才能等同于可转债。中金公司认为这些结构太复杂了，提议干脆简单换股，新桥将深发展股票换成平安的普通股，这样最省事。省事不假，但价值效果不同，因此我没有同意。", "虽然那一天没有形成一致意见，但双方都没有气馁，同意继续探讨。", "3月4日，一支由TPG新桥合伙人组成的代表团抵达平安的张江中心，团员包括布朗姆、吉姆.科尔特、乔纳森.科斯雷特、戴德时等人。这次访问是我与马明哲协调的。他本来在北京参加全国人大会议，特意提前回来接待我们，以示隆重。这是我六个月来第四次踏足张江中心，感觉熟门熟路，可以当导游了。", "上午参观，之后在董事会议室与马明哲、张子欣、杰克逊等人开会，接着共进午餐。马明哲再次热情洋溢地谈起他的愿景、战略、运营和信念。我觉得他处于最佳状态，无疑给客人留下了深刻印象。我们对交易仅慬点到即止，马说想再探探可转债这条路。此行令几位同事叹为观止，这不懂是马明哲所期待的，也是我想要的结果。我希望同事像我一样认可马明哲和平安，支持与平安的交易。此前，他们对平安的认识都基于内部备忘录和讨论，虽然不错，但不够具体、直观。实地走访后就不一样了，大家都相信平安是家优质公司，不仅是个很好的交易方，也是个可以考虑投资的对象。我始料未及的是，我的同事们本来不紧不慢，瞻前顾后，此时都急于和马明哲成交，有的还质疑谈判为什么不能进展更快一些，似乎在埋怨我效率不高。", "我早就认为平安是个难得的合作伙伴，但是双方对交易条件始终没有敲定，或者敲定之后又推翻了。好事多磨吧。我在3月又和马明哲见了几次面，试图取得进展，但无论是定价还是交易以获得监管批准。我们自己做了一些调查，了解到H股公司发行可转债虽然不易，但有先例可循。我仍然认为把深发展的股份转换成平安的可转债是最佳选择。终于，张子欣和胡祖六约见我，说，经过反复商讨并请教了监管部门之后，他们认为可转债的方案可行。但张子欣表示，要么采用可转债而不固定换股比率，要么直接换股而不采用可转债。可我想要的，是既采用可转债，又固定换股比率。双方都明白对方的要求，但继续各执一词。新桥这边，有些合伙人认为平安支付的对价应包括部分现金，而不都是看市场趋势，此时股市明显超卖，未来深发展和平安股价肯定会进一步强劲反弹，如果此时套现离场，就会错失股价反弹带来的升值。还有一位同事认为，没有不透风的墙，市场可能已经耳闻我们在与平安谈判，所以深发展市价已包含平安收购的期待值，如果谈不成，泡沫就会爆掉。因此他温和地催促我，早点和平安达成协议。我并不认为有所谓泡沫问题，因为当时全球股市都在从2008年的低谷反弹，尤以银行和保险公司的股票最为强劲。我也想尽快与平安谈成，但并非因为担心股价再次下探，恰恰相反，我怕股价上涨太多了，阻碍双方交易中的一个重要部分，就是深发展向平安增发。如果增发的价钱太高，平安可能却步，缺了这一块，平安就很难达到持股的目标。", "不管怎么说，我们都有强烈愿望，但一个巴掌拍不响，如果平安在几个关键的问题上无法满足我方的底线，我们只能等待。面对新桥内部的种种分歧与质疑，我颇感掣肘。几位新桥合伙人已认识马明哲和他的手下大将，所以出现了平行沟通的管道，试探想法，实际等于传达我们内部不一致的信号。我认为谈判必须只有一个声音，所以对方 不会去揣摩我们的“真正的立场”。面对人多嘴杂的情况，我决定先躲在一边旁观一阵，看看其他人能搞出什么名堂来。我知道我们内部没人比我更了解情况。交易的环节很多，错综复杂，因为我与平安方已经尝试过各种可能性，所以我碰壁之处他们也未必能够找到出路。", "接下来的一个月，我和团队工作的重点是内部沟通。我们写备忘录，让其他合伙人了解与平安谈判的背景，以便在内部达成共识。这段期间，我没有与马明哲联系。", "4月14日，新桥在旧金山开内部会。我打印出五份文件给与会者，其中包括各种方案的对比、备忘录、新的条款清单，等等。文件成堆或太冗长都可能使读者只见树木而不见树林。庞德曼的本事就是能够删繁就简，抓住要害。他问问题也一针见血，直奔主题。有时候，如果一个备忘录啰里啰嗦，读了半天不得要领，他就会问：“交易的核心是什么（What's the deal）？”。后来TPG内部创建了一个制长检酒妥投实否品会萧关的材料下高定名为的B！在迭“应德上，必须列出交易的基本要点、关键问题、利弊分析，以及要求投委会做出什么决定。", "后来我离开TPG，创立了太盟的私市股权业务，我们内部报告或备忘录，也要求有一页纸的总结，称之为“一页纸”（One Pager），与TPG的BUS有异曲同工之妙，使读者对内容一目了然。", "我还专门撰写了一个写备忘录的指南，引用法国哲学家帕斯科耳（Blaise Pascal）的一句话：“假如我有时间，我的信就会短一些。”言简意赅是要花时间思考的，否则写出来的文章难免啰嗦。", "写《西行漫记》的斯诺曾经观察到，中国的作家写文章都啰嗦，他猜测这是因为出版社按照字数付稿费所导致的。他比较欣赏鲁迅的短文，确实像七首，短小锋利，直击要庞德曼看到我分发的那堆文件后，要求我提供一个基本条款清单。", "4月16日，庞德曼向所有合伙人发送了一封邮件。“单（伟建）在我的要求下整理了一份简短的‘基本条款清单’”，", "他写道。“请大家评议。”", "那份清单是这样写的：", "平安发行可转债，可转成平安H股 3年到期 持有者可于一周年后的任何时间赎回（注：即持有者有权要求平安以现金支付可转债本金） 息票（利率）基本上等于平安H普通股的股息支付率 转股价将为签约前平安H股一周的交易平均价 交易前提条件：无前提条件，但新桥会尽力促使深发展根据自身资本需求，按法规允许的最大限度，向平安定向增发股票 新桥所持深发展股票的定价：签约日之前深发展股的一周平均价加上【50%】溢价（注：方括号的意思是还要谈判）我写上50%的溢价，而不是马明哲之前曾经建议而我们一直坚持的80%，是因为我需要从委员会获得谈判的余地，该妥协时就不必再请示委员会了。当然如果谈判的最终结果高于50%，谁都不会有意见。 4月20日，我返回香港，新桥召开内部电话会议，一番讨论之后，大家都同意我的方案。当天我约了马明哲在深圳会面，在他的办公室边吃盒饭边谈。他告诉我，高盛团队制定了一个计划，平安将在股市上公开要约收购深发展的全部股份，将深发展下市。虽然私有化在海外股市屡见不鲜，但据我所知，中国内地尚无先例，我担心复杂性会导致整个交易失败。为确保成功，我认为交易应尽可能简单。", "我向马介绍了新桥收购深发展的经验。那时，收购成功得益于不少政策上的突破，包括允许外资控制中国的一家商业银行，持有A股上市公司的法人股，等等。那时既无先例，也无章可循，所以深圳市政府和新桥别无选择，只能要求特批，最后是国务院领导批准的。当然做游说工作的是市政府，如果只是新桥作为外资寻求政策突破，很难成功。", "“可是今天”，我说，“我们双方都希望交易顺利完成。任何需要特批的都有极大的不确定性。”在A股市场上将一个上市公司私有化，前所未有，我无法想象审批过程会有多复杂。所以我认为，“我们只有在既定法规框架内设计交易，才能确保批准。J马明哲立刻表示同意。对监管审批的困难，他比我更有体会。", "“所见略同”，他说，“我也担心这个问题。如果交易突破常规，监管审批上不确定性太大。”我俩当即约定，设计交易结构遵循两个原则，一个是不需要政策上的突破，另一个是市场上已有先例可循。这样我们可以用最短的路径和最少的时间完成交易。", "到了2009年5月初，深发展股价已升至17.90元，比年初上涨89%，比两个月前上涨22%。相比之下，平安H股走势平平。市况显然对新桥有利。如果说几个月前，平安须在深发展股价上加一个较高溢价才能满足新桥的心理价位，那么此时不需要很高的溢价了。我认为与平安达成交易的时机已成熟，于是约马明哲见面。", "5月12日，我在马的办公室和他逐条讨论交易结构，我根据的就是新桥投委会批准的基本条款清单。他只是建议了几处微调。再一次，双方很接近了。", "当晚，我给马发了一封邮件，总结并确认讨论的内容。我写道：“深发展股票定价要么按每股20元，要么按双方约定的溢价率计算，以孰高为准。”", "令我惊讶的是，马的答复颇为淡漠，不置可否：“感谢。我会把你的方案转给平安同事研究。”", "显然，他不愿意确定我们达成了共识，因此共识也就不存在了。我不知道平安方面又出了什么问题，总之没了动静。好像一切又变得扑朔迷离。"], "wcount": 8302}, {"icon": "23", "title": "第二十三章 时不我待", "paras": ["转机来的比我想象的快得多。2009年5月14日，也就是我和马明哲通邮件的两天后，我开车上班经过香港仔隧道，就在此时，电话铃响了，我稍微放慢车速，接起电话。马明哲噼头就问，“伟建，你们在接触其他买家吗？”“谁告诉你的？”我反问，并没有回答他的问题。事实上，我们并没有接触任何其他买家，但让他感到一些压力，对我们当然不是坏事。", "原来，他听保监会的一位领导说，中国人寿和中国人民保险公司在和新桥谈判收购深发展。人寿和人保是两大国有保险公司，平安的竞争对手。马问我能否不要与那两家谈。", "其实，他这一问，我才知道人寿和人保对深发展有兴趣。他们选择的路径与平安不同。平安与新桥直接接触，但人寿和人保先去找监管机构求得认可。到此时为止，这两家都没有与我们接触过。", "但听说有竞争对手，马明哲有些着急。", "对于他要求我们不要与其他买家接触，我未置可否。因为这事儿压根儿就不存在，我也没必要澄清。我说，我们会优先考虑平安，但也不能一直等下去。“要不就这几天，双方努把力，尽快达成协议，怎么样？”我问他。不等他回答，我接着说：“咱们以下周五为截止日，干得成就干，干不成就拉倒，怎么样？”下周五是5月22日，离此时还有八天。", "我当然不想拉倒，但是我想给平安一些压力，有了限期，动力就大了。", "当然，对我们也是压力。", "马明哲同意了。", "在作价问题上，我们与平安仍存在不小分歧。我知道，马明哲虽然很倚重团队，但必要时，可以乾坤独断，也能说服他的团队。在新桥方面，我基本上可以说了算，因为内部的底线我完全清楚，所以可以先斩后奏。我感到，达成最终协议的时机成熟了。有了竞争的威胁，马明哲雷厉风行。和他通话后不到一小时，高盛的胡祖六和黄匡杰等一行就出现在新桥的办公室。他们之前的想法是让平安将深发展私有化下市。我花了两个小时，和他们分析，为什么这个方案不切实际，尤其监管审批的不确定性。然后我建议，还是采纳我在几天前和马明哲讨论过的基本框架，其中包括三个步骤，但未必按照这个顺序：", "1， 平安收购新桥所持的深发展股份； 2， 深发展对平安增发新股，相当于20%的股权； 3， 深发展通过换股，合并平安银行。 此时我认为，我之前力争的可转债方案也有风险。我们要求的是H股的可转债，因为如果转换之后在香港市场套现几乎没有障碍。但H股可转债的发行虽然有先例，审批过程很复杂，能否批准，需要多少时间都无法判断。所以此时我想换一个结构，行可转债之实，而无可转债之形，这样毋须特批。", "会后，我把胡祖六拉到一旁，感谢他和平安团队同意可转债的交易框架，并花费了大量时间和精力研究可行性。但此时，我认为最好在不改变交易实质的情况下，修改交易框架，以避免审批过程带来的不确定性。我建议由平安给新桥一个选择权：或者收取现金，或者收取平安的H股票。实际上，对于新桥来说，这个选择权与可转债并无二致，但形式上不叫可转债，也就不需要专门的监管审批了。胡祖六马上就明白了，也认为这个方案可行。我们说好下周一前往深圳，与马明哲及其高管团队见面，把交易落实下来。从5月17日起，连续四天，我和胡祖六及其同事每天都在沟通，希望敲定交易的所有细节。我时而感觉快成了，时而又觉得无把握。但很快，一个新的交易框架，基本按照我的思路逐渐成形了：平安向新桥发出一个不可撤销的要约，收购新桥手中的深发展股份；新桥可以在一定时间内选择接受现金或平安保险集团的H股票。如果是现金，其总量等值于深发展某个时间段内股票均价加上60%的溢价，称之为“现金对价”；如果是平安H股，其股票总值则与现金值相等，再换算成一定数量的股票，称之为“股票对价”。有了这个选择权，当平安H股价上涨超过现金对价时，我们就会选择拿股票对价，再到市场上去套现。如果平安H股价表现不好，股票对价徘徊在现金对价之下，我们就选择现金对价。因此，在这个交易框架下，现金对价就是底价，倘若平安的H股股价上涨，股票对价超过现金对价，我们则获利更多。我建议新桥的行权期为锁定期之后的24个月。在行权期内，我们可以观察平安H股的表现，最终决定是拿现金还是股票。", "周二晚上，我接到胡祖六的电话。他说，平安团队花了一整天审查和讨论了所有条款。对于我提出的24个月的行权期，对方的反建议是减半为12个月。一个选择权或期权，行权期越长价值就越高。我觉得12个月也是可以考虑的。此时是股市波动时期，不知道平安的H股可以稳定在什么价位，而在12个月当中，应该稳定下来了。但我只退了半步，要求18个月。", "对方答应了。此外，平安也同意用1.65股深发展股票交换1股平安的H股一而这正是根据我此前提出的换股公式计算出来的。我曾提议现金对价比股票对价有个10%的折让，但胡祖六说马明哲要求更大的折让。", "我没有同意。我可以妥协，但此时还不是时候，谁知平安方面还会提出什么要求，我需要留一手，以便必要的时候和对方交换所需要的东西。双方将换股比例定在1.65，相当于深发展股票可以按照每股28元交换成平安H股，而当日深发展收盘价为每股17.89元，换股比例隐含的深发展溢价为56％。", "次晨，我正在参加一个电话会议，胡祖六来电。他说，平安不接受1.65的换股比例了，但愿意将深发展股票的定价设置在22元到26元之间。我没有同意，因为这样意味着没有固定的换股比例。", "我觉得还是必须努力打破僵局。为清晰起见，我给胡祖六写了一封邮件，表明我方的立场。我做了些许让步。平安要求将深发展每股的现金对价定在22到26元区间，我可以接受下限，即不低于22元，但我坚持1.65的换股比例。这是什么意思呢？我当然希望现金对价越高越好，但我认为，按照平安股票的上升趋势，未来大概率我们会选择平安的股票而非现金，所以获得更多的平安股更为重要。我如果在现金对价上做个让步，但坚持换股比例，就可以确保股票对价最大化。如果深发展和平安两股的相对价值是1.65，股票对价相当于深发展每股28元左右，已经比每股22元的现金对价高出大约27%。而如果未来平安股价继续上涨，我们还有升值空间。", "晚饭前，胡祖六再次来电，说已经考虑了我邮件中的提议，平安方面再次做了评估。此时，他有一个反建议，需要我们做出大幅让步。平安方面要求在计算股票对价时，隐含的深发展股价在每股26元封顶。我之前计算出来的数字是每股28元，两者之间相差不多，我就接受了。这下我觉得差不多了。我还没有向新桥内部的任何人报告谈判的近况。", "庞德曼正在欧洲度假，我给他发了一封邮件，让他给我打电话。之后，我又给唐开罗发了一封邮件，通报最新的进展。虽然我在谈判过程中一直与他保持联系，但我需要请他检查一下基本成形的交易方案，确保我没有重大的疏漏。在谈判特别紧张的时候陷得太深，很容易顾此失彼，需要旁观者提醒。正所谓旁观者清，当局者迷。", "唐开罗思维敏锐，我忽略的，他可以捕捉到。我在邮件中，也添加了一些双方你来我往的色彩，供他参考：我与平安进行了十分深入细致的讨论。我听说，他们内部讨论时，有人发了脾气，甚至摔了杯子（我不知道为什么）。无论怎样，我想谈的差不多了，交易框架基本和我对你说过的差不多，但有些调整。双方对估值和换股比例达成一致如果一切顺利的话，再过一天，我们和平安就可以在重大议题上达成一致。实际上，我们已经达成一致了，但我需要看到书面文字，才能真正确定…庞德曼在5月21日给我回了电话。当时我正在中银大厦主持中银香港稽核委员会的会议，我从会议室的后门走出来接电话。", "“戴维，我想我们谈成了。”我说，“不再用可转债，而是给我们一个选择权，新桥可以在18个月之内选择现金支付，或平安H股支付。”", "我简单解释了定价的机制以及其他交易细节。我一边讲电话一边在中银香港大会议室后面狭窄的走廊中来回踱步，但两三分钟就说完了。庞德曼没有说话，静默了几秒钟一让我感觉是漫长的几秒，然后说：", "“可行。”接着又补充道：“了结了它。”随即挂线了。", "庞德曼就是这种风格，无论问题多复杂，他都可以立即理解，当机立断，母须我费口舌。而且，他言简意赅，没有废话。和别人通电话，我都事先留出时间，但我可以和他随时通电话，因为我知道他不会啰嗦，直来直去，几分钟就谈完了。我欣赏他的风格，跟我很合拍。刚刚得到庞德曼的认可，胡祖六又来电了，提出一系列新问题。他说，按5月20日平安和深发展两个股的市价计算，换股比率1.65意味着深发展溢价59%。因为定价日要拖到双方正式签约之日，而两个股票的价格在其间还会波动，没有人可以预测那时深发展的溢价会是多少。张子欣要求对隐含溢价设一个60%上限，这意味着换股比率可能高于1.65，即一股平安股票可能换超过1.65深发展股。我不同意这个新条件，给他们一个反建议：如果那时深发展的隐含溢价超过60%，平安有权退出交易。但我不能同意为了将溢价控制在60%内而自动调整换股比率。", "此时，双方的谈判都是经过胡祖六，你来我往是他在中间传递讯息。仅围绕这个问题，他就折腾了24个小时，但毫无进展。这时已是5月22日星期五，到了马明哲和我设定的限期。我和胡祖六说好，不管怎样都要在当天结束谈判。时钟滴答作响地走到了下午，平安仍没有反应。下午4点，我打电话给胡祖六的副手黄匡杰，他说仍在与平安商议，会尽快回复我。我原以为剩下的这个问题并不大，此时看来对平安而言并不小。", "下午5点左右胡祖六再次来电，说平安接受我的提议，只略微改一下措词：如果按公告前一日两只股票市价计算的深发展股票溢价超过60%，平安有权重新议价。平安还同意，如果隐含溢价小于零，新桥就有权退出。我同意将“退出交易”改成“重新谈判”，因为改不改对新桥都无所谓，如果交易在最后一刻流产，双方肯定会重新谈判。但从某种意义上说，我们已把命运一最终的换股比率—交给老天或市场来决定。我如释重负。鉴于再无悬而未决的问题，我开始起草共识备忘录，将交易细节形成文字。晚上8点左右，我将共识备忘录发给高盛团队，其中写本共识备忘录不具有法律约束力，拟议的交易取决于最终文件的签署及监管审批。双方预计，自本备忘录签署之日起一个月内，签署最终文件，提交各自董事会、股东大会和监管机构批准。本备忘录自签署之日起一个月后失效，除非双方约定延长有效期。直到周日晚上，超过双方约定的限期将近两天了，我才收到高盛的回复。平安对共识备忘录做了若干修改。今我喜出望外的是，平安方面放弃了当溢价超60%而退出交易或重新谈判的权利。", "经历周折与煎熬后，我们终于拨云见日！平安最后一刻放弃因溢价而退出的权利，是个重大让步，让我十分欣慰。因为有这个条款，交易仍然存在不确定性，没有了它，交易就铁板钉钉了，不用担心股市的异动又把交易搅黄。我知道取消这个保险机制对平安有多难，但他们还是决定踏上不归之路。我心里由衷地感谢他们的努力。", "在双方律师的帮助下，双方敲定了共识备忘录的终稿。这一天是2009年5月27日。入夜，我还在平安聘请的香港律师所DLA的办公室，一边与刘善学闲谈，一边等候张子欣的到来。张和我会各自代表自己的机构签署备忘录。但左等右等，没有他的影子，原来他从深圳过来，路上耽搁了。最后我决定不等了，挥笔签了文件，和刘善学拍照留念，然后就回家了。我知道张子欣会补上自己的签名。虽然签署时缺了点仪式感，但无伤大雅，备忘录的达成对双方都是个有里程碑意义的成就。", {"img": "m26-1", "cap": "第二十三章插图"}, "2009年5月27日，香港DLA律师事务所，笔者和平安并购部门负责人刘善学（右）签署新桥向平安出售深发展控制权备忘录之后。马明哲和我通话互道祝贺。我们走过了漫漫长路，突破了重重阻碍，才迎来这一刻。我们都知道，离签署最终协议，直至完成交易，还有很长的路要走，很多问题要解决。好在双方志同道合，有了共同目标，不再是谈判对手，而是合作伙伴了。马明哲信心十足地对我说：“没有解决不了的问题，只有解决不了问题的人。”我心说，只有能解决问题的人，才会说出这样的话。接下来两周，双方和律师们在备忘录的基础上起草了最终协议文本。平安也无声无息地完成了对深发展的尽职调查。新桥无需当时就对平安展开尽调，新桥有权在18个月之内决定要平安的H股还是现金。如果新桥决定拿平安股票，那时再做尽调为时不晚。交易方案的优点就是不过于复杂。", "之后，我飞赴北京向两个监管部门报告，拜访了人行行长和证监会主席。人行行长周小川听了我的报告，没有说什么。银监会主席刘明康说，法规允许保险公司持股银行，而且没有股权比例的限制。我汇报说，交易的一个组成部分是深发展向平安增发新股。这个条款对银监部门是好消息，因为银监会一直希望银行增资，补充资本金。在北京的时候，我给深圳副市长陈应春打了电话。他说市政府对新桥与平安的交易乐观其成。", "双方都须对交易严格保密，直到正式公告。我们仍在洽谈最终文件，不到最后一刻，不能轻言完成。深发展和平安都是上市公司，提前泄密可能扰动股价，危及交易。但是因为有很多人在做尽调等工作，知情人的圈子已扩大很多，快纸里包不住火了。6月8日星期一，早上7时45分左右，张子欣打电话给我，说一家国内的媒体报道了有关传言。几分钟后我看到了报道，标题是〈重磅消息：平安将通过换股收购深发展〉。这下麻烦了。", "仅仅这个标题就会对深发展和平安股价产生重大影响，使交易复杂化。于是我们决定暂停两只股票的交易。根据上次的经验，我知道停牌申请须于上午9点前书面提交给交易所。眼看只剩约一小时，我们急忙提交了申请。比起新桥和深发展，平安面临双重压力，因为平安的股票在沪港两地交易，所以他们必须赶时间，在两个交易所停牌。要求停牌必须提供理由。", "此刻，最终文件尚未定稿。所以，深发展的公告写道：“停牌原因是我行将向董事会提交募资计划以供审议，其中可能包含市场敏感讯息。”如此而已，没有说增发的对象。平安的公告透露的讯息多一些，说正在考虑投资深发展。虽然都说得不多，两相对照，不难看出端倪。", "两家公司的股票都及时停牌了。公告引发了媒体对新桥和平安可能就深发展达成交易的新一波猜测。此时，新桥与平安团队配合各自的律师已用了两周左右时间起草最终协议。因为有许多细节要敲定，还有一些技术问题要克服，工作进展缓慢而艰难。6月11日星期四晚上9点，新桥团队、平安团队及双方律师会面，做最后冲刺。消息已开始泄露，我们必须加快步伐，与时间赛跑。散会的时候已是次日凌晨2点左右，所有问题都解决了，只等律师们最后一次审稿，确保无误。", "我个人的生活此时有个小插曲。那天，当我到家时已是凌晨，女儿居然还没睡，神色慌张。原来，她第二天就要参加高中毕业典礼了，但弄丢了毕业礼服。我只好哄她，直到她在凌晨三点左右入眠。我们后来发现她把礼服遗留在学校公众饮水处，幸好及时找到，没影响她的毕业典我睡了两个半小时，起来完成了每日跑步，便乘车赴深圳参加深发展董事会会议。我打算在深圳干完事情之后，正好赶回参加女儿的毕业典礼。那次会议的主要事项是批准向平安定向增发股票。我本以为不会有异议，因为平安同意支付的价格为深发展股票20个交易日的均价，而不是按惯例，即证券监管机构允许的九折。没想到，董事和监事们提了许多问题，会议开了四个半小时之后，一致通过。投票的时候，新桥的董事迥避。", "快到下午3点，我才匆匆告辞，乘车回香港。我在路上修改了最终交易文件，又起草了中、英文的新闻稿。到家的时候，女儿和全家已经准备出发了。我和他们一起去学校参加毕业典礼。当女儿和她的同学鱼贯而入，列队走进学校的体育馆，领取毕业文凭时，我万分激动。今天，是她人生的里程碑，又恰巧是新桥和深发展的里程碑。我本应给她买一束鲜花，但来不及了，就在校门口杂货店买了一袋红得够喜庆的西红柿充数。以我看，鲜花和西红柿有什么区别呢？可以吃的东西还更实惠。但妻子不让我拿出来，说让别人看到还不笑掉了大牙？", "回到家中，我又忙着处理有关深发展交易的各种文件。直到晚上7时30分左右有人送来了最终协议的签名页。我当即签了字。签名页的交换是由律师办理的，没有任何仪式。不过，交易总算彻底敲定了。", "女儿高中毕业和新桥签署出售深发展控制权的最终协议，发生在同一天，虽然是巧合，但确实是双喜临门。这一天，是2009年6月12日。我儿子在美国读书，此时已经毕业，也回到了香港。全家出去下馆子，庆祝女儿毕业。真是皆大欢喜的一天！"], "wcount": 6528}, {"icon": "24", "title": "第二十四章 鹏程万里", "paras": ["深圳的别名是“鹏城”，所以本章标题的寓意就不言而喻了。秦朝的时候，深圳这块地方就设县了，叫做宝安县，在历史上曾改成新安县。袁世凯时期，因为与河南新安县同名，故改用古名宝安县。1979年宝安撤县设市，升格为深圳市。“鹏城”的称谓源自于明朝。《明史.地理志》载：“新安府东南，本东莞守御千户所，洪武十四年置.⋯有大鹏守御千户所。”“鹏城”就是取自于“大鹏守御千户所”。洪武十四年为公元1381年，距今640多年了。深圳还濒临大鹏湾。二十一世纪初，为了深发展项目，我频繁往返于深港之间，深圳深南大道上最醒目的广告牌上是邓小平的画像和他的话：“发展是硬道理”。广告牌上还画着展翅的大鹏。发展是硬道理，说得多好呀！", "女儿毕业典礼后的第二天，我给新桥的有限合伙人发了一份备忘录，要点如下：新桥出售深发展的股份，有权选择现金对价或者平安的H股对价。如果选择现金，平安集团将按照每股22元，总计支付新桥114亿元（按照当时的汇率为16.8亿美元）。如果选择平安的H股，新桥将收到2.99亿股可以在港交所自由交易的H股。公告发布时决定的换股比例为1.74，计算的方式是用平安H股前30个交易日的平均收盘价，除以深发展的每股股价26元。", "值得一提的是，公告发布时，深发展隐含的换股价为每股26元，看起来远低于2007年40元左右的峰值。但实际上，因为在股改过程中，我们获得了不少认股权证，行使之后，我们手头上持有的股数增加了，所以所持股票的总价值和2007年基本一样。当然，我们希望在选择权到期前的18个月内，平安集团股票会继续升值，从而让新桥进一步获利。", "深发展的故事还没完，还要有审批这个环节。这是一个极为复杂的过程。首先是两个公司的股东大会需要批准。对于平安更为复杂，需要分别召开A股和H股两个股东大会。其后是监管审批。虽然我们在设计交易结构时，力争每一个环节都符合现行的法规，而不需要特批，但还是要经过最起码三个监管部门的批准，包括证监会（管上市公司），银监会（管银行）和保监会（管保险公司）。由于此类交易没有先例，而且平安此举会使其成为名副其实的金融控股公司，所以可能还要更高的权力机构批准。我们的判断是，市场对这个交易的反应，可能左右监管部门的意愿。如果市场反应负面，那么监管部门也会受到影响，因为谁也不愿承担冒天下之大不韪的责任。总之，革命尚未成功，同志仍须努力。", "尽管外界对于新桥和平安的交易猜测不断，但消息一经正式公布，在市场上依然轰动不已，国内外几乎所有的主流媒体都竞相报道。报道基本上是积极正面的，尽管新桥的退出让有些媒体扼腕叹息，特别是国外的，因为这标志着一个时代落下帷幕。我琢磨着，媒体在报道新桥收购深发展一案中获得不少乐趣，自从新桥2002年开始接触，以后一路坎坷，最终让深发展满血复活，都是好的题材。此时，也许媒体不愿新桥就此离去。", "英国《经济学人》在2009年6月18日刊登了一篇文章，名为〈来自另一个时代的金钱〉（Money from Another Time），就反映了这样的情感，文章的副标题是〈外资进入中国银行市场的探险之旅虽然以成功告终，但退出为时过早〉。", "文章认为，这是一桩空前的交易，但作者担心的是后无来者。文章说，“6月12日，新桥签约将所持深发展的股份悉数转让给了中国的大型保险公司平安集团，这一天具有划时代的意义。”文章的结尾甚至盼望新桥不能获得监管批准：新桥获得的巨额投资回报使某些媒体报道，官员可能会阻止交易的完成。没有一家私市股权投资基金愿意自己的退出战略受阻，但是对于新桥，即便受阻了也未必不是一件好事。除非再有一轮银行倒闭，在许多年之内，都不会再有一家外资获准收购这样的金融机构，新桥也很难找到比这更有意思的投资机会了。", "媒体的积极反应对于新桥和平安来说至关重要，因为股东和监管的决策都可能受舆论影响。平安投入了不少人力物力，积极开展公关活动，我则帮助在公关口径上把关。", "大部分媒体报道都很正面，有的甚至表露出兴奋，而本来媒体应该秉持客观中立的态度。", "《财经》是独立性很强的杂志，在国内颇具影响力。它在6月22日发表了一篇封面文章专门介绍了新桥和平安的交易，篇幅长达14页，题为〈平安一深发展—TPG：震撼交易〉。", "文章说，这是个三赢的交易：", "“新桥可谓功成身退”，", "“完美退出”，", "“TPG新桥在这个交易上经历颇多曲折和磨难，可谓善始善终”。", "文章还解释了新桥的回报。“这意味着新桥获得的收益有两块：一是对新桥五年来整顿深发展，出让控股权的回报，这块以现金保底的形式进行了锁定；一是新桥将分享平安收购深发展可能带来的溢价，目前尚不确定，要视未来平安的股价走势所定，但也有很大想象空间。”", {"img": "m27-1", "cap": "第二十四章插图"}, "TPG震撼交易公圳发展银分RHEN DEVELOPMENT BANK", "《财经》2009年6月22日封面文章插图", "真正让我们出乎意料的是《人民日报》在6月22日发表一篇评论员文章，题目是〈期待多赢〉，对这宗交易表达了强烈赞同和支持。我告诉新桥的合伙人，政府的喉舌为一笔商业交易站台，闻所未闻，实属罕见。", "文章说，“这些年，中国平安、深发展无论是在业界还是资本市场，都是备受关注的焦点。仔细琢磨这笔‘买卖’，无论是眼前还是长远，无论对当事双方还是市场，人们都期待出现多赢局面。”文章强调这笔交易对平安和深发展的诸多好处，包括使深发展迅速提升资本充足率，并可以利用平安的客户资源，等等。文章对新桥评价很高，并指出“新桥退出深发展，将净赚90余亿元”。", "其实，这是大大低估了新桥的收益，但我们一点也不在乎。文章接着说，“如果采用换股方案，未来还有可能成为平安的股东，分享平安未来价值增长机会。”文章还说，“可以说，这是一次强强联合、优势互补、三方互赢的合作，交易各方都将各得其所。”《人民日报》说得比我们自己能够表达的都好，也正是我们想向市场传递的讯息。我还以为是马明哲和他的团队手眼通天，说动了官媒发表这篇文章，但马告诉我，他们根本没有和《人民日报》接触，对于评论的发表也深感意外，当然大家都是惊喜。我在内部的备忘录中写道，我们不要被这些报道冲昏头脑，舆论的支持有助于拿到批准，但并不能保证。事实上，《人民日报》文章的结尾相对审慎：“至于市场会不会生变，监管层最终是否批准这宗交易，目前还不得而知。但对平安的‘雄心’，我们还是要叫好。或许正是平安的‘不安分’，让我们一次又一次梦想着中国金融企业的斑斓未来，见识着国际金融业的烽火硝烟。哪怕，成功还需很久，失败还会很多。”这最后一句话大概是微妙地暗指平安在欧洲金融机构富通投资的失败。", "但无论如何，市场化的《财经》和官办的《人民日报》都给予正面评论和背书，给我们以极大的鼓舞，欣喜之余，对获得监管批准更有信心了。", "更为重要的是，广大股民似乎也为这个消息欢呼雀跃。6月15日，深发展复牌首日即涨停，涨幅达10%。平安集团股民的反应也很积极。有人做了一项在线调查，测试股民的反应。两天内有4万人参与了调查，其中73%的人认为，交易对深发展有利，70%的人则认为利好平安集团。显而易见，大部分人认为这笔买卖对双方都有利。", "消息发布后的周一早上，我驱车前往深圳，与深发展总行的高层会面。", "这可不是一支平凡的管理队伍。我们把这些人汇聚在一起，携手并肩，踏上了改造、重建银行的漫漫长路。此时我们为自己取得的成绩而自豪，我感觉我们就是一家人。是他们让深发展起绝处逢生，东山再起，我对他们的贡献表达了感谢，向他们保证，新桥会将银行托付给安全可靠的下家。我简要地向大家介绍了交易情况以及平安对于深发展未来的愿景。", "更重要的是，我告诉他们，平安同意，交易完成后，除非有人犯了重大过错，否则至少三年内不会裁员、降职或降薪。在准备退出时，我们要做好深发展员工的善后工作。参会的员工听后都松了一口气。要说没有一丝疑虑，那是不可能的，但我相信，平安的承诺，能够安抚员工的紧张情绪、赢得他们的支持。同时，交易需要获得平安股民的批准。依据相关规定，深沪两地的平安股东必须分别投票，都批准了，交易才算生效。", "平安需要在会议通知期内，制定周密的计划，开展密集的游说工作。平安投资富通遭遇了滑铁卢，股民们心存余悸。在消息公布之后，深发展的股价立即涨停，但平安的H股在复牌第一天跌逾3%，第二天继续下跌了5%。平安的股民似乎不相信这笔交易对平安有利。我们两面出击，一面开展密集的公关活动，另一面直接与股民和监管沟与国外媒体沟通的方式主要是回答媒体的问询，把我们要说的话通过媒体释放出去。对于国内的媒体，像平安这样知名企业与各大媒体都保持良好的关系，深发展亦是如此。他们积极与媒体接触，帮助他们做分析，甚至还提供了很多新闻通稿。记者或媒体拿到稿件后，经常原封不动刊登出来。我自己也帮助把关，以确保事实和讯息正确无误，之后才能对外发布。", "6月22日，我与马明哲和六家券商的负责人碰头，这些都是平安聘请的财务顾问，他们的工作是争取股民投赞成票。我在会上要求他们尽最大努力收集市场情报并游说股民。我对他们说，只准成功不准失败，如果出师不利，对于我们所有人都是灾难性的。", "6月29日，深发展召开特别股东大会，采取现场投票与网络投票相结合的方式。参加本次大会投票的股民占全体的66%，可能是深发展历史上参加投票股东人数最多的一次。新桥和平安（已持有近5%的深发展的股份）均回避此次投票。最终，赞成票占比高达93.7%。平安收购深发展的消息传出后，中国人寿在最后一刻仍没有放弃争夺深发展的控制权，迅速增持了9500万股，持股占比达到6%。我们估计他们会投反对票，结果他们投了弃权票。而反对票的比例仅为区区的0.2%。", "这样就清除了审批过程中的一个主要障碍。积极的宣传，再加上卖力的游说，是获得高票的重要原因，但更重要的原因是股民们意识到这笔交易对他们有利。", "平安于8月7日召开特别股东大会。这个会非常关键，因为新桥可以选择股票对价，所以平安的股东大会必须批准可以向新桥定向增发。投票之前，平安方面信心满满，但我不敢过于乐观。那天，股东大会分为两场召开，分别是A股和H股。最后，统计结果显示，A股股东的赞成率是99.98%，H股股东的赞成率是98.97%，综合通过率是99.74%。这个结果不可能再好了。", {"img": "m27-2", "cap": "第二十四章插图"}, {"img": "m27-3", "cap": "第二十四章插图"}, "监管审批远比我们想象的麻烦。保监会要批准平安再收一家银行，而且是全国性的银行，而且还要确定收购资金的来源一是险资（即卖保险的收入）还是股本金。银监会需要评估平安是否有资格收购深发展。而证监会需要批准平安向新桥定向增发H股。新桥和平安的顾问分头与相应的监管部门对接、沟通，针对提出的问题，答疑解惑。只有一个监管部门点头是不够的，三个监管部门的批文缺一不可。监管部门花了好几个月的时间，核对交易的每一个环节，确保都合规。", "在中国的官僚体制当中，每个主管部门内部的沟通非常有效率，从中央到地方非常畅通，但各个主管部门之间很少通气。有时候，一个主管部门制定的政策，并没有顾及其他的部门，结果在市场上产生意想不到的效果。", "譬如，银监会要求银行在市场上融资充实资本金，而证监会为了保指数关闭融资闸门；又譬如，证监会为了取悦股民要求分红，而银监会为了银行资本充足而不许分红，等等。这些都是监管矛盾，相互不协调的例子。", "因此，我们要在各个主管部门之间跑，帮助他们之间的相互沟通。对于这笔交易，银监、保监和证监三会都要批准，之后呈报国务院。其中的一个会，不同意另一个会起草的措词一“三家达成一致意见，予以批准”。持异见的那个部门认为应该删去这句话，原因在于他们是自己独立做出的决定，而不是和另外两家商量后达成的一致。", "但是如果不这么说，怎么向国务院递交一个联名报告呢？后来我替一个部门的领导出了一个主意，改了几个字，意思是说经过分别审查后得出的结论是一致的，解决了这个问题。尽管如此，审批还是一拖再拖。保监会、银监会和证监会的领导都表示赞同，但是批复就是下不来。", "我在12月2日的一份内部备忘录中报告说：让这些政府部门取得一致意见，点头同意太复杂也太痛苦了。我仍然希望2010年一季度能拿到所有批文。马明哲那边很投入，但政府部门那边似乎催也没用。部门之间几乎不相互沟通。", "合同通常会约定一个终止期限，过了期限，不管什么原因，交易还不能完成，合同就失效了。新桥和平安的合同终止日是2009年12月31日。我们当初估计用6个多月的时间争取监管审批应该足够了，没想到，终止日一天天临近，批文还是没有着落。双方都不想因此放弃交易，所以正式修改合同，将终止期再延长4个月。", "根据合同条款，新桥可以在2010年12月24日之前，选择接受现金或平安H股票。到了2010年3月中旬，证监会说，如果批准平安向新桥支付平安的H股，但新桥最后不选择拿平安的股票，这是不行的。如果证监会批准一家公司发行H股，就不能再取消，从未有此先例。因此，新桥此时就必须做出选择。", "此时距离公告发布已经过去六个月了，平安的H股每股价格达到了63港元。“现金对价”相当于平安股每股43港元的价位。也就是说，“股票对价”比“现金对价”高出约50%。此时，平安的市值已达到了600亿美元左右，流动性充足，可以支撑大笔套现。于是，我请平安通知证监会新桥决定接受平安的H股。", "虽然审批拖了很久，但赶得早不如赶得巧。到了2010年4月的最后一天，也就是合同延期后第二次终止日那天，平安才收到证监会的批文，最终凑齐了三张批文，可以交割了。", "2010年5月3日是周一，新桥启动程序，通过深圳证交所将深发展股份过户给平安。5月6日，新桥收到了平安支付的2.99亿股H股。这一路走来，无数次开会、电话沟通、夜以继日，还要没完没了地跑监管部门，此时终于大功告成。", "2010年5月13日和9月2日，我们分别在香港市场通过大宗交易的方式（block trade）全部套现了平安H股。“大宗交易”指通过经纪商一次性批量卖出股票，一般在股市收盘后操作，所以并不影响市场。经纪人将股票卖给大机构投资者，比在市场上零敲碎打地售卖出手快得多。", "我们第一笔卖了1.6亿股，每股定价60.6港元，合计12.5亿美元。", "第二笔出手了1.391亿股，定价每股64.99港元，合计11.6亿美元。", "加在一起，新桥将24亿多美元收入囊中。扣除行使权证用到的1.39亿美元贷款后，净收益为22.7亿美元，比起1.5亿美元的原始投资，赚了14倍有余。", "那时，全球和亚洲股市已强劲反弹。2009年，香港恒生指数攀升了49%，平安H股涨幅更是高达75%。2010年初，香港股市降温，平安H股也有所回落。", "2010年5月13日我们卖第一批平安H股时，股价已自2009年末高点下滑了10%左右。", "然后，到2010年9月2日我们卖第二批时，股价反弹了8%左右。总体上，“股票对价”比“现金对价”超出40%多，高出8亿美元，当初交易结构中设计的选择权给新桥创造了不菲的价值。虽然新桥退出的时机和方式近乎完美，但新桥投资深发展之所以大获成功，主要是因为深发展实现了转型与发展。", "为此，我们深深感谢法兰克.纽曼和他的团队。和众多金融机构一样，深发展享受了中国经济强劲增长的红利，但它也是同业中的佼佼者。", "2009年底，在中国社会科学院联合其他机构所作的年度调查中，深发展获得了六个同类最佳奖项，包括“最佳零售银行”、“银行理财最佳品牌”和“中国最受尊敬银行”。", "我们对获得“中国最受尊敬银行”这一殊荣倍感自豪。五年前首次与风险管理部员工谈话时，我请大家举手对深发展给出评价，结果大家将它评为行业最差。随后在短短五年内，深发展攻坚克难，从最差逆袭成了最佳，超出所有人，包括我们自己的预料。", "自2004年底新桥入主，到2010年底，深发展总资产几乎翻了两番，年增长率达24%左右。净利润大涨了20倍，从2004年的约3亿元人民币攀升至2010年的60多亿元，年增长率达66%左右。", "不良贷款率—这个我们起初非常担心的资产质量指标—从2004年所公布名义上的11.4%（实际数还要差得多）下降到了2010年底实打实的0.6%。此外，深发展的资本充足率从那时名义上的2.3%提升到了真实的10.2%。", "深圳发展银行转型关键指标", {"img": "m27-4", "cap": "第二十四章插图"}, {"img": "m27-5", "cap": "第二十四章插图"}, "新桥对深发展的投资堪称里程碑。外资在中国取得全国性银行的控制权，此案独一无二。深发展成功改造，强势崛起。", "2010年5月6日，英国《金融时报》报道新桥完成与平安的交易，其中引述我的一句话：“我们从来都没有把这个项目看作一笔简单的投资，而是视为中国银行业改革的一部分。深发展在五年里通过改造由弱变强，我们深感欣慰。”", "我无意过分拔高新桥的目标和历程的意义，毕竟我们只是投资者，为世界各地的有限合伙人管理资金，而大部分有限合伙人又为退休人士、劳工等普罗福斯管理资金。新桥的责任就是为有限合伙人实现资本增值。", "我们的投资项目有的成功了，给有限合伙人带来丰厚回报，有的则受挫甚至失败了。但我们将资本和人才汇集起来，帮助解决企业的问题。在深发展的转型中，我们确实创造了价值—不仅为投资者，也为深发展本身和所有利益相关方，包括广大股民和深发展的客户。这与医生治疗病人、工人修理漏水管道、船员营救受灾船舶并无不同。就这样，私市股权投资公司在寻求资本价值最大化的同时，促进市场效率的提升。因此，新桥除了达成自己的目标外，还对中国银行体制改革做出微薄的贡献。", "正如新华社2009年6月30日的评论文章〈“平深恋”将推进我国金融创新发展〉所说：“5年前，新桥成为深发展第一大股东，这一事件成为中国银行业改革的标志之一。而深发展在励精图治多年后，财务经营指标有了显著进步。这场被外界称为‘平深恋’的战略合作不仅对两家企业意义重大，对我国资本市场的平稳发展和金融业的稳定也具有重要意义。”", "深发展改造成功的根本原因是解决了一个体制性的问题，也是我在2005年3月10日在银行信贷风险管理培训班上提出的问题：“深发展是属于谁的？”", "我自己的回答是：“每个人都要有主人意识，‘我就是银行的主人’，只有这样，银行才能进步，个人的事业也才能进步。”", "新桥的入主，解决了这个根本问题。对此，监管部门有深刻的认识。", "2008年9月，深圳银监局局长刘元在《深圳金融》上发表《关于深圳银行业对外开放后的评估报告》，其中提到：“新桥作为控股股东，解决了深发展以往所有者缺位，政府干预以及内部人控制的问题，为改变深发展日益衰竭的态势奠定了必要的产权基础。”", "我在2009年6月18日新桥与平安签约的仪式上即席发言中说：“深圳市政府眼光独到，高瞻远瞩，在五年多以前迈出了非常重要的一步。这个重要的一步不但对于深圳市的改革开放有着重大的意义，对国家的银行体制的改革，也是一个大胆的试验，而且现在证明是个成功的试验。”", "展望未来，我充满信心：“深发展有了平安，犹如锦上添花，平安有了深发展，恰似如虎添翼，从此以往，深发展和平安的前景正是不可限量！”", "深发展后来更名为平安银行，但它实质上是两家银行一深发展和平安银行一合并后的存续实体。平安银行仍在深圳证券交易所上市，股票代码仍为000001。得益于强劲的经济增长，平安银行和平安集团持续攀登新高。2010至2020的十年间，中国经济年均增速高达9.2%，国内生产总值从2010年的不到6万亿美元增长至2020年的15万亿美元，翻了一番还多。", "2004年底新桥刚完成收购时，深发展总资产不过2000亿元；到了2010年新桥出售深发展时，总资产已达7000亿元。截至2023年，平安银行总资产已超过5万亿元人民币，约为2010年的7倍，2004年的25倍。", "当初谁能想象？平安接手控制权后不久，纽曼辞任董事长兼首席执行官，圆满完成了历史使命。萧遂宁获任为董事长，不再任行长。杰克逊成了平安控制下的首任行长。", {"img": "m27-6", "cap": "第二十四章插图"}, "萧遂宁几年后退休了。杰克逊任职时间也不长。2016年，胡跃飞升任行长。胡跃飞就是当初我让他要么接受提升，要么卷舖盖的那位。深发展为权力正式交接举行了一场聚会，告别纽曼和其他几位高管，同时欢迎萧遂宁和杰克逊履新。当年新桥收购的，是一家濒危的银行；如今新桥向平安正式移交的，是一家强壮且规模大了几倍的金融机构。", "平安在2006年最初找我们洽购深发展时，拥有150亿美元左右的市值，到2021年则达到2400亿美元左右。马明哲仍是董事长。平安以全国性的平安银行为核心，发展成了综合金融巨头，2022年末总资产高达1.6万亿美元左右。我打过一个比方：深发展最初像一艘濒临沉没的破船，绝处逢生，经过全面整修之后，最终成为高速航行的好船。回想这段历程，我脑中浮现出长江纤夫的形象。我第一次看到长江纤夫时，就为他们的艰苦卓绝所震撼。我干过苦工，知道那是什么滋味，但纤夫干的是最苦的苦工。他们将纤绳一头套在自己肩上，另一头拴紧满载的船，在陡峭的石岸上竭触及脚下的岩石。为使步调一致，他们齐声唱着纤夫号子。他们一刻也不能放松，否则水流会立即把船冲走。", "新桥在深发展项目上的经历与之类似。当然，我们的苦工不在于体力，没有肉体上的痛苦，而是以自己的方式，拉着深发展这艘航船穿过激流，渡过险滩。如果我们稍一懈怠，这艘船就可能倾覆沉没。经过五年多的努力，我们终于把船拉进了一望无际的大海。我们并非孤军作战，而是有一支庞大的专家团队。这条征途充满了艰辛，我们越过了多少道弯，受过了多少挫折，捱过了多少迷茫与彷徨，只有我们心裹清楚。我们下船了。但这艘整旧如新，扩建加固了的大船又扬起了风帆。希望它在新船长的执掌下，行稳致远，勇往直前。借李太白《行路难》的诗句收尾：“长风破浪会有时，直挂云帆济沧海！”"], "wcount": 8677}, {"icon": "后", "title": "后记 自由王国", "paras": ["到了2009年1月，我在新桥已经工作了11年，是我职业生涯中待得最长的一个地方。2006年左右，合伙人们就开始讨论将新桥并入TPG。新桥本来就和TPG有密不可分的关系和渊源，庞德曼既是TPG的主席，也是新桥的联席主席，所以合为一体也顺理成章。TPG的合伙人之所以想合并，是因为亚洲终于成为私市股权基金不可或缺的市场。新桥在1994年初建之时，还没有真正意义上的全球性私市股权基金，而亚洲被视为边绿市场。新桥是个专门投资亚洲的基金。但十几年之后，有些美国和欧洲的私市股权基金开始全球化，亚洲成为其战略重要的组成部分。", "除我之外，新桥还有三名资深合伙人，分别是布朗姆、庞德曼和唐开罗。由于庞德曼是TPG的主席，理应回避，因此是否将新桥并入TPG，就取决于布朗姆、唐开罗和我。布朗姆并不热中，他对亚洲市场颇为乐观，希望新桥继续保持独立。而唐开罗和我却赞成并入TPG，我们始终认为新桥和TPG是一家人，而TPG当时因为业绩斐然，在华尔街如日中天，大批青年才俊趋之若鹜，我和唐开罗觉得两家合二为一更可以相得益彰。最终，布朗姆也点头同意了。", "合并在2007年完成，新桥合伙人都变成了TPG合伙人。但新桥仍然管理自己的亚洲基金，而不是用TPG全球的基金投资。合并之后，新桥更名为TPG新桥（TPG Newbridge），后又改为TPG亚洲。", "从此，新桥这个名称成为历史。过了许久我才意识到，我们放弃了一个非常有价值的品牌。", "弗朗西斯.福山（Francis Fukuyama）在《信任：社会美德与创造经济繁荣》（Trust: The Social Virtues and The Creation ofProsperity）一书中论述不同社会中的信任度是不同的。他认为美国和北欧是典型的高信任度国家，而亚洲除了日本之外，大多为低信任度社会。低信任度源自于在不发达国家，讯息也同样不够发达，如果人与人之间缺乏了解，自然就缺少信任，因此人们更愿意和熟人或名声在外的人打交道。", "当然，随着社会的进步，讯息的逐步发达，社会诚信度也就随之提高。由此引申，在低信任度的社会当中，品牌尤其有价值，因为品牌是质量可靠的象征，更容易取得市场的信任。", "久而久之，我才意识到自己远远低估了品牌的价值，即使过了十多年，当结识新的生意伙伴时，在简短的介绍后，对方时不时地会突然想起来，说，“你原来就是新桥的啊！”", "新桥已经不存在了，但他们还记着新桥的名字，就是因为在新桥的品牌下，我们在市场上打了几场漂亮仗，包括深发展和韩国第一银行。", "合并之后，不仅仅是公司名称变了，决策重心也变了，从香港转移到了TPG总部所在地的旧金山。本来亚洲的合伙人说了算，此时要拿到旧金山决策，真正说了算的是TPG的几位资深合伙人。", "这且不说，从1998年加入新桥之后，我的联席管理合伙人一直是唐开罗。而此时，唐开罗回到旧金山，取而代之的是一位来自欧洲的合伙人。我在新的公司环境中愈发感觉不自在。", "2009年1月，TPG亚洲在纽约文华东方酒店开年会。我告诉庞德曼，想给自己放个长假，然后引退。我说自己愈来愈受不了大公司的繁文缛节、条条框框。", "庞德曼不答应，说，“你可以想干什么就干什么，为什么要离开呢？”", "我说：“你是创始人，当然可以随心所欲。我算老几？如果想干啥就干啥别人也会皱眉头的。”庞德曼坚持道：“不，你可以自行其是，想干什么就干什么。”", "他建议给我一个头衔—“资深合伙人”，以示与众不同。在TPG内部，我是唯一挂这个头衔的。他还说给我一个团队，听从我的指挥，这样我就可以放手去干我想干的事了。", "我被说动了。第二天，TPG的首席律师克里夫，博德（Clive Bode）和我坐在一起，就庞德曼和我达成的协议形成书面文件。恰巧，庞德曼路过，对我说：“引退不是个选项。”顿了一下，他接着说，“我们要保护你，不受官僚制度伤害。”", "他刚要抬腿，又停住脚步加上一句，“或者保护官僚体制，不受你的伤害。我不知道哪个才更重要。”", "像庞德曼这样的人格魅力，确实使我难以痛下决心。而且我也知道，退出深发展的投资是我的责任，善始善终嘛。", "同年6月，当我再次见到他时，我说：“戴维，我已经把资深合伙人的头衔从名片上删掉了。”他问：“那你现在是什么头衔？”“没有头衔。”", "我告诉他，我觉得头衔太做作了，根本不需要。", "他说，“那我比你还厉害。”我有些惊讶，问他：“你的名片上写的什么头衔？”", "“我连名片都没有。”他淡淡地说，一点都没笑。", "女儿要上大学了。8月份，我们带着她到檀香山度假。有一天，庞德曼打来电话，问我们夫妇二人是否喜欢水上运动。我一时不知道他说的是什优寿开乘圣绝甜毇苵罗雳垩关爨萃游饮义带馏樱她烤奖学盐熬！", "10月底，TPG年度投资者大会结束后，我、庞德曼夫妇和他们的朋友乘坐庞德曼的飞机，从洛杉矶飞往巴布亚新几内亚的首都莫尔兹比港，途经澳洲凯恩斯，接上了已经先行到此的妻子。", "我们在莫尔兹比港登船起航我随身带了一本书，书名是《马克思的将军：弗里德里希.恩格斯的革命生涯》（Marx's General: The Revolutionary Life of FriedrichEngels）。我在英国《经济学人》上读到此书的书评，觉得挺有意思，就买了一本。文献中，马克思的传记很多，但是关于他最亲密的合作伙伴恩格斯的传记，我还从来没有读过。恩格斯语言天份很高，可以讲好几个国家的语言，他将马克思的大部分文章翻译成了英文。恩格斯是富有的资本家，自从结识马克思之后，就一直资助马克思和他的家人，而且在马克思去世之后也是如此。当年在戈壁滩种地时曾读过一些恩格斯的书，当然是中文翻译。他说，人类社会一定会从“必然王国”过渡到“自由王国”。", "我一直没有理解他的意思。马克思的理论讲社会发展的规律，从原始社会，到封建社会，再到资本主义社会的转变，而且下一步是社会主义，继之以共产主义。", "所以我想，“必然王国”的意思一定是不可打破的历史规律，但如何摆脱“必然”而进入“自由王国”呢？规律应该是无法打破的呀。", "此时看了英文版，才知道中文版翻译错了，恩格斯说的是从“Kingdomof Necessities”向“Kingdom of Freedom”飞跃。", "前者应该翻译成“必需品王国”，而不是必然王国。", "所谓必需品王国，是说人们为了获得生存必需品，不得不劳动，也未必是你喜爱的工作，所以没有真正自由。", "在他和马克思设想的共产主义社会中，物质极大丰富，生存将不再是一个困扰人类的问题，人就解放了，想干什么就干什么，因此进入了“自由王国”。", "当然，这个王国也许永远实现不了，因为任何时候资源都是稀缺的，尤其是新产品，不可能同时满足所有人的需要。", "在庞德曼的豪华游艇上，我突然意识到，我此时已经有了足够的积累，不必为五斗米折腰了，完全可以做自己更喜欢的事情，进入“自由王国”。我想，是离开TPG的时候了。", "那天下午，海上起了大风，波涛汹涌。但船身下有自动平衡器，所以在游艇上几乎感觉不到晃动，我还能在上层甲板的跑步机上跑步。大船上配装小艇，为来往方便之用。庞德曼问有没有人想一起乘小艇去深海钓鱼，结果只有他和我有兴趣。小艇在海浪中摇摆颠簸，后面拖着几条鱼线。大海一望无际，水天相连。我想方圆数百公里之内就我俩在用现代设备钓鱼吧。", "过了一小时，我俩只钓到了一条小剑鱼。尽管如此，我还是很开心，毕竟像这样能和戴维独处的机会很少。", "这时，我鼓起勇气对他说：“戴维，我要离开了，已经想好了。”我的意思是要离开TPG，而不是要跳船离开这个世界。", "其实，在此刻说这些有点尴尬，毕竟他在度假，而我是来做客的。但此时不说，不知道还有什么更好的时机了。", "庞德曼聪明过人，一听就知道我去意已决，无可挽回了，就说：“好吧。但我们还是要保持关系。”", "当时，虽然监管审批尚未结束，但我们和平安之间关于深发展的交易已经是板上钉钉的事情，所以我没有后顾之忧。新年过后，我飞到美国科罗拉多州的阿斯彭去见庞德曼，正式敲定离去的时间和程序。庞德曼的家就在那里一座植被稀疏的山上。", "对于我来说，离开TPG是件大事，所以穿了西装。庞德曼到我的酒店来会面，看见我，有点不以为然地说，你怎么穿得这么正式？他自己就穿着一件毛衣。庞德曼和我简单地聊了聊，我俩约定我将在2010年6月30日正式离职。", "TPG那时要在西班牙的巴塞隆拿开会，那将是我参加TPG的最后一次会议。到了那时，TPG应该可以找到合适的继任人了，可以无缝衔接。通常，辞职的最佳时间是在年初领了年终奖之后，至少在金融业是如此。", "而我在11月份向庞德曼提出要走之时，根本就没想过这些。但庞德曼是个慷慨大方的人，我当初加入新桥，薪酬谈不拢，听说他对其他合伙人说，“这家伙要什么就给他什么就是了。”", "此时也不例外，TPG给了我2009年的全额奖金和利润分成，甚至让我保留了一部分公司的股份。2009年TPG改制，准备上市，所有合伙人就有了股份，而我拿到的股份是在我提出离职后授予的。要是在别的公司，不会如此照顾一个即将离去的人。我打算组建一支新团队，创办一家私市股权投资基金。我与庞德曼有个君子协定，不从TPG挖人。当然，我的新基金要干的事肯定会与TPG亚洲竞争。", "尽管如此，庞德曼还是尽其所能地帮我。在我离开前一个月，英国《金融时报》的记者听说了此事，问庞德曼对我离职有何看法。庞德曼平常低调，很少接受采访。但他这次却接受了，条件是记者必须晚几天发布报道，留给TPG几天时间来向有限合伙人打招呼，这样他们不是先从媒体上看到这个消息。", "2010年6月2日，英国《金融时报》刊登了〈TPG并购专家单伟建将辞任，创办新的亚洲基金〉（TPG dealmaker quits to launch Asia fund）的报道。报道称我本人离开TPG之后，“计划设立一只专注亚洲机会的基金。”", "报道援引庞德曼的话说：“单伟建是一位精明且执着的投资者，TPG希望在他未来的事业中继续与其保持关系。”", "庞德曼在业内很有影响，他的这句美言帮了我大忙。我的想法是，设立一只新的私市股权投资基金，继续我在新桥和TPG的战略，然后伺机扩展成一个产品分散的平台，除了并购基金外，还包括房地产投资、信贷基金、对冲基金等“另类投资资产类别”。", "“产品”是针对投资者而言，每个资产类别都是一个产品。为什么这些资产管理被称为“另类（Alternative）”，我到现在也搞不清。", "其实这些资产管理的模式，基本上与私市股权投资是一样的。但私市股权投资，尤其是并购类的，有点“三年不开张，开张吃三年”的特点。", "比如深发展，我们就在投资六年后才实现价值。产品分散化有助于稳定现金流，给投资平台带来更大的价值，因为市场知道怎么估值一家现金流稳定的企业，而不知道如何判定现金流时断时续的企业价值。《金融时报》的报道正是时候，引起了不少潜在投资者的关注，结果我募资的时间表大大提前。托尼.米勒（Tony Miller） 和我是老相识了。", "1999年前后，我正忙于韩国第一银行收购，在香港和汉城（2005年之后中文名改为“首尔”）之间来回飞，在飞机上经常碰见他。他那时是凯雷（美国一家私市股权投资公司）的合伙人。", "转眼来到了2010年，他成了太平洋联盟集团 （Pacific Alliance Group）的合伙人。当时他住在日本，在报纸上读到我要离开TPG，再来香港的时候，请我吃饭，问我有何打算，还建议我与太平洋联盟集团的创始人高天乐（Chris Gradel）见一面，也许有合作的机会。我欣然从命。", "39岁的高天乐看上去比他的岁数还要年轻。他的父母是德国人，在爱尔兰长大，正值北爱尔兰动乱，爱尔兰共和军活跃的时期，他甚至目睹恐怖袭击事件。后来他在牛津大学学习工程和经济学。", "毕业后，他加入罗伯特. 普利兹克（Robert Pritzker）的家族企业。公司的总部在芝加哥，但他被派往河北唐山管理该公司投资的一家传送带工厂。对于这个年轻的欧洲人来说，这是一次开眼界的人生阅历。", "后来，他加入了咨询公司麦肯锡。2002年，他离开麦肯锡，拿着募集来的1000万美元种子资金，成立了自己的投资公司。我们在老中银大厦12楼的意大利餐厅.（Cipriani） 见了面。老中银大厦历史悠久，但自从新中银大厦建成之后，这裹有些楼层就租给餐馆或私人会所。", "当时，高天乐管理基金规模近30亿美元，投资目标很广，好像什么都做，据说业绩也不错。他想搞一个私市股权投资基金，也募集到5亿美元左右，但是表现平平，发展前景并不光明。高天乐显然已经深思熟虑，很快直奔主题一提议我们之间搞个合并。我有些惊讶，说“我还一无所有，拿什么与你合并？”", "毕竟，那时我还没正式离开TPG。高天乐并不在意，说：“你会筹到一大笔钱。”", "我觉得他对我，比我对自己还有信心。我做事从来向最好的方向努力，但做最坏的打算，不会在鸡蛋还没有孵出小鸡的时候就想着会有多少鸡了。而他则迫不及待。他的提议吸引了我。我本来就想早晚要搞一个多产品的平台，和他合并应该是一条快捷方式。高天乐年富力强、富有远见、为人务实，我想会是个优秀的合伙伙伴。我觉得他和唐开罗在很多方面相似，而我和唐开罗在新桥共事了十多年，合作一直非常愉快。", "当时，高天乐的公司已经收购了日本安全资本公司（Secured CapitalJapan）的部分股权，那是一家总部位于东京的房地产投资公司。", "1997年，美国人乔恩-保罗.托匹诺（Jon-Paul Toppino）与合伙人共同创立了这家房地产投资公司。托匹诺在这一行闯荡了十几年，在欧美和亚洲活跃。", "日本安全资本公司的发展可谓顺风顺水：2004年在东京证券交易所挂牌上市，在巅峰时期市值超10亿美元。若高天乐、托匹诺和我能整合各自的业务板块，我们就有机会迅速创建一个多元化、多策略的投资平台。", "这个平台将涵盖三大业务板块一信贷及市场（包括私市贷款、特情况投资、对冲基金等）、实物投资（房地产及基础设施）和私市股权投资（并购基金）。当时亚洲还没有这样的多元化投资平台，前景可我和高天乐一拍即合。在我的建议下，这个平台就叫太盟投资集团（PAG） 。我担任董事长兼首席执行官。我会在这个平台的基础上募集我本来就打算创建的并购基金。", "当消息宣布时，庞德曼一开始不大高兴，以为我弃他而去，却加入了别人的公司。我告诉他并非如此，这是一个合并，以我还不存在的并购基金，和高天乐已有的基金合并，这是我所碰到的最划算的交易。", "几个月后，在新团队的协助下，我完成了一份私募备忘录，以此向投资者募资，计划募集的金额为25亿美元。备忘录提供了有关新团队、策略和主要合伙人业绩的讯息。由于我的业绩都是在新桥和TPG完成的，因此如果没有庞德曼的认可，我不能使用相关的数据。", "2010年9月，庞德曼、TPG首席律师克里夫.博德和我恰巧都在新加坡开会，我们在香格里拉酒店坐下来喝茶。庞德曼说，他和博德都看了我的私募备忘录，没有任何问题，而且他认为我实至名归，没有夸大自己的业绩，也没有贪天之功，我在备忘录中对参与项目的同事给予了认可，庞德曼对此很满意。", "2012年，我所牵头的，也是太盟投资集团的首只收购基金完成25亿美元的融资。日本安全资本公司也已经完全并入。尽管我是董事长兼首席执行官，我把几乎全部精力都放在了私市股权投资的业务上。高天乐和托匹诺分别负责信贷及市场业务和房地产投资业务。我知道我们三人是个绝佳的组合，优秀的团队，前程不可限量。", {"img": "m28-1", "cap": ""}], "wcount": 6211}];
const paper = document.getElementById('paper');
const toc = document.getElementById('toc');
const searchInput = document.getElementById('search');
const totalWc = DATA.reduce((a,c)=>a+(c.wcount||0),0);
document.getElementById('totalWords').textContent = `全书约 ${totalWc.toLocaleString()} 字 · ${DATA.length} 章`;

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function jumpTo(el){
  if(!el) return;
  const jump=()=>window.scrollTo({top:Math.max(0,Math.round(el.getBoundingClientRect().top+window.scrollY-70)),behavior:'instant'});
  jump(); setTimeout(jump,120); setTimeout(jump,450); setTimeout(jump,1000);
}

let paraCounter = 0;
const chEls=[];
DATA.forEach((ch, ci)=>{
  const chap = document.createElement('section');
  chap.className='chapter'; chap.id='ch-'+ci;
  const wc = (ch.wcount||0).toLocaleString();
  chap.innerHTML = `<div class="chapter-head"><span class="badge">${esc(ch.icon)} / ${esc(ch.title)}</span><h1>${esc(ch.title)}</h1><div class="wcmeta">本章约 <b>${wc}</b> 字</div></div>`;
  (ch.paras||[]).forEach(t=>{
    // 图片对象：渲染为插图（点击可在原位放大/还原，不弹全屏）
    if(t && typeof t==='object' && t.img){
      const fig=document.createElement('figure'); fig.className='bookfig';
      fig.innerHTML='<img loading="lazy" src="assets/img/'+esc(t.img)+'.webp" alt="'+esc(t.cap||'插图')+'"><figcaption>'+esc(t.cap||'')+'</figcaption>';
      fig.onclick=function(){this.classList.toggle('bfbig');};
      chap.appendChild(fig); return;
    }
    const p=document.createElement('p'); p.className='para';
    p.dataset.pid='p'+(paraCounter++); p.textContent=t;
    chap.appendChild(p);
  });
  paper.appendChild(chap); chEls.push(chap);
  const item = document.createElement('div');
  item.className='toc-ch';
  item.dataset.search=(ch.title+' '+(ch.paras||[]).filter(x=>typeof x==='string').join(' ')).toLowerCase();
  item.innerHTML = `<div class="toc-ch-title"><span class="num">${esc(ch.icon)}</span><span class="name">${esc(ch.title)}</span><span class="wc">${wc}字</span></div>`;
  item.querySelector('.toc-ch-title').onclick=()=>{ jumpTo(chap); closeSidebar(); };
  toc.appendChild(item);
});

// scroll spy（章级）
const tocItems=[...document.querySelectorAll('.toc-ch')];
const progress=document.getElementById('progress');
const totop=document.getElementById('totop');
function onScroll(){
  let cur=0;
  chEls.forEach((s,i)=>{if(s.getBoundingClientRect().top<=140) cur=i;});
  tocItems.forEach((l,i)=>l.querySelector('.toc-ch-title').classList.toggle('active',i===cur));
  const h=document.documentElement;
  const pct=h.scrollTop/(h.scrollHeight-h.clientHeight)*100;
  progress.style.width=Math.max(0,Math.min(100,pct))+'%';
  totop.classList.toggle('show',h.scrollTop>500);
}
window.addEventListener('scroll',onScroll,{passive:true});
onScroll();

// search: 过滤目录（章标题+正文）
searchInput.addEventListener('input',()=>{
  const q=searchInput.value.trim().toLowerCase();
  tocItems.forEach(l=>{
    const hit=!q || l.dataset.search.includes(q);
    l.classList.toggle('hidden',!hit);
  });
});

document.getElementById('menuBtn').onclick=()=>{sidebar.classList.toggle('open');overlay.classList.toggle('show');};

totop.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});

document.querySelectorAll('.side-tabs button').forEach(btn=>{

    document.querySelectorAll('.side-tabs button').forEach(b=>b.classList.toggle('on',b===btn));

/* ============ 摘录：选中文字 → 标记 + 存入摘录本 ============ */
const SELKEY='pa-excerpts-v1';
let excerpts=[];
try{excerpts=JSON.parse(localStorage.getItem(SELKEY)||'[]');}catch(e){excerpts=[];}

/* ===== EXCERPT-ORDER-v1 摘录原文排序 ===== */
function _pidNum(pid){
  var m=/(\d+)/.exec(String(pid||'')); return m?parseInt(m[1],10):-1;
}
function _excerptCmp(a,b){
  var pa=_pidNum(a.pid), pb=_pidNum(b.pid);
  if(pa!==pb) return pa-pb;                    // 段落全局顺序
  var sa=(a.so==null?0:a.so), sb=(b.so==null?0:b.so);
  if(sa!==sb) return sa-sb;                     // 段内字符偏移
  return (a.time||0)-(b.time||0);               // 兜底：时间
}
function sortByDocOrder(arr){ return arr.slice().sort(_excerptCmp); }

/* ===== PID-FIX-v1 旧数据自愈：给空 pid 摘录反查补 pid ===== */
function healMissingPid(){
  try{
    var raw=localStorage.getItem('pa-excerpts-v1'); if(!raw) return;
    var arr=JSON.parse(raw||'[]'); if(!arr||!arr.length) return;
    var bad=arr.filter(function(x){return x && !x.pid;});
    if(!bad.length) return;

  let acc=0, sn=null, soff=0, en=null, eoff=0, node;
  while((node=walker.nextNode())){
    const len=node.textContent.length;
    if(sn===null && acc+len>so){sn=node;soff=so-acc;}
    if(acc+len>=eo){en=node;eoff=eo-acc;break;}
    acc+=len;
  }
  if(!sn) sn=en; if(!en) en=sn;
  if(!sn||!en) return false;
  try{
    const r=document.createRange();r.setStart(sn,soff);r.setEnd(en,eoff);
    const span=document.createElement('span');
    span.className=cls;span.dataset.eid=eid;
    span.appendChild(r.extractContents());r.insertNode(span);
    return true;
  }catch(e){return false;}
}
