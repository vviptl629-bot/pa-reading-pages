市，担心会出现巨大亏损时。举个例子，如果你买入一个为期一月的，标的为标普500指数的，平价买入期权，你可能会花掉大约250美元，那么就算标普500指数跌倒了0，你最大的损失也就这么多（当然我们假设你是买入了一个看涨期权，而不是错误地卖出一个纯看跌或看涨期权）。即使标普500在下一个小时下跌了1%，你还可以卖出你的看涨期权，而损失不超过100美元如果你在市场的牛市趋势中的回调中买入了看涨期权，那么你也很有可能会在离场时赚到10到20美分的利润，也就是10美元至20美元。这需要标普500指数的价位能够移动25至45美分。反之，如果标普500指数下跌了50%，你可能在亏损30美分的情况下卖出你的看涨期权，也就是亏损30美元。购买看跌或看涨期权，使得新手能够确定他们的风险的上限，对于他们来说，这可能可以使得他们更容易去思考如何交易，而不必一直担心自己的资金。","pid":"p1209"},{"t":"para","text":"在期货或股票市场。如果你一天只做几笔日内交易，那么你将会有更多的精力放在期权市场，特别是如果你还热衷于股票波段交易时。如果详细介绍这些机会，大概需要写完一本书，但是在这里我可以给出值得注意的几点。举个例子，如果根据日线图做多一只股票，而且你愿意在低点加仓，那么你可以在低于市价的一个成交价处卖出一个看跌期权。如果你的股票上涨或者小幅下跌，那么你可以获得期权费，反之，如果股价下跌至看跌期权的成交价下方，那么看跌期权的买方将会把股票卖给你（你被迫在成交价处买入），于是你便在那个更低的价位对多头头寸进行了加仓。","pid":"p1210"},{"t":"para","text":"对于做多股票的交易者来说。另外一种常见的用法是卖出价外看涨期权以获得期权费。卖出这种备兑认购期权每年可能会为你的投资组合增加约10%的收益，但是它偶尔也会把你带离一只正在暴涨的股票。","pid":"p1211"},{"t":"para","text":"如果你预期股票或期货合约会有大的波动，但是你不确定波动的方向，你可以买入跨式期权组合（同时买入一个看跌期权和二个看涨期权），但是你会在两个方向上受到时间价值减退，佣金和买卖价差的影响。所以，跨式期权很少值得考虑。对于期货交易者来说，还有一种替代的方案，即把期货和期权组合成一个德尔塔中性头寸，这意味着这个头寸上涨或下跌获得机会是一样的。举个例子，在标普500期货合约中，一个多头合约就相当于买入500份标普500指数或者10个平价看涨期权。如果你买入一个标普500期货合约（或者500份标普指数）和10个平价看跌期权（或者，你可以做空一份期货合约或者500份标普指数，同时买100份平价看涨期权），当你开始设定交易时，这就是一个德尔塔中性头寸。如果市场上涨或下跌，德尔塔就会改变。如果市场上涨，那么你在期货合约上赚到的就大于你在看跌期权上损失的，如果市场下跌，那么你在看跌期权上赚的就大于你在期货合约上损失的。仅当市场横向盘整若干天时，你才会赔钱，因为你的期权的价值在降低。当市场运动时，为了增加收益，你可以做大量的微型调整，但是标普500期货的日内交易者们太忙了，以至于无法分心调整。","pid":"p1212"},{"t":"para","text":"期权交易者们通常会谈到“催化剂”，指的是即将到来的，会引起股票大幅波动的新闻事件。最常见的催化剂是指即将发布的上市公司盈利报告，不大常见的则包括关于新产品或可能出现的收购的预期信息由于存在不确定性，而且市场上出现大幅上涨或下跌的可能性较大，所以市场上的期权费通常会出现膨胀。新闻已公布，期权费就会暴跌。因此，即使你看到市场在你预期的方向出现了大幅移动，你仍然会亏损。举个例子，假设你认为亚马逊的财报会非常好，所以你在前一天花了5美元买了一个看涨期权，然后事实上它的收益确实很好，亚马逊在开盘的时候涨了5%，然而，你的看涨期权则可能只是在4美元处开盘。你也许会对这个强劲的收益和开盘有一个准确的预期，但是因为期权费的膨胀，使得亚马逊需要上涨10%才能使你的看涨期权增值。因为这些大幅膨胀的期权费的快速损耗。所以你在催化剂之前购买期权时需要格外小心。如果期权的波动性太高，他们会比较贵，同时需要市场出现巨大的移动才能获利。降低此类影响的一种方法就是购买跨期期权价差组合。那样你卖出期权带来的期权费大部分可以抵消你在买入期权上的损失，但是当且仅当你计划持有头寸一周或更长时间时，跨期期权价差组合才值得购买，因为他们通常会在市场出现巨大波动时才能让你获利，或者波动较小但是已经临近到期时才能获利。","pid":"p1213"},{"t":"para","text":"许多指数期权交易者会关注芝加哥期权交易市场波动率指数，它一般与市场指数的运动方向相反，当市场恐慌下跌时它一般会大幅上涨而交易者们将会买进很多看跌期权来保护自己的多头头寸。其他交易者买入看跌期权的原因是为了打赌空头趋势将会恢复。然而，当市场再次上涨之后，看跌期权的买方力量还是会上涨，但买入的原因却不一样。跟之前打赌市场会下跌，或者为了进行做多的套期保值不一样的是，这一次的买入常常是因为自信的做多交易者为了保护自己新的多头头寸。当这种情况发生时，买入看跌期权的现象意味着市场的下行风险较小这些新的做多交易者会在市场抛售时继续持有他们的股票头寸，因为他们已经买了看跌期权作为保护，所以一旦市场真的下跌了，他们也会坚持持有手中的股票和期货头寸，而不是因为恐慌而卖出，导致市场进一步下跌。换言之，这种看跌期权的买入行为意味着市场下行风险减弱，做多交易者变得自信。然而，对我们来说无法区分这种看跌期权的买入行为的动机，是为了进一步的下跌而做的投机，还是为了保护新的头寸。不要把电视专家的观点作为你建仓的基础。如果他们能够通过交易赚钱，那么他们中的大部分人都不会浪费时间在美国消费者新闻与商业频道上发表自己武断的观点。","pid":"p1214"},{"t":"para","text":"很多对冲基金不仅会通过股票来对冲，也会通过买入看跌期权来对冲，他们会在投资组合中加人特定的股票，或者买入大盘看跌期权，比如说标普500看跌期权。对冲基金很少能够完全对冲，大部分对冲基金会通过大盘市场来调整看跌期权的数量。有些基金还会使用波动率指数来调整他们的看跌期权。举例说明，在过去的几周中，如果波动率指数由于股市下跌10%而上涨了20%，对冲基金会买回一部分或者所有的看跌期权，因为这些看跌期权已经完成了他们的保护任务。他们开始在市场高位的时候买入这些看跌期权，作为防止他们的股票投资组合下跌的保护。如果市场出现了抛售，他们的股票的价值下跌了，他们的看跌期权就会升值。当他们在等待市场再次反弹的过程中，他们会通过对看跌期权行权获利，从而变成较弱的对冲状态，或者他们会重新买入新的看跌期权，将他们的对冲远期合约向前滚动变成新的合约，新的合约的成交价往往更低。如果市场强势反弹，他们的对冲就会相对变弱，他们通过会购买更多的看跌期权以防止下行风险。","pid":"p1215"},{"t":"para","text":"如果你是在日线图或者60分钟图表上交易期权，并且非常自信市场将会在接下来的一两天开始运动，那么你最好只买一种期权，而不是期权价差组合。然而，如果你认为市场的运动会在一周或者更长的时间之后才开始，那么你可以通过购买跨期期权价差组合来降低时间衰减的影响。由于短期期权的价值会随着市场向有利于你的方向运动而增加，所以你降低了总的获利可能，但是整体的风险回报比却提升了。一般来说，你应该在靠近支撑区或阻力区的位置选择短期期权的成交价。举例来说，如果标普500指数处在105的位置，并且出现了一个很强的买入信号，但是在108的附近存在阻力，那么你可以买入一个成交价为105的为期一个月的看涨期权，同时通过做空成交价为108的价外看涨期权回收部分资金。买入的看涨期权的净费用大概比卖出的看涨期权的期权费要低1.2美元。由于108是阻力位，而阻力位的作用就像是磁力位，所以市场会被吸引至108的区域附近。两个看涨期权都会增值，但是相较于短期在价位108卖出的看涨期权的损失，长期在价位105的看涨期权获得的收益会更快也更大一些，这将弥补前一个期权的损失，同时还能够有所获利。如果市场通过一个强劲的牛市浪潮反弹，而且你认为市场很容易会突破108的阻力位，你可以买回之前卖出的108看涨期权，继续持有买入的105看涨期权，因为这个期权获得的利润足以弥补前一个期权的损失。如果市场不足以反弹至108处，而且你认为市场接下来很可能会出现卖空潮，你可以退出这个期权价差组合，且以盈利离场你通常不必持有自己的期权价差组合到到期日，虽然那时一般能获得最大的盈利。因为你的预期已经改变了，所以你需要重新评估你的头寸，当交易期权时，你总是需要考虑这一点的。如果到期日，标普500指数正好处于108的价位，那么卖出的108看涨期权将毫无价值，而买入的105看涨期权将会价值3美元，所以你的净盈利为1.80美元。然而，如果市场在到期前两周价格为108。你的净未平仓利润是1.50美元，那么你最好退出，因为在到期前等待市场跌破105时，你并不值得冒险等待1.50美元的利润变成亏损。当市场反弹至108时，你的风险回报比发生了变化，不再像你开始设定交易时那样好。此时你最好获利了结，寻找下一个交易机会。","pid":"p1216"},{"t":"para","text":"交易者既可以买入也可以卖出期权价差组合。举例说明，目前标普500指数处于130的位置，而交易者认为市场还会上涨，所以他可以买入一个牛市价差组合，买入一个执行价在130的平价看涨期权，然后卖出一个更高价位的价外看涨期权，比如说执行价为133。除此之外，他还可以采取另外一种操作，比如说卖出一个熊市差价组合，比如卖出一个执行价为130的平价看跌期权，买入一个执行价为125的价位看跌期权。一般来说，大部分交易者喜欢买入期权价差组合，而非卖出，因为他们喜欢做多，而不是做空平价期权。如果他们做空平价期权，一旦标的价格向不利于他们的方向小幅移动，他们就需要增加一些不必要的工作。举例来说，如果他们做空之前的熊市价差组合，标普500指数跌至129，并且一直在该价格上持续到到期日，那么期权很有可能会被执行，也就是说经纪商会自动将股票以130的价格卖给他们，然后他们就不得不思考如何处理到手的股票以及持有的买入的价外看跌期权。","pid":"p1217"},{"t":"para","text":"当你决定持有交易几周时间，特别是如果你愿意将头寸持有到最后一周时，购买期权价差组合通常是最佳的选择。这是因为，从短期来看，价格总是容易比执行价高，如果你持有的头寸的价格越高于执行价，那么经过时间的衰减它的期权费下降的速度就越快，而在最后一周，这种衰减会剧烈加快。如果你只打算持有期权价差组合几天，而正好你又认为市场在那几天会有剧烈的移动超过你的短期执行价，你还是可以买入期权价差组合的。当且仅当你认为市场将在那一周超越你的短期执行价时，你才应该买入一笔预期持有不到一周的期权价差组合。否则，你就买简单的看涨或看跌期权。举个例子，如果标普500指数的价位正好处于134，你认为它在下一周将会跌至130的位置。你可以买入一个看跌期权，比如说执行价在134的平价看跌期权，或者你可以考虑买入期权价差组合，比图说买入一个执行价在134的看跌期权，卖出一个执行价在132或131的看跌期权。","pid":"p1218"},{"t":"para","text":"即使市场保持不变，期权的价值也会每日衰减。当且仅当你认为你的预期仍然正确的情况下，你才应该持有你的头寸。否则，你就应该离场，即使是亏损的状态下。那么你怎么知道自己的预期是否仍然正确呢？你应该观察这一时刻的市场，想象你并未持有头寸。下一步，问你自己是否会建立那个头寸。如果你认为不会，那么你的预期就不再正确，你应该立即退出。","pid":"p1219"},{"t":"para","text":"新手经常会犯的错误就是持有盈利的期权头寸太久。举例说明，如果一个交易者在市场的震荡区间底部买入了一个看涨期权，希望在下一周可以测试这个震荡区间的中部，但是市场只用一天就触及了那个目标，那么通常最好是在那一点将大部分或全部的头寸获利了结。是的，这个强劲的动能可能是市场牛市趋势的开始，但更有可能的是震荡区间会继续。如果市场之后横向盘整，那么期权费会随着时间损耗，如果市场之后回调，那么利润将会消失。期权的利润消失得很快，所以一旦出现了利润赶紧落袋为安才是最重要的。","pid":"p1220"},{"t":"para","text":"一只股票很有名，但这并不意味着它的期权会有很高的成交量。如果交易量不大，那么它的买卖价差可能会大到你无法接受。举例说明，一个平价看涨期权的买价可能是1.20美元，而卖价可能是1.80美元。这意味着你可能不得不用1.80美元买入，如果你立即卖出，你只能收回1.20美元，你将立即损失60美元，也就是你所付出的资本的三分之一。通常来说，如果你所考虑要交易的期权的未平仓量低于1000，或者近期日成交量不足300，那么通常你就不应该交易。如果可以的话，你应该尽量不交易成交量小的期权。不过，如果你真的想做的话，你应该总是使用限价订单入场和离场。即使这样做了，你可能也需要等待几个小时，才能等到你的订单被执行，有时你可能会放弃你的订单而离开市场，而这将极大地降低你的盈利潜能。对于标普500这种活跃的期权市场来说，最大的好处之一就是在第一个月平价期权和近价期权的买卖价差通常只有1便士，所以你可以设定市场订单，然后在极好的价位上获得执行。","pid":"p1221"},{"t":"para","text":"仅仅是较大的买卖价差并不应该成为你买入一个期权的阻碍，因为价差是与股票的价格成正比的。当苹果的股票价格为300美元时，它的平价看涨期权的买卖价差可能是20美分，这对于新手来说，可能有些大。但是，如果股票的价格是30美元，而期权的买卖价差是2美分，那么交易者可能会毫不犹豫地买入。当每一个苹果股票的看涨期权对应的股票价格是30美元时，他们可能会买10份看涨期权。这是一种在数学上恰当的交易方法。","pid":"p1222"},{"t":"para","text":"如果你在日线图上处于强劲的趋势时入场，而此时市场还离目标有段距离，此时期权价差组合可能就会非常有用。比如。如果市场上的标普500指数处于118的点位，在一个新的熊市趋势里，市场快速跌至移动平均线的下方，然后，你相信市场将会在接下来的几天内触及115这个点位，你可能很犹豫是否要买入一个看跌期权。因为市场在跌到这个点位之前也很有可能会突然反弹至移动平均线。作为替代，你可以买入一个执行价为118的看跌期权，卖出一个执行价为115的看跌期权。如果市场在接下来的几天毫不停留地跌至115的支撑区，你可以获得1.50美元的利润，离开你的熊市价差期权组合。如果正好相反，市场反弹至120处的移动平均线，你的价差组合可能会在账面上亏损1美元。如果你认为你的预期还是正确的，你可以对你的期权组合进行分解操作，买回你卖出的期权。也许会获得50美分的盈利，然后继续持有买入的期权。如果你的预期是正确的，市场在接下来的几周跌至你的目标区域115处，那么你可能在买入看跌期权上额外获利2美元，这次交易的总利润为2.50美元。当市场对你不利时，你需要足够的经验对你的期权组合进行调整，不过如果你对自己阅读图表的能力足够自信的话，这可能是一种不错的方法","pid":"p1223"},{"t":"para","text":"顺便一提的是，在支撑位和阻力位卖空期权增加了这些区域的力量，因为期权一般在到期时，会在执行价附近有最大的未平仓量。在期权的执行价处的大量成交量会增强那一价位的磁力。于是就增加了那个价位的支撑和阻力。如果成交量足够大，那么可能会对到期日前后的市场产生影响。如果市场上有明显的支撑或阻力位，则成交量可以变得很大，因为那个执行价会产生大量的期权交易。实际上，标普500指数和纳斯达克100指数的看跌或看涨期权通常在到期时会靠近标的物的执行价，同时也会产生大量的未平仓交易。期权的买方通常是机构，他们相较于普通的交易者更聪明，而且他们会尽一切可能在期权市场或其他相关市场进行操作，以使得期权没有价值从而不会被行权，这样他们就能够不付任何代价地坐收期权费。","pid":"p1224"},{"t":"para","text":"VIX是对标普500指数期权的波动率的衡量，当市场出现了一波大牛市而且你相信接下来还可能继续时，买入一个看涨期权，或者直接买入标普500指数或期货合约都是很好的交易策略，但是你要注意的是与波动率有关的风险。顺便提一句。VIX的每16点对应着预期的标准普尔500指数的平均日区间的1%（所以，一个32点的VIX意味着标普500指数和期货合约的平均日区间约为2%）。如果趋势足够强劲，那么VIX也可能会上涨，那么你买入看涨期权的费用会在购买时评估。如果接下来一两个小时，。市场的多头趋势较为稳定了，那么市场的VIX也许会下跌，从而你的期权的价值不会增加。基于此，当你希望在牛市买入看涨期权，或者在熊市买入看跌期权时。如果在趋势形成的早期你没有来得及买入。你最好等待市场回调时再买入，这样你可以降低在VIX上涨的过程中买入的风险。因为VIX的上涨会导致所有的期权费用的上涨。","pid":"p1225"},{"t":"para","text":"期权波动率的大幅上升，通常会导致价外期权价格不成比例的上涨。这种现象被称为扭曲，扭曲的价格可能会令使用期权价差组合的新手感到不安，因为它将导致获得的利润会小于合理估计的数值。如果在一个牛市市场中，当标普500指数在价位133处震荡，一个交易者买入了一个133/128的熊市价差组合，付出了3.50美元买入执行价为133的看跌期权，通过卖空128的看跌期权收获2美元。之后由于出现了某种世界性危机，标普500指数在接下来的两周下跌了4美元，那么交易者也许会认为这个价差期权组合的的价值也会增加4美元。然而，因为当市场急剧下跌时，有如此多的交易者为了保护他们的多头而买入价外看跌期权，所以价外期权的价格上涨的比例同平价期权价格上涨的比例不成比例，所以这个价差组合的可能只能获得2.50美元，或者1美元的盈利。当市场暴跌时，波动率也迅速上升，它将对价外看跌期权（以及看涨期权）产生更大的影响。事实上，市场可能需要比那个较低的执行价低5%。也许价格要到123，才能让这个价差组合在到期前周能够有5美元的利润。当且市场跌破了组合中最低的执行价，或者在到期前的最后一周期间，期权价差组合才能接近他们的潜在利润。对于交易者来说，当他们预期市场在接下来的几周会向靠近他们卖空的期权的执行价移动时。或者如果愿意在到期前一周左右退出时，他们才应该买入价差期权组合。如果到期时，标普500指数的成交价小于128，也就是那个较低的期权的执行价，那么这个组合将获得5美元全部的利润，但是大部分的交易者在那之前就已经离场了。","pid":"p1226"},{"t":"para","text":"因为在日线图中的趋势强劲时期，价外期权通常会出现扭曲。所以如果他们预期下周左右会出现一波上涨或下跌，他们应该考虑直接购买期权。举例说明，如果他们想在到期日之前几周离场，他们就不应该考虑买入期权价差组合。比如，如果市场刚刚在日线图上下跌了3%，现在回调至一个可能的更低的高点，交易者认为在接下来的几天中市场会出现第二波强劲的下跌浪，那么此时他们最好直接买入一个看跌期权而不是期权价差组合。如果他们愿意以3美元的价格买入两个熊市价差组合，倒不如考虑以3.50美元的价格购买一个平价看跌期权。如果下周市场真的如他们预期的那样出现了剧烈下跌，那么如果市场快速跌至128处，他们的看跌期权可能会价值7.50美元（有了3美元的盈利）这比他们希望赚到的5美元要小（这5美元是指他们买入看跌期权时的标普500指数的价位133与最近的价位128之间的差值），但是却比他们在两个熊市价差组合上赚的2美元要多很多。如果在几天之内，他们的看跌期权快速升值3美元或4美元，那么他们应该卖出头寸，因为市场很可能会回调，并且进入震荡区间。如果他们继续持有看跌期权，那4美元的盈利可能会快速变成2美元的盈利。市场的反弹会让他们知道他们的预期不再正确，所以他们会以2美元的盈利离场，并且希望自己之前没有那么贪婪便好。期权市场总是会给交易者提供意料之外的礼物，但是很少像新手想象的那么符合逻辑。当期权市场给予礼物时，最好总是接受它，然后寻找下一个交易机会。","pid":"p1227"},{"t":"para","text":"当股市处于强劲的上涨趋势中，交易者可以买入看涨期权或牛市价差组合。很多在强劲的牛市趋势中的交易者买入看涨期权很喜欢买价外看涨期权，因为时间价值的衰减会更低一些。","pid":"p1228"},{"t":"img","src":"assets/img/p4c3_001.webp","ctx":[{"t":"因为在日线图中的趋势强劲时期，价外期权通常会出现扭曲。所以如果他们预期下周左右会出现一波上涨或下跌，他们应该考虑直接购买期权。举例说明，如果他们想在到期日之前几周离场，他们就不应该考虑买入期权价差组合。比如，如果市场刚刚在日线图上下跌了3%，现在回调至一个可能的更低的高点，交易者认为在接下来的几天中市场会出现第二波强劲的下跌浪，那么此时他们最好直接买入一个看跌期权而不是期权价差组合。如果他们愿意以3美元的价格买入两个熊市价差组合，倒不如考虑以3.50美元的价格购买一个平价看跌期权。如果下周市场真的如他们预期的那样出现了剧烈下跌，那么如果市场快速跌至128处，他们的看跌期权可能会价值7.50美元（有了3美元的盈利）这比他们希望赚到的5美元要小（这5美元是指他们买入看跌期权时的标普500指数的价位133与最近的价位128之间的差值），但是却比他们在两个熊市价差组合上赚的2美元要多很多。如果在几天之内，他们的看跌期权快速升值3美元或4美元，那么他们应该卖出头寸，因为市场很可能会回调，并且进入震荡区间。如果他们继续持有看跌期权，那4美元的盈利可能会快速变成2美元的盈利。市场的反弹会让他们知道他们的预期不再正确，所以他们会以2美元的盈利离场，并且希望自己之前没有那么贪婪便好。期权市场总是会给交易者提供意料之外的礼物，但是很少像新手想象的那么符合逻辑。当期权市场给予礼物时，最好总是接受它，然后寻找下一个交易机会。","p":"p1227"},{"t":"当股市处于强劲的上涨趋势中，交易者可以买入看涨期权或牛市价差组合。很多在强劲的牛市趋势中的交易者买入看涨期权很喜欢买价外看涨期权，因为时间价值的衰减会更低一些。","p":"p1228"},{"t":"如图23.1所示。关于苹果的股票的日线图上出现了几个牛市趋势。他们都是由二系列有着较小的尾部的牛市趋势K线组成，且K线与K线之间极少重叠。因为股票的动能强劲，所以向更高的价格上涨的可能性更大。如果交易者想参与到这股上升浪中来，他们将会买入看涨期权或者牛市价差组合。他们可以在几天之后部分获利了结，之后在市场第一次出现反转迹象或者在他们入场价位附近出现回调时再退出所有的剩余头寸。","p":"p1229"},{"t":"当市场趋势上涨时，交易者希望买入，但是希望在价格略低处买入，所以他们常常卖出一个略低于市价的看跌期权。举例说明，在图中阴影部分标识的牛市区间。一个交易者可以卖出一个为期一月的看跌期权，大概是一个期权费为2%的价外期权，也就是8美元。如果市场下跌，期权将会行权。他们将得到股票，相当于他们以低手当前价位2%的价格入场，他们会感到非常开心。反之，如果市场继续上涨，那么他们得到了8美元的期权费，也相当于在一个月里获得了2%的收益。举例说明：当市场处于260的价格，且剧烈上升时，他们可以卖出一个执行价为260为期一个月的看跌期权，期权费收取12美元。即使他们的期权执行了，他们也能获得12美元的期权费，也就是说他们购买这只股票的净费用时248，即使这只股票从未大幅跌破260，而是保持继续上涨的形式。","p":"p1230"},{"t":"如果市场处于台阶形态中时，你可以利用期权在每个突破处进行反向交易，预期市场会向前一台阶回调。","p":"p1231"}]},{"t":"para","text":"如图23.1所示。关于苹果的股票的日线图上出现了几个牛市趋势。他们都是由二系列有着较小的尾部的牛市趋势K线组成，且K线与K线之间极少重叠。因为股票的动能强劲，所以向更高的价格上涨的可能性更大。如果交易者想参与到这股上升浪中来，他们将会买入看涨期权或者牛市价差组合。他们可以在几天之后部分获利了结，之后在市场第一次出现反转迹象或者在他们入场价位附近出现回调时再退出所有的剩余头寸。","pid":"p1229"},{"t":"para","text":"当市场趋势上涨时，交易者希望买入，但是希望在价格略低处买入，所以他们常常卖出一个略低于市价的看跌期权。举例说明，在图中阴影部分标识的牛市区间。一个交易者可以卖出一个为期一月的看跌期权，大概是一个期权费为2%的价外期权，也就是8美元。如果市场下跌，期权将会行权。他们将得到股票，相当于他们以低手当前价位2%的价格入场，他们会感到非常开心。反之，如果市场继续上涨，那么他们得到了8美元的期权费，也相当于在一个月里获得了2%的收益。举例说明：当市场处于260的价格，且剧烈上升时，他们可以卖出一个执行价为260为期一个月的看跌期权，期权费收取12美元。即使他们的期权执行了，他们也能获得12美元的期权费，也就是说他们购买这只股票的净费用时248，即使这只股票从未大幅跌破260，而是保持继续上涨的形式。","pid":"p1230"},{"t":"para","text":"如果市场处于台阶形态中时，你可以利用期权在每个突破处进行反向交易，预期市场会向前一台阶回调。","pid":"p1231"},{"t":"img","src":"assets/img/p4c3_002.webp","ctx":[{"t":"当市场趋势上涨时，交易者希望买入，但是希望在价格略低处买入，所以他们常常卖出一个略低于市价的看跌期权。举例说明，在图中阴影部分标识的牛市区间。一个交易者可以卖出一个为期一月的看跌期权，大概是一个期权费为2%的价外期权，也就是8美元。如果市场下跌，期权将会行权。他们将得到股票，相当于他们以低手当前价位2%的价格入场，他们会感到非常开心。反之，如果市场继续上涨，那么他们得到了8美元的期权费，也相当于在一个月里获得了2%的收益。举例说明：当市场处于260的价格，且剧烈上升时，他们可以卖出一个执行价为260为期一个月的看跌期权，期权费收取12美元。即使他们的期权执行了，他们也能获得12美元的期权费，也就是说他们购买这只股票的净费用时248，即使这只股票从未大幅跌破260，而是保持继续上涨的形式。","p":"p1230"},{"t":"如果市场处于台阶形态中时，你可以利用期权在每个突破处进行反向交易，预期市场会向前一台阶回调。","p":"p1231"},{"t":"如图23.2所示，当市场反弹至K线4后，FCX的日线图出现了一波回调，回调至K线4这个高点的下方，这意味着做多交易者目前不是太强。如果交易者认为市场在突破K线4之后，紧接着会一波回调向下突破K线4，一旦当天有明显的信号显示这是一个强劲的熊市趋势日，则交易者可以在K线5这个十字星处或者在次日收盘前买入看跌期权。","p":"p1232"},{"t":"市场在K线9处开始向上反转，当超越K线7的低点几美元时，交易者可以在K线11的收盘处或收盘之前买入看涨期权，预测市场会超过K线9的低点几美元。在K线13的收盘处，他们可能会再次买入看涨期权，因为他们看到了这根K线的底部出现了巨大的尾部。","p":"p1233"},{"t":"K线12是一根熊市反转K线和一个潜在的最终旗形反转，一个移动平均缺口K线，与K线10一起组成了双重顶部，在这个可能的震荡区间顶部形成了一个较弱的高点1或高点2的突破。在这一天的结束处买入看跌期权是合理的。由于市场从K线5开始便处于较宽的熊市通道内，许多交易者会在前一波下跌浪的中点上方，或者均线附近的每一波反弹处购买看跌期权。很多人会等到当日的收盘附近，确信这一天是熊市趋势日之后再操作，比如说在K线8、10、12以及K线14后面的一根K线。他们会在最近的波段低点下方获利了结，所有做空交易者获得了利润。而做多交易者还在买入，结果使得市场在每一个新低处都向上反转。在新低处，做空交易者买回他们的空头头寸，而不是继续之前的预期，在市场突破时进一步做空。这就表明，熊市趋势正在向双边市场（震荡区间）转变。","p":"p1234"},{"t":"当市场处于震荡区间时，交易者可以在震荡区间的顶部买入看跌期权，然后退出之前买入的看涨期权，在震荡区间的底部，又一次买入看涨期权，退出买入的看跌期权。","p":"p1235"}]},{"t":"para","text":"如图23.2所示，当市场反弹至K线4后，FCX的日线图出现了一波回调，回调至K线4这个高点的下方，这意味着做多交易者目前不是太强。如果交易者认为市场在突破K线4之后，紧接着会一波回调向下突破K线4，一旦当天有明显的信号显示这是一个强劲的熊市趋势日，则交易者可以在K线5这个十字星处或者在次日收盘前买入看跌期权。","pid":"p1232"},{"t":"para","text":"市场在K线9处开始向上反转，当超越K线7的低点几美元时，交易者可以在K线11的收盘处或收盘之前买入看涨期权，预测市场会超过K线9的低点几美元。在K线13的收盘处，他们可能会再次买入看涨期权，因为他们看到了这根K线的底部出现了巨大的尾部。","pid":"p1233"},{"t":"para","text":"K线12是一根熊市反转K线和一个潜在的最终旗形反转，一个移动平均缺口K线，与K线10一起组成了双重顶部，在这个可能的震荡区间顶部形成了一个较弱的高点1或高点2的突破。在这一天的结束处买入看跌期权是合理的。由于市场从K线5开始便处于较宽的熊市通道内，许多交易者会在前一波下跌浪的中点上方，或者均线附近的每一波反弹处购买看跌期权。很多人会等到当日的收盘附近，确信这一天是熊市趋势日之后再操作，比如说在K线8、10、12以及K线14后面的一根K线。他们会在最近的波段低点下方获利了结，所有做空交易者获得了利润。而做多交易者还在买入，结果使得市场在每一个新低处都向上反转。在新低处，做空交易者买回他们的空头头寸，而不是继续之前的预期，在市场突破时进一步做空。这就表明，熊市趋势正在向双边市场（震荡区间）转变。","pid":"p1234"},{"t":"para","text":"当市场处于震荡区间时，交易者可以在震荡区间的顶部买入看跌期权，然后退出之前买入的看涨期权，在震荡区间的底部，又一次买入看涨期权，退出买入的看跌期权。","pid":"p1235"},{"t":"img","src":"assets/img/p4c3_003.webp","ctx":[{"t":"K线12是一根熊市反转K线和一个潜在的最终旗形反转，一个移动平均缺口K线，与K线10一起组成了双重顶部，在这个可能的震荡区间顶部形成了一个较弱的高点1或高点2的突破。在这一天的结束处买入看跌期权是合理的。由于市场从K线5开始便处于较宽的熊市通道内，许多交易者会在前一波下跌浪的中点上方，或者均线附近的每一波反弹处购买看跌期权。很多人会等到当日的收盘附近，确信这一天是熊市趋势日之后再操作，比如说在K线8、10、12以及K线14后面的一根K线。他们会在最近的波段低点下方获利了结，所有做空交易者获得了利润。而做多交易者还在买入，结果使得市场在每一个新低处都向上反转。在新低处，做空交易者买回他们的空头头寸，而不是继续之前的预期，在市场突破时进一步做空。这就表明，熊市趋势正在向双边市场（震荡区间）转变。","p":"p1234"},{"t":"当市场处于震荡区间时，交易者可以在震荡区间的顶部买入看跌期权，然后退出之前买入的看涨期权，在震荡区间的底部，又一次买入看涨期权，退出买入的看跌期权。","p":"p1235"},{"t":"如图23.3所示，在市场从K线5的低点处向上反转时，摩根士丹利的股票在K线9之后出现了向下反转，这是市场第二次尝试向上突破K线2的高点。由于市场出现了一波上升至K线6的上升浪，之后市场回调至K线7，所以截至K线9之前的三波上推浪（K线6是第一波上推浪）的作用像是形成了一条上升通道，随后市场对这个通道的底部K线7进行了测试。交易者可以在K线9后面的第三根熊市的收盘处附近买入看跌期权。","p":"p1236"},{"t":"K线11是一条牛市反转K线。与K线7一起形成了二个双重底部牛市旗形，也是K线10之前的下跌浪的通道底部。交易者可以在这根K线的收盘处，退出看跌期权，买入看涨期权。","p":"p1237"},{"t":"K线13后面的K线具有一个熊市主体。交易者可以在这个区间的顶部退出他们的看涨期权，买入看跌期权，特别是因为这里还是一个模形熊市旗形。在K线10之后的两根K线形成了第一波上升浪，而K线12是第二波。","p":"p1238"},{"t":"K线15之前的下跌浪非常强劲，虽然K线15与K线11形成了一个双重底部，在它可以大幅反弹之前，市场还需要更多的支持力量。如果交易者真的在这里买入看涨期权，那么就应该在这个楔形熊市旗形的顶部K线16出现反转时获利。","p":"p1239"},{"t":"K线17是一条牛市反转K线，是继K线9之后出现的第三波下推浪。在市场从K线5剧烈移动到K线9之后，许多交易者把它看作是一个潜在的牛市三角形，所以这是一个买入看涨期权的时机。它也是在震荡区间的底部低点2处开始出现的向上反转（K线7、11和15构成了这个区间的底部）。在震荡区间的底部出现的低点2的卖空信号通常会失败，从而导致趋势反转向上，就像大部分突破震荡区间的尝试一样。","p":"p1240"},{"t":"当专业期权交易者认为市场将会反弹，他们有时候会使用风险反转策略，这超过了本书的讨论范围。举个例子，如果市场从K线5的低点处强烈反转，之后进入了震荡区间。许多交易者认为市场很有可能会再次测试震荡区间的顶部，甚至有可能会突破一个新的高点。在K线15的双重底部形成后。期权交易者看到市场在24价位附近有强势买入，他将很开心在此处买入。因为他相信市场将会继续走高。所以他将会在市场从三角形底部K线15处（与K线7和K线11一起形成的三角形）开始反弹时，买入一个看涨期权。如果他以1.50美元买入一个为期一个月的11月到期的执行价为26的价外期权的价外看涨期权，那么或许只能通过卖出一个执行价为24的价外看跌期权才能收回之前的买入费用，因为通过卖出期权他将收获1.50美元期权费用。所以他的买卖操作成本为0，这个策略就被叫作“风险反转”。如果市场下跌至24，股票将会以24美元的价格卖给他，这也是他希望买入股票的价格。之后他将持有这只股票的多头头寸和一个看涨期权。如果市场急剧下跌，他将在看涨期权上损失1.50美元的费用，同时股票跌破他的执行价24美元多少，他就会损失多少。然而，他认为这不太可能会发生，在这种情况下，他有70%的可能会获利。市场暂时跌破24美元，在距离到期还有很多周的情况下。只是一根K线的小幅下滑并不足以使得看跌期权会被行权。如果看跌期权被行权了，他将同时持有股票和看涨期权，当市场在K线18处测试震荡区间的顶部时，他将同时获利。如果看跌期权没有行权，他将结束风险反转操作，并通过看涨期权和卖出的看跌期权盈利丰厚，此时看跌期权的价值已经接近于0（当他卖出时获得了1.50美元，现在买回只需要花10美分）。使用风险反转策略相当于你已经认为市场会形成更低的低点的主要趋势反转。交易者相信市场正在反转向上，一旦市场跌入了更低的低点，那么就会自信地买入（也就是卖出的看跌期权被行权）。","p":"p1241"}]},{"t":"para","text":"如图23.3所示，在市场从K线5的低点处向上反转时，摩根士丹利的股票在K线9之后出现了向下反转，这是市场第二次尝试向上突破K线2的高点。由于市场出现了一波上升至K线6的上升浪，之后市场回调至K线7，所以截至K线9之前的三波上推浪（K线6是第一波上推浪）的作用像是形成了一条上升通道，随后市场对这个通道的底部K线7进行了测试。交易者可以在K线9后面的第三根熊市的收盘处附近买入看跌期权。","pid":"p1236"},{"t":"para","text":"K线11是一条牛市反转K线。与K线7一起形成了二个双重底部牛市旗形，也是K线10之前的下跌浪的通道底部。交易者可以在这根K线的收盘处，退出看跌期权，买入看涨期权。","pid":"p1237"},{"t":"para","text":"K线13后面的K线具有一个熊市主体。交易者可以在这个区间的顶部退出他们的看涨期权，买入看跌期权，特别是因为这里还是一个模形熊市旗形。在K线10之后的两根K线形成了第一波上升浪，而K线12是第二波。","pid":"p1238"},{"t":"para","text":"K线15之前的下跌浪非常强劲，虽然K线15与K线11形成了一个双重底部，在它可以大幅反弹之前，市场还需要更多的支持力量。如果交易者真的在这里买入看涨期权，那么就应该在这个楔形熊市旗形的顶部K线16出现反转时获利。","pid":"p1239"},{"t":"para","text":"K线17是一条牛市反转K线，是继K线9之后出现的第三波下推浪。在市场从K线5剧烈移动到K线9之后，许多交易者把它看作是一个潜在的牛市三角形，所以这是一个买入看涨期权的时机。它也是在震荡区间的底部低点2处开始出现的向上反转（K线7、11和15构成了这个区间的底部）。在震荡区间的底部出现的低点2的卖空信号通常会失败，从而导致趋势反转向上，就像大部分突破震荡区间的尝试一样。","pid":"p1240"},{"t":"para","text":"当专业期权交易者认为市场将会反弹，他们有时候会使用风险反转策略，这超过了本书的讨论范围。举个例子，如果市场从K线5的低点处强烈反转，之后进入了震荡区间。许多交易者认为市场很有可能会再次测试震 K线3是一个买入高潮，也是牛市通道的突破，它之后跟随了一个强劲的熊市K线。这意味着做空交易者正在变得激进。随着K线4之前形成了两波一波更比一波高的上升浪，我们认为市场会再次测试移动平均线是合理的当K线6收盘时，很多交易者认为它的低点很可能会被测试。较高的波动率增加了期权的费用，所以看跌期权的费用因为一根大K线而被放大了。交易者可以选择买入一个熊市价差组合，买入一个一月期的执行价为113的价位看跌期权，卖空一个低于执行价4个价位的看跌期权。如果卖出的期权的执行价太低，那么它的价值就太低了，也不值得卖空。如果市场快速跌至109的下方，交易者可以了结获利离场。然而，一旦他们继续持有期权，并看到市场在K线7处反弹至移动平均线，他们将会买回之前卖空的109看跌期权，此时它的价值已经大幅降低，然后继续持有113看跌期权，尽管它的价值也降低了。然而，因为在接下来的几根K线中看跌期权的价值又快速上升，于是交易者将在这个期权价差组合的两侧都赚到利润。这个就被称作是跳出期权价差组合，因为你是不同的时间退出这两部分期权的。","p":"p1243"},{"t":"在K线6这根大型熊市K线之后，K线7测试了移动平均线。之后出现下跌潮的概率较大，至少是下跌到之前的熊市浪潮的中部。交易者可以在移动平均线上买入看跌期权，或者当他们看到K线7正在变成一根强劲的熊市K线时，他们可以在K线7这根强劲的熊市K线收盘之前买入。","p":"p1244"},{"t":"K线9是一根强劲的牛市趋势K线，也是三根K线中的第二根强劲的牛市趋势K线，因此是买方压力的征兆。在这个价位，K线6底部出现的长尾也是强势买入的征兆。所以市场测试移动平均线的概率很大交易者可以在K线9收盘之前买入看涨期权，一旦他们看到这根K线很有可能会演变成强劲的牛市反转K线。","p":"p1245"},{"t":"K线13是市场从大熊市趋势和三角形的底部下方开始的第二次向上反转尝试，而K线6和K线9形成了最初的两波下跌浪。K线13也是一根牛市反转K线，同时也预示着在105附近有买方压力。交易者可以在这根K线的收盘处买入看涨期权。","p":"p1246"},{"t":"K线14是一根强劲的熊市反转K线，一根移动平均缺口K线，也是楔形熊市旗形的顶部，所以一旦交易者看到这根K线正在演变成一根强劲的熊市K线，他们可以在收盘处买入看跌期权。","p":"p1247"},{"t":"K线15是一个较为冒险的买入看涨期权的入场点，因为下行动能非常强劲，而它是从K线4的高点开始的第三波下推浪，而K线6是第一波，K线8至K线13形成了第二波。一旦交易者看到K线16之前的上升浪有多强烈，他们就可以在大型楔形底部和强劲的牛市浪潮之后，形成的第二波上升浪也就是牛市反转K线17收盘前买入看涨期权。","p":"p1248"},{"t":"市场在K线19之前的5根K线处暂停了，十字星的收盘形态足以作为你在楔形顶部（K线16、18、19）和K线14形成的双重顶部处买入看跌期权的原因。","p":"p1249"},{"t":"在一个强劲的熊市浪潮过后，K线21是一个回调至移动平均线的两浪回调，所以交易者看到两条十字星K线均未能在移动平均线上方收盘时，他们可以在收盘处买入看跌期权。","p":"p1250"},{"t":"在过去的5根K线中。K线23是第三根牛市K线，这是市场买盘压力的征兆。市场在反弹至K线19之后，正在努力形成一个更高的低点。这也是从K线19开始形成的下跌通道，与K线18后面的低点和K线20构成了二个楔形牛市旗形。交易者可以在多头收盘或下一天收盘处买入看涨期权，这是一条有着较短尾部的大型牛市K线，其收盘价远在移动平均线上方。这也是在巨大的底部后形成的一个强劲牛市浪潮的一部分，后面还可能会出现更高的价格。如果他们计划持有一两周，那么他们可以购买牛市价差组合而非看涨期权，这样可以降低时间价值衰减的影响。","p":"p1251"},{"t":"K线31是在市场向上突破保护性牛市通道后形成的熊市反转K线，最低限度，这个市场将会测试移动平均线，同时刺穿这个通道的底部。这是一个绝佳的机会买入看跌期权。实际上，当市场高于前一根K线的高点时，交易者就可以在开盘时买入看跌期权。为什么这是一笔好的交易呢？当市场向上突破一条很长的牛市通道时，它通常会在这个通道的底部反转，而这个反转通常是在5根K线之内。因此，在第三根K线上方买入看跌期权的风险有限。","p":"p1252"},{"t":"这条通道有一个非同寻常的特点。在过去的10年中。市场第一次在连续了这么多K线后没有触及移动平均线（K线26、28和30都没有触及它），出现这种情况后，就会在同样多K线的之后市场测试移动平均线的情况。极端的行为提供了市场向平均交易回归的倾向。如果市场正在做过去很多年都没有出现过的事情，那么这种行为将很快停止，则期权交易者可以做反向交易。当你看到某种异常行情时，你就回顾一下之前的数据和市场，看看这行情到底有多么反常。如果你在过去10年或20年的数据上做历史回调，你将会发现在95%以上的时间里，当出现30根K线或者更多的连续缺口K线时，市场会在10根K线以内返回并触及均线。看到这一点的交易者们都开始将多头头寸获利了结，并且在前一根K线的高点上方买入看跌期权，他们认为市场将会测试移动平均线。市场将在不久之后测试移动平均线的概率很高，所以在这里买入看跌期权是一个非常好的交易，交易者也可以在K线32市场测试移动平均线时获利。举例来说，一旦市场在K线31之前形成了一个一根K线的回调，那么交易者可以超越这根K线的高点处的任何点买入看跌期权，一般来说在下一根K线会出现这样的机会。市场从K线31的向上跳空看盘处下跌，在一条狭窄的牛市通道形成很长的时间后，做空交易者开始在这个通道的顶部波段高点的上方以及之前的K线的高点上方入场。当有一些异常现象发生时，这些现象通常是不能持续的因此高潮和随后的回调都比大部分交易预期的幅度要大。持续的时间更长，所以K线31的高点很有可能会持续几周时间，而市场也至少会形成一个两浪的震荡下跌调整。调整的规模和数量应该同之前的浪潮中的K线数量和点数相近，因为市场倾向于做重复的事情（惯性）。","p":"p1253"},{"t":"在K线3之前的上升浪以及从K线36上升至39的上升浪中，也形成了类似的强劲而紧凑的多头通道。交易者在先前K线的高点上方和在牛市趋势K线的收盘处（可能是消耗性买入高潮），以及在这些牛市趋势K线之后出现的小型K线处买入看跌期权，预期市场会在一到三日内出现向下的测试。在日线图上。这些购买看跌期权的交易者通过刮头皮交易赚取了50美分至1美元的利润。","p":"p1254"},{"t":"另一个极端的市场行为出现在K线42处。在标普500指数的图表上，虽然市场从K线41处开始的上升潮中出现了很多小型熊市K线，但是在标普500期货合约的图表上并没有出现。相反，它形成了15条连续的牛市趋势K线，这在过去的几年里都没有发生。这意味着这就是一种极端行情，所以是高潮行为。在K线42之前的若干K线中，聪明的做空交易者开始对看跌期权的头寸逐步加仓，预期至少会出现一波两浪的，下跌至移动平均线下方的至少持续10根K线的调整浪。","p":"p1255"}]},{"t":"para","text":"如图23.4所示，标普500的日线图不断提供了买入期权的机会。","pid":"p1242"},{"t":"para","text":"K线4之前形成的两波一波高于一波的上升浪。是测试移动平均线的非常好的买入看跌期权时机。市场同K线3一起形成了一个小型的双重顶部，所以牛市区间演变成震荡区间的概率很高，在这种情况下，测试区间的底部和移动平均线是很有可能的。一旦交易者看见市场上的K线很可能演变成强劲的熊市K线时，他们可以在市场收盘之前买入看跌期权。K线3是一个买入高潮，也是牛市通道的突破，它之后跟随了一个强劲的熊市K线。这意味着做空交易者正在变得激进。随着K线4之前形成了两波一波更比一波高的上升浪，我们认为市场会再次测试移动平均线是合理的当K线6收盘时，很多交易者认为它的低点很可能会被测试。较高的波动率增加了期权的费用，所以看跌期权的费用因为一根大K线而被放大了。交易者可以选择买入一个熊市价差组合，买入一个一月期的执行价为113的价位看跌期权，卖空一个低于执行价4个价位的看跌期权。如果卖出的期权的执行价太低，那么它的价值就太低了，也不值得卖空。如果市场快速跌至109的下方，交易者可以了结获利离场。然而，一旦他们继续持有期权，并看到市场在K线7处反弹至移动平均线，他们将会买回之前卖空的109看跌期权，此时它的价值已经大幅降低，然后继续持有113看跌期权，尽管它的价值也降低了。然而，因为在接下来的几根K线中看跌期权的价值又快速上升，于是交易者将在这个期权价差组合的两侧都赚到利润。这个就被称作是跳出期权价差组合，因为你是不同的时间退出这两部分期权的。","pid":"p1243"},{"t":"para","text":"在K线6这根大型熊市K线之后，K线7测试了移动平均线。之后出现下跌潮的概率较大，至少是下跌到之前的熊市浪潮的中部。交易者可以在移动平均线上买入看跌期权，或者当他们看到K线7正在变成一根强劲的熊市K线时，他们可以在K线7这根强劲的熊市K线收盘之前买入。","pid":"p1244"},{"t":"para","text":"K线9是一根强劲的牛市趋势K线，也是三根K线中的第二根强劲的牛市趋势K线，因此是买方压力的征兆。在这个价位，K线6底部出现的长尾也是强势买入的征兆。所以市场测试移动平均线的概率很大交易者可以在K线9收盘之前买入看涨期权，一旦他们看到这根K线很有可能会演变成强劲的牛市反转K线。","pid":"p1245"},{"t":"para","text":"K线13是市场从大熊市趋势和三角形的底部下方开始的第二次向上反转尝试，而K线6和K线9形成了最初的两波下跌浪。K线13也是一根牛市反转K线，同时也预示着在105附近有买方压力。交易者可以在这根K线的收盘处买入看涨期权。","pid":"p1246"},{"t":"para","text":"K线14是一根强劲的熊市反转K线，一根移动平均缺口K线，也是楔形熊市旗形的顶部，所以一旦交易者看到这根K线正在演变成一根强劲的熊市K线，他们可以在收盘处买入看跌期权。","pid":"p1247"},{"t":"para","text":"K线15是一个较为冒险的买入看涨期权的入场点，因为下行动能非常强劲，而它是从K线4的高点开始的第三波下推浪，而K线6是第一波，K线8至K线13形成了第二波。一旦交易者看到K线16之前的上升浪有多强烈，他们就可以在大型楔形底部和强劲的牛市浪潮之后，形成的第二波上升浪也就是牛市反转K线17收盘前买入看涨期权。","pid":"p1248"},{"t":"para","text":"市场在K线19之前的5根K线处暂停了，十字星的收盘形态足以作为你在楔形顶部（K线16、18、19）和K线14形成的双重顶部处买入看跌期权的原因。","pid":"p1249"},{"t":"para","text":"在一个强劲的熊市浪潮过后，K线21是一个回调至移动平均线的两浪回调，所以交易者看到两条十字星K线均未能在移动平均线上方收盘时，他们可以在收盘处买入看跌期权。","pid":"p1250"},{"t":"para","text":"在过去的5根K线中。K线23是第三根牛市K线，这是市场买盘压力的征兆。市场在反弹至K线19之后，正在努力形成一个更高的低点。这也是从K线19开始形成的下跌通道，与K线18后面的低点和K线20构成了二个楔形牛市旗形。交易者可以在多头收盘或下一天收盘处买入看涨期权，这是一条有着较短尾部的大型牛市K线，其收盘价远在移动平均线上方。这也是在巨大的底部后形成的一个强劲牛市浪潮的一部分，后面还可能会出现更高的价格。如果他们计划持有一两周，那么他们可以购买牛市价差组合而非看涨期权，这样可以降低时间价值衰减的影响。","pid":"p1251"},{"t":"para","text":"K线31是在市场向上突破保护性牛市通道后形成的熊市反转K线，最低限度，这个市场将会测试移动平均线，同时刺穿这个通道的底部。这是一个绝佳的机会买入看跌期权。实际上，当市场高于前一根K线的高点时，交易者就可以在开盘时买入看跌期权。为什么这是一笔好的交易呢？当市场向上突破一条很长的牛市通道时，它通常会在这个通道的底部反转，而这个反转通常是在5根K线之内。因此，在第三根K线上方买入看跌期权的风险有限。","pid":"p1252"},{"t":"para","text":"这条通道有一个非同寻常的特点。在过去的10年中。市场第一次在连续了这么多K线后没有触及移动平均线（K线26、28和30都没有触及它），出现这种情况后，就会在同样多K线的之后市场测试移动平均线的情况。极端的行为提供了市场向平均交易回归的倾向。如果市场正在做过去很多年都没有出现过的事情，那么这种行为将很快停止，则期权交易者可以做反向交易。当你看到某种异常行情时，你就回顾一下之前的数据和市场，看看这行情到底有多么反常。如果你在过去10年或20年的数据上做历史回调，你将会发现在95%以上的时间里，当出现30根K线或者更多的连续缺口K线时，市场会在10根K线以内返回并触及均线。看到这一点的交易者们都开始将多头头寸获利了结，并且在前一根K线的高点上方买入看跌期权，他们认为市场将会测试移动平均线。市场将在不久之后测试移动平均线的概率很高，所以在这里买入看跌期权是一个非常好的交易，交易者也可以在K线32市场测试移动平均线时获利。举例来说，一旦市场在K线31之前形成了一个一根K线的回调，那么交易者可以超越这根K线的高点处的任何点买入看跌期权，一般来说在下一根K线会出现这样的机会。市场从K线31的向上跳空看盘处下跌，在一条狭窄的牛市通道形成很长的时间后，做空交易者开始在这个通道的顶部波段高点的上方以及之前的K线的高点上方入场。当有一些异常现象发生时，这些现象通常是不能持续的因此高潮和随后的回调都比大部分交易预期的幅度要大。持续的时间更长，所以K线31的高点很有可能会持续几周时间，而市场也至少会形成一个两浪的震荡下跌调整。调整的规模和数量应该同之前的浪潮中的K线数量和点数相近，因为市场倾向于做重复的事情（惯性）。","pid":"p1253"},{"t":"para","text":"在K线3之前的上升浪以及从K线36上升至39的上升浪中，也形成了类似的强劲而紧凑的多头通道。交易者在先前K线的高点上方和在牛市趋势K线的收盘处（可能是消耗性买入高潮），以及在这些牛市趋势K线之后出现的小型K线处买入看跌期权，预期市场会在一到三日内出现向下的测试。在日线图上。这些购买看跌期权的交易者通过刮头皮交易赚取了50美分至1美元的利润。","pid":"p1254"},{"t":"para","text":"另一个极端的市场行为出现在K线42处。在标普500指数的图表上，虽然市场从K线41处开始的上升潮中出现了很多小型熊市K线，但是在标普500期货合约的图表上并没有出现。相反，它形成了15条连续的牛市趋势K线，这在过去的几年里都没有发生。这意味着这就是一种极端行情，所以是高潮行为。在K线42之前的若干K线中，聪明的做空交易者开始对看跌期权的头寸逐步加仓，预期至少会出现一波两浪的，下跌至移动平均线下方的至少持续10根K线的调整浪。","pid":"p1255"},{"t":"img","src":"assets/img/p4c3_005.webp","ctx":[{"t":"在K线3之前的上升浪以及从K线36上升至39的上升浪中，也形成了类似的强劲而紧凑的多头通道。交易者在先前K线的高点上方和在牛市趋势K线的收盘处（可能是消耗性买入高潮），以及在这些牛市趋势K线之后出现的小型K线处买入看跌期权，预期市场会在一到三日内出现向下的测试。在日线图上。这些购买看跌期权的交易者通过刮头皮交易赚取了50美分至1美元的利润。","p":"p1254"},{"t":"另一个极端的市场行为出现在K线42处。在标普500指数的图表上，虽然市场从K线41处开始的上升潮中出现了很多小型熊市K线，但是在标普500期货合约的图表上并没有出现。相反，它形成了15条连续的牛市趋势K线，这在过去的几年里都没有发生。这意味着这就是一种极端行情，所以是高潮行为。在K线42之前的若干K线中，聪明的做空交易者开始对看跌期权的头寸逐步加仓，预期至少会出现一波两浪的，下跌至移动平均线下方的至少持续10根K线的调整浪。","p":"p1255"},{"t":"如图23.5所示的FCX的60分钟图，当市场处于一轮强劲的牛市趋势中时，交易者很可能会在每次市场跌破移动平均线时买入看涨期权。大约80%的结束强劲的牛市趋势的尝试会失败，所以看涨期权在接下来的一些日子会盈利的概率很大，交易者计划持有一两周的时间的，会尝试买入牛市价差期权来减少时间价值衰退的影响。","p":"p1256"},{"t":"当截至K线11的三波上推浪之后（K线10是第二波上推浪），市场出现两浪调整的概率很大，所以交易者不应该在接下来的下跌浪中买入看涨期权。","p":"p1257"},{"t":"因为K线11是在一轮过度的牛市趋势中出现的第三波上升浪，所以随后可能会出现趋势反转，或者至少一波震荡行情。许多做多的交易者希望继续持有自己的股票。但是他们也需要当市场出现大幅抛售时保护手里的头寸。他们可以采取一种叫作无现金双限期权的策略，当然这种策略也超过了本书的范围。一个做多交易者可能会以2美元的价格买入一月期的执行价为90的价外看跌期权。并且通过卖出一个执行价为105的价外看涨期权收回2美元的本金。不但在市场跌破90时，他采取了措施保护手里的股票，同时净费用也是0。如果市场上涨5%，他的股票将被提前赎回，但是他会赚到那增加的5%的利润。很多交易者不使用无现金的策略，而是简单地卖出一个看涨期权，但不会购买看跌期权，因为看跌期权的价格会不成比例的高，为了找到一个在价格上等于看跌期权的看涨期权你不得不放弃很多上涨机会（看涨期权通常比看跌期权更接近标的物的价格）。","p":"p1258"}]},{"t":"para","text":"如图23.5所示的FCX的60分钟图，当市场处于一轮强劲的牛市趋势中时，交易者很可能会在每次市场跌破移动平均线时买入看涨期权。大约80%的结束强劲的牛市趋势的尝试会失败，所以看涨期权在接下来的一些日子会盈利的概率很大，交易者计划持有一两周的时间的，会尝试买入牛市价差期权来减少时间价值衰退的影响。","pid":"p1256"},{"t":"para","text":"当截至K线11的三波上推浪之后（K线10是第二波上推浪），市场出现两浪调整的概率很大，所以交易者不应该在接下来的下跌浪中买入看涨期权。","pid":"p1257"},{"t":"para","text":"因为K线11是在一轮过度的牛市趋势中出现的第三波上升浪，所以随后可能会出现趋势反转，或者至少一波震荡行情。许多做多的交易 场在向下测试了移动平均线和100价位后，很可能会出现开盘向上反转。但是，开盘处的下跌浪如此强劲，以至于市场很可能会至少出现第二波下跌通道。如果交易者将他们的止损位移至7.30美元附近，那么这个止损位可能永远不会被触发。在市场收盘时，看跌期权的价值超过了10美元。如果这个股票上涨超过了102，交易者可以设置软件提醒自己，而不是在市场中设置止损订单，如果市场确实超过了102，他们可以试着用限价单离场。保护性止损的问题是，如果市场出现了强势反弹，那么执行价在100的看跌期权将不会被行权，那么止损就永远不会被触发，即买价和卖价都远高于止损价。","p":"p1261"},{"t":"在日线图上，这一天变成了一个外包K线下跌日。在强劲的牛市趋势中，第二天通常不会有太多的支撑力量（在这里，第二天是一个小十字星日），因为大型的外包下跌K线很可能会变成小型震荡区间的开始。然而，对上升的日均线的测试很可能会在近期出现。当交易者的期权给他带来大笔利润时，最好选择了结头寸，然后在明天寻找其他机会。当这个头寸的升值空间已经不大时，持有它至另一天将会使日内交易者分散精力。","p":"p1262"}]},{"t":"para","text":"如图23.7所示，阿尔法自然资源公司在日线图上处于强劲的牛市趋势，并在四天前向上突破了一个楔形顶部。昨天，它向上跳空突破了另一条趋势通道线和100整数关口，一个在心理上非常重要的数字，因此也是一个磁力位。在5分钟的图上，市场一旦开始下跌，就很有可能会测试100这个数字。7月份的为期1月的执行价为100的看跌期权的期权费是7.2美元，合理的最坏离场情况是在市场开盘的震荡区间的顶部上方交易离场，此时看跌期权所要冒的风险大概在1美元左右。在K线2处，这些看跌期权大概值8.80美元。市场出现的第一个暂停点是非常好的获利了结时机，因为市场在向下测试了移动平均线和100价位后，很可能会出现开盘向上反转。但是，开盘处的下跌浪如此强劲，以至于市场很可能会至少出现第二波下跌通道。如果交易者将他们的止损位移至7.30美元附近，那么这个止损位可能永远不会被触发。在市场收盘时，看跌期权的价值超过了10美元。如果这个股票上涨超过了102，交易者可以设置软件提醒自己，而不是在市场中设置止损订单，如果市场确实超过了102，他们可以试着用限价单离场。保护性止损的问题是，如果市场出现了强势反弹，那么执行价在100的看跌期权将不会被行权，那么止损就永远不会被触发，即买价和卖价都远高于止损价。","pid":"p1261"},{"t":"para","text":"在日线图上，这一天变成了一个外包K线下跌日。在强劲的牛市趋势中，第二天通常不会有太多的支撑力量（在这里，第二天是一个小十字星日），因为大型的外包下跌K线很可能会变成小型震荡区间的开始。然而，对上升的日均线的测试很可能会在近期出现。当交易者的期权给他带来大笔利润时，最好选择了结头寸，然后在明天寻找其他机会。当这个头寸的升值空间已经不大时，持有它至另一天将会使日内交易者分散精力。","pid":"p1262"},{"t":"img","src":"assets/img/p4c3_008.webp","ctx":[{"t":"如图23.7所示，阿尔法自然资源公司在日线图上处于强劲的牛市趋势，并在四天前向上突破了一个楔形顶部。昨天，它向上跳空突破了另一条趋势通道线和100整数关口，一个在心理上非常重要的数字，因此也是一个磁力位。在5分钟的图上，市场一旦开始下跌，就很有可能会测试100这个数字。7月份的为期1月的执行价为100的看跌期权的期权费是7.2美元，合理的最坏离场情况是在市场开盘的震荡区间的顶部上方交易离场，此时看跌期权所要冒的风险大概在1美元左右。在K线2处，这些看跌期权大概值8.80美元。市场出现的第一个暂停点是非常好的获利了结时机，因为市场在向下测试了移动平均线和100价位后，很可能会出现开盘向上反转。但是，开盘处的下跌浪如此强劲，以至于市场很可能会至少出现第二波下跌通道。如果交易者将他们的止损位移至7.30美元附近，那么这个止损位可能永远不会被触发。在市场收盘时，看跌期权的价值超过了10美元。如果这个股票上涨超过了102，交易者可以设置软件提醒自己，而不是在市场中设置止损订单，如果市场确实超过了102，他们可以试着用限价单离场。保护性止损的问题是，如果市场出现了强势反弹，那么执行价在100的看跌期权将不会被行权，那么止损就永远不会被触发，即买价和卖价都远高于止损价。","p":"p1261"},{"t":"在日线图上，这一天变成了一个外包K线下跌日。在强劲的牛市趋势中，第二天通常不会有太多的支撑力量（在这里，第二天是一个小十字星日），因为大型的外包下跌K线很可能会变成小型震荡区间的开始。然而，对上升的日均线的测试很可能会在近期出现。当交易者的期权给他带来大笔利润时，最好选择了结头寸，然后在明天寻找其他机会。当这个头寸的升值空间已经不大时，持有它至另一天将会使日内交易者分散精力。","p":"p1262"},{"t":"今天（2008年9月29日，如图23.8所示），当美国众议院未通过7000亿美元的华尔街救市议案时，道琼斯工业平均指数下跌700点。因为道指仅仅在10分钟内便下跌了430点，所以订单系统过载并冻结的风险非常高。如果你想进行逆势交易，你可以不选择交易股票或者标普500价格指数，而是选择购买看涨期权。举例说明，如果市场在K线1收盘时。一个标普500的11月的执行价为114的看涨期权的期权费大概是6美元，然后你可以在移动平均线附近卖出，大概可以获得80美分的收益（对于每一份合约来说可以获利80美元：因为每个股票期权代表100股股票）。","p":"p1263"},{"t":"如果你有可能在潜在的双重底部牛市旗形K线3处买入（这并不是理想化的，因为当你进行与强熊市趋势相反的交易时。你希望看到一根牛市信号K线），那么你可以用6.80美元买入看涨期权。我试着从一位经纪商那里购买QLD，它是一只交易所交易基金（ETF），G杠杆是QQQ的两倍，但是当我看到做空趋势信号K线时，我立刻取消了我的订单。然而，经纪商的在线订单系统没有让我取消订单，它没有告诉我是否已经执行。为了以防万一，我另外设置了止损订单，我现在有两张订单，但是我都不知道他们是否已被执行。我立即用另一位经纪商进行套期保值（虽然这种情况不多见，但是为了以防万一，所有的交易者都应该至少有两位经纪商），我的对冲规模现在是两倍了，即使我并不知道原来的多头或者止损单是否被执行了。我不断地查询，40分钟后，我的第一位经纪商告诉我，我原来的交易和止损都已经执行。我仅仅损失了4美分。为了套期保值，我会使用很多其他的金融工具。我购买了QLD，它是一只ETF，同QQQ相反，我加了两倍的杠杆来对冲QLD。在这一天中的新低点处，这是在趋势线突破后出现的更低的低点（K线3之前的横向盘整突破了熊市趋势），出现了一个牛市内含K线。我以1.40美元的利润退出了我的对冲交易，以5.80美元的价格买入了标普500看涨期权。当市场测试移动平均线时，我退出看涨期权，获得50美分的盈利。","p":"p1264"},{"t":"这不是我喜欢的交易方式。即使一切都转危为安。我的失误之处就是认为今天的技术非常好，所以订单系统不会被冻结。那使得只交易看涨期权的操作变得合情合理，比如在K线4的低点，那样即使订单系统被冻结，我的风险也是确定的。","p":"p1265"},{"t":"关于在这样的巨型波动日买入看涨期权的最后一点是：芝加哥期权交易所波动率指数在今天触及了50，这是非常罕见的。波动率指数中的每16个点意味着标准普尔指数的平均日区间为1%。50点的波动率指数意味着平均日区间约为3%，或者说当标普500指数在115附近时，平均日区间超过3个点。这意味着这是不能持续的行情。如果你买入看涨期权，那么他们的期权费会快速值，这使得他们不是非常好的隔夜操作。举例说明，标普500在次日上涨3美元，但是因为波动率的剧烈收缩，看涨期权只上涨约0.5美元。标的物价格每波动1美元。平价看涨期权通常会波动约0.5美元。所以，在波动率很高的时候买入期权，它的风险回报比显然是很差的。","p":"p1266"}]},{"t":"para","text":"今天（2008年9月29日，如图23.8所示），当美国众议院未通过7000亿美元的华尔街救市议案时，道琼斯工业平均指数下跌700点。因为道指仅仅在10分钟内便下跌了430点，所以订单系统过载并冻结的风险非常高。如果你想进行逆势交易，你可以不选择交易股票或者标普500价格指数，而是选择购买看涨期权。举例说明，如果市场在K线1收盘时。一个标普500的11月的执行价为114的看涨期权的期权费大概是6美元，然后你可以在移动平均线附近卖出，大概可以获得80美分的收益（对于每一份合约来说可以获利80美元：因为每个股票期权代表100股股票）。","pid":"p1263"},{"t":"para","text":"如果你有可能在潜在的双重底部牛市旗形K线3处买入（这并不是理想化的，因为当你进行与强熊市趋势相反的交易时。你希望看到一根牛市信号K线），那么你可以用6.80美元买入看涨期权。我试着从一位经纪商那里购买QLD，它是一只交易所交易基金（ETF），G杠杆是QQQ的两倍，但是当我看到做空趋势信号K线时，我立刻取消了我的订单。然而，经纪商的在线订单系统没有让我取消订单，它没有告诉我是否已经执行。为了以防万一，我另外设置了止损订单，我现在有两张订单，但是我都不知道他们是否已被执行。我立即用另一位经纪商进行套期保值（虽然这种情况不多见，但是为了以防万一，所有的交易者都应该至少有两位经纪商），我的对冲规模现在是两倍了，即使我并不知道原来的多头或者止损单是否被执行了。我不断地查询，40分钟后，我的第一位经纪商告诉我，我原来的交易和止损都已经执行。我仅仅损失了4美分。为了套期保值，我会使用很多其他的金融工具。我购买了QLD，它是一只ETF，同QQQ相反，我加了两倍的杠杆来对冲QLD。在这一天中的新低点处，这是在趋势线突破后出现的更低的低点（K线3之前的横向盘整突破了熊市趋势），出现了一个牛市内含K线。我以1.40美元的利润退出了我的对冲交易，以5.80美元的价格买入了标普500看涨期权。当市场测试移动平均线时，我退出看涨期权，获得50美分的盈利。","pid":"p1264"},{"t":"para","text":"这不是我喜欢的交易方式。即使一切都转危为安。我的失误之处就是认为今天的技术非常好，所以订单系统不会被冻结。那使得只交易看涨期权的操作变得合情合理，比如在K线4的低点，那样即使订单系统被冻结，我的风险也是确定的。","pid":"p1265"},{"t":"para","text":"关于在这样的巨型波动日买入看涨期权的最后一点是：芝加哥期权交易所波动率指数在今天触及了50，这是非常罕见的。波动率指数中的每16个点意味着标准普尔指数的平均日区间为1%。50点的波动率指数意味着平均日区间约为3%，或者说当标普500指数在115附近时，平均日区间超过3个点。这意味着这是不能持续的行情。如果你买入看涨期权，那么他们的期权费会快速值，这使得他们不是非常好的隔夜操作。举例说明，标普500在次日上涨3美元，但是因为波动率的剧烈收缩，看涨期权只上涨约0.5美元。标的物价格每波动1美元。平价看涨期权通常会波动约0.5美元。所以，在波动率很高的时候买入期权，它的风险回报比显然是很差的。","pid":"p1266"},{"t":"img","src":"assets/img/p4c3_009.webp","ctx":[{"t":"这不是我喜欢的交易方式。即使一切都转危为安。我的失误之处就是认为今天的技术非常好，所以订单系统不会被冻结。那使得只交易看涨期权的操作变得合情合理，比如在K线4的低点，那样即使订单系统被冻结，我的风险也是确定的。","p":"p1265"},{"t":"关于在这样的巨型波动日买入看涨期权的最后一点是：芝加哥期权交易所波动率指数在今天触及了50，这是非常罕见的。波动率指数中的每16个点意味着标准普尔指数的平均日区间为1%。50点的波动率指数意味着平均日区间约为3%，或者说当标普500指数在115附近时，平均日区间超过3个点。这意味着这是不能持续的行情。如果你买入看涨期权，那么他们的期权费会快速值，这使得他们不是非常好的隔夜操作。举例说明，标普500在次日上涨3美元，但是因为波动率的剧烈收缩，看涨期权只上涨约0.5美元。标的物价格每波动1美元。平价看涨期权通常会波动约0.5美元。所以，在波动率很高的时候买入期权，它的风险回报比显然是很差的。","p":"p1266"},{"t":"如图23.9所示，苹果的股票在过去两个月上涨了40%，在昨天收盘后公布了收益报告。在咋天收盘处以8美元左右的价格买入了一个执行价为310的价外看跌期权的交易者，预期当苹果的股票下跌14美元时，自己将获得大笔的利润。然而，看跌期权只是暂时盈利，之后便快速大幅跌破其买入价格。尽管苹果股票保持下跌了几个小时，但是在“催化剂”事件也就是收益报告之前，期权费膨胀得非常厉害，以至于只有剧烈波动才能使得交易获利。若交易者想在“催化剂”事件之前买入期权，需要格外谨慎，不应在期权的波动率过高也就是期权费过高时购买。","p":"p1267"},{"t":"左侧苹果股票的图表中的K线2对应着右侧11月的为期一月的价外看跌期权图表中的K线22.","p":"p1268"},{"t":"在K线5，苹果股票仍然下跌了5美元左右，大约1.6%，然而同一时间，当看跌期权的买家希望它至少上涨1美元至9美元或者更高时，看跌期权却在K线55处下跌了4美元。这个现象发生的原因主要是因为在收益报告发布之前看跌期权是非常昂贵的，一旦收益报告在昨晚发布，不确定性就消失了，期权费被立刻大幅下跌。","p":"p1269"}]},{"t":"para","text":"如图23.9所示，苹果的股票在过去两个月上涨了40%，在昨天收盘后公布了收益报告。在咋天收盘处以8美元左右的价格买入了一个执行价为310的价外看跌期权的交易者，预期当苹果的股票下跌14美元时，自己将获得大笔的利润。然而，看跌期权只是暂时盈利，之后便快速大幅跌破其买入价格。尽管苹果股票保持下跌了几个小时，但是在“催化剂”事件也就是收益报告之前，期权费膨胀得非常厉害，以至于只有剧烈波动才能使得交易获利。若交易者想在“催化剂”事件之前买入期权，需要格外谨慎，不应在期权的波动率过高也就是期权费过高时购买。","pid":"p1267"},{"t":"para","text":"左侧苹果股票的图表中的K线2对应着右侧11月的为期一月的价外看跌期权图表中的K线22.","pid":"p1268"},{"t":"para","text":"在K线5，苹果股票仍然下跌了5美元左右，大约1.6%，然而同一时间，当看跌期权的买家希望它至少上涨1美元至9美元或者更高时，看跌期权却在K线55处下跌了4美元。这个现象发生的原因主要是因为在收益报告发布之前看跌期权是非常昂贵的，一旦收益报告在昨晚发布，不确定性就消失了，期权费被立刻大幅下跌。","pid":"p1269"}],"wcount":19735},{"id":"p4c4","title":"第24章　最佳交易：归纳总结","blocks":[{"t":"para","text":"第24章　最佳交易：归纳总结","pid":"p1270"},{"t":"para","text":"市场是线性的——它要么上涨，要么下跌。当我们用传统的价格图表来描述市场走势时，我们通常把时间作为另一个维度加人横坐标轴，但市场本身还是只有一个维度，那就是价格。我们还可以把阳线和阴线用不同颜色进行标识，将成交量用K线的宽度来体现，或者加人各种各样的技术指标。来增加我们描述市场走势的维度。然而，市场本身还是只有一个维度，那依然是价格。我这一系列的书籍都是为了告诉大家一个道理，市场本身很简单。价格之所以不停上下波动，是因为它一直在寻找一个与当前基本面最匹配的点位，而当前基本面又是不停在变化的。基本面是指任何交易员认为会影响价格的因素。包括狭义来说每个品种自身的基本面数据，整体市场的情况、政治因素、，自然或者人为事件例如地震或者战争，以及众多国际因素等。这就导致市场价格一直在区间震荡（市场对价值区间短暂达成共识）和趋势（需要寻找新的合适价格）之间进行交替。如果市场向上成功突破，则意味着多头成功证明市场价格过低：如果市场向下成功突破，则意味着空头成功证明市场价格过高。同时，每次突破都会遇到反向的阻力，因为也有一批市场参与者持不同意见。并认为突破会失败、市场会反转等等。这一现象在任何时间周期、任何市场的任一K线或者某一组K线上都存在。区间震荡可以体现为一根K线，也可以是一百根K线：同样，趋势突破可以是一根K线，也可以是很多根K线。交易的核心能力就是要学会判断市场上多空哪方力量更加强大。一旦交易者确定市场某一方的优势明显时，他也就占有了先机。这个先机也就是获得盈利相对承受风险的机会更大，价格更大可能会在触及止损位之前先触及止盈位。只有在这种情况下，交易者进行交易才有利可图。","pid":"p1271"},{"t":"para","text":"无论我们交易的是哪个市场，盈利都不是一件容易的事情。在市场中交易的人都是身经百战、头脑聪明的人，他们都希望从你的账户上赚钱，就像你希望从他们那里赚钱一样。这种竞争是非常残酷的，所以要盈利是非常不容易的，即便是在一个趋势非常强烈的市场中。当市场在朝着一个方向发展时，出现很多根趋势K线，虽然盈利空间非常可观，但风险也同样巨大，因为往往这时候止损会设置在趋势的起点下方。同时，由于趋势发展太快，很多交易者来不及减少长线仓位而增加一些灵活的短线头寸，或者是扩大止损区间，就只好眼静静看着趋势快速发展，一直等不到回调介入的时机。波段交易者一般不愿意参与盈利风险比小于2倍的交易机会，所以在市场趋势快速发展时介入会感到很不安。如果盈利风险比只有1倍左右，他们宁可放弃这次交易机会。","pid":"p1272"},{"t":"para","text":"一旦市场进入趋势通道阶段，很容易让人怀疑市场是否很快就要反转。例如，在牛市趋势中，也会有很多反转的尝试，不过一般都会变成牛市旗形。很多牛市通道的买入信号K线并不强劲，迫使部分喜欢设置止损的多头在趋势通道的上方买入。这是一个低胜率的多头交易，即便市场在持续上涨。一些喜欢在较弱的上涨趋势通道上方买入并设置好止损条件、愿意采取这种低胜率交易的波段交易者很喜欢这种价格形态，因为一旦他们成功，就可以赚取比所冒风险的高好几倍的利润。这样，即便胜率较低，一次获胜所赢得的利润也足够覆盖多次失败的成本了。然而，并不是所有的交易者都适合或者愿意参与这种低胜率的交易。很多只愿意选择高胜率交易的交易者，可能会眼静静看着价格朝着某一个方向大幅连续跃进几根K线，甚至超过20根以上的K线。毕竟，高胜率的交易机会并不经常发生。结果可能是，在一场牛市趋势中，他们一直在等待市场的回调入场机会，但却一直没有等到，最后错过整个趋势。这是可以理解的，毕竟交易者一定要找到最适合自己的、舒服的交易方式。如果他们只在做高胜率、止损挂单的时候才感到安全舒适的话，他们的等待是正确的。趋势通道不可能永远持续，他们很快就可以找到合适的入场机会。经验丰富的交易员在前一个波段低点附近挂买单，有时候还在牛市通道中进行一些短线空单交易。这两种交易都可能成为高胜率的交易方式。包括在牛市中的空单，因为如果市场在阻力位附近突然来一个熊市反转，或者趋势过猛后的一些大一点级别的回调，都可能会给空单带来较大获利机会。","pid":"p1273"},{"t":"para","text":"一旦趋势通道阶段结束后，市场就进入一个震荡区间。在这种状态下，多头可能会把价格疯狂推升至前一个高点附近，而空头可能很快又会把价格打压到区间底部。这时，如果交易者的逻辑是突破跟进的话，就很可能会买在顶部、卖在底部，追涨杀跌、损失惨重。这与在震荡区间获利的交易者的逻辑正好相反。一般来说，市场价格从顶部向下反转，或者从底部反弹，只有很弱的信号K线，交易者一般会觉得很难做出这一类交易的决定，因为信号太弱了，盈利风险比公式不足以符合他们的入场条件。在区间震荡模式时，大部分交易者的胜率都只在50%左右，极少情况下能够到60%。这就意味着，高胜率的交易入场机会少之又少。此外，很多低概率的事件会发生，例如很多反转看起来很弱，但紧随其后的却是一波强势的波段走势，又或者明明很强的一个走势后面，却没有跟进的力量。这些在趋势模式中是非常奇怪的事情。","pid":"p1274"},{"t":"para","text":"所有这些情况让交易者在市场中赚钱显得非常艰难。但如果你根据当前市场情况去回顾本书中关于各种情况的应对方法时，你就能记得，其实不管市场如何表现，总是能够找到赚钱的方法。你在市场中的优势永远都很小，但如果你是一个仔细的、冷静的、客观的图表阅读者，而且每次都只做最有优势的那些交易机会的话，你就能够将自己训练成以交易为生的人。","pid":"p1275"},{"t":"para","text":"有一些交易者，交易非常频繁，他们只要有交易冲动就会发出交易指令，不管什么交易周期、什么市场，他们经常大量交易。在多头趋势中，主观型的交易者，不管是机构还是个人，一般都会采用什么方法呢？多头趋势一般开始于突破，突破可以是一个上涨的高潮，包含一个或者多个多头趋势K线。如果突破失败，那么市场会重新回到原来的震荡交易区间，交易者可以利用这个失败的突破（演变成最终旗形的形态）进行反向交易，并继续进行区间交易。当突破很强，最终能够成功突破时，大部分主观型的交易者会急切地跟进买入。他们可能会以市价或者等待市场小幅回调，或者在一根K线的收盘价，或者前一根K线的上方买入。一旦市场进入牛市趋势通道，有一些回调时，他们就会在前一根K线的低点下方买入，比如低点1和低点2的信号K线的下方，市场尝试反转但失败后（大部分的趋势反转都会失败）。他们还可能会在前一根K线的高点上方买入，比如高点1和高点2，或者是三角形多头形态的上方买入。此外，他们还可能在市场突破一些小型的多头旗形形态之后的回踩时点买入。在一轮强势的多头趋势中，他们可能会在市场出现小型的回调趋势通道被第一次向上突破时就买入，因为他们认为市场在接下来可能会有连续的拉升而不出现回调。当趋势强劲时，他们可能会在市场突破前一波段高点时就买入，但如果市场出现区间震荡时，例如空头趋势K线增加、K线的上影线较长时，他们可能会在前一个波段高点附近卖出。一开始很多只是原来持有多头的投资者卖出多头头寸，获利平仓，但随着上涨的趋势通道变得越来越水平，市场的回调幅度越来越深，将有更多的交易者在前一个波段高点附近卖空，做短线交易。当某个临界点多空双方势均力敌时，市场进入区间震荡阶段。这个时候，交易者不再那么肯定，多头趋势会通过反弹来恢复（他们不再寻找强多头趋势中回调带来的买入机会，一般来说，强多头趋势中的回调过后会迅速突破前期高点）。他们大部分时候会选择低买高卖，或者做一些短线日内交易。在区间顶部，他们会选择寻找高点1和高点2入场，在信号K线上方做空而不是买入。一开始，他们只打算做短线交易，等价格回落到均线附近、交易区间底部或者通道下沿附近后平仓。但如果他们观察到市场卖出压力增大，可能会延长自己的空头持仓时间，做一些波段交易，而且会等到市场出现二个持续多根K线，有两个或者以上的下跌波段的深度回调时才会再次考虑买入。当市场出现一个或者更多的回调，这些回调中卖方力量足够强劲，使得市场价格跌破趋势线或者移动平均线时，有些空头交易者打算等待市场再次反弹测试新高时进行卖空，并期待接下来会有一个主要趋势反转。当市场出现比前一个低点更低的波段高点，或者出现双重顶。或者甚至出现更高的波段高点时，即便他们赌的反转的胜率只有40%甚至更少，他们还是会进行反转交易。只要他们一旦正确，可以获得的盈利空间远远大于他们的亏损空间，或者说风险，而同时他们就拥有了一个积极的交易者方程。对于多头来说，在震荡区间的下沿买入是合理的，就好像在更高的高点2的买入时点、楔形多头旗形、更高时间周期的趋势线。或者是在可以测量的目标价位附近。交易者都能清楚地认识到，区间震荡只不过是更高的时间周期趋势的一个回调。5分钟K线图的一个上涨高潮以及上涨通道最终会一起形成更高时间周期图表上的一个高潮，例如在15分钟和1小时图表上。当多头在5分钟K线的震荡区间买进时，很多人会继续持有这个多头头寸等待一波反弹，或者是市场突破新高，形成一波向上可预测的反弹。这一波向上的反弹其实概率偏低，但因为收益空间比风险大很多，所以还是值得交易者去尝试的。","pid":"p1276"},{"t":"para","text":"在震荡交易区间，入场信号常常很不清晰，交易者感受到的不确定性较大。很多信号可能是小型的双重顶或者双重底部形态，或者是小型的最终旗形反转。这种交易的胜率较低，交易者需要非常小心，应该快进快出以控制风险。他们需要坚持低买高卖的逻辑，而不能在市场表现强势但却接近区间顶部时急匆买入，又或者是在市场疯狂下跌但接近区间底部的时候大举做空。尽管这些行情可能会非常强劲，但不要忽略了一点，就是之前的市场状态，市场依然处于震荡区间，而在震荡区间内，突破一般都会以失败告终。一旦市场进入震荡区间，如果市场已经出现了一波较强势的走势，并形成了持续儿根K线的微型趋势通道，但不要轻易就跟随突破入场。观望一下突破是否足够强劲，如果强劲，等待市场出现回调时再进入。如果在市场在到达震荡区间底部之前出现一波下跌浪，形成了微型下跌趋势通道，那么先观望市场是否会出现一个强劲的反弹突破之前的微型下跌趋势通道，然后等待突破后的回调，看是否会形成一个更高的低点，或者微型的双重底部，或者更低的低点。如果市场在达到震荡区间顶部之前出现一波上涨浪。且形成了微型的上涨趋势通道，那么先不要急于在区间顶部做空，先等待市场出现一个更低的高点，或者小型的双重顶形态，或者更高的高点的整理形态后，再进行做空。做上述交易的时候，一定要等待信号K线出现后再做行动。","pid":"p1277"},{"t":"para","text":"如果市场进入了一个窄幅的震荡区间。等待市场的突破。不要轻易在窄幅震荡区间参与任何趋势交易，因为这种震荡会磨损掉所有交易的逻辑。如果你在窄幅震荡区间使用带止损的入场策略，一般这个策略会注定失败。不过，不带止损的策略又是灾难性的。所以，与其费尽心思猜测市场将会往哪个方向发展，不如耐心等待市场出现突破后，观察突破是否会成功。","pid":"p1278"},{"t":"para","text":"如果市场成功突破震荡区间的顶部，那么所有的过程又再次启动。交易者将把这个突破看作是一个上涨高潮。他们期待接下来会有一波可测量的上涨空间。如果市场向上突破但最终失败了，市场从牛市转向熊市，那么交易者可以把这个震荡区间看作是牛市的最后旗形反转形态如果这个时候，市场向下突破震荡区间，交易者可以观察一下突破是否足够强劲。如果是。他们可以同样地跟进，重复上述过程。震荡区间底部的突破并不一定需要以顶部突破失败为前提。突破形态也不一定是最终旗形反转形态，交易区间可以是其他类型的反转形态，例如双重顶，三重顶，或者头肩顶、三角形形态等。最重要的是，市场在出现向下突破后，交易者都期待接下来会出现回调，然后紧接着有一个下降的趋势通道，最后演变成区间震荡形态，之后市场再次选择突破方向。在上述过程中，最佳交易的例子包括：","pid":"p1279"},{"t":"para","text":"1.开盘反转信号较为强烈的情形：","pid":"p1280"},{"t":"para","text":"（1）当收益大于风险两倍、胜率在50%到60%时，可以进行波段交易；","pid":"p1281"},{"t":"para","text":"（2）当收益等于风险、胜率在60%到70%时，只能进行短线交易。","pid":"p1282"},{"t":"para","text":"2.当市场出现强烈反转收益是风险的两倍。胜率在50%到60%的情形：","pid":"p1283"},{"t":"para","text":"次测试趋势的极值的反弹尝试失败后的入场机会。反转信号K线必须非常强烈。在一个熊市趋势中，要在更高的低点出现后再买入，或者等出现双重底形态、更低的低点的形态中下跌动能枯竭后。在牛市趋势结束时，要在更高的高点卖出，或者在双重顶形态、更低的高点处卖出。","pid":"p1284"},{"t":"para","text":"（2）区间震荡或在弱势的通道中，在一波上涨或下跌趋势后，出现了强势的最终旗形反转形态：","pid":"p1285"},{"t":"para","text":"（3）在空头阶梯形态的第三或者第四次下推浪测试前一个低点时买入；","pid":"p1286"},{"t":"para","text":"（4）在多头阶梯形态的第三或者第四次上推浪测试前一个高点时买入；","pid":"p1287"},{"t":"para","text":"（5）当市场价格在趋势通道中移动或者在突破震荡区间之后市场价格变化动能减弱时交易","pid":"p1288"},{"t":"para","text":"3.当市场在多头趋势中价格从高点2回调至移动平均线附近后买入；","pid":"p1289"},{"t":"para","text":"4当市场在空头趋势中价格从低点2反弹至移动平均线附近后卖出；","pid":"p1290"},{"t":"para","text":"5.在牛市中的牛市楔形旗形回调后买入；","pid":"p1291"},{"t":"para","text":"6.在熊市中的熊市楔形旗形反弹后卖出；","pid":"p1292"},{"t":"para","text":"7.在牛市中的牛市旗形突破后回调买入；","pid":"p1293"},{"t":"para","text":"8.在熊市中的熊市旗形突破后反弹卖空；","pid":"p1294"},{"t":"para","text":"9.在牛市中高点1之后回调买入，但前一波不能出现高潮式的买入；","pid":"p1295"},{"t":"para","text":"10.在熊市低点1之后反弹卖空，但前一波不能出现高潮式的卖空；","pid":"p1296"},{"t":"para","text":"11.在区间震荡形态的顶部卖出，尤其是出现二次入场信号时；","pid":"p1297"},{"t":"para","text":"12.在区间震荡形态的底部买入，尤其是出现二次入场信号时。","pid":"p1298"},{"t":"para","text":"如果用限价指令入场，需要我们有很精准的图表阅读技术。因为在上述交易模式中，入场的方向和市场运动的方向相反。因此，只有当我们顺势交易时才用限价指令。例如，交易者希望下一个限价买入指令，买入价格在前一根K线的下方，那么只有当市场处于始终在场的做多状态或者很快就要切换成始终在场的做多状态时，才能用这种方式下单。如果交易者认为目前处于始终在场模式下的做空状态，而且反弹最多持续多一浪，那么就不能用限价模式买入。这种低胜率的交易模式会导致交易者的方程结果为负，一直亏钱，除非你是一个非常有经验的短线交易者。一般来说，在强势趋势行情中，市场往往会顺着趋势继续发展，幅度会出乎你的意料。从大概率来说，市场给你的惊喜都是顺势的，而不会轻易掉头转向。所以如果你认为行情在熊市中的低点1还会继续反弹一波。那么很有可能你会失望。不过，对于经验丰富的交易者来说，下面这些最佳交易机会可以用限价或市价模式进入：","pid":"p1299"},{"t":"para","text":"1.多头强势突破后出现的快速上涨行情，用市价买入，或者在前一根K线的最低点或其低点下方用限价指令买入（快速拉升行情中的止损幅度要足够宽，拉升行情一般出现得非常出人意料，所以比较难把握）；","pid":"p1300"},{"t":"para","text":"2.空头强势突破后出现的快速下跌行情，用市价买入，或者在前一根K线的最高点或其高点上方用限价指令买入（快速下跌行情中的止损幅度要足够宽，下跌行情一般出现得非常出人意料，所以比较难把握）；","pid":"p1301"},{"t":"para","text":"3.市场出现强劲的多头反转行情，或者在区间震荡形态的底部出现可能的新的反弹行情中，下跌动能减弱的信号K线出现后用限价指令在低点1或低点2的最低点或其下方买入。","pid":"p1302"},{"t":"para","text":"4.市场出现强劲的空头反转行情，或者在区间震荡形态的顶部出现可能的新的回调行情中，上涨动能减弱的信号K线出现后用限价指令在高点1或高点2的最高点或其上方卖出；","pid":"p1303"},{"t":"para","text":"5.当市场在移动平均线附近出现一个窄幅牛市旗形时，在前一根K线的最低点或其下方用限价指令买入；","pid":"p1304"},{"t":"para","text":"6.当市场在移动平均线附近出现一个窄幅熊市旗形时，在前一根K线的最高点或其上方用限价指令卖空；","pid":"p1305"},{"t":"para","text":"7.当市场出现一根牛市趋势K线突破牛市旗形时，在趋势K线的下方用限价指令买入，等待市场出现突破后的回调；","pid":"p1306"},{"t":"para","text":"8.当市场出现一根熊市趋势K线突破熊市旗形时，在趋势K线的上方用限价指令卖空，等待市场出现突破后的反弹；","pid":"p1307"},{"t":"para","text":"9.在牛市趋势的震荡区间做波段交易时，一般在向下突破尝试时买入或加仓，因为一般突破会打破早期多头的盈亏平衡；","pid":"p1308"},{"t":"para","text":"10.在熊市趋势的震荡区间做波段交易时，一般在向上突破尝试时卖出或加仓，因为一般突破会打破早期空头的盈亏平衡；","pid":"p1309"},{"t":"para","text":"11.在强劲的牛市趋势中。当市场回调幅度大概与前期的一些回调的平均幅度差不多时，逢低买入；","pid":"p1310"},{"t":"para","text":"12.在强劲的熊市趋势中，当市场的反弹幅度大概与前期的一些回调的平均幅度差不多时，逢高卖出；","pid":"p1311"},{"t":"para","text":"13.当熊市趋势即将通过突破转变为牛市趋势，需要一个牛市趋势K线来确认这个总是在场模式下的状态切换。然而突破并不强劲，这时我们可以在这根突破K线的收盘处卖空，预期接下来的K线将无法确认趋势状态的切换，熊市趋势还将持续；","pid":"p1312"},{"t":"para","text":"14.当牛市趋势即将通过突破转变为熊市趋势，需要一个熊市趋势K线来确认这个总是在场模式下的状态切换，然而突破并不强劲，这时我们可以在这根突破K线的收盘处买入：预期接下来的K线将无法确认趋势状态的切换。牛市趋势还将持续。","pid":"p1313"},{"t":"para","text":"下面是一些交易新手在还没实现持续稳定盈利（如果已经实现稳定盈利，则可以充分发挥自己的技能）之前，应遵循这些指导方针：","pid":"p1314"},{"t":"para","text":"1.永远只有当某笔交易中你的盈利空间大于亏损风险时，才去做某一笔交易：作为初学者，最好集中精力做一些盈利空间是亏损风险两倍以上的交易；","pid":"p1315"},{"t":"para","text":"2.只做确定性大的交易，不要担心市场会朝着你这笔交易的方向走多远，只需要考虑入场机会是否足够好。如果足够好，那么成功确定性就超过了60%（市场朝着一个方向等距离移动的概率已经在我第二本书的第25章讨论过了）。如果潜在的收益大于潜在的亏损，那么交易者的方程式就是正的；","pid":"p1316"},{"t":"para","text":"3.每次入场。都必须设好止损位；","pid":"p1317"},{"t":"para","text":"4。时刻设置好保护性止损。因为单凭信念和希望是不能够阻挡失败的；","pid":"p1318"},{"t":"para","text":"5.用限价单的形式设好止盈价位，以防你过于贪，导致利润最后都回吐了；","pid":"p1319"},{"t":"para","text":"6.仅在多头K线上方买入，或者空头K线下方卖出；","pid":"p1320"},{"t":"para","text":"7.小单轻仓，如果你认为你能承担交易300股的风险，但最好还是只交易100股，这样你可以处于“无所谓”的状态，能更客观地看待你的交易，不会被情绪左右；","pid":"p1321"},{"t":"para","text":"8.避免频繁交易，一天最好只交易三到五次非常有逻辑的机会，对于存疑的交易机会，保持观望；","pid":"p1322"},{"t":"para","text":"9尽量保持交易逻辑的简单高效，如果有逻辑不清晰的地方，观望等待；","pid":"p1323"},{"t":"para","text":"10.对于新手来说，最好的交易机会一般是发生在开盘区间里产生的趋势入场机会。强劲的趋势反转后的新趋势入场机会，以及强势趋势中的回调后的顺势交易机会。","pid":"p1324"},{"t":"para","text":"很多交易的新手一开始会尝试做一些回报与风险差不多的短线交易机会，或者做回报是风险两倍的波段交易，或者是二者的组合。他们两者都尝试，希望看看哪种更容易成功，或者哪种更适合自己的交易风格。没有一个正确答案，三种方式在运用正确的时候都可以获得成功当然，最佳交易是高胜率的波段交易。在这种情况下，高胜率可以让短线交易者有机会获得部分或者全部利润，也可以让波段交易者获得很大的利润空间，而不用担心过早止盈或过晚止盈。一般来说，一天能出现两到三次最佳交易就很不错了。很多最佳交易都出现在趋势反转或者强劲趋势的回调中如果你愿意选择回报至少是风险的两倍的低胜率交易，那么你需要根据每一个信号入场交易，因为如果你挑挑抹栋，那么数学上来说成功概率对你是很不利的。对于一篮子这种交易来说，交易者的方程是正的，但对于其中的每一笔交易来说，它却很可能失败（胜率不到50%，所以很容易失败。）一天来说，通常只有一到两笔交易信号的回报是风险的若干倍，而信号却不是很强（所有胜率比较低），如果你有耐心，可能能够等到它的出现。记住，这种交易的胜率很低，所以入场信号不是很强烈，如果信号强烈的话，胜率一般超过60%。在胜率很高的交易中，每笔交易都是一个正的交易者方程式。这时候即便你挑选几个信号来做。也可以从数学上站在赢面概率上。在交易者获得稳定盈利能力之前，如果要做一些反转交易，建议大家只做胜率超过60%的交易这些反转一般能够带来总是在场策略中的多空方向的反转。然而，我们要记住，不是所有的反转最后都能实现，很多只是一个短期的回调。一般来说，真正的反转来得非常强烈，并伴随着突破而且有进一步跟进的力量。","pid":"p1325"},{"t":"para","text":"做每一笔交易时，对于胜率和盈利风险比的数学计算是非常关键的，很多人不够重视它，所以赔了很多钱。有些人看到一个大阳线的反弹，就马上在其最高价更高的价位买入，但却忽略了这根大阳线其实是跟前儿根大阳线和大阴线飞线相互重叠的窄幅震荡区间的第四根K线而已。当他们看到有连续四根大阴线组成的下跌高潮时，他们赶紧在第四根K线收盘时卖空，却忽略了这个下跌浪潮只不过是震荡区间中向下测试区间底部的一浪而已。他们看到一根大阳线后随之而来一根阴线，形成低点2的入场信号，他们就在阴线下方卖空，认为市场将反转下跌，但其实这很可能是强势牛市趋势的起点而已。当交易者还在考虑一笔交易时，市场却变化太快。交易者通常很难有足够的精力去评估入场信号的强弱，入场K线的强弱、入场下单的点位。整体风险暴露如何处理，何时应该止盈止损，以及各种各样其他个人问题。他们很难顾及太多，因此非常可能就忽略了最重要的一个问题的计算，那就是：这笔交易是否具备一个正的交易者方程式？成功的概率乘以回报是否比失败的概率乘以风险的结果更大？人们一般有一种自然倾向，就是如果他们认为正在研究的东西看起来不错，那么这笔交易应该就能成功。他们近似地认为这种感性的逻辑认识就可以取代数学计算，但实际上来说，从数学上去严格计算是更好的，更具有交易的计划性。举例说明。记得我看过一个YouTube上的视频，一个交易员正在仔细讲解他的交易方法。他总是交易两张电子迷你期货合约，第二张一般用来进行短线交易，每次总是去获取一个点的利润，来覆盖两张单子的交易成本。他有一个交易网站，网站上宣称他是一个成功的交易者，赚了很多钱。或许他曾经很成功，但绝不是因为第二张合约的交易方法。因为我知道，他两张合约的止损位都设在八个点之外的位置，而第二张合约的止盈位是一个点，也就意味着第二张合约的交易中，他用八个点的风险在搏一个点的盈利空间。在这种情况下。如果这张合约要盈亏平衡，就需要市场在90%的情况下都是在他入场后先向他有利的方向移动三个点位，才反向变动触及他的止损位。这种市场变动的概率是很低的，我们不可能要求市场按照我们的想法去变化。因此，第二张合约要赚钱很难。平均下来每笔交易是亏钱的，即便胜率可能会比较高，甚至超过80%，也很难实现整体盈利。或许他的第一张合约的交易能覆盖第二张合约的亏损，但如果他明白这个数学公式的道理，就不会去做第二张合约的交易方式，那么他就可以赚更多。任何一个交易员在制定自己的策略时，都必须考虑数学公式。如果市场变化太快来不及做这个数学公式的计算，那么就不要做这一笔交易。或者，交易者应该等待，等他自己弄清楚确定这笔交易的公式结果为正时，才可以做这笔交易。","pid":"p1326"},{"t":"para","text":"任何交易策略，只要用在恰当的环境下，都可以成为最佳交易。大部分优秀的交易员都有自己的个人偏好。保罗都铎据说喜欢做反转交易，理查德丹尼斯（RichardDennis）是一个以突破交易著称的交易员。保罗鲁特（PaulRotter）是一个刮头皮交易者。约翰亨利（JohnHenry）使用总是在场的方法交易一篮子市场。还有就是，大部分交易者都喜欢在市场趋势回调时参与市场。我喜欢高胜率的交易，所以我最常见的交易是回调入场。或者在震荡区间的顶部和底部反向入场交易。我特别喜欢突破交易，因为突破较为强烈时，市场大概率上（超过70%）有后续的趋势力量将价格进一步推进。反转交易我参与得比较少，因为大部分反转尝试最终都会失败。但当反转信号非常强烈时，我会入场交易。","pid":"p1327"},{"t":"para","text":"对于阅读我三本书的读者来说，读完这么多文字后。我们应该怎么开始我们的交易？第一本书写的是关于趋势，告诉我们什么时候市场会出现单边走势。第二本书写的是区间震荡，告诉我们市场没有明显单边走势时的状态，以及突破的概念，突破是市场从区间震荡状态转变为单边趋势状态的转折。第三本书写的是反转，告诉我们市场如何从一个单边趋势转向为反向趋势，或者至少是转为区间震荡状态。要同时消化这么多的内容确实是不容易，我们可以从一两个交易的逻辑开始。在本章我会举一些例子来进行阐述，但如果读者对某些特定的交易逻辑感兴趣，可以再详细到对应的某本书的对应章节去细细研读。当交易者对他们自己的个性更加了解后，他们可能会发现自己更适合某些特定的形态或者市场环境下的交易。不要与市场和自己的情绪抗争，而是应该保持自己舒适的状态，选择让自己舒适的交易方式，而不是为错过其他很不错的交易而感到可惜和噢恼。如果一个交易者关注的市场和时间框架太多，他就会发现成百上千的交易机会，但不是每个机会都能把握，最终也只能交易那么五到二十次交易机会，而其他都被忽略了。我们知道，主要的市场在5分钟图上一天都有5到10次不错的交易机会，如果交易者只关注主要市场的5分钟图，就能很轻松地把握这些最佳交易的机会。那么，交易者就有更多的精力来下单和管理他们的交易，那么长期来说就有较大机会稳定盈利。然后，他们可以逐步增加他们的交易头寸，之后可以轻松地从一个周期的图表中赚钱。这样想来，交易似乎很简单。不过，虽然交易的本质很简单，但我们在实际交易时还是很难实践，因为我们面临着来自世界上最厉害的一群交易者的残酷竞争，而且这是一个零和游戏。","pid":"p1328"},{"t":"para","text":"市场总是处于趋势和震荡两个状态，这两个状态对应的市场心态是：市场参与者认为当前市场的定价是错误的。价格要朝着定价正确的方向进行移动（趋势），直到达成整体一致的定价（区间震荡）或者市场参与者认为目前市场定价是正确的（区间震荡），需要等待市场出现分歧（突破），来将价格推向不同的区域。当趋势形成后，也有可能会出现短暂的休整，以及再次的突破。在某个时候，交易者认为市场趋势已经过头了，他们开始在市场进一步突破时反向操作，期待突破失败，震荡区间形成。在牛市中，这就形成了双重顶或者牛市最后旗形。在熊市中则相反，并形成双重底和熊市最后旗形。牛市最后旗形一般是高点1或高点2的入场信号，或者是三角形形态。熊市最后旗形一般是低点1或低点2的入场信号，或者是三角形形态。随着时间的推移，分歧意见最终在震荡区间内出现，市场再次突破，寻找新的一致意见区域。突破有时候会失败，市场反向寻找一致意见区域，形成反转。在每个市场和每个时间周期，这样的事情重复发生。突破成功的概率和突破失败、市场出现反转的概率各一半。所以交易的核心就是判断哪一个方向能够带来正的交易者方程式。","pid":"p1329"},{"t":"para","text":"赚钱必须是交易者的首要目标，长时间的无聊和枯燥，被短暂的紧张和不确定性打断，也是这个工作必不可少的组成部分。如果交易者等待几个小时都没有交易机会，他们就会变得沉迷于现状。一旦交易机会开始形成，他们有时候在精神上没有做好准备。不过，这是他们必须学会克服的挑战。他们做交易是为了赚钱，所以必须学会在恰当的时候出手，而且时刻做好准备。消防员每天都在等待，不知道什么时候警报会响起，但当警报响起时，他们必须立即行动，而且是完美地行动。他们是专业的，而且使命就是正确地完成工作。交易者们也是同样的，要学会为突然出现的交易机会做好准备，当机会来到时。必须快速、准确地做出响应。如果他们已经适应这种工作方式，能够保持舒适的状态，那么他们已经把交易变为本能，能够以此为生。","pid":"p1330"},{"t":"para","text":"有个朋友曾经告诉我，他之前一直做逆势的短线交易，而且一直亏钱，直到他停止了这种交易方式。现在，他一年能赚一百多万美元。他明白了选择最佳交易机会的重要意义，这个理念改变了他。除了选择强势反转信号之外，还要学会认清形势，顺势交易做好保护。交易者应该只在市场基本上位于均线上方时买入：在近期大部分K线处于均线下方时卖出。如果市场看起来上下突破都有可能，那么就等待。等待市场出现单边走势，K线明确地在均线的某一侧。交易者应该避开逆势刮头皮交易（因为这类交易风险大于潜在回报）。逆势刮头皮交易看起来很诱人，以至于很多交易者认为他们只是需要更多练习就可以获利。但实际上，这一类交易的方程式是负数，会逐步让交易者损失掉本金。在一个弱势的趋势通道中，逆势刮头皮交易最为诱人，顺势的交易看起来强度不足，在每个新的极点处，都出现一条看起来很不错的反转K线。交易者因为很长时间没有好的交易机会而变得焦躁不安。例如，假设目前市场有个疲软的空头趋势通道，那么通常在每次向新的极点突破之后不久就会出现一根多头反转K线。然而，这是由空头刮头皮交易者获利了结造成的，他们打算在多头K线的上方几个价位继续做空。不耐烦的交易者可能会在这根多头反转K线上方用止损单买进，却一直赔钱，原因是市场反转的概率本来就很低。因此，我们要耐心等待顺势交易的机会，如果没有出现你喜欢的交易机会，那么就不要交易，千万不要选择诱人的逆势刮头皮交易。一旦市场已经明确进入震荡区间，那么交易者们可以在这两个方向进行交易。然而。大部分初学者会在市场仍然处于趋势通道中时就开始逆势交易，那时距离市场演变成区间震荡状态还有一定时间，交易者会承受较大亏损风险。如果交易者不能自信地区分趋势通道和震荡区间，那么他应该只做顺势交易。","pid":"p1331"},{"t":"para","text":"另一种常见的错误是观察1分钟图或者更小的时间周期图表，例如Tick跳动图，或者成交量K线图。这些图标一两分钟看那个便会跳动，或者形成一根和多根K线。一天结束后复盘时，交易机会是很容易看出来的，但因为每笔交易的K线太小每笔交易的风险较低。但实际交易中，最佳交易出现的机会转瞬即逝，极容易错过。交易者大部分选择了那些机会不太好的信号入场。市场总是在反转，而且在1分钟图上每3到10根K线就会出现一次反转。然而，大部分反转的幅度都不足以产生一笔可获利的刮头皮交易，而是成为较大趋势中的旗形而已。在5分钟多头趋势中的1分钟顶做空的交易者，总是会亏损，而且最终会错过那个失败的1分钟顶将会产生的5分钟看那个买进信号。如果你的目标是赚钱（理应如此），那么你应该选择只做最佳交易机会。避开1分钟图或者类似的太短周期的图表。不过，如果你只是寻找刺激或者追求一种爱好，那么记住爱好是需要花钱的，其实有很多其他的爱好同样有趣。却价格没有这么昂贵。","pid":"p1332"},{"t":"para","text":"在考虑选择一笔交易时，交易者必须决定是买还是卖，是用止损单入场还是用限价单入场，做波段还是刮头皮，是正常交易规模还是先用较小的规模，是使用正常的保护性止损和利润目标，还是使用较大的保护性止损和较小的利润目标。这些因素的变化让方程式变化太多。他们在有限的时间内不太可能完全评估。一旦他做出所有决定，接下来就必须正确地设置订单和管理交易。当交易者刚刚入市的时候，这实际上是不可能的，所以他应该想办法减少必须做的决定的数量。","pid":"p1333"},{"t":"para","text":"大部分交易者应该保持工作简单，在每笔交易上做相同的四号桥，直到自己能够稳定地获利。对于刚刚开始的交易者来说。设置好止损幅度的入场指令比限价挂单入场要好。举例来说，如果市场处于议论多头趋势中，他正在决定是用止损单在前一根K线上方买进，还是用限价单在前一根K线的低点处买进。这时他应该使用止损单入场。原因是在他入场时，市场正在向他的方向运动，而且继续上涨的概率较大。如果他使用限价单挂单入场，那么市场回调幅度会变得很大，那时候他可能会开始担忧市场趋势是否发生变化，并可能在趋势继续之前就止损离场了。最开始的时候，交易者应该在每笔交易上使用相同的头寸规模，相同幅度的保护性止损，以及相同幅度的利润目标。无论波段交易还是刮头皮，他总是应该制定与保护性止损幅度一样大的利润目标。一旦入场，就不应该改变计划，比如将波段交易转化为刮头皮交易，或者相反，又或者更为恶劣地把刮头皮转变成利润目标小于风险的刮头皮交易。如果他发现自己在入场后改变计划，那么他应该设定好交易的参数，然后走开，一个小时后回来。如果从下单时就开始担心自己资金的风险，那么他需要交易更小的头寸。如果他之前一直交易500股SPY,那么他此时应该只交易100股，以便让他自己处于完全不在乎的状态对于交易者来说，使用100股在60%的交易中盈利，比使用500股在80%的交易中亏钱要好，主要是因为焦虑会导致他无法遵守自己的计划。他总是急切地希望自己的交易马上得到市场的确认，这样的话可能会经常在市场趋势快要反转时入场。他需要培养自己的耐心，避免在突破时入场，而是在回调时入场。为了培养耐心，他可以限制自己每天只做三笔交易。一旦完成这三笔交易，他就不得不到下一个交易日再设定做三笔交易另一笔交易。耐心的训练需要更长的时间，要能够经受住很多看似很好的交易从眼前溜走。当他对一笔交易入场信号有怀疑时，他应该假定市场已经进入震荡区间，此时他应该低买高卖。正打算做第一笔交易的初学者，应该考虑寻找开盘趋势中开始的趋势中的波段交易，或者当天任意时间出现的强势的反转。潜在回报应该至少是风险的两倍。虽然外汇市场实际上是24小时的市场，没有所谓的开盘时间。但除了这一点以外，其他的行为特征跟股票和期货很像，应该采取一样的交易方式。如果交易者挑选那些信号强烈的交易机会，配合恰当的市场环境，尤其是二次入场的信号，那么胜率可能会超过60%，这时交易者的方程式是强烈的正向结果。没有达到止盈目标的交易一般要么小幅亏损，要么小幅盈利，但一般能够相互抵消，整体的风险可控。一般来说，交易者可以提前预感到某个交易信号的可能出现，因此一般会做好准备。通过练习，他们可以做更多的交易，寻找成功率超过60%，回报和风险至少一样大的交易机会（不一定要寻找回报是风险两倍的波段交易机会）。在5分钟K线图上，通常每天会有5到10次这样的交易机会，由于回报一般不会超过风险的两倍，所以这一类交易属于刮头皮交易。例如，多头趋势中的高点2处的回调，回调至均线附近的交易如果出现多头强势趋势K线，便是一例。空头趋势中低点2的反弹至均线附近如果出现空头趋势K线也是。当交易者获得更多经验之后，便可以尝试在市场高潮时介人。稳定获利后。交易者可以逐步增加任何其他方程式为正的交易模式，包括一些潜在回报小于风险但胜率超过80%的刮头皮交易，又或者是一些潜在回报大于风险的两倍但胜率低于40%的波段交易他们还可以在震荡区间顶部和底部高抛低吸（尤其是根据二次入场信号进行交易），这时他们更加合理地相信市场将会出现反转。突破入场是一个不错的交易策略，但对于很多新手来说非常难把握，所以一般应该等待市场回调时入场。","pid":"p1334"},{"t":"para","text":"在最初决定止损位时，交易者通常犹豫不决。如果市场行情支持，那么在多头趋势中，行情再次向趋势方向等距移动一波的可能性超过60%，只要我们的止损幅度不要设置太宽或者太窄（例如一根K线的波幅是50个点，我们设置2个点的止损，这是不合理的）。所有交易者选择的交易，只要风险不是太大，都有一个正的交易者方程式。如果一根K线的波幅非常大，例如50个点，那么交易者可以用8个点的止盈和止损幅度，或者19个点的止盈和止损，而这些点都会有一个正的交易者方程式。不管交易者怎么选择，只要止盈和止损相当，而且止损不是太大，一般都问题不大。一般的交易者知道怎么样叫作过大的止损，他们会参考目前K线图上最大的那根K线的幅度。他们也知道止损幅度不能太小的标准，也就是当K线较大时，止损幅度明显小于一般的K线的波幅。止损幅度一般设置在你的正常止损的范围，或者比正常范围大50%到100%。明白这一点可以减少你决策时的紧张情绪。快速选择一个合理的止损幅度。如果线幅度较大，你可以用正常的止损，例如电子迷你期货里面一般是8个点，或者可以高出2一3倍，只要你的预期盈利至少是跟止损差不多大。","pid":"p1335"},{"t":"para","text":"交易者方程式结果为正的交易，在数学上都是合理的交易。举例说明，在AAPL股票交易中，如果交易者有50%的可能在亏损1美元之前盈利2美元，那么交易者的方程式就是正的，这是一笔不错的交易。如果交易者有60%的可能在亏损1美元之前赚1美元，或者有40%的可能在亏损1美元之前赚3美元，那么这也是一笔不错的交易。这些交易是经验丰富的交易者每天都在做的，也是赖以为生的利润来源。在这些交易中，有些交易特别好，信号K线非常强烈，后续跟进力量也足够，这时交易者的方程式是非常强烈的正向结果。最佳交易一般要求这些交易的盈利和风险差不多大，而胜率是60-70%，或者盈利是风险的两倍以上，胜率在50-60%。最佳交易是交易的初学者们首先应该掌握的交易方式。因为交易本身是非常困难的，这些交易可以让交易者们拥有最大的余地，提供赚取利润的最佳机会。举例说明，假设有一轮多头趋势，突然出现一波强烈的抛盘，价格跌至均线的下方，然后出现一波楔形的反弹，形成一个略高的更高点；反弹过程中，包含了多根阴线，显示抛盘压力仍然很大，而且有一根空头趋势反转K线向下突破了多头趋势线。这时，如果交易者在这根K线的下方卖出，获得比风险大两到四倍的利润的可能性是非常大的，可能会有70%，每天在更小的周期的K线图上，这样的机会还是非常多的。","pid":"p1336"},{"t":"para","text":"对于初学者来说，趋势反转的机会可能比较难把握，因为一般来说反转都很容易失败，趋势一般都会延续。而且初学者较为急切，在反转势头还不是很强烈，信号还比较弱时就急于入场。对于重大的反转来说，必须要有对重要趋势线的强势突破，以第一波反转浪拥有较强的动能，而且有一根强势的反转K线作为标志。然而，聪明的交易者们会等待第二次对趋势极值的测试，在测试失败时入场（等待形成一个双重顶的更低的高点，或者更高的高点，或者双重底部的更低或更高的低点）。他们希望信号K线是一根强势的反转K线。如果上述特征没有表现出来，那么他们不应该进行交易。止损的管理与前面讲过的趋势交易是相同的。重大反转的潜在回报一般是风险的很多倍。那些成功概率大于60%的重要反转很少出现，但胜率为50%到60%、潜在回报是风险的两倍左右的机会却每天都会出现。在市场实现潜在回报之前，可能会有一波盈利的回调，很多交易者面对曾经有过一些微利但目前又再次回到入场价位甚至面临亏损的情况感到很大压力，拿出头寸是非常难的。然而。只要市场状况与之前的判断没有大的变化，坚持到最后就是不错的选择。","pid":"p1337"},{"t":"para","text":"在大部分交易日的开盘区间，有一些很强烈的入场信号。例如，如果市场跳空开盘，上冲一段距离后，回调至均线附近，与开盘的K线形成双重底部，之后有一个强势的多头反转K线，那么至少有60%的概率在此处的多头仓位在未来几个小时可以实现超过风险很多倍的利润。超过80%的交易日，在开盘时都会形成一些不错的交易信号。每个信号入场后，可能会出现预期的趋势，也有可能不会，但风险都比较小，而且亏损和盈利大致可以相互抵消。开盘趋势的大部分反转，只有30%可能会产生比风险大两到三倍的回报。不过也会有一些的胜率超过60%，交易者要学会捕捉这些机会。当他们找到一些这样的机会时，也需要学会承受一定的回调，因为反转在开盘区间是非常常见的。甚至在强烈的反转信号出现后。也需要一定时间市场才会向预期的方向发展。或者交易者可以选择所有的合理的信号入场，只要潜在回报至少与风险一样大。尽管这些机会中赚取超过风险两倍以上的利润的机会不是很大，可能只有50%，但赚取跟风险差不多的回报的概率还是可能超过60%的，可以有正的交易者方程式。在本书的第三部分关于开盘交易的部分讲到过具体的案例，而且关于方程式的具体细节，在我的第二本书中也有讲解。","pid":"p1338"},{"t":"para","text":"如果交易者能够适应市场的快速波动。以及风险的增加，那么他们可以在市场趋势处于高潮时入场。例如，他们可以在熊市卖空潮的第二根、第三根或者第四根的K线的收盘做空，设置较宽的止损幅度，甚至设置在下跌潮开始的顶部。不过一般他们不需要冒这么大的风险。如果他们止损较宽，那么他们的头寸就要缩小，但潜在回报与风险至少一样大的概率仍然超过60%。如果下跌浪潮非常强劲，市场背景也非常配合，他们的实际风险可能不到一半，而胜率可能会超过70%。难点在于，市场的下跌潮出现得太快，初学者们通常没办法很快反应，并及时做出调整。他们需要加大自己的头寸、风险和潜在预期的回报，而且需要在情绪上适应快速大幅的市场价格变化。这通常超出了初学者能够处理的范围。把握这些最佳交易的关键点在于在他们还未形成时就能够敏感地发现并做好准备，这需要不断的实践。不过，如果交易者只专注其中某一种，而且加强练习，就能很好地掌握。","pid":"p1339"},{"t":"para","text":"还有一个不错的例子出现在强势的价格高潮结束后。举例说明，例如市场刚刚形成一个四根连续空头K线的下跌浪潮，并向下大幅突破震荡区间的下沿，而且下跌浪的这几根K线的上影线都比较短，主体也较为适中（也没有大到那种很恐怖的抛售浪潮）。这时候，市场可能在形成一个低点2的回调，而且伴随着一根熊市反转K线作为信号K线，价格向移动平均线靠近。这个入场机会获得至少与风险差不多的潜在回报的概率超过70%。","pid":"p1340"},{"t":"para","text":"有些入场信号出现在强势趋势日，大部分的K线都在均线的某一侧，而且日内向移动平均线靠近的回调出现的次数也很少。虽然这样的强势趋势日在一个月内也不会有几天。但就日内来说，还是有很多次可靠的趋势交易机会的。在这些趋势回调时顺势入场，尤其是当价格在多头趋势中形成均线处的高点2、楔形，或者三角形的买入信号，空头趋势中的均线处的低点2、楔形或者三角形的卖出信号，可能是日内交易中最可靠的交易机会。如果交易者跟踪一篮子大约五只的股票，他们的成交量足够大（每天超过500万股），平均日内波动区间为两美元或者更高，那么每天交易者可以做一到两笔交易。刮头皮交易的利润大概是股票平均日波动区间的三分之一，波段交易的利润通常会更高，所承担的风险约为回报的一半。入场后，他们一般会在信号K线当前的最高点或最低点附近设置保护性止损（止损一般在60美分以下，他们很少设置超过1美元的止损幅度），直到入场信号K线收盘后，他们观察到这根K线成为向上的多头趋势K线，他们就会把止损一直设置在略微更高的位置。举例说明，如果一只股票的日平均波动区间为3美元，那么一旦股价向他们有利的方向运动60到80美分左右之后，他们就应该把止损移动至盈亏平衡点或者附近几便土上下的位置。如果他们在120.10美元买进，股价击中120.80美元。那么交易者应该把止损移动至120.07美元。当账面利润达到1美元时，他们会了结一般的仓位，剩下的一半的止损设置在盈亏平衡点附近。在5分钟K线图上，交易者还可以把自己的保护性止损进一步调整至波段低点上方，然后在利润增长至2美元时再了结一小部分仓位。剩下的仓位，交易者应该让它的利润自由奔跑，直至触及止损或者当前趋势已经明确转向。","pid":"p1341"},{"t":"para","text":"如果在多头趋势回调时买入是这样一个不错的交易策略的话，那为什么交易者还是那么难实现持续盈利？这是因为任何策略都有其自身的缺陷。只有当策略信号出发后的几根K线之后，你才能发现这是一个不错的策略，但很多时候你并没有跟随信号入场，最终噢悔不已。很多回调都是作为反转开始的，你可能会担忧市场是反转还是回调，而且出现空头反转K线时你还在害怕买入，这就很容易错过多头旗形的买入机会。大部分时候，趋势开始于震荡区间，而震荡区间的策略应该是高抛低吸。所以当市场出现第二波上升浪形成的高点2时，你还在犹豫不决，因为那里是区间的顶部，还未形成突破。不过，如果大背景是好的，而且反弹信号很强烈，那么买入就是正确的。类似地，当市场处于空头趋势时，在交易区间底部的低点2做空就是正确的。如果交易者还不够确定，那么就等待，等待市场给予他足够的信心。但如果交易者方程式的结果对自己是有利的，就必须学着做那笔交易。是的，他们常常会亏损，但数学概率在他们那一方，就不用担心。记住，一位伟大的棒球手70%的时候都没办法击中球，但却可以从另外的30%赚到数百万美元。经验丰富的交易者可以在60%以上的时间内盈利，平均盈利大于平均风险，有些甚至是风险的两倍以上。保持耐心。选择交易者方程式对自己有利的交易，相信数学概率。","pid":"p1342"},{"t":"para","text":"回调入场的交易策略的前提是，市场必须在强势的趋势或者波段中。由于一般开盘后一两个小时才能看出当天5分钟K线图上的趋势，所以一般开盘第一个小时很难有趋势交易机会。最容易识别的交易信号是在强趋势或波段中向均线的两浪回调结构。价格朝着均线回调看起来不会引发更多的趋势性的价格变化，但实际上，回调之后一般会有一波新的趋势浪，超越原来的趋势极值，幅度远比你想象得要大。在强势趋势目，可以把部分顺势交易的头寸进行波段交易，这就意味着你的盈亏平衡点可能会在波段交易中触及。不过，大的趋势性走势可以弥补这部分损失。每一次有新的入场信号时，你要么可以把刮头皮交易部分的头寸加回去，要么在当前未平仓的波段交易头寸基础上再加一个完整的头寸。一旦你的刮头皮交易头寸离场后，你的波段交易头寸规模可能是正常波段交易规模的两倍甚至更多（如果你在每次有新信号时不断加仓的话）。对于大部分交易者来说，只是加回刮头皮交易的头寸，或者坚持最终的头寸。在不同的利润目标位逐步退出是更容易操作的，否则，最终会因为持有太多头寸而感到不适，而不适会导致很难遵守自己设定的交易原则。","pid":"p1343"},{"t":"para","text":"市场是有惯性的，因此，当它做趋势运动时，大约80%的趋势反转尝试都会失败，最终变成旗形形态（延续趋势的形态）。记住，趋势中的回调。实际上是反转尝试失败的结果。因此，回调入场交易，是大概率上可靠的一种交易策略，也是大多数交易员最常使用的方法。有些回调很大，会延续一两天，入场信号看起来像一个反转信号。但如果你用更高周期的K线图来观察，或者把当前图表上的K线压缩以便看到更长的时间周期，那么你看到的只是一波回调。","pid":"p1344"},{"t":"para","text":"毫无例外，所有的强趋势最终会出现较大的回调，演变成震荡区间。很多交易者会等待市场演变成清晰的震荡区间后再开始区间交易方式，但如果交易者很擅长阅读图表的话，那么他们有时候可以在震荡区间形成的早期就开始参与。而一般震荡区间开始于前一波趋势浪的终点。举例来说，市场在一波积累了很多卖盘压力、疲软的多头趋势出现新高时做空，而且市场处于一个或多个阻力区域，并达到了前一波的测量的运动目标。当多头趋势动能耗尽时，交易者做空，并预期接下来有一波较大的回调。或者形成震荡区间。在震荡区间中。交易者一般可以做刮头皮的短线交易，例如在电子迷你期货交易中，当日平均区间是10到15点时，他们在寻找2到3点的利润目标。趋势反转交易者们寻找的是大的调整空间，甚至是趋势的反转，因此将交易波段化，计划寻找至少是4个点以上的空间。","pid":"p1345"},{"t":"para","text":"如果眼前的K线图表从左下角附近开始，右上角附近结束，而且中间没有任何下跌浪跌破屏幕中点，或者，如果出现几个波段，包含大量多头趋势K线。只有小幅的回调，那么交易者应该在趋势信号K线触及或者向上突破均线的高点2附近买入，尤其是信号K线的收盘价高于均线时。一旦入场后，入场K线如果是一根趋势K线，那么就应该把止损从信号K线下方一个跳动处上调到入场K线下方的一个跳动处他们应该考虑在回报等于风险时以刮头皮交易退出一半头寸（可根据经验进行调整），然后把止损移动到盈亏平衡或者附近上下一两个点位，利用每一个新的机会加仓。大部分市场的强趋势的时间都在20%以下。","pid":"p1346"},{"t":"para","text":"当市场明显看涨时，在高点附近买进（或者在高点附近的回调买进），在更高价位离场一般都是能够盈利的，因为趋势在出现重大回调之前一般会运行一段时间。但当市场处于震荡区间内时，在高点附近买进通常是错误的，应该在区间底部附近买进。当交易者们不知道如何区分趋势和震荡时，他们可以选择在一波强劲上涨或下跌回调到一定程度后介人，这种方法适用于趋势和震荡，所以是一种不错的方法。如果市场在一波上涨趋势后形成多头旗形，那么准备买进。如果它在一波抛盘后正在形成一个空头旗形，那么准备卖出。","pid":"p1347"},{"t":"para","text":"在取得一定成功后，交易者二般会获得一定的自信，并开始打算向自己的“武器库”里添加更多的武器工具。另外，当他们看到很多可以获利的刮头皮的机会在眼前时，不愿意再为了最佳交易等待一两个小时甚至更多时间。最糟糕的事情是他们在窄幅震荡区间内交易。窄幅震荡区间一般出现在一天的中间交易时段，此前你已经关注入场机会一两个小时了。他们通常出现在震荡区间的中间位置，在相对水平的均线附近，看起来比较简单。然而，我们需要非常警惕这种形态，它可能会伤害你的账户和心灵。遗憾的是，很多人都觉得自己能够弄明白如何交易窄幅震荡区间，然而却奇怪自己为什么业绩下滑了那么多。","pid":"p1348"},{"t":"para","text":"注意，用止损单在震荡区间向上突破时买进，在震荡区间向下突破时卖出，并不在最佳交易之列。实际上，这恰恰与最佳交易的要求相反。初学者不应该使用止损单在震荡区间突破时入场，因为大部分突破都会失败，不管它看起来有多好。记得我的第二本书里面也说过，震荡区间里经常会出现多头上涨浪，快速运动至震荡区间的顶部，看起来肯定会突破：底部也经常会出现空头下跌浪，看起来像一个强势向下突破的起点。但是两种突破都会失败，很快出现反转。在震荡区间内，应该低买高卖，不要追高或者杀跌。如果交易者希望做突破交易，他们应该等到市场出现明确而且强劲的突破后，回调入场。通过一定的练习，如果交易者担心等不到回调，也可以在上涨的K线收盘前或者收盘价入场。","pid":"p1349"},{"t":"para","text":"在区间顶部卖出，底部买入是一个合理的策略。尤其是当二次入场信号出现时。不过对于初学者来说，这种交易比较困难，因为看起来像是逆势交易。市场通常会向区间顶部或者底部加速运动，看起来很快要突破，但大部分都会失败。当入场信号出现在信号头寸方向已经强势发展一段时间后是比较好的。举例说明，如果市场出现一波强势的上涨向区间顶部靠近，然后出现楔形多头旗形的整理形态，那么在旗形向上强势突破反转时买入，是一个不错的交易。不确定性是震荡区间的标志，这也意味着较低的胜率。市场大部分时间在区间中部，大部分的交易的成功概率是50%，有时候会以很强势的走势向区间顶部或底部移动，看起来肯定是一个成功的突破，但经验丰富的交易者明白，这一波上涨或下跌浪只是一个测试，80%都会失败。虽然每一浪都很强势，但市场60%到80%的概率会反转，向区间的另一侧进行测试。对于初学者来说，这些向区间顶部或底部的走势如此强势，以至于很难想象其会突破失败。然而事实情况是，几乎所有的突破尝试都会失败，这些突破的强动能把交易者套入错误的方向，然后向正确的方向进行发展。记住，每一种交易策略都有其难点，但能够理解这些难点的交易者能够看到它给出的机会。","pid":"p1350"},{"t":"para","text":"当市场不是在明确的趋势运动中时，如果市场出现低点2，那么我们应该等市场反弹到前一波高点附近时卖空，如果市场出现高点2，那么我们应该等待市场回调到前一波低点附近买进。也就是低买高卖的区间交易法。在这些等待的日子里。市场可能还会有很多持续5到10根K线的波段，然后价格突破趋势线，形成相反的波段。如果价格朝原来的方向的极值移动的动能很强，那么等待二次入场机会，一般都会在5根K线左右出现。","pid":"p1351"},{"t":"para","text":"在最佳交易信号中，初学者应该主要选择采取止损单入场的交易，因为这种一般是顺势入场，入场后市场一般还在朝他们头寸有利的方向移动。此外，他们只应该在多头趋势K线上方买进，空头趋势K线下方卖出，也就是只做顺势交易。你知道如何能够让一笔交易的胜率超过60%吗？如果你认为某个交易信号很不错，很可能成功，那么你应该假定你的胜率至少是60%。当你对某个交易信号特别自信时，你可以假定胜率为70%，来计算你的交易者方程式。在我的三本书中介绍的很多交易策略，只要运用在合适的环境中，都能够成为最佳交易，但很多只适用于已经稳定获利并且能够熟练读图的交易者。对于大部分交易者来说，还是应该有所筛选，只做最佳交易机会。记住，即便一个交易机会有60%的胜率，但也还有40%的概率会失败，如果刚好有个40%的概率射中你的枪手在瞄准你，你还是很危险。时刻牢记，40%的概率失败是很真实、很危险的一件事，所以总是记得要设置保护性止损。","pid":"p1352"},{"t":"para","text":"胜率在50%到60%，回报是风险的两倍以上的交易机会，在大部分市场中一天至少出现一次。另一个好的选择是，胜率在60%到70%，回报和风险对等的交易机会。举例来说，在电子迷你期货的5分钟K线图上，这样的机会一天至少有几次，但大部分交易者很难说服自己成功率有60%，所以这些交易机会一般适合经验更丰富的投资者。另外这类交易信号的频率也不高，不像一天要做15次甚至更多交易而感到决策的压力，所以交易者可以更客观、更有可能在最佳状态来阅读图表、发现机会。","pid":"p1353"},{"t":"para","text":"交易者一定要寻找一个与自己的个性相符的交易风格，因为如果交易者打算以交易为生，那么就需要在这份赖以生存的工作中感到愉悦和快乐。在一天交易结束后打印出来的图表上，我们一般会看到刮头皮交易是一个不错的交易策略，然而很少交易者能够时时去交易刮头皮的机会。这些机会出现得太快，所以最佳入场信号一般难以把握。所以交易者一般选择这些不太好的交易机会，使得自己最终亏损。这使得他们的交易策略最终变成回报小于风险的糟糕的刮头皮交易。这是所有交易者都应该避免的。刮头皮交易最大的问题在于，在60%的交易中赚钱是容易的。这给交易者带来一个错觉。认为发财离自己不远了。然而，刮头皮交易的胜率应该要达到80%以上，交易者才能赖以为生。虽然他们认为自己已经很接近那个胜率，但永远达不到。小型刮头皮交易的另一个问题是，初学者常常误认为某个交易策略的胜率是80%，但很多交易实际上胜率只有60%，虽然他们认为看起来很确定。而且初学者认为自己只要稍加练习，就可以将胜率提高到接近80%，那样数学概率上来说就对自己有利。然而，事实上他们很难达到那么优秀，即便最优秀的交易者也极少能达到。这就是真相。另外，他们的精力也不足以平均每天交易20到40笔。那需要非常惊人的专注力和超常的快速图表阅读能力。即便有很多时候他们做得非常好，一连十天的小型刮头皮交易都是盈利的，但这很可能是统计偏差造成的，而不是能够持续数年的交易能力带来的。结果往往是，他们在大部分时间是赚钱的，但平均亏损却大于盈利，这样他们的账户会慢慢消失掉。","pid":"p1354"},{"t":"para","text":"与刮头皮相比。另一种极端是为了至少是风险两倍以上大的利润而做波段交易。二天只寻找一到两次交易机会，这些机会大部分只有40%到50%的确定性，也就是胜率不高，但这足以产生一个较好的交易者方程。当一个入场的机会看起来有50%到60%的确定性时，它是一个最佳交易机会。在大部分交易日，这样的机会一般只有一两次，个别有五次甚至更多。这是最可靠的策略，但大部分交易者没办法在屏幕前坐几个小时等待一个交易机会。另一种专注于波段的方法就是采取总是在场的策略，一天内可能会反转几次，努力时刻待在市场中。然而，大部分交易者则会都需要休息，而且一般在头寸反转的时候会经历比较痛苦的过程。虽然他们会按照总是在场策略的头寸方向进行反转交易，但因为他们是在做波段交易，所以会把注意力放在赚取与风险差不多大的回报上，而不是在下个信号就马上反转头寸。记住，如果一个信号的强度足以成为总是在场策略的反转信号，那么它至少有60%的胜率，平均来说是这样。这就意味着。如果交易者选择这些信号，而且每次交易的利润目标和止损自标差不多的话，那么他们就会拥有一个正的交易方程。","pid":"p1355"},{"t":"para","text":"两个极端之间的部分可能最适合大部分日内交易者，也是很多经验丰富的日内交易者的选择。他们一般一天做5到10次交易，而且每次都在回报至少与风险一样大、确定性在60%以上时才交易。这些交易者们经验丰富而且激进，他们会在一些小周期形态例如双重顶做空，双重底买进。他们不会考虑实际胜率有多高，而是主观决定这个交易是否看起来不错。如果交易者认为某个入场信号很强。回报至少跟风险一样大，那么胜率一般都会超过60%（在第二本书的第25章解释过）。这允许交易者设定和目标利润一样大的止损幅度，但仍然拥有一个正收益的方程式结果。虽然这是大部分成功交易者的风格。但对于初学者来说不应该效仿，而是寻找更强的波段入场信号，尽管成功概率只有50%到60%。一般来说，如果目标利润是风险的两倍以上，尽管胜率不高，但能获得更好的方程式结果。例如，在电子迷你期货交易的平均日波动区间为10到15点左右时，寻找很可能赚到4点（初始风险的2倍）或者更多的波段交易机会。在达到获利目标后部分或者全部离场。通过练习，交易者可以在目标利润达到风险的一到两倍时通过刮头皮交易部分离场，剩余头寸继续追逐波段利润。如果他们专注于这些入场信号的交易策略，他们在给自己的盈利一个合理的空间。如果交易者发现自己经常过早离场，那么他们应该考虑使用双向订单（OCO），即在目前价格的上下设定两个订单，一个是在价格朝有利方向发展、获利2到4点时止盈退出，一个是在价格向不利方向发展、亏损在2个点以内止损退出，任一订单成交后另一个订单就会取消。设定好这种订单后，交易者可以走开，一个小时后回来，可能会神奇地发现自己学会止盈止损了如果市场的趋势确立，可以继续顺势介人更多头寸，用2个点的止损去刮取2个点的利润，一旦趋势很强，则可以介人部分头寸追逐波段利润。虽然听起来这些方法都很简单，但交易永远不是一件简单的事情。因为你是在一场零和游戏中与市场上最聪明的人在竞争。收盘后复盘时看起来很简单的一个交易机会，却不容易在町盘的时候发现。要实现持续稳定的盈利很不容易，这需要多年的磨炼，而且即便你连续几年达到了稳定盈利，也还是需要每天保持敏锐度和纪律性。这是非常具有挑战性的，也是交易的部分魅力所在。如果你能挑战成功，金钱的回报是巨大的。","pid":"p1356"},{"t":"para","text":"每次交易时，你必须要考虑交易者方程式，只有当你的确定性乘以潜在回报远远大于不确定性乘以潜在亏损时，你才能够入场交易。通过止盈正损单，我们可以规划好我们的利润目标和亏损幅度，尽管有时候极端行情下的滑点可能会让我们损失更多。这个交易这方程式最难确定的部分是胜率，我们永远无法精确知道。一般在交易时，你很难有太多时间去考虑这个，所以我们尽可能地将这个数字简化，给自己两个选择，决策就会快很多。当你不确定这笔交易的胜率时，用50%这个值，那么这就意味着你的止盈目标和止损幅度应该至少差不多。如果你对这笔交易很自信，那么胜率就用60%这个值，尽管很多时候胜率可能会更高。","pid":"p1357"},{"t":"para","text":"这个数学方程有着很深刻的意义。举个例子，假设你在AAPL股票的5分钟K线图上交易，你的止损位是1美元，而止盈目标是50美分，胜率是60%。如果你做10笔交易，那么就意味着你有六次能赚钱，假设是赚50美分，总共可以赚3美元。如果四次亏钱的话，每次亏损1美元，就总共亏损4美元。那么总的来说，你亏损了1美元，还有另外要加上交易佣金。这就是刮头皮交易者的困局，这也是为什么大部分交易者应该避免刮头皮交易，因为风险经常比利润空间大。经验非常丰富的交易者或许能够把胜率提升到80%，假设设定的止损位是80美分而止盈目标是40美分，那么10次下来，你还是只能赚16美分。这是一个盈利能力很弱的交易策略。何况这还是经验丰富的交易者才能做到的，所以大部分交易者要避免这种交易。而是专注于潜在回报至少比风险大的交易策略。还是回到AAPL的交易例子。如果你的止损幅度是1美元，那么除非你能够有60%的把握这次交易信号可以赚到1美元，否则不要入场。当我们使用波段策略交易时。我们要容忍趋势的回调，因为一般波段交易需要耐心等待市场达到我们的目标止盈位。而只要我们等待的时间越多，回调的风险就越大。","pid":"p1358"},{"t":"para","text":"趋势通道一般很难交易。而且因为市场很多时候都处于通道内，所以大部分日内的K线都很难产生好的交易机会。如果交易者是以止损单入场的，牛市趋势通道一般都会将入场信号产生在通道顶部。一般在市场出现一波上涨后。随之而来的是通道的形成。此时一般会出现几个高点1、高点2的入场信号。然而如果后续通道走势不是很强，在高点买入是不太好的。牛市趋势通道一般不是很强烈的牛市趋势，尤其是当斜率不陡峭时。如果在这种通道顶部买入，一般交易者的方程式都不太好。在我的第一本书中，我详细探讨了如何交易趋势通道。这种形态一般很难产生最佳交易策略。尤其是当通道很窄的时候。当通道扩大、波幅增加时，一般能够有一些回调入场的机会，且可能带来最佳交易机会。当通道幅度太窄时，交易者一般会等待通道向下突破，然后评估下跌突破的力度是否足够强劲。如果足够，市场下跌趋势将会形成，交易者们便寻找下跌趋势做空的机会。如果市场出现一波强劲的下跌浪，那么此时做空的胜率是超过60%的，能够产生一些最佳交易机会。当价格从这波下跌浪低点反弹时，能够产生一些可靠的低点1或低点2的做空交易机会，尤其是当入场信号K线是在移动平均线下方的一根下跌趋势K线时。这些也是不错的交易信号。当市场反转成熊市趋势通道，且通道宽度较窄、斜率不够陡峭时，交易者很难再次找到合适的入场机会，他们应该等待市场再次突破熊市趋势通道，反转向上，寻找合适时机做多。","pid":"p1359"},{"t":"para","text":"当你交易一个5分钟K线图时，一天内出现一次回报是风险的两倍，胜率在50%以上的交易机会的概率超过90%。当我们把一天的图表在收盘后回顾时，很容易发现这类交易机会，但在实时交易时却并不像你希望的那么完美。对于大部分交易者来说。要赚钱的关键在于练习如何能够提早预判和发现这类交易机会，而且将自己的注意力专注在这类交易机会上，除非自己已经很稳定的盈利、拥有非常丰富的经验了，才考虑其他交易机会。要坐在电脑前几个小时不做交易对很多交易者来说是件比较难的事情，但要记住我们的目标是赚钱，而不是交易本身。如果你目前并没有实现盈利，那么要考虑减少你的交易次数，一天只交易1到3次，而且要确保这些交易是最佳交易策略，例如在强势趋势中出现两个下跌浪组成的回调入场机会、强劲的开盘反转入场机会、市场强劲地突破趋势线带来的趋势反转交易机会，或者是跟随强劲的趋势浪顺势入场的机会。做波段交易的话，交易者要设置足够的止损幅度来容忍一定的回调，不要太轻易就止损出局。只要入场时的交易逻辑没有变化，就要坚持拿单。当市场价格在测试入场价位（这里会打掉很多交易者的止损单，因为他们可能会过早把止损移动到盈亏平衡点）之后开始重启趋势，才考虑将止损上移到盈亏平衡点。","pid":"p1360"},{"t":"para","text":"当我们看逐根K线阅读图表时，就会发现很多交易信号。但这些交易信号并不代表我们就要跟随入场。在每个市场、每个时间周期的每个图表上，每隔几根K线都会有一些交易信号出现。例如，在电子迷你期货的5分钟K线图上，能够出现大概15次带止损的入场单获利2个点的交易机会，20到30次限价单入场获利2个点的交易机会。但这些机会转瞬即逝，在发生的时候并不清晰，不确定性比较高，而且很难有交易员能够全部把握。交易员不应该一天交易40次以上，尤其是对于初学者。应该集中精力练习寻找3到5次最佳交易机会。即便经过练习能够发现这类交易机会，也不一定都要交易。不要因为时候看到某个交易机会很好而自己没有把握到就深感可惜。伟大的交易员对于自己日内看到的大部分交易机会都没有去交易，原因很简单，决定他们盈利的不是交易次数，而是交易者方程式。次数可多可少，关键在于方程式的结果是否让自己满意。","pid":"p1361"},{"t":"para","text":"在电子迷你期货或者其他任何市场的5分钟K线图上，每天都会出现本章的一个或者多个交易信号。如果交易者肯耐心地等待本章的交易信号出现，而且只专注于本章的交易信号的训练，那么他们可能会很成功。不过，学会如何控制自己只做最佳的交易机会，或许是交易中最难的部分。如果他们到现在为止都还没赚钱，那么他们应该认真地考虑下听从我的建议。赚钱的一个要点就是避开那些糟糕的交易。这些交易带来的亏损总是会抹掉好交易产生的利润。在成为稳定获利的成熟交易者之前，最需要要避开的是紧凑交易区间的那些交易信号，尤其是当这类信号出现在交易区间的中间地带。或者伴随着水平的均线，而且当天不是一个明确的强趋势日的时候。","pid":"p1362"},{"t":"para","text":"当尝试一种新的交易策略时，交易者应该把这个策略涉及市场的交易周期的K线图表进行复盘，看自己的策略是否能够在过去有效。当最初开始实盘时，应该只用1手期货或者100股股票下单，不论他们拥有多大的实盘账户。当他们认为自己有经验可以加大操作仓位时，他们可以决定一下自己的下单量。但实际下单时，他们只应该下四分之一的单量。例如在电子迷你期货交易中，如果他们希望下单10手，那么实际下单只应该在2到3手。他们需要保持非常轻松的心态，即便未来出现几次连续的亏损，依然对心态没有什么影响。如果他们门按照他们能承受的最大单量来下单，连续几次亏损不可能依然保持心态轻松。只有在他们连续几周或者几个月都盈利时，才能加大一些仓位。但实际上，很多人花了很多年的时间都没办法实现稳定盈利。","pid":"p1363"},{"t":"para","text":"交易最难的一部分是判断一个交易信号是否值得交易。这一点在实际交易中更加难，因为交易者总是需要市场的下一根K线来验证他们的判断，但一旦这根K线出现，就已经错失了最好的入场机会。要做到一看图表就知道市场正在发生什么，需要很多年的练习。即便是那个时候，也没有办法完全清晰，万事没有绝对。不过，有的机会相对另一些机会比较容易看懂，初学者专注于一些他们看得懂的交易机会，是比较明智的。幸运的是，这个市场上总有那么一些机会是比较容易看懂的，而且也能带来较大的成功概率。","pid":"p1364"},{"t":"para","text":"一旦你可以实现在电子迷你期货中每天保持净赚一两个点左右，或者在AAPL股票每天净赚50美分或者1美元，那么你就应该集中精力去增加自己的交易规模，而不是加人大量新的交易模式，因为你已经可以捕捉最佳交易模式了。如果你交易25手电子迷你合约，一天净赚2个点，那么一年你就可以赚50万美元。如果你交易一百手并且每天净赚4个点，那么一年就能赚400万美元。很多股票的成交量足够大，大部分时间可以处理3000股甚至更多的单子而不产生滑点，如果你只交易一只股票，每次交易3000股，平均一天赚50美分，那么一年大概是30万美元。","pid":"p1365"},{"t":"para","text":"对于初学者来说。最难做到的事情就是为一个交易信号等待数几个小时。很多时候，当信号真正形成时，又很容易拒绝承认它。举例说明，如果市场已经趋势性下跌了40根K线，反弹至均线上方，然后再次下跌至一个更低的低点，但这时出现了一个多头强势反转K线，交易者很难相信接下来价格会反弹持续20根K线，但实际上市场会这样发展。如果你没办法下多单，那么将你的交易头寸减少到一个你不太在乎的规模，然后下多单。作为一个交易者，如果你要赚钱，那么你必须交易。如果你认为这笔交易很可能会成功，那么为了简化计算，你把它的胜率当作60%来考虑，尽管实际上可能会达到80%。此时，只要你的风险和收益是对等的，那么就可以下单。如果你不是很确定这笔交易是否会成功，那么可以把胜率计算为50%，但这时你必须要当收益是风险的两倍时才考虑下单。","pid":"p1366"},{"t":"para","text":"如果交易者回顾过去一年的所有交易，他可能发现某个交易模式对自己的盈利贡献很大。那么，为什么不简单地只做那一种交易模式呢？为什么不能耐心地等待这类交易形态的出现？那可能是因为这样的话你一周只能做一次交易，如果能把握各种你能找到的不同的交易模式，那么你可以赚更多的钱。没有哪种交易模式是最好的，当条件恰当时，他们都可能是最好的。只要信号出现时，交易者能有一个正的交易方程，交易者就可以入场，而且要比等待一周只出现一次的完美交易机会赚得更多。你是通过交易赚钱，而不是通过等待赚钱。尽管最佳交易是那些胜率超过60%的波段交易，但你完全可以自由地管理你的交易，通过日内刮头皮、波段交易或者同时进行两种交易而赚钱。","pid":"p1367"},{"t":"para","text":"一旦交易者认为当前趋势是总是在场策略下的多头状态，那么最佳交易就是在市场行情出现回调时买入：特别是回调至均线附近而且信号K线是多头K线时。","pid":"p1368"},{"t":"img","src":"assets/img/p4c4_001.webp","ctx":[{"t":"如果交易者回顾过去一年的所有交易，他可能发现某个交易模式对自己的盈利贡献很大。那么，为什么不简单地只做那一种交易模式呢？为什么不能耐心地等待这类交易形态的出现？那可能是因为这样的话你一周只能做一次交易，如果能把握各种你能找到的不同的交易模式，那么你可以赚更多的钱。没有哪种交易模式是最好的，当条件恰当时，他们都可能是最好的。只要信号出现时，交易者能有一个正的交易方程，交易者就可以入场，而且要比等待一周只出现一次的完美交易机会赚得更多。你是通过交易赚钱，而不是通过等待赚钱。尽管最佳交易是那些胜率超过60%的波段交易，但你完全可以自由地管理你的交易，通过日内刮头皮、波段交易或者同时进行两种交易而赚钱。","p":"p1367"},{"t":"一旦交易者认为当前趋势是总是在场策略下的多头状态，那么最佳交易就是在市场行情出现回调时买入：特别是回调至均线附近而且信号K线是多头K线时。","p":"p1368"},{"t":"如图24.1所示，前二日以一波反弹结束，收盘时，市场处于总是在场策略的多头行情，且当天开盘时前两根K线足以让市场参与者认为当前仍然处于总是再次的多头行情。一路上涨到K线6都可以显示买盘的强大。K线7是一个双K线反转的买入信号K线，它是在K线6之后出现的高点2，而且与K线5一起形成双重底部的多头旗形，而且K线7比K线5高出了三个最小跳动价位，这代表了多头买入的急迫性。他们非常急于做多，担心市场不会触及前一个低点，所以在低点上方几个跳动价位处就开始买入。同时，K线7也是对K线3高点的一个测试（虽然K线7的低点比K线3的高点低了一个跳动）。从K线7开始出现了四根连续上涨的K线，基本上可以说服市场参与者","p":"p1369"},{"t":"一当前仍然是总是在场策略下的多头趋势，因此，他们打算在市场出现回调时买入，特别是向均线靠近的两浪模式的回调，而且信号K线是多头趋势K线，例如在K线7、12、20、25和31。K线31是一个更大的高点2入场点，因为它处于K线23开始的回调的第二浪的底部。市场在K线25结束第一浪的回调，然后从K线24开始进入一段窄幅震荡区间。这时，很多交易者要么已经根据多头信号入场。要么就是空仓等待入场时机。但此时，市场已经进入窄幅震荡。向上突破的概率降至55%甚至更低，尽管此前多头趋势较强。","p":"p1370"},{"t":"对某个信号的解释常常有很多种方式，不同的交易者会从不同的角度去观察它。举例说明，K线12买入信号是一个三角形突破买进信号，而K线9和11是头两次下推浪。它也是K线11双K线反转高点1（K线11是双K线中的第一根K线）之后的一个突破回调，同时它与K线9形成一个双重底。有些交易者把它看作是均线处的一个高点2。K线11的双K线反转是高点1。K线12与之前的趋势K线形成一个小型的双重底部形态。大部分可交易的底部来自某种形式的微型双重底部（或者简单的双重底部，比如K线7的双K线反转，K线7和K线5形成的双重底部），同样地，大部分可交易的顶部都来自某种形式的微型双重顶部，比如K线6与两根K线之后的空头K线，K线10最终旗形与K线8，K线16与K线14，以及K线23与K线22构成的双重顶（和最终旗形）。在类似这样的强多头趋势中，大部分交易者应该忽略这些逆势刮头皮的信号，只准备买入。","p":"p1371"},{"t":"我们注意到，均线下方的唯一的一根K线是当天的第一根K线，出现在K线5多头高潮后，只有两根K线收盘价是位于均线下方，且下一根K线便迅速向上反转。这是一种力量的体现。在当日收盘时，很容易看到这是一个多头趋势日（一轮开盘多头趋势，一轮多头高潮和趋势通道，以及一个趋势延续的区间震荡形态）。在日内，这种趋势并不明显，因为趋势交易日一般都好像在为趋势反转做准备一样。然而，每次的回调都最终只是演变成另一个牛市旗形而已。这个市场情形下，交易者只需要持续关注所有展示市场买方的力量的迹象，只要这些迹象存在，就像这一天一样，那么交易者就应该在市场回调时买入，因为这才是最佳交易。这时，胜率超过60%，盈利至少是风险的一倍。如果交易者做一些波段交易，那么盈利可能会是风险的几倍。","p":"p1372"},{"t":"当市场价格在日内反转K线5上方时，市场处于始终在场的做多状态。如果交易者在K线5上方买入，那么他的初始止损位是K线5的最低点下方，这意味着他的风险是14个跳动价位。一旦市场超越强劲的K线7的双K线反转，他就可以把自己的止损位上移至K线7的低点下方，这个离他的入场价位只有11个跳动价位了。此时，他的风险只有11个跳动价位了。由于他相信目前市场处于总是在场的多头状态，所以市场出现等距运动的概率至少是60%。当胜率是60%时，产生正交易者方程式的条件是，最低的利润必须要比风险的11个点大。也就是说，只要他在K线5的信号K线高点上方12个跳动处获利了结，他的策略就是盈利的，而这就意味着反弹最少必须达到K线5上方的13个跳动处。在上图中，这发生在K线10期间（它达到K线5上方15个跳动）。这种获利了结是K线10拥有空头实体的部分原因。不过，也有一些交易者会将盈利的头寸转化成波段交易头寸，来获得更大的利润。","p":"p1373"},{"t":"当市场清晰地处于总是在场策略的某个方向时，如果我们使用带止损的回调入场策略。那么国债期货市场是一个不错的标的选择。","p":"p1374"}]},{"t":"para","text":"如图24.1所示，前二日以一波反弹结束，收盘时，市场处于总是在场策略的多头行情，且当天开盘时前两根K线足以让市场参与者认为当前仍然处于总是再次的多头行情。一路上涨到K线6都可以显示买盘的强大。K线7是一个双K线反转的买入信号K线，它是在K线6之后出现的高点2，而且与K线5一起形成双重底部的多头旗形，而且K线7比K线5高出了三个最小跳动价位，这代表了多头买入的急迫性。他们非常急于做多，担心市场不会触及前一个低点，所以在低点上方几个跳动价位处就开始买入。同时，K线7也是对K线3高点的一个测试（虽然K线7的低点比K线3的高点低了一个跳动）。从K线7开始出现了四根连续上涨的K线，基本上可以说服市场参与者","pid":"p1369"},{"t":"para","text":"一当前仍然是总是在场策略下的多头趋势，因此，他们打算在市场出现回调时买入，特别是向均线靠近的两浪模式的回调，而且信号K线是多头趋势K线，例如在K线7、12、20、25和31。K线31是一个更大的高点2入场点，因为它处于K线23开始的回调的第二浪的底部。市场在K线25结束第一浪的回调，然后从K线24开始进入一段窄幅震荡区间。这时，很多交易者要么已经根据多头信号入场。要么就是空仓等待入场时机。但此时，市场已经进入窄幅震荡。向上突破的概率降至55%甚至更低，尽管此前多头趋势较强。","pid":"p1370"},{"t":"para","text":"对某个信号的解释常常有很多种方式，不同的交易者会从不同的角度去观察它。举例说明，K线12买入信号是一个三角形突破买进信号，而K线9和11是头两次下推浪。它也是K线11双K线反转高点1（K线11是双K线中的第一根K线）之后的一个突破回调，同时它与K线9形成一个双重底。有些交易者把它看作是均线处的一个高点2。K线11的双K线反转是高点1。K线12与之前的趋势K线形成一个小型的双重底部形态。大部分可交易的底部来自某种形式的微型双重底部（或者简单的双重底部，比如K线7的双K线反转，K线7和K线5形成的双重底部），同样地，大部分可交易的顶部都来自某种形式的微型双重顶部，比如K线6与两根K线之后的空头K线，K线10最终旗形与K线8，K线16与K线14，以及K线23与K线22构成的双重顶（和最终旗形）。在类似这样的强多头趋势中，大部分交易者应该忽略这些逆势刮头皮的信号，只准备买入。","pid":"p1371"},{"t":"para","text":"我们注意到，均线下方的唯一的一根K线是当天的第一根K线，出现在K线5多头高潮后，只有两根K线收盘价是位于均线下方，且下一根K线便迅速向上反转。这是一种力量的体现。在当日收盘时，很容易看到这是一个多头趋势日（一轮开盘多头趋势，一轮多头高潮和趋势通道，以及一个趋势延续的区间震荡形态）。在日内，这种趋势并不明显，因为趋势交易日一般都好像在为趋势反转做准备一样。然而，每次的回调都最终只是演变成另一个牛市旗形而已。这个市场情形下，交易者只需要持续关注所有展示市场买方的力量的迹象，只要这些迹象存在，就像这一天一样，那么交易者就应该在市场回调时买入，因为这才是最佳交易。这时，胜率超过60%，盈利至少是风险的一倍。如果交易者做一些波段交易，那么盈利可能会是风险的几倍。","pid":"p1372"},{"t":"para","text":"当市场价格在日内反转K线5上方时，市场处于始终在场的做多状态。如果交易者在K线5上方买入，那么他的初始止损位是K线5的最低点下方，这意味着他的风险是14个跳动价位。一旦市场超越强劲的K线7的双K线反转，他就可以把自己的止损位上移至K线7的低点下方，这个离他的入场价位只有11个跳动价位了。此时，他的风险只有11个跳动价位了。由于他相信目前市场处于总是在场的多头状态，所以市场出现等距运动的概率至少是60%。当胜率是60%时，产生正交易者方程式的条件是，最低的利润必须要比风险的11个点大。也就是说，只要他在K线5的信号K线高点上方12个跳动处获利了结，他的策略就是盈利的，而这就意味着反弹最少必须达到K线5上方的13个跳动处。在上图中，这发生在K线10期间（它达到K线5上方15个跳动）。这种获利了结是K线10拥有空头实体的部分原因。不过，也有一些交易者会将盈利的头寸转化成波段交易头寸，来获得更大的利润。","pid":"p1373"},{"t":"para","text":"当市场清晰地处于总是在场策略的某个方向时，如果我们使用带止损的回调入场策略。那么国债期货市场是一个不错的标的选择。","pid":"p1374"},{"t":"img","src":"assets/img/p4c4_002.webp","ctx":[{"t":"当市场价格在日内反转K线5上方时，市场处于始终在场的做多状态。如果交易者在K线5上方买入，那么他的初始止损位是K线5的最低点下方，这意味着他的风险是14个跳动价位。一旦市场超越强劲的K线7的双K线反转，他就可以把自己的止损位上移至K线7的低点下方，这个离他的入场价位只有11个跳动价位了。此时，他的风险只有11个跳动价位了。由于他相信目前市场处于总是在场的多头状态，所以市场出现等距运动的概率至少是60%。当胜率是60%时，产生正交易者方程式的条件是，最低的利润必须要比风险的11个点大。也就是说，只要他在K线5的信号K线高点上方12个跳动处获利了结，他的策略就是盈利的，而这就意味着反弹最少必须达到K线5上方的13个跳动处。在上图中，这发生在K线10期间（它达到K线5上方15个跳动）。这种获利了结是K线10拥有空头实体的部分原因。不过，也有一些交易者会将盈利的头寸转化成波段交易头寸，来获得更大的利润。","p":"p1373"},{"t":"当市场清晰地处于总是在场策略的某个方向时，如果我们使用带止损的回调入场策略。那么国债期货市场是一个不错的标的选择。","p":"p1374"},{"t":"如图24.2所示，很多交易者在出现K线1所示的两根K线的反转后，认为市场已经处在了总是在场策略的多头趋势中，也有交易者认为市场直到K线4再次下探低点失败后，尤其是在K线2开始的连续四根多头K线显示了市场多头力量时。当价格从K线4到K线5出现连续多头趋势突破时，市场就很明显处于多头趋势中了。直到这个时候，交易者们过去的买入行为才被证实是回调买入。K线6是一个高点1的买入信号K线，一般交易者很少在高点1买入，因为一般回调会持续两个波段，到高点2或者形成一个楔形牛市旗形。如果交易者不冒险愿意在高点1回调买入，又不想错过这一波向上的趋势，那么可以考虑在前一个波段高点上方设置限价买入单。这里具体来说，当高点1在K线6形成时，谨慎的交易者可以考虑在K线5上方一个点设置买入限价单，这样当趋势经历了K线6的回调后没有延续复杂的调整。而是当趋势延续时，交易者不会错过上涨趋势。","p":"p1375"},{"t":"K线9和K线11是高点2的买入信号K线，K线9和K线8形成了一个微型的双重底，而这个双重底也是K线8的高点1或者说高点2（很多交易者把K线7之前的那个阴线回调看成高点1）的再度回调。三次回调形成一个三角形的突破形态（K线7之前的那根K线和K线8、9一起形成三个下推浪）。K线12是一根带有很小一段上影线但光脚的多头趋势K线，它显示了多头趋势的强劲。K线13形成了突破后的回调买入入场信号。","p":"p1376"},{"t":"K线14是在一波较长时间震荡以及小型震荡区间（K线10到K线13）后出现的一根多头趋势长阳K线，这段小型的震荡区间可能会成为最终旗形。在最终旗形形态之后，交易者们一般期待市场会出现一波持续10根K线以上、两浪结构的朝着移动平均线方向的回调。K线15之前的一波回调形成了多头楔形旗形，但因为这看起来像一个微型通道，交易者们没有看到两浪回调结构，所以不敢买入。一般来说，牛市微型通道的向上突破都会紧随着一波回调。所以多头都在等待市场在突破后的回踩至均线附近时买入，或者观察K线16下方的价格变化是否能成为回调的第二浪。后者可能性比较小一些，因为市场多头趋势比较强，市场一直处于移动平均线的上方，处于总是在场策略的多头状态。K线18处的Ⅱ型形态是一个很好的多头入场信号，因为它是一个微型通道的突破后回调结构，同时又处于移动平均线附近，且有一个多头信号K线与其前面倒数第二根K线形成一个双重底部，而且它是一个20跳空缺口买入信号。","p":"p1377"},{"t":"有经验的交易者把K线14看成第二波，或者第三波、第四波买人高潮，认为之后市场会进入震荡状态。对于大部分交易者来说，这里做空并不是最佳交易，但有经验的交易者会在K线14收盘处卖空，或者在其之后的空头K线收盘处或其下方，或者在随后的十字星K线的下方做空，并预期市场会出现一波两主浪结构的回调，向均线附近靠近。这些交易者中有些可能用很小的头寸做空，然后等待市场可能会冲到更高位置时再加仓，又或者他们做好了自己被止损踢出局的准备，只是先小仓位试试，那么在二次信号的时候再用正常的规模进行交易。一旦K线14收盘时，他们便会在收盘价的位置设置限价单做空，但一般这种单子很难成交，因为随后的空头K线的最高价都没有触及K线14的收盘价那么高的位置，显示出了卖空者的急迫性，这给了短线做空刮头皮交易者更多的信心，于是他们在这跟空头内含K线的收盘价或者其下方做空，并预期价格至少会回落到均线附近。果然，下一K线的最高价也没能突破K线14的收盘价，它的上影线与K线14形成一个小型的双重顶形态。","p":"p1378"},{"t":"为什么很多交易者喜欢在回调的时候买入，主要是因为此时风险较低：不需要面临价格回调至上涨趋势底部的风险，而只需要面对价格回调至回调浪的底部的风险。回调买入策略可能会把利润空间压低，但风险更小一些。举个例子来说，交易者可以在K线10的收盘价附近买入，但这样做的话他的理论止损价应该是在这一波上涨的起点K线8的下方。如果他能够等待市场回调时买入，例如在K线11的上方买入，那么他的止损价就应该是K线11的下方，这样风险小很多。","p":"p1379"},{"t":"市场总是在尽力维持多空双方博奔的平衡，所以任何一方的胜率都大约是50%。你的对手方很可能是一个很大型的机构，而这样强大的对手是不会给你60%胜出的机会的。不过，不是所有时候他们都能够很好地控制他们的胜率，所以还是有些时候，你能够拥有60%以上的胜率，以获得一个很好的交易者方程式。","p":"p1380"}]},{"t":"para","text":"如图24.2所示，很多交易者在出现K线1所示的两根K线的反转后，认为市场已经处在了总是在场策略的多头趋势中，也有交易者认为市场直到K线4再次下探低点失败后，尤其是在K线2开始的连续四根多头K线显示了市场多头力量时。当价格从K线4到K线5出现连续多头趋势突破时，市场就很明显处于多头趋势中了。直到这个时候，交易者们过去的买入行为才被证实是回调买入。K线6是一个高点1的买入信号K线，一般交易者很少在高点1买入，因为一般回调会持续两个波段，到高点2或者形成一个楔形牛市旗形。如果交易者不冒险愿意在高点1回调买入，又不想错过这一波向上的趋势，那么可以考虑在前一个波段高点上方设置限价买入单。这里具体来说，当高点1在K线6形成时，谨慎的交易者可以考虑在K线5上方一个点设置买入限价单，这样当趋势经历了K线6的回调后没有延续复杂的调整。而是当趋势延续时，交易者不会错过上涨趋势。","pid":"p1375"},{"t":"para","text":"K线9和K线11是高点2的买入信号K线，K线9和K线8形成了一个微型的双重底，而这个双重底也是K线8的高点1或者说高点2（很多交易者把K线7之前的那个阴线回调看成高点1）的再度回调。三次回调形成一个三角形的突破形态（K线7之前的那根K线和K线8、9一起形成三个下推浪）。K线12是一根带有很小一段上影线但光脚的多头趋势K线，它显示了多头趋势的强劲。K线13形成了突破后的回调买入入场信号。","pid":"p1376"},{"t":"para","text":"K线14是在一波较长时间震荡以及小型震荡区间（K线10到K线13）后出现的一根多头趋势长阳K线，这段小型的震荡区间可能会成为最终旗形。在最终旗形形态之后，交易者们一般期待市场会出现一波持续10根K线以上、两浪结构的朝着移动平均线方向的回调。K线15之前的一波回调形成了多头楔形旗形，但因为这看起来像一个微型通道，交易者们没有看到两浪回调结构，所以不敢买入。一般来说，牛市微型通道的向上突破都会紧随着一波回调。所以多头都在等待市场在突破后的回踩至均线附近时买入，或者观察K线16下方的价格变化是否能成为回调的第二浪。后者可能性比较小一些，因为市场多头趋势比较强，市场一直处于移动平均线的上方，处于总是在场策略的多头状态。K线18处的Ⅱ型形态是一个很好的多头入场信号，因为它是一个微型通道的突破后回调结构，同时又处于移动平均线附近，且有一个多头信号K线与其前面倒数第二根K线形成一个双重底部，而且它是一个20跳空缺口买入信号。","pid":"p1377"},{"t":"para","text":"有经验的交易者把K线14看成第二波，或者第三波、第四波买人高潮，认为之后市场会进入震荡状态。对于大部分交易者来说，这里做空并不是最佳交易，但有经验的交易者会在K线14收盘处卖空，或者在其之后的空头K线收盘处或其下方，或者在随后的十字星K线的下方做空，并预期市场会出现一波两主浪结构的回调，向均线附近靠近。这些交易者中有些可能用很小的头寸做空，然后等待市场可能会冲到更高位置时再加仓，又或者他们做好了自己被止损踢出局的准备，只是先小仓位试试，那么在二次信号的时候再用正常的规模进行交易。一旦K线14收盘时，他们便会在收盘价的位置设置限价单做空，但一般这种单子很难成交，因为随后的空头K线的最高价都没有触及K线14的收盘价那么高的位置，显示出了卖空者的急迫性，这给了短线做空刮头皮交易者更多的信心，于是他们在这跟空头内含K线的收盘价或者其下方做空，并预期价格至少会回落到均线附近。果然，下一K线的最高价也没能突破K线14的收盘价，它的上影线与K线14形成一个小型的双重顶形态。","pid":"p1378"},{"t":"para","text":"为什么很多交易者喜欢在回调的时候买入，主要是因为此时风险较低：不需要面临价格回调至上涨趋势底部的风险，而只需要面对价格回调至回调浪的底部的风险。回调买入策略可能会把利润空间压低，但风险更小一些。举个例子来说，交易者可以在K线10的收盘价附近买入，但这样做的话他的理论止损价应该是在这一波上涨的起点K线8的下方。如果他能够等待市场回调时买入，例如在K线11的上方买入，那么他的止损价就应该是K线11的下方，这样风险小很多。","pid":"p1379"},{"t":"para","text":"市场总是在尽力维持多空双方博奔的平衡，所以任何一方的胜率都大约是50%。你的对手方很可能是一个很大型的机构，而这样强大的对手是不会给你60%胜出的机会的。不过，不是所有时候他们都能够很好地控制他们的胜率，所以还是有些时候，你能够拥有60%以上的胜率，以获得一个很好的交易者方程式。","pid":"p1380"},{"t":"img","src":"assets/img/p4c4_003.webp","ctx":[{"t":"为什么很多交易者喜欢在回调的时候买入，主要是因为此时风险较低：不需要面临价格回调至上涨趋势底部的风险，而只需要面对价格回调至回调浪的底部的风险。回调买入策略可能会把利润空间压低，但风险更小一些。举个例子来说，交易者可以在K线10的收盘价附近买入，但这样做的话他的理论止损价应该是在这一波上涨的起点K线8的下方。如果他能够等待市场回调时买入，例如在K线11的上方买入，那么他的止损价就应该是K线11的下方，这样风险小很多。","p":"p1379"},{"t":"市场总是在尽力维持多空双方博奔的平衡，所以任何一方的胜率都大约是50%。你的对手方很可能是一个很大型的机构，而这样强大的对手是不会给你60%胜出的机会的。不过，不是所有时候他们都能够很好地控制他们的胜率，所以还是有些时候，你能够拥有60%以上的胜率，以获得一个很好的交易者方程式。","p":"p1380"},{"t":"如图24.3所示，在欧元/美元外汇图表的5分钟K线图上，一旦市场明显处于总是在场策略下的多头或者空头趋势时，交易者们便准备在回调时入场。当天开始的两根K线是大型的空头趋势K线，位于均线下方，使得市场成为总是在场的空头方向。K线4是一个楔形形态（与K线1和K线3构成）的更低的高点，是空头趋势中军衔缺口K线做空信号的二次入场信号，在这一点处，空头趋势已经演变成了震荡交易区间（K线3是空头趋势中均线上方的第一缺口K线）。K线5是一根大型的空头趋势K线，它是一根外包下跌K线，并试图形成双重底而失败，所以大部分交易者把市场的状态看成总是在场策略的空头。在K线7低点1入场信号下方和K线9双重顶空头旗形（与K线7形成双重顶）下方做空，都是合理的交易。K线9也是市场在向下突破K线7空头旗形后的一个突破回调做空信号。K线10双K线反转处的向上反转。是一个大约有60%的可能性赚到波段利润的信号案例，所以对于所有交易者（包括初学者）来说，都是一个很不错的交易信号。K线4是空头趋势中的一根缺口K线，它常常引出对空头低点（此时是K线2）的测试，然后形成一波反弹，最少包含10根K线和两浪结构。截至K线6的空头下跌高潮太强，所以交易者们不敢买入。K线8是一个合理的买入位置，因为它是向下突破K线2后的第二次反转尝试，一个扩张三角形底部（当天第三根K线是第一次下推浪，K线2是第二次），K线7空头旗型之后的一个最终旗型反转，还是一条多头反转K线。扩张三角形底部总是总要趋势反转的信号。然而，由于截至K线4的上涨浪和截至K线6的下跌浪都非常大，所以大部分交易者不会把这个叫作重要趋势反转，而是用其他名称（不过在15分钟图上它几乎肯定是一个外观很棒的重要趋势反转）。K线10是一个已经很强的形态的二次入场信号。交易者们在K线10的高点上方买入，K线10是双K线反转的第二根K线。他们初始的保护性止损在它的低点下方。一旦市场到达两倍风险处，他们就全部或者部分获利了结。剩下的部分头寸跟着波段走势自由奔跑。把跟踪止损调整到最近的更高低点的下方。有些人会在K线19的双重顶（与K线14构成的）和楔形（K线12、14、19，以及K线14、16和19）的下方离场，另外有一些人会继续持有，一直将止损设置在K线17的下方。","p":"p1381"},{"t":"截至K线12，市场显然总是处于在场策略下的多头状态，交易者们预期至少再出现一条向上的上涨浪，可能形成一波向上的可测量的运动，测量基准是从K线10到12的强多头上涨高潮的高度。多头可能会在K线13高点1或向上突破K线12时买入。","p":"p1382"},{"t":"K线15是另一个高点1，但这一点处多头高潮不是很强，因为它已经形成了一个高点1回调买入的信号，而且市场可能是在一段交易区间的顶部附近。K线17是一个更加安全的买入机会，因为它是均线处的高点2的回调买入信号，而且信号K线是一根强多头趋势K线（与前面一根K线构成双K线反转）。","p":"p1383"},{"t":"K线22处向均线回调是一条空头微型通道，所以对通道的第一次向上突破很可能形成突破后的回调，然后再大幅反弹。K线25是突破后回调买入的交易机会。","p":"p1384"},{"t":"K线25是一个双K线反转。它与K线23形成一个双重底部。有些交易者可能把它叫作微型双重底，因为它只包含了四五根K线。它也是K线24突破从K线19到K线23的空头微型通道后的一波回调，与K线17形成一个近似的双重底，是较大多头趋势中的第一均线缺口K线，也是一个买入信号。由于下降通道比较紧凑，所以等待K线25双K线上方的二次入场机会是一个更高胜率的策略。","p":"p1385"},{"t":"截至K线26的多头高潮由3根连续的强多头趋势K线构成，所以随后市场很可能上涨。任意多头的最坏情况保护性止损在上涨高潮底部K线25的下方，但是大部分交易者会提前离场，比如在低点K线26或者信号K线25的高点下方。市场在K线27上方发出了一个高点1做多信号，然后在K线28上方触发一个高点2做多信号。市场仍然是明确的总是在场策略的多头状态，所以交易者们不应急于在回调离场。K线29是一个楔形多头旗形买入信号（K线27、28、29是三次下推浪）；它也与K线27构成一个双重底，是向上突破K线28高点2多头旗形后的突破回调买入信号，也是一个失败的更低的高点（前一根K线是一个小型更低的高点和一个失败的高点2的买入信号）。","p":"p1386"}]},{"t":"para","text":"如图24.3所示，在欧元/美元外汇图表的5分钟K线图上，一旦市场明显处于总是在场策略下的多头或者空头趋势时，交易者们便准备在回调时入场。当天开始的两根K线是大型的空头趋势K线，位于均线下方，使得市场成为总是在场的空头方向。K线4是一个楔形形态（与K线1和K线3构成）的更低的高点，是空头趋势中军衔缺口K线做空信号的二次入场信号，在这一点处，空头趋势已经演变成了震荡交易区间（K线3是空头趋势中均线上方的第一缺口K线）。K线5是一根大型的空头趋势K线，它是一根外包下跌K线，并试图形成双重底而失败，所以大部分交易者把市场的状态看成总是在场策略的空头。在K线7低点1入场信号下方和K线9双重顶空头旗形（与K线7形成双重顶）下方做空，都是合理的交易。K线9也是市场在向下突破K线7空头旗形后的一个突破回调做空信号。K线10双K线反转处的向上反转。是一个大约有60%的可能性赚到波段利润的信号案例，所以对于所有交易者（包括初学者）来说，都是一个很不错的交易信号。K线4是空头趋势中的一根缺口K线，它常常引出对空头低点（此时是K线2）的测试，然后形成一波反弹，最少包含10根K线和两浪结构。截至K线6的空头下跌高潮太强，所以交易者们不敢买入。K线8是一个合理的买入位置，因为它是向下突破K线2后的第二次反转尝试，一个扩张三角形底部（当天第三根K线是第一次下推浪，K线2是第二次），K线7空头旗型之后的一个最终旗型反转，还是一条多头反转K线。扩张三角形底部总是总要趋势反转的信号。然而，由于截至K线4的上涨浪和截至K线6的下跌浪都非常大，所以大部分交易者不会把这个叫作重要趋势反转，而是用其他名称（不过在15分钟图上它几乎肯定是一个外观很棒的重要趋势反转）。K线10是一个已经很强的形态的二次入场信号。交易者们在K线10的高点上方买入，K线10是双K线反转的第二根K线。他们初始的保护性止损在它的低点下方。一旦市场到达两倍风险处，他们就全部或者部分获利了结。剩下的部分头寸跟着波段走势自由奔跑。把跟踪止损调整到最近的更高低点的下方。有些人会在K线19的双重顶（与K线14构成的）和楔形（K线12、14、19，以及K线14、16和19）的下方离场，另外有一些人会继续持有，一直将止损设置在K线17的下方。","pid":"p1381"},{"t":"para","text":"截至K线12，市场显然总是处于在场策略下的多头状态，交易者们预期至少再出现一条向上的上涨浪，可能形成一波向上的可测量的运动，测量基准是从K线10到12的强多头上涨高潮的高度。多头可能会在K线13高点1或向上突破K线12时买入。","pid":"p1382"},{"t":"para","text":"K线15是另一个高点1，但这一点处多头高潮不是很强，因为它已经形成了一个高点1回调买入的信号，而且市场可能是在一段交易区间的顶部附近。K线17是一个更加安全的买入机会，因为它是均线处的高点2的回调买入信号，而且信号K线是一根强多头趋势K线（与前面一根K线构成双K线反转）。","pid":"p1383"},{"t":"para","text":"K线22处向均线回调是一条空头微型通道，所以对通道的第一次向上突破很可能形成突破后的回调，然后再大幅反弹。K线25是突破后回调买入的交易机会。","pid":"p1384"},{"t":"para","text":"K线25是一个双K线反转。它与K线23形成一个双重底部。有些交易者可能把它叫作微型双重底，因为它只包含了四五根K线。它也是K线24突破从K线19到K线23的空头微型通道后的一波回调，与K线17形成一个近似的双重底，是较大多头趋势中的第一均线缺口K线，也是一个买入信号。由于下降通道比较紧凑，所以等待K线25双K线上方的二次入场机会是一个更高胜率的策略。","pid":"p1385"},{"t":"para","text":"截至K线26的多头高潮由3根连续的强多头趋势K线构成，所以随后市场很可能上涨。任意多头的最坏情况保护性止损在上涨高潮底部K线25的下方，但是大部分交易者会提前离场，比如在低点K线26或者信号K线25的高点下方。市场在K线27上方发出了一个高点1做多信号，然后在K线28上方触发一个高点2做多信号。市场仍然是明确的总是在场策略的多头状态，所以交易者们不应急于在回调离场。K线29是一个楔形多头旗形买入信号（K线27、28、29是三次下推浪）；它也与K线27构成一个双重底，是向上突破K线28高点2多头旗形后的突破回调买入信号，也是一个失败的更低的高点（前一根K线是一个小型更低的高点和一个失败的高点2的买入信号）。","pid":"p1386"},{"t":"img","src":"assets/img/p4c4_004.webp","ctx":[{"t":"K线25是一个双K线反转。它与K线23形成一个双重底部。有些交易者可能把它叫作微型双重底，因为它只包含了四五根K线。它也是K线24突破从K线19到K线23的空头微型通道后的一波回调，与K线17形成一个近似的双重底，是较大多头趋势中的第一均线缺口K线，也是一个买入信号。由于下降通道比较紧凑，所以等待K线25双K线上方的二次入场机会是一个更高胜率的策略。","p":"p1385"},{"t":"截至K线26的多头高潮由3根连续的强多头趋势K线构成，所以随后市场很可能上涨。任意多头的最坏情况保护性止损在上涨高潮底部K线25的下方，但是大部分交易者会提前离场，比如在低点K线26或者信号K线25的高点下方。市场在K线27上方发出了一个高点1做多信号，然后在K线28上方触发一个高点2做多信号。市场仍然是明确的总是在场策略的多头状态，所以交易者们不应急于在回调离场。K线29是一个楔形多头旗形买入信号（K线27、28、29是三次下推浪）；它也与K线27构成一个双重底，是向上突破K线28高点2多头旗形后的突破回调买入信号，也是一个失败的更低的高点（前一根K线是一个小型更低的高点和一个失败的高点2的买入信号）。","p":"p1386"},{"t":"如图24.4所示，IBM5分钟K线图上的最佳交易包括：K线2的开盘反转和缺口跳空上涨高潮，以及处于通道底部，K线4均线处的双重底，K线6强空头高潮之后均线处的低点2，K线7的低点2和微型通道失败突破，K线9小三角形或者横向楔形空头旗形，以及K线1均线处的低点2。","p":"p1387"},{"t":"强空头趋势中有几次均线回调。向下突破K线2之后，交易者们可能假定今天是一个趋势型的交易区间日，甚至可能是一个较强的开盘趋势日。截至K线6，交易者们正在向均线进行两浪结构的运动和他们所看到的每个低点2处做空。","p":"p1388"},{"t":"K线6是均线处的一个低点2做空信号（K线5是一条小型的空头K线，是第一条上涨浪的终点），它与之前一根K线之前的高点形成一个微型的双重顶部，这是它前面的内含K线之后的一个单K线最终旗形反转。","p":"p1389"},{"t":"K线7是测试K线6下方的盈亏平衡止损后的向下反转。它也是向下突破结束于K线6的空头旗形后的一次回调。","p":"p1390"},{"t":"K线9是一个低点2的做空信号，K线11是均线处的一个低点2做空信号，也与K线10构成一个微型双重顶。两个信号看起来都不好，但是在一个强空头趋势日内，你必须相信均线处的低点2做空信号具有很高的胜率。","p":"p1391"},{"t":"K线5之前的双K线多头高潮很强，大部分初学者把它看作是一个迅猛多头反转的开始。截至K线6的上涨运动包含7根K线，只有一根K线拥有空头实体。这时，我们很容易把视线集中在这种强势上涨的势头上，而忽略了市场在此之前的走势。这波迅猛的反弹是20多根K线以来的第一次向均线的反弹，经验丰富的交易者把它当作一个卖出信号，初学者只看到了反弹的强势，打算在随后的更高的低点买入，预期走势会出现反转或至少出现第二波上涨浪。他们认为从K线6开始的三根空头趋势K线只是对当日低点的探底测试。他们买入，期望接下来还有一波上涨浪。经验丰富的交易者们把这个看作是对强空头趋势的一次反转尝试，因此很可能只是一个空头旗形。他们在K线7之前的两波横向调整处做空，正确地预期了空头趋势将会恢复。","p":"p1392"}]},{"t":"para","text":"如图24.4所示，IBM5分钟K线图上的最佳交易包括：K线2的开盘反转和缺口跳空上涨高潮，以及处于通道底部，K线4均线处的双重底，K线6强空头高潮之后均线处的低点2，K线7的低点2和微型通道失败突破，K线9小三角形或者横向楔形空头旗形，以及K线1均线处的低点2。","pid":"p1387"},{"t":"para","text":"强空头趋势中有几次均线回调。向下突破K线2之后，交易者们可能假定今天是一个趋势型的交易区间日，甚至可能是一个较强的开盘趋势日。截至K线6，交易者们正在向均线进行两浪结构的运动和他们所看到的每个低点2处做空。","pid":"p1388"},{"t":"para","text":"K线6是均线处的一个低点2做空信号（K线5是一条小型的空头K线，是第一条上涨浪的终点），它与之前一根K线之前的高点形成一个微型的双重顶部，这是它前面的内含K线之后的一个单K线最终旗形反转。","pid":"p1389"},{"t":"para","text":"K线7是测试K线6下方的盈亏平衡止损后的向下反转。它也是向下突破结束于K线6的空头旗形后的一次回调。","pid":"p1390"},{"t":"para","text":"K线9是一个低点2的做空信号，K线11是均线处的一个低点2做空信号，也与K线10构成一个微型双重顶。两个信号看起来都不好，但是在一个强空头趋势日内，你必须相信均线处的低点2做空信号具有很高的胜率。","pid":"p1391"},{"t":"para","text":"K线5之前的双K线多头高潮很强，大部分初学者把它看作是一个迅猛多头反转的开始。截至K线6的上涨运动包含7根K线，只有一根K线拥有空头实体。这时，我们很容易把视线集中在这种强势上涨的势头上，而忽略了市场在此之前的走势。这波迅猛的反弹是20多根K线以来的第一次向均线的反弹，经验丰富的交易者把它当作一个卖出信号，初学者只看到了反弹的强势，打算在随后的更高的低点买入，预期走势会出现反转或至少出现第二波上涨浪。他们认为从K线6开始的三根空头趋势K线只是对当日低点的探底测试。他们买入，期望接下来还有一波上涨浪。经验丰富的交易者们把这个看作是对强空头趋势的一次反转尝试，因此很可能只是一个空头旗形。他们在K线7之前的两波横向调整处做空，正确地预期了空头趋势将会恢复。","pid":"p1392"},{"t":"img","src":"assets/img/p4c4_005.webp","ctx":[{"t":"K线9是一个低点2的做空信号，K线11是均线处的一个低点2做空信号，也与K线10构成一个微型双重顶。两个信号看起来都不好，但是在一个强空头趋势日内，你必须相信均线处的低点2做空信号具有很高的胜率。","p":"p1391"},{"t":"K线5之前的双K线多头高潮很强，大部分初学者把它看作是一个迅猛多头反转的开始。截至K线6的上涨运动包含7根K线，只有一根K线拥有空头实体。这时，我们很容易把视线集中在这种强势上涨的势头上，而忽略了市场在此之前的走势。这波迅猛的反弹是20多根K线以来的第一次向均线的反弹，经验丰富的交易者把它当作一个卖出信号，初学者只看到了反弹的强势，打算在随后的更高的低点买入，预期走势会出现反转或至少出现第二波上涨浪。他们认为从K线6开始的三根空头趋势K线只是对当日低点的探底测试。他们买入，期望接下来还有一波上涨浪。经验丰富的交易者们把这个看作是对强空头趋势的一次反转尝试，因此很可能只是一个空头旗形。他们在K线7之前的两波横向调整处做空，正确地预期了空头趋势将会恢复。","p":"p1392"},{"t":"如图24.5所示。今天美国石油基金（UnitedStatesOilFundLP简称USO）的日线图上的最佳交易机会包括：K线1楔形多头旗形：K线3对均线的高点1测试：K线5大型高点2中的二次入场（K线3是第一次下推浪）：K线6扩张三角形和更高高点重要趋势反转：K线8双重底（与K线5构成）和微型通道突破回调（从K线7开始的向上反弹突破微型通道）；K线10的失败的微型通道突破：K线12的二次入场均线缺口K线：双重底（与K线10构成）、高点2、对K线6的突破测试；K线13双重底和高点2；K线15均线处的高点2和对K线11的突破测试。","p":"p1393"},{"t":"市场显然处于一轮多头趋势中，所以最佳交易很可能是任意高点2，特别是均线附近的高点2，比如在K线1、5和12。K线1是均线处的高点2，有些交易者把它看作一个小型形多头旗形。K线5是一个较大的高点2买入信号中的第二波下跌浪，K线3是第一波下跌浪。","p":"p1394"},{"t":"激进的交易者们把K线1前后向均线的小幅横向运动看作是一个平静的多头旗形，而不是一个反转形态。因此。他们会设定限价单在前一根K线低点或者下方买入，而不是等待市场恢复多头趋势。","p":"p1395"},{"t":"K线6是一个更高高点重要趋势反转和扩张三角形顶。是一个合理的做空信号。然而，大部分重要的趋势反转不会引出反向趋势。相反地，他们更有可能演变成交易区间，但是通常拥有足够的空头趋势，可以做小型的波段交易（需满足回报至少是风险的两倍的条件）。","p":"p1396"},{"t":"K线8和13是均线下方的两浪回调（缺口K线）。","p":"p1397"},{"t":"K线8是对交易区间低点K线5的第二次测试：K线13是对交易区间高点突破的第二次测试：两次测试都形成双重底多头旗形。","p":"p1398"},{"t":"K线10形成一个突破回调后的二次做多入场（K线2、3、4、5、6、8和9之后形成一个失败的扩张三角形顶）。","p":"p1399"},{"t":"注意，尽管这是一轮明确的多头趋势，但是K线6是一个不错的做空信号，因为截至K线5，有一个趋势线的突破。K线6是向新的高点的一波两浪结构的楔形反弹，是一个扩张三角形（K线2、3、4、5、和6）的顶部。","p":"p1400"},{"t":"K线15是对K线11的突破测试。","p":"p1401"},{"t":"在强多头趋势中，你不需要强的入场信号就可以买入。你可以在任意位置上以市价买入并赚钱，但信号允许你使用较为紧的止损。","p":"p1402"},{"t":"一旦交易的账面利润达到目标利润的一半。有些交易者就会把自己的保护性止损移动至盈亏平衡点。举例说明，如果交易者在K线8上方买进，预期交易区间向上突破，然后形成一波向上的测量运动，那么一旦市场达到K线9区域，他就可能把止损移动至盈亏平衡点。市场达到K线9区域时，已经超过了他目标的一半，而且有几个收盘在韦瑜交易区间顶部上方。如果他的保护性止损被击中，那么他绝不应该变得志志不安，因为那刚好是他应该做的，限制了他的亏损。那种情况至少在40%的交易中发生。","p":"p1403"}]},{"t":"para","text":"如图24.5所示。今天美国石油基金（UnitedStatesOilFundLP简称USO）的日线图上的最佳交易机会包括：K线1楔形多头旗形：K线3对均线的高点1测试：K线5大型高点2中的二次入场（K线3是第一次下推浪）：K线6扩张三角形和更高高点重要趋势反转：K线8双重底（与K线5构成）和微型通道突破回调（从K线7开始的向上反弹突破微型通道）；K线10的失败的微型通道突破：K线12的二次入场均线缺口K线：双重底（与K线10构成）、高点2、对K线6的突破测试；K线13双重底和高点2；K线15均线处的高点2和对K线11的突破测试。","pid":"p1393"},{"t":"para","text":"市场显然处于一轮多头趋势中，所以最佳交易很可能是任意高点2，特别是均线附近的高点2，比如在K线1、5和12。K线1是均线处的高点2，有些交易者把它看作一个小型形多头旗形。K线5是一个较大的高点2买入信号中的第二波下跌浪，K线3是第一波下跌浪。","pid":"p1394"},{"t":"para","text":"激进的交易者们把K线1前后向均线的小幅横向运动看作是一个平静的多头旗形，而不是一个反转形态。因此。他们会设定限价单在前一根K线低点或者下方买入，而不是等待市场恢复多头趋势。","pid":"p1395"},{"t":"para","text":"K线6是一个更高高点重要趋势反转和扩张三角形顶。是一个合理的做空信号。然而，大部分重要的趋势反转不会引出反向趋势。相反地，他们更有可能演变成交易区间，但是通常拥有足够的空头趋势，可以做小型的波段交易（需满足回报至少是风险的两倍的条件）。","pid":"p1396"},{"t":"para","text":"K线8和13是均线下方的两浪回调（缺口K线）。","pid":"p1397"},{"t":"para","text":"K线8是对交易区间低点K线5的第二次测试：K线13是对交易区间高点突破的第二次测试：两次测试都形成双重底多头旗形。","pid":"p1398"},{"t":"para","text":"K线10形成一个突破回调后的二次做多入场（K线2、3、4、5、6、8和9之后形成一个失败的扩张三角形顶）。","pid":"p1399"},{"t":"para","text":"注意，尽管这是一轮明确的多头趋势，但是K线6是一个不错的做空信号，因为截至K线5，有一个趋势线的突破。K线6是向新的高点的一波两浪结构的楔形反弹，是一个扩张三角形（K线2、3、4、5、和6）的顶部。","pid":"p1400"},{"t":"para","text":"K线15是对K线11的突破测试。","pid":"p1401"},{"t":"para","text":"在强多头趋势中，你不需要强的入场信号就可以买入。你可以在任意位置上以市价买入并赚钱，但信号允许你使用较为紧的止损。","pid":"p1402"},{"t":"para","text":"一旦交易的账面利润达到目标利润的一半。有些交易者就会把自己的保护性止损移动至盈亏平衡点。举例说明，如果交易者在K线8上方买进，预期交易区间向上突破，然后形
