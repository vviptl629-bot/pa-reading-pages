成一波向上的测量运动，那么一旦市场达到K线9区域，他就可能把止损移动至盈亏平衡点。市场达到K线9区域时，已经超过了他目标的一半，而且有几个收盘在韦瑜交易区间顶部上方。如果他的保护性止损被击中，那么他绝不应该变得志志不安，因为那刚好是他应该做的，限制了他的亏损。那种情况至少在40%的交易中发生。","pid":"p1403"},{"t":"img","src":"assets/img/p4c4_006.webp","ctx":[{"t":"在强多头趋势中，你不需要强的入场信号就可以买入。你可以在任意位置上以市价买入并赚钱，但信号允许你使用较为紧的止损。","p":"p1402"},{"t":"一旦交易的账面利润达到目标利润的一半。有些交易者就会把自己的保护性止损移动至盈亏平衡点。举例说明，如果交易者在K线8上方买进，预期交易区间向上突破，然后形成一波向上的测量运动，那么一旦市场达到K线9区域，他就可能把止损移动至盈亏平衡点。市场达到K线9区域时，已经超过了他目标的一半，而且有几个收盘在韦瑜交易区间顶部上方。如果他的保护性止损被击中，那么他绝不应该变得志志不安，因为那刚好是他应该做的，限制了他的亏损。那种情况至少在40%的交易中发生。","p":"p1403"},{"t":"如图24.6所示，SDS的5分钟图上的最佳交易包括：K线2开盘多头趋势中的首次回调，K线5高点2，K线6均线处的楔形多头旗形或三角形二次入场。","p":"p1404"},{"t":"这是一个开盘的趋势日。结束于K线3的第一波重要上涨浪，表现出很强的上行动能。当出现强多头趋势时，准备在高点2买入。K线5和K线6是很棒的高点2做多入场信号。K线6也是一波均线回调。K线6是前面倒数第二根K线与倒数第四根K线形成的微型底之后的高点2，也是从K线3开始的大型两浪下跌形态中的高点2，其中K线4是高点1买入信号。","p":"p1405"},{"t":"K线7是第二波上涨浪和一个失败的旗形突破（一个最终旗形反转），缓慢下滑，突破当日重要趋势线。","p":"p1406"},{"t":"当市场进入紧凑交易区间或紧凑通道时，大部分交易者应该停止交易。一些经验丰富的交易者会在前一根K线低点买入，在前一根K线高点做空，在底部的小型多头K线买入。在顶部附近的小型空头K线附近做空，比如在K线12之后。","p":"p1407"},{"t":"由于截至K线8的下跌过程中没有明显的反弹，空头已经控制了一个多小时，所以预期出现第二波下跌浪。K线10是一波小型上涨浪，K线12是第二波上涨浪。从K线11开始的上涨中，出现了一个低点2。另外，K线12是一根小型K线，在均线上方形成一个缺口。它也是一个小型的、几乎水平的楔形顶，其中K线10是第一次上推，K线11后面第二根K线是第二次上推。它也是一个低点4信号，一个更低的高点的重要趋势反转，一次对K线7的低点的测试。","p":"p1408"},{"t":"K线13是K线9突破的一个回调，是一根失败的多头反转K线，套住了多头。","p":"p1409"},{"t":"就在K线7之前。市场进入一段紧凑的交易区间，并且一直持续到K线12之后。对于止损入场来说，这是最糟糕的环境，因为那正好与机构的做法相反，而你的任务是复制机构的做法。无论什么时候，能复制就复制。作为一名初学者，你不能使用限价单入场并逐步加仓，所以你必须等待。机构正在K线下方买入，这也是为什么市场在跌破前一根K线低点后上涨的原因。你还知道他们正在前一根K线的高点卖空，因为预计市场会在之后一两根K线下跌。由于初学者一般都必须带止损地入场，所以如果市场进入了紧凑交易区间，那么我们应该坚决不要交易。因为止损会带来重复的亏损。如果你是一位初学者。并且决定每天的交易数量不应超过三笔。那么在K线7后面的几根K线期间，你在思考什么呢？你正在告诉自己，这就是你一天等待的行情吗？市场很美好而平静，不再令人恐慌。又或者。你告诉自己当前市场的胜率太低不适合浪费宝贵的交易机会，对吗？由于这是一个止损入场的可怕环境，所以在突破之前实际上不会形成最佳交易。所以，要做那些你认为最后会成功突破的交易，你最终将会赚钱，虽然一开始的5到10根K线中你不一定会。在你能实现稳定盈利之前，绝不要在紧凑的窄幅交易区间内交易。即便是你已经实现了稳定盈利，在这种环境下，你最好的选择是等待。当然，你可以像机构那样，利用限价单入场，当市场反向运动时，在K线上方加仓空头，在K线下方加仓多头，做震荡区间的波段交易，但这会使你精疲力竭。最终，浮亏会大到让你难以承受，最终导致你可能会在市场朝着你的方向发展时。你却以较大的亏损止损离场了。所以，总的来说，最好的做法是使用止损单入场，等待胜率常常达到60%的环境，而不要在窄幅交易区间内交易。","p":"p1410"}]},{"t":"para","text":"如图24.6所示，SDS的5分钟图上的最佳交易包括：K线2开盘多头趋势中的首次回调，K线5高点2，K线6均线处的楔形多头旗形或三角形二次入场。","pid":"p1404"},{"t":"para","text":"这是一个开盘的趋势日。结束于K线3的第一波重要上涨浪，表现出很强的上行动能。当出现强多头趋势时，准备在高点2买入。K线5和K线6是很棒的高点2做多入场信号。K线6也是一波均线回调。K线6是前面倒数第二根K线与倒数第四根K线形成的微型底之后的高点2，也是从K线3开始的大型两浪下跌形态中的高点2，其中K线4是高点1买入信号。","pid":"p1405"},{"t":"para","text":"K线7是第二波上涨浪和一个失败的旗形突破（一个最终旗形反转），缓慢下滑，突破当日重要趋势线。","pid":"p1406"},{"t":"para","text":"当市场进入紧凑交易区间或紧凑通道时，大部分交易者应该停止交易。一些经验丰富的交易者会在前一根K线低点买入，在前一根K线高点做空，在底部的小型多头K线买入。在顶部附近的小型空头K线附近做空，比如在K线12之后。","pid":"p1407"},{"t":"para","text":"由于截至K线8的下跌过程中没有明显的反弹，空头已经控制了一个多小时，所以预期出现第二波下跌浪。K线10是一波小型上涨浪，K线12是第二波上涨浪。从K线11开始的上涨中，出现了一个低点2。另外，K线12是一根小型K线，在均线上方形成一个缺口。它也是一个小型的、几乎水平的楔形顶，其中K线10是第一次上推，K线11后面第二根K线是第二次上推。它也是一个低点4信号，一个更低的高点的重要趋势反转，一次对K线7的低点的测试。","pid":"p1408"},{"t":"para","text":"K线13是K线9突破的一个回调，是一根失败的多头反转K线，套住了多头。","pid":"p1409"},{"t":"para","text":"就在K线7之前。市场进入一段紧凑的交易区间，并且一直持续到K线12之后。对于止损入场来说，这是最糟糕的环境，因为那正好与机构的做法相反，而你的任务是复制机构的做法。无论什么时候，能复制就复制。作为一名初学者，你不能使用限价单入场并逐步加仓，所以你必须等待。机构正在K线下方买入，这也是为什么市场在跌破前一根K线低点后上涨的原因。你还知道他们正在前一根K线的高点卖空，因为预计市场会在之后一两根K线下跌。由于初学者一般都必须带止损地入场，所以如果市场进入了紧凑交易区间，那么我们应该坚决不要交易。因为止损会带来重复的亏损。如果你是一位初学者。并且决定每天的交易数量不应超过三笔。那么在K线7后面的几根K线期间，你在思考什么呢？你正在告诉自己，这就是你一天等待的行情吗？市场很美好而平静，不再令人恐慌。又或者。你告诉自己当前市场的胜率太低不适合浪费宝贵的交易机会，对吗？由于这是一个止损入场的可怕环境，所以在突破之前实际上不会形成最佳交易。所以，要做那些你认为最后会成功突破的交易，你最终将会赚钱，虽然一开始的5到10根K线中你不一定会。在你能实现稳定盈利之前，绝不要在紧凑的窄幅交易区间内交易。即便是你已经实现了稳定盈利，在这种环境下，你最好的选择是等待。当然，你可以像机构那样，利用限价单入场，当市场反向运动时，在K线上方加仓空头，在K线下方加仓多头，做震荡区间的波段交易，但这会使你精疲力竭。最终，浮亏会大到让你难以承受，最终导致你可能会在市场朝着你的方向发展时。你却以较大的亏损止损离场了。所以，总的来说，最好的做法是使用止损单入场，等待胜率常常达到60%的环境，而不要在窄幅交易区间内交易。","pid":"p1410"},{"t":"img","src":"assets/img/p4c4_007.webp","ctx":[{"t":"K线13是K线9突破的一个回调，是一根失败的多头反转K线，套住了多头。","p":"p1409"},{"t":"就在K线7之前。市场进入一段紧凑的交易区间，并且一直持续到K线12之后。对于止损入场来说，这是最糟糕的环境，因为那正好与机构的做法相反，而你的任务是复制机构的做法。无论什么时候，能复制就复制。作为一名初学者，你不能使用限价单入场并逐步加仓，所以你必须等待。机构正在K线下方买入，这也是为什么市场在跌破前一根K线低点后上涨的原因。你还知道他们正在前一根K线的高点卖空，因为预计市场会在之后一两根K线下跌。由于初学者一般都必须带止损地入场，所以如果市场进入了紧凑交易区间，那么我们应该坚决不要交易。因为止损会带来重复的亏损。如果你是一位初学者。并且决定每天的交易数量不应超过三笔。那么在K线7后面的几根K线期间，你在思考什么呢？你正在告诉自己，这就是你一天等待的行情吗？市场很美好而平静，不再令人恐慌。又或者。你告诉自己当前市场的胜率太低不适合浪费宝贵的交易机会，对吗？由于这是一个止损入场的可怕环境，所以在突破之前实际上不会形成最佳交易。所以，要做那些你认为最后会成功突破的交易，你最终将会赚钱，虽然一开始的5到10根K线中你不一定会。在你能实现稳定盈利之前，绝不要在紧凑的窄幅交易区间内交易。即便是你已经实现了稳定盈利，在这种环境下，你最好的选择是等待。当然，你可以像机构那样，利用限价单入场，当市场反向运动时，在K线上方加仓空头，在K线下方加仓多头，做震荡区间的波段交易，但这会使你精疲力竭。最终，浮亏会大到让你难以承受，最终导致你可能会在市场朝着你的方向发展时。你却以较大的亏损止损离场了。所以，总的来说，最好的做法是使用止损单入场，等待胜率常常达到60%的环境，而不要在窄幅交易区间内交易。","p":"p1410"},{"t":"如图24.7所示，这张AAPL的5分钟K线图上的最佳交易信号包括K线1和K线2双K线反转下方的20缺口K线做空信号，以及K线7双重底。","p":"p1411"},{"t":"AAPL处于一轮开盘的空头趋势中，K线2是一个20缺口K线的做空机会，也是双K线反转信号。K线2的入场价位是169.88美元，入场K线上方的止损位设置在170.38美元。入场K线是一根外包下跌K线，交易者一入场就把止损位设置在这根K线的上方。或者在前一根K线的收盘价。这是一种合理的做法，因为它限定了风险，如果市场反转向上超越这根K线的高点，那么也不要做空。如果它不是一根外包K线，那么他们可能会把止损设在信号K线的上方，此处的初始风险是50美分。","p":"p1412"},{"t":"激进型的交易者们，会把限价单设在K线3和4的高点，预期任何向上的反弹都会失败，因为这是一个K线3突破空头旗形后的突破后的反弹做空的信号。他们把它看作是一个平静的空头旗形，而不是一个做多的反转，他们预期会出现卖盘压力，所以在任意一根K线的上方做空都是不错的选择。","p":"p1413"},{"t":"K线5是一个糟糕的高点1回调买入信号，因为市场处于一轮强势的空头趋势中，交易者们不会退出空头头寸，不会反转做多。市场下跌超越这一根K线7美分时，交易者不会马上移动他们的保护性止损，因为最大的未平仓利润只有38美分，他们想要给这笔交易更多的时间和空间。一般而言，对于这样一笔交易，直到未平仓利润达到60到80美分，交易者才能把保护性止损移动到他们的盈亏平衡点","p":"p1414"},{"t":"在K线6，交易者们能够使用限价单以1美元的利润了结一半的股票（K线6底部比他们的入场价位低了1.07美元）。通过这一根K线的外包上涨特点，我们可以看到大量交易者可能在这里部分或者全部平仓。在这一点处，他们会把自己的保护性止损移至盈亏平衡点，或者略差几个便士的位置（170.91美元是合理的价位，因为AAPL很少会以超过1便士的幅度来猎杀止损），而不会离场，除非出现明确而强劲的反转。在这样一个强空头趋势日，那种反转不太可能出现。他们预期回调是在恐吓弱势空头离场。举例说明，截至K线9的反弹，精确击中了盈亏平衡止损点（170.88美元），然后向下反转。","p":"p1415"},{"t":"如果交易者们被止损踢出，那么他们会在K线10再次做空。可是在K线9均线测试和突破测试之后。K线10显示出突破测试已经完成了恐吓交易者们离场的目的，因为显然有大量空头入场。如果交易者让自己被止损踢出，那么他们现在不会再次做空，可是现在的价位比之前一下子低了41美分！","p":"p1416"}]},{"t":"para","text":"如图24.7所示，这张AAPL的5分钟K线图上的最佳交易信号包括K线1和K线2双K线反转下方的20缺口K线做空信号，以及K线7双重底。","pid":"p1411"},{"t":"para","text":"AAPL处于一轮开盘的空头趋势中，K线2是一个20缺口K线的做空机会，也是双K线反转信号。K线2的入场价位是169.88美元，入场K线上方的止损位设置在170.38美元。入场K线是一根外包下跌K线，交易者一入场就把止损位设置在这根K线的上方。或者在前一根K线的收盘价。这是一种合理的做法，因为它限定了风险，如果市场反转向上超越这根K线的高点，那么也不要做空。如果它不是一根外包K线，那么他们可能会把止损设在信号K线的上方，此处的初始风险是50美分。","pid":"p1412"},{"t":"para","text":"激进型的交易者们，会把限价单设在K线3和4的高点，预期任何向上的反弹都会失败，因为这是一个K线3突破空头旗形后的突破后的反弹做空的信号。他们把它看作是一个平静的空头旗形，而不是一个做多的反转，他们预期会出现卖盘压力，所以在任意一根K线的上方做空都是不错的选择。","pid":"p1413"},{"t":"para","text":"K线5是一个糟糕的高点1回调买入信号，因为市场处于一轮强势的空头趋势中，交易者们不会退出空头头寸，不会反转做多。市场下跌超越这一根K线7美分时，交易者不会马上移动他们的保护性止损，因为最大的未平仓利润只有38美分，他们想要给这笔交易更多的时间和空间。一般而言，对于这样一笔交易，直到未平仓利润达到60到80美分，交易者才能把保护性止损移动到他们的盈亏平衡点","pid":"p1414"},{"t":"para","text":"在K线6，交易者们能够使用限价单以1美元的利润了结一半的股票（K线6底部比他们的入场价位低了1.07美元）。通过这一根K线的外包上涨特点，我们可以看到大量交易者可能在这里部分或者全部平仓。在这一点处，他们会把自己的保护性止损移至盈亏平衡点，或者略差几个便士的位置（170.91美元是合理的价位，因为AAPL很少会以超过1便士的幅度来猎杀止损），而不会离场，除非出现明确而强劲的反转。在这样一个强空头趋势日，那种反转不太可能出现。他们预期回调是在恐吓弱势空头离场。举例说明，截至K线9的反弹，精确击中了盈亏平衡止损点（170.88美元），然后向下反转。","pid":"p1415"},{"t":"para","text":"如果交易者们被止损踢出，那么他们会在K线10再次做空。可是在K线9均线测试和突破测试之后。K线10显示出突破测试已经完成了恐吓交易者们离场的目的，因为显然有大量空头入场。如果交易者让自己被止损踢出，那么他们现在不会再次做空，可是现在的价位比之前一下子低了41美分！","pid":"p1416"},{"t":"img","src":"assets/img/p4c4_008.webp","ctx":[{"t":"在K线6，交易者们能够使用限价单以1美元的利润了结一半的股票（K线6底部比他们的入场价位低了1.07美元）。通过这一根K线的外包上涨特点，我们可以看到大量交易者可能在这里部分或者全部平仓。在这一点处，他们会把自己的保护性止损移至盈亏平衡点，或者略差几个便士的位置（170.91美元是合理的价位，因为AAPL很少会以超过1便士的幅度来猎杀止损），而不会离场，除非出现明确而强劲的反转。在这样一个强空头趋势日，那种反转不太可能出现。他们预期回调是在恐吓弱势空头离场。举例说明，截至K线9的反弹，精确击中了盈亏平衡止损点（170.88美元），然后向下反转。","p":"p1415"},{"t":"如果交易者们被止损踢出，那么他们会在K线10再次做空。可是在K线9均线测试和突破测试之后。K线10显示出突破测试已经完成了恐吓交易者们离场的目的，因为显然有大量空头入场。如果交易者让自己被止损踢出，那么他们现在不会再次做空，可是现在的价位比之前一下子低了41美分！","p":"p1416"},{"t":"如图24.8所示，高盛集团（GS）5分钟图上的最佳交易包括：K线1之后第二根K线形成的微型通道失败突破：K线3后面一根K线下方的突破后的回调入场信号（这里是一个低点2反弹后的卖空信号）：从太平洋标准时间上午11：10空头高潮开始下跌通道之后，K线5多头反转K线上方的二次入场做多机会。","p":"p1417"},{"t":"小幅反弹的趋势是下跌趋势中最强的一种趋势。因为市场一直没有表现出多头的力量，所以交易者们在全天只考虑做空，除非出现收盘前反弹的征兆。在出现K线5附近潜在的底部之前，交易者们会在任意小幅反弹的时候做空。在K线1之前，任何此前的小幅反弹幅度都不超过1美元，所以交易者们可以在最新的低点上方一美元附近设置限价订单，来逢反弹做空。他们需要知道自己的止损位，然后定一个最低的止盈目标位。由于这个一般非常难定，所以他们一般会考虑最坏的情况。例如。如果市场在当天第四根K线的上方，那么市场的熊市趋势就没那么强了。因此，他们的止损位可以设置在第四根K线的高点179.50美元附近。鉴于他们可能在177美元附近做空，那么他们的每股的风险就是2.5美元左右。如果他们不会让自己在一笔交易上损失超过500美元，那么他们可以交易200股。既然他们认为目前是熊市趋势，那么他们应该假设市场创新低、或者说利润空间超过1美元的概率至少是60%。不过，他们只应该在利润空间至少跟潜在风险一样大时，才能参与这笔交易。也就是说，他们应该努力在他们的入场价位下方2.5美元或者174.50美元价位附近了结一半的头寸（也就是100股）。他们的订单将在K线2前面倒数第二根K线的空头趋势K线中被执行。在那时，他们会把止损位移至盈亏平衡点，继续持有，直到总是在场策略的状态反转为多头策略，直到他们的止损被击中，直到最后一小时左右出现任意合理的向上反转。或者直到当日收盘。如果他们在K线5上方离场，那么他们在第二个100股上便会赚到900美元。如果当市场在向170美元挺进并转为总是在场策略的多头时，他们此时离场能够赚到700美元，如果他们一直坚持到收盘，那么第二个100股也大概赚到700美元。","p":"p1418"},{"t":"这是应该避免反转入场的一个完美例子。每天，你都应该随时分析图表，尤其是在开盘后的一两个小时，一边决定当天是否是一个趋势日（趋势日的主要类型在这一系列书的第一本书中已经讨论）。如果当天是一个趋势日，那么就不应该逆势交易。类似这样的开盘趋势日，是最容易看出的趋势日。截至当天第三根K线，你会猜测是否是空头趋势日（一条大型空头趋势K线，大幅跌破开盘价），而当市场向下突破K线1时，你已经非常自信。","p":"p1419"},{"t":"K线1反弹是一条大型多头趋势K线，它突破了一条微型趋势线，所以很可能失败。心急的交易者可能会在K线2、3、4等反转K线上方买入，认为趋势线突破期间，多头显示出足够的力量。然而，从当天第三根K线开始，市场一直处于均线的下方，交易者们应该记得类似这样的小反弹空头趋势日，而向均线的第一次反弹通常失败，然后市场测试低点。不要劝说自己市场已经走得太远，应该出现反弹。根据定义，你正在逆势思考，正在寻找一个强趋势日中的逆势刮头皮。你害怕在低点附近卖出，并希望出现趋势反转，那是一种低胜率的赌注。不妨计算一下，大部分的逆势刮头皮都会失败，你在每笔交易上的损失将完全抵消你在最后一两笔交易上的盈利。","p":"p1420"},{"t":"然而。由于GS一整天都处在均线处没有可交易的低点2反弹做空机会，所以经验丰富的交易者甚至会在最微小的反弹处做空。如果反弹幅度大于预期，那么就依靠典型的回调序列（在这系列书的第二本书讲过）让自己离场。每种类型的第一次反弹，随后通常都会对趋势极点（这里是当天的低点）进一步测试。","p":"p1421"}]},{"t":"para","text":"如图24.8所示，高盛集团（GS）5分钟图上的最佳交易包括：K线1之后第二根K线形成的微型通道失败突破：K线3后面一根K线下方的突破后的回调入场信号（这里是一个低点2反弹后的卖空信号）：从太平洋标准时间上午11：10空头高潮开始下跌通道之后，K线5多头反转K线上方的二次入场做多机会。","pid":"p1417"},{"t":"para","text":"小幅反弹的趋势是下跌趋势中最强的一种趋势。因为市场一直没有表现出多头的力量，所以交易者们在全天只考虑做空，除非出现收盘前反弹的征兆。在出现K线5附近潜在的底部之前，交易者们会在任意小幅反弹的时候做空。在K线1之前，任何此前的小幅反弹幅度都不超过1美元，所以交易者们可以在最新的低点上方一美元附近设置限价订单，来逢反弹做空。他们需要知道自己的止损位，然后定一个最低的止盈目标位。由于这个一般非常难定，所以他们一般会考虑最坏的情况。例如。如果市场在当天第四根K线的上方，那么市场的熊市趋势就没那么强了。因此，他们的止损位可以设置在第四根K线的高点179.50美元附近。鉴于他们可能在177美元附近做空，那么他们的每股的风险就是2.5美元左右。如果他们不会让自己在一笔交易上损失超过500美元，那么他们可以交易200股。既然他们认为目前是熊市趋势，那么他们应该假设市场创新低、或者说利润空间超过1美元的概率至少是60%。不过，他们只应该在利润空间至少跟潜在风险一样大时，才能参与这笔交易。也就是说，他们应该努力在他们的入场价位下方2.5美元或者174.50美元价位附近了结一半的头寸（也就是100股）。他们的订单将在K线2前面倒数第二根K线的空头趋势K线中被执行。在那时，他们会把止损位移至盈亏平衡点，继续持有，直到总是在场策略的状态反转为多头策略，直到他们的止损被击中，直到最后一小时左右出现任意合理的向上反转。或者直到当日收盘。如果他们在K线5上方离场，那么他们在第二个100股上便会赚到900美元。如果当市场在向170美元挺进并转为总是在场策略的多头时，他们此时离场能够赚到700美元，如果他们一直坚持到收盘，那么第二个100股也大概赚到700美元。","pid":"p1418"},{"t":"para","text":"这是应该避免反转入场的一个完美例子。每天，你都应该随时分析图表，尤其是在开盘后的一两个小时，一边决定当天是否是一个趋势日（趋势日的主要类型在这一系列书的第一本书中已经讨论）。如果当天是一个趋势日，那么就不应该逆势交易。类似这样的开盘趋势日，是最容易看出的趋势日。截至当天第三根K线，你会猜测是否是空头趋势日（一条大型空头趋势K线，大幅跌破开盘价），而当市场向下突破K线1时，你已经非常自信。","pid":"p1419"},{"t":"para","text":"K线1反弹是一条大型多头趋势K线，它突破了一条微型趋势线，所以很可能失败。心急的交易者可能会在K线2、3、4等反转K线上方买入，认为趋势线突破期间，多头显示出足够的力量。然而，从当天第三根K线开始，市场一直处于均线的下方，交易者们应该记得类似这样的小反弹空头趋势日，而向均线的第一次反弹通常失败，然后市场测试低点。不要劝说自己市场已经走得太远，应该出现反弹。根据定义，你正在逆势思考，正在寻找一个强趋势日中的逆势刮头皮。你害怕在低点附近卖出，并希望出现趋势反转，那是一种低胜率的赌注。不妨计算一下，大部分的逆势刮头皮都会失败，你在每笔交易上的损失将完全抵消你在最后一两笔交易上的盈利。","pid":"p1420"},{"t":"para","text":"然而。由于GS一整天都处在均线处没有可交易的低点2反弹做空机会，所以经验丰富的交易者甚至会在最微小的反弹处做空。如果反弹幅度大于预期，那么就依靠典型的回调序列（在这系列书的第二本书讲过）让自己离场。每种类型的第一次反弹，随后通常都会对趋势极点（这里是当天的低点）进一步测试。","pid":"p1421"},{"t":"img","src":"assets/img/p4c4_009.webp","ctx":[{"t":"K线1反弹是一条大型多头趋势K线，它突破了一条微型趋势线，所以很可能失败。心急的交易者可能会在K线2、3、4等反转K线上方买入，认为趋势线突破期间，多头显示出足够的力量。然而，从当天第三根K线开始，市场一直处于均线的下方，交易者们应该记得类似这样的小反弹空头趋势日，而向均线的第一次反弹通常失败，然后市场测试低点。不要劝说自己市场已经走得太远，应该出现反弹。根据定义，你正在逆势思考，正在寻找一个强趋势日中的逆势刮头皮。你害怕在低点附近卖出，并希望出现趋势反转，那是一种低胜率的赌注。不妨计算一下，大部分的逆势刮头皮都会失败，你在每笔交易上的损失将完全抵消你在最后一两笔交易上的盈利。","p":"p1420"},{"t":"然而。由于GS一整天都处在均线处没有可交易的低点2反弹做空机会，所以经验丰富的交易者甚至会在最微小的反弹处做空。如果反弹幅度大于预期，那么就依靠典型的回调序列（在这系列书的第二本书讲过）让自己离场。每种类型的第一次反弹，随后通常都会对趋势极点（这里是当天的低点）进一步测试。","p":"p1421"},{"t":"如图24.9所示，England-basedVodafoneGroup（世界上最大的通讯服务公司之一，VOD）这张日线图上的最佳交易包括：K线3均线处的高点1回调买入机会：K线7楔形多头旗形和一条均线缺口K线的二次入场机会：K线8的小型三角形、K线11向均线的楔形多头旗形，K线12高点2回调做多机会：K线14的楔形多头旗形，以及K线15低点处的突破回调做多信号。","p":"p1422"},{"t":"当出现一轮强多头趋势和多头旗形突破。而且突破K线有一个多头实体时，在它的低点买入是一种可靠的策略。这是因为，回调通常会成为一个突破后回调做多的信号，你可以在较低的价位买入。COD在日线图上处于一轮强多头趋势中。K线15是一根多头趋势K线，它突破了均线处的一个形多头旗形，所以任何回调都可能会非常短暂，而且会成为突破回调买入信号的信号K线。交易者们会使用限价单在K线15低点买入。计划在回调K线上方买入的交易者们，失望地看到次日形成的大型上涨缺口。如果他们仍然想要做多，那么他们的入场价位就要糟糕很多。","p":"p1423"},{"t":"市场从K线5开始，一路跌到了沿着从K线3开始的上升通道底部的趋势线（图中未画出）下方，但双K线下跌甚至没有触及均线。这使得K线6并不能成为一个重要趋势反转的更低的高点。市场更加可能只是在制造一波回调。回调结束于K线7所在的高点2回调买入信号点，同时它也是楔形多头旗形和均线缺口K线。","p":"p1424"},{"t":"一般来说，总要准备低买高卖，但是在强多头趋势中，却是在高点买入，在更高的价位离场：在强空头趋势中，在低点卖空，在更低的点位平仓离场。然而，如果你在自己预期的微型顶部做空，","p":"p1425"}]},{"t":"para","text":"如图24.9所示，England-basedVodafoneGroup（世界上最大的通讯服务公司之一，VOD）这张日线图上的最佳交易包括：K线3均线处的高点1回调买入机会：K线7楔形多头旗形和一条均线缺口K线的二次入场机会：K线8的小型三角形、K线11向均线的楔形多头旗形，K线12高点2回调做多机会：K线14的楔形多头旗形，以及K线15低点处的突破回调做多信号。","pid":"p1422"},{"t":"para","text":"当出现一轮强多头趋势和多头旗形突破。而且突破K线有一个多头实体时，在它的低点买入是一种可靠的策略。这是因为，回调通常会成为一个突破后回调做多的信号，你可以在较低的价位买入。COD在日线图上处于一轮强多头趋势中。K线15是一根多头趋势K线，它突破了均线处的一个形多头旗形，所以任何回调都可能会非常短暂，而且会成为突破回调买入信号的信号K线。交易者们会使用限价单在K线15低点买入。计划在回调K线上方买入的交易者们，失望地看到次日形成的大型上涨缺口。如果他们仍然想要做多，那么他们的入场价位就要糟糕很多。","pid":"p1423"},{"t":"para","text":"市场从K线5开始，一路跌到了沿着从K线3开始的上升通道底部的趋势线（图中未画出）下方，但双K线下跌甚至没有触及均线。这使得K线6并不能成为一个重要趋势反转的更低的高点。市场更加可能只是在制造一波回调。回调结束于K线7所在的高点2回调买入信号点，同时它也是楔形多头旗形和均线缺口K线。","pid":"p1424"},{"t":"para","text":"一般来说，总要准备低买高卖，但是在强多头趋势中，却是在高点买入，在更高的价位离场：在强空头趋势中，在低点卖空，在更低的点位平仓离场。然而，如果你在自己预期的微型顶部做空，","pid":"p1425"},{"t":"img","src":"assets/img/p4c4_010.webp","ctx":[{"t":"市场从K线5开始，一路跌到了沿着从K线3开始的上升通道底部的趋势线（图中未画出）下方，但双K线下跌甚至没有触及均线。这使得K线6并不能成为一个重要趋势反转的更低的高点。市场更加可能只是在制造一波回调。回调结束于K线7所在的高点2回调买入信号点，同时它也是楔形多头旗形和均线缺口K线。","p":"p1424"},{"t":"一般来说，总要准备低买高卖，但是在强多头趋势中，却是在高点买入，在更高的价位离场：在强空头趋势中，在低点卖空，在更低的点位平仓离场。然而，如果你在自己预期的微型顶部做空，","p":"p1425"},{"t":"比如图24.10所示电子迷你图表中K线15或16下方，且市场形成一个高点2回调买入机会（比如在K线17），此时你要么就离场，要么甚至反转做多。","p":"p1426"},{"t":"当电子迷你期货中的平均日区间大约为10到15点时，交易者们在一笔交易上通常必须承担两个点的风险。他们应该寻找利润至少与风险一样大、胜率至少是60%的交易。大部分交易日，通常会有5个或更多这样的信号，比如在这张图表的K线1开盘做空，在K线3的低点上方买入，或在高点2的回调买入信号K线处买入（K线7、K线14后面的那根K线，以及K线17）以及K线22处的微型通道突破后回调买入机会。记住，如果交易者认为某个交易机会不错，那么他们应该假定胜率至少为60%。如果潜在回报至少和风险一样大，那么将产生一个正的交易者方程","p":"p1427"},{"t":"注意，大部分微型反转来自微型双重顶、双重底和小型最终旗形刮头皮者们喜欢在下单之前看到这些信号。","p":"p1428"},{"t":"最佳交易的成功率最低是60%，且潜在回报至少与风险一样大。","p":"p1429"}]},{"t":"para","text":"比如图24.10所示电子迷你图表中K线15或16下方，且市场形成一个高点2回调买入机会（比如在K线17），此时你要么就离场，要么甚至反转做多。","pid":"p1426"},{"t":"para","text":"当电子迷你期货中的平均日区间大约为10到15点时，交易者们在一笔交易上通常必须承担两个点的风险。他们应该寻找利润至少与风险一样大、胜率至少是60%的交易。大部分交易日，通常会有5个或更多这样的信号，比如在这张图表的K线1开盘做空，在K线3的低点上方买入，或在高点2的回调买入信号K线处买入（K线7、K线14后面的那根K线，以及K线17）以及K线22处的微型通道突破后回调买入机会。记住，如果交易者认为某个交易机会不错，那么他们应该假定胜率至少为60%。如果潜在回报至少和风险一样大，那么将产生一个正的交易者方程","pid":"p1427"},{"t":"para","text":"注意，大部分微型反转来自微型双重顶、双重底和小型最终旗形刮头皮者们喜欢在下单之前看到这些信号。","pid":"p1428"},{"t":"para","text":"最佳交易的成功率最低是60%，且潜在回报至少与风险一样大。","pid":"p1429"},{"t":"img","src":"assets/img/p4c4_011.webp","ctx":[{"t":"注意，大部分微型反转来自微型双重顶、双重底和小型最终旗形刮头皮者们喜欢在下单之前看到这些信号。","p":"p1428"},{"t":"最佳交易的成功率最低是60%，且潜在回报至少与风险一样大。","p":"p1429"},{"t":"如图24.11所示，印度汽车制造商TataMotorsLtd（TTM）在这张日线图上的最佳交易包括：K线3和K线4的高点2回调买入信号：从K线5到K线6的多头趋势高潮的三根K线的任何一根：.K线10的高点2回调买入信号：K线11楔形多头旗形：K线12突破后的高点1回调买入信号：K线14突破后回调和它的前一根K线的高点2回调买入信号；K线16高点2回调买入信号；以及K线20更高的高点的反转信号。","p":"p1430"},{"t":"强趋势中向均线的楔形多头旗形回调，是一种可靠的买入信号。从K线1开始，TTM处于一轮强多头趋势中，截至K线8在不到两个月的时间里几乎上涨了40%。在K线10处，市场形成一个向均线的高点2的回调，这是一个合理的买入机会。在K线11内含K线演变成一个多头楔形旗形时，K线在均线附近，形成很好的买入信号。K线11是突破此前形成的多头楔形旗形后的回调。是一个回调买入信号。如果交易者们在K线10上方买入，那么他们会在两根K线之后出现的抛盘中在盈亏平衡点离场，或者他们可以依靠信号K线下方的保护性止损价位离场，但价位没有被触及。他们还可以将止损设置在略低于K线7的低点处。","p":"p1431"},{"t":"K线7是多头趋势中一个强多头高潮的第一次回调，且随后没有形成买入高潮。这是一个理想的高点1回调买入信号，也是一个微型通道失败突破买入信号。它是一个突破后回调买入信号，因为它是K线5向上突破此前紧凑的交易区间后的第一次回调。","p":"p1432"},{"t":"K线17处巨大的多头趋势K线是一波买入高潮。每当出现一轮持续10到20根K线甚至更多的趋势之后，出现一条巨大的多头趋势K线时，这一般代表着多头动能的耗竭。它是由部分最后的空头离场和迟到的多头买入造成的。这两群交易者都是弱势交易群体。在这个位置，强势多头只会在回调买入，如果要做空，只会在更高的价位做空。K线17突破向上突破超越了过去一两个月的趋势通道线，我们需要画一条更高的趋势通道线。在K线19和20，市场尝试向上突破趋势通道线，两次都遇到了很强的卖盘压力。通过两根K线很长的上影线，K线19的空头旗形，以及K线20收盘远低于中点便可以看出。当市场两次试图做某件事情均告失败后。它通常试着向相反方向运动。从K线18开始的空头K线，以及K线19和20很长的上影线，都表明卖盘压力正在累积。从K线17开始，K线的长度大大增加，表明多头正在异常努力地将原来的趋势转变成一轮更强的多头趋势。他们的努力引发了自我的耗尽，卖盘压力逐步将它们挫败。市场很可能至少形成一波两浪结构的调整，趋势很可能反转。","p":"p1433"},{"t":"截至K线18的抛盘向下突破了一条多头趋势线，所有的卖盘压力使得抛售潮很可能出现。所以在K线20后面的强空头趋势K线做空是一笔高胜率交易。它是一条收盘于低点的大型空头趋势K线，它与K线20形成一个很大的双K线反转。空头实体的幅度和极小的上影线都表明卖盘压力非常强。","p":"p1434"}]},{"t":"para","text":"如图24.11所示，印度汽车制造商TataMotorsLtd（TTM）在这张日线图上的最佳交易包括：K线3和K线4的高点2回调买入信号：从K线5到K线6的多头趋势高潮的三根K线的任何一根：.K线10的高点2回调买入信号：K线11楔形多头旗形：K线12突破后的高点1回调买入信号：K线14突破后回调和它的前一根K线的高点2回调买入信号；K线16高点2回调买入信号；以及K线20更高的高点的反转信号。","pid":"p1430"},{"t":"para","text":"强趋势中向均线的楔形多头旗形回调，是一种可靠的买入信号。从K线1开始，TTM处于一轮强多头趋势中，截至K线8在不到两个月的时间里几乎上涨了40%。在K线10处，市场形成一个向均线的高点2的回调，这是一个合理的买入机会。在K线11内含K线演变成一个多头楔形旗形时，K线在均线附近，形成很好的买入信号。K线11是突破此前形成的多头楔形旗形后的回调。是一个回调买入信号。如果交易者们在K线10上方买入，那么他们会在两根K线之后出现的抛盘中在盈亏平衡点离场，或者他们可以依靠信号K线下方的保护性止损价位离场，但价位没有被触及。他们还可以将止损设置在略低于K线7的低点处。","pid":"p1431"},{"t":"para","text":"K线7是多头趋势中一个强多头高潮的第一次回调，且随后没有形成买入高潮。这是一个理想的高点1回调买入信号，也是一个微型通道失败突破买入信号。它是一个突破后回调买入信号，因为它是K线5向上突破此前紧凑的交易区间后的第一次回调。","pid":"p1432"},{"t":"para","text":"K线17处巨大的多头趋势K线是一波买入高潮。每当出现一轮持续10到20根K线甚至更多的趋势之后，出现一条巨大的多头趋势K线时，这一般代表着多头动能的耗竭。它是由部分最后的空头离场和迟到的多头买入造成的。这两群交易者都是弱势交易群体。在这个位置，强势多头只会在回调买入，如果要做空，只会在更高的价位做空。K线17突破向上突破超越了过去一两个月的趋势通道线，我们需要画一条更高的趋势通道线。在K线19和20，市场尝试向上突破趋势通道线，两次都遇到了很强的卖盘压力。通过两根K线很长的上影线，K线19的空头旗形，以及K线20收盘远低于中点便可以看出。当市场两次试图做某件事情均告失败后。它通常试着向相反方向运动。从K线18开始的空头K线，以及K线19和20很长的上影线，都表明卖盘压力正在累积。从K线17开始，K线的长度大大增加，表明多头正在异常努力地将原来的趋势转变成一轮更强的多头趋势。他们的努力引发了自我的耗尽，卖盘压力逐步将它们挫败。市场很可能至少形成一波两浪结构的调整，趋势很可能反转。","pid":"p1433"},{"t":"para","text":"截至K线18的抛盘向下突破了一条多头趋势线，所有的卖盘压力使得抛售潮很可能出现。所以在K线20后面的强空头趋势K线做空是一笔高胜率交易。它是一条收盘于低点的大型空头趋势K线，它与K线20形成一个很大的双K线反转。空头实体的幅度和极小的上影线都表明卖盘压力非常强。","pid":"p1434"},{"t":"img","src":"assets/img/p4c4_012.webp","ctx":[{"t":"K线17处巨大的多头趋势K线是一波买入高潮。每当出现一轮持续10到20根K线甚至更多的趋势之后，出现一条巨大的多头趋势K线时，这一般代表着多头动能的耗竭。它是由部分最后的空头离场和迟到的多头买入造成的。这两群交易者都是弱势交易群体。在这个位置，强势多头只会在回调买入，如果要做空，只会在更高的价位做空。K线17突破向上突破超越了过去一两个月的趋势通道线，我们需要画一条更高的趋势通道线。在K线19和20，市场尝试向上突破趋势通道线，两次都遇到了很强的卖盘压力。通过两根K线很长的上影线，K线19的空头旗形，以及K线20收盘远低于中点便可以看出。当市场两次试图做某件事情均告失败后。它通常试着向相反方向运动。从K线18开始的空头K线，以及K线19和20很长的上影线，都表明卖盘压力正在累积。从K线17开始，K线的长度大大增加，表明多头正在异常努力地将原来的趋势转变成一轮更强的多头趋势。他们的努力引发了自我的耗尽，卖盘压力逐步将它们挫败。市场很可能至少形成一波两浪结构的调整，趋势很可能反转。","p":"p1433"},{"t":"截至K线18的抛盘向下突破了一条多头趋势线，所有的卖盘压力使得抛售潮很可能出现。所以在K线20后面的强空头趋势K线做空是一笔高胜率交易。它是一条收盘于低点的大型空头趋势K线，它与K线20形成一个很大的双K线反转。空头实体的幅度和极小的上影线都表明卖盘压力非常强。","p":"p1434"},{"t":"如图24.12所示，中国光电池制造商林洋电力控股（SOLF）日线图上的最佳交易包括：市场回调至K线4且依托均线支撑的高点2回调买入信号：K线5处市场第三次上推浪后的巨型向下反转：K线7两次强势下推浪后出现的低点2的反弹做空机会：K线8的双重底多头旗形：K线9后面以及K线10后面的小型高点2回调买入机会；K线12更高的高点的做空机会：以及K线14两浪上涨的更低的高点做空机会。","p":"p1435"},{"t":"更高的高点反转之后通常会是一个更低的高点做空信号。SOLF从K线5高点开始形成一波很强的下跌运动。K线6之前形成的第二条大型空头趋势K线，在K线3和4前后又出现另外几条空头趋势K线，这些都代表着卖盘压力正在积累，在某个点可能会引起趋势反转。然而，趋势线突破之后，空头未能将空头趋势K线连续在一起，所以总是在场策略的头寸依然是多头。","p":"p1436"},{"t":"截至K线8的抛盘强势突破多头趋势线，但是截止K线9迅猛反弹向上突破K线7（头肩顶的右肩），所以很可能出现坚持到底。在截至K线9的上涨高潮之后，市场形成一条上升通道，至K线12结束。在K线12上方形成一个更高的高点。从K线5开始的强势抛售潮之后，空头打算做空，多头打算获利了结。有些交易者把K线12看作是通道内的第三次上推浪，截至K线9或K线10是第一浪，截至K线10或K线11是第二浪。K线12信号K线是一个十字星，所以有些交易者在等待更多空头力量的出现。","p":"p1437"},{"t":"K线12之后的强空头趋势K线是强卖压的征兆，它带给空头在随后一两根K线积极做空的自信。这一波下跌由三根大阴线组成，突破了多头趋势线。交易者们相信很可能出现更多的卖盘，因为市场已经转为了总是在场策略的空头头寸，所以他们打算在市场反弹时做空。","p":"p1438"},{"t":"市场在K线14形成一个两浪结构的更低的高点，测试K线12的低点，从那一根K线的第一个跳动开始，市场就在下跌。交易者们对市场的下跌很有信心。当市场跌破它前一根K线的低点，成为一条外包的下跌趋势K线时，有些交易者们就开始做空。还有一些交易者在价格向下突破K线13的低点时才做空，预期市场会出现一波向下至少等距的下跌浪。","p":"p1439"},{"t":"截至K线15的下跌高潮也很强，但有些空头被K线18之前的几波迅猛反弹套出，因为这一波反弹略高于K线16的高点，看起来也很强劲。有些交易者在K线15多头趋势K线上方买入，因为它与K线8构成一个双重底多头旗形，还是一个双K线反转，是一个从一根K线之前开始的单K线最终旗形反转。然而，空头在K线18的后一根K线返回市场，制造了一个大阴线。这是一笔很容易被套出的最佳交易，所以我们的重点是要避免被市场套出。不要太早地调紧自己的止损，尝试利用盈亏平衡持有部分头寸，直到市场明显地变为总是在场的策略的多头头寸。截至K线18的反弹并不足以令总是在场头寸翻转，所以波段交易者们应该坚持持有空头。","p":"p1440"},{"t":"从K线5到K线8的抛盘非常强劲，足以令交易者们猜测市场是否正在从一轮多头趋势演变成交易区间。截至K线12的反弹包含很多回调、大阴线，以及带有很长上影线的K线。他们都是卖盘压力的征兆，这表明市场正在向震荡市转变。这看起来更像是震荡区间的一波上涨浪，而不是多头趋势的一波上涨浪。交易者们正开始在波段高点上方卖出，比如在K线10向上超越K线9时，或者在K线11向上超越K线10时。K线12是一个更高的高点（K线5的上方）重要趋势反转的信号K线。但是大部分交易者认为更有可能形成震荡区间和对区间底部K线8的测试，而不是空头趋势，儿乎总是这样（大部分交易区间突破尝试挫败）。虽然在K线15和17之间的区域内有一些获利了结，但K线16和18形成一个双重顶空头旗形，引出对区间的向下突破。很多交易者在K线15区域内部分获利了结，并把他们的保护性止损移至盈亏平衡点，希望出现一个更大的下跌波段，但是概率不到50%。然而，他们有时候会赚到大笔的利润，比如在这里。","p":"p1441"}]},{"t":"para","text":"如图24.12所示，中国光电池制造商林洋电力控股（SOLF）日线图上的最佳交易包括：市场回调至K线4且依托均线支撑的高点2回调买入信号：K线5处市场第三次上推浪后的巨型向下反转：K线7两次强势下推浪后出现的低点2的反弹做空机会：K线8的双重底多头旗形：K线9后面以及K线10后面的小型高点2回调买入机会；K线12更高的高点的做空机会：以及K线14两浪上涨的更低的高点做空机会。","pid":"p1435"},{"t":"para","text":"更高的高点反转之后通常会是一个更低的高点做空信号。SOLF从K线5高点开始形成一波很强的下跌运动。K线6之前形成的第二条大型空头趋势K线，在K线3和4前后又出现另外几条空头趋势K线，这些都代表着卖盘压力正在积累，在某个点可能会引起趋势反转。然而，趋势线突破之后，空头未能将空头趋势K线连续在一起，所以总是在场策略的头寸依然是多头。","pid":"p1436"},{"t":"para","text":"截至K线8的抛盘强势突破多头趋势线，但是截止K线9迅猛反弹向上突破K线7（头肩顶的右肩），所以很可能出现坚持到底。在截至K线9的上涨高潮之后，市场形成一条上升通道，至K线12结束。在K线12上方形成一个更高的高点。从K线5开始的强势抛售潮之后，空头打算做空，多头打算获利了结。有些交易者把K线12看作是通道内的第三次上推浪，截至K线9或K线10是第一浪，截至K线10或K线11是第二浪。K线12信号K线是一个十字星，所以有些交易者在等待更多空头力量的出现。","pid":"p1437"},{"t":"para","text":"K线12之后的强空头趋势K线是强卖压的征兆，它带给空头在随后一两根K线积极做空的自信。这一波下跌由三根大阴线组成，突破了多头趋势线。交易者们相信很可能出现更多的卖盘，因为市场已经转为了总是在场策略的空头头寸，所以他们打算在市场反弹时做空。","pid":"p1438"},{"t":"para","text":"市场在K线14形成一个两浪结构的更低的高点，测试K线12的低点，从那一根K线的第一个跳动开始，市场就在下跌。交易者们对市场的下跌很有信心。当市场跌破它前一根K线的低点，成为一条外包的下跌趋势K线时，有些交易者们就开始做空。还有一些交易者在价格向下突破K线13的低点时才做空，预期市场会出现一波向下至少等距的下跌浪。","pid":"p1439"},{"t":"para","text":"截至K线15的下跌高潮也很强，但有些空头被K线18之前的几波迅猛反弹套出，因为这一波反弹略高于K线16的高点，看起来也很强劲。有些交易者在K线15多头趋势K线上方买入，因为它与K线8构成一个双重底多头旗形，还是一个双K线反转，是一个从一根K线之前开始的单K线最终旗形反转。然而，空头在K线18的后一根K线返回市场，制造了一个大阴线。这是一笔很容易被套出的最佳交易，所以我们的重点是要避免被市场套出。不要太早地调紧自己的止损，尝试利用盈亏平衡持有部分头寸，直到市场明显地变为总是在场的策略的多头头寸。截至K线18的反弹并不足以令总是在场头寸翻转，所以波段交易者们应该坚持持有空头。","pid":"p1440"},{"t":"para","text":"从K线5到K线8的抛盘非常强劲，足以令交易者们猜测市场是否正在从一轮多头趋势演变成交易区间。截至K线12的反弹包含很多回调、大阴线，以及带有很长上影线的K线。他们都是卖盘压力的征兆，这表明市场正在向震荡市转变。这看起来更像是震荡区间的一波上涨浪，而不是多头趋势的一波上涨浪。交易者们正开始在波段高点上方卖出，比如在K线10向上超越K线9时，或者在K线11向上超越K线10时。K线12是一个更高的高点（K线5的上方）重要趋势反转的信号K线。但是大部分交易者认为更有可能形成震荡区间和对区间底部K线8的测试，而不是空头趋势，儿乎总是这样（大部分交易区间突破尝试挫败）。虽然在K线15和17之间的区域内有一些获利了结，但K线16和18形成一个双重顶空头旗形，引出对区间的向下突破。很多交易者在K线15区域内部分获利了结，并把他们的保护性止损移至盈亏平衡点，希望出现一个更大的下跌波段，但是概率不到50%。然而，他们有时候会赚到大笔的利润，比如在这里。","pid":"p1441"},{"t":"img","src":"assets/img/p4c4_013.webp","ctx":[{"t":"截至K线15的下跌高潮也很强，但有些空头被K线18之前的几波迅猛反弹套出，因为这一波反弹略高于K线16的高点，看起来也很强劲。有些交易者在K线15多头趋势K线上方买入，因为它与K线8构成一个双重底多头旗形，还是一个双K线反转，是一个从一根K线之前开始的单K线最终旗形反转。然而，空头在K线18的后一根K线返回市场，制造了一个大阴线。这是一笔很容易被套出的最佳交易，所以我们的重点是要避免被市场套出。不要太早地调紧自己的止损，尝试利用盈亏平衡持有部分头寸，直到市场明显地变为总是在场的策略的多头头寸。截至K线18的反弹并不足以令总是在场头寸翻转，所以波段交易者们应该坚持持有空头。","p":"p1440"},{"t":"从K线5到K线8的抛盘非常强劲，足以令交易者们猜测市场是否正在从一轮多头趋势演变成交易区间。截至K线12的反弹包含很多回调、大阴线，以及带有很长上影线的K线。他们都是卖盘压力的征兆，这表明市场正在向震荡市转变。这看起来更像是震荡区间的一波上涨浪，而不是多头趋势的一波上涨浪。交易者们正开始在波段高点上方卖出，比如在K线10向上超越K线9时，或者在K线11向上超越K线10时。K线12是一个更高的高点（K线5的上方）重要趋势反转的信号K线。但是大部分交易者认为更有可能形成震荡区间和对区间底部K线8的测试，而不是空头趋势，儿乎总是这样（大部分交易区间突破尝试挫败）。虽然在K线15和17之间的区域内有一些获利了结，但K线16和18形成一个双重顶空头旗形，引出对区间的向下突破。很多交易者在K线15区域内部分获利了结，并把他们的保护性止损移至盈亏平衡点，希望出现一个更大的下跌波段，但是概率不到50%。然而，他们有时候会赚到大笔的利润，比如在这里。","p":"p1441"},{"t":"如图24.13所示，墨西哥陶瓷生产商Cemex（Cx）这张日线图上的最佳交易包括：K线2最终旗形反转和K线1构成的微型双重顶，在随后空头高潮三根K线的任意一根K线做空；K线4向均线的楔形空头旗形回调，在K线5卖出高潮（挫败的空头突破）和双重底之后的小型多头内含K线上方买入，在K线低点2和微型双重顶下方做空；或者当它跌破前一根K线低点时做空（因为那是一根低点2反弹卖出信号K线），在K线8三重底和多头反转K线买，在均线处K线10双重顶空头旗形（与K线9构成）做空（它也是空头趋势中均线处的一个空头反转K线低点2友弹做空信号）：在K线12微型通道突破失败并向下突破三重底后的突破回调做空信号。在K线14的微型双重底多头旗形以及失败的低点2买入信号，那个失败的低点2形成于很强的K线13多头反转K线和大型的两浪下跌之后（一两浪差不多等距的运动，其中第一浪是从K线2到K线3的上涨高潮，第二浪是从K线9到K线13的空头通道，它包含三浪：K线7是一个较小的空头高潮，也在同一空头通道内），在K线15均线缺口K线下方做空；在K线16更高的低点上方买入：在K线17低点2反弹做空（从K线16开始出现两次上推浪，K线15是一个更大的低点2的第一次上推）和楔形空头旗形做空的信号（K线13后的那根K线是第一次上推）：在K线19更高地点重要趋势反转买入：在K线21高点2买入（K线20后面的多头内含K线构成一个微型双重底部）：以及在均线处的K线25的三角形或者楔形多头旗形买入，其中很多K线拥有阳线实体，这也代表了买盘的力量。","p":"p1442"},{"t":"当出现一个强空头高潮，而且交易者们预期出现更多卖盘时，市场处于总是在场的空头方向，交易者们会寻找做空的机会。CX形成一个很强的空头下跌高潮，到K线3结束。交易者们正预期价格下跌，正准备在反弹做空。在K线4，他们会在向均线的小型两浪结构的反弹处做空。由于交易者会使用限价单在均线处做空，因为这是一个强空头高潮之后第一次向均线反弹。另外一些交易者们会在K线4的下方用限价单做空。K线4跌破了它前面的一根K线，是做空的首次入场，在K线4下方做空的交易者们正选择二次入场。","p":"p1443"},{"t":"K线7处较大的两浪反弹结构是一个低点2做空信号。激进型空头使用限价单在前一根K线高点和K线4上方做空，另外一些则是在那一根K线跌破前一根K线的低点，产生一个二次入场做空信号时做空（K线6是第一个信号）。很多交易者喜欢在强空头趋势K线下方做空，于是在K线7下方做空。因为这么多交易者都希望在那里做空，于是市场在次日向下跳空。","p":"p1444"},{"t":"在K线11之前，市场出现一个强烈的下跌高潮。K线12向上突破下跌的微型通道。空头在K线12下方做空。并预期第一个微型通道突破尝试将以失败告终。","p":"p1445"},{"t":"虽然截至K线17的横向运动向上突破了一条陡的空头趋势线，但是截至K线13的下跌运动远远低于K线8，于是交易者们重新开始寻找底部的过程。他们需要向上突破空头趋势线的另一波反弹，以及对趋势低点的另一次探底测试，然后他们才愿意相信市场正在反转，而不只是在形成另一波空头趋势下的反弹。截至K线17的两条腿的上涨非常强劲，向上大幅突破均线，所以是买盘力量的征兆。交易者们在空头反转K线17下方做空，因为他们把它看作是一波大型两浪结构的反弹的终点，所以是一个低点2反弹做空信号。它也是空头趋势中的一个均线缺口K线做空信号，但那轮趋势仍然需要明确翻转为总是在场策略的多头方向。","p":"p1446"},{"t":"外包十字星K线19不是一条很强的更高的低点买入信号K线，但是有些交易者在它的上方和随后的强多头趋势K线（向上突破一条空头趋势线）上方买入。同时，它也是对K线14的向上突破后做多的多头的忍耐力测试，这里猎杀了这些多头的盈亏平衡止损点。通过让一些原有的不坚定的多头在此止损后，市场重新回到上升趋势，形成一个很好的风险收益比的入场信号。这时入场的头寸，风险的做多就是在入场信号K线的底部，而回报是一轮新多头趋势的幅度，是风险的好多倍。","p":"p1447"},{"t":"截至K线20的多头高潮向上强势突破均线和一条很长周期的空头趋势线。有些交易者把这看作是对一个倾斜的头肩底的颈线的向上突破。大部分交易者认为从K线19到K线20的多头高潮非常强劲。所以价格随后应该上涨。这就意味着他们把市场看作总是在场状态下的多头。他们在K线21的上方（高点2回调买入信号）买入，接着在K线24的上方（高点2回调买入信号）买入。在K线25楔形多头旗形向均线回调时的多头K线上方买入较为安全。","p":"p1448"},{"t":"另外一些交易者认为截至K线23的下跌是一条空头微型通道，但是由于它仍然是在均线上方，而且仍然是在一轮强多头趋势内，所以他们认为它很可能是多头旗形的一个部分。因此，他们更加合理地假定突破会失败，但失败不会走得太远，而是会成为一个突破回调买入信号，而不是预期突破失败后在它下方做空。记住，当一条空头微型通道的失败突破再次失败时。它就会成为一个突破后回调买入的机会。K线24是突破后的回调，但是它有一个空头实体，所以大部分交易者不会在它的高点上方买入。然而，回调浪成为一波截至K线25的两浪回调结构。那也是一个双重底多头旗形","p":"p1449"}]},{"t":"para","text":"如图24.13所示，墨西哥陶瓷生产商Cemex（Cx）这张日线图上的最佳交易包括：K线2最终旗形反转和K线1构成的微型双重顶，在随后空头高潮三根K线的任意一根K线做空；K线4向均线的楔形空头旗形回调，在K线5卖出高潮（挫败的空头突破）和双重底之后的小型多头内含K线上方买入，在K线低点2和微型双重顶下方做空；或者当它跌破前一根K线低点时做空（因为那是一根低点2反弹卖出信号K线），在K线8三重底和多头反转K线买，在均线处K线10双重顶空头旗形（与K线9构成）做空（它也是空头趋势中均线处的一个空头反转K线低点2友弹做空信号）：在K线12微型通道突破失败并向下突破三重底后的突破回调做空信号。在K线14的微型双重底多头旗形以及失败的低点2买入信号，那个失败的低点2形成于很强的K线13多头反转K线和大型的两浪下跌之后（一两浪差不多等距的运动，其中第一浪是从K线2到K线3的上涨高潮，第二浪是从K线9到K线13的空头通道，它包含三浪：K线7是一个较小的空头高潮，也在同一空头通道内），在K线15均线缺口K线下方做空；在K线16更高的低点上方买入：在K线17低点2反弹做空（从K线16开始出现两次上推浪，K线15是一个更大的低点2的第一次上推）和楔形空头旗形做空的信号（K线13后的那根K线是第一次上推）：在K线19更高地点重要趋势反转买入：在K线21高点2买入（K线20后面的多头内含K线构成一个微型双重底部）：以及在均线处的K线25的三角形或者楔形多头旗形买入，其中很多K线拥有阳线实体，这也代表了买盘的力量。","pid":"p1442"},{"t":"para","text":"当出现一个强空头高潮，而且交易者们预期出现更多卖盘时，市场处于总是在场的空头方向，交易者们会寻找做空的机会。CX形成一个很强的空头下跌高潮，到K线3结束。交易者们正预期价格下跌，正准备在反弹做空。在K线4，他们会在向均线的小型两浪结构的反弹处做空。由于交易者会使用限价单在均线处做空，因为这是一个强空头高潮之后第一次向均线反弹。另外一些交易者们会在K线4的下方用限价单做空。K线4跌破了它前面的一根K线，是做空的首次入场，在K线4下方做空的交易者们正选择二次入场。","pid":"p1443"},{"t":"para","text":"K线7处较大的两浪反弹结构是一个低点2做空信号。激进型空头使用限价单在前一根K线高点和K线4上方做空，另外一些则是在那一根K线跌破前一根K线的低点，产生一个二次入场做空信号时做空（K线6是第一个信号）。很多交易者喜欢在强空头趋势K线下方做空，于是在K线7下方做空。因为这么多交易者都希望在那里做空，于是市场在次日向下跳空。","pid":"p1444"},{"t":"para","text":"在K线11之前，市场出现一个强烈的下跌高潮。K线12向上突破下跌的微型通道。空头在K线12下方做空。并预期第一个微型通道突破尝试将以失败告终。","pid":"p1445"},{"t":"para","text":"虽然截至K线17的横向运动向上突破了一条陡的空头趋势线，但是截至K线13的下跌运动远远低于K线8，于是交易者们重新开始寻找底部的过程。他们需要向上突破空头趋势线的另一波反弹，以及对趋势低点的另一次探底测试，然后他们才愿意相信市场正在反转，而不只是在形成另一波空头趋势下的反弹。截至K线17的两条腿的上涨非常强劲，向上大幅突破均线，所以是买盘力量的征兆。交易者们在空头反转K线17下方做空，因为他们把它看作是一波大型两浪结构的反弹的终点，所以是一个低点2反弹做空信号。它也是空头趋势中的一个均线缺口K线做空信号，但那轮趋势仍然需要明确翻转为总是在场策略的多头方向。","pid":"p1446"},{"t":"para","text":"外包十字星K线19不是一条很强的更高的低点买入信号K线，但是有些交易者在它的上方和随后的强多头趋势K线（向上突破一条空头趋势线）上方买入。同时，它也是对K线14的向上突破后做多的多头的忍耐力测试，这里猎杀了这些多头的盈亏平衡止损点。通过让一些原有的不坚定的多头在此止损后，市场重新回到上升趋势，形成一个很好的风险收益比的入场信号。这时入场的头寸，风险的做多就是在入场信号K线的底部，而回报是一轮新多头趋势的幅度，是风险的好多倍。","pid":"p1447"},{"t":"para","text":"截至K线20的多头高潮向上强势突破均线和一条很长周期的空头趋势线。有些交易者把这看作是对一个倾斜的头肩底的颈线的向上突破。大部分交易者认为从K线19到K线20的多头高潮非常强劲。所以价格随后应该上涨。这就意味着他们把市场看作总是在场状态下的多头。他们在K线21的上方（高点2回调买入信号）买入，接着在K线24的上方（高点2回调买入信号）买入。在K线25楔形多头旗形向均线回调时的多头K线上方买入较为安全。","pid":"p1448"},{"t":"para","text":"另外一些交易者认为截至K线23的下跌是一条空头微型通道，但是由于它仍然是在均线上方，而且仍然是在一轮强多头趋势内，所以他们认为它很可能是多头旗形的一个部分。因此，他们更加合理地假定突破会失败，但失败不会走得太远，而是会成为一个突破回调买入信号，而不是预期突破失败后在它下方做空。记住，当一条空头微型通道的失败突破再次失败时。它就会成为一个突破后回调买入的机会。K线24是突破后的回调，但是它有一个空头实体，所以大部分交易者不会在它的高点上方买入。然而，回调浪成为一波截至K线25的两浪回调结构。那也是一个双重底多头旗形","pid":"p1449"},{"t":"img","src":"assets/img/p4c4_014.webp","ctx":[{"t":"截至K线20的多头高潮向上强势突破均线和一条很长周期的空头趋势线。有些交易者把这看作是对一个倾斜的头肩底的颈线的向上突破。大部分交易者认为从K线19到K线20的多头高潮非常强劲。所以价格随后应该上涨。这就意味着他们把市场看作总是在场状态下的多头。他们在K线21的上方（高点2回调买入信号）买入，接着在K线24的上方（高点2回调买入信号）买入。在K线25楔形多头旗形向均线回调时的多头K线上方买入较为安全。","p":"p1448"},{"t":"另外一些交易者认为截至K线23的下跌是一条空头微型通道，但是由于它仍然是在均线上方，而且仍然是在一轮强多头趋势内，所以他们认为它很可能是多头旗形的一个部分。因此，他们更加合理地假定突破会失败，但失败不会走得太远，而是会成为一个突破回调买入信号，而不是预期突破失败后在它下方做空。记住，当一条空头微型通道的失败突破再次失败时。它就会成为一个突破后回调买入的机会。K线24是突破后的回调，但是它有一个空头实体，所以大部分交易者不会在它的高点上方买入。然而，回调浪成为一波截至K线25的两浪回调结构。那也是一个双重底多头旗形","p":"p1449"},{"t":"如图24.14所示，谷歌的这张5分钟图上的最佳交易信号包括：K线2和K线3向均线的低点2反弹做空信号：K线4最终旗形和楔形底部反转买入信号：在K线7均线缺口K线、低点2和双重顶做空信号：在K线9重要趋势反转更低的低点买入信号：在K线10更高低点和止损猎杀突破测试买入信号。","p":"p1450"},{"t":"当向上强势突破空头趋势线时，交易者们会准备在对空头低点测试时买入。前提是测试不会跌得太低。GOOG形成一波截至K线7的强势反弹，它由尾线短小的多头趋势K线构成。它向上突破了空头趋势线和均线，从K线1开始的空头高潮之后的下跌运动中出现若干强多头趋势K线。那些尾线短小的多头趋势K线表明多头正心甘情愿地买入。这种买盘正在积累，在某个点处，可能耗尽空头的力量，于是多头可以控制市场。","p":"p1451"},{"t":"激进型的交易者会使用限价单在K线5后面的空头K线高点做空形成三条连续的重叠K线，使很多多头都被迫在这段交易区间的顶部买入。考虑到那刚好是在空头趋势日中均线的下方，所以在这里买入是一个特别糟糕的主意。由于在这里买入很可能会失败，所以敏锐的交易者们会在弱势多头买入的位置做空。","p":"p1452"},{"t":"从K线7开始的抛盘包含很多重叠K线和几条多头K线，那表明存在双向交易的力量。空头并未完全控制市场。因为市场一跌破K线4的低点，就会有很多买盘在K线8入场。他们未能令市场反转，市场再次跌破那个低点。K线8是第一次向上突破从K线7开始的空头通道，所以很可能失败。然而，在K线9第二次尝试令趋势反转时，多头却能控制接下来的三根K线。K线9是K线8向上突破微型空头通道后的突破后的回调，其中空头通道就是多头旗形。","p":"p1453"},{"t":"当空头尝试将从K线9开始的反弹变成一个三根K线组合的空头旗形时，多头在K线10的更高的低点处将他们战胜。K线10在预期出现K线9做多信号的信号K线上方8美分（对于一只500美元的股票8美分是微乎其微的）向上回转，这使得交易者们可以在它的高点上方加仓。它还把多头套出，现在他们将追着市场上涨。多头认为K线9很可能引出至少两条上涨浪，所以在接下来的几根K线中，他们设置限价单在前一根K线的低点或者其下方买入。他们预期任何低点1做空信号失败，并成为一个更高的低点。他们的买入限价单将在K线10被执行。他们的保护性止损将位于K线9低点下方。","p":"p1454"},{"t":"空头在当天早些时候就拥有不错的做空机会。市场向下跳空，在略低于均线处的K线1处形成一个低点2反弹做空信号。在K线1后面两条大阴线里，激进型空头会在他们的收盘价以及低点下方1个跳动处做空。","p":"p1455"},{"t":"下跌高潮非常强劲，很可能出现一波到底的卖出，而且极有可能是以空头通道形式。当天或许成为一个高潮和通道空头趋势日。空头打算在反弹卖出，那将是在正在形成的空头通道的顶部。K线2是均线处的一个低点2反弹做空信号，它是对当天第一根K线被向下突破的测试。","p":"p1456"},{"t":"K线3是均线处的一个低点2做空信号，尽管这个空头旗形包含很多强势的多头趋势K线。","p":"p1457"},{"t":"K线4是从空头通道内一个双K线最终空头旗形和第三次下推开始的向上反转，它常常至少引起两浪结构的反转。最低限度，这个楔形底部很可能表现得像一个空头台阶形态，测试前一次下推的低点（从K线2开始的抛盘底部的波段低点）。它也是第二次尝试向上反转，第一次是在一根K线之前。虽然十字星信号K线不理想，但是下跌过程包含很多多头趋势K线，所以并不需要非常多的力量便可令市场向上反转。空头趋势并不都是那样强劲，其中包含大量双向交易。","p":"p1458"},{"t":"在一轮空头趋势中的低点买入时，通常最好是至少有部分头寸做短线刮头皮交易，以便在反弹测试均线时部分离场，那也刚好位于前一波段低点上方。然后，他们可以把自己的保护性止损移至盈亏平衡点。一旦市场跌破从K线5开始的两条空头趋势K线，大部分交易者就会离场，但是有些交易者会坚持把止损设在K线4空头低点下方。因为截至K线5的反弹只不过是条刚刚向上突破趋势线，所以这仍然不是一个很强的底部。因此，市场仍然总是在场内的空头。对于多头来说，保持谨慎并提早离场是明智的做法。","p":"p1459"},{"t":"K线7是一个可以接受的均线缺口做空信号，它与K线3形成一个双重顶空头旗形，这是空头趋势中的两条腿的上涨。但是，在一条多头趋势K线下方做空是比较冒险的，特别是在一个三根K线多头高潮之后。较好的做法是准备在对空头低点的更高低点或更低低点测试时买入。","p":"p1460"}]},{"t":"para","text":"如图24.14所示，谷歌的这张5分钟图上的最佳交易信号包括：K线2和K线3向均线的低点2反弹做空信号：K线4最终旗形和楔形底部反转买入信号：在K线7均线缺口K线、低点2和双重顶做空信号：在K线9重要趋势反转更低的低点买入信号：在K线10更高低点和止损猎杀突破测试买入信号。","pid":"p1450"},{"t":"para","text":"当向上强势突破空头趋势线时，交易者们会准备在对空头低点测试时买入。前提是测试不会跌得太低。GOOG形成一波截至K线7的强势反弹，它由尾线短小的多头趋势K线构成。它向上突破了空头趋势线和均线，从K线1开始的空头高潮之后的下跌运动中出现若干强多头趋势K线。那些尾线短小的多头趋势K线表明多头正心甘情愿地买入。这种买盘正在积累，在某个点处，可能耗尽空头的力量，于是多头可以控制市场。","pid":"p1451"},{"t":"para","text":"激进型的交易者会使用限价单在K线5后面的空头K线高点做空形成三条连续的重叠K线，使很多多头都被迫在这段交易区间的顶部买入。考虑到那刚好是在空头趋势日中均线的下方，所以在这里买入是一个特别糟糕的主意。由于在这里买入很可能会失败，所以敏锐的交易者们会在弱势多头买入的位置做空。","pid":"p1452"},{"t":"para","text":"从K线7开始的抛盘包含很多重叠K线和几条多头K线，那表明存在双向交易的力量。空头并未完全控制市场。因为市场一跌破K线4的低点，就会有很多买盘在K线8入场。他们未能令市场反转，市场再次跌破那个低点。K线8是第一次向上突破从K线7开始的空头通道，所以很可能失败。然而，在K线9第二次尝试令趋势反转时，多头却能控制接下来的三根K线。K线9是K线8向上突破微型空头通道后的突破后的回调，其中空头通道就是多头旗形。","pid":"p1453"},{"t":"para","text":"当空头尝试将从K线9开始的反弹变成一个三根K线组合的空头旗形时，多头在K线10的更高的低点处将他们战胜。K线10在预期出现K线9做多信号的信号K线上方8美分（对于一只500美元的股票8美分是微乎其微的）向上回转，这使得交易者们可以在它的高点上方加仓。它还把多头套出，现在他们将追着市场上涨。多头认为K线9很可能引出至少两条上涨浪，所以在接下来的几根K线中，他们设置限价单在前一根K线的低点或者其下方买入。他们预期任何低点1做空信号失败，并成为一个更高的低点。他们的买入限价单将在K线10被执行。他们的保护性止损将位于K线9低点下方。","pid":"p1454"},{"t":"para","text":"空头在当天早些时候就拥有不错的做空机会。市场向下跳空，在略低于均线处的K线1处形成一个低点2反弹做空信号。在K线1后面两条大阴线里，激进型空头会在他们的收盘价以及低点下方1个跳动处做空。","pid":"p1455"},{"t":"para","text":"下跌高潮非常强劲，很可能出现一波到底的卖出，而且极有可能是以空头通道形式。当天或许成为一个高潮和通道空头趋势日。空头打算在反弹卖出，那将是在正在形成的空头通道的顶部。K线2是均线处的一个低点2反弹做空信号，它是对当天第一根K线被向下突破的测试。","pid":"p1456"},{"t":"para","text":"K线3是均线处的一个低点2做空信号，尽管这个空头旗形包含很多强势的多头趋势K线。","pid":"p1457"},{"t":"para","text":"K线4是从空头通道内一个双K线最终空头旗形和第三次下推开始的向上反转，它常常至少引起两浪结构的反转。最低限度，这个楔形底部很可能表现得像一个空头台阶形态，测试前一次下推的低点（从K线2开始的抛盘底部的波段低点）。它也是第二次尝试向上反转，第一次是在一根K线之前。虽然十字星信号K线不理想，但是下跌过程包含很多多头趋势K线，所以并不需要非常多的力量便可令市场向上反转。空头趋势并不都是那样强劲，其中包含大量双向交易。","pid":"p1458"},{"t":"para","text":"在一轮空头趋势中的低点买入时，通常最好是至少有部分头寸做短线刮头皮交易，以便在反弹测试均线时部分离场，那也刚好位于前一波段低点上方。然后，他们可以把自己的保护性止损移至盈亏平衡点。一旦市场跌破从K线5开始的两条空头趋势K线，大部分交易者就会离场，但是有些交易者会坚持把止损设在K线4空头低点下方。因为截至K线5的反弹只不过是条刚刚向上突破趋势线，所以这仍然不是一个很强的底部。因此，市场仍然总是在场内的空头。对于多头来说，保持谨慎并提早离场是明智的做法。","pid":"p1459"},{"t":"para","text":"K线7是一个可以接受的均线缺口做空信号，它与K线3形成一个双重顶空头旗形，这是空头趋势中的两条腿的上涨。但是，在一条多头趋势K线下方做空是比较冒险的，特别是在一个三根K线多头高潮之后。较好的做法是准备在对空头低点的更高低点或更低低点测试时买入。","pid":"p1460"},{"t":"img","src":"assets/img/p4c4_015.webp","ctx":[{"t":"在一轮空头趋势中的低点买入时，通常最好是至少有部分头寸做短线刮头皮交易，以便在反弹测试均线时部分离场，那也刚好位于前一波段低点上方。然后，他们可以把自己的保护性止损移至盈亏平衡点。一旦市场跌破从K线5开始的两条空头趋势K线，大部分交易者就会离场，但是有些交易者会坚持把止损设在K线4空头低点下方。因为截至K线5的反弹只不过是条刚刚向上突破趋势线，所以这仍然不是一个很强的底部。因此，市场仍然总是在场内的空头。对于多头来说，保持谨慎并提早离场是明智的做法。","p":"p1459"},{"t":"K线7是一个可以接受的均线缺口做空信号，它与K线3形成一个双重顶空头旗形，这是空头趋势中的两条腿的上涨。但是，在一条多头趋势K线下方做空是比较冒险的，特别是在一个三根K线多头高潮之后。较好的做法是准备在对空头低点的更高低点或更低低点测试时买入。","p":"p1460"},{"t":"如图24.15所示，苹果（AAPL）的这张5分钟K线图上的最佳交易是截至K线3的空头高潮之后K线4更低的高点重要趋势反转和突破测试。在从K线1开始的多头高潮中，激进型交易者会在任意多头趋势K线期间买入，但是，由于他们的保护性止损会更远，所以交易者们需要交易较小的头寸。","p":"p1461"},{"t":"一旦市场跌破一个高潮和通道顶部形成的一条陡峭通道，那么交易者们常常准备在更低的高点做空。截至K线3的下跌拥有很强的动能，它向下大幅突破多头趋势线。交易者们猜测总是在场内头寸已经向空头翻转，正在寻找更低高点卖出信号。截至K线4的两浪结构更低高点反弹，是对K线2双K线向下突破点位的测试，它是一个低风险卖出信号，预期至少形成第二浪下跌，且趋势可能反转。","p":"p1462"}]},{"t":"para","text":"如图24.15所示，苹果（AAPL）的这张5分钟K线图上的最佳交易是截至K线3的空头高潮之后K线4更低的高点重要趋势反转和突破测试。在从K线1开始的多头高潮中，激进型交易者会在任意多头趋势K线期间买入，但是，由于他们的保护性止损会更远，所以交易者们需要交易较小的头寸。","pid":"p1461"},{"t":"para","text":"一旦市场跌破一个高潮和通道顶部形成的一条陡峭通道，那么交易者们常常准备在更低的高点做空。截至K线3的下跌拥有很强的动能，它向下大幅突破多头趋势线。交易者们猜测总是在场内头寸已经向空头翻转，正在寻找更低高点卖出信号。截至K线4的两浪结构更低高点反弹，是对K线2双K线向下突破点位的测试，它是一个低风险卖出信号，预期至少形成第二浪下跌，且趋势可能反转。","pid":"p1462"},{"t":"img","src":"assets/img/p4c4_016.webp","ctx":[{"t":"如图24.15所示，苹果（AAPL）的这张5分钟K线图上的最佳交易是截至K线3的空头高潮之后K线4更低的高点重要趋势反转和突破测试。在从K线1开始的多头高潮中，激进型交易者会在任意多头趋势K线期间买入，但是，由于他们的保护性止损会更远，所以交易者们需要交易较小的头寸。","p":"p1461"},{"t":"一旦市场跌破一个高潮和通道顶部形成的一条陡峭通道，那么交易者们常常准备在更低的高点做空。截至K线3的下跌拥有很强的动能，它向下大幅突破多头趋势线。交易者们猜测总是在场内头寸已经向空头翻转，正在寻找更低高点卖出信号。截至K线4的两浪结构更低高点反弹，是对K线2双K线向下突破点位的测试，它是一个低风险卖出信号，预期至少形成第二浪下跌，且趋势可能反转。","p":"p1462"},{"t":"如图24.16所示，亚马逊（AMZN）这张日线图上的最佳交易架构是K线10两浪结构更低高点重要趋势反转，还有其他几个特点支持它成为最佳交易，在后面几段中有描述。另外几个不错的交易信号包括：K线2处的楔形多头旗形、均线缺口K线、双重底多头旗形，以及K线3最终旗形和形顶。有些交易者认为第一次上推是K线2抛盘前多头趋势的高点。另外一些交易者则把它看作是第二次上推，把6月高点看作是第一次上推。","p":"p1463"},{"t":"在一条多头趋势线被强势向下突破之后，交易者们将准备在更低的高点做空。AMZN日线图上形成一波两浪结构的回调，在K线10处形成一个更低的高点。有些交易者们认为它与K线3或K线4高点构成一个双重顶，当然与K线6的高点也构成一个双重顶。它与K线6形成一个双重顶空头旗形，所以是一根二次入场做空信号。K线6是第一个入场信号，但在K线6之前的上涨包含了太多多头动能，所以很可能不是空头趋势的起点。另外一些交易者认为K线4只是一个例外，把截至K线10的上涨看作是一种形式的大型楔形顶，其中K线2前面的高点是第一推，K线3是第二推，K线10是第三推","p":"p1464"},{"t":"K线7突破了一条较小的多头趋势线。表现出更多的看空力量，然后在截至K线10的反弹中再次测试K线3和4的高点。","p":"p1465"},{"t":"K线10是K线7开始的迅猛反弹之后的三次上推，交易者们总是必须把它看作是一种形式的楔形反转形态。这是交易者们希望找到的一个不错的二次入场做空机会。重要趋势突破（截至K线5）之后，出现测试趋势高点（K线4）的两浪反弹结构中一个由小形构成的双重顶空头旗形，当交易者们在寻找一个信号可以以有限的风险做空时，所有类型的信号在同一时间出现了。","p":"p1466"}]},{"t":"para","text":"如图24.16所示，亚马逊（AMZN）这张日线图上的最佳交易架构是K线10两浪结构更低高点重要趋势反转，还有其他几个特点支持它成为最佳交易，在后面几段中有描述。另外几个不错的交易信号包括：K线2处的楔形多头旗形、均线缺口K线、双重底多头旗形，以及K线3最终旗形和形顶。有些交易者认为第一次上推是K线2抛盘前多头趋势的高点。另外一些交易者则把它看作是第二次上推，把6月高点看作是第一次上推。","pid":"p1463"},{"t":"para","text":"在一条多头趋势线被强势向下突破之后，交易者们将准备在更低的高点做空。AMZN日线图上形成一波两浪结构的回调，在K线10处形成一个更低的高点。有些交易者们认为它与K线3或K线4高点构成一个双重顶，当然与K线6的高点也构成一个双重顶。它与K线6形成一个双重顶空头旗形，所以是一根二次入场做空信号。K线6是第一个入场信号，但在K线6之前的上涨包含了太多多头动能，所以很可能不是空头趋势的起点。另外一些交易者认为K线4只是一个例外，把截至K线10的上涨看作是一种形式的大型楔形顶，其中K线2前面的高点是第一推，K线3是第二推，K线10是第三推","pid":"p1464"},{"t":"para","text":"K线7突破了一条较小的多头趋势线。表现出更多的看空力量，然后在截至K线10的反弹中再次测试K线3和4的高点。","pid":"p1465"},{"t":"para","text":"K线10是K线7开始的迅猛反弹之后的三次上推，交易者们总是必须把它看作是一种形式的楔形反转形态。这是交易者们希望找到的一个不错的二次入场做空机会。重要趋势突破（截至K线5）之后，出现测试趋势高点（K线4）的两浪反弹结构中一个由小形构成的双重顶空头旗形，当交易者们在寻找一个信号可以以有限的风险做空时，所有类型的信号在同一时间出现了。","pid":"p1466"},{"t":"img","src":"assets/img/p4c4_017.webp","ctx":[{"t":"K线7突破了一条较小的多头趋势线。表现出更多的看空力量，然后在截至K线10的反弹中再次测试K线3和4的高点。","p":"p1465"},{"t":"K线10是K线7开始的迅猛反弹之后的三次上推，交易者们总是必须把它看作是一种形式的楔形反转形态。这是交易者们希望找到的一个不错的二次入场做空机会。重要趋势突破（截至K线5）之后，出现测试趋势高点（K线4）的两浪反弹结构中一个由小形构成的双重顶空头旗形，当交易者们在寻找一个信号可以以有限的风险做空时，所有类型的信号在同一时间出现了。","p":"p1466"},{"t":"如图24.17所示，高盛集团（GS）在这张日线图上的最佳交易包括：K线3更高的高点的重要趋势反转和楔形顶；K线4卖出高潮之后更高的低点和小型双重底多头旗形：K线7更高的高点（高于K线5和3）、最终旗形，以及扩张三角形顶（它是一个小型扩张三角形的第一次入场，其中K线5前面的暂停是第一推，K线5是第二推）；K线8的更低的高点：K线9后面的低点2和楔形空头旗形：均线附近的K线10低点2反弹做空机会：K线11岛形底和扩张三角形多头旗形（K线2是第一次下推，K线4是第二次，记住，扩张三角形多头旗形常常跟在扩张三角形之后）。","p":"p1467"},{"t":"虽然一波强势反弹可能是一轮多头趋势的一部分，但它也可能只是对震荡区间顶部的一次冲击测试。是由卖出真空现象产生的反弹。空头预期市场向上超过K线3的高点，所以他们会等待市场到达那里后才会去做空。在从K线4开始的上涨过程中，他们一直是看跌的，但是在市场按他们的预期向上突破K线3的高点之前，做空是不合理的。如果他们认为市场将会涨得更高，那么在到达他们认为不会大幅上涨的价位（那将是一个新的高点）之前就做空是愚蠢的。当K线3之前的反弹浪向上超越K线1的高点时。他们看到市场下跌，他们预期这次也发生相同的现象。由于这是第三次上推，所以他们可能会在延长的抛盘起点做空，抛盘应该至少包含两条腿。由于那是一个扩张三角形顶（K线1、2、3、4和7），所以一个合理的目标是运动至K线4下方，在那里、市场可能形成一个扩张三角形的多头旗形。","p":"p1468"},{"t":"K线11是扩张三角形多头旗形中的一个入场做多信号。虽然这是一个合理的交易架构，但它不如这一章所讲的其他反转强。","p":"p1469"}]},{"t":"para","text":"如图24.17所示，高盛集团（GS）在这张日线图上的最佳交易包括：K线3更高的高点的重要趋势反转和楔形顶；K线4卖出高潮之后更高的低点和小型双重底多头旗形：K线7更高的高点（高于K线5和3）、最终旗形，以及扩张三角形顶（它是一个小型扩张三角形的第一次入场，其中K线5前面的暂停是第一推，K线5是第二推）；K线8的更低的高点：K线9后面的低点2和楔形空头旗形：均线附近的K线10低点2反弹做空机会：K线11岛形底和扩张三角形多头旗形（K线2是第一次下推，K线4是第二次，记住，扩张三角形多头旗形常常跟在扩张三角形之后）。","pid":"p1467"},{"t":"para","text":"虽然一波强势反弹可能是一轮多头趋势的一部分，但它也可能只是对震荡区间顶部的一次冲击测试。是由卖出真空现象产生的反弹。空头预期市场向上超过K线3的高点，所以他们会等待市场到达那里后才会去做空。在从K线4开始的上涨过程中，他们一直是看跌的，但是在市场按他们的预期向上突破K线3的高点之前，做空是不合理的。如果他们认为市场将会涨得更高，那么在到达他们认为不会大幅上涨的价位（那将是一个新的高点）之前就做空是愚蠢的。当K线3之前的反弹浪向上超越K线1的高点时。他们看到市场下跌，他们预期这次也发生相同的现象。由于这是第三次上推，所以他们可能会在延长的抛盘起点做空，抛盘应该至少包含两条腿。由于那是一个扩张三角形顶（K线1、2、3、4和7），所以一个合理的目标是运动至K线4下方，在那里、市场可能形成一个扩张三角形的多头旗形。","pid":"p1468"},{"t":"para","text":"K线11是扩张三角形多头旗形中的一个入场做多信号。虽然这是一个合理的交易架构，但它不如这一章所讲的其他反转强。","pid":"p1469"},{"t":"img","src":"assets/img/p4c4_018.webp","ctx":[{"t":"虽然一波强势反弹可能是一轮多头趋势的一部分，但它也可能只是对震荡区间顶部的一次冲击测试。是由卖出真空现象产生的反弹。空头预期市场向上超过K线3的高点，所以他们会等待市场到达那里后才会去做空。在从K线4开始的上涨过程中，他们一直是看跌的，但是在市场按他们的预期向上突破K线3的高点之前，做空是不合理的。如果他们认为市场将会涨得更高，那么在到达他们认为不会大幅上涨的价位（那将是一个新的高点）之前就做空是愚蠢的。当K线3之前的反弹浪向上超越K线1的高点时。他们看到市场下跌，他们预期这次也发生相同的现象。由于这是第三次上推，所以他们可能会在延长的抛盘起点做空，抛盘应该至少包含两条腿。由于那是一个扩张三角形顶（K线1、2、3、4和7），所以一个合理的目标是运动至K线4下方，在那里、市场可能形成一个扩张三角形的多头旗形。","p":"p1468"},{"t":"K线11是扩张三角形多头旗形中的一个入场做多信号。虽然这是一个合理的交易架构，但它不如这一章所讲的其他反转强。","p":"p1469"},{"t":"如图24.18所示，微软（MSFT）这张5分钟图上的最佳交易包括：K线3形空头旗形K线4更低的低点重要趋势反转和小型楔形底部：K线5小型和大型的低点2反弹做空信号：K线6更高的低点重要趋势反转、楔形多头旗形，以及双重底多头旗形：K线9两浪结构更高的高点重要趋势反转、小型高潮和通道顶部做空机会，以及楔形空头旗形（K线3、7和9）。","p":"p1470"},{"t":"虽然截至K线3的反弹向上大幅突破空头趋势线，但是K线4的抛盘又大幅跌破K线2，所以交易者们在认为趋势反转可能进行之前需要一个更高的低点。K线6是一个更高低点和一个双K线反转，这提醒交易者们在次日第一根K线向上超越双K线反转时买入。","p":"p1471"},{"t":"截至K线8的下跌运动向上突破多头趋势线后，截至K线9的反弹是一个两浪结构的更高的高点。它也是从K线4低点开始的第三次上推，K线5和K线7是头两次上推。有些交易者把那波反弹看作是一个大的楔形空头旗形，其中K线3是第一推的结束，K线7是第二推的结束。","p":"p1472"}]},{"t":"para","text":"如图24.18所示，微软（MSFT）这张5分钟图上的最佳交易包括：K线3形空头旗形K线4更低的低点重要趋势反转和小型楔形底部：K线5小型和大型的低点2反弹做空信号：K线6更高的低点重要趋势反转、楔形多头旗形，以及双重底多头旗形：K线9两浪结构更高的高点重要趋势反转、小型高潮和通道顶部做空机会，以及楔形空头旗形（K线3、7和9）。","pid":"p1470"},{"t":"para","text":"虽然截至K线3的反弹向上大幅突破空头趋势线，但是K线4的抛盘又大幅跌破K线2，所以交易者们在认为趋势反转可能进行之前需要一个更高的低点。K线6是一个更高低点和一个双K线反转，这提醒交易者们在次日第一根K线向上超越双K线反转时买入。","pid":"p1471"},{"t":"para","text":"截至K线8的下跌运动向上突破多头趋势线后，截至K线9的反弹是一个两浪结构的更高的高点。它也是从K线4低点开始的第三次上推，K线5和K线7是头两次上推。有些交易者把那波反弹看作是一个大的楔形空头旗形，其中K线3是第一推的结束，K线7是第二推的结束。","pid":"p1472"},{"t":"img","src":"assets/img/p4c4_019.webp","ctx":[{"t":"虽然截至K线3的反弹向上大幅突破空头趋势线，但是K线4的抛盘又大幅跌破K线2，所以交易者们在认为趋势反转可能进行之前需要一个更高的低点。K线6是一个更高低点和一个双K线反转，这提醒交易者们在次日第一根K线向上超越双K线反转时买入。","p":"p1471"},{"t":"截至K线8的下跌运动向上突破多头趋势线后，截至K线9的反弹是一个两浪结构的更高的高点。它也是从K线4低点开始的第三次上推，K线5和K线7是头两次上推。有些交易者把那波反弹看作是一个大的楔形空头旗形，其中K线3是第一推的结束，K线7是第二推的结束。","p":"p1472"},{"t":"如图24.19所示，Oracle（ORCL）的这张5分钟图上的最佳交易包括：K线1更低的低点的重要趋势反转（离开前一低点的反弹向上突破一条陡峭的空头趋势线），K线4两浪结构更高的高点重要趋势反转和小型楔形顶","p":"p1473"},{"t":"向震荡区间顶部的迅猛反弹通常是由真空效应引起的，而不是新的趋势。市场具有惯性，当它在交易区间内时，大部分突破尝试失败。空头与其市场会测试Oracle过去一两天在5分钟K线图上形成的交易区间的顶部，所以在市场达到那一区域之前，没有理由做空。这使得市场在截至K线2的反弹过程中成为单向市场，但是一旦市场到达交易区间顶部，空头便突然出现做空。现在他们预期市场在没有回调的情况下不会大幅上涨，于是他们积极做空。截至K线4的三次上推是一个在双K线反转下方做空的极好架构。","p":"p1474"}]},{"t":"para","text":"如图24.19所示，Oracle（ORCL）的这张5分钟图上的最佳交易包括：K线1更低的低点的重要趋势反转（离开前一低点的反弹向上突破一条陡峭的空头趋势线），K线4两浪结构更高的高点重要趋势反转和小型楔形顶","pid":"p1473"},{"t":"para","text":"向震荡区间顶部的迅猛反弹通常是由真空效应引起的，而不是新的趋势。市场具有惯性，当它在交易区间内时，大部分突破尝试失败。空头与其市场会测试Oracle过去一两天在5分钟K线图上形成的交易区间的顶部，所以在市场达到那一区域之前，没有理由做空。这使得市场在截至K线2的反弹过程中成为单向市场，但是一旦市场到达交易区间顶部，空头便突然出现做空。现在他们预期市场在没有回调的情况下不会大幅上涨，于是他们积极做空。截至K线4的三次上推是一个在双K线反转下方做空的极好架构。","pid":"p1474"},{"t":"img","src":"assets/img/p4c4_020.webp","ctx":[{"t":"如图24.19所示，Oracle（ORCL）的这张5分钟图上的最佳交易包括：K线1更低的低点的重要趋势反转（离开前一低点的反弹向上突破一条陡峭的空头趋势线），K线4两浪结构更高的高点重要趋势反转和小型楔形顶","p":"p1473"},{"t":"向震荡区间顶部的迅猛反弹通常是由真空效应引起的，而不是新的趋势。市场具有惯性，当它在交易区间内时，大部分突破尝试失败。空头与其市场会测试Oracle过去一两天在5分钟K线图上形成的交易区间的顶部，所以在市场达到那一区域之前，没有理由做空。这使得市场在截至K线2的反弹过程中成为单向市场，但是一旦市场到达交易区间顶部，空头便突然出现做空。现在他们预期市场在没有回调的情况下不会大幅上涨，于是他们积极做空。截至K线4的三次上推是一个在双K线反转下方做空的极好架构。","p":"p1474"},{"t":"图24.20中，右侧5分钟电子迷你图表上的最佳交易信号包括：K线6开盘反转：K线7最终旗形顶和楔形顶（K线6前一根K线高点是第一波上涨浪，尽管它是一根阴线）：K线8楔形多头旗形和更高的低点；K线9向上突破微型空头通道后K线10是突破后的回调买入机会；K线11低点2反弹做空和双重顶（与跌至K线8的楔形的顶部构成）做空机会；K线12的大型两浪结构（K线10第一次下推浪）的更高的低点重要趋势反转（K线12是从跌至K线10的小空头趋势，并从K线6的大空头趋势开始的向上反转）：K线14更高的低点重要趋势反转和二次入场突破回调买进信号（它也是一个头肩底的右肩。其中K线10是左肩）。","p":"p1475"},{"t":"虽然大部分学术专家和电视权威辩称大盘中的所有运动都是以谷歌的总和基本面为基础的，但政治事件常常会引起巨幅波动。一个明显的例子是共和党在1994年接管国会时引发的不可思议的多头趋势，它常常被称为克林顿超级多头市场。2008年的崩盘是另一个例子。这轮空头趋势和恐慌抛盘是由次贷问题引起的，还是国家认识到奥巴马即将人住白宫的直接结果？虽然你必须根据图表显示的来进行交易。但无论你的政治倾向是什么，试着去理解政治会如何影响市场是非常有意思的。","p":"p1476"},{"t":"如此完美的一天！如果你观察右侧的5分钟图，那么会看出外形是一个普通的更高的低点的空头趋势反转，但通过右图的价格标尺可以看到有些K线的高度超过了30个点，而一般交易日内K线的平均高度大约是2个点。这是2008年崩盘中这一周道琼斯工业平均指数下跌20%后，市场尝试至少形成一个临时性的底部。一年多以前我便告诉我的朋友们，道指会在2008年跌破10000点，理由是它看起来已经进入一个多年的震荡交易区间。我们可能已经经过一个顶部。卖盘可能会带来市场更低的价位。不过震荡交易区间是市场更常见的一种情况，所以更容易出现。","p":"p1477"},{"t":"虽然道指在图中当天的波动区间接近1000点，但是对于价格行为交易者来说，它仍然只是非常普通寻常的一天。我把自己的头寸规模削减至正常情况下的20%，因为我希望在每手电子迷你期货交易上承担大约10个点的风险，然而当天的利润仍然超过了一般交易日的利润。","p":"p1478"},{"t":"今天是星期五，道指这一周每天都下跌200到700个点，所以很可能尝试反转。不过，你必须保持耐心，寻找标准的价格行为形态。","p":"p1479"},{"t":"左侧图表是60分钟K线图，K线D（它也是右侧5分钟K线图上的K线6）跌穿了K线A和C构成的趋势通道线，然后向上反转。","p":"p1480"},{"t":"在5分钟K线图上，市场跌破K线2到K线4趋势通道线后，K线6形成一条巨大的十字星K线。十字星不是很好的信号K线，但是在5分钟和60分钟图上都显示市场在突破趋势通道线后有所反弹，而且道指已经下跌了700点，所以很可能形成一波值得参与的反弹行情。","p":"p1481"},{"t":"K线7向上突破空头趋势线，但是形成一个最终旗形顶部和两浪上涨结构，所以很可能出现回调。不过，因为从K线6到K线7的反弹非常强劲，所以市场可能在二次下探低点后再次出现一波反弹。耐心等待更高的低点是比较谨慎的做法（因为考虑到上涨的动能很强，所以不太可能出现更低的低点）。","p":"p1482"},{"t":"K线10可能是一个底部，因为它是K线8楔形突破后的一个更低低点的突破后的回调。然而，从K线7开始的下跌持续了二个多小时，而且非常陡峭，所以在最后触底之前，很可能会形成第二次下跌浪。","p":"p1483"},{"t":"截至K线11的上涨运动突破了另一条空头趋势线。所以表明多头力量正在集聚。","p":"p1484"},{"t":"与K线10相比，K线12是一个更低的低点，所以它可能是当天一个底部（相比K线6来说是更高的低点），不过，考虑到K线12之前的下跌浪空头力量仍然很强劲，所以市场可能会再次探底。","p":"p1485"},{"t":"K线13之前的反弹包含几根大阳线，它突破了另一条空头趋势线（译者注：这里原文是多头趋势线，但应该是笔误）。","p":"p1486"},{"t":"K线14是一条尺寸不错的多头反转K线，是一个微型趋势线的突破。与K线12相比，这也是一个更高的低点，所以这里很可能是最终的低点。果然如此。这是K线12成为K线6之后的第一个跟高的低点，而且是对当天空头趋势低点的一个很好的测试。这是当天的yibi交易，在K线7之前强势上涨之后，你需要一直等待的一笔交易机会。当天还有其他很多交易信号，但这一个是比较容易预期的，而且它表现得非常完美。在5分钟和60分钟图上，有过一些趋势通道线的突破，K线7之前的一波反弹使得之后市场很可能会形成一个更高的低点。K线12之前的两浪结构的回调可能形成一个60分钟更高的低点，随后在K线14出现的5分钟的更高的低点确认了K线12就是那个更高的低点。你不需要60分钟图也可以做到这笔交易，我当时就没有使用。我在这里加上它的目的是为了说明。较高的时间框架上也有力量在起作用，从成交量上可以清楚地看到机构正在关注它们。","p":"p1487"},{"t":"K线15是当天创新高之后的一个回调。","p":"p1488"},{"t":"K线10的双K线向上反转，是一个大约有60%胜率可以赚取波段利润的信号案例，所以对于所有交易者（包括初学者）来说，都是一个很棒的信号。K线4是空头趋势中的一根缺口K线，它常常引出对空头低点（此时是K线2）的测试。然后形成一波反弹。最少包含10根K线和两浪结构。K线6之前的下跌势头太强，所以交易者们不敢入场做多。K线8是一个合理的买入位置，因为它是向下突破K线2之后的第二次反转尝试，一个扩张三角形底部（当天第三根K线是第一次下推，K线2是第二次），K线7是空头旗形之后的一个最终旗形反转，还是一根大阳线。扩张三角形底部是一种重要趋势反转的信号。然而，由于K线4附近的上涨浪和K线6之前的下跌浪都非常强烈，所以大部分交易者不会把这个叫作重要趋势反转，而是用其他的名称（不过在15分钟图上它几乎肯定是一个外观很棒的重要趋势反转形态）。K线10是一个已经很强的更高的低点的入场做多形态中的第二次入场信号。交易者们在K线10的上方买入，加上它是双K线反转形态的第二根K线，所以交易者们把他们的初始保护性止损设置在它的低点下方。一旦市场到达两倍风险处，他们就部分或者全部获利了结，让头寸的剩余部分随着向上的波段自由奔跑，把跟踪止损调整至最近的更高的低点下方。有些人会在K线19双重顶（与K线14构成的）和楔形（K线12、14、19以及14、16和19）下方离场，还有一些人则会继续持有，一直将止损设在K线17下方。","p":"p1489"}]},{"t":"para","text":"图24.20中，右侧5分钟电子迷你图表上的最佳交易信号包括：K线6开盘反转：K线7最终旗形顶和楔形顶（K线6前一根K线高点是第一波上涨浪，尽管它是一根阴线）：K线8楔形多头旗形和更高的低点；K线9向上突破微型空头通道后K线10是突破后的回调买入机会；K线11低点2反弹做空和双重顶（与跌至K线8的楔形的顶部构成）做空机会；K线12的大型两浪结构（K线10第一次下推浪）的更高的低点重要趋势反转（K线12是从跌至K线10的小空头趋势，并从K线6的大空头趋势开始的向上反转）：K线14更高的低点重要趋势反转和二次入场突破回调买进信号（它也是一个头肩底的右肩。其中K线10是左肩）。","pid":"p1475"},{"t":"para","text":"虽然大部分学术专家和电视权威辩称大盘中的所有运动都是以谷歌的总和基本面为基础的，但政治事件常常会引起巨幅波动。一个明显的例子是共和党在1994年接管国会时引发的不可思议的多头趋势，它常常被称为克林顿超级多头市场。2008年的崩盘是另一个例子。这轮空头趋势和恐慌抛盘是由次贷问题引起的，还是国家认识到奥巴马即将人住白宫的直接结果？虽然你必须根据图表显示的来进行交易。但无论你的政治倾向是什么，试着去理解政治会如何影响市场是非常有意思的。","pid":"p1476"},{"t":"para","text":"如此完美的一天！如果你观察右侧的5分钟图，那么会看出外形是一个普通的更高的低点的空头趋势反转，但通过右图的价格标尺可以看到有些K线的高度超过了30个点，而一般交易日内K线的平均高度大约是2个点。这是2008年崩盘中这一周道琼斯工业平均指数下跌20%后，市场尝试至少形成一个临时性的底部。一年多以前我便告诉我的朋友们，道指会在2008年跌破10000点，理由是它看起来已经进入一个多年的震荡交易区间。我们可能已经经过一个顶部。卖盘可能会带来市场更低的价位。不过震荡交易区间是市场更常见的一种情况，所以更容易出现。","pid":"p1477"},{"t":"para","text":"虽然道指在图中当天的波动区间接近1000点，但是对于价格行为交易者来说，它仍然只是非常普通寻常的一天。我把自己的头寸规模削减至正常情况下的20%，因为我希望在每手电子迷你期货交易上承担大约10个点的风险，然而当天的利润仍然超过了一般交易日的利润。","pid":"p1478"},{"t":"para","text":"今天是星期五，道指这一周每天都下跌200到700个点，所以很可能尝试反转。不过，你必须保持耐心，寻找标准的价格行为形态。","pid":"p1479"},{"t":"para","text":"左侧图表是60分钟K线图，K线D（它也是右侧5分钟K线图上的K线6）跌穿了K线A和C构成的趋势通道线，然后向上反转。","pid":"p1480"},{"t":"para","text":"在5分钟K线图上，市场跌破K线2到K线4趋势通道线后，K线6形成一条巨大的十字星K线。十字星不是很好的信号K线，但是在5分钟和60分钟图上都显示市场在突破趋势通道线后有所反弹，而且道指已经下跌了700点，所以很可能形成一波值得参与的反弹行情。","pid":"p1481"},{"t":"para","text":"K线7向上突破空头趋势线，但是形成一个最终旗形顶部和两浪上涨结构，所以很可能出现回调。不过，因为从K线6到K线7的反弹非常强劲，所以市场可能在二次下探低点后再次出现一波反弹。耐心等待更高的低点是比较谨慎的做法（因为考虑到上涨的动能很强，所以不太可能出现更低的低点）。","pid":"p1482"},{"t":"para","text":"K线10可能是一个底部，因为它是K线8楔形突破后的一个更低低点的突破后的回调。然而，从K线7开始的下跌持续了二个多小时，而且非常陡峭，所以在最后触底之前，很可能会形成第二次下跌浪。","pid":"p1483"},{"t":"para","text":"截至K线11的上涨运动突破了另一条空头趋势线。所以表明多头力量正在集聚。","pid":"p1484"},{"t":"para","text":"与K线10相比，K线12是一个更低的低点，所以它可能是当天一个底部（相比K线6来说是更高的低点），不过，考虑到K线12之前的下跌浪空头力量仍然很强劲，所以市场可能会再次探底。","pid":"p1485"},{"t":"para","text":"K线13之前的反弹包含几根大阳线，它突破了另一条空头趋势线（译者注：这里原文是多头趋势线，但应该是笔误）。","pid":"p1486"},{"t":"para","text":"K线14是一条尺寸不错的多头反转K线，是一个微型趋势线的突破。与K线12相比，这也是一个更高的低点，所以这里很可能是最终的低点。果然如此。这是K线12成为K线6之后的第一个跟高的低点，而且是对当天空头趋势低点的一个很好的测试。这是当天的yibi交易，在K线7之前强势上涨之后，你需要一直等待的一笔交易机会。当天还有其他很多交易信号，但这一个是比较容易预期的，而且它表现得非常完美。在5分钟和60分钟图上，有过一些趋势通道线的突破，K线7之前的一波反弹使得之后市场很可能会形成一个更高的低点。K线12之前的两浪结构的回调可能形成一个60分钟更高的低点，随后在K线14出现的5分钟的更高的低点确认了K线12就是那个更高的低点。你不需要60分钟图也可以做到这笔交易，我当时就没有使用。我在这里加上它的目的是为了说明。较高的时间框架上也有力量在起作用，从成交量上可以清楚地看到机构正在关注它们。","pid":"p1487"},{"t":"para","text":"K线15是当天创新高之后的一个回调。","pid":"p1488"},{"t":"para","text":"K线10的双K线向上反转，是一个大约有60%胜率可以赚取波段利润的信号案例，所以对于所有交易者（包括初学者）来说，都是一个很棒的信号。K线4是空头趋势中的一根缺口K线，它常常引出对空头低点（此时是K线2）的测试。然后形成一波反弹。最少包含10根K线和两浪结构。K线6之前的下跌势头太强，所以交易者们不敢入场做多。K线8是一个合理的买入位置，因为它是向下突破K线2之后的第二次反转尝试，一个扩张三角形底部（当天第三根K线是第一次下推，K线2是第二次），K线7是空头旗形之后的一个最终旗形反转，还是一根大阳线。扩张三角形底部是一种重要趋势反转的信号。然而，由于K线4附近的上涨浪和K线6之前的下跌浪都非常强烈，所以大部分交易者不会把这个叫作重要趋势反转，而是用其他的名称（不过在15分钟图上它几乎肯定是一个外观很棒的重要趋势反转形态）。K线10是一个已经很强的更高的低点的入场做多形态中的第二次入场信号。交易者们在K线10的上方买入，加上它是双K线反转形态的第二根K线，所以交易者们把他们的初始保护性止损设置在它的低点下方。一旦市场到达两倍风险处，他们就部分或者全部获利了结，让头寸的剩余部分随着向上的波段自由奔跑，把跟踪止损调整至最近的更高的低点下方。有些人会在K线19双重顶（与K线14构成的）和楔形（K线12、14、19以及14、16和19）下方离场，还有一些人则会继续持有，一直将止损设在K线17下方。","pid":"p1489"},{"t":"img","src":"assets/img/p4c4_021.webp","ctx":[{"t":"K线15是当天创新高之后的一个回调。","p":"p1488"},{"t":"K线10的双K线向上反转，是一个大约有60%胜率可以赚取波段利润的信号案例，所以对于所有交易者（包括初学者）来说，都是一个很棒的信号。K线4是空头趋势中的一根缺口K线，它常常引出对空头低点（此时是K线2）的测试。然后形成一波反弹。最少包含10根K线和两浪结构。K线6之前的下跌势头太强，所以交易者们不敢入场做多。K线8是一个合理的买入位置，因为它是向下突破K线2之后的第二次反转尝试，一个扩张三角形底部（当天第三根K线是第一次下推，K线2是第二次），K线7是空头旗形之后的一个最终旗形反转，还是一根大阳线。扩张三角形底部是一种重要趋势反转的信号。然而，由于K线4附近的上涨浪和K线6之前的下跌浪都非常强烈，所以大部分交易者不会把这个叫作重要趋势反转，而是用其他的名称（不过在15分钟图上它几乎肯定是一个外观很棒的重要趋势反转形态）。K线10是一个已经很强的更高的低点的入场做多形态中的第二次入场信号。交易者们在K线10的上方买入，加上它是双K线反转形态的第二根K线，所以交易者们把他们的初始保护性止损设置在它的低点下方。一旦市场到达两倍风险处，他们就部分或者全部获利了结，让头寸的剩余部分随着向上的波段自由奔跑，把跟踪止损调整至最近的更高的低点下方。有些人会在K线19双重顶（与K线14构成的）和楔形（K线12、14、19以及14、16和19）下方离场，还有一些人则会继续持有，一直将止损设在K线17下方。","p":"p1489"},{"t":"如图24.21所示，美国10年起中期国库券期货5分钟图上的最佳交易包括：K线4、7和10处的最终旗形反转；K线3处的小型低点2；K线6处的高点1：K线11处的楔形空头旗形二次入场信号。","p":"p1490"},{"t":"最终旗形常常提供高胜率的反转交易。","p":"p1491"},{"t":"K线4是只有一个阴线实体的水平空头旗形之后的双K线反转。空头旗形中的阳线实体是买盘力量增强的征兆。","p":"p1492"},{"t":"虽然K线5的大阳线是一波高潮，但K线6从高点1回调后的点位也是一个不错的回调买入机会，预期在如此强劲的动能之后，至少会出现短线的上涨。另外，在K线6之前的那根空头内含线下方做空的空头被套，他们会在K线6的上方平仓止损。","p":"p1493"},{"t":"K线7是一个双K线反转形态的第一根K线，第二根K线是一根大阴线。反转发生在略高于K线5的高点处，所以多头显然是急于获利了结，空头只是在等待市场超越K线5，然后做空。这是一个很好的最终旗形做空机会，特别是由于K线7的前一根K线也是一条大阳线，所以是第二波买入高潮。连续的买入高潮之后，至少会有一个两浪结构的调整。","p":"p1494"},{"t":"K线10是一条相对较大的十字星反转K线，是从i最终旗形突破（i形态常常成为最终旗形）开始的向上反转的信号K线。它也是一个小型楔形多头旗形，其中K线6是第一次下推，K线9是第二次下推。","p":"p1495"},{"t":"K线11是从K线10为起点的小型上涨高潮之后，市场形成一个水平的最终多头旗形，之后开始向下反转的二次入场信号。它也是一个楔形空头旗形，其中K线9后面的多头内含K线是第一次上推，从K线10开始的反弹是第二次上推。最后，它是K线10之前强下跌趋势后的一个均线缺口回补后的做空信号。","p":"p1496"},{"t":"K线12和13是潜在的双K线向上反转信号，但信号并没有被触发。市场一直没有向上超越信号K线。有些交易者把K线12看作是一个最终旗形买入信号，其中K线12之前的紧凑交易区间可能成为K线12之后的抛盘的最终旗形反转形态。","p":"p1497"}]},{"t":"para","text":"如图24.21所示，美国10年起中期国库券期货5分钟图上的最佳交易包括：K线4、7和10处的最终旗形反转；K线3处的小型低点2；K线6处的高点1：K线11处的楔形空头旗形二次入场信号。","pid":"p1490"},{"t":"para","text":"最终旗形常常提供高胜率的反转交易。","pid":"p1491"},{"t":"para","text":"K线4是只有一个阴线实体的水平空头旗形之后的双K线反转。空头旗形中的阳线实体是买盘力量增强的征兆。","pid":"p1492"},{"t":"para","text":"虽然K线5的大阳线是一波高潮，但K线6从高点1回调后的点位也是一个不错的回调买入机会，预期在如此强劲的动能之后，至少会出现短线的上涨。另外，在K线6之前的那根空头内含线下方做空的空头被套，他们会在K线6的上方平仓止损。","pid":"p1493"},{"t":"para","text":"K线7是一个双K线反转形态的第一根K线，第二根K线是一根大阴线。反转发生在略高于K线5的高点处，所以多头显然是急于获利了结，空头只是在等待市场超越K线5，然后做空。这是一个很好的最终旗形做空机会，特别是由于K线7的前一根K线也是一条大阳线，所以是第二波买入高潮。连续的买入高潮之后，至少会有一个两浪结构的调整。","pid":"p1494"},{"t":"para","text":"K线10是一条相对较大的十字星反转K线，是从i最终旗形突破（i形态常常成为最终旗形）开始的向上反转的信号K线。它也是一个小型楔形多头旗形，其中K线6是第一次下推，K线9是第二次下推。","pid":"p1495"},{"t":"para","text":"K线11是从K线10为起点的小型上涨高潮之后，市场形成一个水平的最终多头旗形，之后开始向下反转的二次入场信号。它也是一个楔形空头旗形，其中K线9后面的多头内含K线是第一次上推，从K线10开始的反弹是第二次上推。最后，它是K线10之前强下跌趋势后的一个均线缺口回补后的做空信号。","pid":"p1496"},{"t":"para","text":"K线12和13是潜在的双K线向上反转信号，但信号并没有被触发。市场一直没有向上超越信号K线。有些交易者把K线12看作是一个最终旗形买入信号，其中K线12之前的紧凑交易区间可能成为K线12之后的抛盘的最终旗形反转形态。","pid":"p1497"},{"t":"img","src":"assets/img/p4c4_022.webp","ctx":[{"t":"K线11是从K线10为起点的小型上涨高潮之后，市场形成一个水平的最终多头旗形，之后开始向下反转的二次入场信号。它也是一个楔形空头旗形，其中K线9后面的多头内含K线是第一次上推，从K线10开始的反弹是第二次上推。最后，它是K线10之前强下跌趋势后的一个均线缺口回补后的做空信号。","p":"p1496"},{"t":"K线12和13是潜在的双K线向上反转信号，但信号并没有被触发。市场一直没有向上超越信号K线。有些交易者把K线12看作是一个最终旗形买入信号，其中K线12之前的紧凑交易区间可能成为K线12之后的抛盘的最终旗形反转形态。","p":"p1497"},{"t":"如图24.22所示，这张5分钟电子迷你图表上的最佳交易信号包括：从前一天低点（形成于K线1后面的第三根K线）开始的双K线向上反转；K线3处的双重顶；K线7处的楔形空头旗形；以及带有一定趋势性的区间震荡日和台阶形态中形成的K线9小型最终旗形和向上反转。","p":"p1498"},{"t":"当一天不是趋势日时，那么它就是一个区间震荡日，或者至少会包含大量的双向交易。","p":"p1499"},{"t":"K线2取代了开盘的高点，所以聪明的交易者们会寻找二次入场做空机会，这个机会出现在K线3的双重顶处。当天一开始的波段常常是以一个双重顶或双重底开始的。波段区间大约是平均日区间的一半。所以当天很可能出现突破。成为一个上涨或下跌的趋势中的交易区间日，然后回调，测试初始区间的突破价位。","p":"p1500"},{"t":"K线4之前的空头高潮使得市场转变为总是在场策略的空头状态于是交易者们准备在反弹时做空。预期市场会向下突破，然后向下形成一波近似的等距运动。截至K线6的多头通道是一波三浪推进式的反弹，包含很多重叠的K线和几次微型通道反转尝试。它比K线4之前的抛盘力量要弱很多。一旦交易者们认为市场不会出现对这一通道的强势多头突破，他们就认为这个通道只不过是一个空头旗形，随后会迎来一波空头趋势。K线6离K线3下方空头的盈亏平衡点还差一个跳动，这也显示了空头力量的强大。他们通过在K线6积极做空保护了自己的止损。","p":"p1501"},{"t":"在K线6双K线反转后的十字星K线或者其上方，激进的交易者会设定限价单做空。他们认为这是一个很可能失败的弱高点1回调买入信号。","p":"p1502"},{"t":"K线9是一根很强的多头反转K线。但是由于它与前一根K线的重叠非常多，所以它的作用就像是双K线反转。由于它的高点与前一根K线的高点处于同一个价位，所以交易者把它看作是双K线反转或者多头反转K线都没有关系。无论哪种情况，它都是趋势性交易区间日内的一个强反转信号。而且是在一波向下探底运动的区域。之前是K线8最终旗形。它也是当天第三次下推。所有这些因素都促使交易者们认为市场至少会形成一波两条腿的反弹，来测试K线4的低点价位。当K线9超越它前面的多头反转K线时买入，因为它是一个大约有60%胜率的波段交易信号，所以对于所有交易者（包括初学者）来说，都是一个很不错的信号。对于在从K线8下方出发的低点2最终旗形开始的反弹，以及大型抛物线楔形底部（第一次下推结束于K线1后面的第三根K线，第二次结束于K线4），多头反转K线是一根强的信号K线。虽然K线9是一根大阴线，但它没有触及多头信号K线下方的保护性止损。另外一些交易者在K线9上方买入，因为它是一个二次入场买入信号，与那条多头信号K线构成一个微型双重底。它很可能继续上涨，形成一波测试运动，测量的基准是微型双重底的高度（大约是从那条多头K线底部到K线9顶部的高度的两倍），由于出现一个大的底部形态，所以上涨的幅度可能大得多，比如至少包含10根K线和两浪结构。","p":"p1503"},{"t":"注意，有几个微型反转，而大部分反转来自双重顶和双重底、微型双重顶和双重底，以及最终旗形。几乎总是如此。很多交易者不会选择反转交易信号，除非这些架构中的一个出现。","p":"p1504"}]},{"t":"para","text":"如图24.22所示，这张5分钟电子迷你图表上的最佳交易信号包括：从前一天低点（形成于K线1后面的第三根K线）开始的双K线向上反转；K线3处的双重顶；K线7处的楔形空头旗形；以及带有一定趋势性的区间震荡日和台阶形态中形成的K线9小型最终旗形和向上反转。","pid":"p1498"},{"t":"para","text":"当一天不是趋势日时，那么它就是一个区间震荡日，或者至少会包含大量的双向交易。","pid":"p1499"},{"t":"para","text":"K线2取代了开盘的高点，所以聪明的交易者们会寻找二次入场做空机会，这个机会出现在K线3的双重顶处。当天一开始的波段常常是以一个双重顶或双重底开始的。波段区间大约是平均日区间的一半。所以当天很可能出现突破。成为一个上涨或下跌的趋势中的交易区间日，然后回调，测试初始区间的突破价位。","pid":"p1500"},{"t":"para","text":"K线4之前的空头高潮使得市场转变为总是在场策略的空头状态于是交易者们准备在反弹时做空。预期市场会向下突破，然后向下形成一波近似的等距运动。截至K线6的多头通道是一波三浪推进式的反弹，包含很多重叠的K线和几次微型通道反转尝试。它比K线4之前的抛盘力量要弱很多。一旦交易者们认为市场不会出现对这一通道的强势多头突破，他们就认为这个通道只不过是一个空头旗形，随后会迎来一波空头趋势。K线6离K线3下方空头的盈亏平衡点还差一个跳动，这也显示了空头力量的强大。他们通过在K线6积极做空保护了自己的止损。","pid":"p1501"},{"t":"para","text":"在K线6双K线反转后的十字星K线或者其上方，激进的交易者会设定限价单做空。他们认为这是一个很可能失败的弱高点1回调买入信号。","pid":"p1502"},{"t":"para","text":"K线9是一根很强的多头反转K线。但是由于它与前一根K线的重叠非常多，所以它的作用就像是双K线反转。由于它的高点与前一根K线的高点处于同一个价位，所以交易者把它看作是双K线反转或者多头反转K线都没有关系。无论哪种情况，它都是趋势性交易区间日内的一个强反转信号。而且是在一波向下探底运动的区域。之前是K线8最终旗形。它也是当天第三次下推。所有这些因素都促使交易者们认为市场至少会形成一波两条腿的反弹，来测试K线4的低点价位。当K线9超越它前面的多头反转K线时买入，因为它是一个大约有60%胜率的波段交易信号，所以对于所有交易者（包括初学者）来说，都是一个很不错的信号。对于在从K线8下方出发的低点2最终旗形开始的反弹，以及大型抛物线楔形底部（第一次下推结束于K线1后面的第三根K线，第二次结束于K线4），多头反转K线是一根强的信号K线。虽然K线9是一根大阴线，但它没有触及多头信号K线下方的保护性止损。另外一些交易者在K线9上方买入，因为它是一个二次入场买入信号，与那条多头信号K线构成一个微型双重底。它很可能继续上涨，形成一波测试运动，测量的基准是微型双重底的高度（大约是从那条多头K线底部到K线9顶部的高度的两倍），由于出现一个大的底部形态，所以上涨的幅度可能大得多，比如至少包含10根K线和两浪结构。","pid":"p1503"},{"t":"para","text":"注意，有几个微型反转，而大部分反转来自双重顶和双重底、微型双重顶和双重底，以及最终旗形。几乎总是如此。很多交易者不会选择反转交易信号，除非这些架构中的一个出现。","pid":"p1504"},{"t":"img","src":"assets/img/p4c4_023.webp","ctx":[{"t":"K线9是一根很强的多头反转K线。但是由于它与前一根K线的重叠非常多，所以它的作用就像是双K线反转。由于它的高点与前一根K线的高点处于同一个价位，所以交易者把它看作是双K线反转或者多头反转K线都没有关系。无论哪种情况，它都是趋势性交易区间日内的一个强反转信号。而且是在一波向下探底运动的区域。之前是K线8最终旗形。它也是当天第三次下推。所有这些因素都促使交易者们认为市场至少会形成一波两条腿的反弹，来测试K线4的低点价位。当K线9超越它前面的多头反转K线时买入，因为它是一个大约有60%胜率的波段交易信号，所以对于所有交易者（包括初学者）来说，都是一个很不错的信号。对于在从K线8下方出发的低点2最终旗形开始的反弹，以及大型抛物线楔形底部（第一次下推结束于K线1后面的第三根K线，第二次结束于K线4），多头反转K线是一根强的信号K线。虽然K线9是一根大阴线，但它没有触及多头信号K线下方的保护性止损。另外一些交易者在K线9上方买入，因为它是一个二次入场买入信号，与那条多头信号K线构成一个微型双重底。它很可能继续上涨，形成一波测试运动，测量的基准是微型双重底的高度（大约是从那条多头K线底部到K线9顶部的高度的两倍），由于出现一个大的底部形态，所以上涨的幅度可能大得多，比如至少包含10根K线和两浪结构。","p":"p1503"},{"t":"注意，有几个微型反转，而大部分反转来自双重顶和双重底、微型双重顶和双重底，以及最终旗形。几乎总是如此。很多交易者不会选择反转交易信号，除非这些架构中的一个出现。","p":"p1504"},{"t":"如图24.23所示，这张5分钟电子迷你图表上的最佳交易包括：缺口高潮和通道底部之后的双K线反转K线1：当日新高以及高潮和通道顶部的反转K线2：微型通道失败突破的K线3（作为低点1）；当天第三次下推、更低的低点，以及交易区间底部的最终旗形突破和向上反转K线5；双重顶、高潮和通道顶、低点4和交易区间顶部K线6。","p":"p1505"},{"t":"在一个没有明确趋势的交易日内，交易者们应该准备在新的极点反向入场，尤其是二次入场和楔形。","p":"p1506"},{"t":"K线1是一个楔形反转，反转K线很强。","p":"p1507"},{"t":"K线2是一个双重顶、一个形顶和一个二次入场的均线缺口K线做空信号。","p":"p1508"},{"t":"K线3是突破测试信号K线，它击中了空头设在K线2下方的盈亏平衡止损。","p":"p1509"},{"t":"K线4是陡峭下跌中的一个十字星。由于它可能仅仅转变成一个单K线或者双K线的空头旗形，所以交易者们等待二次入场买入。激进型交易者可能设定限价单在K线4后一根K线低点或者其下方买入预期形成第二波上涨浪。他们把这个看作是弱低点1的新底突破后的向上反转构成信号K线的内含K线以上涨收盘。","p":"p1510"},{"t":"K线6是一个低点4的做空信号，是向上突破波段高点K线3后的反转。","p":"p1511"},{"t":"虽然在震荡区间的中部做空，胜率只有50%，但如果利润目标也就是回报是风险的两倍，那么可能也是一笔最佳交易。","p":"p1512"}]},{"t":"para","text":"如图24.23所示，这张5分钟电子迷你图表上的最佳交易包括：缺口高潮和通道底部之后的双K线反转K线1：当日新高以及高潮和通道顶部的反转K线2：微型通道失败突破的K线3（作为低点1）；当天第三次下推、更低的低点，以及交易区间底部的最终旗形突破和向上反转K线5；双重顶、高潮和通道顶、低点4和交易区间顶部K线6。","pid":"p1505"},{"t":"para","text":"在一个没有明确趋势的交易日内，交易者们应该准备在新的极点反向入场，尤其是二次入场和楔形。","pid":"p1506"},{"t":"para","text":"K线1是一个楔形反转，反转K线很强。","pid":"p1507"},{"t":"para","text":"K线2是一个双重顶、一个形顶和一个二次入场的均线缺口K线做空信号。","pid":"p1508"},{"t":"para","text":"K线3是突破测试信号K线，它击中了空头设在K线2下方的盈亏平衡止损。","pid":"p1509"},{"t":"para","text":"K线4是陡峭下跌中的一个十字星。由于它可能仅仅转变成一个单K线或者双K线的空头旗形，所以交易者们等待二次入场买入。激进型交易者可能设定限价单在K线4后一根K线低点或者其下方买入预期形成第二波上涨浪。他们把这个看作是弱低点1的新底突破后的向上反转构成信号K线的内含K线以上涨收盘。","pid":"p1510"},{"t":"para","text":"K线6是一个低点4的做空信号，是向上突破波段高点K线3后的反转。","pid":"p1511"},{"t":"para","text":"虽然在震荡区间的中部做空，胜率只有50%，但如果利润目标也就是回报是风险的两倍，那么可能也是一笔最佳交易。","pid":"p1512"},{"t":"img","src":"assets/img/p4c4_024.webp","ctx":[{"t":"K线6是一个低点4的做空信号，是向上突破波段高点K线3后的反转。","p":"p1511"},{"t":"虽然在震荡区间的中部做空，胜率只有50%，但如果利润目标也就是回报是风险的两倍，那么可能也是一笔最佳交易。","p":"p1512"},{"t":"如图24.24所示，5分钟电子迷你期货数周以来处于一轮强多头趋势中，在K线7形成一条均线缺口K线。这常常会引起对多头高点的最后二次测试，然后便会形成至少包含两浪结构、幅度更深的调整。K线10开盘向下小幅跳空，然后立即上涨。刚好超越均线。空头正在寻找第二浪下跌，但不确定K线10的单K线下跌是否足以构成第一浪。当一波运动不清晰时，通常没有足够的交易者认为它会成功。所以没有足够的交易者在它上面押注。结果在运动变成比较清晰之前，市场没有更强的力量推动。K线12之前的两浪结构引发了K线13的两条腿反弹，有些交易者们把它看作是一个小的楔形空头旗形。还有一些交易者们把它看作是一个头肩顶的右肩，K线6是左肩。有些人也认为它与K线11构成一个双重顶空头旗形。它是一个低于K线9高点和K线11前后高点的高点，可能会是一波较大级别的第二浪下跌的起点。","p":"p1513"},{"t":"由于K线1下方做空是在一个两日交易区间的中部做空，所以等距运动的方向概率大约是50%。下跌1点之前上涨1点的概率是50%，上涨1点之前下跌1点的概率也是50%。对于幅度为2、3、4个点的等距运动也是如此。一般而言，当市场处于震荡交易区间内时，如果市场已经上涨了5到10根K线，那么交易者们应该只寻找做空的信号。K线11是从开盘低点开始的第八根K线，而且随后一根K线标志着市场第三次跌破前一根K线的低点。交易者们在这里做空，甚至是在第一次或者第二次尝试下跌时做空，希望足够多的交易者把这里看作是一个潜在的更低的高点，于是预期出现更多的卖盘。由于它的说服力不足，所以直到出现K线13这个更清晰的高点，下跌运动才开始。","p":"p1514"},{"t":"那么，为什么当胜率为50%，而且位于多头趋势内一段交易区间的中部时，在K线11附近做空是一笔最佳交易呢？记住，交易者方程式有三个变量，除了胜率之外，你还必须考虑回报和风险。由于过去一个月左右电子迷你的平均日区间超过10个点，而今天的区间只有两个点，而且过去一两年中区间在5点或6点之下的交易日届指可数，所以，今天的区间的收盘前增至两倍或三倍的概率很高。问题是。交易者们不知道突破是向上还是向下，还是既有向上突破又有向下突破。由于市场已经在一段区间交易内上涨了8根K线，所以概率偏向于近期内下跌。交易者们完全可以做空，把保护性止损设置在K线11信号K线的上方，在入场点下方4点处设置一张双向（OCO）限价单，然后耐心等待。由于存在如此多的不确定性，所以仅当他们甘愿经历回调时才会做这笔交易，而回调在交易区间中是不可避免的。实际风险只有4个跳动，所以交易者们正在冒着4个跳动的风险去博取16个跳动的利润，而且拥有大约50%的成功率。尽管当时看起来并不那么好，但这会使得它成为一笔极好的交易。","p":"p1515"},{"t":"一旦出现一条大型的空头突破K线，然后立即在K线12出现后续跟进做空力量，那么对于大部分交易来说。市场就是总是在场策略的空头，他们会假定市场保持空头状态，除非出现总是在场策略的多头买入信号，或者直到市场向上突破从K线11后面的小型阴线开始的空头下跌高潮的顶部。K线13准确无误地测试了那一根K线的高点，市场最终下跌至K线19。K线19的低点比K线11信号K线低了17个跳动，而且K线19拥有一个多头实体。这可能是一个17跳动失败。也就是说，很多空头提早在信号K线下方16个跳动而不是17个跳动处获利了结。他们在距离4点运动1个跳动处离场，那是空头势头减弱的一个征兆。市场触及限价单，让空头以4个点的利润离场，那么那根K线成为一条多头反转K线由于17跳动失败，大部分的空头会在K线19多头反转K线上方离场，获利11个跳动。而不是希望市场下跌，给他们原来计划的16个跳动的利润。","p":"p1516"},{"t":"在圣诞节前的一周，假期前后的平均日波动区间比较小。过去一两周中有几天的区间小于7个点。另外。由于初始风险只有4个跳动，而不是通常的7个或者8个跳动，所以很多交易者认为较小的风险和较小的近期平均日波动区间意味着赚到4个点的可能性也比较低。这些交易者中很多预期17个跳动失败，把限价单设在入场点下方15个跳动处，而不是下方6个跳动处（译者注：这里应该是16个跳动处）。每当一波运动有可能提前结束时，很多交易者会使用小于正常值1个跳动的限价单，因为他们知道市场常常会击中明显的目标价位，但是会在执行获利了结限价单前反转。而另外一些交易者则将获利了结限价单设在入场点位下方3个点处显然他们都能赚到这3个点的利润。","p":"p1517"}]},{"t":"para","text":"如图24.24所示，5分钟电子迷你期货数周以来处于一轮强多头趋势中，在K线7形成一条均线缺口K线。这常常会引起对多头高点的最后二次测试，然后便会形成至少包含两浪结构、幅度更深的调整。K线10开盘向下小幅跳空，然后立即上涨。刚好超越均线。空头正在寻找第二浪下跌，但不确定K线10的单K线下跌是否足以构成第一浪。当一波运动不清晰时，通常没有足够的交易者认为它会成功。所以没有足够的交易者在它上面押注。结果在运动变成比较清晰之前，市场没有更强的力量推动。K线12之前的两浪结构引发了K线13的两条腿反弹，有些交易者们把它看作是一个小的楔形空头旗形。还有一些交易者们把它看作是一个头肩顶的右肩，K线6是左肩。有些人也认为它与K线11构成一个双重顶空头旗形。它是一个低于K线9高点和K线11前后高点的高点，可能会是一波较大级别的第二浪下跌的起点。","pid":"p1513"},{"t":"para","text":"由于K线1下方做空是在一个两日交易区间的中部做空，所以等距运动的方向概率大约是50%。下跌1点之前上涨1点的概率是50%，上涨1点之前下跌1点的概率也是50%。对于幅度为2、3、4个点的等距运动也是如此。一般而言，当市场处于震荡交易区间内时，如果市场已经上涨了5到10根K线，那么交易者们应该只寻找做空的信号。K线11是从开盘低点开始的第八根K线，而且随后一根K线标志着市场第三次跌破前一根K线的低点。交易者们在这里做空，甚至是在第一次或者第二次尝试下跌时做空，希望足够多的交易者把这里看作是一个潜在的更低的高点，于是预期出现更多的卖盘。由于它的说服力不足，所以直到出现K线13这个更清晰的高点，下跌运动才开始。","pid":"p1514"},{"t":"para","text":"那么，为什么当胜率为50%，而且位于多头趋势内一段交易区间的中部时，在K线11附近做空是一笔最佳交易呢？记住，交易者方程式有三个变量，除了胜率之外，你还必须考虑回报和风险。由于过去一个月左右电子迷你的平均日区间超过10个点，而今天的区间只有两个点，而且过去一两年中区间在5点或6点之下的交易日届指可数，所以，今天的区间的收盘前增至两倍或三倍的概率很高。问题是。交易者们不知道突破是向上还是向下，还是既有向上突破又有向下突破。由于市场已经在一段区间交易内上涨了8根K线，所以概率偏向于近期内下跌。交易者们完全可以做空，把保护性止损设置在K线11信号K线的上方，在入场点下方4点处设置一张双向（OCO）限价单，然后耐心等待。由于存在如此多的不确定性，所以仅当他们甘愿经历回调时才会做这笔交易，而回调在交易区间中是不可避免的。实际风险只有4个跳动，所以交易者们正在冒着4个跳动的风险去博取16个跳动的利润，而且拥有大约50%的成功率。尽管当时看起来并不那么好，但这会使得它成为一笔极好的交易。","pid":"p1515"},{"t":"para","text":"一旦出现一条大型的空头突破K线，然后立即在K线12出现后续跟进做空力量，那么对于大部分交易来说。市场就是总是在场策略的空头，他们会假定市场保持空头状态，除非出现总是在场策略的多头买入信号，或者直到市场向上突破从K线11后面的小型阴线开始的空头下跌高潮的顶部。K线13准确无误地测试了那一根K线的高点，市场最终下跌至K线19。K线19的低点比K线11信号K线低了17个跳动，而且K线19拥有一个多头实体。这可能是一个17跳动失败。也就是说，很多空头提早在信号K线下方16个跳动而不是17个跳动处获利了结。他们在距离4点运动1个跳动处离场，那是空头势头减弱的一个征兆。市场触及限价单，让空头以4个点的利润离场，那么那根K线成为一条多头反转K线由于17跳动失败，大部分的空头会在K线19多头反转K线上方离场，获利11个跳动。而不是希望市场下跌，给他们原来计划的16个跳动的利润。","pid":"p1516"},{"t":"para","text":"在圣诞节前的一周，假期前后的平均日波动区间比较小。过去一两周中有几天的区间小于7个点。另外。由于初始风险只有4个跳动，而不是通常的7个或者8个跳动，所以很多交易者认为较小的风险和较小的近期平均日波动区间意味着赚到4个点的可能性也比较低。这些交易者中很多预期17个跳动失败，把限价单设在入场点下方15个跳动处，而不是下方6个跳动处（译者注：这里应该是16个跳动处）。每当一波运动有可能提前结束时，很多交易者会使用小于正常值1个跳动的限价单，因为他们知道市场常常会击中明显的目标价位，但是会在执行获利了结限价单前反转。而另外一些交易者则将获利了结限价单设在入场点位下方3个点处显然他们都能赚到这3个点的利润。","pid":"p1517"}],"wcount":54966},{"id":"p4c5","title":"第25章　交易的指引","blocks":[{"t":"para","text":"第25章　交易的指引","pid":"p1518"},{"t":"para","text":"为什么这里是指引而不是规则呢？因为规则一词显得太过生硬，过于绝对，把交易这个复杂的过程简化了，显得好像只要遵守规则就能取得成功一样。其实不然，交易是一门主观的艺术，在市场面前，你的优势总是很小，很难达到持续盈利的状态。如果真的有一些规则可以让我们很快实现稳定持续盈利的话，相信很多人已经学会了这些规则。如果真的是这样，那么很快就没有人再会成为对手盘。那么这些规则也很快就失效了。","pid":"p1519"},{"t":"para","text":"下面是七十八条交易方面的指引，供大家参考。","pid":"p1520"},{"t":"para","text":"1.首先，耐心地读完本书这五十七万字（译者注：英文原文字数），就像阅读任何一门学科的指南一样，例如打高尔夫球、拉小提琴一样。如果要以交易为生。那么你需要花大量精力将这些信息转化成赚钱的能力，这是非常艰苦的。但如果你没办法理解市场，就不可能在这个市场生存。就像作为一个专业的高尔夫球手或小提琴手一样，无论你做得多么好，你总是希望自己可以更优秀，所以即便是你已经实现了持续稳定盈利，你还是面临很多挑战和追求满足感的过程。","pid":"p1521"},{"t":"para","text":"2.你所看到的东西一般处于灰色的迷雾之中，没有什么是可以看得完全清楚的，近似就好。如果某些价格行为看起来像某个可靠的形态那么它很可能就像这个可靠形态一样来交易。","pid":"p1522"},{"t":"para","text":"3.作为交易者。想要简单地获得一套可靠的赚钱策略是不可能的，很多事情其实是主观的。这是一个跟众多聪明的交易者一起玩的零和游戏，任何时候你的优势都是微弱和转瞬即逝的。要作为一个盈利的交易者，你必须持续地比超过一半的其他交易者表现得要好（更准确地说，是在超过一半的时间里获得正的交易者方程。）鉴于很多竞争者都是盈利能力很强的机构，所以个人交易者需要非常优秀才有获胜的概率。不过，还是有很多机会，交易者可以获得优势，而且如果能够及时发现这些机会，并知道如何去交易这些机会，那么你就具备了赚钱的能力。","pid":"p1523"},{"t":"para","text":"4.任何优势都不可能太大。因为随着优势机会的出现和发展，机构交易者们会反过来利用这些机会。因此，你不可能拥有一个胜率很高、盈利又远大于风险的交易机会。","pid":"p1524"},{"t":"para","text":"5.能够读懂价格图表本身就很不容易了，但这只是你赚钱所需要获取的能力的一部分。学会如何交易，是同样困难的。不管你用什么方法，成功的交易在现在或者未来，都是一件很困难的事情。如果一定要说有什么赚钱的秘，那么只要大家知道，就没有了对手盘，也没有了被套牢的对手将价格推向你的目标位。试想，如果你看了一本小提琴的书，然后就出去演奏，是否会有人付钱来听你的演奏会。仅仅明白一个事情的道理，并不代表你可以有效率地去做这件事，尤其是当这个事情是一件比较困难的事时。","pid":"p1525"},{"t":"para","text":"6.交易者需要数学上的优势来赚钱。在任何时候，市场上的多空头寸都存在这样或者那样的数学上的优势，但这些优势并不清晰和明显。一旦这个优势明显地展现出来，就会转瞬即逝。然而。这正是我们作为交易者需要去把握的机会。","pid":"p1526"},{"t":"para","text":"7.发现那些具备正的交易者方程结果的交易机会，是赚钱的核心能力。这些机会包括：在某根K线的上方买入并设置保护性止损，在其上方用限价单的形式卖出：在某根K线的下方卖出并设置保护性止损：在其下方用限价单的形式买入。","pid":"p1527"},{"t":"para","text":"8。在每一根K线结束后，交易者都要做出的一个决定是，在这根K线的上方是否会有更多的买盘力量，在这根K线的下方是否有更多的卖盘力量。这对突破形态尤其有用，因为一般紧接着的这根K线一般代表着总是在场策略的方向，价格可能会持续很多个点，而不是简单的一个刮头皮交易。","pid":"p1528"},{"t":"para","text":"9.每一次你在一根K线的上方带保护性止损地买入时，也有很多交易者在那里设置限价单卖出。当你在一根K线的下方设置限价单卖出时，很多交易者在那里带保护性止损地买入，成为你的对手方。所以，永远记住没有什么是确定的，你的优势永远很小，因为很多聪明的交易者很多时候的看法是与你相反的。","pid":"p1529"},{"t":"para","text":"10.任何K线，即便是一根强势的多头趋势K线，也有可能成为多头信号K线或者空头信号K线。用开放的心态期待所有可能性发生，包括与你操作的方向完全相反的可能。当这真的发生时，不要质疑或者否定眼前的事实，仅仅客观地读图表，并且交易它。","pid":"p1530"},{"t":"para","text":"11.每次你根据一个信号K线提示的机会入场时，总是想想，如果未来市场朝着你相反的方向发展，例如突破信号K线的另一端，你应该如何应对。很多时候，看起来是一个多头入场信号，实际上却是一个强烈的空头入场信号，因为很多多头都被迷惑进入了陷阱，然后不得不在信号K线的下方平仓止损，从而带来一波向下的趋势。","pid":"p1531"},{"t":"para","text":"12.如何判断一根趋势K线是否能带来接下来的突破成功。是非常关键的交易技能。交易者要学会判断一个突破能否成功，接下来是会有获利回吐性质的回调，还是会突破失败反转。","pid":"p1532"},{"t":"para","text":"13.寻找市场处于强势还是弱势的迹象，用于判断你的优势的大小如果你发现市场正在准备有所行动，那么评估这一可能性的强弱。如果市场没有展现出其应该有的强势，那么这个入场信号就可能会很弱。","pid":"p1533"},{"t":"para","text":"14.当你对你的入场信号很有信心，并且认为自己很有优势时，不要跟随信号入场。你可能忽略了什么。你忽略了对你的对手的了解。要记得你的对手至少跟你一样聪明。保持谦虚。因为自大会带来你对自己胜率的过度高估，带来一个高估的交易者方程式，而最后这会导致你的失败。","pid":"p1534"},{"t":"para","text":"15.生活大部分时候并不是看起来的那样。实际上，著名的数学家查尔斯·鲁特维奇·道奇森并不是他看起来的那样。大家更为熟悉的是他的另外一个名字刘易斯·卡罗尔。我们就好像在爱丽丝仙境中工作，很多东西都不是真实的。市场的上涨不代表着未来就会上涨，下跌不代表着真正处于下跌趋势。去看看那些即便是看起来最强的震荡区间的突破，他们很多时候也会失败。上涨实际上是下跌的开始，而下跌也有可能实际上只是上涨的一部分。而我们交易者方程式中胜率的60%也可能只是在90%的情况下是60%，而可能会是90%或者10%。如果一个好的入场信号的胜率是60%，那么你如何能够让自己在80%或者更多的时间里盈利？事实是这样的，如果你在刚好位于支撑位上方的强趋势中的回调中多头入场信号可能会在60%的时间里是有效的，也就是你的胜率是60%，但如果你能够随着市场的走低而倒金字塔地加仓，那么你可能会发现自己在80%或者更多的时间里，从60%胜率的交易机会中获利。另外如果你使用非常宽的止损，并且愿意经历持续数小时的大的浮亏，那么在电子迷你期货中，有60%的可能在亏掉两个点之前赚到两个点，那么就有90%的机会在亏掉八个点之前赚取四个点。如果你能够灵活处理胜率的变化，并能适应多种可能性并存的状态，那么你成功的概率就会大很多。","pid":"p1535"},{"t":"para","text":"16每天你能够持续做的，就是将自己从糟糕的交易中抽身出来。例如，如果你判断当前是一个区间震荡状态，那么就不要因为市场在区间顶部出现多头趋势K线或者高点1时买入，也不要因为市场在区间底部出现下跌趋势K线或者低点1而卖出。","pid":"p1536"},{"t":"para","text":"17.市场经常出现惯性，并且倾向于延续此前的状态。如果市场处于趋势中，那么80%的反转尝试都会失败。它可能是会形成一个整理的旗形形态，然后延续趋势。如果是常处于交易区间内。那么有80%的可能性试图进入趋势状态的突破都会失败。","pid":"p1537"},{"t":"para","text":"18.如果你曾经因为回调幅度过大而感到纠结，那么你可能是再去是已经反转时，并把它错误地看成了回调。","pid":"p1538"},{"t":"para","text":"19.如果你认为市场合理的方向应该是上涨，但它却给出一个很强的卖出信号，那么跟随这个信号。选择客观地跟随信号，而不是跟着你的预期或者希望走。因为市场保持非理性的时间比你具备偿付能力的时间要长得多（引自约翰·凯恩斯的话）。","pid":"p1539"},{"t":"para","text":"20.价格就是真相，不要去与市场雄辩。对于日内交易者来说，基本面几乎是毫无用处的。市场会告诉你它的走向，它无法隐瞒自己正在做的事情。你和电视上的专家都不知道市场会对基本面做出如何的反应，不过那些电视上的专家们在发言时都信心满满。由于市场中任何走势的确定性都很少超过60%，所以当电视里的专家非常肯定地发表观点时，他们忽略了数学概率，而概率是市场的最基本的特征。你追随的是一位无视市场运作机制的人，那么你肯定会赔钱。","pid":"p1540"},{"t":"para","text":"21.一切都是合理的，如果你知道如何阅读价格行为，那么就没有什么会令你感到奇怪。因为你明白市场正在做什么。初学者们能够在一天结束后的图表上看出来。我们的目标是学习如何足够快速地阅读图表，从而能够明白实时交易时发生了什么。","pid":"p1541"},{"t":"para","text":"22.“那不公平！”如果这是你的感受，就暂时休息下，不要进行交易。你的感觉或许是正确的，眼前的一切确实是不公平的。但那是因为这一切都是以数学方程式为基础，公平从来就不是其中的一个变量。如果你因为公平而感到担心，那么你并没有与市场同步。计算机程序控制着所有的市场行为，他们没有公平这一概念，他们永远不会感到劳累，他们不记得上一笔交易是什么。由于他们能够赚钱，所以你需要模仿他们的品质。他们不能掩饰自己正在做什么，那么你的工作就是去看出他们正在做什么，然后复制操作。是的，你将在他们入场后再入场，但他们会在你入场后继续入场，而且他们是驱动市场运动到足够远，带给你利润的力量。","pid":"p1542"},{"t":"para","text":"23.价格行为是以人类行为为基础的，所以有一个基因基础。这就是它为什么适用于所有国家的所有市场和所有时间框架的原因。它一直有效，而且会不可避免地影响人类的行为，至少会持续到我们演变为新的物种。","pid":"p1543"},{"t":"para","text":"24.总要在市场中设置好保护性止损，因为他会避免你遭遇作为交易者所要面临的最大的危险。那种危险不是市场，市场不在乎你是赢还是输，它永远不知道你的存在，也不会出来抓住你。那种危险是你自己，是你作为交易者的所有缺陷，包括否定、傲慢，以及纪律的缺乏。","pid":"p1544"},{"t":"para","text":"25.独立思考是非常难做到的一件事。失败者们会充满宗教热情地去寻找能够让他们免于亏损的救世主。这可能是获得了令人美慕的资格证书的电视上的专家们，他们自信而又令人印象深刻；也可能是著名的交易快讯的作者，专题聊天室的主持人、某个市场指标，或者其他的外在的偶像。失败的交易者期待救世主们会把力量注人他们心中，把他们带到圣地去。然而，事实上他们会慢慢地把你账户里最后一美元给吸干在你能做到自己独立做分析并且忽略所有承诺让你成功的外界影响之前，你很难实现真正的盈利。相反地，这些救世主们都是在为他们自己赚钱，而不是为你。电视专家们希望确立自己的可信性，以便销售自己的服务而获得晋升，电视台是通过广告来赚钱的，聊天室和撰写交易快讯的人们，卖的也是他们的服务，给你提供指标的软件公司为了收取你的费用。长期来看，没有人打算帮助你，所以绝对不要自欺欺人地认为那些好人会帮助你赚钱","pid":"p1545"},{"t":"para","text":"26.言者不知，知者不言。不要看电视也不要看新闻。","pid":"p1546"},{"t":"para","text":"27.如果你发现自己没有连续地做上几笔的电子迷你交易就亏损了，那么你的头寸规模可能是太大了。切换到交易100到300股标普500ETF（SPY），热切地至少做一些20到50美分的波段交易。虽然你不会变得多么富有，但是至少你可以赚到一些钱，而且树立自己的自信心。如果你认为自己能够在每笔交易中舒服地交易三张电子迷你合约，那么你应该只交易一张。这将使你非常容易选择信号，如果交易三张，你会错过很多好的信号，因为你实际上是在信号非常完美稀缺的情况下才能舒适地交易三张合约。你的交易规模需要你对任何合适的信号都感到舒适，并且在连续亏损两到三次后仍然保持舒适的状态，这种舒适状态的指标之一，就是你在亏损之后仍然有好的状态做下一笔交易的能力。如果你感到不太舒服，而且还是在等待那个完美的交易信号。那么你的交易规模可能还是太大了。一旦你开始对你的信号挑挑抹，那么你可能会走上破产之路。你的情绪是一种负担，给你的对手带去了优势，就像在任何比赛中一样。","pid":"p1547"},{"t":"para","text":"28.“我不在乎！”是最有用的咒语。我不在乎这笔交易是否亏损，因为我的交易规模非常小，亏损不会使我感到不安，也不会干扰我的判断。我不在乎电视上或者《华尔街日报》上的专家们在说些什么。我不在乎3分钟或者1分钟图上正在发生什么，也不在乎成交量图或者tick跳动图上正在发生什么，我不在乎错过那些图上正在产生的很棒的信号，原因是如果他们真的非常好，那么会在5分钟图上也能表现出来好的交易信号。我不在乎市场走势朝一个方向是否已经过度发展所以即将面临调整：我不在乎指标正在显示什么，特别是那些在巨大的趋势（期间还没有出现趋势线突破），中显示背离的那些弯弯曲曲的线，但是我非常在乎眼前的那张图表。在乎它正在告诉我什么。我还在乎我的交易规则，不允许外界因素影响我的规则告诉我的信息。","pid":"p1548"},{"t":"para","text":"29.如果你因为止损必须设得太远而不敢选择一个很棒的交易机会，那么就减少交易规模。可以减少到正常规模的四分之一，以便你的总资金风险不大于正常交易的总资金风险。你需要进入“我不在乎”状态，才能够选择那些交易。通过降低头寸规模，你就可以把自己的精力集中在那些入场信号的质量上，而不是全神贯注地去考虑如果交易失败，自己会亏损多少。不过，在调整到“我不在乎”的思维状态之前，首先要捕捉到好的交易机会，因为你不希望自己对资金变得无动于裹。以至于选择一些不是很强的入场信号而导致继续亏损。","pid":"p1549"},{"t":"para","text":"30.我们永远没办法评估什么时候市场是顶部或者底部。但唯一可以确定的是。市场走势是否已经过度。在大部分交易者认为反转将会发生之前。大部分的反转都需要市场走势先出现过度发展。市场的惯性只能通过过度发展来消除。","pid":"p1550"},{"t":"para","text":"31.要将手中现有的头寸反手是非常艰难的。对于大部分交易者来说，更容易做到的只是离场，哪怕是赔钱离场，然后寻找新方向的另一个入场信号。","pid":"p1551"},{"t":"para","text":"32.没有可靠的反转形态，所以，除非你是一位稳定获利的交易者，否则永远不要做逆势交易。只有当市场已经突破了原有的重要趋势线，而且信号预示着接下来总是在场策略的方向已经改变，你才能根据合理的入场信号进场交易。在强多头趋势中，当你在一条强空头反转K线的下方做空时，远比你聪明的交易者们正在用限价单的形式在你的信号K线的低点买入。在强空头趋势中。当你使用是孙丹在一条多头反转K线的上方买入时，更聪明的交易者们正在你买入的位置做空。由于80%的反转都会失败，所以，你觉得谁正在赚钱？","pid":"p1552"},{"t":"para","text":"33.任何反转信号都是部分或者全部获利平仓的好理由，但如果你想入场做逆势交易，那么反转信号就必须很强。由于80%的反转都会失败，那么如果我们把每个顶部都看作是多头旗形的起点，每个底部看作是空头旗形的起点，要明智得多。","pid":"p1553"},{"t":"para","text":"34.太早总是比太迟更糟。由于大部分反转和突破都会失败，所有较早的入场很有可能会失败。由于大部分趋势会持续很长时间，所以较迟的入场可能仍然是一笔不错的交易。","pid":"p1554"},{"t":"para","text":"35.所有形态都可能会失败。而我们认为失败的形态却常常再次面临失败。失败在原来方向上形成一个突破后的回调，具有更高的胜率。","pid":"p1555"},{"t":"para","text":"36.当你看到一方突然被套时，那么反向刮头皮交易的可靠性就会上升。当你入场时，被套的交易者们将被迫离场，在他们再次继续原来方向的交易时，他们可能需要等待更多的价格行为支持他们的交易，所以这时市场中剩下的交易者的方向与你相同。","pid":"p1556"},{"t":"para","text":"37.看到交易者们被止损猎杀套出交易之外，我们可以看到与他们被套人某个交易之内时同样可靠的信号。如果市场突然猎杀止损，然后恢复趋势，那么这是一种可靠的交易信号，至少可以产生一笔刮头皮交易的利润。","pid":"p1557"},{"t":"para","text":"38.等待。如果市场在30到60分钟内都没有给出任何信号，而你发现自己正在查看电子邮件。或者正在与上大学的女儿通电话时。市场突然形成一条大型的多头趋势K线，突破了交易区间，那么你还是需要等待。你已经与市场失去了联系，它正试图把你套入一笔交易。永远不要快速决定下单。尤其是在突然出现的大型趋势K线之后。如果它最终成为一笔很棒的交易，而你错过了它，但你仍然是在前进的。因为如果你在那种环境下交易时，概率是对你不利的。是的，有些会成为盈利的交易，但如果你能回顾一下自己所有此类交易，你会发现自己是赔钱的。","pid":"p1558"},{"t":"para","text":"39.不要被迫交易。作为一名交易者，你的目标是赚钱，而不是做交易。所以仅当某个交易机会帮你实现自己的目标时，才做交易。一天当中还会出现很多其他的信号，所以要等待一个好的信号，而当你错过好的交易时，也不要感到不安。很多初学者都喜欢兴奋，倾向于过度交易，很多伟大的交易者发现，交易是孤独，无聊的，但确实可以赚大钱的。每个人都希望交易，但你只应该去做那些可以赚钱的交易，而不是因为一两个小时没下单了而去交易。","pid":"p1559"},{"t":"para","text":"40交易是一件越简单越好的事情。你不需要指标，你应该只观察一张图表。如果你不能通过一张没有指标的图表来赚钱，那么增加更多的东西来分析，只会使交易更难。另外，只交易最好的那些入场机会，直到你能够稳定盈利。使用两张图表的最大问题是，有一种自然倾向你会选择两个图表中同时出现的信号，但这种情况很少发生。结果你拒绝了当天大部分很棒的信号，原因是第二张图表上没有出现信号，或者信号出现在两个跳动之前。例如，你在5分钟K线图上看到市场出现了一个高点2回调至指数移动平均线附近的入场做多机会，然后观察2分钟或者3分钟的K线图，发现它在两个跳动之前给出了信号，你可能不会跟随5分钟的图表入场，因为你担心这波多头运动会在2分钟的短线目标位停止，达不到5分钟的目标位。","pid":"p1560"},{"t":"para","text":"41.决定交易是你的爱好还是工作。如果是一种爱好，那么请另外找一种吧。因为这是个太昂贵的爱好，它具有很危险的上瘾性。所有伟大的交易者都会对交易上瘾，但是大部分交易的瘾君子最终的结果都是破产。","pid":"p1561"},{"t":"para","text":"42.作为初学者，可以从5分钟图开始交易，在市场回调时入场，并设置好止损价位。当市场处于一轮多头趋势中时，准备在均线处的多头K线上方买进：当市场处于一轮空头趋势中时，准备在均线处的空头K线下方做空。使用限价单在前一趋势极点附近的利润目标处全部或者部分了结仓位，然后把剩余的仓位的保护性止损移动至盈亏平衡点。","pid":"p1562"},{"t":"para","text":"43.一开始，你应该考虑交易标普500ETF（SPY）而不是电子迷你期货。一张电子迷你期货合约等同于500股SPY，交易200到500股SPY允许你把部分交易波段化时逐步出场，而不会招来太多的风险。一旦你达到1000到1500股SPY，如果你认为自己将继续加大头寸时，可以切换到电子迷你期货。因为在这种规模下，你可以在电子迷你期货市场逐步平仓或者继续加大仓位。而不会受到平仓滑点的影响。","pid":"p1563"},{"t":"para","text":"44.低买高卖。当然明确且强劲的趋势市场中除外（我的第一本书的第一部分就是关于趋势的）。在多头趋势中，在高点2的回调时买入，即便它是在当日的高点：在空头趋势中，在低点2反弹时卖空。不过是从在大部分时间里都是处于区间震荡状态。举例说明，如果市场已经上涨了几根K线。并且在当前一大浪的顶部出现了一个新的买入信号。那么你应该问一下自己。市场是否处于我的书中描述的非常确定而且强劲的多头趋势形态中。如果你不能说服自己它是，那么就不要在高点买进，即便动能看起来很棒，但你被套的概率很高。记住沃伦·巴菲特的一句老话，“在别人贪婪时恐惧，在别人恐惧时贪婪。”","pid":"p1564"},{"t":"para","text":"45.对于媒体和新手交易者来说，最重要的两种感觉是恐惧和贪婪而对稳定获利的交易者们来说，则没有这两种感觉。他们最重要的两种感觉就是不确定性（混乱）和紧迫性。他们利用这两种感觉来赚钱。每一根K线以及市场的每一个片段，要么是趋势，要么是区间震荡。当交易者感觉确定时，市场是出于强趋势中。当他感觉到紧迫感时，比如他想要在市场上涨时买入，或者市场下跌时做空，但他非常希望出现回调那么市场就是处于一轮强趋势中。它至少会在市价买进一小部分头寸，而不是完全等待市场出现回调。","pid":"p1565"},{"t":"para","text":"46.当交易者不确定或者感到迷感时，市场处于交易区间内，他应该只用低买高卖的策略。如果他想要做很多交易，那么就只能做刮头皮交易。不确定性意味着市场包含大量的双向交易，所以可能正在形成一段交易区间。由于大部分的突破尝试都会失败，因此如果你感到不确定，那么就在市场上涨了5到10根K线时只准备做空，下跌5到10根K线时只准备买进。","pid":"p1566"},{"t":"para","text":"47.当处于震荡区间内时，低买是指如果市场靠近区间底部。而你持有空头头寸，那么你应该将其平仓获利。如果出现一个强烈的买进信号，那么你可以建立多头头寸。类似地，当市场接近区间顶部时，你可以高卖。这种卖出可能是多头的获利平仓，也可以是当出现做空信号时建立新的空头头寸。","pid":"p1567"},{"t":"para","text":"48.好的成交价位可能代表不好的交易。当市场让你在一个比你预期好的价位让你入场和出场时，那么就要怀疑是不是哪里有问题了。不过，一笔好的交易也并不是坏的成交价的必然结果。","pid":"p1568"},{"t":"para","text":"49.开盘的一两个小时通常是最容易赚钱的时间段，原因是波段通常比较大，而且没有多少十字星K线。第一个小时也是最容易赔钱的时间段，原因是你过度自信地认为这很容易，而不遵守自己设定的规则。第一个小时通常有很多反转，所以，耐心地等待波段架构，那产生成功率不到50%但回报至少是风险的两倍的交易。经验丰富的交易者们可以做刮头皮交易。如果不遵守自己的规则并已经产生了亏损，那么你就错过了当前最容易赚钱的时间，那就意味着当你希望在当天接下来又慢、活力性又低的交易中试图返回盈亏平衡的状态，你将一直是不高兴的。","pid":"p1569"},{"t":"para","text":"50.如果当天你已经亏损，现在是下半个交易时段，那么你就好像是在流沙中游泳一样——你越努力，却陷得越深。甚至伟大的交易者在有在流沙中游泳一样些交易日也与市场失去了情绪上的联系，他们偶尔也会亏损，尽管在一天结束后打印出来的5分钟K线图上看起来事情其实很清晰。这时最明智的做法就是确保自己能够收盘前遵守设定的规则，那么可能会扳回一些损失。最糟糕的做法就是调整自己的交易风格，这可能是你整天继续亏损的原因。不要增加自己的头寸规模，也不要交易低胜率的信号。如果你有一种赚钱的模式，那么就坚持使用，可能明天损失就赢回来了使用不同的方法，只会让你亏损更多而找不到方向。","pid":"p1570"},{"t":"para","text":"51.当市场处于日波动区间的中间部分时，初学者应该避免在一天的中间时段交易，特别是当均线斜率相对水平、交易区间紧凑，而且有一些突出的上下影线（好像带着刺铁丝的网一样）。当你打算交易时，总要问你自己是否这个入场信号是当天最好的信号之一。这是机构投资者们一直在等待的那个交易信号吗？如果答案是否定的，而且你还没有实现稳定盈利之前，你不应该做那笔交易。","pid":"p1571"},{"t":"para","text":"52，紧凑交易区间是最差的止损入场环境。机构正在做相反的事情，如果你坚持交易，希望趋势即将开始，那么你会不断止损。","pid":"p1572"},{"t":"para","text":"53．紧凑的交易区间会战胜一切。这意味着他比你不得不买进或者卖出的每一条好的理由都更加重要。除非你是一位很棒的交易者，否则一旦你察觉到紧凑的交易区间正在形成。那么强制要求自己不要做任何交易，哪怕一停就是几小时。","pid":"p1573"},{"t":"para","text":"54.每一根K线和每一系列K线，要么是趋势，要么是震荡交易区间。做出一个判断。决定目前总是在场策略的方向，并且只做这一个方向的交易，直到总是在场策略的方向有所改变。在一天当中，特别是在太平洋标准时间上午八点半左右，你需要决定当天走势类似于我的书中描述的哪一个趋势形态。如果类似。而且你准备交易，那么你必须选择每一个顺势交易的机会。如果还没有选择所有顺势交易的机会，那么就不要考虑逆势交易。","pid":"p1574"},{"t":"para","text":"55.最好的信号K线是与你交易方向相同的趋势K线。十字星K线代表着一根K线组成的震荡交易区间，所以通常是糟糕的信号K线。如果你在交易区间上方买进，或者交易区间下方卖出，通常都会带来亏损。","pid":"p1575"},{"t":"para","text":"56.大部分逆势交易的信号最终都会失败，大部分顺势交易的信号都会成功。做好数学计算，决定你应该交易哪一个信号。趋势常常会形成看起来很漂亮的逆势交易的信号，和非常不好看的顺势交易的信号。如果你逆势交易，那么你就是在赌博，虽然你经常获胜并沉迷于这种乐趣，但从数学概率来说，你长期是没有优势的，慢慢地你肯定会破产。强趋势中的逆势交易信号，几乎总是失败，而很棒的顺势交易机会也是存在的，特别是在1分钟K线上。","pid":"p1576"},{"t":"para","text":"57.在你停止做逆势刮头皮交易之前，很难真正实现稳定获利。你的盈利只是足以让你存活一段时间，让你有兴趣提高自己的交易技术。但长期来说，你的账户会慢慢被磨损掉。记住，在很多交易信号中，你的风险一般来说跟你的目标利润一样大，所以，在四次亏损后，通常需要六次盈利你才能回到盈亏平衡的状态。这是让人非常沮丧的。实际上，只有当你能够在60%的时间盈利时，你才应该做刮头皮交易，大部分交易者应该避免做那些潜在回报不如风险大的交易。初学者如果想做的话，只应该做顺势的那些刮头皮交易。","pid":"p1577"},{"t":"para","text":"58.在你稳定获利之前，只有选择那些潜在回报至少与风险一样大的交易。在电子迷你中，如果你需要承担两个点的风险，那么在至少获得两个点的利润之前。不要获利了结。大部分交易者不应该为了小于风险的回报而刮头皮，因为即便60%的交易盈利，他们也会赔钱。记住交易者的方程式。胜率乘以潜在回报，必须略大于败率乘以风险。你不能冒着两个点的风险去博取一点的利润，并且希望获利，除非你至少在80%的时间里是正确的。很少有交易者能够做到这一点。","pid":"p1578"},{"t":"para","text":"59.交易者方程式有三个变量，结果为正的任意架构都是好的交易。这可能是一笔胜率很高，回报只与风险相等的交易，也可能是一笔胜率较低，但回报比风险大很多的交易，也有可能是两者之间的任意一种情况。","pid":"p1579"},{"t":"para","text":"60.经验丰富的交易者。可以利用逐步入场和逐步出场来提升自己的交易者方程式。举例来说，初始入场可能有一个比较低的胜率，但随后的入场可能有明显高的胜率，从而通过分批入场提高了整个头寸的交易者方程式。","pid":"p1580"},{"t":"para","text":"61.在你开始在回调时做顺势交易之前，你不会赚钱。","pid":"p1581"},{"t":"para","text":"62.如果你要做反转交易，那么必须等待重要趋势线突破、并出现回踩来测试趋势极点的强反转K线的出现，否则你没办法通过反转交易来赚钱。","pid":"p1582"},{"t":"para","text":"63.除非你知道自己在做什么，否则你也很难赚钱。每天打印出电子迷你期货的5分钟K线图（如果交易股票的话，就打印股票图表），然后把你看到的每一个入场信号都画在图表上。当你看到若干价格行为特征时，把它们都写在图表上。年复一年日复一日地这样做，直到你能够观察任意图表的任意一部分，就知道整个市场在发生什么。","pid":"p1583"},{"t":"para","text":"64在你足够了解自己个性并找到一种适合自己个性的交易风格之前，长期来讲你很难实现稳定盈利。你需要舒服地遵循自己的规则，让自己在入场和出场时没有或者只有很微小的不确定性和紧张感。即便你认为自己已经掌握了一种交易方法，如果你在交易时感到紧张，那么你就还没有找到适合自己的交易风格，没有找到自我。","pid":"p1584"},{"t":"para","text":"65.如果你没有纪律性，在最后的一两个小时去做那些开盘一两个小时内绝不会做的交易，那么你很难赚钱。你很容易就把当天开盘时赚的钱都吐回去，因为那些盈利的交易让你自以为是地认为自己很聪明。","pid":"p1585"},{"t":"para","text":"66.你必须认识到，你在与计算机竞争。他们拥有速度优势，所以最好不要在股票公布季报期间交易，因为这时他们的速度优势最明显。他们还拥有不受情绪影响的优势，所以你要避免在心神不宁时交易。而且，他们拥有永远不会劳累的优势，所以不要在疲劳时交易，那常常发生在一天收盘前。","pid":"p1586"},{"t":"para","text":"67.总是要寻找二次入场机会。当市场尝试做两件事，两件事都失败时，那通常是一个可靠的信号，而市场做相反的事情时很可能成功。","pid":"p1587"},{"t":"para","text":"68.绝不要过分挑挑抹，因为你难免会选到足够多不好的交易。结果成为一个失败的交易者。好交易经常会令你吃惊地突然出现，但却又转瞬即逝。剩下的都是一些不那么好的交易机会以及很糟糕的交易机会。要么做波段交易，只选择一天中最好的两三个交易机会，要么做刮头皮交易，选择每一个交易机会。不过后者是一种更难的方案，因为这只适合少数非常具备相应特质的人们（甚至比大部分交易者都超常）。","pid":"p1588"},{"t":"para","text":"69.寻找盈利交易很容易，但避开亏损交易很难。成功的关键就是避开亏损的交易。每天的盈利交易可能要比亏损交易多很多，但几笔亏损交易就会毁掉一天的工作，所以要学会事先找出它们并且避开。大部分交易亏损出现在：震荡区间的中部、信号K线很弱，如收盘于K线中间部分的十字星K线：当你在可能的反转过早入场时（记住，当你不确定时，等待二次入场机会）；当你拒绝承认一波趋势，认为它已经走得过了头，于是开始选择1分钟或者3分钟的短线反转信号入场时，而反转最终失败并转变成很棒的顺势交易信号（他们通常那样）；或者，当一位来自顶级公司的、非常可信的、拥有资格证书的技术分析师在电视上声明市场正在触底时，你只看那些买入的信号，那样难免会失败。因为专家实际上是不会交易的，他们如果会交易，就去做交易了，而不是在电视上发表言论。","pid":"p1589"},{"t":"para","text":"70.如果你正在持仓，而市场的走势跟你的预期不一致，那么你应该离场吗？观察一下市场，假设自己是空仓状态，如果你认为自己此时会做那笔交易，那么就坚持持有。如果你认为自己不会做那笔交易，就离场吧。","pid":"p1590"},{"t":"para","text":"71.当你应该做波段交易时，不要做刮头皮交易。当你应该做刮头皮交易时，不要做波段交易。在你稳定获利之前，你应该保证自己的交易尽可能地简单，一天只做一到三笔波段交易，而不要刮头皮。为了成功地刮头皮，你通常不得不承担与收益一样大的风险，那需要60%以上的交易是盈利的。在你成为一位稳定获利的交易者之前，不要妄想自己可以做到。","pid":"p1591"},{"t":"para","text":"72.如果你发现自己常常做波段交易，但很快又把他们转变成刮头皮交易，你可能会赔钱。当你做波段交易时，你愿意接受比较低的胜率，但为了通过刮头皮交易赚钱。你需要很高的胜率。类似地，如果你做刮头皮交易，但频繁地以小于风险的利润提前退出，那么你将会赔钱。如果你不能按照计划止损退出，那么就用双向订单来帮你自动执行，而且在入场后自己离开电脑一个小时左右。","pid":"p1592"},{"t":"para","text":"73.如果你上个月亏损，那么就不要做任何反转交易。如果过去10根K线中有差不多7根K线都在均线上方，那么不要准备做空；相反地，你应该只买进。如果过去10根K线中有7根K线差不多都在均线下方，那么不要准备买进。相反地，应该只准备做空。","pid":"p1593"},{"t":"para","text":"74.初学者应该只选择最好的交易。连续两三个小时町着屏幕而不交易是很难的，但对初学者来说，这却是赚钱的最好方法。","pid":"p1594"},{"t":"para","text":"75．纪律是盈利交易者们最重要的特征。交易很容易理解，但却很难做。遵循简单的规则是非常困难的，甚至偶尔的自我放纵都会成为失败的原因。对于一次击球，任何一个人都可以像老虎伍兹（TigerWoods）那样坚强，但很少人能够在整个比赛中都保持那样坚强，在生命的每一天都那么坚强。每个人都知道坚强和纪律是什么，也能够偶在每天的活动中，保持坚强并遵守纪律，但很少人能真正理解，要成为一名伟大的交易者，需要多么极端的坚强。培养只选择最佳交易的纪律。如果你不能一整天都做到，那么就强迫自己在每天的第一个交易小时那样做，随着你的头寸规模的增加，你可能会发现这就是成为成功交易者的必须因素。","pid":"p1595"},{"t":"para","text":"76.伟大交易者的第二个重要品质就是连续几个小时什么都不做的能力，不要让无聊战胜自己，不要因为很长时间没交易而去交易。","pid":"p1596"},{"t":"para","text":"77.致力于增加自己的交易规模而不是交易信号或者模式的种类。在电子迷你期货交易中，你只需要每天赚两个点就可以做得非常好。（50张合约的每天两个点，一年便是七位数字的收入）。","pid":"p1597"},{"t":"para","text":"78.如果你的交易技能已经完美。那么你所赚到的钱远比你想象的要多得多，你将有能力去过你梦想中的生活。","pid":"p1598"}],"wcount":12453}],"wcount":102129}]</script>
<script>
const DATA = JSON.parse(document.getElementById('sitedata').textContent);
const paper = document.getElementById('paper');
const toc = document.getElementById('toc');
const searchInput = document.getElementById('search');

// total words across all chapters
const totalWc = DATA.reduce((a,c)=>a+(c.wcount||0),0);
document.getElementById('totalWords').textContent = `全书约 ${totalWc.toLocaleString()} 字 · ${DATA.length} 篇`;

// escape
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// 图号 → 图片锚点映射（img 后紧跟 cap，数据层已打 fid/fig）
const figAnchors = {};        // '图1-1' -> fid
const figIndex = [];          // [{num, cap, fid}]
DATA.forEach(ch=>{
  const collect=bs=>(bs||[]).forEach(b=>{ if(b.t==='img'&&b.fid){
    const num=b.fig||b.ilabel||'';
    const cap=b.cap||b.icap||'';
    figIndex.push({num:num, cap:cap, fid:b.fid});
    if(b.fig && !figAnchors[b.fig]) figAnchors[b.fig]=b.fid;
    if(b.ilabel && !figAnchors[b.ilabel]) figAnchors[b.ilabel]=b.fid;
  }});
  collect(ch.blocks); (ch.sections||[]).forEach(s=>collect(s.blocks));
});
// 正文里的「图X-Y」→ 可点击跳转。先转义，再把图号替换为 <a>
const FIGRE=/图\s*\d+\s*[-－—]\s*\d+/g;
function linkFigNums(text){
  let out='', last=0, m;
  FIGRE.lastIndex=0;
  while((m=FIGRE.exec(text))!==null){
    out+=esc(text.slice(last,m.index));
    const key=m[0].replace(/\s/g,'').replace(/[－—]/g,'-');
    if(figAnchors[key]){

    } else {

    }
    last=m.index+m[0].length;
  }
  out+=esc(text.slice(last));
  return out;
}

// 将块序列渲染进容器：段落 + 紧随的图 → 左图右文并排
function renderBlocks(blocks, container){
  const arr=blocks||[];
  let i=0;
  while(i<arr.length){
    const b=arr[i];
    // 找「一个文字段 + 后面紧跟 img(可带 cap)」的组合
    if((b.t==='para') && i+1<arr.length && arr[i+1].t==='img'){
      const row=document.createElement('div'); row.className='fig-row';
      const figBox=document.createElement('div'); figBox.className='figmedia'; // 左侧图片容器
      const txtBox=document.createElement('div'); txtBox.className='fig-text';
      // 右栏：连续收集文字段，直到遇到图
      txtBox.appendChild(renderBlock(b));
      let j=i+1;
      // 左栏：图 + 其图注
      figBox.appendChild(renderBlock(arr[j])); j++;
      if(j<arr.length && arr[j].t==='cap'){ figBox.appendChild(renderBlock(arr[j])); j++; }
      // 右栏吃光「图后面直到下一张图前」的所有文字段。
      // 本书结构为：引用段 → 图 → "本图的深入探讨" → 深入内容，
      // 这些都必须显示在图的右侧（图片 sticky 固定、右栏滚动），不能散落到图下方。
      // 边界：遇到引用「下一张图图号」的段落则停（不含该段），避免把下一图的讲解串进来。
      let nextFig='', nextFigDot='';
      for(let k=j;k<arr.length;k++){if(arr[k].t==='img'&&arr[k].fig){nextFig=arr[k].fig;nextFigDot=nextFig.replace(/-/g,'.');break;}}
      while(j<arr.length && arr[j].t!=='img'){
        const seg=arr[j];
        if(nextFig && seg.t==='para' && seg.text && (seg.text.indexOf(nextFig)>=0||seg.text.indexOf(nextFigDot)>=0) && txtBox.children.length>1){break;}
        txtBox.appendChild(renderBlock(seg)); j++;
      }
      row.appendChild(figBox); row.appendChild(txtBox);
      container.appendChild(row);
      i=j; continue;
    }
    container.appendChild(renderBlock(b));
    i++;
  }
}

function renderBlock(b){
  if(b.t==='img'){
    const f=document.createElement('div'); f.className='figure';
    if(b.fid) f.id=b.fid;
    if(b.ilabel) f.dataset.label=b.ilabel;
    if(b.ctx && b.ctx.length) f.dataset.ctx=JSON.stringify(b.ctx); // SPLITCTX-FIX-v1
    const alt=b.cap||b.icap||'K线图';
    let html=`<img loading="lazy" src="${b.src}" alt="${esc(alt)}">`;
    if(b.ilabel){ html=`<span class="fig-tag">${esc(b.ilabel)}</span>`+html; }
    if(b.fig){
      html+=`<button class="fig-back" data-back="${b.fig}">↩ 回到正文提到「${b.fig}」处</button>`;
    }
    f.innerHTML=html;
    return f;
  }
  if(b.t==='cap'){
    const p=document.createElement('p'); p.className='cap'; p.dataset.pid=b.pid||('p'+(paraCounter++)); p.textContent=b.text; return p;
  }
  const p=document.createElement('p'); p.className='para'; p.dataset.pid=b.pid||('p'+(paraCounter++)); p.innerHTML=linkFigNums(b.text); return p;
}
function plainText(blocks){
  return blocks.filter(x=>x.t==='para'||x.t==='cap').map(x=>x.text).join(' ');
}

/* ===== EXCERPT-ORDER-v1 摘录原文排序 ===== */
function _pidNum(pid){
  var m=/(\d+)/.exec(String(pid||'')); return m?parseInt(m[1],10):-1;
}
function _excerptCmp(a,b){
  var pa=_pidNum(a.pid), pb=_pidNum(b.pid);
  if(pa!==pb) return pa-pb;                    // 段落全局顺序
  var sa=(a.so==null?0:a.so), sb=(b.so==null?0:b.so);
  if(sa!==sb) return sa-sb;                     // 段内字符偏移
  return (a.time||0)-(b.time||0);               // 兜底：时间
}
function sortByDocOrder(arr){ return arr.slice().sort(_excerptCmp); }

/* ===== PID-FIX-v1 旧数据自愈：给空 pid 摘录反查补 pid ===== */
function healMissingPid(){
  try{
    var raw=localStorage.getItem('pa-excerpts-v1'); if(!raw) return;
    var arr=JSON.parse(raw||'[]'); if(!arr||!arr.length) return;
    var bad=arr.filter(function(x){return x && !x.pid;});
    if(!bad.length) return;
    var nodes=[].slice.call(document.querySelectorAll('[data-pid]'));
    if(!nodes.length) return;
    function norm(s){return String(s||'').replace(/\s+/g,'');}
    var changed=false;
    arr.forEach(function(x){
      if(!x || x.pid) return;
      var needle=norm(x.text||'').slice(0,16);
      if(!needle) return;
      for(var i=0;i<nodes.length;i++){
        var el=nodes[i]; var full=norm(el.textContent||'');
        var k=full.indexOf(needle);
        if(k>=0){
          x.pid=el.getAttribute('data-pid');
          x.so=k; x.eo=k+String(x.text||'').length;
          changed=true; break;
        }
      }
    });
    if(changed){
      // 用有序插入重建，保证存储顺序即原文顺序
      var sorted=sortByDocOrder(arr);
      localStorage.setItem('pa-excerpts-v1',JSON.stringify(sorted));
      excerpts=sorted;
      if(typeof renderNotes==='function') renderNotes();
      if(typeof updateNoteCount==='function') updateNoteCount();
    }
  }catch(e){}
}
/* 延迟一拍执行，确保正文段落已渲染；幂等，无坏数据时会自行返回 */
setTimeout(function(){try{healMissingPid();}catch(e){}}, 60);

function insertByOrder(exc){
  var i=0; while(i<excerpts.length && _excerptCmp(excerpts[i],exc)<=0) i++;
  excerpts.splice(i,0,exc);
}

const selbar=document.getElementById('selbar');

function getChapterInfo(node){
  let el=node.nodeType===3?node.parentElement:node;
  const spBox=el&&el.closest?el.closest('#spTxt'):null;
  if(spBox) return {ch:spBox.dataset.ch||'', sec:spBox.dataset.sec||''};
