<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- MOBUI-v1 -->
<!-- ICONV2-v1 -->
<!-- ICONPUB-v1 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- PWA-v1 -->
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0E9488">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PA阅读">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/vviptl629-bot/pa-icons/main/apple-touch-icon.png?v2">
<title>高级反转技术分析 · 读书笔记</title>
<link rel="icon" href="https://raw.githubusercontent.com/vviptl629-bot/pa-icons/main/icon-192.png?v2">
<style>
html{
  --bg:#ffffff; --panel:#f5f6f7; --panel2:#eceef0; --line:#c9ced4;
  --text:#111418; --muted:#555e68; --accent:#0E9488; --deep:#0E9488;
  --amber:#a16207; --green:#15803d;
  --topbar-bg:rgba(255,255,255,.94); --para:#1a1f24;
  --mark-bg:rgba(14,148,136,.08); --badge-bg:rgba(14,148,136,.08); --badge-border:#0E9488;
  --img-shadow:0 2px 10px rgba(0,0,0,.12); --overlay:rgba(0,0,0,.35);
  --mark-text:rgba(251,191,36,.35);
}
:root{--sidebar:280px; --topbar:56px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.85;-webkit-font-smoothing:antialiased;
}
/* ---------- Top bar ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;height:var(--topbar);z-index:50;
  background:var(--topbar-bg);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 20px;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
.brand .mark{
  width:30px;height:30px;border-radius:8px;background:var(--accent);color:#08110f;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;
}

.lib-btn{flex:none;display:inline-flex;align-items:center;gap:5px;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;transition:background .18s}
.lib-btn:hover{background:rgba(14,148,136,.08)}
@media(max-width:720px){.lib-btn{padding:5px 9px;font-size:12px}}

.brand .sub{color:var(--muted);font-weight:400;font-size:13px}
.searchwrap{margin-left:auto;position:relative}
.searchwrap input{
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:8px 12px 8px 34px;width:230px;font-size:14px;outline:none;
  transition:border-color .2s;
}
.searchwrap input:focus{border-color:var(--accent)}
.searchwrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);stroke:var(--muted)}
.menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:6px 10px;font-size:18px;cursor:pointer}
/* ---------- Layout ---------- */
.layout{display:flex;padding-top:var(--topbar);min-height:100vh}
.sidebar{
  position:fixed;top:var(--topbar);bottom:0;left:0;width:var(--sidebar);
  background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:16px 0 40px;z-index:40;
}
.sidebar::-webkit-scrollbar,.main::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb,.main::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.toc-hint{font-size:11px;letter-spacing:2px;color:var(--muted);padding:6px 20px 12px;text-transform:uppercase}
.toc-ch{margin-bottom:2px}
.toc-ch-title{
  display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;
  font-weight:600;font-size:14px;user-select:none;color:var(--text);
}
.toc-ch-title:hover{background:var(--panel2)}
.toc-ch-title .num{
  flex:none;width:24px;height:24px;border-radius:6px;background:var(--panel2);
  color:var(--accent);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700;
}
.toc-ch-title .name{flex:1;line-height:1.35}
.toc-ch-title .arrow{transition:transform .2s;color:var(--muted);font-size:12px}
.toc-ch-title .wc{flex:none;font-size:10.5px;color:var(--muted);font-weight:400;opacity:.8}
.toc-total{font-size:11.5px;color:var(--muted);padding:0 20px 12px;line-height:1.6}
.toc-ch.closed .arrow{transform:rotate(-90deg)}
.toc-ch.closed .toc-secs{display:none}
.toc-secs{padding:2px 0 6px}
.toc-sec{
  display:block;padding:6px 20px 6px 54px;font-size:13px;color:var(--muted);
  cursor:pointer;line-height:1.5;border-left:2px solid transparent;
}
.toc-sec:hover{color:var(--text);background:var(--panel2)}
.toc-sec.lvl2{padding-left:70px;font-size:12.5px}
.toc-sec.active{color:var(--accent);border-left-color:var(--accent);background:var(--mark-bg);font-weight:600}
.toc-sec.hidden{display:none}
.toc-sec .sec-wc{float:right;font-size:10.5px;color:var(--muted);opacity:.75;font-weight:400;margin-left:8px}
.toc-empty{padding:10px 20px;color:var(--muted);font-size:13px}
/* ---------- Main ---------- */
.main{margin-left:var(--sidebar);flex:1;padding:44px 24px 120px;min-width:0}
.paper{max-width:820px;margin:0 auto}
.chapter{margin-bottom:80px;scroll-margin-top:80px}
.chapter-head{margin-bottom:36px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.chapter-head .badge{
  display:inline-block;background:var(--badge-bg);color:var(--accent);
  border:1px solid var(--badge-border);border-radius:6px;padding:2px 10px;font-size:12px;
  letter-spacing:2px;margin-bottom:14px;
}
.chapter-head h1{font-size:30px;line-height:1.35;font-weight:800;letter-spacing:.5px}
.chapter-head .wcmeta{font-size:13px;color:var(--muted);margin-top:10px}
.chapter-head .wcmeta b{color:var(--accent);font-weight:700}
.toc-hint .total{display:block;letter-spacing:0;font-size:11px;color:var(--muted);margin-top:6px;text-transform:none}
.section{margin:0 0 38px;scroll-margin-top:80px}
.section h2{
  font-size:21px;font-weight:700;line-height:1.5;margin:0 0 18px;
  padding-left:14px;border-left:3px solid var(--accent);
}
.section.lvl2 h2{font-size:18px;border-left-color:var(--deep)}
.para{margin:0 0 18px;color:var(--para);text-align:justify}
.cap{
  font-size:13px;color:var(--muted);text-align:center;margin:6px 0 26px;
  padding:0 16px;line-height:1.7;
}
/* FIGFLOW-v1 流式图文：图全宽在上、正文照常排在下方；点击图片进分屏 */
.fig-row{display:block;margin:22px 0 26px}
.fig-row>.figmedia{max-width:100%;margin:0 0 18px}
.fig-row>.figmedia .figure{margin:0;text-align:center}
.fig-row .fig-text{min-width:0}
.fig-row .fig-text .para:last-child{margin-bottom:0}
.fig-row .figmedia .figure img{
  max-width:100%;width:auto;height:auto;border-radius:8px;background:#fff;
  border:1px solid var(--line);cursor:zoom-in;display:block;margin:0 auto;
  box-shadow:var(--img-shadow);
}
.fig-row .fig-back{margin-top:8px}
/* 独立图（无配对段落）正常居中 */
.fig-tag{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);
  background:var(--badge-bg);border:1px solid var(--badge-border);border-radius:5px;
  padding:1px 8px;margin-bottom:6px;letter-spacing:.5px}
.figure{margin:22px 0 8px;text-align:center;cursor:zoom-in}
.figure img{
  max-width:100%;height:auto;border-radius:8px;background:#fff;
  border:1px solid var(--line);cursor:zoom-in;display:inline-block;
  box-shadow:var(--img-shadow);
}
@media(max-width:1100px){
  .fig-row{margin:18px 0}
  .fig-row>.figmedia{max-width:100%;margin:0 0 14px}
}
.top-para{margin:0 0 18px;color:var(--para);text-align:justify}
/* ---------- Search highlight ---------- */
mark{background:var(--mark-text);color:var(--amber);border-radius:3px;padding:0 2px}
/* ---------- Side tabs (目录/图表/摘录) ---------- */
.side-tabs{display:flex;gap:4px;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.side-tabs button{flex:1;background:none;border:1px solid var(--line);color:var(--muted);
  border-radius:7px;padding:7px 4px;font-size:12.5px;cursor:pointer;transition:all .15s}
.side-tabs button.on{color:var(--accent);border-color:var(--deep);background:var(--badge-bg);font-weight:700}
.side-panel{display:none}.side-panel.on{display:block}
/* figure index */
.figidx{padding:8px 0}
.figidx-hint{font-size:11.5px;color:var(--muted);padding:4px 20px 10px;line-height:1.5}
.fig-item{display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;
  padding:8px 20px;color:var(--text);border-left:2px solid transparent;font-size:12.5px;line-height:1.4}
.fig-item:hover{background:var(--panel2)}
.fig-item .fnum{color:var(--accent);font-weight:700;margin-right:8px}
.fig-item .fcap{color:var(--muted)}
.fig-item.hidden{display:none}
/* figure number links in text */
.figref{color:var(--accent);border-bottom:1px dashed var(--deep);cursor:pointer;padding:0 1px}
.figref:hover{background:var(--badge-bg)}
.figure.hl-flash{animation:figflash 1.6s ease}
@keyframes figflash{0%,100%{box-shadow:var(--img-shadow)}30%,70%{box-shadow:0 0 0 5px var(--accent),0 0 30px var(--accent)}}
.fig-back{display:block;margin:10px auto 0;font-size:12px;color:var(--muted);cursor:pointer;
  background:none;border:1px solid var(--line);border-radius:6px;padding:3px 12px}
.fig-back:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- Highlights / excerpt ---------- */
.hl-y{background:rgba(251,191,36,.42);border-radius:2px;padding:1px 0;cursor:pointer}
.hl-g{background:rgba(74,222,128,.38);border-radius:2px;padding:1px 0;cursor:pointer}
.hl-b{background:rgba(96,165,250,.32);border-radius:2px;padding:1px 0;cursor:pointer}
.hl-bold{font-weight:800}
.selbar{position:fixed;z-index:155;display:none;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:5px;gap:4px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.selbar.show{display:flex;flex-wrap:wrap;max-width:340px}
.selbar button{border:none;background:var(--panel2);color:var(--text);border-radius:7px;
  padding:7px 10px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:5px}
.selbar button:hover{background:var(--accent);color:#08110f}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.dot.y{background:#fbbf24}.dot.g{background:#4ade80}.dot.b{background:#60a5fa}
/* excerpt drawer */
.excerpt-item{position:relative;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.excerpt-item:hover{background:var(--panel2)}
.excerpt-item .etext{font-size:13px;line-height:1.7;color:var(--text);word-break:break-word}
.excerpt-item .emeta{font-size:11px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.excerpt-item .edel{color:var(--muted);border:none;background:none;cursor:pointer;font-size:14px;padding:2px 6px}
.excerpt-item .edel:hover{color:#f87171}
.excerpt-item .ecolor{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px}
.excerpt-empty{padding:30px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
.excerpt-tools{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.excerpt-tools button{flex:1;min-width:70px;background:var(--panel2);border:1px solid var(--line);
  color:var(--text);border-radius:7px;padding:7px;font-size:12px;cursor:pointer}
.excerpt-tools button:hover{border-color:var(--accent);color:var(--accent)}
.excerpt-search{margin:10px 16px 4px;width:calc(100% - 32px);background:var(--panel2);
  border:1px solid var(--line);color:var(--text);border-radius:7px;padding:8px 10px;font-size:13px;outline:none}
/* ---------- Lightbox ---------- */
.lightbox{
  position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:160;display:none;
  align-items:center;justify-content:center;padding:40px;cursor:zoom-out;
}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lightbox .close{position:absolute;top:20px;right:26px;font-size:34px;color:#fff;cursor:pointer}
/* ---------- Split reading mode (click image -> full-screen split) ---------- */
body.split-mode .sidebar{transform:translateX(-100%);pointer-events:none}
body.split-mode .main{margin-left:0}
.split-reader{
  position:fixed;inset:0;z-index:150;background:var(--bg);
  display:none;flex-direction:column;
}
.split-reader.show{display:flex}
.sp-bar{
  height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel);gap:16px;
}
.sp-title{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.sp-ctrl{display:flex;align-items:center;gap:8px;flex:none}
.sp-ctrl button{
  background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:6px 13px;font-size:17px;line-height:1;cursor:pointer;transition:all .15s;
}
.sp-ctrl button:hover{color:var(--accent);border-color:var(--accent)}
.sp-ctrl #spPos{font-size:12px;color:var(--muted);min-width:56px;text-align:center}
.sp-body{flex:1;display:flex;min-height:0}
.sp-img{
  flex:0 0 56%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px 22px;overflow:auto;
}
.sp-img img{
  max-width:100%;max-height:calc(100vh - 150px);width:auto;height:auto;object-fit:contain;
  border-radius:8px;background:#fff;border:1px solid var(--line);box-shadow:var(--img-shadow);
  display:block;cursor:zoom-in;
}
.sp-img .cap{margin:12px 0 0;max-width:100%;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
.sp-txt{flex:1;min-width:0;overflow-y:auto;border-left:1px solid var(--line);padding:34px 38px 90px}
.sp-txt .sp-label{font-size:12px;letter-spacing:1px;color:var(--accent);margin-bottom:20px;font-weight:700;line-height:1.6}
.sp-txt .para{font-size:17.5px;line-height:2.05;color:var(--para);text-align:justify;margin-bottom:20px}
/* ---------- Progress ---------- */
.progress{position:fixed;top:var(--topbar);left:0;height:2px;background:var(--accent);z-index:60;width:0}
/* ---------- Back to top ---------- */
.totop{
  position:fixed;right:24px;bottom:28px;width:44px;height:44px;border-radius:50%;
  background:var(--panel2);border:1px solid var(--line);color:var(--accent);
  font-size:20px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:30;
}
.totop.show{display:flex}
/* ---------- Mobile ---------- */
@media(max-width:800px){
  :root{--sidebar:0px}
  .brand .sub{display:none}
  .brand>span:nth-child(2){display:none}
  .topbar{gap:10px;padding:0 12px}
  .searchwrap{margin-left:auto;flex:1;max-width:190px}
  .searchwrap input{width:100%}
  .menu-btn{display:block;flex:none}
  .sidebar{transform:translateX(-100%);transition:transform .25s;width:82vw;max-width:320px}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:30px 16px 100px}
  .chapter-head h1{font-size:24px}
  .section h2{font-size:19px}
  body{font-size:15.5px}
  .overlay{position:fixed;inset:0;background:var(--overlay);z-index:35;display:none}
  .overlay.show{display:block}
}
/* ---------- Print: pure white, ink-saving ---------- */
@media print{.book-title{color:#000!important;border-bottom:2px solid #000!important}.book-title:empty::before{content:''!important}}
@media print{
  html{
    --bg:#fff;--panel:#fff;--panel2:#fff;--text:#000;--muted:#000;--line:#000;
    --accent:#000;--para:#000;--badge-bg:#fff;--mark-bg:#fff;--img-shadow:none;
  }
  body{background:#fff!important;color:#000!important;font-size:11pt}
  .topbar,.sidebar,.progress,.totop,.lightbox,.overlay,.chapter-head .badge{display:none!important}
  .layout{display:block;padding:0}
  .main{margin:0;padding:0}
  .paper{max-width:none}
  .chapter{margin-bottom:24px;page-break-after:auto}
  .chapter-head{border-bottom:1px solid #000;padding-bottom:8px;margin-bottom:16px}
  .chapter-head h1{font-size:20pt;color:#000}
  .section h2{border-left:2px solid #000;color:#000;font-size:14pt}
  .para,.top-para,.cap{color:#000!important}
  .figure img{border:1px solid #000;box-shadow:none;max-width:100%}
  mark{background:none;color:#000;font-weight:bold}
}

/* ===== reading time ===== */
.rt-wrap{position:relative;flex:none;display:inline-flex}
.read-timer{display:inline-flex;align-items:center;gap:6px;height:34px;color:var(--muted);font-size:13px;font-weight:600;background:transparent;border:1px solid var(--line);border-radius:8px;padding:0 10px;white-space:nowrap;cursor:pointer;font-family:inherit}
.read-timer:hover{border-color:var(--accent);color:var(--accent)}
.read-timer .rt-dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.read-timer.live .rt-dot{background:var(--accent);box-shadow:0 0 0 3px rgba(14,148,136,.16)}
.read-timer b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:700}
.rt-pop{position:absolute;right:0;top:calc(100% + 8px);z-index:300;width:262px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:0 12px 34px rgba(0,0,0,.13);display:none;text-align:left;font-weight:400;font-size:13px;line-height:1.6}
.rt-pop.show{display:block}
.rt-pop h4{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:700}
.rt-pop .rt-big{font-size:22px;color:var(--accent);font-weight:800;margin-bottom:8px;font-variant-numeric:tabular-nums}
.rt-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.rt-row:last-child{border-bottom:0}
.rt-row span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-row b{color:var(--text);font-variant-numeric:tabular-nums;flex:none}
.rt-bars{display:flex;align-items:flex-end;gap:4px;height:58px;margin:8px 0 6px}
.rt-bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.rt-bar i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.rt-bar.today i{opacity:1;box-shadow:0 0 0 1px var(--deep)}
.rt-bar em{font-size:10px;font-style:normal;color:var(--muted);white-space:nowrap}
.rt-tip{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
@media(max-width:720px){.read-timer{height:30px;padding:0 7px;font-size:12px}.rt-label{display:none}.rt-pop{right:-40px;width:242px}}
@media print{.rt-wrap,.rt-pop{display:none!important}}

/* MOBUI-v1 */@media(max-width:720px){.undo-btn{display:none!important}.split-reader{display:none!important}}
</style>



<style id="simpleEditStyle">
/* ===== SIMPLE-EDIT-v2 默认纯阅读 + 按需改字 ===== */
/* 只有正在编辑的那一段才有提示框；其余段落保持纯阅读，无任何框 */
/* DUPTITLE-v1 正文首段与标题重复时隐藏该行（不删DOM，仅视觉隐藏）*/
.dup-title-line{display:none!important}
.dup-title-line + p{margin-top:0}
@media print{.dup-title-line{display:none!important}}
/* BOOKTITLE-v1 书名大标题（空白可编辑）*/
.book-title{font-size:30px;font-weight:800;line-height:1.35;color:var(--text);
  margin:6px 0 26px;padding:0 0 14px;border-bottom:2px solid var(--accent);
  cursor:text;outline:none;min-height:1em}
.book-title:empty::before{content:'点击此处输入书名大标题…';color:var(--muted);font-weight:600;opacity:.7}
[data-pid].se-editing{outline:1px solid var(--amber);outline-offset:2px;border-radius:2px;cursor:text;background:rgba(251,191,36,.05)}

/* EDITUI-FIX: 改字后不再显示橙色竖框，段落保持纯阅读外观 */

<script id="sitedata" type="application/json">[{"id":"p1","icon":"第一篇","title":"第一篇 趋势反转：趋势成为反趋势","blocks":[{"t":"para","text":"第一篇　趋势反转：趋势成为反趋势","pid":"p0"},{"t":"para","text":"一个交易员所能掌握的最重要的技能之一，就是能够准确判断一个突破行情是成功引出一波新的趋势，还是最终突破宣告失败使得行情反转。请记住，每根趋势K线都是一次突破，无论这根K线多么强势，无论它是阳线还是阴线，在每根趋势K线的顶部和底部，总存在买方和卖方。突破行情在任何情况下都如出一辙。市场上总有一些交易员坚信这次突破将成功走出一波新的趋势行情，也有另外一些交易员看法相反，认为突破将最终失败并形成趋势反转。在15分钟图上单一K线之后出现的反转，在1分钟图上看来可能经历了很多根K线，同理。持续10到20根K线才形成的反转，在120分钟图上只仅仅用了一根K线的时间。反转的过程在所有时间周期上都是一致的，不论这期间经过了多少根K线。在一波突破行情之后，如果交易员们可以成功判断接下来市场大概率的走向，而练就这种本领对交易员们来说就是一个优势，他们将根据自己的判断顺势而为。","pid":"p1"},{"t":"para","text":"正如第二本书第5章所讨论的，反转信号是很常见的，每根趋势K线都是一次突破，而且市场上令突破失败并最终导致反转的尝试很快随之而来。如果突破比反转尝试来得更强势，那么反转的努力将付之东流，这种反转尝试就会形成新趋势中一个旗形的起点。例如，如果在震荡区间里多头突破了，上升尖形由两根影线很短的大阳线构成，而下一根却是十字星阴线，这个十字星阴线就是令突破失败令行情反转回归熊市的一次尝试。既然突破比反转尝试更强势，很可能在这根十字星阴线之下，市场上买方要比卖方多，而空头的入场条件就会变成价格向上突破后的回调型买入信号。换言之，趋势反转不但不会成功，突破后的行情回落，更可能只是上升旗形的起点，给后续的行情带来一个新的小波段。如果反转的力量看起来比突破强得多，那么市场更可能出现反向行情此前的突破也将以失败告终。第二本书第2章讨论了如何衡量在突破行情中多空双方的力量。简而言之，当前的征兆显示突破的力量越强，市场就越可能成功突破。突破后的反转尝试便形成一个价格突破后的回调型入场条件。","pid":"p2"},{"t":"para","text":"机构投资者的交易都是由主观交易员和计算机来完成的，而且计算机程序化交易的重要性正在日益突显。机构交易基于机构投资者对基本面或技术面的分析，或两者结合，并通过交易员和计算机去完成。一般情况下，大多数主观交易员主要通过基本面消息做出交易决策，而大部分计算机交易则依赖技术数据。但由于目前市场上主要的成交量都来自高频交易公司，大量交易都建立在价格行为和其他技术数据的基础上，因此大部分程序化交易都以技术分析为主导。20世纪末，一个单一的机构投资者运行一个大型程序就可以影响市场，这种程序化交易通常会形成一个微型通道，交易员们见到这种通道，就能判断出市场背后有一个程序正在运行。现在大部分交易日里，在电子迷你期货上我们都能看到十几个这样的微型通道，市场上超过10万张合约在交易。目前电子迷你期货在1200点左右，相当于60亿美元的成交金额，这可比一个单一机构投资者的一笔小型交易的规模要大得多。这就意味着一个单一的机构投资者不可能对市场产生非常深远的影响，图表上的所有波动都是很多机构在同一时间同一方向交易的结果。与此同时，高频交易的计算机会分析市场上的每一个价格跳动。并一整天持续不断地交易。当它们探测到一个交易程序时，就会顺着程序的交易方向进行投机，在微型通道（程序化交易）形成期间，他们的交易量占据了绝大部分的成交量。","pid":"p3"},{"t":"para","text":"以技术面信息为基础进行交易的机构投资者，很难一直推动市场往一个方向发展，因为在某些价位上，市场也同时向基于基本面交易的机构投资者提供有价值的基本面信息。如果技术型机构投资者把价格拉得太高，基本面机构投资者和其他技术型机构投资者就会抓住这个卖出多仓并且建立空仓的机会，他们会压倒技术型交易的多头，并驱使市场下行。当技术型交易使行情出现一个下跌趋势时，在某些价位上，市场价格在基本面及其他技术型机构投资者眼里就会明显偏低。此时买方入场压倒在市场上抛售的技术型机构投资者，从而扭转行情。各种时间周期中的趋势反转都发生在支撑位和阻力位上，因为技术型交易员和交易程序都把支撑区间或阻力区间看成他们获利平仓的信号，还有很多甚至开始在这些区域做反手交易。市场上70%的成交都来自计算机算法交易，占到机构投资者成交量的80%，能够比较容易就知道他们的行踪。机构投资者中的基本面交易员也会关注一些明显的技术信号。他们把图表上的关键支撑位和阻力位视为价值区间。并在这些区间里做反手交易。做价值交易的程序也会重视这些区域，不论用什么标准来衡量，主要的支撑位和阻力位都是至关重要的。大部分程序化交易都是以价格为主导的，这没有任何秘密可言。当一个重要价位出现时，全市场都能看见，和他们运用哪种交易逻辑没有关系。基本面交易员（不论是人还是计算机）会伺机而动，一旦确认行情与市场基本面相匹配，则重仓出击。他们希望在市场价格足够低的时候买入，在市场价格过高的时候卖出。例如，如果行情正在下行，跌至一个机构投资者认为足够低的价格水平，他们就会突然杀出并大举买入。这些情况往往非常戏剧性地发生在开盘时的反转行情中（这里所说的反转，可以是向上反转，也可以是向下反转，稍后会在本书关于开盘交易的章节中讨论到）。空头会把自己的空仓买回来平仓获利，多头则会开始建立新的多仓。没人能够准确地指出市场是否在某个方向上走得过远，但大多数经验丰富的交易员和交易程序通常都对自己的判断相当有信心。","pid":"p4"},{"t":"para","text":"机构投资者都等着市场明显超卖时再买入，这时在可能的市场底部上方会出现一个买方真空区域，这时市场将加速下滑至机构投资者认为足够低的价格区间。有些机构依靠交易程序来判断买入时机，有些则由交易员自主决定。一旦足够多的机构投资者买入，市场通常都会向上反转，至少形成两个回合的上升小波段，并持续10根或更多的K线，无论在什么时间周期的图表中，都将是这种情形。当市场下行时，机构投资者会一路做空下去，直到价格达到目标价位，并且不太可能跌得动了，他们就开始平仓获利了结头寸。市场超卖越严重，就有越多的卖出交易以技术面为基础，因为基本面的交易员和交易程序都认为此时市场价格已经过低，很快就会有人买入，他们不会在超跌严重的情况下参与做空当市场接近一个关键的支撑位时，买方相对缺乏，常常导致市场加速下滑至支撑区间，通常的结果是出现卖方真空，抛售的高潮吸引市场跌至支撑位以下，然后在这个点位上急剧反转。大部分支撑位都阻挡不了熊市（大部分的阻力位也阻挡不了牛市），但当行情最终反转上行时，市场必然处于一个明显关键的支撑水平，如长期趋势线。底部的下跌和反转通常都伴随着非常大的成交量。在市场下跌的过程中，会出现很多涨至压力位的反弹，和回落到支撑位的下跌，当足够多的机构投资者认为市场已经超跌了，且提供了让交易员反方向做多的理由时，反转就会发生。当足够多的机构投资者在同一价格水平采取一致行动时，一个主要的趋势反转便会出现。","pid":"p5"},{"t":"para","text":"基本面分析和技术面分析都可以用来判断支撑位。它可以通过计算的方法来预测，比如算出标普500指数市盈率倍数的理论值是多少，但这些计算的精确度并不能让足够多的机构投资者认同。然而，传统意义上的支撑区间和阻力区间要比计算来得更直观，对许多机构投资者来说判断这些区间更不是一件什么难事，他们更清楚市场在什么价位应该反转。在1987年和2008到2009年两次崩盘中，市场都急剧下滑至略低于月趋势线以下然后反转上行，形成了一个重要的底部。行情依然持续上扬，直到触碰显著的阻力位。这期间价格多次向下试探。只有这时机构投资者才有信心卖出自己的多头头寸并反手做空。市场便开始反转下行。","pid":"p6"},{"t":"para","text":"基本面因素（买入或卖出时的实际价值）决定了整个市场的总体走向，但技术面因素决定确切的转折点。价值决定价格，市场价格总是在不断地、甚至过于频繁地探索其真正价值，并围绕价值上下波动。技术面的转折点总是发生在支撑线和阻力线上。报告和新闻事件在任何时候都可以使基本面（价值认知）发生改变，足以令市场行情在接下来的几分钟甚至几天时间内持续上涨或下跌。维持数月的反转形态都是基于基本面的，它们开始或结束于某个支撑位或阻力位上。这种现象无论在哪个市场哪种时间周期都是真实存在的。","pid":"p7"},{"t":"para","text":"当市场已经开始从一个重要的顶部反转下行时，新闻报道的基本面依然是看涨的。当市场已经从一个重要的底部反转上行时，新闻报道依然看跌，意识到这一点是很重要的。机构投资者不会仅仅因为新闻对市场看涨或看跌就改变自己的想法。交易依靠的是图表而非新闻。价格才是真理，市场总是领先于新闻。事实上，新闻在市场顶部总是最看涨的，在市场底部总是最看跌的。记者们陷入狂喜或绝望的状态，满世界寻找评论员来解释为什么市场趋势如此强烈，这种行情还能持续多久。他们会无视最聪明的交易员，甚至可能连他们是谁都不知道。那些交易员的兴趣是赚钱，不是新闻，他们不会去寻求记者的帮助。当记者打车上班时，司机告诉他自己刚刚卖掉所有股票，抵押了自己的房子，以便购买黄金，记者一下就兴奋起来，迫不及待地找到一位看涨的评论员并播出看涨的消息，以确认自己对黄金牛市的深刻见解。“想想看，市场竞然如此强劲，连我的的士司机都在购买黄金！因此每个人都会卖掉他们的其他资产并买入更多的黄金，黄金市场会在未来几个月内持续上扬！”对我而言，连最弱的交易员都最终进入市场时，就再也没有人充当买方了。市场需要一个更大的傻瓜愿意在高位接盘，这样你才能卖出获利。当再没有人买入时，市场只有一条路可走，它的方向与新闻告诉你的恰恰相反。当电视上声情并茂的专业评论员一直旁征博弓，反复地给你灌输黄金不可能下跌且实际在上一年之后价格会再次翻倍的思想时，这种无尽的诱惑我们是很难抵抗的。然而，你必须认识到，他们只是在自我强化和娱乐大众。电视网络需要娱乐来吸引观众，并赚取广告费。如果你想知道机构投资者此时此刻真正在做的事，你只需要看看图表。机构投资者的交易量和资金规模过于大型，无法隐藏起来，如果你懂得如何阅读图表，就会看到他们在做什么，市场的方向在哪里，而这一切通常与你在电视上看到的毫不相干。","pid":"p8"},{"t":"para","text":"一个成功的趋势反转，能将多头市场转变为空头市场，或将空头市场转变为多头市场，需要切记的最重要的一点是大部分趋势反转的尝试都将无功而返。市场是有惯性的，这意味着市场对正在发生的事情有强烈的倾向，并且不会轻易接受变化。结果就是根本不存在所谓的趋势反转形态。当市场处于一波趋势行情时。所有的形态都是持续整理形态，但偶尔某个持续形态会破产。大多数技术分析师都会把破产的持续整理形态定义为反转形态，但大部分情况下这些形态都不会引起价格反转，市场趋势依然延续，因此把它看作持续形态应该更为准确。一波趋势就如一艘巨轮，需要巨大的力量与时间的推移，这些力量才能改变巨轮行驶的方向。在某一方的交易员掌控市场之前，通常都要求双向交易量有所增加，这种多空胶着的现象就表现为震荡行情。正因为如此。大部分反转形态都是震荡区间，但由于八成概率反转形态都会破产，你应该预期某次震荡区间的突破更可能是顺势突破。有时候突破会发生在逆势的情况下，或者顺势的突破很快失败并出现反转。当发生这些情况时，大多数交易员都会把震荡区间标记为反转形态，比如双重顶、头肩形，或最终旗形。所有能够引起一轮反向趋势的反转形态都列在本书第一篇中，但同时它们也许只是引出一段震荡行情，随后很可能恢复原来的趋势。在这种情况下。反转形态只是牛市中的一个上升旗形或熊市中的一个下降旗形。","pid":"p9"},{"t":"para","text":"当趋势发生反转时，有可能在瞬间就急剧反转，而且在早期市场态度就表现得非常坚定，也有可能缓慢地推进，并持续在十几根K线以上当反转发展缓慢时，市场通常看起来只是在形成另一个旗形，但你会发现回调继续深入，最终在某些价位上顺势而为的交易员放弃抵抗，这时就出现了一个反趋势方向的突破。例如，假设有一波正开始回调的下跌趋势，它形成低点1的入场条件，但市场立即在这个信号触发后反转上行。然后它形成低点2的入场条件，同样触发后在一两根K线内反转上行。这时，假设市场要么突破下降旗形的项部，要么再形成一波上涨，触发一个楔形下降旗形，入场条件失效，然后市场向上突破。趋势反转在某种程度上使绝大多数交易员相信总在场内的头寸已经翻转，这种情况几乎总要求某种类型的突破出现。这些将在第15章中详细讨论，但这说明你必须一直在市场中交易，不论做多还是做空，总在场内的头寸就是指你当前的头寸。对于任何突破而言，其特征都是相同的，我们在第二本书第一篇中关于突破的内容中讨论过。在这种情况下，市场走出一轮新的趋势，交易员们也跟着反转他们的思维模式。当牛市反转为熊市时，交易员不再在K线上方挂条件单做多，也不在K线下方以限价指令买入，而是开始在K线上方以限价指令卖出，或者在K线下方挂条件单做空。当熊市反转为牛市时，交易员不再在K线下方挂条件单做空，也不在K线上方以限价指令卖出，而是开始在K线上方挂条件单做多，或者在K线下方以限价指令买入。关于趋势行为的更多内容，请见第一本书第三篇。","pid":"p10"},{"t":"para","text":"每一波趋势都包含在一条通道内，通道边界由趋势线和趋势通道线构成，尽管快速地往图表上一警，通道可能不是十分明显。这几本书中一个最重要的原则就是，你绝对不能在通道被突破之前就考虑逆势交易，这意味着我们必须等待突破越过重要的趋势线。此外，你只有在出现强劲的信号K线时，才能做反转交易。你需要证据表明逆势的一方足够强大到去把握掌控市场的机会。即便如此，你仍然应该寻找顺势交易的机会，因为在第一波逆势的浪潮后，市场几乎总是会回归原来的趋势，来测试旧趋势的极值。只有在极少数情况下趋势线突破拥有如此强劲的动能，测试过程中没有任何刮头皮的机会。如果在旧趋势极值附近测试失败，那么市场已经两次在这个极值水平上羽而归，每当市场两次尝试两次败北时，它通常都会做出相反的尝试。在对旧趋势极值测试失败后只有当一个脱离旧趋势极值的良好的反转入场条件出现时，你才应该开始寻找逆势波段交易的机会","pid":"p11"},{"t":"para","text":"区分反转交易与逆势刮头皮交易非常重要。反转交易符合“总在场内”的反手交易逻辑，但逆势刮头皮不是反转交易，它的交易员盈亏方程式结果一般不理想，而且大部分逆势刮头皮交易机会都在价格通道内形成。通道总是看起来好像要反转了，引诱交易员们挂条件单进行逆势交易。这些交易员很快被套其中，不得不止损认输。例如，在上升通道内，每一次突破新高之后，通常都跟随着一个看起来很像下跌反转的K线或内含线。新手交易员看到目前的价格距离移动平均线还有一定空间可供刮头皮做空，因此他们在K线下方挂条件单卖出建仓。他们将有70%或更高的概率会在逆势刮头皮交易中亏钱，其平均亏损将大于平均盈利。他们做空是因为他们急于交易，并且大部分买入信号看起来很弱，常常迫使交易员在距离通道顶部只有几个变动价位的时候买入。逆势交易的入场条件往往是有一个很好看的信号K线。使交易员们在相信自己是在等待不错的买入信号时，能顺便巧妙地做一笔空头刮头皮交易。他们把先前所有的下跌反转和回调都看作是卖盘力量占优的表现。他们是正确的。只可惜，大部分空头刮头皮交易最终都只形成一个微型的卖出真空，将市场吸引下跌至某个支撑位，如通道底部附近，或一个小的更高低点的下方。一旦价格到了这些支撑位，强势的多头便开始大举买入，推动市场价格上涨。当市场创新高时。很多人会在高位获利了结，从而创造出下一个卖出信号，但这些卖出信号如早前所有的信号一样都将失效，因为趋势还在上涨。高频交易公司支付微不足道的佣金，就可以在一两个变动价位之间获得盈利，而你却不能这样做。虽然行情产生了一根看起来不错的反转K线。但这些都不是可交易的好的反转机会，交易员们不应该进行这种交易。只要信号没能将总在场内的方向翻转为空头，我们就只能顺势而为。机构投资者正在那些信号阴线的低点下方买入。如果你想在通道成型过程中交易，你只能像机构投资者那样以限价指令在低于早前K线的下方买入，或者在高点2信号K线上方买入，空头通常都在这些位置平仓了结他们亏钱的空仓。不过这对很多交易员来说操作起来都比较困难，因为他们会发现通道内有大量多空胶着的双向交易，明白在通道顶部买入往往只是一种使盈亏方程式略大于零的策略。","pid":"p12"},{"t":"para","text":"趋势反转，或者我们所称的“反转”一词，并不一定是实际的趋势反转，因为这一术语的意思包括市场从一种行为向另外一种相反的行为转变。我们一般会把这种转变看作从牛市转变到熊市，或从熊市转变到牛市，这也是第一篇讨论的主题。震荡区间的行为可以算是趋势行为的对立面，如果一个震荡区间突破进入趋势行情，那也算是市场行为的一种反转，不过，市场更普遍地把这种反转描述为突破。回调可以是小型震荡区间或者是一波与大趋势相反的小规模趋势，当回调结束时，小规模趋势便会反转回归原来的主趋势。大部分趋势反转都是更长时间周期上的趋势回调，这意味着这种趋势反转最终形成一个大型的震荡区间；但有些反转会走出一波强劲持久的反向趋势。即使反转最终形成一段震荡行情，但根据反转信号入场也能让我们赚到一笔波段交易带给我们的行情。","pid":"p13"},{"t":"para","text":"大部分趋势反转尝试的结果并非是强劲的反向趋势，而是区间震荡。严格地讲，市场行为已经反转为一种反向类型的价格行为（从单向交易转变为双向交易），但趋势并未反转进入相反的趋势。交易员绝不可能事先知道当前的反转是否会走出一轮新的趋势行情。因为进入一个震荡区间的反转往往和进入一轮新趋势的反转在十几根K线的时间里看起来是一样的。正因为如此，在经过很长时间后，交易员才能判断出当前的反转是走出一波新趋势还是仅仅过渡为一个震荡区间。这就是为什么大部分回报比风险大很多倍的交易的胜率一开始都很低的原因。随着走势越来越明确，剩余的盈利空间越来越小，回报也变得越来越小，而风险却变得越来越大，因为理论上波段交易理想的建仓位应该是在最近一次上涨或下跌行情的起点处（在牛市中低于最近更高的低点，或在熊市中高于最近更低的高点，可能距离当前的价位都比较远）。从交易员的角度来看，这些都关系不大，无论反转演变为新一轮的强劲趋势。抑或仅仅变成几个大的逆势波段，交易员进行反转交易的方式都是一样的。是的，他们会从没怎么回调至其盈亏平衡点的巨型波段中获得巨大利润，但他们也能够在市场停滞不前横盘整理并形成大型震荡区间的过程中赚不少钱。然而，比起波段交易，交易员在一个震荡区间里的刮头皮交易盈利更丰。震荡行情和回调已经在第二本书中讨论过。在一个真正的趋势反转行情中，新的趋势可能持续很长时间，交易员们应该重锤出击波段交易。","pid":"p14"},{"t":"para","text":"如果市场真的反转进入一个反向趋势，新的趋势也许会被延伸，也许只局限在一根K线的时间之内。一两根K线之后，市场也可能转向横盘整理，然后趋势才再次恢复，或者向上或者向下。很多技术分析师不会用反转这一术语，除非事后行情呈现了一系列趋势性的高点和低点。可惜这对交易并没什么帮助，等待事后行情呈现的情形再做交易决策，会导致交易员的盈亏方程式结果不理想，即盈利风险比太低，趋势起作用的时间越长。就越可能出现显著的回调（更大的浮亏）。交易员一旦开始了反向趋势的交易，就表明他相信市场趋势已经开始反转了，即使行情尚未达到严格的反转标准。例如，如果交易员在熊市中买入，就表明他们相信市场很可能不会再下跌甚至一个价位：否则他们会继续等待由于他们的买入基于市场将走高的信念，他们认为目前的趋势是向上的，反转已经成型，至少行情高走的幅度足以令他们的交易有利可图。","pid":"p15"},{"t":"para","text":"很多技术分析师不接受这种定义，因为它不要求行情波动出现一些趋势的基本要素。大多数人认为对于趋势反转必须满足两个要求。第一个是必须的要求：行情波动必须突破原来趋势的趋势线，即打破原来的趋势通道。第二个要求在大部分时间里都能满足，但它却不是必要的：突破趋势线后。行情回归并成功测试旧趋势的极值。在少数情况下。可能一开始就出现一个持续很久的高潮反转，而且行情不再接近旧趋势极值。","pid":"p16"},{"t":"para","text":"任何反转的先后顺序都是一致的。每一个趋势都是在通道内运行，当行情突破趋势线时。市场也就打破了所在的通道。这种越过趋势线的突破，之后都伴随着回归原来趋势方向的波动。趋势交易员们都希望这是一次无功而返的反转尝试，并期待行情走向恢复原来的趋势。如果他们是正确的，那么新的趋势通道就会变宽，坡度也会没那么陡峭，这表明市场失去了一些动能。当趋势趋向成熟时，这些都是很正常的。他们把这种趋势线的突破简单看作是一个旗形的开始，随后趋势便会进一步延伸。","pid":"p17"},{"t":"para","text":"而逆势交易员们都希望在突破之后，回归旧趋势方向的这个反转是一次突破测试，然后反趋势走出第二个小波段。在一个成功的突破中原来的趋势不会复辟，对旧趋势测试后行情会再次反转，那么这次测试就变成新趋势的一次突破回调行情，或者一次大型的调整。举例而言，在熊市中，行情向上突破下跌趋势线，在某个点位上反转有可能尝试失败，然后跌至一个更低的低点，一个双重底，或一个更高的低点，这些都是对熊市低位的试探。如果成功，这次试探就会变成之前市场向上突破下跌趋势线后的一次突破回调，新的牛市将会恢复，至少再形成一二个上升小波段。当这次反转结果进入一轮新趋势时，向上突破下跌趋势线的这个反弹，就是多头力量开始掌控市场的时候，即便这次多头突破的回调跌出一个更低的低点。大多数交易员把这个更低的低点视为牛市的起点，但多头往往在行情向上突破下跌趋势线期间就开始抢占市场。你认为这一轮牛市以上升尖形的底部为起点，或者以更低低点的反转底部为起点，这都没有关系，交易方法都是一样的。当市场从更低的低点（或双重底，或更高的低点）反转上行时，你就会寻找买入的机会。接下来的反弹可能成为一次含两个小波段的大型调整，一段震荡行情的起点或一轮新的牛市。不论结果如何，多头都能获得一个收益不小的交易机会。如果测试失败，市场将继续下行进入一个新的下降波段，交易员们不得不寻找另一个向上突破下降通道的机会，并等待下一次对新熊市低点的试探，然后才考虑在底部买入。这种说法反过来也成立，在牛市中行情向下突破上涨趋势线，然后大幅反拉至一个更高的高点，一个双重顶，或小幅反抽至一个更低的高点。空头往往在行情向下突破趋势线期间就开始掌控市场。即使超过了前高，对牛市高点的冲击仍然只是一开始空头突破上涨趋势线后的一个回调。","pid":"p18"},{"t":"para","text":"一旦产生了一波强劲的逆向走势，回调就是对多空双方的一次考验。举例而言，假设在牛市中出现了一轮强势的向下波动行情，价格跌穿了已经持续20到40根K线的趋势线：然后市场在20根K线的时间里继续下行，并远远低于20根K线的移动平均线，甚至跌破了这轮牛市最后一个更高的低点；这种情况下空头展示了其不容小靓的力量。一旦第一回合的下降小波段元气耗尽，空头就会开始兑现部分盈利，多头也开始建立多仓。两边的买入操作都把市场推向更高的价格，双方都非常谨慎地观察这波行情。下降小波段太过强势，多空双方都认为它的低点很可能会被再次试探，然后市场才能突破走向新高。因此，随着市场反弹，如果向上的动能缺乏强劲的势头，新的多头将开始获利了结，空头也会积极地加仓做空。与此同时，持仓熬过抛售期的多头也会这次反弹开始卖出平仓。他们本想保持做多，但看到强势的空头展示出令人印象深刻的实力，这些多头会抓住任何反弹的机会退出市场。这代表了整个市场的供给，并限制了反弹幅度，增加了另一个下降小波段的可能性。反弹很可能会包含很多阴线和影线，这些都表明多头力量薄弱。这次反弹后的价格下行，将在潜在的新一轮熊市中创造第一个更低的高点。无论如何，出现第二回合下降小波段的概率相当高，多空双方都是这么预期的，他们也会根据行情进行相应的交易。","pid":"p19"},{"t":"para","text":"市场上仍然存在一些在早前更低位就建仓的多头。他们依然希望牛市能把握每一个复辟的机会。交易员们都知道大部分的反转尝试都将无功而返，很多吃着一轮大趋势而上的投资者不会轻易平掉他们的多仓，除非空头展示出能够将市场猛烈下推的实力。许多多头都会买入看跌期权，以求在迅猛的反转行情中自保。看跌期权允许他们继续持有多仓，以便抓住牛市每一个可能恢复的机会。他们知道不管市场跌得多深，看跌期权都能有效减少他们的亏损。但是一旦看到这种难以忽视的抛压时，他们便会寻找反弹的机会最终了结自己的多仓，并且在市场重新上扬时平掉他们的看跌期权锁定利润。此外，他们大部分的看跌期权会在几个月内到期，一旦到期了，交易员们不再拥有下跌保护。这意味着他们不能再持有多头头寸，除非他们不断买入越来越多的看跌期权。如果他们认为市场将来很可能进一步下行，并且在未来很多个月内都不会再次反弹，那么不间断地买入看跌期权来保护自己的多仓就不合理了。相反，他们会伺机平仓。他们的平仓限制了反弹的幅度，他们的卖出加上激进空头的做空，还有之前把下跌期看作买入时机的多头获利兑现，这一切构成了第二回合的下降小波段。","pid":"p20"},{"t":"para","text":"这些坚定的多头在市场下跌时期都有自己能承受的心理价位，如果行情触碰了这些底线，他们就会在下一次反弹时平仓离场。随着市场持续走低，越来越多的多头会认为牛市在短时间内不会恢复，而且趋势有可能已经反转进入下跌期。这些剩下的顽固派多头会耐心等待在下降波段中的一次回调，以了结他们的多仓，他们的头寸代表着供给，给市场带来卖盘压力。他们在最近一个波段的高点下方卖出。因为他们怀疑市场是否能够超过前一个波段的高点，能在高于最近低点的任意价格处离场，他们就感觉很满意了。空头也会等待新低回调时加仓或建仓。最终结果就形成了一系列更低的高点和一系列更低的低点，这就是熊市的定义。","pid":"p21"},{"t":"para","text":"典型的情况是，最初的波动将突破趋势线，然后形成一个回调来测试旧趋势的结尾，交易员们在行情测试之后开始伺机建立势（从新趋势的方向来看实际上是顺势的）头寸。大多数交易员都希望突破趋势线的波段和测试趋势极值的波段在持续两三根K线以上。持续5根K线足够了吗？还是10根？一切都取决于当前的行情。一次只包含一两根特别长的K线的趋势线突破足以令交易员预期行情至少有第二回合的下降小波段。双K线回调是否足以对旧趋势极值进行测试呢？大多数交易员倾向于看到行情至少走出5根K线，但有时候仅持续两三根K线的趋势线突破和回调依然能够说服交易员们趋势已经反转。如果其中一个小波段只有几个K线，大多数交易员都不会在新的趋势方向上积极交易，除非另一个小波段持续了更长的时间。正因为如此，在仅仅只有双K线的趋势线突破和双K线的旧趋势测试后，新一轮趋势很少会就此启动。就算新趋势启动了，也会大概率在10根K线之内面临大幅度的回调。","pid":"p22"},{"t":"para","text":"趋势线突破之后的行情测试可能高于或低于原先趋势的极值，但不会离得太远。交易员在进行任何逆势交易的过程中，还是应该坚持以强势的信号K线为标志，没有强势的信号K线，成功的概率就会低很多举例而言，在熊市中，有二波迅猛的行情上扬并远远超过下跌趋势线，交易员们准备在第一次回调时买入，并希望它形成一系列更高低点中的第一个低点。入场前他们希望市场出现一个强力的牛市反转K线或双K线反转。然而，有时候回调会跌破熊市的低点。使得新进的多头纷纷触发止损。如果这个更低的低点在几个K线内反转上行，那么它可能会引出一波强势的上升波段。反过来说，如果这个更低的低点远远低于前一个低点，我们最好假设熊市已经开始形成另一个下降波段，在再次做多之前，我们应该等待下一次趋势线突破，上行动能涌现，以及一次对低点浅度或深度的行情回踩。","pid":"p23"},{"t":"para","text":"尽管交易员都喜欢在一轮新的牛市中第一个更高的低点处买入，在一轮新的熊市中第一个更低的高点处卖出，但前提是这轮新趋势是稳定的，稳定的趋势会形成一系列呈趋势变化的波段回调（牛市中呈现更高的高点和更高的低点，熊市中呈现更低的高点和更低的低点），并且每一次回调都可能提供一个绝佳的入场机会。回调可以是一个强势的下降尖形，但只要交易员们认为当前趋势上行，他们就会在强力阴线的收盘价附近买入，并期待阴线之后没有后续的下跌，空头反转以失败告终。多头把这个强势的下降尖形看成一次短暂的、非常有价值的交易机会。而不幸的是，新手们把它看成一轮新的熊市的起点，无视先前多根K线所展现的多头力量，只把注意力放在了这一两根K线的下降尖形上。他们恰恰在强势多头买入的位置上做空。多头预期空头的每一次努力尝试都将付诸东流，并抓住每一次买入的机会。他们会在每一根阴线的收盘价附近买入，就算这是一根大阴线，并且收在其最低点，他们也不在乎他们也会在市场跌破前一根K线的低点时买入，或在前一任意的波段低点处买入，以及在任意的支撑水平如趋势线处买入。他们还会在每二次市场尝试走高时做多。比如在某根阳线的高点附近，或市场超过前一根K线的高点时，以及阻力位之上，他们都可能进行买入操作。这和交易员们在强烈的熊市中的交易手法恰恰相反，交易员们会在K线的上方和下方卖出，在阻力位和支撑位的上方和下方卖出。他们在K线（包括强劲的阳线）上方（以及各种类型的阻力位附近）卖出，是因为他们把每一次向上的波动看成是趋势反转的尝试。并且大部分的趋势反转尝试都将无功而返。他们在K线下方（以及各种类型的支撑位附近）卖出，是因为他们把每一次向下的波动看成是熊市复辟的尝试，并期望大部分的复辟尝试都将得偿所愿。","pid":"p24"},{"t":"para","text":"市场反转上行进入新一轮牛市之后的第一次回调，通常是对熊市低点的试探，但可能距离这一低点不会太近。这一次回调，和之后所有在新的牛市中的回调一样，也可能是对关键点位突破的一次测试，关键点位比如：最近的信号K线的高点或入场K线的低点趋势线、前一个波段、一个震荡区间，或移动平均线。在市场上行至第一回合上升小波段的高点上方后，多头会移动其保护性止损价至略低于这个更高低点的下方。他们会持续跟踪并调整其止损价，并在每个新的更高的高点形成后，他们将止损价移动至略低于最近的更高低点的下方，直至他们认为市场双方的力量足以启动一波含两个小波段的向下调整行情。一旦他们确信市场将会走出第二回合的下降小波段，而且这一次将会跌破第一回合下降小波段的低点（最近的更高的低点），他们就会坚决伺机退出多头，比如某根阳线出现在位于、高于，或略低于趋势高点的地方，或低于前一根K线的低点，多头就在这根阳线的收盘价附近平仓离场。只要他们认为市场将会到达最近一个更高的低点。那他们在这个点位下方退出是不合理的。相反，他们将会在较高的价位上离场，并在这个更高的低点附近再次买入。如果这个上升旗形将发展成横盘整理的态势。它可以是个简单的高点2，一个三角形，或一个双重底：它也可以形成一个更低的低点，并进一个传统的ABC调整。","pid":"p25"},{"t":"para","text":"所有的趋势都在通道内运行，大部分趋势都以趋势通道的突破为终点，但这种现象可能在你所看的时间周期图表上并不明显。举例而言，一轮牛市有两种典型的结束方式。第一种方式是行情突破通道上方，尝试构建一波更为陡峭的牛市。但这极少机会能成功，通常在一到五根K线之内就构建失败了。然后市场反转下行并穿过趋势通道线下方，最低目标是刺穿通道底部的趋势线。这种情况通常形成含两个小波段的横盘走势并向下调整，最终引出一个趋势反转或一段震荡行情。从第一回合下降小波段开始的回调通常形成一个更低的高点，而第二回合的下降小波段通常延伸至某个可测量的波动幅度，比如小波段1的下降幅度等于小波段2的下降幅度，或上升通道内某个下降尖形或某段震荡区间的高度所做的投影。","pid":"p26"},{"t":"para","text":"另一种方式是市场在没有向上击穿趋势通道线的时候就先跌破了上涨趋势线。这种情况下的突破可能表现为一个迅猛的下降尖形，或横盘整理走出一段震荡行情。不论哪种情形，行情回调并冲击牛市高点时。可能大幅反拉形成一个更高的高点或小幅反抽一个更低的高点：它们发生的概率都是均等的。由于三分之二的概率会形成至少两个回合的下降小波段，那么更高的高点后面应该伴随两个回合的下降小波段，更低的高点后面应该伴随一个下降小波段。因为在更低的高点出现之前第一个下降小波段已经发生了。另外剩下三分之一的概率就是反转尝试无功而返，牛市复辟或震荡区间形成。","pid":"p27"},{"t":"para","text":"如果在冲击旧趋势高点的过程中市场形成了更高的高点，最佳的交易策略之一是在第一个更低的高点处寻找做空的入场机会。而这个更低的高点就是对之前那个更高的高点发起的冲击。在熊市中，当上行动能以凶猛之势向上突破主要下跌趋势线时，交易员们会在第一个更高的低点处买入。他们的买入拉高了市场价格，并给每个人强化灌输了新一轮牛市也许即将启动的思想。","pid":"p28"},{"t":"para","text":"一轮趋势持续的时间，要比大多数交易员想象的更长久，这点是比较重要的。正因为如此，大部分反转形态都以失败告终并演变成持续整理形态，而大部分持续形态最终成功恢复原先的趋势。交易员们在基于反转形态进行逆势交易时必须格外小心。但以价格行为为判断依据的入场条件大大增加了交易盈利的概率。","pid":"p29"},{"t":"para","text":"由于大部分反转尝试都空手而回，许多交易员都会顺着原来的趋势进行交易。例如，在牛市中出现了一根收在其最低点的大阴线，大多数交易员预期这次反转尝试也会无功而返，他们中的很多人就会在这根阴线的收盘价处买入。如果下一根K线是一根阳线，他们还会在这根阳线的收盘价处甚至最高点上方买入。第一盈利目标为之前那根阴线的高点处，第二盈利目标为一波可测量的上涨行情，盈利幅度和那根阴线的高度一致。有些交易员会把他们的保护性止损幅度设置为这根阴线所覆盖的大致变动价位数，而其他交易员则依然沿用他们一贯的止损方式。比如电子迷你期货合约跳动两个点。","pid":"p30"},{"t":"para","text":"如果你发现自己在一轮趋势期间画了很多条趋势通道线，并看到很多楔形反转的入场条件。你可能太急切地想找出反转信号。以至于错过了很多很好的顺势交易机会。此外，由于大部分趋势通道线都会被行情击穿，反转在一轮强劲的趋势中显得影响较小，而且大部分都以失败告终，你就会在反转交易中亏损一笔又一笔，并开始产生疑问：为什么这些看起来很美妙的形态总是一次又一次地失效。在寻求逆势交易的机会之前，一定要等待对趋势线的有力突破；随着顺势交易的入场条件开始成型，观察那些被击穿的小级别的趋势通道线，然后在输家止损的位置入场这将会使你更幸福，更轻松，更富有，你将会因这些直观上看起来不起作用的入场条件原来这么有效而感到有趣。","pid":"p31"},{"t":"para","text":"在强劲的牛市中反弹做空对一个新手来说非常具有诱惑力，其中一个原因就是行情在高位中何了很长时间，他们所期待的回调似乎永远都不会出现，越等越失去耐心。而且从屏幕顶部的图表看起来市场再也没有多少走高的空间，他们就自然而然地想象着行情回落的情景。市场如此过热，回调已经迫在眉睫，它必须以一个反转的形式回归其真正的价值区间，而这波回调，足以让刮头皮交易员盈利一回。在等待市场回调期间，新手交易员们开始认为自己不能干等着，必须做点什么，而作为交易员，他们能做的事就是入场交易。然而他们没有意识到，作为交易员，他们的任务是赚大把大把的钱，而不是进行大把大把的交易。由于他们害怕在高位买入，该来的回调也迟迟未到，他们便开始做空，预期当市场开始回调时他们就能开始盈利。大部分时间里，市场的确会出现小幅的回调，然后却反转上行。回调的幅度并不足以令他们的逆势空头刮头皮交易获利。于是他们只能止损了结。牛市在一个快速的突破中复辟，他们却在场外既难过又可地观望着。在以上整个过程中，经验丰富的交易员则选择站在交易的另一边。很多人会在弱势的空头信号K线低点处设置买入限价单，而另外一些人会在小幅回调中高于前一根K线的高点的一个价位处设置条件单做多。当这波回调引出一个做多的入场条件时，新手们却依然固执地只町着导致这波回调的市场顶部，他们担心行情可能会进一步下跌。或者他们依然做空，希望市场再回落一些他们可以从空头刮头皮交易中获利。当然。肯定有一笔空头刮头皮的交易会成功的。他们在最近的四次做空中都亏损了，他们认为市场必须意识到行情对他们来说很不公平，总得给点甜头来弥补他们。只可惜市场就是市场，一切都是有数学基础的，并不受所谓的公平和情感所摆布而他们并不接受这样的事实。经历了数月甚至数年的亏损，他们终于下定决心，以后再看到牛市出现的话，他们一定不会再做空。他们下定决心的这一天，就是他们开始停止输钱的时候。然后又经历了几个月的时间，他们又下定决心，以后再看到牛市出现的话，他们只会在回调时买入，不进行其他操作。这个时候他们终于开始赚钱了。","pid":"p32"},{"t":"para","text":"在牛市中，买方持续不断地买入，直到他们认为盈亏方程式不再如他们希望的那么有利，他们会在这个时点上开始兑现部分盈利。随着市场持续上扬。他们继续平仓获利，而且并不急于再次买入，直到行情出现回调。与此同时，在市场持续上行的过程中空头也被步步进逼，他们的空头头寸被迫平仓出局。在某个点位上，他们将会覆盖掉他们所希望买回的全部空头持仓，然后他们就会停止买入。此外，还存在另一种类型的交易员，只要市场表现出良好的动能，他们就会持续不断地买入，一旦势头放缓他们就会迅速平仓获利。趋势一般在回调过后会延续上涨，直到第二浪的涨幅超过了第一浪。多头和空头从来都不可能确定什么时候概率是50%，也不知道趋势会延续到何时，或者什么时候概率上更倾向于价格下行。当市场处于中性状态时。方向是不明朗的，而市场过热时趋势的方向反而比较容易被发现。这种现象总是发生在一些磁力地带，但由于很多区间都能产生磁力效应，我们很难分辨哪些区间能够真正产生作用。通常来说，在一次回调形成之前，市场必须产生一个磁力汇集的区域。有些公司会基于一个或多个磁力地带来设置其交易模式，而其他公司则会利用其他不同的磁力区间：一旦预期行情会回调的公司数量达到某个临界点，市场便会翻转。当卖压大于买压时，预期行情回调的空头力量更大，这个临界点就会到来。市场上不再缺乏卖出的报价，不再要求市场走高以寻找多头的对手方。相反，交易员们会迅速在卖出价处挂单做空。事实上，他们甚至会在买入价处就开始做空了，以至于市场不得不走低，以便找到更多的买方来吃掉市场上庞大的卖单。这些卖方。有的是多头卖出平仓，有的是空头卖出开仓。","pid":"p33"},{"t":"para","text":"那么，到底是谁在牛市顶部买入或者在熊市底部卖出呢？是无数个陷人恐慌状态的小型交易员们共同刺激的结果吗？他们要么在交易中做反了方向，面对急剧扩大的亏损被迫平仓出局，要么在一波迅猛的趋势中踏空，匆匆地希望赶上末班车。如果我们真能有这么大的影响力就好了！这种情况只可能发生在很久以前，但绝不会出现在今天的市场上。如果在一天的最高位和最低位产生了那么大的成交量，而大部分成交都是由机构投资者完成的，为什么他们这种专业的投资者还会在一天的最高位买入呢？一天中最主要的成交都是由以统计学为基础的数学算法驱动的，其中一些模型在清晰的趋势转变信号出现之前都会不停地买入，只有当趋势方向发生明显转变时，他们才会开始反手做空。由于交易系统的设计者已经认定这种方法将使他们的盈利实现最大化，这种动能型的程序将在牛市中不停买入直到行情涨至最后一跳，在熊市中不停做空直到价格跌至最低的底部。请记住一点，趋势是有惯性的，而且不会轻易完结，所以打赌认为趋势将延续下去会是一个不错的选择。由于他们的成交量如此巨大，市场上并不缺乏买单来对抗行情顶部巨大的卖单（在行情底部也是同样道理）。","pid":"p34"},{"t":"para","text":"机构投资者专业且成交量巨大，并不意味着他们每天能获得5%的利润。事实上，最优秀的机构投资者每天的净利润也不到1%，其中一些机构投资者认为，即使在一天中的最高点处买入，他们的利润也已经通过持续不断地买入实现最大化了，因为他们总是相信市场至少会往上再跳动一两个价位。很多高频交易（HFT）算法都设计成每一笔交易只赚取微小的利润，如果这些专门做量化交易的公司通过运行测试得知在最高点处继续买入可以让他们多赚一点，他们就会继续买入。很多公司还有更加复杂的交易策略，这些交易策略包含了期权和其他金融产品，我们不可能清楚地了解到每天在最高点或最低点处发挥作用的所有因素。例如，他们可能预期行情反转下行，做一个delta中性的套利，这个期权组合里，他们买入200张电子迷你期货合约，同时买入2000张SPY的平值看跌期权。他们只有当市场在一段非常窄的震荡区间里横盘整理若干天时才会亏损。如果市场上行，看跌期权会亏钱，而电子迷你期货会赚钱，且赚钱速度大于看跌期权的亏钱速度。如果市场下行，看跌期权会增值，增值速度大于电子迷你期货多头的亏损速度，他们的delta中性的套利越来越接近一个空头操作。这种组合策略能够使他们在市场上涨或下跌时都实现盈利，即使他们在当天的最高点买入了电子迷你期货。而你所需要知道的，就是每天最高点或最低点处伴随的巨大成交来自机构投资者，有些机构正在最高点处买入同时，有些机构正在此处卖出。","pid":"p35"},{"t":"para","text":"顺便提及的是，想要说明基于数学算法由计算机生成的交易量的活跃程度，可以从另外一个常见的特征中判断出来。我们只需要观察相关的市场，比如电子迷你期货和所有与之相关的交易所交易基金（ETF），如SPY，你会发现它们的价格跳动基本保持一致。其他的相关市场也存在同样的现象。如果这些交易都是纯人工完成的，相关市场的价格不可能天天都对应得那么完美。此外。图表的形态也不可能在所有的时间周期上都展现得如此完美，甚至细微到闪电图也不例外。除非由计算机生成巨量的交易指令才能达到这种效果。人们不可能仅凭人手的力量就在这么多市场中同一时间快速地分析行情并发出交易指令，所以这种完美的契合程度肯定是计算机生成交易指令的结果，它们构成了市场绝大部分的成交量。","pid":"p36"},{"t":"para","text":"当一轮趋势的势头非常强劲且没有形成明显的回调时，人们往往开始寻找一些小型的反转形态，常识告诉我们。当顺势交易员开始兑现部分盈利，且足够多的逆势交易员开始建新仓时，市场最终不得不回调。均值回归的逻辑在日常生活中无处不在，在交易中也应该如此。事实上这一逻辑在交易中确实生效了，只不过市场通常在价格走得更深更远后才回归均值，这种行情幅度远远超出了大多数交易员的预期。此时交易员必须做出选择，是伺机做一笔逆势刮头皮交易还是等待回调结束时顺势而为。如果当前趋势的势头强劲，通常来说最好是等趋势反转信号明确时才进行逆势操作，比如价格先突破原趋势线，然后走出一波测试行情并以一根强势的反转K线结束。然而，保持入场交易的诱惑力对交易员来说是不可抗拒的，他们开始转向更小时间周期的图表，比如1分钟图或100跳动图。当大趋势继续推进时，如果更小时间周期的图表正在形成一些小型的反转。毫无疑问，绝大部分的小反转都将以失败告终。但交易员总能为他们的逆势交易找到貌似合理的解释，比如他们认为1分钟图拥有时间更短的K线，所面临的风险可能只有四个价位的幅度，但如果当前的小反转恰巧发生在整个大趋势的最顶部。潜在的收益将是相当可观的。因此，他们觉得承担几次小额亏损是值得的。可通常的结果都是，这种小额亏损的次数最终达到六七次，当天剩余时间里交易所得的盈利也覆盖不了这六七次亏损加起来的总和。就算交易员们幸运地捕捉到一轮大趋势的终点，他们也只会采用刮头皮的交易方式，赚几个价位就平仓离场，而不是如他们一开始计划的那样踩着趋势顺势而行从数学概率的角度来看，这是一条走向毁灭的道路。买在熊市的低位或空在牛市的高位，都足以让你沾沾自喜，但如果你十有八九的交易都是亏损的，这将导致你一步步走向破产边缘。一般而言，在牛市回调时买入以及在熊市反弹时卖出，对大多数交易员来说是一个更为明智的方法，这样才能产生更多的交易机会，获得更高的胜率。","pid":"p37"},{"t":"para","text":"如果你因为一段扩展的趋势踏空了而变得焦躁不安，觉得自己需要重新进入到交易的环境中去，你就会开始转去观察1分钟图，那些1分钟图的反转形态提供了非常诱人的赚钱机会。只不过要实现这些盈利，我们就必须提高警惕以防被表象所迷惑感。等待1分钟图的反转形态触发逆势交易的入场条件，但你不要在这个时候逆势操作，而应该考虑如果自己真的逆势入场了会把保护性止损价设在哪里。然后，在这个预想的止损价上挂条件单准备顺势交易。当行情到达这一价格时，逆势交易员将止损出局，而你的条件单也将被触发使你得到一个与市场趋势一致的头寸。没有人准备在这个价位上逆势入场，而且本轮趋势将会走得更远以让顺势交易员盈利一把，在下一个的逆势交易入场条件开始形成之前，很可能不再有人打算尝试逆势操作。这是一种赢面非常大的顺势刮头皮的交易方法。","pid":"p38"},{"t":"para","text":"最为可靠的逆势交易模式实际上是在更长时间周期上的顺势交易。回调行情就是与当前大趋势方向相反的小规模趋势，当你逆着回调的方向操作时，其实你就进入了当前大趋势的浪潮之中。一旦做回调的交易员弹尽粮绝时，做趋势的交易员就会再次展现他们的决心，一举突破包含这波回调的趋势线，在这个突破过程中，任何对这次突破进行测试的小幅回调行情都是我们良好的突破回调入场机会。这个入场机会与回调的方向背道而驰，却与主趋势方向不谋而合，通常情况下至少能走出一波对趋势极值的测试行情。趋势线突破的动能越强。这笔交易盈利的可能性就越大。例如，如果行情出现一个上升旗形，你可以在上升旗形的底部买入，或者在上升旗形突破时买入，还可以在突破之后的小幅回调处买入，预期行情将对牛市高点发起一波冲击。","pid":"p39"},{"t":"para","text":"反转的动能可能表现为几根大的趋势K线，或一系列呈趋势性的普通K线。动能的标志显现越多，反转就越可靠。在第二本书第2章关于突破的强弱以及第一本书第19章关于趋势的强弱中，我们对此都做了深人的探讨。在理想的情况下，反转第一回合的小波段将会延续很多根K线，大幅击穿移动平均线，并且新趋势方向上的K线绝大部分都是大阳线或大阴线，延伸并超过原来趋势的波段高点或低点（假设原来的趋势是牛市，如果新一轮熊市的第一回合的下降小波段跌破且收在原来牛市至少一个更高的低点之下，那么这种现象就是反转动能强势的体现）。","pid":"p40"},{"t":"para","text":"资金雄厚的交易员在趋势正急速成型的过程中建仓毫不手软，即使在他们入场后行情立即回调。他们依然预期市场将沿着刚成型的趋势方向坚持下去。如果回调真的发生了，他们会在此刻增仓。例如，一波强势的多头突破行情持续了几根K线的时间，随着每一次价格跳动都创出新高，越来越多的机构投资者都会认为市场总在场内的状态已经转变多头行情，带着市场将继续走高的信念，他们开始做多。这使得行情上涨变得更加迅猛。他们有很多种方法可以建仓，比如以市价买入，在一两个价位的回调处买入，高于前一根K线处挂条件单买入：或向上突破前一波段高点时买入。他们具体的入场方式并不重要。真正的关注点在于他们至少已经开始建仓，并在之后行情走高或回调时将继续伺机加仓。他们随着市场上涨不断加仓，这段时期的上升尖形持续了很多根K线。新手交易员们看到这波仍在继续的上涨行情，开始奇怪为什么会有人在这么剧烈波动的顶部买入。他们不了解的是，机构投资者已经非常确信市场将很快涨得更高。为了不至于在等待回调时踏空，于是他们就一路买上去推高价格。新手们也担心他们的止损价需要设置在这波上涨行情的底部，或至少在中部，但这都离他们的开仓价实在太远了。机构投资者也清楚这一点，他们就会通过调整持仓比例以降低自己的风险，使面临的潜在亏损幅度和其他类型的交易保持一致。在某些价位上，早期的多头开始兑现部分盈利，市场随着回落一点。而当市场一出现小幅回调，希望加大自己头寸的交易员就会迅速买入，从而使回调行情的幅度变小。","pid":"p41"},{"t":"para","text":"虽然最佳的反转形态拥有强劲的动能并且持续很长一段时间，但它们通常都启动得非常缓慢，可能初期只是儿根很小的K线，然后才开始剧烈波动。这就导致大部分的趋势反转的入场条件只有低于50%的成功率。例如，新一轮牛市初期反转上行的行情通常都表现为疲弱的反弹走势，伴随着很多反复震荡的K线和多次的回调，让很多交易员都误以为这只是熊市正在形成另一个下降旗形。第一次回调就是低点1做空入场条件。但交易员们不应该在低点1就做空，除非当前的市场处于一轮强劲且清晰的熊市之中，否则这个低点1的反转尝试很可能会失败。激进的交易员反而会在低点1这根信号K线的底部或下方买入，预期这个低点1会反转失败。接下来通常会出现低点2的做空入场条件。但如果你认为趋势已经反转上行，那么这个低点2的反转尝试同样会以失败告终激进的多头会在低点2这根信号K线的低点处或低点下方挂限价单再次买入。一旦低点2也反转失败，交易员们会把它看作为一个破产的下降旗形，它通常都会引出一波强势突破的上涨行情。而这个下降旗形将成为这轮熊市中的最终旗形，尽管它向下突破的幅度甚至没超过一两个价位。有时候在上涨突破成型之前，市场会向上再推一波进入楔形下降旗形。","pid":"p42"},{"t":"para","text":"如果你早在几根K线行情首次反转上行时就已经入场了，那么这个下降旗形你可以认为是市场正在尝试把你的多仓震出局，之后，你就不得不继续追逐价格上扬，为新一轮牛市添薪加柴。某个失败的做空信号往往很快转变成一根强势的外包阳线。这一切发生得太快，以至于很多想在失败的低点1或低点2买入的多头都呆住了。他们原本希望出现一个低调的买入信号K线，其高点位于低点2信号K线底部附近，而现在他们却被迫匆促做出决定。他们是否希望在一根外包阳线上买入？而这根外包阳线却有可能是这个下降旗形的顶部。大多数交易员都会犹豫不决，等着回调时买入，但在这个点位上每个人都相信空头已经认输，市场将持续走高。他们并不知道接下来的几根K线是否会回调，但他们确定一旦真的回调，随后形成的上升小波段将创出新高。而这种总在场内的心理占据主导时，价格在走得更高之前通常都不会回调。这就是为什么我们应该等待回调之前先至少买入部分小头寸的重要原因。关于上升尖形的数学分析在第二本书第一篇讲突破时讨论过，在第二本书第25章又进行了更细致的讨论，但请牢记，如果你被市场洗出去了，那么就在市价或一两个价位回调时再次入场，至少先持有部分小头寸，然后设置一个非常宽松的止损幅度。这种交易设置从数学的角度分析对你非常有利。","pid":"p43"},{"t":"para","text":"低点1、低点2，或楔形下降旗形会把弱势的新多头震出局，并迫使他们在新的上涨趋势中以更高的价位入场。某些最强劲的趋势就发生在这期间，这些陷阱告诉交易员们最后一批空头交易员已经认输离场，市场上没有人再沿着原来的趋势做空。另外还告诉我们，弱势的多头交易员刚刚离场，现在正追逐新的上涨趋势，在新的方向上准备挂单入场。这些信息将大大增强交易员们的信心。这种令人激动的反转行情发生在趋势线突破和对趋势极值测试之后，新一轮趋势通常至少持续10根K线，然后将沿着旧趋势方向回调较大幅度。","pid":"p44"},{"t":"para","text":"即使在5分钟图上没有出现回调K线，我们在1分钟图或3分钟图上发现趋势启动初期有回调也是很常见的，而这种现象正好把交易员们震出去。有时候交易员们会基于5分钟图的信号入场，并认为利用更小时间周期的图表来设置止损位是明智之举。然而，当5分钟图的信号很强烈时，这种止损操作一般都是错误的做法。与其利用更小时间周期所设定的止损位离场，不如再忍耐几根K线的时间且看后续发展情况，否则你将会频繁地被市场洗出大趋势之外。","pid":"p45"},{"t":"para","text":"如果交易员极早入场了，但市场却在儿根K线上表现迟疑（例如出现反复震荡的K线），我们大可不必担心，尤其当那些K线大部分都与大趋势方向波动一致的时候。这是动能的体现，每个人都注视着，并等待势头突显后大举进场。一个优秀的价格行为交易员常常在动能显现前就已经入场，然后在趋势启动不久时就将其止损位移至盈亏平衡点，使自己能够以最小的风险博取更多的利润。如果你对自己的读图能力非常有信心，不必担心众人皆醉我独醒的情况，尽管放心进行交易。其他人最终也将看到你之前所看到的东西。即使有时候你会在盈亏平衡点上止损被踢出一两次，也要确保自己在趋势启动前已经半仓甚至满仓。","pid":"p46"},{"t":"para","text":"那么最佳的反转入场条件是什么呢？最佳的反转入场条件出现在回调行情的末端，当短期的逆势波动即将结束，行情正反转回归主要趋势方向的时候。换言之，最佳的反转入场时机是牛市中的上升旗形正突破上行时，或者熊市中的下降旗形正翻转下行时。主要的趋势反转是不太常见的，因为大部分反转尝试都最终败北而变成旗形。反转交易可以以传统反转形态为基础，在趋势线突破并对极值进行测试之后，都有一次强烈的逆势波动导致总在场内的状态翻转为相反的趋势方向。如果这一切发生在趋势线突破之后，往往会出现一二个二次入场机会。如果原来的趋势很强劲，通常来说最好的办法是等待二次入场机会：但如果二次入场机会没有出现。市场将很可能走出一波足够强烈的逆势波动，使大多数交易员都相信总在场内的头寸已经反转。举例而言，在牛市中，如果交易员们正在寻找反转的迹象，但反转的入场条件并不十分坚定，他们应该再等一等，看市场在接下来的五根K线附近是否再次小幅或大幅向上反拉，在此过程中提供二次入场机会。如果市场并没有向上反拉，而是继续下跌了四五根K线，打破了传统的反转形态，然后在接下来的K线里走出了后续行情，那么这种空头力量的展现足以令大多数交易员确信总在场内的头寸已经翻转为空。他们将在市价或价格反抽时卖出做空。","pid":"p47"},{"t":"para","text":"大部分的这些内容都在第二本书关于震荡区间的章节里讨论过，但和这里所说的内容也是相关的，因为人们普遍误以为反转形态是可靠的。趋势在发展过程中持续不断地产生反转形态，除了最后一个反转成功外。之前的反转形态都以失败告终，因此将这些经常讨论的形态看作反转形态是一种颇具误导性的做法。更准确来说，应该把它们看作是极少破产的持续整理形态，但如果持续形态破产了，那么随之而来的就会是行情反转。把每一个顶部或底部视为绝佳的反转入场条件是错误的，如果抓住每一次反转的机会进行逆势交易，你的绝大部分交易都将亏钱，而偶尔几笔赢钱的交易并不能弥补你的损失。不过，如果你有选择性地伺机而行，耐心寻找趋势可能反转的其他证据，那这些将可能成为有效的入场条件。","pid":"p48"},{"t":"para","text":"所有头肩顶和头肩底实际上都是头肩形持续整理形态（旗形），因为它们都属于震荡区间，也正如所有的震荡区间一样，它们更可能沿着趋势方向突破，很少能让趋势反转。对双重顶和双重底来说也是如此。例如，如果在牛市中出现一个头肩顶，向下击穿颈线的突破行情通常都会失败，市场接下来最有可能反转上行，并顺势突破右肩继续上行。这种形态构成一个三角形，一个三重底，或一个楔形上升旗形，三次下推分别为左肩、头部、右肩后面的下降小波段。其他多头把从头部跌至颈线的波段看成为上升旗形，把反弹形成右肩的波段看成为对这个上升旗形的向上突破。从右肩跌至颈线的波段就是突破后行情的浅度或深度回踩，如果市场反转上行了，多头就把这次反转看作做多的入场条件。","pid":"p49"},{"t":"para","text":"右肩形成了更低的高点，空头把它看作新一轮熊市的首次反弹，因而反弹至右肩的波段就是一个下降旗形。如果价格向上超越右肩，那么这个下降旗形就宣告失败，市场通常就会反弹走出一波可测量的上涨行情，反弹幅度为右肩的高度，或者整个头肩顶形态的高度。此外，如果熊市期间行情反复震荡。而且这个震荡区间的形状近似于一个头肩顶的形态，那么向下突破颈线的行情就是一次对下降旗形的顺势突破，市场很可能下探至更低的价格。","pid":"p50"},{"t":"para","text":"同理，头肩底也是一种顺势的入场条件。在熊市中的头肩底通常形成二个三角形或楔形下降旗形，行情应该会向下突破至右肩下方。在牛市中的头肩底是一个上升旗形，行情应该会向上突破至颈线上方。而右肩本身就是一个小级别的上升旗形，如果价格在其下方运行，那么这一形态就已经宣告失败，通常情况下一波下跌行情便会随之而来。","pid":"p51"},{"t":"img","src":"assets/img/p1_0_001.webp","ctx":[{"t":"右肩形成了更低的高点，空头把它看作新一轮熊市的首次反弹，因而反弹至右肩的波段就是一个下降旗形。如果价格向上超越右肩，那么这个下降旗形就宣告失败，市场通常就会反弹走出一波可测量的上涨行情，反弹幅度为右肩的高度，或者整个头肩顶形态的高度。此外，如果熊市期间行情反复震荡。而且这个震荡区间的形状近似于一个头肩顶的形态，那么向下突破颈线的行情就是一次对下降旗形的顺势突破，市场很可能下探至更低的价格。","p":"p50"},{"t":"同理，头肩底也是一种顺势的入场条件。在熊市中的头肩底通常形成二个三角形或楔形下降旗形，行情应该会向下突破至右肩下方。在牛市中的头肩底是一个上升旗形，行情应该会向上突破至颈线上方。而右肩本身就是一个小级别的上升旗形，如果价格在其下方运行，那么这一形态就已经宣告失败，通常情况下一波下跌行情便会随之而来。","p":"p51"},{"t":"大部分反转形态在至少80%的时间里都以失败告终，如图PI.1所示的道琼斯工业指数月线图中的大级别头肩顶形态，很可能也会破产，变成一个大级别的形上升旗形，或者其他类型的上升旗形。下探至K线13的这波下跌高潮非常强势，很可能会以一个更低低点的形式被测试，形成一个楔形上升旗形，并在一二十年之后创出新高。从K线13开始的反弹，便是在K线13与K线9构成的双重底处启动的一波反弹行情。","p":"p52"},{"t":"K线8是左肩的顶部。K线11是头部，而右肩在K线16处开始成型，如果市场准备反转下行的话，那么在此之前，行情可能会达到一个新高度，并形成一个扩张三角形顶，或突破进入一个新的上升波段，然后继续上扬，完成一波基于震荡区间高度的可测量上涨行情。这波上扬的幅度，可以是K线9低点到K线8或K线11低点之间的高度，或者K线13低点到K线11高点之间的高度。","p":"p53"},{"t":"靠销售恐慌为生的时事通讯作者们，通过吓晓人们大赚一笔，使大家相信道指将会跌至1000点下方，但他们并不理解这只是牛市中的一波区间震荡行情，因此有80%以上的概率暗示这个震荡区间在远远跌破K线13之前会先突破上行。对一个交易员来说，下注于拥有80%成功率的事件才是明智之举。但时事通讯作者仅依赖于制造市场恐慌，虽然只有20%甚至更低的准确率，却能赚更多的钱。他们需要罕见的灾难性事件来引起市场恐慌，使人们开始担心自己的资金安全。如果行情崩盘非常常见，人们就能从中学会如何应对及如何交易，市场也不会弥漫太多的恐慌情绪以供这些作者们获得敛财之机。","p":"p54"},{"t":"在K线1K线2和K线4低点下方绘制出上涨趋势线，这条上涨趋势线运行期间有可能被价格击穿，在K线9和K线13低点下方绘制出趋势通道线，这条趋势通道线是头肩顶的颈线，市场很有可能在上涨趋势线和趋势通道线附近形成“决斗线”底部。顺便提一句，我们连接K线4和K线5低点画出一条上涨趋势线，注意看2008到2009年的崩盘行情，价格向下突破这条上涨趋势线后，从K线7与K线9组成的双重底下方开始反转上行。这种情况是很经常发生的。行情在K线7附近就开始反复震荡，大部分试图突破震荡区间的尝试都最终无功而返。市场是有惯性的，并倾向于维持它原来的状态。这也使得大部分趋势反转的尝试都空手而回空头把头肩顶的右肩看作新一轮熊市中的更低的高点。以及行情的首次反扑。因此它是一个下降旗形。如果市场明确地向下突破这个下降旗形，然后反转上行，并反弹至右肩顶部上方，不论这期间行情是否向下突破过头肩顶的颈线，这个形态也将宣告失败。反弹行情通常能上行达到一个可测量的盈利目标幅度，这个幅度等于或高于右肩高度或整个头肩顶形态的高度。有些交易员把颈线看成是一条穿过头部及右肩（此处指K线13低点）之间底部的水平线，而其他交易员则把它看成是一条链接头部两侧低点的趋势线通道线（此处指K线9和13）。","p":"p55"},{"t":"跌至K线13的波段势头强劲，它很可能会被测试，由于跌势凶猛，接下来的测试行情很可能会深度回踩，形成一个更低的低点。这种情况应该能把空头套进来并把多头震出去，然后市场从一个楔形上升旗形中反转上行的概率将大大增加。如果发生这种情况，价格最有可能向上突破K线11，并走出一波可测量的上涨行情：但这中间也许需要经历一二十年的时间。","p":"p56"},{"t":"在价格向K线13崩盘低点行进的交易日里，一个熟悉“决斗线”形态的交易员可能已经看到行情反转上行的潜力，尤其在早前几根K线形成了小级别的最终旗形之后，市场出现连续的卖出高潮，以及大级别的扩张三角形上升旗形（K线7、8、9、11和13）。","p":"p57"},{"t":"如果市场真的从K线9前后的一个更低的高点开始下跌，价格可能会在连接K线1和K线4低点的趋势线附近找到支撑。这是一条特别重要的趋势线。因为它包含了1987年崩盘行情的低点。而1987年的崩盘也是自经济大萧条以来股票市场中最具戏剧性的事件。如此重要的事件会让交易员们心生敬畏，并密切关注与之相关的任何技术形态。","p":"p58"},{"t":"之所以叫作市场龙头股，是因为这些股票往往不仅在价格上领先于大盘，在时间上也领先于大盘。","p":"p59"}]},{"t":"para","text":"大部分反转形态在至少80%的时间里都以失败告终，如图PI.1所示的道琼斯工业指数月线图中的大级别头肩顶形态，很可能也会破产，变成一个大级别的形上升旗形，或者其他类型的上升旗形。下探至K线13的这波下跌高潮非常强势，很可能会以一个更低低点的形式被测试，形成一个楔形上升旗形，并在一二十年之后创出新高。从K线13开始的反弹，便是在K线13与K线9构成的双重底处启动的一波反弹行情。","pid":"p52"},{"t":"para","text":"K线8是左肩的顶部。K线11是头部，而右肩在K线16处开始成型，如果市场准备反转下行的话，那么在此之前，行情可能会达到一个新高度，并形成一个扩张三角形顶，或突破进入一个新的上升波段，然后继续上扬，完成一波基于震荡区间高度的可测量上涨行情。这波上扬的幅度，可以是K线9低点到K线8或K线11低点之间的高度，或者K线13低点到K线11高点之间的高度。","pid":"p53"},{"t":"para","text":"靠销售恐慌为生的时事通讯作者们，通过吓晓人们大赚一笔，使大家相信道指将会跌至1000点下方，但他们并不理解这只是牛市中的一波区间震荡行情，因此有80%以上的概率暗示这个震荡区间在远远跌破K线13之前会先突破上行。对一个交易员来说，下注于拥有80%成功率的事件才是明智之举。但时事通讯作者仅依赖于制造市场恐慌，虽然只有20%甚至更低的准确率，却能赚更多的钱。他们需要罕见的灾难性事件来引起市场恐慌，使人们开始担心自己的资金安全。如果行情崩盘非常常见，人们就能从中学会如何应对及如何交易，市场也不会弥漫太多的恐慌情绪以供这些作者们获得敛财之机。","pid":"p54"},{"t":"para","text":"在K线1K线2和K线4低点下方绘制出上涨趋势线，这条上涨趋势线运行期间有可能被价格击穿，在K线9和K线13低点下方绘制出趋势通道线，这条趋势通道线是头肩顶的颈线，市场很有可能在上涨趋势线和趋势通道线附近形成“决斗线”底部。顺便提一句，我们连接K线4和K线5低点画出一条上涨趋势线，注意看2008到2009年的崩盘行情，价格向下突破这条上涨趋势线后，从K线7与K线9组成的双重底下方开始反转上行。这种情况是很经常发生的。行情在K线7附近就开始反复震荡，大部分试图突破震荡区间的尝试都最终无功而返。市场是有惯性的，并倾向于维持它原来的状态。这也使得大部分趋势反转的尝试都空手而回空头把头肩顶的右肩看作新一轮熊市中的更低的高点。以及行情的首次反扑。因此它是一个下降旗形。如果市场明确地向下突破这个下降旗形，然后反转上行，并反弹至右肩顶部上方，不论这期间行情是否向下突破过头肩顶的颈线，这个形态也将宣告失败。反弹行情通常能上行达到一个可测量的盈利目标幅度，这个幅度等于或高于右肩高度或整个头肩顶形态的高度。有些交易员把颈线看成是一条穿过头部及右肩（此处指K线13低点）之间底部的水平线，而其他交易员则把它看成是一条链接头部两侧低点的趋势线通道线（此处指K线9和13）。","pid":"p55"},{"t":"para","text":"跌至K线13的波段势头强劲，它很可能会被测试，由于跌势凶猛，接下来的测试行情很可能会深度回踩，形成一个更低的低点。这种情况应该能把空头套进来并把多头震出去，然后市场从一个楔形上升旗形中反转上行的概率将大大增加。如果发生这种情况，价格最有可能向上突破K线11，并走出一波可测量的上涨行情：但这中间也许需要经历一二十年的时间。","pid":"p56"},{"t":"para","text":"在价格向K线13崩盘低点行进的交易日里，一个熟悉“决斗线”形态的交易员可能已经看到行情反转上行的潜力，尤其在早前几根K线形成了小级别的最终旗形之后，市场出现连续的卖出高潮，以及大级别的扩张三角形上升旗形（K线7、8、9、11和13）。","pid":"p57"},{"t":"para","text":"如果市场真的从K线9前后的一个更低的高点开始下跌，价格可能会在连接K线1和K线4低点的趋势线附近找到支撑。这是一条特别重要的趋势线。因为它包含了1987年崩盘行情的低点。而1987年的崩盘也是自经济大萧条以来股票市场中最具戏剧性的事件。如此重要的事件会让交易员们心生敬畏，并密切关注与之相关的任何技术形态。","pid":"p58"},{"t":"para","text":"之所以叫作市场龙头股，是因为这些股票往往不仅在价格上领先于大盘，在时间上也领先于大盘。","pid":"p59"},{"t":"img","src":"assets/img/p1_0_002.webp","ctx":[{"t":"如果市场真的从K线9前后的一个更低的高点开始下跌，价格可能会在连接K线1和K线4低点的趋势线附近找到支撑。这是一条特别重要的趋势线。因为它包含了1987年崩盘行情的低点。而1987年的崩盘也是自经济大萧条以来股票市场中最具戏剧性的事件。如此重要的事件会让交易员们心生敬畏，并密切关注与之相关的任何技术形态。","p":"p58"},{"t":"之所以叫作市场龙头股，是因为这些股票往往不仅在价格上领先于大盘，在时间上也领先于大盘。","p":"p59"},{"t":"如图PI.2所示，注意观察下方苹果（AAPL）的日线图，在K线3或K线4处股价先于标普指数（SPY）见顶。当市场龙头股开始反转下行而大盘还没反应时，这常常是一个大盘可能即将调整的征兆。交易员们从风险偏好型的股票转向风险规避型的股票，风险偏好型的股票在强市中涨势迅猛，风险规避型的股票更加稳定，在弱市中下跌幅度相对较小。当交易员们认为市场深度调整迫在眉睫时，他们会把账面浮盈最多的股票先卖掉，这些股票通常就是龙头股。即使苹果的小幅下跌仅仅是因为他们将投资规模从超额持有转变为常规持有，这也可以表明市场正预期大盘即将面临调整。","p":"p60"},{"t":"顺便提及的是。大部分反转尝试都是无功而返的，很多交易员都伺机在反转处做反手交易。当他们看到在上涨趋势中有一根阴线收在最低点，如K线4，尤其最低点位于移动平均线附近时，激进的多头就会在阴线的收盘价处买入，并试着在其低点下方继续做多。他们初始的止损幅度和首个止盈目标可能与这根阴线的高度一致，然后再预期市场走出一波可测量的上涨行情。如果接下来是一根阳线，如图所示，交易员们将在其收盘价及其高点上方买入。他们等着像这样的大阴线出现，把它们看作是以更低价位买入的短暂的好机会。空头刮头皮交易员同样喜欢这些大阴线，当多头正趁着回调买入时，空头在此处获利了结，平掉他们的空头头寸。","p":"p61"},{"t":"当针对图表的讨论持续几页时，记住你可以去舵手的网站（www.duoshou108.com）观看图表，或把它打印出来，这样你就可以一边看图一边阅读书上对图表的描述，而不必反复翻页查看图表","p":"p62"}]},{"t":"para","text":"如图PI.2所示，注意观察下方苹果（AAPL）的日线图，在K线3或K线4处股价先于标普指数（SPY）见顶。当市场龙头股开始反转下行而大盘还没反应时，这常常是一个大盘可能即将调整的征兆。交易员们从风险偏好型的股票转向风险规避型的股票，风险偏好型的股票在强市中涨势迅猛，风险规避型的股票更加稳定，在弱市中下跌幅度相对较小。当交易员们认为市场深度调整迫在眉睫时，他们会把账面浮盈最多的股票先卖掉，这些股票通常就是龙头股。即使苹果的小幅下跌仅仅是因为他们将投资规模从超额持有转变为常规持有，这也可以表明市场正预期大盘即将面临调整。","pid":"p60"},{"t":"para","text":"顺便提及的是。大部分反转尝试都是无功而返的，很多交易员都伺机在反转处做反手交易。当他们看到在上涨趋势中有一根阴线收在最低点，如K线4，尤其最低点位于移动平均线附近时，激进的多头就会在阴线的收盘价处买入，并试着在其低点下方继续做多。他们初始的止损幅度和首个止盈目标可能与这根阴线的高度一致，然后再预期市场走出一波可测量的上涨行情。如果接下来是一根阳线，如图所示，交易员们将在其收盘价及其高点上方买入。他们等着像这样的大阴线出现，把它们看作是以更低价位买入的短暂的好机会。空头刮头皮交易员同样喜欢这些大阴线，当多头正趁着回调买入时，空头在此处获利了结，平掉他们的空头头寸。","pid":"p61"},{"t":"para","text":"当针对图表的讨论持续几页时，记住你可以去舵手的网站（www.duoshou108.com）观看图表，或把它打印出来，这样你就可以一边看图一边阅读书上对图表的描述，而不必反复翻页查看图表","pid":"p62"},{"t":"img","src":"assets/img/p1_0_003.webp","ctx":[{"t":"顺便提及的是。大部分反转尝试都是无功而返的，很多交易员都伺机在反转处做反手交易。当他们看到在上涨趋势中有一根阴线收在最低点，如K线4，尤其最低点位于移动平均线附近时，激进的多头就会在阴线的收盘价处买入，并试着在其低点下方继续做多。他们初始的止损幅度和首个止盈目标可能与这根阴线的高度一致，然后再预期市场走出一波可测量的上涨行情。如果接下来是一根阳线，如图所示，交易员们将在其收盘价及其高点上方买入。他们等着像这样的大阴线出现，把它们看作是以更低价位买入的短暂的好机会。空头刮头皮交易员同样喜欢这些大阴线，当多头正趁着回调买入时，空头在此处获利了结，平掉他们的空头头寸。","p":"p61"},{"t":"当针对图表的讨论持续几页时，记住你可以去舵手的网站（www.duoshou108.com）观看图表，或把它打印出来，这样你就可以一边看图一边阅读书上对图表的描述，而不必反复翻页查看图表","p":"p62"},{"t":"如图PI.3所示，电子迷你期货的日线图发生了很多趋势变化，所有这些变化都遵循了标准的价格行为规范。","p":"p63"},{"t":"K线2是一个最终下降旗形反转（将在第7章中讨论），引出了一波强势上扬，价格涨至K线3，并超越了下跌趋势最后一个更低的高点在任何时候市场走出一个波段新高，都是一种动能的体现。即使这个高点出现在前一波下跌行情中，而不属于上涨趋势中一系列更高高点的其中一个","p":"p64"},{"t":"K线4形成了一个更高低点的做多入场条件，我们可以利用它画出一条上涨趋势线。它也是行情向上突破下跌波段最后一个更低高点后的一次回调。","p":"p65"},{"t":"K线5回调至趋势线下方，然后立即反转上行，构成一个失败的楔形下降旗形做多入场条件（K线2前面的波段高点是三推模式的第二次上推）。不过，现在这里产生了一条较为平坦的趋势线。","p":"p66"},{"t":"K线6是一个小级别的楔形顶，价格回调至K线7生成了一条新的趋势线。","p":"p67"},{"t":"K线8价格开始下行，是K线6楔形顶之后的向下反转，而楔形反转通常引出两个回合的下降小波段。它是行情向下突破形顶部信号K线6之后的一次大幅反拉，并形成二个更高的高点","p":"p68"},{"t":"跌至K线9的小波段猛烈跌破上涨趋势中最后一个更高的低点（K线7），展现了空头的力量。","p":"p69"},{"t":"涨至K线10的双波段反弹势头强劲，并形成了一个更低的高点对趋势高点的冲击。它和K线8组成了一个可能的双重顶。它是从K线9下降尖形开始的一次反弹，并很可能引出第二回合的下降小波段，对K线9下降尖形的低点进行试探。此后伴随的也许是一条下降通道或一个震荡区间。","p":"p70"},{"t":"K线11在小幅跌破K线9后反转上行，所以这很可能是原先上涨趋势双波段调整的末端。它和K线9构成了一个双重底。但是，这次调整打破了从K线2低点开始的主要趋势线，这意味着市场冲击了K线8高点后可能会反转下行。有些交易员可能会采用连接K线4与K线7低点的上涨趋势线，而其他交易员则采用连接K线2与K线7低点的上涨趋势线。","p":"p71"},{"t":"价格向下突破上涨趋势线后，走出了一波含两个小波段的反弹行情，并在K线12处形成了一个更高的高点。如果这里引发趋势反转，那么新一轮下跌趋势应该至少包含两个回合的下降小波段。K线12这里也是对K线8与10构成的双重顶的一次失败的突破。无论什么时候，当向上突破双重顶以失败告终时，便形成一个三推顶。这里的头两推是指双重顶中的K线8和K线10的顶部。此外，它也是一个小级别的扩张三角形顶（K线6，7，8，11,12）。","p":"p72"},{"t":"跌至K线13的第一回合下降小波段非常强势，远远跌破从K线8到K线11之间的上升旗形。而一个强势的尖形波动通常都会引起之后第二回合幅度可测量的行情走势，这个可测量的幅度通常等于第一回合的波动幅度，在这个例子中第二回合跌至K线15的下降小波段（从K线14到K线15）的跌幅，略大于第一回合跌至K线13的下降小波段。","p":"p73"},{"t":"K线14更低的高点一旦成型，就可以用来绘制趋势线和趋势通道线。","p":"p74"},{"t":"K线15从它的趋势通道线突破点处反转上行，因此它应该能走出两个回合的上升小波段，并向上突破下跌趋势线，事实上也正是如此。","p":"p75"},{"t":"K线16向下突破了第一条上涨趋势线并反转上行，与六根K线之前的更高低点组成一个双重底上升旗形。","p":"p76"},{"t":"价格向上突破了上涨趋势通道线后在K线17处发生回调，同时K线16前面两个波段高点组成了双重顶，K线17也是向上突破这一双重顶之后的回调。有些交易员会把这个双重顶看作一个楔形顶，由K线15低点之后的三次小的上推构成。","p":"p77"},{"t":"这次反弹在K线18处的一个小级别楔形中结束，它形成了一个所谓的新高和一个扩张三角形顶（K线8、11、12、15和18）。K线18也是上升尖形（K线17回调之前紧挨着的尖形）之后的上升通道顶部。","p":"p78"},{"t":"K线19跌破了上涨趋势线，因此是对趋势线的一次向下突破。价格在此处反转上行，尝试破坏这次向下突破。而这次尝试并未能使上涨趋势恢复，价格反抽至K线20后回落，演变成一次价格向下突破上涨趋势线后的反弹行情，并形成一个更低的高点。要记住，任何未能令趋势复辟的失败突破都成为价格突破进入新趋势后的一次回调。","p":"p79"},{"t":"K线20这一更低的高点可以用来绘制出下跌趋势线和趋势通道线。","p":"p80"},{"t":"K线21跌破了趋势通道线，并形成了以K线19为第一次下推的形底。它也是从K线20开始两个小波段下跌后一个小级别楔形下降通道的底部。K线21与K线15构成了二个双重底，并测试了由K线2和K线15低点连接而成的震荡区间底部。","p":"p81"},{"t":"反弹至K线22的波段向上突破了下跌趋势中最近一个小高点，以及一个小级别的双重顶和下跌趋势线。对K线22高点的冲击在K线23处失败了（价格没有超越K线22），因此很可能形成另一个下降小波段。","p":"p82"},{"t":"价格跌破趋势通道线，并突破了大型的震荡区间，然后在K线24处反转上行。这里可以构建出一个位置较低的震荡区间，该图可能变得类似于一个行情反复震荡的交易日里的5分钟图。这次价格下探几乎是一次精确的可测量下跌行情，测量基准为K线20高点到K线21低点。这个下降尖形出现了数根大阴线，跌势凶猛，是一次抛售高潮，在此后行情上行之前可能需要两个波段的时间进行横盘整理。而这个双波段调整以K线26为结尾。抛售高潮并不一定带来反转。它只是意味着市场走得太远太快了，需要一段休整期，让交易员们冷静下来思考并决定下一步应该怎么做。","p":"p83"},{"t":"反弹至K线25的波段突破了陡峭的下跌趋势线。并测试了上文提到的震荡区间的底部。","p":"p84"},{"t":"K线26没能超越K线25的第一次上扬，这个更低的高点或双重顶下降旗形很可能引出一波下跌行情，要么形成一个新低（示例上正是如此），要么形成一个双波段回调的上升旗形。","p":"p85"},{"t":"价格在K线25处向上突破下跌趋势线后，走出了一波含两个小波段的回调行情，并在K线27处形成了一个更低的低点。第二回合的下降小波段以K线26为开端。这里可能是一个趋势反转的入场条件，或者至少是展开一段长期的调整行情的前兆。跌至K线24的向下突破，可能正在构建一个位置较低的震荡区间，高度近似于上文提到的K线15低点至K线18高点之间的震荡区间。","p":"p86"},{"t":"K线28是两个回合上升小波段后的一次回调，它形成了第二个更高的低点，因此接下来的行情至少可能走出另外两回合的上升小波段。从K线27到K线28的波动所覆盖的K线太少，所涵盖的价格区间过窄，不足以让足够多的交易员相信调整行情已经结束。此外，K线27低点后面还有一个比K线28略低的波段低点，K线28与这个低点一起组成了一个双重底上升旗形。","p":"p87"},{"t":"K线29是一个小级别楔形的第三推，但从K线28开始的那波上涨足够强势，会让交易员们在积极做空前三思而行。","p":"p88"},{"t":"K线30是价格向下突破小级别楔形后反弹的一个更高的高点，它也是一个大级别楔形的顶部，这个大级别楔形以K线28低点前面的那个高点为第一次上推。行情在K线30处为突破进入过去几个月所形成的上方的震荡区间做第二次尝试，同样无功而返，每当市场为了达到某种状态两次尝试两次败北时，通常都会尝试相反的事情。这里，接下来的这波下跌使价格向下突破了以K线27低点为底部的下方震荡区间。","p":"p89"},{"t":"价格突破了上涨趋势线后，在K线31处形成了一个双重顶下降旗形。这是可能的下跌趋势恢复过程中一个更低的高点，因此是一个很强的做空入场条件。","p":"p90"},{"t":"K线32测试了楔形下跌趋势通道线，并尝试与K线28或它前面那个更高的低点一起构成一个双重底上升旗形。市场很可能在这里反转上行或暴跌。交易员们把K线32看作尝试向下突破K线28后的一次反弹。他们以低于K线32一个价位的价格挂条件单做空，还有在前一根K线那个波段低点的下方做空，这个波段低点也是楔形的低点。","p":"p91"},{"t":"价格在跌穿下跌趋势通道线后，在K线33处反转上行，并引出一波上穿趋势线的小规模反弹行情。K线33也是大级别扩张三角形的底部（K线24、25、27、30和33）。","p":"p92"},{"t":"上涨趋势中的回调是一个小规模的下跌趋势，比如跌至K线16的调整。反弹至K线19的波段向上突破了下跌趋势线，并提醒交易员们，试探了K线16低点后，市场可能出现主要趋势向上反转。K线20就是一根信号K线。这里说的“主要”二字容易给人一种错误的印象，让人以为特殊的事情一定会发生，但实际情况通常并非如此。它只是一个相对的说法，意思是趋势正在尝试反转。如此例所示，当每个小波段持续20根以上的K线时，交易员们一般不用“主要趋势反转”这一术语来表达，而采用其他的描述方式。交易员们习惯用术语来描述面前图表上正在发生的事情。如果他们用15分钟图来交易，K线28就会是一个双重顶的趋势向下反转。它在K线20向下突破上涨趋势线后冲击了K线7的趋势高点。","p":"p93"},{"t":"连续的买入高潮之后通常伴随着一波至少含两个小波段的延伸的调整行情。","p":"p94"}]},{"t":"para","text":"如图PI.3所示，电子迷你期货的日线图发生了很多趋势变化，所有这些变化都遵循了标准的价格行为规范。","pid":"p63"},{"t":"para","text":"K线2是一个最终下降旗形反转（将在第7章中讨论），引出了一波强势上扬，价格涨至K线3，并超越了下跌趋势最后一个更低的高点在任何时候市场走出一个波段新高，都是一种动能的体现。即使这个高点出现在前一波下跌行情中，而不属于上涨趋势中一系列更高高点的其中一个","pid":"p64"},{"t":"para","text":"K线4形成了一个更高低点的做多入场条件，我们可以利用它画出一条上涨趋势线。它也是行情向上突破下跌波段最后一个更低高点后的一次回调。","pid":"p65"},{"t":"para","text":"K线5回调至趋势线下方，然后立即反转上行，构成一个失败的楔形下降旗形做多入场条件（K线2前面的波段高点是三推模式的第二次上推）。不过，现在这里产生了一条较为平坦的趋势线。","pid":"p66"},{"t":"para","text":"K线6是一个小级别的楔形顶，价格回调至K线7生成了一条新的趋势线。","pid":"p67"},{"t":"para","text":"K线8价格开始下行，是K线6楔形顶之后的向下反转，而楔形反转通常引出两个回合的下降小波段。它是行情向下突破形顶部信号K线6之后的一次大幅反拉，并形成二个更高的高点","pid":"p68"},{"t":"para","text":"跌至K线9的小波段猛烈跌破上涨趋势中最后一个更高的低点（K线7），展现了空头的力量。","pid":"p69"},{"t":"para","text":"涨至K线10的双波段反弹势头强劲，并形成了一个更低的高点对趋势高点的冲击。它和K线8组成了一个可能的双重顶。它是从K线9下降尖形开始的一次反弹，并很可能引出第二回合的下降小波段，对K线9下降尖形的低点进行试探。此后伴随的也许是一条下降通道或一个震荡区间。","pid":"p70"},{"t":"para","text":"K线11在小幅跌破K线9后反转上行，所以这很可能是原先上涨趋势双波段调整的末端。它和K线9构成了一个双重底。但是，这次调整打破了从K线2低点开始的主要趋势线，这意味着市场冲击了K线8高点后可能会反转下行。有些交易员可能会采用连接K线4与K线7低点的上涨趋势线，而其他交易员则采用连接K线2与K线7低点的上涨趋势线。","pid":"p71"},{"t":"para","text":"价格向下突破上涨趋势线后，走出了一波含两个小波段的反弹行情，并在K线12处形成了一个更高的高点。如果这里引发趋势反转，那么新一轮下跌趋势应该至少包含两个回合的下降小波段。K线12这里也是对K线8与10构成的双重顶的一次失败的突破。无论什么时候，当向上突破双重顶以失败告终时，便形成一个三推顶。这里的头两推是指双重顶中的K线8和K线10的顶部。此外，它也是一个小级别的扩张三角形顶（K线6，7，8，11,12）。","pid":"p72"},{"t":"para","text":"跌至K线13的第一回合下降小波段非常强势，远远跌破从K线8到K线11之间的上升旗形。而一个强势的尖形波动通常都会引起之后第二回合幅度可测量的行情走势，这个可测量的幅度通常等于第一回合的波动幅度，在这个例子中第二回合跌至K线15的下降小波段（从K线14到K线15）的跌幅，略大于第一回合跌至K线13的下降小波段。","pid":"p73"},{"t":"para","text":"K线14更低的高点一旦成型，就可以用来绘制趋势线和趋势通道线。","pid":"p74"},{"t":"para","text":"K线15从它的趋势通道线突破点处反转上行，因此它应该能走出两个回合的上升小波段，并向上突破下跌趋势线，事实上也正是如此。","pid":"p75"},{"t":"para","text":"K线16向下突破了第一条上涨趋势线并反转上行，与六根K线之前的更高低点组成一个双重底上升旗形。","pid":"p76"},{"t":"para","text":"价格向上突破了上涨趋势通道线后在K线17处发生回调，同时K线16前面两个波段高点组成了双重顶，K线17也是向上突破这一双重顶之后的回调。有些交易员会把这个双重顶看作一个楔形顶，由K线15低点之后的三次小的上推构成。","pid":"p77"},{"t":"para","text":"这次反弹在K线18处的一个小级别楔形中结束，它形成了一个所谓的新高和一个扩张三角形顶（K线8、11、12、15和18）。K线18也是上升尖形（K线17回调之前紧挨着的尖形）之后的上升通道顶部。","pid":"p78"},{"t":"para","text":"K线19跌破了上涨趋势线，因此是对趋势线的一次向下突破。价格在此处反转上行，尝试破坏这次向下突破。而这次尝试并未能使上涨趋势恢复，价格反抽至K线20后回落，演变成一次价格向下突破上涨趋势线后的反弹行情，并形成一个更低的高点。要记住，任何未能令趋势复辟的失败突破都成为价格突破进入新趋势后的一次回调。","pid":"p79"},{"t":"para","text":"K线20这一更低的高点可以用来绘制出下跌趋势线和趋势通道线。","pid":"p80"},{"t":"para","text":"K线21跌破了趋势通道线，并形成了以K线19为第一次下推的形底。它也是从K线20开始两个小波段下跌后一个小级别楔形下降通道的底部。K线21与K线15构成了二个双重底，并测试了由K线2和K线15低点连接而成的震荡区间底部。","pid":"p81"},{"t":"para","text":"反弹至K线22的波段向上突破了下跌趋势中最近一个小高点，以及一个小级别的双重顶和下跌趋势线。对K线22高点的冲击在K线23处失败了（价格没有超越K线22），因此很可能形成另一个下降小波段。","pid":"p82"},{"t":"para","text":"价格跌破趋势通道线，并突破了大型的震荡区间，然后在K线24处反转上行。这里可以构建出一个位置较低的震荡区间，该图可能变得类似于一个行情反复震荡的交易日里的5分钟图。这次价格下探几乎是一次精确的可测量下跌行情，测量基准为K线20高点到K线21低点。这个下降尖形出现了数根大阴线，跌势凶猛，是一次抛售高潮，在此后行情上行之前可能需要两个波段的时间进行横盘整理。而这个双波段调整以K线26为结尾。抛售高潮并不一定带来反转。它只是意味着市场走得太远太快了，需要一段休整期，让交易员们冷静下来思考并决定下一步应该怎么做。","pid":"p83"},{"t":"para","text":"反弹至K线25的波段突破了陡峭的下跌趋势线。并测试了上文提到的震荡区间的底部。","pid":"p84"},{"t":"para","text":"K线26没能超越K线25的第一次上扬，这个更低的高点或双重顶下降旗形很可能引出一波下跌行情，要么形成一个新低（示例上正是如此），要么形成一个双波段回调的上升旗形。","pid":"p85"},{"t":"para","text":"价格在K线25处向上突破下跌趋势线后，走出了一波含两个小波段的回调行情，并在K线27处形成了一个更低的低点。第二回合的下降小波段以K线26为开端。这里可能是一个趋势反转的入场条件，或者至少是展开一段长期的调整行情的前兆。跌至K线24的向下突破，可能正在构建一个位置较低的震荡区间，高度近似于上文提到的K线15低点至K线18高点之间的震荡区间。","pid":"p86"},{"t":"para","text":"K线28是两个回合上升小波段后的一次回调，它形成了第二个更高的低点，因此接下来的行情至少可能走出另外两回合的上升小波段。从K线27到K线28的波动所覆盖的K线太少，所涵盖的价格区间过窄，不足以让足够多的交易员相信调整行情已经结束。此外，K线27低点后面还有一个比K线28略低的波段低点，K线28与这个低点一起组成了一个双重底上升旗形。","pid":"p87"},{"t":"para","text":"K线29是一个小级别楔形的第三推，但从K线28开始的那波上涨足够强势，会让交易员们在积极做空前三思而行。","pid":"p88"},{"t":"para","text":"K线30是价格向下突破小级别楔形后反弹的一个更高的高点，它也是一个大级别楔形的顶部，这个大级别楔形以K线28低点前面的那个高点为第一次上推。行情在K线30处为突破进入过去几个月所形成的上方的震荡区间做第二次尝试，同样无功而返，每当市场为了达到某种状态两次尝试两次败北时，通常都会尝试相反的事情。这里，接下来的这波下跌使价格向下突破了以K线27低点为底部的下方震荡区间。","pid":"p89"},{"t":"para","text":"价格突破了上涨趋势线后，在K线31处形成了一个双重顶下降旗形。这是可能的下跌趋势恢复过程中一个更低的高点，因此是一个很强的做空入场条件。","pid":"p90"},{"t":"para","text":"K线32测试了楔形下跌趋势通道线，并尝试与K线28或它前面那个更高的低点一起构成一个双重底上升旗形。市场很可能在这里反转上行或暴跌。交易员们把K线32看作尝试向下突破K线28后的一次反弹。他们以低于K线32一个价位的价格挂条件单做空，还有在前一根K线那个波段低点的下方做空，这个波段低点也是楔形的低点。","pid":"p91"},{"t":"para","text":"价格在跌穿下跌趋势通道线后，在K线33处反转上行，并引出一波上穿趋势线的小规模反弹行情。K线33也是大级别扩张三角形的底部（K线24、25、27、30和33）。","pid":"p92"},{"t":"para","text":"上涨趋势中的回调是一个小规模的下跌趋势，比如跌至K线16的调整。反弹至K线19的波段向上突破了下跌趋势线，并提醒交易员们，试探了K线16低点后，市场可能出现主要趋势向上反转。K线20就是一根信号K线。这里说的“主要”二字容易给人一种错误的印象，让人以为特殊的事情一定会发生，但实际情况通常并非如此。它只是一个相对的说法，意思是趋势正在尝试反转。如此例所示，当每个小波段持续20根以上的K线时，交易员们一般不用“主要趋势反转”这一术语来表达，而采用其他的描述方式。交易员们习惯用术语来描述面前图表上正在发生的事情。如果他们用15分钟图来交易，K线28就会是一个双重顶的趋势向下反转。它在K线20向下突破上涨趋势线后冲击了K线7的趋势高点。","pid":"p93"},{"t":"para","text":"连续的买入高潮之后通常伴随着一波至少含两个小波段的延伸的调整行情。","pid":"p94"},{"t":"img","src":"assets/img/p1_0_004.webp","ctx":[{"t":"上涨趋势中的回调是一个小规模的下跌趋势，比如跌至K线16的调整。反弹至K线19的波段向上突破了下跌趋势线，并提醒交易员们，试探了K线16低点后，市场可能出现主要趋势向上反转。K线20就是一根信号K线。这里说的“主要”二字容易给人一种错误的印象，让人以为特殊的事情一定会发生，但实际情况通常并非如此。它只是一个相对的说法，意思是趋势正在尝试反转。如此例所示，当每个小波段持续20根以上的K线时，交易员们一般不用“主要趋势反转”这一术语来表达，而采用其他的描述方式。交易员们习惯用术语来描述面前图表上正在发生的事情。如果他们用15分钟图来交易，K线28就会是一个双重顶的趋势向下反转。它在K线20向下突破上涨趋势线后冲击了K线7的趋势高点。","p":"p93"},{"t":"连续的买入高潮之后通常伴随着一波至少含两个小波段的延伸的调整行情。","p":"p94"},{"t":"如图PI.4所示，高盛（GS）股价图中的K线7比昨天的低点高出10%，随后的回调行情吞噬了连续两天的涨幅。从K线3到K线7的涨势非常强劲。很可能在回调后被测试。K线3这个大阳线，以及从K线4开始的连续三根阳线，都是一个买入高潮。这几根阳线的主体逐渐变短，这表明动能正一步步消耗。","p":"p95"},{"t":"然而，市场非但没有调整，而且还在K线6处进一步突破，趋势进入加速上涨期，并以四根K线涨至K线7后结束。在连续三次的买入高潮之后，市场很可能走出一波最短维持10根K线并至少含两个小波段的调整行情。此外，从K线2低点开始的九根K线拥有一系列更高的低点和一系列更高的高点，而且其中八根K线以更高的价位收盘。相邻的K线之间几乎没有相互重叠的区间。这是一种难以持久的现象，因此我们把它定义为高潮现象，事后市场很可能开始调整。K线3是一个上升尖形，从K线4到K线7的波动是这个尖形和高潮上涨趋势中的一条高潮型通道。","p":"p96"},{"t":"K线6使这轮趋势进入一个加速上涨期，因此它算是一个突破，交易员们会开始预期出现一个测量跳空缺口，以及其他类型的可测量波动，他们可以在这些价位上获利了结，甚至寻找可能的做空机会。K线6向上突破了K线5，而K线5是第三根连续逐渐变短的阳线。因此这些阳线的主体连起来形成了一个楔形的形状，市场也可能出现一些楔形行为。一旦K线6收盘时比K线5高点高出很多个价位，它就更有可能成为一个突破的起点，并在接下来的几个K线里走出一波后续行情。下一根K线收盘后，它的低点高于K线5的高点，K线6就成为一个跳空缺口，而且可能是一个测量跳空。K线5顶部是破产的楔形顶的突破口，在行情没有立即回调的情况下，突破后的第一根K线低点就是一次突破测试。这个跳空缺口可以看作测量跳空缺口，K线4开始的上升小波段，从其起点的最低点处到测量跳空缺口中点之间的距离，向上投射所达到的价位，仅比K线7高点略低。这一区间可能存在其他的磁力效应，不同的公司依赖于不同的磁力区间作为其平仓获利或做空的标志。这些磁力地带的累积效应导致市场开始进入调整期。","p":"p97"},{"t":"当价格跌至K线8时，市场突破了陡峭的趋势线。由于调整期要持续至少10根K线以上的时间，因此在K线8的高点1或K线10的高点2处买入都是错误的操作。以上两个买入条件都失效了，市场在K线11处形成了一个更低的高点，并构建出一个双重顶下降旗形。一旦市场向下突破K线10，该双重顶的高度向下投射在K线13的低点附近。跌至K线13的这一波走势较为陡峭，市场很可能将进一步下探。","p":"p98"},{"t":"K线16算是一个尚可接受的双波段调整的末端，第一回合的下降小波段结束于K线10。这次调整跌破了移动平均线，并持续了10根K线以上的时间。这种情况足以让很多交易员开始伺机买入，预期行情将测试K线7这一上涨趋势高点。K线16是一个楔形上升旗形的终点，该楔形上升旗形以K线13或K线14为三次下推中的第一推。有些交易员把K线13当作楔形的第一个小波段，而其他交易员则认为K线14才是第一个小波段。","p":"p99"},{"t":"K线17突破楔形上升旗形时显得比较疲弱，这表明这波调整可能还没结束。K线18是一个可接受的价格向上突破后的回调型做多入场条件，但价格突破楔形后却再次在K线20处深度回踩并形成一个更低的低点。这是趋势线突破（涨至K线19的波段向上突破了下跌趋势线）后的更低低点，可能也是这轮大规模上涨趋势中回调行情的末端。信号K线为一阳线，并收在其最高点。风险回报率对多头来说非常不错，因为这根K线的高度只覆盖了64美分，交易员们在此处买入，预期价格将会测试当天高位，而当天的高位比当前的价格高出将近4美元。由于他们在震荡区间的底部买入，成功率至少为60%，这意味着他们有60%的机会赚4美元，相对应的潜在亏损只有66美分。潜在亏损之所以比信号K线的高度多了2美分，是因为他们以条件单的形式在K线上方高一个价位的地方买入，而他们的保护性止损价要比信号K线的低点低一个价位一个强势的上升尖形在K线21处成型之后，多头开始把他们的止损价移至比K线21的低点低一个价位的地方，这里刚好位于盈亏平衡点附近。虽然你不必去看其他时间周期的图表，但一轮强烈趋势的第一次大型回调通常都会测试15分钟的移动平均线。这是一次几乎分毫不差的测试，但这种信息并不能给交易创造条件。当某个价格行为的做多入场条件像这个例子所显示的那么好时，我们应该注意观察，为什么入场K线是一根小的阳线。此时市场尚未意识到这根入场K线的价值。在一只重要的股票上，你把握自己认为是绝佳的机会进行交易，感到紧张是很正常的，但这时其他人还没有看到它的价值所在。这种情况时不时都会发生，市场先出现几根小的K线，通常为阳线，然后人们才察觉到牛市反转已经发生了。而这种普遍的察觉通常发生在出现大阳线的时候，比如K线21。K线21涨势强劲，动能充足，没有上下影线，这意味着多头极其激进，价格将继续走高。随着K线21这一上升尖形出现的是一条强势，狭窄的上升通道，行情一路上扬至K线28，交易员们可以在价格超越K线7高点时实现盈利兑现。","p":"p100"},{"t":"上涨趋势中的回调是一轮小规模的下跌趋势，比如跌至K线16的这波调整。反弹至K线19的波段向上突破了下跌趋势线，并提醒交易员，在行情测试K线16低点后，可能会出现一个主要趋势向上反转。不论你把它称为一个更低的低点或者双重底（由K线20和K线16组成），K线20就是一根信号K线。关键的是，你把它看作行情向上突破下跌趋势线后对趋势低点的测试。这样就构成了一个主要趋势反转。这里说的“主要”二字容易给人一种错误的印象，让人以为特殊的事情一定会发生，但实际情况通常并非如此。它只是一个相对的说法，意思是趋势正在尝试反转。如果趋势不是特别大规模，相应的反转也可能不太让人印象深刻。这里，市场走势为下跌趋势，也是上涨趋势中的一次回调，接下来的上涨也仅仅只是为了测试K线7这一趋势高点。回调至K线16的波段大幅跌破了上涨趋势线，反弹至K线28的波段则测试了趋势高点，并且成为一个主要趋势向下反转的入场条件。如此例所示，当每个小波段持续20根以上的K线时，交易员们一般不用“主要趋势反转”这一术语来表达，而采用其他的描述方式。向上反弹至K线28的波段持续了很多根K线，让交易员们有理由相信这是一轮新的趋势，而价格回落至K线29的波段跌破了上涨趋势线，然后向上反抽，并在K线30处形成了更低的高点，构成一个主要趋势向下反转。交易员们习惯用术语来描述面前图表上正在发生的事情。如果他们用15分钟图来进行交易，K线28就是一个双重顶的主要趋势下行，因为它在K线20向下突破上涨趋势线后测试了K线7的趋势高点，15分钟图上的每个小波段都包含10根以下的K线，这就不足以让交易员们相信新的趋势已经成型。","p":"p101"},{"t":"市场是有惯性的，并倾向于维持它原来的状态，这也使得大部分趋势反转的尝试都空手而回。大部分合理的主要趋势反转入场条件仅有40%到50%的成功率，如果入场条件十分坚定可靠，那么成功率也能达到60%以上。","p":"p102"}]},{"t":"para","text":"如图PI.4所示，高盛（GS）股价图中的K线7比昨天的低点高出10%，随后的回调行情吞噬了连续两天的涨幅。从K线3到K线7的涨势非常强劲。很可能在回调后被测试。K线3这个大阳线，以及从K线4开始的连续三根阳线，都是一个买入高潮。这几根阳线的主体逐渐变短，这表明动能正一步步消耗。","pid":"p95"},{"t":"para","text":"然而，市场非但没有调整，而且还在K线6处进一步突破，趋势进入加速上涨期，并以四根K线涨至K线7后结束。在连续三次的买入高潮之后，市场很可能走出一波最短维持10根K线并至少含两个小波段的调整行情。此外，从K线2低点开始的九根K线拥有一系列更高的低点和一系列更高的高点，而且其中八根K线以更高的价位收盘。相邻的K线之间几乎没有相互重叠的区间。这是一种难以持久的现象，因此我们把它定义为高潮现象，事后市场很可能开始调整。K线3是一个上升尖形，从K线4到K线7的波动是这个尖形和高潮上涨趋势中的一条高潮型通道。","pid":"p96"},{"t":"para","text":"K线6使这轮趋势进入一个加速上涨期，因此它算是一个突破，交易员们会开始预期出现一个测量跳空缺口，以及其他类型的可测量波动，他们可以在这些价位上获利了结，甚至寻找可能的做空机会。K线6向上突破了K线5，而K线5是第三根连续逐渐变短的阳线。因此这些阳线的主体连起来形成了一个楔形的形状，市场也可能出现一些楔形行为。一旦K线6收盘时比K线5高点高出很多个价位，它就更有可能成为一个突破的起点，并在接下来的几个K线里走出一波后续行情。下一根K线收盘后，它的低点高于K线5的高点，K线6就成为一个跳空缺口，而且可能是一个测量跳空。K线5顶部是破产的楔形顶的突破口，在行情没有立即回调的情况下，突破后的第一根K线低点就是一次突破测试。这个跳空缺口可以看作测量跳空缺口，K线4开始的上升小波段，从其起点的最低点处到测量跳空缺口中点之间的距离，向上投射所达到的价位，仅比K线7高点略低。这一区间可能存在其他的磁力效应，不同的公司依赖于不同的磁力区间作为其平仓获利或做空的标志。这些磁力地带的累积效应导致市场开始进入调整期。","pid":"p97"},{"t":"para","text":"当价格跌至K线8时，市场突破了陡峭的趋势线。由于调整期要持续至少10根K线以上的时间，因此在K线8的高点1或K线10的高点2处买入都是错误的操作。以上两个买入条件都失效了，市场在K线11处形成了一个更低的高点，并构建出一个双重顶下降旗形。一旦市场向下突破K线10，该双重顶的高度向下投射在K线13的低点附近。跌至K线13的这一波走势较为陡峭，市场很可能将进一步下探。","pid":"p98"},{"t":"para","text":"K线16算是一个尚可接受的双波段调整的末端，第一回合的下降小波段结束于K线10。这次调整跌破了移动平均线，并持续了10根K线以上的时间。这种情况足以让很多交易员开始伺机买入，预期行情将测试K线7这一上涨趋势高点。K线16是一个楔形上升旗形的终点，该楔形上升旗形以K线13或K线14为三次下推中的第一推。有些交易员把K线13当作楔形的第一个小波段，而其他交易员则认为K线14才是第一个小波段。","pid":"p99"},{"t":"para","text":"K线17突破楔形上升旗形时显得比较疲弱，这表明这波调整可能还没结束。K线18是一个可接受的价格向上突破后的回调型做多入场条件，但价格突破楔形后却再次在K线20处深度回踩并形成一个更低的低点。这是趋势线突破（涨至K线19的波段向上突破了下跌趋势线）后的更低低点，可能也是这轮大规模上涨趋势中回调行情的末端。信号K线为一阳线，并收在其最高点。风险回报率对多头来说非常不错，因为这根K线的高度只覆盖了64美分，交易员们在此处买入，预期价格将会测试当天高位，而当天的高位比当前的价格高出将近4美元。由于他们在震荡区间的底部买入，成功率至少为60%，这意味着他们有60%的机会赚4美元，相对应的潜在亏损只有66美分。潜在亏损之所以比信号K线的高度多了2美分，是因为他们以条件单的形式在K线上方高一个价位的地方买入，而他们的保护性止损价要比信号K线的低点低一个价位一个强势的上升尖形在K线21处成型之后，多头开始把他们的止损价移至比K线21的低点低一个价位的地方，这里刚好位于盈亏平衡点附近。虽然你不必去看其他时间周期的图表，但一轮强烈趋势的第一次大型回调通常都会测试15分钟的移动平均线。这是一次几乎分毫不差的测试，但这种信息并不能给交易创造条件。当某个价格行为的做多入场条件像这个例子所显示的那么好时，我们应该注意观察，为什么入场K线是一根小的阳线。此时市场尚未意识到这根入场K线的价值。在一只重要的股票上，你把握自己认为是绝佳的机会进行交易，感到紧张是很正常的，但这时其他人还没有看到它的价值所在。这种情况时不时都会发生，市场先出现几根小的K线，通常为阳线，然后人们才察觉到牛市反转已经发生了。而这种普遍的察觉通常发生在出现大阳线的时候，比如K线21。K线21涨势强劲，动能充足，没有上下影线，这意味着多头极其激进，价格将继续走高。随着K线21这一上升尖形出现的是一条强势，狭窄的上升通道，行情一路上扬至K线28，交易员们可以在价格超越K线7高点时实现盈利兑现。","pid":"p100"},{"t":"para","text":"上涨趋势中的回调是一轮小规模的下跌趋势，比如跌至K线16的这波调整。反弹至K线19的波段向上突破了下跌趋势线，并提醒交易员，在行情测试K线16低点后，可能会出现一个主要趋势向上反转。不论你把它称为一个更低的低点或者双重底（由K线20和K线16组成），K线20就是一根信号K线。关键的是，你把它看作行情向上突破下跌趋势线后对趋势低点的测试。这样就构成了一个主要趋势反转。这里说的“主要”二字容易给人一种错误的印象，让人以为特殊的事情一定会发生，但实际情况通常并非如此。它只是一个相对的说法，意思是趋势正在尝试反转。如果趋势不是特别大规模，相应的反转也可能不太让人印象深刻。这里，市场走势为下跌趋势，也是上涨趋势中的一次回调，接下来的上涨也仅仅只是为了测试K线7这一趋势高点。回调至K线16的波段大幅跌破了上涨趋势线，反弹至K线28的波段则测试了趋势高点，并且成为一个主要趋势向下反转的入场条件。如此例所示，当每个小波段持续20根以上的K线时，交易员们一般不用“主要趋势反转”这一术语来表达，而采用其他的描述方式。向上反弹至K线28的波段持续了很多根K线，让交易员们有理由相信这是一轮新的趋势，而价格回落至K线29的波段跌破了上涨趋势线，然后向上反抽，并在K线30处形成了更低的高点，构成一个主要趋势向下反转。交易员们习惯用术语来描述面前图表上正在发生的事情。如果他们用15分钟图来进行交易，K线28就是一个双重顶的主要趋势下行，因为它在K线20向下突破上涨趋势线后测试了K线7的趋势高点，15分钟图上的每个小波段都包含10根以下的K线，这就不足以让交易员们相信新的趋势已经成型。","pid":"p101"},{"t":"para","text":"市场是有惯性的，并倾向于维持它原来的状态，这也使得大部分趋势反转的尝试都空手而回。大部分合理的主要趋势反转入场条件仅有40%到50%的成功率，如果入场条件十分坚定可靠，那么成功率也能达到60%以上。","pid":"p102"},{"t":"img","src":"assets/img/p1_0_005.webp","ctx":[{"t":"上涨趋势中的回调是一轮小规模的下跌趋势，比如跌至K线16的这波调整。反弹至K线19的波段向上突破了下跌趋势线，并提醒交易员，在行情测试K线16低点后，可能会出现一个主要趋势向上反转。不论你把它称为一个更低的低点或者双重底（由K线20和K线16组成），K线20就是一根信号K线。关键的是，你把它看作行情向上突破下跌趋势线后对趋势低点的测试。这样就构成了一个主要趋势反转。这里说的“主要”二字容易给人一种错误的印象，让人以为特殊的事情一定会发生，但实际情况通常并非如此。它只是一个相对的说法，意思是趋势正在尝试反转。如果趋势不是特别大规模，相应的反转也可能不太让人印象深刻。这里，市场走势为下跌趋势，也是上涨趋势中的一次回调，接下来的上涨也仅仅只是为了测试K线7这一趋势高点。回调至K线16的波段大幅跌破了上涨趋势线，反弹至K线28的波段则测试了趋势高点，并且成为一个主要趋势向下反转的入场条件。如此例所示，当每个小波段持续20根以上的K线时，交易员们一般不用“主要趋势反转”这一术语来表达，而采用其他的描述方式。向上反弹至K线28的波段持续了很多根K线，让交易员们有理由相信这是一轮新的趋势，而价格回落至K线29的波段跌破了上涨趋势线，然后向上反抽，并在K线30处形成了更低的高点，构成一个主要趋势向下反转。交易员们习惯用术语来描述面前图表上正在发生的事情。如果他们用15分钟图来进行交易，K线28就是一个双重顶的主要趋势下行，因为它在K线20向下突破上涨趋势线后测试了K线7的趋势高点，15分钟图上的每个小波段都包含10根以下的K线，这就不足以让交易员们相信新的趋势已经成型。","p":"p101"},{"t":"市场是有惯性的，并倾向于维持它原来的状态，这也使得大部分趋势反转的尝试都空手而回。大部分合理的主要趋势反转入场条件仅有40%到50%的成功率，如果入场条件十分坚定可靠，那么成功率也能达到60%以上。","p":"p102"},{"t":"由于今天没有太大的买压（见图PI.5），价格至K线22的过程中抛压一直很强，K线22处是一个双K线反转，反弹至K线16的波段并不足以将总在场内的头寸翻转为多头，K线22这一更低低点成功引起反转的概率在40%左右。仅凭价格向上突破下跌趋势线。然后回踩形成一个更低低点，并不足以让反转交易获得更高的成功率。多头试图在K线28处构建一个双重底，并形成一个更高的低点，但这样的入场条件力度不大。K线28以阴线收盘，虽然下一根K线构成了双K线反转，但却迫使多头在震荡区间的顶部买入，这种操作手法成功率不高（这里所说的震荡区间包括从K线26开始的小型震荡区间，以及从K线10开始的大型震荡区间）。","p":"p103"},{"t":"对多头来说，另一个问题是空头的立场很坚定。K线2是一根巨大的阳线，伴随着巨大的成交量（98000张电子迷你期货合约），但市场甚至没能使K线6第三次上推的高点超越K线5的二次上推。令上涨趋势复辟的尝试开盘后便在昨天高点处宣告失败，然后市场就反转下行了。一旦市场突破至K线9下方，交易员们将认为当天行情要么呈反复震荡的下跌走势，要么急速向下波动后形成一个下降趋势通道。无论哪种情况，K线9都可能成为一个测量跳空缺口，并引出一波可测量的下跌行情。跌至K线10的波段出现了很多大阴线，只有三根为阳线，而且这三根阳线都非常短，开盘价和收盘价之间只相距一个价位。尽管下跌过程中行情反复震荡，但跌至K线10或K线14的波段强劲程度足以让很多交易员把它视为一个下降尖形。这让他们认为当天的行情可能出现三次下推，并在价格急速向下波动后形成一个下降趋势通道。他们在K线16这一缺口K线下方卖出，预期行情出现二次下推。交易员们在市场跌破K线14时买入，这表明空头并不急于做空。空头没有在新低处卖出，而是开始买入平仓获利了结。多头认为由于涨至K线16的波段向上突破了下跌趋势线，K线22这一更低的低点有可能成为主要趋势反转的起点，因此也在此处做多。这期间的阳线。以及价格向上突破移动平均线。都显示出多头力量正在增强。","p":"p104"},{"t":"在价格反弹至K线25期间，多头有很好的理由相信行情即将出现主要趋势反转，并希望价格在K线22更低低点之后形成一个更高的低点。而空头则认为当天行情将在急速向下波动后形成一个下降趋势通道，第三次下推依然会到来。多空双方的依据都很充分，立场也很坚定，这意味着接下来市场将呈现区间震荡，事实上也正是如此。多头希望震荡区间会变成一个向上突破的底部，与此同时，空头则把震荡区间看作一条开盘后跌至K线14的尖形所引出的宽幅下降通道。空头在K线25下方再次做空，因为这次反弹所到的价位依然低于行情第一次下推后价格反拉至K线16的位置，K线25和K线20组成了一个双重顶。虽然K线25比K线20高了一个价位。触发了一些止损单，但大多数基于先尖形后通道理论进行波段交易的空头会把他们的止损价设置在K线16上方，K线16也是行情第一次下推后的一次反弹。他们在K线29下方低点2处再次做空。K线29也是空头突破三角形的一根信号K线，在这个三角形中，K线24的前面那根K线为第一次下推，K线26和28为接下来的第二和第三次下推。","p":"p105"},{"t":"多头认为K线28和K线26组成了一个双重底，其中K线28为更高的低点，但他们担心的是K线28是一根阴线。尽管接下来是一根阳线，并出现一个双K线反转的做多入场条件，但在震荡区间的顶部（K线27就是这个小型震荡区间的顶部）买入并非一个好的选择。大多数多头会在反转阴线K线29处平仓离场。这是一个低点2卖出信号，一次三角形的失败突破。K线31后面那根K线是一个十字星阳线，它跟在三根阴线之后，对多头来说并不是一个好的买入理由。自K线31后面双K线最终旗形之后，K线32后面那根内含阳线又是一个最终旗形反转入场条件，但从K线29开始的微型下降通道振幅过窄，从而降低了在此处做多的成功率。虽然K线33强势向上突破了这个微型通道，但后续行情并没有延伸下去，因此多头在K线33后面那根内含阴线下方，或在低于接下来那根十字星一个价位处卖出平仓。多头有时候能够接受一根K线的走势与其头寸方向相反，但当原先的买入信号比较疲弱，而且K线33向上突破后行情并没有进一步延伸时，大多数交易员都不愿意看到他们开仓后连续两根K线都为阴线。","p":"p106"},{"t":"在这个例子中，多空双方都有波段交易的入场条件，并使其交易员等式趋于正数。在K线22这一更低低点处买入的多头拥有40%左右的成功率，其潜在亏损大约为2个点，而潜在收益为6到10个点（价格向上突破震荡区间并走出一波可测量的上涨行情）。空头如果在跌至K线14的尖形中做空，或者在K线16、20以及25下方卖出，便有50%到60%的机会在行情第三次下推时盈利一把，其潜在亏损大约为几个点，而潜在收益为4到6个点，如果市场不是呈下降阶梯走势，而是实现空头突破，并走出一波可测量的下跌行情，空头的盈利将更加丰厚。","p":"p107"},{"t":"跌至K线14的尖形比较疲弱。很多交易员预期接下来的行情会出现一个震荡区间，或一段弱势的下降通道。他们放弃做波段交易，而进行一整天的刮头皮操作，每笔盈利二到四个点位，当他们认为当天处于多空较量、行情反复的双向交易局面时，很多交易员都会这么做。","p":"p108"},{"t":"大多数交易员都不会进行反转交易，他们要求行情至少出现一个双重顶或双重底，一个微型的双重顶或双重顶，或一个最终旗形，才会考虑反转交易，而不管产生的形态多么微小。例如，K线6、8、18、20、25和29就是双重顶或微型双重顶，K线4、10、12、14、17、19、22、28和32就是双重底或微型双重底，K线3、6、10、12、14、16、18、19、22、25和32就是最终旗形反转（有些来自单K线最终旗形）。","p":"p109"}]},{"t":"para","text":"由于今天没有太大的买压（见图PI.5），价格至K线22的过程中抛压一直很强，K线22处是一个双K线反转，反弹至K线16的波段并不足以将总在场内的头寸翻转为多头，K线22这一更低低点成功引起反转的概率在40%左右。仅凭价格向上突破下跌趋势线。然后回踩形成一个更低低点，并不足以让反转交易获得更高的成功率。多头试图在K线28处构建一个双重底，并形成一个更高的低点，但这样的入场条件力度不大。K线28以阴线收盘，虽然下一根K线构成了双K线反转，但却迫使多头在震荡区间的顶部买入，这种操作手法成功率不高（这里所说的震荡区间包括从K线26开始的小型震荡区间，以及从K线10开始的大型震荡区间）。","pid":"p103"},{"t":"para","text":"对多头来说，另一个问题是空头的立场很坚定。K线2是一根巨大的阳线，伴随着巨大的成交量（98000张电子迷你期货合约），但市场甚至没能使K线6第三次上推的高点超越K线5的二次上推。令上涨趋势复辟的尝试开盘后便在昨天高点处宣告失败，然后市场就反转下行了。一旦市场突破至K线9下方，交易员们将认为当天行情要么呈反复震荡的下跌走势，要么急速向下波动后形成一个下降趋势通道。无论哪种情况，K线9都可能成为一个测量跳空缺口，并引出一波可测量的下跌行情。跌至K线10的波段出现了很多大阴线，只有三根为阳线，而且这三根阳线都非常短，开盘价和收盘价之间只相距一个价位。尽管下跌过程中行情反复震荡，但跌至K线10或K线14的波段强劲程度足以让很多交易员把它视为一个下降尖形。这让他们认为当天的行情可能出现三次下推，并在价格急速向下波动后形成一个下降趋势通道。他们在K线16这一缺口K线下方卖出，预期行情出现二次下推。交易员们在市场跌破K线14时买入，这表明空头并不急于做空。空头没有在新低处卖出，而是开始买入平仓获利了结。多头认为由于涨至K线16的波段向上突破了下跌趋势线，K线22这一更低的低点有可能成为主要趋势反转的起点，因此也在此处做多。这期间的阳线。以及价格向上突破移动平均线。都显示出多头力量正在增强。","pid":"p104"},{"t":"para","text":"在价格反弹至K线25期间，多头有很好的理由相信行情即将出现主要趋势反转，并希望价格在K线22更低低点之后形成一个更高的低点。而空头则认为当天行情将在急速向下波动后形成一个下降趋势通道，第三次下推依然会到来。多空双方的依据都很充分，立场也很坚定，这意味着接下来市场将呈现区间震荡，事实上也正是如此。多头希望震荡区间会变成一个向上突破的底部，与此同时，空头则把震荡区间看作一条开盘后跌至K线14的尖形所引出的宽幅下降通道。空头在K线25下方再次做空，因为这次反弹所到的价位依然低于行情第一次下推后价格反拉至K线16的位置，K线25和K线20组成了一个双重顶。虽然K线25比K线20高了一个价位。触发了一些止损单，但大多数基于先尖形后通道理论进行波段交易的空头会把他们的止损价设置在K线16上方，K线16也是行情第一次下推后的一次反弹。他们在K线29下方低点2处再次做空。K线29也是空头突破三角形的一根信号K线，在这个三角形中，K线24的前面那根K线为第一次下推，K线26和28为接下来的第二和第三次下推。","pid":"p105"},{"t":"para","text":"多头认为K线28和K线26组成了一个双重底，其中K线28为更高的低点，但他们担心的是K线28是一根阴线。尽管接下来是一根阳线，并出现一个双K线反转的做多入场条件，但在震荡区间的顶部（K线27就是这个小型震荡区间的顶部）买入并非一个好的选择。大多数多头会在反转阴线K线29处平仓离场。这是一个低点2卖出信号，一次三角形的失败突破。K线31后面那根K线是一个十字星阳线，它跟在三根阴线之后，对多头来说并不是一个好的买入理由。自K线31后面双K线最终旗形之后，K线32后面那根内含阳线又是一个最终旗形反转入场条件，但从K线29开始的微型下降通道振幅过窄，从而降低了在此处做多的成功率。虽然K线33强势向上突破了这个微型通道，但后续行情并没有延伸下去，因此多头在K线33后面那根内含阴线下方，或在低于接下来那根十字星一个价位处卖出平仓。多头有时候能够接受一根K线的走势与其头寸方向相反，但当原先的买入信号比较疲弱，而且K线33向上突破后行情并没有进一步延伸时，大多数交易员都不愿意看到他们开仓后连续两根K线都为阴线。","pid":"p106"},{"t":"para","text":"在这个例子中，多空双方都有波段交易的入场条件，并使其交易员等式趋于正数。在K线22这一更低低点处买入的多头拥有40%左右的成功率，其潜在亏损大约为2个点，而潜在收益为6到10个点（价格向上突破震荡区间并走出一波可测量的上涨行情）。空头如果在跌至K线14的尖形中做空，或者在K线16、20以及25下方卖出，便有50%到60%的机会在行情第三次下推时盈利一把，其潜在亏损大约为几个点，而潜在收益为4到6个点，如果市场不是呈下降阶梯走势，而是实现空头突破，并走出一波可测量的下跌行情，空头的盈利将更加丰厚。","pid":"p107"},{"t":"para","text":"跌至K线14的尖形比较疲弱。很多交易员预期接下来的行情会出现一个震荡区间，或一段弱势的下降通道。他们放弃做波段交易，而进行一整天的刮头皮操作，每笔盈利二到四个点位，当他们认为当天处于多空较量、行情反复的双向交易局面时，很多交易员都会这么做。","pid":"p108"},{"t":"para","text":"大多数交易员都不会进行反转交易，他们要求行情至少出现一个双重顶或双重底，一个微型的双重顶或双重顶，或一个最终旗形，才会考虑反转交易，而不管产生的形态多么微小。例如，K线6、8、18、20、25和29就是双重顶或微型双重顶，K线4、10、12、14、17、19、22、28和32就是双重底或微型双重底，K线3、6、10、12、14、16、18、19、22、25和32就是最终旗形反转（有些来自单K线最终旗形）。","pid":"p109"}],"sections":[{"id":"p1c1","title":"第1章　反转交易范例","blocks":[{"t":"para","text":"第1章　反转交易范例","pid":"p110"},{"t":"para","text":"当交易员进行反转交易时，他们希望当前的趋势回调能促成一笔大的波段交易，甚至形成一轮反向趋势。正如我们在前两本书中讨论过的，入场条件、保护性止损、止盈设置与其他的波段交易、趋势交易一致尽管交易员们期待在反向交易中市场出现一波大的走势，但成功的概率往往不高于50%。在风险既定的情况下，一般来说，潜在收益越大，通常意味着成功概率越低。因为在交易过程中，每个人的机会都是均等的，边际优势很小，如果某个交易机会存在很高的成功率，交易员们便会迅速中和它，机会在几个K线内转瞬即逝，结果只能在这笔交易中获得微小的盈利。即便如此，由于趋势反转交易的收益可能高几倍于它本身的风险，足以使交易员的盈亏方程式趋于正数。","pid":"p111"},{"t":"para","text":"当交易员收盘后对着图表复盘时，我们会发现反转交易其实并不像表面看到的那么简单。一旦出现趋势线强势的突破，然后一个反转测试趋势的极值，交易员此时需要一根强力的K线作为其反转交易的入场信号。但此时的市场显得非常情绪化，起伏不定，新手交易员们也许会认为原先的趋势将有效持续下去。他们很可能在当天早些时候已经做了几笔亏损的逆势交易了。不想再继续赔钱。这种心态令他们错失了最早的入场时机。然后他们开始等待评估后续形态的强弱。后续形态通常表现为由几根强劲的趋势K线构成的大规模且急速地上涨或下跌，迫使交易员们必须在瞬间决定自己是否愿意以比平时冒更大的风险来完成自己的交易。他们往往最终选择等待市场回调。即使他们通过降低持仓比例以减小自己的风险，使亏损幅度和其他类型的交易保持一致，但一想到有可能要在这种交易中承担几次这样的亏损，他们就会望而生畏。而在回调时入场其实也是很困难的，因为回调就意味着又一个小型反转的开始，他们就会担心当前的回调有可能是原先趋势的复辟。最后的结果就是他们一直等待，一直观察，直到当天接近收盘时才终于承认新的趋势确实已经形成：可惜这时留给他们的时间已经所剩无几。市场趋势将竭尽所能把交易员排除在外，这样才是令交易员们一整天都被市场行情牵着鼻子走的唯一途径。当入场信号简单而清晰时，当前的波动通常是小型且快速的。如果当前的波动将持续长久，那它相应的入场信号必然模糊不清且难以捕捉，如此才能使交易员们一直保持观望，并迫使他们一直被市场的趋势带着走。","pid":"p112"},{"t":"img","src":"assets/img/p1c1_001.webp","ctx":[{"t":"当交易员进行反转交易时，他们希望当前的趋势回调能促成一笔大的波段交易，甚至形成一轮反向趋势。正如我们在前两本书中讨论过的，入场条件、保护性止损、止盈设置与其他的波段交易、趋势交易一致尽管交易员们期待在反向交易中市场出现一波大的走势，但成功的概率往往不高于50%。在风险既定的情况下，一般来说，潜在收益越大，通常意味着成功概率越低。因为在交易过程中，每个人的机会都是均等的，边际优势很小，如果某个交易机会存在很高的成功率，交易员们便会迅速中和它，机会在几个K线内转瞬即逝，结果只能在这笔交易中获得微小的盈利。即便如此，由于趋势反转交易的收益可能高几倍于它本身的风险，足以使交易员的盈亏方程式趋于正数。","p":"p111"},{"t":"当交易员收盘后对着图表复盘时，我们会发现反转交易其实并不像表面看到的那么简单。一旦出现趋势线强势的突破，然后一个反转测试趋势的极值，交易员此时需要一根强力的K线作为其反转交易的入场信号。但此时的市场显得非常情绪化，起伏不定，新手交易员们也许会认为原先的趋势将有效持续下去。他们很可能在当天早些时候已经做了几笔亏损的逆势交易了。不想再继续赔钱。这种心态令他们错失了最早的入场时机。然后他们开始等待评估后续形态的强弱。后续形态通常表现为由几根强劲的趋势K线构成的大规模且急速地上涨或下跌，迫使交易员们必须在瞬间决定自己是否愿意以比平时冒更大的风险来完成自己的交易。他们往往最终选择等待市场回调。即使他们通过降低持仓比例以减小自己的风险，使亏损幅度和其他类型的交易保持一致，但一想到有可能要在这种交易中承担几次这样的亏损，他们就会望而生畏。而在回调时入场其实也是很困难的，因为回调就意味着又一个小型反转的开始，他们就会担心当前的回调有可能是原先趋势的复辟。最后的结果就是他们一直等待，一直观察，直到当天接近收盘时才终于承认新的趋势确实已经形成：可惜这时留给他们的时间已经所剩无几。市场趋势将竭尽所能把交易员排除在外，这样才是令交易员们一整天都被市场行情牵着鼻子走的唯一途径。当入场信号简单而清晰时，当前的波动通常是小型且快速的。如果当前的波动将持续长久，那它相应的入场信号必然模糊不清且难以捕捉，如此才能使交易员们一直保持观望，并迫使他们一直被市场的趋势带着走。","p":"p112"},{"t":"如图1.1，在Caterillar公司（CAT）这只股票上，当天交易员有几种方法进行反转交易，其中有一种是我一位朋友使用的方法，我认为值得花时间来研究一下。几年前我和这位交易员朋友进行过长时间的讨论。他专攻主要反转的交易。他通常一天只做一两笔交易，在他去寻找反转的入场机会之前，他总是希望市场先走出一个强有力的趋势线突破行情。举例来说，如图中所示的上涨趋势，他不会在K线3下方就开始做空，因为前面的行情没有突破上涨趋势线：他也不会在K线7这阴线上做空，同样前面的行情也没有出现重要的趋势突破。K线3下的下跌仅仅维持了一根K线，价格甚至没有碰到移动平均线。","p":"p113"},{"t":"从K线7开始走出连续三根阴线，向下突破了上涨趋势线，并显示出抛压信号时，但这次的空头力量并没有那么坚定，行情也没有触碰移动平均线。然后他开始研究尝试超越K线7这一趋势高位的小反弹。这里有两个小波段，这意味着这一时段多空双方正在较量，并且空头的力量逐渐显露出来，这是当天第三次行情上推。由于重大的反转一般发生在开盘后第一个小时左右，他很可能会在K线11下方做空，K线11是第二个做空机会，但他也很可能并不预期行情在这个时间点开始反转由于当时处于一个尖形的位置，且行情形成了一个通道内的上涨趋势，空头也许正在上升通道的启动点K线4处试探价格，这里市场有可能形成一个双重底然后再反弹。因为这个上升通道是一个楔形（有三次上推行情），它很可能形成两个小波段使市场横向发展，并最终下行。我的朋友是一个波段交易员，只要他认为自己原先的假设依然成立，他就会允许反弹出现。因此他会在信号K线的上方止损。或K线11后面的那根大阴线上方止损，然后等待市场反弹到K线13，并期待第二回合的下降小波段出现。如果他这时候还没有开空仓。他会在K线13这一双K线反转形态做空，K线13这里出现了主要趋势反转中更低的高点，它是对向下突破K线11之后的突破测试。","p":"p114"},{"t":"K线11后面的两根阴线可能会使大多数交易员开始怀疑总在场内的头寸是否已经向下翻转，到以K线14为结尾的五K线下降尖形出现时，大多数交易员会认为趋势确实已经反转下行了。在这种情况下，如果他决定继续持有空头，他会缩紧保护性止损的幅度，使其略高于K线13之后的下降尖形的起点。更有可能的是，由于已经发生了两个回合的下降小波段（行情跌至K线12为第一个小波段），他会在K线16上方买回其大部分空头持仓，K线16和K线14、15组成了一个双重底，这里是移动平均线跳空缺口第三次做多的入场机会（K线16的最高点低于移动平均线，并且是行情强反弹至K线10之后的第一次回调）。如果他买回其空头持仓，他将会观察从K线16开始的反弹，并评估当中多空双方的力量。如果多头相对较弱，他将会在市场冲击K线10趋势高点时再次寻找做空的机会。这种冲击可以表现为一个更低的高点，一个双重顶，或一个更高的高点。","p":"p115"},{"t":"从K线16到K线19的反弹有三个小波段，所以是一个楔形下降旗形。由于这是强势突破上涨趋势线后的一次反弹，它很可能会成为行情更大调整的一部分，这波调整至少会再形成一个下降小波段。市场很可能会走出一段震荡行情，或趋势反转的行情。这次反弹并没有包含两根连续的大阳线。所以多头力量也并没能够收回市场的控制权。K线19和K线13组成了一个双重顶，由于目前形成了一轮可能的下跌趋势，这个双重顶即是一个双重顶下降旗形，与该上涨趋势的最高点K线10相对比来看，它也算是一个双重顶或更低高点的主要趋势反转。K线19也是一根下跌反转K线，这对于寻找市场顶部相当重要。这是一天中最强烈的趋势反转入场条件，因为跌至K线14的下降尖形说服了大多数交易员：目前总在场内的头寸已经变为空头，只要反弹超越不了从K线13开始的下降尖形的高点，空头力量就已经占据了市场主导地位。很多交易员认为只要价格达不到K线13上方，空头力量就依然控制市场，在可能的新下跌趋势中，市场或许正形成一个更低的高点。空头把他们的保护性止损置于略高于K线13之上，因为他们预期市场会出现一个双重顶或更低的高点，但如果两种情况都没有发生，他们就会退出市场并等待另一个卖出信号。在K线10和K线13买入的许多多头会在K线16下跌期间坚持持有多仓，并持续观察空头力量。行情突破了趋势线和移动平均线，并持续了很多根K线。多头会认为空头力量是强劲的，行情涨至K线19的那波反弹并未强到足以使他们预期上涨趋势在没经过至少一轮调整的情况下创出新高。","p":"p116"},{"t":"这些是最坚定的多头（在K线16之前持续的下跌过程中，他们依然愿意持有多仓），一旦他们放弃看涨，便没人会在这个价格上买入。市场必须下探至更低的水平，直到多头回归、空头平掉他们的空仓。从K线16开始的上升过程中，没有出现连续的大阳线，也没有其他强有力的买入征兆，这让多头更不愿意买入，空头变得更激进。由于多头相信市场很快会下行，他们会利用反弹至K线19的机会平掉自己几乎没什么盈利甚至小亏的多仓。失望的多头在卖出平仓，加上激进的空头在重仓做空，试图阻止行情越过K线13上方，导致市场在K线19处反转下行。虽然多头愿意在更低价位时买入，但他们需要一个市场即将扭转向上的迹象。在经历七根K线的下跌后，行情横盘整理至K线23并不是一个很强的底部，大多数多头不愿意在此刻买入。除非价格进一步下行。空头愿意在任何时间内获利了结，但只有出现合理的底部征兆时，空头才会买回自己的空仓。没有底部征兆，多空双方都不愿意买入。同时，剩余的多头继续卖出他们的持仓。增加了市场上的抛压。从K线23开始的下跌过程中，空头看到市场上不断增加的抛压，他们也继续卖出。结果导致市场出现了二个强有力的趋势反转，行情在K线16处向下突破了上涨趋势线后，在K线19处形成了一个更低的高点。正如所有强劲趋势的情况一样，交易员们不断加仓增强空头力量，市场以尖形的形式急速下滑至K线25的低点以及K线28的低点，这时空头开始平仓获利。所有趋势K线都是尖形、高潮、突破和跳空缺口。K线25是一根空头突破的大阴线，并且很可能伴随一波可测量的下跌行情，测量基准为震荡区间的高度。K线25本身很可能成为一个测量跳空，缺口的中点为K线16的最低点（缺口顶端）和K线27的最高点（缺口底端）之间的中点。这个可能在当天或第二天引出一波可测量的下跌行情。","p":"p117"},{"t":"反弹至K线19的波段是一个双重顶下降旗形。一个楔形下降旗形，和下跌趋势中两个回合的上升小波段（K线15和K线16之间的双波段高点是第一回合的上升小波段），它符合优秀的交易员盈亏方程式的标准。风险就是价格超过了K线19的高点，大概在10美分左右，回报至少50美分，价格低于K线16的低点，市场可能形成一个双重顶和一个大三角形或一个上升旗形。由于市场处于熊市或至少是一个震荡区间的顶部，成功的概率最低达到60%。60%的成功率，加上10美分的风险和50美分的回报，这是一笔很不错的交易如果一个交易员做十笔这样的交易，将赚3美元，亏40美分，平均每笔交易盈利26美分。","p":"p118"},{"t":"交易员们认为如果市场跌破K线16，就很可能从双重顶开始下跌一个可测量的幅度，事实也正是如此。K线16的区域是对突破跳空的一次突破测试，突破跳空是指K线1到K线3的上升尖形。行情在这次测试中反弹之后，多头不希望价格跌破这个测试水平，因为跌破了则表明市场多头力量疲弱。就像空头不希望反弹至K线19的那波行情价格高于K线13所形成的更低的高点一样，因为如果超过了这个更低的高点，就可能走出一波可测量的上涨行情，多头也不希望从K线19开始的那波下跌行情价格低于K线16所形成的更高的低点，因为如果跌破了这个更高的低点，就可能走出一波可测量的下跌行情。由于我的朋友会把从K线19开始的这一轮下跌看作是一个趋势交易的机会，他会以趋势交易的方法来操作（第一本书讨论了如何进行趋势交易）。初始风险只有10美分，赢面也比较大，最小的目标是市场可能会试探K线16的低点，所以如果在这个试探过程中出现暂停K线，他可能会平掉一半仓位。由于行情并没出现休整，就没有明显的获利了结行为，他可能会等到K线28附近才平仓了结其头寸。这是出现在抛售高潮K线之后的一次休整，而这次抛售高潮之前是一个潜在最终旗形（以K线27为结尾的三根K线）。他可能会在这里平掉一半持仓，获利1.2美元，然后在收盘前的一两分钟内了结剩余的持仓，将1.3美元落袋为安。","p":"p119"},{"t":"顺便提及的是，在超涨的上涨趋势中，强势的多头和强势的空头都喜欢看到一根大阳线出现，因为它通常会引出一波含两个小波段并跌破移动平均线的回调行情，就如这里的K线9。预期的调整为多空双方提供了短暂的交易机会，尽管这些不算是趋势反转交易。K线9是在没怎么调整的情况下出现的第三次连续的买入高潮（第一次是K线1到K线3，第二次是K线5到K线6)。它更可能是一次衰竭跳空而非测量跳空（它更可能是一波调整的起点，而非一轮上升小波段的起点）。在这种情况下，强势的多头和强势的空头都会在K线9的收盘价处，或最高点上方，或下一两根K线的收盘价处（尤其在K线10之后的那根K线是一根大阴线），以及前一根K线最低点的下方卖出。多头在这里卖出多仓获利了结，空头这里卖出建立空仓。大多数空头都会设置其保护性止损单，止损幅度小于产生买入高潮的阳线所覆盖的变动价位，如K线9所覆盖的价位。在含两个小波段的调整行情结束之前，如K线14到K线16的区域（跌至K线12是第一个下降波段），多头不会再次买入，空头也不会平仓获利。在行情对K线10的趋势高点进行弱势或强势的高点冲击之后，抛售的力量足够强大，以至于多空双方都认为市场可能会进入一个熊市的趋势反转。","p":"p120"}]},{"t":"para","text":"如图1.1，在Caterillar公司（CAT）这只股票上，当天交易员有几种方法进行反转交易，其中有一种是我一位朋友使用的方法，我认为值得花时间来研究一下。几年前我和这位交易员朋友进行过长时间的讨论。他专攻主要反转的交易。他通常一天只做一两笔交易，在他去寻找反转的入场机会之前，他总是希望市场先走出一个强有力的趋势线突破行情。举例来说，如图中所示的上涨趋势，他不会在K线3下方就开始做空，因为前面的行情没有突破上涨趋势线：他也不会在K线7这阴线上做空，同样前面的行情也没有出现重要的趋势突破。K线3下的下跌仅仅维持了一根K线，价格甚至没有碰到移动平均线。","pid":"p113"},{"t":"para","text":"从K线7开始走出连续三根阴线，向下突破了上涨趋势线，并显示出抛压信号时，但这次的空头力量并没有那么坚定，行情也没有触碰移动平均线。然后他开始研究尝试超越K线7这一趋势高位的小反弹。这里有两个小波段，这意味着这一时段多空双方正在较量，并且空头的力量逐渐显露出来，这是当天第三次行情上推。由于重大的反转一般发生在开盘后第一个小时左右，他很可能会在K线11下方做空，K线11是第二个做空机会，但他也很可能并不预期行情在这个时间点开始反转由于当时处于一个尖形的位置，且行情形成了一个通道内的上涨趋势，空头也许正在上升通道的启动点K线4处试探价格，这里市场有可能形成一个双重底然后再反弹。因为这个上升通道是一个楔形（有三次上推行情），它很可能形成两个小波段使市场横向发展，并最终下行。我的朋友是一个波段交易员，只要他认为自己原先的假设依然成立，他就会允许反弹出现。因此他会在信号K线的上方止损。或K线11后面的那根大阴线上方止损，然后等待市场反弹到K线13，并期待第二回合的下降小波段出现。如果他这时候还没有开空仓。他会在K线13这一双K线反转形态做空，K线13这里出现了主要趋势反转中更低的高点，它是对向下突破K线11之后的突破测试。","pid":"p114"},{"t":"para","text":"K线11后面的两根阴线可能会使大多数交易员开始怀疑总在场内的头寸是否已经向下翻转，到以K线14为结尾的五K线下降尖形出现时，大多数交易员会认为趋势确实已经反转下行了。在这种情况下，如果他决定继续持有空头，他会缩紧保护性止损的幅度，使其略高于K线13之后的下降尖形的起点。更有可能的是，由于已经发生了两个回合的下降小波段（行情跌至K线12为第一个小波段），他会在K线16上方买回其大部分空头持仓，K线16和K线14、15组成了一个双重底，这里是移动平均线跳空缺口第三次做多的入场机会（K线16的最高点低于移动平均线，并且是行情强反弹至K线10之后的第一次回调）。如果他买回其空头持仓，他将会观察从K线16开始的反弹，并评估当中多空双方的力量。如果多头相对较弱，他将会在市场冲击K线10趋势高点时再次寻找做空的机会。这种冲击可以表现为一个更低的高点，一个双重顶，或一个更高的高点。","pid":"p115"},{"t":"para","text":"从K线16到K线19的反弹有三个小波段，所以是一个楔形下降旗形。由于这是强势突破上涨趋势线后的一次反弹，它很可能会成为行情更大调整的一部分，这波调整至少会再形成一个下降小波段。市场很可能会走出一段震荡行情，或趋势反转的行情。这次反弹并没有包含两根连续的大阳线。所以多头力量也并没能够收回市场的控制权。K线19和K线13组成了一个双重顶，由于目前形成了一轮可能的下跌趋势，这个双重顶即是一个双重顶下降旗形，与该上涨趋势的最高点K线10相对比来看，它也算是一个双重顶或更低高点的主要趋势反转。K线19也是一根下跌反转K线，这对于寻找市场顶部相当重要。这是一天中最强烈的趋势反转入场条件，因为跌至K线14的下降尖形说服了大多数交易员：目前总在场内的头寸已经变为空头，只要反弹超越不了从K线13开始的下降尖形的高点，空头力量就已经占据了市场主导地位。很多交易员认为只要价格达不到K线13上方，空头力量就依然控制市场，在可能的新下跌趋势中，市场或许正形成一个更低的高点。空头把他们的保护性止损置于略高于K线13之上，因为他们预期市场会出现一个双重顶或更低的高点，但如果两种情况都没有发生，他们就会退出市场并等待另一个卖出信号。在K线10和K线13买入的许多多头会在K线16下跌期间坚持持有多仓，并持续观察空头力量。行情突破了趋势线和移动平均线，并持续了很多根K线。多头会认为空头力量是强劲的，行情涨至K线19的那波反弹并未强到足以使他们预期上涨趋势在没经过至少一轮调整的情况下创出新高。","pid":"p116"},{"t":"para","text":"这些是最坚定的多头（在K线16之前持续的下跌过程中，他们依然愿意持有多仓），一旦他们放弃看涨，便没人会在这个价格上买入。市场必须下探至更低的水平，直到多头回归、空头平掉他们的空仓。从K线16开始的上升过程中，没有出现连续的大阳线，也没有其他强有力的买入征兆，这让多头更不愿意买入，空头变得更激进。由于多头相信市场很快会下行，他们会利用反弹至K线19的机会平掉自己几乎没什么盈利甚至小亏的多仓。失望的多头在卖出平仓，加上激进的空头在重仓做空，试图阻止行情越过K线13上方，导致市场在K线19处反转下行。虽然多头愿意在更低价位时买入，但他们需要一个市
