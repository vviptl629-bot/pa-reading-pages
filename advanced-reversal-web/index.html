"p325"},{"t":"para","text":"持续至K线18的反弹向上打破了之前从K线5至K线17形成的熊市通道，但是止步于移动平均线一带。市场在K线20处形成的双重顶部开始下滑，但是在K线22的低点处重新找到了买方，而市场在这里形成了一个双重底部的牛市旗形。这个双重底部中更高的低点是否会开启主要趋势的反转呢？现实并没有如此理想，虽然在K线20之前的有两波反弹浪潮在熊市趋势线之上，但是它并不能持续地超过移动平均线，因此也不够强烈。从K线22的双重底部到K线28的两波反弹浪潮却意外地很强烈，但是许多交易者把它视为熊市趋势线中第一次反弹，因此很大的可能它仅仅只是一次反弹而非一个新的牛市通道。虽然它已经足够强烈，但是交易者依然会在市场测试熊市的底部时购买。交易者会在牛市K线之上购买，即在K线32卖出高潮之后的另一日的开盘时买入，然后再次在两根K线之后形成的第二次牛市信号之上购买。市场形成了第二次的信号（在K线32之后的K线与K线32这根大的牛市K线一起形成了一个微小的双重底部），因此这次的信号将更加可信。最后的结果就是从更低的低点处形成的主要趋势反转打破了之前的强烈的熊市通道线（市场反弹至K线28处）。因为它是通过许多的K线呈现出来的，所以这个模式可能在更高的时间趋势图上会个更容易被发现。","pid":"p326"},{"t":"para","text":"V型底部和倒转的V型顶部在产生一个显著的回调之前就反转市场的情况是非常罕见的。大部分的顶点都不会马上令市场出现反转，而且原来的趋势的峰值也往往会得到第二次测试。","pid":"p327"},{"t":"img","src":"assets/img/p1c4_006.webp","ctx":[{"t":"持续至K线18的反弹向上打破了之前从K线5至K线17形成的熊市通道，但是止步于移动平均线一带。市场在K线20处形成的双重顶部开始下滑，但是在K线22的低点处重新找到了买方，而市场在这里形成了一个双重底部的牛市旗形。这个双重底部中更高的低点是否会开启主要趋势的反转呢？现实并没有如此理想，虽然在K线20之前的有两波反弹浪潮在熊市趋势线之上，但是它并不能持续地超过移动平均线，因此也不够强烈。从K线22的双重底部到K线28的两波反弹浪潮却意外地很强烈，但是许多交易者把它视为熊市趋势线中第一次反弹，因此很大的可能它仅仅只是一次反弹而非一个新的牛市通道。虽然它已经足够强烈，但是交易者依然会在市场测试熊市的底部时购买。交易者会在牛市K线之上购买，即在K线32卖出高潮之后的另一日的开盘时买入，然后再次在两根K线之后形成的第二次牛市信号之上购买。市场形成了第二次的信号（在K线32之后的K线与K线32这根大的牛市K线一起形成了一个微小的双重底部），因此这次的信号将更加可信。最后的结果就是从更低的低点处形成的主要趋势反转打破了之前的强烈的熊市通道线（市场反弹至K线28处）。因为它是通过许多的K线呈现出来的，所以这个模式可能在更高的时间趋势图上会个更容易被发现。","p":"p326"},{"t":"V型底部和倒转的V型顶部在产生一个显著的回调之前就反转市场的情况是非常罕见的。大部分的顶点都不会马上令市场出现反转，而且原来的趋势的峰值也往往会得到第二次测试。","p":"p327"},{"t":"在图4.6上，在K线3处形成的楔形形态底部带来了向移动平均线回归的反弹行情。这是一个潜在的V型底部，但是在K线5形成的更高的低点之前的卖出潮测试了这个趋势的底部。大部分被叫作倒转的V型顶部和V型底部的反转其实是其他类型的底部形态，例如最终的旗形反转或者是一个微小的双重顶部或底部。举一个例子，从K线3的低点处开始的反转向上就是一个楔形底部，一个在K线2之后形成的基于2条K线的熊市旗型的最终的旗型反转。K线19的底部是一个微型的双重底部，这是因为在K线19之前的K线先是趋势向下然后在收盘处反转向上的。","p":"p328"},{"t":"K线19依然是趋势向下，在它之后的K线趋势向上，这就形成了一个微型的双重底部。这个双重底部可以在1分钟的K线图上轻易地看出来（在图中并没有显示）。而且可以轻易地从上面这个5分钟的K线图上推断出来。","p":"p329"},{"t":"K线20是在经历了K线19的加速下跌之后的漫长的反弹中形成的顶部，可以看作是一个V型底部反转的尝试。不过，此前在K线19下跌的最低点。在当天收盘前还是被再次测试。","p":"p330"},{"t":"K线4之前的趋势上升强有力地打破了熊市趋势线，而且这使得做多交易者不仅愿意在一个更低的低点购买，也愿意在一个测试K线3的低点的更高的低点处购买。做多交易者想看到趋势线被强有力地打破，不再是通过横向盘整在趋势线的上方摇摆不定。","p":"p331"},{"t":"交易者们都预计在K线3之前的3个连续的卖出高潮将会紧随着一个较大的反弹期，这个反弹期至少应该会持续两波上升浪潮并且会持续至少10根K线。最后的高潮中经常会出现在整个高潮移动中最大的熊市趋势线，正如K线3之前的两根K线所示。强势的做空交易者只会在一个显著的回调之后才会寻找机会卖出，同时强势的做多交易者将会积极地购买，而且他们通常会在市场下跌的时候购买的更多。当处于狭窄的趋势通道上的第三波卖出潮从一天中的高点跌落后，市场上已经没有强势的交易者愿意在K线3的低点处卖出了。强势的做空交易者想买回他们的头寸，而强势的做多交易者正在积极地购买新的头寸。","p":"p332"},{"t":"在K线6之前的两波反弹浪潮很好的向上打破了牛市趋势通道线，警告交易者下一波下跌浪可以测试K线3的低点然后带来向上的反转。K线7是双重底部的主要趋势反转。一些交易者认为第一个底部出现在K线3处，然而其他的交易者把K线5的低点联系起来认为这个模式是一个双重底部的牛市旗形。","p":"p333"},{"t":"因为大部分的反转都会失败，包括高潮反转，所以许多交易者会进行反向交易，期待原有趋势会继续，至少支撑他们短线的交易。举个例子，对于在K线4之前的强烈反弹，许多做空交易者认为它仅仅只是一次向移动平均线回归的反弹，同时与K线1之后的反弹顶部一起形成了一个双重顶部。他们卖出是因为他们看到了一个以相对较高的价格卖出的绝好机会，他们在K线5处获得利润，这可以通过K线5底部的尾巴和它相对较小的阳线主体得到证明。","p":"p334"},{"t":"在5分钟的K线图上，一个V型底部或者一个倒转的V型顶部的顶点却没有得到显著的测试。这种情况在一个月里只会发生几次。","p":"p335"}]},{"t":"para","text":"在图4.6上，在K线3处形成的楔形形态底部带来了向移动平均线回归的反弹行情。这是一个潜在的V型底部，但是在K线5形成的更高的低点之前的卖出潮测试了这个趋势的底部。大部分被叫作倒转的V型顶部和V型底部的反转其实是其他类型的底部形态，例如最终的旗形反转或者是一个微小的双重顶部或底部。举一个例子，从K线3的低点处开始的反转向上就是一个楔形底部，一个在K线2之后形成的基于2条K线的熊市旗型的最终的旗型反转。K线19的底部是一个微型的双重底部，这是因为在K线19之前的K线先是趋势向下然后在收盘处反转向上的。","pid":"p328"},{"t":"para","text":"K线19依然是趋势向下，在它之后的K线趋势向上，这就形成了一个微型的双重底部。这个双重底部可以在1分钟的K线图上轻易地看出来（在图中并没有显示）。而且可以轻易地从上面这个5分钟的K线图上推断出来。","pid":"p329"},{"t":"para","text":"K线20是在经历了K线19的加速下跌之后的漫长的反弹中形成的顶部，可以看作是一个V型底部反转的尝试。不过，此前在K线19下跌的最低点。在当天收盘前还是被再次测试。","pid":"p330"},{"t":"para","text":"K线4之前的趋势上升强有力地打破了熊市趋势线，而且这使得做多交易者不仅愿意在一个更低的低点购买，也愿意在一个测试K线3的低点的更高的低点处购买。做多交易者想看到趋势线被强有力地打破，不再是通过横向盘整在趋势线的上方摇摆不定。","pid":"p331"},{"t":"para","text":"交易者们都预计在K线3之前的3个连续的卖出高潮将会紧随着一个较大的反弹期，这个反弹期至少应该会持续两波上升浪潮并且会持续至少10根K线。最后的高潮中经常会出现在整个高潮移动中最大的熊市趋势线，正如K线3之前的两根K线所示。强势的做空交易者只会在一个显著的回调之后才会寻找机会卖出，同时强势的做多交易者将会积极地购买，而且他们通常会在市场下跌的时候购买的更多。当处于狭窄的趋势通道上的第三波卖出潮从一天中的高点跌落后，市场上已经没有强势的交易者愿意在K线3的低点处卖出了。强势的做空交易者想买回他们的头寸，而强势的做多交易者正在积极地购买新的头寸。","pid":"p332"},{"t":"para","text":"在K线6之前的两波反弹浪潮很好的向上打破了牛市趋势通道线，警告交易者下一波下跌浪可以测试K线3的低点然后带来向上的反转。K线7是双重底部的主要趋势反转。一些交易者认为第一个底部出现在K线3处，然而其他的交易者把K线5的低点联系起来认为这个模式是一个双重底部的牛市旗形。","pid":"p333"},{"t":"para","text":"因为大部分的反转都会失败，包括高潮反转，所以许多交易者会进行反向交易，期待原有趋势会继续，至少支撑他们短线的交易。举个例子，对于在K线4之前的强烈反弹，许多做空交易者认为它仅仅只是一次向移动平均线回归的反弹，同时与K线1之后的反弹顶部一起形成了一个双重顶部。他们卖出是因为他们看到了一个以相对较高的价格卖出的绝好机会，他们在K线5处获得利润，这可以通过K线5底部的尾巴和它相对较小的阳线主体得到证明。","pid":"p334"},{"t":"para","text":"在5分钟的K线图上，一个V型底部或者一个倒转的V型顶部的顶点却没有得到显著的测试。这种情况在一个月里只会发生几次。","pid":"p335"},{"t":"img","src":"assets/img/p1c4_007.webp","ctx":[{"t":"因为大部分的反转都会失败，包括高潮反转，所以许多交易者会进行反向交易，期待原有趋势会继续，至少支撑他们短线的交易。举个例子，对于在K线4之前的强烈反弹，许多做空交易者认为它仅仅只是一次向移动平均线回归的反弹，同时与K线1之后的反弹顶部一起形成了一个双重顶部。他们卖出是因为他们看到了一个以相对较高的价格卖出的绝好机会，他们在K线5处获得利润，这可以通过K线5底部的尾巴和它相对较小的阳线主体得到证明。","p":"p334"},{"t":"在5分钟的K线图上，一个V型底部或者一个倒转的V型顶部的顶点却没有得到显著的测试。这种情况在一个月里只会发生几次。","p":"p335"},{"t":"图4.7显示了一个5分钟的V型底部，这是一个卖出高潮，同时也是一个高潮反转。在K线9之前的向下的趋势中形成的卖出高潮呈抛物线移动。这也是一种形式的卖出高潮。你可以看到这三条趋势通道线的斜率正变得越来越峭（从K线2到K线3，K线5到K线8，K线8到K线9形成的趋势通道线），这意味着市场正面临着恐慌。交易者愿意以任意的价格抛售。做空交易者为他们的做空继续施压，当市场跌人一个强势的熊市趋势时他们正好快速地增加头寸。然而，当出现了这样连续的卖出高潮时，市场很快就耗尽了这些急切的，甚至愿意在没有显著的回调时做空的交易者的热情。由于卖方力量的缺失，造成了买方力量的不平衡。通常在这之后会紧随一个至少持续10根K线和两波浪潮的反弹。","p":"p336"},{"t":"如图上显示，当有一个卖出的高潮或者连续不断的卖出高潮出现（如图中熊市的趋势在K线8和K线9处终结），并且在市场已经持续下跌了10根或者更多根的K线后依然有一个加剧的卖出潮时，那么市场将有很大的概率会迎来一个强烈的反转。强大的做多交易者目前还是处于观望状态，因为他们希望市场会继续下跌到一个足够吸引他们的地步，一旦市场到达了这个地步，他们将会奋不顾身地加人购买的阵列中。强大的做空交易者也明白接下来会发生什么，一旦他们看到了一个像K线9一样的巨大的卖出高潮K线，他们就迅速做空头寸获得利润，并且在市场走高之前都不会再考虑做空。因为市场上的做多交易者和做空交易者都会在靠近K线9和接下来的微小的两根K线组成的双重底部购买头寸，接下来市场只会上涨。","p":"p337"},{"t":"当市场上的一个强劲的高点突然急速下跌，那么有可能这波下跌潮只是用来测试市场的支撑位的，许多交易者依然会期待市场上出现高潮反转的标志。在K线8之前就是一波非常急剧的熊市的下跌潮，然后出现的就是由接下来的一根K线上的一个低点所表示的卖出信号。经验丰富的做多交易者和做空交易者都意识到了如果在一个急剧下跌的熊市下跌浪之后出现了一到两根大熊市K线，那么市场上的卖出潮很有可能就到此为止了。那个有一个低点信号的K线就可以是一个一根K线组成的最后的旗形（这将会在第7章详细探讨）。当K线9以一个大的熊市趋势K线的形态结束时，它是一个连续的卖出高潮并且可以导致一个最终的旗形反转，这个反转可以持续10根以上的K线和2波以上的浪潮。许多做空交易者将会在这种情况下买回他们的头寸因为他们意识到市场可能会突然急速反弹。如果在10根K线之后出现了卖出信号，他们将会再次做空。但在图中的案例里，市场急速反弹，以至于做空交易者已经认为市场上没有任何迹象支撑他们卖出，所以他们再也找不到一个可以做空的点了。","p":"p338"},{"t":"激进的做多交易者也认为市场很可能会反弹，所以他们也会选择买入。许多做多交易者和做空交易者会在K线9的收盘处买入，止损幅度设置为K线9的长度，有些交易者会选择更窄的止损但是也不会小太多，可能也就是几个点位。其他的做多交易者和做空交易者会在下一根K线的收盘处买入，因为它是一根小K线因此代表了卖出正在减弱的迹象其他人会继续等待，直到K线10有了一个强大的牛市收盘迹象，才会在收盘处或者在收盘处的高点之上买入。最后，剩下的做空交易者将会买回他们的头寸，而想确定市场已经进入了可以持续做多的状态的谨慎的做多交易者，在5根K线组成的牛市趋势线的低点和随后而来的反弹中将会买入头寸。许多做多交易者会继续加仓，在市场从K线10开始经历一波又快又强的反转向上时，他们会继续买入头寸。","p":"p339"},{"t":"当市场变化迅速的时候，经验丰富交易者往往更容易获得利润：他们通常会抓住转瞬即逝的机会买入头寸，获得更大的盈利。当市场窄幅震荡的时候，他们也会这么做，在图中最左侧的20根K线就反映了这种情况。当市场窄幅震荡时，交易者们将保持旁观，直到新的趋势出现他们才会重新开始交易。然而，机构投资者和高频交易公司依然会每天保持较高的交易量，即使是在市场进入窄幅震荡的区间。","p":"p340"},{"t":"一个完美的V型底部，即市场的趋势先是笔直的下跌然后笔直地上涨。然而这是非常难得的。大部分的V型底部都会有一些微妙的信号显示卖方力量正在逐步减弱，就像图中所示，提示交易者将会面临一个可能的反转。在K线8之后的K线是一个一根K线组成的最后的旗形，这提示交易者在另外一个由一根或两根K线组成的卖出高潮后将会有一个可能的反转向上。K线10同它之前的一根K线形成了一个微型的双重底部，同时与它之前的一根K线和K线9的低点一起形成了二个微型的三重底部。这是一个微小的三浪推动的下跌模式，同时在更小的时间图上是一个抽象的三角形，在经历了连续的卖出高潮和一根K线的最后旗形之后，它给予了做多交易者一个风险较低但是获利的可能性更高的入场机会。","p":"p341"},{"t":"对于大部分的K线来说，当市场如昨天一般平静时，一根K线的交易量大约是5000到10000份合约。但是K线9拥有114，000份合约的交易量。这种程度的交易量一般完全是由机构促成的。但是，这到底是机构交易者认为市场的下跌才刚刚开始、疯狂做空而引起，还是他们认为市场已经经历了连续的卖空高潮、即将迎来反转、积极做多而引起的呢？机构交易者赚的都是非常聪明的钱，所以当他们突然一致在一个持续较长时间的熊市趋势中积极做多交易的时候，那么很大的可能性是，市场上的做空交易者（以及获利）和做多交易者都在积极买入。如果机构交易者一般都是非常聪明，经常获利，并且会认真对待每一点价位变化，那为什么他们在熊市趋势的最低点卖出？这是因为他们的程序化算法在市场一路下跌的时候都是赚钱的，并且有些算法只有在熊市趋势出现了明显的反转市才会不再做空。这将导致他们可能会在最后一笔卖出中亏损，但是他们早期赚的利润已经足够弥补这一次的亏损。记住，这些算法的胜率只有30%到70%，因此这是他们失败的情形之一。还有一些高频交易公司的交易如此频繁，而市场下跌的最低点正是因为他们的卖出造成的。最低点一般会位于支撑位上，许多高频交易公司会在支撑线上的一致两个点位处卖空，如果他们的系统显示这是一个盈利性很高的策略，那么他们这么做的目的是企图抓住市场上最后的机会。其他的机构会通过在其他的市场做空来实现对冲（股市、期权、债市、现金等市场）。因为他们确信他们的风险报酬比会通过对冲来实现的更好。这些交易量并不是由较小的个人交易者带来的，他们对重要的转折点处的交易量的影响不超过5%。","p":"p342"},{"t":"趋势通常是一种方向的交易者和另外一种方向的交易者的力量的博奔的测试。在牛市中向上的趋势和在熊市中向下的趋势通常会得到市场的检验。因为趋势反转相较于简单而短暂的临时趋势反转来说出现的机会非常少，所以通常会得到检验。在牛市中向下的趋势以及在熊市中向上的趋势都是趋势的回调，所以通常来说可能不会得到检验。实际上他们已经在测试，测试的是顺着趋势的交易者和逆趋势交易者的决心。回调通常意味着市场惯有的趋势的突然反转。但是稍后又回到惯有的趋势。强势的交易者很喜欢这种市场反转的尝试，因为他们知道大部分都会失败。不论反转趋势的交易者是否有能力创造一个反转的趋势，跟随趋势的交易者将会参与进来并且有力地打击这些反转尝试，并且通常会取得胜利。他们把这些急剧的趋势反转移动看作是一个以非常好的价格进入趋势的机会，这个机会将非常短暂而迅速，在整个趋势中看来只是一个简单的趋势回调而已。","p":"p343"}]},{"t":"para","text":"图4.7显示了一个5分钟的V型底部，这是一个卖出高潮，同时也是一个高潮反转。在K线9之前的向下的趋势中形成的卖出高潮呈抛物线移动。这也是一种形式的卖出高潮。你可以看到这三条趋势通道线的斜率正变得越来越峭（从K线2到K线3，K线5到K线8，K线8到K线9形成的趋势通道线），这意味着市场正面临着恐慌。交易者愿意以任意的价格抛售。做空交易者为他们的做空继续施压，当市场跌人一个强势的熊市趋势时他们正好快速地增加头寸。然而，当出现了这样连续的卖出高潮时，市场很快就耗尽了这些急切的，甚至愿意在没有显著的回调时做空的交易者的热情。由于卖方力量的缺失，造成了买方力量的不平衡。通常在这之后会紧随一个至少持续10根K线和两波浪潮的反弹。","pid":"p336"},{"t":"para","text":"如图上显示，当有一个卖出的高潮或者连续不断的卖出高潮出现（如图中熊市的趋势在K线8和K线9处终结），并且在市场已经持续下跌了10根或者更多根的K线后依然有一个加剧的卖出潮时，那么市场将有很大的概率会迎来一个强烈的反转。强大的做多交易者目前还是处于观望状态，因为他们希望市场会继续下跌到一个足够吸引他们的地步，一旦市场到达了这个地步，他们将会奋不顾身地加人购买的阵列中。强大的做空交易者也明白接下来会发生什么，一旦他们看到了一个像K线9一样的巨大的卖出高潮K线，他们就迅速做空头寸获得利润，并且在市场走高之前都不会再考虑做空。因为市场上的做多交易者和做空交易者都会在靠近K线9和接下来的微小的两根K线组成的双重底部购买头寸，接下来市场只会上涨。","pid":"p337"},{"t":"para","text":"当市场上的一个强劲的高点突然急速下跌，那么有可能这波下跌潮只是用来测试市场的支撑位的，许多交易者依然会期待市场上出现高潮反转的标志。在K线8之前就是一波非常急剧的熊市的下跌潮，然后出现的就是由接下来的一根K线上的一个低点所表示的卖出信号。经验丰富的做多交易者和做空交易者都意识到了如果在一个急剧下跌的熊市下跌浪之后出现了一到两根大熊市K线，那么市场上的卖出潮很有可能就到此为止了。那个有一个低点信号的K线就可以是一个一根K线组成的最后的旗形（这将会在第7章详细探讨）。当K线9以一个大的熊市趋势K线的形态结束时，它是一个连续的卖出高潮并且可以导致一个最终的旗形反转，这个反转可以持续10根以上的K线和2波以上的浪潮。许多做空交易者将会在这种情况下买回他们的头寸因为他们意识到市场可能会突然急速反弹。如果在10根K线之后出现了卖出信号，他们将会再次做空。但在图中的案例里，市场急速反弹，以至于做空交易者已经认为市场上没有任何迹象支撑他们卖出，所以他们再也找不到一个可以做空的点了。","pid":"p338"},{"t":"para","text":"激进的做多交易者也认为市场很可能会反弹，所以他们也会选择买入。许多做多交易者和做空交易者会在K线9的收盘处买入，止损幅度设置为K线9的长度，有些交易者会选择更窄的止损但是也不会小太多，可能也就是几个点位。其他的做多交易者和做空交易者会在下一根K线的收盘处买入，因为它是一根小K线因此代表了卖出正在减弱的迹象其他人会继续等待，直到K线10有了一个强大的牛市收盘迹象，才会在收盘处或者在收盘处的高点之上买入。最后，剩下的做空交易者将会买回他们的头寸，而想确定市场已经进入了可以持续做多的状态的谨慎的做多交易者，在5根K线组成的牛市趋势线的低点和随后而来的反弹中将会买入头寸。许多做多交易者会继续加仓，在市场从K线10开始经历一波又快又强的反转向上时，他们会继续买入头寸。","pid":"p339"},{"t":"para","text":"当市场变化迅速的时候，经验丰富交易者往往更容易获得利润：他们通常会抓住转瞬即逝的机会买入头寸，获得更大的盈利。当市场窄幅震荡的时候，他们也会这么做，在图中最左侧的20根K线就反映了这种情况。当市场窄幅震荡时，交易者们将保持旁观，直到新的趋势出现他们才会重新开始交易。然而，机构投资者和高频交易公司依然会每天保持较高的交易量，即使是在市场进入窄幅震荡的区间。","pid":"p340"},{"t":"para","text":"一个完美的V型底部，即市场的趋势先是笔直的下跌然后笔直地上涨。然而这是非常难得的。大部分的V型底部都会有一些微妙的信号显示卖方力量正在逐步减弱，就像图中所示，提示交易者将会面临一个可能的反转。在K线8之后的K线是一个一根K线组成的最后的旗形，这提示交易者在另外一个由一根或两根K线组成的卖出高潮后将会有一个可能的反转向上。K线10同它之前的一根K线形成了一个微型的双重底部，同时与它之前的一根K线和K线9的低点一起形成了二个微型的三重底部。这是一个微小的三浪推动的下跌模式，同时在更小的时间图上是一个抽象的三角形，在经历了连续的卖出高潮和一根K线的最后旗形之后，它给予了做多交易者一个风险较低但是获利的可能性更高的入场机会。","pid":"p341"},{"t":"para","text":"对于大部分的K线来说，当市场如昨天一般平静时，一根K线的交易量大约是5000到10000份合约。但是K线9拥有114，000份合约的交易量。这种程度的交易量一般完全是由机构促成的。但是，这到底是机构交易者认为市场的下跌才刚刚开始、疯狂做空而引起，还是他们认为市场已经经历了连续的卖空高潮、即将迎来反转、积极做多而引起的呢？机构交易者赚的都是非常聪明的钱，所以当他们突然一致在一个持续较长时间的熊市趋势中积极做多交易的时候，那么很大的可能性是，市场上的做空交易者（以及获利）和做多交易者都在积极买入。如果机构交易者一般都是非常聪明，经常获利，并且会认真对待每一点价位变化，那为什么他们在熊市趋势的最低点卖出？这是因为他们的程序化算法在市场一路下跌的时候都是赚钱的，并且有些算法只有在熊市趋势出现了明显的反转市才会不再做空。这将导致他们可能会在最后一笔卖出中亏损，但是他们早期赚的利润已经足够弥补这一次的亏损。记住，这些算法的胜率只有30%到70%，因此这是他们失败的情形之一。还有一些高频交易公司的交易如此频繁，而市场下跌的最低点正是因为他们的卖出造成的。最低点一般会位于支撑位上，许多高频交易公司会在支撑线上的一致两个点位处卖空，如果他们的系统显示这是一个盈利性很高的策略，那么他们这么做的目的是企图抓住市场上最后的机会。其他的机构会通过在其他的市场做空来实现对冲（股市、期权、债市、现金等市场）。因为他们确信他们的风险报酬比会通过对冲来实现的更好。这些交易量并不是由较小的个人交易者带来的，他们对重要的转折点处的交易量的影响不超过5%。","pid":"p342"},{"t":"para","text":"趋势通常是一种方向的交易者和另外一种方向的交易者的力量的博奔的测试。在牛市中向上的趋势和在熊市中向下的趋势通常会得到市场的检验。因为趋势反转相较于简单而短暂的临时趋势反转来说出现的机会非常少，所以通常会得到检验。在牛市中向下的趋势以及在熊市中向上的趋势都是趋势的回调，所以通常来说可能不会得到检验。实际上他们已经在测试，测试的是顺着趋势的交易者和逆趋势交易者的决心。回调通常意味着市场惯有的趋势的突然反转。但是稍后又回到惯有的趋势。强势的交易者很喜欢这种市场反转的尝试，因为他们知道大部分都会失败。不论反转趋势的交易者是否有能力创造一个反转的趋势，跟随趋势的交易者将会参与进来并且有力地打击这些反转尝试，并且通常会取得胜利。他们把这些急剧的趋势反转移动看作是一个以非常好的价格进入趋势的机会，这个机会将非常短暂而迅速，在整个趋势中看来只是一个简单的趋势回调而已。","pid":"p343"},{"t":"img","src":"assets/img/p1c4_008.webp","ctx":[{"t":"对于大部分的K线来说，当市场如昨天一般平静时，一根K线的交易量大约是5000到10000份合约。但是K线9拥有114，000份合约的交易量。这种程度的交易量一般完全是由机构促成的。但是，这到底是机构交易者认为市场的下跌才刚刚开始、疯狂做空而引起，还是他们认为市场已经经历了连续的卖空高潮、即将迎来反转、积极做多而引起的呢？机构交易者赚的都是非常聪明的钱，所以当他们突然一致在一个持续较长时间的熊市趋势中积极做多交易的时候，那么很大的可能性是，市场上的做空交易者（以及获利）和做多交易者都在积极买入。如果机构交易者一般都是非常聪明，经常获利，并且会认真对待每一点价位变化，那为什么他们在熊市趋势的最低点卖出？这是因为他们的程序化算法在市场一路下跌的时候都是赚钱的，并且有些算法只有在熊市趋势出现了明显的反转市才会不再做空。这将导致他们可能会在最后一笔卖出中亏损，但是他们早期赚的利润已经足够弥补这一次的亏损。记住，这些算法的胜率只有30%到70%，因此这是他们失败的情形之一。还有一些高频交易公司的交易如此频繁，而市场下跌的最低点正是因为他们的卖出造成的。最低点一般会位于支撑位上，许多高频交易公司会在支撑线上的一致两个点位处卖空，如果他们的系统显示这是一个盈利性很高的策略，那么他们这么做的目的是企图抓住市场上最后的机会。其他的机构会通过在其他的市场做空来实现对冲（股市、期权、债市、现金等市场）。因为他们确信他们的风险报酬比会通过对冲来实现的更好。这些交易量并不是由较小的个人交易者带来的，他们对重要的转折点处的交易量的影响不超过5%。","p":"p342"},{"t":"趋势通常是一种方向的交易者和另外一种方向的交易者的力量的博奔的测试。在牛市中向上的趋势和在熊市中向下的趋势通常会得到市场的检验。因为趋势反转相较于简单而短暂的临时趋势反转来说出现的机会非常少，所以通常会得到检验。在牛市中向下的趋势以及在熊市中向上的趋势都是趋势的回调，所以通常来说可能不会得到检验。实际上他们已经在测试，测试的是顺着趋势的交易者和逆趋势交易者的决心。回调通常意味着市场惯有的趋势的突然反转。但是稍后又回到惯有的趋势。强势的交易者很喜欢这种市场反转的尝试，因为他们知道大部分都会失败。不论反转趋势的交易者是否有能力创造一个反转的趋势，跟随趋势的交易者将会参与进来并且有力地打击这些反转尝试，并且通常会取得胜利。他们把这些急剧的趋势反转移动看作是一个以非常好的价格进入趋势的机会，这个机会将非常短暂而迅速，在整个趋势中看来只是一个简单的趋势回调而已。","p":"p343"},{"t":"在图4.8中，K线1，K线3，K线6这些在熊市中的加速下跌低点和K线4和K线这些反弹高点都在60分钟的AAPL图上得到了检验。","p":"p344"},{"t":"K线4是一个在熊市中的反弹高点并且本来无须得到检测，但是在10根K线以后得到了检测。","p":"p345"},{"t":"K线8是一个在震荡区间的反弹高点，并且打破了主要趋势线，所以它很可能会被检测。","p":"p346"},{"t":"K线7是一个新的波段的低点，但并不是一个加速下跌的低点。所以它没有得到检验。","p":"p347"},{"t":"趋势回调通常不会得到检验，因为交易者相信趋势将会得到复苏并且他们太急于摆脱这次回调了，但是趋势反转却往往会得到检验，因为它反转了趋势，并且交易者非常不愿意相信反转将会取得成功。","p":"p348"},{"t":"大部分出现在牛市趋势中的回调下跌低点都是由已经获利的做多交易者寻找新的较低的购买点，和激进的做空交易者为了寻找卖空的点而造成的。当市场急剧下降，如图中的K线3所示，做多交易者将会积极购买直到恢复最初的头寸或者增加新的头寸，而做空交易者将会买回使得他们获利的头寸。一旦做空交易者有能力在接下来的市场做空，就像他们在市场下跌到K线7的位置时所做的，他们期待市场将会因为双方力量的较量，从而过渡到一个震荡区间或者是主要趋势的反转。相对于在下一次的反弹中卖空头寸，相反的是，他们会选择在这波摇摆的下跌浪中。持有一些或者所有的头寸做多交易者也认为市场进入了一波巨大的下跌浪中，所以只会在更低的点并且已经出现了非常清晰的购买信号的点处买入。因为双方在市场下跌到比过去的回调更深之前都不愿意购买，所以市场将可能会进入更深的回调，或者震荡趋势，甚至迎来主要趋势反转的加剧。","p":"p349"}]},{"t":"para","text":"在图4.8中，K线1，K线3，K线6这些在熊市中的加速下跌低点和K线4和K线这些反弹高点都在60分钟的AAPL图上得到了检验。","pid":"p344"},{"t":"para","text":"K线4是一个在熊市中的反弹高点并且本来无须得到检测，但是在10根K线以后得到了检测。","pid":"p345"},{"t":"para","text":"K线8是一个在震荡区间的反弹高点，并且打破了主要趋势线，所以它很可能会被检测。","pid":"p346"},{"t":"para","text":"K线7是一个新的波段的低点，但并不是一个加速下跌的低点。所以它没有得到检验。","pid":"p347"},{"t":"para","text":"趋势回调通常不会得到检验，因为交易者相信趋势将会得到复苏并且他们太急于摆脱这次回调了，但是趋势反转却往往会得到检验，因为它反转了趋势，并且交易者非常不愿意相信反转将会取得成功。","pid":"p348"},{"t":"para","text":"大部分出现在牛市趋势中的回调下跌低点都是由已经获利的做多交易者寻找新的较低的购买点，和激进的做空交易者为了寻找卖空的点而造成的。当市场急剧下降，如图中的K线3所示，做多交易者将会积极购买直到恢复最初的头寸或者增加新的头寸，而做空交易者将会买回使得他们获利的头寸。一旦做空交易者有能力在接下来的市场做空，就像他们在市场下跌到K线7的位置时所做的，他们期待市场将会因为双方力量的较量，从而过渡到一个震荡区间或者是主要趋势的反转。相对于在下一次的反弹中卖空头寸，相反的是，他们会选择在这波摇摆的下跌浪中。持有一些或者所有的头寸做多交易者也认为市场进入了一波巨大的下跌浪中，所以只会在更低的点并且已经出现了非常清晰的购买信号的点处买入。因为双方在市场下跌到比过去的回调更深之前都不愿意购买，所以市场将可能会进入更深的回调，或者震荡趋势，甚至迎来主要趋势反转的加剧。","pid":"p349"},{"t":"img","src":"assets/img/p1c4_009.webp","ctx":[{"t":"趋势回调通常不会得到检验，因为交易者相信趋势将会得到复苏并且他们太急于摆脱这次回调了，但是趋势反转却往往会得到检验，因为它反转了趋势，并且交易者非常不愿意相信反转将会取得成功。","p":"p348"},{"t":"大部分出现在牛市趋势中的回调下跌低点都是由已经获利的做多交易者寻找新的较低的购买点，和激进的做空交易者为了寻找卖空的点而造成的。当市场急剧下降，如图中的K线3所示，做多交易者将会积极购买直到恢复最初的头寸或者增加新的头寸，而做空交易者将会买回使得他们获利的头寸。一旦做空交易者有能力在接下来的市场做空，就像他们在市场下跌到K线7的位置时所做的，他们期待市场将会因为双方力量的较量，从而过渡到一个震荡区间或者是主要趋势的反转。相对于在下一次的反弹中卖空头寸，相反的是，他们会选择在这波摇摆的下跌浪中。持有一些或者所有的头寸做多交易者也认为市场进入了一波巨大的下跌浪中，所以只会在更低的点并且已经出现了非常清晰的购买信号的点处买入。因为双方在市场下跌到比过去的回调更深之前都不愿意购买，所以市场将可能会进入更深的回调，或者震荡趋势，甚至迎来主要趋势反转的加剧。","p":"p349"},{"t":"在图4.9上的K线3是在一个强劲的牛市趋势中的回调下跌低点而且也不太可能会得到测试。它仅仅只是第一个移动平均线的跳空缺口K线，很容易诱使空头做空。虽然这里的卖方非常强劲，但是后续并没有足够的卖出力量使得交易者确认市场会反转到可以持续做空的一方。在回调中做空的做空交易者意识到了这点，便迅速地买回了他们的头寸，在对市场持观望态度的同时，耐心地等待市场会有另一个机会反转。做多交易者将会积极买入，因为他们意识到做空交易者已经失败了，所以市场短暂的回调只是一个以更好的价格买入的简短的机会。他们甚至会期待市场中出现熊市回调，因为他们知道大部分的反转尝试都会失败，而这些回调将变成他们买入的绝佳机会。因为市场上已经没有愿意卖出的卖方力量，所以市场急剧上涨了好几根K线。","p":"p350"},{"t":"K线6是一个跟随着楔形顶部的熊市K线，这使得它看起来被市场验证了，因为至少接下来的两波下跌浪可以证明。","p":"p351"},{"t":"K线7是在一波熊市浪中的熊市K线，并且通过一个更高的低点得到了证明，在更高的时间图上看到这个点通过与K线4，6，7组成的楔形牛市旗形带来了牛市趋势的复苏。","p":"p352"},{"t":"K线11是一个强劲的下跌，并且可能是新的熊市趋势的第一波下跌浪，因为它是在K线10的较高的高点之后出现的。在这个时点，它不太可能是在牛市趋势中的回调，因此很可能会得到检验。在一波强劲的牛市趋势线被突破的时候市场很可能会迎来至少两波下跌浪（正如图中K线7之前形成的下跌）然后是一个更高的高点。","p":"p353"},{"t":"K线13是在大的牛市趋势中形成的两波下跌浪的底部。这可能会带来一个新的牛市的高点，因为它是在K线7的低点之上，而且市场还在不停地创造更高的低点和高点因此很有可能还是在牛市趋势之中。因为市场下降得如此迅速，所以在做多之前最好是从这点开始等待反弹和一个更高的低点。伴随着一个非常大的缺口，市场迅速下降到底部。","p":"p354"},{"t":"K线14和K线15是在一个强大的熊市趋势中形成的牛市趋势顶点，因此他们并没有得到检验。","p":"p355"},{"t":"K线17是在熊市趋势中形成的牛市顶点，因此也没有得到检验。在一个有着一系列的更低的高点和低点的熊市趋势中，它可能也只是一个普通的更低的高点。然而，不同的是，它是在一个微小的楔形底部之后出现的（K线15是在最初的回调之后形成的回调），而这个楔形底部看起来至少应该会带来两波下跌浪，所以上升至K线17的上升浪可能是这两波浪潮之一。此外，K线16的低点正处于K线1形成的窄幅震荡区间中，而这个震荡区间正是一个支撑区域，所以也可能会形成一个新的震荡区间。这意味着从K线18形成的双重底部处很有可能会产生第二次反弹。第一次反弹至K线17的趋势打破了熊市趋势线（即从K线12至K线16形成的趋势），这使得交易者们怀疑在这之后是否会出现一个测试熊市低点的区间，这个区域可能是一个震荡区间，也可能是一次主要趋势的反转。最后证明从K线18处产生了一个一直持续到图表结束处的很大的震荡区间。。","p":"p356"}]},{"t":"para","text":"在图4.9上的K线3是在一个强劲的牛市趋势中的回调下跌低点而且也不太可能会得到测试。它仅仅只是第一个移动平均线的跳空缺口K线，很容易诱使空头做空。虽然这里的卖方非常强劲，但是后续并没有足够的卖出力量使得交易者确认市场会反转到可以持续做空的一方。在回调中做空的做空交易者意识到了这点，便迅速地买回了他们的头寸，在对市场持观望态度的同时，耐心地等待市场会有另一个机会反转。做多交易者将会积极买入，因为他们意识到做空交易者已经失败了，所以市场短暂的回调只是一个以更好的价格买入的简短的机会。他们甚至会期待市场中出现熊市回调，因为他们知道大部分的反转尝试都会失败，而这些回调将变成他们买入的绝佳机会。因为市场上已经没有愿意卖出的卖方力量，所以市场急剧上涨了好几根K线。","pid":"p350"},{"t":"para","text":"K线6是一个跟随着楔形顶部的熊市K线，这使得它看起来被市场验证了，因为至少接下来的两波下跌浪可以证明。","pid":"p351"},{"t":"para","text":"K线7是在一波熊市浪中的熊市K线，并且通过一个更高的低点得到了证明，在更高的时间图上看到这个点通过与K线4，6，7组成的楔形牛市旗形带来了牛市趋势的复苏。","pid":"p352"},{"t":"para","text":"K线11是一个强劲的下跌，并且可能是新的熊市趋势的第一波下跌浪，因为它是在K线10的较高的高点之后出现的。在这个时点，它不太可能是在牛市趋势中的回调，因此很可能会得到检验。在一波强劲的牛市趋势线被突破的时候市场很可能会迎来至少两波下跌浪（正如图中K线7之前形成的下跌）然后是一个更高的高点。","pid":"p353"},{"t":"para","text":"K线13是在大的牛市趋势中形成的两波下跌浪的底部。这可能会带来一个新的牛市的高点，因为它是在K线7的低点之上，而且市场还在不停地创造更高的低点和高点因此很有可能还是在牛市趋势之中。因为市场下降得如此迅速，所以在做多之前最好是从这点开始等待反弹和一个更高的低点。伴随着一个非常大的缺口，市场迅速下降到底部。","pid":"p354"},{"t":"para","text":"K线14和K线15是在一个强大的熊市趋势中形成的牛市趋势顶点，因此他们并没有得到检验。","pid":"p355"},{"t":"para","text":"K线17是在熊市趋势中形成的牛市顶点，因此也没有得到检验。在一个有着一系列的更低的高点和低点的熊市趋势中，它可能也只是一个普通的更低的高点。然而，不同的是，它是在一个微小的楔形底部之后出现的（K线15是在最初的回调之后形成的回调），而这个楔形底部看起来至少应该会带来两波下跌浪，所以上升至K线17的上升浪可能是这两波浪潮之一。此外，K线16的低点正处于K线1形成的窄幅震荡区间中，而这个震荡区间正是一个支撑区域，所以也可能会形成一个新的震荡区间。这意味着从K线18形成的双重底部处很有可能会产生第二次反弹。第一次反弹至K线17的趋势打破了熊市趋势线（即从K线12至K线16形成的趋势），这使得交易者们怀疑在这之后是否会出现一个测试熊市低点的区间，这个区域可能是一个震荡区间，也可能是一次主要趋势的反转。最后证明从K线18处产生了一个一直持续到图表结束处的很大的震荡区间。。","pid":"p356"},{"t":"img","src":"assets/img/p1c4_010.webp","ctx":[{"t":"K线14和K线15是在一个强大的熊市趋势中形成的牛市趋势顶点，因此他们并没有得到检验。","p":"p355"},{"t":"K线17是在熊市趋势中形成的牛市顶点，因此也没有得到检验。在一个有着一系列的更低的高点和低点的熊市趋势中，它可能也只是一个普通的更低的高点。然而，不同的是，它是在一个微小的楔形底部之后出现的（K线15是在最初的回调之后形成的回调），而这个楔形底部看起来至少应该会带来两波下跌浪，所以上升至K线17的上升浪可能是这两波浪潮之一。此外，K线16的低点正处于K线1形成的窄幅震荡区间中，而这个震荡区间正是一个支撑区域，所以也可能会形成一个新的震荡区间。这意味着从K线18形成的双重底部处很有可能会产生第二次反弹。第一次反弹至K线17的趋势打破了熊市趋势线（即从K线12至K线16形成的趋势），这使得交易者们怀疑在这之后是否会出现一个测试熊市低点的区间，这个区域可能是一个震荡区间，也可能是一次主要趋势的反转。最后证明从K线18处产生了一个一直持续到图表结束处的很大的震荡区间。。","p":"p356"},{"t":"如图4.10所示，行动研究公司（简称RIMM）在天一个非常强劲的牛市顶点收盘，所以今天超越昨天的收盘价的概率非常高。虽然今天的反弹并不疯狂而且也没有太过于看涨，但是做空交易者依然不能把连续两日的收盘价拉下移动平均线。从这个图上看，趋势整体是向上的，但是向上的力量正在衰减。","p":"p357"}]},{"t":"para","text":"如图4.10所示，行动研究公司（简称RIMM）在天一个非常强劲的牛市顶点收盘，所以今天超越昨天的收盘价的概率非常高。虽然今天的反弹并不疯狂而且也没有太过于看涨，但是做空交易者依然不能把连续两日的收盘价拉下移动平均线。从这个图上看，趋势整体是向上的，但是向上的力量正在衰减。","pid":"p357"},{"t":"img","src":"assets/img/p1c4_011.webp","ctx":[{"t":"如图4.10所示，行动研究公司（简称RIMM）在天一个非常强劲的牛市顶点收盘，所以今天超越昨天的收盘价的概率非常高。虽然今天的反弹并不疯狂而且也没有太过于看涨，但是做空交易者依然不能把连续两日的收盘价拉下移动平均线。从这个图上看，趋势整体是向上的，但是向上的力量正在衰减。","p":"p357"},{"t":"如图4.11所示，在关于短期金融ETF产品（SKF）的图中，K线2处出现的开放式的高潮反转（一个倒V型顶部）只是在打破一个小型的熊市趋势通道线的顶部后出现的一个小反转。它也是打破了昨天的高点之后的第二条通道，代表了前一波上升浪的结束，并且与昨天的开盘价一起开启了下跌浪的复苏。它是自图形开始以后的第三个连续的购买高潮，同样，这波购买高潮也没有伴随着显著的回调和一个可能的一根K线组成的最后的旗形反转（在K线1之后的熊市K线是一个由一根K线的一个高点组成的牛市旗形）。如果在一个更高的时间图上，昨天的抛售已经跌破了牛市趋势线，并且K线2是一个从更高的高点开始的趋势反转向下。K线2可以测量从昨日的震荡区间开始的上升区域，但这个单独的理由并不能支持在一个牛市趋势中做空。当市场的趋势一直上升，并且上升的距离很大，做多交易者将会获得利益，但是做空交易者除非在如图中所显示的那样有其他的因素时才会做空。","p":"p358"},{"t":"K线2与它之前的牛市趋势K线组成了一个双重顶部。市场在这个牛市趋势线上一路直上，并且在K线的顶部的结束处又一次上升。市场下降到K线2的底部，有了第三波上升浪，这波上升浪潮一直到底后紧随而来的是十字星的高点，从而创造了一个微型的头肩顶或者三角形，这个形状在更小的时间图上将会更容易看到。这个顶部是由K线1形成的由一根K线组成的最后旗形之后出现的另一个由一根K线组成的最后旗形反转。K线2的主体和紧随其后的十字星与K线2之前的牛市K线的主主体一起形成了ii的形状。","p":"p359"},{"t":"当有其他的因素参与的时候，高潮反转会更让人信服一些。","p":"p360"}]},{"t":"para","text":"如图4.11所示，在关于短期金融ETF产品（SKF）的图中，K线2处出现的开放式的高潮反转（一个倒V型顶部）只是在打破一个小型的熊市趋势通道线的顶部后出现的一个小反转。它也是打破了昨天的高点之后的第二条通道，代表了前一波上升浪的结束，并且与昨天的开盘价一起开启了下跌浪的复苏。它是自图形开始以后的第三个连续的购买高潮，同样，这波购买高潮也没有伴随着显著的回调和一个可能的一根K线组成的最后的旗形反转（在K线1之后的熊市K线是一个由一根K线的一个高点组成的牛市旗形）。如果在一个更高的时间图上，昨天的抛售已经跌破了牛市趋势线，并且K线2是一个从更高的高点开始的趋势反转向下。K线2可以测量从昨日的震荡区间开始的上升区域，但这个单独的理由并不能支持在一个牛市趋势中做空。当市场的趋势一直上升，并且上升的距离很大，做多交易者将会获得利益，但是做空交易者除非在如图中所显示的那样有其他的因素时才会做空。","pid":"p358"},{"t":"para","text":"K线2与它之前的牛市趋势K线组成了一个双重顶部。市场在这个牛市趋势线上一路直上，并且在K线的顶部的结束处又一次上升。市场下降到K线2的底部，有了第三波上升浪，这波上升浪潮一直到底后紧随而来的是十字星的高点，从而创造了一个微型的头肩顶或者三角形，这个形状在更小的时间图上将会更容易看到。这个顶部是由K线1形成的由一根K线组成的最后旗形之后出现的另一个由一根K线组成的最后旗形反转。K线2的主体和紧随其后的十字星与K线2之前的牛市K线的主主体一起形成了ii的形状。","pid":"p359"},{"t":"para","text":"当有其他的因素参与的时候，高潮反转会更让人信服一些。","pid":"p360"},{"t":"img","src":"assets/img/p1c4_012.webp","ctx":[{"t":"K线2与它之前的牛市趋势K线组成了一个双重顶部。市场在这个牛市趋势线上一路直上，并且在K线的顶部的结束处又一次上升。市场下降到K线2的底部，有了第三波上升浪，这波上升浪潮一直到底后紧随而来的是十字星的高点，从而创造了一个微型的头肩顶或者三角形，这个形状在更小的时间图上将会更容易看到。这个顶部是由K线1形成的由一根K线组成的最后旗形之后出现的另一个由一根K线组成的最后旗形反转。K线2的主体和紧随其后的十字星与K线2之前的牛市K线的主主体一起形成了ii的形状。","p":"p359"},{"t":"当有其他的因素参与的时候，高潮反转会更让人信服一些。","p":"p360"},{"t":"如图4.12所示，在5分钟的关于石油服务（OIH）的图上，有一个比昨天的低点还低的高潮开盘反转，同时它也是一个三条趋势通道线的反转点。交易者应该在K线1之上的两根K线组成的大反转处购买，然后在K线2处的第二个高点处的第一波回调处再次买入，预期至少还会有两波上升浪。当市场可能已经出现了两波浪潮的时候通常会进入震荡阶段，因为相较于出现一个由两波下跌浪组成的回调，市场往往会出现一个新的趋势。","p":"p361"},{"t":"K线1是一个由两条K线组成的反转的底部。在K线1之前的一条K线是一条大的熊市趋势线，因为它有一个较低的收盘价，所以比它之前所有的熊市K线都要强劲。这意味着它从下方打破了之前的熊市趋势K线，同时更小的那根熊市趋势线其实是一个变形的由一根K线组成的最后旗形。在更小的时间图上，它可能看起来更像是一个较小的最后旗形。","p":"p362"},{"t":"逆趋势的交易者经常会画出趋势通道线，并期待趋势失败迎来反转，并且这次反转至少会让他们赢得一段时间的胜利，并且持续至少两波浪潮的反转移动。当趋势通道线是陡峭的，那么在趋势通道线的每一次反转中都去购买的策略将是不可取的。相对于等待趋势通道被有利的打破时购买，","p":"p363"}]},{"t":"para","text":"如图4.12所示，在5分钟的关于石油服务（OIH）的图上，有一个比昨天的低点还低的高潮开盘反转，同时它也是一个三条趋势通道线的反转点。交易者应该在K线1之上的两根K线组成的大反转处购买，然后在K线2处的第二个高点处的第一波回调处再次买入，预期至少还会有两波上升浪。当市场可能已经出现了两波浪潮的时候通常会进入震荡阶段，因为相较于出现一个由两波下跌浪组成的回调，市场往往会出现一个新的趋势。","pid":"p361"},{"t":"para","text":"K线1是一个由两条K线组成的反转的底部。在K线1之前的一条K线是一条大的熊市趋势线，因为它有一个较低的收盘价，所以比它之前所有的熊市K线都要强劲。这意味着它从下方打破了之前的熊市趋势K线，同时更小的那根熊市趋势线其实是一个变形的由一根K线组成的最后旗形。在更小的时间图上，它可能看起来更像是一个较小的最后旗形。","pid":"p362"},{"t":"para","text":"逆趋势的交易者经常会画出趋势通道线，并期待趋势失败迎来反转，并且这次反转至少会让他们赢得一段时间的胜利，并且持续至少两波浪潮的反转移动。当趋势通道线是陡峭的，那么在趋势通道线的每一次反转中都去购买的策略将是不可取的。相对于等待趋势通道被有利的打破时购买，","pid":"p363"},{"t":"img","src":"assets/img/p1c4_013.webp","ctx":[{"t":"K线1是一个由两条K线组成的反转的底部。在K线1之前的一条K线是一条大的熊市趋势线，因为它有一个较低的收盘价，所以比它之前所有的熊市K线都要强劲。这意味着它从下方打破了之前的熊市趋势K线，同时更小的那根熊市趋势线其实是一个变形的由一根K线组成的最后旗形。在更小的时间图上，它可能看起来更像是一个较小的最后旗形。","p":"p362"},{"t":"逆趋势的交易者经常会画出趋势通道线，并期待趋势失败迎来反转，并且这次反转至少会让他们赢得一段时间的胜利，并且持续至少两波浪潮的反转移动。当趋势通道线是陡峭的，那么在趋势通道线的每一次反转中都去购买的策略将是不可取的。相对于等待趋势通道被有利的打破时购买，","p":"p363"},{"t":"比如图4.13处K线5之前的大缺口，倒不如去寻找有突破的回调购买，比如在K线8处第二次尝试反转昨天的低点。","p":"p364"},{"t":"K线2打破了一根小的趋势通道线，但是在这之前并没有反趋势的力量出现并且锚定K线只有一个很小的牛市主体。聪明的交易者将会等待第二次入场时机，尤其是一个更高的低点。如果这个点并没有继续发展，他们将会把这个点看作是一个跟随趋势的锚定点，事实证明它也确实如此。请注意，打破K线2的突破是一种形式的强劲的熊市趋势K线。因为在早期已经有很多做多的交易者进入了这个较小的楔形，并且大部分交易者都不会在K线2被向下打破之前注意到趋势反转已经失败了。不过这也是很多交易者的停止入场的时点。同样地，很多做空交易者也会有进入时点，因为一个失败的楔形通常会将市场至少推进一个楔形的高度，所以在这个可以测量的下降距离将带来一次绝佳的卖空时机。当一个熊市通道已经如此陡峭的时候，聪明的做多交易者将会把卖空的价格限制在之前的飞线的高点处或更高处，而在那些点处积极的做多交易者正在疯狂买入。","p":"p365"},{"t":"K线3超越了另外一条趋势通道线，所以并没有入场信号，因此很少有做多交易者被困在此处","p":"p366"},{"t":"K线5的开盘在熊市趋势线之上，但是它之前有一个大概空出了20根K线的距离的卖空缺口，并且它是第一个在移动平均线上有缺口的K线（已经非常接近移动平均线了一这根K线的主体非常大，并且完全高于指数移动平均线），于是它开创了向下反转的趋势。","p":"p367"},{"t":"K线6并没有到达趋势通道线，所以即使它尝试反转昨天的低点这个反转的尝试也难以成功。大部分的交易者都在等待市场上出现超卖的现象，如果这种现象没有出现，那么他们预期至少会出现第二个进入市场的通道。当然，这个带有信号的K线将会是一个有着瘦小的主体的十字星，这信号的出现意味着市场上的做多交易者不再强势。","p":"p368"},{"t":"K线8打破了熊市通道线，作为一个信号K线它是一根有着较大的牛市主体的内部K线。这个点同样是市场的第二次尝试。企图反转昨天的低点，从而创造了那天的一个尽可能低的开盘反转点。K线8是从K线7的最后旗形处反转向上的点，同时也是一个自K线5从上方打破熊市通道以后，以一个更低的低点打破了这波回调的点。请记住，一个熊市的通道同时也是一个牛市旗形。市场上的一些交易者直到看到市场反弹到K线5处并从上方打破了熊市通道线和移动平均线后，才理性地认为市场上的主要趋势开始出现了反转。最终证明，K线8也是一波连续的卖出高潮，同时它是这波卖出潮中拥有最大的熊市主体的K线，一般来说，在连续的卖出高潮结束时这种K线的出现会比较平常。","p":"p369"},{"t":"一旦市场上的斜率上升了，那么市场的趋势就正在加剧并且很可能会面临回调。这是因为加速的斜率往往意味着市场情绪的上涨，并且一旦这些情绪化的交易者离开市场，在市场出现回调之前市场上的交易者将不再愿意进行交易。","p":"p370"}]},{"t":"para","text":"比如图4.13处K线5之前的大缺口，倒不如去寻找有突破的回调购买，比如在K线8处第二次尝试反转昨天的低点。","pid":"p364"},{"t":"para","text":"K线2打破了一根小的趋势通道线，但是在这之前并没有反趋势的力量出现并且锚定K线只有一个很小的牛市主体。聪明的交易者将会等待第二次入场时机，尤其是一个更高的低点。如果这个点并没有继续发展，他们将会把这个点看作是一个跟随趋势的锚定点，事实证明它也确实如此。请注意，打破K线2的突破是一种形式的强劲的熊市趋势K线。因为在早期已经有很多做多的交易者进入了这个较小的楔形，并且大部分交易者都不会在K线2被向下打破之前注意到趋势反转已经失败了。不过这也是很多交易者的停止入场的时点。同样地，很多做空交易者也会有进入时点，因为一个失败的楔形通常会将市场至少推进一个楔形的高度，所以在这个可以测量的下降距离将带来一次绝佳的卖空时机。当一个熊市通道已经如此陡峭的时候，聪明的做多交易者将会把卖空的价格限制在之前的飞线的高点处或更高处，而在那些点处积极的做多交易者正在疯狂买入。","pid":"p365"},{"t":"para","text":"K线3超越了另外一条趋势通道线，所以并没有入场信号，因此很少有做多交易者被困在此处","pid":"p366"},{"t":"para","text":"K线5的开盘在熊市趋势线之上，但是它之前有一个大概空出了20根K线的距离的卖空缺口，并且它是第一个在移动平均线上有缺口的K线（已经非常接近移动平均线了一这根K线的主体非常大，并且完全高于指数移动平均线），于是它开创了向下反转的趋势。","pid":"p367"},{"t":"para","text":"K线6并没有到达趋势通道线，所以即使它尝试反转昨天的低点这个反转的尝试也难以成功。大部分的交易者都在等待市场上出现超卖的现象，如果这种现象没有出现，那么他们预期至少会出现第二个进入市场的通道。当然，这个带有信号的K线将会是一个有着瘦小的主体的十字星，这信号的出现意味着市场上的做多交易者不再强势。","pid":"p368"},{"t":"para","text":"K线8打破了熊市通道线，作为一个信号K线它是一根有着较大的牛市主体的内部K线。这个点同样是市场的第二次尝试。企图反转昨天的低点，从而创造了那天的一个尽可能低的开盘反转点。K线8是从K线7的最后旗形处反转向上的点，同时也是一个自K线5从上方打破熊市通道以后，以一个更低的低点打破了这波回调的点。请记住，一个熊市的通道同时也是一个牛市旗形。市场上的一些交易者直到看到市场反弹到K线5处并从上方打破了熊市通道线和移动平均线后，才理性地认为市场上的主要趋势开始出现了反转。最终证明，K线8也是一波连续的卖出高潮，同时它是这波卖出潮中拥有最大的熊市主体的K线，一般来说，在连续的卖出高潮结束时这种K线的出现会比较平常。","pid":"p369"},{"t":"para","text":"一旦市场上的斜率上升了，那么市场的趋势就正在加剧并且很可能会面临回调。这是因为加速的斜率往往意味着市场情绪的上涨，并且一旦这些情绪化的交易者离开市场，在市场出现回调之前市场上的交易者将不再愿意进行交易。","pid":"p370"},{"t":"img","src":"assets/img/p1c4_014.webp","ctx":[{"t":"K线8打破了熊市通道线，作为一个信号K线它是一根有着较大的牛市主体的内部K线。这个点同样是市场的第二次尝试。企图反转昨天的低点，从而创造了那天的一个尽可能低的开盘反转点。K线8是从K线7的最后旗形处反转向上的点，同时也是一个自K线5从上方打破熊市通道以后，以一个更低的低点打破了这波回调的点。请记住，一个熊市的通道同时也是一个牛市旗形。市场上的一些交易者直到看到市场反弹到K线5处并从上方打破了熊市通道线和移动平均线后，才理性地认为市场上的主要趋势开始出现了反转。最终证明，K线8也是一波连续的卖出高潮，同时它是这波卖出潮中拥有最大的熊市主体的K线，一般来说，在连续的卖出高潮结束时这种K线的出现会比较平常。","p":"p369"},{"t":"一旦市场上的斜率上升了，那么市场的趋势就正在加剧并且很可能会面临回调。这是因为加速的斜率往往意味着市场情绪的上涨，并且一旦这些情绪化的交易者离开市场，在市场出现回调之前市场上的交易者将不再愿意进行交易。","p":"p370"}]},{"t":"img","src":"assets/img/p1c4_015.webp","ctx":[{"t":"在图4.14中，我们可以看到K线8之前的一段上升潮要比它之前的牛市趋势线更加。所以整个牛市趋势在K线10处以一个缺口向上的熊市反转结束","p":"p371"},{"t":"从K线13处形成的下跌浪比它之前的熊市通道更加陡峭，并且这个卖出高潮在K线15这个强劲的牛市趋势K线处被反转，这波下跌潮与从K线4到K线10形成的牛市趋势线一起形成了一个双重底部。这个双重底拥有一个陡峭的上升潮和下跌潮，因此形成了一个强劲的购买高潮。一般来说，高潮后面也会跟随着震荡区间，正如图中K线20之前出现的两波反弹浪所示","p":"p372"},{"t":"在K线14之前的熊市趋势K线在那个时点可以被看成是一个可以造成市场趋势急速下降的突破点，也可以看成是一个可能导致趋势反转向上的急剧的卖出高潮，这波高潮可能会持续大概10根K线和两波下跌浪。正是因为它是在一系列不连续并且陡峭的熊市K线之后出现的，所以它看起来像是要打破这个不能持续的熊市趋势，因为具有了高潮的特征。市场上许多交易者也正是在他们看到了一根如此大的熊市K线时才会开始购买。许多人会选择在这根K线的收盘处购买，但是因为这个收盘价与昨天的低点非常接近，因此还有许多交易者会继续等待，看市场是否会下跌的更远一些。这些交易者将会在K线15形成的过程中在它的收盘处，以高于它的高点的价格购买。这是一次非常成功的对于昨天的低点的卖出真空测试（一个双重底的趋势反转），并且在这次测试中买方完全控制住了市场。他们期望做空交易者的突破会失败，而K线15将变成这次失败的突破的一个购买信号K线。做空交易者一直在K线15之前做空头寸，在K线15处他们将头寸买回并获得收益，但是如果他们决定在之后的一段时间或者更高的几段K线处再次做空的话，他们将不会这样做。如果他们认为市场上的回调将会比较短暂，他们就将一直持有空头。但是市场上出现的强劲的牛市反转K线和进入K线都是反转已经非常强劲的证据，所以这些卖方将会暂时退出市场，大约会持续10根K线。这将会使得市场上只有一方力量的存在，从而会导致一个较大的反弹出现。做空交易者正在寻找一个合适进入市场重新做空的机会，但是他们在K线20之前都没有发现这样的时机。做多交易者意识到做空交易者很可能会进入市场，所以他们卖掉他们手中的头寸获得利益，并且会继续等待大概10根K线才重新考虑购买。他们在K线20的低点后持续购买了7根K线，这些反转向上的K线同K线17的低点一起形成了一个双重底部。它是一个低点越来越高的主要趋势反转（K线20之前的反弹打破了持续到K线15的熊市趋势），同时也是一个三角形（K线4和K线15是最先的处于下方的两点）。","p":"p373"},{"t":"当一种高潮模式不能够有足够的动力支持其反转时，那么你可能对市场的理解有误并且正在朝错误的方向交易。楔形反转和楔形回调并不相同，即使他们看起来会一样。你需要仔细注意它前后的趋势。如果在牛市趋势中出现了一个楔形回调。则代表在牛市的趋势中购买是相对有利的，所以你可以在第一个信号出现时开始购买。但是不幸的是，如果市场处于熊市趋势中，过度饥渴的做多交易者往往会把楔形底部看成是一次回调，但事实上大部分都是反转。当楔形反转开始出现时，它将是反向趋势的交易，所以在你购买之前你应该等待一个更高的低点，并且只有在趋势线被强有力的打破后才开始购买。在一个强大的熊市趋势中试图保存头寸是失败的策略。","p":"p374"}]},{"t":"para","text":"在图4.14中，我们可以看到K线8之前的一段上升潮要比它之前的牛市趋势线更加。所以整个牛市趋势在K线10处以一个缺口向上的熊市反转结束","pid":"p371"},{"t":"para","text":"从K线13处形成的下跌浪比它之前的熊市通道更加陡峭，并且这个卖出高潮在K线15这个强劲的牛市趋势K线处被反转，这波下跌潮与从K线4到K线10形成的牛市趋势线一起形成了一个双重底部。这个双重底拥有一个陡峭的上升潮和下跌潮，因此形成了一个强劲的购买高潮。一般来说，高潮后面也会跟随着震荡区间，正如图中K线20之前出现的两波反弹浪所示","pid":"p372"},{"t":"para","text":"在K线14之前的熊市趋势K线在那个时点可以被看成是一个可以造成市场趋势急速下降的突破点，也可以看成是一个可能导致趋势反转向上的急剧的卖出高潮，这波高潮可能会持续大概10根K线和两波下跌浪。正是因为它是在一系列不连续并且陡峭的熊市K线之后出现的，所以它看起来像是要打破这个不能持续的熊市趋势，因为具有了高潮的特征。市场上许多交易者也正是在他们看到了一根如此大的熊市K线时才会开始购买。许多人会选择在这根K线的收盘处购买，但是因为这个收盘价与昨天的低点非常接近，因此还有许多交易者会继续等待，看市场是否会下跌的更远一些。这些交易者将会在K线15形成的过程中在它的收盘处，以高于它的高点的价格购买。这是一次非常成功的对于昨天的低点的卖出真空测试（一个双重底的趋势反转），并且在这次测试中买方完全控制住了市场。他们期望做空交易者的突破会失败，而K线15将变成这次失败的突破的一个购买信号K线。做空交易者一直在K线15之前做空头寸，在K线15处他们将头寸买回并获得收益，但是如果他们决定在之后的一段时间或者更高的几段K线处再次做空的话，他们将不会这样做。如果他们认为市场上的回调将会比较短暂，他们就将一直持有空头。但是市场上出现的强劲的牛市反转K线和进入K线都是反转已经非常强劲的证据，所以这些卖方将会暂时退出市场，大约会持续10根K线。这将会使得市场上只有一方力量的存在，从而会导致一个较大的反弹出现。做空交易者正在寻找一个合适进入市场重新做空的机会，但是他们在K线20之前都没有发现这样的时机。做多交易者意识到做空交易者很可能会进入市场，所以他们卖掉他们手中的头寸获得利益，并且会继续等待大概10根K线才重新考虑购买。他们在K线20的低点后持续购买了7根K线，这些反转向上的K线同K线17的低点一起形成了一个双重底部。它是一个低点越来越高的主要趋势反转（K线20之前的反弹打破了持续到K线15的熊市趋势），同时也是一个三角形（K线4和K线15是最先的处于下方的两点）。","pid":"p373"},{"t":"para","text":"当一种高潮模式不能够有足够的动力支持其反转时，那么你可能对市场的理解有误并且正在朝错误的方向交易。楔形反转和楔形回调并不相同，即使他们看起来会一样。你需要仔细注意它前后的趋势。如果在牛市趋势中出现了一个楔形回调。则代表在牛市的趋势中购买是相对有利的，所以你可以在第一个信号出现时开始购买。但是不幸的是，如果市场处于熊市趋势中，过度饥渴的做多交易者往往会把楔形底部看成是一次回调，但事实上大部分都是反转。当楔形反转开始出现时，它将是反向趋势的交易，所以在你购买之前你应该等待一个更高的低点，并且只有在趋势线被强有力的打破后才开始购买。在一个强大的熊市趋势中试图保存头寸是失败的策略。","pid":"p374"},{"t":"img","src":"assets/img/p1c4_016.webp","ctx":[{"t":"在K线14之前的熊市趋势K线在那个时点可以被看成是一个可以造成市场趋势急速下降的突破点，也可以看成是一个可能导致趋势反转向上的急剧的卖出高潮，这波高潮可能会持续大概10根K线和两波下跌浪。正是因为它是在一系列不连续并且陡峭的熊市K线之后出现的，所以它看起来像是要打破这个不能持续的熊市趋势，因为具有了高潮的特征。市场上许多交易者也正是在他们看到了一根如此大的熊市K线时才会开始购买。许多人会选择在这根K线的收盘处购买，但是因为这个收盘价与昨天的低点非常接近，因此还有许多交易者会继续等待，看市场是否会下跌的更远一些。这些交易者将会在K线15形成的过程中在它的收盘处，以高于它的高点的价格购买。这是一次非常成功的对于昨天的低点的卖出真空测试（一个双重底的趋势反转），并且在这次测试中买方完全控制住了市场。他们期望做空交易者的突破会失败，而K线15将变成这次失败的突破的一个购买信号K线。做空交易者一直在K线15之前做空头寸，在K线15处他们将头寸买回并获得收益，但是如果他们决定在之后的一段时间或者更高的几段K线处再次做空的话，他们将不会这样做。如果他们认为市场上的回调将会比较短暂，他们就将一直持有空头。但是市场上出现的强劲的牛市反转K线和进入K线都是反转已经非常强劲的证据，所以这些卖方将会暂时退出市场，大约会持续10根K线。这将会使得市场上只有一方力量的存在，从而会导致一个较大的反弹出现。做空交易者正在寻找一个合适进入市场重新做空的机会，但是他们在K线20之前都没有发现这样的时机。做多交易者意识到做空交易者很可能会进入市场，所以他们卖掉他们手中的头寸获得利益，并且会继续等待大概10根K线才重新考虑购买。他们在K线20的低点后持续购买了7根K线，这些反转向上的K线同K线17的低点一起形成了一个双重底部。它是一个低点越来越高的主要趋势反转（K线20之前的反弹打破了持续到K线15的熊市趋势），同时也是一个三角形（K线4和K线15是最先的处于下方的两点）。","p":"p373"},{"t":"当一种高潮模式不能够有足够的动力支持其反转时，那么你可能对市场的理解有误并且正在朝错误的方向交易。楔形反转和楔形回调并不相同，即使他们看起来会一样。你需要仔细注意它前后的趋势。如果在牛市趋势中出现了一个楔形回调。则代表在牛市的趋势中购买是相对有利的，所以你可以在第一个信号出现时开始购买。但是不幸的是，如果市场处于熊市趋势中，过度饥渴的做多交易者往往会把楔形底部看成是一次回调，但事实上大部分都是反转。当楔形反转开始出现时，它将是反向趋势的交易，所以在你购买之前你应该等待一个更高的低点，并且只有在趋势线被强有力的打破后才开始购买。在一个强大的熊市趋势中试图保存头寸是失败的策略。","p":"p374"},{"t":"如图4.15所示，K线4与K线2和3处形成的下跌动力一起形成了三次下跌，并且跃过了K线1和K线3一起形成的熊市趋势通道线。然而，市场依旧是向下而非向上发展。做多交易者并不强大，所以实际上，市场上过多的看跌情绪是正常的。任何时候，一旦市场上出现的是非常强劲的熊市趋势，那么交易者最好就是做空，除非市场上出现了更高的低点，你才可以开始做多，而且即使你在那个低点做多，你也需要在熊市趋势进入了第二个低点的时候准备好做空。","p":"p375"},{"t":"在K线8最后进入收盘的阶段之前，它是一根牛市反转K线，在收盘时，它因为迅速地卖空从而变成了一根熊市趋势K线。过度渴的做多交易者认为在楔形的底部会形成一个牛市反转K线，并且两条熊市趋势通道线将变成一个打破熊市通道线的突破，这意味着每个人都知道市场还会持续很长一段时间的熊市。这一点被楔形反转失败后紧随而来的一系列熊市趋势K线证实了。如果你观察市场上的动向，你将会看到这根牛市反转K线逐步崩溃成一根熊市趋势K线，然后你将会开始做空，因为你知道那些早期进入市场做多的交易者已经被困住了，他们当时认为市场将出现一根打破熊市趋势通道线的强大的牛市反转K线（千万不要在K线没有被证实反转之前购买，永远要在等到K线收盘并且下一根K线已经证实了大反转的时候再购买）。即使你不知道这个交易规则，那么在打破熊市通道线的低点之下购买也是一种非常聪明的交易方式。","p":"p376"},{"t":"K线11是另外一个三浪向下推进的模式，但是在许多的十字星和大的交叠的K线中，市场上的做多交易者需要的是第二次的信号，所以他们一直在寻找在这条趋势线上的高点附近的小K线做空（比如K线12，这根牛市反转K线之前的一根K线打破了市场，很显然许多做多交易者被困在了此处）。K线11是一根不太好的牛市反转K线，因为在此处并没有显著的做多力量在市场上方打破熊市趋势线，而且它同之前的K线有太多的重叠，这逼迫你会在一个熊市震荡区间的高点附近购买（永远记住，低买，高卖！）。这是一段熊市趋势非常强劲的时间，而最好的交易者不会去等待寻找楔形。相反，他们会在移动平均线附近寻找做空的时机。因为这些时机非常少，而做空交易者又非常强劲。所以聪明的寻找卖机的交易者应该在每一个失败的购买信号，比如低点1和低点2的条形区域卖出头寸。","p":"p377"},{"t":"在K线2，3，6，9之前以及K线12之后都有连续的卖出高潮。这些下跌并不是在一个狭窄的通道中进行的，而且每一次市场上多余的动能都需要10根左右的K线来吸收解决。这导致了一系列的震荡区间，在比较强劲的趋势中这些震荡区间非常常见，而且它们组织了趋势高潮的反转。","p":"p378"},{"t":"当你发现你绘制了多条趋势通道线时，因为你的焦虑以及不敢相信导致你可能会被你眼前的事实蒙蔽（看图4.16）。","p":"p379"}]},{"t":"para","text":"如图4.15所示，K线4与K线2和3处形成的下跌动力一起形成了三次下跌，并且跃过了K线1和K线3一起形成的熊市趋势通道线。然而，市场依旧是向下而非向上发展。做多交易者并不强大，所以实际上，市场上过多的看跌情绪是正常的。任何时候，一旦市场上出现的是非常强劲的熊市趋势，那么交易者最好就是做空，除非市场上出现了更高的低点，你才可以开始做多，而且即使你在那个低点做多，你也需要在熊市趋势进入了第二个低点的时候准备好做空。","pid":"p375"},{"t":"para","text":"在K线8最后进入收盘的阶段之前，它是一根牛市反转K线，在收盘时，它因为迅速地卖空从而变成了一根熊市趋势K线。过度渴的做多交易者认为在楔形的底部会形成一个牛市反转K线，并且两条熊市趋势通道线将变成一个打破熊市通道线的突破，这意味着每个人都知道市场还会持续很长一段时间的熊市。这一点被楔形反转失败后紧随而来的一系列熊市趋势K线证实了。如果你观察市场上的动向，你将会看到这根牛市反转K线逐步崩溃成一根熊市趋势K线，然后你将会开始做空，因为你知道那些早期进入市场做多的交易者已经被困住了，他们当时认为市场将出现一根打破熊市趋势通道线的强大的牛市反转K线（千万不要在K线没有被证实反转之前购买，永远要在等到K线收盘并且下一根K线已经证实了大反转的时候再购买）。即使你不知道这个交易规则，那么在打破熊市通道线的低点之下购买也是一种非常聪明的交易方式。","pid":"p376"},{"t":"para","text":"K线11是另外一个三浪向下推进的模式，但是在许多的十字星和大的交叠的K线中，市场上的做多交易者需要的是第二次的信号，所以他们一直在寻找在这条趋势线上的高点附近的小K线做空（比如K线12，这根牛市反转K线之前的一根K线打破了市场，很显然许多做多交易者被困在了此处）。K线11是一根不太好的牛市反转K线，因为在此处并没有显著的做多力量在市场上方打破熊市趋势线，而且它同之前的K线有太多的重叠，这逼迫你会在一个熊市震荡区间的高点附近购买（永远记住，低买，高卖！）。这是一段熊市趋势非常强劲的时间，而最好的交易者不会去等待寻找楔形。相反，他们会在移动平均线附近寻找做空的时机。因为这些时机非常少，而做空交易者又非常强劲。所以聪明的寻找卖机的交易者应该在每一个失败的购买信号，比如低点1和低点2的条形区域卖出头寸。","pid":"p377"},{"t":"para","text":"在K线2，3，6，9之前以及K线12之后都有连续的卖出高潮。这些下跌并不是在一个狭窄的通道中进行的，而且每一次市场上多余的动能都需要10根左右的K线来吸收解决。这导致了一系列的震荡区间，在比较强劲的趋势中这些震荡区间非常常见，而且它们组织了趋势高潮的反转。","pid":"p378"},{"t":"para","text":"当你发现你绘制了多条趋势通道线时，因为你的焦虑以及不敢相信导致你可能会被你眼前的事实蒙蔽（看图4.16）。","pid":"p379"},{"t":"img","src":"assets/img/p1c4_017.webp","ctx":[{"t":"在K线2，3，6，9之前以及K线12之后都有连续的卖出高潮。这些下跌并不是在一个狭窄的通道中进行的，而且每一次市场上多余的动能都需要10根左右的K线来吸收解决。这导致了一系列的震荡区间，在比较强劲的趋势中这些震荡区间非常常见，而且它们组织了趋势高潮的反转。","p":"p378"},{"t":"当你发现你绘制了多条趋势通道线时，因为你的焦虑以及不敢相信导致你可能会被你眼前的事实蒙蔽（看图4.16）。","p":"p379"},{"t":"即使在图上的趋势是在一个熊市通道中，这个通道也有很多双向交易，他们可能会比你想象的持续的时间久。你可以始终假设一个趋势通道是会永远存续下去，但是一旦它最终不能存续，那你就要改变你的思维了。这些双向交易让趋势看起来好像要反转，但是大部分反转的尝试都会失败。这个趋势是很强劲的。但是你也在失去所有的跟随着趋势的做空机会。因为你满眼看到的都是趋势通道线，而在你的潜意识里潜在的反转只会出现在一个震荡区间中的过度抛售的日子（在趋势中的通道或者通道模式通常是这样看待的）。耐心等待并且跟随着趋势交易，除非市场上出现了一个非常强劲且明确的反转，你甚至都不需要通过画图来确定时你才可以不需要跟随趋势交易，比如强劲的K线6是反转了昨天的低点，同时也是一个三次推动向下的模式（K线4，K线5，K线6一起组成）。在交易的时候不要按照你觉得应该会发生的结论去交易，永远按照正在发生的结果进行交易，即使它看起来是那么不可思议。正如在第一本书的第15章讨论的那样，当市场处于熊市通道时，聪明的交易者只会在K线之下而非之上购买，他们会更有兴趣做空，并且只会在之前的K线之上而非之下做空。","p":"p380"}]},{"t":"para","text":"即使在图上的趋势是在一个熊市通道中，这个通道也有很多双向交易，他们可能会比你想象的持续的时间久。你可以始终假设一个趋势通道是会永远存续下去，但是一旦它最终不能存续，那你就要改变你的思维了。这些双向交易让趋势看起来好像要反转，但是大部分反转的尝试都会失败。这个趋势是很强劲的。但是你也在失去所有的跟随着趋势的做空机会。因为你满眼看到的都是趋势通道线，而在你的潜意识里潜在的反转只会出现在一个震荡区间中的过度抛售的日子（在趋势中的通道或者通道模式通常是这样看待的）。耐心等待并且跟随着趋势交易，除非市场上出现了一个非常强劲且明确的反转，你甚至都不需要通过画图来确定时你才可以不需要跟随趋势交易，比如强劲的K线6是反转了昨天的低点，同时也是一个三次推动向下的模式（K线4，K线5，K线6一起组成）。在交易的时候不要按照你觉得应该会发生的结论去交易，永远按照正在发生的结果进行交易，即使它看起来是那么不可思议。正如在第一本书的第15章讨论的那样，当市场处于熊市通道时，聪明的交易者只会在K线之下而非之上购买，他们会更有兴趣做空，并且只会在之前的K线之上而非之下做空。","pid":"p380"},{"t":"img","src":"assets/img/p1c4_018.webp","ctx":[{"t":"即使在图上的趋势是在一个熊市通道中，这个通道也有很多双向交易，他们可能会比你想象的持续的时间久。你可以始终假设一个趋势通道是会永远存续下去，但是一旦它最终不能存续，那你就要改变你的思维了。这些双向交易让趋势看起来好像要反转，但是大部分反转的尝试都会失败。这个趋势是很强劲的。但是你也在失去所有的跟随着趋势的做空机会。因为你满眼看到的都是趋势通道线，而在你的潜意识里潜在的反转只会出现在一个震荡区间中的过度抛售的日子（在趋势中的通道或者通道模式通常是这样看待的）。耐心等待并且跟随着趋势交易，除非市场上出现了一个非常强劲且明确的反转，你甚至都不需要通过画图来确定时你才可以不需要跟随趋势交易，比如强劲的K线6是反转了昨天的低点，同时也是一个三次推动向下的模式（K线4，K线5，K线6一起组成）。在交易的时候不要按照你觉得应该会发生的结论去交易，永远按照正在发生的结果进行交易，即使它看起来是那么不可思议。正如在第一本书的第15章讨论的那样，当市场处于熊市通道时，聪明的交易者只会在K线之下而非之上购买，他们会更有兴趣做空，并且只会在之前的K线之上而非之下做空。","p":"p380"},{"t":"如图4.17右边的图所示，在5分钟的SPY图上，K线3处有一个非常强劲的卖出高潮，在K线4的两条K线的反转之后跟随着一个突破移动平均线的强劲反弹。在左边的图表是一个1分钟的K线图，图中显示了在低点时交易量的减弱情况，这是很正常的。在K线4的低点的交易量要小于早先的K线3的低点的交易量，即使K线4是处于更低的价格。在不同的时间图表上，或许会有时间和交易量的差异，但是有经验的交易者不需要通过5分钟以上的交易图表就能够知道这些","p":"p381"},{"t":"传统的技术分析会认为在牛市反转处的交易量应该会比在最后的熊市K线处的交易量大。但是在这张图中的5分钟时间图上，在K线4这个牛市反转K线的交易量要比之前的两根熊市趋势K线要小。这些会使得这次的反转不那么可信吗？一点也不会，但是它可能会使得交易者不会在底部购买。在我进行交易的时候，我不想分心，所以我不会去看任何交易量或者其他指标，因为图表已经告诉了我想知道的所有信息。顺便提一下，K线2比K线4的低点有更大的交易量，但是依然是一次失败的反转，并最终呈现出一个双重顶部的熊市旗形。","p":"p382"},{"t":"K线3底部的大尾部是买方正在入场的标志，通常市场在进入回调之前会下跌一到两根K线。K线4是一个强劲的两条K线的反转，同时与K线3的低点形成了一个微型的双重底部。K线3也是一种形式的最后旗形，可能在更小的时间图表上也看起来是一个最后旗形。","p":"p383"}]},{"t":"para","text":"如图4.17右边的图所示，在5分钟的SPY图上，K线3处有一个非常强劲的卖出高潮，在K线4的两条K线的反转之后跟随着一个突破移动平均线的强劲反弹。在左边的图表是一个1分钟的K线图，图中显示了在低点时交易量的减弱情况，这是很正常的。在K线4的低点的交易量要小于早先的K线3的低点的交易量，即使K线4是处于更低的价格。在不同的时间图表上，或许会有时间和交易量的差异，但是有经验的交易者不需要通过5分钟以上的交易图表就能够知道这些","pid":"p381"},{"t":"para","text":"传统的技术分析会认为在牛市反转处的交易量应该会比在最后的熊市K线处的交易量大。但是在这张图中的5分钟时间图上，在K线4这个牛市反转K线的交易量要比之前的两根熊市趋势K线要小。这些会使得这次的反转不那么可信吗？一点也不会，但是它可能会使得交易者不会在底部购买。在我进行交易的时候，我不想分心，所以我不会去看任何交易量或者其他指标，因为图表已经告诉了我想知道的所有信息。顺便提一下，K线2比K线4的低点有更大的交易量，但是依然是一次失败的反转，并最终呈现出一个双重顶部的熊市旗形。","pid":"p382"},{"t":"para","text":"K线3底部的大尾部是买方正在入场的标志，通常市场在进入回调之前会下跌一到两根K线。K线4是一个强劲的两条K线的反转，同时与K线3的低点形成了一个微型的双重底部。K线3也是一种形式的最后旗形，可能在更小的时间图表上也看起来是一个最后旗形。","pid":"p383"}],"wcount":33180},{"id":"p1c5","title":"第5章　楔形和其他三浪推进反转模式","blocks":[{"t":"para","text":"第5章　楔形和其他三浪推进反转模式","pid":"p384"},{"t":"para","text":"当市场朝着一个方向进入三浪推进模式，将会带来反转形态从而开启反转交易，反转交易的第一个目标就是找到这个模式的开始部分，第二个目标就是基于这个模式的高度找到趋势的移动距离。举个例子，如果一个楔形顶部的第三波向上浪潮是以一根强劲的熊市反转K线结束，并且接下来的K线是在这根反转K线之下交易，那么我们的第一个目标就是测试这个楔形的底部（即从第一波向上的推动浪开始形成的回调的底部）：第二个目标就是基于从底部到顶部的距离，来测量市场向下移动的距离。所有的三浪推动模式都会反映同样的市场行为，不论他们呈现出来的是怎样的形态。他们表现的形态可以是楔形。微态楔形，抛物线型的楔形，四浪推动的楔形，在趋势中出现的楔形回调或者震荡区域，楔形反转模式，或者其他类型的三角型（包括扩展的三角形），三重顶部或者底部，双重顶部或者底部的回调。头肩顶或者头肩底部，甚至是在双重顶部之下或者双重底部之上出现的失败的突破模式。有时候。当市场的趋势交易者放弃尝试一个强劲的突破时，逆趋势交易者将获得市场的控制权。而连续三次的反转将足以推动上述情况的发生。","pid":"p385"},{"t":"para","text":"三浪推动模式通常会包含大的趋势K线，并且会带来连续地高潮。如果这些推动是由1到3根强劲的K线组成，那么交易者将会把他们看作是高潮。举个例子，在一波强劲的向下熊市趋势后，出现了一个回调，之后又是一波强劲的熊市下跌浪，交易者将会怀疑这波回调是否是熊市趋势中的一个最后旗形，并且在这些连续的卖出高潮之后是否会跟随一个更大的回调。如果在第二波下推浪后出现了一个小回调，而不是一组10根K线组成的反弹，然后是第三次强劲的下跌浪，交易者将会把这三次推进看作是连续的卖出高潮。他们知道。市场出现一个更复杂的调整的概率将大于60%，比如说出现两波持续大约10根或者更多根的上升浪潮。所以，如果这个模式有一个非常明显的信号K线，合理的形态，充足的买盘压力，同时也不是一个非常狭窄的熊市通道，那么交易者就会在市场第三次推动向下时考虑买入，进行反转交易。","pid":"p386"},{"t":"para","text":"楔形既可以是回调也可以是反转。形回调已经在第二本书的18和19章讨论过了。当他们是趋势的回调时，他们是顺势的入场点，并且最好是在第一个信号出现时就进入市场。楔形反转企图反转趋势，所以他们是逆势的入场点。通常，最好是等到逆势的第二个信号处再进场。举个例子，当在熊市趋势中出现了一个楔形底部的时候，除非这个模式已经非常明显了，你才可以在信号K线的上方购买。除此之外，你最好还是等待看市场上是否出现了一个强劲的牛市突破，然后再在回调时买入，这些回调可能是更高的低点也可能是更低的低点。如果这波牛市突破径直而上且没有出现回调，那么交易者就应该同其他的突破点一样进行交易，这些我们已经在第二本书中讲过了。关于楔形回调和楔形反转不同的另外一点就是他们的方向。楔形牛市旗形指向上方，而在牛市趋势顶部的形反转指向下方。在熊市趋势中的楔形回调指向下方，但是在熊市趋势中的楔形底部指向上方。当然，楔形旗形通常是非常小的模式，最多持续10到20根K线。因为他们是顺势的入场点，所以在形态上不需要苛求那么完美，许多形态只是非常神似但实际上并不是一个楔形，但他们只要有三次回调就够了。一次反转通常需要持续20根K线，同时也需要一根足以反转趋势的清晰的趋势通道线。","pid":"p387"},{"t":"para","text":"趋势的结束一般会以两浪结构的冲顶或探底的测试形态组成（在牛市趋势中会出现一波更比一波高，而在熊市趋势中会出现一波更比一波低的现象）。最开始的冲高或回落和这两波浪潮组成了一个三浪推进模式，虽然这个模式可以有很多名字，但也是一个非常容易辨别的反转形态。有些时候它可能会以楔形出现（在熊市趋势中出现的上升三角或者在熊市趋势中的下降三角），但大部分时候它并不是以这些形态出现。交易者通过画出这些形态之间的微妙差别是没有用的，因为他们看起来足够的相似以至于他们往往会做出相同的交易。为了简单起见，我们可以把这些三浪推进模式都看作是楔形，因为大部分他们在结束的时候都会有一个类似于形的高潮点。请记住，楔形也仅仅只是一个有着三浪推进的趋势通道，并且通常此时趋势线和趋势通道线会聚拢。在三浪推进模式中的趋势线和趋势通道线可以像楼梯形态那样是平行的，或者像楔形一样是聚拢的，也可以是像扩展的三角形那样是发散的。但这都没有关系，因为他们的表现是类似的，所以你可以做相同的交易。他们都是高潮，通常会呈现出抛物线的形态，尽管有些时候并不那么明显。举个例子，在一个牛市楔形中，如果连接第二波浪潮的顶部和第三波浪潮画出一条趋势通道线，它比连接前两波浪潮的高点而画的趋势通道线的斜率更陡峭，那么这个楔形就呈现出抛物线的形态。这是一种高潮的表现（我们将在后面的章节解释），如果市场反转向下，那么这个行为通常会持续两波下跌浪和10根K线。","pid":"p388"},{"t":"para","text":"当通道出现楔形的形态时，通常是因为市场上的紧迫情绪（如果它出现了抛物线型的楔形形态，那么则是因为非常紧迫的情绪），并且通常会带来高潮反转。举个例子，在楔形的顶部，趋势线的斜率一般会比趋势通道线的斜率要大。在趋势线上，顺势交易者会进入而逆势交易者会退出，而在趋势通道线上，则相反。所以如果趋势线的斜率更大，则意味着做多交易者在更小的回调上进入市场，而做空交易者在更小的抛售下退出市场。辨别形和线条平行的通道的第一个关键点在于第二波回调。一旦第二波向上的浪潮反转向下，交易者就可以画出一条趋势通道线，并用它来创建一条平行线。当他们将这条平行线拉到第一次回调的底部时，他们就可以得到一条趋势线和趋势通道。这些线将告诉做多交易者和做空交易者支撑位在何处，所以做多交易者将在支撑位买入，而做空交易者则会在支撑位平仓获利。然而，一旦做多交易者开始在支撑位之上买入，而做空交易者又过早地卖出了头寸。那么市场上将会在触碰趋势线之前就开始恢复上涨。不论买方还是卖方都会这么做的原因是，他们感觉到了紧迫性并且害怕市场不会再下跌到支撑位。这意味着两方力量都认为趋势线应该更陡峭一些，所以向上的趋势变得更加强劲。","pid":"p389"},{"t":"para","text":"一旦市场开始上涨，交易者将会重新绘制趋势线。与之前使用趋势通道线的平行线来绘制不同，这一次他们可以用最初两波回调的底部来绘制趋势线。这一次他们可以清楚地看到趋势线比趋势通道线更加陡，所以他们开始相信市场正在形成楔形，而这往往是一种反转的模式。交易者将会绘制与这条新的更陡峭的趋势线的平行线。并将它拖到第二波推动浪的顶部，以便及时发现市场形成的是更陡峭的平行通道而不是楔形。所有的交易者都会认真观察市场，看原来的趋势通道线中是否出现了反弹，或者是否出现了更新更陡的趋势线。如果在原来的通道线中出现了反弹，市场开始下跌，交易者会认为虽然在第二次回调的买入中市场上出现了很多的紧迫情绪。但是这种紧迫情绪并没有延续到第三波推动浪中。","pid":"p390"},{"t":"para","text":"做多交易者会在最初的更平缓的趋势通道线上获利，这意味着他们更早地离开了市场。做多交易者本来希望市场会反弹到更陡峭的趋势通道线中，但是现实却让他们失望了。做空交易者则在原来的趋势通道线上急于做空，因为他们害怕市场不会再到达一个更高，更陡的趋势通道线了。现在市场上做空交易者的情绪是紧迫的，而做多交易者的情绪则是害怕的。交易者们可以看到市场从楔形顶部开始的下跌并开始卖出，但是大部分的交易者会等待至少两波下跌浪，直到他们看到了明确的卖出或者买入信号才开始行动。","pid":"p391"},{"t":"para","text":"在市场测试完趋势的冲高或回落之后，趋势通常会出现反转。举个例子，当牛市趋势正处于强劲的上升状态时，做多交易者会以比之前更高的价格买入，因为他们相信市场还会有突破并且会上升到另一波高潮但是，如果这股牛市趋势减弱并且出现了更多的震荡行情，那么强劲的做多交易者将会把这些市场上的新高点作为获得利益的阵地，而不是像之前的做多的好时机，所以他们只会在市场出现回调时购买。随着卖盘压力的逐步建立，强劲的做空交易者将会在下一个新高处占据主导地位，所以他们会尽全力结束趋势的冲高。如果他们真的让市场进入了较为强劲的下跌状态中，交易者们将会仔细观察下一波反弹，他们想验证市场在经过一次回调之后再次反弹是否能够超越之前的高点。这次反弹可能会达到一个更低的高点，或者是相同的高点形成双重顶部，也可能是更高的高点。在市场达到大部分交易者的卖空价或者进入比之前的高点更高的高点时，他们将会买回头寸。然而，他们也知道市场可能会形成楔形顶部，所以如果在第二次高点之后的突破看起来不够强劲，他们将会再次卖空。","pid":"p392"},{"t":"para","text":"当市场震荡得特别厉害，并且第一波和第二波向下推动的浪潮并没有突破牛市趋势线或者移动平均线的底部，那么做空交易者将会认为向下反转的趋势正在减弱。然而，我们也必须注意到这两波下推浪代表了市场上的卖盘压力，这代表着做空交易者也可能会掌控市场。做空交易者知道，市场可能需要第三波上推浪来达到高潮和做空动能的耗尽。然而，他们也知道他们既然能在第二波上升浪的高点把市场拉下来，就也能再一次将市场从高点拉下来。做多交易者已经在第一波上升浪的高点获得了利益，并且也很快在第二波上升浪的高点之上再次获利。如果这波牛市趋势非常强劲，那么做多交易者就会在市场突破第一个高点时再次买入。所以如果市场上的交易者发现市场上出现了抛售，他们就会知道做多交易者并没有在突破处买入，而是通过抛售获取利益。这给了他们一个信号，即强劲的做多交易者也对市场会持续上涨失去了信心。","pid":"p393"},{"t":"para","text":"无论是做多交易者还是做空交易者都知道市场通常会在第三波上升浪后反转，所以他们需要市场在第二个高点后再次被强烈地突破，这可以使他们相信市场还没有到达顶部。他们把市场上的第二个高点看作是一个大的低点2形态的卖空入场形态。如果这个低点2形态失败了，市场突破低点2的势头强劲，那么接下来很可能会还有至少两波上升浪。如果突破不强劲，那么市场很可能会形成楔形顶部。突破第二个高潮的趋势往往是非常猛烈的，但是如果所有的交易者都认为它正在形成一个市场顶部而非突破时，这股趋势往往会急转而下。在第二个顶部之上的急剧突破很可能是因为市场的空头回补，而非强劲的做多交易者激烈做多的结果，一旦做多交易者没有跟进做多，交易者们将认为强劲的做多交易者将只会在市场出现深度回调时再次做多。如果强大的做多交易者退出了市场，那么做空交易者将在更大的信心支配下猛烈做空。如果他们的做空足以使市场跌得更快更深，那么在做多交易者寻找做多机遇之前还是会进行保护性的做空。由于市场上只有卖出所以会下跌得非常迅速，直到跌到了一个重新有买方入场的价格才会停止（在这个价格上做多交易者重新开始做多而做空交易者则收获盈利）。如果做多交易者利用他们的新头寸在一波没有突破楔形顶部的反弹上获利，那么市场接下来将会形成一个更低的高点，并且非常有可能会进入第二波下推浪。在这个更低的高点上，强劲的做空交易者将会再次做空，而强劲的做多交易者将会在此处进行多单平仓。所以由于这些卖出势力的影响，这里将会形成一个阻力区域。","pid":"p394"},{"t":"para","text":"市场反转得太快太急以至于覆盖了很多关键点，这代表了市场上每个人都有着紧迫感，这种紧迫的情绪会导致交易者无法快速地做出决策从而找到最好的进入时机。但是，如果交易者能够清楚地知道市场上正在发生的转变。他们就可以在趋势反转向下的早期就开始做空。虽然市场的下跌非常迅速。但是他们可以在第一波强劲的下跌浪和随后的更低的高点之后开始设置移动止损以确保本金安全。","pid":"p395"},{"t":"para","text":"大部分的三浪推进模式都会在超越趋势通道线之后反转，并且超越趋势通道线本身就可以单独成为进入市场的理由，即使这个模式最终呈现出来的并不是楔形。然而，三浪推进模式很少能看到超越趋势通道线，而这种模式的超越与其他类型的趋势通道线的失败是有区别的。三浪推进模式很少会呈现出完美的形态，所以你可能需要操纵趋势线和趋势通道线才能突出这部分形态。举二个例子，楔形形态的组成一般只考虑蜡烛或K线的主体，所以为了能够突出楔形的形状，在绘制趋势线和趋势通道线时你必须忽略他们的尾部。有些时候，楔形的结束点甚至都不会触及趋势通道线。如果在市场大幅移动之后出现一个三浪推动模式，你只需要放轻松，按照楔形的模式进行交易就好，即使这个模式看起来并不是那么完美的楔形。然而，一旦这种三浪推进模式超越了趋势通道线，那么在市场上进行反转交易的成功概率将会很高。此外，在大部分时候，当趋势通道线被突破时都会形成一个楔形的形态，但是因为突破已经如此明显，所以寻找这个形态已经没有什么意义了。如果这种模式已经非常强劲了，那么突破口的反转处将是进入市场的好时机。","pid":"p396"},{"t":"para","text":"永远记住，一个楔形反转就是一种反转趋势的入场形态。因此等待二次入场机会更加重要，比如说一个楔形顶部之后出现的一个更低的高点（也有可能会是在一波突破回调中出现的更高的高点从而带来卖空的时机）或者是一个在楔形底部之后出现的更高的低点（有时候，也有可能会是一个更低的低点）。所以楔形反转同楔形回调不一样的地方在于，在楔形回调中你进入市场是为了顺应市场原有的趋势，所以在市场上出现了第一个进入的信号时马上进入是更好的交易方法。通常在楔形反转中，如果你发现这个反转并没有你想象的那么强烈，那么在交易之前最好是等待第二个信号出现。如果第一个突破非常强劲，那么在回调时入场将有更大的概率成功。如果在市场的震荡区间出现了一个楔形反转，由于市场上没有趋势可以反转，所以它很可能在形态和表现上都更像是一个楔形回调。在这种情况下，抓住第一次入场信号将更有可能获利。","pid":"p397"},{"t":"para","text":"如果一次楔形反转带来了一次入场机会，但是随后反转失败了并且市场在这个形的高点处继续升高，市场通常移动的距离会接近这个楔形的高度。有的时候，在第一次反转失败之后，市场又创造了第二次反转趋势的时机：当这个发生时，反转的趋势一般会持续（持续至少10根K线）并且至少会伴随两波浪潮。这个新高点开始的反转可以被看作是一次突破趋势的回调。举一个例子来说，如果有一个楔形的项部开始反转向下但是却失败了，于是牛市趋势复苏并且达到了新高，紧接着市场在新高点处再一次反转向下，那么这次的新高就是一次在形顶部之下的第一次回调后从更高点开始的回调。","pid":"p398"},{"t":"para","text":"当楔形反转失败时，市场会到达新高或者新低，你可以看看市场是否会在这第四次推动浪中反转。有时候，在大部分的交易者眼中，看起来像是第四次的推动浪其实只是第三波推动浪。这是因为，如果在第一次推动浪的回调过后，市场创造了一次异常强劲的二次推动浪，那么许多交易者就会忽视前面的推动浪，把第二次推动浪当成是第一波推动浪，结果就是许多交易者不会在第三次推动浪过后期待反转，相反他们会等待第四波推动浪。只有在事后，我们才能看到交易者重新开始计算推动浪是否是明智的，但是只要你是在交易之中，你就永远无法确保接下来会发生什么事情。第二波推动浪越强，那么市场上的交易者重新开始计算推动浪的概率就越高，那么市场上出现第四波推动浪的概率也就越高。","pid":"p399"},{"t":"para","text":"在新趋势的第一波浪潮过后，市场上对于之前的趋势的高点或低点的检验往往会形成形，但是从第一波浪潮开始形成的楔形回调不一定会超越之前的高点或低点。不管是哪一种情况，交易者都应该在楔形回调沿着新的趋势的方向反转时，进入新的趋势（比如，在一个新的牛市趋势中，楔形回调可能形成更高的低点也可能形成更低的高点）。","pid":"p400"},{"t":"para","text":"如果市场在开盘的第一个小时就形成了趋势。通常接下来会持续几个小时的震荡区间。然后在收盘时趋势才会复苏。在这个震荡区间通常会有三浪推动模式出现，但通常不会是形的形状。举一个例子，在一个熊市趋势复苏的一天，这个震荡区域通常会形成一个略微倾斜向上的熊市通道，它可能会有三浪推动但并不是楔形的形状。不论你叫它是低点3的卖出形态或者是楔形都没有关系，但是你必须知道这一天的收盘时很可能会发生熊市趋势的复苏，而这个三浪推进，略微的反弹将会是你卖空的最好时机。把它看作楔形是因为它趋势有三浪推动，并且通常会超越趋势通道线。有时候，它确实呈现出来的是楔形的形态，此时你只需要按照楔形来进行交易就好。请记住，如果你不去苛求所有的形态的完美，那么你就已经是一个好的交易者了。","pid":"p401"},{"t":"para","text":"如果一个模式除了三浪还有很多的推动浪，并且每一次突破都很小，那么除了是一个楔形之外，它还是一个收缩的楼梯模式。举个例子，如果在牛市趋势中有三次推动向上的浪潮，并且第二波推动浪在第一波浪潮的10个价外之上，而第三波推动浪则在第二波浪潮7个价位之上，那么这就是一个收缩的楼梯模式。这个迹象表明动能正在减退，并且出现两浪反转的概率将会增加。做多交易者将会立即获得利益而做空交易者将会以更快的速度做空，因为他们相信市场不会再出现这样爆发式的突破了。有时候在较为强劲的趋势中也会出现第四波或者第五波的推动浪，但是因为市场上的动能正在衰减，此时采取反转交易也是可行的。相反，如果第三波推动浪明显强过第二波，并且之后市场趋势反转，那么第三波推动浪很可能会超越趋势通道线并且成为反转的起点。如果楔形顶部形态在发出反转交易的入场信号之后，市场的下跌走势并不能持续，原有上涨趋势又开始恢复并且价格突破了楔形顶部，那么这个反转形态就宣告失败了。举个例子，试想一个楔形顶部，市场在信号K线处开始下跌从而带来了一次空单入场时机，但是紧接而来的是一波突破形顶部的反弹，那么这个楔形顶部就是失败了。当交易者不能确定第二波上涨的推动浪是否足够强大到需要重新计算推动浪时，他们将耐心观察顶部的突破是否正是之后出现的第三波推动浪。当楔形形态已经十分明显时，许多交易者一般会认为楔形顶部形态基本形成，空单入场，直到价格触及楔形顶部上方的止损位才会反手做多。当一个形顶部成功时，首要目标就是测试这根楔形的底部，其次才是进一步下探，幅度一般是从楔形顶部到底部的距离。而当一个形顶部失败时，首要目标则是测试新高，市场向上移动的距离也差不多是这个楔形的高度。请记住，楔形一般是震荡区域，所以它的表现也类似于区间震荡形态，但同时它也是价格突破形态的所在。不论突破是向上还是向下，我们只要记住市场移动的距离往往会等于楔形的高度。当然。只要是突破就有可能会失败。比如之前提到的，如果一个楔形顶部带来了空单入场机会，但是市场迅速反弹并超越了楔形顶部，那么这个顶部就失败了。然而，即使是市场突破了楔形顶部也有可能会失败。如果这个突破很强烈，那么紧随其后的可能是一段可以被测出的上升浪潮。如果它并不强烈，那么它很可能会失败，市场将再次反转向下，那么相对于原来向下的楔形底部突破，这段高于形顶部的牛市突破不过是一次形成更高的高点的回调。","pid":"p402"},{"t":"para","text":"在Emini的期货合约交易中，如果在一个楔形顶部后出现了一个短暂的抛售潮，那么这股回调经常会以一个精确的价位来测试这个楔形的顶部，从而形成一个完美的双重顶部。如果市场再次反转向下，将会形成二次入场的卖空时机。在SPY和许多股票的交易中，有时候市场的回调会在楔形顶部之上的几个价位开始，但是交易者并不认为这是楔形顶部的失败。然而，一旦出现上述情况，这表明市场上的交易者正在积极买入，并且他们正在等待市场上出现更强劲的上升浪，所以不会再期待会有市场顶部的出现。所以一旦市场在楔形顶部之上的几个价位处开始回调，你应该立即买入头寸，抓住这稍纵即逝的机遇。大部分失败的楔形顶部都是非常陡峭和紧密的，并且通常会发生在强劲的牛市趋势中。在牛市趋势非常强劲的情况下，一般会形成被超越的趋势通道线和三浪推动模式，在这些推动浪之间的回调会比较小，而推动浪一般会比较强劲。一般来说，在强劲的趋势中寻找反转的机遇是错误的，因为大部分的反转尝试都是失败的。所以你不应该把所有可能的形状都看成是潜在的楔形顶部，而是应该在每一次新高后开始的回调处寻找买机。此外，在强劲的牛市趋势中的楔形顶部通常会将两浪横盘震荡走势修正回市场上的移动平均线处，从而形成了一个高点2的买入信号。而这是一个非常可靠的入场信号。一个修正了市场横盘的楔形往往意味着这股趋势非常强劲。而对于楔形底部来说，则刚好相反。所有的突破都可能会失败。举个例子来说，如果一个形顶部带来了空单入场机会，但是市场迅速反弹并超越了楔形顶部。那么这个顶部就失败了。然而，即使是市场突破了楔形顶部也有可能会失败。如果这个突破很强烈，那么紧随其后的可能是一段可以被测出的上升潮。如果它并不强烈，那么它很可能会失败，市场将再次反转向下，那么相对于楔形之下的第一次突破，这段高于楔形顶部的牛市突破不过是一次形成更高的高点的回调。","pid":"p403"},{"t":"para","text":"当市场上的交易者太急于逆势交易，不再等待趋势线出现明显的突破和反转趋势的力量出现，就在第一波较小的三浪推进模式时进行逆势交易，楔形往往会失败。单独的三浪推进模式，特别是这个模式较小时，如果之前没有发生趋势线的突破或者主要趋势通道被超越或者反转时，它很难单独反转趋势。如果通道非常狭窄，即使出现了楔形，也最好不要在此时开始反向操作。相反，你需要做的是等待真正的反转发生，并且看看反转的突破有多强劲。如果突破确实非常强劲，那么你只需要同其他的突破一样进行交易即可。在趋势的突破后出现的暂时的回调时间，是进入市场进行逆向交易的最好时机，但是如果突破非常强劲没有出现回调，那么交易者一般会在K线的收盘处或者市场的尾端进入市场。如果这次突破比较微弱，那么交易者会认为突破将会失败，所以他们会寻找新的通道继续原来的交易。所以他们会沿着楔形通道的方向入场而不再寻求反趋势交易的机会。举个例子，如果在一个熊市趋势中出现了一个楔形底部，但是向上的突破非常微弱，交易者将会在由这个失败的向上突破形成的低点1和低点2处卖空，而这个点也是许多逆趋势交易者亏损的地方。","pid":"p404"},{"t":"para","text":"楔形通常是开盘反转模式。开盘反转会带来市场在最初的一个小时里剧烈的波动，而且有时候会出现非常的楔形，这个楔形在前两波推动浪之后出现的暂停点都非常轻微，但市场会在一天里剩余的时间内突然反转。最初的暂停点可能会是一个最后旗形，然后在第二次推动浪后也可能会出现一个更小形态的最后旗形。即使在一两个小时之后。你可能也无法从这样的一个陡峭而紧凑的楔形中看到反转，但这些楔形确实是非常可靠的开盘反转形态。","pid":"p405"},{"t":"para","text":"一个微型的楔形形态是由三根连续的K线，或者4到5根连续的K线中任意3根K线组成的。由于这个模式是如此微小，所以它经常会带来市场微弱的调整。通常这些K线也会有尾部，并且通过连接这些K线的尾部可以画出一条微型的趋势通道线，通常在更小的时间图上，比如1分钟的K线图上你可以看到一个清晰的楔形。举个例子，在一个持续下跌的市场上，出现了一根有着中等的尾部的熊市趋势线，之后出现的熊市趋势线有着更低的低点和明显的尾部，随后是第三根K线，依然是更低的低点和尾部，这三根K线就组成了一个微小的楔形反转形态。如果市场的下跌劲头猛烈，你就不应该在第三根K线的高点上方买入，因为这很可能会带来你的损失。如果这个微小的楔形形态是在震荡区间的底部附近形成的，同时第三根K线是一根牛市反转K线。那么这将是你进行买入的刮头皮交易的好时机。","pid":"p406"},{"t":"para","text":"有一种很特殊的楔形虽然也是三浪推进模式，但是却没有楔形的形态，知道这一点也很重要，因为它也是一个非常可信的突破形态。如果市场正处于震荡区间，出现了一个一跳突破超越了小幅波动的高点或低点，并且反转了大约3到20根K线后，又出现了一个一跳突破或者二跳突破再次将市场拉回，那么这三股推动浪也构成了这种非楔形的三浪推进模式。如果市场再次超越第二次的小突破，那么这次突破通常会较为显著，并且使得市场移动相当于这个模式的高度的距离。我们可以把这三浪推动看作是一个楔形，随后，由于没有带来反转，这个楔形失败了。同所有其他的失败的楔形一样，市场通常会被突破，并且移动大约这个楔形的高度的距离。有的时候，市场的突破会在仅仅超越一跳突破后失败。","pid":"p407"},{"t":"para","text":"当双重顶部或者双重底部突破失败时，也会形成类似于楔形的模式。举个例子，如果市场上有一个双重顶部，并且在市场超越了双重顶部之后，又回调了数根K线，那么这个形态也可以看作是一个楔形顶部（一个楔形也是一种形态的三角形，所以有些交易者也会把这个叫作三角形）。在这个形态中，到达双重顶部的两波上升浪是前两波推动浪，而突破双重顶部的浪潮是第三股推动浪。如果市场反转向下，那么下跌的时间通常也足够进行一次刮头皮交易。一次双重顶部也可以看作是一个震荡区域，所以双重顶的突破失败也就是震荡区域的突破失败，所以通常在这之后会跟随更多的横向盘整交易。通常市场下跌的时间是足够进行一次刮头皮交易的，之后市场通常会在震荡区域的另一侧快速突破，并且向下移动大约这个震荡区域的高度的距离。在这种情况下，在突破时买入但在反转时停止买入的做多交易者，只有在市场出现了显著的回调之后才会再次买入。","pid":"p408"},{"t":"img","src":"assets/img/p1c5_001.webp","ctx":[{"t":"有一种很特殊的楔形虽然也是三浪推进模式，但是却没有楔形的形态，知道这一点也很重要，因为它也是一个非常可信的突破形态。如果市场正处于震荡区间，出现了一个一跳突破超越了小幅波动的高点或低点，并且反转了大约3到20根K线后，又出现了一个一跳突破或者二跳突破再次将市场拉回，那么这三股推动浪也构成了这种非楔形的三浪推进模式。如果市场再次超越第二次的小突破，那么这次突破通常会较为显著，并且使得市场移动相当于这个模式的高度的距离。我们可以把这三浪推动看作是一个楔形，随后，由于没有带来反转，这个楔形失败了。同所有其他的失败的楔形一样，市场通常会被突破，并且移动大约这个楔形的高度的距离。有的时候，市场的突破会在仅仅超越一跳突破后失败。","p":"p407"},{"t":"当双重顶部或者双重底部突破失败时，也会形成类似于楔形的模式。举个例子，如果市场上有一个双重顶部，并且在市场超越了双重顶部之后，又回调了数根K线，那么这个形态也可以看作是一个楔形顶部（一个楔形也是一种形态的三角形，所以有些交易者也会把这个叫作三角形）。在这个形态中，到达双重顶部的两波上升浪是前两波推动浪，而突破双重顶部的浪潮是第三股推动浪。如果市场反转向下，那么下跌的时间通常也足够进行一次刮头皮交易。一次双重顶部也可以看作是一个震荡区域，所以双重顶的突破失败也就是震荡区域的突破失败，所以通常在这之后会跟随更多的横向盘整交易。通常市场下跌的时间是足够进行一次刮头皮交易的，之后市场通常会在震荡区域的另一侧快速突破，并且向下移动大约这个震荡区域的高度的距离。在这种情况下，在突破时买入但在反转时停止买入的做多交易者，只有在市场出现了显著的回调之后才会再次买入。","p":"p408"},{"t":"如图5.1所示。60分钟的Emini K线图上先出现了一个形反转顶部，然后是一波楔形回调将市场带到了更低的高点或者双重顶部，之后是两波下跌浪直达K线20处。","p":"p409"},{"t":"楔形不一定需要具备完美的形状才是有效的。举个例子来说，在图上趋势通道线是非常贴合K线6和K线10的高点的，但是K线8的高点却超越了这条通道线。你还可以看到，市场从K线10到K线12处的下跌，同样形成的是一个形态并不完美的楔形熊市旗形。同样，K线11的开盘价和之后的K线13和K线14一起形成了三股推动浪，但是其中的高点略微低于K线10的高点。但是不论你把它叫作是双重顶或者是一个更低的高点都不重要，真正重要的是你看到了这三股推动浪和之后的反转潮。","p":"p410"},{"t":"当市场加速上涨至K线4处，且在K线4和K线6之间形成了一个陡峭的通道时，市场上确实形成了一个急速且陡峭的牛市趋势。从K线3的低点处至K线6形成的通道如此紧凑，所以这股趋势非常强劲。在K线7处的回调被K线20的卖出潮检验了。图上的牛市通道有明显的三股推动浪潮和楔形的形态，这在趋势和通道的模式中非常常见。","p":"p411"},{"t":"如果一个三浪推动模式太过于陡峭，那么通常来说这不是一个非常好的反转形态，除非在最开始的一个小时它能够带来开盘反转。","p":"p412"}]},{"t":"para","text":"如图5.1所示。60分钟的Emini K线图上先出现了一个形反转顶部，然后是一波楔形回调将市场带到了更低的高点或者双重顶部，之后是两波下跌浪直达K线20处。","pid":"p409"},{"t":"para","text":"楔形不一定需要具备完美的形状才是有效的。举个例子来说，在图上趋势通道线是非常贴合K线6和K线10的高点的，但是K线8的高点却超越了这条通道线。你还可以看到，市场从K线10到K线12处的下跌，同样形成的是一个形态并不完美的楔形熊市旗形。同样，K线11的开盘价和之后的K线13和K线14一起形成了三股推动浪，但是其中的高点略微低于K线10的高点。但是不论你把它叫作是双重顶或者是一个更低的高点都不重要，真正重要的是你看到了这三股推动浪和之后的反转潮。","pid":"p410"},{"t":"para","text":"当市场加速上涨至K线4处，且在K线4和K线6之间形成了一个陡峭的通道时，市场上确实形成了一个急速且陡峭的牛市趋势。从K线3的低点处至K线6形成的通道如此紧凑，所以这股趋势非常强劲。在K线7处的回调被K线20的卖出潮检验了。图上的牛市通道有明显的三股推动浪潮和楔形的形态，这在趋势和通道的模式中非常常见。","pid":"p411"},{"t":"para","text":"如果一个三浪推动模式太过于陡峭，那么通常来说这不是一个非常好的反转形态，除非在最开始的一个小时它能够带来开盘反转。","pid":"p412"},{"t":"img","src":"assets/img/p1c5_002.webp","ctx":[{"t":"当市场加速上涨至K线4处，且在K线4和K线6之间形成了一个陡峭的通道时，市场上确实形成了一个急速且陡峭的牛市趋势。从K线3的低点处至K线6形成的通道如此紧凑，所以这股趋势非常强劲。在K线7处的回调被K线20的卖出潮检验了。图上的牛市通道有明显的三股推动浪潮和楔形的形态，这在趋势和通道的模式中非常常见。","p":"p411"},{"t":"如果一个三浪推动模式太过于陡峭，那么通常来说这不是一个非常好的反转形态，除非在最开始的一个小时它能够带来开盘反转。","p":"p412"},{"t":"如图5.2所示，在三推模式的K线11到K线12处，市场急速反弹，尽管这个通道十分狭窄，但是它依然是一个抛物线形态的楔形开盘反转。K线12打破了K线8和K线10形成的双重顶部，并且紧随其后的是一根熊市内含K线。K线12不仅是相对于上一个双重顶的一次失败的突破，同时与上一个双重顶的任一顶部都可以组成另外一个双重顶。今天的市场价格反弹到了昨天卖方多次入场的价格处，我们有理由相信市场还会继续回到昨天震荡区域的顶部。","p":"p413"},{"t":"在市场的震荡区间，不要仅仅只关注突破点。对于空头来说，在震荡区间的顶部做空，并且设置的止损幅度比突破失败的K线下方低一个点位比较合适。对于多头来说，在震荡区间的底部做多，并且设置的止损幅度比突破失败的K线之上高出一个点位比较合适。任何超越波动高点和低点的突破口都预示着市场上力量的加剧，所以是一次潜在的交易机会，即使这些突破也构成了趋势反转的一部分。在图中的这两天能够找到许多失败的突破和反转，包括趋势通道线和趋势通道线的突破的失败。","p":"p414"},{"t":"K线2、3、6也代表着收缩的楼梯模式，这也是一种较明显的反转模式。当然，你也可以叫它楔形，因为它也有三波向上的推动浪（K线2和K线3是最初的两波上升浪，从K线4开始的是第三波上升浪）。在这个收缩的楼梯中，第二次的突破力度要小于第一次的突破，这意味着市场上动能的衰减。我们可以看到图中，K线3大约比K线2高出19个点位，但是K线6只比K线3高出12个点位。每当出现了收缩的楼梯模式时，此时的反转交易更容易成功，并且通常会在强劲的趋势中马上出现两波回调浪。","p":"p415"},{"t":"K线4和K线7形成了一个双重底部，并且K线9是在底部之下的一个突破。K线4和K线7是两波下跌浪，K线9是第三波下跌浪，随后市场出现反转向上，因此你也可以把它看成是一个不太标准的楔形底部。。","p":"p416"}]},{"t":"para","text":"如图5.2所示，在三推模式的K线11到K线12处，市场急速反弹，尽管这个通道十分狭窄，但是它依然是一个抛物线形态的楔形开盘反转。K线12打破了K线8和K线10形成的双重顶部，并且紧随其后的是一根熊市内含K线。K线12不仅是相对于上一个双重顶的一次失败的突破，同时与上一个双重顶的任一顶部都可以组成另外一个双重顶。今天的市场价格反弹到了昨天卖方多次入场的价格处，我们有理由相信市场还会继续回到昨天震荡区域的顶部。","pid":"p413"},{"t":"para","text":"在市场的震荡区间，不要仅仅只关注突破点。对于空头来说，在震荡区间的顶部做空，并且设置的止损幅度比突破失败的K线下方低一个点位比较合适。对于多头来说，在震荡区间的底部做多，并且设置的止损幅度比突破失败的K线之上高出一个点位比较合适。任何超越波动高点和低点的突破口都预示着市场上力量的加剧，所以是一次潜在的交易机会，即使这些突破也构成了趋势反转的一部分。在图中的这两天能够找到许多失败的突破和反转，包括趋势通道线和趋势通道线的突破的失败。","pid":"p414"},{"t":"para","text":"K线2、3、6也代表着收缩的楼梯模式，这也是一种较明显的反转模式。当然，你也可以叫它楔形，因为它也有三波向上的推动浪（K线2和K线3是最初的两波上升浪，从K线4开始的是第三波上升浪）。在这个收缩的楼梯中，第二次的突破力度要小于第一次的突破，这意味着市场上动能的衰减。我们可以看到图中，K线3大约比K线2高出19个点位，但是K线6只比K线3高出12个点位。每当出现了收缩的楼梯模式时，此时的反转交易更容易成功，并且通常会在强劲的趋势中马上出现两波回调浪。","pid":"p415"},{"t":"para","text":"K线4和K线7形成了一个双重底部，并且K线9是在底部之下的一个突破。K线4和K线7是两波下跌浪，K线9是第三波下跌浪，随后市场出现反转向上，因此你也可以把它看成是一个不太标准的楔形底部。。","pid":"p416"},{"t":"img","src":"assets/img/p1c5_003.webp","ctx":[{"t":"K线2、3、6也代表着收缩的楼梯模式，这也是一种较明显的反转模式。当然，你也可以叫它楔形，因为它也有三波向上的推动浪（K线2和K线3是最初的两波上升浪，从K线4开始的是第三波上升浪）。在这个收缩的楼梯中，第二次的突破力度要小于第一次的突破，这意味着市场上动能的衰减。我们可以看到图中，K线3大约比K线2高出19个点位，但是K线6只比K线3高出12个点位。每当出现了收缩的楼梯模式时，此时的反转交易更容易成功，并且通常会在强劲的趋势中马上出现两波回调浪。","p":"p415"},{"t":"K线4和K线7形成了一个双重底部，并且K线9是在底部之下的一个突破。K线4和K线7是两波下跌浪，K线9是第三波下跌浪，随后市场出现反转向上，因此你也可以把它看成是一个不太标准的楔形底部。。","p":"p416"},{"t":"如图5.3所示，在图中收缩的楼梯形态中，每一次的突破的幅度都会小于前一次的突破，这意味着市场上动能的衰减，并且预示了进行反向交易获利的机会即将来临了。在K线4这一平阶之后。出现了一波持续到K线5的上升浪，这打破了之前的趋势线，接下来市场可能会测试低点并且迎来两波反弹浪（在K线6处出现了两根K线的反转和更低的低点之后，确实出现了两波反弹浪）。市场上动能的衰减就是趋势减弱的信号，趋势变得更加震荡，从而更有可能会演变成区间震荡，正如图中所示。","p":"p417"},{"t":"从K线3到K线5形成了一个微型的形熊市旗形。第一波上升的推浪是在K线4的更低的低点处形成的，这也是常见的一种楔形形态的变体。之后上升到K线5的上升浪中出现了另外两波微小的助推浪。K线4是一个形态非常好的最后旗形，非常适合进行刮头皮交易，之后整个形态演变成更大的最后旗形形态，并在K线5处结束（一个楔形），这样的形态演变也是非常常见的。","p":"p418"},{"t":"如果在第一次下推浪的回调后市场出现了强劲的突破，那么交易者将会疑惑感，市场是会按照常规再出现两波推浪，还是说动能已经足够强劲他们需要重新计算第一次推浪呢？举个例子来说，如果K线3就是第三波下推浪，但是K线2处的下跌非常强劲。你是否需要重新从K线2处开始计算下跌浪呢？事后来看的话，答案当然会非常清楚，你是需要的，但是如果你在交易时，你并不能确定这个答案。下跌的动能越强，市场上的交易者重新计算下跌浪的可能性就越大，那么就越有可能会出现第四次下推浪。其实如果你从K线2处的加速下推浪开始计算，在图中下跌到K线4处的第四波浪潮不过是楔形底部的第三波下推浪。","p":"p419"},{"t":"一旦K线6从下方突破了K线4处的楔形底部，那么楔形底部就失效了。K线6同其他的突破并没有什么不同。K线6之后立刻出现了一根牛市反转K线，与K线6一起组成了一个两根K线的反转形态从而导致了K线6的突破失败。一些交易者把这次买入入场信号看作是一个更低的低点的主要趋势反转，还有一些交易者会把这个看作是从K线4的楔形底部的上沿突破后回调的一个更低的低点。K线6同时还是一个收缩的楼梯形态中的买入时点，或者一次震荡区域底部的失败突破，最后，你还可以把它看作是一个最后旗形反转（在K线6之前有二个两根K线组成的熊市旗形）。不管你怎样认为，这些都是充分的理由支持你在K线6之后的牛市K线上方建立多单。","p":"p420"}]},{"t":"para","text":"如图5.3所示，在图中收缩的楼梯形态中，每一次的突破的幅度都会小于前一次的突破，这意味着市场上动能的衰减，并且预示了进行反向交易获利的机会即将来临了。在K线4这一平阶之后。出现了一波持续到K线5的上升浪，这打破了之前的趋势线，接下来市场可能会测试低点并且迎来两波反弹浪（在K线6处出现了两根K线的反转和更低的低点之后，确实出现了两波反弹浪）。市场上动能的衰减就是趋势减弱的信号，趋势变得更加震荡，从而更有可能会演变成区间震荡，正如图中所示。","pid":"p417"},{"t":"para","text":"从K线3到K线5形成了一个微型的形熊市旗形。第一波上升的推浪是在K线4的更低的低点处形成的，这也是常见的一种楔形形态的变体。之后上升到K线5的上升浪中出现了另外两波微小的助推浪。K线4是一个形态非常好的最后旗形，非常适合进行刮头皮交易，之后整个形态演变成更大的最后旗形形态，并在K线5处结束（一个楔形），这样的形态演变也是非常常见的。","pid":"p418"},{"t":"para","text":"如果在第一次下推浪的回调后市场出现了强劲的突破，那么交易者将会疑惑感，市场是会按照常规再出现两波推浪，还是说动能已经足够强劲他们需要重新计算第一次推浪呢？举个例子来说，如果K线3就是第三波下推浪，但是K线2处的下跌非常强劲。你是否需要重新从K线2处开始计算下跌浪呢？事后来看的话，答案当然会非常清楚，你是需要的，但是如果你在交易时，你并不能确定这个答案。下跌的动能越强，市场上的交易者重新计算下跌浪的可能性就越大，那么就越有可能会出现第四次下推浪。其实如果你从K线2处的加速下推浪开始计算，在图中下跌到K线4处的第四波浪潮不过是楔形底部的第三波下推浪。","pid":"p419"},{"t":"para","text":"一旦K线6从下方突破了K线4处的楔形底部，那么楔形底部就失效了。K线6同其他的突破并没有什么不同。K线6之后立刻出现了一根牛市反转K线，与K线6一起组成了一个两根K线的反转形态从而导致了K线6的突破失败。一些交易者把这次买入入场信号看作是一个更低的低点的主要趋势反转，还有一些交易者会把这个看作是从K线4的楔形底部的上沿突破后回调的一个更低的低点。K线6同时还是一个收缩的楼梯形态中的买入时点，或者一次震荡区域底部的失败突破，最后，你还可以把它看作是一个最后旗形反转（在K线6之前有二个两根K线组成的熊市旗形）。不管你怎样认为，这些都是充分的理由支持你在K线6之后的牛市K线上方建立多单。","pid":"p420"},{"t":"img","src":"assets/img/p1c5_004.webp","ctx":[{"t":"如果在第一次下推浪的回调后市场出现了强劲的突破，那么交易者将会疑惑感，市场是会按照常规再出现两波推浪，还是说动能已经足够强劲他们需要重新计算第一次推浪呢？举个例子来说，如果K线3就是第三波下推浪，但是K线2处的下跌非常强劲。你是否需要重新从K线2处开始计算下跌浪呢？事后来看的话，答案当然会非常清楚，你是需要的，但是如果你在交易时，你并不能确定这个答案。下跌的动能越强，市场上的交易者重新计算下跌浪的可能性就越大，那么就越有可能会出现第四次下推浪。其实如果你从K线2处的加速下推浪开始计算，在图中下跌到K线4处的第四波浪潮不过是楔形底部的第三波下推浪。","p":"p419"},{"t":"一旦K线6从下方突破了K线4处的楔形底部，那么楔形底部就失效了。K线6同其他的突破并没有什么不同。K线6之后立刻出现了一根牛市反转K线，与K线6一起组成了一个两根K线的反转形态从而导致了K线6的突破失败。一些交易者把这次买入入场信号看作是一个更低的低点的主要趋势反转，还有一些交易者会把这个看作是从K线4的楔形底部的上沿突破后回调的一个更低的低点。K线6同时还是一个收缩的楼梯形态中的买入时点，或者一次震荡区域底部的失败突破，最后，你还可以把它看作是一个最后旗形反转（在K线6之前有二个两根K线组成的熊市旗形）。不管你怎样认为，这些都是充分的理由支持你在K线6之后的牛市K线上方建立多单。","p":"p420"},{"t":"如图5.4所示，SPY的日交易图中，市场在2000年的三月触顶，之后经过了三次反弹浪到达了一个更低的高点K线8处。K线8和K线2也形成了一个双重顶形态的熊市旗形（虽然K线8略微超过了K线2的高点）。K线8没有触碰到图中虚线的熊市趋势通道线。在这个楔形熊市旗形后面紧随着一波强劲的下跌趋势（原文是上涨趋势，疑为笔误译者注）。在这个楔形熊市旗形刚刚形成的时候，我们还无法判断趋势是否会反转，但是我们可以判断的是，在三波上升至K线1的上推浪之后，市场上很可能会出现至少两波下推浪。下跌到K线3处的下跌浪是第一波下推浪，上升至K线8处的上涨浪是反弹浪，那么市场还将面临第二波下推浪。","p":"p421"},{"t":"虽然在更高的时间图上，大部分牛市趋势之后出现的区间震荡仅仅只是牛市旗形，但是震荡区间确实很容易发生趋势反转。在市场确定趋势方向之前通常会经历一段时间的区间震荡。当市场从K线8处开始下跌时，市场很可能会在之前的震荡区间的底部也就是K线3的低点处形成支撑位。然而，突破K线3的下跌浪时如此迅猛以至于我们可以清楚地知道市场的形势变化，市场上已经没有足够的买方力量支撑，所以市场只能进一步下跌直到重新出现买方力量。在图中我们可以看到，直到2003年初，市场上出现了双重底形态的反弹和低点逐渐升高的主要趋势反转，主要的做多交易者才重回市场。","p":"p422"}]},{"t":"para","text":"如图5.4所示，SPY的日交易图中，市场在2000年的三月触顶，之后经过了三次反弹浪到达了一个更低的高点K线8处。K线8和K线2也形成了一个双重顶形态的熊市旗形（虽然K线8略微超过了K线2的高点）。K线8没有触碰到图中虚线的熊市趋势通道线。在这个楔形熊市旗形后面紧随着一波强劲的下跌趋势（原文是上涨趋势，疑为笔误译者注）。在这个楔形熊市旗形刚刚形成的时候，我们还无法判断趋势是否会反转，但是我们可以判断的是，在三波上升至K线1的上推浪之后，市场上很可能会出现至少两波下推浪。下跌到K线3处的下跌浪是第一波下推浪，上升至K线8处的上涨浪是反弹浪，那么市场还将面临第二波下推浪。","pid":"p421"},{"t":"para","text":"虽然在更高的时间图上，大部分牛市趋势之后出现的区间震荡仅仅只是牛市旗形，但是震荡区间确实很容易发生趋势反转。在市场确定趋势方向之前通常会经历一段时间的区间震荡。当市场从K线8处开始下跌时，市场很可能会在之前的震荡区间的底部也就是K线3的低点处形成支撑位。然而，突破K线3的下跌浪时如此迅猛以至于我们可以清楚地知道市场的形势变化，市场上已经没有足够的买方力量支撑，所以市场只能进一步下跌直到重新出现买方力量。在图中我们可以看到，直到2003年初，市场上出现了双重底形态的反弹和低点逐渐升高的主要趋势反转，主要的做多交易者才重回市场。","pid":"p422"},{"t":"img","src":"assets/img/p1c5_005.webp","ctx":[{"t":"如图5.4所示，SPY的日交易图中，市场在2000年的三月触顶，之后经过了三次反弹浪到达了一个更低的高点K线8处。K线8和K线2也形成了一个双重顶形态的熊市旗形（虽然K线8略微超过了K线2的高点）。K线8没有触碰到图中虚线的熊市趋势通道线。在这个楔形熊市旗形后面紧随着一波强劲的下跌趋势（原文是上涨趋势，疑为笔误译者注）。在这个楔形熊市旗形刚刚形成的时候，我们还无法判断趋势是否会反转，但是我们可以判断的是，在三波上升至K线1的上推浪之后，市场上很可能会出现至少两波下推浪。下跌到K线3处的下跌浪是第一波下推浪，上升至K线8处的上涨浪是反弹浪，那么市场还将面临第二波下推浪。","p":"p421"},{"t":"虽然在更高的时间图上，大部分牛市趋势之后出现的区间震荡仅仅只是牛市旗形，但是震荡区间确实很容易发生趋势反转。在市场确定趋势方向之前通常会经历一段时间的区间震荡。当市场从K线8处开始下跌时，市场很可能会在之前的震荡区间的底部也就是K线3的低点处形成支撑位。然而，突破K线3的下跌浪时如此迅猛以至于我们可以清楚地知道市场的形势变化，市场上已经没有足够的买方力量支撑，所以市场只能进一步下跌直到重新出现买方力量。在图中我们可以看到，直到2003年初，市场上出现了双重底形态的反弹和低点逐渐升高的主要趋势反转，主要的做多交易者才重回市场。","p":"p422"},{"t":"在图5.5道琼斯工业平均指数的日交易图上，市场价格向下跌破了牛市趋势线之后，形成了楔形熊市旗形中的更低的高点，并且直接导致了1987的大崩盘。下跌到K线6的下跌浪非常强劲，并且完美地打破了趋势线和移动平均线。有些交易者把K线5之后的反弹浪看成是这个楔形熊市旗形的第一波上推浪，而第三波和第三波上推浪可以是上升至K线7的三波上升浪中的任意两波。也有交易者会把K线7看成是一个有着更低的高点的两浪反转模式，因此也是一个低点2的卖空入场形态，两浪反转模式的第一波浪潮就是从K线5开始的反弹浪。甚至有交易者会把上升至K线7的三波上推浪看作是跟随在从K线6开始的微型上升浪后的微型通道。大部分交易者都会看到上述所有的因素，但是他们会根据自己的意见选择立场。","p":"p423"},{"t":"K线1是楔形牛市旗形的第一波下推浪。在之后出现了两波下推浪和一次小突破后，形成了一波直达K线3的回调浪，并且在K线3处形成了更高的低点突破。许多交易者把K线3和之前楔形牛市旗形的底部看成是一个双重底部的牛市旗形。但一般来说拥有头肩顶形态的楔形牛市旗形很容易失败，正如图中K线3所示。","p":"p424"},{"t":"在K线1的卖空潮之前的反弹浪中有四小波上推浪完美地证明了单独的三浪推动并不会创造反转的入场信号。当三浪推动出现在狭窄的牛市通道中时，出现第四波或者第五波上推浪的概率要比趋势反转的概率大得多。在通道最后上升至K线4之前也有三波上推浪，同样也是在狭窄的牛市通道中。当通道狭窄的时候，做空交易者不能马上在第三波上推浪后的反转潮中做空。他们应该再多等一会，看看市场上的向下突破会有多强劲。","p":"p425"},{"t":"K线5有力地打破了牛市通道和牛市通道线，所以交易者将在这个突破点回调的时候寻找做空的机会。K线7处形成了一个更低的高点，它同K线5之后的小反弹浪一起形成了一个双重顶。在牛市趋势中大部分的区间震荡最后都变成了牛市旗形，并且从更高的时间图上看，这些震荡区间不过只是小型的回调而已。虽然市场也有可能不会在K线3处反转而上，但是因为K线3是在牛市趋势中的震荡区间的底部，所以在K线3处反转的可能性是非常大的。当然，其实市场也可能在K线2之后形成了一个更低的高点的主要趋势的反转，然后掉头一路直下（我们可以看到图中有一个双重顶部的熊市旗型和一个更低的高点），但是事实上大部分的趋势反转都会演变成震荡区间，而不是真的完全相反趋势的反转，正如这里所示。但市场也是很有可能会真的反转而下，正如在K线7处所示。","p":"p426"},{"t":"当市场上有一部分的做空交易者感觉到了紧迫情绪，他们就会在市场向下突破趋势通道线的时候疯狂做空。他们非常害怕市场再也不会回到趋势通道线之上，所以他们绝不想错过如此绝佳的卖空机遇。在图5.6中，K线3、4、5组成了一个楔形顶部，但是K线5并没能向上突破趋势通道线。因为这是一个楔形反转的入场形态，所以你最好等到市场出现第二个明显的信号再行动。比如说一个更低的高点。K线5和紧随其后的一根K线形成了一个微型的下跌浪。K线6是在失败的高点2中的第二次入场机会，同时它也开启了一个由三根K线组成的较大的下跌潮市场在经历了一根K线的回调后，立刻开始了一波由5根K线组成的下跌浪，并最终演变成强劲的熊市趋势。从K线2处开始的上升通道震荡剧烈，因此出现了很多的震荡区间，所以这个上升浪和牛市通道并不是非常强劲。在K线1之前出现的大阳线，也实际上震荡剧烈，较长的尾部显示了市场曾经出现加速下跌行情。当市场上的震荡已经如此剧烈时，激进的交易者可以在第一次出现卖空信号的时候就积极做空，即在K线5处出现的两根K线的反转形态。值得一提的是，在楔形顶部的K线1的高点是一个微型的楔形顶部，K线2处的低点与后面的楔形底部形成了一个双重底部，这也是楔形通道的开始。同时，K线2也向下测试了前一个低点处的支撑位，这个支撑位是由此前行情加速下跌后向上突破开盘附近的阻力位时演变而来的。","p":"p427"},{"t":"K线7、8以及多头反转K线9和K线9后面的上升浪一起组成了一个三浪推动的多头入场信号的形态，交易者可以在K线9上方买入，即使K线9之后这波上升浪的K线的收盘价都不太高。很显然这一天并没有形成明显的趋势，所以趋势K线不强劲也是情有可原。从图中可以看到，这个形态没能收敛，但却并没有形成扩张三角形，因为在K线8之后形成的高点要低于在K线7之后形成的高点。虽然K线9没有突破趋势通道线，但是在一个震荡日中，它依然是一个比较好的买方入场形态。不过，因为K线7出现了非常强劲的卖空潮，所以你会怀疑在K线9买入的可靠性，那么在你可以等到市场上回调二次测试，出现一个更高的低点之后再买入。在3根K线之后出现的外包K线就是一个更高的低点，但你必须注意的是，你的入场必须迅速，因为这根K线形态较为强势，一般代表他们反转会非常强烈而快速。","p":"p428"},{"t":"K线9之前的K线是一根强劲的熊市趋势K线，因此是市场向下突破的尝试。然而，在下一根K线也就是K线9处并没有出现足够的卖方力量。相反，K线9是一个小型的牛市K线，因此形成了一个买方入场形态。虽然K线9的低点低于K线8的低点，但是在K线9之前的反弹潮中有5至6根连续的K线具有阳线主体，因此我们认为K线9是一个可靠的牛市突破尝试。所以K线9之前的卖空潮不过是在一系列的牛市突破中出现的一个短暂而急剧的回调而已。突破中的回调有时会形成一个更低的低点，正如这里所示。我们千万不要被单独的一根大的熊市趋势线所吓倒。因为我们可以把每一根趋势K线都看成是一二次突破，要知道，大部分的突破都会失败的。","p":"p429"}]},{"t":"para","text":"在图5.5道琼斯工业平均指数的日交易图上，市场价格向下跌破了牛市趋势线之后，形成了楔形熊市旗形中的更低的高点，并且直接导致了1987的大崩盘。下跌到K线6的下跌浪非常强劲，并且完美地打破了趋势线和移动平均线。有些交易者把K线5之后的反弹浪看成是这个楔形熊市旗形的第一波上推浪，而第三波和第三波上推浪可以是上升至K线7的三波上升浪中的任意两波。也有交易者会把K线7看成是一个有着更低的高点的两浪反转模式，因此也是一个低点2的卖空入场形态，两浪反转模式的第一波浪潮就是从K线5开始的反弹浪。甚至有交易者会把上升至K线7的三波上推浪看作是跟随在从K线6开始的微型上升浪后的微型通道。大部分交易者都会看到上述所有的因素，但是他们会根据自己的意见选择立场。","pid":"p423"},{"t":"para","text":"K线1是楔形牛市旗形的第一波下推浪。在之后出现了两波下推浪和一次小突破后，形成了一波直达K线3的回调浪，并且在K线3处形成了更高的低点突破。许多交易者把K线3和之前楔形牛市旗形的底部看成是一个双重底部的牛市旗形。但一般来说拥有头肩顶形态的楔形牛市旗形很容易失败，正如图中K线3所示。","pid":"p424"},{"t":"para","text":"在K线1的卖空潮之前的反弹浪中有四小波上推浪完美地证明了单独的三浪推动并不会创造反转的入场信号。当三浪推动出现在狭窄的牛市通道中时，出现第四波或者第五波上推浪的概率要比趋势反转的概率大得多。在通道最后上升至K线4之前也有三波上推浪，同样也是在狭窄的牛市通道中。当通道狭窄的时候，做空交易者不能马上在第三波上推浪后的反转潮中做空。他们应该再多等一会，看看市场上的向下突破会有多强劲。","pid":"p425"},{"t":"para","text":"K线5有力地打破了牛市通道和牛市通道线，所以交易者将在这个突破点回调的时候寻找做空的机会。K线7处形成了一个更低的高点，它同K线5之后的小反弹浪一起形成了一个双重顶。在牛市趋势中大部分的区间震荡最后都变成了牛市旗形，并且从更高的时间图上看，这些震荡区间不过只是小型的回调而已。虽然市场也有可能不会在K线3处反转而上，但是因为K线3是在牛市趋势中的震荡区间的底部，所以在K线3处反转的可能性是非常大的。当然，其实市场也可能在K线2之后形成了一个更低的高点的主要趋势的反转，然后掉头一路直下（我们可以看到图中有一个双重顶部的熊市旗型和一个更低的高点），但是事实上大部分的趋势反转都会演变成震荡区间，而不是真的完全相反趋势的反转，正如这里所示。但市场也是很有可能会真的反转而下，正如在K线7处所示。","pid":"p426"},{"t":"para","text":"当市场上有一部分的做空交易者感觉到了紧迫情绪，他们就会在市场向下突破趋势通道线的时候疯狂做空。他们非常害怕市场再也不会回到趋势通道线之上，所以他们绝不想错过如此绝佳的卖空机遇。在图5.6中，K线3、4、5组成了一个楔形顶部，但是K线5并没能向上突破趋势通道线。因为这是一个楔形反转的入场形态，所以你最好等到市场出现第二个明显的信号再行动。比如说一个更低的高点。K线5和紧随其后的一根K线形成了一个微型的下跌浪。K线6是在失败的高点2中的第二次入场机会，同时它也开启了一个由三根K线组成的较大的下跌潮市场在经历了一根K线的回调后，立刻开始了一波由5根K线组成的下跌浪，并最终演变成强劲的熊市趋势。从K线2处开始的上升通道震荡剧烈，因此出现了很多的震荡区间，所以这个上升浪和牛市通道并不是非常强劲。在K线1之前出现的大阳线，也实际上震荡剧烈，较长的尾部显示了市场曾经出现加速下跌行情。当市场上的震荡已经如此剧烈时，激进的交易者可以在第一次出现卖空信号的时候就积极做空，即在K线5处出现的两根K线的反转形态。值得一提的是，在楔形顶部的K线1的高点是一个微型的楔形顶部，K线2处的低点与后面的楔形底部形成了一个双重底部，这也是楔形通道的开始。同时，K线2也向下测试了前一个低点处的支撑位，这个支撑位是由此前行情加速下跌后向上突破开盘附近的阻力位时演变而来的。","pid":"p427"},{"t":"para","text":"K线7、8以及多头反转K线9和K线9后面的上升浪一起组成了一个三浪推动的多头入场信号的形态，交易者可以在K线9上方买入，即使K线9之后这波上升浪的K线的收盘价都不太高。很显然这一天并没有形成明显的趋势，所以趋势K线不强劲也是情有可原。从图中可以看到，这个形态没能收敛，但却并没有形成扩张三角形，因为在K线8之后形成的高点要低于在K线7之后形成的高点。虽然K线9没有突破趋势通道线，但是在一个震荡日中，它依然是一个比较好的买方入场形态。不过，因为K线7出现了非常强劲的卖空潮，所以你会怀疑在K线9买入的可靠性，那么在你可以等到市场上回调二次测试，出现一个更高的低点之后再买入。在3根K线之后出现的外包K线就是一个更高的低点，但你必须注意的是，你的入场必须迅速，因为这根K线形态较为强势，一般代表他们反转会非常强烈而快速。","pid":"p428"},{"t":"para","text":"K线9之前的K线是一根强劲的熊市趋势K线，因此是市场向下突破的尝试。然而，在下一根K线也就是K线9处并没有出现足够的卖方力量。相反，K线9是一个小型的牛市K线，因此形成了一个买方入场形态。虽然K线9的低点低于K线8的低点，但是在K线9之前的反弹潮中有5至6根连续的K线具有阳线主体，因此我们认为K线9是一个可靠的牛市突破尝试。所以K线9之前的卖空潮不过是在一系列的牛市突破中出现的一个短暂而急剧的回调而已。突破中的回调有时会形成一个更低的低点，正如这里所示。我们千万不要被单独的一根大的熊市趋势线所吓倒。因为我们可以把每一根趋势K线都看成是一二次突破，要知道，大部分的突破都会失败的。","pid":"p429"},{"t":"img","src":"assets/img/p1c5_006.webp","ctx":[{"t":"K线7、8以及多头反转K线9和K线9后面的上升浪一起组成了一个三浪推动的多头入场信号的形态，交易者可以在K线9上方买入，即使K线9之后这波上升浪的K线的收盘价都不太高。很显然这一天并没有形成明显的趋势，所以趋势K线不强劲也是情有可原。从图中可以看到，这个形态没能收敛，但却并没有形成扩张三角形，因为在K线8之后形成的高点要低于在K线7之后形成的高点。虽然K线9没有突破趋势通道线，但是在一个震荡日中，它依然是一个比较好的买方入场形态。不过，因为K线7出现了非常强劲的卖空潮，所以你会怀疑在K线9买入的可靠性，那么在你可以等到市场上回调二次测试，出现一个更高的低点之后再买入。在3根K线之后出现的外包K线就是一个更高的低点，但你必须注意的是，你的入场必须迅速，因为这根K线形态较为强势，一般代表他们反转会非常强烈而快速。","p":"p428"},{"t":"K线9之前的K线是一根强劲的熊市趋势K线，因此是市场向下突破的尝试。然而，在下一根K线也就是K线9处并没有出现足够的卖方力量。相反，K线9是一个小型的牛市K线，因此形成了一个买方入场形态。虽然K线9的低点低于K线8的低点，但是在K线9之前的反弹潮中有5至6根连续的K线具有阳线主体，因此我们认为K线9是一个可靠的牛市突破尝试。所以K线9之前的卖空潮不过是在一系列的牛市突破中出现的一个短暂而急剧的回调而已。突破中的回调有时会形成一个更低的低点，正如这里所示。我们千万不要被单独的一根大的熊市趋势线所吓倒。因为我们可以把每一根趋势K线都看成是一二次突破，要知道，大部分的突破都会失败的。","p":"p429"},{"t":"如图5.7的Emini的K线图所示，市场从K线5形成的更高的高点处反转而下形成了震荡区间，但是市场很快就强有力地突破了这个区间，并且打破了牛市通道线B。请记住，所有的反转都不过突破尝试的失败。最终在K线9趋势又反转而下，而这之前的上升浪则形成了第三波上推浪。因为这个楔形的斜率是增加的，因此具有抛物线的形态（从K线5到K线9形成的趋势通道线的斜率要大于从K线3到K线5形成的趋势通道线的斜率）。同其他所有的楔形顶部一样，接下来还有很大的概率会出现两波下推浪。","p":"p430"},{"t":"上升至K线9处的反弹浪打破了上升的牛市通道（图中的虚线），但是之后又通过下跌至K线10处的卖空浪潮回到了通道之中。任何时候当市场先出现了向上突破牛市通道线，然后又经过强有力的反转回到通道之中时，大概有50%的概率下跌浪还会继续，并且市场最终会突破牛市通道的下沿，正如图中之后出现的情况一样。一般来说，如果牛市通道的上方的突破将会失败。那么这种失败通常会在5根K线之内出现，正如图中所示。直到K线16处，做空交易者才平仓获利，而做多交易者才开始做多。K线16与K线6的低点形成了一个双重底部，是市场在向下突破趋势通道下沿之后出现的第一次反转。","p":"p431"},{"t":"在K线8之前的那根K线比再前一根K线的主体更小，这意味着市场上的动能正在衰减。K线8有一个很大的主体，这意味着什么呢？K线8的出现预示着在之前的暂停点之后市场企图再次加速趋势的上升。许多交易者认为K线8的大主体预示着高潮的到来，K线8与之前的暂停点可能会形成反弹浪潮中的最后旗形，带来后续的两波下跌浪。所以，许多交易者不仅会在K线8收盘时，以高于其收盘价的价格卖空，更会在K线9收盘时，以低于其收盘价的价格卖空，因为K线9处下跌的收盘价更加预示着卖方力量的增强。做多交易者平仓获利，而有一些做空交易者则为了进行刮头皮交易而卖空，他们期望在这个小型的买入高潮（即这个微型的最后旗形）之后会出现一个相对大的回调（持续5至10根K线）。而另外一些做空交易者做空则是认为，基于这个抛物线形态的楔形市场会震荡下行。","p":"p432"},{"t":"K线16是第二波下跌浪的底部，而K线8则是第一波下跌浪的起点。在更高的时间图上看，K线16是一个明显的高点2开始的回调。这两个底部形成了一个可以检验K线6处形成的最低点的双重底部形态。做空交易者本来期望这一天会出现反转，但是做多交易者进入市场后压倒了做空交易者。这一天收盘处的反弹浪测试了在K线9结束的强劲的牛市趋势的高点。虽然这波反弹浪并不强劲，并且K线22之前那波出现的卖出潮依然很强大，但是在日K线图上这一天依然是牛市趋势日。","p":"p433"}]},{"t":"para","text":"如图5.7的Emini的K线图所示，市场从K线5形成的更高的高点处反转而下形成了震荡区间，但是市场很快就强有力地突破了这个区间，并且打破了牛市通道线B。请记住，所有的反转都不过突破尝试的失败。最终在K线9趋势又反转而下，而这之前的上升浪则形成了第三波上推浪。因为这个楔形的斜率是增加的，因此具有抛物线的形态（从K线5到K线9形成的趋势通道线的斜率要大于从K线3到K线5形成的趋势通道线的斜率）。同其他所有的楔形顶部一样，接下来还有很大的概率会出现两波下推浪。","pid":"p430"},{"t":"para","text":"上升至K线9处的反弹浪打破了上升的牛市通道（图中的虚线），但是之后又通过下跌至K线10处的卖空浪潮回到了通道之中。任何时候当市场先出现了向上突破牛市通道线，然后又经过强有力的反转回到通道之中时，大概有50%的概率下跌浪还会继续，并且市场最终会突破牛市通道的下沿，正如图中之后出现的情况一样。一般来说，如果牛市通道的上方的突破将会失败。那么这种失败通常会在5根K线之内出现，正如图中所示。直到K线16处，做空交易者才平仓获利，而做多交易者才开始做多。K线16与K线6的低点形成了一个双重底部，是市场在向下突破趋势通道下沿之后出现的第一次反转。","pid":"p431"},{"t":"para","text":"在K线8之前的那根K线比再前一根K线的主体更小，这意味着市场上的动能正在衰减。K线8有一个很大的主体，这意味着什么呢？K线8的出现预示着在之前的暂停点之后市场企图再次加速趋势的上升。许多交易者认为K线8的大主体预示着高潮的到来，K线8与之前的暂停点可能会形成反弹浪潮中的最后旗形，带来后续的两波下跌浪。所以，许多交易者不仅会在K线8收盘时，以高于其收盘价的价格卖空，更会在K线9收盘时，以低于其收盘价的价格卖空，因为K线9处下跌的收盘价更加预示着卖方力量的增强。做多交易者平仓获利，而有一些做空交易者则为了进行刮头皮交易而卖空，他们期望在这个小型的买入高潮（即这个微型的最后旗形）之后会出现一个相对大的回调（持续5至10根K线）。而另外一些做空交易者做空则是认为，基于这个抛物线形态的楔形市场会震荡下行。","pid":"p432"},{"t":"para","text":"K线16是第二波下跌浪的底部，而K线8则是第一波下跌浪的起点。在更高的时间图上看，K线16是一个明显的高点2开始的回调。这两个底部形成了一个可以检验K线6处形成的最低点的双重底部形态。做空交易者本来期望这一天会出现反转，但是做多交易者进入市场后压倒了做空交易者。这一天收盘处的反弹浪测试了在K线9结束的强劲的牛市趋势的高点。虽然这波反弹浪并不强劲，并且K线22之前那波出现的卖出潮依然很强大，但是在日K线图上这一天依然是牛市趋势日。","pid":"p433"},{"t":"img","src":"assets/img/p1c5_007.webp","ctx":[{"t":"在K线8之前的那根K线比再前一根K线的主体更小，这意味着市场上的动能正在衰减。K线8有一个很大的主体，这意味着什么呢？K线8的出现预示着在之前的暂停点之后市场企图再次加速趋势的上升。许多交易者认为K线8的大主体预示着高潮的到来，K线8与之前的暂停点可能会形成反弹浪潮中的最后旗形，带来后续的两波下跌浪。所以，许多交易者不仅会在K线8收盘时，以高于其收盘价的价格卖空，更会在K线9收盘时，以低于其收盘价的价格卖空，因为K线9处下跌的收盘价更加预示着卖方力量的增强。做多交易者平仓获利，而有一些做空交易者则为了进行刮头皮交易而卖空，他们期望在这个小型的买入高潮（即这个微型的最后旗形）之后会出现一个相对大的回调（持续5至10根K线）。而另外一些做空交易者做空则是认为，基于这个抛物线形态的楔形市场会震荡下行。","p":"p432"},{"t":"K线16是第二波下跌浪的底部，而K线8则是第一波下跌浪的起点。在更高的时间图上看，K线16是一个明显的高点2开始的回调。这两个底部形成了一个可以检验K线6处形成的最低点的双重底部形态。做空交易者本来期望这一天会出现反转，但是做多交易者进入市场后压倒了做空交易者。这一天收盘处的反弹浪测试了在K线9结束的强劲的牛市趋势的高点。虽然这波反弹浪并不强劲，并且K线22之前那波出现的卖出潮依然很强大，但是在日K线图上这一天依然是牛市趋势日。","p":"p433"},{"t":"如图5.8所示，在左边的图表的交易区间中。在K线4的下方触发了一个低点2的卖空潮。但是大部分交易者都不会在这个并不太明显的卖空潮中做空，因为K线4是一个十字星。并且在它之后的六根连续的K线都没有出现熊市的主体。K线6形成了一个高点2的买方入场形态（同时也是从高点1之后出现的一次突破性的买入回调，也还是K线5之后出现的一个失败的低点2），所以之后导致了非常强劲的牛市突破。般反弹都会导致阻力位后停止，如同在楔形之后市场会移动一段相当于楔形高度的距离一般，反弹也是如此，在此时交易者一般可以得到部分或者全部的利润，而激进的做空交易者则会抓住这个刮头皮交易的时机做空。这次的反弹超过了一般的移动距离几个点位，所以市场上的交易者可能也会有其他不同于前面介绍的目的。所有的交易者都期待市场上会再一次出现回调，并且他们都准备等回调结束时买入（所以他们都会在支撑位买入，即使看起来不是那么明显）。之所以会出现这种情况，是因为现在绝大多数的交易都是由计算机完成，而计算机的算法是基于数学和逻辑，他们只会在支撑位买入，在阻力位卖出。当然，对于经验丰富的交易者来说，他们也能看到市场上这些潜在的支撑或者阻力位。","p":"p434"},{"t":"从K线4到K线7的趋势通道线要比从K线2到K线4的趋势通道线陡峭，这意味市场的趋势是呈抛物线状向上移动。在K线7之前的K线有一根长长的上影线，这意味着在这根K线的收盘处购买的交易者是为了进行刮头皮交易，并且期待着后续出现回调。K线7的高点是第二波上推浪。紧随其后的一根K线是一根熊市内含线，同时也是做空的信号。在K线4的低点2失败后，大部分交易者都认为市场一定会出现第二波上推浪，并且在此处第二波上推浪出现的概率超过60%，事实证明也确实如此。在K线7之后，市场在一个牛市旗形中持续下跌了6根K线（在这里，我们可以看到一个微型的熊市通道），市场并没有再次向上突破，并且在K线8之后向下突破了牛市旗形一路直下。所以，这个牛市旗形就演变成之前的反弹浪中的最后旗形，而之后的向下突破则变成了一个最后旗形反转，即使在这个旗形中根本就没有出现过向上的突破。精明的交易者会很早就预感到这些，所以他们会在市场向下突破K线7之后的那根K线，以及向下突破K线8的时候做空。抓住第一次入场时机卖空的交易者。知道他们只有40%的概率成功，所以他们期待得到的回报至少是他们承担的风险头寸的两倍，因此他们有一个积极的心态。而在市场向下突破时入场做空的交易者，不管是在K线正在形成中，或者是在它的收盘处，甚至是在随后的K线的收盘处做空，都已经有了足够的证据证明市场会继续下行，因为他们的卖空有60%的机会成功（所以对他们而言，期待获得至少与承担的风险头寸一样多的回报）。他们获得成功的概率更大，所以可能获得的收获就更小，但是他们也依然是有积极的心态。","p":"p435"},{"t":"在右边的图表是一个抛物线型的楔形底部。K线15是一根在双重底部的强劲的牛市反转K线，同时也是在之前的低点2最后旗形向下突破K线4之后出现的向上反转买方入场形态。K线14可以被看成是一个可以卖空的低点2的二次入场形态，是一个由前一根K线触发的低点2的突破回调，或者是一个三角形的做空形态（其中三波上推浪分别是K线13后面第二根十字星K线的高点。紧随其后的牛市内含线。以及K线14的上影线）。做空交易者把K线16看成是这个熊市三角形的突破后的回调。所有的交易者都会在K线16的下方，K线15后面的牛市通道K线，以及K线15这个买入信号K线处卖出头寸。做多交易者卖出他们的头寸，而做空交易者也积极做空。当市场从双重底部上升至阻力位时，做多交易者将不再交易，他们希望市场可以再次突破并且上升一个可测量的距离，所以他们在这附近的几根K线处都不再购买，而这将导致市场急速下跌。","p":"p436"},{"t":"K线17有一根较长的下影线，这提醒交易者们，在市场回调之前可能最多还有一波下推浪。同时，K线17的收盘价也较为居中，这使得它成为了一根反转K线，即使并不明显。这是市场自强劲下跌后第一次反转尝试，同时也是一个微型通道，但是如你所知，第一次反转往往会以失败告终。如你预期的一样，在K线17的上方卖方要多于买方。刮头皮交易者将会在K线17的收盘处进行刮头皮交易，他们希望在回调开始之前还有一波小型的下推浪。因为需要快速地抓住下跌的机会，所以在下一根K线的低点1处卖空是有风险的。市场在经历了K线18处的微型的双重底之后反转而上（K线17则是第一波下跌浪）。K线18要比K线17的收盘价低4个点位，所以大部分在K线17的收盘处做空的交易者陷入了困境，而且他们会在K线18的上方买回头寸。K线18有一个强劲的牛市主体，所以大部分交易者期待之后会出现重新回到移动平均线的上升浪，这波浪潮也许还可以到达K线15的高点。K线15是一个可靠的买入信号，所以许多在之前的低点缩减了头寸的做多交易者。会在K线15的高点这个第一次出现的入场通道中，卖空所有的头寸。做多交易者认为这次的反弹可以到达K线16或者K线14的高点处。K线18的低点在一个或多个支撑位上，但是图中并没有标示。","p":"p437"},{"t":"下跌至K线18的下跌浪超过了合理测量的距离，这意味着参与交易的计算机不仅仅只是在根据上一个形态测量市场移动的距离。其实市场到达测量的距离之后并不一定会立刻反转，但是画出这段距离对你来说还是很有用，因为所有的反转都是在支撑位和阻力位产生的。一旦这些位置中产生了反转。并且这个位置又是非常明显，那么在这个位置趋势交易者很容易获利，而逆趋势交易者则会采取反向交易。不管它是否明显，在这一天的最后一个低点也是在支撑位上。K线21的低点比之前的低点要低一个点位，而且K线21的收盘价正好在这一天的开盘价处。","p":"p438"},{"t":"因为这波上升浪是一个高潮反转。所以有60%的概率之后会出现至少两波上升浪并且持续10根K线左右。当然这也并不是绝对的。","p":"p439"},{"t":"K线18是一个非常明显的牛市购买信号，大部分交易者会在它的高点之上入场。当市场逐渐上升的时候，买入头寸的交易者将越来越少。K线18的上影线以及随后而来的十字星意味着这个市场缺乏足够多的买方力量，所以这个买入入场形态不够强烈。当作多交易者不能够彰显它的力量时，交易者将快速积累利润。K线19比K线18的高点高14个点位，同时收盘价比开盘价要低。这意味着许多做多交易者会在明确的三点处获利。当市场反弹的时候，不要急于寻找新的买方，而是学会在移动平均线上找到获利机会，我们可以注意到K线13后面的第二根K线，这根K线比K线13低两个点位，并且触发了后面的两根K线的反转。做空交易者把这个突破看成是一个失败的突破，即使他们在一个点位之下已经止损，因此这也证明了做空交易者正在积极止损。虽然在市场回调到一个更高的低点之后出现第二波上升浪的概率还是很大的，但大部分的做多交易者还是会在K线19或者更低的位置卖出头寸，并且只期望在市场的回调高于K线19的高点时再次买入但是市场并没有形成更高的低点，并且很快跌破了K线17的低点，并且以最低价收盘。做多交易者的交易策略并没有使他们获得想要的利润，但是这种情况并不罕见，所以也不足为奇。当交易者进入市场的时候往往会有一个策略，但是一旦市场行情有变，他们也会转变他们的策略。所以许多交易者在离开市场的时候确实会获利微小甚至获得损失。优秀的交易者应该承担市场带来的后果，并且永远向前看。","p":"p440"},{"t":"其实交易者已经特别警惕在这一天的收盘处会形成抛售潮，因为在日K线图上，他们可以看到市场在反弹了近两年后突然在两天前形成了一个熊市突破。当市场在日K线图上可能会出现向下反转的情况时，许多交易者会寻找收盘处形成的卖空潮（就像他们寻找牛市趋势中收盘处的反弹一样）。所以当市场向下突破K线19的时候，他们不愿意以限价订单的方式成交。他们非常谨慎，并且只愿意在反转K线形成的时候买入。因为愿意以限价订单的方式买入的交易者太少了，所以市场迅速地在收盘处形成了卖空潮。这一天是一个熊市日，并且这根信号K线从来没有形成过更高的低点。","p":"p441"},{"t":"当买入信号发出但市场却没有反转而上，反而开始震荡时，市场可能已经开始接受价格可能会进一步走低的可能性，所以市场很可能处于这段下跌浪中间的位置而不是在底部区域。一个失败的楔形通常会下跌一段可以测量的距离。","p":"p442"}]},{"t":"para","text":"如图5.8所示，在左边的图表的交易区间中。在K线4的下方触发了一个低点2的卖空潮。但是大部分交易者都不会在这个并不太明显的卖空潮中做空，因为K线4是一个十字星。并且在它之后的六根连续的K线都没有出现熊市的主体。K线6形成了一个高点2的买方入场形态（同时也是从高点1之后出现的一次突破性的买入回调，也还是K线5之后出现的一个失败的低点2），所以之后导致了非常强劲的牛市突破。般反弹都会导致阻力位后停止，如同在楔形之后市场会移动一段相当于楔形高度的距离一般，反弹也是如此，在此时交易者一般可以得到部分或者全部的利润，而激进的做空交易者则会抓住这个刮头皮交易的时机做空。这次的反弹超过了一般的移动距离几个点位，所以市场上的交易者可能也会有其他不同于前面介绍的目的。所有的交易者都期待市场上会再一次出现回调，并且他们都准备等回调结束时买入（所以他们都会在支撑位买入，即使看起来不是那么明显）。之所以会出现这种情况，是因为现在绝大多数的交易都是由计算机完成，而计算机的算法是基于数学和逻辑，他们只会在支撑位买入，在阻力位卖出。当然，对于经验丰富的交易者来说，他们也能看到市场上这些潜在的支撑或者阻力位。","pid":"p434"},{"t":"para","text":"从K线4到K线7的趋势通道线要比从K线2到K线4的趋势通道线陡峭，这意味市场的趋势是呈抛物线状向上移动。在K线7之前的K线有一根长长的上影线，这意味着在这根K线的收盘处购买的交易者是为了进行刮头皮交易，并且期待着后续出现回调。K线7的高点是第二波上推浪。紧随其后的一根K线是一根熊市内含线，同时也是做空的信号。在K线4的低点2失败后，大部分交易者都认为市场一定会出现第二波上推浪，并且在此处第二波上推浪出现的概率超过60%，事实证明也确实如此。在K线7之后，市场在一个牛市旗形中持续下跌了6根K线（在这里，我们可以看到一个微型的熊市通道），市场并没有再次向上突破，并且在K线8之后向下突破了牛市旗形一路直下。所以，这个牛市旗形就演变成之前的反弹浪中的最后旗形，而之后的向下突破则变成了一个最后旗形反转，即使在这个旗形中根本就没有出现过向上的突破。精明的交易者会很早就预感到这些，所以他们会在市场向下突破K线7之后的那根K线，以及向下突破K线8的时候做空。抓住第一次入场时机卖空的交易者。知道他们只有40%的概率成功，所以他们期待得到的回报至少是他们承担的风险头寸的两倍，因此他们有一个积极的心态。而在市场向下突破时入场做空的交易者，不管是在K线正在形成中，或者是在它的收盘处，甚至是在随后的K线的收盘处做空，都已经有了足够的证据证明市场会继续下行，因为他们的卖空有60%的机会成功（所以对他们而言，期待获得至少与承担的风险头寸一样多的回报）。他们获得成功的概率更大，所以可能获得的收获就更小，但是他们也依然是有积极的心态。","pid":"p435"},{"t":"para","text":"在右边的图表是一个抛物线型的楔形底部。K线15是一根在双重底部的强劲的牛市反转K线，同时也是在之前的低点2最后旗形向下突破K线4之后出现的向上反转买方入场形态。K线14可以被看成是一个可以卖空的低点2的二次入场形态，是一个由前一根K线触发的低点2的突破回调，或者是一个三角形的做空形态（其中三波上推浪分别是K线13后面第二根十字星K线的高点。紧随其后的牛市内含线。以及K线14的上影线）。做空交易者把K线16看成是这个熊市三角形的突破后的回调。所有的交易者都会在K线16的下方，K线15后面的牛市通道K线，以及K线15这个买入信号K线处卖出头寸。做多交易者卖出他们的头寸，而做空交易者也积极做空。当市场从双重底部上升至阻力位时，做多交易者将不再交易，他们希望市场可以再次突破并且上升一个可测量的距离，所以他们在这附近的几根K线处都不再购买，而这将导致市场急速下跌。","pid":"p436"},{"t":"para","text":"K线17有一根较长的下影线，这提醒交易者们，在市场回调之前可能最多还有一波下推浪。同时，K线17的收盘价也较为居中，这使得它成为了一根反转K线，即使并不明显。这是市场自强劲下跌后第一次反转尝试，同时也是一个微型通道，但是如你所知，第一次反转往往会以失败告终。如你预期的一样，在K线17的上方卖方要多于买方。刮头皮交易者将会在K线17的收盘处进行刮头皮交易，他们希望在回调开始之前还有一波小型的下推浪。因为需要快速地抓住下跌的机会，所以在下一根K线的低点1处卖空是有风险的。市场在经历了K线18处的微型的双重底之后反转而上（K线17则是第一波下跌浪）。K线18要比K线17的收盘价低4个点位，所以大部分在K线17的收盘处做空的交易者陷入了困境，而且他们会在K线18的上方买回头寸。K线18有一个强劲的牛市主体，所以大部分交易者期待之后会出现重新回到移动平均线的上升浪，这波浪潮也许还可以到达K线15的高点。K线15是一个可靠的买入信号，所以许多在之前的低点缩减了头寸的做多交易者。会在K线15的高点这个第一次出现的入场通道中，卖空所有的头寸。做多交易者认为这次的反弹可以到达K线16或者K线14的高点处。K线18的低点在一个或多个支撑位上，但是图中并没有标示。","pid":"p437"},{"t":"para","text":"下跌至K线18的下跌浪超过了合理测量的距离，这意味着参与交易的计算机不仅仅只是在根据上一个形态测量市场移动的距离。其实市场到达测量的距离之后并不一定会立刻反转，但是画出这段距离对你来说还是很有用，因为所有的反转都是在支撑位和阻力位产生的。一旦这些位置中产生了反转。并且这个位置又是非常明显，那么在这个位置趋势交易者很容易获利，而逆趋势交易者则会采取反向交易。不管它是否明显，在这一天的最后一个低点也是在支撑位上。K线21的低点比之前的低点要低一个点位，而且K线21的收盘价正好在这一天的开盘价处。","pid":"p438"},{"t":"para","text":"因为这波上升浪是一个高潮反转。所以有60%的概率之后会出现至少两波上升浪并且持续10根K线左右。当然这也并不是绝对的。","pid":"p439"},{"t":"para","text":"K线18是一个非常明显的牛市购买信号，大部分交易者会在它的高点之上入场。当市场逐渐上升的时候，买入头寸的交易者将越来越少。K线18的上影线以及随后而来的十字星意味着这个市场缺乏足够多的买方力量，所以这个买入入场形态不够强烈。当作多交易者不能够彰显它的力量时，交易者将快速积累利润。K线19比K线18的高点高14个点位，同时收盘价比开盘价要低。这意味着许多做多交易者会在明确的三点处获利。当市场反弹的时候，不要急于寻找新的买方，而是学会在移动平均线上找到获利机会，我们可以注意到K线13后面的第二根K线，这根K线比K线13低两个点位，并且触发了后面的两根K线的反转。做空交易者把这个突破看成是一个失败的突破，即使他们在一个点位之下已经止损，因此这也证明了做空交易者正在积极止损。虽然在市场回调到一个更高的低点之后出现第二波上升浪的概率还是很大的，但大部分的做多交易者还是会在K线19或者更低的位置卖出头寸，并且只期望在市场的回调高于K线19的高点时再次买入但是市场并没有形成更高的低点，并且很快跌破了K线17的低点，并且以最低价收盘。做多交易者的交易策略并没有使他们获得想要的利润，但是这种情况并不罕见，所以也不足为奇。当交易者进入市场的时候往往会有一个策略，但是一旦市场行情有变，他们也会转变他们的策略。所以许多交易者在离开市场的时候确实会获利微小甚至获得损失。优秀的交易者应该承担市场带来的后果，并且永远向前看。","pid":"p440"},{"t":"para","text":"其实交易者已经特别警惕在这一天的收盘处会形成抛售潮，因为在日K线图上，他们可以看到市场在反弹了近两年后突然在两天前形成了一个熊市突破。当市场在日K线图上可能会出现向下反转的情况时，许多交易者会寻找收盘处形成的卖空潮（就像他们寻找牛市趋势中收盘处的反弹一样）。所以当市场向下突破K线19的时候，他们不愿意以限价订单的方式成交。他们非常谨慎，并且只愿意在反转K线形成的时候买入。因为愿意以限价订单的方式买入的交易者太少了，所以市场迅速地在收盘处形成了卖空潮。这一天是一个熊市日，并且这根信号K线从来没有形成过更高的低点。","pid":"p441"},{"t":"para","text":"当买入信号发出但市场却没有反转而上，反而开始震荡时，市场可能已经开始接受价格可能会进一步走低的可能性，所以市场很可能处于这段下跌浪中间的位置而不是在底部区域。一个失败的楔形通常会下跌一段可以测量的距离。","pid":"p442"},{"t":"img","src":"assets/img/p1c5_008.webp","ctx":[{"t":"其实交易者已经特别警惕在这一天的收盘处会形成抛售潮，因为在日K线图上，他们可以看到市场在反弹了近两年后突然在两天前形成了一个熊市突破。当市场在日K线图上可能会出现向下反转的情况时，许多交易者会寻找收盘处形成的卖空潮（就像他们寻找牛市趋势中收盘处的反弹一样）。所以当市场向下突破K线19的时候，他们不愿意以限价订单的方式成交。他们非常谨慎，并且只愿意在反转K线形成的时候买入。因为愿意以限价订单的方式买入的交易者太少了，所以市场迅速地在收盘处形成了卖空潮。这一天是一个熊市日，并且这根信号K线从来没有形成过更高的低点。","p":"p441"},{"t":"当买入信号发出但市场却没有反转而上，反而开始震荡时，市场可能已经开始接受价格可能会进一步走低的可能性，所以市场很可能处于这段下跌浪中间的位置而不是在底部区域。一个失败的楔形通常会下跌一段可以测量的距离。","p":"p442"},{"t":"如图5.9所示。市场正在试图形成一个楔形反转，但是K线3几乎与前一根K线重叠了，而这已经是第四根连续出现这种情况的K线了。这就是市场接受了价格进一步走低的可能性，而非拼命拒绝这个低价，所以看起来市场向上反转已经无望了。同样可以看到的是，市场向下的通道非常的峭，当这种情况出现时，在你采取做多的交易方式之前最好先等待一个更高的低点出现。K线3是一根上升的外包线，所以一些做多交易者只看了三浪推进结构而忽视了整个熊市趋势通道线的陡峭，从而买入被套。而有耐心的交易者不会在这个楔形处买入，因为更高的低点还没有出现","p":"p443"},{"t":"当楔形失效时，市场移动的距离大约会等于这个楔形的高度。在这里我们可以看到，K线3之后的下跌浪大约等于之前楔形的高度，大约是从楔形的顶部K线1处到楔形的底部K线3的低点处的距离。","p":"p444"},{"t":"在熊市趋势中，如果楔形底部过于狭窄并且没有之前的买方力量支撑时，这个楔形底部将不是一个买方入场形态。如图5.10所示，市场从开盘开始出现下跌缺口后一直处于熊市趋势之中。激进的做多交易者将会劝服自己在K线6的楔形反转处买入，他们相信在两波下跌浪之后，市场将在此处终止下跌，更何况，K线3处出现了趋势通道线的突破。然而，K线3是一个失败的趋势线突破，同时也不能证明做多交易者用动能掌控了市场。在内含线的上方出现的K线6的楔形做多入场通道是一次绝佳的进行刮头皮交易的机会，但却并不是一个可能会反转趋势的入场形态。下跌至K线6的下跌浪中并没有出现任何有意义的趋势线的突破，也没有出现向上的动能支持，所以这波下跌浪看起来就像是在一个狭窄的熊市通道中出现的伴随着两小波反弹的单独的一波下跌浪。所以在熊市趋势线的突破后再次出现第二波下跌浪的概率非常大。许多交易者会把K线6看成是楔形的结束处，而这个楔形的第一波下跌浪出现在K线2，第二波下跌浪出现在K线4，最后一波下跌浪出现在K线6。同时，K线4、5、6以及中间的另外两根K线一起形成了一个5条K线的微型楔形形态。通过连接这些K线的底部可以画出一条趋势通道线，这个小模式可以被看成是一个微型楔形，因此也会表现出楔形应有的特性，市场应该会经历一波反弹，重新回到楔形开始第一波下推浪的顶部位置。","p":"p445"},{"t":"在K线8处出现了一个低点2。但这一小波反弹并不足以打破趋势线，所以买方可以在下一个失败的低点处寻找到买入的刮头皮交易机会，而这次的交易机会就出现在K线9处。然而，因为市场上没有出现强劲的牛市反转K线，所以这波上升趋势不太可能持续，我们可以看到，确实在K线10处出现了一个低点2的卖空潮，之后市场一路下跌进入第二波熊市浪潮，并在K线12这个最后旗形向下突破了一个价位的假突破处终止。K线10与K线8形成了一个双重顶，同时也是一个跳空缺口K线的卖空入场形态，并最终演变成熊市趋势的复苏，到达了这一天的最低点。","p":"p446"},{"t":"在狭窄的熊市通道中出现的楔形底部不是一个买入信号。如图5.11所示，K线9是一个熊市趋势线突破后的反转，同时也是第三波下推浪（在这个楔形中）。但是因为K线9是处于一个狭窄的熊市通道中，所以它不是一根强劲的牛市信号线，它与前一根K线重合了太多了，并且有一个非常弱势的收盘价（所以它的牛市主体非常小）。所以暂时还没有明显的信号显示市场超卖的交易行为有所停止，而且你最好也不要在狭窄的熊市通道中的第一个突破口处买入，因为这些突破持续时间比较短，除了进行刮头皮交易外其他更长周期的交易往往会失败。你应该做的是，在买入之前等待第二个买方入场通道。事实上，经验丰富的交易者一般会在熊市通道的前一根K线的高点或者高点之上卖空，而且他们根本就不再期待市场出现买入的时机。","p":"p447"},{"t":"对于在这个楔形中已经买入的交易者来说，K线10是突破了一个点位的假突破。K线10是第三根震荡的K线，所以聪明的交易者已经可以在这个熊市趋势中看到一个震荡区间了，这也是一个常见的连续发生的形态。过于重叠的K线意味着这个市场正在接受这不断降低的价格，而抵触他们的下跌的力量还不够强大。你必须看到市场抵触下跌的信号，才可以在一个熊市趋势中买入。我们进行反转交易的理由不能仅仅基于我们认为市场需要反弹或回调，这样主观的理由往往导致我们的交易以失败告终。趋势有时候可能比很多交易者想象的要长。","p":"p448"},{"t":"交易者可能会在K线11的低点1处卖空，但是由于K线11还处于震荡区间，所以聪明的交易者在看到强劲的下跌K线之前也不应该卖空。这是市场上出现的第二个只取得了一个价位的突破的假性突破。同样，你可以注意到，楔形一般还会有两次反弹尝试（两波反弹浪），所以他们只会在楔形失败的时候卖空（比如，当市场跌破了K线9的低点），或者会在第二波反弹浪失败的时候卖空。","p":"p449"},{"t":"K线12又是一个只突破了一个价位的假性突破，但是在这之前有两波上升浪（K线9和K线11），所以是一个低点2的卖空潮。聪明的交易者将会抓住这绝无仅有的机会卖空，因为它是在熊市旗形中出现的低点2，这个点之所以如此特别，是因为它之前两次的反转向上尝试都失败了（K线10和K线12），这也是这个形的两波上升浪，显而易见，他们非常地弱。同样，在市场中出现连续的三次一个价位的失败突破也是非常罕见的，可以想象的是，接下来市场可能会出现大幅下跌。","p":"p450"},{"t":"当然，交易者也可以等到市场突破了K线9的低点时才开始做空，因为只有到了那个时候，我们才知道楔形真正的失败了。在市场突破K线9的低点的突破口确实出现了猛烈的交易量（在一分钟的K线图上，我们将看到这个突破口出现了14000份合约的交易量），这证实了市场上聪明的交易者确实是等到这个点才开始做空。一个失败的楔形往往会迎来一段相当于楔形高度的移动距离，正如这里可以看到的一样。","p":"p451"},{"t":"在你买入之前，你最先需要看到趋势通道线的突破，最好还可以看到一根反转K线。因为K线9是一根非常弱的反转K线，所以你应该坚持到趋势通道线被突破并且出现反转后再买入。所以你应该等待市场出现一个二次买方入场形态。K线12正是这个二次买方入场形态，但是如果你在此处买入，就相当于在这个四根K线组成的震荡区域的顶部买入，而你永远都不应该在一个熊市趋势中出现的熊市旗形的顶部买入。一旦这个弱二次入场形态也失败了，做空交易者就掌控了整个市场。在你进行做多交易之前，你应该好好考的就是这些内容，而不应该把过多的精力花在劝服自己相信做多是合适的这件事情上。","p":"p452"},{"t":"市场在K线2处打破了双重顶时。交易者应该立即反应过来今天可能是一天的趋势震荡。所以在这种类型的熊市趋势日，最好是进行双向交易。对于做多交易者来说因为是逆趋势交易，所以最好是等到出现了强烈的买方入场形态时再开始做多，比如说K线3和K线4之后出现的两根K线（这是一个二次买方入场形态）。下跌至K线7的下跌浪也是市场的一次突破。但是却并没有形成第三次震荡区间，市场在形成了一个非常狭窄的熊市通道后，再次一路直下。在K线7之前有一波剧烈的下跌浪，K线7之后出现了熊市通道。但是也有交易者会认为剧烈的下跌浪是从K线2至K线3之间的那波下跌浪开始的，而熊市通道是从K线5处开始的。但是这都没有关系，只要你认识到这一天是一个熊市趋势日，并且积极做空就好了。","p":"p453"},{"t":"顺便一提的是，在K线2之前形成了震荡低点的三根十字星K线也是一个微型的楔形形态。","p":"p454"},{"t":"一个价位的突破也是非常重要的，特别是如果有两个突破已经成功了的时候，因为这将构成一个三浪推动模式。在图5.12中，K线4在K线3的一个价位之上，K线5又在K线4的一个价位之上。如果市场在之后出现了一个回调或者震荡区间，之后市场又重新超越了K线5，那么市场上就很可能会出现一个向上突破，而这个微型楔形可能并不足以反转市场。","p":"p455"},{"t":"K线2低于K线1几个点位，而K线6又比K线2低一个点位。在经历了几根K线之后，K线7向下突破了K线6的低点，并且带来了市场的向下突破。通常来说，当市场打破了这些微型三推模式，至少会移动一段可以测量的距离，我们可以用这个震荡区间从顶部到底部的距离来测量这段移动距离，在这里，我们可以看到实际上市场下跌的距离比这段距离更长。","p":"p456"},{"t":"K线8是一个微型楔形底部，同时也是一个一根K线的熊市旗形。这是市场将要暂时停滞的迹象，在一个强劲的熊市趋势中，它并不是一个反转形态。","p":"p457"}]},{"t":"para","text":"如图5.9所示。市场正在试图形成一个楔形反转，但是K线3几乎与前一根K线重叠了，而这已经是第四根连续出现这种情况的K线了。这就是市场接受了价格进一步走低的可能性，而非拼命拒绝这个低价，所以看起来市场向上反转已经无望了。同样可以看到的是，市场向下的通道非常的峭，当这种情况出现时，在你采取做多的交易方式之前最好先等待一个更高的低点出现。K线3是一根上升的外包线，所以一些做多交易者只看了三浪推进结构而忽视了整个熊市趋势通道线的陡峭，从而买入被套。而有耐心的交易者不会在这个楔形处买入，因为更高的低点还没有出现","pid":"p443"},{"t":"para","text":"当楔形失效时，市场移动的距离大约会等于这个楔形的高度。在这里我们可以看到，K线3之后的下跌浪大约等于之前楔形的高度，大约是从楔形的顶部K线1处到楔形的底部K线3的低点处的距离。","pid":"p444"},{"t":"para","text":"在熊市趋势中，如果楔形底部过于狭窄并且没有之前的买方力量支撑时，这个楔形底部将不是一个买方入场形态。如图5.10所示，市场从开盘开始出现下跌缺口后一直处于熊市趋势之中。激进的做多交易者将会劝服自己在K线6的楔形反转处买入，他们相信在两波下跌浪之后，市场将在此处终止下跌，更何况，K线3处出现了趋势通道线的突破。然而，K线3是一个失败的趋势线突破，同时也不能证明做多交易者用动能掌控了市场。在内含线的上方出现的K线6的楔形做多入场通道是一次绝佳的进行刮头皮交易的机会，但却并不是一个可能会反转趋势的入场形态。下跌至K线6的下跌浪中并没有出现任何有意义的趋势线的突破，也没有出现向上的动能支持，所以这波下跌浪看起来就像是在一个狭窄的熊市通道中出现的伴随着两小波反弹的单独的一波下跌浪。所以在熊市趋势线的突破后再次出现第二波下跌浪的概率非常大。许多交易者会把K线6看成是楔形的结束处，而这个楔形的第一波下跌浪出现在K线2，第二波下跌浪出现在K线4，最后一波下跌浪出现在K线6。同时，K线4、5、6以及中间的另外两根K线一起形成了一个5条K线的微型楔形形态。通过连接这些K线的底部可以画出一条趋势通道线，这个小模式可以被看成是一个微型楔形，因此也会表现出楔形应有的特性，市场应该会经历一波反弹，重新回到楔形开始第一波下推浪的顶部位置。","pid":"p445"},{"t":"para","text":"在K线8处出现了一个低点2。但这一小波反弹并不足以打破趋势线，所以买方可以在下一个失败的低点处寻找到买入的刮头皮交易机会，而这次的交易机会就出现在K线9处。然而，因为市场上没有出现强劲的牛市反转K线，所以这波上升趋势不太可能持续，我们可以看到，确实在K线10处出现了一个低点2的卖空潮，之后市场一路下跌进入第二波熊市浪潮，并在K线12这个最后旗形向下突破了一个价位的假突破处终止。K线10与K线8形成了一个双重顶，同时也是一个跳空缺口K线的卖空入场形态，并最终演变成熊市趋势的复苏，到达了这一天的最低点。","pid":"p446"},{"t":"para","text":"在狭窄的熊市通道中出现的楔形底部不是一个买入信号。如图5.11所示，K线9是一个熊市趋势线突破后的反转，同时也是第三波下推浪（在这个楔形中）。但是因为K线9是处于一个狭窄的熊市通道中，所以它不是一根强劲的牛市信号线，它与前一根K线重合了太多了，并且有一个非常弱势的收盘价（所以它的牛市主体非常小）。所以暂时还没有明显的信号显示市场超卖的交易行为有所停止，而且你最好也不要在狭窄的熊市通道中的第一个突破口处买入，因为这些突破持续时间比较短，除了进行刮头皮交易外其他更长周期的交易往往会失败。你应该做的是，在买入之前等待第二个买方入场通道。事实上，经验丰富的交易者一般会在熊市通道的前一根K线的高点或者高点之上卖空，而且他们根本就不再期待市场出现买入的时机。","pid":"p447"},{"t":"para","text":"对于在这个楔形中已经买入的交易者来说，K线10是突破了一个点位的假突破。K线10是第三根震荡的K线，所以聪明的交易者已经可以在这个熊市趋势中看到一个震荡区间了，这也是一个常见的连续发生的形态。过于重叠的K线意味着这个市场正在接受这不断降低的价格，而抵触他们的下跌的力量还不够强大。你必须看到市场抵触下跌的信号，才可以在一个熊市趋势中买入。我们进行反转交易的理由不能仅仅基于我们认为市场需要反弹或回调，这样主观的理由往往导致我们的交易以失败告终。趋势有时候可能比很多交易者想象的要长。","pid":"p448"},{"t":"para","text":"交易者可能会在K线11的低点1处卖空，但是由于K线11还处于震荡区间，所以聪明的交易者在看到强劲的下跌K线之前也不应该卖空。这是市场上出现的第二个只取得了一个价位的突破的假性突破。同样，你可以注意到，楔形一般还会有两次反弹尝试（两波反弹浪），所以他们只会在楔形失败的时候卖空（比如，当市场跌破了K线9的低点），或者会在第二波反弹浪失败的时候卖空。","pid":"p449"},{"t":"para","text":"K线12又是一个只突破了一个价位的假性突破，但是在这之前有两波上升浪（K线9和K线11），所以是一个低点2的卖空潮。聪明的交易者将会抓住这绝无仅有的机会卖空，因为它是在熊市旗形中出现的低点2，这个点之所以如此特别，是因为它之前两次的反转向上尝试都失败了（K线10和K线12），这也是这个形的两波上升浪，显而易见，他们非常地弱。同样，在市场中出现连续的三次一个价位的失败突破也是非常罕见的，可以想象的是，接下来市场可能会出现大幅下跌。","pid":"p450"},{"t":"para","text":"当然，交易者也可以等到市场突破了K线9的低点时才开始做空，因为只有到了那个时候，我们才知道楔形真正的失败了。在市场突破K线9的低点的突破口确实出现了猛烈的交易量（在一分钟的K线图上，我们将看到这个突破口出现了14000份合约的交易量），这证实了市场上聪明的交易者确实是等到这个点才开始做空。一个失败的楔形往往会迎来一段相当于楔形高度的移动距离，正如这里可以看到的一样。","pid":"p451"},{"t":"para","text":"在你买入之前，你最先需要看到趋势通道线的突破，最好还可以看到一根反转K线。因为K线9是一根非常弱的反转K线，所以你应该坚持到趋势通道线被突破并且出现反转后再买入。所以你应该等待市场出现一个二次买方入场形态。K线12正是这个二次买方入场形态，但是如果你在此处买入，就相当于在这个四根K线组成的震荡区域的顶部买入，而你永远都不应该在一个熊市趋势中出现的熊市旗形的顶部买入。一旦这个弱二次入场形态也失败了，做空交易者就掌控了整个市场。在你进行做多交易之前，你应该好好考的就是这些内容，而不应该把过多的精力花在劝服自己相信做多是合适的这件事情上。","pid":"p452"},{"t":"para","text":"市场在K线2处打破了双重顶时。交易者应该立即反应过来今天可能是一天的趋势震荡。所以在这种类型的熊市趋势日，最好是进行双向交易。对于做多交易者来说因为是逆趋势交易，所以最好是等到出现了强烈的买方入场形态时再开始做多，比如说K线3和K线4之后出现的两根K线（这是一个二次买方入场形态）。下跌至K线7的下跌浪也是市场的一次突破。但是却并没有形成第三次震荡区间，市场在形成了一个非常狭窄的熊市通道后，再次一路直下。在K线7之前有一波剧烈的下跌浪，K线7之后出现了熊市通道。但是也有交易者会认为剧烈的下跌浪是从K线2至K线3之间的那波下跌浪开始的，而熊市通道是从K线5处开始的。但是这都没有关系，只要你认识到这一天是一个熊市趋势日，并且积极做空就好了。","pid":"p453"},{"t":"para","text":"顺便一提的是，在K线2之前形成了震荡低点的三根十字星K线也是一个微型的楔形形态。","pid":"p454"},{"t":"para","text":"一个价位的突破也是非常重要的，特别是如果有两个突破已经成功了的时候，因为这将构成一个三浪推动模式。在图5.12中，K线4在K线3的一个价位之上，K线5又在K线4的一个价位之上。如果市场在之后出现了一个回调或者震荡区间，之后市场又重新超越了K线5，那么市场上就很可能会出现一个向上突破，而这个微型楔形可能并不足以反转市场。","pid":"p455"},{"t":"para","text":"K线2低于K线1几个点位，而K线6又比K线2低一个点位。在经历了几根K线之后，K线7向下突破了K线6的低点，并且带来了市场的向下突破。通常来说，当市场打破了这些微型三推模式，至少会移动一段可以测量的距离，我们可以用这个震荡区间从顶部到底部的距离来测量这段移动距离，在这里，我们可以看到实际上市场下跌的距离比这段距离更长。","pid":"p456"},{"t":"para","text":"K线8是一个微型楔形底部，同时也是一个一根K线的熊市旗形。这是市场将要暂时停滞的迹象，在一个强劲的熊市趋势中，它并不是一个反转形态。","pid":"p457"}],"wcount":22665},{"id":"p1c6","title":"第6章　扩张三角形","blocks":[{"t":"para","text":"第6章　扩张三角形","pid":"p458"},{"t":"para","text":"扩张三角形可以是一种反转形态，也可以是一种持续整理形态，至少由五个波段构成（有时候是七个波段，极少情况下是九个波段），每个波段比前一个波段更大规模。三角形是一种震荡形态，大部分突破震荡区间的尝试都无功而返。这种行情的倾向性就形成了扩张三角形。在多头反转（扩张三角形底）过程中，市场有足够的力量反弹至最近一个更高的高点上方，并把跟进的多头套住：然后暴跌至第三个低点，在更低的低点处，迫使被套的多头止损出局，诱导新的空头入场，然后再反转上行，导致市场双方在三角形中追涨杀跌。这个新低是行情在三角形中的第三次下推，我们可以把它看作是某种类型的三浪推进模式，或看作是一次突破后的回调","pid":"p459"},{"t":"para","text":"市场向上突破了前一波段的高点，然后回调至一个更低的低点。在空头反转（扩张三角形顶）过程中，情况正好相反。空头在更低的低点处入场后被套，然后强制止损出局，多头在更高的高点处入场后被套，双方不得不在市场最后一次反转下行时追跌杀涨。三角形行情的最初目标是突破三角形对边，而一旦到达另一边，市场往往在这里开始尝试再次反转。如果真的成功突破三角形对边，则表示反转失败，该形态变成一个在原趋势方向上的持续整理形态。","pid":"p460"},{"t":"para","text":"举例而言，如果牛市中价格处于一个扩张三角形顶（反转形态），第一个目标则是向下突破该形态；大部分情况下，这是价格所能达到的最远位置。如果成功向下突破，第二个目标则是走出一波可测量的下跌行情，下跌幅度接近三角形中最后一个上升小波段的高度。如果向下突破失败，市场反转上行，那么三角形就变成一个持续整理形态，由于当前处于牛市之中，这种情况下的三角形就是一个扩张三角形上升旗形。其首个目标便是创出新高，且通常情况下行情走势恰恰如此。如果成功向上突破，下一个目标便是走出一波可测量的上涨行情，上涨幅度接近三角形中最后一个下跌小波段的高度。如果向上突破失败，市场反转下行便形成了七个小波段的更大级别的扩张三角形顶，一开始只有五个小波段。在某个点位上，扩张三角形要么被成功突破，市场走出一波可测量的行情。要么突破失败，并演变成一个大型的震荡区间。","pid":"p461"},{"t":"para","text":"“三角形”这一术语很容易造成误导，因为这种形态一般看起来并不像一个三角形。最突出的特点是它逐步形成一系列更高的高点和更低的低点，不断诱导突破型的交易员入场，并令他们在某些价位上投降认输，然后所有交易员都站在交易的同一边时，市场趋势就此形成。三角形中有三次向上或向下的推进运动，所以也可以被视为三浪推进的反转形态的一种变形，只是每一次推进之后都伴随深度的回调。例如，在一轮熊市的底部发生牛市反转，两次回调都形成更高的高点：但是，在传统的三浪推进形态如楔形底（向下收敛的三角形）中，两次回调都形成更低的高点（即不是扩张三角形）。","pid":"p462"},{"t":"para","text":"所有扩张三角形都是主要趋势反转形态的变形，因为最终反转形态都出现在一个强烈的小波段之后。例如。价格处于扩张三角形底，从最后一个低点处启动的反弹跟随在第二个反弹之后，而第二个反弹足够强势向上突破前一个波段高点，并总是突破一些关键的下跌趋势线。如果我们画一条包含三角形中第二个下降小波段的下跌趋势线，从第二次下推开始的这第二个反弹最低程度可以向上突破这条下跌趋势线，因此第三次下推是一个更低低点的主要趋势反转做多入场形态。涨至第一个或第二个小波段的反弹通常也能突破另外一些主要的下跌趋势线。","pid":"p463"},{"t":"para","text":"熊市中的扩张三角形底，后来往往演变成扩张三角形下降旗形。","pid":"p464"},{"t":"img","src":"assets/img/p1c6_001.webp","ctx":[{"t":"所有扩张三角形都是主要趋势反转形态的变形，因为最终反转形态都出现在一个强烈的小波段之后。例如。价格处于扩张三角形底，从最后一个低点处启动的反弹
