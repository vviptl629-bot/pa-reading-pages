ext":"K线15不是一个很好的高点1做多信号，因为前面的上涨势头不再迅猛。它跟在一波小型的急速高潮上涨运动之后，而这波上涨运动击穿小级别的趋势通道线（虚线），然后反转向下，很可能进入横盘整理，走出至少两个小波段的向下调整行情。另外，信号K线是一根强势阴线，它预示着市场将继续呈现多空对的局面。而市场将双向震荡的迹象来自信号K线倒数第四根K线，这根线也是一根阴线，而且K线15前面的五根K线都反复拉锯，带有显著的上下影线。","pid":"p986"},{"t":"para","text":"K线16是一个高点2做多信号，向上突破小型内含线。充允许交易员设置较窄的止损幅度。","pid":"p987"},{"t":"img","src":"assets/img/p3c2_003.webp","ctx":[{"t":"K线15不是一个很好的高点1做多信号，因为前面的上涨势头不再迅猛。它跟在一波小型的急速高潮上涨运动之后，而这波上涨运动击穿小级别的趋势通道线（虚线），然后反转向下，很可能进入横盘整理，走出至少两个小波段的向下调整行情。另外，信号K线是一根强势阴线，它预示着市场将继续呈现多空对的局面。而市场将双向震荡的迹象来自信号K线倒数第四根K线，这根线也是一根阴线，而且K线15前面的五根K线都反复拉锯，带有显著的上下影线。","p":"p986"},{"t":"K线16是一个高点2做多信号，向上突破小型内含线。充允许交易员设置较窄的止损幅度。","p":"p987"},{"t":"如图18.3所示，开盘后第一个小时，市场常常形成一个双重顶或双重底，这种形态往往出现当天或至少接下来几个小时内的最高价或最低价。AAPL昨天以一段狭窄的震荡区间收盘，这段震荡区间可以看作是最终旗形的入场形态。在当天第一根K线即K线3上，AAPL快速向下突破昨天收盘的上升旗形，然后又向上突破其顶部，形成一个小规模的楔形上升旗形突破行情。然而，这次突破也无功而返，又在下一根K线反转向下。虽然这次在K线4发生的双K线反转是一个还不错的最终旗形做空机会，但上行动能比较强势，原先向下突破失败意味着交易员在做空之前最好等待更多的价格行为。在这个位置上，行情发生了一次失败的下行突破，以及对昨天高点的反转，之后又出现一次失败的旗形突破，使得空头局势更加明朗。","p":"p988"},{"t":"铁丝网行情诱使多头在高点2买入，而K线5发生在铁丝网末端，这是一个不错的做空机会，在高点2信号K线（K线5前面那根K线）低点下方以低一个价位入场。这根K线引诱多头入场，然后迫使他们离场。市场可能在移动平均线上以及K线2和K线3之间的上升旗形内找到支撑力量，交易员们对自己的空头头寸非常谨慎。任何区域内当K线反复震荡，尤其K线较长，区间内发生多次反转时，都是一个多空强烈胶着的区域。多头将在区间下方买入而不在上方做多，空头将在区间上方卖出而不在下方做空。结果就导致尝试突破的力量被拉回区间之内，如图所示，K线3、9和11的空头突破，K线4和7的多头突破。","p":"p989"},{"t":"K线6是一个多头反转的信号，它是一次失败的突破，是上涨趋势中回落至移动平均线的第二回合下降小波段（大部分K线都位于上升的移动平均线上方），一次双K线反转，跌至移动平均线回调行情中的一根阳线。","p":"p990"},{"t":"请注意跌至K线6的抛售行情突破了趋势线，这表明空头意图开始变得激进，交易员们预期行情将对K线4这一上涨趋势的顶部发起冲击，然后测试失败。","p":"p991"},{"t":"K线7是一根反转K线，它突破冲击新高后回落。这是试图向上突破昨天高点的第二次失败的尝试（K线4是第一次），并构建出一个楔形顶和一个更高高点的主要趋势反转。由于从当天到目前为止的振幅只有近日平均振幅的一半，那么价格很可能朝某个方面突破，扩大当天振幅，并走出至少两个回合的小波段（趋势型交易员也许会自信地在任意回调后对行情做第二次下推）。K线7试图第二次向上突破昨天高点，并以失败告终，每当市场两次尝试两次均无功而返时，行情通常朝相反方向发展。于是K线7双重顶（也是上涨趋势中的第三次上推）成为当天顶部。","p":"p992"},{"t":"K线7的后面四根K线构成了一个上升旗形，价格以两根长阴线强势向下突破了这一旗形，很多交易员会认为市场已经进入空头格局。有些交易员则需要更多的证据来支撑自己对当前行情的判断。","p":"p993"},{"t":"K线9向下突破了K线6波段低点，这个波段低点并非当天低点。由于当前的振幅依然较小。市场又两次都没能将向上突破昨天高点后的行情延续下去，那么接下来价格再次下行测试当天低点的概率非常高，这个位置拥有磁石效应。市场现正处于这个波段低点的磁场范围内。","p":"p994"},{"t":"K线10结束了铁丝网行情。由于所有人都相信行情将再次下行并测试当天新低，且K线10在前面小型内含线下方提供了一个很好的低点2做空信号。同时它也是一次向下突破K线6后的突破回调入场机会。最后，这样一根大型的突破K线，收盘收在其最低点，而早前需要更多证据的交易员现在终于确信市场真正进入空头格局。市场非常坚信价格将进一步走低，且很可能走出一波近似可测量的下跌行情。","p":"p995"},{"t":"回调至K线10的铁丝网行情突破了小级别的下跌趋势线（未显示），这段行情可能成为第一回合下降小波段结束后的调整行情，但下行动能依然非常强劲，多头并没有足够信心支持他们积极买入。他们需要更多的价格行为来支撑自己做多。","p":"p996"},{"t":"跌至K线11当天新低的突破行情基本上是直线下跌。此处不太可能成为这波抛售的结尾（交易员们会等待第二回合的下降小波段，至少回踩K线11的低点）。由于这里没能突破下跌趋势通道线（这条通道线开始于K线8前面那根K线），因此接下来很可能先走出两个上升小波段。","p":"p997"},{"t":"K线12是一个小型的双重底回调做多入场形态，出现在小型的K线11双重底之后，但由于先前缺少对趋势线的突破或强势的反转K线，所以这里只适合进行刮头皮操作。另外。由于行情很可能走出第二回合的下降小波段，也没有证据显示市场格局由空转多，因此集中精力关注做空机会或加大空头头寸，比起在七根带长影线的休整K线之后分心去进行小规模的多头刮头皮交易，显然要明智得多。","p":"p998"},{"t":"K线13是另一次低点2做空信号，但反弹至移动平均线的行情突破了一条很好的下跌趋势线。这对于多空双方来说都是一个信号，这表明接下来如果反转力量足够强大，从新波段低点反转向上的行情很大机会走出两个回合的上升小波段。低点2做空信号是第二次入场机会，它是一根在移动平均线的信号阴线，它的出现大大提高了成功率。","p":"p999"},{"t":"价格从K线13开始下跌，并形成强度适中的双K线下降尖型，K线14在其后出现，它是另一次低点2做空信号。","p":"p1000"},{"t":"K线15是一次突破至新低后的双K线向上反转。价格击穿两条下跌趋势通道线后，在新低处强势反转，形成反转阳线。第一条趋势线突破回调至K线13，并测试K线1这一昨天最低低点，然后在K线15处走出第二回合下降小波段（小急速后面的通道是第一回合的下降小波段）。有些交易员把它看作双重底买入形态，而其他交易员则把它看作强势反弹至K线7后的一个更高低点。它是从当天高点回落的第二回合下降小波段，以及以K线3和K线11为头两次下推的大型楔形上升旗形底部。所有这些迹象都加大了反弹行情将走出两个小波段的概率。第二回合的小波段结束于K线16，且向上突破了第一回合小波段的高点，并开始反转。价格没能成功向上突破K线14高点，而与K线14一起组成了一个双重顶下降旗形。跟在K线13下降急速后面的是一段抛物线式的下降通道。K线15也是这段通道底部。另外有些交易员把K线8低点前面的两根阴线视为更重要的急速，他们认为下降通道开始于K线10。有些交易员单把K线10看作一个急速，而把K线13启动的下跌运动看作通道。有些交易员则认为K线4后面的那根阴线。或K线5这根阴线也是重要的急速。他们把K线7看作更高高点的突破回调。","p":"p1001"},{"t":"顺便提及的是，每当一波强势的上涨运动结束于三次上推，而之后抛售的动能又相对较弱（斜率较小，趋势K线较短，影线更多）时，早前三次上推的高点有很大机会不久将会被超越，因为这个底部在更大级别的时间周期图表上可能只是一个更高的低点。市场在第二天开盘就实现了目标。如果市场持续走高，那么下一个目标则是从双重底启动的一波可测量的上涨行情。而实际情况是，这其中的每一根阴线都代表了一定的抛压，市场的空头力量正逐步累积。一旦空头力量累积到一定程度足以压制多头，市场就会应声下跌。","p":"p1002"}]},{"t":"para","text":"如图18.3所示，开盘后第一个小时，市场常常形成一个双重顶或双重底，这种形态往往出现当天或至少接下来几个小时内的最高价或最低价。AAPL昨天以一段狭窄的震荡区间收盘，这段震荡区间可以看作是最终旗形的入场形态。在当天第一根K线即K线3上，AAPL快速向下突破昨天收盘的上升旗形，然后又向上突破其顶部，形成一个小规模的楔形上升旗形突破行情。然而，这次突破也无功而返，又在下一根K线反转向下。虽然这次在K线4发生的双K线反转是一个还不错的最终旗形做空机会，但上行动能比较强势，原先向下突破失败意味着交易员在做空之前最好等待更多的价格行为。在这个位置上，行情发生了一次失败的下行突破，以及对昨天高点的反转，之后又出现一次失败的旗形突破，使得空头局势更加明朗。","pid":"p988"},{"t":"para","text":"铁丝网行情诱使多头在高点2买入，而K线5发生在铁丝网末端，这是一个不错的做空机会，在高点2信号K线（K线5前面那根K线）低点下方以低一个价位入场。这根K线引诱多头入场，然后迫使他们离场。市场可能在移动平均线上以及K线2和K线3之间的上升旗形内找到支撑力量，交易员们对自己的空头头寸非常谨慎。任何区域内当K线反复震荡，尤其K线较长，区间内发生多次反转时，都是一个多空强烈胶着的区域。多头将在区间下方买入而不在上方做多，空头将在区间上方卖出而不在下方做空。结果就导致尝试突破的力量被拉回区间之内，如图所示，K线3、9和11的空头突破，K线4和7的多头突破。","pid":"p989"},{"t":"para","text":"K线6是一个多头反转的信号，它是一次失败的突破，是上涨趋势中回落至移动平均线的第二回合下降小波段（大部分K线都位于上升的移动平均线上方），一次双K线反转，跌至移动平均线回调行情中的一根阳线。","pid":"p990"},{"t":"para","text":"请注意跌至K线6的抛售行情突破了趋势线，这表明空头意图开始变得激进，交易员们预期行情将对K线4这一上涨趋势的顶部发起冲击，然后测试失败。","pid":"p991"},{"t":"para","text":"K线7是一根反转K线，它突破冲击新高后回落。这是试图向上突破昨天高点的第二次失败的尝试（K线4是第一次），并构建出一个楔形顶和一个更高高点的主要趋势反转。由于从当天到目前为止的振幅只有近日平均振幅的一半，那么价格很可能朝某个方面突破，扩大当天振幅，并走出至少两个回合的小波段（趋势型交易员也许会自信地在任意回调后对行情做第二次下推）。K线7试图第二次向上突破昨天高点，并以失败告终，每当市场两次尝试两次均无功而返时，行情通常朝相反方向发展。于是K线7双重顶（也是上涨趋势中的第三次上推）成为当天顶部。","pid":"p992"},{"t":"para","text":"K线7的后面四根K线构成了一个上升旗形，价格以两根长阴线强势向下突破了这一旗形，很多交易员会认为市场已经进入空头格局。有些交易员则需要更多的证据来支撑自己对当前行情的判断。","pid":"p993"},{"t":"para","text":"K线9向下突破了K线6波段低点，这个波段低点并非当天低点。由于当前的振幅依然较小。市场又两次都没能将向上突破昨天高点后的行情延续下去，那么接下来价格再次下行测试当天低点的概率非常高，这个位置拥有磁石效应。市场现正处于这个波段低点的磁场范围内。","pid":"p994"},{"t":"para","text":"K线10结束了铁丝网行情。由于所有人都相信行情将再次下行并测试当天新低，且K线10在前面小型内含线下方提供了一个很好的低点2做空信号。同时它也是一次向下突破K线6后的突破回调入场机会。最后，这样一根大型的突破K线，收盘收在其最低点，而早前需要更多证据的交易员现在终于确信市场真正进入空头格局。市场非常坚信价格将进一步走低，且很可能走出一波近似可测量的下跌行情。","pid":"p995"},{"t":"para","text":"回调至K线10的铁丝网行情突破了小级别的下跌趋势线（未显示），这段行情可能成为第一回合下降小波段结束后的调整行情，但下行动能依然非常强劲，多头并没有足够信心支持他们积极买入。他们需要更多的价格行为来支撑自己做多。","pid":"p996"},{"t":"para","text":"跌至K线11当天新低的突破行情基本上是直线下跌。此处不太可能成为这波抛售的结尾（交易员们会等待第二回合的下降小波段，至少回踩K线11的低点）。由于这里没能突破下跌趋势通道线（这条通道线开始于K线8前面那根K线），因此接下来很可能先走出两个上升小波段。","pid":"p997"},{"t":"para","text":"K线12是一个小型的双重底回调做多入场形态，出现在小型的K线11双重底之后，但由于先前缺少对趋势线的突破或强势的反转K线，所以这里只适合进行刮头皮操作。另外。由于行情很可能走出第二回合的下降小波段，也没有证据显示市场格局由空转多，因此集中精力关注做空机会或加大空头头寸，比起在七根带长影线的休整K线之后分心去进行小规模的多头刮头皮交易，显然要明智得多。","pid":"p998"},{"t":"para","text":"K线13是另一次低点2做空信号，但反弹至移动平均线的行情突破了一条很好的下跌趋势线。这对于多空双方来说都是一个信号，这表明接下来如果反转力量足够强大，从新波段低点反转向上的行情很大机会走出两个回合的上升小波段。低点2做空信号是第二次入场机会，它是一根在移动平均线的信号阴线，它的出现大大提高了成功率。","pid":"p999"},{"t":"para","text":"价格从K线13开始下跌，并形成强度适中的双K线下降尖型，K线14在其后出现，它是另一次低点2做空信号。","pid":"p1000"},{"t":"para","text":"K线15是一次突破至新低后的双K线向上反转。价格击穿两条下跌趋势通道线后，在新低处强势反转，形成反转阳线。第一条趋势线突破回调至K线13，并测试K线1这一昨天最低低点，然后在K线15处走出第二回合下降小波段（小急速后面的通道是第一回合的下降小波段）。有些交易员把它看作双重底买入形态，而其他交易员则把它看作强势反弹至K线7后的一个更高低点。它是从当天高点回落的第二回合下降小波段，以及以K线3和K线11为头两次下推的大型楔形上升旗形底部。所有这些迹象都加大了反弹行情将走出两个小波段的概率。第二回合的小波段结束于K线16，且向上突破了第一回合小波段的高点，并开始反转。价格没能成功向上突破K线14高点，而与K线14一起组成了一个双重顶下降旗形。跟在K线13下降急速后面的是一段抛物线式的下降通道。K线15也是这段通道底部。另外有些交易员把K线8低点前面的两根阴线视为更重要的急速，他们认为下降通道开始于K线10。有些交易员单把K线10看作一个急速，而把K线13启动的下跌运动看作通道。有些交易员则认为K线4后面的那根阴线。或K线5这根阴线也是重要的急速。他们把K线7看作更高高点的突破回调。","pid":"p1001"},{"t":"para","text":"顺便提及的是，每当一波强势的上涨运动结束于三次上推，而之后抛售的动能又相对较弱（斜率较小，趋势K线较短，影线更多）时，早前三次上推的高点有很大机会不久将会被超越，因为这个底部在更大级别的时间周期图表上可能只是一个更高的低点。市场在第二天开盘就实现了目标。如果市场持续走高，那么下一个目标则是从双重底启动的一波可测量的上涨行情。而实际情况是，这其中的每一根阴线都代表了一定的抛压，市场的空头力量正逐步累积。一旦空头力量累积到一定程度足以压制多头，市场就会应声下跌。","pid":"p1002"},{"t":"img","src":"assets/img/p3c2_004.webp","ctx":[{"t":"K线15是一次突破至新低后的双K线向上反转。价格击穿两条下跌趋势通道线后，在新低处强势反转，形成反转阳线。第一条趋势线突破回调至K线13，并测试K线1这一昨天最低低点，然后在K线15处走出第二回合下降小波段（小急速后面的通道是第一回合的下降小波段）。有些交易员把它看作双重底买入形态，而其他交易员则把它看作强势反弹至K线7后的一个更高低点。它是从当天高点回落的第二回合下降小波段，以及以K线3和K线11为头两次下推的大型楔形上升旗形底部。所有这些迹象都加大了反弹行情将走出两个小波段的概率。第二回合的小波段结束于K线16，且向上突破了第一回合小波段的高点，并开始反转。价格没能成功向上突破K线14高点，而与K线14一起组成了一个双重顶下降旗形。跟在K线13下降急速后面的是一段抛物线式的下降通道。K线15也是这段通道底部。另外有些交易员把K线8低点前面的两根阴线视为更重要的急速，他们认为下降通道开始于K线10。有些交易员单把K线10看作一个急速，而把K线13启动的下跌运动看作通道。有些交易员则认为K线4后面的那根阴线。或K线5这根阴线也是重要的急速。他们把K线7看作更高高点的突破回调。","p":"p1001"},{"t":"顺便提及的是，每当一波强势的上涨运动结束于三次上推，而之后抛售的动能又相对较弱（斜率较小，趋势K线较短，影线更多）时，早前三次上推的高点有很大机会不久将会被超越，因为这个底部在更大级别的时间周期图表上可能只是一个更高的低点。市场在第二天开盘就实现了目标。如果市场持续走高，那么下一个目标则是从双重底启动的一波可测量的上涨行情。而实际情况是，这其中的每一根阴线都代表了一定的抛压，市场的空头力量正逐步累积。一旦空头力量累积到一定程度足以压制多头，市场就会应声下跌。","p":"p1002"},{"t":"如图18.4所示，当天的第一根K线往往是对昨天通道的突破。昨天是一个上涨趋势型的震荡交易日，它形成一轮高潮通道上涨趋势，走出三波上推行情。市场在收盘时向下突破通道，并在今天开盘时跳空进一步加大突破幅度。K线1是一次突破回调做空入场形态，它很可能成为当天这轮启动于开盘时段的下跌趋势的起点。","p":"p1003"},{"t":"K线3尝试形成一次失败的突破开盘反转，但下跌运动在一条陡峭的通道内运行。这使得在K线3处买入风险较大，尽管当天已经出现了三次小规模的下推行情。但如果下跌运动处于狭窄的通道内，更为安全的做法是等待行情突破并回调。然后再进行买入。","p":"p1004"},{"t":"K线5是一次更低低点的突破回调，它试图与昨天的低点（K线5与昨天的低点几乎同一价位）组成一个双重底。这里引出一波小型的楔形反弹，并在K线6处形成双重顶下降旗形。","p":"p1005"},{"t":"双重顶下降旗形是一种开盘后首次下跌常见的入场形态，尤其在股票市场中，随后往往延伸出一段下跌趋势，并形成呈下跌趋势的震荡区间。K线6这根信号K线是一根移动平均线跳空K线。","p":"p1006"},{"t":"虽然突破当天低点的势头并未得到进一步发展，但K线7依然构成了一次突破回调做空入场形态。它也是一次失败的双重底回调，一次成功的双重顶回调入场形态，一次对始于K线6微型下降通道的失败突破。","p":"p1007"},{"t":"行情向下突破昨天与今天的低点，在K线9处形成了双波段突破回调。","p":"p1008"},{"t":"持续昨天一整天的上涨趋势实际上只是一个大型的下降旗形，今天的行情对其突破并继续下跌。今天是一个趋势型的震荡下跌态势，这波行情启动于开盘时段，并形成一轮跳空急速通道下跌趋势。","p":"p1009"},{"t":"下降通道是一种上升旗形，开盘价格对它向上突破后，常常出现突破回调买入信息。","p":"p1010"}]},{"t":"para","text":"如图18.4所示，当天的第一根K线往往是对昨天通道的突破。昨天是一个上涨趋势型的震荡交易日，它形成一轮高潮通道上涨趋势，走出三波上推行情。市场在收盘时向下突破通道，并在今天开盘时跳空进一步加大突破幅度。K线1是一次突破回调做空入场形态，它很可能成为当天这轮启动于开盘时段的下跌趋势的起点。","pid":"p1003"},{"t":"para","text":"K线3尝试形成一次失败的突破开盘反转，但下跌运动在一条陡峭的通道内运行。这使得在K线3处买入风险较大，尽管当天已经出现了三次小规模的下推行情。但如果下跌运动处于狭窄的通道内，更为安全的做法是等待行情突破并回调。然后再进行买入。","pid":"p1004"},{"t":"para","text":"K线5是一次更低低点的突破回调，它试图与昨天的低点（K线5与昨天的低点几乎同一价位）组成一个双重底。这里引出一波小型的楔形反弹，并在K线6处形成双重顶下降旗形。","pid":"p1005"},{"t":"para","text":"双重顶下降旗形是一种开盘后首次下跌常见的入场形态，尤其在股票市场中，随后往往延伸出一段下跌趋势，并形成呈下跌趋势的震荡区间。K线6这根信号K线是一根移动平均线跳空K线。","pid":"p1006"},{"t":"para","text":"虽然突破当天低点的势头并未得到进一步发展，但K线7依然构成了一次突破回调做空入场形态。它也是一次失败的双重底回调，一次成功的双重顶回调入场形态，一次对始于K线6微型下降通道的失败突破。","pid":"p1007"},{"t":"para","text":"行情向下突破昨天与今天的低点，在K线9处形成了双波段突破回调。","pid":"p1008"},{"t":"para","text":"持续昨天一整天的上涨趋势实际上只是一个大型的下降旗形，今天的行情对其突破并继续下跌。今天是一个趋势型的震荡下跌态势，这波行情启动于开盘时段，并形成一轮跳空急速通道下跌趋势。","pid":"p1009"},{"t":"para","text":"下降通道是一种上升旗形，开盘价格对它向上突破后，常常出现突破回调买入信息。","pid":"p1010"},{"t":"img","src":"assets/img/p3c2_005.webp","ctx":[{"t":"持续昨天一整天的上涨趋势实际上只是一个大型的下降旗形，今天的行情对其突破并继续下跌。今天是一个趋势型的震荡下跌态势，这波行情启动于开盘时段，并形成一轮跳空急速通道下跌趋势。","p":"p1009"},{"t":"下降通道是一种上升旗形，开盘价格对它向上突破后，常常出现突破回调买入信息。","p":"p1010"},{"t":"如图18.5所示。昨天呈现下跌趋势行情，但K线4向上突破了主要趋势线，这表明市场很可能试图在回踩K线3低点收盘。","p":"p1011"},{"t":"K线4反弹处形成了一条新的、较为平缓的主要趋势线，K线8向上突破该趋势线，然后行情在K线9处走出一波小规模的双波段突破回调（两根阴线被中间那根阳线隔开），正好回调至移动平均线。这次突破回调，形成了更高低点的主要趋势反转，在开盘时段引出一波当天的上涨趋势行情。当头5至10根K线形成一个震荡区间时，很多机构投资者会在区间突破口处入场，这些突破常常引发一整天的趋势行情。较早入场风险较低，比如这个例子中在移动平均线测试K线上方入场。","p":"p1012"},{"t":"K线10是第三次上推（三段趋势型的交易区间），因此预期将出现双波段回调。然后，涨至K线10的通道非常紧凑，因而对这条通道的向下突破以及双波段下跌之后，行情很可能对高点发起冲击。","p":"p1013"},{"t":"太平洋标准时间上午11：45，K线11回踩前一段震荡区间的低点这波迅猛的下滑运动将多头震出场外。它形成了一个移动平均线跳空K线做多场形态，也是一个高点2入场形态，这个最终上升波段突破了第三段交易区间的顶部，并将行情延伸至一波可测量的上涨运动，一直持续到收盘（幅度为K线10到K线11下跌幅度的两倍）。","p":"p1014"},{"t":"这是一轮高潮通道上涨趋势，它随后走出一个双重底上升旗形（由K线11和两小时以前的震荡区间底部构成），形成了一个启动于开盘时段的上涨趋势交易日。","p":"p1015"},{"t":"前一天的形态几乎总是影响着今天开盘后的第一个小时。","p":"p1016"}]},{"t":"para","text":"如图18.5所示。昨天呈现下跌趋势行情，但K线4向上突破了主要趋势线，这表明市场很可能试图在回踩K线3低点收盘。","pid":"p1011"},{"t":"para","text":"K线4反弹处形成了一条新的、较为平缓的主要趋势线，K线8向上突破该趋势线，然后行情在K线9处走出一波小规模的双波段突破回调（两根阴线被中间那根阳线隔开），正好回调至移动平均线。这次突破回调，形成了更高低点的主要趋势反转，在开盘时段引出一波当天的上涨趋势行情。当头5至10根K线形成一个震荡区间时，很多机构投资者会在区间突破口处入场，这些突破常常引发一整天的趋势行情。较早入场风险较低，比如这个例子中在移动平均线测试K线上方入场。","pid":"p1012"},{"t":"para","text":"K线10是第三次上推（三段趋势型的交易区间），因此预期将出现双波段回调。然后，涨至K线10的通道非常紧凑，因而对这条通道的向下突破以及双波段下跌之后，行情很可能对高点发起冲击。","pid":"p1013"},{"t":"para","text":"太平洋标准时间上午11：45，K线11回踩前一段震荡区间的低点这波迅猛的下滑运动将多头震出场外。它形成了一个移动平均线跳空K线做多场形态，也是一个高点2入场形态，这个最终上升波段突破了第三段交易区间的顶部，并将行情延伸至一波可测量的上涨运动，一直持续到收盘（幅度为K线10到K线11下跌幅度的两倍）。","pid":"p1014"},{"t":"para","text":"这是一轮高潮通道上涨趋势，它随后走出一个双重底上升旗形（由K线11和两小时以前的震荡区间底部构成），形成了一个启动于开盘时段的上涨趋势交易日。","pid":"p1015"},{"t":"para","text":"前一天的形态几乎总是影响着今天开盘后的第一个小时。","pid":"p1016"},{"t":"img","src":"assets/img/p3c2_006.webp","ctx":[{"t":"这是一轮高潮通道上涨趋势，它随后走出一个双重底上升旗形（由K线11和两小时以前的震荡区间底部构成），形成了一个启动于开盘时段的上涨趋势交易日。","p":"p1015"},{"t":"前一天的形态几乎总是影响着今天开盘后的第一个小时。","p":"p1016"},{"t":"请看图18.6，不用太纠结于图中细小的K线，而是把关注点转移到概念中来。","p":"p1017"},{"t":"K线1处发生迅猛的回调，测试昨天强势的收盘价，然后很快反转向上，在K线1回调的高点上方一个价位处创造了买入点，并在当天第一根K线的高点上方再次创造买入点。","p":"p1018"},{"t":"K线4是一个突破回调做空入场形态。在K线3这一次高点后，开盘产生了一个更低的低点，以及一个主要趋势反转，K线4处形成了一个低点2做空信号。","p":"p1019"},{"t":"K线5处发生开盘反转，随后走出一个更低低点的主要趋势反转，试探昨天下跌趋势线被突破后的熊市低点。今天开盘后价格一开始上行，然后下行回踩这一更低的低点。由于K线5构成第二回合的下降小波段（昨天的收盘价为第一回合的下降小波段），这次在K线5上方的突破回调入场机会实际上是一次高点2形态，昨天最后一根K线与早前的低点一起构成了一个小型的双重底。","p":"p1020"},{"t":"小型K线6形成一个更低的高点，然后价格突破趋势线，产生一个突破回调的做空形态。当天第一根K线测试了趋势线下方，然后反转向上，但这一波上涨在K线6处结束。","p":"p1021"},{"t":"K线7是一个突破主要下跌趋势线后的楔形做多入场形态（价格试图向下突破下跌趋势通道线和昨天低点，最终失败）。价格向下突破小级别趋势通道线后反转向上。","p":"p1022"},{"t":"价格向上突破趋势线，测试昨天收盘价，并在K线8处发生突破回调。下降通道是一种上升旗形，因此K线8是一个突破回调做多入场形态。市场强势反转至昨天开盘价后，走出了双波段的回调行情，并在K线8处结束。K线8突破回调形成更高的低点后，最简单的入场时机是在K线9这一高点2处。","p":"p1023"}]},{"t":"para","text":"请看图18.6，不用太纠结于图中细小的K线，而是把关注点转移到概念中来。","pid":"p1017"},{"t":"para","text":"K线1处发生迅猛的回调，测试昨天强势的收盘价，然后很快反转向上，在K线1回调的高点上方一个价位处创造了买入点，并在当天第一根K线的高点上方再次创造买入点。","pid":"p1018"},{"t":"para","text":"K线4是一个突破回调做空入场形态。在K线3这一次高点后，开盘产生了一个更低的低点，以及一个主要趋势反转，K线4处形成了一个低点2做空信号。","pid":"p1019"},{"t":"para","text":"K线5处发生开盘反转，随后走出一个更低低点的主要趋势反转，试探昨天下跌趋势线被突破后的熊市低点。今天开盘后价格一开始上行，然后下行回踩这一更低的低点。由于K线5构成第二回合的下降小波段（昨天的收盘价为第一回合的下降小波段），这次在K线5上方的突破回调入场机会实际上是一次高点2形态，昨天最后一根K线与早前的低点一起构成了一个小型的双重底。","pid":"p1020"},{"t":"para","text":"小型K线6形成一个更低的高点，然后价格突破趋势线，产生一个突破回调的做空形态。当天第一根K线测试了趋势线下方，然后反转向上，但这一波上涨在K线6处结束。","pid":"p1021"},{"t":"para","text":"K线7是一个突破主要下跌趋势线后的楔形做多入场形态（价格试图向下突破下跌趋势通道线和昨天低点，最终失败）。价格向下突破小级别趋势通道线后反转向上。","pid":"p1022"},{"t":"para","text":"价格向上突破趋势线，测试昨天收盘价，并在K线8处发生突破回调。下降通道是一种上升旗形，因此K线8是一个突破回调做多入场形态。市场强势反转至昨天开盘价后，走出了双波段的回调行情，并在K线8处结束。K线8突破回调形成更高的低点后，最简单的入场时机是在K线9这一高点2处。","pid":"p1023"}],"wcount":8557},{"id":"p3c3","title":"第19章　开盘形态与反转","blocks":[{"t":"para","text":"第19章　开盘形态与反转","pid":"p1024"},{"t":"para","text":"当开盘时段的波幅为近日平均日振幅的一半左右，市场通常会突破这一开盘区间，并尝试把波幅扩大将近一倍。有时在开盘时段我们有很多选择。到底哪种选择才是正确的呢？他们都是正确的，因为不同类型的交易员会依据不同的开盘情况制定不同的交易决策，","pid":"p1025"},{"t":"img","src":"assets/img/p3c3_001.webp","ctx":[{"t":"第19章　开盘形态与反转","p":"p1024"},{"t":"当开盘时段的波幅为近日平均日振幅的一半左右，市场通常会突破这一开盘区间，并尝试把波幅扩大将近一倍。有时在开盘时段我们有很多选择。到底哪种选择才是正确的呢？他们都是正确的，因为不同类型的交易员会依据不同的开盘情况制定不同的交易决策，","p":"p1025"},{"t":"但如图19.1所示的交易日中，图表对于应该获利了结甚至应该反转交易并没有给出精确的指导。大部分支撑位，如可测量运动的投影位置，都没能引发行情反转，这是因为市场存在惯性，强烈倾向于延续之前的价格行为。这也就意味着大部分的反转尝试都以失败告终。不过，当市场最终真正出现反转时，总是发生在某个支撑位上。如果支撑位上出现了一个强势的反转入场形态，那么就更有可能引出一笔盈利可观的交易。截至K线5，当天的波幅依然只有近日平均日振幅的一半左右，扩大区间幅度的概率显著提高。随着每一次新的反转，开盘时段的波幅逐步增大，但跌至K线6的抛售势头较为强烈，这次突破很可能引发另一波近似幅度的可测量下跌行情。","p":"p1026"},{"t":"当天行情呈趋势型震荡，并在收盘前突破回到上方的交易区间，这种情况很常见。这里，当天收盘价位于上方交易区间的顶部附近，使得当天成为一个反转交易日。大部分反转交易日都以趋势型震荡行情为开端。如果交易员们明白这一点，当价格从下方交易区间的底部反转向上时，他们就可以伺机将他们的部分头寸波段化操作。","p":"p1027"},{"t":"开盘后第一个小时内的反转只有25%左右的概率能形成波段，因此最好是先进行刮头皮交易，直到出现双重底或双重顶，或一个清晰的入场形态，使形成波段的可能性增加，才再考虑波段交易。今天是一个普通的交易日，开盘后的很多入场形态只适合用于刮头皮操作。K线3与K线1构成双重顶，有50%的机会成为当天高点。它也是一次移动平均线的突破回调。K线4与K线2构成双重底，有50%的机会成为当天低点。但两者都没能成为当天的最高点或最低点。一天中的最高点或最低点有九成机会出现在当天开盘后头一两个小时内，而且通常来自某种形式的双重顶或双重底。K线5与K线3构成双重顶，一个小型的楔形顶部，一根移动平均线的跳空K线，它最终成为当天高点。","p":"p1028"},{"t":"当散户投资者控制了每天较大部分的成交量时，他们会根据日线图在开盘前下单，为开盘的跳空缺口与反转贡献力量。例如，如果出现一根反转阳线，交易员收盘后看到这根K线，并在下一次开盘前在其高点上方挂单买入。他们非常担心错过买入点，以至于愿意在开盘瞬间就立刻买入，即使买在那根K线高点上方也在所不惜。这常常导致市场跳空高开，以寻找足够的卖家愿意成为其交易对手方。一旦这些过于急迫的买家以虚高的价格入场时，市场就会开始下行。直到机构投资者认为当前价格合理。然后他们在此处重仓买入，把市场向上反转至新高，创造了开盘多头反转。日线图上，。开盘时小规模的短暂抛售使阳线底部走出下影线，这种情况在上涨趋势的交易日里很常见。相反的情形常常发生在下跌趋势的交易日里，迫切的多头急于在开盘时离场，他们甚至愿意在当天的第一笔交易就卖出。市场常常跳空低开以寻找足够的买家。一旦他们的卖单被执行，市场就会开始上行，直到机构投资者认为当前价格可以合理卖出。这就把市场向下反转至当天新低，而当天常常成为一个下跌趋势的交易日。","p":"p1029"}]},{"t":"para","text":"但如图19.1所示的交易日中，图表对于应该获利了结甚至应该反转交易并没有给出精确的指导。大部分支撑位，如可测量运动的投影位置，都没能引发行情反转，这是因为市场存在惯性，强烈倾向于延续之前的价格行为。这也就意味着大部分的反转尝试都以失败告终。不过，当市场最终真正出现反转时，总是发生在某个支撑位上。如果支撑位上出现了一个强势的反转入场形态，那么就更有可能引出一笔盈利可观的交易。截至K线5，当天的波幅依然只有近日平均日振幅的一半左右，扩大区间幅度的概率显著提高。随着每一次新的反转，开盘时段的波幅逐步增大，但跌至K线6的抛售势头较为强烈，这次突破很可能引发另一波近似幅度的可测量下跌行情。","pid":"p1026"},{"t":"para","text":"当天行情呈趋势型震荡，并在收盘前突破回到上方的交易区间，这种情况很常见。这里，当天收盘价位于上方交易区间的顶部附近，使得当天成为一个反转交易日。大部分反转交易日都以趋势型震荡行情为开端。如果交易员们明白这一点，当价格从下方交易区间的底部反转向上时，他们就可以伺机将他们的部分头寸波段化操作。","pid":"p1027"},{"t":"para","text":"开盘后第一个小时内的反转只有25%左右的概率能形成波段，因此最好是先进行刮头皮交易，直到出现双重底或双重顶，或一个清晰的入场形态，使形成波段的可能性增加，才再考虑波段交易。今天是一个普通的交易日，开盘后的很多入场形态只适合用于刮头皮操作。K线3与K线1构成双重顶，有50%的机会成为当天高点。它也是一次移动平均线的突破回调。K线4与K线2构成双重底，有50%的机会成为当天低点。但两者都没能成为当天的最高点或最低点。一天中的最高点或最低点有九成机会出现在当天开盘后头一两个小时内，而且通常来自某种形式的双重顶或双重底。K线5与K线3构成双重顶，一个小型的楔形顶部，一根移动平均线的跳空K线，它最终成为当天高点。","pid":"p1028"},{"t":"para","text":"当散户投资者控制了每天较大部分的成交量时，他们会根据日线图在开盘前下单，为开盘的跳空缺口与反转贡献力量。例如，如果出现一根反转阳线，交易员收盘后看到这根K线，并在下一次开盘前在其高点上方挂单买入。他们非常担心错过买入点，以至于愿意在开盘瞬间就立刻买入，即使买在那根K线高点上方也在所不惜。这常常导致市场跳空高开，以寻找足够的卖家愿意成为其交易对手方。一旦这些过于急迫的买家以虚高的价格入场时，市场就会开始下行。直到机构投资者认为当前价格合理。然后他们在此处重仓买入，把市场向上反转至新高，创造了开盘多头反转。日线图上，。开盘时小规模的短暂抛售使阳线底部走出下影线，这种情况在上涨趋势的交易日里很常见。相反的情形常常发生在下跌趋势的交易日里，迫切的多头急于在开盘时离场，他们甚至愿意在当天的第一笔交易就卖出。市场常常跳空低开以寻找足够的买家。一旦他们的卖单被执行，市场就会开始上行，直到机构投资者认为当前价格可以合理卖出。这就把市场向下反转至当天新低，而当天常常成为一个下跌趋势的交易日。","pid":"p1029"},{"t":"img","src":"assets/img/p3c3_002.webp","ctx":[{"t":"开盘后第一个小时内的反转只有25%左右的概率能形成波段，因此最好是先进行刮头皮交易，直到出现双重底或双重顶，或一个清晰的入场形态，使形成波段的可能性增加，才再考虑波段交易。今天是一个普通的交易日，开盘后的很多入场形态只适合用于刮头皮操作。K线3与K线1构成双重顶，有50%的机会成为当天高点。它也是一次移动平均线的突破回调。K线4与K线2构成双重底，有50%的机会成为当天低点。但两者都没能成为当天的最高点或最低点。一天中的最高点或最低点有九成机会出现在当天开盘后头一两个小时内，而且通常来自某种形式的双重顶或双重底。K线5与K线3构成双重顶，一个小型的楔形顶部，一根移动平均线的跳空K线，它最终成为当天高点。","p":"p1028"},{"t":"当散户投资者控制了每天较大部分的成交量时，他们会根据日线图在开盘前下单，为开盘的跳空缺口与反转贡献力量。例如，如果出现一根反转阳线，交易员收盘后看到这根K线，并在下一次开盘前在其高点上方挂单买入。他们非常担心错过买入点，以至于愿意在开盘瞬间就立刻买入，即使买在那根K线高点上方也在所不惜。这常常导致市场跳空高开，以寻找足够的卖家愿意成为其交易对手方。一旦这些过于急迫的买家以虚高的价格入场时，市场就会开始下行。直到机构投资者认为当前价格合理。然后他们在此处重仓买入，把市场向上反转至新高，创造了开盘多头反转。日线图上，。开盘时小规模的短暂抛售使阳线底部走出下影线，这种情况在上涨趋势的交易日里很常见。相反的情形常常发生在下跌趋势的交易日里，迫切的多头急于在开盘时离场，他们甚至愿意在当天的第一笔交易就卖出。市场常常跳空低开以寻找足够的买家。一旦他们的卖单被执行，市场就会开始上行，直到机构投资者认为当前价格可以合理卖出。这就把市场向下反转至当天新低，而当天常常成为一个下跌趋势的交易日。","p":"p1029"},{"t":"如图19.2所示，开盘时段的波幅往往能够提供线索，告诉我们当天后续的行情将如何走向。Freeport McMoRan（FCX）5分钟图上的开盘时段，波幅为近日平均日振幅的四分之一左右。几根K线之后，当看到这段时间的波幅可能很小，大多数交易员将忽略第一根K线，寻找新的上升或下降尖形。只要市场跌破K线3，K线3则成为一个上升高潮（价格在K线3处反转向下）。一旦市场涨破K线4，K线4则成为一个下降尖谷（价格在K线4处反转向上）。在这种情况下，很多交易员视这两种尖形为突破型的入场形态，并在尖形顶部上方高一个价位的地方挂单买入，在尖形底部下方低一个价位的地方挂单卖出。一旦某边的订单被触发成交，另一边的订单则成为初始的保护性止损条件单。如果入场之后市场反向而行，交易员一般会把另一边的止损条件单仓位加倍，打算如果条件单被触发，则原先的头寸被平掉的同时，反向持仓。","p":"p1030"},{"t":"交易员们一般可以在突破前入场。在这里举例说明，开盘大幅跳空高开（陡峭的移动平均线体现了这一点），并以一根阳线为首根K线，当天有很大机会将走出轮上涨趋势。一旦K线4向下突破K线2双内含线形态一个价位后反转向上，很多交易员就会在K线4这一双重底上升旗形信号K线（要记住，一天中的低点往往来自某种形式的双重底）上方做多。其他交易员则在K线5越过小型内含阴线时买入，还有一些交易员则在价格向上突破K线3时买入。","p":"p1031"},{"t":"当开盘时段的波幅像例子中的幅度那么窄时，区间内的回调幅度也会很窄；当当天行情发生突破并呈趋势运动时，其回调幅度依然会很窄，如此例所示。当天最后一两个小时内，通常会有一波回调，其幅度为早些时候回调幅度的两倍，比如从K线14开始的那波下跌。","p":"p1032"},{"t":"在开盘后第一个小时内，交易员们常常寻找连续的两根趋势K线，当它们出现时，很多交易员就会得出市场已经形成某方格局的结论。例如，K线2处有两根连续的阳线。这两根阳线实体较短影线较长，大多数交易员在做出市场呈多头态势的判断之前，需要收集更多的判断依据。K线4后面出现了两根阳线。在这种情况下，很多交易员认为市场主要趋势向上，他们开始波段性做多，并把止损单设置在双K线高潮的底部下方。K线5是一根强势突破的阳线，进一步表明当天是一个上涨趋势交易日，随之而来的几根阳线更是为这一结论提供了更多证据。请注意在K线4前面有三根阴线，每根阴线后面都紧跟着一根阳线。空头未能持续不断地卖出，这意味着空头力量相对薄弱。多头把每一根阴线都看作买入机会，而非做空的入场形态，这种现象强有力地表明市场很可能走高，尤其在当天大幅跳空高开的交易日里。","p":"p1033"}]},{"t":"para","text":"如图19.2所示，开盘时段的波幅往往能够提供线索，告诉我们当天后续的行情将如何走向。Freeport McMoRan（FCX）5分钟图上的开盘时段，波幅为近日平均日振幅的四分之一左右。几根K线之后，当看到这段时间的波幅可能很小，大多数交易员将忽略第一根K线，寻找新的上升或下降尖形。只要市场跌破K线3，K线3则成为一个上升高潮（价格在K线3处反转向下）。一旦市场涨破K线4，K线4则成为一个下降尖谷（价格在K线4处反转向上）。在这种情况下，很多交易员视这两种尖形为突破型的入场形态，并在尖形顶部上方高一个价位的地方挂单买入，在尖形底部下方低一个价位的地方挂单卖出。一旦某边的订单被触发成交，另一边的订单则成为初始的保护性止损条件单。如果入场之后市场反向而行，交易员一般会把另一边的止损条件单仓位加倍，打算如果条件单被触发，则原先的头寸被平掉的同时，反向持仓。","pid":"p1030"},{"t":"para","text":"交易员们一般可以在突破前入场。在这里举例说明，开盘大幅跳空高开（陡峭的移动平均线体现了这一点），并以一根阳线为首根K线，当天有很大机会将走出轮上涨趋势。一旦K线4向下突破K线2双内含线形态一个价位后反转向上，很多交易员就会在K线4这一双重底上升旗形信号K线（要记住，一天中的低点往往来自某种形式的双重底）上方做多。其他交易员则在K线5越过小型内含阴线时买入，还有一些交易员则在价格向上突破K线3时买入。","pid":"p1031"},{"t":"para","text":"当开盘时段的波幅像例子中的幅度那么窄时，区间内的回调幅度也会很窄；当当天行情发生突破并呈趋势运动时，其回调幅度依然会很窄，如此例所示。当天最后一两个小时内，通常会有一波回调，其幅度为早些时候回调幅度的两倍，比如从K线14开始的那波下跌。","pid":"p1032"},{"t":"para","text":"在开盘后第一个小时内，交易员们常常寻找连续的两根趋势K线，当它们出现时，很多交易员就会得出市场已经形成某方格局的结论。例如，K线2处有两根连续的阳线。这两根阳线实体较短影线较长，大多数交易员在做出市场呈多头态势的判断之前，需要收集更多的判断依据。K线4后面出现了两根阳线。在这种情况下，很多交易员认为市场主要趋势向上，他们开始波段性做多，并把止损单设置在双K线高潮的底部下方。K线5是一根强势突破的阳线，进一步表明当天是一个上涨趋势交易日，随之而来的几根阳线更是为这一结论提供了更多证据。请注意在K线4前面有三根阴线，每根阴线后面都紧跟着一根阳线。空头未能持续不断地卖出，这意味着空头力量相对薄弱。多头把每一根阴线都看作买入机会，而非做空的入场形态，这种现象强有力地表明市场很可能走高，尤其在当天大幅跳空高开的交易日里。","pid":"p1033"},{"t":"img","src":"assets/img/p3c3_003.webp","ctx":[{"t":"当开盘时段的波幅像例子中的幅度那么窄时，区间内的回调幅度也会很窄；当当天行情发生突破并呈趋势运动时，其回调幅度依然会很窄，如此例所示。当天最后一两个小时内，通常会有一波回调，其幅度为早些时候回调幅度的两倍，比如从K线14开始的那波下跌。","p":"p1032"},{"t":"在开盘后第一个小时内，交易员们常常寻找连续的两根趋势K线，当它们出现时，很多交易员就会得出市场已经形成某方格局的结论。例如，K线2处有两根连续的阳线。这两根阳线实体较短影线较长，大多数交易员在做出市场呈多头态势的判断之前，需要收集更多的判断依据。K线4后面出现了两根阳线。在这种情况下，很多交易员认为市场主要趋势向上，他们开始波段性做多，并把止损单设置在双K线高潮的底部下方。K线5是一根强势突破的阳线，进一步表明当天是一个上涨趋势交易日，随之而来的几根阳线更是为这一结论提供了更多证据。请注意在K线4前面有三根阴线，每根阴线后面都紧跟着一根阳线。空头未能持续不断地卖出，这意味着空头力量相对薄弱。多头把每一根阴线都看作买入机会，而非做空的入场形态，这种现象强有力地表明市场很可能走高，尤其在当天大幅跳空高开的交易日里。","p":"p1033"},{"t":"如图19.3所示，谷歌（GOOG）在这四天的开盘时段都出现了几次突破回调。K线1是一个低点2做空信号，位于陡峭的移动平均线处，它回补了昨天低点下方6美分的缺口，构建出一个反转向下的形态，并形成当天高点。","p":"p1034"},{"t":"行情向上突破天波段高点后，K线2回调至移动平均线。双内含阳线结构构成做多入场形态。K线2后面的那根K线与当天第一根K线组成双重顶，并形成当天高点。","p":"p1035"},{"t":"行情反弹至前一天收盘，画出一条上涨趋势线，该上涨趋势线被向下突破，在K线3处又反转向上（形成一次失败的突破）。K线4形成一个更高的低点，并与K线3组成一个近似的双重底。","p":"p1036"},{"t":"K线5是一个高点2双重底上升旗形（第一个底部位于两根K线之前），也是价格向上突破昨天高点后的首次回调。这种现象可能使当天成为一个开盘时段就启动趋势的交易日。","p":"p1037"}]},{"t":"para","text":"如图19.3所示，谷歌（GOOG）在这四天的开盘时段都出现了几次突破回调。K线1是一个低点2做空信号，位于陡峭的移动平均线处，它回补了昨天低点下方6美分的缺口，构建出一个反转向下的形态，并形成当天高点。","pid":"p1034"},{"t":"para","text":"行情向上突破天波段高点后，K线2回调至移动平均线。双内含阳线结构构成做多入场形态。K线2后面的那根K线与当天第一根K线组成双重顶，并形成当天高点。","pid":"p1035"},{"t":"para","text":"行情反弹至前一天收盘，画出一条上涨趋势线，该上涨趋势线被向下突破，在K线3处又反转向上（形成一次失败的突破）。K线4形成一个更高的低点，并与K线3组成一个近似的双重底。","pid":"p1036"},{"t":"para","text":"K线5是一个高点2双重底上升旗形（第一个底部位于两根K线之前），也是价格向上突破昨天高点后的首次回调。这种现象可能使当天成为一个开盘时段就启动趋势的交易日。","pid":"p1037"},{"t":"img","src":"assets/img/p3c3_004.webp","ctx":[{"t":"行情反弹至前一天收盘，画出一条上涨趋势线，该上涨趋势线被向下突破，在K线3处又反转向上（形成一次失败的突破）。K线4形成一个更高的低点，并与K线3组成一个近似的双重底。","p":"p1036"},{"t":"K线5是一个高点2双重底上升旗形（第一个底部位于两根K线之前），也是价格向上突破昨天高点后的首次回调。这种现象可能使当天成为一个开盘时段就启动趋势的交易日。","p":"p1037"},{"t":"如图19.4所示，苹果（AAPL）在这三天的开盘时段发生了几次失败的突破，并导致开盘反转。行情开盘反转，击穿趋势通道线后，在K线1形成二次入场机会（低点2）。","p":"p1038"},{"t":"前一天最后一小时，行情反复震荡，临收盘前价格一路向下，形成一波小规模的下跌趋势，当天开盘后行情向上突破（失败的突破）前一天的震荡区间及下跌趋势线（未画出），直到K线2处反转向下。然后市场又在移动平均线处反转向上，形成了K线3更高的低点，这里也是一次突破回调。","p":"p1039"},{"t":"当天更高的高点出现后，行情尚未形成一轮新的上涨趋势，K线4在此处反转向下，成为一个不错的做空形态。这里还形成了一个楔形，并且在开盘跳空高开后成为通道顶部。","p":"p1040"},{"t":"行情在K线5处向下突破上升通道后，在K线6形成一个次高点最终旗形，并反转向下。交易员们预期价格将回踩K线3的通道底部。","p":"p1041"},{"t":"今天行情开盘大幅向上跳空，K线7是一个高点2突破回调形态，随后在K线8形成一个更高的高点，并发生最终旗形突破。但市场又在K线8处反转向下。由于这个点位上新一轮上涨趋势尚未成型，因此这里也是一个不错的做空形态。","p":"p1042"},{"t":"K线9走出新低。其势头强劲，很可能引发第二回合的下降波段。开盘跳空向上形成高潮，从K线8跌至K线9形成尖谷。这种高潮反转形态，后面往往伴随着一段震荡行情。在这段震荡区间中，多空都纷纷增仓，并尝试在通道成型过程中占据主导地位。结果空头胜出，多头不得不卖掉他们的多仓，同时增大抛压。","p":"p1043"},{"t":"行情经历两个小波段涨至K线10（K线10是一个低点2形态）并形成一个更低的高点。","p":"p1044"},{"t":"基于K线10次高点后失败的高点2形态，K线11是一个二次做空入场机会。多头两次试图反转更低高点所体现的看跌势头但两次都无功而返。每当市场两次尝试均告失败时，通常市场都会反向而行。","p":"p1045"}]},{"t":"para","text":"如图19.4所示，苹果（AAPL）在这三天的开盘时段发生了几次失败的突破，并导致开盘反转。行情开盘反转，击穿趋势通道线后，在K线1形成二次入场机会（低点2）。","pid":"p1038"},{"t":"para","text":"前一天最后一小时，行情反复震荡，临收盘前价格一路向下，形成一波小规模的下跌趋势，当天开盘后行情向上突破（失败的突破）前一天的震荡区间及下跌趋势线（未画出），直到K线2处反转向下。然后市场又在移动平均线处反转向上，形成了K线3更高的低点，这里也是一次突破回调。","pid":"p1039"},{"t":"para","text":"当天更高的高点出现后，行情尚未形成一轮新的上涨趋势，K线4在此处反转向下，成为一个不错的做空形态。这里还形成了一个楔形，并且在开盘跳空高开后成为通道顶部。","pid":"p1040"},{"t":"para","text":"行情在K线5处向下突破上升通道后，在K线6形成一个次高点最终旗形，并反转向下。交易员们预期价格将回踩K线3的通道底部。","pid":"p1041"},{"t":"para","text":"今天行情开盘大幅向上跳空，K线7是一个高点2突破回调形态，随后在K线8形成一个更高的高点，并发生最终旗形突破。但市场又在K线8处反转向下。由于这个点位上新一轮上涨趋势尚未成型，因此这里也是一个不错的做空形态。","pid":"p1042"},{"t":"para","text":"K线9走出新低。其势头强劲，很可能引发第二回合的下降波段。开盘跳空向上形成高潮，从K线8跌至K线9形成尖谷。这种高潮反转形态，后面往往伴随着一段震荡行情。在这段震荡区间中，多空都纷纷增仓，并尝试在通道成型过程中占据主导地位。结果空头胜出，多头不得不卖掉他们的多仓，同时增大抛压。","pid":"p1043"},{"t":"para","text":"行情经历两个小波段涨至K线10（K线10是一个低点2形态）并形成一个更低的高点。","pid":"p1044"},{"t":"para","text":"基于K线10次高点后失败的高点2形态，K线11是一个二次做空入场机会。多头两次试图反转更低高点所体现的看跌势头但两次都无功而返。每当市场两次尝试均告失败时，通常市场都会反向而行。","pid":"p1045"},{"t":"img","src":"assets/img/p3c3_005.webp","ctx":[{"t":"行情经历两个小波段涨至K线10（K线10是一个低点2形态）并形成一个更低的高点。","p":"p1044"},{"t":"基于K线10次高点后失败的高点2形态，K线11是一个二次做空入场机会。多头两次试图反转更低高点所体现的看跌势头但两次都无功而返。每当市场两次尝试均告失败时，通常市场都会反向而行。","p":"p1045"},{"t":"如图19.5所示，K线4发生强势空头反转，并在一轮强劲的下跌趋势中测试移动平均线，构建出一个突破回调做空形态。并预期向下突破K线1。开盘向上跳空至移动平均线就是一次回调","p":"p1046"},{"t":"从K线2到K线3的暴跌是一波尖形通道下跌趋势。K线4对通道顶部附近进行测试。这种测试一般伴随着多空反复拉锯的价格行为。另外，跳空缺口向上突破了昨天最后一小时那根陡峭的下跌趋势线，而多头等待着二次突破回调的做多入场形态。当多空双方的看涨看跌理由都相对充分时，市场就存在不确定性，这种不确定性通常意味着行情将进入一段震荡区间，正如此例所示。","p":"p1047"},{"t":"K线5不是一根反转K线，而是继向上突破昨天下降通道后的一次突破回调，一个高点2形态的变形（K线4阴线后走出一根阳线，然后形成第二个小波段，并跌至K线5）。自昨天的抛售高潮收盘后，这里很可能形成一个更高的低点，并在高潮（收盘前的暴跌几乎没有像样的回调，这种情况很难持久，因此是一波高潮行情）后走出一个双波段的反向运动。K线5后面的阳线，K线5，K线5前面的阴线，以及跌至K线4的运动，一同构成一次双K线反转。记住，暴跌之后紧跟着暴涨。比如K线5后面的这根大阳线，实际上是一种抛售高潮，在更大级别的时间周期图表上显示为双K线反转甚至单阳线反转。","p":"p1048"},{"t":"行情从K线5这一次高点以双波段形式涨至K线8，并在此处形成形顶部。","p":"p1049"},{"t":"这天是一个趋势型的震荡交易日，从K线20启动的向上反弹测试了早前上方震荡区间的底部。","p":"p1050"},{"t":"K线24是一个双重底上升旗形。第一个底部位于K线20或K线18低点后面的内含信号K线。从K线18到K线23，行情经历了大型的双波段下降旗形，并在K线24处突破失败，回踩了昨天低点后反转向上。","p":"p1051"},{"t":"K线25是当天前30分钟里一根强势的外包阳线，交易员们认为当前的格局有可能由空转多。他们希望任何回调都能保持在K线25低点上方，当K线26向上翻转时，他们认为当天的低点很可能已经成型。","p":"p1052"},{"t":"K线26形成了一个更高的低点，并引出一次对双内含线的突破。双内含线形态的第二根K线强势收在最高位，增加了行情的上行概率。它同时也是下降旗形中一个失败的低点2形态，看到开盘大幅跳空低开，并在二次入场机会（低点2跳空回调）做空的空头，全被套在这里。这里是一个小型的最终下降旗形。它是行情试图跌破昨天低点后的二次反转尝试，这次反转尝试，也回补了开盘跳空低开的缺口，而开盘后的这一缺口。正好跳过了昨天收盘前的双波段下降旗形。","p":"p1053"},{"t":"大规模的向下跳空常常会引起回调至移动平均线的双波段回调，然后突破进入一轮下跌趋势，","p":"p1054"}]},{"t":"para","text":"如图19.5所示，K线4发生强势空头反转，并在一轮强劲的下跌趋势中测试移动平均线，构建出一个突破回调做空形态。并预期向下突破K线1。开盘向上跳空至移动平均线就是一次回调","pid":"p1046"},{"t":"para","text":"从K线2到K线3的暴跌是一波尖形通道下跌趋势。K线4对通道顶部附近进行测试。这种测试一般伴随着多空反复拉锯的价格行为。另外，跳空缺口向上突破了昨天最后一小时那根陡峭的下跌趋势线，而多头等待着二次突破回调的做多入场形态。当多空双方的看涨看跌理由都相对充分时，市场就存在不确定性，这种不确定性通常意味着行情将进入一段震荡区间，正如此例所示。","pid":"p1047"},{"t":"para","text":"K线5不是一根反转K线，而是继向上突破昨天下降通道后的一次突破回调，一个高点2形态的变形（K线4阴线后走出一根阳线，然后形成第二个小波段，并跌至K线5）。自昨天的抛售高潮收盘后，这里很可能形成一个更高的低点，并在高潮（收盘前的暴跌几乎没有像样的回调，这种情况很难持久，因此是一波高潮行情）后走出一个双波段的反向运动。K线5后面的阳线，K线5，K线5前面的阴线，以及跌至K线4的运动，一同构成一次双K线反转。记住，暴跌之后紧跟着暴涨。比如K线5后面的这根大阳线，实际上是一种抛售高潮，在更大级别的时间周期图表上显示为双K线反转甚至单阳线反转。","pid":"p1048"},{"t":"para","text":"行情从K线5这一次高点以双波段形式涨至K线8，并在此处形成形顶部。","pid":"p1049"},{"t":"para","text":"这天是一个趋势型的震荡交易日，从K线20启动的向上反弹测试了早前上方震荡区间的底部。","pid":"p1050"},{"t":"para","text":"K线24是一个双重底上升旗形。第一个底部位于K线20或K线18低点后面的内含信号K线。从K线18到K线23，行情经历了大型的双波段下降旗形，并在K线24处突破失败，回踩了昨天低点后反转向上。","pid":"p1051"},{"t":"para","text":"K线25是当天前30分钟里一根强势的外包阳线，交易员们认为当前的格局有可能由空转多。他们希望任何回调都能保持在K线25低点上方，当K线26向上翻转时，他们认为当天的低点很可能已经成型。","pid":"p1052"},{"t":"para","text":"K线26形成了一个更高的低点，并引出一次对双内含线的突破。双内含线形态的第二根K线强势收在最高位，增加了行情的上行概率。它同时也是下降旗形中一个失败的低点2形态，看到开盘大幅跳空低开，并在二次入场机会（低点2跳空回调）做空的空头，全被套在这里。这里是一个小型的最终下降旗形。它是行情试图跌破昨天低点后的二次反转尝试，这次反转尝试，也回补了开盘跳空低开的缺口，而开盘后的这一缺口。正好跳过了昨天收盘前的双波段下降旗形。","pid":"p1053"},{"t":"para","text":"大规模的向下跳空常常会引起回调至移动平均线的双波段回调，然后突破进入一轮下跌趋势，","pid":"p1054"},{"t":"img","src":"assets/img/p3c3_006.webp","ctx":[{"t":"K线26形成了一个更高的低点，并引出一次对双内含线的突破。双内含线形态的第二根K线强势收在最高位，增加了行情的上行概率。它同时也是下降旗形中一个失败的低点2形态，看到开盘大幅跳空低开，并在二次入场机会（低点2跳空回调）做空的空头，全被套在这里。这里是一个小型的最终下降旗形。它是行情试图跌破昨天低点后的二次反转尝试，这次反转尝试，也回补了开盘跳空低开的缺口，而开盘后的这一缺口。正好跳过了昨天收盘前的双波段下降旗形。","p":"p1053"},{"t":"大规模的向下跳空常常会引起回调至移动平均线的双波段回调，然后突破进入一轮下跌趋势，","p":"p1054"},{"t":"如图19.6所示。这天开盘大幅跳空低开后，K线2和K线3组成了双重顶下降旗形（以跳空缺口为旗杆），并与K线1组成三角形（三个顶部，是一个收敛的三角形形态）。","p":"p1055"},{"t":"K线3为双K线反转的第一根K线。一个低点2做空信号。在K线3后面那根阴线下方做空，要比在K线3这根阳线下方做空更安全，因为市场有可能开始调整，然后再次尝试向上突破K线1和K线2组成的双重顶。在震荡区间顶部的某根阴线下方做空，要比在某根阳线下方做空更可靠。","p":"p1056"},{"t":"虽然大多数交易员都认为开盘时段仅维持一两个小时，但市场往往在太平洋标准时间上午8：30左右启动一轮趋势，如图所示。无论我们把K线3双重顶看作开盘反转形态，抑或仅仅是一个普通的双重顶都没有关系。重要的是，新一轮趋势的启动或反转都发生在上午8：30左右。","p":"p1057"}]},{"t":"para","text":"如图19.6所示。这天开盘大幅跳空低开后，K线2和K线3组成了双重顶下降旗形（以跳空缺口为旗杆），并与K线1组成三角形（三个顶部，是一个收敛的三角形形态）。","pid":"p1055"},{"t":"para","text":"K线3为双K线反转的第一根K线。一个低点2做空信号。在K线3后面那根阴线下方做空，要比在K线3这根阳线下方做空更安全，因为市场有可能开始调整，然后再次尝试向上突破K线1和K线2组成的双重顶。在震荡区间顶部的某根阴线下方做空，要比在某根阳线下方做空更可靠。","pid":"p1056"},{"t":"para","text":"虽然大多数交易员都认为开盘时段仅维持一两个小时，但市场往往在太平洋标准时间上午8：30左右启动一轮趋势，如图所示。无论我们把K线3双重顶看作开盘反转形态，抑或仅仅是一个普通的双重顶都没有关系。重要的是，新一轮趋势的启动或反转都发生在上午8：30左右。","pid":"p1057"},{"t":"img","src":"assets/img/p3c3_007.webp","ctx":[{"t":"K线3为双K线反转的第一根K线。一个低点2做空信号。在K线3后面那根阴线下方做空，要比在K线3这根阳线下方做空更安全，因为市场有可能开始调整，然后再次尝试向上突破K线1和K线2组成的双重顶。在震荡区间顶部的某根阴线下方做空，要比在某根阳线下方做空更可靠。","p":"p1056"},{"t":"虽然大多数交易员都认为开盘时段仅维持一两个小时，但市场往往在太平洋标准时间上午8：30左右启动一轮趋势，如图所示。无论我们把K线3双重顶看作开盘反转形态，抑或仅仅是一个普通的双重顶都没有关系。重要的是，新一轮趋势的启动或反转都发生在上午8：30左右。","p":"p1057"},{"t":"如图19.7所示，双重底上升旗形和双重顶下降旗形都很常见。行情反弹至K线2后，K线3与K线4组成了一个大型的双重底上升旗形。行情下滑至K线5后，K线6与K线7组成了一个大型的双重顶下降旗形。","p":"p1058"},{"t":"当市场尝试两次向上突破都以失败告终时，接下来通常都会尝试向下突破价格底部。","p":"p1059"}]},{"t":"para","text":"如图19.7所示，双重底上升旗形和双重顶下降旗形都很常见。行情反弹至K线2后，K线3与K线4组成了一个大型的双重底上升旗形。行情下滑至K线5后，K线6与K线7组成了一个大型的双重顶下降旗形。","pid":"p1058"},{"t":"para","text":"当市场尝试两次向上突破都以失败告终时，接下来通常都会尝试向下突破价格底部。","pid":"p1059"},{"t":"img","src":"assets/img/p3c3_008.webp","ctx":[{"t":"如图19.7所示，双重底上升旗形和双重顶下降旗形都很常见。行情反弹至K线2后，K线3与K线4组成了一个大型的双重底上升旗形。行情下滑至K线5后，K线6与K线7组成了一个大型的双重顶下降旗形。","p":"p1058"},{"t":"当市场尝试两次向上突破都以失败告终时，接下来通常都会尝试向下突破价格底部。","p":"p1059"},{"t":"如图19.8所，GO0C在一段小型的震荡区间里进行调整，一直等到太平洋标准时间上午7：00报告发布才进入突破模式。这个收敛的震荡区间拥有三个顶部，构成一个三角形。交易员可以在震荡区间底部下方挂条件单，但在K线5下方这一低点2处做空风险更小。由于K线3和K线5为两个上升小波段，因此这里是一个低点2的入场形态。如图所示，在这个点位上当天的行情呈震荡态势，高点2和低点2并存。高点2做多形态失败，变成低点2做空形态。行情在移动平均线下方反复震荡，形成一个下降旗形，并很可能突破下行。","p":"p1060"},{"t":"K线2是连续的第二根阴线，两根阴线都很长，而且上下影线较短。这使得交易员们认为空头格局已现，任何回调都构成一个做空的入场形态，且至少能创造出一个不错的刮头皮交易机会。K线5下方的低点2做空信号就是第一个不错的机会，连续的大阴线表明大多数交易员认为这波下跌的幅度足以做一次波段交易，而非仅仅一次刮头皮操作之后行情就向上反转。K线5与K线3组成一个双重顶，并引出一个做空波段。","p":"p1061"},{"t":"无论交易员把这个双重底看作开盘反转形态，还是认为这种形态发生得太晚以至于不应该把它纳入开盘时段的一部分，这些都不重要。不过，交易员需要注意，市场往往在太平洋标准时间上午8：30左右开始反转，在这个时间段应该时刻准备进行交易。","p":"p1062"}]},{"t":"para","text":"如图19.8所，GO0C在一段小型的震荡区间里进行调整，一直等到太平洋标准时间上午7：00报告发布才进入突破模式。这个收敛的震荡区间拥有三个顶部，构成一个三角形。交易员可以在震荡区间底部下方挂条件单，但在K线5下方这一低点2处做空风险更小。由于K线3和K线5为两个上升小波段，因此这里是一个低点2的入场形态。如图所示，在这个点位上当天的行情呈震荡态势，高点2和低点2并存。高点2做多形态失败，变成低点2做空形态。行情在移动平均线下方反复震荡，形成一个下降旗形，并很可能突破下行。","pid":"p1060"},{"t":"para","text":"K线2是连续的第二根阴线，两根阴线都很长，而且上下影线较短。这使得交易员们认为空头格局已现，任何回调都构成一个做空的入场形态，且至少能创造出一个不错的刮头皮交易机会。K线5下方的低点2做空信号就是第一个不错的机会，连续的大阴线表明大多数交易员认为这波下跌的幅度足以做一次波段交易，而非仅仅一次刮头皮操作之后行情就向上反转。K线5与K线3组成一个双重顶，并引出一个做空波段。","pid":"p1061"},{"t":"para","text":"无论交易员把这个双重底看作开盘反转形态，还是认为这种形态发生得太晚以至于不应该把它纳入开盘时段的一部分，这些都不重要。不过，交易员需要注意，市场往往在太平洋标准时间上午8：30左右开始反转，在这个时间段应该时刻准备进行交易。","pid":"p1062"},{"t":"img","src":"assets/img/p3c3_009.webp","ctx":[{"t":"K线2是连续的第二根阴线，两根阴线都很长，而且上下影线较短。这使得交易员们认为空头格局已现，任何回调都构成一个做空的入场形态，且至少能创造出一个不错的刮头皮交易机会。K线5下方的低点2做空信号就是第一个不错的机会，连续的大阴线表明大多数交易员认为这波下跌的幅度足以做一次波段交易，而非仅仅一次刮头皮操作之后行情就向上反转。K线5与K线3组成一个双重顶，并引出一个做空波段。","p":"p1061"},{"t":"无论交易员把这个双重底看作开盘反转形态，还是认为这种形态发生得太晚以至于不应该把它纳入开盘时段的一部分，这些都不重要。不过，交易员需要注意，市场往往在太平洋标准时间上午8：30左右开始反转，在这个时间段应该时刻准备进行交易。","p":"p1062"},{"t":"如图19.9所示，有些交易日开盘时移动平均线较为平缓，大K线反复震荡，没有可靠的入场形态（顶部或底部附近没有小K线，不能设置反手交易）。这种铁丝网行情应该以铁丝网行情的方式进行交易。它需要耐心。等待一方被趋势K线的突破套住，然后伺机在突破口处反手交易。试图突破铁丝网的尝试通常都以失败告终，铁丝网一般成为一种最终旗形。例子中的突破跌破了昨天低点点或低点的突破口处反转。这种倾向增加了铁丝网成为最终旗形的概率。该形态拥有三次上推，并持续整理。有些交易员把它看作三角形，如果只看K线的实体而忽略影线部分，则更容易看出来。","p":"p1063"},{"t":"突破了铁丝网底部后，行情在K线7处反转向上，但这之前经历了四根阴线。这种空头力量足以让交易员们耐心等待二次买入信号。尽管有些交易员把它看作高点2，其中高点1为K线6的高点，但K线6是一根强势下行外包阴线，大多数交易员把它看作下跌运动的起点。这种K线会让交易员们认为市场可能已经突破震荡区间，并进入一轮新的趋势，他们预期在这根强势下行套住多头的外包线后，至少将走出第二回合的下降小波段。这使得大多数交易员把K线7看作高点1，毕竞下跌运动启动于K线6顶部，而非K线5顶部。","p":"p1064"},{"t":"K线7突破了小级别的下跌趋势线，K线9深度回踩走出一个更低的低点，并形成了突破回调做多入场形态。K线9收于其中点之上。满足了对反转K线的最低要求。在这个价位上，价格行为很可能出现双向反复拉锯，行情不断反转，很多显著的影线。因此在当天新低的位置出现二次做多机会，甚至不需要存在反转K线。","p":"p1065"},{"t":"在K线9上方的多头第二次尝试反转早前的当天低点以及昨天低点。然后市场趋势往上。穿过开盘区间的另一边，并在K线12处给出一个高点2突破回调的做多入场形态。K线12是一根在移动平均线上的反转阳线，也是一个在上升旗形末端强有力的买入信号。对于很多交易员来说，市场在K线9后面的那根阳线上已经进入多头格局，当价格强势向上突破K线10。以及K线11这根强阳线突破高点2买入形态时，其他交易员也被市场说服，认为多头态势已经成型。","p":"p1066"}]},{"t":"para","text":"如图19.9所示，有些交易日开盘时移动平均线较为平缓，大K线反复震荡，没有可靠的入场形态（顶部或底部附近没有小K线，不能设置反手交易）。这种铁丝网行情应该以铁丝网行情的方式进行交易。它需要耐心。等待一方被趋势K线的突破套住，然后伺机在突破口处反手交易。试图突破铁丝网的尝试通常都以失败告终，铁丝网一般成为一种最终旗形。例子中的突破跌破了昨天低点点或低点的突破口处反转。这种倾向增加了铁丝网成为最终旗形的概率。该形态拥有三次上推，并持续整理。有些交易员把它看作三角形，如果只看K线的实体而忽略影线部分，则更容易看出来。","pid":"p1063"},{"t":"para","text":"突破了铁丝网底部后，行情在K线7处反转向上，但这之前经历了四根阴线。这种空头力量足以让交易员们耐心等待二次买入信号。尽管有些交易员把它看作高点2，其中高点1为K线6的高点，但K线6是一根强势下行外包阴线，大多数交易员把它看作下跌运动的起点。这种K线会让交易员们认为市场可能已经突破震荡区间，并进入一轮新的趋势，他们预期在这根强势下行套住多头的外包线后，至少将走出第二回合的下降小波段。这使得大多数交易员把K线7看作高点1，毕竞下跌运动启动于K线6顶部，而非K线5顶部。","pid":"p1064"},{"t":"para","text":"K线7突破了小级别的下跌趋势线，K线9深度回踩走出一个更低的低点，并形成了突破回调做多入场形态。K线9收于其中点之上。满足了对反转K线的最低要求。在这个价位上，价格行为很可能出现双向反复拉锯，行情不断反转，很多显著的影线。因此在当天新低的位置出现二次做多机会，甚至不需要存在反转K线。","pid":"p1065"},{"t":"para","text":"在K线9上方的多头第二次尝试反转早前的当天低点以及昨天低点。然后市场趋势往上。穿过开盘区间的另一边，并在K线12处给出一个高点2突破回调的做多入场形态。K线12是一根在移动平均线上的反转阳线，也是一个在上升旗形末端强有力的买入信号。对于很多交易员来说，市场在K线9后面的那根阳线上已经进入多头格局，当价格强势向上突破K线10。以及K线11这根强阳线突破高点2买入形态时，其他交易员也被市场说服，认为多头态势已经成型。","pid":"p1066"}],"wcount":6297},{"id":"p3c4","title":"第20章　开盘跳空：反转与持续整理","blocks":[{"t":"para","text":"第20章　开盘跳空：反转与持续整理","pid":"p1067"},{"t":"para","text":"任何时间周期的开盘跳空都意味着一旦这根K线结束了，它就不会与前一根K线产生重叠。在大部分交易日里，5分钟图上都有开盘跳空的现象。我们可以把它简单看作对前一天最后一根K线的突破。交易员们应该将它与其他突破形态一样对待，除非他们知道这些大型的跳空缺口增加了当天行情呈趋势性波动的概率。跳空缺口越大，当天越有可能成为趋势交易日，跳空缺口所产生的影响就越接近尖形，而且伴随着与跳空同一方向的趋势通道。例如，大幅跳空高开，后续行情可能有50%的机会走出一条上升通道，20%为震荡区间，剩下30%的机会走出一波下跌趋势。这些概率只是一个经验之谈，而利用计算机来得出精确的数据，容易受太多变量影响。那么，跳空缺口要多大才能称为大幅或大型呢？跳空高开后多大幅度的反弹才足以构成一条通道，而不仅仅是略微向上倾斜的震荡区间？下跌多大幅度才足以构成一次反转而不只是深度回调？同样来自主观判断的还有另外一个观点，如果该缺口是过去五天中最大的跳空缺口，或者它的幅度大于平均日振幅的一半，我们也可以称之为大型跳空缺口。","pid":"p1068"},{"t":"para","text":"5分钟图上与昨天收盘价之间的开盘跳空缺口代表着市场的极端情绪，且往往预示着当天将是一个任意方向上呈趋势性波动的交易日。日线图上是否也出现跳空缺口并不重要，因为交易模式是一样的。唯一重要的是市场如何响应这种相对极端的行为——市场会接受还是拒绝？跳空缺口越大，就越有可能成为趋势交易日的起点。在当天头几根K线中，趋势K线的规模、方向及数量常常预示着随后很可能形成的趋势方向。有时候市场从开盘时的一两根K线就启动趋势，但更常见的情况是价格先测试相反方向，然后反转步入正轨，沿着正确的趋势方向持续波动一整天。每天你看到开盘出现一个大型跳空缺口时，假定当天行情将呈现强劲的趋势走势才是明智之举。不过，有时趋势的启动需要耗费一个小时的时间，而且往往在一轮双波段反向运动后才开始显现，比如双波段回调至移动平均线或双重底、双重顶。有时行情还会出现第三推，形成一个楔形旗形。即使在好几次交易中你的波段化头寸都被震仓出局，也一定要确保每次交易时都将部分头寸波段化。一笔不错的波段交易，其盈利抵得上10次刮头皮交易，除非有迹象表明行情不再呈现趋势性波动，否则不要放弃波段交易。","pid":"p1069"},{"t":"para","text":"跳空缺口可以看作是一根大型的隐形趋势K线。举例而言。如果开盘大幅跳空高开，随后小幅回调，当天剩下的时间走出一条反弹通道，那么这很可能是一轮跳空高潮通道上涨趋势，而这个缺口，就是一个高潮。对于电子迷你期货而言，你可以观察一下标普现金指数，当天第一根K线是一根大型的趋势K线，它就对应着电子迷你期货图表上的一个跳空缺口。","pid":"p1070"},{"t":"para","text":"对待跳空的开盘，应该和对待任何其他情形的开盘一样，一视同仁，寻找开盘启动的趋势、失败的突破（即行情反转），或突破回调唯一和其他情形不一样的是，你应该更加积极地寻求波段交易的机会；如果当天趋势确立，那么就在行情回调时加仓。在交易过程中，你要一直做好将部分头寸获利平仓的准备，这种情况也可能是刮头皮操作。但只要趋势足够强劲，就应该伺机沿着趋势方向捕捉更多的入场机会。","pid":"p1071"},{"t":"para","text":"开盘跳空只是增加了当天呈趋势性波动的概率，但并不意味着当天就真的能走出一轮趋势行情。大部分跳空开盘的交易日在头五到十根K线的时间里，行情都有反复震荡的表现，而多空双方为了引领市场方向在这里一决高下，导致这种情况有时候甚至持续一整天。这时应该发散思维，考虑所有的可能性，不要墨守成规，让自己局限于一种观点之中。你的交易应该跟着市场走。你没有能力去左右市场，当然也不可能依靠意念去推动市场，使之朝着你所希望的方向运动。如果你看错了方向，坚决离场，不要指望市场会发生低概率的变化，并突然顺着你的持仓方向波动。如果行情出现一个大的跳空缺口，但价格行为依然不明晰。就假设市场正形成一个震荡区间。你在其中伺机低买高卖。在出现波段操作的良好入场形态之前，你也许可以捕捉到几次刮头皮的交易机会。","pid":"p1072"},{"t":"img","src":"assets/img/p3c4_001.webp","ctx":[{"t":"对待跳空的开盘，应该和对待任何其他情形的开盘一样，一视同仁，寻找开盘启动的趋势、失败的突破（即行情反转），或突破回调唯一和其他情形不一样的是，你应该更加积极地寻求波段交易的机会；如果当天趋势确立，那么就在行情回调时加仓。在交易过程中，你要一直做好将部分头寸获利平仓的准备，这种情况也可能是刮头皮操作。但只要趋势足够强劲，就应该伺机沿着趋势方向捕捉更多的入场机会。","p":"p1071"},{"t":"开盘跳空只是增加了当天呈趋势性波动的概率，但并不意味着当天就真的能走出一轮趋势行情。大部分跳空开盘的交易日在头五到十根K线的时间里，行情都有反复震荡的表现，而多空双方为了引领市场方向在这里一决高下，导致这种情况有时候甚至持续一整天。这时应该发散思维，考虑所有的可能性，不要墨守成规，让自己局限于一种观点之中。你的交易应该跟着市场走。你没有能力去左右市场，当然也不可能依靠意念去推动市场，使之朝着你所希望的方向运动。如果你看错了方向，坚决离场，不要指望市场会发生低概率的变化，并突然顺着你的持仓方向波动。如果行情出现一个大的跳空缺口，但价格行为依然不明晰。就假设市场正形成一个震荡区间。你在其中伺机低买高卖。在出现波段操作的良好入场形态之前，你也许可以捕捉到几次刮头皮的交易机会。","p":"p1072"},{"t":"如图20.1所示，5分钟图的开盘跳空。只是另外一种形态的突破和升。在右侧图表中，道琼斯指数期货合约开盘跳空高开，但这个缺口在左侧的道琼斯工业平均现金指数图上只是一根大型的阳线。","p":"p1073"},{"t":"大规模的开盘跳空增加了当天呈趋势性走势的概率（这种趋势可能向上也可能向下），但它依然有可能成为一个反复振荡的交易日。","p":"p1074"}]},{"t":"para","text":"如图20.1所示，5分钟图的开盘跳空。只是另外一种形态的突破和升。在右侧图表中，道琼斯指数期货合约开盘跳空高开，但这个缺口在左侧的道琼斯工业平均现金指数图上只是一根大型的阳线。","pid":"p1073"},{"t":"para","text":"大规模的开盘跳空增加了当天呈趋势性走势的概率（这种趋势可能向上也可能向下），但它依然有可能成为一个反复振荡的交易日。","pid":"p1074"},{"t":"img","src":"assets/img/p3c4_002.webp","ctx":[{"t":"如图20.1所示，5分钟图的开盘跳空。只是另外一种形态的突破和升。在右侧图表中，道琼斯指数期货合约开盘跳空高开，但这个缺口在左侧的道琼斯工业平均现金指数图上只是一根大型的阳线。","p":"p1073"},{"t":"大规模的开盘跳空增加了当天呈趋势性走势的概率（这种趋势可能向上也可能向下），但它依然有可能成为一个反复振荡的交易日。","p":"p1074"},{"t":"如图20.2的右下图所示，在开盘大型跳空后。从K线18到K线22的震荡走势就是一个数小时呈现横盘整理态势的例子。","p":"p1075"},{"t":"跳空缺口越大，当天就越有可能沿着跳空的方向呈趋势性走势。例如，左上图中的K线1就是一个大型的向上跳空缺口，而当天就成为一个上涨趋势的交易日。","p":"p1076"},{"t":"左侧的两幅图展示了开盘大规模向上跳空：左上图为上涨趋势，左下图为下跌趋势。右侧的两幅图为开盘大规模向下跳空：右上图为上涨趋势，右下图为下跌趋势。","p":"p1077"},{"t":"开盘大幅跳空高开，K线1是一根阳线。趋势启动于开盘时段，当天成为一个跳空高潮通道上涨趋势交易日。","p":"p1078"},{"t":"K线4是一根十字星小阳线。市场在接下来的一两个小时里趋势下跌。一路跌至K线7这一当天最低点，过程中产生很多显著的上下影线，很多反复振荡的K线，几根阳线，这些现象都表明多空双方的胶着态势。多头持续不断地制造买压，以至于在当天后半程占据市场主导地位。","p":"p1079"},{"t":"开盘大幅跳空低开，K线10是一根阳线，趋势启动于开盘时段，当天成为一个上涨趋势交易日。","p":"p1080"},{"t":"开盘大幅跳空低开，K线18是一根十字星。市场继续横盘整理直到突破下行至K线23这根阴线。开盘十字星是一个双向震荡的信号，震荡行情一直持续了几个小时。经过一轮急跌后，市场呈下跌趋势，行情在K线24、25和26处测试移动平均线，空头以绝对优势压倒了多头。虽然空头在K线21和22处对移动平均线的测试表现较为强势，但却未足以令市场突破震荡区间。并转向趋势下跌。","p":"p1081"},{"t":"当开盘出现大幅向上或向下跳空且没有强势反转时，盈亏方程式对于顺势交易的交易员来说较为乐观。例如，当市场在K线1处大幅跳空高开，然后进入横盘整理，当天行情呈趋势上涨的概率大大增加，可能达到60%以上。交易员们预期当天的价格波动区间可能达到最近几天的平时振幅，在20个点左右。在回补缺口之前市场继续走高20个点的概率很可能在60%以上，在前几根K线买入的交易员冒着亏损10个点的风险博取15到20个点的利润，他们有60%的胜率，这是一笔不错的交易。价格波动很可能只回补一半的缺口，因此他们所承担的风险只有6个点而非10个点。不论哪种情况，这种可观的风险回报比有较高的胜率，而这正是开盘大幅跳空行情能够提供良好交易机会的原因。","p":"p1082"}]},{"t":"para","text":"如图20.2的右下图所示，在开盘大型跳空后。从K线18到K线22的震荡走势就是一个数小时呈现横盘整理态势的例子。","pid":"p1075"},{"t":"para","text":"跳空缺口越大，当天就越有可能沿着跳空的方向呈趋势性走势。例如，左上图中的K线1就是一个大型的向上跳空缺口，而当天就成为一个上涨趋势的交易日。","pid":"p1076"},{"t":"para","text":"左侧的两幅图展示了开盘大规模向上跳空：左上图为上涨趋势，左下图为下跌趋势。右侧的两幅图为开盘大规模向下跳空：右上图为上涨趋势，右下图为下跌趋势。","pid":"p1077"},{"t":"para","text":"开盘大幅跳空高开，K线1是一根阳线。趋势启动于开盘时段，当天成为一个跳空高潮通道上涨趋势交易日。","pid":"p1078"},{"t":"para","text":"K线4是一根十字星小阳线。市场在接下来的一两个小时里趋势下跌。一路跌至K线7这一当天最低点，过程中产生很多显著的上下影线，很多反复振荡的K线，几根阳线，这些现象都表明多空双方的胶着态势。多头持续不断地制造买压，以至于在当天后半程占据市场主导地位。","pid":"p1079"},{"t":"para","text":"开盘大幅跳空低开，K线10是一根阳线，趋势启动于开盘时段，当天成为一个上涨趋势交易日。","pid":"p1080"},{"t":"para","text":"开盘大幅跳空低开，K线18是一根十字星。市场继续横盘整理直到突破下行至K线23这根阴线。开盘十字星是一个双向震荡的信号，震荡行情一直持续了几个小时。经过一轮急跌后，市场呈下跌趋势，行情在K线24、25和26处测试移动平均线，空头以绝对优势压倒了多头。虽然空头在K线21和22处对移动平均线的测试表现较为强势，但却未足以令市场突破震荡区间。并转向趋势下跌。","pid":"p1081"},{"t":"para","text":"当开盘出现大幅向上或向下跳空且没有强势反转时，盈亏方程式对于顺势交易的交易员来说较为乐观。例如，当市场在K线1处大幅跳空高开，然后进入横盘整理，当天行情呈趋势上涨的概率大大增加，可能达到60%以上。交易员们预期当天的价格波动区间可能达到最近几天的平时振幅，在20个点左右。在回补缺口之前市场继续走高20个点的概率很可能在60%以上，在前几根K线买入的交易员冒着亏损10个点的风险博取15到20个点的利润，他们有60%的胜率，这是一笔不错的交易。价格波动很可能只回补一半的缺口，因此他们所承担的风险只有6个点而非10个点。不论哪种情况，这种可观的风险回报比有较高的胜率，而这正是开盘大幅跳空行情能够提供良好交易机会的原因。","pid":"p1082"}],"wcount":2662}],"wcount":37656},{"id":"p4","icon":"第四篇","title":"第四篇 总结归纳","blocks":[{"t":"para","text":"第四篇　总结归纳","pid":"p1083"},{"t":"para","text":"价格行为本质上是人性的表现，因此是有科学依据的。无论交易员研究的是什么市场、什么时间周期、什么类型的价格图表，都不影响价格行为理论的应用。因为所有这些市场的价格变化都是我们人类这一物种的行为表现。本书的第四部分将用具体的例子对价格行为理论在不同时间周期、不同市场的表现进行阐述，包括期权市场。同时，第四部分还将讨论什么样的交易机会是最值得交易员把握的，尤其是刚刚开始交易还没能实现稳定盈利的新手。最后，本部分还将总结一些重要的交易原则，指导交易员如何决定他们应该采取哪一类交易，以及如何管理他们的交易。","pid":"p1084"}],"sections":[{"id":"p4c1","title":"第21章　日内交易案例","blocks":[{"t":"para","text":"第21章　日内交易案例","pid":"p1085"},{"t":"para","text":"本章将本系列的三本书中的基础性原则进行综合运用，进行具体的日内交易案例的部析。","pid":"p1086"},{"t":"img","src":"assets/img/p4c1_001.webp","ctx":[{"t":"第21章　日内交易案例","p":"p1085"},{"t":"本章将本系列的三本书中的基础性原则进行综合运用，进行具体的日内交易案例的部析。","p":"p1086"},{"t":"图21.1是每根K线代表一万手成交量的国债价格走势。当成交量在某一笔成交时达到或超过一万手时，每根K线自动收盘。因为每根K线的最后一笔成交的量是不确定的，所以每根K线的实际组成交易量可能不会精确为一万手，而是会很可能大于一万手。由于这种K线不是基于时间周期的，所以有些时候一根K线很快就形成了，有时候要超过十分钟才能达到一万手的成交量。","p":"p1087"},{"t":"K线3、4、5是在下跌的熊市趋势中测试突破移动平均线但失败的空头入场时机。K线6是第二次出现熊市通道向下突破失败后迅速反转的入场信号K线，不过这一信号K线是一个十字星，它代表着反转动能还不够强。不过，在这之后形成的一波向上的反弹波段最终突破了下跌趋势线，并出现了下跌突破失败后的多头入场时机。","p":"p1088"},{"t":"K线7是上涨的第二个波段的低点，这一低点比前一个低点更高，但可惜它是一个十字星，代表着动能不是很强，市场可能处于震荡区间而不是有强烈的买盘支持，因此之后出现了两根巨大的熊市趋势K线的回调。虽然K线7的更高的低点是一个可以勉强接受的买入入场信号，但如果我们能够等待更强烈的多头入场信号，将会更好。如果你根据这个多头信号入场了，可能需要在K线8的下方止损出局。因为K线8是失败的低点2，可以在移动平均线下方进行卖空入场，而且K线8还是一根阴线。这是一个很强烈的卖空入场信号，多头的反趋势交易者应该要止损离场，甚至在空头很快要再次延续下跌趋势之前反手做空。反趋势交易者应该在低点2的信号K线下方出场，除非趋势已经明确反转，低点2的信号很可能失败。K线11就是这样一个例子","p":"p1089"},{"t":"K线9是一个更低的低点处主要趋势反转的K线，是在突破了K线6以及之前K线形成的楔形底部之后的反转，并显示突破失败。接下来市场很可能发生趋势反转，是一个买入信号K线。K线9同样是对此前形成的下跌趋势通道的向下突破失败后的多头反转K线，并形成了两根K线组成的反转。从K线6到K线9的窄幅震荡区间成了下跌趋势的最后旗形。同时，它也是K线2之后形成的更大的一个楔形的反转般来说，抛售潮和下跌通道的结束一般以三浪上涨推进模式为标志，而在这里是K线2、6、9。","p":"p1090"},{"t":"K线10突破了前一根内含阴线，这标志着此前一波下跌趋势K线附近的小幅回调已经结束。所以交易者可以在K线9的上方开始开多仓或者加多仓。在K线2之前的一波急速下跌以及后续的下跌趋势通道后，跟随了三浪下跌浪（每浪以K线2、6、9结束），再之后出现两浪反弹浪的可能性比较大。所以K线10附近的短暂休整不太可能是第二浪上升浪。而更可能是第一浪上升浪的一部分而已。之前的下跌趋势通道持续了20到30根K线，那么随后出现的反弹很可能持续至少一半数量的K线。如果反弹幅度太小，空头可能还不敢加仓，多头可能觉得反弹还没结束而继续买入多空双方都在观察市场是否会出现反转。而在K线10之后出现的四根强有力的阳线证明了这一点。那么此前形成的熊市下跌趋势通道的上沿有可能回到通道开始的起点K线3附近。在这个位置，多头可能会获利了结。这个区域是之前多头逐步建仓的价格区域，一旦市场价格回到他们建仓的成本价附近，他们会平掉所有仓位。他们在K线2和K线3之间建仓的头寸将会在盈亏平衡点附近了结，但他们更低价格建仓的头寸会有一些盈利。同时，这个区域也是空头会开始开空仓的位置，因为空头相信当天早些时候市场这个价位附近出现过一次加速下跌，这种情况有可能会再次重演。不过，随着行情演变，如果收盘前空头还没能盈利的话，他们会平掉空头头寸，因为他们不希望以亏损收盘。","p":"p1091"},{"t":"K线11是一个高点2的买入信号K线，高点1在两根K线之前出现了，是在市场出现一波上涨之后形成的。因为一般来说，市场的上涨至少有两浪，而K线11之前的两小浪回调的幅度实在是太小了，所以并不能代表第一大浪就此结束。这时，交易者认为市场有三种可能性：第一浪还没有结束，两小浪的回调只不过是复杂的第一大浪中的小部分而已：第一浪在这两小浪的回调中结束了，市场很快将开启第二浪上升浪，第一浪结束了，但回调还没结束，市场可能会出现更深幅度的回调，然后再出现第二浪上升浪来突破此前的高点。不过三种情形的共同点是市场价格未来可能会更高，而这意味着买入机会。是的，K线11本应是两根K线组成的顶部反转的入场信号K线也是在下跌趋势中移动平均线跳空飞线的第二次空头入场机会。这可能意味着市场还将测试新低。然而，K线11出现了反转，在大多数交易者看来市场已经转人了始终在场策略的做多状态，所以下跌做空的空间已经不大。大多数人认为这里的反转信号比做空信号更为强烈。","p":"p1092"}]},{"t":"para","text":"图21.1是每根K线代表一万手成交量的国债价格走势。当成交量在某一笔成交时达到或超过一万手时，每根K线自动收盘。因为每根K线的最后一笔成交的量是不确定的，所以每根K线的实际组成交易量可能不会精确为一万手，而是会很可能大于一万手。由于这种K线不是基于时间周期的，所以有些时候一根K线很快就形成了，有时候要超过十分钟才能达到一万手的成交量。","pid":"p1087"},{"t":"para","text":"K线3、4、5是在下跌的熊市趋势中测试突破移动平均线但失败的空头入场时机。K线6是第二次出现熊市通道向下突破失败后迅速反转的入场信号K线，不过这一信号K线是一个十字星，它代表着反转动能还不够强。不过，在这之后形成的一波向上的反弹波段最终突破了下跌趋势线，并出现了下跌突破失败后的多头入场时机。","pid":"p1088"},{"t":"para","text":"K线7是上涨的第二个波段的低点，这一低点比前一个低点更高，但可惜它是一个十字星，代表着动能不是很强，市场可能处于震荡区间而不是有强烈的买盘支持，因此之后出现了两根巨大的熊市趋势K线的回调。虽然K线7的更高的低点是一个可以勉强接受的买入入场信号，但如果我们能够等待更强烈的多头入场信号，将会更好。如果你根据这个多头信号入场了，可能需要在K线8的下方止损出局。因为K线8是失败的低点2，可以在移动平均线下方进行卖空入场，而且K线8还是一根阴线。这是一个很强烈的卖空入场信号，多头的反趋势交易者应该要止损离场，甚至在空头很快要再次延续下跌趋势之前反手做空。反趋势交易者应该在低点2的信号K线下方出场，除非趋势已经明确反转，低点2的信号很可能失败。K线11就是这样一个例子","pid":"p1089"},{"t":"para","text":"K线9是一个更低的低点处主要趋势反转的K线，是在突破了K线6以及之前K线形成的楔形底部之后的反转，并显示突破失败。接下来市场很可能发生趋势反转，是一个买入信号K线。K线9同样是对此前形成的下跌趋势通道的向下突破失败后的多头反转K线，并形成了两根K线组成的反转。从K线6到K线9的窄幅震荡区间成了下跌趋势的最后旗形。同时，它也是K线2之后形成的更大的一个楔形的反转般来说，抛售潮和下跌通道的结束一般以三浪上涨推进模式为标志，而在这里是K线2、6、9。","pid":"p1090"},{"t":"para","text":"K线10突破了前一根内含阴线，这标志着此前一波下跌趋势K线附近的小幅回调已经结束。所以交易者可以在K线9的上方开始开多仓或者加多仓。在K线2之前的一波急速下跌以及后续的下跌趋势通道后，跟随了三浪下跌浪（每浪以K线2、6、9结束），再之后出现两浪反弹浪的可能性比较大。所以K线10附近的短暂休整不太可能是第二浪上升浪。而更可能是第一浪上升浪的一部分而已。之前的下跌趋势通道持续了20到30根K线，那么随后出现的反弹很可能持续至少一半数量的K线。如果反弹幅度太小，空头可能还不敢加仓，多头可能觉得反弹还没结束而继续买入多空双方都在观察市场是否会出现反转。而在K线10之后出现的四根强有力的阳线证明了这一点。那么此前形成的熊市下跌趋势通道的上沿有可能回到通道开始的起点K线3附近。在这个位置，多头可能会获利了结。这个区域是之前多头逐步建仓的价格区域，一旦市场价格回到他们建仓的成本价附近，他们会平掉所有仓位。他们在K线2和K线3之间建仓的头寸将会在盈亏平衡点附近了结，但他们更低价格建仓的头寸会有一些盈利。同时，这个区域也是空头会开始开空仓的位置，因为空头相信当天早些时候市场这个价位附近出现过一次加速下跌，这种情况有可能会再次重演。不过，随着行情演变，如果收盘前空头还没能盈利的话，他们会平掉空头头寸，因为他们不希望以亏损收盘。","pid":"p1091"},{"t":"para","text":"K线11是一个高点2的买入信号K线，高点1在两根K线之前出现了，是在市场出现一波上涨之后形成的。因为一般来说，市场的上涨至少有两浪，而K线11之前的两小浪回调的幅度实在是太小了，所以并不能代表第一大浪就此结束。这时，交易者认为市场有三种可能性：第一浪还没有结束，两小浪的回调只不过是复杂的第一大浪中的小部分而已：第一浪在这两小浪的回调中结束了，市场很快将开启第二浪上升浪，第一浪结束了，但回调还没结束，市场可能会出现更深幅度的回调，然后再出现第二浪上升浪来突破此前的高点。不过三种情形的共同点是市场价格未来可能会更高，而这意味着买入机会。是的，K线11本应是两根K线组成的顶部反转的入场信号K线也是在下跌趋势中移动平均线跳空飞线的第二次空头入场机会。这可能意味着市场还将测试新低。然而，K线11出现了反转，在大多数交易者看来市场已经转人了始终在场策略的做多状态，所以下跌做空的空间已经不大。大多数人认为这里的反转信号比做空信号更为强烈。","pid":"p1092"},{"t":"img","src":"assets/img/p4c1_002.webp","ctx":[{"t":"K线10突破了前一根内含阴线，这标志着此前一波下跌趋势K线附近的小幅回调已经结束。所以交易者可以在K线9的上方开始开多仓或者加多仓。在K线2之前的一波急速下跌以及后续的下跌趋势通道后，跟随了三浪下跌浪（每浪以K线2、6、9结束），再之后出现两浪反弹浪的可能性比较大。所以K线10附近的短暂休整不太可能是第二浪上升浪。而更可能是第一浪上升浪的一部分而已。之前的下跌趋势通道持续了20到30根K线，那么随后出现的反弹很可能持续至少一半数量的K线。如果反弹幅度太小，空头可能还不敢加仓，多头可能觉得反弹还没结束而继续买入多空双方都在观察市场是否会出现反转。而在K线10之后出现的四根强有力的阳线证明了这一点。那么此前形成的熊市下跌趋势通道的上沿有可能回到通道开始的起点K线3附近。在这个位置，多头可能会获利了结。这个区域是之前多头逐步建仓的价格区域，一旦市场价格回到他们建仓的成本价附近，他们会平掉所有仓位。他们在K线2和K线3之间建仓的头寸将会在盈亏平衡点附近了结，但他们更低价格建仓的头寸会有一些盈利。同时，这个区域也是空头会开始开空仓的位置，因为空头相信当天早些时候市场这个价位附近出现过一次加速下跌，这种情况有可能会再次重演。不过，随着行情演变，如果收盘前空头还没能盈利的话，他们会平掉空头头寸，因为他们不希望以亏损收盘。","p":"p1091"},{"t":"K线11是一个高点2的买入信号K线，高点1在两根K线之前出现了，是在市场出现一波上涨之后形成的。因为一般来说，市场的上涨至少有两浪，而K线11之前的两小浪回调的幅度实在是太小了，所以并不能代表第一大浪就此结束。这时，交易者认为市场有三种可能性：第一浪还没有结束，两小浪的回调只不过是复杂的第一大浪中的小部分而已：第一浪在这两小浪的回调中结束了，市场很快将开启第二浪上升浪，第一浪结束了，但回调还没结束，市场可能会出现更深幅度的回调，然后再出现第二浪上升浪来突破此前的高点。不过三种情形的共同点是市场价格未来可能会更高，而这意味着买入机会。是的，K线11本应是两根K线组成的顶部反转的入场信号K线也是在下跌趋势中移动平均线跳空飞线的第二次空头入场机会。这可能意味着市场还将测试新低。然而，K线11出现了反转，在大多数交易者看来市场已经转人了始终在场策略的做多状态，所以下跌做空的空间已经不大。大多数人认为这里的反转信号比做空信号更为强烈。","p":"p1092"},{"t":"如图21.2所示，欧元兑美元的5分钟K线图在K线2创新高后反转向下，这波牛市浪潮有着很大的动能，因为这波浪潮中的8根连续的K线中没有出现一根熊市趋势K线，所以在市场跌落这股牛市趋势的底部，也就是K线1的下方之前，任何回调都有很大的概率去测试K线2的高点。K线3是一根在移动平均线下方的跳空K线，同时也测试了反弹的起点K线1的突破。K线3同之前的两根K线一起形成了一个微型楔形。至少会带来一波反弹。K线3同时也是在强劲的牛市趋势后形成的一个楔形牛市旗形。最初的一波下推浪是K线2之前的三根K线，第二波下推浪是K线2之后的两根K线，而第三波下推浪正是K线3。","p":"p1093"},{"t":"市场形成了一个三角形，并在三角形结束之后形成了狭窄的震荡区间。三角形至少形成了三波同一方向的浪潮，K线2、4，以及K线6或者K线8形成了三波上推浪。同时K线1或K线3以及后面的K线5和K线6形成了三波下推浪。因为你可以选择不同的可能性，所以有一些交易者可能会更相信这个方向，而另外一些交易者可能会更相信另外一个方向。因为市场上存在这样的困惑，并且市场正好处于震荡区间，接下来很可能会出现突破模式，所以大部分的交易者都应该等待突破的出现，而非着急地在狭窄的震荡区间进行交易。","p":"p1094"},{"t":"K线8是一根相对于震荡区间的底部处的熊市外包K线开始的反转K线。同时也是一次失败的向上突破尝试（比K线4这个高点低一个价位）。K线8与K线4或者K线6一起形成了一个双重顶部的熊市旗形。","p":"p1095"},{"t":"K线9是一根超过外包K线中部的突破回调的小型K线，它提供了一个低风险的卖空时机。","p":"p1096"},{"t":"K线10是另一个突破回调的卖空时机。","p":"p1097"},{"t":"K线11与另外一根熊市信号K线形成了在移动平均线上的低点2的卖空时机。同时也是市场第二次企图向下突破K线3的低点的尝试。","p":"p1098"},{"t":"K线12是在移动平均线上形成的另外一个低点2的卖空时机。始终保持交易的状态。空头可能会因为市场上出现的牛市十字星形成的更高的低点而变得自满得意，但是你必须保持警惕，因为市场还是在熊市震荡的状态。如果市场跌破了这根K线，那么还有可能会形成一个低点2的卖空机会。","p":"p1099"},{"t":"在越过趋势通道线和卖出高潮K线后。K线13是一个ii型的买入入场时机。这是一个抛物面的楔形底部，这意味着市场加速下跌至最后的低点然后迅速反弹。从K线10开始有3波下推浪，同时连接最初的两波下推浪的趋势线的斜率（连接K线10和K线11的震荡低点）要比连接第二波和第三波下推浪的趋势线的斜率（连接K线11后面的震荡低点以及K线13之前的最后的低点）更加平缓。","p":"p1100"},{"t":"市场已经下行了大概20根K线，然后突然出现了一根最大的熊市趋势K线（K线13之前的两根K线）以及在这个熊市趋势中的最大的两根K线的熊市浪潮。这波浪潮可能很好地代表了市场上的疲惫，它可能是市场上较弱的多头和空头最后一次卖空。强大的多头会在这里买入，并且当市场回调时。他们会进行刮头皮交易而非恐慌，而强劲的空头将在市场出现大型回调时才会做空。这创造了一个至少延续十根K线的两浪反转时机。这根强劲的牛市做多K线是多头正在逐步掌握市场的信号，同时它也是一根非常好的信号K线。","p":"p1101"},{"t":"K线15也是一个三浪上推模式，同时也是第一根移动平均线的跳空K线。从K线13开始的两根K线的牛市趋势浪也是一波上升浪。上升浪和楔形模式通常在市场调整之前还会带来两波上升浪，正如这里发生的一样。","p":"p1102"},{"t":"K线16是一个i形态的，更高的低点的做多时机。因为许多交易者都期待市场会在趋势通道被超越的地方出现至少两波上升浪，从而反转K线13的低点入场时机。K线16与K线14和K线15形成的楔形通道的底部一起形成了一个双重底部的牛市旗形。大熊市趋势K线使得空头陷人了做空的陷阱，同时也困住了那些不做多的弱势的多头。","p":"p1103"}]},{"t":"para","text":"如图21.2所示，欧元兑美元的5分钟K线图在K线2创新高后反转向下，这波牛市浪潮有着很大的动能，因为这波浪潮中的8根连续的K线中没有出现一根熊市趋势K线，所以在市场跌落这股牛市趋势的底部，也就是K线1的下方之前，任何回调都有很大的概率去测试K线2的高点。K线3是一根在移动平均线下方的跳空K线，同时也测试了反弹的起点K线1的突破。K线3同之前的两根K线一起形成了一个微型楔形。至少会带来一波反弹。K线3同时也是在强劲的牛市趋势后形成的一个楔形牛市旗形。最初的一波下推浪是K线2之前的三根K线，第二波下推浪是K线2之后的两根K线，而第三波下推浪正是K线3。","pid":"p1093"},{"t":"para","text":"市场形成了一个三角形，并在三角形结束之后形成了狭窄的震荡区间。三角形至少形成了三波同一方向的浪潮，K线2、4，以及K线6或者K线8形成了三波上推浪。同时K线1或K线3以及后面的K线5和K线6形成了三波下推浪。因为你可以选择不同的可能性，所以有一些交易者可能会更相信这个方向，而另外一些交易者可能会更相信另外一个方向。因为市场上存在这样的困惑，并且市场正好处于震荡区间，接下来很可能会出现突破模式，所以大部分的交易者都应该等待突破的出现，而非着急地在狭窄的震荡区间进行交易。","pid":"p1094"},{"t":"para","text":"K线8是一根相对于震荡区间的底部处的熊市外包K线开始的反转K线。同时也是一次失败的向上突破尝试（比K线4这个高点低一个价位）。K线8与K线4或者K线6一起形成了一个双重顶部的熊市旗形。","pid":"p1095"},{"t":"para","text":"K线9是一根超过外包K线中部的突破回调的小型K线，它提供了一个低风险的卖空时机。","pid":"p1096"},{"t":"para","text":"K线10是另一个突破回调的卖空时机。","pid":"p1097"},{"t":"para","text":"K线11与另外一根熊市信号K线形成了在移动平均线上的低点2的卖空时机。同时也是市场第二次企图向下突破K线3的低点的尝试。","pid":"p1098"},{"t":"para","text":"K线12是在移动平均线上形成的另外一个低点2的卖空时机。始终保持交易的状态。空头可能会因为市场上出现的牛市十字星形成的更高的低点而变得自满得意，但是你必须保持警惕，因为市场还是在熊市震荡的状态。如果市场跌破了这根K线，那么还有可能会形成一个低点2的卖空机会。","pid":"p1099"},{"t":"para","text":"在越过趋势通道线和卖出高潮K线后。K线13是一个ii型的买入入场时机。这是一个抛物面的楔形底部，这意味着市场加速下跌至最后的低点然后迅速反弹。从K线10开始有3波下推浪，同时连接最初的两波下推浪的趋势线的斜率（连接K线10和K线11的震荡低点）要比连接第二波和第三波下推浪的趋势线的斜率（连接K线11后面的震荡低点以及K线13之前的最后的低点）更加平缓。","pid":"p1100"},{"t":"para","text":"市场已经下行了大概20根K线，然后突然出现了一根最大的熊市趋势K线（K线13之前的两根K线）以及在这个熊市趋势中的最大的两根K线的熊市浪潮。这波浪潮可能很好地代表了市场上的疲惫，它可能是市场上较弱的多头和空头最后一次卖空。强大的多头会在这里买入，并且当市场回调时。他们会进行刮头皮交易而非恐慌，而强劲的空头将在市场出现大型回调时才会做空。这创造了一个至少延续十根K线的两浪反转时机。这根强劲的牛市做多K线是多头正在逐步掌握市场的信号，同时它也是一根非常好的信号K线。","pid":"p1101"},{"t":"para","text":"K线15也是一个三浪上推模式，同时也是第一根移动平均线的跳空K线。从K线13开始的两根K线的牛市趋势浪也是一波上升浪。上升浪和楔形模式通常在市场调整之前还会带来两波上升浪，正如这里发生的一样。","pid":"p1102"},{"t":"para","text":"K线16是一个i形态的，更高的低点的做多时机。因为许多交易者都期待市场会在趋势通道被超越的地方出现至少两波上升浪，从而反转K线13的低点入场时机。K线16与K线14和K线15形成的楔形通道的底部一起形成了一个双重底部的牛市旗形。大熊市趋势K线使得空头陷人了做空的陷阱，同时也困住了那些不做多的弱势的多头。","pid":"p1103"},{"t":"img","src":"assets/img/p4c1_003.webp","ctx":[{"t":"K线15也是一个三浪上推模式，同时也是第一根移动平均线的跳空K线。从K线13开始的两根K线的牛市趋势浪也是一波上升浪。上升浪和楔形模式通常在市场调整之前还会带来两波上升浪，正如这里发生的一样。","p":"p1102"},{"t":"K线16是一个i形态的，更高的低点的做多时机。因为许多交易者都期待市场会在趋势通道被超越的地方出现至少两波上升浪，从而反转K线13的低点入场时机。K线16与K线14和K线15形成的楔形通道的底部一起形成了一个双重底部的牛市旗形。大熊市趋势K线使得空头陷人了做空的陷阱，同时也困住了那些不做多的弱势的多头。","p":"p1103"},{"t":"如图21.3所示。在大豆市场的5分钟K线图上开盘处出现了一个买入高潮，之后出现了一个小型的最后旗形，然后是一个楔形熊市旗形，最后出现了一波较大的二次下推浪。","p":"p1104"},{"t":"在K线1这根上涨高潮过后，K线2是一根十字星型的震荡区间，因此也是一个不太好的买入入场时机。市场由震荡行情转变为下跌行情的概率还是很大的。激进的交易者将会在之前一根K线的高点上方设置卖空限价订单，在K线3所有的订单会被执行。同时他们期待高点1会失败。K线3是一个低点2的卖空时机，一个更低的高点，一个最终旗形的卖空时机。交易者在K线1的买入高潮之后，会寻找市场的调整时期，可能的开盘反转点以及盘中高点。","p":"p1105"},{"t":"K线4打破了一根熊市趋势K线，反转了从第一条K线处开始的双重底部。这可能会是一天中的最低点。这个入场时机在K线6这根i模式的K线之上，同时有一个在移动平均线上方的牛市收盘。","p":"p1106"},{"t":"K线9是一个更低的高点的形熊市旗形，与K线3一起形成了一个双重顶部的熊市旗形。K线9是从K线4的低点开始形成的四浪上推模式中的最后一浪，这使得它也成为一个变体的低点4。市场从K线1开始会形成两波大的下跌浪，所以交易者可以在K线9的下方或者K线9之后的熊市K线的下方开始卖空。你可以看到在K线9之后的熊市K线之后又是一根强劲的熊市趋势K线，这意味着许多交易者在K线9之后的熊市K线下方卖空了","p":"p1107"},{"t":"K线10是从趋势线的突破开始的突破回调。","p":"p1108"},{"t":"K线11是在一天中的新低点后形成的一根强劲的牛市反转K线，也是一个两根K线的反转模式然而，K线12并没有超越K线11的高点。因为在K线11的早期入场的被困住的多头可以在K线12这根熊市趋势K线的下方离场，所以K线12也是一个绝佳的卖空信号。K线12也是一个突破回调的卖空信号。K线13是一个突破回调的卖空入场时机。","p":"p1109"}]},{"t":"para","text":"如图21.3所示。在大豆市场的5分钟K线图上开盘处出现了一个买入高潮，之后出现了一个小型的最后旗形，然后是一个楔形熊市旗形，最后出现了一波较大的二次下推浪。","pid":"p1104"},{"t":"para","text":"在K线1这根上涨高潮过后，K线2是一根十字星型的震荡区间，因此也是一个不太好的买入入场时机。市场由震荡行情转变为下跌行情的概率还是很大的。激进的交易者将会在之前一根K线的高点上方设置卖空限价订单，在K线3所有的订单会被执行。同时他们期待高点1会失败。K线3是一个低点2的卖空时机，一个更低的高点，一个最终旗形的卖空时机。交易者在K线1的买入高潮之后，会寻找市场的调整时期，可能的开盘反转点以及盘中高点。","pid":"p1105"},{"t":"para","text":"K线4打破了一根熊市趋势K线，反转了从第一条K线处开始的双重底部。这可能会是一天中的最低点。这个入场时机在K线6这根i模式的K线之上，同时有一个在移动平均线上方的牛市收盘。","pid":"p1106"},{"t":"para","text":"K线9是一个更低的高点的形熊市旗形，与K线3一起形成了一个双重顶部的熊市旗形。K线9是从K线4的低点开始形成的四浪上推模式中的最后一浪，这使得它也成为一个变体的低点4。市场从K线1开始会形成两波大的下跌浪，所以交易者可以在K线9的下方或者K线9之后的熊市K线的下方开始卖空。你可以看到在K线9之后的熊市K线之后又是一根强劲的熊市趋势K线，这意味着许多交易者在K线9之后的熊市K线下方卖空了","pid":"p1107"},{"t":"para","text":"K线10是从趋势线的突破开始的突破回调。","pid":"p1108"},{"t":"para","text":"K线11是在一天中的新低点后形成的一根强劲的牛市反转K线，也是一个两根K线的反转模式然而，K线12并没有超越K线11的高点。因为在K线11的早期入场的被困住的多头可以在K线12这根熊市趋势K线的下方离场，所以K线12也是一个绝佳的卖空信号。K线12也是一个突破回调的卖空信号。K线13是一个突破回调的卖空入场时机。","pid":"p1109"},{"t":"img","src":"assets/img/p4c1_004.webp","ctx":[{"t":"K线10是从趋势线的突破开始的突破回调。","p":"p1108"},{"t":"K线11是在一天中的新低点后形成的一根强劲的牛市反转K线，也是一个两根K线的反转模式然而，K线12并没有超越K线11的高点。因为在K线11的早期入场的被困住的多头可以在K线12这根熊市趋势K线的下方离场，所以K线12也是一个绝佳的卖空信号。K线12也是一个突破回调的卖空信号。K线13是一个突破回调的卖空入场时机。","p":"p1109"},{"t":"如图21.4所示，在原油市场的5分钟图表上，出现了一个楔形顶部，之后出现了一个更低的高点。K线1是从早期的震荡区间的突破处开始的高点1的突破回调形态。这是一个两根K线的反转模式。也是之前一个强劲的两浪反转上升模式之后出现的第一个回调，它打破了震荡区间，并使得市场进入了始终做多的模式。","p":"p1110"},{"t":"K线3是一个很好的超越牛市趋势K线的高点2的做多时机，虽然之前出现了一波上歸下跳的震荡行情和第二个买入高潮，但是K线2的顶部并不足以证明空头已经掌控了市场。","p":"p1111"},{"t":"K线5是一个楔形顶部，也是自K线2这根牛市上升K线之后出现的通道顶部。K线2之后市场进入了震荡区间，出现了很多有着突出的尾部的K线，重叠的K线，回调的K线，以及有着熊市主体的K线，所以市场会进一步测试K线3这个通道的底部K线的机会还是很大的。","p":"p1112"},{"t":"下跌至K线6处的下跌浪打破了趋势线。并且略微突破了之前的牛市趋势中出现的更高的低点K线3，所以这意味着市场上有一股强劲的做空力量。","p":"p1113"},{"t":"K线7是一个突破了K线5这根信号K线的低点的两浪突破模式，一个在市场突破牛市趋势线之后出现的更低的高点，因此也是一个潜在的主要趋势的反转，一个两根K线的反转的卖空机遇，一个在移动平均线上方出现的剧烈反转，一个楔形熊市旗形。这个楔形熊市旗形的更低的高点处形成的第一波上升浪是在K线6的4根K线前形成的那根小牛市K线，第二波上升浪是K线6之后的那根K线。","p":"p1114"}]},{"t":"para","text":"如图21.4所示，在原油市场的5分钟图表上，出现了一个楔形顶部，之后出现了一个更低的高点。K线1是从早期的震荡区间的突破处开始的高点1的突破回调形态。这是一个两根K线的反转模式。也是之前一个强劲的两浪反转上升模式之后出现的第一个回调，它打破了震荡区间，并使得市场进入了始终做多的模式。","pid":"p1110"},{"t":"para","text":"K线3是一个很好的超越牛市趋势K线的高点2的做多时机，虽然之前出现了一波上歸下跳的震荡行情和第二个买入高潮，但是K线2的顶部并不足以证明空头已经掌控了市场。","pid":"p1111"},{"t":"para","text":"K线5是一个楔形顶部，也是自K线2这根牛市上升K线之后出现的通道顶部。K线2之后市场进入了震荡区间，出现了很多有着突出的尾部的K线，重叠的K线，回调的K线，以及有着熊市主体的K线，所以市场会进一步测试K线3这个通道的底部K线的机会还是很大的。","pid":"p1112"},{"t":"para","text":"下跌至K线6处的下跌浪打破了趋势线。并且略微突破了之前的牛市趋势中出现的更高的低点K线3，所以这意味着市场上有一股强劲的做空力量。","pid":"p1113"},{"t":"para","text":"K线7是一个突破了K线5这根信号K线的低点的两浪突破模式，一个在市场突破牛市趋势线之后出现的更低的高点，因此也是一个潜在的主要趋势的反转，一个两根K线的反转的卖空机遇，一个在移动平均线上方出现的剧烈反转，一个楔形熊市旗形。这个楔形熊市旗形的更低的高点处形成的第一波上升浪是在K线6的4根K线前形成的那根小牛市K线，第二波上升浪是K线6之后的那根K线。","pid":"p1114"},{"t":"img","src":"assets/img/p4c1_005.webp","ctx":[{"t":"下跌至K线6处的下跌浪打破了趋势线。并且略微突破了之前的牛市趋势中出现的更高的低点K线3，所以这意味着市场上有一股强劲的做空力量。","p":"p1113"},{"t":"K线7是一个突破了K线5这根信号K线的低点的两浪突破模式，一个在市场突破牛市趋势线之后出现的更低的高点，因此也是一个潜在的主要趋势的反转，一个两根K线的反转的卖空机遇，一个在移动平均线上方出现的剧烈反转，一个楔形熊市旗形。这个楔形熊市旗形的更低的高点处形成的第一波上升浪是在K线6的4根K线前形成的那根小牛市K线，第二波上升浪是K线6之后的那根K线。","p":"p1114"},{"t":"图21.5是一个1分钟的图表，在最初的90分钟里形成了很多个有价格行为的刮头皮交易时机。下面那张图是这90分钟的细节图。对于大部分交易者来说，几乎不可能又快又准确地抓住这些刮头皮交易时机，但是这张图主要是为了证明即使在1分钟的水平里。价格行为分析也是有用的。","p":"p1115"}]},{"t":"para","text":"图21.5是一个1分钟的图表，在最初的90分钟里形成了很多个有价格行为的刮头皮交易时机。下面那张图是这90分钟的细节图。对于大部分交易者来说，几乎不可能又快又准确地抓住这些刮头皮交易时机，但是这张图主要是为了证明即使在1分钟的水平里。价格行为分析也是有用的。","pid":"p1115"},{"t":"img","src":"assets/img/p4c1_006.webp","ctx":[{"t":"图21.5是一个1分钟的图表，在最初的90分钟里形成了很多个有价格行为的刮头皮交易时机。下面那张图是这90分钟的细节图。对于大部分交易者来说，几乎不可能又快又准确地抓住这些刮头皮交易时机，但是这张图主要是为了证明即使在1分钟的水平里。价格行为分析也是有用的。","p":"p1115"},{"t":"图21.6是1分钟的标普500期货市场最初的90分钟的细节图，特别突出了有价格行为的刮头皮交易时机，在这张图上标识的数字和上一张图一样。","p":"p1116"},{"t":"K线1是一个高点2的买入时机（之前有两波下推浪）。","p":"p1117"},{"t":"K线2是一个楔形卖空时机和一个最终旗形。","p":"p1118"},{"t":"K线3是一个突破回调的卖空时机。也是在熊市下跌浪之后出现的低点1。","p":"p1119"},{"t":"K线4是一个测试突破的卖空时机。在K线3是低点1的基础上，K线4也是一个低点2","p":"p1120"},{"t":"K线5是一个更低的高点，也是一个向下突破了移动平均线的低点2的卖空时机。","p":"p1121"},{"t":"K线6是一个楔形的做多时机，一个两根K线的反转，一个扩展的三角形底部。","p":"p1122"},{"t":"K线7是一个失败的突破趋势线的卖空时机，与K线5一起形成了一个双重顶部的熊市旗形。","p":"p1123"},{"t":"在K线7之后，K线8是在两浪下跌模式中形成的更低的低点也是在一个震荡日终形成的更低的低点。","p":"p1124"},{"t":"K线10是一个形反转的第二次入场通道，一个更高的低点这个更高的低点意味着牛市趋势正在形成。","p":"p1125"},{"t":"K线11是在趋势线突破后形成的第一波回调，在前三根K线形成了高点1的基础上，K线11也是一个高点2。","p":"p1126"},{"t":"K线12是另一个牛市的高点2。","p":"p1127"},{"t":"K线13是一个楔形卖空时机，一个最终旗形，同时是一个潜在的双重顶部的熊市旗形（与K线4一起）。","p":"p1128"},{"t":"K线14是一个失败的牛市趋势线的突破，一个向下突破了震荡区间的失败的突破。一个双重底部牛市旗形。和一个潜在的两浪上升模式的开始。","p":"p1129"},{"t":"K线15是一个高点2，在两根K线之前有一个牛市旗形的突破回调。","p":"p1130"},{"t":"K线16是在牛市趋势中出现的高点2。","p":"p1131"},{"t":"K线17是一个楔形，没有测试到当天的高点（一个双重顶部），因此是一个潜在的更低的高点。","p":"p1132"},{"t":"K线19是在移动平均线上出现的熊市低点2，一个形熊市旗形，对于在K线18处买入的交易者来说，它还是一个5个价位的失败，同时它也是在市场的下跌浪后出现的第一波回调，这将市场转变为始终做空的模式。","p":"p1133"},{"t":"K线20是一个两浪下推模式，将市场推向了新的低点（K线18则是第一个低点），此时市场还处于震荡区间日（虽然从K线17的高点开始市场出现了很强劲的下跌浪，但在这个时点市场还不是熊市交易日）。在市场的一个价位的新低出现后，K线20也是一根反转向上的K线（一根一个价位的失败的突破K线，和一个双重底部）。它也是一个楔形，在两根K线的最终旗形的突破形成后，它也是两根K线的反转向上模式。","p":"p1134"},{"t":"K线21是第二波上升浪，一个楔形熊市旗形（在K线20之前的i模式是第一波上升浪），一个潜在的双重顶部熊市旗形（和K线19一起）。","p":"p1135"},{"t":"K线22是在趋势线被突破后形成的两浪回调模式，并将市场推向了一个更高的低点，并且相对于之前的双重底部来说（K线10和K线20形成），也是一次回调做多时机。","p":"p1136"},{"t":"K线23是一个失败的趋势线的突破，一个双重底部的牛市旗形（K线23比K线22高一个价位）。","p":"p1137"}]},{"t":"para","text":"图21.6是1分钟的标普500期货市场最初的90分钟的细节图，特别突出了有价格行为的刮头皮交易时机，在这张图上标识的数字和上一张图一样。","pid":"p1116"},{"t":"para","text":"K线1是一个高点2的买入时机（之前有两波下推浪）。","pid":"p1117"},{"t":"para","text":"K线2是一个楔形卖空时机和一个最终旗形。","pid":"p1118"},{"t":"para","text":"K线3是一个突破回调的卖空时机。也是在熊市下跌浪之后出现的低点1。","pid":"p1119"},{"t":"para","text":"K线4是一个测试突破的卖空时机。在K线3是低点1的基础上，K线4也是一个低点2","pid":"p1120"},{"t":"para","text":"K线5是一个更低的高点，也是一个向下突破了移动平均线的低点2的卖空时机。","pid":"p1121"},{"t":"para","text":"K线6是一个楔形的做多时机，一个两根K线的反转，一个扩展的三角形底部。","pid":"p1122"},{"t":"para","text":"K线7是一个失败的突破趋势线的卖空时机，与K线5一起形成了一个双重顶部的熊市旗形。","pid":"p1123"},{"t":"para","text":"在K线7之后，K线8是在两浪下跌模式中形成的更低的低点也是在一个震荡日终形成的更低的低点。","pid":"p1124"},{"t":"para","text":"K线10是一个形反转的第二次入场通道，一个更高的低点这个更高的低点意味着牛市趋势正在形成。","pid":"p1125"},{"t":"para","text":"K线11是在趋势线突破后形成的第一波回调，在前三根K线形成了高点1的基础上，K线11也是一个高点2。","pid":"p1126"},{"t":"para","text":"K线12是另一个牛市的高点2。","pid":"p1127"},{"t":"para","text":"K线13是一个楔形卖空时机，一个最终旗形，同时是一个潜在的双重顶部的熊市旗形（与K线4一起）。","pid":"p1128"},{"t":"para","text":"K线14是一个失败的牛市趋势线的突破，一个向下突破了震荡区间的失败的突破。一个双重底部牛市旗形。和一个潜在的两浪上升模式的开始。","pid":"p1129"},{"t":"para","text":"K线15是一个高点2，在两根K线之前有一个牛市旗形的突破回调。","pid":"p1130"},{"t":"para","text":"K线16是在牛市趋势中出现的高点2。","pid":"p1131"},{"t":"para","text":"K线17是一个楔形，没有测试到当天的高点（一个双重顶部），因此是一个潜在的更低的高点。","pid":"p1132"},{"t":"para","text":"K线19是在移动平均线上出现的熊市低点2，一个形熊市旗形，对于在K线18处买入的交易者来说，它还是一个5个价位的失败，同时它也是在市场的下跌浪后出现的第一波回调，这将市场转变为始终做空的模式。","pid":"p1133"},{"t":"para","text":"K线20是一个两浪下推模式，将市场推向了新的低点（K线18则是第一个低点），此时市场还处于震荡区间日（虽然从K线17的高点开始市场出现了很强劲的下跌浪，但在这个时点市场还不是熊市交易日）。在市场的一个价位的新低出现后，K线20也是一根反转向上的K线（一根一个价位的失败的突破K线，和一个双重底部）。它也是一个楔形，在两根K线的最终旗形的突破形成后，它也是两根K线的反转向上模式。","pid":"p1134"},{"t":"para","text":"K线21是第二波上升浪，一个楔形熊市旗形（在K线20之前的i模式是第一波上升浪），一个潜在的双重顶部熊市旗形（和K线19一起）。","pid":"p1135"},{"t":"para","text":"K线22是在趋势线被突破后形成的两浪回调模式，并将市场推向了一个更高的低点，并且相对于之前的双重底部来说（K线10和K线20形成），也是一次回调做多时机。","pid":"p1136"},{"t":"para","text":"K线23是一个失败的趋势线的突破，一个双重底部的牛市旗形（K线23比K线22高一个价位）。","pid":"p1137"}],"wcount":5982},{"id":"p4c2","title":"第22章　日线、周线和月线图","blocks":[{"t":"para","text":"第22章　日线、周线和月线图","pid":"p1138"},{"t":"para","text":"虽然日线图、周线图和月线图都可以看到日内的信号，但是这些信号发生的频率非常低，对于做日内交易的交易者来说并不是一个值得被参考的信号。最普通的信号一般是基于昨天的高点和低点得出的，而这些信号可以用5分钟的图表看到。当然，在更长的时间图上会更经常地出现基于价格行为的交易信号，但是因为这些长周期的K线主体都很大，所以如果风险和日内交易相同的话，那么能够交易的合约数将更少。此外，如果隔夜的话，也意味着你应该更大幅度地减少你交易的合约数量。或者考虑风险有限的期权策略，比如说买入期权策略和期权套利策略。日内交易者只有在不进行日内交易的时候才应该使用这些图表，因为通过日线图进行的交易合约和股票更少，所以用这些成交量大的K线很容易错失日内交易时机，而这些错失的时机造成的损失会远远高于他们从日线图上的信号得到的收益。","pid":"p1139"},{"t":"para","text":"虽然所有的股票价格走势都能形成标准的价格行为模式，但是机构持仓较少的小型公司的股票往往有很大的极端涨跌风险。他们往往会表现出更大的波动性，在股市的专业术语中，这些股票被称作是高β的股票。比如，你肯定不会期待沃尔玛的股票在一个月内上涨1000%，但是当一家小型药物公司的药物获得食品和药物管理局（FDA）批准，或者成为接管候选人时，这种情况是很有可能会发生的。有一些交易者会喜欢市场上出现的大而快的移动，但是大部分交易者还是倾向于避免这种风险，不论市场是朝哪个方向移动，他们尽量避免交易中会出现不能交易的订单。交易这种特殊的股票要求交易者时刻町盘，这使得他们不能在相同的时间交易其他的股票。因为此类股票的风险很大，他们只能交易他们的投资组合中的一小部分，这一小部分股票因为剧烈波动产生的收益也不足以完全抵消放弃交易其他股票带来的损失。当股市的不确定性增加时，大部分的交易者都不应该去交易这些股票。","pid":"p1140"},{"t":"para","text":"当与强劲的市场趋势进行相反的交易时，你交易的目标应该是进行1%或2%的刮头皮交易，因为大部分的趋势反转最终都会失败，演变成趋势通道的回调入场机会。市场上出现的跳空使得入场信号变得更加复杂，一般来说，如果开盘价在昨天的价格波动区间内，且入场之后价格波动范围不会突破这一区间超过一个点，那么入场后整体的风险就比较小。如果你不能在盘中町盘，并且市场上出现了一个跳空开盘，那么这时你最好平仓。如果你在盘中是可以实时町盘的，市场出现了一个跳空开盘，那么你可以等待市场出现一个跳空的缺口回补，一旦市场没有能够回补缺口，而是继续朝着跳空的方向发展，那么这是一个很好的入场机会。用更通俗的话说，如果你正在寻找买入时机，但是今天是一个向上跳空开盘，那么你应该在开盘后寻找市场的回调机会，当市场开始出现反转尝试且失败的时候马上买入，并且把你的止损位设置在当时触及的最低点下方。如果这个入场信号失败了，价格触及了你的止损，那么你要寻找别的交易方法了，或者当市场出现第二次入场通道时再尝试一次。不要把太多的时间和精力浪费在那些价格走势没有按照你的预期去发展的股票上，因为太过于执着这些股票你会亏本。在相同的股票上亏损之后，想再用这只股票回本是人的本性，但是你要知道这也是你在情感上天然的弱势。如果你还是想证明你是对的，证明你是一个非常善于读懂图表的人，尽管在这一点上我承认你很有可能是对的，但你不是一个好的交易者。好的交易者会接受他们的损失，然后继续向前看，继续进行交易。","pid":"p1141"},{"t":"para","text":"在日线图上的回调很少会有经典的反转K线，相比于用5分钟K线图进行交易的交易者来说，用日线图交易的交易者面临着更多的不确定性。不确定性就意味着风险，当市场上的风险更多时，交易者应该持有更少的头寸，他们可以考虑先持有一部分头寸，当市场上出现的价格行为开始时，再逐步增多头寸。在牛市出现回调的情况下，当市场向下逐步回调时你可以逐步以更低的价格增加买入头寸，此时空头还没有证明自己已经掌握了市场。当然你也可以当市场恢复上涨以后再以更高的价格逐步增加头寸，也可以在市场出现小型的回调，且形成了一个高于你的初始入场价格的更高的低点时再增加头寸。","pid":"p1142"},{"t":"para","text":"当你在一天结束时回顾日K线图时，可以看到很多第二天可以参考的入场时机。一旦这些入场信号出现，市场通常会出现一个日内趋势，这可以提供给你许多进行5分钟的趋势交易时机。如果这只股票不是你经常进行盘中交易的股票，但是它的成交量高于500万股，那么你可以考虑暂时将这只股票放入你的交易组合中一两天。有时候，却有例外，即使是流动性非常好的股票，比如原油服务持有人股票（OIH），你的证券经纪商也可能会出现没有存量券可以让你卖空，从而使得你只能买入。但如果你非常想要卖空，你可以买一个卖出期权代替，即使只是短暂地为了进行一天的交易。","pid":"p1143"},{"t":"para","text":"由于一些价格整数关口如同磁铁一般具有吸力，所以交易者可以利用这一特点进行交易。举个例子，如果Freeport-McMoRan（FCX）在过去的几个月里上涨了20%，现在的成交价格是93元，许多交易者将会认为它可以上涨到100元。基于此，空头不会积极做空，因为他们相信他们很快就能以一个更好的价格做空，而多头会积极做多因为他们认为基于市场的惯性市场还会上涨。空头暂时的离场使得市场出现了真空效应，这导致股票以更快的速度到达这个磁铁一般的整数关口处。通常在出现回调以前，市场会超过这个数字5%或10%，市场通常会在找到未来的走向之前，在这个数字的基础上至少再回调一次。多头可以在市场反弹进入这个整数关口的区域时买入。之后在这个数字上方卖出获利，而空头则可以等到市场高于这个数字再卖空。当市场下跌时再买入获利。当然，多头有时候也会在市场下跌时再次买入进行短线交易。","pid":"p1144"},{"t":"para","text":"价格行为形成主要是因为大量的交易者因为各种原因独立决策交易行为，但是又有着相同的赚钱目的而形成的。基于此，它的指标一直是保持不变的，并且会为那些经常阅读它的人带来可靠的分析工具。","pid":"p1145"},{"t":"img","src":"assets/img/p4c2_001.webp","ctx":[{"t":"由于一些价格整数关口如同磁铁一般具有吸力，所以交易者可以利用这一特点进行交易。举个例子，如果Freeport-McMoRan（FCX）在过去的几个月里上涨了20%，现在的成交价格是93元，许多交易者将会认为它可以上涨到100元。基于此，空头不会积极做空，因为他们相信他们很快就能以一个更好的价格做空，而多头会积极做多因为他们认为基于市场的惯性市场还会上涨。空头暂时的离场使得市场出现了真空效应，这导致股票以更快的速度到达这个磁铁一般的整数关口处。通常在出现回调以前，市场会超过这个数字5%或10%，市场通常会在找到未来的走向之前，在这个数字的基础上至少再回调一次。多头可以在市场反弹进入这个整数关口的区域时买入。之后在这个数字上方卖出获利，而空头则可以等到市场高于这个数字再卖空。当市场下跌时再买入获利。当然，多头有时候也会在市场下跌时再次买入进行短线交易。","p":"p1144"},{"t":"价格行为形成主要是因为大量的交易者因为各种原因独立决策交易行为，但是又有着相同的赚钱目的而形成的。基于此，它的指标一直是保持不变的，并且会为那些经常阅读它的人带来可靠的分析工具。","p":"p1145"},{"t":"图22.1是在1932年和1933年的道琼斯工业平均指数的日图表，在任何时间图上，它都看起来像今天的某些股票的交易图。","p":"p1146"},{"t":"K线2是一个打破了趋势线的低点2。","p":"p1147"},{"t":"K线3是一个小型的最终旗形反转，也是在市场的趋势线被突破后对于K线1的一个更低的低点测试（趋势线被突破，然后出现一个测试，市场很可能会出现主要趋势的反转）。","p":"p1148"},{"t":"K线4是一个突破性回调以及一个小型的更高的低点。","p":"p1149"},{"t":"K线5是在这波强劲的牛市趋势中出现的第一波回调以及形成了一个高点2。","p":"p1150"},{"t":"K线6是在牛市旗形后出现的一个楔形通道带来了两波下跌至K线8的大的下跌潮。","p":"p1151"},{"t":"K线7是一个趋势线的突破，也是一个两浪下跌模式它是对大型的牛市旗形的突破，K线5之前的下跌浪是第一波下跌浪。","p":"p1152"},{"t":"K线8是一个更低的低点的主要趋势反转。也是一个突破回调，一个大型的模形牛市旗形，同时一个对于K线2的突破测试。","p":"p1153"},{"t":"K线10是一个更高的低点，也是相对于K线9的一个回调，K线9向上突破了K线7与K线8形成的熊市通道。一个熊市通道就是一个牛市旗形。","p":"p1154"},{"t":"在市场之前突破了K线7和K线9形成的双重顶部熊市旗形之后，K线11是一个小型的高点2的突破回调。","p":"p1155"},{"t":"K线12和13是在市场出现了微型的趋势线突破后出现的向上反转。","p":"p1156"},{"t":"K线14是一个楔形，以及一个小型的最终旗形反转。","p":"p1157"},{"t":"K线15是一个动能强劲的反趋势移动，在市场通过一波反弹测试了K线14的高点之后，这个点也很有可能会被测试。K线15与K线13形成了一个双重底部的牛市旗形，但是因为它下跌幅度如此之深，以至于市场很可能会跳到始终做空的方向。交易者将会寻找市场上一个更低的高点的做空时机，即使多头在市场上的操作使得这个时机很难出现，他们也不会在此时买入。有时候当交易者寻找一个更高的低点卖空时机时，他们也会进行买入的刮头皮短线交易，但是他们不会因为短时期的操作而改变自己长期的策略。","p":"p1158"},{"t":"K线16是一个楔形的更低的高点，而K线17是一个相对于这个模形的失败的突破。","p":"p1159"},{"t":"K线18是一个对于K线14这个牛市趋势高点的更低的高点测试，同时也是相对于这个楔形的更高的高点的回调，K线18是一个低点2的卖空入场时机。市场向下突破这个模形失败了，而随之反弹至K线18的反弹潮是从形开始的更高的高点的突破回调。其他交易者仅仅会把这个楔形看作是在K线16处结束的那个楔形更好的楔形。K线18也是一个对于K线14这根低点信号K线的突破测试。","p":"p1160"},{"t":"K线19测试了K线15的低点，同时也是一个双重底部熊市旗形。","p":"p1161"},{"t":"K线20是在反转上升浪中出现的更高的低点回调。","p":"p1162"}]},{"t":"para","text":"图22.1是在1932年和1933年的道琼斯工业平均指数的日图表，在任何时间图上，它都看起来像今天的某些股票的交易图。","pid":"p1146"},{"t":"para","text":"K线2是一个打破了趋势线的低点2。","pid":"p1147"},{"t":"para","text":"K线3是一个小型的最终旗形反转，也是在市场的趋势线被突破后对于K线1的一个更低的低点测试（趋势线被突破，然后出现一个测试，市场很可能会出现主要趋势的反转）。","pid":"p1148"},{"t":"para","text":"K线4是一个突破性回调以及一个小型的更高的低点。","pid":"p1149"},{"t":"para","text":"K线5是在这波强劲的牛市趋势中出现的第一波回调以及形成了一个高点2。","pid":"p1150"},{"t":"para","text":"K线6是在牛市旗形后出现的一个楔形通道带来了两波下跌至K线8的大的下跌潮。","pid":"p1151"},{"t":"para","text":"K线7是一个趋势线的突破，也是一个两浪下跌模式它是对大型的牛市旗形的突破，K线5之前的下跌浪是第一波下跌浪。","pid":"p1152"},{"t":"para","text":"K线8是一个更低的低点的主要趋势反转。也是一个突破回调，一个大型的模形牛市旗形，同时一个对于K线2的突破测试。","pid":"p1153"},{"t":"para","text":"K线10是一个更高的低点，也是相对于K线9的一个回调，K线9向上突破了K线7与K线8形成的熊市通道。一个熊市通道就是一个牛市旗形。","pid":"p1154"},{"t":"para","text":"在市场之前突破了K线7和K线9形成的双重顶部熊市旗形之后，K线11是一个小型的高点2的突破回调。","pid":"p1155"},{"t":"para","text":"K线12和13是在市场出现了微型的趋势线突破后出现的向上反转。","pid":"p1156"},{"t":"para","text":"K线14是一个楔形，以及一个小型的最终旗形反转。","pid":"p1157"},{"t":"para","text":"K线15是一个动能强劲的反趋势移动，在市场通过一波反弹测试了K线14的高点之后，这个点也很有可能会被测试。K线15与K线13形成了一个双重底部的牛市旗形，但是因为它下跌幅度如此之深，以至于市场很可能会跳到始终做空的方向。交易者将会寻找市场上一个更低的高点的做空时机，即使多头在市场上的操作使得这个时机很难出现，他们也不会在此时买入。有时候当交易者寻找一个更高的低点卖空时机时，他们也会进行买入的刮头皮短线交易，但是他们不会因为短时期的操作而改变自己长期的策略。","pid":"p1158"},{"t":"para","text":"K线16是一个楔形的更低的高点，而K线17是一个相对于这个模形的失败的突破。","pid":"p1159"},{"t":"para","text":"K线18是一个对于K线14这个牛市趋势高点的更低的高点测试，同时也是相对于这个楔形的更高的高点的回调，K线18是一个低点2的卖空入场时机。市场向下突破这个模形失败了，而随之反弹至K线18的反弹潮是从形开始的更高的高点的突破回调。其他交易者仅仅会把这个楔形看作是在K线16处结束的那个楔形更好的楔形。K线18也是一个对于K线14这根低点信号K线的突破测试。","pid":"p1160"},{"t":"para","text":"K线19测试了K线15的低点，同时也是一个双重底部熊市旗形。","pid":"p1161"},{"t":"para","text":"K线20是在反转上升浪中出现的更高的低点回调。","pid":"p1162"},{"t":"img","src":"assets/img/p4c2_002.webp","ctx":[{"t":"K线19测试了K线15的低点，同时也是一个双重底部熊市旗形。","p":"p1161"},{"t":"K线20是在反转上升浪中出现的更高的低点回调。","p":"p1162"},{"t":"如图22.2所示，当在日线图上出现了一个买入时机时，市场跳空至昨日的高点上方，在5分钟的K线图上，交易者将会等待市场出现回调时再买入。在日线图（缩略图）上，苹果的股票处于非常强劲的牛市趋势中，在K线1处第一次出现了相对于移动平均线的回调，同时也超越了熊市趋势线（在两张图上都是相同的序号）。在日线图上的K线2是一个非常强劲的日内向上反转，并且在它的高点附近收盘。交易者会比较想在日线图的K线2的高点上方一个价位处买入，也就是5分钟K线图的K线3的高点。然而，接下来的一天的跳空高于第二日的高点。相对于在一个可能的向下反转日冒着风险进行交易，交易者可能在5分钟的K线对跳空进行了回调测试后，更谨慎地看待市场的向上反转。","p":"p1163"},{"t":"在5分钟的K线图表上的K线6在市场的跳空点位附近收盘，同时也是一个相对于移动平均线的跳空K线，一根超越熊市趋势K线的反转向上K线。通过在K线6的下方设置保护性止损位，将带来一个非常好的做多入场时机。这62%的风险又带来了几美元的收入。","p":"p1164"}]},{"t":"para","text":"如图22.2所示，当在日线图上出现了一个买入时机时，市场跳空至昨日的高点上方，在5分钟的K线图上，交易者将会等待市场出现回调时再买入。在日线图（缩略图）上，苹果的股票处于非常强劲的牛市趋势中，在K线1处第一次出现了相对于移动平均线的回调，同时也超越了熊市趋势线（在两张图上都是相同的序号）。在日线图上的K线2是一个非常强劲的日内向上反转，并且在它的高点附近收盘。交易者会比较想在日线图的K线2的高点上方一个价位处买入，也就是5分钟K线图的K线3的高点。然而，接下来的一天的跳空高于第二日的高点。相对于在一个可能的向下反转日冒着风险进行交易，交易者可能在5分钟的K线对跳空进行了回调测试后，更谨慎地看待市场的向上反转。","pid":"p1163"},{"t":"para","text":"在5分钟的K线图表上的K线6在市场的跳空点位附近收盘，同时也是一个相对于移动平均线的跳空K线，一根超越熊市趋势K线的反转向上K线。通过在K线6的下方设置保护性止损位，将带来一个非常好的做多入场时机。这62%的风险又带来了几美元的收入。","pid":"p1164"},{"t":"img","src":"assets/img/p4c2_003.webp","ctx":[{"t":"如图22.2所示，当在日线图上出现了一个买入时机时，市场跳空至昨日的高点上方，在5分钟的K线图上，交易者将会等待市场出现回调时再买入。在日线图（缩略图）上，苹果的股票处于非常强劲的牛市趋势中，在K线1处第一次出现了相对于移动平均线的回调，同时也超越了熊市趋势线（在两张图上都是相同的序号）。在日线图上的K线2是一个非常强劲的日内向上反转，并且在它的高点附近收盘。交易者会比较想在日线图的K线2的高点上方一个价位处买入，也就是5分钟K线图的K线3的高点。然而，接下来的一天的跳空高于第二日的高点。相对于在一个可能的向下反转日冒着风险进行交易，交易者可能在5分钟的K线对跳空进行了回调测试后，更谨慎地看待市场的向上反转。","p":"p1163"},{"t":"在5分钟的K线图表上的K线6在市场的跳空点位附近收盘，同时也是一个相对于移动平均线的跳空K线，一根超越熊市趋势K线的反转向上K线。通过在K线6的下方设置保护性止损位，将带来一个非常好的做多入场时机。这62%的风险又带来了几美元的收入。","p":"p1164"},{"t":"如图22.3所示，标普500ETF的周K线看起来像是处于一个熊市反弹之中，因为从K线16至K线32的上升浪的斜率比下跌至K线16的下跌浪的斜率更平缓。当然，市场并没有超越上方震荡区间底部处K线6、8、10的低点。然而，这波反弹已经超越了K线16之前的下跌潮太多，所以之前那波下跌潮的影响已经不大了，因此市场变成了一个巨大的震荡区间。如果它是一个熊市反弹，那么它应该最终测试了K线16的低点。多头希望市场会继续走高，超越从K线3处开始的下跌潮中形成的震荡高点，并最终创造新高。空头希望市场会在K线21、2223、27和32处的扩展三角形处失败，然后向下突破三角形的底部K线27，并形成低于K线16的新低点。因为市场的反弹如此之大，所以这个图表更多地变成了一个巨大的震荡区间。也失去了趋势方向的确定性。不确定性是震荡区间的标志，一旦市场出现了不确定性，那么它通常会处于震荡区间，正如这里所示。","p":"p1165"},{"t":"市场从K线3开始下跌，并在K线5、9、11处形成更低的高点在K线6、8、10和12处形成更低的低点。因为接下来很可能会出现一个强劲的熊市突破，这波下跌潮测试震荡区间的底部或者变成一个可能的大型牛市旗形的可能性比较大。许多交易者相信K线6之前的下跌潮很可能会将市场转为始终做空的局面，对于还在怀疑的交易者来说，K线13之前的下跌潮进一步证实了市场会转为始终做空的局面。","p":"p1166"},{"t":"K线14是第二波卖空潮中的第三根K线。也是一个从最终的旗形开始的两根K线的反转尝试，但是市场又一次下跌了，并且在K线15处出现了下跌高潮。这是市场第三次出现卖空高潮，并且形成了形底部（K线13、14和16）。这个底部刚刚好超过了基于上面的震荡区间的高度的移动可测量距离。","p":"p1167"},{"t":"上升至K线17的上升浪有12个牛市主体，微型尾巴，对于大部分的交易来说，几个牛市主体就足够使得他们相信市场的趋势了。在市场经过了三波在K线16的低点处形成的下跌高潮和这波上升浪后，交易者认为市场至少会出现第二波上升浪。并且可能会在K线16的低点以及K线15的高点或K线17的高点处形成一波可以测量距离的上升浪。","p":"p1168"},{"t":"K线23只比可移动的测量目标以及趋势通道线的顶部要高出一点点，在上面震荡区间的底部区域，K线6、8、10处，它也是一个两根K线的向下反转。市场第一个目标就是向下突破通道，这个目标的实现发生在K线24处。在K线27两根K线的反转处第二波下跌浪结束了。自K线28向下突破了从K线23处形成的两浪牛市旗形后，K线29形成了一个更高的低点的突破回调。K线28也是头肩顶形态的右肩，它是一个牛市旗形的底部肩形态，而左肩是在K线24和K线25之间形成的。在K线21和K线28之间的震荡区间也是一个头肩顶形态，其中K线21是左肩，K线23是头部，K线26和K线28形成的双重顶部是右肩。在80%的顶部模式中，市场会进一步突破顶部。而空头会再一次知道大部分的顶部都不过是牛市旗形。","p":"p1169"},{"t":"从K线29至K线32的市场移动处于二个非常狭窄的牛市通道中，之后很容易会出现更高的价位。然而，因为整个图表都是处于大的震荡区间，大的反弹浪之后经常会跟随着大的下跌浪，所以市场很可能会修正到扩展的三角形底部K线27处，甚至会到达K线16这根熊市K线的低点。","p":"p1170"},{"t":"K线16是一波可以测量的下跌浪。大部分机构交易者会用他们认为有效的策略进行交易，这意味着交易成功的概率至少有60%。他们因此需要市场一段可以测量的移动距离来获得一个正收益的交易者方程（可以测量的移动距离意味着收益和风险一样大，而交易者的交易方程则开始变得有可能获利）。结果就是交易往往会达到目标，之后市场会出现反转或者至少暂停，因为许多公司会在此处收获小部分或者全部的收益。大部分的目标，就像所有的支撑区和阻力位一样，都很快会失败，因为要达到目标的最低要求是市场移动一段可测量的距离，大部分的公司都相信市场会足够强劲以至于超越这个距离。","p":"p1171"}]},{"t":"para","text":"如图22.3所示，标普500ETF的周K线看起来像是处于一个熊市反弹之中，因为从K线16至K线32的上升浪的斜率比下跌至K线16的下跌浪的斜率更平缓。当然，市场并没有超越上方震荡区间底部处K线6、8、10的低点。然而，这波反弹已经超越了K线16之前的下跌潮太多，所以之前那波下跌潮的影响已经不大了，因此市场变成了一个巨大的震荡区间。如果它是一个熊市反弹，那么它应该最终测试了K线16的低点。多头希望市场会继续走高，超越从K线3处开始的下跌潮中形成的震荡高点，并最终创造新高。空头希望市场会在K线21、2223、27和32处的扩展三角形处失败，然后向下突破三角形的底部K线27，并形成低于K线16的新低点。因为市场的反弹如此之大，所以这个图表更多地变成了一个巨大的震荡区间。也失去了趋势方向的确定性。不确定性是震荡区间的标志，一旦市场出现了不确定性，那么它通常会处于震荡区间，正如这里所示。","pid":"p1165"},{"t":"para","text":"市场从K线3开始下跌，并在K线5、9、11处形成更低的高点在K线6、8、10和12处形成更低的低点。因为接下来很可能会出现一个强劲的熊市突破，这波下跌潮测试震荡区间的底部或者变成一个可能的大型牛市旗形的可能性比较大。许多交易者相信K线6之前的下跌潮很可能会将市场转为始终做空的局面，对于还在怀疑的交易者来说，K线13之前的下跌潮进一步证实了市场会转为始终做空的局面。","pid":"p1166"},{"t":"para","text":"K线14是第二波卖空潮中的第三根K线。也是一个从最终的旗形开始的两根K线的反转尝试，但是市场又一次下跌了，并且在K线15处出现了下跌高潮。这是市场第三次出现卖空高潮，并且形成了形底部（K线13、14和16）。这个底部刚刚好超过了基于上面的震荡区间的高度的移动可测量距离。","pid":"p1167"},{"t":"para","text":"上升至K线17的上升浪有12个牛市主体，微型尾巴，对于大部分的交易来说，几个牛市主体就足够使得他们相信市场的趋势了。在市场经过了三波在K线16的低点处形成的下跌高潮和这波上升浪后，交易者认为市场至少会出现第二波上升浪。并且可能会在K线16的低点以及K线15的高点或K线17的高点处形成一波可以测量距离的上升浪。","pid":"p1168"},{"t":"para","text":"K线23只比可移动的测量目标以及趋势通道线的顶部要高出一点点，在上面震荡区间的底部区域，K线6、8、10处，它也是一个两根K线的向下反转。市场第一个目标就是向下突破通道，这个目标的实现发生在K线24处。在K线27两根K线的反转处第二波下跌浪结束了。自K线28向下突破了从K线23处形成的两浪牛市旗形后，K线29形成了一个更高的低点的突破回调。K线28也是头肩顶形态的右肩，它是一个牛市旗形的底部肩形态，而左肩是在K线24和K线25之间形成的。在K线21和K线28之间的震荡区间也是一个头肩顶形态，其中K线21是左肩，K线23是头部，K线26和K线28形成的双重顶部是右肩。在80%的顶部模式中，市场会进一步突破顶部。而空头会再一次知道大部分的顶部都不过是牛市旗形。","pid":"p1169"},{"t":"para","text":"从K线29至K线32的市场移动处于二个非常狭窄的牛市通道中，之后很容易会出现更高的价位。然而，因为整个图表都是处于大的震荡区间，大的反弹浪之后经常会跟随着大的下跌浪，所以市场很可能会修正到扩展的三角形底部K线27处，甚至会到达K线16这根熊市K线的低点。","pid":"p1170"},{"t":"para","text":"K线16是一波可以测量的下跌浪。大部分机构交易者会用他们认为有效的策略进行交易，这意味着交易成功的概率至少有60%。他们因此需要市场一段可以测量的移动距离来获得一个正收益的交易者方程（可以测量的移动距离意味着收益和风险一样大，而交易者的交易方程则开始变得有可能获利）。结果就是交易往往会达到目标，之后市场会出现反转或者至少暂停，因为许多公司会在此处收获小部分或者全部的收益。大部分的目标，就像所有的支撑区和阻力位一样，都很快会失败，因为要达到目标的最低要求是市场移动一段可测量的距离，大部分的公司都相信市场会足够强劲以至于超越这个距离。","pid":"p1171"},{"t":"img","src":"assets/img/p4c2_004.webp","ctx":[{"t":"从K线29至K线32的市场移动处于二个非常狭窄的牛市通道中，之后很容易会出现更高的价位。然而，因为整个图表都是处于大的震荡区间，大的反弹浪之后经常会跟随着大的下跌浪，所以市场很可能会修正到扩展的三角形底部K线27处，甚至会到达K线16这根熊市K线的低点。","p":"p1170"},{"t":"K线16是一波可以测量的下跌浪。大部分机构交易者会用他们认为有效的策略进行交易，这意味着交易成功的概率至少有60%。他们因此需要市场一段可以测量的移动距离来获得一个正收益的交易者方程（可以测量的移动距离意味着收益和风险一样大，而交易者的交易方程则开始变得有可能获利）。结果就是交易往往会达到目标，之后市场会出现反转或者至少暂停，因为许多公司会在此处收获小部分或者全部的收益。大部分的目标，就像所有的支撑区和阻力位一样，都很快会失败，因为要达到目标的最低要求是市场移动一段可测量的距离，大部分的公司都相信市场会足够强劲以至于超越这个距离。","p":"p1171"},{"t":"如图22.4，在K线7和K线8形成的上升浪后，黄金的月线图表处于一个楔形通道中。许多交易者会把市场最近的移动看作是第三波上升浪，而K线11和K线13是最初的两波。而有些其他的交易者会把K线8或者9看成是第一波上升浪。","p":"p1172"},{"t":"当市场上有5至10根K线靠近趋势线时，市场很快会跌落趋势线的概率就很大。这使得从K线10开始的牛市趋势线倾向于下滑。因为市场刚好高于趋势通道线和可以测量的移动目标，出现两浪的下跌潮的概率将会很大。至少，市场会修正到K线8的高点下方，也有可能会修正到楔形的底部K线10处。但是不太可能会出现的是，市场会向上突破楔形顶部，并向上升一段可以测量的距离。","p":"p1173"}]},{"t":"para","text":"如图22.4，在K线7和K线8形成的上升浪后，黄金的月线图表处于一个楔形通道中。许多交易者会把市场最近的移动看作是第三波上升浪，而K线11和K线13是最初的两波。而有些其他的交易者会把K线8或者9看成是第一波上升浪。","pid":"p1172"},{"t":"para","text":"当市场上有5至10根K线靠近趋势线时，市场很快会跌落趋势线的概率就很大。这使得从K线10开始的牛市趋势线倾向于下滑。因为市场刚好高于趋势通道线和可以测量的移动目标，出现两浪的下跌潮的概率将会很大。至少，市场会修正到K线8的高点下方，也有可能会修正到楔形的底部K线10处。但是不太可能会出现的是，市场会向上突破楔形顶部，并向上升一段可以测量的距离。","pid":"p1173"},{"t":"img","src":"assets/img/p4c2_005.webp","ctx":[{"t":"如图22.4，在K线7和K线8形成的上升浪后，黄金的月线图表处于一个楔形通道中。许多交易者会把市场最近的移动看作是第三波上升浪，而K线11和K线13是最初的两波。而有些其他的交易者会把K线8或者9看成是第一波上升浪。","p":"p1172"},{"t":"当市场上有5至10根K线靠近趋势线时，市场很快会跌落趋势线的概率就很大。这使得从K线10开始的牛市趋势线倾向于下滑。因为市场刚好高于趋势通道线和可以测量的移动目标，出现两浪的下跌潮的概率将会很大。至少，市场会修正到K线8的高点下方，也有可能会修正到楔形的底部K线10处。但是不太可能会出现的是，市场会向上突破楔形顶部，并向上升一段可以测量的距离。","p":"p1173"},{"t":"如图22.5所示，美元期货的月线图上有一些交易时机看起来是最佳交易机会。美元、瑞士法郎和日元都是避险货币，当交易者认为股市会下跌的时候他们往往会买入这些避险资产。","p":"p1174"},{"t":"当市场向上突破熊市旗形的顶部K线2时，美元有一波牛市行情，这将市场反转为始终做多的境地。之后市场形成了一个通道，之后K线5测试了从K线3开始形成的这波通道的底部。这在K线5处形成了一个双重底部牛市旗形，之后在K线7处形成了一个突破回调的买入入场时机。市场在K线11的更高的高点处到达了顶部。有一些交易者会把市场从K线3至K线11的移动看作是一个更广阔的通道，而其他的交易者则认为这个通道开始于K线5或者K线7。所有的交易者都怀疑K线11或者K线13可以成为市场向下调整到通道底部的开始。因为市场上出现了一些反转和突出的熊市主体，市场开始变得震荡了。这代表了积累的卖方压力。","p":"p1175"},{"t":"K线10之前的下跌潮是一根强劲的熊市趋势K线，它向下突破了从K线7（图中未显示）开始形成的陡峭的牛市趋势线。它是如此强劲，以至于很多多头在市场到达K线11这个新高点时开始获利。空头在更高的高点处开始卖空，并且在K线13这个更低的高点的主要趋势的反转处变得更加激进。下跌至K线12的下跌潮有两根强劲的熊市趋势K线，向下突破了牛市趋势线。市场应该至少有两波下跌浪。但是市场在下跌至K线14之后，出现了下跌至K线18的通道。K线14之前的下跌浪使得大部分的交易者相信市场已经变成始终做空的境地了，因此之后会出现更多的卖出潮。","p":"p1176"},{"t":"熊市通道继续下跌至K线18，这是大熊市趋势结束处的卖空潮中出现的第五根K线。交易者期待市场会出现反弹。至少会反弹至移动平均线。K线18同K线1也一起形成了一个双重底部。","p":"p1177"},{"t":"移动平均线上至少有20个缺口K线卖空机遇，但是因为上升的势头如此强劲，交易者最好还是等待市场出现第二个信号。第二个信号在K线19这个移动平均缺口K线处形成了，这同K线17之后的小型反弹浪的高点一起形成了双重顶部熊市旗形。","p":"p1178"},{"t":"下跌至K线20的下跌潮之后跟随着市场的抛物下跌，因此市场出现了至K线22的下跌高潮，在此处市场形成了一个更低的低点的主要趋势反转。也是在此处，市场形成了一个i模式的变体。市场从一个微型的双重底部开始反转，形成了一个失败的低点1的卖空机遇，而上升至K线23的上升潮也是预料之中的非常强劲。这可能使得市场进入了始终做多的境地，这使得多头会极力维持市场在这个趋势的底部之上。他们在低点附近积极买入，也在K线27和29处积极买入，创造了一个双重底部的牛市旗形。K线27也是一个双重底部的主要趋势反转，K线29是在三角形的第三波下推浪之后形成的向上反转潮，最终市场可能会向上或者向下突破。","p":"p1179"},{"t":"楔形牛市旗形（K线24、26、27）之后市场又出现了一波反弹之后在K线29处形成了一个双重底部。这是一个非常好的风险/盈利设置，因为交易者会在震荡区间的底部买入。因为市场处于震荡区间的底部，所以市场出现等距上涨的概率大约是60%。在市场有60%的机会测试K线28这个震荡区间的顶部时，风险大概是5美元。交易者冒着损失5美元的风险，但是有60%的机会盈利10美元，这是非常好的机会。每次交易的平均收益大概是4美元。因为这同样也是一个双重底部牛市旗形，所以盈利的概率可能会大于60%。交易者的目标是市场出现一段相当于震荡区间的向上的等距离移动，而它很可能会测试这个熊市通道的顶部K线15。","p":"p1180"},{"t":"最重要的是要意识到，市场还是有40%的机会跌落到K线22的低点下方，所以一旦这些发生时交易者需要离开。如果它这样做了，市场下一个目标就是向下进行等距离的移动，基于K线27和28或者K线22到23这两波下跌浪的高度。","p":"p1181"},{"t":"即使市场真的会上涨，它也有很大的概率无法超越K线11的高点而形成一个大型的震荡区间。","p":"p1182"}]},{"t":"para","text":"如图22.5所示，美元期货的月线图上有一些交易时机看起来是最佳交易机会。美元、瑞士法郎和日元都是避险货币，当交易者认为股市会下跌的时候他们往往会买入这些避险资产。","pid":"p1174"},{"t":"para","text":"当市场向上突破熊市旗形的顶部K线2时，美元有一波牛市行情，这将市场反转为始终做多的境地。之后市场形成了一个通道，之后K线5测试了从K线3开始形成的这波通道的底部。这在K线5处形成了一个双重底部牛市旗形，之后在K线7处形成了一个突破回调的买入入场时机。市场在K线11的更高的高点处到达了顶部。有一些交易者会把市场从K线3至K线11的移动看作是一个更广阔的通道，而其他的交易者则认为这个通道开始于K线5或者K线7。所有的交易者都怀疑K线11或者K线13可以成为市场向下调整到通道底部的开始。因为市场上出现了一些反转和突出的熊市主体，市场开始变得震荡了。这代表了积累的卖方压力。","pid":"p1175"},{"t":"para","text":"K线10之前的下跌潮是一根强劲的熊市趋势K线，它向下突破了从K线7（图中未显示）开始形成的陡峭的牛市趋势线。它是如此强劲，以至于很多多头在市场到达K线11这个新高点时开始获利。空头在更高的高点处开始卖空，并且在K线13这个更低的高点的主要趋势的反转处变得更加激进。下跌至K线12的下跌潮有两根强劲的熊市趋势K线，向下突破了牛市趋势线。市场应该至少有两波下跌浪。但是市场在下跌至K线14之后，出现了下跌至K线18的通道。K线14之前的下跌浪使得大部分的交易者相信市场已经变成始终做空的境地了，因此之后会出现更多的卖出潮。","pid":"p1176"},{"t":"para","text":"熊市通道继续下跌至K线18，这是大熊市趋势结束处的卖空潮中出现的第五根K线。交易者期待市场会出现反弹。至少会反弹至移动平均线。K线18同K线1也一起形成了一个双重底部。","pid":"p1177"},{"t":"para","text":"移动平均线上至少有20个缺口K线卖空机遇，但是因为上升的势头如此强劲，交易者最好还是等待市场出现第二个信号。第二个信号在K线19这个移动平均缺口K线处形成了，这同K线17之后的小型反弹浪的高点一起形成了双重顶部熊市旗形。","pid":"p1178"},{"t":"para","text":"下跌至K线20的下跌潮之后跟随着市场的抛物下跌，因此市场出现了至K线22的下跌高潮，在此处市场形成了一个更低的低点的主要趋势反转。也是在此处，市场形成了一个i模式的变体。市场从一个微型的双重底部开始反转，形成了一个失败的低点1的卖空机遇，而上升至K线23的上升潮也是预料之中的非常强劲。这可能使得市场进入了始终做多的境地，这使得多头会极力维持市场在这个趋势的底部之上。他们在低点附近积极买入，也在K线27和29处积极买入，创造了一个双重底部的牛市旗形。K线27也是一个双重底部的主要趋势反转，K线29是在三角形的第三波下推浪之后形成的向上反转潮，最终市场可能会向上或者向下突破。","pid":"p1179"},{"t":"para","text":"楔形牛市旗形（K线24、26、27）之后市场又出现了一波反弹之后在K线29处形成了一个双重底部。这是一个非常好的风险/盈利设置，因为交易者会在震荡区间的底部买入。因为市场处于震荡区间的底部，所以市场出现等距上涨的概率大约是60%。在市场有60%的机会测试K线28这个震荡区间的顶部时，风险大概是5美元。交易者冒着损失5美元的风险，但是有60%的机会盈利10美元，这是非常好的机会。每次交易的平均收益大概是4美元。因为这同样也是一个双重底部牛市旗形，所以盈利的概率可能会大于60%。交易者的目标是市场出现一段相当于震荡区间的向上的等距离移动，而它很可能会测试这个熊市通道的顶部K线15。","pid":"p1180"},{"t":"para","text":"最重要的是要意识到，市场还是有40%的机会跌落到K线22的低点下方，所以一旦这些发生时交易者需要离开。如果它这样做了，市场下一个目标就是向下进行等距离的移动，基于K线27和28或者K线22到23这两波下跌浪的高度。","pid":"p1181"},{"t":"para","text":"即使市场真的会上涨，它也有很大的概率无法超越K线11的高点而形成一个大型的震荡区间。","pid":"p1182"},{"t":"img","src":"assets/img/p4c2_006.webp","ctx":[{"t":"最重要的是要意识到，市场还是有40%的机会跌落到K线22的低点下方，所以一旦这些发生时交易者需要离开。如果它这样做了，市场下一个目标就是向下进行等距离的移动，基于K线27和28或者K线22到23这两波下跌浪的高度。","p":"p1181"},{"t":"即使市场真的会上涨，它也有很大的概率无法超越K线11的高点而形成一个大型的震荡区间。","p":"p1182"},{"t":"如图22.6所示，这张日线图表很明确地显示了苹果的股价，处于一个强劲的牛市趋势中，但是在一些显著的整数关口下方停留了，这也通常也是市场的磁性驱使的。一旦市场上有足够的交易者相信这些整数关口像磁铁一样会被触及时，空头将会停止做空，买入真空中市场向上反弹最终超越这个目标。举个例子，空头相信市场至少会有5%至10%的概率会超过300美元，因为通常在市场的一些整数关口的磁铁推动效应之下，市场通常是会出现这些现象的。因为空头预计市场会到达315美元附近（有5%的可能会超过这个数字），所以他们暂时不会进行交易。当他们相信市场会在接下来的K线中走得更高时，市场没有到达这个数字之前，他们进行做空没有意义。他们的离场使得市场迅速上涨，因为多头不得不将市场推得更高来找到更多的交易者做他们的对手方。","p":"p1183"},{"t":"一旦市场确实通过5%至10%的概率超越了这个目标，多头开始获利，空头会在市场的下跌回调测试中做空，至少会出现一次这样的机会。回调至K线12的低点错过了300美元一分钱（K线12的低点是300.01美元），之后市场急剧反弹至收盘。在K线13附近的双重顶部的卖空成功地将苹果的股价拉下300美元，但是买方又回来了，并形成了K线14的双重底部。","p":"p1184"}]},{"t":"para","text":"如图22.6所示，这张日线图表很明确地显示了苹果的股价，处于一个强劲的牛市趋势中，但是在一些显著的整数关口下方停留了，这也通常也是市场的磁性驱使的。一旦市场上有足够的交易者相信这些整数关口像磁铁一样会被触及时，空头将会停止做空，买入真空中市场向上反弹最终超越这个目标。举个例子，空头相信市场至少会有5%至10%的概率会超过300美元，因为通常在市场的一些整数关口的磁铁推动效应之下，市场通常是会出现这些现象的。因为空头预计市场会到达315美元附近（有5%的可能会超过这个数字），所以他们暂时不会进行交易。当他们相信市场会在接下来的K线中走得更高时，市场没有到达这个数字之前，他们进行做空没有意义。他们的离场使得市场迅速上涨，因为多头不得不将市场推得更高来找到更多的交易者做他们的对手方。","pid":"p1183"},{"t":"para","text":"一旦市场确实通过5%至10%的概率超越了这个目标，多头开始获利，空头会在市场的下跌回调测试中做空，至少会出现一次这样的机会。回调至K线12的低点错过了300美元一分钱（K线12的低点是300.01美元），之后市场急剧反弹至收盘。在K线13附近的双重顶部的卖空成功地将苹果的股价拉下300美元，但是买方又回来了，并形成了K线14的双重底部。","pid":"p1184"},{"t":"img","src":"assets/img/p4c2_007.webp","ctx":[{"t":"如图22.6所示，这张日线图表很明确地显示了苹果的股价，处于一个强劲的牛市趋势中，但是在一些显著的整数关口下方停留了，这也通常也是市场的磁性驱使的。一旦市场上有足够的交易者相信这些整数关口像磁铁一样会被触及时，空头将会停止做空，买入真空中市场向上反弹最终超越这个目标。举个例子，空头相信市场至少会有5%至10%的概率会超过300美元，因为通常在市场的一些整数关口的磁铁推动效应之下，市场通常是会出现这些现象的。因为空头预计市场会到达315美元附近（有5%的可能会超过这个数字），所以他们暂时不会进行交易。当他们相信市场会在接下来的K线中走得更高时，市场没有到达这个数字之前，他们进行做空没有意义。他们的离场使得市场迅速上涨，因为多头不得不将市场推得更高来找到更多的交易者做他们的对手方。","p":"p1183"},{"t":"一旦市场确实通过5%至10%的概率超越了这个目标，多头开始获利，空头会在市场的下跌回调测试中做空，至少会出现一次这样的机会。回调至K线12的低点错过了300美元一分钱（K线12的低点是300.01美元），之后市场急剧反弹至收盘。在K线13附近的双重顶部的卖空成功地将苹果的股价拉下300美元，但是买方又回来了，并形成了K线14的双重底部。","p":"p1184"},{"t":"如图22.7所示，在右侧的小麦的日线图有二个剧烈的反弹，但是在左边的月线图上显示的仅仅是一个熊市市场反弹。在熊市趋势中K线10形成了一个移动平均缺口K线。并且同K线7一起形成了双重顶部熊市旗形，之后市场突破测试了K线3和K线5一起形成的上方震荡区间的底部（也是一个头肩顶的顶部）。在两张图表上序号都是一样的。","p":"p1185"},{"t":"在日线图表上，在K线10这根熊市反转K线之前，一个电视专家说，小麦的价格正在走高，他正在市场回调时买入。在一个很长的牛市趋势（10至20根K线）之后，市场趋势中形成了大型牛市趋势K线，那么市场上会有很大的风险形成两浪回调，因为大部分强劲的多头只会在市场出现显著的回调时买入，而大部分强劲的空头会在市场上做空，并且在价格更高时进行刮头皮交易。电视专家对于小麦要走高的评价可能是对的，但是由于他的资本太多，所以他在抛物线和高潮的顶部买入了。不过，他应该是做了很多机构应该做的工作。空头正在卖空。而多头正在整带一个两浪的回调机会买入。","p":"p1186"},{"t":"在这一天中，K线10之前，关于小麦的消息无疑是利多的，但是这都无关紧要。图表的信息告诉交易者强劲的空头和多头正在期待市场出现大型回调。市场上出现的高潮和抛物线高潮正在告诉交易者：弱势的多头和空头正在做错误的事情，而强劲的多头和空头正在市场回调时博奔。用交易赚钱最好的方式就是赚取聪明的钱，而不是听信电视上的专家。但是聪明的钱是如此明显以至于聪明的交易者不能够隐藏他们的交易手段。然而你必须有足够的能力来阅读图表，并且明白接下来会发生什么。","p":"p1187"}]},{"t":"para","text":"如图22.7所示，在右侧的小麦的日线图有二个剧烈的反弹，但是在左边的月线图上显示的仅仅是一个熊市市场反弹。在熊市趋势中K线10形成了一个移动平均缺口K线。并且同K线7一起形成了双重顶部熊市旗形，之后市场突破测试了K线3和K线5一起形成的上方震荡区间的底部（也是一个头肩顶的顶部）。在两张图表上序号都是一样的。","pid":"p1185"},{"t":"para","text":"在日线图表上，在K线10这根熊市反转K线之前，一个电视专家说，小麦的价格正在走高，他正在市场回调时买入。在一个很长的牛市趋势（10至20根K线）之后，市场趋势中形成了大型牛市趋势K线，那么市场上会有很大的风险形成两浪回调，因为大部分强劲的多头只会在市场出现显著的回调时买入，而大部分强劲的空头会在市场上做空，并且在价格更高时进行刮头皮交易。电视专家对于小麦要走高的评价可能是对的，但是由于他的资本太多，所以他在抛物线和高潮的顶部买入了。不过，他应该是做了很多机构应该做的工作。空头正在卖空。而多头正在整带一个两浪的回调机会买入。","pid":"p1186"},{"t":"para","text":"在这一天中，K线10之前，关于小麦的消息无疑是利多的，但是这都无关紧要。图表的信息告诉交易者强劲的空头和多头正在期待市场出现大型回调。市场上出现的高潮和抛物线高潮正在告诉交易者：弱势的多头和空头正在做错误的事情，而强劲的多头和空头正在市场回调时博奔。用交易赚钱最好的方式就是赚取聪明的钱，而不是听信电视上的专家。但是聪明的钱是如此明显以至于聪明的交易者不能够隐藏他们的交易手段。然而你必须有足够的能力来阅读图表，并且明白接下来会发生什么。","pid":"p1187"},{"t":"img","src":"assets/img/p4c2_008.webp","ctx":[{"t":"在日线图表上，在K线10这根熊市反转K线之前，一个电视专家说，小麦的价格正在走高，他正在市场回调时买入。在一个很长的牛市趋势（10至20根K线）之后，市场趋势中形成了大型牛市趋势K线，那么市场上会有很大的风险形成两浪回调，因为大部分强劲的多头只会在市场出现显著的回调时买入，而大部分强劲的空头会在市场上做空，并且在价格更高时进行刮头皮交易。电视专家对于小麦要走高的评价可能是对的，但是由于他的资本太多，所以他在抛物线和高潮的顶部买入了。不过，他应该是做了很多机构应该做的工作。空头正在卖空。而多头正在整带一个两浪的回调机会买入。","p":"p1186"},{"t":"在这一天中，K线10之前，关于小麦的消息无疑是利多的，但是这都无关紧要。图表的信息告诉交易者强劲的空头和多头正在期待市场出现大型回调。市场上出现的高潮和抛物线高潮正在告诉交易者：弱势的多头和空头正在做错误的事情，而强劲的多头和空头正在市场回调时博奔。用交易赚钱最好的方式就是赚取聪明的钱，而不是听信电视上的专家。但是聪明的钱是如此明显以至于聪明的交易者不能够隐藏他们的交易手段。然而你必须有足够的能力来阅读图表，并且明白接下来会发生什么。","p":"p1187"},{"t":"如图22.8所示，Dendreon公司（DNDN）由于其前列腺癌药物的新闻发布导致其股票剧烈的波动。在过去的两个月里。它的股票在K线2的结束处上涨了800%，然后在接下来的几个月里又在这个基础上回调了90%的幅度，之后它又上涨了2000%至K线7处。在接下来的3个月里在此基础上又回调了50%。由于剧烈波动的风险，交易者只能交易较少的头寸，而头寸的减少也抵消了他们从剧烈波动中获得的收益。当大家因为这种不可预测性而感到压力时，大多数交易者都很难在这样的市场赚钱。而对他们来说，避免这种特殊的情况能赚到更多的钱。尽管这些行情看起来很过瘾，但是你的目标是赚取很多钱，而不是在市场经历了一次罕见的大移动后，仅仅获得一次情绪上的冲击，或者只用一点小仓位赚了一点钱。","p":"p1188"}]},{"t":"para","text":"如图22.8所示，Dendreon公司（DNDN）由于其前列腺癌药物的新闻发布导致其股票剧烈的波动。在过去的两个月里。它的股票在K线2的结束处上涨了800%，然后在接下来的几个月里又在这个基础上回调了90%的幅度，之后它又上涨了2000%至K线7处。在接下来的3个月里在此基础上又回调了50%。由于剧烈波动的风险，交易者只能交易较少的头寸，而头寸的减少也抵消了他们从剧烈波动中获得的收益。当大家因为这种不可预测性而感到压力时，大多数交易者都很难在这样的市场赚钱。而对他们来说，避免这种特殊的情况能赚到更多的钱。尽管这些行情看起来很过瘾，但是你的目标是赚取很多钱，而不是在市场经历了一次罕见的大移动后，仅仅获得一次情绪上的冲击，或者只用一点小仓位赚了一点钱。","pid":"p1188"}],"wcount":8734},{"id":"p4c3","title":"第23章　期权","blocks":[{"t":"para","text":"第23章　期权","pid":"p1189"},{"t":"para","text":"我曾经同一位女性交易者（她是一个小企业家）交谈过，并且为她和丈夫管理了一个股票组合。有一天。她醒来发现自己的投资组合比前一天下跌了500，000美元。从那天起，她变成了一位日内交易者，决定再也不持有交易过夜。她是一位优秀的图表阅读者，但是却再也不愿意承担可能导致巨大亏损的隔夜敬口。作为一种替代选择。对于希望持有几天到几周的交易，她会选择进行期权交易。她是一个能力很强的交易者。会继续利用投资组合中的一大部分来做期权交易，而不只是把自己限制于日内交易。我与她几年都没有联系过了，但是我确信，无论她是否是严格的日内交易者，她都会做得很好，但是如果她把期权加人她的策略中，那么可能会做得更好。","pid":"p1190"},{"t":"para","text":"因为期权的买卖价差常常很宽，所以交易者们通常应该只考虑在较高时间框架图表上做期权交易。任何使得交易者的交易方程盈利为正的操作都是合理的。下面是一些交易者应该考虑使用60分钟图或者日线图购买看涨或看跌期权的情形：","pid":"p1191"},{"t":"para","text":"多头趋势中，在向均线回调购买看涨期权。","pid":"p1192"},{"t":"para","text":"空头趋势中，在向均线反弹购买看跌期权。","pid":"p1193"},{"t":"para","text":"在交易区间的底部购买看涨期权。","pid":"p1194"},{"t":"para","text":"在交易区间的顶部购买看跌期权。","pid":"p1195"},{"t":"para","text":"在空头台阶形态中新的低点购买看涨期权","pid":"p1196"},{"t":"para","text":"在多头台阶形态中新的高点购买看跌期权。","pid":"p1197"},{"t":"para","text":"在强多头突破中的多头高潮期间购买看涨期权。","pid":"p1198"},{"t":"para","text":"在强空头突破中的空头高潮期间购买看跌期权。","pid":"p1199"},{"t":"para","text":"在交易区间底部的弱低点1或低点2购买看涨期权。","pid":"p1200"},{"t":"para","text":"在交易区间顶部的弱高点1或高点2购买看跌期权。","pid":"p1201"},{"t":"para","text":"你也可以用更小的时间图比如说5分钟的图表来交易期权：","pid":"p1202"},{"t":"para","text":"如果你是一个新手：你的账户是受限的或者你想把你的风险控制在一定范围内，那么你可以买入标普500的看涨或看跌期权。而非直接交易标普500或期货合约。对于很多大盘股和标普500的平价期权来说，在第一个月他们的买卖差价通常只有一个价位。这使得交易者们能够利用5分钟图设定交易，并且也能取得不错的成绩。","pid":"p1203"},{"t":"para","text":"在比较少见的情况下，日内价格波动非常大，你不愿意相信你当前看到的标的资产的价格或者成交情况，（比如标普500期货合约、股票、债券、货币，或者任何你正在交易的市场），这种情况下你可以在5分钟图表上使用限价订单来进行买入看涨或看跌期权的日内交易。","pid":"p1204"},{"t":"para","text":"还有很多情况值得你交易期权。也有很多非常有用的期权策略，但是前面讲到的情况是日内交易者最容易使用的，也是分散精力最少的。","pid":"p1205"},{"t":"para","text":"如果交易者有能力去做其他类型的期权交易，他们也应该尽力去做，但是对于大部分积极的日内交易者来说，很难保证在做这些交易的同时不影响他们的潜在盈利。风险反转（riskreversals）、无现金双限期权（cashlesscollars）和比率价差（ratiospreads）一般都会提供比较好的交易者方程，但是也许会花费日内交易者太多的精力。比如说，这些交易的订单相对来说非常难以设置。要设置好这些订单需要花费很大的精力。你可能要考虑很多成交价和到期日，买卖价差也常常较宽导致你会觉得有些贵，当然，你也应该使用限价订单，但是他们很多时候并不能很快地被执行。所以，你不得不对你的交易进行管理。并且随着交易的变化而不断做出调整。外汇交易者们会使用货币交易来对他们的股票组合进行套期保值，当他们认为股票将要下跌时，他们会买入风险厌恶型货币，比如瑞士法郎或美元，或者做空风险偏好型货币，比如瑞典克朗，来达到相同的套期保值效果。这可以使你避免期权费用，但是你需要非常熟悉外汇市场，而外汇市场是一个隔夜变化幅度非常大的市场所有的这些都会让日内交易者分神，所以大部分的日内交易者会选择要不然只做日内交易，要不然只是增加一点点看涨或看跌期权的买入交易。","pid":"p1206"},{"t":"para","text":"对于大部分的交易者来说。最简单的方法是大部分时候买看涨或看跌期权。偶尔买期权价差组合，并且持有这些交易一个或几个日期。有时候你也会允许市场上出现与自己的头寸相反的低点或高点，同时你还会愿意加仓。因为利用这些策略，你的风险是已知的，而且是有限的。在一个可能的重要的趋势反转顶部。你还可以简单地卖空一个小型的股票头寸，但是你可能会需要花费一天中大部分的时间去跟踪它，这将导致你错过你的日内交易，最后，那笔交易还可能得不偿失。期权都含有时间价值，并且时间价值每天随着时间的流逝而降低，这也降低了你手中的看涨或看跌期权的价值。如果你买的是跨价期权组合，那么你在买、卖两端的成交价都在受损，而这同时发生在你入场和离场时两个时间点，同时你还需要承担两倍的佣金。因为这些费用，交易者不得不把他们限制在只交易最好的期权组合上。另外，只有当他们的净收益确实增加时。他们才应该把期权加入日内交易中，所以对于大部分交易者来说期权交易是不合适的。对于所有的交易者来说，不管交易什么产品，获利都是困难的，大部分稳定盈利的交易者通常会选择专门交易一种产品，要么是期权。要么是期货或股票，而不是在三者之间分散注意力。不过，你要注意的是，期权交易者通常会把股票头寸看作是他们交易的一个基本组成，大部分期权交易者持有头寸的时间是数天到数周，而不像日内交易者那样只持有数分钟到数小时。","pid":"p1207"},{"t":"para","text":"在一种不太常见的情况下，日内期权要比期货和股票更好。那就是当市场处于剧烈的自由下跌，并且接近跌停时。如果市场上一个可靠的反转模式已经形成，你也许会认为买入标普500期货合约的风险很小，但是事实是。即使你的经纪商很有声誉。即使买入很小的头寸，风险也可能很大。为什么会这样呢？因为系统很可能会超载，你的订单可能不会被处理，或者在30分钟或更长的时间内你都不会收到反馈。假如你只是简单地在你认为的市场底部买入，之后市场跌穿了你的保护性止损位。你还是在你的电脑上看到你设置的止损订单是一个没有被执行的状态，即使市场已经远远跌破了这个价位。那么你会怎么做呢？你不知道订单是否被执行，当你打电话给经纪人查询时，你的账户被冻结了30分钟。三十分钟后，你的电脑屏幕将会显示你的订单被执行了，相比较于它之前应该被执行的位置，出现了一些滑移价差。在一个大型熊市交易日，当你的经纪商的订单系统不能争取工作时，你不能应对这种长时间的不确定性。因为经纪商对你的订单不能执行并不负责，所以你在标普500期货的交易上很可能很轻易地损失10个点位。一种替代的解决方案就是买入看涨期权，当你入场后如果市场进入了自由下跌模式，你将可以确定你的风险。你可以对你的看涨期权设置止损，尽量限制任何潜在的亏损，即便市场在没有执行你的订单的情况下大幅自由下跌，至少你知道即使止损单未被执行你的风险也不会带来大的灾难性结果（假定你的头寸规模是合理的）。为什么市场会跌穿你的保护性止损位而不触发订单呢？止损是以最后一笔交易为基础的，如果你买入的特定的期权没有发生交易，那么买价和卖价很可能会大幅跌落你的止损位但是你的止损单不会被执行，你的期权的价值可能比你想的要低很多。最重要的是，你要明白期权的保护性止损位通常不会提供任何保护，如果市场向不利于你的方向快速移动，你应该尽快使用限价订单离场。","pid":"p1208"},{"t":"para","text":"你还可以考虑日内交易标普500期权来代替交易标普500期货合约或者标普500，特别是当你才刚刚入
