参与交易。","p":"p653"},{"t":"在AAPL的交易中，通常会产生1美元的刮头皮交易机会（通常市场的移动会大于1美元，这将使得刮头皮交易者在1美元的限价指令上可以获得部分的盈利）。","p":"p654"},{"t":"在图9.15中，然而K线2只超过了K线1的入场价位93美分，且之后产生了一个低点2的卖空机遇。这个低点2意味着市场两次都没有到达设定的目标。随着市场开始剧烈震荡，并且交易者失去了1美元的刮头皮交易时机，他们很可能会将他们的盈利目标减少至50美分。那样的话，他们将可以在图中市场下降了61美分的时候收获部分利润。","p":"p655"}]},{"t":"para","text":"在图9.15中，然而K线2只超过了K线1的入场价位93美分，且之后产生了一个低点2的卖空机遇。这个低点2意味着市场两次都没有到达设定的目标。随着市场开始剧烈震荡，并且交易者失去了1美元的刮头皮交易时机，他们很可能会将他们的盈利目标减少至50美分。那样的话，他们将可以在图中市场下降了61美分的时候收获部分利润。","pid":"p655"},{"t":"img","src":"assets/img/p1c9_016.webp","ctx":[{"t":"在图9.15中，然而K线2只超过了K线1的入场价位93美分，且之后产生了一个低点2的卖空机遇。这个低点2意味着市场两次都没有到达设定的目标。随着市场开始剧烈震荡，并且交易者失去了1美元的刮头皮交易时机，他们很可能会将他们的盈利目标减少至50美分。那样的话，他们将可以在图中市场下降了61美分的时候收获部分利润。","p":"p655"},{"t":"如图9.16所示，NETApp公司（NTAP）的股票在这个日K线的图中的牛市趋势中被抛售了两次，而且交易者在这两次抛售潮中都积极买入。仅仅趋势线上出现的一次强劲的下跌潮并不意味着牛市趋势已经结束。你要知道，许多反转看起来都很强劲，但最终还是失败了。因此，有经验的交易者会在市场急剧下跌的时候积极买入，即使是在这个下跌浪的底部。K线11是一个下跌了16%的买空潮的底部，但是它同时也是二个更高的低点，并且与K线7一起形成了一个双重底部的牛市旗形。因为市场上的趋势通道持续下跌了很多根K线，所以你不必急于买入，在K线13处的更高的低点，或者市场向上突破K线14的低点2，也就是一个失败的双重顶部熊市旗形处买入是更为安全的。","p":"p656"},{"t":"K线22是一根强劲的越过移动平均线的熊市趋势K线，但是之前从K线15至K线19处的反弹也是非常强劲的。这根熊市趋势线的出现可能是基于一些可怕的新闻报道，但是一根单独的强劲的熊市趋势线还不足以反转趋势。大部分时候，它都会失败并且导致市场到达新的趋势高点。做多交易者认为出现震荡区间和新高的可能性要比出现反转的可能性要大得多，所以他们会在这根K线的底部买入。K线22的底部与K线20的底部也一起形成了一个双重底部。并且很有可能会成为这个震荡区间的底部，或者形成一个双重底部的牛市旗形。在这根熊市K线之后，并没有出现更强的推力，只出现了四根几乎重叠的震荡K线，且都有着明显的尾部。这看起来市场并不像是要出现熊市反转，所以做空交易者买回了他们的头寸，而做多交易者也在这里做多，所以这些买方力量将市场推向新高点","p":"p657"}]},{"t":"para","text":"如图9.16所示，NETApp公司（NTAP）的股票在这个日K线的图中的牛市趋势中被抛售了两次，而且交易者在这两次抛售潮中都积极买入。仅仅趋势线上出现的一次强劲的下跌潮并不意味着牛市趋势已经结束。你要知道，许多反转看起来都很强劲，但最终还是失败了。因此，有经验的交易者会在市场急剧下跌的时候积极买入，即使是在这个下跌浪的底部。K线11是一个下跌了16%的买空潮的底部，但是它同时也是二个更高的低点，并且与K线7一起形成了一个双重底部的牛市旗形。因为市场上的趋势通道持续下跌了很多根K线，所以你不必急于买入，在K线13处的更高的低点，或者市场向上突破K线14的低点2，也就是一个失败的双重顶部熊市旗形处买入是更为安全的。","pid":"p656"},{"t":"para","text":"K线22是一根强劲的越过移动平均线的熊市趋势K线，但是之前从K线15至K线19处的反弹也是非常强劲的。这根熊市趋势线的出现可能是基于一些可怕的新闻报道，但是一根单独的强劲的熊市趋势线还不足以反转趋势。大部分时候，它都会失败并且导致市场到达新的趋势高点。做多交易者认为出现震荡区间和新高的可能性要比出现反转的可能性要大得多，所以他们会在这根K线的底部买入。K线22的底部与K线20的底部也一起形成了一个双重底部。并且很有可能会成为这个震荡区间的底部，或者形成一个双重底部的牛市旗形。在这根熊市K线之后，并没有出现更强的推力，只出现了四根几乎重叠的震荡K线，且都有着明显的尾部。这看起来市场并不像是要出现熊市反转，所以做空交易者买回了他们的头寸，而做多交易者也在这里做多，所以这些买方力量将市场推向新高点","pid":"p657"},{"t":"img","src":"assets/img/p1c9_017.webp","ctx":[{"t":"如图9.16所示，NETApp公司（NTAP）的股票在这个日K线的图中的牛市趋势中被抛售了两次，而且交易者在这两次抛售潮中都积极买入。仅仅趋势线上出现的一次强劲的下跌潮并不意味着牛市趋势已经结束。你要知道，许多反转看起来都很强劲，但最终还是失败了。因此，有经验的交易者会在市场急剧下跌的时候积极买入，即使是在这个下跌浪的底部。K线11是一个下跌了16%的买空潮的底部，但是它同时也是二个更高的低点，并且与K线7一起形成了一个双重底部的牛市旗形。因为市场上的趋势通道持续下跌了很多根K线，所以你不必急于买入，在K线13处的更高的低点，或者市场向上突破K线14的低点2，也就是一个失败的双重顶部熊市旗形处买入是更为安全的。","p":"p656"},{"t":"K线22是一根强劲的越过移动平均线的熊市趋势K线，但是之前从K线15至K线19处的反弹也是非常强劲的。这根熊市趋势线的出现可能是基于一些可怕的新闻报道，但是一根单独的强劲的熊市趋势线还不足以反转趋势。大部分时候，它都会失败并且导致市场到达新的趋势高点。做多交易者认为出现震荡区间和新高的可能性要比出现反转的可能性要大得多，所以他们会在这根K线的底部买入。K线22的底部与K线20的底部也一起形成了一个双重底部。并且很有可能会成为这个震荡区间的底部，或者形成一个双重底部的牛市旗形。在这根熊市K线之后，并没有出现更强的推力，只出现了四根几乎重叠的震荡K线，且都有着明显的尾部。这看起来市场并不像是要出现熊市反转，所以做空交易者买回了他们的头寸，而做多交易者也在这里做多，所以这些买方力量将市场推向新高点","p":"p657"},{"t":"如图9.17所示，在这个60分钟的SPY交易图上，当牛市趋势非常强劲的时候，往往会有惯性，并且很难轻易结束。当过于激进的做空交易者看到一个强劲的突破移动平均线和趋势线的下跌浪时，他们会把这个看作是市场正在反转进入熊市趋势的信号。但是做多交易者则把每一次下跌浪都看作是买入入场时机。他们知道一次成功的反转所需要的因素绝对不只是一根强劲的熊市趋势线这么简单。他们相信每一次反转的尝试都会失败，因为确实大部分都失败了，随着市场逐渐走高，他们将更激进的在市场的回调时买入。当SPY的K线下跌了1%或2%时，做多交易者也会迅速买入，因为他们知道这样的时机也不会持续太久。许多探底或者触高都是由市场上暂时某一方力量的缺失所造成的。做多交易者想在市场回调时买入，所以一旦他们认为市场还会有一丁点下跌，他们也会停止买入等待机会。这使得做空交易者可以更快地加速市场下跌。一旦市场已经跌到了底部，并且做多交易者认为不可能再继续下跌了，他们就将迅速入场并且积极买入。他们的力量将绝对压过做空交易者，所以做空交易者将不得不买回他们的做空头寸，这也将加速市场的上升，所以在这波强劲的下跌浪之后再难以有支持其继续下跌的力量出现。","p":"p658"},{"t":"所以当市场这些下跌浪形成的时候你会感觉非常害怕，但是一旦你明白了其中的道理，你也会在这些下跌浪的底部积极买入。如果你不想有非常大的隔夜风险，那么你就可以在每一个下跌浪的底部买入买方期权，那么你就可以在几天之后的每一次市场新高上收获利益。","p":"p659"}]},{"t":"para","text":"如图9.17所示，在这个60分钟的SPY交易图上，当牛市趋势非常强劲的时候，往往会有惯性，并且很难轻易结束。当过于激进的做空交易者看到一个强劲的突破移动平均线和趋势线的下跌浪时，他们会把这个看作是市场正在反转进入熊市趋势的信号。但是做多交易者则把每一次下跌浪都看作是买入入场时机。他们知道一次成功的反转所需要的因素绝对不只是一根强劲的熊市趋势线这么简单。他们相信每一次反转的尝试都会失败，因为确实大部分都失败了，随着市场逐渐走高，他们将更激进的在市场的回调时买入。当SPY的K线下跌了1%或2%时，做多交易者也会迅速买入，因为他们知道这样的时机也不会持续太久。许多探底或者触高都是由市场上暂时某一方力量的缺失所造成的。做多交易者想在市场回调时买入，所以一旦他们认为市场还会有一丁点下跌，他们也会停止买入等待机会。这使得做空交易者可以更快地加速市场下跌。一旦市场已经跌到了底部，并且做多交易者认为不可能再继续下跌了，他们就将迅速入场并且积极买入。他们的力量将绝对压过做空交易者，所以做空交易者将不得不买回他们的做空头寸，这也将加速市场的上升，所以在这波强劲的下跌浪之后再难以有支持其继续下跌的力量出现。","pid":"p658"},{"t":"para","text":"所以当市场这些下跌浪形成的时候你会感觉非常害怕，但是一旦你明白了其中的道理，你也会在这些下跌浪的底部积极买入。如果你不想有非常大的隔夜风险，那么你就可以在每一个下跌浪的底部买入买方期权，那么你就可以在几天之后的每一次市场新高上收获利益。","pid":"p659"},{"t":"img","src":"assets/img/p1c9_018.webp","ctx":[{"t":"如图9.17所示，在这个60分钟的SPY交易图上，当牛市趋势非常强劲的时候，往往会有惯性，并且很难轻易结束。当过于激进的做空交易者看到一个强劲的突破移动平均线和趋势线的下跌浪时，他们会把这个看作是市场正在反转进入熊市趋势的信号。但是做多交易者则把每一次下跌浪都看作是买入入场时机。他们知道一次成功的反转所需要的因素绝对不只是一根强劲的熊市趋势线这么简单。他们相信每一次反转的尝试都会失败，因为确实大部分都失败了，随着市场逐渐走高，他们将更激进的在市场的回调时买入。当SPY的K线下跌了1%或2%时，做多交易者也会迅速买入，因为他们知道这样的时机也不会持续太久。许多探底或者触高都是由市场上暂时某一方力量的缺失所造成的。做多交易者想在市场回调时买入，所以一旦他们认为市场还会有一丁点下跌，他们也会停止买入等待机会。这使得做空交易者可以更快地加速市场下跌。一旦市场已经跌到了底部，并且做多交易者认为不可能再继续下跌了，他们就将迅速入场并且积极买入。他们的力量将绝对压过做空交易者，所以做空交易者将不得不买回他们的做空头寸，这也将加速市场的上升，所以在这波强劲的下跌浪之后再难以有支持其继续下跌的力量出现。","p":"p658"},{"t":"所以当市场这些下跌浪形成的时候你会感觉非常害怕，但是一旦你明白了其中的道理，你也会在这些下跌浪的底部积极买入。如果你不想有非常大的隔夜风险，那么你就可以在每一个下跌浪的底部买入买方期权，那么你就可以在几天之后的每一次市场新高上收获利益。","p":"p659"},{"t":"如图9.18所示，从K线15的更低的低点处开始的趋势反弹非常强劲，并且看起来会持续至少两波上升浪。然而，反弹至K线19的反弹浪并没有触及熊市趋势线。它穿过了移动平均线，并且足够接近趋势线。这给予了交易者足够的信心在K线22的高点2的入场形态处买入，因为他们认为市场的测试还将高于趋势线。","p":"p660"},{"t":"K线4是在一波强劲的下跌浪之后出现的牛市反转K线。由于这波下跌浪非常强劲、以至于交易者都相信市场上之后做空才能获利，所以交易者会继续在反弹时做空。因为他们并不认为K线4将带来显著的趋势反转，所以许多做空交易者将限价卖空指令设置在K线4或者K线4的高点之上。也有一部分交易者太过急于做空，所以他们会在K线4的高点的一个价位之下做空。市场之后的走势并没有超越K线4这根牛市信号K线的高点，这意味着做多交易者还是非常强劲的。市场在K线5的低点2下方引发了新一轮的卖空潮。在K线10的高点之后，以及K线11，13和26处都发生了相似的情形。K线18处发生的情形与之相似，不过进行的是相反的做多交易。市场上的交易者太过急于进行做多交易，所以他们会将买入限价指令设置在K线18之前的一根K线的低点处，或者低于其低点处。而最激进的做多交易者会将限价指令设置在K线18的低点上方一个价位处，看起来，他们的买入指令是唯一可以成交的。而其他的交易者不得不再次追逐市场的高点","p":"p661"},{"t":"K线27比K线21的低点高一个价位，所以没有形成一个完美的双重底部的牛市旗形。这是做多交易者激进交易的迹象，当市场从K线24的高点一路下跌时，他们会将买限价指令设置在K线21的低点上方一个或两个价位处。他们太急于进行买入交易，以至于他们不想承担任何在K线21的低点处或者低点上方一个价位处，买入指令不能完成成交的风险。当K线7比K线5的高点低一个价位时，相反的情况也同样发生了。它不能再次到达K线5的高点的原因，也是因为做空交易者太过于急切做空，所以这次的失败也是熊市趋势增强的迹象。K线7是在测试移动平均线，但是做空交易者太急于做空，以至于他们将卖出限价指令设置在移动平均线的两个价位之下，而非一贯的一个价位之下。这导致了K线7的高点无法触及移动平均线，而这同时也是熊市趋势增强的由于在K线15的底部后出现的低点1后再没有出现新的熊市低点，所以这也是牛市趋势增强的信号。","p":"p662"},{"t":"当市场上出现了一个明显的移动测量目标，同时市场由于惯性的推力已经足够接近这个目标了，但却还没有达到让交易者相信这个目标已经被完全测试的程度，那么市场通常会继续回调然后再次进行一次有信服力的验证。","p":"p663"}]},{"t":"para","text":"如图9.18所示，从K线15的更低的低点处开始的趋势反弹非常强劲，并且看起来会持续至少两波上升浪。然而，反弹至K线19的反弹浪并没有触及熊市趋势线。它穿过了移动平均线，并且足够接近趋势线。这给予了交易者足够的信心在K线22的高点2的入场形态处买入，因为他们认为市场的测试还将高于趋势线。","pid":"p660"},{"t":"para","text":"K线4是在一波强劲的下跌浪之后出现的牛市反转K线。由于这波下跌浪非常强劲、以至于交易者都相信市场上之后做空才能获利，所以交易者会继续在反弹时做空。因为他们并不认为K线4将带来显著的趋势反转，所以许多做空交易者将限价卖空指令设置在K线4或者K线4的高点之上。也有一部分交易者太过急于做空，所以他们会在K线4的高点的一个价位之下做空。市场之后的走势并没有超越K线4这根牛市信号K线的高点，这意味着做多交易者还是非常强劲的。市场在K线5的低点2下方引发了新一轮的卖空潮。在K线10的高点之后，以及K线11，13和26处都发生了相似的情形。K线18处发生的情形与之相似，不过进行的是相反的做多交易。市场上的交易者太过急于进行做多交易，所以他们会将买入限价指令设置在K线18之前的一根K线的低点处，或者低于其低点处。而最激进的做多交易者会将限价指令设置在K线18的低点上方一个价位处，看起来，他们的买入指令是唯一可以成交的。而其他的交易者不得不再次追逐市场的高点","pid":"p661"},{"t":"para","text":"K线27比K线21的低点高一个价位，所以没有形成一个完美的双重底部的牛市旗形。这是做多交易者激进交易的迹象，当市场从K线24的高点一路下跌时，他们会将买限价指令设置在K线21的低点上方一个或两个价位处。他们太急于进行买入交易，以至于他们不想承担任何在K线21的低点处或者低点上方一个价位处，买入指令不能完成成交的风险。当K线7比K线5的高点低一个价位时，相反的情况也同样发生了。它不能再次到达K线5的高点的原因，也是因为做空交易者太过于急切做空，所以这次的失败也是熊市趋势增强的迹象。K线7是在测试移动平均线，但是做空交易者太急于做空，以至于他们将卖出限价指令设置在移动平均线的两个价位之下，而非一贯的一个价位之下。这导致了K线7的高点无法触及移动平均线，而这同时也是熊市趋势增强的由于在K线15的底部后出现的低点1后再没有出现新的熊市低点，所以这也是牛市趋势增强的信号。","pid":"p662"},{"t":"para","text":"当市场上出现了一个明显的移动测量目标，同时市场由于惯性的推力已经足够接近这个目标了，但却还没有达到让交易者相信这个目标已经被完全测试的程度，那么市场通常会继续回调然后再次进行一次有信服力的验证。","pid":"p663"},{"t":"img","src":"assets/img/p1c9_019.webp","ctx":[{"t":"K线27比K线21的低点高一个价位，所以没有形成一个完美的双重底部的牛市旗形。这是做多交易者激进交易的迹象，当市场从K线24的高点一路下跌时，他们会将买限价指令设置在K线21的低点上方一个或两个价位处。他们太急于进行买入交易，以至于他们不想承担任何在K线21的低点处或者低点上方一个价位处，买入指令不能完成成交的风险。当K线7比K线5的高点低一个价位时，相反的情况也同样发生了。它不能再次到达K线5的高点的原因，也是因为做空交易者太过于急切做空，所以这次的失败也是熊市趋势增强的迹象。K线7是在测试移动平均线，但是做空交易者太急于做空，以至于他们将卖出限价指令设置在移动平均线的两个价位之下，而非一贯的一个价位之下。这导致了K线7的高点无法触及移动平均线，而这同时也是熊市趋势增强的由于在K线15的底部后出现的低点1后再没有出现新的熊市低点，所以这也是牛市趋势增强的信号。","p":"p662"},{"t":"当市场上出现了一个明显的移动测量目标，同时市场由于惯性的推力已经足够接近这个目标了，但却还没有达到让交易者相信这个目标已经被完全测试的程度，那么市场通常会继续回调然后再次进行一次有信服力的验证。","p":"p663"},{"t":"如图9.19所示，图中的交易日显示了Emini合约的交易正处于震荡区间日，而明显的可交易目标则是开盘区间的上升距离。K线7和K线9都在三个价位的范围之内，但是大部分的交易者都不会认为这个测试是有力的，除非他们是在一个价位的范围之内。所以这次测试并没有达到目标，但是它接近目标的程度已经足以让交易者相信市场的惯性正在影响价格行为。交易者想看看市场是否会在测试这个目标后回落，或者会继续上升反弹到一些新的更高的目标。市场趋势回调到了K线14这个小型的扩展三角形的牛市旗形上，并且在这一天的最后一根K线上完成了在一个价位内测试这个目标的测试。值得一提的是，如果市场的测试比可测量的移动目标高出4个以上的价位，那就意味着市场已经放弃这个目标，并且正在向更高的目标进发。","p":"p664"},{"t":"K线14是在一个大型楔形牛市旗形中出现的信号K线。在这个形中，K线8是第一波下跌浪，而K线10和K线12则是第二波。许多交易者认为这个旗形会在K线12处结束，但是K线10和K线12之间的下跌距离要远远小于K线8和K线10的下跌距离，所以许多交易者并不确信市场的修正已经结束了。这导致在K线14处出现了一个更低的低点的最终下推浪。","p":"p665"},{"t":"从K线14开始的三根K线的牛市上升浪高于之前的60分钟K线的高点（并没有在图中显示）一个价位。当市场在一个5分钟的楔形熊市旗形的两根K线后反转向下，60分钟的交易者将会怀疑他们是否陷入一个60分钟的一个价位的牛市陷阱中。许多60分钟交易者已经在之前的60分钟K线的高点之上一个价位处买入，但是市场现在开始反转向下。然而，大部分时候当60分钟的K线图上出现了一个一个价位的失败突破时，市场会在这根60分钟的K线收盘前再次超越这个一个价位的失败突破。结果就是虽然在5分钟的K线图上会出现很多一个价位的失败突破，但是在60分钟K线上，当这根K线收盘时，这些失败突破就会消失，就像图中所示。在K线15之后的那根K线处60分钟的K线正好收盘，所以这根K线最终形成的高点将比之前那根60分钟K线的高点高3个价位。","p":"p666"}]},{"t":"para","text":"如图9.19所示，图中的交易日显示了Emini合约的交易正处于震荡区间日，而明显的可交易目标则是开盘区间的上升距离。K线7和K线9都在三个价位的范围之内，但是大部分的交易者都不会认为这个测试是有力的，除非他们是在一个价位的范围之内。所以这次测试并没有达到目标，但是它接近目标的程度已经足以让交易者相信市场的惯性正在影响价格行为。交易者想看看市场是否会在测试这个目标后回落，或者会继续上升反弹到一些新的更高的目标。市场趋势回调到了K线14这个小型的扩展三角形的牛市旗形上，并且在这一天的最后一根K线上完成了在一个价位内测试这个目标的测试。值得一提的是，如果市场的测试比可测量的移动目标高出4个以上的价位，那就意味着市场已经放弃这个目标，并且正在向更高的目标进发。","pid":"p664"},{"t":"para","text":"K线14是在一个大型楔形牛市旗形中出现的信号K线。在这个形中，K线8是第一波下跌浪，而K线10和K线12则是第二波。许多交易者认为这个旗形会在K线12处结束，但是K线10和K线12之间的下跌距离要远远小于K线8和K线10的下跌距离，所以许多交易者并不确信市场的修正已经结束了。这导致在K线14处出现了一个更低的低点的最终下推浪。","pid":"p665"},{"t":"para","text":"从K线14开始的三根K线的牛市上升浪高于之前的60分钟K线的高点（并没有在图中显示）一个价位。当市场在一个5分钟的楔形熊市旗形的两根K线后反转向下，60分钟的交易者将会怀疑他们是否陷入一个60分钟的一个价位的牛市陷阱中。许多60分钟交易者已经在之前的60分钟K线的高点之上一个价位处买入，但是市场现在开始反转向下。然而，大部分时候当60分钟的K线图上出现了一个一个价位的失败突破时，市场会在这根60分钟的K线收盘前再次超越这个一个价位的失败突破。结果就是虽然在5分钟的K线图上会出现很多一个价位的失败突破，但是在60分钟K线上，当这根K线收盘时，这些失败突破就会消失，就像图中所示。在K线15之后的那根K线处60分钟的K线正好收盘，所以这根K线最终形成的高点将比之前那根60分钟K线的高点高3个价位。","pid":"p666"}],"wcount":18276},{"id":"p1c10","title":"第10章　日K线图的巨量反转","blocks":[{"t":"para","text":"第10章　日K线图的巨量反转","pid":"p667"},{"t":"para","text":"当一个日K线图中，股票市场正处于陡峭的熊市趋势，突然出现了一个有着比之前的交易量大5到10倍的K线，那意味着做多交易者正在加速入场，市场很有可能正在形成底部。有着大成交量的那一天通常会带来一个巨大的下跌缺口，如果这一天以强劲的牛市收盘，那么做多交易者盈利的机遇则会增加。市场上的交易者并不总是在寻找牛市反转，但是在经历了一波剧烈的下跌浪后，市场上出现至少两波可以超越移动平均线的上升浪的机遇增加了，而这将使得他们可以在几天。甚至几周之内进行可以盈利的做多交易。","pid":"p668"},{"t":"para","text":"顺便一提的是，在1分钟的Emini图表上。如果出现的是一个强劲的熊市趋势，同时有一根K线有着巨大的成交量（大约是25000份合约的成交量），虽然熊市趋势不可能就此结束，但是这通常是市场马上会出现回调的迹象，一般在市场的交易量开始平复（与之前的交易量有差异），出现了一到两个更低的低点之后就会出现回调了。你应该经常用来交易的图表是5分钟图表，但是因为在5分钟图表上成交量的预测作用并不可信，所以在这种日内K线图中你不应该太过于关注成交量的变化。","pid":"p669"},{"t":"para","text":"有时候市场会在成交量大的日子发生反转向上。","pid":"p670"},{"t":"img","src":"assets/img/p1c10_001.webp","ctx":[{"t":"顺便一提的是，在1分钟的Emini图表上。如果出现的是一个强劲的熊市趋势，同时有一根K线有着巨大的成交量（大约是25000份合约的成交量），虽然熊市趋势不可能就此结束，但是这通常是市场马上会出现回调的迹象，一般在市场的交易量开始平复（与之前的交易量有差异），出现了一到两个更低的低点之后就会出现回调了。你应该经常用来交易的图表是5分钟图表，但是因为在5分钟图表上成交量的预测作用并不可信，所以在这种日内K线图中你不应该太过于关注成交量的变化。","p":"p669"},{"t":"有时候市场会在成交量大的日子发生反转向上。","p":"p670"},{"t":"如图10.1所示，在雷曼兄弟（Lehman Brothers，LEH）的交易图上，出现了一根巨大的低开一K线3，之后这根K线迅速向下突破了熊市趋势通道跳空缺口K线线（从K线1至K线2处连接的线），但是在收盘处出现了较为强劲的反弹。这条K线的成交量是前一日的3倍，同时是过去一个月的平均交易量的10倍。在出现了这样一根强劲的牛市趋势K线的情况下（在蜡烛缩略图上可以更清晰地看到），在收盘处买入是相对安全的，但是一个更为谨慎的交易者会等待市场测试这根可能的信号K线的高点。市场在下一个交易日马上出现了高开跳空缺口。交易者可以在这根K线的开盘处买入，等待市场的测试性下跌，之后又在一个新的日内高点买入，或者你也可以在5分钟的K线图上寻找一次卖出潮。在市场没有成功地结束低开跳空缺口，所以出现了反转向上的情况时买入。这种情况通常会伴随着至少两波上升浪的出现（第一波上升浪发生在K线5的缺口测试了更高的低点之后，第二波上升浪是上升至K线6的上升浪），并且他们很可能会向上突破移动平均线。","p":"p671"},{"t":"K线4和K线6一起形成了一个双重顶部的熊市旗形。","p":"p672"},{"t":"K线7试图与K线5一起形成一个双重底部的牛市旗形，但是最终却在三根K线后出现了突破性的回调带来了卖空机遇。","p":"p673"},{"t":"在图表中出现的最后一根K线处，市场正在测试K线3的低点，并且试图捍卫其下方的止损位，并形成双重底部。但是事实上，并没有成功，几个月之后，雷曼兄弟就破产了。","p":"p674"},{"t":"在一个猛烈的下跌日，成交量巨大也不一定会带来反弹。","p":"p675"}]},{"t":"para","text":"如图10.1所示，在雷曼兄弟（Lehman Brothers，LEH）的交易图上，出现了一根巨大的低开一K线3，之后这根K线迅速向下突破了熊市趋势通道跳空缺口K线线（从K线1至K线2处连接的线），但是在收盘处出现了较为强劲的反弹。这条K线的成交量是前一日的3倍，同时是过去一个月的平均交易量的10倍。在出现了这样一根强劲的牛市趋势K线的情况下（在蜡烛缩略图上可以更清晰地看到），在收盘处买入是相对安全的，但是一个更为谨慎的交易者会等待市场测试这根可能的信号K线的高点。市场在下一个交易日马上出现了高开跳空缺口。交易者可以在这根K线的开盘处买入，等待市场的测试性下跌，之后又在一个新的日内高点买入，或者你也可以在5分钟的K线图上寻找一次卖出潮。在市场没有成功地结束低开跳空缺口，所以出现了反转向上的情况时买入。这种情况通常会伴随着至少两波上升浪的出现（第一波上升浪发生在K线5的缺口测试了更高的低点之后，第二波上升浪是上升至K线6的上升浪），并且他们很可能会向上突破移动平均线。","pid":"p671"},{"t":"para","text":"K线4和K线6一起形成了一个双重顶部的熊市旗形。","pid":"p672"},{"t":"para","text":"K线7试图与K线5一起形成一个双重底部的牛市旗形，但是最终却在三根K线后出现了突破性的回调带来了卖空机遇。","pid":"p673"},{"t":"para","text":"在图表中出现的最后一根K线处，市场正在测试K线3的低点，并且试图捍卫其下方的止损位，并形成双重底部。但是事实上，并没有成功，几个月之后，雷曼兄弟就破产了。","pid":"p674"},{"t":"para","text":"在一个猛烈的下跌日，成交量巨大也不一定会带来反弹。","pid":"p675"},{"t":"img","src":"assets/img/p1c10_002.webp","ctx":[{"t":"在图表中出现的最后一根K线处，市场正在测试K线3的低点，并且试图捍卫其下方的止损位，并形成双重底部。但是事实上，并没有成功，几个月之后，雷曼兄弟就破产了。","p":"p674"},{"t":"在一个猛烈的下跌日，成交量巨大也不一定会带来反弹。","p":"p675"},{"t":"如图10.2所示，贝尔斯登（BSC）在周五迎来了一个猛烈的熊市日，同时交易量是一般熊市日的15倍。这只股票在过去的两周内下跌了70%，但是，成交量却只有之前一日的1倍至1.5倍，同时它还只有一根微型的牛市尾部。市场上的价格行为并不支持做多，因为没有出现任何突破熊市趋势通道的反转。事实上。图中K线3之前那根巨大的熊市趋势K线已经完美地突破了熊市趋势通道线，这进一步确认了趋势通道线已经无法进一步加剧熊市趋势，而市场可能会出现反转。该股在周一开盘时（K线3）已经下跌了80%，但是成交量依然略有减少。交易者在周五的收盘处买入时。就认为市场已经到达底部了，他们不敢相信作为国家的第五大投资银行和经纪商的股票，还可以进一步下跌，但是市场在周一进一步摧毁了他们的想法。在没有做多价格行为的支撑下，成交量巨天无法反转强劲的熊市趋势。","p":"p676"},{"t":"这张图表与之前的雷曼兄弟的图表涵盖了相同的时间期间。但是，在雷曼兄弟的图表上，市场在周一（K线3）才突破了熊市趋势通道线，并且在当日它又以巨大的成交量反转向上。在这张贝尔斯登的图表上市场以巨大的成交量突破熊市趋势通道线的时间要早一天，但是却在最低点附近收盘，没有任何做多价格行为的支持。它也是在K线3处出现了低开跳空缺口，如同雷曼兄弟一样（对于这两只股票来说，K线3都是周一），但是雷曼兄弟的股票出现了强劲的反弹，而在贝尔斯登的股票上并没有出现。在贝尔斯登的图表上，市场在突破了熊市趋势通道线后，K线3依然也是一根牛市反转K线。但是任何在那一天在雷曼兄弟和贝尔斯登这两只股票进行选择的交易者。显然更愿意选择购买贝尔斯登的股票，因为它出现了一根强劲的牛市反转K线。即使交易者以高于K线3一个价位的价格买入贝尔斯登的股票，他们也会在未来的三天内获得超过100%的利润，看起来买贝尔斯登的股票是更加可靠的。","p":"p677"},{"t":"在这张图表发生之前的几个月，贝尔斯登被JP摩根（JPM）以非常低的市值价格收购了。","p":"p678"}]},{"t":"para","text":"如图10.2所示，贝尔斯登（BSC）在周五迎来了一个猛烈的熊市日，同时交易量是一般熊市日的15倍。这只股票在过去的两周内下跌了70%，但是，成交量却只有之前一日的1倍至1.5倍，同时它还只有一根微型的牛市尾部。市场上的价格行为并不支持做多，因为没有出现任何突破熊市趋势通道的反转。事实上。图中K线3之前那根巨大的熊市趋势K线已经完美地突破了熊市趋势通道线，这进一步确认了趋势通道线已经无法进一步加剧熊市趋势，而市场可能会出现反转。该股在周一开盘时（K线3）已经下跌了80%，但是成交量依然略有减少。交易者在周五的收盘处买入时。就认为市场已经到达底部了，他们不敢相信作为国家的第五大投资银行和经纪商的股票，还可以进一步下跌，但是市场在周一进一步摧毁了他们的想法。在没有做多价格行为的支撑下，成交量巨天无法反转强劲的熊市趋势。","pid":"p676"},{"t":"para","text":"这张图表与之前的雷曼兄弟的图表涵盖了相同的时间期间。但是，在雷曼兄弟的图表上，市场在周一（K线3）才突破了熊市趋势通道线，并且在当日它又以巨大的成交量反转向上。在这张贝尔斯登的图表上市场以巨大的成交量突破熊市趋势通道线的时间要早一天，但是却在最低点附近收盘，没有任何做多价格行为的支持。它也是在K线3处出现了低开跳空缺口，如同雷曼兄弟一样（对于这两只股票来说，K线3都是周一），但是雷曼兄弟的股票出现了强劲的反弹，而在贝尔斯登的股票上并没有出现。在贝尔斯登的图表上，市场在突破了熊市趋势通道线后，K线3依然也是一根牛市反转K线。但是任何在那一天在雷曼兄弟和贝尔斯登这两只股票进行选择的交易者。显然更愿意选择购买贝尔斯登的股票，因为它出现了一根强劲的牛市反转K线。即使交易者以高于K线3一个价位的价格买入贝尔斯登的股票，他们也会在未来的三天内获得超过100%的利润，看起来买贝尔斯登的股票是更加可靠的。","pid":"p677"},{"t":"para","text":"在这张图表发生之前的几个月，贝尔斯登被JP摩根（JPM）以非常低的市值价格收购了。","pid":"p678"}],"wcount":1905}],"wcount":160931},{"id":"p2","icon":"第二篇","title":"第二篇 日内交易","blocks":[{"t":"para","text":"第二篇　日内交易","pid":"p679"},{"t":"para","text":"如果你到目前为止还没有实现持续盈利，那么你就不应该把超短线的交易作为你打基础的练习，例如在标普500电子迷你期货合约（Emini）上获利一两个点位的交易或股票中获利10到20美分的交易等事实上。在你成为一个经验丰富的交易者之前，你都应避免这种超短线的刮头皮交易，因为你需要非常高的胜率才能盈利，而即使是经验最为丰富的交易者，在进行刮头皮交易的时候也很难保持较高的胜率。","pid":"p680"},{"t":"para","text":"在你进行日内交易时，首先需要考虑的就是选择合适的市场以及适合你交易周期的图表。最好是选择受机构投资者欢迎的股票，因为这样可以减少庄家或者做市商操纵市场的概率，而且进出的价格滑点控制在最小范围内。你每天可以在任一股票组合（5到10只股票）中找到性价比非常高的交易机会，但尽量不要去碰交易量小的股票，以避免额外的非系统风险。","pid":"p681"},{"t":"para","text":"理论上来说，在一天的交易图表中，K线周期越短的K线数量越多，你采取交易的次数就可能越多，那么每次交易的风险就会降低。然而，你很难以足够快的速度去发现图表中的这些交易机会，也没有时间在一个可以接受的试错水平下快速下单。此外，一些最好的交易时机往往稍纵即逝，你可能会错过很多好的交易时机，而把大量的精力花在了性价比不高的交易机会上。那么，到底你交易的频率该有多高，这也没有完美的答案，一切取决于你的个性和交易能力。只有足够了解你自己的性格，以及交易能力的边界，才能找到这个数学上的“甜蜜平衡点”。大部分成功的交易者都可以在5分钟的蜡烛图上交易。在3分钟的图表上，价格行为是类似的。但是却会提供更多的交易机会以及更小的止损价位，然而总体来说在3分钟图表上进行交易获得盈利的概率更低。如果你发现你错过了太多次交易，特别是一天中盈利概率最大的交易，那么你就应该考虑将你的交易移步到更高的时间图上了，比如说15分钟的图表。","pid":"p682"},{"t":"para","text":"你也可以用代表交易量的图表（比如每条K线代表25000份交易合约），或者代表价格的图表（比如，每条K线5000个价格单位的变化）或者就是普通的K线图来进行交易。当然你也可以用折线图来交易，但是需要根据交易行为来判断交易的交易者在看不到K线和蜡烛的时候会丧失很多信息。","pid":"p683"},{"t":"para","text":"通常来说，当你在日内交易时将你的每一次交易的风险降到最低，那么你就应该将你交易的合约数量放到最大。沃伦·巴菲曾说过“盈利模式的复制，可以让一分钱变成一毛钱。”一旦这种交易模式有着较好的持续盈利能力，就需要匹配合适的头寸。","pid":"p684"},{"t":"para","text":"市场上的交易者都会想尽办法去最大的可能获得最大的盈利，所以他们首先要考虑的两个重要的因素就是选择交易时机和交易的头寸规模个交易新手在市场震荡时，最好只关注2至5个入场时机，通常是在非趋势日（可能有80%的交易日都是如此）形成反转的震荡高点或者低点的第二次入场机会，或者只关注在趋势日的高潮或回调。一旦交易者已经开始持续盈利了，那么下二个目标就不再是增加低概率的入场机会，而是开始增加交易头寸了。如果一个交易者在Emini的合约交易中每天只交易25份合约，可以净盈利一个价位，也就是每天可以盈利1000美元。那如果这个交易者将交易的合约数量提升至100份，他每年可以获利1，000，000美元。如果他每天可以净盈利4个价位，那么就是每年盈利4，000,000美元。Emini市场、国债市场，或者票据市场都可以轻松容纳这样的交易量。对于价格超过100美元的流动性高的股票，有经验的交易者可以在大多数的交易日盈利50美分至1美元，并且这些股票可以容纳1000至3000份订单的交易，并且下滑甚小。像QQQ这种交易所交易基金（ETF）可以处理10000份订单，但是每日的交易幅度更小，所以对于一个交易技巧娴熟的交易者来说，交易这类基金每天的净盈利在10至20美分，或者是每年盈利几十万美元。","pid":"p685"},{"t":"para","text":"如果一个交易者管理了一个50，000，000美元的基金，每笔交易交易1000份Emini合约（他可能必须将他的订单分成200到400份合约一次），他每天净盈利一个点，这为他的客户带来了10，000，000美元的费前收益。所以，你必须先集中精力把握最好的交易时机，然后增加你的交易规模。","pid":"p686"}],"sections":[{"id":"p2c1","title":"第11章　一天中的关键时间","blocks":[{"t":"para","text":"第11章　一天中的关键时间","pid":"p687"},{"t":"para","text":"一个交易日可以被分成三个时间区域。虽然相同的价格行为原则可以适用所有时间，但是知道每个时间区域的价格行为特性对于交易者来说还是很有用的。所有的价格行为都有可能在一天中的任何一个时间发生，但如果在一天中的最初的一到两个小时进行交易，获得比风险大出两到三倍的收益的可能性是最大的。这是一天中最重要的时间，对于大部分的交易者来说，这段时间是最容易获利的（当然如果你没有足够小心的话，你也是很容易损失的）。通常来说。大部分的交易者都应该在最初的一到两个小时表现得更卖力一些，因为在这个时间的交易通常会完美地满足交易者的需求方程式，也就是结合考虑了回报、风险和获利概率的方程式。因为这个时间段非常重要，所以第三篇将详细讨论。在太平洋标准时间上午7：00时经常会出现很多报道，而这些报道通常会导致一天的趋势。计算机在分析数据和下单上有明显的速度优势，而你通常都需要面对他们的竞争。当你的竞争对手优势明显时，你可以先暂停交易。等待，直到他们的优势消失，直到速度已经不再那么重要时才开始交易。一旦市场已经开始形成了明显的方向，那么就开始顺趋势交易。即使你会错过最初的一到两根K线，但如果趋势非常强劲的话，后续还会有很多获利空间。","pid":"p688"},{"t":"para","text":"在日线图上，在牛市趋势K线的下方或者强劲的熊市趋势K线的上方通常会出现一小段影线。这通常是由开盘反转所造成的。举个例子来说，如果做多交易者认为这一天很可能会成为一个强劲的牛市趋势日，但是在这一天最初的几根K线却是呈下跌的状态，那么大部分的做多交易者将会认为这可能就是一天中的低点了，对他们而言。这是一个稍纵即逝的买入时机。如果他们是正确的，那么市场就有机会反弹，那么他们就确实在一天中的低点附近买入了。反映在日线图上，你就将在牛市趋势K线的底部发现一小段影线，这都是因为在这一天开盘的前三根K线下跌造成的。就是因为做多交易者已经做好了市场反弹的可能性较大的准备，所以他们获得了巨大的收益，却承担了微小的风险，对他们而言这次交易至少有50%的概率会成功（记住，因为市场的整体特征，他们相信那一天有很大的可能会反弹）。","pid":"p689"},{"t":"para","text":"一天的中间时段，一般会从太平洋标准时间上午8：30到9：00开始，在11：00到11：30结束，有些时候也会稍晚到12：30结束，这段时间最容易出现双边交易，比如区间震荡或者趋势通道等。这是一天中最容易出现区间震荡的时间。也是一天中最紧迫的设置止损位的时间。在一个剧烈的震荡市场，当市场稍有下跌，就会有买方入场并控制市场，所以如果市场下跌时就止损出场的话，你的这种做法正好与机构交易者在这些窄幅震荡区间的做法相反。在此时买方力量分为两部分，一部分是之前的做空交易者短线平仓获利，一部分是做多交易者希望通过短线买入获得短期的利益。在市场的顶部，相反的事情会出现，抛售情绪将占据主导。做多交易者卖出平仓获利，而做空交易者则短线开仓获取市场短期下跌的收益。当然也会有些交易者是着眼于中线波段交易的，但是通常来说，当市场处于震荡区域的时候，不管它的通道是不是狭窄的，大部分的交易量都来自短线交易，而机构交易者则会低买高卖。对于一个交易者来说最好的盈利方法就是复制机构的方法，所以如果你也在市场处于震荡区间时进行交易，你应该多采取短线交易的方法，低买高卖。经验丰富的交易者会在顶部的上涨能量较弱的高点1和高点2信号K线的上方设置限价卖出订单，而在底部的下跌能量较弱的低点1和低点2信号K线的下方设置买入限价订单。因为限价订单的价格更加难以准确评估，所以初学者应该尽量避免使用限价订单。要小心地设置止损位只有在市场下跌而你又处于震荡区间顶部时，才设置空单的买入止损，在市场上涨而你又处于震荡区域底部时，才设置多单的卖出止损。市场在震荡区间总是容易有一些铁丝网突破原来的顶部和底部的，所以作为初学者是很容易在顶部追涨并设置止损，在区域底部卖出并设置止损他们只看到市场上涨和下跌的能量，而忽略了之前例如20根K线的形成的震荡区间，很容易最后跟机构的操作方向刚好相反。上面介绍的这些震荡区间交易方法主要是针对刮头皮型的短线交易的，但是大部分的交易者并不是经常依赖刮头皮交易获利，所以在这段时间他们应该谨慎观望。由于一天中的高点或者低点大概有90%的概率会在前三分之一的时间内形成，所以这中间的三分之一的时间应该是供交易者思考最初的趋势是会延续还是反转。在这个时间段，做多交易者和做空交易者都会非常活跃，他们都在尝试控制市场，并且希望在收盘时能够控制趋势的方向。市场通常会在太平洋标准时间8：30左右反转，然后在中间时间段剩下的时间内持续趋势。交易者必须意识到，在开盘时形成的趋势可能并不会持续一整天，在最初的几个小时过后，趋势很有可能会朝完全相反的方向发展。","pid":"p690"},{"t":"para","text":"新手很容易在一天的中间的三分之一的时间里受损。他们通常在这个时间里遭受的损失要大于他们在刚开始的三分之一的时间里获得的收益，如果是在这种情况下。他们应该考虑不要在中间的三分之一的时间里进行交易，除非交易信号足够明显。许多交易者会在一天中最初的几个小时里赚到大部分的钱，然后在中间的时间段交易甚微，甚至停止交易。如果一个人同时拥有两家商店，一家可以赚很多钱，但是另外一家店无论他怎么努力都会持续亏损，亏损甚至超过了另外一家盈利的店的收人，那么他还应该继续经营两家店铺吗？答案其实已经不言而喻了。你可以把第一个交易时间段和中间的第三个交易时间段就看作是这两个商店。所以关闭那家亏损的商品并没有什么错。你的目的是为了获利而不是一整天都保持交易。当然，如果市场上的价格行为一整天都表现良好，而你又保持清醒，那么整天交易的选择也是明智的。然而，通常出现的情况并不是这样的。通常在中间的这三分之一的时间里更多的时候出现的是震荡区间，趋势通道狭窄的震荡区间，很多次的反转。不能持续的趋势K线以及很多十字星。除非交易者非常谨慎且有技巧地选择时机进行带保护性止损的操作或者通过设置合适的限价订单来赚取反向波动的钱，不然还是建议他们最好等待市场的价格行为变得更加明朗时再采取行动。总之，观望要比交易后仍然亏损明显好一些。新手为了获得足够多的交易经验，所以对于时赚时亏的情况并不在意，认为很正常。然而，不管他们怎么积累经验，窄幅震荡区间本身就是很难进行交易。有所为而有所不为，等待市场上出现明朗的方向是更明智的选择坚持这样操作的话，你接下来获得市场的支持而获利的概率将会很大。","pid":"p691"},{"t":"para","text":"一天中的这三个交易时间段通常会组成一个趋势复苏的价格形态举个例子，如果在最初的几个小时里面形成了下跌趋势，之后在太平洋时间上午11：30左右市场又经历了反弹。那么市场很可能在那之后继续下跌，恢复最初的三分之一的时间段的下跌趋势。很多时候，一天的市场价格走势就是明显的上升一下跌一上升或者下跌一上升一下跌的模式，但是更多的时候是不明显的，即使这个倾向性依然存在。基于此，许多交易者会将在中间的时间段发生的，反转了第一个时间段的趋势的市场移动，看作是一次简单的市场回调。他们会在上午11：30左右寻找最初的趋势复苏的迹象，如果确实有这样的迹象预示着复苏正在发生，他们就会顺趋势交易。即使在这个模式不太明显的交易日，他们也知道市场会在11：30附近发生一些明显的移动，随着机构交易者开始进行当日收盘前的交易，这些移动通常会持续到市场收盘时。这个价格移动可以是一次遇阻反转，也可以是一次突破。举个例子，如果在最初的两个小时里有一个强劲的卖空潮，而之后在11：30处市场开始了微弱的反弹，之后，看起来市场会在最初的卖空潮的位置遇阻反转，延续早盘的下跌趋势，然而，市场也很可能会直接突破阻力位，形成了一个趋势反转日，并且一直上涨至收盘。在上午11：30之前：交易者都没有找到市场上任何明确的方向，但是当他们市场进入了最后一个三分之一的交易时间，并且机构交易者开始收盘前的交易时，他们已经准备好随时向任一方向交易。","pid":"p692"},{"t":"para","text":"最后的三分之一的交易时间会持续到收盘时，通常在这个时间段会带来第一个时间段的趋势复苏。从而形成一个趋势复苏日，但是，有的时候。它也可能会反转趋势，从而形成趋势反转日。如果在日线图上有一个非常强劲的牛市趋势。大部分时候收盘价都是高于开盘价的。同时市场通常会在最后的30至60分钟里面反弹。而熊市趋势则有很多的交易日是收盘价低于开盘价的，且通常会在收盘处引发卖空潮在最后的30到60分钟里面很可能会出现两种表现不同的价格行为，如果交易者可以提前准备的话，每一种都会带来交易机会，如果他们不提前准备的话，每一种也都可能会带给他们麻烦。首先，在市场交易的最后半个小时内。很可能会形成强劲的趋势，这主要是因为风控经理会告诉他们的交易员必须在收盘之前平掉亏损的头寸。动能程序会检测到这个强劲的趋势，并且顺趋势交易。只要趋势的动能没有衰减。在某些时间，许多共同基金在进入收盘的时候也会进行类似的操作。想要在市场回调时入场的交易者会在此时陷人困境，因为回调并没有发生。如果你看到市场上发生了这种情况。那么你就可以在最新的K线收盘时入场随趋势交易，将你的保护性止损位设置在超越K线的另外一端。如果趋势可以持续到收盘，那么你就可以快速获利。你需要注意的是。交易员也是经常会疲惫的，而且由于他们的获利较小，所以如果他们不能以最好的状态进行交易，就最好不要进行交易。交易员可能会在一天中的任何时间感到疲劳、无聊或者分心，当他们出现这种状况的时候，就不应该进行交易了，直到他们恢复到正常的状态。而电脑并不会感到疲劳，他们可以持续交易一整天，直到收盘。当然，这也是电脑对个人交易者的另外一个明显的优势。","pid":"p693"},{"t":"para","text":"当日线图上出现的是牛市趋势时，往往出现的牛市趋势K线要比熊市趋势K线多得多。当市场上出现的是熊市趋势时，正好相反。举个例子，如果市场正处于强劲的熊市趋势，并在最后交易的一个小时里出现了一个适度的反弹，许多交易者认为市场会在低点附近收盘，那么反应在日线图上这根K线就是一根非常强劲的熊市趋势K线，并且在低点处收盘。正因为如此，有经验的交易者将会在靠近收盘时的反弹开始反转而下时迅速做空，因为他们认为这一天会在低点处收盘。其他交易者将会等待市场的下跌趋势更加明朗时才开始做空。结果就是在日线图中的熊市趋势中，当趋势强劲的时候，往往在收盘处会形成熊市趋势日。在日线图上，如果是牛市趋势，则反之亦然，牛市趋势中的K线往往会在高点处收盘，并且市场通常会在最后的一个小时的卖空潮后反弹收盘。","pid":"p694"},{"t":"para","text":"对于交易者来说，另外一种类型的收盘更为困难，因为这种收盘不是让他们很好地收回盈利，而是通过损失让他们及时止损。市场会持续趋势一直到收盘，但是会出现主体很大的K线，有很长的尾部，同时有两到三个反转，但是却还没有触发超越信号K线的原始止损位就停止了。如果你认为市场的趋势会持续到收盘处，但是市场正在形成一到两根有着很长影线的K线，如果你转变你的交易。并且在回调之前坚持你最初的止损位，在回调之后将你的止损位收紧到回调之上，那么你依然是可以赚钱的。","pid":"p695"},{"t":"para","text":"任何时候，当新闻报道出现的时候，不管是在太平洋标准时间上午7：00出现的住房报告，还是上午11：15出现的联邦公开市场委员会公告，当你进出市场时你很可能会遭遇到市场的震动，所以这个时候很可能风险巨大，但是回报甚微。当然，出现这种局面的概率只有50%。结果当然是不太好的，但是大部分的交易者还是应该安心等待市场恢复秩序以后才开始进行交易。","pid":"p696"},{"t":"img","src":"assets/img/p2c1_001.webp","ctx":[{"t":"对于交易者来说，另外一种类型的收盘更为困难，因为这种收盘不是让他们很好地收回盈利，而是通过损失让他们及时止损。市场会持续趋势一直到收盘，但是会出现主体很大的K线，有很长的尾部，同时有两到三个反转，但是却还没有触发超越信号K线的原始止损位就停止了。如果你认为市场的趋势会持续到收盘处，但是市场正在形成一到两根有着很长影线的K线，如果你转变你的交易。并且在回调之前坚持你最初的止损位，在回调之后将你的止损位收紧到回调之上，那么你依然是可以赚钱的。","p":"p695"},{"t":"任何时候，当新闻报道出现的时候，不管是在太平洋标准时间上午7：00出现的住房报告，还是上午11：15出现的联邦公开市场委员会公告，当你进出市场时你很可能会遭遇到市场的震动，所以这个时候很可能风险巨大，但是回报甚微。当然，出现这种局面的概率只有50%。结果当然是不太好的，但是大部分的交易者还是应该安心等待市场恢复秩序以后才开始进行交易。","p":"p696"},{"t":"如图11.1所示，在收盘处的反弹有一部分是由于风控经理的影响。当市场开始反弹，并且上升至K线22处时，在K线10之后开始做空的交易者将面临在收盘处出现巨大损失的可能性，而在K线16开始做空的交易者则已经受损了。交易所的风险控制人员将会密切监视在收盘处交易者持有的头寸。如果大部分做空的交易者都突然受损。他们可能会在交易的时候带入感情色彩，并且认为之后还会出现一波下跌潮。他们的奖金会取决于他们的成绩，他们也许不愿意承认他们对于这一天的熊市趋势判断失误。而风控经理的主要职责就是冷静客观地分析局面。他们会告诉交易者应该买回、卖空头寸了。如果有足够多的公司的风控经理去督促交易员买回头寸，那么市场上的上升反转趋势将不可遇止，直到收盘。而在家里进行自主交易的交易者希望市场会迎来回调，但是事实上回调并没有发生。一旦他们意识到了市场上正在发生的事情，他们就可以在市场在K线21和K线23处出现的短暂回调处买入。或者在任一条K线的收盘处买入：并且在他们的入场K线的低点下方设置保护性止损位。动能程序将检测到市场上大量的买入，从而也开始买入，只要动能足够强劲。它将不会停止买入。而共同基金和对冲基金的买入也会助推收盘时的上升浪。当市场在收盘时出现的是下跌浪时，市场上的这些交易者做得正好相反。","p":"p697"},{"t":"在日K线图上，市场正出于非常狭窄的牛市通道（在图中并没有反映）。在过去的32天里只有2天是在一天的低点处收盘的，而有21天则是高于开盘价收盘的。在日线图表的牛市波动中，大部分的交易日都会拥有牛市主体，并且交易者在收盘处的反弹浪时将会积极买入。","p":"p698"},{"t":"市场在最初的几个小时里形成了震荡区间，这个震荡区域大约占了一个平均的交易区间的一半，这警告交易者这一天很可能会进入震荡趋势日。当市场从K线7与K线2形成的双重顶部开始下跌时，交易者更加确信市场的趋势将是向下突破，所以市场上的卖方突然增加了。市场随后形成了一个较低的位置的震荡区间，但是从K线15这根高于移动平均线的缺口K线开始，又形成了一波下跌浪，之后市场又开始反弹直到超越了开盘价。你要记住，大部分的反转日在一开始的时候往往会表现的像震荡趋势日通常情况如这个例子所示，市场会在中间的三分之一的时间里形成震荡走势，之后从K线7到K线10形成的熊市趋势企图在最后的三分之一的时间里复苏。但是。市场向下突破的尝试失败了，从K线10到K线16形成的震荡区间变成了在熊市趋势中形成的最后旗形。","p":"p699"},{"t":"你可以在正确地预计到市场直到收盘的走势后依然受损，当市场在收盘前出现了很多十字星时，判断很可能会发生这种情况。","p":"p700"}]},{"t":"para","text":"如图11.1所示，在收盘处的反弹有一部分是由于风控经理的影响。当市场开始反弹，并且上升至K线22处时，在K线10之后开始做空的交易者将面临在收盘处出现巨大损失的可能性，而在K线16开始做空的交易者则已经受损了。交易所的风险控制人员将会密切监视在收盘处交易者持有的头寸。如果大部分做空的交易者都突然受损。他们可能会在交易的时候带入感情色彩，并且认为之后还会出现一波下跌潮。他们的奖金会取决于他们的成绩，他们也许不愿意承认他们对于这一天的熊市趋势判断失误。而风控经理的主要职责就是冷静客观地分析局面。他们会告诉交易者应该买回、卖空头寸了。如果有足够多的公司的风控经理去督促交易员买回头寸，那么市场上的上升反转趋势将不可遇止，直到收盘。而在家里进行自主交易的交易者希望市场会迎来回调，但是事实上回调并没有发生。一旦他们意识到了市场上正在发生的事情，他们就可以在市场在K线21和K线23处出现的短暂回调处买入。或者在任一条K线的收盘处买入：并且在他们的入场K线的低点下方设置保护性止损位。动能程序将检测到市场上大量的买入，从而也开始买入，只要动能足够强劲。它将不会停止买入。而共同基金和对冲基金的买入也会助推收盘时的上升浪。当市场在收盘时出现的是下跌浪时，市场上的这些交易者做得正好相反。","pid":"p697"},{"t":"para","text":"在日K线图上，市场正出于非常狭窄的牛市通道（在图中并没有反映）。在过去的32天里只有2天是在一天的低点处收盘的，而有21天则是高于开盘价收盘的。在日线图表的牛市波动中，大部分的交易日都会拥有牛市主体，并且交易者在收盘处的反弹浪时将会积极买入。","pid":"p698"},{"t":"para","text":"市场在最初的几个小时里形成了震荡区间，这个震荡区域大约占了一个平均的交易区间的一半，这警告交易者这一天很可能会进入震荡趋势日。当市场从K线7与K线2形成的双重顶部开始下跌时，交易者更加确信市场的趋势将是向下突破，所以市场上的卖方突然增加了。市场随后形成了一个较低的位置的震荡区间，但是从K线15这根高于移动平均线的缺口K线开始，又形成了一波下跌浪，之后市场又开始反弹直到超越了开盘价。你要记住，大部分的反转日在一开始的时候往往会表现的像震荡趋势日通常情况如这个例子所示，市场会在中间的三分之一的时间里形成震荡走势，之后从K线7到K线10形成的熊市趋势企图在最后的三分之一的时间里复苏。但是。市场向下突破的尝试失败了，从K线10到K线16形成的震荡区间变成了在熊市趋势中形成的最后旗形。","pid":"p699"},{"t":"para","text":"你可以在正确地预计到市场直到收盘的走势后依然受损，当市场在收盘前出现了很多十字星时，判断很可能会发生这种情况。","pid":"p700"},{"t":"img","src":"assets/img/p2c1_002.webp","ctx":[{"t":"市场在最初的几个小时里形成了震荡区间，这个震荡区域大约占了一个平均的交易区间的一半，这警告交易者这一天很可能会进入震荡趋势日。当市场从K线7与K线2形成的双重顶部开始下跌时，交易者更加确信市场的趋势将是向下突破，所以市场上的卖方突然增加了。市场随后形成了一个较低的位置的震荡区间，但是从K线15这根高于移动平均线的缺口K线开始，又形成了一波下跌浪，之后市场又开始反弹直到超越了开盘价。你要记住，大部分的反转日在一开始的时候往往会表现的像震荡趋势日通常情况如这个例子所示，市场会在中间的三分之一的时间里形成震荡走势，之后从K线7到K线10形成的熊市趋势企图在最后的三分之一的时间里复苏。但是。市场向下突破的尝试失败了，从K线10到K线16形成的震荡区间变成了在熊市趋势中形成的最后旗形。","p":"p699"},{"t":"你可以在正确地预计到市场直到收盘的走势后依然受损，当市场在收盘前出现了很多十字星时，判断很可能会发生这种情况。","p":"p700"},{"t":"如图11.2所示，在K线19之前出现的两根强劲的牛市趋势K线看起来会出现后续跟进的力量，但是任何做多的保护性止损位都应该设置在这波上升浪的下方，或者至少在第二根大牛市趋势K线的下方。一旦市场在K线20附近开始形成十字星，那么市场上出现剧烈回调的风险将会增大。如果你是在K线16的上方买入的，那么你可以在K线20的下方设置一个狭窄的止损位，或者二个盈亏平衡止损位。然而，如果你是在K线19这根大牛市K线的收盘处或者在K线21这根十字星K线的上方买入的。你可能需要冒险将你的止损位设置在K线19和之前的K线中较低的低点下方，或者至少要低于K线19。市场上K线的尾部是对你的警告，警告你市场很可能会进入震荡区间。如果你想在这种类型的市场中进行交易，那么你就必须适应这样的震荡，同时允许市场的双向移动，并使用更为宽泛的止损位，事实上，在这种市场在一天中的最后时间进入狭窄的震荡区间的情况下，只有经验非常丰富的交易者才应该考虑继续交易。","p":"p701"},{"t":"这是一个趋势复苏日，在开始的三分之一的时间段里是一波反弹浪并在K线5处结束。之后在中间的三分之一的时间里形成的是震荡区间，最后在收盘处形成了牛市趋势的复苏。最后一波反弹开始于太平洋标准时间上午11：15，但直到下午12：30才出现了上升的趋势突破。","p":"p702"},{"t":"市场通常会在最初的一个小时左右形成趋势，之后在中间时段开始的时候反转，这个时间是在太平洋标准时间上午8：00和9：30之间（通常会在8：30左右）。有时候市场也会先进入几个小时的震荡区间，然后会在最后的一至两个小时内突破方向，形成趋势。这种突破可能会导致趋势复苏目或者是趋势反转日。","p":"p703"}]},{"t":"para","text":"如图11.2所示，在K线19之前出现的两根强劲的牛市趋势K线看起来会出现后续跟进的力量，但是任何做多的保护性止损位都应该设置在这波上升浪的下方，或者至少在第二根大牛市趋势K线的下方。一旦市场在K线20附近开始形成十字星，那么市场上出现剧烈回调的风险将会增大。如果你是在K线16的上方买入的，那么你可以在K线20的下方设置一个狭窄的止损位，或者二个盈亏平衡止损位。然而，如果你是在K线19这根大牛市K线的收盘处或者在K线21这根十字星K线的上方买入的。你可能需要冒险将你的止损位设置在K线19和之前的K线中较低的低点下方，或者至少要低于K线19。市场上K线的尾部是对你的警告，警告你市场很可能会进入震荡区间。如果你想在这种类型的市场中进行交易，那么你就必须适应这样的震荡，同时允许市场的双向移动，并使用更为宽泛的止损位，事实上，在这种市场在一天中的最后时间进入狭窄的震荡区间的情况下，只有经验非常丰富的交易者才应该考虑继续交易。","pid":"p701"},{"t":"para","text":"这是一个趋势复苏日，在开始的三分之一的时间段里是一波反弹浪并在K线5处结束。之后在中间的三分之一的时间里形成的是震荡区间，最后在收盘处形成了牛市趋势的复苏。最后一波反弹开始于太平洋标准时间上午11：15，但直到下午12：30才出现了上升的趋势突破。","pid":"p702"},{"t":"para","text":"市场通常会在最初的一个小时左右形成趋势，之后在中间时段开始的时候反转，这个时间是在太平洋标准时间上午8：00和9：30之间（通常会在8：30左右）。有时候市场也会先进入几个小时的震荡区间，然后会在最后的一至两个小时内突破方向，形成趋势。这种突破可能会导致趋势复苏目或者是趋势反转日。","pid":"p703"},{"t":"img","src":"assets/img/p2c1_003.webp","ctx":[{"t":"这是一个趋势复苏日，在开始的三分之一的时间段里是一波反弹浪并在K线5处结束。之后在中间的三分之一的时间里形成的是震荡区间，最后在收盘处形成了牛市趋势的复苏。最后一波反弹开始于太平洋标准时间上午11：15，但直到下午12：30才出现了上升的趋势突破。","p":"p702"},{"t":"市场通常会在最初的一个小时左右形成趋势，之后在中间时段开始的时候反转，这个时间是在太平洋标准时间上午8：00和9：30之间（通常会在8：30左右）。有时候市场也会先进入几个小时的震荡区间，然后会在最后的一至两个小时内突破方向，形成趋势。这种突破可能会导致趋势复苏目或者是趋势反转日。","p":"p703"},{"t":"如图11.3所示，从K线8至K线12的反弹是如此强劲，以至于早期的做空交易者根本无法进入最后的三分之一的交易时间段。之后，在经历了K线17这波微弱的企图反转市场的下跌浪后，从K线8至K线12的趋势又一次复苏了。从K线18处开始的牛市复苏趋势，并没有持续，而是之后马上回调到了K线12与K线15中形成的突破移动平均线的楔形牛市旗形的位置。做多交易者无法再进一步促成反弹，所以市场进一步下跌至开盘价，并在日线图上形成了一个十字星日。","p":"p704"},{"t":"K线3是对于移动平均线的一次测试，并且与K线1一起形成了个双重顶部，因此很有可能会是一天中的高点。交易者正在寻找突破开盘区域的底部的时机，以及可以测量的移动下跌距离。相反，市场在下跌至K线4之后，又进一步经历了两波下推浪，并带来了一波熊市趋势和通道，这个通道正好是一个楔形。交易者认为在中间的三分之一的交易时间段开始时很可能会出现反转，所以这很有可能是一天中的低点在经历了两根K线的反转之后，市场在K线8处出现了买入信号。在出现了K线9这根外包上升K线后，一部分交易者认为市场已经进入了可以一直做多的局面，但是大部分的交易者直到K线10这根牛市趋势K线结束的时候才相信市场进入了做多的局面。","p":"p705"}]},{"t":"para","text":"如图11.3所示，从K线8至K线12的反弹是如此强劲，以至于早期的做空交易者根本无法进入最后的三分之一的交易时间段。之后，在经历了K线17这波微弱的企图反转市场的下跌浪后，从K线8至K线12的趋势又一次复苏了。从K线18处开始的牛市复苏趋势，并没有持续，而是之后马上回调到了K线12与K线15中形成的突破移动平均线的楔形牛市旗形的位置。做多交易者无法再进一步促成反弹，所以市场进一步下跌至开盘价，并在日线图上形成了一个十字星日。","pid":"p704"},{"t":"para","text":"K线3是对于移动平均线的一次测试，并且与K线1一起形成了个双重顶部，因此很有可能会是一天中的高点。交易者正在寻找突破开盘区域的底部的时机，以及可以测量的移动下跌距离。相反，市场在下跌至K线4之后，又进一步经历了两波下推浪，并带来了一波熊市趋势和通道，这个通道正好是一个楔形。交易者认为在中间的三分之一的交易时间段开始时很可能会出现反转，所以这很有可能是一天中的低点在经历了两根K线的反转之后，市场在K线8处出现了买入信号。在出现了K线9这根外包上升K线后，一部分交易者认为市场已经进入了可以一直做多的局面，但是大部分的交易者直到K线10这根牛市趋势K线结束的时候才相信市场进入了做多的局面。","pid":"p705"}],"wcount":6883},{"id":"p2c2","title":"第12章　市场","blocks":[{"t":"para","text":"第12章　市场","pid":"p706"},{"t":"para","text":"在所有的市场里面，价格行为技术分析都是有效的，但是大部分的交易者更愿意选择在5分钟的K线图表上交易机会最多、容量足够处理大型持仓而不会担心滑点的市场。标准普尔（S&P）期货合约的5分钟K线图就是这样的市场，你可以选择任何你想要的仓位大小，而不必担心会超过容量限制。当然，罗素期货合约在一些个人交易者中间也是非常流行的，因为他们认为它在日内拥有良好的趋势，而且保证金占用相对较小。只不过，大部分成功的交易者最终想要交易的合约量比罗素期货合约能容纳的量要大，且容易引起滑点。","pid":"p707"},{"t":"para","text":"当你刚开始进行交易的时候，你应该首先考虑交易的是标准普尔500指数市场（SPY），而不是标准普尔迷你电子期货市场（Emini）。如果标准普尔期货合约价格是1100，那么标准普尔500指数合约价格大概是110，在标准普尔期货市场中一个两个点的8个最小价位的刮头皮交易的时机大约相当于在标准普尔500指数市场中一个20美分的刮头皮交易时机（一个标准普尔期货市场的最小价位是标准普尔500指数市场的最小价位的2.5倍）。所以交易一份标准普尔期货市场合约大约相当于交易500份标准普尔500指数市场合约。如果你交易300至500份标准普尔500指数市场合约时。你可以增加你波段交易的头寸，而不至招致太大的风险。对于标准普尔500指数市场合约来说，一个优势就是20美分的刮头皮交易的头寸非常小，而且又来得非常迅速，所以对于交易者来说更容易进行波段交易而非刮头皮交易，而这对于交易新手来说是更好的交易方式。你也可以注意到标准普尔500指数市场通常很容易触发一个价位的入场时机或者止损离场时机，而标准普尔期货市场却并没有。正因为这样，在标准普尔500指数市场中，许多交易者会使用2个价位或者3个价位的止损方式。","pid":"p708"},{"t":"para","text":"一你在标准普尔500指数市场将你的头寸增加至1000至1500份合约，并且还想继续增加你的头寸，那么你应该转向标准普尔期货市场，因为它可以接受更多的头寸而不会产生太大的滑点。当刚开始进行交易的时候，你可以进行100份标准普尔500指数市场刮头皮交易时，设置一个20美分的盈利目标，同时设置一个20美分的保护性止损位：在标准普尔期货市场合约交易中，这相当于一个两个点的止损位，所以你的风险就是20美元加上佣金。然而，除非你的佣金非常小，比如100股只需要1美元的佣金，不然你真的很难在标准普尔500指数市场进行刮头皮交易并且获利。同时，你需要一个下单的系统以保证你下订单的速度足够快。否则，在你应该一直进行波段交易，直到你可以连续盈利以后，才增加刮头皮交易的时机。","pid":"p709"},{"t":"para","text":"货币期货、外汇、国债，以及票据期货都可以同时处理大量的持仓，但是相较于标准普尔期货市场市场来说，在大部分的交易日，他们的入场时机更少。债券和票据在日内通常会有长期趋势，所以你准备交易时，可以先入场，然后等待市场震荡几个小时。在标准普尔期货市场的交易时间，外汇市场通常并不会带来很多交易时机，并且由于你并不想分心，所以当你积极地交易标准普尔期货市场合约时，最好不要交易外汇。DIA和道指期货的持仓都不大。所以对于刮头皮交易者来说滑点可能是一个烫手的问题。正如标准普尔500指数市场可以替代标准普尔期货市场交易一样，纳斯达克100ETF（QQQ）市场也可以成为纳斯达克期货市场的替代市场。在日内交易者中，纳斯达克100ETF市场也非常流行，并且也可以容纳较大的订单。","pid":"p710"},{"t":"para","text":"许多股票在日内交易机会上表现得非常好。对于平均波动幅度在几美元之间，以及平均交易量大于或等于5百万股的股票来说，交易机会是最容易捕捉的。你希望得到一次50美分至1美元的刮头皮交易时机，并且滑点很小，同时你希望市场震动的幅度可以至少有几美元。目前符合这些要求的股票有苹果（AAPL），国际商业机器（IBM），谷歌（GOOG），亚马逊（AMZM），高盛（GS），石油服务持股信托（OIH），超短波石油和天然气ETF（DUG），超金融股份ETF（UYG），和黄金信托（GLD）等，当然还有其他更好的股票，你可以按照你自己的需求进行删减和增加。","pid":"p711"}],"wcount":1670},{"id":"p2c3","title":"第13章　时间周期和图表类型","blocks":[{"t":"para","text":"第13章　时间周期和图表类型","pid":"p712"},{"t":"para","text":"对于短线刮头皮交易者来说，在交易标普500电子迷你期货合约（Emini）时，最简单的方法就是使用5分钟的蜡烛图。然而，对于跨日的中线波段交易者来说，5分钟的条形图则是更好的选择。这是因为，在笔记本电脑或者单独的显示器上的屏幕上，刚好可以显示6个完整的条形图，每一个图表都代表一个不同的股票，并且每一个图表都包含了一天所有的K线。如果你使用的是蜡烛图，因为它比条形要宽，所以你的图表上只能呈现半天的价格行为。提及这一点的重要原因是想提醒交易者，用简单的条形图表就可以做好交易，特别是当你想在震荡区间中寻找最好的波段交易入场价位时。对于想在Emini合约中通过刮头皮交易获利的交易者来说。使用蜡烛图表是更有利的，因为使用蜡烛图表可以更快地看到哪一方力量控制了K线，特别是有利于发现入场信号K线。同时，在条形图表上并不太容易发现更多的高点2和低点2的变体形态。","pid":"p713"},{"t":"para","text":"在所有的市场和时间图表中，价格行为的交易技术都是有用的，所以交易者必须做出最基本的判断。也就是他们将会在哪个市场，使用哪种时间图表进行交易。对于大部分的交易者来说。他们的目标都是在长期交易中使得利润最大化，所以每一个交易者都需要找到适合他自己个性特征的交易方法。","pid":"p714"},{"t":"para","text":"如果5分钟的Emini合约K线图平均每天会提供十几次比较合适的入场机会，3分钟的图表平均每天会提供20个，而1分钟的图表会提供30个，在5分钟的图表上，风险（保护性止损位的大小）一般是8个价位，在3分钟的图表上是6个价位，在1分钟的图表上是4个价位，所以为什么不在更短的时间图表上进行交易？那样就可以交易得更多，却风险更小，同时赚取更多的钱，不是吗？没错，是这样的，但是这建立在你能够正确快速地阅读图表，并且能够准确地入场，止损，确定目标订单的准确价位，并且每天连续7个小时，一年又一年的重复交易。对于大部分交易者来说，时间越短，他们可能错过的交易就越好，同时他们赚钱的概率就会降低。他们在5分钟图表上可以很好地快进快出，但这个方法在1分钟和3分钟的图表上反应不够快，很难盈利，那么这个时候，他们就应该专注于5分钟图表的交易机会，并且他们应该持续地增加他们的头寸。最好的交易往往是出乎意料的，并且入场时机的信号经常令人怀疑。大部分的交易者都不能快速处理信息。所以。他们总是无法抓住最好的入场时机，但这对于他们的底线来说是非常重要的一环。最好的交易时机通常稍纵即逝，所以他们很容易错过。而剩下一些性价比不高的交易机会甚至包括可能带来损失的交易时机。","pid":"p715"},{"t":"para","text":"在较长周期的价格图上，市场的平均移动幅度要大于较短周期的价格图。然而，较短周期价格图表的价格启动更早一些，较长周期的价格图上的一个波段，开始于例如1分钟和3分钟之类的图表上的反转。很难知道哪一个图表会更有效，但为了一次较大的机会博取，一天需要进行30次或者更多次的交易，让人精疲力竭。在1分钟和3分钟的图表上出现的最好的交易可以带来5分钟和15分钟的图表上的强劲的通道，对于大部分的交易者来说，他们会更加关注手于最好的5分钟交易，并且继续增加他们的头寸。一旦这笔交易成功了，他们将很大概率赚取出乎意料多的金钱，而且有比较高的胜率，这将导致他们承担更少的压力。并且在接下来的时间里延续较好的状态，维持佳绩。","pid":"p716"},{"t":"para","text":"另外，随着你的头寸的增加，在某些时间，这些成交量将会影响到市场在1分钟的图表上的很多交易。举一个极端的例子，如果你有一个在市价之上两个最小变动价位卖出5000份标普500期货合约的限价指令的止盈单，那么任何一个观察盘口价差交易者都会看到这个差异，所以你将很难在一天内进行10至15个交易或者代价巨大。同时，如果止盈单的单量如此巨大。可能会导致一两个价位的滑点，这将破坏刮头皮交易的风险报酬比。一个交易者可以利用市场的价格行为特征每次交易5000份合约，但是这个单量并不适用于大部分市场的刮头皮交易技术的出入场。如果有一天你因为你的交易量影响了成交。需要重新思考交易方法时，这也是一件值得恭喜的事情。","pid":"p717"},{"t":"para","text":"在两种情况下，一分钟的图表是非常有用的。第一种情况是，比如说现在5分钟的图表上市场正处于二个疯狂的趋势中，你没有持仓但想进入这个市场，但又担心市场回调不敢随意追随趋势时，你可以在1分钟的图表中寻找一个高点或低点2的回调来进入这个趋势。第二种情况是，对于有经验的交易者来说，当5分钟的图表上出现的股票趋势是震荡的情况时，利用1分钟的图表来进行交易将会更有利。当股价形成趋势时，市场通常非常尊重平均移动线所处的位置，一般在这里形成阻力位或支撑位，并且他们希望通过在移动平均线上找到高点1，2或者低点1，2形态的入场机遇来进行顺趋势交易，止损幅度为一根K线的高度。在1分钟的交易图表上，交易者可以通过在触及移动平均线的第一次市场反转处入场来降低这个风险，在5分钟的图表上，交易者可以通过在市场越过移动平均线的第一次反转处入场来降低风险。如果你在1分钟的图表上。画出5分钟图表中的20根K线组成的移动平均线，你将可以快速地看到市场触及移动平均线的位置，并且准确地下单。但是实际上，你需要在1分钟的K线图上画出90根K线组成的移动平均线，作为5分图表上的20根K线组成的移动平均线的替代。为什么在1分钟的图表上，你需要画出的是90根K线而非100根K线的移动平均线呢？因为在1分钟的图表上，移动平均值是在每一个1分钟的K线的收盘时重新计算，而非在第5根K线的收盘处重新计算，因为在计算加权平均值时融人了更多的新的K线，所以如果使用100根K线的加权平均线的话将会更加平滑。此外。在1分钟的K线图上，每五根K线的前四根K线的收盘价其实并没有体现在5分钟K线图的移动平均线上。为了纠正这些误差，我们在1分钟的K线图上使用的是90根K线的移动平均线（我一般使用的是指数移动平均线，但其实任何移动平均线都是可以的），因为它更贴近5分钟K线图上的20根K线移动平均线。在实际操作中，在专注于标普500期货合约的交易时。你很少有时间查看1分钟的股票图表。然而，当股票的趋势增强时，你很可能会快速通过1分钟的股票图表入场。","pid":"p718"},{"t":"para","text":"在以上的讨论中，其实我们隐约已经发现，在不同的时间图表中，我们可能会发现不同方向的趋势。例如，市场已经连续上涨了几周了。但是在过去的两天里，市场的趋势其实是一个熊市趋势通道，但是在过去的15分钟里，市场的趋势是一个下降至5分钟的移动平均线处的回调。那么在5分钟的图表上，它可能出现的是一个熊市趋势，在1分钟的图表上又是一个牛市趋势，而在60分钟的图表上，这两日的下降趋势很可能形成的是一个牛市旗形。还有其他的可能，比如说在同一时间，你在日线图上是看跌的，但是在月线图上是看涨的。如果你同时看所有的时间图将会产生混乱，而且等待所有的时间图表都向同一个方向发展实在是浪费时间，不仅这种现象很少发生，而且就算是它发生了，也不能保证你的交易就是盈利的。所以你只要选择一种时间图表就好了，并且使用这张图表进行交易。如果你能够做到准确阅读并且执行交易，你根本就不需要再浪费时间看其他的图表。","pid":"p719"},{"t":"para","text":"许多交易者会使用这样一种图表，这种图表中的K线是基于成交量画出来的，而不是基于时间。比如说，我们可以构建一个这种标普500期货合约的图表，这个图表上的K线只要成交次数达到5000或者更多时就收盘，或者只要交易量达到25000份合约就收盘。只要你可以适应需要阅读这种图表的速度并且按时下单，你可以使用任何你喜欢的类型的图表。因为任何图表上的形态都是基于人类的行为，所以都是一样的。在图表上基于时间的趋势线要比基于成交量的更精确些，但是很多交易者并不在乎趋势线是否精确，反而他们喜欢使用近似的趋势线。","pid":"p720"},{"t":"para","text":"我有一些朋友会使用基于斐波纳契数字的成交次数图表，还有一些朋友使用的是基于特定间隔时间的时间图表，比如说8分钟或者13分钟。每一种图表都会在某些时间非常有效，但是其实最有效的方式是你选定一种图表，并且坚定地使用它。不管它是成交次数图表，成交量图表或者是时间图表都没有关系，甚至在每条K线中包含了多少成交次数，多少交易量，或者多少时间，都不重要。因为在所有类型的图表上都会有明显的价格型号。真正重要的是，一个交易者是否有能力正确实时地阅读图表并且进行正确的交易。你也可以试试每一根K线包含的成交次数，成交量或者时间都是非常随机的图表，你会发现这种图表其实也很不错，并且可以提供很多可信的价格信号。我个人非常喜欢使用5分钟的图表，因为趋势线和趋势通道线都非常精确。每一天也会出现很多的入场时机，同时我也可以看到K线什么时候会收盘，这可以让我预测接下来的交易。如果是成交次数或者成交量的图表。很可能会在几秒钟的时间内产生过多的交易使得这根K线出乎意料的收盘，我将会在这一天结束时打印的图表上发现其实我错过了很多交易信号。同样在这些图表上的趋势线也会不太准确。经常使用成交次数图表或者成交量图表的交易者有时候也会使用小一些的时间图表。他们这样做的目的是为了减少他们的止损头寸，希望通过降低风险获得更多盈利。但是他们通常会忽略这样做获胜的概率也会降低，从而他们最终还是会亏损。","pid":"p721"},{"t":"img","src":"assets/img/p2c3_001.webp","ctx":[{"t":"许多交易者会使用这样一种图表，这种图表中的K线是基于成交量画出来的，而不是基于时间。比如说，我们可以构建一个这种标普500期货合约的图表，这个图表上的K线只要成交次数达到5000或者更多时就收盘，或者只要交易量达到25000份合约就收盘。只要你可以适应需要阅读这种图表的速度并且按时下单，你可以使用任何你喜欢的类型的图表。因为任何图表上的形态都是基于人类的行为，所以都是一样的。在图表上基于时间的趋势线要比基于成交量的更精确些，但是很多交易者并不在乎趋势线是否精确，反而他们喜欢使用近似的趋势线。","p":"p720"},{"t":"我有一些朋友会使用基于斐波纳契数字的成交次数图表，还有一些朋友使用的是基于特定间隔时间的时间图表，比如说8分钟或者13分钟。每一种图表都会在某些时间非常有效，但是其实最有效的方式是你选定一种图表，并且坚定地使用它。不管它是成交次数图表，成交量图表或者是时间图表都没有关系，甚至在每条K线中包含了多少成交次数，多少交易量，或者多少时间，都不重要。因为在所有类型的图表上都会有明显的价格型号。真正重要的是，一个交易者是否有能力正确实时地阅读图表并且进行正确的交易。你也可以试试每一根K线包含的成交次数，成交量或者时间都是非常随机的图表，你会发现这种图表其实也很不错，并且可以提供很多可信的价格信号。我个人非常喜欢使用5分钟的图表，因为趋势线和趋势通道线都非常精确。每一天也会出现很多的入场时机，同时我也可以看到K线什么时候会收盘，这可以让我预测接下来的交易。如果是成交次数或者成交量的图表。很可能会在几秒钟的时间内产生过多的交易使得这根K线出乎意料的收盘，我将会在这一天结束时打印的图表上发现其实我错过了很多交易信号。同样在这些图表上的趋势线也会不太准确。经常使用成交次数图表或者成交量图表的交易者有时候也会使用小一些的时间图表。他们这样做的目的是为了减少他们的止损头寸，希望通过降低风险获得更多盈利。但是他们通常会忽略这样做获胜的概率也会降低，从而他们最终还是会亏损。","p":"p721"},{"t":"如图13.1所示，在波段交易中仅仅只需要使用简单的K线图就可以知道价格行为了。当市场上形成了趋势的时候，你可以尝试在市场回调的时候进入趋势，比如说在牛市趋势的高点2或者熊市趋势的低点2处入场。此外，在一根强劲的趋势线被突破之后，你可以在市场测试的时候进入反趋势交易，比如说市场出现了强劲的反转K线后，你可以在一个可能出现的新的牛市趋势中的更高的低点或者更低的低点入场。","p":"p722"}]},{"t":"para","text":"如图13.1所示，在波段交易中仅仅只需要使用简单的K线图就可以知道价格行为了。当市场上形成了趋势的时候，你可以尝试在市场回调的时候进入趋势，比如说在牛市趋势的高点2或者熊市趋势的低点2处入场。此外，在一根强劲的趋势线被突破之后，你可以在市场测试的时候进入反趋势交易，比如说市场出现了强劲的反转K线后，你可以在一个可能出现的新的牛市趋势中的更高的低点或者更低的低点入场。","pid":"p722"},{"t":"img","src":"assets/img/p2c3_002.webp","ctx":[{"t":"如图13.1所示，在波段交易中仅仅只需要使用简单的K线图就可以知道价格行为了。当市场上形成了趋势的时候，你可以尝试在市场回调的时候进入趋势，比如说在牛市趋势的高点2或者熊市趋势的低点2处入场。此外，在一根强劲的趋势线被突破之后，你可以在市场测试的时候进入反趋势交易，比如说市场出现了强劲的反转K线后，你可以在一个可能出现的新的牛市趋势中的更高的低点或者更低的低点入场。","p":"p722"},{"t":"如果你在5分钟的图表上没有发现回调，但是你又很想做多，你不妨试试在1分钟的图表上寻找机会（看图13.2）。在图中5分钟的标普500期货合约的缩略图中我们可以看到市场自开盘以后上升了11.75个点位，中间并没有回调。如果交易者在开盘的时候没有做多，那么他们将错过整个区域，因为中间没有回调。然而，如果他们转而去看1分钟的图表，他们将会发现中间其实有3个高点1的入场时机（K线A，B和C）。在1分钟的图表上，激进的做多交易者将会把限价指令设置在之前一根K线的低点处，期望市场上的每次反转尝试都会迅速失败。一旦他们成功地做多了，他们就会继续在5分钟的图表上交易，并且不再看1分钟的图表，他们会突然意识到其实在1分钟图表上出现的反转是可以做空的。你看1分钟的图表只有一个原因一一当5分钟的图表上没有出现回调，你想寻找高点1和2的做多入场时机。在1分钟的图表上进行反趋势交易将会使你受损。实际上，在1分钟图表上出现的3个买入时机的价位也正好是用1分钟图表进行卖空交易的价位，一旦卖空交易者也利用这个价位，他们将会变成额外的买方，并且推动市场向上发展。","p":"p723"}]},{"t":"para","text":"如果你在5分钟的图表上没有发现回调，但是你又很想做多，你不妨试试在1分钟的图表上寻找机会（看图13.2）。在图中5分钟的标普500期货合约的缩略图中我们可以看到市场自开盘以后上升了11.75个点位，中间并没有回调。如果交易者在开盘的时候没有做多，那么他们将错过整个区域，因为中间没有回调。然而，如果他们转而去看1分钟的图表，他们将会发现中间其实有3个高点1的入场时机（K线A，B和C）。在1分钟的图表上，激进的做多交易者将会把限价指令设置在之前一根K线的低点处，期望市场上的每次反转尝试都会迅速失败。一旦他们成功地做多了，他们就会继续在5分钟的图表上交易，并且不再看1分钟的图表，他们会突然意识到其实在1分钟图表上出现的反转是可以做空的。你看1分钟的图表只有一个原因一一当5分钟的图表上没有出现回调，你想寻找高点1和2的做多入场时机。在1分钟的图表上进行反趋势交易将会使你受损。实际上，在1分钟图表上出现的3个买入时机的价位也正好是用1分钟图表进行卖空交易的价位，一旦卖空交易者也利用这个价位，他们将会变成额外的买方，并且推动市场向上发展。","pid":"p723"},{"t":"img","src":"assets/img/p2c3_003.webp","ctx":[{"t":"如果你在5分钟的图表上没有发现回调，但是你又很想做多，你不妨试试在1分钟的图表上寻找机会（看图13.2）。在图中5分钟的标普500期货合约的缩略图中我们可以看到市场自开盘以后上升了11.75个点位，中间并没有回调。如果交易者在开盘的时候没有做多，那么他们将错过整个区域，因为中间没有回调。然而，如果他们转而去看1分钟的图表，他们将会发现中间其实有3个高点1的入场时机（K线A，B和C）。在1分钟的图表上，激进的做多交易者将会把限价指令设置在之前一根K线的低点处，期望市场上的每次反转尝试都会迅速失败。一旦他们成功地做多了，他们就会继续在5分钟的图表上交易，并且不再看1分钟的图表，他们会突然意识到其实在1分钟图表上出现的反转是可以做空的。你看1分钟的图表只有一个原因一一当5分钟的图表上没有出现回调，你想寻找高点1和2的做多入场时机。在1分钟的图表上进行反趋势交易将会使你受损。实际上，在1分钟图表上出现的3个买入时机的价位也正好是用1分钟图表进行卖空交易的价位，一旦卖空交易者也利用这个价位，他们将会变成额外的买方，并且推动市场向上发展。","p":"p723"},{"t":"如图13.3所示，在1分钟的AAPL的K线图上，今天是一个强劲的熊市趋势日，在90根K线组成的指数移动平均线上出现了3个时机好、风险低（风险低是指这根K线的主体较小）的卖空时会（相当于5分钟的图上的20根K线的指数移动平均线）。在5分钟的缩略图中，我们看到了强劲的熊市趋势和熊市通道。大部分的交易者应该只选择一张图表，并且尽量不去看1分钟的图表。在1分钟的图表上，你可能抓住很多微小的市场移动机遇入场，但是却会错失在5分钟的图表上出现的更天的入场时机，最终获利甚微。经验不足、刚开始学习交易的人很容易过度交易，同时又过早地退出市场，从而白白错失了赚钱的机遇，以损失收场，即使他们在市场下跌的时候正确地采用了做空这个方法。","p":"p724"}]},{"t":"para","text":"如图13.3所示，在1分钟的AAPL的K线图上，今天是一个强劲的熊市趋势日，在90根K线组成的指数移动平均线上出现了3个时机好、风险低（风险低是指这根K线的主体较小）的卖空时会（相当于5分钟的图上的20根K线的指数移动平均线）。在5分钟的缩略图中，我们看到了强劲的熊市趋势和熊市通道。大部分的交易者应该只选择一张图表，并且尽量不去看1分钟的图表。在1分钟的图表上，你可能抓住很多微小的市场移动机遇入场，但是却会错失在5分钟的图表上出现的更天的入场时机，最终获利甚微。经验不足、刚开始学习交易的人很容易过度交易，同时又过早地退出市场，从而白白错失了赚钱的机遇，以损失收场，即使他们在市场下跌的时候正确地采用了做空这个方法。","pid":"p724"},{"t":"img","src":"assets/img/p2c3_004.webp","ctx":[{"t":"如图13.3所示，在1分钟的AAPL的K线图上，今天是一个强劲的熊市趋势日，在90根K线组成的指数移动平均线上出现了3个时机好、风险低（风险低是指这根K线的主体较小）的卖空时会（相当于5分钟的图上的20根K线的指数移动平均线）。在5分钟的缩略图中，我们看到了强劲的熊市趋势和熊市通道。大部分的交易者应该只选择一张图表，并且尽量不去看1分钟的图表。在1分钟的图表上，你可能抓住很多微小的市场移动机遇入场，但是却会错失在5分钟的图表上出现的更天的入场时机，最终获利甚微。经验不足、刚开始学习交易的人很容易过度交易，同时又过早地退出市场，从而白白错失了赚钱的机遇，以损失收场，即使他们在市场下跌的时候正确地采用了做空这个方法。","p":"p724"},{"t":"在图13.4中的3个图表反映的是同一日的标普500期货合约交易。最上方的是一个5分钟的K线图，在中间的图表中，每条K线包含了1500次成交数（每条K线都有1500次交易），在最下方的图表中每条K线包含了20000份合约（只要交易的合约数量等于或者大于20000份，K线就会收盘）。他们都有相似的价格行为，并且都是可以交易的，但是一般来说在最早的一个小时中成交量往往是最大的，所以在成交次数和成交量的K线图标中移动平均线是更加倾斜的。这是因为在一天中开始和结束的一个小时中出现的K线更多。","p":"p725"}]},{"t":"para","text":"在图13.4中的3个图表反映的是同一日的标普500期货合约交易。最上方的是一个5分钟的K线图，在中间的图表中，每条K线包含了1500次成交数（每条K线都有1500次交易），在最下方的图表中每条K线包含了20000份合约（只要交易的合约数量等于或者大于20000份，K线就会收盘）。他们都有相似的价格行为，并且都是可以交易的，但是一般来说在最早的一个小时中成交量往往是最大的，所以在成交次数和成交量的K线图标中移动平均线是更加倾斜的。这是因为在一天中开始和结束的一个小时中出现的K线更多。","pid":"p725"},{"t":"img","src":"assets/img/p2c3_005.webp","ctx":[{"t":"在图13.4中的3个图表反映的是同一日的标普500期货合约交易。最上方的是一个5分钟的K线图，在中间的图表中，每条K线包含了1500次成交数（每条K线都有1500次交易），在最下方的图表中每条K线包含了20000份合约（只要交易的合约数量等于或者大于20000份，K线就会收盘）。他们都有相似的价格行为，并且都是可以交易的，但是一般来说在最早的一个小时中成交量往往是最大的，所以在成交次数和成交量的K线图标中移动平均线是更加倾斜的。这是因为在一天中开始和结束的一个小时中出现的K线更多。","p":"p725"},{"t":"在图13.5中，左边的图表显示的是一个每根K线都有按照斐波纳契数列排列的4181次成交量，而右边的图表则是一个8分钟的K线图表。两个图表都有非常可信的入场时机。年","p":"p726"},{"t":"每一种类型的图表都在某些时间点给予交易者很好的入场信号，所以如果你只选择一种图表进行交易的话将会发现更容易交易。不论你选择的是时间图表、成交量图表，还是成交次数图表，也不论这些图表的每一根K线中包含的是多少时间，多少成交量，多少成交次数，这些都不会影响你进行交易。你的选择可以非常任意。但是真正重要的是你要有能力阅读图表，发现正确的交易时机，并且正确地做出交易。所有图表反映的都是基于我们人类基因所产生的行为，所以你使用哪种方式去理解并不重要因为所有的图表都显示的是相同的行为。","p":"p727"},{"t":"报告往往可以带来市场的情绪化移动，从而产生大K线，外包线，和一些反转。在新闻报道出现的几秒钟至几分钟的时间内。采用量化交易的机构交易者在分析行情和下单的速度上往往独具优势。当你的竞争对手的优势已经如此明显的时候，就不要再同他们竞争了。你可以等待他们的优势渐渐消失，并且速度已经不再重要时再进行交易，通常这样的时机会出现在1至3根K线之后。虽然市场的情绪会影响到所有的交易者，并带来剧烈的市场移动和大K线，但是基于价格行为产生的入场时机还是非常可靠的。总的来说，你需要根据盈亏平衡止损位的设置经常移动一些你的头寸，因为有的时候市场的震荡要比你想象的更加剧烈。","p":"p728"}]},{"t":"para","text":"在图13.5中，左边的图表显示的是一个每根K线都有按照斐波纳契数列排列的4181次成交量，而右边的图表则是一个8分钟的K线图表。两个图表都有非常可信的入场时机。年","pid":"p726"},{"t":"para","text":"每一种类型的图表都在某些时间点给予交易者很好的入场信号，所以如果你只选择一种图表进行交易的话将会发现更容易交易。不论你选择的是时间图表、成交量图表，还是成交次数图表，也不论这些图表的每一根K线中包含的是多少时间，多少成交量，多少成交次数，这些都不会影响你进行交易。你的选择可以非常任意。但是真正重要的是你要有能力阅读图表，发现正确的交易时机，并且正确地做出交易。所有图表反映的都是基于我们人类基因所产生的行为，所以你使用哪种方式去理解并不重要因为所有的图表都显示的是相同的行为。","pid":"p727"},{"t":"para","text":"报告往往可以带来市场的情绪化移动，从而产生大K线，外包线，和一些反转。在新闻报道出现的几秒钟至几分钟的时间内。采用量化交易的机构交易者在分析行情和下单的速度上往往独具优势。当你的竞争对手的优势已经如此明显的时候，就不要再同他们竞争了。你可以等待他们的优势渐渐消失，并且速度已经不再重要时再进行交易，通常这样的时机会出现在1至3根K线之后。虽然市场的情绪会影响到所有的交易者，并带来剧烈的市场移动和大K线，但是基于价格行为产生的入场时机还是非常可靠的。总的来说，你需要根据盈亏平衡止损位的设置经常移动一些你的头寸，因为有的时候市场的震荡要比你想象的更加剧烈。","pid":"p728"},{"t":"img","src":"assets/img/p2c3_006.webp","ctx":[{"t":"每一种类型的图表都在某些时间点给予交易者很好的入场信号，所以如果你只选择一种图表进行交易的话将会发现更容易交易。不论你选择的是时间图表、成交量图表，还是成交次数图表，也不论这些图表的每一根K线中包含的是多少时间，多少成交量，多少成交次数，这些都不会影响你进行交易。你的选择可以非常任意。但是真正重要的是你要有能力阅读图表，发现正确的交易时机，并且正确地做出交易。所有图表反映的都是基于我们人类基因所产生的行为，所以你使用哪种方式去理解并不重要因为所有的图表都显示的是相同的行为。","p":"p727"},{"t":"报告往往可以带来市场的情绪化移动，从而产生大K线，外包线，和一些反转。在新闻报道出现的几秒钟至几分钟的时间内。采用量化交易的机构交易者在分析行情和下单的速度上往往独具优势。当你的竞争对手的优势已经如此明显的时候，就不要再同他们竞争了。你可以等待他们的优势渐渐消失，并且速度已经不再重要时再进行交易，通常这样的时机会出现在1至3根K线之后。虽然市场的情绪会影响到所有的交易者，并带来剧烈的市场移动和大K线，但是基于价格行为产生的入场时机还是非常可靠的。总的来说，你需要根据盈亏平衡止损位的设置经常移动一些你的头寸，因为有的时候市场的震荡要比你想象的更加剧烈。","p":"p728"},{"t":"如图13.6所示，联邦公开市场委员会（FOMC）的报告是在太平洋时间上午11点15发布的（有时候会晚几分钟），：这通常会导致情绪化交易，比如出现大K线，外包线以及在接下来的30分钟里面出现几次反转。但是，知道这些基本规则的交易者将会表现良好。K线2是一根大的牛市反转K线，但是当市场上出现了很多重叠的K线时，市场上可能正在形成震荡区间，所以你不应该在这个区间的顶部买入。相反，你应该寻找被困住的交易者。小型的K线以及第二次入场通道。","p":"p729"},{"t":"K线3是一个非常好的做空的刮头皮交易时机：因为过于激进的做多交易者因为急于寻找做多的入场时机错过了这根大反转K线，从而被困住。","p":"p730"},{"t":"K线4是市场第二次尝试反转突破开盘低点的下跌。第二次入场通道通常都是值得尝试的，并且当你体验到市场的情绪时出现了一根牛市趋势内含线是很好的。因为这很可能会带来至少两波上升浪，所以你需要转移你部分的头寸。一开始的止损位是设置在信号K线的中部，之后的止损位是设置在K线4这根入场K线收盘价的下方。之后，你可以将止损位设置在之前的K线的低点下方。最终将止损位移到你的盈亏平衡点上。","p":"p731"},{"t":"在受情绪干扰的市场上，通常市场趋势会比你预期的走得更远，同时会让你获得比进行许多次刮头皮交易的盈利更大的利润。在这里，这个牛市趋势持续了大概30个点位，或者说每份合约值1500美元。","p":"p732"}]},{"t":"para","text":"如图13.6所示，联邦公开市场委员会（FOMC）的报告是在太平洋时间上午11点15发布的（有时候会晚几分钟），：这通常会导致情绪化交易，比如出现大K线，外包线以及在接下来的30分钟里面出现几次反转。但是，知道这些基本规则的交易者将会表现良好。K线2是一根大的牛市反转K线，但是当市场上出现了很多重叠的K线时，市场上可能正在形成震荡区间，所以你不应该在这个区间的顶部买入。相反，你应该寻找被困住的交易者。小型的K线以及第二次入场通道。","pid":"p729"},{"t":"para","text":"K线3是一个非常好的做空的刮头皮交易时机：因为过于激进的做多交易者因为急于寻找做多的入场时机错过了这根大反转K线，从而被困住。","pid":"p730"},{"t":"para","text":"K线4是市场第二次尝试反转突破开盘低点的下跌。第二次入场通道通常都是值得尝试的，并且当你体验到市场的情绪时出现了一根牛市趋势内含线是很好的。因为这很可能会带来至少两波上升浪，所以你需要转移你部分的头寸。一开始的止损位是设置在信号K线的中部，之后的止损位是设置在K线4这根入场K线收盘价的下方。之后，你可以将止损位设置在之前的K线的低点下方。最终将止损位移到你的盈亏平衡点上。","pid":"p731"},{"t":"para","text":"在受情绪干扰的市场上，通常市场趋势会比你预期的走得更远，同时会让你获得比进行许多次刮头皮交易的盈利更大的利润。在这里，这个牛市趋势持续了大概30个点位，或者说每份合约值1500美元。","pid":"p732"},{"t":"img","src":"assets/img/p2c3_007.webp","ctx":[{"t":"K线4是市场第二次尝试反转突破开盘低点的下跌。第二次入场通道通常都是值得尝试的，并且当你体验到市场的情绪时出现了一根牛市趋势内含线是很好的。因为这很可能会带来至少两波上升浪，所以你需要转移你部分的头寸。一开始的止损位是设置在信号K线的中部，之后的止损位是设置在K线4这根入场K线收盘价的下方。之后，你可以将止损位设置在之前的K线的低点下方。最终将止损位移到你的盈亏平衡点上。","p":"p731"},{"t":"在受情绪干扰的市场上，通常市场趋势会比你预期的走得更远，同时会让你获得比进行许多次刮头皮交易的盈利更大的利润。在这里，这个牛市趋势持续了大概30个点位，或者说每份合约值1500美元。","p":"p732"},{"t":"如图13.7所示。在这张标普500合约的1分钟图表上，出现了很多可以盈利的刮头皮交易时机，可以读懂这些价格行为的交易者可以迅速采取行动。但是在现实中却很难做到。对于很多交易者来说，正确的下单压力太多，所以最终他们往往会以损失收场。","p":"p733"},{"t":"K线1是一个对于出形态的失败向上突破，同时也是一个在缺口向上的日子里形成的更低的高点。","p":"p734"},{"t":"K线2在移动平均线上产生了一个高点2，一个楔形的牛市旗形，和一个趋势通道线的反转。","p":"p735"},{"t":"在一个缺口向上的日子里，K线3是一个没有创造新高点的一个失败的突破，同时也是一个卖空时机可以带来市场对于缺口的测试（市场通常会尽力测试缺口，所以交易者应该寻找这个方向的交易时机）。","p":"p736"},{"t":"K线5是在移动平均线上的低点3。低点3是一种形态的楔形或者三角形。同时也是三重顶部的熊市旗形。","p":"p737"},{"t":"K线6是一个失败的微型趋势线突破，同时也是一个从K线5熊市旗形的突破处开始的突破回调。","p":"p738"},{"t":"K线7反转了两条熊市趋势通道线，但是它并不是一个可靠的做多时机，这使得交易者相信做空交易者现在很强势。因为通道非常陡峭，所以这是一个模形反转而非一个模形牛市旗形，所以你最好在趋势通道线被突破后出现的更高的低点处买入，或者在市场向上超越移动平均线时买入。","p":"p739"},{"t":"K线8是一个失败的趋势线的突破，一个双重顶部的回调，一个低点2的卖出入场时机，以及是自K线7以来出现的5个价位的买入失败。因为有这么多的因素影响你做空，所以市场下跌得如此迅速也不足为奇。","p":"p740"},{"t":"K线9是市场自越过熊市趋势通道线后第二次尝试反转，同时也是在试图反转熊市通道结尾处的卖出潮。当一个熊市通道向下突破后反转而上，它通常会带来至少两波反弹浪。并且可能会触及这个通道的顶部。","p":"p741"},{"t":"K线10不是一个很好的做空时机。因为交易者都在期待市场出现更高的低点以及第二次上升浪。它在K线11处变成了一个5个价位的失败。这也是一种反转形态。不出意外的话，交易者很可能会在K线10的下方买入，并且期待市场上出现第二波反弹浪。","p":"p742"},{"t":"K线11是一个双重底部的牛市旗形，同时也是一个带来第二波上升浪的更高的低点。","p":"p743"},{"t":"K线12是一个失败的牛市旗形突破，但是从K线11开始的上升浪是如此强劲以至于交易者只会在市场出现更低的高点时才开始做空。","p":"p744"},{"t":"K线13是在移动平均线上出现的高点2。同时也是测试了突破K线10的高点","p":"p745"},{"t":"K线14是在一个扩展的三角形顶部出现的二次卖空入场时机，同时也是在这个熊市趋势中出现的第三波反弹浪，因为它是一个卖空的模形。它同时也是一个趋势通道线反转，与K线5一起形成了双重顶部的熊市旗形。","p":"p746"},{"t":"K线15是在移动平均线上形成的低点2，也是一个失败的趋势线突破（从K线14的高点算起），也是自K线11至K线13的趋势线突破之后形成的一个更低的高点。","p":"p747"},{"t":"K线16是在移动平均线上形成的另一个低点2的卖空时机，同时也是一个双重顶部的熊市旗形。","p":"p748"}]},{"t":"para","text":"如图13.7所示。在这张标普500合约的1分钟图表上，出现了很多可以盈利的刮头皮交易时机，可以读懂这些价格行为的交易者可以迅速采取行动。但是在现实中却很难做到。对于很多交易者来说，正确的下单压力太多，所以最终他们往往会以损失收场。","pid":"p733"},{"t":"para","text":"K线1是一个对于出形态的失败向上突破，同时也是一个在缺口向上的日子里形成的更低的高点。","pid":"p734"},{"t":"para","text":"K线2在移动平均线上产生了一个高点2，一个楔形的牛市旗形，和一个趋势通道线的反转。","pid":"p735"},{"t":"para","text":"在一个缺口向上的日子里，K线3是一个没有创造新高点的一个失败的突破，同时也是一个卖空时机可以带来市场对于缺口的测试（市场通常会尽力测试缺口，所以交易者应该寻找这个方向的交易时机）。","pid":"p736"},{"t":"para","text":"K线5是在移动平均线上的低点3。低点3是一种形态的楔形或者三角形。同时也是三重顶部的熊市旗形。","pid":"p737"},{"t":"para","text":"K线6是一个失败的微型趋势线突破，同时也是一个从K线5熊市旗形的突破处开始的突破回调。","pid":"p738"},{"t":"para","text":"K线7反转了两条熊市趋势通道线，但是它并不是一个可靠的做多时机，这使得交易者相信做空交易者现在很强势。因为通道非常陡峭，所以这是一个模形反转而非一个模形牛市旗形，所以你最好在趋势通道线被突破后出现的更高的低点处买入，或者在市场向上超越移动平均线时买入。","pid":"p739"},{"t":"para","text":"K线8是一个失败的趋势线的突破，一个双重顶部的回调，一个低点2的卖出入场时机，以及是自K线7以来出现的5个价位的买入失败。因为有这么多的因素影响你做空，所以市场下跌得如此迅速也不足为奇。","pid":"p740"},{"t":"para","text":"K线9是市场自越过熊市趋势通道线后第二次尝试反转，同时也是在试图反转熊市通道结尾处的卖出潮。当一个熊市通道向下突破后反转而上，它通常会带来至少两波反弹浪。并且可能会触及这个通道的顶部。","pid":"p741"},{"t":"para","text":"K线10不是一个很好的做空时机。因为交易者都在期待市场出现更高的低点以及第二次上升浪。它在K线11处变成了一个5个价位的失败。这也是一种反转形态。不出意外的话，交易者很可能会在K线10的下方买入，并且期待市场上出现第二波反弹浪。","pid":"p742"},{"t":"para","text":"K线11是一个双重底部的牛市旗形，同时也是一个带来第二波上升浪的更高的低点。","pid":"p743"},{"t":"para","text":"K线12是一个失败的牛市旗形突破，但是从K线11开始的上升浪是如此强劲以至于交易者只会在市场出现更低的高点时才开始做空。","pid":"p744"},{"t":"para","text":"K线13是在移动平均线上出现的高点2。同时也是测试了突破K线10的高点","pid":"p745"},{"t":"para","text":"K线14是在一个扩展的三角形顶部出现的二次卖空入场时机，同时也是在这个熊市趋势中出现的第三波反弹浪，因为它是一个卖空的模形。它同时也是一个趋势通道线反转，与K线5一起形成了双重顶部的熊市旗形。","pid":"p746"},{"t":"para","text":"K线15是在移动平均线上形成的低点2，也是一个失败的趋势线突破（从K线14的高点算起），也是自K线11至K线13的趋势线突破之后形成的一个更低的高点。","pid":"p747"},{"t":"para","text":"K线16是在移动平均线上形成的另一个低点2的卖空时机，同时也是一个双重顶部的熊市旗形。","pid":"p748"}],"wcount":7228},{"id":"p2c4","title":"第14章　全球电子交易系统、前市、后市以及隔夜市场","blocks":[{"t":"para","text":"第14章　全球电子交易系统、前市、后市以及隔夜市场","pid":"p749"},{"t":"para","text":"在任何市场的任何时间内，相同的价格行为的技术分析都是一致的。有许多国际交易商。会一天进行24个小时的交易。在前市产生的高点或低点往往会在后面的时间得到检验，当你在日盘进行交易的时候并不需要参考全球电子交易系统的价格，因为你能得到的信息非常少，而且大部分的信号在日盘交易的图表上已经给出了。许多交易者在进行日盘交易的时候会使用全球市场的图表，这也是非常合理的。但是我更喜欢日盘图表，因为当趋势线和趋势通道线连续超越两天以上的交易日时，在日盘图表上看起来非常明显，而这对我来说非常重要。","pid":"p750"},{"t":"para","text":"当股票在日盘收盘后出现了收益报告时，许多交易者会试图在后市抓住机会交易股票，因为如果市场产生了较大的波动。将产生潜在的巨大盈利机会，但是这些波动的机会非常难以抓住，所以大部分的交易者都不应该尝试去交易。市场的波动往往在短时间内迅速完成。以至于你还来不及阅读图表和下单，这些波动往往会在止损位产生较大的滑点，也会有较大的回调，有时候也会出现反转，而当你刚刚反应过来市场上发生了什么的时候，这些波动也正好停止了。","pid":"p751"},{"t":"img","src":"assets/img/p2c4_001.webp","ctx":[{"t":"在任何市场的任何时间内，相同的价格行为的技术分析都是一致的。有许多国际交易商。会一天进行24个小时的交易。在前市产生的高点或低点往往会在后面的时间得到检验，当你在日盘进行交易的时候并不需要参考全球电子交易系统的价格，因为你能得到的信息非常少，而且大部分的信号在日盘交易的图表上已经给出了。许多交易者在进行日盘交易的时候会使用全球市场的图表，这也是非常合理的。但是我更喜欢日盘图表，因为当趋势线和趋势通道线连续超越两天以上的交易日时，在日盘图表上看起来非常明显，而这对我来说非常重要。","p":"p750"},{"t":"当股票在日盘收盘后出现了收益报告时，许多交易者会试图在后市抓住机会交易股票，因为如果市场产生了较大的波动。将产生潜在的巨大盈利机会，但是这些波动的机会非常难以抓住，所以大部分的交易者都不应该尝试去交易。市场的波动往往在短时间内迅速完成。以至于你还来不及阅读图表和下单，这些波动往往会在止损位产生较大的滑点，也会有较大的回调，有时候也会出现反转，而当你刚刚反应过来市场上发生了什么的时候，这些波动也正好停止了。","p":"p751"},{"t":"如图14.1所示，戴尔在前市收盘后出了一份收益报告，看起来确实给后市交易带来了很多交易机会，但是对于大部分的交易者来说，还是很难抓住市场的波动机会获利的。","p":"p752"},{"t":"在市场向上突破之后，K线1是一个高点1的牛市内含K线，在高于K线1的高点1美分的位置，你可以做多入场。","p":"p753"},{"t":"K线2是一个高于外包K线1美分的做多入场K线，K线2向下突破了牛市微型趋势线，并且开始反转向上。","p":"p754"},{"t":"K线3是在主要趋势线被突破之后，产生的一个突破高点1的做多时机。","p":"p755"},{"t":"K线4是一根熊市反转K线，同时也是形成了一个最后旗形的卖空机遇，随后市场在向上突破牛市通道后形成了新的买入高潮。","p":"p756"},{"t":"此外，因为K线3突破了主要的牛市趋势线，所以这意味着做空交易者的力量正在加强。只有在趋势线第一次被突破的时候，趋势才会变强劲。而且，在一个强劲的趋势中进行趋势交易需要看到5分钟的反转K线（3分钟或者1分钟的都不可以）。在后市后面的时间段里，市场形成了一个狭窄的震荡区间。","p":"p757"},{"t":"前市也是可以进行交易的，但是在纽约证券交易开始交易之前的一两个小时内（上午6：30之前），并没有太多的入场通道（看图14.2）。","p":"p758"}]},{"t":"para","text":"如图14.1所示，戴尔在前市收盘后出了一份收益报告，看起来确实给后市交易带来了很多交易机会，但是对于大部分的交易者来说，还是很难抓住市场的波动机会获利的。","pid":"p752"},{"t":"para","text":"在市场向上突破之后，K线1是一个高点1的牛市内含K线，在高于K线1的高点1美分的位置，你可以做多入场。","pid":"p753"},{"t":"para","text":"K线2是一个高于外包K线1美分的做多入场K线，K线2向下突破了牛市微型趋势线，并且开始反转向上。","pid":"p754"},{"t":"para","text":"K线3是在主要趋势线被突破之后，产生的一个突破高点1的做多时机。","pid":"p755"},{"t":"para","text":"K线4是一根熊市反转K线，同时也是形成了一个最后旗形的卖空机遇，随后市场在向上突破牛市通道后形成了新的买入高潮。","pid":"p756"},{"t":"para","text":"此外，因为K线3突破了主要的牛市趋势线，所以这意味着做空交易者的力量正在加强。只有在趋势线第一次被突破的时候，趋势才会变强劲。而且，在一个强劲的趋势中进行趋势交易需要看到5分钟的反转K线（3分钟或者1分钟的都不可以）。在后市后面的时间段里，市场形成了一个狭窄的震荡区间。","pid":"p757"},{"t":"para","text":"前市也是可以进行交易的，但是在纽约证券交易开始交易之前的一两个小时内（上午6：30之前），并没有太多的入场通道（看图14.2）。","pid":"p758"},{"t":"img","src":"assets/img/p2c4_002.webp","ctx":[{"t":"此外，因为K线3突破了主要的牛市趋势线，所以这意味着做空交易者的力量正在加强。只有在趋势线第一次被突破的时候，趋势才会变强劲。而且，在一个强劲的趋势中进行趋势交易需要看到5分钟的反转K线（3分钟或者1分钟的都不可以）。在后市后面的时间段里，市场形成了一个狭窄的震荡区间。","p":"p757"},{"t":"前市也是可以进行交易的，但是在纽约证券交易开始交易之前的一两个小时内（上午6：30之前），并没有太多的入场通道（看图14.2）。","p":"p758"},{"t":"通常在5：30市场会出现报告，然后会出现趋势和反转。","p":"p759"},{"t":"K线1是一个楔形的做多时机，同时也是一个双重底部，交易者至少应该将头寸持有至K线2的回调时，才能获利。一个楔形底部（或者说是三浪推动向下，或者其他名字）通常会带来两次向上推动的浪潮。","p":"p760"},{"t":"K线2是一个更高的低点，同时也是一个小型的趋势线反转。","p":"p761"},{"t":"一份报告导致市场错误地向上突破后，又出现了向下突破的外包K线（K线4）。许多交易者将在K线3的下方卖空，而做多交易者将在K线3处设置他们的止损位。","p":"p762"},{"t":"K线5是一次突破性的回调。","p":"p763"},{"t":"K线6是市场第二次尝试反转新的震荡低点（K线5是第一个震荡低点）所形成的二次入场通道。","p":"p764"}]},{"t":"para","text":"通常在5：30市场会出现报告，然后会出现趋势和反转。","pid":"p759"},{"t":"para","text":"K线1是一个楔形的做多时机，同时也是一个双重底部，交易者至少应该将头寸持有至K线2的回调时，才能获利。一个楔形底部（或者说是三浪推动向下，或者其他名字）通常会带来两次向上推动的浪潮。","pid":"p760"},{"t":"para","text":"K线2是一个更高的低点，同时也是一个小型的趋势线反转。","pid":"p761"},{"t":"para","text":"一份报告导致市场错误地向上突破后，又出现了向下突破的外包K线（K线4）。许多交易者将在K线3的下方卖空，而做多交易者将在K线3处设置他们的止损位。","pid":"p762"},{"t":"para","text":"K线5是一次突破性的回调。","pid":"p763"},{"t":"para","text":"K线6是市场第二次尝试反转新的震荡低点（K线5是第一个震荡低点）所形成的二次入场通道。","pid":"p764"},{"t":"img","src":"assets/img/p2c4_003.webp","ctx":[{"t":"K线5是一次突破性的回调。","p":"p763"},{"t":"K线6是市场第二次尝试反转新的震荡低点（K线5是第一个震荡低点）所形成的二次入场通道。","p":"p764"},{"t":"如图14.3所示，上午标普500期货合约市场对5：30出来的失业报告反应不大。这是一个100次交易的图表，在图表上每条K线代表100次交易，与这些交易的交易量和交易时机都是独立的。请注意，在这30根K线中K线1和K线5之间的K线都是在1分钟之内发生的，因为这是对报告的快速反应。这些K线形成的如此迅速。以至于除了市场上已经设置好的订单之外，很难再进行其他的交易。理论上。基于这样的价格行为是可以进行盈利颇厚的刮头皮交易的，但是大部分的交易者是不会轻易尝试去做的。我们之所以向你说明这个，只是为了证明标准的交易模式是存在的。但是不一定大家都有能力做到缩表图显示的是同样的30分钟的交易的1分钟和5分钟的K线图。","p":"p765"}]},{"t":"para","text":"如图14.3所示，上午标普500期货合约市场对5：30出来的失业报告反应不大。这是一个100次交易的图表，在图表上每条K线代表100次交易，与这些交易的交易量和交易时机都是独立的。请注意，在这30根K线中K线1和K线5之间的K线都是在1分钟之内发生的，因为这是对报告的快速反应。这些K线形成的如此迅速。以至于除了市场上已经设置好的订单之外，很难再进行其他的交易。理论上。基于这样的价格行为是可以进行盈利颇厚的刮头皮交易的，但是大部分的交易者是不会轻易尝试去做的。我们之所以向你说明这个，只是为了证明标准的交易模式是存在的。但是不一定大家都有能力做到缩表图显示的是同样的30分钟的交易的1分钟和5分钟的K线图。","pid":"p765"},{"t":"img","src":"assets/img/p2c4_004.webp","ctx":[{"t":"如图14.3所示，上午标普500期货合约市场对5：30出来的失业报告反应不大。这是一个100次交易的图表，在图表上每条K线代表100次交易，与这些交易的交易量和交易时机都是独立的。请注意，在这30根K线中K线1和K线5之间的K线都是在1分钟之内发生的，因为这是对报告的快速反应。这些K线形成的如此迅速。以至于除了市场上已经设置好的订单之外，很难再进行其他的交易。理论上。基于这样的价格行为是可以进行盈利颇厚的刮头皮交易的，但是大部分的交易者是不会轻易尝试去做的。我们之所以向你说明这个，只是为了证明标准的交易模式是存在的。但是不一定大家都有能力做到缩表图显示的是同样的30分钟的交易的1分钟和5分钟的K线图。","p":"p765"},{"t":"如图14.4所示，在全球24小时交易的K线交易图表上，出现了一个扩展的三角形，并且在K线5处结束（K线1和3是最初的两波上升浪），同时缩略图显示了在相同的交易时间内的日内交易图表。如果你只是用日内图表进行交易，你就不需要再在全球市场图表上看到这个扩展的三角形，并且进行做空交易。K线5突破了昨天的高点，并且回到了移动平均线。之后市场反弹到了一个更低的高点，并且在K线6的双重顶部熊市旗形处出现了一个卖空时机（之前的顶部在6根K线之前出现）。","p":"p766"}]},{"t":"para","text":"如图14.4所示，在全球24小时交易的K线交易图表上，出现了一个扩展的三角形，并且在K线5处结束（K线1和3是最初的两波上升浪），同时缩略图显示了在相同的交易时间内的日内交易图表。如果你只是用日内图表进行交易，你就不需要再在全球市场图表上看到这个扩展的三角形，并且进行做空交易。K线5突破了昨天的高点，并且回到了移动平均线。之后市场反弹到了一个更低的高点，并且在K线6的双重顶部熊市旗形处出现了一个卖空时机（之前的顶部在6根K线之前出现）。","pid":"p766"}],"wcount":1730},{"id":"p2c5","title":"第15章　始终在场","blocks":[{"t":"para","text":"第15章　始终在场","pid":"p767"},{"t":"para","text":"“始终在场”一词可能是在交易中唯一重要的概念。作为交易者，你必须不停地判断市场的方向，而一直保持这种交易方式可以帮助你判断市场的趋势。假设你必须一直在市场上交易，那么不论是做多还是做空，始终在场策略的方向就是你持有头寸的方向。这一策略通过多种形式被许多交易者（包括机构交易者）运用。举个例子，许多共同基金都是一直保持做多的方向，并且大多数对冲基金是接近完全投资的，但他们也经常在某些市场一直做多，某些市场一直做空。如果作为个人交易者的你经常会错过市场的大幅移动。那么你就应该考虑始终在场这种交易方式了。","pid":"p768"},{"t":"para","text":"始终在场策略的方向判断与趋势交易策略的方向判断并不完全一样，因为当市场形势很模糊的时候，大部分的趋势交易者是不参与交易的。然而市场在任何时候都是可以交易的，不论是做多还是做空，而对于价格走势的方向市场参与者大部分时候是有共识的。每天进行20次交易及以上的交易者可以视为始终在场策略的交易方向在一天内反复变动，但是很少有交易者可以日复一日地捕捉到不断变化的交易方向。然而。对于只想找到最好的3到10次的波段交易机会。也允许市场出现适当的回调，而不需要改变他们最近的交易方向的交易者来说，他们已经掌握了进行始终在场交易策略的心态。他们可以在市场每次出现新的趋势信号时改变交易方向。在市场的波段走势减弱时获利平仓，然后再寻找新的交易方向。然而，很少会有交易者在市场上始终保持交易，而且在每次反转信号出现的时候迅速改变他们的交易方向。大部分的交易者都需要中场休息。所以他们有一段时间很难进行反转交易。虽然交易者们能够把握住很多始终在场交易策略中的反手入场时机。但是一般会把每次的这种机会都看作是一次波段交易，在反手交易之前先平仓离场。他们关注的是每笔交易是否能够获得与承担的风险较为匹配的预期收益，而不只是用始终在场策略的思维，根据每次的入场信号去操作。通常来说，如果市场的信号已经非常明确，足以进行始终在场策略下的反转交易且交易者认为有60%的概率可以达到他们的风险收益相匹配的目标。一个始终在场的交易信号的最低标准就是市场朝新的方向发展的可能性要大于旧的方向，也就是说市场有至少51%的可能性会朝新的方向发展当然大部分的信号是有60%及以上的可能。例如，在标普500期货合约的交易市场上，如果交易者需要一个两个点位的止损位才能交易。那么他们应该从他们的入场点开始设置两个点位以上的盈利目标，如果他们可以正确地解读价格行为，则他们有60%的可能性会成功。","pid":"p769"},{"t":"para","text":"如果交易者此刻正在看交易图表，并且需要马上做出操作方向的判断，不管是选择做多还是做空，只要他们在多空两个方向上稍有偏向，就能得到始终在场策略的交易方向。这至少是短期的市场趋势。如果他们还是不能做出决定，他们应该看看移动平均线和导致他们不能确定的情况出现的市场价格变化过程（记住，市场上不确定的情况是指市场处于震荡区间）。如果近期大部分的K线都在移动平均线之下，则始终在场的交易方向可能就是做空。如果近期大部分的K线在移动平均线之上，则很可能是做多。如果在市场的震荡区间出现之前是一波反弹浪。则始终在场策略的方向可能是做多。如果在市场的震荡区间出现之前是一波下跌浪，则始终在场策略的方向可能是做空。如果你希望在市场回调的时候买入，则始终在场策略的方向可能是做多。如果你希望在市场反弹的时候卖出，则始终在场策略的方向可能是做空。如果你还是无法决定交易方向，而市场又处于震荡区间，那么你就保持低买高卖就好了。你的目标就是你的操作要与市场的方向同步，节奏要踩对。这种感觉就像是孩童时与朋友一起跳绳的感觉，你的两个朋友会摇摆绳子，而你必须快速地跑进来。根据绳子的晃动跳跃。你必须认真地观察绳子晃动的节奏。一旦你可以确定绳子的节奏，你才开始跳跃。同理，在市场上进行交易时，一旦你可以确定市场的方向，你就可以开始操作了。","pid":"p770"},{"t":"para","text":"有一些交易者会用更长周期的时间图表来决定他短周期始终在场策略的持仓方向。举个例子，如果他们在5分钟的时间图上交易，同时会在60分钟的图表上观察市场，如果市场处于牛市且K线均高于移动平均线，则他们在5分钟的图表上只会寻找买入的入场时机。其他交易者也会用同样的方式用更长周期的K线图上的指标来运用到更短周期的交易决策中。举个例子，如果在60分钟的图表上市场是随机上涨的，那么他们就会在5分钟的图表上寻找回调买入时机。对于5分钟的图表来说，每天需要去评估10到20次市场的反转，很多交易者并不喜欢这样的交易方式，所以他们宁愿选择在更长周期的K线图表上交易，因为在那里他们只需要做3到5次交易决定。这也是一个非常有效的方式，不过，因为在更高的图表上K线更大，所以需要的止损价位也更大，所以这也意味着交易的头寸应该更小。","pid":"p771"},{"t":"para","text":"在市场开盘之前，许多交易者经常会有一种偏见，认为昨天最后的始终在场策略的交易方向还是会主导今天的市场方向。然而，一旦开盘后就出现两根连续的强劲的趋势K线。则市场很可能会根据这一新的方向发展。当然直到后续市场上出现了突破以及后续的力量跟进，这个新的方向才能被确定，但是这并妨碍我们认为这是一个起点，如果市场上前后力量可以衔接，那么将带来新的交易机会，我们可以等待第一次回调时进入市场。如果你在市场上的经验足够丰富的话，理论上你可以一整天都可以在市场上交易，并且抓住每一次合理的入场信号。","pid":"p772"},{"t":"para","text":"市场总是在尝试反转，而且每次反转的力量几乎就要成功，但是通常会缺乏最后一点的跟进力量支持，这导致很多交易者没办法对反转的成功概率有足够的信心。对于顺趋势交易者来说，这些几乎成功的反转是非常好的交易机会。举个例子。如果在一个牛市趋势中形成了一根强劲的熊市突破K线，那么许多交易者将会在这根K线的收盘处买入，期待市场不会继续下跌。他们的想法也是比较正确的，因为大部分时候反转是会失败的，所以我们逢回调买入的机会非常难得。其他的做多交易者会等待，他们想知道下一根K线的收盘价会是怎样。如果下一根K线并没有以下跌收盘，则他们会在下一根K线的收盘处买入，还有一些做多交易者将会在下一根K线的高点以及之前强劲的熊市K线的高点上方买入，这是因为这些位置很可能是空头的保护性止损价位。而做空交易者如果没有看到市场后续的跟进下跌来支持他们做空，他们将会回补他们的做空头寸。当作空交易者和做多交易者同时买入时，市场又会上涨好几根K线。在另一个合理的卖空时机出现之前，做空交易者不会再次做空，而这个新的卖空时机往往会在市场到达新高之后出现。当市场上的新手看到前面提到的强劲的熊市K线时，他们会感到恐慌。-他们认为市场正在突破，他们需要马上做空。在他们的眼里只能看到那根非常强劲的熊市K线，而忽略了之前出现的强劲的牛市趋势。在这根失败的熊市K线的低点下方1到2个点位处，他们做空，但之后因为市场又开始上涨，他们的止损位被触及。而一般来说，这时候的反弹还是比较微弱的，所以他们暂时还不会买入。他们还在寻找市场上出现低点1或者低点2的卖空时机，期待市场在这根强劲的熊市K线之后还会出现下跌浪，但是低点1失败了，所以他们的止损位再次被触发了。之后低点2也失败了，所以他们连续三次的操作都失败了。他们之所以会这样连续失误，是因为他们还没能理解始终在场策略的持仓为做多代表着什么。当始终在场策略选择做多时，这意味着牛市趋势还是有效的，多头总体依然控制着市场。虽然有时候差一点点就可能反转到始终做空的方向，但是最终并没有。只要牛市趋势是有效的，那么始终在场策略的方向就应该始终是做多。另外，将市场的赌注下在反转会获胜这个筹码上是非常错误的，因为80%的反转都是失败的。","pid":"p773"},{"t":"para","text":"始终在场策略也是一种波段交易的策略。为了使得这个策略持续有效，交易者应该寻找最重要的三次，或者最多10次转换方向的机会，并不需要在每一次小的反转信号处转变方向（大部分日子一天内会有20次以上的反转，但是有些反转太小了很难进行交易）。此外，一旦市场符合他们的交易方向预期，持仓利润已经超出初始风险的2至3倍的距离时，大部分的交易者会部分或全部获利平仓，这时他们使用始终在场策略也没什么压力。当机构交易者开始获利时，市场会经历一波回调从而这些机构交易者可以重新进入市场趋势的方向，结果就是趋势也会复苏，继续推进。当市场由趋势进入震荡区间时。始终在场策略的持仓方向还是不会改变。如果交易者准备在震荡区间交易，他们应该大部分或者全部采用刮头皮交易的方式。但是，如果他们并没有改变他们始终在场的交易方向，那么他们应该只进行同方向的刮头皮交易。举个例子，如果市场经历了一波强劲的熊市趋势之后，价格开始有所反弹。但是还没有出现足够强劲的牛市K线，并且价格始终是在移动平均线的下方，那么始终在场策略还是保持做空的方向。即使市场现在已经进入了震荡区间，交易者也应该寻找的是做空方向的刮头皮短线交易时机。但是如果市场上出现了一个非常强劲的做多入场时机，就很可能会将始终在场策略的方向反转为做多，或者至少会有足够多的K线提供做多的刮头皮交易时机。然而，任何不能够将始终在场方向反转为做多的买入入场时机都是不值得交易的。","pid":"p774"},{"t":"para","text":"因为始终在场策略是需要调整交易方向的。所以当市场处于狭窄的震荡区间时最好不要使用这种策略。事实上，在这种情况下最好不要进行交易，安心等待市场出现突破或者失败的突破，因为这两种情况都可以带来始终在场策略方向的改变。如果经验丰富，经常盈利的交易者希望在这种狭窄的震荡区间交易，他们可以采取两种方式，一种就是保持在震荡交易之前采取的始终在场策略的方向，获得同方向的波段收益，另一种就是使用限价指令采取刮头皮短线交易的方式，在震荡区间每次出现的高点或低点，或者对前一根K线向上或者向下突破高点或低点处进行反向交易，即高抛低吸。","pid":"p775"},{"t":"para","text":"在震荡区间日，在市场接近这个区间的上限或者下限之前，始终在场策略的反转方向通常都是不清晰的。举个例子来说，在一个震荡区间，在出现一个可以触及区间顶部的上升浪之前，始终在场策略的方向很难明确做多，同理，在出现可以触及区间底部的下跌浪之前，始终在场策略的方向也很难明确做空。然而，在顶部区间做多和在底部区间做空实际上与交易者应该做的完全相反。始终在场策略一般来说在市场有趋势的时候会用得更好，在震荡区间用这个策略是非常危险的，在震荡区间你最好用刮头皮交易策略，保持低买高卖。举个例子，当市场正在向区间顶部移动时，会有一些不断突破震荡高点的突破在区间内出现，这可能会使得交易者认为市场上的始终在场策略可以开始做多了，但是通常来说，震荡区间的上沿的突破并没有如此重要，以及后续的突破和跟进力量并不能使得所有的人相信可以做多。如果你看到了市场的向上移动，并且正在怀疑市场是否已经进入了始终做多，那么你就产生了不确定的情绪。而不确定性正是震荡区间的标志，你会有你自己的答案。随着趋势上涨市场上出现了很多的紧迫情绪。你很确定市场将会上涨，但是叉很迫切地希望市场出现回调，从而你可以以更低的价格买入。交易者都知道，如果市场向上的移动会带来新的牛市趋势而非仅仅只是震荡区间的上调，那么这次移动就会有很多强劲的牛市K线，并且会不断超越震荡高点。除非市场突破整个震荡区间，并且还有后续的跟进趋势时，而非仅仅只是区间内的触顶或触底时，市场上才会形成共识。市场上的新手可能会担心市场在突破区间后不会有太大的移动，但是经验丰富的交易者都知道，一次震荡区间的成功突破通常至少会达到一个最小的可测量的移动目标，同时会带来非常丰厚的盈利机会。","pid":"p776"},{"t":"para","text":"在震荡区间日，因为卖出真空的存在。在一天的最低点处通常会形成最强劲的下跌潮。因为强大的做多交易者希望市场会去测试震荡区间的低点，所以他们会在市场接近最低点的时候停止买入。这进一步加剧了双方力量的不平衡，导致市场进一步快速下跌。同时。基于动量的程序化交易也会感知到市场下跌的加剧，所以在市场上的动能下降或者出现反转之前，他们会迅速做空。如果交易者仅仅只关注最近时期的市场趋势，在他们的眼中就只有一波强劲的下跌浪，所以他们就会认为始终在场策略已经开始转为强烈做空了。然而，如果他们愿意回头看整张图表，他们将会对这波卖出真空感到怀疑。相对于做空，可能他们会更愿意在这个失败的突破尝试处买入做多。","pid":"p777"},{"t":"para","text":"所以，那就有一个疑问了，到底交易者应该基于怎样的基础去判断始终在场策略的方向？在交易者有信心做出方向选择之前，他们需要市场有明确的趋势。他们希望可以看到市场上会出现强劲的突破，让他们可以更好地判断后市。关于突破力量的信号我们将在第二本书详细解释当市场上出现了至少两根连续的强劲的牛市趋势K线时，大部分的交易者才会相信始终在场策略的方向是做多。同样，当市场上出现了至少两根连续的强劲的熊市趋势线时，大部分的交易者才会相信始终在场策略的方向是做空。在开盘最初的一个小时，明显的趋势还没有形成，如果出现了两根连续的牛市趋势K线将会让交易者寻找买入的刮头皮交易时机，如果出现的是两根连续的熊市趋势K线将会让交易者寻找卖出的刮头皮交易时机。这些都会在19章开盘交易中详细解释。","pid":"p778"},{"t":"para","text":"如果整个市场的氛围足够支持，即使是只出现了一根平均主体大小的趋势K线也足以让交易者相信始终在场策略已经转变到了相反的方向。然而，一般情况下，则至少需要两根或者更多根连续的趋势K线才能让交易者相信市场上的方向将会在接下来发生显著的改变。与反趋势交易者在市场回调中采取的措施相同，当市场出现一次回调时，他们还是会保持原有的头寸，只有第二次回调出现时，他们才有可能采取措施（比如，当作多交易者在底部买入之后，他们会暂时离开市场，直到市场触发了低点2，他们才会转而做空），始终在场策略的交易者也是如此，在他们看到第二根连续的强劲趋势K线之前，他们并不认为始终在场策略的方向已经改变了。","pid":"p779"},{"t":"para","text":"因为第二根趋势K线通常会使得交易者相信始终在场策略的方向发生了反转，所以这根趋势K线的收盘非常地重要。举个例子，如果市场上出现了一根熊市突破K线，则交易者会仔细观察下一根K线的收盘处做空交易者会希望看到一个熊市的收盘，而做多交易者会希望看到牛市的主体。因为市场有惯性，所以大部分企图反转市场趋势的尝试都会失败。这意味着许多交易者将会在熊市突破K线的收盘处买入，并且期待市场上接下来出现的K线会有一个牛市的收盘。这样做空交易者将会放弃。如果突破并不是太强，并且市场上有充足的理由相信突破会失败（就像在牛市旗形底部出现的突破尝试），那么这将是一个很好的交易机会，但是因为做出交易的决定非常困难，所以只有经验丰富的交易者才应该考虑这个交易机会。做多交易者想要在市场回调处买入，所以他们会寻找市场上出现的下跌浪。他们把下跌浪看作是做空交易者错误地判断了市场方向从而造成的后果。因此这些做空交易者将不得不带着损失买回他们的头寸。此外，这些做空交易者不会在至少一根或者两根K线之后再次卖出，所以在接下来的市场中做空交易者将会变少。这就增加了做多交易者在下跌浪中买入头寸获得利润的机会。同理，当市场处于做空的始终在场策略时，做空交易者认为在一些小波浪中出现的上升浪是卖空的绝好机会，他们认为做多交易者会被困住。并且会通过卖出手中的头寸失败离场。","pid":"p780"},{"t":"para","text":"如果接下来的K线非常强劲，交易者可以在这根K线的收盘处或者市场的小型回调处入场。举个例子。如果市场上出现了一个非常强劲的牛市突破，并且接下来的一根K线也是一根强劲的牛市趋势线，许多交易者将会在接下来的K线的收盘处或者1至2个点位的回调处买入。如果接下来的K线比较弱，比如说是一个十字星，那么相较于在K线的收盘处买入，在市场的回调处买入更好。如果接下来的K线只比突破的K线高或低几个点位，那么这个突破失败的可能性将会很大。如果接下来的K线比突破的K线高或低很多个点位，那么这根K线收盘后会成为一根强劲的趋势K线的可能性会很大。大部分的交易者都认为市场会有明确的始终在场策略方向。有时候，市场会在突破飞线之后沿着突破的方向继续走儿根K线，然后悄无声息地形成一个与突破方向相反的趋势通道，但是又没有明确表现出突破已经失败的迹象，投资者甚至不知道始终在场策略的持仓方向已经悄然发生改变。这时，对于大部分交易者来说，始终在场策略的方向很可能是没有改变的，但是他们会设置保护性止损位以防市场上的回调走得太远。市场也很有可能进入震荡区间，所以交易者很可能会选择震荡区间的交易模式，这意味着他们将进入刮头皮交易，避免此前通过趋势获得的利润被震荡行情吞噬掉。举个例子，如果在一个牛市突破后紧随了几根弱势的K线，之后市场并没有形成下跌浪，而是形成了一个较弱的下跌通道，市场仍处于始终在场策略的做多状态。然而，做多交易者还是应该设置保护性止损位，以防下跌通道在没有出现明显的熊市反转迹象前就下跌得太远。如果做多交易者在早期买入，并且在开盘就赢得了较为丰厚的利润。他们也可以将他们的止损位设置在盈亏平衡点上。如果他们是在较晚的时间买入。他们应该在信号K线的下方离开市场。如果后市走弱，他们就不应该在市场的高点附近买入，而是应该等待市场出现了一个回调时再买入。如果他们真的是在市场的顶部买入，那应该只会发生在他们感受到了市场的紧迫情绪的情况下。如果后面的市场反应并没有证实紧迫情绪的存在，他们就应该离开市场并且寻找市场回调的机遇买入。","pid":"p781"},{"t":"para","text":"有一个指导性的原则，当你选择始终在场策略的做空方向时，你至少需要看到接下来的一根K线并没有以上涨收盘。如果接下来碰巧是一根小的熊市K线或者一根十字星K线，那么可以确信的是做空交易者已经控制了大部分的交易者，但是这也是新的熊市趋势并不强劲的迹象。相较于在这些K线的收盘处卖空，我们最好是在市场反弹以及低点1和低点2的入场时机处卖出。如果接下来的K线有一个非常强劲的牛市主体，或者是一根牛市反转K线，那么这将是一个失败的突破的买入信号。如果这根K线拥有一个较小的牛市主体，大部分的交易者将会等待一个更有利的卖出时机，但是他们也相信出现一个新趋势的机会已经不大了。反之亦然。当市场处于始终在场策略的做多方向时，也是同样的道理当你采取一个始终在场的做多策略时，在趋势K线之后你至少需要看到一个以下跌收盘的K线。如果接下来的K线并不是非常强劲，那么相较于在这根K线的收盘处买入，你更应该在市场回调的时候买入。如果接下来的K线有一个熊市收盘，那么这个突破可能是一个牛市陷阱，而且这可能是一个失败的突破信号K线，提示我们做空的机会。然而，市场也很可能会突然变成一个牛市趋势，但是在得到这个结论之前交易者需要市场给出更多的证据。","pid":"p782"},{"t":"para","text":"一旦交易者确信市场在突破之后有持续的跟进力量，那么接下来价格将会向突破的方向继续移动一段可预期的距离。举个例子，如果市场上有一个持续了三根K线的强劲的上升浪，且向上突破了震荡区间，那么许多交易者会相信市场接下来会出现一个与该上升浪或者震荡区间的高度相当的另一上升浪，所以他们会立即在市场上买入一小部分头寸。因为他们是非常自信的，所以他们至少会有百分之六十的把握市场会进行等距离的定向移动，不论这种情况是否发生，但在数学概率上还是会支持进行交易。当趋势持续时，风险还是保持恒定。而且定向等距离的价格移动还是会有百分之六十或者更多的概率，但是随着利润增长回报会更多，所以从数学角度来说进行这笔交易更为划算。举个例子，如果在高盛的股票中出现了一波强劲的三根K线的上升浪，而交易者在这波上升浪的顶部买入，这波上升浪大概有1美元的高度，而在这波上升浪向下跌1美元到达震荡区间底部之前。市场很可能会再次出现向上移动一美元的距离。如果市场在接下来的几根K线中上升了1.5美元，市场依然面临着跌人底部的风险（交易者很可能会在这个时候提高了他们的止损价位），这个时候市场可测量的移动距离大约是比之前的K线高出1.5美元的距离，或者是比他们入场时的价格高出2美元。所以他们现在有百分之六十的概率会在不超过1美元损失的情况下获利2美元，这意味着趋势的趋势是非常强劲的。如果市场的趋势持续上升，那么他们还会在保持比较大的获利概率下，获得更大的利润。当交易者开始提高他们的止损位时，风险将会降低，所以这次交易将会在数学概率上更加划算。一般来说，只要市场趋势非常明确那么就应该采取始终在场交易策略，交易者在使用交易者的等式来评估交易时，就应该假设获利的概率至少是百分之六十。","pid":"p783"},{"t":"para","text":"市场通常会在开盘之初的一个小时内进入始终在场策略的模式，而交易者也往往会在那个时点进入始终在场交易。当市场向他们预期方向移动的距离超过他们承受的风险的一至两倍时，一些交易者就可以获利平仓了。举个例子，如果交易者在苹果（AAPL）的股票市场上采取始终做多的方向，同时将他们的保护性止损位设置在他们的入场价位的一美元之下，一些交易者将会在获利1美元或2美元之后离开市场。而另外一些交易者则会当市场出现明显的反转，且开始采取相反方向的始终在场策略时，才会考虑采取其他操作。之后他们将会采取相反方向的始终在场策略。因为大部分的交易者并没有能力在每一次市场出现微型反转时就调整操作的方向，所以他们只会寻找一天中的2至5次强劲的反转时机。有时候市场会出现一波持续的回调，但是并没有带来始终在场策略的反转。举个例子，如果市场上出现了一波强劲的上升浪，那么始终在场策略的方向就是做多，之后市场上又出现了一股动能较低的回调并持续了数个小时，那么此时交易者需要重新评估他们的策略。此时他们应该设置最坏情景下的保护性止损位，以防市场的回调持续下调以至于跌破了他们的买入价位。有时候市场会在没有明显的下跌浪和卖出信号的情况下，跌破他们的买入价位。如果他们在标普500期货合约的开盘时已经获利，他们当然不愿意市场跌破他们的入场价，所以他们可能会使用一个盈亏平衡的止损位。如果他们的止损位被触发了，他们将继续等待寻找市场上的始终在场策略采取的方向。如果在他们获利之前，市场在他们入场后很快就出现回调，那么他们应该将保护性止损位设置在上升浪的下方，即使它可能会离这波浪潮较远。如果距离较远，他们的头寸也应该足够小从而使得他们的风险在正常的范围之内。","pid":"p784"},{"t":"para","text":"一旦你相信市场已经变成了可以采取始终在场策略的状态时，你最好至少在市场上先买入或卖出一小部分头寸，或者你也可以在市场进入小幅回调的时候再操作。当然如果市场上始终在场策略的方向比较明显和强劲。那么以上的操作原则将更加适用。如果市场上的动能较低，且没有较为紧迫的情绪，许多交易者会选择在市场出现大型回调的时候入场。然而，这些交易者也有可能会错过市场随趋势移动的时机，因为许多非常好的采用始终在场策略的交易一开始的时候动能非常小，市场一直在许多根K线和点位之后才出现回调。通常情况下，当市场上的交易者处于始终做多的情况下，交易者会寻找每一次因做空交易者努力反转市场而带来的回调时机买入，因为他们早已深刻的认识到大部分反转市场趋势的尝试都会失败。他们会在任何熊市趋势K线的收盘处或附近买入，或者在低于前一根K线的低点或者之前的震荡低点，在所有的支撑位处比如牛市趋势线的下方买入。当市场处于始终做空的情况时，交易者会将每一次做多交易者企图反转市场带来的小幅上升看作是卖出时机，因为他们知道大部分的尝试会失败，他们在任何牛市趋势K线的高点，前一根K线的高点，或者任何震荡高点处，或者在支撑位比如熊市趋势线处卖出。","pid":"p785"},{"t":"para","text":"当你在始终在场策略中不断转换方向时。你必须能够容忍市场出现回调，因为这是不可避免的。因为大部分的回调都不会演变成反转。所以你不用每一次都担心市场的移动会导致你的策略的方向的改变。通常来说，如果市场上出现了一次回调差一点触发了你的盈亏平衡止损位，之后市场又沿着你的策略采取的方向复苏了好几根K线，一般这时市场很难再回到你当初的入场价位。因此，在大部分的情况下，你可以将你的止损位上移到你的盈亏平衡点上。如果市场遭遇到了第二波回调，触及了你的止损，而你对市场的方向又不确定。当出现另外二个方向的入场机遇之前，你可以一直空仓而不必感到焦虑。记住，不确定性是震荡区间的标志，而始终在场是判断趋势的一种方式。","pid":"p786"},{"t":"para","text":"如果你相信市场上有始终在场策略的方向。你就不应该采取反趋势的交易。这是因为在这种时候采取反趋势交易肯定是为了进行刮头皮交易，这意味着这种时候风险会是回报的两倍多，且成功的概率不太可能会等于或超过70%。如果你认为市场上会出现回调，那么相较于你仅仅只是下赌注似的认为回调会比较大而去反趋势交易，在回调结束之后进入趋势的方向会更好，而且你会有更大的概率取得短线刮头皮交易的成功。","pid":"p787"},{"t":"para","text":"我有一个朋友在每天开盘的前几个小时都非常耐心地等待始终在场策略的入场时机，当他发现一个时机时，他就会希望这个趋势持续至少几个小时，且覆盖一天中大概三分之一的交易区间。一旦他发现了入场时机，他就会进入市场，然后在信号K线的上方设置一个止损订单，在止损位的两倍距离之外的可测量的移动距离或支撑区域设置盈利限价订单。因为他等待的是始终在场策略的入场时机，所以市场移动相等的距离的概率是百分之六十或者更多。如果他在标普500期货合约市场上承受了两个点位的风险时，那么在他设置的保护性止损位被触及之前，他至少会有百分之六十的概率获利两个点位。然而，当他承受了两个点位的风险时，他的盈利目标往往是四个点位或者更多，所以在始终在场策略的入场时机中，他盈利的概率至少有百分之五十。虽然这个概率从来都不是确定的，但是在他采取的这些入场时机中大部分还是超过百分之六十的。然而，像其他的交易者一样，我的朋友不愿意在一天的微型反转非常普遍的中间时段进行交易。所以当他不进行交易的时候，他在干什么呢？他一般会去干别的工作或者外出锻炼。当几个小时过后，他再次回到交易时，正好可以在一天的收盘处寻找始终在场策略的交易时机。","pid":"p788"},{"t":"para","text":"怎样在市场上有效地采取始终在场策略？因为当市场上有趋势或者至少存在潜在的趋势时，始终在场策略才有效。所以你应该在市场上寻找趋势较强或反转的信号。在本书的开头我们已经介绍过这些信号了（在介绍中）。他们出现的次数越多，你获利的概率就越大。最明显的信号就是出现了一波强劲的浪潮，特别是当它持续了好几根K线时最为明显。举个例子，如果市场在开盘时出现了一股强劲的反转上升浪，且在这个时点这波浪潮是由三根主体明显的牛市趋势K线组成，那么交易者就会在此处或在市场出现小幅回调时买入。他们不再等待市场出现回调，因为他们确信在接下来的几根K线处市场上涨到更高位置的概率要大于市场出现回调的概率。市场上的这种紧迫情绪是一个比较完美的实行始终在场策略的情况，如果你在此时还没有成为做多的一方，你也应该考虑至少以市价买入一小部分头寸，或者在这根K线的高点下方的几个点位处设置限价订单。你应该在这次入场信号K线的下方设置止损位。这假设意味着你必须冒8个点位的风险，而在平时你一般只冒2个点位的风险，那么你这次追涨交易的单量就只应该是你平时交易量的四分之一。在此时你必须考虑的是你要做多，即使只是做多一小部分头寸，因为你很确信市场会走得更高，如果你已经相信这一天是一个强劲的牛市趋势日，那么在市场没有出现明显或强劲的熊市反转信号之前，你应该至少保留一部分的头寸至收盘处。","pid":"p789"},{"t":"para","text":"对于股票，盈亏平衡点被触及的概率更小，所以在波段交易中更有利可图。通常来说，你可以在市场超你预期方向移动0.5%至1%的幅度时或者你的利润比你的初始风险高出两倍时，用三分之一至二分之一的仓位去采取刮头皮交易策略，来不断高抛低吸提高你的盈亏平衡点。如果市场看起来与你的持仓方向相反，但又尚未发生反转，比如看起来像是对一天中的高点的测试，此时你可以增加剩下的四分之一至三分之一的头寸去进行刮头皮交易，但是在你的盈亏平衡止损位被触及。或者有很明显且强劲的反转信号，或者在收盘之前，你都应该保留至少四分之一的头寸，因为市场的趋势往往比你想象中要更远。","pid":"p790"},{"t":"para","text":"在市场反复出现的回调中，你应该有足够的定力持有你的头寸，直到市场到达了你的目标价位。或者市场出现了明显的反转情况，或者你设置的保护性止损位被触及，你才应该离开市场。虽然有时候市场上的回调是比较剧烈的。但是也还是不足以触发始终在场策略的反转。所以你还是应该坚持原来的计划，不要因为一根与你的交易方向相反的大趋势K线的出现而感到恐慌。如果你的止损位被触发了，你应该及时离开市场，当市场再次出现相反方向的明显而强劲的入场时机时你才应该再次入场。如果市场上真的出现了这样的入场时机，那么你就应该重复前面所提到的操作。如果你的正常交易仓位是两手合约，那么当你正在买入一手合约时市场的反转模式触发了，你应该卖出三手合约。一手合约的卖出将让你离开你之前的做多仓位，而另外两手合约的卖出将使你进入新的相反方向的策略。你可以用第一手合约进行刮头皮交易。并将目标盈利位设置在目标止损位的两倍，然后你可以再用第二手合约进行波段交易。","pid":"p791"},{"t":"para","text":"使用这种方式的关键就在于，只有当市场出现了明显而强劲的入场信号时，你才采取入场或者反手的操作。如果没有出现这样强烈的信号时，那么你可以仅仅关注你的盈亏平衡点止损位是否被触及而不采取措施，虽然这可能会使得你在市场的震荡中失去曾经在波段交易中获得的收益。但如果你认真观察一篮子的股票，那么每一天都至少会有一只股票中产生可靠的入场时机让你进行波段交易。","pid":"p792"},{"t":"para","text":"在一天中的任何时刻，你都可以判断市场是否有明显的趋势，或者是否有明显的反转。在进行始终在场策略的交易时，你至少需要看到其中的一点或者两点。当市场上某一方向的力量占主导地位，则市场很可能会向那个方向发展。当你正好要进入那个市场时，你应该考虑一下你的保护性止损位应该设置在哪里，并且计算出你能承受几个价位的风险。按照一般的规律来说，市场的趋势很可能会持续前一波段相同幅度的价位，同时因为你相信市场上有趋势，所以成功的可能性会大于50%。如果你确信市场已经处于始终在场策略的情况中，那么成功的概率可能会大于60%。当市场的趋势还在持续时，你可以浮动设置你的保护性止损位，降低你的风险。同样，当市场已经按照趋势在你的入场价位上前进了好长一段距离，那么你也应该提高你最初的盈利目标，同时相对于这个盈利目标设置新的保护性止损位。这将导致你的盈利和风险重新被评估，此时你潜在的盈利概率要大于你的风险，且成功的概率大于50%。","pid":"p793"},{"t":"para","text":"正是因为在趋势中的顺势波段交易中从数学角度来说，交易的盈利风险比越来越高，所以这是一种非常好的交易模式，特别是对初学者来说。","pid":"p794"},{"t":"para","text":"经验丰富的交易者可以利用始终在场策略的方法在这个方向的趋势上进行刮头皮短线交易，但这需要你能够对趋势的强度判断有足够的信心。举个例子，如果交易者认为市场上出现了一股强劲的牛市趋势，那么基于最近的平均每日交易范围，那么他们可能会利用限价订单来进行做多的刮头皮交易。如果他们在交易标普500期货合约，而最近的平均每日交易范围是12至15个点位，在过去的几个小时里市场价格出现的最大回调只有2个点位，他们就可能会在市场出现1个点位的回调时买入一小部分头寸，在更低的1到2个点位买入更多头寸（是平均每日交易范围的10%至20%），之后可能会在更下方的几个点位处设置止损位。那如果过去的几个小时中出现的最大的回调是3个点位，那么他们可能会在市场下调3个点位时设置限价订单买入一部分头寸，在更下方的2至3个点位处买入更多的头寸，并在更下方的两个点位处设置止损位。如果市场突然进入了始终在场策略的做空方向，那么他们将会离场，然后寻找机会做空。入场方式我们在第二本中详细介绍了始终在场策略的交易也可以在趋势日或者震荡区间日变成可以盈利的波段交易方法。只要这个震荡日终有很多足够大的波段。","pid":"p795"},{"t":"img","src":"assets/img/p2c5_001.webp","ctx":[{"t":"正是因为在趋势中的顺势波段交易中从数学角度来说，交易的盈利风险比越来越高，所以这是一种非常好的交易模式，特别是对初学者来说。","p":"p794"},{"t":"经验丰富的交易者可以利用始终在场策略的方法在这个方向的趋势上进行刮头皮短线交易，但这需要你能够对趋势的强度判断有足够的信心。举个例子，如果交易者认为市场上出现了一股强劲的牛市趋势，那么基于最近的平均每日交易范围，那么他们可能会利用限价订单来进行做多的刮头皮交易。如果他们在交易标普500期货合约，而最近的平均每日交易范围是12至15个点位，在过去的几个小时里市场价格出现的最大回调只有2个点位，他们就可能会在市场出现1个点位的回调时买入一小部分头寸，在更低的1到2个点位买入更多头寸（是平均每日交易范围的10%至20%），之后可能会在更下方的几个点位处设置止损位。那如果过去的几个小时中出现的最大的回调是3个点位，那么他们可能会在市场下调3个点位时设置限价订单买入一部分头寸，在更下方的2至3个点位处买入更多的头寸，并在更下方的两个点位处设置止损位。如果市场突然进入了始终在场策略的做空方向，那么他们将会离场，然后寻找机会做空。入场方式我们在第二本中详细介绍了始终在场策略的交易也可以在趋势日或者震荡区间日变成可以盈利的波段交易方法。只要这个震荡日终有很多足够大的波段。","p":"p795"},{"t":"如图15.1所示，第一天是一个震荡日，始终在场策略可以净赚52个点位，或者大约是每合约600美元。第二天，市场经历了熊市开盘后演变成了趋势，然后进入了震荡区间。一个采取始终在场策略的交易者可以净赚79个点位，或者说每合约950美元。如果一个交易者有两手交易，一手用来做刮头皮交易，一手用来做波段交易，那么他每天可以成功地进行10次刮头皮交易，且每一份合约可以额外再赚取450美元。这听起来、看起来都很容易，但是操作起来却非常困难。","p":"p796"}]},{"t":"para","text":"如图15.1所示，第一天是一个震荡日，始终在场策略可以净赚52个点位，或者大约是每合约600美元。第二天，市场经历了熊市开盘后演变成了趋势，然后进入了震荡区间。一个采取始终在场策略的交易者可以净赚79个点位，或者说每合约950美元。如果一个交易者有两手交易，一手用来做刮头皮交易，一手用来做波段交易，那么他每天可以成功地进行10次刮头皮交易，且每一份合约可以额外再赚取450美元。这听起来、看起来都很容易，但是操作起来却非常困难。","pid":"p796"},{"t":"img","src":"assets/img/p2c5_002.webp","ctx":[{"t":"如图15.1所示，第一天是一个震荡日，始终在场策略可以净赚52个点位，或者大约是每合约600美元。第二天，市场经历了熊市开盘后演变成了趋势，然后进入了震荡区间。一个采取始终在场策略的交易者可以净赚79个点位，或者说每合约950美元。如果一个交易者有两手交易，一手用来做刮头皮交易，一手用来做波段交易，那么他每天可以成功地进行10次刮头皮交易，且每一份合约可以额外再赚取450美元。这听起来、看起来都很容易，但是操作起来却非常困难。","p":"p796"},{"t":"如图15.2的右方是一张5分钟的K线图。这张图上有81根K线，在大部分的交易者中会有超过20次的反转。对于不喜欢一直去判断始终在场策略的交易方向的交易者来说，他们可以通过在图表上减少K线的数量来减少他们做出判断的次数。在上面的三张图中，K线的数量都是一样的。在左上方的是15分钟的K线图，在左下方的图中每根K线包含了10000个最小成交价位。在这些时间跨度更大的图表中，市场反转的次数更少，但也有一些非常好的反转信号，也足够交易者进行交易了。因为这些K线更大，所以为了交易的更加顺利，相对来说止损位也应该设置的更大。为了使得暴露在风险中的美元数与在5分钟K线图中一样，交易的头寸应该更少一些。","p":"p797"}]},{"t":"para","text":"如图15.2的右方是一张5分钟的K线图。这张图上有81根K线，在大部分的交易者中会有超过20次的反转。对于不喜欢一直去判断始终在场策略的交易方向的交易者来说，他们可以通过在图表上减少K线的数量来减少他们做出判断的次数。在上面的三张图中，K线的数量都是一样的。在左上方的是15分钟的K线图，在左下方的图中每根K线包含了10000个最小成交价位。在这些时间跨度更大的图表中，市场反转的次数更少，但也有一些非常好的反转信号，也足够交易者进行交易了。因为这些K线更大，所以为了交易的更加顺利，相对来说止损位也应该设置的更大。为了使得暴露在风险中的美元数与在5分钟K线图中一样，交易的头寸应该更少一些。","pid":"p797"},{"t":"img","src":"assets/img/p2c5_003.webp","ctx":[{"t":"如图15.2的右方是一张5分钟的K线图。这张图上有81根K线，在大部分的交易者中会有超过20次的反转。对于不喜欢一直去判断始终在场策略的交易方向的交易者来说，他们可以通过在图表上减少K线的数量来减少他们做出判断的次数。在上面的三张图中，K线的数量都是一样的。在左上方的是15分钟的K线图，在左下方的图中每根K线包含了10000个最小成交价位。在这些时间跨度更大的图表中，市场反转的次数更少，但也有一些非常好的反转信号，也足够交易者进行交易了。因为这些K线更大，所以为了交易的更加顺利，相对来说止损位也应该设置的更大。为了使得暴露在风险中的美元数与在5分钟K线图中一样，交易的头寸应该更少一些。","p":"p797"},{"t":"如图15.3所示，市场上出现了一个较大的向上的缺口，紧随其后出现了一个强劲的熊市反转K线，所以那一天很有可能成为熊市趋势日。这是一个非常可靠的始终在场策略的做空入场时机。然而，交易者们都知道一旦市场上出现了一个较大的向上的缺口，那么在市场出现牛市突破之前，市场通常还是会下行一个小时左右。基于此、即使他们在现在的时刻做空了他们依然希望接下来会找机会反转做多。K线4是一根熊市趋势K线，但是它却有一个巨大的尾部，且之后出现的几根K线并没有延续熊市的走势。同样，在这一天中出现的第二根K线也是一根强劲的牛市K线而非熊市K线，在这里交易者会希望从这里开始寻找入场时机。市场的趋势看起来并不像出现了强劲的熊市趋势。许多交易者会在K线4之后出现的内含线的上方退出市场，然后等待第二个信号，但是从技术上看。市场还是处于始终在场策略的做空方向，因为市场上并没有出现明显的买入信号。之后市场上出现了两波非常小的上升浪，一直上升至K线5处。市场很可能正在努力与这一天中的第一根或者第二根K线一起形成一个双重顶部。你选择哪一根K线作为这个双重顶部的第一个顶部都可以，因为最终形成的双重顶部是一样的。有二些交易者会认为第一根K线是顶部，还有一些交易者会更倾向于第二根K线是顶部。在K线5之后的那根K线是一根熊市内含K线，同时也是市场上出现的第二个卖出信号，但是市场同样没有在这根K线之后形成强劲的熊市趋势。同样，做空交易者也会认识到这个问题。在这个点上，市场已经在狭窄的区间里运行了超过30分钟，特别是当市场同时遭遇了一个非常巨大的跳空开盘。那么市场现在已经在进入突破的模式了。","p":"p798"},{"t":"在市场进入突破模式时，交易者可以在这个区间的顶部上方一个点位处设置买入止损位，然后在这个区间的底部下方一个点位处设置卖出止损位。","p":"p799"},{"t":"K线7是在K线5形成的双重顶部和K线4和K线6形成的双重底部之后形成的牛市i模式。这种模式代表了市场的暂停。其实也是一种形式的市场回调，因为市场也正在形成双重顶部和双重底部的回调入场形态，所以这也可以看作是一个微型的突破模式。虽然也有交易者会在这个模式的突破中入场。但是大部分还是会等到这个开盘区间被突破后再入场。","p":"p800"},{"t":"在K线8之前的K线是一根强劲的牛市趋势K线，且其收盘价高于K线5的高点，许多交易者会在这个震荡高点的上方做多。K线8是一根更强劲的牛市趋势K线，同时也突破了开盘的震荡区间。在这个时点上，交易者看到在这个跳空开盘日的突破模式中出现了一个强劲的牛市突破，所以他们现在开始相信市场进入牛市趋势了。因为他们并不知道之后市场是否在短期会出现回调，面在此时他们又非常确信市场在长期很可能是上涨，所以他们很可能会在此时的市场买入：当然这也是正确的。市场上行的区间突破最近的平均日区间的可能性很大。而区间的突破主要是因为价格上涨得更高。刚入市场的新手通常会被市场突破的速度，以及需要的止损位的大小所惊吓。但是他们需要学会的是，先以一个较小的头寸进入市场。然后持有至市场上出现了一个强劲的卖出时机。比如说类似K线18这种最终旗形反转K线。如果他们在K线8的收盘价附近买入，理论上他们的保护性止损位应该设置在K线7的下方，这也是最近的一个更高的低点。如果这个止损位比他们经常使用的止损位要大出三倍，那么他们买入的头寸就应该是以前的三分之一。或者，如果他们愿意冒点风险，他们应该刚好在K线8的低点下方设置止损位，因为一个强劲的牛市突破很可能会接距而来。他们的止损位也很有可能被触及。一旦市场触及止损位后立刻反弹，他们可以在市场波动时再次买入。","p":"p801"},{"t":"K线9和K线10同样也是非常强劲的牛市趋势K线，所以他们也是买入高潮，连续的买入高潮之后通常会跟随一波较大的下跌浪。在接下来的几个小时中，K线变得越来越小，市场进入到一个狭窄的震荡区间，但是市场并没有回调至移动平均线上。K线13和15是市场的两波回调浪，但是做多交易者太激进了以至于他们将买入限价订单设置在移动平均线上方的几个价位处。他们很害怕市场不会回到移动平均线上，从而他们的买入限价订单不会被触及。这也是一个强劲的牛市市场信号。然而，只要在一个强劲的牛市趋势中出现了向下的市场调整浪，那么它就会突破牛市趋势线，并演变成一个最终旗形，正如这里所示。这使得做多交易者快速获利。K线11，13，15是在一个狭窄的震荡区间中出现的三波下推浪，所以这可以被看成是一个三角形或者一个楔形牛市旗形。","p":"p802"},{"t":"在市场上出现了向下突破震荡区间的连续的熊市趋势K线还不足以使得交易者确信始终在场策略的方向已经变成做空方向了。在K线12后面出现的两根较小的熊市趋势K线突破了这个狭窄的震荡区间，而在这之前并没有出现支撑熊市的力量。交易者并没有做空，反而他们在寻找一波能够回到移动平均线的有20根缺口K线的回调买入时机。向下突破了K线14的较低的高点的3根熊市趋势K线并没有带来显著的熊市下跌浪，所以做多交易者依然会在市场出现的第一波回到移动平均线的回调浪中寻找买入时机。因为市场上没有显著的卖出压力和强劲的熊市趋势带来这波回调浪。所以交易者依然相信此时市场上的始终在场策略的方向还是做多，所以他们在K线15处出现的两浪模式的横向盘整中买入。","p":"p803"},{"t":"K线17是另外一个强劲的牛市突破，因此也是一波上升浪以及高潮，但是因为它可能会成为一个最终旗形的突破，所以它很可能会失败，并紧随趋势反转。做多交易者和做空交易者都在这个持续了20根K线以上的趋势中寻找强劲的牛市趋势K线，特别是如图中发生的那样，这波上升浪已经超过了一个潜在的最终旗形的时候，他们更是如此。交易者把这根强劲的牛市趋势K线看作是一个高潮，并且怀疑市场上可能很快就会出现调整。基于此，交易者开始卖出头寸。做多交易者卖出他们的做多头寸开始获利，而做空交易者则开始卖出获得新的卖出头寸。他们在这根K线的收盘或收盘处的高点上方，或者在紧随其后的小型K线上（特别是当这根K线有一个熊市收盘），或者在前一根K线的低点下方卖出。不论是做多交易者还是做空交易者都希望市场上会出现一波至少持续10根K线的两浪下跌，也许这波下跌浪可以测试潜在的最后旗形形成的底部，也就是K线15的底部。如果市场下跌得很厉害，那么做多交易者和做空交易者都会等待时机买入。如果市场上出现的只是一个简单的两浪调整，并且很有可能反弹，那么做多交易者和做空交易者都会买入，此时做多交易者将会买入新的做多头寸，而做空交易者将会通过做多获利。此时，K线14后面出现的一系列熊市K线可能会带来更低的买入价格，但是已经没有必要再买入了。","p":"p804"},{"t":"K线18是那一天中出现的第三波上推浪（K线3和K线12是最初的两波上推浪），同时也是一个潜在的最后旗形反转，在这之前先是K线11和K线16形成了一个震荡区间。同时也与K线17买入高潮后出现的两根小K线形成了一个三角形。当然K线18也可以看作是由K线14和K线17作为前两波上推浪的第三次上推浪。市场通常会在太平洋标准时间上午10：30和11：00之间产生回调，这波回调一般会在上午11：30结束。此外，市场在这一天中都没有触及移动平均线，虽然在K线15处差一点触及了。下一波回调可能会更大，通常来说在上午11：00之后出现的第二波回调会更大。而如果这波回调如此接近移动平均线，不得不让人觉得这次回调肯定会穿过移动平均线，至少会稍微穿过一点。种种迹象都让经验丰富的交易者不得不怀疑市场上强劲的牛市趋势是不是要转变为震荡区间了。因为在K线15处产生的三角形打破了在K线6至K线12的牛市趋势中形成的陡峭的趋势线，同时K线18又是一个潜在的更高的高点趋势反转，所以这波回调很有可能会走得更远更深，甚至转变为熊市趋势。很多交易者会在K线18的高点处形成的两根K线的反转下方平仓获利，然后他们如果在市场收盘前看到一个至少两浪，持续10根K线且能触及移动平均线的市场反弹，他们将会再次这个时点再次买入。","p":"p805"},{"t":"K线19是一根强劲的下跌K线，它警告交易者市场在出现回调后很可能会进入一个熊市通道。许多交易者会在这个最后旗形的顶部转而做空，但是因为市场在这一整天都没有触及移动平均线，所以在移动平均线上很可能会出现20根可以做多的跳空阳线。正因为如此。目前为止始终在场策略的方向还是做多。做多交易者认为下一根K线不太可能再出现熊市K线，所以他们在这根K线的收盘处买入。许多尝试反转始终在场策略的方向的努力都失败了，特别是在这样一个强劲的趋势中更容易失败。","p":"p806"},{"t":"在移动平均线上，K线23是一个双重顶部的做多入场时机，但是之后却变成了一个反转向下的两根K线的反转形态中的第一根K线。一旦市场突破了K线24的下方，那么对于大部分交易者来说，始终在场策略的方向立刻转为做空。这是一个牛市陷阱以及是一个微型的最终旗形顶部（一个最终旗形的突破可以是一个更低的高点）。在K线25之后的那根K线是第一个移动平均线的向上跳空缺口K线做多入场时机，但是现在的趋势已经开始转而向下了。市场上出现了一个强劲的牛市趋势K线，但是这根K线的失败并不在于没有突破这个震荡区域的顶部，而是在于这根K线之后缺乏后续的跟进力量，在这根K线后面出现了一个在移动平均线上的回调。这也是一次卖空入场时机，当市场继续下跌时，这个卖空时机会出现在K线26或者其低点的下方（在熊市K线的下方卖空也就是在移动平均线的下方测试移动平均线，这是一个非常可靠的交易策略）。","p":"p807"},{"t":"一直到K线27，市场都显然一直是处于始终在场策略的做空方向，所以市场上的交易者直到收盘也一直都保持着做空的方向。风险控制经理也一直走在这条路上并不断地警告他们手下的交易者要抛售手中的多头头寸。交易者非常痛恨这一点，因为他们一直抱有牛市趋势会恢复、从而从困境解脱出来的希望，但是他们的上司却不允许他们再等待了他们和风险控制经理都会从业绩中得到回报，但是作为交易者。他们对于失去的做多头寸是有感情的，而作为风险控制经理是无法感知的，且他们的职责就是当止损有意义的时候就要接受损失。当然上司一般也是正确的，我们可以看到结果是直到收盘市场上依然是一个熊市趋势。当感知市场上的动能而进行卖出的程序化交易已经察觉到市场上强劲的趋势从而加人卖空时，随着市场上下跌的动能的持续，市场下跌的趋势就会被进一步加强。","p":"p808"},{"t":"在K线6和K线12的反弹浪中出现的最大的回调也不过就是几个点位而已。经验丰富的交易者很可能会在把限价订单设置在一到两个点位的回调处，然后再在更低的一到两个点位处追加限价订单，他们的止损位设置在入场价位下方两到三个点的位置。如果市场已经转变成始终在场策略的做空方向，他们就将离开他们的做多方向，并寻找做空的时机。如果交易者在市场出现了一个点位的回调时买入了一个合约，之后在市场继续下跌一个点位时又新买入了一个合约，他们将会在K线13处拥有两个合约的头寸。他们可以将他们的保护性止损位设置在更低的两到三个点位处，或者在移动平均线下方的几个点位处。因为市场正处于牛市趋势中，所以他们希望至少出现一次测试市场高点的机会，这样当市场走向新高的时候他们可以在第一个合约处获得一个点位的盈利，之后他们可以选择在四个点位之上设置一个退出第二个合约头寸的限价订单（这大概是他们入场时最初的风险的两倍），也可以选择在K线18附近退出第二个合约头寸，因为在K线18附近市场可能会在K线12和K线16形成的潜在的最终旗形之后再次形成一个最终旗形反转。","p":"p809"},{"t":"交易者应该在一天较早的时候寻找始终在场策略的交易时机，因为这些时机通常会演变为波段交易时机。而且，有时候一根单独的强劲的趋势K线就足以让大部分的交易者相信，市场已经开始建立起始终在场策略的方向了。","p":"p810"}]},{"t":"para","text":"如图15.3所示，市场上出现了一个较大的向上的缺口，紧随其后出现了一个强劲的熊市反转K线，所以那一天很有可能成为熊市趋势日。这是一个非常可靠的始终在场策略的做空入场时机。然而，交易者们都知道一旦市场上出现了一个较大的向上的缺口，那么在市场出现牛市突破之前，市场通常还是会下行一个小时左右。基于此、即使他们在现在的时刻做空了他们依然希望接下来会找机会反转做多。K线4是一根熊市趋势K线，但是它却有一个巨大的尾部，且之后出现的几根K线并没有延续熊市的走势。同样，在这一天中出现的第二根K线也是一根强劲的牛市K线而非熊市K线，在这里交易者会希望从这里开始寻找入场时机。市场的趋势看起来并不像出现了强劲的熊市趋势。许多交易者会在K线4之后出现的内含线的上方退出市场，然后等待第二个信号，但是从技术上看。市场还是处于始终在场策略的做空方向，因为市场上并没有出现明显的买入信号。之后市场上出现了两波非常小的上升浪，一直上升至K线5处。市场很可能正在努力与这一天中的第一根或者第二根K线一起形成一个双重顶部。你选择哪一根K线作为这个双重顶部的第一个顶部都可以，因为最终形成的双重顶部是一样的。有二些交易者会认为第一根K线是顶部，还有一些交易者会更倾向于第二根K线是顶部。在K线5之后的那根K线是一根熊市内含K线，同时也是市场上出现的第二个卖出信号，但是市场同样没有在这根K线之后形成强劲的熊市趋势。同样，做空交易者也会认识到这个问题。在这个点上，市场已经在狭窄的区间里运行了超过30分钟，特别是当市场同时遭遇了一个非常巨大的跳空开盘。那么市场现在已经在进入突破的模式了。","pid":"p798"},{"t":"para","text":"在市场进入突破模式时，交易者可以在这个区间的顶部上方一个点位处设置买入止损位，然后在这个区间的底部下方一个点位处设置卖出止损位。","pid":"p799"},{"t":"para","text":"K线7是在K线5形成的双重顶部和K线4和K线6形成的双重底部之后形成的牛市i模式。这种模式代表了市场的暂停。其实也是一种形式的市场回调，因为市场也正在形成双重顶部和双重底部的回调入场形态，所以这也可以看作是一个微型的突破模式。虽然也有交易者会在这个模式的突破中入场。但是大部分还是会等到这个开盘区间被突破后再入场。","pid":"p800"},{"t":"para","text":"在K线8之前的K线是一根强劲的牛市趋势K线，且其收盘价高于K线5的高点，许多交易者会在这个震荡高点的上方做多。K线8是一根更强劲的牛市趋势K线，同时也突破了开盘的震荡区间。在这个时点上，交易者看到在这个跳空开盘日的突破模式中出现了一个强劲的牛市突破，所以他们现在开始相信市场进入牛市趋势了。因为他们并不知道之后市场是否在短期会出现回调，面在此时他们又非常确信市场在长期很可能是上涨，所以他们很可能会在此时的市场买入：当然这也是正确的。市场上行的区间突破最近的平均日区间的可能性很大。而区间的突破主要是因为价格上涨得更高。刚入市场的新手通常会被市场突破的速度，以及需要的止损位的大小所惊吓。但是他们需要学会的是，先以一个较小的头寸进入市场。然后持有至市场上出现了一个强劲的卖出时机。比如说类似K线18这种最终旗形反转K线。如果他们在K线8的收盘价附近买入，理论上他们的保护性止损位应该设置在K线7的下方，这也是最近的一个更高的低点。如果这个止损位比他们经常使用的止损位要大出三倍，那么他们买入的头寸就应该是以前的三分之一。或者，如果他们愿意冒点风险，他们应该刚好在K线8的低点下方设置止损位，因为一个强劲的牛市突破很可能会接距而来。他们的止损位也很有可能被触及。一旦市场触及止损位后立刻反弹，他们可以在市场波动时再次买入。","pid":"p801"},{"t":"para","text":"K线9和K线10同样也是非常强劲的牛市趋势K线，所以他们也是买入高潮，连续的买入高潮之后通常会跟随一波较大的下跌浪。在接下来的几个小时中，K线变得越来越小，市场进入到一个狭窄的震荡区间，但是市场并没有回调至移动平均线上。K线13和15是市场的两波回调浪，但是做多交易者太激进了以至于他们将买入限价订单设置在移动平均线上方的几个价位处。他们很害怕市场不会回到移动平均线上，从而他们的买入限价订单不会被触及。这也是一个强劲的牛市市场信号。然而，只要在一个强劲的牛市趋势中出现了向下的市场调整浪，那么它就会突破牛市趋势线，并演变成一个最终旗形，正如这里所示。这使得做多交易者快速获利。K线11，13，15是在一个狭窄的震荡区间中出现的三波下推浪，所以这可以被看成是一个三角形或者一个楔形牛市旗形。","pid":"p802"},{"t":"para","text":"在市场上出现了向下突破震荡区间的连续的熊市趋势K线还不足以使得交易者确信始终在场策略的方向已经变成做空方向了。在K线12后面出现的两根较小的熊市趋势K线突破了这个狭窄的震荡区间，而在这之前并没有出现支撑熊市的力量。交易者并没有做空，反而他们在寻找一波能够回到移动平均线的有20根缺口K线的回调买入时机。向下突破了K线14的较低的高点的3根熊市趋势K线并没有带来显著的熊市下跌浪，所以做多交易者依然会在市场出现的第一波回到移动平均线的回调浪中寻找买入时机。因为市场上没有显著的卖出压力和强劲的熊市趋势带来这波回调浪。所以交易者依然相信此时市场上的始终在场策略的方向还是做多，所以他们在K线15处出现的两浪模式的横向盘整中买入。","pid":"p803"},{"t":"para","text":"K线17是另外一个强劲的牛市突破，因此也是一波上升浪以及高潮，但是因为它可能会成为一个最终旗形的突破，所以它很可能会失败，并紧随趋势反转。做多交易者和做空交易者都在这个持续了20根K线以上的趋势中寻找强劲的牛市趋势K线，特别是如图中发生的那样，这波上升浪已经超过了一个潜在的最终旗形的时候，他们更是如此。交易者把这根强劲的牛市趋势K线看作是一个高潮，并且怀疑市场上可能很快就会出现调整。基于此，交易者开始卖出头寸。做多交易者卖出他们的做多头寸开始获利，而做空交易者则开始卖出获得新的卖出头寸。他们在这根K线的收盘或收盘处的高点上方，或者在紧随其后的小型K线上（特别是当这根K线有一个熊市收盘），或者在前一根K线的低点下方卖出。不论是做多交易者还是做空交易者都希望市场上会出现一波至少持续10根K线的两浪下跌，也许这波下跌浪可以测试潜在的最后旗形形成的底部，也就是K线15的底部。如果市场下跌得很厉害，那么做多交易者和做空交易者都会等待时机买入。如果市场上出现的只是一个简单的两浪调整，并且很有可能反弹，那么做多交易者和做空交易者都会买入，此时做多交易者将会买入新的做多头寸，而做空交易者将会通过做多获利。此时，K线14后面出现的一系列熊市K线可能会带来更低的买入价格，但是已经没有必要再买入了。","pid":"p804"},{"t":"para","text":"K线18是那一天中出现的第三波上推浪（K线3和K线12是最初的两波上推浪），同时也是一个潜在的最后旗形反转，在这之前先是K线11和K线16形成了一个震荡区间。同时也与K线17买入高潮后出现的两根小K线形成了一个三角形。当然K线18也可以看作是由K线14和K线17作为前两波上推浪的第三次上推浪。市场通常会在太平洋标准时间上午10：30和11：00之间产生回调，这波回调一般会在上午11：30结束。此外，市场在这一天中都没有触及移动平均线，虽然在K线15处差一点触及了。下一波回调可能会更大，通常来说在上午11：00之后出现的第二波回调会更大。而如果这波回调如此接近移动平均线，不得不让人觉得这次回调肯定会穿过移动平均线，至少会稍微穿过一点。种种迹象都让经验丰富的交易者不得不怀疑市场上强劲的牛市趋势是不是要转变为震荡区间了。因为在K线15处产生的三角形打破了在K线6至K线12的牛市趋势中形成的陡峭的趋势线，同时K线18又是一个潜在的更高的高点趋势反转，所以这波回调很有可能会走得更远更深，甚至转变为熊市趋势。很多交易者会在K线18的高点处形成的两根K线的反转下方平仓获利，然后他们如果在市场收盘前看到一个至少两浪，持续10根K线且能触及移动平均线的市场反弹，他们将会再次这个时点再次买入。","pid":"p805"},{"t":"para","text":"K线19是一根强劲的下跌K线，它警告交易者市场在出现回调后很可能会进入一个熊市通道。许多交易者会在这个最后旗形的顶部转而做空，但是因为市场在这一整天都没有触及移动平均线，所以在移动平均线上很可能会出现20根可以做多的跳空阳线。正因为如此。目前为止始终在场策略的方向还是做多。做多交易者认为下一根K线不太可能再出现熊市K线，所以他们在这根K线的收盘处买入。许多尝试反转始终在场策略的方向的努力都失败了，特别是在这样一个强劲的趋势中更容易失败。","pid":"p806"},{"t":"para","text":"在移动平均线上，K线23是一个双重顶部的做多入场时机，但是之后却变成了一个反转向下的两根K线的反转形态中的第一根K线。一旦市场突破了K线24的下方，那么对于大部分交易者来说，始终在场策略的方向立刻转为做空。这是一个牛市陷阱以及是一个微型的最终旗形顶部（一个最终旗形的突破可以是一个更低的高点）。在K线25之后的那根K线是第一个移动平均线的向上跳空缺口K线做多入场时机，但是现在的趋势已经开始转而向下了。市场上出现了一个强劲的牛市趋势K线，但是这根K线的失败并不在于没有突破这个震荡区域的顶部，而是在于这根K线之后缺乏后续的跟进力量，在这根K线后面出现了一个在移动平均线上的回调。这也是一次卖空入场时机，当市场继续下跌时，这个卖空时机会出现在K线26或者其低点的下方（在熊市K线的下方卖空也就是在移动平均线的下方测试移动平均线，这是一个非常可靠的交易策略）。","pid":"p807"},{"t":"para","text":"一直到K线27，市场都显然一直是处于始终在场策略的做空方向，所以市场上的交易者直到收盘也一直都保持着做空的方向。风险控制经理也一直走在这条路上并不断地警告他们手下的交易者要抛售手中的多头头寸。交易者非常痛恨这一点，因为他们一直抱有牛市趋势会恢复、从而从困境解脱出来的希望，但是他们的上司却不允许他们再等待了他们和风险控制经理都会从业绩中得到回报，但是作为交易者。他们对于失去的做多头寸是有感情的，而作为风险控制经理是无法感知的，且他们的职责就是当止损有意义的时候就要接受损失。当然上司一般也是正确的，我们可以看到结果是直到收盘市场上依然是一个熊市趋势。当感知市场上的动能而进行卖出的程序化交易已经察觉到市场上强劲的趋势从而加人卖空时，随着市场上下跌的动能的持续，市场下跌的趋势就会被进一步加强。","pid":"p808"},{"t":"para","text":"在K线6和K线12的反弹浪中出现的最大的回调也不过就是几个点位而已。经验丰富的交易者很可能会在把限价订单设置在一到两个点位的回调处，然后再在更低的一到两个点位处追加限价订单，他们的止损位设置在入场价位下方两到三个点的位置。如果市场已经转变成始终在场策略的做空方向，他们就将离开他们的做多方向，并寻找做空的时机。如果交易者在市场出现了一个点位的回调时买入了一个合约，之后在市场继续下跌一个点位时又新买入了一个合约，他们将会在K线13处拥有两个合约的头寸。他们可以将他们的保护性止损位设置在更低的两到三个点位处，或者在移动平均线下方的几个点位处。因为市场正处于牛市趋势中，所以他们希望至少出现一次测试市场高点的机会，这样当市场走向新高的时候他们可以在第一个合约处获得一个点位的盈利，之后他们可以选择在四个点位之上设置一个退出第二个合约头寸的限价订单（这大概是他们入场时最初的风险的两倍），也可以选择在K线18附近退出第二个合约头寸，因为在K线18附近市场可能会在K线12和K线16形成的潜在的最终旗形之后再次形成一个最终旗形反转。","pid":"p809"},{"t":"para","text":"交易者应该在一天较早的时候寻找始终在场策略的交易时机，因为这些时机通常会演变为波段交易时机。而且，有时候一根单独的强劲的趋势K线就足以让大部分的交易者相信，市场已经开始建立起始终在场策略的方向了。","pid":"p810"},{"t":"img","src":"assets/img/p2c5_004.webp","ctx":[{"t":"在K线6和K线12的反弹浪中出现的最大的回调也不过就是几个点位而已。经验丰富的交易者很可能会在把限价订单设置在一到两个点位的回调处，然后再在更低的一到两个点位处追加限价订单，他们的止损位设置在入场价位下方两到三个点的位置。如果市场已经转变成始终在场策略的做空方向，他们就将离开他们的做多方向，并寻找做空的时机。如果交易者在市场出现了一个点位的回调时买入了一个合约，之后在市场继续下跌一个点位时又新买入了一个合约，他们将会在K线13处拥有两个合约的头寸。他们可以将他们的保护性止损位设置在更低的两到三个点位处，或者在移动平均线下方的几个点位处。因为市场正处于牛市趋势中，所以他们希望至少出现一次测试市场高点的机会，这样当市场走向新高的时候他们可以在第一个合约处获得一个点位的盈利，之后他们可以选择在四个点位之上设置一个退出第二个合约头寸的限价订单（这大概是他们入场时最初的风险的两倍），也可以选择在K线18附近退出第二个合约头寸，因为在K线18附近市场可能会在K线12和K线16形成的潜在的最终旗形之后再次形成一个最终旗形反转。","p":"p809"},{"t":"交易者应该在一天较早的时候寻找始终在场策略的交易时机，因为这些时机通常会演变为波段交易时机。而且，有时候一根单独的强劲的趋势K线就足以让大部分的交易者相信，市场已经开始建立起始终在场策略的方向了。","p":"p810"},{"t":"在图15.4中，K线3这根强劲的熊市外包K线，在牛市通道的上方反转了趋势，这使得大部分的交易者相信还会有后续的支撑力量，所以始终在场策略的方向目前是做空。在一根强劲的牛市趋势K线后面出现了一根强劲的熊市线，这足以证明市场已经到达了一天的高点，并且趋势已经开始转为熊市趋势了。","p":"p811"},{"t":"在图中苹果的股票图中，在K线1处出现了一次缺口测试。在向下突破了熊市趋势通道线并触及了一天中的新低之后。K线1是一根强劲的反转而上的反转K线。这是在一个非常好的波段做多的时机，并且在收盘时可以净盈利大概4美元。向上的缺口也带来了强劲的趋势，市场回调至K线1后立刻形成了上升的趋势通道，一直到K线3处触顶。许多交易者认为始终在场策略在K线1的上方已经变成了做多的方向，还有一些交易者是在之后出现了两根牛市趋势K线后才得出这个结论。这5根K线组成的牛市趋势抵消了之前下跌至K线1的低点处的5根K线组成的熊市趋势。这是一个高潮反转，同时也有很大的概率会出现第二波上升浪。","p":"p812"},{"t":"持续至K线7处的4根K线的牛市趋势非常强劲。但是下跌至K线6处的4根K线的熊市趋势看起来还要更强劲些。许多交易者认为始终在场策略的方向还是做空，在他们转变方向为做多之前，他们会希望看到一个更高的低点或者一个更低的低点的回调。","p":"p813"},{"t":"K线8是在一个楔形牛市旗形中出现的反转上升K线，同时也是高于K线1的更高的高点。如果你仅仅只是退出你的做空头寸，而不是转而做多，那么你会得到2.40美元的净盈利。当市场在K线8处开始上升时，许多交易者认为市场上始终在场策略的方向开始做多了，而更多的交易者确信紧随其后会出现一根牛市趋势K线。在K线7之前的牛市上升浪就是买入压力出现的信号，同时在这个市场第二次尝试反转向上的时点。使得做多交易者对于做多更为自信了。","p":"p814"},{"t":"当市场上需要再多一根K线来转变始终在场策略的方向时，交易者通常会忽略市场的移动，并且希望那根K线不会出现。举个例子，如果K线5是一根强劲的牛市趋势K线，那么许多交易者会将他们的始终在场策略的方向由做空转向做多（在K线3开始出现了5根下跌K线后，许多交易者认为市场上的始终在场策略的方向已经转为做空了）。因为他们知道大部分反转市场方向的尝试都会失败，他们会在K线5之前的那根牛市趋势K线的收盘处卖空，并且期待K线5不会变成一根强劲的牛市K线，然后熊市趋势会复苏。","p":"p815"},{"t":"当交易者对接下来的几根K线的方向非常确信时，那么就有很大的机会进行交易。","p":"p816"}]},{"t":"para","text":"在图15.4中，K线3这根强劲的熊市外包K线，在牛市通道的上方反转了趋势，这使得大部分的交易者相信还会有后续的支撑力量，所以始终在场策略的方向目前是做空。在一根强劲的牛市趋势K线后面出现了一根强劲的熊市线，这足以证明市场已经到达了一天的高点，并且趋势已经开始转为熊市趋势了。","pid":"p811"},{"t":"para","text":"在图中苹果的股票图中，在K线1处出现了一次缺口测试。在向下突破了熊市趋势通道线并触及了一天中的新低之后。K线1是一根强劲的反转而上的反转K线。这是在一个非常好的波段做多的时机，并且在收盘时可以净盈利大概4美元。向上的缺口也带来了强劲的趋势，市场回调至K线1后立刻形成了上升的趋势通道，一直到K线3处触顶。许多交易者认为始终在场策略在K线1的上方已经变成了做多的方向，还有一些交易者是在之后出现了两根牛市趋势K线后才得出这个结论。这5根K线组成的牛市趋势抵消了之前下跌至K线1的低点处的5根K线组成的熊市趋势。这是一个高潮反转，同时也有很大的概率会出现第二波上升浪。","pid":"p812"},{"t":"para","text":"持续至K线7处的4根K线的牛市趋势非常强劲。但是下跌至K线6处的4根K线的熊市趋势看起来还要更强劲些。许多交易者认为始终在场策略的方向还是做空，在他们转变方向为做多之前，他们会希望看到一个更高的低点或者一个更低的低点的回调。","pid":"p813"},{"t":"para","text":"K线8是在一个楔形牛市旗形中出现的反转上升K线，同时也是高于K线
