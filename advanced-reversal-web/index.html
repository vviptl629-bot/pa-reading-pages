跟随在第二个反弹之后，而第二个反弹足够强势向上突破前一个波段高点，并总是突破一些关键的下跌趋势线。如果我们画一条包含三角形中第二个下降小波段的下跌趋势线，从第二次下推开始的这第二个反弹最低程度可以向上突破这条下跌趋势线，因此第三次下推是一个更低低点的主要趋势反转做多入场形态。涨至第一个或第二个小波段的反弹通常也能突破另外一些主要的下跌趋势线。","p":"p463"},{"t":"熊市中的扩张三角形底，后来往往演变成扩张三角形下降旗形。","p":"p464"},{"t":"在图6.1中，电子迷你期货跳空高开，并在K线6处回调测试移动平均线以及昨天收盘价。形成开盘反转的态势，然后价格一路快速上行。昨日低点在K线5处与K线1、2、3、4构成一个扩张三角形底。这是一个反转形态，三角形之前的趋势是向下的。扩张三角形的首个目标如K线7所示是到达一个波段高点。然后市场通常试着形成一个扩张三角形下降旗形，由于该扩张三角形处于熊市的震荡区间里，因此是一个持续整理形态。行情在K线7处击穿上涨趋势通道线，完成了这个下降旗形（该三角形由K线2、3、4、5和7构成）。在趋势通道线突破失败后，尤其当前处于扩张三角形时，行情通常走出两个回合的下降小波段。顺便提一句，扩张三角形不一定拥有完美的形状，价格也不一定会触及三角形两边的趋势通道线（如K线5未跌到位）。","p":"p465"},{"t":"涨至K线7这波反弹非常强势，但在这种情况下，其形成的震荡区间顶部的低点2做空信号值得我们入场一试。K线8是连续两天出现的第二个十字星，十字星代表着多空双方势均力敌。由于双方处于均衡状态，这个平衡点常常是下跌行情的中点，根据这一点我们可以大概估算出市场还能下跌多大的空间，直至碰到足够的多头力量使价格重新上扬。市场在K线9处达到目标价位，并在K线10处击穿下跌趋势通道线然后反转上行，K线10为楔形上升旗形信号K线。K线6是一根做多的信号K线，K线10也是对在K线6上方入场的一次精准的测试（一次完美的突破测试）。","p":"p466"},{"t":"在扩张三角形反转形态中，低点越来越低，高点越来越高。一般来说，市场在反转前会发生五次转向，有时候是七次，","p":"p467"}]},{"t":"para","text":"在图6.1中，电子迷你期货跳空高开，并在K线6处回调测试移动平均线以及昨天收盘价。形成开盘反转的态势，然后价格一路快速上行。昨日低点在K线5处与K线1、2、3、4构成一个扩张三角形底。这是一个反转形态，三角形之前的趋势是向下的。扩张三角形的首个目标如K线7所示是到达一个波段高点。然后市场通常试着形成一个扩张三角形下降旗形，由于该扩张三角形处于熊市的震荡区间里，因此是一个持续整理形态。行情在K线7处击穿上涨趋势通道线，完成了这个下降旗形（该三角形由K线2、3、4、5和7构成）。在趋势通道线突破失败后，尤其当前处于扩张三角形时，行情通常走出两个回合的下降小波段。顺便提一句，扩张三角形不一定拥有完美的形状，价格也不一定会触及三角形两边的趋势通道线（如K线5未跌到位）。","pid":"p465"},{"t":"para","text":"涨至K线7这波反弹非常强势，但在这种情况下，其形成的震荡区间顶部的低点2做空信号值得我们入场一试。K线8是连续两天出现的第二个十字星，十字星代表着多空双方势均力敌。由于双方处于均衡状态，这个平衡点常常是下跌行情的中点，根据这一点我们可以大概估算出市场还能下跌多大的空间，直至碰到足够的多头力量使价格重新上扬。市场在K线9处达到目标价位，并在K线10处击穿下跌趋势通道线然后反转上行，K线10为楔形上升旗形信号K线。K线6是一根做多的信号K线，K线10也是对在K线6上方入场的一次精准的测试（一次完美的突破测试）。","pid":"p466"},{"t":"para","text":"在扩张三角形反转形态中，低点越来越低，高点越来越高。一般来说，市场在反转前会发生五次转向，有时候是七次，","pid":"p467"},{"t":"img","src":"assets/img/p1c6_002.webp","ctx":[{"t":"涨至K线7这波反弹非常强势，但在这种情况下，其形成的震荡区间顶部的低点2做空信号值得我们入场一试。K线8是连续两天出现的第二个十字星，十字星代表着多空双方势均力敌。由于双方处于均衡状态，这个平衡点常常是下跌行情的中点，根据这一点我们可以大概估算出市场还能下跌多大的空间，直至碰到足够的多头力量使价格重新上扬。市场在K线9处达到目标价位，并在K线10处击穿下跌趋势通道线然后反转上行，K线10为楔形上升旗形信号K线。K线6是一根做多的信号K线，K线10也是对在K线6上方入场的一次精准的测试（一次完美的突破测试）。","p":"p466"},{"t":"在扩张三角形反转形态中，低点越来越低，高点越来越高。一般来说，市场在反转前会发生五次转向，有时候是七次，","p":"p467"},{"t":"如图6.2所示SPY的5分钟图。这期间我们有理由在每一个小波段上都做一次刮头皮交易（例如每一个小波段都在震荡区间中产生一个波段高点或低点），可是一旦第五个小波段结束，一波更大规模的趋势即将启动，我们应该从刮头皮交易转向波段化交易。另外，一旦形态完成，行情通常都会形成一个反向的扩张三角形。如果第一个三角形是反转形态，那么该形态的下一个阶段（将与第一个三角形反向）发展下去则是一个持续整理形态，反之亦然","p":"p468"},{"t":"K线5为第五个小波段（K线1是第一个小波段），是一个做多入场形态，预期行情至少走出两个回合的上升小波段。然而，K线6是二个突破失败的做空入场形态，一个小级别楔形（它是上升通道内以K线5上升尖形为起点的小型三浪推进模式中的第三推）。这里构成了扩张三角形下降旗形，以K线2为五个波段中的第一段。","p":"p469"},{"t":"在K线8处的第七个小波段为二次入场机会。K线7走出新低，是第一个入场条件，但以失败告终，这也是意料之中的事，因为这期间行情处于一个铁丝网形态，大多数交易员会等待二次信号。K线8也是以K线6急速下跌为起点的小型下降通道内的高点3做多入场形态，第三次下推往往预示着尖形通道下跌趋势形态的完结。","p":"p470"},{"t":"K线10试探了K线8的低点，但K线10的低点比K线8的低点高了一个价位。它近似于扩张三角形的第九个小波段（近似形态就足够用于我们的交易中）。作为试探昨日低点的双重底，以及震荡区间底部高点2的做多入场形态，K线10是一个不错的开盘反转做多入场形态","p":"p471"},{"t":"K线11是价格超越开盘高点后的一次突破回调，不过它并没有向上突破三角形中K线9的高点。由五根K线组成的强势升展现了一轮可能的上涨趋势，在这之后K线11成为高点1买点，因此是一个可靠的做多入场形态。","p":"p472"},{"t":"K线12是扩张三角形顶部的一个低点2（扩张三角形也是一种震荡区间），在这张SPY图表上是一次仅向下突破一个价位的失败突破。但是电子迷你期货的价格（图表未给出）一直都保持在反转K线的低点之上，并没有触发该形态。电子迷你期货会给出少数虚假信号，这是因为电子迷你期货的第一跳相当于SPY现货的2.5个最小变动价位。由于此时上涨势头强劲。新的一轮牛市正在成型之中，交易员们在考虑做空之前会继续观望，看是否出现一个更低的高点。。","p":"p473"},{"t":"K线13是在向上突破K线9失败后第二次做空入场机会，但由于在早前的反弹过程中并没有突破趋势线，因此在空头力量缺失的情况下做空是不明智的。空头应该在做空之前等待一个更低高点的到来。","p":"p474"},{"t":"K线12和13并不是突破失败，而是新一轮牛市中的突破回调。","p":"p475"}]},{"t":"para","text":"如图6.2所示SPY的5分钟图。这期间我们有理由在每一个小波段上都做一次刮头皮交易（例如每一个小波段都在震荡区间中产生一个波段高点或低点），可是一旦第五个小波段结束，一波更大规模的趋势即将启动，我们应该从刮头皮交易转向波段化交易。另外，一旦形态完成，行情通常都会形成一个反向的扩张三角形。如果第一个三角形是反转形态，那么该形态的下一个阶段（将与第一个三角形反向）发展下去则是一个持续整理形态，反之亦然","pid":"p468"},{"t":"para","text":"K线5为第五个小波段（K线1是第一个小波段），是一个做多入场形态，预期行情至少走出两个回合的上升小波段。然而，K线6是二个突破失败的做空入场形态，一个小级别楔形（它是上升通道内以K线5上升尖形为起点的小型三浪推进模式中的第三推）。这里构成了扩张三角形下降旗形，以K线2为五个波段中的第一段。","pid":"p469"},{"t":"para","text":"在K线8处的第七个小波段为二次入场机会。K线7走出新低，是第一个入场条件，但以失败告终，这也是意料之中的事，因为这期间行情处于一个铁丝网形态，大多数交易员会等待二次信号。K线8也是以K线6急速下跌为起点的小型下降通道内的高点3做多入场形态，第三次下推往往预示着尖形通道下跌趋势形态的完结。","pid":"p470"},{"t":"para","text":"K线10试探了K线8的低点，但K线10的低点比K线8的低点高了一个价位。它近似于扩张三角形的第九个小波段（近似形态就足够用于我们的交易中）。作为试探昨日低点的双重底，以及震荡区间底部高点2的做多入场形态，K线10是一个不错的开盘反转做多入场形态","pid":"p471"},{"t":"para","text":"K线11是价格超越开盘高点后的一次突破回调，不过它并没有向上突破三角形中K线9的高点。由五根K线组成的强势升展现了一轮可能的上涨趋势，在这之后K线11成为高点1买点，因此是一个可靠的做多入场形态。","pid":"p472"},{"t":"para","text":"K线12是扩张三角形顶部的一个低点2（扩张三角形也是一种震荡区间），在这张SPY图表上是一次仅向下突破一个价位的失败突破。但是电子迷你期货的价格（图表未给出）一直都保持在反转K线的低点之上，并没有触发该形态。电子迷你期货会给出少数虚假信号，这是因为电子迷你期货的第一跳相当于SPY现货的2.5个最小变动价位。由于此时上涨势头强劲。新的一轮牛市正在成型之中，交易员们在考虑做空之前会继续观望，看是否出现一个更低的高点。。","pid":"p473"},{"t":"para","text":"K线13是在向上突破K线9失败后第二次做空入场机会，但由于在早前的反弹过程中并没有突破趋势线，因此在空头力量缺失的情况下做空是不明智的。空头应该在做空之前等待一个更低高点的到来。","pid":"p474"},{"t":"para","text":"K线12和13并不是突破失败，而是新一轮牛市中的突破回调。","pid":"p475"},{"t":"img","src":"assets/img/p1c6_003.webp","ctx":[{"t":"K线13是在向上突破K线9失败后第二次做空入场机会，但由于在早前的反弹过程中并没有突破趋势线，因此在空头力量缺失的情况下做空是不明智的。空头应该在做空之前等待一个更低高点的到来。","p":"p474"},{"t":"K线12和13并不是突破失败，而是新一轮牛市中的突破回调。","p":"p475"},{"t":"如图6.3所示，从K线1到K线5走出了扩张三角形底的五个小波段。入场点比K线5这一更低低点高了一个价位。价格在K线6处尝试突破K线4的高点，却以失败告终，并跌出一个新的低点。K线7为扩张三角形的二次入场机会，但行情经过了K线5到K线7这么多根K线，扩张三角形已经失去其影响力，并形成了一个从当天新低点开始反转的双重底。","p":"p476"},{"t":"K线8形成了一个更高的低点，这也是K线5和7这一双重底之后的反扑做多信号。","p":"p477"},{"t":"到达新波段高点的目标后，K线9处形成了一个扩张三角形下降旗形（K线2、3、4、7和9），这一做空信号的目标价位是跌破K线7低点。然而，这些越来越大的三角形将最终破产，新一轮趋势由此开始。顺便提一句，市场在次日开盘后跳空低开至K线7下方，直接到达目标价位。该扩张三角形的形态不大成比例，因为K线4与K线9之间的距离远大于K线2与K线4之间的距离。当三角形形状那么不规范时，只有很少的交易员会采用它，而这也削弱了形态本身的影响力。然后，交易员们依然会把K线9看作是熊市震荡区间的顶部，与昨天的高点组成一个双重顶下降旗形。并对昨天高点上方的缺口进行测试，这些都提供了足够的理由让交易员们在此处做空。","p":"p478"}]},{"t":"para","text":"如图6.3所示，从K线1到K线5走出了扩张三角形底的五个小波段。入场点比K线5这一更低低点高了一个价位。价格在K线6处尝试突破K线4的高点，却以失败告终，并跌出一个新的低点。K线7为扩张三角形的二次入场机会，但行情经过了K线5到K线7这么多根K线，扩张三角形已经失去其影响力，并形成了一个从当天新低点开始反转的双重底。","pid":"p476"},{"t":"para","text":"K线8形成了一个更高的低点，这也是K线5和7这一双重底之后的反扑做多信号。","pid":"p477"},{"t":"para","text":"到达新波段高点的目标后，K线9处形成了一个扩张三角形下降旗形（K线2、3、4、7和9），这一做空信号的目标价位是跌破K线7低点。然而，这些越来越大的三角形将最终破产，新一轮趋势由此开始。顺便提一句，市场在次日开盘后跳空低开至K线7下方，直接到达目标价位。该扩张三角形的形态不大成比例，因为K线4与K线9之间的距离远大于K线2与K线4之间的距离。当三角形形状那么不规范时，只有很少的交易员会采用它，而这也削弱了形态本身的影响力。然后，交易员们依然会把K线9看作是熊市震荡区间的顶部，与昨天的高点组成一个双重顶下降旗形。并对昨天高点上方的缺口进行测试，这些都提供了足够的理由让交易员们在此处做空。","pid":"p478"}],"wcount":3566},{"id":"p1c7","title":"第7章　最终旗形","blocks":[{"t":"para","text":"第7章　最终旗形","pid":"p479"},{"t":"para","text":"一旦趋势结束，交易员们在观察图表时便可以看到趋势中的最终旗形。最终旗形的反转形态比较常见：因为在每个反转之前都是以某种旗形的形式出现，因而也算是一种最终旗形反转。在趋势反转之前。如果交易员能弄明白是什么原因使某个旗形很可能成为最终旗形，那么他就能提前预判到趋势的反转并入场交易。","pid":"p480"},{"t":"para","text":"以下是最终旗形一些常见的特征：","pid":"p481"},{"t":"para","text":"当旗形出现时，趋势已经推进了几十根K线：所以趋势型交易员可能开始获利了结，而逆势型交易员则可能变得较为积极。两方都认为趋势已经走到头。行情更倾向于进入包含两次较大波段的调整期，并演变为一个更大的震荡区间甚至产生趋势反转。","pid":"p482"},{"t":"para","text":"绝大部分的旗形都是水平推进的。并表现出强烈的双边交锋的迹象，比如几根反向的趋势K线，带有显著影线的K线，几次反转，以及至少与前一根K线重叠50%的K线等。第二本书关于区间震荡的第四部分给出了更多多空对峙的特征。","pid":"p483"},{"t":"para","text":"微型趋势线突破回调就是单K线或微型最终旗形。例如，当行情向上突破一条微型下跌趋势线。然后反转下行时，那一两根突破K线就形成了微型下跌趋势中的最终下降旗形。如果抛售的力量在一两根K线中失败了，市场从深度或浅度回踩的低点处或双重底处反转上行，那么这最后的一次抛盘便是一次突破后的回调，而原来的小规模突破则成为微型下跌趋势中的一个最终旗形。如果突破最终旗形后出现了反转，但只反扑了几根K线趋势便恢复，那么这次反扑就只是一次行进趋势中的突破回调，而非反转，最终旗形也没能让市场的趋势反转。","pid":"p484"},{"t":"para","text":"最终旗形有时出现短暂的反转。但只是为了之后形成一个更大级别的旗形，接下来的行情有可能突破也有可能反转。在最终旗形演变成其他形态之前，我们通常可以利用最终旗形反转形态获取刮头皮的交易利润，而演变后的形态一般能发出另一些方向性的信号。","pid":"p485"},{"t":"para","text":"有时行情会形成两个连续的水平推进的旗形，第二个旗形规模较小，突破第二个旗形可能引起一次楔形反转。","pid":"p486"},{"t":"para","text":"如果最终旗形在行情高潮之后出现。那么接下来失败的突破可能不会超越先前趋势极值。例如，如果行情经历一波抛售高潮后在低点上方走出一段水平的震荡区间、那这段震荡区间可能形成一个最终旗形，并从回踩的低点处突破反转上行。","pid":"p487"},{"t":"para","text":"有时最终旗形可能只有一两根K线。并形成于一波强劲的涨跌高潮之后，而这波高潮由几根异常大型的趋势K线构成（一个潜在的衰竭型高潮）。从这个小旗形处突破的行情往往在一两根K线后就开始反转，并引出一段持续十几根K线的双波段回调。这是一个可交易的逆势入场形态但还不足以引发趋势反转。这些大型的趋势K线频繁展示了行情的强劲势头，紧接着便在10到20根K线内测试趋势极值。单K线最终旗形可以是任意类型的暂停K线。例如，如果市场已经经历两次连续的下跌高潮，而且下一根K线又是一个阳线十字星，即使这个十字星的低点低于下跌高潮的低点，它也可能成为下跌趋势中的最终旗形。如果随后的一两根K线是一个大级别的暴跌形态，然后市场反转上行，那么这根暂停K线就是一个单K线最终旗形。","pid":"p488"},{"t":"para","text":"狭窄的震荡区间往往变成最终旗形。任何横盘整理的行情都拥有磁性回拉的效应。由于这段时间的突破一般都以失败告终。市场通常都被拽回多空双方所认可的价格区间里。","pid":"p489"},{"t":"para","text":"有时行情并未突破，最终旗形只是延伸出一段新的趋势。这往往发生在连续高潮后的反转行情当中。","pid":"p490"},{"t":"para","text":"交易员们认为市场处于过热状态，并预期行情即将进入休整期，但又觉得突破的幅度仍可再做一次刮头皮交易。因此他们在潜在最终旗形的突破位入场。但随时准备着入场后快速离场，而不是持有波段性头寸。由于每个人都打算小幅获利后马上离场，因此突破很快反转。","pid":"p491"},{"t":"para","text":"观察任意一张带有趋势反转的图表，你都会看到趋势行情反复震荡，由一系列的升、暴跌以及回调构成，这就是我们所说的旗形。如果你仔细研究这轮趋势中的最终旗形，就会发现行情给出很多趋势即将完结的线索。要么进入区间震荡，要么进入一轮反向趋势。震荡区间里会出现一些延伸至区间外的波段，看起来像是要趋势反转，但这些通常只是更高时间周期里更大规模的回调而已。然而，这些波段的幅度足以做一笔盈利可观的波段交易。交易员们并不确定此次反转会成为一轮新的趋势抑或一次大规模调整，不管哪种可能，他们的交易手法都是一致的。他们在第一个或第二个波段处部分或全部获利了结，并伺机在回调时加仓。如果在原来的趋势方向上形成了一波强势的行情，那么他们可能就会继续持有头寸，并预期价格二次到达并测试趋势极值。","pid":"p492"},{"t":"para","text":"每一次回调都有双向交易的机会，但当回调的价格区间大体上呈水平走向，很多K线相互重叠，区间内发生若干次反转，或者包含若干根反向的趋势K线时，市场进入横盘整理的特征就尤其明显。最终旗形可以是任意大小的震荡区间，甚至包括单根K线的情形，但通常都是指至少包含五到十根K线的情况。横盘整理的状态意味着多空双方都达成共识，当前的价格水平处于合理区间内。空头积极卖出，他们认为价格将突破下行，而多头积极买入，他们认为价格将突破上行。每当价格触及区间顶部甚至发生短暂突破，空头觉得在当前的高位卖出更有利可图，他们便更加激进地做空。而多头则认为追涨风险较大，只会少量买入。结果空头力量就把价格拉回原来的区间水平。每当价格触及区间底部甚至向下突破，情况恰好相反，多头觉得在当前的低位买入更划算，而空头则认为此处杀跌价位过低，不宜重仓做空。这也让市场价格回到原来的运行区间。所有的区间震荡行情都存在这种现象，包括上升旗形和下降旗形，这些震荡区间中部的磁石效应使得大部分的突破尝试都没来得及走太远，就被市场拉回原来的区间里。","pid":"p493"},{"t":"para","text":"当一轮趋势维持了十几根K线以上后行情发生突破，这种突破往往就演变成趋势中的一个最终旗形。突破之后，顺势交易员更乐于平仓获利，并在再次入场之前等待市场的深度调整，而逆势交易员则预期市场至少会出现双波段调整，更倾向于在趋势恢复的时候反手一搏。举例来说，如果上涨趋势已经持续了数十根K线的时间，行情有可能进入深度调整甚至发生反转，交易员们就会观察是否形成一个大体水平的上升旗形。由于上涨趋势依然有效，交易员们会在旗形突破时买入，做一笔刮头皮交易，而非波段交易。在旗形期间已经拥有空头持仓的交易员则会平仓了结。他们买入平仓的动作助长价格上扬，但他们非常渴望能够在市场触及某个压力位的时候再次做空，而这个压力位，可以是固定幅度的价格区间，他们认为多头会在这里结束早前做多的刮头皮头寸，也可以是一些经测量可得的目标价位。多头入场后不久，便在压力位快速卖出平仓获取小额利润。激进的空头也看到同样的情况，并在几乎与多头同样的点位上卖出。随着多空双方都预期价格将进一步走低，市场上再没有人参与买入，行情也就随之反转向下了，而下行的幅度至少足够交易员们做一次刮头皮交易。如果下行动能足够强大，多头不会愿意买入，空头也不急于了结获利，直到市场出现行情调整即将结束的信号。价格反转可以引出一波回调，一次大规模的调整（如震荡区间），甚至一轮趋势的反转。","pid":"p494"},{"t":"para","text":"正如我们在第3章中讨论关于双重底和双重底的内容一样，最终旗形也是由同样的基本行为所导致。例如，如果在牛市中有一个潜在的最终旗形，那么在旗形成型前会有一波上推。而后旗形的向上突破则对这个牛市高点发起冲击。如果在冲击过程中卖方比买方多，市场就会在第二次上推时反转下行。尽管潜在的力量是相同的，但最终旗形看起来与其他形态有显著区别，其独特的特性使它能够与其他形态区分开来。最终旗形在熊市中亦是如此，整个过程包括两次下推和一次向上反转。最终旗形的空头突破是第二次下推，并对开始减弱并休整的熊市动能进行测试。","pid":"p495"},{"t":"para","text":"很多多头和空头都会在上升旗形多头突破后不久就卖出，如果抛售力量足够大的话，市场就会开始反转。如果空头反转入场形态继续发展，交易员们就会越来越坚信接下来将出现更大规模的调整；更多的多头将卖出他们的多仓，更多的空头也将开始做空。如果价格跌破下跌反转K线一个价位，并导致行情反转向下。那么市场将会被重新拉回最终旗形之中。价格有可能停在那儿，但通常会走出一波至少包含两个小波段的横向至下跌行情，并最终引发趋势反转。如果在旗形中有一波强势的下跌运动（抛压的迹象），或者在此之前价格已经向下大幅突破上涨趋势线，这些情况下市场更可能形成趋势反转。如果原来的趋势已经持续了50到100根K线，那么反转更有可能演变成一个大级别的旗形而非一轮反向趋势。请记住，趋势本身巨大的惯性总是企图抵抗所有的反转尝试。然而，每一次反转都趋于愈演愈烈的状态，每一次反转的规模总比上一次的更大，最终会有一次反转尝试脱颖而出，成功将局面扭转过来。","pid":"p496"},{"t":"para","text":"市场过热的高潮一般在短暂的最终旗形突破后结束。举个例子。如果有一个由四根K线组成的上升高潮，K线主体都比较长，而且第四根K线特别巨大，行情往往会引发一波短暂的抛售，因为交易员们都把这个高潮看作一次潜在的买入高潮。多空双方都在等待这种大型K线的出现。多头着这波能量取得非常高位平仓获利，激进的空头则卖出开仓建立刮头皮头寸。随之而来的常常是一波回调。不过，由于上升高潮太过强势，在前一根K线低点下方通常都存在强力的买压。多头试图重新满仓操作，而空头则买回他们的刮头皮头寸。结果导致这次回调仅仅持续了数根K线，并形成一个高点1或2的做多入场形态。多头将在前一根K线的高点上方买入，如果市场向上突破原来的高潮顶部，还会有更多人跟风做多。","pid":"p497"},{"t":"para","text":"一轮牛市行进了很长一段时间后出现了一波抛售高潮，随之而来的通常都是一个最终旗形反转形态，并包含至少双波段反弹。","pid":"p498"},{"t":"img","src":"assets/img/p1c7_001.webp","ctx":[{"t":"市场过热的高潮一般在短暂的最终旗形突破后结束。举个例子。如果有一个由四根K线组成的上升高潮，K线主体都比较长，而且第四根K线特别巨大，行情往往会引发一波短暂的抛售，因为交易员们都把这个高潮看作一次潜在的买入高潮。多空双方都在等待这种大型K线的出现。多头着这波能量取得非常高位平仓获利，激进的空头则卖出开仓建立刮头皮头寸。随之而来的常常是一波回调。不过，由于上升高潮太过强势，在前一根K线低点下方通常都存在强力的买压。多头试图重新满仓操作，而空头则买回他们的刮头皮头寸。结果导致这次回调仅仅持续了数根K线，并形成一个高点1或2的做多入场形态。多头将在前一根K线的高点上方买入，如果市场向上突破原来的高潮顶部，还会有更多人跟风做多。","p":"p497"},{"t":"一轮牛市行进了很长一段时间后出现了一波抛售高潮，随之而来的通常都是一个最终旗形反转形态，并包含至少双波段反弹。","p":"p498"},{"t":"在图7.1中，开盘时启动的两个下降小波段止于K线1处，这里可能是当天的一个低点。行情进一步下探后，便突破了横盘整理的下降旗形，因此有可能成为一个最终旗形并导致价格反转上行。K线1就是一个不错的反转K线，触发了最终旗形做多入场形态，使交易员们开始预期接下来会走出一波至少含两个上升小波段的行情。当反转后第一回合的上升小波段越过最终旗形时，这种情况被认为是最佳反转之一，如图所示。接下来行情往往在原来的下降旗形上方形成横盘整理态势，然后继续新一轮牛市上涨。在上升波段中，价格有时会短暂回调至原来的下降旗形，有时并未进行休整就在一系列阳线中展开迅猛的飞涨态势。当你遇见这种类型的反转，把自己部分甚至全部头寸波段化是非常重要的，这时候你很有机会借此大赚一把。","p":"p499"},{"t":"行情从太平洋标准时间7：30左右到9：30左右横向震荡了近两个小时，这段时间的价格波动可以看作一个大级别的最终旗形。如果之后价格突破该震荡区间，先前横盘整理所产生的磁力总能把市场拉回到突破前的水平。","p":"p500"},{"t":"K线1之后的那根入场K线收在前面六根K线的高点上方，并高于前面七根K线的收盘价，从而收复了很多高点和收盘价。在这些K线上做空的交易员要么平仓止损，要么忍受账面浮亏继续持有，但很可能不久后也得认赔离场。而且他们也不会在几根K线的时间内选择再次做空，大多数交易员会等行情至少再经历两个小波段的反弹后才会考虑再次入场。这时市场形成单边走势，通常能走一段10根K线以上的双波段反弹行情。","p":"p501"},{"t":"反弹之后所形成的狭窄震荡区间一般会成为最终上升旗形。","p":"p502"}]},{"t":"para","text":"在图7.1中，开盘时启动的两个下降小波段止于K线1处，这里可能是当天的一个低点。行情进一步下探后，便突破了横盘整理的下降旗形，因此有可能成为一个最终旗形并导致价格反转上行。K线1就是一个不错的反转K线，触发了最终旗形做多入场形态，使交易员们开始预期接下来会走出一波至少含两个上升小波段的行情。当反转后第一回合的上升小波段越过最终旗形时，这种情况被认为是最佳反转之一，如图所示。接下来行情往往在原来的下降旗形上方形成横盘整理态势，然后继续新一轮牛市上涨。在上升波段中，价格有时会短暂回调至原来的下降旗形，有时并未进行休整就在一系列阳线中展开迅猛的飞涨态势。当你遇见这种类型的反转，把自己部分甚至全部头寸波段化是非常重要的，这时候你很有机会借此大赚一把。","pid":"p499"},{"t":"para","text":"行情从太平洋标准时间7：30左右到9：30左右横向震荡了近两个小时，这段时间的价格波动可以看作一个大级别的最终旗形。如果之后价格突破该震荡区间，先前横盘整理所产生的磁力总能把市场拉回到突破前的水平。","pid":"p500"},{"t":"para","text":"K线1之后的那根入场K线收在前面六根K线的高点上方，并高于前面七根K线的收盘价，从而收复了很多高点和收盘价。在这些K线上做空的交易员要么平仓止损，要么忍受账面浮亏继续持有，但很可能不久后也得认赔离场。而且他们也不会在几根K线的时间内选择再次做空，大多数交易员会等行情至少再经历两个小波段的反弹后才会考虑再次入场。这时市场形成单边走势，通常能走一段10根K线以上的双波段反弹行情。","pid":"p501"},{"t":"para","text":"反弹之后所形成的狭窄震荡区间一般会成为最终上升旗形。","pid":"p502"},{"t":"img","src":"assets/img/p1c7_002.webp","ctx":[{"t":"K线1之后的那根入场K线收在前面六根K线的高点上方，并高于前面七根K线的收盘价，从而收复了很多高点和收盘价。在这些K线上做空的交易员要么平仓止损，要么忍受账面浮亏继续持有，但很可能不久后也得认赔离场。而且他们也不会在几根K线的时间内选择再次做空，大多数交易员会等行情至少再经历两个小波段的反弹后才会考虑再次入场。这时市场形成单边走势，通常能走一段10根K线以上的双波段反弹行情。","p":"p501"},{"t":"反弹之后所形成的狭窄震荡区间一般会成为最终上升旗形。","p":"p502"},{"t":"在图7.2中，K线4向上突破收盘价的这波反弹显得非常坚挺，并引出后面一段狭窄的震荡区间。在这个例子中，对旗形的强势突破在K线7处结束，形成了两个回合的上升小波段（K线5为第一个小波段），和一个楔形顶（当天开盘的第一根K线为第一次上推，K线4为第二次上推）。双波段运动突破旗形，往往构造出一个主要反转形态。这种反转一般都能走出至少两个小波段的反向行情。虽然跌至K线10的过程已经经历了两个小波段，但第一个小波段只包含了一根逆势K线（K线9），因此很可能这波下跌只是未来更大级别双波段的第一回合。当双波段运动在一个狭窄的通道中运行，整条通道通常成为更大级别双波段行情的第一个波段。在任何情况下，如果空头交易员对行情判断不太确定，那么当价格在K线10处跌到移动平均线时，他们就会把自己的止损价放在损益平衡点。","p":"p503"},{"t":"K线9越过了前面小十字星阳线的高点，触发了高点1的买入条件，有经验的交易员就会预期价格在买入高潮之后回落，并形成一个最终旗形顶。K线8和后面两根K线一起构成了一个小级别的最终旗形，K线9则是一个尝试突破三K线最终旗形而失败的次高点。这里的微型买入真空将市场拉至高点1信号K线上方一两个价位。强势的空头预期高点1将会回落，等待着机会在信号K线的高点处或高点上方做空。当市场跌破K线高点一两个价位时，很多人就会停止做空，看跌情绪缺失导致价格在寻找空头的过程中一路走高。一旦市场触及目标价位（高点1信号K线或其上方），空头就开始激进地做空，并大举压倒多头，驱使市场下行。在高点1信号K线高点处或上方买入的多头，马上意识到市场已经停滞不前，并且开始反转，他们就会卖出所有多仓。为市场进一步下跌推波助澜。他们开始确信空头形态的顶部已经成型，几根K线的行情内不会再考虑买入。市场在没有买盘的情况下快速下探至移动平均线或最终旗形中部这些支撑位，只有在这些支撑位上，空头才会止盈平仓，多头才会考虑再次做多。由于看跌情绪高涨，市场缺乏买盘，无力反弹买方也很快成了卖方（多头卖掉他们新进的多仓，空头也在此时再次进场），导致市场进一步走低，在更有吸引力的价位寻找做多力量。","p":"p504"},{"t":"当市场看涨情绪特别浓厚时，伺机寻找做多入场形态才是明智之举，除非空头力量逐渐显现，有足够的理由支持做空。","p":"p505"}]},{"t":"para","text":"在图7.2中，K线4向上突破收盘价的这波反弹显得非常坚挺，并引出后面一段狭窄的震荡区间。在这个例子中，对旗形的强势突破在K线7处结束，形成了两个回合的上升小波段（K线5为第一个小波段），和一个楔形顶（当天开盘的第一根K线为第一次上推，K线4为第二次上推）。双波段运动突破旗形，往往构造出一个主要反转形态。这种反转一般都能走出至少两个小波段的反向行情。虽然跌至K线10的过程已经经历了两个小波段，但第一个小波段只包含了一根逆势K线（K线9），因此很可能这波下跌只是未来更大级别双波段的第一回合。当双波段运动在一个狭窄的通道中运行，整条通道通常成为更大级别双波段行情的第一个波段。在任何情况下，如果空头交易员对行情判断不太确定，那么当价格在K线10处跌到移动平均线时，他们就会把自己的止损价放在损益平衡点。","pid":"p503"},{"t":"para","text":"K线9越过了前面小十字星阳线的高点，触发了高点1的买入条件，有经验的交易员就会预期价格在买入高潮之后回落，并形成一个最终旗形顶。K线8和后面两根K线一起构成了一个小级别的最终旗形，K线9则是一个尝试突破三K线最终旗形而失败的次高点。这里的微型买入真空将市场拉至高点1信号K线上方一两个价位。强势的空头预期高点1将会回落，等待着机会在信号K线的高点处或高点上方做空。当市场跌破K线高点一两个价位时，很多人就会停止做空，看跌情绪缺失导致价格在寻找空头的过程中一路走高。一旦市场触及目标价位（高点1信号K线或其上方），空头就开始激进地做空，并大举压倒多头，驱使市场下行。在高点1信号K线高点处或上方买入的多头，马上意识到市场已经停滞不前，并且开始反转，他们就会卖出所有多仓。为市场进一步下跌推波助澜。他们开始确信空头形态的顶部已经成型，几根K线的行情内不会再考虑买入。市场在没有买盘的情况下快速下探至移动平均线或最终旗形中部这些支撑位，只有在这些支撑位上，空头才会止盈平仓，多头才会考虑再次做多。由于看跌情绪高涨，市场缺乏买盘，无力反弹买方也很快成了卖方（多头卖掉他们新进的多仓，空头也在此时再次进场），导致市场进一步走低，在更有吸引力的价位寻找做多力量。","pid":"p504"},{"t":"para","text":"当市场看涨情绪特别浓厚时，伺机寻找做多入场形态才是明智之举，除非空头力量逐渐显现，有足够的理由支持做空。","pid":"p505"},{"t":"img","src":"assets/img/p1c7_003.webp","ctx":[{"t":"K线9越过了前面小十字星阳线的高点，触发了高点1的买入条件，有经验的交易员就会预期价格在买入高潮之后回落，并形成一个最终旗形顶。K线8和后面两根K线一起构成了一个小级别的最终旗形，K线9则是一个尝试突破三K线最终旗形而失败的次高点。这里的微型买入真空将市场拉至高点1信号K线上方一两个价位。强势的空头预期高点1将会回落，等待着机会在信号K线的高点处或高点上方做空。当市场跌破K线高点一两个价位时，很多人就会停止做空，看跌情绪缺失导致价格在寻找空头的过程中一路走高。一旦市场触及目标价位（高点1信号K线或其上方），空头就开始激进地做空，并大举压倒多头，驱使市场下行。在高点1信号K线高点处或上方买入的多头，马上意识到市场已经停滞不前，并且开始反转，他们就会卖出所有多仓。为市场进一步下跌推波助澜。他们开始确信空头形态的顶部已经成型，几根K线的行情内不会再考虑买入。市场在没有买盘的情况下快速下探至移动平均线或最终旗形中部这些支撑位，只有在这些支撑位上，空头才会止盈平仓，多头才会考虑再次做多。由于看跌情绪高涨，市场缺乏买盘，无力反弹买方也很快成了卖方（多头卖掉他们新进的多仓，空头也在此时再次进场），导致市场进一步走低，在更有吸引力的价位寻找做多力量。","p":"p504"},{"t":"当市场看涨情绪特别浓厚时，伺机寻找做多入场形态才是明智之举，除非空头力量逐渐显现，有足够的理由支持做空。","p":"p505"},{"t":"如图7.3所示，欧元/美元外汇的K线图在K线2处出现一个最终旗形做空入场形态。但上行动能非常强劲，旗形也只维持了四根K线的时间：价格也因此没能突破主要的上涨趋势线。这样一根阴线并不足以抑制过度的上涨热情，市场随后很可能横盘整理，然后反弹创出新高。这里反转尝试未能成功，很可能成为价格向上突破K线1双K线反转后的一次回调。每当最终旗形反转行情的计划落空，就是一次突破回调的入场形态。在这个例子中亦是如此。K线1这一潜在最终旗形在K线2双K线反转形态上发出反转信号。反转入场条件被触发，但市场并没有大跌。","p":"p506"},{"t":"相反，价格休整后又形成了另外一个做多入场形态，这使得在K线3上方的买入动作成为一个入场时机，一个从失败的最终旗形获得的入场时机。市场向上突破K线1旗形，回调，然后继续突破上行。","p":"p507"},{"t":"K线3双K线反转确立了高点2做多形态，并于K线1构成双重底，这些理由足以支持我们在一轮强牛市中买入。保守的交易员把K线3看作从K线2开始的小型下降通道的一部分，与K线3双K线多头反转形态前后相邻的K线一起构成了一个小级别的双重顶下降旗形，他们会在该双重顶上方买入。对K线3向上突破的力量很薄弱，价格回调到一个比K线3略高的低点。这是一个突破回调入场形态，此时一个楔形上升旗形逐渐浮现，其中K线1和K线3为该楔形的头两次下推，我们也可以认为它是一个三角形（一旦第三次下推出现。该形态便以三角形的形状呈现）。这个三角形呈水平状态，并形成于一波较大的反弹之后。多空力量在此处交锋，让它足以产生一股强大的磁力将任意形式的突破拉回到这个震荡区间中来。有些交易员把K线4看作在K线3阳线和下一根K线高点2入场的一次突破回调。这个上升旗形就是一个潜在的最终旗形，K线5就是一个反转入场形态。它是行情的第三次上推，也是对单K线回调形态的突破，并成为单K线最终旗形。不过，上涨动能依然高涨，比起反转，接下来的行情更可能横向盘整。市场进入一段狭窄的震荡区间，并从该区间突破上行或反转下行。如果突破上行，这一狭窄通道有可能成为最终旗形。","p":"p508"},{"t":"有时候最终旗形的突破反转会形成一个更低的高点，而非更高的高点。","p":"p509"}]},{"t":"para","text":"如图7.3所示，欧元/美元外汇的K线图在K线2处出现一个最终旗形做空入场形态。但上行动能非常强劲，旗形也只维持了四根K线的时间：价格也因此没能突破主要的上涨趋势线。这样一根阴线并不足以抑制过度的上涨热情，市场随后很可能横盘整理，然后反弹创出新高。这里反转尝试未能成功，很可能成为价格向上突破K线1双K线反转后的一次回调。每当最终旗形反转行情的计划落空，就是一次突破回调的入场形态。在这个例子中亦是如此。K线1这一潜在最终旗形在K线2双K线反转形态上发出反转信号。反转入场条件被触发，但市场并没有大跌。","pid":"p506"},{"t":"para","text":"相反，价格休整后又形成了另外一个做多入场形态，这使得在K线3上方的买入动作成为一个入场时机，一个从失败的最终旗形获得的入场时机。市场向上突破K线1旗形，回调，然后继续突破上行。","pid":"p507"},{"t":"para","text":"K线3双K线反转确立了高点2做多形态，并于K线1构成双重底，这些理由足以支持我们在一轮强牛市中买入。保守的交易员把K线3看作从K线2开始的小型下降通道的一部分，与K线3双K线多头反转形态前后相邻的K线一起构成了一个小级别的双重顶下降旗形，他们会在该双重顶上方买入。对K线3向上突破的力量很薄弱，价格回调到一个比K线3略高的低点。这是一个突破回调入场形态，此时一个楔形上升旗形逐渐浮现，其中K线1和K线3为该楔形的头两次下推，我们也可以认为它是一个三角形（一旦第三次下推出现。该形态便以三角形的形状呈现）。这个三角形呈水平状态，并形成于一波较大的反弹之后。多空力量在此处交锋，让它足以产生一股强大的磁力将任意形式的突破拉回到这个震荡区间中来。有些交易员把K线4看作在K线3阳线和下一根K线高点2入场的一次突破回调。这个上升旗形就是一个潜在的最终旗形，K线5就是一个反转入场形态。它是行情的第三次上推，也是对单K线回调形态的突破，并成为单K线最终旗形。不过，上涨动能依然高涨，比起反转，接下来的行情更可能横向盘整。市场进入一段狭窄的震荡区间，并从该区间突破上行或反转下行。如果突破上行，这一狭窄通道有可能成为最终旗形。","pid":"p508"},{"t":"para","text":"有时候最终旗形的突破反转会形成一个更低的高点，而非更高的高点。","pid":"p509"},{"t":"img","src":"assets/img/p1c7_004.webp","ctx":[{"t":"K线3双K线反转确立了高点2做多形态，并于K线1构成双重底，这些理由足以支持我们在一轮强牛市中买入。保守的交易员把K线3看作从K线2开始的小型下降通道的一部分，与K线3双K线多头反转形态前后相邻的K线一起构成了一个小级别的双重顶下降旗形，他们会在该双重顶上方买入。对K线3向上突破的力量很薄弱，价格回调到一个比K线3略高的低点。这是一个突破回调入场形态，此时一个楔形上升旗形逐渐浮现，其中K线1和K线3为该楔形的头两次下推，我们也可以认为它是一个三角形（一旦第三次下推出现。该形态便以三角形的形状呈现）。这个三角形呈水平状态，并形成于一波较大的反弹之后。多空力量在此处交锋，让它足以产生一股强大的磁力将任意形式的突破拉回到这个震荡区间中来。有些交易员把K线4看作在K线3阳线和下一根K线高点2入场的一次突破回调。这个上升旗形就是一个潜在的最终旗形，K线5就是一个反转入场形态。它是行情的第三次上推，也是对单K线回调形态的突破，并成为单K线最终旗形。不过，上涨动能依然高涨，比起反转，接下来的行情更可能横向盘整。市场进入一段狭窄的震荡区间，并从该区间突破上行或反转下行。如果突破上行，这一狭窄通道有可能成为最终旗形。","p":"p508"},{"t":"有时候最终旗形的突破反转会形成一个更低的高点，而非更高的高点。","p":"p509"},{"t":"图7.4中，行情以抛物线的强劲势头反弹至K线2，然后一波包含至少双波段的回调走势很可能随之而来（牛市中的回调可以是横盘整理也可以是下跌），这次回调至少维持在10根K线以上。从图中可以看到，这波回调在移动平均线上方形成了一个水平的震荡区间，并在K线3处突破。然而，突破失败而回，市场在一个双K线反转形态中开始下行。K线3这次突破形成了一个更低的高点，而非更高的高点，但它依然算是牛市中的最终旗形。交易员会在双K线反转形态下方开始做空。K线3也与K线2后面那个小型次高点一起，组成了双重顶下降旗形。K线2没能超越开盘时段的高点。K线3二次摸顶并尝试突破，同样以失败告终。当市场两次努力实现目标都无功而返时，价格通常开始背道而驰。","p":"p510"},{"t":"开盘出现巨型的双K线跳水行情，然后是一根阳线。任何一根或多根K线都形成一次突破，一个急速，一种跳空，和一波高潮。最初的下跌高潮结束后，紧接着在K线1处马上发生第二波高潮。连续的暴跌往往引发更持久的休整行情，有时出现反转，比如这个例子。在这波急跌至K线1的过程中，K线1前面的那根阳线便是最终旗形，它使行情进入一种单K线的休整状态。这根K线成为抛售期中的单K线最终旗形：尽管它是一根阳线反转K线，它的低点也低于它前面巨型双K线抛售高潮的底部，但它使下跌趋势进入休整，因此它是一个下降旗形。像这种在自由落体的市场中形成的连续跳水行情，往往会出现单K线或双K线最终旗形。然后市场开始走向一波大型调整甚至趋势反转。连续的抛售高潮通常带来大型的回调行情，明白这个道理的交易员们看到这根暂停K线后，会愿意在当天的低点反转上行时买入。没人愿意在这个低位做空。剩下的空头只会在市场回调时卖出，而且会等到反转行情持续10根K线之后。K线1前面的那根阳线打乱了下跌节奏，将这波行情一分为二。如果没有这根K线，价格很可能在K线1之后继续下探一到两根K线的深度。很多空头会在K线1的收盘价处了结他们的空仓，预期市场将会反弹到他们愿意再次做空的高度。激进的多头则在K线1的收盘价处做多，预期价格将冲击K线1高点，然后走出一波基于K线1高度的上涨行情，但由于K线1振幅较大，他们面临的潜在风险也同步增加。K线1上成交了93000张合约，将近过去两天普通K线平均成交量的10倍，因此这是一个暴跌高潮后的向上反转形态。在我同系列的第一本书中，已经讨论过高潮的各种变化形态，和趋势通道。这里先产生一个下降高潮，一次休整，然后另一波抛售高潮（K线1），它的作用就像高潮和通道形态下的单K线通道。","p":"p511"},{"t":"K线1之后的水平震荡区间也是一个最终旗形，尽管它从未突破下行。抛售高潮之后，市场往往形成一个下降旗型，有可能呈水平走势，也有可能表现为上升通道，有时候会出现如例子所示的低点1或低点2的做空入场形态，但后续行情并未实现空头突破。相反，下降旗形突破上行，这是趋势反转常见的方式。在连续的下跌高潮之后，十字星信号K线是相对疲弱的做空信号，激进的交易员会在它们的低点或其下方介人多头。既然十字星是最后一个下降旗形，也可以算是一种最终旗形。K线1大型抛售高潮前面的那根反转阳线也是一种单K线最终旗形，十字星从这个单K线最终旗形开始反转。价格于太平洋时间上午8：05向上突破下降旗形，由当时的那根阳线完成此次反转。","p":"p512"},{"t":"有时最终旗形并没有首先发生突破，而是继续回调，最终成为一轮反向趋势。","p":"p513"}]},{"t":"para","text":"图7.4中，行情以抛物线的强劲势头反弹至K线2，然后一波包含至少双波段的回调走势很可能随之而来（牛市中的回调可以是横盘整理也可以是下跌），这次回调至少维持在10根K线以上。从图中可以看到，这波回调在移动平均线上方形成了一个水平的震荡区间，并在K线3处突破。然而，突破失败而回，市场在一个双K线反转形态中开始下行。K线3这次突破形成了一个更低的高点，而非更高的高点，但它依然算是牛市中的最终旗形。交易员会在双K线反转形态下方开始做空。K线3也与K线2后面那个小型次高点一起，组成了双重顶下降旗形。K线2没能超越开盘时段的高点。K线3二次摸顶并尝试突破，同样以失败告终。当市场两次努力实现目标都无功而返时，价格通常开始背道而驰。","pid":"p510"},{"t":"para","text":"开盘出现巨型的双K线跳水行情，然后是一根阳线。任何一根或多根K线都形成一次突破，一个急速，一种跳空，和一波高潮。最初的下跌高潮结束后，紧接着在K线1处马上发生第二波高潮。连续的暴跌往往引发更持久的休整行情，有时出现反转，比如这个例子。在这波急跌至K线1的过程中，K线1前面的那根阳线便是最终旗形，它使行情进入一种单K线的休整状态。这根K线成为抛售期中的单K线最终旗形：尽管它是一根阳线反转K线，它的低点也低于它前面巨型双K线抛售高潮的底部，但它使下跌趋势进入休整，因此它是一个下降旗形。像这种在自由落体的市场中形成的连续跳水行情，往往会出现单K线或双K线最终旗形。然后市场开始走向一波大型调整甚至趋势反转。连续的抛售高潮通常带来大型的回调行情，明白这个道理的交易员们看到这根暂停K线后，会愿意在当天的低点反转上行时买入。没人愿意在这个低位做空。剩下的空头只会在市场回调时卖出，而且会等到反转行情持续10根K线之后。K线1前面的那根阳线打乱了下跌节奏，将这波行情一分为二。如果没有这根K线，价格很可能在K线1之后继续下探一到两根K线的深度。很多空头会在K线1的收盘价处了结他们的空仓，预期市场将会反弹到他们愿意再次做空的高度。激进的多头则在K线1的收盘价处做多，预期价格将冲击K线1高点，然后走出一波基于K线1高度的上涨行情，但由于K线1振幅较大，他们面临的潜在风险也同步增加。K线1上成交了93000张合约，将近过去两天普通K线平均成交量的10倍，因此这是一个暴跌高潮后的向上反转形态。在我同系列的第一本书中，已经讨论过高潮的各种变化形态，和趋势通道。这里先产生一个下降高潮，一次休整，然后另一波抛售高潮（K线1），它的作用就像高潮和通道形态下的单K线通道。","pid":"p511"},{"t":"para","text":"K线1之后的水平震荡区间也是一个最终旗形，尽管它从未突破下行。抛售高潮之后，市场往往形成一个下降旗型，有可能呈水平走势，也有可能表现为上升通道，有时候会出现如例子所示的低点1或低点2的做空入场形态，但后续行情并未实现空头突破。相反，下降旗形突破上行，这是趋势反转常见的方式。在连续的下跌高潮之后，十字星信号K线是相对疲弱的做空信号，激进的交易员会在它们的低点或其下方介人多头。既然十字星是最后一个下降旗形，也可以算是一种最终旗形。K线1大型抛售高潮前面的那根反转阳线也是一种单K线最终旗形，十字星从这个单K线最终旗形开始反转。价格于太平洋时间上午8：05向上突破下降旗形，由当时的那根阳线完成此次反转。","pid":"p512"},{"t":"para","text":"有时最终旗形并没有首先发生突破，而是继续回调，最终成为一轮反向趋势。","pid":"p513"},{"t":"img","src":"assets/img/p1c7_005.webp","ctx":[{"t":"K线1之后的水平震荡区间也是一个最终旗形，尽管它从未突破下行。抛售高潮之后，市场往往形成一个下降旗型，有可能呈水平走势，也有可能表现为上升通道，有时候会出现如例子所示的低点1或低点2的做空入场形态，但后续行情并未实现空头突破。相反，下降旗形突破上行，这是趋势反转常见的方式。在连续的下跌高潮之后，十字星信号K线是相对疲弱的做空信号，激进的交易员会在它们的低点或其下方介人多头。既然十字星是最后一个下降旗形，也可以算是一种最终旗形。K线1大型抛售高潮前面的那根反转阳线也是一种单K线最终旗形，十字星从这个单K线最终旗形开始反转。价格于太平洋时间上午8：05向上突破下降旗形，由当时的那根阳线完成此次反转。","p":"p512"},{"t":"有时最终旗形并没有首先发生突破，而是继续回调，最终成为一轮反向趋势。","p":"p513"},{"t":"如图7.5所示，一波暴跌的抛售高潮将价格推向K线14，K线14是一个强势的多头反转K线。有些交易员把这次跳水的起点定为K线6，终点为K线9，而其他一些交易员则认为K线9和它前面的阴线组成了一个关键的下降急速，或由K线10后面那两根K线组成的双K线急速。所有的长阴线跳水行情都是抛压的显著标志，对于下探至K线14的这波抛售高潮来说，究竟哪根K线所做出的贡献最大，这个问题并不影响大局。跌向K线14的这波抛物线行情中有三次下推（K线9和11为头两次下降小波段）。这往往导致一个持久的反弹，反弹通常从上升通道开始，如图所示。上升通道正是一个下降旗形。","p":"p514"},{"t":"K线15是低点1，精明的交易员预期这个做空形态会失败。实际上，他们甚至认为在低点2处做空、或在楔形下降旗形上做空都将无功而返，像所有通道一样，他们会在前一根K线的低点或其下方介入多头。机构投资者不会在通道中的低点下方卖出，这不是他们的风格。为什么我能够如此确定呢？如果他们真的卖出了，市场就会继续下跌，但既然现在市场上涨了，则证明他们肯定正在买人。到了某个时点，当所有人都意识到这个下降旗形将不会突破下行的时候，空头最终选择了结头寸，有些在低点2后面平仓，有些则在楔形下降旗形之后平仓。结果行情突破上行，如K线19的阳线，而类似的情形在K线20上方再次发生。多头认为K线3、9和11正在形成一个楔形上升旗形，当市场跌破K线11时，楔形破产，市场崩盘。但空头突破只维持了一个小波段，因为当前的形态已经演变为一个急速高潮底。","p":"p515"},{"t":"从K线14开始连续四根阳线表明市场存在一定买压。第四根阳线是一次对低点1的向上突破。K线17是一个低点2或低点3的人场形态，它非但没能触发做空信号，市场反而向上突破连续走出两根阳线。K线18是一个被一个价位的突破而触发的楔形下降旗形入场信号，然后市场却反转上行并突破至K线19。K线20是一次从移动平均线缺口K线做空形态的向上反转，此次反转由三根阳线构成。下降旗形正在成型，和早前一些对下降旗形的多头突破不同，这次行情后续连着走出几根阳线。这使交易员确信市场现在已经翻转为多头态势，他们不再预期下降旗形能够有所突破。","p":"p516"},{"t":"K线12是一个上升旗形的起点，跟在从K线11低点开始的上涨运动之后。K线12前面的那根阴线是第一次下推，K线12后面的两根阴线形成了第二次下推，它们构造出一个潜在的高点2上升旗形，并有可能引出第二个上升小波段。接下来是一根阳线，因而出现了双K线反转的买入信号，但市场并没有突破上行走出第二个上升小波段，而是以一根强势的阴线突破下行。这根阴线使多头放弃他们原先的观点，并且在几根K线内都不会再次买入。K线13是对上升旗形空头突破后的一次回调，也是行情暴跌至K线14的起点，K线9、11和14这三次下推构成一个抛物线式的楔形反转形态。","p":"p517"},{"t":"当下降旗形突破上行时，如K线19，多头需要有根阳线收在旗形顶部上方，以确保空头放弃之前认为反弹只是熊市中一次回调的观点。同样道理，当上升旗形突破下行时，交易员们希望看到有根强势的阴线收在旗形底部下方，比如K线13前面倒数第二根K线。交易员们看到高点2上升旗形正在成型，但如果有根阴线收盘价远低于旗形，交易员们便推断多头的看涨预期不再有效，市场很可能下探至少两个小波段。","p":"p518"},{"t":"有时交易员想在上升旗形上买人，但做多形态一直未能触发，市场反而突破下行。","p":"p519"}]},{"t":"para","text":"如图7.5所示，一波暴跌的抛售高潮将价格推向K线14，K线14是一个强势的多头反转K线。有些交易员把这次跳水的起点定为K线6，终点为K线9，而其他一些交易员则认为K线9和它前面的阴线组成了一个关键的下降急速，或由K线10后面那两根K线组成的双K线急速。所有的长阴线跳水行情都是抛压的显著标志，对于下探至K线14的这波抛售高潮来说，究竟哪根K线所做出的贡献最大，这个问题并不影响大局。跌向K线14的这波抛物线行情中有三次下推（K线9和11为头两次下降小波段）。这往往导致一个持久的反弹，反弹通常从上升通道开始，如图所示。上升通道正是一个下降旗形。","pid":"p514"},{"t":"para","text":"K线15是低点1，精明的交易员预期这个做空形态会失败。实际上，他们甚至认为在低点2处做空、或在楔形下降旗形上做空都将无功而返，像所有通道一样，他们会在前一根K线的低点或其下方介入多头。机构投资者不会在通道中的低点下方卖出，这不是他们的风格。为什么我能够如此确定呢？如果他们真的卖出了，市场就会继续下跌，但既然现在市场上涨了，则证明他们肯定正在买人。到了某个时点，当所有人都意识到这个下降旗形将不会突破下行的时候，空头最终选择了结头寸，有些在低点2后面平仓，有些则在楔形下降旗形之后平仓。结果行情突破上行，如K线19的阳线，而类似的情形在K线20上方再次发生。多头认为K线3、9和11正在形成一个楔形上升旗形，当市场跌破K线11时，楔形破产，市场崩盘。但空头突破只维持了一个小波段，因为当前的形态已经演变为一个急速高潮底。","pid":"p515"},{"t":"para","text":"从K线14开始连续四根阳线表明市场存在一定买压。第四根阳线是一次对低点1的向上突破。K线17是一个低点2或低点3的人场形态，它非但没能触发做空信号，市场反而向上突破连续走出两根阳线。K线18是一个被一个价位的突破而触发的楔形下降旗形入场信号，然后市场却反转上行并突破至K线19。K线20是一次从移动平均线缺口K线做空形态的向上反转，此次反转由三根阳线构成。下降旗形正在成型，和早前一些对下降旗形的多头突破不同，这次行情后续连着走出几根阳线。这使交易员确信市场现在已经翻转为多头态势，他们不再预期下降旗形能够有所突破。","pid":"p516"},{"t":"para","text":"K线12是一个上升旗形的起点，跟在从K线11低点开始的上涨运动之后。K线12前面的那根阴线是第一次下推，K线12后面的两根阴线形成了第二次下推，它们构造出一个潜在的高点2上升旗形，并有可能引出第二个上升小波段。接下来是一根阳线，因而出现了双K线反转的买入信号，但市场并没有突破上行走出第二个上升小波段，而是以一根强势的阴线突破下行。这根阴线使多头放弃他们原先的观点，并且在几根K线内都不会再次买入。K线13是对上升旗形空头突破后的一次回调，也是行情暴跌至K线14的起点，K线9、11和14这三次下推构成一个抛物线式的楔形反转形态。","pid":"p517"},{"t":"para","text":"当下降旗形突破上行时，如K线19，多头需要有根阳线收在旗形顶部上方，以确保空头放弃之前认为反弹只是熊市中一次回调的观点。同样道理，当上升旗形突破下行时，交易员们希望看到有根强势的阴线收在旗形底部下方，比如K线13前面倒数第二根K线。交易员们看到高点2上升旗形正在成型，但如果有根阴线收盘价远低于旗形，交易员们便推断多头的看涨预期不再有效，市场很可能下探至少两个小波段。","pid":"p518"},{"t":"para","text":"有时交易员想在上升旗形上买人，但做多形态一直未能触发，市场反而突破下行。","pid":"p519"},{"t":"img","src":"assets/img/p1c7_006.webp","ctx":[{"t":"当下降旗形突破上行时，如K线19，多头需要有根阳线收在旗形顶部上方，以确保空头放弃之前认为反弹只是熊市中一次回调的观点。同样道理，当上升旗形突破下行时，交易员们希望看到有根强势的阴线收在旗形底部下方，比如K线13前面倒数第二根K线。交易员们看到高点2上升旗形正在成型，但如果有根阴线收盘价远低于旗形，交易员们便推断多头的看涨预期不再有效，市场很可能下探至少两个小波段。","p":"p518"},{"t":"有时交易员想在上升旗形上买人，但做多形态一直未能触发，市场反而突破下行。","p":"p519"},{"t":"如图7.6所示，一股强劲的上升动能直接将价格推至K线20，当市场开始回调时，交易员们也开始寻找做多的时机，他们认为在如此强劲的上涨势头之后行情很有可能再次冲击高点。然而，市场再也没有向上突破延伸至K线22的微型通道，而是下行至K线23。这使得从K线20到K线22的价格运行成为上涨趋势中的最终旗形，即使行情从未出现过多头突破。一旦如K线23这样的大型阴线形成，多头便放弃再做多一把的念头，转而认为价格至少走出一波幅度与旗形高度相当的下跌行情。空头也看到了这次空头突破，并产生同样的预期。既然市场下方若干价位无人买入，价格便快速跌向收盘价。当行情下跌时，反拉力量疲弱的盘面触发了以市场动能为指标的做空程序，从而增强抛盘力度。","p":"p520"},{"t":"强势的飙升行情一旦出现带长上影线的阳线甚至阴线，交易员们通常可以在收盘的位置买入，赶在市场开始调整之前最后搏一把。K线20前的那根K线上影线很长，敏锐的交易员会将之视为市场不久后可能出现回调的信号。由于K线20同时也是从K线14低点处的第三次上推交易员会怀疑这可能是上涨高潮的顶部。不过，如果市场在回调过程中形成了合理的做多入场形态，他们会在信号K线上方设置条件单以确保买入。但价格一直没有超越前一根K线的高点，从而所设的条件单也未能被触发，希望在高点处做多的多头一直没有机会入场。","p":"p521"},{"t":"K线15、17和20构成抛物线型的楔形顶，这也是一种典型的买人高潮。小型的最终旗形可能会引起开盘反转。","p":"p522"}]},{"t":"para","text":"如图7.6所示，一股强劲的上升动能直接将价格推至K线20，当市场开始回调时，交易员们也开始寻找做多的时机，他们认为在如此强劲的上涨势头之后行情很有可能再次冲击高点。然而，市场再也没有向上突破延伸至K线22的微型通道，而是下行至K线23。这使得从K线20到K线22的价格运行成为上涨趋势中的最终旗形，即使行情从未出现过多头突破。一旦如K线23这样的大型阴线形成，多头便放弃再做多一把的念头，转而认为价格至少走出一波幅度与旗形高度相当的下跌行情。空头也看到了这次空头突破，并产生同样的预期。既然市场下方若干价位无人买入，价格便快速跌向收盘价。当行情下跌时，反拉力量疲弱的盘面触发了以市场动能为指标的做空程序，从而增强抛盘力度。","pid":"p520"},{"t":"para","text":"强势的飙升行情一旦出现带长上影线的阳线甚至阴线，交易员们通常可以在收盘的位置买入，赶在市场开始调整之前最后搏一把。K线20前的那根K线上影线很长，敏锐的交易员会将之视为市场不久后可能出现回调的信号。由于K线20同时也是从K线14低点处的第三次上推交易员会怀疑这可能是上涨高潮的顶部。不过，如果市场在回调过程中形成了合理的做多入场形态，他们会在信号K线上方设置条件单以确保买入。但价格一直没有超越前一根K线的高点，从而所设的条件单也未能被触发，希望在高点处做多的多头一直没有机会入场。","pid":"p521"},{"t":"para","text":"K线15、17和20构成抛物线型的楔形顶，这也是一种典型的买人高潮。小型的最终旗形可能会引起开盘反转。","pid":"p522"},{"t":"img","src":"assets/img/p1c7_007.webp","ctx":[{"t":"强势的飙升行情一旦出现带长上影线的阳线甚至阴线，交易员们通常可以在收盘的位置买入，赶在市场开始调整之前最后搏一把。K线20前的那根K线上影线很长，敏锐的交易员会将之视为市场不久后可能出现回调的信号。由于K线20同时也是从K线14低点处的第三次上推交易员会怀疑这可能是上涨高潮的顶部。不过，如果市场在回调过程中形成了合理的做多入场形态，他们会在信号K线上方设置条件单以确保买入。但价格一直没有超越前一根K线的高点，从而所设的条件单也未能被触发，希望在高点处做多的多头一直没有机会入场。","p":"p521"},{"t":"K线15、17和20构成抛物线型的楔形顶，这也是一种典型的买人高潮。小型的最终旗形可能会引起开盘反转。","p":"p522"},{"t":"图7.7中，市场开盘向上跳空，一举突破下跌趋势线，紧接着走出三根长阴线，然后在K线3这根巨型阴线中结束。K线2尝试向上突破下降通道未能成功。K线4是一个小型下降旗形做空入场形态。鉴于市场在这个点位上的交易热情以及对昨天趋势线的突破，交易员们正预期该形态将成为一个最终旗形，从而在试探K线1熊市低点后使行情反转向上。","p":"p523"},{"t":"K线5又是一根巨型阴线，K线6是一个双内含线的做多机会，预期市场将走出一波至少维持10根K线以上包含两个上升小波段的反弹行情。K线5上大概成交了105000张合约，比平均交易量或近期普通K线的交易量大了将近10倍，这预示着这可能是一个连续抛售高潮的底部。第二回合的上升小波段结束于第二天的K线9。大型阴线所展现的下行动能通常会使交易员们推动市场下跌，并在接下来的一两天内再次试探低点。虽然在图中没有展示出来，K线9高点在当天晚些时候引起一波抛盘，价格远远跌破K线5低点。交易员们把这次连续的抛售高潮看作是买入机会。许多空头在K线5收盘价附近平仓，而激进的多头则在此处开仓。当K线6向上突破多头双内含线形态时，其他交易员也会跟上做多，并预期从昨天低点处反转向上的二次尝试将成为当天行情的底部。他们所面临的风险可能涵盖K线5的振幅，也可能只有两三个点。而目标盈利则覆盖了K线5,对移动平均线的测试，基于K线5高度的一波上涨行情，以及当天高点。","p":"p524"},{"t":"单K线或双K线最终旗形也能引发大规模的行情反转，即使这种最终旗形跟在强劲上涨势头后面。这种情况更多发生在开盘时，开盘时常常能见到一些迅猛的反转。在图7.8中，K线3就是一次双K线回调，并出现在巨型阳线的买入高潮之后，因此它有可能形成一个最终旗形。","p":"p525"},{"t":"K线4是一个双内含线最终旗形做空入场形态，预期市场延伸出一波双波段调整行情，这里事实亦是如此。K线3上升旗形结果成为最终旗形，突破失败并在K线4后反转下行。请注意，双内含线的第二根K线以阴线收盘，交易员在这里做空的话总是有机可乘。","p":"p526"},{"t":"涨至K线4高点的强劲动能使得交易员们有动力推动市场在当天晚些时候再次上扬冲击趋势高点。","p":"p527"},{"t":"从K线3到K线5的行情演变成一个稍大级别的楔形上升旗形，以K线3为楔形首推，K线5为楔形三推。第二次下推为K线5前面倒数第三根K线。当市场在K线6次高点反转下行时，这里就构成一个最终旗形。","p":"p528"},{"t":"反弹至K线6的行情是一个楔形下降旗形，并形成了主要趋势反转更低的高点，其中K线5前面那根K线为第一次上推。","p":"p529"},{"t":"K线7从内含线处反转上行，这根内含线成为下跌行情的最终旗形。","p":"p530"}]},{"t":"para","text":"图7.7中，市场开盘向上跳空，一举突破下跌趋势线，紧接着走出三根长阴线，然后在K线3这根巨型阴线中结束。K线2尝试向上突破下降通道未能成功。K线4是一个小型下降旗形做空入场形态。鉴于市场在这个点位上的交易热情以及对昨天趋势线的突破，交易员们正预期该形态将成为一个最终旗形，从而在试探K线1熊市低点后使行情反转向上。","pid":"p523"},{"t":"para","text":"K线5又是一根巨型阴线，K线6是一个双内含线的做多机会，预期市场将走出一波至少维持10根K线以上包含两个上升小波段的反弹行情。K线5上大概成交了105000张合约，比平均交易量或近期普通K线的交易量大了将近10倍，这预示着这可能是一个连续抛售高潮的底部。第二回合的上升小波段结束于第二天的K线9。大型阴线所展现的下行动能通常会使交易员们推动市场下跌，并在接下来的一两天内再次试探低点。虽然在图中没有展示出来，K线9高点在当天晚些时候引起一波抛盘，价格远远跌破K线5低点。交易员们把这次连续的抛售高潮看作是买入机会。许多空头在K线5收盘价附近平仓，而激进的多头则在此处开仓。当K线6向上突破多头双内含线形态时，其他交易员也会跟上做多，并预期从昨天低点处反转向上的二次尝试将成为当天行情的底部。他们所面临的风险可能涵盖K线5的振幅，也可能只有两三个点。而目标盈利则覆盖了K线5,对移动平均线的测试，基于K线5高度的一波上涨行情，以及当天高点。","pid":"p524"},{"t":"para","text":"单K线或双K线最终旗形也能引发大规模的行情反转，即使这种最终旗形跟在强劲上涨势头后面。这种情况更多发生在开盘时，开盘时常常能见到一些迅猛的反转。在图7.8中，K线3就是一次双K线回调，并出现在巨型阳线的买入高潮之后，因此它有可能形成一个最终旗形。","pid":"p525"},{"t":"para","text":"K线4是一个双内含线最终旗形做空入场形态，预期市场延伸出一波双波段调整行情，这里事实亦是如此。K线3上升旗形结果成为最终旗形，突破失败并在K线4后反转下行。请注意，双内含线的第二根K线以阴线收盘，交易员在这里做空的话总是有机可乘。","pid":"p526"},{"t":"para","text":"涨至K线4高点的强劲动能使得交易员们有动力推动市场在当天晚些时候再次上扬冲击趋势高点。","pid":"p527"},{"t":"para","text":"从K线3到K线5的行情演变成一个稍大级别的楔形上升旗形，以K线3为楔形首推，K线5为楔形三推。第二次下推为K线5前面倒数第三根K线。当市场在K线6次高点反转下行时，这里就构成一个最终旗形。","pid":"p528"},{"t":"para","text":"反弹至K线6的行情是一个楔形下降旗形，并形成了主要趋势反转更低的高点，其中K线5前面那根K线为第一次上推。","pid":"p529"},{"t":"para","text":"K线7从内含线处反转上行，这根内含线成为下跌行情的最终旗形。","pid":"p530"},{"t":"img","src":"assets/img/p1c7_008.webp","ctx":[{"t":"反弹至K线6的行情是一个楔形下降旗形，并形成了主要趋势反转更低的高点，其中K线5前面那根K线为第一次上推。","p":"p529"},{"t":"K线7从内含线处反转上行，这根内含线成为下跌行情的最终旗形。","p":"p530"},{"t":"如图7.9所示，K线2突破了之前的单K线最终旗形，此时不失为一次成功的做空刮头皮机会。然后该形态演变为一个更大级别的楔形下降旗形（又一个最终旗形），结束于K线3。第一回合的上升小波段为第一个小级别最终旗形的顶部，即K线2前面的那根内含阳线。第二回合的上升小波段为K线2后面的那根大型内含线。这根内含阳线的上影线 较短，接下来后面那根K线则主体部分较短。行情从K线2低点上涨至K线2后面那根阳线顶部，价格回落形成的上影线以及接下来的那根短阳线使行情进入休整。最后一次上推即为K线3。从更小级别的时间周期图来看，可以更清晰地看到价格在此处形成一个楔形，但我们也可以从这个图中判断出来。有些交易员会把这种形态看作一个简单的低点2做空机会，其中K线2则为低点1入场K线。","p":"p531"},{"t":"市场在K线4处反转上行，该形态也演变为更大级别的楔形下降旗形，并结束于K线6。价格涨至K线3为第一次上推，剩下的两次上升小波段分别以K线5（或者其后的一个波段高点）和K线6为终点。有些交易员把K线5和K线6看作第一次与第三次上推。结束于K线5的上升通道包含两个回合的小型波段，而在K线5之后反弹至K线6的运动则走出了两次更为清晰的小波段行情。","p":"p532"},{"t":"对下降楔形的突破使我们有机会做一笔不错的刮头皮交易，但价格并没有形成新的波段低点。K线7形成主要趋势反转的次低点，并在K线8处得到测试，该形态构成的双重底上升旗形，成为次低点主要趋势反转的二次人场机会。紧接着的反弹又构成了更大级别的下降楔形，并结束于K线9。头两回合的上升小波段分别将价格推向K线3和K线6的高点。虽然在K线3第一次上推之后，K线4处行情深度回踩形成更低的低点，但无关紧要，这只是一种常见的楔形变体。","p":"p533"},{"t":"为什么我们坚持认为所看到的一切形态都是逐渐增大规模的下降旗形呢？因为它们真实存在，市场也借此机会告诉交易员们，行情尚未反转进入一轮强劲的牛市。多头试图向上突破K线8的双重底上升旗形以及头肩底，但却铩羽而归。连续K线3与K线6高点得到一条趋势通道线，市场在K线9这一上升通道的顶部反转下行，这表明试图突破这条趋势通道线的尝试也以失败告终。该头肩底如其他头肩形一样，一如既往地没能形成反转，而是演变为一个下降旗形（该形态少许向上倾斜比起三角形来更像是一个楔形），行情进入持续整理态势。市场在第二天跌破了K线4的低点。","p":"p534"}]},{"t":"para","text":"如图7.9所示，K线2突破了之前的单K线最终旗形，此时不失为一次成功的做空刮头皮机会。然后该形态演变为一个更大级别的楔形下降旗形（又一个最终旗形），结束于K线3。第一回合的上升小波段为第一个小级别最终旗形的顶部，即K线2前面的那根内含阳线。第二回合的上升小波段为K线2后面的那根大型内含线。这根内含阳线的上影线 较短，接下来后面那根K线则主体部分较短。行情从K线2低点上涨至K线2后面那根阳线顶部，价格回落形成的上影线以及接下来的那根短阳线使行情进入休整。最后一次上推即为K线3。从更小级别的时间周期图来看，可以更清晰地看到价格在此处形成一个楔形，但我们也可以从这个图中判断出来。有些交易员会把这种形态看作一个简单的低点2做空机会，其中K线2则为低点1入场K线。","pid":"p531"},{"t":"para","text":"市场在K线4处反转上行，该形态也演变为更大级别的楔形下降旗形，并结束于K线6。价格涨至K线3为第一次上推，剩下的两次上升小波段分别以K线5（或者其后的一个波段高点）和K线6为终点。有些交易员把K线5和K线6看作第一次与第三次上推。结束于K线5的上升通道包含两个回合的小型波段，而在K线5之后反弹至K线6的运动则走出了两次更为清晰的小波段行情。","pid":"p532"},{"t":"para","text":"对下降楔形的突破使我们有机会做一笔不错的刮头皮交易，但价格并没有形成新的波段低点。K线7形成主要趋势反转的次低点，并在K线8处得到测试，该形态构成的双重底上升旗形，成为次低点主要趋势反转的二次人场机会。紧接着的反弹又构成了更大级别的下降楔形，并结束于K线9。头两回合的上升小波段分别将价格推向K线3和K线6的高点。虽然在K线3第一次上推之后，K线4处行情深度回踩形成更低的低点，但无关紧要，这只是一种常见的楔形变体。","pid":"p533"},{"t":"para","text":"为什么我们坚持认为所看到的一切形态都是逐渐增大规模的下降旗形呢？因为它们真实存在，市场也借此机会告诉交易员们，行情尚未反转进入一轮强劲的牛市。多头试图向上突破K线8的双重底上升旗形以及头肩底，但却铩羽而归。连续K线3与K线6高点得到一条趋势通道线，市场在K线9这一上升通道的顶部反转下行，这表明试图突破这条趋势通道线的尝试也以失败告终。该头肩底如其他头肩形一样，一如既往地没能形成反转，而是演变为一个下降旗形（该形态少许向上倾斜比起三角形来更像是一个楔形），行情进入持续整理态势。市场在第二天跌破了K线4的低点。","pid":"p534"},{"t":"img","src":"assets/img/p1c7_009.webp","ctx":[{"t":"对下降楔形的突破使我们有机会做一笔不错的刮头皮交易，但价格并没有形成新的波段低点。K线7形成主要趋势反转的次低点，并在K线8处得到测试，该形态构成的双重底上升旗形，成为次低点主要趋势反转的二次人场机会。紧接着的反弹又构成了更大级别的下降楔形，并结束于K线9。头两回合的上升小波段分别将价格推向K线3和K线6的高点。虽然在K线3第一次上推之后，K线4处行情深度回踩形成更低的低点，但无关紧要，这只是一种常见的楔形变体。","p":"p533"},{"t":"为什么我们坚持认为所看到的一切形态都是逐渐增大规模的下降旗形呢？因为它们真实存在，市场也借此机会告诉交易员们，行情尚未反转进入一轮强劲的牛市。多头试图向上突破K线8的双重底上升旗形以及头肩底，但却铩羽而归。连续K线3与K线6高点得到一条趋势通道线，市场在K线9这一上升通道的顶部反转下行，这表明试图突破这条趋势通道线的尝试也以失败告终。该头肩底如其他头肩形一样，一如既往地没能形成反转，而是演变为一个下降旗形（该形态少许向上倾斜比起三角形来更像是一个楔形），行情进入持续整理态势。市场在第二天跌破了K线4的低点。","p":"p534"},{"t":"如图7.10所示，价格开盘向上跳空并强势上涨至K线5，交易员们并不确定行情是否会开盘向下反转，并形成当天高点或高点1上升旗形然后走出一段上升通道。他们密切关注市场从K线5高点回调的情况。从K线5到K线6，交易员们认为市场可能正在形成一个上升旗形。不过，K线7这根大型阴线收于它的最低点，并跌破K线4这根大型阳线底部。K线7的收盘价比它前一根K线低了很多个价位，尝试形成一个突破缺口。许多交易员预期市场正在翻转，空头即将占据主导地位，并走出一波抛售行情，于是在K线7结束时做空，并将止损价设在其高点上方。K线5也许可以成为当天最高点，如果市场跌破K线3这一暂时的最低点，就很有可能继续下行，走出一波可测量的下跌行情。大多数交易员在这种情况下都相信K线5成为当天最高点的概率很大。后续几根K线的走势更令交易员确信市场已经翻转为空头态势。他们预期价格将跌破开盘时段的K线3底部，并下探一定幅度。价格下探至K线14的跌幅恰恰为开盘时段的突破高度，很多空头选择在这里获利了结。","p":"p535"},{"t":"由于交易员把从K线5到K线6这一段看作一个上升旗形，因此它是反弹的最终旗形，尽管价格从未突破上行。","p":"p536"},{"t":"K线16是一个双重底，或略微更低低点的主要趋势反转形态，但随之而来的却是一段震荡区间，而非牛市。主要趋势反转形态之后行情更常呈现震荡态势，而非真正趋势反转。","p":"p537"}]},{"t":"para","text":"如图7.10所示，价格开盘向上跳空并强势上涨至K线5，交易员们并不确定行情是否会开盘向下反转，并形成当天高点或高点1上升旗形然后走出一段上升通道。他们密切关注市场从K线5高点回调的情况。从K线5到K线6，交易员们认为市场可能正在形成一个上升旗形。不过，K线7这根大型阴线收于它的最低点，并跌破K线4这根大型阳线底部。K线7的收盘价比它前一根K线低了很多个价位，尝试形成一个突破缺口。许多交易员预期市场正在翻转，空头即将占据主导地位，并走出一波抛售行情，于是在K线7结束时做空，并将止损价设在其高点上方。K线5也许可以成为当天最高点，如果市场跌破K线3这一暂时的最低点，就很有可能继续下行，走出一波可测量的下跌行情。大多数交易员在这种情况下都相信K线5成为当天最高点的概率很大。后续几根K线的走势更令交易员确信市场已经翻转为空头态势。他们预期价格将跌破开盘时段的K线3底部，并下探一定幅度。价格下探至K线14的跌幅恰恰为开盘时段的突破高度，很多空头选择在这里获利了结。","pid":"p535"},{"t":"para","text":"由于交易员把从K线5到K线6这一段看作一个上升旗形，因此它是反弹的最终旗形，尽管价格从未突破上行。","pid":"p536"},{"t":"para","text":"K线16是一个双重底，或略微更低低点的主要趋势反转形态，但随之而来的却是一段震荡区间，而非牛市。主要趋势反转形态之后行情更常呈现震荡态势，而非真正趋势反转。","pid":"p537"},{"t":"img","src":"assets/img/p1c7_010.webp","ctx":[{"t":"由于交易员把从K线5到K线6这一段看作一个上升旗形，因此它是反弹的最终旗形，尽管价格从未突破上行。","p":"p536"},{"t":"K线16是一个双重底，或略微更低低点的主要趋势反转形态，但随之而来的却是一段震荡区间，而非牛市。主要趋势反转形态之后行情更常呈现震荡态势，而非真正趋势反转。","p":"p537"},{"t":"如图7.11所示的道琼斯工业平均指数月线图，有很多高潮后的单K线或双K线最终旗形。有些引发行情反转，如K线8、12、16和19（缩略图详细展示了K线12和19的情况），其他的有些则导致行情回调，如K线5、10（左手边的缩略图详细展示了K线10的情况）、13和21。有些最后形成普通旗形而非最终旗形，如K线4、15和23，有些则触发反转信号但最终反转失败，演变成趋势中的一次回调（K线13和K线21就是最终旗形反转失败的例子，因为市场在旗形之后反转下行，但却分别在K线14和23处恢复上涨趋势）。一旦出现一波涨跌高潮，然后形成一个短小的旗形，接着旗形被突破，那么此次突破一般都足以带出另一波行情高潮。连续的高潮之后，市场往往倾向于发生双波段反转，并维持在10根K线的时间左右。当高潮触碰关键的支撑位或阻力位时，往往引发强力反转，如K线20。当市场向下跌破K线19时，我告诉许多朋","p":"p538"},{"t":"友，这里可能会导致强劲的多头反转，因为K线18的熊市低点下方正好是20年上涨趋势线的位置。K线11低点处也有支撑，使得市场形成一个双重底上升旗形。交易员们意识到K线25有可能成为更低的高点，这个次高点将构成潜在头肩顶的右肩。在过去的两个月里，我一直告诉朋友们，K线24有可能成为反弹的最终旗形。如果事实真的如此，那么此次反转应该有望持续10根K线（10个月）的时间，并至少包含两个小波段。市场应该在K线22高点、K线23低点、移动平均线（图中未显示）或K线20低点这些位置寻找支撑。","p":"p539"}]},{"t":"para","text":"如图7.11所示的道琼斯工业平均指数月线图，有很多高潮后的单K线或双K线最终旗形。有些引发行情反转，如K线8、12、16和19（缩略图详细展示了K线12和19的情况），其他的有些则导致行情回调，如K线5、10（左手边的缩略图详细展示了K线10的情况）、13和21。有些最后形成普通旗形而非最终旗形，如K线4、15和23，有些则触发反转信号但最终反转失败，演变成趋势中的一次回调（K线13和K线21就是最终旗形反转失败的例子，因为市场在旗形之后反转下行，但却分别在K线14和23处恢复上涨趋势）。一旦出现一波涨跌高潮，然后形成一个短小的旗形，接着旗形被突破，那么此次突破一般都足以带出另一波行情高潮。连续的高潮之后，市场往往倾向于发生双波段反转，并维持在10根K线的时间左右。当高潮触碰关键的支撑位或阻力位时，往往引发强力反转，如K线20。当市场向下跌破K线19时，我告诉许多朋","pid":"p538"},{"t":"para","text":"友，这里可能会导致强劲的多头反转，因为K线18的熊市低点下方正好是20年上涨趋势线的位置。K线11低点处也有支撑，使得市场形成一个双重底上升旗形。交易员们意识到K线25有可能成为更低的高点，这个次高点将构成潜在头肩顶的右肩。在过去的两个月里，我一直告诉朋友们，K线24有可能成为反弹的最终旗形。如果事实真的如此，那么此次反转应该有望持续10根K线（10个月）的时间，并至少包含两个小波段。市场应该在K线22高点、K线23低点、移动平均线（图中未显示）或K线20低点这些位置寻找支撑。","pid":"p539"}],"wcount":12803},{"id":"p1c8","title":"第8章 双重顶和双重底的回调","blocks":[{"t":"para","text":"第8章 双重顶和双重底的回调","pid":"p540"},{"t":"para","text":"如果市场下跌后形成一个双重底，在牛市启动前，行情会先回调形成一个更高的低点，略高于双重底低点，并试探该低点，这是一个双重底回调的做多入场形态。双重底并不一定非常精确，第二个底部往往略低于第一个底部，有时候使该形态也呈现为一个头肩底。如果第二个底部未能到达第一个底部的位置，那么该底部有可能只是走出一段双波段横盘整理的上涨修正行情，因此这种情况下我们最好是寻找刮头皮做多的交易机会，而不是进行波段交易。双重底（双重顶）回调形态也可以看作三推底（或三重底、三角形），其中第三次下推缺乏足够的空头力量将价格推至新低。这种形态总是在某个支撑水平上形成，就如熊市中的每一次上涨一样。如果第一个底部的反抽势头足够强劲，交易员们就会开始怀疑当前的趋势是否已经演变成区间震荡的行情，甚至反转进入牛市。在震荡区间里，每一次下跌运动都是一个上升旗形，而每一次上涨运动都是一个下降旗形。如果市场处于一轮牛市的初期阶段，那么每一次下跌运动也属于上升旗形。无论市场进入一段震荡区间还是一轮新的牛市，第一波反弹之后的下跌都是一个上升旗形，即使价格下探至第一个底部附近。从第二个底部开始的反弹，是对该上升旗形的一次突破。从双重底底部上涨之后的回调（第三次下跌）也是一个上升旗形，无论它结束于双重底上方并形成双重底回调（或三角形），抑或结束于双重底底部并形成三重底，甚至这次回调跌破双重底底部并反转向上形成一次失败的双重底向下突破（实际上是一种最终旗形反转形态)。而这个反弹也是继第二个上升旗形之后的一次回调，该反弹从第三次下推开始，视为向下突破第二个上升旗形的一次突破回调。第三次下推在哪里结束并不重要，整个形态看起来是像三重底，或三角形，或头肩底，或最终旗形，或双重底回调，这些都不重要，它们所代表的意义都是相同的。第三次反转上行构造出一个三浪下推反转形态，交易员们需要寻找做多的机会。当市场形成一个双重底回调，形状规范，并且三个底部的反转阳线尤其最后一根很强势时，该形态就是一个最可靠的做多入场形态之一。","pid":"p541"},{"t":"para","text":"从第二个底部开始的向上波动通常是一次突破，虽然它可能只维持了几根K线的时间。因此接下来的回调也是一次突破回调，而且是最可靠的入场形态之一。它也可以看作是市场两次尝试突破前期极值（常常是低点2)的失败标志，两次无功而返的尝试通常会引发一波反转。有些技术面分析师认为三重底或三重顶到最后总是反转失败，并最终演变为持续整理形态，但他们也要求三次极值必须精确到同一价位才算是真正意义上的三重底或三重顶形态。如果以该定义为标准，由于标准过于严格，所谓的三重底或三重顶其实非常罕见，根本不值一提。此外，不可能由你来告诉市场它该做什么不该做什么，希望控制市场的想法相当傲慢，而这种傲慢总能让你付出沉重的代价，因为这个市场行为的决定权并不在你手里。交易员必须懂得灵活变通才能赚得大钱。如果当前的走势图看起来是一个可靠的人场形态，我们就应该把握机会，乘胜追击。","pid":"p542"},{"t":"para","text":"双重底形态是一种反转形态，而不是类似双重底上升旗形的持续整理形态。虽然两者都是做多的人场形态，但一个出现在趋势启动期（反转形态)，另一个则发生在趋势确立期（持续整理形态)，或至少在一个强势波段出现，且趋势明显呈现的时候。同样道理，如果牛市中出现一个双重顶，然后一波回调逼近原先高点，那么这个双重顶回调就是一个很好的做空入场形态。需要再一次强调的是，三浪推顶以什么形状呈现并不重要，它们所代表的意义都是相同的。如果信号K线足够强势，盘面上也有不小的抛压，那么它就是一个做空的入场形态，不论它看起来像是一个三重顶，三角形，头肩顶，最终旗形，还是双重顶回调。","pid":"p543"},{"t":"para","text":"有时会发生在同一段震荡区间里同时出现双重顶和双重底的情况。通常来说，结果都是价格走势形成一个三角形，这也意味着市场正处于一个蓄势待发的状态当中，随时准备突破。行情倾向于回到震荡区间中部，然后对区间顶部或底部进行测试，由第三推来完成这个三角形的构建。如果这个震荡区间足够大，交易员们可以趁机做些刮头皮交易，揽顶时做空触底时做多。如果入场形态比较规范，则获得潜在风险持平的收益的胜率可达60%左右。如果震荡区间过于狭窄，交易员们可以选择做一笔波段性交易，或等待市场突破。如果突破足够强势，我们就顺势而为，这时获得潜在风险持平的收益的胜率甚至高于70%。如果突破失败，我们就逆势交易。","pid":"p544"},{"t":"img","src":"assets/img/p1c8_001.webp","ctx":[{"t":"双重底形态是一种反转形态，而不是类似双重底上升旗形的持续整理形态。虽然两者都是做多的人场形态，但一个出现在趋势启动期（反转形态)，另一个则发生在趋势确立期（持续整理形态)，或至少在一个强势波段出现，且趋势明显呈现的时候。同样道理，如果牛市中出现一个双重顶，然后一波回调逼近原先高点，那么这个双重顶回调就是一个很好的做空入场形态。需要再一次强调的是，三浪推顶以什么形状呈现并不重要，它们所代表的意义都是相同的。如果信号K线足够强势，盘面上也有不小的抛压，那么它就是一个做空的入场形态，不论它看起来像是一个三重顶，三角形，头肩顶，最终旗形，还是双重顶回调。","p":"p543"},{"t":"有时会发生在同一段震荡区间里同时出现双重顶和双重底的情况。通常来说，结果都是价格走势形成一个三角形，这也意味着市场正处于一个蓄势待发的状态当中，随时准备突破。行情倾向于回到震荡区间中部，然后对区间顶部或底部进行测试，由第三推来完成这个三角形的构建。如果这个震荡区间足够大，交易员们可以趁机做些刮头皮交易，揽顶时做空触底时做多。如果入场形态比较规范，则获得潜在风险持平的收益的胜率可达60%左右。如果震荡区间过于狭窄，交易员们可以选择做一笔波段性交易，或等待市场突破。如果突破足够强势，我们就顺势而为，这时获得潜在风险持平的收益的胜率甚至高于70%。如果突破失败，我们就逆势交易。","p":"p544"},{"t":"如图8.1的SPY月线图所示，价格在外包K线7处超过了前一根K线高点一个价位，形成了一个双重底回调做多入场形态。如果前面那根K线是一个标准的信号K线，那么这根外包阳线就是可靠的入场K线，正如此例。其他一些交易员会在外包阳线的高点上方买人，或在K线7后面那根阳线的收盘价或其高点上方买人，甚在K线7后面第二根阳线的收盘价处买人，因为这根阳线对很多交易员来说已经确立了新一轮上涨趋势。当一波上涨行情启动时，在一根强势的阳线高点上方买入是相对不错的策略，从后面一系列阳线来看便足以论证这一观点。","p":"p545"},{"t":"K线5稍低于K线3，这种情况很常见，实际上这种双重底回调买入形态更为可取。K线6突破了双重底，K线7则是一次双重顶回调，并成功试探了突破型交易员的做多决心。很多交易员把这一形态看作三角形。突破回调是更可靠的入场形态之一，最后往往构成头肩形形态。","p":"p546"},{"t":"K线11是一次由K线8和K线9组成的双重顶的回调。有些交易员把K线11视为主要趋势反转更低的高点，该点位于移动平均线处的低点2，K线11或被视力向下突破双重顶后的一波回调。","p":"p547"},{"t":"K线1和K线2构成了双重顶下降旗形（这是一个持续整理形态，而非双重顶，双重顶是指牛市末端的反转形态）。在熊市中的双重顶永远是一个低点2的做空入场形态，因为它包含了两次上推。多头两次试图反转趋势，均以失败告终，便开始在接下来几根K线的时间内保持观望态度。这种情况下买盘真空，市场加速下跌，逐步扩大跌幅，直到触及支撑位，才能再次找到多头力量。","p":"p548"},{"t":"有时候下降旗形也是一种双重底回调做多入场形态。","p":"p549"}]},{"t":"para","text":"如图8.1的SPY月线图所示，价格在外包K线7处超过了前一根K线高点一个价位，形成了一个双重底回调做多入场形态。如果前面那根K线是一个标准的信号K线，那么这根外包阳线就是可靠的入场K线，正如此例。其他一些交易员会在外包阳线的高点上方买人，或在K线7后面那根阳线的收盘价或其高点上方买人，甚在K线7后面第二根阳线的收盘价处买人，因为这根阳线对很多交易员来说已经确立了新一轮上涨趋势。当一波上涨行情启动时，在一根强势的阳线高点上方买入是相对不错的策略，从后面一系列阳线来看便足以论证这一观点。","pid":"p545"},{"t":"para","text":"K线5稍低于K线3，这种情况很常见，实际上这种双重底回调买入形态更为可取。K线6突破了双重底，K线7则是一次双重顶回调，并成功试探了突破型交易员的做多决心。很多交易员把这一形态看作三角形。突破回调是更可靠的入场形态之一，最后往往构成头肩形形态。","pid":"p546"},{"t":"para","text":"K线11是一次由K线8和K线9组成的双重顶的回调。有些交易员把K线11视为主要趋势反转更低的高点，该点位于移动平均线处的低点2，K线11或被视力向下突破双重顶后的一波回调。","pid":"p547"},{"t":"para","text":"K线1和K线2构成了双重顶下降旗形（这是一个持续整理形态，而非双重顶，双重顶是指牛市末端的反转形态）。在熊市中的双重顶永远是一个低点2的做空入场形态，因为它包含了两次上推。多头两次试图反转趋势，均以失败告终，便开始在接下来几根K线的时间内保持观望态度。这种情况下买盘真空，市场加速下跌，逐步扩大跌幅，直到触及支撑位，才能再次找到多头力量。","pid":"p548"},{"t":"para","text":"有时候下降旗形也是一种双重底回调做多入场形态。","pid":"p549"},{"t":"img","src":"assets/img/p1c8_002.webp","ctx":[{"t":"K线1和K线2构成了双重顶下降旗形（这是一个持续整理形态，而非双重顶，双重顶是指牛市末端的反转形态）。在熊市中的双重顶永远是一个低点2的做空入场形态，因为它包含了两次上推。多头两次试图反转趋势，均以失败告终，便开始在接下来几根K线的时间内保持观望态度。这种情况下买盘真空，市场加速下跌，逐步扩大跌幅，直到触及支撑位，才能再次找到多头力量。","p":"p548"},{"t":"有时候下降旗形也是一种双重底回调做多入场形态。","p":"p549"},{"t":"图8.2中，K线1处的双K线反转位于当天第二回合大级别下降波段的末端，因此这很可能是一个反转形态。不过，双K线反转并不足以构成在狭长下降通道底部买人的理由。虽然价格到达K线2的过程疲态尽显，但不管K线3还是K线4都未能取代K线1低点，因此图形在这里形成了一个双重底上升旗形。有些交易员把K线3看作楔形下降旗形的结尾，楔形的头两推发生在前面倒数第四和第六根K线。这使K线4成为一个小型的突破回调做多入场形态，K线4前面两根K线所形成的上升旗形被小幅向下突破，然后回调。其他一些交易员则把K线3看作下降旗形的向上突破，但这次突破并没能完成任务，使交易员开始猜测该旗形是否为最终旗形，市场是否即将反转上行。","p":"p550"},{"t":"K线6对K线3低点做了一次精准测试，同样没能跌破它（或跌破 K线1低点），因此这里形成了一个宽幅的双重底上升旗形，第一个底部位于K线3处（或K线3和4）。这也被称为底部做多力量的积聚。机构投资者在这里顶着压力守住K线1低点，而不是止损杀跌，这表明他们认为市场即将上涨。","p":"p551"},{"t":"K线5是一个移动平均线缺口K线，常常为趋势反转提供必要的逆势动能。它突破了主要趋势线。K线6回踩形成更高的低点，并测试K线1的趋势极值，这也是对K线5上升潮的一次突破回调。K线6作为次低点，形成了主要趋势反转，并从K线5开始三次下推，也是单K线最终旗形反转形态（始于两根K线之前）。有些双重底回调看起来并不强势，这往往意味着这只是下降旗形的一部分，而非反转形态。","p":"p552"}]},{"t":"para","text":"图8.2中，K线1处的双K线反转位于当天第二回合大级别下降波段的末端，因此这很可能是一个反转形态。不过，双K线反转并不足以构成在狭长下降通道底部买人的理由。虽然价格到达K线2的过程疲态尽显，但不管K线3还是K线4都未能取代K线1低点，因此图形在这里形成了一个双重底上升旗形。有些交易员把K线3看作楔形下降旗形的结尾，楔形的头两推发生在前面倒数第四和第六根K线。这使K线4成为一个小型的突破回调做多入场形态，K线4前面两根K线所形成的上升旗形被小幅向下突破，然后回调。其他一些交易员则把K线3看作下降旗形的向上突破，但这次突破并没能完成任务，使交易员开始猜测该旗形是否为最终旗形，市场是否即将反转上行。","pid":"p550"},{"t":"para","text":"K线6对K线3低点做了一次精准测试，同样没能跌破它（或跌破 K线1低点），因此这里形成了一个宽幅的双重底上升旗形，第一个底部位于K线3处（或K线3和4）。这也被称为底部做多力量的积聚。机构投资者在这里顶着压力守住K线1低点，而不是止损杀跌，这表明他们认为市场即将上涨。","pid":"p551"},{"t":"para","text":"K线5是一个移动平均线缺口K线，常常为趋势反转提供必要的逆势动能。它突破了主要趋势线。K线6回踩形成更高的低点，并测试K线1的趋势极值，这也是对K线5上升潮的一次突破回调。K线6作为次低点，形成了主要趋势反转，并从K线5开始三次下推，也是单K线最终旗形反转形态（始于两根K线之前）。有些双重底回调看起来并不强势，这往往意味着这只是下降旗形的一部分，而非反转形态。","pid":"p552"},{"t":"img","src":"assets/img/p1c8_003.webp","ctx":[{"t":"K线6对K线3低点做了一次精准测试，同样没能跌破它（或跌破 K线1低点），因此这里形成了一个宽幅的双重底上升旗形，第一个底部位于K线3处（或K线3和4）。这也被称为底部做多力量的积聚。机构投资者在这里顶着压力守住K线1低点，而不是止损杀跌，这表明他们认为市场即将上涨。","p":"p551"},{"t":"K线5是一个移动平均线缺口K线，常常为趋势反转提供必要的逆势动能。它突破了主要趋势线。K线6回踩形成更高的低点，并测试K线1的趋势极值，这也是对K线5上升潮的一次突破回调。K线6作为次低点，形成了主要趋势反转，并从K线5开始三次下推，也是单K线最终旗形反转形态（始于两根K线之前）。有些双重底回调看起来并不强势，这往往意味着这只是下降旗形的一部分，而非反转形态。","p":"p552"},{"t":"在图8.3中，K线4看起来是一个双重底回调的做多人场形态，但在轮非常强劲的熊市当中，K线3只比K线2低点高出5美分。这种仅仅略高一点的次低点通常起到否定整个形态的作用，","p":"p553"},{"t":"接下来更可能引起第二回合小波段的行情下挫，而不是走出新一轮牛市。同时，一轮强势下跌趋势的低点之后的任何小型回调几乎都能构建出一个顺势的人场时机，此时去寻找市场底部并非明智之举。不过，如果交易员依然在做多信号处介入多头的话，还是能把握市场反弹的机会盈利超过1美元。K线2、3和4的下影线都很长，市场刚刚开盘90分钟，很可能发生开盘反转，因此在K线4处做多，也是一个合理的选择。最精明的交易员则会在价格冲击移动平均线时做空，行情在此处形成一个三角形（这里有三次上推，K线2后面的两根K线为第一次上推，K线4前面的那根K线为第二次上推）。如果你在K线4处选择进行做多的刮头皮交易，那么后面可能很难迅速切换到做空的思路。","p":"p554"},{"t":"K线8是一个双重底回调入场形态，K线7比K线6低点低了13美分，但入场信号一直未被触发（K线8后面那根K线没能取代K线8高点）。再次强调一下，在一轮强势的熊市中，在先前没有出现强有力的趋势线突破的情况下寻找市场底部并不是一个好办法。市场在一条狭窄的下降通道中运行，通道一般持续的时间要比理论上更久。如果行情走出第一波强势的多头突破，然后回调，或其他类型的反转，比如震荡区间在K线11处结束，并开始一波下跌潮，然后形成最终旗形试图反转，交易员们才会考虑做多。即使这样，由于缺少早前的反弹，任何一次反转都更可能引出一段震荡行情而非新一轮牛市，因此任何一笔做多的交易都只是一次刮头皮机会。","p":"p555"},{"t":"K线11是市场筑底的第三次尝试。K线10的低点比K线9低点高出2美分。在双重底位置买人的交易员将退出离场，或者在K线11低点2冲击移动平均线时反手做空。最老到的交易员则不会在疲弱的双重底上做多，他们保持密切关注，预期该双重底形态反转失败，然后在K线11低点2处抛出。","p":"p556"},{"t":"当天收盘时，行情呈现一个小级别的双重底上升旗形，后面跟着一根内含线。内含线对行情做一次休整，也算是一次回调，内含线完成了小级别双重底回调做多入场形态的构建。","p":"p557"},{"t":"K线2和K线3构成了一个双重底，但在同一段震荡区间里，也存在一个双重顶。每当双重底和双重顶同时出现在一段震荡行情里，价格总是倾向回归区间中部，从而构造出一个三角形，正如此例所示的K线4。震荡行情继续横盘整理，最终不出意料地突破原先趋势。","p":"p558"}]},{"t":"para","text":"在图8.3中，K线4看起来是一个双重底回调的做多人场形态，但在轮非常强劲的熊市当中，K线3只比K线2低点高出5美分。这种仅仅略高一点的次低点通常起到否定整个形态的作用，","pid":"p553"},{"t":"para","text":"接下来更可能引起第二回合小波段的行情下挫，而不是走出新一轮牛市。同时，一轮强势下跌趋势的低点之后的任何小型回调几乎都能构建出一个顺势的人场时机，此时去寻找市场底部并非明智之举。不过，如果交易员依然在做多信号处介入多头的话，还是能把握市场反弹的机会盈利超过1美元。K线2、3和4的下影线都很长，市场刚刚开盘90分钟，很可能发生开盘反转，因此在K线4处做多，也是一个合理的选择。最精明的交易员则会在价格冲击移动平均线时做空，行情在此处形成一个三角形（这里有三次上推，K线2后面的两根K线为第一次上推，K线4前面的那根K线为第二次上推）。如果你在K线4处选择进行做多的刮头皮交易，那么后面可能很难迅速切换到做空的思路。","pid":"p554"},{"t":"para","text":"K线8是一个双重底回调入场形态，K线7比K线6低点低了13美分，但入场信号一直未被触发（K线8后面那根K线没能取代K线8高点）。再次强调一下，在一轮强势的熊市中，在先前没有出现强有力的趋势线突破的情况下寻找市场底部并不是一个好办法。市场在一条狭窄的下降通道中运行，通道一般持续的时间要比理论上更久。如果行情走出第一波强势的多头突破，然后回调，或其他类型的反转，比如震荡区间在K线11处结束，并开始一波下跌潮，然后形成最终旗形试图反转，交易员们才会考虑做多。即使这样，由于缺少早前的反弹，任何一次反转都更可能引出一段震荡行情而非新一轮牛市，因此任何一笔做多的交易都只是一次刮头皮机会。","pid":"p555"},{"t":"para","text":"K线11是市场筑底的第三次尝试。K线10的低点比K线9低点高出2美分。在双重底位置买人的交易员将退出离场，或者在K线11低点2冲击移动平均线时反手做空。最老到的交易员则不会在疲弱的双重底上做多，他们保持密切关注，预期该双重底形态反转失败，然后在K线11低点2处抛出。","pid":"p556"},{"t":"para","text":"当天收盘时，行情呈现一个小级别的双重底上升旗形，后面跟着一根内含线。内含线对行情做一次休整，也算是一次回调，内含线完成了小级别双重底回调做多入场形态的构建。","pid":"p557"},{"t":"para","text":"K线2和K线3构成了一个双重底，但在同一段震荡区间里，也存在一个双重顶。每当双重底和双重顶同时出现在一段震荡行情里，价格总是倾向回归区间中部，从而构造出一个三角形，正如此例所示的K线4。震荡行情继续横盘整理，最终不出意料地突破原先趋势。","pid":"p558"},{"t":"img","src":"assets/img/p1c8_004.webp","ctx":[{"t":"当天收盘时，行情呈现一个小级别的双重底上升旗形，后面跟着一根内含线。内含线对行情做一次休整，也算是一次回调，内含线完成了小级别双重底回调做多入场形态的构建。","p":"p557"},{"t":"K线2和K线3构成了一个双重底，但在同一段震荡区间里，也存在一个双重顶。每当双重底和双重顶同时出现在一段震荡行情里，价格总是倾向回归区间中部，从而构造出一个三角形，正如此例所示的K线4。震荡行情继续横盘整理，最终不出意料地突破原先趋势。","p":"p558"},{"t":"如图8.4所示，电子迷你期货当日出现了双重底回调和双重顶回调两种反转形态。K线1和K线2组成了一个双重底，虽然K线1乍一看可能容易被忽略。入场K线底部在其下方形成了一个保护性止损，它常常会被测试，比如被K线2测试，价格两次下探到达同一价位形成一个双重底，尽管第一次下跌并没有形成波段低点。由于K线1的下影线很长，所以我们几乎可以肯定在1分钟图里，这里会出现一个更高的低点(事实也是如此）。K线3深度回调，测试了该双重底，第二次尝试触发止损信号。K线2首次试探前期低点，在空头撤离多头占据主导之前，价格有可能再也逼近不了K线2低点。有些交易员把K线2和K线3看成双重底上升旗形，而其他交易员则认为是一个三重底上升旗形，或双重底回调。你把它看成何种形态其实并不重要，重要的是它们都是做多的入场形态。","p":"p559"},{"t":"在这个趋势震荡的交易日中，K线4和K线5构建了一个双重底上升旗形。这个双重底在K线6回调时得到测试，并形成一个更大级别的双重底回调。你也可以把该形态称为三重底，但不同的叫法并不能给我们的交易增加任何盈利机会，所以没必要使用三重底这一术语。一轮小规模的下跌趋势结束于K线6（所有上升旗形都是小规模的下跌趋势），然后价格开始反转，因此我们也可以把该形态看作双重底主要趋势反转形态。","p":"p560"},{"t":"K线7和K线1类似，也是一根入场K线。它和K线8一起组成了微小的双重顶。K线7前面的双K反转为第一次上推，K线7前面的十字星为第二次上推，这两次上推也形成了一个双重顶。你认为哪种形态更加重要，其实并没有关系，因为它们都是顶部形态。你只需要知道，","p":"p561"},{"t":"市场正蓄势待发，准备翻转下行。","p":"p562"},{"t":"K线8尝试触发K线7这一做空入场K线上方的保护性止损单，但却失败了。K线9二次尝试，同样以失败告终，甚至没能触摸K线8高点，而形成了一个双重顶回调做空入场形态，我们可以在K线9低点低一个价位的地方挂条件单介入空头。这个做空条件出现了五跳失败的情","p":"p563"},{"t":"况，在移动平均线处形成了一个很好的双K线反转，我们可以挂条件单介入多头。K线10也是一根入场K线。这一楔形回调上升旗形测试了从K线4到K线6区间的顶部，是一次突破测试。","p":"p564"},{"t":"K线11和K线12组成了双重顶下降旗形做空入场形态，它提醒交易员们随后伺机寻找双重顶回调做空入场形态。K线13这一阳线尝试反弹，并对双重顶发起冲击，并试图形成高点2。","p":"p565"},{"t":"K线14是一次更低高点回调，并在移动平均线处回调失败，同样形成了一个双重顶回调做空入场形态。","p":"p566"}]},{"t":"para","text":"如图8.4所示，电子迷你期货当日出现了双重底回调和双重顶回调两种反转形态。K线1和K线2组成了一个双重底，虽然K线1乍一看可能容易被忽略。入场K线底部在其下方形成了一个保护性止损，它常常会被测试，比如被K线2测试，价格两次下探到达同一价位形成一个双重底，尽管第一次下跌并没有形成波段低点。由于K线1的下影线很长，所以我们几乎可以肯定在1分钟图里，这里会出现一个更高的低点(事实也是如此）。K线3深度回调，测试了该双重底，第二次尝试触发止损信号。K线2首次试探前期低点，在空头撤离多头占据主导之前，价格有可能再也逼近不了K线2低点。有些交易员把K线2和K线3看成双重底上升旗形，而其他交易员则认为是一个三重底上升旗形，或双重底回调。你把它看成何种形态其实并不重要，重要的是它们都是做多的入场形态。","pid":"p559"},{"t":"para","text":"在这个趋势震荡的交易日中，K线4和K线5构建了一个双重底上升旗形。这个双重底在K线6回调时得到测试，并形成一个更大级别的双重底回调。你也可以把该形态称为三重底，但不同的叫法并不能给我们的交易增加任何盈利机会，所以没必要使用三重底这一术语。一轮小规模的下跌趋势结束于K线6（所有上升旗形都是小规模的下跌趋势），然后价格开始反转，因此我们也可以把该形态看作双重底主要趋势反转形态。","pid":"p560"},{"t":"para","text":"K线7和K线1类似，也是一根入场K线。它和K线8一起组成了微小的双重顶。K线7前面的双K反转为第一次上推，K线7前面的十字星为第二次上推，这两次上推也形成了一个双重顶。你认为哪种形态更加重要，其实并没有关系，因为它们都是顶部形态。你只需要知道，","pid":"p561"},{"t":"para","text":"市场正蓄势待发，准备翻转下行。","pid":"p562"},{"t":"para","text":"K线8尝试触发K线7这一做空入场K线上方的保护性止损单，但却失败了。K线9二次尝试，同样以失败告终，甚至没能触摸K线8高点，而形成了一个双重顶回调做空入场形态，我们可以在K线9低点低一个价位的地方挂条件单介入空头。这个做空条件出现了五跳失败的情","pid":"p563"},{"t":"para","text":"况，在移动平均线处形成了一个很好的双K线反转，我们可以挂条件单介入多头。K线10也是一根入场K线。这一楔形回调上升旗形测试了从K线4到K线6区间的顶部，是一次突破测试。","pid":"p564"},{"t":"para","text":"K线11和K线12组成了双重顶下降旗形做空入场形态，它提醒交易员们随后伺机寻找双重顶回调做空入场形态。K线13这一阳线尝试反弹，并对双重顶发起冲击，并试图形成高点2。","pid":"p565"},{"t":"para","text":"K线14是一次更低高点回调，并在移动平均线处回调失败，同样形成了一个双重顶回调做空入场形态。","pid":"p566"}],"wcount":5065},{"id":"p1c9","title":"第9章　失败","blocks":[{"t":"para","text":"第9章　失败","pid":"p567"},{"t":"para","text":"当市场上的任何一笔交易没有达到原本设定的目标时，我们就说这笔交易失败了，而失败将直接导致这笔交易获利甚微，或者更加普遍的情况是，出现损失。对于一个刮头皮交易者来说，他们设定的交易目标就是刮头皮交易获得的利润。但是一旦这个交易者期待的更多从而设定了一个更高的目标，但是市场却没有满足他们的目标，即使他们已经获得了刮头皮交易的利润，这个目标依然被看作是失败的。每一次失败的牛市人场形态都意味着做多交易者的力量不敌做空交易者的力量，而每一次失败的熊市入场形态都意味着做空交易者的力量不敌做多交易者的力量。大部分常见的市场上的入场形态有60%的概率会成功，这意味着他也有40%的概率会失败。当市场上的入场形态失败时，通常会创造出一个完美的相反方向的入场形态。刚刚还被迫离开市场的交易者再次入场进行同方向的交易的可能性大大降低，这使得市场将逐渐形成另一个方向的趋势。此外，随着这些止损交易者的平仓离场，他们会使得市场往相反的方向更进一步。","pid":"p568"},{"t":"para","text":"本章介绍了一些突破失败后出现反转交易机会的常见形态，并且这些反转机会的时间足够进行一次刮头皮交易。当这个形态足够强大并且形态前后有足够的推力，那么这些形态有时甚至可以带来主要趋势的反转。至关重要的是我们要知道任何形态都有可能会失败，作为交易者要以平常心看待这些失败。我们可以把一次失败看成是一次潜在的机遇，正如我们之前所提到的，有时候它会在相反的方向为我们创造盈利的机会。也有时候，在这个失败后，会出现一个二次信号带领我们回归原来的操作方向。","pid":"p569"},{"t":"para","text":"以下是一些通常会出现的带来相反方向操作机遇的失败点：","pid":"p570"},{"t":"para","text":"失败的高点1,高点2，低点1，和低点2。","pid":"p571"},{"t":"para","text":"任何突破的失败，比如说震荡的高点或低点，震荡的趋势线或者趋势通道线。","pid":"p572"},{"t":"para","text":"突破市场某个目标价位的失败，比如说一段可测量距离的市场走势的目标位，一个先前的波段高点或者低点，趋势线或趋势通道线。","pid":"p573"},{"t":"para","text":"失败的最终旗形（反转尝试失败了，而且开启了一段突破的回调)。","pid":"p574"},{"t":"para","text":"失败的楔形。","pid":"p575"},{"t":"para","text":"失败的信号K线或者入场K线。","pid":"p576"},{"t":"para","text":"失败的一个价位的突破。","pid":"p577"},{"t":"para","text":"失败的反转形态，比如说一个失败的双重顶部或者顶部，或者一个失败的头肩模型。","pid":"p578"},{"t":"para","text":"没有达到盈利目标的失败，比如说在一个Eminis的交易中，与目标相差5,9,17个价位的失败，或者在票交易中，与目标11%，51%，99%，甚至101%的失败。","pid":"p579"},{"t":"para","text":"有一些失败其实是趋势增强的信号，并且会带来顺趋势的交易：","pid":"p580"},{"t":"para","text":"在一个强劲的牛市趋势中，未能成功地向下突破之前的低点，或者在一个强劲的熊市趋势中，未能成功地超越之前的高点。这些都代表了市场上的紧迫感和趋势的增强。","pid":"p581"},{"t":"para","text":"趋势的回调不能触及移动平均线时，也代表了市场的紧迫感和趋势增强。","pid":"p582"},{"t":"para","text":"不能到达某个目标价位，比如说一段可以测量的趋势目标，一个之前的波段高点，低点，或者一个趋势线或趋势通道线。这些经常会带来市场的回调，并且市场会再次向目标价位发起进攻。","pid":"p583"},{"t":"para","text":"如果市场的刮头皮交易者已经达到了他的既定目标（因此他将会退出部分或者全部的头寸），之后又重新回到市场，并根据市场最初的信号或者入场K线进行交易并设置止损，此时，由于市场上并没有足够多的交易者被困（他们已经得到利益离开了），所以市场并没有足够的动能来支撑其继续这个新的相反的方向。同样，在获得了部分收益之后，许多刮头皮交易者将会在他们的盈亏平衡点附近出场，所以相比于之前的入场形态或者信号K线的止损设置，他们的止损会更加严格，幅度更窄。","pid":"p584"},{"t":"para","text":"虽然一次微小的反转可能只不过是震荡区间的一次调整，并且只够进行一次刮头皮交易的时间，但是有时候它也会演变为大趋势反转的一部分。最可靠的失败的信号就是在趋势中出现的旗形。当旗形开始形成的时候，逆趋势交易者都希望趋势会反转，但是出现反转的概率往往很低，因为市场的趋势往往具有惯性，并且会阻止这些反转的尝试。举个例子，如果在一个强劲的牛市趋势中出现了一个反转点，许多交易者将会开始做空。然而，一旦市场并没有继续震荡下跌至移动平均线，而是出现了一个高点2的牛市信号K线，那么做多交易者企图反转市场的尝试很可能就会失败。这将会是一个绝佳的买人时机，因为你可以通过这次机会重新进入市场的大趋势之中，并且可以预料到的是市场至少还会再次升高并检测之前出现的高点。任何反转形态，包括主要的反转形态，都可能会失败并最终带来趋势的复苏。","pid":"p585"},{"t":"para","text":"当交易者进入市场的时候，许多人会在信号K线的一个价位之上设置保护性的止损位。当入场K线收盘时，如果这根K线非常强劲，那么许多交易者会将止损位重新设置在这根入场K线的一个价位之上。你是怎么知道这些的呢？其实通过简单的看图表我们就可以得到这些信息了。","pid":"p586"},{"t":"para","text":"打开任意一张K线图，然后找到其中可能的信号和入场K线，然后看看当出现一个K线反转时将会发生什么。大部分时间，这个反转将会以一根强劲的趋势K线的形式出现，并且大多数时候市场的移动速度会足够进行一次刮头皮交易。这是因为，一旦交易者因为在新的头寸方向上受","pid":"p587"},{"t":"para","text":"损而退出，他们将会变得更加谨慎，并且希望在重新进入相同的方向之前会有更多的价格行为出现。这将导致市场会继续反转，反转的速度非常迅速，但足以进行一次刮头皮交易。","pid":"p588"},{"t":"para","text":"为什么一个价位的突破失败是非常常见的呢，特别是在Emini的交易之中？在股票中，比较常见的是1%到10%的突破失败，失败的程度取决于这个股票的价格以及股票的特点。在股票的交易过程中，每一只股票都有其独有的特征，可能因为许多同样的人会每天交易这只股票，所以如果出现一小群交易者，但是却掌握足够多的交易量，那么他们将足以控制市场并创建重复的形态。举个例子来说，如果在一个较弱的牛市趋势中，市场开始震荡下行，许多交易者相信如果当前的K线比之前的K线高出了一个价位，他们将会在这个暂停点继续买入。许多聪明的交易者都信奉这条法则。然而，如果其他的掌握着足够多的交易量的交易者认为市场的回调离结束还远（比如，如果他们认为出现两波下跌浪才是比较可能的），这些交易者可能会在高点或者前一根K线的一个价位之上做空。一旦他们的交易量绝对压倒了新的做多交易者的交易量，并且没有足够多的新入场的做多交易者救场，则市场很可能会下跌一到两个价位。","pid":"p589"},{"t":"para","text":"在这个时点上，新的做多交易者将会感觉到紧张。如果他们是以一个非常好的价位入场的，那么为什么没有更多的买方入场？同样，现在市场已经比之前要低1到2个价位了，这看起来应该更有利于买方入场。按照这个理论，市场应该很快会再次推高，但是市场在几个价位之下徘徊的时间越久，那么越多的新的做多交易者将会越担心他们的判断是错误的。有一些甚至已经开始卖出头寸，增加报价，还有一些交易者将退出指令设置在一到两个价位之下，他们设置这些指令也许是基于1分钟或者3分钟的图，然后根据最近的K线设置一个价位之下的指令。一旦市场继续下跌这些买方设置的卖出指令纷纷交易，那么这些新的买方将会变成卖方，这将继续推动市场下跌。此外，最初的做多交易者将会感受到新的做多交易者正在陷入困境，所以许多做空交易者还会继续增加他们的卖空头寸。当价格继续下跌3，4，5个价位时，已经停止交易的买方将从等待时机买入转变为等待更多的价格行为再行动。随着买方力量的消失，市场将会继续下跌满足卖方的需求。在某些点上，卖方已经完全覆盖，并开始获利，这将减缓价格的下跌，而买方将重新开始买入。一旦买方力量超过了卖方力量，市场价格将再次上升。","pid":"p590"},{"t":"para","text":"在5分钟的K线图中，在震荡区间发生的一个价位的突破失败在更高的时间图上，比如15或者60分钟图上，它依然是一个价位的突破失败。在这种情况下，我们为什么在60分钟的图上看不到很多一个价位的突破失败？这是因为在5分钟的图上，许多一个价位的突破会在持续回调几根K线之后再次突破。反映在60分钟的图上就是，虽然在60分钟K线图形成的过程中，这确实是一个价位的突破失败，但是当这根K线收盘的时候，突破已经超过了一个价位了。","pid":"p591"},{"t":"para","text":"对于新手来说，一个价位的突破失败通常会带来损失。他们认为他们看到了一个完美的入场时点，比如说，一个买入入场时点，所以他们就在之前的K线的高点之上的一个价位设置了买入止损指令。也许在移动平均线之上有一个两根K线的反转，但是它与之前的两根K线完全重叠，并且在这个小型的震荡区间上出现了一个买方入场形态。我们注意到，新手一般会看到这根强劲的牛市趋势线然后买入，但是有经验的交易者知道这种形态的两根K线的反转往往是一个陷阱，所以在新手买入的时候，他们更有可能会卖出。正如新手们期待的那样，市场会上升，并且使得他们之前设置的买入止损单进入交易。然而，在这个时点之后，将会出现一个价位的下跌，之后是两个价位，三个价位，在短短的30秒钟的时间里，他们眼睁睁地看着市场从买入开始下跌，使得他们损失了至少两个点。他们会怀疑在他们买入的时候为什么会有其他人在卖出，这真是一个绝妙的讽刺。","pid":"p592"},{"t":"para","text":"这些陷阱都很常见。另外一个例子就是在有牛市的迹出现之前，新手就开始在一个熊市趋势中做多了，比如说他们在熊市趋势线出现之前的一个上升潮中买入，或者会在一个倒钩型的顶部出现的形态巨大，但是主体微小的十字星处买入，也可能会把熊市旗形错看成是反转买人，在过度的渴望的趋势下，他们会早早以买方入场的形式进入这个熊市趋势中。","pid":"p593"},{"t":"para","text":"另外一种较为普通的情况就是一根巨大的趋势K线，伴随着尾部较短或者没有尾部的情况出现。如果它是一根牛市趋势线，许多交易者会把止损位设置在这根K线的一个价位之下。市场通常会出现的情况是，先下行5到10根K线，触发止损位，使得交易者跌入困境，之后再继续回到原来的趋势方向之上。","pid":"p594"},{"t":"para","text":"新手交易者没有意识到的是，大部分的大交易商会把这个点看作是做空的机会，因为他们知道只有弱势交易者才会买入，所以他们会积极做空。而一旦他们开始做空，他们会使得市场迅速下跌。一个价位的突破失败是一个非常可靠的、表明市场正在向下反转的证据，所以你可以通过这个迹象寻找合理进入市场的时机。对于下行的市场来说，也是如此。所有的一个价位的突破失败有时候可以变成两个价位的突破失败，甚至在一个价值200美元的股票中甚至可以变成5至10个价位的突破失败。","pid":"p595"},{"t":"para","text":"突破测试通常会将入场价格测试到非常准确的价格，被市场困住的弱势交易者将会继续追逐市场趋势，并且重新以更糟的价位入场。市场的突破测试通常会距离盈亏平衡点一个价位的距离，或者，会超过盈亏平衡点几个价位，不管是哪一种情况，这次企图超越之前的入场价格的反转尝试的失败，都是一个顺趋势交易的人场时点。举个例子，如果在Emini的交易中，在牛市反转K线之上出现了一个强劲的买方入场时点，市场上升了大概10根K线，之后开始下跌，试想一下，当这个下跌潮跌到了最初的牛市信号K线的高点附近时会发生什么？如果在这个信号K线的高点之上两个价位处出现一根K线，则这根K线距离交易者设置的盈亏平衡点差一个价位。市场没能击败做多交易者。交易者将会在这根突破测试K线处买入，因为他们将市场未能到达他们的保护止损位看作是一个入场信号，做多交易者将在最初的入场价格处积极买入，保护他们的止损位，并且也是向市场声明他们依然很强势。","pid":"p596"},{"t":"para","text":"许多时候在震荡区间会出现很多价格行为，并且在失败的震荡高点和低点突破处会出现很多人场时机。当价格高于之前震荡的高点，并且市场的动能还不太强劲时，你可以在之前的K线的低点之下的一个价位设置卖空止损位。如果在这根K线收盘时，指令还没有被执行，则可以把止损位设置为这根刚刚收盘的K线之下一个价位。你可以一直这样做直到市场已经上升的足够高了，并且已经有足够多的动能，那么在你卖空之前需要更多的价格行为支撑了。你可以等待一个回调至少打破了小趋势线，然后再在新的震荡高点卖空。在趋势强劲的日子，你也可以在小趋势线被突破并且出现了一根强劲的反转K线后，忽视这些新的震荡高点和低点。","pid":"p597"},{"t":"para","text":"同样，第一次向下突破了之前的震荡低点的点是一个更低的低点的买方入场形态。你可以在之前的高点之上的一个价位处设置买入止损指令。如果市场下跌，这个指令没有被执行，你可以继续在前一根K线的一个价位之上继续设置指令，但是如果市场下跌太迅速，则可以先暂停设置，等待市场上出现了一个打破小趋势线的反弹，然后再考虑在新的低点上出现的失败的突破上买入。","pid":"p598"},{"t":"para","text":"在Emini的交易中，当平均日交易区间是10个价位时，那么较为流行的是4个价位的刮头皮交易。在一个趋势中，当市场上出现了一系列成功的刮头皮交易，其中一次刮头皮交易的限价指令被市场价触及了，但并没有成交，则这个5个价位的失败就是动能衰退的迹象。在1分钟和3分钟的图中这些也是非常常见的。因为一个4个价位的刮头皮交易需要一个6个价位的突破（一个价位设置止损，4个价位作为收益，还有多出来的一个价位是为了确保盈利目标的限价指令可以成交）。市场如果只持续了5个价位，然后马上反转，这通常意味着趋势交易者已经不能控制趋势，市场上即将出现一次回调或者反转。由于许多交易者也会设置限价指令，来捕捉2点，3点或者4点的盈利目标，如果市场反转不能达到这些目标，则也意味着市场趋势的衰减。举个例子来说，如果市场上出现了一个显著的日内低点，之后在信号K线的高点上反弹了17个价位，对于许多希望用大概获利4个价位的限价指令出场的交易者来说，他们的指令直到市场价格反弹至信号K线的高点之上18个价位后才会成交。","pid":"p599"},{"t":"para","text":"如果与上面相反，市场在反弹了17个价位之后开始下跌，在之前一个价位还没有退出的做多交易者将会考虑退出，而这通常会带来至少一次向下的刮头皮交易时机。交易者认为做多交易者已经在一个价位之前获利，这意味着做多交易者不相信市场会给他们完整的获得四个点的收益的时机。这种缺乏信心会导致做多交易者更早的平仓获利，而做空交易者将积极卖空。做多交易者将会继续使用他们的浮动止损设置，同时希望市场会很快让他们的四个价位的限价指令成交，但是大部分的交易者并不愿意冒着可以获得的15个价位的盈利变成2个或者3个价位的盈利的风险，去寻求那额外的一点盈利。这就类似于为了一个点的盈利去冒10个点或者更大的风险的一笔刮头皮交易一样，是一个失败的策略。如果市场在市场到达17个价位之后，向下回调了几个价位，但是并没有触发交易者的获利限价指令，交易者很可能会降低他们的盈利目标几个点位，同时将止损指令提高至前一根K线的低点之下一个价位处。如果两个指令都没有被触发，同时这根K线有一个较弱的收盘价，交易者就可能会退出市场。值得一提的是，如果市场超越了信号K线的高点16个价位，那么市场将有80%的概率会继续上升至17或者18个价位处。这意味着在16个价位处离场是非常不明智的，除非市场新出现的K线低于之前的K线的低点，特别是这根K线还是一根做空K线时，你才应该考虑离场。","pid":"p600"},{"t":"para","text":"大多数交易者也会以相同的方式处理9个价位的失败。如果交易者买入Emini合约，并且试图以两个点位的盈利离场，他们将会将信号K线的高点之上的9个价位处设置限价指令。为了满足指令的交易，市场需要再升高一个价位，也就是需要升至信号K线的高点之上的10个价位处。如果市场触发了指令，但是并没有完全完成交易就开始下跌，交易者就不得不决定是继续执行之前的止损位还是追加新的止损位，比如说最新的一个有着较明显的牛市主体的K线下方一个价位处。如果他们设置的限价指令正好就是在阻力位处，比如说之前的震荡高点处，同时此高点也没有很快被向上打破，那么交易者需要马上将他们的限价指令调低几个价位。一旦市场上升至9个价位处，交易者不应该让这笔交易有所亏损，因为在此时，他们有可能会冒着抹掉8个或者更多个价位的收益的风险来博取一个价位的收益，这对交易者来说是很不值得的。","pid":"p601"},{"t":"para","text":"在其他的市场上也有许多类似的失败会带来刮头皮交易的机会，比如说SPY和QQQ市场。对于这两个市场来说，一个普通的盈利目标通常是10个价位，而这通常需要市场在信号K线之上升高12个价位。如果市场仅仅上升了10至11个价位(甚至只有8至9个价位)，之后就出现反转，它通常会带来一次相反方向的刮头皮交易时机，因为刮头皮交易者之前已经被困住了，他们会抓住这个反转信号或者入场K线离开困境。在股票交易中，这种类型的失败也非常常见。举个例子来说，如果一只股票在一次刮头皮交易中上升了不止1关元，之后开始下跌，在这个1美元的日标上出现了两次做空机会，这就是一个非常好的相反方向的刮头皮交易机会。","pid":"p602"},{"t":"para","text":"最常见也是最可信的失败就是第一次超越趋势线的突破。股票交易者会花费所有的时间在每天的K线图上寻找这些点，但实际上在所有的时间图上你都可以看到这个现象的发生。举个例子，如果AAPL正处于一个强劲的牛市市场中，但是却有一个较差的收益报告，那么它很可能会在一天内下跌8%，在日K线图上触及移动平均线。有经验的交易者并不急于寻找卖空的机会，相反他们通常会在收盘处的下跌潮或者接下来一天的开盘处买入。他们看待股票的下跌就好像是看待商场的商品打折一样。股票已经下跌了8%，正如商场里的打折不会长久一样，他们迅速抓住了这个机会买入。他们知道大部分的反转都会以失败告终，同时最初的反转尝试之后通常会继续跟随一个高点，所以他们会选择买入，即使买入的时点是在一个强劲的熊市趋势的底部所有的形态都可能会失败，不管他们曾经看起来多么好。当他们失败的时候，有许多被困的交易者将不得不以损失离场，而且通常是相较于他们的入场或者信号K线一个价位的损失。对于聪明的交易者来说，这是进行一次低风险的刮头皮交易的时机。将你的入场止损指令设置在被困的交易者设置的保护性止损指令的价位上，那么当他们离场的时候就是你入场的时候。他们不会太急于重新回到之前的交易方向上，这使得市场会继续在有利于你的交易方向上前行，通常会带来至少一次的刮头皮交易时机和两波浪潮。","pid":"p603"},{"t":"para","text":"在5分钟的Emini交易图上，一个价位或者两个价位的假突破导致的反转通常是非常常见的。","pid":"p604"},{"t":"img","src":"assets/img/p1c9_001.webp","ctx":[{"t":"最常见也是最可信的失败就是第一次超越趋势线的突破。股票交易者会花费所有的时间在每天的K线图上寻找这些点，但实际上在所有的时间图上你都可以看到这个现象的发生。举个例子，如果AAPL正处于一个强劲的牛市市场中，但是却有一个较差的收益报告，那么它很可能会在一天内下跌8%，在日K线图上触及移动平均线。有经验的交易者并不急于寻找卖空的机会，相反他们通常会在收盘处的下跌潮或者接下来一天的开盘处买入。他们看待股票的下跌就好像是看待商场的商品打折一样。股票已经下跌了8%，正如商场里的打折不会长久一样，他们迅速抓住了这个机会买入。他们知道大部分的反转都会以失败告终，同时最初的反转尝试之后通常会继续跟随一个高点，所以他们会选择买入，即使买入的时点是在一个强劲的熊市趋势的底部所有的形态都可能会失败，不管他们曾经看起来多么好。当他们失败的时候，有许多被困的交易者将不得不以损失离场，而且通常是相较于他们的入场或者信号K线一个价位的损失。对于聪明的交易者来说，这是进行一次低风险的刮头皮交易的时机。将你的入场止损指令设置在被困的交易者设置的保护性止损指令的价位上，那么当他们离场的时候就是你入场的时候。他们不会太急于重新回到之前的交易方向上，这使得市场会继续在有利于你的交易方向上前行，通常会带来至少一次的刮头皮交易时机和两波浪潮。","p":"p603"},{"t":"在5分钟的Emini交易图上，一个价位或者两个价位的假突破导致的反转通常是非常常见的。","p":"p604"},{"t":"图9.1上有6个例子（注意标识K线1的标签远远高于那根K线)。一旦市场开始突破，交易者进入止损位后，他们发现市场正在回调1至2个价位，而不是继续之前的方向，所以他们开始设置保护性止损位。逆趋势交易者已经嗅到了入场的时机，所以他们会在这些被困的交易者开始受损时入场。大部分的突破尝试都会失败，特别是当市场还是在震荡区间时，而且这些失败的形式通常是一个价位的假性突破。有经验的交易者通常会利用这些突破获利，或者进行相反的交易，他们期待大部分震荡区间的突破会失败。举个例子，如果一个交易者在震荡区间的底部买人，他很有可能会在市场测试震荡区域的高点时进行刮头皮交易，并且通常会在设置一个限价指令来卖出头寸，从而在震荡区间的顶部获利。而在一个强劲的趋势中，他们的操作则会相反。比如，如果市场正处于强劲的牛市趋势中，那么交易者则将会在这个震荡区间的顶部之上设置买入点买入头寸，因为他们认为还会有另外一波上升浪的出现。","p":"p605"}]},{"t":"para","text":"图9.1上有6个例子（注意标识K线1的标签远远高于那根K线)。一旦市场开始突破，交易者进入止损位后，他们发现市场正在回调1至2个价位，而不是继续之前的方向，所以他们开始设置保护性止损位。逆趋势交易者已经嗅到了入场的时机，所以他们会在这些被困的交易者开始受损时入场。大部分的突破尝试都会失败，特别是当市场还是在震荡区间时，而且这些失败的形式通常是一个价位的假性突破。有经验的交易者通常会利用这些突破获利，或者进行相反的交易，他们期待大部分震荡区间的突破会失败。举个例子，如果一个交易者在震荡区间的底部买人，他很有可能会在市场测试震荡区域的高点时进行刮头皮交易，并且通常会在设置一个限价指令来卖出头寸，从而在震荡区间的顶部获利。而在一个强劲的趋势中，他们的操作则会相反。比如，如果市场正处于强劲的牛市趋势中，那么交易者则将会在这个震荡区间的顶部之上设置买入点买入头寸，因为他们认为还会有另外一波上升浪的出现。","pid":"p605"},{"t":"img","src":"assets/img/p1c9_002.webp","ctx":[{"t":"图9.1上有6个例子（注意标识K线1的标签远远高于那根K线)。一旦市场开始突破，交易者进入止损位后，他们发现市场正在回调1至2个价位，而不是继续之前的方向，所以他们开始设置保护性止损位。逆趋势交易者已经嗅到了入场的时机，所以他们会在这些被困的交易者开始受损时入场。大部分的突破尝试都会失败，特别是当市场还是在震荡区间时，而且这些失败的形式通常是一个价位的假性突破。有经验的交易者通常会利用这些突破获利，或者进行相反的交易，他们期待大部分震荡区间的突破会失败。举个例子，如果一个交易者在震荡区间的底部买人，他很有可能会在市场测试震荡区域的高点时进行刮头皮交易，并且通常会在设置一个限价指令来卖出头寸，从而在震荡区间的顶部获利。而在一个强劲的趋势中，他们的操作则会相反。比如，如果市场正处于强劲的牛市趋势中，那么交易者则将会在这个震荡区间的顶部之上设置买入点买入头寸，因为他们认为还会有另外一波上升浪的出现。","p":"p605"},{"t":"如图9.2所示，在EMINI的合约交易中两天内发生了很多次一个价位的陷阱。","p":"p606"},{"t":"K线1是一个一个价位的失败造成的低点2，并成了由8点55分开始的楔形牛市旗形中的一个突破性回调入口。","p":"p607"},{"t":"K线2是在倒钩型中形成的一个高点2，同时也是一个价位的失败。K线2很容易使得那些较为保守的交易者，并且正在等待机会打算在之后那根大型的外包线上方购买的交易者陷入困境，确实，当他们在这个震荡区域的顶部之上，移动平均线之下买入的时候，就会陷入困境之中。","p":"p608"},{"t":"这形成了一个双重顶部的熊市旗形。","p":"p609"},{"t":"K线3是一个在失控的牛市趋势中形成的一个价位的失败反转，在这个点，聪明的交易者会迫不及待地等待任何可能的市场回调买入。他们会在这根K线的低点之下买入，而弱势的做空交易者则会抓住这个自开盘的高点上方开始的市场回调机会做空。","p":"p610"},{"t":"K线4向下突破了之前的四根震荡K线，并带来了一个高点2的做多时机。","p":"p611"},{"t":"K线5是一个大型的牛市趋势K线，因此在它的低点之下的一个价位处会出现止损价位。在K线7的最低点就向下突破了一个价位，触及了这一止损。做多交易者有能力控制市场的价位，使其持续高于K线4牛市趋势的底部。","p":"p612"},{"t":"K线9又低了一个价位，这使得那些认为出现了一个更低的高点的卖空机会的交易者陷入困境，实际上，市场上出现的是一个震荡的牛市旗形。","p":"p613"},{"t":"K线10向上突破触及了K线6处做空设置的盈亏平衡保护止损位两个价位。K线10与K线8一起形成了一个双重顶部的熊市旗形。","p":"p614"},{"t":"K线14是一个最可靠的一个价位的失败，这是一个失败的高点2，但是在新手看来这是一个牛市回调。这是一个非常完美的陷阱，它导致了之后的市场大幅下移（在图中并未显示）。新手并没有注意到K线11之前的回调突破了趋势线，之后在K线12出现了一个更高的高点的检测。之后，在这个高点后出现了5根一路向下的熊市趋势K线和一个十字星，并且趋势通道线无法打破K线13出现的高点1。在图中的更高的高点后出现了一个两根K线的反转，之后就形成了一个熊市通道，看起来在高点2的信号K线之上卖方力量很可能会强于买方力量。请记住，一个单独的高点2不是一个买入信号。除非它出现在牛市趋势的顶部才是买入信号，但是在图中的这个时点牛市趋势已经结束了。此时。你可以认为市场处于震荡区间，也可以认为其处于熊市趋势中。在震荡区间出现的高点2也是一个买入信号。但是也仅仅是当其处于震荡区间的底部，而不是像图中接近顶部的位置。","p":"p615"}]},{"t":"para","text":"如图9.2所示，在EMINI的合约交易中两天内发生了很多次一个价位的陷阱。","pid":"p606"},{"t":"para","text":"K线1是一个一个价位的失败造成的低点2，并成了由8点55分开始的楔形牛市旗形中的一个突破性回调入口。","pid":"p607"},{"t":"para","text":"K线2是在倒钩型中形成的一个高点2，同时也是一个价位的失败。K线2很容易使得那些较为保守的交易者，并且正在等待机会打算在之后那根大型的外包线上方购买的交易者陷入困境，确实，当他们在这个震荡区域的顶部之上，移动平均线之下买入的时候，就会陷入困境之中。","pid":"p608"},{"t":"para","text":"这形成了一个双重顶部的熊市旗形。","pid":"p609"},{"t":"para","text":"K线3是一个在失控的牛市趋势中形成的一个价位的失败反转，在这个点，聪明的交易者会迫不及待地等待任何可能的市场回调买入。他们会在这根K线的低点之下买入，而弱势的做空交易者则会抓住这个自开盘的高点上方开始的市场回调机会做空。","pid":"p610"},{"t":"para","text":"K线4向下突破了之前的四根震荡K线，并带来了一个高点2的做多时机。","pid":"p611"},{"t":"para","text":"K线5是一个大型的牛市趋势K线，因此在它的低点之下的一个价位处会出现止损价位。在K线7的最低点就向下突破了一个价位，触及了这一止损。做多交易者有能力控制市场的价位，使其持续高于K线4牛市趋势的底部。","pid":"p612"},{"t":"para","text":"K线9又低了一个价位，这使得那些认为出现了一个更低的高点的卖空机会的交易者陷入困境，实际上，市场上出现的是一个震荡的牛市旗形。","pid":"p613"},{"t":"para","text":"K线10向上突破触及了K线6处做空设置的盈亏平衡保护止损位两个价位。K线10与K线8一起形成了一个双重顶部的熊市旗形。","pid":"p614"},{"t":"para","text":"K线14是一个最可靠的一个价位的失败，这是一个失败的高点2，但是在新手看来这是一个牛市回调。这是一个非常完美的陷阱，它导致了之后的市场大幅下移（在图中并未显示）。新手并没有注意到K线11之前的回调突破了趋势线，之后在K线12出现了一个更高的高点的检测。之后，在这个高点后出现了5根一路向下的熊市趋势K线和一个十字星，并且趋势通道线无法打破K线13出现的高点1。在图中的更高的高点后出现了一个两根K线的反转，之后就形成了一个熊市通道，看起来在高点2的信号K线之上卖方力量很可能会强于买方力量。请记住，一个单独的高点2不是一个买入信号。除非它出现在牛市趋势的顶部才是买入信号，但是在图中的这个时点牛市趋势已经结束了。此时。你可以认为市场处于震荡区间，也可以认为其处于熊市趋势中。在震荡区间出现的高点2也是一个买入信号。但是也仅仅是当其处于震荡区间的底部，而不是像图中接近顶部的位置。","pid":"p615"},{"t":"img","src":"assets/img/p1c9_003.webp","ctx":[{"t":"K线10向上突破触及了K线6处做空设置的盈亏平衡保护止损位两个价位。K线10与K线8一起形成了一个双重顶部的熊市旗形。","p":"p614"},{"t":"K线14是一个最可靠的一个价位的失败，这是一个失败的高点2，但是在新手看来这是一个牛市回调。这是一个非常完美的陷阱，它导致了之后的市场大幅下移（在图中并未显示）。新手并没有注意到K线11之前的回调突破了趋势线，之后在K线12出现了一个更高的高点的检测。之后，在这个高点后出现了5根一路向下的熊市趋势K线和一个十字星，并且趋势通道线无法打破K线13出现的高点1。在图中的更高的高点后出现了一个两根K线的反转，之后就形成了一个熊市通道，看起来在高点2的信号K线之上卖方力量很可能会强于买方力量。请记住，一个单独的高点2不是一个买入信号。除非它出现在牛市趋势的顶部才是买入信号，但是在图中的这个时点牛市趋势已经结束了。此时。你可以认为市场处于震荡区间，也可以认为其处于熊市趋势中。在震荡区间出现的高点2也是一个买入信号。但是也仅仅是当其处于震荡区间的底部，而不是像图中接近顶部的位置。","p":"p615"},{"t":"让我们看看在图9.3中，当市场突破了水平线市场会发生什么，一般市场都是突破了信号K线和入场K线形成的水平线一个价位，并且在这个位置许多交易者会设置保护性止损位。大多数时候，会出现一根趋势K线，并且市场的移动也足够刮头皮交易者获得利益。在图中出现的大部分失败都不够强劲，所以聪明的交易者并不会采取行动。但是还是会有足够多的交易者会利用这些失败采取行动，这将导致当他们被迫因失利而离场的时候市场会向相反的方向移动。举个例子，在K线4这根反转K线处采取买入行动的交易者，将会把他们的止损位设置在入场K线或者信号K线的下方。不管是哪种设置，都在K线5这根巨大的熊市趋势线出现时被触及了止损，所以聪明的交易者在这些位置设置止损点将会收获刮头皮交易的利润。","p":"p616"},{"t":"我们可以推断，如果一根K线的极点被测试了，但是并没有被超越，那么这些止损点也被测试了且没有被处罚，所以这个交易通常会获得收益。如果上述情况发生在一个买方入场K线的保护线止损位上，比如它还差一个价位就要被触发，那么市场的测试就将形成一个双重底部的牛市旗形底部。这个双重底部的第一个底部是由信号K线组成，而随后回到这根K线的位置但是没有触发保护性止损位的那根K线组成了第二个底部。","p":"p617"},{"t":"当市场触发了执行既定的利润目标的限价指令的价格后立刻回调时，大部分的交易者不能完全执行他们的限价指令。当市场回调了几个价位时，许多交易者将会选择退出市场，因为他们不愿意让他们已经得到的利润再承受失去的风险。这将加大市场修正的概率并且通常也是市场准备反转的信号","p":"p618"}]},{"t":"para","text":"让我们看看在图9.3中，当市场突破了水平线市场会发生什么，一般市场都是突破了信号K线和入场K线形成的水平线一个价位，并且在这个位置许多交易者会设置保护性止损位。大多数时候，会出现一根趋势K线，并且市场的移动也足够刮头皮交易者获得利益。在图中出现的大部分失败都不够强劲，所以聪明的交易者并不会采取行动。但是还是会有足够多的交易者会利用这些失败采取行动，这将导致当他们被迫因失利而离场的时候市场会向相反的方向移动。举个例子，在K线4这根反转K线处采取买入行动的交易者，将会把他们的止损位设置在入场K线或者信号K线的下方。不管是哪种设置，都在K线5这根巨大的熊市趋势线出现时被触及了止损，所以聪明的交易者在这些位置设置止损点将会收获刮头皮交易的利润。","pid":"p616"},{"t":"para","text":"我们可以推断，如果一根K线的极点被测试了，但是并没有被超越，那么这些止损点也被测试了且没有被处罚，所以这个交易通常会获得收益。如果上述情况发生在一个买方入场K线的保护线止损位上，比如它还差一个价位就要被触发，那么市场的测试就将形成一个双重底部的牛市旗形底部。这个双重底部的第一个底部是由信号K线组成，而随后回到这根K线的位置但是没有触发保护性止损位的那根K线组成了第二个底部。","pid":"p617"},{"t":"para","text":"当市场触发了执行既定的利润目标的限价指令的价格后立刻回调时，大部分的交易者不能完全执行他们的限价指令。当市场回调了几个价位时，许多交易者将会选择退出市场，因为他们不愿意让他们已经得到的利润再承受失去的风险。这将加大市场修正的概率并且通常也是市场准备反转的信号","pid":"p618"},{"t":"img","src":"assets/img/p1c9_004.webp","ctx":[{"t":"我们可以推断，如果一根K线的极点被测试了，但是并没有被超越，那么这些止损点也被测试了且没有被处罚，所以这个交易通常会获得收益。如果上述情况发生在一个买方入场K线的保护线止损位上，比如它还差一个价位就要被触发，那么市场的测试就将形成一个双重底部的牛市旗形底部。这个双重底部的第一个底部是由信号K线组成，而随后回到这根K线的位置但是没有触发保护性止损位的那根K线组成了第二个底部。","p":"p617"},{"t":"当市场触发了执行既定的利润目标的限价指令的价格后立刻回调时，大部分的交易者不能完全执行他们的限价指令。当市场回调了几个价位时，许多交易者将会选择退出市场，因为他们不愿意让他们已经得到的利润再承受失去的风险。这将加大市场修正的概率并且通常也是市场准备反转的信号","p":"p618"},{"t":"如图9.4所示，市场在K线2之上反弹了21个价位，之后反转而下。许多在高于K线2一个价位的位置买入的交易者，会将他们离开市场的限价指令的利润目标设为5个点，也就是高于信号K线的高点21个价位的位置，但是大部分他们的指令都很难被完全执行，除非市场可以升高22个价位。但是，与之相反的是，市场在上升21个价位之后开始反转，大部分的交易者将会快速离开市场，因为他们想在市场回到他们的买入价格之前，尽可能地挽救更多的利润。","p":"p619"},{"t":"对于在K线6这根买入信号K线一个价位之上买入的做多交易者来说，K线7就是一个17个价位的失败。许多设定了四个点的盈利目标的交易者，将会看到市场在高于信号K线的高点17个价位的地方触发了他们限价指令，并且一旦市场下跌到那根K线的低点之下时，他们就会离开市场。但是他们认为市场的趋势非常强劲，所以他们没有选择在四个点的盈利时退出，而是继续持有手里的头寸，并仅仅依靠盈亏平衡点来止损。一旦市场高于了K线7的高点，他们将会在低于K线8一个价位的位置设置止损点，也就是离K线7最近的较高的低点处。","p":"p620"},{"t":"对于做空交易来说，K线4，8，20，30就是5个价位的失败的例子大部分的做空交易者希望得到一个四个价位的刮头皮交易时间，所以他们需要市场在信号K线的底部继续下跌6个价位，只有这样才能触发他们盈利限价指令。有一些交易者可以完全执行他们的指令，但是大部分人不能完全执行他们的指令。","p":"p621"},{"t":"对于想获得三个点的盈利，并在K线8的上方买入的做多交易者来说，K线9就是一个13个价位的失败。","p":"p622"},{"t":"对于想获得2个点的盈利目标的交易者来说，K线16和K线24是一个9个价位的失败。但是它们不会让交易者获得损失，并且降低他们的止损位。举个例子，交易者可能会在低于K线17的低点一个价位的位置，卖出在K线16这根买入信号K线处买入的头寸，也可能会在K线17的熊市收盘处卖出。对于在K线23这根买入信号K线处买入的头寸，交易者很可能会在两根K线之后形成的熊市K线的一个价位之下卖出。","p":"p623"},{"t":"当区间震荡强烈的时候，突破震荡区间的高点或者低点往往会失败。","p":"p624"}]},{"t":"para","text":"如图9.4所示，市场在K线2之上反弹了21个价位，之后反转而下。许多在高于K线2一个价位的位置买入的交易者，会将他们离开市场的限价指令的利润目标设为5个点，也就是高于信号K线的高点21个价位的位置，但是大部分他们的指令都很难被完全执行，除非市场可以升高22个价位。但是，与之相反的是，市场在上升21个价位之后开始反转，大部分的交易者将会快速离开市场，因为他们想在市场回到他们的买入价格之前，尽可能地挽救更多的利润。","pid":"p619"},{"t":"para","text":"对于在K线6这根买入信号K线一个价位之上买入的做多交易者来说，K线7就是一个17个价位的失败。许多设定了四个点的盈利目标的交易者，将会看到市场在高于信号K线的高点17个价位的地方触发了他们限价指令，并且一旦市场下跌到那根K线的低点之下时，他们就会离开市场。但是他们认为市场的趋势非常强劲，所以他们没有选择在四个点的盈利时退出，而是继续持有手里的头寸，并仅仅依靠盈亏平衡点来止损。一旦市场高于了K线7的高点，他们将会在低于K线8一个价位的位置设置止损点，也就是离K线7最近的较高的低点处。","pid":"p620"},{"t":"para","text":"对于做空交易来说，K线4，8，20，30就是5个价位的失败的例子大部分的做空交易者希望得到一个四个价位的刮头皮交易时间，所以他们需要市场在信号K线的底部继续下跌6个价位，只有这样才能触发他们盈利限价指令。有一些交易者可以完全执行他们的指令，但是大部分人不能完全执行他们的指令。","pid":"p621"},{"t":"para","text":"对于想获得三个点的盈利，并在K线8的上方买入的做多交易者来说，K线9就是一个13个价位的失败。","pid":"p622"},{"t":"para","text":"对于想获得2个点的盈利目标的交易者来说，K线16和K线24是一个9个价位的失败。但是它们不会让交易者获得损失，并且降低他们的止损位。举个例子，交易者可能会在低于K线17的低点一个价位的位置，卖出在K线16这根买入信号K线处买入的头寸，也可能会在K线17的熊市收盘处卖出。对于在K线23这根买入信号K线处买入的头寸，交易者很可能会在两根K线之后形成的熊市K线的一个价位之下卖出。","pid":"p623"},{"t":"para","text":"当区间震荡强烈的时候，突破震荡区间的高点或者低点往往会失败。","pid":"p624"},{"t":"img","src":"assets/img/p1c9_005.webp","ctx":[{"t":"对于想获得2个点的盈利目标的交易者来说，K线16和K线24是一个9个价位的失败。但是它们不会让交易者获得损失，并且降低他们的止损位。举个例子，交易者可能会在低于K线17的低点一个价位的位置，卖出在K线16这根买入信号K线处买入的头寸，也可能会在K线17的熊市收盘处卖出。对于在K线23这根买入信号K线处买入的头寸，交易者很可能会在两根K线之后形成的熊市K线的一个价位之下卖出。","p":"p623"},{"t":"当区间震荡强烈的时候，突破震荡区间的高点或者低点往往会失败。","p":"p624"},{"t":"如图9.5所示，反弹至K线1的反弹浪非常强烈，但是因为开盘反转往往是非常急促的，同时它是一个更高的高点（高于昨日的收盘处的震荡高点），且向上打破了牛市趋势通道线，所以它是一个较为可信的卖空时机。","p":"p625"},{"t":"自K线1的震荡的高点之后的K线2的回调幅度较大，而且这些回调的K线都主体大，尾部长。在牛市趋势明显形成之前，一直持续着震荡的波动交易，交易者会认为市场上的做多交易者和做空交易者在此时都表现得非常积极。由于市场的表现确实无法证明这是一个牛市趋势日，所以在交易者看来，这应该是一个震荡区间日。","p":"p626"},{"t":"因为K线3高于之前的震荡高点。所以它也是一个震荡中的更高的高点。助推市场上升到K线3的市场动能非常强大。所以在没有出现第二次入场通道或者强大的反转K线之前，最好不要做空。不过如果交易者采取了做空，而之后市场下跌了26美分的价格，那么他们也可以获得最微小的盈利。","p":"p627"},{"t":"K线5是一个更高的高点，以及一个可信的做空点，特别是它还有两波微小的下跌浪（K线5是一根熊市趋势线，并且结束了从K线4开始的上升浪）。在市场重新上升之前，市场只回调了大概18美分的价格。一个敏捷的交易者很可能会马上买入平仓，但是大部分的交易者还是会继续持有，从而获得4个美分的损失","p":"p628"},{"t":"K线7也是这样一个向上的推进形态，并且它也是第二次卖空的入场通道（一个低点2）。K线7与K线5形成了一个双重顶部，特别是一个截断的三浪推进模式（K线3，5，7），所以之后出现一波下跌浪是非常有可能的。","p":"p629"},{"t":"K线10是一个更低的低点，并且是在一个可能的大牛市趋势中形成的第二波下跌浪。K线10的低点要高于K线2的低点，所以市场很可能会形成较大的震荡的牛市趋势。在牛市趋势或者震荡区间中形成的两波下跌浪，特别是低于移动平均线的两波下跌浪，通常是买入的好时机。","p":"p630"},{"t":"因为K线11要高于K线9的震荡高点，所以它是一个更高的高点虽然K线9其实是前一波下跌浪的一部分，但依然会有交易者在K线11交易（他们可能会暂停卖出，或者暂停买入，也可能会出现新的做空力量），因为市场高于之前的震荡高点的现象就是市场力量增强的迹象，同时也会淡化这个震荡区间日（后续很难再看到突破失败和市场力量增强的迹象）。","p":"p631"},{"t":"K线3比K线11要低一个价位。同时它也是一个双重顶部的熊市旗形，因此是一个卖空入场形态。K线10之后出现了两波上升浪，第二波上升浪超越了移动平均线（K线11是第一波上升浪）。","p":"p632"},{"t":"K线14是自K线10和K线12的震荡低点之后出现的更低的低点。","p":"p633"},{"t":"顺便一提的是，在K线10和K线14的买入交易都没有超越连接K线4和K线8的熊市趋势通道线。这增加了市场上进行买入交易的可能性。K线10和K线14处都形成了两根K线的反转。K线10是一个楔形牛市旗形的底部，而K线14则是一个扩展的三角形的牛市旗形的底部。","p":"p634"}]},{"t":"para","text":"如图9.5所示，反弹至K线1的反弹浪非常强烈，但是因为开盘反转往往是非常急促的，同时它是一个更高的高点（高于昨日的收盘处的震荡高点），且向上打破了牛市趋势通道线，所以它是一个较为可信的卖空时机。","pid":"p625"},{"t":"para","text":"自K线1的震荡的高点之后的K线2的回调幅度较大，而且这些回调的K线都主体大，尾部长。在牛市趋势明显形成之前，一直持续着震荡的波动交易，交易者会认为市场上的做多交易者和做空交易者在此时都表现得非常积极。由于市场的表现确实无法证明这是一个牛市趋势日，所以在交易者看来，这应该是一个震荡区间日。","pid":"p626"},{"t":"para","text":"因为K线3高于之前的震荡高点。所以它也是一个震荡中的更高的高点。助推市场上升到K线3的市场动能非常强大。所以在没有出现第二次入场通道或者强大的反转K线之前，最好不要做空。不过如果交易者采取了做空，而之后市场下跌了26美分的价格，那么他们也可以获得最微小的盈利。","pid":"p627"},{"t":"para","text":"K线5是一个更高的高点，以及一个可信的做空点，特别是它还有两波微小的下跌浪（K线5是一根熊市趋势线，并且结束了从K线4开始的上升浪）。在市场重新上升之前，市场只回调了大概18美分的价格。一个敏捷的交易者很可能会马上买入平仓，但是大部分的交易者还是会继续持有，从而获得4个美分的损失","pid":"p628"},{"t":"para","text":"K线7也是这样一个向上的推进形态，并且它也是第二次卖空的入场通道（一个低点2）。K线7与K线5形成了一个双重顶部，特别是一个截断的三浪推进模式（K线3，5，7），所以之后出现一波下跌浪是非常有可能的。","pid":"p629"},{"t":"para","text":"K线10是一个更低的低点，并且是在一个可能的大牛市趋势中形成的第二波下跌浪。K线10的低点要高于K线2的低点，所以市场很可能会形成较大的震荡的牛市趋势。在牛市趋势或者震荡区间中形成的两波下跌浪，特别是低于移动平均线的两波下跌浪，通常是买入的好时机。","pid":"p630"},{"t":"para","text":"因为K线11要高于K线9的震荡高点，所以它是一个更高的高点虽然K线9其实是前一波下跌浪的一部分，但依然会有交易者在K线11交易（他们可能会暂停卖出，或者暂停买入，也可能会出现新的做空力量），因为市场高于之前的震荡高点的现象就是市场力量增强的迹象，同时也会淡化这个震荡区间日（后续很难再看到突破失败和市场力量增强的迹象）。","pid":"p631"},{"t":"para","text":"K线3比K线11要低一个价位。同时它也是一个双重顶部的熊市旗形，因此是一个卖空入场形态。K线10之后出现了两波上升浪，第二波上升浪超越了移动平均线（K线11是第一波上升浪）。","pid":"p632"},{"t":"para","text":"K线14是自K线10和K线12的震荡低点之后出现的更低的低点。","pid":"p633"},{"t":"para","text":"顺便一提的是，在K线10和K线14的买入交易都没有超越连接K线4和K线8的熊市趋势通道线。这增加了市场上进行买入交易的可能性。K线10和K线14处都形成了两根K线的反转。K线10是一个楔形牛市旗形的底部，而K线14则是一个扩展的三角形的牛市旗形的底部。","pid":"p634"},{"t":"img","src":"assets/img/p1c9_006.webp","ctx":[{"t":"K线14是自K线10和K线12的震荡低点之后出现的更低的低点。","p":"p633"},{"t":"顺便一提的是，在K线10和K线14的买入交易都没有超越连接K线4和K线8的熊市趋势通道线。这增加了市场上进行买入交易的可能性。K线10和K线14处都形成了两根K线的反转。K线10是一个楔形牛市旗形的底部，而K线14则是一个扩展的三角形的牛市旗形的底部。","p":"p634"},{"t":"在图9.6的亚马逊（AMZN）的5分钟图表中，有很多无法超越震荡高点或低点的一根K线的突破。市场在经历了开盘上涨后，开始反转向下，做多交易者和做空交易者双方都增加了力量，一旦市场开始向某一方向发展，就会立刻被另一方力量反转。这使得这一天出现震荡区间的可能性增大。图中所有标识的K线都是失败的突破。图上狭窄的震荡区间从K线3开始，之后在K线6之前演变成一个微型的扩展三角顶部，在K线7之前又发展成一个扩展的三角底部。从底部开始的反弹并没有突破之前的顶部。相反，它与K线6正好形成了一个双重顶部，且市场在收盘时形成了卖空潮。","p":"p635"},{"t":"当一天看起来是要形成一个震荡区间日时，交易者们都希望突破会失败，所以他们会试图淡化这些突破的影响。","p":"p636"}]},{"t":"para","text":"在图9.6的亚马逊（AMZN）的5分钟图表中，有很多无法超越震荡高点或低点的一根K线的突破。市场在经历了开盘上涨后，开始反转向下，做多交易者和做空交易者双方都增加了力量，一旦市场开始向某一方向发展，就会立刻被另一方力量反转。这使得这一天出现震荡区间的可能性增大。图中所有标识的K线都是失败的突破。图上狭窄的震荡区间从K线3开始，之后在K线6之前演变成一个微型的扩展三角顶部，在K线7之前又发展成一个扩展的三角底部。从底部开始的反弹并没有突破之前的顶部。相反，它与K线6正好形成了一个双重顶部，且市场在收盘时形成了卖空潮。","pid":"p635"},{"t":"para","text":"当一天看起来是要形成一个震荡区间日时，交易者们都希望突破会失败，所以他们会试图淡化这些突破的影响。","pid":"p636"},{"t":"img","src":"assets/img/p1c9_007.webp","ctx":[{"t":"在图9.6的亚马逊（AMZN）的5分钟图表中，有很多无法超越震荡高点或低点的一根K线的突破。市场在经历了开盘上涨后，开始反转向下，做多交易者和做空交易者双方都增加了力量，一旦市场开始向某一方向发展，就会立刻被另一方力量反转。这使得这一天出现震荡区间的可能性增大。图中所有标识的K线都是失败的突破。图上狭窄的震荡区间从K线3开始，之后在K线6之前演变成一个微型的扩展三角顶部，在K线7之前又发展成一个扩展的三角底部。从底部开始的反弹并没有突破之前的顶部。相反，它与K线6正好形成了一个双重顶部，且市场在收盘时形成了卖空潮。","p":"p635"},{"t":"当一天看起来是要形成一个震荡区间日时，交易者们都希望突破会失败，所以他们会试图淡化这些突破的影响。","p":"p636"},{"t":"如图9.7所示，到了中午的时候，我们很容易看出震荡微弱，横向盘整。这增加了突破失败的概率。在突破很可能失败的情况下，K线1，2，3是第二次入场形态。引导市场走向K线3的顶部的趋势K线有着非常巨大的成交量，这吸引了一大批认为市场可能会形成趋势的做多交易者在这里采取行动。事实上，在这样的一天里，市场形成趋势的概率很低，所以最好还是淡化突破的影响，或者去寻找强劲的突破回调。K线1的低点和K线2的高点处的突破都非常微弱（都具有尾部突出，主体重叠的特点），所以两个突破都有较大的可能会失败。在K线3处结束的突破并没有出现一个突破回调，更没有给予做多交易者一次低风险的做多机会，所以在这里出现的只有第二次入场形态的卖空交易。","p":"p637"}]},{"t":"para","text":"如图9.7所示，到了中午的时候，我们很容易看出震荡微弱，横向盘整。这增加了突破失败的概率。在突破很可能失败的情况下，K线1，2，3是第二次入场形态。引导市场走向K线3的顶部的趋势K线有着非常巨大的成交量，这吸引了一大批认为市场可能会形成趋势的做多交易者在这里采取行动。事实上，在这样的一天里，市场形成趋势的概率很低，所以最好还是淡化突破的影响，或者去寻找强劲的突破回调。K线1的低点和K线2的高点处的突破都非常微弱（都具有尾部突出，主体重叠的特点），所以两个突破都有较大的可能会失败。在K线3处结束的突破并没有出现一个突破回调，更没有给予做多交易者一次低风险的做多机会，所以在这里出现的只有第二次入场形态的卖空交易。","pid":"p637"},{"t":"img","src":"assets/img/p1c9_008.webp","ctx":[{"t":"如图9.7所示，到了中午的时候，我们很容易看出震荡微弱，横向盘整。这增加了突破失败的概率。在突破很可能失败的情况下，K线1，2，3是第二次入场形态。引导市场走向K线3的顶部的趋势K线有着非常巨大的成交量，这吸引了一大批认为市场可能会形成趋势的做多交易者在这里采取行动。事实上，在这样的一天里，市场形成趋势的概率很低，所以最好还是淡化突破的影响，或者去寻找强劲的突破回调。K线1的低点和K线2的高点处的突破都非常微弱（都具有尾部突出，主体重叠的特点），所以两个突破都有较大的可能会失败。在K线3处结束的突破并没有出现一个突破回调，更没有给予做多交易者一次低风险的做多机会，所以在这里出现的只有第二次入场形态的卖空交易。","p":"p637"},{"t":"苹果是日内交易者最钟爱的股票之一，不过就像其他股票一样，它在反转初期价格波动很大，如图9.8所示，很容易让日内交易者止损出局，尽管交易本身是个不错的反转交易","p":"p638"},{"t":"当市场价格超过前一根K线的最高价后，交易者在K线1的双重底牛市旗形形态买入，买入点位可以是K线1之后的第三根或第六根K线。价格站稳移动平均线上方后。向上突破趋势线。不过之后又回补跳空缺了一个最小变动价位，使得多头被迫止损出局，然而却形成了一个双重底多头旗形。之后，市场便开始反转，第二天延续反转。这一个价位的新低导致多头被迫出局，诱使空头入场。到K线2的下跌浪是一个紧凑的下跌通道，是第三浪下跌浪，也是一个高点3的买入信号。高点3在一个下跌通道后出现相比高点2是一个更可靠的买入信号。因为一般通道在第三浪下跌后通常出现反转。这个买入信号非常好。主要是因为它快速将多头清洗出局，然后迅速反转，使得多头从心理上很难重新买入。之后，随着他们逐渐转变过来跟随入场，会进一步推动价格上行。","p":"p639"}]},{"t":"para","text":"苹果是日内交易者最钟爱的股票之一，不过就像其他股票一样，它在反转初期价格波动很大，如图9.8所示，很容易让日内交易者止损出局，尽管交易本身是个不错的反转交易","pid":"p638"},{"t":"para","text":"当市场价格超过前一根K线的最高价后，交易者在K线1的双重底牛市旗形形态买入，买入点位可以是K线1之后的第三根或第六根K线。价格站稳移动平均线上方后。向上突破趋势线。不过之后又回补跳空缺了一个最小变动价位，使得多头被迫止损出局，然而却形成了一个双重底多头旗形。之后，市场便开始反转，第二天延续反转。这一个价位的新低导致多头被迫出局，诱使空头入场。到K线2的下跌浪是一个紧凑的下跌通道，是第三浪下跌浪，也是一个高点3的买入信号。高点3在一个下跌通道后出现相比高点2是一个更可靠的买入信号。因为一般通道在第三浪下跌后通常出现反转。这个买入信号非常好。主要是因为它快速将多头清洗出局，然后迅速反转，使得多头从心理上很难重新买入。之后，随着他们逐渐转变过来跟随入场，会进一步推动价格上行。","pid":"p639"},{"t":"img","src":"assets/img/p1c9_009.webp","ctx":[{"t":"苹果是日内交易者最钟爱的股票之一，不过就像其他股票一样，它在反转初期价格波动很大，如图9.8所示，很容易让日内交易者止损出局，尽管交易本身是个不错的反转交易","p":"p638"},{"t":"当市场价格超过前一根K线的最高价后，交易者在K线1的双重底牛市旗形形态买入，买入点位可以是K线1之后的第三根或第六根K线。价格站稳移动平均线上方后。向上突破趋势线。不过之后又回补跳空缺了一个最小变动价位，使得多头被迫止损出局，然而却形成了一个双重底多头旗形。之后，市场便开始反转，第二天延续反转。这一个价位的新低导致多头被迫出局，诱使空头入场。到K线2的下跌浪是一个紧凑的下跌通道，是第三浪下跌浪，也是一个高点3的买入信号。高点3在一个下跌通道后出现相比高点2是一个更可靠的买入信号。因为一般通道在第三浪下跌后通常出现反转。这个买入信号非常好。主要是因为它快速将多头清洗出局，然后迅速反转，使得多头从心理上很难重新买入。之后，随着他们逐渐转变过来跟随入场，会进一步推动价格上行。","p":"p639"},{"t":"在开盘最初的一个小时里，股票很容易形成双重顶部旗形或者双重底部旗形（如图9.9所示）。碰到这种形态，大部分时候你是可以抓住机会交易的，但是永远不要将你所有的头寸都参与交易，同时为了以防这种形态的失败，你应该将你的止损位设置在盈亏平衡点上。","p":"p640"},{"t":"K线2和K线4形成了一个双重顶部的熊市旗形。但是随后就失败了。之后K线3和K线5形成了一个双重底部的牛市旗形","p":"p641"},{"t":"市场在K线4和K线6的双重顶部熊市旗形处再次反转，你可以通过做多净赚70美分。这个时候，你已经意识到市场正在形成震荡区间，而且很可能是三角形的形态。","p":"p642"},{"t":"K线7是另外一个失败的形态，但是也是一个做多的时机，因为市场在经历了一段大幅反弹（K线1之前的反弹浪）后出现的震荡区间往往具有连续性，同时K线3。5，6都在移动平均线上找到了支撑位。","p":"p643"},{"t":"虽然K线9之前的卖空潮持续了7根K线，但并没有出现强大的买方力量，所以你最好等到市场出现了第二次入场形态再行动。虽然K线9是一个更高的低点（同K线7相比）。但是它也有很大的可能会失败","p":"p644"},{"t":"在K线10处出现的突破回调是一个非常完美的二次入场形态。","p":"p645"}]},{"t":"para","text":"在开盘最初的一个小时里，股票很容易形成双重顶部旗形或者双重底部旗形（如图9.9所示）。碰到这种形态，大部分时候你是可以抓住机会交易的，但是永远不要将你所有的头寸都参与交易，同时为了以防这种形态的失败，你应该将你的止损位设置在盈亏平衡点上。","pid":"p640"},{"t":"para","text":"K线2和K线4形成了一个双重顶部的熊市旗形。但是随后就失败了。之后K线3和K线5形成了一个双重底部的牛市旗形","pid":"p641"},{"t":"para","text":"市场在K线4和K线6的双重顶部熊市旗形处再次反转，你可以通过做多净赚70美分。这个时候，你已经意识到市场正在形成震荡区间，而且很可能是三角形的形态。","pid":"p642"},{"t":"para","text":"K线7是另外一个失败的形态，但是也是一个做多的时机，因为市场在经历了一段大幅反弹（K线1之前的反弹浪）后出现的震荡区间往往具有连续性，同时K线3。5，6都在移动平均线上找到了支撑位。","pid":"p643"},{"t":"para","text":"虽然K线9之前的卖空潮持续了7根K线，但并没有出现强大的买方力量，所以你最好等到市场出现了第二次入场形态再行动。虽然K线9是一个更高的低点（同K线7相比）。但是它也有很大的可能会失败","pid":"p644"},{"t":"para","text":"在K线10处出现的突破回调是一个非常完美的二次入场形态。","pid":"p645"},{"t":"img","src":"assets/img/p1c9_010.webp","ctx":[{"t":"虽然K线9之前的卖空潮持续了7根K线，但并没有出现强大的买方力量，所以你最好等到市场出现了第二次入场形态再行动。虽然K线9是一个更高的低点（同K线7相比）。但是它也有很大的可能会失败","p":"p644"},{"t":"在K线10处出现的突破回调是一个非常完美的二次入场形态。","p":"p645"},{"t":"如图9.10所示，K线4是一个双重底部牛市旗形形态的入场信号，但是随着K线5的低点2的出现，这一形态失败了。低点2的出现是在K线4之前出现的下跌浪的反弹。这使得市场突破双重底部。出现了两波下跌浪直达K线7。在这之中，市场上出现了很多次做空的时机，比图说K线5的下方，或者说在K线4的低点之下的1到2个价位处，突破K线4的那根K线的收盘处，或者下一根K线的收盘处，而这根K线也是非常强劲的。","p":"p646"}]},{"t":"para","text":"如图9.10所示，K线4是一个双重底部牛市旗形形态的入场信号，但是随着K线5的低点2的出现，这一形态失败了。低点2的出现是在K线4之前出现的下跌浪的反弹。这使得市场突破双重底部。出现了两波下跌浪直达K线7。在这之中，市场上出现了很多次做空的时机，比图说K线5的下方，或者说在K线4的低点之下的1到2个价位处，突破K线4的那根K线的收盘处，或者下一根K线的收盘处，而这根K线也是非常强劲的。","pid":"p646"},{"t":"img","src":"assets/img/p1c9_011.webp","ctx":[{"t":"如图9.10所示，K线4是一个双重底部牛市旗形形态的入场信号，但是随着K线5的低点2的出现，这一形态失败了。低点2的出现是在K线4之前出现的下跌浪的反弹。这使得市场突破双重底部。出现了两波下跌浪直达K线7。在这之中，市场上出现了很多次做空的时机，比图说K线5的下方，或者说在K线4的低点之下的1到2个价位处，突破K线4的那根K线的收盘处，或者下一根K线的收盘处，而这根K线也是非常强劲的。","p":"p646"},{"t":"如图9.11所示，K线5和K线11都是头肩底部的右肩，正如图中所示，大部分的头肩形态都会失败（K线1和K线9是这两个头肩底部的左肩）。仅仅看到这种形态并不足以让你开始逆趋势交易。在这个反转形态出现之前，你最好看到一些早期的逆趋势交易的力量出现。即使是这样，也不能保证你的逆趋势交易会成功。K线2打破了趋势线，并且K线4之前的反弹浪非常强劲，但是它没有超过K线2的高点，这同样也标志着市场趋势减弱。虽然大部分聪明的交易者在经历了K线5的双重底部牛市旗形和做多入场形态后。并不会马上在K线6的失败处开始做空，但是他们会将他们的止损位移至盈亏平衡点上，他们想着，如果止损单被市场触及之后，市场依然交易活跃，那么被触发的止损指令将会带来一次突破性回调的买方入场时机。在图中，市场触及止损单后依然保持下跌。在突破K线5之后出现的一根K线的突破回调就是一次非常好的卖空时机。在一个三角模式中，K线5也是在K线4之后的下跌潮后出现的第三次下推浪，同时这个三角形态也是一个楔形牛市旗形。","p":"p647"},{"t":"K线11也是一个右肩，是一次非常好的买入时机，同样，交易者设置的盈亏平衡止损位也会被市场触及。","p":"p648"}]},{"t":"para","text":"如图9.11所示，K线5和K线11都是头肩底部的右肩，正如图中所示，大部分的头肩形态都会失败（K线1和K线9是这两个头肩底部的左肩）。仅仅看到这种形态并不足以让你开始逆趋势交易。在这个反转形态出现之前，你最好看到一些早期的逆趋势交易的力量出现。即使是这样，也不能保证你的逆趋势交易会成功。K线2打破了趋势线，并且K线4之前的反弹浪非常强劲，但是它没有超过K线2的高点，这同样也标志着市场趋势减弱。虽然大部分聪明的交易者在经历了K线5的双重底部牛市旗形和做多入场形态后。并不会马上在K线6的失败处开始做空，但是他们会将他们的止损位移至盈亏平衡点上，他们想着，如果止损单被市场触及之后，市场依然交易活跃，那么被触发的止损指令将会带来一次突破性回调的买方入场时机。在图中，市场触及止损单后依然保持下跌。在突破K线5之后出现的一根K线的突破回调就是一次非常好的卖空时机。在一个三角模式中，K线5也是在K线4之后的下跌潮后出现的第三次下推浪，同时这个三角形态也是一个楔形牛市旗形。","pid":"p647"},{"t":"para","text":"K线11也是一个右肩，是一次非常好的买入时机，同样，交易者设置的盈亏平衡止损位也会被市场触及。","pid":"p648"},{"t":"img","src":"assets/img/p1c9_012.webp","ctx":[{"t":"如图9.11所示，K线5和K线11都是头肩底部的右肩，正如图中所示，大部分的头肩形态都会失败（K线1和K线9是这两个头肩底部的左肩）。仅仅看到这种形态并不足以让你开始逆趋势交易。在这个反转形态出现之前，你最好看到一些早期的逆趋势交易的力量出现。即使是这样，也不能保证你的逆趋势交易会成功。K线2打破了趋势线，并且K线4之前的反弹浪非常强劲，但是它没有超过K线2的高点，这同样也标志着市场趋势减弱。虽然大部分聪明的交易者在经历了K线5的双重底部牛市旗形和做多入场形态后。并不会马上在K线6的失败处开始做空，但是他们会将他们的止损位移至盈亏平衡点上，他们想着，如果止损单被市场触及之后，市场依然交易活跃，那么被触发的止损指令将会带来一次突破性回调的买方入场时机。在图中，市场触及止损单后依然保持下跌。在突破K线5之后出现的一根K线的突破回调就是一次非常好的卖空时机。在一个三角模式中，K线5也是在K线4之后的下跌潮后出现的第三次下推浪，同时这个三角形态也是一个楔形牛市旗形。","p":"p647"},{"t":"K线11也是一个右肩，是一次非常好的买入时机，同样，交易者设置的盈亏平衡止损位也会被市场触及。","p":"p648"},{"t":"如图9.12所示，K线2和K线6处的下跌浪突破了主要趋势线，所以，在两个例子中，对于之前的高点的两浪测试应该都会带来一次卖空的机会。事实证明，在K线3的低点2处卖空将会获得收益，不论你是在K线3的下方卖空，还是在两根K线后的第二次入场形态处卖空。","p":"p649"},{"t":"若你在K线8处卖空，则收获利润的不确定较大。因为在此处，市场是通过一根大牛市趋势线来检测的（几乎是一根外包K线，它与之前的K线有着相同的低点）。在出现外包K线后如何操作呢？传统的方法是在这根K线的高点上方一个价位，以及低点下方二个价位处都设置止损位，当市场沿着某一个方向出现突破时，这些止损位将会被触及。然而，外包K线基本上也属于二根K线的震荡形态，而大部分震荡区间的突破都是会失败的。所以，你其实并不应该在外包K线的突破出现时入场。因为风险实在是太大了（因为K线的主体较大，突破这根K线较难）。因为图中出现的是两根K线的反转，所以最安全的入场方式就是在低于两根K线的低点处入场。也就是那根大牛市趋势线的低点下方，因为市场通常是会低于熊市K线，但是不会同时低于两根反转K线，正如图中发生的一样。","p":"p650"},{"t":"如果你在K线8突破内含K线时做空，你将会在市场收盘时感到不安（因为这根内含线是一根十字星，这预示着市场上的信心不足）。但是大部分的交易者应该不会采取做空，因为之前出现了3根以上的震荡K线，且其中还含有至少一根十字星K线，这通常意味着市场上不确定的因素太多（倒钩型）。在外包K线之前的两根小K线看起来也非常像十字星K线。所以最好还是等到市场上出现了更多的价格信号再行动。然而，如果你没有在K线8处做空，你应该相信还是会有许多交易者在这里做空的，同时由于他们的入场K线呈现出十字星收尾的态势，而这将使得他们对于自己的头寸感到极度的不安。他们将会快速卖出头寸，因此会再度被市场困住。他们希望在入场的K线8的一个价位之上卖回做空的头寸，并且在他们看到更好的价格行为之前他们都拒绝卖出。随着卖方通过买入头寸渐渐离场，在他们离场的同时买入头寸（K线9，正好是在K线8的一个价位之上），将带来一次刮头皮交易的机遇，市场很有可能还会持续两波上升浪。市场上的交易者可以在K线9的一个价位之上买入，也可以在K线9之后的一根K线上方买入。基于K线9是一根大牛市趋势K线，因此这也是一根明显的买入信号K线。","p":"p651"}]},{"t":"para","text":"如图9.12所示，K线2和K线6处的下跌浪突破了主要趋势线，所以，在两个例子中，对于之前的高点的两浪测试应该都会带来一次卖空的机会。事实证明，在K线3的低点2处卖空将会获得收益，不论你是在K线3的下方卖空，还是在两根K线后的第二次入场形态处卖空。","pid":"p649"},{"t":"para","text":"若你在K线8处卖空，则收获利润的不确定较大。因为在此处，市场是通过一根大牛市趋势线来检测的（几乎是一根外包K线，它与之前的K线有着相同的低点）。在出现外包K线后如何操作呢？传统的方法是在这根K线的高点上方一个价位，以及低点下方二个价位处都设置止损位，当市场沿着某一个方向出现突破时，这些止损位将会被触及。然而，外包K线基本上也属于二根K线的震荡形态，而大部分震荡区间的突破都是会失败的。所以，你其实并不应该在外包K线的突破出现时入场。因为风险实在是太大了（因为K线的主体较大，突破这根K线较难）。因为图中出现的是两根K线的反转，所以最安全的入场方式就是在低于两根K线的低点处入场。也就是那根大牛市趋势线的低点下方，因为市场通常是会低于熊市K线，但是不会同时低于两根反转K线，正如图中发生的一样。","pid":"p650"},{"t":"para","text":"如果你在K线8突破内含K线时做空，你将会在市场收盘时感到不安（因为这根内含线是一根十字星，这预示着市场上的信心不足）。但是大部分的交易者应该不会采取做空，因为之前出现了3根以上的震荡K线，且其中还含有至少一根十字星K线，这通常意味着市场上不确定的因素太多（倒钩型）。在外包K线之前的两根小K线看起来也非常像十字星K线。所以最好还是等到市场上出现了更多的价格信号再行动。然而，如果你没有在K线8处做空，你应该相信还是会有许多交易者在这里做空的，同时由于他们的入场K线呈现出十字星收尾的态势，而这将使得他们对于自己的头寸感到极度的不安。他们将会快速卖出头寸，因此会再度被市场困住。他们希望在入场的K线8的一个价位之上卖回做空的头寸，并且在他们看到更好的价格行为之前他们都拒绝卖出。随着卖方通过买入头寸渐渐离场，在他们离场的同时买入头寸（K线9，正好是在K线8的一个价位之上），将带来一次刮头皮交易的机遇，市场很有可能还会持续两波上升浪。市场上的交易者可以在K线9的一个价位之上买入，也可以在K线9之后的一根K线上方买入。基于K线9是一根大牛市趋势K线，因此这也是一根明显的买入信号K线。","pid":"p651"},{"t":"img","src":"assets/img/p1c9_013.webp","ctx":[{"t":"若你在K线8处卖空，则收获利润的不确定较大。因为在此处，市场是通过一根大牛市趋势线来检测的（几乎是一根外包K线，它与之前的K线有着相同的低点）。在出现外包K线后如何操作呢？传统的方法是在这根K线的高点上方一个价位，以及低点下方二个价位处都设置止损位，当市场沿着某一个方向出现突破时，这些止损位将会被触及。然而，外包K线基本上也属于二根K线的震荡形态，而大部分震荡区间的突破都是会失败的。所以，你其实并不应该在外包K线的突破出现时入场。因为风险实在是太大了（因为K线的主体较大，突破这根K线较难）。因为图中出现的是两根K线的反转，所以最安全的入场方式就是在低于两根K线的低点处入场。也就是那根大牛市趋势线的低点下方，因为市场通常是会低于熊市K线，但是不会同时低于两根反转K线，正如图中发生的一样。","p":"p650"},{"t":"如果你在K线8突破内含K线时做空，你将会在市场收盘时感到不安（因为这根内含线是一根十字星，这预示着市场上的信心不足）。但是大部分的交易者应该不会采取做空，因为之前出现了3根以上的震荡K线，且其中还含有至少一根十字星K线，这通常意味着市场上不确定的因素太多（倒钩型）。在外包K线之前的两根小K线看起来也非常像十字星K线。所以最好还是等到市场上出现了更多的价格信号再行动。然而，如果你没有在K线8处做空，你应该相信还是会有许多交易者在这里做空的，同时由于他们的入场K线呈现出十字星收尾的态势，而这将使得他们对于自己的头寸感到极度的不安。他们将会快速卖出头寸，因此会再度被市场困住。他们希望在入场的K线8的一个价位之上卖回做空的头寸，并且在他们看到更好的价格行为之前他们都拒绝卖出。随着卖方通过买入头寸渐渐离场，在他们离场的同时买入头寸（K线9，正好是在K线8的一个价位之上），将带来一次刮头皮交易的机遇，市场很有可能还会持续两波上升浪。市场上的交易者可以在K线9的一个价位之上买入，也可以在K线9之后的一根K线上方买入。基于K线9是一根大牛市趋势K线，因此这也是一根明显的买入信号K线。","p":"p651"},{"t":"在图9.13的大约两个小时的K线图中，通过刮头皮交易做空4个价位将是一个盈利性的策略。然而，在K线4这根内含K线处做空的话，市场只下跌了5个价位便立即反弹。这意味着许多做空交易者并没有完全实现他们的盈利目标的限价指令，许多做空交易者在盈亏平衡点就被迫匆离场，而他们的盈亏平衡点肯定在K线5之上。市场正在测试昨日的低点，同时也是第二次探测是否有低于趋势通道线的低点出现（基于K线1至K线3处的趋势线）。做多交易者正在寻找支撑自己做多的理由，而这次失败的做空刮头皮交易时机是他们能找到的最后的理由。","p":"p652"}]},{"t":"para","text":"在图9.13的大约两个小时的K线图中，通过刮头皮交易做空4个价位将是一个盈利性的策略。然而，在K线4这根内含K线处做空的话，市场只下跌了5个价位便立即反弹。这意味着许多做空交易者并没有完全实现他们的盈利目标的限价指令，许多做空交易者在盈亏平衡点就被迫匆离场，而他们的盈亏平衡点肯定在K线5之上。市场正在测试昨日的低点，同时也是第二次探测是否有低于趋势通道线的低点出现（基于K线1至K线3处的趋势线）。做多交易者正在寻找支撑自己做多的理由，而这次失败的做空刮头皮交易时机是他们能找到的最后的理由。","pid":"p652"},{"t":"img","src":"assets/img/p1c9_014.webp","ctx":[{"t":"在图9.13的大约两个小时的K线图中，通过刮头皮交易做空4个价位将是一个盈利性的策略。然而，在K线4这根内含K线处做空的话，市场只下跌了5个价位便立即反弹。这意味着许多做空交易者并没有完全实现他们的盈利目标的限价指令，许多做空交易者在盈亏平衡点就被迫匆离场，而他们的盈亏平衡点肯定在K线5之上。市场正在测试昨日的低点，同时也是第二次探测是否有低于趋势通道线的低点出现（基于K线1至K线3处的趋势线）。做多交易者正在寻找支撑自己做多的理由，而这次失败的做空刮头皮交易时机是他们能找到的最后的理由。","p":"p652"},{"t":"如图9.14所示，这些5分钟的QQQ交易K线在失败前都到达了8至11个价位。由于保护性止损位的设置，这些刮头皮交易者都将会被迫在盈亏平衡点附近离场，虽然并不明显，但依然值得一提。当然。图中还有许多其他的可以盈利的刮头皮交易时机，但是如果其中大部分都是失败的交易时机，这将使得刮头皮交易者也疲于交易。那么这将使得交易者失去耐心和注意力，从而错失盈利的时机。在一个清晰的熊市趋势日，你可以进行的最好的交易就是顺着趋势交易，并且寻找一个卖空的低点2的入场形态，最好是在移动平均线上寻找。当你的获胜率提高时，将使得你拥有更为积极健康的态度参与交易，你将继续寻找入场时机，至少会使得一部分头寸参与交易。","p":"p653"},{"t":"在AAPL的交易中，通常会产生1美元的刮头皮交易机会（通常市场的移动会大于1美元，这将使得刮头皮交易者在1美元的限价指令上可以获得部分的盈利）。","p":"p654"}]},{"t":"para","text":"如图9.14所示，这些5分钟的QQQ交易K线在失败前都到达了8至11个价位。由于保护性止损位的设置，这些刮头皮交易者都将会被迫在盈亏平衡点附近离场，虽然并不明显，但依然值得一提。当然。图中还有许多其他的可以盈利的刮头皮交易时机，但是如果其中大部分都是失败的交易时机，这将使得刮头皮交易者也疲于交易。那么这将使得交易者失去耐心和注意力，从而错失盈利的时机。在一个清晰的熊市趋势日，你可以进行的最好的交易就是顺着趋势交易，并且寻找一个卖空的低点2的入场形态，最好是在移动平均线上寻找。当你的获胜率提高时，将使得你拥有更为积极健康的态度参与交易，你将继续寻找入场时机，至少会使得一部分头寸参与交易。","pid":"p653"},{"t":"para","text":"在AAPL的交易中，通常会产生1美元的刮头皮交易机会（通常市场的移动会大于1美元，这将使得刮头皮交易者在1美元的限价指令上可以获得部分的盈利）。","pid":"p654"},{"t":"img","src":"assets/img/p1c9_015.webp","ctx":[{"t":"如图9.14所示，这些5分钟的QQQ交易K线在失败前都到达了8至11个价位。由于保护性止损位的设置，这些刮头皮交易者都将会被迫在盈亏平衡点附近离场，虽然并不明显，但依然值得一提。当然。图中还有许多其他的可以盈利的刮头皮交易时机，但是如果其中大部分都是失败的交易时机，这将使得刮头皮交易者也疲于交易。那么这将使得交易者失去耐心和注意力，从而错失盈利的时机。在一个清晰的熊市趋势日，你可以进行的最好的交易就是顺着趋势交易，并且寻找一个卖空的低点2的入场形态，最好是在移动平均线上寻找。当你的获胜率提高时，将使得你拥有更为积极健康的态度参与交易，你将继续寻找入场时机，至少会使得一部分头寸
