场即将扭转向上的迹象。在经历七根K线的下跌后，行情横盘整理至K线23并不是一个很强的底部，大多数多头不愿意在此刻买入。除非价格进一步下行。空头愿意在任何时间内获利了结，但只有出现合理的底部征兆时，空头才会买回自己的空仓。没有底部征兆，多空双方都不愿意买入。同时，剩余的多头继续卖出他们的持仓。增加了市场上的抛压。从K线23开始的下跌过程中，空头看到市场上不断增加的抛压，他们也继续卖出。结果导致市场出现了二个强有力的趋势反转，行情在K线16处向下突破了上涨趋势线后，在K线19处形成了一个更低的高点。正如所有强劲趋势的情况一样，交易员们不断加仓增强空头力量，市场以尖形的形式急速下滑至K线25的低点以及K线28的低点，这时空头开始平仓获利。所有趋势K线都是尖形、高潮、突破和跳空缺口。K线25是一根空头突破的大阴线，并且很可能伴随一波可测量的下跌行情，测量基准为震荡区间的高度。K线25本身很可能成为一个测量跳空，缺口的中点为K线16的最低点（缺口顶端）和K线27的最高点（缺口底端）之间的中点。这个可能在当天或第二天引出一波可测量的下跌行情。","pid":"p117"},{"t":"para","text":"反弹至K线19的波段是一个双重顶下降旗形。一个楔形下降旗形，和下跌趋势中两个回合的上升小波段（K线15和K线16之间的双波段高点是第一回合的上升小波段），它符合优秀的交易员盈亏方程式的标准。风险就是价格超过了K线19的高点，大概在10美分左右，回报至少50美分，价格低于K线16的低点，市场可能形成一个双重顶和一个大三角形或一个上升旗形。由于市场处于熊市或至少是一个震荡区间的顶部，成功的概率最低达到60%。60%的成功率，加上10美分的风险和50美分的回报，这是一笔很不错的交易如果一个交易员做十笔这样的交易，将赚3美元，亏40美分，平均每笔交易盈利26美分。","pid":"p118"},{"t":"para","text":"交易员们认为如果市场跌破K线16，就很可能从双重顶开始下跌一个可测量的幅度，事实也正是如此。K线16的区域是对突破跳空的一次突破测试，突破跳空是指K线1到K线3的上升尖形。行情在这次测试中反弹之后，多头不希望价格跌破这个测试水平，因为跌破了则表明市场多头力量疲弱。就像空头不希望反弹至K线19的那波行情价格高于K线13所形成的更低的高点一样，因为如果超过了这个更低的高点，就可能走出一波可测量的上涨行情，多头也不希望从K线19开始的那波下跌行情价格低于K线16所形成的更高的低点，因为如果跌破了这个更高的低点，就可能走出一波可测量的下跌行情。由于我的朋友会把从K线19开始的这一轮下跌看作是一个趋势交易的机会，他会以趋势交易的方法来操作（第一本书讨论了如何进行趋势交易）。初始风险只有10美分，赢面也比较大，最小的目标是市场可能会试探K线16的低点，所以如果在这个试探过程中出现暂停K线，他可能会平掉一半仓位。由于行情并没出现休整，就没有明显的获利了结行为，他可能会等到K线28附近才平仓了结其头寸。这是出现在抛售高潮K线之后的一次休整，而这次抛售高潮之前是一个潜在最终旗形（以K线27为结尾的三根K线）。他可能会在这里平掉一半持仓，获利1.2美元，然后在收盘前的一两分钟内了结剩余的持仓，将1.3美元落袋为安。","pid":"p119"},{"t":"para","text":"顺便提及的是，在超涨的上涨趋势中，强势的多头和强势的空头都喜欢看到一根大阳线出现，因为它通常会引出一波含两个小波段并跌破移动平均线的回调行情，就如这里的K线9。预期的调整为多空双方提供了短暂的交易机会，尽管这些不算是趋势反转交易。K线9是在没怎么调整的情况下出现的第三次连续的买入高潮（第一次是K线1到K线3，第二次是K线5到K线6)。它更可能是一次衰竭跳空而非测量跳空（它更可能是一波调整的起点，而非一轮上升小波段的起点）。在这种情况下，强势的多头和强势的空头都会在K线9的收盘价处，或最高点上方，或下一两根K线的收盘价处（尤其在K线10之后的那根K线是一根大阴线），以及前一根K线最低点的下方卖出。多头在这里卖出多仓获利了结，空头这里卖出建立空仓。大多数空头都会设置其保护性止损单，止损幅度小于产生买入高潮的阳线所覆盖的变动价位，如K线9所覆盖的价位。在含两个小波段的调整行情结束之前，如K线14到K线16的区域（跌至K线12是第一个下降波段），多头不会再次买入，空头也不会平仓获利。在行情对K线10的趋势高点进行弱势或强势的高点冲击之后，抛售的力量足够强大，以至于多空双方都认为市场可能会进入一个熊市的趋势反转。","pid":"p120"}],"wcount":4844},{"id":"p1c2","title":"第2章　反转动能的标志","blocks":[{"t":"para","text":"第2章　反转动能的标志","pid":"p121"},{"t":"para","text":"强有力的反转形态，和其他强烈的形态，如强势的突破或强劲的趋势一样，在本质上拥有相同的特征。","pid":"p122"},{"t":"para","text":"以下是强力牛市反转中一些常见的特征：","pid":"p123"},{"t":"para","text":"出现上下影线都很短甚至没有影线的牛市反转大阳线","pid":"p124"},{"t":"para","text":"接下来的两三根K线都是阳线，且大小跟近期K线相当","pid":"p125"},{"t":"para","text":"上升急速持续五到十根K线，期间回调不多于一到两根K线，反转持续很多根K线，走出了一个波段高点，一个先前下跌趋势的下降旗形。","pid":"p126"},{"t":"para","text":"急速中一根或多根K线的低点与前一根K线的收盘价持平或只比它稍低一个价位。","pid":"p127"},{"t":"para","text":"急速中一根或多根K线的开盘价在前一根K线的收盘价之上。","pid":"p128"},{"t":"para","text":"急速中一根或多根K线以其最高点或比最高点稍低一个价位收盘。","pid":"p129"},{"t":"para","text":"整个趋势背景使反转成为可能，比如行情向上突破下跌趋势线后浅度或深度回踩，试探熊市低点","pid":"p130"},{"t":"para","text":"突破形态的第一根或第二根K线的收盘价高于之前多根K线的高点。","pid":"p131"},{"t":"para","text":"在突破持续超过至少三根K线之后才出现第一次明显的回调。","pid":"p132"},{"t":"para","text":"突破后的第一次回调仅持续一两根K线，而且回调的第一根K线不会出现强烈的牛转熊反转信号。","pid":"p133"},{"t":"para","text":"上升急速非常强烈，突破了数个阻力位。如移动平均线、先前的","pid":"p134"},{"t":"para","text":"当反转的第一根K线正在成型时，行情大部分时候都在最高点附","pid":"p135"},{"t":"para","text":"行情给你带来一种紧迫感。你希望等待回调买入的好机会，但却一直等不到","pid":"p136"},{"t":"para","text":"本次信号K线是过去一段时间的第二次尝试反转（二次信号）。","pid":"p137"},{"t":"para","text":"本次反转通过行情击穿原有趋势的趋势通道线而开启。","pid":"p138"},{"t":"para","text":"行情反转于一个显著的波段高点或低点（例如，行情先是向下突破早前一个强势波段的低点，然后反转上行）。","pid":"p139"},{"t":"para","text":"高点1和高点2的回调以牛市反转K线作为信号K线。","pid":"p140"},{"t":"para","text":"K线的每一个细节都跟势表现一致：收盘价、最高价、最低价或K线主体。","pid":"p141"},{"t":"para","text":"回调幅度非常小，偏于横盘整理","pid":"p142"},{"t":"para","text":"之前有突破过下跌趋势线（这代表这已经不是第一次市场展现出多头的力量）。","pid":"p143"},{"t":"para","text":"回调探底的行为缺乏动能配合，K线相互重叠的现象较多，而且大部分是阳线。","pid":"p144"},{"t":"para","text":"回调探底会在移动平均线或旧的下跌趋势线附近受到支撑。","pid":"p145"},{"t":"para","text":"本次突破创出近期收盘价和最高价的新高。例如。在下降通道内出现一根大阳线，这根突破K线的最高价和收盘价高于过去5根、20根甚至更多K线的最高价和收盘价。这根阳线的收盘价创新高比它的最高价创新高的意义更大。","pid":"p146"},{"t":"para","text":"以下是强力熊市反转中一些常见的特征：","pid":"p147"},{"t":"para","text":"出现上下影线都很短甚至没有影线的熊市反转大阴线","pid":"p148"},{"t":"para","text":"接下来的两三根K线都是阴线。且大小跟近期K线相当","pid":"p149"},{"t":"para","text":"下降急速持续五到十根K线，期间回调不多于一到两根K线，反转持续很多根K线，走出了一个波段低点，一个先前上涨趋势的上升旗形。","pid":"p150"},{"t":"para","text":"急速中一根或多根K线的高点与前一根K线的收盘价持平或只比它稍高一个价位。","pid":"p151"},{"t":"para","text":"急速中一根或多根K线的开盘价在前一根K线的收盘价之下。","pid":"p152"},{"t":"para","text":"急速中一根或多根K线以其最低点或比最低点稍高一个价位收盘。","pid":"p153"},{"t":"para","text":"整个趋势背景使反转成为可能。比如行情在向下突破上涨趋势线后弱势或强势反弹，冲击牛市高点","pid":"p154"},{"t":"para","text":"突破形态的第一根或第二根K线的收盘价低于之前多根K线的低点。","pid":"p155"},{"t":"para","text":"持续突破超过至少三根K线之后才出现第一次明显的反弹。","pid":"p156"},{"t":"para","text":"突破后的第一次反弹仅持续一两根K线。而且反弹的第一根K线不会出现强烈的熊转牛反转信号。","pid":"p157"},{"t":"para","text":"突破后的第一次反弹不会触及盈亏平衡点（卖出价）。","pid":"p158"},{"t":"para","text":"下降急速非常强烈。突破了数个支撑位，如移动平均线、先前的波段低点、趋势线，并且跌破支撑位很多个价位。","pid":"p159"},{"t":"para","text":"当反转的第一个K线正在成型时，行情大部分时候都在最低点附近排洄，且反弹幅度小于K线主体的四分之一。","pid":"p160"},{"t":"para","text":"行情给你带来一种紧迫感。你希望等待反弹卖出的好机会。但却一直等不到。","pid":"p161"},{"t":"para","text":"本次信号K线是过去一段时间的第二次尝试反转（二次信号）。","pid":"p162"},{"t":"para","text":"本次反转通过行情击穿原有趋势的趋势通道线而开启。","pid":"p163"},{"t":"para","text":"行情反转于一个显著的波段高点或低点区间（例如，行情先是向上突破早前一个强势波段的高点，然后反转下行）。","pid":"p164"},{"t":"para","text":"低点1和低点2的反弹以熊市反转K线作为信号K线。","pid":"p165"},{"t":"para","text":"K线的每一个细节都跟趋势表现一致：收盘价最高价、最低价或K线主体。","pid":"p166"},{"t":"para","text":"反弹幅度非常小，偏于横盘整理。","pid":"p167"},{"t":"para","text":"之前有突破过上涨趋势线（这代表这已经不是第一次市场展现出空头的力量）。","pid":"p168"},{"t":"para","text":"反弹探顶的行为缺之动能配合，K线相互重叠的现象较多，而且大部分是阴线。","pid":"p169"},{"t":"para","text":"反弹探顶会在移动平均线或旧的上涨趋势线附近受到阻力。","pid":"p170"},{"t":"para","text":"本次突破创出近期收盘价和最低价的新低。例如，在上升通道内出现一根大阴线这根突破K线的最低价和收盘价低于过去5根、20根甚至更多K线的最低价和收盘价。这根阴线的收盘价创新低比它的最低价创新低的意又更大。","pid":"p171"},{"t":"para","text":"有些反转形态能导致整个市场趋势的反转，而其他的有些反转只是形成了小规模的反向波动。在反转的前后仔细分析价格行为，能帮助交易员衡量他们应该持多大比例的仓位，以及预期的波动幅度有多大。当市场处于一个强劲的趋势时，交易员不应该逆势交易，而应该等待趋势线被突破，或至少趋势通道线被反转击穿的情况。然而在震荡行情中交易员可以双向交易。","pid":"p172"},{"t":"para","text":"一个强有力的反转形态，拥有很多特点，越多特点展现出来，逆势交易就越有利可图，交易员们在决定他们的持仓比例时就越激进。在趋势反转中，对原先趋势线的突破越有力，该反转形态就越加分，且持续越久，并更可能形成两个回合以上的小波段。最强劲的趋势线突破，都伴随着凶猛的势头，这种行情以波涛涵涌之势穿过移动平均线，而且通常都会超过原来趋势的波段高点或低点。","pid":"p173"},{"t":"para","text":"原先的趋势越强，就越需要一个强大的反转，才能使交易员从逆势交易中获利。强劲趋势的特征在第一本书的第19章中已经讨论过，并列在了本书开始的简介位置。例如，如果交易员想在一个非常强势的牛市中做空，他们就希望能捕捉尽可能多的强力反转标志。相反，如果当前的牛市走得比较反复，他们就敢于在相对较弱的反转信号中做空。如果市场只是在一个震荡区间里反弹到顶部，他们也许根本不需要反转K线就开始做空了。最后，如果市场处于一个楔形上升旗形当中，而他们正在寻找一个行情回归牛市的契机，他们甚至可能在一根阴线上方就买入了。","pid":"p174"},{"t":"para","text":"顺便提及的是，如果市场是一个零和游戏，为什么95%的参与者都是盈利性的机构呢？因为这不是一个真正意义上的零和游戏。我们的经济不断增长并不断创造财富。市场的总价值大于10年前的市场，更远大于100年前的市场。这些公司都在竞争中尽可能多地获取新的财富，在多数年份里，这些新的价值足以令几乎所有公司都盈利。虽然在经济紧缩的年份里，大多数公司都赔钱，但他们会在经济扩张的时候赚更多的钱，使自己实现总体盈利。","pid":"p175"}],"wcount":2543},{"id":"p1c3","title":"第3章　主要趋势反转","blocks":[{"t":"para","text":"第3章　主要趋势反转","pid":"p176"},{"t":"para","text":"很多做长期投资的机构投资者，都把每一次强势击穿上涨趋势线的突破视为一个买入机会，因为他们知道虽然空头时不时就想反转趋势但八成以上的概率都以失败告终。即使下跌行情规模巨大且势头猛，且远远跌破趋势线和移动平均线，他们也会买入。他们希望自己的买入能起到一个引导作用，让其他交易员看到他们的动作也跟风做多。他们预期这批买入引起的反弹能最低限度冲击市场高点下方的突破口。一旦行情到达预期，他们再判断趋势是否已经反转。如果趋势确已反转，他们便会停止做多，并且把他们在这次反弹中新建的多仓以及之前一路买上来的其他多仓全部平掉。他们大部分的头寸都是盈利的，因为他们在很早之前就已经建仓，建仓价比最近这次在反弹期间的买入价还要低得多。但是，由于他们在市场一路上扬时持续买入，有些多仓买在了牛市的最高位，这些多仓在他们离场时不得不止损出局。由于这些做长期投资的机构投资者是之前每一次迅猛下跌时都还屡次做多的交易员，所以一旦他们都认为市场正在下行，趋势即将反转，市场上就再也没有人会在势头凶猛的下跌行情中买入了。他们将耐心等待市场下滑至一个有长期投资价值的价格区间，比如月线图中的趋势线等这些长期的支撑区间。一旦价格到达这些区间，他们将再次大举买入，每当空头企图延伸下跌趋势时，他们都会与之对抗。在某些价位上，其他机构投资者也会看到这些正在形成的支撑位，他们也会跟风买入。市场很快形成一个势头强劲的上涨行情，再回落对熊市低点进行试探，然后反转进入一轮新的牛市。","pid":"p177"},{"t":"para","text":"每一个反转形态都是某种形式上的震荡区间。先是多空双方胶着对战，行情反复，然后市场态度逐渐清晰，逆势交易的一方获得控制权。","pid":"p178"},{"t":"para","text":"“主要趋势反转”这一术语对不同的交易员来说有不同的含义，没有人主要趋势反转”能够明确地告诉你市场已经反转了，除非行情的反向波动已经持续了至少一段时间，总在场内的头寸在大多数交易员眼中已经改变了方向。然而，单凭这点不足以把一波反转行情称为“主要”趋势反转。对很多交易员来说，在5分钟图上，总在场内的头寸方向在每一个可交易的波段上都会发生变化。也就是说在大部分交易日里，这些头寸方向一天改变很多次，而大趋势的方向却通常保持不变。不论是牛市反转为熊市还是熊市反转为牛市，一个主要趋势反转会在你面前的图表上呈现两波趋势，并在两波趋势之间有一次反转。这种类型的反转与很多图表中上蹄下跳的反转不一样。这种反转的波动幅度足以让我们完成一笔交易，但还没能够改写主要趋势的方向。而且。不管当前行情是否存在一个明显的走向，这种小型反转都有可能出现。","pid":"p179"},{"t":"para","text":"大部分主要趋势反转的最早的信号都不太可能反转成功，但却提供了一个收益最丰厚的交易机会，而且回报常常比风险大好几倍。市场在反转初期往往都在横向整理。反复地反抽或回调。但如果趋势真的正在反转的话，新一轮的趋势将会很快显现。很多交易员倾向于在趋势已经明确的时候再寻找入场时机。这些交易员只在至少有60%以上成功率的时候才进行交易，他们宁愿少赚点（他们在趋势已经成型的时候才开始入场）以换取更高的成功率。既然两种方式都能使交易员的盈号方程式趋于正数，只要适当地利用，两种方式都是可行的。","pid":"p180"},{"t":"para","text":"在主要趋势反转行情中以下四点是必要的：","pid":"p181"},{"t":"para","text":"当前的行情必须是一轮趋势性的走势。","pid":"p182"},{"t":"para","text":"一个反向的波动（一次反转）必须足够强势，并突破趋势线和移动平均线。","pid":"p183"},{"t":"para","text":"对趋势的极值进行测试，然后开始二次反转（趋势的极值包括在牛市顶部的一个更高的高点，一个双重顶，一个更低的高点，以及熊市底部一个更低的低点，一个双重底，一个更高的低点）。","pid":"p184"},{"t":"para","text":"二次反转必须走得足够深远。其波动幅度使市场达成一个趋势已经反转的共识。","pid":"p185"},{"t":"para","text":"首先，当前必须是一轮趋势行情，反向波动必须足够强势，并突破趋势线，最好能突破移动平均线。其次，原趋势恢复并对旧的趋势极值进行测试，然后市场开始二次反转。例如，在牛市中，行情强势突破上涨趋势线后，交易员们开始关注接下来的反弹。如果市场从原来的高位区间（一个更低的高点，双重顶，或更高的高点）再次翻转向下，那么这次测试成功，交易员们就开始怀疑趋势可能已经在反转。最后，大幅度的二次反转使交易员们认为市场已经进入熊市。如果这轮下跌表现得势头凶猛，并走出了很多根连续的大阴线，市场上每一个人都会把当前的行情看作一轮熊市。然而，市场往往在很宽的下降通道内运行，持续波动50根或更多K线，这期间并没有足够的证据令交易员们确信趋势确实已经真正地反转下行。他们可能开始怀疑，价格走势是否已经演变成一波震荡行情，而这种可能是时常发生的。市场不出现十分强有力的下跌行情，就不会得到强有力的共鸣，他们就不敢十足相信趋势已经反转，直到行情持续了十几根K线，并形成了一系列更低的高点和更低的低点。而在这个点位上，市场可能已经远低于原先牛市的高位，而这轮熊市也可能离结束不远了。","pid":"p186"},{"t":"para","text":"通常投资者对一波反转行情形成共鸣需要很长时间，市场在什么时候就行情达成一致意见其实并没有太大关系。因为在这个下跌过程中存在很多交易机会。如果向下波动的趋势不明显，多空胶着行情反复，交易员们会以双向市场的手法来操作，在两个方向上寻找交易机会。如果是一轮非常强势的熊市，交易员们几乎只会选择做空。既然在一路下行的过程中都存在交易机会，为什么交易员还要考虑市场是否处于主要趋势反转当中呢？那是因为，如果在市场冲击旧趋势高点后开始翻转向下时，交易员趁此时及早入场。收益将会非常丰厚。回报往往比风险大好多倍，即使只有四五成的胜率，结果也是非常乐观的。大部分反转最终引出一波震荡行情，但这种交易依然有利可图。","pid":"p187"},{"t":"para","text":"实际上，所有的主要趋势反转都以趋势线突破或趋势通道线击穿为开端的，当市场出现反转时，趋势线最终都会被突破。举例而言，如果一轮牛市在一个头肩顶形态中结束，从头部的向下波动通常都会跌破支撑整轮牛市的上涨趋势线，而在头肩顶形态中反弹形成头部的K线，并将这些K线低部连接起来绘制出小级别的趋势线，这种趋势线也总是会被突破。当从头部下滑至左肩的回调区域时，多头开始买入，试图创造出一个双重底上升旗形。随着行情反弹至头部，价格超过了左肩，很多空头开始做空，然后在头部下滑至左肩回调区域时开始平仓获利，以防市场进入一个震荡区间，或形成一个双重底上升旗形。空头把形成右肩的反弹看成是价格突破后反抽形成一个更低高点的做空入场条件，并开始做空而空头需要看到趋势线被突破之后，才能倍感自信地建立其逆势头寸（在牛市中做空），因为趋势线突破预示着趋势的突破，以及一轮可能的主要趋势反转的开始。与此同时，在前高处（头部）买入的多头。预期行情走出另一个上升小波段，。他们持仓观察从头部这波下跌的力量强弱。一旦他们认为空头的力量足以令市场跌破趋势线，就会利用这次反弹的机会平仓，以小亏离场。多空双方的抛盘导致市场再次下行并形成更低的高点（右肩）。一旦市场下滑至颈线（一条穿过形态底部所绘制的大致水平的趋势线，连接从左肩、头部、右肩下跌的最低点），多空双方都会评估下跌过程中两边的力量。如果卖方的力量占优，空头不会再想着市场仍然处于震荡行情之中，也不再仅仅满足于小打小闹的刮头皮交易。相反，他们预期市场将出现一轮主要趋势反转，他们坚持持有自己的空仓，甚至进一步加仓做空，尤其在行情突破颈线时和突破后。多头见识了卖方的力量，在市场稳定之前他们不再愿意买入，他们预期至少几根K将很可能走出一波可测量的下跌行情，然后市场才能稳定下来。","pid":"p188"},{"t":"para","text":"相反地，如果从头部到颈线的抛售力量较弱，多空双方都会在对颈线的试探过程中买入。多头买入是因为他们把整个形态看作是牛市中的一波震荡行情，当前的下跌只是一个大级别的上升旗形。他们在预期的上升旗形的底部买入，这里可能形成一个近似的三重底（在颈线上的第三次向上反转）。有些多头会在震荡区间的中间位置或行情冲击其顶部时做一些刮头皮交易，其他的则会持仓观望，等待多头突破并走出一个上涨波段。空头在这个时候会买入了结头寸，并且不准备再次卖出，除非有更好的价位。他们希望反弹保持在右肩下方，如果行情确实没超过右肩，或者与右肩一起形成一个双重顶，他们便会再次做空。期待这个形态最终变成拥有两个右肩的头肩顶。而拥有两个右肩的头肩顶形态也是很常见的。如果市场向上突破了右肩，空头也会买入平仓，并且短时间内不准备再次卖出。他们认为整个形态已经演变成一个大级别的上升旗形，而这次突破反弹很可能至少走出一波可测量的上涨行情。多头知道这个时候空头正在平仓，并且短时间内不会做空。于是他们也在市场向上突破右肩时买入做多。他们也和空头一样，预期市场将走出一波可测量的上涨行情，在新一轮上升旗形推进过程中，他们将会加仓做多。","pid":"p189"},{"t":"para","text":"这种情形同样适用于双重顶或更高的高点的形态中。在经过一番迅猛的抛售之后，市场回归前高区域，在旧趋势高点处买入的多头在这次猛烈的抛售中被打击地体无完肤，他们趁着这次反弹平仓离场。这意味着他们也变成卖方（他们抛出自己的多仓），在市场大幅下跌之前他们不会再次买入。市场上没有人敢在当前的价格买入，多空双方都在卖出，市场自然随之下行。","pid":"p190"},{"t":"para","text":"在市场底部也是一样道理。一旦出现一波强有力的反弹向上突破下跌趋势线（要么是阻挡整轮熊市的下跌趋势线，要么仅仅是下滑至头部这一波段上方的阻力线），随着市场向下突破左肩，空头预期行情走出另二个下降小波段，并在市场底部做空，而这波从头部向上的反弹令他们对行情非常失望，并开始预期行情在对下方进行试探后至少会走出另一个上升小波段。交易员们把下一个下降小波段看作是对空头力量的试探。如果下跌趋势很强劲，在一段时间后市场终究要向下突破旧趋势的低点（头部），并形成另一个下降小波段。如果趋势正在反转，激进的多头就会在旧趋势的低点附近买入，从头部开始强势的反弹，和对熊市低点弱势的试探，这些都将给在旧趋势低点处卖出的空头以沉重的一击，他们将利用这些短暂下探的机会在盈亏平衡点附近买回自己的空仓。多空双方都在买入，而且空头不会在这个价格水平附近再次卖出，市场自然反弹上行。这次对熊市低点的试探，可以和前低一起形成一个完美的双重底，这个新的低点可能是更高的低点，也可能是更低的低点。这都没关系，它们只是同一个过程的不同表现形式。如果这个新的低点形成了一个更高的低点，有些交易员就会把它看作是一个头肩底的右肩，并往前寻找合理的左肩。如果找到合理的左肩，他们就会更加确信这是一个趋势反转，因为他们认为很多交易员都能识别出这个形态并且开始买入。不过，是否存在一个清晰的左肩对大多数交易员来说并不重要。重要的是要有一个强势击穿下跌趋势线的突破，再对熊市低点进行试探，然后反转上行进入二个上涨波段或一轮牛市。","pid":"p191"},{"t":"para","text":"无论市场顶部来自一个更高的高点，一个完美的双重顶，还是一个更低的高点，这都没有关系，因为他们都代表着相同的市场行为。市场冲击旧趋势高点。以衡量多空双方的力量，来判断是向上突破还是向下反转。在顶部有两次上扬：第一次是原趋势上行至本轮高点，第二次是在市场向下跌破上涨趋势线后对这个高点发起冲击。市场并不在乎这个双重顶有多完美：无论外观如何，所有对高点的冲击都会被认为是双重顶的变形。在市场底部也是一样道理。市场形成了一个趋势低点，然后一波强有力的反弹向上突破下跌趋势线。这个低点便是双重底的第一个底部。在市场向上突破下跌趋势线（价格因此走出了下降通道）并再次下行试探第一个低点后，市场反转上行，这个新的低点就成为双重底的第二个低点，这第二个低点有可能高于或低于第一个低点，也有可能和第一个低点持平。","pid":"p192"},{"t":"para","text":"传统的头肩顶或头肩底与它们在更高时间周期的微型版本的关系，对于所有微小形态来说都是相同的。例如，交易员在5分钟图上看到的双重底，在更高的时间周期图表中这两个底部仅仅相距两三根K线，构成了一个微型双重底。同样道理，如果交易员在5分钟图上看到的微型双重底，两个底部仅仅相距两三根K线，那么在足够低的时间周期图表上就会是一个完美的趋势反转形态，第一个底部之后的反弹向上突破下跌趋势线。第二个底部就是对前低的试探。事实上，每张图表上大部分可交易的反转形态，即使是小规模的刮头皮交易，都以微型的双重底或双重顶为开端，除非市场呈现出一个双重底或双重顶，否则大多数交易员都不会进行反转交易。一个微型的双重顶是在牛市中一次失败的突破，它不是一个失败的高点1、高点2，就是一个三角形买入信号，而一个失败的双重底就是一个失败的低点1、低点2或一个三角形卖出信号。这意味着这些反转是小级别的最终旗形反转（在第7章中讨论）。事实上，最终旗形是双重顶或双重底的变形。例如，在一个震荡行情的交易日中，行情出现一波含两个小波段的反弹，然后形成一个双内含线形态，交易员们就会开始警惕起来，市场可能形成一个最终旗形突破并且反转下行。在双内含线之前的上升急速是第一波上扬，小规模的多头突破是第二波上扬。由于市场出现了两波上涨行情，即使两个高点不在同一水平位置，它也只是一个双重顶的变形。","pid":"p193"},{"t":"para","text":"预期市场行情将反转下行的交易员们会在某次突破的信号K线的高点处或高点之上做空，这次突破预期将成为一个最终上升旗形。当这个突破是一个微小形态时，他们会在信号K线的高点处或略高于高点上方限价做空。当这个突破是一个大级别的形态时，在更高时间周期的图表上就会呈现一个微小形态，有些交易员会把他们的限价单设置在这个更高时间周期图表上的信号K线的高点处或高点上方。随着市场一步步走出大家所认为将形成的最终上升旗形，其他交易员，还可能包括很多机构投资者，都会在这期间逐步做空。在市场底部，如双重底或微型双重底，他们的操作正好相反。因为他们预期这些双重底将变成下降小波段的最终旗形。并引出一波反转上行的行情。","pid":"p194"},{"t":"para","text":"请记住，所有的趋势都在通道内运行，除非出现一个对趋势通道的强势突破，否则最佳的选择是与任何试图突破趋势线的力量做对抗。除非行情强势突破了趋势线，否则大多数交易员都会把任何逆势交易视为一种简单的投机行为。在没有对趋势线突破的情况下，市场中强劲趋势仍然起着举足轻重的作用。交易员们会确保自己抓住每一次顺势交易的入场机会，并不在乎自己错过偶尔出现的逆势刮头皮交易。最大的胜算和最高的收益都存在于顺势交易当中。真正的V形底或V形顶没有击穿趋势通道线或没有引发行情反转是非常罕见的。所以我们不必要去考虑这些形态。交易员们应该把注意力集中在常见的形态中，如果他们错过某个偶然罕见的事件，市场总会有一波回调行情让他们有机会随着新的趋势启动交易。","pid":"p195"},{"t":"para","text":"单凭趋势线的突破并不能反转市场。它仅仅是第一个显著的特征只表明逆势交易员的力量正逐渐强大起来，你得意识到你可能很快就得跟上他们的交易方向。但是，你首先应该继续顺势交易，因为在突破趋势线之后，还有一波对旧趋势极值的测试行情。在这波测试行情中，价格有可能略高于或略低于旧趋势的极值。只有当反转的入场条件在这次测试过程中有所发展时，你才能考虑进行逆势交易。如果反转的入场条件真的进一步成型了，逆势波动就应该形成至少两个小波段，甚至走出一轮新的反向趋势。","pid":"p196"},{"t":"para","text":"在牛市中，超越前高的行情一般引出三种结果：更多买入，获利了结，或做空。当趋势强劲的时候，强势的多头会通过在原先高点上方做多来推动他们的多仓，市场会走出一波可测量的上涨行情。如果行情在突破后上涨的幅度足够大，让交易员在回调之前有机会至少做一笔刮头皮交易，那么我们基本上可以认为有一批新的买方在高点处买入。如果行情开始一路横盘整理，那么就假设有人在这个位置上获利平仓。并且多头正在等待更低的价位来做多。如果市场猛烈地反转下行，那么我们就认为空头主宰这一轮新高，市场很可能下行至少持续10根K线以上的时间，并形成几个下降小波段。","pid":"p197"},{"t":"para","text":"有些交易员喜欢在市场呈现最早期的反转迹象时就入场交易，比如行情刚刚突破趋势通道的时候。但是，这些属于低胜算的交易风格。没错，虽然巨大的回报能够弥补所承担的风险及低概率的赢面，但大多数交易员最终只会因小失大，一边“捡着樱桃”一边又错过了“最好的樱桃”。面临所有的突破，我们都最好先等一等看看这个突破到底有多强势。如果是强势的，就伺机在回调时入场交易。这一理念适用于所有的趋势反转，甚至小规模的趋势，如大趋势中的回调，微型通道，急速之后的通道，以及在宽阔通道内运行的趋势等。如果逆势的突破是弱势的，就伺机在反转尝试空手而回的时候进行顺势交易。如果突破非常强烈，并持续了很多根K线而且没有回调，就把它当作任何强势的突破一样，在市场新的趋势方向进行交易，又或者等待小型的回调，我们在第二本书第一篇讨论过。","pid":"p198"},{"t":"para","text":"如果没有发生一些罕见的轰动性的新闻事件，交易员们不会突然从极端的多头转向极端的空头。从多头到空头的转换是一个循序渐进的过程。交易员先是变得不太看涨，然后态度中立，再开始看跌。一旦足够多的交易员完成了这种转换，市场就反转进入一个深度调整行情或进入一轮新的熊市。每一个机构投资者都有其衡量市场是否过热的标准，在某些价位上，就会有足够多的机构投资者觉得市场已经走得过远。他们认为如果现在停止在原来高点上方买入的话，几乎不存在错过大幅上涨行情的风险，于是他们只在回调的时候买入。如果市场在原来高点上方表现得犹豫不决，出现了多空双方较量的局面，那么强势的多头就会利用新高开始兑现他们的持仓盈利。","pid":"p199"},{"t":"para","text":"获利了结意味着交易员们依然看涨，并且正在等待机会准备在回调时买入。大部分新高都伴随着获利了结的行为。每一个新高都是一个潜在的顶部，但大部分反转尝试都将无功而返并成为一个上升旗形的起点，它仅仅只是为了引出另一个新高。如果冲击高点的反弹行情在上升小波段中出现了几个小幅的回调，而大量反复震荡的K线，几根大阴线，K线的上影线很长，大部分的阳线都显疲弱，那么市场就日益成为双向市场。多头们正在K线顶部获利了结，而且只在K线底部买入，而空头们开始在K线顶部做空。同样道理，多头们在接近牛市顶部时兑现盈利，而空头们却在这个时候加仓做空。如果市场继续创出新高，很可能就会出现更多平仓获利的多头和卖出的空头，市场便逐渐形成一段震荡区间或一个反转形态。","pid":"p200"},{"t":"para","text":"大多数交易员都不喜欢行情反转，如果他们预期将出现一个反转信号，他们更倾向于退出多头并等待这个信号到来。而这些多头在趋势最后上升小波段的退出使得冲击最终高点的反弹更加弱势。如果在市场向上突破原来高点之后就来一波强势的反转下跌行情，那么我们可以认为至少在短期内强劲的空头力量正占据着市场的主导地位。一旦发生这种情况，原本希望在小幅回调时再次买入的多头们就会认为市场将进一步下行。他们只有在行情出现更大幅度回调时才考虑再次做多，因此买方缺席助长了空头力量，他们带动市场下行陷人一个更深的调整，持续十几根K线的时间，而且通常包含两个回合或更多的下降小波段。","pid":"p201"},{"t":"para","text":"有一种情况是，牛市突破会常规性地遇到激进的空头，而这些空头通常都掌控着市场。回调是与当前大趋势反方向的小规模趋势，交易员们都预期它会很快结束并让大趋势复辟。而当强劲熊市发生反弹时，市场在小规模上涨趋势中往往会走出两个回合的上升小波段。当价格超过第一个上升小波段高点时，它就相当于向上突破了小规模上涨趋势中前一个波段高点。然而，由于大多数交易员都会把这波上涨行情看成是熊市的反弹并很快结束，在突破中占据主导地位的交易员通常都是激进的卖方。而非激进的新买方，或获利了结的多头，在反弹过程中向上突破第一个或第二个波段高点后，这个小规模上趋势将反转下行重新进入当前主要熊市的下跌浪潮之中。","pid":"p202"},{"t":"para","text":"情况在熊市创出新低时也是一样道理。当熊市很强劲时，强势的空头就会通过增仓做空使价格突破至新低。市场则进一步下跌直到触及某些可测量的盈利目标价位。随着趋势逐渐弱化，价格行为在新低处的目的变得没那么明显，这也意味着强势的空头正在利用这一新低区域兑现他们的做空盈利，而并非在这个区域中卖出增仓。随着熊市进一步丧失动能，最终强势的多头会把这个新低看作为建仓的好价位。并构建出一个反转形态和一波显著的反弹行情。","pid":"p203"},{"t":"para","text":"当趋势成熟的时候，行情通常都会转人区间震荡，但第一段震荡区间之后通常都会延续原来的趋势。强势的多空双方在趋势成熟时是如何操作的呢？在牛市中，当趋势强劲时回调幅度都很小，因为强势的多头都希望在回调时加仓买入。由于他们都认为市场在走得更高之前可能不会回调，他们开始持续不断地分批建仓。市场上有这么多大型投资者，他们在这个过程中寻找任何支持他们买入的理由。因此对应每一个可以想象得到的理由都有一些买入操作。他们利用限价单在价格下跌几个价位后买入，或者在前一根K线低点附近买入。他们利用条件单在前一根K线高点上方买入，或向上突破之前任意波段高点时买入。他们还会在任意阳线或阴线的收盘价处买入。他们把阴线看作是能够在更低价位买入的短暂的好机会，把阳线看作是市场将迅速上行的标志。","pid":"p204"},{"t":"para","text":"强势的空头也很聪明，他们很清楚市场目前的状况。和强势的多头一样，他们也认为不久之后市场将进一步走高，这时候不适宜做空。他们在一旁观望，并等待机会在更高位卖出。那么问题来了，价格要涨到什么程度才算过高呢？每个机构投资者都有其衡量市场是否过热的标准，一旦市场到达某个价格水平，足够多的空头机构投资者都认为行情可能不会再继续上涨，他们就会开始做空。如果大多数交易员都在同一个价格水平附近卖出，图表上便形成更多更大的阴线，而且很多K线都带上影线。这些都是抛压的征兆，它们告诉全市场多头力量已经逐渐减弱，而空头力量正在逐步增强。强势的多头最终在最近的波段高点上方停止买入，相反的是，他们趁着市场走出新高的契机开始获利平仓。他们依然是看涨的，但只会在回调时有选择性地买入。随着多空双方的较量渐渐激烈，下跌行情带来更多阴线而且持续更长时间，这时强势的多头就希望只在发展中的震荡区间底部买入，顶部伺机获利卖出。而强势的空头则开始在新高处做空，并且愿意逢高增仓。如果他们认为市场有可能反转上行并突破创出新高的话，他们也许会在发展中的震荡区间靠近底部附近兑现部分盈利，但依然坚持寻找在新高处做空的机会。在某些价位上，市场达到某种均衡状态，多空双方势均力敌，谁也不掌握主导权：慢慢地。空头占据上风，一轮熊市开启，行情沿着相反的方向铺展开来。","pid":"p205"},{"t":"para","text":"一轮长期的趋势往往拥有一波异常强大的突破行情，但这次突破有可能是一个衰竭型的高潮。举例而言，在一轮长期的牛市中，强势的多空双方都喜欢看到一两根大阳线出现，这些阳线越长越好，他们认为这是一个转瞬即逝的不同寻常的绝佳机会。一旦市场接近某个多空双方都想卖出的价格，比如一个可测量的盈利目标价位附近，或趋势通道线上，值得注意的是，如果这个波动是第二或第三次连续的买入高潮，他们就会在一旁观望。缺少来自最强势交易员的卖出操作，市场上产生了一个卖出真空，使行情出现了一两根相当长的大阳线。这个上升急速恰恰是强势交易员们正在等待的信号，一旦出现这种信号，他们就会从四面八方涌现并开始卖出。多头们卖出平仓获利空头们卖出开仓，双方都和突破行情对着干。双方都在K线的收盘价处、或其高点上方、接下来的K线收盘价处（较弱的K线更甚）大举卖出，尤其这些K线都是阴线的时候他们的卖出动作更加激进。他们也在前一根K线的低点下方做空。当他们看到一根强劲的阴线，他们就会在这根阴线的收盘价处或其低点下方做空。多空双方都预期出现一波大型的调整，在调整行情持续至少10根K线并走出两个小波段之前，多头们不会考虑再次买入，即便行情真如他们所想的调整到位了，他们也会只在抛售力量看起来较弱的时候买入。而空头们也预期同样的抛盘现象。并不急于过早兑现盈利。","pid":"p206"},{"t":"para","text":"弱势的交易员们却对这个大阳线的看法正好相反。弱势的多头二直在场外观望，希望在一个单纯的回调处买入，却看着市场价格离他们越来越远，尤其看到这根K线那么强势而当天的交易时间就快结束的时候，他们很希望能确保自己赶上下一个上升小波段。而弱势的空头则过早地做空，还可能逐渐加仓，然后看到这根阳线上价格急剧升并突破新高，他们开始恐慌起来。他们担心买方在后续行情中仍然坚持不懈地买入，也跟着买回自己的空头头寸。这些弱势的交易员凭借自己的感性思维在交易，并与计算机程序做对抗，而计算机程序的算法里却没有感情因素这一变量。由于计算机控制着市场，弱势交易员的情绪化操作注定让他们在一轮超涨的牛市末端的某根大阳线上吃大亏。市场正在反转，但并没有成功突破。","pid":"p207"},{"t":"para","text":"一旦强劲的牛市开始了一些幅度相对较大的回调。这些回调总是表现为多个小型的震荡区间，因此看起来更像是震荡行情而非上升旗形突破的方向变得没那么明确，交易员们也开始认为行情无论上涨或者下跌都是50到50的概率。新的高点是行情向上突破震荡区间的一次尝试，但大概率上它将会突破失败。反之亦然，一旦强劲的熊市开始了一些幅度相对较大的反弹，这些反弹看起来更像是震荡行情而非下降旗形；因此，新的低点是行情向下突破震荡区间的一次尝试，但大概率上它也将突破失败，并延续原来的震荡行情。","pid":"p208"},{"t":"para","text":"每一段震荡区间都处于牛市或熊市之中。一旦双向波动的行情构成一段震荡区间，多空双方的较量持续拉锯时，当前的趋势就不再强劲了。但最终在震荡区间里总会形成一次突破，如果突破上行且势头猛，则市场处于一轮强牛市当中。如果突破下行且势头猛，则市场处于一轮强熊市当中。","pid":"p209"},{"t":"para","text":"如果空头们有足够的力量将一波回调行情推至上涨趋势线和移动平均线之下，他们将有理由相信市场很可能不再继续走高，并且在原来高点上方积极地做空。而这个时候，多头们已经决定只在深度回调时才买入。于是一种新的思维定式在新高处占据主导。新高处已经不是做多的好价位，因为它不再代表多头的力量。是的，多头们在这个地方获利了结，但大多数实力雄厚的交易员却把新高看作是开始建立空头头寸的大好机会。市场已经到达临界点，大多数交易员已经不再寻找回调买入的机会，而是开始伺机在反弹时卖出。空头们掌握主导权，强势的抛售将很可能引出一波大型的调整行情甚至趋势反转。在下一波强势下推之后，空头们开始寻找更低的高点来再次卖出加仓，而原本习惯在回调处买入的多头们则开始考虑趋势可能已经反转，或至少会走出一波更大幅度的回调行情。他们不再期待出现一个新的牛市高点以了结他们的多头头寸，而是现在就开始在更低的高点处获利平仓，大型调整结束前他们不再准备买入。多头们知道大部分的反转尝试都将无功而返，除非空头们展示出能够将市场猛烈下推的实力。否则很多踩着趋势的浪潮一路直上的交易员并不会退出他们的多仓。一旦这些多头们见识到市场上令人印象深刻的抛压，他们才最终寻找反弹的机会退出多头。他们的卖单限制了反弹的幅度，他们的卖出，加上激进空头的做空，以及把之前第一回合的下跌看作是买入机会的多头在此处获利平仓，这一切行为将构成第二回合的下降小波段","pid":"p210"},{"t":"para","text":"如果市场进入一轮熊市，上述过程将会反转。当熊市很强劲时，交易员们会在先前的低点下方做空。随着趋势逐渐弱化，空头们在新低处获利了结，市场很可能进入一段震荡行情。行情强势反弹至下跌趋势线和移动平均线上方之后，强势的多头在此处大举买入并试图控制市场。结果引出一波更大规模的熊市反弹行情甚至可能反转进入牛市。","pid":"p211"},{"t":"para","text":"当行情出现一波大的回调走势并且让交易员们怀疑趋势是否已经开始反转时，类似的情形也会发生。在牛市中出现一波深度迅猛的回调行情时，交易员们开始考虑市场是否已经开始反转。他们看着先前波段低点下方的波动，但这只是在牛市中的一次回调而非新一轮熊市。他们将观察市场跌破先前波段低点会发生什么情况。市场是否会下探至更深的空间，使之前以条件单形式在波段低点下方入场的空头获得盈利？在新低处卖方是否比买方多？如果确实是这样，那么这就是一个空头强势的迹象，而这波回调也很可能进一步下行。趋势甚至可能已经反转下行。","pid":"p212"},{"t":"para","text":"突破至新低后的另一种可能性就是市场进入一段震荡区间，这表明空头正在获利了结，而多头的买入热情也并不高涨。最后一种选择就是市场在突破新低后反转上行。这意味着强势的多头正在波段低点下方等着行情试探这一新低。这种迹象也表明突破至新低的下跌只是当前牛市的一个大幅回调。在上方较高价位入场的空头在此处获利平仓，因为他们相信趋势依然向上。强势的多头在此处大举买入，因为他们相信市场不会进一步下跌并将反弹冲击牛市高点。","pid":"p213"},{"t":"para","text":"任何跌破波段低点的突破行情，交易员们都会认真观察，寻找多头回归或空头掌权的证据。他们需要知道在新低处哪方的力量才是最强大的，并让市场行为做出决定。如果此次突破是强势的，那么新的卖出占据主导地位。如果市场的波动方向含糊不清，则空头获利了结，多头的买入热情也并不高涨。市场很可能进入区间震荡。如果突破后行情强势反转上行，则多头积极的买入操作是最重要的影响因素。","pid":"p214"},{"t":"para","text":"强有力的趋势通道线反转来自过分延伸的趋势，并且价格在反转穿过趋势通道的另一边并击穿趋势线后，行情往往能走得很远。反转后的第一次回调幅度通常很浅，市场正处于一个情绪化阶段，每个人都迅速达成共识，认为趋势已经反转。带着这份信心，交易员们变得大为激进，即使在最短暂的休整期也大胆加仓且不兑现盈利，从而使回调幅度一直保持很小的空间。","pid":"p215"},{"t":"para","text":"当行情强势突破了趋势线，通常在回调后都会有第二回合与突破方向一致的小波段。回调常常把价格拉回原来的趋势线附近，并对原趋势线进行测试，但你几乎总能找到基于价格行为的理由，以支持你尝试赶上回调期的第二个小波段。或甚至赶上新的趋势。击穿趋势线的波动越有力，回调后发生第二回合与突破方向一致的小波段的可能性就越大。如果对趋势线的突破并没能触及移动平均线，那么这次突破的力量就不足以反转趋势，所以先不要开始寻找趋势反转的交易机会。尽管价格突破了趋势线，但趋势依然强劲，你应该只做一些顺势交易。","pid":"p216"},{"t":"para","text":"趋势在反转中结束，逆势的行情波动突破趋势线，然后再对最终的趋势极值进行测试。测试过程中有可能出现行情超跌或超涨的现象，比如在新一轮牛市中深度回踩形成一个更低的低点，或在新一轮熊市中大幅反拉形成一个更高的高点，也有可能行情回踩或反拉的幅度不足，即在新一轮牛市中浅度回调形成一个更高的低点。或在新一轮熊市中小幅反抽形成一个更低的高点。测试行情形成一个完美的双重顶或双重底的情况是很罕见的。严格来说，超跌或超涨的波段是旧趋势的最后一个下降或上升小波段，因为这波下跌或上涨形成了原趋势真正的最低点或最高点。而回踩或反拉的行情则是新趋势第一回合上升或下降小波段之后的回调。测试行情经常由两个小波段组成（例如空头突破的双波段反弹）。","pid":"p217"},{"t":"para","text":"如果超涨或超跌的幅度太大，并处于一个过于狭窄的通道内，你就不应该考虑反转的可能。趋势很可能已经恢复了，而不再处于反转的过程中。相反，应继续等待另一次趋势线的突破，以及接下来对趋势极值的测试行情，再来寻找反转交易的机会。","pid":"p218"},{"t":"para","text":"对趋势极值的测试行情通常表现为某种类型的通道，当市场可能处于反转过程中时，通道的强弱程度显得尤其重要。例如，在强劲的牛市中，价格强势下行并大幅跌破上涨趋势线，交易员们将仔细研究接下来的反弹走势。他们想确定这波反弹是仅仅对牛市高点的测试行情，还是会强势突破高点并引出牛市中另一个有力的上升小波段。其中一个最重要的考虑因素就是冲击牛市高点的动能强弱。如果反弹在非常狭窄陡峭的通道内运行，没有回调，连续的K线之间儿乎没有相互重叠。而且反弹在休整或回调之前就远远超过了牛市高点，就表明它的动能很强，牛市复辟的概率也随之增加，尽管前期价格强势下行并跌破上涨趋势线。相比之下，如果反弹过程中出现很多反复震荡的K线，几个大的阴线，两三次明显的回调，或者出现楔形形态。反弹的斜率明显小于原来牛市的上涨斜率及前期的下跌斜率，那么这次对牛市高点的冲击大概率会形成一个更低的高点或略高的高点，然后市场开始尝试另一轮抛售。市场可能正反转进入一轮熊市，或最低限度进入一段区间震荡的行情。","pid":"p219"},{"t":"para","text":"行情是有惯性的，一般趋向于维持原来的状态。这就导致大部分趋势反转都将以失败告终。就算真的成功反转了，市场也更可能形成一段震荡区间，而非进入反向趋势，因为震荡区间所需的推动力更小。在震荡行情中，以原趋势为交易方向的交易员们依然强势，但会受到反方向交易员的力量抵抗。比起市场主导权在多空双方手中发生快速转换的情况，这种逐步转变的可能性更大。但是，即使在震荡行情中，也存在大规模的可交易的逆势波段，交易员们经历十几根K线之后才能确定市场是已经反转进入反向趋势，还是形成当前趋势中的一个大旗形。","pid":"p220"},{"t":"para","text":"由于在趋势线突破后的逆势波动通常都包含两个回合的小波段，如果牛市反转形成一个更高的低点以试探熊市低点，这个更高的低点将成为第二回合上升小波段的起点。但是，如果它形成了一个更低的低点来试探熊市低点的话，那么这个更低的低点将成为牛市第一回合上升小波段的起点；在这个小波段之后，市场很可能发生回调，然后才是第二回合的上升小波段。在熊市反转中也是同样道理，更低的高点是第二回合下降小波段的起点，而对高点的冲击形成的更高的高点则是第一回合下降小波段的起点。","pid":"p221"},{"t":"para","text":"行情一切的波动都和展示在你面前的图表息息相关，而且在不同时间周期的图表上看起来不一样。如果脱离趋势线去测试趋势极值的小波段在5分钟图上只维持了两根K线的时间，交易员们不会把它视为主要的趋势反转。虽然这些小波段在1分钟图里持续了10根K线。并构建了一个完美的主要趋势反转形态。同样道理，如果一波上涨趋势持续了60根K线，然后出现了回调和测试行情，也用了至少20根K线的时间，它们可能在15分钟图里构建了一个主要趋势反转形态，但这波回调和测试行情在5分钟图里也用了至少60根K线，交易员们就不会把它称为主要趋势反转”了。他们会寻求其他的形态。例如，如果突破上涨趋势线的回调行情经历了30根K线，那么交易员们会把它看作是一波下跌趋势（在上涨趋势中的所有回调都是小级别的下跌趋势），并等待行情向上突破下跌趋势线，然后主趋势上行。如果反弹行情也经历了30根K线，他们则把它看作是一波新的上涨趋势，并等待行情向下突破上涨趋势线，然后主趋势反转下行。他们意识到这些小波段在15分钟图上只占了10根K线并形成了主要趋势反转形态，但却不是在他们交易所用的图表上形成，所以他们所使用的术语仅适用于他们当前所用的图表。","pid":"p222"},{"t":"para","text":"每个场条件平均下来大约有40%的机会能引出一个有较大盈利空间的波段，有30%的机会导致小幅亏损，30%的机会产生小幅盈利。大部分入场条件的结果都是震荡区间而非反向趋势，但仍然有70%的概率能带来小幅利润。最佳的入场条件则有60%的概率能为我们带来有利可图的波段交易机会。","pid":"p223"},{"t":"img","src":"assets/img/p1c3_001.webp","ctx":[{"t":"行情一切的波动都和展示在你面前的图表息息相关，而且在不同时间周期的图表上看起来不一样。如果脱离趋势线去测试趋势极值的小波段在5分钟图上只维持了两根K线的时间，交易员们不会把它视为主要的趋势反转。虽然这些小波段在1分钟图里持续了10根K线。并构建了一个完美的主要趋势反转形态。同样道理，如果一波上涨趋势持续了60根K线，然后出现了回调和测试行情，也用了至少20根K线的时间，它们可能在15分钟图里构建了一个主要趋势反转形态，但这波回调和测试行情在5分钟图里也用了至少60根K线，交易员们就不会把它称为主要趋势反转”了。他们会寻求其他的形态。例如，如果突破上涨趋势线的回调行情经历了30根K线，那么交易员们会把它看作是一波下跌趋势（在上涨趋势中的所有回调都是小级别的下跌趋势），并等待行情向上突破下跌趋势线，然后主趋势上行。如果反弹行情也经历了30根K线，他们则把它看作是一波新的上涨趋势，并等待行情向下突破上涨趋势线，然后主趋势反转下行。他们意识到这些小波段在15分钟图上只占了10根K线并形成了主要趋势反转形态，但却不是在他们交易所用的图表上形成，所以他们所使用的术语仅适用于他们当前所用的图表。","p":"p222"},{"t":"每个场条件平均下来大约有40%的机会能引出一个有较大盈利空间的波段，有30%的机会导致小幅亏损，30%的机会产生小幅盈利。大部分入场条件的结果都是震荡区间而非反向趋势，但仍然有70%的概率能带来小幅利润。最佳的入场条件则有60%的概率能为我们带来有利可图的波段交易机会。","p":"p223"},{"t":"图3.1中所示的是一个主要趋势反转，其他很多例子会在本书的其他图表中给出。","p":"p224"},{"t":"上涨趋势线被突破后（主要趋势反转下行），如果趋势在更高的高点处反转下行，那么通常都会形成一个更低高点的主要趋势反转，为交易员提供第二次做空的机会。苹果（AAPL）这只股票的图表中既有更高高点的趋势反转，又有更低高点的趋势反转。一个主要反转通常都在趋势线被强势突破之后发生，这也是反向交易的力量愈发强大的证据所在。跌至K线4的弱势的下降小波段几乎没有突破趋势线，也远没有接近上涨趋势中最近一个更高的低点（K线2）。它甚至没能坚持把价格控制在移动平均线下方。但是，行情依然持续了很多根K线进行横盘整理，这表明空头的力量足以让上涨趋势休整好长一段时间。","p":"p225"},{"t":"K线6就是趋势线突破后更高高点的做空入场条件，但由于跌至K线4的波段并不是那么强势，因而第二次下跌行情走到K线9就戛然而止了。","p":"p226"},{"t":"K线9变成一个楔形上升旗形或一段上升通道的底部，并且是一个高点4的做多入场条件，它和K线5一起构成了二个双重底上升旗形这里引出了涨至K线10的反弹。但上扬至K线10的这一段动能较弱，是一个低点4的做空入场条件。也是一个楔形下降旗形，这个楔形下降旗形的第一波上推形成了在K线9低点之前的一个更低的高点。这也是一个头肩顶形态的右肩，但大部分头肩顶形态都以失败告终并演变成三角形或楔形上升旗形。但在这个例子中。它已经成为趋势线突破后的第一个更低的高点，并对上涨趋势的高点发起一波更低高点的冲击。","p":"p227"},{"t":"跌至K线9的下降小波段明确地向下突破了一条更长的趋势线、移动平均线和上涨趋势中最近的一个更高的低点（K线5），而在此之前还出现了一次急剧的趋势反转尝试（跌至K线4）。同时。这波下跌也没有接近上涨趋势线下方。或接近第一回合下降小波段中K线8的第一次回调。并没有对两者进行测试。所有这些都是趋势线突破足够强势的表现并增加了再形成至少一个回合的下降小波段甚至一个真正趋势反转的概率。在上涨趋势的K线6顶部附近买入的多头，交易员见识了使价格跌至K线9的空头力量的强势，也看到了反弹至K线10的多头力量的疲弱，他们对这种价格行为感到失望。他们把这次价格涨至K线10的弱势反弹看作小亏退出多头的机会，他们也不愿意再次买入除非价格进一步下探。多头们在买入之前希望看到有力的信号，但却希望落空，他们只好坐在场边观望，看着市场一步步跌至K线11。","p":"p228"},{"t":"有些交易员喜欢看到行情反弹至更低的高点时出现61.8%的斐波纳契回调比例。然而，61.8%的回调比例从来都不是一个令人信服的精确数字，它很可能并不比60%、63%或70%的回调比例更靠谱，而且在交易日趋计算机化的今天，它也许更加失去了本身的价值。例如，如果有个交易员认为行情正处于一个下跌波段中，并在反弹50%时卖出，那么他可能面临价格涨至新高（K线6上方）的风险，其回报是获得试探K线9底部的做空利润。-他的回报与风险均等，由于他把反弹看成是下跌趋势的回调，他的空头头寸至少有60%的成功率。如果市场回调至更高价位，则有一种观点认为67%的回调比例比61.8%更重要。一旦回调型的反弹比例超过50%，下跌趋势恢复的概率就会降低，比如说变成50%。胜率一旦低于50%，交易员们在做空交易中就需要更高的收益。由于他们把止损价设置在K线6高点上方，他们可能希望所得的回报至少是所承担的风险的两倍。这意味着他们也会在67%的回调比例处做空，因为对K线9低点的试探行情所创造的收益将可能是风险的两倍。","p":"p229"}]},{"t":"para","text":"图3.1中所示的是一个主要趋势反转，其他很多例子会在本书的其他图表中给出。","pid":"p224"},{"t":"para","text":"上涨趋势线被突破后（主要趋势反转下行），如果趋势在更高的高点处反转下行，那么通常都会形成一个更低高点的主要趋势反转，为交易员提供第二次做空的机会。苹果（AAPL）这只股票的图表中既有更高高点的趋势反转，又有更低高点的趋势反转。一个主要反转通常都在趋势线被强势突破之后发生，这也是反向交易的力量愈发强大的证据所在。跌至K线4的弱势的下降小波段几乎没有突破趋势线，也远没有接近上涨趋势中最近一个更高的低点（K线2）。它甚至没能坚持把价格控制在移动平均线下方。但是，行情依然持续了很多根K线进行横盘整理，这表明空头的力量足以让上涨趋势休整好长一段时间。","pid":"p225"},{"t":"para","text":"K线6就是趋势线突破后更高高点的做空入场条件，但由于跌至K线4的波段并不是那么强势，因而第二次下跌行情走到K线9就戛然而止了。","pid":"p226"},{"t":"para","text":"K线9变成一个楔形上升旗形或一段上升通道的底部，并且是一个高点4的做多入场条件，它和K线5一起构成了二个双重底上升旗形这里引出了涨至K线10的反弹。但上扬至K线10的这一段动能较弱，是一个低点4的做空入场条件。也是一个楔形下降旗形，这个楔形下降旗形的第一波上推形成了在K线9低点之前的一个更低的高点。这也是一个头肩顶形态的右肩，但大部分头肩顶形态都以失败告终并演变成三角形或楔形上升旗形。但在这个例子中。它已经成为趋势线突破后的第一个更低的高点，并对上涨趋势的高点发起一波更低高点的冲击。","pid":"p227"},{"t":"para","text":"跌至K线9的下降小波段明确地向下突破了一条更长的趋势线、移动平均线和上涨趋势中最近的一个更高的低点（K线5），而在此之前还出现了一次急剧的趋势反转尝试（跌至K线4）。同时。这波下跌也没有接近上涨趋势线下方。或接近第一回合下降小波段中K线8的第一次回调。并没有对两者进行测试。所有这些都是趋势线突破足够强势的表现并增加了再形成至少一个回合的下降小波段甚至一个真正趋势反转的概率。在上涨趋势的K线6顶部附近买入的多头，交易员见识了使价格跌至K线9的空头力量的强势，也看到了反弹至K线10的多头力量的疲弱，他们对这种价格行为感到失望。他们把这次价格涨至K线10的弱势反弹看作小亏退出多头的机会，他们也不愿意再次买入除非价格进一步下探。多头们在买入之前希望看到有力的信号，但却希望落空，他们只好坐在场边观望，看着市场一步步跌至K线11。","pid":"p228"},{"t":"para","text":"有些交易员喜欢看到行情反弹至更低的高点时出现61.8%的斐波纳契回调比例。然而，61.8%的回调比例从来都不是一个令人信服的精确数字，它很可能并不比60%、63%或70%的回调比例更靠谱，而且在交易日趋计算机化的今天，它也许更加失去了本身的价值。例如，如果有个交易员认为行情正处于一个下跌波段中，并在反弹50%时卖出，那么他可能面临价格涨至新高（K线6上方）的风险，其回报是获得试探K线9底部的做空利润。-他的回报与风险均等，由于他把反弹看成是下跌趋势的回调，他的空头头寸至少有60%的成功率。如果市场回调至更高价位，则有一种观点认为67%的回调比例比61.8%更重要。一旦回调型的反弹比例超过50%，下跌趋势恢复的概率就会降低，比如说变成50%。胜率一旦低于50%，交易员们在做空交易中就需要更高的收益。由于他们把止损价设置在K线6高点上方，他们可能希望所得的回报至少是所承担的风险的两倍。这意味着他们也会在67%的回调比例处做空，因为对K线9低点的试探行情所创造的收益将可能是风险的两倍。","pid":"p229"},{"t":"img","src":"assets/img/p1c3_002.webp","ctx":[{"t":"跌至K线9的下降小波段明确地向下突破了一条更长的趋势线、移动平均线和上涨趋势中最近的一个更高的低点（K线5），而在此之前还出现了一次急剧的趋势反转尝试（跌至K线4）。同时。这波下跌也没有接近上涨趋势线下方。或接近第一回合下降小波段中K线8的第一次回调。并没有对两者进行测试。所有这些都是趋势线突破足够强势的表现并增加了再形成至少一个回合的下降小波段甚至一个真正趋势反转的概率。在上涨趋势的K线6顶部附近买入的多头，交易员见识了使价格跌至K线9的空头力量的强势，也看到了反弹至K线10的多头力量的疲弱，他们对这种价格行为感到失望。他们把这次价格涨至K线10的弱势反弹看作小亏退出多头的机会，他们也不愿意再次买入除非价格进一步下探。多头们在买入之前希望看到有力的信号，但却希望落空，他们只好坐在场边观望，看着市场一步步跌至K线11。","p":"p228"},{"t":"有些交易员喜欢看到行情反弹至更低的高点时出现61.8%的斐波纳契回调比例。然而，61.8%的回调比例从来都不是一个令人信服的精确数字，它很可能并不比60%、63%或70%的回调比例更靠谱，而且在交易日趋计算机化的今天，它也许更加失去了本身的价值。例如，如果有个交易员认为行情正处于一个下跌波段中，并在反弹50%时卖出，那么他可能面临价格涨至新高（K线6上方）的风险，其回报是获得试探K线9底部的做空利润。-他的回报与风险均等，由于他把反弹看成是下跌趋势的回调，他的空头头寸至少有60%的成功率。如果市场回调至更高价位，则有一种观点认为67%的回调比例比61.8%更重要。一旦回调型的反弹比例超过50%，下跌趋势恢复的概率就会降低，比如说变成50%。胜率一旦低于50%，交易员们在做空交易中就需要更高的收益。由于他们把止损价设置在K线6高点上方，他们可能希望所得的回报至少是所承担的风险的两倍。这意味着他们也会在67%的回调比例处做空，因为对K线9低点的试探行情所创造的收益将可能是风险的两倍。","p":"p229"},{"t":"电子迷你期货的走势形成了一个更低的低点，然后走出一个更高低点的主要趋势反转形态（请见图3.2）。反弹至K线1的行情突破了下跌趋势线，而K线3对趋势低点的试探行情形成了更低的低点。试探更低的低点之后通常引出至少两个回合的逆势小波段，正如此图所示（以K线3为起点的上涨波段及以K线9为起点的上涨波段）。K线9是昨天突破主要下跌趋势线（被涨至K线1的反弹行情所突破）之后的一个更高的低点，它也是第二回合上升小波段的启动点，该回合完整的上升小波段有可能是整个上涨行情的终点。震荡行情比起反转进行反向趋势。是一个更常见的结果。","p":"p230"},{"t":"下降至K线7的通道（从K线5或K线6开始）比较强势。很多交易员在买入之前倾向于先等等看这波突破到底有多强势。K线7之后是两根相当长的大阳线，影线很短，在很多交易员眼中就算是很强的突破信号。在这个点位上，很多交易员认为市场已经转变为总在场内的多头状态，并等着在回调时买入。K线8之后的那根阴线尝试令跌至K线7的高点2上升旗形突破失败（第一个下降小波段在K线5之后的三根K线中结束）。空头们希望由K线6和K线8组成的双重顶能引出一波下跌行情。多头们则预期空头的希望落空，交易员们在对K线7低点的试探行情中买入，并在价格强势涨至K线5（K线4以及K线3之后的那根K线都足够强势，以至于让交易员们认为很可能发生第二回合的上升小波段）之后形成一个更高的低点。K线9是一个更低的低点，行情向上突破后的回调型做多入场条件（与K线7组成一个双重底上升旗形），而多头们通常在K线9处大举买入。","p":"p231"},{"t":"K线9后面的那根阳线一举收复失地，超过了之前很多K线的最高价和收盘价，这是一个上涨趋势强力反转的迹象。它的收盘价与最高价分别高于自K线6起每一根K线的收盘价和最高价。这根阳线修复的K线越多，就表明上涨趋势的反转越强劲，行情持续上扬的可能性越大（买方愿意在更高价位买入）。","p":"p232"},{"t":"在主要趋势反转中最早期的入场机会往往看起来不是很强，比如K线3和K线9。这表示成功率常常低于50%。但潜在的回报却是最丰厚的，交易员盈亏方程式的结果通常为正。交易员们可以在买入前等待清晰的总在场内的多头反转，这样做通常能把成功率提高到60%以上。从这个角度来说，剩余的利润空间较小，而且风险通常会更大（保护性止损幅度在这个时候设置得更大），但交易员盈亏方程式的结果通常仍然趋向正数。例如，多头们可能会在K线3后面的那根阳线上方等待买入机会以完成一笔波段交易，或者在K线4的收盘价处做一笔刮头皮交易他们也可能在K线9后面的第一根阳线及第二根阳线的收盘价处买入。","p":"p233"},{"t":"这是一个典型的主要趋势反转尝试很好的实例，它所展示的入场条件及行情背景都比较容易被人所接受，但整个向上反转的过程并不强势，所以最终形成一段震荡行情，而非牛市反转，这正符合市场上70%以上的情况。K线3这一更低的低点引出一波对K线1高点的测试行情，而K线1的高点很可能是这段正在演变的震荡区间的顶部。有些交易员在这里兑现部分或全部盈利，而有些交易员则继续持有，并预期行情形成另一回合的上升小波段，并在K线10处突破震荡区间失败后（阴线翻转向下，跌破K线10低点）离场。K线3这一更低的低点为刮头皮交易员带来一笔刮头皮利润，他们在K线5价格翻转向下时离场，K线3也为趋势交易员创造了一次波段化收益（这个回报至少是风险的两倍），他们在K线10之后价格反转下行时离场。K线7处做多怎么会亏损呢？作者说的应该是做空的情况吧？K线9是一双重底的更高低点（高于K线3），也是从K线5至K线7这一小规模下跌趋势：（上升旗形）反转上行的更低低点，在K线9处买入的交易员们，在部分或全部平仓时能够实现至少高于两倍的风险收益（波段利润）。","p":"p234"},{"t":"像这样的典型入场条件，实现波段化盈利的机会为40%左右，有30%的概率获得小幅利润，30%的概率触发止损价（小幅亏损）。从最终的结果看，它依然是一个有利可图的交易策略。在最强的入场条件里，实现波段化盈利的机会在60%或以上，保护性止损单被触发并导致小幅亏损的概率可能只有30%到40%。由于交易员的盈亏方程式非常有利，所以这对所有交易员甚至新手来说都是一个绝佳的入场机会。","p":"p235"},{"t":"行情向下突破上涨趋势线，然后创出新高，在这种情况下寻找做空机会并不总是明智的。如果趋势线被突破后，创出更高高点的行情在原来牛市高点上方运行了至少五根K线的时间，交易员们在做空之前，通常应该等待价格向下击穿上涨趋势线的另一次突破，以及突破后冲击牛市高点的测试行情。","p":"p236"}]},{"t":"para","text":"电子迷你期货的走势形成了一个更低的低点，然后走出一个更高低点的主要趋势反转形态（请见图3.2）。反弹至K线1的行情突破了下跌趋势线，而K线3对趋势低点的试探行情形成了更低的低点。试探更低的低点之后通常引出至少两个回合的逆势小波段，正如此图所示（以K线3为起点的上涨波段及以K线9为起点的上涨波段）。K线9是昨天突破主要下跌趋势线（被涨至K线1的反弹行情所突破）之后的一个更高的低点，它也是第二回合上升小波段的启动点，该回合完整的上升小波段有可能是整个上涨行情的终点。震荡行情比起反转进行反向趋势。是一个更常见的结果。","pid":"p230"},{"t":"para","text":"下降至K线7的通道（从K线5或K线6开始）比较强势。很多交易员在买入之前倾向于先等等看这波突破到底有多强势。K线7之后是两根相当长的大阳线，影线很短，在很多交易员眼中就算是很强的突破信号。在这个点位上，很多交易员认为市场已经转变为总在场内的多头状态，并等着在回调时买入。K线8之后的那根阴线尝试令跌至K线7的高点2上升旗形突破失败（第一个下降小波段在K线5之后的三根K线中结束）。空头们希望由K线6和K线8组成的双重顶能引出一波下跌行情。多头们则预期空头的希望落空，交易员们在对K线7低点的试探行情中买入，并在价格强势涨至K线5（K线4以及K线3之后的那根K线都足够强势，以至于让交易员们认为很可能发生第二回合的上升小波段）之后形成一个更高的低点。K线9是一个更低的低点，行情向上突破后的回调型做多入场条件（与K线7组成一个双重底上升旗形），而多头们通常在K线9处大举买入。","pid":"p231"},{"t":"para","text":"K线9后面的那根阳线一举收复失地，超过了之前很多K线的最高价和收盘价，这是一个上涨趋势强力反转的迹象。它的收盘价与最高价分别高于自K线6起每一根K线的收盘价和最高价。这根阳线修复的K线越多，就表明上涨趋势的反转越强劲，行情持续上扬的可能性越大（买方愿意在更高价位买入）。","pid":"p232"},{"t":"para","text":"在主要趋势反转中最早期的入场机会往往看起来不是很强，比如K线3和K线9。这表示成功率常常低于50%。但潜在的回报却是最丰厚的，交易员盈亏方程式的结果通常为正。交易员们可以在买入前等待清晰的总在场内的多头反转，这样做通常能把成功率提高到60%以上。从这个角度来说，剩余的利润空间较小，而且风险通常会更大（保护性止损幅度在这个时候设置得更大），但交易员盈亏方程式的结果通常仍然趋向正数。例如，多头们可能会在K线3后面的那根阳线上方等待买入机会以完成一笔波段交易，或者在K线4的收盘价处做一笔刮头皮交易他们也可能在K线9后面的第一根阳线及第二根阳线的收盘价处买入。","pid":"p233"},{"t":"para","text":"这是一个典型的主要趋势反转尝试很好的实例，它所展示的入场条件及行情背景都比较容易被人所接受，但整个向上反转的过程并不强势，所以最终形成一段震荡行情，而非牛市反转，这正符合市场上70%以上的情况。K线3这一更低的低点引出一波对K线1高点的测试行情，而K线1的高点很可能是这段正在演变的震荡区间的顶部。有些交易员在这里兑现部分或全部盈利，而有些交易员则继续持有，并预期行情形成另一回合的上升小波段，并在K线10处突破震荡区间失败后（阴线翻转向下，跌破K线10低点）离场。K线3这一更低的低点为刮头皮交易员带来一笔刮头皮利润，他们在K线5价格翻转向下时离场，K线3也为趋势交易员创造了一次波段化收益（这个回报至少是风险的两倍），他们在K线10之后价格反转下行时离场。K线7处做多怎么会亏损呢？作者说的应该是做空的情况吧？K线9是一双重底的更高低点（高于K线3），也是从K线5至K线7这一小规模下跌趋势：（上升旗形）反转上行的更低低点，在K线9处买入的交易员们，在部分或全部平仓时能够实现至少高于两倍的风险收益（波段利润）。","pid":"p234"},{"t":"para","text":"像这样的典型入场条件，实现波段化盈利的机会为40%左右，有30%的概率获得小幅利润，30%的概率触发止损价（小幅亏损）。从最终的结果看，它依然是一个有利可图的交易策略。在最强的入场条件里，实现波段化盈利的机会在60%或以上，保护性止损单被触发并导致小幅亏损的概率可能只有30%到40%。由于交易员的盈亏方程式非常有利，所以这对所有交易员甚至新手来说都是一个绝佳的入场机会。","pid":"p235"},{"t":"para","text":"行情向下突破上涨趋势线，然后创出新高，在这种情况下寻找做空机会并不总是明智的。如果趋势线被突破后，创出更高高点的行情在原来牛市高点上方运行了至少五根K线的时间，交易员们在做空之前，通常应该等待价格向下击穿上涨趋势线的另一次突破，以及突破后冲击牛市高点的测试行情。","pid":"p236"},{"t":"img","src":"assets/img/p1c3_003.webp","ctx":[{"t":"像这样的典型入场条件，实现波段化盈利的机会为40%左右，有30%的概率获得小幅利润，30%的概率触发止损价（小幅亏损）。从最终的结果看，它依然是一个有利可图的交易策略。在最强的入场条件里，实现波段化盈利的机会在60%或以上，保护性止损单被触发并导致小幅亏损的概率可能只有30%到40%。由于交易员的盈亏方程式非常有利，所以这对所有交易员甚至新手来说都是一个绝佳的入场机会。","p":"p235"},{"t":"行情向下突破上涨趋势线，然后创出新高，在这种情况下寻找做空机会并不总是明智的。如果趋势线被突破后，创出更高高点的行情在原来牛市高点上方运行了至少五根K线的时间，交易员们在做空之前，通常应该等待价格向下击穿上涨趋势线的另一次突破，以及突破后冲击牛市高点的测试行情。","p":"p236"},{"t":"如图3.3所示苹果（AAPL）股票的日线图，股价向下突破了上涨趋势线（实线C）并跌至K线11。然后行情在K线13处又反弹至新高。但这波上涨在非常陡峭的上升通道内运行（虚线D上涨趋势线是这个通道的底部），交易员们想做空的话得再等一等。不在第一次突破上升通道时做空是比较明智的选择。观察一下行情是否大幅或小幅反弹，是否形成一个更高的高点或更低的低点。市场横盘整理，在K线14处形成了一个双重底上升旗形（高点2），一直没有出现突破后价格反弹的做空入场条件。价格推进至K线13的波段，是一个驱使牛市恢复的成功突破，而不是一个导致行情反转的失败突破。","p":"p237"},{"t":"从K线3到K线11，市场一直处于多头震荡行情，而从K线12到K线13的强势上扬突破了震荡区间这一大级别的上升旗形。这个创新高的波段坡度陡峭，K线之间几乎没有重叠，大概率会形成一个成功的突破，并走出一波可测量的上涨行情，而非趋势反转。一旦发生这种情况，我们又可以开始寻找反转的信号了。等待趋势线突破，比如下探至K线19的那波下跌，然后等待行情反弹至一个更高的高点构成双重顶，或一个更低的高点以冲击牛市高点。虽然从K线19开始出现了几个可交易的波段，但K线19本身就是一个向上的反转高潮（价格急速跳水又剧烈飙升），反转高潮之后通常伴随着一段震荡行情。这段区间震荡正是多空较量之地，造成K线19处急速跳水的空头继续在震荡区间里做空，并试图建立一个下降通道，而在K线19低点处买入的多头继续在震荡区间里做多，尝试构造一个上升通道。顺便提一句，在多头眼里，K线19只是市场向上突破K线8和K线9之后的一个大规模突破测试行情。K线19跌破了K线9的突破点，突破缺口被回补，但由于后来市场又快速反弹向上，因此它依然算是某种类型的突破跳空。","p":"p238"},{"t":"跌至K线5的波段突破了虚线趋势线A。K线6是一个合理的双重顶做空入场条件。","p":"p239"},{"t":"跌至K线7的波段突破了虚线趋势线B。涨至K线8的波段是一个陡峭的上升通道，所以我们最好等待行情向下突破趋势通道，并观察是否出现反弹以便做空。","p":"p240"},{"t":"K线9处的双波段上扬构成双重顶，这是一个可接受的做空机会。","p":"p241"},{"t":"K线10是一个双重顶下降旗形，是另一个做空入场条件。","p":"p242"},{"t":"K线19很明显是由某些新闻事件（2010年的闪电崩盘）导致的，但这并不重要。更重要的是这期间和这之后哪一方掌控市场。K线19是对K线4和K线12之间这一震荡区间中点测试的一部分（同时也测试了从K线11开始到K线17这一通道底部）。很多交易员都预期突破行情会得到测试，市场一旦开始快速朝测试的方向发展。如K线19所展示的那样，最强势的多头就会开始认为市场可能会下探至震荡区间的底部。那么认为市场会进一步下跌时他们应该怎么做呢？如果能在更低的价位买入，那么在K线19刚开始时就买入是不合理的。这种买方缺席的情况导致市场被快速卷人一个卖出真空当中，多头们相信跌到一定程度价格会碰到某个支撑位。即使认为市场下行时期依然存在做多的价值（你知道这点是因为市场之后会快速反转上行，升的价格几乎覆盖了整根K线），他们也会等待市场进一步下跌直至触及某个支撑水平。当看到市场提供重大利多的时机将转瞬即逝，多头们就会立刻涌现出来，以波涛迅猛之势大举买入。空头们同样看到这种现象，于是迅速买入平仓获利了结。当再没有人卖出时，市场便开始强势反弹。专门捕捉市场动能的交易程序加速了行情的下跌和反弹，它们探测到市场上很强的动能，并在动能前进的方向上不懈地交易，直到动能放缓才开始获利离场。类似这样的急速在趋势中很常见。但是，正如图3.3中所示，对通道底部的测试通常引出一段震荡行情。价格的急速跳水和剧烈升，容易造成市场局面非常混乱，最终导致行情在多空双方的较量中反复震荡。","p":"p243"},{"t":"如果对低点的试探行情动能过强，那么市场将形成另一个下降小波段的可能性要比反转上行的可能性更大。","p":"p244"}]},{"t":"para","text":"如图3.3所示苹果（AAPL）股票的日线图，股价向下突破了上涨趋势线（实线C）并跌至K线11。然后行情在K线13处又反弹至新高。但这波上涨在非常陡峭的上升通道内运行（虚线D上涨趋势线是这个通道的底部），交易员们想做空的话得再等一等。不在第一次突破上升通道时做空是比较明智的选择。观察一下行情是否大幅或小幅反弹，是否形成一个更高的高点或更低的低点。市场横盘整理，在K线14处形成了一个双重底上升旗形（高点2），一直没有出现突破后价格反弹的做空入场条件。价格推进至K线13的波段，是一个驱使牛市恢复的成功突破，而不是一个导致行情反转的失败突破。","pid":"p237"},{"t":"para","text":"从K线3到K线11，市场一直处于多头震荡行情，而从K线12到K线13的强势上扬突破了震荡区间这一大级别的上升旗形。这个创新高的波段坡度陡峭，K线之间几乎没有重叠，大概率会形成一个成功的突破，并走出一波可测量的上涨行情，而非趋势反转。一旦发生这种情况，我们又可以开始寻找反转的信号了。等待趋势线突破，比如下探至K线19的那波下跌，然后等待行情反弹至一个更高的高点构成双重顶，或一个更低的高点以冲击牛市高点。虽然从K线19开始出现了几个可交易的波段，但K线19本身就是一个向上的反转高潮（价格急速跳水又剧烈飙升），反转高潮之后通常伴随着一段震荡行情。这段区间震荡正是多空较量之地，造成K线19处急速跳水的空头继续在震荡区间里做空，并试图建立一个下降通道，而在K线19低点处买入的多头继续在震荡区间里做多，尝试构造一个上升通道。顺便提一句，在多头眼里，K线19只是市场向上突破K线8和K线9之后的一个大规模突破测试行情。K线19跌破了K线9的突破点，突破缺口被回补，但由于后来市场又快速反弹向上，因此它依然算是某种类型的突破跳空。","pid":"p238"},{"t":"para","text":"跌至K线5的波段突破了虚线趋势线A。K线6是一个合理的双重顶做空入场条件。","pid":"p239"},{"t":"para","text":"跌至K线7的波段突破了虚线趋势线B。涨至K线8的波段是一个陡峭的上升通道，所以我们最好等待行情向下突破趋势通道，并观察是否出现反弹以便做空。","pid":"p240"},{"t":"para","text":"K线9处的双波段上扬构成双重顶，这是一个可接受的做空机会。","pid":"p241"},{"t":"para","text":"K线10是一个双重顶下降旗形，是另一个做空入场条件。","pid":"p242"},{"t":"para","text":"K线19很明显是由某些新闻事件（2010年的闪电崩盘）导致的，但这并不重要。更重要的是这期间和这之后哪一方掌控市场。K线19是对K线4和K线12之间这一震荡区间中点测试的一部分（同时也测试了从K线11开始到K线17这一通道底部）。很多交易员都预期突破行情会得到测试，市场一旦开始快速朝测试的方向发展。如K线19所展示的那样，最强势的多头就会开始认为市场可能会下探至震荡区间的底部。那么认为市场会进一步下跌时他们应该怎么做呢？如果能在更低的价位买入，那么在K线19刚开始时就买入是不合理的。这种买方缺席的情况导致市场被快速卷人一个卖出真空当中，多头们相信跌到一定程度价格会碰到某个支撑位。即使认为市场下行时期依然存在做多的价值（你知道这点是因为市场之后会快速反转上行，升的价格几乎覆盖了整根K线），他们也会等待市场进一步下跌直至触及某个支撑水平。当看到市场提供重大利多的时机将转瞬即逝，多头们就会立刻涌现出来，以波涛迅猛之势大举买入。空头们同样看到这种现象，于是迅速买入平仓获利了结。当再没有人卖出时，市场便开始强势反弹。专门捕捉市场动能的交易程序加速了行情的下跌和反弹，它们探测到市场上很强的动能，并在动能前进的方向上不懈地交易，直到动能放缓才开始获利离场。类似这样的急速在趋势中很常见。但是，正如图3.3中所示，对通道底部的测试通常引出一段震荡行情。价格的急速跳水和剧烈升，容易造成市场局面非常混乱，最终导致行情在多空双方的较量中反复震荡。","pid":"p243"},{"t":"para","text":"如果对低点的试探行情动能过强，那么市场将形成另一个下降小波段的可能性要比反转上行的可能性更大。","pid":"p244"},{"t":"img","src":"assets/img/p1c3_004.webp","ctx":[{"t":"K线19很明显是由某些新闻事件（2010年的闪电崩盘）导致的，但这并不重要。更重要的是这期间和这之后哪一方掌控市场。K线19是对K线4和K线12之间这一震荡区间中点测试的一部分（同时也测试了从K线11开始到K线17这一通道底部）。很多交易员都预期突破行情会得到测试，市场一旦开始快速朝测试的方向发展。如K线19所展示的那样，最强势的多头就会开始认为市场可能会下探至震荡区间的底部。那么认为市场会进一步下跌时他们应该怎么做呢？如果能在更低的价位买入，那么在K线19刚开始时就买入是不合理的。这种买方缺席的情况导致市场被快速卷人一个卖出真空当中，多头们相信跌到一定程度价格会碰到某个支撑位。即使认为市场下行时期依然存在做多的价值（你知道这点是因为市场之后会快速反转上行，升的价格几乎覆盖了整根K线），他们也会等待市场进一步下跌直至触及某个支撑水平。当看到市场提供重大利多的时机将转瞬即逝，多头们就会立刻涌现出来，以波涛迅猛之势大举买入。空头们同样看到这种现象，于是迅速买入平仓获利了结。当再没有人卖出时，市场便开始强势反弹。专门捕捉市场动能的交易程序加速了行情的下跌和反弹，它们探测到市场上很强的动能，并在动能前进的方向上不懈地交易，直到动能放缓才开始获利离场。类似这样的急速在趋势中很常见。但是，正如图3.3中所示，对通道底部的测试通常引出一段震荡行情。价格的急速跳水和剧烈升，容易造成市场局面非常混乱，最终导致行情在多空双方的较量中反复震荡。","p":"p243"},{"t":"如果对低点的试探行情动能过强，那么市场将形成另一个下降小波段的可能性要比反转上行的可能性更大。","p":"p244"},{"t":"在图3.4中，GS的股价向上突破了下跌趋势线A，但从K线11开始的这一波下跌在一个陡峭的下降通道内运行，它同时试探了K线8的趋势低点。比起尝试在K线13或K线14上方买入并期待行情下探失败进而发生趋势反转，交易员们更应该考虑GS的股价是否已经成功突破下行至更低的区间。跌至K线13和K线14的两波行情都表现为陡的下降通道，而不是低动能的回调式下跌。一旦出现这种现象，我们最好是等待价格下一次向上突破下跌趋势线，然后看看是否形成突破后的回调。如果是，那么它就是一个浅度或深度回踩低点的趋势反转上行的做多入场条件。","p":"p245"},{"t":"一旦市场跌破K线14的楔形（K线12和K线13就是价格跌至K线12之后这个下降通道内的头两次下推），价格就快速跌至K线15，这期间跌幅可测量出来（跌幅与从K线12到K线14的楔形高度一致）。","p":"p246"},{"t":"价格推进至K线18的震荡区间突破了陡峭的趋势线B，但市场再次在一个陡峭的下降通道内逐步下行，而不是以低动能的形式试探K线17这一趋势低点。","p":"p247"},{"t":"反弹至K线20的波段突破了下跌趋势线C，并在K线21处形成更高低点的做多入场条件。跌至K线21的这波下行是由三个小波段和很多反复震荡的K线构成，这表明市场多空双方正在此处较量。这段时间动能较低，行情更容易尝试走出一个更高低点的主要趋势反转形态，而不是突破下行形成另一个下降小波段。","p":"p248"}]},{"t":"para","text":"在图3.4中，GS的股价向上突破了下跌趋势线A，但从K线11开始的这一波下跌在一个陡峭的下降通道内运行，它同时试探了K线8的趋势低点。比起尝试在K线13或K线14上方买入并期待行情下探失败进而发生趋势反转，交易员们更应该考虑GS的股价是否已经成功突破下行至更低的区间。跌至K线13和K线14的两波行情都表现为陡的下降通道，而不是低动能的回调式下跌。一旦出现这种现象，我们最好是等待价格下一次向上突破下跌趋势线，然后看看是否形成突破后的回调。如果是，那么它就是一个浅度或深度回踩低点的趋势反转上行的做多入场条件。","pid":"p245"},{"t":"para","text":"一旦市场跌破K线14的楔形（K线12和K线13就是价格跌至K线12之后这个下降通道内的头两次下推），价格就快速跌至K线15，这期间跌幅可测量出来（跌幅与从K线12到K线14的楔形高度一致）。","pid":"p246"},{"t":"para","text":"价格推进至K线18的震荡区间突破了陡峭的趋势线B，但市场再次在一个陡峭的下降通道内逐步下行，而不是以低动能的形式试探K线17这一趋势低点。","pid":"p247"},{"t":"para","text":"反弹至K线20的波段突破了下跌趋势线C，并在K线21处形成更高低点的做多入场条件。跌至K线21的这波下行是由三个小波段和很多反复震荡的K线构成，这表明市场多空双方正在此处较量。这段时间动能较低，行情更容易尝试走出一个更高低点的主要趋势反转形态，而不是突破下行形成另一个下降小波段。","pid":"p248"},{"t":"img","src":"assets/img/p1c3_005.webp","ctx":[{"t":"价格推进至K线18的震荡区间突破了陡峭的趋势线B，但市场再次在一个陡峭的下降通道内逐步下行，而不是以低动能的形式试探K线17这一趋势低点。","p":"p247"},{"t":"反弹至K线20的波段突破了下跌趋势线C，并在K线21处形成更高低点的做多入场条件。跌至K线21的这波下行是由三个小波段和很多反复震荡的K线构成，这表明市场多空双方正在此处较量。这段时间动能较低，行情更容易尝试走出一个更高低点的主要趋势反转形态，而不是突破下行形成另一个下降小波段。","p":"p248"},{"t":"当市场处于一轮强趋势时，3分钟图上将出现很多反转尝试（如图3.5），1分钟图上我们还能看到更多这种尝试。在5分钟图上出现明确的反转信号之前，如果你选择观察1分钟图或3分钟图，那么你应该将每一个反转尝试当作顺势交易的入场条件来对待，比如上图所标示的下降旗形就是我们所说的反转尝试。这张3分钟图上的五次反转尝试，每一次都能吸引多头的买入热情，他们想着自己所冒的风险很小，而且万一捕捉到一个V形底反转高潮的底部，就能获利非常丰厚，然而，天上掉馅饼这种事十分罕见。与其加人他们的行列，不如想想他们在哪里不得不止损出局，然后在这个价位上挂一个卖出条件单入场做空。你将成功地把他们账户里的钱源源不断地转到你的账户中去，这恰恰正是我们交易的主要目标。例如，只要多头们在K线1前面那根反转阳线上做多（这波跳水式的下跌行情没有出现原趋势线的突破，我们不应该考虑介入多头），聪明的交易员就会在这根信号K线下方低一个价位的地方以条件单的形式做空。和所有下降通道的操作手法一样，你也可以在前一根K线的高点处挂限价单做空。如果限价单没有成交。就应该改挂条件单在每一根回调K线的低点下方，以确保自己的空头入场。","p":"p249"},{"t":"K线4上的做空条件位于多头入场的阳线下方，因为这根入场K线收盘时，多头们会收紧他们的止损幅度。这根多头入场阳线就是空头的信号K线。当前正呈现趋势性行情，空头们的大部分仓位将都获得波段化盈利。","p":"p250"},{"t":"K线5是一个双内含线形态，它往往作为一个反转形态出现（但前提是要求前期行情突破趋势线），而且通常是在含两个小波段的逆向走势之前形成的一个最终旗形，如图中的例子所示。这种形态代表了多空双方的力量天秤，而行情突破则是这种平衡被打破的表现。市场上一般来说都存在一股强大的力量把价格拉回之前的平衡状态，而且通常还使天秤倾向另外一边。但由于整个过程没有出现趋势线突破，那么这里能成为有效入场机会的唯二突破只有空头突破。不过，双内含线形态的宽度刚好足以突破小级别的趋势线，所以之后在几根K线内的任何向上反转行情都是一个有效的多头入场机会。","p":"p251"},{"t":"有些激进的交易员转向更小的时间周期图表以寻找让他们顺势交易的入场条件。例如。如果交易员正在交易电子迷你期货，看到5分钟图上出现迅猛的抛售行情，想要去寻找做空的理由。他可以转去观察如图所示的3分钟图。一旦看到行情走出五根或以上的连续阴线，他预期在急速下跌后的第一次反转尝试将空手而回，于是在前一根K线的高点处挂限价单做空。当价格超过前一根K线的高点时，他就在K线1上成功建立空头头寸了。","p":"p252"}]},{"t":"para","text":"当市场处于一轮强趋势时，3分钟图上将出现很多反转尝试（如图3.5），1分钟图上我们还能看到更多这种尝试。在5分钟图上出现明确的反转信号之前，如果你选择观察1分钟图或3分钟图，那么你应该将每一个反转尝试当作顺势交易的入场条件来对待，比如上图所标示的下降旗形就是我们所说的反转尝试。这张3分钟图上的五次反转尝试，每一次都能吸引多头的买入热情，他们想着自己所冒的风险很小，而且万一捕捉到一个V形底反转高潮的底部，就能获利非常丰厚，然而，天上掉馅饼这种事十分罕见。与其加人他们的行列，不如想想他们在哪里不得不止损出局，然后在这个价位上挂一个卖出条件单入场做空。你将成功地把他们账户里的钱源源不断地转到你的账户中去，这恰恰正是我们交易的主要目标。例如，只要多头们在K线1前面那根反转阳线上做多（这波跳水式的下跌行情没有出现原趋势线的突破，我们不应该考虑介入多头），聪明的交易员就会在这根信号K线下方低一个价位的地方以条件单的形式做空。和所有下降通道的操作手法一样，你也可以在前一根K线的高点处挂限价单做空。如果限价单没有成交。就应该改挂条件单在每一根回调K线的低点下方，以确保自己的空头入场。","pid":"p249"},{"t":"para","text":"K线4上的做空条件位于多头入场的阳线下方，因为这根入场K线收盘时，多头们会收紧他们的止损幅度。这根多头入场阳线就是空头的信号K线。当前正呈现趋势性行情，空头们的大部分仓位将都获得波段化盈利。","pid":"p250"},{"t":"para","text":"K线5是一个双内含线形态，它往往作为一个反转形态出现（但前提是要求前期行情突破趋势线），而且通常是在含两个小波段的逆向走势之前形成的一个最终旗形，如图中的例子所示。这种形态代表了多空双方的力量天秤，而行情突破则是这种平衡被打破的表现。市场上一般来说都存在一股强大的力量把价格拉回之前的平衡状态，而且通常还使天秤倾向另外一边。但由于整个过程没有出现趋势线突破，那么这里能成为有效入场机会的唯二突破只有空头突破。不过，双内含线形态的宽度刚好足以突破小级别的趋势线，所以之后在几根K线内的任何向上反转行情都是一个有效的多头入场机会。","pid":"p251"},{"t":"para","text":"有些激进的交易员转向更小的时间周期图表以寻找让他们顺势交易的入场条件。例如。如果交易员正在交易电子迷你期货，看到5分钟图上出现迅猛的抛售行情，想要去寻找做空的理由。他可以转去观察如图所示的3分钟图。一旦看到行情走出五根或以上的连续阴线，他预期在急速下跌后的第一次反转尝试将空手而回，于是在前一根K线的高点处挂限价单做空。当价格超过前一根K线的高点时，他就在K线1上成功建立空头头寸了。","pid":"p252"},{"t":"img","src":"assets/img/p1c3_006.webp","ctx":[{"t":"K线5是一个双内含线形态，它往往作为一个反转形态出现（但前提是要求前期行情突破趋势线），而且通常是在含两个小波段的逆向走势之前形成的一个最终旗形，如图中的例子所示。这种形态代表了多空双方的力量天秤，而行情突破则是这种平衡被打破的表现。市场上一般来说都存在一股强大的力量把价格拉回之前的平衡状态，而且通常还使天秤倾向另外一边。但由于整个过程没有出现趋势线突破，那么这里能成为有效入场机会的唯二突破只有空头突破。不过，双内含线形态的宽度刚好足以突破小级别的趋势线，所以之后在几根K线内的任何向上反转行情都是一个有效的多头入场机会。","p":"p251"},{"t":"有些激进的交易员转向更小的时间周期图表以寻找让他们顺势交易的入场条件。例如。如果交易员正在交易电子迷你期货，看到5分钟图上出现迅猛的抛售行情，想要去寻找做空的理由。他可以转去观察如图所示的3分钟图。一旦看到行情走出五根或以上的连续阴线，他预期在急速下跌后的第一次反转尝试将空手而回，于是在前一根K线的高点处挂限价单做空。当价格超过前一根K线的高点时，他就在K线1上成功建立空头头寸了。","p":"p252"},{"t":"图3.6是图3.5所示下跌行情的1分钟图，K线的编号和图3.5一致。K线C、D和E都是两个下降小波段和小规模的趋势线突破后有效的逆势交易入场条件：每个入场机会都是一笔可盈利的做多刮头皮交易。虽然这些都是可能的交易机会，但我们很难再去看第二张图表并如此快速地发出交易指令，如果你只用5分钟图进行趋势交易，很有可能获得更丰厚的收益。当一天的交易结束后，整个图表展现在你面前时，一切看起来都似乎非常容易，但知易行难，真正实战操作时并没有那么简单。如果你准备基于1分钟图来进行做空，那么所标号的五根K线就提供了顺势（与1分钟图和5分钟图的趋势方向一致）做空的入场机会，让你的持仓获得波段性的盈利。","p":"p253"},{"t":"K线1是小级别的急速顶部，但由于它形成于下跌趋势之中，行情没必要对其进行测试。不像C和D这两个急速底部需要测试。下跌趋势中的急速底部通常都会得到测试，而我们从图表看出事实也正是如此。","p":"p254"},{"t":"价格推进至K线4的横盘整理行情包含了两个小波段，并突破了连接K线1和K线2高点的下跌趋势线。为什么交易员们不能在行情试探K线C低点的时候买入呢？因为下跌趋势线应该被价格强势向上突破才更有效。而走向K线4的这次横盘整理行情很弱势，它甚至没有触碰移动平均线。如果它触碰了移动平均线，就可能形成一个20根跳空K线的做空入场条件。下跌趋势对于希望做多的交易员来说太过强劲，交易员们应该在这段时期以做空为主。","p":"p255"},{"t":"以1分钟图来交易可以让你的止损幅度更小，但风险降低并不代表某笔交易值得我们去做。请牢记交易员的盈亏方程式。风险减小意味着获得盈利的机会也随之降低，事实上成功率下降带来的损失大于小幅的风险：总而言之这是一个赔钱的策略。","p":"p256"}]},{"t":"para","text":"图3.6是图3.5所示下跌行情的1分钟图，K线的编号和图3.5一致。K线C、D和E都是两个下降小波段和小规模的趋势线突破后有效的逆势交易入场条件：每个入场机会都是一笔可盈利的做多刮头皮交易。虽然这些都是可能的交易机会，但我们很难再去看第二张图表并如此快速地发出交易指令，如果你只用5分钟图进行趋势交易，很有可能获得更丰厚的收益。当一天的交易结束后，整个图表展现在你面前时，一切看起来都似乎非常容易，但知易行难，真正实战操作时并没有那么简单。如果你准备基于1分钟图来进行做空，那么所标号的五根K线就提供了顺势（与1分钟图和5分钟图的趋势方向一致）做空的入场机会，让你的持仓获得波段性的盈利。","pid":"p253"},{"t":"para","text":"K线1是小级别的急速顶部，但由于它形成于下跌趋势之中，行情没必要对其进行测试。不像C和D这两个急速底部需要测试。下跌趋势中的急速底部通常都会得到测试，而我们从图表看出事实也正是如此。","pid":"p254"},{"t":"para","text":"价格推进至K线4的横盘整理行情包含了两个小波段，并突破了连接K线1和K线2高点的下跌趋势线。为什么交易员们不能在行情试探K线C低点的时候买入呢？因为下跌趋势线应该被价格强势向上突破才更有效。而走向K线4的这次横盘整理行情很弱势，它甚至没有触碰移动平均线。如果它触碰了移动平均线，就可能形成一个20根跳空K线的做空入场条件。下跌趋势对于希望做多的交易员来说太过强劲，交易员们应该在这段时期以做空为主。","pid":"p255"},{"t":"para","text":"以1分钟图来交易可以让你的止损幅度更小，但风险降低并不代表某笔交易值得我们去做。请牢记交易员的盈亏方程式。风险减小意味着获得盈利的机会也随之降低，事实上成功率下降带来的损失大于小幅的风险：总而言之这是一个赔钱的策略。","pid":"p256"},{"t":"img","src":"assets/img/p1c3_007.webp","ctx":[{"t":"价格推进至K线4的横盘整理行情包含了两个小波段，并突破了连接K线1和K线2高点的下跌趋势线。为什么交易员们不能在行情试探K线C低点的时候买入呢？因为下跌趋势线应该被价格强势向上突破才更有效。而走向K线4的这次横盘整理行情很弱势，它甚至没有触碰移动平均线。如果它触碰了移动平均线，就可能形成一个20根跳空K线的做空入场条件。下跌趋势对于希望做多的交易员来说太过强劲，交易员们应该在这段时期以做空为主。","p":"p255"},{"t":"以1分钟图来交易可以让你的止损幅度更小，但风险降低并不代表某笔交易值得我们去做。请牢记交易员的盈亏方程式。风险减小意味着获得盈利的机会也随之降低，事实上成功率下降带来的损失大于小幅的风险：总而言之这是一个赔钱的策略。","p":"p256"},{"t":"图3.7是5分钟图（未给出图表）上一波强烈上涨趋势的1分钟图在这个图形上做空是很困难的（六个做空的入场条件，没有一个能产生4个价位以上的收益）。不去看1分钟图，只在5分钟图上寻找顺势交易机会会更加有利可图，且心理压力不会太大。观察1分钟图上的做空信号唯一说得通的理由，就是寻找顺势交易的入场机会。一旦触发做空信号，就看看保护性止损价应该设在哪里。然后把买入的条件单挂在那里，因为被套的空头在买入止损时会把市场推向你多头头寸的目标盈利价位。","p":"p257"},{"t":"大部分存在交易机会的反转形态都至少以一个微型双重底或双重顶、传统双重底或双重顶、最终旗形反转为开端，而最终旗形也可以被看作是某种类型的双重底或双重顶。","p":"p258"}]},{"t":"para","text":"图3.7是5分钟图（未给出图表）上一波强烈上涨趋势的1分钟图在这个图形上做空是很困难的（六个做空的入场条件，没有一个能产生4个价位以上的收益）。不去看1分钟图，只在5分钟图上寻找顺势交易机会会更加有利可图，且心理压力不会太大。观察1分钟图上的做空信号唯一说得通的理由，就是寻找顺势交易的入场机会。一旦触发做空信号，就看看保护性止损价应该设在哪里。然后把买入的条件单挂在那里，因为被套的空头在买入止损时会把市场推向你多头头寸的目标盈利价位。","pid":"p257"},{"t":"para","text":"大部分存在交易机会的反转形态都至少以一个微型双重底或双重顶、传统双重底或双重顶、最终旗形反转为开端，而最终旗形也可以被看作是某种类型的双重底或双重顶。","pid":"p258"},{"t":"img","src":"assets/img/p1c3_008.webp","ctx":[{"t":"图3.7是5分钟图（未给出图表）上一波强烈上涨趋势的1分钟图在这个图形上做空是很困难的（六个做空的入场条件，没有一个能产生4个价位以上的收益）。不去看1分钟图，只在5分钟图上寻找顺势交易机会会更加有利可图，且心理压力不会太大。观察1分钟图上的做空信号唯一说得通的理由，就是寻找顺势交易的入场机会。一旦触发做空信号，就看看保护性止损价应该设在哪里。然后把买入的条件单挂在那里，因为被套的空头在买入止损时会把市场推向你多头头寸的目标盈利价位。","p":"p257"},{"t":"大部分存在交易机会的反转形态都至少以一个微型双重底或双重顶、传统双重底或双重顶、最终旗形反转为开端，而最终旗形也可以被看作是某种类型的双重底或双重顶。","p":"p258"},{"t":"如图3.8所示。预期行情将反转下行的交易员如果认为某根信号K线将变成上升小波段中的最终上升旗形，不论当前的入场条件是高点1、高点2还是三角形。他们都会在这根信号K线及其上方挂限价单做空。当他们预期行情将从下降小波段中反转上行时，他们就会在某根信号K线及其下方挂限价单做多，他们认为这根信号K线很可能成为下降小波段的最终下降旗形（低点1、低点2，或三角形）。微型双重底的示例在图中为K线1和2、K线5和6、K线16和17（K线15和16，但入场信号没有被触发），以及K线19和20。微型双重顶的例子为K线3和4、K线10和11。以及K线13和14。K线8是K线7单K线最终旗形之后的反转，并与K线4组成了双重顶，它也是下降通道内更低的高点，以及三角形中的低点2（K线6是低点1）。","p":"p259"},{"t":"行情从震荡区间上部下跌了一段可测量的距离后，K线17的低点在这里形成了二个小级别的楔形，在这个点位上，当天很可能会是一个价格呈趋势震荡的交易日。K线17也是市场向下突破K线15后面的双内含线最终旗形后所形成的一个双波段更低低点，它与K线23组成了一个双重顶日内反转往往来自更大级别的形态。而不只是来自微型双重顶和双重底。K线22是一个包含了两个回合上升小波段的反弹高点，它测试了三角形的顶点（这个三角形出现这个趋势震荡交易日的震荡区间上部，被K线14后面的四根K线所突破）。K线25是一个抛售高潮，也是一个双波段突破至K线22后的回调行情，并形成了更低的低点，涨至K线22的波段突破了以K线17为结尾的上升旗形（从开盘下跌至K线17的整个过程是昨天一个大型向上跳空和一波巨型反弹之后的回调，因此整个波动只是一个大级别的上升旗型）。","p":"p260"},{"t":"价格跌至K线9后，与K线6构成了一个双重底上升旗形。K线27与K线24构成双重顶，双重顶的第二回合上升小波段以K线25的低点为起点。K线27是一个微型双重顶的第一根K线，因为它后面的那根K线下影线很长，这表明市场先下跌，再上涨。这个十字星内含线的顶部与K线27的高点形成了一个微型的双重顶，激进的空头在它的下方做空，这是预期行情将向下突破微型双重顶的交易员的入场机会。","p":"p261"},{"t":"尽管K线25的抛售高潮非常引人注目，但它只是一个更高时间周期图表上的微型双重底（在60分钟图上，它是一个三K线长的微型双重底）。当K线25正在形成的时候，尤其是它向下突破了K线17的低点机构投资者预期市场触底，并逐步增持多仓。他们认为突破将以失败告终。因此市场提供了短暂的机会以便在非常好的价格买入。他们控制了市场方向，如果足够多的机构投资者都预期市场已经见底，他们的买入便会使市场真正形成底部。涨至K线22的双波段反弹向上突破了下跌趋势线，K线25的抛售高潮形成了更低的低点，它成为主要趋势反转上行的底部。这波反弹又持续了两天时间。","p":"p262"},{"t":"仅凭市场形成了一个双重底或双重顶，并不足以构成进行反转交易的理由。交易决策必须以大的行情背景为基础。例如，在K线27处的双重顶前面是六根向上的K线和一波强力的抛售高潮，所以预测市场可能很容易进入横盘整理的行情。","p":"p263"},{"t":"有几个小级别最终旗形反转的例子，这些小级别的最终旗形反转跟在低点1和高点1入场条件后面，结果形成了微型双重顶和双重底。多头们把K线1后面的十字星K线看作是弱势的低点1价格向下突破后的反弹型卖出信号。他们在这个十字星的低点及其下方买入，预期行情形成一个多头开盘反转和当日低点。这个十字星成为下降小波段中的最终下降旗形，K线2与K线1低点则形成一个双重底。","p":"p264"},{"t":"K线3后面的内含阴线是一个高点1的买入信号，但很多交易员认为如果市场一直把价格维持在开盘时的双K线下降急速的顶部下方，就可能形成一个双重顶，然后向下突破。空头们在这根内含阴线的高点处做空，并预期它将会是一个失败的高点1，同时也是一个单K线最终旗形和一个双重顶。","p":"p265"},{"t":"K线5后面的内含阴线是一个价格向下突破后再反弹的卖出信号K线。多头们认为对移动平均线的测试行情将会稳定在移动平均线之上，而这根内含阴线将变成一个单K线最终下降旗形，并引出一波从移动平均线开始的双重顶反转上行行情。于是他们在这根下跌信号K线的低点处买入。","p":"p266"}]},{"t":"para","text":"如图3.8所示。预期行情将反转下行的交易员如果认为某根信号K线将变成上升小波段中的最终上升旗形，不论当前的入场条件是高点1、高点2还是三角形。他们都会在这根信号K线及其上方挂限价单做空。当他们预期行情将从下降小波段中反转上行时，他们就会在某根信号K线及其下方挂限价单做多，他们认为这根信号K线很可能成为下降小波段的最终下降旗形（低点1、低点2，或三角形）。微型双重底的示例在图中为K线1和2、K线5和6、K线16和17（K线15和16，但入场信号没有被触发），以及K线19和20。微型双重顶的例子为K线3和4、K线10和11。以及K线13和14。K线8是K线7单K线最终旗形之后的反转，并与K线4组成了双重顶，它也是下降通道内更低的高点，以及三角形中的低点2（K线6是低点1）。","pid":"p259"},{"t":"para","text":"行情从震荡区间上部下跌了一段可测量的距离后，K线17的低点在这里形成了二个小级别的楔形，在这个点位上，当天很可能会是一个价格呈趋势震荡的交易日。K线17也是市场向下突破K线15后面的双内含线最终旗形后所形成的一个双波段更低低点，它与K线23组成了一个双重顶日内反转往往来自更大级别的形态。而不只是来自微型双重顶和双重底。K线22是一个包含了两个回合上升小波段的反弹高点，它测试了三角形的顶点（这个三角形出现这个趋势震荡交易日的震荡区间上部，被K线14后面的四根K线所突破）。K线25是一个抛售高潮，也是一个双波段突破至K线22后的回调行情，并形成了更低的低点，涨至K线22的波段突破了以K线17为结尾的上升旗形（从开盘下跌至K线17的整个过程是昨天一个大型向上跳空和一波巨型反弹之后的回调，因此整个波动只是一个大级别的上升旗型）。","pid":"p260"},{"t":"para","text":"价格跌至K线9后，与K线6构成了一个双重底上升旗形。K线27与K线24构成双重顶，双重顶的第二回合上升小波段以K线25的低点为起点。K线27是一个微型双重顶的第一根K线，因为它后面的那根K线下影线很长，这表明市场先下跌，再上涨。这个十字星内含线的顶部与K线27的高点形成了一个微型的双重顶，激进的空头在它的下方做空，这是预期行情将向下突破微型双重顶的交易员的入场机会。","pid":"p261"},{"t":"para","text":"尽管K线25的抛售高潮非常引人注目，但它只是一个更高时间周期图表上的微型双重底（在60分钟图上，它是一个三K线长的微型双重底）。当K线25正在形成的时候，尤其是它向下突破了K线17的低点机构投资者预期市场触底，并逐步增持多仓。他们认为突破将以失败告终。因此市场提供了短暂的机会以便在非常好的价格买入。他们控制了市场方向，如果足够多的机构投资者都预期市场已经见底，他们的买入便会使市场真正形成底部。涨至K线22的双波段反弹向上突破了下跌趋势线，K线25的抛售高潮形成了更低的低点，它成为主要趋势反转上行的底部。这波反弹又持续了两天时间。","pid":"p262"},{"t":"para","text":"仅凭市场形成了一个双重底或双重顶，并不足以构成进行反转交易的理由。交易决策必须以大的行情背景为基础。例如，在K线27处的双重顶前面是六根向上的K线和一波强力的抛售高潮，所以预测市场可能很容易进入横盘整理的行情。","pid":"p263"},{"t":"para","text":"有几个小级别最终旗形反转的例子，这些小级别的最终旗形反转跟在低点1和高点1入场条件后面，结果形成了微型双重顶和双重底。多头们把K线1后面的十字星K线看作是弱势的低点1价格向下突破后的反弹型卖出信号。他们在这个十字星的低点及其下方买入，预期行情形成一个多头开盘反转和当日低点。这个十字星成为下降小波段中的最终下降旗形，K线2与K线1低点则形成一个双重底。","pid":"p264"},{"t":"para","text":"K线3后面的内含阴线是一个高点1的买入信号，但很多交易员认为如果市场一直把价格维持在开盘时的双K线下降急速的顶部下方，就可能形成一个双重顶，然后向下突破。空头们在这根内含阴线的高点处做空，并预期它将会是一个失败的高点1，同时也是一个单K线最终旗形和一个双重顶。","pid":"p265"},{"t":"para","text":"K线5后面的内含阴线是一个价格向下突破后再反弹的卖出信号K线。多头们认为对移动平均线的测试行情将会稳定在移动平均线之上，而这根内含阴线将变成一个单K线最终下降旗形，并引出一波从移动平均线开始的双重顶反转上行行情。于是他们在这根下跌信号K线的低点处买入。","pid":"p266"}],"wcount":22981},{"id":"p1c4","title":"第4章　巅峰反转：行情高潮后的急速反转","blocks":[{"t":"para","text":"第4章　高潮式反转：行情高潮后的急速反转","pid":"p267"},{"t":"para","text":"市场总是在不断地寻找新的突破机会。然而，在新的突破出现之后市场又试图使每次突破以失败告终。这是我们做出每笔交易时都必须面临的基本事实，也是我们做交易所围绕的核心事实。每一个趋势K线都代表着突破，如果突破行情得以延续，突破就很可能成功；而如果突破失败，行情接下来就很可能反转。即便是V型反转这一类的急速反转行情，也可以简单地解释为突破尝试以及尝试失败的结果。对一个交易者来说，他评估一个突破会成功还是失败的能力，是影响他以交易为生的生涯成功与否的一大因素。这个突破会成功吗？如果答案是肯定的，那就朝着这个方向进行交易。如果不是（如果它是一个失败的突破，随后行情将会出现反转）。那就往相反的方向进行交易。所有的交易都可以用这种方法来进行决定。","pid":"p268"},{"t":"para","text":"许多人将高潮的定义局限在一个大趋势的结束时的趋势性行情的反转。然而对于交易者来说，更有意义的一个宽泛定义是，任何一种即将不可持续的行情都可以叫作高潮，不管接下来是否会有趋势的大反转出现。高潮的级别可以多小呢？就像我在这一系列的第一本书的第二章所说，但任何一根趋势K线都可以当作一个小高潮，虽然很多小高潮都不会带来大的行情反转。但任何一根趋势K线或者几根趋势K线的组合中K线主体相对较大，这就是高潮，虽然大部分的交易者不会这么想。当市场强烈的趋势行情遭遇哪怕一点中断，例如出现暂停K线或是反转K线，这时高潮就结束了。一根大的趋势K线也可以当作是一段小高潮。大部分的高潮行情后都会出现一根或几根K线的区间震荡形态，极少会出现急速反转行情，而且一般来说，趋势倾向于在震荡休整后持续。“巅峰反转”一词用来形容高潮过后行情立即出现反向大反转的情况，它标志着突破的全面失败。例如，如果在牛市中出现了区间震荡，然后市场开始从顶部下跌，下跌浪形成了一个下跌趋势通道，也可以看作是牛市中的上升旗形。此时，如果市场出现了一根甚至多根向上突破下跌趋势通道上沿的K线，那么牛市中的上升旗形突破信号形成。这时，如果市场再度出现下跌，即便这次开始下跌的点位比前一次来说较低（这一次的买入高潮并没有创前一次的新高，市场仍然处于震荡区间内），这次也仍然可以叫作巅峰反转。当市场进入高潮行情，基本面的交易者经常会把这个市场当作是一个拥挤的交易市场，这意味着他们相信太多的人已经入场持有仓位，所以将不会有太多的交易者留下来继续推动这个市场向这个趋势继续移动。举一个例子来说，如果整个市场的上涨趋势呈现出抛物线特征，则基本面的分析者则会认为参与这个市场的交易者太多了，所以他们认为需要等待市场回调的机会再买入。不过，他们并不会马上做空，即便他们知道接下来的回调幅度并不小。买入狂热推动市场出现巅峰反转的例子还有2006年的美国房地产泡沫，2000年的科技泡沫，以及1637年发生的郁金香狂热事件。这些例子都是关于投资的傻瓜理论的证明，你在一个高点买入，同时期望着有人会比你更傻地在更高的点买入，这样你就可以在卖出头寸的时候获利。但一旦这个市场上不再有这样的傻瓜了，市场将只会向另一个方向发展，而且经常是以非常快的速度发展。现在来看，中国和巴西有可能会形成这样的市场泡沫因为他们的市场发展速度非常惊人，而这种速度是不可持续的。在目前来说，这些国家市场上涨速度惊人的很大原因是因为动能交易者的驱动，而并没有得到基本面的足够支撑。一旦市场开始获利了结，行情的反转将会非常迅速和深刻。当巅峰反转发生的时候，投资者将会变得非常的恐慌，因为那时他们只想着在离开的时候可以保住哪怕最小的利益，并希望避免较大的损失。而这正是跟其他所有的巅峰反转行情出现的情况一样。","pid":"p269"},{"t":"para","text":"有些时候，当市场处于一种非常强劲的趋势的时候，经常会出现趋势性的K线，这种K线的主体非常大，波动的价格范围也非常大，而且通常是从一个最低点或者最高点开盘。然后收盘价在K线的另一端。举例来说，假设现在市场开始抛售，一个下跌的趋势K线开始形成，它的开盘价是当日的最高价，收盘价是当日的最低价，K线的主体和价格范围都是下跌趋势中最大的一部分，是其他下跌K线的平均两倍以上。这根K线可能代表着最后一批多头的绝望。这时，他们已经没有耐心等待反弹机会离场，而是市价卖出离场。他们最后还是决定放弃，愿意以任何价格离开。当最后一批多头离场后，市场上的新增空头也逐步减少了。机构参与者将不会留在这个点位卖出，因为他们已经以更高的价格卖出了。实际上，他们已经在这根趋势K线的底部获利了结，甚至开始反手做多。一旦交易者开始反应过来现在已经没有新增做空力量后，那么这个市场将会在接下来的几根K线开始大幅度的反转上涨。不过，如果这根下跌的趋势K线代表着一个或多个支撑位的突破，那么在大反转之前，价格会继续向下移动一定幅度。","pid":"p270"},{"t":"para","text":"巅峰反转的重要组成部分之一是因为市场突然缺少了多空某一方的力量所造成的真空效应。举个例子来说，如果这个市场正在加速向上涨趋势通道的上沿进攻，有一些机构空头认为市场可能很快出现反转，但也许市场在多转空之前，价格还会继续上涨甚至突破趋势通道线。所以，可想而知，如果他们明知市场会突破上方的趋势通道线，他们怎么会在当前的时间点做空呢？他们知道市场会走高。有更好的做空价位，所以他们此时做空是不明智的。他们到底会怎么做呢？他们会等待，而对于机构多头来说也是同样的道理。他们的目标是部分甚至全部抓住这一上涨趋势产生的利润，因此如果他们认为市场还会上涨，那么在市场到达一个无法突破或者至少是当时无法突破的阻力位时，他们才会开始卖出。这意味着市场上有一些强大的做空交易者并没有在做空，而一些很强的做多交易者也没有获利平仓，这种暂时没有卖盘的情况会给市场带来一种真空的状态。并一直促使市场的上涨，直到某个点位，这时空头认为可以做空，而多头也开始希望获利平仓。程序化交易一般会在一开始检测到这种快速趋势的时候就迅速不断买入，直到这股上涨趋势开始衰减，因为这些程序会持续地且不受阻碍地发出买单，并将市场推向最高价位，所以上涨趋势将会更加强势和快速。但是如果一旦市场到达了一个点，在这个点上做空交易者认为做空是有价值的。而做多交易者则认为市场不可能再上升的更高，回调即将出现。例如在突破趋势通道线上方几个点后。这时将会发生什么呢？在这个时候，市场上强劲的机构做空者将会坚决而有力的卖出自己手中的头寸，而一直坚持做多的强劲的做多交易者也会在这个时候卖出他们持有的头寸，因为他们认为现在的时点卖出可以得到不错的收益，而程序化的购买程序也会捕捉到之前向上的势头的衰退，从而卖出他们手中持有的头寸。既然这个点是一个非常好的获得收益的卖点，它就不会持续太长的时间。所以做多交易者和做空交易者都会抓住这个短暂的机遇疯狂地卖出手中持有的头寸。正如他们预想的，接下来市场将出现更低的价格。鉴于目前市场上大部分交易者都在卖出，整个市场将会急转而下，并持续至少10根K线和一些小波段。在新的点位上他们会判断回调是否已经结束，如果他们认为回调已经结束，做多交易者会继续买回他们的头寸，而做空交易者会平仓获利，而如果他们认为市场还会进一步回调，那么他们就不会买入，市场还是会继续下跌。","pid":"p271"},{"t":"para","text":"与强势的机构交易者不同，处于弱势的交易者经常进行相反的操作：当市场快速上涨时，一直空仓的弱势多头交易者最终追涨进去了，而亏损很厉害的弱势空头交易者实在是无法忍受亏损，平掉他们的空头头寸，不切实际地担忧市场会进一步上涨。而有经验的交易者可以像机构交易者一样的交易。比如，他们可以在一个很强的上涨趋势K线的收盘价卖空，或者比这根K线的高点更高，例如在接下来的一到两根K线的收盘价卖出。这种情况下，有经验的交易者一般会设置与这根趋势K线主体大小一样的止损幅度。如果他们等待着一个熊市反转，并且在下跌趋势K线的低点还要低的地方挂条件单卖出，那么他们就会在这根下跌趋势K线的高点处面临着止损风险。当然。他们也可以通过适当地放宽几个点位来获得更宽的止损点位，但是如果他们这样做的话，他们需要适当地减少他们头寸。","pid":"p272"},{"t":"para","text":"强势的做多交易者在上涨加速时也会继续加仓，因为他们也相信整个市场会继续上升。但是，在某些点位上，他们知道市场涨幅过大，太迅猛了，只有二个很短暂的时间窗口能让他们卖掉手中持有的头寸从而获得暴利。如果他们没能及时卖出，则一开始市场小幅的回调可能会变成彻底的反转，从而他们将会失去以很高的价格离开这个市场的机会。所以。他们一定会抓住这短暂的机会卖出他们手中的头寸。在他们疯狂地获利了结的同时，大的机构做空交易者也在疯狂地卖出头寸，这将会使整个市场将迅速下滑一两个，甚至几个区间段，而这就是一个巅峰大反转。市场上的做多交易者还是想在价格低处买回自己的头寸，如果他们预期这次的反转将会失败，但是如果他们没有能力将市场拉回到原来的上升趋势时。他们会再一次卖出他们手里的头寸。已经在更高的点位卖出头寸的做空交易者依然会在这个点位继续卖出，他们和做多交易者在交易的两侧相互博奔以图决定接下来的市场走向。如果空头交易者胜出，市场将会出现一个大转折点，并从市场的顶部区域形成一条熊市的趋势线急转而下。如果多头交易者胜出，市场将会出现另外一种通向牛市的转折点，并向多头行情的巅峰高点进发。","pid":"p273"},{"t":"para","text":"市场价格的峰值经常是一种趋势力量与反趋势力量的博奔的测试。向上的多头趋势也是由一系列的高点和低点构成。而这些点都可以由峰值构成。如果市场在多头趋势发展时出现加速上涨，然后出现一段抛售性回调，由于目前市场趋势是向上的，那么市场很可能会挑战前一个波段的高峰值，但回落时并不会挑战波段的低点峰值。牛市中的上涨浪只是趋势向上的一个波段，之后出现的回调，也一般会演变成牛市旗形并且只是一个比前一低点相对较高的低点，一旦牛市的趋势开始延续，市场价格将不会再度下探这些低点。这些道理也同样适用于在熊市中的趋势，这些趋势由较低的高点和低点构成。最近形成的新的低点，不管它是不是某种意义上的峰值，都将在经历一波回调之后被市场检验并超越，而任何的反弹，不管它是否会变成大牛市中的峰值或者只是平稳的向上发展，都有可能会演变成为熊市的标志。或者是另外一个更低的高点，而这些价位通常都不会被市场再度向上触碰。很多人往往会认为在熊市的趋势中才会发生最强的反弹，而只有在牛市的趋势中才会引发最大的抛售，这个想法被广泛接受，但实际上并不正确。但是，虽然它并不正确，但它却给了我们一个很重要的启示，即与趋势相反的回调往往会非常的强劲以至于让许多的交易者都相信整个趋势都已经开始反转。所有的回调，不论是向上的还是向下的，不论是在牛市的趋势中，还是在熊市的趋势中，甚至只是在震荡区间，都仅仅是一种考验趋势交易者和反趋势交易者决心的工具。市场的回调通常好似要将趋势拉向相反的方向，但它们通常缺乏持续性。大的交易者往往会希望这些看似要反转的尝试因为他们知道这些尝试大多数都是会失败的。一直到反趋势交易者创造出一个趋势交易者大量参与并强烈反击反转的市场点位时，趋势交易者通常才会取得成功。他们认为这些迅速的反趋势的价格变化将是创造趋势交易的最好的时机，这个在市场中短暂而迅速的回调时机，将带给他们最优惠的价格来进入市场。","pid":"p274"},{"t":"para","text":"每一次市场的小回调都是一个小的市场趋势，甚至从拉开时间的长幅来看，所有的趋势又何尝不都是一次小小的回调呢？包括1987年与2008到2009年的股市崩盘时期，也不过是每月的多头趋势线上的一次回调而已。所有的逆趋势的转折点都应该被看作是有着真空效应的回调，而这些回调一般都会伴随着试图改变当前趋势的反趋势K线的出现而结束。比如，如果市场在牛市上涨行情中的5分钟K线出现了一个很强烈的熊市回调，但是市场又很快反转为牛市趋势，不管你是否会立即发现，但这就会在市场的低点形成一个支撑区域。多头交易者一直在观望等待市场重新达到他们认可的点，而且在这个点购买的机会将是稍纵即市场重新达到一个他们认可的点，而逝的。他们清楚地知道，大部分的反转尝试都是枉然的，而且很多反转的尝试伴随着强烈的熊市趋势信号K线。他们打赌因为市场上的交易者对于反转交易已经充满信心所以后续不会再卖出，所以他们会在一个趋势区间结束而另一个趋势区间形成的时候疯狂买入头寸。因为市场上已经没有做空的交易对手方，所以市场会上升好几个价位区间，结束回调并重新开始进入牛市的趋势，而聪明的做空交易者也会察觉到这个规律，从而利用这个机会获利了结。","pid":"p275"},{"t":"para","text":"市场总是尝试着反转（虽然大部分的尝试都将以失败告终），一次成功的反转需要交易者们坚持确信市场上的一贯趋势确实出现了反转。市场上有一些拐点总是因为没有得到交易者足够的坚持。而最终没有形成真正的反转点。但是这些点往往会让交易者怀疑市场一贯的趋势将会反转，但是如果后续交易者的坚持与跟进不足，市场上这些反转的尝试依然会失败。多头交易者将这些回调的点视为一个买入的最好时机，而已经在熊市趋势区间的市场底部区域或者更高的区域卖出的做空交易者也会意识到整个反转正在朝着失败发展，所以他们会迅速地买回做空的头寸，在重新获得市场的控制权之前他们会选择一直在场外观望。结果就是在五分钟的K线图上你可以看到一个市场的底部，这个底部像所有的发生在高位的支撑处的底部一样。会像一条牛市趋势线，也可能会像移动平均线，甚至会像沿着牛市的底部衍生出来的一条熊市的通道线。你必须记住，如果这个五分钟的反转非常强烈，那么交易者将会在这个反转的区间大量购买，无论他们是否在日线或者时线图上看到了支撑的力量。但是即使他们在时间更长的K线图上看到了支撑的力量他们也不会在低点处再购买，除非他们在5分钟的K线图上发现有证据表明正在形成一个底部。这意味着他们其实并不需要通过看不同的时间趋势图来找到支撑区域，因为5分钟的K线图已经告诉了它们这个区域会在哪里。但是如果他们愿意去分析多种时间长度不同的图，他们就可以在市场趋势之前看到支撑和阻力水平，并且在市场朝着趋势发展的时候就在5分钟的K线图上找到可以行动的点。但如果他们仅仅依靠5分钟的K线图来行动的话，图表的信息也已经足够。","pid":"p276"},{"t":"para","text":"股市交易者经常会认为牛市中的加速下跌带来的峰值有着很大的价值，并经常在此处大量购买。虽然他们在购买股票之前也会寻找支持他们买入的一些市场价格行为依据，但他们依然喜欢在股票出现大幅急速下挫后的底部买入，特别是当市场下跌到牛市趋势线的支撑位，或是其他技术上的支撑区域时，比如震荡区间的底部区域。他们之所以购买这些股票是认为这些因为一些新闻事件影响的股票只是暂时的被市场低估了，而他们相信这些股票不会长期的偏离市场价值。他们并不介意这些股票的价格跌得更多一些，因为虽然他们也不确定市场回调的底部在哪里，但是因为他们相信市场很快就会纠正错误，股价马上就会反弹，所以他们才愿意在市场抛售的时候购买股票。","pid":"p277"},{"t":"para","text":"高潮，简单的定义，就是在交易者看来超买或者超卖了的行情。高潮可以是一根趋势K线，也可以是由一系列较少重叠的趋势K线组成的线，它可以在市场出现突破时或者趋势开始时出现，也可以在趋势开始一大段之后出现。市场价格会在高潮之后出现暂停，随后趋势可能会持续，也可能会反转。如果在一个较大的趋势之后立即出现急速反转，那么这个市场正在尝试着反转，这种巅峰反转可能体现在两根相反的趋势K线上，而这两根K线可能只在更高或者更低的时间图表上才能看到：举个例子来说。如果有一个已经持续了20多个K线的牛市趋势，迎来了整个趋势中最大的一根牛市趋势线。交易者将会认为这是结束趋势的一个高潮信号（一次冲顶回落）。如果在趋势反转向下的过程中出现了一根或两根很强的牛市趋势K线，这根熊市K线与之前在行情高潮的时候最后出现的1根或几根趋势K线将形成一个两根趋势K线的反转，不管在最后出现的牛市K线和熊市K线中间是否有许多别的K线将他们分离开来。在更高一些的时间趋势图上，交易者可以很清楚地看到这是一个简单的两根K线的反转。只要你明白了市场的运作，你就没有必要通过看不同的时间趋势图来找到一个完美的两根K线的反转点。你知道这个反转在你面前的任何时间图上存在的样子，而你所需要做的不过是进行交易而已当第二个或第三个中间没有被过多回调的连续的多头高潮行情到来的时候，做多交易者和做空交易者都会在这个时点卖出，而这次的卖出将会带来一次高潮反转。做空交易者认为接下来会有一波抛售性下跌行情，因此他们开始开空仓，而做多交易者也会把最后的一根或两根牛市趋势K线当作获利了结的最好时机，因为他们也相信这看起来像是一个趋势的短暂结束，将会开始一次深度回调，或者是一段区间震荡，或者是完全相反的趋势。他们预计市场将会下跌10根K线和两个波段，而且他们很害怕牛市的趋势很可能会结束，之前的高点将难以超越。当在第二次购买高潮之后紧接一个反转点时。做多交易者和做空交易者都会怀疑市场正在形成一个最后的旗形反转（在最初的购买高潮之后的回调形成了最后的旗形）。当市场在第三次推高之后形成了一根反转信号的K线，交易者们将认为市场形成了一个楔形顶部。当交易者寻找可能的最后的旗形和楔形底部时，股市形成了连续的卖出高潮之后形成的真正的反转。","pid":"p278"},{"t":"para","text":"当卖出高潮已经非常明显而且时机比较正确的时候，交易者们将会卖出他们手中所有的多头头寸。如果他们认为市场只会下降几个点位，他们就不会离开他们的多头位置，甚至会在市场点位较低的时候再买一些头寸。他们暂时的退出只是因为他们将有能力以低于退出价格的价格买回这些头寸，并且多余的利润将足以覆盖交易费用。他们也担心市场将会反转成熊市的趋势，或者至少是一次较深的回落，使他们等不到他们一直希望看到的创新高的上涨K线。由于这批人在市场价格下跌到一定幅度之前不会买入，所以市场上暂时会缺乏买方。同时，强大的做空交易者将会在市场下跌的时候继续做空。因为市场上的卖方强于买方，所以一次简单的回调可能会加剧并最终演变成为一次趋势反转。如果市场在他们退出之后开始走高，他们将会在再次走高时追高买入或者回调的时候再次购买。如果市场开始下行，他们将会设置条件单以更低的价格买入，但通常会加上一个条件，即买入时点不会超过10根K线。如果在10到20根K线之后没有出现购买的时点，那么整个趋势就可能会反转向下，那么市场上的交易者将不会再寻找买入时机。但是如果在10根K线和2个下跌波段过后出现了购买的时点，那么做多交易者将会恢复做多，而做空交易者将会获利了结。","pid":"p279"},{"t":"para","text":"连续的高潮将增加市场修正的机会。举个例子来说，如果市场在一个购买的高潮（通常由1根或数根大的牛市趋势K线组成）之后只是出现了一个短暂的停滞或者很小的回调，在此之后又出现了第二次购买的高潮，那么接下来出现一个大幅的修正或者行情反转的机会将会更高如果市场在接下来又出现了一次小幅回调并迎来了第三次购买的高潮，那么市场通常会开始一个持续两主浪的修正并且至少会持续10根K线。此时，市场的行情暂停线可以是任何一根牛市趋势K线以外的K线，阳线十字星或阴线十字星，或者下跌趋势K线，都可以看作是市场的暂停K线。尽管市场上的暂停K线的高点有时候会比第二次的买入高潮的K线更高一点，但是依然扮演着一根K线的最终旗形形态，从而带来第三次高潮之后的反转。第三次高潮通常只能持续1到2根大的牛市趋势K线。连续的高潮迭起暗示着市场已经走得太急太快了，以至于做多交易者只愿意在更低的价格购买。两个连续的购买高潮将市场两次推高并形成了一个双重顶，即使第二次形成的购买高潮要高出很多。三次连续的购买高潮将形成一个楔形顶部，第二次形成的顶部可以比第一次更高，而第三次将高过第二次，从而使得这个形状比起楔形更像一个上涨的牛市趋势。不过，他们有相同的含义并且可以进行相同的操作。不过只有非常有经验的交易者才应该在购买高潮中做空，因为大部分人都很容易会误读价格的信息，最终在一个没有显著的高潮或者反转迹象的牛市趋势中做空。","pid":"p280"},{"t":"para","text":"如果在一次购买高潮之后的回调持续了10根或者更多的K线，并且打破了牛市通道的底部，那么它将足够消除市场上多头拥挤的状态，即使调整之后再出现一次购买高潮，市场也没有之前那么拥挤，大的调整需求也没那么迫切。一些趋势会在一系列的强突破点之后，出现震荡区域。每一个突破都是一个峰值，因此也是一个购买高潮，但是随之而来的震荡区域意味着强大的做多交易者还在高点附近购买。这意味着这个突破口并非是由较弱的做空交易者在短暂的恐慌中回补他们做空的头寸造成的，而是由较强大的做多交易者造成的，而市场之所以会进入区间震荡是因为强大的做多交易者相信市场将会上涨所以不再等待更低的价格，而强大的做空交易者也不再激进的做空，因为他们也相信市场会走得更高。如果他们相信他们有能力在更高的点位上做空，那么现在开始做空对他们来说就没有意义。","pid":"p281"},{"t":"para","text":"反转的高潮级别可以比趋势性的高潮级别更大或者更小，如果它更大，那么出现反转的概率将更大。在出现行情反转的动作之后，市场将会进入暂停或者形成震荡区间，这个时段可以很短也可以持续几十根K线。在市场的暂停处，做多交易者和做空交易者都会增加他们的头寸，试图通过这种方式使得接下来形成的趋势通道是有利于他们的方向。举个例子，如果市场上出现了很强的上涨趋势之后立刻出现了大反转，那么说明市场上的做多交易者和做空交易者都是很激进的。下跌的高潮和上涨的高潮可以出现在同一条K线上，如果这个发生的时候，那么在这根大K线的顶部将出现一条长长的尾部。在更小的时间图上，将会看到在一到多个牛市趋势K线后面跟随着一个或多个熊市趋势K线。另外，下跌的高潮可以在接下来的一根或者几根K线中出现。在更高的时间图中，反转可以是简单地由一根牛市趋势K线后紧接着二根熊市趋势K线组成，它们一起构成了一个两根K线的反转。在更高的时间图上，反转可能仅仅只是一根反转K线。下跌的高潮行情出现之后，市场可能会在接下来的一根或数根K线继续延续下跌行情。不论它是否延续，市场将很快会进入暂停或者回调，来修正一些过度下跌。通常，市场会形成一个短暂的或者较长的持续几十根K线的震荡区间。做多交易者将会更积极地购买，希望把市场推向牛市通道，同时，做空交易者也会在震荡区域积极做空，希望把市场推向熊市通道。在某个点上，一方的力量将会取得胜利，另一方的力量将被迫结束。如果做多交易者取得了胜利，那么做空交易者将会买回他们的头寸，从而增加了买方的力量增强了反弹的力度。如果做空交易者取得了胜利，做多交易者将被迫卖出他们手中的头寸，这将加强了形成熊市通道的力度。","pid":"p282"},{"t":"para","text":"当一个趋势中出现了高潮反转，那么这个反转通常会在趋势通道线被突破之后出现。当行情反转回到趋势通道内时，经常会朝着相反的方向尝试突破趋势通道的另一边，而这将带来一个很好的交易时机。基于此，你最重要的就是要找到通道，而且如果你看到价格突破趋势通道线之后立即出现一个急速且强大的反转，那么就可以准备好在趋势通道的另一边开始设置反转交易的入场点了。有些时候，趋势会在一到两根K线内迅速延续，而且将再次突破趋势通道线，但是这第二次的突破依然会失败。当这个出现时，我们入场进行反转交易的成功率将会更高。","pid":"p283"},{"t":"para","text":"有时候在买入高潮之后会出现一个在一定区间内的双重顶熊市旗形走势，这一形态给予了交易者更多理由入场做空进行反转交易。然而，如果正好与此相反，出现的是一个双重底的牛市旗形走势，那么这是一次做多的时机。反之，对于一次卖出高潮之后的操作也是同样的道理如果在一次顶点回落之后出现了一个双重底部的牛市旗形走势，那么这就是一个做多的入场时机。如果在向上反转后的震荡区间形成了双重顶形态，那么这将是一次做空的入场时机。","pid":"p284"},{"t":"para","text":"与之前的趋势浪相比，由趋势转为震荡的反转浪经常会比较小，但是它通常会打破趋势线，并且会发展成为反转后的趋势的第一浪。尽管如此，它依然很容易被忽视，所以你应该努力去发现市场中的高潮行情。反转浪有可能会朝着前一个趋势的极值缓慢移动，从而使得这次反转尝试失败，需要再来一次（出现的形态比如说，在牛市的顶部出现更低的高点或者在底部出现更高的低点）。当然，在反转尝试失败后，市场有可能会继续延续之前的趋势，反转完全失去机会。但是，如果市场确实出现了反转，那么新的反转趋势有可能会变得非常剧烈而迅速，并通常会形成加速行情和趋势通道的形态。","pid":"p285"},{"t":"para","text":"在突破K线之后形成的内含K线之后经常会跟随一根相反方向的趋势K线，并形成了一个高潮反转点。与所有的高潮反转点一样，接下来的趋势可以向任何方向发展。最重要的是，我们要意识到市场上涨和下跌两种可能性都存在。一旦趋势开始形成。就寻找与趋势相同方向的入场点。","pid":"p286"},{"t":"para","text":"有时候，市场会出现一个非常大幅的加速上涨或下跌，然后出现回调，再开始形成一个新的趋势通道，直到趋势出现反转，通道形态失败。事后来看，这次的回调只是趋势发生反转的一个信号，随后市场会形成与此前趋势相反方向发展的趋势通道。然而，一旦你知道了一条新的趋势通道将会出现，那么你就应该抓住所有的顺势入场的机会。","pid":"p287"},{"t":"para","text":"在5分钟的K线图上，一般没有经过二次测试的巅峰反转点在一个月也出现不了几次，而这些经常会被称为V形底部和倒V形顶部，这些一般是简单的两条K线的反转。市场的上涨高潮和下跌高潮会包含许多K线，但是在更高的时间图上看这就是一个简单的两根K线的反转。然而，在所有的反转形态中，大部分试图形成巅峰反转的努力都会失败，或者市场会在真正反转前至少二次测试一下这个峰值。不论反转是多么地强劲和情绪化，在牛市中，大部分的巅峰反转的高点都会被二次测试。在熊市里，大部分的V形底部都会被二次测试，这是因为这些点位是反转的尝试点，但交易者们都知道大部分的反转行情都会失败，趋势一旦形成就更容易会延续。所以他们在这些点位被二次测试之前不会认为市场会真正反转。","pid":"p288"},{"t":"para","text":"然而，如果当前市场是牛市，在强劲而恐慌的快速回调行情结束后，那么这次触及的低点可能会也可能不会受到二次测试。一旦所有人都感知到了行情的回调已经结束，趋势已经开始向上复苏，那么交易员也会开始活跃起来，他们会积极地参与到顺势交易中来。因为他们对行情的看法没有任何犹豫和不确定性，所以对他们而言不需要二次测试来证明他们的看法。之前的低点是一个牛市旗形的底部而非试图反转成牛市趋势的熊市趋势的底部。同样，如果在熊市的反弹中出现了一个小高点，这个高点也不一定会得到市场的二次测试。这个点也仅仅只是熊市旗形的顶部，而非正在试图反转成熊市趋势的牛市趋势的顶部。","pid":"p289"},{"t":"para","text":"高潮、抛物线和V型顶部和底部的形态都有一个共通点，那就是他们的斜率。与线条（直线）不同，这些图形都是弯曲的且斜率是上升的。在某一点，市场可能会突然反转方向，但是通常在这之后会出现一段长期的横向盘整，或是出现反转行情。所有的这些形态都不过是尝试突破趋势通道线的失败并出现反转的状态，所以他们应该被同等看待，而给予他们不同的名称并不能增加你交易成功的可能性。在趋势反转的一开始，趋势通道线可能不会很明显地被发现，但是一旦开始了抛物线状的移动，基于价格行为的交易员们通常会画出并不断调整趋势通道线，并且等待市场突破趋势通道线后的反转。最好的反转形态一般会由大的反转K线组成，并给予交易者二次入场的机会。反转行情的第一浪一般会打破趋势线，如果它没有，那么这个反转就是值得怀疑的，那么接下来出现一个调整区间或者持续性的形态的可能性更大。当进行反趋势交易时，最好先等待市场对原有趋势的高点进行二次测试。然后再入场。举个例子来说，在牛市高潮之后出现的回调中，在二次测试后较高的低点买入，相比在回调后的第一次反转的低点购买是更具有盈利性的策略，因为市场上大部分的反转尝试都会失败。如果第二次入场机会还是出现了失败，那么原有市场趋势将很有可能会持续至少两浪。","pid":"p290"},{"t":"para","text":"如果市场出现呈抛物线的走势，一般会以三浪推进模式的楔形形态进行演变，三浪的高点组成抛物线，这些我们会在接下来的一章详细分析。第三浪一般是持续好几根K线的强势突破浪，它直到触及支撑或者阻力位（不一定很明显），之后市场出现停滞甚至开始急速反转。这种突破行情超出了期待两浪推进模式的交易员的预期，比如比震荡区间的顶部更高的高点（或者比震荡区间的底部更低的低点）。记住，出现更高的高点也仅仅代表这是一个持续两浪的反弹，因此再次反转向下的行情将会带来一个熊市中行情下跌至低点2的做空机会。只有非常有经验的交易员才能尝试反趋势交易，即使行情可能会形成高潮反转。大部分的交易员还是应该在进行反趋势交易操作之前等待趋势的反转确认（例如，在一个呈抛物线移动的牛市趋势大幅向下反转成熊市趋势之后再进行做空交易）。如果市场在第二次或第三次上涨高潮行情之后触发了一个下跌高潮，然后又一次反弹超过高点，那么这个时候一般会因为交易者从震荡区间交易模式切换成牛市趋势交易模式而引发市场的大突破，市场整体预期向上。如果市场从一个上涨高潮过后开始反转向下，这次的反转一般会从双重顶的形态开始，虽然可以从5分钟的时间图上推断出来，但是一般会在更小的时间图上才比较显著。反转可以是非常急速的，但是市场回调也可能会持续好多根K线并形成旗形势态，那时市场可能会向相反的方向突破（向下而非向上突破）此时的市场将以之前上涨的速度下跌。趋势线和趋势通道线都应该将市场走势容纳在它们之间并且引导反转行情使得这两条线都不被突破，这意味着他们能够很好地将趋势管理在这一通道内。有些时候，他们之一没有能够阻挡住价格的突破，那么市场并不一定会在这一条线附近停下脚步并反转。趋势线的突破与趋势通道线的突破有相反的含义。趋势线的突破意味着一个可能的趋势大反转正在进行，但是趋势通道的突破意味着趋势正在增强并且变得更加陡。但是，大部分的趋势通道线的突破都会在5条K线以内失败，之后市场通常会重新进入通道，然后突破通道的相对侧（即趋势线）。","pid":"p291"},{"t":"para","text":"趋势线的突破往往只是趋势反转的第一步，而且如果这个突破是强劲的，那么市场通过二次测试趋势的极值来成功确认反转的概率就将增加。例如，在熊市的趋势线被打破以后，市场将会对下跌趋势的低点进行二次测试，从而形成一个更高的低点，随之而来是第二波反弹浪。也有可能这次测试的低点比前一次低，但动能明显减弱，之后又有至少两浪的反弹。","pid":"p292"},{"t":"para","text":"一般来说，当趋势线过于陡峭时，有一两根K线出现假突破是不会破坏趋势形态的，市场趋势并没有改变，所以这些假突破通常会吸引一大波交易者。但是，一旦这种可信的形态失败了，将会有一大批交易者被困在市场中。此时，反转交易可能是最有利可图的交易，而且它可能是非常急剧的并且导致趋势的真正反转。这些试图反转趋势的尝试通常会在1分钟的K线图上看到，但是因为大部分的反转通常是以失败告终，所以最好不要根据1分钟的K线图进行反向交易。你应该在绝大多数时候都根据5分钟的K线图行动。","pid":"p293"},{"t":"para","text":"一旦趋势通道线的阻力位失效（趋势通道线被突破而不是把价格阻挡回去），你应该认识到这股趋势将比你想象的更加强劲，所以你应该寻找顺势交易的入场点。但是，请注意，趋势通道线的突破也可能会失败从而导致趋势的反转，所以你也要准备好在突破开始失败时抓住任何突破回调的机会快速撤离。","pid":"p294"},{"t":"para","text":"趋势通道线的突破一般会呈抛物线运动，因为当市场驶离趋势通道线时，一般是加速运动的，这意味着市场呈现出抛物线的形态。如果市场反转，它通常会有一段持续10根K线和两主浪回调形态。如果市场重新进入趋势通道，那么它通常会突破通道的另一边，突破趋势线，甚至可能变成趋势的反转。","pid":"p295"},{"t":"para","text":"传统的技术分析理论教导我们，大部分的反转都会带来异常的交易量，特别是在市场的底部区域。在股市中这个理论通常是正确的，特别是对于一些交易量较小的股票来说，但是在更大的市场中这个理论就不一定成立了。在类似于SPY和Emini的市场上，大部分的主要趋势的反转都不会伴随着清晰可见的交易量变化，虽然说有时候在一个高潮的市场底部会有很大的交易量，但那是因为市场出现卖空的真空状态，市场突然跌至支撑位，从而做多交易者会积极地买入，而做空交易者最终获利平仓。当从市场的底部反转向上的一根或多根K线的交易量比近期大部分的K线的交易量多出10到20倍的时候，接下来出现更多的买盘的概率将会变大。同样地，如果一个上涨趋势的高点的交易量超出平均交易量10到20倍，且K线的主体大小在近期的大部分的K线的5倍以上，那么接下来出现的K线中肯定会有更高的价格。市场通常还会持续一段时间的上涨，但是也会有例外，尽管概率很小，但市场也有可能不仅会反转到前一次上涨行情的高点以下，而且还会持续一段时间的下跌。","pid":"p296"},{"t":"para","text":"高潮的顶部很少有明显的可参考的交易量形态。非常关注交易量的交易员很容易错失许多交易良机，而且相较于只是通过判断价格走势来交易的交易方法赚的钱少很多。虽然说大部分有着显著交易量的顶部和底部的交易机会确实会在1分钟的图上出现成交量和价格背离的情况，但是如果交易者可以忽略这个情况，而把精力主要集中于观测5分钟图或者更高时间周期的趋势图上的价格行为变化的话，那么可以挣到更多的钱。1分钟图上的成交量背离是指，最后的低点相较于最近的反弹反转的低点有着更低的交易量。当然，市场也通常会出现价格和震荡指标的背离情况，但是有经验的交易者在他们发现价格底部的时候就已经清楚这一点，他们认为不需要对他们之前已经知道的情况再进行测试和确认了。","pid":"p297"},{"t":"para","text":"理解高潮反转的关键在于认识到大部分的高潮反转就是一个突破尝试的失败而已。比如，当一个持续了40根K线并且伴随着少量的回调的牛市趋势，突然迎来了整个趋势中最大的一根牛市K线，而这根K线有着较小的阴影并且收盘价高于前一根的K线的高点，这使得它看起来像是一个非常强劲的突破，然而在这根K线之后买盘继续增加的概率将小于整个趋势中其他较早发生的突破。这是因为有经验的交易者会预期；一个持续了儿十根K线并且没有太多回调的趋势会过渡到震荡区间。他们知道大部分的概率都会偏向于此。如果正好相反，市场在这一点上有着更为强劲的趋势突破，那么市场正在试图将原本已经很强劲的牛市趋势推向更为陡的牛市趋势，而这个尝试成功的概率不超过30%。做多交易者和做空交易者都预期突破会失败，所以进行了相应的操作，并期待这个突破演变成一个消耗性缺口而非测试性缺口。并且市场将持续至少2波浪潮和10根K线的调整时期，直到价格回到移动平均线附近。做多交易者将通过卖出他们手里的头寸获利了结，而做空交易者选择做空。经验不足的交易者将与他们进行相反的操作。例如。之前一直处于观望并且错过整个过程的交易者将害怕他们会失去整个牛市中最强劲的部分，从而会继续疯狂地买入。一直保持做空、期待着市场的反转的弱势做空交易者，最终在恐慌中买回了他们的头寸，这两种交易者都与大的机构交易者的做法相反，因此注定要输钱。初学者只是市场交易者中的一小部分，因此他们对于市场的影响微乎其微，虽然在几十年以前，市场上的初学者和经验丰富的交易者一起推动的市场是高潮反转中最重要的组成部分。但是今天大多数的交易者都足够聪明，很难在这种恐慌而短暂的高潮中买入了。大部分的突破是失败的。而且有的时候往往是最强劲的突破最有可能失败的。","pid":"p298"},{"t":"para","text":"如果一个趋势突然加剧，那么它可能会成为一个成功的突破，可能引发另一波趋势性浪潮，也可能只是趋势动能的衰竭。","pid":"p299"},{"t":"img","src":"assets/img/p1c4_001.webp","ctx":[{"t":"理解高潮反转的关键在于认识到大部分的高潮反转就是一个突破尝试的失败而已。比如，当一个持续了40根K线并且伴随着少量的回调的牛市趋势，突然迎来了整个趋势中最大的一根牛市K线，而这根K线有着较小的阴影并且收盘价高于前一根的K线的高点，这使得它看起来像是一个非常强劲的突破，然而在这根K线之后买盘继续增加的概率将小于整个趋势中其他较早发生的突破。这是因为有经验的交易者会预期；一个持续了儿十根K线并且没有太多回调的趋势会过渡到震荡区间。他们知道大部分的概率都会偏向于此。如果正好相反，市场在这一点上有着更为强劲的趋势突破，那么市场正在试图将原本已经很强劲的牛市趋势推向更为陡的牛市趋势，而这个尝试成功的概率不超过30%。做多交易者和做空交易者都预期突破会失败，所以进行了相应的操作，并期待这个突破演变成一个消耗性缺口而非测试性缺口。并且市场将持续至少2波浪潮和10根K线的调整时期，直到价格回到移动平均线附近。做多交易者将通过卖出他们手里的头寸获利了结，而做空交易者选择做空。经验不足的交易者将与他们进行相反的操作。例如。之前一直处于观望并且错过整个过程的交易者将害怕他们会失去整个牛市中最强劲的部分，从而会继续疯狂地买入。一直保持做空、期待着市场的反转的弱势做空交易者，最终在恐慌中买回了他们的头寸，这两种交易者都与大的机构交易者的做法相反，因此注定要输钱。初学者只是市场交易者中的一小部分，因此他们对于市场的影响微乎其微，虽然在几十年以前，市场上的初学者和经验丰富的交易者一起推动的市场是高潮反转中最重要的组成部分。但是今天大多数的交易者都足够聪明，很难在这种恐慌而短暂的高潮中买入了。大部分的突破是失败的。而且有的时候往往是最强劲的突破最有可能失败的。","p":"p298"},{"t":"如果一个趋势突然加剧，那么它可能会成为一个成功的突破，可能引发另一波趋势性浪潮，也可能只是趋势动能的衰竭。","p":"p299"},{"t":"在图4.1标普500的期货合约的5分钟K线图上，K线13和K线15同样都有着非常大的区间和主体。并且都跟随着很多根其他的熊市K线，但他们代表的意义却大不相同。K线13是在震荡区间之后的向下突破，它代表着熊市趋势的持续。这个突破变成了一个测试性的缺口。正如这个图中案例所示，强劲的突破往往至少会持续两个趋势浪。在第二次卖出高潮之后形成的回调可以是由一根或多根K线组成，而且这些K线中的低点可以低于此前卖出高潮中的低点，正如图中的熊市旗形中的K线14。K线15是一条非常大的熊市趋势线，因此代表了更为猛烈的卖出，市场的趋势的斜率在此时儿近垂直。当最后的多头头寸被卖出，市场上将没有任何头寸可以卖出。当市场反转上升的时候，这个缺口就演变成了一个消耗性缺口。连续的卖出高潮经常会跟随着一段至少持续10根K线，2个浪潮的反转（我经常会使用10根K线，2个浪潮”的反转，这样的表述。我的本意是想表述市场的调整期将会比一个小回调更长也更复杂，这种形态的调整经常需要至少10根K线和2个浪潮的时间）。这个大牛市反转重新进入区间震荡，同所有的区间震荡一样，是充满吸引力的。","p":"p300"},{"t":"所有的做多交易者和做空交易者都希望在一个持续了一段时间的趋势之后出现一条特别大的趋势K线，就像K线15那样，因为他们认为这是一个非常短暂但难得的入场机会。趋势K线代表着突破，而大部分的突破尝试都会失败，这次的趋势K线是在前一波没有多少反弹的卖出高潮之后出现的。就像在一波持续了几十条K线但没有调整的牛市趋势后出现加速上涨的趋势K线一样，都代表着能量的最后消耗，所以在这个图中，出现反弹的概率很大。聪明的交易者认为这是一个难得的买入机会，至少在接下来的几根K线里继续下跌的可能性很小。因此，空头开始大量平仓，多头继续加仓。双方都将在这条K线的收盘价附近，或者在比这根K线最低价更低的价位。例如在下一根K线或者随后的K线的收盘价附近（特别是当下一根K线是一根较弱的趋势K线，或者有朝着相反方向发展的K线主体，就像K线16一样）大量买入。如果当下一根K线出现类似K线16一样反转成为上涨趋势的K线时。他们甚至会追高，以高于这根K线的最高价的价位买入。多空双方都期待着一次较大级别的反弹，因此，除非经历一次持续10根K线和两拨浪潮的反弹，空头短期内不会考虑继续做空。并且，即使是经历了这样的反弹，他们也必须看到反弹动能减弱才会重新做空。多头同样也期待一场较大级别的反弹，因此不会急于获利了结。一些在K线15的收盘处购买的激进的富有经验的做多交易者可以设置一个大约等于这条K线的高度的止损点，大概是4个点位。在他们的止损价被触及之前，他们至少要预计市场大概有60%的机会去测试这根K线的高点，只有这样这才是一笔比较值得做的交易。一旦市场开始迅速地向上反转，他们也至少在收盘的时候建仓了部分的头寸。","p":"p301"},{"t":"弱势的交易者看待K线15的方式正好相反。此前一直没能入场做空的弱势交易者一直都处于观望状态。并且希望有一个简短的反弹机会让他们逢高做空。他们眼巴巴地看着市场不断下跌，却没能享受做空带来的收益，急切希望能够抓住下一波下跌的机会。因此他们看到K线15时，就会认为新的一波崩盘行情开始了。虽然他们知道这种行情持续的概率可能会很小，但是他们不想失去大赚一笔的机会，而且他们相信这比回报将足以打消他们对概率的疑惑。很早就已经做多并大量建仓的弱势的做多交易者很可能会被K线15带来的急速下跌惊吓，并且担心接下来会出现强劲的大量尾随卖盘，所以他们卖出了自己手中的头寸。这些弱势的交易者通常是情绪化地进行交易。而这与那些没有将情绪作为程序编程中的一个变量的计算机交易法正好相反。既然程序化交易已经掌控了整个市场，那这些通过情绪化交易的弱势的交易者将注定在K线15上损失巨大。","p":"p302"},{"t":"K线11是主要趋势反转中出现的新低的二次入场信号。在K线9之前的两个上升浪打破了从K线6到K线7形成的下跌趋势线。不过，只有一根K线稍微向上突破了移动平均线，所以并没有形成非常激烈的买盘。在K线12之前的加速上涨看起来也许会开始形成一波牛市反转，但是因为它没有大的牛市趋势K线，而且仅仅只测试了震荡区域的K线9的高点，并且与K线9的高点形成了一个双重顶。所以，这时，市场可能正在经历一个缓慢弱势的牛市反转行情，也可能只是正在尝试测试熊市中的震荡区域的顶部（形成熊市旗形）。K线13给了答案，它是一根突破了熊市旗形下沿的熊市趋势K线，延续下跌行情。牛市反转的尝试失败了。此前下跌趋势线的突破和从K线11的低点开始的大幅反弹都缺乏持续的、大的上涨趋势K线的跟进，市场还没有正式转为做多状态。","p":"p303"},{"t":"有时候，市场会在经历一波加速上涨行情之后出现快速下跌行情，然后多空双方交战，形成一个震荡区间，多头不断尝试突破形成上涨趋势通道，而空头不断尝试向下突破形成下跌趋势通道，他们博奔的结果就是区间震荡。","p":"p304"}]},{"t":"para","text":"在图4.1标普500的期货合约的5分钟K线图上，K线13和K线15同样都有着非常大的区间和主体。并且都跟随着很多根其他的熊市K线，但他们代表的意义却大不相同。K线13是在震荡区间之后的向下突破，它代表着熊市趋势的持续。这个突破变成了一个测试性的缺口。正如这个图中案例所示，强劲的突破往往至少会持续两个趋势浪。在第二次卖出高潮之后形成的回调可以是由一根或多根K线组成，而且这些K线中的低点可以低于此前卖出高潮中的低点，正如图中的熊市旗形中的K线14。K线15是一条非常大的熊市趋势线，因此代表了更为猛烈的卖出，市场的趋势的斜率在此时儿近垂直。当最后的多头头寸被卖出，市场上将没有任何头寸可以卖出。当市场反转上升的时候，这个缺口就演变成了一个消耗性缺口。连续的卖出高潮经常会跟随着一段至少持续10根K线，2个浪潮的反转（我经常会使用10根K线，2个浪潮”的反转，这样的表述。我的本意是想表述市场的调整期将会比一个小回调更长也更复杂，这种形态的调整经常需要至少10根K线和2个浪潮的时间）。这个大牛市反转重新进入区间震荡，同所有的区间震荡一样，是充满吸引力的。","pid":"p300"},{"t":"para","text":"所有的做多交易者和做空交易者都希望在一个持续了一段时间的趋势之后出现一条特别大的趋势K线，就像K线15那样，因为他们认为这是一个非常短暂但难得的入场机会。趋势K线代表着突破，而大部分的突破尝试都会失败，这次的趋势K线是在前一波没有多少反弹的卖出高潮之后出现的。就像在一波持续了几十条K线但没有调整的牛市趋势后出现加速上涨的趋势K线一样，都代表着能量的最后消耗，所以在这个图中，出现反弹的概率很大。聪明的交易者认为这是一个难得的买入机会，至少在接下来的几根K线里继续下跌的可能性很小。因此，空头开始大量平仓，多头继续加仓。双方都将在这条K线的收盘价附近，或者在比这根K线最低价更低的价位。例如在下一根K线或者随后的K线的收盘价附近（特别是当下一根K线是一根较弱的趋势K线，或者有朝着相反方向发展的K线主体，就像K线16一样）大量买入。如果当下一根K线出现类似K线16一样反转成为上涨趋势的K线时。他们甚至会追高，以高于这根K线的最高价的价位买入。多空双方都期待着一次较大级别的反弹，因此，除非经历一次持续10根K线和两拨浪潮的反弹，空头短期内不会考虑继续做空。并且，即使是经历了这样的反弹，他们也必须看到反弹动能减弱才会重新做空。多头同样也期待一场较大级别的反弹，因此不会急于获利了结。一些在K线15的收盘处购买的激进的富有经验的做多交易者可以设置一个大约等于这条K线的高度的止损点，大概是4个点位。在他们的止损价被触及之前，他们至少要预计市场大概有60%的机会去测试这根K线的高点，只有这样这才是一笔比较值得做的交易。一旦市场开始迅速地向上反转，他们也至少在收盘的时候建仓了部分的头寸。","pid":"p301"},{"t":"para","text":"弱势的交易者看待K线15的方式正好相反。此前一直没能入场做空的弱势交易者一直都处于观望状态。并且希望有一个简短的反弹机会让他们逢高做空。他们眼巴巴地看着市场不断下跌，却没能享受做空带来的收益，急切希望能够抓住下一波下跌的机会。因此他们看到K线15时，就会认为新的一波崩盘行情开始了。虽然他们知道这种行情持续的概率可能会很小，但是他们不想失去大赚一笔的机会，而且他们相信这比回报将足以打消他们对概率的疑惑。很早就已经做多并大量建仓的弱势的做多交易者很可能会被K线15带来的急速下跌惊吓，并且担心接下来会出现强劲的大量尾随卖盘，所以他们卖出了自己手中的头寸。这些弱势的交易者通常是情绪化地进行交易。而这与那些没有将情绪作为程序编程中的一个变量的计算机交易法正好相反。既然程序化交易已经掌控了整个市场，那这些通过情绪化交易的弱势的交易者将注定在K线15上损失巨大。","pid":"p302"},{"t":"para","text":"K线11是主要趋势反转中出现的新低的二次入场信号。在K线9之前的两个上升浪打破了从K线6到K线7形成的下跌趋势线。不过，只有一根K线稍微向上突破了移动平均线，所以并没有形成非常激烈的买盘。在K线12之前的加速上涨看起来也许会开始形成一波牛市反转，但是因为它没有大的牛市趋势K线，而且仅仅只测试了震荡区域的K线9的高点，并且与K线9的高点形成了一个双重顶。所以，这时，市场可能正在经历一个缓慢弱势的牛市反转行情，也可能只是正在尝试测试熊市中的震荡区域的顶部（形成熊市旗形）。K线13给了答案，它是一根突破了熊市旗形下沿的熊市趋势K线，延续下跌行情。牛市反转的尝试失败了。此前下跌趋势线的突破和从K线11的低点开始的大幅反弹都缺乏持续的、大的上涨趋势K线的跟进，市场还没有正式转为做多状态。","pid":"p303"},{"t":"para","text":"有时候，市场会在经历一波加速上涨行情之后出现快速下跌行情，然后多空双方交战，形成一个震荡区间，多头不断尝试突破形成上涨趋势通道，而空头不断尝试向下突破形成下跌趋势通道，他们博奔的结果就是区间震荡。","pid":"p304"},{"t":"img","src":"assets/img/p1c4_002.webp","ctx":[{"t":"K线11是主要趋势反转中出现的新低的二次入场信号。在K线9之前的两个上升浪打破了从K线6到K线7形成的下跌趋势线。不过，只有一根K线稍微向上突破了移动平均线，所以并没有形成非常激烈的买盘。在K线12之前的加速上涨看起来也许会开始形成一波牛市反转，但是因为它没有大的牛市趋势K线，而且仅仅只测试了震荡区域的K线9的高点，并且与K线9的高点形成了一个双重顶。所以，这时，市场可能正在经历一个缓慢弱势的牛市反转行情，也可能只是正在尝试测试熊市中的震荡区域的顶部（形成熊市旗形）。K线13给了答案，它是一根突破了熊市旗形下沿的熊市趋势K线，延续下跌行情。牛市反转的尝试失败了。此前下跌趋势线的突破和从K线11的低点开始的大幅反弹都缺乏持续的、大的上涨趋势K线的跟进，市场还没有正式转为做多状态。","p":"p303"},{"t":"有时候，市场会在经历一波加速上涨行情之后出现快速下跌行情，然后多空双方交战，形成一个震荡区间，多头不断尝试突破形成上涨趋势通道，而空头不断尝试向下突破形成下跌趋势通道，他们博奔的结果就是区间震荡。","p":"p304"},{"t":"如图4.2所示，在芝加哥交易市场的1分钟标普500指数期货的1分钟图上，在太平洋标准时间的上午5点半经历了一波向上的行情，但是在K线1形成了一个强大的反转K线。K线1是一根有着3个点位高的K线，在1分钟的K线图上就比较明显。符合下跌反转K线的特征。K线3是第二波上升浪，在接下来可能出现的新的熊市趋势中形成了第二个高点。同样，如果你只看主体的话，K线2是一个内含线的变形（K线2的主体被包含在此前上涨趋势K线1中，这样一个内含线的变异模式意味着双方力量的博奔不相伯仲），而之后趋势上升至K线3其实是内含线形态的假突破。市场持续了10根K线左右的横向盘整，这符合经历了一段趋势下跌后的震荡区间形态的特征。尽管K线4稍微突破了从K线3以来的下跌通道，但之后市场依然延续下跌趋势。K线5是入场做空的二次入场机会，它是突破K线2低点后的一个反弹，是一个失败的小型通道突破尝试。","p":"p305"},{"t":"通常，市场的规则就是，大涨+大跌=混乱三区间震荡，就像图中市场买入高潮之后出现熊市反转K线1，随后至少在一段时间里都是维持震荡状态。","p":"p306"},{"t":"一个大K线上在顶部出现了大阴影就是连续出现了急涨和急跌，并且是在同一根K线上。","p":"p307"}]},{"t":"para","text":"如图4.2所示，在芝加哥交易市场的1分钟标普500指数期货的1分钟图上，在太平洋标准时间的上午5点半经历了一波向上的行情，但是在K线1形成了一个强大的反转K线。K线1是一根有着3个点位高的K线，在1分钟的K线图上就比较明显。符合下跌反转K线的特征。K线3是第二波上升浪，在接下来可能出现的新的熊市趋势中形成了第二个高点。同样，如果你只看主体的话，K线2是一个内含线的变形（K线2的主体被包含在此前上涨趋势K线1中，这样一个内含线的变异模式意味着双方力量的博奔不相伯仲），而之后趋势上升至K线3其实是内含线形态的假突破。市场持续了10根K线左右的横向盘整，这符合经历了一段趋势下跌后的震荡区间形态的特征。尽管K线4稍微突破了从K线3以来的下跌通道，但之后市场依然延续下跌趋势。K线5是入场做空的二次入场机会，它是突破K线2低点后的一个反弹，是一个失败的小型通道突破尝试。","pid":"p305"},{"t":"para","text":"通常，市场的规则就是，大涨+大跌=混乱三区间震荡，就像图中市场买入高潮之后出现熊市反转K线1，随后至少在一段时间里都是维持震荡状态。","pid":"p306"},{"t":"para","text":"一个大K线上在顶部出现了大阴影就是连续出现了急涨和急跌，并且是在同一根K线上。","pid":"p307"},{"t":"img","src":"assets/img/p1c4_003.webp","ctx":[{"t":"通常，市场的规则就是，大涨+大跌=混乱三区间震荡，就像图中市场买入高潮之后出现熊市反转K线1，随后至少在一段时间里都是维持震荡状态。","p":"p306"},{"t":"一个大K线上在顶部出现了大阴影就是连续出现了急涨和急跌，并且是在同一根K线上。","p":"p307"},{"t":"如图4.3所示。有时候趋势通道可以变得非常狭窄，例如图中K线3之后出现的通道。在一个狭窄的趋势通道里有超过10根K线，通常来说这是不可持续的。通道里几乎所有的K线都有着比之前更高的高点。低点和收市价。然而，这样一个不可持续的模式并不足以支持做空，因为有时候市场走势就是会超乎常理，让你的账户没办法等到市场恢复正常。一般来说，市场行情遵循物极必反的常理。一个极端的趋势之后会跟随着一段震荡区间。或者有时候会出现行情大反转，而一个震荡区间持续太久后肯定会有趋势性行情。","p":"p308"},{"t":"这个狭窄的趋势通道几乎是一条倾斜向上的震荡区间，而且它最终也不得不被突破。它在K线5时出现了向上方的一个突破。当突破失败后，它一般会转而向下，而后来的走势也确实如此。市场开始持续了5根K线的横向盘整，然后在K线7处形成了一个更低的高点，完成了K线5的上涨转急跌之后形成的震荡区间（这种先向上后反转向下的走势在5分钟图上不明显，只有在一分钟的K线图上才能看到向下的趋势）。在一个更高的时间周期K线图上，市场从K线1到K线2的下跌打破了此前的上涨趋势线，然后反弹到K线5的走势形成了主要趋势反转的一个更高的高点。","p":"p309"},{"t":"K线9可以被看成是震荡区间的延续，在K线8跌破了上涨趋势线之后，K线9便形成了一个次高点，或者是形成了一个双重顶形态的熊市旗形（它几乎同K线7处于同一水平，并且是第二次冲向K线5的高点的尝试）。这个形态叫什么名字都无关紧要，但是这确实是做空的好时机。在剩下的一天中市场开始震荡下行，并且在下行的时候速度加剧。","p":"p310"},{"t":"K线10形成了一个三根K线的向下的急速下跌走势，并且它下行至K线11形成了趋势通道。昨日的K线图上，K线3是一个加速上涨的K线，随后K线4开始形成趋势通道。窄幅趋势通道开始的起点经常会在1到2天内得到二次试探（例如K线4的低点作为这一窄幅上涨趋势通道的起点，很快被K线5之后出现的下跌趋势所攻破：然而作为下行通道的起点，K线10的高点并没有在随后的2周内得到检测。）","p":"p311"},{"t":"从K线11到K线12的反弹走势差一点就突破了下跌趋势线，但我们可以看到反弹势头很弱。因此，交易者们应该继续寻求做空的机会，而不是寻找趋势反转的做多时机。仅仅只是趋势通道线的突破并不是寻找反转交易的充分条件。突破必须是强有力的，使得市场相信多头有能力扭转趋势。","p":"p312"},{"t":"在购买高潮（有时候在同一根K线中会出现先急涨随后急跌的情况）之后，通常伴随着上涨趋势通道的失败，然后市场将会形成下跌趋势通道。","p":"p313"}]},{"t":"para","text":"如图4.3所示。有时候趋势通道可以变得非常狭窄，例如图中K线3之后出现的通道。在一个狭窄的趋势通道里有超过10根K线，通常来说这是不可持续的。通道里几乎所有的K线都有着比之前更高的高点。低点和收市价。然而，这样一个不可持续的模式并不足以支持做空，因为有时候市场走势就是会超乎常理，让你的账户没办法等到市场恢复正常。一般来说，市场行情遵循物极必反的常理。一个极端的趋势之后会跟随着一段震荡区间。或者有时候会出现行情大反转，而一个震荡区间持续太久后肯定会有趋势性行情。","pid":"p308"},{"t":"para","text":"这个狭窄的趋势通道几乎是一条倾斜向上的震荡区间，而且它最终也不得不被突破。它在K线5时出现了向上方的一个突破。当突破失败后，它一般会转而向下，而后来的走势也确实如此。市场开始持续了5根K线的横向盘整，然后在K线7处形成了一个更低的高点，完成了K线5的上涨转急跌之后形成的震荡区间（这种先向上后反转向下的走势在5分钟图上不明显，只有在一分钟的K线图上才能看到向下的趋势）。在一个更高的时间周期K线图上，市场从K线1到K线2的下跌打破了此前的上涨趋势线，然后反弹到K线5的走势形成了主要趋势反转的一个更高的高点。","pid":"p309"},{"t":"para","text":"K线9可以被看成是震荡区间的延续，在K线8跌破了上涨趋势线之后，K线9便形成了一个次高点，或者是形成了一个双重顶形态的熊市旗形（它几乎同K线7处于同一水平，并且是第二次冲向K线5的高点的尝试）。这个形态叫什么名字都无关紧要，但是这确实是做空的好时机。在剩下的一天中市场开始震荡下行，并且在下行的时候速度加剧。","pid":"p310"},{"t":"para","text":"K线10形成了一个三根K线的向下的急速下跌走势，并且它下行至K线11形成了趋势通道。昨日的K线图上，K线3是一个加速上涨的K线，随后K线4开始形成趋势通道。窄幅趋势通道开始的起点经常会在1到2天内得到二次试探（例如K线4的低点作为这一窄幅上涨趋势通道的起点，很快被K线5之后出现的下跌趋势所攻破：然而作为下行通道的起点，K线10的高点并没有在随后的2周内得到检测。）","pid":"p311"},{"t":"para","text":"从K线11到K线12的反弹走势差一点就突破了下跌趋势线，但我们可以看到反弹势头很弱。因此，交易者们应该继续寻求做空的机会，而不是寻找趋势反转的做多时机。仅仅只是趋势通道线的突破并不是寻找反转交易的充分条件。突破必须是强有力的，使得市场相信多头有能力扭转趋势。","pid":"p312"},{"t":"para","text":"在购买高潮（有时候在同一根K线中会出现先急涨随后急跌的情况）之后，通常伴随着上涨趋势通道的失败，然后市场将会形成下跌趋势通道。","pid":"p313"},{"t":"img","src":"assets/img/p1c4_004.webp","ctx":[{"t":"从K线11到K线12的反弹走势差一点就突破了下跌趋势线，但我们可以看到反弹势头很弱。因此，交易者们应该继续寻求做空的机会，而不是寻找趋势反转的做多时机。仅仅只是趋势通道线的突破并不是寻找反转交易的充分条件。突破必须是强有力的，使得市场相信多头有能力扭转趋势。","p":"p312"},{"t":"在购买高潮（有时候在同一根K线中会出现先急涨随后急跌的情况）之后，通常伴随着上涨趋势通道的失败，然后市场将会形成下跌趋势通道。","p":"p313"},{"t":"在图4.4上两张图表都展示了5分钟SPY的走势。一直到K线2的上升浪潮都是一股很强的牛市浪潮。一波下跌至K线3的急速回调打破了上涨趋势线。之后再次形成一个上涨通道。然而，两浪模式的反弹结构并没有延续，在K线4处形成一个较低的高点。当市场再次回调下跌至K线5时，不仅打破了之前的上涨趋势通道，还突破了主要的牛市趋势线，很明显这并不是形成牛市趋势和通道的一天，市场正在进入区间震荡模式。这一部分的走势形态演变成了一个三角型顶部，随后是加速下跌形成下跌通道。许多交易者认为K线3之前那波回调是重要的牛转熊标志，但也有人认为K线5之前的那波回调更加重要。这两波下跌都是由于空头逐步占领市场带来的卖空压力造成的。","p":"p314"},{"t":"K线8与K线3形成了一个双重底的牛市旗形，这对于移动平均的缺口K线来说是第二次入场做多的时机。一旦多单失败，市场就会明显处于空头优势状态中，从而形成熊市通道，K线5之前那波下跌变成了加速下跌状态。此时此刻，你应该抓住一切做空的机会，任何多单都应该只是短线刮头皮交易，直到市场出现突破下跌趋势通道线的下跌高潮后，行情出现反转时，才会考虑开始做多。通常，在一个类似于这样的强劲的熊市趋势中，最好是忽视任何短线的多单信号，然后跟随下跌趋势做空。K线13就是二个打破三条下跌趋势通道线后反转向上的案例。","p":"p315"},{"t":"连续的高潮通常会导致市场产生较大的调整，但是如果在每一个高潮后面都有一个显著的调整期。那么市场产生较大的调整的概率将会下降。在k线3和K线5之前都有一波卖出高潮，但是紧随其后的上升至K线4和K线7的反弹减轻了卖出的压力，也减少了市场上对于急剧反转向上的需求。然而，在K线7和K线13之间形成的熊市通道中，形成的从K线9到K线10，K线11到K线12中的卖出高潮中，卖盘的压力并没有得到任何的缓解。在下跌到K线13之前的四条熊市趋势K线就代表了非常强劲的卖出高潮，并且显示出了市场上弱势的交易者的失败第三波卖出高潮往往是最剧烈的，并且通常会有一个非常大的加速下跌行情，这个行情的极值通常会打破下跌趋势通道线并且会使得趋势通道呈现出抛物线一般的弯曲形态。抛物线的斜率意味着当市场向下跌的时候，推动市场向下的势力正在加速增长，并且通常在趋势呈抛物线时往往已经到达了趋势的最后阶段。最终，最后处于弱势的做多交易者将会放弃，并且以任意的价格卖出，而较为弱势的做空交易者最终会通过在市场自由跌落的时候做空来加人其他的做空交易者。这就形成了没有任何明显喘息机会的第三次连续的卖出高潮，在这三次的推动之下下跌通道通常会结束。通道狭窄意味着市场上的势力在市场下降的同时正急切地加速。K线13之前的一波崩盘式的下跌打破了下跌趋势通道线，而这也正是很多趋势通道结束的标志。","p":"p316"},{"t":"所以市场上强势的做多交易者和做空交易者会怎么办呢？他们已经看见了这些高潮并且也明白很难再继续。强势的做空交易者已经在更高的点位做空了，从而对在这个点做空不感兴趣。除非有一个非常显著的反弹，并且是接近他们之前做空的位置，例如趋势通道的顶部点位，他们才会重新做空。所以，在这个点强势和弱势的做空交易者都不会做空，而弱势的做多交易者也已经卖出离场，那么市场上卖出的压力得到了释放。强势的做多交易者已经看到了做多的失败，从而开始静观其变。他们知道市场正在下跌，所以除非市场已经低到足够让他们相信不会再跌的底部，否则他们不会有兴趣再度购买。他们想要最好的价格来买入。而这个最好的价格一定是出现在市场的底部。每个机构都有它自己的方法去估算市场的价值和超买超卖情况，当有足够多的机构一致认为市场已经达到了一个很好的价格时，才会有足够的购买的力量使得市场反弹同样，市场上强势的做空交易者也能捕捉到市场的超卖情况，并且及时地获利了结。他们的买入平仓也会为市场的反弹带来贡献。如果市场能够回到在趋势通道开始时的位置，他们将会重新考虑卖出，当然他们已经在更早的时候在这个位置做空并且大赚了一笔。","p":"p317"},{"t":"市场的底部往往会汇集很多重要技术点位，对买盘有着巨大的吸引力。在K线13这里，此前这一浪的下跌刚好超出了从K线1开始的到5根K线的上行浪的幅度。同时K线13已经突破了昨日两个低点连接绘制而成下跌趋势通道线（图中并未显示），同时K线13处的两条K线的反转向上也暗示了这是一个大型的。跨越了两天时间的扩张的三角形的底部形态信号。K线13同样也打破了从K线7开始向下形成的三条小的趋势通道线。","p":"p318"},{"t":"当一个方向的趋势K线紧随着另一个相反方向的趋势K线时，就是一次高潮反转了，因为市场同时出现了上涨和下跌，因此接下来形成的趋势通道可能没有任何明显的方向。","p":"p319"}]},{"t":"para","text":"在图4.4上两张图表都展示了5分钟SPY的走势。一直到K线2的上升浪潮都是一股很强的牛市浪潮。一波下跌至K线3的急速回调打破了上涨趋势线。之后再次形成一个上涨通道。然而，两浪模式的反弹结构并没有延续，在K线4处形成一个较低的高点。当市场再次回调下跌至K线5时，不仅打破了之前的上涨趋势通道，还突破了主要的牛市趋势线，很明显这并不是形成牛市趋势和通道的一天，市场正在进入区间震荡模式。这一部分的走势形态演变成了一个三角型顶部，随后是加速下跌形成下跌通道。许多交易者认为K线3之前那波回调是重要的牛转熊标志，但也有人认为K线5之前的那波回调更加重要。这两波下跌都是由于空头逐步占领市场带来的卖空压力造成的。","pid":"p314"},{"t":"para","text":"K线8与K线3形成了一个双重底的牛市旗形，这对于移动平均的缺口K线来说是第二次入场做多的时机。一旦多单失败，市场就会明显处于空头优势状态中，从而形成熊市通道，K线5之前那波下跌变成了加速下跌状态。此时此刻，你应该抓住一切做空的机会，任何多单都应该只是短线刮头皮交易，直到市场出现突破下跌趋势通道线的下跌高潮后，行情出现反转时，才会考虑开始做多。通常，在一个类似于这样的强劲的熊市趋势中，最好是忽视任何短线的多单信号，然后跟随下跌趋势做空。K线13就是二个打破三条下跌趋势通道线后反转向上的案例。","pid":"p315"},{"t":"para","text":"连续的高潮通常会导致市场产生较大的调整，但是如果在每一个高潮后面都有一个显著的调整期。那么市场产生较大的调整的概率将会下降。在k线3和K线5之前都有一波卖出高潮，但是紧随其后的上升至K线4和K线7的反弹减轻了卖出的压力，也减少了市场上对于急剧反转向上的需求。然而，在K线7和K线13之间形成的熊市通道中，形成的从K线9到K线10，K线11到K线12中的卖出高潮中，卖盘的压力并没有得到任何的缓解。在下跌到K线13之前的四条熊市趋势K线就代表了非常强劲的卖出高潮，并且显示出了市场上弱势的交易者的失败第三波卖出高潮往往是最剧烈的，并且通常会有一个非常大的加速下跌行情，这个行情的极值通常会打破下跌趋势通道线并且会使得趋势通道呈现出抛物线一般的弯曲形态。抛物线的斜率意味着当市场向下跌的时候，推动市场向下的势力正在加速增长，并且通常在趋势呈抛物线时往往已经到达了趋势的最后阶段。最终，最后处于弱势的做多交易者将会放弃，并且以任意的价格卖出，而较为弱势的做空交易者最终会通过在市场自由跌落的时候做空来加人其他的做空交易者。这就形成了没有任何明显喘息机会的第三次连续的卖出高潮，在这三次的推动之下下跌通道通常会结束。通道狭窄意味着市场上的势力在市场下降的同时正急切地加速。K线13之前的一波崩盘式的下跌打破了下跌趋势通道线，而这也正是很多趋势通道结束的标志。","pid":"p316"},{"t":"para","text":"所以市场上强势的做多交易者和做空交易者会怎么办呢？他们已经看见了这些高潮并且也明白很难再继续。强势的做空交易者已经在更高的点位做空了，从而对在这个点做空不感兴趣。除非有一个非常显著的反弹，并且是接近他们之前做空的位置，例如趋势通道的顶部点位，他们才会重新做空。所以，在这个点强势和弱势的做空交易者都不会做空，而弱势的做多交易者也已经卖出离场，那么市场上卖出的压力得到了释放。强势的做多交易者已经看到了做多的失败，从而开始静观其变。他们知道市场正在下跌，所以除非市场已经低到足够让他们相信不会再跌的底部，否则他们不会有兴趣再度购买。他们想要最好的价格来买入。而这个最好的价格一定是出现在市场的底部。每个机构都有它自己的方法去估算市场的价值和超买超卖情况，当有足够多的机构一致认为市场已经达到了一个很好的价格时，才会有足够的购买的力量使得市场反弹同样，市场上强势的做空交易者也能捕捉到市场的超卖情况，并且及时地获利了结。他们的买入平仓也会为市场的反弹带来贡献。如果市场能够回到在趋势通道开始时的位置，他们将会重新考虑卖出，当然他们已经在更早的时候在这个位置做空并且大赚了一笔。","pid":"p317"},{"t":"para","text":"市场的底部往往会汇集很多重要技术点位，对买盘有着巨大的吸引力。在K线13这里，此前这一浪的下跌刚好超出了从K线1开始的到5根K线的上行浪的幅度。同时K线13已经突破了昨日两个低点连接绘制而成下跌趋势通道线（图中并未显示），同时K线13处的两条K线的反转向上也暗示了这是一个大型的。跨越了两天时间的扩张的三角形的底部形态信号。K线13同样也打破了从K线7开始向下形成的三条小的趋势通道线。","pid":"p318"},{"t":"para","text":"当一个方向的趋势K线紧随着另一个相反方向的趋势K线时，就是一次高潮反转了，因为市场同时出现了上涨和下跌，因此接下来形成的趋势通道可能没有任何明显的方向。","pid":"p319"},{"t":"img","src":"assets/img/p1c4_005.webp","ctx":[{"t":"市场的底部往往会汇集很多重要技术点位，对买盘有着巨大的吸引力。在K线13这里，此前这一浪的下跌刚好超出了从K线1开始的到5根K线的上行浪的幅度。同时K线13已经突破了昨日两个低点连接绘制而成下跌趋势通道线（图中并未显示），同时K线13处的两条K线的反转向上也暗示了这是一个大型的。跨越了两天时间的扩张的三角形的底部形态信号。K线13同样也打破了从K线7开始向下形成的三条小的趋势通道线。","p":"p318"},{"t":"当一个方向的趋势K线紧随着另一个相反方向的趋势K线时，就是一次高潮反转了，因为市场同时出现了上涨和下跌，因此接下来形成的趋势通道可能没有任何明显的方向。","p":"p319"},{"t":"在图4.5中，5分钟K线的AAPL图上有着很多的高潮和反转。","p":"p320"},{"t":"K线3是一根非常大的熊市趋势K线，因此是一个加速下跌的行情，也是一个熊市中的突破，也是一个高潮点。在它之后马上紧跟着一根相反方向的更大的趋势K线，这是一个加速上涨的高潮。这一行情可能会诱多交易者，但是你需要有耐心，让市场告诉你它的走势。你要做的是，跟随着机构投资者而不是去猜测他们可能会采取什么行动。","p":"p321"},{"t":"K线5之前的这波反弹是一个从K线3低点起来的一个突破创新高行情，同时也是在K线4的牛市突破行情之后的一个休整。K线6是另一个加速下跌行情的低点，也代表着市场的一次卖出高潮。在K线6之后形成的紧密的震荡区间是从K线4的牛市突破后形成的回调，同时也可能是在K线3的下行突破和K线6的卖出高潮之后形成的熊市通道的开始点。在K线6之后的震荡区间上，做多交易者正在通过做多试图形成一个牛市通道，而做空交易者正在做空试图形成熊市通道。最终做空交易者胜利了。即使K线4的购买高潮相比较与K线3和K线6的卖出高潮而言，是一条更大和更强的趋势K线，但做空交易者依然有能力战胜了做多交易者。","p":"p322"},{"t":"K线15是一根牛市反转K线，因为它有着相当大的范围和主体，因此它是一个购买的高潮。它之前紧随着一根巨大的熊市K线，这是一个卖出的高潮。但是因为此前的下跌趋势通道已经变得非常陡峭了，并显示了空头的强势，所以第一次尝试反转向上的突破很可能会失败，在一个强势的趋势中不论是否会出现小的反转K线，这些K线都很可能会变成趋势延续的旗形形态。在图上，在K线15之后出现的两根反弹K线非常小，体现出多头的弱势，并且这个反弹最终也变成了熊市旗形的标志。","p":"p323"},{"t":"所有的两条K线的反转都代表同时出现相反方向的高潮，即使他们的级别都非常小。K线17是一个非常小的熊市高潮，紧随其后的是一个牛市趋势K线，这两条K线形成了一个两条K线的反转。加速下跌就是卖出高潮，而加速上涨就是牛市突破。这个向上的突破持续了3条K线。K线19是一个熊市加速下跌，也是一个卖出高潮和熊市旗形的突破，同时也是市场将回归移动平均线的一个回调。不过，此后出现的K线20的买入高潮，对这个回调进行了反转。K线29对从K线23到K线25的加速上涨行情或K线24和25的一段行情进行了反转，并在卖出高潮之后紧随着一些十字星K线，以及收盘前的大跌行情。熊市趋势通道在第二天就结束了。","p":"p324"},{"t":"K线31是在K线32的卖出高潮之前形成的购买高潮，它在下一根K线处反转了。K线33是另外一根大牛市趋势K线，因此也是一个购买高潮，同时它也是突破至之前形成的缺口区域。在它之后也紧随着一个四条K线的回调，其中还包括了一条熊市突破线，在这之后反弹的延续带来了牛市通道的形成。","p":"p325"},{"t":"持续至K线18的反弹向上打破了之前从K线5至K线17形成的熊市通道，但是止步于移动平均线一带。市场在K线20处形成的双重顶部开始下滑，但是在K线22的低点处重新找到了买方，而市场在这里形成了一个双重底部的牛市旗形。这个双重底部中更高的低点是否会开启主要趋势的反转呢？现实并没有如此理想，虽然在K线20之前的有两波反弹浪潮在熊市趋势线之上，但是它并不能持续地超过移动平均线，因此也不够强烈。从K线22的双重底部到K线28的两波反弹浪潮却意外地很强烈，但是许多交易者把它视为熊市趋势线中第一次反弹，因此很大的可能它仅仅只是一次反弹而非一个新的牛市通道。虽然它已经足够强烈，但是交易者依然会在市场测试熊市的底部时购买。交易者会在牛市K线之上购买，即在K线32卖出高潮之后的另一日的开盘时买入，然后再次在两根K线之后形成的第二次牛市信号之上购买。市场形成了第二次的信号（在K线32之后的K线与K线32这根大的牛市K线一起形成了一个微小的双重底部），因此这次的信号将更加可信。最后的结果就是从更低的低点处形成的主要趋势反转打破了之前的强烈的熊市通道线（市场反弹至K线28处）。因为它是通过许多的K线呈现出来的，所以这个模式可能在更高的时间趋势图上会个更容易被发现。","p":"p326"},{"t":"V型底部和倒转的V型顶部在产生一个显著的回调之前就反转市场的情况是非常罕见的。大部分的顶点都不会马上令市场出现反转，而且原来的趋势的峰值也往往会得到第二次测试。","p":"p327"}]},{"t":"para","text":"在图4.5中，5分钟K线的AAPL图上有着很多的高潮和反转。","pid":"p320"},{"t":"para","text":"K线3是一根非常大的熊市趋势K线，因此是一个加速下跌的行情，也是一个熊市中的突破，也是一个高潮点。在它之后马上紧跟着一根相反方向的更大的趋势K线，这是一个加速上涨的高潮。这一行情可能会诱多交易者，但是你需要有耐心，让市场告诉你它的走势。你要做的是，跟随着机构投资者而不是去猜测他们可能会采取什么行动。","pid":"p321"},{"t":"para","text":"K线5之前的这波反弹是一个从K线3低点起来的一个突破创新高行情，同时也是在K线4的牛市突破行情之后的一个休整。K线6是另一个加速下跌行情的低点，也代表着市场的一次卖出高潮。在K线6之后形成的紧密的震荡区间是从K线4的牛市突破后形成的回调，同时也可能是在K线3的下行突破和K线6的卖出高潮之后形成的熊市通道的开始点。在K线6之后的震荡区间上，做多交易者正在通过做多试图形成一个牛市通道，而做空交易者正在做空试图形成熊市通道。最终做空交易者胜利了。即使K线4的购买高潮相比较与K线3和K线6的卖出高潮而言，是一条更大和更强的趋势K线，但做空交易者依然有能力战胜了做多交易者。","pid":"p322"},{"t":"para","text":"K线15是一根牛市反转K线，因为它有着相当大的范围和主体，因此它是一个购买的高潮。它之前紧随着一根巨大的熊市K线，这是一个卖出的高潮。但是因为此前的下跌趋势通道已经变得非常陡峭了，并显示了空头的强势，所以第一次尝试反转向上的突破很可能会失败，在一个强势的趋势中不论是否会出现小的反转K线，这些K线都很可能会变成趋势延续的旗形形态。在图上，在K线15之后出现的两根反弹K线非常小，体现出多头的弱势，并且这个反弹最终也变成了熊市旗形的标志。","pid":"p323"},{"t":"para","text":"所有的两条K线的反转都代表同时出现相反方向的高潮，即使他们的级别都非常小。K线17是一个非常小的熊市高潮，紧随其后的是一个牛市趋势K线，这两条K线形成了一个两条K线的反转。加速下跌就是卖出高潮，而加速上涨就是牛市突破。这个向上的突破持续了3条K线。K线19是一个熊市加速下跌，也是一个卖出高潮和熊市旗形的突破，同时也是市场将回归移动平均线的一个回调。不过，此后出现的K线20的买入高潮，对这个回调进行了反转。K线29对从K线23到K线25的加速上涨行情或K线24和25的一段行情进行了反转，并在卖出高潮之后紧随着一些十字星K线，以及收盘前的大跌行情。熊市趋势通道在第二天就结束了。","pid":"p324"},{"t":"para","text":"K线31是在K线32的卖出高潮之前形成的购买高潮，它在下一根K线处反转了。K线33是另外一根大牛市趋势K线，因此也是一个购买高潮，同时它也是突破至之前形成的缺口区域。在它之后也紧随着一个四条K线的回调，其中还包括了一条熊市突破线，在这之后反弹的延续带来了牛市通道的形成。","pid":
