1的更高的高点。如果你仅仅只是退出你的做空头寸，而不是转而做多，那么你会得到2.40美元的净盈利。当市场在K线8处开始上升时，许多交易者认为市场上始终在场策略的方向开始做多了，而更多的交易者确信紧随其后会出现一根牛市趋势K线。在K线7之前的牛市上升浪就是买入压力出现的信号，同时在这个市场第二次尝试反转向上的时点。使得做多交易者对于做多更为自信了。","pid":"p814"},{"t":"para","text":"当市场上需要再多一根K线来转变始终在场策略的方向时，交易者通常会忽略市场的移动，并且希望那根K线不会出现。举个例子，如果K线5是一根强劲的牛市趋势K线，那么许多交易者会将他们的始终在场策略的方向由做空转向做多（在K线3开始出现了5根下跌K线后，许多交易者认为市场上的始终在场策略的方向已经转为做空了）。因为他们知道大部分反转市场方向的尝试都会失败，他们会在K线5之前的那根牛市趋势K线的收盘处卖空，并且期待K线5不会变成一根强劲的牛市K线，然后熊市趋势会复苏。","pid":"p815"},{"t":"para","text":"当交易者对接下来的几根K线的方向非常确信时，那么就有很大的机会进行交易。","pid":"p816"},{"t":"img","src":"assets/img/p2c5_005.webp","ctx":[{"t":"当市场上需要再多一根K线来转变始终在场策略的方向时，交易者通常会忽略市场的移动，并且希望那根K线不会出现。举个例子，如果K线5是一根强劲的牛市趋势K线，那么许多交易者会将他们的始终在场策略的方向由做空转向做多（在K线3开始出现了5根下跌K线后，许多交易者认为市场上的始终在场策略的方向已经转为做空了）。因为他们知道大部分反转市场方向的尝试都会失败，他们会在K线5之前的那根牛市趋势K线的收盘处卖空，并且期待K线5不会变成一根强劲的牛市K线，然后熊市趋势会复苏。","p":"p815"},{"t":"当交易者对接下来的几根K线的方向非常确信时，那么就有很大的机会进行交易。","p":"p816"},{"t":"图15.5中的每一个灰色的矩形格子都是交易者相信市场会出现后续的跟进力量的地方。箱体中的小段水平线是大部分交易者相信市场会出现后续跟进力量的价位，虽然大部分的交易者其实在更早的时段就已经确定了。当趋势非常强劲时，如K线14出现的卖空潮，当交易者重新需要建立信心时通常会出现几波连续的突破。","p":"p817"},{"t":"许多交易者严格执行始终在场策略，整体都待在市场上做多或者做空，大部分交易者会通过执行这些策略获利，一旦他们认为市场已经没有方向时，他们就会退出市场。交易者通常会当市场上出现了相反方向的信号时离开交易，即使这个信号并不足以使得他们反转交易方向。请记住，对于交易者来说让他们信服市场可以停止做多比让他们开始做空要简单。在K线1的收盘处或在K线1的高点的一个价位上方买入的做多交易者关注到了K线3这根强劲的熊市反转K线，一般来说开盘反转会有较为持久的跟进力量。单独一根K线3还不足以使得交易者认为市场上的始终在场策略的方向已经转为做空了，但是许多交易者已经开始离开他们的做多头寸，或者在K线4这个微型的熊市旗形中出现的更低的高点下方开始做空。还有一些交易者会离开他们的做多头寸，在K线5这个第二次突破回调的下方做空。","p":"p818"},{"t":"在熊市K线向下突破K线5，或者在它的低点下方一个价位处，或在K线6的收盘处，许多交易者认为市场还是处于始终在场策略的做空方向。","p":"p819"},{"t":"对于做空交易者来说他们也很关注K线7，因为这是在一天中的新低点，且之后发生了强劲的向上反转，因为这是另外一个开盘反转，所以K线7很可能是一天中的低点。在K线3处有一波两根K线的下跌浪，而K线7很可能是在一个潜在的楔形通道中的第三波下跌浪，而在K线3之后的K线是第一波下跌浪，K线6是第二波下跌浪。许多做空交易者会在K线7的上方离开市场，而大部分会在K线8这个更高的低点上方离开市场。K线7突破了从K线5开始形成的微型通道的上方，而K线8则是突破回调买入信号。许多交易者认为市场会在K线8的上方进入始终在场策略的做多方向，但是大部分交易者认为市场会在K线10这个牛市i模式的上方转变方向，而在此处也是一个失败的低点2的卖空时机。他们认为熊市旗形已经失败了，所以市场将会上升一段相当于K线7至K线9这个熊市旗形的等距离的高度。","p":"p820"},{"t":"从K线14市场开始急速下跌，除此之外，还有几个区域交易者也重新确认了市场会继续下跌的信心，比如说在K线18的收盘处，随后出现的内含K线的一个点位的下方，或者低于K线18的低点的一个点位处。即使在K线18的后面那根内含K线有一个牛市主体，交易者依然认为市场的趋势还是向下，并且这根K线看起来像是一个低点1的卖空时机。在K线21和24同样出现了这种情况。所以对于交易者来说目前最好就是采用做空的交易方式，即使下跌的概率看起来只有50%。实际上，概率是要大于60%，但是交易者通常比较胆小且谨慎，所以我们认为市场等距离下跌的概率只有50%。这给了他们一个看似合理但却不正确的理由去拒绝交易。他们应该以不太在意的头寸去进行做空，然后用适当的保护性止损头寸，比如说在大部分的最近的强劲的熊市趋势K线的高点上方设置止损位，然后在市场回调时也保持持有，直到市场上出现了明显的买入信号，比如说在K线25处出现的更低的低点的主要趋势的反转买入。如果风险头寸是正常情况下的四倍，那么交易量就不要超过正常交易量的四分之一。如果他们还是很害怕，那么就只交易10%的正常头寸。当机构交易者非常激进地做空时，你也应该做空，因为最强大的交易者往往会影响到趋势的走势。","p":"p821"}]},{"t":"para","text":"图15.5中的每一个灰色的矩形格子都是交易者相信市场会出现后续的跟进力量的地方。箱体中的小段水平线是大部分交易者相信市场会出现后续跟进力量的价位，虽然大部分的交易者其实在更早的时段就已经确定了。当趋势非常强劲时，如K线14出现的卖空潮，当交易者重新需要建立信心时通常会出现几波连续的突破。","pid":"p817"},{"t":"para","text":"许多交易者严格执行始终在场策略，整体都待在市场上做多或者做空，大部分交易者会通过执行这些策略获利，一旦他们认为市场已经没有方向时，他们就会退出市场。交易者通常会当市场上出现了相反方向的信号时离开交易，即使这个信号并不足以使得他们反转交易方向。请记住，对于交易者来说让他们信服市场可以停止做多比让他们开始做空要简单。在K线1的收盘处或在K线1的高点的一个价位上方买入的做多交易者关注到了K线3这根强劲的熊市反转K线，一般来说开盘反转会有较为持久的跟进力量。单独一根K线3还不足以使得交易者认为市场上的始终在场策略的方向已经转为做空了，但是许多交易者已经开始离开他们的做多头寸，或者在K线4这个微型的熊市旗形中出现的更低的高点下方开始做空。还有一些交易者会离开他们的做多头寸，在K线5这个第二次突破回调的下方做空。","pid":"p818"},{"t":"para","text":"在熊市K线向下突破K线5，或者在它的低点下方一个价位处，或在K线6的收盘处，许多交易者认为市场还是处于始终在场策略的做空方向。","pid":"p819"},{"t":"para","text":"对于做空交易者来说他们也很关注K线7，因为这是在一天中的新低点，且之后发生了强劲的向上反转，因为这是另外一个开盘反转，所以K线7很可能是一天中的低点。在K线3处有一波两根K线的下跌浪，而K线7很可能是在一个潜在的楔形通道中的第三波下跌浪，而在K线3之后的K线是第一波下跌浪，K线6是第二波下跌浪。许多做空交易者会在K线7的上方离开市场，而大部分会在K线8这个更高的低点上方离开市场。K线7突破了从K线5开始形成的微型通道的上方，而K线8则是突破回调买入信号。许多交易者认为市场会在K线8的上方进入始终在场策略的做多方向，但是大部分交易者认为市场会在K线10这个牛市i模式的上方转变方向，而在此处也是一个失败的低点2的卖空时机。他们认为熊市旗形已经失败了，所以市场将会上升一段相当于K线7至K线9这个熊市旗形的等距离的高度。","pid":"p820"},{"t":"para","text":"从K线14市场开始急速下跌，除此之外，还有几个区域交易者也重新确认了市场会继续下跌的信心，比如说在K线18的收盘处，随后出现的内含K线的一个点位的下方，或者低于K线18的低点的一个点位处。即使在K线18的后面那根内含K线有一个牛市主体，交易者依然认为市场的趋势还是向下，并且这根K线看起来像是一个低点1的卖空时机。在K线21和24同样出现了这种情况。所以对于交易者来说目前最好就是采用做空的交易方式，即使下跌的概率看起来只有50%。实际上，概率是要大于60%，但是交易者通常比较胆小且谨慎，所以我们认为市场等距离下跌的概率只有50%。这给了他们一个看似合理但却不正确的理由去拒绝交易。他们应该以不太在意的头寸去进行做空，然后用适当的保护性止损头寸，比如说在大部分的最近的强劲的熊市趋势K线的高点上方设置止损位，然后在市场回调时也保持持有，直到市场上出现了明显的买入信号，比如说在K线25处出现的更低的低点的主要趋势的反转买入。如果风险头寸是正常情况下的四倍，那么交易量就不要超过正常交易量的四分之一。如果他们还是很害怕，那么就只交易10%的正常头寸。当机构交易者非常激进地做空时，你也应该做空，因为最强大的交易者往往会影响到趋势的走势。","pid":"p821"},{"t":"img","src":"assets/img/p2c5_006.webp","ctx":[{"t":"对于做空交易者来说他们也很关注K线7，因为这是在一天中的新低点，且之后发生了强劲的向上反转，因为这是另外一个开盘反转，所以K线7很可能是一天中的低点。在K线3处有一波两根K线的下跌浪，而K线7很可能是在一个潜在的楔形通道中的第三波下跌浪，而在K线3之后的K线是第一波下跌浪，K线6是第二波下跌浪。许多做空交易者会在K线7的上方离开市场，而大部分会在K线8这个更高的低点上方离开市场。K线7突破了从K线5开始形成的微型通道的上方，而K线8则是突破回调买入信号。许多交易者认为市场会在K线8的上方进入始终在场策略的做多方向，但是大部分交易者认为市场会在K线10这个牛市i模式的上方转变方向，而在此处也是一个失败的低点2的卖空时机。他们认为熊市旗形已经失败了，所以市场将会上升一段相当于K线7至K线9这个熊市旗形的等距离的高度。","p":"p820"},{"t":"从K线14市场开始急速下跌，除此之外，还有几个区域交易者也重新确认了市场会继续下跌的信心，比如说在K线18的收盘处，随后出现的内含K线的一个点位的下方，或者低于K线18的低点的一个点位处。即使在K线18的后面那根内含K线有一个牛市主体，交易者依然认为市场的趋势还是向下，并且这根K线看起来像是一个低点1的卖空时机。在K线21和24同样出现了这种情况。所以对于交易者来说目前最好就是采用做空的交易方式，即使下跌的概率看起来只有50%。实际上，概率是要大于60%，但是交易者通常比较胆小且谨慎，所以我们认为市场等距离下跌的概率只有50%。这给了他们一个看似合理但却不正确的理由去拒绝交易。他们应该以不太在意的头寸去进行做空，然后用适当的保护性止损头寸，比如说在大部分的最近的强劲的熊市趋势K线的高点上方设置止损位，然后在市场回调时也保持持有，直到市场上出现了明显的买入信号，比如说在K线25处出现的更低的低点的主要趋势的反转买入。如果风险头寸是正常情况下的四倍，那么交易量就不要超过正常交易量的四分之一。如果他们还是很害怕，那么就只交易10%的正常头寸。当机构交易者非常激进地做空时，你也应该做空，因为最强大的交易者往往会影响到趋势的走势。","p":"p821"},{"t":"如图15.6所示，在有一些区域中交易者对于接下来的几根K线的走势非常确信，所以他们可以合理地确定始终在场策略的方向。激进的交易者会早点入场，然后进行更多的反转交易，但是在图中标识的区域是大部分的交易者能够确认始终在场策略方向的区域在K线14的收盘处买入或者在紧随其后出现的十字星K线的高点1的上方买入的交易者都会关注到在K线16的更高的高点处出现的第二次卖空入场通道。这也是K线14后出现的趋势通道的潜在的顶部，同时也是自K线7至K线12出现的潜在的最后旗形后，从K线11至K线16形成的上升浪可能会带来一个更高的高点。大部分做多交易者会在K线16的下方离开市场，而更为激进的交易者将会做空，因为他们认为这是一个可靠的反转始终在场策略的方向的时机。一些更为保守的交易者一般一天只寻找三到五次的反转时机，所以他们会等到市场上出现了K线19和K线20这种强劲的熊市收盘时才开始认为市场已经转变成始终做空的方向。","p":"p822"},{"t":"当交易者已经比较确信时。他们一般已经有60%的把握了。如果他们承担了两个点位的风险，那么他们至少需要获利两个点位才能满足他们的盈亏平衡等式。这意味着他们可以在这些区域的附近寻找入场时机，二且他们进入了市场，就要设置一个价位出场。他们的止损订单可以设置在他们的入场价位的两个点位之外，而他们的盈利限价订单也可以是两个点位之外。如果市场在触及他们的盈利目标后反转，正如在K线7的收盘处出现了反弹，那么他们就可以收紧他们的止损位。在这种情况下，他们可以在盈亏平衡点附近的2根K线的反转下方离开市场。有一些交易者并不会调整他们的止损位，而是会一直持有他们的头寸直到这个止损位已经失效了，他们会任市场回调而不再采取措施。还有一些交易者会将盈利目标调整为3或4个点位，当他们认为市场的信号已经足够强劲的时候，他们会采取措施，比如说在K线5或者K线6的收盘处买入，在K线13的突破回调的上方买入（从K线9至K线11的高点2形成了牛市旗形），在K线16这个微型楔形顶部的下方卖空，在K线20的收盘处卖空，或者在K线22和K线23处的微型低点2形成的突破回调下方卖出，或者在K线26的突破回调的上方买入。一些交易者会把这些信号看成是非常强劲的入场时机，因此有70%的概率会到达两个价位的盈利目标，在市场触及两个价位的止损目标之前。在市场触及两个价位的止损目标之后他们还是会继续设置两个点位的盈利目标，因为他们知道市场上获利的概率还很大。","p":"p823"},{"t":"由于大部分的交易者认为市场在K线6之前是处于始终在场策略的做多方向，所以他们期待市场上的反转尝试都会失败。于是他们会在一些强劲的下跌趋势K线的收盘附近买入：就像K线6后的第四根下跌K线，和K线7前两根K线出现的测试了移动平均线的K线。","p":"p824"}]},{"t":"para","text":"如图15.6所示，在有一些区域中交易者对于接下来的几根K线的走势非常确信，所以他们可以合理地确定始终在场策略的方向。激进的交易者会早点入场，然后进行更多的反转交易，但是在图中标识的区域是大部分的交易者能够确认始终在场策略方向的区域在K线14的收盘处买入或者在紧随其后出现的十字星K线的高点1的上方买入的交易者都会关注到在K线16的更高的高点处出现的第二次卖空入场通道。这也是K线14后出现的趋势通道的潜在的顶部，同时也是自K线7至K线12出现的潜在的最后旗形后，从K线11至K线16形成的上升浪可能会带来一个更高的高点。大部分做多交易者会在K线16的下方离开市场，而更为激进的交易者将会做空，因为他们认为这是一个可靠的反转始终在场策略的方向的时机。一些更为保守的交易者一般一天只寻找三到五次的反转时机，所以他们会等到市场上出现了K线19和K线20这种强劲的熊市收盘时才开始认为市场已经转变成始终做空的方向。","pid":"p822"},{"t":"para","text":"当交易者已经比较确信时。他们一般已经有60%的把握了。如果他们承担了两个点位的风险，那么他们至少需要获利两个点位才能满足他们的盈亏平衡等式。这意味着他们可以在这些区域的附近寻找入场时机，二且他们进入了市场，就要设置一个价位出场。他们的止损订单可以设置在他们的入场价位的两个点位之外，而他们的盈利限价订单也可以是两个点位之外。如果市场在触及他们的盈利目标后反转，正如在K线7的收盘处出现了反弹，那么他们就可以收紧他们的止损位。在这种情况下，他们可以在盈亏平衡点附近的2根K线的反转下方离开市场。有一些交易者并不会调整他们的止损位，而是会一直持有他们的头寸直到这个止损位已经失效了，他们会任市场回调而不再采取措施。还有一些交易者会将盈利目标调整为3或4个点位，当他们认为市场的信号已经足够强劲的时候，他们会采取措施，比如说在K线5或者K线6的收盘处买入，在K线13的突破回调的上方买入（从K线9至K线11的高点2形成了牛市旗形），在K线16这个微型楔形顶部的下方卖空，在K线20的收盘处卖空，或者在K线22和K线23处的微型低点2形成的突破回调下方卖出，或者在K线26的突破回调的上方买入。一些交易者会把这些信号看成是非常强劲的入场时机，因此有70%的概率会到达两个价位的盈利目标，在市场触及两个价位的止损目标之前。在市场触及两个价位的止损目标之后他们还是会继续设置两个点位的盈利目标，因为他们知道市场上获利的概率还很大。","pid":"p823"},{"t":"para","text":"由于大部分的交易者认为市场在K线6之前是处于始终在场策略的做多方向，所以他们期待市场上的反转尝试都会失败。于是他们会在一些强劲的下跌趋势K线的收盘附近买入：就像K线6后的第四根下跌K线，和K线7前两根K线出现的测试了移动平均线的K线。","pid":"p824"}],"wcount":21585},{"id":"p2c6","title":"第16章　极限高频交易","blocks":[{"t":"para","text":"第16章　极限高频交易","pid":"p825"},{"t":"para","text":"高频交易公司一天内可以在4000只股票中进行上千万次交易，而且他们在每一次刮头皮交易都只赚取1分钱的利益。刮头皮交易的形式可以非常极限，但如果你没有在交易所里或旁边机房放置一堆超级计算机，那么你就别想做类似的交易。我有一个朋友是在标普500期货合约市场进行极限刮头皮交易的，一般每天要进行25次交易，并且每一次交易会获得大约两个价位的盈利。我从来都没办法知道他是否用了保护性止损位或者他被允许使用多大的亏损额度。他也从来都不会清楚地告诉我关于他刮头皮交易的事情。有一些交易者很抵触让他们说太多关于他们进行的刮头皮交易的事情。我不太确定，他们这样的原因是否是因为他们有一种不切实际的恐惧，如果他们说得太多，那么其他人就会复制他们的策略，所以他们的系统将不会再有效，或者他们觉得说太多会比较尴尬，因为他们一天交易了那么多次，获得的利润却非常少。然而，他还是有告诉我他每一次交易都会交易100份合约。而我们一位共同的好友告诉我，他已经住进了他那所价值200万美元的房子，我相信他每年至少会赚100万美元。","pid":"p826"},{"t":"para","text":"虽然我相信对于一小部分人来说，他们有这样的天赋去做这样的事情，但是对大部分的交易者来说，这还是很难做到的，所以对于大部分人而言还是不要去尝试这样的交易。通常来说，因为刮头皮交易承担的风险要大于获得的回报，所以只有当盈利的可能性大于70%的时候才有可能盈利。但是对于大部分的交易者来说获得这样的盈利概率是不现实的，即使是对于非常成功的交易者来说也是不现实的。然而，还是有许多人可以通过刮头皮交易为生。然而，对于大部分的交易者而言，应该当回报等于风险的时候才采取交易，因为获得至少60%的盈利概率更现实。更好的是，交易者应该关注那些回报至少是风险的两倍的交易，因为在这种情况下即使他们只能在一半的时间内获利，他们也可以获得利润。","pid":"p827"},{"t":"para","text":"即使交易者应该专注于波段交易，他们也应该惊地发现在5分钟的K线图上出现的刮头皮交易时机要远远多于他们的想象。然而，就算这些时机的确存在，这也并不是他们应该采取这个交易的充足的理由。实际上，在5分钟的K线图上平均一天会出现30至40次刮头皮交易的时机，但是大家都不应该采取行动，因为通过这种方式能够准确地阅读图表并且快速进行交易盈利对于大部分交易者来说都太难了。大约三分之一的入场时机要用来设置止损位，大约三分之二的入场时机要用来设置限价订单。对于所有的市场以及所有的时间图表来说都是如此，大约二分之一的K线是有合理的刮头皮交易时机的。举一个极限刮头皮交易的例子可以演示出在你面前一天能有多少微妙的价格行动信息，这有可能会提高你的注意力。一些交易者可能一天只能做到一到两个小时，但是大部分时间应该寻找两个点位至四个点位的波段交易时机。","pid":"p828"},{"t":"para","text":"许多时候，刮头皮交易者只要能够正确的控制好他们的交易，就可以通过在当前的价格买入或者卖出获利。当然对于所有的交易来说都是这样，而初学者则可能会觉得很惊诉。举个例子，如果在标普500期货合约的牛市趋势中有一根非常强劲的牛市趋势K线，那么市场上就很可能会出现后续的跟进力量，交易者可以在这根K线的收盘处买入，同时承担三个点位的风险，并充许市场会出现可能的回调。如果市场如他所料，达到了他的目标，他们就可以离开市场获利。如果市场回调了5至10根K线，但却没有触及他们的止损位，他们可以等待市场回调结束直到趋势复苏，然后在他们一开始设置的盈利价位处获利。许多有经验的交易者会在市场回调或者在牛市旗形的突破处采取刮头皮交易，而有一些交易者则会一直持有他们的头寸直到市场触及了他们一开始的盈利目标，正好获利。其他人则会选择在一开始的入场价位离开，从而盈亏平衡，然后在之后的入场价位盈利。","pid":"p829"},{"t":"para","text":"做空交易者可以以做多交易者买入的相同价格做空，并且期待大盘会出现疲软。一旦市场在接下来的几根K线处出现卖空潮，那么做空交易者就可以获利离场。如果正好相反，市场在接下来的一两根K线处走高，那么他们将会进行刮头皮交易并且卖出更多，可能承担的风险与那根强劲的牛市趋势K线的高度差不多。举个例子，如果这根牛市趋势K线有12个点位的高度，他们可能会将他们的卖空点位增加4至8个点的高度，相对于他们的入场价位来说，他们整个头寸承担了12个点位的风险。如果市场在他们进行刮头皮交易后下跌，他们可以在最初的盈利目标或者最初的入场价位处离场。如果他们在最初的入场价位处离场。他们可以在之后的入场中获得利润，同时在第一个入场价位处获得盈亏平衡。不论是做多还是做空的刮头皮交易者都可以通过在同一时间入场获得刮头皮交易的盈利，但是却采用的是不同的方向。盈利的关键在于资金管理。","pid":"p830"},{"t":"img","src":"assets/img/p2c6_001.webp","ctx":[{"t":"许多时候，刮头皮交易者只要能够正确的控制好他们的交易，就可以通过在当前的价格买入或者卖出获利。当然对于所有的交易来说都是这样，而初学者则可能会觉得很惊诉。举个例子，如果在标普500期货合约的牛市趋势中有一根非常强劲的牛市趋势K线，那么市场上就很可能会出现后续的跟进力量，交易者可以在这根K线的收盘处买入，同时承担三个点位的风险，并充许市场会出现可能的回调。如果市场如他所料，达到了他的目标，他们就可以离开市场获利。如果市场回调了5至10根K线，但却没有触及他们的止损位，他们可以等待市场回调结束直到趋势复苏，然后在他们一开始设置的盈利价位处获利。许多有经验的交易者会在市场回调或者在牛市旗形的突破处采取刮头皮交易，而有一些交易者则会一直持有他们的头寸直到市场触及了他们一开始的盈利目标，正好获利。其他人则会选择在一开始的入场价位离开，从而盈亏平衡，然后在之后的入场价位盈利。","p":"p829"},{"t":"做空交易者可以以做多交易者买入的相同价格做空，并且期待大盘会出现疲软。一旦市场在接下来的几根K线处出现卖空潮，那么做空交易者就可以获利离场。如果正好相反，市场在接下来的一两根K线处走高，那么他们将会进行刮头皮交易并且卖出更多，可能承担的风险与那根强劲的牛市趋势K线的高度差不多。举个例子，如果这根牛市趋势K线有12个点位的高度，他们可能会将他们的卖空点位增加4至8个点的高度，相对于他们的入场价位来说，他们整个头寸承担了12个点位的风险。如果市场在他们进行刮头皮交易后下跌，他们可以在最初的盈利目标或者最初的入场价位处离场。如果他们在最初的入场价位处离场。他们可以在之后的入场中获得利润，同时在第一个入场价位处获得盈亏平衡。不论是做多还是做空的刮头皮交易者都可以通过在同一时间入场获得刮头皮交易的盈利，但是却采用的是不同的方向。盈利的关键在于资金管理。","p":"p830"},{"t":"在图16.1中5分钟的标普500期货合约交易图表中显示了极限刮头皮交易。在这一天中有81根K线，每三根K线为一组，第三根K线都在图中标志了出来。如果一个交易者希望用一两个点位的止损位来进行一个点位的刮头皮交易，那么在一天中有40次机会来进行这样的交易。记","p":"p831"},{"t":"头皮交易利润，就需要市场在信号K线上移动6个点位。","p":"p832"},{"t":"K线1是一根牛市反转K线，同时也是一个从昨天的收盘就开始低于熊市旗形的潜在的失败的突破。然而，在K线1的顶部有一两个点位的突破，同时它的高点低于昨天的收盘价和移动平均线4个点位，所以并没有足够的空间进行买入刮头皮交易。在K线1的上方买入的交易者在入场K线上看到了一个较弱的收盘，所以他们很可能会在盈亏平衡点附近退出市场。","p":"p833"},{"t":"K线2是一个十字星，所以它收盘时没有超过K线1。这恰恰是做多交易者力量减弱，做空交易者力量加强的信号。这种一根K线的反弹很可能会演变为突破回调。而且它之后很可能会跟随另外一波下跌浪。交易者可以在K线2的下方一个点位处设置卖空订单。","p":"p834"},{"t":"K线3不能满足所有的卖空订单，但是它有一个熊市收盘，同时这根K线没有超越K线2。所以它与K线2一起形成了一个双重顶部，且正好处于移动平均线的下方，所以可能会带来一波下跌浪。一个交易者可以在这根K线的收盘处做空。然后在这根K线的高点上方退出市场或者转而做多，也可以在这根K线的低点下方一个点位处的卖空止损位做空。在K线2这根做多入场的做多交易者也应该在下方一个点位处做空。许多做多交易者更可能采取的措施是在这个位置离开市场（在入场K线的下方），从而加剧了市场的下跌。所以如果这个点位被触发了，则可能会带来一波突破回调，从而导致波动下跌。交易者可以在1到2个点位上进行刮头皮交易，或者在整个区间进行波段交易（他们可以获得6个价位的净盈利），或者在部分区间（也许是一半）采取刮头皮交易，在部分区间采取波段交易，他们希望在采取波段交易的部分获利3至4个点位。","p":"p835"},{"t":"K线4这根入场K线是一根强劲的做空趋势K线，它很有可能会形成一天的低点。市场企图超越K线1但是却失败了，所以现在试图突破K线1的低点。因为市场还处于移动平均线的下方，同时相对于昨天的熊市旗形它属于跳空下跌开盘，这意味着做空交易者非常强劲，市场很可能会向下移动一段可测量的距离。K线2很可能会成为一天中的高点，这一天很可能会变成一个强劲的熊市交易日。因为熊市趋势非常强劲所以交易者可以在K线2这根做多入场K线的熊市收盘价下方做多做空，或者在K线4的低点下方的止损位处做空。或者再在市场突破K线1的低点形成新的低点时做空。","p":"p836"},{"t":"K线5演变成一根突破K线1的大熊市趋势K线。你可以把它看作是做空交易力量增强的信号或者是出现下跌高潮的信号。因为这根K线处于熊市趋势通道线的下方，如果市场从此处反转，那么后续可能至少会有两波上升浪。此外，既然市场第二次尝试从昨天的低点下方处反转而上，那么这也可以是一个形反转，它同样可以形成一天的低点。交易者可以在这根K线的收盘处卖空，如果他们这样做了，一旦市场在此处出现了暂停，他们就会在盈亏平衡点附近退出，然后他们会准备等待市场反转做多的时机。在市场开盘的时候有一个向下的缺口，然后出现了一波回到移动平均线的回调。现在出现了一波卖出高潮。这可能是一个高点或者高潮的底部。因为一般来说在90%的日子里一天中的高点或低点会在最初90分钟内形成，交易者不得不将所以早期可能出现的反转都当作是一天中的极值。","p":"p837"},{"t":"K线6的低点低于K线5的收盘价5个点位，所以在K线5的下方一个点位做空的做空交易者也可以进行一个点位的刮头皮交易。在这个时刻，他们很紧张。他们很可能会在这根K线的上方离开市场，而有一些做空交易者会开始转而做多。因为这根K线是一根熊市趋势K线，做空交易者还是在掌握趋势，所以大部分的交易者还是会保留做空的头寸。市场在移动了从一天的高点到K线1的低点相等的距离后形成了K线6的低点，同时K线6的低点也是对两天以前的一波强劲的上升浪的完美突破测试（在图中并没有显示出来）。","p":"p838"},{"t":"K线7是一个牛市的两根K线的反转。对于做空交易者来说也是一个难处。大部分做空交易者会在盈亏平衡点离场，但还是会承担1至2个价位的损失。许多交易者会在创新低后反弹的K线收盘处买入，然后期待接下来有个两浪的上行。其他交易者会在更低的时间图表或者其他类型的图表上寻找机会，比如成交量或者最小价位图表中出现了反转时买入。因为K线6的大部分区域与之前和之后的两根K线重叠了，所以市场上正在形成一个小型的震荡区间。反趋势交易通常会有回调，所以如果交易者在K线7的上方买入，他们会在这个意料之中的回调中继续持有他们的头寸，并且期待回调中形成一个更高的低点。","p":"p839"},{"t":"K线8是在它的高点处收盘，所以做多交易者会在这根K线的收盘处买入，这显示他们正在非常激进地做多。然而，下跌至K线6的下跌潮非常强劲，所以市场第一波尝试反转上升很可能会失败，很可能会再次尝试下跌。所以你可以采取的替代的策略就是在这个强劲的收盘处买。如果交易者相信市场很可能会出现第二波上升浪，同时他们期待会出现回调，他们很可能会在接下来的几根K线的低点下方1至2个点位处寻找买入时机，并且期待一个失败的低点1和一个更高的低点。","p":"p840"},{"t":"K线9是一根熊市反转K线，而且收盘的时候并没有超越K线8这根强劲的牛市K线的高点。之后市场也没有出现支持的购买力量。这也许是因为做多交易者力量微弱，所以K线8的向上反转会失败，之后会变成低于K线1的突破回调，从而形成一个低点1的卖空机会。因为市场正在从一个楔形底部调整，所以很大的概率会形成第二波上升浪，所以相较于在K线9下方的一个点位处做空，这些已经持有了做多头寸的交易者最好是一直持有这些头寸，直到市场触及了K线5这根信号K线下方的止损位。因为K线5高于这一天的低点一个价位，所以他们很可能会将他们的止损位设置在这天的低点下方一个价位处。有一些还没有买入的做多交易者将会等待市场上出现一个更高的低点时再买入，如果市场上会形成这个更高的低点的话。激进的做多交易者将会在K线9的低点处设置买入限价订单，他们认为市场很可能需要再在低点下方下跌一个点位，才能使得这些做多交易者的限价订单全部交易，如果市场没有下跌而是转而上升，那么做空交易者机会被这个一个价位的失败陷阱困住，所以他们将非常积极地寻求脱身，这将再次推动市场向上。其他的做多交易者将会在K线9的低点下方的1个、2个或3个价位处设置买入限价订单。所有的这些订单都会支持市场上涨。如果市场真的下跌至K线9下方一个点位处，在接下来的几秒钟市场又向上反弹了2至3个点位，那么许多在下方1至2个点位处设置限价买入订单的做多交易者，会将他们的限价买入订单向上移动1至2个点位，因为当他们看到市场开始下跌时会更加激进地入场。K线9是一个不太好的低点1的卖空入场时机，因为这个点很可能会形成一个更高的低点。要形成一个低点1，市场还需要一股更强劲的下跌浪，但是在熊市趋势中下跌浪并不明显，而这恰恰是你在做空低点1之前最需要注意到的。此外，无论如何，交易者都不应该在卖空潮后卖空低点1，特别是在这里还是一个可能的低点1。","p":"p841"},{"t":"做空交易者把K线10看作是在一个熊市趋势中出现的双重顶部，并且希望市场之后的走势会跟K线2与K线3这个双重顶部之后出现的走势一样。然而，交易者还是会关注到这个楔形底部。如果市场跟之前一样急剧下跌，他们也会迅速平仓离场。","p":"p842"},{"t":"K线11跌到了K线9下方的两个价位处，然后开始急剧反弹。做多交易者试图在K线9的低点处买入，在低于K线9一个价位处是很适合做多的，而那些想在低于K线9两至三个价位处买入的做多交易者很害怕他们会错过买入的机会。所以他们把他们的限价订单调整为市价订单，这使得K线11之后开始迅速反弹。同样，这些在K线9的下方卖空的做空交易者害怕低点1会失败，而之后的楔形会开始第二波上升浪，所以他们会在1分钟，2分钟或者3分钟的K线图上的高点或者之上平仓，或者在成交量或者价位图的高点或之上平仓。K线11的收盘价高于过去的六根K线的收盘价（这是市场力量正在增强的迹象），同时它也是一根可能带来潜在的新的牛市趋势的外包上升K线。许多做多交易者会在这个强劲的收盘价处买入，并延续着K线7和K线8的支撑力量，所以趋势很可能会反转上升。但是K线11没有超过前一根K线的高点，只是形成了一个低于前一根K线的低点，且与前一根K线的高点相同，但这也足以使得市场相信它是一根外包K线。在这个时点。K线11与前两根K线形成了一个楔形顶部，如果市场没有反转而下反而向上走高了一个价位，那么这个模式将会变成一个失败的顶部，后续将会出现更多的买方力量。K线11也向下突破了从K线6和K线7形成的趋势线，同时向下突破了从K线9至K线10形成的趋势通道线，而这创造了一个小型的多空决斗线的买入入场时机。K线9、10、11一起形成了一个微型的扩展三角形，这个表现得更像是一个牛市旗形而非反转模式，因为市场上出现第二波上升浪的可能性更大。","p":"p843"},{"t":"K线12向上突破了这个三角形的顶部以及K线11这根外包K线的高点。虽然K线12是一根小型的K线，但它还是比这个三角形的顶部要高出两个价位。如果市场在突破了顶部一个价位之后反转而下，则交易者将会把这种情况看成是一个可能的牛市陷阱，所以他们会开始寻找离开做多的位置的时机。做空交易者也会把它看成是两浪模式的下跌反转从而开始做空。许多做空交易者将会在K线12下方一个价位处设置卖空订单，以防它变成一个低点2的卖空时机。然而，因为K线12的高点如此接近移动平均线，所以一旦市场第一次触及移动平均线他们将更加确信自己的做空方向。当然也有一些交易者在市场触及移动平均线之前是不会做空的，因为在市场触及移动平均线之前，他们都会一直担心可能会出现震荡行情。所以交易者并不确信市场上的测试已经结束，除非市场比他们预想的多走了一些并触及了移动平均线。在那之前，他们都无法将这些交易看作是一次完全的回调。一些做多交易者将会在这根K线的上方增加做多的头寸，因为他们认为做空交易者很难成功地把控市场，所以市场还是有很大的概率是上升的。K线12的高点比K线3的低点要低两个价位，同时距离触及这些做空交易者设置的盈亏平衡止损位一个价位。如果市场在这里出现了下跌浪，那么将会带来一次非常完美的突破测试（之所以说它是完美的，是因为在没有触及这些止损位的情况下，这波下跌浪已经尽可能地接近他们了）。如果市场没有下跌，而是正好走高了一个价位，那么这次突破测试就失败了，那么这些剩下来的做空头寸将会被平仓，这些买入力量将会加剧市场的上涨。做多交易者深其中的道理，所以他们会在卖空交易者平仓的价位设置买入止损订单来增加他们的买入头寸从而获利。","p":"p844"},{"t":"K线13是一根强劲的牛市突破K线，它向上突破了移动平均线，同时在收盘时不仅完美地突破了移动平均线。还突破了熊市趋势线以及飞线5这根强劲的熊市趋势K线的高点。所以熊市旗形失败了，市场突破向上，交易者将会寻找市场上会出现的可以测量的向上移动距离。当然如果这个熊市旗形没有失败，他们将会期待市场会测试这一天的低点。但是一旦熊市旗形失败了，他们就认为市场会向上继续走高一些点位做多交易者将会在这一根K线的收盘处买入，因为市场接下来可能会测试这一天的高点。这一天K线的区间幅度只有5个点位，大概是最近平均日区间的幅度的一半，所以市场很可能会形成一段可以测量的向上或者向下移动的距离。在这个时点上，因为做空交易者刚刚平仓了，在市场出现至少两波上升浪之前，他们不太可能会再次做空，当然这意味着做多交易者在接下来的几根K线都会掌握市场。在这个时点上，如果市场会出现一段可以测量的距离，那么上行的概率要大于下行的概率。","p":"p845"},{"t":"K线14是一根熊市反转K线，它可能会形成一个更低的高点，一次失败的突破或者一个低点2的卖空机会。然而，正如我们在上面分析所说，市场在K线13的突破后很可能会形成至少两波上升浪，所以如果在此处做空，你将很可能会失败，而这失败又可能会形成一个突破的回调型做多机会。做多交易者因此会抓住一切低于K线14的低点的机会做多。比如，如果市场相较于K线14的低点走低了一个价位，并形成了一个价位的熊市陷阱，那么激进的做多交易者将会想抓住这个机会做多为了抓住这个机会，他们会将他们的限价买入订单设置在K线14的低点处。他们这样做的原因是，在K线14的下方很可能不会出现足够多的做空交易者，那么这些激进的做多交易者如果在下方设置限价买入订单就可能不能全部实现。因为做多交易者已经掌握了市场，所以在市场上的交易者很可能更愿意做多而非做空。或者，做多交易者可以设置一些只要市场跌到K线14的下方就买入的订单，或者不需要设置订单，只要市场跌到K线14的下方就果断买入。其他做多交易者会在K线14下方2至3个点位处设置买入限价订单。","p":"p846"},{"t":"其他做多交易者想在市场出现2至3个点位的回调时买入，所以会在K线14的高点下方7至11个价位处设置限价买入订单。如果市场正好回调了两个点位，大部分想在市场回调处买入的交易者正好会在K线14的高点下方7个点位处买入，而无法在最低点买入，因为市场下跌至低点处，很可能会出现竞价买单而很少卖单，这将导致做多交易者不得不以高于其一个价位的价格买入。","p":"p847"},{"t":"最后，许多做多交易者会将所有的做空时机看作是做多时机，他们认为市场上一定存在着在熊市收盘处做空的被困住的做空交易者。这些做空交易者一定会想在某些时点买回他们的做空头寸，而且会将他们的买入止损点设置在这根熊市反转K线上方一个价位处。聪明的做多交易者深请此道，他们会在被困住的做空交易者买回做空头寸时的价位做多。所以这些做多交易者也会在K线14上方一个价位处设置买入止损价位。","p":"p848"},{"t":"K线15向上突破了K线14这根熊市反转K线的高点，但是在收盘时出现了回调。K线14和K线15这个双重底部很可能不能成为一个牛市旗形，从而带来一波卖空潮，就像K线2和K线3形成的双重底部那样。另外，K线15的高点与开盘时的高点形成了一个双重顶部，所以这一天可以成为一个双重顶部熊市旗形，因此可能会在这天的低点下方继续下跌一段可以测量的距离。K线13、14和15一起形成了一个微型楔形。如果这个楔形被触发了，也就是市场继续下跌超过K线15的低点，那么市场很可能会出现两浪的震荡下跌调整。如果市场没有下跌，反而上升了，那么市场上的上升浪很可能会突破这一天的新高并且超过这个微型楔形，所以会出现更多的做空交易者做多平仓，而新入场的做多交易者则会利用这次突破进行刮头皮交易。","p":"p849"},{"t":"K线16是一根突破了趋势通道线的强劲的突破K线。这可能是一个买入高潮，也可能会在接下来出现持续至少一个小时的两浪模式的下跌调整。只要是在一段牛市趋势后出现了一根强劲的牛市趋势K线，那么很可能代表的是市场上力量的衰竭，伴随着市场上最后一波较弱的做多交易者的买入，以及最后一波较弱的做空交易者的买入平仓，强势的做多交易者和做空交易者都会等到这根强劲的牛市趋势K线收盘卖出（做多交易者卖出头寸获利，做空交易者卖空获得头寸）。手中还有空头头寸的交易者只能等到市场出现回调的时候买入平仓，而强劲的做多交易者也会在市场出现回调时再次买入。这种情况也同K线5代表的卖空潮有些类似。K线16的高点比昨天的高点低5个价位，而高点出现的区域一般也是市场的阻力区域，因此这些交易者都会在这个高点的上方寻找刮头皮交易时机，一旦市场向上突破阻力他们将获得一个点位的盈利。而有一些做多交易者将会在这根K线的收盘处买入因为他们在市场测试昨天的高点时离场可以获得一个点位的盈利。市场测试昨天的高点的可能性要大于市场突破今天的高点的可能性，但是也有可能会形成一个更低的高点，特别是在市场突破趋势通道线之后。一些新入场的做多交易者会在市场出现阻力或者回调时迅速离场，因为他们不愿意自己在市场的阻力区域中潜在的买入高潮中买入的头寸遭受到任何一点损失。其他的做多交易者会使用一个更宽泛的止损位，并且当市场与他们的方向相悸时继续增加买入头寸。这些交易者最终会取得成功。激进的做空交易者将会在K线16的收盘处做空。或者在K线16的高点或上方做空，还会在更高的点位处进行刮头皮交易，承担了大概相当于K线16的高点的价位的风险。因为K线16有两个点位的高度，所以为了获得一个点位的盈利他们承担了两个点位的风险，同时他们还会尝试在高于K线16的收盘价或者高点一个点位处卖出。他们没办法在更高的点位进行刮头皮交易，但是他们有能力在K线26这根强劲的熊市趋势K线处进行刮头皮交易，并获得一个点位的盈利。他们的盈利还将推动K线26之后出现的市场反转向上。记住，所有的交易者都会把每一个价位同时看作是买入和卖出时机，并且不断地评估两个方向的可能的交易所带来的利润。一天中会有很多次机会，做多交易者和做空交易者可以同时进行刮头皮交易并且获利，如果他们能够正确地管理他们的交易。K线16的收盘就是一个例子。","p":"p850"},{"t":"K线17在突破K线16三个价位后反转而下。这些晚入场的做多交易者很迅速地离开了市场，而激进的做空交易者则开始进行做空。K线17变成了一根强劲的熊市反转K线，做空交易者将在它的收盘处和低点下方一个价位处寻找做空时机。其他的做空交易者已经在更低的时间图表上做空了。这是一个熊市入场时机，做多交易者不会买入。一旦市场跌到了K线17的低点下方。做多交易者将会把这个看成是一个高于牛市趋势通道线的失败突破，他们和做空交易者认为市场会出现一波至少持续一个小时的两浪调整模型。做多交易者在这波调整结束之前不会积极地买入。因为交易者都在寻找这个两浪调整模式，做空交易者将会开始设置限价订单来做空一个更低的高点。上升至K线17的上升浪是一波强劲的牛市浪，所以做多交易者希望出现二个牛市通道和一波可测量的上升浪，他们希望这波上升浪的距离至少能达到从K线6或K线11的低点至K线17的高点的距离。","p":"p851"},{"t":"K线18并没有触发做空，而是变成了一根牛市内含K线。因为交易者都期待市场出现一个两浪调整模式，所以聪明的做多交易者不会在K线18的上方寻找买入机会，而激进的做空交易者将会在K线18的高点处设置卖出限价订单，在K线17这根熊市反转K线的高点上方两个价位处设置止损位。","p":"p852"},{"t":"K线19并没有完全满足在K线18的高点处设置的卖出止损订单同时它也没有触发在K线17和K线18的低点下方设置的卖出止损位相反，市场上现在出现了一个i模式。做多交易者，还是不会买入，而做空交易者将更加激进地做空。","p":"p853"},{"t":"K线20与之前的两根K线形成了一个i模式的入场时机，同时它具有一个熊市的收盘，这有利于做空交易者。聪明的交易者还是在K线17的下方寻找卖出时机（也是在讯模式的下方），同时也在一个更低的高点处寻找卖出时机。","p":"p854"},{"t":"K线21很可能会成为大家期望的牛市陷阱。它也是第二波上升浪（K线18是第一波），它比K线18高出一个价位，所以其他失误的做多交易者很可能会开始做多。市场上没有出现任何被困住的做空交易者，因为大部分保守的做空交易者会在K线17下方的止损位入场，但是市场还没有跌到K线17的下方。目前在市场上仅有做空交易者就是那些聪明的、激进的期待市场出现一个更低的高点的牛市陷阱的交易者。他们希望市场会困住这些做多交易者，因为一旦市场开始下跌，这些做多交易者将会不得不卖出他们的做多头寸，而这就将加剧市场上的卖出潮。此外，在做多交易者被困住之后，除非市场出现更多的价格行为，否则他们不会再次买入。聪明的做多交易者正在等待两浪模式的市场调整，所以他们不会在这里急于买入。而弱势的做多交易者会在这个模式中错误地买入。聪明的做空交易者会在这个ii模式的上方1、2，或3个点位处卖空，并在K线17的高点上方设置保护性止损位。做空交易者会在这根K线的下方寻找卖空时机，特别是在K线17这根强劲的熊市反转K线的下方寻找卖出时机。","p":"p855"},{"t":"大部分做空交易者会等待市场直到K线17的下方时再卖空，他们认为这是市场到底顶部的证明。","p":"p856"},{"t":"然而，聪明的做空交易者只会寻找进行刮头皮交易的时机，因为市场上的上升浪还很强劲，而这一天的整体浮动区间还是小于平均值。在这样的时点上，如果这个区间要扩展，那么上涨的可能性要大于下跌的可能性。同样，所有人都相信在买入高潮后出现市场的停顿，很可能接下来会出现不止一波的上升浪。市场的震荡向下调整很有可能会带来一个最终旗形和波动下跌，但是只有在市场出现了向上的突破后这些才可能会发生。","p":"p857"},{"t":"K线22将K线21变成了一个更低的高点的最终旗形卖空时机（之前的模式的下降三角形是一个最终旗形），但是这根K线没有向下突破i模式，所以那些想在这个旗形下方的止损位和K线17的下方入场的做空交易者也没有增加卖空头寸。此外，这根K线是在中间的位置收盘的，这意味如果交易者在这根K线的收盘处买入，一旦做空交易者掌握了市场，那么市场上发生的情况将与这些买入者的预期的相悖。","p":"p858"},{"t":"市场继续在K线25处进行横向盘整，市场正在形成一个狭窄的震荡区间，这也是一个突破入场时机。如果市场上有一至两根K线跌到了K线17的下方，做空交易者将会非常欣喜，因为这意味着市场上有很紧迫的情绪做空。市场正在横向盘整而非下跌，这也是牛市力量增强的迹象。此外，市场现在只高于移动平均线2个价位，因为市场在这里很可能会形成支撑位，且市场的调整期已经有10根K线的时长，所以做多交易者将会寻找重新做多的时机。这给做空交易者出了一个难题。一开始，他们只是希望有一个较大的机会进行做空刮头皮交易，现在看来，这个交易盈利的机会更少了。如果熊市突破停止了，他们就会迅速地平仓。K线25触及了K线17和K线21连成的熊市趋势线。同时形成了一个下降的三角形。当它在牛市趋势中发生的时候。这是一个牛市旗形。然而如果你只是看这些K线的主体，那么从K线21至K线25的K线都是处于一个狭窄的通道中。一个通道中通常会有三波助推浪，然后出现反转，就像一个形一样。K线22和K线24是两波下推浪。所以市场上只可能再出现一波下推浪，因此这个三角形的向下突破很可能会失败。","p":"p859"},{"t":"K线26是一根熊市突破K线，它在低点处收盘，且向下突破了移动平均线。新入场的做空交易者希望市场会继续下跌几个价位一样，从而他们所有的可以盈利的限价订单都会被触发且完全交易。然而，这根熊市趋势K线仅仅只在移动平均线下方一个价位处收盘，而如果是强劲的突破的话，收盘价应该至少还要再向下突破几个价位，就像在K线13处的牛市收盘突破向上突破了移动平均线几个价位一样，这也是市场对于突破开盘高点的突破的测试。即使激进的做空交易者在K线21这个强劲的牛市趋势K线的收盘处卖空，并不能获得一个点的刮头皮交易利润，如果市场再上涨，他们将会面对5个价位的失败。从而不得不买回他们的做空头寸。在K线16的收盘处或者更高处卖空的做空交易者将会在此刻买回他们的头寸。做多交易者把K线26看成是做空交易者试图将做市场上的始终在场策略反转为做空方向的尝试，但是他们知道大部分的反转都会失败。他们下一根K线必须是一根强劲的熊市趋势K线才能使得做空交易者确信市场已经反转了方向。因为市场上的牛市趋势是如此强劲，他们不得不怀疑做空交易者是否能够成功，甚至他们都不确信做空交易者是否能够推动市场跌至K线16这根熊市趋势K线的低点下方。基于此，他们在这根熊市趋势K线的收盘处买入，同时他们会在它的低点下方买入更多。其他做多交易者会在K线17的下方7个价位处设置买入限价订单，因为他们试图在牛市趋势中出现的2至3个点的回调中买入。","p":"p860"},{"t":"K线27是一根牛市内含K线，而且它可以在移动平均线上设置一个高点2的买入时机。它会演变成一段持续10根K线左右的两浪调整模型，时间足够做多交易者做多。在市场上涨至K线17的高点后，做多交易者希望通道会继续上升，而这波回调至移动平均线的回调可能是通道上升的开始。这也同样会是一个测试K线2的高点的突破测试。它还可以被看成是一个突破回调，做空交易者可以在它的低点下方做空，这也是K线26这根熊市突破K线的低点。做空交易者希望出现一个熊市主体从而增加市场反转做空的概率。一旦交易者看到了牛市收盘，他们就认从而增加市场反转做空的概率定做空交易者已经失败了，所以市场上的始终在场策略的方向还是做多所以他们会在这根K线的收盘处或者K线上方买入。","p":"p861"},{"t":"K线28是第二根牛市内含K线，并且与前一根K线形成了ii模式。在这个时点，交易者会怀疑市场是否在继续震荡区间，如果在市场上的卖方力量增强之前突破就暂停了，则这次突破失败了，那么做多交易者将会再次掌控市场。","p":"p862"},{"t":"K线29向上突破了这个i模式，成功地测试了移动平均线以及开盘区间的突破。然而，它仅仅突破了一个价位，并且是一根小型的熊市趋势K线，所以它也很容易被看成是从K线26开始的回调浪中的卖空时机。做空交易者可以在它的低点下方设置卖空订单。然而，在过去一个小时内卖空的做空交易者现在都关注的是市场上是否会给他们一个机会获得刮头皮交易的利润，但是市场并没有给他们这样的机会。所以他们不会持有他们的空头头寸太久。他们会在K线26熊市趋势K线的高点上方，K线23，24，25组成的三角形顶部，K线21这个更低的高点，K线17这个买入高潮的高点，以及昨天的高点处设置买入止损位。因为所有的这些止损位都是一个比一个高1至2个价位，所以一旦市场上涨他们都会依次被触及，导致做空交易者不得不放弃头寸，而做空交易者将掌控市场。","p":"p863"},{"t":"K线30突破了K线29的高点，并且高于熊市趋势线1个价位，但是没有超过K线26这个做空入场K线。这是两波上升浪，所以做空交易者会把它当作是从熊市突破中产生的可以接受的回调。但是他们依然很担心自己的空头头寸会受到影响。所以他们会很快买回他们的头寸。做多交易者也知道市场的调整有两浪，而现在已经持续了10根K线，所以他们的最低标准已经得到满足，所以他们已经准备好积极的买入，希望市场会上升至1127.50点位的区域。但这还远远不足以让他们放弃一些或全部的新的头寸。他们会将每一个做空止损位看作是买入时机，会在做空交易者平仓的价位买入。因为做多交易者和做空交易者在相同的价位买入，所以市场会上涨，并且会加速上涨。一些做多交易者也把这个震荡区间看作是楔形牛市旗形，把K线17看作是第一波下推浪，K线20看作是第二波，K线26看作是第三波。他们也把第三波下推浪看作是包含了一个小型的楔形，K线22，24和26分别形成了三波下推浪K线32和33都是小型的十字星，同时也是交易者决定设置买入止损位的迹象。在这个点上，做空交易者开始准备平仓，因为他们知道他们的空头头寸不过是反趋势交易的刮头皮交易头寸。他们很可能会在盈亏平衡点离场，或者还会有1至2个价位的损失。市场超过了移动平均线，在一个急剧的上涨后，牛市的迹象越来越明了。","p":"p864"},{"t":"K线34是一根牛市趋势K线，但是它的收盘价低于它的高点几个价位。市场在K线17的高点处和天的高点区域找到了卖方。","p":"p865"},{"t":"K线35给予了做多交易者刮头皮交易的利润，虽然比之前的高点高出1个价位，但却形成了一根熊市反转K线。许多交易者会在这根K线的收盘处卖空，但是还有一些交易者会在它的低点下方一个价位处卖空。激进的做多交易者不会被市场的回调所困扰，他们希望这不过是一次突破回调，之后还将带动市场上涨超越昨天的高点。只要市场超过移动平均线，超过K线26这个更高的低点，或者超越K线34这根牛市趋势K线的低点，他们就会一直做多。","p":"p866"},{"t":"在K线36做空的做空交易者很担心这根K线会在他们的入场价位处收盘，这样他们就无法推动市场下跌至K线34这根牛市入场K线的下方。他们将会在这根K线的收盘价或者高点上方平仓。一些做多交易者会在这根K线的上方做多，但是大部分做多交易者不会这么做，因为这一天已经持续了好几个小时的震荡区间，你这样做的话很容易就是买在了市场的高点附近。在一天的高点附近买入在强劲的牛市趋势中是非常好的策略，但是在这里并不适用。","p":"p867"},{"t":"K线37是一根牛市趋势K线。但是在三根近乎重叠的大K线上方买入并不是一个好策略。这三根K线其实组成了二个震荡区间，因为大部分的突破都是失败的。所以在震荡区间的顶部买入是非常有风险的。不出意外的话，在这个地方做空更好。","p":"p868"},{"t":"K线38比K线36高出5个价位，比昨天的高点高出1个价位，市场在之后反转向下。许多在这一日早些时候就做多的做多交易者会通过设置限价订单在昨天的高点处盈利，而激进的做空交易者也会在这里做空。在市场上升了5个价位之后，在K线37做多的交易者会将他们的止损位设置在盈亏平衡点附近，市场会在下跌的过程中触及这些止损位。K线38变成了一根强劲的熊市反转K线，但是因为它与之前的4根K线重叠的太多了，所以它形成的更像是一个震荡区间而非市场反转。这是市场第二次尝试反转开盘的高点，所以许多交易者会在这根熊市反转K线下方一个点位处设置卖空止损位。其他人则会寻找一个更低的高点的卖空时机。市场上涨至K线38的高点可以被看作是牛市趋势线被突破之后，形成的一个两浪模式的更高的高点。因此它也可以是一个潜在的趋势反转。基于此，做多交易者在再次买入之前还会等待市场出现一个两浪模式的调整。","p":"p869"},{"t":"K线39是一根十字星内含K线。做空交易者会在市场低于K线38的低点下方尝试做空，此时其他做空交易者会在一个更低的高点处设置限价卖空订单。他们会在K线39的高点，或者高于其高点1到2个价位处设置限价卖空订单。过度激进的做多交易者会把这个看作是一个高点2的买入入场时机（K线37是一个高点1），同时会在激进的做空交易者卖空的价位做多。市场现在处于一天中的中间三分之一的时段，所以很有可能会进入震荡区间，所以做多交易者不得不变得更有耐心，除非市场上牛市趋势再次变得强劲，否则他们就应该避免在高点买入。","p":"p870"},{"t":"K线41再次失去了支撑的力量，如果市场跌到了这根K线的低点下方，那些在K线40买入的激进的做多交易者将会马上获得两个价位的损失。做空交易者将会在这个潜在的更低的高点处卖空，但是他们不会激进地卖空，因为市场正在形成一些重叠的具有尾部的K线（这也是栅栏现象），所以市场上的突破行为很有可能会失败。通常来说在这些并排的K线的底部出现突破时买入，顶部出现突破时卖出是一个很好的策略。","p":"p871"},{"t":"K线42会使得这些在高点2做多的头寸平仓，其他的做多头寸会在K线38的下方以及信号K线的低点下方被平仓。","p":"p872"},{"t":"K线43会使得交易者怀疑市场是否形成了一个楔形牛市旗形。一个微型的，震荡的头肩顶通常会变成一个三角形或者一个楔形牛市旗形，而K线35和40就是肩部。因为交易者正在寻找一个楔形牛市旗形，所以他们正在寻找三波下推浪和一个高点3的买入时机。K线36和38是前两波下推浪，K线42开启了第三波下推浪，如果后面再出现一波上升浪，那么这个楔形牛市旗形（也是一个失败的头肩顶型）就被触发了。","p":"p873"},{"t":"K线44向下突破了K线36的低点一个价位，同时测试了超越K线27和移动平均线的突破。它也可以是一个信号K线，虽然它有一个熊市主体（在震荡区间的信号K线有时候看起来并不怎么明显）。只有当交易者在一个强劲的趋势中准备反趋势交易时，他们才需要非常明显的信号K线，而在其他时候信号K线往往会看起来非常弱。激进的做多交易者将在K线36的低点设置买入限价订单，并期待任何突破了低点的突破在持续了几个价位后都会失败。其他做多交易者会在这根K线上方的高点3处买入，因为它可能会成为一个楔形牛市旗形。如果市场超越了K线44的高点。那么就很可能会形成一个5个价位的熊市陷阱，这将逼迫被困住的做空交易者买回他们的头寸。","p":"p874"},{"t":"K线45触发了买入限价订单，虽然它只比K线44的高点高1个价位。在一天的中间三分之一的时段。市场往往会缺乏动能。虽然说价格行为的实际形态是非常可靠的。其他交易者将会在K线45的上方买入，因为他们把它看成是两根K线的反转。此外，许多交易者会选择在牛市K线的上方买入，因为牛市收盘在一定程度上已经说明市场朝着他们需要的方向前进了一小步。","p":"p875"},{"t":"K线49给予了做多交易者一个点位的刮头皮交易时机，但是许多做多交易者还是会抓住每一次信号买入，一部分用来做刮头皮交易，剩下的用来做波段交易。市场抛物线一般上升至K线17的高点也可以是一波上升浪，而之后出现的震荡区间移动平均线上找到了支撑力量，因此会形成一个通道。波段做多的交易者继续买入，并将他们的保护性止损位设置在最近的震荡低点的下方，也就是K线44的下方。","p":"p876"},{"t":"在剩下的时间里，还有很多类似的交易，这也说明了如果交易者有能力聚精会神地阅读并理解图表，他们可以在一天的时间内抓住几十次刮头皮交易时机。然而，极限刮头皮交易对于大部分的交易者来说都是一个失利的交易策略，他们不应该轻易地尝试这个策略，而且他们不应该承当比回报更高的风险。相反，他们应该把精力更集中在其他更容易成功与实现的交易方法上。这一章主要是为了告诉大家在每一张图表上出现的情况都比你想象的多得多，所以交易者需要在一整天的时间里都保持不断的思考。在今天的图表上，有很多的入场时机交易者可以获得至少与风险相当的回报，但是他应该认真思考他能够看到的每一个入场时机。这个图表只是说明了一个交易者在一天的时间内可以做出多少决定。大部分有经验的交易者都应该只交易其中一部分的交易时机。","p":"p877"}]},{"t":"para","text":"在图16.1中5分钟的标普500期货合约交易图表中显示了极限刮头皮交易。在这一天中有81根K线，每三根K线为一组，第三根K线都在图中标志了出来。如果一个交易者希望用一两个点位的止损位来进行一个点位的刮头皮交易，那么在一天中有40次机会来进行这样的交易。记","pid":"p831"},{"t":"para","text":"头皮交易利润，就需要市场在信号K线上移动6个点位。","pid":"p832"},{"t":"para","text":"K线1是一根牛市反转K线，同时也是一个从昨天的收盘就开始低于熊市旗形的潜在的失败的突破。然而，在K线1的顶部有一两个点位的突破，同时它的高点低于昨天的收盘价和移动平均线4个点位，所以并没有足够的空间进行买入刮头皮交易。在K线1的上方买入的交易者在入场K线上看到了一个较弱的收盘，所以他们很可能会在盈亏平衡点附近退出市场。","pid":"p833"},{"t":"para","text":"K线2是一个十字星，所以它收盘时没有超过K线1。这恰恰是做多交易者力量减弱，做空交易者力量加强的信号。这种一根K线的反弹很可能会演变为突破回调。而且它之后很可能会跟随另外一波下跌浪。交易者可以在K线2的下方一个点位处设置卖空订单。","pid":"p834"},{"t":"para","text":"K线3不能满足所有的卖空订单，但是它有一个熊市收盘，同时这根K线没有超越K线2。所以它与K线2一起形成了一个双重顶部，且正好处于移动平均线的下方，所以可能会带来一波下跌浪。一个交易者可以在这根K线的收盘处做空。然后在这根K线的高点上方退出市场或者转而做多，也可以在这根K线的低点下方一个点位处的卖空止损位做空。在K线2这根做多入场的做多交易者也应该在下方一个点位处做空。许多做多交易者更可能采取的措施是在这个位置离开市场（在入场K线的下方），从而加剧了市场的下跌。所以如果这个点位被触发了，则可能会带来一波突破回调，从而导致波动下跌。交易者可以在1到2个点位上进行刮头皮交易，或者在整个区间进行波段交易（他们可以获得6个价位的净盈利），或者在部分区间（也许是一半）采取刮头皮交易，在部分区间采取波段交易，他们希望在采取波段交易的部分获利3至4个点位。","pid":"p835"},{"t":"para","text":"K线4这根入场K线是一根强劲的做空趋势K线，它很有可能会形成一天的低点。市场企图超越K线1但是却失败了，所以现在试图突破K线1的低点。因为市场还处于移动平均线的下方，同时相对于昨天的熊市旗形它属于跳空下跌开盘，这意味着做空交易者非常强劲，市场很可能会向下移动一段可测量的距离。K线2很可能会成为一天中的高点，这一天很可能会变成一个强劲的熊市交易日。因为熊市趋势非常强劲所以交易者可以在K线2这根做多入场K线的熊市收盘价下方做多做空，或者在K线4的低点下方的止损位处做空。或者再在市场突破K线1的低点形成新的低点时做空。","pid":"p836"},{"t":"para","text":"K线5演变成一根突破K线1的大熊市趋势K线。你可以把它看作是做空交易力量增强的信号或者是出现下跌高潮的信号。因为这根K线处于熊市趋势通道线的下方，如果市场从此处反转，那么后续可能至少会有两波上升浪。此外，既然市场第二次尝试从昨天的低点下方处反转而上，那么这也可以是一个形反转，它同样可以形成一天的低点。交易者可以在这根K线的收盘处卖空，如果他们这样做了，一旦市场在此处出现了暂停，他们就会在盈亏平衡点附近退出，然后他们会准备等待市场反转做多的时机。在市场开盘的时候有一个向下的缺口，然后出现了一波回到移动平均线的回调。现在出现了一波卖出高潮。这可能是一个高点或者高潮的底部。因为一般来说在90%的日子里一天中的高点或低点会在最初90分钟内形成，交易者不得不将所以早期可能出现的反转都当作是一天中的极值。","pid":"p837"},{"t":"para","text":"K线6的低点低于K线5的收盘价5个点位，所以在K线5的下方一个点位做空的做空交易者也可以进行一个点位的刮头皮交易。在这个时刻，他们很紧张。他们很可能会在这根K线的上方离开市场，而有一些做空交易者会开始转而做多。因为这根K线是一根熊市趋势K线，做空交易者还是在掌握趋势，所以大部分的交易者还是会保留做空的头寸。市场在移动了从一天的高点到K线1的低点相等的距离后形成了K线6的低点，同时K线6的低点也是对两天以前的一波强劲的上升浪的完美突破测试（在图中并没有显示出来）。","pid":"p838"},{"t":"para","text":"K线7是一个牛市的两根K线的反转。对于做空交易者来说也是一个难处。大部分做空交易者会在盈亏平衡点离场，但还是会承担1至2个价位的损失。许多交易者会在创新低后反弹的K线收盘处买入，然后期待接下来有个两浪的上行。其他交易者会在更低的时间图表或者其他类型的图表上寻找机会，比如成交量或者最小价位图表中出现了反转时买入。因为K线6的大部分区域与之前和之后的两根K线重叠了，所以市场上正在形成一个小型的震荡区间。反趋势交易通常会有回调，所以如果交易者在K线7的上方买入，他们会在这个意料之中的回调中继续持有他们的头寸，并且期待回调中形成一个更高的低点。","pid":"p839"},{"t":"para","text":"K线8是在它的高点处收盘，所以做多交易者会在这根K线的收盘处买入，这显示他们正在非常激进地做多。然而，下跌至K线6的下跌潮非常强劲，所以市场第一波尝试反转上升很可能会失败，很可能会再次尝试下跌。所以你可以采取的替代的策略就是在这个强劲的收盘处买。如果交易者相信市场很可能会出现第二波上升浪，同时他们期待会出现回调，他们很可能会在接下来的几根K线的低点下方1至2个点位处寻找买入时机，并且期待一个失败的低点1和一个更高的低点。","pid":"p840"},{"t":"para","text":"K线9是一根熊市反转K线，而且收盘的时候并没有超越K线8这根强劲的牛市K线的高点。之后市场也没有出现支持的购买力量。这也许是因为做多交易者力量微弱，所以K线8的向上反转会失败，之后会变成低于K线1的突破回调，从而形成一个低点1的卖空机会。因为市场正在从一个楔形底部调整，所以很大的概率会形成第二波上升浪，所以相较于在K线9下方的一个点位处做空，这些已经持有了做多头寸的交易者最好是一直持有这些头寸，直到市场触及了K线5这根信号K线下方的止损位。因为K线5高于这一天的低点一个价位，所以他们很可能会将他们的止损位设置在这天的低点下方一个价位处。有一些还没有买入的做多交易者将会等待市场上出现一个更高的低点时再买入，如果市场上会形成这个更高的低点的话。激进的做多交易者将会在K线9的低点处设置买入限价订单，他们认为市场很可能需要再在低点下方下跌一个点位，才能使得这些做多交易者的限价订单全部交易，如果市场没有下跌而是转而上升，那么做空交易者机会被这个一个价位的失败陷阱困住，所以他们将非常积极地寻求脱身，这将再次推动市场向上。其他的做多交易者将会在K线9的低点下方的1个、2个或3个价位处设置买入限价订单。所有的这些订单都会支持市场上涨。如果市场真的下跌至K线9下方一个点位处，在接下来的几秒钟市场又向上反弹了2至3个点位，那么许多在下方1至2个点位处设置限价买入订单的做多交易者，会将他们的限价买入订单向上移动1至2个点位，因为当他们看到市场开始下跌时会更加激进地入场。K线9是一个不太好的低点1的卖空入场时机，因为这个点很可能会形成一个更高的低点。要形成一个低点1，市场还需要一股更强劲的下跌浪，但是在熊市趋势中下跌浪并不明显，而这恰恰是你在做空低点1之前最需要注意到的。此外，无论如何，交易者都不应该在卖空潮后卖空低点1，特别是在这里还是一个可能的低点1。","pid":"p841"},{"t":"para","text":"做空交易者把K线10看作是在一个熊市趋势中出现的双重顶部，并且希望市场之后的走势会跟K线2与K线3这个双重顶部之后出现的走势一样。然而，交易者还是会关注到这个楔形底部。如果市场跟之前一样急剧下跌，他们也会迅速平仓离场。","pid":"p842"},{"t":"para","text":"K线11跌到了K线9下方的两个价位处，然后开始急剧反弹。做多交易者试图在K线9的低点处买入，在低于K线9一个价位处是很适合做多的，而那些想在低于K线9两至三个价位处买入的做多交易者很害怕他们会错过买入的机会。所以他们把他们的限价订单调整为市价订单，这使得K线11之后开始迅速反弹。同样，这些在K线9的下方卖空的做空交易者害怕低点1会失败，而之后的楔形会开始第二波上升浪，所以他们会在1分钟，2分钟或者3分钟的K线图上的高点或者之上平仓，或者在成交量或者价位图的高点或之上平仓。K线11的收盘价高于过去的六根K线的收盘价（这是市场力量正在增强的迹象），同时它也是一根可能带来潜在的新的牛市趋势的外包上升K线。许多做多交易者会在这个强劲的收盘价处买入，并延续着K线7和K线8的支撑力量，所以趋势很可能会反转上升。但是K线11没有超过前一根K线的高点，只是形成了一个低于前一根K线的低点，且与前一根K线的高点相同，但这也足以使得市场相信它是一根外包K线。在这个时点。K线11与前两根K线形成了一个楔形顶部，如果市场没有反转而下反而向上走高了一个价位，那么这个模式将会变成一个失败的顶部，后续将会出现更多的买方力量。K线11也向下突破了从K线6和K线7形成的趋势线，同时向下突破了从K线9至K线10形成的趋势通道线，而这创造了一个小型的多空决斗线的买入入场时机。K线9、10、11一起形成了一个微型的扩展三角形，这个表现得更像是一个牛市旗形而非反转模式，因为市场上出现第二波上升浪的可能性更大。","pid":"p843"},{"t":"para","text":"K线12向上突破了这个三角形的顶部以及K线11这根外包K线的高点。虽然K线12是一根小型的K线，但它还是比这个三角形的顶部要高出两个价位。如果市场在突破了顶部一个价位之后反转而下，则交易者将会把这种情况看成是一个可能的牛市陷阱，所以他们会开始寻找离开做多的位置的时机。做空交易者也会把它看成是两浪模式的下跌反转从而开始做空。许多做空交易者将会在K线12下方一个价位处设置卖空订单，以防它变成一个低点2的卖空时机。然而，因为K线12的高点如此接近移动平均线，所以一旦市场第一次触及移动平均线他们将更加确信自己的做空方向。当然也有一些交易者在市场触及移动平均线之前是不会做空的，因为在市场触及移动平均线之前，他们都会一直担心可能会出现震荡行情。所以交易者并不确信市场上的测试已经结束，除非市场比他们预想的多走了一些并触及了移动平均线。在那之前，他们都无法将这些交易看作是一次完全的回调。一些做多交易者将会在这根K线的上方增加做多的头寸，因为他们认为做空交易者很难成功地把控市场，所以市场还是有很大的概率是上升的。K线12的高点比K线3的低点要低两个价位，同时距离触及这些做空交易者设置的盈亏平衡止损位一个价位。如果市场在这里出现了下跌浪，那么将会带来一次非常完美的突破测试（之所以说它是完美的，是因为在没有触及这些止损位的情况下，这波下跌浪已经尽可能地接近他们了）。如果市场没有下跌，而是正好走高了一个价位，那么这次突破测试就失败了，那么这些剩下来的做空头寸将会被平仓，这些买入力量将会加剧市场的上涨。做多交易者深其中的道理，所以他们会在卖空交易者平仓的价位设置买入止损订单来增加他们的买入头寸从而获利。","pid":"p844"},{"t":"para","text":"K线13是一根强劲的牛市突破K线，它向上突破了移动平均线，同时在收盘时不仅完美地突破了移动平均线。还突破了熊市趋势线以及飞线5这根强劲的熊市趋势K线的高点。所以熊市旗形失败了，市场突破向上，交易者将会寻找市场上会出现的可以测量的向上移动距离。当然如果这个熊市旗形没有失败，他们将会期待市场会测试这一天的低点。但是一旦熊市旗形失败了，他们就认为市场会向上继续走高一些点位做多交易者将会在这一根K线的收盘处买入，因为市场接下来可能会测试这一天的高点。这一天K线的区间幅度只有5个点位，大概是最近平均日区间的幅度的一半，所以市场很可能会形成一段可以测量的向上或者向下移动的距离。在这个时点上，因为做空交易者刚刚平仓了，在市场出现至少两波上升浪之前，他们不太可能会再次做空，当然这意味着做多交易者在接下来的几根K线都会掌握市场。在这个时点上，如果市场会出现一段可以测量的距离，那么上行的概率要大于下行的概率。","pid":"p845"},{"t":"para","text":"K线14是一根熊市反转K线，它可能会形成一个更低的高点，一次失败的突破或者一个低点2的卖空机会。然而，正如我们在上面分析所说，市场在K线13的突破后很可能会形成至少两波上升浪，所以如果在此处做空，你将很可能会失败，而这失败又可能会形成一个突破的回调型做多机会。做多交易者因此会抓住一切低于K线14的低点的机会做多。比如，如果市场相较于K线14的低点走低了一个价位，并形成了一个价位的熊市陷阱，那么激进的做多交易者将会想抓住这个机会做多为了抓住这个机会，他们会将他们的限价买入订单设置在K线14的低点处。他们这样做的原因是，在K线14的下方很可能不会出现足够多的做空交易者，那么这些激进的做多交易者如果在下方设置限价买入订单就可能不能全部实现。因为做多交易者已经掌握了市场，所以在市场上的交易者很可能更愿意做多而非做空。或者，做多交易者可以设置一些只要市场跌到K线14的下方就买入的订单，或者不需要设置订单，只要市场跌到K线14的下方就果断买入。其他做多交易者会在K线14下方2至3个点位处设置买入限价订单。","pid":"p846"},{"t":"para","text":"其他做多交易者想在市场出现2至3个点位的回调时买入，所以会在K线14的高点下方7至11个价位处设置限价买入订单。如果市场正好回调了两个点位，大部分想在市场回调处买入的交易者正好会在K线14的高点下方7个点位处买入，而无法在最低点买入，因为市场下跌至低点处，很可能会出现竞价买单而很少卖单，这将导致做多交易者不得不以高于其一个价位的价格买入。","pid":"p847"},{"t":"para","text":"最后，许多做多交易者会将所有的做空时机看作是做多时机，他们认为市场上一定存在着在熊市收盘处做空的被困住的做空交易者。这些做空交易者一定会想在某些时点买回他们的做空头寸，而且会将他们的买入止损点设置在这根熊市反转K线上方一个价位处。聪明的做多交易者深请此道，他们会在被困住的做空交易者买回做空头寸时的价位做多。所以这些做多交易者也会在K线14上方一个价位处设置买入止损价位。","pid":"p848"},{"t":"para","text":"K线15向上突破了K线14这根熊市反转K线的高点，但是在收盘时出现了回调。K线14和K线15这个双重底部很可能不能成为一个牛市旗形，从而带来一波卖空潮，就像K线2和K线3形成的双重底部那样。另外，K线15的高点与开盘时的高点形成了一个双重顶部，所以这一天可以成为一个双重顶部熊市旗形，因此可能会在这天的低点下方继续下跌一段可以测量的距离。K线13、14和15一起形成了一个微型楔形。如果这个楔形被触发了，也就是市场继续下跌超过K线15的低点，那么市场很可能会出现两浪的震荡下跌调整。如果市场没有下跌，反而上升了，那么市场上的上升浪很可能会突破这一天的新高并且超过这个微型楔形，所以会出现更多的做空交易者做多平仓，而新入场的做多交易者则会利用这次突破进行刮头皮交易。","pid":"p849"},{"t":"para","text":"K线16是一根突破了趋势通道线的强劲的突破K线。这可能是一个买入高潮，也可能会在接下来出现持续至少一个小时的两浪模式的下跌调整。只要是在一段牛市趋势后出现了一根强劲的牛市趋势K线，那么很可能代表的是市场上力量的衰竭，伴随着市场上最后一波较弱的做多交易者的买入，以及最后一波较弱的做空交易者的买入平仓，强势的做多交易者和做空交易者都会等到这根强劲的牛市趋势K线收盘卖出（做多交易者卖出头寸获利，做空交易者卖空获得头寸）。手中还有空头头寸的交易者只能等到市场出现回调的时候买入平仓，而强劲的做多交易者也会在市场出现回调时再次买入。这种情况也同K线5代表的卖空潮有些类似。K线16的高点比昨天的高点低5个价位，而高点出现的区域一般也是市场的阻力区域，因此这些交易者都会在这个高点的上方寻找刮头皮交易时机，一旦市场向上突破阻力他们将获得一个点位的盈利。而有一些做多交易者将会在这根K线的收盘处买入因为他们在市场测试昨天的高点时离场可以获得一个点位的盈利。市场测试昨天的高点的可能性要大于市场突破今天的高点的可能性，但是也有可能会形成一个更低的高点，特别是在市场突破趋势通道线之后。一些新入场的做多交易者会在市场出现阻力或者回调时迅速离场，因为他们不愿意自己在市场的阻力区域中潜在的买入高潮中买入的头寸遭受到任何一点损失。其他的做多交易者会使用一个更宽泛的止损位，并且当市场与他们的方向相悸时继续增加买入头寸。这些交易者最终会取得成功。激进的做空交易者将会在K线16的收盘处做空。或者在K线16的高点或上方做空，还会在更高的点位处进行刮头皮交易，承担了大概相当于K线16的高点的价位的风险。因为K线16有两个点位的高度，所以为了获得一个点位的盈利他们承担了两个点位的风险，同时他们还会尝试在高于K线16的收盘价或者高点一个点位处卖出。他们没办法在更高的点位进行刮头皮交易，但是他们有能力在K线26这根强劲的熊市趋势K线处进行刮头皮交易，并获得一个点位的盈利。他们的盈利还将推动K线26之后出现的市场反转向上。记住，所有的交易者都会把每一个价位同时看作是买入和卖出时机，并且不断地评估两个方向的可能的交易所带来的利润。一天中会有很多次机会，做多交易者和做空交易者可以同时进行刮头皮交易并且获利，如果他们能够正确地管理他们的交易。K线16的收盘就是一个例子。","pid":"p850"},{"t":"para","text":"K线17在突破K线16三个价位后反转而下。这些晚入场的做多交易者很迅速地离开了市场，而激进的做空交易者则开始进行做空。K线17变成了一根强劲的熊市反转K线，做空交易者将在它的收盘处和低点下方一个价位处寻找做空时机。其他的做空交易者已经在更低的时间图表上做空了。这是一个熊市入场时机，做多交易者不会买入。一旦市场跌到了K线17的低点下方。做多交易者将会把这个看成是一个高于牛市趋势通道线的失败突破，他们和做空交易者认为市场会出现一波至少持续一个小时的两浪调整模型。做多交易者在这波调整结束之前不会积极地买入。因为交易者都在寻找这个两浪调整模式，做空交易者将会开始设置限价订单来做空一个更低的高点。上升至K线17的上升浪是一波强劲的牛市浪，所以做多交易者希望出现二个牛市通道和一波可测量的上升浪，他们希望这波上升浪的距离至少能达到从K线6或K线11的低点至K线17的高点的距离。","pid":"p851"},{"t":"para","text":"K线18并没有触发做空，而是变成了一根牛市内含K线。因为交易者都期待市场出现一个两浪调整模式，所以聪明的做多交易者不会在K线18的上方寻找买入机会，而激进的做空交易者将会在K线18的高点处设置卖出限价订单，在K线17这根熊市反转K线的高点上方两个价位处设置止损位。","pid":"p852"},{"t":"para","text":"K线19并没有完全满足在K线18的高点处设置的卖出止损订单同时它也没有触发在K线17和K线18的低点下方设置的卖出止损位相反，市场上现在出现了一个i模式。做多交易者，还是不会买入，而做空交易者将更加激进地做空。","pid":"p853"},{"t":"para","text":"K线20与之前的两根K线形成了一个i模式的入场时机，同时它具有一个熊市的收盘，这有利于做空交易者。聪明的交易者还是在K线17的下方寻找卖出时机（也是在讯模式的下方），同时也在一个更低的高点处寻找卖出时机。","pid":"p854"},{"t":"para","text":"K线21很可能会成为大家期望的牛市陷阱。它也是第二波上升浪（K线18是第一波），它比K线18高出一个价位，所以其他失误的做多交易者很可能会开始做多。市场上没有出现任何被困住的做空交易者，因为大部分保守的做空交易者会在K线17下方的止损位入场，但是市场还没有跌到K线17的下方。目前在市场上仅有做空交易者就是那些聪明的、激进的期待市场出现一个更低的高点的牛市陷阱的交易者。他们希望市场会困住这些做多交易者，因为一旦市场开始下跌，这些做多交易者将会不得不卖出他们的做多头寸，而这就将加剧市场上的卖出潮。此外，在做多交易者被困住之后，除非市场出现更多的价格行为，否则他们不会再次买入。聪明的做多交易者正在等待两浪模式的市场调整，所以他们不会在这里急于买入。而弱势的做多交易者会在这个模式中错误地买入。聪明的做空交易者会在这个ii模式的上方1、2，或3个点位处卖空，并在K线17的高点上方设置保护性止损位。做空交易者会在这根K线的下方寻找卖空时机，特别是在K线17这根强劲的熊市反转K线的下方寻找卖出时机。","pid":"p855"},{"t":"para","text":"大部分做空交易者会等待市场直到K线17的下方时再卖空，他们认为这是市场到底顶部的证明。","pid":"p856"},{"t":"para","text":"然而，聪明的做空交易者只会寻找进行刮头皮交易的时机，因为市场上的上升浪还很强劲，而这一天的整体浮动区间还是小于平均值。在这样的时点上，如果这个区间要扩展，那么上涨的可能性要大于下跌的可能性。同样，所有人都相信在买入高潮后出现市场的停顿，很可能接下来会出现不止一波的上升浪。市场的震荡向下调整很有可能会带来一个最终旗形和波动下跌，但是只有在市场出现了向上的突破后这些才可能会发生。","pid":"p857"},{"t":"para","text":"K线22将K线21变成了一个更低的高点的最终旗形卖空时机（之前的模式的下降三角形是一个最终旗形），但是这根K线没有向下突破i模式，所以那些想在这个旗形下方的止损位和K线17的下方入场的做空交易者也没有增加卖空头寸。此外，这根K线是在中间的位置收盘的，这意味如果交易者在这根K线的收盘处买入，一旦做空交易者掌握了市场，那么市场上发生的情况将与这些买入者的预期的相悖。","pid":"p858"},{"t":"para","text":"市场继续在K线25处进行横向盘整，市场正在形成一个狭窄的震荡区间，这也是一个突破入场时机。如果市场上有一至两根K线跌到了K线17的下方，做空交易者将会非常欣喜，因为这意味着市场上有很紧迫的情绪做空。市场正在横向盘整而非下跌，这也是牛市力量增强的迹象。此外，市场现在只高于移动平均线2个价位，因为市场在这里很可能会形成支撑位，且市场的调整期已经有10根K线的时长，所以做多交易者将会寻找重新做多的时机。这给做空交易者出了一个难题。一开始，他们只是希望有一个较大的机会进行做空刮头皮交易，现在看来，这个交易盈利的机会更少了。如果熊市突破停止了，他们就会迅速地平仓。K线25触及了K线17和K线21连成的熊市趋势线。同时形成了一个下降的三角形。当它在牛市趋势中发生的时候。这是一个牛市旗形。然而如果你只是看这些K线的主体，那么从K线21至K线25的K线都是处于一个狭窄的通道中。一个通道中通常会有三波助推浪，然后出现反转，就像一个形一样。K线22和K线24是两波下推浪。所以市场上只可能再出现一波下推浪，因此这个三角形的向下突破很可能会失败。","pid":"p859"},{"t":"para","text":"K线26是一根熊市突破K线，它在低点处收盘，且向下突破了移动平均线。新入场的做空交易者希望市场会继续下跌几个价位一样，从而他们所有的可以盈利的限价订单都会被触发且完全交易。然而，这根熊市趋势K线仅仅只在移动平均线下方一个价位处收盘，而如果是强劲的突破的话，收盘价应该至少还要再向下突破几个价位，就像在K线13处的牛市收盘突破向上突破了移动平均线几个价位一样，这也是市场对于突破开盘高点的突破的测试。即使激进的做空交易者在K线21这个强劲的牛市趋势K线的收盘处卖空，并不能获得一个点的刮头皮交易利润，如果市场再上涨，他们将会面对5个价位的失败。从而不得不买回他们的做空头寸。在K线16的收盘处或者更高处卖空的做空交易者将会在此刻买回他们的头寸。做多交易者把K线26看成是做空交易者试图将做市场上的始终在场策略反转为做空方向的尝试，但是他们知道大部分的反转都会失败。他们下一根K线必须是一根强劲的熊市趋势K线才能使得做空交易者确信市场已经反转了方向。因为市场上的牛市趋势是如此强劲，他们不得不怀疑做空交易者是否能够成功，甚至他们都不确信做空交易者是否能够推动市场跌至K线16这根熊市趋势K线的低点下方。基于此，他们在这根熊市趋势K线的收盘处买入，同时他们会在它的低点下方买入更多。其他做多交易者会在K线17的下方7个价位处设置买入限价订单，因为他们试图在牛市趋势中出现的2至3个点的回调中买入。","pid":"p860"},{"t":"para","text":"K线27是一根牛市内含K线，而且它可以在移动平均线上设置一个高点2的买入时机。它会演变成一段持续10根K线左右的两浪调整模型，时间足够做多交易者做多。在市场上涨至K线17的高点后，做多交易者希望通道会继续上升，而这波回调至移动平均线的回调可能是通道上升的开始。这也同样会是一个测试K线2的高点的突破测试。它还可以被看成是一个突破回调，做空交易者可以在它的低点下方做空，这也是K线26这根熊市突破K线的低点。做空交易者希望出现一个熊市主体从而增加市场反转做空的概率。一旦交易者看到了牛市收盘，他们就认从而增加市场反转做空的概率定做空交易者已经失败了，所以市场上的始终在场策略的方向还是做多所以他们会在这根K线的收盘处或者K线上方买入。","pid":"p861"},{"t":"para","text":"K线28是第二根牛市内含K线，并且与前一根K线形成了ii模式。在这个时点，交易者会怀疑市场是否在继续震荡区间，如果在市场上的卖方力量增强之前突破就暂停了，则这次突破失败了，那么做多交易者将会再次掌控市场。","pid":"p862"},{"t":"para","text":"K线29向上突破了这个i模式，成功地测试了移动平均线以及开盘区间的突破。然而，它仅仅突破了一个价位，并且是一根小型的熊市趋势K线，所以它也很容易被看成是从K线26开始的回调浪中的卖空时机。做空交易者可以在它的低点下方设置卖空订单。然而，在过去一个小时内卖空的做空交易者现在都关注的是市场上是否会给他们一个机会获得刮头皮交易的利润，但是市场并没有给他们这样的机会。所以他们不会持有他们的空头头寸太久。他们会在K线26熊市趋势K线的高点上方，K线23，24，25组成的三角形顶部，K线21这个更低的高点，K线17这个买入高潮的高点，以及昨天的高点处设置买入止损位。因为所有的这些止损位都是一个比一个高1至2个价位，所以一旦市场上涨他们都会依次被触及，导致做空交易者不得不放弃头寸，而做空交易者将掌控市场。","pid":"p863"},{"t":"para","text":"K线30突破了K线29的高点，并且高于熊市趋势线1个价位，但是没有超过K线26这个做空入场K线。这是两波上升浪，所以做空交易者会把它当作是从熊市突破中产生的可以接受的回调。但是他们依然很担心自己的空头头寸会受到影响。所以他们会很快买回他们的头寸。做多交易者也知道市场的调整有两浪，而现在已经持续了10根K线，所以他们的最低标准已经得到满足，所以他们已经准备好积极的买入，希望市场会上升至1127.50点位的区域。但这还远远不足以让他们放弃一些或全部的新的头寸。他们会将每一个做空止损位看作是买入时机，会在做空交易者平仓的价位买入。因为做多交易者和做空交易者在相同的价位买入，所以市场会上涨，并且会加速上涨。一些做多交易者也把这个震荡区间看作是楔形牛市旗形，把K线17看作是第一波下推浪，K线20看作是第二波，K线26看作是第三波。他们也把第三波下推浪看作是包含了一个小型的楔形，K线22，24和26分别形成了三波下推浪K线32和33都是小型的十字星，同时也是交易者决定设置买入止损位的迹象。在这个点上，做空交易者开始准备平仓，因为他们知道他们的空头头寸不过是反趋势交易的刮头皮交易头寸。他们很可能会在盈亏平衡点离场，或者还会有1至2个价位的损失。市场超过了移动平均线，在一个急剧的上涨后，牛市的迹象越来越明了。","pid":"p864"},{"t":"para","text":"K线34是一根牛市趋势K线，但是它的收盘价低于它的高点几个价位。市场在K线17的高点处和天的高点区域找到了卖方。","pid":"p865"},{"t":"para","text":"K线35给予了做多交易者刮头皮交易的利润，虽然比之前的高点高出1个价位，但却形成了一根熊市反转K线。许多交易者会在这根K线的收盘处卖空，但是还有一些交易者会在它的低点下方一个价位处卖空。激进的做多交易者不会被市场的回调所困扰，他们希望这不过是一次突破回调，之后还将带动市场上涨超越昨天的高点。只要市场超过移动平均线，超过K线26这个更高的低点，或者超越K线34这根牛市趋势K线的低点，他们就会一直做多。","pid":"p866"},{"t":"para","text":"在K线36做空的做空交易者很担心这根K线会在他们的入场价位处收盘，这样他们就无法推动市场下跌至K线34这根牛市入场K线的下方。他们将会在这根K线的收盘价或者高点上方平仓。一些做多交易者会在这根K线的上方做多，但是大部分做多交易者不会这么做，因为这一天已经持续了好几个小时的震荡区间，你这样做的话很容易就是买在了市场的高点附近。在一天的高点附近买入在强劲的牛市趋势中是非常好的策略，但是在这里并不适用。","pid":"p867"},{"t":"para","text":"K线37是一根牛市趋势K线。但是在三根近乎重叠的大K线上方买入并不是一个好策略。这三根K线其实组成了二个震荡区间，因为大部分的突破都是失败的。所以在震荡区间的顶部买入是非常有风险的。不出意外的话，在这个地方做空更好。","pid":"p868"},{"t":"para","text":"K线38比K线36高出5个价位，比昨天的高点高出1个价位，市场在之后反转向下。许多在这一日早些时候就做多的做多交易者会通过设置限价订单在昨天的高点处盈利，而激进的做空交易者也会在这里做空。在市场上升了5个价位之后，在K线37做多的交易者会将他们的止损位设置在盈亏平衡点附近，市场会在下跌的过程中触及这些止损位。K线38变成了一根强劲的熊市反转K线，但是因为它与之前的4根K线重叠的太多了，所以它形成的更像是一个震荡区间而非市场反转。这是市场第二次尝试反转开盘的高点，所以许多交易者会在这根熊市反转K线下方一个点位处设置卖空止损位。其他人则会寻找一个更低的高点的卖空时机。市场上涨至K线38的高点可以被看作是牛市趋势线被突破之后，形成的一个两浪模式的更高的高点。因此它也可以是一个潜在的趋势反转。基于此，做多交易者在再次买入之前还会等待市场出现一个两浪模式的调整。","pid":"p869"},{"t":"para","text":"K线39是一根十字星内含K线。做空交易者会在市场低于K线38的低点下方尝试做空，此时其他做空交易者会在一个更低的高点处设置限价卖空订单。他们会在K线39的高点，或者高于其高点1到2个价位处设置限价卖空订单。过度激进的做多交易者会把这个看作是一个高点2的买入入场时机（K线37是一个高点1），同时会在激进的做空交易者卖空的价位做多。市场现在处于一天中的中间三分之一的时段，所以很有可能会进入震荡区间，所以做多交易者不得不变得更有耐心，除非市场上牛市趋势再次变得强劲，否则他们就应该避免在高点买入。","pid":"p870"},{"t":"para","text":"K线41再次失去了支撑的力量，如果市场跌到了这根K线的低点下方，那些在K线40买入的激进的做多交易者将会马上获得两个价位的损失。做空交易者将会在这个潜在的更低的高点处卖空，但是他们不会激进地卖空，因为市场正在形成一些重叠的具有尾部的K线（这也是栅栏现象），所以市场上的突破行为很有可能会失败。通常来说在这些并排的K线的底部出现突破时买入，顶部出现突破时卖出是一个很好的策略。","pid":"p871"},{"t":"para","text":"K线42会使得这些在高点2做多的头寸平仓，其他的做多头寸会在K线38的下方以及信号K线的低点下方被平仓。","pid":"p872"},{"t":"para","text":"K线43会使得交易者怀疑市场是否形成了一个楔形牛市旗形。一个微型的，震荡的头肩顶通常会变成一个三角形或者一个楔形牛市旗形，而K线35和40就是肩部。因为交易者正在寻找一个楔形牛市旗形，所以他们正在寻找三波下推浪和一个高点3的买入时机。K线36和38是前两波下推浪，K线42开启了第三波下推浪，如果后面再出现一波上升浪，那么这个楔形牛市旗形（也是一个失败的头肩顶型）就被触发了。","pid":"p873"},{"t":"para","text":"K线44向下突破了K线36的低点一个价位，同时测试了超越K线27和移动平均线的突破。它也可以是一个信号K线，虽然它有一个熊市主体（在震荡区间的信号K线有时候看起来并不怎么明显）。只有当交易者在一个强劲的趋势中准备反趋势交易时，他们才需要非常明显的信号K线，而在其他时候信号K线往往会看起来非常弱。激进的做多交易者将在K线36的低点设置买入限价订单，并期待任何突破了低点的突破在持续了几个价位后都会失败。其他做多交易者会在这根K线上方的高点3处买入，因为它可能会成为一个楔形牛市旗形。如果市场超越了K线44的高点。那么就很可能会形成一个5个价位的熊市陷阱，这将逼迫被困住的做空交易者买回他们的头寸。","pid":"p874"},{"t":"para","text":"K线45触发了买入限价订单，虽然它只比K线44的高点高1个价位。在一天的中间三分之一的时段。市场往往会缺乏动能。虽然说价格行为的实际形态是非常可靠的。其他交易者将会在K线45的上方买入，因为他们把它看成是两根K线的反转。此外，许多交易者会选择在牛市K线的上方买入，因为牛市收盘在一定程度上已经说明市场朝着他们需要的方向前进了一小步。","pid":"p875"},{"t":"para","text":"K线49给予了做多交易者一个点位的刮头皮交易时机，但是许多做多交易者还是会抓住每一次信号买入，一部分用来做刮头皮交易，剩下的用来做波段交易。市场抛物线一般上升至K线17的高点也可以是一波上升浪，而之后出现的震荡区间移动平均线上找到了支撑力量，因此会形成一个通道。波段做多的交易者继续买入，并将他们的保护性止损位设置在最近的震荡低点的下方，也就是K线44的下方。","pid":"p876"},{"t":"para","text":"在剩下的时间里，还有很多类似的交易，这也说明了如果交易者有能力聚精会神地阅读并理解图表，他们可以在一天的时间内抓住几十次刮头皮交易时机。然而，极限刮头皮交易对于大部分的交易者来说都是一个失利的交易策略，他们不应该轻易地尝试这个策略，而且他们不应该承当比回报更高的风险。相反，他们应该把精力更集中在其他更容易成功与实现的交易方法上。这一章主要是为了告诉大家在每一张图表上出现的情况都比你想象的多得多，所以交易者需要在一整天的时间里都保持不断的思考。在今天的图表上，有很多的入场时机交易者可以获得至少与风险相当的回报，但是他应该认真思考他能够看到的每一个入场时机。这个图表只是说明了一个交易者在一天的时间内可以做出多少决定。大部分有经验的交易者都应该只交易其中一部分的交易时机。","pid":"p877"}],"wcount":15349}],"wcount":56128},{"id":"p3","icon":"第三篇","title":"第三篇 第一个小时（开盘时段）","blocks":[{"t":"para","text":"第三篇　第一个小时（开盘时段）","pid":"p878"},{"t":"para","text":"我曾经与一位一次性交易了100张国债期货合约的交易员在线讨论过很多次，但每天早上7点半到8点之间他都是离线的。他说他分析过自己的业绩，发现他85%的利润都是在开盘后第一个小时内赚到的，并认为当天剩下的时间里虽然同样筋疲力尽地工作，但都是浪费精力，而且这种疲倦的状态会持续到第二天。所以他从几年前开始便工作一个小时左右就停止交易，并且在第一个小时交易就已经做得很好。","pid":"p879"},{"t":"para","text":"以下是第一个小时交易的一些特征：","pid":"p880"},{"t":"para","text":"这里所说的第一个小时并不是恰好一个小时。它是指开盘后第一个正常波段的交易时间，可以是15分钟或两个小时，通常称之为开盘时段。","pid":"p881"},{"t":"para","text":"这是赚钱最容易的时间段。通常，经验丰富的刮头皮交易员清楚价格反转是很常见的。这些交易员往往能够做很多精挑细选的刮头皮交易，他们认为这个时段的突破尝试通常以失败告终。正如当天其他典型的突破尝试一样。他们伺机低买高卖。一般情况下，他们回避十字星信号K线，但总是一波上涨后在某根阳线或阴线下方做空，或一轮下跌后在某根阳线或阴线上方做多连续同方向的趋势K线通常可以代表他们接下来刮头皮交易的方向。连续两根强势的阳线通常会使刮头皮交易员买入。而连续的阴线则会让他们更倾向于做空。","pid":"p882"},{"t":"para","text":"这是赔钱最容易的时间段。新手交易员看到大型趋势K线时总担心失去一个巨大的突破机会。他们动作太慢，在强阳线高潮顶部买入，或在强阴线尖谷底部卖出，这样一来只会反复亏损。这个时段有更多变量需要考虑，入场形态也成型得十分迅速。他们常常将波段形态和刮头皮形态相混淆，最后导致交易失误。他们绝对不应该进行刮头皮交易，尤其在开盘后第一个小时内。","pid":"p883"},{"t":"para","text":"当K线很长的时候，交易员应该放大止损幅度，减小交易规模。","pid":"p884"},{"t":"para","text":"昨天收盘前的趋势方向往往会延续到今天的开盘时间。","pid":"p885"},{"t":"para","text":"反转都是很常见的，让人措手不及，而且反转幅度往往很大。如果你跟不上价格的快速变化，就应该耐心等到市场放缓，这样你的投资方向才能变清晰起来。","pid":"p886"},{"t":"para","text":"一天中的第一根K线成为当日高点或低点的概率只有20%左右，因此没必要在第二根K线就急于入场。事实上，我们在任何时候都不应该仓促交易，因为行情在不久之后总是会朝着明确的方向发展，这样一来我们交易成功的可能性就会更高。","pid":"p887"},{"t":"para","text":"一天中的最高点或最低点通常会在第一个小时内形成，所以波段交易员需要耐心等待一个可能成为当天极值的入场形态。当日高点或低点的入场形态只有40%的成功概率。但由于回报可能比风险大很多倍，此时波段交易员的盈亏方程式仍然是非常好的。大多数交易员应该把他们一天当中最重要的交易重心放在开盘时段的一个逻辑反转上。这种交易在前五根或更多K线的时间内看起来很糟糕，但随后突然间就会有所突破。大多数交易员的交易方向也逐渐变得明朗起来。在大部分交易日里，交易员在捕捉一次成功的波段交易之前，必须经历多次反转，但即使那些幅度很小的反转也足以令交易员获得小幅利润，或者只有小幅亏损。这就为这种特殊的胜率相对较低的交易类型创造了有利的交易员盈亏方程式。","pid":"p888"},{"t":"para","text":"一天中的最高点通常始于某种类型的双重顶，尽管该双重顶很可能不精确。一天中的最低点通常始于某种不完美的双重底。","pid":"p889"},{"t":"para","text":"一旦趋势方向开始变得清晰，交易员们可以市价入场，也可以在任意小幅回调时入场。进行波段交易。有经验的刮头皮交易员则会等待回调时进行顺势刮头皮交易。","pid":"p890"},{"t":"para","text":"市场报告出现后几分钟内的交易都是由程序化交易主导的，很多计算机几乎瞬间就收到数字版本的市场报告，并使用报告中的数据来生成交易指令。其他交易程序则属于统计范畴，而非基本面交易。在这样一个大环境下你的竞争对手在决策和交易方面都拥有更快的优势，你很难与之匹敌。所以在入场之前等待一两根K线是比较明智的。","pid":"p891"},{"t":"para","text":"大部分交易日都有开盘跳空的现象（见第20章开盘跳空）。","pid":"p892"},{"t":"para","text":"开盘的走势往往预示着一整天的行情。如果第一根K线是一个十字星或前几根K线反复振荡，并且有上下影线，那么这一天很可能出现许多振荡区间。","pid":"p893"},{"t":"para","text":"通常在太平洋时间早上7点会有市场报告发布。即使报告没有在互联网上公布，市场也通常表现得像有报告公布一样。计算机在分析数据和订单处理方面具有明显的速度优势，它们是你的竞争对手。当你的竞争对手拥有很大优势时，停止交易。等待他们的优势逐渐消失，当速度不再重要时再进行交易。","pid":"p894"},{"t":"para","text":"第一个小时，或者更确切地说，开盘时段是指市场形成当天第一波趋势的时间，一旦趋势开始就意味着这一开盘时段结束。这个时段通常持续几个小时，有时短至15分钟。这是赚钱最容易的时候，也是最容易赔钱的时候。这是因为这个时间段里生成的K线还不够多，许多交易员不能足够快地处理所有变量，掌握的信息也相当有限。他们需要判断是进行波段交易还是刮头皮交易，还是两种风格的交易都要尝试，必须根据胜率、风险和回报这三个交易员盈亏方程式的变量做出决定，而当前真实状况是，经常有经济报告发布，经常有反转出现，K线也往往很长，这就要求他们根据现实情况把自己的风险偏好调至高于正常水平，而一天中的其他时间里风险偏好通常都是一个固定值，并不需要做过多考虑。明白了吗？交易员有更多的问题需要思考但却没有更多的时间。计算机在分析数据和订单处理方面具有明显的速度优势，它们是你的竞争对手。当你的竞争对手拥有很大优势时，停止交易。如果你在想，“我希望我的交易速度比得上那些使用电脑进行程序化交易的公司”，但是现实会让你不堪一击。等待他们的优势逐渐消失，当速度不再重要时再进行交易。","pid":"p895"},{"t":"para","text":"交易困难重重，优势却总是很小，而第一个小时的交易复杂性又超出交易员有效交易的能力范围。如果为了交易获利需要考虑太多的变量，那么交易员可以通过减少变量的数量来增加自己交易的成功率。例如，他们可以寻找高胜率的刮头皮机会，或只交易可能的波段形态，或者他们可以等到有明确的交易方向之后进行波段交易，或在回调时顺势刮头皮。他们也可以先交易正常规模的一半到四分之一的仓位，以超出信号K线长度的幅度进行保护性止损，这种止损幅度通常要比往常的幅度大两倍或更多。","pid":"p896"},{"t":"para","text":"造成亏损的最大原因之一是交易员无法区分波段交易和刮头皮交易的入场形态。从交易员盈亏方程式中可知，刮头皮交易员必须赢得60%以上的交易，因为他们所承担的风险通常与盈利幅度差不多大小。刮头皮交易的入场形态比波段交易更为常见，但大部分刮头皮形态的胜率达不到60%，我们应该尽量避免这种交易。然而，反转形态在开盘后第一个小时内是非常常见的，交易员们往往没有足够的时间来充分评估交易员盈亏方程式。如果他们默认介人每一次反转，入场交易后再进行具体计算，那么时间久了最后一定会亏钱。当天的高点或低点往往伴随着一个胜率不足50%的入场形态，因此是一个糟糕的刮头皮机会，但对于波段交易来说又可能是一个不错的入场形态。","pid":"p897"},{"t":"para","text":"经验丰富的交易员会在开盘后第一个小时内找四次或更多的刮头皮交易机会，甚至能够靠这些交易维持生计。例如，如果他们平均每天做两笔盈利的刮头皮交易，每笔利润两个点，那么平均每天交易25张电子迷你期货的话，每年可以赚100万美元。当大多数交易员不得不快速做出决策时，他们没能可靠地处理风险、回报和胜率的关系，也没有足够有用的信息。所以第一个小时内反转来得迅猛而突然时，他们不应该追求刮头皮交易的利润。相反，他们应该耐心等待一个可能产生趋势性波动的入场形态，或者一直等到波段趋势启动，市场有了明确的方向，然后再进行波段交易。这时他们获得的回报将大于他们所面临的风险（可能是两到三倍的幅度），既然市场方向明朗了，他们将有60%或更高的成功概率，市场会顺着他们的交易方向跳动很多个价位，波动幅度至少与止损幅度相当，他们可以把止损点进而移至盈亏平衡点。","pid":"p898"},{"t":"para","text":"许多有经验的交易员会在开盘后第一个小时内寻找强趋势K线或连续的趋势K线，然后回调时进行刮头皮交易。例如。如果出现连续两根强势阳线然后是一个十字星，那么他们可能会在十字星低点处或低点下方挂单买入。交易员们认为这个十字星是一个微弱的反转信号，特别是出现在如此强劲的上涨势头之后，预期反转失败。这意味着在K线下方卖出的空头，不得不将空头头寸买回来，而且在一两根K线的时间内很可能不会再次卖出。这就把空方力量挤出市场，甚至将一些空头转变为多头。也就让做多的刮头皮交易员有了可乘之机。保护性止损幅度和目标止盈幅度的大小取决于K线的长度。如果电子迷你期货的平均每天波动的幅度在15个点左右，而阳线的高度约为两个点，如果他们相信有60%的成功机会，那么，交易员们可能会以两个点的风险去博取两个点的利润。而事实确实如此。另外一些多头可能会在更低的价位刮头皮，承担行情跌至阳线底部下方的风险。只有经验非常丰富的交易员才敢于在第一个小时内行情突破时反手交易，因为这时候的波动通常很快，运动幅度也很大。交易员必须对其价格行为的解读能力以及在快速多变的市场中管理头寸的能力非常有信心。","pid":"p899"},{"t":"para","text":"在开盘后第一个小时内行情变化可能很快，交易员常常陷于长趋势K线的兴奋之中而耽误了操作。他们知道一轮趋势将会很快启动，生怕错过这波趋势进而追涨杀跌，反而被套进市场反转之中。市场在第一个小时内寻找方向，反转是很常见的。交易员们自认为可以进行波段交易了，行情却往往在下一根K线就出现反转。然后他们必须决定是先暂时离场还是等着价格超出信号K线触发止损。当他们做这个决定时总是一成不变地发现反转交易要比他们现在所做的波段交易要好，他们绞尽脑汁想办法如何最大程度地减少损失，并朝另一个方向进行交易。他们持有的时间太长，希望行情回调，却导致离场时带来了比他们预想中更大的亏损。不仅如此，因为损失惨重，他们变得焦躁不安，需要平复心情才能进行下一次交易。等到他们准备好再次入场，市场已经朝着新的方向走得很远了，即使趋势表现强劲。他们也不敢轻易再进行交易了。一天的交易结束后，他们打印出当天走势图，简直不敢相信入场形态实际上如此清晰明朗。但事实上后见之明与盘中的实时感受非常不同。","pid":"p900"},{"t":"para","text":"应该进行波段操作的头寸，交易员做成了刮头皮交易，这也可能导致交易员赔钱。如果他们在本周早些时候失去了几次他们认为比较好的波段交易的机会，他们则会对今天开盘时段的交易持谨慎态度。假设本周早些时候这几次交易机会只足以让一个刮头皮交易员获得盈利，随后行情快速反转，并迫使这些波段化的交易员认赔离场。如今，他们便决定在开盘后第一个小时内只做刮头皮交易。他们在头两次刮头皮交易中失败了，但第二次被震仓出局时，触发止损的K线突然反转，走出一根外包线，使得行情在他们原来所持有的波段头寸的方向上形成一股强劲的势头。由于他们只想在反转时做刮头皮交易，当市场持续无情地呈现趋势性走势时，他们只能在场外驻足观望。价格朝一个方向跳动了八个点才开始回调，他们突然意识到这一波段所产生的利润相当于四笔成功的刮头皮交易。","pid":"p901"},{"t":"para","text":"他们利用低成功率的入场形态尝试刮头皮操作，由于频繁地被震仓出局而放弃了波段交易（只是在放弃波段交易后错过了一轮大的趋势），经历了几天的亏损，交易员们开始有些困惑不安了。他们觉得自己做的每件事都是对的，但还是失败了，这样的交易太不公平了：“为什么别人在第一个小时能做得这么好，而我不管怎么努力最后还是亏钱？”这是因为他们交易太频繁了。他们在成型中的区间顶部买入，底部卖出，总是希望能成功突破，却拒绝承认大部分突破尝试都不成功的事实。他们也不选择在最好的入场形态上进行波段操作，总觉得这种形态看起来很弱，似乎会如过去一小时里那五次反转一样，以失败告终。当交易员有这种感觉的时候，他们应该在开盘时段暂停交易，直到市场方向变得清晰之后再考入场。没错，在趋势已经走了几个点后他们再入场，虽然这样利润较少。但成功的概率却高得多。与其希望在一天内数次亏损后找到第一个小时有利可图的交易模式，不如一开始就坚持薄利多销的原则。即使利润少一点也总比一天亏损几次要好得多。","pid":"p902"},{"t":"para","text":"成功的刮头皮交易员通常会在开盘后第一个小时内就调整策略。一般来说，刮头皮交易员所承担的风险，往往不小于他们所获得的回报，但最好先看看是什么样的风险，确定风险之后再设定合理的回报。例如，如果电子迷你期货的K线通常约两个点的振幅，但今天却扩大到约四个点，那么交易员可能就要冒四个点的风险。市场波动很快，在解读图表和设置交易订单时，很难花太多时间去做精确的数学运算。刮头皮交易员应该迅速砍减一半或三分之二的头寸。他们做什么都没有关系。重要的是他们不想太多，迅速做出决定，集中精力去做更重要的事情：正确读图和下单。如果他们不愿意在必要时使用更大的止损幅度，他们就应该停止交易。而且，交易员一旦入场，而市场回调的幅度超过他们的预期（但没有触发止损价），然后趋势恢复，但看起来比预期疲弱，他们必须以较小的目标价位止盈离场。例如，大型K线可能会迫使他们在电子迷你期货交易中冒四个点的风险，但是一旦行情顺着他们的方向继续波动，这些风险看起来就显得很微弱。如果他们认为先前假设的前提不再有效，那么就必须改变目标。以一两个点的盈利离场。然后等待更多有用的信息，这绝对是更明智的选择。","pid":"p903"},{"t":"para","text":"只有经验丰富的交易员，能够快速适应不断变化的持仓、止损价和盈利目标，才能在开盘后一小时内尝试刮头皮。刮头皮交易的风险通常与回报相当，因而要求更高的胜率，大多数交易员应该避免刮头皮交易，尤其在开盘后第一个小时内。如果交易员能在市场上等待一个明确的趋势信号。然后进行波段交易，从长远来看，这些交易员更有可能实现稳定的利润。这意味着获得与风险相当的回报的概率在60%或以上，然后他们可以制定一个至少与风险一样大的盈利目标，最好是风险大小的两倍，从而获得一个有利的交易盈亏方程式。","pid":"p904"},{"t":"para","text":"由于开盘后第一个小时内会发生许多反转，交易员最好伺机低买高卖，直到市场趋势逐渐变清晰。遗憾的是，很多交易员的做法恰好相反。当他们看到大型的趋势K线向上升或向下暴跌时，总是担心错过突破的机会，但其实这些突破几乎总是无功而返。他们必须学会等待一个已经确立的突破和趋势清晰的市场。然后，他们切换到波段操作的交易模式，当市场呈现多头格局时在顶部附近买入，当市场呈现空头格局时在底部附近卖出。如果交易员不能快速区分波段操作和刮头皮操作的入场形态，他们就不应该贸然做决定。相反，他们应该耐心等待一个清晰的信号，然后再开始进行交易。大多数交易员都不能在第一个小时内成功实现盈利，当然，他们也不能把一开始的刮头皮交易在时机合适时切换波段交易。他们应该耐心等待波段交易的入场形态。","pid":"p905"},{"t":"para","text":"开盘后第一两个小时内可能频繁产生入场信号，从而引出大幅度的波段交易，交易员们必须做好准备迎接它们。虽然我们习惯性认为在第一个小时内出现的形态和平时有所不同，但从价格行为的角度来看并不如此。这些入场形态和一天中的其他时间、其他周期的形态都是相同的。不同之处在于波动率往往更大，形态成型的速度更快，反转常常出乎意料。在趋势爆发之前，这种反转通常看起来很弱势，并伴随着两三个疲弱的十字星。我们要知道这是很常见的。如果你入场后看到这种微弱的态势，不要急于平仓。要相信自己对价格行为的解读，因为你很可能是正确的，并依靠这一点来获取更大的波段利润。","pid":"p906"},{"t":"para","text":"开盘时段的另外一个不同之处在于，很多交易行为都是建立在对前一天价格行为分析的基础之上。前一天收盘前最后一两个小时里通常都会形成一条通道，今天开盘后，价格要么突破通道，要么大幅跳空，越过这一旗形。无论哪一种情况，都应该密切关注反转形态和持续整理形态。请记住，通道就是一种旗形，因此上升通道就是一个下降旗形，下降通道就是一个上升旗形。而且，如果市场在收盘时确立了其多头或空头格局，交易员们应该假设这种趋势会延续下去，直到他们看到行情即将反转的证据。","pid":"p907"},{"t":"para","text":"最后一个重要的区别是，大部分交易日的高点或低点都发生在开盘后第一个小时左右，尝试把这时候在高点或低点入场的交易波段化将非常有利可图。如果你正在做的交易存在这种可能性，而且市场正随着你的交易方向剧烈波动，那么利用盈亏平衡点来止损，将使你获得开盘后更大的利润。","pid":"p908"},{"t":"para","text":"虽然开盘后第一个小时左右的任何反转都可能产生当天的最高点或最低点，但某一次特定的反转形成高点或低点的概率通常不超过50%。如果反过来交易员在行情反转后等待后续清晰的市场运动，那么这次反转形成高点或低点的概率则往往超过60%。等待市场格局确立的交易员以利润降低为代价来提高胜率，但对于喜欢高胜率的交易员通常不介意这种折中的做法。一天中对最高点或最低点的判断常常只有40%到50%的准确率，因此一般情况下这是一种糟糕的刮头皮交易入场形态，尽管它对于波段交易来说有着一个利润可观的交易盈亏方程。当趋势确立的时候，往往启动比较缓慢，看起来根本不像一轮趋势，但是通常在五根K线左右就会有所突破，并进入一个清晰的市场格局。大部分时间里，上涨趋势日的入场形态是某种类型双重底的一部分，尽管通常看起来并不是十分完整的双重底。同样道理，下跌趋势日的入场形态则通常是一个不完美的双重顶的一部分。例如，如果开盘后行情走出一系列强劲的阳线，然后开始部分回调，并在五到十根K线后得到测试，这将形成一个双重底旗形入场时机，并有很大机会创出当天新高。突破新高后可能走出一波可测量的上涨行情，并启动上涨趋势。","pid":"p909"},{"t":"para","text":"当天第二根K线突破超越第一根K线的高点或低点时，交易员常常选择在第二根K线入场，但这笔刮头皮交易的成功率往往低于50%，具体概率取决于当时不同情况。这意味着此时交易员的交易盈亏方程式仅对波段操作有意义，可是交易员往往错误地把这笔交易当作刮头皮来操作，而当成功率只有50%左右，风险等幅于回报时，这种方法在刮头皮交易中是不适用的。他们说服自己将进行波段交易，并在回调过程中继续持有头寸，可是没过一会儿，他们在一两根K线中抓住了一点利润后，又开始觉得心满意足了。他们实际上是在进行刮头皮交易，却一直没有意识到这点，于是每逢月底他们总是很疑惑自己究竞为什么会亏钱。这是因为他们运用了一个失败的交易员盈亏方程，风险与回报不成比例。在开盘后第一个小时内的一些反转有70%的机会触及刮头皮交易员的盈利目标，但却只有40%的机会能达到波段操作的目标价位。交易员们必须在事前就计划好如何管理交易头寸，因为入场后再改变盈利目标是一个失败的策略。你不可以事先做了一个的假设，然后又基于另外不同的假设来管理你的交易头寸，但在开盘后第一个小时内市场各种情况变化迅速，大型的K线在成型过程中又伴随着大幅回调时，交易员们混淆刮头皮交易和波段交易的情况是很常见的。","pid":"p910"},{"t":"para","text":"一天中的第一根K线大约有20%的可能性成为当天的最高点或最低点（开盘大幅跳空的交易日除外，如果第一根K线是一根强趋势K线，那么它成为当天高点或低点的概率可能在50%以上）。另外，这第一根K线往往幅度较大。通常达到平均日振幅的20%。例如，如果电子迷你期货每天的平均波动范围约10个点，而今天第一根K线就有两个点高，那么当第二根K线向上突破第一根K线时买入的交易员就有20%的机会在面临略大于两个点的风险的情况下，赚取八个点的利润。这是一个赔钱的交易员盈亏方程式。如果交易员非常善于主观地评估所有变量并选择更高胜率的交易，而且他们还拥有数学上的优势，但这些基于第一根K线的高胜率的交易每月大约只发生一次。在这种交易下交易员一旦成功，获得的回报将是风险大小的两倍，即便如此，他们一个月也只成功几次，因此在第二根K线上寻求波段操作的入场时机是不值得的。然而，由于在大部分交易日里，开盘后第一个小时都会出现可靠的波段，回报的大小是风险的两倍，如果早期出现强势的反转入场形态，交易员则应该考虑进行波段交易。一旦趋势延伸的幅度达到他们止损幅度的两倍，他们就可以将止损点移至盈亏平衡点，并继续持有部分头寸直至反转开始。","pid":"p911"},{"t":"para","text":"有时市场会在当天的第一二根K线开始趋势运动，而第一根K线最终成为当天的一个极值。如果市场在开盘时就启动趋势，及早入场是很重要的，但不一定非要在第二根K线就入场。这种模式在开盘跳空时最为常见，不论是大幅跳空还是小幅跳空。当你在一轮大型趋势的起点入场交易时，尝试将一些头寸进行波段操作尤其重要。如果这种形态很强势，你可以将大部分头寸都波段化，然后迅速把止损点移至盈亏平衡点。","pid":"p912"},{"t":"para","text":"然而，如果强劲的开盘势头被反转了（反向突破至当天的一个新极值），那么当天有可能会朝相反的方向发展，也可能演变成震荡行情开盘启动的强劲趋势，即使是被反转了，这波趋势仍然意味着交易员愿意积极地顺着那个方向继续做单，如果反转表现犹豫不决，他们会很快沿着这个方向再次交易。","pid":"p913"},{"t":"para","text":"即便你觉得市场反转向下并不能形成当天的日内高点，你也不能太肯定（把握不超过30%），因为市场在开盘时还在形成一个开盘价格区间，波动充满不确定性。事实上，市场在任何时候都充满不确定性。这种优势太过巨大，交易员们很快会在优势变得明确前就把它中和掉。不要过于执着某个观点，尤其在开盘后第一个小时内，即使最强势的波动在下一根K线上也可能发生迅猛的反转。不过，虽然第一两个小时的反转可能只有30%到40%的概率达到当天的高点或低点，但如果后续行情走势配合的话，概率很可能迅速提高至50%到60%。","pid":"p914"},{"t":"para","text":"虽然早期的反转有利于刮头皮操作而非波段操作，但一旦某次反转表现异常强劲时，交易员就应该试着把至少一半的头寸波段化。正如前面所述，开盘后第一两个小时内的交易，是最有可能使交易员实现回报两三倍于风险的交易。一般来说，大多数交易员都应该在开盘后第一两个小时里努力尝试潜在的波段交易，因为这些交易将回报、风险和胜率有效地结合，构成一个最佳的交易员盈亏方程式。","pid":"p915"},{"t":"para","text":"为什么市场会在前几根K线大幅波动，然后出现反转呢？为什么不能单纯地在低点或高点处开盘呢？一天的开盘价不是由任何公司或集团决定的：相反，它代表着开盘瞬间多空双方一种短暂的平衡，这通常取决于盘前的市场行为。例如，电子迷你期货基本上是一个24小时不间断交易的市场，在纽约证券交易所开盘前数小时内一直交投活跃。如果这些机构每天都有大量的买入计划，为什么市场还会在昨天收盘价之上开盘，并开始下跌，然后反弹至新高？如果你是一个机构交易员，今天要下很多买入订单，你会比较喜欢市场在你预期的买入点上方开盘，然后急剧下滑到你的买入区间，你就可以和其他拥有许多类似客户订单的机构一起积极买入：然后你希望看到一波小规模的抛售高潮，形成一个有说服力的当天低点。缺乏看涨机构投资者的买入力量，创造了一个抛售真空，可以很快地吸引市场跌至他们的买入区间，这个区间总是处于某一个支撑位。交易员在这个区间中激进地大举买入，在此处形成当天低点。","pid":"p916"},{"t":"para","text":"如果开盘时从抛售高潮处反弹向上的势头足够强劲，那么很少有交易员会做空，因为这时都会达成普遍共识，认为上行动能足够强大，在回踩低点前至少可以走出第二回合的上升小波段。如果你是一个机构交易员，为了促成这种情况发生，你有什么可以做的吗？当然！你可以在收盘前买入推动价格上涨，并执行部分订单。在太平洋标准时间上午6：30开盘前，推动股票价格并不需要多少成交量。然后，一旦市场开盘，你就可以平掉部分或全部多头，甚至做一些空单。既然你想以更低的价位买入，那么不要在市场下跌时就开始交易，你应该等到市场跌至你认为合理的价格区域，通常是某个支撑位。这就是典型的真空效应。买方在这里观望，但如果他们认为几分钟后价格会更低，他们就不会入场。如果几分钟后能够买在更低的价位，为什么还要现在就入场呢？尽管存在非常强势的多头力量，但这种买盘缺位导致价格迅速下跌。一旦到达他们的买入区间，他们就会怀疑市场是否还有下跌空间。他们突然冒出来大举买入，结果导致非常迅猛的多头反转。空头也会注意到这个支撑区域，如果他们认为这个下降小波段已经完结，那么他们也会由卖转买，获利了结自己的空头持仓。","pid":"p917"},{"t":"para","text":"价格行为是非常重要的。交易员希望看到市场一旦触及某个关键支撑位后会如何反应，比如触及移动平均线，或前一个波段的高点或低点，或前一天的低点，或趋势线及趋势通道线。大部分交易都是由计算机完成的，计算机通过其算法来计算这些支撑水平的位置。如果有足够多的公司看准相同的支撑水平，那么在这个位置上买盘将压倒卖盘，市场将反转向上。我们不可能提前知道买盘的力度有多大。但由于支撑位总是基于数学算法得出的，而经验丰富的交易员通常能够预测可能出现反转的价格区间，从而做好准备随时进行交易。如果下行动能开始衰弱，市场开始从关键价格处反转向上，机构将平掉所有空头，并积极地执行买入订单。由于大多数公司都开始执行类似订单，市场将开始反弹。如果某家公司觉得当天低点已经形成，它将在市场反弹时继续买入，并在任何回调时更加积极做多。由于机构的订单规模巨大，它不希望一次全部买入而导致价格升并形成一个买入高潮。相反，它宁愿在一整天中保持有条不紊地买入，直到所有订单都被执行。随着订单不断成交，持续的买盘导致市场进一步上涨，吸引动能型交易员也在一天内不间断做多，从而增加买压。","pid":"p918"},{"t":"para","text":"这就是实际发生的情况吗？机构交易员能知道这一切是不是他们的所作所为，但对于任意一个交易日而言，没有人能确切知道市场为什么发生反转。反转产生的原因不计其数，但那些理由都是不相干的。重要的是价格行为。反转通常发生在报告发布后的几秒钟内，但个人交易员不太可能仅仅通过收看CNBC来了解市场对报告的反应。市场的反弹或回落，与看涨或看跌的报告息息相关，在缺乏对价格行为分析的情况下。交易员根本没有资格对报告进行合理的解释。了解市场变化最好的方法就是观察它的反应，并随着价格行为逐步展现，设置好自己的交易。通常来说，报告发布前的那根K线就是一个很好的入场形态，这种形态在报告发布时被触发。如果你感觉自己有必要在报告发布时进行交易，那么就设定好止损，并相信自己的读图结果。由于报告发布期的价格滑点可能非常显著，等到报告发布完毕再做交易是一个更好的选择。如果你在报告发布期入场了。你可能会发现在入场时遭遇了几个滑点，随后市场剧烈反转，你在离场时又遭遇了更多的滑点。这就导致在你预想中风险只有8个价位的交易，结果令你亏损了16个或更多价位。如果你在交投清淡的市场中进行交易，你所面临的价格滑点可能更加严重，很可能在第一个小时就损失惨重，以至于在收盘时都无法回到盈亏平衡的状态。","pid":"p919"},{"t":"para","text":"在太平洋标准时间上午7：00报告发布时，市场迅猛拉升，通常是因为这些机构已经计划买入，但他们希望买在更低的价格上。当这份报告看起来足够乐观，让他们认为当前已经是能够买入的最低价格时，他们就会在报告发布时做多。如果他们的买盘需求足够大，他们将持续一整天做多，而这一天将成为趋势交易日。另一方面，如果他们的原始买盘被其他机构压倒，其他机构希望当价格出现反弹时以便在更高的价位做空，那么上行突破就会失败，市场转而趋势向下。这些空头一开始是市场看不见的，因为他们正等待反弹时做空，只有当他们开始大举做空并令市场从反弹中回落时，这些空头力量才会显现出来。很显然，各种不同的因素同时发力，但很多动能型交易员对报告内容并无特别见解，只是沿着趋势运动的方向重仓交易。不过，机构投资者对报告理解的偏差也是重要的组成部分。这些机构已经知道报告发布前他们想做些什么，尽管报告会有意外情况发生。","pid":"p920"},{"t":"para","text":"大约70%的交易订单都是自动的，这种计算机生成的买盘和卖盘将变得越来越重要。道琼斯公司现在有一项名为“词典”的新闻服务，将机器可读的财经新闻传送给订阅者。词典扫描所有道琼斯股票的资料，并将这些资料转化为某种形式的信息，计算机的算法可以利用这些信息来决定短时间内买入和卖出股票。有些算法以报告中的基本面因素为基础。上个月创造了多少就业机会？核心消费者价格指数（CPI）是多少？债券拍卖中的投标比例是多少？其他算法则在更长的时间周期中运行。并分析股票的业绩和盈利报表，除了为新闻提供素材外，还帮助制定交易策略。还有些其他算法纯粹基于数学统计，比如电子迷你期货在几乎毫不回调的情况下反弹10个点，那么就以市价买入，然后以两个价位的利润卖出。还有些公司也可能找到另一种数学统计的方式，编制出在反弹时做空以三个价位获利了结的程序。我们不可能知道每个公司在做什么，但是如果有人想出一个主意，而且这个主意可以被测试。并从中得出坚实的数学基础，那么他们公司的计算机很可能已经运用这种方法在进行交易了。有些公司可能使用基本面和数学统计相结合的算法。如果经济数据利好，电脑程序会立即买入，但如果有统计数据表明在这种特殊的经济数据环境下，电子迷你期货在反弹三个点后将反转至一个新低，电脑程序可能会获利了结甚至反手做一笔刮头皮交易。","pid":"p921"},{"t":"para","text":"有些程序采用微分进化来优化软件生成数据，从而衍生出其他数据。他们可以继续对数据进行提炼，直至达到某个水平的数学确定性，然后利用这些结论自动地买卖股票。有些订单规模巨大，需要一定时间来处理，算法交易软件把这些大型订单分解成较小的订单，以掩盖那些设法在趋势初期进行大规模投资的交易行为。掠夺性交易算法试图解开算法交易程序所尝试隐藏的内容。每个人都在寻找自己的优势，越来越多的公司正利用计算机来寻找最佳入场点并进行交易","pid":"p922"},{"t":"para","text":"计算机分析数据并下单的速度远远超过交易员，并在运行程序过程中展现其数学上的优势，如果在报告发布期我们想要人为地与它们竞争交易速度，一定会以失败告终。这些计算机功能非常强大，并位于离交易所很近的地方，可以瞬间完成大量交易。结果导致价格波动太快，我们根本没有时间去解读价格行为。事实上，价格波动如此快速，以至于你家里计算机所显示的价格可能比实际发生的时间要落后儿秒钟。通常情况下，价格波动在起初一两秒内非常剧烈，但几秒钟后就会反转，随后可能再次反转。交易员根本不可能迅速做出决定并在短时间内下单交易，所以也就不可能在这种情况下获得盈利。最好是报告发布后等待市场呈现清晰的走势，然后再朝着那个方向进行交易。当你的竞争对手比你更拥有速度优势时，最好的办法是等待这种优势逐渐消失后再开始你的交易。大多数交易员都不应该在报告发布后的几秒钟内交易，而是应该等待价格行为回归正常，这个时间往往需要1到10分钟左右。","pid":"p923"},{"t":"para","text":"没人能够事先知道那些主要机构投资者的买入订单总量是否足以压倒准备做空的机构，或者说空头是否拥有足够的资金规模推动市场下跌。在大部分交易日里，当多头持续买入、空头持续卖出时，价格在一段时间内呈现双边震荡的态势。市场在买入真空和卖出真空状态下上审下跳，当达到某个极值时，需要有一方力量来主导市场。当市场价格足够低，并触及多头预期的低点时，他们将会积极买入。随后市场上涨至某个区间，多头不再认为价格还能继续走高，这时他们停止买入并开始获利了结。强势的空头一直等待以更高价格抛出，突然在这个价格区间里冒出来大举做空。价格波动到了一定程度时，其中一方在当前价位上不愿意继续频繁交易，这就产生一种失衡现象。允许另一方开始朝着自己希望的方向推动市场。失利的一方开始平仓，为趋势产生助力。获胜的一方看到市场朝着自己所希望的方向移动，他们开始加仓，从而加强了当前势头。随后他们在某个价位上开始获利了结，导致价格回调。一旦市场折返的幅度大到令这些机构重新看到交易价值时。他们便再次加仓，通常的结果就是市场再次摸顶或探底，以测试趋势极值。","pid":"p924"},{"t":"para","text":"迅猛的反转在经济报告发布期非常常见，你或许认为这些反转并不合理，但那并不重要。一份看涨的报告怎么会令市场突然反弹，几秒钟后又跌至当天新低呢？几分钟前市场还非常低迷，现在怎么又突然这么乐观呢？别在这些问题上浪费时间了。相反，你应该多花时间去寻找标准价格行为的入场形态，交易时不要考虑太多，不必去分析为什么会发生反转。你只需要知道事实上反转正在发生而你必须入场。你不需要去深入理解它，但你必须意识到反转发生得非常迅速，你必须快速应对以免损失钱财。","pid":"p925"},{"t":"para","text":"虽然5分钟图最容易解读，且最可靠，但3分钟图可以帮助你更好地交易，特别是在开盘第一个小时的时候。不过这样也会导致更多交易员亏钱，如果你喜欢高胜率的交易，并且不希望赔钱给你带来负面情绪，你应该坚持利用5分钟图来交易，并努力加重自己的仓位。","pid":"p926"},{"t":"para","text":"对一个交易员来说。最好的办法是简化自己的分析尤其在开盘后市场快速运转的第一个小时里。绝大部分开盘的状态都与前一天最后一个小时左右的价格行为有关，开盘后的一次突破，一次失败的突破，一次突破回调。或者一轮开盘启动的趋势，它们中无论任何一个形态都可能变化非常快。","pid":"p927"},{"t":"para","text":"日内交易最困难的一个方面就是保持注意力集中。大多数交易员根本无法在整个交易过程中保持与市场的紧密联系，他们经常感到厌卷和分心，并认为这些因素是他们稳定获利的主要障碍。他们这种想法是对的。开盘后第一个小时恰好可以帮助交易员克服这些问题。如果你认为不可能一整天都町着行情的每次跳动，或者紧密观察每根5分钟K线，但你至少能在一个小时内坚持做到这一点。这必须成为你的首要目标之一，因为开盘后第一个小时是你赚钱的好时机。第一个小时内成交量巨大，每天在这个时段都有好几次交易机会。如果你只是在第一个小时内交易，并且一旦实现稳定盈利后加重你的头寸，你可能会发现只需要在那一个小时中集中精力。剩下的时间里，只要等待两三次主要反转就可以了，而这些反转，你几乎总能提前10分钟以前就预判得到，特别在等待二次入场机会的时候（一旦看到第一个入场点，你就会准备迎接第二个入场点，二次入场机会通常会在几根K线之内形成）。你一旦能够在第一个小时内交易顺利，那么就准备在头两个小时内保持这种良好的交易状态，这个时间段通常会产生一天中盈利最为可观的交易，并经常带给你预期原本需要一整天才能获得的利润。","pid":"p928"},{"t":"para","text":"在比如圣诞节和七月四日这样的节假日前后进行交易时，开盘后第一个小时通常非常重要，因为这是市场正常运转的唯一有效时间。在接下来剩余的时间里，行情将进入一个胶着密集的震荡区间。如果你想在节假日前后交易。你必须尤其注意开盘后第一个小时内的各种交易形态。","pid":"p929"},{"t":"para","text":"当你使用5分钟图进行交易时，很容易忽略很多机构交易员正在关注15分钟图的事实。15分钟图的第一根K线以5分钟图的第三根K线的收盘价收盘，因此这第三根K线前后的行为将会影响15分钟图第一根K线的形状。例如，当天的头两根K线朝同一方向运动，第三根K线为一根小型的休整K线，这根K线突破与否将决定15分钟图上的突破是成功还是失败。因此，当天第三根K线上的交易往往引发一轮大幅波动。在大部分交易日里，都不要仅凭第三根K线来设定你的交易，但是这根K线的重要性还是应该值得我们注意。如果它是一根重要的K线，通常会有其他价格行为成为支持这笔交易的理由，而这些额外的信息通常也是交易的基础。","pid":"p930"},{"t":"para","text":"类似的逻辑也可以用于30分钟图和60分钟图的最后一根5分钟K线（例如，60分钟图上的一根K线由12根5分钟K线组成，最后一根K线与60分钟K线同时收盘），较长时间周期的图表触发入场条件的频率较低，如果只关注这种长时间周期的图表。很可能会错过一笔或多笔可盈利的5分钟图交易，所以这种方式不值得推荐。","pid":"p931"},{"t":"para","text":"铁丝网行情代表横盘整理的震荡态势，当它在开盘后第一小时内成型时，这种行情往往会持续一天，多空双方在胶着状态下不断更替对市场的主导权。如果铁丝网行情之后出现一波趋势，那么通常在某个点位上会有一个可交易的逆势入场形态。","pid":"p932"},{"t":"para","text":"一天中的第一根K线往往显示出这一整天可能的走势。如果第根K线是一个十字星，并且位于昨天最后四个小时所形成的震荡区间中部，移动平均线相对平缓，这说明这一天大概是一个行情震荡的交易日。如果第一根K线是一根趋势K线，并带有显著影线，这说明这是一波单K线震荡行情。由于大部分震荡区间的突破都以失败告终，在反转之前市场都无法在这根K线的上方或下方运行超过一两根K线的时间。如果第一根K线拥有突出的影线，一些交易员可能会在突破时反手交易，并分开一到两次逐步建仓。例如，不论市场是跳空高开还是跳空低开，第一根K线是阳线还是阴线，如果上下影线相当突出，很多交易员将在K线上方做空，下方做多，进行刮头皮交易，他们知道反转在开盘后第一个小时内通常占据主导地位，对于震荡区间的突破很可能无功而返，-即便这个震荡区间只由一根K线构成。因此他们打赌突破会失败。并反向交易。他们把这根K线看作单K线震荡区间，行情正处于胶着态势，这意味着他们将会把接下来的大部分交易都当作刮头皮操作。","pid":"p933"},{"t":"para","text":"接下来的几根K线也可能显示当天的倾向。如果接下来的几根K线继续呈现十字星结构，并在开盘后第一个小时内发生五次反转，当天形成震荡行情的概率就会增加。如果开盘大幅跳空，然后市场在头四根K线呈趋势走势，那么当天成为趋势交易日的可能性很大。交易员应该要在第一根K线时就为接下来的趋势做好准备，而这些首根K线则成为尖形通道趋势交易日的一次涨跌高潮。不过，如果第二波回调形成一个小级别的最终旗形，他们也会严阵以待。这可能导致一个反向的尖形，一次对开盘区间另一端的突破，然后朝相反方向做趋势运动。","pid":"p934"},{"t":"para","text":"开盘后一两个小时内最强势的波段交易来自不同形态的汇合，但这些形态有时候很微妙，交易员们在开盘之前就应该挖掘它们，并且考虑到各种可能发生的情况。我们应该总是把多空两种情况都放在一起考虑，因为双方都存在专业投资者。像往常一样，交易员们试图寻找突破以及突破失败的形态。例如，昨天收盘前是否存在一个18根K线宽的下降旗形，并将价格拉回下跌趋势线？如果存在，那么今天开盘是否仅仅略低于下降旗形及移动平均线，形成对旗形的一次突破，然后以两根K线反弹至移动平均线，并形成空头反转K线？如果是的话。这是一次开盘在移动平均线上的向下反转，一次突破回调的做空入场形态，对下跌趋势线进行测试后，在这根空头反转K线上创造了一次高胜率的波段（以及刮头皮）做空形态。展现的因素越多，成功的概率就越高，当出现一个高胜率的波段交易入场形态时，这种形态非常强势。换句话说，市场维持了三天疲弱的上涨趋势，并走出一段25根K线宽的震荡区间，形成一个楔形，那么昨天是否以一次多头突破收盘？市场持续了两周的震荡行情，那么昨天的多头突破是否接受这个大震荡区间的顶部？这次突破是否走出了两个回合的上升小波段？市场是否在三天楔形反弹上方的趋势通道线上收盘？如果是的话，今天开盘价是否比昨天收盘价低几个价位，然后价格上涨，但没能向上突破昨天的高点和震荡区间（很可能是一个最终旗形），以及楔形上升通道的顶部，价格突破失败后反转向下，形成一根强势的空头反转K线，创造出一个二次入场的抛售信号？如果是的话，这是一次高胜率的波段（以及刮头皮）做空形态。","pid":"p935"},{"t":"para","text":"开盘头几根K线后，市场经常突破急剧反转。但要时刻准备好反转失败，并走出一个突破回调的形态。","pid":"p936"},{"t":"img","src":"assets/img/p3_0_001.webp","ctx":[{"t":"开盘后一两个小时内最强势的波段交易来自不同形态的汇合，但这些形态有时候很微妙，交易员们在开盘之前就应该挖掘它们，并且考虑到各种可能发生的情况。我们应该总是把多空两种情况都放在一起考虑，因为双方都存在专业投资者。像往常一样，交易员们试图寻找突破以及突破失败的形态。例如，昨天收盘前是否存在一个18根K线宽的下降旗形，并将价格拉回下跌趋势线？如果存在，那么今天开盘是否仅仅略低于下降旗形及移动平均线，形成对旗形的一次突破，然后以两根K线反弹至移动平均线，并形成空头反转K线？如果是的话。这是一次开盘在移动平均线上的向下反转，一次突破回调的做空入场形态，对下跌趋势线进行测试后，在这根空头反转K线上创造了一次高胜率的波段（以及刮头皮）做空形态。展现的因素越多，成功的概率就越高，当出现一个高胜率的波段交易入场形态时，这种形态非常强势。换句话说，市场维持了三天疲弱的上涨趋势，并走出一段25根K线宽的震荡区间，形成一个楔形，那么昨天是否以一次多头突破收盘？市场持续了两周的震荡行情，那么昨天的多头突破是否接受这个大震荡区间的顶部？这次突破是否走出了两个回合的上升小波段？市场是否在三天楔形反弹上方的趋势通道线上收盘？如果是的话，今天开盘价是否比昨天收盘价低几个价位，然后价格上涨，但没能向上突破昨天的高点和震荡区间（很可能是一个最终旗形），以及楔形上升通道的顶部，价格突破失败后反转向下，形成一根强势的空头反转K线，创造出一个二次入场的抛售信号？如果是的话，这是一次高胜率的波段（以及刮头皮）做空形态。","p":"p935"},{"t":"开盘头几根K线后，市场经常突破急剧反转。但要时刻准备好反转失败，并走出一个突破回调的形态。","p":"p936"},{"t":"如图PⅢ。1所示，K线1为当天的第三根K线，这是一根短小的反转阳线。它从移动平均线和昨天波段低点开始反弹。这是一个强势反转的做多入场时机。同时也阻止了当天第一根15分钟线走成一根强阴线。","p":"p937"},{"t":"从K线1开始，市场连续走出了四根阳线。第二根K线后。有些多头预期首次向下反转的尝试会失败，他们开始在前一根K线的低点处挂买入限价单。这些买单在K线2后第三根K线（阴线）处成交。","p":"p938"},{"t":"第二天，K线3同样从前一天波段低点处反转，使刮头皮交易员从中获利，但这个做多入场点却在双K线反转形态中反转向下，变成一个做空的入场机会。请注意，K线3是一根阴线，不是一根强反转K线，所以这不是一个好的反手做多的入场形态。多头希望行情出现楔形反转，楔形的头两推发生在前一天的最后一两个小时里。然而，K线3和它前面那根K线都呈小规模的震荡行情。K线过于短小。缺乏足够的看涨力量，很难扭转强劲的抛售趋势。多头尝试在K线3后面那段K线积蓄力量。但是空头以一根更强势的阴线迅速使市场反转向下。","p":"p939"},{"t":"突破K线3低点的这波行情也向下突破了当天第一根15分钟K线，在这种开盘巨型向下跳空的交易日里，更是增加了价格下跌的可能性。","p":"p940"},{"t":"我们注意到昨天收盘价稍稍高于开盘价，但远低于咋天的最高点、虽然这在日线图上看是一根小阳线，但并不妨碍它成为一根反转K线如果今天的行情跌破昨天的低点。有些凭日线图来交易的交易员则会在挂条件单开始做空。因为很多交易员都倾向于在这个位置上卖出，今天市场跳空下行，并在第一根K线就跌破昨日低点，触发了日线图上的卖出信号。突破尝试在K线3处失败，但随后的向上反转也失败了，形成一个双重顶下降旗形和突破回调做空形态，并在K线4这一双K线反转的下方产生一个入场时机。","p":"p941"}]},{"t":"para","text":"如图PⅢ。1所示，K线1为当天的第三根K线，这是一根短小的反转阳线。它从移动平均线和昨天波段低点开始反弹。这是一个强势反转的做多入场时机。同时也阻止了当天第一根15分钟线走成一根强阴线。","pid":"p937"},{"t":"para","text":"从K线1开始，市场连续走出了四根阳线。第二根K线后。有些多头预期首次向下反转的尝试会失败，他们开始在前一根K线的低点处挂买入限价单。这些买单在K线2后第三根K线（阴线）处成交。","pid":"p938"},{"t":"para","text":"第二天，K线3同样从前一天波段低点处反转，使刮头皮交易员从中获利，但这个做多入场点却在双K线反转形态中反转向下，变成一个做空的入场机会。请注意，K线3是一根阴线，不是一根强反转K线，所以这不是一个好的反手做多的入场形态。多头希望行情出现楔形反转，楔形的头两推发生在前一天的最后一两个小时里。然而，K线3和它前面那根K线都呈小规模的震荡行情。K线过于短小。缺乏足够的看涨力量，很难扭转强劲的抛售趋势。多头尝试在K线3后面那段K线积蓄力量。但是空头以一根更强势的阴线迅速使市场反转向下。","pid":"p939"},{"t":"para","text":"突破K线3低点的这波行情也向下突破了当天第一根15分钟K线，在这种开盘巨型向下跳空的交易日里，更是增加了价格下跌的可能性。","pid":"p940"},{"t":"para","text":"我们注意到昨天收盘价稍稍高于开盘价，但远低于咋天的最高点、虽然这在日线图上看是一根小阳线，但并不妨碍它成为一根反转K线如果今天的行情跌破昨天的低点。有些凭日线图来交易的交易员则会在挂条件单开始做空。因为很多交易员都倾向于在这个位置上卖出，今天市场跳空下行，并在第一根K线就跌破昨日低点，触发了日线图上的卖出信号。突破尝试在K线3处失败，但随后的向上反转也失败了，形成一个双重顶下降旗形和突破回调做空形态，并在K线4这一双K线反转的下方产生一个入场时机。","pid":"p941"},{"t":"img","src":"assets/img/p3_0_002.webp","ctx":[{"t":"突破K线3低点的这波行情也向下突破了当天第一根15分钟K线，在这种开盘巨型向下跳空的交易日里，更是增加了价格下跌的可能性。","p":"p940"},{"t":"我们注意到昨天收盘价稍稍高于开盘价，但远低于咋天的最高点、虽然这在日线图上看是一根小阳线，但并不妨碍它成为一根反转K线如果今天的行情跌破昨天的低点。有些凭日线图来交易的交易员则会在挂条件单开始做空。因为很多交易员都倾向于在这个位置上卖出，今天市场跳空下行，并在第一根K线就跌破昨日低点，触发了日线图上的卖出信号。突破尝试在K线3处失败，但随后的向上反转也失败了，形成一个双重顶下降旗形和突破回调做空形态，并在K线4这一双K线反转的下方产生一个入场时机。","p":"p941"},{"t":"如图PⅢ.2所示，前几根K线的价格行为通常就预示了接下来整个行情的走向。从开盘到K线4之间的反弹走出几根大阳势线，只有两根小的阴线，这表明多头力量比较激进。我们一定要记得开盘时的这个现象，以防后市出现另一个买入形态。带着这个观点，交易员们应该更倾向于将他们的多头头寸波段化。因为行情很可能恢复早前的走势。","p":"p942"},{"t":"一天中的最高点一般来自某种形式的双重顶，但却看起来不太像双重顶。在这个图中，K线6是继K线4后第二次向上冲击的末端，也是一个双重顶做空信号。K线4很可能成为当天的最高点。K线8与昨日收盘低点组成一个双重底，也形成了当天的最低点。","p":"p943"},{"t":"即使开盘反转继而形成波段的成功率只有40%，许多交易还是产生了小幅利润或小幅亏损。这些交易的利润和亏损通常相互抵消，有40%的概率能获得四个点以上的盈利，并成为交易员主要的收益来源。对大多数希望以日内交易为生的交易员来说，这些开盘的交易行为应该是他们操作中最重要的组成部分。","p":"p944"},{"t":"经验丰富的刮头皮交易员预期大部分反转尝试都以失败告终，并在开盘后的一两个小时内伺机低买高卖。可能的刮头皮交易包括：在第一根K线上方卖出，这一根K线是一个十字星，然后随着市场走高逐步加仓（在盈亏平衡点平掉第一批持仓，取得利润后平掉第二批和第三批持仓）：在K线1阳线上方买入；在K线2后面那根内含阴线下方做空（对昨天震荡区间一次失败的向上突破）：当K线3向上突破前一根K线高点时买入（涨至K线2的势头很强劲，很可能随之而来的是第二个上升小波段）：K线3突破至当天新高后，在K线3后面的双K线反转下方做空（低点2做空信号）：在K线6阳线下方做空，因为它是跌至K线5的微型下降通道的双波段突破，所以价格很可能再次试探该强势微型下降通道底部。","p":"p945"},{"t":"K线8发起第二次尝试，成功突破至当天新低，并与昨天收盘价组成双重底，很可能引出一波至少包含两个小波段的反弹行情。实际上，双波段反弹只是一次短暂的横盘整理，价格的上涨运动依然在上升通道内运行。当反弹行情基本上在通道内运行时，即使价格出现停滞，第二回合的波段比较微小，大多数交易员仍然会将整个通道看作第一回合的上升波段，并预期下一个上升波段更加显著。涨至K线11的波动只是该通道的延伸，并没有明显的回调，许多交易员会认为从K线8到K线11的运动仅仅是一个回合的波段。然而，与大部分通道一样，这里有许多重叠的K线，显著的上下影线，以及多根阴线。上升通道是一种下降旗形，交易员们正在寻找下行突破的信号，由此引发的回调足以让交易员们相信第一回合的上升波段已经结束。然后他们需要判断行情是否还会出现第二回合的上升波段。还是就此进入长时间的调整期，调整时间之久足以让空头觉得市场不会再持续走高，使他们确信这里是一个很好的价格水平可以再次积极做空。市场非但没有突破下行，反而强势上攻，过去几个小时内一直在做空的空头不得不迅速买回其空头头寸。多头看到上涨势头那么强劲，他们在市场上一路买进，涨势如此迅猛，这大大增加了行情突破新高的概率。","p":"p946"},{"t":"K线12是一个高点2的买入点，行情由此走出第二回合大型的上升波段，而该上升波段本身也包含了两个小级别的波段。","p":"p947"}]},{"t":"para","text":"如图PⅢ.2所示，前几根K线的价格行为通常就预示了接下来整个行情的走向。从开盘到K线4之间的反弹走出几根大阳势线，只有两根小的阴线，这表明多头力量比较激进。我们一定要记得开盘时的这个现象，以防后市出现另一个买入形态。带着这个观点，交易员们应该更倾向于将他们的多头头寸波段化。因为行情很可能恢复早前的走势。","pid":"p942"},{"t":"para","text":"一天中的最高点一般来自某种形式的双重顶，但却看起来不太像双重顶。在这个图中，K线6是继K线4后第二次向上冲击的末端，也是一个双重顶做空信号。K线4很可能成为当天的最高点。K线8与昨日收盘低点组成一个双重底，也形成了当天的最低点。","pid":"p943"},{"t":"para","text":"即使开盘反转继而形成波段的成功率只有40%，许多交易还是产生了小幅利润或小幅亏损。这些交易的利润和亏损通常相互抵消，有40%的概率能获得四个点以上的盈利，并成为交易员主要的收益来源。对大多数希望以日内交易为生的交易员来说，这些开盘的交易行为应该是他们操作中最重要的组成部分。","pid":"p944"},{"t":"para","text":"经验丰富的刮头皮交易员预期大部分反转尝试都以失败告终，并在开盘后的一两个小时内伺机低买高卖。可能的刮头皮交易包括：在第一根K线上方卖出，这一根K线是一个十字星，然后随着市场走高逐步加仓（在盈亏平衡点平掉第一批持仓，取得利润后平掉第二批和第三批持仓）：在K线1阳线上方买入；在K线2后面那根内含阴线下方做空（对昨天震荡区间一次失败的向上突破）：当K线3向上突破前一根K线高点时买入（涨至K线2的势头很强劲，很可能随之而来的是第二个上升小波段）：K线3突破至当天新高后，在K线3后面的双K线反转下方做空（低点2做空信号）：在K线6阳线下方做空，因为它是跌至K线5的微型下降通道的双波段突破，所以价格很可能再次试探该强势微型下降通道底部。","pid":"p945"},{"t":"para","text":"K线8发起第二次尝试，成功突破至当天新低，并与昨天收盘价组成双重底，很可能引出一波至少包含两个小波段的反弹行情。实际上，双波段反弹只是一次短暂的横盘整理，价格的上涨运动依然在上升通道内运行。当反弹行情基本上在通道内运行时，即使价格出现停滞，第二回合的波段比较微小，大多数交易员仍然会将整个通道看作第一回合的上升波段，并预期下一个上升波段更加显著。涨至K线11的波动只是该通道的延伸，并没有明显的回调，许多交易员会认为从K线8到K线11的运动仅仅是一个回合的波段。然而，与大部分通道一样，这里有许多重叠的K线，显著的上下影线，以及多根阴线。上升通道是一种下降旗形，交易员们正在寻找下行突破的信号，由此引发的回调足以让交易员们相信第一回合的上升波段已经结束。然后他们需要判断行情是否还会出现第二回合的上升波段。还是就此进入长时间的调整期，调整时间之久足以让空头觉得市场不会再持续走高，使他们确信这里是一个很好的价格水平可以再次积极做空。市场非但没有突破下行，反而强势上攻，过去几个小时内一直在做空的空头不得不迅速买回其空头头寸。多头看到上涨势头那么强劲，他们在市场上一路买进，涨势如此迅猛，这大大增加了行情突破新高的概率。","pid":"p946"},{"t":"para","text":"K线12是一个高点2的买入点，行情由此走出第二回合大型的上升波段，而该上升波段本身也包含了两个小级别的波段。","pid":"p947"},{"t":"img","src":"assets/img/p3_0_003.webp","ctx":[{"t":"K线8发起第二次尝试，成功突破至当天新低，并与昨天收盘价组成双重底，很可能引出一波至少包含两个小波段的反弹行情。实际上，双波段反弹只是一次短暂的横盘整理，价格的上涨运动依然在上升通道内运行。当反弹行情基本上在通道内运行时，即使价格出现停滞，第二回合的波段比较微小，大多数交易员仍然会将整个通道看作第一回合的上升波段，并预期下一个上升波段更加显著。涨至K线11的波动只是该通道的延伸，并没有明显的回调，许多交易员会认为从K线8到K线11的运动仅仅是一个回合的波段。然而，与大部分通道一样，这里有许多重叠的K线，显著的上下影线，以及多根阴线。上升通道是一种下降旗形，交易员们正在寻找下行突破的信号，由此引发的回调足以让交易员们相信第一回合的上升波段已经结束。然后他们需要判断行情是否还会出现第二回合的上升波段。还是就此进入长时间的调整期，调整时间之久足以让空头觉得市场不会再持续走高，使他们确信这里是一个很好的价格水平可以再次积极做空。市场非但没有突破下行，反而强势上攻，过去几个小时内一直在做空的空头不得不迅速买回其空头头寸。多头看到上涨势头那么强劲，他们在市场上一路买进，涨势如此迅猛，这大大增加了行情突破新高的概率。","p":"p946"},{"t":"K线12是一个高点2的买入点，行情由此走出第二回合大型的上升波段，而该上升波段本身也包含了两个小级别的波段。","p":"p947"},{"t":"图PIII.3 不要在窄幅区间里做刮头皮交易","p":"p948"},{"t":"交易员们不应该在日均波动区间小于一美元的股票上进行刮头皮交易，但价格行为的入场规则依然有效。如图PIII.3所示，英特尔（INTC）在前15分钟出现了两根大阴线，然后形成一个双重顶下降旗形（K线3和K线5）。这是一种可靠的形态，经常导致当天行情呈趋势下跌，在这里则引发了一波迅猛的抛售高潮。昨天的上涨趋势非常强劲，以至于今天的双波段下跌在K线6处出现反转，这个价位可能位于15分钟图或60分钟图的移动平均线上，但依然有至少10美分进行刮头皮交易的空间。","p":"p949"},{"t":"每当移动平均线与昨天一样陡峭上扬时，任何在它下方的强势抛售几乎总是伴随着一个可交易的向上反弹。咋天11：35，行情在强上涨高潮后回调，与K线6构成双重底上升旗形，K线6则是这个信号K线。然后形成了更为强势的上涨高潮，冲击昨天的收盘价，整个过程形成一个高潮高潮的上涨趋势。由于第二个高潮类似于传统的高潮上升趋势通道，它的底部通常都会得到测试，比如图中所示。","p":"p950"},{"t":"铁丝网型的震荡区间（狭窄的震荡区间，区间内K线较长，且带有较长的影线）。K线相互重叠，影线较为显著。开盘后前90分钟内多次反转，都显示了强烈的多空对和不确定性，这一天行情通常呈现震荡延伸的态势。","p":"p951"}]},{"t":"para","text":"图PIII.3 不要在窄幅区间里做刮头皮交易","pid":"p948"},{"t":"para","text":"交易员们不应该在日均波动区间小于一美元的股票上进行刮头皮交易，但价格行为的入场规则依然有效。如图PIII.3所示，英特尔（INTC）在前15分钟出现了两根大阴线，然后形成一个双重顶下降旗形（K线3和K线5）。这是一种可靠的形态，经常导致当天行情呈趋势下跌，在这里则引发了一波迅猛的抛售高潮。昨天的上涨趋势非常强劲，以至于今天的双波段下跌在K线6处出现反转，这个价位可能位于15分钟图或60分钟图的移动平均线上，但依然有至少10美分进行刮头皮交易的空间。","pid":"p949"},{"t":"para","text":"每当移动平均线与昨天一样陡峭上扬时，任何在它下方的强势抛售几乎总是伴随着一个可交易的向上反弹。咋天11：35，行情在强上涨高潮后回调，与K线6构成双重底上升旗形，K线6则是这个信号K线。然后形成了更为强势的上涨高潮，冲击昨天的收盘价，整个过程形成一个高潮高潮的上涨趋势。由于第二个高潮类似于传统的高潮上升趋势通道，它的底部通常都会得到测试，比如图中所示。","pid":"p950"},{"t":"para","text":"铁丝网型的震荡区间（狭窄的震荡区间，区间内K线较长，且带有较长的影线）。K线相互重叠，影线较为显著。开盘后前90分钟内多次反转，都显示了强烈的多空对和不确定性，这一天行情通常呈现震荡延伸的态势。","pid":"p951"},{"t":"img","src":"assets/img/p3_0_004.webp","ctx":[{"t":"每当移动平均线与昨天一样陡峭上扬时，任何在它下方的强势抛售几乎总是伴随着一个可交易的向上反弹。咋天11：35，行情在强上涨高潮后回调，与K线6构成双重底上升旗形，K线6则是这个信号K线。然后形成了更为强势的上涨高潮，冲击昨天的收盘价，整个过程形成一个高潮高潮的上涨趋势。由于第二个高潮类似于传统的高潮上升趋势通道，它的底部通常都会得到测试，比如图中所示。","p":"p950"},{"t":"铁丝网型的震荡区间（狭窄的震荡区间，区间内K线较长，且带有较长的影线）。K线相互重叠，影线较为显著。开盘后前90分钟内多次反转，都显示了强烈的多空对和不确定性，这一天行情通常呈现震荡延伸的态势。","p":"p951"},{"t":"如图PIII.4所示，今天是一个行情反复震荡的交易日，但由于市场收在上层震荡区间的顶部，因此这也是一个多头反转日。","p":"p952"},{"t":"当开盘出现铁丝网行情时。通常在当天某个时刻就会出现双向的波段交易机会。到了当天第三根K线时，行情很可能呈现铁丝网结构，因为大约一半区间都由反复震荡的K线组成，这些K线收于自己的中点，这意味着下一根K线所覆盖的价格也很可能有一半与前一根K线相互重叠。铁丝网继续向右延伸，一直穿透了K线2的整段弱势反弹。随后行情突破了下跌趋势线，形成一个次高点，并在K线4处形成一个更低高点的二次入场机会，与K线3组成双重顶。接下来的几根K线突破下行，可能形成趋势性的交易区间。交易员们正在寻找向下突破的机会，预期市场走出一波可测量的下跌行情，为他们的波段化空头头寸创造收益。价格下行突破使得市场进入空头格局，很可能出现持续的抛售期。K线6前面的下降通道可能是一个震荡区间的开始。行情形成次高点后在K线9处走出一个双K线高潮，一旦这个高潮成型，大多数趋势交易员会认为市场将持续走高，进入多头格局。","p":"p953"},{"t":"涨至K线7的反弹行情突破了下跌趋势线，随后市场深度回踩走出一个更低的低点，出现一个以K线8为买入点的双K线反转做多入场形态，然后从K线9这一次低点开始反弹直至收盘。","p":"p954"},{"t":"在K线1处的连续两根阳线足以让一些多头刮头皮交易员在K线1低点处挂单买入，并将止损点设在K线1前面那根阳线下方。他们在随后的那根阴线上建立多头持仓，并在接下来的几根飞线上以一两个点的盈利离场。","p":"p955"}]},{"t":"para","text":"如图PIII.4所示，今天是一个行情反复震荡的交易日，但由于市场收在上层震荡区间的顶部，因此这也是一个多头反转日。","pid":"p952"},{"t":"para","text":"当开盘出现铁丝网行情时。通常在当天某个时刻就会出现双向的波段交易机会。到了当天第三根K线时，行情很可能呈现铁丝网结构，因为大约一半区间都由反复震荡的K线组成，这些K线收于自己的中点，这意味着下一根K线所覆盖的价格也很可能有一半与前一根K线相互重叠。铁丝网继续向右延伸，一直穿透了K线2的整段弱势反弹。随后行情突破了下跌趋势线，形成一个次高点，并在K线4处形成一个更低高点的二次入场机会，与K线3组成双重顶。接下来的几根K线突破下行，可能形成趋势性的交易区间。交易员们正在寻找向下突破的机会，预期市场走出一波可测量的下跌行情，为他们的波段化空头头寸创造收益。价格下行突破使得市场进入空头格局，很可能出现持续的抛售期。K线6前面的下降通道可能是一个震荡区间的开始。行情形成次高点后在K线9处走出一个双K线高潮，一旦这个高潮成型，大多数趋势交易员会认为市场将持续走高，进入多头格局。","pid":"p953"},{"t":"para","text":"涨至K线7的反弹行情突破了下跌趋势线，随后市场深度回踩走出一个更低的低点，出现一个以K线8为买入点的双K线反转做多入场形态，然后从K线9这一次低点开始反弹直至收盘。","pid":"p954"},{"t":"para","text":"在K线1处的连续两根阳线足以让一些多头刮头皮交易员在K线1低点处挂单买入，并将止损点设在K线1前面那根阳线下方。他们在随后的那根阴线上建立多头持仓，并在接下来的几根飞线上以一两个点的盈利离场。","pid":"p955"}],"sections":[{"id":"p3c1","title":"第17章　与盘前相关的形态","blocks":[{"t":"para","text":"第17章　与盘前相关的形态","pid":"p956"},{"t":"para","text":"当观察Globex电子迷你期货的分时图和成交图时，并不容易确定开盘价，因为它只是24小时交易日的一部分。且看起来与图表的其他部分并无区别。实际上，开盘时段的这根K线几乎总是包含了开盘前的价格波动。Globex的高点和低点倾向于在日盘交易时段被测试，而且Globex的许多形态都是在日盘时段的头一批K线内完成的。开盘后第一个小时左右价格通常变化非常快，仅仅日盘交易就能提供不错的价格行为以供交易员做交易分析。大多数交易员不能同时根据两张图表进行交易，特别是刚开盘时快速动荡的市场，只能在Globex图和日盘时段5分钟图中选择其一。这也是一种个人喜好的问题。一些成功的交易员喜欢町着Globex看一整天，而我更喜欢运用日盘时段交易图。还有些交易员先观察Globex一个小时左右，然后再切换到日盘时段交易图。对于那些只运用日盘时段交易图的交易员来说，大部分以Globex图为基础的交易，都能为交易员提供价格行为的信息，让他们找到理由选择相同的交易。当你准备入场、止损、止盈时，你可能会更情愿错过一次可盈利的交易机会，也不愿意冒着亏损的风险，因为试图同一时间内快速分析两张图表很容易把自己搞晕。","pid":"p957"},{"t":"para","text":"市场在日盘时段跳空，并在开盘后30分钟左右回补缺口，这时Globex上显示的移动平均线往往与日盘交易图上这个时段的移动平均线的方向是相反的。例如，如果价格跳空低开，日盘时段的移动平均线将会向下走，但如果此时在Globex上形成一个更低的低点，而且市场在开盘前30分钟内一直反弹向上，那么Globex的移动平均线就可能往上走，其价格也会在移动平均线上方运行。如果你只看日盘时段交易图，发现行情出现一个很大的跳空缺口，并且市场开盘后强势回补这一缺口，那么你应该观察市场动能，而非移动平均线，因为动能反映了正在发生的实际价格行为。只观察日盘时段交易图的交易员必须注意，开盘后第一个小时内的移动平均线往往不能反映真实情况。","pid":"p958"},{"t":"img","src":"assets/img/p3c1_001.webp","ctx":[{"t":"当观察Globex电子迷你期货的分时图和成交图时，并不容易确定开盘价，因为它只是24小时交易日的一部分。且看起来与图表的其他部分并无区别。实际上，开盘时段的这根K线几乎总是包含了开盘前的价格波动。Globex的高点和低点倾向于在日盘交易时段被测试，而且Globex的许多形态都是在日盘时段的头一批K线内完成的。开盘后第一个小时左右价格通常变化非常快，仅仅日盘交易就能提供不错的价格行为以供交易员做交易分析。大多数交易员不能同时根据两张图表进行交易，特别是刚开盘时快速动荡的市场，只能在Globex图和日盘时段5分钟图中选择其一。这也是一种个人喜好的问题。一些成功的交易员喜欢町着Globex看一整天，而我更喜欢运用日盘时段交易图。还有些交易员先观察Globex一个小时左右，然后再切换到日盘时段交易图。对于那些只运用日盘时段交易图的交易员来说，大部分以Globex图为基础的交易，都能为交易员提供价格行为的信息，让他们找到理由选择相同的交易。当你准备入场、止损、止盈时，你可能会更情愿错过一次可盈利的交易机会，也不愿意冒着亏损的风险，因为试图同一时间内快速分析两张图表很容易把自己搞晕。","p":"p957"},{"t":"市场在日盘时段跳空，并在开盘后30分钟左右回补缺口，这时Globex上显示的移动平均线往往与日盘交易图上这个时段的移动平均线的方向是相反的。例如，如果价格跳空低开，日盘时段的移动平均线将会向下走，但如果此时在Globex上形成一个更低的低点，而且市场在开盘前30分钟内一直反弹向上，那么Globex的移动平均线就可能往上走，其价格也会在移动平均线上方运行。如果你只看日盘时段交易图，发现行情出现一个很大的跳空缺口，并且市场开盘后强势回补这一缺口，那么你应该观察市场动能，而非移动平均线，因为动能反映了正在发生的实际价格行为。只观察日盘时段交易图的交易员必须注意，开盘后第一个小时内的移动平均线往往不能反映真实情况。","p":"p958"},{"t":"如图17.1所示，Globex和日盘时段的交易图表通常同时给出相关信号，但在图形上不大相同。左侧Globex图和右侧日盘时段图的K线1的时间都是太平洋标准时间上午6：35。Globex出现了一个最终旗形反转买入信号，而日盘时段图则出现了一个阴线反转形态，这是双波段涨至昨日收盘价之上的一次突破回调。记住，如果当天的第一根K线是呈趋势性走势，那么它往往是一个可以刮头皮交易的入场形态。如果趋势被破坏，甚至走出反向趋势，那么它则是一个反向交易的入场机会。","p":"p959"},{"t":"在Globex图上，K线1位于下降移动平均线下方，但在日盘时段图上，K线1位于移动平均线之上。两张图的移动平均线呈现同一形态可能需要一两个小时的时间，但它们各自能够提供不同但却同样有效的入场形态。然而，同时观察两张图表并不能给大多数交易员带来什么好处，这么做反而不能保证交易员进行快速的交易，而且容易在交易过程中出错。","p":"p960"},{"t":"当市场出现巨大的跳空缺口时，有时日盘交易时段的移动平均线在头30分钟内并没有什么帮助。","p":"p961"}]},{"t":"para","text":"如图17.1所示，Globex和日盘时段的交易图表通常同时给出相关信号，但在图形上不大相同。左侧Globex图和右侧日盘时段图的K线1的时间都是太平洋标准时间上午6：35。Globex出现了一个最终旗形反转买入信号，而日盘时段图则出现了一个阴线反转形态，这是双波段涨至昨日收盘价之上的一次突破回调。记住，如果当天的第一根K线是呈趋势性走势，那么它往往是一个可以刮头皮交易的入场形态。如果趋势被破坏，甚至走出反向趋势，那么它则是一个反向交易的入场机会。","pid":"p959"},{"t":"para","text":"在Globex图上，K线1位于下降移动平均线下方，但在日盘时段图上，K线1位于移动平均线之上。两张图的移动平均线呈现同一形态可能需要一两个小时的时间，但它们各自能够提供不同但却同样有效的入场形态。然而，同时观察两张图表并不能给大多数交易员带来什么好处，这么做反而不能保证交易员进行快速的交易，而且容易在交易过程中出错。","pid":"p960"},{"t":"para","text":"当市场出现巨大的跳空缺口时，有时日盘交易时段的移动平均线在头30分钟内并没有什么帮助。","pid":"p961"},{"t":"img","src":"assets/img/p3c1_002.webp","ctx":[{"t":"在Globex图上，K线1位于下降移动平均线下方，但在日盘时段图上，K线1位于移动平均线之上。两张图的移动平均线呈现同一形态可能需要一两个小时的时间，但它们各自能够提供不同但却同样有效的入场形态。然而，同时观察两张图表并不能给大多数交易员带来什么好处，这么做反而不能保证交易员进行快速的交易，而且容易在交易过程中出错。","p":"p960"},{"t":"当市场出现巨大的跳空缺口时，有时日盘交易时段的移动平均线在头30分钟内并没有什么帮助。","p":"p961"},{"t":"如图17.2所示，右侧图中的行情在日盘时间跳空低开，市场在90多分钟的时间里都未能向上超越下降的移动平均线。然而，左侧图中Globex的反弹（几乎24小时全天交易）启动于开盘前30分钟，市场从太平洋标准时间上午6：30开始向上突破上升的移动平均线，并一直保持在其上方，显现出高涨的看涨情绪。上午7：20K线1的铁丝网型入场形态位于移动平均线土方，在Globex中同样呈现看涨态势，但在日盘时段价格却低于移动平均线。不过。这两张图所表现的上行动能都很强劲，所以交易员们应该积极寻找买入点。","p":"p962"}]},{"t":"para","text":"如图17.2所示，右侧图中的行情在日盘时间跳空低开，市场在90多分钟的时间里都未能向上超越下降的移动平均线。然而，左侧图中Globex的反弹（几乎24小时全天交易）启动于开盘前30分钟，市场从太平洋标准时间上午6：30开始向上突破上升的移动平均线，并一直保持在其上方，显现出高涨的看涨情绪。上午7：20K线1的铁丝网型入场形态位于移动平均线土方，在Globex中同样呈现看涨态势，但在日盘时段价格却低于移动平均线。不过。这两张图所表现的上行动能都很强劲，所以交易员们应该积极寻找买入点。","pid":"p962"}],"wcount":1483},{"id":"p3c2","title":"第18章　与昨天相关的形态：突破、突破回调及失败突破","blocks":[{"t":"para","text":"第18章　与昨天相关的形态：突破、突破回调及失败突破","pid":"p963"},{"t":"para","text":"开盘后第一个小时内的大部分交易都与前一天的形态相关，因此市场开盘前尽可能去预判将出现的形态很有必要。观察昨天最后二两个小时的行情，看是否出现一轮强劲的趋势（前一天的趋势格局可能延续至今天），一段震荡区间，一条通道，或任意可能导致今天开盘时形成突破的形态。虽然在某些交易日里，开盘时段交投清淡，延续了前一天最后一两个小时所形成的震荡区间，移动平均线较为平缓，但在大部分交易日的开盘时段，总会出现某种形式的开盘突破。当你不确定当前的突破是何种形态时，只需要简单看一下移动平均线，并以均线为判断标准。如果第一根K线完全处于移动平均线上方，则认为开盘向上跳空。如果第一根K线完全处于移动平均线下方，则把它看作开盘向下跳空。昨天最后一根K线的收盘价，与今天第一根K线的开盘价之间，通常都存在一个缺口，而这个缺口就是一种突破。寻找行情对任何形态的突破，包括对昨天收盘时段的通道或旗形的突破。这种突破有可能呈现为单K线旗形，或持续三个小时的通道。寻找对任意波段高点或低点的向下突破，尤其对昨天高点或低点的突破。","pid":"p964"},{"t":"para","text":"一旦今天开盘后你看到一个突破，你得去评估突破的行情有多大可能性得以延续下去。如果开盘大幅向下跳空，且第一根K线是一根强势阴线。其开盘价接近最高价，收盘价接近最低价。今天则可能从开盘阴线启动一波趋势。如果第一根K线是一根强势的反转阳线，突破很可能以失败告终，当天的行情则可能呈现另一番景象。如果空头突破的势头能够持续几根K线的时间，然后多头强势反转，那么这里可能形成一个失败的突破，以及当天一个可能的低点。如果反弹仅维持了一两根K线的时间，然后又出现另一根强势阴线，那么失败的突破又再次面临失败。如果这样的话，在这根阴线下方做空则是一次突破回调的入场时机。市场突破后失败，这种失败转变为下跌趋势中的一次回调而非反转。","pid":"p965"},{"t":"para","text":"反过来，当开盘出现多头突破时这种理论也是正确的。等待多头态势得以延续的时机，或等待行情反转形成一次突破失败的做空入场机会。如果反转向下的行情持续了两三根甚至更多的大阴线，那么是否足以使当天成为一个下跌趋势的交易日？如果一两根K线之内出现了多头反转K线。结果是否导致二次突破失败？如果这样的话，该形态正演变为一个突破回调的做多入场形态。你必须以这种方法去评估每一次开盘。寻找突破，然后寻找一个可能的反转所产生的突破失败入场形态。最后，如果突破失败，则观察行情是延续还是崩塌。如果崩塌，这就构成一次突破回调的交易机会，并且这种突破正在恢复它原来的势头。","pid":"p966"},{"t":"img","src":"assets/img/p3c2_001.webp","ctx":[{"t":"一旦今天开盘后你看到一个突破，你得去评估突破的行情有多大可能性得以延续下去。如果开盘大幅向下跳空，且第一根K线是一根强势阴线。其开盘价接近最高价，收盘价接近最低价。今天则可能从开盘阴线启动一波趋势。如果第一根K线是一根强势的反转阳线，突破很可能以失败告终，当天的行情则可能呈现另一番景象。如果空头突破的势头能够持续几根K线的时间，然后多头强势反转，那么这里可能形成一个失败的突破，以及当天一个可能的低点。如果反弹仅维持了一两根K线的时间，然后又出现另一根强势阴线，那么失败的突破又再次面临失败。如果这样的话，在这根阴线下方做空则是一次突破回调的入场时机。市场突破后失败，这种失败转变为下跌趋势中的一次回调而非反转。","p":"p965"},{"t":"反过来，当开盘出现多头突破时这种理论也是正确的。等待多头态势得以延续的时机，或等待行情反转形成一次突破失败的做空入场机会。如果反转向下的行情持续了两三根甚至更多的大阴线，那么是否足以使当天成为一个下跌趋势的交易日？如果一两根K线之内出现了多头反转K线。结果是否导致二次突破失败？如果这样的话，该形态正演变为一个突破回调的做多入场形态。你必须以这种方法去评估每一次开盘。寻找突破，然后寻找一个可能的反转所产生的突破失败入场形态。最后，如果突破失败，则观察行情是延续还是崩塌。如果崩塌，这就构成一次突破回调的交易机会，并且这种突破正在恢复它原来的势头。","p":"p966"},{"t":"昨天的上升通道是一个下降旗形，市场常常在开盘的时候就向下突破（见图18.1）。昨天，Oil Service HOLDRS（OIH）的5分钟图出现了一个持续将近4小时的双波段反弹，行情跌至K线1后，又反弹突破了主要下跌趋势线（图中未显示），这波反弹两次触及下跌趋势通道线，并反转向下（K线4和K线5）。这就表明多头正失去控制。反弹的长度体现了多头的看涨力量。","p":"p967"},{"t":"从K线5开始的抛售一直持续到收盘，并改变了市场的多头格局，进入空头态势，交易员们认为这种势头将延伸至今天的开盘。今天，市场跳空低开。走出一根强势的阴线，快速跌破昨天低点。并形成一波强劲的双K线多头反转。这一大型下降旗形失败的突破持续了两天，在K线7高点上方一个价位处创造了一个绝佳的做多入场点。K线1启动的下降旗形，在K线7处实现了最终旗形反转，并形成一个更低低点的主要趋势反转。对前一天高点或低点的开盘反转，往往成为当天的高点或低点，交易员们应该把他们部分或大部分的合约头寸波段化。这个例子中，交易员在K线5上方进行波段交易，预期行情走出新的波段新高，而盈亏平衡点能使这笔交易获利多达5美元。","p":"p968"},{"t":"当开盘时段行情对前一天的收盘形态发生突破，交易员们应该在突破失败时入场，如K线7，然后如果这波反弹也失败了，演变成一次突破回调时，就反向交易。这里，紧接着的三根K线反弹足够强势。很可能会有第二回合的上升小波段，因此交易员不应该把这里看作突破回调并尝试做空。既然第二回合的上升小波段很可能发生，那么更好的选择是在K线8上方或前面两根K线的低点下方买入。价格向上突破了K线6这一开盘时段的顶部，接着在K线8发出突破回调做多信号。以K线6为第一个顶部的双重顶下降旗形最终没有成功，依据这点来判断K线8也是一个做多的入场形态。","p":"p969"},{"t":"有一点比较重要的是，我们必须认识到，尽管市场昨天从K线5开始迅猛下跌，但仍可能轻易地在今天开盘的K线6处跳空高开。如果这种情况真的发生了，那么从K线5开始的这波下跌就将成为一次失败的突破尝试。","p":"p970"}]},{"t":"para","text":"昨天的上升通道是一个下降旗形，市场常常在开盘的时候就向下突破（见图18.1）。昨天，Oil Service HOLDRS（OIH）的5分钟图出现了一个持续将近4小时的双波段反弹，行情跌至K线1后，又反弹突破了主要下跌趋势线（图中未显示），这波反弹两次触及下跌趋势通道线，并反转向下（K线4和K线5）。这就表明多头正失去控制。反弹的长度体现了多头的看涨力量。","pid":"p967"},{"t":"para","text":"从K线5开始的抛售一直持续到收盘，并改变了市场的多头格局，进入空头态势，交易员们认为这种势头将延伸至今天的开盘。今天，市场跳空低开。走出一根强势的阴线，快速跌破昨天低点。并形成一波强劲的双K线多头反转。这一大型下降旗形失败的突破持续了两天，在K线7高点上方一个价位处创造了一个绝佳的做多入场点。K线1启动的下降旗形，在K线7处实现了最终旗形反转，并形成一个更低低点的主要趋势反转。对前一天高点或低点的开盘反转，往往成为当天的高点或低点，交易员们应该把他们部分或大部分的合约头寸波段化。这个例子中，交易员在K线5上方进行波段交易，预期行情走出新的波段新高，而盈亏平衡点能使这笔交易获利多达5美元。","pid":"p968"},{"t":"para","text":"当开盘时段行情对前一天的收盘形态发生突破，交易员们应该在突破失败时入场，如K线7，然后如果这波反弹也失败了，演变成一次突破回调时，就反向交易。这里，紧接着的三根K线反弹足够强势。很可能会有第二回合的上升小波段，因此交易员不应该把这里看作突破回调并尝试做空。既然第二回合的上升小波段很可能发生，那么更好的选择是在K线8上方或前面两根K线的低点下方买入。价格向上突破了K线6这一开盘时段的顶部，接着在K线8发出突破回调做多信号。以K线6为第一个顶部的双重顶下降旗形最终没有成功，依据这点来判断K线8也是一个做多的入场形态。","pid":"p969"},{"t":"para","text":"有一点比较重要的是，我们必须认识到，尽管市场昨天从K线5开始迅猛下跌，但仍可能轻易地在今天开盘的K线6处跳空高开。如果这种情况真的发生了，那么从K线5开始的这波下跌就将成为一次失败的突破尝试。","pid":"p970"},{"t":"img","src":"assets/img/p3c2_002.webp","ctx":[{"t":"当开盘时段行情对前一天的收盘形态发生突破，交易员们应该在突破失败时入场，如K线7，然后如果这波反弹也失败了，演变成一次突破回调时，就反向交易。这里，紧接着的三根K线反弹足够强势。很可能会有第二回合的上升小波段，因此交易员不应该把这里看作突破回调并尝试做空。既然第二回合的上升小波段很可能发生，那么更好的选择是在K线8上方或前面两根K线的低点下方买入。价格向上突破了K线6这一开盘时段的顶部，接着在K线8发出突破回调做多信号。以K线6为第一个顶部的双重顶下降旗形最终没有成功，依据这点来判断K线8也是一个做多的入场形态。","p":"p969"},{"t":"有一点比较重要的是，我们必须认识到，尽管市场昨天从K线5开始迅猛下跌，但仍可能轻易地在今天开盘的K线6处跳空高开。如果这种情况真的发生了，那么从K线5开始的这波下跌就将成为一次失败的突破尝试。","p":"p970"},{"t":"无论当天第一根K线多么强势，无论昨天收盘的位置有没有交易员被套，我们也要时刻对突破最终失败的结局做好准备（见图18.2）。","p":"p971"},{"t":"长达四个小时的上升通道，形成一个下降旗形，最后突破下行直到收盘。上升通道由高潮通道上涨趋势构成，跌至K线4的抛售运动形成一个潜在的双重底上升旗形。跌至K线4的抛售运动向下突破了上升通道，今天的开盘又向上突破了通道顶部。虽然当天的第一根K线是一根强势的反转阳线，可能成为当天一轮启动于开盘时段的上涨趋势的起点，但紧跟而来的却是一根强势阴线，并构成一个双K线反转，一次突破失败的做空入场形态，一个更高高点的主要趋势反转。结果就是价格向上突破K线3楔形顶部以及扩张三角形顶部（K线2和K线3为三角形的头两推），然后失败而回。新一轮下跌趋势在开盘时段正式启动。","p":"p972"},{"t":"昨天的高潮通道上涨趋势，在楔形通道中结束，接下来行情可能走出至少两个小波段的横盘整理，但突破至K线4的回调在K线5处形成一个更高的高点。当出现如楔形或扩张三角形这种强势反转形态的二次入场机会时，市场通常会调整至少10根K线的时间，并走出两个小波段，如此例所示。市场走出了一波近似可测量的下跌行情，并回踩至昨天低点上方。低点处的两根阳线显示了买压信号。有些多头当K线8向上超越这些阳线时挂条件单入场。其他交易员则在K线8这根外包上行K线上方入场。市场尝试在这里与昨天低点一起构成双重底，如果价格向上突破了K线5高点，那么在接下来两天里可能继续走高，形成一波可测量的上涨行情。","p":"p973"},{"t":"K线9是一根外包上行突破K线，它改变了市场的格局，由空转多。它使交易员们认为市场不再处于下降旗形的成型过程中，而且更有可能形成当天低点。","p":"p974"},{"t":"涨至K线10的那波反弹，三根阳线涨势迅猛，实体较长影线较短，因而很可能后续会走出第二回合的上升小波段。接下来的回调也可能保持在K线9低点上方，使得大多数交易员都开始相信市场已经转变为多头态势。","p":"p975"},{"t":"涨至K线3的行情非常强势，走出了很多根阳线，尽管它以楔形结束，但这种强劲的势头使行情经历一番调整后很可能向上发起第二次冲击。在更大级别的时间周期图表上，这里很可能表现为一个上涨高潮。","p":"p976"},{"t":"在出现至少双波段调整行情之前，楔形通常不会失败，因此当市场以一根阳线跳空高开时，多头将非常兴奋。然而，就在下一根K线，他们就被震仓出局，聪明的交易员们把这种现象看作是一个连续的反向的失败，于是开始做空。","p":"p977"},{"t":"K线6在一波陡峭的下跌趋势中未能成功突破其下跌趋势线，因此它是一个小型的趋势线低点1做空信号。这波强劲的下跌势头可能延续为新一轮下跌波段，K线6又存在于这个势头当中，因而这种低点1做空信号是一个合理的交易机会。","p":"p978"},{"t":"K线7形成了一个空头做点2做空入场形态，并与K线6组成一个小级别的双重顶。","p":"p979"},{"t":"行情强势涨至K线3后，在K线8处进行深度调整，这种横盘整理的价格行为正是交易员所等待的。它以双波段形式下跌。并测试昨天低点。有些交易员把跌至K线8的下跌运动看作双波段的调整行情。第一回合的小波段跌至K线4，并回调至一个更高的高点。","p":"p980"},{"t":"K线9是另外一次买入机会，因为它是一个失败的低点2形态，通常能再引出至少两个回合的上升小波段。这是一次很棒的交易机会，因为低点2的形态把多头排除在强势的上涨运动之外，所以他们不得不在后期继续追涨。类似这样的外包上行K线构成了失败的低点1或低点2形态。在一轮强劲趋势的开端往往很常见，这表明这轮趋势将继续推进。","p":"p981"},{"t":"涨至K线10的强势小波段向上突破了趋势线和移动平均线，走出了很多阳线，随之而来的很可能是一个更高的低点。K线10也是一根移动平均线跳空K线，但这个时候你将伺机在行情回调时买入，而且只会在入场形态非常好时才选择做空，即使做空也只是为了进行刮头皮操作。从K线9开始趋势一路上扬，直到出现反向指标。","p":"p982"},{"t":"K线11是对微型下降通道的一次失败的突破，而K线12形成了更低低点的突破回调买入形态。","p":"p983"},{"t":"市场在走向K线13的过程中形成了两波小规模的下跌趋势，这实际上是自K线12反转向上后的一次双波段调整。你可以在K线13处买入，而价位设于K线12后面第二根阴线上方，也可以等K线14前面那根内含线突破回调。然后在K线14处买入。这是一个更高低点的主要趋势反转。","p":"p984"},{"t":"当市场向上突破K线10后几乎没有任何回调，这表明多头力量十分强大。你可以在1分钟图上寻找一个高点2的形态入场做多，也可以在5分钟图上等待一段休整或回调行情。","p":"p985"},{"t":"K线15不是一个很好的高点1做多信号，因为前面的上涨势头不再迅猛。它跟在一波小型的急速高潮上涨运动之后，而这波上涨运动击穿小级别的趋势通道线（虚线），然后反转向下，很可能进入横盘整理，走出至少两个小波段的向下调整行情。另外，信号K线是一根强势阴线，它预示着市场将继续呈现多空对的局面。而市场将双向震荡的迹象来自信号K线倒数第四根K线，这根线也是一根阴线，而且K线15前面的五根K线都反复拉锯，带有显著的上下影线。","p":"p986"},{"t":"K线16是一个高点2做多信号，向上突破小型内含线。充允许交易员设置较窄的止损幅度。","p":"p987"}]},{"t":"para","text":"无论当天第一根K线多么强势，无论昨天收盘的位置有没有交易员被套，我们也要时刻对突破最终失败的结局做好准备（见图18.2）。","pid":"p971"},{"t":"para","text":"长达四个小时的上升通道，形成一个下降旗形，最后突破下行直到收盘。上升通道由高潮通道上涨趋势构成，跌至K线4的抛售运动形成一个潜在的双重底上升旗形。跌至K线4的抛售运动向下突破了上升通道，今天的开盘又向上突破了通道顶部。虽然当天的第一根K线是一根强势的反转阳线，可能成为当天一轮启动于开盘时段的上涨趋势的起点，但紧跟而来的却是一根强势阴线，并构成一个双K线反转，一次突破失败的做空入场形态，一个更高高点的主要趋势反转。结果就是价格向上突破K线3楔形顶部以及扩张三角形顶部（K线2和K线3为三角形的头两推），然后失败而回。新一轮下跌趋势在开盘时段正式启动。","pid":"p972"},{"t":"para","text":"昨天的高潮通道上涨趋势，在楔形通道中结束，接下来行情可能走出至少两个小波段的横盘整理，但突破至K线4的回调在K线5处形成一个更高的高点。当出现如楔形或扩张三角形这种强势反转形态的二次入场机会时，市场通常会调整至少10根K线的时间，并走出两个小波段，如此例所示。市场走出了一波近似可测量的下跌行情，并回踩至昨天低点上方。低点处的两根阳线显示了买压信号。有些多头当K线8向上超越这些阳线时挂条件单入场。其他交易员则在K线8这根外包上行K线上方入场。市场尝试在这里与昨天低点一起构成双重底，如果价格向上突破了K线5高点，那么在接下来两天里可能继续走高，形成一波可测量的上涨行情。","pid":"p973"},{"t":"para","text":"K线9是一根外包上行突破K线，它改变了市场的格局，由空转多。它使交易员们认为市场不再处于下降旗形的成型过程中，而且更有可能形成当天低点。","pid":"p974"},{"t":"para","text":"涨至K线10的那波反弹，三根阳线涨势迅猛，实体较长影线较短，因而很可能后续会走出第二回合的上升小波段。接下来的回调也可能保持在K线9低点上方，使得大多数交易员都开始相信市场已经转变为多头态势。","pid":"p975"},{"t":"para","text":"涨至K线3的行情非常强势，走出了很多根阳线，尽管它以楔形结束，但这种强劲的势头使行情经历一番调整后很可能向上发起第二次冲击。在更大级别的时间周期图表上，这里很可能表现为一个上涨高潮。","pid":"p976"},{"t":"para","text":"在出现至少双波段调整行情之前，楔形通常不会失败，因此当市场以一根阳线跳空高开时，多头将非常兴奋。然而，就在下一根K线，他们就被震仓出局，聪明的交易员们把这种现象看作是一个连续的反向的失败，于是开始做空。","pid":"p977"},{"t":"para","text":"K线6在一波陡峭的下跌趋势中未能成功突破其下跌趋势线，因此它是一个小型的趋势线低点1做空信号。这波强劲的下跌势头可能延续为新一轮下跌波段，K线6又存在于这个势头当中，因而这种低点1做空信号是一个合理的交易机会。","pid":"p978"},{"t":"para","text":"K线7形成了一个空头做点2做空入场形态，并与K线6组成一个小级别的双重顶。","pid":"p979"},{"t":"para","text":"行情强势涨至K线3后，在K线8处进行深度调整，这种横盘整理的价格行为正是交易员所等待的。它以双波段形式下跌。并测试昨天低点。有些交易员把跌至K线8的下跌运动看作双波段的调整行情。第一回合的小波段跌至K线4，并回调至一个更高的高点。","pid":"p980"},{"t":"para","text":"K线9是另外一次买入机会，因为它是一个失败的低点2形态，通常能再引出至少两个回合的上升小波段。这是一次很棒的交易机会，因为低点2的形态把多头排除在强势的上涨运动之外，所以他们不得不在后期继续追涨。类似这样的外包上行K线构成了失败的低点1或低点2形态。在一轮强劲趋势的开端往往很常见，这表明这轮趋势将继续推进。","pid":"p981"},{"t":"para","text":"涨至K线10的强势小波段向上突破了趋势线和移动平均线，走出了很多阳线，随之而来的很可能是一个更高的低点。K线10也是一根移动平均线跳空K线，但这个时候你将伺机在行情回调时买入，而且只会在入场形态非常好时才选择做空，即使做空也只是为了进行刮头皮操作。从K线9开始趋势一路上扬，直到出现反向指标。","pid":"p982"},{"t":"para","text":"K线11是对微型下降通道的一次失败的突破，而K线12形成了更低低点的突破回调买入形态。","pid":"p983"},{"t":"para","text":"市场在走向K线13的过程中形成了两波小规模的下跌趋势，这实际上是自K线12反转向上后的一次双波段调整。你可以在K线13处买入，而价位设于K线12后面第二根阴线上方，也可以等K线14前面那根内含线突破回调。然后在K线14处买入。这是一个更高低点的主要趋势反转。","pid":"p984"},{"t":"para","text":"当市场向上突破K线10后几乎没有任何回调，这表明多头力量十分强大。你可以在1分钟图上寻找一个高点2的形态入场做多，也可以在5分钟图上等待一段休整或回调行情。","pid":"p985"},{"t":"para","t
