 "弱点：认知局限性、策略性盲点", "发展路径：培养系统思维和复杂情境应对能力", "文艺复兴时期的人类（所有象限）", "优势：流畅融合、自然平衡、轻松卓越", "弱点：可能缺乏在任何单一领域的极高专业知识", "发展路径：选择专业领域，同时保持整合性", "第三部分：高级动力学", "通道力学（完整系统）", "通道是指正常限制消失、快速转变发生的长期加速发展时期。通道就像发展中的虫洞——高风险、高回报的密集增长期。", "痴迷框架：频道体现了“痴迷”阶段的巅峰状态——“你深入探索现实的奥秘。你无法停止学习和朝着目标不断前进。”这种状态可以持续数月，带来指数级增长。", "举几个例子：", "心智：沉浸于深入思考，彻夜难眠，最终形成突破性的框架。", "正文：找到一种训练方法，并在3个月内取得比过去几年更大的进步。", "精神：蜜月期、神秘体验、寻找转变世界观的哲学", "职业目标：最大程度地清晰地了解产品发布、业务转型或创意突破的路径。", "通道激活", "自然触发因素：生活危机促使成长。会见变革型人物。发现热情所在。跌入谷底。意想不到的成功打开了机遇之门。", "宏观心流现象：尽管“通道”与心流状态有所区别，但它们与科特勒所说的“宏观心流”具有一些共同特征——即多个心流状态在较长时间内相互串联。一个“通道”可能包含数百次持续数月的心流体验，从而带来持续的转变。关键区别在于：通道涉及根本性的身份重组，而心流状态则可以在既有的身份结构中发生。", "有意触发因素：", "公众承诺/问责制", "环境发生剧烈变化", "加入强化课程", "承担“不可能完成的项目”", "消除所有干扰", "通用流程触发器：科特勒的完整触发器列表可以有意地激活通道：", "环境触发因素：高后果、丰富的环境、深度体验、不可预测性", "心理触发因素：高度专注、目标明确、即时反馈、挑战与技能的比例", "社会触发因素：共同目标、共同风险、认真倾听、平等参与", "创意触发因素：模式识别、横向联系", "基于兴趣的切入点：渠道往往源于真正的兴趣：“秘诀在于尝试一切，直到找到让你无法自拔的那件事。”", "通道特性", "入场信号：", "时间扭曲（流动状态）", "毫不费力地集中注意力", "身体能量激增", "创意涌现/下载", "社会退缩需求", "睡眠模式改变", "食欲波动", "维持因素：清晰的愿景/使命。进度反馈循环。社区支持。资源可用性。健康维护。压力管理。整合实践。", "退出模式：能量逐渐下降。注意力自然转移。完成感。新问题的出现。疲惫需要休息。生活需要关注。整合需求日益凸显。", "故障：高风险加速器", "故障的本质：故障是一种能够突破正常意识限制，从而强制快速发展的机制。就像利用电子游戏代码中的漏洞一样，它们绕过了正常的进程规则——但也伴随着相应的风险。", "核心原则：现实中存在一些可以快速进步的“捷径”，但如果没有适当的基础就利用这些捷径，就像不经过训练就服用类固醇一样——具有破坏性而不是促进性。", "神经科学中的“故障” ：这些干预措施通过大幅改变神经化学，使其超出正常范围来发挥作用。迷幻剂会使大脑充满血清素类似物，从而创造神经可塑性窗口。极限运动会同时激增所有流动神经化学物质。虽然这些方法威力强大，但如果使用不当，也会损害受体位点和调节机制。", "历史先例：威廉·詹姆斯曾尝试使用一氧化二氮来改变意识状态。奥尔德斯·赫胥黎则使用过麦司卡林。如今的不同之处在于：我们通过神经科学了解了这些药物的作用机制和风险，从而能够做出更明智的选择。", "元危机背景：整个科技时代可以被视为人类利用文明漏洞——获得了神一般的力量，却没有发展出神一般的智慧。个体的漏洞也反映了这种模式。问题不在于是否要利用它们，而在于如何明智地利用它们——如果真的要利用的话。", "人工智能作为元故障", "人工智能代表着第一个同时影响所有象限的故障。它正在成为一切创造的基础：“写作是一种元技能……随着语言学习和人工智能工具的进步，代码已经开始呈现出自然语言的形态。”", "按象限划分的 AI 增强：", "思维提升：无限知识获取。模式识别放大。理念综合加速。语言/框架生成。元认知增强。", "身体优化：个性化方案生成。实时形态分析。恢复优化。营养计划。长寿模型。", "灵性导航：", "哲学探索。影子工作协助。关系模式分析。意义框架创建。死亡沉思支持。", "职业加速：技能学习压缩。市场分析能力。内容生成规模化。自动化实施。系统设计协助。", "人工智能特有的风险：", "认知衰退：完全外包思考。", "身份混淆：无法区分自身与人工智能。", "现实分离：生活在人工智能介导的现实中。", "能力错觉：将人工智能的能力误认为是自身的能力。", "依赖关系形成：离不开人工智能。", "元危机意义：人工智能是指数级技术超越人类智慧的终极体现。它带来了前所未有的发展加速，但也带来了前所未有的主权丧失风险。如何在运用人工智能的同时保持人类的自主性，或许是我们这个时代面临的最严峻挑战。那些掌握了这种平衡的人将获得巨大的优势；而那些失败的人则沦为机器智能的附庸。", "跨象限动态（完整模式）协同模式", "良性螺旋：", "身体（能量）→ 精神（连接）→ 心灵（清晰）→ 职业（资源）→ 身体（投入）", "每一次进步都让下一次进步变得更容易。小的进步会在各个象限中累积。", "卓越循环：", "职业（挑战）→ 心智（学习）→ 身体（实践）→ 精神（意义）→ 职业（精通）", "某一领域的卓越表现可为其他领域提供试验田。", "融合浪潮：", "心智（理解）→职业（应用）→精神（目标）→身体（体现）→心智（智慧）", "知识只有通过充分流通才能转化为智慧。", "阻塞模式", "贫困陷阱：", "职业技能低下→生存压力→缺乏身体能量→精神孤立→思维混乱→职业技能进一步下降", "如果没有经济基础，其他方面的发展几乎是不可能的。“金钱往往是阻碍人们达到个人发展下一阶段的唯一因素。”", "成功陷阱：", "高尚的职业追求 → 时间匮乏 → 忽视身体 → 精神空虚 → 心智狭隘 → 职业停滞", "在一个象限取得成功会吞噬其他象限，最终导致崩溃。", "精神捷径：", "高昂的情绪 → 逃避现实 → 忽视职业 → 身体衰弱 → 精神错乱 → 虚假的精神", "没有根基的超越，空中楼阁。", "优化陷阱：", "高尚的头脑 → 分析瘫痪 → 职业拖延 → 精神上的理性化 → 身体上的脱节", "理解而缺乏实践，教授综合症。", "级联动力学", "正向级联效应：", "身体突破级联：能量的增加可以延长工作时间。自信能改善人际关系。头脑清晰有助于做出更明智的决定。成功会在不同领域产生连锁效应", "财务自由级联：消除生存压力。促进健康投资。为建立关系创造空间。允许进行智力活动。", "关系疗愈级联：情绪稳定有助于提高注意力。支持会促使人们承担风险。爱赋予意义。人际关系增进健康。", "负面级联效应：", "健康危机级联：医疗费用耗尽积蓄。精力不足会扼杀生产力。因无法参与而导致的孤立。抑郁蒙蔽了双眼。", "关系破裂连锁反应：情绪混乱会扰乱工作。压力性进食会损害健康。隔离会损害判断力。意义危机出现。", "职业生涯失败连锁反应：经济压力会影响健康。羞耻感会破坏人际关系。身份危机蒙蔽了双眼。", "生存模式会阻碍增长。", "元危机应用：文明级联效应的运作方式如出一辙。气候变化造成难民，难民造成政治动荡，政治动荡造成经济崩溃，经济崩溃导致人们无力应对气候变化。理解级联效应的动态变化有助于找到关键的杠杆点，通过小规模干预即可防止系统性崩溃——无论对个人还是集体而言皆是如此。", "错误转换模式（完整分类）", "当一个人表面上模仿某个发展阶段的外貌、语言或行为，而内在意识层面却没有相应转变时，就会出现虚假的转变。这种转变是表演性的而非真诚的，是模仿性的而非整合性的。这尤其危险，因为它满足了自我渴望“进化”的需求，却阻碍了真正的成长。", "前超理性谬误：肯·威尔伯指出了发展过程中一个关键的错误：将前理性状态与超理性状态混淆，因为两者都是非理性的。例如，一个处于1.0级的人无意识地遵循规则（前理性），可能与一个处于3.0级的人有意识地选择遵循同样的规则（超理性）的行为相似。他们的行为看起来完全相同，但其背后的意识却截然不同。这种谬误在每个象限中都存在：", "思维：将孩童般的魔法思维与超个人洞察力混淆", "身体：将无意识的自然动作误认为是身体的掌控", "精神：将前个人融合与超个人统一混为一谈", "职业：将天真的乐观主义与后传统创造力相结合", "危险在于：人们常常退回到前习俗状态，却误以为自己正在迈向后习俗状态。例如，一位正经历中年危机的管理者可能会放弃所有结构（前习俗状态），误以为自己正在获得自由（后习俗状态），而实际上，整体发展应该在保持结构的同时，超越其局限性。", "心智象限错误转变", "知识分子：", "引言哲学，无意识地生活", "词汇复杂，思维简单", "懂冥想，却从不静坐。", "辩论启蒙，持续触发", "读懂了所有内容，但什么也不应用。", "检测方法：要求提供具体例子。请求原创想法。观察情绪反应。检查日常操作。测试知识应用。", "假大师：教导他们尚未取得的成就。神秘而非清晰。声称拥有独特的知识。避免提出具体问题。", "生活方式与教学内容截然不同。身体象限错误转换。", "审美型运动员：外形健壮，但功能性差。照片完美，但经过大量后期处理。补充剂优于食物。极端措施，不可持续。因自负而不断受伤。", "检测方法：测试功能性动作。检查随时间推移的一致性。观察能量水平。回顾伤病史。评估基本健康指标。", "生物黑客：缺乏基本功能的电子产品。没有基础的协议。未实施的数据。优化而不健康。复杂胜于简单。灵性象限的虚假转变。", "精神唯物主义者：像收集奖杯一样收集经验。提及老师/实践。爱与光的毒性。绕过影子工作。表演而非体现。", "检测方法：观察关系质量。检查社区参与情况。测试对批评的反应。注意精神上的优越性。", "评估每日善举。", "虚假的神秘主义者：声称拥有特殊权力。当被问到具体问题时，回答含糊不清。基本智慧的收费。创建依赖关系。生活在幻想中。职业象限错误转变。", "想成为企业家的人：名片，无业务。谈成生意，却没达成任何协议。未实施的课程。工具无需执行。计划却不付诸行动。", "检测方法：核实实际收入。核实所宣称的成就。观察工作一致性。测试特定知识。回顾实际成果。", "假专家：", "没有能力的证书", "理论缺乏实践", "没有结果的指导", "不精通而教书", "没有证据的成功", "回归机制（完全理解）", "退行是指在压力、创伤或生活变故等情况下，暂时或持续地恢复到早期发展模式。这并非失败，而是一种自然的保护机制——就像电脑在不堪重负时重启进入安全模式一样。", "回归类型", "急性退化：", "由特定事件触发", "临时（数天至数月）", "先前的水平模式出现", "知识完好无损，但无法获取", "在支持下，康复是可能的。", "慢性退化：", "随着时间的推移而缓慢恶化", "无需干预的半永久性", "多个象限受到影响", "身份混淆", "需要系统性重建", "级联回归：", "一个象限的崩溃会引发其他象限的崩溃。", "快速多域退化", "危机模式启动", "生存模式占据主导地位", "需要紧急干预", "回归触发因素", "通用触发器：", "亲人去世", "健康危机/诊断", "金融灾难", "感情背叛", "职业生涯的毁灭", "成瘾复发", "创伤再激活", "等级特定触发器：", "级别 3 → 2 回归：成功导致自满。与教学角色隔离。哲学危机。结构坍塌的含义。社区排斥。", "级别 2 → 1 回归：彻底失败。权威人物回归。安全威胁。身份攻击。资源稀缺。", "元危机特有的触发因素：文明崩溃焦虑。信息过载。叙事战曝光。社区分裂。意义危机。生态悲伤。未来止赎。回归恢复协议。", "第一阶段：稳定期", "保障基本需求。建立安全机制。联系支持人员。暂停新开发。注重基本面。", "第二阶段：评估", "识别触发事件。绘制受影响象限图。库存完好资源。识别模式。计划恢复路径。", "第三阶段：重建", "从最强的象限开始。小而持续的实践。避免使用故障工具。关注整合。庆祝小胜利。", "第四阶段：整合", "从回归中学习。建立预防系统。加强薄弱环节。建立预警系统。与他人分享经验。", "元危机应用：随着系统不稳定，倒退的可能性越来越大。建立倒退韧性——即确信自己能够恢复——变得至关重要。了解倒退的社群能够在成员经历倒退时给予支持，而不是抛弃他们。这便能创造一种反脆弱的发展模式，使其在挑战中不断增强。", "第四部分：评估方法", "自我评估框架。反视觉评估（从这里开始）。在评估自身现状之前，首先要明确自己绝不会走向何方。当积极的愿景尚不清晰时，这种反向愿景能带来即刻的清晰指引。", "心灵反视觉：你绝对无法接受哪些心理状态？哪些认知缺陷最令你感到沮丧？你厌恶他人的哪些思维模式？你最害怕哪种思想停滞？", "身体防视：你拒绝接受哪种生理状态？你最害怕哪些健康问题？哪些身体缺陷会让你感到愤怒？你拒绝哪种衰老模式？", "精神反视觉：你绝对不会重蹈覆辙哪些人际关系模式？你拒绝的是怎样毫无意义的存在？你内心深处究竟隐藏着怎样的空虚？你害怕什么样的孤立？", "职业反愿景：什么样的工作环境会让你感觉内心麻木？你拒绝接受什么样的财务状况？你最反感哪种职业身份？什么样的遗产会让你感到羞耻？", "诚实的自我评估问题", "思维象限评估：我可以接受悖论而不寻求解决方案吗？我的思维方式是基于系统还是基于孤立的事实？我多久会根据新证据更新我的观点？我能用简单的语言解释复杂的概念吗？我是否寻求与我的观点相悖的观点？我的内心独白是积极的还是消极的？我能否在不成为自己想法的情况下观察自己的想法？", "身体象限评估：我一整天都有精力吗？我能很好地完成基本的人体动作吗？我了解自己的营养需求吗？我的睡眠是否始终能让我恢复精力？我看起来健康吗？感觉健康吗？压力之下，我的身体能承受得住吗？我的实际年龄看起来比实际年龄年轻吗？", "精神象限评估：我拥有能滋养我的人际关系吗？我可以向别人袒露心扉吗？我是否为社区做出贡献？我是否已经接受了死亡？我能否从苦难中创造意义？我是否觉得自己与某种更伟大的事物有联系？我的日常生活中有爱吗？", "职业象限评估：我的工作感觉像玩耍吗？我可以获得不受时间限制的收入吗？我创造的价值是否大于我所获取的价值？我是在构建系统还是只是在工作？我了解市场动态吗？我的职业发展是否正在加速？我的作品会比我活得更久吗？", "元危机特定评估：我是否理解生成器函数如何导致全局问题？我能否看出我的行为是如何加剧或解决系统性问题的？我是在发展自主权还是在加剧依赖性？我的方案是针对根本原因还是表面症状？我的成功与集体的繁荣息息相关吗？我是否在增强应对系统性冲击的韧性？我能否在不否认现实的情况下抱有希望，在不恐慌的情况下保持担忧？", "可观察行为标记", "1.0 级行为（任务执行者）：不断引用他人的话。因分歧而引发。盲目追随潮流。需要外部验证。避免不确定性。非黑即白的思维方式。归咎于环境。等待指示。", "2.0级行为（机构开发人员）：一切疑问。寻求优化。价值观独立。持续测量。故意进行实验。构建个人系统。承担责任。创建自己的路径", "3.0级行为（整合型创造者）：拥抱悖论。创建框架。教导他人。融合对立面。产生意义。建设社区。促进发展。解决有趣的问题。", "4.0级行为（进化具身）：", "以合一意识运作。解决方案自发涌现。通过存在催化。超越恐惧。创造现实。服务于进化。体现未来。", "第五部分：发展战略", "问题解决方法论", "人生就是不断解决问题。每一个解决方案都会引出下一个问题。这并非缺陷，而是推动进化的必然特征。“你的苦难源于你的使命，而你可以选择为何而受苦。”", "问题层级", "生存问题（必须首先解决）：健康危机。财务紧急情况。亲密关系暴力。精神健康危机。成瘾活跃。住房不稳定。法律问题。", "需求层次理论的联系：这与马斯洛的需求层次理论相对应，齐克森米哈里和科特勒都曾引用过该理论。只有在基本安全需求得到满足后，心流状态才能出现。在生存模式下试图发展更高层次的能力在神经生物学上是不可能的——杏仁核的劫持会阻碍前额叶皮层的功能。", "稳定性问题（地基建筑）：", "创收。健康基础知识。关系修复。心理调节。习惯养成。技能发展。社区调查。", "增长问题（发展重点）：职业发展 → 职业发现。适应性优化。加深亲密关系。意识扩展。超越生存的财富积累。目的澄清。遗产创造。", "积分问题（高级挑战）：象限平衡。生活方式设计。系统构建。社区领导力。代际影响。智慧修炼。死亡准备。", "元危机问题（文明）：主权发展。反竞争行为。再生创造。系统思维。智慧修炼。社区韧性。", "过渡贡献。", "问题解决过程。", "问题识别：具体哪里疼？根位于哪个象限？解决问题会带来什么？是什么因素导致了这个问题？你尝试过哪些方法？", "解决方案设计：最小有效剂量。日常/每周练习。测量标准。支持要求。时间线切实可行。执行。从最小可行的方案开始。首先要建立一致性。逐步增加复杂性。跟踪领先指标。根据反馈进行调整。一体化。自动。链接到身份。教导他人。再接再厉。确定下一个问题。", "元危机问题解决：始终要问：这个解决方案是否能创造正和博弈的动态？它是否能解决根本问题？它是否能增强韧性？它是否能促进他人发展？它是否服务于整体？", "生活方式设计框架", "问题优先方法", "与其设计一种理想的生活方式然后强迫自己去遵循，不如先解决那些阻碍自然融合的问题。发展源于智慧的问题解决，而非强求的平衡。", "第一步：确定主要制约因素", "如果解决了某个关键问题，就能解锁多个象限？", "常见限制：耗费所有时间/精力的职业（最常见）。健康危机需要所有资源。关系危机引发混乱。金融危机迫使人们进入生存模式。危机瘫痪行动的含义。", "步骤二：应用最低有效发展", "不要事事大刀阔斧，找到能创造喘息空间的最小改变。", "例如：", "如果工作占据了所有时间：每天花一小时进行技能提升", "如果健康状况不佳：每天早晨运动 10 分钟", "如果关系破裂：每周至少建立一次真诚的联系", "如果经济拮据：每天花30分钟学习创收技能", "如果意义不明：思考5分钟", "步骤 3：将释放的资源用于下一个约束", "当第一个问题逐渐得到解决后，将释放出来的资源用于应对下一个难题。这样就形成了一个良性循环：解决每个问题都能为下一个问题提供资源。", "第四步：识别级联机会", "通常，解决一个问题后，你会发现“下一个”问题并非你想象的那样。你创办企业是为了拥有更多时间，却发现自己精力不足——真正的限制因素是身体，而非职业。", "每日练习模板", "写作练习（所有级别）", "“开始写作吧。一个自由人的标志是他一生中会做很多事情。这要求他学会如何学习、如何思考以及如何赚钱。写作恰好满足了这三点。”", "晨间写作练习（30分钟）：", "5分钟：反视觉清晰度（你今天拒绝的）", "10分钟：问题识别和解决方案设计", "10分钟：价值创造（今天你能帮助谁）", "5分钟：公开分享（帖子、消息或文章）", "一级→二级过渡实践", "代理机构发展框架（60分钟）：", "5分钟：感恩练习", "10分钟：身体活动（自选，不指定）", "15分钟：学习（阅读/音频 - 自选）", "10分钟：工作准备（你的项目）", "10分钟：建立关系（真诚）", "10分钟：反思/计划（你的目标）", "心流触发整合：此组合系统地激活多种心流触发因素：感恩（风险/回报平衡）、运动（身体体验）、学习（新鲜感）、工作准备（明确目标）、联结（社交触发因素）和反思（即时反馈）。该顺序能够激活所有主要的神经化学系统，从而达到最佳的日常表现。", "晚间堆栈（30分钟）：10分钟：当日回顾。10分钟：准备明天。10分钟：放松练习。", "恢复方案：基于心流研究，该研究表明恢复是一个主动过程，而非被动过程。晚间方案有助于记忆巩固（复习）、减轻焦虑（准备）并触发副交感神经恢复（放松）。", "2级→3级过渡实践", "创作者堆栈（90 分钟）：20分钟：深入探讨你的项目。30分钟：体能训练（内在动机）。30分钟：公开创意工作/写作。10分钟：系统优化。", "集成堆栈（全天）：任务间隙的微冥想。边走边开会/打电话。边学边教。将工作作为一种灵修实践。以运动冥想。", "3级以上维护实践", "流堆栈（灵活型）：自然地跟随能量流动。创造多于消费。通过存在去教导。解决有趣的问题。构建有利结构。畅玩无限游戏。数字杠杆路径（职业发展）。", "历史上第一次，个人拥有了过去需要整个公司才能拥有的分销能力。互联网使生产和分销手段民主化，让任何拥有WiFi的人都能触达数百万人。过去需要印刷机、广播塔或零售网络才能实现的事情，现在只需要一台笔记本电脑和真正的价值创造。", "这项技术变革不仅使你能够从事毕生事业，而且使之成为可能：", "零边际成本分配：付出同样的努力，可以与一个人分享，也可以与一百万人分享。", "无需许可即可触达受众：无需守门人、出版商或机构即可接触受众", "复合增长：一次创建的内容即使在你睡觉时也能持续产生效果，全天候24小时不间断地积累受众。", "全球覆盖：触达全球人口，找到那些能与你的信息产生共鸣的特定人群。", "AI 放大：能够倍增创意产出、处理重复性任务的工具，让您专注于独特的视角。", "直接变现：无需中介即可让支持者即时付款的平台", "现在个人可以独立完成以前需要团队才能完成的工作：", "个人媒体公司（博客、新闻简报、播客、YouTube）", "教育平台（课程、辅导、社区）", "软件产品（使用无代码工具或人工智能辅助）", "实体产品（按需印刷、代发货、小批量生产）", "第一阶段：建立受众群体（2.0 级）", "每天写下你的兴趣爱好。分享你的学习历程。文档问题和解决方案。参与他人的内容互动", "在销售前提供价值。", "第二阶段：产品开发（2.5级）", "打包您的解决方案。从信息产品入手。小组测试。根据反馈进行迭代。扩大有效做法的规模。", "第三阶段：系统与规模（3.0 级）", "自动化重复性任务。建立经常性收入。创作时不会感到疲惫。助力他人成功。设计再生型企业。", "第六部分：最终综合", "元原则。人生就是解决问题：每一个问题的解决都会引出下一个问题。这并非缺陷，而是推动进化的必然规律。问题限制了你的潜能——解决它们则拓展了你未来的发展空间。", "平衡重于整合：不要强行用意志力来维持平衡。要系统地解决问题，直到整合自然而然地发生。", "发展是分形的：相同的模式出现在各个层面——个人、关系、组织、社会。", "超越与包容：更高层次的能力不会抛弃较低层次的能力，而是将它们与更大的选择和智慧结合起来。", "现实有层次：在一个层次上为真的事，在另一个层次上可能就是假的。真假取决于语境。", "意识创造现实：随着意识的发展，你所处的现实也会发生切实的改变。", "生活质量方程式：齐克森米哈里的基本洞见——“生活质量取决于我们如何运用意识”——是所有这些原则的基础。我们如何投入注意力（精神能量）实际上决定了我们所体验到的现实。", "万物皆有联系：一个象限的变化必然会影响其他象限。孤立是不可能的。", "成长需要死亡：每一次层级的转变都伴随着自我消亡。抗拒死亡就是抗拒成长。心流状态的神经科学揭示了其中的原因——前额叶皮层（自我/本我的所在地）必须下调才能使新的模式出现。", "地图并非疆域：人类3.0只是一个模型，而非现实。有用时请运用，无用时请舍弃。", "游戏永无止境：没有终点，没有终极成就。乐趣在于游戏本身，而非胜利。最终的境界是完全自足——在游戏过程中找到内在的满足感。", "物质即门户：不要排斥物质追求——它们往往是通往非物质发展的唯一入口。就像健身一样，你最初是为了满足虚荣心，后来为了疗愈身心，最终达到哲学上的精通。", "反愿景的清晰认知：有时候，知道自己不想要什么比拥有积极的愿景更能指明方向。从你拒绝接受的事物开始。", "自主性胜于任务分配：根本的选择在于，是为他人的目标而活，还是创造自己的目标。无论从事何种职业，都要从雇员思维转变为创业者思维。", "写作即思考：写作不仅仅是沟通——它更是发展思考本身的一种方式。它是面向未来的元技能。", "你就是利基市场：不要寻找市场，而是通过解决自身问题来创造市场。你的独特之处就是你的竞争优势。", "工作演变是自然的：工作→职业→使命，这不是被迫的进步，而是当你解决正确的问题时自然而然发生的演变。", "金钱即能量：金钱并非邪恶——它是一种中性能量。妖魔化金钱只会让你继续受其奴役，而非成为其主人。", "目标创造利润：当你为他人解决有意义的问题时，利润自然而然就会随之而来。价值创造和个人发展密不可分。", "自然的指南针：在无聊与焦虑、安全与不安、已知与未知之间游走，才能找到方向。进步往往发生在边缘地带。", "兴趣导向型教育：迷茫→产生兴趣→痴迷→循环往复。驱动真正学习的是这个循环，而非课程本身。", "最终目标", "个人：实现多维度发展——无需完美，但要达到身心合一。创造一种工作即娱乐、人际关系滋养身心、健康是常态、意义充盈的生活。培养一种自足型人格——在成长本身中找到内在的满足感。", "集体：通过示范、教学和构建体系，促进他人发展。构建支持人类繁荣的社群和系统。通过个体复杂性的提升，为文化演进做出贡献。", "进化论：有意识地参与人类进化。突破可能的界限。让世界比你发现它时更加发达。实现那些看似“不可能”的目标，从而推动整个物种的进步。", "文明层面：为人类成功应对这场元危机做出贡献。帮助创造第三个吸引子——一个反竞争、再生和智慧的文明。", "最终现实", "我们正站在人类历史上最重大的转型时期。从工业/信息意识向整体-行星意识的转变必须在几十年内完成，而不是几千年。", "个人发展不仅仅是个人成长，更是参与人类进化。每一个发展出真正自主性、智慧和人格整合能力的人，都为创造一个可行的未来贡献力量。", "选择很简单，但并不容易：要么停留在 1.0 级，完成任务直到过时，要么发展到 3.0 级以上，创造反竞争价值。", "没有中立地带。你要么是问题的一部分，要么是解决方案的一部分。你要么在消耗资源，要么在进行自我再生。你要么在执行任务，要么在创造自主权。", "工具已经具备，知识也唾手可得，唯一的问题是你是否愿意使用它们。", "你拒绝接受的“反愿景”——你拒绝接受的生活——正在召唤你走向真正的愿景——你命中注定要创造的生活。你所面临的问题并非障碍；它们正是你成长的必经之路。", "从你所在的地方开始。解决你面前的问题。与他人分享解决方案。重复这个过程，直到你成为你注定要成为的人。", "游戏永无止境。赌注至关重要。时不我待。", "记住：“你的苦难源于你的目的，你可以选择为何而受苦。”"], "wcount": 30177}, {"group": "技能习得与人工智能", "gsub": "AI 时代 · 快速掌握 · 顶尖 1%", "icon": "6", "title": "人类3.0——通往顶尖1%的路线图 待排", "paras": [{"h": "人类3.0——通往顶尖1%的路线图"}, "一套全面的指导方针，旨在最大限度地发挥您的潜力（涵盖生活的各个领域）。", "虽然这听起来可能很老套，但我一直都想成为一股不可忽视的力量。", "个体的绝对单位。", "不仅要拥有健美的体魄，还要在生活的各个方面全面发展。", "我想成为全方位的超级玩家。我想把所有属性都练到最高。我不想当个NPC。我想成为100级玩家。地图上的所有区域都解锁。体能、智力和职业技能都达到最高。银行里堆满金币。我想做到一切：精神、体魄、灵魂、人际关系、金钱。", "这种愿望极大地影响了我的生活。", "青少年时期，我痴迷于健身。后来，我渴望尽可能多地吸收知识。再后来，我追求自由，尝试了各种商业模式，但都以失败告终，直到最终找到一个成功的模式。我曾有过几次精神和哲学方面的探索，我相信这些经历让我对金钱和健身这类“肤浅的追求”有了与常人截然不同的看法。", "在过去的15年里，我深入研究了心理学、个人发展、哲学、社会动力学、科技、互联网、创业、金钱、宗教和意义等领域。", "在过去 5 年里，我一直在网上撰写我的研究成果，我注意到一些关键的重叠模式，这些模式已经开始形成一种适用于当今世界的新哲学。", "这就是人类3.0的用武之地。", "我想将我所学到的一切融会贯通，汇集成一张全面的地图，帮助你驾驭现代社会。我想为你提供知识、技能和原则，助你摆脱平庸，充分发挥自身潜力。我会尽量做到客观公正、以科学为依据，同时也会力求清晰有力地阐述我的观点。我计划用简洁自然的语言，尽可能地简化概念，使之更贴近当今世界，避免沦为一本被人遗忘的教科书。因此，我会用我惯常的语言表达，而将其中的细微差别留给你去体会。理解和批判性思考始终掌握在读者手中。", "这将是一个持续进行的系列节目，我们将剖析人类体验，并重新塑造你的现实，让你过上尽可能美好的生活。", "很多内容可能并不完全正确，我鼓励你们质疑我的观点。事实上，我希望你们能和我一起完善这个理论。如果你在自己的文章或内容中谈到“人类3.0”，我非常乐意看到。接受这些想法并在此基础上进行拓展。如果你喜欢“人类3.0”模型，那就运用它吧。", "现在，市面上已经有很多优秀的模特和专家了。", "螺旋动力学（心理学）、佛教与基督教（意义论）、唯物主义与唯心主义（现实本质论）、电子商务与咨询（商业）、红丸理论与女权主义（社会动力学），等等。无论你走到哪里，都能找到数百种模型，它们都声称能解决你所有的问题。", "所有这些观点都有其道理，但它们的致命缺陷在于，它们都局限于生活的某个特定领域。我们学习数学、英语和科学时，将它们视为孤立的、互不相干的课程，而知识其实是一个网络。我们在实验室里解剖青蛙，却不考虑它们所处的整个生态系统及其相互关联的关系，就妄下结论。除此之外，或许有些人难以接受，许多精神导师身体虚弱。许多商人无法维系人际关系。许多“阿尔法男”在情感上并不平衡。尽管这些成就本身令人钦佩，但真正实现自我完善的人却寥寥无几。", "即使这些模型或大师确实像古希腊哲学那样将多个领域联系起来，但它们通常流行于互联网、科技和人工智能开始改变一切之前。更重要的是，它们很少涉及工作和金钱等领域，这令人惊讶，因为这些领域占据了大多数人的思想和生活。", "今天，我们将奠定人类 3.0 的基础。", "在接下来的几个月（或许几年）里，我们将逐步揭开真正意义上的“活出精彩人生”的真谛。我无法在这篇介绍中涵盖此模式的所有细节。", "更新：我创建了一个 HUMAN 3.0 知识库，其中包含了该模型的细微差别、文明影响、历史背景、科学基础以及我个人的原则。如果您想全面了解该模型，并快速浏览，请在此处阅读或将其粘贴到 AI 中进行探索。我也会在文末附上链接（建议您先阅读此内容）。", "人类3.0——最大化你的潜能模型", "我创建了一个AI提示，帮助你规划自身发展轨迹，找到你的元类型，并确定人生中下一个需要解决的核心问题。我会在下方附上链接。我建议你先阅读这篇文章，以便了解其运作原理。", {"img": "dan28_05", "cap": ""}, "这个模型着眼于全局。它并非一套教条式的操作步骤，而是一套指导原则，帮助你最大限度地发挥潜能，更快地突破心理、生理、精神和职业发展瓶颈。它梳理了人类发展过程中普遍存在的模式，并以各种科学、心理学、精神和职业模型为基础，这些模型已经完成了大量的前期工作。", "我的目标是汲取世界上最伟大理论的精华，并将 其应用于个人生活。", "一旦你理解了这个模型，你就可以开始绘制你当前在每个象限中的发展水平（你的原型）以及你的整体发展状况（你的元类型）。然后，你可以尝试进一步提升到3.0+的元类型——一个在生活各个方面都达到巅峰的元类型。", "我们将在信的后面讨论这些问题，但现在，让我们先了解一下基础。", "1）象限", "人类 3.0 的基础是代表人生四大领域的四个象限。", "心灵（个人精神世界）——你的想法、情感、信念和内心世界。你如何理解世界。", "身体（个人物质世界）——你的行为和外表。外界如何解读你。包括营养、训练、爱好、习惯、仪容、沟通、衣着等等。", "精神（集体精神世界）——你与环境、社区、文化、家庭、朋友、同事以及现实的关系。你如何从中获得意义和联结。", "职业（集体物质世界）——你与教育、职业和经济等系统、结构和社会制度的关系。你如何融入社会并为社会做出贡献。", "该模型改编自 Ken Wilber 的 AQAL 模型，其中的象限代表了四个基本视角，从而创建了所有知识和经验的概括图。", "这种现实图景避免了片面思考，也不会将问题简化为单一视角。内在的心理问题或许并非通过职业手段（例如找份新工作）就能得到最佳解决。精神层面的问题或许也并非通过生理手段（例如营养）就能得到最佳解决。资本家和基督徒在各自的领域都得到了发展，但当他们试图将自己的模式应用于其他领域的问题时，将会经历不必要的痛苦。金钱往往无法解决意义的问题，反之亦然，但这并不意味着它们之间没有密切联系。所有这些领域都是相互交织的，通过在上述各个方面不断提升自我，你就能开始掌控自己的未来。", "由于生命、发展和进化遵循着向更加混乱或复杂的方向展开的一般规律，而有序的结构是为了容纳这种混乱而创造的，因此我们可以将生命的过程，特别是你的个人生活，称为“解决问题”。", "种子会逐渐展开，最终长成一朵花。花比种子复杂得多，为了达到这种状态，它需要从环境中获取资源进行自我发育。种子天生具有生长的本能，经过漫长的进化过程，它解决了许多其他植物物种因此灭绝的问题。", "人们或许不会认为种子是有意识地试图生长或解决问题。然而，通过观察并将这些模式与我们的个人生活联系起来， 我们 就会这样称呼它，因为我们创造了语言。我们可以开始理解，生命存在着一种自然而然地朝着更复杂的方向发展的趋势。复杂性会带来问题，为了限制复杂性带来的熵增，一种有序的结构必须通过创造而产生。", "在你个人的成长过程中，你渴望发挥自己的潜力 → 你迈入未知领域，接触到复杂性 → 你获得知识和技能来解决阻碍前进的问题（或者停滞不前，被混乱吞噬） → 你的身份不断扩展，提升到一个新的层次 → 除非你陷入困境，否则这个过程会不断重复。", "这种模式在现实的各个层面和领域都存在。我鼓励你们思考更多例子，但为了简洁起见，我们继续往下看。", "2）级别", "每个象限内有 3 个宏观发展水平，分别代表低意识 (1.0)、中等意识 (2.0) 和高意识 (3.0)。", "这些层级借鉴了发展心理学中的多种模型，例如螺旋动力学和自我发展的九个阶段，这些模型本身就是对许多心理学理论的深入研究和补充。简而言之，这些研究表明，我们的心智（包括影响我们思考和决策方式的价值观、信念和世界观）会随着时间的推移，经历可预测的阶段而发展。", "人类1.0 （墨守成规者）——重视既定的权威和传统。其特点是心胸狭隘、非黑即白的思维模式，以及认为只有“唯一正确的方法”，这通常源于童年时期的成长经历。", "人类2.0 （个人主义者）——拒绝墨守成规，追求自身目标。他们渴望获得地位，被视为有价值。他们的思想不再那么狭隘，但如今却坚信自己的道路才是唯一正确的道路。", "人类3.0 （综合者）——能够从多个角度看待问题，连接各种现实模式，并制定新的策略。他们明白所有视角都蕴含真理，这些真理可以被综合起来，从而获得更全面、互惠互利的结果。他们可能会展现出一些人眼中1级人格的特征，例如思维狭隘，但这是一种有意为之的选择，旨在屏蔽外界干扰。", "在螺旋动力学模型中，“螺旋”描述了个体在发展过程中如何在自我与他人之间转换关注点（例如，拒绝宗教团体而拥抱个人无神论）。在人类3.0模型中，当个体在特定象限达到新的阶段时，就会发生这种情况。例如，一个人可能在思维上成为个人主义者，这可能会导致其关注点转向精神层面，此时他们仍处于顺从者阶段，并服从权威。", "每个象限中每个级别的描述都呈现出不同的形式，例如，职业象限（右下角）中的 3.0 合成者可以有效地利用人工智能来追求其毕生事业，而 1.0 顺从者则由于缺乏知识、技能和经验而认为人工智能纯粹是邪恶的。", "在身体象限（右上）中，低意识个体不了解自己摄入的营养，导致肥胖和懒惰，因为他们没有获得做出更好决定的特质，而高意识个体了解各种营养物质如何与身体相互作用，可以调整饮食以帮助实现目标。", "这些层级反映了你在任何特定领域的自我复杂程度。整个“人类3.0”图表代表了你。你越复杂（通过培养视角和扩展意识），生活就越精彩，因为你可以选择自己想要迎接的挑战。就像电子游戏一样：1级类似于按照脚本运行的NPC或非玩家角色；2级是选择自己故事情节的主角；3级则是能够创造其他人也乐于游玩的新游戏的程序员。", "注意：较低或较高的层次本身并没有“好”或“坏”之分，它们只是个人成长历程中的不同阶段。“意识水平高”的人并非更优秀，只是发展得更完善，而这种完善自然会带来诸多益处。", "你并非离开任何一个既定的层次，而是超越并涵盖之前的层次。你获得更广阔的视野，从而能够更好地利用在较低阶段积累的知识、技能和工具。", "我们将在下文中深入探讨更多例子。", "3）阶段", {"img": "dan28_04", "cap": ""}, "每个级别都包含三个发展阶段，必须经历这些阶段才能达到下一个级别。这些阶段代表垂直发展，即上升一个级别或下降一个级别。", "当一个人经历深刻变化时，我们可以观察到以下三种常见模式：", "认知失调（第一阶段）——一旦一个人“尝到了”自己当前生活阶段的滋味，如果他没有被狭隘的思想和安逸麻痹，他就会厌倦自己所处的位置，但又不确定接下来会过什么样的生活。", "不确定性（第二阶段）——如果一个人充分意识到自己的厌恶，他们就会迈出不确定的一步，进入未知领域，并敞开心扉接受新的知识和技能。", "探索（第三阶段）——就像使用地图一样，他们探索能够帮助他们达到下一个发展阶段的教育、工具、资源和见解。", "为了便于术语使用，我们可以通过将一个人所处的阶段附加到他们在特定领域中所处的级别，来映射一个人生活中的特定领域。", "例如，“职业 2.1”（第二层级，第一阶段）代表集体外部意识的发展（与系统、结构和社会制度的关系）。“2”代表个人主义层级，“.1”则表示他们几乎已经完成了这一阶段，必须迈出不确定的一步，进入第三层级，去探索人生的下一个篇章。对于职业象限而言，这可能意味着他们已经追求过新的职业，但意识到自己走错了方向，需要做出转变，去发现自己的使命。", "在这个过程中，人们很容易经历虚假转变。他们可能感觉自己已经完成了每个阶段，达到了新的层次，但实际上他们只是在模仿那个层次的发展状态，而没有发展出相应的特质。这是一种自我欺骗，会将人们困在当前的阶段，阻止他们进一步进步，直到他们解决当前阶段遗留的问题。", "这种虚假的转变可能发生在一个人在一个领域（如心灵领域）发展之后，却认为自己在另一个领域（如精神领域或职业领域）取得了进步。", "人在经历暂时的压力或遇到超出自身能力范围的问题时，也可能退化到较低的心理水平。这就解释了为什么你会怀念过去“一切都更美好”的时光，并渴望将那种感觉带回当下。", "正如心流心理学和尼采等众多哲学家的思考所揭示的那样，愉悦的人生在于克服阻力，逐步经历人生的各个阶段。深刻的改变很少是偶然发生的。当你目标明确、认真对待自己的愿景、目标和优先事项，并且不被干扰和安逸所束缚时，那些通常会吞噬大多数人的混乱局面就会变得可以忍受，而且往往会成为你生命中最充实、最珍视的部分。", "从 3 级及以上，玩家可以追求更复杂的挑战，并出于对游戏的热爱而模拟这些阶段（例如，一位 CEO 出售了自己的公司，变得沮丧，然后以更开明的视角重新开始一家公司），而且由于游戏是他们自己创造的，所以游戏就变成了无限的。", "4）特征", {"img": "dan28_03", "cap": ""}, "每个阶段都存在一个知识、经验和技能的门槛，只有达到这个门槛，才能进入下一个阶段。阶段代表纵向发展，而特质则代表横向发展，或者说是在探索未知领域的过程中，积累足够的知识和经验，最终达到下一个阶段。", "每个象限、层级和阶段都面临着不同的挑战，需要一定的技能水平。而这种技能需要通过实践和学习来掌握。", "一个人可以拥有丰富的健身知识，但如果没有实践和经验，就会沦为那种肥胖的私人教练形象。他们的知识固然令人钦佩，但很少有人认真对待他们，这有利有弊。", "无论是纵向发展（阶段性发展）还是横向发展（特质发展），都存在一个共同的陷阱：厌倦和焦虑。如果你在缺乏相应技能和经验的情况下试图跳到新的发展阶段，你会感到焦虑并最终失败。如果你根本不去尝试提升，你就会感到厌倦，转而寻求舒适和消遣。", "无聊和焦虑都会导致精神紊乱，使你脱离进化的进程。你的生活表面上看起来或许还不错，但一切都显得乏味而毫无意义。", "这就引出了“渠道”——一种对抗混乱并取得实质性进展的方法。", "5）通道", {"img": "dan28_02", "cap": ""}, "当你达到任何级别的不和谐阶段时，你就获得了利用“渠道”的能力。", "把频道想象成电子游戏中激动人心的冒险，一个知识或技能的无底洞。你会沉迷于研究某个主题或进行某个项目，根本停不下来，时间也会飞逝而过。", "在“人类3.0”图表中，你可以看到通道的一端位于知识特质，另一端位于技能特质。通常，一个人会“沉迷”于学习或创造，这会带来快速的经验积累，使他们迅速迈向特定象限内的下一个发展阶段。", "例如：", "心灵——进入深度冥想状态（技能）或沿着让你彻夜难眠的思路思考，从而产生大量点亮你大脑的想法（知识）。", "身体方面——你发现了一种新的饮食、补剂或方法，然后疯狂地观看所有相关的资料（知识）。你痴迷于跑步或举重，持续三个月，取得了前所未有的进步（技能）。", "精神——神秘体验、蜜月期、亲密时刻、找到一种与你当前人生阶段“契合”的哲学理念等等。", "职业目标——达到一个高度清晰的目标，迅速促成令人兴奋的职业转变、产品发布或创意工作（技能）。你找到了绝佳的机会，并迫不及待地学习创业所需的技能（知识）。", "进入频道的流程如下。", "首先，你必须在完全适应当前层级后，进入失调阶段。一旦你对现状感到厌倦，并且没有对问题麻木，你就会将这种厌恶感转化为动力，勇往直前，探索未知。你会在某个特定的象限（例如身体象限）内设定目标、愿景或愿景。你开始积累知识和技能。你边学边做。你会犯错，并不断完善你的目标。你会不断尝试，直到找到那个让你心甘情愿投入的通道。", "你可以通过一个人谈论某件事时的兴奋程度来判断他是否身处某个领域，就像一个作家写书时文思泉涌、滔滔不绝一样。他们拥有远见卓识。他们的技能和知识赋予他们清晰的思路，使他们能够在事业上飞速前进。", "当你处于认知失调阶段时，我能给出的最好建议是寻找兴奋和热情，并毫不羞愧地追求它们，因为羞愧表明你的心智水平较低，你可以在这个过程中获得自信的技能。", "关于“故障”：", "有一些策略可以强迫自己进入某个频道或突破发展瓶颈，我们称之为“故障”——就像矩阵中的故障一样，如果矩阵是第 1 级和第 2 级的边界，直到你在第 3 级创造出自己的边界。", "迷幻剂能让人进入一种神秘体验。兴奋剂能加速健身进程。搬进一套自己负担不起的公寓，会给你设定一个真正的期限，迫使你不断学习和实践，直到你的副业步入正轨。", "人工智能是最新且应用最广泛的技术漏洞，它渗透到各个领域。它既可以迅速自我发展，也可以迅速自我毁灭。我们需要具备鉴赏力和判断力。人工智能只有从有限的视角才能被简单地定义为纯粹的善或纯粹的恶。", "要谨慎对待这些，因为它们虽然能加速进步，但在意识水平较低的情况下风险也会增加。如果你在没有任何经验的情况下服用迷幻剂来解读这种改变后的状态，你可能会精神错乱。人工智能引发的精神病以及将你的意识外包给人工智能的做法越来越普遍，这并非因为人工智能本身不好，而是因为它就像服用类固醇一样。如果你没有打好基础，没有广泛研究营养学的各个领域，没有理解所有潜在的相互作用，也没有进行五年以上的训练（比喻意义上的），那么人工智能将会带来严重的副作用。即便如此，许多高回报机制实际上都是有代价的，无论你多么谨慎。对于某些特定目标的人来说，他们可以明知后果却仍然做出承担风险的决定。但对于大多数人来说，尤其是在第一阶段，这些机制无异于死刑判决。", "充分发挥你的“天赋”潜能，积累足够的经验，避免被一击毙命。知识和技能可以降低风险。", "如果你感到迷茫，你可能正处于认知失调期，但如果你坚持下去，你就能找到下一个方向，重新爱上生活。", {"h": "原型与元类型"}, {"img": "dan28_01", "cap": ""}, "在未来的信件和视频中，我们可以使用 Human 3.0 图来了解人们（例如 Jordan Peterson、Andrew Tate 或 Alan Watts），或者克服生活中的问题，例如无法赚钱或找不到伴侣。", "如果您对遇到的问题或想要了解的人有具体要求，请回复此信。", "在这个模型中，我加入了所谓的原型和元类型。", "原型——在特定象限和这些象限内各个层级中出现的人群模式。", "元类型——将一个人的四种原型在每个象限中进行综合。", "把元类型想象成一种性格测试，但它是用于自我发展的。", "我创建了一个提示，帮助你识别你的元类型，绘制你在各个象限的发展图，并在这里找到你生活中的核心问题。", "在上面的例子中，我只展示了每个象限中的三种原型。实际上原型远不止这些，所以请理解这些并非一成不变的。我只是在尝试用这些例子来说明一些有趣的事情。", "你会注意到，随着一个人在某个象限内的发展，其意识水平通常会从低水平逐步提高：", "在“心智象限”中， “NPC → 玩家 → 创造者”描述的是一个不再按照出生时被赋予的剧本生活，开始玩自己的游戏，然后创造新游戏来玩的人（类似于“构造级”意识）。", "在“身体”象限中，“非自愿独身者”（Incel）→“查德”（Chad）→“西格玛男”（Sigma Male）或“贝塔男”（Beta Male）→“阿尔法男”（Alpha Male）→“西格玛男”是当今世界常见的几种男性原型，我们可以从他们的行为和外表中观察到这些原型。这可能与图表上的其他区域相对应，或者在同一象限内存在其他原因。例如，“非自愿独身者”通常由于饮食和环境因素导致雌激素水平较高，而“职业”象限中的社会结构导致了加工食品和微塑料的泛滥，从而大规模地加剧了这一问题。", "职业→事业→使命是天职象限中众多发展路径之一。就工作而言，如今任何事物都可能成为起点。有些人甚至可能没有工作，或者很早就找到了自己的使命。每个阶段发展的关键在于，他们从低意识（顺从者）开始，并有能力提升到高意识（综合者）。", "在灵性象限中，宗教→无神论→神秘主义是一种常见的模式（并非唯一模式），常见于在严格宗教家庭中长大的人，这种模式会导致叛逆。之后，他们重新发现了对上帝的新视角，最终回归到第一阶段所包含的真理。", "肯·威尔伯的“前超理性谬误”是指人们将前理性（顺从主义）状态与超理性（综合主义）状态混淆，因为从传统的理性（个人主义）视角来看，两者都显得“非理性”。这种情况可能双向发生。", "人们可以将 1 级原始状态提升到 3 级状态，而有些人却常常将真正的 3 级发展贬低为原始思维", "换句话说，一个“圣经狂热分子”，由于缺乏童年时期所受教化之外的知识和经验，很难认真对待神秘主义者，而神秘主义者往往持有同样的真理，但却是从更全面的角度来看待的。", "如果这能有所帮助，可以想想智商正态分布曲线的梗图。", "当然，这只是灵性象限中发展进程的一个小例子。在人际关系、体育运动、家庭、科学或形而上学信仰等领域，都存在着各种各样的发展模式。", "每个象限内都有几十到几百种原型，而不仅仅是我在每个象限中展示的三种。", "现在，以上述例子为例，当我们把每个象限、层级、阶段和特征内的发展点都标出来时，我们就能全面了解某个个体所处的位置。（你可以在地图上看到不透明的白色形状。）", "这个具体的例子属于人类2.0阶段。", "我们是如何得出这个结论的？", "在第一级中，每获得一点，他们就能获得 1 分。", "在第二级中，每获得 1 分，他们就能获得 2 分。", "在第 3 级，每获得 1 分，他们就能获得 3 分。", "然后，我们可以用总数除以 12（图表上的发展切片总数），得出 2.0。", "在这个例子中，我们可以对它们在每个象限内的发展情况进行如下描述：", "心智——不再受既定模式支配，接近建构层面的意识。", "身体——不修边幅，有不良习惯，但偶尔会流露出自信。", "精神——相信对上帝的字面解释，但对无神论的朋友和同伴持宽容态度。", "职业——拥有宝贵的教育背景和技能，但专注于安全且有成就感的职业。", "如果我们要在每个象限中绘制超过 3 个原型，这将变得更加复杂和全面，但我们将把这些留到以后的信件中讨论。", "现在，如果我们把这些描述合并成一个，就能得到它们的元类型。我计划用人工智能来实现这一点，因为我不想让它变成一个静态的“性格测试”，把你归入16个通用类别中的一个。", "在这种情况下，我们可以将此人的元类型视为“异类”。简而言之，这类人并非反叛主流模式，而是以一种反主流文化的视角行事。他们不在乎自己的外表，但这可能是一种虚假的转变，因为他们在身体象限方面缺乏经验。", "3.0 生活方式", "“如何平衡各个象限的发展？尤其是当某个象限耗费大量时间、精力和注意力时？”", "最终目标是通过解决问题来创造一种兼顾所有方面的生活方式。", "如果你的职业占据了你太多的时间，以至于你心烦意乱，身心俱疲，无法安宁，这显然是一个需要你通过学习和技能来解决的问题，从而创造通灵的机会。在这种情况下，你可以每天花一个小时研究商机，并抽出一些时间练习。这或许比其他人花费的时间更长，但一旦你开始逐步提升，你就会更有信心减少甚至完全摆脱目前占用你大量时间的工作。", "这种转变可能会使另一个问题更加凸显，例如精力不足或不受潜在客户尊重。事业更上一层楼或许并非需要进一步提升业务水平，而是需要解决与身心或精神相关的问题。即便如此，你或许能建立起令人艳羡的事业，拥有巨额财富，但由于职业追求缺乏意义，你内心仍可能感到空虚。", "通过解决问题的简单方法（并时刻警惕那些让你无法注意到问题的干扰因素），你可以创造一种生活方式，在这种生活方式中，工作变成娱乐，健康成为你的默认状态，意义丰富，你的思维站在你这边。", "更多资源、细微差别和模式", "如果您想要快速了解包含文明影响、历史背景、深刻细微差别、科学基础等内容的完整模型分解版本，请在此处阅读完整的知识库。", "你也可以把它粘贴到人工智能系统中，与它进行对话，探索各种主题和问题。"], "wcount": 9287}, {"group": "技能习得与人工智能", "gsub": "AI 时代 · 快速掌握 · 顶尖 1%", "icon": "7", "title": "深思熟虑的创作的消亡", "paras": [{"h": "深思熟虑的创作的消亡（以及如何超越所有人）"}, "-每天学习这项技能2-4小时。", "人生中最简单的成功之道就是投入一段时间进行技能提升。6-12个月，每天2-4小时全神贯注，学习和实践。不是盲目地刷教程，而是要创造出真正能让你、他人或企业受益的高质量项目。大多数人不会这么做，但那些坚持下去的人总能领先于其他人。但大多数人处理这件事的方式都是错误的。他们仍在学习技能，并为旧的工作模式构建项目。他们创办了10家初创公司。他们源源不断地生产内容。他们掌握设计、营销、编程和文案写作等技能，因为他们认为这能提升自身价值，从而赚到更多钱。他们痴迷于产量，却忽略了真正值得发布的内容。他们宁愿做很多质量低劣的事情，也不愿做一件质量无可挑剔的事情。我们正在目睹深思熟虑的创造方式的消亡。世界上工厂越来越多，园丁却越来越少。为什么？因为创作从未如此触手可及。", "你可以向人工智能输入一句话，它就会生成一个手机应用程序。一天之内就能生成一个月的内容，并将其安排发布到所有社交平台。您可以将图片拖入 ChatGPT，将其转换为提示，并以您自己的风格重新创建它。未来的工作将是一场速度与艺术的较量。当任何人都能轻点鼠标就能创造任何东西时，它的价值也随之消失殆尽。我们不再珍视自己，因为我们深深意识到，我们已经将灵魂出卖给了机械化的生活——而机器原本是要帮助我们逃离这种生活的。在速度至关重要的领域，你无法与机器竞争。这意味着，人类将专注于意义、玩乐，以及从噪音中筛选信号的领域。如果你想领先于其他人，答案不在于无休止地生产内容，指望靠数量取胜。相反，答案在于少即是多。减少消费。减少生产。减少活动。这听起来似乎有悖常理，但其实并非什么新鲜事。正是通过这种方式，世界上最成功的创意人士、战略家和远见卓识者创造出了那些流传至今的书籍、产品以及科学和文化突破。", {"h": "机器人工作，人类娱乐"}, "未来的优雅不在于人与机器的对抗，而在于二者的分工：硅打磨掉必需品粗糙的边缘，让碳升华为意义。我们将废除咖啡师，尊崇厨师，让特工噤声，让演员回归本源。在这两个领域，驱动我们走向同一个自私的本能——消除摩擦，维护叙事——在这个世界里，最枯燥乏味的琐事由电路完成，而最精彩的故事则由鲜血淋漓的人们讲述。——克里斯·派克", "要了解人类在哪些地方能够繁荣发展，我们首先必须了解他们在哪些地方无法繁荣发展。当任务关乎速度、准确性或实用性时，人类就会成为巨大的累赘。这些正是自动化发展的驱动力。", "我们最讨厌的就是那种明明记下了你的订单却还是出错的服务员。还有在车管所排长队，结果接待我们的工作人员却因为心情不好而拒绝你的请求。以及当你开会迟到时，优步司机还试图跟你闲聊。但是，当我们的思维不再是为了追求完美的结果而去做某事时——当我们享受休闲时光时——我们渴望的却是完全不同的东西。我们渴望一些有趣的事物。我们渴望失败的可能性。我们渴望的正是我们思维赖以运转的事物：故事。戏剧性。新颖性。神话和意义。我们也为此支付了高价。与其去星巴克，让咖啡师快速制作一杯提神醒脑的咖啡（但那咖啡的味道往往像是用地狱之火烘焙的咖啡豆），我们宁愿绕道去拜访那家温馨的当地咖啡馆，那里的老板能叫出你的名字。虽然我们更喜欢在不与对方见面的情况下，让别人把食物送到家门口，但我们也会为了在我们一直梦想去的地方品尝到最美味的食物而环游世界。工作时，我们想要的是要点总结；婚礼上，我们想要的是手写的誓词。人工智能可以投出完美的棒球，但我们却挤满体育场，目不转睛地盯着第九局的最后一位击球手。但这并不意味着工作就不必要了。如果我们想要掌控自己的休闲时间，仍然需要完成一些工作。因此，解决之道在于利用机器来减少我们认为的工作量，从而增加我们的休闲时间，让我们能够创造出值得与世界分享的有意义的故事。换句话说，你通过冒险和讲述故事变得无可替代，然后将这种特质融入你创造的一切之中。你拥抱失败，将其视为让自己变得无可替代的动力。这是历史上一个鲜为人知的事实。科技进步为人们腾出了休闲时间，使他们能够发现和追求新的兴趣。然而不幸的是，父母和学校秉持的旧有价值观让我们相信努力工作是高尚的，却没有意识到他们正在让我们走向平庸的人生。在早期农业社会，马拉犁的发明带来了粮食盈余，人们因此有了更多的时间去发明数学和文字。这是历史上第一次有大量的人能够从事这类活动，包括深入思考，从而开启了轴心国时期，孕育了释迦牟尼佛、老子、苏格拉底等人的哲学思想。工业时代来临，虽然许多人仍然忍受着艰苦而毫无意义的工作，但我们有了体育、电影、内容创作、手工艺作坊以及深度体验等“工作”选择。以娱乐为中心的工作——或者说使命——并非什么新鲜事物。而那些可以自动化的手工艺工作，人们购买它们并非出于速度和便利。诚然，许多人因为长期处于生存状态而精疲力竭，最终沦为工作，但也有许多人将这些视为一种生活方式，而非仅仅是工作。休闲经济正在我们眼前兴起。此外，如果我们看看史蒂夫·乔布斯、查尔斯·达尔文以及其他用他们的创造改变世界的思想家，我们会发现，他们创造力的巅峰都源于休息、散步和休闲。在我看来，休闲就是发现和探索的过程，是追求自身兴趣的行为。当机器人取代工作时，人类开始享受娱乐。", "最伟大的技能不是创作，而是（筛选）策展。", "你和我不像牛。我们不是为了整天低头吃草而生的。我们是为了像狮子一样去狩猎。与其说我们更像草食动物，不如说在人类“杂食性”的发展中，我们更接近肉食动物。作为一名“智力运动员”，你应该像运动员一样运作：努力训练，然后冲刺，然后休息，然后重新评估。那种认为你只要每天固定坐着、按同样的时间“硬拧输出”，就能一直线性产出——那是机器的逻辑。机器才适合朝九晚五地工作，不是人类。——纳瓦尔", "我们选择的工作定义了我们是谁。如果我们选择参与一个以效率和优化为目标的系统，我们最终就会成为那个目标本身，成为机器上的一个齿轮。这描绘了一幅过度专业化的残酷图景。当你把思维局限在一个维度上时，你就会成为它的奴隶。在工业化之前，奴隶一生只能从事少数几项工作。而大约80%的美国自由劳动者则是自雇的农民或工匠。他们被期望追求自己的兴趣，一生从事各种各样的工作，因为他们可以自主安排劳动。如今，只有大约10%的美国人是自雇人士。", "工业革命（例如学校教育和大规模就业）改变了我们与工作的关系。起初只是缓慢地，随后是突然之间，数以百万计的人被带入工作岗位，从事预先设定好的任务，并接受他人的指导。就这样，自治作为一种价值观消失了，我们心甘情愿地让自己被机器取代。无论我如何深思熟虑——过去五年我一直在撰写相关文章——对大多数人来说，尤其是那些渴望创造力和自主性的人，首要的解决方案是成为一名现代工匠。确切地说，是数字工匠。信息时代的通才。", "从为他人创作到为自己创作，这是一种根本性的转变。虽然这话说起来有点老生常谈，但还是值得一提：你从未像现在这样拥有如此丰富的工具、资源和人才，可以让你从事那种如同玩乐般的匠人级工作。你不需要成为下一个亿万富翁，你只需要生存下去（并留出一些喘息的空间）。", "您可以访问所有信息。你无需花费数年时间学习技能就能建造任何东西。你可以吸引一群支持者的关注，并通过做自己来获得报酬。人工智能只需点击一个按钮就能源源不断地生产出无限的内容，而这正是关键所在。记住，在速度和实用性方面，你无法与机器竞争。当人们想要获得客观公正的新闻和纯粹的“操作指南”时，他们会自己搜索，任何阻碍都会让他们感到恼火。人工智能生成的内容在我们需要快速获取信息时非常有用。但当我们没有寻找任何特定的东西时（这种情况占大多数），我们会渴望一些不同的东西。我们读小说，看有趣的视频，听我们最喜欢的两位主持人的播客，听新歌。我们渴望一个故事，一个想法，在喧嚣中找到能点燃我们大脑的信号。在智慧、洞察力、深度和意义的领域——机器人毫无用处。我们重视别人用心制作的东西。我们已经从不把网红当成一种工作，变成了网红成为唯一的工作——吸引关注、建立信任、积累影响力。如果你无法让人们关注，那么你创作出任何东西都毫无意义。如果当地咖啡店会因为成本和速度问题而倒闭，那它早就倒闭了，然而尽管一杯咖啡要7美元，店里却总是顾客盈门。爱马仕生产一款售价 8 万美元的手提包，成本 300 美元并不重要。重要的是品牌、品牌故事、品牌创始人、精湛的工艺和细节。这才是人们愿意支付高价的原因。中国能以极低的成本生产同样的奢侈品，这一点只对某些特定人群有意义。但人们愿意把辛苦赚来的钱花在手工制品上还有另一个原因——一个可以复制的原因：品味。当人人都能创造任何东西时，辨别力和克制就显得尤为重要。甄选比创造本身更为重要。死记硬背学术知识、成为信息宝库不再是身份的象征。真正重要的是你选择让哪些有限的、特定的想法占据你的头脑。现在的问题不再是你能不能做到。", "问题在于你是否应该这样做。", "如何培养和运用品味。要培养品味，你需要自己去创造，因为品味是无法外包的。品味是一种需要练习和对技艺投入才能获得的技能。仅此一点就能解释为什么大多数人都在落后。他们痴迷于数量而非质量。他们为了赚钱而创作，而不是为了创作而赚钱。他们学习任何能快速赚钱的技能，而我们都知道最终结果会是什么样。你需要一个目标，就像一个过滤器，过滤掉我们每天过度接触的海量信息。你需要果断地选择谁能或什么能进入你的思想世界。你需要接受这样一个事实：短信、社交媒体动态，以及前所未有的、能够激发创造力的静谧时光，并非我们大脑天生就适合的。有品位的人会摒弃那些感觉不对劲的信息。他们看着一个设计、产品或帖子，会觉得缺少了什么，有些东西需要彻底放弃，或者它一开始就不应该存在。我们这个时代最伟大的头脑并没有消耗更多资源。因为高质量的产出源于高质量的投入。你关注什么，就会塑造你的思维方式；如果你无法选择自己要创造什么，或者为谁创造，你就会沦为奴隶。不是身体上的奴隶，而是精神上的奴隶。如果你的工作是由别人主导，而不是由你自己主导，那么你的创造力就会被扼杀和耗尽。当机器能够同时思考所有事情时，我们的任务就是制定标准。过滤我们大脑接收的信息。精心甄选值得打磨的创意。选择我们无法割舍的工作。但是该怎么做呢？这一切听起来都很美好也很有见地，但我们究竟该如何做到呢？我们如何以品味为指引，规划自己的职业生涯？", "优先考虑风险、迭代和工艺。", "不要只关注你擅长的事情。专注于你独有的特质，而这种特质只能通过实践发现，而不是通过思考发现。你会发现，你的独特之处在于创造一个值得与他人分享的故事。你的个人故事，源于你个人的意识，而这意识是任何人——甚至人工智能——都无法完全理解的，它是这颗星球上最独特的存在。如果你忽略了那些引人入胜的成败经历，而这些经历又能为你的创作带来既贴近生活又新颖的视角，那么你将在未来的竞争中举步维艰。要想创作出值得讲述的故事，唯一的方法就是勇于冒险。要深思熟虑地选择前进的方向。要避免盲从任何人、任何事、任何信仰或任何世界观，而是通过对它们的质疑和否定，开辟属于自己的道路。除此之外，品味是在不断迭代中形成的。这是一个永无止境的过程。我当时觉得我写的第一份电子报还不错，但现在回头看，那是我这辈子见过的最恶心的东西。我觉得我现在写的电子报已经很好了，虽然比以前好多了，但我一年后再回头看的时候，又会作何感想呢？设计师、电影制作人或程序员回顾自己过去的作品，会发现他们的品味发生了切实的变化。那些从未开始，或者两周后就放弃的人，永远无法成功，原因就在于此。你或许自认为品味不俗……我的意思是，看到世间万物，很容易就能认同它们味道鲜美，但当你真正着手复制时，就会发现你做出来的味道和别人做出来的味道之间存在着巨大的差距。无论你学习多少，当你开始学习时，味觉都是从零开始逐渐增强的。", "用心创造，直到你真正关心。", "追随你的热情是个糟糕的建议。不是因为它错了，而是因为它具有误导性。你并非追随你的热情，而是通过长时间满怀热情地投入某件事来培养它，直到你发现这门技艺的深度，从而燃起对它的无限热爱。你或许并非真心想追求某个目标，但你认为这是通往理想生活的必经之路，于是你抛开一切杂念，义无反顾地去做。成为不可或缺的第一步，是每天至少抽出一个小时专注于纯粹的匠人精神。换句话说，就是打造一个项目，一件作品，一件你和他人都能使用并从中受益的东西。这是从消费者到生产者的关键转变，必须发生。项目本身是什么并不重要，因为你现在学到的任何职业或工作技能在未来都无关紧要。你做项目是为了培养自主性和品味，而不是为了在市场上快速准确地完成任务而追求金钱回报。一个有意义的项目会塑造你的人格和思维方式。它会从根本上重塑你的思维模式。它教会你如何学习。它会在不知不觉中培养你未来所需的软技能，例如感知力、适应力和韧性。它迫使你专注于掌握各种技能之间的转换技巧，而不是仅仅专注于某一项职业技能，而这些技巧可以迁移到你创造的任何其他事物中。吸引关注，建立信任", "你可以创办一家本地企业。你可以创造实体产品或商品。但我相信，在座各位中，至少有95%的人都具备创造力。你们了解互联网带来的巨大优势，也明白数字世界如何让你们掌控自己的职业生涯。因此，你们所创建的项目也应该体现这一点。你不需要资金就能在网上开店。你不需要身处合适的实体店面就能接触到合适的人。你不需要唱片公司、出版商或雇主给你工作机会。但你需要关注和信任。记住，任何人都可以创造任何东西。这是我们能够自信地说出的最令人振奋的一句话。在这种情况下，你如何才能脱颖而出？通过整合我们目前讨论的所有内容。", "首先，打造个人品牌，或者一个具有个性的品牌，并公开你的作品。你的故事必须是核心。其次，精心筛选你的输入，才能产出有价值的内容（有品味的输出）。在充斥着噪音的世界里，成为一盏指路明灯。追求你的兴趣，分享你珍视的想法。不久之后，只要不断迭代，其他人也会开始关注。第三，打造一个有意义的项目，并将其转化为产品。音乐、写作、设计、软件，任何形式都可以。因为残酷的现实是：如果你不销售自己的产品，你将被迫为他人销售产品。你的劳动，乃至你的思想，都将受制于他人。为了销售产品，你需要获得关注，但这并不意味着你需要出卖自己的灵魂。给自己6-12个月的时间。每天2-4小时的全神贯注。我无法告诉你该怎么做，因为你无法复制我的经历。我相信我已经给了合适的人足够的资源来解决这个问题。"], "wcount": 5823}, {"group": "深度专注与高效思考", "gsub": "注意力 · 思考 · 表达", "icon": "1", "title": "如何才能专注到感觉自己违法？", "paras": ["如何才能专注到感觉自己违法？", "关于深度工作和改变大脑的技术", "你还没有体验过你真正能做到的事情。", "如果你学会如何释放这种力量，你就能做到大多数人认为不可能的事情。", "一套深度工作方案（以心理学、运动科学和哲学为基础）是第一步，它将助你走得很远。但如果你想更上一层楼，我们生活在一个令人难以置信的时代，你可以利用安全性极高的促智药和肽类产品（它们真正有效，不像过去那些只会让你感觉有点发热和刺痛的燃脂药），从而获得竞争优势。", "我接下来要分享的，是我如何不再抗拒去做大多数人认为困难的事情。", "我几乎可以控制自己能产生多少好点子以及工作时长。", "很多人可能不知道，因为我很少在这里提及（但我计划以后多谈），我热爱健身和生物化学。过去15年来，研究各种前沿技术的科学原理和操作规范一直是我的一大乐趣，无论是用于提高生产力的AI、用于金融的加密货币，还是用于健康的肽类药物。肽类药物堪称健康领域的比特币，而且它们必将长期存在下去。", "我喜欢尝试各种身体实验，因为这能让我通过亲身经历而非理论了解身体的运作方式。没错，这其中存在一些风险，就像所有成就伟业都需要风险一样（比如每天盯着屏幕工作12个小时，投资股票或加密货币，每晚吃麦当劳喝啤酒导致血压飙升，最终像服用类固醇的健美运动员一样因左心室肥厚而过早死亡，甚至仅仅是开车），但我们稍后再讨论这个问题。", "如果你是商业领域的创始人，健美运动的健身爱好者，或者仅仅是想进入更深层次的专注状态以获得一点优势并最终累积成巨大优势的人，那么这正是为你准备的。", "深度工作的心理学与哲学", "首先引用萨姆·奥特曼的一句话：", "专注是提升工作效率的倍增器。", "我遇到的几乎每个人都应该花更多时间思考应该专注于什么。", "做正确的事情比长时间工作重要得多。大多数人把大部分时间浪费在无关紧要的事情上。", "一旦你确定了要做的事情，就要全力以赴，快速完成你少数几个优先事项。", "我还没见过哪个行动迟缓的人能取得巨大成功。", "我不在乎最新的深度工作技巧。", "我不在乎你戴着帽子工作，因为这会限制你的视野。", "我不在乎你把手机屏幕颜色改成黑白，好让你恢复多巴胺水平。", "我只关心哪些方法有效。", "如果你需要一些权宜之计才能坐下来工作，那么你就忽略了决定你能否坐下来完成所需工作的 3 件事，而这 3 件事占了你 99% 的工作效率。", "要想进入你从未体验过的最深入的工作状态，首先，你必须了解是什么驱使一个人即使在不想工作的时候也坚持工作。其次，你需要优化大脑消化和管理信息的方式。最后，你需要像狩猎一样安排你的一天，从而充分发挥你大脑中与生俱来的狩猎采集本能。", "1.最有效的专注技巧是知道你在做什么，为什么要做这件事，什么时候需要完成，以及如何完成这件事。", "清晰、重要、紧迫。这些是防止干扰因素侵入你认知框架的关键要素。为了理清思路，你需要选择一个具有挑战性且新颖的任务。如果这项任务让你感到压力过大，你需要将它分解成几个你清楚目标的子目标。然后，你逐个执行这些子目标，并掌握相应的技能，从而能够继续推进主任务。要想找到重要的东西，你需要充分理解（1）如果不实现目标，你的生活最终会变成什么样子；（2）如果实现了目标，你的潜力会有多大。紧迫感会促使你现在就坐下来工作，而不是以后再做，但我们将在几段之后讨论这一点。大多数人陷入一成不变的生活方式，是因为他们寻求外在的激励。但是，当你专注于一个重要目标时，你就会被内在动力所驱动。它们彼此叠加、相互加强，从而维持一定程度的心流（最佳体验，或最令人愉悦的心境之一）：", "1.好奇心——探索未知、学习如何改变、填补知识空白的渴望。它能带来多巴胺（来自新鲜事物）和去甲肾上腺素（提高注意力，使你做好学习准备）。", "2.激情——对能够改变人生的道路充满热情，会带来更多积极的多巴胺和去甲肾上腺素分泌。", "3.目标感——一种感觉，即你的行为对超越自身的事物有所贡献。达成目标会促进多巴胺的分泌，从而强化行为。血清素源于成就感和归属感。催产素源于联结感。", "4.自主性——渴望掌控自己的生活和工作，控制自己的选择、行动和环境。这会促进多巴胺分泌，降低皮质醇水平（皮质醇是一种压力激素，源于被束缚的感觉），从而激发创造性决策。", "5.精通——学习和成长的过程本身就是一种奖励。它能带来持续的愉悦感，让你保持专注。", "你从好奇心和尝试开始，直到找到一件能让你深入探索的事情。", "只要投入足够的努力，你就会充满热情。你将这份热情与比自身更伟大的事物——目标——联系起来。你打破常规，掌握自主工作的技能，并全职从事这项工作。你从肤浅的推理转变为哲学意义上的掌控感，从而让你能够继续留在游戏中。", "2.你需要专门的时间段来提高生产力和激发创造力。它们是两种不同的思维状态，但彼此互补。", "下午用读书、学习和社交填满你的大脑；睡前用写日记、做计划和冥想清空你的大脑；早上用创造、产出和专注来运用你的大脑。大多数人把过度劳累视为一种荣誉勋章。事实是，如果你专注于那些真正能让你离目标更近的少量关键任务，你就能在4小时甚至更短的时间内完成8小时的工作量。大多数人都没有诚实地面对自己，承认哪些工作完全可以停止。大多数时候，这些“关键性任务”需要创造力。就我个人而言，我的整个事业都建立在每天两小时的写作之上。这是我能做的杠杆效应最大的事情，因为在当今世界，媒体可以传播给数百万人，代码可以被数百万人使用，而边际成本的增加却微乎其微。这就是你在当今世界的超能力。", "也就是说，你从事杠杆操作工作的质量取决于你留出多少时间 休息。", "你的大脑需要不断地获取信息，这样你才能捕捉到那些能够改变你人生的想法。", "如果你整天都处于“工作模式”，你的思维就会阻塞。在专注工作时，你无法产生新的想法。你可以通过每天安排一些创意模块来疏通思维。", "在两小时工作时段之间，抽出30分钟散步。或者听听有声读物或播客。", "抽出时间进行创意构思和写日记，以清除脑海中的杂念。", "缓解压力是额外的好处。", "3.你拖延是因为你的生存没有受到威胁。", "正如我们在求生信中所讨论的那样：", "动物依靠生理层面生存和繁衍，它们试图复制基因中的信息。人类也是如此，但我们生活在一个生理威胁罕见的世界。我们主要依靠心理层面生存，并试图复制意识中的信息。", "我们依附于政治意识形态，感到受到威胁，当“对方”攻击我们的信仰时，我们会进行反击。", "我们把某些信仰和世界观当作自己的身份认同，比如“游戏玩家”这个身份，当有人说这不好时，就像（心理上）被人扇了一巴掌，你会想要反击。", "当你试图改变自己的生活，比如提高效率时，你会威胁到不希望你这样做的相关身份（比如成为一名好学生或好员工）。", "如果你学会超越并利用你的生存本能，你的生产力将会大幅提升。", "你需要改变你的身份认同，方法是改变那些根深蒂固的信念和规范性要求（父母、老师和权威人士“应该”你做什么）。改变你的身份认同，就需要改变你的环境。", "为了提高效率，强迫自己进入那些让你感觉自己还不属于的现实和虚拟环境。", "关注那些拥有你想要追求的目标、你未来的自己可以从中受益的信念以及能够让你获得清晰思路的知识的人。", "当你努力实现自己的目标时，自律就会变得自然而然；当你没有做到这一点时，你会感到受到威胁，这会给你带来动力去追求更伟大的目标。", "专注力（及减脂）组合——优化你的线粒体", "这些不是那种服用一周后就没什么效果的普通促智药。", "（但如果你喜欢这些，请告诉我，因为有一些新的补品可能有助于修复你的大脑，改善多巴胺信号传导，并帮助你集中注意力。）", "它们也不是像阿德拉那样会让你感觉像吸食冰毒一样的刺激性药物。", "事实上，它们甚至都不是用来提高专注力的补充剂。", "它们旨在改善线粒体功能和健康，从而对延长寿命、延缓衰老，尤其是有助于减脂。提高生产力和专注力是次要的，但即便如此，它们的效果也远胜于市面上任何一种促智药（以我的经验和观点来看）。", "如今线粒体健康之所以备受关注，是因为现代环境似乎正在破坏它。", "我们晒不到多少太阳。我们整天盯着蓝光。我们醒来时脸色红肿。我们坐在人工照明的格子间里。我们吃着高糖高脂的食物。西方人口正面临肥胖症的流行。", "是的，改变生活方式是第一道防线，但我们今天不谈这个。也许以后有机会再聊。目前，你只需要按照安德鲁·胡伯曼和祖先饮食法团队的建议去做就行了。我并非有意忽略这一点，它很重要。但这封信的重点并非于此（如果你想让我深入探讨非教条式的营养学，请点赞这篇文章）。", "我喜欢科技。", "科技使人类能够做到以前不可能做到的事情。", "每当出现人工智能或飞行器等新技术时，人们总是持怀疑态度，认为如果更多人接受这些技术，世界末日就会到来。不要扼杀好奇心。那样做更有可能让我们陷入《1984》式的困境。", "实际上，科技显然存在风险（通过知识和技能来降低风险是通往成功的道路），但它的创造是为了解决问题，而当今世界我们面临着很多问题。", "活着本身就意味着承担着巨大的风险。大多数人喜欢新款iPhone，却在不知不觉中接受了随之而来的巨大心理和生理风险。他们开车时会冒着生命危险；他们参加体育运动时会多次头部受伤；他们过着久坐不动的生活方式，偶尔饮酒，缩短寿命……但一提到药物之类的科技产品，他们就开始惊慌失措。", "我得到它。", "药丸和注射剂是一个很奇怪的领域（尽管注射剂通常是服用补充剂生物利用度最高的途径，而且还能避免经过肝脏代谢……我说的是那些为了治疗宿醉而去输液的女孩们）。", "也就是说，我们将按以下方式构建这个框架。", "首先，我们将讨论两种可以口服的胶囊，它们可以改善脂肪燃烧、改善线粒体功能，从而提高注意力。", "接下来，我们将讨论一下为那些比较有冒险精神的人准备的两种注射方式。", "当然，这些都不是必须的。我知道你们很多人读这篇文章只是出于好奇。", "注意：这种组合具有协同效应。您可能会感受到其中一些效应，也可能不会感受到另一些效应，但当它们组合在一起时，会在不显著降低任何单一药物疗效的情况下，增强整体疗效。这有助于将剂量控制在安全且可持续的范围内。", "顺便一提，我创建了一个名为“超人协议”的谷歌文档，其中包含一些科学和教育内容，供那些想要深入了解的人参考。", "1）亚甲蓝——引发互联网分裂的蓝色染料", "如果你经常上网关注健康相关的新闻，你可能听说过亚甲蓝。", "就是那种会把舌头染成蓝色的蓝色染料，它曾被用作鱼缸清洁剂。", "哦，它还会让你的尿液变成蓝绿色。", "它之所以在互联网上引起争议，是因为它存在一些风险和副作用，例如：", "血清素综合征：当与选择性血清素再摄取抑制剂（SSRIs）等药物或影响血清素的补充剂（如5-羟色氨酸）合用时，血清素水平会急剧升高，导致您感觉非常糟糕。请勿与这些药物合用。", "一氧化氮抑制：高剂量的亚甲蓝会导致血管收缩、血压升高，以及运动时肌肉充血感减弱。", "高剂量毒性：高剂量时可能产生促氧化作用，而非低剂量时的抗氧化作用。它会损害线粒体。", "G6PD 缺乏症：如果您患有这种遗传性缺乏症，请勿服用 MB。", "正如你所看到的，就像大多数事情一样，剂量决定毒性。", "一般而言，安全、耐受性和可持续的推荐剂量为每天 3 毫克至 15 毫克。", "我个人每天服用10毫克胶囊。如果感觉精力充沛，有时会服用20毫克。", "大多数人服用如此低的剂量后，在提升专注力方面感觉不到明显的益处。因此，当它与其他线粒体辅助药物联合使用时，效果会更加显著。", "接下来我们来谈谈科学原理和益处：", "核心益处源于线粒体健康。", "亚甲蓝能增强电子传递链，增加ATP（能量）的产生，其作用类似于肌酸。它还能降低氧化应激，这在当今与食物、蓝光等相关的环境中是一个令人担忧的问题。此外，它还能促进新的、健康的线粒体的生成。", "所有这些都对认知能力、注意力、神经保护、抗衰老、延长寿命等方面有益。", "它作为一种单胺氧化酶抑制剂（MAOI），可以阻止大脑中关键神经递质（如血清素、多巴胺和去甲肾上腺素）的分解。这有助于改善情绪、提高注意力和工作效率。", "主要在动物模型或高剂量人体试验中发现，它可以增强记忆形成、工作记忆和视觉运动协调能力。", "大脑：它通过改善大脑中的线粒体功能、减少β-淀粉样蛋白斑块和防止tau蛋白过度磷酸化，显示出缓解阿尔茨海默病症状的潜力。", "皮肤：经证实可改善皮肤水分和厚度，促进弹性蛋白和胶原蛋白的合成，从而使皮肤看起来更年轻。", "骨骼：已被证明可通过改善骨骼内的线粒体功能和抗氧化状态来防止骨骼老化。", "已证实能增强红细胞的携氧能力（提高运动表现和耐力）。", "经证实可减轻慢性疲劳、全身炎症和身体疼痛。", "这一切都很棒，但当它与其他补充剂一起使用时，其益处会成倍增加（而且额外的减脂效果也无妨）。", "2) SLU-PP-332 – 瓶装运动，终于来了？", "是的，这名字既怪异又可怕。", "大多数保健品都是在尚未被大型制药公司贴上品牌标签和垄断之前生产的。", "但是，这是少数几种真正有助于燃烧脂肪的新型补品之一。", "大约十年前，互联网上整个“减肥产品”时代都是一场巨大的骗局。如今，随着科技的进步，我们终于取得了一些进展。", "我最近在进行小幅减脂时使用了这种化合物（感兴趣的朋友可以去我的第二个 YouTube 频道了解我的健身和生活），它带给我的能量简直难以置信。", "简而言之，SLU-PP-332 是一种运动模拟剂。它无需实际运动即可重现有氧运动带来的许多细胞和代谢益处。我们终于拥有了“瓶装运动”。当然，这远远无法弥补普通美国人的生活方式。但对于健康人群来说，它却是一种超能力。", "让我们再从风险谈起：", "体温升高和出汗：最明显的副作用是体温升高和大量出汗，尤其是在运动期间。", "缺乏人体研究：目前尚无关于SLU-PP-332的长期人体研究或临床试验。现有的知识主要基于动物模型和健身界的轶事证据。", "肝酶：它可能会导致肝酶轻微升高，这是许多口服补充剂（例如非甾体抗炎药，因为口服补充剂需要经过肝脏代谢）的常见副作用。可以通过服用其他补充剂来缓解这种情况，例如 N-乙酰半胱氨酸 (NAC)、茶树油酸 (TUDCA) 或水飞蓟。", "所以，我们目前还没有一份完整的清单。", "正如我在开头所说，我有点像个小白鼠。我喜欢走在科技前沿，尝试各种新技术，而不仅仅是营养补充剂和肽类（比如人工智能）。我每隔一到三个月就做一次血液检查，血压控制得很好，并且严格遵守所有长寿的必要条件。我了解自己身体的状况，也知道自己正在做的事情是否健康，但可能还有一些我不知道的事情正在发生。", "以下是科学原理：", "SLU-PP-332 是雌激素受体相关孤儿受体 (ERR) α、β 和 γ 的激动剂。这些受体在能量需求高的组织中含量丰富，例如骨骼肌、心脏、大脑、肝脏和脂肪组织。", "它通过几种方式运作，并具有一些潜在好处：", "线粒体增强：已被证实能够改善线粒体呼吸作用和生物合成（即生成新线粒体的过程），从而提高能量产生。", "促进新陈代谢：已被证实能增强体内脂肪酸氧化和葡萄糖吸收。", "运动模拟剂：它被描述为直接的运动模拟剂，因为它能激活与有氧运动相关的基因，即使你处于久坐状态。", "无激素效应：它不与雌激素受体结合，预计不会产生任何雌激素样激素效应。", "增强体能：用户从服用第一剂起即可体验到耐力、体力和运动能力的提升。", "改善身体成分：即使在高脂肪饮食的情况下，也能防止脂肪增加，并能减少现有的脂肪组织脂肪量。", "代谢健康：研究表明，该产品可通过增加骨骼肌对葡萄糖的摄取来改善胰岛素敏感性。此外，该产品还被证实可改善总胆固醇、甘油三酯、高密度脂蛋白胆固醇、空腹血糖和胰岛素水平。", "器官健康与寿命：它可能具有延年益寿的功效，例如增强握力（这是长寿的一个标志）。它还显示出改善心脏健康的潜力，能够提高射血分数并减少心肌纤维化。", "典型的给药方案是每天 200-600 微克。", "它的半衰期很短，大约只有 1-2 小时，所以建议分次服用。", "就我个人而言，我很喜欢这个剂量范围的较高值。我早上、锻炼前和下午各服用250微克。我的精力简直好得不可思议。", "我只在训练日服用这些，所以每周服用 5 次，以便让自己偶尔休息一下。", "建议：如果您是新手，建议只尝试亚甲蓝和SLU-PP-332。它们都是胶囊剂型，而且在我看来，如果负责任地用于研究，它们的安全性很高。", "MOTS-c——连托马斯·德劳尔都在Logevity上谈论它", "现在我们要进入注射治疗领域了。", "即使是用很小的胰岛素注射器注射到腹部脂肪层，也让人觉得很可怕。", "我不喜欢不尽可能多地进行科普就谈论事情，所以正如前面提到的，我专门为此创建了《超人协议》文档。", "我尝试过不少肽类产品，这是第一个让我立刻感到精力充沛的。即使在减脂期，能量摄入不足（通常情况下能量会降低），我的工作时间也比平时正常饮食时更长，活动量也更大。", "MOTS-c（线粒体12S rRNA C型开放阅读框）是一种由16个氨基酸组成的多肽。它天然存在于线粒体中，并在代谢或氧化应激（例如剧烈运动）的刺激下释放到体内。其主要功能是作为信号分子，促使细胞产生线粒体在细胞能量代谢中所需的营养物质。它主要参与调节葡萄糖和脂肪酸代谢。", "使用不当的风险：", "注射部位反应：这是最常见的副作用。即使是低剂量（0.5-1毫克）的皮下注射，也可能引起发红和刺激（我曾出现过轻微发红，一两个小时后就会消退）。2.5-5毫克的剂量可能导致严重的、信用卡大小的皮疹，类似于蜂窝织炎。肌肉注射引起皮肤反应的可能性较小，但并非完全不会发生。", "过敏性休克：这是一种严重且危险的风险，尤其是在高剂量时。剂量超过 5 毫克会增加不良反应的风险，而 10 毫克的剂量，特别是如果意外注射到静脉中，可能导致全身性过敏性休克，其特征是面部和舌头肿胀。", "精力过剩/失眠：这种“精力涌动”对某些人来说可能过于强烈，令人不适。睡前服用较高剂量可能会导致失眠。", "心脏方面的担忧：虽然 MOTS-c 可以改善心脏功能，但研究表明，当与运动结合使用时，它会诱发大鼠心脏肥大（心脏增大）。对于任何使用合成代谢类固醇的人来说，这都是一个严重的隐患，因为合成代谢类固醇也存在这种风险。", "然而，它也有一些核心优势：", "能量产生：能够合成ATP，即人体的主要能量货币。", "激素合成：已被证实参与孕烯醇酮的生成，孕烯醇酮是许多其他激素的前体。", "新陈代谢：已被证实能产生多种影响新陈代谢的信号分子。", "能量与专注力：用户报告称注射后会感到明显的“能量激增”。健美运动员通常在减脂期使用它来维持能量水平和认知功能，有助于防止因热量限制而导致的脑雾。", "模拟运动：对大鼠的研究表明，MOTS-c 给药在改善心脏功能、体重和血糖水平方面与跑步机运动具有可比拟的益处。", "代谢健康：动物模型研究表明，该产品能够提高胰岛素敏感性，增加线粒体对葡萄糖的摄取，并改善脂肪酸代谢。它可能有助于预防高脂饮食引起的胰岛素抵抗和肥胖。", "寿命：一项动物研究表明，MOTS-c 可以延长寿命 4.6% 至 7%，并逆转与年龄相关的身体衰退。", "关于剂量，请不要一次服用 5-10 毫克。", "我曾经因为愚蠢而做了 5 次，结果也没什么事，（那一次）什么事都没发生，但我并不打算再这样做了。", "大多数建议从 0.25 毫克开始，以评估耐受性，然后增加到每天 0.5 毫克至 1 毫克的可持续剂量。", "结合之前讨论过的化合物，每周服用1毫克，5-7天就足够了。我就是这么做的。", "Retatrutide——健身模特的秘密武器", "再说一遍，如果你经常上网关注健康领域，你肯定听说过这件事。", "你可能听说过司美格鲁肽，但那是给那些不太了解的人用的，说实话，它效果不太好。我试过，不喜欢。", "你最喜欢的运动员在服用它。你最喜欢的名人也在服用它。我个人认为，随着GLP-1越来越受欢迎，大多数人都会开始服用它。这并非因为每个人都需要减肥，而是因为它有助于我们对抗现代环境带来的挑战。考虑到布莱恩·约翰逊刚刚推出了一条肽类护发产品线，他迟早也会开始大力宣传它。", "当然，纯粹主义者和自然主义者会强烈反对这种观点，但我还是把形成自己看法这件事留给你们自己去思考。", "瑞他曲肽是一种新型肽类药物，目前正在进行临床试验。与同类其他药物（如索马鲁肽或替尔泽帕肽）仅靶向一种或两种受体不同，瑞他曲肽是一种三重激动剂，这意味着它可以激活三种不同的激素受体来调节新陈代谢和食欲：", "GLP-1（胰高血糖素样肽-1）受体：激活该受体可增强胰岛素分泌，抑制胰高血糖素生成，减缓胃排空（使饱腹感持续更长时间），并减少总体食物摄入量。", "GIP（葡萄糖依赖性促胰岛素多肽）受体：该受体也能刺激胰岛素分泌。在身体燃烧脂肪（脂肪分解）的状态下，激活GIP受体有助于从脂肪组织中清除脂肪酸，从而促进整体脂肪减少。", "胰高血糖素受体：激活脂肪组织中的这种受体可导致脂肪分解，即将储存的脂肪分解并释放到血液中供身体利用。在肝脏中，它有助于调节血糖水平。", "就我个人经验而言，像索玛鲁肽这样的GLP-1受体激动剂会让我感到非常恶心。由于我还需要进食来为训练提供能量，这显然不利于我。瑞他鲁肽引起的恶心程度较轻，因此我可以利用它来维持胰岛素敏感性，从而在增肌阶段减少脂肪堆积。", "以下是风险：", "常见副作用：最常见的问题是轻度至中度的胃肠道不适，例如恶心、呕吐、腹泻和腹胀。这些症状通常与剂量相关，并且往往会在几周内随着身体对药物的适应而消退。此外，还可能出现疲劳、头晕和头痛。", "心血管风险：静息心率加快（每分钟增加 6-12 次）是已知的副作用。临床试验中也观察到罕见的心律失常病例。", "严重但罕见的风险：虽然罕见，但临床试验报告了急性肾损伤和胰腺炎病例。其他GLP-1受体激动剂与甲状腺癌和胰腺癌的风险相关，因此建议谨慎使用，尽管目前尚无确凿证据表明Retatrutide存在此类风险。", "反弹效应：这类药物的一个重大风险是，当你停止服用它们时，食欲抑制作用就会消失，失去的体重会迅速反弹。", "就反弹效应和已报道的肌肉流失案例而言，通常可以通过养成正确的饮食习惯来避免。大多数此类研究都是针对超重人群进行的。高蛋白饮食一如既往地可以避免大部分肌肉流失，因此强烈建议不要在接受瑞他曲肽治疗期间尝试建立新的饮食习惯。", "根据临床试验数据，它具有广泛的益处：", "减重和减脂：研究表明，该产品在减重方面非常有效，试验显示，每周服用12毫克，48周后体重可减轻25-30%。它还能显著减少腰围，尤其值得注意的是，还能降低肝脏脂肪含量。", "食欲控制：已被证明能有效抑制食欲，增强饱腹感，从而有助于减少总热量摄入，控制“食物噪音”或对食物的渴望。", "代谢健康：已证实可改善多种代谢指标，例如：降低空腹血糖、空腹胰岛素和糖化血红蛋白 A1C 水平，提高胰岛素敏感性并逆转糖尿病前期状态，通过降低总胆固醇、甘油三酯和低密度脂蛋白（“坏”胆固醇）并提高高密度脂蛋白（“好”胆固醇）来改善血脂谱，改善收缩压和舒张压。", "重点：一些非正式报告显示，它能减少“食物噪音”和持续不断的食欲干扰。此外，它还被证明可能调节多巴胺通路，从而有助于改善成瘾行为。", "现在，瑞他曲肽的剂量变得非常重要。", "如果剂量测量错误或剂量过大，可能会感到恶心几天，并且没有食欲。", "在临床试验中，他们研究了每周一次皮下注射0.5毫克至12毫克的剂量，从低剂量开始，逐渐增加剂量。", "根据经验，最佳剂量是从每周 1-2 毫克开始，分三次服用（例如，周一、周三、周五）。之后，建议每隔一两周逐渐增加剂量，以避免副作用。根据我的研究，通常 3-6 毫克是最佳剂量范围。", "最后想说的话", "就像人工智能或加密货币一样，我很期待看到这项技术的未来发展方向。", "我使用我们讨论过的这套技术栈的体验非常棒，对于那些决定深入学习的人，我也为你们感到兴奋。", "如果你喜欢这种风格的信件，请点赞，这样我就知道是否应该继续写下去。"], "wcount": 9428}, {"group": "深度专注与高效思考", "gsub": "注意力 · 思考 · 表达", "icon": "2", "title": "如何像战略天才一样思考（5D思考）", "paras": [{"h": "如何像战略天才一样思考（5D思考）"}, "-当所有人都把思考外包给机器时，思考就成了你的竞争优势。", "你的思考能力决定了你的人生走向。这绝非夸张，学会思考从未像现在这样重要。尤其是如果你自认为很聪明的话，因为你最有可能像个傻瓜一样思考。我的意思是，社交媒体上到处都是这种事。几乎每天都能看到智商很高的人掉进显而易见的陷阱。有很多聪明人住在妈妈家的地下室里，他们离心脏病发作只有一步之遥；也有很多笨人异常快乐、健康和富有。与其谈论第一性原理思维、系统思维、元认知，或者其他任何你可以让 ChatGPT 教你的东西，我想给你一些不同的东西。我们将从一维思维开始，逐步过渡到五维思维。如果你仔细阅读，你就会体验到一种全新的思维方式。", "如果你这么聪明，为什么还会穷？", "信仰远胜于信念。信念是别人替你思考。——巴克敏斯特·富勒", {"h": "思考技巧一："}, "如果你想了解某件事是什么，比如天才般的思维，那么了解它不是什么，会有所帮助。这样我们就能识别并避免愚蠢的想法。当我们观察愚蠢的想法时，我们会得出一些结论：愚蠢的思维是片面的。人们试图将所有事物都塞进自己的视角，很难跳出这个框架去看待问题。愚蠢的思维方式是简化主义。例如，某个领域的专家，比如商业领域的专家，试图将所有问题都简化为“战略”问题。愚蠢的思维方式是部落式的。你只信任你的群体、政党或部落，并认为其他所有人是错误的，因为他们不认同你的观点。愚蠢的思维不会质疑。你的理由是“本来就应该这么做”。总的来说，愚蠢的想法是指当你达到知识的极限后就封闭自己的思想。愚蠢的思考就是过早停止思考，止步于预设的思维模式，从而无法获得任何新的见解。由此，我们可以开始推测天才思维的一个恰当定义，它可能是：能够将看似危险的想法置于可能性的范畴内，并怀着理解而非仅仅知晓的意图，是天才思维的标志。天才思维的精髓在于其广度、深度和高度，它能让你不受束缚，不断探索，而不会因为将某个想法奉为绝对真理而止步不前。它让你能够游历于浩瀚无垠的思想网络（现实，以及所有潜在的知识），并将它们整合为连贯或有用的事物，甚至是全新的事物。那么问题来了，知道和理解之间有什么区别？如何才能拓展思维的广度、深度和高度？如果还能更进一步呢？知识是横向积累的。你学习并记忆特定领域的各种知识，直到你精通为止。知识渊博的人被称为“专家”，但当今世界并不需要更多的专家。理解是纵向的，它取决于你整个认知操作系统的复杂程度。一个人即使知之甚少，也能理解很多，并利用这种洞察力采取行动，从而获得更有价值的结果。“聪明却愚钝”现象源于横向发展过度，纵向发展停滞不前。例如，一个拥有巨额财富的商人却并不快乐；一个拥有精美作品却无法维持生计的创意人士；一个头脑简单却无法维系稳定关系的人。他们在各自的领域内博学多识，却无法跳出知识的局限，而这知识的局限又不足以让他们识别和解决导致痛苦的根本问题。所以，学习如何思考才如此重要。因为你的思想是你与现实互动的方式。", "你处理信息→理解信息（思考）→做出选择→接收反馈信息→对反馈做出反应并重复循环。", "因此，思考决定了你的人生结果。", "你每多想一想，就会产生叠加效应，让你陷入困境，甚至无法想到任何能让你摆脱困境的办法。", {"h": "海拔、层次和思维方式"}, "你无法用产生问题的同一意识层面来解决问题。——阿尔伯特·爱因斯坦", "让我们从基础做起。思维方式是你可以深入了解的领域。线条代表水平方向的发展（宽度）。", "这些可以是任何领域，例如市场营销、天体物理学、政治学、社会动力学、宗教等等。当你尝试学习特定领域的知识时，你就是在拓宽你的思维方式。这就像在电子游戏中积累经验一样。", "（顺便说一句，如果你研究过肯·威尔伯的理论，你就能明白我的意思了，只不过我把这个概念应用到了思维方式上。）", "思维层次是指你如何思考每一行文字。", "层级代表垂直发展（深度）。", "当我们观察群体和个体认知发展随时间推移的演变过程时，我们可以注意到5个核心模式：", "本能型（0级）——你生来就出于纯粹的生存需要而行动。你对刺激做出反应，几乎不加思考。", "循规蹈矩者（一级）——非黑即白的思维模式。你墨守成规，服从权威，从不质疑。你接受他人的观点。", "个人主义（二级）——批判性思维开始萌芽，你会构建自己的模型，形成自己的视角。", "综合主义者（三级）——你认为你的模型只是众多模型之一。你接受矛盾，并将视角作为工具，而不是法则或不容置疑的真理。", "生成性（四级）——你创造出以前不存在的原创观点，或者在没有外界影响的情况下产生想法。", "第一层和第二层思维可以被视为“第一层级”思维，这种思维过于教条。我是对的，你是错的。", "3级和4级可以被视为“第二层级”思维，它们拒绝教条，寻求介于两者之间的终极真理。在意义的领域，你常常被灌输一种信仰体系，然后你质疑这种信仰体系并得出自己的结论（通常会否定先前的结论），然后你开始看到所有信仰体系中的真理，最终你有能力创造一个更广阔的信仰体系。在政治领域，我们看到的大部分争斗和暴力都源于生活在1级和2级警戒状态中的普通民众。他们各自抱持着不同的观点，无法跳出自己的思维定式。再次强调，这一点非常重要，因为很容易掉入这个陷阱：天才思维是指持续思考的能力。", "在每个思维层次上，你驾驭已知和未知概念的能力都在不断扩展。刚出生时，你其实并不思考。当你循规蹈矩时，你的思考会一直持续到找到“唯一”答案，然后你开始捍卫这个答案。当你成为个人主义者时，你也会做同样的事情，只不过你捍卫的是你自己的答案。当你达到综合主义者的阶段时，你的思维可以非常广泛，但你创造新思路的能力尚未完全发展。", "发挥你最高的思考能力，从而为你今生发挥最大潜能铺平道路，归根结底就是要学会觉察何时感到受到威胁，对自己诚实，并且至少要保持开放的心态去接受新的观点。思维高度是你所有思维层次的平均值。海拔高度代表跨维度发展（身高）。", "为了更好地理解这一点，并几乎完成这个思维难题，将思维形象化为一棵技能树会有所帮助。", "在电子游戏中，你可以把“点数”投入到某些属性上，从而在游戏中获得更多能力。你可以挑战更高难度，获得更多乐趣，并继续游戏。这同样适用于思维方式。", "问题在于，只有满足了低级特性的特定要求，才能解锁更高级别的特性。例如，你必须先达到力量“4级”，才能获得敏捷“3级”。", "想象一下，在现实世界中，你创办了一家公司。你掌握了市场营销、销售和产品方面的全部知识。你的聪明才智毋庸置疑。你也赚了不少钱。但当你试图更进一步时，却遇到了一个看不见的障碍。你无法找出问题所在，也无法将其归咎于你所了解的：“市场还不够大”，或者类似的说法。你的思维被局限住了，找不到前进的方向。", "此外，显然，事业并非生活的全部。如果你的生活其他方面都一团糟，作为一名商人，你会试图硬把一个圆塞进一个方孔里。你或许能暂时缓解问题，但永远无法找到问题的根源。", "这就是为什么政治、宗教以及营养等领域如此充满敌意和两极分化的主要原因。一群自以为聪明却愚蠢的人互相指责对方是白痴，因为他们停止了思考，只维护自己认为唯一正确的观点。", "回到正题，问题在于你看不到问题的真正所在。或许是你缺乏领导团队的能力，或许是时间管理的问题，甚至可能是精神层面的问题，但你过于注重商业，根本不会考虑这种可能性。至少，这种视角或许能带来洞见，从而推动你取得更大的进步。这就是为什么通才和博学之士最终能够成功。", "换句话说，你无法达到业务的 3 级，因为你还没有在其他必要的领域“投入积分”，而这些积分是解锁该级别的必要条件。", "如何开启四维思维", "思维还有第四个维度。", "嗯，它其实不像时间那样是第四维度，但它的确能将你的思维能力提升四倍。", "你看，现实有 4 个“维度”。", "这些维度指的是视角。你可以通过四种主要方式改变你看待信念、想法、情境或问题的方式。", "人有内在世界和外在世界，两者又都有集体和个人两部分。", "内在世界是精神层面的，我指的是心理和文化层面。你个人的内在心理包含你的思想、情感、信仰和意识。集体的内在世界，或者说文化，包含群体的信仰、价值体系和意识形态。", "外在世界是物质的，这听起来没那么玄乎，但你不能否认你可以思考精神层面，而这正是我们今天要讨论的内容。你个人的外在世界包括你的外貌、行为以及大脑的生理状态或测量数据。集体的外在世界则由各种系统、结构和社会制度构成。", "为了说明理解这一点的重要性，让我们一起来了解一下思维过程。", "我学习了很多关于市场营销的知识，并运用这些知识（思维方式）。", "我通过实践、失败和经验积累，明白并不存在“一个行之有效的框架”，但我对此有了足够的理解，可以创建出属于我自己的、效果卓越的营销活动（思维层次）。", "我热衷于心理学、健身和个人发展等领域，这使我能够更深刻地识别模式，从而进一步摆脱教条式的思维框架（思维高度）。", "从那以后，事情就开始变得有趣起来，而且会朝着很多不同的方向发展。", "我们忘了提及一点：思考通常是为了解决问题。这是人类的本能，也是我们成长的动力，更是我们从中获得满足感的方式。一旦停止成长（也就停止了思考），问题就会成倍增加，生活也会变得更加混乱。", "所以，如果我们发现诸如“世界正在变得腐败和毫无意义”这样的问题，我们就可以继续朝着这个方向思考。", "社会如何控制大众的注意力并向大众推销自己的理念？（集体内心世界）", "在这个过程中，你的行为如何才能在现有基础上做出更大的改变，从而对社会产生积极影响？你需要采取哪些步骤才能达到足以留下个人印记的影响力？（个人层面）", "当前的就业市场状况如何？一份工作真的能成为实现这一目标的途径吗？人工智能呢？我能否利用现有技术产生这样的影响？（指对外部世界的集体影响）", "我的思考方式对吗？还是另有隐情？我遗漏了什么？这让我感觉如何？充满动力？受到启发？还是感到憎恨？（个人内心世界）", "我们还可以继续说下去，但我想你已经明白我的意思了。", "天才思维是指将注意力引导到有益方向的能力。你逐步引导自己的思维不断扩展，从更开阔的视角出发，你就能更清晰地审视最初想要解决的问题。", "如何进入第五维度", "适应一个病入膏肓的社会并不能说明一个人很健康。——", "克里希那穆提", "是的，我知道，这实际上并不是第五维度。", "这是第四维度（时间），但我现在想通过编造一些事情来练习我的思维能力，当你把时间应用到我们刚才讨论的现实的四个维度时，你的思维能力就会持续飞速提升。", "在之前的所有例子中，我们都没有充分利用历史的力量。如果你理解历史，特别是理解其演变模式而非死记硬背事件，你就能引导你的思考朝着更准确的方向发展。", "这说明了“知道”和“理解”之间的区别。你可以了解历史上特定时刻的大量事实，这固然很好，但如果你无法跳出历史的框架去理解那个时刻的本质意义，你就可能无法发现不同领域中存在的类似模式。", "要想有效地思考历史，你需要了解以下五件事。这并非全部，历史学远不止于此，但这足以成为一个良好的开端。", "1）主模式是超越和包含。", "唯物主义者会说现实是由原子构成的，他们的说法是正确的。", "心灵学家会说现实是由感觉性质构成的，他们的说法是正确的。", "但如果我们放眼全局以求理解，就会发现现实是由各个整体组成的（这些整体本身也是一个更大整体的一部分）。", "物质 → 生命 → 心灵", "单词 → 句子 → 段落", "机器 → 计算机 → 人工智能", "人 → 房屋 → 城市 → 州 → 国家 → 大陆 → 行星 → 太阳系 → 星系", "每一种事物都是一个整体，它超越并包含着前一种事物。这意味着，如果你移除了使另一种事物得以存在的要素，整个链条就会自我毁灭（这就是为什么环保主义者如此担忧气候变化。如果生物圈崩溃，人类也将随之灭亡）。", "举例子就能明白了。", "2）个体生理进化过程", "这个很简单，因为大多数人都能看到它、摸到它、闻到它等等。", "原子→细胞→分子→器官→生物体", "你可以从个体事物的发展方式来思考物质世界，而不仅仅是人类的发展方式。", "3）个体心理如何发展", "人类是通过不断扩大的关爱圈而发展的。", "首先，我们只关心自己和自己的生存（以自我为中心）。", "然后，我们关心的是我们的部落、群体或文化（民族中心主义）。", "其次，我们关心所有群体，无论彼此有何差异（以世界为中心），但由于其核心模式是超越和包容，我们仍然关心自身和所属群体，这一点必须纳入我们的思考之中。我们不会仅仅因为关心他人听起来很崇高就牺牲自己或自身的价值观。这通常是大多数群体之间争论的焦点，因为有些人将“关心每个人的平等”奉为道德制高点，而这种做法往往会适得其反，最终适得其反，与真正关心每个人的目标背道而驰。", "在最高层次上，我们关注的是作为终极整体的现实。这显然要求我们能够梳理极其复杂的问题，从而得出任何实用的结论。", "4）社会在物理层面上的演化", "社会结构跟随技术发展而变化。", "随着锄头的发明，小规模农业成为可能，我们从部落发展成了村庄。", "随着马拉犁的发明，我们从村庄走向了帝国（因为粮食过剩使人们能够减少对农业的投入，而更多地用于探索、发现和征服）。", "随着机械化农业的发明，我们从帝国走向了民族国家。", "如今，电脑已装进口袋，人工智能也已近在咫尺，接下来的发展方向就留给大家思考吧。", "5）社会心理演变", "由于个体构成集体，社会的发展遵循着以自我为中心、以民族为中心和以世界为中心的相似模式。", "集体也有其身份认同。", "部落只能关心自身及其生存。然后，它才能扩张成更大的帝国或民族国家，旗下包含多个子群体。", "在这种情况下，我们将这些世界观称为前理性、理性和后理性。起初我们顺从权威，然后我们通过科学寻求进步（启蒙运动），之后我们开始意识到两者的盲点，同时吸收它们各自的优点。", "但你究竟该如何运用这些知识进行“思考”呢？", "这里列举几种方法（仅举几例）：", "了解人们在遇到某种理念、运动或冲突时的立场。在人工智能时代，你希望什么样的政治家来领导你？", "在进行辩论（政治、商业、个人层面）时，要注意参与者的认知层次。认知层次较高的人往往需要设身处地地理解他人的认知水平。", "观察社会和组织的技术发展。一个仍然沿用工业时代方法（且过于固执己见而不愿变革）的企业很可能会失败。", "最实用的应用是找到你自身的重心所在。我建议你另择时间重读这封信，同时思考一下你自身的发展。", "我们错过了一些重要的东西。", "愚蠢的想法就是停止思考。", "我们知道这一点。", "但是什么使人停止思考？是什么使人从开放转为防御，封闭自己，拒绝进一步学习和成长？", "答案是同一性。", "具体来说，就是接受某些想法、信仰或观念，并将它们融入到你自身之中。", "因为如果你是死忠的共和党人或民主党人，你就永远无法跳出自己的思维定式。因此，你永远无法了解事情的真相。但这并不意味着你不能吸收双方的一些价值观，这仅仅意味着，当别人与你意见相左时，你不必感到受到威胁。", "这同样适用于认同某种特定的宗教、团体、职业，或者我们之前讨论过的任何其他事物。", "你还必须思考你是如何形成这些信念的。", "当今世界，大多数人一生中从未独立思考过一天。", "他们出生在世界上的某个特定地区。", "世界那个地区的发展水平处于特定阶段。", "他们从小就被父母灌输应该相信什么，而这些父母可能从未质疑过自己的信仰。", "这些信念决定了你的思维能力，而你的思维能力可能并不强。", "记住，你的思想是你与现实互动的方式。", "你处理信息→理解信息（思考）→做出选择→接收反馈信息→对反馈做出反应并重复循环。", "你的思维空间决定了你的人生走向。", "如果你只局限于父母、老师、雇主和社交媒体上同龄人设定的思维框架内，你的人生结局可能不会太美好。看看普通人最终的境遇，这一点不难理解。", "所以，下次当你感到受到威胁时，不要把自己封闭起来。", "静下心来感受它。质疑它。要知道，你的大脑渴望安全感，因为它的运作机制就是如此。", "我们的大脑构造仍然和我们的狩猎采集祖先一样，但我们已经不再生活在那个世界里了，而且世界只会变化得更快。", "善于思考的人终将获胜。"], "wcount": 6318}, {"group": "深度专注与高效思考", "gsub": "注意力 · 思考 · 表达", "icon": "3", "title": "如何清晰有效地表达自己", "paras": [{"h": "如何清晰有效地表达自己"}, "我年轻的时候，总是会被那些听起来很聪明的人吸引。", "像艾伦·沃茨、乔丹·彼得森、丹尼尔·施马赫滕贝格，以及其他一些能用有趣的方式阐释深奥理念的人。大多数时候，我并不理解他们在说什么（要么是因为我年纪太小，要么是因为他们把事情搞得太复杂），但因为他们的表达听起来很有见地、条理清晰，所以我还是会认真倾听，并对他们表示尊重。问题是，我从没想过自己也能做到同样的事情。这并不是说我现在是世界上最能言善辩的人。我不是。我只是觉得我的大脑没有这种能力。我上学时是个聪明的孩子，但擅长考试和将关于重大问题的连贯想法串联起来并清晰地表达出来是截然不同的技能。", "我感觉自己必须记住整本书的信息才能当场背诵出来，因为我接受的就是这种学习方式。但如今，十多年过去了，我并没有刻意追求口才……作为一名作家和自封的网络小名人，我的工作就是以有用或有影响力的方式表达想法。过去六年里，数以百万计的人选择在屏幕上阅读我的想法。其实，我这个人挺无趣的。我不是个娱乐家，也不怎么幽默。我甚至都不认为自己的写作有什么革命性之处。我这么说，是希望能激励那些和我一样比较内敛的人。所以，也许你是一位想要脱颖而出的新晋创作者；也许你是一位想要为你的软件吸引更多用户的创始人；也许你即将参加播客节目，不想在录制过程中磕磕绊绊；也许你想在公司会议或销售电话中展现出强大的气场；又或许，你只是想成为一个更有趣的人。", "我总结了三种清晰表达自己的方法，并按难度从低到高排列。这些是我在写作或演讲时使用的方法。但在此之前，还有一件更重要的事要做。首先，我们需要打造我们内心的“精选集”。", {"h": "精选集锦"}, "如果你想清晰有力地表达自己的想法，你需要准备8到10个最重要的观点，这些观点几乎可以与任何话题联系起来。这样，无论在任何情况下需要写作或发言时，你都有一个已经思考过数百遍的切入点。", "我最近开始受邀参加更多大型播客节目。但这些和我刚入行时受邀参加的那些活动截然不同。这关系重大。这些大型播客制作人会在节目制作上投入数万美元（甚至更多）。这令人紧张。而且，由于可能有数十万人收听播客，我觉得我有责任尽可能地提供有价值的内容。我目前还不是最好的播客嘉宾。当我回听那些录音时，我总是懊恼自己当时本可以表达得更好。这就导致了问题。我写了两本书。数千条社交媒体帖子。数百份电子报刊和 YouTube 视频。对我来说，哪些想法最有价值显而易见。哪些想法浏览量最高，或者收到最多“改变了他们生活”的私信也显而易见。很明显，我真正能代表我的品牌和我能提供的价值的，只有8到10个核心想法。我花了无数个小时来完善这些想法。这些正是人们想听到的想法。这些想法能让新听众了解我。但这是我最大的心理障碍……我不想听起来像是在重复自己。所以，每当我上播客节目或者被邀请在众人面前演讲时，我都会避免重复那些我已经说过很精彩的话。我的大脑一片空白，不得不硬着头皮说些什么，以免出现尴尬的长时间沉默。我总想着当场冒出一个惊世骇俗的想法，但我知道灵感并非如此产生。灵感需要时间来剖析和探索。", "乔丹·彼得森在其巅峰时期以其雄辩的口才而闻名。他极具魅力。为什么？看看他的作品就知道了。如果你还没有围绕你想阐述的主题创作过作品，那么你或许应该提高对未来工作的预期。那么，你为什么会听你最喜欢的音乐家的歌呢？因为他们的音乐风格或音色很合你的口味。他们的大部分音乐听起来都差不多，只有一些细微的变化。你只要听几秒钟就能准确地分辨出是哪个歌手演唱的。如果一位 EDM 音乐人突然决定转战乡村音乐，那么他的第一首作品会很糟糕，就像大多数音乐人的初次尝试一样，而且他的大多数听众也不会喜欢。这同样适用于创作者、作家、演说家，或者仅仅是想表达自己的人。", "你需要反复写作或演讲成千上万次，直到你最好的想法变得显而易见。你天生就必须重复自己，因为最重要的想法值得反复强调，否则你又如何完善它们呢？", "你可以把这些“大创意”想象成推文。在我的写作中，我经常谈论以下几个主题：一人企业、实用哲学、如何掌控你的思维、生活方式设计等等。针对这些主题，我写过几篇短文，这些文章很有冲击力。仔细想想，播客节目中最好的发言者往往是那些不直接回答主持人提出的问题的人。他们不会说：“嗯，问得好，我以前谈过这个话题，答案是这样的。”相反，他们会自信地表达自己对这个话题的最佳见解，然后用论据加以佐证。这不仅能吸引听众，提升播客的收听率，吸引更多人邀请你参与他们的播客节目（从而为你带来更多成功），而且还能留下值得剪辑的精彩片段。如果你的想法已经走红（或者达到了其他任何指标，例如获得更多用户、客户、投资者、人才等等），那么当他们发布你发言的片段时，它很可能会再次获得关注。Alex Hormozi 在这方面很出色。如果播客主持人问他：“在当今世界，你能学到的最伟大的技能是什么？”Hormozi 完全可以说“销售”或“产品创意”，但他明白这其中有很多层次，所以他可能会用他第二条最火爆的推文来回应：“你能培养的最伟大的技能就是在没有什么值得高兴的事情发生时也能保持好心情。”这不仅是观众意想不到的，具有新颖性，而且还为霍尔莫兹和主持人展开了一场人们想听的有趣对话。而且，它已经获得了 10.5 万个赞，所以当它被剪辑出来时，Hormozi 表达这个特定想法的简单决定将比他尝试说一些新的东西带来指数级的结果。有道理，但是从初学者到高级玩家，我们究竟该如何实践呢？", {"h": "三种清晰表达自己的方法"}, "如果你不知道该学什么，那就开始写作。不是因为写作是你苦苦寻觅的捷径，而是因为写作能教会你如何思考、如何学习，以及如何激励人们关心你所做的事情。我称自己为作家，因为这是个方便的标签，但我其实并不认为自己是作家。我不在乎语法。我不在乎自己（大多数时候）听起来是否多么机智。我不在乎我的句子是否冗长，读起来是否流畅。然而，这些似乎都与吸引数百万读者无关。互联网彻底改变了那些拥有绝妙想法的人的创作可能性。在我作为“写作者”的历程中，我逐渐意识到写作远不止是把句子串联起来。如果说思考是一幅拼图，那么写作就是把碎片拼凑起来。所以，如果你想提高表达能力，或许应该开始写作。也就是说，你应该有意识地开始写作，因为你其实每天都在写作。你会给家人和朋友发短信，给潜在客户、现有客户和同事发邮件。根据你的工作内容，你可能还需要撰写项目大纲、反馈意见、提案等等。仔细想想，媒体的基石（也就是你或你的雇主如何将作品呈现在人们面前，并说服他们关注你的作品，从而维持生计并获得报酬）是写作。如今，媒体是每个人都在争夺的领域。如果你想在任何领域取得成功，就必须去到人们关注的地方，并分一杯羹。现在，人们的注意力都集中在社交媒体、YouTube、播客以及 Facebook 广告等平台上。所有这些都要求你以视频脚本、帖子、销售文案、帖子标题等形式进行有说服力的表达，几乎涵盖了所有领域。这就是练习清晰表达想法的方法。你需要抽出时间来写作，主题是你想要深入阐述的内容。此外，将你的想法公开发布（只需多花10秒钟），你就能获得直接的反馈，例如互动，从而了解哪些想法最有影响力。建立受众群体也很有帮助。免费推广你的作品、产品或服务非常棒。也就是说，究竟该如何通过写作来练习发音呢？", "以下是3个框架：仅凭这些就能让你轻松超越所有没有计划就开始行动的人。", "入门级——微型故事 人的大脑是一个故事引擎。人们总是不由自主地关注故事，尤其是那些简短而引人入胜的故事。一旦你掌握了讲故事的技巧，就能有效地激发他人的注意力，让他们对你谈论的话题产生兴趣。故事的基础是转变。这种转变不一定是指小说中某个特定人物的转变。转变可以很简单，比如提出一个问题并给出解决方案。如果我们想让它更有影响力，你可以这样组织你想表达的内容：", "问题 ——陈述一个你曾经观察或经历过的、与自身经历相关的问题。这能使观点更贴近实际，并引发人们对解决方案的好奇心（简而言之，就是讲故事）。", "放大说明 ——阐明如果问题得不到解决，将会导致哪些负面后果。这既能增强人们对解决方案的渴望，也能使解决方案显得更有价值。", "解决方案 ——阐明问题的解决方案。在短文中，可以是一句话或一个简短的列表。在较长的新闻稿、文章或脚本中，可以是所有要点及其解释。问题及其补充说明构成了文章的引子。我们可以把事情搞得更复杂一些，但这只是个入门方法。想了解更多，试着在 X 上滚动时找到它。一旦你看到它，就再也忘不掉了。如果你学过文案写作或市场营销，肯定见过这种方法。它看似简单，却能巧妙地利用人性，尤其当受众确实面临问题并渴望解决方案时。六年来，每当我需要快速表达想法时，它仍然是我的首选。我脑海中浮现出一个想法，然后立刻开始思考与之相关的实际问题。当然，这假设你已经有了写作主题。如果你没有，那就需要主动去寻找。你需要阅读旧书，深入研究某个主题，收听新的播客，或者只是静下心来思考，顺着思绪走下去，直到获得令人信服的洞见。当你“寻找”灵感时，你不会对信息左耳进右耳出。你会全神贯注地倾听，寻找那个你希望自己能写下来的想法。然后你把它记下来，以免丢失。然后，你运用这些框架，用自己的语言来阐述它，使它呈现出新的形式。", {"h": "中级——金字塔原理"}, "金字塔原理是一种沟通框架，它以层级分明、逻辑清晰的方式构建思想，使信息更容易被接受和说服。很简单。", "首先阐明中心思想（关键结论或建议）。", "用关键论点（通常是 3-5 个关键点）来支持它。", "提供详细证据（数据、示例、分析）", "与如今大多数视频内容直到结尾才给出答案不同，本视频采取的是先给出答案的方式。这与我们之前在播客中提到的Hormozi 的例子完美契合。如果他对“最值得学习的技能是什么？”这个问题的回答是：“你能培养的最伟大的技能就是在没有什么值得高兴的事情发生时也能保持好心情。”这可以作为金字塔顶端的答案。然后，他可以用关键论点来佐证为什么这是最值得学习的技能。你只需要问 3-5 次“为什么”，并提供充分的理由即可。之后，他可以举出自己生活中的例子、心情愉悦的数据，或者客户的轶事。所以，这是一种很好的方式，可以用来扩展简报、帖子或 YouTube 视频中的关键要点。你也可以用它来以有趣的方式开启会议或对话。当然，它还可以用于回答播客中的问题。先提出一个好想法，然后围绕这个想法展开论证，最后用数据来支持它。如果你在写作或演讲方面遇到困难，那么接下来的框架将对你有所帮助。", {"h": "高级——跨域合成"}, "我最喜欢这个，因为我有很多兴趣爱好。我很难专注于某个特定的主题或领域。我热爱学习心理学、哲学、商业、设计、科技、健康，以及任何能让我拥有更美好生活的事物。", "除了专注于单一主题的文章（例如这篇文章）之外，我通常都是这样组织我的大部分文章的。", "这里是：", "提出问题并加以阐述 ——你的引言应该提出一个相关的问题，并说明如果这个问题得不到解决会发生什么。", "跨领域综合 ——从你感兴趣的其他领域中寻找能够支撑你论点的模式或概念。例如，如果我在谈论深度工作 ，我可以运用物理学中的熵的概念来阐释分心是如何产生的。这能教会我的听众一些新知识，而且我知道市面上其他关于深度工作的内容都没有做到这一点，所以我可以安心入睡。", "独特的流程或解决方案 ——列出能够最好地解决你在文章开头提出的问题的想法或步骤，从而巩固转变成果。这些想法或步骤应该源于你自己的思考，而不是他人的处方。", "实际上，你的作品应该包含标题（或者如果你喝醉了，和一个无家可归的人进行了一场奇怪的深入对话，那就没有标题），引言部分会提出问题，一个章节会介绍来自其他学科或兴趣领域的概念，然后以多个章节的形式描述解决问题的独特方法，每个章节都会描述一个关键点。问题在于，这会导致内容非常冗长，例如新闻稿、书籍章节、YouTube 视频，甚至是个人播客。", "如果你是新手，你会盯着空白屏幕发呆，因为你不知道如何填写每个部分。幸运的是，写作就像玩乐高积木一样，而创意往往以可预测的形式出现。如果你了解这些形式，就能引导你的思维进行头脑风暴，思考接下来要写什么。以下是一些简单的例子：", "痛点 ——如果我不知道如何开始写作或演讲，我会从一个相关的痛点入手，然后灵感就会从那里涌现出来。", "举例来说 ——一旦你开始说话，你就可以在任何地方插入例子。这能让你的观点更加具体。", "个人故事 ——想想你生活中与你所写主题相关的某个时刻。内容不限。", "统计数据 ——研究一个真实的统计数据，以增强你的观点的说服力。", "比喻 ——用跟孩子说话的方式解释复杂的概念。艾伦·沃茨在这方面堪称大师。", "引用——引用一句名言来佐证你的观点。引用名言很容易，因为它们几乎总是很棒的想法。", "重新表述 ——从不同的角度看待你刚才讨论的观点。", "当其他方法都行不通时，就简单地问：是什么？怎么做 ？为什么？思考就是提问。这些就是构成我大部分提纲的“乐高积木”。我习惯在脑子里把它们全部过一遍。一旦掌握了方法，就会变成一种本能，你的思维方式也会开始重塑。希望这些信息对你入门有所帮助。"], "wcount": 5257}, {"group": "深度专注与高效思考", "gsub": "注意力 · 思考 · 表达", "icon": "4", "title": "如果你有多项兴趣爱好，不要浪费接下来的两三年时间。", "paras": ["如果你有多项兴趣爱好，不要浪费接下来的两三年时间。", "-他们想把你框住，别让他们得逞。这是你最后的优势。", "社会让你觉得拥有多种兴趣是一种弱点。上学。获得学位。找份工作。总有一天会退休的。但是，这一系列事件存在太多问题。我们不再生活在工业时代了。专精一项技能几乎等同于自取灭亡。我想我们现在都明白，机械化的生活和封闭式的学习对精神和灵魂有多么危险。人们也能感受到我们正在经历第二次文艺复兴。你的好奇心和对学习的热爱在当今世界是你的优势，但似乎还缺少些什么。很长一段时间里，我一直在学习、学习、再学习，简直深陷于教程的泥潭。有些人可能会用“闪亮物体综合症”来形容我注意力不集中。虽然觉得自己很聪明，能获得多巴胺，但我的生活并没有发生太大的改变。说实话，我感觉自己一直在落后。大学期间，我尝试过很多不同的事情。我梦想着能做自己想做的事，靠创意赚钱……但五年“学习”之后，我却不得不面对现实：我必须找到一份最好的工作才能生存下去。缺失的部分是一个容器。一个能让我将所有兴趣投入到有意义的工作中，并从中获得体面收入的平台。如果你曾经因为无法选择一件事而感到内疚，如果你被告知要缩小范围而你的思维却想要拓展，如果你想知道是否有一条路可以让你摆脱你在其他人眼中看到的痛苦——那么，现在是活着的最佳时代。以下是我能想到的七个最引人入胜的想法。我们首先会了解为什么在当今世界拥有多重兴趣是一种超能力，然后我会提供一些切实可行的步骤，帮助你将这种能力转化为毕生事业。我们有很多话题要聊，希望你能加入我们。", {"h": "1.个人成功的三个要素及专家的消亡"}, "一个人如果一生只从事几项简单的操作……通常会变得愚蠢无知到极致。——亚当·斯密", "史密斯先生，您这话真有意思，因为这些人都是您一手造就的，而我们现在还在承受他们的反噬。工业化过程中出现了专业化分工，例如，在一家大头针工厂，一个工人负责所有步骤，一天可以生产20 个大头针。而如果每个工人只负责一个步骤，一天就可以生产 48,000 个大头针。于是，我们围绕这个模型构建了一个完整的世界。人类沦为朝九晚五的流水线工人，坦白说，是因为政府并不服务于国家利益，而是服务于自身利益。公司也不服务于员工利益，而是服务于自身利益。学校的设立正是为了服务于这种利益。它们唯一的目的就是培养守时听话的工厂工人。但这绝不是生活的正确方式。如果你想拥有专业知识，却永远无法独立运营任何业务，尤其是你自己的业务，那么就只能依赖学校接受教育，依赖工作获得报酬。被“专业化才能使人有价值”的谎言蒙蔽，而实际上，这个系统并不需要你专门去执行某项任务。区别就在这里。如果纯粹的专业化使人变得愚蠢和依赖，那么是什么使个人变得聪明和独立呢？三个要素：自学、自利、自给自足。自学的意义很明确，因为如果你想获得与传统教育不同的结果，就必须自主学习。“利己主义”这个词本身就值得警惕。它听起来自私又短视，很多人不加思索就将其视为缺点，但它其实仅仅意味着“关注自身利益”，因为除此之外，我们别无选择，只能服务于构成社会的各个组织的利益，而这一点我们已经讨论过了。换句话说，追随你的利益，因为你的利益完全可以以一种无私的方式造福他人——这取决于你的认知和道德发展水平。哦，对了，顺便一提，沉溺于短暂的快乐（廉价的多巴胺）通常并非出于你的利益，而是那些从你的盲目中获利的企业的利益。在安·兰德看来，真正自私的人是自尊自强的人，既不为己牺牲他人，也不为他人牺牲自己。这既否定了掠夺者，也否定了逆来顺受者。自立自强是指拒绝将你的判断力、学习能力和自主性外包。如果说自学是引擎，自身利益是指南针，那么自立自强就是防止你的人生方向被其他力量劫持的基石。它们相互协作，但并不完全依赖。", "通才型人才自然而然地从这三位一体中涌现出来。自我利益驱动着自学。你学习是因为它确实有利于你的发展，而不是因为有人布置了这项任务。自学使人能够自给自足。只有你了解的领域，你才能拥有主权。自给自足能明确自身利益。当你不再依赖他人的解读时，你才能真正感知到什么对你有益。大多数人追求多种兴趣是为了逃避工作。但当你的兴趣变成工作，甚至是毕生事业时，大多数兴趣就会逐渐被淘汰。", "当我们审视我们真正欣赏的每一位CEO、创始人或创意人士时，他们都是通才。他们精通市场营销，足以指导市场营销；精通产品，足以打造产品；也足够了解人，足以领导团队。但他们还需要掌舵，当环境发生变化时，他们需要不断学习和调整。更重要的是，他们明白不同领域的思想可以相互补充，并创造出一种独特的看待世界的方式，这使他们能够从虚空中捕捉到新颖的想法，并将其转化为市场价值。当我们审视当今世界，并了解每个人（而不仅仅是领导者）所面临的机遇时，你会发现，作为一名天生的博学家，你的选择是极其广泛的。这应该会让你感到无比兴奋。", "2.你正生活在第二次文艺复兴时期，要好好利用它。", "研习艺术的科学，研习科学的艺术。培养你的感官——尤其要学会观察。要明白万物皆有联系。——列奥纳多·达·芬奇", "在我看来，最终的护城河，或者说最终值得付出代价的竞争优势，其实是一种观点。这是只有你才能看到的视角，因为它源于你独一无二的人生经历。这或许是任何人都无法复制的。既然一直都是这样，为什么不现在优先考虑这件事呢？尤其是在自动化即将到来之际？但如何确定其优先级？如何进行开发？通过追求多种兴趣并将它们结合起来创造一些东西。你看，你曾经追求的每一个兴趣都会留下痕迹。每一个兴趣都会增加你能建立的联系数量。每一个兴趣都会拓展并增加你构建和解读现实的方式的复杂性。你的现实模型越复杂，你能解决的问题就越多，你能发现的机会就越多，你能创造的价值也就越多。而专精化会彻底阻碍这个过程，你的“闪亮物体综合症”其实一直在试图告诉你这一点。从出生到现在，你一直在培养一种别人无法理解的视角。这种视角，人工智能只有在你告诉它该怎么想的时候才能理解。学过心理学和设计的人看待用户行为的方式与纯粹的设计师截然不同。学过销售和哲学的人达成交易的方式也与纯粹的销售员大相径庭。懂健身和商业的人打造出的健康公司，是MBA都难以理解的。你的优势更多在于跨领域知识，而非专业知识。这正是我们在文艺复兴时期看到的模式，如今它正以更强大的力量卷土重来。想想是什么让这一切成为可能……印刷术发明之前，知识十分匮乏。书籍都是手工抄写的。抄写一本文本可能需要抄写员花费数月时间。图书馆很少，识字的人更是凤毛麟角。如果你想学习本行以外的知识，要么能进入修道院，要么就根本学不到。然后古腾堡改变了一切。短短五十年间，两千万册图书涌入欧洲。过去需要几代人才能传播的思想如今几个月就能传遍四方。识字率呈爆炸式增长。知识成本骤降。历史上第一次，一个人可以在一生中真正追求多个领域的精通。文艺复兴由此而来。达·芬奇并非只专注于某一方面。他绘画、雕塑、工程设计、研究解剖学、设计战争机器，还绘制了人体结构图。米开朗基罗则是画家、雕塑家、建筑师和诗人。独特的思维终于可以自由地按照他们应有的方式运作了。他们本应跨越学科界限，融会贯通，并追随好奇心，无论它将他们引向何方，但我们大多数人从未意识到这一点。印刷术的出现催生了一种新型人才。这种人才能够学习任何知识，将任何事物融会贯通，创造出任何专家都无法创造出来的东西。", {"h": "3.如何将多种兴趣转化为一种有利可图的生活方式"}, "目前我们了解到的情况有几点：你兴趣广泛，但感觉自己无法永远学习下去。你热爱基于兴趣的自学，但必须在工作之余挤出时间进行学习。你明白自给自足的必要性，但你觉得自己没有值得付费的价值，然而你需要具备快速适应能力，因为我们不知道未来的工作会是什么样子。", "那么问题来了，我们如何将所有这些事物融合到一种生活方式中呢？如何将学习和赚钱结合起来，让你能够以此为生？我会尽量把事情解释得合乎逻辑。要想靠自己的兴趣赚钱，首先需要让其他人也对你的兴趣感兴趣。这一点很简单。如果你自己对某件事感兴趣，其他人也一样会感兴趣，你只需要学会如何说服他们。此外，你还需要一种支付报酬的方式。在这种情况下，通常意味着你需要销售产品，因为你可能找不到一份能让你表达兴趣的工作，而投资股票或房地产（达到任何有效程度）都需要相当多的资金。换句话说，你需要关注。注意力是最后的护城河之一。因为当任何人都能编写任何代码或开发任何软件时，谁能胜出？是那些广为人知的产品。你可以拥有世界上最好的产品，但如果无人知晓，那么能够吸引并保持用户注意力的人将会遥遥领先于你。顺便提一下，如果你一直关注科技领域，就会知道，我不认为每个人都会“自己开发软件”。大多数人甚至连20分钟都不愿意花在自己做饭上。他们宁愿花几块钱叫外卖。而且每个人都有自己想做的事情。回到正题：你需要成为一名创造者。现在，在你感到尴尬并离开之前，我并不是说要你成为内容创作者（嗯……这很复杂）。我的意思是，如果你不再需要为别人创作才能获得报酬，那么解决之道就是为自己创作。人类天生就是创造者，我们曾坚信成为机器就能实现美国梦。我们骨子里就是工具制造者。我们之所以能在任何领域蓬勃发展，是因为我们总能找到解决问题的方案。如果把狮子放到阿拉斯加，它不会建造住所和衣物，它只会饿死。狮子就应该待在它自己的生态位里。关键在于，如今每个企业都是媒体企业。记住，你需要关注。那么，关注点在哪里呢？目前主要集中在社交媒体上，直到下一个更受关注的平台出现——到那时，你就需要做出调整。所以，如果你兴趣广泛，成为“内容创作者”当然是明智之举，但或许更简单的方法是把社交媒体看作是让你的兴趣爱好被更多人看到的工具。它是独立创作过程中不可或缺的一部分。此外，这涵盖了我们所有的需求。你热爱学习？太好了，那就把它重新定义为“研究”，这样它就成了你的主要工作。我写的大部分内容都源于我对自身兴趣的探索，以及我把社交媒体当作“公开做笔记”来对待。（你已经在花时间学习了，现在只需把这些时间花在公开场合学习，砰！你就拥有了创业的基础）。你想实现自给自足？那你需要创办一家公司，而每家公司都需要吸引顾客，你可能根本不在乎付费广告、搜索引擎优化或其他任何形式的营销。很多人在这方面就容易犯错，因为他们习惯了作为员工在公司里只做一项特定的工作。你需要具备适应能力？太棒了！你可以像开发产品一样快速地开发并向你的受众推出新产品。我拥有稳定的受众群体，即使我的下一个产品失败了，也有人愿意投资、加入团队或支持下一个产品。你可以打造自己的小型SaaS公司，但如果没有分销渠道，你就需要在筹集资金、寻找人才和启动项目方面投入大量额外的精力。没有任何其他工作或商业模式能让你拥有如此大的自由去做这件事。但究竟该如何着手构建呢？你如何将所有这些联系起来？", {"h": "4.如何把自己变成一家企业（一人企业）"}, "目标-你想要从生活中获得什么——品牌 你帮助人们实现什么？", "知识-你在过程中学到了什么？-内容-对他们来说，哪些信息是有用的？", "流程-你是如何达到理想目标的？-产品-你如何帮助他们更快地实现目标？", {"h": "“明智的人会因为做自己喜欢的事情而获得报酬。”——艾伦·沃茨"}, "很遗憾，“创业”和“经商”已经变成了贬义词，让人们认为自己没有资格走这条路，以至于当机会来临时，他们甚至都没有注意到。如果你曾经帮助过别人实现自己的兴趣，你就有资格创业。它们不再需要前期投入资金。它们并非不道德精英的专属。它们并非只适合那些想赚大钱的人。它们也并非只适合有才华或特殊人士。事实上，创业精神根植于我们的天性之中，是现代人生存的根本。我们天生就渴望创造价值，并将其传递给志同道合的人群。我们天生就渴望探索未知，追求新奇，永不停歇。从心理学角度来看，这才是最令人愉悦的生活方式，即便其中不乏低谷，因为正是这些低谷孕育了（非人为的）巅峰时刻。此外，准入门槛已经降低。", "你其实只需要一台笔记本电脑和网络连接就够了。如今，社交媒体让内容分发变得免费（当然，并非完全免费，而是需要技巧，而技巧本身可能耗时费力）。任何人都可以发布一个想法，触达数百万人。如果他们有产品，这数百万的关注度就能转化为数百万美元的收益——前提是你懂得如何运营，但这本身就是一个很大的未知数。大多数人只是热衷于钻研那些与自身成功并无直接关联的兴趣或技能，或许是因为他们害怕失败。如今，工具和技术可以处理过去需要团队协作才能完成的工作。您可以利用人工智能和大量实用软件。现在，你可以选择两条途径开始。", {"h": "路径1.基于技能"}, "这曾是互联网上长期占据主导地位的模式。你“学习一项市场认可的技能”，然后通过内容教授这项技能，最后销售与该技能相关的产品或服务。这里的局限性在于成为专家的局限性。它是片面的。你把自己框在一个狭小的空间里。你“缩小范围”，因为有人告诉你这样更赚钱，而由于你追求的是利润而不是兴趣，你往往会把自己变成第二个朝九晚五的工作，做着你不在乎的工作，为你不在乎的人服务。", {"h": "路径2.基于发展的"}, "如今的成功创造者往往没有固定的细分市场。他们通常专注于四大永恒市场之一：健康、财富、人际关系、幸福，甚至可能同时涉足这四大领域。从本质上讲，每个人的细分市场都是自我实现，只不过他们实现目标的路径千差万别。他们追求的是自己的目标（品牌）。他们教他们所学的内容。它们帮助他人更快地实现目标（产品）。对于有多种兴趣的人来说，我当然推荐这条路，因为它走得更深入一些。首先，当你选择这条路时，你也同时选择了第一条路。因为打造你的品牌、内容和产品需要你精通所有相关的市场技能，所以即使失败了，你也拥有一些值得付费的东西。你在建立自己的事业，如果你擅长某个领域，你还可以帮助其他人解决他们事业中的特定问题。其次，它颠覆了传统模式。你创建客户画像不是为了缩小市场范围并只专注于某个细分领域，而是要把自己变成客户画像中的样子。这样一来，食物就更容易入口了。", "你在生活中追求目标并不断提升自己 → 你已经验证了你所提供内容的价值 → 你帮助过去的自己实现同样的目标。不要成为 YouTube 创作者。不要打造个人品牌。不要当网红。做你自己。但要在一个能让你的作品被发现、关注和支持的地方。目前以及在可预见的未来，这个地方就是互联网。", "乔丹·彼得森（或像他一样的人）并不是“内容创作者”，尽管表面上看起来是这样。他巡回演讲、著书立说、利用社交媒体平台，并运用一切可用资源来传播他毕生的心血。他并不在意最新的内容创意潮流。他的思维远胜于任何短视的增长策略。真正让他脱颖而出并改变人们生活（无论你对彼得森有何看法）的是他思想的品质。因此，我想提供一个关于品牌、内容和产品的全新视角。这样，你就可以把它作为你毕生事业的载体。", {"h": "5.品牌是一种环境"}, "不要再把你的品牌仅仅看作是头像和社交媒体简介。品牌是一个人们前来寻求转变的环境。", "品牌是你邀请他人进入的小世界。当读者首次访问您的个人资料时，品牌信息不会显示出来。", "品牌是读者关注你 3-6 个月后，在他们脑海中积累起来的印象。你在每一个接触点上都展现着你的世界观、人生故事和哲学。你的横幅、头像、个人简介、简介中的链接、落地页设计、置顶内容、帖子、话题、新闻简报、视频等等。换句话说，你的品牌是这样的：你的品牌就是你的故事。花一天时间写下你的出身、人生中的“低谷”、你经历过的事情和获得的技能，以及这些事情对你最大的帮助，这将对你有所帮助。当你构思创意、内容或产品时，应该用你的故事来筛选它们。这并不意味着你必须时时刻刻都在谈论自己，而是意味着你必须调整你的表达方式，使你的品牌保持一致性。最难的是意识到你的故事值得讲述，即使你认为它很无聊，或者还没有反思过自己的成长。重点是：你的个人简介和头像并不重要。有些人个人简介里只有一个词，头像也只用了一种颜色。我的建议：列出5-10位你在网上尊重的人。查看他们的头像、简介和内容。注意它们之间的规律。开始构思你应该如何打造自己的品牌，并融入你自己的独特风格。（先模仿）说实话，我觉得没必要把这件事想得太复杂，甚至不用为此担心。你的品牌会在你开始创作内容的过程中逐渐成型。我们甚至可以说，品牌本身就是内容，所以我们需要把这一点做好。", {"h": "6.内容是新颖的视角"}, "互联网就像一个信息洪流。人工智能只会增加更多噪音。这意味着信任和信号比以往任何时候都更加重要。我认为，内容创作的指导原则应该是将最优质的创意汇集于一处。你的品牌就是你所珍视的所有创意的集合，用你自己的语言，呈现在互联网上的一个账号中。如果你打算做播客或公开演讲，请注意，最优秀的演讲者总是能将5到10个最有力的论点或想法牢记于心。他们反复强调这些论点或想法，这就是他们建立影响力的秘诀。如果你没有这5到10个想法，你的影响力就不会像你本可以的那样大。而创作大量的内容正是你发现这些想法的途径。随着时间和精力的积累，当你的内容“创意密度”不断提高时，就能打造出一个值得关注和付费的品牌。为品牌甄选创意的目标应该围绕以下几个方面展开：", "表现——这些想法有“成功”的潜力。这衡量的是其他人会有多关注。", "兴奋——这些想法让你充满写作的热情。这体现了你对它们的重视程度。", "艺术与商业。", "指标和绩效不应该决定一切，但它们确实具有一定的意义。", {"h": "第一步 建立一个创意博物馆"}, "你所喜爱的大多数创意人士的秘诀在于，他们对笔记、想法和灵感来源进行严格的整理和归档。换句话说，他们有一个“素材库”，营销人员是这么称呼它的。你可以使用Eden，Apple Notes、Notion 或任何你喜欢的软件，但我想要非常明确地说明一点：你需要一个地方来随时记下脑海中浮现的想法。这是一个至关重要的习惯。无论何时，只要你想到一个有用的想法，无论是现在还是不久的将来，都把它记下来。你不需要构建内容支柱或两三个主题。你收集的想法只需要对你而言重要即可。仅此一点就足以说明它们与特定人群（比如你）相关。当然，如果你愿意，也可以创建一个内容地图。我不在乎你如何组织这些内容。它可以是一套整齐有序的文档，也可以是毫无章法的杂乱笔记。习惯比格式更重要。你可以通过查看帖子的点赞数、浏览量或整体互动情况来判断其表现，看看它是否有可能引起共鸣。如果这个创意反响平平，或者表现不如他们的其他内容，那么它可能对你来说效果不佳。你可以通过观察自己是否觉得如果不把某些有价值的东西写下来就会浪费掉来衡量兴奋程度。", {"h": "第二步 根据创意密度进行筛选"}, "如何开始充实你的创意博物馆？你需要 3-5 个信息密度高的信息来源。我所说的“创意密度”，指的是信号强度高的想法。很难解释如何找到高信号，因为这很主观。它取决于你的发展水平（对你有用的信息）、你的受众的发展水平（对他们有用的信息），以及你如何将两者结合起来。一条最基本的建议，对别人来说可能是世界上最有价值的东西，但对你来说可能却是常识。", "随着时间的推移，你会通过观察哪些想法能引起受众的共鸣，哪些不能，来调整自己的信噪比。", "信息最丰富的来源：", "老书或鲜为人知的书籍——我有五本书反复阅读，因为它们的思想非常精辟。这些书里蕴藏着永恒的原则，不受潮流的影响。", "精选博客、账号或书籍——例如 Farnam Street 这样的博客，汇集了当代知识分子最精彩的观点；Navalism 这样的账号，精选了 Naval 的最佳观点；而像《麦克斯韦每日读本》这样的书籍，则每天收录麦克斯韦的一个最佳观点，持续一年之久。这些资源为你省去了许多繁琐的工作，让你能够从中挑选出最精华的内容。", "一些有影响力的社交账号——我关注的账号大概有五六个，它们总是发布一些很棒的想法。如果我没什么可写的，我就会浏览它们的页面，找到一些我感兴趣的内容，然后就写写看。找到这些灵感来源需要几个月的探索时间。但维护一个汇集丰富想法的“灵感库”最终会让你创作出充满想法的内容。你的创意博物馆将成为你试图创造的思维模式的体现。这是最终目标。拥有一个内容如此丰富的库，以至于人们忍不住打开你的电子邮件、开启帖子通知、与朋友分享你的想法，并经常思考你的想法。你会成为那些人们甚至不会想到向人工智能寻求，也永远不会自然而然产生的创意的策展人。这样你就能减少对算法的依赖，从而获得成功。", {"h": "第三步 用 1000 种不同的方式写出1个想法"}, "成为一名优秀的作家或演说家，不仅在于拥有想法，还在于如何表达想法。创意本身就足以支撑很多工作，但正是其结构使其引人入胜、独具特色且富有影响力。让我来解释一下我的意思。以这样的帖子结构为例：我注意到快乐的人身上有一个共同点：他们非常注重保持头脑清醒。这里的观点是，快乐的人更容易保持头脑清晰。文章结构分为两部分：以观察为引子，以及对观察结果的阐述。这看似简单，但思想结构的差异却能产生巨大的影响。现在，如果我采用同样的思路，但使用“列表”结构：快乐的人头脑清晰：", "– 他们会抽出时间休息。– 他们专注于一个单一的目标。– 他们会毫不留情地消除干扰。换句话说，快乐的人非常注重保持头脑清晰。同样的理念，不同的结构，不同的影响。如果你愿意的话，你可以练习用同样的思路去写你遇到的每一种文章结构。以下是练习方法：", "首先，将3个想法分解成它们的结构。从你的创意库中选择3篇引起你共鸣的文章。然后，尝试分析每个想法的各个部分，并阐述其有效的原因。如果你没有内容心理学方面的经验，那也没关系。你可以在实践中学习。现在正是利用人工智能提供帮助的最佳时机。尝试在每篇文章中使用以下提示：请对这篇社交媒体帖子进行全面分析，包括整体思路、句子结构和用词。分析人们为何会参与互动，为何这篇帖子如此有效，运用了哪些心理策略，以及我如何才能将这种风格与自己的想法一步步结合起来。然后将帖子内容粘贴到提示下方。我建议使用 Claude 模型，而不是 ChatGPT 或 Gemini。在你的写作过程中，如果你有任何想法想要融入到你的写作风格中，请继续这样做。这种方法不仅适用于文章，也适用于视频。", "第二，用不同的结构重写 3 个想法。回到你的创意库，选择一个你在第一步中没有使用过的创意。然后，尝试用你刚才分析的 3 种文章结构重写这个想法。这就是拓展射程的方法。这样你就能不再盯着空白屏幕发呆了。这就是如何将一个想法转化为一周的内容。我们为什么要这样做？好了，现在你已经掌握了创作出脱颖而出的内容和想出好点子的所有秘诀。说真的，这就是秘诀。至于能否取得任何成果，都取决于实践。", {"h": "7.系统是新产品"}, "好了，篇幅有点长了，所以我加快速度。目前，我们处于系统经济时代。人们并不想要解决问题的方案。他们想要你为他们的问题提供解决方案。市面上有很多写作产品，那么我的“2小时写作”产品有什么不同之处呢？或者，我正在开发的软件Eden，根据YouTube评论区里那些打造过成功产品的“超级聪明人”的说法，它“很容易被Google Drive或Dropbox取代”？这些系统是我通过自身实践获得成效而创建的。2HW 不会教你一堆毫无意义的学术写作废话，这些废话并不能帮助你实现我们共同的愿景——过上富有创造力和意义的生活。我遇到了一些问题：我一直苦于没有源源不断的创意素材。我不想浪费大量时间为所有不同的平台创建内容。于是，我开始试验自己的系统。我的目标很明确：每天用不到两小时的时间写完所有需要的内容。这样一来，我的受众增长就迎刃而解了，我可以专注于打造更好的产品，享受生活。我开始尝试各种方法来获取更多的内容创意。如果还是想不出什么好点子，我会创建灵感库、产生想法的步骤说明和模板。我详细规划了每周要写的内容：每天 3 篇博文，每周 1 个主题帖，每周 1 封简报。在这个过程中，我意识到我可以将我的文章同步发布到所有社交平台（这是公开的，任何人都可以看到）。我还意识到，帖子可以转换成轮播图，新闻简报可以转换成 YouTube 视频。如果系统运行不畅，我会在下周尝试新的方法。由此，我意识到我可以将我的新闻简报复制粘贴到我的博客中，将 YouTube 视频嵌入到该博客中，在该博客中推广我的产品，并将该博客转化为更多的内容创意。这样，我就可以每天在我的内容下方添加那个博客的链接。这带来了更多的电子报订阅用户、YouTube 订阅用户和产品销量。我意识到，如果我所做的一切都以新闻通讯为中心，那么在扩大受众群体和推广产品方面，我就只需要担心这一点了。在充斥着复制粘贴产品的时代，这就是你脱颖而出的方法。是的，这需要时间和经验。但最终的结果非常值得。"], "wcount": 9846}];

const SELKEY='pa-excerpts-v1';

/* ===== EXCERPT-ORDER-v1 摘录原文排序 ===== */
function _pidNum(pid){
  var m=/(\d+)/.exec(String(pid||'')); return m?parseInt(m[1],10):-1;
}
function _excerptCmp(a,b){
  var pa=_pidNum(a.pid), pb=_pidNum(b.pid);
  if(pa!==pb) return pa-pb;                    // 段落全局顺序
  var sa=(a.so==null?0:a.so), sb=(b.so==null?0:b.so);
  if(sa!==sb) return sa-sb;                     // 段内字符偏移
  return (a.time||0)-(b.time||0);               // 兜底：时间
}
function sortByDocOrder(arr){ return arr.slice().sort(_excerptCmp); }

/* ===== PID-FIX-v1 旧数据自愈：给空 pid 摘录反查补 pid ===== */
function healMissingPid(){
  try{
    var raw=localStorage.getItem('pa-excerpts-v1'); if(!raw) return;
    var arr=JSON.parse(raw||'[]'); if(!arr||!arr.length) return;
    var bad=arr.filter(function(x){return x && !x.pid;});
    if(!bad.length) return;
    var nodes=[].slice.call(document.querySelectorAll('[data-pid]'));
    if(!nodes.length) return;
    function norm(s){return String(s||'').replace(/\s+/g,'');}
    var changed=false;
    arr.forEach(function(x){
      if(!x || x.pid) return;
      var needle=norm(x.text||'').slice(0,16);
      if(!needle) return;
      for(var i=0;i<nodes.length;i++){
        var el=nodes[i]; var full=norm(el.textContent||'');
        var k=full.indexOf(needle);
        if(k>=0){
          x.pid=el.getAttribute('data-pid');
          x.so=k; x.eo=k+String(x.text||'').length;
          changed=true; break;
        }
      }
    });
    if(changed){
      // 用有序插入重建，保证存储顺序即原文顺序
      var sorted=sortByDocOrder(arr);
      localStorage.setItem('pa-excerpts-v1',JSON.stringify(sorted));
      excerpts=sorted;
      if(typeof renderNotes==='function') renderNotes();
      if(typeof updateNoteCount==='function') updateNoteCount();
    }
  }catch(e){}
}
/* 延迟一拍执行，确保正文段落已渲染；幂等，无坏数据时会自行返回 */
setTimeout(function(){try{healMissingPid();}catch(e){}}, 60);

function insertByOrder(exc){
  var i=0; while(i<excerpts.length && _excerptCmp(excerpts[i],exc)<=0) i++;
  excerpts.splice(i,0,exc);
}

function getChapterInfo(node){
  let el=node.nodeType===3?node.parentElement:node;
  const ch=el&&el.closest?el.closest('.chapter'):null;
  return {ch:ch?ch.querySelector('h1').textContent:'',sec:''};
}
function wrapSelection(cls){
  const sel=window.getSelection();
  if(!savedRange||sel.isCollapsed) return false;
  const range=savedRange;
  if(range.startContainer===range.endContainer && range.startContainer.nodeType===3){
    const span=document.createElement('span');
    span.className=cls; span.dataset.eid='e'+Date.now()+Math.random().toString(36).slice(2,6);
    try{range.surroundContents(span);}catch(e){return false;}
    return span;
  }
  try{
    const span=document.createElement('span');
    span.className=cls; span.dataset.eid='e'+Date.now()+Math.random().toString(36).slice(2,6);
    span.appendChild(range.extractContents()); range.insertNode(span);
    return span;
  }catch(e){return false;}
}
function addExcerpt(cls,color){
  const sel=window.getSelection();
  if(!savedRange||sel.toString().trim().length===0){sel.removeAllRanges();selbar.classList.remove('show');return;}
  const text=sel.toString().trim();
  const info=getChapterInfo(savedRange.startContainer);
  let pid='', so=0, eo=0;
  const sc=savedRange.startContainer;
  // PID-FIX-v1: 兼容 p 与 h2 小标题，且覆盖选区起点为元素节点的情况
  const para=(function(n){
    if(!n) return null;
    if(n.nodeType===3) n=n.parentElement;
    if(!n) return null;
    if(n.nodeType===1 && n.hasAttribute && n.hasAttribute('data-pid')) return n;
    return n.closest ? n.closest('[data-pid]') : null;
  })(sc);
  if(para){
    pid=para.dataset.pid;
    try{
      const pre=document.createRange();pre.selectNodeContents(para);pre.setEnd(sc,savedRange.startOffset);
      so=pre.toString().length; eo=so+text.length;
    }catch(e){}
  }
  const span=wrapSelection(cls);
  const eid=span?span.dataset.eid:('e'+Date.now());
  insertByOrder({
    id:eid, text:text, ch:info.ch, sec:info.sec,
    cls:cls, color:color, time:Date.now(), pid:pid, so:so, eo:eo
  });
  saveExcerpts(); renderNotes();
  sel.removeAllRanges(); savedRange=null; selbar.classList.remove('show');
}
function unwrapMark(span){
  const parent=span.parentNode;
  while(span.firstChild) parent.insertBefore(span.firstChild,span);
  parent.removeChild(span);
}
function marksInSelection(cls){
  if(!savedRange) return [];
  return [...document.querySelectorAll('span[data-eid]')].filter(s=>{

function paintMarkInPara(root, pid, so, eo, cls, eid){
  if(!root||!pid||so===undefined||eo===undefined||eo<=so) return false;
  const para=root.querySelector('p[data-pid="'+pid+'"]');
  if(!para) return false;
  if(eid && para.querySelector('span[data-eid="'+eid+'"]')) return true;
  const walker=document.createTreeWalker(para,NodeFilter.SHOW_TEXT,null,false);
  let acc=0, sn=null, soff=0, en=null, eoff=0, node;
  while((node=walker.nextNode())){
    const len=node.textContent.length;
    if(sn===null && acc+len>so){sn=node;soff=so-acc;}
    if(acc+len>=eo){en=node;eoff=eo-acc;break;}
    acc+=len;
  }
  if(!sn) sn=en; if(!en) en=sn;
  if(!sn||!en) return false;
  try{
    const r=document.createRange();r.setStart(sn,soff);r.setEnd(en,eoff);
    const span=document.createElement('span');
    span.className=cls;span.dataset.eid=eid;
    span.appendChild(r.extractContents());r.insertNode(span);
    return true;
  }catch(e){return false;}
}
function restoreHighlights(){

  });
  return ok;
}

<script>

(function(){

/* 合并：阅读时长按 天+书 取 max；删除墓碑按 id 取最新；摘录按 id 合并、 tomb 中的剔除 */
/* MERGEFIX-v1: 摘录对象用 time 字段，兼容读取 t/time */
function excTime(x){return (x&&(x.t||x.time))||0;}
function mergeData(a){
  suppressPush=true;
  try{
  var t=getT(), e=getE(), d=getD();
  var _corr=getC(), _corrChanged=false;
  if(a.readingTime&&typeof a.readingTime==='object'){
    Object.keys(a.readingTime).forEach(function(day){
      if(!t[day]) t[day]={};
      var src=a.readingTime[day]||{};
      Object.keys(src).forEach(function(k){ t[day][k]=Math.max(t[day][k]||0,src[k]||0); });
    });
  }
  var dm={}; d.forEach(function(x){dm[x.id]=Math.max(dm[x.id]||0,x.t||0);});
  (a.excTomb||[]).forEach(function(x){dm[x.id]=Math.max(dm[x.id]||0,x.t||0);});
  var em={}; e.forEach(function(x){
    if(!x||!x.id) return;
    if((dm[x.id]||0)>=excTime(x)) return; /* 本地项已被墓碑删除 */
    em[x.id]=x;
  });
  (a.excerpts||[]).forEach(function(x){
    if(!x||!x.id) return;
    if((dm[x.id]||0)>=excTime(x)) return; /* 云端项已被墓碑删除 */
    if(!em[x.id] || excTime(x)>excTime(em[x.id])) em[x.id]=x;
  });
  setT(t); setD(Object.keys(dm).map(function(id){return {id:id,t:dm[id]};}));
  setE(Object.keys(em).map(function(id){return em[id];}));
  if(a.corrections&&typeof a.corrections==='object'){
    Object.keys(a.corrections).forEach(function(k){
      var r=a.corrections[k]; if(!r||typeof r!=='object') return;
      if(!_corr[k] || (r.ts||0)>(_corr[k].ts||0)){ _corr[k]=r; _corrChanged=true; }
    });
    if(_corrChanged) setC(_corr);
  }
  }finally{ suppressPush=false; }
}
/* ===== LOCALSNAP-v1 本地自动快照（保险层，独立于云同步） ===== */
(function(){
  if(window.__PA_LOCALSNAP) return; window.__PA_LOCALSNAP=1;
  var SNAPKEY='pa-local-snaps-v1', CFGKEY='pa-sync-cfg-v1', MAX=5;
  function lcfg(){
    try{var c=JSON.parse(localStorage.getItem(CFGKEY)||'{}')||{};
      if(c.localSnap===undefined) c.localSnap=true; return c;
    }catch(e){return {localSnap:true};}
  }
  function lread(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}}
  function current(){
    try{ if(typeof snapshot==='function') return snapshot(); }catch(e){}
    return {v:1,app:'pa-reader',exportedAt:new Date().toISOString(),
      readingTime:lread('pa-reading-time-v1',{}),excerpts:lread('pa-excerpts-v1',[]),
      excTomb:lread('pa-excerpts-tomb-v1',[]),corrections:lread('pa-corrections-v1',{})};
  }
  function getSnaps(){return lread(SNAPKEY,[]);}
  function setSnaps(a){try{localStorage.setItem(SNAPKEY,JSON.stringify(a));}catch(e){}}
  function saveSnap(force){
    if(!lcfg().localSnap) return false;
    var d=current(), snaps=getSnaps();
    var payload=JSON.stringify([d.excerpts||[],d.corrections||{},d.readingTime||{},d.excTomb||[]]);
    if(snaps[0] && snaps[0].sig===payload && !force) return false;
    snaps.unshift({ts:Date.now(),sig:payload,data:d});
    if(snaps.length>MAX) snaps=snaps.slice(0,MAX);
    setSnaps(snaps);
    return true;
  }
  var _snapTimer=null;
  function scheduleSnap(){clearTimeout(_snapTimer);_snapTimer=setTimeout(function(){saveSnap(false);},1200);}
  // 1) 摘录等数据写入：包装 setItem 捕获（含本页直接写入）
  var _origSI=Storage.prototype.setItem;

    _origSI.call(this,k,v);
    if(k==='pa-excerpts-v1'||k==='pa-corrections-v1'||k==='pa-reading-time-v1'||k==='pa-excerpts-tomb-v1') scheduleSnap();
  };

  window.addEventListener('pa-data-changed',scheduleSnap);

  setTimeout(function(){ if(getSnaps().length===0) saveSnap(true); },2500);
  window.PA_SNAP={
    list:getSnaps,
    save:function(){return saveSnap(true);},
    restore:function(idx){
      var s=getSnaps()[idx]; if(!s) return false; var d=s.data;
      try{
        if(d.readingTime)localStorage.setItem('pa-reading-time-v1',JSON.stringify(d.readingTime));
        if(d.excerpts)localStorage.setItem('pa-excerpts-v1',JSON.stringify(d.excerpts));
        if(d.excTomb)localStorage.setItem('pa-excerpts-tomb-v1',JSON.stringify(d.excTomb));
        if(d.corrections)localStorage.setItem('pa-corrections-v1',JSON.stringify(d.corrections));
      }catch(e){return false;}
      try{ if(typeof refresh==='function') refresh(); }catch(e){}
      return true;
    }
  };
  function enh(){
    var panel=document.getElementById('bkPanel'); if(!panel||panel.dataset.snapUI) return;
    panel.dataset.snapUI='1';
    var c=lcfg(), snaps=getSnaps();
    function fmt(ts){var d=new Date(ts);return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
    var box=document.createElement('div');
    box.style.cssText='margin-top:14px;padding-top:12px;border-top:1px solid var(--line)';
    var html='<div class="row" style="font-size:13px;font-weight:700">🛟 本地自动快照（保险层）</div>'+
      '<div class="row"><label style="font-size:12.5px"><input type="checkbox" id="snapOn" '+(c.localSnap?'checked':'')+'> 数据变化时自动存快照（最多5份）</label></div>'+
      '<p style="font-size:11.5px;color:var(--muted);line-height:1.6;margin:6px 0">'+
      '快照仅存本机浏览器，不联网。同步万一看错/丢失，点下方时间可回滚到出错前。<br>'+
      '<b>换电脑</b>：用顶栏「导出备份」把数据存成文件带走，在新电脑「导入」即可恢复——快照本身跨不了设备。</p>'+
      '<div class="row"><button class="bk-btn" id="snapNow">立即存一份</button></div>';
    if(snaps.length){
      html+='<div style="font-size:12px;margin-top:8px">最近快照（点「回滚」恢复）：</div>';
      snaps.forEach(function(s,i){
        var cnt=(s.data&&s.data.excerpts)? s.data.excerpts.length:'?';
        html+='<div class="row" style="justify-content:space-between;font-size:12px">'+
          '<span>'+fmt(s.ts)+' · 摘录'+cnt+'条'+(i===0?' · 最新':'')+'</span>'+
          '<button class="bk-btn snap-restore" data-i="'+i+'">回滚</button></div>';
      });
    } else {
      html+='<div style="font-size:12px;color:var(--muted);margin-top:8px">暂无快照（首次使用约几秒后自动生成）</div>';
    }
    box.innerHTML=html;
    var firstRow=panel.querySelector('.row'); if(firstRow) firstRow.parentNode.insertBefore(box,firstRow); else panel.appendChild(box);
    document.getElementById('snapOn').onchange=function(){
      var cc=lcfg(); cc.localSnap=this.checked;
      try{localStorage.setItem(CFGKEY,JSON.stringify(cc));}catch(e){}
      if(this.checked) window.PA_SNAP.save();
    };
    document.getElementById('snapNow').onclick=function(){
      window.PA_SNAP.save();
      try{ if(typeof closePanel==='function')closePanel(); if(typeof openPanel==='function')openPanel(); }catch(e){}
    };
    box.querySelectorAll('.snap-restore').forEach(function(btn){
      btn.onclick=function(){
        var i=+btn.getAttribute('data-i');
        if(!window.confirm('确定回滚到该快照？当前摘录/修改会被该快照覆盖（快照本身仍保留）。'))return;
        if(window.PA_SNAP.restore(i)){
          try{ if(typeof push==='function') push(); }catch(e){}
          try{ if(typeof closePanel==='function')closePanel(); if(typeof openPanel==='function')openPanel(); }catch(e){}
        }
      };
    });
  }
  var mo=new MutationObserver(function(){ if(document.getElementById('bkPanel')) enh(); });
  mo.observe(document.body,{childList:true,subtree:true});
})();
function snapshot(){
  return {v:1,app:'pa-reader',exportedAt:new Date().toISOString(),readingTime:getT(),excerpts:getE(),excTomb:getD(),corrections:getC()};
}

/* --- UI 状态 --- */
function dot(cls,msg,err){var el=document.getElementById('bkDot');if(el)el.className='bk-dot'+(cls?' '+cls:'');var m=document.getElementById('bkMsg');if(m){m.textContent=msg;m.className='bk-msg'+(err?' err':'');}}

/* --- 导出 / 导入 --- */
function doExport(){

function handleFile(ev){
  var f=ev.target.files[0]; if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||(!d.readingTime&&!d.excerpts)) throw new Error('文件格式不对');
      var mode=window.confirm('点「确定」= 合并导入（保留双方数据，推荐）\n点「取消」= 覆盖导入（用文件完全替换本机数据）');
      if(mode){ mergeData(d); }
      else { if(d.readingTime)setT(d.readingTime); if(d.excerpts)setE(d.excerpts); if(d.excTomb)setD(d.excTomb); if(d.corrections)setC(d.corrections); }

/* --- Gist 同步 --- */
function api(method,path,body){
  var opt={method:method,headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','User-Agent':'pa-reader'}};
  if(body){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
  return fetch('https://api.github.com'+path,opt).then(function(r){
    if(r.status===401) throw new Error('Token 失效');
    if(r.status===403) throw new Error('请求被限流');
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  });
}
var busy=false, dirty=false, timer=null, lastOk=0, suppressPush=false;
function pull(silent){
  if(!cfg.enabled||!cfg.token||!cfg.gistId){if(!silent)dot('err','未开启同步',true);return Promise.resolve(false);}
  if(busy)return Promise.resolve(false); busy=true; dot('busy','正在从云端读取…');
  return api('GET','/gists/'+cfg.gistId).then(function(g){
    var f=g.files&&g.files[GFILE];
    if(!f) throw new Error('云端文件不存在');
    var content=f.truncated?null:f.content;
    var pr=content?Promise.resolve(content):fetch(f.raw_url).then(function(r){return r.text();});
    return pr.then(function(txt){
      var d=JSON.parse(txt); mergeData(d); refresh(); stat();
      lastOk=Date.now(); dot('ok','已同步 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}));
      return true;
    });
  }).catch(function(e){dot('err','云端读取失败：'+e.message+'（本机数据不受影响）',true);return false;})
    .then(function(ok){busy=false;return ok;});
}
function push(){
  if(!cfg.enabled||!cfg.token||!cfg.gistId)return Promise.resolve(false);
  if(busy){dirty=true;return Promise.resolve(false);}
  busy=true; dot('busy','正在保存到云端…');
  var files={}; files[GFILE]={content:JSON.stringify(snapshot(),null,2)};
  return api('PATCH','/gists/'+cfg.gistId,{files:files}).then(function(){
    lastOk=Date.now(); dirty=false; dot('ok','已保存 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})); return true;
  }).catch(function(e){dirty=true;dot('err','保存失败：'+e.message+'（已排队重试）',true);return false;})
    .then(function(ok){busy=false;return ok;});
}
function schedulePush(){dirty=true;clearTimeout(timer);timer=setTimeout(function(){if(dirty)push();},800);}
function syncNow(){ pull(true).then(function(ok){ if(ok&&dirty) return push(); }); }

/* 数据变化时自动推送：监听两种 storage 写入（同页通过包装 setItem） */
var _si=Storage.prototype.setItem;
Storage.prototype.setItem=function(k,v){

window.addEventListener('storage',function(e){if(cfg.enabled&&(e.key===KEY_E||e.key===KEY_T||e.key===KEY_D||e.key===KEY_C)){pull(true);}});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&cfg.enabled){pull(true);}});

    '<div class="row"><label style="font-size:13px"><input type="checkbox" id="bkOn" '+(cfg.enabled?'checked':'')+'> 开启云同步</label></div>'+
    '<div class="row"><input type="password" id="bkToken" placeholder="GitHub Token" value="'+(cfg.token||'')+'" style="flex:1;min-width:220px;padding:7px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text);font-size:13px"></div>'+
    '<div class="row"><input type="text" id="bkGist" placeholder="Gist ID" value="'+(cfg.gistId||'')+'" style="flex:1;min-width:220px;padding:7px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text);font-size:13px"></div>'+

function openPanel(){

  if(!isHub){

      fi.addEventListener('change',handleFile); document.body.appendChild(fi); window.bkFileInit=1;
    }
    var bar=document.getElementById('bkBar');
    if(bar){
      document.getElementById('bkExport').onclick=doExport;
      document.getElementById('bkImport').onclick=doImport;
      document.getElementById('bkSync').onclick=syncNow;
      document.getElementById('bkMore').onclick=openPanel;
      document.getElementById('rtPop').appendChild(bar);
    }
  }else{
    var fi2=document.createElement('input'); fi2.type='file'; fi2.accept='.json,application/json'; fi2.id='bkFile'; fi2.style.display='none';
    fi2.addEventListener('change',handleFile); document.body.appendChild(fi2);
    document.getElementById('bkExport').onclick=doExport;
    document.getElementById('bkImport').onclick=doImport;
    document.getElementById('bkSync').onclick=syncNow;
    document.getElementById('bkMore').onclick=openPanel;
    stat();
  }
  if(cfg.enabled&&cfg.token&&cfg.gistId){
    dot('busy','正在连接云端…'); pull(true);
    setInterval(function(){if(!document.hidden)pull(true);},45000);
  }else{ dot('','云同步未开启'); }
}

window.PA_BACKUP={export:doExport,import:doImport,sync:syncNow,pull:pull,push:push,snapshot:snapshot,merge:mergeData,config:cfg,stat:stat};
})();
