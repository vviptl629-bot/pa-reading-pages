读和理解，你所有的疑问都会得到解答。最后，这本书是写给创意人士、工作不尽如人意的人以及害怕被取代的人的。他们知道自己还能为世界贡献更多，却对“应该”做事的方式失去了信心。这本书与我之前的作品风格迥异，几乎没有经过任何修饰或刻意追求华丽的辞藻。我力求让文字尽可能贴近我写作时脑海中涌现的灵感。我完全接受这本书可能存在错误，但无论我内心如何反复斟酌，我都觉得分享一些或许能帮助他人的观点是愚蠢的。希望你们喜欢。", {"h": "关于工作的真相"}, "我们从出生起就被灌输要为所有人服务，唯独不为自己服务。他们教我们识字的同时，也悄悄地灌输了一个更深层的道理：你的存在是为了实现他们的梦想，而不是你自己的。从摇篮到坟墓，你被分配的任务引领你走上一条熟悉的道路，而不是一条全新的道路。你默默地完成这些任务，无需挣扎，也无需思考，最终沦为社会中一个机械的、可替代的角色。这个社会充斥着试图用虚假的快乐掩盖内心痛苦的人。你对此一无所知，因为你所知道的只是别人告诉你的。", "你被告知要学习你不感兴趣的东西，完成你不感兴趣的项目，为一种你不感兴趣的生活做好准备。不知不觉中，你被困在沉重的责任之中。那些本可以用来改变你人生的资源——时间、精力和金钱——像钟表一样精准地被消耗殆尽，你别无选择，只能按照社会为你制定的计划，继续做一个有用的劳动者。", "如果你讨厌你的工作，它占据了你生活的三分之一，耗尽了你享受另外三分之一的精力，而你剩下的三分之一都在睡觉，那么似乎没有什么比创造、建造、设计、写作、销售、投资、拥有、实验和发现一种方法来控制你每天所做的事情更重要的了。工作就是为了赚钱而不是为他人做的一些令人不快的苦差事。工作是一种生存机制。工作是你追随那些塑造你思想的人的道路上的一个里程碑。从某种意义上说，工作和学校很相似，好的营销可以弥补糟糕的产品。几个世纪以来，学校屡屡失败，却依然存在，原因很简单：很少有人愿意独立思考。大多数人都在做大多数人都在做的事。大多数人并不满足于得到和大多数人一样的结果，但到了人生的中途，想要摆脱这种模式就难上加难了。职业生涯是对工作发展的一种承诺。它要求你不断挑战自我，承担一系列具有挑战性的角色和任务。从心理学角度来看，这能为你的思维带来长期的秩序感和清晰的思路。随着挑战的层级增加，生活也变得更加丰富多彩。新的知识和技能获取途径也逐渐显现。职业生涯就像是延伸的教育。如果你想在职业生涯中取得更大的进步，那么在一定程度上，你需要先理顺自己的生活。使命感是那种你无法自拔、别人也情不自禁地愿意为你付出的事业。使命感无法被强加于你，也无法在他人命令下完成。使命感无法用固定的工作时长来定义，因为你的思绪始终围绕着它运转。使命感存在于你追求进步最终化为执念的那一刻。使命感是他人无法理解的，它需要追寻者悉心呵护、守护和维护，就像一份他人可能无意间夺走的礼物。工作并非事业或使命，但事业和使命本身都是工作。事业并非使命，但使命本身就是事业。工作对于那些不知所措或仅仅为了生存的年轻人来说是很好的选择。事业对于那些渴望获得更多人生满足感的人来说是很好的选择，因为他们明白挑战性的工作是自我提升的动力。使命则属于那些知道自己肩负重任的人。他们是少数愿意冒险进入未知领域，并为自己的人生结果承担全部责任的人。令人悲哀的是，如今“工作”一词竟被视为一种诅咒。普通人一想到工作，脑海中便会浮现出熟悉的过往经历和可预见的未来：压力、疲惫和焦虑。工作太久，你会渴望休息；休息太久，你又会渴望工作。这是一个恶性循环，让你永远感觉不到自己身处何处。你的思绪总是游离于当下之外。人们梦想着我们称之为“退休”的永无止境的假期，但一旦他们实现了这个幻想，一切又都会习以为常。不出几周，你就会不由自主地想要在“存在”和“工作”之间找到平衡。我们拼命工作，直到挣够钱休息，却发现自己拥有的太多，内心却如此匮乏，无法满足。我们深陷于生存模式，从未真正理解那些被赋予和接受的责任之外的世界。每天醒来，去上班，应付老板，因为没时间而吃速食，因为没精力而放弃那些你曾许诺给自己的好习惯，眼睁睁地看着自己的生活慢慢崩溃，身心和人际关系也随之瓦解，却无动于衷，因为这就是你唯一熟悉的生活。要明白，工作是生活不可或缺的一部分。工作是投入精力去解决问题。人类喜欢解决问题，但并非任何问题都行，而是那些我们认为有意义且有趣的问题。正确的问题能让我们集中注意力，忘却烦恼；错误的问题则会束缚我们的注意力，加剧我们的忧虑。二者的区别在于，一个是主动选择的，另一个是被动接受的。问题是你思维和潜能的局限。一旦问题得到解决，它们便能促进成长、拓展和进化。没有问题就没有目标。它们之间有着千丝万缕的联系。你的目标源于你的苦难，而你可以选择为何而受苦。在一个利用并让我们背离解决问题天性的社会里，无论任务多么艰巨，创造一份让你感觉不像是在工作的工作，才是明智之举。人们潜意识里有一种偏见，认为赚钱是件坏事。当你表达想要赚更多钱的愿望时，一种负罪感就会油然而生，仿佛这是你不应该做的事。对金钱的追求几乎总是始于肤浅的层面。但这并不意味着追求金钱本身是件坏事。它或许是你接触人生深度的唯一途径；你只能从表面开始挖掘。就像举重一样，你最初是为了满足虚荣心，后来是为了疗愈身心，最终在追求的过程中培养出一种哲学意义上的掌控感。说到金钱，你最初赚钱并非为了改变世界，而是为了生存。一旦生存目标实现，你赚钱更多是为了获得认可和价值感。只有当更高层次的目标实现之后，你的心智才会发展到足以关注创造力或对人类的贡献。也就是说，你从工作到事业再到使命的旅程并非一帆风顺，难免会犯错，也会有自我，但这没关系。人生本就该如此，如果你试图跳过某些步骤，将会遭受巨大的情感冲击。最初，你创造是为了赚钱；最终，你赚钱是为了创造。物质是通往非物质世界的门户。大多数人拒绝追求物质，是因为他们看不到物质之外的东西。有人可能一时冲动买了一辆豪车，但他们也可能逐渐痴迷于汽车本身的内涵。他们可以研究汽车的各个部件，从中探索新的领域，将其发展成事业，并把它当作探索未知世界的工具。有人可能为了追求地位和金钱而创业，但同样的创业经历也能让他们体会到经营企业所需的技能深度、客户的成功以及自身思维的运作方式。所有追求，即使是最“精神化”的追求，在形成一种哲学上的掌控感之前，都是物质性的。一旦形成这种掌控感，它就成为你探索未知的载体，一个拓展和进化的容器。就像一段感情，你最初会被外表吸引，但只有到了那时，你才会真正了解他们的内心世界。在生活的各个领域，外表和内在同样重要。但大多数人害怕表象之下的东西，所以他们只停留在表面，被任何能让他们忘记痛苦的事物所分散注意力。", {"h": "就业与创业"}, "接下来我要做一个大胆的预测，或许在本书中出现得有点早。我并非意在制造恐慌，而是希望它能成为最具启发性的论断之一。我的预测是：未来的工作将主要由创业者，特别是创造者构成；即便不是创业者，也会由具备创业者特质的精英员工组成，而这些精英员工的职位将越来越稀缺。“入门级”职位正在消失。这使得个人只有两种选择：要么依赖政府的基本收入，过上优渥的生活，因为你的思想被那些你依赖的人所掌控；要么完全掌控自己的未来，成为一名创业者。事实上，这正是促使我写作本书的主要动力。如今，关于工作岗位被取代、人工智能能力与人类匹敌的新闻铺天盖地，工作的未来一片迷茫，充满未知。但我希望通过这本书，能够改变你对未来的看法。我希望能够帮助你培养一种适应、感知、思考和蓬勃发展的思维模式，无论未来如何，都能从容应对。让我们开始吧。令人遗憾的是，“创业”和“商业”这两个词如今已沦为贬义词，并被赋予了不成熟的含义。一提到它们，大多数人便会关闭自己的思维，任由根深蒂固的观念摆布；这些观念他们从未质疑过。例如，他们认为创业只适合有天赋或特殊人群；他们认为商业很复杂，需要大量前期资金，或者是一个充斥着不道德行为的行业。正因如此，我们必须重新定义创业。雇员和创业者的区别在于自主性和独立性。在此语境下，独立性高的人会自主设定目标并积极追求，无需他人许可。而独立性低的人则被赋予目标，并因为思维僵化而盲目追求，看不到其他可能性。真正的独立性只有在你把所有问题都归咎于自己，即使并非你的过错时，才能培养出来。年轻的时候，我们几乎无法掌控自己的人生目标。如果我们没有既能独立思考又了解人性运作的父母，我们就会屈从于主流观念。在这种情况下，主流观念就是上学、找工作，然后在某个年纪退休，最终得到的却远低于预期。大多数孩子每天都被安排在政府培训的专家面前，花几个小时吸收各种信息，其唯一目的就是成为一名有用的劳动者。这一点毋庸置疑。学校系统服务于它的创建者：国家。而你服务国家的方式就是成为一名有用的劳动者，按时纳税，并像以往一样遵守规则。当然，这并非全然是坏事。在很多情况下，这是必要的。基于兴趣的自学是一条自由的道路，但如果不加以重视，像语法、写作以及学校教授的其他实用技能就可能被忽略。许多优秀的劳动者可以过上精彩的生活，但我说的不是他们，而是过去的自己。那个知道自己注定要成就一番事业，无法忍受平庸生活的自己。", "你不可能对未曾亲身经历过的事物形成准确的判断。商业和创业亦是如此。如果你封闭自己，拒绝创造属于自己的事业，也就等于封闭了自己，拒绝发现自己的使命。你把自己封闭起来，无法创造出能从中获得幸福的工作。我认为按部就班的常规路径——比如上学和工作——只是垫脚石。它们有助于技能习得、提升社会地位，以及接触可能塑造你未来的人脉、思想或兴趣。但我对它们的担忧在于，它们会滋生自满情绪，对你的心理健康有害。它们违背了你渴望不确定性、挑战和持续进步的本性，而这种本性正是你蓬勃发展的动力。人们攀登摆在面前的阶梯，是因为他们的内心渴望挑战。这固然令人满足，但你只能攀登到一定高度。除非你迈出开辟自己道路的第一步，否则挑战将不复存在。人们天生就知道挑战能让生活更有趣，所以他们会不断追求更多，但一旦达到极限，他们就开始用“我只是喜欢工作的稳定性”之类的理由来为自己新获得的安逸辩解。就在那时，你的使命感消失了。你扼杀了迎接全新挑战的可能性。这很危险。如果没有一个具有挑战性、自我设定的目标，能够拓展你在工作这样重要且影响人生的领域中的思维，你的自我发展将会大幅放缓，影响力也会大打折扣，因为你生活的其他领域只能在你通过工作为他人做出贡献的能力范围内才能取得进步。对大多数人来说，工作占据了他们生命的三分之一。如果这巨大的时间都耗费在停滞、稳定和舒适之中——同时还要考虑到你的工作对你生活的方方面面都产生了多么深远的影响——那么你最终陷入混乱将不可避免，而且你将很难解决这个问题，因为你并非企业家。如果你因为从未追求更高目标而停滞不前，你就会失去目标、意义和满足感。这并非指达成一个最终目标，让你从此可以退休，因为那只是一种不切实际的幻想，只会让你内心空虚。这指的是爱上那些无穷无尽的问题，它们会拓展你的关注范围——从自身到他人，再到世界乃至宇宙——并丰富你的自我认知，让你能够感知并享受生活中的美好事物。每解决一个问题，你解锁下一个进化阶段的潜力就会增加。你的思维会拓展，你的身份认同会拓展，你的技能会拓展，从而帮助更多的人解决那些阻碍他们自身进化的问题。对于有长远眼光的人来说，创业是唯一合乎逻辑的选择。创业之路充满未知，如同披荆斩棘穿越危机四伏的丛林。你需要学习学校里学不到的技能。你需要坦然面对失败、拒绝和缓慢的进展。你需要从错误中吸取教训，明天再战，坚持不懈，直到最终获得成功。这并非反对工作或就业。而是要明白何时该让工作焕发活力，因为工作终究会失去新鲜感、发展空间以及其他一切让生活充满意义的要素。如果你曾疑惑，在完成学业之后，你那份孩童般的热情都去了哪里，现在你明白了。创业固然艰难，但永远做一名雇员则更加难熬。难的不是工作本身，而是思维方式。自我提升是通往创业之路的敲门砖，因为它教会你，帮助他人是提升自我的更高层次。“员工”和“创业者”并非头衔，而是一种心态。它们不是你扮演的角色，而是你本身。员工往往是被动的，被告知要学习什么、做什么。而创业者则是积极主动的个体，他们设定自己的愿景或采纳共同的愿景，凭借好奇心不断学习，创造解决生活难题的方案，并通过提供赋能的产品和服务来推动人类进步。作为一名创业者，问题并非预先设定。你必须保持不断前进的状态，让探索之路揭示答案。员工未必都是创业者，但创业者也可以是员工。因为创业是一种思维模式，所以即使身处职场，你依然可以培养自主意识。关键在于，作为不断成长的个体，你终究要沿着进化的轨迹前行，而当你感到自身价值已达极限时，就需要离开、改变或创造新的工作。你工作的演变直接反映了你愿景的构建。有时，这意味着你可能从事一份自己讨厌的工作，加入一家自己热爱的创业公司，或者从事一些创意十足的副业，只要它们能够助力你实现愿景即可。不要再把创业看作是遥不可及的目标，只有那些愿意长时间工作、将白日梦变成现实的人才能实现。创业的真谛在于通过创造问题的解决方案，完全掌控自己的收入、生活方式和命运。即使未来的工作前景看似不明朗，真正的创业精神——创造性地适应任何问题或机遇——也永远不会过时，因为问题永远不会消失。未来充满了我们甚至无法想象的挑战。这应该让我们感到自由。如果你不想长时间工作，那就解决优先级排序的问题。如果你喜欢工作的“稳定性”，那就解决自我管理的问题。如果你不喜欢自己的外貌，那就解决形象或健康方面的问题。如果你不喜欢目前的心境，那就创造一种能够让你持续保持新状态的解决方案。这些目标的确很高远，但如果你能实现它们，你就能通过经验、地位和创造力来提升你的收入能力，因为它们会迫使你走出安逸的舒适圈。缺乏成就感的创业者并非真正的创业者。他们在工作中或许看起来像个创业者，但他们的思维方式却像个雇员。他们是某个隐形雇主的雇员——这是他们思维模式的遗留影响——这个雇主悄悄地在他们的脑海中植入了一个新的目标，从而影响了他们识别和解决真正问题的能力。如果创业者能够通过调整思维方式来意识到自身缺乏成就感，那么他们就能解决这个问题，因为他们现在已经意识到了这一点。开始将创业视为一种“他者发展”，它是自我发展之后合乎逻辑的下一步。要想变得有价值，你需要找到解决那些限制你潜能的问题的意义所在。要想靠这种价值谋生，你需要将解决方案分享给那些同样受困于此的人。创业是你为人类进化做出贡献、顺应自然、并以有意义的方式满足自身生存需求的方式。那些认为我们会生活在后生存时代的人是自欺欺人。秘诀在于培养一种对你的生活影响深远的技能和思维模式，让你忍不住想要与他人分享。你解决自己的问题，分享改变你人生的解决方案，从而造福人类。在我看来，这就是创业精神的定义。创业是自我的延伸。它是你价值的传播。它是你与更伟大事物之间的连接。它是你探索未知的航船。它是你抵御干扰的过滤器。它是你免于被取代的保护屏障。创造、给予和生存是你的天性。你的祖先是企业家，但他们无需任何标签就能从事他们与生俱来的事业。他们每个人都在各自的部落、社群和文化中扮演着赋予他们意义的角色。即使我们今天所知的金钱并不存在，他们仍然通过创造价值并将其传播以换取其他形式的价值或利润，从而创造了有意义的生活。就业并非我们的自然状态。人的本能驱使我们去狩猎，但如今，身体上的威胁已不再是问题。当今世界真正的威胁来自心理和精神层面，是一场心理博弈。我们生来就是为了生存，但问题不再是如何生存；问题在于我们如何超越生存本能，并将之融入生活，从而赋予生命意义。这正是本书的目标。没有人想当格子间里的猴子。我相信，每个人内心深处都渴望成就一番更大的事业。但你越是压抑这种渴望，就越是困于已知，难以有所发现。你会感到厌倦、沮丧，觉得人生毫无意义，因为你所能获得的新鲜感都来自肤浅的事物。你从未冒险，从未探索未知，从未发现新的知识、工具和潜能，这些才能真正触动你内心深处的意义。", {"h": "货币的不可忽视性"}, "阻碍个人成长的最快方法就是妖魔化金钱，也就是把金钱看作它原本不是的东西。这很难做到，因为很多人没有意识到他们对金钱的认知是社会制约的结果，但我们稍后再谈。现在，我们需要先定义金钱是什么，为什么它掌控着这么多人的生活，以及我们现在和未来应该如何看待金钱——未来金钱的形式可能会截然不同。货币可分解为流通货币和资本。流通货币是交换媒介，资本是价值储存手段。由于本书并非探讨投资或理财，我们将重点讨论作为流通货币的货币，因为我们通常使用的美元作为价值储存手段并不理想。从这个意义上讲，货币是介于个人与商品或服务之间的一种中性价值衡量标准。当货币进入个人手中时，其价值感知会根据所交换的商品或服务而增加或减少。你如何看待某件事物的价值，取决于你所面临的问题和目标。如果你在人际关系中遇到困难，并且渴望结婚，那么你就会觉得小众的约会服务、得体的服装和精心挑选的花束都很有价值。而已经结婚或对恋爱关系不感兴趣的人，可能就不愿意在这些东西上花钱。另一方面，寺院里的僧侣和游艇上的商人有着不同的需求，这决定了他们愿意购买什么。由此可见，随着你人生各个领域的发展，你所面临的问题，以及你对价值和金钱的认知，都会随之改变。当人们在财务或心理方面发展滞后时，一切都会开始出错。人们往往将自身的信念和不安全感投射到金钱上，以此逃避责任，而不是去解决导致自身功能失调的根本问题——而这些问题或许可以通过金钱得到改善。他们却浑然不知，这些信念和不安全感并非不可改变——问题是可以解决的——而且它们很可能是从父母、老师乃至整个社会传承下来的。大多数不加批判地妖魔化金钱的人，往往无法掌控自己的思想。这些人正是那些鄙视大型企业领导者的人。他们绞尽脑汁地回避一个事实：这些领导者之所以能取得今天的成就，是因为他们提供的商品或服务至少为人类带来了某种价值。诚然，其中一些价值是人为创造的，但并非全部。仅此一点就足以证明，金钱可以用于有意义的事情，也可以从中产生价值。这些人还声称支持独立创作者，但一旦创作者试图靠自己的作品谋生，他们就会立刻翻脸不认人。曾经支持他们的朋友或追随者，转眼间就变成了怒火中烧、不达目的誓不罢休的家伙。他们希望个人和企业提供免费的产品或服务，仅仅依靠慈善捐款来维持生计。他们似乎认为，他们所鄙视的他人拥有的力量，恰恰反映了他们自身的匮乏。那些白嫖的人不明白，免费的东西往往不被认真对待。价值是一种感知，如果某样东西不值得付出一点努力，那它可能对你的生活没什么用处，你只是想免费获得它，追求短暂的快感。人们付费后会更加重视，因为他们认为那东西很重要，更有可能用它来解决生活中的问题。如果价值在于转化，而免费产品被视为普通商品，那么那些在财务领域心理发展不足的人，就会不断地抗拒任何形式的进步。更可笑的是，这群人都在为自己工作的雇主推销产品或服务。或者，他们把钱花在毫无意义的享乐上——通常是大公司炮制出来的——而不是花在能提升生活品质、能与自己产生共鸣的人身上，这样一来，无论短期还是长期，都会让他们付出更多。如果你不创造产品来销售，你就会被迫为别人销售产品，或者你最终会成为别人的产品。如果你不自觉地将金钱投入到你想要的世界，你就会不知不觉地花钱来填补内心的空虚。更甚者，那些厌恶金钱的人还在散播“销售是坏事”的观念。他们说销售是一种操纵手段，然而他们自己却虚伪地用这种手段逃避现实，不愿承认自己的生活受金钱支配。当成熟的人运用销售、营销和说服技巧来教育、激励、吸引和改变他人时，这些技巧就不是操纵手段了。事实是：金钱往往是阻碍人们提升个人发展水平的绊脚石。它几乎左右着人们的每一个行动，即使是最成熟的人也不例外，因为金钱与现代社会的生存息息相关。由于生存意识是一种被动反应和自我中心的状态，金钱既可以被视为一种失控的支配者，也可以被视为一种工具，帮助你提升意识，从而更加关爱身边的人。金钱的不可忽视性是真实存在的。你为什么每天工作八小时，持续四十五年？为了支付账单，养家糊口。你为什么遁入山林，过着僧侣般的生活？为了追求个人成长，暂时抛开金钱，但你往往忽略了灵性修行并非与世隔绝，而是为世界做出贡献。你为什么注重健康饮食，保持身材？当然是为了健康，但还有更深层次的原因。你想提升自身价值，从而吸引更好的机会，发展事业，赚取更多财富。即便你的主要目的并非赚钱，赚钱也几乎总是次要原因，因为生存并非我们摆脱的东西，而是我们融入其中的必需品。一个人的行为背后绝非只有一个原因。一旦你意识到这一点，你也会明白，那些你认为“只是为了钱”的人，其实并非真的只是为了钱。你为什么读这本书？当然是为了获得新的视角，但它也会帮助你突破赚钱潜力的限制。你几乎做的每一件事都与金钱息息相关。认为这不好是自欺欺人。就像电子游戏中的技能树一样，你需要金钱来解锁新的路径。想要拥有健康的身体，你需要金钱。想要拥有美满的人际关系，你需要解决那个破坏大多数人际关系的难题……金钱。想要享受生活，你需要朝着有意义的目标前进，并将沿途获得的价值分享出去。你需要创造。创造需要资源。资源需要金钱。请注意，我并不是说你需要数百万美元才能过上好日子；我的意思是，你现在就需要钱。对大多数人来说，“足够”并不意味着“很多”，但钱是如何赚来的也是一个需要考虑的因素。人们普遍认为，一旦年收入达到几百万美元，更多的钱并不会让你的生活变得更好。你可以做大多数富人能做的事情，而且你已经拥有和富人一样的手机和科技产品。但我对此表示怀疑。这感觉就像是肤浅的半真半假。这个世界不需要更多像幸运饼干里的箴言那样，阻碍人们在财务领域提升自我的建议。大多数人还没达到那个水平，而超越那个水平的人更是寥寥无几。你当然不需要几百万美元，但金钱不仅仅是用来购买物质来充实你的生活。那样做未免太浪费了。金钱是让你继续追求新鲜感和挑战性生活的绝佳工具。你知道，毕业后，当你熟悉了工作，这种感觉就会消失。这并非因为金钱能让你购买物质，也并非因为金钱能直接买到幸福，而是因为它能让你获得解决更具挑战性问题的资源，毕竟时间和精力终究有限。此外，通过解决这些问题，你还有机会将新颖的解决方案传承下去。这两点对于获得深度幸福都至关重要。当你忽略对金钱的需要（而非欲望）时，你便限制了自身心智、身体和精神的发展。如果你生活在永无止境的责任重压之下，并试图用金钱来解决这些问题，你就无法领悟生命的真谛。只有那些缺乏自主意识的人才会将此视为一种压迫。而到了那种地步，金钱反而成了你最不关心的事情。这就是我强调创业之路的原因。如果你不创办一家提供信息、教育、商品、服务或其他能造福人类的企业，那么不道德的人就会不费吹灰之力地爬到顶峰。你忽视了自身与生俱来的创业和行动力，实际上是在间接地助长邪恶。如果你一味妖魔化金钱和企业——而这些恰恰是文明的命脉——那么你最终只会从事那些在你看来极有可能不道德的工作，而你的雇主很可能也是不道德的。你不会因为那些错误的假设和根深蒂固的观念——认为赚钱是不道德的——而去创业，但你却在为一家让民众生病、助长世界各地轰炸、并将员工束缚在机械重复的工作中，让他们不敢发挥自身潜能的企业工作。即便你并非直接为这家企业工作，你也极有可能通过人脉关系与他们有所关联，而你所做的工作也正是他们得以生存的保障。反抗你所鄙视的以金钱为中心的文化，最好的方式莫过于有目的地创造更多财富。是不是很讽刺？如果人类的实力取决于其最薄弱的环节，而大多数人仍然饱受同样的问题困扰，真正的教育在于使个人能够解决自身问题（而非提供普遍的暂时性缓解），而问题恰恰阻碍了个人向集体的进化，如果教育体系的重点在于培养人们成为对自身有利的劳动者（因为你无需为这个教育体系买单），最后，如果人类的命运取决于有意识的领导者去教育、激励和吸引人才，那么，科技赋能的变革，使每个人都能在全球范围内创造价值，便是摆脱困境的一条切实可行的途径。我们稍后会对此进行深入探讨。选择无所作为，就等于接受了既定的命运，任由那些意识和智慧不如你的人获得比你更多的关注、影响力以及财富。要想让人们不再关注某件事，唯一的办法就是给他们提供更有吸引力的事物。我这么问是为了提供一个更全面的视角，并非意在引发争论：如果你憎恨金钱，难道你不憎恨你的生活吗？你周围的一切，从你手中的手机到你行驶的道路，从你坐的办公桌到维持你生命的食物，都是商业运作的产物，而这些商业运作是为了通过对文明进步的贡献来牟利。你正身处一个由金钱驱动的世界，而这种驱动力源于生存和地位。这个体系显然存在缺陷，但构建一个潜在的解决方案几乎总是比投下微不足道的一票要好得多。现在，我们来谈谈另一个显而易见却又难以启齿的问题：劳动价值论。这种理论认为，只要努力工作就能赚很多钱。但事实是，你可以为任何事情付出努力，但这并不意味着努力就一定有用。你可以花四年时间获得学位，可以花十年时间在职场上步步高升，可以倾注数千小时的心血写一本书。然而，你最终得到的报酬可能远低于你的预期，因为工作时长并不能保证有人会重视你的付出。所以，与其掌握自己的未来，人们更倾向于抱怨和发牢骚。“我应该得到更高的薪水！我辛辛苦苦工作了十四年，就这点儿报酬？我几乎没有时间陪伴家人，连休假都负担不起。我像条死鱼一样拼命工作，却看不到任何希望。”那些抱怨的人忽略了一个关键因素。人们会投资自己关心、重视或认为对生活有用的事物。如果你的工作不能给别人带来任何好处，没有人会主动给你钱。劳动价值论认为，你应该获得与你的劳动量相匹配的报酬。这会让你感觉自己付出了巨大的努力，感觉自己像地球上的其他人一样，辛勤工作后理应得到回报。但现实并非如此。你的收入与你的价值直接相关：你解决的问题的复杂程度、你创造的解决方案所带来的成果，以及你激励和说服人们了解并关注你的成果的能力。如果你对自己的收入不满意，或许应该认真审视一下自己对世界的贡献。根据工作量来支付报酬并不合理，尤其是在未来工作效率更高、价值更低、所需资源更少的情况下。然而，根据解决问题的难度来支付报酬却很有意义，因为问题会随着工作的演变而不断变化。无论科技如何发展，问题依然会层出不穷。如果快乐源于取得进步的成就感、与超越自身的事物建立联系，以及从这两方面获得有意义的反馈，那么有意识的创业精神就是你维持和掌控生活乐趣的方式。当你充实自己时，你的能量就会开始溢出，你自然而然的愿望也会转变为帮助他人。人类创造了一种以金钱为基础的生存方式，以此来提升和超越生存本身，并以此交换价值，激发人们创造新工具和技术的欲望。如果没有金钱，你今天所拥有的奢侈品也将不复存在。金钱的历史可以追溯到四万年前，但用珠子和贝壳进行交易已经行不通了。为什么？因为我们不再生活在小部落里。没有人会用一百万个贝壳去换一辆汽车——汽车能让你做很多过去无法想象的事情。更进一步说，慈善捐款也无法带你登上月球。而美元则不同，收款人可以用它去交换他们认为有价值的东西。有一件事我们可以肯定：未来的货币将比今天更加数字化。货币将超越美元，就像它已经超越了贝壳一样。我们使用货币的方式也将随之改变。人工智能的发展速度远超我们的想象，当生活成本接近于零时，谁也无法预料货币的最终用途会是什么。货币可能以关注或地位的形式出现。我们所熟知的货币可能会变得毫无意义。但这并不能改变这样一个事实：创业、解决问题和创造价值是值得追求的道路之一，甚至可能是唯一值得追求的道路。如果我们相信人性（而我们也应该相信），那么货币很可能在这些努力中继续扮演至关重要的角色。", {"h": "深度通才"}, "从火到火箭，人类是创造者。我们天生就是通才，注定要精通诸多领域。正是我们制造了工具，让我们得以生存，并克服严酷的环境——而这些环境却将动物束缚在原地。我们原本不应该成为工具，但如今我们却身处其中。难怪人们如此惧怕被取代，因为他们并非取代者。当工具不再需要时，它便失去了存在的意义。当工具成本降低、全天候运转且无需承受压力时，它便会成为一台盈利机器，但这台机器的盈利对象仅限于那些拥有远见、行动力和知识，能够以这种方式运用它的人。问题根源在于我们的教育体系。19世纪，美国正处于工业化时期，需要教育大量移民子女。像霍勒斯·曼这样的教育家前往普鲁士学习当地的教育方法。普鲁士的教育体系旨在培养服从命令的士兵、顺从的公民、公务员和守规矩的工人。它通过强制出勤、教师培训、全国统一的课程和学生考试、按年龄分班以及年级制度来实现这一目标。学生被教导如何工作，而不是如何思考。曼和其他人被其高效和标准化的教育模式所折服，并将这些方法引入美国学校，尤其是在马萨诸塞州，马萨诸塞州后来成为其他州的典范。", "既然这套体系并非你一手创建，它自然也无法为你的利益服务。既然你没有为这套体系提供资金，你自然也无法掌控教学内容。相反，你只能被迫面对由政府培训的专家，而这些专家本身也是由政府培训的专家培养的。你被告知要读这个，背那个，如果你做不到，就会收到一封信，你把信带回家给父母，他们会责骂你——这就是这套体系的负面反馈——责怪你没有读这个，没有背那个。更令人痛心的是，这种标准化的教育必然会对后20%的学生造成不公。你无法快速发展，因为你必须学习和那些天赋不如你的人一样的内容，以同样的速度学习。那些天赋较差的人几乎注定要接受命运的安排，因为根本没有空间让他们运用创造性的方法来提升学习效果。", "如果你了解大脑的运作方式，你就会明白这对你的发展有多么危险。如果你缺乏自主性，你可能很难主动弥补这种伤害，因为你的潜意识里已经根深蒂固地存在着扮演过去境遇受害者的倾向。你的大脑会自动接受或拒绝那些有助于它实现其认为重要目标的信息。如果你只学习那些符合你首要目标的信息，而这个目标又是为了获得地位和保障而获得高薪学位，那么当你离开这个体系时，你和草原上的狮子或阿拉斯加的北极熊并无二致。如果把两者互换，它们都无法生存，因为它们都是特定领域的专家。", "这并非教育。教育是探索。教育是勇往直前，探索未知，让兴趣指引方向，收集点滴，将它们串联起来，并与世界分享，因为教师比学生学到得更多。人类的奇妙之处在于，我们能够创造并运用各种工具，帮助我们适应不同的环境和境况。我们可以借助厚厚的冬衣抵御严寒，也可以借助阴凉处、过滤后的饮用水，以及必要时掌握的专业知识，在炎热的天气里生存下来。", "如果你不选择自己的目标，你就无法选择学习什么或解决什么问题。你的命运被他人决定，因为你唯一拥有的潜能就是被赋予的。无论这是有意还是无意，这都是一个显而易见的事实：学校的建立是为了奴役最聪明的头脑，通过承诺专业化的声望，使他们思想狭隘，无法推翻真正的统治者。一位皇家史官——或者过去受过良好教育的雇员——或许会被国家视为聪明且有价值的人，但海盗——或者过去那些具有强大影响力的企业家——却精通地理、天文导航、船员管理、船只本身、经济学、历史和科学等诸多领域，因为这些都是在贸易中取得成功所必需的工具。统治者固然强大，但他们的权力仅仅取决于海盗允许他们以他们设定的价格获得的资源。", "更进一步来说，如果我们审视罗马文明，奴隶终其一生都被训练去做同一件事。他们是主人的工具。而拥有自主权的人则被期望追求自身利益，一生中从事多种职业。他们被期望开辟自己的道路，并获取维持自身发展所需的资源。衡量你是否走在正确道路上的一个好方法是，你的工作是否至少每年都会有所变化。你会不断进步。你的兴趣也会不断变化。你会在解决旧问题后发现新的问题。你会坚持不懈，不断迭代。不要让自己陷入机械、可替代的令人沮丧的工作状态。", "这一切都说明，你的未来取决于你的教育。虽然我无法告诉你具体应该学什么，但我相信我可以为你指明正确的方向。每个人都在担心二十年后哪些技能会有用。这并非什么新鲜事。几百年来，我们一直在问这个问题。坦白说，这是一个质量不高的问题，因为它早已有了答案。", "在求学过程中，我们常常会问自己：“为了拥有最好的未来，我应该学什么？” 但最终，没有人能完全如愿以偿。大多数情况下，他们会选择最舒适的机会，并默默接受随之而来的牺牲。", "在人生旅途中，我们时常关注未来走向，却从未真正付诸行动。新闻中充斥着末日预言，我们对此习以为常。数百年来，我们一直在思考最佳路径何在，却始终无人能给出确切答案，因为答案并非他人所能告知。", "消除忧虑的秘诀在于最终承担起自己未来的责任。要具备韧性、乐于学习、开放包容、敏锐洞察力、创造力、适应能力，以及其他所有区分囚徒与自由人的特质。", "任何教学的第一课都应该是质疑所学内容。真正的教育，而非我们称之为公立学校的克隆生产机器，是一种关于如何生活、如何思考以及如何学习的指导。真正的教育不仅仅教授通过完成一系列特定任务来获得成果的职业技能，它还教我们如何释放和控制熵增，如何与熵增共舞，如何成为真正的人。它教你如何探索无限的未知，如何挑战自身能力的极限，如何运用创造性的思维将不安转化为安全感。这才是通往有意义人生的道路。", "当你需要依赖他人时，你无法保持真诚。你担心二十年后哪些职业技能会过时，因为你的成功依赖于所有人，唯独不依赖于自己。收入最高的人是那些有远见卓识、善于战略和勇于创新的人。你可以努力工作，也可以聪明地工作，但你永远无法超越那些以自然为师、为未来愿景而奋斗的人。", "如果你想对自己的未来有一定的掌控感，你需要具备在任何环境下都能取得成功的特质。你需要培养自律能力：", "自我实验——如何通过反复试验解决复杂问题并得出自己的结论。", "自我意识——如何理解自己思想的动机，从而理解他人的动机。", "自我发展——培养一种有价值的思维方式和技能，可以帮助他人突破自身局限。", "自立自强——如何通过对人生结果负责来获得你想要的东西。", "自学——收集、理解和利用未知主题信息的能力。", "自给自足——指维持理想生活方式并获取实现理想生活方式所需资源的能力。", "自我掌控——对驾驭现实过程的坚定不移的奉献精神。", "当你了解自己，你就能了解世界，并能运用你积累的价值去获得你想要的回报。最初，自私其实是无私的。如果你一无所有，唯一的选择就是索取。地球上的每个人都必须实现自我，才能以最佳方式为人类做出贡献。如果说创业是为了解决问题，而自我实现是为了解决自身的问题，那么你可以将两者结合起来，创造一种有意义的生活方式。解放自己，然后解放他人。两者可以齐头并进。", {"h": "目的层次"}, "任何对人生意义的认真思考都必须从“我应该成为什么样的人？”这个问题开始。当然，这个问题还包含更多内容，例如“我为何在此？”以及“这一切为何重要？”。毕达哥拉斯学派将世界视为一个整体（Kosmos）。我们通常将其翻译为“宇宙”，但其希腊原文的含义是指将宇宙描述为一个有序和谐的系统。这与我们今天所理解的还原论的、纯粹的物质宇宙截然相反。区别在于，前者将世界视为一个整体，其大小大于部分之和，并尊重各个部分；而后者则将世界仅仅视为各个部分的集合。", "在古希腊人看来，宇宙并非由原子或物质构成，而是由这些“整体”组成。万物本身既是一个整体，也是某种更宏大存在的一部分。每个部分都为宇宙的和谐贡献着自己的力量。我们必须明白，世界的确包含着我们称之为原子和物质的东西，虽然这对某些科学领域很有用，但当我们思考存在的意义和我们必须做什么时，它常常让我们迷失在茫茫的冬日风暴中。", "为了调和这个问题，阿瑟·柯斯特勒创造了“全息”（holon）一词，它由希腊语“holos”（意为“整体”）和后缀“-on”（表示粒子或部分，例如质子或中子）组合而成。换句话说，就是整体与部分。原子既是整体，又是分子的一部分。分子既是整体，又是细胞的一部分。细胞既是整体，又是器官的一部分。这种自然的——不要与支配者混淆的——层级结构，或者说“全息层级”，向上、向下、向左、向右延伸。从器官到生物体，再到生态系统。从字母到单词，再到句子，再到段落，而单词又可以构成歌词的一部分。一个段落可以讨论火，而另一个段落可以讨论水。水蒸发，凝结成遮荫的云，落入滋养生命的溪流，最终又回归海洋。宇宙可以被视为一个宇宙：一首美丽且不断演化的歌曲。", "这种普遍秩序不仅能提升你的思维能力和问题解决能力，更指向一个更为深刻的层面：现实由一条庞大的认知与存在之链构成，从物质到身体，再到心灵，最终到达精神。它还指向不同的发展层次，例如自我中心、民族中心、世界中心、行星中心和宇宙中心。个人、文化和社会都会经历这些发展层次。这些宏观层次展现了他们关注的领域：关爱自身、族群、他人、其他生命以及现实本身。换句话说，你正在提升自身的关爱能力。人类在关爱他人中获得满足感，就像你可能更擅长照顾你的狗而不是照顾自己一样。你越能关爱他人——通过逐步承担更多责任或通过情感训练——你获得的满足感就越强。从这个意义上讲，金钱并非唯一的利润形式。人们可以将毕生精力投入到这些发展阶段，从而最大限度地发挥自身潜能，为人类做出贡献。需要注意的是，你无法摆脱较低的发展层次。你不会为了照顾动物而放弃对家人的照顾。你应该将前者融入后者之中。", "其他哲学家，例如艾伦·瓦茨，则将世界视为一个有机体，一个由各种关系维系的运转生态系统。亚里士多德认为，事物的最终原因是其功能，对任何事物的完整解释都必须考虑其最终原因。这就引出了目的论和控制论领域。", "目的论（telos意为目标，logos意为理性）是指通过提及事物的目的、终点或目标来解释事物。控制论研究系统如何自我调节和自我组织，最终达成系统的目标。它源于希腊语kybernetikos，意为“掌舵”或“善于掌舵”。这类似于我们将在后续章节讨论的自然罗盘概念：朝着目标行动，感知自身所处位置，与目标进行比较，并像一艘偏离航线的船一样，朝着正确的方向前进。这是一个反复试验的过程。如果说宇宙展现了总体秩序，那么控制论则阐明了如何一步步走向更宏大的目标。", "我阐述这些概念的目的是为了提供一个非教条的最高层次的视角，你可以以此为人生方向。一个方向，一个目标。宇宙论、目的论和控制论都可以整合为一个高屋建瓴、整体性的视角，从而指导你的决策，并发现你存在的意义。你是否信仰上帝并不重要。你可以直接观察和体验这个宏伟和谐系统的属性。", "现在正是区分纵向发展和横向发展的好时机。在每个宏观层面上，个人都可以通过知识和技能的习得（横向发展）来提升自身能力。经过一定的时间和努力，进入新的层面往往能开拓视野，带来新的视角。通过这种方式，他们可以观察之前的层面，整合其中的诸多方面，并超越到一种更全面的意识状态。问题在于，人们可能会（而且常常确实会）被困在某个特定的层面，导致精神熵增，并产生大量无法在更高层次的思维模式下解决的问题。很多时候，人们会经历一段痛苦的时期，直到他们对停滞不前感到厌倦。这时，他们的思维才能“切换开关”，突破到下一个层面。为了更好地理解这一点，我们必须理解问题的本质。", {"h": "问题是通往成功之路"}, "你的成功程度取决于你不断拓展自我，而问题正是你拓展自我的瓶颈。也就是说，问题限制了你的潜能。当你解决问题、突破限制时，你会变得更加成熟、技能更强、知识更渊博、更加开放，也更贴近现实。你解决的每一个问题，都会降低你对生活难度的感知，提升你的人生目标感。", "问题会让你把注意力局限在问题本身的边界之内。这为什么重要呢？首先，你可能难以看清生活的本来面目。其次，你似乎找不到自己的热情所在或兴趣所在。你苦苦寻找真正想要迎接的挑战。于是，你不断地在问题所构成的狭小认知空间里寻找，开始感到自己被困住了，或者觉得除了眼前所见之外，别无他物。", "如果你满脑子都是镜子里的自己、每天的疲惫、单身、堆积如山的账单以及你根本不想去上班的事情，那么你的生活为何如此糟糕也就不足为奇了。人们会劝你接受现状，从中寻找快乐，这当然是个好主意，但这只是权宜之计，无法治愈你内心深处那个渴望发掘自身潜能的声音。", "人类在解决问题的过程中获得快乐。换句话说，我们从自己选择为之奋斗的目标中获得快乐。我们的思维会聚焦于挑战本身。我们会发现成长的空间。我们会制定计划、自我学习，并掌握能够增强我们思维和自我能力的技能。我们将进步视为反馈，并逐渐领悟到满足的真谛。", "只有当你跳出问题本身的局限，放眼全局，才能真正解决问题。你需要停下来，跳出问题的局限，以更高的视角审视它。从这个角度出发，你可以设定一个与问题相对应的目标，收集各种想法形成理论，并尝试各种可能的解决方案，直到问题最终得到解决。一旦问题得到解决，你就确立了一个新的目标层次。", "根据我的经验，我总结出了四个宏观层面的目标。它们就像你成长过程中的重要里程碑，适用于你生活的各个领域以及你的整体人生。我所说的生活领域包括你的工作、人际关系、财务状况、健康、精力以及幸福感等等。本书将以金钱为例进行说明。", "秉持这种理念，这些阶段之间并无优劣之分，它们仅仅是发展阶段，旨在帮助你识别自身所处的阶段。我们可以将每个阶段存在的问题理解为：无私程度的提升和自私程度的降低。也就是说，你一开始难免会有些自私。随着自身发展，金钱的意义也会随之改变。你的意义塑造了你对事物的认知。在思考如何解决诸如灵性和意义等更深层次的问题之前，你需要先解决诸如健康、金钱和自信等表面问题。事实上，灵性和意义本身就蕴藏在解决问题的过程中。", {"h": "1.生存"}, "对大多数人来说，生存层面的目标是人生的起点。在这个阶段，你还没有开始追求自己的人生道路。你所知道的只是被赋予的目标，以及这种世界观让你注意到和学到的东西。你只是在做别人告诉你该做的事，为了生存。你对社会默认的生活方式视而不见，而这种生活方式正慢慢地将你束缚在一个狭隘的思维模式中。", "你满脑子想的都是要付的账单、和伴侣的争吵、以及你不想去上班的工作。你一遍又一遍地重复着同样的生活。你的思绪被困在可预见的未来和熟悉的过去。你醒来，想到今天即将面临的压力——这些压力昨天也发生过——然后忍受着它们，上床睡觉，第二天又重复这个过程。", "你认为赚钱很难。你觉得赚钱靠运气，而“运气”这个词通常用来形容对某个系统缺乏了解。你不把金钱看作像健身、心理健康或人际关系那样可以掌控的领域。你可能认为金钱是邪恶的，这限制了你赚钱的能力，让你深陷困境。你认为自己在这个领域赚不到很多钱，或者只是还没找到一个适合自己发展的领域。你出于各种原因对创业不感兴趣，但这些原因往往源于你未能发现自身固有的思维模式。在生存模式下，你看不到自己更高的潜力，也无法意识到，在某种程度上，创业是实现这一潜力的必要途径。", "从生存走向卓越，第一步是深刻觉察那些阻碍你前进的信念，以及它们若不加以控制，会在你的生活中引发怎样的连锁破坏。第二步是将注意力从问题转移到解决方案。从某种意义上说，你必须对自己和自身处境感到无比厌恶，以至于你别无选择，只能将这种负能量转化为积极行动。", "从你现在所处的位置开始。专注于解决那些摆在你面前的问题：金钱问题、精力问题、健康问题、人际关系问题。让自己沉浸在能够改变你思维模式的环境中，接受相关的教育。抽出时间来提升你自身的价值。学习与你目前工作或职业技能互补的技能。尝试一些副业。让自己积累丰富的经验，直到你能够赚到足够的钱，不再仅仅满足于生存。", {"h": "2.状态"}, "在社会上，只有那些拥有权力和影响力的人才能获得成功，而且至今依然如此。那些为目标付出努力的人变得有价值，他们建立事业，强健体魄，提升心智，从而增强创造财富的能力——也就是创造力。纵观历史，从来没有哪个时期弱者、平庸者或愚钝者能摆脱被当作牲畜对待的命运。现在，请听我继续说下去。如果我的语气听起来傲慢，那或许是我的确如此，但故事远不止于此。", "你所敬仰的古今导师，比如释迦牟尼佛、耶稣基督、柏拉图、克里希那，或者其他任何你高度重视的有影响力的人物，都拥有极高的地位和影响力。否则，他们的教诲就不会吸引你的注意，说服你改变思想和行为，并流传数千年之久。但关键在于，他们没有营销预算，他们只有教诲本身，他们毕生致力于传播的理念。这才是他们力量的源泉。我的意思是，你之所以认为地位不好，仅仅是因为你脑海中根深蒂固的观念，而这些观念是由那些从未质疑过自身假设的人灌输的。或者，你对权力的理解只是片面的，你倾向于往坏处想。", "有些人天生就会变得平庸甚至软弱，就像世间也有弱小的星辰和植物一样，但强者有义务承担起责任的重担。一旦你达到贡献的层次，你就会意识到，你存在的唯一意义就在于此：解决更宏大、更有意义的问题，从而提升人类的生存目标。但你只有获得某种形式的力量和影响力才能做到这一点。只有当你创造出能够改善人们生活的艺术、产品或服务之后，只有当你拥有与你为人处世的品格相符的体魄之后，只有当你拥有能够运用说服力而非武力或欺骗来驾驭力量的思维之后，你才能做到这一点。", "这就是当今教师和导师们的一个问题。他们在精神或冥想领域造诣颇深，但他们往往体弱多病或超重，而且明显带有性别歧视或种族歧视的倾向。人们将这些平凡人奉为神明，因为他们拥有罕见的修行，并出于盲目的无知而盲目地接受他们的信仰。他们拒绝金钱、食物和性等物质世界，因为这种拒绝源于轴心时期兴起的纯粹上升哲学。他们未能整合下降的层面。他们出于对地位的渴望，认同了他们所谓的“纯粹”，并用灵性的外衣掩盖了这种渴望，从而失去了根基。随着世界的演进，他们仍然停留在对金钱和价值交换的肤浅认知上。他们没有意识到，冥想的发展实际上是独立于其他发展之外的，并且与审美、认知、情感、伦理、人际交往、数学、道德以及构成基本需求的那些发展同等重要。我并非想要贬低这些伟大的领袖。我试图展现他们的人性。你可以也应该向他们学习，但还有很多很多东西需要学习。", "当你对金钱感到安全时，你的目标就达到了一个新的层次。你拥有能够让你追求新职业或创业的技能。这份职业或事业能够让你支付账单，专注于生活的其他方面，并进行适度甚至奢侈的消费。", "很多人之所以深陷其中，是因为他们被困在了物质主义的思维模式中。你还没有找到自己的使命，所以没有超越自身的指引。你沉溺于肤浅，忽略了更深层次的东西。你更喜欢职位头衔，而不是享受解决问题的挑战；你喜欢名表，而不是欣赏品牌的理念和精湛工艺。这些本身并没有错，但如果你陷入这种狭隘的视角，情况很快就会变得糟糕。", "最大的陷阱就是试图跳过这个阶段。你试图跳过那些孕育灵性的经验和错误，直接进入灵性领域。你没有意识到，你正在把灵性本身当作一种身份象征。你常常利用它来博取关注，从他人对你的看法中获得权力。这就是为什么许多人踏上灵性之路的原因。他们看到一些拥有更高意识的人，钦佩他们，渴望成为他们那样的人，并开始模仿他们。这是一种身份游戏，这本身并没有错。你只需要意识到这一点，以免它对你的生活造成弊大于利的影响。", "我允许你通过权力去追求被认可的渴望。开始训练，让自己看起来光鲜亮丽，即便在别人看来这很虚荣。开始创业赚钱，因为这是掌控你创造什么、为谁创造以及它对世界影响的唯一途径。你现在或许不在乎这些，但随着你满足了对地位的需求，你的思维会逐渐开阔，注意到以前从未注意到的事物。", "灵性存在于体验之中。它存在于你创造属于自己的道路的故事里。它存在于追求目标和解决问题的起伏跌宕之中。它存在于纠正你犯下的错误并学习如何朝着更好的方向前进的过程中。灵性源于旅程，但只有拥有明确的目标，这段旅程才有可能实现。如果你找不到人生的意义，那是因为你还没有开始追求那些你一直压抑的目标，因为你被误导，认为它们是坏的。", {"h": "3.创造力"}, "一旦你达到一定的社会地位，你的思维方式就会开始转变。如果你不封闭自己的思想，你就会开始意识到自己犯下的所有错误。你甚至可能会想要否定你所拥有的一切。你将无法再从那些肤浅的追求中找到曾经的快乐。金钱会让人厌倦，汽车和名表也会让人厌倦。你所拥有的许多物质财富都会让人感到厌倦。", "但这并不意味着你之前所做的一切都是徒劳。你拥有丰富的经验，可以汲取并传承给那些需要的人。在创造力方面，你开始意识到自身的价值。你渴望摆脱外部依赖和任务的束缚。此时，你的重心必须转移到围绕几个关键领域培养一种哲学意义上的精通。", "对于健身爱好者来说，去健身房最初是为了让自己感觉良好。几年后，他们要么放弃，要么重新调整方向，追求更深层次的目标，让这段旅程更有意义。他们从健康饮食和运动中获得愉悦感。他们深刻理解自己的健康选择如何影响未来。他们从训练中取得的点滴进步中获得满足感。他们融入有限的生活，并爱上无限的可能。", "在地位阶段，你所学习和做的大部分事情都来自他人的教导。在创造阶段，你运用扩展后的知识，开始创造属于自己的做事方式。你尝试过不同的训练方法、商业模式和应对策略，最终领悟到它们之间的共通之处和原则。你解锁了一种独特的视角，使你能够优雅地驾驭不同领域的交汇。", "在创意阶段，你的任务就是创造。去尝试。摆脱你从他人那里沿袭下来的教条、意识形态和流程。从零开始构建全新的解决方案。尝试一切，看看哪些行得通。这可能需要一些时间，但正是在这个阶段，你会发现自己命中注定要做的事，即使它并不完全清晰。对自身全部潜能的模糊认知，将为你进入贡献阶段奠定良好的基础。", {"h": "4.贡献"}, "在某个时刻——我无法给出确切的时间——你会领悟到创造的后半部分：贡献。你会完成一个完整的循环，意识到艺术必须与商业融合，才能发挥其全部效力。你会渴望分享那些改善你生活的事物。你会以全新的视角看待生活，并疑惑为何其他人总是被琐事分心。你能看到他们的人生方向，而他们却看不到。", "在贡献阶段，你生活中的各个领域逐渐融合为一体。你不再把工作看作是打卡上下班的地方，不再把休息看作是工作结束后才能享受的犒劳，也不再把娱乐看作是晚上有空时才玩的半小时爱好。你把它们都视为彼此不可或缺的平衡。工作、休息和娱乐之间的界限变得模糊不清。", "休息成为你恢复工作创造力的方式。玩乐成为你工作的一部分。工作与生活如此紧密地融合在一起，以至于你所做的任何事情都能以远超金钱的方式带来十倍的回报。你的每一个举动都会在你走过的路上留下价值的印记。", "你的整个生活开始围绕着如何才能最好地为世界做出贡献而运转。你成为了现实的视角载体。真正的价值在于你所培养的思维方式，你能够以战略家或远见者的视角看待事物。你搜寻并收集信息，将其与你的经验相结合，并分享给那些渴望从中受益的人。你不再是一个寄生虫。你不再仅仅为了个人私利而消耗和索取现实，而是创造、分享并回馈世界。", "以上列出的四个目标层次仅仅是目标层次，它们是普遍的世界观，是你感知和把握机遇的视角。即使你处于生存阶段，也要明白你能够也应该为他人的生活做出贡献。即使你深陷于地位争夺之中，也要明白你随时都可以发挥创造力。", "生存、地位、创造力和贡献，这些标签仅仅概括了人们对生活的一般看法。话虽如此，的确存在一条可以更快地提升到这些层次的途径。这并非一条固定不变的道路，也不是任何人可以为你提供的（无论是在学校还是从导师那里获得的，这些都只是你可以尝试的方法）。", "最好的道路就是你自己开辟的道路。但要明白，还有一条通往最佳道路的“元”路径。这条路径由你生活中的主要领域构成：思想、身体、人际关系和工作。每个领域的健康和发展都至关重要。", "最需要特别关注的一点是“工作”。工作是人生的重要组成部分，它决定了你学习和从事的大部分内容，也决定了你把大部分时间花在什么地方。正因如此，它也决定了你的发展进程。所以，最好的道路是致力于发现并追求你的人生事业。", "你无法在工作中做到这一点，尽管工作可以成为通往目标的垫脚石。工作是那些尚未领悟人生真谛的人所推崇的“安全”和“稳妥”之路。它很快就会将你束缚在那些限制你思维、消耗你精力的责任之中。如果你忽视了人际关系以及身心健康，就无法有效地追求你的人生理想。", "如果你对工作充满热情，熬夜和不良习惯会影响你的创造力。如果你对工作不够认真，这些问题在你眼中不会成为问题，它们会一直存在，最终导致效率低下。当你的工作需要你发挥出最佳状态时，提升心智、身体素质和人际关系的路径就会清晰可见。你必须坚持下去，否则你的工作也会受到影响。", "答案依然是创业精神。创业精神贯穿所有思维层面。它能解决生存问题，提升社会地位，激发创造力，并最终做出贡献。创业精神要求你成为一名通才，而不是一个目光短浅的专家，后者会限制你的视野和发展，使你无法超越专业领域。创业精神要求你摆脱“饥饿的艺术创作”。你必须超越自私的欲望，去做那些别人认为毫无价值的琐碎工作。创业精神要求你意识到自身的影响。你肩负着重大的责任，决定着你的发展规模以及它如何影响意识的进化。", "你已经有了方向；现在你必须学会如何走下去。", {"h": "进步与知识"}, "你之所以没能到达你想去的地方，是因为你缺乏到达那里所需的知识。从广义上讲，正如大卫·多伊奇所说，一个人对美好生活的追求“是一个搜索问题，在一个过于庞大、无法穷尽的抽象思想空间中进行搜索”。当我们挣脱那些为了维持安全感而让我们习以为常的目标、系统和舒适区时，我们该如何探索这片广袤的思想空间，寻找能够赋予我们力量去实现梦想的新知识？我们该如何驾驭未知，朝着正确的方向前进，从而在个人生活和社会中取得进步？我们该如何追求人生目标？我们稍后会探讨这些问题，但在此之前，我们需要先打好基础，以便你更好地理解。", "现在正是提出这个显而易见却又难以启齿的问题——人工智能——的好时机。要理解人工智能是什么以及它对我们的意义，我们需要追溯这个术语的起源。在人工智能之前，存在着控制论，这是诺伯特·维纳在1948年提出的一个概念。控制论——源自古希腊语，意为“舵手”或“管理者”——指的是系统中自动、自我调节的控制理念。行动、感知并与目标进行比较是智能系统的基本循环。他的核心洞见是，我们应该从信息的角度来理解世界。像生物体、大脑和社会这样的复杂系统会通过纠错来朝着目标前进，如果这些反馈回路崩溃，系统就会崩溃。", "智能信息系统——或者说生命——可以被视为走钢丝者不断调整自身姿态的过程。当他们走过钢丝时，每一次轻微的晃动都会向大脑发出信号。他们的身体会做出反应，向右移动，然后反复调整以保持平衡。这种来回的信息流使他们保持稳定。同样，夜间驶近灯塔的船只也需要持续的反馈。船长发现船只偏离灯塔左侧，便向右转向，如果偏离过度，则再次调整。这些基于稳定信息流的微小修正，使复杂的系统能够平稳运行。但如果反馈停止——如果走钢丝者感到头晕目眩或灯塔熄灭——系统就会陷入混乱。这些知识在以后会派上用场。", "维纳接触控制论两年后，出版了《人类的人性化利用》。这本书现已绝版，但其核心思想对当今世界仍然具有现实意义：“我们必须停止亲吻鞭笞我们的鞭子。” 维纳深知，危险不在于机器变得越来越像人类，而在于人类被当作机器对待。", "大约在同一时期，一种新的技术观念兴起：通过发明计算机，我们将自身的中枢神经系统——也就是我们的思维——外化，我们所有人现在共享着同一个思维。一种无限的智能。所有潜在信息都触手可及。可惜的是，如今我们很少听到关于控制论的讨论。为什么呢？因为这种新的观念导致了不良的激励机制。维纳斯对智能机器的警告与他同事们的愿望背道而驰，后者热衷于新技术的商业化。他们想要从中获利。其次，计算机先驱约翰·麦卡锡不喜欢维纳斯。他拒绝使用“控制论”这个词，而是创造了“人工智能”，成为该领域的奠基人之一。", "随着关于智能机器的讨论如雨后春笋般涌现，我们不禁思考：究竟是什么让人类如此特别？或者说，我们一开始就真的特别吗？作为唯一登上月球的物种，我们肯定有其独特之处，对吧？", "受卡尔·波普尔影响的大卫·多伊奇认为，知识是无限的，它源于我们创造无限知识的能力。这一切始于创造力的需求。所有知识的创造过程都离不开推测和批判，离不开试错，离不开变异和选择（用达尔文的术语来说）。换句话说，猜测和修正猜测是我们实现任何目标的根本途径。我们正是通过这种方式学习、创新、进步，并理解宇宙中几乎所有事物。我们也正是通过这种方式发现未知的目标或想法，并实现已知的目标或想法。", "德意志认为，人类是“通用解释者”。我们有能力理解任何在可能性范围内可理解的事物。我们创造出解释性理论，揭示现实的深层结构，使我们能够更高效地进行猜测和预测，从而随着时间的推移更快地进步。这种知识使我们能够理解从未直接体验过的事物，例如恒星和星系。我们可以通过望远镜观察来了解恒星是什么，但这只有在我们掌握了望远镜如何改变我们对恒星的感知这一解释性知识之后才能实现。正如通用计算机可以计算任何可计算的东西（我们现在就拥有这样的计算机），人类也可以理解任何可理解的事物。即使我们现在还不理解，最终我们也能理解。", "许多人担忧未来，是因为人工智能及其更高级的形态可能会使人类变得无关紧要。事实并非如此。如果我们能够增强大脑功能，或者让口袋里的电子设备发挥更大的作用（而不仅仅是让我们的大脑衰老），人类的计算能力将没有极限。只要掌握正确的知识，我们就能转化任何东西——比如将原材料变成火箭。我们人类能够执行的基本运算顺序，人工智能完全可以超越。此外，人工智能能够提出的变革性想法，也并非我们人类无法实现的。", "除此之外，人类在注意力方面可能略胜一筹。我们能够通过改变视角来转移注意力。当问题出现时，我们可以调整视角来解决问题。如果我们想造火箭，祈求神明代劳是行不通的。我们可以转换视角，从新的角度看待问题，从而发现新的机遇。如果我们想要获得内心的平静，精神追求会有所帮助，但如果一个人过于执着于某种模式，就可能难以应对生活中的实际问题。这些视角如同相机镜头般可以随意切换，而它们又建立在意识和经验之上——人工智能或许永远无法完全理解这一点，但我仍然相信，它终有一天能够做到。", "关键在于，只要你拥有相应的知识和能够运用这些知识的视角，你就能实现任何可能的目标。你并非注定要走社会既定的道路，也并非注定要受制于智能机器的统治。说到知识，它有两个作用。首先是促成具体的事情发生，最好是好事而不是坏事。其次是捕捉现实中的模式。这使我们能够高效地存储信息，从而避免在追求目标的过程中总是从零开始。我们理解诸如太阳每天升起落下、四季更迭等宏观概念。如果没有这种理解，我们的生活将会支离破碎。捕捉模式使我们能够根据实际情况进行规划。我们知道在寒冷的环境中会冻死，所以我们会利用诸如外套和酒店之类的知识储备来保暖出行。", "这并不能改变大多数人感到迷茫的事实。知道自己可以实现任何目标固然令人欣喜，但如何才能获得实现目标所需的知识呢？答案就在于未知，在于未定义。在于运用你的自主性，走出你已知的可能性范围，或者走出他人为你定义的可能范围。去设定一个新的目标——即使，尤其当它会带来不确定性时——并在黑暗中摸索前行，直到找到金矿。", "把未知想象成一张有明暗斑点的宇宙地图。亮斑代表你已经探索过的区域，暗斑则代表你潜能的所在。这张地图就像一个表面，上面布满了各种想法，你可以用现实检验它们，验证其有效性。当这些结果没有让你更接近目标，反而让你离目标更远时，问题就显现出来了，你必须纠正错误，朝着目标前进。这听起来很简单，但正如生活所证明的，这并非易事。但关键在于，你的目标正是你奋斗的源泉，而奋斗本身并不乏味。", "根本问题，或者说所有问题的根源，在于人们很少勇于探索未知，也未能意识到这本身就是开启他们问题解决之旅的契机。这主要归因于习惯、身份认同和认知。你之所以意识不到那些真正有价值的问题，是因为你没有一个目标，而这些问题会阻碍你实现目标。你没有把健康放在首位，所以营养不良和精神萎靡等问题对你来说都无关紧要。你对钱包里的钱没有很高的要求，所以你不会把它当成一个能激发你创造人生价值的问题。没有问题，就没有创造力。没有创造力，就没有生命。没有问题的生命是没有目标的生命。你没有理由踏入未知领域，发现新想法，创造知识，将其作为贡献贡献出来，并活出充实的人生。问题，就像想法一样，无穷无尽。我们永远无法彻底摆脱生活中的问题。我们只会面临更多更好的问题需要解决。人生没有终点。如果你的人生中有任何阶段，你没有在与一个有意义的问题作斗争（这包括正念、冥想以及其他一些让你感觉好像没有在解决思维熵增问题的灵性修行方式），那么可以肯定地说，你并没有在创造价值，也没有潜力为超越自身的事物做出贡献。你失去了目标。", "值得注意的是，进步也存在一个敌人。当你遇到问题——或者你现在所处的位置与你想要达到的位置之间存在冲突时——熵就有可能增加。简而言之，熵是指所有系统都会陷入混乱，除非有人努力维持秩序。一个脏乱的房间就是一个简单的例子。你的房间一开始是干净的，但如果你没有一套维护系统，那么慢慢地，然后突然之间，房间就会变得一团糟，让你很难再恢复秩序。一开始可能只是床铺凌乱，地板上散落着几件衬衫或袜子，但很快，它就会变成一片荒芜之地，足以让你的母亲抓狂。当应用于心灵时，熵的作用就更加紧迫了。", "我们了解到，动物与人类的不同之处在于，动物在特定的生态位中繁衍生息，而人类则制造工具以适应任何生态位，但我们尚未了解人类为何如此。动物在生理层面生存，它们试图复制基因中的信息。人类也如此，但他们还在概念层面生存，他们试图复制意识中的信息。这是否是一种进化而来的延伸表型尚待商榷，但这种解释是成立的。人类通过概念来保护和延续自身身份或自我，因为自我本身就是一种概念。我们著书立说来传播我们的思想种子，当我们的身份受到威胁时，我们会捍卫自己的信仰，当我们的基因无法再胜任这项工作时，我们会创造概念知识来求得生存。", "精神熵增，或者说思维陷入混乱的根源在于无聊和焦虑。两者都源于你的技能水平与情境挑战之间的不匹配。如果你的技能过高而挑战过低，你就会感到无聊。无聊会导致自我中心。你的大脑会开始思考一些更好、通常也更令人愉悦的事情来打发时间。如果你的技能过低而挑战过高，你就会感到焦虑。焦虑会导致自我意识过强。你的大脑会开始思考自己做得不够好。在这两种情况下，一个念头会引发另一个念头，直到你发现自己深陷其中，无法自拔。一个关于呼吸困难的念头可能会引发上百个关于艰难的食物选择、日常作息、诊所就诊、坏消息、心脏病发作等等的念头，除非你重新将注意力集中在当下可以采取的解决问题的行动上。", "当你安于现状，或者固守着并非出于自愿的现有生活方式时，厌倦感便会悄然滋生，你会开始疑惑，为何生活每况愈下，而日复一日却一成不变。大多数人的生活取决于他们如何摆脱厌倦。当你决定踏入未知领域，你实际上是在重塑自我。你获得了新生。而新生意味着脆弱。秩序荡然无存，混乱不堪。务必牢记这一点。迈向全新生活方式的第一步，必然会伴随着一段焦虑不安的缓冲期。这是大自然在考验你探索自身潜能的决心。", "逆转熵增的关键在于游走于无聊与焦虑之间，挑战那些略高于自身能力的事物。如果你只有一级，你不会去挑战五十级的对手；如果你有五十级，你也不会在意去挑战一级的对手。当你挑战略高于自身水平的目标时，你就能找到你一直在寻找的那种魔力。你以前肯定体验过。当你游走在能力的极限，进入心流状态，全神贯注，你感觉自己所向披靡。除了眼前的任务，其他一切都不重要。你与问题融为一体，行动目标明确。人们会被你吸引，因为你拥有他们所失去的东西。你毕生的使命就是尽可能地延长你在这种最佳的有序意识状态下的时间，无论程度如何，因为只有这样，你才能创造一个值得活下去的现实。当你将精神能量——或者说注意力——投入到你的计划中时，这一切就会发生。当你的能力与机遇的挑战相匹配时，一个目标层级会重塑你对世界的看法。", "我称之为“自然的指南针”。真正的学习，在于参与试错、创造与毁灭、安全与不安的过程。这就是人生的起伏。就像一艘船在暴风雨中驶向灯塔。你可能会偏离航线，但能否感知自身所处的位置，意识到自己确实偏离了航线，并最终驶向正确的方向，是对你的智慧和技能的考验。再说一遍，如果你不是一位经验丰富的航海家，贸然跳上一艘船驶入茫茫大海是不明智的。从你现在的位置开始，但要不断挑战自己。", "这就是你如何获得兴趣导向型教育的方式。你将自己的人生视为一个故事，它由章节、阶段和周期构成。每个章节都有目标、问题、高潮和低谷，随着故事的翻动而逐渐展现。每个章节都是人生的一个宏观周期。一旦你理解了这一点，你就能识别自己所处的阶段，了解其组成部分，并安心地等待进入下一个阶段。这个周期由三个阶段组成。", "你感到迷茫，不知下一步该何去何从。你解决了一个问题，实现了一个目标，以为一切就此结束。对大多数人来说，这种情况通常发生在离开学校或工作多年，直到挑战不再新鲜之后。在迷茫期，你其实是在试图发现问题。无聊或焦虑就是信号。如果你倾听这些信号，就会开始好奇如何才能克服它们。", "你会对此产生兴趣。你会尝试不同的主题、兴趣、想法、技巧和解决方案，直到你完全意识到自己实际上有能力解决这个问题。这便成了你的目标。在工作中，当你完全意识到某个问题阻碍了你的发展后，你的大脑会主动寻找信息来解决这个问题。", "你会变得痴迷。你会越陷越深，深入探索现实的奥秘。你无法停止学习，无法停止朝着目标前进。你开始意识到，你的问题远比你想象的要复杂得多。你发现，要创业，你需要学习说服技巧。要学习说服技巧，你必须了解人的思维。要了解人的思维，你必须了解现实。不知不觉中，最初的金钱问题演变成了对现实本身更深刻的理解。这就是兴趣导向型教育的力量——前提是你不会被层出不穷的问题或更远大的目标所分散注意力。", "这个循环周而复始。一个循环结束后，新的循环便会开始，你又会感到迷茫。你已经积累了一些兴趣爱好，这很好，但你仍然感觉自己只是浅尝辄止。然而，你现在的思维水平已经足以开始解决更深层次、更具挑战性的问题。当你感到迷茫时，以下几点可以帮助你收集灵感（或最终形成解决方案的想法）。", "向内探索。休息。小憩。写日记。散步。拥抱宁静。观察并剖析你的想法。尝试捕捉机遇的信号。追寻你的想法，找到问题的根源。摒弃你那愚蠢的忙碌生活，留出时间进行深度思考。", "向外探索。学习。阅读。浏览。创造。尝试新鲜事物。重新聚焦于生命中真正重要的事：健康、财富、人际关系和幸福。尝试各种方法，将精力投入到目标中。任何目标都可以。在探索阶段，你要努力积累新的经验，直到下一个目标显现。", "就像玩游戏一样，你现在的任务还没完成，但你也没有其他任务可做了。你只能在黑暗中摸索，直到找到远处微弱的烛光。如果你失去理智，就根本注意不到它。", "你要明白，这个阶段没有时间限制。它可能持续数周、数月甚至数年。你必须坚持下去，直到积累足够的视野，才能停止泛泛而谈，开始深入钻研。当你走出迷茫期，对某个领域产生兴趣时，必须迅速行动，将其转化为执着。探索永无止境。", "逐步深入探索。秘诀在于尝试一切，直到找到让你无法自拔的那件事。找到之后，就深入钻研。尽可能多地学习这个领域的知识。剖析所有观点，避免对任何一种观点抱有教条式的执念。", "在营养学方面，从纯素主义、生酮饮食、食肉饮食、弹性饮食以及其他理念中汲取经验和模式，直到你足够自信，能够创建出更接近真理的自身方案。在商业方面，从电子商务、自由职业、软件开发和其他模式中汲取经验，直到你找到能够为自身事业带来清晰方向的原则。", "解决问题的唯一途径是通过不懈的自我实验。否则，一切都只是权宜之计，是处方，是任务。而你也明白，将自己的思想禁锢在别人设定的牢笼里是多么危险。人们可以诊断你的问题并给出解决方案，但他们却忽视了你与给出方案的人在视角、目标和经验上的差异。你永远无法真正了解他人的内心世界，他人也永远无法真正了解你。这正是人类独特性的本质所在。", "不断尝试，不断进步。坚持不懈，反复迭代。我假设一旦你找到了自己痴迷的事物，你就会想把它变成你生活的重要组成部分。这意味着你必须从这个兴趣中获得创造性的收入。你必须把它融入你的创业之路。", "在当今世界，这意味着几件事。首先，创建一个项目来帮助他人解决问题。其次，公开写作以吸引那些面临同样问题的人。最后，出售你的项目，这样你就可以继续追求你的梦想。第三，通过反馈不断改进你的项目，学习那些只能通过反馈才能学到的东西。最后，当你的项目达到只能通过商业途径才能达到的水平时，就可以着手开发新的项目了。", "你毕生的事业并非发生在某个虚构的未来时刻，而是在每一刻流逝中发生。一只脚踏入未知领域，既不会深陷其中让你焦虑不安，也不会浅尝辄止让你感到厌倦，而是恰到好处地把握信息流动的源泉，最大程度地获取有意义的信息。在创业的道路上，挑战和复杂性会逐步增加。你的思维会受到愿景和反愿景的约束。发现问题，接受挑战，尝试各种方案，找到解决方案，并与世界分享，从而将你的成长转化为一份馈赠。当你这样做时，我无法保证你会获得梦寐以求的成功和名望，但我可以肯定，你绝不会沦为平庸之辈。", {"h": "你毕生的事业"}, "你毕生的使命是发挥你的潜能，发掘你的能力，拓展你的知识和技能，去应对更深奥、更有趣的挑战。你毕生的使命是靠做自己赚钱，从有意义的事情中获益。如此一来，你便成为他人效仿和提升的榜样。而其他的选择则恰恰相反，仅仅为了生存和地位而工作，缺乏创造力，缺乏深度，无法为超越自身的事物做出贡献。那是一种自私而麻木的存在，你沦为社会的傀儡。你永远无法摆脱工作，但每个人都有潜力让工作充满乐趣。", "问题不是“我该做什么？”，而是“我该往哪走？”。你毕生的事业，就像其他所有未知而有价值的事物一样，不会在一瞬间变得清晰明了。你或许会感到迷茫，但只要你心怀信念，很快就会产生好奇心。这种好奇心会引领你进入一段专注的时期，一段快速进步的阶段，你会全身心投入，一心追求你的目标。专注过后，你会进入一段稳定期，保持比以往更高的水平。你达到了一个新的目标层次，并从螺旋上升的相似点继续攀登。你或许感觉不到自己在进步，但如果你俯瞰山巅，你会看到自己已经走了多远。", "与其执着于寻找人生目标，不如关注相反的方向：如果你继续重复同样的行为，你的人生最终会走向何方。如果你理解熵——万物趋向无序——你就会明白，如果你的人生毫无作为，你就会选择慢慢地在混乱中沉沦。你不会停滞不前，而是在不知不觉中越陷越深。美好的人生需要持续不断的努力，去追求更高层次的目标。", "但是，我们如何将那种对生活不想要的东西的消极和残酷的认知，转化为美好、真实和美好的事物呢？秘诀在于学习如何思考、学习如何学习以及学习如何赚钱。所有这些都可以在同一个过程中找到：设定目标、制定实现目标的路径，并将注意力集中在能够带来结果反馈的关键行动上。我们已经知道，无限的知识蕴藏在未知之中，等待着我们去发现。现在，你需要一种巧妙的方法来调整你的方向。你可以尝试在沙漠中漫无目的地寻找水源，但你很可能从一开始就走错了方向。", "当你发现某个问题，一旦解决，就能为实现你的愿景铺平道路，这时你就需要一个计划。计划是你获得成功的保障，如果你没有计划，或者认为自己不需要计划，你可能意识不到自己其实已经在朝着某个目标迈进了。或者，你的“计划”就是没有计划（但这仍然是一种计划）。然而，计划并非大多数人所理解的那样。它不是一份永远不会执行的步骤清单，而是一个不断演进的蓝图，需要通过反复试验和纠错才能最终成型。", "计划就像游戏规则，指导你如何生活。玩得越久，技术就越娴熟，你往往会忘记规则，但最终依然能赢。一个强有力的计划，包含愿景、使命、项目、关键要素等等，能帮助你在实现目标的过程中避免不知所措。计划会解释你如何释放和控制熵，从而实现自我设定的目标。我要明确一点：没有人能告诉你如何实现你的计划。他们只能告诉你他们是如何实现自己的计划的。你可以研究他们的经验来帮助你，而且你也应该这样做，但剩下的关键在于不断解决问题。", "我这么说并非自以为是。但我从来不愁不知道自己未来想要什么。当人们说“我不知道自己想要什么”时，他们真正想表达的是“我不想付出努力去得到我想要的东西”。并非你不知道自己想要什么，而是你知道自己不想要什么——也就是说你知道自己想要什么——却在逃避重塑自我的痛苦。你在逃避缓慢而深刻的身份结构重塑。", "我一直都知道自己想要什么，因为观察社会并了解自己不想要什么非常简单：一份我讨厌的工作；一份我漠不关心的工作；一副缺乏活力和美感的躯体；一个我总是与之争吵不休的伴侣；一个我无法驾驭的头脑。这些都是人类经验中根深蒂固的主要问题，是被当作机器对待的产物。如果你不知道从何入手，就从这里开始。你会惊讶于无限的可能性。仅凭这一点，我就很容易明白自己该做什么：无论失败多少次，都要成为一名企业家；获得摆脱我不想做的工作的能力；每天坚持训练，并合理分配精力。然后，让这三件事为我开启人生各个领域的更多机遇。", "每个人都知道，他们注定要走上某种形式的人生道路。你的灵魂渴望自我实现和超越。你存在的深处渴望这些，但你的自我却被它自以为想要的东西所分散注意力。这就是问题所在。你无法集中精神。你没有一个比生活中各种干扰更有分量的未来计划。你难以保持长远的眼光，反而深陷于永无止境的短期压力任务中。", "在本章中，我想向你展示如何提升自身价值，如何制定自己的计划。在下一章“价值创造”中，我想向你展示如何运用这种价值去说服和激励他人。我会穿插一些片段，说明本章的理念如何应用于商业和创业领域，但最终，本书的内容可以应用于你自身、你的支持者和客户。我建议你阅读两遍：一遍用于提升自我，一遍用于将你创造的价值转化为帮助他人的动力。", "人类通过故事来理解世界。大脑本身就是一台故事引擎。当你学会如何通过开辟自己的道路来创造一个值得讲述的故事时，如何吸引他人就变得轻而易举了。领导者自然会吸引追随者，而领导者也会追随其他领导者。所以，学会引领自己的人生，穿越未知的深渊，那里蕴藏着所有未开发的潜能。我不会在此赘述细节。我相信你能将这些铭记于心，并通过反复尝试来领悟。", "反愿景。我们的故事始于反愿景。它是你存在的根源，是你即将培养的世界观的第一个极端。它是一种积极的恐惧机制，会驱使你采取行动。你的反愿景，就是你不愿经历的未来。", "开始记录你不想重蹈覆辙的经历、你不想学习的知识、你不想完成的工作、你不想参与的争论。你不可能立刻摆脱它们，你需要做的就是将它们识别为需要解决的问题。", "愿景。如果没有愿景，你就会迷失方向。你无法创造结果，只能机械地接受既定的结果。你生活中任何领域的每一个决定都必须经过愿景的检验。唯有如此，你才能赋予行动意义，并将干扰降至最低。", "把你真正想要的生活写下来。不要遗漏任何细节，但要明白这是一个迭代的过程。你不可能第一次就做到完美，而且可能永远也做不到。但这并非重点。花三十分钟时间，构思一个最小可行愿景。然后经常回顾它，根据你不断失败后的想法进行增删和改进。", "企业家、品牌或公司的核心特质在于愿景。没有愿景，支持者就无法理解你的发展方向以及它如何让他们受益。如果没有反愿景，他们就没有可以与之抗衡的目标。他们意识不到自己不想要的生活，也就没有改变的理由。", "使命。你的使命是你生命中最重要的事情。它是你渴望与不渴望之间的桥梁，是你通往愿景的道路，是你毕生的事业，是你发挥潜能的途径。任何导致衰败的事物都是必须与之抗争并加以遏制的干扰。", "随着你对新信念、新机遇和新知识的认知，你的使命也在不断演进。你的使命需要信念。只有迈出第一步，你才能看到下一步。而一旦你迈出第一步，第二步或许会与你之前所能想象的截然不同。", "标准。你之所以没有达到理想的状态，是因为你对现状感到满意。但你的大部分标准都是无意识的。举个例子，如果你满足于目前拥有的几美元，你就不会把它当成一个需要解决的问题。你放弃了自主权。这并非坏事，而是一种赋能。如果你把它看作坏事，你可能仍然执着于某种根深蒂固的信念，这种信念会在你的内心深处滋生恐惧，因为它试图在改变中生存下来。你旧有的身份不会轻易消亡。记住这一点。", "你的价值观来源于周围环境。你结交的朋友、你阅读的书籍、你接触的媒体、养育你的父母、以及那些自以为无所不知的老师，都会潜移默化地影响你的价值观。你能做的最明智的决定，就是彻底改变你的物质、精神和心灵环境。让自己沉浸在新的人群、新的思想和新的潜能之中，挑战自我，不断创造、拓展和超越。", "目标。大目标指明方向，小目标使之清晰。当摆在你面前的任务简单到让你不由自主地完成时，你就不需要动力了。将你的愿景分解成十年、一年、一个月、一周和一天的目标。它们是你的指南，而不是你的主人。坚持愿景，灵活处理细节。你的目标会改变，这很正常。", "正如前文所述，计划并非一成不变的步骤清单，而是一个不断演进的蓝图。你的反愿景、愿景和目标对于决策至关重要，但随着智慧的增长，切勿犹豫地进行迭代调整。目标应在愿景之后制定，而非之前。", "项目。项目是将问题转化为解决方案的方式。项目为你的思维拓展提供了一个框架。经过一段时间的脑力投入，项目会成为吸引灵感和经验的磁石。意外发现的机会增加。模式识别能力增强。多巴胺分泌增加，传递有助于你实现项目的信息。", "学习源于实践，而非死记硬背。你需要一系列切实可行的项目来实现你的愿景。将你的目标转化为项目。制定大纲、里程碑、截止日期和研究领域。先实践，再学习。启动项目，暴露出你的知识和技能不足，并将此作为你学习的参考点。", "限制。愚人致富不惜牺牲生活中一切美好事物，而有创造力的人致富则源于他的选择。目标上的限制会激发创造力。问题是，为了实现目标，你愿意牺牲什么？", "当你试图在不背离初心的前提下实现目标时，创造性的挑战便出现了。你可以致富而不牺牲家庭。你可以拥有健康而不牺牲工作。你可以变得有价值而不牺牲生命中那些真正值得珍惜的东西。", "杠杆。每天，你都需要优先处理一些能从根本上推动项目、目标和愿景实现的“杠杆”。如果没有培养出掌控感，这些往往被认为是枯燥乏味的基础工作。做该做的事，但要牢牢抓住你的愿景，将其作为通往未知的锚点。如果你没有取得进展，那是因为你没有推动“杠杆”，即使你认为自己已经推动了。", "挑战。当新手与大师对弈时，双方都难以获得乐趣。新手会感到焦虑，而大师则会感到无聊，除非他们并非以赢棋为目的。当你的技能与所面临的挑战完美契合时，世界仿佛静止，你与待解决的问题融为一体。", "挑战是乐趣的源泉。乐趣存在于无聊与焦虑之间的微妙平衡之中。乐趣源于解决问题。通往有意义生活的道路往往在于视角的简单转变。问题并非你存在的祸根，而是你存在的理由。", "保持好奇心。勇于偏离既定路线，发掘新的潜能。我们很容易陷入原本想要逃离的机械式惯例中。保持好奇心。深入探索你的兴趣。不要让任何问题悬而未决。避免被束缚于那些将你的思维局限在单一理想道路上的模式和信念中。你的视野就像一块电池。你必须用经验、教育和一些意想不到的挑战来为其充电。", "当你迷失方向时，请遵循以下步骤。当你的人际关系出现问题时，请遵循以下步骤。当你的事业举步维艰时，请遵循以下步骤。每一次成功的现实应对都始于并终于对目标的清晰认知、实现目标的明确路径，以及创造性的执行力，从而获得非凡的成果。", {"h": "价值创造"}, "很少有人意识到这一点，但多亏了互联网，你几乎可以学习和创造任何东西。你口袋里装着爱因斯坦和达芬奇的智慧。只要你有主动性和渴望，就能找到获取所需知识的途径，创造你想要的东西。这条路充满未知，但完全可行。", "过去，搭建和维护一个网站需要多名工程师。现在，你只需注册一个网站搭建工具，选择一个模板，根据自己的喜好进行修改，之后就无需过多操心了。更进一步，随着人工智能工具的发展，你只需告诉它如何根据特定要求搭建网站，它就能为你生成原始代码。之后，你还可以与人工智能互动，进一步优化网站，学习如何托管网站，以及如何开始获取客户。", "这似乎是当今世界的大趋势。过去需要更多资源和劳动力的事情，现在所需资源和劳动力越来越少，而随着人工智能的发展，“少”的程度更是接近于零。对于高自主性个体而言，这是一种解放，因为他们可以充分发挥自身作为通才的潜质。而对于低自主性个体而言，这是一种压迫，因为他们自身也沦为可以被替代的工具。我们稍后会详细讨论这一点。现在，请记住：能够用你的智慧而非时间、劳动或外貌来赚钱，才是掌控你做什么以及赚多少钱的关键。尤其是在我们步入这个充满不确定性的未来之际，这一点尤为重要。", "当任何人都能创造任何东西时，如何让人们关注就成了难题，而找到目标受众正是问题的根源。大多数人认为问题在于没人对他们的兴趣感兴趣，但实际上，他们不知道如何让自己的兴趣吸引他人。你每周、每月、每年都会培养新的兴趣。这意味着，如果你理解兴趣产生的机制，其他人也能培养出新的兴趣。当你掌握了这一点，你就找到了创造价值的关键。关键不在于你创造了什么，而在于你如何创造，人们为什么应该关注它，以及它的独特之处在哪里。让我们从这里开始。", "金钱是价值单位。价值衡量的是人们对你的关心程度乘以你解决问题的数量，而问题无穷无尽。权力是指一个人改变他人行为的程度。过去，获取权力的主要途径是武力或欺骗。但随着火药的出现，武力（原因显而易见）变得不再可行。欺骗依然存在，但如果你选择用欺骗来赚钱，迟早会遭到舆论的谴责。这并非明智之举。显而易见，靠武力或欺骗获得的金钱并不会让你快乐。", "我们都希望人们关注我们的作品，而说服是唯一既能做到这一点又能让我们安心入睡的方法。我们所说的说服，是指通过作品对人们生活带来的积极影响，激发他们认识到作品的重要性。如果权力是指一个人改变他人行为的能力，而行为改变是解决个人和全球问题的根本途径，那么说服就是任何人都能掌握的最合乎道德的权力形式。大多数人想要某样东西时，往往不去理解对方的想法，所以很少能如愿以偿。学会说服能让你追求互惠互利——一种正和博弈——因为你通常比对方更能清晰地表达他们的需求。", "作为一名创业者，你不仅要说服一个人，随着时间的推移，你的影响力还会不断扩大。而接触这些人的途径就是媒体。过去，人们通过手写信件、报纸、广播、广告牌或电视来传播信息，但这些方式的局限性显而易见。付费广告和其他媒体形式也很有前景，但对于完全不了解媒体的创业新手来说，我认为这并非明智之举。当然，你需要灵活应变。我们正走向一个充满不确定性的未来，但不可否认的是，在你的创业旅程中，运用媒体进行宣传推广将是你不可或缺的一部分。", "恰好，目前（至少现在）最具创造价值的地方是互联网。这是一条高度自主的道路。你无需获得许可即可创作内容并将其发布到互联网上。你无需获得许可即可探索创意空间并找到所需信息。未来情况可能会有所改变，但这只会更加凸显这一点。无论是在互联网、星际空间还是虚拟现实中，答案始终是：将你所获得的价值分享给合适的人。", "互联网的出现带来了被低估的受众群体构建能力。过去，人们很难与那些信任你、支持你作品的人保持沟通。随着人们逐渐厌倦了中心化机构对注意力流动的控制，越来越多的人开始转向创作者经济，将其作为获取新闻、教育和理解信息的来源。在我看来，对于拥有自主权的个人而言，未来的发展方向应该是建立自己的受众群体，而不是受制于任何既定体系，被迫从中获取受众。这些体系包括出版商、唱片公司、雇主等等。当你拥有受众群体时，你可以通过公开分享你的作品、你的目标受众以及你创作的原因，来写作、创作音乐或找到工作。", "简单来说，你需要用有说服力的文字、演讲、视频或图片来吸引人们关注你的作品。正如我们将在下一章讨论的，对大多数人来说，最好的入门方式是写作。任何人都可以写作。然而，这句话通常会让专业人士感到困惑。他们只想专注于自己的技艺，比如编写代码、创作音乐或设计图形。他们想专注于自己的专业领域，却没有意识到，如果别人不了解或不关心，他们的技艺就毫无价值。他们没有意识到，目前他们唯一的谋生之道就是为那些创作能够吸引客户的媒体内容的人工作。", "这里面涉及几个关键因素。在商业中，你需要一款产品——将你的价值以一种能让其他人受益的方式包装起来——以及一群足够重视这款产品并愿意购买它的人。你可以把产品摆在人们面前，但如果他们看不到产品如何让他们的生活受益，他们就不会在意。即使你认为你的产品是最有价值的，但如果你不把它展示给人们，他们就没有机会去关注它。", "这种模式也体现在人际关系中。你可以把自己置于一群潜在伴侣面前，但如果他们看不到你如何融入他们的生活，他们就不会在意你。你可以认为自己是最优秀的人，但如果你整天宅在家里，潜在伴侣就没有机会关注你。", "无论哪种情况，总会有人与你的身份认同不符。你或你的产品或许客观上很有潜力，但如果对方没有共鸣，一切都无济于事。你必须在正确的时间出现在正确的地点，面对正确的人。当你带着目标、坚持不懈和不断迭代的方式公开你的作品时，你就能扩大潜在关注者的范围。对于那些觉得这听起来不确定或困难的人，我必须提醒你们，另一种选择——你们一直在做的——在安逸舒适的表象下，反而更加不确定或困难。", "作为人类，我们天生渴望获得他人的认可。我们不愿被群体排斥。正是这种渴望构建了我们所生活的这个美丽而又自我完善的世界。如果我们不想被抛弃，就必须为一群能够从中受益并给予我们所需回报的人创造价值。如果我们不创造价值，就会把自己封闭起来，与那些使生命充满意义的进步、目标和利益隔绝开来。", "重点很明确：你需要人脉和产品。你用媒体吸引人们关注你的产品。但媒体和产品本身都没有价值。你需要将它们打包成一个产品。你不是直接向人们索要报酬，而是提供价值来换取另一种价值。对于产品而言，这种价值是金钱；对于媒体而言，这种价值是注意力。两者都很有价值。不要浪费人们的时间。", "价值是一种感知。感知决定了一件几美元的普通T恤和一件几百美元的高档T恤之间的区别。它决定了劳力士或保时捷与任何其他价格低得多的手表或汽车之间的区别。这并不是说你必须把自己定位为奢侈品牌——因为这两种选择都显然带来了成功的商业案例——而是说，不同的人重视的东西不同。正如那句老话所说，一个人的垃圾可能是另一个人的宝贝。", "那么，我们该如何塑造认知？如何包装媒体和产品，从而有效利用说服力？如何提升自身及作品的价值？答案其实很简单，但任何技能都需要毕生钻研才能掌握。请回答以下五个问题。", "1. 你最能帮助谁？性格对感知的影响最大。一个不认为自己是咖啡爱好者的人，不会觉得一杯昂贵的精品咖啡有价值。一个自认为是“爱车人士”的人，也不会觉得一辆便宜又容易买到的车有价值。", "无论从哪个角度来看，最能带来成就感和影响力的人就是你自己。那些与你性格相似的人，那些被你的愿景和反愿景所吸引的人，那些拥有共同目标却不知如何实现这些目标的人——尤其是那些他们自己，最乐于接受并坚持下去的人。当你为过去的自己创造价值时，剩下的事情自然水到渠成。这正是“自我变现”章节的主题。", "2. 你要解决什么问题？说服、讲故事、销售、自我提升以及所有进步的第一步，都是找到最迫切需要解决的问题，并让对方意识到它的存在。如果他们没有意识到问题，就不会有改变的意愿。你的作品也将失去所有被视为有价值的潜力。问题永远是第一位的。在故事中，问题能够激发好奇心，吸引读者。它是读者判断是否值得继续阅读，还是应该寻找其他更能激发他们兴趣的内容的第一个关键点。", "问题意识的层次分为：无意识、有问题、有解决方案、有产品认知和高度认知。你遇到的大多数人都会处于无意识和有解决方案这两个层次之间。你的任务是根据他们的认知水平与他们沟通。你不可能用对待一个没有意识到自己存在问题的人的方式，去对待一个已经尝试过各种解决方案的人。这需要创造力和灵活性。这种能力无法通过言语传授，只能通过长期持续的反复试验和不断纠错才能习得，这也是为什么只有极少数人掌握这项不可替代的技能。", "在你的写作、演讲、设计、视频、产品以及其他任何方面，你都必须对目标受众的认知水平做出合理的预估。这才是如何在信息爆炸的时代吸引注意力的关键。首先，从你的个人经历出发，然后密切关注你想要进入的领域的信息动态。你的人生中解决过什么问题？当时你的心态是怎样的？当遇到解决方案时，你又有哪些反对意见？当你遇到一些可以运用到你事业中的、具有说服力的想法时，一定要把它们记录下来并妥善保存。", "3. 他们想去哪里？说服的第二步是明确他们期望的结果。目标、方向，以及一旦问题解决后，他们想要实现的理想生活方式。你不需要给他们完整的解决方案，因为鉴于变化和演化的本质，这几乎是不可能的，但你可以帮助他们迈出几步，这比原地踏步更有价值。熵对那些墨守成规的人并不友好。", "从你的愿景出发，具体化。你在帮助他们实现什么？他们想要达成的转变是什么？你的描述越具体，就越能激发读者、观众或听众的渴望，尤其对于那些已经意识到问题所在的人来说。大多数人并不想“彻底改变思维方式”，但每个人都希望“明天之前减少十个负面想法”。", "4. 他们何时才能看到成效？最有效的营销策略是清晰明了且坦诚相待。当读者能够清楚地了解解决问题和达成目标所需的时间时，他们更有可能采取行动。设定一个时间框架——例如六个月、十四天或五分钟——有两个作用：首先，它促使你调整内容或产品的规模，使其更加直接有效；其次，它在读者的认知框架中构建了一个新的框架。他们越清楚，就越有可能改变自己的行为，而行为改变才是唯一重要的衡量标准。否则，你的内容或产品将无法产生效果，也就失去了价值。", "正如你所见，这些建议并非立竿见影。我并非要告诉你该怎么做，而是在你心中播下意识的种子。如果你带着这些想法勇闯未知领域，你会发现这些说服原则无处不在，而这比你在这页纸上读到的文字更有价值。无论从哪个角度来看，这才是最佳的学习方式：视角、坚持和模式识别。在你开启新生活之际，请牢记这些理念。", "5. 他们为什么要关心？说服力最终归结为一系列强有力的“为什么”，这些“为什么”能够促使读者改变想法、行为，最终改变人生。最简单的方法就是从痛点和收益的角度思考。最好的方法是把它们写在纸上，并随时记录下涌现的想法。", "把你计划解决的大问题分解成更小的痛点。你试图放大问题，让读者意识到它的优先级比他们想象的要高，因为问题拖得越久，造成的损害就越大。如果大问题是“减肥”，那么一个痛点可以是感觉疲倦乏力会如何消耗精力，影响工作或人际关系。如果我们继续追问“他们为什么要关心这个问题？”，就能深入挖掘，直到找到问题的核心。缺乏精力投入工作会导致工作效率低下。工作效率低下最终会导致收入减少甚至失去收入来源。在人际关系中，他们的伴侣要么加入进来，但吸引力逐渐消失；要么他们的伴侣解决了问题，认为他们不合适，然后离开。", "从积极的角度来看，你可以用解决问题后他们能够达到目标所带来的好处来平衡痛苦。在这种情况下，他们在工作中表现得更好——这会带来无需赘述的好处——并且由于精力和自信的提升，他们有可能发展出一段充满吸引力、渴望和满足感的关系。", "如何解决问题？你需要通过流程来解决问题。这个流程是你通过反复试验，并根据自身个性量身定制的。你的流程本身就是产品，但它可以有多种形式，有时需要学习或指导才能更好地实施。当然，像杯子或衬衫这样的产品本身并不是流程，但除非它们被定位为解决方案，否则它们也不是问题的解决方案。在这种情况下，一个简单的杯子或衬衫完全可以成为解决问题的流程的一部分。如果你想在销售商品时更具说服力，那么你必须发挥创意，思考如何让产品帮助人们逐步理解并实现你的愿景。", "在此语境下，“过程”指的是一个创造性的系统，它能够孕育知识、技能和意识，从而弥合问题与解决方案之间的差距。你可以通过反思自身实现目标的经验，或者通过实验来创建这个过程。", "你可以在网上找到大量的每日计划表，但如果你想自己制作，你的流程需要根据目标受众的特点进行一些调整。如果你想创建一个提高效率的流程，你可以购买多个计划表，进行尝试，提取每个计划表的优点，结合自己的想法进行完善，然后将你的方案包装好，推向市场。", "总而言之，你创造的任何东西，最初都不会以人们普遍认为有价值的形式出现。你必须明确你的目标受众是谁，你解决了什么问题，他们希望达到什么目标，何时能获得成果，以及他们为什么应该关注。以上任何一点都能增强你作品的说服力，但所有因素结合起来，才能使你的产品或服务令人无法抗拒。", {"h": "元技能"}, "在人类出现之前，像变形虫这样的简单生物只能通过触觉获取信息，它们只能感知周围的环境。随着进化的飞速发展，生物能够利用视觉、嗅觉和听觉来获取远处的信息。随后，记忆机制发展起来，动物能够根据过去的经验做出决策。", "人类出现后——经过漫长的缓慢发展，随后呈指数级增长——我们获得了掌控地球的力量。我们不再仅仅是环境的消费者，而是成为了自身命运的创造者。信息不再仅仅储存在基因或记忆痕迹中，而是可以储存在意识中。轴心时代文字的发明，标志着信息向普适化迈出了重要一步。", "信息是我们用来规避危险、发掘新潜能、获取知识以及做出通往美好未来的决策的工具。它起源于篝火旁流传的歌曲、神话和故事。随着印刷术、广播和电视的出现，信息传播不断发展。如今，媒体主导着信息的传播和关注。互联网的出现带来了新的希望。人们不再需要依赖环境中的信息或机构控制的信息来做出更明智的决策，并取得任何形式的成功。书面和口头是基本的沟通方式，由于口头交流常常被记录下来以保存，因此书面文字整体上发挥着集体记忆的作用，使人类能够避免过去的错误并蓬勃发展。", "有趣的地方就在这里。信息是你思维操作系统的密码。作为人类，我们常常被迫、受骗或被说服去接受某些目标。然后，我们会收集各种想法来帮助我们实现这些目标。当这些目标和想法形成一个相互关联的系统网络时，我们称之为我们的身份或自我，它既限制也拓展了我们的人生潜能。", "在互联网出现之前——直到今天，尽管程度有所减轻——信息的传播是集中化的。政府、教育和就业系统、宗教机构以及主流媒体占据了孩子们（他们长大后成为父母）心中最重要的位置。父母又吸引了孩子的注意力，孩子们继续参与、学习和工作，为一个早已不再适用的、毫无根据的体系服务。", "社会目标如同一种定向机制，被植入你的脑海，你唯一的选择就是为了实现这些目标而努力奋斗。你所收集的信息也都是透过这些目标的视角来解读的。对大众而言，默认的结局是奴役——并非肉体上的奴役，而是精神上的奴役。这一点至关重要。占据你头脑的观念决定了你的潜能。如果你接触到的观念仅限于你的目标允许你感知的那些，而这些目标并非由你决定，而是由你的注意力所决定，而你注意力的默认磁石又是整个社会，那么似乎没有什么比改变并参与到那些充斥着大部分注意力的主流观念中更重要的事了。而现在，这些观念都存在于互联网上。", "互联网激发了信息向有影响力的人群进行去中心化传播的潜力。媒体仍然集中化，但随着越来越多的人创造他们想要看到的媒体内容，这种集中化只会继续瓦解。那些占据人们心智最深层的思想将决定人类的命运。我们需要更多作家、企业家和创造者，他们不断提升自身思维能力，传播有价值的知识和产品，从而影响人类的进化进程。大多数人需要的不是更多的工作任务，而是更多能够塑造他们世界观的强大思想，从而让他们能够独立思考并自食其力。", "世界需要更多创造者，更多整合者，更多能够设定愿景、不断提升自我、一路解决问题，并将知识融入创造之中，造福他人的人。创造即是传承知识，传承知识即是为人类的进步做出贡献。如果我们总是要从零开始，我们这个物种的发展就不会如此完善，或许我们今天也不会存在。写作，无论规模大小，都对我们今天生活的世界至关重要。", "让我尽可能清楚地说明这一点。在这个大多数人都在为应该学习哪些技能而烦恼的世界里，不妨从写作开始。一个自由个体的标志是，他们一生中会做很多事情。这要求他们学会如何学习、如何思考以及如何谋生。写作恰好满足了这三点。学校和工作告诉我们应该学什么，限制了我们的思考能力，并让我们习惯于在狭隘的范围内谋生。而写作则能让你巩固所学知识，将思想具象化，并创造出值得付费的作品。", "写作是一项元技能。如果你力求精通，写作就是一条通往未来的捷径，因为要想写出有价值的文章，你必须公开写作。公开写作能让你接触到反馈，从而纠正错误，提升写作水平。提高写作水平就是提高你的思维、学习和能力。通过纠正错误，你会在不知不觉中学习到心理学、市场营销、销售、说服技巧、人性以及你所写作的主题。写作是你参与兴趣导向型教育的一种方式。", "如今，人工智能让技术和智能触手可及，剩下的就是品味、自主性和连贯性。人类必须提供远见、经验和执行力，才能将想法变为现实。他们必须讲述故事，而还有什么比用各种形式书写故事更好的练习方式呢？", "写作是一种无需许可的杠杆作用。互联网的前端是媒体，后端是代码。写作是影响力媒体的基石。帖子、文章、视频脚本、大纲、简报等等，都始于写作。随着语言学习和人工智能工具的进步，代码开始呈现出自然语言的形态。清晰的写作——加上明确的目标——才能写出清晰的代码。当然，在本书出版之时，这并非完美无缺，但或许不久之后就能实现。关键在于，你所创造的一切都始于写作，也可能终于写作。即便最终并非以写作告终，它也会以知识的实体或数字形式呈现，而这些知识很可能可以通过写作来表达和传承。未来，所有成功工作的基石习惯都将是写作。我们今天对写作的定义或许会改变，但这仅仅是因为我们的语言本身可能会改变。我们或许会使用新的概念来提高信息效率，但写作本身仍将一如既往地存在下去。", "写作最神奇的地方在于它的便捷性。你每天都在写作。你可能有一个日记本记录你的想法。你可能给朋友和家人发信息。你可能给同事或老板发邮件。思考不需要英语学位，写作也不需要。要知道，唯一的起点就是起点。从谷底开始。从零开始。这应该是一种解脱。你可以尽情地在无人注视的情况下出丑。只有当你对未知领域抱有过高的期望时，写作才会令人畏惧。当你把写作看作是创造一个你能掌控的未来工具时，它就不再那么令人畏惧了。", "作家就像拥有创意的DJ。写作时，我不会试图一口气写完。我会先列个提纲，把想法、主题、章节和要点都记下来。然后，我会让它静置。我让这个提纲塑造我对世界的认知。有了提纲，你的思维就有了框架。之后，当我阅读、观看或聆听感兴趣的信息时，我会让那些想法浮现出来。然后，我会一点一点地添加内容——就像用画笔描绘想法一样——并不断完善，直到作品接近完成。大多数人都会把他们的作品束之高阁，任其蒙尘。而我，无论对作品本身感觉如何，都会坚持发表，因为我知道，为了我理想的未来，发表作品是必不可少的。人们并不在意文字本身，他们更在意文字带给他们的感受。完美主义是失败者的追求。当纯粹的思考无法奏效时，写作就是探索思想空间的方式。写作就是以一种能够让你的思维发现新想法的方式来储存想法。", "从小处着手。运用上一章的价值创造框架，构思媒体形式，例如帖子或文章；或者构思产品形式，例如短篇小说、软件或小工具。没错，即使不是文字产品，写作也是最佳的创作方式。当然，你也可以选择漫无目的地写作，看看最终会走向何方。选择一个主题。概述问题、目标、二者之间的流程、潜在读者的痛点以及实现目标的益处。将其组织成一个连贯的论证思路，以说服特定的人。如果可以，每天早上写下你理想的未来。这会改变你的人生。", {"h": "自我货币化"}, "在当今社会，掌控收入乃至人生的唯一途径就是创造产品。本书中，“产品”一词指的是你计划赠予他人以换取某种东西的创造物，无论这东西是几美元还是其他任何形式的金钱。对大多数人来说，一个反复出现的主题是，他们的一生都在为他人的梦想而牺牲自己的梦想。这似乎是一种常见的自我欺骗：你认为销售产品是不道德的，甚至是邪恶的，但如果你不创造产品，你就会为那些创造产品的人工作，或者你会成为你生活方式的“产品”——政府发放全民基本收入支票就是一个潜在的例子。普通人别无选择。至于哪种选择是三害相权取其轻，以及你是否真的想要拒绝它们，并希望找到一种更好的方式为世界做出贡献，就留给你自己去思考吧。", "当你踏入创业之路，最先让你感到厌烦的三个字就是：“选择一个细分市场”。对于不了解的人来说，细分市场指的是一个特定的市场，可以用“如果你的目标客户是所有人，那你实际上就等于没有客户”这句话来概括。像“为甲状腺功能低下人群提供生物能量营养”这样的细分市场，其目的在于让你专注于了解你计划解决其主要问题的个体。当你明确自己最能帮助哪些人群时，你就为打造一款有价值的产品奠定了基础。细分市场本身并没有错。事实上，它是商业运作的必要环节。问题在于如何选择细分市场……仿佛它是一种必须从外部寻找的东西。", "当你选择细分市场时，最终你会像大多数创业新手一样，抓耳挠腮，渴望回到自己舒适却又令人窒息的生活。要么你坚持下去，赚到一笔可观的收入；要么你意识到，选择细分市场和追求充实的生活就像油水不相容。最终，你不得不和自己不认识的人一起，做着自己不感兴趣的项目，做着自己不感兴趣的工作。你逃离了狭隘、重复、被指派的工作，却发现自己又回到了原点，只不过多了些奢侈品，却无法填补你灵魂的空虚。", "这种方法还有一些问题。首先，你对所选的细分领域缺乏经验，而大多数创业者失败的原因就在于他们试图解决自己从未经历过的问题。由于你可能永远无法在理论之外真正体验到这个问题，所以你实际上是在做间接的工作。你研究的是地图，而不是实际的地形。这种方法或许有效，也有很多人通过这种方法获得了成功，但我在这里的目的是引导你走向更有意义的人生。其次，这种方法侧重于寻找，而不是吸引或创造。你学习的技能是为了别人。你承担的项目并非你原创。你选择了第一个要解决的问题，却无法掌控接下来涌现的成百上千个问题。", "选择细分领域最大的问题似乎在于它的静态性。你会把自己局限在一个狭小的思维泡沫中。这类似于追求声望而专注于某一特定领域（例如大学学位）的做法，会造成一种令人窒息的墨守成规，极易被取代。在一个封闭的空间里，你所能学到的东西终究有限。而成为细分领域的精髓在于，它会随着你的成长而发展。你的细分领域并非一成不变的目标，而是你个人发展的鲜活延伸。随着你解决新问题、发现新兴趣、创造新知识，你的事业自然会扩展到这些领域。选择细分领域是为专家准备的。", "让我用最简单的方式解释给你听：你就是那个细分市场。大多数人一生都在寻找自己的细分市场，却从未意识到自己早已身处其中。他们缺乏自我认知，而自我认知是商业、营销和销售中最关键的技能。你已经购买了能够改善生活的产品。你已经被那些看似营销实则不然的营销方式所吸引。你已经吸收了那些能够激发你兴趣的信息。但你可能没有意识到，你可以反向推导整个过程，研究它的各个组成部分，并以你自身为核心支柱，重塑它，使其中的每一个方面都独一无二。", "当你专注于小众领域时，你无需执着于寻找新的市场机会。然而，你必须专注于解决自身的问题。如果你能解决自身的问题并出售解决方案，就能一举两得：既提升自我，又造福他人。既有目标，又有利润。无论你如何抱怨或找借口，都无法改变这样一个事实：如果每个人都能反复这样做（解决问题并创造解决方案），参与到纠错的过程中来逆转熵增，那么每个人都会拥有独特而真实、极具潜在价值的东西。你的身份在某种程度上与地球上的其他人截然不同。当你通过“选择小众领域”而放弃这种力量时，你就为竞争敞开了大门。墨守成规是一场有限的游戏，而追求真我则是一场无限的游戏。", "问题是，创业需要很多钱，对吧？你需要资金、仓库、营销预算、有限责任公司等等，对吧？错。记住，你接触他人的方式是通过媒体。至少目前来说，最便捷的方式是通过互联网，而写作这项核心技能将影响你所做的一切。这对几乎所有人来说都是一个绝佳的起点。互联网和写作是一条元路径。如果每个人都这样做，就不会出现市场饱和和竞争加剧的情况，因为它们可以承载任何类型的信息、兴趣或技能。", "那些正在寻找毕生事业的人正在意识到这条道路的力量。他们正在成为一人媒体公司。当他们建立起足够信任和支持他们的受众群体——无论规模大小——足以支撑他们从事自己喜欢的工作之后，他们就面临两种选择。", "首先，他们可以像贾斯汀·韦尔什一样。在他一人创业，营收达到800万美元，利润率高达92%之前，他曾在两家市值数十亿美元的医疗保健公司担任高管。压力巨大，时间紧迫，但收入丰厚。他赚了很多钱，但个人生活却被忽略了。最终，他忍无可忍。当贾斯汀意识到自己拥有一些技能，可以惠及更多人——而不仅仅是他的雇主——时，他开始利用业余时间发展自己的事业。", "贾斯汀的成长历程是这样的。首先，他并没有直接辞职。他看到了互联网带来的机遇，开始通过写作分享自己的知识。他的技能、他的观点，以及最重要的——他的故事——正是这些让他的技能对那些与他产生共鸣的人极具吸引力。事实上，直到今天，他仍然只做这件事：写作。他无需耗费大量时间学习视频拍摄和剪辑等技能，就取得了巨大的成功。通过遵循价值创造的原则，他开始吸引成千上万的读者。", "经过充足的时间和不断的纠错，贾斯汀打造出了高利润的媒体产品。他的第一个产品是商业咨询。由于他拥有市场营销和销售方面的知识，他决定以一对一的线上咨询方式，帮助那些需要他专业知识的小企业和个体经营者。而且，由于他拥有庞大的受众群体，这项工作开展起来并不难。这项咨询服务让他能够收取更高的费用，服务更少的客户，并赚取足够的收入，最终放弃原有的职业，投身于自己真正热爱的事业。随着受众群体的不断壮大，他意识到自己可以帮助更多的人，于是他将之前帮助他人的成功经验整理成一套自学课程。这种杠杆式的学习方式让他能够完全掌控自己的生活。", "贾斯汀打造的是以生活为中心而非以事业为中心来经营事业。家庭和幸福始终是他最优先考虑的。他的写作则为他创造了价值，吸引着那些真正适合他的人。贾斯汀的成功之路告诉我们：你可以建立一家一人企业，赚到足够多的钱来过上美好的生活，并专注于对你而言最重要的事，而无需像过去那样陷入臃肿的商业模式。", "我曾有过几年类似的经历，但我决定追求更多。我还年轻，为什么不挑战一下自己呢？十六岁的时候，我已经观察过社会足够多的情况，意识到传统的道路——上学、工作、退休——并不适合我。随着我对心理学和哲学的兴趣日益浓厚，我意识到，循规蹈矩的道路不可能通往美好的人生。于是，我开始尝试。我在网上搜寻各种资源，学习如何靠自己想做的事情谋生。我一直想做一些有创意的事情，而且我清楚地看到，网络上的公众人物正是这样做的。我尝试了很多东西：摄影、网页设计、极简主义钱包等等。但事情并没有那么简单。我花了将近五年时间——作为一个只能勉强维持生计的年轻人——靠打零工，却只擅长一件事：失败。我接受了自己的命运，找到了一份与我掌握的技能之一——网页设计——相关的工作，但我知道这并非故事的结局。", "坚持不懈，那些失败最终化作清晰的思路。我知道，如果哪怕只有一个人能够通过一系列步骤，将自己喜欢的事情变成工作，那么我也能做到。我或许需要比他们更长的时间，因为我需要探索未知领域，逐步掌握所需的心理技能，但这并非不可能。在职期间，我把大部分工作都投入到自己的事情上，而不是工作。一切进展缓慢。亲朋好友开始付费请我帮忙制作一些小型网站。凭借着从工作和以往失败中汲取的经验，我将这些小网站发展成了为服务型企业量身定制的潜在客户开发流程。大约八个月后，我终于能够辞掉那份新工作了。", "但现在我遇到了一个新问题。我为一些我并不在意的人工作，做着一些我也不感兴趣的项目。我就这样直接进入了这份新工作。在这个问题的背景下，我开始以一种全新的视角看待互联网。人们以自己的名义分享网页设计、自我提升、灵修和心理学方面的知识。我喜欢这些话题。为什么我不能也这样做呢？更进一步说，在即将迈入数字化时代的今天，几乎所有能上网的人，为什么不创建一份“公开简历”，来吸引那些与自身特质相符的机会呢？", "随着脑海中想法的逐渐成形，我开始撰写免费的帖子、文章和简报。之后，我又开始围绕自己的兴趣创作一些电子书和指南。后来，人们开始向我提问，于是我认真地回复了他们。之后，我创建了一个付费社区平台，每周发布文章、制作实用模板并主持在线讨论。令我大开眼界的是，人们——即使是这样一小群人——也愿意倾听我的想法，更不用说为此付费了。经过这么长时间，我意识到，我写了这么多，原来写作本身才是我一直以来缺失的那一块拼图。我，一个曾经在学校里讨厌英语课的人，竟然能够把这些文字发布到互联网上，每月触达成千上万甚至数百万的读者。", "随着写作水平的提高，我的个人媒体公司也随之发展，以反映我对写作的全新痴迷。我热爱写作教学，并且找到了一种独特的方法，让这项技能不仅仅局限于为学校撰写论文。我的受众和客户并不关心写作本身，他们关心的是写作如何帮助他们吸引支持者，让他们关注自身的技能、兴趣和专长。我将个人理念融入到我的写作技能中，并将这种视角写入我的第一本书《专注的艺术》中，开始向我的受众中那些渴望做到这一点的人传授这些理念，因为这才是你我最能帮助的人。", "直到去年，我的经历都和贾斯汀·威尔士很相似。我赚的钱足够过上平静的生活，但总觉得缺少了什么。即使我以为已经解决了所有问题，新的问题又会冒出来。问题无穷无尽，但问题总有解决之道。我意识到自己热爱个人发展，这为我开启了一条新的道路。下一个挑战——以及随之而来的成就感和成长——是利用我积累的资源创办自己的公司：一款完美契合我需求的写作软件。我讨厌不得不在各种应用程序之间分散精力，这给我的工作流程带来了阻碍，但直到现在，我才意识到创办一家完整的公司竟然是有可能实现的。我之前没有解决的问题，反而让我发现了下一个更有意义的问题。", "事业成为了我个人成长的途径，而不是像一些目光短浅的人认为的那样，只是肤浅而孤立的追逐金钱。通过打造我真正热爱的产品，其他人也开始像我一样热爱它们。从独自运营到管理团队，我蜕变成了一个全新的人。我相信，年轻时的我会为现在的我感到骄傲。", "关键在于：这条路并非仅仅局限于信息传播。你不必像写书一样创作媒体产品，也不必教授你所掌握的知识，但我仍然认为这对大多数人来说是最好的起点之一。当你上网时，很容易找到那些解决自身问题并出售解决方案的人。有些人饱受偏头痛的折磨，于是设计出既符合自身风格又能缓解疼痛的防蓝光眼镜。另一些人研究了涤纶服装的危害，最终推出了适合自己的100%纯棉服装系列。在一些特殊情况下，一位患有湿疹的人——曾经厌恶那些毫无生气的白色敏感肌专用香皂——可以出于兴趣学习园艺和植物学，从而创造出一系列能够为日常生活带来活力和放松的香皂。所有这些例子都表明，一款旧产品，加上你的故事，再加上互联网，就能克服商业领域中巨大的竞争压力。", "乔丹·彼得森是又一个佐证这一核心观点的例子。他并非典型的网红，尽管许多人误以为他是。彼得森曾是一位普通的大学教授，如今却著有畅销书，创办了彼得森学院以提供更优质的教育体验，并在世界各地发表演讲。关键在于：彼得森善用一切可用资源，致力于实现他的毕生事业，并尽可能地影响更多的人。社交媒体无疑是实现这一目标的有效工具，但了解彼得森的人都知道，他会利用任何新兴技术来延续他的影响力。他的故事、知识和深度远胜于任何昙花一现的营销手段。人们不由自主地被他的思想所吸引。而且，与他的时间和劳动不同，他的思想可以通过互联网传播给任何有网络连接的人。", "我常常想，像瓦茨或苏格拉底这样的古代伟大教师，如果生活在今天会怎么做。我毫不怀疑他们会充分利用媒体的发展。他们会意识到，仅仅依靠纸质书籍来传播思想是多么局限。多亏了互联网，伟大的思想家们现在能够更好地掌控自身价值的传播范围。", "随着我们不断迈向未来，我们已经看到，一个人就能完成过去十几个人团队才能完成的工作。媒体目前是最容易获取且利润最高的切入点，当它与你的内在本质相结合时，很难被取代，但普通人也能获得更多令人难以置信的选择。在我自己的创业公司以及我所欣赏的创业公司中，团队成员正日益培养创业精神。", "单一技能一直都在被机器取代，这种趋势不会停止。在每一次进化过程中，人类都会将一部分技能抽象成更广泛的元技能。如今，人工智能只需点击一下按钮就能生成生产级代码，个人可以身兼数职，并巧妙地将它们融会贯通。曾经的软件工程师正在转型为设计工程师或产品工程师；曾经的作家如今已发展成为一个完整的媒体部门。工程师可以减少在设计、编码和产品方面的精力投入，作家也可以将精力集中在写作、营销和销售上。但事实仍然是，人类必须协调运用现有的工具，朝着不断发展的未来愿景前进。", {"h": "成为创作者"}, "在人类历史的大部分时间里——数百万年——创造力似乎只属于神明。在某个时期，他们用这种力量创造了人类。至少我们过去是这么认为的。人类是弱小无助的生物，饱受饥饿、寒冷、野兽以及彼此的折磨。他们无法解释周围的世界，因此也无法利用这些知识创造更好的生存方式。但是，在过去的一千年左右的时间里，一切都发生了缓慢而又突然的转变。", "我们开始了解事物运作的原理。我们制造出各种工具，使我们能够在任何环境中生存，这与动物截然不同，从严寒到酷暑，再到外太空。由于机器的发明、能源的利用以及我们对探索的渴望，整个地球都变得更加宜居（当然，这也带来了显而易见的后果）。人类已经承担起创造者的角色，但许多人迷失了方向，或者从未找到自己的道路。他们不是企业家，不是那些拥有卓越才能的通才。他们是雇员，是顺从地完成任务的机器。记住，创业和就业是一种心态，并不局限于某种特定的工作类型。", "遗憾的是，我们无法预知未来。我们不知道人工智能等技术会取代多少工作和生计。我们不知道地球最终会变成花园还是荒地。就个人而言，我们也不知道我们采取的任何行动是否会带来我们想要的生活。但我们确信两件事：问题无穷无尽，但问题总有解决之道。无论我们人类发展到何种程度，无论我们开发的技术多么先进，你都可以从以下事实中获得慰藉：总会有下一个问题需要解决。值得庆幸的是，如果你想要过上有意义、有财富、有成就的生活，你只需要知道这一点就足够了。", "如果幸福——或者说快乐——是个人进步与为超越自身的事物做出贡献的结合，而这两者都是通过解决问题（无论是为自己还是为他人）来实现的，并且问题的解决又依赖于创造力，那么你未来唯一合乎逻辑且根本的目标就是通过成为一名创造者来体现创造力。换句话说，你可以通过创造你认为有趣的问题的解决方案，并将这些解决方案传递给他人以促进人类进步，从而找到目标与收益的交汇点，并在遇到下一批更复杂的问题时重复这个过程。尽管问题变得越来越复杂，但你也会积累更多的知识、技能和经验来解决它们。如果你学会控制混乱（混乱本身也是一个问题），那么随着问题的增多，生活反而会变得更好。每一个问题都蕴含着提升目标层次的机会。", "成为创作者一直都可能，但从未像现在这样触手可及。过去只有那些拥有合适资源——时间、金钱和信息——的人才能做到的事情，如今只要能上网，人人皆可参与。随着人工智能和后续革命性技术的出现，你掌控自己创作的能力只会不断增强。然而，真正抓住这一机遇的人数或许会减少。", "我们都听说过文艺复兴。这是欧洲历史上一个变革性的时期，标志着从中世纪向现代的过渡。大致从十四世纪到十七世纪，这一时期以文化、艺术、政治和经济的复兴为特征。我认为我们正处于第二次文艺复兴之中，但这一次，它发生在互联网上，无处不在，而且速度远超以往。一个全新的社会正在兴起。一个数字社会，在这个社会里，任何人都可以成为爱因斯坦或莎士比亚（或者至少可以把他们装进口袋里）。", "在这个社会里，人可以分为三种：消费者、创造者和公司。创造者是一种特殊的人，不，我说的不是“内容创作者”或其他狭隘的新时代职业。虽然这些职业本身并没有错，而且从技术上讲，在当今的发展阶段，创造者的确从事这类工作，但给自己贴上这样的标签，无疑会让你和那些被用户参与度指标分散注意力的人一起被归入“垃圾堆”。我所说的“创造者”，指的是你存在的本质。就像我们之前定义的企业家——即正在做某事的人——一样，创造者就是正在创造某物的人。创造意味着自我反思、发现问题、探索未知、寻找灵感、测试解决方案，并创造出值得传承的东西，而这或许可以换取他们所期望的价值，无论是金钱、关注、地位，还是帮助他人的那种难以言喻的满足感。创造者的定义是：生活在目标与利润交汇点的人。这里的利润衡量的是你如何提升自我、帮助他人，以及改善整个世界。创造就是追求你毕生的事业。", "创作者的独特之处在于他们在新社会中扮演的角色。他们可以像一人公司一样运作，凭借其广泛的技能实现自给自足。他们建立自己的分销渠道，创造自己的产品。另一方面，他们也可以为公司工作，或者利用自身优势创办自己的公司。创作者如同企业家，可以从一份工作发展成为一项事业，最终成为一项使命，以保持解决问题的新鲜感和挑战性，从而让生活充满意义。", "创造者和公司正在为未来奠定基础。过去的教育、经济、意义、艺术和政治领域正逐渐被淘汰，取而代之的是更个性化、更有利可图、更高效的模式。如今，人们对学校体系的信任度下降并非因为大众觉醒，而是因为选择更多。人们可以上网，追寻好奇心，找到分享独特知识的创造者，学习传统学校因速度缓慢和教条化而无法教授的技能，并随着兴趣、信仰和价值观的演变而不断调整关注对象。如今，人们不再需要坐在政府培训的专家面前“学习”与其他人相同的内容，最终获得一套即将过时的技能，让最聪明的头脑屈从于主流范式。而是要找到与你产生共鸣的人，找到与你拥有共同未来愿景的人，找到比你领先一步、能够提供相关理念并孕育特定知识的人。过去，像马可·奥勒留这样的王位继承人会接受最好的私人教育，为继承王位做好准备。如今，人们可以自主选择教育者，以人工智能为辅助工具，进行基于兴趣的有效教育。当然，这也意味着个人有责任谨慎选择教育者。从纷繁的信息中甄别出真正有价值的内容，将成为未来的一项高价值技能。", "但这不仅仅关乎教育。创造者是新社会意义建构的支柱。随着信息的快速传播、日益复杂的社会环境和不断加剧的混乱，人们开始迷茫，不知该相信什么。他们再也无法信任单一的、静态的信仰体系来理解自身在世界中的位置，也无法从中找到生活的方向。政治评论员和两极分化的机构并没有消失，但他们正在逐渐失去对那些能够提供更深刻知识且不受不良激励机制影响的创造者的关注。", "创作者本身就可以成为公司，但公司自身的结构也在发生根本性的转变。公司聘请外部创作者，以此来接触新的受众群体并拓展业务。公司也在培训内部创作者，以适应互联网经济的现状。为此，公司致力于解决个人难以获取的资源问题，而这些资源又极其稀缺。创作者——就像精品店一样——为他们所吸引的志同道合的受众创造个性化的商品和服务，并通过他们传播的价值来吸引受众。你现在就可以上网，找到来自各行各业的人们，他们通过解决生活中遇到的问题，获得了足以维持生计的收入。有些人制作口香糖来促进肠道健康，而另一些人则出售信息、软件或精美的手工艺品，这些都能让那些与他们创作时处于相似发展阶段的人受益。总而言之，创作者是去中心化的教育体系、经济体系和文化意义的创造者。", "通往未来之路的关键在于从消费者转变为创造者。当你解决自身问题，并将解决方案发布到全球平台，帮助一群志同道合的人——即便这群人只有区区一千名忠实粉丝——我相信你也能从中汲取力量，创造美好生活。到那时，你唯一的敌人就是你自己，而这不过是另一个需要解决的问题而已。", "样样精通。写作。设计。营销。销售。拍摄。编程。做你天生的通才。成为思想的统帅。掌控思想。新技术只是工具，而非主宰，它能帮助你更快、更省钱、更有力地学习和完成这些事情，从而让你掌控自己的生活方式。"], "wcount": 49094}, {"group": "目标、意义与自我认知", "gsub": "找到方向 · 对抗虚无", "icon": "2", "title": "你不是抑郁，你只是没有目标", "paras": [{"h": "你不是抑郁，你只是没有目标"}, "-如何重新掌控自己的人生", "大多数人并非残缺不全，而是缺乏追求。如果你觉得自己一直过着自己越来越厌恶的生活，那么让我们来分析一下造成这种状况的心理原因，这样你就能确切地知道你需要做什么来改变你的生活。人类的思维就像一台故事引擎。故事是我们理解世界的方式，如果你因为懦弱或懒惰而困在自己的故事里，一切都将变得毫无意义，当你的思想被一团混乱的思绪所束缚时，就很难找到出路。当故事变得互动时，它就变成了游戏。你的心理运作遵循反馈循环。这就是为什么你可以连续玩8个小时《魔兽世界》而面不改色，却连30分钟都无法忍受你讨厌的工作。大多数人觉得自己抑郁，是因为如果你不选择玩什么游戏，别人就会给你安排一个，而社会想让你玩的那些游戏很快就会让人感到厌倦。如果你连续十年重复同一个任务，你肯定会放弃这款游戏，但因为你从小接受的教育仅限于此，而且你也没有养成持续自我学习和尝试新事物的习惯，所以你根本看不到身边无数能让你重拾生活乐趣的任务。解决感到无聊、迷茫或大多数人认为的抑郁的办法是，创造你自己的游戏，接受一个又一个任务，直到你甚至认不出自己为止。你并不想要摆脱规则的自由。你想要拥有制定自己规则的自由。你之所以想要自由，唯一的原因是你不想受到别人强加给你的限制，但如果你真的获得了自由，你的大脑将无法处理任何有意义的事情，你的生活也会变得更加糟糕。", "真正的自由在于创造属于你自己的游戏：设定明确的目标 → 定义你心目中的成功标准。创建反馈循环 → 每日任务、每周任务、每月首领战。", "制定你自己的规则 → 有哪些你不能做的事情会增加游戏的挑战性？", "了解利害关系 → 如果你输了会怎样？", "培养知识和技能 → 每个里程碑都需要学习和实践。", "什么是幸福？幸福就是力量不断增长、阻力被克服的感觉。尼采说这话时，指的不是凌驾于他人之上的权力，而是指不断增强的能力感和克服挑战的能力。", "你的生活失去了活力，因为你的目标模糊不清，缺乏反馈，没有紧迫感，没有清晰的规划，也没有持续的进步。你没有一个框架来防止你的思绪陷入混乱。你没有一个自我约束的思维模式来抵御外界的干扰。你没有活在自己的小世界里。对于健身而言，胜利意味着拥有肌肉线条分明、体脂率低于10%的健美体格。我每天的目标是摄入2500卡路里，并在健身房锻炼45分钟。我坚持90%的饮食为天然食物，并摄入200克蛋白质，同时保持良好的举重姿势。我每周的目标是减重2磅。我每月的目标是打破举重记录。我的风险在于，最终可能会变得肥胖且缺乏自信。为了实现这一切，我必须不断学习健身知识。在事业方面，我有营收目标、深度工作环节、每周项目、每两个月一次的产品发布，还有激励我创造有意义产品的价值观、破产的风险，以及不断提升的知识水平。当这些因素构成我的关注点时，我就很难再为琐事烦恼了。（对照自己的事业方面，列出清单）大多数人并不觉得这样做令人愉悦，因为他们将其视为一种义务，而非一种避免虚度光阴所带来的严重后果的选择。他们不会把每件事都当作游戏来对待。人的大脑渴望秩序。目标层级。探索如何理解和过滤混乱。心流心理学的创始人米哈里·契克森米哈赖发现，无聊和焦虑源于心理熵。如果你不知道什么是熵，也不用太担心。这其中涉及很多科学知识。你只需要知道，熵基本上是指事物随着时间的推移自然而然地瓦解或变得混乱。想想看，如果你不打扫房间，房间就会变得多么杂乱；或者沙滩上的沙堡会如何崩塌。齐克森米哈里用这个比喻来解释我们大脑中发生的事情——当我们的思想和注意力没有集中在有意义的事情上时，我们的精神状态就会变得分散混乱，导致无聊或焦虑。正如我们需要努力保持房间整洁一样，我们也必须将精力投入到有意义的活动中 ，以防止我们的内心世界变得混乱。", "感到无聊或焦虑当然正常。但如果你不把这些情绪视为人生做出小改变（或开始寻找新的目标）的信号，它们就会慢慢累积，直到你陷入一种低落的意识状态，而你称之为抑郁。你的房间会变得脏乱不堪，你甚至不知道该从哪里开始打扫。", "你感到无聊，是因为你还没有接触过那些需要提升技能和知识的未来发展方向。你之所以焦虑，是因为你把目光投向了太远的未来，而你又缺乏所需的技能或知识。当目标的挑战性与你的技能和知识水平相匹配时，就能重新获得生活的乐趣。美好生活的秘诀在于不断书写属于你自己的故事，永无止境地进步。美好生活的秘诀在于发挥自身潜力。那里是信息流动最顺畅的地方。你不会贸然跳入未知领域。你会先迈出几步，慢慢消化这段经历，不至于崩溃。然后，当你升级，一切步入正轨后，你才会接受下一个任务。你化身为游戏中的某个角色。你从一级开始。没有技能，没有特质，没有职业。你先完成新手教程阶段，积累经验值，然后创建你喜欢玩的角色。在游戏中提升等级可以让你迎接更有趣的挑战，让生活本身也变得更有趣。根据苏珊娜·库克·格鲁特的心理学理论——自我发展阶段，已记录在案的阶段共有9个。每个阶段都代表着一种更复杂的理解世界的方式。", {"img": "dan12_01", "cap": ""}, "Knowledge 知识", "Notice more pieces of the puzzle 发现更多拼图碎片", "Discover patterns,rules,and laws 发现模式、规则和定律", "Predict,measure,and explain 预测、测量和解释", "See further ahead and back in time 看得更远，回顾过去", "Know more and do more 了解更多，做得更多", "Wisdom智慧", "Understand more deeply 更深入地理解", "Recognize assumptions 识别假设", "See whole dynamic system 看到完整的动态系统", "See within,around and beneath Empty mind 洞察内在、周围和深层本质 心境澄明", "Impulsive-Self-protective-Conformist-Self-conscious-Conscientious", "冲动型-自我保护型-墨守成规型-自我意识型-尽责型", "Individualist-Autonomous-Construct-aware-Unitive", "个人主义型-自主型-建构意识型-统一型", "Socially programmed社会化编程", "Increasing integration 整合度不断提高", "Conventional linear reasoning 传统的线性推理", "Self/other-constructed自我/他人建构", "Increasing differentiation 分化度不断提高", "Postconventional understanding 后传统理解", "没有追求的人感到空虚，因为他们被困在原地，无法改变。他们没有发展出真正的自我，这限制了他们能够感受到意义或挑战的范围。当你把生活当作一场游戏时，你不仅仅是在追求肤浅的外在目标。你会逐渐成长为一个能够感知并应对更复杂模式、关系和挑战的人。一个具备建构意识的自我能够处理那些会让循规蹈矩的人束手无策的微妙挑战。在发展的每个阶段，或者说在游戏的每个级别，你都会拓展自己的能力范围。你，你的自我认知，实际上远不止于此。更多视角，更多技能，更多应对现实的方式。这就是重燃生活激情的方法。"], "wcount": 2968}, {"group": "目标、意义与自我认知", "gsub": "找到方向 · 对抗虚无", "icon": "3", "title": "对自己的提问", "paras": ["如果你不知道从哪里开始，请回答这些问题，或者填写这份人生重置提示，它将生成你迈向下一个阶段的计划初稿。", "1.如果你拥有世界上所有的财富，你的一天会是什么样子？", "2.你想生活在什么样的环境中？有没有特定的地点？你想旅行吗？", "3.你想要组建家庭吗？你希望你的家庭生活是什么样的？想象一下你和家人共度的普通一天。", "4.你希望每天工作多长时间？如果可以做任何事，你会选择做什么工作？", "5.你希望自己看起来和感觉起来是什么样的？描述一下你的体型、精力水平，以及你想向世界展现的形象。", "6.你理想中的一天是什么样的？把每个小时都规划出来。", "7.把你脑海中浮现的任何其他关于你想要为自己构建的未来的具体想法都列出来。", "写出：把你现在生活中所有你讨厌的事情都说出来。如果你不改变这些事情，你将会过上怎样的生活？", "1.五年后，如果你的收入翻了一番，但内心依然感到空虚，你的日常生活会是什么样子？你能接受这样的生活吗？", "2.为了赚更多的钱，你还在生活的哪些其他方面作出了牺牲？", "3.哪些类型的工作、客户或顾客会让你感到内心麻木？", "4.你会成为怎样一个“成功”的人，以至于过去的自己会感到惋惜？", "5.你认为毫无意义的一天是什么样的？有意义的一天又是什么样的？", "6.如果你的唯一身份就是你的收入，你会成为什么样的人？", "7.如果你的大部分时间都被你讨厌的工作占据，你的人际关系会变成什么样？", "8.让这些想法引发你的思考，想想如果你不改变，你的生活最终会变成什么样子。"], "wcount": 604}, {"group": "目标、意义与自我认知", "gsub": "找到方向 · 对抗虚无", "icon": "4", "title": "思考的问题", "paras": [{"h": "思考的问题"}, "如果你现在无法回答这些问题，可以稍后再来思考。", "1.你已经学会忍受的那种迟钝而持久的不满是什么？不是那种刻骨铭心的痛苦，而是你已经学会容忍的那种不满。（如果你不憎恨它，你就会容忍它。）", "回答:长时间的工作却挣不到钱，还处于拼体力和时间的阶段，已经持续了2年。", "2.你总是抱怨哪些事情，但却从未真正改变过？写下你在过去一年中最常抱怨的三件事。", "回答：离开低端的耗时的体力活行业，每天都很疲惫，已经我是失败者。", "3.针对每一项抱怨：观察你的行为（而不是你的言语）的人会得出你真正想要的是什么结论？", "回答：我不想过现在的生活。", "4.你现在生活中有哪些真相是你无法向你非常尊敬的人坦白的？回答：如果一直这样下去会变得贫穷，陷入债务危机。", "这些问题旨在让你意识到当前生活中的痛苦。现在，我们需要将这些痛苦转化为我所谓的“反愿景”，即对你不想要的生活的残酷认知。这样，你就能利用这种负能量，将你的努力导向积极的方向，并出于内在动力而行动。", "1.如果未来五年内一切照旧，请描述一下你平常的星期二。你在哪里醒来？你的身体感觉如何？回答：依旧拖着疲惫的身体从贫民窟醒来。", "你想到的第一件事是什么？你身边有哪些人？从早上9点到下午6点，你都做了些什么？晚上10点你感觉如何？回答想到的第一件事是还需要长时间的工作，早上学习，午间送外卖，下午去咖啡店上班，一个月缺只能挣到微薄的收入。", "2.现在，试着把时间延长十年。你错过了什么？哪些机会溜走了？谁放弃了你？当你不在场时，人们会怎么评价你？回答：错过了成为更好的自己。自己放弃了自己。我是小透明，我不在场时，别人根本不知道我是谁，对我没有任何评价。", "3.你已走到生命的尽头。你过着安稳的生活，从未打破过既定的模式。为此付出了什么代价？你从未让自己感受过、尝试过、成为过什么？回答：为此可能早早就离开了世界，疲惫而亡，得到了忙碌的一生，却没有人知道。", "4.你身边有哪些人已经过上了你刚才描述的未来？那些比你领先五年、十年、二十年，走着同样道路的人呢？当你想到自己会成为他们时，你有什么感受？回答：Kking从1万做到上千万，keyVV也同样，我有什么感受，我是失败者", "5.为了真正改变自己，你需要放弃哪些身份？（“我以前是那种人……”）不再做那样的人，你在社交方面会付出怎样的代价？我首先应该放弃外卖的工作，无法全职投入进去，挣不到钱，选择把时间投入在学习（正确的学习上）学习与人建立关系，合作共赢。", "6.你至今没有改变的最尴尬的理由是什么？那个让你听起来软弱、害怕或懒惰，而不是合情合理的理由？回答：没钱就没办法还房贷了。我是失败者。", "7.如果你目前的行为是一种自我保护，那么你究竟在保护什么？这种保护又让你付出了什么代价？回答：保护一戳就碎的生活。保护的代价就是住在贫民窟，不得翻身。", "如果你如实回答了这些问题，并且正处于人生的正确阶段，你会对目前的生活方式感到深深的不安，甚至可能感到厌恶。现在，我们需要引导这种能量朝着积极的方向发展。我们需要制定一个最小可行愿景，因为你的愿景就像一个产品。它起初可能并不清晰，但随着时间和经验的积累，它会变得越来越清晰、越来越有力。", "1.暂时抛开实际因素。如果你能打个响指，三年后就能过上截然不同的生活，想想你真正想要的是什么，而不是现实的那种？一个普通的星期二会是什么样子？细节程度与第五题相同。", "回答：全球任意地方的旅居生活，而不用考虑收入的问题，因为我已经可以创造财富了，而且只需要很短的工作时间。", "2.你对自己有怎样的信念，才能让那种生活感觉自然而非勉强？请写下你的自我认同宣言：“我是那种……”回答：建立影响力，正在的学会交易，突破心理的障碍。", "3.如果你已经是那样的人，这周你会做什么事？明天一早先回答所有这些问题。回答：不断学习增进，并写出我的转变，著书立说。", {"h": "（第二部分）全天——打破自动驾驶模式——打破无意识的行事方式"}, "我们想要的是真正的改变。坦白说，如果你不打破目前让你停滞不前的无意识模式，这一切都不会发生。今天一整天，我都希望你认真思考你在第一部分日记里记录的所有内容。除此之外，我也希望你不要忘记思考。请认真对待这件事。如果你一辈子都做同样的事情，你不会改变的。你需要有意识地打破旧有的模式。现在就花点时间在手机里创建提醒或日历事件。", "上午11:00：我现在做的事情究竟在逃避什么？", "下午1:30：如果有人拍摄了过去两个小时的影像，他们会得出什么样的结论？我想要怎样的生活？", "下午3:15：我是在走向我讨厌的生活，还是走向我想要的生活？", "下午5:00：我假装不重要的最重要的事情是什么？", "晚上7:30：今天我做了哪些事是为了保护身份而非出于真心？（提示：你做的绝大多数事都是如此）。", "晚上9点：今天我什么时候感觉自己最有活力？什么时候感觉自己最麻木？", "为了进一步激发思考，不妨在通勤、散步或闲坐的时候安排这些问题。如果我不再需要别人把我视为[你在问题10中写到的身份]，会发生什么变化？我生活中哪些方面为了安全而牺牲了活力？我明天能成为的那个人的最小版本是什么？", {"h": "（第三部分）晚间——综合洞察——进入进步的季节"}, "如果你遵循这个过程，我敢肯定你至少会获得一个足以改变你人生轨迹的深刻洞见。今天过后，你觉得你一直以来陷入困境的最真实原因是什么？真正的敌人是什么？明确指出来。", "回答：我是失败者，学习方法不对，真正的敌人是我错误的思想，正如那句话说的，你贫穷是因为你不愿意成为富人，富人不会沉迷于社交软件，不会沉迷无法提升并创造价值的东西。", "不是环境，也不是其他人，而是主导一切的内在模式或信念。用一句话概括你绝不接受的生活现状。这就是你对未来的愿景。回答：继续在贫民窟生活，我要搬去富人区。", "读到它时，你应该有所感触。用一句话概括你正在构建的目标，要知道它会不断发展演变。", "成为成功的交易者，创造一辈子通过体力劳动也没办法达到的目标。", "这就是你的愿景MVP（最小可行产品）。最后，我们需要制定目标。再次强调，这些目标并非为了达成而设定，因为目标只是一种预期。它们并不可靠，会让你感觉被某种终将改变的事物所束缚。相反，你应该把目标看作一种视角，一种可以让你调整心态、摆脱不想要的生活的视角。不要担心所谓的终点线，因为我们会发现，它并不存在。真正的乐趣在于过程。", "一年期视角：一年后，什么事情必须成真，你才能知道自己已经打破了旧模式？一件具体的事情。回答：离开了现在的晚间咖啡店工作，搬离贫民区，或者已经提前还清了贷款。", "一个月视角：为了使一年视角仍然可行，一个月内必须满足哪些条件？上午的时间用来交易，做100-1000笔符合交易系统的交易。每日复盘图表，找出属于自己的结构，并且在没有符合自己行情的位置，动态复盘，以达到精进的状态。", "每日思考：明天你可以安排时间做哪2-3件你想成为的那种人会毫不犹豫地去做的事情？", "回答：每天读三篇文章，每天动态复盘一小时，找出属于自己系统的结构图表，交易日志的撰写，第一件事是动态复盘将脑中混乱的交易策略梳理清晰。", {"h": "第七.把你的生活变成电子游戏"}, "请另起一张纸，写下以下六个组成部分：", "1.反愿景——什么是我痛苦的根源？或者说，我永远不想再经历的人生是什么？", "2.愿景——我理想中的生活是什么样的？我可以通过努力不断改善这种生活？", "3.一年目标——一年后我的生活会是什么样子？这是否更接近我想要的生活？", "4.一个月项目——我需要学习什么？我需要掌握哪些技能？我可以构建什么来让我更接近一年目标？", "5.日常关键因素（每日杠杆）——哪些是能够推动项目进展、使项目更接近完成的优先事项？", "6.限制条件——为了从零开始实现我的愿景，我不愿意牺牲什么？", "为什么它如此强大？因为这些要素实际上构建了你自己的小世界。如果你注定要在人生的这个阶段追求这一系列目标，你别无选择，只能全身心投入。你会感受到一种对更高目标的渴望。你会认为其他任何选择都不算数。", "你把生活变成了电子游戏。因为游戏是痴迷、享受和心流状态的典型代表。它们具备所有带来专注和清晰思维的要素，所以如果我们反向推导出这些要素是什么，我们就能生活在更深层次的享受、更少的干扰和更大的成功之中。", "你的远见决定你的胜负。至少在游戏规则改变之前是这样。", "你的反愿景才是关键所在。如果你失败或放弃，会发生什么？", "你一年的目标就是使命。这是你人生中唯一的首要任务。", "你为期一个月的项目就是打最终boss。你将如何获得经验值和战利品？", "你每天的杠杆就是任务。这是解锁新机遇的日常流程。", "你的限制就是规则。正是这些限制激发了创造力。", "所有这些都像一组同心圆，如同力场一样，保护你的思维免受干扰和诱惑。你玩这个游戏越多，这种力量就越强，很快它就会成为你的一部分，而你生活本该如此（成功）。"], "wcount": 3519}, {"group": "目标、意义与自我认知", "gsub": "找到方向 · 对抗虚无", "icon": "5", "title": "这一个决定将决定你人生的大部分", "paras": ["这一个决定将决定你人生的大部分。", "-为什么优柔寡断是致命的", "你所做的决定的质量决定了你生活的质量。但有一个决定决定了所有其他决定。就我个人而言，我年轻时就做出了这个根本性的决定。我记不清具体是什么时候了——从十岁到十二岁起，这个想法就一直在我脑海里——但有一个清晰的瞬间，我意识到默认的生活并不适合我。我从心底里厌恶它。我做出的最重要的决定就是不再整天做自己讨厌的工作，拿着微薄的薪水，一边对着电视大喊大叫政治和体育赛事。我不想让工作吞噬我所有的时间，让精力被我不愿承担的任务耗尽，让钱不知不觉地花在那些我甚至都不知道要付的账单上。很多人因为无法做出决定而毁掉自己的一生，更别提任何决定了。普通人优柔寡断，却意识不到这其中的巨大问题。", "你正朝着错误的方向疾驰而去。", "你出生时就被设定在默认的人生道路上。就像一列货运列车疾驰在由前人几代人铺设的铁轨上。当你告别青少年时期时，你已经积累了二十年的惯性。生存模式根深蒂固，影响着你的每一个决定。问题在于，这只是一个非常原始的人生操作系统：上学、找工作、退休。这没什么特别的。除非你做出大胆而果断的决定，改变这列火车的轨道，否则你永远无法发挥出你的全部潜能。所有决定的最终结果都是拒绝默认路径。响应冒险的召唤。终于开始书写第一章。离开新手教程，开始第一关。你的人生就此开始。你的人生结局取决于十到十二个大胆的决定，就像十几次改变人生轨道的抉择。如果你不做出这些改变，你的人生就会变得平淡无奇，停滞不前。这就是现代生活的巨大陷阱。想象一下你从事着一份自己讨厌的工作。你可以下定决心从此不再忍受那种生活，也可以继续犹豫不决，两年后醒来，生活却丝毫没有改变。事实上，两年后情况很可能会变得更糟。优柔寡断的问题在于，你不做决定，就等于让别人替你做决定。这就是生活。你必须做点什么。你每天都必须朝着某个方向前进，但大多数人无法掌控前进的轨迹。我们姑且称之为“空闲状态”，此时你的大脑处于运转状态，功能正常，但却没有处理任何有意义的信息。你看似在做某事，但实际上却什么也没做。你讨厌这种状态，但又不足以让你改变它。", {"h": "你默默地珍视平庸"}, "你的决定反映了你的价值观。即使你认为自己拥有高尚的价值观，我也希望你深入审视一下自己的所作所为。如果你每个周末都外出，说明你重视社会地位。如果你每天晚上都点外卖，然后窝在家里看Netflix，说明你重视舒适安逸。如果你有工作，说明你重视安全感。价值观体现了你重视什么。美好生活源于将精力集中于正确的价值观。如果你重视地位、舒适或安全，这完全没问题，但请诚实地面对自己。你的大部分精力都投入到哪里了？投入到哪些价值观中？你是否在为更美好的生活投入资源？大多数人都在白白浪费时间、精力和金钱。那些本可以用来改善生活的资源，转眼间就消失了。多年以后，他们回首往事（其实这只是个谎言……很多人从不反思），才会意识到，即便感到疲惫不堪、濒临崩溃，自己却一事无成。如果你想改变自己的人生轨迹，就必须对这个事实感到厌恶。你必须残酷地意识到，你所做的一切几乎都在徒劳无功。你必须切身感受到这种痛苦，同时将你的消极和积极潜能都铭记于心，并见证积极因素最终战胜消极因素。", "请仔细思考这个问题。", "接下来的7天，请只思考这个问题：如果我一直做出同样的选择，我的人生最终会走向何方？你最终得到的答案很可能并不美好。为了让这件事更具体，拿出一张纸。现在就做。别因为浪费时间看网上那些自以为是的人就忽略这件事。然后，把你今天做的每一件事，以及本周你将要做的所有其他日常重复性事情都写下来。更进一步来说，去公共场所看看。比如超市、快餐店，或者其他熙熙攘攘的普通人聚集的地方。仔细观察他们。我相信他们都是善良的人，但你想变成他们那样吗？你想拥有他们那样空洞的眼神吗？你想拥有他们那样缓慢而疲惫的步伐吗？无论你多么想说服自己不想，如果你继续犹豫不决，那正是你最终会走向的人生。可能需要 7 天或 365 天，但如果你观察的时间足够长，并且对自己真正诚实，你将别无选择，只能彻底改变影响你决策的价值观。通过观察大众，你就会意识到，有意识的健康、事业和自我实现是不可或缺的。", {"h": "没有错误的人生即是死亡"}, "错误的决定也比不做决定要好。但是我们需要做出的决定太多了。你应该专注于事业还是精神追求？你应该学习编程还是学习市场营销？你应该寻找人生目标还是寻找伴侣？你应该尝试纯肉饮食还是低糖饮食？我们正处于历史上的一个奇怪时期，改变人生的选择从未如此之多，以至于你不知所措，最终选择以上任何一种。事实上，你选择哪个选项并不重要，重要的是你做出了选择，即使结果是灾难性的。选择果断意味着你不会做出一个决定就万事大吉，而是会基于更清醒的认知继续做出决定。我一生中做过一系列决定，在别人看来，这些决定很愚蠢、很疯狂，或者根本不值得去做。差不多五年前，我因为舍不得花钱搬出前任的住处，只能睡在客房的地垫上。我当时特别抠门，极其节俭。那时我正在经营自己的副业，后来我决定“管他呢”，除了几件衣服之外，把所有东西都扔了，然后跟一个在网上认识的朋友一起搬去了墨西哥。两周后，我感觉自己犯了人生中最大的错误。我讨厌那里。所谓的“天堂”简直糟透了。我需要一个稳定的家。我的事业开始步入正轨，而卡门海滩的种种诱惑根本无法让我安心发展。", "于是我又做了一个决定。我给在亚利桑那州的朋友打了电话，问他愿不愿意跟我合租一套公寓。但这可不是普通的公寓，这套房子的价格是我这辈子能负担得起的任何房子的两倍。但我相信，在这种巨大的压力下，我完全有能力把生意做好。结果证明，那12个月是我人生中成长最快的时期。我达到了前所未有的精瘦、沉稳、经济稳定和活力充沛的状态。两个大胆的决定彻底改变了我的人生。我变成了一个完全不同的人。到现在，我已经领悟到犯错的巨大力量。它让我明白自己不想要什么。任何“疯狂”的想法都不再疯狂，而是成为人生美好事物的催化剂。移居他国？风险很大，但如果你是一个果断的人，你可以随时回来，因为你可以选择提升技能、赚取更多收入。果断会改变你对可能性的认知。公寓租约到期后，我和现在的编辑搬去了德克萨斯州，和我在推特上认识的朋友达科塔·罗伯逊和JK·莫利纳一起住。六个月后，达科塔因为签证问题不得不离开，从那时起，真正的“错误”就开始显现了。我们搬回了亚利桑那州，租了一套更贵的房子。一年后，我买了我的第一套房子，结果又一次后悔不已。但这次我损失了110万美元，而不是几千美元。我不想这么早就被束缚住。我甚至都不喜欢住在那个地方。两个月后，我又把那套公寓挂牌出售。谢天谢地，最终我只损失了大约10万美元。虽然很痛苦，但很值得，因为我从中获得了无比宝贵的认知，明白了自己想要什么。那只是我犯错的开始。我现在正经历另一个重大的“错误”。这次损失了300万美元，但这是为了获得清晰的思路，而这种清晰的思路可以在很短的时间内让我把所有损失都赚回来。你做出的决定越大胆，犯的错误就越多，从而积累更多经验，确保随着时间的推移，每个决定造成的错误影响越来越小，让你像弹道导弹一样不断向成功迈进。没有错误的人生就是死亡。"], "wcount": 2887}, {"group": "目标、意义与自我认知", "gsub": "找到方向 · 对抗虚无", "icon": "6", "title": "为什么“工作与生活平衡”会毁了你的人生", "paras": [{"h": "为什么“工作与生活平衡”会毁了你的人生"}, "想要拥有精彩人生，就必须做到极致。其实没有人真正想要“工作与生活平衡”。他们之所以认为自己想要这份工作，唯一的原因是他们讨厌自己的工作（即使他们已经说服自己并非如此）。他们的父母成长于工业时代，那时就业机会有限，所以他们向你灌输了他们那套“人生规划”，而你则进入了由政府资助的公立学校，政府的运作也服务于自身的利益，其动力在于让你做好上大学的准备，成为一名有用的劳动者。大多数人希望工作适应生活方式，而不是生活方式适应工作，但他们没有意识到没有人会主动提供这种安排。你必须自己去创造。每次我打电话给妈妈，她都会问我这周都做了些什么，而我的回答总是千篇一律：“一切照旧。走了很多路。工作了很多时间。经常去健身房。”她一如既往地建议我休息一下，放松放松。当然，我妈妈只是在为我好。但问题是……如果有什么东西比我正在做的事情更有趣，我就会去做。即使你现在的处境非常糟糕，如果你冷静思考，总会有一系列步骤可以让你永远不再做自己讨厌的事情，为什么你还要继续做下去呢？话虽如此……平衡是平庸之辈的做法。我这么说不是为了激起你的反应，而是因为这是事实。如果你愿意听，我会证明给你看。读完本文，你就会明白：为什么你的大脑会奖励你走极端，从而让生活更有趣。", "如何避免陷入平庸的中间状态，从而避免终日处于低水平压力之中。", "现代生活充斥着各种各样的安慰剂，你会对这些药物上瘾。", "如何模拟人为逆境来重新掌控自己的人生。", "如果你把这话当真，6个月后你回头看时，会讨厌“平衡”生活这种想法。", {"h": "强度悖论——为什么对比胜过平衡"}, "追求极致会重塑你的大脑。新鲜感和挑战会刺激神经可塑性。你的大脑会根据你痴迷的事物来过滤现实。强度带来专注，专注带来进步，进步带来乐趣。按照今天的定义，对平衡的需求通常源于对所做事情的不享受。你感到需要逃离工作，因为你和工作的关系很糟糕。你不想工作，所以你迫不及待地想回家休息，和朋友们聚会，或者去度假，在那里你终于可以“生活”了。这种心态包含着对工作本质的根本误解。", "工作——当它与你的目标、价值观以及我们常常因为缺乏个人发展而意识不到或不断分心的更伟大的人生目标相一致时——就是与世界分享你自身最美好部分（你所培养的价值）的容器。", "要想做出伟大的工作，你需要灵感、睡眠、健康、成长、经验、知己和人际关系。你必须把生活安排妥当。如果你不喜欢自己的工作，所有这些都毫无意义，因为你根本不在乎工作成果。你只是为了糊口而来。你没有一个让你全力以赴的目标。你只需要顶着宿醉和半死不活的大脑来到办公桌前，勉强熬过一天，然后瘫坐在电脑屏幕前，希望明天不用再重复同样的事情。如果大多数人能用对比来取代平衡，他们的境况会好得多。对比度是强度周期性波动的结果。深度工作后进行深度休息。严格的营养饮食之后，享用一顿丰盛的晚餐。高强度训练后完全恢复。独处一段时间后，再进行社交活动。例如。每个时期都强化并赋予其对立面以意义。你会开始欣赏生活中那些细微的美好，这会让原本平淡无奇的日常生活变得充满乐趣和活力。只要你用心观察，一切都会变得无比有趣。美味佳肴，不常吃反而更美味。工作完成后感到成就感满满，不再为明天那些压力重重的任务而焦虑，休息起来才会更加酣畅。真正拥有值得分享的经历，社交也变得不再那么枯燥乏味。对比是自然界的一种模式：创造与毁灭。潮汐涨落。睡眠和醒来。快乐和悲伤。仿佛宇宙在向我们展示通往美好生活的道路，但你却因为太过固执己见而看不到它。阴阳并非静态的平衡，而是动态的韵律。每一种力量都蕴含着其对立面的种子。例如，如果没有悲伤作为参照点，快乐便无从谈起，它根本不会存在。同时，如果你明白快乐永远不会是永恒的状态，那么悲伤（或其他任何“负面”情绪）就不必将你摧毁。一种情绪会引发另一种情绪。处于中间状态就是违背自然规律，其后果是残酷的：", "平庸的中年——如何快速毁掉你的人生。", "最终目标是拥有一个设计得如此完美的生活，以至于工作、休息和娱乐不再存在。它们融为一体，难以区分。佛教的“中道”并非提倡中庸之道。这是一种在极端之间游走的舞蹈。它意味着拥抱人类体验的全部，而不是因为不喜欢某种感觉就试图逃避它。如果你无法接受黑暗，你就很难拥有光明。“平衡”会造成持续的低度压力和焦虑，因为你永远不会完全投入到任何一方。你总是处于半工作半休息的状态。每天早上醒来，你都会预想到未来那些压力重重的任务。你觉得今天和昨天没什么两样，所以一直以来感受到的压力，你也会一直感受到。没错，你每天都在经历不同的一天，但你的感受却丝毫未变，所以每一天都变得模糊不清。这就是平庸中间阶层的本质。40年后你醒悟过来——为时已晚，无法挽回——你纳闷自己当初为什么不冒险相信自己。但为什么会发生这种情况呢？为什么人们始终意识不到这个陷阱，反而选择朝相反的方向前进？原因有很多。首先是社会制约因素。当你身处不利于自身潜能发挥的生活境况时，社会制约因素是必须始终考虑的根本问题。我会写一封更深入的文章，阐述社会是如何像金字塔骗局一样服务于自身利益的，但现在，你要明白，你的大脑是一台模式识别和目标追求的机器。我们保留着狩猎采集者的心理。我们天生就具有生存本能。但在当今世界，这种本能呈现出截然不同的形式。我们通过基因和模因的双重作用生存下来。身心共同作用。西方互联网时代之前的几代人只知道人生“只有一条正确道路”：接受教育，找到工作，买车、结婚、买房，然后退休。这当然没错，但你的父母和老师会把这些目标深深地印在你的脑海里，这会影响你对机会的感知和行动。由于这些目标塑造了我们，而我们又渴望生存，所以我们也会抗拒改变。摆脱默认的道路是一段痛苦的旅程。如今互联网蕴藏着巨大的机遇，但这同时也要求我们改变生活方式。事实上，这需要我们回到工业化之前的时代，那时大多数人的职业都是自主选择的。教育主要以学徒制为主，大多数人是工匠或农民。以今天的标准来看，他们就是企业家。人们接受正规教育是因为他们认为这是他们应该做的。它象征着很高的社会地位，但它也服务于社会目标。兴趣导向的自学并不引人注目，也并非万无一失。它不要求你参加课程，也没有人会告诉你应该追求什么目标而不是工作，但这却是重新掌控自己人生的唯一途径。这是第一个问题。接下来的情况更糟。", "现代生活充斥着毒品——匮乏造就富足。", "由于普通人生活在可预测的未来或熟悉的过去，总是处于一种焦虑的状态，因此他们会染上毒瘾。现代世界充满了舒适、便利和享乐，这些本意是为了让生活更美好。科技让过去不可能的事情成为可能，但如果你不学习、不创造、不坚守美好生活的支柱，就会带来严重的后果。对大多数人来说，科技带来的乐趣已经变成了毒品。他们会思考明天那些压力巨大的任务。这种压力会削弱他们的思考能力。低意识思维使人难以采取能够改变人生的行动。他们会选择最直接的解决办法：娱乐、食物，以及任何其他能给他们带来廉价多巴胺快感的事物，这样他们就不必经历成长的痛苦。一开始这没什么大不了的，但就像任何药物一样，耐受性越高，需要的剂量就越大。普通人整天沉迷于这些药物，没有更远大的目标去追求，所以他们看不到其中的问题，也没有意识到自己正在降低获得幸福和快乐的能力。极度亢奋感是他们的常态。对他们来说，过度刺激是正常的。他们使用的这类药物越多，对快乐体验就越麻木。改善健康、财富和人际关系不再令人向往，因为你从中获得的dopaamine远不如你以前习惯的那样强烈。如果你想改变人生，就必须像对待管制药品一样对待安逸。方法如下：", "人为逆境——你需要模拟狩猎采集环境。", "你我并非牛，我们生来就不是为了整天吃草，而是为了像狮子一样狩猎。在杂食性进化过程中，我们更接近食肉动物而非食草动物。作为一名智力型运动员，你需要像运动员一样运作。这意味着你要刻苦训练，然后全力冲刺，然后休息，再重新评估。那种认为只要每天坐着同样的时间就能获得线性产出的想法……那是机器的专利。机器适合朝九晚五地工作，人类则不然。——纳瓦尔·拉维坎特", "我们的大脑天生具有狩猎本能，但我们不再生活在狩猎采集的环境中。这意味着什么？你必须模拟逆境，因为逆境在现代生活中很少自然发生。换句话说，你人为地制造稀缺感。你剥夺自己的快乐，这样你的多巴胺信号才能像正常人一样运作。你平时吃清淡但营养丰富的食物，这样当你外出就餐时，才能真正品尝到食物的味道。你训练非常刻苦，所以格外珍惜正常的日常生活。你以短时间高强度工作的方式进行，这样休息和休闲时间就真正用于休息和休闲。你运用科技和知识不是为了麻痹自己免受生活负面影响，而是为了保持对日常生活的敏感度。寒冷或炎热暴露。间歇性禁食。睡眠剥夺周期。在创业过程中自愿忍受贫困。降低你的生活方式。社会隔离期（僧侣模式）。感恩缺失症（如果你经常练习感恩，感恩就成了常态）。数字排毒或社交媒体排毒。除非你打算脱离这个拥有所有奢华享受的美丽世界，隐居在森林里，与世隔绝，拒绝创造财富的新机遇，否则在生活中引入某种形式的人为逆境是确保你的思想不被现代文明摧毁的一种手段。"], "wcount": 3664}, {"group": "财富与一人企业", "gsub": "赚钱 · 技能变现 · 单人商业模式", "icon": "1", "title": "这三个决定将决定你是否能致富", "paras": [{"h": "这三个决定将决定你是否能致富"}, "妄想目标会重塑你的大脑", "致富的唯一途径是：(1) 将你的时间估价为不切实际的金钱价值；(2) 痴迷于致富；(3) 让自己别无选择，只能致富。", "我知道后面肯定有人会喊着“金钱不是万能的！”或者鹦鹉学舌地重复着那些肤浅的“金钱买不到幸福”之类的说法，而这些说法可能来自那些不懂金钱和幸福的人。但这封信是写给那些并非只是为了生气而点开这篇文章，从而完全浪费时间的人的。这封信是写给那些想要毫不掩饰地变得富有的人的。不是因为你是个糟糕邪恶的人，而是因为你脑子里唯一的选择就是按照市场认为你的价值来衡量自己，而这很可怕。就我个人而言，我很早就意识到，每天累死累活 8-10个小时，一年却只能挣到8万到15万美元，而且我什么都不拥有，做着自己不喜欢的工作，这是我无法接受的，尤其是我清楚地看到，有些人从事着有意义的工作，收入却是我的100倍，而工作时间却只有我的几分之一。我年轻的时候可能没有足够的价值赚到那么多钱，这当然是显而易见的，但我知道这是有可能的。我知道，我可以做出一系列决定，从而完全掌控自己的金钱，让它不再占据我的思想、情感和时间。那些不断将金钱道德化、精神化的人，无法想象摆脱金钱束缚的生活。虽然我不能确切地告诉你该怎么做（我的意思是，我可以，但现实的结果因人而异），但我可以给你3种方法来重塑你的大脑，从而做出正确的决定，让你变得富有。换句话说，我可以将一些信念植入你的脑海中，帮助你检验那些更有可能让现实吐出财富的输入。", {"h": "理想的每小时工资"}, "设定并严格执行你的理想时薪。如果解决问题节省的成本低于你的时薪，那就忽略它。如果外包任务的成本低于你的时薪，那就外包……我的理想时薪是5000美元/小时。——纳瓦尔·拉维坎特", "这会让大多数人感到困惑（以前的我肯定也会感到困惑），但我现在的情况是，即使有人出价5000美元让我进行一对一咨询，我也不会答应。不是因为我不需要这笔钱，也不是因为我不想帮助别人，而是因为这意味着要投入时间、精力，并且要确保提供价值5000美元的服务。这是一份重大的责任，需要我优先考虑，而不是其他可能更有价值的事情。如果我把注意力分散到其他事情上，那就太愚蠢了，因为我很清楚该怎么做才能在一个小时内赚到更多钱。设定理想的时薪的目的就在于此：为了做出更好的决策，并调整心态去注意到那些能让你处于更有利地位的机会假设你买了一件价值 50 美元的商品，但它有缺陷或损坏。你会花一个小时费劲地去退货吗？如果会，说明你对自己的时间估值只有每小时 50 美元，甚至更低。这本身没什么“坏”的，但它揭示了一个更重要的事实：你没有意识到，你本可以利用这一个小时去解决一个能让你赚到 500 美元——甚至 5000 美元的问题。如果你意识到了这一点，那么花一个小时去退货就毫无意义了。如果你期望的每小时工资水平感觉并非遥不可及，那就说明这个水平太低了。为什么？妄想目标会重塑你的大脑。你的大脑此刻正根据你正在学习和思考的内容（包括这封信）进行重塑。当你想象一个更美好的未来时，它会激活与你亲身经历未来时相同的脑网络。每一刻专注的注意力都是一次重塑大脑的机会，使之与你想要成为的人保持一致。这也是那些沉迷于负面信息和不善于管理自身输入（无论是精神上的还是物质上的）的人，正在一步步走向自我毁灭的原因之一。除此之外，在追求目标的过程中，多巴胺的分泌量会比达成目标时更高。但这恰恰是危险所在。整天想象你的目标确实能促进学习，但前提是你必须将其与来自现实世界的最佳挑战相结合。你需要真正地“参与”其中。否则，这只会变成一种精神上的自慰：你只是告诉所有人你的目标，以此来获得廉价的多巴胺刺激，却从未真正付诸行动。挑战的最佳难度区间约为85%。既不会高到让你焦虑，也不会低到让你感到无聊。逐步增加的挑战带来的压力会释放去甲肾上腺素，从而进一步促进学习，并帮助你适应这种新的思维状态。所以，你不能只是想想你期望的时薪，然后祈祷自己能赚到更多钱。你需要根据利率做出艰难的决定。首先，不要退货。你会没事的。", "集中力量是致富的唯一途径。", "如果你想致富，致富必须是你最迫切的愿望。至少要等到致富的念头深深根植于你的潜意识中，以至于你不需要花费太多脑力去执行这些念头，就像职业篮球运动员不需要思考就能随时投进三分球一样。这条原则适用于任何你想取得成功的事情：集中精力是实现远大目标的唯一途径。你需要全神贯注，将尽可能多的精力投入到那个目标中。", "但是外出呢？享受生活呢？参与社交活动呢？追求西方意义上的幸福（一种不可能持续的欣快状态）呢？好吧，你不会创造财富，因为这并非你的首要目标。这完全没问题。你不必以致富为目标，但很多人却以此为目标，而他们对人生意义的理解和你一样错误。如果一个人没有把致富作为首要目标，那么他/她也不会意外致富。在未来40年里，把一些钱投资到股市，这的确是让你在晚年享受到一笔可观财富的一种方式，但如果拥有足够的知识，谁不想在30年前就拥有那么多钱，甚至更多呢？哦，对了，把致富作为首要目标并不会让生活变得更糟，反而会让生活变得无比美好。职业运动员的生活很糟糕吗？可能并非如此，他们大部分时间都在做自己热爱的事情。那么，为什么不把同样的逻辑运用到商业领域呢？一个人在自己选择的领域里力求做到最好，难道就不能拥有美好的生活吗？有人认为，幸福是取得进步和为比自己更伟大的事物做出贡献的结合，因此，当你不受干扰地追求进步，并且大规模地解决有价值的问题时（这就是创业的意义所在），生活就会比普通人快乐一千倍。是的，你仍然需要做生活中必须要做的事情，但这样做会让你感到痛苦。这种痛苦会影响你的决策。因为你越是忍受痛苦，就越不会采取行动去改变它。为了使之更具体，首先列出你不做的事情。有些事真的不值得你浪费时间。比如咖啡会、退一些没意义的东西、无聊时刷手机、因为缺乏热情和刺激而参加派对、准时回复所有人的短信（这一点尤其愚蠢，因为没人喜欢别人随时都能联系到自己）。还有一些可以外包或忽略的小事。遇到这些事时，坚定地说：“我不做。”然后，列出你要做的事情清单。让你的实际时薪与理想时薪相符的事情。学习能大幅提升你收入潜力的知识。练习能让你自立的技能。创业。加入初创公司。争取管理职位。学习和成长。你越反思自己的行为，就越容易明白自己为什么不富有。", "别无选择，唯有成功。", "我做过的最明智的决定总是利用金钱作为激励手段，去创造更多财富。换句话说，我投资了我负担不起的东西，但我学会了相信自己能更快地赚回本钱。我的收入第一次显著增长发生在我花了1500美元购买了一套电子邮件营销和产品托管软件之后。当时，这笔钱对我来说弥足珍贵。花掉这笔钱让我内心无比煎熬。点击“购买”按钮的那一刻，我感到一阵焦虑。但正是这种煎熬驱使我拼尽全力去赚回这笔钱，仿佛我的生命都系于此。它迫使我学习如何运用营销、文案写作和销售漏斗方面的知识来最大化这笔钱的价值。有了这笔购买，我无需再去猜测应该学习哪些“高价值”技能。很明显，如果我掌握了这些技能，我的收入潜力就会大大提升。当我不断搬家时，同样的事情也发生了。每一套公寓都比上一套更贵，每一套都超出了我的承受范围。表面上看，我似乎只是生活方式不断攀升的又一个受害者。但实际上，这是一种现实生活中给自己设定的期限，而我知道自己能够应对这项挑战。我把自己置于未来生活的环境中，我别无选择，只能继续过着我不再想要的生活。", "这三个决定——设定一个理想的时薪、集中精力、以及让自己别无选择只能成功——创造了完美的条件，让我赚到了比年轻时的自己想象中更多的钱。这些决定都不涉及纠结于“该学什么技能”或“该选择什么商业模式”。我根本没时间考虑这些。我必须全部都学。当然，这其中经历了很多失败和反复尝试，但这是社交媒体，谁会谈论这些呢？虽然我并不提倡快速致富，但如果你按照这封信里提到的方法创造合适的条件，你会惊讶于自己致富的速度。事实上，我认为你可以在两周内学会任何技能（并且比99%的人都做得更好）。我会在另一封信里再写。"], "wcount": 3263}, {"group": "财富与一人企业", "gsub": "赚钱 · 技能变现 · 单人商业模式", "icon": "2", "title": "你可以赚更多的钱", "paras": [{"h": "你可以赚更多的钱"}, "体力劳动报酬与情感劳动报酬", "有两种人会读到这封信。第一类人只看到了标题——“你可以赚更多钱”——却没来得及独立思考。他们脑海中某种警钟响起，根深蒂固的思维模式被激活，立刻列举出一大堆理由来反驳这种说法。无论他们如何看待，“金钱”这个词都会让他们怒火中烧。他们开始喋喋不休地谈论精英阶层，说应该对他们征收更多税，让他们养活全世界。或者他们走上“高尚的贫穷”路线，告诉你最好的生活方式是默默无闻地生活，却默默地被他们曾经发誓要抵制的金钱所压垮，因为金钱正是社会的命脉。或者他们开始说教。天哪，真是烦人。他们用某种权威的意识形态来说话，好像这就能解决所有文化、所有情况、所有人的万能问题。然而，他们赚的钱始终没有超过市场对他们价值的评估。他们被自己憎恶的体制束缚，却心甘情愿地留在其中。他们缺乏经验，于是胡乱发表一些想法，试图以此逃避积累经验的义务。其次，还有第二种人。当你听到“你可以赚更多钱”这样的话时，你完全没问题，因为你知道你听到的是一种观点，你必须在让这种观点进一步渗透到你的思想中之前对其进行检验。我个人很喜欢这句话。它简洁明了地表明，你至少对自己的财务状况有一定的掌控权。你不必通过精打细算来创造财富。你不必拼命工作，直到你的 401k 退休金账户里的钱足够你再也不用工作（那样只会让你更加痛苦，工作是为了平衡休息）。而且你尤其不必终生省吃俭用，把零花钱投资到股票或房贷上，从而有效地强化一种匮乏心态，这种心态会渗透到你生活的其他所有方面。事实上，你完全可以赚更多的钱。虽然我无法提供一个完美适合每个读者的具体行动计划，但我可以给出一条在许多人正在走的“安全可靠”的道路之外创造财富的原则。", "抱歉，你所谓的“经济困难”并不存在。", "想要赚更多钱，第一步就是修复你与金钱之间有害的关系。你需要意识到自己是如何看待金钱的，以及为什么会有这样的想法。否则，再多的赚钱机会也无法进入你的视野。一个一心只想拿到学位然后退休的人，是看不到身边唾手可得的商业机会的。身份认同对金钱意识的影响非常大。我以前觉得赚钱像个神秘的过程。做生意的概念对我来说完全行不通。我当时唯一知道的赚钱方法就是努力考个更高的学位，然后拼命找一份自己并不喜欢的工作。我从小就被教导要存钱、制定预算、每个月投资一点……你知道，这跟富人实际的做法完全相反，但小时候不懂这些，父母也不懂，因为他们的父母也不懂。媒体总是把有钱人描绘成坏人，这也加剧了我的这种想法。我们从小受到的教育确实有一定影响。就是这样。金钱问题并不存在，心理问题才存在。我一旦变得过于节俭，节俭就开始控制我，让我难以控制自己。而当我几乎不加节俭地花钱时，节俭似乎又会卷土重来。大多数人无法赚钱、守住钱财或明智地使用钱财，归根结底是他们的信念问题，因为你的信念决定了你能注意到并抓住的机会。普通人对金钱的看法包括：赚钱不容易。金钱不像健康、人际关系或个人技能那样可以掌控。金钱本身是邪恶的，而不是使用金钱的人。创业是那些每天工作 12 小时的卑鄙推销员才会做的事。每个商家都想骗你，任何靠自己打拼的人都是骗子。个人成长和财务增长是相互独立的，没有联系。在你的领域或工作中，赚不到很多钱。信念并非现实。如果你在未经过充分质疑和实验的情况下形成信念，那么这些信念几乎百分之百是错误的。如果你还没赚到很多钱，那么明智且稳妥的做法是假设你对金钱的任何反应都是错误的。任何逃避面对这一事实的理由，都是别人灌输给你的观念，因为你缺失了最重要的信息来源：直接经验。", "财富是长期不确定性的副产品。", "大多数人从小就被灌输这样的观念：金钱来源于辛勤工作。但你越是质疑这一点，就越会意识到劳动价值论开始瓦解。以建筑工人为例，他们的工作极其辛苦。长时间从事体力劳动，而且常常需要在恶劣的天气条件下工作。他们虽然能挣到不错的收入，但收入上限却很低，因为时间和劳动力作为资源是有限的，尤其是在为他人工作，收入由他人决定的情况下。如果这位工人能够创办自己的公司，他们的收入潜力将大幅提升，但实现这一目标的路径却充满不确定性。", "现在，我们来谈谈个体经营者，也就是自雇人士。虽然不确定性相当高，但你可以掌控大部分资源的分配。你可以出售自由职业服务，赚取可观的收入，比如像 Designjoy（一家单人设计公司）那样年入百万美元，但你一天的时间毕竟有限。你也可以出售信息，但收入上限在 500 万到 1000 万美元之间。这两种方式都算是比较简单的创业模式。别误会我的意思，这笔钱足以改变人生，而且对于创业者来说，单人企业可能是最佳选择，但创造财富需要更多。看看科技公司的CEO，他们就算休假一个月，公司依然会发展壮大。他们的收入并非完全取决于他们的工作努力程度，当然，努力工作肯定有所帮助。最后，想想那些通过投资致富的人：股票、加密货币、房地产、收购等等。将大部分资金投入到有风险的投资中，要么大获全胜，要么血本无归，要么血本无归，这就是不对称收益背后的驱动力。当我们层层剥开表象，观察这里发生的事情时，一种模式浮现出来：你的潜力取决于你愿意接受多少不确定性，再乘以你能承受这种不确定性而不至于发疯（或毁掉你的生活）。换句话说，就是风险。你承担风险、管理风险以及在多年跌宕起伏的人生起伏中保持清醒头脑的能力。你从出生起就被灌输了安全稳妥的人生道路，而这恰恰是你难以理解这种现实的原因。辞职创业显然风险很大，所以大多数人不会这么做。把一大笔积蓄投资到某种稀奇古怪的数字黄金上，简直是愚蠢至极，但看看几年前那些以1美元买入比特币的人吧。更进一步说，如果在长达十年的时间里，一边承受着巨大的盈亏，一边不断承担更大的风险，那大多数人都会破产。但你来这里是为了学习如何做到这一点，而且有一些方法可以减轻不确定性。", {"h": "如何才能赚更多钱"}, "大学期间，我残酷地意识到，为别人打工永远无法创造财富。这是第一步。你需要创业。当然，你可以努力工作，找到一份高薪工作，直到攒够钱投资股票或创业，但即便如此，你仍然需要足够的资金才能获得实质性的回报。你需要现金流。你需要至少一份收入来源，让你有可支配收入去承担更大的风险。如果你不想这样做，说明你仍然不明白财富源于风险。更何况，人工智能的颠覆性变革将导致就业向创业的巨大转变。创业是最后的堡垒之一。意识到这一点后，我开始尝试各种可以想象到的商业模式。代发货、营销代理、自由职业，等等等等。问题就在这里……大多数人没有条件承受长达 2-4 年的这种程度的不确定性，直到他们掌握了随时赚钱所需的技能。", {"h": "1.战略性贫困"}, "你需要对冲不确定性，这样才能坚持下去而不至于毁掉自己的生活。你暂时限制生活中某个领域的发展，以增加另一个领域的潜力。对我来说，这意味着要和另外7个男生（最多的时候是8个）合租一套五居室的房子，这样每月房租就能降到300到400美元。我只需要支付汽油费、足够的钱准备饭菜（每周大约50美元）、健身房会员卡，以及偶尔和朋友出去玩的零花钱。", "我真的没什么可失去的了。我靠着一份最低工资的兼职勉强糊口，剩下的时间都用来想方设法维持生计。对你来说，情况可能完全不同。你们中的许多人并非20岁的单身青年，无法安于空荡荡的公寓里只有一张铺在地上的床垫和一把当沙发用的躺椅。你可以从小风险开始，逐步扩大规模。低风险的商业模式，每天只需工作一小时。你可以比自己感觉舒适的期限更长时间地从事现在的工作。你证明了自己可以建立一份稳定的收入来源，并用多余的收入来换取更多的时间。最后，你可以慢慢地扭转生活方式膨胀的局面。就像帕金森定律一样，我可以保证，你的生活方式已经膨胀到足以填满你应得的收入。是的，这会很痛苦，因为如果你墨守成规，按照既定的成功模式行事，你就无法承担那些真正通往成功的风险。", {"h": "2.能赚更多钱的按钮"}, "这不是一封关于如何赚钱的文章。这是为了让你相信，你实际上可以赚更多钱。对大多数人来说，这来自于做一些事情。首先，你需要选择一种商业模式。哪个都行。信息产品、教练辅导、自由职业、代理工作、电子商务、软件开发，这些都可行。大多数人只是无法应对不确定性，还没来得及掌握足够的知识就放弃了。明智的做法是选择无需团队或资金就能起步的项目，这样一来，你的选择范围就往往局限于前四种了。我显然无法在这里教你如何建立这项业务。但我相信你可以利用人工智能、YouTube、课程等资源，学会如何去做，而无需陷入教程的泥潭。", "但真正的魔力并不在于商业模式。商业模式会随着技术和市场的变化而改变。由此，你便有了两个杠杆，需要学习两项技能。第一点是吸引注意力，第二点是转化注意力。", "对我来说，这指的是在线写作和数字产品或服务。你需要通过学习说服技巧、社交媒体运营和讲故事来吸引注意力。这些技巧都需要实践才能掌握。你需要打造个人品牌，开始进行陌生拜访。你可以从一个渠道入手，不断尝试各种策略，并纠正错误，直到它成为一个可持续的渠道，让人们了解你和你的事业。你需要学习销售、市场营销和产品/服务开发技巧来吸引注意力。你已经获得了注意力，但你需要引导它，让它看到你提供的产品或服务的价值。当你在这些领域经过至少一年的反复试验后，你应该会开始感觉自己掌握了一些特定的技巧，可以按下这些技巧来赚更多的钱。", {"h": "3.提高你的情绪单次最大重量"}, "身体力量是通过逐步增加负重来增强的。情感力量是通过逐步承担更多责任而建立起来的。", "问题在于你已经背负了太多的负担。你可能要养家糊口，还要承担车子、工作，还要时刻背着杠铃，上面堆满了45磅的杠铃片。你不断地尝试举起你根本无法达到的极限重量。当你拥有更多需要失去的东西时，大脑的威胁检测系统就会变得异常敏感。你不仅仅害怕创业失败，你还害怕人生的大部分都会因此而黯然失色。这是最难的部分。只有你自己才能决定如何精简生活，从而腾出空间去承担更多风险。我建议你本周好好思考一下这个问题。出去散散步。把所有想法都倾泻到笔记本上。尽一切努力理清思路。"], "wcount": 4020}, {"group": "财富与一人企业", "gsub": "赚钱 · 技能变现 · 单人商业模式", "icon": "3", "title": "金钱的三个层次（如何摆脱工资奴役）", "paras": [{"h": "金钱的三个层次（如何摆脱工资奴役）"}, "如何追求你的人生目标", "每个人都在玩以下三种金钱游戏中的一种：", "生存（90%的人）——挣足够的钱活下去。金钱至上。", "成功（占9%）——收入足以让你在社会中占有一席之地。金钱是衡量成功的标准。", "神圣阶层（占人口的1%）——赚足够的钱去进行真正意义上的创作。金钱即能量。", "所以，金钱并非万恶之源。这种想法显然属于第一层思维。而这种思维方式极具破坏性，它会蔓延到你生活的方方面面，让你变成一个怨恨的受害者，感觉自己对生活毫无掌控力。过去，只有那些能够积累大量资金或人脉的人才能达到第三级。你的居住地、社会地位、教育程度和家庭背景在很大程度上决定了你的未来财务状况（但这并不意味着所有第三级人士，甚至很多第三级人士都达到了第三级）。但现在，得益于创意经济和数字化手段，这一切比以往任何时候都更容易实现。（稍后，我们将讨论一种“元模型”，它能让你无论处于哪个阶段都能追求自己的人生目标。）", "你看，人类历史有四大时期。在狩猎采集时代，没有货币这种抽象概念。人们直接进行商品交易。这是一种纯粹的价值交换，通常以赠予的形式出现。在农业时代，人类可以生产更多商品，不再那么专注于生存。虽然牛、盐和贝壳等物品仍然存在直接的价值交换，但真正意义上的“货币”雏形开始出现，例如以金银等贵金属为基础的货币。你可以把它看作是货币的1.0版本，它仍然以生存为基础。在工业时代，随着资本、投资和规模的扩大，货币2.0开始出现。对物质成功的追求在此之前就已存在，但如今这种追求正在迅速加剧。", {"img": "dan19_01", "cap": ""}, "在信息时代，得益于数字杠杆、创意经济和意义驱动型市场，货币 3.0 已大规模成为可能。", "问题在于，你不可能一蹴而就地“跳”到人生的第三阶段财富积累。而且，很多身处数字经济时代的人仍然保留着生存和成功的思维模式。当前社会对金钱的态度是：大多数人厌恶自己与金钱的关系，但同时又迫切需要金钱。", "当今世界充斥着典型的打工仔、兼职者和精打细算者。我不是想居高临下地说话，我只是在陈述显而易见的典型特征。在本文中，我想为你提供一条克服你与金钱之间有害关系、赚取足够的钱摆脱工资奴役、并最终追求你毕生事业的道路。如何摆脱工资奴役。金钱第一阶段的不幸现实是，你很难敞开心扉去发现新的机会。工作被视为一种必要的苦难。时间是唯一赚钱的方式。退休是唯一的解脱，你只希望接下来的40年能够过得去。你与金钱的大部分关系都源于父母的教养，如果你的父母没有达到更高的发展水平，你就会继承各种模式，例如以追求高薪工作为最终目标，将剩余的钱存起来以备不时之需，向下比较而不是向上比较（至少你没有无家可归！），以及真心希望自己能中彩票。人类 3.0 模型中概述的第一级思维的特点是认为做事只有“一种正确的方法”，这通常是基于你被灌输的信念。第一层级的金钱观并不局限于一份工作。但工作是目前这种思维方式最常见的体现。人们即使有工作，也可以达到第三层级的金钱观，但这需要满足一些条件。这种低意识的思维方式会逐渐渗透到你的精神体验中，阻碍你在该领域的成长。每个星期一，你都会感到一种恐惧。每个星期五，你都盼望着能有暂时的解脱。当你查看银行账户时，压力就会涌上心头，你不得不不断地计算自己能花多少钱。更糟糕的是，这会导致一些你无意识的行为模式（这些行为模式会阻碍你前进，直到你解决它们）。你会认为富人不道德或只是运气好，但这显然是一种错误的概括。你会通过抱怨自己的处境来与朋友建立联系，从而强化自己的身份认同。你会把吝啬误认为智慧。最后，你会制造一些戏剧性事件来寻求生活中的刺激感，而不是把精力投入到真正令人兴奋的目标中。虽然听起来很糟糕，但这却是正常的发育阶段。每个人都从第一级开始，有些人经历各种事情后就能更快成长，而有些人则会终生被困在第一级。我们不希望这种情况发生。", {"h": "通往第二关的路"}, "以一家中型公司的市场协调员为例。我们就叫他马克斯吧。他年收入大约4.5万美元，背负着沉重的学生贷款，但至少他“有份正经工作”。一天工作结束后，他喜欢和朋友们一起玩游戏。周末，他会和朋友们去体育酒吧。每周伊始，他都会花几天时间从周末的放纵中恢复过来，无论是精神上、身体上，还是心灵上（淘气的Max）。一天午餐时，马克斯偶遇了他的老朋友。他们聊起了钱。他们在一家新兴科技创业公司工作，收入是他的三倍。他们提议找个时间一起吃顿饭，但去的餐厅马克斯觉得消费太高。回家后，他盯着天花板发呆了一会儿，决定申请目前公司高级协调员的职位。结果却因“缺乏经验”而被拒。不久之后，这个年薪6.5万美元的职位被一位外部人士填补了，而且这位新人更年轻。这场游戏被操纵了。星期一的恐惧感愈发强烈。游戏是他唯一的消遣，但玩久了也会觉得无聊。“真好啊，”他心里对每一个他看到略有成就的人这样想。出于这种厌恶感，他决定对人生进行一番思考。3%的涨幅=5年5.2万美元。租金价格每年上涨200美元/月。还有9年才能还清学生贷款。利息正在不断累积。他没有积蓄买房，可能到了40岁仍然一贫如洗。如果有人走进他的生活，他的经济状况可能会更糟，而且在这个时代，谁会愿意和他在一起呢？不和谐感像卡车一样击中了他。如果他继续这样做，他的生活只会变得更糟。他买了10本自助书籍，看了Alex Hormozi的所有视频，加入了4个副业学习社群，还在社交媒体上私信别人说：“教我怎么赚钱。”他反而感到更加困惑了。5 个月过去了，他尝试了代发货、加密货币交易（亏损 500 美元）、开设亚马逊 FBA 商店，甚至还尝试用 Vibe 编程开发应用程序。然后他突然意识到，他除了一个技能之外，没有任何其他真正的技能。他在公司负责谷歌广告。为了练习工作技能，他决定优化现有的广告系列。他的老板开始注意到这一点。当你决定开创属于自己的道路时，最好的起点是找到痛点、培养热情或发展现有职业。你已经拥有可以转化为独立收入来源的经验。你可以解决自身的痛点，追求自己的热情，或者将你在现有职业中积累的技能与新技能相结合。Max 在 Twitter 上看到一个帖子，讲解如何开始使用 Google Ads 做自由职业者。真是不可思议的巧合。", "他那天晚上彻夜未眠。六个小时感觉就像三十分钟。他开始觉得一切都有规律可循。午休时间变成了Reddit搜索时间。通勤时间变成了YouTube大学学习时间。游戏时间变成了深度工作时间。他控制不住自己。他甚至连酒吧的邀请都不回复。他的通知堆积如山，上面写着：“兄弟，你都去哪儿了？”10个月后。他说“去他妈的”，然后给当地一家健身房发了一封电子邮件。“我可以通过广告帮你拓展会员。只有广告奏效才需要付费。”健身房老板决定冒险一试。第一周，新增3名会员。第二周，新增10名会员。马克斯靠自己的努力第一次赚到了500美元。他感到内心发生了变化。既然有这样的选择，为什么还要继续过着同样的生活呢？这很艰难，被拒绝的打击比新客户带来的痛苦更甚，但他感觉自己好像找到了方向。这种感觉挥之不去。第十三个月到了。他的副业收入只有正职收入的一半。到了第14个月，他们的收入仍然一样。第十五个月到了，他辞职了。新游戏，新问题，但他感觉自己多年来第一次真正活了过来。马克斯成功的背后机制是什么？他是如何进入第二关的？他经历了三个截然不同的阶段。发展阶段。", "认知失调——他体验了现在的生活，对他来说一切都习以为常。然而，通过规划未来，他终于意识到自己的人生走向何方，而一系列不公事件的发生彻底击垮了他。他内心充满了愤怒和冲动。", "不确定性——他将对现状的厌恶转化为动力，开始尝试各种方法，尽管他自己并未意识到这一点。他学到了很多，几乎想要放弃，但最终凭借坚持不懈取得了成功。他获得了技能和知识。", "顿悟——他意识到自己确实拥有可以发挥的潜在价值，而其他人正需要这种价值。他可以将精力集中在一个领域，却无法自拔，反而深陷其中。", "除此之外，他还进入了一个阶段——一段紧张而痴迷的发展时期，将数年的成长压缩到了几个月内。他因为一次故障而被推入那个频道——一个高风险的加速器，具体来说，是一场人生危机，以及残酷地意识到自己不想过的生活。这些阶段、渠道和故障是所有领域的模式，而不仅仅是金融领域。如果你想了解生活中某些领域的发展水平、必须经历的阶段以及加快成长的策略，请学习HUMAN 3.0。第一笔款项到账后，他的身份发生了转变。他达到了第二级。持续的业绩巩固了他的这一身份，并让他在接下来的几年里不断进步。", {"h": "如何追求你的人生目标"}, "每个人都喜欢达到财富等级3的想法：", "工作就像玩耍一样轻松愉快。自律是你的常态。金钱不会占据你的全部心思，但你却能赚到你想要的钱。你迫不及待地想每天早上起床，去做自己热爱的事情。你对客户充满责任感。他们的成功就是你的成功。学习和赚钱融为一体。你以往的所有技能都能为你带来收益，让你从任何兴趣爱好中都能获得收入。人们常说“放松点，好好享受生活”，但你却不想做任何其他的事情。你不需要逃避。问题是，模仿并不能让你达到3级。虚假转变：指某人模仿更高层次的外表、语言或行为，但实际上并未达到那种境界。例如，你可能是一个“显化教练”，却使用操纵性的销售手段，并且因为生存挣扎而极度渴望金钱。首先，你需要解决 1 级的问题才能升到 2 级。然后，通过解决 2 级的问题，你就可以升到 3 级。这就是发展的本质。如果人生中只有一件事能迅速提升生活质量，那就是解决问题。就是这样。但问题的本质在于，只有先解决前期的问题，后解决的问题才会出现。你的思维无法从较低层次的问题出发去理解更高层次的问题。在第一阶段，也就是以生存为特征的阶段，你最终会厌倦平淡的生活。你会厌恶这种平庸的人生。所有你之前未曾察觉的问题瞬间浮出水面，你可以选择解决它们，也可以选择继续维持现状。第二阶段的特点是成功，一旦你尝到了成功的滋味，最终你会感到空虚。金钱固然丰厚，但你实际上只是把自己变成了朝九晚五的新人。", "1级的人听到别人这么说，就会认同。他们总是以各种不同的说法来否定“所有富人的生活都毫无意义且物质至上”。他们固执地接受这种观念，把自己困在了第一层思维模式中。他们甚至不愿尝试去赚更多的钱，仅仅是因为这种观念，而不是因为自身的经历。大多数人之所以困在第二层级，是因为他们认为摆脱空虚感的办法就是停止赚钱。这大错特错。你赚多少钱，反映的是你解决问题的层次。在第三层级，金钱体现的是复杂的发展和价值。", "以 Loom 的创始人为例。他花了数年时间打造Loom。他有自己的目标，一种梳理思绪的方式。后来，他以近10亿美元的价格卖掉了Loom，从此衣食无忧。然而不久之后，他陷入了生存危机，感到沮丧。他基本上停止了在职业领域解决问题，而由于他的身份认同主要体现在这个层面，他没有意识到应该为他人（身、心、灵）投入足够的精力。问题是，如果 Loom 真的是他毕生的心血之作，它就不会出售。在第一层、第二层或第三层，你都可以赚到数百万美元——但你在每个层级与金钱的关系截然不同（生存、成功、神圣）。只要你不停滞不前，每个层级都能带来深刻的满足感。幸福就是克服阻力。金钱的“邪恶”程度取决于你在其他生活领域的发展水平。如果你只关注金钱，而忽略了精神或心灵的成长，那么你将无法意识到自己对文明的影响。如果你在身心灵方面都处于初级阶段，那么这种状态很容易渗透到你对金钱的追求中。", "以上面提到的Max为例，他可能会意识到自己正在为一家保健品公司投放谷歌广告，这家公司通过销售速效“减肥药”来欺骗那些天真的顾客。Max越是帮助这家公司，就越会在第二层级伤害他人；如果他不重视这一点，就可能开始窥探第三层级。", {"h": "第一步 经历意义危机"}, "改变人生的第一步就是“超越”你所处的阶段。但如果你还没有通关，你可能不会读到这篇文章，或者你只是出于纯粹的好奇心才读到这篇文章。改变人生的第二步，就是彻底厌倦现状。第一阶段，你厌倦了按照父母或社会强加给你的剧本生活。第二阶段，你厌倦了孤立地追逐成功和地位。这并不意味着你要“离开”这些阶段，而是意味着你要超越它们，并吸收其中最有益的部分。每个阶段都是你不断成长的人生观的一部分。所以，你需要一种反视觉。你需要开始构建一种能够让你不断成长的全新视角。你需要一种积极的负能量来源，它能推动你走向未知领域。如果你处于第二阶段，请问问自己：", "五年后，如果你的收入翻了一番，但内心依然感到空虚，你的日常生活会是什么样子？你能接受这样的生活吗？", "为了赚更多的钱，你还在生活的哪些其他方面做出了牺牲？", "哪些类型的工作、客户或顾客会让你感到内心麻木？", "你会成为怎样一个“成功”的人，以至于过去的自己会感到惋惜？", "你认为毫无意义的一天是什么样的？有意义的一天又是什么样的？", "如果你的唯一身份就是你的收入，你会成为什么样的人？", "如果你的大部分时间都被你讨厌的工作占据，你的人际关系会变成什么样？", "让这些想法引发你的思考，想想如果你不改变，你的生活最终会变成什么样子。", {"h": "第二步）尝试所有方法，找到最重要的那一个"}, "学习和创造。这些是任何层次的人都必须养成的核心习惯。探索未知的途径在于获取知识（学习）、技能（积累）和经验（实践）。如今，你拥有了一种反愿景（随着思考的深入，这种愿景的力量会不断增强），你的思维将开始注意到那些之前可能与你擦肩而过的机遇。大脑是一台模式识别机器。当你有了明确的目标（想要什么以及不想要什么）时，大脑会通过增加多巴胺分泌来传递重要信息。", "每天至少留出一个小时用于新的爱好。阅读新书。关注新账号。换个环境。开展新项目。任何项目。软件。设计。照片。视频。写作。一项事业。一段身体。一段关系。一种新的思维方式。醒来就能随心所欲，怎能不感到兴奋不已？减少在金钱上花费的时间，投资于心智、身体、精神和人际关系的提升。你在这个阶段的目标是让你的思想和理念沉浸其中，从而拓展到第三层次的视角。不要被“闪亮物体综合症”所迷惑，因为你可以整天积累知识，但如果经验不足，你将一无所获。在这个过程中，要时刻留意那些你想要融入生活的有意义的想法、习惯和活动。", "经过 3-6 个月甚至更长时间，你应该会积累足够的清晰思路，从而有足够的信心完全过渡到新的事物中。这是实施战术压力的最佳时机。搬到全国各地。把大部分积蓄投入到一项新的事业中，这样你就会感受到必须成功的压力。把自己置于生死攸关的境地。大多数情况下，这会促使你进入一段高速发展的时期，开启你人生的下一个阶段。", {"h": "步骤 3）为你的人生事业选择一个元模型"}, "追求人生目标的方式有成百上千种。显然，我不可能在这里一一介绍。但我可以谈谈任何人都可以尝试的一种新方法。我称之为“元模型”，你现在看到的就是它。该元模型正在成为创造者。并非严格意义上的内容创作者，而是你作为一个人本质的体现。（我们将在下一封信中讨论内容创作的三个层次。）以乔丹·彼得森为例（无论你对他有何看法）。他并非内容创作者，但他创作内容，因为这是实现他毕生事业最有效的途径之一。他著书立说，创办在线学院，开发软件，主持播客节目，并进行公开演讲。他从自己的专业领域起步，并在互联网上将其发扬光大。他肩负着一项意义非凡的使命，并充分利用一切可用的工具。如今，这些工具就是数字化工具。任何企业或创业活动在某种程度上都需要媒体。个人现在拥有的权力远超以往任何时期，而且这种权力只会继续增长。这种权力转移分三个层面进行。互联网使人们能够获取任何知识。权力从学校和机构转移出去。社交媒体赋予了人们吸引自身受众的能力。权力不再掌握在雇主、出版商、中心化媒体甚至唱片公司手中。人们现在可以学习、创造和赚钱，而无需依赖他人的权威。人工智能赋予人们创造、自动化和外包几乎任何事物的能力。权力正在从传统的把关人和中间商手中转移。人们很快就能以极少的人力完成大型团队的工作。这为什么重要？它促成了意义驱动型市场的出现。没错，确实存在一些思维水平一般的“网红”，他们擅长利用网络影响力或吸引注意力，但你也可以运用同样的工具做出更大的贡献。", "这种新的数字杠杆包含以下几个要素：", "零边际成本分配——同样的努力，你可以与一个人分享，也可以与一百万人分享。", "无需许可即可触达受众——无需守门人、出版商或机构即可接触受众。", "复合增长——一次创建的内容即使在你睡觉时也能持续产生效果，全天候24小时不间断地积累受众。", "全球覆盖——通过Wi-Fi触达全球人口，找到那些能与你的信息产生共鸣的特定人群。", "AI 放大——能够倍增创意产出、处理重复性任务的工具，让您专注于独特的视角。", "直接变现——无需中介即可让支持者即时付款的平台", "现在，这个人可以追求任何兴趣或从事任何工作。如果你对某件事感兴趣，那么肯定还有一群人也感兴趣。如果你有自己擅长的领域、热情所在或职业，并且能够帮助到其他人，那么这就足以证明你的价值。得益于科技，现在一个人就能完成以前需要 10 到 100 人团队才能完成的工作：", "一家个人媒体公司（博客、新闻简报、播客、YouTube）。一个教育平台（课程、辅导、社区）（人们并非讨厌课程和教练，他们讨厌的是一级课程和教练，因为它们往往是骗局，是虚假的蜕变。）软件产品（使用无代码工具、人工智能辅助或纯粹的学习和意志力）。实体产品（按需印刷、代发货、小批量生产）。无论经济水平如何，这都是可能的。当然，如果你已经达到2级，或者已经拥有一定的财富，那么过渡就会更加容易。你之前在理财方面积累的技能越少，你需要学习和积累的东西就越多。我生于互联网时代，所以我的事业也是从互联网起步的。由于当时我还处于初级阶段，我尝试了7种不同的商业模式都失败了，之后找到了一份网页设计的工作，最终又回到了创作者的行列。五年过去了，虽然我不能说自己已经达到第三阶段，但工作从未让我感到如此契合和愉悦。我无法想象自己去做其他任何事。"], "wcount": 7175}, {"group": "财富与一人企业", "gsub": "赚钱 · 技能变现 · 单人商业模式", "icon": "4", "title": "普通人如何通过人工智能致富", "paras": [{"h": "普通人如何通过人工智能致富"}, "-打造一家以人工智能为核心的单人企业", "你想发财。大家都这么做。而且你想尽快完成。但你也想享受自己所做的事情。你渴望工作的意义。你想掌控自己的工作时长，以便优先考虑生活中的其他方面。我既有好消息也有坏消息。好消息是，这是有可能的。没有人愿意承认自己找到了捷径并加以利用，但这就是我们现代世界如今充斥的现状。数字产品是一种捷径。社交媒体是一种捷径。人工智能是一种捷径。科技整体而言是一种捷径。如果你不喜欢“捷径”这个词，那就把它换成“利用”。你再也不用寄纸质信件了，只要在Instagram上发布一段你在车里表达想法的视频，就能触达50万人。（50万人简直太疯狂了。你甚至不需要1万人。你还可以私信任何人，真是不可思议。）当你可以通过与人工智能进行简单的对话来摆脱困境时，你无需去图书馆找书来查找非常具体的信息。", "你无需花费 10,000 美元以上来测试实体产品是否有效，只需在 2 周内推出同一主题的数字产品，看看它是否有效，产生现金流，然后将这笔资金和经过验证的想法投入到另一个商业模式中。坏消息是：你还需要学习如何走捷径。走捷径并不等同于保证成功。人类总是会被其他事情分散注意力，从而错过最短路径，因为他们无法坐下来集中精力。", "即使我们拥有功能强大的AI，许多人仍然会
