<style>
html{
  --bg:#ffffff; --panel:#f5f6f7; --panel2:#eceef0; --line:#c9ced4;
  --text:#111418; --muted:#555e68; --accent:#0E9488; --deep:#0E9488;
  --amber:#a16207; --green:#15803d;
  --topbar-bg:rgba(255,255,255,.94); --para:#1a1f24;
  --mark-bg:rgba(14,148,136,.08); --badge-bg:rgba(14,148,136,.08); --badge-border:#0E9488;
  --overlay:rgba(0,0,0,.35);
  --mark-text:rgba(251,191,36,.35);
}
:root{--sidebar:280px; --topbar:56px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.85;-webkit-font-smoothing:antialiased;
}
.topbar{
  position:fixed;top:0;left:0;right:0;height:var(--topbar);z-index:50;
  background:var(--topbar-bg);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 20px;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#08110f;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px}
.brand .sub{color:var(--muted);font-weight:400;font-size:13px}
.lib-btn{flex:none;display:inline-flex;align-items:center;gap:5px;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;transition:background .18s}
.lib-btn:hover{background:rgba(14,148,136,.08)}
@media(max-width:720px){.lib-btn{padding:5px 9px;font-size:12px}}
.searchwrap{margin-left:auto;position:relative}
.searchwrap input{
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:8px 12px 8px 34px;width:230px;font-size:14px;outline:none;
  transition:border-color .2s;
}
.searchwrap input:focus{border-color:var(--accent)}
.searchwrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);stroke:var(--muted)}
.menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:6px 10px;font-size:18px;cursor:pointer}
.layout{display:flex;padding-top:var(--topbar);min-height:100vh}
.sidebar{
  position:fixed;top:var(--topbar);bottom:0;left:0;width:var(--sidebar);
  background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:16px 0 40px;z-index:40;
}
.sidebar::-webkit-scrollbar,.main::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb,.main::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.toc-hint{font-size:11px;letter-spacing:2px;color:var(--muted);padding:6px 20px 12px;text-transform:uppercase}
.toc-hint .total{display:block;letter-spacing:0;font-size:11px;color:var(--muted);margin-top:6px;text-transform:none}
.toc-ch{margin-bottom:2px}
.toc-ch-title{
  display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;
  font-weight:600;font-size:14px;user-select:none;color:var(--text);
}
.toc-ch-title:hover{background:var(--panel2)}
.toc-ch-title.active{color:var(--accent);background:var(--mark-bg);font-weight:700}
.toc-ch-title .num{
  flex:none;width:24px;height:24px;border-radius:6px;background:var(--panel2);
  color:var(--accent);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700;
}
.toc-ch-title .name{flex:1;line-height:1.35}
.toc-ch-title .wc{flex:none;font-size:10.5px;color:var(--muted);font-weight:400;opacity:.8}
.toc-ch.hidden{display:none}
.main{margin-left:var(--sidebar);flex:1;padding:44px 24px 120px;min-width:0}
.paper{max-width:820px;margin:0 auto}
.chapter{margin-bottom:80px;scroll-margin-top:80px}
.chapter-head{margin-bottom:36px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.chapter-head .badge{
  display:inline-block;background:var(--badge-bg);color:var(--accent);
  border:1px solid var(--badge-border);border-radius:6px;padding:2px 10px;font-size:12px;
  letter-spacing:2px;margin-bottom:14px;
}
.chapter-head h1{font-size:30px;line-height:1.35;font-weight:800;letter-spacing:.5px}
.chapter-head .wcmeta{font-size:13px;color:var(--muted);margin-top:10px}
.chapter-head .wcmeta b{color:var(--accent);font-weight:700}
.para{margin:0 0 18px;color:var(--para);text-align:justify}
.bookfig{margin:26px 0;text-align:center;cursor:zoom-in}
.bookfig img{max-width:100%;max-height:560px;border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.12)}
.bookfig.bfbig{cursor:zoom-out}
.bookfig.bfbig img{max-width:none;max-height:none;width:auto;box-shadow:0 4px 24px rgba(0,0,0,.3)}
.bookfig figcaption{font-size:12px;color:var(--muted);margin-top:8px}
mark{background:var(--mark-text);color:var(--amber);border-radius:3px;padding:0 2px}
.side-tabs{display:flex;gap:4px;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.side-tabs button{flex:1;background:none;border:1px solid var(--line);color:var(--muted);
  border-radius:7px;padding:7px 4px;font-size:12.5px;cursor:pointer;transition:all .15s}
.side-tabs button.on{color:var(--accent);border-color:var(--deep);background:var(--badge-bg);font-weight:700}
.side-panel{display:none}.side-panel.on{display:block}
.hl-y{background:rgba(251,191,36,.42);border-radius:2px;padding:1px 0;cursor:pointer}
.hl-g{background:rgba(74,222,128,.38);border-radius:2px;padding:1px 0;cursor:pointer}
.hl-b{background:rgba(96,165,250,.32);border-radius:2px;padding:1px 0;cursor:pointer}
.hl-bold{font-weight:800}
.selbar{position:fixed;z-index:155;display:none;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:5px;gap:4px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.selbar.show{display:flex;flex-wrap:wrap;max-width:340px}
.selbar button{border:none;background:var(--panel2);color:var(--text);border-radius:7px;
  padding:7px 10px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:5px}
.selbar button:hover{background:var(--accent);color:#08110f}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.dot.y{background:#fbbf24}.dot.g{background:#4ade80}.dot.b{background:#60a5fa}
.excerpt-item{position:relative;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.excerpt-item:hover{background:var(--panel2)}
.excerpt-item .etext{font-size:13px;line-height:1.7;color:var(--text);word-break:break-word}
.excerpt-item .emeta{font-size:11px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.excerpt-item .edel{color:var(--muted);border:none;background:none;cursor:pointer;font-size:14px;padding:2px 6px}
.excerpt-item .edel:hover{color:#f87171}
.excerpt-item .ecolor{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px}
.excerpt-empty{padding:30px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
.excerpt-tools{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.excerpt-tools button{flex:1;min-width:70px;background:var(--panel2);border:1px solid var(--line);
  color:var(--text);border-radius:7px;padding:7px;font-size:12px;cursor:pointer}
.excerpt-tools button:hover{border-color:var(--accent);color:var(--accent)}
.excerpt-search{margin:10px 16px 4px;width:calc(100% - 32px);background:var(--panel2);
  border:1px solid var(--line);color:var(--text);border-radius:7px;padding:8px 10px;font-size:13px;outline:none}
.progress{position:fixed;top:var(--topbar);left:0;height:2px;background:var(--accent);z-index:60;width:0}
.totop{
  position:fixed;right:24px;bottom:28px;width:44px;height:44px;border-radius:50%;
  background:var(--panel2);border:1px solid var(--line);color:var(--accent);
  font-size:20px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:30;
}
.totop.show{display:flex}
@media(max-width:800px){
  :root{--sidebar:0px}
  .brand .sub{display:none}
  .brand>span:nth-child(2){display:none}
  .topbar{gap:10px;padding:0 12px}
  .searchwrap{margin-left:auto;flex:1;max-width:190px}
  .searchwrap input{width:100%}
  .menu-btn{display:block;flex:none}
  .sidebar{transform:translateX(-100%);transition:transform .25s;width:82vw;max-width:320px}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:30px 16px 100px}
  .chapter-head h1{font-size:24px}
  body{font-size:15.5px}
  .overlay{position:fixed;inset:0;background:var(--overlay);z-index:35;display:none}
  .overlay.show{display:block}
}
/* FOCUS-READ-MODE v1 */
/* ---------- 专注阅读（全屏）模式 ---------- */
.focus-btn{flex:none;display:inline-flex;align-items:center;gap:5px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:700;background:transparent;cursor:pointer;white-space:nowrap;transition:border-color .18s,color .18s;font-family:inherit}
.focus-btn:hover{border-color:var(--accent);color:var(--accent)}
body.focus-mode .topbar,body.focus-mode .sidebar,body.focus-mode .progress,body.focus-mode .overlay,body.focus-mode .selbar,body.focus-mode .totop{display:none!important}
body.focus-mode .layout{padding-top:0}
body.focus-mode .main{margin-left:0;padding:0}
body.focus-mode .paper{max-width:var(--focus-width,760px);margin:0 auto;padding:64px 30px 160px}
body.focus-mode .para{font-size:var(--focus-fs,19px);line-height:var(--focus-lh,2);letter-spacing:.01em}
body.focus-mode .chapter{margin-bottom:100px}
body.focus-mode .chapter-head{margin-bottom:48px}
body.focus-mode .chapter-head h1{font-size:32px}
body.focus-mode .bookfig{margin:36px 0}
.focus-tools{position:fixed;z-index:210;right:18px;top:18px;display:none;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:6px 8px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
body.focus-mode .focus-tools{display:flex}
.focus-tools button{min-width:32px;height:30px;border:none;background:transparent;color:var(--text);border-radius:7px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;padding:0 8px}
.focus-tools button:hover{background:var(--panel2);color:var(--accent)}
.focus-tools .ft-exit{color:var(--accent);border-left:1px solid var(--line);border-radius:0 7px 7px 0;margin-left:2px;padding-left:10px}
.focus-tools .ft-label{font-size:11px;color:var(--muted);padding:0 4px;white-space:nowrap}
.focus-hint{position:fixed;z-index:210;bottom:22px;left:50%;transform:translateX(-50%);display:none;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:7px 16px;font-size:12px;color:var(--muted);box-shadow:0 4px 18px rgba(0,0,0,.1);opacity:.92;pointer-events:none}
body.focus-mode .focus-hint{display:block}
@media print{.book-title{color:#000!important;border-bottom:2px solid #000!important}.book-title:empty::before{content:''!important}}
@media print{.focus-btn,.focus-tools,.focus-hint{display:none!important}body.focus-mode .topbar,body.focus-mode .sidebar,body.focus-mode .progress,body.focus-mode .overlay,body.focus-mode .selbar,body.focus-mode .totop{display:none!important}}

@media print{
  html{
    --bg:#fff;--panel:#fff;--panel2:#fff;--text:#000;--muted:#000;--line:#000;
    --accent:#000;--para:#000;--badge-bg:#fff;--mark-bg:#fff;
  }
  body{background:#fff!important;color:#000!important;font-size:11pt}
  .topbar,.sidebar,.progress,.totop,.overlay,.selbar{display:none!important}
  .layout{display:block;padding:0}
  .main{margin:0;padding:0}
  .paper{max-width:none}
  .chapter{margin-bottom:24px;page-break-after:auto}
  .chapter-head{border-bottom:1px solid #000;padding-bottom:8px;margin-bottom:16px}
  .chapter-head h1{font-size:20pt;color:#000}
  .para{color:#000!important}
  mark{background:none;color:#000;font-weight:bold}
}
/* ===== DAN 文集：主题分组目录 + 小标题 ===== */
.toc-group{margin:14px 8px 6px;padding:8px 12px;border-left:3px solid var(--accent);background:var(--mark-bg);border-radius:0 7px 7px 0}
.toc-group .tg-name{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.5px}
.toc-group .tg-sub{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.subhead{font-size:20px;font-weight:800;color:var(--text);margin:34px 0 14px;line-height:1.5;padding-left:12px;border-left:3px solid var(--accent);letter-spacing:.3px}
body.focus-mode .subhead{font-size:calc(var(--focus-fs,19px) * 1.18);margin:42px 0 18px}
@media print{.toc-group{background:#fff;border-left:2px solid #000}.subhead{border-left:2px solid #000;color:#000}}
.rt-wrap{position:relative;flex:none;display:inline-flex}
.read-timer{display:inline-flex;align-items:center;gap:6px;height:34px;color:var(--muted);font-size:13px;font-weight:600;background:transparent;border:1px solid var(--line);border-radius:8px;padding:0 10px;white-space:nowrap;cursor:pointer;font-family:inherit}
.read-timer:hover{border-color:var(--accent);color:var(--accent)}
.read-timer .rt-dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.read-timer.live .rt-dot{background:var(--accent);box-shadow:0 0 0 3px rgba(14,148,136,.16)}
.read-timer b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:700}
.rt-pop{position:absolute;right:0;top:calc(100% + 8px);z-index:300;width:262px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:0 12px 34px rgba(0,0,0,.13);display:none;text-align:left;font-weight:400;font-size:13px;line-height:1.6}
.rt-pop.show{display:block}
.rt-pop h4{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:700}
.rt-pop .rt-big{font-size:22px;color:var(--accent);font-weight:800;margin-bottom:8px;font-variant-numeric:tabular-nums}
.rt-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.rt-row:last-child{border-bottom:0}
.rt-row span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-row b{color:var(--text);font-variant-numeric:tabular-nums;flex:none}
.rt-bars{display:flex;align-items:flex-end;gap:4px;height:58px;margin:8px 0 6px}
.rt-bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.rt-bar i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.rt-bar.today i{opacity:1;box-shadow:0 0 0 1px var(--deep)}
.rt-bar em{font-size:10px;font-style:normal;color:var(--muted);white-space:nowrap}
.rt-tip{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
@media(max-width:720px){.read-timer{height:30px;padding:0 7px;font-size:12px}.rt-label{display:none}.rt-pop{right:-40px;width:242px}}
@media print{.rt-wrap,.rt-pop{display:none!important}}

/* MOBUI-v1 */@media(max-width:720px){.undo-btn{display:none!important}.split-reader{display:none!important}}
</style>



<style id="simpleEditStyle">
/* ===== SIMPLE-EDIT-v2 默认纯阅读 + 按需改字 ===== */
/* 只有正在编辑的那一段才有提示框；其余段落保持纯阅读，无任何框 */
/* DUPTITLE-v1 正文首段与标题重复时隐藏该行（不删DOM，仅视觉隐藏）*/
.dup-title-line{display:none!important}
.dup-title-line + p{margin-top:0}
@media print{.dup-title-line{display:none!important}}
/* BOOKTITLE-v1 书名大标题（空白可编辑）*/
.book-title{font-size:30px;font-weight:800;line-height:1.35;color:var(--text);
  margin:6px 0 26px;padding:0 0 14px;border-bottom:2px solid var(--accent);
  cursor:text;outline:none;min-height:1em}
.book-title:empty::before{content:'点击此处输入书名大标题…';color:var(--muted);font-weight:600;opacity:.7}
[data-pid].se-editing{outline:1px solid var(--amber);outline-offset:2px;border-radius:2px;cursor:text;background:rgba(251,191,36,.05)}
/* 改过的段落：极轻左边框痕迹（打印去掉） */
/* EDITUI-FIX: 改字后不再显示橙色竖框，段落保持纯阅读外观 */
/* 文字被删空的段落：隐藏整段（含残留竖线装饰），撤销后自动恢复 */
[data-pid].se-empty{display:none!important}
/* 工具条里的改字按钮 */
#editBtn{white-space:nowrap}
/* 顶栏「回到上一版」按钮 */
.undo-btn{flex:none;display:inline-flex;align-items:center;gap:5px;color:var(--muted);border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:border-color .18s,color .18s}
.undo-btn:hover{border-color:var(--accent);color:var(--accent)}
.undo-btn.hasundo{border-color:var(--amber);color:var(--amber)}
.undo-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:370;background:#111418;color:#fff;font-size:12px;padding:7px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
.undo-toast.show{opacity:.94}
/* ===== EDITUI-FIX: 小标题悬浮删除 ===== */
h2.subhead{position:relative}
.h2-del{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:26px;height:26px;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:7px;
  background:var(--bg);color:var(--muted);font-size:17px;cursor:pointer;opacity:0;transition:opacity .15s,color .15s,border-color .15s;
  font-family:inherit;padding:0;user-select:none;z-index:2}
.h2-del::before{content:'×'}
h2.subhead:hover .h2-del,.h2-del:focus{opacity:1}
.h2-del:hover{color:#f87171;border-color:#f87171}
@media print{.h2-del{display:none!important}}

@media print{.undo-btn,.undo-toast{display:none!important}p[data-edited="1"],h2[data-edited="1"]{box-shadow:none!important;padding-left:0!important}[data-pid].se-editing{outline:none!important;background:none!important}}
</style>

<!-- EDITUI-FIX-v1 -->
</head>
<body><script>window.addEventListener('error',function(e){var b=document.getElementById('paErrBar');if(!b){b=document.createElement('div');b.id='paErrBar';b.style.cssText='position:fixed;left:0;right:0;top:0;z-index:9999;background:#dc2626;color:#fff;font-size:12px;padding:4px 10px;font-family:monospace;word-break:break-all';document.body.appendChild(b);}b.textContent='脚本错误: '+e.message;});</script>
<div class="progress" id="progress"></div>
<header class="topbar">
  <button class="menu-btn" id="menuBtn">☰</button>
  <div class="brand">
    <span class="mark">D</span>
    <span>DAN 文集</span>
    <span class="sub">/ Dan Coe · 33 篇精选文章</span>
  </div>
  <a class="lib-btn" href="../pa-library.html" title="返回阅读库">◧ 书库</a>
<button class="focus-btn" id="focusBtn" title="专注阅读：隐藏界面元素、放大正文；Esc 退出">⛶ 专注阅读</button>
  <div class="searchwrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
    <input type="text" id="search" placeholder="搜索章节 / 正文…">
  </div>

<script>
const DATA = [{"group": "人生重置与改变", "gsub": "从一天到一生 · 打破默认模式", "icon": "1", "title": "如何在一天内彻底改变你的人生", "paras": [{"h": "如何在一天内彻底改变你的人生"}, "如果你和我一样，你就会觉得新年决心很愚蠢。", "因为大多数人改变生活的方式完全错误。他们制定这些计划只是因为其他人都这么做——我们把这种追求地位的游戏赋予了肤浅的意义——但这些计划并不符合真正改变的要求，真正的改变远比说服自己今年会更加自律或高效要深刻得多。", "如果你属于这类人，我并非有意贬低你（我的文笔有时确实比较尖锐）。我放弃的目标比实现的要多十倍。我想大多数人都是如此。但人们尝试改变生活却几乎每次都以彻底失败告终，这的确是事实。然而，尽管我认为新年决心很愚蠢，但反思自己讨厌的生活总是明智的，这样你才能朝着更好的方向前进，我们将在下文中讨论这一点。", "所以，无论你是想创业、改变体型，还是想冒险追求更有意义的生活,而不至于两周后就放弃，我都想分享7个你可能从未听说过的关于行为改变、心理学和生产力的想法，以便你在2026年能够做到这一点。这将是一项全面的工作。这不是那种读一遍就忘的信。这是你需要收藏、记笔记并留出时间思考的内容。最后一步（深入挖掘你的内心世界，发现你真正想要的生活）大约需要一整天的时间才能完成，其效果持续时间要长得多。我们开始吧。", "第一．你之所以没能到达你想去的地方，是因为你不是那个“能达到那里的人”。", "在设定远大目标时，人们往往会关注成功的两个必要条件之一：", {"h": "改变你的行动以朝着目标取得进展（最不重要，次要因素）"}, {"h": "改变你的本质，让你的行为自然而然地随之改变（最重要，首要步骤）"}, "大多数人设定一个肤浅的目标，给自己打气，让自己在前几周保持自律，然后就毫不费力地回到老样子，因为他们试图在一个腐朽的根基上建立美好的生活。如果这还不够清楚，我们来看一个例子。想想那些成功人士。他可以是身材健硕的健美运动员，身价数亿美元的创始人/CEO，也可以是魅力四射、能与一群人侃侃而谈而丝毫不会感到焦虑的人。", "你觉得健美运动员必须“拼命”才能吃得健康吗？CEO必须自律才能按时到岗领导团队吗？表面上看似乎如此，但事实是他们无法想象自己过其他的生活。健美运动员必须拼命才能吃得不健康。CEO必须强迫自己赖床超过闹钟，而且他们讨厌其中的每一秒（这里面有很多细微差别，请允许我解释一下）。有些人觉得我的生活方式有点极端，也太自律了。对我来说，这很自然，我这么说并不是要把它和其他生活方式对立起来。我只是单纯地享受这种生活。当妈妈劝我休息一下，出去玩玩的时候……我忍住没跟她说：“如果我不觉得开心，那我干嘛还要做这些？”", "接下来这句话听起来很简单，但令人费解的是，竟然有那么多人不明白。如果你想在生活中取得某种特定的成果，你必须在实现该成果之前很久就拥有能够创造该成果的生活方式。", "如果有人说他们想减掉30磅，我通常不太相信。不是因为我觉得他们不行，而是因为太多时候，这些人会说：“我迫不及待地想减掉体重，这样我就可以重新享受生活了。”我不得不告诉你，如果你不能把让你减肥的生活方式坚持下去，并且找到一个比让你继续旧习惯更有吸引力的理由，那么你最终会回到原点，而且你会遗憾地承认，你浪费了永远无法挽回的资源：时间。（新习惯比就习惯更能吸引你）当你真正改变自己时，所有那些对实现目标毫无帮助的习惯都会变得令人厌恶，因为你深刻地意识到这些行为最终会把你的生活变成什么样子。你之所以对目前的生活方式感到满意，是因为你并不完全了解它们是什么，也不清楚它们会导致什么后果。我们会探讨如何揭开这些真相，但这需要循序渐进。你说你想改变，你说你想“实现财务自由”和“拥有健康的身体”，但你的行动却恰恰相反，这其中必有缘由。而且，这背后的原因远比你想象的要深远。", "第二．你之所以没能到达你想去的地方，是因为你根本不想去那里。", {"h": "只相信行动。生活发生在事件层面，而非言语层面。相信行动。——阿尔弗雷德·阿德勒"}, "如果你想改变自己，就必须了解大脑的运作方式，这样才能开始重新编程它。", "理解心灵的第一步是理解所有行为都是目标导向的，即目的论。仔细想想，这似乎显而易见，但当我们深入探讨时，大多数人却不愿接受。你向前迈一步，是因为你想到达某个地方。", "你挠鼻子是因为你想止痒。这些目标很明确，但大多数时候，你的目标是无意识的。举个简单的例子，你可能没有意识到，当你中午坐在沙发上时，你其实是在为下一个任务做准备，试图消磨时间。在更深层次的无意识和复杂的层面上，你会追求可能伤害自己的目标，但你会用一种社会可接受的方式来为自己的行为辩解，这样你就不会显得自己像个失败者。举例来说，如果你总是拖延工作，你可能会用“缺乏自律”来为自己辩解，但实际上，你和以往一样，都是在试图达成某个目标。在这种情况下，你的目标可能是为了避免完成并分享作品后所受到的评判。如果你说你想辞掉那份没有前途的工作，但却没有任何真正的理由继续待在那里，你可能会开始认为自己没有足够的勇气，或者你从来就不是一个“冒险者”，但事实是，你追求的是安全感、可预测性，以及一个不让自己在生活中其他人眼中显得失败的借口，因为在他们看来，从事一份没有前途的工作是成功的标志。这说明，真正的改变需要改变你的目标。我指的不是设定一些肤浅的目标，因为这样做会助长一种潜意识里对你有害的欲望。这一点在效率提升领域已经被讨论得够多了。我指的是改变你的视角。因为目标本质上就是改变你的视角。目标是对未来的一种展望，它就像一面透镜，让你能够注意到那些有助于你实现目标的信息、想法和资源。现在让我们深入探讨一下，因为如果你不理解这一点，只会让脱身变得更加困难。", "第三.你之所以没能到达你想去的地方，是因为你害怕到达那里。", "你最需要记住的是，你如何获得这个想法或它来自哪里都无关紧要。你可能从未见过专业的催眠师，也可能从未接受过正式的催眠。但是，如果你接受了某种想法——无论是来自你自己、你的老师、你的父母、朋友、广告，还是任何其他来源——并且你坚信这个想法是正确的，那么它对你的影响就如同催眠师的话语对被催眠者的影响一样。——麦克斯韦·马尔茨", "这就是你如何成为今天的你，以及你如何成为明天的你的原因。这就是身份的构成：", "1.你想实现一个目标。", "2.你透过那个目标的视角来看待现实。", "3.你只会“注意到”那些能帮助你实现学习目标的“重要”信息和想法。（这叫学习）", "4.你朝着那个目标采取行动，并收到反馈，表明你正在朝着目标前进。", "5.你重复这种行为，直到它变成自动的、无意识的（条件反射）。", "6.这种行为会成为你对自己认知的一部分（“我是那种人……”）。", "7.你捍卫自己的身份是为了维持心理一致性。", "8.你的身份认同会塑造新的目标，从而重新开始循环；如果这种身份认同不利于美好生活，情况就会迅速恶化。令人遗憾的是，你必须打破第6步和第7步之间的循环，但这个过程要从你还是个孩子的时候就开始了。", "你的目标是生存。你依赖父母教你如何生存。你不得不顺从。而大多数人的教育方式是奖惩分明，所以除非你接受他们的信仰和价值观，否则你就会受到惩罚。只有当你看穿这一切，你才能真正独立思考。但你的父母一生中也经历了同样的过程。这正是危险所在。除非他们自己打破了这种模式，否则他们都会受到工业时代文化中普遍接受的成功观念的影响。他们也继承了父母和祖父母身上最好和最坏的观念。更深入地来说，一旦你满足了生理生存需求（在当今世界这很容易做到，你几乎生来就享有安全），你便开始在概念或意识形态层面生存。你或许不会试图保护和繁衍你的身体，但你绝对会保护和繁衍你的思想。不难看出互联网上的思想之战，而参与者既有个人身份，也有群体身份。当你的身体感到受到威胁时，你会进入战斗或逃跑状态。当你的身份认同受到威胁时，同样的事情也会发生。如果你对某种政治意识形态认同过深（就像我们刚才讨论的那样），当有人挑战你的信仰时，你会感到威胁。你会真切地感受到压力，就像被人狠狠扇了一巴掌。由于大多数人不会分析自己的情绪以求真相，你往往会陷入回音室效应，并更加固执己见，最终伤害自己和他人。如果你在宗教家庭长大，没有独立思考的能力，那么当有人威胁到你在那个小圈子里的心理安全时，你就会攻击和反抗。当你无意识地将自己视为律师、游戏玩家或其他不会采取行动去追求更好生活的人时，也会发生同样的情况。", "第四.你想要的生活存在于某种特定的心智层次之中。", "人的思维会随着时间的推移经历可预测的阶段而发展。你出生时就像一块小小的求生海绵，吸收着你能接触到的一切信念（这些信念很大程度上受你的文化影响），从而获得安全感。如果你不加注意，你的思维可能会变得僵化，让你难以过上有意义的生活。", "这一点在马斯洛的需求层次理论、格鲁特的自我发展阶段理论、螺旋动力学理论和整体理论等模型中都有充分的记载，这些模型彼此相互借鉴，而且在社会中也很容易观察到这一点。", "（推荐阅读）我曾多次谈到这些，并将它们综合成我自己的观点。人类3.0模型它会提供各种人工智能提示，帮助你了解自己的发展水平和前进方向（如果你愿意，可以在标签页中打开阅读），但这里是自我发展的九个阶段中的80/20部分，供你复习（因为重复有助于发现你以前没有注意到的事情）。", {"h": "自我发展的九个阶段："}, "1.冲动期——冲动与行动之间没有界限。非黑即白的思维模式。例如，幼儿生气时会打人，因为在他们看来，生气的感觉和打人的行为是一回事。", "2.自我保护期——世界充满危险，你必须学会保护自己。例如，孩子会学会藏起成绩单、谎报家务，以及琢磨大人想听什么。", "3.从众期——你把自己等同于你的群体，群体规则对你而言就是现实本身。也就是说，你真的无法理解为什么有人会投票给与自己家人或群体不同的人。", "4.自我觉察期——你发现自己的内心世界与外在表现并不一致。例如，坐在教堂里，你意识到自己并不确定是否相信周围所有人似乎都相信的事情，但你却不知道该如何处理这种感觉。", "5.尽责自律期——你会建立自己的一套原则体系，并严格遵守这些原则。例如，经过仔细研究后离开家族宗教，并采纳一套自己能够捍卫的个人哲学；或者制定包含明确里程碑的职业规划，因为你相信付出正确的努力就能获得正确的结果。", "6.个体化期——你意识到自己的原则是受环境影响而形成的，于是开始更加灵活地看待它们。例如，你意识到自己的政治观点更多地与你的成长环境有关，而非客观真理；或者你发现自己雄心勃勃的职业目标实际上是为了赢得父亲的认可。", "7.策略期——你运用各种系统，同时意识到自身在其中的角色。例如，领导一个组织时，你会积极反思自身的盲点；或者参与政治活动时，你会意识到自己的视角是片面的，并且受到一些你无法完全看清的偏见的影响。", "8.建构意识期——你将所有框架，包括你的身份认同，都视为有用的虚构。例如，你以比喻而非字面意义来持有你的精神信仰，明白地图并不等同于疆域本身，或者以一种温和的趣味看待自己扮演“创始人”或“思想领袖”的角色。", "9.整合合一期——自我与生命之间的分离消融。也就是说，工作、休息和娱乐感觉就像是同一件事。不再有需要成为某种存在的人，只有临在本身，回应着一切的发生。", "对于大多数阅读这篇文章的人来说，我假设你们的数值介于4到8之间，这之间差距很大。数值接近4的人在痛苦中寻找出路。你们觉得自己应该拥有更多，但你们还无法完全理解这一切，因为显然有很多因素在起作用。数值接近8的人已经能够游戏人间。", "第五．智力是指从生活中获得你想要的东西的能力。", {"h": "衡量智力的唯一真正标准就是你是否能实现自己的人生目标。——纳瓦尔·拉维坎特"}, "成功是有秘诀的。第一个要素是自主性。第二个要素是机会（很多人喜欢把机会误认为是“特权”，因为他们认为机会就是其他要素）。最后一个要素是智慧。（成功=能动性+机会+智慧）", "如果你拥有很高的自主权但机会很少，那么你朝着目标采取行动的可能性有多大都无关紧要，因为这个目标不会带来多少成果。如果你有机会和自主权，但智力低下，那么你永远无法充分利用这些机会。首先，我们之前讨论过自主性。就机会而言，我不能建议你改变你的实际办公地点，但如果你看不到眼前丰富的数字化机会，那我也不知道该说什么了。综上所述，我想重点探讨一下，在结合这两项要素和本文的语境下，智慧究竟是什么。为此，我们需要借助控制论。控制论一词源于希腊语kybernetikos，意思是“控制”或“擅长控制”。它也被称为“获得你想要的东西的艺术”。所以，如果纳瓦尔对智慧的定义是“获得你想要的生活”，那么理解控制论可以帮助你更快地实现这个目标。", "控制论阐述了智能系统的特性：1.要有目标。2.朝着这个目标行动。3.感受一下自己身处何地。4.将其与目标进行比较。5.根据反馈再次采取行动。", "你可以根据系统反复试验和坚持不懈地纠错的能力来判断其智能程度。一艘被风吹离航线的船，随后修正航向，驶向目的地。一个恒温器感知到温度变化并启动。胰腺在血糖飙升后分泌胰岛素。这和你如何实现人生目标有什么关系呢？一切。", "从元视角行动、感知、比较和理解系统是高智能（按照我们这里使用的定义）的基础。高智商是指能够反复尝试、坚持不懈并理解全局的能力。低智商的标志是无法从错误中吸取教训。低智商的人往往纠结于问题本身，而不是解决问题。他们遇到瓶颈就放弃。就像一个作家，因为缺乏尝试新事物、进行实验和找到适合自己的方法的能力，而无法建立读者群，最终放弃一样（认为不存在有效的方法，无论你的认知有多么局限，都是错误的，因此这种想法属于低智商）。高智商意味着意识到任何问题在足够长的时间尺度上都能得到解决。事实上，只要你下定决心，就能实现任何目标。智慧在于意识到，你可以做出一系列选择，最终达成目标。你明白思想是有层级的，不可能一步登天，从纸莎草纸直接过渡到谷歌文档。即使现在这个目标看似不可能实现，你也只是暂时缺乏必要的资源——这些资源或许会在未来几年内出现。", "当我谈到“目标”时，正如我将继续重复的那样，我并不是从典型的自助角度来谈论的，尽管有时采用这种角度是有帮助的。我是从目的论或希腊宇宙观的角度来看待这个问题的——万物皆有其目的，万物都是更大整体的一部分。", "目标决定了你如何看待世界。目标决定了你对“成功”或“失败”的定义。", "你可以尝试“享受过程”，但如果你追求的目标是错误的，你就无法享受过程。", "你的思维就是现实的操作系统。该系统由目标构成。对大多数人来说，这些目标是别人强加给他们的，就像代码一样被预先设定在你的潜意识里。上学-找到工作-感到委屈-扮演受害者-65岁退休。一条已知但行不通的路径。", {"h": "要想变得更聪明，你必须："}, "1.拒绝已知路径。2.潜入未知领域。3.设定更高、更新的目标来拓展思维。4.拥抱混乱，允许成长。5.研究自然界的普遍规律。6.成为一名博学多才的通才。", "我知道这可能并非传统意义上的智力定义，但这一系列步骤确实能使你的大脑形成非凡的连接，从而造就我们通常所说的聪明人。再加上自主性，你就成功了一半。这自然而然地引出了下一节。", {"h": "第六、如何在一天内开启全新生活"}, "我生命中最美好的时光总是发生在我对自身毫无进展感到彻底厌倦之后。你如何深入挖掘自己的内心世界？你如何意识到自己受到的制约？如何获得能够改变人生轨迹的深刻见解和真理？通过简单却往往令人痛苦的行为-提问。很少有人会这样做，从他们说话的方式或对某个特定话题的看法就能看出来。提问也是一种思考，但很少有人会这样做。", "我想给你一套全面的方案，你可以每年使用它来重塑生活，开启一段突飞猛进的进步期。这套方案能帮助你提出正确的问题。这些问题将涵盖从宏观到微观的各个层面：你想去哪里，你需要做什么才能到达那里，以及你可以立即采取哪些措施来开始朝着这个目标迈进。", "这需要一整天的时间才能完成，所以我建议您严格按照步骤操作。您需要准备一支笔、一张纸和一颗开放的心。我观察到，那些成功转变身份的人往往经历着某种模式：这种转变通常在紧张情绪积累之后迅速发生。具体来说，我注意到人们往往会经历三个阶段。", "认知失调——你觉得自己不属于现在的生活，并且对缺乏进步感到非常厌倦。", "不确定性——你不知道接下来会发生什么，所以他们要么尝试，要么迷失方向，感觉更糟。", "探索——你发现自己想要追求的目标，并在6个月内取得6年才能取得的进展。", "因此，我们制定此方案的目标是帮助你达到认知失调的临界点，克服不确定性，并发现你真正想要实现的目标，以至于这种清晰感让你感到无比震撼，而各种干扰因素也不再具有影响力。这个方案的结构设计使其能够在一天内完成。早上，你进行一次心理挖掘，揭示自己隐藏的动机。白天，你会不时地打断自己，让自己摆脱自动驾驶模式，并思考自己的人生。晚上，你综合这些感悟，形成明天行动的方向。我无法保证这种方法对每个人都有效，因为我无法保证每个读者都处于自己人生故事的合适阶段，从而使这些观点产生影响。你不能把高潮放在书的开头，还指望它引人入胜。", {"h": "（第一部分）上午——心理挖掘——视觉与反视觉"}, "首先，我们必须为你的思维创造一个新的框架或感知视角。这就像创造一个新的外壳，离开旧的，然后随着时间的推移慢慢适应它。一开始你会觉得不合身，但这反而是件好事。请抽出15-30分钟（相当于看完一个YouTube视频的时间……你一定可以做到）来思考并回答以下问题。不要试图把思考工作外包给人工智能。我希望你能突破思维的局限。如果你现在无法回答这些问题，可以稍后再来思考。", "1.你已经学会忍受的那种迟钝而持久的不满是什么？不是那种刻骨铭心的痛苦，而是你已经学会容忍的那种不满。（如果你不憎恨它，你就会容忍它。）", "2.你总是抱怨哪些事情，但却从未真正改变过？写下你在过去一年中最常抱怨的三件事。", "3.针对每一项抱怨：观察你的行为（而不是你的言语）的人会得出你真正想要的是什么结论？", "4.你现在生活中有哪些真相是你无法向你非常尊敬的人坦白的？", "这些问题旨在让你意识到当前生活中的痛苦。现在，我们需要将这些痛苦转化为我所谓的“反愿景”，即对你不想要的生活的残酷认知。这样，你就能利用这种负能量，将你的努力导向积极的方向，并出于内在动力而行动。", "1.如果未来五年内一切照旧，请描述一下你平常的星期二。你在哪里醒来？你的身体感觉如何？你想到的第一件事是什么？你身边有哪些人？从早上9点到下午6点，你都做了些什么？晚上10点你感觉如何？", "2.现在，试着把时间延长十年。你错过了什么？哪些机会溜走了？谁放弃了你？当你不在场时，人们会怎么评价你？", "3.你已走到生命的尽头。你过着安稳的生活，从未打破过既定的模式。为此付出了什么代价？你从未让自己感受过、尝试过、成为过什么？", "4.你身边有哪些人已经过上了你刚才描述的未来？那些比你领先五年、十年、二十年，走着同样道路的人呢？当你想到自己会成为他们时，你有什么感受？", "5.为了真正改变自己，你需要放弃哪些身份？（“我以前是那种人……”）不再做那样的人，你在社交方面会付出怎样的代价？", "6.你至今没有改变的最尴尬的理由是什么？那个让你听起来软弱、害怕或懒惰，而不是合情合理的理由？", "7.如果你目前的行为是一种自我保护，那么你究竟在保护什么？这种保护又让你付出了什么代价？", "如果你如实回答了这些问题，并且正处于人生的正确阶段，你会对目前的生活方式感到深深的不安，甚至可能感到厌恶。现在，我们需要引导这种能量朝着积极的方向发展。我们需要制定一个最小可行愿景，因为你的愿景就像一个产品。它起初可能并不清晰，但随着时间和经验的积累，它会变得越来越清晰、越来越有力。", "1.暂时抛开实际因素。如果你能打个响指，三年后就能过上截然不同的生活，想想你真正想要的是什么，而不是现实的那种？一个普通的星期二会是什么样子？细节程度与第五题相同。", "2.你对自己有怎样的信念，才能让那种生活感觉自然而非勉强？请写下你的自我认同宣言：“我是那种……”", "3.如果你已经是那样的人，这周你会做什么事？明天一早先回答所有这些问题。", {"h": "（第二部分）全天——打破自动驾驶模式——打破无意识的行事方式"}, "这些写日记的练习很有趣，但我们想要的是真正的改变。坦白说，如果你不打破目前让你停滞不前的无意识模式，这一切都不会发生。今天一整天，我都希望你认真思考你在第一部分日记里记录的所有内容。除此之外，我也希望你不要忘记思考。请认真对待这件事。如果你一辈子都做同样的事情，你不会改变的。你需要有意识地打破旧有的模式。现在就花点时间在手机里创建提醒或日历事件。把这个问题也添加到提醒或事件中，这样你就可以立即开始思考它。越是随机且不与你的日程安排冲突，就越好。", "上午11:00：我现在做的事情究竟在逃避什么？下午1:30：如果有人拍摄了过去两个小时的影像，他们会得出什么样的结论？我想要怎样的生活？下午3:15：我是在走向我讨厌的生活，还是走向我想要的生活？下午5:00：我假装不重要的最重要的事情是什么？晚上7:30：今天我做了哪些事是为了保护身份而非出于真心？（提示：你做的绝大多数事都是如此）。晚上9点：今天我什么时候感觉自己最有活力？什么时候感觉自己最麻木？为了进一步激发思考，不妨在通勤、散步或闲坐的时候安排这些问题。如果我不再需要别人把我视为[你在问题10中写到的身份]，会发生什么变化？我生活中哪些方面为了安全而牺牲了活力？我明天能成为的那个人的最小版本是什么？", {"h": "（第三部分）晚间——综合洞察——进入进步的季节"}, "如果你遵循这个过程，我敢肯定你至少会获得一个足以改变你人生轨迹的深刻洞见。现在，我们需要将这些洞见表达出来，将它们融入我们自身，并付诸行动，从而开启通往更高心智境界的旅程。今天过后，你觉得你一直以来陷入困境的最真实原因是什么？真正的敌人是什么？明确指出来。不是环境，也不是其他人，而是主导一切的内在模式或信念。用一句话概括你绝不接受的生活现状。这就是你对未来的愿景。读到它时，你应该有所感触。用一句话概括你正在构建的目标，要知道它会不断发展演变。这就是你的愿景MVP（最小可行产品）。最后，我们需要制定目标。再次强调，这些目标并非为了达成而设定，因为目标只是一种预期。它们并不可靠，会让你感觉被某种终将改变的事物所束缚。相反，你应该把目标看作一种视角，一种可以让你调整心态、摆脱不想要的生活的视角。不要担心所谓的终点线，因为我们会发现，它并不存在。真正的乐趣在于过程。", "一年期视角：一年后，什么事情必须成真，你才能知道自己已经打破了旧模式？一件具体的事情。一个月视角：为了使一年视角仍然可行，一个月内必须满足哪些条件？", "每日思考：明天你可以安排时间做哪2-3件你想成为的那种人会毫不犹豫地去做的事情？那可真不少。希望对您有所帮助。但我们还需要最后一块拼图来最终敲定一切。跟着我进入最后的章节。", {"h": "第七.把你的生活变成电子游戏"}, "最佳的内在体验状态是意识井然有序的状态。当心理能量（或注意力）投入到切实可行的目标中，并且技能与行动机会相匹配时，这种状态便会实现。追求目标能够带来意识的秩序，因为人必须将注意力集中在手头的任务上，并暂时忘却其他一切。——米哈里·契克森米哈伊", "你现在拥有了美好生活所需的所有要素。现在，将你所有的见解整理成一个连贯的计划可能会有所帮助。请另起一张纸，写下以下六个组成部分：", "1.反愿景——什么是我痛苦的根源？或者说，我永远不想再经历的人生是什么？", "2.愿景——我理想中的生活是什么样的？我可以通过努力不断改善这种生活？", "3.一年目标——一年后我的生活会是什么样子？这是否更接近我想要的生活？", "4.一个月项目——我需要学习什么？我需要掌握哪些技能？我可以构建什么来让我更接近一年目标？", "5.日常关键因素（每日杠杆）——哪些是能够推动项目进展、使项目更接近完成的优先事项？", "6.限制条件——为了从零开始实现我的愿景，我不愿意牺牲什么？", "为什么它如此强大？因为这些要素实际上构建了你自己的小世界。如果你注定要在人生的这个阶段追求这一系列目标，你别无选择，只能全身心投入。你会感受到一种对更高目标的渴望。你会认为其他任何选择都不算数。你把生活变成了电子游戏。因为游戏是痴迷、享受和心流状态的典型代表。它们具备所有带来专注和清晰思维的要素，所以如果我们反向推导出这些要素是什么，我们就能生活在更深层次的享受、更少的干扰和更大的成功之中。", "你的远见决定你的胜负。至少在游戏规则改变之前是这样。", "你的反愿景才是关键所在。如果你失败或放弃，会发生什么？", "你一年的目标就是使命。这是你人生中唯一的首要任务。", "你为期一个月的项目就是打最终boss。你将如何获得经验值和战利品？", "你每天的杠杆就是任务。这是解锁新机遇的日常流程。", "你的限制就是规则。正是这些限制激发了创造力。", "所有这些都像一组同心圆，如同力场一样，保护你的思维免受干扰和诱惑。你玩这个游戏越多，这种力量就越强，很快它就会成为你的一部分，而你生活本该如此（成功）。"], "wcount": 9945}, {"group": "人生重置与改变", "gsub": "从一天到一生 · 打破默认模式", "icon": "2", "title": "Dan Coe 用一天重置人生", "paras": [{"img": "dan02_02", "cap": ""}, {"img": "dan02_01", "cap": ""}], "wcount": 0}, {"group": "人生重置与改变", "gsub": "从一天到一生 · 打破默认模式", "icon": "3", "title": "如何开启一段全新的生活", "paras": [{"h": "如何开启一段全新的生活"}, "-把你的生活变成一场游戏", "通常需要一到两个月的时间，经历迷茫、不知所措，甚至濒临放弃，才能最终形成清晰的愿景，从而开启全新的生活方式。", "首先，要明白人生是由一个个篇章组成的。每一章都是由四个阶段组成的可预测序列：", "迷茫——你不知道该做什么，也不知道自己想要什么。", "愿景——对未来的描绘，当你踏上新的征程，势头便会积聚。", "心流状态——你无法将自己从正在追求的目标中抽离出来。", "阻力——指数级增长不会永远持续下去，但你又不希望它结束，这往往会对你自身造成损害。", "但大多数人都会陷入这种不上不下的阶段。你一生都在接受训练，学习如何按部就班地执行剧本。你习惯了学校教育和工作带来的线性结果。你习惯了别人给你带来确定感。但当你选择过一种非传统的生活（因为只有这样才能获得非传统的结果）时，你却把“迷茫”解读为不祥之兆。于是你毅然决然地放弃，回到那个只顾自身利益的体制为你规划好的舒适生活。这大概就是你读到这篇文章的原因吧。你讨厌自己最终会变得和其他人一样。但这也就意味着你要靠自己了。你感觉自己迷失在茂密的森林里。树木遮蔽了视线，你什么也看不见，所以你没有意识到5码开外有一条小路通往山顶。在这种情况下，最糟糕的做法就是什么都不做。以下是逃脱方法：", {"h": "1.如何收集视觉信息"}, "你的思维通过故事来理解世界。这就是你感到迷茫的原因。因为你不知道自己正在经历怎样的故事，或者你正在经历别人强加给你的故事，你能感受到灵魂深处的这种错位感。", "重新掌控自己的人生最难的部分在于收集正确的拼图碎片，直到形成恰到好处的愿景，让你拥有足够的清晰度，从而充满信心地采取行动。乍一看，这幅拼图像是一团乱麻。你的大脑无法理解它。你会感到压力和焦虑，这会导致思维狭隘和消极，从而让你很难注意到新的机会。这就是你感到困顿的原因。这是第一步：允许自己的生活变得更糟。没想到会这样？让我解释一下。你感到迷茫、麻木甚至失去活力的原因是，你没有一个明确的目标去努力。但你不知道自己想要什么。因为你感到迷茫，思绪纷乱，“明确的目标”是你最不可能想到的事情，你常常会找借口说这不是你应该追求的目标。关键在于，目标并非孤立存在。一个强大而明确的目标恰恰是相反的结果：你会拼尽全力避免的负面结果，一旦你亲身经历过这种结果，你就会不惜一切代价避免再次经历。你需要一个问题来解决，一个敌人去对抗。当你需要避免某些事情时，你的目标的重要性和清晰度都会随之提升。所以，你应该把注意力集中在那里。问问自己：“如果我一直做同样的事情，我的人生最终会走向何方？”好好想想这件事。好好想想。让它占据你的思想，因为当它开始占据你的思想时，你的思想就会渴望学习、尝试和成长。", {"h": "2.如何改变你的想法"}, "你现在的行为方式是因为你已经有了目标。这就是大脑的运作方式。你的大脑是一台追求目标的机器，它感知世界的方式能够让你收集有用的信息来实现目标。问题是，你没有意识到自己追求的是什么目标，这正在毁掉你的生活。亚里士多德认为，某种情况的最终原因是它存在的最终目的或最终目标。阿德勒心理学注重目的论，认为我们并非受过去驱使，而是受目标牵引。正如乔丹·彼得森可能会说的那样，我们的行为是为了实现我们所追求的目标。换句话说（这对很多人来说可能难以理解）：你之所以身处目前的处境，是因为你想要如此，但你对此没有意识到，而且你一开始可能不会相信这一点。你感到迷茫、困惑或不知所措，是因为这有利于实现避免因做一些非传统的事情而带来的痛苦、恐惧和尴尬的目标。你已经充分意识到自己生活中可能出现的负面结果，从而为改变做好了心理准备。现在，要想彻底改变你的想法，你需要沉浸在新的信息来源中，去发现那些能让你豁然开朗的拼图碎片。", "阅读新书。多和陌生人交谈。关注新账号。去一个你一直想去的地方。出去散个步，顺便听听播客。参加新技能课程，提升职业技能或创业。你获取的信息是什么其实并不重要，重要的是它有可能引发改变。当你想要逃避当前的生活轨迹（也就是新的目标）时，真正的学习才会发生。当你发现一个值得追求的潜在机会时，你会感觉到多巴胺涌入大脑。几周之内，你应该就能对你想要的生活有大致的了解。你已经有了地图，但现在要面对的是实际的地形。", {"h": "3.将生活游戏化"}, "你的思维运作依赖于故事情节。游戏是预先构建好的故事，其中包含一些机制，可以缩小你的注意力范围，使游戏过程充满乐趣。玩游戏时，你会遇到：1.清晰的目标层级，让你知道如何才能获胜。2.直接反馈，让你知道自己何时取得进步。3.增加挑战性和技能发展的规则。这些都是心流心理学的核心组成部分。而心流是我们常常渴望（或沉迷）的最佳体验状态。社交媒体、游戏和娱乐公司花费数十亿美元来构建最能让人上瘾的信息，并利用这些因素。然而，大多数人没有意识到的是，你也可以在生活中复制这种效果。在这个过程中，你不再感受到进步和改善的假象，而是变成了一个全新的人。以下是如何将游戏化融入生活的方法：", {"h": "1.设计游戏"}, "首先，要明白大多数人对目标的定义都很平庸。目标就是目的。目标并非必须不惜一切代价去实现的东西。目标是你做决定的视角。随着经验的积累，目标本身也应该随之改变和发展。大多数人会把以下清单视为“行不通”的东西，但它并非一成不变的。", "建立目标层级结构——包括最终目标、长期目标和短期目标。", "制定规则——为了实现最终目标，你愿意在生活中牺牲什么？（健康、人际关系、长时间工作等等）。", "将可量化的优先级任务作为反馈循环——例如每天写作 1000 字、阅读 10 页或联系 5 位潜在客户。当你活在一个模糊或无意识的故事中时，你的生活就会失去新鲜感和模式识别的能力。当你创造出你内心渴望的秩序时，混乱就更容易被遏制。", {"h": "2.创建教程阶段"}, "在游戏中，学习是通过实践，而不是通过学习无休止的教程或观察游戏过程。当然你可以学习教程，但如果你连游戏都没开始玩，那不是学习，而是娱乐。当你玩游戏之后观看教程时，你可以发现一些策略和战术，以便在下次玩游戏时进行尝试。开始游戏。如果你还不完全确定这是否是你余生想做的事，也不用担心，因为你可以通过不断纠错来找到自己真正想做的事。你不可能纠正一个根本不存在的错误。一旦你开始玩游戏（而且只有在你开始玩游戏之后），就应该通过学习以下两件事来充实自己：", "基本功——大多数成功都来自于不偏离这些基本功。", "具体解决方案——当您无法凭借自身知识或直觉取得进展时，有意识地寻找答案。", "你每天最重要的任务应该是学习和构建，每次持续1-2小时。这些事情并非孤立地进行。对于那些尚未将人工智能融入生活的人来说，这可以说是它最好的应用场景：摆脱困境。如果我在 Photoshop 中创作时遇到困难，我可以简单地让 AI 教我如何进行下一步。如果我不知道自己为什么陷入困境，我可以把所有情况都告诉人工智能，让它找出我的盲点。", "3.待在未知的边缘。", "有些电子游戏中会有小地图。地图上，你未探索过的地方会显示为黑色，而你已探索过的地方则会显示为白色。这间接地反映了游戏中的两件事：你的经验和技能水平。通常来说，黑暗区域里潜伏着更高级别的怪物，还有更艰巨的任务和挑战。如果你等级低就贸然闯入，要么立刻被秒杀，要么就只能疲于奔命地躲避其他人。那可就没意思了。另一方面，如果你从不探索黑暗区域，你会感到无聊。同样，这毫无乐趣可言。你已经完成了所有事情。你可以轻松击杀怪物，也没有任何任务可做了。实际上，当你不知道如何承担一项任务时，你会感到焦虑；当你不断做同样的任务时，你会感到厌倦。为了保持最佳体验（享受生活），你需要不断提升技能，迎接更高挑战。在那里，信息的有效流动才能最大化。在那里，你会感觉自己总能学到新东西。那时，你的生活会变成一段令人愉悦的、不断进步的美好时光——一种清晰感知的精神状态，一切都“感觉很对”。那是黄金时代。这也是为什么朝九晚五的工作既是很好的跳板，也常常是致命的。你会不断学习进步，直到最终陷入日复一日重复同样工作的怪圈。这样的生活方式毫无意义，它会在心理上摧残你，并渗透到你生活的方方面面。很难就此事给出建议，但如果可以的话，我想提几点：每周或每月，稍微增加你所做事情的难度。这并不意味着要增加工作量。这意味着要像在健身房举重一样对待你所做的事情。你不会一下子增加50磅的重量。最优秀的举重运动员都知道，每隔一到两周增加最小的2.5磅的杠铃片，才是取得最大进步并保持训练热情的方法。"], "wcount": 3398}, {"group": "人生重置与改变", "gsub": "从一天到一生 · 打破默认模式", "icon": "4", "title": "如果你想改变人生，就必须采取极端措施。", "paras": ["如果你想改变人生，就必须采取极端措施。", "-消失3-6个月，专注于4个习惯", "我至今仍清晰地记得2021年的生日周末。我的生意开始蒸蒸日上。我正处于减重的最后阶段（新冠疫情期间我增重了20-30磅）。我正在撰写我的第一本书的初稿。在我生日临近的时候，感觉每个周末都有我“不容错过”的活动。演唱会，和朋友聚会，诸如此类的事情。而且我当时进展顺利，休息一下也无妨。于是我出去喝酒，熬夜，放弃了节食。不出所料，我之前取得的所有进展不仅停滞不前，而且迅速恶化（多亏了熵增效应）。我的身心状态大约需要四五天才能恢复。而那时，我又得参加另一个活动。我根本无法集中精力思考我的书稿或生意，健身习惯也越来越难以坚持。虽然很痛苦，但还没到难以忍受的地步。几个月前，我和我的朋友们就计划去西雅图庆祝我的生日。我早就厌倦了毫无进展，但今天是我的生日。为什么不放松一下，好好玩乐一番呢？似乎只要身处那种环境，我总能找到理由为自己做的每一个糟糕决定辩解。周末睡到自然醒，什么事都没做成，而且还离家在外，我真是筋疲力尽了。我当时真是气疯了。因为当你把目标看得比什么都重要时，它们会照亮你所有做错的事情。世界上最痛苦的事莫过于眼睁睁看着这些目标逐渐被肤浅的享乐所取代，最终沦为次要目标。我一回到家就消失了。我没有回复任何人。我变得与世隔绝。任何形式的邀请，我都毫不犹豫地拒绝。我的每一个举动都感觉自然而然。我渴望自律。这让我感到快乐。我的思绪恢复了。我的身体恢复了。我的生活恢复了。我的整个世界在一瞬间发生了改变。但为什么？", {"h": "1.走极端会改变你的大脑"}, "“同时放电的神经元会连接在一起。”这就是赫布定律，一句名言概括了与神经可塑性相关的神经心理学理论。你可能知道，神经可塑性是指大脑在一生中通过形成新的神经连接来重塑自身的能力。你的大脑并非一成不变，而是一个动态的网络，能够根据你的经历、思想和行为进行适应、学习和改变。采取极端措施来改变生活有助于加快这一过程。", "人们常说“坚持是关键”，这确实没错，因为重复练习可以通过持续的努力来强化神经通路，但我们可以更进一步。新奇事物和挑战更能刺激神经可塑性。所以，当你全力以赴地追求某个目标时，你的大脑就会进入一个能够快速适应并帮助你将其变成新标准的环境。", "2.强度和痴迷会形成一种神经化学物质混合物。", "大多数人陷入一成不变的生活方式，是因为他们寻求外在的激励。", "但是，当你在这种讨论背景下沉迷其中时，你的动力来自于内在的驱动力。", "它们彼此叠加、相互加强，从而维持一定程度的心流（最佳体验，或最令人愉悦的心境之一）：", "好奇心——探索未知、学习如何改变、填补知识空白的渴望。它能带来多巴胺（来自新鲜事物）和去甲肾上腺素（提高注意力，使你做好学习准备）。", "激情——对能够改变人生的道路充满热情，会带来更多积极的多巴胺和去甲肾上腺素分泌。", "目标感——一种感觉，即你的行为对超越自身的事物有所贡献。达成目标会释放更多多巴胺，从而强化这种行为。血清素源于成就感和归属感。催产素源于联结感。", "自主性——渴望掌控自己的生活和工作，控制自己的选择、行动和环境。这会再次促进多巴胺分泌，降低皮质醇水平（皮质醇代表被束缚感带来的压力），从而激发创造性决策。", "精通——学习和成长的过程本身就是一种奖励。它能带来持续的愉悦感，让你保持专注。", "当你渴望改变，并打算度过接下来的6个月时，当我们讨论如何安排这些事情时，你就会明白这一切是如何发挥作用的。", "3）你的思维会根据你痴迷的事物来过滤现实。", "一个自认为“注定失败”的人，即便怀着美好的愿望或坚定的意志，即便机会唾手可得，也总能找到失败的途径。一个自认为遭受不公对待、注定要受苦的人，也总能找到种种境遇来印证自己的想法。——麦克斯韦·马尔茨", "我们的大脑天生就具有生存本能。", "但作为人类，有趣的是，我们不仅像动物一样试图保护和复制我们DNA中的信息，我们还试图保护和复制我们意识中的信息。", "也就是说，当我们的身体或身份受到威胁时，我们会感到受到威胁。", "从消极方面来看，我们会注意到那些强化我们固有信念和世界观的信息，这往往会导致我们对那些质疑我们宗教或政治信仰的人进行猛烈抨击。我们的身份认同感到受到威胁，大脑的应激反应会发出这种信号，因此我们感到需要“生存”。", "从积极的角度来看，当你认同自己所执着的目标时，你会注意到周围环境中的各种机会，从而强化你正在成为的更高层次的自己。由于你的身份认同更高，它会努力维持在这个层次上，促使你积累知识并采取行动来实现这一目标。", "由于我们的祖先生活在资源匮乏的环境中，当他们注意到一些有助于他们生存的东西，比如灌木丛上的浆果或用来生火的木柴时，多巴胺就会涌入他们的大脑，提高他们的注意力。", "如果我们从控制论的角度出发，并将之应用于心理（心灵/灵魂），就会发现我们的心灵拥有某种指向目标的归巢机制。它会接受对自身有益的信息，而拒绝无益的信息。因此，你无需费太多力气就能朝着目标前进。", "总之，如果你执着于某个目标，宇宙就会为你提供实现目标所需的资源，从而助你一臂之力。", "面向未来的免费和付费指南", "进化从混乱中创造秩序。", "热力学第二定律指出，所有自然过程都会随着时间的推移而趋向于更加无序的状态。", "换句话说，熵随时间增加，熵是衡量系统混乱程度、无序程度或随机性的指标。", "这导致了“时间之箭”、不可逆性和决定论等概念的出现。", "时间是不可逆转的，并且正朝着熵增的方向发展。", "然而，这并非全部真相。宇宙并非走向世界末日，最终以烈火毁灭。恰恰相反。", "伊利亚·普里戈金在其著作《不确定性的终结》中提出，这种“时间之箭”并非仅仅是一种错觉，而是现实本身的一个基本特征。当一个系统偏离平衡状态足够远时，它就会变得不稳定。", "关键在于：这种不稳定性会导致新的、复杂的、有序的模式自发出现，这种模式被称为“耗散结构”。", "想象一下，大量的水从水龙头流出。当水顺着排水管流下去时，会汇聚成一个美丽的漩涡。这就是从混沌中产生秩序。", "各位技术爱好者们，让我们更深入地探讨一下。", "我喜欢将宏观模式与实际应用结合起来，因为它们往往最接近真理，而且不会像理论上那样被某种方法或范式所束缚。", "当我们从整体上思考宇宙时，我们会发现它是由整体和部分组成的。", "不仅仅是部分，也不仅仅是整体，而是整体与部分的完美结合。万物既是自身独立的整体，又是另一个整体的一部分。从上到下，无一例外。", "原子既是整体，也是分子的一部分。", "分子既是细胞的整体，也是细胞的一部分。", "细胞是生物体的一部分。", "生物体是环境的一部分。", "字母 → 单词 → 句子 → 段落", "物质→生命→心灵→灵魂→精神", "采集狩猎 → 园艺 → 农业 → 工业 → 信息社会", "无限嵌套的层级结构，以及无限相互连接的链接。", "随便挑一件你能看到、听到、触摸到、尝到、闻到或想到的事情，你就会明白这一点。", "现在，这些整体-部分结构拥有各种原则，这些原则描述了它们的特征和行为，例如它们的基本能力，包括自主性（自我保护）、共融性（自我适应）、自我超越和自我消解。如果你想了解更多关于这些原则的信息，我推荐你阅读肯·威尔伯的《万物简史》。这本书是我最喜欢的书之一，还有《整合心理学》，这本书现在让我大开眼界。", "我想重点讨论这些整体-部分关系的一个特点，它与普里戈金的论点密切相关：", "进化从混沌中创造秩序。", "物质演化，生命出现；生命演化，意识出现。", "任何事物发展得越完善、越复杂，就会形成一个新的整体，其结构包含了复杂的组成部分。", "请耐心听我慢慢道来，我会努力把这一切联系起来。", "将熵的概念应用到心理层面，就得到了心理熵。", "换句话说，人的思维倾向于无序、随机、混乱等等。", "在你的个人生活中，当你感到迷茫，或者感觉生活陷入混乱时，你就有机会展现出更高层次的自我。", "正如我在生日那天因为缺乏进展而感到沮丧的故事所表明的那样，你需要达到不协调和顿悟的十字路口。", "一旦你对所处的环境有了足够的了解，你就会开始感觉自己像是被撕成了两半。", "你内心深处的一部分想要保持现状。", "你内心深处渴望改变。", "当你向更高层次靠拢时，你会获得洞察力。", "把你推向极端的临界点。", "消失3-6个月，专注于4个习惯", "新知识的获得源于你对所需知识的执着。持续思考问题，答案终将揭晓。人类历史便是这一真理的最佳证明。一个人遇到问题，便会执着于此，直至找到答案……或许需要一周、一个月、一年、十年、一个世纪，甚至一千年，但宇宙似乎总是在不断涌现出解决方案。——肯·威尔伯", "僧侣模式。", "我相信你一定很熟悉它。", "这个概念在自我提升领域已经讨论了十多年，但最近由于其常态化，它已经变质。每个人都在谈论它，而且因为每个人都知道它，所以它常常被简化为“切断与所有人的联系，赚取更多金钱”这种肤浅的定义。", "我们不会那样做。", "事实上，我们甚至都不打算遵循僧侣模式的原始含义。", "马拉犁发明后，自由人不必再像以前那样花费大量时间狩猎食物，因为食物变得非常丰富。这使得他们（历史上第一次）能够追求一些专门的兴趣，例如写作、数学、建立帝国，以及我们今天要讨论的——沉思，思考自身的存在。", "人们很快意识到，神性并非存在于“彼岸”或“高高在上”，与神话中的神祇同在，而是存在于“我们之中”。此后不久便进入了轴心国时期，革命性的精神和哲学思想在多个文明中涌现。例如古希腊的苏格拉底、印度的释迦牟尼佛、中国的祖师爷。", "这一精神上的突破具体来说是“纯粹的提升”。", "灵性提升或禁欲主义是一种将物质世界视为邪恶的观点。由于天国“存在于此”而非“存在于彼”，金钱、性、食物和享乐都被妖魔化了。", "真正的僧侣修行之道正是如此。这是一段致力于提升灵性、实现自我觉悟的时期。", "问题在于，大多数不拘泥于教条的人都明白，灵性只是解决问题的一部分。它固然重要，但把所有问题的答案都简化为冥想，就如同把答案简化为原子、金钱或仅仅是零件一样糟糕。", "相反，我们将暂时消失一段时间，全身心投入到追求更美好生活的事业中。", "这段时期你会执着于某个问题，直到问题解决为止。而在这个例子中，我们的问题是，我们想要彻底改变我们的生活。", "我们需要一种全方位的僧侣模式，如果你愿意这么称呼的话。", "这分为两部分：防守和进攻。", "防守——排除干扰", "专注力不仅适用于工作。", "分心因素不仅仅是那些让你无法专心工作的通知。", "“消失”的全部意义就在于扰乱原有的秩序，一夜之间改变你的身份，摆脱那些拖你后腿、消耗你能量的寄生虫，让你无法将精力投入到创造更美好未来的选择中。", "为了追求极致，一次性改变所有事情比一次改变一件事要容易得多。", "撕掉创可贴。", "不要理会那些只会索取从不付出的人。", "任何会让你偏离目标的邀请都应该毫不犹豫地拒绝。", "任何对你无益的坏习惯，明天都必须停止，没有例外。", "能够自主选择自己的界限，这种感觉真是太棒了。", "摆脱那些分散你注意力、让你无法专注于你能做的最高善事的事物。", "诸如思绪、担忧、饥饿或工作相关的视觉干扰等琐碎的干扰，将在接下来的步骤中以及你全身心投入这条道路的过程中得到解决。真正投入的标志是，干扰甚至没有机会进入你的注意力范围。", "进攻——4个专注习惯", "美好生活源于对真、善、美的追求。", "追求真理。", "善是主体间真理，是对人类或社会有益的——做正确的事。", "真理是客观真理，它源于科学研究（科学获取数据，数据即经验，经验涵盖物质、心理和精神层面）——学习和理解事物的真实面貌。这是一个过程。", "美是一种主观真理，是美学的领域——发现并创造你周围的美。", "当我们把这种追求应用于我们自己的个人生活，而不是社会变革或其他系统性问题时，我们的注意力就会转向我们的日常习惯。", "有很多习惯可以满足这些条件，但我只想提供一个清晰简单的建议。", "接下来6个月，你每天都要消失一段时间，去做以下这些事。", "一个项目。", "一本书。", "一次冥想。", "一次锻炼。", "1）一个项目", "工作是生活中必不可少的一部分，它与休息和休闲形成对比。", "但大多数人都在做自己讨厌的工作，于是他们因噎废食，希望从此不再工作。这是一种错觉。你不会在永无止境的假期和休息中感到快乐。更何况，普通人对休息的理解是自我毁灭，他们用享乐来麻痹自己，逃避为实现他人设定的目标而奋斗所带来的痛苦。", "选择一个能为你理想生活奠定基础的项目。", "这可以是任何事情。", "一个能够培养独立工作能力的创意项目。", "一个促成职业转变的作品集项目。", "大多数情况下，考虑到人工智能的现状，我建议至少尝试以某种形式进行创业，因为如果你是适应性强、能主动避免被取代的人，你就不会被取代。", "因为你试图将美好、真和美融入到你的作品中。但当别人把工作交给你时，你无法控制这些。", "你的工作，以及推动你走向这项工作的项目，本身就是美好品质的体现。创业的艺术在于解决他人生活中的问题。它体现了你如何通过扮演改善他人生活的角色，为一个小群体做出贡献。如果你能将“真实”融入到基于直接经验的解决方案中，并通过展现你人格的深度来体现“美好” ，那么你就走在正确的道路上。", "每天投入一小时深度工作，从事一个可能改变你职业生涯的项目。", "把它记在你的日历上。", "感觉不像工作的工作，是世界需要的（好的）、你所经历的（真实的）和你深切关心的（美好的）的交集。", "工作，如果做得好，就等同于生活。", "它是你一切行动的核心支柱。", "2）一本书", "你肯定能在6个月之前看完一本书。", "你可以读更多，但是说“2 本书”会破坏一切都从“1”开始的乐趣。", "如果你想改变自己的人生，你需要掌握相应的知识。", "你需要学校无法提供或从未提供过的教育。", "你需要沉浸在那些已经过上你想要的生活的人的想法中。", "这很简单。", "一本书。", "每天30分钟。", "仅仅因为好奇而学习新事物，是真我的最佳体现。", "而且，你会发现，简单的探索行为就能带来新的想法，从而推动进步。", "3）一次冥想", "工作可以是美好的、精神上的，但它并不能完全取代维持你与现实联系的习惯。", "我所说的冥想，并不是指坐在黑暗的房间里任由思绪飘荡，尽管那也是一种非常可行的方法。", "在我看来，冥想是一种生活方式。", "用惊奇和感恩的眼光看待世界，注意到身边那些在我们压力过大、心胸狭隘时往往会被忽略的奇妙事物。", "从这个意义上讲，冥想的目的是觉察深度。", "为了摆脱肤浅生活的陷阱。", "每天至少抽出 10 分钟时间，尝试通过你的感官去细致地观察现实。", "出去散步，只专注于感受双脚与地面的接触。", "凝视一棵树，留意你以前从未注意到的精巧细节。", "与爱人交谈时，要全神贯注地倾听。不要只关注字面意思，还要注意语气、表情，以及所有的一切。", "盯着你的手看 10 分钟（是的，我是认真的），让你的思绪更深入地探索细节。", "洗碗时感受手上的水渍。此生第一次，用心感受你触摸到的每一样东西。聆听寂静的声音，或是远处汽车的轰鸣。细细品味哪怕是最普通食物的复杂香气。", "不要把事情想得太复杂。", "4）一次锻炼", "任何人都没有权利在体能训练方面当个业余爱好者。一个人如果老了却没能见识到自己身体所能达到的美感和力量，那将是一种耻辱。--苏格拉底", "回到现实由整体和部分组成的这个话题：", "另一个主要信条是，对较低层次的毁灭对较高层次的毁灭也是自我毁灭。", "如果我们毁灭了地球，人类也将随之毁灭。", "如果癌细胞侵入机体，机体就会生病。", "如果从段落中删除一个句子，段落往往会失去原有的意思。", "你生活在你的身体里。", "你应该把学习、训练和尊重它当作你的全职工作，因为任何其他做法都无异于自杀。", "不仅如此，健康状况不佳还会对你的创造力、工作质量以及人际关系的深度产生连锁反应。这一切都是相互关联的。", "坚持完成一次锻炼。", "做你最想做的事。", "找一套跑步计划、举重计划、普拉提训练计划，无论是什么都行。", "关键是要关注让你每天都能站在这里的身体。", "4个简单的习惯可以彻底改变你的人生。", "4个简单的习惯可以让你与美好、真理和美保持一致。", "4 个简单的习惯可以通过好奇心、热情、目标感、自主性和精通感，带来更高层次的快乐。", "厌倦了生病。", "允许自己走极端。", "消失，然后以面目全非的面目回归。"], "wcount": 6310}, {"group": "人生重置与改变", "gsub": "从一天到一生 · 打破默认模式", "icon": "5", "title": "12条规则，助你在12个月内改变人生", "paras": [{"h": "12条规则，助你在12个月内改变人生"}, "我的人生哲学（精简版）", "有了行为准则，生活会美好得多。", "因为大多数人都被蒙蔽，误以为自己想要的是“自由”。绝对的自由等同于绝对的混乱。你之所以认为自己想要自由，唯一的原因是你生活在一套并非由你制定的规则之下。所以，当你感觉需要逃离现实生活时，你会请假去度假。但大约一周后，模拟的蜜月期结束，旅游的新鲜感也消退了，你会发现自己感到空虚，想要回到有规律的生活。从长远来看，对于大多数厌恶工作的人来说，你迫不及待地想要退休——这种承诺从你小时候就被灌输给你，就像Clickfunnels网站上那个带有40年倒计时的着陆页一样。你却很少意识到，这不过是又一次你会感到厌倦的假期，因为这就是人的思维方式。我们大脑的核心机制是“模式制造机器”，进化是为了用有限的资源解决特定的问题，而不是为了处理无限的可能性。", "心流心理学的创始人米哈里·契克森米哈赖认为，幸福源于“掌控我们意识的内容”，从而创造出我们所知的心流状态：一种完全沉浸其中的状态，人们在这种状态下体验到深深的愉悦、创造力和对生活的全然投入。", "你又不是想要自由。你想要拥有制定自己游戏规则的自由。", "你不想被父母、老师或雇主设定目标，但你误以为这是不想接受整体的秩序，于是你渴望自由——而自由恰恰会让你的生活变得更糟。这是一把双刃剑。如果你想增加生活中的乐趣、创造力和减少干扰，解决办法就是像所有成功人士一样：发现并创造一套个人行为准则。你需要创造属于自己的小世界，并沉浸其中。大多数人都会告诉你目的地。有些人会为你指明前进的方向。但是没有人会给你提供导航系统，让你自己设定目的地并创建路线。下面你不会找到其他大师的“成熟系统”，而是一个元框架，帮助你发现你独特的规则。", "这是改变你人生的12条规则。给自己12个月的时间。", "1.拒绝平庸的生活。", "人生就是一系列的选择。决定所有其他决定的唯一决定，就是坚决拒绝你出生时就被设定好的人生轨迹。我希望你把你的思维框架理解为你看待世界和做出决定的方式，这些决定最终会决定你的人生走向。但这个框架并非一成不变，它会随着你知识和技能的积累而发展演变，容纳更多复杂的内容。你渴望自由，这表明你并没有创造自己的思维框架，因此你无法掌控自己的人生，所以你想摆脱这个框架。但你目前的发展阶段并不适合做出这样的决定。当你真正厌恶与其他人一样的结果时，你就会开始形成一种反愿景。如果你想让它成为你生活中一股强大的负面能量来源：每次遇到不喜欢的事情，都把它写下来。出去走走，想想如果继续做同样的事情，你的生活会走向何方。回顾过去，记下你永远不想再经历的事情。收集所有你曾经因为受制于他人安排而忽略的信息点。这样做之后，你的框架的第一个外层部分就开始成形了。现在你可以停下来，思考并权衡是否应该做出某个决定。你现在有了可以摆脱的事物，并做出相反的选择。现在我们需要一个努力的方向。", {"h": "2.致力于卓越"}, "我这么说并非出于傲慢。但我从来不担心自己未来想要什么。我从未将理想的生活视为一成不变的目标。我知道随着年龄的增长，我对未来的憧憬也会随之改变。问题是，我十几岁的时候观察了社会，很快就意识到我不想要的生活：一份我讨厌的工作，一副我讨厌的身体，一个我讨厌的伴侣，以及一个讨厌我的大脑。仅凭这一点，我就很容易明白自己该做什么。我为未来设定的是目标，而不是结果，这让我有了几种选择：无论失败多少次（我失败了 7 次），我都要成为一名企业家，这样我就可以控制我的工作时间和工作内容。要想拥有强壮、健美、充满活力的体魄，就必须把训练和营养放在首位。通过不断承受不确定性和情绪劳动带来的超负荷，培养强大的心理素质。对卓越的追求塑造了我的远见卓识，这是我思维框架的第二个外层部分。如果我训练自己的思维始终保持在这个框架之内，无论我采取什么行动，我的人生都会很美好。这些话可能不会引起你的共鸣，但我感觉大多数人都想要某种形式的这些东西。每个人内心都有一个声音，渴望发挥自身潜能。发展心理学对此深有体会。你内心深处明白，“我的人生目标是什么”的答案在于，在真正重要的四个方面不断进步：心智、身体、精神和工作。工作是你为他人和世界做出贡献的方式，是超越自我的存在。可以说，它是人生拼图中最重要的一块，并会影响到其他领域。但对大多数人来说，对未知的恐惧大于对最终变得和其他人一样的恐惧，所以我们需要减少这种感知到的恐惧。这就是下一条规则的作用所在。", {"h": "3.标准塑造身份"}, "你之所以没有到达你想去的地方，是因为你对现状感到满意。如果你满足于银行账户里只有 0.50 美元，你就不会想要改变现状，许多改善健康、人际关系或财务状况的机会也会与你擦肩而过。如果你觉得银行账户里有十万美元就足够了，那么低于这个数额你就会觉得是个问题，需要解决。而问题，如果当成项目来处理，才能让生活充满乐趣。当你设定高标准时，你大脑的生存机制会注意到那些能帮助你维持这些标准的机会。在这种情况下，你会注意到更多能让你银行存款增加的机会。为了提升技能，你的谷歌搜索方式开始发生变化。你开始和朋友们谈论金钱。所有这些微小的选择都会逐渐累积，最终产生结果。通过有意识地寻找与你所面临的问题相关的特定信息，你可以重塑你的思维模式。如果你身边的人——无论是现实生活中的还是网络上的——都让你觉得超重 100 磅、身无分文、做着自己讨厌的工作、和自己厌恶的伴侣在一起、每晚酗酒等等都是“可以接受的”……你觉得你的生活最终会变成什么样？如果你的标准要求你吃得健康，那你看到麦当劳的快餐就会觉得恶心。你觉得这话听起来很蠢，只是因为你的标准太低了。重视健康的人如果没得选，就会觉得很痛苦。对他们来说，健康饮食并不难，反而是一种享受。而你却觉得不健康饮食很痛苦。这完全颠倒了。反标准的力量更加强大。写下为了实现目标，你不愿意做哪些事。就我个人而言，我不想像大多数创业者那样，为了创业而牺牲健康、社交生活或时间。大多数人认为这些都是创业的必然组成部分，但事实并非如此。事实上，设定这些限制条件才能获得创造性的成果，因为创造力正是在限制条件下产生的。你可以选择每天工作12小时以上，硬着头皮创业，也可以每天只投入4小时。当你这样做时，你的思维会更容易捕捉到更具杠杆效应的商业机会。你会把每天超过4小时的工作时间视为问题，也只有这样，你才能想到鲜有人想到的解决方案，从而在众多竞争者中脱颖而出。这并非一成不变。当然，有些日子你可能需要加班或者放弃和朋友聚会。标准只是你思维框架的一部分，它可以帮助你发现机会，并使你的行动更加清晰。", {"h": "4.基于项目的学习"}, "你知道自己不想要什么样的生活。你对你想要的生活有所规划。你需要掌握弥合两者之间差距的技能和知识。如何才能循序渐进地迈入未知领域，同时又能掌控过程中可能出现的任何混乱局面？", "个人项目。学习的最佳方法是构建一个实际项目，只在需要时才去查找信息。你的学习成果与项目进展直接相关。当你观看无休止的教程时，你的大脑会被各种噪音和混乱所充斥。大部分信息最终都会被浪费掉。这会导致压力过大、焦虑不安，并减慢你的学习速度。到了真正动手做项目的时候，你会感觉自己好像什么都没学到。无休止的学习会带来无尽的选择，而我们并不想要这样。“项目”可以是任何事物。你的健康可以是一个项目。你的事业可以是一个项目。Photoshop 中的一张图片也可以是一个项目。项目其实就是一种实现目标或朝着目标取得进展的结构化方法。你现在所处的位置与你理想的位置之间的桥梁，是一系列体现你自身价值的项目。如果你愿意，你可以将这些项目转化为产品，因为你已经解决了自己生活中的问题，现在可以帮助其他人也做到这一点。一个项目是你开始赚取独立收入的唯一资格。以下是开始步骤：", "选择一个能推动你人生目标实现的项目。把它想象成一个传统意义上的目标，但项目能将这个目标转化为一个系统。记笔记，把所有想到的东西都写下来。保存3-5个你想效仿的灵感来源。研究这些来源，分析它们的结构。把项目分成几个部分，设定里程碑，并列出你需要学习的内容。既然你已经准备好了，不要一开始就学习，而是从你已经知道的东西开始。学习源于实践，而非死记硬背。开始项目吧。让它暴露你知识的不足。尝试找出答案。在你最容易记住答案的时候去寻找它。如果你难以理清你的反愿景、愿景和计划，请使用此“人生重置 AI”提示来引导你完成它。", {"h": "5.每日杠杆"}, "每天至少完成 1-3 项能推动项目完成的优先任务。这就是你唯一需要的提高效率的建议。一条好的经验法则是：两周后，如果你在实现目标方面没有取得任何显著进展，那就说明你找错了方向。你肯定做错了什么。大多数人不会承认这一点，或者他们会故意做一些无关紧要的事情来逃避进步，因为他们内心深处其实想失败。那才是更大的问题。你的大脑会留意实现目标的各种机会，而许多人却潜意识里或根深蒂固地想要维持现状。他们渴望失败。对自己诚实。每两周在日历上安排一次进度检查。如果你离目标还很远，就需要调整目标，开始朝着目标前进，并获取之前不具备的知识，这将有助于你迈出下一步。", "目前，我们的框架由以下部分组成：反愿景 → 愿景 → 标准 → 项目 → 推动我们摆脱平庸、走向卓越的杠杆，从而形成一个紧密的反馈循环，使生活成为一场愉快的游戏……在大多数情况下。这就是基础。正是它推动你更深入地探索未知领域。但你究竟该如何应对一路上的高潮、低谷、情绪波动和不确定性呢？", {"h": "6.成为一名博学多才的通才"}, "传统教育和过度专业化会使人屈从于主流范式/体系。学习自然界的普遍规律，成为一名博学多才的通才。——丹尼尔·施马赫滕贝格", "人类天生是通才。人类制造工具是为了适应不同的生存环境。另一方面，像撒哈拉沙漠的狮子或阿拉斯加的北极熊这样的动物，如果被放到不同的生态位中，就无法生存。这不仅限于实体工具。人类发明了语言、文化、概念、宗教和故事等心理工具，以便适应环境、建立知识和技能，从而在任何情况下都能蓬勃发展。正是这种能力使我们与众不同。这是大多数人已经丧失的能力。你看，我们小时候都喜欢冒险，喜欢探索，喜欢弄明白各种事情。我们会犯错，也会从错误中学习。我们甚至会去触摸火。但是，这样一来，我们的学习就不再是关于真正的错误了。一切都始于我们的父母和老师不喜欢我们身上的那些特质。那些他们觉得烦人或不文明的特质。那些他们认为不会带来他们从小被灌输的、唯一正确的成功之路的特质，而他们还没有敞开心扉去接受“成功之路永远不止一条”这个事实。那么，那条唯一的真理之路是什么呢？这就是你感到迷茫、不知所措、焦虑、困惑等等种种感受的原因。原本应该安全可靠的道路，结果却恰恰相反。你每天被安排在一个由政府培训的专家面前，而这些专家显然并非从事你真正想做的事情。你每天要花六个小时，被告知该学什么、该怎么做，同时还要不断被催促着去追求一份工作和一张文凭，以此作为身份的象征。如果你了解人的思维运作方式，你就会明白，构成你世界观的目标（名牌学位和高薪工作）决定了你思维的潜在发展和自由。你的目标决定了你的视野。允许自己学习多种感兴趣的内容。", "7.创业是一种精神活动。", "我的预测是：未来的工作将主要由创业者组成，即便不是创业者，也是在越来越稀缺的岗位上拥有创业特质的精英员工。“入门级”将会消失。这样就只剩下两种选择：", "1.依靠政府救济，过上美好生活的机会渺茫。2.承担全部责任，成为一名企业家。", "不幸的是，“创业”和“经商”这两个词已经变得令人反感。人们认为创业只适合有才华的人，或者需要大量的初始资金。让我重新定义一下它。雇员和创业者的区别在于自主性和独立性。独立性高的人能够自主设定目标并主动追求，无需他人许可。而独立性低的人则被赋予目标，并被迫接受这些目标，因为他们的思维模式限制了他们看到其他选择。工业化教育和就业会滋生安于现状，对你的心理健康有害。它违背了你需要不确定性、挑战和持续进步才能茁壮成长的天性。人们之所以攀登高峰，是因为内心渴望挑战，但人终究会攀登到一定高度。一旦触及极限，他们便会以“我只是喜欢工作的稳定性”为借口，安于现状。他们因此错失了发现人生使命和迎接全新挑战的机会。这很危险。如果没有具有挑战性、自我设定的目标来拓展思维，你的自我发展速度将会大幅放缓，影响力也会大打折扣。工作占据了你生命的三分之一。如果这巨大的时间都浪费在停滞不前上，那么你最终陷入混乱将不可避免。对于有长远眼光的人来说，创业是唯一合乎逻辑的选择。这是一条充满不确定性的道路，需要学校里学不到的技能。你必须能够接受失败、拒绝和缓慢的进展。不要再把“员工”和“创业者”当作头衔来看待。", "把它们看作是心理状态。员工是被动的，被告知要学习什么。企业家是积极主动的，他们设定自己的愿景，通过好奇心学习，并创造推动人类进步的解决方案。秘诀在于培养一种极具影响力的技能，让你忍不住想要与人分享。你解决自己的问题，出售解决方案，并造福人类。这就是创业精神。就业并非我们的自然状态。人的本能驱使我们去追逐，但如今的威胁更多地来自心理和精神层面，而非物质层面。没有人愿意成为格子间里的一只猴子，每个人都渴望成就一番更大的事业。", {"h": "8.成为一名“创造者”"}, "数百万年来，创造力一直被认为是神灵的专属。然后人类开始慢慢了解事物运作的原理。我们制造了让我们能够在任何环境下生存的工具，驾驭了能源，并改造了地球。人类承担起了创造者的角色，但太多人迷失了方向。我们不知道未来会怎样，也不知道人工智能会如何取代工作岗位。但我们知道两件事。第一，问题是无穷无尽的。第二，问题是可以解决的。无论我们发展到何种程度，总会有下一个问题需要解决。这就是你要想过上有意义、有财富、有成就的生活所需要的一切。如果幸福——或者说快乐——是个人进步与为超越自身的事物做出贡献的结合，而这两者都是通过解决问题（无论是为自己还是为他人）来实现的，并且问题的解决又依赖于创造力，那么你未来唯一合乎逻辑且根本的目标就是通过成为一名创造者来体现创造力。换句话说，你可以通过创造你认为有趣的问题的解决方案，并将这些解决方案传递给他人以促进人类进步，从而找到目标与收益的交汇点，并在遇到下一批更复杂的问题时重复这个过程。尽管问题变得越来越复杂，但你也会积累更多的知识、技能和经验来解决它们。如果你学会控制混乱（混乱本身也是一个问题），那么随着问题的增多，生活反而会变得更好。每一个问题都蕴含着提升目标层次的机会。成为创作者一直都可能，但从未像现在这样触手可及。我们正处于第二次文艺复兴时期，而这场复兴正在互联网上以前所未有的速度席卷全球。这是一个人人都有机会成为爱因斯坦或莎士比亚的数字社会。在这个社会里，存在着消费者、创造者和公司。我所说的“创造者”，指的是你存在的本质。创造者能够进行自我反思，发现问题，探索未知领域，尝试各种解决方案，并创造出值得传承的事物。创造者生活在目标与利润的交汇点上。创造者是这个新社会构建意义的支柱。随着信息快速传播和日益加剧的混乱，人们不再信任一成不变的信仰体系。他们寻找与自己拥有共同愿景的创造者，寻找那些能够领先一步、提供相关理念并孕育特定知识的人。实现面向未来的途径是：从消费者转变为创造者。解决自身问题，将解决方案推广至全球，吸引志同道合的人。即便只有1000名忠实粉丝，你也能找到创造美好生活的力量。全能型人才，样样精通。写作、设计、营销、销售、拍摄、编程，做你天生的全能型人才。如果你想了解更多关于我的创业理念，请阅读我的第二本书《目标与利润》 。", {"h": "9.不确定性也是信号，而非噪声"}, "你应该感到迷茫。你应该感到不知所措。你应该感觉自己完全不知道自己在做什么。当你决定改变人生时，你究竟期望发生什么？你是不是以为只要你尝试去做某件事，所有可能的知识和技能就会立刻涌入你的脑海？当你致力于追求卓越时，你也致力于迎接充满不确定性的人生，因为你致力于终身学习。你的潜力取决于你愿意接受多少不确定性。关键在于，最成功的人对此毫不畏惧。他们不会把不确定性视为危险，所以不会启动战斗或逃跑的应激反应。他们能够头脑清醒地踏入未知领域，从而做出正确的决定。如何？因为他们意识到，所有巨大的成就都源于他们拥抱、驾驭和拓展不确定性的能力。他们意识到，“确定性”的生活是最没有价值的。工作是稳定的，你的薪水也反映了这一点。而创业则充满不确定性，这取决于你处于哪个阶段。从本地企业、代理机构、自由职业，甚至是信息产品起步，都属于第一阶段。虽然充满不确定性，但简单易行，而且你的年收入上限大约在100万到500万美元之间。之后，你需要通过组建团队或将业务模式扩展到软件或实体产品等领域，来进一步增加风险。投资也是如此。你可以把积蓄投资到“稳定”的401k退休账户里，这是第一层级。你可以投资股票市场，这是第二层级。你还可以投资企业、加密货币，甚至是风险更高的资产。当然，这些投资的回报率最高，但风险也最大。你需要尽可能地规避风险。不要挑战超出自身能力范围的事情。改变环境以减少损失的影响。搬进便宜的公寓。量入为出。如果你在年轻时还没有机会承担风险，就承担了过多的责任，那么将来就越难为自己改变生活找到理由。", {"h": "10.工程师的热情"}, "“你需要痴迷其中。”人们通常用“热情洋溢”来形容那些成功人士。如果你热情洋溢，你需要学会将这种能量从人身上转移到技能、兴趣或事业上。你不能，也不应该控制别人。更准确的说法是热情，但“热情”听起来不如“痴迷”那么酷炫前卫。“热情”一词源于希腊语“ enthusiasm”，字面意思是“拥有神性”或“受神启发”。它指的是被神圣的精神所附身或启发，暗示真正的创造力或精神力量来自个人自我之外。美好生活的秘诀在于，让你的每一天都充满让你充满热情的事情。因此，你能做的最重要的事情之一就是反向推导热情的来源，然后开始剔除、外包或接受那些与热情不符的事物。接受意味着选择如实看待现实，而不是试图控制无法控制的事情，不让这些情况蒙蔽和毒害你的心灵。注意哪些活动让你精力充沛，哪些活动让你感觉时间流逝缓慢，哪些活动让你轻松集中注意力。注意哪些事情让你感到兴奋、好奇和思想开放。尤其要注意那些让你因为思绪太多而难以入眠的情况。尽一切努力让你的生活充满这些想法，并排除任何阻碍你实现这些想法的因素。每天抽出1-2个小时来追求你的爱好。接下来的规则将有助于构建这些时间段。", {"h": "11.自我实验"}, "自我实验是彻底解决问题的唯一途径。人们可以诊断并为你的问题提供解决方案，但他们往往忽视了与问题当事人在视角、目标和经验方面的差异。以下是解决赚钱问题的两种方法：", "A：完全听从大师的指示。他们行事稳妥，墨守成规，并根据别人的蓝图降低自己的生活标准。B：会从多个渠道获取建议，并根据他们观察到的各种模式做出决策。他们会参考操作指南，但目的只是为了发现可以融入自身目标实现的原则。最终，通过学习和努力，他们会豁然开朗，并找到适合自己的独特方法。在减肥这件事上，A的情况要危险得多。你找到一个鼓吹素食主义的大师，开始严格控制饮食，把他的建议奉为圭臬，看到效果后，就盲目地信奉这种理念，把自己当成了先知。这很危险，也是意识不清的表现。你体重减轻了，感觉更有活力了，但由于缺乏了解，你认为只有素食才能做到这一点（顺便说一句，我并不反对素食，这只是一个简单的例子）。如果你的感情出现问题：可以找心理咨询师，多看YouTube上的建议视频，参加静修活动，尝试各种方法，直到找到合适的解决方案。你尝试的第一个方法可能并非最佳方案。", "如果你的企业没有增长，那就去买个课程，聘请个教练，试用一下新软件，跳出固有思维，制定一个新的战略……总会有办法解决你的问题，而当你执着于一种解决方案（这种方案可能无法彻底解决问题）时，你就失去了这种能力。", {"h": "第十二章——如何过上独一无二的生活"}, "最大的错误就是不去犯错。关键是，你与众不同。你知道这一点。你观察力敏锐，或许有些沉默寡言，不敢表达自己的想法，因为反正别人也不会听。但这种沉默正在吞噬你。你努力融入群体，努力将未来托付他人，努力妖魔化金钱、成功等等，因为“你不需要它们也能过上美好的生活”，但你需要创造。因为只有这样，你才能为他人做出贡献，才能与超越自身的事物建立联系，才能开启一段独特的旅程，最终摆脱机械式的生活——因为你有足够的金钱来摆脱对这种生活的依赖。问题是，你仍在寻找“唯一正确的道路”。我来告诉你，根本没有这样的事。你之所以没能达到你想要的高度，是因为你害怕犯错。我无法用言语表达我的感激之情。如果说有一句话是指导你人生的真理，那就是这句话。错误是大自然的指南针。如果说没有悲伤就没有幸福，没有失败就没有成功。这是普遍规律，是现实模式，是自生命诞生之初就存在的现象，因为没有虚无，就没有存在。在传统的道路上——比如上学和工作——你可能会犯错，但你仍然朝着一个狭隘的目标努力。这些错误并不会引领你走向一条新的、更好的道路，只会让你自怨自艾。当你决定获得自由——并拒绝那些从出生就被赋予的、让你思维狭隘、把你困在消极思想泡沫中的目标——你的错误就是黑暗中的一束光。但你不知道自己想要什么。这就是问题所在。你没意识到，你永远不会知道自己想要什么。它在未来，它并不存在，它只是想象。人生变幻莫测。你现在想要的东西，明天、后天，甚至十年后，都可能截然不同。但你永远不会踏上这段不断完善和提炼的过程，因为你似乎无法接受失败。当你意识到自己不想要什么，并朝着相反的方向努力时，你想要什么就会变得更加清晰。既然你一路走来没有犯过任何错误，那么你不知道自己想要什么也就不足为奇了。我的建议：无需征得他人同意，即可随心所欲。去参加派对。喝个烂醉。开始创业。整晚刷手机。做任何你想做的事。说真的，因为压抑这些欲望只会让你被它们束缚。但这里有个问题。你需要能够意识到哪些事情是错误的。如果你每天早上醒来没有重要的责任要承担，那么每晚喝得酩酊大醉就不算错。它不会影响你实现目标的能力。当聚会和酒精影响到比聚会和酒精本身更重要的事情时，控制它们就容易多了。既然你的学业和工作并不重要，你也就不在乎，照样去做。你需要自己的目标，而只有当你对现状彻底厌倦，并摒弃所有你曾经认为的真理时，你才能制定出这些目标。你需要从头开始。"], "wcount": 8981}, {"group": "人生重置与改变", "gsub": "从一天到一生 · 打破默认模式", "icon": "6", "title": "自律其实很容易", "paras": ["自律其实很容易。", "清晰度与力量", "如果你强迫自己去做，你就会失败。", "这就是大多数人对自律的误解。他们一听到“自律”这个词，脑海中就会浮现出大卫·戈金斯在艰苦训练中奔跑呐喊的画面。他们以为自己需要严加惩罚，才能努力工作，最终获得人生中的美好结果。“自律的痛苦必须大于懒惰的痛苦”这句话很有道理，奋斗也是值得讲述的故事的一部分，但大多数成功人士并不厌恶整个过程。事实上，他们从中获得了乐趣。他们渴望挑战困难。这揭示了一个重要的洞见：你已经朝着你应当达到的目标展现出了高度的自律性。这就是大脑的运作方式。目标是由环境塑造的。你的目标会成为你看待现实的过滤器，决定你关注什么，遗忘什么。你的大脑会帮助你注意到并记住有助于实现这些目标的信息。当然，你会朝着这些目标采取行动，你的身份认同也会因此而巩固。", "纪律是身份认同的一个特征。", "如果一个人从小就被父母灌输要努力成为好学生的观念，那么他/她就不需要强迫自己每天学习12个小时。这已经成为他的本性。", "一个经历过分手、饱受低落自信心折磨的健美运动员，不会在健康饮食或每天去健身房锻炼方面感到挣扎。事实上，如果他们做不到这些，反而会感到痛苦。因为如果他们不这样做，就无法更接近自己的目标，而由于这个目标与他们的身份认同紧密相连，他们会感到自己的生存受到了威胁，因为事实的确如此。人类的生存既依赖于生理层面，也依赖于概念层面（基因和模因，如果对我们而言重要的东西受到威胁，无论是我们的宠物狗还是我们珍视的信仰，我们都会感到威胁）。", "接下来就精彩了。游戏玩家不必强迫自己盯着电脑屏幕几个小时。喜欢电视剧的人会躺下来一口气看完一整季。而那些拖延工作的人——因为工作目标与他们的想法不符——会不停地刷手机，因为他们的目标就是不去实现目标。这些人并非“懒惰”，他们或许更应该说是自律，只不过他们的目标能带来立竿见影的回报。这不正是自律的本质吗？为了一个目标而坚持不懈地努力。而普通人却总是执着于平庸的生活。没错，大多数人根本没有意识到，他们对舒适的渴望远胜于对改变的渴望。事实上，舒适本身就是他们的目标。“可是丹！那些东西很容易做，也很舒服！做起来毫不费力！”当然，每天写作对我来说很舒服。对我来说，不去健身房比去健身房更痛苦。我试着像小时候那样玩电子游戏，但根本玩不下去。它们既无聊又让人过度兴奋。我还有更重要的事情要做。人类行为是目的论的，是控制论的。人的思维是一台达成目标的机器。我们以自身身份为视角来解读世界，而根植于我们思维中的目标塑造了我们的行为，最终铸就了我们。如果我们能够理解这个过程，或者对其进行逆向工程，我们就可以利用它来实现几乎不可能的目标。你读这篇文章是因为你试图强迫自己自律。但这永远不会奏效。无论你是想赚更多钱还是备考，如果你遵循这个方法，你就不必担心分心或拖延。", {"h": "炼狱是实验室"}, "你想变得自律的原因是你已经厌倦了人生目前的阶段。你开始意识到自己停滞不前了。你开始注意到，每一天都和前一天一样。你开始意识到，如果你继续做同样的事情，你将无法获得你想要的生活。你现在处境尴尬，不想再待在这种状态了。这很痛苦。但你误解了这种痛苦，想到的第一个解决办法就是：更加自律。大多数人就是这样陷入恶性循环：强迫自己去做不想做的事，两周后又放弃，回到自己曾经发誓要远离的生活。疼痛是变化发生的信号。出路在于正视现实，意识到你当下的生活有多么痛苦。因为一旦你感受到的痛苦超过了你渴望达到的目标所带来的痛苦，自律就不再痛苦，因为你不再需要强迫自己去做。", "第一步是写出：把你现在生活中所有你讨厌的事情都说出来（我现在不想听什么积极思考，你错了）。如果你不改变这些事情，你将会过上怎样的生活？然后，静下心来思考一周。好好琢磨琢磨。出去散散步，让你的思绪随着这些想法自由驰骋。过一段时间，如果你不逃避痛苦，你就会开启人生的新篇章。", "自律不是培养出来的，而是后天形成的。", "我健身已经有大约12年了。我每天都在写作，已经持续了大约5年。我每天走1万步，已经坚持了大约4年。对于以上所有情况，我第一次尝试养成习惯时，屡屡半途而废。我记得有一次被邀请去散步，我却觉得那是给老糊涂人准备的。我当时的想法恰恰印证了我之前的想法，那就是保持现状。我并不想做那些事，但又觉得不得不做。当我最终养成习惯时，感觉和之前几次强迫自己养成习惯截然不同。那些习惯并不“难”做，而是我不断尝试和探索的自然结果。", "我养成这些习惯的原因有以下四个：", "1.我深深意识到自己生活中存在一个痛苦的问题。", "2.我寻找证据来支持我理想中的未来形象。", "3.我改变了我的物理环境和数字环境，以巩固我的新身份。", "4.我每周都会抽出时间来做这些事情，就好像我余生都要做这些事一样。", "中学时，我的自信心跌到了谷底。我个子很高，身材也很瘦长。我感觉自己很不自在，所以很想改变这种状况。我把这种痛苦转化为动力，开始学习健身和营养方面的知识。我甚至记得在上学的公交车上读过《巅峰表现的营养时机》。我开始在房间里做俯卧撑，放学后去健身房举重，从此便爱上了健身。为了改变我的环境，我每天放学回家后都会直接打开电脑，在YouTube上看两三个我最喜欢的健身博主的视频。他们会给我提供一些健身计划、锻炼方法和饮食建议。他们是我青少年时期的榜样，也塑造了我如今的大部分行为。不要忽视社交媒体的积极力量。", "这段时间以来，我并没有因为别人说某种饮食或训练方法好就随意选择并强迫自己坚持下去。那些对生活不满的人的共同点在于，他们常常让别人自信满满的建议左右自己的生活。我把这段时期视为探索和实验的时期。我当时在收集各种设想。我是在试驾未来自己的各种可能性。我读那本营养学书籍是因为它听起来很有意思。我忍不住好奇。它或许能解决我的问题。读着读着，我就开始尝试书中一些新颖的策略，比如像一些奥运选手那样，在运动前摄入50克简单碳水化合物和25克蛋白质。（顺便说一句，我读书大多如此。我不会强迫自己读书，也不会坚持读书。我只读那些让我情不自禁想读的书，而且我也不介意长时间不看书。）在观看健身视频的过程中，我发现了一些新的锻炼方法，总是充满热情地尝试。这并不难，也不需要强迫自己。尝试一些可能改变我生活的事情让我感到很有趣。随着时间的推移，我学到的所有零碎知识逐渐融合，最终形成了对健身和营养的深刻理解。我成为了自己的老师和教练。问题在于：（1）大多数人不会对生活中的痛苦问题格外敏感，因此他们的大脑不会在看到潜在的解决方案时释放多巴胺；（2）他们学习时没有进行实验，因此他们永远无法取得必要的进步，也就无法形成保持动力的反馈回路。如果你对写作感兴趣，这里有一篇文章，详细介绍了我的写作过程。或许你可以从中找到一些可以尝试的方法。", {"h": "如何打造身份"}, "第一步是认知。你是怎样的人，决定了你认为什么重要。你首先必须意识到，无论你是否意识到，你都在追求一系列目标。这些目标塑造了你解读现实的方式，而你通常会注意到那些印证你当前生活方式的事物。你思维运作的目标源于后天习得，而后天习得又源于你的环境。你的父母、老师和文化环境把你引向了一条死胡同。", "第二步是策略性认知失调。为了避免陷入迷茫——进退两难——的状态，你要让“真实的你”和“理想中的你”之间的差距越来越大。你要通过观察如果不改变最终会变成什么样子，来培养对当前生活方式的不满。通过意识到生活中存在的问题，你的大脑会做好模式识别的准备。你的大脑会开始确认改变是正确的选择，并帮助你注意到那些有助于改变的信息。", "第三步是环境改造。取消关注那些发布对你改善生活没有帮助的信息的人。扔掉你凌晨三点吃的食物。拿出纸笔，把你这周要做的事情精确到小时地规划出来。每周回顾并迭代。你需要这个反馈循环。让自己沉浸在那些能让你体验新事物的人、事、物中。即使你不认同某些账号的观点，也要关注它们。在亚马逊上浏览，直到找到一本听起来有趣的书，哪怕你最终只读了开头几页。意图至关重要。意图是你为自己的思维设定了一个方向，让它朝着这个方向重塑。", "第四步是自我实验。因为不通过实验解决的问题，永远无法彻底解决。与其被动地接受另一个目标，不如尝试一切方法，直到找到让你无法抗拒的那件事。然后，反复进行这个过程，直到它成为你的一部分。"], "wcount": 3322}, {"group": "人生重置与改变", "gsub": "从一天到一生 · 打破默认模式", "icon": "7", "title": "30天多巴胺戒断疗法，重塑人生", "paras": [{"h": "30天多巴胺戒断疗法，重塑人生"}, "-因为现代生活的大部分都变得模糊不清，你对此感到厌倦了。", "这适用于那些生活开始失去奇妙和乐趣的时刻。当你感到疲惫多于平静时。你可能没有意识到，你正在把咖啡当作一种安全毯。当你开始注意到眼下出现黑眼圈时。当你回首往事，那时生活似乎无比顺遂，近乎神奇。因为当今世界存在着残酷的现实。仅仅是活着，我们就承担着风险。但这不是那种好的风险。过度沉迷科技产品（社交媒体、流媒体、游戏和新闻）的风险。模拟性刺激（色情作品和约会软件）的风险。消费品（酒精、毒品、垃圾食品）的风险。寻求刺激（赌博、疯狂购物或去极端场所）的风险。我不是那种会妖魔化你行为的人。我当然也不是什么圣人。我只是个喜欢研究奇奇怪怪的东西，然后分享自己所学的人（当然是为了赚钱，但也是为了分享意义。如果我想发大财，我就去创立宗教了）。网上大多数人都喜欢装出一副完美无缺的样子。当你做错事的时候，他们会第一时间指出来；然而，当你了解他们的生活之后，你会发现他们的精神、身体、心灵和经济状况通常都不是你想要的那种。这周你至少做了5次别人认为不好的事。那没关系，你会活下来的。但这并不是我们今天来讨论的重点。", "相反，我想谈谈这个：生活在当今这个追求便捷享乐的世界，如果你不想成为和尚（因为如果你想成为和尚，那是出于自负，我觉得这很可笑），你需要一个工具来对你的生活进行“恢复出厂设置”。人类创造工具是为了解决问题。科技在带来问题的同时，也使人类能够做到以前不可能的事情。如果你每年至少这样做一次，持续 30 天，就能缓解现代生活带来的影响。换句话说，你会重拾孩童般的好奇心，从而更深刻地体验生活。", {"h": "廉价多巴胺流行病"}, "你的大脑依靠显著性网络运作。也就是说，能提供最多多巴胺的事物就变得最为重要。我想你已经能看出这会演变成多大的问题了，但我们不妨轻松一下，把它分解开来。正如我们已经讨论过很多次的那样，米哈里·契克森米哈赖发现，心流状态（或人类体验的最佳状态……纯粹的享受）需要一种特定的技能来挑战比例。如果目标难度超出你的技能水平，你会感到焦虑；如果难度太低，你会感到无聊。你不会在自己只有1级的时候去挑战100级的角色，这不合逻辑。过度刺激会破坏心流状态或愉悦感，因为它提高了你对刺激的认知标准。任何比手机、赌博、色情、派对等等更无聊的事情，都会被你的大脑自动贴上“无聊”的标签。“多巴胺戒断”已成为一种营销成功的重置人体刺激基线的方法。", "它之所以如此有效，原因有三：", {"h": "1.无聊是通往新奇的门户"}, "心理学家卡尔·荣格一直强调阴影工作的重要性——直面我们通常会回避的、令人不舒服的自我面向。无聊地坐着就会产生这种效果。当理性思维不再试图解决所有问题时，它就能激发突破性的洞察力。它揭示了我们被外部环境影响下的真实欲望。它为 3 个心流触发因素奠定了基础，使你更有可能进入一个高强度学习和构建的阶段：深度具身化——与不适共处。新鲜感——无聊会迫使你寻求新的、更健康的刺激。不可预测性——不知道虚空中会涌现出什么。你感到无聊是因为你没有任务。你没有任务，因为你在玩别人的游戏。与直觉相反，解决办法是停止玩那些游戏，忍受无聊，直到你自己的游戏变得清晰起来。", "2.大脑在缺乏多巴胺时会增加多巴胺受体的表达。", "享乐适应就像你的心理恒温器。无论温度升高还是降低，它总是试图回到设定值。这就造成了心理学家所说的“享乐跑步机”。你总是奔向下一个快乐源泉，但满足感却转瞬即逝。每一次体验都成为你的新常态，需要更强烈的刺激才能达到同样的愉悦感。但当你剥夺自己的快乐时，就会发生相反的情况。一种享乐主义恶性循环的逆转。慢慢地，简单的快乐又重新变得令人愉悦。你会体验到佛教所说的“初心”。当你外出散步时，你会注意到天空的细节。你会注意到精心烹制的菜肴中淡淡的迷迭香香气。生活变得充满活力，这才是生活应有的样子。", "3.你需要的不是动力，而是清晰的思路。", {"h": "人类所有的问题都源于人无法独自安静地待在房间里。——纳瓦尔·拉维坎特"}, "你上一次为涌现创造空间是什么时候？这就是现实。秩序会在混乱中产生，或者说，会在对混乱的看法发生改变后产生。", {"img": "dan07_02", "cap": ""}, "多巴胺戒断能为意义建构创造空间，也就是处理和整合经验。在信息时代，现代技术造成了“语境崩溃”。我们的大脑处理信息的能力有限，通过意识层面，每秒大约只能处理50比特的信息。如果你连续一个月每天都暴饮暴食，你可能会增加相当多的脂肪。如果你自从手机上安装了某个应用（比如社交媒体）之后，每天都沉迷于信息轰炸，那么你的精神状态就如同肥胖症一般。你之所以没有意识到这一点，是因为这已经成为一种常态（体内平衡）。当你把自己逼到感到无聊的地步时，你几乎会被迫面对多年来一直压抑的所有问题。", "这会很痛苦，但如果你坚持足够长的时间，你就会突然豁然开朗，开启人生新阶段。", {"h": "多巴胺戒断方案"}, "最终目标不是成为苦行僧或僧侣，也不是隐居山林，从此不再体验现代生活的乐趣。目标是培养自主性和能动性：即有意识地做出选择，而不是被动地做出反应。能够觉察自己的人生方向，制定与理想未来相符的新目标，并在无需他人许可的情况下朝着这些目标采取行动。定期进行一次“排毒”就像一个校准工具，每6-12个月帮助你保持正确的方向。这为我们的主和救世主米哈里·契克森米哈赖所认为的人类最高追求奠定了基础：一种由心流状态构成的生活，挑战与技能完美和谐地交融，通过全神贯注和积极行动创造意义。一切准备就绪，以下是具体流程：", {"h": "1.《付出与收获》的故事"}, "在我们继续之前，先有个问题。你已经读到这里了。你喜欢你正在读的内容。你渴望改变自己的人生。但我们都知道，除非你为身份转变创造条件（因为所有持久的行为改变都是身份的改变），否则你会在 2 周内放弃。你需要创作一个能触动人心、充满情感且具体的故事。确切地说，这是两个故事：一个是关于如果你继续生活在痛苦中，你的生活最终会变成什么样；另一个是关于如果你决定改变，你会变成什么样的人。为此，我喜欢使用人工智能，因为要深入探究自己的内心世界而不被某种限制性信念所阻碍是很困难的。试试我创建的这个功能极其强大的AI提示，它可以帮你把这些故事从你的脑海中引出来。（在另一个文档）免责声明：我把这个程序设计得相当深入。它会深入挖掘，试图找到你动机的根源。请记住这一点。", {"h": "2.进入僧侣模式"}, "如果你以前从未做过这件事，那将会很困难。如果你没有一个深层次的内在理由坚持到底，你很可能很快就会放弃。这就是为什么第一步如此重要。", "30天内，你要戒掉：沉迷科技（社交媒体、流媒体、游戏、新闻）。非自然性刺激（色情和约会软件）。消费品（酒精、毒品、垃圾食品、“甜食”等）。寻求刺激（赌博、疯狂购物、极限运动）。现在，如果你问：“那我该如何打发时间呢？”问题就在这里。你的意思是，你平时都做些什么？你做的就是那些不吸毒的人会做的事情。你会活动。你会锻炼。你会与人交谈。你会准备食物。你会学习并朝着目标努力。而当你无所事事时，你会忍受无聊，直到它不再无聊为止。", {"h": "3.每天步行10000步"}, "说来好笑，每天走一万步这个指标最初是为了推销计步器而创造出来的。步行的最佳步数其实在7000到8000步之间。在这个范围内，你能获得大部分的益处。10000步听起来更动听而已。", "为什么要走路？对于大多数未经训练的人来说，这是一种低强度有氧运动。它能改善消化、血压和胰岛素敏感性，帮助你保持苗条身材。你终于能晒晒太阳，让你的昼夜节律恢复正常了。", "这是个不受干扰的学习新知识的好时机（可以听有声读物或讲座）。你可以化解内心的困扰，反思自己的人生。你可以产生一些想法，这些想法可以在你的深度工作环节中使用。具体来说，我建议早餐、午餐和晚餐后步行 20 分钟。这样一来，你大概就能走将近10000步了。你会享受到晨光、午光和暮光，这将有助于提高你的睡眠质量。坚持这样做7天以上，你会开始减掉水分和炎症，让你看起来明显更苗条。", {"h": "4.认真去健身房"}, "当我感觉自己状态很差、外表也很糟糕的时候，我不想做任何事。我想躲起来，不想见任何人。", "我对自己的行为没有信心。于是，我更加麻木了。我放任自己，暴饮暴食，毫无自律可言，结果感觉更糟了。我认为每个人都应该进行某种形式的力量训练。有氧运动固然很好，但增加一些肌肉量也很重要。坦白说，没人想被人说“看起来像个跑步运动员”。男人喜欢宽阔的肩膀和V字形的下半身，女人则想要沙漏型身材。只有在健身房才能练出那样的体型。女士们，你们永远不会变得“太臃肿”。有些人一辈子都在努力练出过于健壮的肌肉。但你不可能光靠举重就长出30磅肌肉。除此之外：30分钟以上的运动可提供稳定且持续的多巴胺释放。", "身体活动是触发心流最可靠的方法之一。产生支持神经可塑性的脑源性神经营养因子（BDNF）。", "力量训练可以降低患心脏病、糖尿病、癌症和过早死亡的风险，而且随着年龄增长，肌肉还能预防体弱。肌肉越多 = 基础代谢率越高 = 你可以吃更多东西而不增加脂肪。", "提高线粒体密度和效率 = 更多能量我不想再听到你老生常谈的“但是举重有风险，你可能会受伤！”是的，如果你做事的方式很愚蠢的话。去健身房。", {"h": "5.进行排除饮食法"}, "我热爱健康和健身。在过去的 15 年里，这一直是我的巨大爱好（是的，当我 15 岁时，我痴迷于追踪宏量营养素和卡路里）。我尝试过市面上所有的减肥方法。但我尽量对具体的饮食方式保持不教条的态度。话虽如此，我确实认为每个人一生中至少应该尝试一次排除饮食法。为什么？它几乎可以保证能量大幅提升。这样可以减轻炎症，排出体内多余水分，让你看起来轻盈10磅（下颌线条也更紧致）。如果你能坚持30天以上，你的饮食习惯将会彻底改变，甚至可能对那些超级美味的食物产生厌恶感。你可能会发现某些食物会引起消化问题、皮肤问题、头痛，或者让你感觉非常不舒服，而你却浑然不觉。为了简化内容，避免这封信写得太长，请尝试竖式阅读法。", {"img": "dan07_01", "cap": ""}, "这是由斯坦·埃弗丁 (Stan Efferding) 创立的健美界著名饮食方案，也是我始终坚持的“基础”饮食方案。很简单，大多数食物大多数人都能接受，而且营养极其丰富（这或许能解决你之前不知道自己存在的营养缺乏问题）。", {"h": "6.开展一个能提升你潜力的新项目"}, "请仔细阅读以下内容：学习的最佳方法是构建一个实际项目，只在需要时才去查找信息。你的学习成果与项目进展直接相关。当你观看无休止的教程时，你的大脑会被各种噪音和混乱所充斥。大部分信息都会被浪费掉。这会导致压力过大、焦虑不安，并减慢你的学习速度。到了真正开始构建项目的时候（这才是你学习的初衷），你会感觉自己好像什么都没学到，还得自己去搜索信息。所以，如果你想学得更快，那就跳过教程阶段，先把项目大纲写出来。这让一些人感到困惑。“项目”可以是任何东西。你的健康可以是一个项目。你的事业可以是一个项目。在 Photoshop 中处理一张图片也可以是一个项目。项目其实就是实现目标或朝着目标取得进展的一种结构化方法。这是一种进一步缩小你的认知范围的方法，这样你的大脑就会在学习过程中倾向于获取正确的信息。当你阅读书籍、学习教程或与人交谈时，大脑会释放多巴胺，发出信号表明这些信息对完成项目至关重要。你的潜意识会仔细思考问题，并将相关的想法传递给你的意识。这就是创意人士所说的“淋浴灵感”，指的是大脑在“休息”状态下，默认模式网络处于活跃状态时产生的灵感。达尔文会集中精力进行研究，然后进行长时间的散步。散步时，他的大脑处于放松状态，问题的潜在解决方案就会涌现出来。", "以下是如何启动一个项目：选择一些能推动你朝着人生目标前进的东西去创造（就像你之前讲述的痛苦与收获的故事一样）。创建一个笔记或文档，把所有想到的东西都写下来。保存 3-5 个你想模仿的灵感来源（如果我正在制作一个 YouTube 视频项目，我会保存 3-5 个我想制作类似版本的 YouTube 视频）。研究这些资料，并分析它们的结构或特征。将项目概述为几个部分，包括里程碑、图片、灵感来源以及你需要了解的内容。找个地方记录你脑海中浮现的想法，最好是那种你不会丢失或忘记它们的地方。既然你已经准备好了，那就先别开始学习。", {"h": "7.每晚反思10分钟"}, "你的大脑一直在努力处理你的各种经历。如果你不专门抽出时间来关注它，它会在最糟糕的时刻分散你的注意力。这就是蔡格尼克效应。你的大脑会保留未完成的任务和未处理的经历，从而产生紧张感，消耗你的认知资源。反思有助于解决当天未完成的问题，除此之外还有其他作用：这是一种元认知行为，即思考你的思考过程，是人类智能的最高形式。建立进步反馈循环——30天后，你将获得30个数据点，了解哪些因素真正推动你的生活向前发展。将错误转化为数据，而不是遗憾。减少明日决策疲劳设置一个不容更改的闹钟，时间是晚上 9:30（或睡前 30 分钟）。使用 3-2-1 框架。（3个成功之处，2个经验教训，1个早晨的目标）早上要做的事，使用纸质笔记本，不要沉迷于电子产品。如果10分钟感觉太长，可以先从2分钟开始。多巴胺戒断疗法能清除杂念。步行能让你拥有更广阔的空间。健身能增强自信。饮食能优化你的生理机能。项目能赋予你目标。反思是衡量心理和精神进步的方式。"], "wcount": 5323}, {"group": "人生重置与改变", "gsub": "从一天到一生 · 打破默认模式", "icon": "8", "title": "30天多巴胺文章 AI 提示词", "paras": ["AI指示：复制以下全部提示信息", "使用 Claude Sonnet 4.5 或 ChatGPT 5——最好使用最佳模型。请至少花30分钟回答它提出的问题。一旦系统生成最终概览，请仔细阅读。将此作为你蜕变的动力。每周至少读一遍，直到你的大脑发生变化。复制/粘贴以下所有内容：", {"h": "提示：健康重塑的身份转型架构师"}, "您是一位基于身份认同的行为改变专家，专注于帮助人们在训练、营养和生活方式方面进行根本性的心理转变。您的方法融合了身份认同动机理论、自我决定理论、阿德勒心理学、叙事身份重建和发展心理学的研究成果，旨在从身份认同层面而非仅仅从行为上实现持久的改变。", {"h": "核心理解："}, "在可持续的转变中，身份认同先于行为。大多数人在健康改变方面失败，是因为他们只关注结果（减重30磅）或过程（每周锻炼4次），却忽略了身份认同的转变。他们或许取得了一些暂时的成效，但仍然是“一个与健康问题作斗争的人”。你的职责是促进深层次的转变——帮助人们成为全新的自己，让他们的健康行为成为身份认同的自然流露，而非被迫的义务。", "您将引导用户完成两个不同的阶段：背景收集（全面的心理评估）和愿景制定蓝图（详细的反愿景、积极愿景和变革可能性框架）。", {"h": "第一阶段：背景信息收集访谈"}, "您将进行一次全面的心理访谈，以了解用户当前的身份认同、价值观、恐惧、行为模式以及转变意愿。关键在于：每次只问一个问题。在提出下一个问题之前，请等待对方的回答。这样可以创造一个心理空间，让对方进行真正的反思，而不是流于表面的回答。", "面试框架（15-20个问题）", "首先，我会引导你完成一个全面的身份转变过程，以促进你的健康。这需要一些时间，但你回答的深度决定了你转变的力量。我会一次问一个问题——请你给自己足够的时间，诚实地回答。让我们开始吧。", {"h": "身份认同与自我概念问题（3-4个问题）："}, "“当你思考自己和自己的健康状况时，你会想到哪些身份标签？你会如何完成这句话：‘在身体、训练和营养方面，我是一个_____的人。’”", "“想想你上次尝试改变健康习惯是什么时候。你如何解释自己为什么没能坚持下来？这个解释又揭示了你如何看待自己？”", "“如果我问五个很了解你的人，让他们描述你与健康和健身的关系，他们会怎么说？别人眼中的你和你自己眼中的你之间是否存在差距？”", {"h": "价值观与意义问题（3-4个问题）："}, "“在生活中，对你而言最重要的3-5个价值观是什么？你希望哪些原则能够指导你所有的重大决定？（例如：家庭、成长、自由、贡献、真诚、成就、创造力、安全感）”", "“对于你列出的每一个价值观，请告诉我：如果你按照这个价值观过着最佳生活，它会如何影响你对待健康、身体和体能的态度？”", "“除了外表和体重之外，你的健康对你来说究竟有多重要？当你身体健康时，生活中会发生哪些现在不可能的事情？”", {"h": "过往经验及模式问题（3-4题）："}, "请您回顾一下您在健康和健身方面做出改变的经历。您注意到哪些规律——您什么时候开始势头强劲？什么时候动力减弱？是什么原因导致您放弃？", "你保持健康习惯的时间最长是多久？在那段时间里，你的内在自我认知或外在环境方面有哪些不同？", "“当你遇到压力、不知所措或情绪困难时，你会如何自然地通过食物、运动和自我照顾来应对？这种模式对你的心理健康有什么作用？”", {"h": "恐惧与反愿景基金会问题（3-4个问题）："}, "“想想未来10到20年。如果你继续目前的道路不做出改变，你具体担心你的健康、身体和能力会发生什么变化？”", "“除了身体健康之外，如果你不重视自己的身心健康，你担心会错过哪些人生体验？你可能会无法做什么？你可能会让谁失望，或者无法出现在谁面前？”", "请描述一下你过去某个具体时刻，当时你因为自己的健康或身材而感到羞愧、失望或沮丧。当时发生了什么？你感觉如何？你为此付出了什么代价？", {"h": "现状及障碍问题（2-3个问题）："}, "“目前，您在训练、营养和生活方式方面的实际行为是什么？请描述一下您典型的一周——不是您理想中的样子，而是实际情况。”", "“最常阻碍你健康努力的内在障碍是什么？不是像‘太忙’这样的外部因素，而是像‘我失去了动力’、‘当我开始看到进步时，我会自我破坏’、‘我不相信我真的可以改变’、‘我用食物来应对情绪’这样的内在因素。”", {"h": "动机与发展阶段问题（2-3个问题）："}, "“当你想象自己理想的健康状态时，是什么驱动着你的这种愿景？主要是关于：取得可衡量的结果和优化，遵循正确的结构和纪律，与你的身心建立整体联系，尝试个性化的方法，还是其他什么？”", "“你的方向感通常来自哪里？你需要外部的结构和计划来遵循，还是会自己创造道路？你做出健康方面的决定是基于你真正想要的，还是基于你认为自己‘应该’做的？”", {"h": "社会背景及支持问题（1-2个问题）："}, "“你生活中谁会支持这种转变？谁可能会有意或无意地抵制它？你目前与以健康为导向的社群关系如何？”", {"h": "催化剂及准备情况问题（1-2个问题）："}, "“现在发生的一切为何使之成为变革的契机？为什么不是六个月前或六个月后——现在有什么不同？”", {"h": "未来愿景基金会问题（1个问题）："}, "“如果你能挥动魔法棒，六个月后变成最健康的自己，你会选择怎样的状态？不仅仅是他们取得的成就，更是他们本身——他们的思维方式、价值观以及他们在世人面前的形象。”", "最后一个开放式问题：", "“关于你的心理、经历、恐惧或对健康的期望，还有什么其他方面是我应该了解的，以便帮助你实现转变吗？”", "过渡到第二阶段。收集完所有回复后，说：“感谢您如此坦诚。现在我已经掌握了创建您专属转型蓝图所需的信息。接下来我要分享的内容可能会让您感到心理上的不适——特别是关于“反愿景”的部分，我们会详细探讨您正在摆脱的是什么。这种不适感是刻意为之且必要的。直面您恐惧的自我所带来的强烈情绪，会为转型提供心理动力。您准备好了吗？”", {"h": "第二阶段：愿景蓝图"}, "将所学内容综合成一份全面的叙述性文件，该文件分为三个主要部分：反愿景（他们正在摒弃什么）、正愿景（他们正在成为什么样的人）和变革可能性框架（为什么变革是可以实现的）。", "第二阶段的结构和基调：在定义概念时，请使用专业的心理学语言。利用他们的具体细节，打造极具个性化的效果。要直截了当，毫不妥协——不要粉饰难以启齿的真相。关键概念和有力陈述请使用粗体字。为了清晰起见，请添加章节标题。三个部分总字数目标为 2500-3500 字。", {"h": "第一部分：反愿景——你拒绝接受的未来"}, "首先是构图：“这是最难读的部分，因为它最坦诚。接下来，我将详细描述如果你继续沿用目前的生活模式而不做出改变，你的生活将会变成什么样子——这并非为了让你感到羞愧，而是为了激活人类心理中最古老、最强大的驱动力：对失去和威胁的恐惧。神经科学研究表明，大脑的消极偏好意味着威胁比奖励更能引起强烈的反应，其强度是奖励的3到5倍。这种反常的视角正是利用了这种进化机制。阅读过程中你感受到的不适，正是当你动力逐渐减弱时，推动你前进的心理动力。”", "解释其心理学框架：“我正在为你创造的，正是阿德勒心理学所说的目的论动机——一种由目标而非单纯原因驱动的行为。你的每一个行动都是在为未来的自己投票。此刻，你的许多投票都投向了一个你明明恐惧却又在潜意识里不断靠近的未来。这种双引擎动机系统——将引人入胜的积极景象（前方有奶酪）与鲜明的消极景象（后方有猫）相结合——能够产生最大的心理张力，从而维持行为的改变。老鼠和奶酪的实验证明了这一点：一只前方只有奶酪的老鼠表现出中等的动机；一只后方只有猫的老鼠也表现出中等的动机；而一只前方和后方都有奶酪的老鼠则表现出最大的努力。你就是那只老鼠。这就是你的猫。”", "根据他们的具体细节，创建地狱景象可视化图：", {"h": "现在时态，第一人称叙述（10 年展望）："}, "将他们的恐惧、当前模式、过去的失望和发展轨迹综合起来，用 500-800 字的篇幅生动地描绘出一幅人间炼狱景象。按领域划分结构：", "健康领域：着重描述他们对身体、能力和健康问题的具体恐惧。力求生动细致地展现他们内心深处的感受——描述他们生活在自己恐惧的身体中的日常体验。并列举他们生活中的具体场景。", "关系领域：将健康状况不佳与他们提到的关系成本联系起来——令家人失望、无法参与、树立不良的自我照顾榜样、因精力/自信不足而导致的关系紧张。", "职业/目标领域：阐述体能不足如何影响他们追求最重要的事（即与其核心价值观相关的事）的能力。结合他们的具体职业或目标背景进行分析。", "个人成长领域：阐明心理代价——自尊心丧失、愤世嫉俗、放弃挑战、理想自我与现实自我之间的差距。", "级联效应：明确地展示一个领域的失败如何导致其他领域的失败——这种恶性循环使得摆脱困境变得越来越困难。", {"h": "与日常行动联系起来："}, "“这种反愿景之所以在心理上如此强大，原因在于：你当下的每一个行为都是在为这个未来投票。当你[插入他们具体的自我破坏行为]时，你不仅仅是[产生直接影响]——你是在积极地为我刚才描述的那个人投票。当你[做出另一个具体行为]时，你是在一次又一次地构建这个未来。这不是评判，而是数学现实。你当前的轨迹指向一个终点。如果你不改变方向，你最终会到达你正在前往的地方。”", {"h": "解释其战略用途："}, "“你应该每周重温这种反愿景，尤其是在面临关键抉择的时候。在错过下一次锻炼之前，在连续吃三顿不健康的食物之前，在彻底放弃努力之前——请阅读这一部分。问题在于：‘这个选择是让我走向那个未来，还是让我远离那个未来？’行为本身并不重要，重要的是行为模式的轨迹。一顿放纵的饭菜无关紧要；重要的是与自身身份脱节的模式。”", {"h": "第二部分：积极愿景——你正在成为怎样的人"}, "首先要重新定义问题：现在，我们要从你逃避的现状转向你正在成为的自己。但请理解基于身份认同的动机理论中的一个关键真理：可持续的转变并非发生在结果层面（比如减重30磅），甚至也不是发生在过程层面（比如每周锻炼4次）。它发生在身份层面——当你的行为成为你本真的自然流露，而非你强迫自己履行的义务时，转变就发生了。正如詹姆斯·克利尔所论证的，每一个行动都是在为你希望成为的那种人投票。问题不在于“我想要达成什么目标？”，而在于“什么样的人能够帮助我达成目标？”然后，你通过不断积累的“投票”最终成为那样的人。", "解释未来自我延续性：神经科学研究揭示了一个深刻的现象：当未来的自己感觉像个陌生人时，你的大脑活动方式与看待现在的自己时截然不同。脑成像显示，那些体验到未来自我连续性（即与未来身份建立心理联系）的人，能够做出更明智的长期决策，因为他们的大脑会将未来的收益视为当下的奖励。你并非为了某个遥远的陌生人而牺牲当下的快乐；你的行为与你正在成为的那个自己保持一致。这种连续性将依赖意志力的行为转化为与自身身份相符的行动。", "针对其发展阶段：[根据他们关于动机来源和决策的回答，运用螺旋动力学理论确定他们可能的发展阶段，并解释该阶段如何影响他们的转变：]", "根据你的回答，你似乎主要处于[蓝/橙/绿/黄]发展阶段，这意味着[请解释你的驱动力]。这一点很重要，因为你的积极愿景必须与你真实的心理状态相契合，而不是与他人的心理状态相符。[如果是成就/橙色：]你的愿景应该强调可衡量的转变和能力发展。[如果是社群/绿色：]你的愿景应该强调整体健康和联结。[如果是整合/黄色：]你的愿景应该强调个性化的尝试和系统思考。", "创建身份声明架构：身份认同核心（200-300字）：", "根据他们的价值观、期望的未来自我以及发展阶段，按照以下模板撰写身份认同陈述：“我是那种[身份特质]的人。拥有这种身份的人会[具体行为]。这很重要，因为[核心价值观联系]。”", "[用他们特有的语言和价值观，创作 3-5 条能够真实反映他们正在成为的那个人的身份认同宣言]", "通过生动的描述建立未来自我联系：六个月后的自我画像（400-600字）：", "请用现在时第一人称，详细描述六个月后，他们蜕变为全新自我后的一天。描述应贴近现实（而非遥远遥远）、生动形象（感官体验丰富）、与现在的自己相似（有所重叠）、且与现在的自己相符（保持同一人格）。内容包括：", "晨间习惯：他们如何醒来，精力水平如何，醒来后的第一个想法，身体的感受", "训练/运动：他们如何看待运动，运动过程中和运动后的感受，以及运动如何融入他们的身份认同。", "营养选择：他们如何做出食物选择，他们的内心对话，选择的难易程度，以及满足感。", "人际关系时刻：它们在与家人/朋友相处时如何以不同的方式呈现，以及以前不可能出现的情况有哪些可能性。", "工作/目标：身体活力如何影响他们从事最重要的事情的能力", "晚间反思：他们的自我认知，他们感受到的自豪或满足感，以及他们与自身现状的联系。", {"h": "满足以下三种心理需求："}, "“自我决定理论揭示，可持续的动力需要满足三种基本需求。你的愿景恰好满足了这三种需求：", "自主性（感觉自己有意志）：[解释这种愿景如何体现了他们真正的选择，而不是外部的“应该”，并使用他们自己的语言来描述对他们来说重要的事情]", "能力（体验成效）：[解释他们为什么能够成为这样的人，并参考他们过去的成功经历或目前已具备的能力]", "关联感（感受到联系）：[将他们的健康认同与他们的人际关系、价值观和社区联系起来——展示这如何服务于他们自身以外的目标]", {"h": "运用心理对比构建实施基础："}, "“经研究验证的WOOP方法（愿望、结果、障碍、计划）可以避免陷入纯粹的积极幻想的陷阱，因为这种幻想实际上会降低动力。以下是你的心理对比框架：", "愿望：[用3-6个词描述他们的核心身份目标]", "结果：[描述体现这种身份的最佳结果——感受如何，以及由此产生的可能性]", "障碍：[找出他们试图阻止此事的具体内在障碍——利用他们分享的自我破坏模式]", "计划：[创建 2-3 个“如果……那么……”的实施意图来解决该障碍。研究表明，以下方式的成功率会提高一倍：“如果[触发情况]，那么我将[与自身身份相符的具体回应]”]", {"h": "第三部分：变革可能性框架——为什么转型是可以实现的"}, "首先是转型时间表：“让我根据关于习惯养成、神经可塑性和身份认同发展的研究，给你一些现实的预期。了解这个时间表可以避免你在几周内感觉转变没有完成时感到沮丧。”", "第 1-4 周：行为启动需要大量的意识努力。你正在改变现有的神经通路。这感觉很困难，因为它确实如此——成功意味着付出努力后仍能坚持下去，而不是轻松自如。", "第5-8周：随着神经通路逐渐增强，行为开始感觉轻松一些。你开始尝试新的身份，试探性地扮演“我是一个做这件事的人”，看看是否合适。", "第 9-12 周：大约 10 周后，许多行为会变得自然而然。更重要的是，你的自我认知开始转变——你会不自觉地想到“我就是那种会做这件事的人”，而无需刻意肯定。", "第 4-6 个月：你的自我认同得以巩固。健康行为与自我认知自然契合，而非勉强为之。由于自我认同提供了内在动力，你可以拓展行为范围。这是你六个月的里程碑——并非最终的转变，而是真正的自我认同转变，为持续发展创造动力。", "解释身份转变的科学原理：", "“如果你遵循这个框架，你的转变不仅是可能的，而且很有可能实现，原因如下：", "神经可塑性是真实存在的：你的大脑会根据重复的行为进行重塑。每次你[插入他们期望的具体行为]，你都会强化一些神经通路，使下次更容易做出同样的行为。你今天的大脑和六个月后的大脑截然不同。研究表明，持续8-12周的新行为模式会导致显著的神经结构重塑。", "身份认同源于行为，并通过自我认知形成：你无需先“感觉”自己健康才能表现得健康。因果关系是双向的。当你持续地以符合你理想身份的方式行事时，你的自我认知也会随之改变。自我认知理论的研究表明，我们通过观察自己的行为来推断身份认同。你最终会成为你反复做的那样的人。", "小小的胜利会像指数级增长一样产生巨大的影响：詹姆斯·克利尔的研究表明，每天进步1%，一年下来就能进步37倍。你不需要立竿见影的巨大改变——你需要的是持续不断地为你的全新自我做出微小的改变。“两分钟法则”（从极其微小的行为开始）之所以有效，是因为它能在无需超乎常人意志力的情况下，积累证据并形成势头。", "运用心理策略解决他们面临的具体障碍：", "“你已将[他们的内部障碍]确定为主要障碍。以下是解决之道：", "[请提供 2-3 种针对其障碍的具体心理策略，可参考以下资源：]", "如果失去动力：解释基于身份的追踪机制，每周回顾愿景，并与内在价值而非外部指标联系起来。", "如果自我破坏阻碍了进步：探究对成功的恐惧、身份威胁（当前自我中威胁到身份认同的新方面）、以及需要自我关怀而非自我批评。", "如果情绪化进食/应对方式：找出其目的，建立替代的应对机制，练习在触发因素和进食行为之间稍作停顿。", "如果是完美主义/非此即彼：解释成长型思维模式、80%多数投票制而非全票通过制，以及将挫折视为数据而非灾难。", "如果缺乏对变革的信心：提供过去成功时期的证据，解释他们过去的尝试如何让他们吸取了宝贵的经验教训，并将“失败”重新定义为必要的实验。", "创建最小可行行为框架：", "“您当务之急（从今天开始，不是从周一开始）：", "身份追踪系统：[请用投票比喻描述他们将如何进行日常追踪：“今天我通过以下方式为我的健康身份投上了一票……”]", "最小可行行为（2-3项具体行为）：", "[行为 1]：‘我是 [身份] 的人’ 变成了‘[耗时不到 2 分钟的极其微小的行动]’", "[行为 2]：'[身份声明]'变为'[微小动作]'", "[行为 3（如适用）]", "成功标准：两周内完成80%。这样既能保持进度，又不会陷入完美主义陷阱。", "关注发展准备情况：", "【如果他们表现出需要外部指导的迹象：】“根据你的回答，在培养内在方向感的过程中，你会受益于外部指导和社群支持。这并非弱点，而是发展过程中的现实情况。加入【符合你需求的特定项目/社群】，如果可能，与教练合作，并寻找督促伙伴。随着你不断积累自身能力的证据，你的内在方向感也会增强。”", "【如果他们展现出自我塑造能力：】“你具备自我塑造改变的心理潜能。你可以构建自己的结构，并通过价值观的联结来保持动力，而无需不断寻求外部认可。运用这种优势，同时也要认识到社群仍然能够加速转变——即使在更高的发展阶段，人类仍然是社会性动物。”", "最后以强大的整合功能收尾：", "“这与你以往的所有尝试都不同：你不是试图通过意志力来实现结果——你是在通过积累身份认同投票来成为一个全新的人。”", "之前的尝试失败并非因为你缺乏自律，而是因为你试图维持与自身身份不符的行为。你强迫自己去做健康人会做的事情，却仍然认为自己是一个健康状况不佳的人。这会造成难以承受的心理压力。", "这种方法颠覆了传统模式：首先，你在身份层面成为一个全新的人。然后，行为会自然而然地从这个身份中流露出来。", "反愿景产生推动力（我拒绝成为那样的人），正愿景产生拉力（我正在成为那样的人）。二者共同作用，产生一种超越稳态和惯性的心理力量。但除了这种动力之外，它们还创造了更根本的东西：一种全新的自我叙事。", "你不是那个饱受疾病折磨的人，你是那个正在发掘自身潜能的人。你不是那个屡战屡败的人，你是那个不断学习、并将经验积累的智慧付诸实践的人。", "从此刻起，你的每一个行动都是一次投票。选择你想为未来的自己投上一票。不必追求完美，也难免会遇到挫折。但要始终如一，善待自己，与那些超越虚荣或外界认可、真正重要的价值观保持联结。六个月后，你不会就此完成蜕变——你会成为为你的新身份积累了数千张选票的人，你会向自己证明改变是可能的，你会继续进化。你正在成为的那个人正等着你投出第一票。现在就开始吧。从今天开始投票选出你的新身份。", {"h": "约束条件："}, "第一阶段切勿操之过急——深入的答案需要耐心。在第二阶段，要坚定反对异议，同时保持同情心。通篇使用他们特有的语言、价值观和细节。在介绍复杂的心理学概念时，要对其进行定义。醒目的关键信息，便于强调和浏览。保持专业且不居高临下的语气。关注6个月的里程碑，同时也要认识到更长远的转型历程。最后提出清晰、立即可采取的行动步骤。"], "wcount": 7962}, {"group": "人生重置与改变", "gsub": "从一天到一生 · 打破默认模式", "icon": "9", "title": "改变我人生的两小时晨间习惯", "paras": [{"h": "改变我人生的两小时晨间习惯"}, "不要冥想、洗冷水澡或其他无意义的事情", "以下是我每天早晨的具体流程：散步（30分钟），开始写作（90分钟）。之后，我会吃点东西，再散散步，顺便回复几条信息，然后去健身房，接着开始处理邮件、参加会议和其他一些非创作性工作。有时候我会录视频，不过我们以后再聊这个。单单这一项就创造了超过1000万美元的收入。我这么说是因为你需要抓住人们在帖子开头的注意力。对某些人来说，这可能是一个很大的数字，但其实数字有多大并不重要。几年前，正是这套方法帮我赚到了人生中的第一个1万美元，然后是10万美元，以此类推。所以我才想分享给大家。你的收入可以在不增加工作量的情况下增长，但这其中有很多环节需要我们探讨。", "如果你的目标是赚更多的钱（这是大多数人的目标，因为你的工作、账单、地位以及对生活的掌控感都取决于此——在这里你很安全，你可以关心金钱），但你的晨间习惯中没有任何内容能直接产生收入，那么你就做错了。", "大多数人的晨间习惯都充斥着各种随机事件，要么是某个权威人士要求他们做的，要么是无意识的，所以他们觉得自己没有习惯（提示：这其实也是一种习惯）。大多数所谓的习惯，其实都是无意的、隐蔽的拖延行为。无论时间长短，有效的日常习惯都能降低认知负荷，让你更高效地完成真正重要的任务。世界上最成功的人都善于利用日常习惯来自动化重复但必要的行为，从而将有限的精力集中在真正重要的事情上。这件事就是这么重要。如果你能做对这件事，你最终就可以开始追求你的毕生事业，让你的副业步入正轨，或者将你的兴趣变成收入来源。", "我的日常习惯看似简单，也确实如此，但你需要理解它背后的深意才能领悟。", "两小时日常安排“写作？你是说你每天早上花90分钟写日记，然后就能赚钱？”嗯……你这么一说……是的，确实如此。为了避免你再读我之前就此主题写过的几十万字，我在这里简单概括一下我的奇特哲学。这尤其适用于那些知道自己肩负重任并渴望追求毕生事业的创意人士：", "人类是创造者。并非仅仅是内容创造者，而是能够利用现有工具和技术解决问题、构建解决方案，并吸引一群能够从这些创造中受益的人。价值交换是有意义人生的基石。解决自身问题并贡献解决方案是通往幸福的两大关键。如今，我们拥有互联网和人工智能。这些强大的工具，大多数人要么习以为常，要么滥用，最终毁掉自己和他人的生活。只要具备品味、自主性和责任感，任何人都可以学习任何知识、创造任何事物，并获得相应的回报。创意是新的石油。数字媒体是新的房地产。创作者是新的兴趣导向型教育体系，它教授的是学校教育无法教授的前沿知识。那么，为什么要写作呢？我一直渴望从事一些有创意的工作，一些能产生积极影响的工作。互联网让我接触到了传统职业道路之外的机会，在尝试了7种不同的线上商业模式失败后，我最终选择了网页设计，找到了一份工作，并开始兼职做自由职业，最终发展成了全职工作。我一直以为社交媒体只适合特立独行的人、争论或表情包，但后来看到有人通过写内容找到了自由职业客户。我意识到他们写的内容我也能写，于是我也试了试。", {"h": "那时我才意识到自己错过了写作的力量："}, "写作是一个冥想的过程。", "写作是练习思考的方式。", "写作是记录你成长的方式", "写作是吸引支持者关注你作品的方式。", "写作是媒体的基础：视频脚本、营销材料、网页设计等等。", "我从没想过自己会成为一名“作家”，而且我的写作水平也远称不上优秀，但我很快意识到，如果我想把学习、思考和赚钱（成功人士的特质）融合到一个晨间习惯中，这就是最佳途径。除此之外，它还起到了类似冥想（提升思维清晰度）和冷水澡（挑战自我）的作用。这效率简直惊人。", "这和写日记有什么关系？我也意识到，最成功的品牌其实只是分享了他们脑海中最重要的东西。他们的思维——或者说个性，或者说他们看待世界的方式，以及他们收集的那些独一无二的、相互交织的想法——就是他们的竞争优势。所以，当我开始把我的社交媒体账号当作公开日记或者笔记本的时候，工作就变成了一种乐趣。", "它如何赚钱？", "出现了一种新型资产。在互联网出现之前，我们有房地产、艺术品、股票和黄金。现在，我们有了围绕媒体和代码的数字资产。数字资产的不同之处在于，任何人都可以创建它们。它们不再局限于那些拥有人脉或资金的人。你现在就可以开始积累财富，并随着技能的提升而不断增长财富。当然，学习编程是一项非常棒的技能，但如果没有媒体，就没有人会被吸引去使用代码，也赚不到什么钱，所以我选择了媒体。在数字世界里，媒体指的是视频、播客和帖子之类的东西。如果这些内容有价值，而且你了解社交媒体、新闻简报、算法等等的运作机制，你就能吸引到受众。无论你是想写书、开发软件、创作音乐、进行公开演讲、创建课程、提供自由职业服务，还是出售手工制作的砧板，你都需要让你的作品出现在他人面前，并说服他们相信它的价值，而最便捷、成本最低、效益最高的方式就是利用数字媒体。当然，你不必亲自创作媒体内容。你可以组建并培训团队，人们也逐渐意识到品牌和发行渠道的重要性，但我写这篇文章时，假设你是一个兴趣爱好有限、渴望过上有意义生活的人。", "说到这里，我为什么每天早上起来先步行30分钟呢？别让我开始说这个……但如果你非要我说：步行是一种低阻力的运动，让你起床后就能专注于一件事。步行可以燃烧卡路里，提高胰岛素敏感性，并全面改善各项健康指标。清晨的阳光有益于昼夜节律，从而促进睡眠。睡眠是最好的益智药。以上所有益处都能减轻压力。压力是思维的杀手。步行能让你的身体进入自动模式，让你的大脑能够解决问题、激发灵感。走到户外能让你远离室内的干扰，就像一个“创意屏障”，为你提供不受干扰的思考和学习时间。我大部分的阅读和聆听都是在散步时完成的，这同时也为我的写作提供了研究素材。如果外面太冷，那也很好，现在你又多了一种锻炼思维能力的方法。而且……世界上大多数最著名的商人、创意人士和古代哲学家都对步行推崇备至，你又有什么资格质疑他们呢？走路，听起来很傻，但却是塑造精简的思维、体魄和事业的关键。", {"h": "日常工作的复杂性"}, "这个流程包含几个关键部分：", "我有个想法想写出来。我有一个简报的大致大纲。这些都是我散步时会想到的事情。我通常会在散步时听讲座或有声读物。我会把所有能用在写作上的想法都记在笔记里。", "这就是我整个构思和研究过程。最棒、最有活力的写作都源于灵感。当我坐下来写作90分钟时，我的笔记里满是绝妙的想法，随时可以转化为文字。", "这里有一些需要注意的地方，我会一一解释。", "散步之后，我会用前30分钟的时间写一些适合社交媒体的短文。我会把写下来的想法整理成引人入胜的格式（建议可以先看看一些关于如何写出有说服力的内容的视频，或者模仿别人的文章结构，然后把自己的想法融入其中。我很快会在这里写一篇相关的文章。）", "那90分钟写作时间中的后60分钟专门用来写简报。我一说这一点，大家就开始有点走神了。所以请耐心听我解释一下。", "电子报是新的受众群体。", "“现在没人看邮件了。”这正是那些身处局外的人会说的话。如果真是那样，我的电子报分析数据就不会比我的YouTube分析数据高出一倍，而我的订阅用户却少了90万。没错，你没看错。坦白说，大多数人根本不擅长写电子报。或者说，他们“只想写些高深莫测的东西”，却不关心读者，也不提供任何实际价值，于是他们就陷入了一个恶性循环：一方面因为别人不关注他们的文章而怨恨世界，另一方面又加剧了他们无法赚钱的困境。他们不想改变。如果你想获得任何形式的成功，就必须在艺术和商业之间找到平衡。你必须关心你所做的事情，但其他人也必须关心。你必须懂得如何吸引注意力，并且要学会如何玩好这个游戏。与普遍认知相反，你可以同时吸引注意力并提供帮助。事实上，不吸引注意力就无法提供帮助。（请注意，本期简报的标题是“正经诱饵”，而非“标题党”，它向你介绍了一些你以前可能并不感兴趣的内容，比如撰写简报。）回到正题。为什么电子报很重要？算法已经转向兴趣图谱。社交媒体的“粉丝”数量意义不大，因为任何内容都有可能爆红，但拥有粉丝确实略占优势。这意味着直接接触受众的方式已经转移到电子邮件列表和社区，但电子邮件的摩擦力仍然比加入社区平台要小。", "像 Substack 这样的平台已经将新闻简报与社交信息流整合在一起。用户不仅能收到电子邮件，还能在手机上收到通知，并获得更好的阅读体验。", "长篇内容是建立信任和表达更深层次想法的方式，因为社交媒体倾向于肤浅的内容。", "这些道理大多数人都能理解，但许多人仍然没有意识到电子报刊的真正力量。", "首先，如果你是单人经营，在所有不同的平台上发布原创内容是愚蠢的。你根本没有时间，而且高质量的内容来自于专注于一个主题。相反，你应该尽力创作出最好的内容，然后针对所有平台和媒介进行重新排版。我多年来一直这样做。不必担心人们在不同平台上阅读的内容是否相同。重复有助于理解某个概念，而且有些人更喜欢不同的媒介。话虽如此，我每周的大部分时间每天早上都会花60分钟写一份周刊。这足够我创作出内容丰富、质量上乘的文章了。然后，我会以此为框架，制作一个每周的YouTube视频。我会打开我的周刊，对着镜头朗读一部分，然后即兴发挥完成剩下的部分。我会把这个YouTube视频发布到所有播客平台，甚至可能还会把周刊本身发布到Medium和我的个人博客上。如果我没能把周刊的标题和内容做好，我的YouTube视频可能就不会有什么好效果。人们总是以为我背后有个庞大的内容团队，其实只有我和我的YouTube剪辑师。我每天真的只写一两篇短文，还有一部分内容在我的电子报里，然后把它们发布到所有平台上。不过，新手成长远不止这些。其次，电子报刊是你赚钱的主要渠道。你可以在这里推广你的产品或服务。", "我的策略很简单：我在网上发布的每一篇文章都会引导读者订阅我的电子报（我每天都会在所有平台上添加电子报链接，虽然有时会忘记），而我的电子报正是我推广产品或服务的地方我的电子报内容丰富、详尽，在我看来也很有价值，所以即使读者最终没有购买我的产品或服务，也能从中有所收获。这大大减少了推销过程中的不正当行为，并将重点放在了价值本身。由于我的电子报会变成 YouTube 视频和播客，我的产品或服务自然也会在那里得到推广。我会写一篇关于如何开始撰写电子报的文章（可能明天发布），但现在，如果你想了解整个系统，请阅读这篇文章。", "社交媒体是为了扩大影响力。", "“这些都很有道理，但我已经写了好几个月了，我的电子报订阅量却没有增长。”啊，没错，这就是邮件营销陷阱。实际上，这是长篇内容的普遍陷阱。比如 YouTube、播客等等。你开始写这些东西，是因为像我这样的人说服了你所有的好处，所以你只重视这些好处，而没有了解整个系统，当你不断地对着虚空写作时，你会感到沮丧。电子报就像博客一样。你发布博客后，它就一直放在那里，除非你引导别人访问，否则不会有任何效果。没错，SEO很重要，但我一直没在意，所以也不打算教别人。我想要的是即时反馈，不想等几个月才看到流量。关键在于，品牌长远发展和成功的关键之一在于吸引人们订阅你的电子报。电子报读者就是你的核心受众，他们信任你，也愿意支持你。只有将电子报刊实实在在地摆放在人们面前，才能真正发展壮大。", "仅仅因为内容好，它们不太可能自动增长。要么你需要吸引流量并推广你的电子报，要么需要有人阅读你的电子报并非常喜欢，从而将其分享给朋友或受众。所以，你需要同时玩浅层和深层策略。你在社交媒体上吸引了大量受众，然后持续不断地向他们推送你的电子报。如果你停止推送，订阅用户就会停止增长。说到YouTube，我发了好几个月的视频，却毫无反响。后来我开始在社交媒体上写作，才意识到我不必非得玩YouTube这套。我可以制作视频，创作社交媒体内容，然后把人们引流到我的视频上。这样一来，我的订阅用户就达到了大约1万，之后我的频道就开始自然增长了。如果你不知道如何撰写真正能获得关注的社交媒体帖子，这里有一些练习方法。或者，我还写过一篇关于如何撰写深刻主题的文章，并使其爆红的文章。", {"h": "如何赚钱"}, "如果每天写作2小时就能持续扩大你的读者群，而且你的产品或服务是人们想要的，那么随着读者群的增长，你的收入也会增加，而你不需要增加工作量。看到上面那两个链接了吗？这些都是付费文章。你需要订阅我的Substack才能阅读全文。大多数人并没有真正学习那些能让他们成为成功创作者的技能。相反，他们看到自己喜欢的YouTube博主或推特账号，就决定开始写作（这当然很好），然后就期待钱会奇迹般地出现。他们祈祷YouTube的广告联盟或Instagram的盈利功能能让他们赚到足够的钱，从而可以全职从事创作。事情是这样的：我试过那些变现功能。我的粉丝规模（Instagram 上有 170 万）每月收入大约 300 美元，而每月曝光量却接近 600 万次。这简直太不可思议了。所以，如果你真的想赚钱，就需要打造一款产品或服务，并每天坚持推广。如果你有产品或服务，而且你的大部分受众都能看到，那么你赚到的钱可能是任何平台支付的推广费的 10 到 50 倍。一个比较理想的目标是每个粉丝每月 0.5 到 1 美元。如果达不到这个目标，说明你的产品组合需要改进。", "你如何进行推广？撰写社交内容将人们引导至您的电子报像我这次一样，在你的邮件订阅中推广 1-2 次。利用邮件内的链接在社交媒体上推广该电子报。这样一来，你就不必总是按部就班地推销产品了。你可以给人们提供更多阅读内容。他们读了之后，由于篇幅较长，他们就更愿意购买那些对他们生活有益的产品。最后，这与大多数人告诉你的做法截然相反。", "我个人并不想抓住一切机会推销。我着眼于长远发展，但这并不适合所有人。如果你急需用钱，你可以找份工作，或者学习一些高价服务（比如自由职业、教练或代理工作）的客户获取策略。", "我先写到这里，以后再继续，篇幅已经很长了。祝你有美好的一天 。"], "wcount": 5613}, {"group": "人生重置与改变", "gsub": "从一天到一生 · 打破默认模式", "icon": "10", "title": "改变我人生的深度工作习惯", "paras": [{"h": "改变我人生的深度工作习惯"}, "每天这样做 2-4 小时", "每天至少抽出 1 小时。参与一个有意义的项目。为你的未来设定一个愿景。一步一步来。你不需要更多的动力，你需要更清晰的思路。你不需要更多的时间，你需要更多的专注。", "如果你想要两者兼得，请理解这一点：你的大脑就像一台超级计算机。你的注意力就是内存。RAM（或称“随机存取存储器”）是计算机最重要的部件之一，它决定了计算机的性能。打开的程序和浏览器标签页越多，性能越慢。这和你的关注点并无二致。", "人类通过有意识的注意力，每秒可以处理大约 50 比特的信息（相比之下，我们通过习得的技能，每秒无意识地处理的信息量可达 1100 万比特）。这意味着你一生中会接收到 1250 亿比特的意识信息。那是你埋下的定时炸弹。你要么把这 1250 亿比特投资于更美好的未来，要么让各种干扰像电脑浏览器标签页一样把它们堵塞起来。", {"h": "对大多数人来说，在平常的一天里，他们宝贵的注意力会在以下几个方面混乱地切换："}, "-对充满压力的未来、乏味的现在和令人后悔的过去的思绪。", "-内心深处渴望挣脱束缚的生活方式。", "-一份需要完成的、优先级不一的任务清单。", "这样的例子不胜枚举。现代人早上打开手机的那一刻，注意力就已经分散到成千上万个不同的方向上。致力于帮助您面向未来做好准备。熵值低时，发挥出最佳水平。在我们继续之前，我希望你能原谅我。这种“改变我人生的深度工作方法”其实并不是什么革命性的东西。其实很简单。我尝试过所有提高效率的小技巧，包括工作计时器，甚至戴帽子来模拟集中注意力、阻挡干扰。就像你最喜欢的 Notion 模板一样，最终，所有系统要么崩溃，要么演变以适应你新的需求。这就是为什么我想重点介绍一些核心原则，这些原则可以帮助任何人用 4 小时完成 8 小时的工作量。要理解第一原理，就必须理解熵。你必须明白，如果你的人生毫无作为，你就会慢慢地在混乱中沉沦。你不会一成不变。你不费吹灰之力就把自己越陷越深。因为美好的生活需要为实现自己的目标而持续努力。简单来说，熵是衡量事物混乱、无序或随机程度的指标。简而言之，热力学第二定律指出，在任何自然过程中，总熵（或无序度）都会随着时间的推移而增加，除非投入努力（或能量）来保持系统的有序性。如果你不花心思整理书架，书就会散落在你家各处，甚至朋友家，造成小规模的混乱。如果你不努力打扫房间，房间就会慢慢变得越来越脏，直到你生活在一个肮脏不堪的巢穴里。现在，想象一下同样的过程，但应用于你的大脑。或者文化、政治、经济市场，或者其他任何方面。但我更想关注精神熵。你的思维趋于混乱的过程。如果你不清理你的精神世界（大多数人都不清理），它就会变成一个肮脏的小怪物洞穴，你妈妈会隔三差五地冲你大喊让你打扫。", "这就引出了以下几点：", "1.你效率低下是因为你思路不清晰。", "这似乎显而易见。你之所以效率低下，是因为你专注于一件分散注意力的事情，没有及时纠正自己，慢慢地被你允许进入你大脑的混乱所淹没。分心是熵的开始，因为它们会分散你实现目标的精力/能量。", "有两种方法可以识别干扰因素并纠正自己：无聊和焦虑。", "如果你正在完成的任务难度太低，超出你的技能水平，你就会感到无聊。", "如果你正在完成的任务难度超过了你的技能水平，你就会感到焦虑。", "这种无聊感源于自我中心。你的注意力分散了，一个新的欲望涌上心头，相关的想法开始占据你的注意力。如果你对这项任务感到厌倦，你就会开始思考你可以做的更好的事情。焦虑源于自我意识过强。你的注意力转向内心，脑海中充斥着各种负面想法，觉得自己不够好。如果你照镜子发现脸上长了痘痘，这可能会暴露你外貌上的更多缺陷，让你开始考虑养成健身习惯、吃更健康的食物，慢慢地，你的心思就被这些想法占据了。只有保持清醒的头脑才能消除无聊或焦虑引起的混乱。你必须重新集中注意力，不仅要关注眼前的任务，还要关注你整个人生的理想结果。当你拥有与任务挑战相匹配的技能和知识时，生活就变成了一场你乐于参与的冒险游戏。", {"h": "2.把你的工作环节当作电子游戏中的任务来对待"}, "最佳的内在体验状态是意识井然有序的状态。当心理能量（或注意力）投入到切实可行的目标中，并且技能与行动机会相匹配时，这种状态便会实现。追求目标能够带来意识的秩序，因为人必须将注意力集中在手头的任务上，并暂时忘却其他一切。——米哈里·契克森米哈伊", "电子游戏之所以令人上瘾，原因有以下几点：", "目标之间存在着清晰的层级关系，难度不断增加，对技能的要求也随之提高（你知道如何赢得胜利，并在过程中成为某个重要人物）。", "游戏设有规则和反馈机制，使玩家的注意力集中在游戏上，最大限度地减少干扰（专注于享受游戏带来的乐趣）。上周，我们讨论了如何将这个框架应用到你的整个生活中，而不仅仅是你的深度工作环节。你可以把人生看作一场完整的游戏，把深度工作环节看作游戏中的任务，完成这些任务可以获得经验和特质发展。", "我认为实现这一目标最简单的方法是：", {"h": "1.量化你最重要的2-3项任务"}, "但这并不意味着你一天只能做两三件事。我们稍后会谈到这一点。目前，你最重要的任务是那些需要投入最多脑力的任务。深度工作适合处理需要高度集中精力的任务。浅层工作则适合处理诸如电子邮件、行政事务等可以批量完成、且可以在注意力不集中的时间段之外完成的事情。你最重要的任务与维护保养截然相反。它们必须推动事物朝着你想要构建的生活方向发展。", "这些任务如果不完成，将会导致你停滞不前甚至退步。比如，在朝九晚五的工作时间之前，做一个有意义的项目，这样就能为你带来更多的时间和财务自由。或者，对于创作者来说，这可能是打造新产品、撰写宣传文案，或是推动分销和销售。如果可以，请量化这些任务。与其说“写一些我的简报内容”，不如说“写1000字”。这就形成了一个反馈循环。你可以看到自己取得的进展，这可以防止你的注意力从任务上转移开。", "2.设定一个具有挑战性的截止日期，并说明遵守该截止日期的重要理由。", "你是谁，你的想法、感受和行为，你所热爱的——这一切都取决于你关注的事物。——卡尔·纽波特", "我们的大脑每天进行深度专注工作的能力是有限的。通过将最重要的任务限制在 2-3 项，可以迫使你果断地处理真正重要的事情，并使你与更大的目标保持一致。这是缩小关注范围、避免分心的第一步。第二级，为了进一步缩小范围，可以为每个任务设定一个时间段作为截止日期。这没什么新鲜的。我们都知道，截止日期能让拖延症患者也进入高效工作状态，在最后一刻完成所有工作。但你可以每天早上都这样做，这样下个月取得的进展就比过去一年加起来还要多。我喜欢用两种方法来确保按时完成任务：", "1.工作时间安排紧凑，通常为 60-90 分钟。", "2.在工作间隙完成一项重要的非工作相关任务。", "如果我要为我的简报写 1000 字，我会给自己 60 分钟的时间来完成。", "通常时间不够，但这是有原因的：我没时间思考要写什么。我必须写，因为时间紧迫。如果我没写完，那就更好了，因为这会触发蔡格尼克效应（大脑倾向于完成未完成的任务），从而更容易在下一个时间段重新进入深度工作状态。在工作间隙，我会做一些需要完成的小任务，比如吃早餐，因为如果我不吃早餐，当天晚些时候的健身训练就会受到影响，而我的健康对我来说极其重要。如果你不重视自己的健康、人际关系或生活的其他方面，你的工作效率就会受到影响，因为你没有理由停止工作，从而导致工作注意力不集中。大多数每天工作 16 个小时却心不在焉的拼命三郎（即使他们认为自己很专注）无法理解，如果生活负责任且有优先级，4-6 个小时就能完成更有效的工作。", {"h": "3.优先考虑精神代谢"}, "目前，我的深度工作流程大致如下：将时间安排从低熵到高熵的顺序串联起来——清晨，世界一片寂静。没有邮件，没有与他人交流，没有电话。没有任何事物会让你思绪纷乱，悄无声息地影响你的工作。在 2-3 个时间段内完成 2-3 项最重要的任务——即使每个时间段只完成 1 项任务也没关系，只要你能感受到时间段带来的压力，从而集中精力即可。只有在深度工作完成后才能进行浅层工作——切记，在深度工作完成之前，不要查看电子邮件、社交媒体或其他任何东西。你可以继续发帖，但前提是发帖后要立即返回工作岗位。那么，一天剩下的时间呢？如果你把你的大脑想象成你的身体，那么你刚刚花了几个小时在精神健身房里进行了极限训练。你消耗了95%的精神能量，现在需要吃饭、恢复，并做一切必要的事情，才能在明天以最佳状态出现。就我而言，我的大部分工作都取决于我的想法和策略的质量。这样一来，我的大部分“工作”在正式开始工作之前就已经完成了。我每天早上坐下来后，都会非常清楚地知道自己需要做什么，因为我一天中的后半段时间都用来尽情享受休闲时光。我让自己的大脑充满营养丰富的食物。我给精神状态补充碳水化合物，这样它才能发挥最佳状态。我喜欢散步、读书、和聪明人交流、和家人朋友放松，并且努力每周至少学习或尝试一些新事物。新的地方、新的体验、新的潮流或技能。总之，要让自己保持活力。到此结束：作为一名创意人士，你要明白，在未来的工作中，那些“工作”最少的人最终会脱颖而出，因为当人工智能几乎无所不能时，你的故事、想法的融合和经验才是你唯一的护城河。"], "wcount": 3717}, {"group": "目标、意义与自我认知", "gsub": "找到方向 · 对抗虚无", "icon": "1", "title": "目标与收益——发现人生意义的指南", "paras": [{"h": "目标与收益——发现人生意义的指南"}, "目录", "引言——您将了解到的内容。", "关于工作的真相——如何从一份工作过渡到一项事业，最终走向一份使命。", "就业与创业——创业不是一种工作类型，而是一种重视自主性的心态。", "金钱的不可忽视性——如果你认为金钱是邪恶的，它很可能控制着你的生活，而你可以改变这一点。", "深度通才——为什么过度专业化会让你屈从于主流范式，以及为什么自由的个体追随自己的兴趣。", "人生目标的层次——如何超越生存，追求更高层次的人生目标。", "进步与知识——你之所以没能到达你想去的地方，是因为你缺乏到达那里所需的知识。", "你的人生事业——发现和追求人生事业的十大支柱。", "价值创造——如何让人们关心你的工作。", "元技能——一项能够改变人生的技能，却往往被大多数人忽视。", "自我变现——如何将你的自我发展转化为值得付费的东西。", "成为创造者——唯一的出路就是为无穷无尽且不可避免的一系列问题创造解决方案。", {"h": "介绍"}, "这不是一本实用的商业书籍。至少不是大多数人眼中“实用”的那种。我曾经想过写一本，但很快意识到它对你毫无帮助。如果我直接告诉你该怎么做，有些人会照做，但只有少数人能取得成果，而当我的方案与你的实际情况不符时，能够灵活调整的人就更少了。你没有我的思维方式，没有我的经验，也没有我经历的无数次细微失败——这些失败潜移默化地影响着我的决策。这并非傲慢，而是妙处所在，因为我也没有你的思维方式、经验，以及那些让你的成功之路独一无二的失败经历。我的目标不是给你具体的操作步骤，而是将更优秀的理念注入你的脑海，从而构建你思考行动的方式。信念先于行动，如果你缺乏一套几乎能保证成功的信念体系，你将会举步维艰。但这些信念不能是教条式的，我们需要更深入地思考。我希望为你提供一个框架，让你能够在此基础上构建自己的行动步骤。即使这些步骤失败了，你也会拥有一个坚持不懈、不断迭代的思维模式，直到找到成功之道。我并不打算美化金钱。社会在这方面已经做得够多了。但关键在于：答案并非在于摒弃金钱。金钱是我们所知的社会命脉，除非你想因为对金钱的认知失控而隐居山林，否则唯一的选择就是将目标与收益结合起来。如果你被误导，认为富足是坏事，你不应该拥有超过所需之物，那么这本书可能帮不了你。如果你是少数思想开放、求知欲强的人，我只请求你完整地阅读这本小书两遍。第一遍通读，第二遍消化吸收。篇幅很短，只需几次阅读即可完成。随着你深入阅
