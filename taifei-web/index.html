极值的突破失败。以及对回调极值的突破失败，总共四次折转耐锚定边线。具体而言，对极致的突破失败，应该至少要持平，还是不急也可以接受，你可以自己规定。不过，就如第九单元谈过的，我们倾向选用最靠外还未被测试的价格作为边线。要是遭到测试的过冲，我们就会进行对区间边线的扩张。接着，确保对边线的图波尝试没有跟进，以后就可以以出现后的高低一来入场。预其价格回到代表均衡的中轴附近。止损应该在区间边线之外，而止盈则可以落在区间中断三分之一的范围之内。以你的风格而定。第二种建仓方案急赴磁体，则是用上区间上下缘，可能促使价格折返以及具有越靠近越容易受磁体作用的特性。用上这样的建仓方案，我们会要求价格走的够急，够流畅，而在价格自其运动起初算起到区间边线整体距离已经走完四分之三，只剩下四分之一的时候才考虑进行短打的剥头皮交易。由于这是我自己的产发，不是阿尔布克斯亲自频繁谈过的方法。所以要是不太放心使用，就跳过这种方案也无所谓。不过这也是我如理且测试过的产品，你可以试试，你可以自行调试参数，直到它符合你的风格。通常若是价格以影线形式进入我的射程范围，但最终受限在射程之外。我会在针尖挂上停止订单，以此做来确保胜率。可若是实体直接收在射程之内，则会市价直接入场。利润目标当然就在磁铁处，否则就是在押注不太容易发生的突破成立。而止损则建议你放在区间的另一侧边线之外，或至少是该推动的极值之外。如果你更经手价格行为，你将会发现此一建仓方案甚至很有放宽标准的弹性。并不一定要非常限制在区间脉络中才能操作。只要距离重要磁体足够近，动能好，价格都很可能请去测试一下，带给你短打的获利机会。你可以在往后读图的过程中观察看看是否如此，我想你会很有收获。最后一种则是用上区间中将突破以及上下圆有支撑阻力作用这两点。你已经知道当磁体被有效穿透，它将成为突破点，而在突破测试过程之中，可能体现出支撑阻力互换的效用。遂此对于这种建仓方案，我们会希望条件层层达到。包括突破后有跟进，做了确认，还要在它回返到突破点时出现逆势方衰竭的迹象。给他出现后进入高低一的机会。如此做止损置于区间的对策之外，预期区间等距扩张的利润会是可行的。也正是在此时，你发现我们已经学了一轮从失衡讲到均衡，又重返失衡。下个单元我们就把最后一块拼图拼上谈论反转的建仓方案。如此一来，趋势起末建仓方案，你就都有所掌握，应该比起以前更认识市场，也更能够体察脉动。找到获利的良机。感谢收看区间交易方法，我们下个单元见。","p":"p571"}]},{"t":"para","text":"这个单元叫三种建仓方案。碍于时间限制，放在讲解的过程中，具体的做法只得搭配着图例来直接谈。不过，到结尾之际，我们可以先为大家复习原理，再提炼出操作方法的文字版叙述。提醒你将来应该如何执行？首先，你已经知道市场爱好均衡，且有其惰性。这使得区间中80%以上的突破尝试都将失败。于是区间难以突破上下缘有支撑阻力作用，存在可能导致加速真空效应，具备磁体性格。以及区间终将突破。这些性质就很值得我们多加进行组合利用。第一种建仓方案，看衰突破成功，就是用上前两项要素给到价格折返，回到区间内部的利润。因此，步骤会是先确立区间成立，以运行极值，回调极值，对运行极值的突破失败。以及对回调极值的突破失败，总共四次折转耐锚定边线。具体而言，对极致的突破失败，应该至少要持平，还是不急也可以接受，你可以自己规定。不过，就如第九单元谈过的，我们倾向选用最靠外还未被测试的价格作为边线。要是遭到测试的过冲，我们就会进行对区间边线的扩张。接着，确保对边线的图波尝试没有跟进，以后就可以以出现后的高低一来入场。预其价格回到代表均衡的中轴附近。止损应该在区间边线之外，而止盈则可以落在区间中断三分之一的范围之内。以你的风格而定。第二种建仓方案急赴磁体，则是用上区间上下缘，可能促使价格折返以及具有越靠近越容易受磁体作用的特性。用上这样的建仓方案，我们会要求价格走的够急，够流畅，而在价格自其运动起初算起到区间边线整体距离已经走完四分之三，只剩下四分之一的时候才考虑进行短打的剥头皮交易。由于这是我自己的产发，不是阿尔布克斯亲自频繁谈过的方法。所以要是不太放心使用，就跳过这种方案也无所谓。不过这也是我如理且测试过的产品，你可以试试，你可以自行调试参数，直到它符合你的风格。通常若是价格以影线形式进入我的射程范围，但最终受限在射程之外。我会在针尖挂上停止订单，以此做来确保胜率。可若是实体直接收在射程之内，则会市价直接入场。利润目标当然就在磁铁处，否则就是在押注不太容易发生的突破成立。而止损则建议你放在区间的另一侧边线之外，或至少是该推动的极值之外。如果你更经手价格行为，你将会发现此一建仓方案甚至很有放宽标准的弹性。并不一定要非常限制在区间脉络中才能操作。只要距离重要磁体足够近，动能好，价格都很可能请去测试一下，带给你短打的获利机会。你可以在往后读图的过程中观察看看是否如此，我想你会很有收获。最后一种则是用上区间中将突破以及上下圆有支撑阻力作用这两点。你已经知道当磁体被有效穿透，它将成为突破点，而在突破测试过程之中，可能体现出支撑阻力互换的效用。遂此对于这种建仓方案，我们会希望条件层层达到。包括突破后有跟进，做了确认，还要在它回返到突破点时出现逆势方衰竭的迹象。给他出现后进入高低一的机会。如此做止损置于区间的对策之外，预期区间等距扩张的利润会是可行的。也正是在此时，你发现我们已经学了一轮从失衡讲到均衡，又重返失衡。下个单元我们就把最后一块拼图拼上谈论反转的建仓方案。如此一来，趋势起末建仓方案，你就都有所掌握，应该比起以前更认识市场，也更能够体察脉动。找到获利的良机。感谢收看区间交易方法，我们下个单元见。","pid":"p571"}],"wcount":6792}],"wcount":14510},{"id":"l16","icon":"L16","title":"L16　反转交易方法","blocks":[],"sections":[{"id":"l16A","title":"第A段　反转交易方法","blocks":[{"t":"para","text":"L16A 反转交易方法","pid":"p572"},{"t":"img","src":"assets/img/l16A_272.webp","ilabel":"16-1","icap":"L16　反转交易方法","fid":"fig272","ctx":[{"t":"L16A 反转交易方法","p":"p572"},{"t":"如今，我们进到反转交易方法的单元，带领大家认识潜在利润可能最高的策略。先前我们都是以出复习题，再紧接着公布答案的形式来为大家回顾原理，再接着引出相应的建仓方案。不过，反转交易确实更难一点。除了已经提到的知识点，我们还要提示一些额外的方针才方便你把早语做好。今天先带我为大家将方向定好，然后再接着谈具体的交易方法。同样力求让大家在观看事例的同时，把趋势起末之间的最后一类交易方法也给具备起来。我们赶紧开始。","p":"p573"}]},{"t":"para","text":"如今，我们进到反转交易方法的单元，带领大家认识潜在利润可能最高的策略。先前我们都是以出复习题，再紧接着公布答案的形式来为大家回顾原理，再接着引出相应的建仓方案。不过，反转交易确实更难一点。除了已经提到的知识点，我们还要提示一些额外的方针才方便你把早语做好。今天先带我为大家将方向定好，然后再接着谈具体的交易方法。同样力求让大家在观看事例的同时，把趋势起末之间的最后一类交易方法也给具备起来。我们赶紧开始。","pid":"p573"},{"t":"img","src":"assets/img/l16A_273.webp","ilabel":"16-2","icap":"L16　反转交易方法","fid":"fig273","ctx":[{"t":"如今，我们进到反转交易方法的单元，带领大家认识潜在利润可能最高的策略。先前我们都是以出复习题，再紧接着公布答案的形式来为大家回顾原理，再接着引出相应的建仓方案。不过，反转交易确实更难一点。除了已经提到的知识点，我们还要提示一些额外的方针才方便你把早语做好。今天先带我为大家将方向定好，然后再接着谈具体的交易方法。同样力求让大家在观看事例的同时，把趋势起末之间的最后一类交易方法也给具备起来。我们赶紧开始。","p":"p573"},{"t":"如果要进行测验，今天的题目肯定会是，为什么趋势中的反转尝试倾向失败？大型与小型趋势反转的差异为何？确凿的大型趋势反转需要满足哪些要件？而现在我当做你已经都很熟忍这些知识了。所以节省时间来做出恶要的结论兼解答。除非重新找到均衡，否则失衡中永远是顺势交易会更有优势。小型趋势反转就是趋势中的回调。回调作为旗型作为趋势中逆向的宽幅通道。再次暗示了均衡应该在趋势方向上，所以反转的尝试才屡屡失败，造就旗型。也只有在顺势动能衰减到退无可退的程度，多空双方已然势均力敌，趋势才宣告真正终结。而大型趋势反转就更难上加难了。不只要回归均衡，逆势方还要成功突破。也就是条件才会如此严谨，需要叠加。主要发展出逆向压力，积累充分的反转形态。你还要看到，趋势线遭到突破。以及极值，不再递进。上升趋势的低点开始被下破，下降趋势的高点开始被上破。最后查验全局，你可能还要看到对原趋势极值的测试遭到否决，进行总共四项条件都完成备齐的确认。应该算是相当言简意骇了吧，重点都在这里了。希望你不用我说也已经能够直接的流畅的进行相同水准的表达。只不过，聪明的交易者也可能乍想不对劲，问出两个关键的问题。其一是既然趋势中的反转尝试倾向失败，那总会出现逆势力量，又是怎么来的？","p":"p574"}]},{"t":"para","text":"如果要进行测验，今天的题目肯定会是，为什么趋势中的反转尝试倾向失败？大型与小型趋势反转的差异为何？确凿的大型趋势反转需要满足哪些要件？而现在我当做你已经都很熟忍这些知识了。所以节省时间来做出恶要的结论兼解答。除非重新找到均衡，否则失衡中永远是顺势交易会更有优势。小型趋势反转就是趋势中的回调。回调作为旗型作为趋势中逆向的宽幅通道。再次暗示了均衡应该在趋势方向上，所以反转的尝试才屡屡失败，造就旗型。也只有在顺势动能衰减到退无可退的程度，多空双方已然势均力敌，趋势才宣告真正终结。而大型趋势反转就更难上加难了。不只要回归均衡，逆势方还要成功突破。也就是条件才会如此严谨，需要叠加。主要发展出逆向压力，积累充分的反转形态。你还要看到，趋势线遭到突破。以及极值，不再递进。上升趋势的低点开始被下破，下降趋势的高点开始被上破。最后查验全局，你可能还要看到对原趋势极值的测试遭到否决，进行总共四项条件都完成备齐的确认。应该算是相当言简意骇了吧，重点都在这里了。希望你不用我说也已经能够直接的流畅的进行相同水准的表达。只不过，聪明的交易者也可能乍想不对劲，问出两个关键的问题。其一是既然趋势中的反转尝试倾向失败，那总会出现逆势力量，又是怎么来的？","pid":"p574"},{"t":"img","src":"assets/img/l16A_274.webp","ilabel":"16-3","icap":"L16　反转交易方法","fid":"fig274","ctx":[{"t":"如果要进行测验，今天的题目肯定会是，为什么趋势中的反转尝试倾向失败？大型与小型趋势反转的差异为何？确凿的大型趋势反转需要满足哪些要件？而现在我当做你已经都很熟忍这些知识了。所以节省时间来做出恶要的结论兼解答。除非重新找到均衡，否则失衡中永远是顺势交易会更有优势。小型趋势反转就是趋势中的回调。回调作为旗型作为趋势中逆向的宽幅通道。再次暗示了均衡应该在趋势方向上，所以反转的尝试才屡屡失败，造就旗型。也只有在顺势动能衰减到退无可退的程度，多空双方已然势均力敌，趋势才宣告真正终结。而大型趋势反转就更难上加难了。不只要回归均衡，逆势方还要成功突破。也就是条件才会如此严谨，需要叠加。主要发展出逆向压力，积累充分的反转形态。你还要看到，趋势线遭到突破。以及极值，不再递进。上升趋势的低点开始被下破，下降趋势的高点开始被上破。最后查验全局，你可能还要看到对原趋势极值的测试遭到否决，进行总共四项条件都完成备齐的确认。应该算是相当言简意骇了吧，重点都在这里了。希望你不用我说也已经能够直接的流畅的进行相同水准的表达。只不过，聪明的交易者也可能乍想不对劲，问出两个关键的问题。其一是既然趋势中的反转尝试倾向失败，那总会出现逆势力量，又是怎么来的？","p":"p574"},{"t":"能够像他们一样早早开始试单吗？其二是如果非要等到条件俱全，我们再确认趋势反转，那其实也几乎不再有利润可图。这该怎么解决呢？这样吧，我们先将这两题个别击破，再联系起来，给你一个进一步的结论。","p":"p575"}]},{"t":"para","text":"能够像他们一样早早开始试单吗？其二是如果非要等到条件俱全，我们再确认趋势反转，那其实也几乎不再有利润可图。这该怎么解决呢？这样吧，我们先将这两题个别击破，再联系起来，给你一个进一步的结论。","pid":"p575"},{"t":"img","src":"assets/img/l16A_275.webp","ilabel":"16-4","icap":"L16　反转交易方法","fid":"fig275","ctx":[{"t":"能够像他们一样早早开始试单吗？其二是如果非要等到条件俱全，我们再确认趋势反转，那其实也几乎不再有利润可图。这该怎么解决呢？这样吧，我们先将这两题个别击破，再联系起来，给你一个进一步的结论。","p":"p575"},{"t":"在这样一轮经典的理想趋势中。你可以想见趋势起初的首次反转，尝试倾向失败，这正是逆一顺一交易的理据。那么，那些造就低一的阴线，其组成是什么呢？就如前面单元不断提及的，它更可能是锁定收益的止盈多头创造出的卖盘。但当然，尽管只占少数，却依然可能存在主动做空的空头交易者，是真的打算，押注反转就从这里启动。还请别笑他们傻，我们说机构的决策有理有据，长期能够获利的才得以存活。所以把这种做法也想的极端聪明，会是比较安全的做法。那这也就代表其实真的有机构在这里选择做空。眼看贡献利润给逆一顺一的顺势交易者。但他们所有的执行加总起来，或许是依仗丰厚的本金来逆风分批建仓，或许是透过与其他建仓方案相比。相互对冲曝险。终究能使执行者拥有总和为正的交易者方程式。所以认知到依然会有交易者试图在每一次反转尝试中都建立逆势的波段仓位，以确保当反转真正发生时。自己以在相对划算的价位参与进去，这样的现象存在，会是一件必要的事情。只不过，有机构能够借此获利，反存在必合理。却不代表你可以复制相同的行径，把钱给赚到。这就像是铁丝网中的情况一样，对吧？这些机构想必有更精密的策略，更快很准的执行力，甚至还有更低的交易成本。于是以上向你解释该现象如何合理存在，绝对不是为了给你一个借口把接刀摸顶的行为给正当化。通常，新手交易者就是既贪婪（想赚），又害怕损失（怕亏），还想要尽可能在市场里面找事情做。才会急躁的，不等待逆势压力积累充分，屡屡想尝试盈亏比最高的交易机会。那当然，急速中押注反转，就会是很诱人的选项。止损只需要这么浅，止盈却可以那么宽。成功就是几倍利润暴击，还可以截图晒单，非常神气。可惜大多都是白日梦，高盈亏比注定了胜率极低。而更悲哀的是，即使低几率事件发生了大幅的逆势运动即将走出。新手却又时常害怕利润回吐，于是总在浮盈些许，仅争取到剥头皮利润之后就赶紧落袋为安。浑然不觉，这种时候就应该长久持仓，才能够使高盈亏比弥补低胜率导致的多次小额损失。遂此，所有交易加总起来成为了低胜率又低盈亏比的组合，长期而言必定就赚少亏多，不穷才怪。苦口婆心讲这些，总之是劝你不要向往。押注首次反转尝试成功。就连剥头皮也不要轻易尝试。老练交易者通常反其道而行，他们也目睹反转尝试的发生，但不躁进，而是眼看其转为旗型，才执行看衰反转的顺势交易。上升趋势中，高一，高二，高三的介入方式都在前面的单元讲过了，你已经相当熟悉。希望你可以依此走在平坦，易行的正道上。","p":"p576"},{"t":"好的，太妃，我已经知道不能太早介入反转交易，因为在一段理想的趋势中，应当是越接近均衡处。押注反转的优势，才会渐次提高到可以考虑的程度。我们应该耐心等待稍晚的时间。但是第二个问题却依然压在胸口。但是太晚都等到大型趋势反转迹象已经俱全。那么，利润空间通常就已经所剩无几。这么一来，到底在什么地方介入，才会是更有利可图的选择呢？","p":"p577"}]},{"t":"para","text":"在这样一轮经典的理想趋势中。你可以想见趋势起初的首次反转，尝试倾向失败，这正是逆一顺一交易的理据。那么，那些造就低一的阴线，其组成是什么呢？就如前面单元不断提及的，它更可能是锁定收益的止盈多头创造出的卖盘。但当然，尽管只占少数，却依然可能存在主动做空的空头交易者，是真的打算，押注反转就从这里启动。还请别笑他们傻，我们说机构的决策有理有据，长期能够获利的才得以存活。所以把这种做法也想的极端聪明，会是比较安全的做法。那这也就代表其实真的有机构在这里选择做空。眼看贡献利润给逆一顺一的顺势交易者。但他们所有的执行加总起来，或许是依仗丰厚的本金来逆风分批建仓，或许是透过与其他建仓方案相比。相互对冲曝险。终究能使执行者拥有总和为正的交易者方程式。所以认知到依然会有交易者试图在每一次反转尝试中都建立逆势的波段仓位，以确保当反转真正发生时。自己以在相对划算的价位参与进去，这样的现象存在，会是一件必要的事情。只不过，有机构能够借此获利，反存在必合理。却不代表你可以复制相同的行径，把钱给赚到。这就像是铁丝网中的情况一样，对吧？这些机构想必有更精密的策略，更快很准的执行力，甚至还有更低的交易成本。于是以上向你解释该现象如何合理存在，绝对不是为了给你一个借口把接刀摸顶的行为给正当化。通常，新手交易者就是既贪婪（想赚），又害怕损失（怕亏），还想要尽可能在市场里面找事情做。才会急躁的，不等待逆势压力积累充分，屡屡想尝试盈亏比最高的交易机会。那当然，急速中押注反转，就会是很诱人的选项。止损只需要这么浅，止盈却可以那么宽。成功就是几倍利润暴击，还可以截图晒单，非常神气。可惜大多都是白日梦，高盈亏比注定了胜率极低。而更悲哀的是，即使低几率事件发生了大幅的逆势运动即将走出。新手却又时常害怕利润回吐，于是总在浮盈些许，仅争取到剥头皮利润之后就赶紧落袋为安。浑然不觉，这种时候就应该长久持仓，才能够使高盈亏比弥补低胜率导致的多次小额损失。遂此，所有交易加总起来成为了低胜率又低盈亏比的组合，长期而言必定就赚少亏多，不穷才怪。苦口婆心讲这些，总之是劝你不要向往。押注首次反转尝试成功。就连剥头皮也不要轻易尝试。老练交易者通常反其道而行，他们也目睹反转尝试的发生，但不躁进，而是眼看其转为旗型，才执行看衰反转的顺势交易。上升趋势中，高一，高二，高三的介入方式都在前面的单元讲过了，你已经相当熟悉。希望你可以依此走在平坦，易行的正道上。","pid":"p576"},{"t":"para","text":"好的，太妃，我已经知道不能太早介入反转交易，因为在一段理想的趋势中，应当是越接近均衡处。押注反转的优势，才会渐次提高到可以考虑的程度。我们应该耐心等待稍晚的时间。但是第二个问题却依然压在胸口。但是太晚都等到大型趋势反转迹象已经俱全。那么，利润空间通常就已经所剩无几。这么一来，到底在什么地方介入，才会是更有利可图的选择呢？","pid":"p577"},{"t":"img","src":"assets/img/l16A_276.webp","ilabel":"16-5","icap":"L16　反转交易方法","fid":"fig276","ctx":[{"t":"在这样一轮经典的理想趋势中。你可以想见趋势起初的首次反转，尝试倾向失败，这正是逆一顺一交易的理据。那么，那些造就低一的阴线，其组成是什么呢？就如前面单元不断提及的，它更可能是锁定收益的止盈多头创造出的卖盘。但当然，尽管只占少数，却依然可能存在主动做空的空头交易者，是真的打算，押注反转就从这里启动。还请别笑他们傻，我们说机构的决策有理有据，长期能够获利的才得以存活。所以把这种做法也想的极端聪明，会是比较安全的做法。那这也就代表其实真的有机构在这里选择做空。眼看贡献利润给逆一顺一的顺势交易者。但他们所有的执行加总起来，或许是依仗丰厚的本金来逆风分批建仓，或许是透过与其他建仓方案相比。相互对冲曝险。终究能使执行者拥有总和为正的交易者方程式。所以认知到依然会有交易者试图在每一次反转尝试中都建立逆势的波段仓位，以确保当反转真正发生时。自己以在相对划算的价位参与进去，这样的现象存在，会是一件必要的事情。只不过，有机构能够借此获利，反存在必合理。却不代表你可以复制相同的行径，把钱给赚到。这就像是铁丝网中的情况一样，对吧？这些机构想必有更精密的策略，更快很准的执行力，甚至还有更低的交易成本。于是以上向你解释该现象如何合理存在，绝对不是为了给你一个借口把接刀摸顶的行为给正当化。通常，新手交易者就是既贪婪（想赚），又害怕损失（怕亏），还想要尽可能在市场里面找事情做。才会急躁的，不等待逆势压力积累充分，屡屡想尝试盈亏比最高的交易机会。那当然，急速中押注反转，就会是很诱人的选项。止损只需要这么浅，止盈却可以那么宽。成功就是几倍利润暴击，还可以截图晒单，非常神气。可惜大多都是白日梦，高盈亏比注定了胜率极低。而更悲哀的是，即使低几率事件发生了大幅的逆势运动即将走出。新手却又时常害怕利润回吐，于是总在浮盈些许，仅争取到剥头皮利润之后就赶紧落袋为安。浑然不觉，这种时候就应该长久持仓，才能够使高盈亏比弥补低胜率导致的多次小额损失。遂此，所有交易加总起来成为了低胜率又低盈亏比的组合，长期而言必定就赚少亏多，不穷才怪。苦口婆心讲这些，总之是劝你不要向往。押注首次反转尝试成功。就连剥头皮也不要轻易尝试。老练交易者通常反其道而行，他们也目睹反转尝试的发生，但不躁进，而是眼看其转为旗型，才执行看衰反转的顺势交易。上升趋势中，高一，高二，高三的介入方式都在前面的单元讲过了，你已经相当熟悉。希望你可以依此走在平坦，易行的正道上。","p":"p576"},{"t":"好的，太妃，我已经知道不能太早介入反转交易，因为在一段理想的趋势中，应当是越接近均衡处。押注反转的优势，才会渐次提高到可以考虑的程度。我们应该耐心等待稍晚的时间。但是第二个问题却依然压在胸口。但是太晚都等到大型趋势反转迹象已经俱全。那么，利润空间通常就已经所剩无几。这么一来，到底在什么地方介入，才会是更有利可图的选择呢？","p":"p577"},{"t":"这个部分你肯定很感兴趣。毕竟这确实是看完第七单元课程之后，学员们最常向我反映跟提问的部分。此际，我要抛出一个重要概念是这样的。最值得把握的反转建仓机会可以或说，几乎总是成立在反转确立以前。再说一次反转建仓机会，总是成立于反转确立以前。以及反转建仓机会并不是反转本身。前面说的都是正确的，当反转的结构已经确定成立反转交易所能提供的较大波段，利润就已经消失。只是胜率与盈亏比成反比的必然结果。所以要是你想要更多的获利，我们就要考虑舍弃一些确定性，试试看能不能占得先机。如果你正确的在稍早，但不是太早的时机介入和几率，最终站在你的这一边。但你应该能够眼见还未备齐的要件，逐渐满足，并同时逐步扩大福音。而当反转，终究尘埃落定。你已经差不多获得预期中的充分利润。","p":"p578"}]},{"t":"para","text":"这个部分你肯定很感兴趣。毕竟这确实是看完第七单元课程之后，学员们最常向我反映跟提问的部分。此际，我要抛出一个重要概念是这样的。最值得把握的反转建仓机会可以或说，几乎总是成立在反转确立以前。再说一次反转建仓机会，总是成立于反转确立以前。以及反转建仓机会并不是反转本身。前面说的都是正确的，当反转的结构已经确定成立反转交易所能提供的较大波段，利润就已经消失。只是胜率与盈亏比成反比的必然结果。所以要是你想要更多的获利，我们就要考虑舍弃一些确定性，试试看能不能占得先机。如果你正确的在稍早，但不是太早的时机介入和几率，最终站在你的这一边。但你应该能够眼见还未备齐的要件，逐渐满足，并同时逐步扩大福音。而当反转，终究尘埃落定。你已经差不多获得预期中的充分利润。","pid":"p578"},{"t":"img","src":"assets/img/l16A_277.webp","ilabel":"16-6","icap":"L16　反转交易方法","fid":"fig277","ctx":[{"t":"这个部分你肯定很感兴趣。毕竟这确实是看完第七单元课程之后，学员们最常向我反映跟提问的部分。此际，我要抛出一个重要概念是这样的。最值得把握的反转建仓机会可以或说，几乎总是成立在反转确立以前。再说一次反转建仓机会，总是成立于反转确立以前。以及反转建仓机会并不是反转本身。前面说的都是正确的，当反转的结构已经确定成立反转交易所能提供的较大波段，利润就已经消失。只是胜率与盈亏比成反比的必然结果。所以要是你想要更多的获利，我们就要考虑舍弃一些确定性，试试看能不能占得先机。如果你正确的在稍早，但不是太早的时机介入和几率，最终站在你的这一边。但你应该能够眼见还未备齐的要件，逐渐满足，并同时逐步扩大福音。而当反转，终究尘埃落定。你已经差不多获得预期中的充分利润。","p":"p578"},{"t":"于是我想提出这样的观点，应该会是公允的。以下原则很重要，请你记好。在一轮反转确立以前，交易者可以在原趋势极值附近逆的更向左侧的建仓形态。并可以期待超过十根K线的二推逆势运动。以40%的胜率提供两倍盈亏比的利润。又或者等待反转逐步确立。也可以在突破回调后觅得相对更右侧的建仓形态。此亦即经典的一二三法则。不过因为拥抱的确定性，所以仅能期待五根K线的一推顺势运动。以60%胜率提供一点零倍盈亏比的利润。如果太早介入，你可能会被湍流的急速直接轰出场。如果太晚介入，则可能在极值反转以来的第二推运动中被困在双边遭遇地带里头。而刚提供两种路线，无论左右，虽然风格不同，但都在可以把握的具有数学理据的好球带里面。有抽象的文字叙述，接着我想要直接提出一个范例，把原则落实在K线中给你参考。这么一来，或许理解起来就会更完备一点。","p":"p579"}]},{"t":"para","text":"于是我想提出这样的观点，应该会是公允的。以下原则很重要，请你记好。在一轮反转确立以前，交易者可以在原趋势极值附近逆的更向左侧的建仓形态。并可以期待超过十根K线的二推逆势运动。以40%的胜率提供两倍盈亏比的利润。又或者等待反转逐步确立。也可以在突破回调后觅得相对更右侧的建仓形态。此亦即经典的一二三法则。不过因为拥抱的确定性，所以仅能期待五根K线的一推顺势运动。以60%胜率提供一点零倍盈亏比的利润。如果太早介入，你可能会被湍流的急速直接轰出场。如果太晚介入，则可能在极值反转以来的第二推运动中被困在双边遭遇地带里头。而刚提供两种路线，无论左右，虽然风格不同，但都在可以把握的具有数学理据的好球带里面。有抽象的文字叙述，接着我想要直接提出一个范例，把原则落实在K线中给你参考。这么一来，或许理解起来就会更完备一点。","pid":"p579"},{"t":"img","src":"assets/img/l16A_278.webp","ilabel":"16-7","icap":"L16　反转交易方法","fid":"fig278","ctx":[{"t":"于是我想提出这样的观点，应该会是公允的。以下原则很重要，请你记好。在一轮反转确立以前，交易者可以在原趋势极值附近逆的更向左侧的建仓形态。并可以期待超过十根K线的二推逆势运动。以40%的胜率提供两倍盈亏比的利润。又或者等待反转逐步确立。也可以在突破回调后觅得相对更右侧的建仓形态。此亦即经典的一二三法则。不过因为拥抱的确定性，所以仅能期待五根K线的一推顺势运动。以60%胜率提供一点零倍盈亏比的利润。如果太早介入，你可能会被湍流的急速直接轰出场。如果太晚介入，则可能在极值反转以来的第二推运动中被困在双边遭遇地带里头。而刚提供两种路线，无论左右，虽然风格不同，但都在可以把握的具有数学理据的好球带里面。有抽象的文字叙述，接着我想要直接提出一个范例，把原则落实在K线中给你参考。这么一来，或许理解起来就会更完备一点。","p":"p579"},{"t":"这是一个很不错的事例，今天我们可能会看到这张图表不止一次。不过，对应到前面的讨论，你可以想象价格在急坠过程中必定是跟随做空，更有数学优势。此处的逆一顺一交易机会将高一入场过早，押注反转的多头给套住了，甚至被迫止损。而后急速也转进越来越宽的通道，直到失去斜率。那么，我们接着来按照第七单元所教盘点一下要件依序成立的过程。趋势线屡屡被突破而放缓。逐渐形成了买压充分的三推楔形底。各级波段点被依序挑战。而对远趋势极值的测试也屡屡被驳回，有过持平的，过冲的，也有过不及的。大型趋势反转的要件一应俱全。最后价格也的确逐渐上扬。不过如果等到证据都清晰了，也许要迟滞这个重要波段点被过冲。那么，此刻才判断出，反正可能成立了，又有什么剩余利润可言，对吧？甚至还要做进去，就被套在区间上缘的危险。所以前者太早，后者太晚。这适合的交易时机必定就在两者之间。到底会在哪里呢？就结果来看，这个三推的楔形底反转形态上涨，启动自这根阴线的针底。要是我们为其画上趋势线与通道线，则下降趋势线应该不假思索，能够很好的捕捉到形态上缘的斜率。至于下缘，则需要做一三推连线，使第二推过冲的描绘。那么，用上前面提到的稍微左侧与稍微右侧的时机划分。前者会出现在通道线侧，也就是第三推对第二推突破失败之时。后者则出现在趋势线侧。确认一，趋势线突破，二，高低点开始抬升。三，完成对趋势线的突破回调，还顺道测试了底部区间的上缘，一二三法则的条件都完备之后才买进。那么，这两者相应的可供争取的利润空间。就会同样如前面原则所提及。够早入场，虽然可以依靠的资讯更少，因而胜率更低。但可以预期，十根K线总共两段左右的向上推动。此例相当标准评规比稍微比预期的二点零倍更多一些些。而若等待片刻确认的突破与回调，才高一买进。则赚剩下的鱼尾，五根K线左右的第二推能有一点零倍左右盈亏比的利润。是的，任何趋势反转都可以粗略的如此二分。","p":"p580"}]},{"t":"para","text":"这是一个很不错的事例，今天我们可能会看到这张图表不止一次。不过，对应到前面的讨论，你可以想象价格在急坠过程中必定是跟随做空，更有数学优势。此处的逆一顺一交易机会将高一入场过早，押注反转的多头给套住了，甚至被迫止损。而后急速也转进越来越宽的通道，直到失去斜率。那么，我们接着来按照第七单元所教盘点一下要件依序成立的过程。趋势线屡屡被突破而放缓。逐渐形成了买压充分的三推楔形底。各级波段点被依序挑战。而对远趋势极值的测试也屡屡被驳回，有过持平的，过冲的，也有过不及的。大型趋势反转的要件一应俱全。最后价格也的确逐渐上扬。不过如果等到证据都清晰了，也许要迟滞这个重要波段点被过冲。那么，此刻才判断出，反正可能成立了，又有什么剩余利润可言，对吧？甚至还要做进去，就被套在区间上缘的危险。所以前者太早，后者太晚。这适合的交易时机必定就在两者之间。到底会在哪里呢？就结果来看，这个三推的楔形底反转形态上涨，启动自这根阴线的针底。要是我们为其画上趋势线与通道线，则下降趋势线应该不假思索，能够很好的捕捉到形态上缘的斜率。至于下缘，则需要做一三推连线，使第二推过冲的描绘。那么，用上前面提到的稍微左侧与稍微右侧的时机划分。前者会出现在通道线侧，也就是第三推对第二推突破失败之时。后者则出现在趋势线侧。确认一，趋势线突破，二，高低点开始抬升。三，完成对趋势线的突破回调，还顺道测试了底部区间的上缘，一二三法则的条件都完备之后才买进。那么，这两者相应的可供争取的利润空间。就会同样如前面原则所提及。够早入场，虽然可以依靠的资讯更少，因而胜率更低。但可以预期，十根K线总共两段左右的向上推动。此例相当标准评规比稍微比预期的二点零倍更多一些些。而若等待片刻确认的突破与回调，才高一买进。则赚剩下的鱼尾，五根K线左右的第二推能有一点零倍左右盈亏比的利润。是的，任何趋势反转都可以粗略的如此二分。","pid":"p580"},{"t":"img","src":"assets/img/l16A_279.webp","ilabel":"16-8","icap":"L16　反转交易方法","fid":"fig279","ctx":[{"t":"这是一个很不错的事例，今天我们可能会看到这张图表不止一次。不过，对应到前面的讨论，你可以想象价格在急坠过程中必定是跟随做空，更有数学优势。此处的逆一顺一交易机会将高一入场过早，押注反转的多头给套住了，甚至被迫止损。而后急速也转进越来越宽的通道，直到失去斜率。那么，我们接着来按照第七单元所教盘点一下要件依序成立的过程。趋势线屡屡被突破而放缓。逐渐形成了买压充分的三推楔形底。各级波段点被依序挑战。而对远趋势极值的测试也屡屡被驳回，有过持平的，过冲的，也有过不及的。大型趋势反转的要件一应俱全。最后价格也的确逐渐上扬。不过如果等到证据都清晰了，也许要迟滞这个重要波段点被过冲。那么，此刻才判断出，反正可能成立了，又有什么剩余利润可言，对吧？甚至还要做进去，就被套在区间上缘的危险。所以前者太早，后者太晚。这适合的交易时机必定就在两者之间。到底会在哪里呢？就结果来看，这个三推的楔形底反转形态上涨，启动自这根阴线的针底。要是我们为其画上趋势线与通道线，则下降趋势线应该不假思索，能够很好的捕捉到形态上缘的斜率。至于下缘，则需要做一三推连线，使第二推过冲的描绘。那么，用上前面提到的稍微左侧与稍微右侧的时机划分。前者会出现在通道线侧，也就是第三推对第二推突破失败之时。后者则出现在趋势线侧。确认一，趋势线突破，二，高低点开始抬升。三，完成对趋势线的突破回调，还顺道测试了底部区间的上缘，一二三法则的条件都完备之后才买进。那么，这两者相应的可供争取的利润空间。就会同样如前面原则所提及。够早入场，虽然可以依靠的资讯更少，因而胜率更低。但可以预期，十根K线总共两段左右的向上推动。此例相当标准评规比稍微比预期的二点零倍更多一些些。而若等待片刻确认的突破与回调，才高一买进。则赚剩下的鱼尾，五根K线左右的第二推能有一点零倍左右盈亏比的利润。是的，任何趋势反转都可以粗略的如此二分。","p":"p580"},{"t":"要么进场在原趋势极值之处，通到线侧，以四成胜率赚取二点零倍盈亏比，总共两推利润。要么进场在突破回调后趋势线测以六成胜率争取一点零倍盈亏比的第二推利润。如此做，就摸索出了反转进程中较有数学优势的介入时机。既不太早也不太晚，还顺道给了不同风格的交易者不同的选择。你更喜欢波段交易，还是剥头皮交易呢？你更喜欢高盈亏比还是更高的确定性呢？对号入座就可以了，总有适合你的一种。也正是在此时，我们将以上提出的两个问题都成功的综合在一起解决。开头说，要进一步向你确定的反转交易方程，就是我们必须赶在反转确立以前找到适合的介入机会。透过这个例子，将原则指明了，后续就只要进一步的介绍操作的细则。不过，听到建仓方案的具体细节，以前请容我再啰嗦两句，讲讲我的个人意见。虽然前面提及的两种方向都是值得考虑的。但实际上，一二三法则的右侧方法虽然广为流传，但数学优势比较差强人意。此话怎讲？太妃是如此风格保守的交易者，怎么会去推荐胜率比较低，盈亏比比较好的左侧建仓方案呢？我们从区间特性的角度思考，应该就能够略见端倪。想必你清楚知道这张图表为我们展示了一个标准的从失衡回归均衡的过程。此间的关键字正是均衡，我想你可以同意，虽然这个段落并不满足第15单元提及的应有对运行与回调双双突破失败的严格区间判准。可是，自急速结束之后，转入通道，价格的确慢慢走进了粘着的双边交易地带。至少成立了所谓宽松标准的区间。那么，在区间中最应该把握的交易原则是什么呢？是谨记，既然中轴代表多空优势，各为50%。那越是靠下，就越会有多头愿意入场。而越是向上，则越有空头愿意部署订单。若我们采用这个角度去考虑，方才通道线侧与趋势线侧两种方案，那么两者的优劣就会裸露出来。当选择在原趋势极值附近寻觅入场机会。我们能够与区间交易原则相适应，也就是入场在高抛低吸的标准作战位置。但当选择在突破回调后才入场，事情就很不一样了。一来我们并不晓得这样的非水平磁体到底有没有多解性作祟，有多少机构会参见我们的绘线。二来尽管或许吧，我们可以依靠买压积累的前方脉络，加上第一推走的顺畅，也许有第二推的合理预期。而认为，后续上涨的几率会高一点。但关键的问题在于，买进在这里将恰恰位于区间的中轴。有定因素与不定因素相综合。一二三法则所最终得出的数学优势，也许就会只剩下半丝半缕。如此讨论，两种理应都有利可图的做法，细看之下却拉开了差距。","p":"p581"}]},{"t":"para","text":"要么进场在原趋势极值之处，通到线侧，以四成胜率赚取二点零倍盈亏比，总共两推利润。要么进场在突破回调后趋势线测以六成胜率争取一点零倍盈亏比的第二推利润。如此做，就摸索出了反转进程中较有数学优势的介入时机。既不太早也不太晚，还顺道给了不同风格的交易者不同的选择。你更喜欢波段交易，还是剥头皮交易呢？你更喜欢高盈亏比还是更高的确定性呢？对号入座就可以了，总有适合你的一种。也正是在此时，我们将以上提出的两个问题都成功的综合在一起解决。开头说，要进一步向你确定的反转交易方程，就是我们必须赶在反转确立以前找到适合的介入机会。透过这个例子，将原则指明了，后续就只要进一步的介绍操作的细则。不过，听到建仓方案的具体细节，以前请容我再啰嗦两句，讲讲我的个人意见。虽然前面提及的两种方向都是值得考虑的。但实际上，一二三法则的右侧方法虽然广为流传，但数学优势比较差强人意。此话怎讲？太妃是如此风格保守的交易者，怎么会去推荐胜率比较低，盈亏比比较好的左侧建仓方案呢？我们从区间特性的角度思考，应该就能够略见端倪。想必你清楚知道这张图表为我们展示了一个标准的从失衡回归均衡的过程。此间的关键字正是均衡，我想你可以同意，虽然这个段落并不满足第15单元提及的应有对运行与回调双双突破失败的严格区间判准。可是，自急速结束之后，转入通道，价格的确慢慢走进了粘着的双边交易地带。至少成立了所谓宽松标准的区间。那么，在区间中最应该把握的交易原则是什么呢？是谨记，既然中轴代表多空优势，各为50%。那越是靠下，就越会有多头愿意入场。而越是向上，则越有空头愿意部署订单。若我们采用这个角度去考虑，方才通道线侧与趋势线侧两种方案，那么两者的优劣就会裸露出来。当选择在原趋势极值附近寻觅入场机会。我们能够与区间交易原则相适应，也就是入场在高抛低吸的标准作战位置。但当选择在突破回调后才入场，事情就很不一样了。一来我们并不晓得这样的非水平磁体到底有没有多解性作祟，有多少机构会参见我们的绘线。二来尽管或许吧，我们可以依靠买压积累的前方脉络，加上第一推走的顺畅，也许有第二推的合理预期。而认为，后续上涨的几率会高一点。但关键的问题在于，买进在这里将恰恰位于区间的中轴。有定因素与不定因素相综合。一二三法则所最终得出的数学优势，也许就会只剩下半丝半缕。如此讨论，两种理应都有利可图的做法，细看之下却拉开了差距。","pid":"p581"},{"t":"img","src":"assets/img/l16A_280.webp","ilabel":"16-9","icap":"L16　反转交易方法","fid":"fig280","ctx":[{"t":"要么进场在原趋势极值之处，通到线侧，以四成胜率赚取二点零倍盈亏比，总共两推利润。要么进场在突破回调后趋势线测以六成胜率争取一点零倍盈亏比的第二推利润。如此做，就摸索出了反转进程中较有数学优势的介入时机。既不太早也不太晚，还顺道给了不同风格的交易者不同的选择。你更喜欢波段交易，还是剥头皮交易呢？你更喜欢高盈亏比还是更高的确定性呢？对号入座就可以了，总有适合你的一种。也正是在此时，我们将以上提出的两个问题都成功的综合在一起解决。开头说，要进一步向你确定的反转交易方程，就是我们必须赶在反转确立以前找到适合的介入机会。透过这个例子，将原则指明了，后续就只要进一步的介绍操作的细则。不过，听到建仓方案的具体细节，以前请容我再啰嗦两句，讲讲我的个人意见。虽然前面提及的两种方向都是值得考虑的。但实际上，一二三法则的右侧方法虽然广为流传，但数学优势比较差强人意。此话怎讲？太妃是如此风格保守的交易者，怎么会去推荐胜率比较低，盈亏比比较好的左侧建仓方案呢？我们从区间特性的角度思考，应该就能够略见端倪。想必你清楚知道这张图表为我们展示了一个标准的从失衡回归均衡的过程。此间的关键字正是均衡，我想你可以同意，虽然这个段落并不满足第15单元提及的应有对运行与回调双双突破失败的严格区间判准。可是，自急速结束之后，转入通道，价格的确慢慢走进了粘着的双边交易地带。至少成立了所谓宽松标准的区间。那么，在区间中最应该把握的交易原则是什么呢？是谨记，既然中轴代表多空优势，各为50%。那越是靠下，就越会有多头愿意入场。而越是向上，则越有空头愿意部署订单。若我们采用这个角度去考虑，方才通道线侧与趋势线侧两种方案，那么两者的优劣就会裸露出来。当选择在原趋势极值附近寻觅入场机会。我们能够与区间交易原则相适应，也就是入场在高抛低吸的标准作战位置。但当选择在突破回调后才入场，事情就很不一样了。一来我们并不晓得这样的非水平磁体到底有没有多解性作祟，有多少机构会参见我们的绘线。二来尽管或许吧，我们可以依靠买压积累的前方脉络，加上第一推走的顺畅，也许有第二推的合理预期。而认为，后续上涨的几率会高一点。但关键的问题在于，买进在这里将恰恰位于区间的中轴。有定因素与不定因素相综合。一二三法则所最终得出的数学优势，也许就会只剩下半丝半缕。如此讨论，两种理应都有利可图的做法，细看之下却拉开了差距。","p":"p581"},{"t":"事实上，如果你选择的是看书，自学或者购买阿尔布鲁克斯的课程。你也会在茫茫书海中捞到我前述提及的原则。左侧争取两推利润，右侧争取一推利润，他都认为可行。不过他确实也在一些地方提及，隐约是更推荐交易者选择前者。理由是入场较早，你会有先发制人的优势。你可以先看看第一推走的如何，再考虑要不要继续争取第二推？若第一推流畅，且回调逆势力量较弱，则安心持仓就是可行的。而要是第一推孱弱，回调来势汹汹。但或许主观的考虑与盈亏平衡处离场，还能够不以亏损作收。不过要是你放掉了，第一推只在第二推入场，那就想当然而没有这种观望的弹性，只能以宽损听天由命。而附上我前面阐述的理由，你将发现在原趋势极值处，在通道线侧入场，这既是买进在有多头弟兄撑腰的区间下缘。还为你购得了持仓管理的空间，整体作起来会更舒适且幽默。也确实在实务上选择这种做法，不时能够遇到一个比大于甚至远大于二点零倍的情况。尽管理论胜率是40%，但如果你技能逐渐精湛，有了持仓管理的能力与规则。那么，剩下60%的情况里，虽然不是以获胜做结，但偶为亏损，偶为打平，不见得会全然损好损满。于是，综合下来，期望就案例来说会再更高一点点。这也使得大型趋势反转的交易成为了阿尔布鲁克斯非常推荐给学习者的心头好之一。综合以上，我们已经将反转交易方法的大原则给说清楚了。既然在好球带中还有更优沃的通道线侧之选。接下来的具体方案教学，我们就都将以此为重。在下个节次，我们将进一步探讨如何让这个低胜率，高盈亏比的交易方法。在高盈亏比仍然被保存的前提之下，略微提高胜率。使总体期望又得到提升。","p":"p582"}]},{"t":"para","text":"事实上，如果你选择的是看书，自学或者购买阿尔布鲁克斯的课程。你也会在茫茫书海中捞到我前述提及的原则。左侧争取两推利润，右侧争取一推利润，他都认为可行。不过他确实也在一些地方提及，隐约是更推荐交易者选择前者。理由是入场较早，你会有先发制人的优势。你可以先看看第一推走的如何，再考虑要不要继续争取第二推？若第一推流畅，且回调逆势力量较弱，则安心持仓就是可行的。而要是第一推孱弱，回调来势汹汹。但或许主观的考虑与盈亏平衡处离场，还能够不以亏损作收。不过要是你放掉了，第一推只在第二推入场，那就想当然而没有这种观望的弹性，只能以宽损听天由命。而附上我前面阐述的理由，你将发现在原趋势极值处，在通道线侧入场，这既是买进在有多头弟兄撑腰的区间下缘。还为你购得了持仓管理的空间，整体作起来会更舒适且幽默。也确实在实务上选择这种做法，不时能够遇到一个比大于甚至远大于二点零倍的情况。尽管理论胜率是40%，但如果你技能逐渐精湛，有了持仓管理的能力与规则。那么，剩下60%的情况里，虽然不是以获胜做结，但偶为亏损，偶为打平，不见得会全然损好损满。于是，综合下来，期望就案例来说会再更高一点点。这也使得大型趋势反转的交易成为了阿尔布鲁克斯非常推荐给学习者的心头好之一。综合以上，我们已经将反转交易方法的大原则给说清楚了。既然在好球带中还有更优沃的通道线侧之选。接下来的具体方案教学，我们就都将以此为重。在下个节次，我们将进一步探讨如何让这个低胜率，高盈亏比的交易方法。在高盈亏比仍然被保存的前提之下，略微提高胜率。使总体期望又得到提升。","pid":"p582"}],"wcount":5097},{"id":"l16B","title":"第B段　反转交易方法","blocks":[{"t":"para","text":"L16B 反转交易方法","pid":"p583"},{"t":"img","src":"assets/img/l16B_281.webp","ilabel":"16-10","icap":"L16　反转交易方法","fid":"fig281","ctx":[{"t":"L16B 反转交易方法","p":"p583"},{"t":"前一节我们已经决定了方向，就是要专攻低胜率，高盈亏比的通道线测方案。这比在趋势线侧等待回调更有优势。不过，必然需要警戒的是，低胜率的部分。毕竟，尽管期望为证，要是操作不精准或者运气不好，遇上连续的止损，对于资金都可能造成确切的伤害。那么，这也就引人遐想。如果有一些辅助的要素能够让我们在执行这种波段风格的交易时胜率稍稍提高一些，那是不是就会好得多呢？这就是紧接而来的话题。在前面各个单元里面，我们反复提及的要点是转折不畏忽焉道来。肯定是行进过程中有一个关键时刻反向订单的数量居然压过了顺向的订单我们才会观察到无论大型或小型的反转。而大型或小型的关键差异就在究竟是止盈为多还是逆势进场为多？止盈的总是溃散得快一点，因为一旦锁定利润的步骤结束，止盈者就没有继续递送反向订单的理由。而大型趋势反转之所以能够有续航，就是因为除非趋势已经衰落到逆势的剥头皮与波段交易者。都共同认定值得争取反转发生，有利可图，他们才会大举入场。此时原趋势方的几率优势至少已经归附均衡，因而逆势交易者也源源不绝地争取反转趋势。那么你是要跟止盈的反向订单，比如急速中逆一的止盈为伍。还是要跟可能启动大型趋势反转的众多逆势方站在一起，想必是后者。你必须知道，止盈的反向订单总是比做反向交易的反向订单出现得更快更早。这也就是说，如果你想要做逆势交易，就必须要有耐心等待确切的讯号，确切到足以充分召唤你的逆势弟兄。这种讯号出现在哪里，肯定在某一个磁体上。而且由于趋势强劲时，路径上多数磁体都会被穿透，所以往往不是第一个磁体，而是沉在瓮底的比较重大的磁体。可惜我们并没有办法事先预知，最终造成大型趋势反转的磁体会是哪一个？因此，交易者的任务会是好好判读脉络，侦测所有你能标记出的关键磁体。并观察它们是被穿透，还是至少能够起到怠速的作用。他们是不是终于拦下了洪流，给到确切的入场讯号？尤其我们还需要知道的是，磁体既然由反向订单构成，那么在你介入反转交易的位置。如果提供了大量部署反向订单的理由，使磁体聚合，积累，而变得浑厚，那么造成反向运动的几率就会提升。继而成就你的期望。","p":"p584"}]},{"t":"para","text":"前一节我们已经决定了方向，就是要专攻低胜率，高盈亏比的通道线测方案。这比在趋势线侧等待回调更有优势。不过，必然需要警戒的是，低胜率的部分。毕竟，尽管期望为证，要是操作不精准或者运气不好，遇上连续的止损，对于资金都可能造成确切的伤害。那么，这也就引人遐想。如果有一些辅助的要素能够让我们在执行这种波段风格的交易时胜率稍稍提高一些，那是不是就会好得多呢？这就是紧接而来的话题。在前面各个单元里面，我们反复提及的要点是转折不畏忽焉道来。肯定是行进过程中有一个关键时刻反向订单的数量居然压过了顺向的订单我们才会观察到无论大型或小型的反转。而大型或小型的关键差异就在究竟是止盈为多还是逆势进场为多？止盈的总是溃散得快一点，因为一旦锁定利润的步骤结束，止盈者就没有继续递送反向订单的理由。而大型趋势反转之所以能够有续航，就是因为除非趋势已经衰落到逆势的剥头皮与波段交易者。都共同认定值得争取反转发生，有利可图，他们才会大举入场。此时原趋势方的几率优势至少已经归附均衡，因而逆势交易者也源源不绝地争取反转趋势。那么你是要跟止盈的反向订单，比如急速中逆一的止盈为伍。还是要跟可能启动大型趋势反转的众多逆势方站在一起，想必是后者。你必须知道，止盈的反向订单总是比做反向交易的反向订单出现得更快更早。这也就是说，如果你想要做逆势交易，就必须要有耐心等待确切的讯号，确切到足以充分召唤你的逆势弟兄。这种讯号出现在哪里，肯定在某一个磁体上。而且由于趋势强劲时，路径上多数磁体都会被穿透，所以往往不是第一个磁体，而是沉在瓮底的比较重大的磁体。可惜我们并没有办法事先预知，最终造成大型趋势反转的磁体会是哪一个？因此，交易者的任务会是好好判读脉络，侦测所有你能标记出的关键磁体。并观察它们是被穿透，还是至少能够起到怠速的作用。他们是不是终于拦下了洪流，给到确切的入场讯号？尤其我们还需要知道的是，磁体既然由反向订单构成，那么在你介入反转交易的位置。如果提供了大量部署反向订单的理由，使磁体聚合，积累，而变得浑厚，那么造成反向运动的几率就会提升。继而成就你的期望。","pid":"p584"},{"t":"img","src":"assets/img/l16B_282.webp","ilabel":"16-11","icap":"L16　反转交易方法","fid":"fig282","ctx":[{"t":"前一节我们已经决定了方向，就是要专攻低胜率，高盈亏比的通道线测方案。这比在趋势线侧等待回调更有优势。不过，必然需要警戒的是，低胜率的部分。毕竟，尽管期望为证，要是操作不精准或者运气不好，遇上连续的止损，对于资金都可能造成确切的伤害。那么，这也就引人遐想。如果有一些辅助的要素能够让我们在执行这种波段风格的交易时胜率稍稍提高一些，那是不是就会好得多呢？这就是紧接而来的话题。在前面各个单元里面，我们反复提及的要点是转折不畏忽焉道来。肯定是行进过程中有一个关键时刻反向订单的数量居然压过了顺向的订单我们才会观察到无论大型或小型的反转。而大型或小型的关键差异就在究竟是止盈为多还是逆势进场为多？止盈的总是溃散得快一点，因为一旦锁定利润的步骤结束，止盈者就没有继续递送反向订单的理由。而大型趋势反转之所以能够有续航，就是因为除非趋势已经衰落到逆势的剥头皮与波段交易者。都共同认定值得争取反转发生，有利可图，他们才会大举入场。此时原趋势方的几率优势至少已经归附均衡，因而逆势交易者也源源不绝地争取反转趋势。那么你是要跟止盈的反向订单，比如急速中逆一的止盈为伍。还是要跟可能启动大型趋势反转的众多逆势方站在一起，想必是后者。你必须知道，止盈的反向订单总是比做反向交易的反向订单出现得更快更早。这也就是说，如果你想要做逆势交易，就必须要有耐心等待确切的讯号，确切到足以充分召唤你的逆势弟兄。这种讯号出现在哪里，肯定在某一个磁体上。而且由于趋势强劲时，路径上多数磁体都会被穿透，所以往往不是第一个磁体，而是沉在瓮底的比较重大的磁体。可惜我们并没有办法事先预知，最终造成大型趋势反转的磁体会是哪一个？因此，交易者的任务会是好好判读脉络，侦测所有你能标记出的关键磁体。并观察它们是被穿透，还是至少能够起到怠速的作用。他们是不是终于拦下了洪流，给到确切的入场讯号？尤其我们还需要知道的是，磁体既然由反向订单构成，那么在你介入反转交易的位置。如果提供了大量部署反向订单的理由，使磁体聚合，积累，而变得浑厚，那么造成反向运动的几率就会提升。继而成就你的期望。","p":"p584"},{"t":"接着我们再用实例说明，把以上内容落地到图表上。如果你还没有忘掉在前一个节次，我们曾经看过这张图表。这是一个下降趋势中的三推楔形底反转，提供了交易者两倍以上盈亏比的波段利润。不过，若我们遮蔽后面的K线并重返现场。但当考虑这根阴线收出时，我们是否愿意把握良机，介入多单？你愿意吗？即使愿意做起来，能够不胆战心惊吗？这可能会有犹豫的空间。您可能会担心后面会不会还有一次测试扫掉止损？可能会细致地思考，这是一根阴线讯号K线，如果是阳线就好了。你还可能担忧，尤其的外观确实有，但会不会就碰巧碰到那25%的几率下破？犹豫之间没有放上高一入场的停止订单机会，就稍纵即逝。","p":"p585"}]},{"t":"para","text":"接着我们再用实例说明，把以上内容落地到图表上。如果你还没有忘掉在前一个节次，我们曾经看过这张图表。这是一个下降趋势中的三推楔形底反转，提供了交易者两倍以上盈亏比的波段利润。不过，若我们遮蔽后面的K线并重返现场。但当考虑这根阴线收出时，我们是否愿意把握良机，介入多单？你愿意吗？即使愿意做起来，能够不胆战心惊吗？这可能会有犹豫的空间。您可能会担心后面会不会还有一次测试扫掉止损？可能会细致地思考，这是一根阴线讯号K线，如果是阳线就好了。你还可能担忧，尤其的外观确实有，但会不会就碰巧碰到那25%的几率下破？犹豫之间没有放上高一入场的停止订单机会，就稍纵即逝。","pid":"p585"},{"t":"img","src":"assets/img/l16B_283.webp","ilabel":"16-12","icap":"L16　反转交易方法","fid":"fig283","ctx":[{"t":"接着我们再用实例说明，把以上内容落地到图表上。如果你还没有忘掉在前一个节次，我们曾经看过这张图表。这是一个下降趋势中的三推楔形底反转，提供了交易者两倍以上盈亏比的波段利润。不过，若我们遮蔽后面的K线并重返现场。但当考虑这根阴线收出时，我们是否愿意把握良机，介入多单？你愿意吗？即使愿意做起来，能够不胆战心惊吗？这可能会有犹豫的空间。您可能会担心后面会不会还有一次测试扫掉止损？可能会细致地思考，这是一根阴线讯号K线，如果是阳线就好了。你还可能担忧，尤其的外观确实有，但会不会就碰巧碰到那25%的几率下破？犹豫之间没有放上高一入场的停止订单机会，就稍纵即逝。","p":"p585"},{"t":"不过，若是我们将画面稍微向右挪，显露出昨日尾盘的部分。这笔交易做起来就可以更有底气了。这成为一个着陆于昨日低点的楔形底，给到对决线的可靠入场理由。是的，我们已经不止一次谈过对决线。对决线就是我们用以增添反转交易胜率的绝佳辅助。而且，无论是中观的旗型回调以重返趋势的见位交易场合。还是这种宏观的大型趋势反转。只要存在复数的磁体，就可能提供更多的买单介入理由，将进场的胜率给推高。不过，除了对决线的效力，这个例子好就好。在它同时，还是后续要介绍的两种反转方案的其中一种。急速与通道的等距反转。如果是细看，可以发现，经过急速运动转入回调，AB=CD的等距运动目标会恰巧落于昨日的低点附近。使楔形底的第三推过冲第二推极值，但失败突破以后，也正巧完成了对等距运动目标的测试。那此际你就得到了多重看多的理由。有整体脉络的以上辅助，这个入场方案就不再那么左侧，那么低确定性了。这么一来，无需等到大型反转的要件一一俱全，你就可以入场。在很有数学优势的位置，最终同样拿到波段等级的利润。而当要件都完备，反转事实尘埃落定，你也早就获利离场。不需在这个尴尬的位置再担心入场之后被浮亏给捆住。","p":"p586"}]},{"t":"para","text":"不过，若是我们将画面稍微向右挪，显露出昨日尾盘的部分。这笔交易做起来就可以更有底气了。这成为一个着陆于昨日低点的楔形底，给到对决线的可靠入场理由。是的，我们已经不止一次谈过对决线。对决线就是我们用以增添反转交易胜率的绝佳辅助。而且，无论是中观的旗型回调以重返趋势的见位交易场合。还是这种宏观的大型趋势反转。只要存在复数的磁体，就可能提供更多的买单介入理由，将进场的胜率给推高。不过，除了对决线的效力，这个例子好就好。在它同时，还是后续要介绍的两种反转方案的其中一种。急速与通道的等距反转。如果是细看，可以发现，经过急速运动转入回调，AB=CD的等距运动目标会恰巧落于昨日的低点附近。使楔形底的第三推过冲第二推极值，但失败突破以后，也正巧完成了对等距运动目标的测试。那此际你就得到了多重看多的理由。有整体脉络的以上辅助，这个入场方案就不再那么左侧，那么低确定性了。这么一来，无需等到大型反转的要件一一俱全，你就可以入场。在很有数学优势的位置，最终同样拿到波段等级的利润。而当要件都完备，反转事实尘埃落定，你也早就获利离场。不需在这个尴尬的位置再担心入场之后被浮亏给捆住。","pid":"p586"},{"t":"img","src":"assets/img/l16B_284.webp","ilabel":"16-13","icap":"L16　反转交易方法","fid":"fig284","ctx":[{"t":"不过，若是我们将画面稍微向右挪，显露出昨日尾盘的部分。这笔交易做起来就可以更有底气了。这成为一个着陆于昨日低点的楔形底，给到对决线的可靠入场理由。是的，我们已经不止一次谈过对决线。对决线就是我们用以增添反转交易胜率的绝佳辅助。而且，无论是中观的旗型回调以重返趋势的见位交易场合。还是这种宏观的大型趋势反转。只要存在复数的磁体，就可能提供更多的买单介入理由，将进场的胜率给推高。不过，除了对决线的效力，这个例子好就好。在它同时，还是后续要介绍的两种反转方案的其中一种。急速与通道的等距反转。如果是细看，可以发现，经过急速运动转入回调，AB=CD的等距运动目标会恰巧落于昨日的低点附近。使楔形底的第三推过冲第二推极值，但失败突破以后，也正巧完成了对等距运动目标的测试。那此际你就得到了多重看多的理由。有整体脉络的以上辅助，这个入场方案就不再那么左侧，那么低确定性了。这么一来，无需等到大型反转的要件一一俱全，你就可以入场。在很有数学优势的位置，最终同样拿到波段等级的利润。而当要件都完备，反转事实尘埃落定，你也早就获利离场。不需在这个尴尬的位置再担心入场之后被浮亏给捆住。","p":"p586"},{"t":"借刚刚的例子，我也再次顺道向你耳提面命，脉络至关重要。其实这笔交易能不能做？做起来有没有底气？不结合脉络来看待的话，就只能是一个真空的讨论。确实很可能有数学优势吧，但就是四成胜率两倍盈亏比，很难再更有把握了。而只要考虑进背景的加持，一切就会变得清晰的多，变得很值得去参与，对吧？那当然，情况也可以颠倒过来，但是向左看去，毫无支撑可以背靠，甚至此前还有连续的急速下跌走势。那你就得要担心这个区间只是短暂的休止，最终会发展成引发下破的熊旗。于是尤其当你考虑做盈亏比高的交易，就更需要瞻前顾后，来为胜率争取尽可能一点点的提升。如果刚刚例子作为先导，我向你确定了反转交易胜率低，所以需要磁体作为辅助的大原则。最好是可以向磁体借点反向订单，借力使力，来争取利润。那除了你已经非常熟悉的对决线，后续我们就着重谈两种跟利用磁体有关的反转交易方案。分别是急速与通道以及末端旗型反转。来协助你将波段交易做的相对舒心，安全。","p":"p587"}]},{"t":"para","text":"借刚刚的例子，我也再次顺道向你耳提面命，脉络至关重要。其实这笔交易能不能做？做起来有没有底气？不结合脉络来看待的话，就只能是一个真空的讨论。确实很可能有数学优势吧，但就是四成胜率两倍盈亏比，很难再更有把握了。而只要考虑进背景的加持，一切就会变得清晰的多，变得很值得去参与，对吧？那当然，情况也可以颠倒过来，但是向左看去，毫无支撑可以背靠，甚至此前还有连续的急速下跌走势。那你就得要担心这个区间只是短暂的休止，最终会发展成引发下破的熊旗。于是尤其当你考虑做盈亏比高的交易，就更需要瞻前顾后，来为胜率争取尽可能一点点的提升。如果刚刚例子作为先导，我向你确定了反转交易胜率低，所以需要磁体作为辅助的大原则。最好是可以向磁体借点反向订单，借力使力，来争取利润。那除了你已经非常熟悉的对决线，后续我们就着重谈两种跟利用磁体有关的反转交易方案。分别是急速与通道以及末端旗型反转。来协助你将波段交易做的相对舒心，安全。","pid":"p587"},{"t":"img","src":"assets/img/l16B_285.webp","ilabel":"16-14","icap":"L16　反转交易方法","fid":"fig285","ctx":[{"t":"借刚刚的例子，我也再次顺道向你耳提面命，脉络至关重要。其实这笔交易能不能做？做起来有没有底气？不结合脉络来看待的话，就只能是一个真空的讨论。确实很可能有数学优势吧，但就是四成胜率两倍盈亏比，很难再更有把握了。而只要考虑进背景的加持，一切就会变得清晰的多，变得很值得去参与，对吧？那当然，情况也可以颠倒过来，但是向左看去，毫无支撑可以背靠，甚至此前还有连续的急速下跌走势。那你就得要担心这个区间只是短暂的休止，最终会发展成引发下破的熊旗。于是尤其当你考虑做盈亏比高的交易，就更需要瞻前顾后，来为胜率争取尽可能一点点的提升。如果刚刚例子作为先导，我向你确定了反转交易胜率低，所以需要磁体作为辅助的大原则。最好是可以向磁体借点反向订单，借力使力，来争取利润。那除了你已经非常熟悉的对决线，后续我们就着重谈两种跟利用磁体有关的反转交易方案。分别是急速与通道以及末端旗型反转。来协助你将波段交易做的相对舒心，安全。","p":"p587"},{"t":"第一部分，我们先谈急速与通道。想必你记得我们在第六单元提过这几幅图。顺势交易，争取等距利润的数学优势总是随着远离失衡起点而渐次下降。更重要的是，价格还常常过度运动到优势低于50%的位置，然后大家察觉到不对劲。采用折返以修正。每每过冲的校正，最终围绕着中轴划定出过度昂贵与廉价的上下边线，形成宽泛的均衡地带。那到了这个单元，我们应该来细化这个简易的模型，给出一个对应的更多细节的常见事例。","p":"p588"}]},{"t":"para","text":"第一部分，我们先谈急速与通道。想必你记得我们在第六单元提过这几幅图。顺势交易，争取等距利润的数学优势总是随着远离失衡起点而渐次下降。更重要的是，价格还常常过度运动到优势低于50%的位置，然后大家察觉到不对劲。采用折返以修正。每每过冲的校正，最终围绕着中轴划定出过度昂贵与廉价的上下边线，形成宽泛的均衡地带。那到了这个单元，我们应该来细化这个简易的模型，给出一个对应的更多细节的常见事例。","pid":"p588"},{"t":"img","src":"assets/img/l16B_286.webp","ilabel":"16-15","icap":"L16　反转交易方法","fid":"fig286","ctx":[{"t":"第一部分，我们先谈急速与通道。想必你记得我们在第六单元提过这几幅图。顺势交易，争取等距利润的数学优势总是随着远离失衡起点而渐次下降。更重要的是，价格还常常过度运动到优势低于50%的位置，然后大家察觉到不对劲。采用折返以修正。每每过冲的校正，最终围绕着中轴划定出过度昂贵与廉价的上下边线，形成宽泛的均衡地带。那到了这个单元，我们应该来细化这个简易的模型，给出一个对应的更多细节的常见事例。","p":"p588"},{"t":"我们所谓失衡转入均衡，往往这是急速结束之后开启回调，开启通道阶段。然后终于反转，使你标定出通道起点后，接着目睹等距在动能变弱的第二推形成。此后，通到起点，找到测试，测试后，反弹再产生对远趋势极值的失败突破。双双无法有效穿越，是让参与者们并感知到多空都不再占有绝对优势。又开始积极的双边交易。以上流程的到底何在呢？我们把各个部分拆解开来谈谈。想必不用我再提醒，第二推之所以变得疲弱，一方面是因为不看好通道，能够真正完成等距运动，顺势交易者可能提前止盈。另一方面则是资金体量较大，敢于逆风进场的机构可能会在通道过程中逐步介入。顺势方有退缩，逆势方有进取的念头，也都期待有自，原因是大家都晓得，等距运动原理知道目标价位可能存在反向订单。那站在心理预期就提供了多空各方人马各自造化的体式。而当等距运动目标抵达，又或者并未抵达也好，而后折返启动。可大家也可想而知，多头价值交易者与急速结束之后，重返做多的入口正是通道起点。他们的理应会捍卫这个价格不被跌破，否则低点不再向上递进，趋势的健康结构就会遭到严峻的挑战。空头呢，他们则当然要重点竞争，原趋势极值处的动能决斗结果。要是高点又被有效抬升，突破后还会跟进。则要使得场面离逆势交易者开始有力可图的宽幅通道或者区间相去太远？又要长到不知何处，才能再有做空机会。他们都要设法提防这种不利的局面。所以此原趋势极值存在空头，通道起点存在多头就成了急速与等距通道，成立之后可以容易预期的到的情景。这正是双边交易的具体成因。多空双方将开始你来我往，造就区间。话又说回来，这又给到了反转交易者在急速与通道完成之后入场的正当性。可不是吗？等距目标是为磁体。而既然往后将成为区间这一部分通道，就是正在成形中的区间内部的第一推上涨。与之间顶部做空完全合乎高抛低吸的原则。这时候如果等距通道结束的位置还重叠其他磁体，那就更棒了。反向订单积聚的理由越是重叠而充分，反转交易的胜率就越能够得到加持。","p":"p589"}]},{"t":"para","text":"我们所谓失衡转入均衡，往往这是急速结束之后开启回调，开启通道阶段。然后终于反转，使你标定出通道起点后，接着目睹等距在动能变弱的第二推形成。此后，通到起点，找到测试，测试后，反弹再产生对远趋势极值的失败突破。双双无法有效穿越，是让参与者们并感知到多空都不再占有绝对优势。又开始积极的双边交易。以上流程的到底何在呢？我们把各个部分拆解开来谈谈。想必不用我再提醒，第二推之所以变得疲弱，一方面是因为不看好通道，能够真正完成等距运动，顺势交易者可能提前止盈。另一方面则是资金体量较大，敢于逆风进场的机构可能会在通道过程中逐步介入。顺势方有退缩，逆势方有进取的念头，也都期待有自，原因是大家都晓得，等距运动原理知道目标价位可能存在反向订单。那站在心理预期就提供了多空各方人马各自造化的体式。而当等距运动目标抵达，又或者并未抵达也好，而后折返启动。可大家也可想而知，多头价值交易者与急速结束之后，重返做多的入口正是通道起点。他们的理应会捍卫这个价格不被跌破，否则低点不再向上递进，趋势的健康结构就会遭到严峻的挑战。空头呢，他们则当然要重点竞争，原趋势极值处的动能决斗结果。要是高点又被有效抬升，突破后还会跟进。则要使得场面离逆势交易者开始有力可图的宽幅通道或者区间相去太远？又要长到不知何处，才能再有做空机会。他们都要设法提防这种不利的局面。所以此原趋势极值存在空头，通道起点存在多头就成了急速与等距通道，成立之后可以容易预期的到的情景。这正是双边交易的具体成因。多空双方将开始你来我往，造就区间。话又说回来，这又给到了反转交易者在急速与通道完成之后入场的正当性。可不是吗？等距目标是为磁体。而既然往后将成为区间这一部分通道，就是正在成形中的区间内部的第一推上涨。与之间顶部做空完全合乎高抛低吸的原则。这时候如果等距通道结束的位置还重叠其他磁体，那就更棒了。反向订单积聚的理由越是重叠而充分，反转交易的胜率就越能够得到加持。","pid":"p589"},{"t":"img","src":"assets/img/l16B_287.webp","ilabel":"16-16","icap":"L16　反转交易方法","fid":"fig287","ctx":[{"t":"我们所谓失衡转入均衡，往往这是急速结束之后开启回调，开启通道阶段。然后终于反转，使你标定出通道起点后，接着目睹等距在动能变弱的第二推形成。此后，通到起点，找到测试，测试后，反弹再产生对远趋势极值的失败突破。双双无法有效穿越，是让参与者们并感知到多空都不再占有绝对优势。又开始积极的双边交易。以上流程的到底何在呢？我们把各个部分拆解开来谈谈。想必不用我再提醒，第二推之所以变得疲弱，一方面是因为不看好通道，能够真正完成等距运动，顺势交易者可能提前止盈。另一方面则是资金体量较大，敢于逆风进场的机构可能会在通道过程中逐步介入。顺势方有退缩，逆势方有进取的念头，也都期待有自，原因是大家都晓得，等距运动原理知道目标价位可能存在反向订单。那站在心理预期就提供了多空各方人马各自造化的体式。而当等距运动目标抵达，又或者并未抵达也好，而后折返启动。可大家也可想而知，多头价值交易者与急速结束之后，重返做多的入口正是通道起点。他们的理应会捍卫这个价格不被跌破，否则低点不再向上递进，趋势的健康结构就会遭到严峻的挑战。空头呢，他们则当然要重点竞争，原趋势极值处的动能决斗结果。要是高点又被有效抬升，突破后还会跟进。则要使得场面离逆势交易者开始有力可图的宽幅通道或者区间相去太远？又要长到不知何处，才能再有做空机会。他们都要设法提防这种不利的局面。所以此原趋势极值存在空头，通道起点存在多头就成了急速与等距通道，成立之后可以容易预期的到的情景。这正是双边交易的具体成因。多空双方将开始你来我往，造就区间。话又说回来，这又给到了反转交易者在急速与通道完成之后入场的正当性。可不是吗？等距目标是为磁体。而既然往后将成为区间这一部分通道，就是正在成形中的区间内部的第一推上涨。与之间顶部做空完全合乎高抛低吸的原则。这时候如果等距通道结束的位置还重叠其他磁体，那就更棒了。反向订单积聚的理由越是重叠而充分，反转交易的胜率就越能够得到加持。","p":"p589"},{"t":"第一个例子是在上升趋势收盘之后，接着跳空高开的交易日。这里明确的呈现出了开盘之间的特征，并最后选择下破刹停在这个次级波段点。如果结合前一天的上涨来看，你有理由认为这也正在走出一轮向下的回调。只不过下跌启动的慢记忆是接连的阴线。即使有阳线创出高一和高二，但也都是孤独的昙花一现，马上又被阴线淹没。所以既然这么缺乏买压，进一步深化回调也是可能的。我们就要警戒一下，是否还有下落？那你也许想问，在刚刚下跌的过程里面，","p":"p590"},{"t":"我们可以进行收线市价入场或者逆一顺一的卖出决策吗？如果风格激进，那或许是可以考虑的，这确实是有连续动能的下跌。不过如果你忌惮这轮上升趋势可能恢复，尤其有昨日高点次级波段点以及趋势线阻挡你的去路。则可能会放弃这些机会。无论你怎么决策，后面发生的事情是这样的。回调深化到上述潜在支撑面，能够起到作用的程度。要知道这个波段点重叠AB=CD以及区间等距扩张目标的位置，我们才看见比较有存在感的阳线收住。那么，这个单元的反转交易主题在哪里呢？刚提及的是急速与通道的反转交易方法。那就这段局部的下跌趋势而言，确实这是急速之后发展出等距通道的样子。第二推稍微更弱一点，而AB=CD的目标的确存在买单。因此，如果等待一二三法则的条件迟迟成立，那价格已经运行到整轮下跌的估计中断附近。不止下半部分的利润错失了，也将使我们容易陷入区间中的不利位置。因此，我们就于此进行高一入场的左侧买进即可。同时，凭恃着对决线的有力讯号，期待一轮回到通道起点的二推运动。入场之后，第一推以三根阳线做结并旋即转入两根阴线回调，才会被阳线截断动能。如果你同样做十根K线的二推等距评估，那么继续上行也仍然是可能的。就算不幸止损就算了，这本来就是波段交易，我们必须要承担更低胜率的代价。而后虽然磨磨蹭蹭导致超过了十根K线，但最终还是得以以止盈作结。完成了略逊色于两倍盈亏比的利润。当然，就这个例子而言，左侧进场以及右侧等待趋势线的突破回调结束后，才买进入场价似乎没有差到超级多。但后者对于我这样一个不那么信赖趋势线效力的交易者来说，会怀疑这样的回调究竟是否真的踩稳了什么。尤其如果不是背靠着对决赛入场，想要追求更高确定性的，你会不会看到双边交易如此激烈？而开始怀疑做作数学优势到底是否还存在呢？一旦陷入了这样的考虑里，决策起来就反而纷杂。因此，如前所述，我还是更考虑推荐通道线测的交易方案。尤其当在这样一个上升趋势的宏观脉络里面，就能等距回调结束于此颇为合理，应当值得一试。举目可见，就机构而言，我们的确就能将利润收入口袋。","p":"p591"}]},{"t":"para","text":"第一个例子是在上升趋势收盘之后，接着跳空高开的交易日。这里明确的呈现出了开盘之间的特征，并最后选择下破刹停在这个次级波段点。如果结合前一天的上涨来看，你有理由认为这也正在走出一轮向下的回调。只不过下跌启动的慢记忆是接连的阴线。即使有阳线创出高一和高二，但也都是孤独的昙花一现，马上又被阴线淹没。所以既然这么缺乏买压，进一步深化回调也是可能的。我们就要警戒一下，是否还有下落？那你也许想问，在刚刚下跌的过程里面，","pid":"p590"},{"t":"para","text":"我们可以进行收线市价入场或者逆一顺一的卖出决策吗？如果风格激进，那或许是可以考虑的，这确实是有连续动能的下跌。不过如果你忌惮这轮上升趋势可能恢复，尤其有昨日高点次级波段点以及趋势线阻挡你的去路。则可能会放弃这些机会。无论你怎么决策，后面发生的事情是这样的。回调深化到上述潜在支撑面，能够起到作用的程度。要知道这个波段点重叠AB=CD以及区间等距扩张目标的位置，我们才看见比较有存在感的阳线收住。那么，这个单元的反转交易主题在哪里呢？刚提及的是急速与通道的反转交易方法。那就这段局部的下跌趋势而言，确实这是急速之后发展出等距通道的样子。第二推稍微更弱一点，而AB=CD的目标的确存在买单。因此，如果等待一二三法则的条件迟迟成立，那价格已经运行到整轮下跌的估计中断附近。不止下半部分的利润错失了，也将使我们容易陷入区间中的不利位置。因此，我们就于此进行高一入场的左侧买进即可。同时，凭恃着对决线的有力讯号，期待一轮回到通道起点的二推运动。入场之后，第一推以三根阳线做结并旋即转入两根阴线回调，才会被阳线截断动能。如果你同样做十根K线的二推等距评估，那么继续上行也仍然是可能的。就算不幸止损就算了，这本来就是波段交易，我们必须要承担更低胜率的代价。而后虽然磨磨蹭蹭导致超过了十根K线，但最终还是得以以止盈作结。完成了略逊色于两倍盈亏比的利润。当然，就这个例子而言，左侧进场以及右侧等待趋势线的突破回调结束后，才买进入场价似乎没有差到超级多。但后者对于我这样一个不那么信赖趋势线效力的交易者来说，会怀疑这样的回调究竟是否真的踩稳了什么。尤其如果不是背靠着对决赛入场，想要追求更高确定性的，你会不会看到双边交易如此激烈？而开始怀疑做作数学优势到底是否还存在呢？一旦陷入了这样的考虑里，决策起来就反而纷杂。因此，如前所述，我还是更考虑推荐通道线测的交易方案。尤其当在这样一个上升趋势的宏观脉络里面，就能等距回调结束于此颇为合理，应当值得一试。举目可见，就机构而言，我们的确就能将利润收入口袋。","pid":"p591"},{"t":"img","src":"assets/img/l16B_288.webp","ilabel":"16-17","icap":"L16　反转交易方法","fid":"fig288","ctx":[{"t":"第一个例子是在上升趋势收盘之后，接着跳空高开的交易日。这里明确的呈现出了开盘之间的特征，并最后选择下破刹停在这个次级波段点。如果结合前一天的上涨来看，你有理由认为这也正在走出一轮向下的回调。只不过下跌启动的慢记忆是接连的阴线。即使有阳线创出高一和高二，但也都是孤独的昙花一现，马上又被阴线淹没。所以既然这么缺乏买压，进一步深化回调也是可能的。我们就要警戒一下，是否还有下落？那你也许想问，在刚刚下跌的过程里面，","p":"p590"},{"t":"我们可以进行收线市价入场或者逆一顺一的卖出决策吗？如果风格激进，那或许是可以考虑的，这确实是有连续动能的下跌。不过如果你忌惮这轮上升趋势可能恢复，尤其有昨日高点次级波段点以及趋势线阻挡你的去路。则可能会放弃这些机会。无论你怎么决策，后面发生的事情是这样的。回调深化到上述潜在支撑面，能够起到作用的程度。要知道这个波段点重叠AB=CD以及区间等距扩张目标的位置，我们才看见比较有存在感的阳线收住。那么，这个单元的反转交易主题在哪里呢？刚提及的是急速与通道的反转交易方法。那就这段局部的下跌趋势而言，确实这是急速之后发展出等距通道的样子。第二推稍微更弱一点，而AB=CD的目标的确存在买单。因此，如果等待一二三法则的条件迟迟成立，那价格已经运行到整轮下跌的估计中断附近。不止下半部分的利润错失了，也将使我们容易陷入区间中的不利位置。因此，我们就于此进行高一入场的左侧买进即可。同时，凭恃着对决线的有力讯号，期待一轮回到通道起点的二推运动。入场之后，第一推以三根阳线做结并旋即转入两根阴线回调，才会被阳线截断动能。如果你同样做十根K线的二推等距评估，那么继续上行也仍然是可能的。就算不幸止损就算了，这本来就是波段交易，我们必须要承担更低胜率的代价。而后虽然磨磨蹭蹭导致超过了十根K线，但最终还是得以以止盈作结。完成了略逊色于两倍盈亏比的利润。当然，就这个例子而言，左侧进场以及右侧等待趋势线的突破回调结束后，才买进入场价似乎没有差到超级多。但后者对于我这样一个不那么信赖趋势线效力的交易者来说，会怀疑这样的回调究竟是否真的踩稳了什么。尤其如果不是背靠着对决赛入场，想要追求更高确定性的，你会不会看到双边交易如此激烈？而开始怀疑做作数学优势到底是否还存在呢？一旦陷入了这样的考虑里，决策起来就反而纷杂。因此，如前所述，我还是更考虑推荐通道线测的交易方案。尤其当在这样一个上升趋势的宏观脉络里面，就能等距回调结束于此颇为合理，应当值得一试。举目可见，就机构而言，我们的确就能将利润收入口袋。","p":"p591"},{"t":"另一个例子我就废话少说了。虽然这里的第二个交易日不能像上一个案例那样明确的判定为趋势中的回调。但总之，价格是以工整的急速与通道形式测试。到了昨天，尾盘区间的下缘。这个案例更棒的地方在于，比起仅仅是等距的急速与通道，这还具有漂亮的楔形顶轮廓。显示为对每一推极值都突破的差强人意。那么，在昨日区间下缘，作为待测试的突破点。急速与通道等距，楔形顶作为反转形态，这些有利因素的共同加持之下，这里就又是一个很棒的反转交易入口。同样只存在信号K线之外，预计通道起点能被测试。而后，你则能够观察到只应在十余根K线之后触发。还没完，我最喜欢这个例子的原因就在于，如果你细看会发现这轮走向通道起点的下跌。实际上也是三推的急速与通道。急速一推，通道两推。而且细节其实也是应有尽有。急速结束于次级波段点处，然后回调测试的突破点，最终下落到AB=CD的等距重叠通到起点处。那么就这一轮局部的趋势而言，我们有没有理由以入场高一的反转呢？我想也是可行的。而甚至都不用等到第二推走出，随后就触及了，直至通道起点的利润目标。纵观目前两次交易，是不是就如前面所说的，市场正在逐步找到均衡呢？价格先是脱离开盘这个短暂的区间，焕发出可观的动能。然后动能一路衰减向上，撞到天花板，开始折返。直到目前，我们这已经看到了区间的范畴，大致抵定，上下各是昂贵与廉价的边线。而最好的盈利机会就正巧是我们把握住的那一些。此间你也许能够将其与上个单元的区间交易方法贯通起来。执行反转交易本质上就是在拿捏顺势交易者推进过头，而价格朝向，均衡校正的转折点。这种风云变色，必定有其道理。如前面所述，它通常集中于某一个磁体，这正是我们需要留心的物事。而此后，虽然看起来并不工整。不过这又是一个急速之后，紧接着等距通道再次行抵区间上缘的过程。是不是又很值得考虑呢？尤其这看起来又像一个对磁体冲刺的高潮K线失去跟进。因此，再下手一次也是合情合理的。同样比较滑顺的适当到了通道起点，能够获利出场。而你要是挂念上个单元所说，如果区间众筹之后，就要担心对手变得积极，那就缩短指引目标即可。用更低的盈亏比可以换得更高的胜率。","p":"p592"}]},{"t":"para","text":"另一个例子我就废话少说了。虽然这里的第二个交易日不能像上一个案例那样明确的判定为趋势中的回调。但总之，价格是以工整的急速与通道形式测试。到了昨天，尾盘区间的下缘。这个案例更棒的地方在于，比起仅仅是等距的急速与通道，这还具有漂亮的楔形顶轮廓。显示为对每一推极值都突破的差强人意。那么，在昨日区间下缘，作为待测试的突破点。急速与通道等距，楔形顶作为反转形态，这些有利因素的共同加持之下，这里就又是一个很棒的反转交易入口。同样只存在信号K线之外，预计通道起点能被测试。而后，你则能够观察到只应在十余根K线之后触发。还没完，我最喜欢这个例子的原因就在于，如果你细看会发现这轮走向通道起点的下跌。实际上也是三推的急速与通道。急速一推，通道两推。而且细节其实也是应有尽有。急速结束于次级波段点处，然后回调测试的突破点，最终下落到AB=CD的等距重叠通到起点处。那么就这一轮局部的趋势而言，我们有没有理由以入场高一的反转呢？我想也是可行的。而甚至都不用等到第二推走出，随后就触及了，直至通道起点的利润目标。纵观目前两次交易，是不是就如前面所说的，市场正在逐步找到均衡呢？价格先是脱离开盘这个短暂的区间，焕发出可观的动能。然后动能一路衰减向上，撞到天花板，开始折返。直到目前，我们这已经看到了区间的范畴，大致抵定，上下各是昂贵与廉价的边线。而最好的盈利机会就正巧是我们把握住的那一些。此间你也许能够将其与上个单元的区间交易方法贯通起来。执行反转交易本质上就是在拿捏顺势交易者推进过头，而价格朝向，均衡校正的转折点。这种风云变色，必定有其道理。如前面所述，它通常集中于某一个磁体，这正是我们需要留心的物事。而此后，虽然看起来并不工整。不过这又是一个急速之后，紧接着等距通道再次行抵区间上缘的过程。是不是又很值得考虑呢？尤其这看起来又像一个对磁体冲刺的高潮K线失去跟进。因此，再下手一次也是合情合理的。同样比较滑顺的适当到了通道起点，能够获利出场。而你要是挂念上个单元所说，如果区间众筹之后，就要担心对手变得积极，那就缩短指引目标即可。用更低的盈亏比可以换得更高的胜率。","pid":"p592"},{"t":"img","src":"assets/img/l16B_289.webp","ilabel":"16-18","icap":"L16　反转交易方法","fid":"fig289","ctx":[{"t":"另一个例子我就废话少说了。虽然这里的第二个交易日不能像上一个案例那样明确的判定为趋势中的回调。但总之，价格是以工整的急速与通道形式测试。到了昨天，尾盘区间的下缘。这个案例更棒的地方在于，比起仅仅是等距的急速与通道，这还具有漂亮的楔形顶轮廓。显示为对每一推极值都突破的差强人意。那么，在昨日区间下缘，作为待测试的突破点。急速与通道等距，楔形顶作为反转形态，这些有利因素的共同加持之下，这里就又是一个很棒的反转交易入口。同样只存在信号K线之外，预计通道起点能被测试。而后，你则能够观察到只应在十余根K线之后触发。还没完，我最喜欢这个例子的原因就在于，如果你细看会发现这轮走向通道起点的下跌。实际上也是三推的急速与通道。急速一推，通道两推。而且细节其实也是应有尽有。急速结束于次级波段点处，然后回调测试的突破点，最终下落到AB=CD的等距重叠通到起点处。那么就这一轮局部的趋势而言，我们有没有理由以入场高一的反转呢？我想也是可行的。而甚至都不用等到第二推走出，随后就触及了，直至通道起点的利润目标。纵观目前两次交易，是不是就如前面所说的，市场正在逐步找到均衡呢？价格先是脱离开盘这个短暂的区间，焕发出可观的动能。然后动能一路衰减向上，撞到天花板，开始折返。直到目前，我们这已经看到了区间的范畴，大致抵定，上下各是昂贵与廉价的边线。而最好的盈利机会就正巧是我们把握住的那一些。此间你也许能够将其与上个单元的区间交易方法贯通起来。执行反转交易本质上就是在拿捏顺势交易者推进过头，而价格朝向，均衡校正的转折点。这种风云变色，必定有其道理。如前面所述，它通常集中于某一个磁体，这正是我们需要留心的物事。而此后，虽然看起来并不工整。不过这又是一个急速之后，紧接着等距通道再次行抵区间上缘的过程。是不是又很值得考虑呢？尤其这看起来又像一个对磁体冲刺的高潮K线失去跟进。因此，再下手一次也是合情合理的。同样比较滑顺的适当到了通道起点，能够获利出场。而你要是挂念上个单元所说，如果区间众筹之后，就要担心对手变得积极，那就缩短指引目标即可。用更低的盈亏比可以换得更高的胜率。","p":"p592"},{"t":"另一种同样适用于反转交易的方案则是末端旗型。何为末端旗型呢？定义是这样的。相信你还记得趋势中多数的反转尝试都会发展为小型趋势反转及旗型回调。不过，当有一次旗型回调，它未能起到引发趋势恢复的作用。而是催生出趋势中最后一段运行。那它就会是位于趋势末端的最后一次调整，终于造就大型趋势反转。原理也并不深奥难解。回调本身就是双边交易地带。而双边交易地带的区间本身就自带有倾向突破失败的其中一面性格。因此，当趋势已到强弩之末，瞬时突破动能衰退，到了已经无法胜过虚间具有磁力的惯性的程度。则突破夭折，给到逆势方进取的大好机会。于是，如果有一轮运行已久的趋势，在接近一项重要的磁体附近时陷入调整。可能接着发生什么呢？","p":"p593"}]},{"t":"para","text":"另一种同样适用于反转交易的方案则是末端旗型。何为末端旗型呢？定义是这样的。相信你还记得趋势中多数的反转尝试都会发展为小型趋势反转及旗型回调。不过，当有一次旗型回调，它未能起到引发趋势恢复的作用。而是催生出趋势中最后一段运行。那它就会是位于趋势末端的最后一次调整，终于造就大型趋势反转。原理也并不深奥难解。回调本身就是双边交易地带。而双边交易地带的区间本身就自带有倾向突破失败的其中一面性格。因此，当趋势已到强弩之末，瞬时突破动能衰退，到了已经无法胜过虚间具有磁力的惯性的程度。则突破夭折，给到逆势方进取的大好机会。于是，如果有一轮运行已久的趋势，在接近一项重要的磁体附近时陷入调整。可能接着发生什么呢？","pid":"p593"},{"t":"img","src":"assets/img/l16B_290.webp","ilabel":"16-19","icap":"L16　反转交易方法","fid":"fig290","ctx":[{"t":"另一种同样适用于反转交易的方案则是末端旗型。何为末端旗型呢？定义是这样的。相信你还记得趋势中多数的反转尝试都会发展为小型趋势反转及旗型回调。不过，当有一次旗型回调，它未能起到引发趋势恢复的作用。而是催生出趋势中最后一段运行。那它就会是位于趋势末端的最后一次调整，终于造就大型趋势反转。原理也并不深奥难解。回调本身就是双边交易地带。而双边交易地带的区间本身就自带有倾向突破失败的其中一面性格。因此，当趋势已到强弩之末，瞬时突破动能衰退，到了已经无法胜过虚间具有磁力的惯性的程度。则突破夭折，给到逆势方进取的大好机会。于是，如果有一轮运行已久的趋势，在接近一项重要的磁体附近时陷入调整。可能接着发生什么呢？","p":"p593"},{"t":"我们接下来看看案例，顺便讨论操作办法。这是BNB自2021年以来的周线级别图表。价格自2021年走到曾经的顶峰之后，开始长达了两年的熊市。有漫长的时间都在画面中断的低谷之中。然而，自2024年初开始一步步回春，价格在仅仅三月左右就几乎恢复到远趋势极值。只不过咫尺天涯之际，价格又陷入了振幅颇宽的调整。显然，多空认为，这里可能已经是均衡地带，于是在你来我往之中，试图进一步讨论后续何去何从。那么，如果我们将整张图表视为一个超大的区间。价格在临近历史新高处，附近理论会更有利于空头做空还是多头做多呢？当然，有较低几率的向上突破可能不可不胜。但就几率优势而言，于顶部寻找做空的机会会更加明智。此间，这是一个临近重大磁地的末端旗型，可能会出现的地方。在上升的急速中，出现了调整，理应是能够延续上涨的牛旗。但波动剧烈，双面交易性格强烈，这一次的调整本就有突破失败的可能。而结合脉络来看待，它又在一个令人不适的天花板附近。而后多少会有高潮突破，但随即因为遭到反向订单阻抗而失去跟进的可能性。那后续事情确实也是这么发生的。虽然因为讯号K线太长，最终的盈亏比将远远不及两倍。但在这里，依然有给到第一做空的机会。走出预期中的两推下跌，在旗型底部止盈会恰恰好。在底部区间突破起算，这里也正是定义上的通道起点。即急速结束之后，回调最低点。同时，若是结合第15单元的知识说，这里的建仓逻辑与区间中看出来突破成功有所重叠，也是绝对正确的。虽然走得艰辛，但如果你还记得看衰突破的做法，来到区间中之后会是可行的。这支针就差一点点抵达。而后另一次向下测试则成功到位，并完成了对下方区间顶部的突破测试。","p":"p594"}]},{"t":"para","text":"我们接下来看看案例，顺便讨论操作办法。这是BNB自2021年以来的周线级别图表。价格自2021年走到曾经的顶峰之后，开始长达了两年的熊市。有漫长的时间都在画面中断的低谷之中。然而，自2024年初开始一步步回春，价格在仅仅三月左右就几乎恢复到远趋势极值。只不过咫尺天涯之际，价格又陷入了振幅颇宽的调整。显然，多空认为，这里可能已经是均衡地带，于是在你来我往之中，试图进一步讨论后续何去何从。那么，如果我们将整张图表视为一个超大的区间。价格在临近历史新高处，附近理论会更有利于空头做空还是多头做多呢？当然，有较低几率的向上突破可能不可不胜。但就几率优势而言，于顶部寻找做空的机会会更加明智。此间，这是一个临近重大磁地的末端旗型，可能会出现的地方。在上升的急速中，出现了调整，理应是能够延续上涨的牛旗。但波动剧烈，双面交易性格强烈，这一次的调整本就有突破失败的可能。而结合脉络来看待，它又在一个令人不适的天花板附近。而后多少会有高潮突破，但随即因为遭到反向订单阻抗而失去跟进的可能性。那后续事情确实也是这么发生的。虽然因为讯号K线太长，最终的盈亏比将远远不及两倍。但在这里，依然有给到第一做空的机会。走出预期中的两推下跌，在旗型底部止盈会恰恰好。在底部区间突破起算，这里也正是定义上的通道起点。即急速结束之后，回调最低点。同时，若是结合第15单元的知识说，这里的建仓逻辑与区间中看出来突破成功有所重叠，也是绝对正确的。虽然走得艰辛，但如果你还记得看衰突破的做法，来到区间中之后会是可行的。这支针就差一点点抵达。而后另一次向下测试则成功到位，并完成了对下方区间顶部的突破测试。","pid":"p594"},{"t":"img","src":"assets/img/l16B_291.webp","ilabel":"16-20","icap":"L16　反转交易方法","fid":"fig291","ctx":[{"t":"我们接下来看看案例，顺便讨论操作办法。这是BNB自2021年以来的周线级别图表。价格自2021年走到曾经的顶峰之后，开始长达了两年的熊市。有漫长的时间都在画面中断的低谷之中。然而，自2024年初开始一步步回春，价格在仅仅三月左右就几乎恢复到远趋势极值。只不过咫尺天涯之际，价格又陷入了振幅颇宽的调整。显然，多空认为，这里可能已经是均衡地带，于是在你来我往之中，试图进一步讨论后续何去何从。那么，如果我们将整张图表视为一个超大的区间。价格在临近历史新高处，附近理论会更有利于空头做空还是多头做多呢？当然，有较低几率的向上突破可能不可不胜。但就几率优势而言，于顶部寻找做空的机会会更加明智。此间，这是一个临近重大磁地的末端旗型，可能会出现的地方。在上升的急速中，出现了调整，理应是能够延续上涨的牛旗。但波动剧烈，双面交易性格强烈，这一次的调整本就有突破失败的可能。而结合脉络来看待，它又在一个令人不适的天花板附近。而后多少会有高潮突破，但随即因为遭到反向订单阻抗而失去跟进的可能性。那后续事情确实也是这么发生的。虽然因为讯号K线太长，最终的盈亏比将远远不及两倍。但在这里，依然有给到第一做空的机会。走出预期中的两推下跌，在旗型底部止盈会恰恰好。在底部区间突破起算，这里也正是定义上的通道起点。即急速结束之后，回调最低点。同时，若是结合第15单元的知识说，这里的建仓逻辑与区间中看出来突破成功有所重叠，也是绝对正确的。虽然走得艰辛，但如果你还记得看衰突破的做法，来到区间中之后会是可行的。这支针就差一点点抵达。而后另一次向下测试则成功到位，并完成了对下方区间顶部的突破测试。","p":"p594"},{"t":"经过案例展示，我们可以接着回头思考，利用末端旗型来执行反转交易的正当性何在呢？同样，我们说大型趋势反转理应启动自某一项重要的磁体。这里才会有足够的反向订单，启动深度的逆行。那么，能够起到加成作用的，当然就是该磁体附近还有其他理由也吸引反向订单放置。上一种方案正是其中一种办法。我们考虑多种磁体的重叠。所以以急速与等距离目标，加上通道线来提供逆势交易者更多的保障。那这种方案也具有相仿的逻辑，旗型回调作为区间虽然多半能够引发趋势延续。但结合脉络来讨论，如果价格终于出脱旗型之际，就有另一堵高墙障碍着行驶路径。那么，最终突破就可能失败，开启大型趋势反转。在此，我们可以寻找临近重要磁体的旗型回调，并在价格对重要磁体的突破失去跟进之后。以触线后的高/低1来入场。同样争取十根K线的二次运行。","p":"p595"}]},{"t":"para","text":"经过案例展示，我们可以接着回头思考，利用末端旗型来执行反转交易的正当性何在呢？同样，我们说大型趋势反转理应启动自某一项重要的磁体。这里才会有足够的反向订单，启动深度的逆行。那么，能够起到加成作用的，当然就是该磁体附近还有其他理由也吸引反向订单放置。上一种方案正是其中一种办法。我们考虑多种磁体的重叠。所以以急速与等距离目标，加上通道线来提供逆势交易者更多的保障。那这种方案也具有相仿的逻辑，旗型回调作为区间虽然多半能够引发趋势延续。但结合脉络来讨论，如果价格终于出脱旗型之际，就有另一堵高墙障碍着行驶路径。那么，最终突破就可能失败，开启大型趋势反转。在此，我们可以寻找临近重要磁体的旗型回调，并在价格对重要磁体的突破失去跟进之后。以触线后的高/低1来入场。同样争取十根K线的二次运行。","pid":"p595"},{"t":"img","src":"assets/img/l16B_292.webp","ilabel":"16-21","icap":"L16　反转交易方法","fid":"fig292","ctx":[{"t":"经过案例展示，我们可以接着回头思考，利用末端旗型来执行反转交易的正当性何在呢？同样，我们说大型趋势反转理应启动自某一项重要的磁体。这里才会有足够的反向订单，启动深度的逆行。那么，能够起到加成作用的，当然就是该磁体附近还有其他理由也吸引反向订单放置。上一种方案正是其中一种办法。我们考虑多种磁体的重叠。所以以急速与等距离目标，加上通道线来提供逆势交易者更多的保障。那这种方案也具有相仿的逻辑，旗型回调作为区间虽然多半能够引发趋势延续。但结合脉络来讨论，如果价格终于出脱旗型之际，就有另一堵高墙障碍着行驶路径。那么，最终突破就可能失败，开启大型趋势反转。在此，我们可以寻找临近重要磁体的旗型回调，并在价格对重要磁体的突破失去跟进之后。以触线后的高/低1来入场。同样争取十根K线的二次运行。","p":"p595"},{"t":"我们再看看另一个例子。这同样是一段上行启动之后，进入了反复性比较强的调整。第一推是对前方突破点的测试，同时也是50%回调处。而后有不及第一推的第二推，以及过冲第一推的第三推，可以被视作是双重底或三重底。总之，在这里给到了旗型回调的高1入场机会。不过后续走的是比较难看。对急速极值测试之后，不见多头的积极身影。反倒是不断阴阳交错，振幅缩小，进入了漫长的调整。总而言之，起涨点至今是走出了一个区间突破失败之后又转入了更窄，符合区间。结合脉络看待今日目前的高点将至这，有可能成为引发衰竭高潮上涨的末端旗型。因此，我们紧盯高出磁体的动能结论，看看有没有低一做空入场机会。那接着出现一根大的几乎光头光脚的阳线，突破区间顶部，撞上了磁体。但戏剧化的没有跟进，这里反倒甚至是一颗跳空低开的阴线十字星，完全不像是多头打算争取向上趋势发起的样子。觉察到这样的机会以后，我们就可以等待低一下破，将止损放在讯号K线之外，以寻求波段等级利润。止盈呢？止盈必须按照你的风格来设定。之所以无法提供一个明确的指令，是因为末端旗型的量态可能千奇百怪。内部次级波段点出现的多寡，分布的位置都不一定。因此，很难有放之止盈的一定之规，是个复杂高阶的建仓方案。但原则，依然与前面提过的内容是共通的。大型追势反转，你可以期盼大约十根K线左右的二推逆行。在这个例子里面，我想窄幅之间底部或者更前方的通道起点都会是可行的选项。后面紧接着下跌，止盈是双双触及。那你也许会问我可不可以先不设止盈，而是看看第一推能走到哪里，再评估最后应该期盼第二推可能如何发育。如果你已经精熟所有原理，希望在无弹性的交易规则之中注入一点主观的活水，那也许可以试试。此例。第一推结束之后，开启了一次窄幅的多头通道回调，然后又接着出现两根趋势阴线下落。可能拓展第二推的幅度。不过后续马上却又收了阳线，截断了第二推下跌的发育。这时候你可能就要考虑看看是不是通道起点，被测试之后空头已经失去继续推动下跌的兴趣。以至于在这里可能发展出，低点不继续降低的疲软第二推。确实有这种可能性。那么，在阳线出现并收定后主动离场会是可行的办法。如此做后续的继续利润回吐，你也因而能够避免。","p":"p596"}]},{"t":"para","text":"我们再看看另一个例子。这同样是一段上行启动之后，进入了反复性比较强的调整。第一推是对前方突破点的测试，同时也是50%回调处。而后有不及第一推的第二推，以及过冲第一推的第三推，可以被视作是双重底或三重底。总之，在这里给到了旗型回调的高1入场机会。不过后续走的是比较难看。对急速极值测试之后，不见多头的积极身影。反倒是不断阴阳交错，振幅缩小，进入了漫长的调整。总而言之，起涨点至今是走出了一个区间突破失败之后又转入了更窄，符合区间。结合脉络看待今日目前的高点将至这，有可能成为引发衰竭高潮上涨的末端旗型。因此，我们紧盯高出磁体的动能结论，看看有没有低一做空入场机会。那接着出现一根大的几乎光头光脚的阳线，突破区间顶部，撞上了磁体。但戏剧化的没有跟进，这里反倒甚至是一颗跳空低开的阴线十字星，完全不像是多头打算争取向上趋势发起的样子。觉察到这样的机会以后，我们就可以等待低一下破，将止损放在讯号K线之外，以寻求波段等级利润。止盈呢？止盈必须按照你的风格来设定。之所以无法提供一个明确的指令，是因为末端旗型的量态可能千奇百怪。内部次级波段点出现的多寡，分布的位置都不一定。因此，很难有放之止盈的一定之规，是个复杂高阶的建仓方案。但原则，依然与前面提过的内容是共通的。大型追势反转，你可以期盼大约十根K线左右的二推逆行。在这个例子里面，我想窄幅之间底部或者更前方的通道起点都会是可行的选项。后面紧接着下跌，止盈是双双触及。那你也许会问我可不可以先不设止盈，而是看看第一推能走到哪里，再评估最后应该期盼第二推可能如何发育。如果你已经精熟所有原理，希望在无弹性的交易规则之中注入一点主观的活水，那也许可以试试。此例。第一推结束之后，开启了一次窄幅的多头通道回调，然后又接着出现两根趋势阴线下落。可能拓展第二推的幅度。不过后续马上却又收了阳线，截断了第二推下跌的发育。这时候你可能就要考虑看看是不是通道起点，被测试之后空头已经失去继续推动下跌的兴趣。以至于在这里可能发展出，低点不继续降低的疲软第二推。确实有这种可能性。那么，在阳线出现并收定后主动离场会是可行的办法。如此做后续的继续利润回吐，你也因而能够避免。","pid":"p596"},{"t":"img","src":"assets/img/l16B_293.webp","ilabel":"16-22","icap":"L16　反转交易方法","fid":"fig293","ctx":[{"t":"我们再看看另一个例子。这同样是一段上行启动之后，进入了反复性比较强的调整。第一推是对前方突破点的测试，同时也是50%回调处。而后有不及第一推的第二推，以及过冲第一推的第三推，可以被视作是双重底或三重底。总之，在这里给到了旗型回调的高1入场机会。不过后续走的是比较难看。对急速极值测试之后，不见多头的积极身影。反倒是不断阴阳交错，振幅缩小，进入了漫长的调整。总而言之，起涨点至今是走出了一个区间突破失败之后又转入了更窄，符合区间。结合脉络看待今日目前的高点将至这，有可能成为引发衰竭高潮上涨的末端旗型。因此，我们紧盯高出磁体的动能结论，看看有没有低一做空入场机会。那接着出现一根大的几乎光头光脚的阳线，突破区间顶部，撞上了磁体。但戏剧化的没有跟进，这里反倒甚至是一颗跳空低开的阴线十字星，完全不像是多头打算争取向上趋势发起的样子。觉察到这样的机会以后，我们就可以等待低一下破，将止损放在讯号K线之外，以寻求波段等级利润。止盈呢？止盈必须按照你的风格来设定。之所以无法提供一个明确的指令，是因为末端旗型的量态可能千奇百怪。内部次级波段点出现的多寡，分布的位置都不一定。因此，很难有放之止盈的一定之规，是个复杂高阶的建仓方案。但原则，依然与前面提过的内容是共通的。大型追势反转，你可以期盼大约十根K线左右的二推逆行。在这个例子里面，我想窄幅之间底部或者更前方的通道起点都会是可行的选项。后面紧接着下跌，止盈是双双触及。那你也许会问我可不可以先不设止盈，而是看看第一推能走到哪里，再评估最后应该期盼第二推可能如何发育。如果你已经精熟所有原理，希望在无弹性的交易规则之中注入一点主观的活水，那也许可以试试。此例。第一推结束之后，开启了一次窄幅的多头通道回调，然后又接着出现两根趋势阴线下落。可能拓展第二推的幅度。不过后续马上却又收了阳线，截断了第二推下跌的发育。这时候你可能就要考虑看看是不是通道起点，被测试之后空头已经失去继续推动下跌的兴趣。以至于在这里可能发展出，低点不继续降低的疲软第二推。确实有这种可能性。那么，在阳线出现并收定后主动离场会是可行的办法。如此做后续的继续利润回吐，你也因而能够避免。","p":"p596"},{"t":"最后，我们再来看个急速与通道以及末端旗型两相结合的例子吧。画面中第二个交易日的开盘区间被下破，而突破点被阳线测试之后就一路发展为急速窄幅通道，宽幅通道的下跌走势。截至目前为止，我们可以先寻找急速与通道的等距运动目标会落在何处？不过，此间值得玩味的一点是，虽然下破开盘区间的推动，属于我所标记的这根阴线。但动能交易者会将止损摆在哪里呢？更可能是开盘区间上缘，对吧？那么AB=CD的测算，就也许这样子会更恰当一点。要是如此做，则其目标还未抵达，就差一点点被触及。那么后面有没有可能再走出对于这个区间突破失败的衰竭一跌？不只完成等距，测试到昨日低点还成就三推的楔形底反转形态，一举启动向上的可观反转呢。这就值得我们睁大眼睛期待了。果不其然，阴线一到位，马上失去跟进，再次给到高一的波段交易入口。测试通道起点的指引距离也于是可以取代。后面第一推走的相当顺利，使我们可以安心持仓。而尽管第二推动能变弱，却依然缓步上涨，直到触发我们的止盈订单。正是透过这个例子，两种建仓方案的逻辑都呈现出来了。无论如何，磁体越是叠加，反向订单越是集聚，就越可能提供反转交易者争取波段利润的信心底气。","p":"p597"}]},{"t":"para","text":"最后，我们再来看个急速与通道以及末端旗型两相结合的例子吧。画面中第二个交易日的开盘区间被下破，而突破点被阳线测试之后就一路发展为急速窄幅通道，宽幅通道的下跌走势。截至目前为止，我们可以先寻找急速与通道的等距运动目标会落在何处？不过，此间值得玩味的一点是，虽然下破开盘区间的推动，属于我所标记的这根阴线。但动能交易者会将止损摆在哪里呢？更可能是开盘区间上缘，对吧？那么AB=CD的测算，就也许这样子会更恰当一点。要是如此做，则其目标还未抵达，就差一点点被触及。那么后面有没有可能再走出对于这个区间突破失败的衰竭一跌？不只完成等距，测试到昨日低点还成就三推的楔形底反转形态，一举启动向上的可观反转呢。这就值得我们睁大眼睛期待了。果不其然，阴线一到位，马上失去跟进，再次给到高一的波段交易入口。测试通道起点的指引距离也于是可以取代。后面第一推走的相当顺利，使我们可以安心持仓。而尽管第二推动能变弱，却依然缓步上涨，直到触发我们的止盈订单。正是透过这个例子，两种建仓方案的逻辑都呈现出来了。无论如何，磁体越是叠加，反向订单越是集聚，就越可能提供反转交易者争取波段利润的信心底气。","pid":"p597"},{"t":"img","src":"assets/img/l16B_294.webp","ilabel":"16-23","icap":"L16　反转交易方法","fid":"fig294","ctx":[{"t":"最后，我们再来看个急速与通道以及末端旗型两相结合的例子吧。画面中第二个交易日的开盘区间被下破，而突破点被阳线测试之后就一路发展为急速窄幅通道，宽幅通道的下跌走势。截至目前为止，我们可以先寻找急速与通道的等距运动目标会落在何处？不过，此间值得玩味的一点是，虽然下破开盘区间的推动，属于我所标记的这根阴线。但动能交易者会将止损摆在哪里呢？更可能是开盘区间上缘，对吧？那么AB=CD的测算，就也许这样子会更恰当一点。要是如此做，则其目标还未抵达，就差一点点被触及。那么后面有没有可能再走出对于这个区间突破失败的衰竭一跌？不只完成等距，测试到昨日低点还成就三推的楔形底反转形态，一举启动向上的可观反转呢。这就值得我们睁大眼睛期待了。果不其然，阴线一到位，马上失去跟进，再次给到高一的波段交易入口。测试通道起点的指引距离也于是可以取代。后面第一推走的相当顺利，使我们可以安心持仓。而尽管第二推动能变弱，却依然缓步上涨，直到触发我们的止盈订单。正是透过这个例子，两种建仓方案的逻辑都呈现出来了。无论如何，磁体越是叠加，反向订单越是集聚，就越可能提供反转交易者争取波段利润的信心底气。","p":"p597"},{"t":"又到了结尾的复习时间，我们赶快来同整这一单元的重点。首先我向你提点了最重要的概念。具有数学优势的反转交易机会总是出现在反转，终于被第七单元提及的四个查核条件正式确立以前。不过太早入场很容易被仍然占据上风的顺势交易者击杀，对吧？他们入场，则又将几乎没有利润可图。找到恰逢其时的交易机会，还真不容易。幸好经过讲解，你已经知道合理的入场点有二。在逆势压力积累充分的反转形态确立之后。左侧方案采波段逻辑，入场在通道线处右侧入场则是剥头皮逻辑介入，在趋势线的突破回调时。这两种做法各自可以争取十根K线，两段推动或五根K线，一段推动的逆行。不过，细究起来，俗称一二三法则的后者，却因为容易入场在宽幅通道转向区间的不利位置之中。也就是在区间顶部做多，或者区间底部做空，因而又变得没有那么可取。于是在通道线测入场的方案会更值得你考虑。所有的建仓方案也都是立基在这样的共识之上。接着我们谈了两种建仓逻辑，分别是急速与通道的等距反转，以及对末端旗型的突破失败反转。这两者的共通处在于介入逆向高低的位置，都建议要背靠另一项磁体给它更充分的反向订单加持。并且可以结合逆势压力积累充分的反转形态通道线，使这样的反转操作也能够被称作是对决线反转建仓方案。理念是清晰的，大型趋势反转不易成立。但一旦成立，就是在某一个磁体之上。若干磁体还是众多磁体的负荷，那就越可能召唤各种理由的反向订单介入。提到执行反转交易的我们优势。急速与通道组合在图表上可以说是处处可见。其中，通道阶段常是正在成型的区间中的第一段推动。而后会有矫正过渡运行的逆向推动，一路走到通道起点被测试。因此，等距运动目标，重叠另一项磁体处，我们可以以出现后的高低1进场。与其十根K线左右的总共两段力相推动。止损就在讯号K线之外，止盈就在通道起点。另一种末端旗型建仓方案，要想捕捉这种机会，我们就得要挑选形成在磁体之前的旗型回调。而当价格要试图突破，以恢复趋势，它主要面临旗型顶点自带的反向订单。当过冲到触及临近的那个磁体，则又要承受第二重阻抗。往往就是在这样的情况之下，过冲并不能获得跟进，而形成了衰竭的高潮运动。在此，我们同样观察，突破是否没有办法获得跟进，并在出现之后同样以高低1进场，止损置于信号K线之外，但止盈的位置可能会需要视个别情况而定。如果觉得这样的提示不够明确，那么略过这种建仓方案也是可以的。目前所提及的所有交易方法应该已经足以让学习者在市场中捕捉正向期望的入场时机。一路讲到这里，趋势起末的交易方法，我们就已经充分的逐步涉及了。从急速开始，我们有收线市价追近进，逆一順一，再有双重顶底楔形顶底。到了区间，我们有看衰突破，急赴磁体以及区间突破回调。而说到反转，则有急速与通道反转，以及末端旗型反转。各种市场脉络，现在你应该都已经有了对付的武器，那么在下个单元里，我们会再补充几项好用的方法。因为目前的教学略作同正确保你可以完整的结合原理与执行。感谢收看反转交易方法。我们下个单元见。","p":"p598"}]},{"t":"para","text":"又到了结尾的复习时间，我们赶快来同整这一单元的重点。首先我向你提点了最重要的概念。具有数学优势的反转交易机会总是出现在反转，终于被第七单元提及的四个查核条件正式确立以前。不过太早入场很容易被仍然占据上风的顺势交易者击杀，对吧？他们入场，则又将几乎没有利润可图。找到恰逢其时的交易机会，还真不容易。幸好经过讲解，你已经知道合理的入场点有二。在逆势压力积累充分的反转形态确立之后。左侧方案采波段逻辑，入场在通道线处右侧入场则是剥头皮逻辑介入，在趋势线的突破回调时。这两种做法各自可以争取十根K线，两段推动或五根K线，一段推动的逆行。不过，细究起来，俗称一二三法则的后者，却因为容易入场在宽幅通道转向区间的不利位置之中。也就是在区间顶部做多，或者区间底部做空，因而又变得没有那么可取。于是在通道线测入场的方案会更值得你考虑。所有的建仓方案也都是立基在这样的共识之上。接着我们谈了两种建仓逻辑，分别是急速与通道的等距反转，以及对末端旗型的突破失败反转。这两者的共通处在于介入逆向高低的位置，都建议要背靠另一项磁体给它更充分的反向订单加持。并且可以结合逆势压力积累充分的反转形态通道线，使这样的反转操作也能够被称作是对决线反转建仓方案。理念是清晰的，大型趋势反转不易成立。但一旦成立，就是在某一个磁体之上。若干磁体还是众多磁体的负荷，那就越可能召唤各种理由的反向订单介入。提到执行反转交易的我们优势。急速与通道组合在图表上可以说是处处可见。其中，通道阶段常是正在成型的区间中的第一段推动。而后会有矫正过渡运行的逆向推动，一路走到通道起点被测试。因此，等距运动目标，重叠另一项磁体处，我们可以以出现后的高低1进场。与其十根K线左右的总共两段力相推动。止损就在讯号K线之外，止盈就在通道起点。另一种末端旗型建仓方案，要想捕捉这种机会，我们就得要挑选形成在磁体之前的旗型回调。而当价格要试图突破，以恢复趋势，它主要面临旗型顶点自带的反向订单。当过冲到触及临近的那个磁体，则又要承受第二重阻抗。往往就是在这样的情况之下，过冲并不能获得跟进，而形成了衰竭的高潮运动。在此，我们同样观察，突破是否没有办法获得跟进，并在出现之后同样以高低1进场，止损置于信号K线之外，但止盈的位置可能会需要视个别情况而定。如果觉得这样的提示不够明确，那么略过这种建仓方案也是可以的。目前所提及的所有交易方法应该已经足以让学习者在市场中捕捉正向期望的入场时机。一路讲到这里，趋势起末的交易方法，我们就已经充分的逐步涉及了。从急速开始，我们有收线市价追近进，逆一順一，再有双重顶底楔形顶底。到了区间，我们有看衰突破，急赴磁体以及区间突破回调。而说到反转，则有急速与通道反转，以及末端旗型反转。各种市场脉络，现在你应该都已经有了对付的武器，那么在下个单元里，我们会再补充几项好用的方法。因为目前的教学略作同正确保你可以完整的结合原理与执行。感谢收看反转交易方法。我们下个单元见。","pid":"p598"}],"wcount":8886}],"wcount":13983},{"id":"l17","icon":"L17","title":"L17　首次回调序列与均线交易方法","blocks":[],"sections":[{"id":"l17A","title":"第A段　首次回调序列与均线交易方法","blocks":[{"t":"para","text":"L17A 首次回调序列与均线交易方法","pid":"p599"},{"t":"img","src":"assets/img/l17A_295.webp","ilabel":"17-1","icap":"L17　首次回调序列与均线交易方法","fid":"fig295","ctx":[{"t":"L17A 首次回调序列与均线交易方法","p":"p599"},{"t":"随着章节步步推进，自第12单元一降。我们除了站在比较顶层的框架角度谈谈各种建仓方案的风格分属。我们还又再一次顺着市场循环的主轴，从急速一路谈到反转，涵盖了趋势起末的各种不同介入方式。虽然说这一路走来还不至于能让交易者准准把握住每根K线，每个微观突破与反转所带来的利润。但它确实也不是人干的事情，我们无法也不需追求。反倒是说把握住了核心与大方向，并精挑细选地参与到了比较好驾驭的交易机会。这样的任务应该还算是已经满足了。而今天的单元，我们除了做一些案例复习，确保你能够正确地施展先前提过的方案以外。我还会重新陪你检视趋势的起末，做一些观念的延伸阐发。另外，也向你分享一些目前尚未谈及但值得你学习的建仓方案。并提点注意事项，确保你的开平仓知识正确，不会误伤自己。","p":"p600"}]},{"t":"para","text":"随着章节步步推进，自第12单元一降。我们除了站在比较顶层的框架角度谈谈各种建仓方案的风格分属。我们还又再一次顺着市场循环的主轴，从急速一路谈到反转，涵盖了趋势起末的各种不同介入方式。虽然说这一路走来还不至于能让交易者准准把握住每根K线，每个微观突破与反转所带来的利润。但它确实也不是人干的事情，我们无法也不需追求。反倒是说把握住了核心与大方向，并精挑细选地参与到了比较好驾驭的交易机会。这样的任务应该还算是已经满足了。而今天的单元，我们除了做一些案例复习，确保你能够正确地施展先前提过的方案以外。我还会重新陪你检视趋势的起末，做一些观念的延伸阐发。另外，也向你分享一些目前尚未谈及但值得你学习的建仓方案。并提点注意事项，确保你的开平仓知识正确，不会误伤自己。","pid":"p600"},{"t":"img","src":"assets/img/l17A_296.webp","ilabel":"17-2","icap":"L17　首次回调序列与均线交易方法","fid":"fig296","ctx":[{"t":"随着章节步步推进，自第12单元一降。我们除了站在比较顶层的框架角度谈谈各种建仓方案的风格分属。我们还又再一次顺着市场循环的主轴，从急速一路谈到反转，涵盖了趋势起末的各种不同介入方式。虽然说这一路走来还不至于能让交易者准准把握住每根K线，每个微观突破与反转所带来的利润。但它确实也不是人干的事情，我们无法也不需追求。反倒是说把握住了核心与大方向，并精挑细选地参与到了比较好驾驭的交易机会。这样的任务应该还算是已经满足了。而今天的单元，我们除了做一些案例复习，确保你能够正确地施展先前提过的方案以外。我还会重新陪你检视趋势的起末，做一些观念的延伸阐发。另外，也向你分享一些目前尚未谈及但值得你学习的建仓方案。并提点注意事项，确保你的开平仓知识正确，不会误伤自己。","p":"p600"},{"t":"是的，但愿开篇我们先给出一个例子。按顺序陪你复习一遍，目前已经学会运用的武器。首先，亦步亦趋的连续阴线，在紧接着一根意外的强大趋势阴线。目前眼看对前面的小小熊旗下破已经成功，很可能是急速发起的征兆。如果你愿意收线市价入场是可以考虑的。并且可以测算，基于急速实体幅度的等距运动目标。预期利润也蛮远的，会落在这个地方。而后收了一根阳线，但旋即被阴线截断。后面再连续两颗十字星，造就了双内包的ii组合。下破后给到另逆一顺一的入场机会。同样测算AB=CD的等距利润止盈目标将在下方远处。若是更保守看待，则将阴线起点列为A点。但给到稍微近一点的止盈距离。幸好虽然以上的目的地看起来都比较遥远，但整体持仓的过程还算顺利。急速转入的也是窄幅通道脉络，逆势方迟迟没有开始盈利的可能。要知道，保守方案的AB=CD目标抵达，也就是急速与通道的等距走势，以三推的楔形底形式完成之后。才开始出现稍微可观一点的调整。只不过对于多头来说，依然不够勇猛。第一推调整仅持续单一根K线就旋即被阴线截断，还险些完全反转。即使多头交易者盼望回调，至少走出两推，也由于第一推表现得实在太差，而紧接着空头拮抗又太过强劲。就算再有第二推，应该也不怎么值得期待。这样的猜想是正确的。第二推同样没有续航力，立即失去跟进。尽管再有第三段的小推动产生。完成基于第一推的AB=CD运动。价格也依然在空头高潮起点，重叠均线处可能或多或少受到阻抗，于是我们回顾整个脉络通道依然还窄，此处的买压积累不能算是可观。加上也没有对决线作为参考，无论是在方才通道线侧或者现在的趋势线侧，都应当不存在有我的交易机会。不押注反转成立，可能才是明智之举。而随后，我们看到磨磨蹭蹭的K线生成，重新试着突破均线，与前面的回调顶点。却再次收出了吞没阴线。此际，就或许反而给到双重顶的做空机会。交易者应该在趋势阴线收出以前就揣想到这种可能性，并早早部署停止订单，等待下破触发。后面价格下落的比较快，迅速地又测试原趋势极值随之收出阳线。接着再有阴线试图下破新的原趋势极值。却在同时抵达恭候多时的急速实体投映目标之后，旋即失去跟进，又再一次被阳线所拦截。此际，交易者应当如何思考呢？就脉络递嬗而言，显见对于趋势极值的下破已经愈趋疲弱。不再有如急速或窄幅通道那样陡峭的斜率。你必须怀疑趋势有转入宽幅通道的可能性。如果再有失败的极值递进，则甚至应该考虑是否即将进入区间，乃至于启动大型趋势反转。也正是在这里，如果你愿意将这两个黑色端点，判定为对于原趋势极值和对回调极值。也就是灰色标记的突破失败。则四点确立之后的点五或许有高一做多，并持仓到区间中轴的道理。入场后最终也触及了止盈。目前上涨的高点已显示出对方才刺激波段点兼为区间上缘的测试气度。那你也许问，刚刚这一连串斜率减缓的下跌至此，是否已经充分地展示卖压衰弱？给到反转的波段交易者以大型的三推楔形底介入的理由呢？这个问题确实引人深思。正是在这种通道渐次拓宽的状态之下，交易者可能产生不同的判断。只不过如果按照前面单元的做法来解释，图表上由于无法见得供我们背靠的重要磁体。我们就暂时不考虑以此入场。除非你的风格激进一些，觉得不背靠也无所谓，或者基于急速实体的等距投影目标，对你来说已经足够强力。那或许可以一试。见仁见智，就凭你的风格来决策了。但总之，价格在这里是没有能够再去到更高的地方。虽然又挑战了一个放缓的趋势线，但未能有强力地跟进。于是就在这样一个宽幅通道，近几区间的脉络里头，再有一段连续下跌，逼近原趋势极值。如果你看中这段下跌的流畅，因为至少测试到这个刺激波段点会是高几率事件。那么，在一个斜率倾斜向下的宽幅通道里，以急赴磁铁逻辑短短的剥一单，我想是没有任何问题的。确定下跌起点到终点的距离只剩下四分之一之后。市价入场与收线时最终得以迅速地获利离场。此后，我们看见的是价格动能稍有减缓，重新测试了原趋势极值，但又被阳线所拒绝。最后，价格缓缓上行，演变为馋食鲸吞的无尽回调。最终回归了急速结束之后的通道起点。即使你是两倍时间级别图表上面的交易者，所见到的脉络转换也会是同样的。右边盖上遮罩的是前一张图表，没有显示的后面部分。但前方同样是急速窄幅通道，宽幅通道到区间上破，反转回到通道起点的过程。即使没有提供背靠重要波段点的反转交易机会。但确实，急速与短距通道处处可见。刚一趟下来，我们已经施展了不少照顾的建仓方案。希望你在刚刚听我讲解的过程中，其实都有紧跟着同步思考，揣摩在脑海中运用上这些做法。","p":"p601"}]},{"t":"para","text":"是的，但愿开篇我们先给出一个例子。按顺序陪你复习一遍，目前已经学会运用的武器。首先，亦步亦趋的连续阴线，在紧接着一根意外的强大趋势阴线。目前眼看对前面的小小熊旗下破已经成功，很可能是急速发起的征兆。如果你愿意收线市价入场是可以考虑的。并且可以测算，基于急速实体幅度的等距运动目标。预期利润也蛮远的，会落在这个地方。而后收了一根阳线，但旋即被阴线截断。后面再连续两颗十字星，造就了双内包的ii组合。下破后给到另逆一顺一的入场机会。同样测算AB=CD的等距利润止盈目标将在下方远处。若是更保守看待，则将阴线起点列为A点。但给到稍微近一点的止盈距离。幸好虽然以上的目的地看起来都比较遥远，但整体持仓的过程还算顺利。急速转入的也是窄幅通道脉络，逆势方迟迟没有开始盈利的可能。要知道，保守方案的AB=CD目标抵达，也就是急速与通道的等距走势，以三推的楔形底形式完成之后。才开始出现稍微可观一点的调整。只不过对于多头来说，依然不够勇猛。第一推调整仅持续单一根K线就旋即被阴线截断，还险些完全反转。即使多头交易者盼望回调，至少走出两推，也由于第一推表现得实在太差，而紧接着空头拮抗又太过强劲。就算再有第二推，应该也不怎么值得期待。这样的猜想是正确的。第二推同样没有续航力，立即失去跟进。尽管再有第三段的小推动产生。完成基于第一推的AB=CD运动。价格也依然在空头高潮起点，重叠均线处可能或多或少受到阻抗，于是我们回顾整个脉络通道依然还窄，此处的买压积累不能算是可观。加上也没有对决线作为参考，无论是在方才通道线侧或者现在的趋势线侧，都应当不存在有我的交易机会。不押注反转成立，可能才是明智之举。而随后，我们看到磨磨蹭蹭的K线生成，重新试着突破均线，与前面的回调顶点。却再次收出了吞没阴线。此际，就或许反而给到双重顶的做空机会。交易者应该在趋势阴线收出以前就揣想到这种可能性，并早早部署停止订单，等待下破触发。后面价格下落的比较快，迅速地又测试原趋势极值随之收出阳线。接着再有阴线试图下破新的原趋势极值。却在同时抵达恭候多时的急速实体投映目标之后，旋即失去跟进，又再一次被阳线所拦截。此际，交易者应当如何思考呢？就脉络递嬗而言，显见对于趋势极值的下破已经愈趋疲弱。不再有如急速或窄幅通道那样陡峭的斜率。你必须怀疑趋势有转入宽幅通道的可能性。如果再有失败的极值递进，则甚至应该考虑是否即将进入区间，乃至于启动大型趋势反转。也正是在这里，如果你愿意将这两个黑色端点，判定为对于原趋势极值和对回调极值。也就是灰色标记的突破失败。则四点确立之后的点五或许有高一做多，并持仓到区间中轴的道理。入场后最终也触及了止盈。目前上涨的高点已显示出对方才刺激波段点兼为区间上缘的测试气度。那你也许问，刚刚这一连串斜率减缓的下跌至此，是否已经充分地展示卖压衰弱？给到反转的波段交易者以大型的三推楔形底介入的理由呢？这个问题确实引人深思。正是在这种通道渐次拓宽的状态之下，交易者可能产生不同的判断。只不过如果按照前面单元的做法来解释，图表上由于无法见得供我们背靠的重要磁体。我们就暂时不考虑以此入场。除非你的风格激进一些，觉得不背靠也无所谓，或者基于急速实体的等距投影目标，对你来说已经足够强力。那或许可以一试。见仁见智，就凭你的风格来决策了。但总之，价格在这里是没有能够再去到更高的地方。虽然又挑战了一个放缓的趋势线，但未能有强力地跟进。于是就在这样一个宽幅通道，近几区间的脉络里头，再有一段连续下跌，逼近原趋势极值。如果你看中这段下跌的流畅，因为至少测试到这个刺激波段点会是高几率事件。那么，在一个斜率倾斜向下的宽幅通道里，以急赴磁铁逻辑短短的剥一单，我想是没有任何问题的。确定下跌起点到终点的距离只剩下四分之一之后。市价入场与收线时最终得以迅速地获利离场。此后，我们看见的是价格动能稍有减缓，重新测试了原趋势极值，但又被阳线所拒绝。最后，价格缓缓上行，演变为馋食鲸吞的无尽回调。最终回归了急速结束之后的通道起点。即使你是两倍时间级别图表上面的交易者，所见到的脉络转换也会是同样的。右边盖上遮罩的是前一张图表，没有显示的后面部分。但前方同样是急速窄幅通道，宽幅通道到区间上破，反转回到通道起点的过程。即使没有提供背靠重要波段点的反转交易机会。但确实，急速与短距通道处处可见。刚一趟下来，我们已经施展了不少照顾的建仓方案。希望你在刚刚听我讲解的过程中，其实都有紧跟着同步思考，揣摩在脑海中运用上这些做法。","pid":"p601"},{"t":"img","src":"assets/img/l17A_297.webp","ilabel":"17-3","icap":"L17　首次回调序列与均线交易方法","fid":"fig297","ctx":[{"t":"是的，但愿开篇我们先给出一个例子。按顺序陪你复习一遍，目前已经学会运用的武器。首先，亦步亦趋的连续阴线，在紧接着一根意外的强大趋势阴线。目前眼看对前面的小小熊旗下破已经成功，很可能是急速发起的征兆。如果你愿意收线市价入场是可以考虑的。并且可以测算，基于急速实体幅度的等距运动目标。预期利润也蛮远的，会落在这个地方。而后收了一根阳线，但旋即被阴线截断。后面再连续两颗十字星，造就了双内包的ii组合。下破后给到另逆一顺一的入场机会。同样测算AB=CD的等距利润止盈目标将在下方远处。若是更保守看待，则将阴线起点列为A点。但给到稍微近一点的止盈距离。幸好虽然以上的目的地看起来都比较遥远，但整体持仓的过程还算顺利。急速转入的也是窄幅通道脉络，逆势方迟迟没有开始盈利的可能。要知道，保守方案的AB=CD目标抵达，也就是急速与通道的等距走势，以三推的楔形底形式完成之后。才开始出现稍微可观一点的调整。只不过对于多头来说，依然不够勇猛。第一推调整仅持续单一根K线就旋即被阴线截断，还险些完全反转。即使多头交易者盼望回调，至少走出两推，也由于第一推表现得实在太差，而紧接着空头拮抗又太过强劲。就算再有第二推，应该也不怎么值得期待。这样的猜想是正确的。第二推同样没有续航力，立即失去跟进。尽管再有第三段的小推动产生。完成基于第一推的AB=CD运动。价格也依然在空头高潮起点，重叠均线处可能或多或少受到阻抗，于是我们回顾整个脉络通道依然还窄，此处的买压积累不能算是可观。加上也没有对决线作为参考，无论是在方才通道线侧或者现在的趋势线侧，都应当不存在有我的交易机会。不押注反转成立，可能才是明智之举。而随后，我们看到磨磨蹭蹭的K线生成，重新试着突破均线，与前面的回调顶点。却再次收出了吞没阴线。此际，就或许反而给到双重顶的做空机会。交易者应该在趋势阴线收出以前就揣想到这种可能性，并早早部署停止订单，等待下破触发。后面价格下落的比较快，迅速地又测试原趋势极值随之收出阳线。接着再有阴线试图下破新的原趋势极值。却在同时抵达恭候多时的急速实体投映目标之后，旋即失去跟进，又再一次被阳线所拦截。此际，交易者应当如何思考呢？就脉络递嬗而言，显见对于趋势极值的下破已经愈趋疲弱。不再有如急速或窄幅通道那样陡峭的斜率。你必须怀疑趋势有转入宽幅通道的可能性。如果再有失败的极值递进，则甚至应该考虑是否即将进入区间，乃至于启动大型趋势反转。也正是在这里，如果你愿意将这两个黑色端点，判定为对于原趋势极值和对回调极值。也就是灰色标记的突破失败。则四点确立之后的点五或许有高一做多，并持仓到区间中轴的道理。入场后最终也触及了止盈。目前上涨的高点已显示出对方才刺激波段点兼为区间上缘的测试气度。那你也许问，刚刚这一连串斜率减缓的下跌至此，是否已经充分地展示卖压衰弱？给到反转的波段交易者以大型的三推楔形底介入的理由呢？这个问题确实引人深思。正是在这种通道渐次拓宽的状态之下，交易者可能产生不同的判断。只不过如果按照前面单元的做法来解释，图表上由于无法见得供我们背靠的重要磁体。我们就暂时不考虑以此入场。除非你的风格激进一些，觉得不背靠也无所谓，或者基于急速实体的等距投影目标，对你来说已经足够强力。那或许可以一试。见仁见智，就凭你的风格来决策了。但总之，价格在这里是没有能够再去到更高的地方。虽然又挑战了一个放缓的趋势线，但未能有强力地跟进。于是就在这样一个宽幅通道，近几区间的脉络里头，再有一段连续下跌，逼近原趋势极值。如果你看中这段下跌的流畅，因为至少测试到这个刺激波段点会是高几率事件。那么，在一个斜率倾斜向下的宽幅通道里，以急赴磁铁逻辑短短的剥一单，我想是没有任何问题的。确定下跌起点到终点的距离只剩下四分之一之后。市价入场与收线时最终得以迅速地获利离场。此后，我们看见的是价格动能稍有减缓，重新测试了原趋势极值，但又被阳线所拒绝。最后，价格缓缓上行，演变为馋食鲸吞的无尽回调。最终回归了急速结束之后的通道起点。即使你是两倍时间级别图表上面的交易者，所见到的脉络转换也会是同样的。右边盖上遮罩的是前一张图表，没有显示的后面部分。但前方同样是急速窄幅通道，宽幅通道到区间上破，反转回到通道起点的过程。即使没有提供背靠重要波段点的反转交易机会。但确实，急速与短距通道处处可见。刚一趟下来，我们已经施展了不少照顾的建仓方案。希望你在刚刚听我讲解的过程中，其实都有紧跟着同步思考，揣摩在脑海中运用上这些做法。","p":"p601"},{"t":"通过以上案例，我想进一步向你阐述的概念是什么呢？题目是首次回调序列。或许在讨论课的过程里面，你已经听我提过一次，但即使未曾听闻，如今我们也可以趁机重新说清楚。你可以想象，就如我们曾经多次提到的那样一轮趋势的发起到结束，必定是顺势方越来越无力。逆势方越来越进取的过程。呈现在K线的样态上，就是反向压力越来越积累，颜色反向的收线越来越多，而突破一次比一次弱，回调一次比一次深。此际回调一次比一次深，一次比一次严峻的这一点很值得我们展开来大做文章。我们也没有办法为回调进行分级排序，从无伤大雅排到值得注意以及不可忽视。最终则是反转或将成立。并且在观察一段趋势的运行时，逐项查核，借此知道在哪个阶段作为顺势交易者的我们。还可以继续安然持仓，而到哪个阶段又应该赶紧获利了结，甚至加入逆势方呢？当然，答案是肯定的。在阿尔布鲁克斯的著作里，他就论结这种思路。","p":"p602"}]},{"t":"para","text":"通过以上案例，我想进一步向你阐述的概念是什么呢？题目是首次回调序列。或许在讨论课的过程里面，你已经听我提过一次，但即使未曾听闻，如今我们也可以趁机重新说清楚。你可以想象，就如我们曾经多次提到的那样一轮趋势的发起到结束，必定是顺势方越来越无力。逆势方越来越进取的过程。呈现在K线的样态上，就是反向压力越来越积累，颜色反向的收线越来越多，而突破一次比一次弱，回调一次比一次深。此际回调一次比一次深，一次比一次严峻的这一点很值得我们展开来大做文章。我们也没有办法为回调进行分级排序，从无伤大雅排到值得注意以及不可忽视。最终则是反转或将成立。并且在观察一段趋势的运行时，逐项查核，借此知道在哪个阶段作为顺势交易者的我们。还可以继续安然持仓，而到哪个阶段又应该赶紧获利了结，甚至加入逆势方呢？当然，答案是肯定的。在阿尔布鲁克斯的著作里，他就论结这种思路。","pid":"p602"},{"t":"img","src":"assets/img/l17A_298.webp","ilabel":"17-4","icap":"L17　首次回调序列与均线交易方法","fid":"fig298","ctx":[{"t":"通过以上案例，我想进一步向你阐述的概念是什么呢？题目是首次回调序列。或许在讨论课的过程里面，你已经听我提过一次，但即使未曾听闻，如今我们也可以趁机重新说清楚。你可以想象，就如我们曾经多次提到的那样一轮趋势的发起到结束，必定是顺势方越来越无力。逆势方越来越进取的过程。呈现在K线的样态上，就是反向压力越来越积累，颜色反向的收线越来越多，而突破一次比一次弱，回调一次比一次深。此际回调一次比一次深，一次比一次严峻的这一点很值得我们展开来大做文章。我们也没有办法为回调进行分级排序，从无伤大雅排到值得注意以及不可忽视。最终则是反转或将成立。并且在观察一段趋势的运行时，逐项查核，借此知道在哪个阶段作为顺势交易者的我们。还可以继续安然持仓，而到哪个阶段又应该赶紧获利了结，甚至加入逆势方呢？当然，答案是肯定的。在阿尔布鲁克斯的著作里，他就论结这种思路。","p":"p602"},{"t":"我们知道趋势中会出现多种类型严峻程度不一的回调。起初的回调又弱又减，将成为引发趋势恢复的旗型，是为小型趋势反转。只有到了末期，回调变得又强又深，才终有一次回调演变为末端旗型，造就大型趋势反转。在这一趟进程之中，我们可以将任何类型回调的第一次发生都称其为该类型回调的首次回调。比如上升趋势中，第一次出现双重底，我们可以称其为首次双重底回调。可该双重底突破之后，运行一段时间又出现另一个双重底回调，则其为二次双重底回调。再接着，当出现一个楔形底回调，我们则称其为首次楔形底回调，以此类推。同时，我们不忘方才进行强度排序的逻辑。我们可以将对顺时方而言越严峻的回调类型排在越靠后。逐级解释下来就可以排出所谓的首次回调序列。而实用价值就在于，越是检核到序列的后面，大型趋势反转就越可能启动。否则，只要趋势还强劲，任何首次的回调，都是首次以这种方式进行的反转尝试。而重点来了，你知道的反转尝试倾向失败。既然失败，那原趋势极值就尽将被测试。直到原趋势极值处多空才重新竞合，分出高下。决定出往后是该延续趋势还是反转趋势的共识。","p":"p603"}]},{"t":"para","text":"我们知道趋势中会出现多种类型严峻程度不一的回调。起初的回调又弱又减，将成为引发趋势恢复的旗型，是为小型趋势反转。只有到了末期，回调变得又强又深，才终有一次回调演变为末端旗型，造就大型趋势反转。在这一趟进程之中，我们可以将任何类型回调的第一次发生都称其为该类型回调的首次回调。比如上升趋势中，第一次出现双重底，我们可以称其为首次双重底回调。可该双重底突破之后，运行一段时间又出现另一个双重底回调，则其为二次双重底回调。再接着，当出现一个楔形底回调，我们则称其为首次楔形底回调，以此类推。同时，我们不忘方才进行强度排序的逻辑。我们可以将对顺时方而言越严峻的回调类型排在越靠后。逐级解释下来就可以排出所谓的首次回调序列。而实用价值就在于，越是检核到序列的后面，大型趋势反转就越可能启动。否则，只要趋势还强劲，任何首次的回调，都是首次以这种方式进行的反转尝试。而重点来了，你知道的反转尝试倾向失败。既然失败，那原趋势极值就尽将被测试。直到原趋势极值处多空才重新竞合，分出高下。决定出往后是该延续趋势还是反转趋势的共识。","pid":"p603"},{"t":"img","src":"assets/img/l17A_299.webp","ilabel":"17-5","icap":"L17　首次回调序列与均线交易方法","fid":"fig299","ctx":[{"t":"我们知道趋势中会出现多种类型严峻程度不一的回调。起初的回调又弱又减，将成为引发趋势恢复的旗型，是为小型趋势反转。只有到了末期，回调变得又强又深，才终有一次回调演变为末端旗型，造就大型趋势反转。在这一趟进程之中，我们可以将任何类型回调的第一次发生都称其为该类型回调的首次回调。比如上升趋势中，第一次出现双重底，我们可以称其为首次双重底回调。可该双重底突破之后，运行一段时间又出现另一个双重底回调，则其为二次双重底回调。再接着，当出现一个楔形底回调，我们则称其为首次楔形底回调，以此类推。同时，我们不忘方才进行强度排序的逻辑。我们可以将对顺时方而言越严峻的回调类型排在越靠后。逐级解释下来就可以排出所谓的首次回调序列。而实用价值就在于，越是检核到序列的后面，大型趋势反转就越可能启动。否则，只要趋势还强劲，任何首次的回调，都是首次以这种方式进行的反转尝试。而重点来了，你知道的反转尝试倾向失败。既然失败，那原趋势极值就尽将被测试。直到原趋势极值处多空才重新竞合，分出高下。决定出往后是该延续趋势还是反转趋势的共识。","p":"p603"},{"t":"觉得抽象吗？我们回到刚才这个例子吧，这样就可以紧贴着实例来为你说明首次回调序列。买压的强化，是如何呈现在一轮趋势中的？如果我们细究K线呈现出的细致资讯。你会发现这是下跌以来的第一根阳线。这代表空头原本可以连续载制行情，使每一根K线都被证实对顺势方有利。但在这里是他们第一次输掉一个回合，让图表上留下了绿色的痕迹。想让自己是一名文献学者，一位历史学学徒。面对这样的图像史料，你会如何转译与记载呢？或许你可以这样描述。这是首次出现具有实体的阳线，买压第一次显现。接着，对于空头的顺势交易者来说，稍稍更值得担忧的现象又紧接着出现。这是第一次由K线的高点遭到抬升，此即高一。也代表在更微观的时间级别上，这两根K线可能呈现为一个非常局部的上升趋势，其中高低点不断递进。听起来有点吓人，对吧？空头好像又稍稍更弱了一点。才让逆势的多头能够逐级夺取优势，解开成就。但还好，你也别太担心。我们知道，首次回调倾向失败，原趋势极值倾向被测试。这更可能是顺势突破。所以我们先耐着性子，逐步把序列顺过，再来谈谈哪时可能是大型趋势反转。可能酝酿到足以成立的转折点。随后你还可以看见，在原趋势极值遭到有效下破以前陆续发生的高二以及高三的事件。好不容易下破后又跟进，但也出现了前所未有的大阳线。接着是第一次由阳线实体收线在均线之外。尔后还有第一次的整根K线受到均线对侧。也正是同时显著的大型平缓趋势线遭到刺透。最后一段下跌产生以后，阳线数量开始明显多过阴线。价格重返均线之下尝试失败一次两次。后续头也不回。如今，你在画面上看我陈列出的事件，以及刚刚口头带过的几个重点特征，就是这档趋势中的每个首次回调。","p":"p604"}]},{"t":"para","text":"觉得抽象吗？我们回到刚才这个例子吧，这样就可以紧贴着实例来为你说明首次回调序列。买压的强化，是如何呈现在一轮趋势中的？如果我们细究K线呈现出的细致资讯。你会发现这是下跌以来的第一根阳线。这代表空头原本可以连续载制行情，使每一根K线都被证实对顺势方有利。但在这里是他们第一次输掉一个回合，让图表上留下了绿色的痕迹。想让自己是一名文献学者，一位历史学学徒。面对这样的图像史料，你会 如我，当然也为了更实用起见，替你整理了简洁实用的版本。","pid":"p605"},{"t":"img","src":"assets/img/l17A_301.webp","ilabel":"17-7","icap":"L17　首次回调序列与均线交易方法","fid":"fig301","ctx":[{"t":"他们在第一次出现时，都未能立即反转行情。而是引导出对于原趋势极值的测试。但比如首次有K线收在均线上侧，或许还能够挡下反转。但第二次以后可能就没有办法了，接着就是节节败退。至此，你应该能够把前述抽象的首次回调序列概念，具体的理解到了。透过爬梳这个序列，我们可以检核一轮趋势的强度，并逐步得知是否已经接近运行的周末。诶，对耶，你说的序列好像挺好用。那太妃，阿尔布鲁克斯有没有为我们整理出序列的理想内容，好让我以后可以印出来贴在墙上。将来靠逐笔点名来发家致富。发家致富，你是别想，简单的圣杯，当然并不存在。我提出这项知识是希望你掌握原理，而非刻舟求剑。不过，阿尔布鲁克斯确实有在书中将序列列出值得你参考。而贴心如我，当然也为了更实用起见，替你整理了简洁实用的版本。","p":"p605"},{"t":"接着我们就来搭配另一个例子，将以下事件的发生一一顺过。显而易见的，这里提供的是一个上升趋势的版本。备课期间，我试图要找到完全符合序列的例子，但基本上是踏破铁鞋都没有找到。所以等等讲解的过程中，有些次序可能要将就一下，也请各位见谅。不过无论如何，一轮理想趋势中顺势方，动能衰退的迹象应该大致如此，逐一显现。起初，在突破发起急速成立之后，K线实体应该是很强劲，而影线短小的。正在把空头几乎全然放弃，而多头则全面占据了优势，这是失衡最为严重的时候。不过，就如我们所知道的，随着价格向上推进而远离失衡起源。难免会有一些顺势交易者开始止盈。因此，在第二点，你可以看见实体有逐渐变短或至少上影线，有陆续加长的迹象。譬如第三点所示K线与K线之间重叠的部分变多，则代表在更小时间级别图表上面出现了更多更深的回调。接着会如何呢？当然是K线之间的重叠程度越趋严重。而开始出现多空平手的十字星。紧接着再出现具有阴线实体的反射K线。让趋势发展到这里，价格当然是越来越远离失衡极点。但一路都是多头对行情的连续载制，对吧？于此处，终于有一个五分钟是空胜过的多，截断了阳线的连胜记录。此间你还可能同时观察到第六与第七点所描述的现象。也就是开始有K线的高点降低，表征着微观级别，上面较大且较久规模的回调产生。并深知道了某个时间点，我们所处的时间级别上面开始成立回调K线。空头首次遏制的微观的连续低点抬升。后续的八九十点，我们必须用上第十一单元提及的数推以及数K线知识，并在两者可以自由转换的前提之下。感受逆势方的步步进取。还记得吗？我们说过推动可以拆分，一大推还可以拆分为内含的几小推。仔细计较的话，在这些地方都曾经出现过高一。K线高点连续降低的时间都非常短暂。这基本代表微观的多空竞合之中，多头都只需要一两根K线的时间就能够夺回掌权。而上方则还有另一次的高一垂直K线低点，连续降低许久之后才终于眼见多头尝试上破。你可以说在这样的序列里，这正是第八点试图描述的现象。我们将K线高点的连续下降后又抬升，耗时7根K线的时间，视为一推，在此处提供了高一的可能入场理由。而后我们又马上察觉到，对于原趋势极值的突破是过冲后失败。又接着出现连续的阴线推动。在起平的第一推低点处，终于获得支撑以后，则又给到了高二的可能入场理由。此处二推回调，此处的高二你一定不会忘记，就完全等效于所谓的双重底。也只是透过此例，你能够再次尝试，熟认两种表达方式之间的互通与转换。第十点呢。说高三，严格数来，会发生在这里。后面的情况未明以前这里可能确实有一个第三推短小的头肩底可能性。这属于楔形底的变体之一。可当后续行情走出来，要将楔形底定义为对前一推极值过冲之后才算数。那么，这里会有出现后高一。在更大时间级别图表上，显现为高三的事件发生。总之，就如你在旗型回调交易方法的单元里所知道的那样，回调耗时更久。构成更多推动,才恢复趋势，可以被视作是对于趋势健康程度的信心缺失。也正是因为如此，如果都出现了楔形底，我们也就来到了第十点。这已经是序列中相对靠后的位置了。另外，第11到13点其实也悄然发生在方才楔形底成立的过程之中。倘若仔细回顾，我们将发现这种趋势非常强劲。常见到有连续20根以上的K线，都远远乖离均线。直到第25根价格才又终于归附均线，并旋即成立了刚才提过的高二做多建仓形态。也就是双重底牛旗的入口。而这两根K线有趣的地方就在于，前者触碰的均线虽然是阴线，但收线位于均线之上。后者毅然甚至表征着空头，立即失去动能。可以想见，使均线作为磁体，此处的反向订单将价格向上托起。往后的许多根K线收盘价都是位于均线之上的。但直到我所标记出的这一根，其阴线实体，裸落在均线对侧。而不久后的另一根阴线，则是做实第13点的描述，整根K线都完全位于均线之下。也就是在这个时候，序列的尾端已经近在咫尺。作为空头的重要里程碑，这是价格第一次被空头如此宰制，以至于全然越过了均线。且多头无力，在收线以前将其收回。随后，我们也就进到了最后一个项目脉络转入势均力敌的区间，我们又重新回归均衡之所在。很有趣吧，短短几项描述将趋势发起到回归平静的过程，描述得简明有力。也正是在此时，你应该再次理解到，多空竞合看似抽象，但远非只能是视觉主观经验。一位精湛杰出的交易者，应该要有能力用扼要的语言描述多数人谓之盘感，谓之“交易久了你就知道”的种种溢于言表，你要这样子期许自己。虽然说图表千变万化，序列并不一定逐条开展。有时会重叠或者跳过某些项目，甚至顺序错落。但是这仍然是可以白纸黑字写下来的。且有望模式化，作为你将来阅读图表的参照基准。","p":"p606"}]},{"t":"para","text":"接着我们就来搭配另一个例子，将以下事件的发生一一顺过。显而易见的，这里提供的是一个上升趋势的版本。备课期间，我试图要找到完全符合序列的例子，但基本上是踏破铁鞋都没有找到。所以等等讲解的过程中，有些次序可能要将就一下，也请各位见谅。不过无论如何，一轮理想趋势中顺势方，动能衰退的迹象应该大致如此，逐一显现。起初，在突破发起急速成立之后，K线实体应该是很强劲，而影线短小的。正在把空头几乎全然放弃，而多头则全面占据了优势，这是失衡最为严重的时候。不过，就如我们所知道的，随着价格向上推进而远离失衡起源。难免会有一些顺势交易者开始止盈。因此，在第二点，你可以看见实体有逐渐变短或至少上影线，有陆续加长的迹象。譬如第三点所示K线与K线之间重叠的部分变多，则代表在更小时间级别图表上面出现了更多更深的回调。接着会如何呢？当然是K线之间的重叠程度越趋严重。而开始出现多空平手的十字星。紧接着再出现具有阴线实体的反射K线。让趋势发展到这里，价格当然是越来越远离失衡极点。但一路都是多头对行情的连续载制，对吧？于此处，终于有一个五分钟是空胜过的多，截断了阳线的连胜记录。此间你还可能同时观察到第六与第七点所描述的现象。也就是开始有K线的高点降低，表征着微观级别，上面较大且较久规模的回调产生。并深知道了某个时间点，我们所处的时间级别上面开始成立回调K线。空头首次遏制的微观的连续低点抬升。后续的八九十点，我们必须用上第十一单元提及的数推以及数K线知识，并在两者可以自由转换的前提之下。感受逆势方的步步进取。还记得吗？我们说过推动可以拆分，一大推还可以拆分为内含的几小推。仔细计较的话，在这些地方都曾经出现过高一。K线高点连续降低的时间都非常短暂。这基本代表微观的多空竞合之中，多头都只需要一两根K线的时间就能够夺回掌权。而上方则还有另一次的高一垂直K线低点，连续降低许久之后才终于眼见多头尝试上破。你可以说在这样的序列里，这正是第八点试图描述的现象。我们将K线高点的连续下降后又抬升，耗时7根K线的时间，视为一推，在此处提供了高一的可能入场理由。而后我们又马上察觉到，对于原趋势极值的突破是过冲后失败。又接着出现连续的阴线推动。在起平的第一推低点处，终于获得支撑以后，则又给到了高二的可能入场理由。此处二推回调，此处的高二你一定不会忘记，就完全等效于所谓的双重底。也只是透过此例，你能够再次尝试，熟认两种表达方式之间的互通与转换。第十点呢。说高三，严格数来，会发生在这里。后面的情况未明以前这里可能确实有一个第三推短小的头肩底可能性。这属于楔形底的变体之一。可当后续行情走出来，要将楔形底定义为对前一推极值过冲之后才算数。那么，这里会有出现后高一。在更大时间级别图表上，显现为高三的事件发生。总之，就如你在旗型回调交易方法的单元里所知道的那样，回调耗时更久。构成更多推动,才恢复趋势，可以被视作是对于趋势健康程度的信心缺失。也正是因为如此，如果都出现了楔形底，我们也就来到了第十点。这已经是序列中相对靠后的位置了。另外，第11到13点其实也悄然发生在方才楔形底成立的过程之中。倘若仔细回顾，我们将发现这种趋势非常强劲。常见到有连续20根以上的K线，都远远乖离均线。直到第25根价格才又终于归附均线，并旋即成立了刚才提过的高二做多建仓形态。也就是双重底牛旗的入口。而这两根K线有趣的地方就在于，前者触碰的均线虽然是阴线，但收线位于均线之上。后者毅然甚至表征着空头，立即失去动能。可以想见，使均线作为磁体，此处的反向订单将价格向上托起。往后的许多根K线收盘价都是位于均线之上的。但直到我所标记出的这一根，其阴线实体，裸落在均线对侧。而不久后的另一根阴线，则是做实第13点的描述，整根K线都完全位于均线之下。也就是在这个时候，序列的尾端已经近在咫尺。作为空头的重要里程碑，这是价格第一次被空头如此宰制，以至于全然越过了均线。且多头无力，在收线以前将其收回。随后，我们也就进到了最后一个项目脉络转入势均力敌的区间，我们又重新回归均衡之所在。很有趣吧，短短几项描述将趋势发起到回归平静的过程，描述得简明有力。也正是在此时，你应该再次理解到，多空竞合看似抽象，但远非只能是视觉主观经验。一位精湛杰出的交易者，应该要有能力用扼要的语言描述多数人谓之盘感，谓之“交易久了你就知道”的种种溢于言表，你要这样子期许自己。虽然说图表千变万化，序列并不一定逐条开展。有时会重叠或者跳过某些项目，甚至顺序错落。但是这仍然是可以白纸黑字写下来的。且有望模式化，作为你将来阅读图表的参照基准。","pid":"p606"},{"t":"img","src":"assets/img/l17A_302.webp","ilabel":"17-8","icap":"L17　首次回调序列与均线交易方法","fid":"fig302","ctx":[{"t":"接着我们就来搭配另一个例子，将以下事件的发生一一顺过。显而易见的，这里提供的是一个上升趋势的版本。备课期间，我试图要找到完全符合序列的例子，但基本上是踏破铁鞋都没有找到。所以等等讲解的过程中，有些次序可能要将就一下，也请各位见谅。不过无论如何，一轮理想趋势中顺势方，动能衰退的迹象应该大致如此，逐一显现。起初，在突破发起急速成立之后，K线实体应该是很强劲，而影线短小的。正在把空头几乎全然放弃，而多头则全面占据了优势，这是失衡最为严重的时候。不过，就如我们所知道的，随着价格向上推进而远离失衡起源。难免会有一些顺势交易者开始止盈。因此，在第二点，你可以看见实体有逐渐变短或至少上影线，有陆续加长的迹象。譬如第三点所示K线与K线之间重叠的部分变多，则代表在更小时间级别图表上面出现了更多更深的回调。接着会如何呢？当然是K线之间的重叠程度越趋严重。而开始出现多空平手的十字星。紧接着再出现具有阴线实体的反射K线。让趋势发展到这里，价格当然是越来越远离失衡极点。但一路都是多头对行情的连续载制，对吧？于此处，终于有一个五分钟是空胜过的多，截断了阳线的连胜记录。此间你还可能同时观察到第六与第七点所描述的现象。也就是开始有K线的高点降低，表征着微观级别，上面较大且较久规模的回调产生。并深知道了某个时间点，我们所处的时间级别上面开始成立回调K线。空头首次遏制的微观的连续低点抬升。后续的八九十点，我们必须用上第十一单元提及的数推以及数K线知识，并在两者可以自由转换的前提之下。感受逆势方的步步进取。还记得吗？我们说过推动可以拆分，一大推还可以拆分为内含的几小推。仔细计较的话，在这些地方都曾经出现过高一。K线高点连续降低的时间都非常短暂。这基本代表微观的多空竞合之中，多头都只需要一两根K线的时间就能够夺回掌权。而上方则还有另一次的高一垂直K线低点，连续降低许久之后才终于眼见多头尝试上破。你可以说在这样的序列里，这正是第八点试图描述的现象。我们将K线高点的连续下降后又抬升，耗时7根K线的时间，视为一推，在此处提供了高一的可能入场理由。而后我们又马上察觉到，对于原趋势极值的突破是过冲后失败。又接着出现连续的阴线推动。在起平的第一推低点处，终于获得支撑以后，则又给到了高二的可能入场理由。此处二推回调，此处的高二你一定不会忘记，就完全等效于所谓的双重底。也只是透过此例，你能够再次尝试，熟认两种表达方式之间的互通与转换。第十点呢。说高三，严格数来，会发生在这里。后面的情况未明以前这里可能确实有一个第三推短小的头肩底可能性。这属于楔形底的变体之一。可当后续行情走出来，要将楔形底定义为对前一推极值过冲之后才算数。那么，这里会有出现后高一。在更大时间级别图表上，显现为高三的事件发生。总之，就如你在旗型回调交易方法的单元里所知道的那样，回调耗时更久。构成更多推动,才恢复趋势，可以被视作是对于趋势健康程度的信心缺失。也正是因为如此，如果都出现了楔形底，我们也就来到了第十点。这已经是序列中相对靠后的位置了。另外，第11到13点其实也悄然发生在方才楔形底成立的过程之中。倘若仔细回顾，我们将发现这种趋势非常强劲。常见到有连续20根以上的K线，都远远乖离均线。直到第25根价格才又终于归附均线，并旋即成立了刚才提过的高二做多建仓形态。也就是双重底牛旗的入口。而这两根K线有趣的地方就在于，前者触碰的均线虽然是阴线，但收线位于均线之上。后者毅然甚至表征着空头，立即失去动能。可以想见，使均线作为磁体，此处的反向订单将价格向上托起。往后的许多根K线收盘价都是位于均线之上的。但直到我所标记出的这一根，其阴线实体，裸落在均线对侧。而不久后的另一根阴线，则是做实第13点的描述，整根K线都完全位于均线之下。也就是在这个时候，序列的尾端已经近在咫尺。作为空头的重要里程碑，这是价格第一次被空头如此宰制，以至于全然越过了均线。且多头无力，在收线以前将其收回。随后，我们也就进到了最后一个项目脉络转入势均力敌的区间，我们又重新回归均衡之所在。很有趣吧，短短几项描述将趋势发起到回归平静的过程，描述得简明有力。也正是在此时，你应该再次理解到，多空竞合看似抽象，但远非只能是视觉主观经验。一位精湛杰出的交易者，应该要有能力用扼要的语言描述多数人谓之盘感，谓之“交易久了你就知道”的种种溢于言表，你要这样子期许自己。虽然说图表千变万化，序列并不一定逐条开展。有时会重叠或者跳过某些项目，甚至顺序错落。但是这仍然是可以白纸黑字写下来的。且有望模式化，作为你将来阅读图表的参照基准。","p":"p606"},{"t":"回到下一个节次，我将延伸讨论第11到13点的内容。再额外与你分享两种关于均线的建仓方案。使你更得以完整把握，或者说使你更得以在趋势的强弩之末，效率的榨干，最后一点盈利的可能。","p":"p607"}]},{"t":"para","text":"回到下一个节次，我将延伸讨论第11到13点的内容。再额外与你分享两种关于均线的建仓方案。使你更得以完整把握，或者说使你更得以在趋势的强弩之末，效率的榨干，最后一点盈利的可能。","pid":"p607"}],"wcount":5981},{"id":"l17B","title":"第B段　首次回调序列与均线交易方法","blocks":[{"t":"para","text":"L17B 首次回调序列与均线交易方法","pid":"p608"},{"t":"para","text":"这一节次我们要介绍建仓方案，分别被称作“20均线缺口”以及“第一均线缺口”。","pid":"p609"},{"t":"img","src":"assets/img/l17B_303.webp","ilabel":"17-9","icap":"L17　首次回调序列与均线交易方法","fid":"fig303","ctx":[{"t":"L17B 首次回调序列与均线交易方法","p":"p608"},{"t":"这一节次我们要介绍建仓方案，分别被称作“20均线缺口”以及“第一均线缺口”。","p":"p609"},{"t":"什么意思呢？我们直接对着图表来说明，对这两个陌生术语的定义。首先，画面中橘色的阴影部分就是20均线缺口之所在。它的原文是“20 gap bar”，虽然没有把均线一词写在术语里面，但实际上跟均线很有关系。指的是当比较显著的趋势性走势，形成价格刮离均线并超过20根K线。那这些K线与均线之间存在的空隙，就是所谓的20均线缺口。不过如果我们是处于K线逐根生成的交易现场，当然并不会预先知道，最后会是连续20根以上K线都未触及均线。还是说半路夭折，无法越过门槛。想要找到20均线缺口，就是得要一根一根的观望。那以这张图表为例，它最后是经历了23根K线之后，才终于重新接触到均线。严格起见，你可以称其为23均线缺口。但基本上只要超过20，我们就可以一律称其为20均线缺口。","p":"p610"}]},{"t":"para","text":"什么意思呢？我们直接对着图表来说明，对这两个陌生术语的定义。首先，画面中橘色的阴影部分就是20均线缺口之所在。它的原文是“20 gap bar”，虽然没有把均线一词写在术语里面，但实际上跟均线很有关系。指的是当比较显著的趋势性走势，形成价格刮离均线并超过20根K线。那这些K线与均线之间存在的空隙，就是所谓的20均线缺口。不过如果我们是处于K线逐根生成的交易现场，当然并不会预先知道，最后会是连续20根以上K线都未触及均线。还是说半路夭折，无法越过门槛。想要找到20均线缺口，就是得要一根一根的观望。那以这张图表为例，它最后是经历了23根K线之后，才终于重新接触到均线。严格起见，你可以称其为23均线缺口。但基本上只要超过20，我们就可以一律称其为20均线缺口。","pid":"p610"},{"t":"img","src":"assets/img/l17B_304.webp","ilabel":"17-10","icap":"L17　首次回调序列与均线交易方法","fid":"fig304","ctx":[{"t":"什么意思呢？我们直接对着图表来说明，对这两个陌生术语的定义。首先，画面中橘色的阴影部分就是20均线缺口之所在。它的原文是“20 gap bar”，虽然没有把均线一词写在术语里面，但实际上跟均线很有关系。指的是当比较显著的趋势性走势，形成价格刮离均线并超过20根K线。那这些K线与均线之间存在的空隙，就是所谓的20均线缺口。不过如果我们是处于K线逐根生成的交易现场，当然并不会预先知道，最后会是连续20根以上K线都未触及均线。还是说半路夭折，无法越过门槛。想要找到20均线缺口，就是得要一根一根的观望。那以这张图表为例，它最后是经历了23根K线之后，才终于重新接触到均线。严格起见，你可以称其为23均线缺口。但基本上只要超过20，我们就可以一律称其为20均线缺口。","p":"p610"},{"t":"那么，又何为第一均线缺口呢？原文里这次就出现均线一词了。所以奇怪，我也不明白两者为什么不统一一点。但总之，它指的是灰紫色的这个区块。当价格首次翻越到均线的对侧，在另一侧留下一个孔洞之后，又穿透回来。当这个与均线之间夹出了空隙。就是第一均线缺口。如果你问我个人的意见，我其实觉得这两项命名都有一点词不达意。","p":"p611"}]},{"t":"para","text":"那么，又何为第一均线缺口呢？原文里这次就出现均线一词了。所以奇怪，我也不明白两者为什么不统一一点。但总之，它指的是灰紫色的这个区块。当价格首次翻越到均线的对侧，在另一侧留下一个孔洞之后，又穿透回来。当这个与均线之间夹出了空隙。就是第一均线缺口。如果你问我个人的意见，我其实觉得这两项命名都有一点词不达意。","pid":"p611"},{"t":"img","src":"assets/img/l17B_305.webp","ilabel":"17-11","icap":"L17　首次回调序列与均线交易方法","fid":"fig305","ctx":[{"t":"那么，又何为第一均线缺口呢？原文里这次就出现均线一词了。所以奇怪，我也不明白两者为什么不统一一点。但总之，它指的是灰紫色的这个区块。当价格首次翻越到均线的对侧，在另一侧留下一个孔洞之后，又穿透回来。当这个与均线之间夹出了空隙。就是第一均线缺口。如果你问我个人的意见，我其实觉得这两项命名都有一点词不达意。","p":"p611"},{"t":"要想要完整的描述这样一个概念，那前者应该是价格乖离均线超过20根K线所留下的缺口。以及后者价格首次穿透到均线，对侧又穿回之后所留下的缺口。我多胆试图给出新的命名建议，或许称为“过度乖离均线缺口”，以及“首次回返均线缺口”将会是可取的主意之一。前者强调，长久偏离均线的特征，而最终终于折返回到均线。而后者则强调先去再回的折返过程，也保留了这件事情是第一次发生的含义。但没关系，在教学中，我们还是应该要尊重原作，这称其为20均线缺口以及第一均线缺口。而你也已经明白其意，一个是与趋势位于同侧，另一个则在趋势的对侧。有趋势发展理想的，按照首次回调序列来建构。它通常是先有20均线缺口，再有第一均线缺口。后者代表逆时方更加进取了，居然可以将价格导向对均线的短暂突破，才终于又被扳回来。大费周章先谈了首次回调序列，又讲了两种陌生的术语，太妃到底想要引出什么呢？既然说是建仓方案，那肯定是有利可图的。我们可以利用上“各类型的首次回调倾向成为失败的反转。”“使得趋势恢复到至少测试原趋势极值”这一点。回顾刚才的图表，你将发现，若我们在20均线缺口成立之后，旋即以低一押注下跌。并且另外，在价格首次穿透到均线上侧时，看衰其突破同样以低一入场。但持仓到原趋势极值的目标，都相终于顺利达成。也没错，上个节次给出的另一个例子也是一样的。介入这两个低一入场点，不要太贪心，只将利润目标设置在原趋势极值处也全部都可以以止盈做收。请别忘记价格都能够乖离均线如此之久，它代表趋势力量更高几率是相当充分的。趋势倾向延续和反转尝试倾向失败，这项你已经朗朗上口的知识点，如今也可以体现在对均线的运用之上。","p":"p612"},{"t":"那么，在晓得有这样一个特性，可以利用以后，交易者要如何把20均线缺口以及第一均线缺口建仓方案给运用得当呢？还是有些小细节要向你提点。首先，关于20均线缺口的建仓方案，我个人通常会限定对均线的乖离，必须是20到30根。太少不行，太多也不好。你可能会问太多为什么不好呢？如果数量更大，那不是应该代表趋势更强，才能够将价格推离均线如此之多吗？这样的想法确实正确。但由于我们是以触碰均线后的高低1来入场，我们就必须担心，如果一轮趋势远离均线太久。比如40根好了，那或许这是一个过于大型的不属于我们驾驭得来的趋势走势。什么意思？毕竟讯号是触线后的高/低1，而高/低1的组成实际上不过这两根K线。那薄薄的两根讯号，再去撬动一个40根K线的行情，肯定比起撬动一个20根K线的行情更加吃力一点点。或许在你入场之后，实际上价格还要再调整的更深一点，才会终于召唤对原趋势极值的测试。就这个例子而言，若是你追溯到两倍或三倍时间级别图表上面去看。你会发现这实际上是一个更大时间级别的20均线缺口。却因为你在小时间级别图表上做四时均线缺口，准备止损出场了。那这想必我们并不乐见。而当然，只要有心，我们肯定是能找到不少反例去证实，即使乖离超过30根，价格对均线依然可能是蜻蜓点水的，碰一下之后。就会旋即折返，回到趋势方向。只不过，在教学的场合，我还是保守的结合我自己的经验，向你提醒，只参与20到30根的乖离，或许会更合适。将来在大量测试之后，你可以再去松动这些数值，开始成你喜欢的样子。说不定你会发现17到26根或者22到35根的成功率最大，也并不一定。很期待你跟我分享你的心得与发现。接着，除了K线数量需要你注意，信号如何产生也是重要的。一般来讲，20均线缺口跟第一均线缺口最大的差异就在于前者的收线不会穿到均线对侧。而后者则是在穿透过去以后才又穿回来。那么，在交易20均线缺口的时候，我们当然就希望当K线终于触及均线，可以让我们看见迅速折回的动作。证明反向订单立即发挥了作用。继而使高/低1，产生在与趋势同侧的均线附近。止损跟止盈呢，这也有个人风格介入的空间，跟前面在讨论双重顶底，楔形顶底的时候很类似。你可以放在遥远的上一个重要波段点或任何你觉得足以令你信服的磁体之外，也可以就放在讯号K线之外。如果你希望盈亏比高一点，你只想以触线后立即显著折返的形式获利，那就会选择尺寸比较浅的方案。要是被打到就算了，这可能代表价格还要在均线附近调整更久，才会终于朝向远趋势方向恢复。而你不想耗费精力做这种漫长的等待。但如果你愿意忍受调整变得更深一点。比如，先出现20均线缺口，还接着出现威胁性加剧了第一均线缺口。或甚至发展成更大的楔形顶/底回调，等等。那你就会采取较宽止损的作战姿势，换取更高的胜率。止盈也有两种方案，不过距离也有两种止损选项，相距又那么远。我们说首次回调结束之后，原趋势极值倾向被测试。那当然去争取测试当前趋势最远处的利润空间会是合理的做法。所以这正是其中一种典型选项。但是要是你更保守一点，你担心对原趋势极值的测试，可能不会以过冲形式完成，而是仅仅不及就回头。那向内缩一些也可以。在讨论课中，我们有向大家补充讯号K线高低点作为磁体的用法。此时在这里可以派上用场。至此，你就可以想象当时你的风格更偏向波段，那就选用止损最浅，止盈最远的组合。可若干偏好追求胜率，则采取止损在前一个重要波段点之外止盈，仅到讯号K线高低点的做法。","p":"p613"},{"t":"还没完，刚刚讲完20均线缺口的操作细节，接着我们来谈第一均线缺口。这两者的关键差别就在于第一均线缺口成立的时候，通常趋势已经较弱，对吧？否则，原趋势方不应该退守至此，令逆势交易者，可以攻陷作为楚河汉界的均线。所以，针对两种看似类似但显然存在不同动能表征的情境，我们在运用上必定要有所调整。我想这一次我们从止损和止盈谈起，逐项倒回来讨论会是个好主意。虽然不是每次都如此。但就首次回调序列的内容排序而言，第一均线缺口时常发生在20均线缺口出现以后。那么，若是在前者入场之后，接着又出现第一均线缺口。那么，交易者会需要比较担心的一件事情是，若是两者都采取宽损押注到原趋势极值之处的过冲测试。却不幸价格未能行抵利润目标，而是陷入无尽回调。那么，我们就有两笔宽幅止损被同时触发的危险。遂此，既然第一均线缺口形成的时候，趋势方已经宝刀稍老。其胜率，就理论比20均线缺口会更低一些。于是，面对胜率的稍显缺失，我们就也许采取更高盈亏比的做法，会更加合适。这也就是说，当然我们可以沿用一模一样的做法去选择宽损的配置。但我个人会更加偏好，对20均线缺口选用比较远的风险距离。而若是以前入场的20均线缺口，但还未止盈就出现第一均线缺口的讯号。那后者可以考虑如大型趋势反转交易那样，改采波段交易的风格。又或者避免两个仓位同时触发宽损的方法。还可以，是只将其中一种纳入规则，放掉另一个。究竟如何选配，你还是有适度的自由空间。我只是想要趁机提醒存在同时亏损的资金压力。所以我们可以如理的适配给这两种方案不同的盈亏比和胜率预期。","p":"p614"}]},{"t":"para","text":"要想要完整的描述这样一个概念，那前者应该是价格乖离均线超过20根K线所留下的缺口。以及后者价格首次穿透到均线，对侧又穿回之后所留下的缺口。我多胆试图给出新的命名建议，或许称为“过度乖离均线缺口”，以及“首次回返均线缺口”将会是可取的主意之一。前者强调，长久偏离均线的特征，而最终终于折返回到均线。而后者则强调先去再回的折返过程，也保留了这件事情是第一次发生的含义。但没关系，在教学中，我们还是应该要尊重原作，这称其为20均线缺口以及第一均线缺口。而你也已经明白其意，一个是与趋势位于同侧，另一个则在趋势的对侧。有趋势发展理想的，按照首次回调序列来建构。它通常是先有20均线缺口，再有第一均线缺口。后者代表逆时方更加进取了，居然可以将价格导向对均线的短暂突破，才终于又被扳回来。大费周章先谈了首次回调序列，又讲了两种陌生的术语，太妃到底想要引出什么呢？既然说是建仓方案，那肯定是有利可图的。我们可以利用上“各类型的首次回调倾向成为失败的反转。”“使得趋势恢复到至少测试原趋势极值”这一点。回顾刚才的图表，你将发现，若我们在20均线缺口成立之后，旋即以低一押注下跌。并且另外，在价格首次穿透到均线上侧时，看衰其突破同样以低一入场。但持仓到原趋势极值的目标，都相终于顺利达成。也没错，上个节次给出的另一个例子也是一样的。介入这两个低一入场点，不要太贪心，只将利润目标设置在原趋势极值处也全部都可以以止盈做收。请别忘记价格都能够乖离均线如此之久，它代表趋势力量更高几率是相当充分的。趋势倾向延续和反转尝试倾向失败，这项你已经朗朗上口的知识点，如今也可以体现在对均线的运用之上。","pid":"p612"},{"t":"para","text":"那么，在晓得有这样一个特性，可以利用以后，交易者要如何把20均线缺口以及第一均线缺口建仓方案给运用得当呢？还是有些小细节要向你提点。首先，关于20均线缺口的建仓方案，我个人通常会限定对均线的乖离，必须是20到30根。太少不行，太多也不好。你可能会问太多为什么不好呢？如果数量更大，那不是应该代表趋势更强，才能够将价格推离均线如此之多吗？这样的想法确实正确。但由于我们是以触碰均线后的高低1来入场，我们就必须担心，如果一轮趋势远离均线太久。比如40根好了，那或许这是一个过于大型的不属于我们驾驭得来的趋势走势。什么意思？毕竟讯号是触线后的高/低1，而高/低1的组成实际上不过这两根K线。那薄薄的两根讯号，再去撬动一个40根K线的行情，肯定比起撬动一个20根K线的行情更加吃力一点点。或许在你入场之后，实际上价格还要再调整的更深一点，才会终于召唤对原趋势极值的测试。就这个例子而言，若是你追溯到两倍或三倍时间级别图表上面去看。你会发现这实际上是一个更大时间级别的20均线缺口。却因为你在小时间级别图表上做四时均线缺口，准备止损出场了。那这想必我们并不乐见。而当然，只要有心，我们肯定是能找到不少反例去证实，即使乖离超过30根，价格对均线依然可能是蜻蜓点水的，碰一下之后。就会旋即折返，回到趋势方向。只不过，在教学的场合，我还是保守的结合我自己的经验，向你提醒，只参与20到30根的乖离，或许会更合适。将来在大量测试之后，你可以再去松动这些数值，开始成你喜欢的样子。说不定你会发现17到26根或者22到35根的成功率最大，也并不一定。很期待你跟我分享你的心得与发现。接着，除了K线数量需要你注意，信号如何产生也是重要的。一般来讲，20均线缺口跟第一均线缺口最大的差异就在于前者的收线不会穿到均线对侧。而后者则是在穿透过去以后才又穿回来。那么，在交易20均线缺口的时候，我们当然就希望当K线终于触及均线，可以让我们看见迅速折回的动作。证明反向订单立即发挥了作用。继而使高/低1，产生在与趋势同侧的均线附近。止损跟止盈呢，这也有个人风格介入的空间，跟前面在讨论双重顶底，楔形顶底的时候很类似。你可以放在遥远的上一个重要波段点或任何你觉得足以令你信服的磁体之外，也可以就放在讯号K线之外。如果你希望盈亏比高一点，你只想以触线后立即显著折返的形式获利，那就会选择尺寸比较浅的方案。要是被打到就算了，这可能代表价格还要在均线附近调整更久，才会终于朝向远趋势方向恢复。而你不想耗费精力做这种漫长的等待。但如果你愿意忍受调整变得更深一点。比如，先出现20均线缺口，还接着出现威胁性加剧了第一均线缺口。或甚至发展成更大的楔形顶/底回调，等等。那你就会采取较宽止损的作战姿势，换取更高的胜率。止盈也有两种方案，不过距离也有两种止损选项，相距又那么远。我们说首次回调结束之后，原趋势极值倾向被测试。那当然去争取测试当前趋势最远处的利润空间会是合理的做法。所以这正是其中一种典型选项。但是要是你更保守一点，你担心对原趋势极值的测试，可能不会以过冲形式完成，而是仅仅不及就回头。那向内缩一些也可以。在讨论课中，我们有向大家补充讯号K线高低点作为磁体的用法。此时在这里可以派上用场。至此，你就可以想象当时你的风格更偏向波段，那就选用止损最浅，止盈最远的组合。可若干偏好追求胜率，则采取止损在前一个重要波段点之外止盈，仅到讯号K线高低点的做法。","pid":"p613"},{"t":"para","text":"还没完，刚刚讲完20均线缺口的操作细节，接着我们来谈第一均线缺口。这两者的关键差别就在于第一均线缺口成立的时候，通常趋势已经较弱，对吧？否则，原趋势方不应该退守至此，令逆势交易者，可以攻陷作为楚河汉界的均线。所以，针对两种看似类似但显然存在不同动能表征的情境，我们在运用上必定要有所调整。我想这一次我们从止损和止盈谈起，逐项倒回来讨论会是个好主意。虽然不是每次都如此。但就首次回调序列的内容排序而言，第一均线缺口时常发生在20均线缺口出现以后。那么，若是在前者入场之后，接着又出现第一均线缺口。那么，交易者会需
