<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- MOBUI-v1 -->
<!-- ICONV2-v1 -->
<!-- ICONPUB-v1 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- PWA-v1 -->
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0E9488">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PA阅读">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/vviptl629-bot/pa-icons/main/apple-touch-icon.png?v2">
<title>太妃 价格行为基础+进阶 · 读书笔记</title>
<link rel="icon" href="https://raw.githubusercontent.com/vviptl629-bot/pa-icons/main/icon-192.png?v2">
<style>
html{
  --bg:#ffffff; --panel:#f5f6f7; --panel2:#eceef0; --line:#c9ced4;
  --text:#111418; --muted:#555e68; --accent:#0E9488; --deep:#0E9488;
  --amber:#a16207; --green:#15803d;
  --topbar-bg:rgba(255,255,255,.94); --para:#1a1f24;
  --mark-bg:rgba(14,148,136,.08); --badge-bg:rgba(14,148,136,.08); --badge-border:#0E9488;
  --img-shadow:0 2px 10px rgba(0,0,0,.12); --overlay:rgba(0,0,0,.35);
  --mark-text:rgba(251,191,36,.35);
}
:root{--sidebar:280px; --topbar:56px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.85;-webkit-font-smoothing:antialiased;
}
/* ---------- Top bar ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;height:var(--topbar);z-index:50;
  background:var(--topbar-bg);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 20px;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
.brand .mark{
  width:30px;height:30px;border-radius:8px;background:var(--accent);color:#08110f;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;
}
.brand .sub{color:var(--muted);font-weight:400;font-size:13px}
.lib-btn{flex:none;display:inline-flex;align-items:center;gap:5px;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;transition:background .18s}
.lib-btn:hover{background:rgba(14,148,136,.08)}
@media(max-width:720px){.lib-btn{padding:5px 9px;font-size:12px}}
.searchwrap{margin-left:auto;position:relative}
.searchwrap input{
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:8px 12px 8px 34px;width:230px;font-size:14px;outline:none;
  transition:border-color .2s;
}
.searchwrap input:focus{border-color:var(--accent)}
.searchwrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);stroke:var(--muted)}
.menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:6px 10px;font-size:18px;cursor:pointer}
/* ---------- Layout ---------- */
.layout{display:flex;padding-top:var(--topbar);min-height:100vh}
.sidebar{
  position:fixed;top:var(--topbar);bottom:0;left:0;width:var(--sidebar);
  background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:16px 0 40px;z-index:40;
}
.sidebar::-webkit-scrollbar,.main::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb,.main::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.toc-hint{font-size:11px;letter-spacing:2px;color:var(--muted);padding:6px 20px 12px;text-transform:uppercase}
.toc-ch{margin-bottom:2px}
.toc-ch-title{
  display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;
  font-weight:600;font-size:14px;user-select:none;color:var(--text);
}
.toc-ch-title:hover{background:var(--panel2)}
.toc-ch-title .num{
  flex:none;width:24px;height:24px;border-radius:6px;background:var(--panel2);
  color:var(--accent);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700;
}
.toc-ch-title .name{flex:1;line-height:1.35}
.toc-ch-title .arrow{transition:transform .2s;color:var(--muted);font-size:12px}
.toc-ch-title .wc{flex:none;font-size:10.5px;color:var(--muted);font-weight:400;opacity:.8}
.toc-total{font-size:11.5px;color:var(--muted);padding:0 20px 12px;line-height:1.6}
.toc-ch.closed .arrow{transform:rotate(-90deg)}
.toc-ch.closed .toc-secs{display:none}
.toc-secs{padding:2px 0 6px}
.toc-sec{
  display:block;padding:6px 20px 6px 54px;font-size:13px;color:var(--muted);
  cursor:pointer;line-height:1.5;border-left:2px solid transparent;
}
.toc-sec:hover{color:var(--text);background:var(--panel2)}
.toc-sec.lvl2{padding-left:70px;font-size:12.5px}
.toc-sec.active{color:var(--accent);border-left-color:var(--accent);background:var(--mark-bg);font-weight:600}
.toc-sec.hidden{display:none}
.toc-empty{padding:10px 20px;color:var(--muted);font-size:13px}
/* ---------- Main ---------- */
.main{margin-left:var(--sidebar);flex:1;padding:44px 24px 120px;min-width:0}
.paper{max-width:820px;margin:0 auto}
.chapter{margin-bottom:80px;scroll-margin-top:80px}
.chapter-head{margin-bottom:36px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.chapter-head .badge{
  display:inline-block;background:var(--badge-bg);color:var(--accent);
  border:1px solid var(--badge-border);border-radius:6px;padding:2px 10px;font-size:12px;
  letter-spacing:2px;margin-bottom:14px;
}
.chapter-head h1{font-size:30px;line-height:1.35;font-weight:800;letter-spacing:.5px}
.chapter-head .wcmeta{font-size:13px;color:var(--muted);margin-top:10px}
.chapter-head .wcmeta b{color:var(--accent);font-weight:700}
.toc-hint .total{display:block;letter-spacing:0;font-size:11px;color:var(--muted);margin-top:6px;text-transform:none}
.section{margin:0 0 38px;scroll-margin-top:80px}
.section h2{
  font-size:21px;font-weight:700;line-height:1.5;margin:0 0 18px;
  padding-left:14px;border-left:3px solid var(--accent);
}
.section.lvl2 h2{font-size:18px;border-left-color:var(--deep)}
.para{margin:0 0 18px;color:var(--para);text-align:justify}
.cap{
  font-size:13px;color:var(--muted);text-align:center;margin:6px 0 26px;
  padding:0 16px;line-height:1.7;
}
/* FIGFLOW-v1 流式图文：图全宽在上、正文照常排在下方；点击图片进分屏 */
.fig-row{display:block;margin:22px 0 26px}
.fig-row>.figmedia{max-width:100%;margin:0 0 18px}
.fig-row>.figmedia .figure{margin:0;text-align:center}
.fig-row .fig-text{min-width:0}
.fig-row .fig-text .para:last-child{margin-bottom:0}
.fig-row .figmedia .figure img{
  max-width:100%;width:auto;height:auto;border-radius:8px;background:#fff;
  border:1px solid var(--line);cursor:zoom-in;display:block;margin:0 auto;
  box-shadow:var(--img-shadow);
}
.fig-row .fig-back{margin-top:8px}
/* 独立图（无配对段落）正常居中 */
.fig-tag{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);
  background:var(--badge-bg);border:1px solid var(--badge-border);border-radius:5px;
  padding:1px 8px;margin-bottom:6px;letter-spacing:.5px}
.figure{margin:22px 0 8px;text-align:center;cursor:zoom-in}
.figure img{
  max-width:100%;height:auto;border-radius:8px;background:#fff;
  border:1px solid var(--line);cursor:zoom-in;display:inline-block;
  box-shadow:var(--img-shadow);
}
@media(max-width:1100px){
  .fig-row{margin:18px 0}
  .fig-row>.figmedia{max-width:100%;margin:0 0 14px}
}
.top-para{margin:0 0 18px;color:var(--para);text-align:justify}
/* ---------- Search highlight ---------- */
mark{background:var(--mark-text);color:var(--amber);border-radius:3px;padding:0 2px}
/* ---------- Side tabs (目录/图表/摘录) ---------- */
.side-tabs{display:flex;gap:4px;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.side-tabs button{flex:1;background:none;border:1px solid var(--line);color:var(--muted);
  border-radius:7px;padding:7px 4px;font-size:12.5px;cursor:pointer;transition:all .15s}
.side-tabs button.on{color:var(--accent);border-color:var(--deep);background:var(--badge-bg);font-weight:700}
.side-panel{display:none}.side-panel.on{display:block}
/* figure index */
.figidx{padding:8px 0}
.figidx-hint{font-size:11.5px;color:var(--muted);padding:4px 20px 10px;line-height:1.5}
.fig-item{display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;
  padding:8px 20px;color:var(--text);border-left:2px solid transparent;font-size:12.5px;line-height:1.4}
.fig-item:hover{background:var(--panel2)}
.fig-item .fnum{color:var(--accent);font-weight:700;margin-right:8px}
.fig-item .fcap{color:var(--muted)}
.fig-item.hidden{display:none}
/* figure number links in text */
.figref{color:var(--accent);border-bottom:1px dashed var(--deep);cursor:pointer;padding:0 1px}
.figref:hover{background:var(--badge-bg)}
.figure.hl-flash{animation:figflash 1.6s ease}
@keyframes figflash{0%,100%{box-shadow:var(--img-shadow)}30%,70%{box-shadow:0 0 0 5px var(--accent),0 0 30px var(--accent)}}
.fig-back{display:block;margin:10px auto 0;font-size:12px;color:var(--muted);cursor:pointer;
  background:none;border:1px solid var(--line);border-radius:6px;padding:3px 12px}
.fig-back:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- Highlights / excerpt ---------- */
.hl-y{background:rgba(251,191,36,.42);border-radius:2px;padding:1px 0;cursor:pointer}
.hl-g{background:rgba(74,222,128,.38);border-radius:2px;padding:1px 0;cursor:pointer}
.hl-b{background:rgba(96,165,250,.32);border-radius:2px;padding:1px 0;cursor:pointer}
.hl-bold{font-weight:800}
.selbar{position:fixed;z-index:155;display:none;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:5px;gap:4px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.selbar.show{display:flex;flex-wrap:wrap;max-width:340px}
.selbar button{border:none;background:var(--panel2);color:var(--text);border-radius:7px;
  padding:7px 10px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:5px}
.selbar button:hover{background:var(--accent);color:#08110f}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.dot.y{background:#fbbf24}.dot.g{background:#4ade80}.dot.b{background:#60a5fa}
/* excerpt drawer */
.excerpt-item{position:relative;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.excerpt-item:hover{background:var(--panel2)}
.excerpt-item .etext{font-size:13px;line-height:1.7;color:var(--text);word-break:break-word}
.excerpt-item .emeta{font-size:11px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.excerpt-item .edel{color:var(--muted);border:none;background:none;cursor:pointer;font-size:14px;padding:2px 6px}
.excerpt-item .edel:hover{color:#f87171}
.excerpt-item .ecolor{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px}
.excerpt-empty{padding:30px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
.excerpt-tools{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.excerpt-tools button{flex:1;min-width:70px;background:var(--panel2);border:1px solid var(--line);
  color:var(--text);border-radius:7px;padding:7px;font-size:12px;cursor:pointer}
.excerpt-tools button:hover{border-color:var(--accent);color:var(--accent)}
.excerpt-search{margin:10px 16px 4px;width:calc(100% - 32px);background:var(--panel2);
  border:1px solid var(--line);color:var(--text);border-radius:7px;padding:8px 10px;font-size:13px;outline:none}
/* ---------- Lightbox ---------- */
.lightbox{
  position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:160;display:none;
  align-items:center;justify-content:center;padding:40px;cursor:zoom-out;
}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lightbox .close{position:absolute;top:20px;right:26px;font-size:34px;color:#fff;cursor:pointer}
/* ---------- Split reading mode (click image -> full-screen split) ---------- */
body.split-mode .sidebar{transform:translateX(-100%);pointer-events:none}
body.split-mode .main{margin-left:0}
.split-reader{
  position:fixed;inset:0;z-index:150;background:var(--bg);
  display:none;flex-direction:column;
}
.split-reader.show{display:flex}
.sp-bar{
  height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel);gap:16px;
}
.sp-title{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.sp-ctrl{display:flex;align-items:center;gap:8px;flex:none}
.sp-ctrl button{
  background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:6px 13px;font-size:17px;line-height:1;cursor:pointer;transition:all .15s;
}
.sp-ctrl button:hover{color:var(--accent);border-color:var(--accent)}
.sp-ctrl #spPos{font-size:12px;color:var(--muted);min-width:56px;text-align:center}
.sp-body{flex:1;display:flex;min-height:0}
.sp-img{
  flex:0 0 56%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px 22px;overflow:auto;
}
.sp-img img{
  max-width:100%;max-height:calc(100vh - 150px);width:auto;height:auto;object-fit:contain;
  border-radius:8px;background:#fff;border:1px solid var(--line);box-shadow:var(--img-shadow);
  display:block;cursor:zoom-in;
}
.sp-img .cap{margin:12px 0 0;max-width:100%;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
.sp-txt{flex:1;min-width:0;overflow-y:auto;border-left:1px solid var(--line);padding:34px 38px 90px}
.sp-txt .sp-label{font-size:12px;letter-spacing:1px;color:var(--accent);margin-bottom:20px;font-weight:700;line-height:1.6}
.sp-txt .para{font-size:17.5px;line-height:2.05;color:var(--para);text-align:justify;margin-bottom:20px}
/* ---------- Progress ---------- */
.progress{position:fixed;top:var(--topbar);left:0;height:2px;background:var(--accent);z-index:60;width:0}
/* ---------- Back to top ---------- */
.totop{
  position:fixed;right:24px;bottom:28px;width:44px;height:44px;border-radius:50%;
  background:var(--panel2);border:1px solid var(--line);color:var(--accent);
  font-size:20px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:30;
}
.totop.show{display:flex}
/* ---------- Mobile ---------- */
@media(max-width:800px){
  :root{--sidebar:0px}
  .brand .sub{display:none}
  .brand>span:nth-child(2){display:none}
  .topbar{gap:10px;padding:0 12px}
  .searchwrap{margin-left:auto;flex:1;max-width:190px}
  .searchwrap input{width:100%}
  .menu-btn{display:block;flex:none}
  .sidebar{transform:translateX(-100%);transition:transform .25s;width:82vw;max-width:320px}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:30px 16px 100px}
  .chapter-head h1{font-size:24px}
  .section h2{font-size:19px}
  body{font-size:15.5px}
  .overlay{position:fixed;inset:0;background:var(--overlay);z-index:35;display:none}
  .overlay.show{display:block}
}
/* ---------- Print: pure white, ink-saving ---------- */
@media print{.book-title{color:#000!important;border-bottom:2px solid #000!important}.book-title:empty::before{content:''!important}}
@media print{
  html{
    --bg:#fff;--panel:#fff;--panel2:#fff;--text:#000;--muted:#000;--line:#000;
    --accent:#000;--para:#000;--badge-bg:#fff;--mark-bg:#fff;--img-shadow:none;
  }
  body{background:#fff!important;color:#000!important;font-size:11pt}
  .topbar,.sidebar,.progress,.totop,.lightbox,.overlay,.chapter-head .badge{display:none!important}
  .layout{display:block;padding:0}
  .main{margin:0;padding:0}
  .paper{max-width:none}
  .chapter{margin-bottom:24px;page-break-after:auto}
  .chapter-head{border-bottom:1px solid #000;padding-bottom:8px;margin-bottom:16px}
  .chapter-head h1{font-size:20pt;color:#000}
  .section h2{border-left:2px solid #000;color:#000;font-size:14pt}
  .para,.top-para,.cap{color:#000!important}
  .figure img{border:1px solid #000;box-shadow:none;max-width:100%}
  mark{background:none;color:#000;font-weight:bold}
}

/* ===== reading time ===== */
.rt-wrap{position:relative;flex:none;display:inline-flex}
.read-timer{display:inline-flex;align-items:center;gap:6px;height:34px;color:var(--muted);font-size:13px;font-weight:600;background:transparent;border:1px solid var(--line);border-radius:8px;padding:0 10px;white-space:nowrap;cursor:pointer;font-family:inherit}
.read-timer:hover{border-color:var(--accent);color:var(--accent)}
.read-timer .rt-dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.read-timer.live .rt-dot{background:var(--accent);box-shadow:0 0 0 3px rgba(14,148,136,.16)}
.read-timer b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:700}
.rt-pop{position:absolute;right:0;top:calc(100% + 8px);z-index:300;width:262px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:0 12px 34px rgba(0,0,0,.13);display:none;text-align:left;font-weight:400;font-size:13px;line-height:1.6}
.rt-pop.show{display:block}
.rt-pop h4{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:700}
.rt-pop .rt-big{font-size:22px;color:var(--accent);font-weight:800;margin-bottom:8px;font-variant-numeric:tabular-nums}
.rt-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.rt-row:last-child{border-bottom:0}
.rt-row span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-row b{color:var(--text);font-variant-numeric:tabular-nums;flex:none}
.rt-bars{display:flex;align-items:flex-end;gap:4px;height:58px;margin:8px 0 6px}
.rt-bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.rt-bar i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.rt-bar.today i{opacity:1;box-shadow:0 0 0 1px var(--deep)}
.rt-bar em{font-size:10px;font-style:normal;color:var(--muted);white-space:nowrap}
.rt-tip{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
@media(max-width:720px){.read-timer{height:30px;padding:0 7px;font-size:12px}.rt-label{display:none}.rt-pop{right:-40px;width:242px}}
@media print{.rt-wrap,.rt-pop{display:none!important}}

/* MOBUI-v1 */@media(max-width:720px){.undo-btn{display:none!important}.split-reader{display:none!important}}
</style>



<style id="simpleEditStyle">
/* ===== SIMPLE-EDIT-v2 默认纯阅读 + 按需改字 ===== */
/* 只有正在编辑的那一段才有提示框；其余段落保持纯阅读，无任何框 */
/* DUPTITLE-v1 正文首段与标题重复时隐藏该行（不删DOM，仅视觉隐藏）*/
.dup-title-line{display:none!important}
.dup-title-line + p{margin-top:0}
@media print{.dup-title-line{display:none!important}}
/* BOOKTITLE-v1 书名大标题（空白可编辑）*/
.book-title{font-size:30px;font-weight:800;line-height:1.35;color:var(--text);
  margin:6px 0 26px;padding:0 0 14px;border-bottom:2px solid var(--accent);
  cursor:text;outline:none;min-height:1em}
.book-title:empty::before{content:'点击此处输入书名大标题…';color:var(--muted);font-weight:600;opacity:.7}
[data-pid].se-editing{outline:1px solid var(--amber);outline-offset:2px;border-radius:2px;cursor:text;background:rgba(251,191,36,.05)}
/* 改过的段落：极轻左边框痕迹（打印去掉） */
/* EDITUI-FIX: 改字后不再显示橙色竖框，段落保持纯阅读外观 */
/* 文字被删空的段落：隐藏整段（含残留竖线装饰），撤销后自动恢复 */

<script id="sitedata" type="application/json">[{"id":"base","icon":"基","title":"价格行为基础（繁体）","blocks":[{"t":"para","text":"價格行為基礎","pid":"p0"},{"t":"para","text":"【價格行為基礎 01】什麼是 K 線？你一定要知道的價格運作機制與表述方法","pid":"p1"},{"t":"para","text":"K线最重要的内容：高开低收，K线可以组合。K线分为趋势K线和震荡K线（十字星）。","pid":"p2"},{"t":"para","text":"【價格行為基礎 02】什麼是趨勢？強勁上漲與下跌的背後原理是什麼？","pid":"p3"},{"t":"para","text":"趋势就是价格运行的方向。","pid":"p4"},{"t":"para","text":"上涨趋势，更高的高点（HH），更高的低点（HL）。","pid":"p5"},{"t":"para","text":"下降趋势，更高的低点（LH），更低的低点（LL）。","pid":"p6"},{"t":"para","text":"避免逆势交易。趋势结束于动能的减弱，上涨趋势不再形成更高的高点，下降趋势不再制造出更低的低点。通常会出现：急速变通道后进入交易区间，三推楔形顶底，收敛三角等等。","pid":"p7"},{"t":"para","text":"交易是必须反复执行，有纪律的重复工作。","pid":"p8"},{"t":"para","text":"【價格行為基礎 03】什麼是支撐與阻力？是什麼讓價格的趨勢性運動發生反轉？","pid":"p9"},{"t":"para","text":"支撑阻力的形成一般由心理预期（关键价位）和利害关系（解套需求）决定的。","pid":"p10"},{"t":"para","text":"寻找支撑阻力的方法：未经测试的前波段高低点，成交密集区，多次验证的区域，距离当前行情越近越有效。","pid":"p11"},{"t":"para","text":"【價格行為基礎 04】價格運行的斜率變化代表什麼？什麼是急速、通道與區間？","pid":"p12"},{"t":"para","text":"反转比想象的更难，需要同时满足：大部分顺势力量离场，新的顺势力量不再跟进，逆势力量大举进场。","pid":"p13"},{"t":"para","text":"斜率的不同分为三类：","pid":"p14"},{"t":"para","text":"急速：运行斜率最大，重叠较少，K线实体很长，影线很短，顺势能量强劲，完全压到逆势。","pid":"p15"},{"t":"para","text":"通道：运行斜率趋缓，K线重叠较多，实体与影线有长有短，顺势能量减弱，逆势紧追在后。","pid":"p16"},{"t":"para","text":"区间：运行斜率较小，K线高度重叠，K线实体较短，影线较长，顺势能量消失，逆势能量相当。","pid":"p17"},{"t":"img","src":"assets/img/base_001.webp","ilabel":"B-1","icap":"价格行为基础（繁体）","fid":"fig1","ctx":[{"t":"通道：运行斜率趋缓，K线重叠较多，实体与影线有长有短，顺势能量减弱，逆势紧追在后。","p":"p16"},{"t":"区间：运行斜率较小，K线高度重叠，K线实体较短，影线较长，顺势能量消失，逆势能量相当。","p":"p17"},{"t":"趋势倾向于延续，支撑阻力不一定带来反转，通常造成斜率的改变，急速通道区间的转变反应场内多空力量的消长。","p":"p18"},{"t":"【價格行為基礎 05】什麼是反轉信號？開倉前必學的反轉信號 K 線！","p":"p19"},{"t":"反转的本质是逆势力量对顺势方向的突破。","p":"p20"},{"t":"反转K线：对前根或数根K线的运行方向造成某种程度反转的K线。","p":"p21"},{"t":"单K线反转，在低级别就是双K反转。","p":"p22"},{"t":"双K反转：两根K线实体大小相当，但是方向不同的K线。","p":"p23"},{"t":"多K反转：在底部，内包十字星反转K线（阴线+十字星+阳线）要涨了。在顶部，（阳线+十字星+阴线）要跌了。（见下图）","p":"p24"}]},{"t":"para","text":"趋势倾向于延续，支撑阻力不一定带来反转，通常造成斜率的改变，急速通道区间的转变反应场内多空力量的消长。","pid":"p18"},{"t":"para","text":"【價格行為基礎 05】什麼是反轉信號？開倉前必學的反轉信號 K 線！","pid":"p19"},{"t":"para","text":"反转的本质是逆势力量对顺势方向的突破。","pid":"p20"},{"t":"para","text":"反转K线：对前根或数根K线的运行方向造成某种程度反转的K线。","pid":"p21"},{"t":"para","text":"单K线反转，在低级别就是双K反转。","pid":"p22"},{"t":"para","text":"双K反转：两根K线实体大小相当，但是方向不同的K线。","pid":"p23"},{"t":"para","text":"多K反转：在底部，内包十字星反转K线（阴线+十字星+阳线）要涨了。在顶部，（阳线+十字星+阴线）要跌了。（见下图）","pid":"p24"},{"t":"img","src":"assets/img/base_002.webp","ilabel":"B-2","icap":"价格行为基础（繁体）","fid":"fig2","ctx":[{"t":"双K反转：两根K线实体大小相当，但是方向不同的K线。","p":"p23"},{"t":"多K反转：在底部，内包十字星反转K线（阴线+十字星+阳线）要涨了。在顶部，（阳线+十字星+阴线）要跌了。（见下图）","p":"p24"},{"t":"反转信号注意事项：","p":"p25"},{"t":"1.只在阶段性的顶底寻找反转信号。","p":"p26"},{"t":"2.不与前方K线有过多的重叠。","p":"p27"},{"t":"3.先有过急速或通道运动。","p":"p28"},{"t":"4.窄幅区间大多无效。","p":"p29"},{"t":"【價格行為基礎 06】什麼是形態？讀懂市場中群體行為的集合","p":"p30"},{"t":"形态是视觉化高度重复的K线组合。本质：某种情境下，市场中不同行动者行为的集合K线。","p":"p31"},{"t":"急速通道区间形态都是多空互动的视觉呈现。形态并不能保证涨跌，也不是预测工具，更不能作为重仓的依据。K线形态是为了洞悉市场方向，提前准备预案。","p":"p32"},{"t":"形态分为持续和反转两大类：","p":"p33"},{"t":"持续形态的特征：逆势缺乏跟进力量。","p":"p34"},{"t":"反转形态的特征：顺势缺乏跟进力量。","p":"p35"}]},{"t":"para","text":"反转信号注意事项：","pid":"p25"},{"t":"para","text":"1.只在阶段性的顶底寻找反转信号。","pid":"p26"},{"t":"para","text":"2.不与前方K线有过多的重叠。","pid":"p27"},{"t":"para","text":"3.先有过急速或通道运动。","pid":"p28"},{"t":"para","text":"4.窄幅区间大多无效。","pid":"p29"},{"t":"para","text":"【價格行為基礎 06】什麼是形態？讀懂市場中群體行為的集合","pid":"p30"},{"t":"para","text":"形态是视觉化高度重复的K线组合。本质：某种情境下，市场中不同行动者行为的集合K线。","pid":"p31"},{"t":"para","text":"急速通道区间形态都是多空互动的视觉呈现。形态并不能保证涨跌，也不是预测工具，更不能作为重仓的依据。K线形态是为了洞悉市场方向，提前准备预案。","pid":"p32"},{"t":"para","text":"形态分为持续和反转两大类：","pid":"p33"},{"t":"para","text":"持续形态的特征：逆势缺乏跟进力量。","pid":"p34"},{"t":"para","text":"反转形态的特征：顺势缺乏跟进力量。","pid":"p35"},{"t":"img","src":"assets/img/base_003.webp","ilabel":"B-3","icap":"价格行为基础（繁体）","fid":"fig3","ctx":[{"t":"持续形态的特征：逆势缺乏跟进力量。","p":"p34"},{"t":"反转形态的特征：顺势缺乏跟进力量。","p":"p35"}]},{"t":"img","src":"assets/img/base_004.webp","ilabel":"B-4","icap":"价格行为基础（繁体）","fid":"fig4","ctx":[{"t":"【價格行為基礎 07】什麼是二段式回調與雙重頂底？最常見、最簡單的持續形態！","p":"p36"},{"t":"二段式回调：在上升趋势中，回调以两段下跌来完成，之后延续原先的上涨行情，通常在二段回调中，第二段推动下跌深度会跟第一段推动相距不远，因此交易者可以在第一次推动完成后，第二段推动正在形成的过程中，以1:1的等距行情测算回调的终点。","p":"p37"},{"t":"双重底:同样由两段下跌所形成，只不过相较于二段式回调，下跌的动能减弱，无法将价格推的更低。","p":"p38"},{"t":"回调中的交易行为：顺势多头了结浮盈+逆势空头趁虚而入。顺势多头重新入场+逆势空头速速开溜。","p":"p39"},{"t":"把握动能衰竭之际是最佳的入场时机。","p":"p40"},{"t":"画出等距位置，等待价格按预期入场，入场前明确止盈止损位置。","p":"p41"},{"t":"注意事项：1.形态形成时准备出手。2.形态+支阻+信号K线。3.止盈止损明确，不扛单。4.形态有时模棱两可。","p":"p42"},{"t":"【價格行為基礎 08】什麼是三推旗形與三推楔形？雙重獲利機會的持續形態！","p":"p43"},{"t":"三推旗型：在上升趋势中，回调以大致三段等距的下跌来完成，最终延续了原先的上涨行情。","p":"p44"},{"t":"三推楔形：同样三段推动，但下跌动能逐渐减弱，对前一段假突破后折回。","p":"p45"},{"t":"如果在一个下降的旗型里，空头占有很大优势的话，那价格应该直接向下跌破才对，不过急速下跌没有发生（可理解为动能减弱）一直有多头入场，在通道线附近买入，下降旗型的下跌是多头止盈，空头剥头皮造成的。","p":"p46"},{"t":"注意事项：1.三推中通常必有二推。2.完美的形态几乎不存在。3.趋势中止也能止盈。4.1:1盈亏比有其道理。盈亏比的调整可以在大量复盘后进行调整。","p":"p47"},{"t":"必须学会如何测试等距行情，以及观察价格在前高前低附近是否出现反转信号。","p":"p48"},{"t":"【價格行為基礎 09】什麼是三重頂底與頭肩頂底？最被誤用的形態！","p":"p49"},{"t":"逆势空头后续无力，第二，三段下跌，无法跌破第一推最低点，当价格在同一支撑位附近弹起，就会形成所谓的三重底。","p":"p50"},{"t":"如果下跌趋势中，出现三次向上的等高回调，在同一个水平阻力遇阻，无法向上突破，那就会形成三重顶，尔后延续下跌。","p":"p51"},{"t":"头肩顶底同样有三次推动，创造出三个山峰和低谷，只不过三次推动的力量不同，在上升趋势中，第二段推动好不容易创了新低，正当以为还有第三次推动能够形成三推旗型的时候，价格却在半路就衰竭了，形成三段推动中最弱的一段，最后一跌连第二段推动的极值都够不到，这是逆势空头缺乏跟进力量的铁证。","p":"p52"},{"t":"趋势倾向延续，在上升趋势中应该寻找逆势力量衰弱的证据后（回调）入场做多。因此在上升趋势中应该寻找三重底做多，而不是赌反转。","p":"p53"},{"t":"总结：上升趋势中的持续形态分为二推和三推两大类，无论哪一种形态，他的回调都是逆势向下推动，但最终这些空头力量无法创造出新的急速下跌，而是被多头反超，延续上涨的行情，除了二段式回调和三推下降旗型，每一推可以勉强维持同等力道，将价格打压更低之外，其他的4种形态，二，三推都较为乏力。","p":"p54"}]},{"t":"para","text":"【價格行為基礎 07】什麼是二段式回調與雙重頂底？最常見、最簡單的持續形態！","pid":"p36"},{"t":"para","text":"二段式回调：在上升趋势中，回调以两段下跌来完成，之后延续原先的上涨行情，通常在二段回调中，第二段推动下跌深度会跟第一段推动相距不远，因此交易者可以在第一次推动完成后，第二段推动正在形成的过程中，以1:1的等距行情测算回调的终点。","pid":"p37"},{"t":"para","text":"双重底:同样由两段下跌所形成，只不过相较于二段式回调，下跌的动能减弱，无法将价格推的更低。","pid":"p38"},{"t":"para","text":"回调中的交易行为：顺势多头了结浮盈+逆势空头趁虚而入。顺势多头重新入场+逆势空头速速开溜。","pid":"p39"},{"t":"para","text":"把握动能衰竭之际是最佳的入场时机。","pid":"p40"},{"t":"para","text":"画出等距位置，等待价格按预期入场，入场前明确止盈止损位置。","pid":"p41"},{"t":"para","text":"注意事项：1.形态形成时准备出手。2.形态+支阻+信号K线。3.止盈止损明确，不扛单。4.形态有时模棱两可。","pid":"p42"},{"t":"para","text":"【價格行為基礎 08】什麼是三推旗形與三推楔形？雙重獲利機會的持續形態！","pid":"p43"},{"t":"para","text":"三推旗型：在上升趋势中，回调以大致三段等距的下跌来完成，最终延续了原先的上涨行情。","pid":"p44"},{"t":"para","text":"三推楔形：同样三段推动，但下跌动能逐渐减弱，对前一段假突破后折回。","pid":"p45"},{"t":"para","text":"如果在一个下降的旗型里，空头占有很大优势的话，那价格应该直接向下跌破才对，不过急速下跌没有发生（可理解为动能减弱）一直有多头入场，在通道线附近买入，下降旗型的下跌是多头止盈，空头剥头皮造成的。","pid":"p46"},{"t":"para","text":"注意事项：1.三推中通常必有二推。2.完美的形态几乎不存在。3.趋势中止也能止盈。4.1:1盈亏比有其道理。盈亏比的调整可以在大量复盘后进行调整。","pid":"p47"},{"t":"para","text":"必须学会如何测试等距行情，以及观察价格在前高前低附近是否出现反转信号。","pid":"p48"},{"t":"para","text":"【價格行為基礎 09】什麼是三重頂底與頭肩頂底？最被誤用的形態！","pid":"p49"},{"t":"para","text":"逆势空头后续无力，第二，三段下跌，无法跌破第一推最低点，当价格在同一支撑位附近弹起，就会形成所谓的三重底。","pid":"p50"},{"t":"para","text":"如果下跌趋势中，出现三次向上的等高回调，在同一个水平阻力遇阻，无法向上突破，那就会形成三重顶，尔后延续下跌。","pid":"p51"},{"t":"para","text":"头肩顶底同样有三次推动，创造出三个山峰和低谷，只不过三次推动的力量不同，在上升趋势中，第二段推动好不容易创了新低，正当以为还有第三次推动能够形成三推旗型的时候，价格却在半路就衰竭了，形成三段推动中最弱的一段，最后一跌连第二段推动的极值都够不到，这是逆势空头缺乏跟进力量的铁证。","pid":"p52"},{"t":"para","text":"趋势倾向延续，在上升趋势中应该寻找逆势力量衰弱的证据后（回调）入场做多。因此在上升趋势中应该寻找三重底做多，而不是赌反转。","pid":"p53"},{"t":"para","text":"总结：上升趋势中的持续形态分为二推和三推两大类，无论哪一种形态，他的回调都是逆势向下推动，但最终这些空头力量无法创造出新的急速下跌，而是被多头反超，延续上涨的行情，除了二段式回调和三推下降旗型，每一推可以勉强维持同等力道，将价格打压更低之外，其他的4种形态，二，三推都较为乏力。","pid":"p54"},{"t":"img","src":"assets/img/base_005.webp","ilabel":"B-5","icap":"价格行为基础（繁体）","fid":"fig5","ctx":[{"t":"趋势倾向延续，在上升趋势中应该寻找逆势力量衰弱的证据后（回调）入场做多。因此在上升趋势中应该寻找三重底做多，而不是赌反转。","p":"p53"},{"t":"总结：上升趋势中的持续形态分为二推和三推两大类，无论哪一种形态，他的回调都是逆势向下推动，但最终这些空头力量无法创造出新的急速下跌，而是被多头反超，延续上涨的行情，除了二段式回调和三推下降旗型，每一推可以勉强维持同等力道，将价格打压更低之外，其他的4种形态，二，三推都较为乏力。","p":"p54"}]},{"t":"img","src":"assets/img/base_006.webp","ilabel":"B-6","icap":"价格行为基础（繁体）","fid":"fig6","ctx":[{"t":"原理相同，但是方向不同，则是下降趋势中的持续形态。","p":"p55"},{"t":"旗型与楔形：","p":"p56"},{"t":"趋势方向朝上，形态方向朝下（三推下降旗型）三推下降楔形 牛旗","p":"p57"},{"t":"趋势方向朝下，形态方向超上（三推上升旗型）三推上升楔形 熊旗","p":"p58"},{"t":"【價格行為基礎 10】什麼是反轉形態？原來根本不存在反轉形態？90% 散戶都學錯了！","p":"p59"},{"t":"趋势反转的条件1.顺势力量离场。2.新力量不入场。3.逆势力量入场。","p":"p60"},{"t":"趋势反转的本质：顺势的突破失败。反转形态的特征：顺势缺乏跟进力量。","p":"p61"},{"t":"现实的情况是，出现三推楔形后，甚至是其他的反转形态之后，行情任然朝着趋势方向延续，因为趋势倾向延续，反转倾向失败。反转形态胜率高的错觉是因为复盘起来清晰可见。","p":"p62"},{"t":"如何处理逆势交易？不参与逆势交易。忘记反转形态的存在，把所以回调视作持续形态。如果一定要参与反转，就不要做突破，而是背靠显而易见的支撑和阻力，寻找反转信号，提前入场。","p":"p63"},{"t":"最安全的做法，就是不以反转形态参与逆势交易，而是主观认定他们仍然会使得行情持续，选择空仓观望。如果一定要参与，1:1盈亏比后就离场，提前止盈。","p":"p64"},{"t":"【價格行為基礎 11】什麼是交易區間？區間為什麼能使多數突破策略失效？","p":"p65"},{"t":"什么状态下，做反转的交易胜率更高，熊市中的印钞机-交易区间。","p":"p66"},{"t":"交易区间：存在双边交易的区域，多空双方都伺机介入，多空双方都未能主宰行情。","p":"p67"},{"t":"区间的形成：首先顺势方在价格推动到极致之后，显示出现一次逆势的回调，而回调结束之后，顺势尝试继续发起新的急速，将趋势延续下去，却因为缺乏更进力量，而失败了，价格再一次被逆势驳回，如此反复。顺势逆势都无法主宰行情。4个点2条线构成区间，为后续交易提供参考。","p":"p68"},{"t":"区间的特性：倾向于突破失败。","p":"p69"},{"t":"在区间边缘出现反转信号后再入场交易，越趋近边线，反向运动倾向越强，越趋近中线，运动方向越随机（中线建议止盈）。当大阳线或大阴线逼近边线，通常是动能耗尽。","p":"p70"},{"t":"【價格行為基礎 12】什麼是交易系統？你距離穩定盈利的一步之遙","p":"p71"},{"t":"交易系统-交易的规章，准则，使我们可以抵御交易世界的不确定性。","p":"p72"},{"t":"设立规则：什么可以做，什么不可以做。","p":"p73"},{"t":"系统设计：符合相同规范，具有一致性，具备统计价值，正期望值=长期稳定盈利。","p":"p74"},{"t":"借由系统来执行交易","p":"p75"},{"t":"1.建立标准化的流程。2.具有一致性，具有统计价值，计算期望值，检讨优化。3.交易员与运动员高度类似，维持高品质的重复。","p":"p76"},{"t":"【價格行為基礎 13】什麼是見位入場和破位入場？選擇交易類型作為搭建交易系統的第一步","p":"p77"},{"t":"交易的类型三种类型：顺势，逆势，区间。","p":"p78"},{"t":"决定交易时间级别，设立入场与止损规则，设立出场与止盈规则。","p":"p79"},{"t":"顺势交易，在相对安全的右侧交易中，顺势交易都是在回调中进行的，可以细分为见位和破位。见位:支撑+反转信号+入场做多。逻辑：逆势突破失败，逆势缺乏力量。","p":"p80"},{"t":"破位:阻力+突破。 逻辑:顺势突破成功，顺势展现力量，突破入场低胜率高盈亏比。","p":"p81"},{"t":"区间交易类型：区间突破成功与失败。","p":"p82"},{"t":"突破失败:支撑加反转信号，高胜率，低盈亏比。","p":"p83"},{"t":"突破成功:平衡终将打破，加入更强一方，有波段预期。钻研一种稳定盈利后再考虑其他方法。","p":"p84"},{"t":"【價格行為基礎 14】如何選擇交易時間級別？又如何決定持倉方式？短線、中線、長線究竟是指什麼？","p":"p85"},{"t":"多久看一次盘面就选择该时间周期为交易时间。时间短就选择4小时。","p":"p86"},{"t":"精力是做交易的最大限制，必须找到符合自己的工作，作息，认知和经验的时间级别。","p":"p87"},{"t":"短时间面临过多的噪音做出决策，必须具备更大的专注力和更精良读图的能力。通常显示150-200根K线。使用1小时图表那么周线级别就是168根K线。","p":"p88"}]},{"t":"para","text":"原理相同，但是方向不同，则是下降趋势中的持续形态。","pid":"p55"},{"t":"para","text":"旗型与楔形：","pid":"p56"},{"t":"para","text":"趋势方向朝上，形态方向朝下（三推下降旗型）三推下降楔形 牛旗","pid":"p57"},{"t":"para","text":"趋势方向朝下，形态方向超上（三推上升旗型）三推上升楔形 熊旗","pid":"p58"},{"t":"para","text":"【價格行為基礎 10】什麼是反轉形態？原來根本不存在反轉形態？90% 散戶都學錯了！","pid":"p59"},{"t":"para","text":"趋势反转的条件1.顺势力量离场。2.新力量不入场。3.逆势力量入场。","pid":"p60"},{"t":"para","text":"趋势反转的本质：顺势的突破失败。反转形态的特征：顺势缺乏跟进力量。","pid":"p61"},{"t":"para","text":"现实的情况是，出现三推楔形后，甚至是其他的反转形态之后，行情任然朝着趋势方向延续，因为趋势倾向延续，反转倾向失败。反转形态胜率高的错觉是因为复盘起来清晰可见。","pid":"p62"},{"t":"para","text":"如何处理逆势交易？不参与逆势交易。忘记反转形态的存在，把所以回调视作持续形态。如果一定要参与反转，就不要做突破，而是背靠显而易见的支撑和阻力，寻找反转信号，提前入场。","pid":"p63"},{"t":"para","text":"最安全的做法，就是不以反转形态参与逆势交易，而是主观认定他们仍然会使得行情持续，选择空仓观望。如果一定要参与，1:1盈亏比后就离场，提前止盈。","pid":"p64"},{"t":"para","text":"【價格行為基礎 11】什麼是交易區間？區間為什麼能使多數突破策略失效？","pid":"p65"},{"t":"para","text":"什么状态下，做反转的交易胜率更高，熊市中的印钞机-交易区间。","pid":"p66"},{"t":"para","text":"交易区间：存在双边交易的区域，多空双方都伺机介入，多空双方都未能主宰行情。","pid":"p67"},{"t":"para","text":"区间的形成：首先顺势方在价格推动到极致之后，显示出现一次逆势的回调，而回调结束之后，顺势尝试继续发起新的急速，将趋势延续下去，却因为缺乏更进力量，而失败了，价格再一次被逆势驳回，如此反复。顺势逆势都无法主宰行情。4个点2条线构成区间，为后续交易提供参考。","pid":"p68"},{"t":"para","text":"区间的特性：倾向于突破失败。","pid":"p69"},{"t":"para","text":"在区间边缘出现反转信号后再入场交易，越趋近边线，反向运动倾向越强，越趋近中线，运动方向越随机（中线建议止盈）。当大阳线或大阴线逼近边线，通常是动能耗尽。","pid":"p70"},{"t":"para","text":"【價格行為基礎 12】什麼是交易系統？你距離穩定盈利的一步之遙","pid":"p71"},{"t":"para","text":"交易系统-交易的规章，准则，使我们可以抵御交易世界的不确定性。","pid":"p72"},{"t":"para","text":"设立规则：什么可以做，什么不可以做。","pid":"p73"},{"t":"para","text":"系统设计：符合相同规范，具有一致性，具备统计价值，正期望值=长期稳定盈利。","pid":"p74"},{"t":"para","text":"借由系统来执行交易","pid":"p75"},{"t":"para","text":"1.建立标准化的流程。2.具有一致性，具有统计价值，计算期望值，检讨优化。3.交易员与运动员高度类似，维持高品质的重复。","pid":"p76"},{"t":"para","text":"【價格行為基礎 13】什麼是見位入場和破位入場？選擇交易類型作為搭建交易系統的第一步","pid":"p77"},{"t":"para","text":"交易的类型三种类型：顺势，逆势，区间。","pid":"p78"},{"t":"para","text":"决定交易时间级别，设立入场与止损规则，设立出场与止盈规则。","pid":"p79"},{"t":"para","text":"顺势交易，在相对安全的右侧交易中，顺势交易都是在回调中进行的，可以细分为见位和破位。见位:支撑+反转信号+入场做多。逻辑：逆势突破失败，逆势缺乏力量。","pid":"p80"},{"t":"para","text":"破位:阻力+突破。 逻辑:顺势突破成功，顺势展现力量，突破入场低胜率高盈亏比。","pid":"p81"},{"t":"para","text":"区间交易类型：区间突破成功与失败。","pid":"p82"},{"t":"para","text":"突破失败:支撑加反转信号，高胜率，低盈亏比。","pid":"p83"},{"t":"para","text":"突破成功:平衡终将打破，加入更强一方，有波段预期。钻研一种稳定盈利后再考虑其他方法。","pid":"p84"},{"t":"para","text":"【價格行為基礎 14】如何選擇交易時間級別？又如何決定持倉方式？短線、中線、長線究竟是指什麼？","pid":"p85"},{"t":"para","text":"多久看一次盘面就选择该时间周期为交易时间。时间短就选择4小时。","pid":"p86"},{"t":"para","text":"精力是做交易的最大限制，必须找到符合自己的工作，作息，认知和经验的时间级别。","pid":"p87"},{"t":"para","text":"短时间面临过多的噪音做出决策，必须具备更大的专注力和更精良读图的能力。通常显示150-200根K线。使用1小时图表那么周线级别就是168根K线。","pid":"p88"},{"t":"img","src":"assets/img/base_007.webp","ilabel":"B-7","icap":"价格行为基础（繁体）","fid":"fig7","ctx":[{"t":"精力是做交易的最大限制，必须找到符合自己的工作，作息，认知和经验的时间级别。","p":"p87"},{"t":"短时间面临过多的噪音做出决策，必须具备更大的专注力和更精良读图的能力。通常显示150-200根K线。使用1小时图表那么周线级别就是168根K线。","p":"p88"},{"t":"【價格行為基礎 15】如何設定止損與止盈？虧損時常源自糟糕的離場方法！","p":"p89"},{"t":"止损分为两类，前波段高低点止损和atr止损，不要放宽止损，认错离场。atr止损：顺势破位，区间突破成功，突破时数值将变大。atr乘以2作为止损距离，统一规则，一致性止损原则。固定盈亏比止盈1:1，1:1.5，1:2。新手选择前波段高低点和固定止盈止损。","p":"p90"},{"t":"【價格行為基礎 16】系統如何操作、如何優化？直接示範一套交易系統給你看！","p":"p91"},{"t":"规则是因人而异，且需要追踪调整的。规则清晰是必要条件，当遇到问题，（那倒是）规定的不够清楚，多做测试，纳入更有利可图的新规则，不断思考系统是否有优化的空间。","p":"p92"},{"t":"價格行為進階","p":"p93"},{"t":"【價格行為進階 01】通道作為趨勢的延續：通道行情交易要點","p":"p94"},{"t":"一轮趋势必然包含着急速阶段和通道阶段。","p":"p95"},{"t":"顺势通道的基本内涵:","p":"p96"},{"t":"1.通道时常紧接在急速后，是动能较低的趋势性运动。2.动能降低代表着多空都在场内的双边交易状态。3.所有通道都是能引发反方向行情的旗型。上升通道是熊旗，下降通道牛旗。","p":"p97"},{"t":"熊旗与牛旗确实能引发逆势的行情，但有效范围有限，通常测试通道的起点。","p":"p98"},{"t":"8个步骤:1.急速2.通道3.过冲（突破失败的折返）4.对趋势线的突破。5.测试前高顺势极值。6.再测试通道的起点。7.形成区间。8.再引发顺势突破。","p":"p99"},{"t":"常见的例外情况：1.过冲通道线后直接发生新的急速，2.通道起点未能撑住，直接演变为趋势反转，揣摩多空双方可能的意图，之后在关键价位要清楚知道注意哪种类型的价格行运动，用何种应对方案介入更为理智。","p":"p100"},{"t":"【價格行為進階 02】高勝率的突破形式：急速行情交易要點","p":"p101"},{"t":"三个需要了解的问题：","p":"p102"},{"t":"1.哪种突破形式胜率更高？趋势K线-急速运动。实体部分越长影线越短，K线动能越强劲。","p":"p103"},{"t":"大阳线突破-多头单方面主宰，空头则退出观望，胜率较高，急速动能强劲的突破。","p":"p104"},{"t":"2.突破成败有何本质区别？如果只是逼近边线，那么无论上升的过程看起来多么强劲，都可能只是真空所导致的高潮行情。价格快速运动至此，并不是多头强劲表现，而只是过程中的缺乏对手，无人抵抗而已，如果边线出现反向订单，突破就会倾向失败。成功的突破是到了关键位置，也不见空头入场，因此能够大幅的穿越封锁线。","p":"p105"},{"t":"3.急速突破后可以测算多少利润？急速通道行情时常是由三段推动所完成的，急速是一段，终结于第一根阴线或内包十字线之类的停止K线，而回调结束后还会有两段上涨，形成一个总共三推的结构，急速与通道时常会走出等距行情，从突破发生的那根趋势K线算起，第一根停止K线为终点，这一段运行的距离通常会是尔后通道极值所能够达到的位置。","p":"p106"},{"t":"市场通常要进行某种尝试，并失败两次之后，交易者才会确信原先的如意算盘没有办法成真。这时集体预期与集体行为会使得市场展开相反的尝试，向上突破失败，转为深度回调。","p":"p107"},{"t":"【價格行為進階 03】捕捉絕佳反轉點：高潮行情交易要點","p":"p108"},{"t":"每根趋势K线都带有急速，突破，缺口，高潮至少一种或多种形式。订单真空所导致的幅度过大，速度过快的运动正是动能即将耗尽的高潮行情。","p":"p109"},{"t":"两种常见的高潮：一种发生在宽幅的区间边线附近，逼近区间上下沿的趋势K线经常代表动能耗尽。第二种，三段推动后与前波段点重合的对决线行情。","p":"p110"},{"t":"具备预判趋势末尾的高潮行情能力，清楚的计算推动次数则是关键要点。","p":"p111"},{"t":"对决线行情的必要条件：1.清晰的三段推动，2.工整的通道线，3.快速扩充到支撑阻力，4.确切发生的反转。","p":"p112"},{"t":"只要你具备逐根阅读K线的能力，在一根一根K线逐渐显露，提供越来越多的讯息的过程中，你就能够真正感受到多空竞和的节奏。【價格行為進階 04】如何找出最易把握、最具數學優勢的每日交易機會？","p":"p113"},{"t":"1.甄别市场状态，以急速，通道，区间为图表的各个段落分类。分类后再检索更小规模的急速，通道与区间。","p":"p114"},{"t":"2.描绘运行斜率，为通道画上趋势线与通道线，表达其运行节奏与规律。","p":"p115"},{"t":"3.标记关键价位，识别重要的曾发挥过作用的关键价位，是价格反向运行的支撑与阻力。","p":"p116"},{"t":"4.寻找建仓形态，找出曾经学过具有数学优势的入场位置。","p":"p117"},{"t":"比如：1.三推楔形，高一做多，顺势入场，信号K线低点下方止损。2.急速与通道的入场形态：（三推反转建仓形态），急速与通道时常在第三推结束，第三推对于第二推的极值突破显然未能成功，因此就有了做空的理由。以信号K线高点上方一点点作为止损距离，下方通道起点作为止盈目标位是合理的选择，反转通常测试通道起点。3.对决线建仓形态。","p":"p118"},{"t":"如果你不去练习拆解一张图表的流程，既分辨不出市场状态，也不熟悉绘图工具的使用，更对于那些有利可图的建仓形态感到生疏，那在K线一根一根形成的当下，要能够精准的，稳定的交易，那简直想都别想。事后都读不出来，现场交易肯定失败。","p":"p119"},{"t":"【價格行為進階 05】成功的突破所具有的四項特徵","p":"p120"},{"t":"想要及早介入趋势的我们如何甄别有效的突破？趋势为什么会发起？价格何以从区间中突破，开启一段长远的极速运动？","p":"p121"},{"t":"区间突破上沿是由于空头止损，多头加仓，空仓观望者跟进，三者的合力使得区间的合意被打破。市场从均衡快速进入失衡状态，也就成就了突破。","p":"p122"},{"t":"成功的趋势性行情特征:","p":"p123"},{"t":"1.突破K线，实体更长，影线更短。","p":"p124"},{"t":"2.急速运行颇远，穿透多项潜在阻力，突破越强越远越久，趋势越可能成功。","p":"p125"},{"t":"3.急速至少在三根K线后才停顿或回调。发生急速突破，回调的越早，离突破点越近，要怀疑突破的有效性。突破后立即出现回调，预示着趋势动能的逐渐衰弱。","p":"p126"},{"t":"4.回调不到突破点，不触及入场价止损。首次回调不应该测试到突破点，也就随之不会触发突破交易者的盈亏平衡止损订单。指的是在突破之际，早早入场的交易者并没有被后续的小回调所逼急，造成严重的利润回吐，乃至浮亏，他们更有底气持仓。","p":"p127"},{"t":"成功的突破—不停延续，且不怎么回调的趋势。","p":"p128"},{"t":"突破发起之初—反向交易者止损。","p":"p129"},{"t":"突破发起之后—动能交易者的追进。","p":"p130"},{"t":"其他突破的特征：","p":"p131"},{"t":"1.突破 K 線為實體很長、影線很小的趨勢陽線 。","p":"p132"},{"t":"2.交易量為近期 K 線交易量的 10－20 倍 。","p":"p133"},{"t":"3.急速運行距離很遠，持續多根 K 線且突破數項潛在阻力（如 EMA20、前波段點、趨勢線）。","p":"p134"},{"t":"4.急速運行距離很遠，且中途不出現超過 1 根停止 K 線或逆勢 K 線。","p":"p135"},{"t":"5.突破的首根 K 線形成過程中，多數時候價格盤踞在該 K 線高位，回調幅度不及四分之一。6.使你感到急迫（你試圖等待回調時買入，但回調未曾出現）。","p":"p136"},{"t":"7.接下來的兩、三根延續 K 線亦為趨勢陽線，且長度不小，至少不低於近期平均。","p":"p137"},{"t":"8.突破前波段點後，剝頭皮交易者足以獲利。","p":"p138"},{"t":"9.急速運行過程中有至少 1 根 K 線的最低價，處於前一根 K 線的收盤價或其下方 1個 tick 處。","p":"p139"},{"t":"10.急速運行過程中有至少1根K線的開盤價，高於前一根 K 線的收盤價。","p":"p140"},{"t":"11.急速運行過程中有至少1根K線的收盤價，處於其最高價或其下方1個tick 處（光頭）。","p":"p141"},{"t":"12.跳空高開且留下測量缺口（代表了小時間級別的艾略特一浪終點與四浪終點並不交疊）。","p":"p142"},{"t":"13.有利的市場脈絡，如：a.回調後的趨勢恢復 b.強勢突破下降趨勢線後對下跌低點完成測試 c.市場近期出現多個強勢上漲趨勢交易日 d.區間內的買壓加強（區間內的趨勢陽線數量遠多於趨勢陰線）。","p":"p143"},{"t":"14.首次回調發生在急速突破運行了至少3根K 線以後。","p":"p144"},{"t":"15.首次回調僅持續1、2根K線，且不緊接著強勢反轉陰線。","p":"p145"},{"t":"16.首次回調不能測試到突破點，也不觸發突破交易者的盈虧平衡止損訂單。","p":"p146"},{"t":"17.突破的收盤價反轉了、超越了許多5－20 根 K 線（牛旗、區間等）的最高價與收盤價。【價格行為進階 06】跳空缺口的傳統用法與進階理解","p":"p147"},{"t":"什么是缺口？它代表图表上一段没有交易发生过的价格地带，一旦两根K线的收盘价和开盘价有所落差，看起来就会存在断裂的孔洞。","p":"p148"},{"t":"股价趋势技术技术分析第12章将缺口分为突破，测量，衰减缺口三种类型。","p":"p149"},{"t":"突破缺口，引发趋势，测量缺口是中继趋势，衰减缺口则起到结束趋势的效果。","p":"p150"},{"t":"突破缺口—强劲突破，动能进发。代表空头放弃，多头发力，是一轮上涨趋势的开始。","p":"p151"},{"t":"测量缺口—又称为中继缺口，在趋势中段会出现，代表多头动能即使发动已久，依然还保有再次击败空头的续航力，交易者经常预期它作为趋势的中点，以此还能测算一段等距的运行。","p":"p152"},{"t":"衰竭缺口—则通常是在趋势尾段，价格快速逼近重大支撑阻力之前产生的跳空。这是真空效应引发的最后冲刺，往往这一次上涨会导致趋势的深度回调，乃至于改变为反转。","p":"p153"},{"t":"所有趋势K线都跟缺口等效。价格与趋势K线形成快速过冲到波段点上的“高潮”行为与跳空抵达所形成的所谓衰竭缺口一模一样。","p":"p154"},{"t":"当我们观察到一个重要的水平位置，被趋势K线果断的突破该趋势K线起的作用也可以等效于突破缺口跟测量缺口。","p":"p155"},{"t":"1.测量缺口引发等距运动基于什么原理？","p":"p156"},{"t":"首先让我们回想Measured Move的运行原理是什么，是机构在进行数学胜率判定，趋势方向胜率感到有信心胜率为60%，反之40%，使用Measured Move测算等距1：1运动，可以准确把握数学优势，所以，这是因为机构进行数学运算，所导致的测量缺口等距运动原理。","p":"p157"},{"t":"2.缺口倾向被封闭，缺口常有支撑阻力作用。为什么缺口具有以上特质？","p":"p158"},{"t":"1.不是所有缺口都倾向被回补，例如两种突破与测量缺口，都代表趋势中的动力表现，比较容易被回补的是衰竭缺口，通常处于趋势的末端，逆势方后续发起进攻，所以通常会比较快被回补。2.为什么是支撑阻力，有一大部分交易者原本在缺口处挂单/止损，但是价格直接跳空，当价格回到缺口附近，原本没成交的订单就会成交，这些行为会引发买盘/支撑，卖盘/阻力。","p":"p159"},{"t":"【價格行為進階 07】「牛／熊旗」與「通道」是否可以一視同仁地交易？","p":"p160"},{"t":"牛/熊旗分别看涨还是看跌？牛熊旗是否等同通道？怎样交易牛/熊旗更具数学优势？","p":"p161"},{"t":"Bull flag指的是看涨的旗型，实际是下降的棋子。更准确的应该称为Bullish flag。","p":"p162"},{"t":"所有上升通道都是熊旗，倾向向下突破，所有下降通道都是牛旗倾向向上突破。","p":"p163"},{"t":"如果有一个相对平缓的下降通道是嵌于上升趋势之中，那基于趋势倾向延续的原理，这个通道对空头而言就不妙了。首先，上升趋势中突然出现阴线，多半是多头主动止盈所导致的。而不是因为有足够多激进的空头尝试摸顶，因此一旦想止盈的多头卖的差不多，价格又低到足以让他们认为划算，可以重新进场。那（空头）止盈启动，回调就会结束。再来，即使真的有部分的空头主动建仓，他们也会忌惮前方的上升趋势，选择只争取剥头皮的利润，而不是长时间持有仓位，这些与阴线不时交错出现的阳线就是证据。他们是逆势剥头皮交易者的止盈买入，会合那些逢低重新建仓的多头订单。同时这也是正是所谓买压的累积，基于以上理由，你会发现阴线得不到有效的延续。他们时而出现，但总是不够强劲到能够创造出下跌急速。","p":"p164"},{"t":"下降趋势中也是同样的结果，如果前方有一段下跌急速，但随后转为下跌通道。代表空头有人提前止盈离场，而多头变得激进。价格斜率的改变就是多空竞争状态，竞争节奏的改变，如果空头依然强势无比，精明的多头机构不会认为这里有接刀的价值。还是默默等待价格走到更低的位置。那多头都有出现，就代表他们已经观察到趋势力量的溃散。因此通道阶段作为趋势的强弩之末区间性格越发强烈。如果通到终点再汇合的重要支撑，那多头就更有理由变得积极进取。终于导致向上突破。","p":"p165"},{"t":"交易要点:","p":"p166"},{"t":"1.首先嵌于趋势中的逆势通道，你最好寻找背靠支撑阻力的见位交易机会。比如我们常听到突破回调去尝试以逆势通道的形式测试到突破点上。","p":"p167"}]},{"t":"para","text":"【價格行為基礎 15】如何設定止損與止盈？虧損時常源自糟糕的離場方法！","pid":"p89"},{"t":"para","text":"止损分为两类，前波段高低点止损和atr止损，不要放宽止损，认错离场。atr止损：顺势破位，区间突破成功，突破时数值将变大。atr乘以2作为止损距离，统一规则，一致性止损原则。固定盈亏比止盈1:1，1:1.5，1:2。新手选择前波段高低点和固定止盈止损。","pid":"p90"},{"t":"para","text":"【價格行為基礎 16】系統如何操作、如何優化？直接示範一套交易系統給你看！","pid":"p91"},{"t":"para","text":"规则是因人而异，且需要追踪调整的。规则清晰是必要条件，当遇到问题，（那倒是）规定的不够清楚，多做测试，纳入更有利可图的新规则，不断思考系统是否有优化的空间。","pid":"p92"},{"t":"para","text":"價格行為進階","pid":"p93"},{"t":"para","text":"【價格行為進階 01】通道作為趨勢的延續：通道行情交易要點","pid":"p94"},{"t":"para","text":"一轮趋势必然包含着急速阶段和通道阶段。","pid":"p95"},{"t":"para","text":"顺势通道的基本内涵:","pid":"p96"},{"t":"para","text":"1.通道时常紧接在急速后，是动能较低的趋势性运动。2.动能降低代表着多空都在场内的双边交易状态。3.所有通道都是能引发反方向行情的旗型。上升通道是熊旗，下降通道牛旗。","pid":"p97"},{"t":"para","text":"熊旗与牛旗确实能引发逆势的行情，但有效范围有限，通常测试通道的起点。","pid":"p98"},{"t":"para","text":"8个步骤:1.急速2.通道3.过冲（突破失败的折返）4.对趋势线的突破。5.测试前高顺势极值。6.再测试通道的起点。7.形成区间。8.再引发顺势突破。","pid":"p99"},{"t":"para","text":"常见的例外情况：1.过冲通道线后直接发生新的急速，2.通道起点未能撑住，直接演变为趋势反转，揣摩多空双方可能的意图，之后在关键价位要清楚知道注意哪种类型的价格行运动，用何种应对方案介入更为理智。","pid":"p100"},{"t":"para","text":"【價格行為進階 02】高勝率的突破形式：急速行情交易要點","pid":"p101"},{"t":"para","text":"三个需要了解的问题：","pid":"p102"},{"t":"para","text":"1.哪种突破形式胜率更高？趋势K线-急速运动。实体部分越长影线越短，K线动能越强劲。","pid":"p103"},{"t":"para","text":"大阳线突破-多头单方面主宰，空头则退出观望，胜率较高，急速动能强劲的突破。","pid":"p104"},{"t":"para","text":"2.突破成败有何本质区别？如果只是逼近边线，那么无论上升的过程看起来多么强劲，都可能只是真空所导致的高潮行情。价格快速运动至此，并不是多头强劲表现，而只是过程中的缺乏对手，无人抵抗而已，如果边线出现反向订单，突破就会倾向失败。成功的突破是到了关键位置，也不见空头入场，因此能够大幅的穿越封锁线。","pid":"p105"},{"t":"para","text":"3.急速突破后可以测算多少利润？急速通道行情时常是由三段推动所完成的，急速是一段，终结于第一根阴线或内包十字线之类的停止K线，而回调结束后还会有两段上涨，形成一个总共三推的结构，急速与通道时常会走出等距行情，从突破发生的那根趋势K线算起，第一根停止K线为终点，这一段运行的距离通常会是尔后通道极值所能够达到的位置。","pid":"p106"},{"t":"para","text":"市场通常要进行某种尝试，并失败两次之后，交易者才会确信原先的如意算盘没有办法成真。这时集体预期与集体行为会使得市场展开相反的尝试，向上突破失败，转为深度回调。","pid":"p107"},{"t":"para","text":"【價格行為進階 03】捕捉絕佳反轉點：高潮行情交易要點","pid":"p108"},{"t":"para","text":"每根趋势K线都带有急速，突破，缺口，高潮至少一种或多种形式。订单真空所导致的幅度过大，速度过快的运动正是动能即将耗尽的高潮行情。","pid":"p109"},{"t":"para","text":"两种常见的高潮：一种发生在宽幅的区间边线附近，逼近区间上下沿的趋势K线经常代表动能耗尽。第二种，三段推动后与前波段点重合的对决线行情。","pid":"p110"},{"t":"para","text":"具备预判趋势末尾的高潮行情能力，清楚的计算推动次数则是关键要点。","pid":"p111"},{"t":"para","text":"对决线行情的必要条件：1.清晰的三段推动，2.工整的通道线，3.快速扩充到支撑阻力，4.确切发生的反转。","pid":"p112"},{"t":"para","text":"只要你具备逐根阅读K线的能力，在一根一根K线逐渐显露，提供越来越多的讯息的过程中，你就能够真正感受到多空竞和的节奏。【價格行為進階 04】如何找出最易把握、最具數學優勢的每日交易機會？","pid":"p113"},{"t":"para","text":"1.甄别市场状态，以急速，通道，区间为图表的各个段落分类。分类后再检索更小规模的急速，通道与区间。","pid":"p114"},{"t":"para","text":"2.描绘运行斜率，为通道画上趋势线与通道线，表达其运行节奏与规律。","pid":"p115"},{"t":"para","text":"3.标记关键价位，识别重要的曾发挥过作用的关键价位，是价格反向运行的支撑与阻力。","pid":"p116"},{"t":"para","text":"4.寻找建仓形态，找出曾经学过具有数学优势的入场位置。","pid":"p117"},{"t":"para","text":"比如：1.三推楔形，高一做多，顺势入场，信号K线低点下方止损。2.急速与通道的入场形态：（三推反转建仓形态），急速与通道时常在第三推结束，第三推对于第二推的极值突破显然未能成功，因此就有了做空的理由。以信号K线高点上方一点点作为止损距离，下方通道起点作为止盈目标位是合理的选择，反转通常测试通道起点。3.对决线建仓形态。","pid":"p118"},{"t":"para","text":"如果你不去练习拆解一张图表的流程，既分辨不出市场状态，也不熟悉绘图工具的使用，更对于那些有利可图的建仓形态感到生疏，那在K线一根一根形成的当下，要能够精准的，稳定的交易，那简直想都别想。事后都读不出来，现场交易肯定失败。","pid":"p119"},{"t":"para","text":"【價格行為進階 05】成功的突破所具有的四項特徵","pid":"p120"},{"t":"para","text":"想要及早介入趋势的我们如何甄别有效的突破？趋势为什么会发起？价格何以从区间中突破，开启一段长远的极速运动？","pid":"p121"},{"t":"para","text":"区间突破上沿是由于空头止损，多头加仓，空仓观望者跟进，三者的合力使得区间的合意被打破。市场从均衡快速进入失衡状态，也就成就了突破。","pid":"p122"},{"t":"para","text":"成功的趋势性行情特征:","pid":"p123"},{"t":"para","text":"1.突破K线，实体更长，影线更短。","pid":"p124"},{"t":"para","text":"2.急速运行颇远，穿透多项潜在阻力，突破越强越远越久，趋势越可能成功。","pid":"p125"},{"t":"para","text":"3.急速至少在三根K线后才停顿或回调。发生急速突破，回调的越早，离突破点越近，要怀疑突破的有效性。突破后立即出现回调，预示着趋势动能的逐渐衰弱。","pid":"p126"},{"t":"para","text":"4.回调不到突破点，不触及入场价止损。首次回调不应该测试到突破点，也就随之不会触发突破交易者的盈亏平衡止损订单。指的是在突破之际，早早入场的交易者并没有被后续的小回调所逼急，造成严重的利润回吐，乃至浮亏，他们更有底气持仓。","pid":"p127"},{"t":"para","text":"成功的突破—不停延续，且不怎么回调的趋势。","pid":"p128"},{"t":"para","text":"突破发起之初—反向交易者止损。","pid":"p129"},{"t":"para","text":"突破发起之后—动能交易者的追进。","pid":"p130"},{"t":"para","text":"其他突破的特征：","pid":"p131"},{"t":"para","text":"1.突破 K 線為實體很長、影線很小的趨勢陽線 。","pid":"p132"},{"t":"para","text":"2.交易量為近期 K 線交易量的 10－20 倍 。","pid":"p133"},{"t":"para","text":"3.急速運行距離很遠，持續多根 K 線且突破數項潛在阻力（如 EMA20、前波段點、趨勢線）。","pid":"p134"},{"t":"para","text":"4.急速運行距離很遠，且中途不出現超過 1 根停止 K 線或逆勢 K 線。","pid":"p135"},{"t":"para","text":"5.突破的首根 K 線形成過程中，多數時候價格盤踞在該 K 線高位，回調幅度不及四分之一。6.使你感到急迫（你試圖等待回調時買入，但回調未曾出現）。","pid":"p136"},{"t":"para","text":"7.接下來的兩、三根延續 K 線亦為趨勢陽線，且長度不小，至少不低於近期平均。","pid":"p137"},{"t":"para","text":"8.突破前波段點後，剝頭皮交易者足以獲利。","pid":"p138"},{"t":"para","text":"9.急速運行過程中有至少 1 根 K 線的最低價，處於前一根 K 線的收盤價或其下方 1個 tick 處。","pid":"p139"},{"t":"para","text":"10.急速運行過程中有至少1根K線的開盤價，高於前一根 K 線的收盤價。","pid":"p140"},{"t":"para","text":"11.急速運行過程中有至少1根K線的收盤價，處於其最高價或其下方1個tick 處（光頭）。","pid":"p141"},{"t":"para","text":"12.跳空高開且留下測量缺口（代表了小時間級別的艾略特一浪終點與四浪終點並不交疊）。","pid":"p142"},{"t":"para","text":"13.有利的市場脈絡，如：a.回調後的趨勢恢復 b.強勢突破下降趨勢線後對下跌低點完成測試 c.市場近期出現多個強勢上漲趨勢交易日 d.區間內的買壓加強（區間內的趨勢陽線數量遠多於趨勢陰線）。","pid":"p143"},{"t":"para","text":"14.首次回調發生在急速突破運行了至少3根K 線以後。","pid":"p144"},{"t":"para","text":"15.首次回調僅持續1、2根K線，且不緊接著強勢反轉陰線。","pid":"p145"},{"t":"para","text":"16.首次回調不能測試到突破點，也不觸發突破交易者的盈虧平衡止損訂單。","pid":"p146"},{"t":"para","text":"17.突破的收盤價反轉了、超越了許多5－20 根 K 線（牛旗、區間等）的最高價與收盤價。【價格行為進階 06】跳空缺口的傳統用法與進階理解","pid":"p147"},{"t":"para","text":"什么是缺口？它代表图表上一段没有交易发生过的价格地带，一旦两根K线的收盘价和开盘价有所落差，看起来就会存在断裂的孔洞。","pid":"p148"},{"t":"para","text":"股价趋势技术技术分析第12章将缺口分为突破，测量，衰减缺口三种类型。","pid":"p149"},{"t":"para","text":"突破缺口，引发趋势，测量缺口是中继趋势，衰减缺口则起到结束趋势的效果。","pid":"p150"},{"t":"para","text":"突破缺口—强劲突破，动能进发。代表空头放弃，多头发力，是一轮上涨趋势的开始。","pid":"p151"},{"t":"para","text":"测量缺口—又称为中继缺口，在趋势中段会出现，代表多头动能即使发动已久，依然还保有再次击败空头的续航力，交易者经常预期它作为趋势的中点，以此还能测算一段等距的运行。","pid":"p152"},{"t":"para","text":"衰竭缺口—则通常是在趋势尾段，价格快速逼近重大支撑阻力之前产生的跳空。这是真空效应引发的最后冲刺，往往这一次上涨会导致趋势的深度回调，乃至于改变为反转。","pid":"p153"},{"t":"para","text":"所有趋势K线都跟缺口等效。价格与趋势K线形成快速过冲到波段点上的“高潮”行为与跳空抵达所形成的所谓衰竭缺口一模一样。","pid":"p154"},{"t":"para","text":"当我们观察到一个重要的水平位置，被趋势K线果断的突破该趋势K线起的作用也可以等效于突破缺口跟测量缺口。","pid":"p155"},{"t":"para","text":"1.测量缺口引发等距运动基于什么原理？","pid":"p156"},{"t":"para","text":"首先让我们回想Measured Move的运行原理是什么，是机构在进行数学胜率判定，趋势方向胜率感到有信心胜率为60%，反之40%，使用Measured Move测算等距1：1运动，可以准确把握数学优势，所以，这是因为机构进行数学运算，所导致的测量缺口等距运动原理。","pid":"p157"},{"t":"para","text":"2.缺口倾向被封闭，缺口常有支撑阻力作用。为什么缺口具有以上特质？","pid":"p158"},{"t":"para","text":"1.不是所有缺口都倾向被回补，例如两种突破与测量缺口，都代表趋势中的动力表现，比较容易被回补的是衰竭缺口，通常处于趋势的末端，逆势方后续发起进攻，所以通常会比较快被回补。2.为什么是支撑阻力，有一大部分交易者原本在缺口处挂单/止损，但是价格直接跳空，当价格回到缺口附近，原本没成交的订单就会成交，这些行为会引发买盘/支撑，卖盘/阻力。","pid":"p159"},{"t":"para","text":"【價格行為進階 07】「牛／熊旗」與「通道」是否可以一視同仁地交易？","pid":"p160"},{"t":"para","text":"牛/熊旗分别看涨还是看跌？牛熊旗是否等同通道？怎样交易牛/熊旗更具数学优势？","pid":"p161"},{"t":"para","text":"Bull flag指的是看涨的旗型，实际是下降的棋子。更准确的应该称为Bullish flag。","pid":"p162"},{"t":"para","text":"所有上升通道都是熊旗，倾向向下突破，所有下降通道都是牛旗倾向向上突破。","pid":"p163"},{"t":"para","text":"如果有一个相对平缓的下降通道是嵌于上升趋势之中，那基于趋势倾向延续的原理，这个通道对空头而言就不妙了。首先，上升趋势中突然出现阴线，多半是多头主动止盈所导致的。而不是因为有足够多激进的空头尝试摸顶，因此一旦想止盈的多头卖的差不多，价格又低到足以让他们认为划算，可以重新进场。那（空头）止盈启动，回调就会结束。再来，即使真的有部分的空头主动建仓，他们也会忌惮前方的上升趋势，选择只争取剥头皮的利润，而不是长时间持有仓位，这些与阴线不时交错出现的阳线就是证据。他们是逆势剥头皮交易者的止盈买入，会合那些逢低重新建仓的多头订单。同时这也是正是所谓买压的累积，基于以上理由，你会发现阴线得不到有效的延续。他们时而出现，但总是不够强劲到能够创造出下跌急速。","pid":"p164"},{"t":"para","text":"下降趋势中也是同样的结果，如果前方有一段下跌急速，但随后转为下跌通道。代表空头有人提前止盈离场，而多头变得激进。价格斜率的改变就是多空竞争状态，竞争节奏的改变，如果空头依然强势无比，精明的多头机构不会认为这里有接刀的价值。还是默默等待价格走到更低的位置。那多头都有出现，就代表他们已经观察到趋势力量的溃散。因此通道阶段作为趋势的强弩之末区间性格越发强烈。如果通到终点再汇合的重要支撑，那多头就更有理由变得积极进取。终于导致向上突破。","pid":"p165"},{"t":"para","text":"交易要点:","pid":"p166"},{"t":"para","text":"1.首先嵌于趋势中的逆势通道，你最好寻找背靠支撑阻力的见位交易机会。比如我们常听到突破回调去尝试以逆势通道的形式测试到突破点上。","pid":"p167"},{"t":"img","src":"assets/img/base_008.webp","ilabel":"B-8","icap":"价格行为基础（繁体）","fid":"fig8","ctx":[{"t":"交易要点:","p":"p166"},{"t":"1.首先嵌于趋势中的逆势通道，你最好寻找背靠支撑阻力的见位交易机会。比如我们常听到突破回调去尝试以逆势通道的形式测试到突破点上。","p":"p167"},{"t":"以及趋势初期背靠着ema20的双重顶底或者其他持续形态。也同样是有利可图的建仓形态。","p":"p168"}]},{"t":"para","text":"以及趋势初期背靠着ema20的双重顶底或者其他持续形态。也同样是有利可图的建仓形态。","pid":"p168"},{"t":"img","src":"assets/img/base_009.webp","ilabel":"B-9","icap":"价格行为基础（繁体）","fid":"fig9","ctx":[{"t":"以及趋势初期背靠着ema20的双重顶底或者其他持续形态。也同样是有利可图的建仓形态。","p":"p168"},{"t":"2.在趋势中的顺势通道则是趋势动能衰减的迹象。他时常以三段推动作结，同样背靠着重大的支撑阻力来交易，会大幅提升你的胜率。也提醒一下名称，这是所谓的对决线反转建仓形态、","p":"p169"}]},{"t":"para","text":"2.在趋势中的顺势通道则是趋势动能衰减的迹象。他时常以三段推动作结，同样背靠着重大的支撑阻力来交易，会大幅提升你的胜率。也提醒一下名称，这是所谓的对决线反转建仓形态、","pid":"p169"},{"t":"img","src":"assets/img/base_010.webp","ilabel":"B-10","icap":"价格行为基础（繁体）","fid":"fig10","ctx":[{"t":"2.在趋势中的顺势通道则是趋势动能衰减的迹象。他时常以三段推动作结，同样背靠着重大的支撑阻力来交易，会大幅提升你的胜率。也提醒一下名称，这是所谓的对决线反转建仓形态、","p":"p169"},{"t":"以上这些情况都是常常出现盈利机会。不过要注意的是，牛熊旗的止盈距离最保守，只能测算到通道的起点。这也说过很多遍了。在抵达通道起点看到价格行为的反应以前，你是没有素材可以预测多空谁会胜出的。预先打算贪心持仓就是赌博行为，你很可能会被市场惩罚。","p":"p170"},{"t":"不过死记硬背建仓形态的称呼都没有鸟用，本来就没有形态是完美的。只要多空竞合状态类似，本质也就类似，延续趋势的功能也会类似。","p":"p171"}]},{"t":"para","text":"以上这些情况都是常常出现盈利机会。不过要注意的是，牛熊旗的止盈距离最保守，只能测算到通道的起点。这也说过很多遍了。在抵达通道起点看到价格行为的反应以前，你是没有素材可以预测多空谁会胜出的。预先打算贪心持仓就是赌博行为，你很可能会被市场惩罚。","pid":"p170"},{"t":"para","text":"不过死记硬背建仓形态的称呼都没有鸟用，本来就没有形态是完美的。只要多空竞合状态类似，本质也就类似，延续趋势的功能也会类似。","pid":"p171"},{"t":"img","src":"assets/img/base_011.webp","ilabel":"B-11","icap":"价格行为基础（繁体）","fid":"fig11","ctx":[{"t":"以上这些情况都是常常出现盈利机会。不过要注意的是，牛熊旗的止盈距离最保守，只能测算到通道的起点。这也说过很多遍了。在抵达通道起点看到价格行为的反应以前，你是没有素材可以预测多空谁会胜出的。预先打算贪心持仓就是赌博行为，你很可能会被市场惩罚。","p":"p170"},{"t":"不过死记硬背建仓形态的称呼都没有鸟用，本来就没有形态是完美的。只要多空竞合状态类似，本质也就类似，延续趋势的功能也会类似。","p":"p171"},{"t":"第二点，任何形态都有失效的可能性。也就是说，虽然通道趋势线倾向被突破，走出前赴通道起点的行情，但偶尔大概20%的情况下，也可能加速朝向远离通道线的方向突破。","p":"p172"},{"t":"补充：形态如果失效了该怎么办？牛/熊旗何时失效？看见失效迹象后该如何操作？","p":"p173"},{"t":"下降趋势中平缓回调即是熊旗。一根趋势阳线，威逼许多做空的止损，那将其视作“突破”而非高潮。","p":"p174"},{"t":"在一轮下降趋势中，第一，第二，第三弱势趋近均线的调整，我们都有理由认为是作为熊旗的持续形态，继而寻找做空的机会，不过当均线被慢慢的翻过，且刚才所有做空信号K线的高点都被强势越过，那么空头的止损便是必然。","p":"p175"},{"t":"交易者需要学习熊旗失效，并将引发朝向相反的等距运行。","p":"p176"},{"t":"熊旗失效造成的等距扩张并不会怜悯扛单这的愚蠢，它只会抵达它该去的地方。","p":"p177"},{"t":"【價格行為進階 08】學會以末端旗形預期大型反轉的發生","p":"p178"},{"t":"各位格行为的学习者肯定知道趋势倾向延续和反转倾向失败。因此趋势中偶尔会出现的逆势运动多半没有办法造成运行终结，而是成为旗型，依然引发趋势延续。不过这不代表趋势就没有终结的一天，反转总会发生。也就是说无论趋势起初有多强劲，最终会有一个情形没有办法完成延续行情的任务，那么这个失败的旗型也就是处于趋势末尾最后一次回调，我就称它为末端旗型。","p":"p179"},{"t":"末端旗型的关键特色：第一点，他是在靠近支撑阻力位置生成的。你可以想象一轮趋势的终止往往需要大量的反向订单来推动。这也就是说上升趋势要转跌，空单的数量必须压过多头。那么什么地方可能存在大量的空单呢？答案是某个潜在的阻力位置。多头选择在该价位置卖出，而空头则依仗敌方显露疲态，大举进场。","p":"p180"},{"t":"在前方下降趋势由跌转涨以前，我们就能标记出潜在的空单巢穴。也就是这些可能造成缓速或者反转的水平波段点。价格是否在这些地方出现波折呢？答案是肯定的。下方这个波段点导致接连两段的回调。一开始甚至都还未触碰到多头就开始退缩，这本身就预示了买方的怯战倾向。第二次测试终于勉强刺到波段点，但却又旋即导致耗时更长的回调。不过你肯定记得趋势倾向延续的道理，前面的多头急速也并不是虚假的。虽然上涨偏弱，但趋势毕竟是趋势。首次，二次回调往往不能直接导致反转。所以还有后续，可是刚刚说到末端旗型需要在阻力附近生成。推动价格完成基于急速，高度等距运动，并且趋近上方这个重要波段点后，马上就有持仓的多头开始止盈。在这段回调存续的期间，你就应该开始怀疑他作为末端旗型的可能性。回调存续期间，你就应该开始怀疑他作为末端旗型的可能性。就是因为即使回调结束，多头的力量又再一次施展，他可以行进的射程也可能很短。马上会在上方不远处遭遇到大量的空单。前方已有急速与通道等距运动，同时内含三推，这本身就可以为做空营造了很好的土壤。价格最后以高潮形式因真空效应向上一冲，测试完波段点后就立即下跌，将是高几率的事件。所以一旦旗型在支撑或阻力前形成，就可能引发天鹅绝唱。测试完毕，反向订单开始作用，价格就开始逆势运行。第二点，末端旗型要产生并起到反转作用，往往要先有逆势压力的充足累计。卖压的存在，要么“够强”，也就是趋势阴线屡屡生成来证明，要么“够久”的形式来展现，确实阴线不多没关系，但你要压制多头力量足够久，让趋势阳线难产，不让多方太快恢复的力度的运行。","p":"p181"},{"t":"刚刚说首次，二次回调很少能够直接反转行情吗？这是因为多头此时依然精力充沛，居于被动的空方还没有看到自己人的力量充足表现，自然不会轻举妄动。不过当一路上越来越多的趋势阴线明显出现，多空共识就会开始变化。卖压一旦累计到临界点，趋势就会反转。使方才最后一段回调，成为失败的牛旗。","p":"p182"},{"t":"第三点，最后的失败突破往往是真空效应导致高潮运动，且高潮结束后并没有跟进K线作为突破成功的确认。三根逐渐放大阳线？这到底是多头重整旗鼓，准备大杀四方的信号，还是回光返照而已？应该是后者。原因是这里已经非常接近阻力，空头可能选择在高处守株待兔，导致真空。后续没有阳线跟进，如果是强劲的突破，多头应该大力买进，将好不容易发生的趋势推进的更远。不过这没有发生，多头根本没有创出下一根趋势阳线的本事。所以接下来出现的是更多的阴线。直到上升的斜率转为下跌，直接反转的行情。如果阻力因素和卖压因素还没有能够让你确信这是一个末端旗型，那失败突破，遍寻不着的跟进K线，应该就能打消你剩下的疑虑。","p":"p183"},{"t":"何謂末端旗形（Final Flag）？","p":"p184"},{"t":"既然趨勢由運行與回調（也就是旗形）組成，那麼當趨勢終於反轉，總有一個旗形會是原趨勢中最後一個旗形。它將引出衰竭的、失敗的突破，或甚至根本沒有引發突破——這就是所謂的末端旗形。所以，當趨勢發展已久，交易者便要開始注意是否形成末端旗形，進而導致趨勢反轉。 使一個旗形可能成為末端旗形的跡象包括：","p":"p185"},{"t":"1.形成於重要的支撐、阻力之前，趨勢總是結束在某個支撐、阻力上；","p":"p186"},{"t":"2.趨勢中的逆勢壓力已積累充足；","p":"p187"},{"t":"3.最後一段失敗的突破運動往往是真空效應導致的高潮運動，且高潮結束後並沒有優質的跟進 K 線作為突破成功的確認。【價格行為進階 09】交易者需要在圖表上關注多少 K 線？什麼數量才是最效率、最有用的選擇？","p":"p188"},{"t":"维持明确简洁，有固定的交易标的，清晰的流程和设置，又有严谨的规则。","p":"p189"},{"t":"近期只需要关注80根左右的K线","p":"p190"},{"t":"1.越是早期的K线对后期走势影响越小。阿布只关注30根左右的K线，不要看太多的K线。有助于趋吉避凶，否则可能误闯太大级别的结构而亏损。","p":"p191"},{"t":"2.对规模越大的结构，少数K线所能起到的影响越小。","p":"p192"},{"t":"总结:单一级别，找出支撑阻力，80根左右的K线，足够应对日内交易的行情。","p":"p193"},{"t":"【價格行為進階 10】學會辨識出不應追進的突破行情","p":"p194"},{"t":"突破失败是市场的主旋律，让追求高盈亏比的交易者倍感困扰。","p":"p195"},{"t":"避免假突破，对突破的样态和跟随K线做一些外观上面的要求，一个明确的标准是突破K线收定之后应当有跟进。突破与跟随两者都是必要条件，跟随K线是同色K线。不要提前挂单入场，等待信号后再入场，胜率更高。","p":"p196"},{"t":"趋势追进被套住，很可能你追进的是动能疲弱的弱势趋势，这种走势有着斜率较缓，通道震荡上涨的特征，因此它其实和区间一样，带有双边交易的性格。","p":"p197"},{"t":"观察上次突破后，持仓者是长时间处于浮亏还是一直浮盈状态？持仓者无忧无虑即趋势健康的表征，无人提前止盈，集体共识还在，价格可能继续上涨。如果前段追突破的交易者处于浮亏状态，一旦回到相同价位，更可能打平离场，而不是继续持仓。前期追突破的持仓者果断离场，而我们不应该追进。若追进新手出现浮亏应果断止损。成熟的交易者都是分批入场（学习打平离场）。1.在合理的位置加仓。2.突破前先考虑一下突破与跟进，想想之前最高的持仓者的处境是否有利。3分批建仓。","p":"p198"},{"t":"【價格行為進階 11】浮虧狀態下的持倉管理方法：逆風分批建倉（暂不考虑）","p":"p199"},{"t":"（逆风） 分批进仓，打从开始，就必须思考，我可能分批建仓的次数，若是5次，那么每次只开20%的仓位。将仓位大小，与次数相除，确保分批将仓位打满。","p":"p200"}]},{"t":"para","text":"第二点，任何形态都有失效的可能性。也就是说，虽然通道趋势线倾向被突破，走出前赴通道起点的行情，但偶尔大概20%的情况下，也可能加速朝向远离通道线的方向突破。","pid":"p172"},{"t":"para","text":"补充：形态如果失效了该怎么办？牛/熊旗何时失效？看见失效迹象后该如何操作？","pid":"p173"},{"t":"para","text":"下降趋势中平缓回调即是熊旗。一根趋势阳线，威逼许多做空的止损，那将其视作“突破”而非高潮。","pid":"p174"},{"t":"para","text":"在一轮下降趋势中，第一，第二，第三弱势趋近均线的调整，我们都有理由认为是作为熊旗的持续形态，继而寻找做空的机会，不过当均线被慢慢的翻过，且刚才所有做空信号K线的高点都被强势越过，那么空头的止损便是必然。","pid":"p175"},{"t":"para","text":"交易者需要学习熊旗失效，并将引发朝向相反的等距运行。","pid":"p176"},{"t":"para","text":"熊旗失效造成的等距扩张并不会怜悯扛单这的愚蠢，它只会抵达它该去的地方。","pid":"p177"},{"t":"para","text":"【價格行為進階 08】學會以末端旗形預期大型反轉的發生","pid":"p178"},{"t":"para","text":"各位格行为的学习者肯定知道趋势倾向延续和反转倾向失败。因此趋势中偶尔会出现的逆势运动多半没有办法造成运行终结，而是成为旗型，依然引发趋势延续。不过这不代表趋势就没有终结的一天，反转总会发生。也就是说无论趋势起初有多强劲，最终会有一个情形没有办法完成延续行情的任务，那么这个失败的旗型也就是处于趋势末尾最后一次回调，我就称它为末端旗型。","pid":"p179"},{"t":"para","text":"末端旗型的关键特色：第一点，他是在靠近支撑阻力位置生成的。你可以想象一轮趋势的终止往往需要大量的反向订单来推动。这也就是说上升趋势要转跌，空单的数量必须压过多头。那么什么地方可能存在大量的空单呢？答案是某个潜在的阻力位置。多头选择在该价位置卖出，而空头则依仗敌方显露疲态，大举进场。","pid":"p180"},{"t":"para","text":"在前方下降趋势由跌转涨以前，我们就能标记出潜在的空单巢穴。也就是这些可能造成缓速或者反转的水平波段点。价格是否在这些地方出现波折呢？答案是肯定的。下方这个波段点导致接连两段的回调。一开始甚至都还未触碰到多头就开始退缩，这本身就预示了买方的怯战倾向。第二次测试终于勉强刺到波段点，但却又旋即导致耗时更长的回调。不过你肯定记得趋势倾向延续的道理，前面的多头急速也并不是虚假的。虽然上涨偏弱，但趋势毕竟是趋势。首次，二次回调往往不能直接导致反转。所以还有后续，可是刚刚说到末端旗型需要在阻力附近生成。推动价格完成基于急速，高度等距运动，并且趋近上方这个重要波段点后，马上就有持仓的多头开始止盈。在这段回调存续的期间，你就应该开始怀疑他作为末端旗型的可能性。回调存续期间，你就应该开始怀疑他作为末端旗型的可能性。就是因为即使回调结束，多头的力量又再一次施展，他可以行进的射程也可能很短。马上会在上方不远处遭遇到大量的空单。前方已有急速与通道等距运动，同时内含三推，这本身就可以为做空营造了很好的土壤。价格最后以高潮形式因真空效应向上一冲，测试完波段点后就立即下跌，将是高几率的事件。所以一旦旗型在支撑或阻力前形成，就可能引发天鹅绝唱。测试完毕，反向订单开始作用，价格就开始逆势运行。第二点，末端旗型要产生并起到反转作用，往往要先有逆势压力的充足累计。卖压的存在，要么“够强”，也就是趋势阴线屡屡生成来证明，要么“够久”的形式来展现，确实阴线不多没关系，但你要压制多头力量足够久，让趋势阳线难产，不让多方太快恢复的力度的运行。","pid":"p181"},{"t":"para","text":"刚刚说首次，二次回调很少能够直接反转行情吗？这是因为多头此时依然精力充沛，居于被动的空方还没有看到自己人的力量充足表现，自然不会轻举妄动。不过当一路上越来越多的趋势阴线明显出现，多空共识就会开始变化。卖压一旦累计到临界点，趋势就会反转。使方才最后一段回调，成为失败的牛旗。","pid":"p182"},{"t":"para","text":"第三点，最后的失败突破往往是真空效应导致高潮运动，且高潮结束后并没有跟进K线作为突破成功的确认。三根逐渐放大阳线？这到底是多头重整旗鼓，准备大杀四方的信号，还是回光返照而已？应该是后者。原因是这里已经非常接近阻力，空头可能选择在高处守株待兔，导致真空。后续没有阳线跟进，如果是强劲的突破，多头应该大力买进，将好不容易发生的趋势推进的更远。不过这没有发生，多头根本没有创出下一根趋势阳线的本事。所以接下来出现的是更多的阴线。直到上升的斜率转为下跌，直接反转的行情。如果阻力因素和卖压因素还没有能够让你确信这是一个末端旗型，那失败突破，遍寻不着的跟进K线，应该就能打消你剩下的疑虑。","pid":"p183"},{"t":"para","text":"何謂末端旗形（Final Flag）？","pid":"p184"},{"t":"para","text":"既然趨勢由運行與回調（也就是旗形）組成，那麼當趨勢終於反轉，總有一個旗形會是原趨勢中最後一個旗形。它將引出衰竭的、失敗的突破，或甚至根本沒有引發突破——這就是所謂的末端旗形。所以，當趨勢發展已久，交易者便要開始注意是否形成末端旗形，進而導致趨勢反轉。 使一個旗形可能成為末端旗形的跡象包括：","pid":"p185"},{"t":"para","text":"1.形成於重要的支撐、阻力之前，趨勢總是結束在某個支撐、阻力上；","pid":"p186"},{"t":"para","text":"2.趨勢中的逆勢壓力已積累充足；","pid":"p187"},{"t":"para","text":"3.最後一段失敗的突破運動往往是真空效應導致的高潮運動，且高潮結束後並沒有優質的跟進 K 線作為突破成功的確認。【價格行為進階 09】交易者需要在圖表上關注多少 K 線？什麼數量才是最效率、最有用的選擇？","pid":"p188"},{"t":"para","text":"维持明确简洁，有固定的交易标的，清晰的流程和设置，又有严谨的规则。","pid":"p189"},{"t":"para","text":"近期只需要关注80根左右的K线","pid":"p190"},{"t":"para","text":"1.越是早期的K线对后期走势影响越小。阿布只关注30根左右的K线，不要看太多的K线。有助于趋吉避凶，否则可能误闯太大级别的结构而亏损。","pid":"p191"},{"t":"para","text":"2.对规模越大的结构，少数K线所能起到的影响越小。","pid":"p192"},{"t":"para","text":"总结:单一级别，找出支撑阻力，80根左右的K线，足够应对日内交易的行情。","pid":"p193"},{"t":"para","text":"【價格行為進階 10】學會辨識出不應追進的突破行情","pid":"p194"},{"t":"para","text":"突破失败是市场的主旋律，让追求高盈亏比的交易者倍感困扰。","pid":"p195"},{"t":"para","text":"避免假突破，对突破的样态和跟随K线做一些外观上面的要求，一个明确的标准是突破K线收定之后应当有跟进。突破与跟随两者都是必要条件，跟随K线是同色K线。不要提前挂单入场，等待信号后再入场，胜率更高。","pid":"p196"},{"t":"para","text":"趋势追进被套住，很可能你追进的是动能疲弱的弱势趋势，这种走势有着斜率较缓，通道震荡上涨的特征，因此它其实和区间一样，带有双边交易的性格。","pid":"p197"},{"t":"para","text":"观察上次突破后，持仓者是长时间处于浮亏还是一直浮盈状态？持仓者无忧无虑即趋势健康的表征，无人提前止盈，集体共识还在，价格可能继续上涨。如果前段追突破的交易者处于浮亏状态，一旦回到相同价位，更可能打平离场，而不是继续持仓。前期追突破的持仓者果断离场，而我们不应该追进。若追进新手出现浮亏应果断止损。成熟的交易者都是分批入场（学习打平离场）。1.在合理的位置加仓。2.突破前先考虑一下突破与跟进，想想之前最高的持仓者的处境是否有利。3分批建仓。","pid":"p198"},{"t":"para","text":"【價格行為進階 11】浮虧狀態下的持倉管理方法：逆風分批建倉（暂不考虑）","pid":"p199"},{"t":"para","text":"（逆风） 分批进仓，打从开始，就必须思考，我可能分批建仓的次数，若是5次，那么每次只开20%的仓位。将仓位大小，与次数相除，确保分批将仓位打满。","pid":"p200"}],"sections":[],"wcount":11306},{"id":"l01","icon":"L01","title":"L01　重新认识你所参与的这场游戏","blocks":[],"sections":[{"id":"l01A","title":"第A段　重新认识你所参与的这场游戏","blocks":[{"t":"para","text":"LESSON 01A 重新认识你所参与的这场游戏","pid":"p201"},{"t":"para","text":"在我撰写这节课讲稿的早上，很碰巧我一边冲咖啡一边滑到这则推文。翻译过来是这样的，一位我很崇拜的设计师，曾经说过当设计遇到瓶颈的时候，要不是因为缺乏资讯。就是因为前提错误。这句话经常帮助到我。当然，不止在设计行业这句话，很多时候也能够套用在其他领域，包括交易。既然你决定要购买这堂课程。想必是接触以来有些明确或不明确的问题，想要得到解决。希望通过学习提升交易业绩。所以在你接下来上的一个又一个的单元里头。我的责任就是既要给你正确认识市场，认识交易这项事业的前提。也要给你深刻且实用的原理与资讯。最初的这一步，我们要从重新认识你所参与的这场游戏讲起。其实我是有点排斥使用，包括玩合约，炒期货在内任何具有玩耍意义的词汇来表达交易。但由于这个单元我们会讲到市场本身，会讲到市场参与者以及如何把交易做好的总体原则。所以使用游戏玩家，看怎么赢得这场游戏来做比喻，可能比较生动，也可能其实还蛮精准的。请不要误会，我绝非鼓励你以玩乐的心态来参与市场。我相信你能懂我的意思。谈怎么赢之前我们要讨论的是我们到底身处在什么样的游乐场所，场地的特性以及将带来的限制包括哪些？也就是说，我们所在这个市场，它的本质到底是什么？身为人，我们其实无时无刻不在跟市场打交道。我猜，在交易之外，你可能也有各式各样的爱好。比如我喜欢摄影，有时会添购或者出售手边的器材。所以需要去到DCview这样的地方，看看能不能找到我要的东西。或者前阵子开始听韩团，却因为抢不到演唱会的票，需要上脸书社团去找，又或者像我当初决定把资金重心从外汇转移到指数期货以后，首要职务就是开办期货户。跟经纪商谈一个好的手续费。所以同样需要在instagram ，ptt上面看看市场行情，大概落在什么范围之内。然后再去找到合适的营业员，进一步联系。那你可以想象，如果没有一个地方让我去询问，有人有必要的镜头要出售吗？我想要的型号是这一款。那我估计得从我家下山挨家挨户的问。不止效率很差，甚至有可能问了一圈未果，才知道原来放眼望去都没有一户人家有这个东西。就算真的被我问到一个这位大哥，也很可能因为知道竞争者应该很少，而我迫切需要这个东西。所以决定出一个非常昂贵的价格，试图赚取暴利。那基于以上的种种原因，就会让购买镜头的这笔交易实在难以发生。不过，其实有很多人希望各式各样的交易发生。我们点外送喝饮料，买衣服，所有跟供需跟消费有关的行为，无一不需要一个市场。所以我们就有了市场。市场基本上就是为了回应发生交易的需求而诞生的。它集中了大量渴求买卖的参与者。于是这里正是交易这场游戏的发生地。理论上，以个体经济学的语言来讲。所有参与者在市场中都倾向采取对个人而言能够最大化效用的行动。白话说就是想卖的人，希望能以更高的价格出售。想买的人希望买的更划算。所以卖家和卖家，买家和买家之间愿意削价竞争。直到愿意以最低价格卖出和最高价格买入的那两个人，成功换手，交易于焉发生。而发生的这个价格就是有目共睹的公平价格。市场的作用就是尽可能扩大发达效率起来。为了促成大量的公平交易发生。所以你也可以说，市场自身的目的就是不断动态的去找到公平价格，造成成交，使总体效用最大化。这样的说法很容易被价格的变动所验证。我想大家应该多多少少看过，甚至非常熟悉K线图表。在这些图表上，你总可以看到价格不断的上下震荡。为什么会这个样子呢？难道非得要盘整吗？不能一直涨或一直跌吗？或许你有过这样的困惑。此间，上涨你应该理解为在原先那个便宜的价格已经没有卖家再愿意出售。对他们来说，这个价格实在太低了。所以接下来市场就需要向上去运动，来找到卖家。150有人要卖吗？没有那就再多50，200有人要卖吗？还是没有那250？哦，终于有人愿意脱手了，那价格就以250成交。以上就是公平价格从100迁移到250的过程。上涨前，能令最多人满意，造成最多成交的价格，也就是使总体销量最大化的价格在100。但如今，因为没有人再愿意降价出售，于是要提升至250才被视作合理。也就是说，市场总是不断的向上和向下探测，寻找何为过渡。什么样的价格太贵了？什么样的价格太便宜了？过度恐慌抛售或过度贪婪抢购的边际在哪里？由始终震荡摸索的方式去界定居于过渡与过渡之间的均衡价格何在？这就是市场的实在。进一步说，这正是市场难以无止境涨跌的原因。市场总是希望待在总体效用最大的位置。因此，他总是希望待在均衡价格附近。这里才能让最多数的人以满意的价格成交。而这也将导致市场中其实仅有少于20%的时刻，偏向处于突破，处于急速运动的状态。急速会发起，一定是基于某种理由，比如刚刚从100涨到250的过程。使得原先觉得这价位合适的所有参与者，不再觉得合适了，因而需要朝新的区域探索，你可以称它为短暂的失衡。相对的，超过80%的情况下，市场则偏向均衡的区间状态。区间的上下沿就是界定太贵与太便宜的边线。在这个范畴中震荡，能使最多人感到满意。这下子你就明白，大家都说市场中八成时间都在震荡的原因了。而事实上，他们可能还谦虚了。甚至要接近九成的时间都在均衡的区间中才更加正确。那这时候你可能会产生另一个疑问。既然市场希望找到均衡价格，那当我们真的处在均衡价格，为什么市场不接着贴着一条水平线向右移动？而是要形成一个区间呢。这是因为虽然我们知道市场喜欢均衡。但在朝公平价格探索的过程中，没有人能够确知现在或是未来那个均衡价格会确切位在什么地方。多头总想买的低一点。而有时候碰巧遇到卖家愿意稍微贱价出售，因而成交在低于行情的价格。而空头也总想要卖得更高一点。所以当愿意贱价出售的人都暂时离开了市场。想买的买家就得稍微追高。市场参与者们正是透过解读，不断变化着的资讯来产生交易决策的。而这些交易决策的动态总和，也将形成动态的均衡价格。也就是说，随着市场参与者的组成和其行为的些许变化。市场也需要一再的透过上下探测，上下测试来确认当前所处的价格地带是否仍然公允。如果均衡还在，则向上和向下探测行为即突破尝试将以失败告终。而若突破成功，则代表均衡价格应在他处。市场便会快速移动朝向该价格进行新的探索。以上正是市场大多时候在震荡，少数时候骤涨急跌的原因。或许正是因为如此，会让你难免感受到市场具有欺骗性。区间好像要突破了，你赶紧追进。但其实只是对均衡边界的一次常态性测试。价格很快又折返回到均衡处，导致你的浮亏。你可以说，这正是市场有趣且迷人的地方。他既然希望创造最多的成交。那他就也总是透过价格变化来迫使交易者们就范。即使你不想，你也会在迷迷糊糊中被迫执行交易。去成就，去成全我们所说的市场效率。","pid":"p202"}],"wcount":2693},{"id":"l01B","title":"第B段　重新认识你所参与的这场游戏","blocks":[{"t":"para","text":"L01B 重新认识你所参与的这场游戏","pid":"p203"},{"t":"para","text":"现在你知道市场自身的目的是要在均衡价位上促成最多的成交。也知道价格总是不断向上向下探测，找到均衡。那接着我们来谈谈市场中的参与者。以前面提到的游戏譬喻来说，我们已经知道游乐场所的性质。接下来该认识一下环绕我们的其他玩家是谁？知己知彼才有胜的可能性。在YouTube的频道上，我曾经录制一个节目，提名为交易必备的敌我意识。影片的一开始有一个有趣的问答是这样子的。你觉得每每都熟虑深思后才下单的，你在100次买进的决策之中，有几次是从散户的手上？接过他们错误抛售的订单。而又有几次是跟聪明的机构对做呢？接下来要说的话，或许让你伤心。你所想象的数字，前者越高，后者越低。那可能你距离对市场该有的正确认知就越遥远。事实是这样的，在2000年前后，市场中大部分的交易决策都还是由聪明的真人手动执行。但到了2010年前后，市场中绝大部分的成交量已由自动精密仅寻求一个最小报价单位利润，而且订单投放连一个最小报价单位都不差的交易机构所创造。其中又有70%来自毫秒，微秒等级的高频交易机构。换句话说，个体交易者所贡献的成交量比例不到5%。你100次的买进决策，比如你很看好苹果，特斯拉的股票，买了100张。里头很可能只有五张是从散户的手上买走的。其他95张都是有坚实理由决定该抛售的机构抛货给你的。这不仅仅是美国市场的情况，台湾也是如此。如果你交易台股交易台湾指数期货，你可能听过一个很厉害的前辈叫自由人本名李尧勋。依照他在台指期市场的第一手观察和考究，自从二零一三年五月其交所调降期货交易税和手续费以后。国外的高频交易公司逐步进军台湾市场。先是2013年jump trading进场。然后到了2016年左右，又有Tower Research Capital。除此之外，比较知名，影响力很大的也还有Optiver，尤其是在选择权的市场。这些高频交易机构和做市商在2018年年底，这已经囊括市场成交量的70%以上。这几年来还在逐步增加。听起来有点恐怖，对吗？觉得恐怖那就太好了。有了以上的认识，接下来提到的事实，我们必须重新确认与了解，你最好惦记在心。首先，市场中百分之八十九十以上的成交量都是有极其聪明,熟谙交易数学。长期而言，总归盈利的机构，尤其是高频交易机构所创造。毕竟如果自己没有办法持续盈利，那他们就将被更强的机构给撕碎，扫进历史的余境里。于是能够剩下来的，长远来看都是精英中的精英，得以持续盈利。再来，因为上述原因K线基本上只会形成在有机构愿意建仓的价位。毕竟散户的成交量太小了，他们根本没有能力去排除机构的参与，形成独立的K线。这也代表什么呢？代表你的几乎每一笔交易都由机构做你的对手方。你买他卖给你，你卖他就满心欢喜的接收过去。也于是乎，市场绝无送分题可言，也没有什么秘密的必胜的建仓形态，或是快速简单的致富方法。会告诉你，交易很简单的，基本上不是邪恶就是愚蠢。你的对手非常可敬，千万不要小看他们。否则，被撕碎，被淘汰的必然很快是你本人。第三，既然所有K线都是机构创造的。那就代表所有买卖都是合理的，背后具有充分的数学理由。任何时候，市场中都存在着正在持仓，正在建仓的多头与空头。并且他们的止损止盈与预期胜率的组合应有尽有。就算你看不懂这些K线有什么建仓价值，也必然是存在认定这有利可图的算法介入了。才会造成价格在这里成交。同时，对于这些交易者看不懂的K线，其实他们所对应的成交量依然很可观，这些都是算法正在执行，有理有据的交易的痕迹。这也是为什么阿尔布鲁克斯会说，那些爱把噪音挂在嘴边的人全然不了解市场。要么是懒惰，要么是无知。你觉得再笨再没道理的位置都有合理的交投理由。这也就是说，没有价格行为是随机的。他们都是极其聪明，长期盈利的机构，用真金白银交易出来的，我们不应该随意的否定它或忽视它。说到这里，或许你已经油然而生。两个疑惑，我们可以接着来讨论一下。第一，如果机构的每一笔交易都能赚钱，那是谁在赔钱呢？我们真的有利可图吗？第二，机构可以单独或共谋以操纵市场吗？关于第一个问题，我们应该把题目再细节成两边来看。我们说到复述高频交易机构的行动，共同组成的市场的主旋律。但这些机构是否每一笔都必须赚钱呢？答案是否定的。他们其实更像是靠着所谓的赌场优势来持续盈利。我们知道，分开看每一场赌局的话，赌场并不会赢下每一场游戏，不然玩家永输的话，谁要进门去玩，对吧？赌客也是有时候能够从赌场赢走大笔奖金。不过，赌场会介意你赢走一次两次吗？不介意，就算是一笔赚很多，他也不介意。这是因为赌场的盈利策略是将游戏设计成使优势略为偏向自己。那只要游戏永远运转，他们就可以靠51%的胜率薄利多销，最终成就丰厚的利润。那么，那些高频交易机构也是这样的，多数机构都会运行不止一套策略，可能是100套，300套，可能是数千套。有的赚钱，有的赔钱。有的集中争取利润，有的负责分散风险。共同运作下来的结果就是得以平滑他们的收益曲线。而就这个最终的成果来说，只要其所掌握的统计优势仅仅略高于50%。那即使每笔交易的目标收益相当微小，他们也能够靠着赌场优势每周交易数百万笔来持续的盈利。另一方面则是关于谁在赔钱。我们已经知道，即使是长期盈利的机构，也有将近半数亏损的交易。那更遑论长期而言会被淘汰的弱势机构和个体交易者了。先讲弱势机构。这张图表出自一篇研讨会论文。举办在加拿大沃太华的第八届中央银行金融市场微观结构研讨会。你可以看到，对于执行或激进或被动或混合策略的高频交易机构来说，他们有人是获利的，有人是亏损的。纵轴是占比，横轴是获利的大小。你可以看到以执行较为被动的高频策略的绿线来说，有六成的高频交易机构最终是不赚不亏的。而蓝线就很有趣，这些是执行较为激进策略的机构。大赚钱的很多，有些机构可以每天赚到25万美金以上。另外，获利在零的前后也有很大部分的隆起代表接近不赚不赔的机构，占比也不少。而重点是我特别想指出来给你看到的部分在于。整张图的左半边指的就是那些亏损的机构。亏损的机构不是不存在，他们在运作期间会赔掉大量的资金给市场。只是他们无法经历长期的亏损，于是很快又被市场淘汰。大家应该也多少听闻过，在2022年底币圈第二大交易所FTX倒闭。而后还有2023年的美国银门银行，矽谷银行，签名银行也陆续关门大吉。甚至回溯的更远一点，2008年次贷危机，一九九七年亚洲金融风暴中都有不少银行，基金，证券公司消失在历史之中。那些风险管理能力不够好，或者无法应对市场变化的机构，也可能黯然离场。弱势的高频交易机构意在其中。至于散户，很不好意思，我没有办法找到时间更近的论文。但根据以前在政治大学，现在在北京大学光华管理学院任教的李仪综，刘玉珍这些学者的共同研究。他们发现，台湾的个体交易者在市场中杀进，杀出的结果是总体资金每年损失二到三点八个百分点。我们说投资指数基金常年下来的年化报酬可能落在8%左右。这是多数人都在尝试追求的所要打败的大盘成绩。结果呢，散户的成果却是负的百分之三点八。而且他们总亏损的金额相当于台湾GDP的百分之二点二。如果这个数字是对的，掐指一算，那就是2885亿台币。当然，这是当年2008年的数据。2023年，台湾的GDP已经来到了二十三点五五兆。要是散户没有长进，而且有很大的几率是如此哦，他们将总共贡献5181亿，给市场中的胜利者。这也就是说，每年市场上都是存在这样一笔数额的奖金带胜利者去争取的。如果你也经过有效的训练，能够加入长期盈利的那一方。那你就也有机会跟机构们共同分食这一块，由弱势参与者们准备的大饼。第二个问题，关于机构能不能单独或共谋的去操纵市场？如果你接触过其他技术分析的流派，有些理论会告诉你，市场上所有的价格行为都是机构庄家。某种超凡的银行寡头演算法，操纵出来的为了去割取散户的流动性。很可惜，这远非事实。机构无法作弊，无法呼风唤雨。这个结论可以用很简单尝试性的逻辑就推演出来，以e mini S&P的指数期货市场为例。甚至只是微型期货哦，合约价值只有普通版本的四分之一。但只要稍微查一下，你不难发现，在一分钟级别的图表上，任何一根K线对应的成交量。少说也有2000张合约，这相当于五点四亿美金的交投。这代表如果有一些机构想要合作控制一根一分钟级别的K线，就得拿出至少5.4亿美金的资金才可以。那么，想要创造出我所标示的这个小型的五根K线的通道，它就要能够载至64亿美金的成交量。而那些宣称机构操纵市场可以操作价格折返在清算散户流动性的同时，去承接他们未消化订单的交易流派。动则认为，这些机构有能力操纵15分钟级别甚至更大时间级别图表上的多根K线。这是什么概念呢？我们可以再算一下，15分钟级别图表上的15根K线是几个5.4亿美金？如果以一分钟级别计15分钟级别图表上的15根K线就是15乘以十五两百二十五个五点四亿美金。此间创造的成交量少说有1215亿。但令人啼笑皆非的是，全世界USDT的流通量不过只有1130亿。而苹果公司作为全世界最一流的企业，一年的净利润不过就970亿。无论是一分钟级别图表上五根K线的小通道62亿。还是15分钟级别图表上15根K线的1200多亿。到底是什么样的机构有能力，有意愿为了单单一次的交易行动不计代价，枉顾资金管理者掏出这么多的钱来参与呢？这明显是不符合常识的，绝非现实世界运作的时态。即使在更早之前也是这样哦，根据著名的交易者访谈录，金融怪杰在一九九零年代早在城市交易，高频交易还没问世的时候。Tom Baldwin是美国公在市场上交易规模最大的个体交易者。多大呢？它的单笔交易能下到2000口合约，相当于2亿美元。不过，根据他的说法，即使他本人一次性的交易1000口合约，在当时也只能至多影响价格一到两个最小报价单位。那更遑论连续几分钟，甚至连续数小时的控制市场了。在对其他人的访谈之中，其他受访者也不约而同的指出，大众对于市场最大的误解。就是认为机构可以控制市场。这些早在一九九一年代就写成了访谈记录，都可以作为市场难以被操纵的早期证据。再者，即使真的有一个机构有意愿拿出数十亿的资金，想要短暂操纵市场，那另一半与他成交的人会是谁呢？我们知道任何数额的成交量必定是多空买卖，各半所加总起来的。如果今天想要创造出一个一分钟级别五根K线的上升急速，除了自己拿出31亿美金。你要找到另外31亿的卖单与你成交。这另外的31亿必然也是其他极其聪明，得以长期稳定盈利的机构所贡献。毕竟散户集结起来的成交量也只能够贡献5%到15%。如果你花了31亿美金，做多是为了操纵市场赚必赢的钱。那另外一半同样聪明的卖家，为什么要认你割取？同样拿出31亿的资金，就为了当你宰割的鱼肉呢？因此，这是不可能的。所有机构的对手机构也都很聪明，也同样试图从对方的手上赢钱。没有人会温良恭俭让，让一部分的人能够长期宰制一个市场。所有图表上可见的行情都是众多机构竞争出来的结果，而非存在单一机构或复数机构的共谋。最后的最后，即使你心中还存有一点怀疑。机构的富有无法想象啊，他们可能很坏呀，会串通啊，会合作啊。那最后我们再来看看法律方面的限制。现实是，所有大型市场都遭到严格的监管。你所想象的到作弊行为都是被禁止的。共谋以操纵市场价格在美国法典第七篇，第一章第九节详列有禁止事项与法则。除此之外，你可能听过其中一种做法，叫做谎骗。比如，在订单部上面部署大量的假动作卖单。让看到的人以为哇，好多人要卖出啊，那接下来价格应该会下跌吧，于是入场做空。但就在这些订单被触发成交之际，机构立刻把单子抽开，然后割取你刚刚卖出的筹码，这就叫谎骗。这可以吗？不行。在美国法典第七篇，第一章，第6c节，第a段，第五款，第c项被明文禁止。又或者你可能听过抢先交易。你的经纪商将有利于自己盈利的订单排在你的订单前面优先成交。这可以吗？同样不行。在金融业监管局第二五七零条规则中，同样规定禁止。各种你所想象得到的作弊行为，机构割韭菜的行为，实际上都受到监管禁止。因此，机构操纵市场不仅从逻辑上来说不可能。从法律上来说亦不可能。如果还有人对着你说，这个市场是庄家掌控的，随时随地要割取你的筹码。那这时候你应该要反问他为什么安全公平，受法律保护的主流市场你不参与。非要去交易那些筹码集中，流动性差，大户有机会逍遥法外的边缘品种呢？把自己在交易上的失败和无知用阴谋论包装起来，并没有什么意义。游戏规则其实很公平，没有邪恶的庄家在欺骗你。好，似乎绕的比较远了，刚刚发散出去解决，你心中可能有的所有疑惑之后，我们再试着收敛回来。透过以上讨论，我想要告诉你的是，要在市场中赚钱，不是不可能的。在这个公平且活跃的市场上，存在着亏损的散户有亏损的弱势机构提供利润给各位。我们也有机会去占取其中的便宜。不过这么好的事，当然不是只有你想着要分一杯羹。比你聪明，比你努力，比你更外于人性和情绪干扰的交易算法，不分日夜的在市场中厮杀着。就是为了分食这块饼。所以你首先要忌惮他们，要敬畏他们。市场中有90%成交量有这些长期能够获利，否则就被淘汰的机构所创造。强敌环伺，你必须要非常强才有机会不被他们杀死。再来，你要训练你的纪律与情绪稳定。多数交易由无情绪的算法所执行。所以如果你是一个情绪化的个体，那你将无法描缪无情绪的机构的行为。既然机构能够盈利，而他们的所有交易又共同构成有目共睹的价格行为。那盈利的秘诀就是学会阅读图表，并且跟随机构，如机构一般的正确管理持仓。讲到这里，用阿尔布克斯本人的原话来统称以上的观点就会是这样的，请你铭记。交易中有两个最重要的理念。第一个是一切的背后都有数学基础。机构的行为有理有据，你必须学会阅读和跟随他们。第二个是在任何时候，当你对市场接下来的方向坚信不移，总存在着跟你同样聪明的人保持着截然相反的观点。所以你最好这样想。无论你多有把握，接下来市场会如何发展。请借记永远有四成的可能性，市场会以全然相反的方式展开。当失败的几率为40%，你应该想象成在100公尺之外，有人正举枪瞄准你的脑袋。而它命中的几率为40%。这40%非常现实，也非常危险。不要拿自己的生命，也就是你的资金开玩笑。谦卑,谨慎才是唯一的生存之道。","pid":"p204"}],"wcount":5731},{"id":"l01C","title":"第C段　重新认识你所参与的这场游戏","blocks":[{"t":"para","text":"L01C 重新认识你所参与的这场游戏","pid":"p205"},{"t":"para","text":"还记得上一节我们以什么做结吗？阿尔布科斯说，交易中最重要的两件事就是一切都有数学基础。以及总有比你聪明的人跟你持相反意见。所以介绍完作为我们对手的可谓机构，以后我们要接着谈的就是所谓交易数学。这正是拼图的最后一块，我们究竟该如何从游戏里胜出？","pid":"p206"},{"t":"para","text":"你必须知道，交易完全是数学。所有成功的交易者都精通交易者方程式。阿尔布鲁克斯口中的交易者方程式实际上正是所谓期望值的公式。你的利润能有多大，完全取决于胜率。乘上利润以及输掉的几率，乘上风险之间的差值。","pid":"p207"},{"t":"img","src":"assets/img/l01C_012.webp","ilabel":"1-1","icap":"L01　重新认识你所参与的这场游戏","fid":"fig12","ctx":[{"t":"还记得上一节我们以什么做结吗？阿尔布科斯说，交易中最重要的两件事就是一切都有数学基础。以及总有比你聪明的人跟你持相反意见。所以介绍完作为我们对手的可谓机构，以后我们要接着谈的就是所谓交易数学。这正是拼图的最后一块，我们究竟该如何从游戏里胜出？","p":"p206"},{"t":"你必须知道，交易完全是数学。所有成功的交易者都精通交易者方程式。阿尔布鲁克斯口中的交易者方程式实际上正是所谓期望值的公式。你的利润能有多大，完全取决于胜率。乘上利润以及输掉的几率，乘上风险之间的差值。","p":"p207"},{"t":"最直观，最好理解的就是丢植一枚公证硬币正反的几率各是50%。如果我们依此进行一个赌局投注，正面我给你1000块。投出反面则换你给我1000块。那这终究会是一个没输没赢的游戏。但在交易中，如果你十拿九稳，胜率能有九成。那即使每笔交易的利润只跟风险相当，那也能有高达0.8的期望值。这代表你每承担1000美金的风险。无论单笔输赢，平均每次交易都能够为你赚800。而另一方面，如果我们不从提升胜率下手，而是在维持胜率持平的情况下，尽可能去提高盈亏比。比如到三比一。那你的期望值就更高达一点零。你每承担1000美金的风险，无论单笔输赢，平均每次交易都能够为你赚1000块。前面提过高频交易机构的赌场优势，可能只略高于50%。那假设是52%好了，将其带入公式期望值是稀薄的零点零四。不过，这其实也非常足够了。他们因为大量参与而能够积沙成塔，最后赚得盆满钵满。那你呢？你的交易决策能优化参数到什么程度呢？这是所有交易者最想要知道，也一生在追求的事情。","p":"p208"},{"t":"聪明的你不难发现，你可以将这个算式的结果简化为因着两个变数而变动。胜率和盈亏比。胜率越高，期望值越高。盈亏比越高，期望值也越高。提升任何一个都能够优化你的业绩。不过你只要有过些许交易经验，就会知道提升两项中的任何一项都是谈何容易的事情。为什么会这样呢？不是因为你资质驽钝，技术不好。而是成绩的优化。理论上有其天然的上限。之所以高胜率又高盈亏比的交易机会基本不存在。","p":"p209"}]},{"t":"para","text":"最直观，最好理解的就是丢植一枚公证硬币正反的几率各是50%。如果我们依此进行一个赌局投注，正面我给你1000块。投出反面则换你给我1000块。那这终究会是一个没输没赢的游戏。但在交易中，如果你十拿九稳，胜率能有九成。那即使每笔交易的利润只跟风险相当，那也能有高达0.8的期望值。这代表你每承担1000美金的风险。无论单笔输赢，平均每次交易都能够为你赚800。而另一方面，如果我们不从提升胜率下手，而是在维持胜率持平的情况下，尽可能去提高盈亏比。比如到三比一。那你的期望值就更高达一点零。你每承担1000美金的风险，无论单笔输赢，平均每次交易都能够为你赚1000块。前面提过高频交易机构的赌场优势，可能只略高于50%。那假设是52%好了，将其带入公式期望值是稀薄的零点零四。不过，这其实也非常足够了。他们因为大量参与而能够积沙成塔，最后赚得盆满钵满。那你呢？你的交易决策能优化参数到什么程度呢？这是所有交易者最想要知道，也一生在追求的事情。","pid":"p208"},{"t":"para","text":"聪明的你不难发现，你可以将这个算式的结果简化为因着两个变数而变动。胜率和盈亏比。胜率越高，期望值越高。盈亏比越高，期望值也越高。提升任何一个都能够优化你的业绩。不过你只要有过些许交易经验，就会知道提升两项中的任何一项都是谈何容易的事情。为什么会这样呢？不是因为你资质驽钝，技术不好。而是成绩的优化。理论上有其天然的上限。之所以高胜率又高盈亏比的交易机会基本不存在。","pid":"p209"},{"t":"img","src":"assets/img/l01C_013.webp","ilabel":"1-2","icap":"L01　重新认识你所参与的这场游戏","fid":"fig13","ctx":[{"t":"最直观，最好理解的就是丢植一枚公证硬币正反的几率各是50%。如果我们依此进行一个赌局投注，正面我给你1000块。投出反面则换你给我1000块。那这终究会是一个没输没赢的游戏。但在交易中，如果你十拿九稳，胜率能有九成。那即使每笔交易的利润只跟风险相当，那也能有高达0.8的期望值。这代表你每承担1000美金的风险。无论单笔输赢，平均每次交易都能够为你赚800。而另一方面，如果我们不从提升胜率下手，而是在维持胜率持平的情况下，尽可能去提高盈亏比。比如到三比一。那你的期望值就更高达一点零。你每承担1000美金的风险，无论单笔输赢，平均每次交易都能够为你赚1000块。前面提过高频交易机构的赌场优势，可能只略高于50%。那假设是52%好了，将其带入公式期望值是稀薄的零点零四。不过，这其实也非常足够了。他们因为大量参与而能够积沙成塔，最后赚得盆满钵满。那你呢？你的交易决策能优化参数到什么程度呢？这是所有交易者最想要知道，也一生在追求的事情。","p":"p208"},{"t":"聪明的你不难发现，你可以将这个算式的结果简化为因着两个变数而变动。胜率和盈亏比。胜率越高，期望值越高。盈亏比越高，期望值也越高。提升任何一个都能够优化你的业绩。不过你只要有过些许交易经验，就会知道提升两项中的任何一项都是谈何容易的事情。为什么会这样呢？不是因为你资质驽钝，技术不好。而是成绩的优化。理论上有其天然的上限。之所以高胜率又高盈亏比的交易机会基本不存在。","p":"p209"},{"t":"是因为你的每笔交易还记得吗？都有极其聪明，长期总归稳定盈利的机构作为对手方。那如果你的操作非常好，高胜率又高盈亏比。那就代表跟你成交的那个机构做了一个低盈亏比又低胜率的糟糕决策。事情会是这样子吗？不会。换句话说，要是你认为自己看到了无异于捡钱的机会。那很可能代表是你解读错了，是你在给别人送钱。也因为这样，所有交易必然是公平的。一方享有胜率优势，但盈亏比差劲。一方享有高盈亏币，但胜率相对低落。这将导致你所获得的期望值其实没有办法跟零相距太远。我们就先假设公式导出的结果为零好了。然后再带进各种胜率。就可以得出使算式平衡的相应盈亏比。","p":"p210"}]},{"t":"para","text":"是因为你的每笔交易还记得吗？都有极其聪明，长期总归稳定盈利的机构作为对手方。那如果你的操作非常好，高胜率又高盈亏比。那就代表跟你成交的那个机构做了一个低盈亏比又低胜率的糟糕决策。事情会是这样子吗？不会。换句话说，要是你认为自己看到了无异于捡钱的机会。那很可能代表是你解读错了，是你在给别人送钱。也因为这样，所有交易必然是公平的。一方享有胜率优势，但盈亏比差劲。一方享有高盈亏币，但胜率相对低落。这将导致你所获得的期望值其实没有办法跟零相距太远。我们就先假设公式导出的结果为零好了。然后再带进各种胜率。就可以得出使算式平衡的相应盈亏比。","pid":"p210"},{"t":"img","src":"assets/img/l01C_014.webp","ilabel":"1-3","icap":"L01　重新认识你所参与的这场游戏","fid":"fig14","ctx":[{"t":"是因为你的每笔交易还记得吗？都有极其聪明，长期总归稳定盈利的机构作为对手方。那如果你的操作非常好，高胜率又高盈亏比。那就代表跟你成交的那个机构做了一个低盈亏比又低胜率的糟糕决策。事情会是这样子吗？不会。换句话说，要是你认为自己看到了无异于捡钱的机会。那很可能代表是你解读错了，是你在给别人送钱。也因为这样，所有交易必然是公平的。一方享有胜率优势，但盈亏比差劲。一方享有高盈亏币，但胜率相对低落。这将导致你所获得的期望值其实没有办法跟零相距太远。我们就先假设公式导出的结果为零好了。然后再带进各种胜率。就可以得出使算式平衡的相应盈亏比。","p":"p210"},{"t":"你注意到了吗？这就跟前面提到的结论一样，想有胜率优势的话，盈亏比就会很糟糕。胜率和盈亏比永远成反比的关系。","p":"p211"}]},{"t":"para","text":"你注意到了吗？这就跟前面提到的结论一样，想有胜率优势的话，盈亏比就会很糟糕。胜率和盈亏比永远成反比的关系。","pid":"p211"},{"t":"img","src":"assets/img/l01C_015.webp","ilabel":"1-4","icap":"L01　重新认识你所参与的这场游戏","fid":"fig15","ctx":[{"t":"你注意到了吗？这就跟前面提到的结论一样，想有胜率优势的话，盈亏比就会很糟糕。胜率和盈亏比永远成反比的关系。","p":"p211"},{"t":"但要是你的交易技巧提升，处在合理的精湛范围。那或许就有机会在胜率不变的前提下，略微提高盈亏比，使整体期望值也为幅增长。","p":"p212"}]},{"t":"para","text":"但要是你的交易技巧提升，处在合理的精湛范围。那或许就有机会在胜率不变的前提下，略微提高盈亏比，使整体期望值也为幅增长。","pid":"p212"},{"t":"img","src":"assets/img/l01C_016.webp","ilabel":"1-5","icap":"L01　重新认识你所参与的这场游戏","fid":"fig16","ctx":[{"t":"但要是你的交易技巧提升，处在合理的精湛范围。那或许就有机会在胜率不变的前提下，略微提高盈亏比，使整体期望值也为幅增长。","p":"p212"},{"t":"反过来也是可以的，盈亏比不变，提高胜率也可以达到相同的效果。有了以上的认识，你应该可以想见，无论是给定胜率还是给定盈亏，比你都能够大致推估出合理的另一项。等到上完所有课程，你将学会仅介入那些具有数学优势，也就是期望大于零的交易机会。每每都这么做，就能够使长久的盈利成为可能。于是我们可以先在脑袋里保有一个简单的意识。你可以预期，只要有在正确的时机介入市场，那你争取1.0倍盈亏比，也就是一倍风险换一倍回报的交易。能有六成胜率。听起来还行吧，交易本当是多数人亏钱的生意，市场满布机构准备吸你的血。","p":"p213"},{"t":"但你不仅能够不亏钱，能够超越不赚不亏。还能在每十笔交易中以六胜凯旋归来，应该是还蛮不错的事情。而要是你认为一换一太小家子气了，你想一次多赚一点。那你也可以认为自己在学习之后能够四胜六败，以四成的胜率赚到两倍盈亏比。这两组数据对应的是剥头皮交易和波段交易的风格。在之后的单元会另外细说（L12），你可以先大概有个认识就好。不过你可能还好奇，还想要再贪多一点点。我能不能以七成的胜率争取两倍盈亏比呢？或者以五成的胜率争取五倍盈亏比。嗯，这就是个令人莞尔的问题了。这样的数字在初学阶段会听上去好像可行。但还记得我们刚才说的胜率跟盈亏比成反比吗？这两组数据的对应期望值是一点一跟二点零。这都远远超出合理值。没有任何机构会愿意做这种交易的对手方。也正是在这个时候，我们有必要揭示一个严重的问题。还在学习阶段的交易者之所以会出现重大的亏损，往往是因为他们严重错估胜率。你一定有过这个阶段，甚至还正在这个阶段。入场后，我打算拿三倍的盈亏比。甚至应该能有六成吧。不好意思，肯定没有。期望值为零，趋近公平的前提下。记得哦，市场通常都处于公平的均衡状态。那三倍盈亏比的对应胜率会是25%。这样的数据才接近现实。但因为错误的胜率估算，给了自己膨胀的自信心，往往会让你下过重的仓位。那想当然，一旦止损就是重伤。止损可能还是好的，就更怕你还止盈了。你一旦因此赚到过钱，所谓错把偶然当成必然。然后更得寸进尺，加倍下注的重复先前的行为。不过这算老天保佑你能闪过75%以上的止损，几率有几次呢？当真的止损了，可能不止重伤，你的账户或许整个也都没了。所以去除错误的杂念，还是请先谨记上面提供的两组数据，它们对应的期望值都是零点二。属于合理的范畴。要优化这些参数也不是不行。比如你可能在频道上的影片听我讲过，在我转做指数期货的日内交易以前，二点零对盈亏比的区间突破失败系统。对应的胜率在43%到47%之间，也就是介于零点二九到零点四一。是不同的品种与时期而已。但是我们要循序渐进的，慢慢来。或许你现在的交易行为也让你维持不赚不亏都没有办法。那我们的第一步会是要先停止亏损，追求近似零的期望。接下来，等到学会判断什么是更有利的市场环境，学会正确择时，正确管理你的持仓。那期望值就可能提升到可盈利的基本水准，也就是0.2。那在随着经验累积，你能够更精准的识别K线提供的各种资讯。那0.2就有机会继续被提升到0.3，0.4甚至0.5，逐步靠向精英交易者的境界。说到这里，对于交易这场游戏的重新认识，这项任务应该是顺利完成了。如今你已经知道市场，它自身是存在一种内在的驱动力的，它是有目的的。那就是去找到均衡价格，这个交易可以最大量最效率发生的地方。而由于市场中的各类行动者总是参考着不断变化的资讯来应对进退。因此，这个均衡价格往往也是动态存在的。市场会透过不断向上向下的探测，来确认自己是否仍然位在均衡附近。如果是就停留在这个范畴。如果不是多空的共识，就会将价格推往他处，直到找到新的均衡点。那我们所谓那个抽象的多空双方，他们实际上是谁？是复数的各怀鬼胎的即可获利的，长期总归能盈利的精明机构。他们的资金体量庞大，综合的创造了市场中85%到95%的成交量。而被夹在中间的我们这些个体交易者所能贡献的交易数额仅有百分之5到15%。因此，阿尔布鲁克斯提示的关于市场中其中一个最重要的事情就值得你铭记在心。无论你对于自己的交易决策有多确信。总有另一个至少跟你一样聪明的人，或说机器人跟你持完全相反的观点。为什么呢？因为与你多单成交的就是另一个坚决看空的机构交易者。而且你还要小心，它有非常大的几率，长期而言总是能赚大钱。因此，你要非常非常厉害，才能够不死在他的手上。另一个关于交易也最重要的事情是什么？是一切的背后都有数学逻辑，机构只会做具有数学优势的决策。因此，你不只要能够看懂图表上的所有资讯，借以理解机构的所作所为。你还要也同样精熟交易数学，才能确保自己的行动总是有利可图。请你铭记胜率与盈亏比成反比。不要错过胜率，不要下过重的仓位，然后死的不明不白。机构算法不会恐惧，也不会贪婪，为什么呢？或者是因为他们不是人类，而是因为他们只听命一个东西行事。那就是交易数据。你也必须精进交易数学。唯有精进，你才能够准确的在具有数学优势的时候，以正确的仓位管理介入市场，终而能够稳定获利。清楚以上要点以及往后所有单元所要教给你的技能之后，你应该就能够慢慢脱去对于市场的恐惧。我很清楚的晓得，新手交易者害怕非常多的事情。你可能害怕输钱，担心要是把辛辛苦苦积攒下来的储蓄都赔给你的交易对手。你以交易为生的梦想，就互判死刑。你可能害怕自己不够聪明，不够有纪律，不够努力或者不够果决，种种生理和心理的限制。将阻止你成为一位成功的交易者。你可能害怕朋友另一半家人对你感到不理解，担心你是个赌鬼，担心你搞不清楚自己在干什么。担心你是个软弱又愚昧的人，投身了错误的事业。但请你听我说各形各色的恐惧，其实不过是源自于对于市场以及对自己的不了解。一旦你抱持一个认真学习的心情，开始对所有的事物感到好奇，并且不放弃追问和调整。所有的困难都能够慢慢拨云见日。我也愿意不厌其烦的再说一次交易是个辛苦的行当，财富只留给勤恳的人。你如果希望能够长期盈利，我会说这是做得到的。但你必须同样长期稳定的比至少一半，总是盈利的机构表现更好。这代表什么呢？代表你必须忍受辛苦，而且你必须无与伦比的优秀。在最后，我想引用同样出自金融怪杰的一段话。受访者之一的Michael Steinhardt是这样劝诫交易学习者的。股市中最邪门的事情是，有时候你能够以最大的无知赚钱。但这种事却是一个邪恶的陷阱，会使人相信，无需专业知识就可以纵横股市。因此，我的忠告是要认清市场的竞争非常激烈。当你买进或卖出股票时，你的竞争对象都是一些专业的交易者。在许多情况下，这些专业者往往就是你的交易对手，早晚总会给你迎头痛击。","p":"p214"},{"t":"所以我想要诚挚的恭喜你，你已经在正确的道路上。从今天开始，你将会学的更多，问的更多，练习的更多，并且谦卑的更多。你已经是一个不一样的人了，知识不会背弃你，我对你有十足的信心。感谢收看，重新认识你所参与的这场游戏。朋友，预祝你学习顺利。","p":"p215"}]},{"t":"para","text":"反过来也是可以的，盈亏比不变，提高胜率也可以达到相同的效果。有了以上的认识，你应该可以想见，无论是给定胜率还是给定盈亏，比你都能够大致推估出合理的另一项。等到上完所有课程，你将学会仅介入那些具有数学优势，也就是期望大于零的交易机会。每每都这么做，就能够使长久的盈利成为可能。于是我们可以先在脑袋里保有一个简单的意识。你可以预期，只要有在正确的时机介入市场，那你争取1.0倍盈亏比，也就是一倍风险换一倍回报的交易。能有六成胜率。听起来还行吧，交易本当是多数人亏钱的生意，市场满布机构准备吸你的血。","pid":"p213"},{"t":"para","text":"但你不仅能够不亏钱，能够超越不赚不亏。还能在每十笔交易中以六胜凯旋归来，应该是还蛮不错的事情。而要是你认为一换一太小家子气了，你想一次多赚一点。那你也可以认为自己在学习之后能够四胜六败，以四成的胜率赚到两倍盈亏比。这两组数据对应的是剥头皮交易和波段交易的风格。在之后的单元会另外细说（L12），你可以先大概有个认识就好。不过你可能还好奇，还想要再贪多一点点。我能不能以七成的胜率争取两倍盈亏比呢？或者以五成的胜率争取五倍盈亏比。嗯，这就是个令人莞尔的问题了。这样的数字在初学阶段会听上去好像可行。但还记得我们刚才说的胜率跟盈亏比成反比吗？这两组数据的对应期望值是一点一跟二点零。这都远远超出合理值。没有任何机构会愿意做这种交易的对手方。也正是在这个时候，我们有必要揭示一个严重的问题。还在学习阶段的交易者之所以会出现重大的亏损，往往是因为他们严重错估胜率。你一定有过这个阶段，甚至还正在这个阶段。入场后，我打算拿三倍的盈亏比。甚至应该能有六
