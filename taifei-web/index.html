将单一个或少数几个建仓方案练到精湛。确保自己有盈利能力，可以长久稳定发挥之后再新增自己的技能，逐步扩大守备范围。或许到了第三四年，你已经备好五六种可以经熟操作增仓方案，个别对应不同的行情，不同的脉络。能让走势无论发展成市场循环的哪一个阶段，你都有相应的措施可以采取。一年内的短期，三，五年内的中期，以及十年为期的长期目标要分别设定清楚。比起想着一瞬间里我们亦步亦趋，会更加踏实。说到这里，您可能隐隐有个担忧，我大概知道风格如何选择了。不过我的数学可能没有那么好。即使练就在交易现场快速心算的能力，我还是没有把握我建仓方案究竟有没有正向期望。我想这你倒是不用太担心。只要你对前面的课程有过充分的吸收，你其实已经能够避免自己去做明显没有数学优势的事情。比如你只要在区间边线的内侧，不应该押注突破失败。你只要在急速运动中不能押注逆向反转。你也知道牛旗倾向上破趋势线，提前做空，希望通到下破，并不明智。所以有过这些基本的知识储备，你会接着学习，后面将要提到的我和阿尔布鲁克斯试验可行，有利可图的做法。知道具体该如何操作以及理据何在。等到你有资格被称为老练交易者时，你遭遇熟悉，看起来什么样的建仓形态具有正向期望。这不止来自于充分的读图经验，也来自于你自己常年来的测试。让数据提供你真实的信心。所以你的担忧可以被这样的做法解决。起步时先坚持只进行盈亏比大于一倍的交易。这代表只要其胜率能够高达五成，就至少能够盈亏平衡，这绝对是盈利以前的必经之路。一旦能够稳定维持胜率，你就可以在更进一步争取胜率更高或盈亏比更高的建仓形态，每天都会出现至少一到二次波段交易机会，会更好上手。我和阿尔布克斯都由衷推荐给你。说到这里，上战场前该晓得的你都晓得了，也透过这个单元，播音过程中提供给你的种种思考线索，你要更认识自己一点，知道哪一种交易风格会更贴近个性。后续，我们将提供不同市场脉络之下最易掌握，最能让你安全获取利润的方案。来供波段交易者与剥头皮交易者们自由选择。我相信你跟我一样期待。感谢收看交易风格波段和剥头皮交易的选择。我们下个单元见。","p":"p477"}]},{"t":"para","text":"从我以上在开始入场以前，你是否对于交易的风格与类型有基本认识呢？我们赶紧来回顾一下前头提及的知识，并进一步收敛给出结论。在一开始我们谈到市场中数学优势太过优异的交易机会，难以存在的原因。正由于机构都极其聪明，不会做蠢事，因而每一笔交易必然是相当接近于公平的。如果一方想有盈亏比优势，那就必须牺牲胜率，让其对手更有机会赢下一城。而选择胜率的代价则同样是放弃盈亏比，其对手一旦得逞，就能够获得大笔利润。这也就是说，两种风格波段和剥头皮交易者时常互为对手方。那究竟何为波段交易，何为剥头皮交易？我们可以先有个简单的定义。在日内波段交易的理型是，两倍盈亏比对应胜率四成，持续10根到30根K线的二推以上运动。剥头皮交易则短小精干的多，一点零倍盈亏比对应胜率有六成，仅持仓一到五根K线就离场。当然，两种类型同样坐落在连续的光谱之上，有介于两者之间的有外于两者。更大盈亏比或更小盈亏比的可能。小复习盈亏比和胜率的大致关系，除了可以参考第一单元提供的数据，你可以透过公式计算。来带入任何盈亏，比算出对应的盈亏平衡胜率。那既然两者的偏重不同，一个是相较于风险更丰厚的利润，一个是更频繁赢钱的稳定发挥。那有舍有得，我们也必须了解甜美果实背后的苦衷。作为波段交易者，你需要忍受屡屡失败，这当中不时的回调，导致利润回吐以及收获以前漫长耗时的等待。作为剥头皮交易者，你只要先备有非常高超的能力，不停的，系统性的辨识出胜率高于70%的交易机会。你还要忍受交易，变得像是一个重复而枯燥的劳力活，以及一旦止损就会损失惨重。不过，虽然看起来各有各的苦，但只要你能够辨识出什么样的市场环境，有利于自己的风格。那么，利润是能够水到渠成的。对波段交易者，请尽量把握急速，窄幅通道等趋势倾向延续的脉络。可这里却是剥头皮，交易者恰恰需要忌惮，不要冒进逆势入场。即使要交易，也必然要顺着趋势方向。相对的宽幅通道和区间则给到剥头皮交易者大量的交易机会。而令期待突破，期待失衡，长久持续的波段交易者感到郁闷。此际，波段风格的朋友，请尽可能保持观望。最后，我们来讨论了是否可以两者兼做的问题。绝对可以的，但应该分阶段来。新手交易者最大的亏损就源自于自以为行，赢者贪婪，想把原先只用来剥头皮的仓位做成波段。因为恐惧而将波段交易做成剥头皮。这种收放自如，需要强大的读图能力，我们难以在初学的前六个月，前12个月就行云流水。你应该考虑的是先选一边，并将单一个或少数几个建仓方案练到精湛。确保自己有盈利能力，可以长久稳定发挥之后再新增自己的技能，逐步扩大守备范围。或许到了第三四年，你已经备好五六种可以经熟操作增仓方案，个别对应不同的行情，不同的脉络。能让走势无论发展成市场循环的哪一个阶段，你都有相应的措施可以采取。一年内的短期，三，五年内的中期，以及十年为期的长期目标要分别设定清楚。比起想着一瞬间里我们亦步亦趋，会更加踏实。说到这里，您可能隐隐有个担忧，我大概知道风格如何选择了。不过我的数学可能没有那么好。即使练就在交易现场快速心算的能力，我还是没有把握我建仓方案究竟有没有正向期望。我想这你倒是不用太担心。只要你对前面的课程有过充分的吸收，你其实已经能够避免自己去做明显没有数学优势的事情。比如你只要在区间边线的内侧，不应该押注突破失败。你只要在急速运动中不能押注逆向反转。你也知道牛旗倾向上破趋势线，提前做空，希望通到下破，并不明智。所以有过这些基本的知识储备，你会接着学习，后面将要提到的我和阿尔布鲁克斯试验可行，有利可图的做法。知道具体该如何操作以及理据何在。等到你有资格被称为老练交易者时，你遭遇熟悉，看起来什么样的建仓形态具有正向期望。这不止来自于充分的读图经验，也来自于你自己常年来的测试。让数据提供你真实的信心。所以你的担忧可以被这样的做法解决。起步时先坚持只进行盈亏比大于一倍的交易。这代表只要其胜率能够高达五成，就至少能够盈亏平衡，这绝对是盈利以前的必经之路。一旦能够稳定维持胜率，你就可以在更进一步争取胜率更高或盈亏比更高的建仓形态，每天都会出现至少一到二次波段交易机会，会更好上手。我和阿尔布克斯都由衷推荐给你。说到这里，上战场前该晓得的你都晓得了，也透过这个单元，播音过程中提供给你的种种思考线索，你要更认识自己一点，知道哪一种交易风格会更贴近个性。后续，我们将提供不同市场脉络之下最易掌握，最能让你安全获取利润的方案。来供波段交易者与剥头皮交易者们自由选择。我相信你跟我一样期待。感谢收看交易风格波段和剥头皮交易的选择。我们下个单元见。","pid":"p477"}],"sections":[],"wcount":11461},{"id":"l13","icon":"L13","title":"L13　急速交易方法","blocks":[],"sections":[{"id":"l13A","title":"第A段　急速交易方法","blocks":[{"t":"para","text":"L13A  急速交易方法","pid":"p478"},{"t":"para","text":"欢迎来到急速交易方法的单元，今天我们把开场白精简一点，直接进入重点。告诉你，在这个单元中，我们依序处理哪些问题？","pid":"p479"},{"t":"img","src":"assets/img/l13A_205.webp","ilabel":"13-1","icap":"L13　急速交易方法","fid":"fig205","ctx":[{"t":"L13A  急速交易方法","p":"p478"},{"t":"欢迎来到急速交易方法的单元，今天我们把开场白精简一点，直接进入重点。告诉你，在这个单元中，我们依序处理哪些问题？","p":"p479"},{"t":"首先是向大家定下原则。我们要如何着手发展一个可盈利的建仓方案？它应该具备哪些素质？什么条件？以及为大家简洁有力地复习急速与窄幅通道脉络的性格特征。指出应该如何入场，为什么可以那样入场？再接着我们具体谈两种最容易驾驭，盈利效率最高的建仓方案，并向你补充其他逻辑相仿同样可行的其他做法。过程中会同样予以充分的实例展示，力求使你在短时间内抓到操作的轮廓。我们赶紧开始。","p":"p480"}]},{"t":"para","text":"首先是向大家定下原则。我们要如何着手发展一个可盈利的建仓方案？它应该具备哪些素质？什么条件？以及为大家简洁有力地复习急速与窄幅通道脉络的性格特征。指出应该如何入场，为什么可以那样入场？再接着我们具体谈两种最容易驾驭，盈利效率最高的建仓方案，并向你补充其他逻辑相仿同样可行的其他做法。过程中会同样予以充分的实例展示，力求使你在短时间内抓到操作的轮廓。我们赶紧开始。","pid":"p480"},{"t":"img","src":"assets/img/l13A_206.webp","ilabel":"13-2","icap":"L13　急速交易方法","fid":"fig206","ctx":[{"t":"首先是向大家定下原则。我们要如何着手发展一个可盈利的建仓方案？它应该具备哪些素质？什么条件？以及为大家简洁有力地复习急速与窄幅通道脉络的性格特征。指出应该如何入场，为什么可以那样入场？再接着我们具体谈两种最容易驾驭，盈利效率最高的建仓方案，并向你补充其他逻辑相仿同样可行的其他做法。过程中会同样予以充分的实例展示，力求使你在短时间内抓到操作的轮廓。我们赶紧开始。","p":"p480"},{"t":"有些机缘巧合之下，我能和一些很出色的交易者聊上天，交流彼此对于交易的理解。通常在这种时候，我最喜欢问的一个问题是，你是如何从无到有地发想一个全新的建仓方案的？你可以想象，这绝非易事。多数交易者在日常用以开仓的技术与流程都是直接效仿而来的。毕竟对多数人来说，能够赚钱才是重点，方法是不是原创的并不重要。不过我对你的期许是很高的。我不只希望你能够cover 1首曲子，上传到社群媒体，我还希望你可以自己写歌，能准确诠释你的心情与经验，做个性和思想的表达。开仓也是这样的，我希望你在接受训练之后，将来能够发想出合适自己的建仓方案。去赚取你所想要赚取的那段利润。所以如果是我将来有一天在某个YouTube的访谈节目上面被问到这一题，我会怎么回答呢？我想第一步是确保我所要发展的这个建仓方案合乎理论，并且是有数学优势的。理论与数学缺一不可。如果一个建仓方案，比如著名的月相指标，星月到满月期间价格会上涨。而且确实在你某一个所遭遇的品种上面得到了统计的佐证。你也不一定敢用，对吧？因为这缺乏价格行为的理据。而相反的，光有价格行为理据。比如，在某某均线上面，可能有磁体提供的反向订单作用。你就每每设定限价订单来押注反转。这也不一定可行。你操作的细节止损和止盈的设置有利和不利讯号的管理都可能导致理应可行的方案。却实际上并没有正向期望。那么，你要如何着手搭建可盈利的建仓方案呢？也简单，我路都帮你铺好了。你只需要翻找前面教过的种种原理和工具。比如，在反转交易方法的单元，我会教大家使用我最钟爱的建仓方案之一，楔形顶底的对角线反转。","p":"p481"}]},{"t":"para","text":"有些机缘巧合之下，我能和一些很出色的交易者聊上天，交流彼此对于交易的理解。通常在这种时候，我最喜欢问的一个问题是，你是如何从无到有地发想一个全新的建仓方案的？你可以想象，这绝非易事。多数交易者在日常用以开仓的技术与流程都是直接效仿而来的。毕竟对多数人来说，能够赚钱才是重点，方法是不是原创的并不重要。不过我对你的期许是很高的。我不只希望你能够cover 1首曲子，上传到社群媒体，我还希望你可以自己写歌，能准确诠释你的心情与经验，做个性和思想的表达。开仓也是这样的，我希望你在接受训练之后，将来能够发想出合适自己的建仓方案。去赚取你所想要赚取的那段利润。所以如果是我将来有一天在某个YouTube的访谈节目上面被问到这一题，我会怎么回答呢？我想第一步是确保我所要发展的这个建仓方案合乎理论，并且是有数学优势的。理论与数学缺一不可。如果一个建仓方案，比如著名的月相指标，星月到满月期间价格会上涨。而且确实在你某一个所遭遇的品种上面得到了统计的佐证。你也不一定敢用，对吧？因为这缺乏价格行为的理据。而相反的，光有价格行为理据。比如，在某某均线上面，可能有磁体提供的反向订单作用。你就每每设定限价订单来押注反转。这也不一定可行。你操作的细节止损和止盈的设置有利和不利讯号的管理都可能导致理应可行的方案。却实际上并没有正向期望。那么，你要如何着手搭建可盈利的建仓方案呢？也简单，我路都帮你铺好了。你只需要翻找前面教过的种种原理和工具。比如，在反转交易方法的单元，我会教大家使用我最钟爱的建仓方案之一，楔形顶底的对角线反转。","pid":"p481"},{"t":"img","src":"assets/img/l13A_207.webp","ilabel":"13-3","icap":"L13　急速交易方法","fid":"fig207","ctx":[{"t":"有些机缘巧合之下，我能和一些很出色的交易者聊上天，交流彼此对于交易的理解。通常在这种时候，我最喜欢问的一个问题是，你是如何从无到有地发想一个全新的建仓方案的？你可以想象，这绝非易事。多数交易者在日常用以开仓的技术与流程都是直接效仿而来的。毕竟对多数人来说，能够赚钱才是重点，方法是不是原创的并不重要。不过我对你的期许是很高的。我不只希望你能够cover 1首曲子，上传到社群媒体，我还希望你可以自己写歌，能准确诠释你的心情与经验，做个性和思想的表达。开仓也是这样的，我希望你在接受训练之后，将来能够发想出合适自己的建仓方案。去赚取你所想要赚取的那段利润。所以如果是我将来有一天在某个YouTube的访谈节目上面被问到这一题，我会怎么回答呢？我想第一步是确保我所要发展的这个建仓方案合乎理论，并且是有数学优势的。理论与数学缺一不可。如果一个建仓方案，比如著名的月相指标，星月到满月期间价格会上涨。而且确实在你某一个所遭遇的品种上面得到了统计的佐证。你也不一定敢用，对吧？因为这缺乏价格行为的理据。而相反的，光有价格行为理据。比如，在某某均线上面，可能有磁体提供的反向订单作用。你就每每设定限价订单来押注反转。这也不一定可行。你操作的细节止损和止盈的设置有利和不利讯号的管理都可能导致理应可行的方案。却实际上并没有正向期望。那么，你要如何着手搭建可盈利的建仓方案呢？也简单，我路都帮你铺好了。你只需要翻找前面教过的种种原理和工具。比如，在反转交易方法的单元，我会教大家使用我最钟爱的建仓方案之一，楔形顶底的对角线反转。","p":"p481"},{"t":"名字听起来复杂，其实不过是以下元素的组合。楔形顶内含三推，本身就是熊旗。不仅运行本来就时常折返自三推结束之后过程中，急剧的卖压也使熊旗将提供看跌的大方向。那么，辅以左方高出的重要波段点，作为反向订单可能重点积聚的位置，我就找到了起跌的潜在点位。也就是我要真正介入订单的地方。过程中还有楔形顶底的通道线作为辅助，同样是一个弱小的磁体。如果这个楔形顶还恰巧是某种急速与通道的等距，那么等距运动目标的效力又将附加进来。让这个入场更有优势。你注意到了吗？其实就是前头单元知识的结合。你早已掌握了材料。而交易生涯中，我切以为最有趣的事就是把玩这些积木。将它们组合成打磨成能够运转的赚钱机器。接下来，几个单元里，我所要向各位分享的就包括阿尔布鲁克斯明说可行以及我基于原理而自行设计的建仓方案。作为事例，你当然可以直接抄去用，但我更期待的是你习得发想的内在逻辑。将来也制作出专属于你的武器。","p":"p482"}]},{"t":"para","text":"名字听起来复杂，其实不过是以下元素的组合。楔形顶内含三推，本身就是熊旗。不仅运行本来就时常折返自三推结束之后过程中，急剧的卖压也使熊旗将提供看跌的大方向。那么，辅以左方高出的重要波段点，作为反向订单可能重点积聚的位置，我就找到了起跌的潜在点位。也就是我要真正介入订单的地方。过程中还有楔形顶底的通道线作为辅助，同样是一个弱小的磁体。如果这个楔形顶还恰巧是某种急速与通道的等距，那么等距运动目标的效力又将附加进来。让这个入场更有优势。你注意到了吗？其实就是前头单元知识的结合。你早已掌握了材料。而交易生涯中，我切以为最有趣的事就是把玩这些积木。将它们组合成打磨成能够运转的赚钱机器。接下来，几个单元里，我所要向各位分享的就包括阿尔布鲁克斯明说可行以及我基于原理而自行设计的建仓方案。作为事例，你当然可以直接抄去用，但我更期待的是你习得发想的内在逻辑。将来也制作出专属于你的武器。","pid":"p482"},{"t":"img","src":"assets/img/l13A_208.webp","ilabel":"13-4","icap":"L13　急速交易方法","fid":"fig208","ctx":[{"t":"名字听起来复杂，其实不过是以下元素的组合。楔形顶内含三推，本身就是熊旗。不仅运行本来就时常折返自三推结束之后过程中，急剧的卖压也使熊旗将提供看跌的大方向。那么，辅以左方高出的重要波段点，作为反向订单可能重点积聚的位置，我就找到了起跌的潜在点位。也就是我要真正介入订单的地方。过程中还有楔形顶底的通道线作为辅助，同样是一个弱小的磁体。如果这个楔形顶还恰巧是某种急速与通道的等距，那么等距运动目标的效力又将附加进来。让这个入场更有优势。你注意到了吗？其实就是前头单元知识的结合。你早已掌握了材料。而交易生涯中，我切以为最有趣的事就是把玩这些积木。将它们组合成打磨成能够运转的赚钱机器。接下来，几个单元里，我所要向各位分享的就包括阿尔布鲁克斯明说可行以及我基于原理而自行设计的建仓方案。作为事例，你当然可以直接抄去用，但我更期待的是你习得发想的内在逻辑。将来也制作出专属于你的武器。","p":"p482"},{"t":"今天谈的是急速交易方法。那显然，我们已经给定了脉络，就是要针对市场循环中的急速和窄幅通道阶段，拟定可盈利的措施。那么如理发想，我们必须先复习急速和窄幅通道的内含与特征。才知道怎么利用这些特征。所以我要测验大家的问题如下。如何定义急速？急速在什么事件发生以后结束转入通道阶段。如何定义窄幅通道？它与宽幅通道的根本区别何在？动能能交易者会在急速与窄幅通道之中追涨杀跌。他们因此可以盈利的原理是什么？以及基于上述原理，你认为设计什么样的建仓方案会是可行的？我想你可能会需要一点时间翻阅先前的笔记才能完整回答这些题目。欢迎中断这节课的观看，把答案拟好以后再回来。尤其第三题有至少三项理由，不是那么容易。所以花点时间慢慢想想，而非直接跟我对答案会最有助于你融会贯通。不过如果你很有自信，可以充分地答复。那在十秒之后，我会接着讲解。","p":"p483"}]},{"t":"para","text":"今天谈的是急速交易方法。那显然，我们已经给定了脉络，就是要针对市场循环中的急速和窄幅通道阶段，拟定可盈利的措施。那么如理发想，我们必须先复习急速和窄幅通道的内含与特征。才知道怎么利用这些特征。所以我要测验大家的问题如下。如何定义急速？急速在什么事件发生以后结束转入通道阶段。如何定义窄幅通道？它与宽幅通道的根本区别何在？动能能交易者会在急速与窄幅通道之中追涨杀跌。他们因此可以盈利的原理是什么？以及基于上述原理，你认为设计什么样的建仓方案会是可行的？我想你可能会需要一点时间翻阅先前的笔记才能完整回答这些题目。欢迎中断这节课的观看，把答案拟好以后再回来。尤其第三题有至少三项理由，不是那么容易。所以花点时间慢慢想想，而非直接跟我对答案会最有助于你融会贯通。不过如果你很有自信，可以充分地答复。那在十秒之后，我会接着讲解。","pid":"p483"},{"t":"img","src":"assets/img/l13A_209.webp","ilabel":"13-5","icap":"L13　急速交易方法","fid":"fig209","ctx":[{"t":"今天谈的是急速交易方法。那显然，我们已经给定了脉络，就是要针对市场循环中的急速和窄幅通道阶段，拟定可盈利的措施。那么如理发想，我们必须先复习急速和窄幅通道的内含与特征。才知道怎么利用这些特征。所以我要测验大家的问题如下。如何定义急速？急速在什么事件发生以后结束转入通道阶段。如何定义窄幅通道？它与宽幅通道的根本区别何在？动能能交易者会在急速与窄幅通道之中追涨杀跌。他们因此可以盈利的原理是什么？以及基于上述原理，你认为设计什么样的建仓方案会是可行的？我想你可能会需要一点时间翻阅先前的笔记才能完整回答这些题目。欢迎中断这节课的观看，把答案拟好以后再回来。尤其第三题有至少三项理由，不是那么容易。所以花点时间慢慢想想，而非直接跟我对答案会最有助于你融会贯通。不过如果你很有自信，可以充分地答复。那在十秒之后，我会接着讲解。","p":"p483"},{"t":"好，第一题急速的定义，急速何时转入通道？如第三单元说的急速即突破，所以它必须有一个突破的对象。以及在这一串连续运行里面严格交易者，通常能够允许停顿，但不允许出现回调。所以如果一段上升急速发起一根接着一根。那直到回调K线出现低点，开始降低，那你可以说急速阶段结束了，接下来将转入通道。","p":"p484"}]},{"t":"para","text":"好，第一题急速的定义，急速何时转入通道？如第三单元说的急速即突破，所以它必须有一个突破的对象。以及在这一串连续运行里面严格交易者，通常能够允许停顿，但不允许出现回调。所以如果一段上升急速发起一根接着一根。那直到回调K线出现低点，开始降低，那你可以说急速阶段结束了，接下来将转入通道。","pid":"p484"},{"t":"img","src":"assets/img/l13A_210.webp","ilabel":"13-6","icap":"L13　急速交易方法","fid":"fig210","ctx":[{"t":"好，第一题急速的定义，急速何时转入通道？如第三单元说的急速即突破，所以它必须有一个突破的对象。以及在这一串连续运行里面严格交易者，通常能够允许停顿，但不允许出现回调。所以如果一段上升急速发起一根接着一根。那直到回调K线出现低点，开始降低，那你可以说急速阶段结束了，接下来将转入通道。","p":"p484"},{"t":"那么，通道也有宽窄之分。决定宽窄分界的是逆势方是否可以开始以限价订单乃至于停止订单来盈利。如果可以代表顺势动能已经衰退到不行。顺势方每逢原趋势极值被突破，做的都不是追进，而是撤退。那么，通道斜率就将越来越缓，直到转入区间。所以只要没有这种特征，那就是窄幅通道，偶有停顿和回调，但对趋势延续还不构成威胁。我们就可以想象，距离均衡还远。","p":"p485"}]},{"t":"para","text":"那么，通道也有宽窄之分。决定宽窄分界的是逆势方是否可以开始以限价订单乃至于停止订单来盈利。如果可以代表顺势动能已经衰退到不行。顺势方每逢原趋势极值被突破，做的都不是追进，而是撤退。那么，通道斜率就将越来越缓，直到转入区间。所以只要没有这种特征，那就是窄幅通道，偶有停顿和回调，但对趋势延续还不构成威胁。我们就可以想象，距离均衡还远。","pid":"p485"},{"t":"img","src":"assets/img/l13A_211.webp","ilabel":"13-7","icap":"L13　急速交易方法","fid":"fig211","ctx":[{"t":"那么，通道也有宽窄之分。决定宽窄分界的是逆势方是否可以开始以限价订单乃至于停止订单来盈利。如果可以代表顺势动能已经衰退到不行。顺势方每逢原趋势极值被突破，做的都不是追进，而是撤退。那么，通道斜率就将越来越缓，直到转入区间。所以只要没有这种特征，那就是窄幅通道，偶有停顿和回调，但对趋势延续还不构成威胁。我们就可以想象，距离均衡还远。","p":"p485"},{"t":"而结合这两点，要进一步向你强调的重点是窄幅通道，在更大时间级别图表上面，应该等同于急速。斜率越陡，停顿越少，通道越窄，两者就越有理由被一视同仁。而与此高度相关的是，既然两者相距不远，都代表趋势的动能仍然饱足。那你就应该只进行顺势的波段和剥头皮交易，逆势操作，万万不可。","p":"p486"}]},{"t":"para","text":"而结合这两点，要进一步向你强调的重点是窄幅通道，在更大时间级别图表上面，应该等同于急速。斜率越陡，停顿越少，通道越窄，两者就越有理由被一视同仁。而与此高度相关的是，既然两者相距不远，都代表趋势的动能仍然饱足。那你就应该只进行顺势的波段和剥头皮交易，逆势操作，万万不可。","pid":"p486"},{"t":"img","src":"assets/img/l13A_212.webp","ilabel":"13-8","icap":"L13　急速交易方法","fid":"fig212","ctx":[{"t":"而结合这两点，要进一步向你强调的重点是窄幅通道，在更大时间级别图表上面，应该等同于急速。斜率越陡，停顿越少，通道越窄，两者就越有理由被一视同仁。而与此高度相关的是，既然两者相距不远，都代表趋势的动能仍然饱足。那你就应该只进行顺势的波段和剥头皮交易，逆势操作，万万不可。","p":"p486"},{"t":"那第三题呢？这些动能交易者，卯足全力开始顺势追进其理据何在呢？首先重点在于我们之前讲过的抽象理念。顺势方开始占有极大数学优势和形成急速运动，两者互为因果。既然有突破发生，让你可以在图表上面观测得到。那这代表动能机构判断追进有利可图，存在数学优势。所以他们才会这么做。而由于众人追进，那么预言就开始自我实现，造就了急速运动，然后反过来给予动能交易者追进的理由。于是有急速就有人追，有人追就延续急速，这导致趋势可以自我维持。直到逆势方认为已经运行过度开始介入，而顺势方渐次决定止盈离场。不过在那之前，如果你也跟随人潮，那么后浪会将包括你在内的前浪推离突破点，使你可以获利。这正是在急速之中追进有利可图的原因之一。那除此之外，也别忘记了另外一个理由。突破发生之后，通常还有第二推的等距运动作为延续。如果你对第十单元的内容熟悉，应该不难想起来你曾经揣摩过动能交易者和价值交易者的指引逻辑。给予急速实体高度的等距投映，考虑的是动能交易者追入之后的利润目标测算。而AB=CD则是价值交易者在回调过程中入场时可能会怎么样去摆放具有数学优势的止盈。后者通常会比前者更早抵达。所以即使第一推告终，转入回调，也由于急速突破，将踏空者和被套者陷于劣势。他们自救的行为会推展出第二推。这个第二推就是在急速之中入场的交易者，能够获利之处。那么，总和一与二，我们就可以推导出大家朗朗上口，但不见得知道原因的道理。趋势倾向延续，而趋势中80%以上的反转尝试都会失败。过往大家在学习之前可能知道这个道理。但如果要扪心自问，能不能说出个精细的理由，可能就会突然之无其辞。不过，如今逆境之道如何从数学优势，从等距运动的角度去理解突破后的运动惯性了。这不是口号背后存在着扎实的道理。也于是我们就可以利用市场存在惯性，这一点去争取急速与窄幅通道中波段与剥头皮的利润。如此一来，我们就快速压缩了，分居前面不同单元的道理，一次带你将关于急速和窄幅通道的要点都搜集到了。","p":"p487"}]},{"t":"para","text":"那第三题呢？这些动能交易者，卯足全力开始顺势追进其理据何在呢？首先重点在于我们之前讲过的抽象理念。顺势方开始占有极大数学优势和形成急速运动，两者互为因果。既然有突破发生，让你可以在图表上面观测得到。那这代表动能机构判断追进有利可图，存在数学优势。所以他们才会这么做。而由于众人追进，那么预言就开始自我实现，造就了急速运动，然后反过来给予动能交易者追进的理由。于是有急速就有人追，有人追就延续急速，这导致趋势可以自我维持。直到逆势方认为已经运行过度开始介入，而顺势方渐次决定止盈离场。不过在那之前，如果你也跟随人潮，那么后浪会将包括你在内的前浪推离突破点，使你可以获利。这正是在急速之中追进有利可图的原因之一。那除此之外，也别忘记了另外一个理由。突破发生之后，通常还有第二推的等距运动作为延续。如果你对第十单元的内容熟悉，应该不难想起来你曾经揣摩过动能交易者和价值交易者的指引逻辑。给予急速实体高度的等距投映，考虑的是动能交易者追入之后的利润目标测算。而AB=CD则是价值交易者在回调过程中入场时可能会怎么样去摆放具有数学优势的止盈。后者通常会比前者更早抵达。所以即使第一推告终，转入回调，也由于急速突破，将踏空者和被套者陷于劣势。他们自救的行为会推展出第二推。这个第二推就是在急速之中入场的交易者，能够获利之处。那么，总和一与二，我们就可以推导出大家朗朗上口，但不见得知道原因的道理。趋势倾向延续，而趋势中80%以上的反转尝试都会失败。过往大家在学习之前可能知道这个道理。但如果要扪心自问，能不能说出个精细的理由，可能就会突然之无其辞。不过，如今逆境之道如何从数学优势，从等距运动的角度去理解突破后的运动惯性了。这不是口号背后存在着扎实的道理。也于是我们就可以利用市场存在惯性，这一点去争取急速与窄幅通道中波段与剥头皮的利润。如此一来，我们就快速压缩了，分居前面不同单元的道理，一次带你将关于急速和窄幅通道的要点都搜集到了。","pid":"p487"},{"t":"img","src":"assets/img/l13A_213.webp","ilabel":"13-9","icap":"L13　急速交易方法","fid":"fig213","ctx":[{"t":"那第三题呢？这些动能交易者，卯足全力开始顺势追进其理据何在呢？首先重点在于我们之前讲过的抽象理念。顺势方开始占有极大数学优势和形成急速运动，两者互为因果。既然有突破发生，让你可以在图表上面观测得到。那这代表动能机构判断追进有利可图，存在数学优势。所以他们才会这么做。而由于众人追进，那么预言就开始自我实现，造就了急速运动，然后反过来给予动能交易者追进的理由。于是有急速就有人追，有人追就延续急速，这导致趋势可以自我维持。直到逆势方认为已经运行过度开始介入，而顺势方渐次决定止盈离场。不过在那之前，如果你也跟随人潮，那么后浪会将包括你在内的前浪推离突破点，使你可以获利。这正是在急速之中追进有利可图的原因之一。那除此之外，也别忘记了另外一个理由。突破发生之后，通常还有第二推的等距运动作为延续。如果你对第十单元的内容熟悉，应该不难想起来你曾经揣摩过动能交易者和价值交易者的指引逻辑。给予急速实体高度的等距投映，考虑的是动能交易者追入之后的利润目标测算。而AB=CD则是价值交易者在回调过程中入场时可能会怎么样去摆放具有数学优势的止盈。后者通常会比前者更早抵达。所以即使第一推告终，转入回调，也由于急速突破，将踏空者和被套者陷于劣势。他们自救的行为会推展出第二推。这个第二推就是在急速之中入场的交易者，能够获利之处。那么，总和一与二，我们就可以推导出大家朗朗上口，但不见得知道原因的道理。趋势倾向延续，而趋势中80%以上的反转尝试都会失败。过往大家在学习之前可能知道这个道理。但如果要扪心自问，能不能说出个精细的理由，可能就会突然之无其辞。不过，如今逆境之道如何从数学优势，从等距运动的角度去理解突破后的运动惯性了。这不是口号背后存在着扎实的道理。也于是我们就可以利用市场存在惯性，这一点去争取急速与窄幅通道中波段与剥头皮的利润。如此一来，我们就快速压缩了，分居前面不同单元的道理，一次带你将关于急速和窄幅通道的要点都搜集到了。","p":"p487"},{"t":"那接着我们就可以来回答第四题。借此，我们可以发展出哪些建仓方案呢？我们搭配例子来陪大家思考，看看如何开发入场的方法。你在画面上看到的是前一天交易日的尾巴，以及隔一天的另一个交易日。如果我们先来盘点一下发生了什么事。可以发现，今天是个跳空高开的日子。不过却没有延续上涨，反而是下破开盘区间，走出连续的阴线。由于左边没有截图，我们无法确定这里是否基于高潮理由撞到一个磁体之后失去跟进而开启反转。但总之，下跌是很强劲的一根接着一根。眼尖的话，你还可以看见这里有一根长上影线的外包阴线，几乎光角。这代表有多头在开盘区间底部，设法以高一做多而被套。那最后，其解套的卖压就成就了下跌的开启。连续的阴线在整段上涨的50%回调处出现了一根阳线，一次高一。但在这里，多头没有吹响反攻的号角。反而又是外包的趋势阴线继续推动下跌。虽然下跌变成了漫长的下跌通道。但第一推以后还有第二推的预期是成立的。您不难发现，不仅基于AB=CD的等距运动目标抵达了。基于急速实体的等距投影，最终也到了。","p":"p488"}]},{"t":"para","text":"那接着我们就可以来回答第四题。借此，我们可以发展出哪些建仓方案呢？我们搭配例子来陪大家思考，看看如何开发入场的方法。你在画面上看到的是前一天交易日的尾巴，以及隔一天的另一个交易日。如果我们先来盘点一下发生了什么事。可以发现，今天是个跳空高开的日子。不过却没有延续上涨，反而是下破开盘区间，走出连续的阴线。由于左边没有截图，我们无法确定这里是否基于高潮理由撞到一个磁体之后失去跟进而开启反转。但总之，下跌是很强劲的一根接着一根。眼尖的话，你还可以看见这里有一根长上影线的外包阴线，几乎光角。这代表有多头在开盘区间底部，设法以高一做多而被套。那最后，其解套的卖压就成就了下跌的开启。连续的阴线在整段上涨的50%回调处出现了一根阳线，一次高一。但在这里，多头没有吹响反攻的号角。反而又是外包的趋势阴线继续推动下跌。虽然下跌变成了漫长的下跌通道。但第一推以后还有第二推的预期是成立的。您不难发现，不仅基于AB=CD的等距运动目标抵达了。基于急速实体的等距投影，最终也到了。","pid":"p488"},{"t":"img","src":"assets/img/l13A_214.webp","ilabel":"13-10","icap":"L13　急速交易方法","fid":"fig214","ctx":[{"t":"那接着我们就可以来回答第四题。借此，我们可以发展出哪些建仓方案呢？我们搭配例子来陪大家思考，看看如何开发入场的方法。你在画面上看到的是前一天交易日的尾巴，以及隔一天的另一个交易日。如果我们先来盘点一下发生了什么事。可以发现，今天是个跳空高开的日子。不过却没有延续上涨，反而是下破开盘区间，走出连续的阴线。由于左边没有截图，我们无法确定这里是否基于高潮理由撞到一个磁体之后失去跟进而开启反转。但总之，下跌是很强劲的一根接着一根。眼尖的话，你还可以看见这里有一根长上影线的外包阴线，几乎光角。这代表有多头在开盘区间底部，设法以高一做多而被套。那最后，其解套的卖压就成就了下跌的开启。连续的阴线在整段上涨的50%回调处出现了一根阳线，一次高一。但在这里，多头没有吹响反攻的号角。反而又是外包的趋势阴线继续推动下跌。虽然下跌变成了漫长的下跌通道。但第一推以后还有第二推的预期是成立的。您不难发现，不仅基于AB=CD的等距运动目标抵达了。基于急速实体的等距投影，最终也到了。","p":"p488"},{"t":"这两个目标以及基于这个区间高度的等距，三者都与昨日低点颇为吻合。测试到位以后，立即出现了连续阳线的反弹。而在这段下跌的过程中，如果没有具体的介入方法来获取长远的波段利润，那将再好不过，对吧？如何做呢？","p":"p489"},{"t":"向你介绍第一种做法。在每根趋势K线收线以后，直接市价追进。","p":"p490"}]},{"t":"para","text":"这两个目标以及基于这个区间高度的等距，三者都与昨日低点颇为吻合。测试到位以后，立即出现了连续阳线的反弹。而在这段下跌的过程中，如果没有具体的介入方法来获取长远的波段利润，那将再好不过，对吧？如何做呢？","pid":"p489"},{"t":"para","text":"向你介绍第一种做法。在每根趋势K线收线以后，直接市价追进。","pid":"p490"},{"t":"img","src":"assets/img/l13A_215.webp","ilabel":"13-11","icap":"L13　急速交易方法","fid":"fig215","ctx":[{"t":"这两个目标以及基于这个区间高度的等距，三者都与昨日低点颇为吻合。测试到位以后，立即出现了连续阳线的反弹。而在这段下跌的过程中，如果没有具体的介入方法来获取长远的波段利润，那将再好不过，对吧？如何做呢？","p":"p489"},{"t":"向你介绍第一种做法。在每根趋势K线收线以后，直接市价追进。","p":"p490"},{"t":"听起来有点无脑或者冒进，但确实是可行的。毕竟这一根又一根的趋势K线何以生成？就是因为有机构交易者仗着急速将带来极大的数学优势，所以六亲不认的按下追入。如果我们也学会这样的方法，这不过是在追随机构的脚步。你可以见得阿尔布鲁克斯和他的学生也都是这么做的。","p":"p491"}]},{"t":"para","text":"听起来有点无脑或者冒进，但确实是可行的。毕竟这一根又一根的趋势K线何以生成？就是因为有机构交易者仗着急速将带来极大的数学优势，所以六亲不认的按下追入。如果我们也学会这样的方法，这不过是在追随机构的脚步。你可以见得阿尔布鲁克斯和他的学生也都是这么做的。","pid":"p491"},{"t":"img","src":"assets/img/l13A_216.webp","ilabel":"13-12","icap":"L13　急速交易方法","fid":"fig216","ctx":[{"t":"听起来有点无脑或者冒进，但确实是可行的。毕竟这一根又一根的趋势K线何以生成？就是因为有机构交易者仗着急速将带来极大的数学优势，所以六亲不认的按下追入。如果我们也学会这样的方法，这不过是在追随机构的脚步。你可以见得阿尔布鲁克斯和他的学生也都是这么做的。","p":"p491"},{"t":"这两张图表尾盘分别是上升和下跌的急速行情。都可以看见他们在收线时市价追进的标记。所以退回刚刚的例子，我们可以怎么做呢？也是当突破有跟进后，趋势阴线收出，我们便跟随之。不过，有些条件需要你注意。首先，如果你要这么追进成功的突破，当然要有跟进，这是最基本的要求。同样动能充沛的优良连续性是逆势方放弃抵抗的表现。所以在后面行情都还没出现，以前如果你向左一看，今天开盘区间到昨日尾盘高点之间。没有什么显著的磁体。那你可能可以预期下跌会比较顺畅。那至少开盘区间低点要被跌破，而后续要跟进。就这根阴线而言，是非常好的讯号K线兼入场K线。它向你发送了跟进扎实，动能强劲的讯号，并提示你在收线时市价入场。这时候做空进去，你将能够测算给予当前急速实体高度的等距利润。因为机构也是如此研判的。他们认为，有数学优势才会创造出这样的急速。那后续价格确实运动至此。你可能也想问，那下一根也是急速中的强劲趋势阴线，这也可以市价追进吗？答案是可以的。他同样实体明确，甚至光脚代表空头，直到最后一刻还在进场。他们认为，市价做空依旧有利可图。下一根也同样如此。甚至如果你激进一点，愿意在回调出现后的第二推也参与急速追进。那么，等到回调K线出现价格转入窄幅通道。但对方才的空头趋势极值，停顿的低点再次下破，并且有跟进。你可能也有理由继续市价追测算等值利润。后面这两根小阴线是否构成了足够可靠的市价入场理由？这就见仁见智了。但以这个例子来说，目标仍是能够成功抵达。这样连续的下跌动能强劲到可以被称作是“收线入场趋势”亦及收线时市价追近。可以获利的优质趋势行情。怎么辨别呢？除了K线动能的强劲之外，比较情绪性的判准是，如果你察觉到自己在渴望回调出现。那就应该假设回调不会出现。这种急迫感是机构正在积极追入的现象，于是你也应该追随机构。另外，只要行进路径上没有显著的磁体，突破后的跟进远离突破点越远越好。你可以想象，有时候突破是发生的，没错，后面也有跟进。但突破距离不是很远，跟进的也不是非常漂亮。它基于区间存在磁力可能拉扯价格，只返回到区间内部的理由。你在此决定的数学优势很可能弱于突破交易者。不过这个例子就挺好的。首个入场机会就已经距离突破点遥远。而且前面外包K线的长上影线就已经可以被理解为是对突破点的突破回调。那接下来，由于左方没有磁体，那下坠就可能颇为流畅。","p":"p492"},{"t":"那既然要建仓，肯定绕不开止损和止盈，对吧？之前就说过，建立仓位的，当下就必须为离场打定主意。我们才可以基于盈亏比来预期胜率。如果你是在急速之中追进，你会怎么设定止损和止盈呢？对刚学第一摊的你，我和阿尔布鲁克斯都建议，无论你入场在何处，止损都应该要位于推动起点之外。为什么这样讲？我想肯定有不少朋友反射性的认为，这样的止损太宽了，难以承受。但必须让你知道的是，所有止盈的设置都应该要严格给予价格行为的理由，而非你觉得好不好受？无论你是在哪一根K线介入的，与你同步追进的机构都理应是设想将上一个重要波段点。视作是要严加防守的位置。并在这样的前提之下，认定追求等距力认可行，有超过60%的胜率，他们才会如此做。如果你将止损设在半路。你认为这有什么道理呢？这里何来理由出现反向订单保护你的仓位不被无效止损呢？不急于价格行为理由的止损通常是无效，没有数学优势的。即使让你躲过一两仓，也更可能只是侥幸。所以我强烈建议你最好等到下一波回调发生并结束，且趋势又恢复一段时间。也就是产生新的重要波段点后才缩紧挪动止损到重要波段点之外。","p":"p493"},{"t":"止盈呢？止盈就好办了。我们既然是认定，追求等距利润能有胜率优势。那初始的止盈目标当然就会落在等距之处。所以对于这个例子里的每一根强劲趋势K线，你都可以用同样的方式在收线之时市价追进。为什么要等收线？因为K线就如任何比赛，要到结束的那一刻，胜负才会揭晓。在此之前，无论哪一方占据多么夸张的优势，都有可能如龟兔赛跑一样逆转。总之，等待收线将止损放置在运行起点或重要波段点之外。丈量等距利润等待延续的趋势去触发你的止盈订单离场。","p":"p494"}]},{"t":"para","text":"这两张图表尾盘分别是上升和下跌的急速行情。都可以看见他们在收线时市价追进的标记。所以退回刚刚的例子，我们可以怎么做呢？也是当突破有跟进后，趋势阴线收出，我们便跟随之。不过，有些条件需要你注意。首先，如果你要这么追进成功的突破，当然要有跟进，这是最基本的要求。同样动能充沛的优良连续性是逆势方放弃抵抗的表现。所以在后面行情都还没出现，以前如果你向左一看，今天开盘区间到昨日尾盘高点之间。没有什么显著的磁体。那你可能可以预期下跌会比较顺畅。那至少开盘区间低点要被跌破，而后续要跟进。就这根阴线而言，是非常好的讯号K线兼入场K线。它向你发送了跟进扎实，动能强劲的讯号，并提示你在收线时市价入场。这时候做空进去，你将能够测算给予当前急速实体高度的等距利润。因为机构也是如此研判的。他们认为，有数学优势才会创造出这样的急速。那后续价格确实运动至此。你可能也想问，那下一根也是急速中的强劲趋势阴线，这也可以市价追进吗？答案是可以的。他同样实体明确，甚至光脚代表空头，直到最后一刻还在进场。他们认为，市价做空依旧有利可图。下一根也同样如此。甚至如果你激进一点，愿意在回调出现后的第二推也参与急速追进。那么，等到回调K线出现价格转入窄幅通道。但对方才的空头趋势极值，停顿的低点再次下破，并且有跟进。你可能也有理由继续市价追测算等值利润。后面这两根小阴线是否构成了足够可靠的市价入场理由？这就见仁见智了。但以这个例子来说，目标仍是能够成功抵达。这样连续的下跌动能强劲到可以被称作是“收线入场趋势”亦及收线时市价追近。可以获利的优质趋势行情。怎么辨别呢？除了K线动能的强劲之外，比较情绪性的判准是，如果你察觉到自己在渴望回调出现。那就应该假设回调不会出现。这种急迫感是机构正在积极追入的现象，于是你也应该追随机构。另外，只要行进路径上没有显著的磁体，突破后的跟进远离突破点越远越好。你可以想象，有时候突破是发生的，没错，后面也有跟进。但突破距离不是很远，跟进的也不是非常漂亮。它基于区间存在磁力可能拉扯价格，只返回到区间内部的理由。你在此决定的数学优势很可能弱于突破交易者。不过这个例子就挺好的。首个入场机会就已经距离突破点遥远。而且前面外包K线的长上影线就已经可以被理解为是对突破点的突破回调。那接下来，由于左方没有磁体，那下坠就可能颇为流畅。","pid":"p492"},{"t":"para","text":"那既然要建仓，肯定绕不开止损和止盈，对吧？之前就说过，建立仓位的，当下就必须为离场打定主意。我们才可以基于盈亏比来预期胜率。如果你是在急速之中追进，你会怎么设定止损和止盈呢？对刚学第一摊的你，我和阿尔布鲁克斯都建议，无论你入场在何处，止损都应该要位于推动起点之外。为什么这样讲？我想肯定有不少朋友反射性的认为，这样的止损太宽了，难以承受。但必须让你知道的是，所有止盈的设置都应该要严格给予价格行为的理由，而非你觉得好不好受？无论你是在哪一根K线介入的，与你同步追进的机构都理应是设想将上一个重要波段点。视作是要严加防守的位置。并在这样的前提之下，认定追求等距力认可行，有超过60%的胜率，他们才会如此做。如果你将止损设在半路。你认为这有什么道理呢？这里何来理由出现反向订单保护你的仓位不被无效止损呢？不急于价格行为理由的止损通常是无效，没有数学优势的。即使让你躲过一两仓，也更可能只是侥幸。所以我强烈建议你最好等到下一波回调发生并结束，且趋势又恢复一段时间。也就是产生新的重要波段点后才缩紧挪动止损到重要波段点之外。","pid":"p493"},{"t":"para","text":"止盈呢？止盈就好办了。我们既然是认定，追求等距利润能有胜率优势。那初始的止盈目标当然就会落在等距之处。所以对于这个例子里的每一根强劲趋势K线，你都可以用同样的方式在收线之时市价追进。为什么要等收线？因为K线就如任何比赛，要到结束的那一刻，胜负才会揭晓。在此之前，无论哪一方占据多么夸张的优势，都有可能如龟兔赛跑一样逆转。总之，等待收线将止损放置在运行起点或重要波段点之外。丈量等距利润等待延续的趋势去触发你的止盈订单离场。","pid":"p494"},{"t":"img","src":"assets/img/l13A_217.webp","ilabel":"13-13","icap":"L13　急速交易方法","fid":"fig217","ctx":[{"t":"那既然要建仓，肯定绕不开止损和止盈，对吧？之前就说过，建立仓位的，当下就必须为离场打定主意。我们才可以基于盈亏比来预期胜率。如果你是在急速之中追进，你会怎么设定止损和止盈呢？对刚学第一摊的你，我和阿尔布鲁克斯都建议，无论你入场在何处，止损都应该要位于推动起点之外。为什么这样讲？我想肯定有不少朋友反射性的认为，这样的止损太宽了，难以承受。但必须让你知道的是，所有止盈的设置都应该要严格给予价格行为的理由，而非你觉得好不好受？无论你是在哪一根K线介入的，与你同步追进的机构都理应是设想将上一个重要波段点。视作是要严加防守的位置。并在这样的前提之下，认定追求等距力认可行，有超过60%的胜率，他们才会如此做。如果你将止损设在半路。你认为这有什么道理呢？这里何来理由出现反向订单保护你的仓位不被无效止损呢？不急于价格行为理由的止损通常是无效，没有数学优势的。即使让你躲过一两仓，也更可能只是侥幸。所以我强烈建议你最好等到下一波回调发生并结束，且趋势又恢复一段时间。也就是产生新的重要波段点后才缩紧挪动止损到重要波段点之外。","p":"p493"},{"t":"止盈呢？止盈就好办了。我们既然是认定，追求等距利润能有胜率优势。那初始的止盈目标当然就会落在等距之处。所以对于这个例子里的每一根强劲趋势K线，你都可以用同样的方式在收线之时市价追进。为什么要等收线？因为K线就如任何比赛，要到结束的那一刻，胜负才会揭晓。在此之前，无论哪一方占据多么夸张的优势，都有可能如龟兔赛跑一样逆转。总之，等待收线将止损放置在运行起点或重要波段点之外。丈量等距利润等待延续的趋势去触发你的止盈订单离场。","p":"p494"},{"t":"另一个例子，我们来看看这个台指期的交易日。你直觉可见图表中有两段急速的显著的运动。不过前者若是以相同的方式市价追近收线，那最后你将会止损。为什么呢？聪明的你应该可以对照前述的条件来得出答案。我们说突破需要有跟进，而且最好能够远离突破点。但在这个例子里，我们看到的却是价格突破磁体时，虽然是饱满的阳线，但下一根旋即陷入停顿。其实我们认为此际，或许价格只是暂时回调了一下，后面还会继续起高。但接着我们看到的又是长上影线的突破失败证据。就双双证明了这里不存在流畅的多头动能。于是你可以说此处的趋势K线不是有效突破，而是潜在高潮运动的可能性就提升了。而当后续确实出现三推的总共两次对原趋势极值突破失败的线索以后。熊旗就引发下跌，使价格又复返回到双边交易的状态之中。不过后面这段下跌就有十足的介入理由了。在顶部形成通道或受区间被一根非常强劲的趋势阴线下破，而下破之后还有跟进。你可以看见区间的下缘被挺有效的穿透，也有过测试而跟进K线又收的远离突破点。那以上就表明了空头的坚决。那如果价格行进的路上还一路畅通，就更值得欣喜了。检查一下，发现下一个波段点还挺远。那即使保守起见，就持仓到这里，那也至少有一段利润可以争取。无论是这样追，还是晚一点追止损，只要正确摆放价格形低利润目标的胜率就相当高。如果你牺牲一点确定性，争取更高的盈亏比那或许可行。只是你就要更耐心的等待。那幸好，虽然价格在这里反弹起，但最后只走成对上个原趋势极值的突破测试。就继续复反下跌，最终前去测试你的止盈目标。如此强劲的下跌，也是收线入场趋势。眼明手快，利润就滚滚而来。","p":"p495"}]},{"t":"para","text":"另一个例子，我们来看看这个台指期的交易日。你直觉可见图表中有两段急速的显著的运动。不过前者若是以相同的方式市价追近收线，那最后你将会止损。为什么呢？聪明的你应该可以对照前述的条件来得出答案。我们说突破需要有跟进，而且最好能够远离突破点。但在这个例子里，我们看到的却是价格突破磁体时，虽然是饱满的阳线，但下一根旋即陷入停顿。其实我们认为此际，或许价格只是暂时回调了一下，后面还会继续起高。但接着我们看到的又是长上影线的突破失败证据。就双双证明了这里不存在流畅的多头动能。于是你可以说此处的趋势K线不是有效突破，而是潜在高潮运动的可能性就提升了。而当后续确实出现三推的总共两次对原趋势极值突破失败的线索以后。熊旗就引发下跌，使价格又复返回到双边交易的状态之中。不过后面这段下跌就有十足的介入理由了。在顶部形成通道或受区间被一根非常强劲的趋势阴线下破，而下破之后还有跟进。你可以看见区间的下缘被挺有效的穿透，也有过测试而跟进K线又收的远离突破点。那以上就表明了空头的坚决。那如果价格行进的路上还一路畅通，就更值得欣喜了。检查一下，发现下一个波段点还挺远。那即使保守起见，就持仓到这里，那也至少有一段利润可以争取。无论是这样追，还是晚一点追止损，只要正确摆放价格形低利润目标的胜率就相当高。如果你牺牲一点确定性，争取更高的盈亏比那或许可行。只是你就要更耐心的等待。那幸好，虽然价格在这里反弹起，但最后只走成对上个原趋势极值的突破测试。就继续复反下跌，最终前去测试你的止盈目标。如此强劲的下跌，也是收线入场趋势。眼明手快，利润就滚滚而来。","pid":"p495"},{"t":"img","src":"assets/img/l13A_218.webp","ilabel":"13-14","icap":"L13　急速交易方法","fid":"fig218","ctx":[{"t":"另一个例子，我们来看看这个台指期的交易日。你直觉可见图表中有两段急速的显著的运动。不过前者若是以相同的方式市价追近收线，那最后你将会止损。为什么呢？聪明的你应该可以对照前述的条件来得出答案。我们说突破需要有跟进，而且最好能够远离突破点。但在这个例子里，我们看到的却是价格突破磁体时，虽然是饱满的阳线，但下一根旋即陷入停顿。其实我们认为此际，或许价格只是暂时回调了一下，后面还会继续起高。但接着我们看到的又是长上影线的突破失败证据。就双双证明了这里不存在流畅的多头动能。于是你可以说此处的趋势K线不是有效突破，而是潜在高潮运动的可能性就提升了。而当后续确实出现三推的总共两次对原趋势极值突破失败的线索以后。熊旗就引发下跌，使价格又复返回到双边交易的状态之中。不过后面这段下跌就有十足的介入理由了。在顶部形成通道或受区间被一根非常强劲的趋势阴线下破，而下破之后还有跟进。你可以看见区间的下缘被挺有效的穿透，也有过测试而跟进K线又收的远离突破点。那以上就表明了空头的坚决。那如果价格行进的路上还一路畅通，就更值得欣喜了。检查一下，发现下一个波段点还挺远。那即使保守起见，就持仓到这里，那也至少有一段利润可以争取。无论是这样追，还是晚一点追止损，只要正确摆放价格形低利润目标的胜率就相当高。如果你牺牲一点确定性，争取更高的盈亏比那或许可行。只是你就要更耐心的等待。那幸好，虽然价格在这里反弹起，但最后只走成对上个原趋势极值的突破测试。就继续复反下跌，最终前去测试你的止盈目标。如此强劲的下跌，也是收线入场趋势。眼明手快，利润就滚滚而来。","p":"p495"},{"t":"这么看来，你觉得这一种建仓方案你是否驾驭的来呢？我会说，其实原理已经透彻了解。操作的步骤也并不繁琐。无论是概念还是流程，都算是简单。不过，简单并不容易。在急速与窄幅通道中，新手交易者总是害怕以市价订单去入场。一方面是因为此时市场波动迅速，他们难以当机立断。一方面则是因为他们无法承受宽至趋势起点的止损距离。不过你应该已经清楚的认识到会有这种走势的产生，就是因为机构算法深知在急速阶段结束以前。赚取等距利润的胜率优于50%的道理，所以愿意在回调根本还未到来或回调还极度浅的情况下就顺势入场。他们仰仗数学逻辑而无所畏惧。如果你害怕风险，希望等待回调，但你肯定也会担心回调继续演变为深幅回调，乃至于变成反转的开始。于是结局就是踏空大幅的趋势性运动。要苦口婆心向你强调的是，你需要去克服在急速中追进的恐惧，不要被瞬息万变的局势。快速闪动的K线所吓住。吓住就糟了。如果把市场拟人化看待，它就是透过产生强劲的趋势来震慑你，把你晾在原地。不想苦于踏空，但就要训练自己在精准的时机介入战斗。如果你真的胆怯，或者基于某种原因无法接受那个看起来很宽，但实际上最合意的止损。那你就等待允许你使用合宜止损的交易出现才去介入。最怕的是你在时机正好的时候，不敢进去。错过了好大一段利润，才又FOMO，然后追在难以越过磁体上，或者错误的押注反转。这就正中市场，正中机构的下怀。唯有激化你陷入这种极端焦躁，你才会在错误的地方追进或者意气用事的押注不会到来的反转能够发生。然后就让我们这些专业交易者双手合十，满怀感激的夺走你轻易贡献的利润。","p":"p496"}]},{"t":"para","text":"这么看来，你觉得这一种建仓方案你是否驾驭的来呢？我会说，其实原理已经透彻了解。操作的步骤也并不繁琐。无论是概念还是流程，都算是简单。不过，简单并不容易。在急速与窄幅通道中，新手交易者总是害怕以市价订单去入场。一方面是因为此时市场波动迅速，他们难以当机立断。一方面则是因为他们无法承受宽至趋势起点的止损距离。不过你应该已经清楚的认识到会有这种走势的产生，就是因为机构算法深知在急速阶段结束以前。赚取等距利润的胜率优于50%的道理，所以愿意在回调根本还未到来或回调还极度浅的情况下就顺势入场。他们仰仗数学逻辑而无所畏惧。如果你害怕风险，希望等待回调，但你肯定也会担心回调继续演变为深幅回调，乃至于变成反转的开始。于是结局就是踏空大幅的趋势性运动。要苦口婆心向你强调的是，你需要去克服在急速中追进的恐惧，不要被瞬息万变的局势。快速闪动的K线所吓住。吓住就糟了。如果把市场拟人化看待，它就是透过产生强劲的趋势来震慑你，把你晾在原地。不想苦于踏空，但就要训练自己在精准的时机介入战斗。如果你真的胆怯，或者基于某种原因无法接受那个看起来很宽，但实际上最合意的止损。那你就等待允许你使用合宜止损的交易出现才去介入。最怕的是你在时机正好的时候，不敢进去。错过了好大一段利润，才又FOMO，然后追在难以越过磁体上，或者错误的押注反转。这就正中市场，正中机构的下怀。唯有激化你陷入这种极端焦躁，你才会在错误的地方追进或者意气用事的押注不会到来的反转能够发生。然后就让我们这些专业交易者双手合十，满怀感激的夺走你轻易贡献的利润。","pid":"p496"}],"wcount":6542},{"id":"l13B","title":"第B段　急速交易方法","blocks":[{"t":"para","text":"L13B  急速交易方法","pid":"p497"},{"t":"para","text":"第二节我们直接来教第二种建仓方案，我称它为逆一失败，顺一成功。","pid":"p498"},{"t":"img","src":"assets/img/l13B_219.webp","ilabel":"13-15","icap":"L13　急速交易方法","fid":"fig219","ctx":[{"t":"L13B  急速交易方法","p":"p497"},{"t":"第二节我们直接来教第二种建仓方案，我称它为逆一失败，顺一成功。","p":"p498"},{"t":"例如，在一轮强劲的上升急速发起脱离突破点以后，押注空头首次反转趋势的低一尝试将会失败，而多头恢复趋势的高一尝试则将会成功。故称逆一失败，顺一成功。它当然所基于的原理也是清晰的，趋势性向延续。除非是撞在一个明确的磁体上面，失去跟进，使连续的急速走势实际上表征的不是成功的突破而是衰竭的高潮运动。不然逆势方反转的努力通常暂告失败。尤其是在趋势刚发起，顺势动能最强劲的时候。另外，你一定也还记得第一推之后，通常还有第二推。每次突破作为意外，都会套住一批逆势交易者，并把踏空未持仓的潜在顺势方给逼急。那么，在最常见的趋势中，这个逆一上升急速中的低一，就很可能被这些自救的操作给迅速终结。而令顺势的运动可以赶紧重返。我们可以来看看例子。","p":"p499"}]},{"t":"para","text":"例如，在一轮强劲的上升急速发起脱离突破点以后，押注空头首次反转趋势的低一尝试将会失败，而多头恢复趋势的高一尝试则将会成功。故称逆一失败，顺一成功。它当然所基于的原理也是清晰的，趋势性向延续。除非是撞在一个明确的磁体上面，失去跟进，使连续的急速走势实际上表征的不是成功的突破而是衰竭的高潮运动。不然逆势方反转的努力通常暂告失败。尤其是在趋势刚发起，顺势动能最强劲的时候。另外，你一定也还记得第一推之后，通常还有第二推。每次突破作为意外，都会套住一批逆势交易者，并把踏空未持仓的潜在顺势方给逼急。那么，在最常见的趋势中，这个逆一上升急速中的低一，就很可能被这些自救的操作给迅速终结。而令顺势的运动可以赶紧重返。我们可以来看看例子。","pid":"p499"},{"t":"img","src":"assets/img/l13B_220.webp","ilabel":"13-16","icap":"L13　急速交易方法","fid":"fig220","ctx":[{"t":"例如，在一轮强劲的上升急速发起脱离突破点以后，押注空头首次反转趋势的低一尝试将会失败，而多头恢复趋势的高一尝试则将会成功。故称逆一失败，顺一成功。它当然所基于的原理也是清晰的，趋势性向延续。除非是撞在一个明确的磁体上面，失去跟进，使连续的急速走势实际上表征的不是成功的突破而是衰竭的高潮运动。不然逆势方反转的努力通常暂告失败。尤其是在趋势刚发起，顺势动能最强劲的时候。另外，你一定也还记得第一推之后，通常还有第二推。每次突破作为意外，都会套住一批逆势交易者，并把踏空未持仓的潜在顺势方给逼急。那么，在最常见的趋势中，这个逆一上升急速中的低一，就很可能被这些自救的操作给迅速终结。而令顺势的运动可以赶紧重返。我们可以来看看例子。","p":"p499"}]},{"t":"img","src":"assets/img/l13B_221.webp","ilabel":"13-17","icap":"L13　急速交易方法","fid":"fig221","ctx":[{"t":"台指期两周级别图表，我先把后半部分遮起来了。你不难发现，刚刚说的方法其实很容易操作。只需要看到一个重要的磁体被强劲向上突破，就可以等待低一的出现。所以，当2022年的下跌行情告终，并在2024年初迎来最后一次小小转折以后，就迸发出对于前高点的突破。反射性的检验一下突破有效吗？实体确实收在磁体之外，后续也还有阳线跟进。那最低标准是达到了。然后价格还继续远离突破点，这就是我们乐见的。只要接着出现低一，那它很可能失败，给到我们入场讯号。到4月8日，这两周收到一根趋势阴线吞没前一根阳线，并创出低一。于是他成了潜在的讯号K线。而后是一个内包的阳线线，高点显著，开始降低了。对这就为高一的“高点先降低，再重新抬升”，铺好了成立条件。换句话说，我们在这根阳线高点挂上停止订单，一旦上破就触发入场。这样就完成了逆一失败，顺一成功的建仓。止损跟止盈要怎么样摆放呢？与市价最近收线一样，放置在这段急速的起点上，一个重要波段点之外。借此给予突破第一推之后，应有等距第二推的原理。我们同样丈量AB=CD的等距。并以此作为止盈的目标。在趋势恢复以后，也就成功收获了利润。甚至你也有理由认为，后续的深度回调可能是与我们类似入场逻辑的交易者集体止盈所启动的。那么，目前教的两种建仓方案有没有都连续用上的可能呢？当然是有的，只要是急速都实用。刚刚路上的所有阳线你都可以市价追近。并以实体投映等距。你将发现第一仓止盈了，第二仓止盈了，第三仓也马上止盈了。直到回调结束后，改为等待逆一顺一的机会，最终也全部都能止盈。","p":"p500"}]},{"t":"para","text":"台指期两周级别图表，我先把后半部分遮起来了。你不难发现，刚刚说的方法其实很容易操作。只需要看到一个重要的磁体被强劲向上突破，就可以等待低一的出现。所以，当2022年的下跌行情告终，并在2024年初迎来最后一次小小转折以后，就迸发出对于前高点的突破。反射性的检验一下突破有效吗？实体确实收在磁体之外，后续也还有阳线跟进。那最低标准是达到了。然后价格还继续远离突破点，这就是我们乐见的。只要接着出现低一，那它很可能失败，给到我们入场讯号。到4月8日，这两周收到一根趋势阴线吞没前一根阳线，并创出低一。于是他成了潜在的讯号K线。而后是一个内包的阳线线，高点显著，开始降低了。对这就为高一的“高点先降低，再重新抬升”，铺好了成立条件。换句话说，我们在这根阳线高点挂上停止订单，一旦上破就触发入场。这样就完成了逆一失败，顺一成功的建仓。止损跟止盈要怎么样摆放呢？与市价最近收线一样，放置在这段急速的起点上，一个重要波段点之外。借此给予突破第一推之后，应有等距第二推的原理。我们同样丈量AB=CD的等距。并以此作为止盈的目标。在趋势恢复以后，也就成功收获了利润。甚至你也有理由认为，后续的深度回调可能是与我们类似入场逻辑的交易者集体止盈所启动的。那么，目前教的两种建仓方案有没有都连续用上的可能呢？当然是有的，只要是急速都实用。刚刚路上的所有阳线你都可以市价追近。并以实体投映等距。你将发现第一仓止盈了，第二仓止盈了，第三仓也马上止盈了。直到回调结束后，改为等待逆一顺一的机会，最终也全部都能止盈。","pid":"p500"},{"t":"img","src":"assets/img/l13B_222.webp","ilabel":"13-18","icap":"L13　急速交易方法","fid":"fig222","ctx":[{"t":"台指期两周级别图表，我先把后半部分遮起来了。你不难发现，刚刚说的方法其实很容易操作。只需要看到一个重要的磁体被强劲向上突破，就可以等待低一的出现。所以，当2022年的下跌行情告终，并在2024年初迎来最后一次小小转折以后，就迸发出对于前高点的突破。反射性的检验一下突破有效吗？实体确实收在磁体之外，后续也还有阳线跟进。那最低标准是达到了。然后价格还继续远离突破点，这就是我们乐见的。只要接着出现低一，那它很可能失败，给到我们入场讯号。到4月8日，这两周收到一根趋势阴线吞没前一根阳线，并创出低一。于是他成了潜在的讯号K线。而后是一个内包的阳线线，高点显著，开始降低了。对这就为高一的“高点先降低，再重新抬升”，铺好了成立条件。换句话说，我们在这根阳线高点挂上停止订单，一旦上破就触发入场。这样就完成了逆一失败，顺一成功的建仓。止损跟止盈要怎么样摆放呢？与市价最近收线一样，放置在这段急速的起点上，一个重要波段点之外。借此给予突破第一推之后，应有等距第二推的原理。我们同样丈量AB=CD的等距。并以此作为止盈的目标。在趋势恢复以后，也就成功收获了利润。甚至你也有理由认为，后续的深度回调可能是与我们类似入场逻辑的交易者集体止盈所启动的。那么，目前教的两种建仓方案有没有都连续用上的可能呢？当然是有的，只要是急速都实用。刚刚路上的所有阳线你都可以市价追近。并以实体投映等距。你将发现第一仓止盈了，第二仓止盈了，第三仓也马上止盈了。直到回调结束后，改为等待逆一顺一的机会，最终也全部都能止盈。","p":"p500"},{"t":"此间你可能好奇，收线市价最近为何选用基于实体的等距投影，而逆一順一则是AB=CD呢？关键在于前者更像是基于动能交易者的逻辑，不等待回调就入场。既然没有回调，就没有办法为CD找到C作为起点。于是投映实体幅度即可。而逆一顺一，则是基于价值交易者的逻辑等待逆一作为回调后，押注其失败。既然有了回调，那代表第一波止盈的顺势交易者已经出现。而后趋势动能应该多少会有些削弱。采取更保守的AB=CD止盈方案会更合适。但无论哪一种，由于是随时迸发的沼气段落，请你知道如何合宜的在每一根K线都进场。那么，利润就都是相对迅速且可观的。难怪交易者都喜欢趋势性运动。","p":"p501"}]},{"t":"para","text":"此间你可能好奇，收线市价最近为何选用基于实体的等距投影，而逆一順一则是AB=CD呢？关键在于前者更像是基于动能交易者的逻辑，不等待回调就入场。既然没有回调，就没有办法为CD找到C作为起点。于是投映实体幅度即可。而逆一顺一，则是基于价值交易者的逻辑等待逆一作为回调后，押注其失败。既然有了回调，那代表第一波止盈的顺势交易者已经出现。而后趋势动能应该多少会有些削弱。采取更保守的AB=CD止盈方案会更合适。但无论哪一种，由于是随时迸发的沼气段落，请你知道如何合宜的在每一根K线都进场。那么，利润就都是相对迅速且可观的。难怪交易者都喜欢趋势性运动。","pid":"p501"},{"t":"img","src":"assets/img/l13B_223.webp","ilabel":"13-19","icap":"L13　急速交易方法","fid":"fig223","ctx":[{"t":"此间你可能好奇，收线市价最近为何选用基于实体的等距投影，而逆一順一则是AB=CD呢？关键在于前者更像是基于动能交易者的逻辑，不等待回调就入场。既然没有回调，就没有办法为CD找到C作为起点。于是投映实体幅度即可。而逆一顺一，则是基于价值交易者的逻辑等待逆一作为回调后，押注其失败。既然有了回调，那代表第一波止盈的顺势交易者已经出现。而后趋势动能应该多少会有些削弱。采取更保守的AB=CD止盈方案会更合适。但无论哪一种，由于是随时迸发的沼气段落，请你知道如何合宜的在每一根K线都进场。那么，利润就都是相对迅速且可观的。难怪交易者都喜欢趋势性运动。","p":"p501"},{"t":"接下来我就来更明确地指出，除了等距测算选用以外的，刚刚也曾经稍微提到一些其他操作注意事项。并给予更多实例来讲解细节，确保你能够将以上方法运用得以。实际上，获利也没有刚刚表演得那么简单。除非你掌握以下甄选标准。突破要远，测试要浅，且运行路径上要干净无阻。","p":"p502"},{"t":"首先，何谓突破要远？你可以想象一段趋势的迸发一定是越加远离突破点，动能越强劲干脆，那踏空和被套者会更不顾一切地顺势入场。也于是有这个加分项，你做顺势交易会越有数学优势。我们把上一节看过的图表再调出来，思考这轮动能渐衰的下降趋势。起初，动能迸发出脱铁丝网，有着大幅运行的急速。那么，路途中数学优势肯定是越早越好。因为价格刚刚进入失衡，准备朝下方的未知均衡所在去探索。但随着运行越久，顺势交易者止盈的多了，追进的少了，逆势交易者变得激进了。新的突破循环就难以建立。以这里为例，下跌趋势极值是突破的，没错，确实有跟进，但出脱的动能和幅度都不如第一次，对吧？这就使得顺势交易者的优势锐减。直到最后点突破后，要有跟进的最低门槛都过不了，那价格距离进入区间或者转入深幅回调也就不远。这也就不是我们想要介入的行情了。是吧，你还记得标题是急速交易方法。要是急不起来，你千万不要硬作。如果一轮趋势的发动距离突破点无法触多太远。那就预示着想要做突破的人没那么多。你最近后愿意替你推波助澜的友军可能比较少。这是第一个要点，请千万要注意。第二个要点是测试要浅。如果你是逆一失败，顺一成功的交易者观察，测试，观察，首次回调的深度，可以大概为你预示后续行情的顺利程度。毕竟，若是回调动能很强，有连续性，一下子反转的非常多。那对于趋势恢复就不太有利。这是逆势压力积累的展现。","p":"p503"}]},{"t":"para","text":"接下来我就来更明确地指出，除了等距测算选用以外的，刚刚也曾经稍微提到一些其他操作注意事项。并给予更多实例来讲解细节，确保你能够将以上方法运用得以。实际上，获利也没有刚刚表演得那么简单。除非你掌握以下甄选标准。突破要远，测试要浅，且运行路径上要干净无阻。","pid":"p502"},{"t":"para","text":"首先，何谓突破要远？你可以想象一段趋势的迸发一定是越加远离突破点，动能越强劲干脆，那踏空和被套者会更不顾一切地顺势入场。也于是有这个加分项，你做顺势交易会越有数学优势。我们把上一节看过的图表再调出来，思考这轮动能渐衰的下降趋势。起初，动能迸发出脱铁丝网，有着大幅运行的急速。那么，路途中数学优势肯定是越早越好。因为价格刚刚进入失衡，准备朝下方的未知均衡所在去探索。但随着运行越久，顺势交易者止盈的多了，追进的少了，逆势交易者变得激进了。新的突破循环就难以建立。以这里为例，下跌趋势极值是突破的，没错，确实有跟进，但出脱的动能和幅度都不如第一次，对吧？这就使得顺势交易者的优势锐减。直到最后点突破后，要有跟进的最低门槛都过不了，那价格距离进入区间或者转入深幅回调也就不远。这也就不是我们想要介入的行情了。是吧，你还记得标题是急速交易方法。要是急不起来，你千万不要硬作。如果一轮趋势的发动距离突破点无法触多太远。那就预示着想要做突破的人没那么多。你最近后愿意替你推波助澜的友军可能比较少。这是第一个要点，请千万要注意。第二个要点是测试要浅。如果你是逆一失败，顺一成功的交易者观察，测试，观察，首次回调的深度，可以大概为你预示后续行情的顺利程度。毕竟，若是回调动能很强，有连续性，一下子反转的非常多。那对于趋势恢复就不太有利。这是逆势压力积累的展现。","pid":"p503"},{"t":"img","src":"assets/img/l13B_224.webp","ilabel":"13-20","icap":"L13　急速交易方法","fid":"fig224","ctx":[{"t":"接下来我就来更明确地指出，除了等距测算选用以外的，刚刚也曾经稍微提到一些其他操作注意事项。并给予更多实例来讲解细节，确保你能够将以上方法运用得以。实际上，获利也没有刚刚表演得那么简单。除非你掌握以下甄选标准。突破要远，测试要浅，且运行路径上要干净无阻。","p":"p502"},{"t":"首先，何谓突破要远？你可以想象一段趋势的迸发一定是越加远离突破点，动能越强劲干脆，那踏空和被套者会更不顾一切地顺势入场。也于是有这个加分项，你做顺势交易会越有数学优势。我们把上一节看过的图表再调出来，思考这轮动能渐衰的下降趋势。起初，动能迸发出脱铁丝网，有着大幅运行的急速。那么，路途中数学优势肯定是越早越好。因为价格刚刚进入失衡，准备朝下方的未知均衡所在去探索。但随着运行越久，顺势交易者止盈的多了，追进的少了，逆势交易者变得激进了。新的突破循环就难以建立。以这里为例，下跌趋势极值是突破的，没错，确实有跟进，但出脱的动能和幅度都不如第一次，对吧？这就使得顺势交易者的优势锐减。直到最后点突破后，要有跟进的最低门槛都过不了，那价格距离进入区间或者转入深幅回调也就不远。这也就不是我们想要介入的行情了。是吧，你还记得标题是急速交易方法。要是急不起来，你千万不要硬作。如果一轮趋势的发动距离突破点无法触多太远。那就预示着想要做突破的人没那么多。你最近后愿意替你推波助澜的友军可能比较少。这是第一个要点，请千万要注意。第二个要点是测试要浅。如果你是逆一失败，顺一成功的交易者观察，测试，观察，首次回调的深度，可以大概为你预示后续行情的顺利程度。毕竟，若是回调动能很强，有连续性，一下子反转的非常多。那对于趋势恢复就不太有利。这是逆势压力积累的展现。","p":"p503"},{"t":"以这两张图表为例，左边的突破就理想的多。突破的很远，测试不及，于是趋势迅速恢复。高一做进去能给到你顺畅的持仓体验，获利也蛮丰厚。但右边这个就差强人意的一些。突破虽然也挺远的，但入场后旋即有强劲的逆势调整，猛烈的回头威胁突破点，甚至过冲。尽管你高一也能入场。但握持仓位的过程就不太舒服。且你AB=CD的利润空间也会因为回调深化，而被迫不断下移，压缩，你肯定不乐见。所以综合上述两点，顺势动能越强越远，逆势动能越弱越浅，越有利于你顺势获利。前者是入场前就可以识别出来的特征，你可以观察看看再决定要不要做。出现市价追近的交易者，要特别懂得判断。逆一顺一的交易者也可以借此趋吉避凶。而后者的测试深度则更属于逆一顺一交易者的课题。所以调整的深化，你要下收你的利润预期。最糟的情况就是改到测试原趋势极值以后就离场。那第三个要点，你可以说是入场前不利因素的控管，这是最好你持仓方向上的路径是通畅的。没有什么磁体阻挡。比如你量测一个收线市价进场之后，给予实体等距的投映目标。如果你向左看去，发现会有某个波段点卡住你。那也许还不到你的目标，价格就会折返，导致利润回吐。当然，有时候目标最后还是终于抵达。可是没有磁体，就会有潜在的反向订单，所以肯定是越少阻碍对你会越有利。保守己见，如果你事前观察到磁体的存在，但仍然想要入场。但你可以将止盈目标缩紧到磁体所在的地方，避免胜率过度降低。有了上述提示，我们可以再举实例，综合的运用一下所学。","p":"p504"}]},{"t":"para","text":"以这两张图表为例，左边的突破就理想的多。突破的很远，测试不及，于是趋势迅速恢复。高一做进去能给到你顺畅的持仓体验，获利也蛮丰厚。但右边这个就差强人意的一些。突破虽然也挺远的，但入场后旋即有强劲的逆势调整，猛烈的回头威胁突破点，甚至过冲。尽管你高一也能入场。但握持仓位的过程就不太舒服。且你AB=CD的利润空间也会因为回调深化，而被迫不断下移，压缩，你肯定不乐见。所以综合上述两点，顺势动能越强越远，逆势动能越弱越浅，越有利于你顺势获利。前者是入场前就可以识别出来的特征，你可以观察看看再决定要不要做。出现市价追近的交易者，要特别懂得判断。逆一顺一的交易者也可以借此趋吉避凶。而后者的测试深度则更属于逆一顺一交易者的课题。所以调整的深化，你要下收你的利润预期。最糟的情况就是改到测试原趋势极值以后就离场。那第三个要点，你可以说是入场前不利因素的控管，这是最好你持仓方向上的路径是通畅的。没有什么磁体阻挡。比如你量测一个收线市价进场之后，给予实体等距的投映目标。如果你向左看去，发现会有某个波段点卡住你。那也许还不到你的目标，价格就会折返，导致利润回吐。当然，有时候目标最后还是终于抵达。可是没有磁体，就会有潜在的反向订单，所以肯定是越少阻碍对你会越有利。保守己见，如果你事前观察到磁体的存在，但仍然想要入场。但你可以将止盈目标缩紧到磁体所在的地方，避免胜率过度降低。有了上述提示，我们可以再举实例，综合的运用一下所学。","pid":"p504"},{"t":"img","src":"assets/img/l13B_225.webp","ilabel":"13-21","icap":"L13　急速交易方法","fid":"fig225","ctx":[{"t":"以这两张图表为例，左边的突破就理想的多。突破的很远，测试不及，于是趋势迅速恢复。高一做进去能给到你顺畅的持仓体验，获利也蛮丰厚。但右边这个就差强人意的一些。突破虽然也挺远的，但入场后旋即有强劲的逆势调整，猛烈的回头威胁突破点，甚至过冲。尽管你高一也能入场。但握持仓位的过程就不太舒服。且你AB=CD的利润空间也会因为回调深化，而被迫不断下移，压缩，你肯定不乐见。所以综合上述两点，顺势动能越强越远，逆势动能越弱越浅，越有利于你顺势获利。前者是入场前就可以识别出来的特征，你可以观察看看再决定要不要做。出现市价追近的交易者，要特别懂得判断。逆一顺一的交易者也可以借此趋吉避凶。而后者的测试深度则更属于逆一顺一交易者的课题。所以调整的深化，你要下收你的利润预期。最糟的情况就是改到测试原趋势极值以后就离场。那第三个要点，你可以说是入场前不利因素的控管，这是最好你持仓方向上的路径是通畅的。没有什么磁体阻挡。比如你量测一个收线市价进场之后，给予实体等距的投映目标。如果你向左看去，发现会有某个波段点卡住你。那也许还不到你的目标，价格就会折返，导致利润回吐。当然，有时候目标最后还是终于抵达。可是没有磁体，就会有潜在的反向订单，所以肯定是越少阻碍对你会越有利。保守己见，如果你事前观察到磁体的存在，但仍然想要入场。但你可以将止盈目标缩紧到磁体所在的地方，避免胜率过度降低。有了上述提示，我们可以再举实例，综合的运用一下所学。","p":"p504"},{"t":"在画面的左右两边，我放上了两个不同的交易日。而你可以见得，这两天突破开启以前的区间高度是比例相近的，因此很适合用作比较。至少突破后还有跟进基本要求都有达成。是你有市价追进收线的理由。只不过动能确实有一点差距。你应该可以感受到右边这一天似乎更强一点。第二根以掩饰实体饱满的趋势阳性。如果你对突破动能很有要求，可能会考虑放弃左边的这一天，只参与后者。而当关注到第三根的样态差距，就更拉开来了。左边这天已经收了阴线，逆一失败，顺一成功的遭遇机会，马上要来。至于右边，则还在继续突破。同样又是趋势阳线就不断给人更踏实的感受。还记得吗？我们说要素一是突破要远。但显然右边这个更远，或许更让人坐得安心。至此，你可以考虑，如果要学习急速追进的参与方法，是否应该要对突破的幅度有些要求。第四跟第五根K线又给到我们新的资讯。第一天，如果你决定以逆一后顺一的方案入场，则你会在这里买进，并开始期待AB=CD的等距运动。右边这边亦是如此，在阴线顶部的停止订单会被触发，使你开始持仓，且一入场就浮盈甚聚。此时，我们又可以体验一下方才提及的要素二测试要浅。右边这天显然是刚有回调价格，就旋即向上大幅跃起。被套于踏空者显然非常心急。但那一天就有点悲情了。入场后，连续的是阴线还逐渐扩大，下跌磨磨蹭蹭的测试并过冲最初的突破点。那么综合评比一下各方面。要素三说，希望运行路径上要干净无阻挡。这点由于没有结束前一天的情况，无从下手判断，所以可以先搁置一边。但要素一和要素二考虑突破距离与测试的深浅，这两个项目显然都是右边这篇更有优势。但是的收线市价入场与逆一顺一的方案都有更好的发挥。接着我们再关注一下后面的发展。图片例子虽然价格在突破点处又开始爬升。但当看到对原趋势极值的突破，如此失败。或许刚基于这两个理由买进的你，就必须将其视为不利因素考虑赶紧离场。毕竟也建仓理由认为强劲趋势，发起后会维持并迅速远离，这一点已经被多头动能的疲软表现给否证。现在很可能处于宽幅通道而非急速。而右边则确实就是你要的脉络非常急，回调后的通道也非常窄，也于是最终能够顺利以止盈作结。这两个交易日的比较应该能够启发你在运用这两个建仓方案时考虑如何设置可以入场的最低标准。当然，你是激进还是保守？你情愿踏空还是止损？会使个人的标准不一。但我已经提示了这些要素值的考量。于是你应该能够调配出最适合自己个性的版本。","p":"p505"}]},{"t":"para","text":"在画面的左右两边，我放上了两个不同的交易日。而你可以见得，这两天突破开启以前的区间高度是比例相近的，因此很适合用作比较。至少突破后还有跟进基本要求都有达成。是你有市价追进收线的理由。只不过动能确实有一点差距。你应该可以感受到右边这一天似乎更强一点。第二根以掩饰实体饱满的趋势阳性。如果你对突破动能很有要求，可能会考虑放弃左边的这一天，只参与后者。而当关注到第三根的样态差距，就更拉开来了。左边这天已经收了阴线，逆一失败，顺一成功的遭遇机会，马上要来。至于右边，则还在继续突破。同样又是趋势阳线就不断给人更踏实的感受。还记得吗？我们说要素一是突破要远。但显然右边这个更远，或许更让人坐得安心。至此，你可以考虑，如果要学习急速追进的参与方法，是否应该要对突破的幅度有些要求。第四跟第五根K线又给到我们新的资讯。第一天，如果你决定以逆一后顺一的方案入场，则你会在这里买进，并开始期待AB=CD的等距运动。右边这边亦是如此，在阴线顶部的停止订单会被触发，使你开始持仓，且一入场就浮盈甚聚。此时，我们又可以体验一下方才提及的要素二测试要浅。右边这天显然是刚有回调价格，就旋即向上大幅跃起。被套于踏空者显然非常心急。但那一天就有点悲情了。入场后，连续的是阴线还逐渐扩大，下跌磨磨蹭蹭的测试并过冲最初的突破点。那么综合评比一下各方面。要素三说，希望运行路径上要干净无阻挡。这点由于没有结束前一天的情况，无从下手判断，所以可以先搁置一边。但要素一和要素二考虑突破距离与测试的深浅，这两个项目显然都是右边这篇更有优势。但是的收线市价入场与逆一顺一的方案都有更好的发挥。接着我们再关注一下后面的发展。图片例子虽然价格在突破点处又开始爬升。但当看到对原趋势极值的突破，如此失败。或许刚基于这两个理由买进的你，就必须将其视为不利因素考虑赶紧离场。毕竟也建仓理由认为强劲趋势，发起后会维持并迅速远离，这一点已经被多头动能的疲软表现给否证。现在很可能处于宽幅通道而非急速。而右边则确实就是你要的脉络非常急，回调后的通道也非常窄，也于是最终能够顺利以止盈作结。这两个交易日的比较应该能够启发你在运用这两个建仓方案时考虑如何设置可以入场的最低标准。当然，你是激进还是保守？你情愿踏空还是止损？会使个人的标准不一。但我已经提示了这些要素值的考量。于是你应该能够调配出最适合自己个性的版本。","pid":"p505"},{"t":"img","src":"assets/img/l13B_226.webp","ilabel":"13-22","icap":"L13　急速交易方法","fid":"fig226","ctx":[{"t":"在画面的左右两边，我放上了两个不同的交易日。而你可以见得，这两天突破开启以前的区间高度是比例相近的，因此很适合用作比较。至少突破后还有跟进基本要求都有达成。是你有市价追进收线的理由。只不过动能确实有一点差距。你应该可以感受到右边这一天似乎更强一点。第二根以掩饰实体饱满的趋势阳性。如果你对突破动能很有要求，可能会考虑放弃左边的这一天，只参与后者。而当关注到第三根的样态差距，就更拉开来了。左边这天已经收了阴线，逆一失败，顺一成功的遭遇机会，马上要来。至于右边，则还在继续突破。同样又是趋势阳线就不断给人更踏实的感受。还记得吗？我们说要素一是突破要远。但显然右边这个更远，或许更让人坐得安心。至此，你可以考虑，如果要学习急速追进的参与方法，是否应该要对突破的幅度有些要求。第四跟第五根K线又给到我们新的资讯。第一天，如果你决定以逆一后顺一的方案入场，则你会在这里买进，并开始期待AB=CD的等距运动。右边这边亦是如此，在阴线顶部的停止订单会被触发，使你开始持仓，且一入场就浮盈甚聚。此时，我们又可以体验一下方才提及的要素二测试要浅。右边这天显然是刚有回调价格，就旋即向上大幅跃起。被套于踏空者显然非常心急。但那一天就有点悲情了。入场后，连续的是阴线还逐渐扩大，下跌磨磨蹭蹭的测试并过冲最初的突破点。那么综合评比一下各方面。要素三说，希望运行路径上要干净无阻挡。这点由于没有结束前一天的情况，无从下手判断，所以可以先搁置一边。但要素一和要素二考虑突破距离与测试的深浅，这两个项目显然都是右边这篇更有优势。但是的收线市价入场与逆一顺一的方案都有更好的发挥。接着我们再关注一下后面的发展。图片例子虽然价格在突破点处又开始爬升。但当看到对原趋势极值的突破，如此失败。或许刚基于这两个理由买进的你，就必须将其视为不利因素考虑赶紧离场。毕竟也建仓理由认为强劲趋势，发起后会维持并迅速远离，这一点已经被多头动能的疲软表现给否证。现在很可能处于宽幅通道而非急速。而右边则确实就是你要的脉络非常急，回调后的通道也非常窄，也于是最终能够顺利以止盈作结。这两个交易日的比较应该能够启发你在运用这两个建仓方案时考虑如何设置可以入场的最低标准。当然，你是激进还是保守？你情愿踏空还是止损？会使个人的标准不一。但我已经提示了这些要素值的考量。于是你应该能够调配出最适合自己个性的版本。","p":"p505"},{"t":"再来看看另一个交易日吧，我们来做融会贯通的练习。在新的一天开启以前，交易者应该先回顾一下目前行情，如何标记出重要磁体。昨天的尾盘是比较急剧的下跌。光是这段下跌，就会看到最后一个收线入场交易者以及逆一順一成功止盈的历程。但昨天不是主角，我们关注的是今天开盘区间成功突破以后，我们是否可以用同样的两个建仓方案来获利？以及如何做事前的不利因素观测。可以标出的重要波段点有三，最上面的是原趋势极值，而下方两个则是回调后有成功突破而被追认的波段高点。所以，当突破后的跟进确认以后，你每一次测算等距运动都可能会需要忌惮潜在的卖单出现在这些位置。第一个难题来了，这里值得追进吗？保守者可以考虑观望，而激进者则可能牺牲胜率来入场，见仁见智。但当下一根K线仍然是趋势阳线或许就有比较确切的入场理由。不过，由于测量等距利润将与波段点碰撞，我会建议你尊重这些磁体之所在。不要事前太武断的押注他们必能被多头所突破。那么，直到回调的阴线出现，每一根阳线你都有市价追近的理由。只不过就如我说的，止盈的测算应该保守一点。即使你不选择在这个重要波段点离场。最远也应该顶多到原趋势极值。下一根又是阴线，不过十字星的性格很明显。紧接着趋势阳线显得多头坚决的多，给到了逆一后顺一的入场机会。截至目前为止，我们可以回顾要素一和要素二看来突破的确够远，测试的也比较浅。这区间等距扩张，触及昨天铁丝网突破点后的50%回调不及突破点。那么，这都将成为我们后续止盈的胜率加持。也的确价格最后是维持着比较陡峭的窄幅通道，斜率继续上行的。在昨日的趋势极值处，稍作停顿，使得前面部署的仓位都得以获利。尽管最终AB=CD的利润目标也抵达了。但提前止盈会更为保险。避免价格在这个大区间的上缘过冲不了，使你利润回吐。而如果你采用收线入场方案，却坚持拿到等距目标而无视这些磁体。这最终可能没有办法获利，请千万小心。","p":"p506"}]},{"t":"para","text":"再来看看另一个交易日吧，我们来做融会贯通的练习。在新的一天开启以前，交易者应该先回顾一下目前行情，如何标记出重要磁体。昨天的尾盘是比较急剧的下跌。光是这段下跌，就会看到最后一个收线入场交易者以及逆一順一成功止盈的历程。但昨天不是主角，我们关注的是今天开盘区间成功突破以后，我们是否可以用同样的两个建仓方案来获利？以及如何做事前的不利因素观测。可以标出的重要波段点有三，最上面的是原趋势极值，而下方两个则是回调后有成功突破而被追认的波段高点。所以，当突破后的跟进确认以后，你每一次测算等距运动都可能会需要忌惮潜在的卖单出现在这些位置。第一个难题来了，这里值得追进吗？保守者可以考虑观望，而激进者则可能牺牲胜率来入场，见仁见智。但当下一根K线仍然是趋势阳线或许就有比较确切的入场理由。不过，由于测量等距利润将与波段点碰撞，我会建议你尊重这些磁体之所在。不要事前太武断的押注他们必能被多头所突破。那么，直到回调的阴线出现，每一根阳线你都有市价追近的理由。只不过就如我说的，止盈的测算应该保守一点。即使你不选择在这个重要波段点离场。最远也应该顶多到原趋势极值。下一根又是阴线，不过十字星的性格很明显。紧接着趋势阳线显得多头坚决的多，给到了逆一后顺一的入场机会。截至目前为止，我们可以回顾要素一和要素二看来突破的确够远，测试的也比较浅。这区间等距扩张，触及昨天铁丝网突破点后的50%回调不及突破点。那么，这都将成为我们后续止盈的胜率加持。也的确价格最后是维持着比较陡峭的窄幅通道，斜率继续上行的。在昨日的趋势极值处，稍作停顿，使得前面部署的仓位都得以获利。尽管最终AB=CD的利润目标也抵达了。但提前止盈会更为保险。避免价格在这个大区间的上缘过冲不了，使你利润回吐。而如果你采用收线入场方案，却坚持拿到等距目标而无视这些磁体。这最终可能没有办法获利，请千万小心。","pid":"p506"},{"t":"img","src":"assets/img/l13B_227.webp","ilabel":"13-23","icap":"L13　急速交易方法","fid":"fig227","ctx":[{"t":"再来看看另一个交易日吧，我们来做融会贯通的练习。在新的一天开启以前，交易者应该先回顾一下目前行情，如何标记出重要磁体。昨天的尾盘是比较急剧的下跌。光是这段下跌，就会看到最后一个收线入场交易者以及逆一順一成功止盈的历程。但昨天不是主角，我们关注的是今天开盘区间成功突破以后，我们是否可以用同样的两个建仓方案来获利？以及如何做事前的不利因素观测。可以标出的重要波段点有三，最上面的是原趋势极值，而下方两个则是回调后有成功突破而被追认的波段高点。所以，当突破后的跟进确认以后，你每一次测算等距运动都可能会需要忌惮潜在的卖单出现在这些位置。第一个难题来了，这里值得追进吗？保守者可以考虑观望，而激进者则可能牺牲胜率来入场，见仁见智。但当下一根K线仍然是趋势阳线或许就有比较确切的入场理由。不过，由于测量等距利润将与波段点碰撞，我会建议你尊重这些磁体之所在。不要事前太武断的押注他们必能被多头所突破。那么，直到回调的阴线出现，每一根阳线你都有市价追近的理由。只不过就如我说的，止盈的测算应该保守一点。即使你不选择在这个重要波段点离场。最远也应该顶多到原趋势极值。下一根又是阴线，不过十字星的性格很明显。紧接着趋势阳线显得多头坚决的多，给到了逆一后顺一的入场机会。截至目前为止，我们可以回顾要素一和要素二看来突破的确够远，测试的也比较浅。这区间等距扩张，触及昨天铁丝网突破点后的50%回调不及突破点。那么，这都将成为我们后续止盈的胜率加持。也的确价格最后是维持着比较陡峭的窄幅通道，斜率继续上行的。在昨日的趋势极值处，稍作停顿，使得前面部署的仓位都得以获利。尽管最终AB=CD的利润目标也抵达了。但提前止盈会更为保险。避免价格在这个大区间的上缘过冲不了，使你利润回吐。而如果你采用收线入场方案，却坚持拿到等距目标而无视这些磁体。这最终可能没有办法获利，请千万小心。","p":"p506"},{"t":"事到如今，对于这两种建仓方案的运用，你应该能够掌握要义的。事实上，在急速与窄幅通道中，除了这一些，还有一些更刁钻的或更激进的类似做法。位于此列给你。上升急速中，包括在每一根K线的低点下方以限价订单买进。在第一根阴线收线时市价买进。在原趋势极值处已停止订单买进。以及不止预期高一成功，在高二时亦买进。虽然略有不同，但核心理念是一样的，每当价格下跌，我们都预期空头的反转尝试将会失败，而趋势将会恢复再创新高。那也当然，这些都适用前述三项要素的运用，突破越长，测试越浅，路径上越没有磁体拦阻。你的利润就越容易奔跑到位。如果以上要素都完整具备，我们甚至可以说交易者可以以各种理由顺势入场。","p":"p507"},{"t":"阿尔布鲁克斯给的建议是，尽管有难度，但交易者应当强迫自己去执行的最重要任务之一。就是在发掘到出现有效突破时，旋即觅得至少建立一个顺势小仓位的机会。因为你已经知道，只要脉络合一，还有延续性行情的几率就相当高。将为交易者带来强大的数学优势。也于是学习能够介入这种行情的建仓方案，就变得非常之有必要。但是偏偏很多人更喜欢做相反的事，并以壮烈牺牲收场。只有两个理由让你选择在强劲的上升趋势中卖出做空，押注反转。那就是第一，你害怕风险，以为只要止损浅浅的，就能够把交易做得划算。以及第二，自以为这样帅气止损的，还自溺在某种悲剧英雄的情怀里。而如今，你已经对于波段和剥头皮交易走各自对应的胜率有清晰的理解。抓住止损较窄的交易，尤其是逆势入场胜率将会极低。所以即使你观察到回调系由相当强劲的逆势K线所启动，你也不应该贸然将其断定为反转。它很可能只是真空效应导致的高潮回调，而价值交易者都在低处埋伏糊涂的逆势交易者。相反的，尽管急速中顺势入场的方案止损，看起来都比较宽，有点吓人，你还是应该要把握机会及时进场。无需等待更深规模更大的调整。毕竟最强劲的趋势倾向立即恢复，入场点稍纵即逝。反而是让你得以在回调多时候才介入的那种交易，证明了逆势方有进取的意图。胜率就反而遭到削减了。","p":"p508"},{"t":"单元又到尾声，我们快速做个总结，确保你有掌握要点。首先，我们为设计建仓方案这件事情做了一个基本要求的框定。除非合乎价格行为的原理，并且经过测试，经过调教来使期望为证，否则我们难以赚取稳定利润。往后的每一个单元，我都会与各位分享，既如理，也能够经过统计考验的建仓原则。由我和阿布克斯亲手验证过。不过，如果将其形塑成你用起来更顺手，更合乎你个性与需求的版本。则有赖你的勤恳练习琢磨测试。","p":"p509"}]},{"t":"para","text":"事到如今，对于这两种建仓方案的运用，你应该能够掌握要义的。事实上，在急速与窄幅通道中，除了这一些，还有一些更刁钻的或更激进的类似做法。位于此列给你。上升急速中，包括在每一根K线的低点下方以限价订单买进。在第一根阴线收线时市价买进。在原趋势极值处已停止订单买进。以及不止预期高一成功，在高二时亦买进。虽然略有不同，但核心理念是一样的，每当价格下跌，我们都预期空头的反转尝试将会失败，而趋势将会恢复再创新高。那也当然，这些都适用前述三项要素的运用，突破越长，测试越浅，路径上越没有磁体拦阻。你的利润就越容易奔跑到位。如果以上要素都完整具备，我们甚至可以说交易者可以以各种理由顺势入场。","pid":"p507"},{"t":"para","text":"阿尔布鲁克斯给的建议是，尽管有难度，但交易者应当强迫自己去执行的最重要任务之一。就是在发掘到出现有效突破时，旋即觅得至少建立一个顺势小仓位的机会。因为你已经知道，只要脉络合一，还有延续性行情的几率就相当高。将为交易者带来强大的数学优势。也于是学习能够介入这种行情的建仓方案，就变得非常之有必要。但是偏偏很多人更喜欢做相反的事，并以壮烈牺牲收场。只有两个理由让你选择在强劲的上升趋势中卖出做空，押注反转。那就是第一，你害怕风险，以为只要止损浅浅的，就能够把交易做得划算。以及第二，自以为这样帅气止损的，还自溺在某种悲剧英雄的情怀里。而如今，你已经对于波段和剥头皮交易走各自对应的胜率有清晰的理解。抓住止损较窄的交易，尤其是逆势入场胜率将会极低。所以即使你观察到回调系由相当强劲的逆势K线所启动，你也不应该贸然将其断定为反转。它很可能只是真空效应导致的高潮回调，而价值交易者都在低处埋伏糊涂的逆势交易者。相反的，尽管急速中顺势入场的方案止损，看起来都比较宽，有点吓人，你还是应该要把握机会及时进场。无需等待更深规模更大的调整。毕竟最强劲的趋势倾向立即恢复，入场点稍纵即逝。反而是让你得以在回调多时候才介入的那种交易，证明了逆势方有进取的意图。胜率就反而遭到削减了。","pid":"p508"},{"t":"para","text":"单元又到尾声，我们快速做个总结，确保你有掌握要点。首先，我们为设计建仓方案这件事情做了一个基本要求的框定。除非合乎价格行为的原理，并且经过测试，经过调教来使期望为证，否则我们难以赚取稳定利润。往后的每一个单元，我都会与各位分享，既如理，也能够经过统计考验的建仓原则。由我和阿布克斯亲手验证过。不过，如果将其形塑成你用起来更顺手，更合乎你个性与需求的版本。则有赖你的勤恳练习琢磨测试。","pid":"p509"},{"t":"img","src":"assets/img/l13B_228.webp","ilabel":"13-24","icap":"L13　急速交易方法","fid":"fig228","ctx":[{"t":"阿尔布鲁克斯给的建议是，尽管有难度，但交易者应当强迫自己去执行的最重要任务之一。就是在发掘到出现有效突破时，旋即觅得至少建立一个顺势小仓位的机会。因为你已经知道，只要脉络合一，还有延续性行情的几率就相当高。将为交易者带来强大的数学优势。也于是学习能够介入这种行情的建仓方案，就变得非常之有必要。但是偏偏很多人更喜欢做相反的事，并以壮烈牺牲收场。只有两个理由让你选择在强劲的上升趋势中卖出做空，押注反转。那就是第一，你害怕风险，以为只要止损浅浅的，就能够把交易做得划算。以及第二，自以为这样帅气止损的，还自溺在某种悲剧英雄的情怀里。而如今，你已经对于波段和剥头皮交易走各自对应的胜率有清晰的理解。抓住止损较窄的交易，尤其是逆势入场胜率将会极低。所以即使你观察到回调系由相当强劲的逆势K线所启动，你也不应该贸然将其断定为反转。它很可能只是真空效应导致的高潮回调，而价值交易者都在低处埋伏糊涂的逆势交易者。相反的，尽管急速中顺势入场的方案止损，看起来都比较宽，有点吓人，你还是应该要把握机会及时进场。无需等待更深规模更大的调整。毕竟最强劲的趋势倾向立即恢复，入场点稍纵即逝。反而是让你得以在回调多时候才介入的那种交易，证明了逆势方有进取的意图。胜率就反而遭到削减了。","p":"p508"},{"t":"单元又到尾声，我们快速做个总结，确保你有掌握要点。首先，我们为设计建仓方案这件事情做了一个基本要求的框定。除非合乎价格行为的原理，并且经过测试，经过调教来使期望为证，否则我们难以赚取稳定利润。往后的每一个单元，我都会与各位分享，既如理，也能够经过统计考验的建仓原则。由我和阿布克斯亲手验证过。不过，如果将其形塑成你用起来更顺手，更合乎你个性与需求的版本。则有赖你的勤恳练习琢磨测试。","p":"p509"},{"t":"那既然要谈急速建仓方案，我们必须确保对原理和定义有贯通的理解。于是我向你提醒了重点。包括急速结束与回调发生之际。通道的宽窄分界就在于逆势方是否得以轻松盈利。因此不晓得你有没有察觉当前书的课程介绍收线市价追进与逆一顺一。两者使用实际的区别就在于中断急速的回调启动了没有？当回调未出现强劲的突破，会带给你收线市价入场的理由。而回调一出现那么急速就进入窄幅通道阶段。我们就切换方案，调整姿态。那么，无论是哪一种做法，我们总是限定在急速与窄幅通道的脉络中进行操作。一旦你发现通道有变宽的嫌疑，逆势方开始获利。那么，两种方案的优势就将慢慢丧失，我们也不一定能够在乐观期待趋势健康恢复，给到等距利润。那具体而言，这两种方案应该如何操作呢？共同点在于，止损都是置于急速起点之外。但由于分属市场循环中的不同阶段，逆一顺一的做法需要适配更保守的利润测算。所以我们不以急速实体进行直接的等距投映，而是采用AB=CD。C也就是第二推的起点。就设定在回调最深处。同时，你要考量到什么样的要素？如果俱全会对于你的持仓最有利。我们会期待突破强劲而遥远，测试疲弱而短浅。且持仓的路径上没有什么磁体造成拦阻。如果综合考量之下觉得不利因素众多，那你可以观望，不要硬是建仓，或者就测算更保守的利润距离，让低盈亏比可以提供你胜率加持，不要让贪心坏了事。而最后，我们还补充了其他基于相同原理的正常方案变体。包括在每一根K线的低点下方，也先将订单买进。在第一根阴线收线时市价买进，在原趋势极值之处，以停止订单买进。以及不只预期高一成功，高二时亦买进等等。总之是一旦察觉到趋势发起。你有什么理由入场都可能会是恰当的，毕竟机构包括那些踏空与被套的机构。他们也都在不顾一切的入场。请也容忍我不厌其烦的再向你强调原理。你能够透过这些方法获利，背后都有坚实的数学理由。顺势方开始占有极大的数学优势与形成急速运动互为因果。第一推后倾向等距的第二推，趋势倾向延续。我像念咒一样的把这段句子念完，但我相信你是真切的明白各种道理。操作精巧不是利润之母，理解原理才是。你一定要理解我的苦口婆心。无论是过去还是现在，都有很多交易者向我诉苦。急速真是让人又爱又恨，每次出现我都只能够傻住，什么也不敢做，做不了。基于礼貌，我不好意思跟他们说，你赶快回去把原理搞懂就可以了。作家杨绛的名言是：你的问题主要在于读书不多，而想的太多。如今，你看这些新手交易者不一样。你通透的了解了市场循环的每个原理构成，能够娴熟的运用读图工具，也知道了具体的建仓方案。那么，只要稍加练习，逐笔累计的利润就是时间早晚，手到擒来。感谢收看急速交易方法。我们下个单元见。","p":"p510"}]},{"t":"para","text":"那既然要谈急速建仓方案，我们必须确保对原理和定义有贯通的理解。于是我向你提醒了重点。包括急速结束与回调发生之际。通道的宽窄分界就在于逆势方是否得以轻松盈利。因此不晓得你有没有察觉当前书的课程介绍收线市价追进与逆一顺一。两者使用实际的区别就在于中断急速的回调启动了没有？当回调未出现强劲的突破，会带给你收线市价入场的理由。而回调一出现那么急速就进入窄幅通道阶段。我们就切换方案，调整姿态。那么，无论是哪一种做法，我们总是限定在急速与窄幅通道的脉络中进行操作。一旦你发现通道有变宽的嫌疑，逆势方开始获利。那么，两种方案的优势就将慢慢丧失，我们也不一定能够在乐观期待趋势健康恢复，给到等距利润。那具体而言，这两种方案应该如何操作呢？共同点在于，止损都是置于急速起点之外。但由于分属市场循环中的不同阶段，逆一顺一的做法需要适配更保守的利润测算。所以我们不以急速实体进行直接的等距投映，而是采用AB=CD。C也就是第二推的起点。就设定在回调最深处。同时，你要考量到什么样的要素？如果俱全会对于你的持仓最有利。我们会期待突破强劲而遥远，测试疲弱而短浅。且持仓的路径上没有什么磁体造成拦阻。如果综合考量之下觉得不利因素众多，那你可以观望，不要硬是建仓，或者就测算更保守的利润距离，让低盈亏比可以提供你胜率加持，不要让贪心坏了事。而最后，我们还补充了其他基于相同原理的正常方案变体。包括在每一根K线的低点下方，也先将订单买进。在第一根阴线收线时市价买进，在原趋势极值之处，以停止订单买进。以及不只预期高一成功，高二时亦买进等等。总之是一旦察觉到趋势发起。你有什么理由入场都可能会是恰当的，毕竟机构包括那些踏空与被套的机构。他们也都在不顾一切的入场。请也容忍我不厌其烦的再向你强调原理。你能够透过这些方法获利，背后都有坚实的数学理由。顺势方开始占有极大的数学优势与形成急速运动互为因果。第一推后倾向等距的第二推，趋势倾向延续。我像念咒一样的把这段句子念完，但我相信你是真切的明白各种道理。操作精巧不是利润之母，理解原理才是。你一定要理解我的苦口婆心。无论是过去还是现在，都有很多交易者向我诉苦。急速真是让人又爱又恨，每次出现我都只能够傻住，什么也不敢做，做不了。基于礼貌，我不好意思跟他们说，你赶快回去把原理搞懂就可以了。作家杨绛的名言是：你的问题主要在于读书不多，而想的太多。如今，你看这些新手交易者不一样。你通透的了解了市场循环的每个原理构成，能够娴熟的运用读图工具，也知道了具体的建仓方案。那么，只要稍加练习，逐笔累计的利润就是时间早晚，手到擒来。感谢收看急速交易方法。我们下个单元见。","pid":"p510"}],"wcount":6427}],"wcount":12969},{"id":"l14","icon":"L14","title":"L14　旗型回调交易方法","blocks":[],"sections":[{"id":"l14A","title":"第A段　旗型回调交易方法","blocks":[{"t":"para","text":"L14A 旗型回调交易方法","pid":"p511"},{"t":"para","text":"这个单元我们谈旗型回调交易方法。当急速发起转入窄幅通道，在窄幅通道到宽幅通道过渡的过程中，我们有时能够找到形式各异的旗型。来介入顺势交易。","pid":"p512"},{"t":"img","src":"assets/img/l14A_229.webp","ilabel":"14-1","icap":"L14　旗型回调交易方法","fid":"fig229","ctx":[{"t":"L14A 旗型回调交易方法","p":"p511"},{"t":"这个单元我们谈旗型回调交易方法。当急速发起转入窄幅通道，在窄幅通道到宽幅通道过渡的过程中，我们有时能够找到形式各异的旗型。来介入顺势交易。","p":"p512"},{"t":"那么，如何操作呢？这个单元我们同样自原理讨论起复习前与趋势中的旗型回调，应该有哪一些特征可供我们利用？接着我们再谈，最容易驾驭盈利效率最好的交易方法。提示，提高胜率的辅助工具提醒注意事项，并进行综合演练。这单元要介绍内容比较繁复，我们节省时间赶紧开始。","p":"p513"},{"t":"上个单元我们谈急速中追进，以及在窄幅通道生成，起初如何合理押注趋势延续的顺势交易方法？当然，很多时候趋势持续时间不长就结束在急速等距止盈之时，市场在这里就找到均衡。但也不难想象的是，有时候趋势会长远延续。如果我们只在迸发起初找机会入场，并在保守的等距运动目标就离场。那偶尔可能会错过后半段的利润空间。怎么办呢？如果我们能够设计建仓方案，乃在这种趋势还在但并非最强初始段落的鱼身中介入。或许就能够享受鱼身与鱼尾的利润。于是在论长远趋势里，我们至少要谈两大类的旗型回调交易方法。你想必也并不陌生，就是介入双重顶底与楔形顶底。","p":"p514"}]},{"t":"para","text":"那么，如何操作呢？这个单元我们同样自原理讨论起复习前与趋势中的旗型回调，应该有哪一些特征可供我们利用？接着我们再谈，最容易驾驭盈利效率最好的交易方法。提示，提高胜率的辅助工具提醒注意事项，并进行综合演练。这单元要介绍内容比较繁复，我们节省时间赶紧开始。","pid":"p513"},{"t":"para","text":"上个单元我们谈急速中追进，以及在窄幅通道生成，起初如何合理押注趋势延续的顺势交易方法？当然，很多时候趋势持续时间不长就结束在急速等距止盈之时，市场在这里就找到均衡。但也不难想象的是，有时候趋势会长远延续。如果我们只在迸发起初找机会入场，并在保守的等距运动目标就离场。那偶尔可能会错过后半段的利润空间。怎么办呢？如果我们能够设计建仓方案，乃在这种趋势还在但并非最强初始段落的鱼身中介入。或许就能够享受鱼身与鱼尾的利润。于是在论长远趋势里，我们至少要谈两大类的旗型回调交易方法。你想必也并不陌生，就是介入双重顶底与楔形顶底。","pid":"p514"},{"t":"img","src":"assets/img/l14A_230.webp","ilabel":"14-2","icap":"L14　旗型回调交易方法","fid":"fig230","ctx":[{"t":"那么，如何操作呢？这个单元我们同样自原理讨论起复习前与趋势中的旗型回调，应该有哪一些特征可供我们利用？接着我们再谈，最容易驾驭盈利效率最好的交易方法。提示，提高胜率的辅助工具提醒注意事项，并进行综合演练。这单元要介绍内容比较繁复，我们节省时间赶紧开始。","p":"p513"},{"t":"上个单元我们谈急速中追进，以及在窄幅通道生成，起初如何合理押注趋势延续的顺势交易方法？当然，很多时候趋势持续时间不长就结束在急速等距止盈之时，市场在这里就找到均衡。但也不难想象的是，有时候趋势会长远延续。如果我们只在迸发起初找机会入场，并在保守的等距运动目标就离场。那偶尔可能会错过后半段的利润空间。怎么办呢？如果我们能够设计建仓方案，乃在这种趋势还在但并非最强初始段落的鱼身中介入。或许就能够享受鱼身与鱼尾的利润。于是在论长远趋势里，我们至少要谈两大类的旗型回调交易方法。你想必也并不陌生，就是介入双重顶底与楔形顶底。","p":"p514"},{"t":"请千万不要心想这么陈腔滥调，还要你教吗？会觉得扫兴。这些习以为常的心态，一头有繁复的细节需要思考。我们要细细理清。因此，同样要测验你的问题如下。为什么在趋势中介入这些旗型，会是有数学优势的做法。参与旗型是基于动能交易者的逻辑，还是基于价值交易者？旗型是趋势线倾向突破还是通道线倾向被突破？突破后会有什么样的运动惯性？还请同样翻阅笔记，仔细作答。十秒后，我们公布答案。","p":"p515"},{"t":"首先，你能够透过介入这些旗型来盈利，当然还是因为趋势倾向延续而反转尝试倾向失败。在这轮健康的趋势中，市场循环的阶段演化是从动能最强劲的急速开始出现，回调后转入窄幅通道。然后再渐渐积累逆势压力，以至于进入宽幅通道。那么，既然你已经熟知通道有窄入宽的过程里，逆势方会渐渐有利可图。那在他们开始有利可图之前呢？是否回调倾向使得顺势方有利可图呢？答案是肯定的。这就为我们的顺势交易行为带来了盈利的理据。只不过，由于急速转入窄幅通道的过程中，顺势方已经止盈到，回调K线能够产生的程度。虽然也不是很剧烈，但仍然揭示了最有动能的急速段落已经过去。所以我们不宜在不管不顾的采用动能交易者的逻辑去追进。而更适合采取价值交易者的思考模式。这也是为什么典型的双重顶底或者楔形顶底交易。我会建议你在原趋势极值突破后才入场。可是，在价格抵达原趋势极值，可能因突破失败而反转以前，就先用划算的价格预先介入。此际你也能够再次复习跟体会动能交易与价值交易的本质区别。前者是享受迸发的最早动能，在价格向外弹射的起步就跟进。让惯性带给你利润。后者则更像是借助反作用力来向回弹跳。你需要看见价格在触及磁体时反向订单涌入，改变动能的表现。那么，我们以上升趋势为例，还是要来细究一下嵌于趋势中的双重底和楔形底到底是个什么样的本质，可以促成趋势恢复。于是刚刚的题目旗型是趋势线倾向被突破还是通道线倾向被突破？当然是趋势线的。原因是上升通道即熊旗，下降通道即牛旗。不过这听起来又像是说来容易的口号，对吧？有说跟没说一样。经过拆解，你应该要理解到他的深意。","p":"p516"}]},{"t":"para","text":"请千万不要心想这么陈腔滥调，还要你教吗？会觉得扫兴。这些习以为常的心态，一头有繁复的细节需要思考。我们要细细理清。因此，同样要测验你的问题如下。为什么在趋势中介入这些旗型，会是有数学优势的做法。参与旗型是基于动能交易者的逻辑，还是基于价值交易者？旗型是趋势线倾向突破还是通道线倾向被突破？突破后会有什么样的运动惯性？还请同样翻阅笔记，仔细作答。十秒后，我们公布答案。","pid":"p515"},{"t":"para","text":"首先，你能够透过介入这些旗型来盈利，当然还是因为趋势倾向延续而反转尝试倾向失败。在这轮健康的趋势中，市场循环的阶段演化是从动能最强劲的急速开始出现，回调后转入窄幅通道。然后再渐渐积累逆势压力，以至于进入宽幅通道。那么，既然你已经熟知通道有窄入宽的过程里，逆势方会渐渐有利可图。那在他们开始有利可图之前呢？是否回调倾向使得顺势方有利可图呢？答案是肯定的。这就为我们的顺势交易行为带来了盈利的理据。只不过，由于急速转入窄幅通道的过程中，顺势方已经止盈到，回调K线能够产生的程度。虽然也不是很剧烈，但仍然揭示了最有动能的急速段落已经过去。所以我们不宜在不管不顾的采用动能交易者的逻辑去追进。而更适合采取价值交易者的思考模式。这也是为什么典型的双重顶底或者楔形顶底交易。我会建议你在原趋势极值突破后才入场。可是，在价格抵达原趋势极值，可能因突破失败而反转以前，就先用划算的价格预先介入。此际你也能够再次复习跟体会动能交易与价值交易的本质区别。前者是享受迸发的最早动能，在价格向外弹射的起步就跟进。让惯性带给你利润。后者则更像是借助反作用力来向回弹跳。你需要看见价格在触及磁体时反向订单涌入，改变动能的表现。那么，我们以上升趋势为例，还是要来细究一下嵌于趋势中的双重底和楔形底到底是个什么样的本质，可以促成趋势恢复。于是刚刚的题目旗型是趋势线倾向被突破还是通道线倾向被突破？当然是趋势线的。原因是上升通道即熊旗，下降通道即牛旗。不过这听起来又像是说来容易的口号，对吧？有说跟没说一样。经过拆解，你应该要理解到他的深意。","pid":"p516"},{"t":"img","src":"assets/img/l14A_231.webp","ilabel":"14-3","icap":"L14　旗型回调交易方法","fid":"fig231","ctx":[{"t":"请千万不要心想这么陈腔滥调，还要你教吗？会觉得扫兴。这些习以为常的心态，一头有繁复的细节需要思考。我们要细细理清。因此，同样要测验你的问题如下。为什么在趋势中介入这些旗型，会是有数学优势的做法。参与旗型是基于动能交易者的逻辑，还是基于价值交易者？旗型是趋势线倾向突破还是通道线倾向被突破？突破后会有什么样的运动惯性？还请同样翻阅笔记，仔细作答。十秒后，我们公布答案。","p":"p515"},{"t":"首先，你能够透过介入这些旗型来盈利，当然还是因为趋势倾向延续而反转尝试倾向失败。在这轮健康的趋势中，市场循环的阶段演化是从动能最强劲的急速开始出现，回调后转入窄幅通道。然后再渐渐积累逆势压力，以至于进入宽幅通道。那么，既然你已经熟知通道有窄入宽的过程里，逆势方会渐渐有利可图。那在他们开始有利可图之前呢？是否回调倾向使得顺势方有利可图呢？答案是肯定的。这就为我们的顺势交易行为带来了盈利的理据。只不过，由于急速转入窄幅通道的过程中，顺势方已经止盈到，回调K线能够产生的程度。虽然也不是很剧烈，但仍然揭示了最有动能的急速段落已经过去。所以我们不宜在不管不顾的采用动能交易者的逻辑去追进。而更适合采取价值交易者的思考模式。这也是为什么典型的双重顶底或者楔形顶底交易。我会建议你在原趋势极值突破后才入场。可是，在价格抵达原趋势极值，可能因突破失败而反转以前，就先用划算的价格预先介入。此际你也能够再次复习跟体会动能交易与价值交易的本质区别。前者是享受迸发的最早动能，在价格向外弹射的起步就跟进。让惯性带给你利润。后者则更像是借助反作用力来向回弹跳。你需要看见价格在触及磁体时反向订单涌入，改变动能的表现。那么，我们以上升趋势为例，还是要来细究一下嵌于趋势中的双重底和楔形底到底是个什么样的本质，可以促成趋势恢复。于是刚刚的题目旗型是趋势线倾向被突破还是通道线倾向被突破？当然是趋势线的。原因是上升通道即熊旗，下降通道即牛旗。不过这听起来又像是说来容易的口号，对吧？有说跟没说一样。经过拆解，你应该要理解到他的深意。","p":"p516"},{"t":"第一个理解角度是趋势健全的，前提是高低点不断递进。以上升趋势为例，多头出于维护趋势结构健康以及保护自身放置在更高低点之下的止损的原因。会在更高低点附近或其上方积极入场。避免空头觉得自己好像造就了什么逆转趋势的迹象。于是，这将导致嵌于上升趋势中的双重底的形成。而第二个理解角度是市场自身的目的是寻找最效率，最充分交易的均衡价位。所以当我们看到价格试图向下突破数次，却未能有效跨越。但这代表在低处存在均衡价格的几率很低。价格于是需要折返向上来趋近均衡之所在。综合以上你不难发现其实上升趋势中的双重底或楔形底，说穿了就是宽幅通道。在这个局部的小小下降趋势中。逆势方也就是多头，可以透过不断在空头集结处做多来盈利。一旦空头发现如此，发现均衡不在低处，发现反转掉多头趋势的尝试很可能失败。那他们就会收手，乃至于倒戈。也遂此多头的价值交易者，就会对于这小小下降趋势遭到向上反转更足具信心。于是愿意递送买入订单来预期原趋势恢复。也正是如此，你必须知道，一轮上升趋势中出现于趋势初期与中期的下降回调。通常都仅是小型趋势反转。这些小型趋势反转，足以诱使逆势交易者建仓，但不足以改变趋势方向，成为足具数学优势的可靠逆势建仓形态。这也是为什么我会建议你在窄幅通道或者介于宽与窄的状态中，绝对不宜自意参与反转交易。你可能会头破血流。相反的，交易者应该要寻找预示回调已经结束的小型反转形态，并据此加入更大趋势的顺势交易。注意到了吗？我在这里的用词是你要寻找预示回调已经结束的小型反转形态。所以虽然顺大逆小这一词汇更多是多时间级别决策的交易者，所谓提倡的概念。而我很不建议你这么做。但即使不切换时间级别，就只盯着图表上80根左右的K线来下判断。顺大逆小也是有道理的。逆小指的就是对这个小型的局部趋势进行逆势的交易，这正是其行回调交易方法或说持续形态交易方法的本质。换句话讲，我们可以说持续形态，其本质上是嵌于趋势中行进方向与趋势相反的反转形态。上升趋势中，双重底是下降的通道。它却是能够引发上涨恢复趋势的牛旗。起到了反转这个局部下降趋势的作用。在这里，我所要做的尝试是解消你对于持续形态与反转形态所抱有的任何固有概念。基于原理讨论替你建立起重新的认识。","p":"p517"}]},{"t":"para","text":"第一个理解角度是趋势健全的，前提是高低点不断递进。以上升趋势为例，多头出于维护趋势结构健康以及保护自身放置在更高低点之下的止损的原因。会在更高低点附近或其上方积极入场。避免空头觉得自己好像造就了什么逆转趋势的迹象。于是，这将导致嵌于上升趋势中的双重底的形成。而第二个理解角度是市场自身的目的是寻找最效率，最充分交易的均衡价位。所以当我们看到价格试图向下突破数次，却未能有效跨越。但这代表在低处存在均衡价格的几率很低。价格于是需要折返向上来趋近均衡之所在。综合以上你不难发现其实上升趋势中的双重底或楔形底，说穿了就是宽幅通道。在这个局部的小小下降趋势中。逆势方也就是多头，可以透过不断在空头集结处做多来盈利。一旦空头发现如此，发现均衡不在低处，发现反转掉多头趋势的尝试很可能失败。那他们就会收手，乃至于倒戈。也遂此多头的价值交易者，就会对于这小小下降趋势遭到向上反转更足具信心。于是愿意递送买入订单来预期原趋势恢复。也正是如此，你必须知道，一轮上升趋势中出现于趋势初期与中期的下降回调。通常都仅是小型趋势反转。这些小型趋势反转，足以诱使逆势交易者建仓，但不足以改变趋势方向，成为足具数学优势的可靠逆势建仓形态。这也是为什么我会建议你在窄幅通道或者介于宽与窄的状态中，绝对不宜自意参与反转交易。你可能会头破血流。相反的，交易者应该要寻找预示回调已经结束的小型反转形态，并据此加入更大趋势的顺势交易。注意到了吗？我在这里的用词是你要寻找预示回调已经结束的小型反转形态。所以虽然顺大逆小这一词汇更多是多时间级别决策的交易者，所谓提倡的概念。而我很不建议你这么做。但即使不切换时间级别，就只盯着图表上80根左右的K线来下判断。顺大逆小也是有道理的。逆小指的就是对这个小型的局部趋势进行逆势的交易，这正是其行回调交易方法或说持续形态交易方法的本质。换句话讲，我们可以说持续形态，其本质上是嵌于趋势中行进方向与趋势相反的反转形态。上升趋势中，双重底是下降的通道。它却是能够引发上涨恢复趋势的牛旗。起到了反转这个局部下降趋势的作用。在这里，我所要做的尝试是解消你对于持续形态与反转形态所抱有的任何固有概念。基于原理讨论替你建立起重新的认识。","pid":"p517"},{"t":"img","src":"assets/img/l14A_232.webp","ilabel":"14-4","icap":"L14　旗型回调交易方法","fid":"fig232","ctx":[{"t":"第一个理解角度是趋势健全的，前提是高低点不断递进。以上升趋势为例，多头出于维护趋势结构健康以及保护自身放置在更高低点之下的止损的原因。会在更高低点附近或其上方积极入场。避免空头觉得自己好像造就了什么逆转趋势的迹象。于是，这将导致嵌于上升趋势中的双重底的形成。而第二个理解角度是市场自身的目的是寻找最效率，最充分交易的均衡价位。所以当我们看到价格试图向下突破数次，却未能有效跨越。但这代表在低处存在均衡价格的几率很低。价格于是需要折返向上来趋近均衡之所在。综合以上你不难发现其实上升趋势中的双重底或楔形底，说穿了就是宽幅通道。在这个局部的小小下降趋势中。逆势方也就是多头，可以透过不断在空头集结处做多来盈利。一旦空头发现如此，发现均衡不在低处，发现反转掉多头趋势的尝试很可能失败。那他们就会收手，乃至于倒戈。也遂此多头的价值交易者，就会对于这小小下降趋势遭到向上反转更足具信心。于是愿意递送买入订单来预期原趋势恢复。也正是如此，你必须知道，一轮上升趋势中出现于趋势初期与中期的下降回调。通常都仅是小型趋势反转。这些小型趋势反转，足以诱使逆势交易者建仓，但不足以改变趋势方向，成为足具数学优势的可靠逆势建仓形态。这也是为什么我会建议你在窄幅通道或者介于宽与窄的状态中，绝对不宜自意参与反转交易。你可能会头破血流。相反的，交易者应该要寻找预示回调已经结束的小型反转形态，并据此加入更大趋势的顺势交易。注意到了吗？我在这里的用词是你要寻找预示回调已经结束的小型反转形态。所以虽然顺大逆小这一词汇更多是多时间级别决策的交易者，所谓提倡的概念。而我很不建议你这么做。但即使不切换时间级别，就只盯着图表上80根左右的K线来下判断。顺大逆小也是有道理的。逆小指的就是对这个小型的局部趋势进行逆势的交易，这正是其行回调交易方法或说持续形态交易方法的本质。换句话讲，我们可以说持续形态，其本质上是嵌于趋势中行进方向与趋势相反的反转形态。上升趋势中，双重底是下降的通道。它却是能够引发上涨恢复趋势的牛旗。起到了反转这个局部下降趋势的作用。在这里，我所要做的尝试是解消你对于持续形态与反转形态所抱有的任何固有概念。基于原理讨论替你建立起重新的认识。","p":"p517"},{"t":"去除脉络不看的话，其实我们常见的任何形态，本质上好像都是反转形态。它们都有动能渐衰，启动逆行的功能。你可以回想一下，是不是如此呢？只是当考虑到此前的脉络及这个渐衰的动能方向与原本的趋势方向反向还是同向。我们会给予不同的称呼。传统而言，如果反向，那我们会说这个楔形底是持续形态。如果同向，则说这个楔形底是反转形态。不过无论你怎么叫它，称其为持续或反转形态，任何楔形体内部的动能表现其本值都是相同的。就是空头动能渐衰。所以楔形底一推不如一推的构造就预示了均衡在上方，而不在下方。这样导致它即使具有空头的行进方向。其依然倾向启动对于自身的反转。这跟包裹它的更大趋势脉络违和，可以是无关的。那么，当我们论及如何在趋势中交易回调，我们就会寻找嵌于趋势中的逆势旗型，来押注其作为宽幅通道，能够启动反转自身的效果，终于导致趋势恢复。一下子进行了高密度原理讨论，希望你不觉得头晕还跟得上。若你感到有点吃力，那我很建议可以重新翻阅笔记，慢下来再听一次。争取完全理解以后再往下学习。总之，在趋势中，介入作为回调的旗型本质上是趋势倾向延续。在提供你数学优势。而这个旗型作为局部的逆向趋势。比如上升趋势中的双重底楔形底。它们都是小小的反转形态，因自身结构而倾向促成价格朝更大的趋势方向恢复。有以上认识我们就可以正式进入如何操作的范畴，让我们自双重顶底谈起。","p":"p518"}]},{"t":"para","text":"去除脉络不看的话，其实我们常见的任何形态，本质上好像都是反转形态。它们都有动能渐衰，启动逆行的功能。你可以回想一下，是不是如此呢？只是当考虑到此前的脉络及这个渐衰的动能方向与原本的趋势方向反向还是同向。我们会给予不同的称呼。传统而言，如果反向，那我们会说这个楔形底是持续形态。如果同向，则说这个楔形底是反转形态。不过无论你怎么叫它，称其为持续或反转形态，任何楔形体内部的动能表现其本值都是相同的。就是空头动能渐衰。所以楔形底一推不如一推的构造就预示了均衡在上方，而不在下方。这样导致它即使具有空头的行进方向。其依然倾向启动对于自身的反转。这跟包裹它的更大趋势脉络违和，可以是无关的。那么，当我们论及如何在趋势中交易回调，我们就会寻找嵌于趋势中的逆势旗型，来押注其作为宽幅通道，能够启动反转自身的效果，终于导致趋势恢复。一下子进行了高密度原理讨论，希望你不觉得头晕还跟得上。若你感到有点吃力，那我很建议可以重新翻阅笔记，慢下来再听一次。争取完全理解以后再往下学习。总之，在趋势中，介入作为回调的旗型本质上是趋势倾向延续。在提供你数学优势。而这个旗型作为局部的逆向趋势。比如上升趋势中的双重底楔形底。它们都是小小的反转形态，因自身结构而倾向促成价格朝更大的趋势方向恢复。有以上认识我们就可以正式进入如何操作的范畴，让我们自双重顶底谈起。","pid":"p518"},{"t":"img","src":"assets/img/l14A_233.webp","ilabel":"14-5","icap":"L14　旗型回调交易方法","fid":"fig233","ctx":[{"t":"去除脉络不看的话，其实我们常见的任何形态，本质上好像都是反转形态。它们都有动能渐衰，启动逆行的功能。你可以回想一下，是不是如此呢？只是当考虑到此前的脉络及这个渐衰的动能方向与原本的趋势方向反向还是同向。我们会给予不同的称呼。传统而言，如果反向，那我们会说这个楔形底是持续形态。如果同向，则说这个楔形底是反转形态。不过无论你怎么叫它，称其为持续或反转形态，任何楔形体内部的动能表现其本值都是相同的。就是空头动能渐衰。所以楔形底一推不如一推的构造就预示了均衡在上方，而不在下方。这样导致它即使具有空头的行进方向。其依然倾向启动对于自身的反转。这跟包裹它的更大趋势脉络违和，可以是无关的。那么，当我们论及如何在趋势中交易回调，我们就会寻找嵌于趋势中的逆势旗型，来押注其作为宽幅通道，能够启动反转自身的效果，终于导致趋势恢复。一下子进行了高密度原理讨论，希望你不觉得头晕还跟得上。若你感到有点吃力，那我很建议可以重新翻阅笔记，慢下来再听一次。争取完全理解以后再往下学习。总之，在趋势中，介入作为回调的旗型本质上是趋势倾向延续。在提供你数学优势。而这个旗型作为局部的逆向趋势。比如上升趋势中的双重底楔形底。它们都是小小的反转形态，因自身结构而倾向促成价格朝更大的趋势方向恢复。有以上认识我们就可以正式进入如何操作的范畴，让我们自双重顶底谈起。","p":"p518"},{"t":"从定义谈起，何谓双重顶底。你可以说双重顶底，这是价格对同一个磁体测试了两次，但双双反转未能成功突破的形态。以双重顶为例，如果它此前的所处的脉络是一轮上升趋势，那向上越过磁体的失败尝试与其是同向。此时双重顶就是传统意义上的反转形态。","p":"p519"},{"t":"不过我们今天谈的旗型回调，属于的是传统意义上的持续形态。即嵌于下降趋势中的双重顶。与此，我们进行朝着原趋势方向恢复的做空交易。接着，如果我们更细解双重顶底的内部构造，你就会发现，当趋势突然转入回调，就似乎形成逆向K线。这也被视作是一种意外，将可能造成回调后还有第二推的开展。第二推是疲弱还是强劲，当然都有可能。但如果期待价格朝原趋趋势方向恢复的市场参与者更多，则这逆势的第二推通常也走不远。顶多是跟第一推成某种等距关系，如AB=CD。或夸张一点，基于急速实体高度的映射。不过很多时候要是弱势一点，甚至AB=CD的等距都到不了，只能在第一推起止处就反转。形成相对较为持平的双重顶底。逆势方的更弱势表现就是第二推，甚至不及第一推的极值，就提前朝原趋势方向折返。这种时候你能够听到大家常给它起一个形象的名字，叫做杯柄形态。那么，既然这些情况都可以被广义的称作双重顶底，究竟该如何交易呢？大原则是我不推荐介入不及的杯柄形态。持平，跟过冲的类型会更容易驾驭。虽然这可能让你感到些许矛盾。按理来说，那些不及的情况倘若发生，我就代表原趋势方更急迫的想要介入。正式入场应该会更有数学优势吗？话是这么说，没错，但我们难以未卜先知。当价格触及或者过冲第一推极值以前确实可能提前观测到折返的迹象，使你决定入场。不过也可能进场之后，你才发现自己介入的早了，事实上终究是要持平或过冲。于是这就将让你承受浮亏，或即使最后价格真的朝你希望的方向运动，终究也压缩了利润空间。为避免这种情况发生，对还在学习阶段的你来说，静静等待测试到位再观察动能，或是更省心的方法。虽然可能踏空，但踏空毕竟不亏钱，会比过早进场而蒙受亏损更安全一点。","p":"p520"},{"t":"如此一来，请考虑在价格触及第一极值或者抵达AB=CD的等距目标以后。才观察动能的表现，准备以停止订单介入高低一。最危险的做法是直接挂上限价订单，接刀押注反转。这等于是在确实看到利己的动能表现出现以前，就直接赌博，非常不可取。你最希望看到的是对第一推极值，对AB=CD的等距目标突破失败，失去跟进。然后收了与这个局部的趋势方向相反的异色K线。直到收线的前一刻，原趋势方还在积极进场的那一种最好。你赶紧放上停止订单来等待触发。差强人意一点手，有同色K线也可以，你同样放上停止订单来等待高/低一的发生。反正只要发生，那就代表原趋势方有突破的意图。那在脉络的加持下，我们仍然更有可能盈利而非亏损。没错，说到止损与获利，我们也要谈谈离场的部署。在此，我们可以先列出几种方案，让你依照交易风格自由排列组合","p":"p521"}]},{"t":"para","text":"从定义谈起，何谓双重顶底。你可以说双重顶底，这是价格对同一个磁体测试了两次，但双双反转未能成功突破的形态。以双重顶为例，如果它此前的所处的脉络是一轮上升趋势，那向上越过磁体的失败尝试与其是同向。此时双重顶就是传统意义上的反转形态。","pid":"p519"},{"t":"para","text":"不过我们今天谈的旗型回调，属于的是传统意义上的持续形态。即嵌于下降趋势中的双重顶。与此，我们进行朝着原趋势方向恢复的做空交易。接着，如果我们更细解双重顶底的内部构造，你就会发现，当趋势突然转入回调，就似乎形成逆向K线。这也被视作是一种意外，将可能造成回调后还有第二推的开展。第二推是疲弱还是强劲，当然都有可能。但如果期待价格朝原趋趋势方向恢复的市场参与者更多，则这逆势的第二推通常也走不远。顶多是跟第一推成某种等距关系，如AB=CD。或夸张一点，基于急速实体高度的映射。不过很多时候要是弱势一点，甚至AB=CD的等距都到不了，只能在第一推起止处就反转。形成相对较为持平的双重顶底。逆势方的更弱势表现就是第二推，甚至不及第一推的极值，就提前朝原趋势方向折返。这种时候你能够听到大家常给它起一个形象的名字，叫做杯柄形态。那么，既然这些情况都可以被广义的称作双重顶底，究竟该如何交易呢？大原则是我不推荐介入不及的杯柄形态。持平，跟过冲的类型会更容易驾驭。虽然这可能让你感到些许矛盾。按理来说，那些不及的情况倘若发生，我就代表原趋势方更急迫的想要介入。正式入场应该会更有数学优势吗？话是这么说，没错，但我们难以未卜先知。当价格触及或者过冲第一推极值以前确实可能提前观测到折返的迹象，使你决定入场。不过也可能进场之后，你才发现自己介入的早了，事实上终究是要持平或过冲。于是这就将让你承受浮亏，或即使最后价格真的朝你希望的方向运动，终究也压缩了利润空间。为避免这种情况发生，对还在学习阶段的你来说，静静等待测试到位再观察动能，或是更省心的方法。虽然可能踏空，但踏空毕竟不亏钱，会比过早进场而蒙受亏损更安全一点。","pid":"p520"},{"t":"para","text":"如此一来，请考虑在价格触及第一极值或者抵达AB=CD的等距目标以后。才观察动能的表现，准备以停止订单介入高低一。最危险的做法是直接挂上限价订单，接刀押注反转。这等于是在确实看到利己的动能表现出现以前，就直接赌博，非常不可取。你最希望看到的是对第一推极值，对AB=CD的等距目标突破失败，失去跟进。然后收了与这个局部的趋势方向相反的异色K线。直到收线的前一刻，原趋势方还在积极进场的那一种最好。你赶紧放上停止订单来等待触发。差强人意一点手，有同色K线也可以，你同样放上停止订单来等待高/低一的发生。反正只要发生，那就代表原趋势方有突破的意图。那在脉络的加持下，我们仍然更有可能盈利而非亏损。没错，说到止损与获利，我们也要谈谈离场的部署。在此，我们可以先列出几种方案，让你依照交易风格自由排列组合","pid":"p521"},{"t":"img","src":"assets/img/l14A_234.webp","ilabel":"14-6","icap":"L14　旗型回调交易方法","fid":"fig234","ctx":[{"t":"不过我们今天谈的旗型回调，属于的是传统意义上的持续形态。即嵌于下降趋势中的双重顶。与此，我们进行朝着原趋势方向恢复的做空交易。接着，如果我们更细解双重顶底的内部构造，你就会发现，当趋势突然转入回调，就似乎形成逆向K线。这也被视作是一种意外，将可能造成回调后还有第二推的开展。第二推是疲弱还是强劲，当然都有可能。但如果期待价格朝原趋趋势方向恢复的市场参与者更多，则这逆势的第二推通常也走不远。顶多是跟第一推成某种等距关系，如AB=CD。或夸张一点，基于急速实体高度的映射。不过很多时候要是弱势一点，甚至AB=CD的等距都到不了，只能在第一推起止处就反转。形成相对较为持平的双重顶底。逆势方的更弱势表现就是第二推，甚至不及第一推的极值，就提前朝原趋势方向折返。这种时候你能够听到大家常给它起一个形象的名字，叫做杯柄形态。那么，既然这些情况都可以被广义的称作双重顶底，究竟该如何交易呢？大原则是我不推荐介入不及的杯柄形态。持平，跟过冲的类型会更容易驾驭。虽然这可能让你感到些许矛盾。按理来说，那些不及的情况倘若发生，我就代表原趋势方更急迫的想要介入。正式入场应该会更有数学优势吗？话是这么说，没错，但我们难以未卜先知。当价格触及或者过冲第一推极值以前确实可能提前观测到折返的迹象，使你决定入场。不过也可能进场之后，你才发现自己介入的早了，事实上终究是要持平或过冲。于是这就将让你承受浮亏，或即使最后价格真的朝你希望的方向运动，终究也压缩了利润空间。为避免这种情况发生，对还在学习阶段的你来说，静静等待测试到位再观察动能，或是更省心的方法。虽然可能踏空，但踏空毕竟不亏钱，会比过早进场而蒙受亏损更安全一点。","p":"p520"},{"t":"如此一来，请考虑在价格触及第一极值或者抵达AB=CD的等距目标以后。才观察动能的表现，准备以停止订单介入高低一。最危险的做法是直接挂上限价订单，接刀押注反转。这等于是在确实看到利己的动能表现出现以前，就直接赌博，非常不可取。你最希望看到的是对第一推极值，对AB=CD的等距目标突破失败，失去跟进。然后收了与这个局部的趋势方向相反的异色K线。直到收线的前一刻，原趋势方还在积极进场的那一种最好。你赶紧放上停止订单来等待触发。差强人意一点手，有同色K线也可以，你同样放上停止订单来等待高/低一的发生。反正只要发生，那就代表原趋势方有突破的意图。那在脉络的加持下，我们仍然更有可能盈利而非亏损。没错，说到止损与获利，我们也要谈谈离场的部署。在此，我们可以先列出几种方案，让你依照交易风格自由排列组合","p":"p521"},{"t":"a1，止损在上一个重要波段点之外。a2，止损在旗型的回调极值之外。止盈则有b1置于原趋势的极值处。b2置于基于形态高度的等距投映处，以及b3放在基于上一大推的AB=CD的距运动目标处。用文字条例可能有点抽象，我们再找一个示例图，方便对这些选项做理解。","p":"p522"}]},{"t":"para","text":"a1，止损在上一个重要波段点之外。a2，止损在旗型的回调极值之外。止盈则有b1置于原趋势的极值处。b2置于基于形态高度的等距投映处，以及b3放在基于上一大推的AB=CD的距运动目标处。用文字条例可能有点抽象，我们再找一个示例图，方便对这些选项做理解。","pid":"p522"},{"t":"img","src":"assets/img/l14A_235.webp","ilabel":"14-7","icap":"L14　旗型回调交易方法","fid":"fig235","ctx":[{"t":"a1，止损在上一个重要波段点之外。a2，止损在旗型的回调极值之外。止盈则有b1置于原趋势的极值处。b2置于基于形态高度的等距投映处，以及b3放在基于上一大推的AB=CD的距运动目标处。用文字条例可能有点抽象，我们再找一个示例图，方便对这些选项做理解。","p":"p522"},{"t":"其中，我们可以先谈相对保守以及最冒险的方案，然后解释歧义。比如上个单元，我们教了逆一顺一的建仓方案。那种等待回调K线的做法是采价值交易者的逻辑。但由于介入的是急速转入窄幅通道的意识，所以设想等均匀的目标能够抵达。自然止损是放在a1的上一个重要波段点之外。止盈则是AB=CD的b3。那么，介入双重顶底也是相反的理念。与前者差在是在关键位置，看见原趋势方第二次搬回优势的尝试出现后，原趋势才终于恢复。而非首次高一就成功。将止损放的这么宽，同样有趋势中争取等距利润的数学优势，能够容忍价格先出现第三推的回调之后才朝原趋势方向恢复。也于是我们可以思考，替换为止损a2置于旗型的回调机制之外。但依然适配b3的AB=CD止盈选项是否可行？理论上我是拦不住你的。盈亏比这么好，只要你愿意承担低胜率的频繁止损代价，心里耐受得住就行。不过你必须知道，上升趋势中的双重底作为这个局部的区间，也是双边交易地带。也有给剥头皮的空头交易者做空的理由。你可能会在区间上缘，也就是原趋势极值处被尝试突破时，与有意愿在新高处卖出的空头正面冲突。而被选择于新高点止盈的多头扯后腿。一旦你采取如此窄的止损，那在不相应的压缩止盈空间的前提下，没有容忍回调深化的空间。你就实际上是在押注磁体也要屡屡突破。使得连赌三关b1能够越过b2，也要到在刚好抵达你要的b3。如此激进，我不敢说这是一个有数学优势的选择。","p":"p523"}]},{"t":"para","text":"其中，我们可以先谈相对保守以及最冒险的方案，然后解释歧义。比如上个单元，我们教了逆一顺一的建仓方案。那种等待回调K线的做法是采价值交易者的逻辑。但由于介入的是急速转入窄幅通道的意识，所以设想等均匀的目标能够抵达。自然止损是放在a1的上一个重要波段点之外。止盈则是AB=CD的b3。那么，介入双重顶底也是相反的理念。与前者差在是在关键位置，看见原趋势方第二次搬回优势的尝试出现后，原趋势才终于恢复。而非首次高一就成功。将止损放的这么宽，同样有趋势中争取等距利润的数学优势，能够容忍价格先出现第三推的回调之后才朝原趋势方向恢复。也于是我们可以思考，替换为止损a2置于旗型的回调机制之外。但依然适配b3的AB=CD止盈选项是否可行？理论上我是拦不住你的。盈亏比这么好，只要你愿意承担低胜率的频繁止损代价，心里耐受得住就行。不过你必须知道，上升趋势中的双重底作为这个局部的区间，也是双边交易地带。也有给剥头皮的空头交易者做空的理由。你可能会在区间上缘，也就是原趋势极值处被尝试突破时，与有意愿在新高处卖出的空头正面冲突。而被选择于新高点止盈的多头扯后腿。一旦你采取如此窄的止损，那在不相应的压缩止盈空间的前提下，没有容忍回调深化的空间。你就实际上是在押注磁体也要屡屡突破。使得连赌三关b1能够越过b2，也要到在刚好抵达你要的b3。如此激进，我不敢说这是一个有数学优势的选择。","pid":"p523"},{"t":"img","src":"assets/img/l14A_236.webp","ilabel":"14-8","icap":"L14　旗型回调交易方法","fid":"fig236","ctx":[{"t":"其中，我们可以先谈相对保守以及最冒险的方案，然后解释歧义。比如上个单元，我们教了逆一顺一的建仓方案。那种等待回调K线的做法是采价值交易者的逻辑。但由于介入的是急速转入窄幅通道的意识，所以设想等均匀的目标能够抵达。自然止损是放在a1的上一个重要波段点之外。止盈则是AB=CD的b3。那么，介入双重顶底也是相反的理念。与前者差在是在关键位置，看见原趋势方第二次搬回优势的尝试出现后，原趋势才终于恢复。而非首次高一就成功。将止损放的这么宽，同样有趋势中争取等距利润的数学优势，能够容忍价格先出现第三推的回调之后才朝原趋势方向恢复。也于是我们可以思考，替换为止损a2置于旗型的回调机制之外。但依然适配b3的AB=CD止盈选项是否可行？理论上我是拦不住你的。盈亏比这么好，只要你愿意承担低胜率的频繁止损代价，心里耐受得住就行。不过你必须知道，上升趋势中的双重底作为这个局部的区间，也是双边交易地带。也有给剥头皮的空头交易者做空的理由。你可能会在区间上缘，也就是原趋势极值处被尝试突破时，与有意愿在新高处卖出的空头正面冲突。而被选择于新高点止盈的多头扯后腿。一旦你采取如此窄的止损，那在不相应的压缩止盈空间的前提下，没有容忍回调深化的空间。你就实际上是在押注磁体也要屡屡突破。使得连赌三关b1能够越过b2，也要到在刚好抵达你要的b3。如此激进，我不敢说这是一个有数学优势的选择。","p":"p523"},{"t":"这么一来，按安全到大胆的风格序列排出组合，就分别如下。适配最宽的止损与追载的止盈，必定会给你最高的胜率。而最窄的止损与最宽的止盈则理应获胜几率最低，甚至难有数学优势可言。此间你可以依照自己的风格爱好，选择最适合自己的做法。而往后在示范时，我会更多的讨论a1与b3，a2与b1的组合。我想这两种方案相对中庸，应该会最适合新手。","p":"p524"}]},{"t":"para","text":"这么一来，按安全到大胆的风格序列排出组合，就分别如下。适配最宽的止损与追载的止盈，必定会给你最高的胜率。而最窄的止损与最宽的止盈则理应获胜几率最低，甚至难有数学优势可言。此间你可以依照自己的风格爱好，选择最适合自己的做法。而往后在示范时，我会更多的讨论a1与b3，a2与b1的组合。我想这两种方案相对中庸，应该会最适合新手。","pid":"p524"},{"t":"img","src":"assets/img/l14A_237.webp","ilabel":"14-9","icap":"L14　旗型回调交易方法","fid":"fig237","ctx":[{"t":"这么一来，按安全到大胆的风格序列排出组合，就分别如下。适配最宽的止损与追载的止盈，必定会给你最高的胜率。而最窄的止损与最宽的止盈则理应获胜几率最低，甚至难有数学优势可言。此间你可以依照自己的风格爱好，选择最适合自己的做法。而往后在示范时，我会更多的讨论a1与b3，a2与b1的组合。我想这两种方案相对中庸，应该会最适合新手。","p":"p524"},{"t":"来举个例吧，画面中有三个交易日，每根K线十分钟。在中间这个交易日，你可以看见价格向下远离了昨日盘旋在高出的区间，生成细碎下跌的窄幅通道，推进价格到了很远的地方。而后转入了比较耗时的回调，直到交易日的结尾趋势都还未恢复。要直到隔天跳空低开价格，才算是脱离了这漫长的调整。回顾回调的构成，你将会发现里头存在一个显而易见的双重顶，细节如下。两个趋势阳线的回调产生后，旋即被阴线给截断。不过有趣的事情发生了，居然阴线后面并没有跟进。那么这是什么意思呢？多多可能会这样想。这也许代表空头还没有准备好，下破，有价值交易者在更高的地方等待一举入场，所以暂时才会没有延续的动能。这么一来，我就有可以进行逆势剥头皮交易的空间了。应该能够预期价格再向上走一点点，或至少盘旋一阵。于是你可以看到出现一个微型双重底，表征空头确实没有要立马争取下破以后。价格就再度往上进发。上涨到哪里呢？这也是关键，是对第一推极值的测试。于是剥头皮开始紧张，因为他们的剥头皮目标已经抵达。我们可以这样理解，如果对此还继续突破，但这代表空头没有要防守，以确保高点不抬升。换句话说，空头好不容易创出强劲的连续下跌，却在这里容许价格继续向上递进，形成反转。你想想这可能吗？可能，但几率相对很小。所以你看这件事一触及这个价位，立即收出长上影线。仔细看，这甚至是AB=CD的目标位置。多头更有理由选择在这里止盈，空头价值交易者也更有底气重返现场。所以当K线收定，你可以部署停止订单，等待低一的发生，并基于刚才推荐的止损，按止盈方案等待利润目标抵达。也值得你思考的是，虽然都是在回调中给予价值交易者的逻辑介入，但就风格来说是有差异的。方案a1+b3虽然利润目标更远，但由于止损也很宽，盈亏比不好，理论上更近似于高胜率的剥头皮交易。方案a2+b1虽然止盈近的多，但承担的风险也狭窄，盈亏比比较好，则理论上更靠近低胜率的波段交易。回想单元12的内容，你当初认为自己更喜欢哪一种风格，而此时又是哪一个方案，更让你觉得舒服呢？或许有些不同，可以再整合一下。但总之，双重顶底的介入方式大致是如此。你可以再考量看看前面其他提过的选项，搭建出自己最喜欢的方案。所以我们看到的是价格在原趋势及之处收出阳线，暂时突破失败，然后有了细碎的上涨。此时你也就可以在体验到，每逢磁体确实不一定能够有效突破的道理。所以有些人倾向采取比较近的止盈目标，即保守不无道理。不过，到了收盘与隔天，价格确实是恢复下跌，并且抵达AB=CD以及基于双重顶高度的等距运动目标。我想如果你有一点交易的底子，或许双重顶底是你再熟悉不过的形态，也容易在图表上面找到它们。以此为例，这有另一个多头趋势中的双重底案例。","p":"p525"}]},{"t":"para","text":"来举个例吧，画面中有三个交易日，每根K线十分钟。在中间这个交易日，你可以看见价格向下远离了昨日盘旋在高出的区间，生成细碎下跌的窄幅通道，推进价格到了很远的地方。而后转入了比较耗时的回调，直到交易日的结尾趋势都还未恢复。要直到隔天跳空低开价格，才算是脱离了这漫长的调整。回顾回调的构成，你将会发现里头存在一个显而易见的双重顶，细节如下。两个趋势阳线的回调产生后，旋即被阴线给截断。不过有趣的事情发生了，居然阴线后面并没有跟进。那么这是什么意思呢？多多可能会这样想。这也许代表空头还没有准备好，下破，有价值交易者在更高的地方等待一举入场，所以暂时才会没有延续的动能。这么一来，我就有可以进行逆势剥头皮交易的空间了。应该能够预期价格再向上走一点点，或至少盘旋一阵。于是你可以看到出现一个微型双重底，表征空头确实没有要立马争取下破以后。价格就再度往上进发。上涨到哪里呢？这也是关键，是对第一推极值的测试。于是剥头皮开始紧张，因为他们的剥头皮目标已经抵达。我们可以这样理解，如果对此还继续突破，但这代表空头没有要防守，以确保高点不抬升。换句话说，空头好不容易创出强劲的连续下跌，却在这里容许价格继续向上递进，形成反转。你想想这可能吗？可能，但几率相对很小。所以你看这件事一触及这个价位，立即收出长上影线。仔细看，这甚至是AB=CD的目标位置。多头更有理由选择在这里止盈，空头价值交易者也更有底气重返现场。所以当K线收定，你可以部署停止订单，等待低一的发生，并基于刚才推荐的止损，按止盈方案等待利润目标抵达。也值得你思考的是，虽然都是在回调中给予价值交易者的逻辑介入，但就风格来说是有差异的。方案a1+b3虽然利润目标更远，但由于止损也很宽，盈亏比不好，理论上更近似于高胜率的剥头皮交易。方案a2+b1虽然止盈近的多，但承担的风险也狭窄，盈亏比比较好，则理论上更靠近低胜率的波段交易。回想单元12的内容，你当初认为自己更喜欢哪一种风格，而此时又是哪一个方案，更让你觉得舒服呢？或许有些不同，可以再整合一下。但总之，双重顶底的介入方式大致是如此。你可以再考量看看前面其他提过的选项，搭建出自己最喜欢的方案。所以我们看到的是价格在原趋势及之处收出阳线，暂时突破失败，然后有了细碎的上涨。此时你也就可以在体验到，每逢磁体确实不一定能够有效突破的道理。所以有些人倾向采取比较近的止盈目标，即保守不无道理。不过，到了收盘与隔天，价格确实是恢复下跌，并且抵达AB=CD以及基于双重顶高度的等距运动目标。我想如果你有一点交易的底子，或许双重顶底是你再熟悉不过的形态，也容易在图表上面找到它们。以此为例，这有另一个多头趋势中的双重底案例。","pid":"p525"},{"t":"img","src":"assets/img/l14A_238.webp","ilabel":"14-10","icap":"L14　旗型回调交易方法","fid":"fig238","ctx":[{"t":"来举个例吧，画面中有三个交易日，每根K线十分钟。在中间这个交易日，你可以看见价格向下远离了昨日盘旋在高出的区间，生成细碎下跌的窄幅通道，推进价格到了很远的地方。而后转入了比较耗时的回调，直到交易日的结尾趋势都还未恢复。要直到隔天跳空低开价格，才算是脱离了这漫长的调整。回顾回调的构成，你将会发现里头存在一个显而易见的双重顶，细节如下。两个趋势阳线的回调产生后，旋即被阴线给截断。不过有趣的事情发生了，居然阴线后面并没有跟进。那么这是什么意思呢？多多可能会这样想。这也许代表空头还没有准备好，下破，有价值交易者在更高的地方等待一举入场，所以暂时才会没有延续的动能。这么一来，我就有可以进行逆势剥头皮交易的空间了。应该能够预期价格再向上走一点点，或至少盘旋一阵。于是你可以看到出现一个微型双重底，表征空头确实没有要立马争取下破以后。价格就再度往上进发。上涨到哪里呢？这也是关键，是对第一推极值的测试。于是剥头皮开始紧张，因为他们的剥头皮目标已经抵达。我们可以这样理解，如果对此还继续突破，但这代表空头没有要防守，以确保高点不抬升。换句话说，空头好不容易创出强劲的连续下跌，却在这里容许价格继续向上递进，形成反转。你想想这可能吗？可能，但几率相对很小。所以你看这件事一触及这个价位，立即收出长上影线。仔细看，这甚至是AB=CD的目标位置。多头更有理由选择在这里止盈，空头价值交易者也更有底气重返现场。所以当K线收定，你可以部署停止订单，等待低一的发生，并基于刚才推荐的止损，按止盈方案等待利润目标抵达。也值得你思考的是，虽然都是在回调中给予价值交易者的逻辑介入，但就风格来说是有差异的。方案a1+b3虽然利润目标更远，但由于止损也很宽，盈亏比不好，理论上更近似于高胜率的剥头皮交易。方案a2+b1虽然止盈近的多，但承担的风险也狭窄，盈亏比比较好，则理论上更靠近低胜率的波段交易。回想单元12的内容，你当初认为自己更喜欢哪一种风格，而此时又是哪一个方案，更让你觉得舒服呢？或许有些不同，可以再整合一下。但总之，双重顶底的介入方式大致是如此。你可以再考量看看前面其他提过的选项，搭建出自己最喜欢的方案。所以我们看到的是价格在原趋势及之处收出阳线，暂时突破失败，然后有了细碎的上涨。此时你也就可以在体验到，每逢磁体确实不一定能够有效突破的道理。所以有些人倾向采取比较近的止盈目标，即保守不无道理。不过，到了收盘与隔天，价格确实是恢复下跌，并且抵达AB=CD以及基于双重顶高度的等距运动目标。我想如果你有一点交易的底子，或许双重顶底是你再熟悉不过的形态，也容易在图表上面找到它们。以此为例，这有另一个多头趋势中的双重底案例。","p":"p525"},{"t":"虽然稍微畸形一点，但同样在第一推结束之后观察第二腿运动到这里能不能出现让你得以做多的动能表现。如果有对高一介入趋势恢复，最终亦能够止盈。由以上的展示应该能够理解到趋势常以反转形态结束的道理。再回顾前一个例子里展示的下降趋势，里头所出现的双重顶熊旗本身就是局部的小型上升趋势。而该趋势以双重顶反转形态做结，启动反转，最终回到更宏观的原下降趋势中，并行抵利润目标。遂此就整体的宏观的角度来看待这些双重顶底是持续形态，作为暂时的休止，他们都是趋势的踪迹。但就局部的角度来讨论，则双重顶熊旗，是反转局部趋势，反转自身的反转形态。说是反转形态，可能更能体现其本质。是吧，反转之所以发生，就是因为第二推的动能截止于第一推的高点，这多头力量消散了。所以给到我们反转做空的介入机会。你也于是更可以理解人家常说的顺大逆小所指为何。此亦即仰赖磁体，捕捉微观反转的“见位”交易方法。而另外，就是随着趋势的发展，你通常会目睹顺势动能逸散的表现。起初通道很窄，停顿都很短暂，运行都有阴线主宰。但后面通道会变得更宽，多头得寸进尺，调整的时间不断增长，甚至到了你都怀疑趋势到底还会不会延续的程度。以上也是典型的市场循环，从单边交易状态转入双边交易状态的过程。而最终，这个漫长的调整得到下破，成为了下降趋势的中继。","p":"p526"}]},{"t":"para","text":"虽然稍微畸形一点，但同样在第一推结束之后观察第二腿运动到这里能不能出现让你得以做多的动能表现。如果有对高一介入趋势恢复，最终亦能够止盈。由以上的展示应该能够理解到趋势常以反转形态结束的道理。再回顾前一个例子里展示的下降趋势，里头所出现的双重顶熊旗本身就是局部的小型上升趋势。而该趋势以双重顶反转形态做结，启动反转，最终回到更宏观的原下降趋势中，并行抵利润目标。遂此就整体的宏观的角度来看待这些双重顶底是持续形态，作为暂时的休止，他们都是趋势的踪迹。但就局部的角度来讨论，则双重顶熊旗，是反转局部趋势，反转自身的反转形态。说是反转形态，可能更能体现其本质。是吧，反转之所以发生，就是因为第二推的动能截止于第一推的高点，这多头力量消散了。所以给到我们反转做空的介入机会。你也于是更可以理解人家常说的顺大逆小所指为何。此亦即仰赖磁体，捕捉微观反转的“见位”交易方法。而另外，就是随着趋势的发展，你通常会目睹顺势动能逸散的表现。起初通道很窄，停顿都很短暂，运行都有阴线主宰。但后面通道会变得更宽，多头得寸进尺，调整的时间不断增长，甚至到了你都怀疑趋势到底还会不会延续的程度。以上也是典型的市场循环，从单边交易状态转入双边交易状态的过程。而最终，这个漫长的调整得到下破，成为了下降趋势的中继。","pid":"p526"},{"t":"img","src":"assets/img/l14A_239.webp","ilabel":"14-11","icap":"L14　旗型回调交易方法","fid":"fig239","ctx":[{"t":"虽然稍微畸形一点，但同样在第一推结束之后观察第二腿运动到这里能不能出现让你得以做多的动能表现。如果有对高一介入趋势恢复，最终亦能够止盈。由以上的展示应该能够理解到趋势常以反转形态结束的道理。再回顾前一个例子里展示的下降趋势，里头所出现的双重顶熊旗本身就是局部的小型上升趋势。而该趋势以双重顶反转形态做结，启动反转，最终回到更宏观的原下降趋势中，并行抵利润目标。遂此就整体的宏观的角度来看待这些双重顶底是持续形态，作为暂时的休止，他们都是趋势的踪迹。但就局部的角度来讨论，则双重顶熊旗，是反转局部趋势，反转自身的反转形态。说是反转形态，可能更能体现其本质。是吧，反转之所以发生，就是因为第二推的动能截止于第一推的高点，这多头力量消散了。所以给到我们反转做空的介入机会。你也于是更可以理解人家常说的顺大逆小所指为何。此亦即仰赖磁体，捕捉微观反转的“见位”交易方法。而另外，就是随着趋势的发展，你通常会目睹顺势动能逸散的表现。起初通道很窄，停顿都很短暂，运行都有阴线主宰。但后面通道会变得更宽，多头得寸进尺，调整的时间不断增长，甚至到了你都怀疑趋势到底还会不会延续的程度。以上也是典型的市场循环，从单边交易状态转入双边交易状态的过程。而最终，这个漫长的调整得到下破，成为了下降趋势的中继。","p":"p526"},{"t":"那再结合上一个单元的知识来看，我们可以说在理想状态下，曲指刚刚迸发力量最充足的时候。给到的是转瞬即逝的“收线市价入场”交易机会。而后，逆一順一的机会来临时回调已经发生，顺势方已经开始止盈。而到了出现双重顶/底的阶段，则又在更弱了一些。细分来看，随着动能退散，理应第二推不及第一推极值的双重顶底会开始减少。持平者增多，然后变成过冲者，更占大宗。要是顺势动能继续衰退下去，则我们会开始看见暂退的楔形顶底回调，标志原趋势方更加意兴阑珊。那么，如何介入楔形顶底回调呢？我们在下一个节次来继续讲解。","p":"p527"}]},{"t":"para","text":"那再结合上一个单元的知识来看，我们可以说在理想状态下，曲指刚刚迸发力量最充足的时候。给到的是转瞬即逝的“收线市价入场”交易机会。而后，逆一順一的机会来临时回调已经发生，顺势方已经开始止盈。而到了出现双重顶/底的阶段，则又在更弱了一些。细分来看，随着动能退散，理应第二推不及第一推极值的双重顶底会开始减少。持平者增多，然后变成过冲者，更占大宗。要是顺势动能继续衰退下去，则我们会开始看见暂退的楔形顶底回调，标志原趋势方更加意兴阑珊。那么，如何介入楔形顶底回调呢？我们在下一个节次来继续讲解。","pid":"p527"}],"wcount":6703},{"id":"l14B","title":"第B段　旗型回调交易方法","blocks":[{"t":"para","text":"L14B 旗型回调交易方法","pid":"p528"},{"t":"para","text":"本单元的第二种建仓方案是针对楔形顶底的措施，我们同样自定义谈起。何为楔形顶/底呢？以上升趋势中的楔形顶/底牛旗为例，它内含逆势的三推。“三”这个推动数量是一个回调，被定义为楔形顶点的关键理由，应与只有二推的双重顶点区别对待。","pid":"p529"},{"t":"img","src":"assets/img/l14B_240.webp","ilabel":"14-12","icap":"L14　旗型回调交易方法","fid":"fig240","ctx":[{"t":"L14B 旗型回调交易方法","p":"p528"},{"t":"本单元的第二种建仓方案是针对楔形顶底的措施，我们同样自定义谈起。何为楔形顶/底呢？以上升趋势中的楔形顶/底牛旗为例，它内含逆势的三推。“三”这个推动数量是一个回调，被定义为楔形顶点的关键理由，应与只有二推的双重顶点区别对待。","p":"p529"},{"t":"画面上呈现的是一个最符合直观想象的事例，它有着收敛的外观，一推不如一推。这个收敛的样子从何而来？顺势交易者的殷切是通道收敛，为楔形的主因。比如，在上升趋势中，下降趋势线相较于通道线更陡。即代表多头不愿意等待更深的回调，就急迫买进。而空头也不打算等待下跌，更深就着急止盈。他们两方都害怕价格不会抵达，应与趋势线平行的通道线，所以选择提早采取行动。也请容许我不厌其烦的再啰嗦一次。既然我们说市场自身的目的是寻找多空，能够最效率且最充分交易的均衡价位。但当我们看到一个推动屡屡减弱的楔形，就知道价格继续向下突破的意愿已经降低，该方向上存在均衡价位的几率越来越小。也于是当交易者们发现，","p":"p530"},{"t":"在每个空头趋势极值，递送看随突破失败的多单，可以轻松盈利的时候。他们却预期下一次也同样可行。所以就见有空头倒戈，而多头就会更足趋信心的预期原趋势将要恢复。","p":"p531"}]},{"t":"para","text":"画面上呈现的是一个最符合直观想象的事例，它有着收敛的外观，一推不如一推。这个收敛的样子从何而来？顺势交易者的殷切是通道收敛，为楔形的主因。比如，在上升趋势中，下降趋势线相较于通道线更陡。即代表多头不愿意等待更深的回调，就急迫买进。而空头也不打算等待下跌，更深就着急止盈。他们两方都害怕价格不会抵达，应与趋势线平行的通道线，所以选择提早采取行动。也请容许我不厌其烦的再啰嗦一次。既然我们说市场自身的目的是寻找多空，能够最效率且最充分交易的均衡价位。但当我们看到一个推动屡屡减弱的楔形，就知道价格继续向下突破的意愿已经降低，该方向上存在均衡价位的几率越来越小。也于是当交易者们发现，","pid":"p530"},{"t":"para","text":"在每个空头趋势极值，递送看随突破失败的多单，可以轻松盈利的时候。他们却预期下一次也同样可行。所以就见有空头倒戈，而多头就会更足趋信心的预期原趋势将要恢复。","pid":"p531"},{"t":"img","src":"assets/img/l14B_241.webp","ilabel":"14-13","icap":"L14　旗型回调交易方法","fid":"fig241","ctx":[{"t":"画面上呈现的是一个最符合直观想象的事例，它有着收敛的外观，一推不如一推。这个收敛的样子从何而来？顺势交易者的殷切是通道收敛，为楔形的主因。比如，在上升趋势中，下降趋势线相较于通道线更陡。即代表多头不愿意等待更深的回调，就急迫买进。而空头也不打算等待下跌，更深就着急止盈。他们两方都害怕价格不会抵达，应与趋势线平行的通道线，所以选择提早采取行动。也请容许我不厌其烦的再啰嗦一次。既然我们说市场自身的目的是寻找多空，能够最效率且最充分交易的均衡价位。但当我们看到一个推动屡屡减弱的楔形，就知道价格继续向下突破的意愿已经降低，该方向上存在均衡价位的几率越来越小。也于是当交易者们发现，","p":"p530"},{"t":"在每个空头趋势极值，递送看随突破失败的多单，可以轻松盈利的时候。他们却预期下一次也同样可行。所以就见有空头倒戈，而多头就会更足趋信心的预期原趋势将要恢复。","p":"p531"},{"t":"那么，楔形顶底必定要满足收敛的要求吗？实际上并不用。阿尔布鲁克斯在使用楔形一词时，标准是比较宽松的，可以收敛，也可以扩张，可以倾斜，也可以几乎水平。极值通常不断递进，但第二，三推也可以过冲或不及。你可以说外观其实不是重点，重点是相对于原趋势的逆势力量不济，最终将反转自身重新恢复原趋势。遂此值得补充的是，你常听到的头肩顶底及第三推不及第二推极值的版本，也可以算作是楔形顶底的一种。这个无法递进第三推，使其得名“截断楔形”。另一种比较不工整的则是第二推不及第一推的版本。但无论如何，以上都内含三推，于是都是楔形顶底。当前与趋势中倾向起到引发趋势恢复的作用。","p":"p532"}]},{"t":"para","text":"那么，楔形顶底必定要满足收敛的要求吗？实际上并不用。阿尔布鲁克斯在使用楔形一词时，标准是比较宽松的，可以收敛，也可以扩张，可以倾斜，也可以几乎水平。极值通常不断递进，但第二，三推也可以过冲或不及。你可以说外观其实不是重点，重点是相对于原趋势的逆势力量不济，最终将反转自身重新恢复原趋势。遂此值得补充的是，你常听到的头肩顶底及第三推不及第二推极值的版本，也可以算作是楔形顶底的一种。这个无法递进第三推，使其得名“截断楔形”。另一种比较不工整的则是第二推不及第一推的版本。但无论如何，以上都内含三推，于是都是楔形顶底。当前与趋势中倾向起到引发趋势恢复的作用。","pid":"p532"},{"t":"img","src":"assets/img/l14B_242.webp","ilabel":"14-14","icap":"L14　旗型回调交易方法","fid":"fig242","ctx":[{"t":"那么，楔形顶底必定要满足收敛的要求吗？实际上并不用。阿尔布鲁克斯在使用楔形一词时，标准是比较宽松的，可以收敛，也可以扩张，可以倾斜，也可以几乎水平。极值通常不断递进，但第二，三推也可以过冲或不及。你可以说外观其实不是重点，重点是相对于原趋势的逆势力量不济，最终将反转自身重新恢复原趋势。遂此值得补充的是，你常听到的头肩顶底及第三推不及第二推极值的版本，也可以算作是楔形顶底的一种。这个无法递进第三推，使其得名“截断楔形”。另一种比较不工整的则是第二推不及第一推的版本。但无论如何，以上都内含三推，于是都是楔形顶底。当前与趋势中倾向起到引发趋势恢复的作用。","p":"p532"},{"t":"那么，如何入场呢？由于多了一推，二，三推都在前，一推可能不及，持平或过冲，所以变化比较多。难以一概而论。不过，正如讨论双重顶底时说的，只交易持平或过冲的会更容易一些。所以在这里我也推荐你如此做。二短三长，二长三短的那一种，我们就先暂时搁置不顿。这边来就单纯多了，如果你允许自己介入双重顶底。那在第二推触及第一推极值出现逆转的动能表现时，你就可能利用高低一去入场。那么，第三推触及第二推，即使是同理，你也将等待突破失去跟进，给到看似突破成功的入场点。出现后，高低一进场。此间你需要之后花时间费心考虑的是，我是只做双重顶底，只做楔形顶底，还是两者都做？如果两者都做，我可能同时持有两个等待原趋势恢复的仓位，一旦止损就是双重损失。我能不能接受？入场搞定以后，我们接着来谈止盈和止损。同样，我们可以沿用与前面相同的选项，让你自由挑选组合方法。最宽最保守的止损在上一个重要波段点之外。除非完全反转，否则不否认你预期趋势将会恢复的逻辑。而激进一点的方案则在旗型回调极值之外，你用窄损来换取更高的盈亏比，止盈，则可以在原趋势极值处，基于形态高度的等距投映处，以及AB=CD三个目标。我推荐的中庸选项依然是a1与b3，或者a2与b1。","p":"p533"}]},{"t":"para","text":"那么，如何入场呢？由于多了一推，二，三推都在前，一推可能不及，持平或过冲，所以变化比较多。难以一概而论。不过，正如讨论双重顶底时说的，只交易持平或过冲的会更容易一些。所以在这里我也推荐你如此做。二短三长，二长三短的那一种，我们就先暂时搁置不顿。这边来就单纯多了，如果你允许自己介入双重顶底。那在第二推触及第一推极值出现逆转的动能表现时，你就可能利用高低一去入场。那么，第三推触及第二推，即使是同理，你也将等待突破失去跟进，给到看似突破成功的入场点。出现后，高低一进场。此间你需要之后花时间费心考虑的是，我是只做双重顶底，只做楔形顶底，还是两者都做？如果两者都做，我可能同时持有两个等待原趋势恢复的仓位，一旦止损就是双重损失。我能不能接受？入场搞定以后，我们接着来谈止盈和止损。同样，我们可以沿用与前面相同的选项，让你自由挑选组合方法。最宽最保守的止损在上一个重要波段点之外。除非完全反转，否则不否认你预期趋势将会恢复的逻辑。而激进一点的方案则在旗型回调极值之外，你用窄损来换取更高的盈亏比，止盈，则可以在原趋势极值处，基于形态高度的等距投映处，以及AB=CD三个目标。我推荐的中庸选项依然是a1与b3，或者a2与b1。","pid":"p533"},{"t":"img","src":"assets/img/l14B_243.webp","ilabel":"14-15","icap":"L14　旗型回调交易方法","fid":"fig243","ctx":[{"t":"那么，如何入场呢？由于多了一推，二，三推都在前，一推可能不及，持平或过冲，所以变化比较多。难以一概而论。不过，正如讨论双重顶底时说的，只交易持平或过冲的会更容易一些。所以在这里我也推荐你如此做。二短三长，二长三短的那一种，我们就先暂时搁置不顿。这边来就单纯多了，如果你允许自己介入双重顶底。那在第二推触及第一推极值出现逆转的动能表现时，你就可能利用高低一去入场。那么，第三推触及第二推，即使是同理，你也将等待突破失去跟进，给到看似突破成功的入场点。出现后，高低一进场。此间你需要之后花时间费心考虑的是，我是只做双重顶底，只做楔形顶底，还是两者都做？如果两者都做，我可能同时持有两个等待原趋势恢复的仓位，一旦止损就是双重损失。我能不能接受？入场搞定以后，我们接着来谈止盈和止损。同样，我们可以沿用与前面相同的选项，让你自由挑选组合方法。最宽最保守的止损在上一个重要波段点之外。除非完全反转，否则不否认你预期趋势将会恢复的逻辑。而激进一点的方案则在旗型回调极值之外，你用窄损来换取更高的盈亏比，止盈，则可以在原趋势极值处，基于形态高度的等距投映处，以及AB=CD三个目标。我推荐的中庸选项依然是a1与b3，或者a2与b1。","p":"p533"},{"t":"画面上我们看到一个窄幅区间被大力突破，然后还有跟进给他收线市价入场的交易机会。后续出现回调，再有低一，那这里同样有入场的理由押注AB=CD的等距运动目标将会抵达。只可惜趋势并未立即恢复，而是在原趋势极值处收出阳线，又再走高，那便是第二推回调。以双重顶的逻辑看待可以设想在低一推极值处，要是看到弱势的多头表现，那或许就是空头再次进场的机会。于是等待出现，我们就可以放上停止订单来预期低一发生，后面同样测算AB=CD。或者以比较窄的止损，争取更早的止盈。不过，必须注意的是，由于回调最高点已经向上挪动，因此对前面的逆一顺一交易者来说。利润的测算也必须内缩，将此处定义成新的C点。这种动态的调整是持仓过程中需要注意的，还请价值交易者必须知悉。之后空头接连下破突破的原趋势极值还有跟进。但同样又陷入了回调，且回调后同样又有两推。对于双重顶底交易者来说，前面已经借此获利了一次。再有一次机会的话，还可以继续进场吗？这见仁见智。有人可能认为随着趋势发展，后续动能应该会持续减弱，不利于做空可以罢休。有人则可能认为，反正突破强劲，空头仍然占有优势，所以愿意继续尝试。但无论如何，如果你的规则允许你进场，则此处是一个合理的介入点。同样是对第一推极值的突破失败。因此，两种持仓方案或许都适用于此。同样以出现后的低一来进场。后续如何呢？有趣的事情发生了。经过五根阴线的时间，多头重新恢复了暂时的优势，触及了窄损方案的离场。只不过确实阳线收定之后，下一根却没有多头都能跟进，而是出现小小的阴线。以及后续有更细碎的犹豫表现。此际，我们该如何理解？我们或将认为这是三推楔形顶熊旗的产生，做空会是合适的做法。毕竟多头已经连续两次突破失败，明明有强劲阳线，却没有优质的跟随。那或许阳线更是真空的高潮表现，而非有意向上进发。所以在以低一入场，同样可以适用两种盈亏比不同的离场方案。结局是价格命运多传的，走了许久，但总归抵达了止盈目标。","p":"p534"}]},{"t":"para","text":"画面上我们看到一个窄幅区间被大力突破，然后还有跟进给他收线市价入场的交易机会。后续出现回调，再有低一，那这里同样有入场的理由押注AB=CD的等距运动目标将会抵达。只可惜趋势并未立即恢复，而是在原趋势极值处收出阳线，又再走高，那便是第二推回调。以双重顶的逻辑看待可以设想在低一推极值处，要是看到弱势的多头表现，那或许就是空头再次进场的机会。于是等待出现，我们就可以放上停止订单来预期低一发生，后面同样测算AB=CD。或者以比较窄的止损，争取更早的止盈。不过，必须注意的是，由于回调最高点已经向上挪动，因此对前面的逆一顺一交易者来说。利润的测算也必须内缩，将此处定义成新的C点。这种动态的调整是持仓过程中需要注意的，还请价值交易者必须知悉。之后空头接连下破突破的原趋势极值还有跟进。但同样又陷入了回调，且回调后同样又有两推。对于双重顶底交易者来说，前面已经借此获利了一次。再有一次机会的话，还可以继续进场吗？这见仁见智。有人可能认为随着趋势发展，后续动能应该会持续减弱，不利于做空可以罢休。有人则可能认为，反正突破强劲，空头仍然占有优势，所以愿意继续尝试。但无论如何，如果你的规则允许你进场，则此处是一个合理的介入点。同样是对第一推极值的突破失败。因此，两种持仓方案或许都适用于此。同样以出现后的低一来进场。后续如何呢？有趣的事情发生了。经过五根阴线的时间，多头重新恢复了暂时的优势，触及了窄损方案的离场。只不过确实阳线收定之后，下一根却没有多头都能跟进，而是出现小小的阴线。以及后续有更细碎的犹豫表现。此际，我们该如何理解？我们或将认为这是三推楔形顶熊旗的产生，做空会是合适的做法。毕竟多头已经连续两次突破失败，明明有强劲阳线，却没有优质的跟随。那或许阳线更是真空的高潮表现，而非有意向上进发。所以在以低一入场，同样可以适用两种盈亏比不同的离场方案。结局是价格命运多传的，走了许久，但总归抵达了止盈目标。","pid":"p534"},{"t":"img","src":"assets/img/l14B_244.webp","ilabel":"14-16","icap":"L14　旗型回调交易方法","fid":"fig244","ctx":[{"t":"画面上我们看到一个窄幅区间被大力突破，然后还有跟进给他收线市价入场的交易机会。后续出现回调，再有低一，那这里同样有入场的理由押注AB=CD的等距运动目标将会抵达。只可惜趋势并未立即恢复，而是在原趋势极值处收出阳线，又再走高，那便是第二推回调。以双重顶的逻辑看待可以设想在低一推极值处，要是看到弱势的多头表现，那或许就是空头再次进场的机会。于是等待出现，我们就可以放上停止订单来预期低一发生，后面同样测算AB=CD。或者以比较窄的止损，争取更早的止盈。不过，必须注意的是，由于回调最高点已经向上挪动，因此对前面的逆一顺一交易者来说。利润的测算也必须内缩，将此处定义成新的C点。这种动态的调整是持仓过程中需要注意的，还请价值交易者必须知悉。之后空头接连下破突破的原趋势极值还有跟进。但同样又陷入了回调，且回调后同样又有两推。对于双重顶底交易者来说，前面已经借此获利了一次。再有一次机会的话，还可以继续进场吗？这见仁见智。有人可能认为随着趋势发展，后续动能应该会持续减弱，不利于做空可以罢休。有人则可能认为，反正突破强劲，空头仍然占有优势，所以愿意继续尝试。但无论如何，如果你的规则允许你进场，则此处是一个合理的介入点。同样是对第一推极值的突破失败。因此，两种持仓方案或许都适用于此。同样以出现后的低一来进场。后续如何呢？有趣的事情发生了。经过五根阴线的时间，多头重新恢复了暂时的优势，触及了窄损方案的离场。只不过确实阳线收定之后，下一根却没有多头都能跟进，而是出现小小的阴线。以及后续有更细碎的犹豫表现。此际，我们该如何理解？我们或将认为这是三推楔形顶熊旗的产生，做空会是合适的做法。毕竟多头已经连续两次突破失败，明明有强劲阳线，却没有优质的跟随。那或许阳线更是真空的高潮表现，而非有意向上进发。所以在以低一入场，同样可以适用两种盈亏比不同的离场方案。结局是价格命运多传的，走了许久，但总归抵达了止盈目标。","p":"p534"},{"t":"虽然上述的例子已止盈作节，但诚如上一节次提到的，当趋势发展到出现三推的楔形顶/底回调，才恢复趋势。总共给到了逆势方三次发力，三次晋级的机会，那么趋势动能肯定是减弱了不少。这时横向比较一下。首先，市价入场逆一順一双重顶底与楔形顶底。显示越靠后数学优势理应越少。刚刚在第二次双重顶介入时，一旦止损太浅，就会被触发。而尽管是楔形顶入场，持仓也可能耗时，凌厉到令你怀疑人生。那么介入后两者我们是否有什么方法可以稍微提升期望呢？好消息是有的，这时候我们可以引入一个实用的概念对决线。","p":"p535"}]},{"t":"para","text":"虽然上述的例子已止盈作节，但诚如上一节次提到的，当趋势发展到出现三推的楔形顶/底回调，才恢复趋势。总共给到了逆势方三次发力，三次晋级的机会，那么趋势动能肯定是减弱了不少。这时横向比较一下。首先，市价入场逆一順一双重顶底与楔形顶底。显示越靠后数学优势理应越少。刚刚在第二次双重顶介入时，一旦止损太浅，就会被触发。而尽管是楔形顶入场，持仓也可能耗时，凌厉到令你怀疑人生。那么介入后两者我们是否有什么方法可以稍微提升期望呢？好消息是有的，这时候我们可以引入一个实用的概念对决线。","pid":"p535"},{"t":"img","src":"assets/img/l14B_245.webp","ilabel":"14-17","icap":"L14　旗型回调交易方法","fid":"fig245","ctx":[{"t":"虽然上述的例子已止盈作节，但诚如上一节次提到的，当趋势发展到出现三推的楔形顶/底回调，才恢复趋势。总共给到了逆势方三次发力，三次晋级的机会，那么趋势动能肯定是减弱了不少。这时横向比较一下。首先，市价入场逆一順一双重顶底与楔形顶底。显示越靠后数学优势理应越少。刚刚在第二次双重顶介入时，一旦止损太浅，就会被触发。而尽管是楔形顶入场，持仓也可能耗时，凌厉到令你怀疑人生。那么介入后两者我们是否有什么方法可以稍微提升期望呢？好消息是有的，这时候我们可以引入一个实用的概念对决线。","p":"p535"},{"t":"何为对决线？就字面上的想象，对决与线共同构成一个词汇，指的应该是两种磁体的交锋。这么想是没错的，但在阿尔布鲁克斯的知识体系里面，对决线有稍微更严谨一点的定义。即一个通道受限于自身的通道线，且结束于更大时间级别的磁体。所以图表上的三种示例都符合对决线的要求。最左边是三推道先前的重要波段点通道线与重要波段点交锋后，趋势就恢复。后两者也不难理解，是三推到均线以及三推到趋势线。而之所以我说这是能够使期望提升的要素，但这是因为两种磁体都能够提供部署反向订单的理由。共同影响之下，将使价格在此处反转的几率提升。除通道线之外，另一种与其交叠的磁体要是合力，你可以依照自己的爱好，从第九，第十单元内容中挑选。实际上，同时适用于双重顶底与楔形顶底回调操作。在刑塑交易规则的过程中，你可以考虑将此加分项给纳入。事实上，这也是我和阿尔布鲁克斯最钟爱的建仓方案。在2022年英国一个podcast节目访问阿尔布鲁克斯，问及了他最喜欢的建仓形态是什么？答案是第二推为楔形底的双重底。","p":"p536"},{"t":"在这种情况之下，我们先有宏观的上升趋势，提供了多头更高的数学优势。而中观的双重底本身，其间，若还有空头动能逐渐消退的楔形底，做为右半部分的构建。那么，一旦出现优质做多讯号K线，这非常有利于买进。这种小形态外部有大形态包裹的情形，我们可以认定为嵌套形态。而若是楔形底包着楔形底，内外是同一种，它只是更窄意的嵌套楔形。","p":"p537"}]},{"t":"para","text":"何为对决线？就字面上的想象，对决与线共同构成一个词汇，指的应该是两种磁体的交锋。这么想是没错的，但在阿尔布鲁克斯的知识体系里面，对决线有稍微更严谨一点的定义。即一个通道受限于自身的通道线，且结束于更大时间级别的磁体。所以图表上的三种示例都符合对决线的要求。最左边是三推道先前的重要波段点通道线与重要波段点交锋后，趋势就恢复。后两者也不难理解，是三推到均线以及三推到趋势线。而之所以我说这是能够使期望提升的要素，但这是因为两种磁体都能够提供部署反向订单的理由。共同影响之下，将使价格在此处反转的几率提升。除通道线之外，另一种与其交叠的磁体要是合力，你可以依照自己的爱好，从第九，第十单元内容中挑选。实际上，同时适用于双重顶底与楔形顶底回调操作。在刑塑交易规则的过程中，你可以考虑将此加分项给纳入。事实上，这也是我和阿尔布鲁克斯最钟爱的建仓方案。在2022年英国一个podcast节目访问阿尔布鲁克斯，问及了他最喜欢的建仓形态是什么？答案是第二推为楔形底的双重底。","pid":"p536"},{"t":"para","text":"在这种情况之下，我们先有宏观的上升趋势，提供了多头更高的数学优势。而中观的双重底本身，其间，若还有空头动能逐渐消退的楔形底，做为右半部分的构建。那么，一旦出现优质做多讯号K线，这非常有利于买进。这种小形态外部有大形态包裹的情形，我们可以认定为嵌套形态。而若是楔形底包着楔形底，内外是同一种，它只是更窄意的嵌套楔形。","pid":"p537"},{"t":"img","src":"assets/img/l14B_246.webp","ilabel":"14-18","icap":"L14　旗型回调交易方法","fid":"fig246","ctx":[{"t":"何为对决线？就字面上的想象，对决与线共同构成一个词汇，指的应该是两种磁体的交锋。这么想是没错的，但在阿尔布鲁克斯的知识体系里面，对决线有稍微更严谨一点的定义。即一个通道受限于自身的通道线，且结束于更大时间级别的磁体。所以图表上的三种示例都符合对决线的要求。最左边是三推道先前的重要波段点通道线与重要波段点交锋后，趋势就恢复。后两者也不难理解，是三推到均线以及三推到趋势线。而之所以我说这是能够使期望提升的要素，但这是因为两种磁体都能够提供部署反向订单的理由。共同影响之下，将使价格在此处反转的几率提升。除通道线之外，另一种与其交叠的磁体要是合力，你可以依照自己的爱好，从第九，第十单元内容中挑选。实际上，同时适用于双重顶底与楔形顶底回调操作。在刑塑交易规则的过程中，你可以考虑将此加分项给纳入。事实上，这也是我和阿尔布鲁克斯最钟爱的建仓方案。在2022年英国一个podcast节目访问阿尔布鲁克斯，问及了他最喜欢的建仓形态是什么？答案是第二推为楔形底的双重底。","p":"p536"},{"t":"在这种情况之下，我们先有宏观的上升趋势，提供了多头更高的数学优势。而中观的双重底本身，其间，若还有空头动能逐渐消退的楔形底，做为右半部分的构建。那么，一旦出现优质做多讯号K线，这非常有利于买进。这种小形态外部有大形态包裹的情形，我们可以认定为嵌套形态。而若是楔形底包着楔形底，内外是同一种，它只是更窄意的嵌套楔形。","p":"p537"},{"t":"现在画面上呈现楔形比例子，就满足了阿尔布鲁克斯在访谈中提及的要件。你可以看到通道线不止与双重底的左峰相交
