"回调处则或许对突破点的测试终将以不及告终。于是你决定入场在这个低一处。只不过不尽人意的是，后续回调是发展出了第三推。市场似乎铁了心，非要来碰触突破点不可。于是，对于楔形顶底交易者来说，这会是个绝佳的对决线入场点。区间下缘作为突破点与通道线交汇给了卖单更可靠的介入理由。于是你可以看见，后续低一是被强劲的阴线实体触发的。回调后还有第二推通道下跌。这么一来，你应该更能够体验到对决线的作用，当两种甚至多种磁体同时影响市场。以此进行的交易胜率将会相应的提高。","p":"p540"},{"t":"讲到这里，具体如何出入，你应该都有基本的掌握了。不过还有些注意事项要向你提醒。","p":"p541"},{"t":"避免你有现在听都能理解，但实际读图时却无法顺利运用的落差感受。第一点是形态很少是完美的。我们这个单元的主题是旗型回调交易方法。而你早已知道的是，上升通道都是熊旗，下降通道都是牛旗。其间，所谓通道定义上可以涵盖任何由趋势线和通道线所包夹价格运动形状各异。像生物学一样，采用林奈二分法的话，可以分做倾斜或水平的。各自还有平行的收敛的扩张的版本。随着多空竞合状态的些许不同，将发展出不一样的外形。而我们这里所叫的双重顶底与楔形顶底，也可以被包含在这些通道的划分之内。只不过是以推动数量来限定对于形态的判分。以推动数量来辨识之，而非以外形的轮廓来决定，是有它的好处的。好处在于，我们更着眼于多空，互相否定的几次。相对于宏观的原趋势局部逆势方突破的几次失败。用倾斜技术来取代模糊的，主观的形状感受。","p":"p542"}]},{"t":"para","text":"避免你有现在听都能理解，但实际读图时却无法顺利运用的落差感受。第一点是形态很少是完美的。我们这个单元的主题是旗型回调交易方法。而你早已知道的是，上升通道都是熊旗，下降通道都是牛旗。其间，所谓通道定义上可以涵盖任何由趋势线和通道线所包夹价格运动形状各异。像生物学一样，采用林奈二分法的话，可以分做倾斜或水平的。各自还有平行的收敛的扩张的版本。随着多空竞合状态的些许不同，将发展出不一样的外形。而我们这里所叫的双重顶底与楔形顶底，也可以被包含在这些通道的划分之内。只不过是以推动数量来限定对于形态的判分。以推动数量来辨识之，而非以外形的轮廓来决定，是有它的好处的。好处在于，我们更着眼于多空，互相否定的几次。相对于宏观的原趋势局部逆势方突破的几次失败。用倾斜技术来取代模糊的，主观的形状感受。","pid":"p542"},{"t":"img","src":"assets/img/l14B_249.webp","ilabel":"14-21","icap":"L14　旗型回调交易方法","fid":"fig249","ctx":[{"t":"避免你有现在听都能理解，但实际读图时却无法顺利运用的落差感受。第一点是形态很少是完美的。我们这个单元的主题是旗型回调交易方法。而你早已知道的是，上升通道都是熊旗，下降通道都是牛旗。其间，所谓通道定义上可以涵盖任何由趋势线和通道线所包夹价格运动形状各异。像生物学一样，采用林奈二分法的话，可以分做倾斜或水平的。各自还有平行的收敛的扩张的版本。随着多空竞合状态的些许不同，将发展出不一样的外形。而我们这里所叫的双重顶底与楔形顶底，也可以被包含在这些通道的划分之内。只不过是以推动数量来限定对于形态的判分。以推动数量来辨识之，而非以外形的轮廓来决定，是有它的好处的。好处在于，我们更着眼于多空，互相否定的几次。相对于宏观的原趋势局部逆势方突破的几次失败。用倾斜技术来取代模糊的，主观的形状感受。","p":"p542"},{"t":"因此，只要是三推，无论是想象中的那种标准的样子是先扩张再收敛。还是先收敛再扩张，全部都可以被认为是楔形顶底。反正就是局部的，逆势方屡屡突破失败。我们更在乎远离，更在乎多空。实际上在做什么？战绩如何？你要知道形态很少是完美的，但机构算法依然能够辨识出这些不完美的形态，并据此交易。因此，交易者在读图时也应该要具备这样的辨识能力。至于辨识出来之后要不要做，则另当别论。这必须交由规则化来处理，背后仰赖你仔细考虑适合自己的交易风格为何，以及是否进行充分的回测。来给自己依法行政的信心底气。","p":"p543"}]},{"t":"para","text":"因此，只要是三推，无论是想象中的那种标准的样子是先扩张再收敛。还是先收敛再扩张，全部都可以被认为是楔形顶底。反正就是局部的，逆势方屡屡突破失败。我们更在乎远离，更在乎多空。实际上在做什么？战绩如何？你要知道形态很少是完美的，但机构算法依然能够辨识出这些不完美的形态，并据此交易。因此，交易者在读图时也应该要具备这样的辨识能力。至于辨识出来之后要不要做，则另当别论。这必须交由规则化来处理，背后仰赖你仔细考虑适合自己的交易风格为何，以及是否进行充分的回测。来给自己依法行政的信心底气。","pid":"p543"},{"t":"img","src":"assets/img/l14B_250.webp","ilabel":"14-22","icap":"L14　旗型回调交易方法","fid":"fig250","ctx":[{"t":"因此，只要是三推，无论是想象中的那种标准的样子是先扩张再收敛。还是先收敛再扩张，全部都可以被认为是楔形顶底。反正就是局部的，逆势方屡屡突破失败。我们更在乎远离，更在乎多空。实际上在做什么？战绩如何？你要知道形态很少是完美的，但机构算法依然能够辨识出这些不完美的形态，并据此交易。因此，交易者在读图时也应该要具备这样的辨识能力。至于辨识出来之后要不要做，则另当别论。这必须交由规则化来处理，背后仰赖你仔细考虑适合自己的交易风格为何，以及是否进行充分的回测。来给自己依法行政的信心底气。","p":"p543"},{"t":"第二点，无需有多言，你知道形态是可能失败的。任何旗型通常突破自身的趋势线，造就程度不一的反转。但有25%的几率是加速突破自身通道线，造就基于失败形态高度等距运动。尤其如果你是将止损放在讯号K线之外的波段交易者。你更要事前坦然接受，止损可能被清扫掉的可能性。毕竟如此窄的止损，通常就是押注反转，将立即发生你并不容许行情。先朝预想之外的方向运行些许。反过来说，要是你更想要赢止损宽一些，就会提升你容忍行情波折的程度。只不过同样不是无限放宽，更不是只要宽就没事的，无需价格行为理由。如前所述，我还稍微再强调任何交易决策都需要你遵守价格行为的原理，并且遵循数学。前述题及的方案都有道理，所以推荐你参考。充分回测以前不要太恣意的选定奇怪的离场方案。","p":"p544"}]},{"t":"para","text":"第二点，无需有多言，你知道形态是可能失败的。任何旗型通常突破自身的趋势线，造就程度不一的反转。但有25%的几率是加速突破自身通道线，造就基于失败形态高度等距运动。尤其如果你是将止损放在讯号K线之外的波段交易者。你更要事前坦然接受，止损可能被清扫掉的可能性。毕竟如此窄的止损，通常就是押注反转，将立即发生你并不容许行情。先朝预想之外的方向运行些许。反过来说，要是你更想要赢止损宽一些，就会提升你容忍行情波折的程度。只不过同样不是无限放宽，更不是只要宽就没事的，无需价格行为理由。如前所述，我还稍微再强调任何交易决策都需要你遵守价格行为的原理，并且遵循数学。前述题及的方案都有道理，所以推荐你参考。充分回测以前不要太恣意的选定奇怪的离场方案。","pid":"p544"},{"t":"img","src":"assets/img/l14B_251.webp","ilabel":"14-23","icap":"L14　旗型回调交易方法","fid":"fig251","ctx":[{"t":"第二点，无需有多言，你知道形态是可能失败的。任何旗型通常突破自身的趋势线，造就程度不一的反转。但有25%的几率是加速突破自身通道线，造就基于失败形态高度等距运动。尤其如果你是将止损放在讯号K线之外的波段交易者。你更要事前坦然接受，止损可能被清扫掉的可能性。毕竟如此窄的止损，通常就是押注反转，将立即发生你并不容许行情。先朝预想之外的方向运行些许。反过来说，要是你更想要赢止损宽一些，就会提升你容忍行情波折的程度。只不过同样不是无限放宽，更不是只要宽就没事的，无需价格行为理由。如前所述，我还稍微再强调任何交易决策都需要你遵守价格行为的原理，并且遵循数学。前述题及的方案都有道理，所以推荐你参考。充分回测以前不要太恣意的选定奇怪的离场方案。","p":"p544"},{"t":"第三点，长的多是关于数推与数K线之间的转换。就如第11单元提过的数推与数K线本质相同，只是在大小时间级别图表上可能展现为不同的状态。但只要稍微想一下，你就能够发现高二回调在更小时间级别图表上，很常就是双重底。高三，则对应楔形底。","p":"p545"}]},{"t":"para","text":"第三点，长的多是关于数推与数K线之间的转换。就如第11单元提过的数推与数K线本质相同，只是在大小时间级别图表上可能展现为不同的状态。但只要稍微想一下，你就能够发现高二回调在更小时间级别图表上，很常就是双重底。高三，则对应楔形底。","pid":"p545"},{"t":"img","src":"assets/img/l14B_252.webp","ilabel":"14-24","icap":"L14　旗型回调交易方法","fid":"fig252","ctx":[{"t":"第三点，长的多是关于数推与数K线之间的转换。就如第11单元提过的数推与数K线本质相同，只是在大小时间级别图表上可能展现为不同的状态。但只要稍微想一下，你就能够发现高二回调在更小时间级别图表上，很常就是双重底。高三，则对应楔形底。","p":"p545"},{"t":"以此为例，举目可见的是一个上升的趋势。而自回调启动起算，多头曾经扳回劣势两次，也就是产生了高一与高二。那么，在更少时间的级别图表上会是什么模样呢？清晰可见是双重底没错。但K线数量会变多，整个双重底的第一推内部，以高一作节。但第二推却内含高二，高三，高四，直到高五才触线反弹恢复趋势。学习者自学时常有的混淆是阿尔布鲁克斯说，“高二等效于双重底”。但这代表我在上升趋势中等到回调出现高二就可以入场吗？这样入场就算是在早已双重底吗？我想并不尽然。或许趋势会从此恢复，造就第二推极浅的杯柄形态双重底。但你要说这是第二推，对第一推极值的测试，怎么看都会因为距离太远而稍显牵强。所以仔细听好，我建议你有以下的意识。如果在你所交易的时间级别图表上，比如是五分钟级别好了，看这个趋势运行以及对它的回调，看起来K线都不少。那你就要设想哦，这应该是一个庞大的超乎于我时间级别的结构。“我是老鼠，但现在有一头大象经过。”这代表在maybe三四倍的时间级别图表上面看起来会是简洁的阳线运行，加上简洁的阴线回调。没什么特别的。说它是15分钟级别，那或许双重底会在高一为左峰，高二为右峰以后就恢复。但对于我的五分钟级别图表来说，两个底总共出现到高五高六都不奇怪。毕竟我选到的是更微观的时间视角，所看到价格运动就应当会更细碎。知道这一点有何作用呢？当然了，这可以避免你螳臂当车，误以为单一次，无视脉络的数K线就能够终结一次庞大的推动。于是在过大双重底中找到高二，就想进场，最后招来亏损。所以这提醒你在做交易规则的设计时，必须考量我所介入的双重顶底或楔形顶底。所包含的K线总数应该控制在什么范围？这样的问题。这题的答案当然因人而异，但对于日内交易的我来说，要是有我设计旗型回调的交易规则，我可能会更偏好一段推动在两到五根K线结束的那种规模。遂此，一个双重底回调包含了向下两推，向上一推，总共三推，那6到15根K线，会对于我来说是最舒适的。同理，如果又发展成楔形顶底，那10到25根K线最好。再多这对我而言太大了。只要K是数量合宜，规模恰巧，那么看到每逢推动极值失去跟进，我就敢以高低一押注突破失败，加入重回趋势的方向。你还可能想要进一步问清楚的是太妃，你说每逢推动极值失去跟进，就以高低一押注突破失败。这里到底是高一还是高二？我可以理解你的怀疑，这同样是定义的问题。对于回调发生以来的整个形态来说，是高二无物。但就这一推，集中我所关注的磁体后动能表现如何而言，我说它是触线后的高一。如此类推，但是价格在这里继续盘旋一下，出现又一次的高点降低再抬升则它是触线后的高二。至于整个形态，则是高三。那么，前述所有双重顶底楔形顶底，我说高低一入场。所指设的都是以触及磁体后的高一为定义，不触及我就不会算数。在入场时机如此规定，就可以避免第二推，第三推中出现多次高点降低在抬升。但我却不晓得能不能够入场的问题。总之，就是要在关键的价位上看到我要的微观逆转表现再进场。此前如何相对不重要。而我也必须重申，以上是方便操作起见，向你分享我的规则，撰写建议。你可以采用，也当然可以不采用，或者采用部分调整部分。我不是刻意要在教学的时候留下模糊的空间，让你觉得困扰。而是建仓形态本来就没有一定之规，每个人的风格以及偏好入场的时机都不一样。这不像原理部分，我可以讲的比较斩钉截铁是怎样就是怎样。所以如果你想要扩大或缩小形态K线数量的参数。或者你想在第二推出现之后，以高二才入场，那都可以。假如你只要你确定测试期望之后为正，那你就可以发展出适合你的，你顺手的武器。无比谁都乐，见百花齐放。","p":"p546"}]},{"t":"para","text":"以此为例，举目可见的是一个上升的趋势。而自回调启动起算，多头曾经扳回劣势两次，也就是产生了高一与高二。那么，在更少时间的级别图表上会是什么模样呢？清晰可见是双重底没错。但K线数量会变多，整个双重底的第一推内部，以高一作节。但第二推却内含高二，高三，高四，直到高五才触线反弹恢复趋势。学习者自学时常有的混淆是阿尔布鲁克斯说，“高二等效于双重底”。但这代表我在上升趋势中等到回调出现高二就可以入场吗？这样入场就算是在早已双重底吗？我想并不尽然。或许趋势会从此恢复，造就第二推极浅的杯柄形态双重底。但你要说这是第二推，对第一推极值的测试，怎么看都会因为距离太远而稍显牵强。所以仔细听好，我建议你有以下的意识。如果在你所交易的时间级别图表上，比如是五分钟级别好了，看这个趋势运行以及对它的回调，看起来K线都不少。那你就要设想哦，这应该是一个庞大的超乎于我时间级别的结构。“我是老鼠，但现在有一头大象经过。”这代表在maybe三四倍的时间级别图表上面看起来会是简洁的阳线运行，加上简洁的阴线回调。没什么特别的。说它是15分钟级别，那或许双重底会在高一为左峰，高二为右峰以后就恢复。但对于我的五分钟级别图表来说，两个底总共出现到高五高六都不奇怪。毕竟我选到的是更微观的时间视角，所看到价格运动就应当会更细碎。知道这一点有何作用呢？当然了，这可以避免你螳臂当车，误以为单一次，无视脉络的数K线就能够终结一次庞大的推动。于是在过大双重底中找到高二，就想进场，最后招来亏损。所以这提醒你在做交易规则的设计时，必须考量我所介入的双重顶底或楔形顶底。所包含的K线总数应该控制在什么范围？这样的问题。这题的答案当然因人而异，但对于日内交易的我来说，要是有我设计旗型回调的交易规则，我可能会更偏好一段推动在两到五根K线结束的那种规模。遂此，一个双重底回调包含了向下两推，向上一推，总共三推，那6到15根K线，会对于我来说是最舒适的。同理，如果又发展成楔形顶底，那10到25根K线最好。再多这对我而言太大了。只要K是数量合宜，规模恰巧，那么看到每逢推动极值失去跟进，我就敢以高低一押注突破失败，加入重回趋势的方向。你还可能想要进一步问清楚的是太妃，你说每逢推动极值失去跟进，就以高低一押注突破失败。这里到底是高一还是高二？我可以理解你的怀疑，这同样是定义的问题。对于回调发生以来的整个形态来说，是高二无物。但就这一推，集中我所关注的磁体后动能表现如何而言，我说它是触线后的高一。如此类推，但是价格在这里继续盘旋一下，出现又一次的高点降低再抬升则它是触线后的高二。至于整个形态，则是高三。那么，前述所有双重顶底楔形顶底，我说高低一入场。所指设的都是以触及磁体后的高一为定义，不触及我就不会算数。在入场时机如此规定，就可以避免第二推，第三推中出现多次高点降低在抬升。但我却不晓得能不能够入场的问题。总之，就是要在关键的价位上看到我要的微观逆转表现再进场。此前如何相对不重要。而我也必须重申，以上是方便操作起见，向你分享我的规则，撰写建议。你可以采用，也当然可以不采用，或者采用部分调整部分。我不是刻意要在教学的时候留下模糊的空间，让你觉得困扰。而是建仓形态本来就没有一定之规，每个人的风格以及偏好入场的时机都不一样。这不像原理部分，我可以讲的比较斩钉截铁是怎样就是怎样。所以如果你想要扩大或缩小形态K线数量的参数。或者你想在第二推出现之后，以高二才入场，那都可以。假如你只要你确定测试期望之后为正，那你就可以发展出适合你的，你顺手的武器。无比谁都乐，见百花齐放。","pid":"p546"},{"t":"img","src":"assets/img/l14B_253.webp","ilabel":"14-25","icap":"L14　旗型回调交易方法","fid":"fig253","ctx":[{"t":"以此为例，举目可见的是一个上升的趋势。而自回调启动起算，多头曾经扳回劣势两次，也就是产生了高一与高二。那么，在更少时间的级别图表上会是什么模样呢？清晰可见是双重底没错。但K线数量会变多，整个双重底的第一推内部，以高一作节。但第二推却内含高二，高三，高四，直到高五才触线反弹恢复趋势。学习者自学时常有的混淆是阿尔布鲁克斯说，“高二等效于双重底”。但这代表我在上升趋势中等到回调出现高二就可以入场吗？这样入场就算是在早已双重底吗？我想并不尽然。或许趋势会从此恢复，造就第二推极浅的杯柄形态双重底。但你要说这是第二推，对第一推极值的测试，怎么看都会因为距离太远而稍显牵强。所以仔细听好，我建议你有以下的意识。如果在你所交易的时间级别图表上，比如是五分钟级别好了，看这个趋势运行以及对它的回调，看起来K线都不少。那你就要设想哦，这应该是一个庞大的超乎于我时间级别的结构。“我是老鼠，但现在有一头大象经过。”这代表在maybe三四倍的时间级别图表上面看起来会是简洁的阳线运行，加上简洁的阴线回调。没什么特别的。说它是15分钟级别，那或许双重底会在高一为左峰，高二为右峰以后就恢复。但对于我的五分钟级别图表来说，两个底总共出现到高五高六都不奇怪。毕竟我选到的是更微观的时间视角，所看到价格运动就应当会更细碎。知道这一点有何作用呢？当然了，这可以避免你螳臂当车，误以为单一次，无视脉络的数K线就能够终结一次庞大的推动。于是在过大双重底中找到高二，就想进场，最后招来亏损。所以这提醒你在做交易规则的设计时，必须考量我所介入的双重顶底或楔形顶底。所包含的K线总数应该控制在什么范围？这样的问题。这题的答案当然因人而异，但对于日内交易的我来说，要是有我设计旗型回调的交易规则，我可能会更偏好一段推动在两到五根K线结束的那种规模。遂此，一个双重底回调包含了向下两推，向上一推，总共三推，那6到15根K线，会对于我来说是最舒适的。同理，如果又发展成楔形顶底，那10到25根K线最好。再多这对我而言太大了。只要K是数量合宜，规模恰巧，那么看到每逢推动极值失去跟进，我就敢以高低一押注突破失败，加入重回趋势的方向。你还可能想要进一步问清楚的是太妃，你说每逢推动极值失去跟进，就以高低一押注突破失败。这里到底是高一还是高二？我可以理解你的怀疑，这同样是定义的问题。对于回调发生以来的整个形态来说，是高二无物。但就这一推，集中我所关注的磁体后动能表现如何而言，我说它是触线后的高一。如此类推，但是价格在这里继续盘旋一下，出现又一次的高点降低再抬升则它是触线后的高二。至于整个形态，则是高三。那么，前述所有双重顶底楔形顶底，我说高低一入场。所指设的都是以触及磁体后的高一为定义，不触及我就不会算数。在入场时机如此规定，就可以避免第二推，第三推中出现多次高点降低在抬升。但我却不晓得能不能够入场的问题。总之，就是要在关键的价位上看到我要的微观逆转表现再进场。此前如何相对不重要。而我也必须重申，以上是方便操作起见，向你分享我的规则，撰写建议。你可以采用，也当然可以不采用，或者采用部分调整部分。我不是刻意要在教学的时候留下模糊的空间，让你觉得困扰。而是建仓形态本来就没有一定之规，每个人的风格以及偏好入场的时机都不一样。这不像原理部分，我可以讲的比较斩钉截铁是怎样就是怎样。所以如果你想要扩大或缩小形态K线数量的参数。或者你想在第二推出现之后，以高二才入场，那都可以。假如你只要你确定测试期望之后为正，那你就可以发展出适合你的，你顺手的武器。无比谁都乐，见百花齐放。","p":"p546"},{"t":"讲了这么多，我们再做收敛来看最后一个例子吧。相较于昨天，既然是跳空低开，尝试向上运动，但再次下坠在今日低点处，收出了双重底。虽然这也是双重底，善于交易反转的，交易者会愿意在高一时进场。但毕竟这与这个单元的顺势交易主题不同，所以我们暂时不讨论。后续看见的是价格缓慢上行，直到突破今日的开盘区间，并有阳线跟进，准备向上展开新的突破循环。不过，到了昨日，尾盘区间下缘附近K线开始变得犹豫。你可以感知到多空似乎正在讨论此处是否就是均衡。但结局是几经向上周折，每每无法突破多头趋势高点。最后终于触及昨日区间下缘，开启较为深的调整。细究一下此处，你可以发现，急速在回调出现之后结束，走出的是两次向上突破失败的三推楔形顶。同样，作为反转交易方法，这种交易机会应留待第16单元讨论。但总之，此处有更深的下铺，是楔形顶熊旗所导致。且由于通道线重叠，昨日区间下缘也是标准的对决线入场点。这次顺便带你复习定义。而相较于首次回调，这些较深的下跌就可能造就过冲第一推极值双重底。突破尝试后，失去有效跟进。随即有双内包K线可能催生高一，也就终于给到了符合主题的双重底牛旗回调顺势交易机会。后面走的不是特别干脆，晃荡了些许，又来了第三次推动。这一次，同样是对第二推过冲且终于完整的测试到了开盘区间的上缘。那当然，这也是标准的对接线入场点。高一进场，后续节节上升，顺利的完成了AB=CD的等距运动。","p":"p547"}]},{"t":"para","text":"讲了这么多，我们再做收敛来看最后一个例子吧。相较于昨天，既然是跳空低开，尝试向上运动，但再次下坠在今日低点处，收出了双重底。虽然这也是双重底，善于交易反转的，交易者会愿意在高一时进场。但毕竟这与这个单元的顺势交易主题不同，所以我们暂时不讨论。后续看见的是价格缓慢上行，直到突破今日的开盘区间，并有阳线跟进，准备向上展开新的突破循环。不过，到了昨日，尾盘区间下缘附近K线开始变得犹豫。你可以感知到多空似乎正在讨论此处是否就是均衡。但结局是几经向上周折，每每无法突破多头趋势高点。最后终于触及昨日区间下缘，开启较为深的调整。细究一下此处，你可以发现，急速在回调出现之后结束，走出的是两次向上突破失败的三推楔形顶。同样，作为反转交易方法，这种交易机会应留待第16单元讨论。但总之，此处有更深的下铺，是楔形顶熊旗所导致。且由于通道线重叠，昨日区间下缘也是标准的对决线入场点。这次顺便带你复习定义。而相较于首次回调，这些较深的下跌就可能造就过冲第一推极值双重底。突破尝试后，失去有效跟进。随即有双内包K线可能催生高一，也就终于给到了符合主题的双重底牛旗回调顺势交易机会。后面走的不是特别干脆，晃荡了些许，又来了第三次推动。这一次，同样是对第二推过冲且终于完整的测试到了开盘区间的上缘。那当然，这也是标准的对接线入场点。高一进场，后续节节上升，顺利的完成了AB=CD的等距运动。","pid":"p547"},{"t":"img","src":"assets/img/l14B_254.webp","ilabel":"14-26","icap":"L14　旗型回调交易方法","fid":"fig254","ctx":[{"t":"讲了这么多，我们再做收敛来看最后一个例子吧。相较于昨天，既然是跳空低开，尝试向上运动，但再次下坠在今日低点处，收出了双重底。虽然这也是双重底，善于交易反转的，交易者会愿意在高一时进场。但毕竟这与这个单元的顺势交易主题不同，所以我们暂时不讨论。后续看见的是价格缓慢上行，直到突破今日的开盘区间，并有阳线跟进，准备向上展开新的突破循环。不过，到了昨日，尾盘区间下缘附近K线开始变得犹豫。你可以感知到多空似乎正在讨论此处是否就是均衡。但结局是几经向上周折，每每无法突破多头趋势高点。最后终于触及昨日区间下缘，开启较为深的调整。细究一下此处，你可以发现，急速在回调出现之后结束，走出的是两次向上突破失败的三推楔形顶。同样，作为反转交易方法，这种交易机会应留待第16单元讨论。但总之，此处有更深的下铺，是楔形顶熊旗所导致。且由于通道线重叠，昨日区间下缘也是标准的对决线入场点。这次顺便带你复习定义。而相较于首次回调，这些较深的下跌就可能造就过冲第一推极值双重底。突破尝试后，失去有效跟进。随即有双内包K线可能催生高一，也就终于给到了符合主题的双重底牛旗回调顺势交易机会。后面走的不是特别干脆，晃荡了些许，又来了第三次推动。这一次，同样是对第二推过冲且终于完整的测试到了开盘区间的上缘。那当然，这也是标准的对接线入场点。高一进场，后续节节上升，顺利的完成了AB=CD的等距运动。","p":"p547"},{"t":"最后来快速做个总结。这个单元的讲题是旗型回调交易方法。之所以我们可以在趋势中寻找旗型回调的介入。当然是因为趋势倾向延续而反转，尝试倾向失败。如前所述，当趋势动能仍然强劲，那么回调常常以宽幅通道的形式开展。特征是每次逆势方推动价格回归自身的局部趋势机制，都更可能面临到远趋势方的迎头痛击。而自己人却倾向止盈离场。所以此这些调整多半呈现出动能疲弱的样子，而我们便可以利用这一点来进行交易。预期趋势终会恢复并带给顺势入场的我们利润。就这个意义上来说，所有我们常见的形态，无论你以前是如何学习，如何认知它们。实际上，对自身的局部趋势而言，都是所谓的反转形态。以上升通道为例，你很清楚知道它是熊旗，也无论内部的推动数量如何，因其一推不如一推的动能表现。最终价格倾向下破趋势线，终结这个局部的上升趋势。而当这样的反转形态嵌于更大下降趋势中。它起到的效果除反转自身，也成了承上启下，持续形态。这正是各种持续形态被如此称呼与认知的由来，还有其脉络前提，必须存在于更宏观的趋势之中。而若撇出脉络不谈，则它是反转自身的反转形态。你必须深刻的理解这一个本质。理解原理之后，我们谈了两大综合建仓方案，分别针对二推的双重顶底以及三推的楔形顶底。比如我强调的推动次数是区辩他们的关键。否则，双重顶底的第二推可以是过冲持平或不及的楔形顶底，也可能二长三短。二短三长会有难以统一的各种外观。而我更推荐挑那些对前一推至少过冲或持平的类型来交易，避免自己过早入场，误入歧途。出现之后，等待朝原趋势方向的高低一即可。止损止盈，只要如理，你可以任意挑选前述符合价格行为理据的方案。其中，对这些形态采用对决线作为辅助，可以增加胜率。也为你复习所谓的对决线，就是形态通道线重合某一个磁体，而使得反转更容易发生。为想要押注旗型回调结束的你增添胜率。你可以回顾第九和第十单元的内容，自由挑选也有为够格服务你的磁体来作为对决线。组装积木的过程是很有趣的，强行撰写规则的时候，你也会体验到此间的趣味。最后的最后，则谈一些注意事项，包括形态很少是完美的，重点是你理解各种走势所蕴含的多空竞合含义。以及当然形态可能会失败，朝向意外的方向，也就是突破通道线并加速冲刺，造成基于失败形态高度的等距运动。乃至于创造出新的突破循环。于是你建仓方案必定要是严肃设计过的。出入场符合价格行为理据。等待回测之后，除去统计优势来提供你执行上的信心。否则，一旦没有行为准则，没有你知其然，也知其所以然的规章作为依靠，价格行为千变万化，对吧？你很容易迷失其中。至于第三点，则给出了形态规模上的建议。撰写规则时可以思考自己要以什么讯号介入什么K线数量的形态。在往后的单元里，我也会更多的提醒，如何考虑建仓方案的执行细节，强调将其规则化的思考方向。逐渐你会制定出属于你自己的交易方针，并在变幻莫测市场中有所依凭。而当然，前提是你理解所有原理，并愿意练习和实测。情感重要性自不待言，我们一起加油。感谢收看旗型回调交易方法，我们下个单元见。","p":"p548"}]},{"t":"para","text":"最后来快速做个总结。这个单元的讲题是旗型回调交易方法。之所以我们可以在趋势中寻找旗型回调的介入。当然是因为趋势倾向延续而反转，尝试倾向失败。如前所述，当趋势动能仍然强劲，那么回调常常以宽幅通道的形式开展。特征是每次逆势方推动价格回归自身的局部趋势机制，都更可能面临到远趋势方的迎头痛击。而自己人却倾向止盈离场。所以此这些调整多半呈现出动能疲弱的样子，而我们便可以利用这一点来进行交易。预期趋势终会恢复并带给顺势入场的我们利润。就这个意义上来说，所有我们常见的形态，无论你以前是如何学习，如何认知它们。实际上，对自身的局部趋势而言，都是所谓的反转形态。以上升通道为例，你很清楚知道它是熊旗，也无论内部的推动数量如何，因其一推不如一推的动能表现。最终价格倾向下破趋势线，终结这个局部的上升趋势。而当这样的反转形态嵌于更大下降趋势中。它起到的效果除反转自身，也成了承上启下，持续形态。这正是各种持续形态被如此称呼与认知的由来，还有其脉络前提，必须存在于更宏观的趋势之中。而若撇出脉络不谈，则它是反转自身的反转形态。你必须深刻的理解这一个本质。理解原理之后，我们谈了两大综合建仓方案，分别针对二推的双重顶底以及三推的楔形顶底。比如我强调的推动次数是区辩他们的关键。否则，双重顶底的第二推可以是过冲持平或不及的楔形顶底，也可能二长三短。二短三长会有难以统一的各种外观。而我更推荐挑那些对前一推至少过冲或持平的类型来交易，避免自己过早入场，误入歧途。出现之后，等待朝原趋势方向的高低一即可。止损止盈，只要如理，你可以任意挑选前述符合价格行为理据的方案。其中，对这些形态采用对决线作为辅助，可以增加胜率。也为你复习所谓的对决线，就是形态通道线重合某一个磁体，而使得反转更容易发生。为想要押注旗型回调结束的你增添胜率。你可以回顾第九和第十单元的内容，自由挑选也有为够格服务你的磁体来作为对决线。组装积木的过程是很有趣的，强行撰写规则的时候，你也会体验到此间的趣味。最后的最后，则谈一些注意事项，包括形态很少是完美的，重点是你理解各种走势所蕴含的多空竞合含义。以及当然形态可能会失败，朝向意外的方向，也就是突破通道线并加速冲刺，造成基于失败形态高度的等距运动。乃至于创造出新的突破循环。于是你建仓方案必定要是严肃设计过的。出入场符合价格行为理据。等待回测之后，除去统计优势来提供你执行上的信心。否则，一旦没有行为准则，没有你知其然，也知其所以然的规章作为依靠，价格行为千变万化，对吧？你很容易迷失其中。至于第三点，则给出了形态规模上的建议。撰写规则时可以思考自己要以什么讯号介入什么K线数量的形态。在往后的单元里，我也会更多的提醒，如何考虑建仓方案的执行细节，强调将其规则化的思考方向。逐渐你会制定出属于你自己的交易方针，并在变幻莫测市场中有所依凭。而当然，前提是你理解所有原理，并愿意练习和实测。情感重要性自不待言，我们一起加油。感谢收看旗型回调交易方法，我们下个单元见。","pid":"p548"}],"wcount":7939}],"wcount":14642},{"id":"l15","icon":"L15","title":"L15　区间交易方法","blocks":[],"sections":[{"id":"l15A","title":"第A段　区间交易方法","blocks":[{"t":"para","text":"L15A 区间交易方法","pid":"p549"},{"t":"img","src":"assets/img/l15A_255.webp","ilabel":"15-1","icap":"L15　区间交易方法","fid":"fig255","ctx":[{"t":"L15A 区间交易方法","p":"p549"},{"t":"顺着市场循环的逻辑，我们继续谈区间交易方法，也就是在区间均衡的状态中，该如何发掘交易机会？所要讨论的包括同样为你复习区间的定义与特性。有哪些特性是我们可以着重运用以发展出建仓方案的？以及我们说区间是市场进入均衡的选项，那么我们就可以讨论在均衡中如何出入场。在均衡转入失衡的过渡期间，又可能给我们带来什么样的交易机会？最后则同样是提醒注意事项并进行综合演练。","p":"p550"}]},{"t":"para","text":"顺着市场循环的逻辑，我们继续谈区间交易方法，也就是在区间均衡的状态中，该如何发掘交易机会？所要讨论的包括同样为你复习区间的定义与特性。有哪些特性是我们可以着重运用以发展出建仓方案的？以及我们说区间是市场进入均衡的选项，那么我们就可以讨论在均衡中如何出入场。在均衡转入失衡的过渡期间，又可能给我们带来什么样的交易机会？最后则同样是提醒注意事项并进行综合演练。","pid":"p550"},{"t":"img","src":"assets/img/l15A_256.webp","ilabel":"15-2","icap":"L15　区间交易方法","fid":"fig256","ctx":[{"t":"顺着市场循环的逻辑，我们继续谈区间交易方法，也就是在区间均衡的状态中，该如何发掘交易机会？所要讨论的包括同样为你复习区间的定义与特性。有哪些特性是我们可以着重运用以发展出建仓方案的？以及我们说区间是市场进入均衡的选项，那么我们就可以讨论在均衡中如何出入场。在均衡转入失衡的过渡期间，又可能给我们带来什么样的交易机会？最后则同样是提醒注意事项并进行综合演练。","p":"p550"},{"t":"我们马上进入正题。前两个单元我们讨论了趋势发起之初的急速建仓方案，并引入过渡到窄幅通道与宽幅通道之交。不过，正如先前聊到的，这其实是趋势动能逐步衰退的过程。以市场循环的角度理解之，趋势迸发的失衡之始，已经渐次要回归均衡。许多人尤其是非专业交易者宣称自己喜欢做趋势交易太慢的原因是趋势运动通常遥远。顺利的话，就如我们常听到的故事，只要不小心建立了一个早期仓位，就可能一路眼睛蒙着就最终收获大笔利润。不过听过前两个单元，你已经知道精确的止损和止盈都是专业的必要。只建立一个仓位就发家致富，想着再也不用交易，可以开始享清福，更是外行的侥幸结果。不是我们要追求的境地。那么，我们抱着什么样的态度来学习交易？从事交易会更加正确呢？我想是明白交易是逐笔积累的一个行当。也于是，无论市场脉络如何，是趋势还是非趋势，是失衡还是均衡。只要明白价格行为原理，谨记盈亏比与胜率成反比的关系，你就知道如何在不同行情中做合理的，有利可图的决策。说这么多，我是想要引出一点。即使是令多数人觉得枯燥的区间，也实际上充满交易机会。区间代表均衡，则代表此处恰恰是机构交易者最激烈，最频繁出入的地方。我们没有道理认为这里无利可图。要是交易者不掌握在区间盈利的方法，那在这市场中有80%的时间都处在状态。你难免觉得坐困愁城。所以会展开对区间交易方法的讨论，以下同样有一些题目要询问你。","p":"p551"}]},{"t":"para","text":"我们马上进入正题。前两个单元我们讨论了趋势发起之初的急速建仓方案，并引入过渡到窄幅通道与宽幅通道之交。不过，正如先前聊到的，这其实是趋势动能逐步衰退的过程。以市场循环的角度理解之，趋势迸发的失衡之始，已经渐次要回归均衡。许多人尤其是非专业交易者宣称自己喜欢做趋势交易太慢的原因是趋势运动通常遥远。顺利的话，就如我们常听到的故事，只要不小心建立了一个早期仓位，就可能一路眼睛蒙着就最终收获大笔利润。不过听过前两个单元，你已经知道精确的止损和止盈都是专业的必要。只建立一个仓位就发家致富，想着再也不用交易，可以开始享清福，更是外行的侥幸结果。不是我们要追求的境地。那么，我们抱着什么样的态度来学习交易？从事交易会更加正确呢？我想是明白交易是逐笔积累的一个行当。也于是，无论市场脉络如何，是趋势还是非趋势，是失衡还是均衡。只要明白价格行为原理，谨记盈亏比与胜率成反比的关系，你就知道如何在不同行情中做合理的，有利可图的决策。说这么多，我是想要引出一点。即使是令多数人觉得枯燥的区间，也实际上充满交易机会。区间代表均衡，则代表此处恰恰是机构交易者最激烈，最频繁出入的地方。我们没有道理认为这里无利可图。要是交易者不掌握在区间盈利的方法，那在这市场中有80%的时间都处在状态。你难免觉得坐困愁城。所以会展开对区间交易方法的讨论，以下同样有一些题目要询问你。","pid":"p551"},{"t":"img","src":"assets/img/l15A_257.webp","ilabel":"15-3","icap":"L15　区间交易方法","fid":"fig257","ctx":[{"t":"我们马上进入正题。前两个单元我们讨论了趋势发起之初的急速建仓方案，并引入过渡到窄幅通道与宽幅通道之交。不过，正如先前聊到的，这其实是趋势动能逐步衰退的过程。以市场循环的角度理解之，趋势迸发的失衡之始，已经渐次要回归均衡。许多人尤其是非专业交易者宣称自己喜欢做趋势交易太慢的原因是趋势运动通常遥远。顺利的话，就如我们常听到的故事，只要不小心建立了一个早期仓位，就可能一路眼睛蒙着就最终收获大笔利润。不过听过前两个单元，你已经知道精确的止损和止盈都是专业的必要。只建立一个仓位就发家致富，想着再也不用交易，可以开始享清福，更是外行的侥幸结果。不是我们要追求的境地。那么，我们抱着什么样的态度来学习交易？从事交易会更加正确呢？我想是明白交易是逐笔积累的一个行当。也于是，无论市场脉络如何，是趋势还是非趋势，是失衡还是均衡。只要明白价格行为原理，谨记盈亏比与胜率成反比的关系，你就知道如何在不同行情中做合理的，有利可图的决策。说这么多，我是想要引出一点。即使是令多数人觉得枯燥的区间，也实际上充满交易机会。区间代表均衡，则代表此处恰恰是机构交易者最激烈，最频繁出入的地方。我们没有道理认为这里无利可图。要是交易者不掌握在区间盈利的方法，那在这市场中有80%的时间都处在状态。你难免觉得坐困愁城。所以会展开对区间交易方法的讨论，以下同样有一些题目要询问你。","p":"p551"},{"t":"包括何谓区间。在这题之下，可以展开的思考是，旗型回调算是区间吗？其实末尾的宽幅通道算是区间吗？以及区间有何特性？最后则是针对这些特性，我们可以发展出什么样有利可图的建仓方案。同样略作思考之后，我们来进行解答。","p":"p552"}]},{"t":"para","text":"包括何谓区间。在这题之下，可以展开的思考是，旗型回调算是区间吗？其实末尾的宽幅通道算是区间吗？以及区间有何特性？最后则是针对这些特性，我们可以发展出什么样有利可图的建仓方案。同样略作思考之后，我们来进行解答。","pid":"p552"},{"t":"img","src":"assets/img/l15A_258.webp","ilabel":"15-4","icap":"L15　区间交易方法","fid":"fig258","ctx":[{"t":"包括何谓区间。在这题之下，可以展开的思考是，旗型回调算是区间吗？其实末尾的宽幅通道算是区间吗？以及区间有何特性？最后则是针对这些特性，我们可以发展出什么样有利可图的建仓方案。同样略作思考之后，我们来进行解答。","p":"p552"},{"t":"第一题何谓区间。就如先前说的，区间指的是双边交易性格较为强烈的地带。在图表上显示为阴阳交错相互重叠，买卖压都相对充分的样子。顺着前两个单元提到的交易方法，按照市场循环的序列想下来，你也不难再次充分的理解到。为什么趋势的末尾经常陷入区间？这是因为，随着远离急速迸发的失衡瞬间，顺势交易并争取等区利润的胜率从60%,70%逐渐下降到趋近50%，引发逆势方开始愿意进场。这也正是均衡的意思。那你也知道失衡通常是多空共识，改变所启动的市场倾向，快速移动到新均衡之所在。因此，尽管适合你的运动距离可能很遥远，在图表上相当醒目，但就时间的分布来说。更多时候，市场会处在不起眼的双边交易状态。那么，进一步思考宽幅通道和旗型回调是否算是某种程度的区间？就前面的定义而言，答案是肯定的。虽然宽幅通道不能算是全然的均衡。否则应该了无斜率，完全水平表示多空中没有任何一方能够自称为顺势方。但无论如何，依旧是双边交易性格占了较大部分。还记得吗？区分通道宽窄的关键在于逆势方是否得以轻松盈利。那既然逆势方可以自在协议的出路了，双边交易显然就是客观事实。因此，通道由窄到宽的过渡中，区间的特性会越趋明显。当斜率竞技消失，宽幅通道也将与区间几乎无异。另一项思考是，上个单元才能旗型回调，能不能也算做区间？现在你也很容易可以反应过来算的，毕竟旗型回调也常常是宽幅通道。只不过是嵌于趋势中的逆向宽幅通道。查验任何一个楔形底牛旗，我们都可以看到，这显然是个双边交易强烈的段落无误。基本上多空尝试相互吞没，斜率也并不陡峭向下突破屡屡失败。因此旗型回调也是区间。这个时候你可能反应良快，感受到一些矛盾。太妃区间倾向突破失败，这我已经铭记在心。不过，如果旗型回调也是区间，那么何以上升趋势中的牛旗回调，最终可以引发向上的突破，使趋势延续呢？了解这一题，我们必须想起脉络的重要性。当一个区间，一个旗型回调是嵌于上升趋势中。则这里的双边交易卖出的部分可能是多头止盈，空头的剥头皮交易者介入所导致。但另一方面，也有买入的力量的作用。他们可能是踏空方才上涨的潜在多头，以及做错方向的被套空头。他们会趁市场有短暂调整的期间修正做法。改为买进。因此，趋势倾向延续，反转尝试倾向失败。宏观看待整个趋势，该牛旗虽然作为区间，但却因为处于上涨的趋势脉络中而倾向最终上破。不过如果我们只聚焦在局部，则在该牛旗最终上破以前，确实可能每逢区间上缘就造逢卖压拦阻，体现出区间倾向突破失败的那一面。这两点看似矛盾，但其实不过是视角不同。考虑清楚你所要遭遇的行情的规模，你就会知道该采哪一个观点才恰当。","p":"p553"}]},{"t":"para","text":"第一题何谓区间。就如先前说的，区间指的是双边交易性格较为强烈的地带。在图表上显示为阴阳交错相互重叠，买卖压都相对充分的样子。顺着前两个单元提到的交易方法，按照市场循环的序列想下来，你也不难再次充分的理解到。为什么趋势的末尾经常陷入区间？这是因为，随着远离急速迸发的失衡瞬间，顺势交易并争取等区利润的胜率从60%,70%逐渐下降到趋近50%，引发逆势方开始愿意进场。这也正是均衡的意思。那你也知道失衡通常是多空共识，改变所启动的市场倾向，快速移动到新均衡之所在。因此，尽管适合你的运动距离可能很遥远，在图表上相当醒目，但就时间的分布来说。更多时候，市场会处在不起眼的双边交易状态。那么，进一步思考宽幅通道和旗型回调是否算是某种程度的区间？就前面的定义而言，答案是肯定的。虽然宽幅通道不能算是全然的均衡。否则应该了无斜率，完全水平表示多空中没有任何一方能够自称为顺势方。但无论如何，依旧是双边交易性格占了较大部分。还记得吗？区分通道宽窄的关键在于逆势方是否得以轻松盈利。那既然逆势方可以自在协议的出路了，双边交易显然就是客观事实。因此，通道由窄到宽的过渡中，区间的特性会越趋明显。当斜率竞技消失，宽幅通道也将与区间几乎无异。另一项思考是，上个单元才能旗型回调，能不能也算做区间？现在你也很容易可以反应过来算的，毕竟旗型回调也常常是宽幅通道。只不过是嵌于趋势中的逆向宽幅通道。查验任何一个楔形底牛旗，我们都可以看到，这显然是个双边交易强烈的段落无误。基本上多空尝试相互吞没，斜率也并不陡峭向下突破屡屡失败。因此旗型回调也是区间。这个时候你可能反应良快，感受到一些矛盾。太妃区间倾向突破失败，这我已经铭记在心。不过，如果旗型回调也是区间，那么何以上升趋势中的牛旗回调，最终可以引发向上的突破，使趋势延续呢？了解这一题，我们必须想起脉络的重要性。当一个区间，一个旗型回调是嵌于上升趋势中。则这里的双边交易卖出的部分可能是多头止盈，空头的剥头皮交易者介入所导致。但另一方面，也有买入的力量的作用。他们可能是踏空方才上涨的潜在多头，以及做错方向的被套空头。他们会趁市场有短暂调整的期间修正做法。改为买进。因此，趋势倾向延续，反转尝试倾向失败。宏观看待整个趋势，该牛旗虽然作为区间，但却因为处于上涨的趋势脉络中而倾向最终上破。不过如果我们只聚焦在局部，则在该牛旗最终上破以前，确实可能每逢区间上缘就造逢卖压拦阻，体现出区间倾向突破失败的那一面。这两点看似矛盾，但其实不过是视角不同。考虑清楚你所要遭遇的行情的规模，你就会知道该采哪一个观点才恰当。","pid":"p553"},{"t":"img","src":"assets/img/l15A_259.webp","ilabel":"15-5","icap":"L15　区间交易方法","fid":"fig259","ctx":[{"t":"第一题何谓区间。就如先前说的，区间指的是双边交易性格较为强烈的地带。在图表上显示为阴阳交错相互重叠，买卖压都相对充分的样子。顺着前两个单元提到的交易方法，按照市场循环的序列想下来，你也不难再次充分的理解到。为什么趋势的末尾经常陷入区间？这是因为，随着远离急速迸发的失衡瞬间，顺势交易并争取等区利润的胜率从60%,70%逐渐下降到趋近50%，引发逆势方开始愿意进场。这也正是均衡的意思。那你也知道失衡通常是多空共识，改变所启动的市场倾向，快速移动到新均衡之所在。因此，尽管适合你的运动距离可能很遥远，在图表上相当醒目，但就时间的分布来说。更多时候，市场会处在不起眼的双边交易状态。那么，进一步思考宽幅通道和旗型回调是否算是某种程度的区间？就前面的定义而言，答案是肯定的。虽然宽幅通道不能算是全然的均衡。否则应该了无斜率，完全水平表示多空中没有任何一方能够自称为顺势方。但无论如何，依旧是双边交易性格占了较大部分。还记得吗？区分通道宽窄的关键在于逆势方是否得以轻松盈利。那既然逆势方可以自在协议的出路了，双边交易显然就是客观事实。因此，通道由窄到宽的过渡中，区间的特性会越趋明显。当斜率竞技消失，宽幅通道也将与区间几乎无异。另一项思考是，上个单元才能旗型回调，能不能也算做区间？现在你也很容易可以反应过来算的，毕竟旗型回调也常常是宽幅通道。只不过是嵌于趋势中的逆向宽幅通道。查验任何一个楔形底牛旗，我们都可以看到，这显然是个双边交易强烈的段落无误。基本上多空尝试相互吞没，斜率也并不陡峭向下突破屡屡失败。因此旗型回调也是区间。这个时候你可能反应良快，感受到一些矛盾。太妃区间倾向突破失败，这我已经铭记在心。不过，如果旗型回调也是区间，那么何以上升趋势中的牛旗回调，最终可以引发向上的突破，使趋势延续呢？了解这一题，我们必须想起脉络的重要性。当一个区间，一个旗型回调是嵌于上升趋势中。则这里的双边交易卖出的部分可能是多头止盈，空头的剥头皮交易者介入所导致。但另一方面，也有买入的力量的作用。他们可能是踏空方才上涨的潜在多头，以及做错方向的被套空头。他们会趁市场有短暂调整的期间修正做法。改为买进。因此，趋势倾向延续，反转尝试倾向失败。宏观看待整个趋势，该牛旗虽然作为区间，但却因为处于上涨的趋势脉络中而倾向最终上破。不过如果我们只聚焦在局部，则在该牛旗最终上破以前，确实可能每逢区间上缘就造逢卖压拦阻，体现出区间倾向突破失败的那一面。这两点看似矛盾，但其实不过是视角不同。考虑清楚你所要遭遇的行情的规模，你就会知道该采哪一个观点才恰当。","p":"p553"},{"t":"接着我们谈第二个问题，区间有何特性？第一点当然也是不需多言的关键倾向。向外突破区间的尝试都不容易成立。当然，如果区间的规模很小，也就是高度还持续时间总体的K线数量都并不可观。则在趋势行情中更适合被作为短暂的休止来看待，最终倾向顺势突破。不过反过来说，要是在你所交易的时间级别图表上观测到的区间是K线数量较多。而整体高度相较于此前的趋势性运动也比较大，那这就是一个宽泛的均衡地带。向上或向下的突破都不容易发生。如果你问此间的K线数量应该如何界定？是少还是多？依照日内交易看80根左右K线的习惯。20根以下算少，以上算多。那么，区间高度是否太宽？这又如何评估呢？如果相较于此前的趋势性运动，回调的深度已经超过运行的75%。则你应该放弃认为原趋势方还有能力维持行情，朝利己方向运行。综上，持续超过20根K线回调深度超过运行75%的双边交易地带，视为显著的区间。区间倾向突破失败。第二项重点特性是关于其上下缘。我们说均衡的意思是多空围绕着争取等，据利润仅有50%几率优势的公平中轴上下震荡。那么，当价格略微向上偏离中轴空头就会稍占上风。反过来说，当价格略微向下偏离中轴，则换成多头稍占优势。在这样的范围之中，我们可以观察价格折返的机制，并以此拿捏出上下缘来界定何为过度昂贵或廉价。在下缘多头，认为此处足够划算，因而愿意积极入场，到多单押过空单促成价格向上折返。反之，在上缘亦然，做空优势大到足以呼唤空头大举入场。那么，基于利害关系以及心理预期的原因，这里又开始积聚反向订单，为区间定向范畴。并开始呈现出磁体的属性。当价格趋近于此，给予真空的作用可能使得运动加速并出现。但一旦到位，则因为反向订单作用而驱动价格折返。回到区间内部。最后，第三项关于突破之后会如何？虽说有曲间上下缘作为磁体拦阻。虽说市场爱好均衡，而使区间不容易突破。但终有突破会导致价格远离双边交易地带。均衡毕竟不会永远持续。那么，要是区间遭到突破成功，行情倾向如何发展呢？答案是，走出基于区间高度的等距运动，走出接续突破第一推的第二推。前者基于动能交易者逻辑，追进突破瞬间者必定是认为自己有60%的胜率。争取到等距利润的数学优势。通常，这些将止损设置在区间之外者，","p":"p554"},{"t":"就凭借着区间高度等距投映在该目标止盈离场。而基于价值交易逻辑，我们则推估AB=CD的等距运动目标可能抵达。因为第一推作为意外行情，将使得踏空与被套者必须做出修正。当回调启动其介入将推展出第二推。说到这里，你就又可以将论结知识与急速交易方法的单元串接在一起。价格远离区间，就是均衡到失衡的新突破循环启动。讨论建仓方案的同时，我们再一次将关于市场循环的知识都顺道复习过。你将再次意识到原力与实做两者密不可分。只追求实操而不问，理由绝对是想盈利，但缘木求鱼。总结完原理重点，接着就可以谈相应的建仓方案。前面的单元里，我们都是教两种方法。虽然不多，但非常实用也好驾驭。不过，在区间这里，我们将一口气谈三种做法，分别是看衰突破成功，急赴磁体，以及区间突破回调。在这些方案里面，我们将紧密的用上陈述为你复习的关键概念。在过程中也请不忘揣摩一下一个有效的交易方法是如何建筑于原理而发展出来的。我相信对你将来的发明也会有所启发。","p":"p555"}]},{"t":"para","text":"接着我们谈第二个问题，区间有何特性？第一点当然也是不需多言的关键倾向。向外突破区间的尝试都不容易成立。当然，如果区间的规模很小，也就是高度还持续时间总体的K线数量都并不可观。则在趋势行情中更适合被作为短暂的休止来看待，最终倾向顺势突破。不过反过来说，要是在你所交易的时间级别图表上观测到的区间是K线数量较多。而整体高度相较于此前的趋势性运动也比较大，那这就是一个宽泛的均衡地带。向上或向下的突破都不容易发生。如果你问此间的K线数量应该如何界定？是少还是多？依照日内交易看80根左右K线的习惯。20根以下算少，以上算多。那么，区间高度是否太宽？这又如何评估呢？如果相较于此前的趋势性运动，回调的深度已经超过运行的75%。则你应该放弃认为原趋势方还有能力维持行情，朝利己方向运行。综上，持续超过20根K线回调深度超过运行75%的双边交易地带，视为显著的区间。区间倾向突破失败。第二项重点特性是关于其上下缘。我们说均衡的意思是多空围绕着争取等，据利润仅有50%几率优势的公平中轴上下震荡。那么，当价格略微向上偏离中轴空头就会稍占上风。反过来说，当价格略微向下偏离中轴，则换成多头稍占优势。在这样的范围之中，我们可以观察价格折返的机制，并以此拿捏出上下缘来界定何为过度昂贵或廉价。在下缘多头，认为此处足够划算，因而愿意积极入场，到多单押过空单促成价格向上折返。反之，在上缘亦然，做空优势大到足以呼唤空头大举入场。那么，基于利害关系以及心理预期的原因，这里又开始积聚反向订单，为区间定向范畴。并开始呈现出磁体的属性。当价格趋近于此，给予真空的作用可能使得运动加速并出现。但一旦到位，则因为反向订单作用而驱动价格折返。回到区间内部。最后，第三项关于突破之后会如何？虽说有曲间上下缘作为磁体拦阻。虽说市场爱好均衡，而使区间不容易突破。但终有突破会导致价格远离双边交易地带。均衡毕竟不会永远持续。那么，要是区间遭到突破成功，行情倾向如何发展呢？答案是，走出基于区间高度的等距运动，走出接续突破第一推的第二推。前者基于动能交易者逻辑，追进突破瞬间者必定是认为自己有60%的胜率。争取到等距利润的数学优势。通常，这些将止损设置在区间之外者，","pid":"p554"},{"t":"para","text":"就凭借着区间高度等距投映在该目标止盈离场。而基于价值交易逻辑，我们则推估AB=CD的等距运动目标可能抵达。因为第一推作为意外行情，将使得踏空与被套者必须做出修正。当回调启动其介入将推展出第二推。说到这里，你就又可以将论结知识与急速交易方法的单元串接在一起。价格远离区间，就是均衡到失衡的新突破循环启动。讨论建仓方案的同时，我们再一次将关于市场循环的知识都顺道复习过。你将再次意识到原力与实做两者密不可分。只追求实操而不问，理由绝对是想盈利，但缘木求鱼。总结完原理重点，接着就可以谈相应的建仓方案。前面的单元里，我们都是教两种方法。虽然不多，但非常实用也好驾驭。不过，在区间这里，我们将一口气谈三种做法，分别是看衰突破成功，急赴磁体，以及区间突破回调。在这些方案里面，我们将紧密的用上陈述为你复习的关键概念。在过程中也请不忘揣摩一下一个有效的交易方法是如何建筑于原理而发展出来的。我相信对你将来的发明也会有所启发。","pid":"p555"},{"t":"img","src":"assets/img/l15A_260.webp","ilabel":"15-6","icap":"L15　区间交易方法","fid":"fig260","ctx":[{"t":"接着我们谈第二个问题，区间有何特性？第一点当然也是不需多言的关键倾向。向外突破区间的尝试都不容易成立。当然，如果区间的规模很小，也就是高度还持续时间总体的K线数量都并不可观。则在趋势行情中更适合被作为短暂的休止来看待，最终倾向顺势突破。不过反过来说，要是在你所交易的时间级别图表上观测到的区间是K线数量较多。而整体高度相较于此前的趋势性运动也比较大，那这就是一个宽泛的均衡地带。向上或向下的突破都不容易发生。如果你问此间的K线数量应该如何界定？是少还是多？依照日内交易看80根左右K线的习惯。20根以下算少，以上算多。那么，区间高度是否太宽？这又如何评估呢？如果相较于此前的趋势性运动，回调的深度已经超过运行的75%。则你应该放弃认为原趋势方还有能力维持行情，朝利己方向运行。综上，持续超过20根K线回调深度超过运行75%的双边交易地带，视为显著的区间。区间倾向突破失败。第二项重点特性是关于其上下缘。我们说均衡的意思是多空围绕着争取等，据利润仅有50%几率优势的公平中轴上下震荡。那么，当价格略微向上偏离中轴空头就会稍占上风。反过来说，当价格略微向下偏离中轴，则换成多头稍占优势。在这样的范围之中，我们可以观察价格折返的机制，并以此拿捏出上下缘来界定何为过度昂贵或廉价。在下缘多头，认为此处足够划算，因而愿意积极入场，到多单押过空单促成价格向上折返。反之，在上缘亦然，做空优势大到足以呼唤空头大举入场。那么，基于利害关系以及心理预期的原因，这里又开始积聚反向订单，为区间定向范畴。并开始呈现出磁体的属性。当价格趋近于此，给予真空的作用可能使得运动加速并出现。但一旦到位，则因为反向订单作用而驱动价格折返。回到区间内部。最后，第三项关于突破之后会如何？虽说有曲间上下缘作为磁体拦阻。虽说市场爱好均衡，而使区间不容易突破。但终有突破会导致价格远离双边交易地带。均衡毕竟不会永远持续。那么，要是区间遭到突破成功，行情倾向如何发展呢？答案是，走出基于区间高度的等距运动，走出接续突破第一推的第二推。前者基于动能交易者逻辑，追进突破瞬间者必定是认为自己有60%的胜率。争取到等距利润的数学优势。通常，这些将止损设置在区间之外者，","p":"p554"},{"t":"就凭借着区间高度等距投映在该目标止盈离场。而基于价值交易逻辑，我们则推估AB=CD的等距运动目标可能抵达。因为第一推作为意外行情，将使得踏空与被套者必须做出修正。当回调启动其介入将推展出第二推。说到这里，你就又可以将论结知识与急速交易方法的单元串接在一起。价格远离区间，就是均衡到失衡的新突破循环启动。讨论建仓方案的同时，我们再一次将关于市场循环的知识都顺道复习过。你将再次意识到原力与实做两者密不可分。只追求实操而不问，理由绝对是想盈利，但缘木求鱼。总结完原理重点，接着就可以谈相应的建仓方案。前面的单元里，我们都是教两种方法。虽然不多，但非常实用也好驾驭。不过，在区间这里，我们将一口气谈三种做法，分别是看衰突破成功，急赴磁体，以及区间突破回调。在这些方案里面，我们将紧密的用上陈述为你复习的关键概念。在过程中也请不忘揣摩一下一个有效的交易方法是如何建筑于原理而发展出来的。我相信对你将来的发明也会有所启发。","p":"p555"},{"t":"第一种做法，我称之为看衰突破成功。这在阿尔布鲁克斯的体系里面是有专门的术语的，原文是look to fade。到底是什么意思呢？在交易以外的场合，这个字的常用字义是褪色，淡出，衰弱。于是如果你读的是简中译本，对于像这样的句子，你会看见它被译作。有些算法被设计成要淡出此类趋势K线，预期大多数将失败。听起来很神秘，有点别扭，对吧？淡出趋势K线无法想当然尔，这到底是代表什么意思？但如果把淡出翻译成看衰，也就是台语或闽南语，两跨虽，瞧不起看扁的意思。那就容易明白了。同样，这段话它是描述区间里的状态。观察任何图表，你会注意到上面充满实体饱满，影线短小的阳线与阴线。每根趋势K线都尝试要突破，但却几乎未能形成趋势，而是使价格继续在区间内震荡。在五分钟的emin,s&p图表上，这样的表现可能代表多空交易程式都在尝试推动市场。而其中有些算法被设计来fade，这些趋势K线预期他们大多数会失败。今年拿到的交易者也时常如此做。搭配前后文呢，来考虑此处的fade应该怎么理解呢？聪明的你可以想象或许更到位的翻译方法就是我说的看衰。意指不看好趋势K线能够造就突破，于是送出反向订单真金白银的投下反对票。既有预期他们失败而盈利。就这个意义而言，你要理解成与突破做对也可以。总之是进行相反方向的交易，押注突破将会失败。","p":"p556"}]},{"t":"para","text":"第一种做法，我称之为看衰突破成功。这在阿尔布鲁克斯的体系里面是有专门的术语的，原文是look to fade。到底是什么意思呢？在交易以外的场合，这个字的常用字义是褪色，淡出，衰弱。于是如果你读的是简中译本，对于像这样的句子，你会看见它被译作。有些算法被设计成要淡出此类趋势K线，预期大多数将失败。听起来很神秘，有点别扭，对吧？淡出趋势K线无法想当然尔，这到底是代表什么意思？但如果把淡出翻译成看衰，也就是台语或闽南语，两跨虽，瞧不起看扁的意思。那就容易明白了。同样，这段话它是描述区间里的状态。观察任何图表，你会注意到上面充满实体饱满，影线短小的阳线与阴线。每根趋势K线都尝试要突破，但却几乎未能形成趋势，而是使价格继续在区间内震荡。在五分钟的emin,s&p图表上，这样的表现可能代表多空交易程式都在尝试推动市场。而其中有些算法被设计来fade，这些趋势K线预期他们大多数会失败。今年拿到的交易者也时常如此做。搭配前后文呢，来考虑此处的fade应该怎么理解呢？聪明的你可以想象或许更到位的翻译方法就是我说的看衰。意指不看好趋势K线能够造就突破，于是送出反向订单真金白银的投下反对票。既有预期他们失败而盈利。就这个意义而言，你要理解成与突破做对也可以。总之是进行相反方向的交易，押注突破将会失败。","pid":"p556"},{"t":"img","src":"assets/img/l15A_261.webp","ilabel":"15-7","icap":"L15　区间交易方法","fid":"fig261","ctx":[{"t":"第一种做法，我称之为看衰突破成功。这在阿尔布鲁克斯的体系里面是有专门的术语的，原文是look to fade。到底是什么意思呢？在交易以外的场合，这个字的常用字义是褪色，淡出，衰弱。于是如果你读的是简中译本，对于像这样的句子，你会看见它被译作。有些算法被设计成要淡出此类趋势K线，预期大多数将失败。听起来很神秘，有点别扭，对吧？淡出趋势K线无法想当然尔，这到底是代表什么意思？但如果把淡出翻译成看衰，也就是台语或闽南语，两跨虽，瞧不起看扁的意思。那就容易明白了。同样，这段话它是描述区间里的状态。观察任何图表，你会注意到上面充满实体饱满，影线短小的阳线与阴线。每根趋势K线都尝试要突破，但却几乎未能形成趋势，而是使价格继续在区间内震荡。在五分钟的emin,s&p图表上，这样的表现可能代表多空交易程式都在尝试推动市场。而其中有些算法被设计来fade，这些趋势K线预期他们大多数会失败。今年拿到的交易者也时常如此做。搭配前后文呢，来考虑此处的fade应该怎么理解呢？聪明的你可以想象或许更到位的翻译方法就是我说的看衰。意指不看好趋势K线能够造就突破，于是送出反向订单真金白银的投下反对票。既有预期他们失败而盈利。就这个意义而言，你要理解成与突破做对也可以。总之是进行相反方向的交易，押注突破将会失败。","p":"p556"},{"t":"关于操作以下有些建议，希望你知悉。首先，既然我们是要看衰突破成功，押注突破失败。那在我们获利的方向上，必定要有充足的空间，整体区间的高度不能够太局限。何以如此？想象一下，如果我们挑选了一个铁丝网来做这件事。看似不无道理，毕竟铁丝网应该也倾向突破失败。可是里头并没有充足的盈利空间。一旦你设法据此入场，想以停止订单，争取1.0倍盈亏比的等距利润。你可能会立即遭遇到，止盈目标裸露在铁丝网对策之外的问题。这就表示你必须押注价格向另一边突破成功，才能成全你押注这一边突破失败的利润。那显然，这就毫无道理。所以我们要找到一个上下边线，距离够远的区间。还有其他条件吗？有的。第二点，我们可能要先有充分的证据表明现在价格处在区间之内。否则要是行情其实处在趋势里，突破实际上倾向成功而非失败，那么我们逆向押注的做法。也会变得像是在送钱给对手方，当然是万万不可。所以这时候就需要你回忆起第六单元谈过界定区间的方法了。以80根K线的日内交易来说，最好这个区间持续超过20根K线以上并且有过对原趋势极值以及第一推回调机制双双突破失败的证据。以四点上下各两点一线来将区间的上下缘划定出来。此间这个突破失败要过冲持平还是不及都可以，当然还是按你的风格来决定。没有定规。只不过晚些时候进行示范时，我还是大多会挑选比较保守的方案。先知道如何紧，再去考虑如何松，一开始就太不拘小节，并不利于我们把交易做好。","p":"p557"}]},{"t":"para","text":"关于操作以下有些建议，希望你知悉。首先，既然我们是要看衰突破成功，押注突破失败。那在我们获利的方向上，必定要有充足的空间，整体区间的高度不能够太局限。何以如此？想象一下，如果我们挑选了一个铁丝网来做这件事。看似不无道理，毕竟铁丝网应该也倾向突破失败。可是里头并没有充足的盈利空间。一旦你设法据此入场，想以停止订单，争取1.0倍盈亏比的等距利润。你可能会立即遭遇到，止盈目标裸露在铁丝网对策之外的问题。这就表示你必须押注价格向另一边突破成功，才能成全你押注这一边突破失败的利润。那显然，这就毫无道理。所以我们要找到一个上下边线，距离够远的区间。还有其他条件吗？有的。第二点，我们可能要先有充分的证据表明现在价格处在区间之内。否则要是行情其实处在趋势里，突破实际上倾向成功而非失败，那么我们逆向押注的做法。也会变得像是在送钱给对手方，当然是万万不可。所以这时候就需要你回忆起第六单元谈过界定区间的方法了。以80根K线的日内交易来说，最好这个区间持续超过20根K线以上并且有过对原趋势极值以及第一推回调机制双双突破失败的证据。以四点上下各两点一线来将区间的上下缘划定出来。此间这个突破失败要过冲持平还是不及都可以，当然还是按你的风格来决定。没有定规。只不过晚些时候进行示范时，我还是大多会挑选比较保守的方案。先知道如何紧，再去考虑如何松，一开始就太不拘小节，并不利于我们把交易做好。","pid":"p557"},{"t":"img","src":"assets/img/l15A_262.webp","ilabel":"15-8","icap":"L15　区间交易方法","fid":"fig262","ctx":[{"t":"关于操作以下有些建议，希望你知悉。首先，既然我们是要看衰突破成功，押注突破失败。那在我们获利的方向上，必定要有充足的空间，整体区间的高度不能够太局限。何以如此？想象一下，如果我们挑选了一个铁丝网来做这件事。看似不无道理，毕竟铁丝网应该也倾向突破失败。可是里头并没有充足的盈利空间。一旦你设法据此入场，想以停止订单，争取1.0倍盈亏比的等距利润。你可能会立即遭遇到，止盈目标裸露在铁丝网对策之外的问题。这就表示你必须押注价格向另一边突破成功，才能成全你押注这一边突破失败的利润。那显然，这就毫无道理。所以我们要找到一个上下边线，距离够远的区间。还有其他条件吗？有的。第二点，我们可能要先有充分的证据表明现在价格处在区间之内。否则要是行情其实处在趋势里，突破实际上倾向成功而非失败，那么我们逆向押注的做法。也会变得像是在送钱给对手方，当然是万万不可。所以这时候就需要你回忆起第六单元谈过界定区间的方法了。以80根K线的日内交易来说，最好这个区间持续超过20根K线以上并且有过对原趋势极值以及第一推回调机制双双突破失败的证据。以四点上下各两点一线来将区间的上下缘划定出来。此间这个突破失败要过冲持平还是不及都可以，当然还是按你的风格来决定。没有定规。只不过晚些时候进行示范时，我还是大多会挑选比较保守的方案。先知道如何紧，再去考虑如何松，一开始就太不拘小节，并不利于我们把交易做好。","p":"p557"},{"t":"对于高度与持续时间两个维度，我们都已经意识到，必须要有要求。接着我们就可以更详谈操作的细节。我想透过例子来说明会更清楚。在画面中，这个交易日里，我们看到的是一个倾斜向下的三推楔形底牛旗，低点不断递进。但突破都以失败告终。于是，当大阳线产生可能会吸引多头交易者，以高一入场或者在收线时市价买进。只不过下一根K线居然没有跟进，就导致部分多头被套，而需要在后面的连续下跌中赶紧止损离场。遂此，演变为对失败牛旗的通道线突破，造就了基于形态高度的等距运动。肉眼可见的是，突破后测试突破点，并走出第二推运动。接着，价格出现了阳线放大的急涨。推估原因，应当是认为下跌趋势可能因等距抵达而启动反转的多头机构选择不停追进，因而造就的急速。急速越过前面的波段点后，甚至测试了一下，然后开始怠速上行。最终走成了小小的三推楔形顶，进入回调。回调前往的对象，除了是这根隐含回调K线的低点，也是50%回调处。对于可以接受隐含回调为双重低左峰且愿意无视前方有反复的磁体，这上方盘旋的激进交易者。可能会愿意在这里入场。虽然我们这个单元探讨的是区间交易方法。但这种旗型回调交易机会，大家应该还记忆犹新。很快，我们就会看到这笔交易的结局。马上又是一段上涨。如果方才买进，止盈在原趋势极值，那就已经成功落袋为安。只不过到位以后，阳线并没有继续上破，反而是收的阴线节点下跌。直到再次测试方才回调的底部，再同样失去空头动能。此际区间的条件就其实俱全了。对原趋势极值突破失败，也对回调极值突破失败。你也可以于此采用最外侧的顶点作为锚钉区间边线的价位。至此，保守双重底交易者的交易讯号可能也被触发了。这里依然是上涨以来的50%回调处，还有对前方第一推回调的失败突破。高一买进自然有其道理。不过，如果你明确的规定自己做的是在区间内看衰突破的交易，那我们应该要等到下一次。在我对边线测试后折返的迹象时才入场。换句话说，如果方才锚定区间边线的分别是点一二三四。那我们要等待再次触及上下缘的点五，才选择出手。在这个例子里面，我们看到的是上涨，在后来出现，但同样又在区间上缘的地方收出内包的趋势阴线。让低一做空的看衰突破交易者有机可趁。止损应该如何设置呢？放在序号K线，也就是目前的区间边线之外。另一边的止盈则在区间的中轴处。入场不久成功止盈。直到下方又出现突破失败迹象，则在高一做多。同样的止损与止盈方案也能够令我们干净利落的获利出场。","p":"p558"}]},{"t":"para","text":"对于高度与持续时间两个维度，我们都已经意识到，必须要有要求。接着我们就可以更详谈操作的细节。我想透过例子来说明会更清楚。在画面中，这个交易日里，我们看到的是一个倾斜向下的三推楔形底牛旗，低点不断递进。但突破都以失败告终。于是，当大阳线产生可能会吸引多头交易者，以高一入场或者在收线时市价买进。只不过下一根K线居然没有跟进，就导致部分多头被套，而需要在后面的连续下跌中赶紧止损离场。遂此，演变为对失败牛旗的通道线突破，造就了基于形态高度的等距运动。肉眼可见的是，突破后测试突破点，并走出第二推运动。接着，价格出现了阳线放大的急涨。推估原因，应当是认为下跌趋势可能因等距抵达而启动反转的多头机构选择不停追进，因而造就的急速。急速越过前面的波段点后，甚至测试了一下，然后开始怠速上行。最终走成了小小的三推楔形顶，进入回调。回调前往的对象，除了是这根隐含回调K线的低点，也是50%回调处。对于可以接受隐含回调为双重低左峰且愿意无视前方有反复的磁体，这上方盘旋的激进交易者。可能会愿意在这里入场。虽然我们这个单元探讨的是区间交易方法。但这种旗型回调交易机会，大家应该还记忆犹新。很快，我们就会看到这笔交易的结局。马上又是一段上涨。如果方才买进，止盈在原趋势极值，那就已经成功落袋为安。只不过到位以后，阳线并没有继续上破，反而是收的阴线节点下跌。直到再次测试方才回调的底部，再同样失去空头动能。此际区间的条件就其实俱全了。对原趋势极值突破失败，也对回调极值突破失败。你也可以于此采用最外侧的顶点作为锚钉区间边线的价位。至此，保守双重底交易者的交易讯号可能也被触发了。这里依然是上涨以来的50%回调处，还有对前方第一推回调的失败突破。高一买进自然有其道理。不过，如果你明确的规定自己做的是在区间内看衰突破的交易，那我们应该要等到下一次。在我对边线测试后折返的迹象时才入场。换句话说，如果方才锚定区间边线的分别是点一二三四。那我们要等待再次触及上下缘的点五，才选择出手。在这个例子里面，我们看到的是上涨，在后来出现，但同样又在区间上缘的地方收出内包的趋势阴线。让低一做空的看衰突破交易者有机可趁。止损应该如何设置呢？放在序号K线，也就是目前的区间边线之外。另一边的止盈则在区间的中轴处。入场不久成功止盈。直到下方又出现突破失败迹象，则在高一做多。同样的止损与止盈方案也能够令我们干净利落的获利出场。","pid":"p558"},{"t":"img","src":"assets/img/l15A_263.webp","ilabel":"15-9","icap":"L15　区间交易方法","fid":"fig263","ctx":[{"t":"对于高度与持续时间两个维度，我们都已经意识到，必须要有要求。接着我们就可以更详谈操作的细节。我想透过例子来说明会更清楚。在画面中，这个交易日里，我们看到的是一个倾斜向下的三推楔形底牛旗，低点不断递进。但突破都以失败告终。于是，当大阳线产生可能会吸引多头交易者，以高一入场或者在收线时市价买进。只不过下一根K线居然没有跟进，就导致部分多头被套，而需要在后面的连续下跌中赶紧止损离场。遂此，演变为对失败牛旗的通道线突破，造就了基于形态高度的等距运动。肉眼可见的是，突破后测试突破点，并走出第二推运动。接着，价格出现了阳线放大的急涨。推估原因，应当是认为下跌趋势可能因等距抵达而启动反转的多头机构选择不停追进，因而造就的急速。急速越过前面的波段点后，甚至测试了一下，然后开始怠速上行。最终走成了小小的三推楔形顶，进入回调。回调前往的对象，除了是这根隐含回调K线的低点，也是50%回调处。对于可以接受隐含回调为双重低左峰且愿意无视前方有反复的磁体，这上方盘旋的激进交易者。可能会愿意在这里入场。虽然我们这个单元探讨的是区间交易方法。但这种旗型回调交易机会，大家应该还记忆犹新。很快，我们就会看到这笔交易的结局。马上又是一段上涨。如果方才买进，止盈在原趋势极值，那就已经成功落袋为安。只不过到位以后，阳线并没有继续上破，反而是收的阴线节点下跌。直到再次测试方才回调的底部，再同样失去空头动能。此际区间的条件就其实俱全了。对原趋势极值突破失败，也对回调极值突破失败。你也可以于此采用最外侧的顶点作为锚钉区间边线的价位。至此，保守双重底交易者的交易讯号可能也被触发了。这里依然是上涨以来的50%回调处，还有对前方第一推回调的失败突破。高一买进自然有其道理。不过，如果你明确的规定自己做的是在区间内看衰突破的交易，那我们应该要等到下一次。在我对边线测试后折返的迹象时才入场。换句话说，如果方才锚定区间边线的分别是点一二三四。那我们要等待再次触及上下缘的点五，才选择出手。在这个例子里面，我们看到的是上涨，在后来出现，但同样又在区间上缘的地方收出内包的趋势阴线。让低一做空的看衰突破交易者有机可趁。止损应该如何设置呢？放在序号K线，也就是目前的区间边线之外。另一边的止盈则在区间的中轴处。入场不久成功止盈。直到下方又出现突破失败迹象，则在高一做多。同样的止损与止盈方案也能够令我们干净利落的获利出场。","p":"p558"},{"t":"接着我们回到对止损与止盈摆放的讨论。对于画面可能没有办法摆下原本的例子与文字，所以我换了一个类似的事例。你可能问为什么止损在区间边线之外？为什么止盈直到中轴？这些是唯一的方案吗？当然不是的。只是这么做都有其价格行为的道理。你可以在明白个中缘由之后，依照自己的风格爱好进行调整。如果在区间顶部的此处，我们以第一做空去将止损放在上一个重要波段点之外，那这不见得会是一次有效的止损。理由是当价格越过了锚定区间边线的讯号K线高点。那有可能已经创造出收在突破点之外的连续两根阳线。前者为突破，后者为跟进。那么，这种理论上已经是突破成功，往上面一个磁体进发并过冲它会是很可能发生的事情。你可以看出来，这就跟我们看衰突破失败，交易理由已经有冲突之嫌。那当然，有没有可能价格不以突破成功后还有跟进的形式抵达上方就接续折返，使这变成看起来像是个有效的止损呢。的确也有这样的可能性。不过，要是发展到那个程度，在我看来会更像是一个测试前波段点不及的楔形顶反转行情。这么说来，它就变成在一个更宽泛的潜在区间脉络之中，以中观的楔形顶反转形态入场做空。却提前入场在一个很糟糕，盈亏比很差的位置。而非在顶部却只看到多头衰落的迹象以后才介入。如此做，就很难说是以这个灰蓝色阴影区作为区间的范畴交易看衰突破。你实际上容忍的波动范畴已经太过广泛。不过说是这么说，你想要那样放置止损当然也是可以。那就形同你同样是在交易区间，只是你的区间定义比较松一点，你允许这个区间发展为宽幅通道所交易的是对倾斜区间看衰突破。说到这里，你可能再一次感受到怎么做，其实都可能有道理。但简易起见，要是你已经觉得混乱，刚才建议止损在区间边线外，就会是最单纯的做法。而如果你已经清楚知晓自己就是想要把标准放得宽松，用更宽的止损，也就是更差的盈亏比，去换更高的胜率。容许行情变成其他的状态，那当然也没有问题。想清楚，知道如何成就自己所想要的东西，这就很好，我绝无劝阻你的理由。这里请容我稍微岔题再多嘴一下。有交易者可能疑问，如果是在区间边线或者任何合乎价格行为理据的位置之外，放置止损。那具体是要多么的外？是一个最小报价单位就好，还是要两个，三个，五个，十个？同样，你可以自由决定，但千万不要无限上冈。还希望放的稍微外面一点点，想必是因为交易者担心过冲的可能性。触发止损后，把建好的仓位给扫了，才朝着预想的方向前进。不过，一旦我们放上止损，那就是在画上一条界限。你不可能不画线，因为你的止损就是需要一个具体的价位。但是由于有价格恰巧出现，让你被迫出场的可能。你这一次紧贴讯号K线被触及，于是你往外放一个最小报价单位。但是下次可能还是会再来就过中一咪咪才又折返。如果你想要再更外一点，但难道三个报价单位就永保清扫不会发生了吗？不可能的。如此节节败退的结果就是不断的用过宽的，没有什么价格行为理由的安全距离来换更高的胜率。这是没有意义的做法。所以以e mini，s&p为例，哈尔布鲁克斯通常会说，你可以就放在其外一个最少报价单位的地方。通常价格起码得要至少越过讯号K线高点，到第二个报价单位才会真正触发你的止损。你要是不放心，再让一两个最小爆炸单位也行吧？如果真能够为你的心安买个保险。有时候心情平稳，做起来放心，能够让交易者表现更好。但事实上，按阿尔布鲁克斯的办法来做就足够了。如果是Emini s&p以外的品种，则可以按照该品种的波动程度稍微做一下等比例的换算。但总之，不需要让步太多，有时候多给的都会是白给。总之，止损放在区间边线之外，会是最通用的简单方法。而聊会止盈则考虑在区间中轴离场。如此做道理，在于中轴理论上是均衡地带。多空在此处，预计等距利润的胜率应为50%。这也就是说，如果你是在上方做空。那一旦越过区间中段，就反而变成多头可能愿意入场。持仓越远，就越不利于获胜。不过说必须只能在中轴处止盈，又有点太决绝。因为多头也不见得会在中轴就立即进入。越是靠下入场，对他们也就是你的对手来说会越有利。所以我想在抵达区间下三分之一以前离场，各位是可以接受的做法。而若你更加保守，回到中轴就离场，当然也可以。因此，总归来说，止盈可以在中轴处。但围绕中轴区间中段的三分之一都将可行。也就是回调区间宽度的33%到66%都会是合理的指引区段。应该按照风险爱好自由决定。此后示范，我都以止损在区间边线外，持仓到中轴为方案。","p":"p559"}]},{"t":"para","text":"接着我们回到对止损与止盈摆放的讨论。对于画面可能没有办法摆下原本的例子与文字，所以我换了一个类似的事例。你可能问为什么止损在区间边线之外？为什么止盈直到中轴？这些是唯一的方案吗？当然不是的。只是这么做都有其价格行为的道理。你可以在明白个中缘由之后，依照自己的风格爱好进行调整。如果在区间顶部的此处，我们以第一做空去将止损放在上一个重要波段点之外，那这不见得会是一次有效的止损。理由是当价格越过了锚定区间边线的讯号K线高点。那有可能已经创造出收在突破点之外的连续两根阳线。前者为突破，后者为跟进。那么，这种理论上已经是突破成功，往上面一个磁体进发并过冲它会是很可能发生的事情。你可以看出来，这就跟我们看衰突破失败，交易理由已经有冲突之嫌。那当然，有没有可能价格不以突破成功后还有跟进的形式抵达上方就接续折返，使这变成看起来像是个有效的止损呢。的确也有这样的可能性。不过，要是发展到那个程度，在我看来会更像是一个测试前波段点不及的楔形顶反转行情。这么说来，它就变成在一个更宽泛的潜在区间脉络之中，以中观的楔形顶反转形态入场做空。却提前入场在一个很糟糕，盈亏比很差的位置。而非在顶部却只看到多头衰落的迹象以后才介入。如此做，就很难说是以这个灰蓝色阴影区作为区间的范畴交易看衰突破。你实际上容忍的波动范畴已经太过广泛。不过说是这么说，你想要那样放置止损当然也是可以。那就形同你同样是在交易区间，只是你的区间定义比较松一点，你允许这个区间发展为宽幅通道所交易的是对倾斜区间看衰突破。说到这里，你可能再一次感受到怎么做，其实都可能有道理。但简易起见，要是你已经觉得混乱，刚才建议止损在区间边线外，就会是最单纯的做法。而如果你已经清楚知晓自己就是想要把标准放得宽松，用更宽的止损，也就是更差的盈亏比，去换更高的胜率。容许行情变成其他的状态，那当然也没有问题。想清楚，知道如何成就自己所想要的东西，这就很好，我绝无劝阻你的理由。这里请容我稍微岔题再多嘴一下。有交易者可能疑问，如果是在区间边线或者任何合乎价格行为理据的位置之外，放置止损。那具体是要多么的外？是一个最小报价单位就好，还是要两个，三个，五个，十个？同样，你可以自由决定，但千万不要无限上冈。还希望放的稍微外面一点点，想必是因为交易者担心过冲的可能性。触发止损后，把建好的仓位给扫了，才朝着预想的方向前进。不过，一旦我们放上止损，那就是在画上一条界限。你不可能不画线，因为你的止损就是需要一个具体的价位。但是由于有价格恰巧出现，让你被迫出场的可能。你这一次紧贴讯号K线被触及，于是你往外放一个最小报价单位。但是下次可能还是会再来就过中一咪咪才又折返。如果你想要再更外一点，但难道三个报价单位就永保清扫不会发生了吗？不可能的。如此节节败退的结果就是不断的用过宽的，没有什么价格行为理由的安全距离来换更高的胜率。这是没有意义的做法。所以以e mini，s&p为例，哈尔布鲁克斯通常会说，你可以就放在其外一个最少报价单位的地方。通常价格起码得要至少越过讯号K线高点，到第二个报价单位才会真正触发你的止损。你要是不放心，再让一两个最小爆炸单位也行吧？如果真能够为你的心安买个保险。有时候心情平稳，做起来放心，能够让交易者表现更好。但事实上，按阿尔布鲁克斯的办法来做就足够了。如果是Emini s&p以外的品种，则可以按照该品种的波动程度稍微做一下等比例的换算。但总之，不需要让步太多，有时候多给的都会是白给。总之，止损放在区间边线之外，会是最通用的简单方法。而聊会止盈则考虑在区间中轴离场。如此做道理，在于中轴理论上是均衡地带。多空在此处，预计等距利润的胜率应为50%。这也就是说，如果你是在上方做空。那一旦越过区间中段，就反而变成多头可能愿意入场。持仓越远，就越不利于获胜。不过说必须只能在中轴处止盈，又有点太决绝。因为多头也不见得会在中轴就立即进入。越是靠下入场，对他们也就是你的对手来说会越有利。所以我想在抵达区间下三分之一以前离场，各位是可以接受的做法。而若你更加保守，回到中轴就离场，当然也可以。因此，总归来说，止盈可以在中轴处。但围绕中轴区间中段的三分之一都将可行。也就是回调区间宽度的33%到66%都会是合理的指引区段。应该按照风险爱好自由决定。此后示范，我都以止损在区间边线外，持仓到中轴为方案。","pid":"p559"},{"t":"img","src":"assets/img/l15A_264.webp","ilabel":"15-10","icap":"L15　区间交易方法","fid":"fig264","ctx":[{"t":"接着我们回到对止损与止盈摆放的讨论。对于画面可能没有办法摆下原本的例子与文字，所以我换了一个类似的事例。你可能问为什么止损在区间边线之外？为什么止盈直到中轴？这些是唯一的方案吗？当然不是的。只是这么做都有其价格行为的道理。你可以在明白个中缘由之后，依照自己的风格爱好进行调整。如果在区间顶部的此处，我们以第一做空去将止损放在上一个重要波段点之外，那这不见得会是一次有效的止损。理由是当价格越过了锚定区间边线的讯号K线高点。那有可能已经创造出收在突破点之外的连续两根阳线。前者为突破，后者为跟进。那么，这种理论上已经是突破成功，往上面一个磁体进发并过冲它会是很可能发生的事情。你可以看出来，这就跟我们看衰突破失败，交易理由已经有冲突之嫌。那当然，有没有可能价格不以突破成功后还有跟进的形式抵达上方就接续折返，使这变成看起来像是个有效的止损呢。的确也有这样的可能性。不过，要是发展到那个程度，在我看来会更像是一个测试前波段点不及的楔形顶反转行情。这么说来，它就变成在一个更宽泛的潜在区间脉络之中，以中观的楔形顶反转形态入场做空。却提前入场在一个很糟糕，盈亏比很差的位置。而非在顶部却只看到多头衰落的迹象以后才介入。如此做，就很难说是以这个灰蓝色阴影区作为区间的范畴交易看衰突破。你实际上容忍的波动范畴已经太过广泛。不过说是这么说，你想要那样放置止损当然也是可以。那就形同你同样是在交易区间，只是你的区间定义比较松一点，你允许这个区间发展为宽幅通道所交易的是对倾斜区间看衰突破。说到这里，你可能再一次感受到怎么做，其实都可能有道理。但简易起见，要是你已经觉得混乱，刚才建议止损在区间边线外，就会是最单纯的做法。而如果你已经清楚知晓自己就是想要把标准放得宽松，用更宽的止损，也就是更差的盈亏比，去换更高的胜率。容许行情变成其他的状态，那当然也没有问题。想清楚，知道如何成就自己所想要的东西，这就很好，我绝无劝阻你的理由。这里请容我稍微岔题再多嘴一下。有交易者可能疑问，如果是在区间边线或者任何合乎价格行为理据的位置之外，放置止损。那具体是要多么的外？是一个最小报价单位就好，还是要两个，三个，五个，十个？同样，你可以自由决定，但千万不要无限上冈。还希望放的稍微外面一点点，想必是因为交易者担心过冲的可能性。触发止损后，把建好的仓位给扫了，才朝着预想的方向前进。不过，一旦我们放上止损，那就是在画上一条界限。你不可能不画线，因为你的止损就是需要一个具体的价位。但是由于有价格恰巧出现，让你被迫出场的可能。你这一次紧贴讯号K线被触及，于是你往外放一个最小报价单位。但是下次可能还是会再来就过中一咪咪才又折返。如果你想要再更外一点，但难道三个报价单位就永保清扫不会发生了吗？不可能的。如此节节败退的结果就是不断的用过宽的，没有什么价格行为理由的安全距离来换更高的胜率。这是没有意义的做法。所以以e mini，s&p为例，哈尔布鲁克斯通常会说，你可以就放在其外一个最少报价单位的地方。通常价格起码得要至少越过讯号K线高点，到第二个报价单位才会真正触发你的止损。你要是不放心，再让一两个最小爆炸单位也行吧？如果真能够为你的心安买个保险。有时候心情平稳，做起来放心，能够让交易者表现更好。但事实上，按阿尔布鲁克斯的办法来做就足够了。如果是Emini s&p以外的品种，则可以按照该品种的波动程度稍微做一下等比例的换算。但总之，不需要让步太多，有时候多给的都会是白给。总之，止损放在区间边线之外，会是最通用的简单方法。而聊会止盈则考虑在区间中轴离场。如此做道理，在于中轴理论上是均衡地带。多空在此处，预计等距利润的胜率应为50%。这也就是说，如果你是在上方做空。那一旦越过区间中段，就反而变成多头可能愿意入场。持仓越远，就越不利于获胜。不过说必须只能在中轴处止盈，又有点太决绝。因为多头也不见得会在中轴就立即进入。越是靠下入场，对他们也就是你的对手来说会越有利。所以我想在抵达区间下三分之一以前离场，各位是可以接受的做法。而若你更加保守，回到中轴就离场，当然也可以。因此，总归来说，止盈可以在中轴处。但围绕中轴区间中段的三分之一都将可行。也就是回调区间宽度的33%到66%都会是合理的指引区段。应该按照风险爱好自由决定。此后示范，我都以止损在区间边线外，持仓到中轴为方案。","p":"p559"},{"t":"另一个例子，我们看到窄幅区间有效下破，急速并回调后走出下破两次失败的三推楔形底，成就等距的急速与通道组合。当价格开始折返上涨，走出的同样是二推的等距运动，第二推可以拆分为两小推。最终截止在通道起点。对于那些还有意做空的顺势价值交易者而言，这是个精巧的双重底。不过，作为看衰突破的区间交易者，我们关注的是急速转入通道，再转入区间的可能性。正等待着对原趋势极值以及对回调极值的双双突破失败。例子里也确实都接连发生了。我们也就可以选定最外侧的价格，锚定区间边线。你或许问太妃，这个对回调测试不及，区间也可以借此确定下来吗？同样看你的标准，严格或宽松。最保守的区间交易者或许会希望两边都至少出现。居中者会至少要求一边。最大胆的交易者则认为，尽管收敛也可能无所谓。有了此例，正好供你思考标准，可以仔细考虑后决定采取哪一种方案。之后我看见价格又晃动到上缘，给了低一的交易机会。只可惜入场没有多久就被另一只长上影线触发离场。此际你或许有理由思考，这看起来像是一个二，三推极值重叠在区间上缘的小小楔形顶。收出阴线或将代表多头疲弱，能不能再尝试一次做空呢？这也同样提醒你，在撰写规则的时候，可以考虑是否在止损后还介入低二的交易机会。如果愿意，那么你会在下一根阴线被触发进场，并最终顺利止盈。直到这张图表结束，区间都还没有突破，印证了市场更爱好均衡的道理。","p":"p560"}]},{"t":"para","text":"另一个例子，我们看到窄幅区间有效下破，急速并回调后走出下破两次失败的三推楔形底，成就等距的急速与通道组合。当价格开始折返上涨，走出的同样是二推的等距运动，第二推可以拆分为两小推。最终截止在通道起点。对于那些还有意做空的顺势价值交易者而言，这是个精巧的双重底。不过，作为看衰突破的区间交易者，我们关注的是急速转入通道，再转入区间的可能性。正等待着对原趋势极值以及对回调极值的双双突破失败。例子里也确实都接连发生了。我们也就可以选定最外侧的价格，锚定区间边线。你或许问太妃，这个对回调测试不及，区间也可以借此确定下来吗？同样看你的标准，严格或宽松。最保守的区间交易者或许会希望两边都至少出现。居中者会至少要求一边。最大胆的交易者则认为，尽管收敛也可能无所谓。有了此例，正好供你思考标准，可以仔细考虑后决定采取哪一种方案。之后我看见价格又晃动到上缘，给了低一的交易机会。只可惜入场没有多久就被另一只长上影线触发离场。此际你或许有理由思考，这看起来像是一个二，三推极值重叠在区间上缘的小小楔形顶。收出阴线或将代表多头疲弱，能不能再尝试一次做空呢？这也同样提醒你，在撰写规则的时候，可以考虑是否在止损后还介入低二的交易机会。如果愿意，那么你会在下一根阴线被触发进场，并最终顺利止盈。直到这张图表结束，区间都还没有突破，印证了市场更爱好均衡的道理。","pid":"p560"}],"wcount":7718},{"id":"l15B","title":"第B段　区间交易方法","blocks":[{"t":"para","text":"L15B 区间交易方法","pid":"p561"},{"t":"para","text":"第二种建仓形态，我称之为急赴磁体。","pid":"p562"},{"t":"img","src":"assets/img/l15B_265.webp","ilabel":"15-11","icap":"L15　区间交易方法","fid":"fig265","ctx":[{"t":"L15B 区间交易方法","p":"p561"},{"t":"第二种建仓形态，我称之为急赴磁体。","p":"p562"},{"t":"相信你已经大概认识太妃知道我的个性是绝无矜功自伐的意思。不过如果我没有漏读或者忘掉的话，这应该是我独立发展出来的做法。顾名思义，这种建仓方案是希望捕捉价格快速前赴某个磁体的利润。结合第六，第九单元的知识，我们知道磁体对价格能够产生吸附力，磁体往往是价格所要前往测试的对象。以及由于真空效应越是接近，价格越有加速运动，高几率至少触碰磁体的倾向。这将带给我们相对具有确定性的利润。这也就是说，当价格在区间中运动并逐渐趋近区间边线。是否在看衰其突破成功以前，我们还有顺着动能方向再剥一点头皮的空间呢。答案是肯定的。我们旋即见几个例子来谈谈这种做法。","p":"p563"},{"t":"在这张图表里，我们很明确看见一轮急速下跌，进入横向的调整。当然，你可以说这是双重顶的交易机会，在第一推回调再次被突破失败时，低一做空。但同时，这也是一个横向的区间。当低一发生而阴线后紧接回调，区间交易者可以如何做呢？等待下跌恢复，逼近区间下缘时，考虑以急赴磁体的理由做空。重新调用先前以及方才为你复习过的知识，区间中常有第二推陷阱，且当看见接连的趋势K线。运动路径上的磁体可能会被就近测试。如此一来，一个剥头皮的短单就是可以考虑的。毕竟我们也不押注突破，到位之后，就会认份离开。你将发现后一根K线并不意外的是另一根趋势阴线，触及区间下缘。具体如何做？","p":"p564"}]},{"t":"para","text":"相信你已经大概认识太妃知道我的个性是绝无矜功自伐的意思。不过如果我没有漏读或者忘掉的话，这应该是我独立发展出来的做法。顾名思义，这种建仓方案是希望捕捉价格快速前赴某个磁体的利润。结合第六，第九单元的知识，我们知道磁体对价格能够产生吸附力，磁体往往是价格所要前往测试的对象。以及由于真空效应越是接近，价格越有加速运动，高几率至少触碰磁体的倾向。这将带给我们相对具有确定性的利润。这也就是说，当价格在区间中运动并逐渐趋近区间边线。是否在看衰其突破成功以前，我们还有顺着动能方向再剥一点头皮的空间呢。答案是肯定的。我们旋即见几个例子来谈谈这种做法。","pid":"p563"},{"t":"para","text":"在这张图表里，我们很明确看见一轮急速下跌，进入横向的调整。当然，你可以说这是双重顶的交易机会，在第一推回调再次被突破失败时，低一做空。但同时，这也是一个横向的区间。当低一发生而阴线后紧接回调，区间交易者可以如何做呢？等待下跌恢复，逼近区间下缘时，考虑以急赴磁体的理由做空。重新调用先前以及方才为你复习过的知识，区间中常有第二推陷阱，且当看见接连的趋势K线。运动路径上的磁体可能会被就近测试。如此一来，一个剥头皮的短单就是可以考虑的。毕竟我们也不押注突破，到位之后，就会认份离开。你将发现后一根K线并不意外的是另一根趋势阴线，触及区间下缘。具体如何做？","pid":"p564"},{"t":"img","src":"assets/img/l15B_266.webp","ilabel":"15-12","icap":"L15　区间交易方法","fid":"fig266","ctx":[{"t":"相信你已经大概认识太妃知道我的个性是绝无矜功自伐的意思。不过如果我没有漏读或者忘掉的话，这应该是我独立发展出来的做法。顾名思义，这种建仓方案是希望捕捉价格快速前赴某个磁体的利润。结合第六，第九单元的知识，我们知道磁体对价格能够产生吸附力，磁体往往是价格所要前往测试的对象。以及由于真空效应越是接近，价格越有加速运动，高几率至少触碰磁体的倾向。这将带给我们相对具有确定性的利润。这也就是说，当价格在区间中运动并逐渐趋近区间边线。是否在看衰其突破成功以前，我们还有顺着动能方向再剥一点头皮的空间呢。答案是肯定的。我们旋即见几个例子来谈谈这种做法。","p":"p563"},{"t":"在这张图表里，我们很明确看见一轮急速下跌，进入横向的调整。当然，你可以说这是双重顶的交易机会，在第一推回调再次被突破失败时，低一做空。但同时，这也是一个横向的区间。当低一发生而阴线后紧接回调，区间交易者可以如何做呢？等待下跌恢复，逼近区间下缘时，考虑以急赴磁体的理由做空。重新调用先前以及方才为你复习过的知识，区间中常有第二推陷阱，且当看见接连的趋势K线。运动路径上的磁体可能会被就近测试。如此一来，一个剥头皮的短单就是可以考虑的。毕竟我们也不押注突破，到位之后，就会认份离开。你将发现后一根K线并不意外的是另一根趋势阴线，触及区间下缘。具体如何做？","p":"p564"},{"t":"我的习惯如下：首先，我们要确保距离区间边线已经足够近。价格运动到了磁体的磁力能够发挥作用的射程里头。具体的参数因人而异。而我会丈量区间的高度，并在价格距离边线仅剩下四分之一区间幅度时考虑入场。以此为例，由低至高，若下缘为零，上缘为一，则当价格进到黑线以下，就符合我的条件。保守者可以部署停止订单，在针尖被下破后才进入。止损置于前一个次级波段点或者区间上缘之外。止盈这就当然安放在目标磁体或者你眼看实体已经收在黑线之下，则在收线之际市价入场，旋即就能够争取到这个短小的利润。理解流程后，接着我们把目光放到随后的另一个区间。如果我们谨守“区间应有一次对原趋势极值”“以及一次对回调极值的失败突破”，这样的规定。则区间应该成立在这根阳线收线之后。接着下一根阳线，则是另一根趋势K线。同时，又逼近了区间上缘。进入了我所要求的25%射程。仔细计较的话，实体并未收在黑线之上，只是影线穿透了。那保守起见，我会使用停止订单，在高点再次被突破后入场。如此做，我们就再度以不甚美观的盈亏比完成了一笔高胜率的剥头皮交易。对这张图，我们也来做一点补充。有时候价格运动得太快，让我们错失以此方法入场的机会，这时候我们可能就只好摸摸鼻子算了。以此为例，随后的两根趋势阴线，后者触及区间下缘，确实也是急赴磁体的表现。不过，在越过门槛的同时，该K线也旋即抵达磁体，没有给到我们部署订单的机会。这时候你也许会问，那我何必等待价格收线在四分之一区间幅度的门槛附近？直接挂上订单，在我们拉好的界限不就可以赚到这波利润了吗？似乎有一点道理，但这么做的风险在于可能规避不了这种情况。事前挂上的订单被触发，但旋即折返，最后以亏损做结。请别误会，我不是说确定收现在门槛附近才入场，就必定能够止盈。价格运动到距离边线的位置够近是一件好事，不过够近可能还不够。既然这个建仓方案的名称是急赴磁体，那么运动的“急”我们看见朝向利己方向的趋势K线接踵而来。当然，这代表运动的动能大小斜率连续性都不错，能够提供我们更多的数学优势。这种不幸的针尖，其实这代表动能表现不是最理想。提前押注就可能将这种亏损的可能性也包纳进来。你可以再多加考虑是否要如此做。除此之外，剩下四分之一区间幅度的参数是硬性的规定吗？当然也不是的，你可以依照自己的风格爱好调整。不过我不建议放得太宽。比如，在区间中轴50%的位置就入场，那肯定太远了。中轴是均衡的地带，距离边线还有二分之一区间高度那么远。那肯定还会进到磁体的磁力场里面。我想三分之一应该会是最宽的限度，但距离越近，盈亏比会越差，理应赢胜率就会越高。你可以按照风格进行适当的甄选。如果不知道如何下手，则考虑选用跟我相同的25%即可。另一个问题是，太妃刚刚这根下影线触及了磁体，但后面又收了一根内包阴线。你看它收线的位置，又已经在黑线之下，我能不能在此时市价入场？这种时候依我的操作习惯是不会介入的。原因是磁体刚刚已经触及，这时候受内包K线并不一定能够引发又一次的下跌。你得要斟酌一下。最不利的情况就是如图所示，其实触及磁体的针尖就已经是反转的开始。内包以后开始慢慢转为向上，然后陷入区间典型的纠结之中。愿意不那么保守的交易者，可能会接受当价格转高，暂时远离磁体，大致至少晃到中轴附近。但又再度趋近磁体时，才以停止订单突破入场。那么，进场点就会设置在该折返低点被重新下破的时候。同样争取一个到区间底部的短打利润。","p":"p565"},{"t":"接着我们再看看下一个例子。在这个交易日里，我会稍稍放宽对区间界定，应有一次对原趋势极值以及一次对回调极值的失败突破的严格标准。展示只要距离磁体足够接近，就容易有朝向磁体吸附的运动惯性。首先，价格在开盘没多久就展现出了显著的双边交易性格。截至当前，看起来像是一个三推的楔形顶。其通道线与开盘的第一根K线高点受阻。随后，受了内包阳线之后出现趋势阴线下跌。并在两小推的上涨结束后，又被接连的阴线所吞没，价格有向下进发的意思。不过，当价格运动至此，其实交易者是没有足够的信心，认为后续能够接续下跌的。毕竟趋势线可以不停放缓，直到在此处以更窄幅区间的形式向右运动。这里也确实有过屡屡撑起的历史。但是楔形顶与对决线又给到下跌的理由。这两根趋势阴线也挺强劲，可能会演变成前方下跌的第二推延续。到底哪一种剧本更可能是答案呢？我们必须观察三根K线的样态。而后接续的是一根短小的趋势阴线。这似乎有理由被解读为突破后的跟进。证明多头在应当防守的水平，价位几乎没有进去的意思。于是刚刚斟酌不出来的两种剧本就变成下跌的可能性高了一点。此时回顾前方急速接通道。通道起点以上的部分已经是双边交易性格十足的段落，介于宽幅通道与区间之间。可能更近似于区间。这么一来，丈量与下方磁力的距离，只剩下基于区间高度的不到四分之一。那么就有理由市价决定做空。并旋即获得利润。更棒的是，虽然我们已经立即成功止盈，但脉络仍然支持我们继续这么做。眼看这是一根下影线短小的趋势K线，且前方已有连续的，强劲的动能。另外，无论你是这样测量还是更保守起见，只计算这一推的高度。距离下方的磁体又已经非常接近。或许还可以再进行一次短打。此间依然有保守与激进的抉择，需要你伤脑筋。对重视安全的交易者，此处是对通道起点的突破，但未有跟进。运气不好，可能接着折返。但对激进的交易者来说，这种急速已经彰显了空头宰制行情的能力。并且前面这个二推的区间调整下破之后，等距投映可能兑现。多空至少在抵达我们的止盈价位之后，才重新商量接下来要何去何从。可不可以入场就交由你往后撰写规则时决定。但在这个例子里，我们很快看到价格再次向下测试。今日的目前，低点触发止盈。才又重新折返走高。快转下走势，到了这里，明显又是一个双边交易地带。虽然整体区间的规模比前面的例子要小得多。但当这里收了趋势阴线延续性不错，我们也有理由认为区间低点可能在被测试。可以用相同的方法再次获利。此处异同节点的趋势阴线，预示下跌的可能性更高。则当下方又有一个极待测试的磁体。就也很可能为我们再带来利润。甚至到了后面这里，就如我方才提示的，只要距离重要的磁体足够近，磁体就很可能遭到测试。所以在这里市价追近，与其前方的这个波段点被被触碰，也会是有利可图的做法。","p":"p566"}]},{"t":"para","text":"我的习惯如下：首先，我们要确保距离区间边线已经足够近。价格运动到了磁体的磁力能够发挥作用的射程里头。具体的参数因人而异。而我会丈量区间的高度，并在价格距离边线仅剩下四分之一区间幅度时考虑入场。以此为例，由低至高，若下缘为零，上缘为一，则当价格进到黑线以下，就符合我的条件。保守者可以部署停止订单，在针尖被下破后才进入。止损置于前一个次级波段点或者区间上缘之外。止盈这就当然安放在目标磁体或者你眼看实体已经收在黑线之下，则在收线之际市价入场，旋即就能够争取到这个短小的利润。理解流程后，接着我们把目光放到随后的另一个区间。如果我们谨守“区间应有一次对原趋势极值”“以及一次对回调极值的失败突破”，这样的规定。则区间应该成立在这根阳线收线之后。接着下一根阳线，则是另一根趋势K线。同时，又逼近了区间上缘。进入了我所要求的25%射程。仔细计较的话，实体并未收在黑线之上，只是影线穿透了。那保守起见，我会使用停止订单，在高点再次被突破后入场。如此做，我们就再度以不甚美观的盈亏比完成了一笔高胜率的剥头皮交易。对这张图，我们也来做一点补充。有时候价格运动得太快，让我们错失以此方法入场的机会，这时候我们可能就只好摸摸鼻子算了。以此为例，随后的两根趋势阴线，后者触及区间下缘，确实也是急赴磁体的表现。不过，在越过门槛的同时，该K线也旋即抵达磁体，没有给到我们部署订单的机会。这时候你也许会问，那我何必等待价格收线在四分之一区间幅度的门槛附近？直接挂上订单，在我们拉好的界限不就可以赚到这波利润了吗？似乎有一点道理，但这么做的风险在于可能规避不了这种情况。事前挂上的订单被触发，但旋即折返，最后以亏损做结。请别误会，我不是说确定收现在门槛附近才入场，就必定能够止盈。价格运动到距离边线的位置够近是一件好事，不过够近可能还不够。既然这个建仓方案的名称是急赴磁体，那么运动的“急”我们看见朝向利己方向的趋势K线接踵而来。当然，这代表运动的动能大小斜率连续性都不错，能够提供我们更多的数学优势。这种不幸的针尖，其实这代表动能表现不是最理想。提前押注就可能将这种亏损的可能性也包纳进来。你可以再多加考虑是否要如此做。除此之外，剩下四分之一区间幅度的参数是硬性的规定吗？当然也不是的，你可以依照自己的风格爱好调整。不过我不建议放得太宽。比如，在区间中轴50%的位置就入场，那肯定太远了。中轴是均衡的地带，距离边线还有二分之一区间高度那么远。那肯定还会进到磁体的磁力场里面。我想三分之一应该会是最宽的限度，但距离越近，盈亏比会越差，理应赢胜率就会越高。你可以按照风格进行适当的甄选。如果不知道如何下手，则考虑选用跟我相同的25%即可。另一个问题是，太妃刚刚这根下影线触及了磁体，但后面又收了一根内包阴线。你看它收线的位置，又已经在黑线之下，我能不能在此时市价入场？这种时候依我的操作习惯是不会介入的。原因是磁体刚刚已经触及，这时候受内包K线并不一定能够引发又一次的下跌。你得要斟酌一下。最不利的情况就是如图所示，其实触及磁体的针尖就已经是反转的开始。内包以后开始慢慢转为向上，然后陷入区间典型的纠结之中。愿意不那么保守的交易者，可能会接受当价格转高，暂时远离磁体，大致至少晃到中轴附近。但又再度趋近磁体时，才以停止订单突破入场。那么，进场点就会设置在该折返低点被重新下破的时候。同样争取一个到区间底部的短打利润。","pid":"p565"},{"t":"para","text":"接着我们再看看下一个例子。在这个交易日里， ，那么运动的“急”我们看见朝向利己方向的趋势K线接踵而来。当然，这代表运动的动能大小斜率连续性都不错，能够提供我们更多的数学优势。这种不幸的针尖，其实这代表动能表现不是最理想。提前押注就可能将这种亏损的可能性也包纳进来。你可以再多加考虑是否要如此做。除此之外，剩下四分之一区间幅度的参数是硬性的规定吗？当然也不是的，你可以依照自己的风格爱好调整。不过我不建议放得太宽。比如，在区间中轴50%的位置就入场，那肯定太远了。中轴是均衡的地带，距离边线还有二分之一区间高度那么远。那肯定还会进到磁体的磁力场里面。我想三分之一应该会是最宽的限度，但距离越近，盈亏比会越差，理应赢胜率就会越高。你可以按照风格进行适当的甄选。如果不知道如何下手，则考虑选用跟我相同的25%即可。另一个问题是，太妃刚刚这根下影线触及了磁体，但后面又收了一根内包阴线。你看它收线的位置，又已经在黑线之下，我能不能在此时市价入场？这种时候依我的操作习惯是不会介入的。原因是磁体刚刚已经触及，这时候受内包K线并不一定能够引发又一次的下跌。你得要斟酌一下。最不利的情况就是如图所示，其实触及磁体的针尖就已经是反转的开始。内包以后开始慢慢转为向上，然后陷入区间典型的纠结之中。愿意不那么保守的交易者，可能会接受当价格转高，暂时远离磁体，大致至少晃到中轴附近。但又再度趋近磁体时，才以停止订单突破入场。那么，进场点就会设置在该折返低点被重新下破的时候。同样争取一个到区间底部的短打利润。","p":"p565"},{"t":"接着我们再看看下一个例子。在这个交易日里，我会稍稍放宽对区间界定，应有一次对原趋势极值以及一次对回调极值的失败突破的严格标准。展示只要距离磁体足够接近，就容易有朝向磁体吸附的运动惯性。首先，价格在开盘没多久就展现出了显著的双边交易性格。截至当前，看起来像是一个三推的楔形顶。其通道线与开盘的第一根K线高点受阻。随后，受了内包阳线之后出现趋势阴线下跌。并在两小推的上涨结束后，又被接连的阴线所吞没，价格有向下进发的意思。不过，当价格运动至此，其实交易者是没有足够的信心，认为后续能够接续下跌的。毕竟趋势线可以不停放缓，直到在此处以更窄幅区间的形式向右运动。这里也确实有过屡屡撑起的历史。但是楔形顶与对决线又给到下跌的理由。这两根趋势阴线也挺强劲，可能会演变成前方下跌的第二推延续。到底哪一种剧本更可能是答案呢？我们必须观察三根K线的样态。而后接续的是一根短小的趋势阴线。这似乎有理由被解读为突破后的跟进。证明多头在应当防守的水平，价位几乎没有进去的意思。于是刚刚斟酌不出来的两种剧本就变成下跌的可能性高了一点。此时回顾前方急速接通道。通道起点以上的部分已经是双边交易性格十足的段落，介于宽幅通道与区间之间。可能更近似于区间。这么一来，丈量与下方磁力的距离，只剩下基于区间高度的不到四分之一。那么就有理由市价决定做空。并旋即获得利润。更棒的是，虽然我们已经立即成功止盈，但脉络仍然支持我们继续这么做。眼看这是一根下影线短小的趋势K线，且前方已有连续的，强劲的动能。另外，无论你是这样测量还是更保守起见，只计算这一推的高度。距离下方的磁体又已经非常接近。或许还可以再进行一次短打。此间依然有保守与激进的抉择，需要你伤脑筋。对重视安全的交易者，此处是对通道起点的突破，但未有跟进。运气不好，可能接着折返。但对激进的交易者来说，这种急速已经彰显了空头宰制行情的能力。并且前面这个二推的区间调整下破之后，等距投映可能兑现。多空至少在抵达我们的止盈价位之后，才重新商量接下来要何去何从。可不可以入场就交由你往后撰写规则时决定。但在这个例子里，我们很快看到价格再次向下测试。今日的目前，低点触发止盈。才又重新折返走高。快转下走势，到了这里，明显又是一个双边交易地带。虽然整体区间的规模比前面的例子要小得多。但当这里收了趋势阴线延续性不错，我们也有理由认为区间低点可能在被测试。可以用相同的方法再次获利。此处异同节点的趋势阴线，预示下跌的可能性更高。则当下方又有一个极待测试的磁体。就也很可能为我们再带来利润。甚至到了后面这里，就如我方才提示的，只要距离重要的磁体足够近，磁体就很可能遭到测试。所以在这里市价追近，与其前方的这个波段点被被触碰，也会是有利可图的做法。","p":"p566"},{"t":"交易者只要谨记这种建仓方案的理据。既然称作急赴磁体，那该要距离磁体足够近。奔向的姿态应该要足够急促而有动能。同时，价格行进的路上应该要干净敞亮，没有其他磁体拦阻。没有办法满足这些要求，则应该考虑在旁观望。","p":"p567"}]},{"t":"para","text":"交易者只要谨记这种建仓方案的理据。既然称作急赴磁体，那该要距离磁体足够近。奔向的姿态应该要足够急促而有动能。同时，价格行进的路上应该要干净敞亮，没有其他磁体拦阻。没有办法满足这些要求，则应该考虑在旁观望。","pid":"p567"},{"t":"img","src":"assets/img/l15B_268.webp","ilabel":"15-14","icap":"L15　区间交易方法","fid":"fig268","ctx":[{"t":"交易者只要谨记这种建仓方案的理据。既然称作急赴磁体，那该要距离磁体足够近。奔向的姿态应该要足够急促而有动能。同时，价格行进的路上应该要干净敞亮，没有其他磁体拦阻。没有办法满足这些要求，则应该考虑在旁观望。","p":"p567"},{"t":"最后一种建仓方案是区间突破回调。我们知道极值区间倾向突破失败，均衡也终将打破进入失衡。那么，针对这一种必然发生的事件，交易者也可以设计应对措施。具体的做法就是，在区间遭到突破后，先等待跟进作为确认，提醒我们进入备战状态。为什么要有这个等待的步骤呢？当然不需要多言，因为区间倾向突破失败，不等跟进来提升突破成功的几率，我们很可能会因为过早追进，而入场在最糟糕的价位。不过但有这一层滤网还并不足够，后续有一些条件必须要满足。就是当突破点被测试，且看到更有利于突破方的动能表现时，我们才以证明逆势方孱弱的出现后，高/低一来入场。朝上突破方向，争取区间等距扩张的利润。","p":"p568"}]},{"t":"para","text":"最后一种建仓方案是区间突破回调。我们知道极值区间倾向突破失败，均衡也终将打破进入失衡。那么，针对这一种必然发生的事件，交易者也可以设计应对措施。具体的做法就是，在区间遭到突破后，先等待跟进作为确认，提醒我们进入备战状态。为什么要有这个等待的步骤呢？当然不需要多言，因为区间倾向突破失败，不等跟进来提升突破成功的几率，我们很可能会因为过早追进，而入场在最糟糕的价位。不过但有这一层滤网还并不足够，后续有一些条件必须要满足。就是当突破点被测试，且看到更有利于突破方的动能表现时，我们才以证明逆势方孱弱的出现后，高/低一来入场。朝上突破方向，争取区间等距扩张的利润。","pid":"p568"},{"t":"img","src":"assets/img/l15B_269.webp","ilabel":"15-15","icap":"L15　区间交易方法","fid":"fig269","ctx":[{"t":"最后一种建仓方案是区间突破回调。我们知道极值区间倾向突破失败，均衡也终将打破进入失衡。那么，针对这一种必然发生的事件，交易者也可以设计应对措施。具体的做法就是，在区间遭到突破后，先等待跟进作为确认，提醒我们进入备战状态。为什么要有这个等待的步骤呢？当然不需要多言，因为区间倾向突破失败，不等跟进来提升突破成功的几率，我们很可能会因为过早追进，而入场在最糟糕的价位。不过但有这一层滤网还并不足够，后续有一些条件必须要满足。就是当突破点被测试，且看到更有利于突破方的动能表现时，我们才以证明逆势方孱弱的出现后，高/低一来入场。朝上突破方向，争取区间等距扩张的利润。","p":"p568"},{"t":"一样，我们直接进一个例子会比较方便理解。当然，这个例子确实难得，我找了超级久，居然可以为我们复习至今谈过的几乎所有建仓方案。包括急速发起后有跟进,给到收线市价入场的机会。而后还有逆一顺一,双重底还有楔形底交易机会。同时，以此做看衰突破不成功和急赴磁体的交易，也都得以以止盈作结。观察整体脉络，这似乎是一个上升趋势中的牛旗回调。典型的急速转入到通道，再转入到区间。而后续将要有新的突破循环的开端。此处就正可能有区间突破回调的交易机会。方才在纵观的区间中倾向突破失败，没错。但现在有趋势阳线收在原趋势极值，也就是区间上缘以外，我们可以接着看看后续的动能表现如何。作为第一层过滤突破后，还有跟进这点是马上确认的。不过如果你还记忆犹新，肯定会忌惮第六单元提过的知识区间有其磁性。即使突破看似有所结果，也有一定的几率最终折返回到区间内，成为末端旗型。这时候，第二层过滤就是重要的。我们必定要在突破点附近看见空头无意进取的表现，才能够为突破交易增添信心。于是，即使后续还接续阳线。我也不鼓励你，因为恐惧错失机会，而马上贸然进场。而是要等到这根阴线收出长下影线，我们才目睹空头在突破点处，似乎选择止盈。因而，在收线之前有过这样一段的拉起。也正是在这个时候，区间突破回调的正式入场点出现了。我们可以在这根阴线触线之后，与其高点处准备介入K线高点，先降低在抬升的高一时机。止损在区间外侧或者前一个重要波段点，次级波段点之外。测算区间等距扩张的利润。后面收了一个内包阳线未能触发买进。那我们就撤销订单，再重新放上，继续等待高一。入场后就气定神闲的持仓，直到止损触发或者如图所示的利润先落袋为安。大致行抵止盈价位后，价格又陷入纠结，发展为横向震荡的区间。有过对原趋势极值和回调极值的失败突破表现。也造成了楔形底的外观。于是在这根K线的高点，你有基于楔形底入场或者看出来突破成功入场的高一建仓理由。同样得以获利出场。而当价格在高处有突破意图则你又可以押注突破失败，并在此后确实失去跟进后成功争取到利润。在区间下半部看见连续的阴线生成，将给到你急赴磁体，短打到区间底部的交易机会。尽管入场后旋即收出阳线。但阳线并未再有跟进，而是被接连的阴线否决，重新触发止盈。正是在这样一张图表里面，我们能够再次确认此前所教的所有建仓方案都对应到一轮趋势里的某些利润段落。娴熟价格行为原理以及具体做法的交易者。能以相对安全的方式执行有数学优势的决策。而这正是这堂课程，这套培训的训练目标。","p":"p569"}]},{"t":"para","text":"一样，我们直接进一个例子会比较方便理解。当然，这个例子确实难得，我找了超级久，居然可以为我们复习至今谈过的几乎所有建仓方案。包括急速发起后有跟进,给到收线市价入场的机会。而后还有逆一顺一,双重底还有楔形底交易机会。同时，以此做看衰突破不成功和急赴磁体的交易，也都得以以止盈作结。观察整体脉络，这似乎是一个上升趋势中的牛旗回调。典型的急速转入到通道，再转入到区间。而后续将要有新的突破循环的开端。此处就正可能有区间突破回调的交易机会。方才在纵观的区间中倾向突破失败，没错。但现在有趋势阳线收在原趋势极值，也就是区间上缘以外，我们可以接着看看后续的动能表现如何。作为第一层过滤突破后，还有跟进这点是马上确认的。不过如果你还记忆犹新，肯定会忌惮第六单元提过的知识区间有其磁性。即使突破看似有所结果，也有一定的几率最终折返回到区间内，成为末端旗型。这时候，第二层过滤就是重要的。我们必定要在突破点附近看见空头无意进取的表现，才能够为突破交易增添信心。于是，即使后续还接续阳线。我也不鼓励你，因为恐惧错失机会，而马上贸然进场。而是要等到这根阴线收出长下影线，我们才目睹空头在突破点处，似乎选择止盈。因而，在收线之前有过这样一段的拉起。也正是在这个时候，区间突破回调的正式入场点出现了。我们可以在这根阴线触线之后，与其高点处准备介入K线高点，先降低在抬升的高一时机。止损在区间外侧或者前一个重要波段点，次级波段点之外。测算区间等距扩张的利润。后面收了一个内包阳线未能触发买进。那我们就撤销订单，再重新放上，继续等待高一。入场后就气定神闲的持仓，直到止损触发或者如图所示的利润先落袋为安。大致行抵止盈价位后，价格又陷入纠结，发展为横向震荡的区间。有过对原趋势极值和回调极值的失败突破表现。也造成了楔形底的外观。于是在这根K线的高点，你有基于楔形底入场或者看出来突破成功入场的高一建仓理由。同样得以获利出场。而当价格在高处有突破意图则你又可以押注突破失败，并在此后确实失去跟进后成功争取到利润。在区间下半部看见连续的阴线生成，将给到你急赴磁体，短打到区间底部的交易机会。尽管入场后旋即收出阳线。但阳线并未再有跟进，而是被接连的阴线否决，重新触发止盈。正是在这样一张图表里面，我们能够再次确认此前所教的所有建仓方案都对应到一轮趋势里的某些利润段落。娴熟价格行为原理以及具体做法的交易者。能以相对安全的方式执行有数学优势的决策。而这正是这堂课程，这套培训的训练目标。","pid":"p569"},{"t":"img","src":"assets/img/l15B_270.webp","ilabel":"15-16","icap":"L15　区间交易方法","fid":"fig270","ctx":[{"t":"一样，我们直接进一个例子会比较方便理解。当然，这个例子确实难得，我找了超级久，居然可以为我们复习至今谈过的几乎所有建仓方案。包括急速发起后有跟进,给到收线市价入场的机会。而后还有逆一顺一,双重底还有楔形底交易机会。同时，以此做看衰突破不成功和急赴磁体的交易，也都得以以止盈作结。观察整体脉络，这似乎是一个上升趋势中的牛旗回调。典型的急速转入到通道，再转入到区间。而后续将要有新的突破循环的开端。此处就正可能有区间突破回调的交易机会。方才在纵观的区间中倾向突破失败，没错。但现在有趋势阳线收在原趋势极值，也就是区间上缘以外，我们可以接着看看后续的动能表现如何。作为第一层过滤突破后，还有跟进这点是马上确认的。不过如果你还记忆犹新，肯定会忌惮第六单元提过的知识区间有其磁性。即使突破看似有所结果，也有一定的几率最终折返回到区间内，成为末端旗型。这时候，第二层过滤就是重要的。我们必定要在突破点附近看见空头无意进取的表现，才能够为突破交易增添信心。于是，即使后续还接续阳线。我也不鼓励你，因为恐惧错失机会，而马上贸然进场。而是要等到这根阴线收出长下影线，我们才目睹空头在突破点处，似乎选择止盈。因而，在收线之前有过这样一段的拉起。也正是在这个时候，区间突破回调的正式入场点出现了。我们可以在这根阴线触线之后，与其高点处准备介入K线高点，先降低在抬升的高一时机。止损在区间外侧或者前一个重要波段点，次级波段点之外。测算区间等距扩张的利润。后面收了一个内包阳线未能触发买进。那我们就撤销订单，再重新放上，继续等待高一。入场后就气定神闲的持仓，直到止损触发或者如图所示的利润先落袋为安。大致行抵止盈价位后，价格又陷入纠结，发展为横向震荡的区间。有过对原趋势极值和回调极值的失败突破表现。也造成了楔形底的外观。于是在这根K线的高点，你有基于楔形底入场或者看出来突破成功入场的高一建仓理由。同样得以获利出场。而当价格在高处有突破意图则你又可以押注突破失败，并在此后确实失去跟进后成功争取到利润。在区间下半部看见连续的阴线生成，将给到你急赴磁体，短打到区间底部的交易机会。尽管入场后旋即收出阳线。但阳线并未再有跟进，而是被接连的阴线否决，重新触发止盈。正是在这样一张图表里面，我们能够再次确认此前所教的所有建仓方案都对应到一轮趋势里的某些利润段落。娴熟价格行为原理以及具体做法的交易者。能以相对安全的方式执行有数学优势的决策。而这正是这堂课程，这套培训的训练目标。","p":"p569"},{"t":"在另一个例子里，可以顺道一提的是，在指数期货的日内交易中，开盘常有出现区间的惯性。我们称之为开盘区间。之所以如此，你可以理解为，在这个时段中，机构交易者可能正等待着消化隔夜的资讯。并且在对隔夜的持仓评估应当继续持有或者获利了结。遂此方向各异的交易者，他们各自行动，同时透过测试那些开盘价附近的磁体来确认今天的多空意向。这将容易形成犹豫的双边波动。以画面上的图表为例，前几根K线显然是相互吞没的铁丝网。有过下破的尝试，但又马上被阳线所截断。这就是我们说的双边交易行为。但当我们看到强劲的趋势阳线上波开盘区间。而还有对突破点的突破测试。就接着可以观察到，这是一个对开盘区间上缘的两次突破测试。这种抵达等距运动目标的过程。当然，我们说做区间突破回调的交易，应该要看到，突破有跟进之后，才以高一进场。在这里还差一个优质的跟进。不过，当后续又来进行一次测试的时候，你也不难想象，这里在更小时间级别图表上。可能体现为着陆于区间上缘的双重底牛旗。最后引发第二推向上抵达基于区间高度的等距投映目标。后面价格下落，一推之后，还有漫长的第二推。当到了这个交易日的当前低点，演变为突破后，还有跟进的走势，我们就可以开始张望。哦，区间要下破了，那如果有所回调，也可以以突破回调逻辑进场。所以，当对突破点的测试真的发生的时候，预期以低一介入是合理的。同样止损可以被放置在这些转折处，以你的风险偏好来安排。也值得一提的是，这里实际上有建仓逻辑的重合。你既可以认为是区间突破回调，也可以认为是逆一顺一交易机会。就看你将哪一种列入了你的交易规则里面。而后续我们没有被立即触发入场，而是收了一个要求我们挪动停止订单的内包十字星。才终于在下一根K线下破使卖单成立。最后价格接着下行，既抵达了今日上半部区间的等距投映处，也恰巧过冲了逆一顺一逻辑的AB=CD目标。到位以后是等距二推回调测试突破点后又下落，逐渐走成区间。等到这根K线收出，你可能会掐指一算，发现这里距离区间底部相当接近了，愿意挂上订单，等再重新下破。成就急赴磁体的短打利润。只不过下一根K线是内包阳线，此后再没有向下运动，触发你的入场订单。这时候你可能就会觉得好险，我是一个有规则交易者，不过因为看到大阴线就FOMO不管不顾的市价追进。反而是在这边看见实体阳线确实受限，在上涨启动到区间上缘，这段距离的四分之三门槛之上。才选择市价跟进。能够获得触及区间上缘的最后这一小段利润。","p":"p570"}]},{"t":"para","text":"在另一个例子里，可以顺道一提的是，在指数期货的日内交易中，开盘常有出现区间的惯性。我们称之为开盘区间。之所以如此，你可以理解为，在这个时段中，机构交易者可能正等待着消化隔夜的资讯。并且在对隔夜的持仓评估应当继续持有或者获利了结。遂此方向各异的交易者，他们各自行动，同时透过测试那些开盘价附近的磁体来确认今天的多空意向。这将容易形成犹豫的双边波动。以画面上的图表为例，前几根K线显然是相互吞没的铁丝网。有过下破的尝试，但又马上被阳线所截断。这就是我们说的双边交易行为。但当我们看到强劲的趋势阳线上波开盘区间。而还有对突破点的突破测试。就接着可以观察到，这是一个对开盘区间上缘的两次突破测试。这种抵达等距运动目标的过程。当然，我们说做区间突破回调的交易，应该要看到，突破有跟进之后，才以高一进场。在这里还差一个优质的跟进。不过，当后续又来进行一次测试的时候，你也不难想象，这里在更小时间级别图表上。可能体现为着陆于区间上缘的双重底牛旗。最后引发
