},{"t":"img","src":"assets/img/l07A_095.webp","ilabel":"7-5","icap":"L07　反转逆势突破","fid":"fig95","ctx":[{"t":"我们同样找一个例子来看看，并且应用上这些要件，借此让你理解的更透彻。这张图有些交易者可能也眼熟能详了，这是比特币在2021年第一轮牛市的图表。我选了三日级别来做，说明这样K线就塞得下画面。显然，价格旱地拔葱而起，以后走出了蛮通畅的连续阳线。我们来复习一下，前面说过的一些概念，确保你没有忘记。第一根停顿K线在哪里呢？这里有一颗阴线，十字星代表价格在这里迟疑了一下。但迟疑就只是迟疑，多头动能都还在，没有出现任何K线的低点降低。而后续出现了严格定义的回调。K线在什么地方呢？是这根长下影线的阳线。我们说回调K线是急速运动中首次K线极值逆向突破的那一根。可以想见，在这里是先下后上完成的一个小小的回调。而不久后，价格终于陷入了更显著的回调。K线高点一路降低，内含两次推动。然后高点才开始抬升。不难想见，内部的运动轨迹应该是这样的，下跌，上涨，下跌。然后橘色的部分是在那根短小的阴线处稍微抖动了一下，再继续上涨，并最终突破了原趋势极值。这里也可以很清楚的看出，突破发起后完成回调，还有第二推。尤其对原趋势极值的测试，是明确成功大幅突破。那就可以开启新的突破循环，突破回调再突破。不过，这次突破或说这是对原趋势极值的测试，多头动能就开始衰减了。越过高点以后，旋即没有跟进，就开始折回。但幸好下跌的这两推结束，在相对高的位置没有威胁到前低点价格，还有继续上涨的空间。不过，接下来多头局势就变得不再乐观了，价格还未碰出原趋势极值就开始有阴线出现，这不是好消息。而突破高点以后，同样没有跟进，反而是收了比上次更强劲的阴线。它强劲到什么程度呢？我们终于拉回正题了，谈大型趋势反转的发生。前面提到的整体顺势动能转弱以后，反转的枪响在这里成立，对趋势线的突破。虽然突破后立即收回下影线非常明显，但在这里透露给交易者的讯息是多头掌权的现况，遭到了挑战。而且就算触线后立即弹起，多头也没有能够将这根K线收成阳线。那这就代表情况不再那么乐观了。你想想，如果你是多头，比如逆境，在这里给予突破回调的理由，建仓好了。看到突破屡屡失败，然后出现这种超级大阴线，一边差点威逼到你的盈亏平衡价位。还一边严苛的挑战了多头试图维持的上升斜率，你会不会害怕？就算你头很铁，决定死拿，但人家机构却不这么想。很大一部分的精明交易者将开始退缩。于是那些人的离场，马上让另一个要件也备齐，低点开始降低。再说一次，现在的趋势方是多头，他们要维持趋势的健全高低点必须不断递进抬升。如果价格在这里撑住，没有进一步穿透，他们还可以拍拍彼此的肩膀，嘴上说着哈哈，我们只是要在这里等一个双重底才买进啊。后面就要往十万去了，兄弟们不怕。但是，但是看到这种情况，即使后面又收了阳线，刚刚在这里建仓的你，有一瞬间都开始浮亏的你。肯定会加倍怀疑。如果多头够强，为什么下跌能够测试到我的盈亏平衡止损？他们真的没钱没力捍卫低点不去降低吗？事实摆在眼前，他们就是着实无法你才会真真切切的担惊受怕。所以与你在同个价位入场的机构也开始打各自的算盘了。有人想着好，那我赶快滚吧，等强劲突破后我再追进就好。为了多贪这一段利润，去死拿一个危险的仓位，绝对并不理智。有人则半信半疑地握着仓位，心想，我就看看你测试原趋势极值的表现如何。太弱我就逃生，大幅超越我就继续握着，反正我静观其变。而还有人则早已清空持仓，认定大型趋势反转可能就要发生。所以反而要找一个好的位置，开始准备做空。总之，看到前面种种的弱势表现突破屡屡失败，趋势线遭穿透低点开始降低。多头的信心就已经大不如前。这时候当然空头也不是吃素的，接下来可能就会更加凶猛。后面的事就很明确了，多头尝试扭转趋势，向上突破，而突破后应该要有两推。第一推走完以后回调，第二推应该去测试原趋势极值。但是哇，才隔了一根阳线，旋即收了一根超级强势的阴线，眼看又要创新低。剖析里头的走势，很明显是这样的。上涨回调测试原趋势极值然后失败。这里出现了一个小型的双重顶熊旗，引发下跌。而一旦收线在这里，刚刚在这根阳线收线后，决定再次给他机会，决定不跑，甚至还加仓的人。绝对是都受不了了。你要是还持仓，到现在应该也受不了了，我怎么会让你测试我的盈亏平衡两次还信你？我是什么很贱的人吗？所以，引发进一步的放弃价格又创新低。低点屡屡递进，高点也开始降低，现在反而是下降趋势的条件备齐了，给的空方十足的理由继续挺进。而下跌急速结束后，就刹停在这个很远的前上升趋势低点，才暂时缓住。","p":"p329"},{"t":"一路看来，你就见证了一次大型趋势反转的发动。这里我们接着把刚刚没有讨论到足够清晰的第一点给讲完。小型趋势反转与大型趋势反转最直观的差异就在于规模的不同。你只要看到很宏观的下跌，就必然要看到更完整，规模更大，耗时更久的趋势衰败过程。那些精明的机构才会同样被说服，认为趋势真的要反转了。所以前面讲的第一个要件大型趋势反转，通常需要10根，20根以上的K线组成，某种反转形态。且过程中逆势压力足够累积之后，才可能成功。用这张图就可以很好的体现。在反转发动以前，这里走出了一个漂亮的熊旗，还记得吗？上升通道都是熊旗。作为熊旗的楔形顶，这是很常见的反转形态。同时，自从急速停止到多头应该防卫的低点被刺破，总共走了21根K线。崭新的突破循环发起后，二十六根K线的二十六分之二十一，也就是百分之八十的数量。同时，逆势压力也充足，积累给了多头很多恫吓。21根K线里有10根K线是阴线，其中不少还很长，甚至比里头最长的阳线更长。以上正是规模卖压充分的具体意思。这样的条件备齐，更容易造成大型趋势反转。为了清除你其他可能的疑问，我要进一步说说为什么我非得将这三个条件绑在一起讲。很多交易者，尤其是操之过急的新手交易者，可能没有耐心等待条件备齐。比如看到趋势线被突破，就迫不及待想要摸底。当然，经过我的解释，似乎在趋势线突破，阴线收定以后，就市价做空。只要止损摆放得当就没有亏损的风险。但这也许是后见之明。有一种可能是在后面行情走出来以前，你的趋势线是这样画的。那么，要是刺破你，就马上追进做空。那随后出现的一波上涨，将会把你清扫出局。而如果交易者稍微稳重一点，愿意等待其他过滤器都发出讯号，帮助你筛选入场时机。那亏损就不会发生。这里低点还未降低，阴线也太少，卖压并不充分。于是在交易者起心动念想，要主观的修改我们提供的要件，以前还是建议你先谨慎一点。考虑照着上述标准多听多看。等到你很熟忍读图知道逆势压力的积累，怎么样才算充分，再让你的经验和学士派上用场？请塑出更适合你的交易规则。下一个段落，我要说明的是，对买压与卖压的判断。但开始以前请容我再啰嗦一下，我还想要再进行第四个要件的补充。在反转成立前，价格通常会对原趋势极值进行结果或为不及持平或过冲的测试。","p":"p330"},{"t":"这其实应该无需多说，经过测试的单元，你早已经内建了，突破后必有测试的观念。但在学习阶段，要灵活的联系所有知识点，不是那么容易。尤其我们很容易忘记，逆势突破也是突破，它同样倾向有两段推动。所以我还是想要提醒一下，以刚刚的图表为例，这一次向上测试就是对原上升趋势的测试不及。以多头的角度来说，这是突破过度回调以及非常弱势的对原趋势极值的测试。而对空头来说，这则是向下突破后对突破点，也就是这根阳线低点的测试。但同样不及，证明空头非常激进，出钱又出力。那到这里，多头已经展现了放弃的意愿，而空头则以如此强劲的阴线实体证明了自己有能力控制行情。遂此双方共事也就达成了，后续价格就可以放心的下落转换为空头的主场。在心中知道有这个第四点的补充要件会更方便，你跟上现在行情到底走到哪里了？它会起到提醒的作用，提醒什么呢？如果你在高处入场做空，这次测试的强劲与否会预示后续的反转行情能走多远。测试的很弱，逆势方气势凌人，那你就高枕无忧，可能可以放心的持仓。因为这代表在这边想只要解套决定卖出已离场的多头交易者，应该比起想要制造向上新突破的多头更多。而同时，空头交易者也很积极。但如果测试的很强，以持平乃至于过冲的形式完成，硬要考验你是拿不拿得住仓位。那你就知道原趋势方还没有退散，最好不要心想让利润无限奔跑。接下来更可能走成区间，而妄想大幅获利的你就会立即饱受煎熬。这也正是测试的机制。你可以说，大型趋势反转在多数情况下都包含某种双重顶底，尽管可能不完美或不明显。像这里，你可以说这是一个高点降低的双重顶。这个例子就显示了，因为反向订单，也就是卖单更加踊跃，于是不及极值的测试。这将导致极值不再递进。三个要件加一项补充，都说完了，我们继续。或许在刚刚的过程里，让你感到最困惑或模糊的部分是什么？叫做逆向压力要积累充足。以上升趋势的反转为例，什么叫做卖压充分？我们接着来解释这个名词。","p":"p331"}]},{"t":"para","text":"这其实应该无需多说，经过测试的单元，你早已经内建了，突破后必有测试的观念。但在学习阶段，要灵活的联系所有知识点，不是那么容易。尤其我们很容易忘记，逆势突破也是突破，它同样倾向有两段推动。所以我还是想要提醒一下，以刚刚的图表为例，这一次向上测试就是对原上升趋势的测试不及。以多头的角度来说，这是突破过度回调以及非常弱势的对原趋势极值的测试。而对空头来说，这则是向下突破后对突破点，也就是这根阳线低点的测试。但同样不及，证明空头非常激进，出钱又出力。那到这里，多头已经展现了放弃的意愿，而空头则以如此强劲的阴线实体证明了自己有能力控制行情。遂此双方共事也就达成了，后续价格就可以放心的下落转换为空头的主场。在心中知道有这个第四点的补充要件会更方便，你跟上现在行情到底走到哪里了？它会起到提醒的作用，提醒什么呢？如果你在高处入场做空，这次测试的强劲与否会预示后续的反转行情能走多远。测试的很弱，逆势方气势凌人，那你就高枕无忧，可能可以放心的持仓。因为这代表在这边想只要解套决定卖出已离场的多头交易者，应该比起想要制造向上新突破的多头更多。而同时，空头交易者也很积极。但如果测试的很强，以持平乃至于过冲的形式完成，硬要考验你是拿不拿得住仓位。那你就知道原趋势方还没有退散，最好不要心想让利润无限奔跑。接下来更可能走成区间，而妄想大幅获利的你就会立即饱受煎熬。这也正是测试的机制。你可以说，大型趋势反转在多数情况下都包含某种双重顶底，尽管可能不完美或不明显。像这里，你可以说这是一个高点降低的双重顶。这个例子就显示了，因为反向订单，也就是卖单更加踊跃，于是不及极值的测试。这将导致极值不再递进。三个要件加一项补充，都说完了，我们继续。或许在刚刚的过程里，让你感到最困惑或模糊的部分是什么？叫做逆向压力要积累充足。以上升趋势的反转为例，什么叫做卖压充分？我们接着来解释这个名词。","pid":"p331"},{"t":"img","src":"assets/img/l07A_096.webp","ilabel":"7-6","icap":"L07　反转逆势突破","fid":"fig96","ctx":[{"t":"这其实应该无需多说，经过测试的单元，你早已经内建了，突破后必有测试的观念。但在学习阶段，要灵活的联系所有知识点，不是那么容易。尤其我们很容易忘记，逆势突破也是突破，它同样倾向有两段推动。所以我还是想要提醒一下，以刚刚的图表为例，这一次向上测试就是对原上升趋势的测试不及。以多头的角度来说，这是突破过度回调以及非常弱势的对原趋势极值的测试。而对空头来说，这则是向下突破后对突破点，也就是这根阳线低点的测试。但同样不及，证明空头非常激进，出钱又出力。那到这里，多头已经展现了放弃的意愿，而空头则以如此强劲的阴线实体证明了自己有能力控制行情。遂此双方共事也就达成了，后续价格就可以放心的下落转换为空头的主场。在心中知道有这个第四点的补充要件会更方便，你跟上现在行情到底走到哪里了？它会起到提醒的作用，提醒什么呢？如果你在高处入场做空，这次测试的强劲与否会预示后续的反转行情能走多远。测试的很弱，逆势方气势凌人，那你就高枕无忧，可能可以放心的持仓。因为这代表在这边想只要解套决定卖出已离场的多头交易者，应该比起想要制造向上新突破的多头更多。而同时，空头交易者也很积极。但如果测试的很强，以持平乃至于过冲的形式完成，硬要考验你是拿不拿得住仓位。那你就知道原趋势方还没有退散，最好不要心想让利润无限奔跑。接下来更可能走成区间，而妄想大幅获利的你就会立即饱受煎熬。这也正是测试的机制。你可以说，大型趋势反转在多数情况下都包含某种双重顶底，尽管可能不完美或不明显。像这里，你可以说这是一个高点降低的双重顶。这个例子就显示了，因为反向订单，也就是卖单更加踊跃，于是不及极值的测试。这将导致极值不再递进。三个要件加一项补充，都说完了，我们继续。或许在刚刚的过程里，让你感到最困惑或模糊的部分是什么？叫做逆向压力要积累充足。以上升趋势的反转为例，什么叫做卖压充分？我们接着来解释这个名词。","p":"p331"},{"t":"基本上就如我们先前说过的，所谓的多空竞争，他们到底在竞争什么？这是谁更有能力说服对手，我有资格，我有办法控制行情。那问题是，这当然不是嘴上说说就算了，多空双方要短兵相接，要拿出证据。要用真金白银让对手服气。所以我们说这个证据就是图表上K线动能强弱的对比。你一定还记得我们在上个单元才刚刚讲过单边交易状态，以及双边交易状态。在单边交易状态中，比如几乎清一色的阳线，多头的上升趋势，那这个过程中就没有什么卖压可言，对吧？空头不曾严实的掌控过一根K线，他们都不好意思说自己有能力控制行情。想说服对手，没有办法。想要说服自己人，掏钱杀进去，也当然没有办法。但是单边交易状态慢慢往双边交易状态倾斜的过程就是卖压逐渐积累。毕竟一定是多头越来越退缩，而空头越来越激进，空头才能开始拿下胜场。而多头也许情愿，也许不情愿的释出K线的主导权。好，既然场内的多头跟空头都是强势且精明的机构交易者，而且他们行为的积累效应会决定市场的方向。那么，交易者就该要时时注意多空动能孰强孰弱，买压与卖压是机构无法掩藏的痕迹。尤其如果你能够动态的连续的阅读多空动能，图表上的K线将悄悄告诉你。机构们如今是共同认定市场该向上还是向下运动。所以我们说卖压强劲的征兆，包括阴线开始多于阳线。人们没有办法，但开始连续出现阴线，以及阴线实体开始藏于阳线实体。阴线实体持续放大，且阳线实体持续缩短。另外还有阴线不停收在K线的中轴以下，这代表在K线的收尾之际，空头力量稍微渗出一些。减少向上回调而形成窄幅下降通道，这代表空头不愿等待，迫不及待要卖出。以及屡屡出现长上影线。这代表每次多头发力空头都能够好好的反击。那相对的，我们也来看看什么叫做买压强的情况。与卖压没有不同方向，颠倒而已。","p":"p332"}]},{"t":"para","text":"基本上就如我们先前说过的，所谓的多空竞争，他们到底在竞争什么？这是谁更有能力说服对手，我有资格，我有办法控制行情。那问题是，这当然不是嘴上说说就算了，多空双方要短兵相接，要拿出证据。要用真金白银让对手服气。所以我们说这个证据就是图表上K线动能强弱的对比。你一定还记得我们在上个单元才刚刚讲过单边交易状态，以及双边交易状态。在单边交易状态中，比如几乎清一色的阳线，多头的上升趋势，那这个过程中就没有什么卖压可言，对吧？空头不曾严实的掌控过一根K线，他们都不好意思说自己有能力控制行情。想说服对手，没有办法。想要说服自己人，掏钱杀进去，也当然没有办法。但是单边交易状态慢慢往双边交易状态倾斜的过程就是卖压逐渐积累。毕竟一定是多头越来越退缩，而空头越来越激进，空头才能开始拿下胜场。而多头也许情愿，也许不情愿的释出K线的主导权。好，既然场内的多头跟空头都是强势且精明的机构交易者，而且他们行为的积累效应会决定市场的方向。那么，交易者就该要时时注意多空动能孰强孰弱，买压与卖压是机构无法掩藏的痕迹。尤其如果你能够动态的连续的阅读多空动能，图表上的K线将悄悄告诉你。机构们如今是共同认定市场该向上还是向下运动。所以我们说卖压强劲的征兆，包括阴线开始多于阳线。人们没有办法，但开始连续出现阴线，以及阴线实体开始藏于阳线实体。阴线实体持续放大，且阳线实体持续缩短。另外还有阴线不停收在K线的中轴以下，这代表在K线的收尾之际，空头力量稍微渗出一些。减少向上回调而形成窄幅下降通道，这代表空头不愿等待，迫不及待要卖出。以及屡屡出现长上影线。这代表每次多头发力空头都能够好好的反击。那相对的，我们也来看看什么叫做买压强的情况。与卖压没有不同方向，颠倒而已。","pid":"p332"},{"t":"img","src":"assets/img/l07A_097.webp","ilabel":"7-7","icap":"L07　反转逆势突破","fid":"fig97","ctx":[{"t":"基本上就如我们先前说过的，所谓的多空竞争，他们到底在竞争什么？这是谁更有能力说服对手，我有资格，我有办法控制行情。那问题是，这当然不是嘴上说说就算了，多空双方要短兵相接，要拿出证据。要用真金白银让对手服气。所以我们说这个证据就是图表上K线动能强弱的对比。你一定还记得我们在上个单元才刚刚讲过单边交易状态，以及双边交易状态。在单边交易状态中，比如几乎清一色的阳线，多头的上升趋势，那这个过程中就没有什么卖压可言，对吧？空头不曾严实的掌控过一根K线，他们都不好意思说自己有能力控制行情。想说服对手，没有办法。想要说服自己人，掏钱杀进去，也当然没有办法。但是单边交易状态慢慢往双边交易状态倾斜的过程就是卖压逐渐积累。毕竟一定是多头越来越退缩，而空头越来越激进，空头才能开始拿下胜场。而多头也许情愿，也许不情愿的释出K线的主导权。好，既然场内的多头跟空头都是强势且精明的机构交易者，而且他们行为的积累效应会决定市场的方向。那么，交易者就该要时时注意多空动能孰强孰弱，买压与卖压是机构无法掩藏的痕迹。尤其如果你能够动态的连续的阅读多空动能，图表上的K线将悄悄告诉你。机构们如今是共同认定市场该向上还是向下运动。所以我们说卖压强劲的征兆，包括阴线开始多于阳线。人们没有办法，但开始连续出现阴线，以及阴线实体开始藏于阳线实体。阴线实体持续放大，且阳线实体持续缩短。另外还有阴线不停收在K线的中轴以下，这代表在K线的收尾之际，空头力量稍微渗出一些。减少向上回调而形成窄幅下降通道，这代表空头不愿等待，迫不及待要卖出。以及屡屡出现长上影线。这代表每次多头发力空头都能够好好的反击。那相对的，我们也来看看什么叫做买压强的情况。与卖压没有不同方向，颠倒而已。","p":"p332"},{"t":"阳线多于阴线，连续出现阳线，阳线实体长于阴线实体。阳线实体持续放大，且阴线实体持续缩短。阳线不停收在K线中轴以上。减少向下回调而形成窄幅上升通道以及屡屡出现长下影线。在画面左半边的上升行情里，显然更符合这些关于买家强劲的描述。但随着进入上升通道趋势线的斜率越放越缓，你再看看关于卖压强劲的描述。你会开始怀疑两者究竟谁更胜出。当你开始感到模棱两可，好像势均力敌的时候，就是转入双边交易状态的时候了。这代表原趋势方已经失去大半的优势，接下来多空胜率已经趋近于50%。而当你心中判读动能的指针，因为新显露的资讯朝另一边倾斜的时候。那结合前面讲的其他要件，你就可能比较有把握的推估反转要发生。或者至少可能进入超过10到20根K线内含二推的深度回调。","p":"p333"}]},{"t":"para","text":"阳线多于阴线，连续出现阳线，阳线实体长于阴线实体。阳线实体持续放大，且阴线实体持续缩短。阳线不停收在K线中轴以上。减少向下回调而形成窄幅上升通道以及屡屡出现长下影线。在画面左半边的上升行情里，显然更符合这些关于买家强劲的描述。但随着进入上升通道趋势线的斜率越放越缓，你再看看关于卖压强劲的描述。你会开始怀疑两者究竟谁更胜出。当你开始感到模棱两可，好像势均力敌的时候，就是转入双边交易状态的时候了。这代表原趋势方已经失去大半的优势，接下来多空胜率已经趋近于50%。而当你心中判读动能的指针，因为新显露的资讯朝另一边倾斜的时候。那结合前面讲的其他要件，你就可能比较有把握的推估反转要发生。或者至少可能进入超过10到20根K线内含二推的深度回调。","pid":"p333"},{"t":"img","src":"assets/img/l07A_098.webp","ilabel":"7-8","icap":"L07　反转逆势突破","fid":"fig98","ctx":[{"t":"阳线多于阴线，连续出现阳线，阳线实体长于阴线实体。阳线实体持续放大，且阴线实体持续缩短。阳线不停收在K线中轴以上。减少向下回调而形成窄幅上升通道以及屡屡出现长下影线。在画面左半边的上升行情里，显然更符合这些关于买家强劲的描述。但随着进入上升通道趋势线的斜率越放越缓，你再看看关于卖压强劲的描述。你会开始怀疑两者究竟谁更胜出。当你开始感到模棱两可，好像势均力敌的时候，就是转入双边交易状态的时候了。这代表原趋势方已经失去大半的优势，接下来多空胜率已经趋近于50%。而当你心中判读动能的指针，因为新显露的资讯朝另一边倾斜的时候。那结合前面讲的其他要件，你就可能比较有把握的推估反转要发生。或者至少可能进入超过10到20根K线内含二推的深度回调。","p":"p333"},{"t":"为了让大家有更具体的认识，我们再举例说明。从左到右，我们看到的是下降急速的发起，转入多空较为反复的通道，总共三段推动。然后出现比较强劲的阳线反转。当价格运行到这里，灵敏的交易者可能已经开始评估大型趋势反转的可能性。毕竟第一个条件已经大致具备，明确的反转形态，三推的楔形底。而持续的K线数量充足，买压也渐渐显现。如果我们同样从回调发起通道阶段开始起算，23根K线里有12根是阳线。甚至过半了，证明多头已经有一定程度的影响力。那后续我们再看看其余条件能不能也一一具备？强劲的多头运动持续四根阳线后，似乎多少有突破趋势线的迹象，但又收了阴线。不过这算吗？我们能够算作条件二也集齐吗？好像有点模糊，对吧？有点心虚。没关系，我们重新描绘一下斜率，再看看后续能不能进一步突破。结果价格完成了向下的二推回调以后，又再一次磨磨蹭蹭的远离趋势线。并一次，两次，三次触及前波段高点，这将对空头造成一定程度的压力。为什么呢？我们也不厌其烦的再复习一次。在下降趋势中，空头会希望维护高点不断降低的规律。因为一旦高点失守，空头放置在前波段点上方的止损，就可能触发。照理来讲，为了捍卫原有的优势，他们应该要在这里积极入场，把价格向下打压才对。但反而三次测试，空头都没有把握机会。这会让原本期盼空头趋势继续维持，希望在这里看到某种双重顶熊旗的做空者失望。所以接下来是空头作为趋势方的最后一次机会。趋势线突破就算了，高点略微抬高也算了，如果你接下来能够强劲突破前波段低点。也就是原空头趋势的极值，那我就信你可以开启新的突破循环，前面一连串弱势的迹象。都只是你在休息。但测试到位以后，旋即没有跟进。从刚刚的空头趋势低点到这根阳线形成为止，这里光横向的段落就已经持续31根K线。是个令人困惑的区间，要么优势已经几乎完全丧失了。那接下来，要么代表市场找到了均衡打算，长久待在这里。要么多空继续吵出个所以然，发起新的突破。那最后是怎么样呢？确实发起的新的突破循环不过是上涨的。突破回调再突破。完成对突破点的测试之后，又进一步走出第二推。所以回顾整个过程，前面提示的所有要件都具备了。形态明确，1.买压充分。2.突破趋势线。3.威逼高点抬升以及4.测试原趋势极值却无法有效突破。整体看来，就完成了一个蛮漂亮的大型趋势反转。","p":"p334"}]},{"t":"para","text":"为了让大家有更具体的认识，我们再举例说明。从左到右，我们看到的是下降急速的发起，转入多空较为反复的通道，总共三段推动。然后出现比较强劲的阳线反转。当价格运行到这里，灵敏的交易者可能已经开始评估大型趋势反转的可能性。毕竟第一个条件已经大致具备，明确的反转形态，三推的楔形底。而持续的K线数量充足，买压也渐渐显现。如果我们同样从回调发起通道阶段开始起算，23根K线里有12根是阳线。甚至过半了，证明多头已经有一定程度的影响力。那后续我们再看看其余条件能不能也一一具备？强劲的多头运动持续四根阳线后，似乎多少有突破趋势线的迹象，但又收了阴线。不过这算吗？我们能够算作条件二也集齐吗？好像有点模糊，对吧？有点心虚。没关系，我们重新描绘一下斜率，再看看后续能不能进一步突破。结果价格完成了向下的二推回调以后，又再一次磨磨蹭蹭的远离趋势线。并一次，两次，三次触及前波段高点，这将对空头造成一定程度的压力。为什么呢？我们也不厌其烦的再复习一次。在下降趋势中，空头会希望维护高点不断降低的规律。因为一旦高点失守，空头放置在前波段点上方的止损，就可能触发。照理来讲，为了捍卫原有的优势，他们应该要在这里积极入场，把价格向下打压才对。但反而三次测试，空头都没有把握机会。这会让原本期盼空头趋势继续维持，希望在这里看到某种双重顶熊旗的做空者失望。所以接下来是空头作为趋势方的最后一次机会。趋势线突破就算了，高点略微抬高也算了，如果你接下来能够强劲突破前波段低点。也就是原空头趋势的极值，那我就信你可以开启新的突破循环，前面一连串弱势的迹象。都只是你在休息。但测试到位以后，旋即没有跟进。从刚刚的空头趋势低点到这根阳线形成为止，这里光横向的段落就已经持续31根K线。是个令人困惑的区间，要么优势已经几乎完全丧失了。那接下来，要么代表市场找到了均衡打算，长久待在这里。要么多空继续吵出个所以然，发起新的突破。那最后是怎么样呢？确实发起的新的突破循环不过是上涨的。突破回调再突破。完成对突破点的测试之后，又进一步走出第二推。所以回顾整个过程，前面提示的所有要件都具备了。形态明确，1.买压充分。2.突破趋势线。3.威逼高点抬升以及4.测试原趋势极值却无法有效突破。整体看来，就完成了一个蛮漂亮的大型趋势反转。","pid":"p334"},{"t":"img","src":"assets/img/l07A_099.webp","ilabel":"7-9","icap":"L07　反转逆势突破","fid":"fig99","ctx":[{"t":"为了让大家有更具体的认识，我们再举例说明。从左到右，我们看到的是下降急速的发起，转入多空较为反复的通道，总共三段推动。然后出现比较强劲的阳线反转。当价格运行到这里，灵敏的交易者可能已经开始评估大型趋势反转的可能性。毕竟第一个条件已经大致具备，明确的反转形态，三推的楔形底。而持续的K线数量充足，买压也渐渐显现。如果我们同样从回调发起通道阶段开始起算，23根K线里有12根是阳线。甚至过半了，证明多头已经有一定程度的影响力。那后续我们再看看其余条件能不能也一一具备？强劲的多头运动持续四根阳线后，似乎多少有突破趋势线的迹象，但又收了阴线。不过这算吗？我们能够算作条件二也集齐吗？好像有点模糊，对吧？有点心虚。没关系，我们重新描绘一下斜率，再看看后续能不能进一步突破。结果价格完成了向下的二推回调以后，又再一次磨磨蹭蹭的远离趋势线。并一次，两次，三次触及前波段高点，这将对空头造成一定程度的压力。为什么呢？我们也不厌其烦的再复习一次。在下降趋势中，空头会希望维护高点不断降低的规律。因为一旦高点失守，空头放置在前波段点上方的止损，就可能触发。照理来讲，为了捍卫原有的优势，他们应该要在这里积极入场，把价格向下打压才对。但反而三次测试，空头都没有把握机会。这会让原本期盼空头趋势继续维持，希望在这里看到某种双重顶熊旗的做空者失望。所以接下来是空头作为趋势方的最后一次机会。趋势线突破就算了，高点略微抬高也算了，如果你接下来能够强劲突破前波段低点。也就是原空头趋势的极值，那我就信你可以开启新的突破循环，前面一连串弱势的迹象。都只是你在休息。但测试到位以后，旋即没有跟进。从刚刚的空头趋势低点到这根阳线形成为止，这里光横向的段落就已经持续31根K线。是个令人困惑的区间，要么优势已经几乎完全丧失了。那接下来，要么代表市场找到了均衡打算，长久待在这里。要么多空继续吵出个所以然，发起新的突破。那最后是怎么样呢？确实发起的新的突破循环不过是上涨的。突破回调再突破。完成对突破点的测试之后，又进一步走出第二推。所以回顾整个过程，前面提示的所有要件都具备了。形态明确，1.买压充分。2.突破趋势线。3.威逼高点抬升以及4.测试原趋势极值却无法有效突破。整体看来，就完成了一个蛮漂亮的大型趋势反转。","p":"p334"},{"t":"经过前面的介绍，你已经知道大型趋势反转跟小型趋势反转，也就是暂时的回调有所区别。既然我们冠上了大型的前缀，那就暗示了我们预期的是一段可观的反向运动。多可观呢，我们保守一点，说是内含两段推动，大概持续20根K线的逆势运动。之所以是两推，你肯定很清楚是因为突破本来就倾向至少造就两段推动。而之所以我们不贪心的说三推四推，是因为第二推结束后还有没有办法再次开启新的突破循环。这其实很看后续行情的造化，我们难以在反转启动当下就有足够的资讯进行判断。那持续10几20根K线则需要在体型上有别于小型的暂时的五根，八根K线的局部回调。但反过来说，如果你要预期逆向的趋势开启，要内含至少两推持续超过10几20根K线。那这当然也大概不会是有一个小小的三根五根K线的形态引起的。这就是刚刚要向你强调逆向压力积累充分的原因。没有足够的说服过程，没有山雨欲来的充分酝酿，逆向趋势不会轻易形成。","p":"p335"},{"t":"目前为止，我们透过了两个比较清晰的例子去说明大型趋势反转的发生应该有哪些要件。你可能感到严苛，正在思考这些要件有没有松动或放宽的可能性。又或者你可能找得到一些例子来宣称不是所有反转都必须要具备以上条件。或者即使具备以上条件，也不一定能够反转成功。没错，我并无意要开一帖万灵丹告诉你，这是能够解释任何大型趋势反转的唯一标准。目前，作为课程的前段内容，我更想强调的是大型趋势反转的个中原理：趋势倾向延续，而反转倾向失败。没有各式各样明确充分具有说服力的证据，顺势交易者不会轻易退缩。而逆势交易者不会轻易夺权。所以，经过以上流程，我拆解了逆势方逐渐占据趋势的进程，提醒你最好把握这些原则。再去断定趋势逆转了没有？随后，我们继续延伸既有知识更细致的拆解一下反转发生的具体进程，以及反转发生以后，我们可以预期价格如何运动。","p":"p336"}]},{"t":"para","text":"经过前面的介绍，你已经知道大型趋势反转跟小型趋势反转，也就是暂时的回调有所区别。既然我们冠上了大型的前缀，那就暗示了我们预期的是一段可观的反向运动。多可观呢，我们保守一点，说是内含两段推动，大概持续20根K线的逆势运动。之所以是两推，你肯定很清楚是因为突破本来就倾向至少造就两段推动。而之所以我们不贪心的说三推四推，是因为第二推结束后还有没有办法再次开启新的突破循环。这其实很看后续行情的造化，我们难以在反转启动当下就有足够的资讯进行判断。那持续10几20根K线则需要在体型上有别于小型的暂时的五根，八根K线的局部回调。但反过来说，如果你要预期逆向的趋势开启，要内含至少两推持续超过10几20根K线。那这当然也大概不会是有一个小小的三根五根K线的形态引起的。这就是刚刚要向你强调逆向压力积累充分的原因。没有足够的说服过程，没有山雨欲来的充分酝酿，逆向趋势不会轻易形成。","pid":"p335"},{"t":"para","text":"目前为止，我们透过了两个比较清晰的例子去说明大型趋势反转的发生应该有哪些要件。你可能感到严苛，正在思考这些要件有没有松动或放宽的可能性。又或者你可能找得到一些例子来宣称不是所有反转都必须要具备以上条件。或者即使具备以上条件，也不一定能够反转成功。没错，我并无意要开一帖万灵丹告诉你，这是能够解释任何大型趋势反转的唯一标准。目前，作为课程的前段内容，我更想强调的是大型趋势反转的个中原理：趋势倾向延续，而反转倾向失败。没有各式各样明确充分具有说服力的证据，顺势交易者不会轻易退缩。而逆势交易者不会轻易夺权。所以，经过以上流程，我拆解了逆势方逐渐占据趋势的进程，提醒你最好把握这些原则。再去断定趋势逆转了没有？随后，我们继续延伸既有知识更细致的拆解一下反转发生的具体进程，以及反转发生以后，我们可以预期价格如何运动。","pid":"p336"}],"wcount":8350},{"id":"l07B","title":"第B段　反转逆势突破","blocks":[{"t":"para","text":"L07B 反转逆势突破","pid":"p337"},{"t":"para","text":"担心你观看这节课的时候已经跟上一节间隔比较久。我们再来找一个例子，承上启下，一边复习，一边引出后面的知识点。","pid":"p338"},{"t":"img","src":"assets/img/l07B_100.webp","ilabel":"7-10","icap":"L07　反转逆势突破","fid":"fig100","ctx":[{"t":"L07B 反转逆势突破","p":"p337"},{"t":"担心你观看这节课的时候已经跟上一节间隔比较久。我们再来找一个例子，承上启下，一边复习，一边引出后面的知识点。","p":"p338"},{"t":"这张图表显示的是上升趋势，转入均衡最终向下发展成通道的过程。前面的上涨曾经被一颗停顿的阴线给断开。但整体来说还是走得比较顺畅的，回调也是干净利落的二推运动，结束后收住强劲的阳线反转向上。但可惜的是，在原趋势极值之处，价格没有进一步往上穿越的意思，开始出现比较纠结的铁丝网样貌。然后以比较震荡的形式下跌去测试了刚刚第一次回调的低点。但你说多头很弱吗？好像也说不过去。这个低点是没有被测试到的，多头仍然有意维持上升的运动，后续也创造出强劲的阳线。但到了高处，又旋即没有跟进，给了卖压强力展现的机会。往左边快速数一下，从第一波回调的高点起算，已经有30根K线，确实已经超越了回调的标准成了区间。这时候多头很难再说自己占据优势了，尤其突破屡屡失败，又有熊旗的嫌疑。已经算是多空平衡。但下一根K线就很醒目了，一下子给了我们很多新的资讯。上一节我们谈大型趋势反转的要件，都是一个一个成立的。但在这里，趋势阴线的下破，既同时穿透了这条很平缓的上升趋势线，也触及了前波段低点。对多头来说是很糟糕的消息。如果你在这个时候则被提醒到好像有大型趋势反转成立的可能性。那回头回顾一下这整个区间，除了耗时过久30，加上这根31根K线。里头有18根阴线。晚近的这几根还很大，甚至都要比前面的任何一根阳线实体更长的样子。说形态嘛，你可以说这是三推的楔形顶。可以单独把这两个高点拎出来，说它是高点抬高的双重顶也可以。总之，耗时够久的反转形态有了，卖压也有了。这么看来，条件都差不多了。之后还有一次向上的测试，证明多头强势不在，价格就进一步下落。即便你说到了图表的尾巴，这轮下跌也不能算是非常急坠的样式，但高低点确实有降低的事实。也内含两推持续超过20根K线。我们后面才会讲反转交易的建仓方法。但无论你是在高处，就以比较左侧的方式入场。还是所有条件具足以后，等待这次突破测试后才决定建仓。即使是这种相对缓的趋势反转，也足以让你赚到理想的利润了。讲到这里，你或许也能够明白，明明反转是突破，是逆势方的突破成功，但为什么我不是选择接在突破的单元后面一并处理？而是要先带你走过对区间的认识。你可能多少听过一句交易领域的俗谚，“横有多长竖有多高”。我们要谈大型趋势反转，逆势压力的积累，要到充分的程度，确实往往需要进到一定程度的双边交易状态。所以检视区间作为反转的前哨，双边交易之中的多空意图往往是这样的。对多头来说，他们看见突破未能顺畅地发生，就会退缩。即使还是可能愿意在更深的回调中买入，但空头也嗅到了机会，不会轻易放弃积极进攻？双方你来我往边测试边寻找出手的空档。这样的行为模式自然而然在图表上呈现为区间。价格将在原趋势极值处屡遭抛售拦阻，但却又反复从前低点附近反弹回升。双方皆想要控制市场，互不相让，这将导致双方的突破尝试都有80%的几率以失败告终。而最后，若是逆势方站在最后的上风，那价格就反转进入深度的逆向运动。","p":"p339"}]},{"t":"para","text":"这张图表显示的是上升趋势，转入均衡最终向下发展成通道的过程。前面的上涨曾经被一颗停顿的阴线给断开。但整体来说还是走得比较顺畅的，回调也是干净利落的二推运动，结束后收住强劲的阳线反转向上。但可惜的是，在原趋势极值之处，价格没有进一步往上穿越的意思，开始出现比较纠结的铁丝网样貌。然后以比较震荡的形式下跌去测试了刚刚第一次回调的低点。但你说多头很弱吗？好像也说不过去。这个低点是没有被测试到的，多头仍然有意维持上升的运动，后续也创造出强劲的阳线。但到了高处，又旋即没有跟进，给了卖压强力展现的机会。往左边快速数一下，从第一波回调的高点起算，已经有30根K线，确实已经超越了回调的标准成了区间。这时候多头很难再说自己占据优势了，尤其突破屡屡失败，又有熊旗的嫌疑。已经算是多空平衡。但下一根K线就很醒目了，一下子给了我们很多新的资讯。上一节我们谈大型趋势反转的要件，都是一个一个成立的。但在这里，趋势阴线的下破，既同时穿透了这条很平缓的上升趋势线，也触及了前波段低点。对多头来说是很糟糕的消息。如果你在这个时候则被提醒到好像有大型趋势反转成立的可能性。那回头回顾一下这整个区间，除了耗时过久30，加上这根31根K线。里头有18根阴线。晚近的这几根还很大，甚至都要比前面的任何一根阳线实体更长的样子。说形态嘛，你可以说这是三推的楔形顶。可以单独把这两个高点拎出来，说它是高点抬高的双重顶也可以。总之，耗时够久的反转形态有了，卖压也有了。这么看来，条件都差不多了。之后还有一次向上的测试，证明多头强势不在，价格就进一步下落。即便你说到了图表的尾巴，这轮下跌也不能算是非常急坠的样式，但高低点确实有降低的事实。也内含两推持续超过20根K线。我们后面才会讲反转交易的建仓方法。但无论你是在高处，就以比较左侧的方式入场。还是所有条件具足以后，等待这次突破测试后才决定建仓。即使是这种相对缓的趋势反转，也足以让你赚到理想的利润了。讲到这里，你或许也能够明白，明明反转是突破，是逆势方的突破成功，但为什么我不是选择接在突破的单元后面一并处理？而是要先带你走过对区间的认识。你可能多少听过一句交易领域的俗谚，“横有多长竖有多高”。我们要谈大型趋势反转，逆势压力的积累，要到充分的程度，确实往往需要进到一定程度的双边交易状态。所以检视区间作为反转的前哨，双边交易之中的多空意图往往是这样的。对多头来说，他们看见突破未能顺畅地发生，就会退缩。即使还是可能愿意在更深的回调中买入，但空头也嗅到了机会，不会轻易放弃积极进攻？双方你来我往边测试边寻找出手的空档。这样的行为模式自然而然在图表上呈现为区间。价格将在原趋势极值处屡遭抛售拦阻，但却又反复从前低点附近反弹回升。双方皆想要控制市场，互不相让，这将导致双方的突破尝试都有80%的几率以失败告终。而最后，若是逆势方站在最后的上风，那价格就反转进入深度的逆向运动。","pid":"p339"},{"t":"img","src":"assets/img/l07B_101.webp","ilabel":"7-11","icap":"L07　反转逆势突破","fid":"fig101","ctx":[{"t":"这张图表显示的是上升趋势，转入均衡最终向下发展成通道的过程。前面的上涨曾经被一颗停顿的阴线给断开。但整体来说还是走得比较顺畅的，回调也是干净利落的二推运动，结束后收住强劲的阳线反转向上。但可惜的是，在原趋势极值之处，价格没有进一步往上穿越的意思，开始出现比较纠结的铁丝网样貌。然后以比较震荡的形式下跌去测试了刚刚第一次回调的低点。但你说多头很弱吗？好像也说不过去。这个低点是没有被测试到的，多头仍然有意维持上升的运动，后续也创造出强劲的阳线。但到了高处，又旋即没有跟进，给了卖压强力展现的机会。往左边快速数一下，从第一波回调的高点起算，已经有30根K线，确实已经超越了回调的标准成了区间。这时候多头很难再说自己占据优势了，尤其突破屡屡失败，又有熊旗的嫌疑。已经算是多空平衡。但下一根K线就很醒目了，一下子给了我们很多新的资讯。上一节我们谈大型趋势反转的要件，都是一个一个成立的。但在这里，趋势阴线的下破，既同时穿透了这条很平缓的上升趋势线，也触及了前波段低点。对多头来说是很糟糕的消息。如果你在这个时候则被提醒到好像有大型趋势反转成立的可能性。那回头回顾一下这整个区间，除了耗时过久30，加上这根31根K线。里头有18根阴线。晚近的这几根还很大，甚至都要比前面的任何一根阳线实体更长的样子。说形态嘛，你可以说这是三推的楔形顶。可以单独把这两个高点拎出来，说它是高点抬高的双重顶也可以。总之，耗时够久的反转形态有了，卖压也有了。这么看来，条件都差不多了。之后还有一次向上的测试，证明多头强势不在，价格就进一步下落。即便你说到了图表的尾巴，这轮下跌也不能算是非常急坠的样式，但高低点确实有降低的事实。也内含两推持续超过20根K线。我们后面才会讲反转交易的建仓方法。但无论你是在高处，就以比较左侧的方式入场。还是所有条件具足以后，等待这次突破测试后才决定建仓。即使是这种相对缓的趋势反转，也足以让你赚到理想的利润了。讲到这里，你或许也能够明白，明明反转是突破，是逆势方的突破成功，但为什么我不是选择接在突破的单元后面一并处理？而是要先带你走过对区间的认识。你可能多少听过一句交易领域的俗谚，“横有多长竖有多高”。我们要谈大型趋势反转，逆势压力的积累，要到充分的程度，确实往往需要进到一定程度的双边交易状态。所以检视区间作为反转的前哨，双边交易之中的多空意图往往是这样的。对多头来说，他们看见突破未能顺畅地发生，就会退缩。即使还是可能愿意在更深的回调中买入，但空头也嗅到了机会，不会轻易放弃积极进攻？双方你来我往边测试边寻找出手的空档。这样的行为模式自然而然在图表上呈现为区间。价格将在原趋势极值处屡遭抛售拦阻，但却又反复从前低点附近反弹回升。双方皆想要控制市场，互不相让，这将导致双方的突破尝试都有80%的几率以失败告终。而最后，若是逆势方站在最后的上风，那价格就反转进入深度的逆向运动。","p":"p339"},{"t":"现在显示在画面上的是香港恒生指数1季级别的图表。画面从左到右涵盖了2006年以来的行情。把这张图表放在我们反转的单元里面谈，是为了要揭示一种与前述提到的渐进发生的大型趋势反转。不一样的启动模式，也就是急涨急跌的类型。你可以很明显的看到它所显示的所有反转，好像不见得有前面提到的那种渐进的缓慢说服的过程，而是突然就逆向的展开了快速的运动。没错，这是大型趋势反转的另一种形式，由高潮所引发。我们接着来谈谈，这是怎么一回事？什么叫做高潮？","p":"p340"}]},{"t":"para","text":"现在显示在画面上的是香港恒生指数1季级别的图表。画面从左到右涵盖了2006年以来的行情。把这张图表放在我们反转的单元里面谈，是为了要揭示一种与前述提到的渐进发生的大型趋势反转。不一样的启动模式，也就是急涨急跌的类型。你可以很明显的看到它所显示的所有反转，好像不见得有前面提到的那种渐进的缓慢说服的过程，而是突然就逆向的展开了快速的运动。没错，这是大型趋势反转的另一种形式，由高潮所引发。我们接着来谈谈，这是怎么一回事？什么叫做高潮？","pid":"p340"},{"t":"img","src":"assets/img/l07B_102.webp","ilabel":"7-12","icap":"L07　反转逆势突破","fid":"fig102","ctx":[{"t":"现在显示在画面上的是香港恒生指数1季级别的图表。画面从左到右涵盖了2006年以来的行情。把这张图表放在我们反转的单元里面谈，是为了要揭示一种与前述提到的渐进发生的大型趋势反转。不一样的启动模式，也就是急涨急跌的类型。你可以很明显的看到它所显示的所有反转，好像不见得有前面提到的那种渐进的缓慢说服的过程，而是突然就逆向的展开了快速的运动。没错，这是大型趋势反转的另一种形式，由高潮所引发。我们接着来谈谈，这是怎么一回事？什么叫做高潮？","p":"p340"},{"t":"如果你是第一次接触到这个词，尤其没见过原文这个单字，那光听其名，可能觉得费解。那么我们就来看看地表最强需要付费订阅的牛津英语词典是如何解释它的。这里写：即某一件事情的最高点，顶峰，顶点，电影，竞赛中最重要，最令人兴奋的部分，（重点来了）通常发生在接近尾声之时。用在交易的语境，阿尔布鲁克斯用高潮这个词汇来指称在趋势末期发生的突破。但它可能不是具有续航力的突破，反而随之而来的是趋势的停止，市场可能进入横向或逆向的运动。那为什么明明看上去非常强劲，我们不说它是突破，而是要强调它高潮可能衰竭的面相呢？学过区间，学过第二推陷阱的，你应该很快能够自行类推扩张意会到它的意思。加速的运动有时候具有欺骗性的外观。实际上，力竭以后就会陷入停顿。而通常在一轮持续已久的趋势中，多空双方都在期待出现一次非比寻常的强势运行。其作为衰竭性高潮，将引发耗时长久的休止，或是开启逆向运动。趁着这样的高潮，顺势方喜闻乐见，会把握能以非常好的价格止盈的机会。而逆势方也欢天喜地，在同样非常好的价格逆势减仓。","p":"p341"}]},{"t":"para","text":"如果你是第一次接触到这个词，尤其没见过原文这个单字，那光听其名，可能觉得费解。那么我们就来看看地表最强需要付费订阅的牛津英语词典是如何解释它的。这里写：即某一件事情的最高点，顶峰，顶点，电影，竞赛中最重要，最令人兴奋的部分，（重点来了）通常发生在接近尾声之时。用在交易的语境，阿尔布鲁克斯用高潮这个词汇来指称在趋势末期发生的突破。但它可能不是具有续航力的突破，反而随之而来的是趋势的停止，市场可能进入横向或逆向的运动。那为什么明明看上去非常强劲，我们不说它是突破，而是要强调它高潮可能衰竭的面相呢？学过区间，学过第二推陷阱的，你应该很快能够自行类推扩张意会到它的意思。加速的运动有时候具有欺骗性的外观。实际上，力竭以后就会陷入停顿。而通常在一轮持续已久的趋势中，多空双方都在期待出现一次非比寻常的强势运行。其作为衰竭性高潮，将引发耗时长久的休止，或是开启逆向运动。趁着这样的高潮，顺势方喜闻乐见，会把握能以非常好的价格止盈的机会。而逆势方也欢天喜地，在同样非常好的价格逆势减仓。","pid":"p341"},{"t":"img","src":"assets/img/l07B_103.webp","ilabel":"7-13","icap":"L07　反转逆势突破","fid":"fig103","ctx":[{"t":"如果你是第一次接触到这个词，尤其没见过原文这个单字，那光听其名，可能觉得费解。那么我们就来看看地表最强需要付费订阅的牛津英语词典是如何解释它的。这里写：即某一件事情的最高点，顶峰，顶点，电影，竞赛中最重要，最令人兴奋的部分，（重点来了）通常发生在接近尾声之时。用在交易的语境，阿尔布鲁克斯用高潮这个词汇来指称在趋势末期发生的突破。但它可能不是具有续航力的突破，反而随之而来的是趋势的停止，市场可能进入横向或逆向的运动。那为什么明明看上去非常强劲，我们不说它是突破，而是要强调它高潮可能衰竭的面相呢？学过区间，学过第二推陷阱的，你应该很快能够自行类推扩张意会到它的意思。加速的运动有时候具有欺骗性的外观。实际上，力竭以后就会陷入停顿。而通常在一轮持续已久的趋势中，多空双方都在期待出现一次非比寻常的强势运行。其作为衰竭性高潮，将引发耗时长久的休止，或是开启逆向运动。趁着这样的高潮，顺势方喜闻乐见，会把握能以非常好的价格止盈的机会。而逆势方也欢天喜地，在同样非常好的价格逆势减仓。","p":"p341"},{"t":"我们再次搬出比特币作为例子。同样是三天级别的图表，但呈现的是2022下半年价格在谷底的这个段落。你可能不难发现，强劲下跌以后进入熊旗调整。但对熊旗的突破却没有强势的延续，最后是演变成一个漫长的区间。然后最后对这个区间发生了一次相对更强劲的下跌。是进入整理以来最强的，连续两根K线的空头动能。但怎么样越过原趋势极值以后，又旋即没有跟进，又再次进入静默的区间整理？对于这段下跌所起到的作用与意义，可能有很多种解释。比如，相对于左边这个低点，它创造了一个双重底，可以说这是对它的过冲测试。也可以认为，这个双重底的右峰是由一个三推的楔形底组成。反转开始的位置是三推通道线与横向波段点的交叠之处。你也可以说这是对区间的突破失败导致的。该区间作为趋势末尾的一次无法引出成功延续的调整，成了所谓的末端旗型。或者更细一点去拆解，认为末端旗型也可以判定为这波下跌中的最后一个小熊旗。以上都行，但重点是这次看似强劲的突破，最终未能发挥它的作用。我们说这样的加速运动将极坠的天鹅绝唱，是导致大型趋势反转的高潮运动。它的终点也往往是某个支撑或阻力。或者反过来说，如果你看到价格快速逼近支撑阻力，却没有后续，那它就很可能是高潮运动，而将导致某种程度的停顿或反转。","p":"p342"}]},{"t":"para","text":"我们再次搬出比特币作为例子。同样是三天级别的图表，但呈现的是2022下半年价格在谷底的这个段落。你可能不难发现，强劲下跌以后进入熊旗调整。但对熊旗的突破却没有强势的延续，最后是演变成一个漫长的区间。然后最后对这个区间发生了一次相对更强劲的下跌。是进入整理以来最强的，连续两根K线的空头动能。但怎么样越过原趋势极值以后，又旋即没有跟进，又再次进入静默的区间整理？对于这段下跌所起到的作用与意义，可能有很多种解释。比如，相对于左边这个低点，它创造了一个双重底，可以说这是对它的过冲测试。也可以认为，这个双重底的右峰是由一个三推的楔形底组成。反转开始的位置是三推通道线与横向波段点的交叠之处。你也可以说这是对区间的突破失败导致的。该区间作为趋势末尾的一次无法引出成功延续的调整，成了所谓的末端旗型。或者更细一点去拆解，认为末端旗型也可以判定为这波下跌中的最后一个小熊旗。以上都行，但重点是这次看似强劲的突破，最终未能发挥它的作用。我们说这样的加速运动将极坠的天鹅绝唱，是导致大型趋势反转的高潮运动。它的终点也往往是某个支撑或阻力。或者反过来说，如果你看到价格快速逼近支撑阻力，却没有后续，那它就很可能是高潮运动，而将导致某种程度的停顿或反转。","pid":"p342"},{"t":"img","src":"assets/img/l07B_104.webp","ilabel":"7-14","icap":"L07　反转逆势突破","fid":"fig104","ctx":[{"t":"我们再次搬出比特币作为例子。同样是三天级别的图表，但呈现的是2022下半年价格在谷底的这个段落。你可能不难发现，强劲下跌以后进入熊旗调整。但对熊旗的突破却没有强势的延续，最后是演变成一个漫长的区间。然后最后对这个区间发生了一次相对更强劲的下跌。是进入整理以来最强的，连续两根K线的空头动能。但怎么样越过原趋势极值以后，又旋即没有跟进，又再次进入静默的区间整理？对于这段下跌所起到的作用与意义，可能有很多种解释。比如，相对于左边这个低点，它创造了一个双重底，可以说这是对它的过冲测试。也可以认为，这个双重底的右峰是由一个三推的楔形底组成。反转开始的位置是三推通道线与横向波段点的交叠之处。你也可以说这是对区间的突破失败导致的。该区间作为趋势末尾的一次无法引出成功延续的调整，成了所谓的末端旗型。或者更细一点去拆解，认为末端旗型也可以判定为这波下跌中的最后一个小熊旗。以上都行，但重点是这次看似强劲的突破，最终未能发挥它的作用。我们说这样的加速运动将极坠的天鹅绝唱，是导致大型趋势反转的高潮运动。它的终点也往往是某个支撑或阻力。或者反过来说，如果你看到价格快速逼近支撑阻力，却没有后续，那它就很可能是高潮运动，而将导致某种程度的停顿或反转。","p":"p342"},{"t":"这个例子可能看上去更明显。画面中段有一个下跌的通道，但持续已久以后居然又有另一段斜率更陡，动能更强的下跌产生。快速过冲通道线，直奔图表底部。用上前面单元的知识，这同时是失效的朝非预期方向运动的失败的牛旗。因而引发踏空的空头追进，被套了多头止损，给下跌加满了燃料。同时，为什么这个游戏会失败？可能是什么因素导致的呢？因为它向下回调的持续时间太长，默默的对前面的上升趋势蚕食鲸吞，因而是为无尽回调。这会让多头的优势丧失怠尽，甚至轻微偏向空头。那最后一段的急坠以区间的角度看待，它也可以被认为是区间内部的第二推陷阱。加速向下创造了要突破前低点的假象，却旋即没有跟进。于是我们不禁怀疑，多头是不是知道，反正这段下跌如此绵长，左边的上涨过程里也没有明显的波段点作为支撑。能让弟兄们背靠着入场。那他估计应该还有的跌。既然还有的跌，那为什么我要在过程中接刀押注价格凭空反转呢？而不是在明显会有空头买入止盈，而多头盟友也认为划算的价格再部署买单。这样的心理活动让他们选择在下方守株待兔。却也因为他们在这个段落中的缺席，而让价格能够不受阻抗的下坠。于是我们说，这同时也是买单相对真空而导致的高潮行情。由于缺乏跟进，他更有衰竭的性格。后续就开启了新的上涨突破循环。那无论是刚刚看到的这个例子，还是其他很容易找到的类似例子。我们都不难发现，他们有些共同的特征，现在一并整理给你。","p":"p343"}]},{"t":"para","text":"这个例子可能看上去更明显。画面中段有一个下跌的通道，但持续已久以后居然又有另一段斜率更陡，动能更强的下跌产生。快速过冲通道线，直奔图表底部。用上前面单元的知识，这同时是失效的朝非预期方向运动的失败的牛旗。因而引发踏空的空头追进，被套了多头止损，给下跌加满了燃料。同时，为什么这个游戏会失败？可能是什么因素导致的呢？因为它向下回调的持续时间太长，默默的对前面的上升趋势蚕食鲸吞，因而是为无尽回调。这会让多头的优势丧失怠尽，甚至轻微偏向空头。那最后一段的急坠以区间的角度看待，它也可以被认为是区间内部的第二推陷阱。加速向下创造了要突破前低点的假象，却旋即没有跟进。于是我们不禁怀疑，多头是不是知道，反正这段下跌如此绵长，左边的上涨过程里也没有明显的波段点作为支撑。能让弟兄们背靠着入场。那他估计应该还有的跌。既然还有的跌，那为什么我要在过程中接刀押注价格凭空反转呢？而不是在明显会有空头买入止盈，而多头盟友也认为划算的价格再部署买单。这样的心理活动让他们选择在下方守株待兔。却也因为他们在这个段落中的缺席，而让价格能够不受阻抗的下坠。于是我们说，这同时也是买单相对真空而导致的高潮行情。由于缺乏跟进，他更有衰竭的性格。后续就开启了新的上涨突破循环。那无论是刚刚看到的这个例子，还是其他很容易找到的类似例子。我们都不难发现，他们有些共同的特征，现在一并整理给你。","pid":"p343"},{"t":"img","src":"assets/img/l07B_105.webp","ilabel":"7-15","icap":"L07　反转逆势突破","fid":"fig105","ctx":[{"t":"这个例子可能看上去更明显。画面中段有一个下跌的通道，但持续已久以后居然又有另一段斜率更陡，动能更强的下跌产生。快速过冲通道线，直奔图表底部。用上前面单元的知识，这同时是失效的朝非预期方向运动的失败的牛旗。因而引发踏空的空头追进，被套了多头止损，给下跌加满了燃料。同时，为什么这个游戏会失败？可能是什么因素导致的呢？因为它向下回调的持续时间太长，默默的对前面的上升趋势蚕食鲸吞，因而是为无尽回调。这会让多头的优势丧失怠尽，甚至轻微偏向空头。那最后一段的急坠以区间的角度看待，它也可以被认为是区间内部的第二推陷阱。加速向下创造了要突破前低点的假象，却旋即没有跟进。于是我们不禁怀疑，多头是不是知道，反正这段下跌如此绵长，左边的上涨过程里也没有明显的波段点作为支撑。能让弟兄们背靠着入场。那他估计应该还有的跌。既然还有的跌，那为什么我要在过程中接刀押注价格凭空反转呢？而不是在明显会有空头买入止盈，而多头盟友也认为划算的价格再部署买单。这样的心理活动让他们选择在下方守株待兔。却也因为他们在这个段落中的缺席，而让价格能够不受阻抗的下坠。于是我们说，这同时也是买单相对真空而导致的高潮行情。由于缺乏跟进，他更有衰竭的性格。后续就开启了新的上涨突破循环。那无论是刚刚看到的这个例子，还是其他很容易找到的类似例子。我们都不难发现，他们有些共同的特征，现在一并整理给你。","p":"p343"},{"t":"比如，以后见知名而言，就如刚刚我们看牛津英语词典所说的，他们通常坐落于趋势的末端。同时，我们都说反转不会无缘无故发生。必定是给到反向订单充分的理由介入。于是反转也通常坐落于某个支撑阻力之上。关于支撑阻力的详细内容，后面会有专门的单元进行处理。你可以先理解强劲趋势K线的终点，越是存在清晰的，重大的支撑阻力。那它是高潮运动的可能性就越高，越可能导致某种程度的停顿或者反转。但当然不是碰触到任何支撑阻力，价格就必然大幅反向运动，对吧？尤其是那些比较模糊，比较刺激的。所以，作为另一层滤网，失去跟进是一个重要的要件。在看到动能停顿开始小幅或大幅反向运动以前，请千万不要用限价订单介入。否则就真的是在接刀。同时，也因为支撑阻力的作用，如果你发现价格急奔到某个波段点，无任何形式的可能积聚，大量反向订单的位置。那你也可以顺便检查现在有没有可能是处于区间的脉络之中？是的话，区间倾向突破失败，对吧？这个异常强劲的运动就可能是第二推陷阱。交易者不应该被看似强劲的外观所欺骗。","p":"p344"}]},{"t":"para","text":"比如，以后见知名而言，就如刚刚我们看牛津英语词典所说的，他们通常坐落于趋势的末端。同时，我们都说反转不会无缘无故发生。必定是给到反向订单充分的理由介入。于是反转也通常坐落于某个支撑阻力之上。关于支撑阻力的详细内容，后面会有专门的单元进行处理。你可以先理解强劲趋势K线的终点，越是存在清晰的，重大的支撑阻力。那它是高潮运动的可能性就越高，越可能导致某种程度的停顿或者反转。但当然不是碰触到任何支撑阻力，价格就必然大幅反向运动，对吧？尤其是那些比较模糊，比较刺激的。所以，作为另一层滤网，失去跟进是一个重要的要件。在看到动能停顿开始小幅或大幅反向运动以前，请千万不要用限价订单介入。否则就真的是在接刀。同时，也因为支撑阻力的作用，如果你发现价格急奔到某个波段点，无任何形式的可能积聚，大量反向订单的位置。那你也可以顺便检查现在有没有可能是处于区间的脉络之中？是的话，区间倾向突破失败，对吧？这个异常强劲的运动就可能是第二推陷阱。交易者不应该被看似强劲的外观所欺骗。","pid":"p344"},{"t":"img","src":"assets/img/l07B_106.webp","ilabel":"7-16","icap":"L07　反转逆势突破","fid":"fig106","ctx":[{"t":"比如，以后见知名而言，就如刚刚我们看牛津英语词典所说的，他们通常坐落于趋势的末端。同时，我们都说反转不会无缘无故发生。必定是给到反向订单充分的理由介入。于是反转也通常坐落于某个支撑阻力之上。关于支撑阻力的详细内容，后面会有专门的单元进行处理。你可以先理解强劲趋势K线的终点，越是存在清晰的，重大的支撑阻力。那它是高潮运动的可能性就越高，越可能导致某种程度的停顿或者反转。但当然不是碰触到任何支撑阻力，价格就必然大幅反向运动，对吧？尤其是那些比较模糊，比较刺激的。所以，作为另一层滤网，失去跟进是一个重要的要件。在看到动能停顿开始小幅或大幅反向运动以前，请千万不要用限价订单介入。否则就真的是在接刀。同时，也因为支撑阻力的作用，如果你发现价格急奔到某个波段点，无任何形式的可能积聚，大量反向订单的位置。那你也可以顺便检查现在有没有可能是处于区间的脉络之中？是的话，区间倾向突破失败，对吧？这个异常强劲的运动就可能是第二推陷阱。交易者不应该被看似强劲的外观所欺骗。","p":"p344"},{"t":"最后也补充一下，由于它的外观是加速的运动，所以斜率会有陡增的现象。用阿尔布鲁克斯的话来说，这叫做抛物线行情。这样叫它基本跟高潮运动无异，只是这个称呼更形象的描述了它的外形。同时，更常被它提起的是所谓抛物线楔形，也就是高潮运动的一种特定类型。不太具有我们想象的那种收敛的楔形外观，但内含同向的三段推动，动能异常强劲。所以其实就本质层次来说，都大同小异，只是里头价格运动段数的差别而已。总之，掌握以上特点，你就能够学会警惕运动过快的加速轨迹，即使不马上找到反手交易的理由。也可以先意识到，应该要谨慎管理已有的持仓。看看是不是要在价格接触可能刹停的支撑阻力时，就先止盈观望。看到这里，可能有些朋友已经迫不及待的要据此交易了。似乎条件都已经给的很严格，利用高潮行情抓到大型趋势反转是胸有成竹。但其实还是要向你泼一点冷水。高潮只是大型趋势反转的其中一种触发方式。它并不必然导致大型趋势反转。这就好比英雄可能有穿披风，但穿披风的不必然是英雄，可能只是很中二。所以请务必确定自己知道以下的内容。","p":"p345"}]},{"t":"para","text":"最后也补充一下，由于它的外观是加速的运动，所以斜率会有陡增的现象。用阿尔布鲁克斯的话来说，这叫做抛物线行情。这样叫它基本跟高潮运动无异，只是这个称呼更形象的描述了它的外形。同时，更常被它提起的是所谓抛物线楔形，也就是高潮运动的一种特定类型。不太具有我们想象的那种收敛的楔形外观，但内含同向的三段推动，动能异常强劲。所以其实就本质层次来说，都大同小异，只是里头价格运动段数的差别而已。总之，掌握以上特点，你就能够学会警惕运动过快的加速轨迹，即使不马上找到反手交易的理由。也可以先意识到，应该要谨慎管理已有的持仓。看看是不是要在价格接触可能刹停的支撑阻力时，就先止盈观望。看到这里，可能有些朋友已经迫不及待的要据此交易了。似乎条件都已经给的很严格，利用高潮行情抓到大型趋势反转是胸有成竹。但其实还是要向你泼一点冷水。高潮只是大型趋势反转的其中一种触发方式。它并不必然导致大型趋势反转。这就好比英雄可能有穿披风，但穿披风的不必然是英雄，可能只是很中二。所以请务必确定自己知道以下的内容。","pid":"p345"},{"t":"img","src":"assets/img/l07B_107.webp","ilabel":"7-17","icap":"L07　反转逆势突破","fid":"fig107","ctx":[{"t":"最后也补充一下，由于它的外观是加速的运动，所以斜率会有陡增的现象。用阿尔布鲁克斯的话来说，这叫做抛物线行情。这样叫它基本跟高潮运动无异，只是这个称呼更形象的描述了它的外形。同时，更常被它提起的是所谓抛物线楔形，也就是高潮运动的一种特定类型。不太具有我们想象的那种收敛的楔形外观，但内含同向的三段推动，动能异常强劲。所以其实就本质层次来说，都大同小异，只是里头价格运动段数的差别而已。总之，掌握以上特点，你就能够学会警惕运动过快的加速轨迹，即使不马上找到反手交易的理由。也可以先意识到，应该要谨慎管理已有的持仓。看看是不是要在价格接触可能刹停的支撑阻力时，就先止盈观望。看到这里，可能有些朋友已经迫不及待的要据此交易了。似乎条件都已经给的很严格，利用高潮行情抓到大型趋势反转是胸有成竹。但其实还是要向你泼一点冷水。高潮只是大型趋势反转的其中一种触发方式。它并不必然导致大型趋势反转。这就好比英雄可能有穿披风，但穿披风的不必然是英雄，可能只是很中二。所以请务必确定自己知道以下的内容。","p":"p345"},{"t":"即使在趋势末期出现高潮行情，其后也可能继续突破长久持续的维持高潮状态。也就是遇到连续高潮的情况。交易者应该要意识到，这可能是更大时间级别的急速突破运动，而不要在当前的时间级别图表上坚持进行反转交易。又或者相当类似的另一种情况，它没有刚刚说的连续高潮那么强劲，但是依然会进入一些回调。不过，回调这仅仅是很不可观的小型趋势反转。高潮后紧接三五根，顶多十根K线的回调，而后就又恢复原趋势。那在更大时间级别图表上，这也是强劲的趋势类型，只是稍微弱了一点，可能呈现窄幅通道的外观。","p":"p346"}]},{"t":"para","text":"即使在趋势末期出现高潮行情，其后也可能继续突破长久持续的维持高潮状态。也就是遇到连续高潮的情况。交易者应该要意识到，这可能是更大时间级别的急速突破运动，而不要在当前的时间级别图表上坚持进行反转交易。又或者相当类似的另一种情况，它没有刚刚说的连续高潮那么强劲，但是依然会进入一些回调。不过，回调这仅仅是很不可观的小型趋势反转。高潮后紧接三五根，顶多十根K线的回调，而后就又恢复原趋势。那在更大时间级别图表上，这也是强劲的趋势类型，只是稍微弱了一点，可能呈现窄幅通道的外观。","pid":"p346"},{"t":"img","src":"assets/img/l07B_108.webp","ilabel":"7-18","icap":"L07　反转逆势突破","fid":"fig108","ctx":[{"t":"即使在趋势末期出现高潮行情，其后也可能继续突破长久持续的维持高潮状态。也就是遇到连续高潮的情况。交易者应该要意识到，这可能是更大时间级别的急速突破运动，而不要在当前的时间级别图表上坚持进行反转交易。又或者相当类似的另一种情况，它没有刚刚说的连续高潮那么强劲，但是依然会进入一些回调。不过，回调这仅仅是很不可观的小型趋势反转。高潮后紧接三五根，顶多十根K线的回调，而后就又恢复原趋势。那在更大时间级别图表上，这也是强劲的趋势类型，只是稍微弱了一点，可能呈现窄幅通道的外观。","p":"p346"},{"t":"关于高潮后不见得立即反转，这可能是个不错的例子。价格在画面的左下角，原本只是一个缓慢的上升通道。相比于前面的大阴线，甚至有熊旗可能引发继续下跌的意思，但最后选择向上突破。如我们先前说的，旗型朝意外方向突破，可能迫使踏空与被套的人进行顺势交易的紧急处置，对吧？这就是这根大阳线的形成逻辑。但相较于这个上升通道本身，它看起来也像是某种加速的抛物线的运动，我们会怀疑它还能不能有后续。如果你已经有了，这是高潮，必定开始反转的刻板印象，甚至说太武断的错误印象。那你很可能在收线以后迫不及待反手做空。但实际上，只要它没有明确撞在阻力之上，后续也还有跟进。它就可能不过是一次强劲的突破，后面还有延续行情。所以如你所见，这反而开启了新的急速与通道行情。直到形成熊旗之后，才开始转跌。后续这轮大型趋势反转，这又正好是我们前面讨论的渐进式发生的大型趋势反转。","p":"p347"},{"t":"卖压累积充分之后突破趋势线，挑战上升趋势低点，测试原趋势极值不及，然后继续下落。即使后续并没有完整吞没前面的所有上升行情。但在过程中建仓，无论是在旗型的通道线被突破失败后入场。还是在趋势线徒步回调后，争取第二推的利润。都早已能够提供波段级别的两倍以上盈亏比的利润，这对交易者来说已经足够。于是拉回我们对高潮的讨论。虽然高潮行情难以持续是正确的说法。但交易者不应该将高潮与大型趋势反转，必然的联想在一起。而是仅将高潮所能产生的结果，只挂钩，只限定在顺势交易者，可能会先等待片刻才考虑重新入场。考虑重新入场，不代表必不入场，不代表他们会等待非常久以后才入场。更不代表必将倒戈执行逆势交易。遂此暂停，以后还继续出现高潮行情或稍微弱势一点的趋势延续，也是合理的。","p":"p348"}]},{"t":"para","text":"关于高潮后不见得立即反转，这可能是个不错的例子。价格在画面的左下角，原本只是一个缓慢的上升通道。相比于前面的大阴线，甚至有熊旗可能引发继续下跌的意思，但最后选择向上突破。如我们先前说的，旗型朝意外方向突破，可能迫使踏空与被套的人进行顺势交易的紧急处置，对吧？这就是这根大阳线的形成逻辑。但相较于这个上升通道本身，它看起来也像是某种加速的抛物线的运动，我们会怀疑它还能不能有后续。如果你已经有了，这是高潮，必定开始反转的刻板印象，甚至说太武断的错误印象。那你很可能在收线以后迫不及待反手做空。但实际上，只要它没有明确撞在阻力之上，后续也还有跟进。它就可能不过是一次强劲的突破，后面还有延续行情。所以如你所见，这反而开启了新的急速与通道行情。直到形成熊旗之后，才开始转跌。后续这轮大型趋势反转，这又正好是我们前面讨论的渐进式发生的大型趋势反转。","pid":"p347"},{"t":"para","text":"卖压累积充分之后突破趋势线，挑战上升趋势低点，测试原趋势极值不及，然后继续下落。即使后续并没有完整吞没前面的所有上升行情。但在过程中建仓，无论是在旗型的通道线被突破失败后入场。还是在趋势线徒步回调后，争取第二推的利润。都早已能够提供波段级别的两倍以上盈亏比的利润，这对交易者来说已经足够。于是拉回我们对高潮的讨论。虽然高潮行情难以持续是正确的说法。但交易者不应该将高潮与大型趋势反转，必然的联想在一起。而是仅将高潮所能产生的结果，只挂钩，只限定在顺势交易者，可能会先等待片刻才考虑重新入场。考虑重新入场，不代表必不入场，不代表他们会等待非常久以后才入场。更不代表必将倒戈执行逆势交易。遂此暂停，以后还继续出现高潮行情或稍微弱势一点的趋势延续，也是合理的。","pid":"p348"},{"t":"img","src":"assets/img/l07B_109.webp","ilabel":"7-19","icap":"L07　反转逆势突破","fid":"fig109","ctx":[{"t":"关于高潮后不见得立即反转，这可能是个不错的例子。价格在画面的左下角，原本只是一个缓慢的上升通道。相比于前面的大阴线，甚至有熊旗可能引发继续下跌的意思，但最后选择向上突破。如我们先前说的，旗型朝意外方向突破，可能迫使踏空与被套的人进行顺势交易的紧急处置，对吧？这就是这根大阳线的形成逻辑。但相较于这个上升通道本身，它看起来也像是某种加速的抛物线的运动，我们会怀疑它还能不能有后续。如果你已经有了，这是高潮，必定开始反转的刻板印象，甚至说太武断的错误印象。那你很可能在收线以后迫不及待反手做空。但实际上，只要它没有明确撞在阻力之上，后续也还有跟进。它就可能不过是一次强劲的突破，后面还有延续行情。所以如你所见，这反而开启了新的急速与通道行情。直到形成熊旗之后，才开始转跌。后续这轮大型趋势反转，这又正好是我们前面讨论的渐进式发生的大型趋势反转。","p":"p347"},{"t":"卖压累积充分之后突破趋势线，挑战上升趋势低点，测试原趋势极值不及，然后继续下落。即使后续并没有完整吞没前面的所有上升行情。但在过程中建仓，无论是在旗型的通道线被突破失败后入场。还是在趋势线徒步回调后，争取第二推的利润。都早已能够提供波段级别的两倍以上盈亏比的利润，这对交易者来说已经足够。于是拉回我们对高潮的讨论。虽然高潮行情难以持续是正确的说法。但交易者不应该将高潮与大型趋势反转，必然的联想在一起。而是仅将高潮所能产生的结果，只挂钩，只限定在顺势交易者，可能会先等待片刻才考虑重新入场。考虑重新入场，不代表必不入场，不代表他们会等待非常久以后才入场。更不代表必将倒戈执行逆势交易。遂此暂停，以后还继续出现高潮行情或稍微弱势一点的趋势延续，也是合理的。","p":"p348"},{"t":"那接着我们话说回来，前面提到的香港恒生指数的图表。2018年初的这个高点可以完美结合，前面说到的大型趋势反转可能由渐进累积的形式构成。也可能在最后由高潮所驱动，当压垮骆驼的最后一根稻草。可以看到，价格从2008年止跌回升以后，价格进入了漫长的上升通道，内部是急速，通道，回调，接着恢复上涨。但动能疲弱，只持续到略略翻越原趋势极值，就有急转直下。不过低点没有降低，反而是能够继续维持上升通道的斜率，直到最后连续五根阳线的抛物线拉伸。突破通道线的同时，测试了2007年的历史高点，然后又一路缓步下行。如果你只看最后一次推动，那就可能得出这是突如其来的高潮的结论。但事实上，前方作为大型的熊旗，一直都有卖压积累的迹象，尤其空头动能其实都不差劲。将来当你意识到趋势已经持续20，30根以上的K线。却居然又再次出现异常强劲的趋势K线时则应回顾是否已经形成足够的逆向压力以及它是否正往某个支撑阻力奔去。最后一冲将成立双重顶。而其中耗时十年才建立的右峰，则是由三段推动的楔形顶构成，这是一组嵌套的形态。而若检视前头提到的诸多要件，由于这是一个比较缓的上升趋势，因而趋势线被跌破的稍晚。低点也降低的稍晚。这难免给人一种都跌到这里了，我才判断出趋势反转，那还有什么利润可言的遗憾感受？但就确定性最高的要件而言，还是逐步具足了。透过检视这个案例，只是想要再次为你复习前头提到的判断流程。以后至于如何在开仓的时候略微放宽要件是否存在更左侧的建仓方法，我们就等到反转建仓形态的单元再具体讨论。到时候你关于价格行为的理论基础应该也已经扎实了。就比起现在更可能有自行调整的能力。","p":"p349"}]},{"t":"para","text":"那接着我们话说回来，前面提到的香港恒生指数的图表。2018年初的这个高点可以完美结合，前面说到的大型趋势反转可能由渐进累积的形式构成。也可能在最后由高潮所驱动，当压垮骆驼的最后一根稻草。可以看到，价格从2008年止跌回升以后，价格进入了漫长的上升通道，内部是急速，通道，回调，接着恢复上涨。但动能疲弱，只持续到略略翻越原趋势极值，就有急转直下。不过低点没有降低，反而是能够继续维持上升通道的斜率，直到最后连续五根阳线的抛物线拉伸。突破通道线的同时，测试了2007年的历史高点，然后又一路缓步下行。如果你只看最后一次推动，那就可能得出这是突如其来的高潮的结论。但事实上，前方作为大型的熊旗，一直都有卖压积累的迹象，尤其空头动能其实都不差劲。将来当你意识到趋势已经持续20，30根以上的K线。却居然又再次出现异常强劲的趋势K线时则应回顾是否已经形成足够的逆向压力以及它是否正往某个支撑阻力奔去。最后一冲将成立双重顶。而其中耗时十年才建立的右峰，则是由三段推动的楔形顶构成，这是一组嵌套的形态。而若检视前头提到的诸多要件，由于这是一个比较缓的上升趋势，因而趋势线被跌破的稍晚。低点也降低的稍晚。这难免给人一种都跌到这里了，我才判断出趋势反转，那还有什么利润可言的遗憾感受？但就确定性最高的要件而言，还是逐步具足了。透过检视这个案例，只是想要再次为你复习前头提到的判断流程。以后至于如何在开仓的时候略微放宽要件是否存在更左侧的建仓方法，我们就等到反转建仓形态的单元再具体讨论。到时候你关于价格行为的理论基础应该也已经扎实了。就比起现在更可能有自行调整的能力。","pid":"p349"},{"t":"img","src":"assets/img/l07B_110.webp","ilabel":"7-20","icap":"L07　反转逆势突破","fid":"fig110","ctx":[{"t":"那接着我们话说回来，前面提到的香港恒生指数的图表。2018年初的这个高点可以完美结合，前面说到的大型趋势反转可能由渐进累积的形式构成。也可能在最后由高潮所驱动，当压垮骆驼的最后一根稻草。可以看到，价格从2008年止跌回升以后，价格进入了漫长的上升通道，内部是急速，通道，回调，接着恢复上涨。但动能疲弱，只持续到略略翻越原趋势极值，就有急转直下。不过低点没有降低，反而是能够继续维持上升通道的斜率，直到最后连续五根阳线的抛物线拉伸。突破通道线的同时，测试了2007年的历史高点，然后又一路缓步下行。如果你只看最后一次推动，那就可能得出这是突如其来的高潮的结论。但事实上，前方作为大型的熊旗，一直都有卖压积累的迹象，尤其空头动能其实都不差劲。将来当你意识到趋势已经持续20，30根以上的K线。却居然又再次出现异常强劲的趋势K线时则应回顾是否已经形成足够的逆向压力以及它是否正往某个支撑阻力奔去。最后一冲将成立双重顶。而其中耗时十年才建立的右峰，则是由三段推动的楔形顶构成，这是一组嵌套的形态。而若检视前头提到的诸多要件，由于这是一个比较缓的上升趋势，因而趋势线被跌破的稍晚。低点也降低的稍晚。这难免给人一种都跌到这里了，我才判断出趋势反转，那还有什么利润可言的遗憾感受？但就确定性最高的要件而言，还是逐步具足了。透过检视这个案例，只是想要再次为你复习前头提到的判断流程。以后至于如何在开仓的时候略微放宽要件是否存在更左侧的建仓方法，我们就等到反转建仓形态的单元再具体讨论。到时候你关于价格行为的理论基础应该也已经扎实了。就比起现在更可能有自行调整的能力。","p":"p349"},{"t":"好的单元又到尾声，我们同样再次精要的复习一下前面说过的内容，希望能让你有更深刻的记忆。首先，我们还是要老生常谈，耳提面命一下趋势倾向延续，因而过程中多数的反转尝试，80%的反转尝试都倾向失败。这些尝试虽然是逆势方永恒的不会放弃的动作，毕竟他们必须要反转趋势，才有大幅利润可图。但多数只能成就小型趋势反转，成为短暂将演变为持续形态的回调。然后顺势方就又会重新取得行情的主控权。但是终有一次反转尝试将会成功演变为可观的逆向趋势运动。在这种情况下，我们就称它为大型趋势反转，以与局部的回调进行区别。一旦大型趋势反转发生，那你就可以期待10到20根K线以上的，至少还有两段推动的深幅逆行。并从中赚取波段等级的逆势交易利润。并且接下来反而要顺着新趋势方向进行交易，才能够算是顺势交易。可以说，多空的主导权基本上完全颠倒了。那既然大型趋势反转不易成立，而一旦成立，就能够开启可观的逆行，那它的条件也会相对严格。这里提供给交易者参考的要件包括对脉络的要求，逆势压力必须积累充分，最好有明确的反转形态。且这个形态绝对不会太小，少说也至少同样有10到20根K线。并且逆势方为了证明自己占上风，他们不仅要突破趋势线，要打消原趋势的结构。也就是使上升趋势低点降低，下降趋势高点抬升。还要在对原趋势极值测试的过程中显现强势，逼迫原趋势方曝露疲态。这些条件并不一定会严格的按顺序出现。比如一次空头反转，可能先向上测试原趋势极值才有更强烈的下跌，造成低点降低。但总之最好都有。这些要件都是逆势方能够大声讲话，能够宣告自己足以控制行情的证据。要件越是具足，趋势反转的确定性就越高。不过，在单元后半段，我们也揭示了另一种大型趋势反转的启动方法，即由高潮引发。它与刚刚提到的渐进式发生的反转并不冲突，两者甚至可以合并。先有足够的逆势压力积累，才最后突然力竭的冲了一下。但总之，它有时候会非常醒目，醒目到让交易者判定这是单独发生，没有其他迹象加持的结果。不过无所谓，重点是你知道它的原理。高潮运动跟我们先前谈的第二推陷阱别无二致。成因相同，往往是朝通道线的意外突破造成。顺势交易者大力追入。当然还有被套的人止损。以及逆势交易者抽身观望，等待在更划算的价位建仓所导致的。那这样的价位往往位于某个重要的支撑阻力之上。所以，要是你看到在趋势持续已久的末尾突然出现抛物线式的加速运动，直朝某个关键支撑阻力奔去。但触及以后就没有什么续航，那你就可以怀疑，这也许是一次高潮运动。随后有几率发生大型的深度的趋势反转。但我也要强调，你可以怀疑，这只是也许。高潮后继续高潮或者高潮后仅仅停顿，仅仅发生小型趋势反转。结束回调之后，又继续正向运行，也是可能发生的。在反转建仓形态的单元，我们会再更仔细讨论应对方案。在这里，你的任务是了解反转可能渐进式的启动，也可能转瞬间启动。而他们各自的原理是什么？多空在其中是基于什么意图？采取了什么行动才会导致反转的结果？如今，对于图表上多数的价格运动，无论是多是空，无论是继续顺向去走，还是开启逆向的走势。你都有原理层次的了解了。只要将突破，测试，回调，区间，反转等单元经熟起来。就不太会有读不懂市场发生了什么的问题。下个单元会是市场循环，作为目前所有单元的收敛与进一步阐发，我们会理过一轮趋势的发起到结束。缘起缘灭。确保你真的能够正确阅读任何图表中的多空竞合。感谢收看反转逆势突破，我们下个单元见。","p":"p350"}]},{"t":"para","text":"好的单元又到尾声，我们同样再次精要的复习一下前面说过的内容，希望能让你有更深刻的记忆。首先，我们还是要老生常谈，耳提面命一下趋势倾向延续，因而过程中多数的反转尝试，80%的反转尝试都倾向失败。这些尝试虽然是逆势方永恒的不会放弃的动作，毕竟他们必须要反转趋势，才有大幅利润可图。但多数只能成就小型趋势反转，成为短暂将演变为持续形态的回调。然后顺势方就又会重新取得行情的主控权。但是终有一次反转尝试将会成功演变为可观的逆向趋势运动。在这种情况下，我们就称它为大型趋势反转，以与局部的回调进行区别。一旦大型趋势反转发生，那你就可以期待10到20根K线以上的，至少还有两段推动的深幅逆行。并从中赚取波段等级的逆势交易利润。并且接下来反而要顺着新趋势方向进行交易，才能够算是顺势交易。可以说，多空的主导权基本上完全颠倒了。那既然大型趋势反转不易成立，而一旦成立，就能够开启可观的逆行，那它的条件也会相对严格。这里提供给交易者参考的要件包括对脉络的要求，逆势压力必须积累充分，最好有明确的反转形态。且这个形态绝对不会太小，少说也至少同样有10到20根K线。并且逆势方为了证明自己占上风，他们不仅要突破趋势线，要打消原趋势的结构。也就是使上升趋势低点降低，下降趋势高点抬升。还要在对原趋势极值测试的过程中显现强势，逼迫原趋势方曝露疲态。这些条件并不一定会严格的按顺序出现。比如一次空头反转，可能先向上测试原趋势极值才有更强烈的下跌，造成低点降低。但总之最好都有。这些要件都是逆势方能够大声讲话，能够宣告自己足以控制行情的证据。要件越是具足，趋势反转的确定性就越高。不过，在单元后半段，我们也揭示了另一种大型趋势反转的启动方法，即由高潮引发。它与刚刚提到的渐进式发生的反转并不冲突，两者甚至可以合并。先有足够的逆势压力积累，才最后突然力竭的冲了一下。但总之，它有时候会非常醒目，醒目到让交易者判定这是单独发生，没有其他迹象加持的结果。不过无所谓，重点是你知道它的原理。高潮运动跟我们先前谈的第二推陷阱别无二致。成因相同，往往是朝通道线的意外突破造成。顺势交易者大力追入。当然还有被套的人止损。以及逆势交易者抽身观望，等待在更划算的价位建仓所导致的。那这样的价位往往位于某个重要的支撑阻力之上。所以，要是你看到在趋势持续已久的末尾突然出现抛物线式的加速运动，直朝某个关键支撑阻力奔去。但触及以后就没有什么续航，那你就可以怀疑，这也许是一次高潮运动。随后有几率发生大型的深度的趋势反转。但我也要强调，你可以怀疑，这只是也许。高潮后继续高潮或者高潮后仅仅停顿，仅仅发生小型趋势反转。结束回调之后，又继续正向运行，也是可能发生的。在反转建仓形态的单元，我们会再更仔细讨论应对方案。在这里，你的任务是了解反转可能渐进式的启动，也可能转瞬间启动。而他们各自的原理是什么？多空在其中是基于什么意图？采取了什么行动才会导致反转的结果？如今，对于图表上多数的价格运动，无论是多是空，无论是继续顺向去走，还是开启逆向的走势。你都有原理层次的了解了。只要将突破，测试，回调，区间，反转等单元经熟起来。就不太会有读不懂市场发生了什么的问题。下个单元会是市场循环，作为目前所有单元的收敛与进一步阐发，我们会理过一轮趋势的发起到结束。缘起缘灭。确保你真的能够正确阅读任何图表中的多空竞合。感谢收看反转逆势突破，我们下个单元见。","pid":"p350"}],"wcount":6875}],"wcount":15225},{"id":"l08","icon":"L08","title":"L08　市场循环价格行为的光谱","blocks":[{"t":"para","text":"L08 市场循环价格行为的光谱","pid":"p351"},{"t":"img","src":"assets/img/l08x_111.webp","ilabel":"8-1","icap":"L08　市场循环价格行为的光谱","fid":"fig111","ctx":[{"t":"L08 市场循环价格行为的光谱","p":"p351"},{"t":"关于价格行为最基本的知识模块突破，测试，回调，区间，反转。如今你已经都具备了。你一定还记得我们总是环绕着从市场的均衡到失衡,失衡再到均衡的主轴去谈。价格行为如何呈现多空之间的竞合？而今天这个单元，我们除了作为一次复习确认，大家已经完备的建立综合理解。我们还要进一步深化我们的认知，使交易者对于阿尔布鲁克斯强调的读图时最应该掌握的脉络与动能有更加深刻的把握。因此，接下来我们要谈的话题包括一轮趋势的起末应有哪些阶段组合而成？这些各个阶段作为我们需要经熟辨认的市场脉络有何特征？有何特性？以及更重要的，我们可以或者应该避免进行哪些类型的交易。透过建立对市场循环的框架性认识，熟谙价格行为的光谱。你将更容易把握现在市场处在什么状态，从哪里来，又该往何处去？","p":"p352"}]},{"t":"para","text":"关于价格行为最基本的知识模块突破，测试，回调，区间，反转。如今你已经都具备了。你一定还记得我们总是环绕着从市场的均衡到失衡,失衡再到均衡的主轴去谈。价格行为如何呈现多空之间的竞合？而今天这个单元，我们除了作为一次复习确认，大家已经完备的建立综合理解。我们还要进一步深化我们的认知，使交易者对于阿尔布鲁克斯强调的读图时最应该掌握的脉络与动能有更加深刻的把握。因此，接下来我们要谈的话题包括一轮趋势的起末应有哪些阶段组合而成？这些各个阶段作为我们需要经熟辨认的市场脉络有何特征？有何特性？以及更重要的，我们可以或者应该避免进行哪些类型的交易。透过建立对市场循环的框架性认识，熟谙价格行为的光谱。你将更容易把握现在市场处在什么状态，从哪里来，又该往何处去？","pid":"p352"},{"t":"img","src":"assets/img/l08x_112.webp","ilabel":"8-2","icap":"L08　市场循环价格行为的光谱","fid":"fig112","ctx":[{"t":"关于价格行为最基本的知识模块突破，测试，回调，区间，反转。如今你已经都具备了。你一定还记得我们总是环绕着从市场的均衡到失衡,失衡再到均衡的主轴去谈。价格行为如何呈现多空之间的竞合？而今天这个单元，我们除了作为一次复习确认，大家已经完备的建立综合理解。我们还要进一步深化我们的认知，使交易者对于阿尔布鲁克斯强调的读图时最应该掌握的脉络与动能有更加深刻的把握。因此，接下来我们要谈的话题包括一轮趋势的起末应有哪些阶段组合而成？这些各个阶段作为我们需要经熟辨认的市场脉络有何特征？有何特性？以及更重要的，我们可以或者应该避免进行哪些类型的交易。透过建立对市场循环的框架性认识，熟谙价格行为的光谱。你将更容易把握现在市场处在什么状态，从哪里来，又该往何处去？","p":"p352"},{"t":"各位在画面上看到的，应该是一张常规到平淡无奇的图表。似乎在看盘软体上点开任何品种，任何时间级别的任意一个时间点，你都会看到类似的东西。我们来扼要的胜过一次发生的事情。在画面的最左边，你先看到的是连续几根强劲的影线，短小的趋势阳线拔起。然后进到比较细碎的段落，但仍然维持清晰的上升节奏。到了左三分之一左右的位置，价格第一次进入比较深的回调，而回调的终点。似乎去测试了前方这个比较焦灼的小小上升通道，或者你说去触碰了这个小小的波段点。但总之，价格恢复上行，可是没走多久开始折返，看起来是对前面高点的失败突破。也因为这个失败的突破，尝试逆势交易者显得更激进了一点。马上开启比前一波更急更强的回调。幸好以多头的角度看待前面的低点，没有真的被跌破，又开始拉升。但好消息也没有持续太久，同样是在突破尝试后立即失去跟进，右转向下。这次多头应该递进上升的低点开始被挑战了。依着趋势线上行的规律也被刺破，而需要修正。后面多头未能再创新高，引发更猛烈的下跌。下跌到前波段低点处，多头又现身把价格拖了起来。接下来就维持相对弱一点的上行，直到图表结束。如果对价格行为没有仔细阅读的意思，不去做刚刚这一趟检视，那这就只是一张普通的图表。但实际上，它非常标准的为我们揭示了一轮趋势，从发起到削弱到归于震荡的过程。这正是单元标题市场循环的最佳体现。","p":"p353"}]},{"t":"para","text":"各位在画面上看到的，应该是一张常规到平淡无奇的图表。似乎在看盘软体上点开任何品种，任何时间级别的任意一个时间点，你都会看到类似的东西。我们来扼要的胜过一次发生的事情。在画面的最左边，你先看到的是连续几根强劲的影线，短小的趋势阳线拔起。然后进到比较细碎的段落，但仍然维持清晰的上升节奏。到了左三分之一左右的位置，价格第一次进入比较深的回调，而回调的终点。似乎去测试了前方这个比较焦灼的小小上升通道，或者你说去触碰了这个小小的波段点。但总之，价格恢复上行，可是没走多久开始折返，看起来是对前面高点的失败突破。也因为这个失败的突破，尝试逆势交易者显得更激进了一点。马上开启比前一波更急更强的回调。幸好以多头的角度看待前面的低点，没有真的被跌破，又开始拉升。但好消息也没有持续太久，同样是在突破尝试后立即失去跟进，右转向下。这次多头应该递进上升的低点开始被挑战了。依着趋势线上行的规律也被刺破，而需要修正。后面多头未能再创新高，引发更猛烈的下跌。下跌到前波段低点处，多头又现身把价格拖了起来。接下来就维持相对弱一点的上行，直到图表结束。如果对价格行为没有仔细阅读的意思，不去做刚刚这一趟检视，那这就只是一张普通的图表。但实际上，它非常标准的为我们揭示了一轮趋势，从发起到削弱到归于震荡的过程。这正是单元标题市场循环的最佳体现。","pid":"p353"},{"t":"img","src":"assets/img/l08x_113.webp","ilabel":"8-3","icap":"L08　市场循环价格行为的光谱","fid":"fig113","ctx":[{"t":"各位在画面上看到的，应该是一张常规到平淡无奇的图表。似乎在看盘软体上点开任何品种，任何时间级别的任意一个时间点，你都会看到类似的东西。我们来扼要的胜过一次发生的事情。在画面的最左边，你先看到的是连续几根强劲的影线，短小的趋势阳线拔起。然后进到比较细碎的段落，但仍然维持清晰的上升节奏。到了左三分之一左右的位置，价格第一次进入比较深的回调，而回调的终点。似乎去测试了前方这个比较焦灼的小小上升通道，或者你说去触碰了这个小小的波段点。但总之，价格恢复上行，可是没走多久开始折返，看起来是对前面高点的失败突破。也因为这个失败的突破，尝试逆势交易者显得更激进了一点。马上开启比前一波更急更强的回调。幸好以多头的角度看待前面的低点，没有真的被跌破，又开始拉升。但好消息也没有持续太久，同样是在突破尝试后立即失去跟进，右转向下。这次多头应该递进上升的低点开始被挑战了。依着趋势线上行的规律也被刺破，而需要修正。后面多头未能再创新高，引发更猛烈的下跌。下跌到前波段低点处，多头又现身把价格拖了起来。接下来就维持相对弱一点的上行，直到图表结束。如果对价格行为没有仔细阅读的意思，不去做刚刚这一趟检视，那这就只是一张普通的图表。但实际上，它非常标准的为我们揭示了一轮趋势，从发起到削弱到归于震荡的过程。这正是单元标题市场循环的最佳体现。","p":"p353"},{"t":"何为市场循环？它指的是从均衡到失衡，失衡再到均衡的循环过程。你可以说，依照趋势方的动能大小，依照逆势交易者的激进程度。一轮趋势系由急速，窄幅通道，宽幅通道，区间四种阶段组合而成。就刚刚的图表来看，最一开始就是急速。接着有回调，但很细小，整体上行的斜率还是明确的。此即第二阶段的窄幅通道。后续开始稍微深一点的回调，而顺势方的突破变得虚弱。第三段落则是宽幅通道。最后，双方都没能有效的突破，呈现更多的是横向的双边交易状态。宽幅通道就演变为区间。所以这是顺势交易者越来越疲乏的过程。他们原先干劲十足，十分团结，且愿意每逢突破就追进。但随着价格越来越高，他们判断在抢高买进的价值变低了，便开始有顺势交易者退出。这些人的退出，必定是以卖出的形式，必定是以买单缺席的形式发挥作用。随之而来的就是逆势交易者，也就是空头的积极进取。所以你看到阴线越来越多，逆势方掌握的K线越来越多，而整体上行的斜率越来越缓。阳性的连续性越来越差。到最后，起初严重偏向单边交易状态的急速段落已经彻底转向十足的双边交易状态。多空双方在这宽幅的区间中找到作为均衡的中轴，于是围绕这个公平价格上下穿梭。虽然我们没有显示图表的后续，不知道接下来价格是向上突破还是向下突破。但无所谓。反正一旦成功的突破启动，那就又是新的急速窄幅通道，宽幅通道区间。那这又是新的市场循环。在以上过程中，如果你能细致的感受到多空双方交战的动能消涨。那你就听懂了市场的语言，掌握了供需的脉动。所以这里要向你抛出的概念就是趋势始终有急速，窄幅通道，宽幅通道区间。四种阶段组合而成。但是这四个组成部分有必要依序出现吗？不见得。市场会进行，每次都不同，每次都有细微差异的排列组合。这种细微的差异就体现在这四个组成部分，不见得所有都会出现，不见得所有都只出现一次。而持续的时间也并不一定要均等。","p":"p354"}]},{"t":"para","text":"何为市场循环？它指的是从均衡到失衡，失衡再到均衡的循环过程。你可以说，依照趋势方的动能大小，依照逆势交易者的激进程度。一轮趋势系由急速，窄幅通道，宽幅通道，区间四种阶段组合而成。就刚刚的图表来看，最一开始就是急速。接着有回调，但很细小，整体上行的斜率还是明确的。此即第二阶段的窄幅通道。后续开始稍微深一点的回调，而顺势方的突破变得虚弱。第三段落则是宽幅通道。最后，双方都没能有效的突破，呈现更多的是横向的双边交易状态。宽幅通道就演变为区间。所以这是顺势交易者越来越疲乏的过程。他们原先干劲十足，十分团结，且愿意每逢突破就追进。但随着价格越来越高，他们判断在抢高买进的价值变低了，便开始有顺势交易者退出。这些人的退出，必定是以卖出的形式，必定是以买单缺席的形式发挥作用。随之而来的就是逆势交易者，也就是空头的积极进取。所以你看到阴线越来越多，逆势方掌握的K线越来越多，而整体上行的斜率越来越缓。阳性的连续性越来越差。到最后，起初严重偏向单边交易状态的急速段落已经彻底转向十足的双边交易状态。多空双方在这宽幅的区间中找到作为均衡的中轴，于是围绕这个公平价格上下穿梭。虽然我们没有显示图表的后续，不知道接下来价格是向上突破还是向下突破。但无所谓。反正一旦成功的突破启动，那就又是新的急速窄幅通道，宽幅通道区间。那这又是新的市场循环。在以上过程中，如果你能细致的感受到多空双方交战的动能消涨。那你就听懂了市场的语言，掌握了供需的脉动。所以这里要向你抛出的概念就是趋势始终有急速，窄幅通道，宽幅通道区间。四种阶段组合而成。但是这四个组成部分有必要依序出现吗？不见得。市场会进行，每次都不同，每次都有细微差异的排列组合。这种细微的差异就体现在这四个组成部分，不见得所有都会出现，不见得所有都只出现一次。而持续的时间也并不一定要均等。","pid":"p354"},{"t":"img","src":"assets/img/l08x_114.webp","ilabel":"8-4","icap":"L08　市场循环价格行为的光谱","fid":"fig114","ctx":[{"t":"何为市场循环？它指的是从均衡到失衡，失衡再到均衡的循环过程。你可以说，依照趋势方的动能大小，依照逆势交易者的激进程度。一轮趋势系由急速，窄幅通道，宽幅通道，区间四种阶段组合而成。就刚刚的图表来看，最一开始就是急速。接着有回调，但很细小，整体上行的斜率还是明确的。此即第二阶段的窄幅通道。后续开始稍微深一点的回调，而顺势方的突破变得虚弱。第三段落则是宽幅通道。最后，双方都没能有效的突破，呈现更多的是横向的双边交易状态。宽幅通道就演变为区间。所以这是顺势交易者越来越疲乏的过程。他们原先干劲十足，十分团结，且愿意每逢突破就追进。但随着价格越来越高，他们判断在抢高买进的价值变低了，便开始有顺势交易者退出。这些人的退出，必定是以卖出的形式，必定是以买单缺席的形式发挥作用。随之而来的就是逆势交易者，也就是空头的积极进取。所以你看到阴线越来越多，逆势方掌握的K线越来越多，而整体上行的斜率越来越缓。阳性的连续性越来越差。到最后，起初严重偏向单边交易状态的急速段落已经彻底转向十足的双边交易状态。多空双方在这宽幅的区间中找到作为均衡的中轴，于是围绕这个公平价格上下穿梭。虽然我们没有显示图表的后续，不知道接下来价格是向上突破还是向下突破。但无所谓。反正一旦成功的突破启动，那就又是新的急速窄幅通道，宽幅通道区间。那这又是新的市场循环。在以上过程中，如果你能细致的感受到多空双方交战的动能消涨。那你就听懂了市场的语言，掌握了供需的脉动。所以这里要向你抛出的概念就是趋势始终有急速，窄幅通道，宽幅通道区间。四种阶段组合而成。但是这四个组成部分有必要依序出现吗？不见得。市场会进行，每次都不同，每次都有细微差异的排列组合。这种细微的差异就体现在这四个组成部分，不见得所有都会出现，不见得所有都只出现一次。而持续的时间也并不一定要均等。","p":"p354"},{"t":"以这张图为例，从左到右看起来更像个宽幅通道，然后加速向下突破。这急速后也没有接窄幅通道与宽幅通道，而是直接陷入铁丝网的区间，然后又转入了上升的窄幅通道。虽然后面比较常规的接了宽幅通道，但随后又没有转入区间，而是再次发起向上的急速。总之，很明显没有合乎前面这四个阶段依序出现的完美流程。而且不止顺序不同，持续的时间也有快有慢。在此，我们就可以明确的感受到市场的变化是快速且迷人的。多空的竞合总有流动的节奏，使无法阅读价格行为的观众只得迷茫，只得随之起舞。那么，如果四个组成部分出现的顺序持续的时间都没有定规，那交易者到底该拿市场怎么办呢？我们究竟有没有什么原则可以依循？如果我要教你刻舟求剑，那就太逊了，或说如果有人声称只要跟着他简单的刻舟求剑，就能够获利。那他肯定是在骗你。所以接下来我要尝试教会你的是更难的，在交易现场的体察方法。光靠辨识，当下价格行为的特征就见微知著，一叶知秋。以琐碎的讯息判断市场，现在应该在走急速窄幅通道，宽幅通道区间。的那一个脉络。并且判断出属于何者，以后也马上知道，现在要采取什么策略才能够避免亏损并且获利。","p":"p355"}]},{"t":"para","text":"以这张图为例，从左到右看起来更像个宽幅通道，然后加速向下突破。这急速后也没有接窄幅通道与宽幅通道，而是直接陷入铁丝网的区间，然后又转入了上升的窄幅通道。虽然后面比较常规的接了宽幅通道，但随后又没有转入区间，而是再次发起向上的急速。总之，很明显没有合乎前面这四个阶段依序出现的完美流程。而且不止顺序不同，持续的时间也有快有慢。在此，我们就可以明确的感受到市场的变化是快速且迷人的。多空的竞合总有流动的节奏，使无法阅读价格行为的观众只得迷茫，只得随之起舞。那么，如果四个组成部分出现的顺序持续的时间都没有定规，那交易者到底该拿市场怎么办呢？我们究竟有没有什么原则可以依循？如果我要教你刻舟求剑，那就太逊了，或说如果有人声称只要跟着他简单的刻舟求剑，就能够获利。那他肯定是在骗你。所以接下来我要尝试教会你的是更难的，在交易现场的体察方法。光靠辨识，当下价格行为的特征就见微知著，一叶知秋。以琐碎的讯息判断市场，现在应该在走急速窄幅通道，宽幅通道区间。的那一个脉络。并且判断出属于何者，以后也马上知道，现在要采取什么策略才能够避免亏损并且获利。","pid":"p355"},{"t":"img","src":"assets/img/l08x_115.webp","ilabel":"8-5","icap":"L08　市场循环价格行为的光谱","fid":"fig115","ctx":[{"t":"以这张图为例，从左到右看起来更像个宽幅通道，然后加速向下突破。这急速后也没有接窄幅通道与宽幅通道，而是直接陷入铁丝网的区间，然后又转入了上升的窄幅通道。虽然后面比较常规的接了宽幅通道，但随后又没有转入区间，而是再次发起向上的急速。总之，很明显没有合乎前面这四个阶段依序出现的完美流程。而且不止顺序不同，持续的时间也有快有慢。在此，我们就可以明确的感受到市场的变化是快速且迷人的。多空的竞合总有流动的节奏，使无法阅读价格行为的观众只得迷茫，只得随之起舞。那么，如果四个组成部分出现的顺序持续的时间都没有定规，那交易者到底该拿市场怎么办呢？我们究竟有没有什么原则可以依循？如果我要教你刻舟求剑，那就太逊了，或说如果有人声称只要跟着他简单的刻舟求剑，就能够获利。那他肯定是在骗你。所以接下来我要尝试教会你的是更难的，在交易现场的体察方法。光靠辨识，当下价格行为的特征就见微知著，一叶知秋。以琐碎的讯息判断市场，现在应该在走急速窄幅通道，宽幅通道区间。的那一个脉络。并且判断出属于何者，以后也马上知道，现在要采取什么策略才能够避免亏损并且获利。","p":"p355"},{"t":"首先是突破发起之后的急速阶段。趋势中，急速阶段的特征是什么呢？就外观看来，既无回调与停顿，出现的是连续的，顺畅的趋势K线。实体饱满而影线短小。再宽松一点说，有些交易者可能愿意允许急速中出现短暂的停顿或回调，大概一两根K线。但最好是几乎没有完全没有最好。越是干净，流畅，强劲的趋势动能越好。那在这样的脉络里，交易者应该要做的就只有一件事，进行顺势的交易，切勿尝试逆势交易。在这样的快速运动中，只要你趁早介入进去，通常一坐进去就能马上开始浮盈。并且享有较高的胜率。但高胜率的前提会是你愿意承担较宽的止损。这在我们后面谈交易风格以及正式进入急速交易方法的单元时，会有更具体的阐述。但总之你晓得由于这是强烈的单边交易状态，你应该朝顺势方向加入市场，这么做会最容易获取利润。但当然，不谈原理，不谈市场，形成这种脉络的背后逻辑就不像是太妃的课程了。所以在这里，我们要进行稍微抽象，但非常有助于你深刻理解机构意图的思考。顺势方开始占有极大的数学优势与形成急速运动互为因果。再说一次，顺势方开始占有极大的数学优势与形成急速运动，两者互为因果。什么意思呢？","p":"p356"}]},{"t":"para","text":"首先是突破发起之后的急速阶段。趋势中，急速阶段的特征是什么呢？就外观看来，既无回调与停顿，出现的是连续的，顺畅的趋势K线。实体饱满而影线短小。再宽松一点说，有些交易者可能愿意允许急速中出现短暂的停顿或回调，大概一两根K线。但最好是几乎没有完全没有最好。越是干净，流畅，强劲的趋势动能越好。那在这样的脉络里，交易者应该要做的就只有一件事，进行顺势的交易，切勿尝试逆势交易。在这样的快速运动中，只要你趁早介入进去，通常一坐进去就能马上开始浮盈。并且享有较高的胜率。但高胜率的前提会是你愿意承担较宽的止损。这在我们后面谈交易风格以及正式进入急速交易方法的单元时，会有更具体的阐述。但总之你晓得由于这是强烈的单边交易状态，你应该朝顺势方向加入市场，这么做会最容易获取利润。但当然，不谈原理，不谈市场，形成这种脉络的背后逻辑就不像是太妃的课程了。所以在这里，我们要进行稍微抽象，但非常有助于你深刻理解机构意图的思考。顺势方开始占有极大的数学优势与形成急速运动互为因果。再说一次，顺势方开始占有极大的数学优势与形成急速运动，两者互为因果。什么意思呢？","pid":"p356"},{"t":"img","src":"assets/img/l08x_116.webp","ilabel":"8-6","icap":"L08　市场循环价格行为的光谱","fid":"fig116","ctx":[{"t":"首先是突破发起之后的急速阶段。趋势中，急速阶段的特征是什么呢？就外观看来，既无回调与停顿，出现的是连续的，顺畅的趋势K线。实体饱满而影线短小。再宽松一点说，有些交易者可能愿意允许急速中出现短暂的停顿或回调，大概一两根K线。但最好是几乎没有完全没有最好。越是干净，流畅，强劲的趋势动能越好。那在这样的脉络里，交易者应该要做的就只有一件事，进行顺势的交易，切勿尝试逆势交易。在这样的快速运动中，只要你趁早介入进去，通常一坐进去就能马上开始浮盈。并且享有较高的胜率。但高胜率的前提会是你愿意承担较宽的止损。这在我们后面谈交易风格以及正式进入急速交易方法的单元时，会有更具体的阐述。但总之你晓得由于这是强烈的单边交易状态，你应该朝顺势方向加入市场，这么做会最容易获取利润。但当然，不谈原理，不谈市场，形成这种脉络的背后逻辑就不像是太妃的课程了。所以在这里，我们要进行稍微抽象，但非常有助于你深刻理解机构意图的思考。顺势方开始占有极大的数学优势与形成急速运动互为因果。再说一次，顺势方开始占有极大的数学优势与形成急速运动，两者互为因果。什么意思呢？","p":"p356"},{"t":"你一定还记得前面我们说过市场中的顺势交易者可以分做两种类型，动能交易者与价值交易者。前者毫不在乎基本分析因素，擅长追涨杀跌，就靠着追涨杀跌赚的盆满钵满。他们的行动逻辑是只要趋势动能仍然强劲，趋势就应当还有延续性的行情。所以，经过精明且严格的方法判定以后，这些机构看到强劲的突破，看到顺畅的急速，就会追进。追进去就对了，理当还有后续。而后者则不喜欢这么做，他们喜欢以更划算的价格建仓。所以他们的策略是等待回调，在低处买，在高处卖，而非在高处买，在更高处卖。顺势交易者完全可以分作以上两个部分。那在这里，我们的主角是这些动能交易者。请千万别忘记他们都是精明的机构，K线只会形成在机构认为有利可图而愿意建仓的地方。所以用他们的逻辑思考看看。当突破发生之后，演变为成功的突破。那在这个瞬间，数学优势是不是明显偏向顺势方？价格从均衡脱离出来，进入失衡的急速状态，是不是代表均衡位在朝向急速方向的某个远处？而在抵达那个公平区间，以前价格先逆势走X点的几率是不是会小于先顺势走X点的几率？以上答案都是肯定的。随着失衡持续越久，趋势发起越久，这个方向几率先顺势走X点，而非先逆势走X点的几率会从60%左右慢慢缩减到不到50%。然后市场发现运动过度再折返，复归50%。所以如果是你，你知道急速成功发起之际，方向几率高于60%。能够提供你一比一盈亏比的仓位正向期望。你会不会愿意进场，甚至是抢着进场呢？如果答案是会的话，那么那些动能交易者，这些执行动能算法的机构就是这么做的。于是急速发起以后，因为这些涌现的追入订单会进一步将急速推得更远更扎实。同时，我们也可以把这个鸡生蛋的论述倒过来，用蛋把鸡生出来。当你看到急速发起，你就知道这是因为有机构认为在这里追进有正向的期望。价格顺势先走X点的几率是60%，急速才会形成。因为这么大的趋势K线不可能不是机构追进导致的。所以急速形成导致追进。追进又巩固了急速的成立，而急速的明确化又吸引更多动能算法追进。基于此，急速的运动状态得以有效的自我维持。顺势方开始占有极大的数学优势与形成急速运动，两者互为因果，就是这个意思。那么急速，什么时候才会缓速下来，总不会一直维持相同的斜率，对吧？毕竟急速就是要前去均衡。所以没错，一旦价格运动到相对靠近均衡的位置，也就是顺势先走X点而非逆向先走X点的几率慢慢往50%靠近，就会有比较保守重视胜率的交易者开始离场。尤其是那些动能交易者，他们是最敏锐的。毕竟刚刚在努力追进的就是他们。风向一变，他们肯定第一个跑。所以一旦这些人退缩，有顺势交易者开始离场，那逆势方就会跟着进取。使得价格运动又陷入不确定。这就是回调启动的进程。而当回调到一定程度，那些价值交易者。希望以稍微划算的价格入场的人，则早已虎视瞻瞻会，接着进场再造成新的突破。而必须向你强调的是，一般我们说急速状态的结束就发生在回调K线形成的时候。上升趋势由K线低点开始降低。下降趋势有K线低点开始抬升的时候。于是通道阶段也就开启。","p":"p357"}]},{"t":"para","text":"你一定还记得前面我们说过市场中的顺势交易者可以分做两种类型，动能交易者与价值交易者。前者毫不在乎基本分析因素，擅长追涨杀跌，就靠着追涨杀跌赚的盆满钵满。他们的行动逻辑是只要趋势动能仍然强劲，趋势就应当还有延续性的行情。所以，经过精明且严格的方法判定以后，这些机构看到强劲的突破，看到顺畅的急速，就会追进。追进去就对了，理当还有后续。而后者则不喜欢这么做，他们喜欢以更划算的价格建仓。所以他们的策略是等待回调，在低处买，在高处卖，而非在高处买，在更高处卖。顺势交易者完全可以分作以上两个部分。那在这里，我们的主角是这些动能交易者。请千万别忘记他们都是精明的机构，K线只会形成在机构认为有利可图而愿意建仓的地方。所以用他们的逻辑思考看看。当突破发生之后，演变为成功的突破。那在这个瞬间，数学优势是不是明显偏向顺势方？价格从均衡脱离出来，进入失衡的急速状态，是不是代表均衡位在朝向急速方向的某个远处？而在抵达那个公平区间，以前价格先逆势走X点的几率是不是会小于先顺势走X点的几率？以上答案都是肯定的。随着失衡持续越久，趋势发起越久，这个方向几率先顺势走X点，而非先逆势走X点的几率会从60%左右慢慢缩减到不到50%。然后市场发现运动过度再折返，复归50%。所以如果是你，你知道急速成功发起之际，方向几率高于60%。能够提供你一比一盈亏比的仓位正向期望。你会不会愿意进场，甚至是抢着进场呢？如果答案是会的话，那么那些动能交易者，这些执行动能算法的机构就是这么做的。于是急速发起以后，因为这些涌现的追入订单会进一步将急速推得更远更扎实。同时，我们也可以把这个鸡生蛋的论述倒过来，用蛋把鸡生出来。当你看到急速发起，你就知道这是因为有机构认为在这里追进有正向的期望。价格顺势先走X点的几率是60%，急速才会形成。因为这么大的趋势K线不可能不是机构追进导致的。所以急速形成导致追进。追进又巩固了急速的成立，而急速的明确化又吸引更多动能算法追进。基于此，急速的运动状态得以有效的自我维持。顺势方开始占有极大的数学优势与形成急速运动，两者互为因果，就是这个意思。那么急速，什么时候才会缓速下来，总不会一直维持相同的斜率，对吧？毕竟急速就是要前去均衡。所以没错，一旦价格运动到相对靠近均衡的位置，也就是顺势先走X点而非逆向先走X点的几率慢慢往50%靠近，就会有比较保守重视胜率的交易者开始离场。尤其是那些动能交易者，他们是最敏锐的。毕竟刚刚在努力追进的就是他们。风向一变，他们肯定第一个跑。所以一旦这些人退缩，有顺势交易者开始离场，那逆势方就会跟着进取。使得价格运动又陷入不确定。这就是回调启动的进程。而当回调到一定程度，那些价值交易者。希望以稍微划算的价格入场的人，则早已虎视瞻瞻会，接着进场再造成新的突破。而必须向你强调的是，一般我们说急速状态的结束就发生在回调K线形成的时候。上升趋势由K线低点开始降低。下降趋势有K线低点开始抬升的时候。于是通道阶段也就开启。","pid":"p357"},{"t":"img","src":"assets/img/l08x_117.webp","ilabel":"8-7","icap":"L08　市场循环价格行为的光谱","fid":"fig117","ctx":[{"t":"你一定还记得前面我们说过市场中的顺势交易者可以分做两种类型，动能交易者与价值交易者。前者毫不在乎基本分析因素，擅长追涨杀跌，就靠着追涨杀跌赚的盆满钵满。他们的行动逻辑是只要趋势动能仍然强劲，趋势就应当还有延续性的行情。所以，经过精明且严格的方法判定以后，这些机构看到强劲的突破，看到顺畅的急速，就会追进。追进去就对了，理当还有后续。而后者则不喜欢这么做，他们喜欢以更划算的价格建仓。所以他们的策略是等待回调，在低处买，在高处卖，而非在高处买，在更高处卖。顺势交易者完全可以分作以上两个部分。那在这里，我们的主角是这些动能交易者。请千万别忘记他们都是精明的机构，K线只会形成在机构认为有利可图而愿意建仓的地方。所以用他们的逻辑思考看看。当突破发生之后，演变为成功的突破。那在这个瞬间，数学优势是不是明显偏向顺势方？价格从均衡脱离出来，进入失衡的急速状态，是不是代表均衡位在朝向急速方向的某个远处？而在抵达那个公平区间，以前价格先逆势走X点的几率是不是会小于先顺势走X点的几率？以上答案都是肯定的。随着失衡持续越久，趋势发起越久，这个方向几率先顺势走X点，而非先逆势走X点的几率会从60%左右慢慢缩减到不到50%。然后市场发现运动过度再折返，复归50%。所以如果是你，你知道急速成功发起之际，方向几率高于60%。能够提供你一比一盈亏比的仓位正向期望。你会不会愿意进场，甚至是抢着进场呢？如果答案是会的话，那么那些动能交易者，这些执行动能算法的机构就是这么做的。于是急速发起以后，因为这些涌现的追入订单会进一步将急速推得更远更扎实。同时，我们也可以把这个鸡生蛋的论述倒过来，用蛋把鸡生出来。当你看到急速发起，你就知道这是因为有机构认为在这里追进有正向的期望。价格顺势先走X点的几率是60%，急速才会形成。因为这么大的趋势K线不可能不是机构追进导致的。所以急速形成导致追进。追进又巩固了急速的成立，而急速的明确化又吸引更多动能算法追进。基于此，急速的运动状态得以有效的自我维持。顺势方开始占有极大的数学优势与形成急速运动，两者互为因果，就是这个意思。那么急速，什么时候才会缓速下来，总不会一直维持相同的斜率，对吧？毕竟急速就是要前去均衡。所以没错，一旦价格运动到相对靠近均衡的位置，也就是顺势先走X点而非逆向先走X点的几率慢慢往50%靠近，就会有比较保守重视胜率的交易者开始离场。尤其是那些动能交易者，他们是最敏锐的。毕竟刚刚在努力追进的就是他们。风向一变，他们肯定第一个跑。所以一旦这些人退缩，有顺势交易者开始离场，那逆势方就会跟着进取。使得价格运动又陷入不确定。这就是回调启动的进程。而当回调到一定程度，那些价值交易者。希望以稍微划算的价格入场的人，则早已虎视瞻瞻会，接着进场再造成新的突破。而必须向你强调的是，一般我们说急速状态的结束就发生在回调K线形成的时候。上升趋势由K线低点开始降低。下降趋势有K线低点开始抬升的时候。于是通道阶段也就开启。","p":"p357"},{"t":"我们接着来讲通道。下一个是窄福通道。趋势中，窄幅通道的阶段特征是什么呢？大体上来说，依然是由趋势K线组成。但趋势K线可能稍微短一些。并且现在开始会有更多一点点的停顿和回调。不过，停顿和回调的持续时间依然比较短。而且这些回调K线，停顿K线的长度也不长，","p":"p358"},{"t":"只有平均K线长度的两倍不到。也就是说，虽然逆势交易者可能比起前面的急速阶段更有意愿入场了。但有意愿是一回事，有能力是一回事。他们依然没有什么能力。能够创造的逆势压力都还很小。也正是因为这样窄幅通道，其实跟急速差距不大。在更大时间级别的图表上，你可以很容易想象得到窄幅通道，肯定只是急速。或者换句话说，我们刚刚说的急速状态，如果切换到更小时间级别图表去看，那可能也更容易观察到一些细小的回调。使急速变成了窄幅通道。那既然他们差的不是太多，我们交易者在对待它的时候，同样最好只进行顺势的波段交易。和剥头皮交易，切勿尝试逆势交易。我知道，肯定有交易者在不熟练的情况下喜欢武断的，将急速判断为高潮。接下来要发生大型趋势反转。但这很容易粉身碎骨。所以如果你觉察到自己正在进行逆势交易，却不断亏损。那你应该要意识到自己非常可能身处在窄幅通道之内，并从此回头是岸，改变方向。另外，你所要知道的是，窄幅通道跟急速除了差在刚刚说的外观。以此进行顺势的持仓，肯定还是会稍微没有那么舒服一点。浮盈不如急速快速，然后偶尔会有停顿跟回调，让你觉得好像有点恐怖。不过，顺势交易才是正道，不要手痒去抓反转。","p":"p359"}]},{"t":"para","text":"我们接着来讲通道。下一个是窄福通道。趋势中，窄幅通道的阶段特征是什么呢？大体上来说，依然是由趋势K线组成。但趋势K线可能稍微短一些。并且现在开始会有更多一点点的停顿和回调。不过，停顿和回调的持续时间依然比较短。而且这些回调K线，停顿K线的长度也不长，","pid":"p358"},{"t":"para","text":"只有平均K线长度的两倍不到。也就是说，虽然逆势交易者可能比起前面的急速阶段更有意愿入场了。但有意愿是一回事，有能力是一回事。他们依然没有什么能力。能够创造的逆势压力都还很小。也正是因为这样窄幅通道，其实跟急速差距不大。在更大时间级别的图表上，你可以很容易想象得到窄幅通道，肯定只是急速。或者换句话说，我们刚刚说的急速状态，如果切换到更小时间级别图表去看，那可能也更容易观察到一些细小的回调。使急速变成了窄幅通道。那既然他们差的不是太多，我们交易者在对待它的时候，同样最好只进行顺势的波段交易。和剥头皮交易，切勿尝试逆势交易。我知道，肯定有交易者在不熟练的情况下喜欢武断的，将急速判断为高潮。接下来要发生大型趋势反转。但这很容易粉身碎骨。所以如果你觉察到自己正在进行逆势交易，却不断亏损。那你应该要意识到自己非常可能身处在窄幅通道之内，并从此回头是岸，改变方向。另外，你所要知道的是，窄幅通道跟急速除了差在刚刚说的外观。以此进行顺势的持仓，肯定还是会稍微没有那么舒服一点。浮盈不如急速快速，然后偶尔会有停顿跟回调，让你觉得好像有点恐怖。不过，顺势交易才是正道，不要手痒去抓反转。","pid":"p359"},{"t":"img","src":"assets/img/l08x_118.webp","ilabel":"8-8","icap":"L08　市场循环价格行为的光谱","fid":"fig118","ctx":[{"t":"我们接着来讲通道。下一个是窄福通道。趋势中，窄幅通道的阶段特征是什么呢？大体上来说，依然是由趋势K线组成。但趋势K线可能稍微短一些。并且现在开始会有更多一点点的停顿和回调。不过，停顿和回调的持续时间依然比较短。而且这些回调K线，停顿K线的长度也不长，","p":"p358"},{"t":"只有平均K线长度的两倍不到。也就是说，虽然逆势交易者可能比起前面的急速阶段更有意愿入场了。但有意愿是一回事，有能力是一回事。他们依然没有什么能力。能够创造的逆势压力都还很小。也正是因为这样窄幅通道，其实跟急速差距不大。在更大时间级别的图表上，你可以很容易想象得到窄幅通道，肯定只是急速。或者换句话说，我们刚刚说的急速状态，如果切换到更小时间级别图表去看，那可能也更容易观察到一些细小的回调。使急速变成了窄幅通道。那既然他们差的不是太多，我们交易者在对待它的时候，同样最好只进行顺势的波段交易。和剥头皮交易，切勿尝试逆势交易。我知道，肯定有交易者在不熟练的情况下喜欢武断的，将急速判断为高潮。接下来要发生大型趋势反转。但这很容易粉身碎骨。所以如果你觉察到自己正在进行逆势交易，却不断亏损。那你应该要意识到自己非常可能身处在窄幅通道之内，并从此回头是岸，改变方向。另外，你所要知道的是，窄幅通道跟急速除了差在刚刚说的外观。以此进行顺势的持仓，肯定还是会稍微没有那么舒服一点。浮盈不如急速快速，然后偶尔会有停顿跟回调，让你觉得好像有点恐怖。不过，顺势交易才是正道，不要手痒去抓反转。","p":"p359"},{"t":"在这边我要强调要抛出来的重要观念是，交易者应该要时时关注通道宽度以及斜率的变化。事实上，最广义来说，所有的价格都是某种通道都可以被限定在某条趋势线和通道线之间。就连急速也不例外，只是宽度非常非常窄，而斜率非常非常陡而已。那我们观察到，急速进入窄幅通道，改用窄幅通道这个称呼方式。这实际上是要更凸显它的通道性格，用指针去表达它比起急速来说更宽一点点。此间的差异就来自于停顿和回调的频繁程度，持续时间和逆向去走的深度。都会导致通道变得更宽。那么，通道越宽，代表逆势交易者造成的逆向压力就更大。也就代表顺势交易者对趋势的掌握程度越弱。这时候我们还是能用上前面说过的关键知识上升通道，有80%的几率最终朝下突破。下降通道有80%的几率最终向上突破。你可能有点傻眼，想说这不是废话吗？这么陡的走势要回调哦，当然是最后去突破趋势线。不过这是这样没错，这里也是用关于通道的80%定理。而且你会发现，每次向下突破趋势线通道的加宽斜率就变缓，代表逆势方越趋积极。顺势方则逐渐疲弱和市场越来越趋近均衡状态。所以每次价格在突破趋势线后就反弹，我们都要关心它对原趋势极值的测试如何。是强劲穿透吗？是轻轻戳一下就折返吗？这是我们检视趋势强度的方法。如果趋势强劲，那所有回调都倾向短暂。而且这些回调作为旗型，作为持续形态所带有的逆势压力应该比较小。在健康的趋势里，就能在形成旗型，旗型突破，突破回调，然后突破又形成另一个旗型，这样的循环里头。使高低点不断递进。而当回调的更深，对原趋势极值的突破更弱，我们就知道趋势动能慢慢不行了。","p":"p360"}]},{"t":"para","text":"在这边我要强调要抛出来的重要观念是，交易者应该要时时关注通道宽度以及斜率的变化。事实上，最广义来说，所有的价格都是某种通道都可以被限定在某条趋势线和通道线之间。就连急速也不例外，只是宽度非常非常窄，而斜率非常非常陡而已。那我们观察到，急速进入窄幅通道，改用窄幅通道这个称呼方式。这实际上是要更凸显它的通道性格，用指针去表达它比起急速来说更宽一点点。此间的差异就来自于停顿和回调的频繁程度，持续时间和逆向去走的深度。都会导致通道变得更宽。那么，通道越宽，代表逆势交易者造成的逆向压力就更大。也就代表顺势交易者对趋势的掌握程度越弱。这时候我们还是能用上前面说过的关键知识上升通道，有80%的几率最终朝下突破。下降通道有80%的几率最终向上突破。你可能有点傻眼，想说这不是废话吗？这么陡的走势要回调哦，当然是最后去突破趋势线。不过这是这样没错，这里也是用关于通道的80%定理。而且你会发现，每次向下突破趋势线通道的加宽斜率就变缓，代表逆势方越趋积极。顺势方则逐渐疲弱和市场越来越趋近均衡状态。所以每次价格在突破趋势线后就反弹，我们都要关心它对原趋势极值的测试如何。是强劲穿透吗？是轻轻戳一下就折返吗？这是我们检视趋势强度的方法。如果趋势强劲，那所有回调都倾向短暂。而且这些回调作为旗型，作为持续形态所带有的逆势压力应该比较小。在健康的趋势里，就能在形成旗型，旗型突破，突破回调，然后突破又形成另一个旗型，这样的循环里头。使高低点不断递进。而当回调的更深，对原趋势极值的突破更弱，我们就知道趋势动能慢慢不行了。","pid":"p360"},{"t":"img","src":"assets/img/l08x_119.webp","ilabel":"8-9","icap":"L08　市场循环价格行为的光谱","fid":"fig119","ctx":[{"t":"在这边我要强调要抛出来的重要观念是，交易者应该要时时关注通道宽度以及斜率的变化。事实上，最广义来说，所有的价格都是某种通道都可以被限定在某条趋势线和通道线之间。就连急速也不例外，只是宽度非常非常窄，而斜率非常非常陡而已。那我们观察到，急速进入窄幅通道，改用窄幅通道这个称呼方式。这实际上是要更凸显它的通道性格，用指针去表达它比起急速来说更宽一点点。此间的差异就来自于停顿和回调的频繁程度，持续时间和逆向去走的深度。都会导致通道变得更宽。那么，通道越宽，代表逆势交易者造成的逆向压力就更大。也就代表顺势交易者对趋势的掌握程度越弱。这时候我们还是能用上前面说过的关键知识上升通道，有80%的几率最终朝下突破。下降通道有80%的几率最终向上突破。你可能有点傻眼，想说这不是废话吗？这么陡的走势要回调哦，当然是最后去突破趋势线。不过这是这样没错，这里也是用关于通道的80%定理。而且你会发现，每次向下突破趋势线通道的加宽斜率就变缓，代表逆势方越趋积极。顺势方则逐渐疲弱和市场越来越趋近均衡状态。所以每次价格在突破趋势线后就反弹，我们都要关心它对原趋势极值的测试如何。是强劲穿透吗？是轻轻戳一下就折返吗？这是我们检视趋势强度的方法。如果趋势强劲，那所有回调都倾向短暂。而且这些回调作为旗型，作为持续形态所带有的逆势压力应该比较小。在健康的趋势里，就能在形成旗型，旗型突破，突破回调，然后突破又形成另一个旗型，这样的循环里头。使高低点不断递进。而当回调的更深，对原趋势极值的突破更弱，我们就知道趋势动能慢慢不行了。","p":"p360"},{"t":"于是接下来当然是宽幅通道。宽幅通道的特征是什么呢？同样先谈外观。看上去回调明显多了，而且深。持续三根，五根，五根，十根，甚至十根以上，也有可能。这都是逆势压力积累的证据。同时，相较于急速，相较于窄幅通道趋势线和通道线的距离更远。内部顺势价格运动的连续性也变差，整体斜率也变缓了。更重要的是能盈利的策略变得很不一样。前面我们说对于急速和窄幅通道交易者，应该只考虑进行顺势交易。在宽幅通道内，依然能做顺势交易，必定还是有一定的斜率朝向趋势方向。但做法完全不同了。原本每逢趋势即时突破，就追进的动能交易者，现在一追进就会很快浮亏，所以这已经不是他们的主场。顺势交易者应该只改当价值交易者。也就是在回调中找划算的价格入场，争取朝趋势方向恢复的利润。而且即使这么做，也还有一条限制，是你不能期盼原趋势极值，还能被有效突破。已经动能交易者已经退场了。这时候没有人会在测试极值之后推你一把，扩大你的利润。所以在宽幅通道中，你最好是做在趋势线测入场，持仓到通道线测就平仓的那一种，剥头皮交易。不要贪心，不要押注突破发生，这并没有任何道理。另一点跟急速跟窄幅通道不一样，超级不一样的地方在于逆势交易者开始有利可图了。为什么呢？这是因为动能交易者在价格触及原趋势极值时缺席，而大家都等着当价值交易者。场内的参与者都知道这一点，那逆势交易者就可以趁人之危。反正你不会在我入场之后突然太过进取。所以我就可以拿折返拿深度回调的这段利润。也就是在通道线侧进场，","p":"p361"},{"t":"然后再走回趋势线侧的过程中止盈退出。聪明的你一定联想得到这跟区间中的高抛低吸，低买高卖的多空共识，似乎异曲同工。就只差在宽幅通道，还有一定程度的斜率而已。没错，这个观点非常正确。如果说价格行为的光谱是以失衡和均衡，以单边交易和双边交易为两端，那在宽幅通道中。我们已经渐渐接近区间的这一头了。距离均衡已经相去不远。只不过既然还不是区间价格，运动还是有一定的趋势性。那我们在做逆势交易的时候，也仍然不宜押注价格，能在入场之后旋即突破趋势线。高抛低吸，还是持仓到趋势线测算剥头皮等级的利润就可以了。","p":"p362"},{"t":"接下来，我有非常重要的观念要提示你。如果刚刚在过程中，你有任何一点谎神，是时候回魂了。我们说判断脉络与动能是交易者最重要的任务，对吧？你总是应该思考当下的环境是更适合做顺势交易，还是逆势交易？不过这不是一件容易的事情，市场如果是处于绝对的急速或者绝对的区间，那其实不会有令人太困扰的部分。最暧昧，最模糊的就是你知道市场现在处于通道之中，但你拿不定主意，这是窄幅通道还是宽幅通道？或者说你不确定现在加入顺势还有没有利润可图？这时候，为了驱散这种昏暗不明的感受，你要掏出了手电筒，这是扪心自问。顺势压力是否已经消散？这种程度的逆势压力是否足以造成大型趋势反转？或者更明确的问法是，现在逆势交易者有盈利的可能吗？","p":"p363"}]},{"t":"para","text":"于是接下来当然是宽幅通道。宽幅通道的特征是什么呢？同样先谈外观。看上去回调明显多了，而且深。持续三根，五根，五根，十根，甚至十根以上，也有可能。这都是逆势压力积累的证据。同时，相较于急速，相较于窄幅通道趋势线和通道线的距离更远。内部顺势价格运动的连续性也变差，整体斜率也变缓了。更重要的是能盈利的策略变得很不一样。前面我们说对于急速和窄幅通道交易者，应该只考虑进行顺势交易。在宽幅通道内，依然能做顺势交易，必定还是有一定的斜率朝向趋势方向。但做法完全不同了。原本每逢趋势即时突破，就追进的动能交易者，现在一追进就会很快浮亏，所以这已经不是他们的主场。顺势交易者应该只改当价值交易者。也就是在回调中找划算的价格入场，争取朝趋势方向恢复的利润。而且即使这么做，也还有一条限制，是你不能期盼原趋势极值，还能被有效突破。已经动能交易者已经退场了。这时候没有人会在测试极值之后推你一把，扩大你的利润。所以在宽幅通道中，你最好是做在趋势线测入场，持仓到通道线测就平仓的那一种，剥头皮交易。不要贪心，不要押注突破发生，这并没有任何道理。另一点跟急速跟窄幅通道不一样，超级不一样的地方在于逆势交易者开始有利可图了。为什么呢？这是因为动能交易者在价格触及原趋势极值时缺席，而大家都等着当价值交易者。场内的参与者都知道这一点，那逆势交易者就可以趁人之危。反正你不会在我入场之后突然太过进取。所以我就可以拿折返拿深度回调的这段利润。也就是在通道线侧进场，","pid":"p361"},{"t":"para","text":"然后再走回趋势线侧的过程中止盈退出。聪明的你一定联想得到这跟区间中的高抛低吸，低买高卖的多空共识，似乎异曲同工。就只差在宽幅通道，还有一定程度的斜率而已。没错，这个观点非常正确。如果说价格行为的光谱是以失衡和均衡，以单边交易和双边交易为两端，那在宽幅通道中。我们已经渐渐接近区间的这一头了。距离均衡已经相去不远。只不过既然还不是区间价格，运动还是有一定的趋势性。那我们在做逆势交易的时候，也仍然不宜押注价格，能在入场之后旋即突破趋势线。高抛低吸，还是持仓到趋势线测算剥头皮等级的利润就可以了。","pid":"p362"},{"t":"para","text":"接下来，我有非常重要的观念要提示你。如果刚刚在过程中，你有任何一点谎神，是时候回魂了。我们说判断脉络与动能是交易者最重要的任务，对吧？你总是应该思考当下的环境是更适合做顺势交易，还是逆势交易？不过这不是一件容易的事情，市场如果是处于绝对的急速或者绝对的区间，那其实不会有令人太困扰的部分。最暧昧，最模糊的就是你知道市场现在处于通道之中，但你拿不定主意，这是窄幅通道还是宽幅通道？或者说你不确定现在加入顺势还有没有利润可图？这时候，为了驱散这种昏暗不明的感受，你要掏出了手电筒，这是扪心自问。顺势压力是否已经消散？这种程度的逆势压力是否足以造成大型趋势反转？或者更明确的问法是，现在逆势交易者有盈利的可能吗？","pid":"p363"},{"t":"img","src":"assets/img/l08x_120.webp","ilabel":"8-10","icap":"L08　市场循环价格行为的光谱","fid":"fig120","ctx":[{"t":"然后再走回趋势线侧的过程中止盈退出。聪明的你一定联想得到这跟区间中的高抛低吸，低买高卖的多空共识，似乎异曲同工。就只差在宽幅通道，还有一定程度的斜率而已。没错，这个观点非常正确。如果说价格行为的光谱是以失衡和均衡，以单边交易和双边交易为两端，那在宽幅通道中。我们已经渐渐接近区间的这一头了。距离均衡已经相去不远。只不过既然还不是区间价格，运动还是有一定的趋势性。那我们在做逆势交易的时候，也仍然不宜押注价格，能在入场之后旋即突破趋势线。高抛低吸，还是持仓到趋势线测算剥头皮等级的利润就可以了。","p":"p362"},{"t":"接下来，我有非常重要的观念要提示你。如果刚刚在过程中，你有任何一点谎神，是时候回魂了。我们说判断脉络与动能是交易者最重要的任务，对吧？你总是应该思考当下的环境是更适合做顺势交易，还是逆势交易？不过这不是一件容易的事情，市场如果是处于绝对的急速或者绝对的区间，那其实不会有令人太困扰的部分。最暧昧，最模糊的就是你知道市场现在处于通道之中，但你拿不定主意，这是窄幅通道还是宽幅通道？或者说你不确定现在加入顺势还有没有利润可图？这时候，为了驱散这种昏暗不明的感受，你要掏出了手电筒，这是扪心自问。顺势压力是否已经消散？这种程度的逆势压力是否足以造成大型趋势反转？或者更明确的问法是，现在逆势交易者有盈利的可能吗？","p":"p363"},{"t":"来，我们直接举一个例子。现在你所看到的上升宽幅通道是截自最一开始给大家展示的这张图表。请大家稍微记得一下，前面应该有多头动能还比较强劲的急速以及窄幅通道的前半部分。是直到进到画面上窄幅通道的末段，转入宽幅通道以后，我们才可以明显看到趋势动能逐步减弱的历程。那就如刚刚所提示的，当你发现市场处于某种通道，但不确定是宽是窄的时候。最可以辅助你判断的问句就是，现在逆势交易者有盈利的可能吗？他们盈利起来容易吗？以这张图表来说，你可以想象那些以限价订单采宽幅止损，在原趋势极值处做空的空头交易者。好像蛮有甜头可尝的，对吧？只要不贪心，测算个1.0倍盈亏比的利润距离，他们都可以在价格还未开始折返上涨以前。就先把利润落在。下一个波段高点处也一样，采宽幅止损，采限价订单，做空赚一点就跑绰绰有余。甚至是还蛮不需要技巧的入场，止盈自在写意。所以如果你观察到了这一点。如果空头在上升趋势中被发现有利可图，那么上升趋势就已经出了问题。那就证明趋势已经转入宽幅通道。如今，顺势交易者的优势已经几乎消散，反倒是逆势交易者可以轻松盈利，我们就也离均衡不远了。我说逆势交易者可以轻松盈利，你可能还有点不确定该如何去想象轻松到底是什么意思。","p":"p364"}]},{"t":"para","text":"来，我们直接举一个例子。现在你所看到的上升宽幅通道是截自最一开始给大家展示的这张图表。请大家稍微记得一下，前面应该有多头动能还比较强劲的急速以及窄幅通道的前半部分。是直到进到画面上窄幅通道的末段，转入宽幅通道以后，我们才可以明显看到趋势动能逐步减弱的历程。那就如刚刚所提示的，当你发现市场处于某种通道，但不确定是宽是窄的时候。最可以辅助你判断的问句就是，现在逆势交易者有盈利的可能吗？他们盈利起来容易吗？以这张图表来说，你可以想象那些以限价订单采宽幅止损，在原趋势极值处做空的空头交易者。好像蛮有甜头可尝的，对吧？只要不贪心，测算个1.0倍盈亏比的利润距离，他们都可以在价格还未开始折返上涨以前。就先把利润落在。下一个波段高点处也一样，采宽幅止损，采限价订单，做空赚一点就跑绰绰有余。甚至是还蛮不需要技巧的入场，止盈自在写意。所以如果你观察到了这一点。如果空头在上升趋势中被发现有利可图，那么上升趋势就已经出了问题。那就证明趋势已经转入宽幅通道。如今，顺势交易者的优势已经几乎消散，反倒是逆势交易者可以轻松盈利，我们就也离均衡不远了。我说逆势交易者可以轻松盈利，你可能还有点不确定该如何去想象轻松到底是什么意思。","pid":"p364"},{"t":"img","src":"assets/img/l08x_121.webp","ilabel":"8-11","icap":"L08　市场循环价格行为的光谱","fid":"fig121","ctx":[{"t":"来，我们直接举一个例子。现在你所看到的上升宽幅通道是截自最一开始给大家展示的这张图表。请大家稍微记得一下，前面应该有多头动能还比较强劲的急速以及窄幅通道的前半部分。是直到进到画面上窄幅通道的末段，转入宽幅通道以后，我们才可以明显看到趋势动能逐步减弱的历程。那就如刚刚所提示的，当你发现市场处于某种通道，但不确定是宽是窄的时候。最可以辅助你判断的问句就是，现在逆势交易者有盈利的可能吗？他们盈利起来容易吗？以这张图表来说，你可以想象那些以限价订单采宽幅止损，在原趋势极值处做空的空头交易者。好像蛮有甜头可尝的，对吧？只要不贪心，测算个1.0倍盈亏比的利润距离，他们都可以在价格还未开始折返上涨以前。就先把利润落在。下一个波段高点处也一样，采宽幅止损，采限价订单，做空赚一点就跑绰绰有余。甚至是还蛮不需要技巧的入场，止盈自在写意。所以如果你观察到了这一点。如果空头在上升趋势中被发现有利可图，那么上升趋势就已经出了问题。那就证明趋势已经转入宽幅通道。如今，顺势交易者的优势已经几乎消散，反倒是逆势交易者可以轻松盈利，我们就也离均衡不远了。我说逆势交易者可以轻松盈利，你可能还有点不确定该如何去想象轻松到底是什么意思。","p":"p364"},{"t":"那我们从反面出发，说说什么样的环境让逆势交易者轻松不起来？右边这个状态就是我们前面说的急速与窄幅通道。你想，如果你每逢原趋势极值，这种宽幅止损挂单做空情况会怎么样？只会被止损到流眼泪而已。当然，过程中偶尔还是会有些阴线，也有些许向下移动的距离可言，但他们持续的时间都太短了。马上会紧接更有微折性的阳线，让你难以持仓，也难以盈利。更可能是短时间内就直接被清扫出场了。","p":"p365"}]},{"t":"para","text":"那我们从反面出发，说说什么样的环境让逆势交易者轻松不起来？右边这个状态就是我们前面说的急速与窄幅通道。你想，如果你每逢原趋势极值，这种宽幅止损挂单做空情况会怎么样？只会被止损到流眼泪而已。当然，过程中偶尔还是会有些阴线，也有些许向下移动的距离可言，但他们持续的时间都太短了。马上会紧接更有微折性的阳线，让你难以持仓，也难以盈利。更可能是短时间内就直接被清扫出场了。","pid":"p365"},{"t":"img","src":"assets/img/l08x_122.webp","ilabel":"8-12","icap":"L08　市场循环价格行为的光谱","fid":"fig122","ctx":[{"t":"那我们从反面出发，说说什么样的环境让逆势交易者轻松不起来？右边这个状态就是我们前面说的急速与窄幅通道。你想，如果你每逢原趋势极值，这种宽幅止损挂单做空情况会怎么样？只会被止损到流眼泪而已。当然，过程中偶尔还是会有些阴线，也有些许向下移动的距离可言，但他们持续的时间都太短了。马上会紧接更有微折性的阳线，让你难以持仓，也难以盈利。更可能是短时间内就直接被清扫出场了。","p":"p365"},{"t":"所以结合这两张图表来看，你就知道扪心自问逆势方有没有办法轻松盈利。为什么可以很好的帮助我们分辨现在正处于哪一种通道之中？随着趋势动能减弱，顺势交易者应该会逐渐丧失信心，并寻求更早更快的止盈。而逆势交易者也发现，好像每次测试原趋势极值的时候，我终宽幅止损入场，似乎越来越有利可图。于是他们就会更敢于这么做。这也就是说，当以限价订单在趋势及之处建立剥头皮仓位的逆势交易者，开始能够获利。我们就必须要当心。反过来讲，要是顺势交易者，反而因为每逢突破就追，进而开始亏损的时候，那事情就遭了个大糕。这时候距离连顺势剥头皮交易者都失去建仓兴趣的时候也就不远了。趋势通常就要结束，随机转入区间乃至于启动反转。","p":"p366"}]},{"t":"para","text":"所以结合这两张图表来看，你就知道扪心自问逆势方有没有办法轻松盈利。为什么可以很好的帮助我们分辨现在正处于哪一种通道之中？随着趋势动能减弱，顺势交易者应该会逐渐丧失信心，并寻求更早更快的止盈。而逆势交易者也发现，好像每次测试原趋势极值的时候，我终宽幅止损入场，似乎越来越有利可图。于是他们就会更敢于这么做。这也就是说，当以限价订单在趋势及之处建立剥头皮仓位的逆势交易者，开始能够获利。我们就必须要当心。反过来讲，要是顺势交易者，反而因为每逢突破就追，进而开始亏损的时候，那事情就遭了个大糕。这时候距离连顺势剥头皮交易者都失去建仓兴趣的时候也就不远了。趋势通常就要结束，随机转入区间乃至于启动反转。","pid":"p366"},{"t":"img","src":"assets/img/l08x_123.webp","ilabel":"8-13","icap":"L08　市场循环价格行为的光谱","fid":"fig123","ctx":[{"t":"所以结合这两张图表来看，你就知道扪心自问逆势方有没有办法轻松盈利。为什么可以很好的帮助我们分辨现在正处于哪一种通道之中？随着趋势动能减弱，顺势交易者应该会逐渐丧失信心，并寻求更早更快的止盈。而逆势交易者也发现，好像每次测试原趋势极值的时候，我终宽幅止损入场，似乎越来越有利可图。于是他们就会更敢于这么做。这也就是说，当以限价订单在趋势及之处建立剥头皮仓位的逆势交易者，开始能够获利。我们就必须要当心。反过来讲，要是顺势交易者，反而因为每逢突破就追，进而开始亏损的时候，那事情就遭了个大糕。这时候距离连顺势剥头皮交易者都失去建仓兴趣的时候也就不远了。趋势通常就要结束，随机转入区间乃至于启动反转。","p":"p366"},{"t":"很快，我们接着谈区间。区间阶段的特征是什么呢？你会看到回调多且深到可以被视作互相反转的程度。或者说这时候因为多空已经势均力敌了，也随之没有什么趋势性特征，价格不再有序的向上或向下倾斜排列。那么，在区间内，其实与既无顺势方，逆势方的分别，就只有多空互相否决而已。那也如前面单元所说，因为市场喜欢均衡，而区间内的价格运动基本上就是围绕着公平价格上下震荡。因此，它会耗时许久，难以出脱。如果你观察到一轮趋势性运动进入了休整，开始横向排列，并且持续超过20根K线以上，那你就可以称它为区间。认为此时顺势方已经失去原有的优势。在这样的环境下，由于80%对区间边线的突破都倾向失败，交易者只应该做看随突破成功的交易。也就是在区间的上三分之一处做空下三分之一处做多，并且测算剥头皮利润。不去押注突破的发生。我也不厌其烦的再向你提醒一次。为什么趋势的末尾经常陷入区间呢？原本在急速，在窄幅通道，在宽幅通道中，价格在逆势运行X单位之前。先顺势运行X单位的几率都略高于50%。于是顺势方愿意比逆势方更积极入场。但随着价格运行，终会在某个未知的时间点，方向几率下降至50%。而这个时间，这个位置必定是处于某个区间的中轴。只是当下我们还不晓得，而区间也还未显现。这是因为没有人能够事先知道这个位置在哪里。因此，市场会透过上下震荡来找到这个几率均衡的公平价位。这个公平价位是透过震荡的进行，我们能清楚看见震荡的轨迹之后才在事后被我们观测到的。那此后区间也可能越来越窄，变成收敛三角。这则是因为交易者已经找到的几率均衡的价位，无需再向上或向下过度运行。那到了这个时候，多空又已经处在紧密的势均力敌的状态。对他们来说，均衡可能又转移到其他地方去了，要重新探索。于是，市场又将再度置于突破模式，失衡也在不久之后发生去新的地方。寻找新的多空都认可的价值区域。","p":"p367"}]},{"t":"para","text":"很快，我们接着谈区间。区间阶段的特征是什么呢？你会看到回调多且深到可以被视作互相反转的程度。或者说这时候因为多空已经势均力敌了，也随之没有什么趋势性特征，价格不再有序的向上或向下倾斜排列。那么，在区间内，其实与既无顺势方，逆势方的分别，就只有多空互相否决而已。那也如前面单元所说，因为市场喜欢均衡，而区间内的价格运动基本上就是围绕着公平价格上下震荡。因此，它会耗时许久，难以出脱。如果你观察到一轮趋势性运动进入了休整，开始横向排列，并且持续超过20根K线以上，那你就可以称它为区间。认为此时顺势方已经失去原有的优势。在这样的环境下，由于80%对区间边线的突破都倾向失败，交易者只应该做看随突破成功的交易。也就是在区间的上三分之一处做空下三分之一处做多，并且测算剥头皮利润。不去押注突破的发生。我也不厌其烦的再向你提醒一次。为什么趋势的末尾经常陷入区间呢？原本在急速，在窄幅通道，在宽幅通道中，价格在逆势运行X单位之前。先顺势运行X单位的几率都略高于50%。于是顺势方愿意比逆势方更积极入场。但随着价格运行，终会在某个未知的时间点，方向几率下降至50%。而这个时间，这个位置必定是处于某个区间的中轴。只是当下我们还不晓得，而区间也还未显现。这是因为没有人能够事先知道这个位置在哪里。因此，市场会透过上下震荡来找到这个几率均衡的公平价位。这个公平价位是透过震荡的进行，我们能清楚看见震荡的轨迹之后才在事后被我们观测到的。那此后区间也可能越来越窄，变成收敛三角。这则是因为交易者已经找到的几率均衡的价位，无需再向上或向下过度运行。那到了这个时候，多空又已经处在紧密的势均力敌的状态。对他们来说，均衡可能又转移到其他地方去了，要重新探索。于是，市场又将再度置于突破模式，失衡也在不久之后发生去新的地方。寻找新的多空都认可的价值区域。","pid":"p367"},{"t":"img","src":"assets/img/l08x_124.webp","ilabel":"8-14","icap":"L08　市场循环价格行为的光谱","fid":"fig124","ctx":[{"t":"很快，我们接着谈区间。区间阶段的特征是什么呢？你会看到回调多且深到可以被视作互相反转的程度。或者说这时候因为多空已经势均力敌了，也随之没有什么趋势性特征，价格不再有序的向上或向下倾斜排列。那么，在区间内，其实与既无顺势方，逆势方的分别，就只有多空互相否决而已。那也如前面单元所说，因为市场喜欢均衡，而区间内的价格运动基本上就是围绕着公平价格上下震荡。因此，它会耗时许久，难以出脱。如果你观察到一轮趋势性运动进入了休整，开始横向排列，并且持续超过20根K线以上，那你就可以称它为区间。认为此时顺势方已经失去原有的优势。在这样的环境下，由于80%对区间边线的突破都倾向失败，交易者只应该做看随突破成功的交易。也就是在区间的上三分之一处做空下三分之一处做多，并且测算剥头皮利润。不去押注突破的发生。我也不厌其烦的再向你提醒一次。为什么趋势的末尾经常陷入区间呢？原本在急速，在窄幅通道，在宽幅通道中，价格在逆势运行X单位之前。先顺势运行X单位的几率都略高于50%。于是顺势方愿意比逆势方更积极入场。但随着价格运行，终会在某个未知的时间点，方向几率下降至50%。而这个时间，这个位置必定是处于某个区间的中轴。只是当下我们还不晓得，而区间也还未显现。这是因为没有人能够事先知道这个位置在哪里。因此，市场会透过上下震荡来找到这个几率均衡的公平价位。这个公平价位是透过震荡的进行，我们能清楚看见震荡的轨迹之后才在事后被我们观测到的。那此后区间也可能越来越窄，变成收敛三角。这则是因为交易者已经找到的几率均衡的价位，无需再向上或向下过度运行。那到了这个时候，多空又已经处在紧密的势均力敌的状态。对他们来说，均衡可能又转移到其他地方去了，要重新探索。于是，市场又将再度置于突破模式，失衡也在不久之后发生去新的地方。寻找新的多空都认可的价值区域。","p":"p367"},{"t":"在接下来，我们看一个例子。也透过将K线遮起来，再逐步播放，让你更能有胜身历其境的感觉。首先，这个交易日相较于昨天的收盘价是稍微跳空高开了一点对吧？但马上收了强劲的阴线。后续还又跟了几根阴线，在触碰到昨日铁丝网的低点的时候，稍微有一点阳线。但又马上下破。这种情况比较标准的做法是将其理解为窄幅通道，但是是很偏向急速的窄幅通道。因为过程中空头力量一直都蛮强的。就非常短暂的一颗阳线，十字星隔开了两段空头的动能。那后续马上又有新的阳线。但阳线随后又是阴线，就这样阴阳交错了一段时间。回顾一下目前的走势，你会怎么描述现在市场所处于的状态呢？我相信荧幕前的朋友，有些人会认为这是窄幅通道，而另一些人则认为这可能是宽幅通道。因为动能相对又弱了一些，对吧？但哪一个比较对呢？我们来用上前面提到的重要问句。解释看看现在逆势交易者，也就是多头要去获利是不是一件容易的事。显然，即使是用限价订单，也就是在原趋势极值处直接挂单做多。这里的阳线似乎也没有持久到能够让他们轻易获利，对吧？毕竟这种遮着眼睛挂单的做法，一定必须适配比较宽的止损。那要获利最勉强，还能成功的情况也要接受非常差的盈亏比才可能实现。稍有不慎，就会立即浮盈回吐，转为亏损。所以我们不会说这是逆势方可以轻松盈利的环境。这么一来，将它判定为窄幅通道，会更加恰当。后续的走势，我们看到的是价格继续下落，维持在依然陡峭的斜率。到了这里，再回过头看，确实前面的市场环境就比较明朗了。虽然中间有阳线不时出现，而且阴线好像也不是说每一根都非常强，总有犹豫的感觉。但整体斜率却很陡峭，对吧？在更大时间级别图表上，这高几率是个急速。比如，在四倍时间级别的图表上就是。它看起来就是连续的阴线，没错，甚至没有过高点抬升的迹象，说是急速毫不为过。如果你对于窄幅通道很宽幅通道的判读还有困扰，还有一个更干脆的方法跟你分享。如果你看到一个通道，觉得难以判断，那高几率代表它其实不够宽。够宽的话，会非常明显，逆势方一定更激进。所以判断不出来，你就将它看作是窄幅通道，更为保险。只考虑做顺势交易就好。接下来出现了一根很长的趋势阳线似乎一下突破了前面陡峭的趋势线。前面尽管也有过几次对趋势线的突破尝试，但都未果，仍然保持明确的斜率。可是这根阳线就不容忽视了。似乎一下就把通道给拓宽了。接下来我们可能就可以开始注意，在原趋势极值处入场的逆势交易者，是否有利可图？价格向下的过程中，确实能够感受到颠簸，过程中阳线的出现变得频繁了一点。下影线也很长，这些都是买压累积的迹象。而一触到原趋势极值，价格同样弹了回来。同时，考量到这段疲弱的下跌，作为牛旗。价格向上去测试前高或至少刺透新的趋势线，似乎没有那么不可预期。果真马上都到了，这样一来，我们就确立了价格运动截至目前的双边交易性格。甚至对前波断点的测试还形成了双重底。这里可以算是一个宽幅通道或说广义的区间也可以。为什么说是广义的呢？因为均衡的性格确实有，但持续的还不够久。考量到前面是强劲的下跌趋势，在这边形成双重顶熊旗，引发进一步的向下突破也是可能的。所以如果你打算逆势做多，环境可能暂时允许你这么做，至少有些机构已经因此获得薄利了。但对于经验不足的手工交易者来说，你要非常小心，要对价格再次触及区间上缘时的反应有很好的判读能力。而你如果打算顺势做空，那相对会更容易一些，至少因为前方的趋势支持你这么做。不过也最好不要拿太远。毕竟现在是处于介于宽幅通道与之间的脉络中，能不能突破并不好说。持仓到对岸就先离场是最保险的。所以如果刚刚在这里，你采双重顶熊旗的逻辑，建立了空仓而止盈，则摆在原趋势极值的话。出现当下，你就可以开心地抓着利润的一场。而想着逆势做多的交易者，要不要小心一点？毕竟马上向下突破也是可能的。只不过后续空头居然也没什么动能，收了很强的阳线。这是不是空头无力的表征呢？接下来是不是还会继续维持区间状态呢？这开始引人遐想。风格激进一点的交易者一数大阳线以来，这里维持了20根K线的横盘，于是他们可能会愿意继续持仓。但当然，我建议你不要这么做，只要知道有机构会这么做就可以了。那后续行情是加会这些逆势交易者的。价格却是缓缓上行，但始终只有触及，没能突破这个区间上缘，就这样晃荡到收盘。过程中，顺着前方趋势做空的人能够获利，逆着趋势押注区间突破失败的交易者也稍微有赚头。一路这样下来，你也见证了行情从窄幅通道转入区间的过程。","p":"p368"},{"t":"透过以上例子，你应该对于怎么判断价格处在什么阶段，有了更进一步的认识。同时，你应该也感受到了我们几个单元下来，不断在用上前头说过的种种知识。试图将所有要点揉合进对脉络，对动能的判读之中。交易说简单，可以很简单。读懂脉络，读懂动能，执行正确的决策，利润就会随着时间逐笔积累而来。那作为总结，我想要跟你强调的是，上述将趋势的起末切割成四个阶段。不外乎是为了方便你进行辨识，并相应的知道自己该做什么，不该做什么。但实际上，打通一切来讲，所有价格行为应该都能被收容在一个光谱中。","p":"p369"}]},{"t":"para","text":"在接下来，我们看一个例子。也透过将K线遮起来，再逐步播放，让你更能有胜身历其境的感觉。首先，这个交易日相较于昨天的收盘价是稍微跳空高开了一点对吧？但马上收了强劲的阴线。后续还又跟了几根阴线，在触碰到昨日铁丝网的低点的时候，稍微有一点阳线。但又马上下破。这种情况比较标准的做法是将其理解为窄幅通道，但是是很偏向急速的窄幅通道。因为过程中空头力量一直都蛮强的。就非常短暂的一颗阳线，十字星隔开了两段空头的动能。那后续马上又有新的阳线。但阳线随后又是阴线，就这样阴阳交错了一段时间。回顾一下目前的走势，你会怎么描述现在市场所处于的状态呢？我相信荧幕前的朋友，有些人会认为这是窄幅通道，而另一些人则认为这可能是宽幅通道。因为动能相对又弱了一些，对吧？但哪一个比较对呢？我们来用上前面提到的重要问句。解释看看现在逆势交易者，也就是多头要去获利是不是一件容易的事。显然，即使是用限价订单，也就是在原趋势极值处直接挂单做多。这里的阳线似乎也没有持久到能够让他们轻易获利，对吧？毕竟这种遮着眼睛挂单的做法，一定必须适配比较宽的止损。那要获利最勉强，还能成功的情况也要接受非常差的盈亏比才可能实现。稍有不慎，就会立即浮盈回吐，转为亏损。所以我们不会说这是逆势方可以轻松盈利的环境。这么一来，将它判定为窄幅通道，会更加恰当。后续的走势，我们看到的是价格继续下落，维持在依然陡峭的斜率。到了这里，再回过头看，确实前面的市场环境就比较明朗了。虽然中间有阳线不时出现，而且阴线好像也不是说每一根都非常强，总有犹豫的感觉。但整体斜率却很陡峭，对吧？在更大时间级别图表上，这高几率是个急速。比如，在四倍时间级别的图表上就是。它看起来就是连续的阴线，没错，甚至没有过高点抬升的迹象，说是急速毫不为过。如果你对于窄幅通道很宽幅通道的判读还有困扰，还有一个更干脆的方法跟你分享。如果你看到一个通道，觉得难以判断，那高几率代表它其实不够宽。够宽的话，会非常明显，逆势方一定更激进。所以判断不出来，你就将它看作是窄幅通道，更为保险。只考虑做顺势交易就好。接下来出现了一根很长的趋势阳线似乎一下突破了前面陡峭的趋势线。前面尽管也有过几次对趋势线的突破尝试，但都未果，仍然保持明确的斜率。可是这根阳线就不容忽视了。似乎一下就把通道给拓宽了。接下来我们可能就可以开始注意，在原趋势极值处入场的逆势交易者，是否有利可图？价格向下的过程中，确实能够感受到颠簸，过程中阳线的出现变得频繁了一点。下影线也很长，这些都是买压累积的迹象。而一触到原趋势极值，价格同样弹了回来。同时，考量到这段疲弱的下跌，作为牛旗。价格向上去测试前高或至少刺透新的趋势线，似乎没有那么不可预期。果真马上都到了，这样一来，我们就确立了价格运动截至目前的双边交易性格。甚至对前波断点的测试还形成了双重底。这里可以算是一个宽幅通道或说广义的区间也可以。为什么说是广义的呢？因为均衡的性格确实有，但持续的还不够久。考量到前面是强劲的下跌趋势，在这边形成双重顶熊旗，引发进一步的向下突破也是可能的。所以如果你打算逆势做多，环境可能暂时允许你这么做，至少有些机构已经因此获得薄利了。但对于经验不足的手工交易者来说，你要非常小心，要对价格再次触及区间上缘时的反应有很好的判读能力。而你如果打算顺势做空，那相对会更容易一些，至少因为前方的趋势支持你这么做。不过也最好不要拿太远。毕竟现在是处于介于宽幅通道与之间的脉络中，能不能突破并不好说。持仓到对岸就先离场是最保险的。所以如果刚刚在这里，你采双重顶熊旗的逻辑，建立了空仓而止盈，则摆在原趋势极值的话。出现当下，你就可以开心地抓着利润的一场。而想着逆势做多的交易者，要不要小心一点？毕竟马上向下突破也是可能的。只不过后续空头居然也没什么动能，收了很强的阳线。这是不是空头无力的表征呢？接下来是不是还会继续维持区间状态呢？这开始引人遐想。风格激进一点的交易者一数大阳线以来，这里维持了20根K线的横盘，于是他们可能会愿意继续持仓。但当然，我建议你不要这么做，只要知道有机构会这么做就可以了。那后续行情是加会这些逆势交易者的。价格却是缓缓上行，但始终只有触及，没能突破这个区间上缘，就这样晃荡到收盘。过程中，顺着前方趋势做空的人能够获利，逆着趋势押注区间突破失败的交易者也稍微有赚头。一路这样下来，你也见证了行情从窄幅通道转入区间的过程。","pid":"p368"},{"t":"para","text":"透过以上例子，你应该对于怎么判断价格处在什么阶段，有了更进一步的认识。同时，你应该也感受到了我们几个单元下来，不断在用上前头说过的种种知识。试图将所有要点揉合进对脉络，对动能的判读之中。交易说简单，可以很简单。读懂脉络，读懂动能，执行正确的决策，利润就会随着时间逐笔积累而来。那作为总结，我想要跟你强调的是，上述将趋势的起末切割成四个阶段。不外乎是为了方便你进行辨识，并相应的知道自己该做什么，不该做什么。但实际上，打通一切来讲，所有价格行为应该都能被收容在一个光谱中。","pid":"p369"},{"t":"img","src":"assets/img/l08x_125.webp","ilabel":"8-15","icap":"L08　市场循环价格行为的光谱","fid":"fig125","ctx":[{"t":"在接下来，我们看一个例子。也透过将K线遮起来，再逐步播放，让你更能有胜身历其境的感觉。首先，这个交易日相较于昨天的收盘价是稍微跳空高开了一点对吧？但马上收了强劲的阴线。后续还又跟了几根阴线，在触碰到昨日铁丝网的低点的时候，稍微有一点阳线。但又马上下破。这种情况比较标准的做法是将其理解为窄幅通道，但是是很偏向急速的窄幅通道。因为过程中空头力量一直都蛮强的。就非常短暂的一颗阳线，十字星隔开了两段空头的动能。那后续马上又有新的阳线。但阳线随后又是阴线，就这样阴阳交错了一段时间。回顾一下目前的走势，你会怎么描述现在市场所处于的状态呢？我相信荧幕前的朋友，有些人会认为这是窄幅通道，而另一些人则认为这可能是宽幅通道。因为动能相对又弱了一些，对吧？但哪一个比较对呢？我们来用上前面提到的重要问句。解释看看现在逆势交易者，也就是多头要去获利是不是一件容易的事。显然，即使是用限价订单，也就是在原趋势极值处直接挂单做多。这里的阳线似乎也没有持久到能够让他们轻易获利，对吧？毕竟这种遮着眼睛挂单的做法，一定必须适配比较宽的止损。那要获利最勉强，还能成功的情况也要接受非常差的盈亏比才可能实现。稍有不慎，就会立即浮盈回吐，转为亏损。所以我们不会说这是逆势方可以轻松盈利的环境。这么一来，将它判定为窄幅通道，会更加恰当。后续的走势，我们看到的是价格继续下落，维持在依然陡峭的斜率。到了这里，再回过头看，确实前面的市场环境就比较明朗了。虽然中间有阳线不时出现，而且阴线好像也不是说每一根都非常强，总有犹豫的感觉。但整体斜率却很陡峭，对吧？在更大时间级别图表上，这高几率是个急速。比如，在四倍时间级别的图表上就是。它看起来就是连续的阴线，没错，甚至没有过高点抬升的迹象，说是急速毫不为过。如果你对于窄幅通道很宽幅通道的判读还有困扰，还有一个更干脆的方法跟你分享。如果你看到一个通道，觉得难以判断，那高几率代表它其实不够宽。够宽的话，会非常明显，逆势方一定更激进。所以判断不出来，你就将它看作是窄幅通道，更为保险。只考虑做顺势交易就好。接下来出现了一根很长的趋势阳线似乎一下突破了前面陡峭的趋势线。前面尽管也有过几次对趋势线的突破尝试，但都未果，仍然保持明确的斜率。可是这根阳线就不容忽视了。似乎一下就把通道给拓宽了。接下来我们可能就可以开始注意，在原趋势极值处入场的逆势交易者，是否有利可图？价格向下的过程中，确实能够感受到颠簸，过程中阳线的出现变得频繁了一点。下影线也很长，这些都是买压累积的迹象。而一触到原趋势极值，价格同样弹了回来。同时，考量到这段疲弱的下跌，作为牛旗。价格向上去测试前高或至少刺透新的趋势线，似乎没有那么不可预期。果真马上都到了，这样一来，我们就确立了价格运动截至目前的双边交易性格。甚至对前波断点的测试还形成了双重底。这里可以算是一个宽幅通道或说广义的区间也可以。为什么说是广义的呢？因为均衡的性格确实有，但持续的还不够久。考量到前面是强劲的下跌趋势，在这边形成双重顶熊旗，引发进一步的向下突破也是可能的。所以如果你打算逆势做多，环境可能暂时允许你这么做，至少有些机构已经因此获得薄利了。但对于经验不足的手工交易者来说，你要非常小心，要对价格再次触及区间上缘时的反应有很好的判读能力。而你如果打算顺势做空，那相对会更容易一些，至少因为前方的趋势支持你这么做。不过也最好不要拿太远。毕竟现在是处于介于宽幅通道与之间的脉络中，能不能突破并不好说。持仓到对岸就先离场是最保险的。所以如果刚刚在这里，你采双重顶熊旗的逻辑，建立了空仓而止盈，则摆在原趋势极值的话。出现当下，你就可以开心地抓着利润的一场。而想着逆势做多的交易者，要不要小心一点？毕竟马上向下突破也是可能的。只不过后续空头居然也没什么动能，收了很强的阳线。这是不是空头无力的表征呢？接下来是不是还会继续维持区间状态呢？这开始引人遐想。风格激进一点的交易者一数大阳线以来，这里维持了20根K线的横盘，于是他们可能会愿意继续持仓。但当然，我建议你不要这么做，只要知道有机构会这么做就可以了。那后续行情是加会这些逆势交易者的。价格却是缓缓上行，但始终只有触及，没能突破这个区间上缘，就这样晃荡到收盘。过程中，顺着前方趋势做空的人能够获利，逆着趋势押注区间突破失败的交易者也稍微有赚头。一路这样下来，你也见证了行情从窄幅通道转入区间的过程。","p":"p368"},{"t":"透过以上例子，你应该对于怎么判断价格处在什么阶段，有了更进一步的认识。同时，你应该也感受到了我们几个单元下来，不断在用上前头说过的种种知识。试图将所有要点揉合进对脉络，对动能的判读之中。交易说简单，可以很简单。读懂脉络，读懂动能，执行正确的决策，利润就会随着时间逐笔积累而来。那作为总结，我想要跟你强调的是，上述将趋势的起末切割成四个阶段。不外乎是为了方便你进行辨识，并相应的知道自己该做什么，不该做什么。但实际上，打通一切来讲，所有价格行为应该都能被收容在一个光谱中。","p":"p369"},{"t":"由极端的急速与极端的区间作为两端。而所有市场的状态将比例各异的坐落在这个光谱之上。中间的段落，我们也可以很笼统的称呼它为通道。前面说过了，通道可宽可窄。双边交易越强就越宽，单边交易越强就越窄。单边交易强到一个极限，它就成了急速即失衡。反之，则变成区间是谓均衡。而市场就是在这两个极端之间来回摆荡，周而复始而已。所有的多空竞合所有的利润与亏损都在这样的循环之中开展。","p":"p370"},{"t":"这么一来，我们就把关于价格行为的核心原理部分给复习完，统整完了。你一定还记得，起初我们甚至是从两根K线的互相突破关系讲起。从那么微观的起点，一路深究如今你已经能够宏观的解读一轮趋势的起末。也确实光阴飞逝，讲到目前为止，我们已经走过了总数106000字的讲稿。很希望你觉得有所收获。但如果到了此时，你突然有一种事情，怎么就呼噜呼噜过去的感觉还搞不清楚自己到底学了什么。那也许你应该考虑重新再看一次前面的课程。这次记得要留下笔记，并结合自己的读图经验，尝试归结出一些疑问。接下来，在进入实战的交易方法部分以前，我们会先暂时脱离这个从市场的均衡到失衡，失衡再到均衡的主轴。谈谈其他也很重要，而我们目前都还没讨论过的东西。包括对支撑阻力，也就是对磁体的理论阐述与标记方法的说明。还要教会你为什么市场中充满等距运动，而又该怎么为推动技术？也就是说，在开始实战以前，我们先将所有的读图工具都具备完成，然后再带着精良的武器上战场。相信你已经准备好了，接下来也着实令人期待。感谢收看市场循环价格行为的光谱。我们下个单元见。","p":"p371"}]},{"t":"para","text":"由极端的急速与极端的区间作为两端。而所有市场的状态将比例各异的坐落在这个光谱之上。中间的段落，我们也可以很笼统的称呼它为通道。前面说过了，通道可宽可窄。双边交易越强就越宽，单边交易越强就越窄。单边交易强到一个极限，它就成了急速即失衡。反之，则变成区间是谓均衡。而市场就是在这两个极端之间来回摆荡，周而复始而已。所有的多空竞合所有的利润与亏损都在这样的循环之中开展。","pid":"p370"},{"t":"para","text":"这么一来，我们就把关于价格行为的核心原理部分给复习完，统整完了。你一定还记得，起初我们甚至是从两根K线的互相突破关系讲起。从那么微观的起点，一路深究如今你已经能够宏观的解读一轮趋势的起末。也确实光阴飞逝，讲到目前为止，我们已经走过了总数106000字的讲稿。很希望你觉得有所收获。但如果到了此时，你突然有一种事情，怎么就呼噜呼噜过去的感觉还搞不清楚自己到底学了什么。那也许你应该考虑重新再看一次前面的课程。这次记得要留下笔记，并结合自己的读图经验，尝试归结出一些疑问。接下来，在进入实战的交易方法部分以前，我们会先暂时脱离这个从市场的均衡到失衡，失衡再到均衡的主轴。谈谈其他也很重要，而我们目前都还没讨论过的东西。包括对支撑阻力，也就是对磁体的理论阐述与标记方法的说明。还要教会你为什么市场中充满等距运动，而又该怎么为推动技术？也就是说，在开始实战以前，我们先将所有的读图工具都具备完成，然后再带着精良的武器上战场。相信你已经准备好了，接下来也着实令人期待。感谢收看市场循环价格行为的光谱。我们下个单元见。","pid":"p371"}],"sections":[],"wcount":10660},{"id":"l09","icon":"L09","title":"L09　磁铁 支撑与阻力","blocks":[],"sections":[{"id":"l09A","title":"第A段　磁铁 支撑与阻力","blocks":[{"t":"para","text":"L09A 磁铁 支撑与阻力","pid":"p372"},{"t":"para","text":"很快地，我们完成了市场循环，进到了读图技术的板块。这里有三个单元，首先谈支撑与阻力，接着说明等距运动的原理再来谈数推的技术。把这三题拎出来，放在市场循环之后讲，主要是因为我们比较难用均衡与失衡之间的变换作为框架来包进这三项重要的知识。但别看他们像是剩余，无法归类的讲题，其实他们至关重要。支撑与阻力的部分不需我多提，大家应该都晓得，对技术分析来说，支撑阻力的运用绝对称得上是基石一般的存在。而等距运动原理与为推动技术，我觉得无论是实物层次，甚至到了学术层次。都是阿尔布克斯有别于其他理论家最重要的阐发。之所以它能够成为当代最重要的价格行为大家，对支撑阻力，对等距运动原理，对首推的深刻洞见。我认为是最让他能够脱颖而出的关键。所以我希望你同样享受接下来的讲演，并且再次深深感受到价格行为的魅力。","pid":"p373"},{"t":"img","src":"assets/img/l09A_126.webp","ilabel":"9-1","icap":"L09　磁铁 支撑与阻力","fid":"fig126","ctx":[{"t":"L09A 磁铁 支撑与阻力","p":"p372"},{"t":"很快地，我们完成了市场循环，进到了读图技术的板块。这里有三个单元，首先谈支撑与阻力，接着说明等距运动的原理再来谈数推的技术。把这三题拎出来，放在市场循环之后讲，主要是因为我们比较难用均衡与失衡之间的变换作为框架来包进这三项重要的知识。但别看他们像是剩余，无法归类的讲题，其实他们至关重要。支撑与阻力的部分不需我多提，大家应该都晓得，对技术分析来说，支撑阻力的运用绝对称得上是基石一般的存在。而等距运动原理与为推动技术，我觉得无论是实物层次，甚至到了学术层次。都是阿尔布克斯有别于其他理论家最重要的阐发。之所以它能够成为当代最重要的价格行为大家，对支撑阻力，对等距运动原理，对首推的深刻洞见。我认为是最让他能够脱颖而出的关键。所以我希望你同样享受接下来的讲演，并且再次深深感受到价格行为的魅力。","p":"p373"},{"t":"这个单元我们先谈支撑阻力，也就是所谓的磁体。对此，需要依序说明的包括支撑阻力的原理是什么？它是如何在市场中运作的？为什么它如此重要？以及磁力是支撑阻力最大，最重要的特性之一。磁力从何而来？还有磁体有哪些类型？我们该如何找到它们？如何运用它们？说到支撑与阻力，大家似乎都有点想当，然而不就是那样吗？但定义细究起来，可能就不是每个人都完全清楚了。请大家严肃的思考，看看到底何为支撑与阻力。我们可以这样说。支撑是为在当前市场价格下方的另一个价位。那里潜在的（注意是潜在）积聚着大量的买入订单。也就是说，你可以想象，当价格慢慢朝下靠近那个支撑，这里会有很特殊的事件发生。原本是空头运行，因为卖出比买入更踊跃，所以价格下行。但到了那里，反而形势逆转，多头开始积极进场，空头则止盈离场。他们的止盈相当于买进。因此，两股合力造成买盘一下子变得比卖盘更积极，反弹于是发生。举一反三，应该不难阻力呢。阻力则是当前市场上方的某个价格潜在地积聚着大量卖出订单。原先多头比空头更踊跃价格于是上涨。但到了阻力所在的位置，因为空头变得积极建仓，而多头则卖出止盈。所以空单数量压过多单抛售于是发生。这是由于这个多空运动节奏转变的现象，我们也很常听到，人家将支撑与阻力称作变盘点。","p":"p374"}]},{"t":"para","text":"这个单元我们先谈支撑阻力，也就是所谓的磁体。对此，需要依序说明的包括支撑阻力的原理是什么？它是如何在市场中运作的？为什么它如此重要？以及磁力是支撑阻力最大，最重要的特性之一。磁力从何而来？还有磁体有哪些类型？我们该如何找到它们？如何运用它们？说到支撑与阻力，大家似乎都有点想当，然而不就是那样吗？但定义细究起来，可能就不是每个人都完全清楚了。请大家严肃的思考，看看到底何为支撑与阻力。我们可以这样说。支撑是为在当前市场价格下方的另一个价位。那里潜在的（注意是潜在）积聚着大量的买入订单。也就是说，你可以想象，当价格慢慢朝下靠近那个支撑，这里会有很特殊的事件发生。原本是空头运行，因为卖出比买入更踊跃，所以价格下行。但到了那里，反而形势逆转，多头开始积极进场，空头则止盈离场。他们的止盈相当于买进。因此，两股合力造成买盘一下子变得比卖盘更积极，反弹于是发生。举一反三，应该不难阻力呢。阻力则是当前市场上方的某个价格潜在地积聚着大量卖出订单。原先多头比空头更踊跃价格于是上涨。但到了阻力所在的位置，因为空头变得积极建仓，而多头则卖出止盈。所以空单数量压过多单抛售于是发生。这是由于这个多空运动节奏转变的现象，我们也很常听到，人家将支撑与阻力称作变盘点。","pid":"p374"},{"t":"img","src":"assets/img/l09A_127.webp","ilabel":"9-2","icap":"L09　磁铁 支撑与阻力","fid":"fig127","ctx":[{"t":"这个单元我们先谈支撑阻力，也就是所谓的磁体。对此，需要依序说明的包括支撑阻力的原理是什么？它是如何在市场中运作的？为什么它如此重要？以及磁力是支撑阻力最大，最重要的特性之一。磁力从何而来？还有磁体有哪些类型？我们该如何找到它们？如何运用它们？说到支撑与阻力，大家似乎都有点想当，然而不就是那样吗？但定义细究起来，可能就不是每个人都完全清楚了。请大家严肃的思考，看看到底何为支撑与阻力。我们可以这样说。支撑是为在当前市场价格下方的另一个价位。那里潜在的（注意是潜在）积聚着大量的买入订单。也就是说，你可以想象，当价格慢慢朝下靠近那个支撑，这里会有很特殊的事件发生。原本是空头运行，因为卖出比买入更踊跃，所以价格下行。但到了那里，反而形势逆转，多头开始积极进场，空头则止盈离场。他们的止盈相当于买进。因此，两股合力造成买盘一下子变得比卖盘更积极，反弹于是发生。举一反三，应该不难阻力呢。阻力则是当前市场上方的某个价格潜在地积聚着大量卖出订单。原先多头比空头更踊跃价格于是上涨。但到了阻力所在的位置，因为空头变得积极建仓，而多头则卖出止盈。所以空单数量压过多单抛售于是发生。这是由于这个多空运动节奏转变的现象，我们也很常听到，人家将支撑与阻力称作变盘点。","p":"p374"},{"t":"但我要提醒你的是，由于是潜在的，在价格碰出该价位之前，我们无法确知在那里会不会出事情。会怎么样产生变化？称它为变盘，也不见得是变成反向运动。有可能是大家预期价格在那里，要折返。却意外地顺利越过，马上导致有人踏空和被套。诶，说到踏空与被套，你一定能够马上联想到突破的单元。所谓的突破点，其实就是某个被成功突破的支撑或阻力。就结果论，因为价格顺利突破了，所以多空运动的节奏是为此而加速。毕竟踏空看被套的人要赶紧加入顺势方向来修正自己错误的行为。因此，变盘不一定是反向运动，可能是加速顺向运行。但当然，也有对支撑阻力突破失败的情况。这就是我们常规之下理解的版本出现之后，价格反向运行。而确实，这种折回的情况更常出现，因为突破有80%的几率失败。市场更喜欢待在宽幅通道或区间，这种相对均衡的状态之中。遂此，如果交易者认定哦，这个价位应该存在支撑阻力，那就代表他相信。在该价位价格有60%以上的几率出现，至少得以令交易者争取剥头皮利润的运动。简单说，它至少会折返些许，让剥头皮交易的算法有短暂利润可图。如果不合乎这个标准，我们就不会说该价位存在支撑阻力。那你可能进一步好奇支撑阻力的形成，既然是因为有人在同个价位部署大量的反向订单。那为什么这些反向订单会集聚在这些地方呢？直接举例","p":"p375"}]},{"t":"para","text":"但我要提醒你的是，由于是潜在的，在价格碰出该价位之前，我们无法确知在那里会不会出事情。会怎么样产生变化？称它为变盘，也不见得是变成反向运动。有可能是大家预期价格在那里，要折返。却意外地顺利越过，马上导致有人踏空和被套。诶，说到踏空与被套，你一定能够马上联想到突破的单元。所谓的突破点，其实就是某个被成功突破的支撑或阻力。就结果论，因为价格顺利突破了，所以多空运动的节奏是为此而加速。毕竟踏空看被套的人要赶紧加入顺势方向来修正自己错误的行为。因此，变盘不一定是反向运动，可能是加速顺向运行。但当然，也有对支撑阻力突破失败的情况。这就是我们常规之下理解的版本出现之后，价格反向运行。而确实，这种折回的情况更常出现，因为突破有80%的几率失败。市场更喜欢待在宽幅通道或区间，这种相对均衡的状态之中。遂此，如果交易者认定哦，这个价位应该存在支撑阻力，那就代表他相信。在该价位价格有60%以上的几率出现，至少得以令交易者争取剥头皮利润的运动。简单说，它至少会折返些许，让剥头皮交易的算法有短暂利润可图。如果不合乎这个标准，我们就不会说该价位存在支撑阻力。那你可能进一步好奇支撑阻力的形成，既然是因为有人在同个价位部署大量的反向订单。那为什么这些反向订单会集聚在这些地方呢？直接举例","pid":"p375"},{"t":"img","src":"assets/img/l09A_128.webp","ilabel":"9-3","icap":"L09　磁铁 支撑与阻力","fid":"fig128","ctx":[{"t":"但我要提醒你的是，由于是潜在的，在价格碰出该价位之前，我们无法确知在那里会不会出事情。会怎么样产生变化？称它为变盘，也不见得是变成反向运动。有可能是大家预期价格在那里，要折返。却意外地顺利越过，马上导致有人踏空和被套。诶，说到踏空与被套，你一定能够马上联想到突破的单元。所谓的突破点，其实就是某个被成功突破的支撑或阻力。就结果论，因为价格顺利突破了，所以多空运动的节奏是为此而加速。毕竟踏空看被套的人要赶紧加入顺势方向来修正自己错误的行为。因此，变盘不一定是反向运动，可能是加速顺向运行。但当然，也有对支撑阻力突破失败的情况。这就是我们常规之下理解的版本出现之后，价格反向运行。而确实，这种折回的情况更常出现，因为突破有80%的几率失败。市场更喜欢待在宽幅通道或区间，这种相对均衡的状态之中。遂此，如果交易者认定哦，这个价位应该存在支撑阻力，那就代表他相信。在该价位价格有60%以上的几率出现，至少得以令交易者争取剥头皮利润的运动。简单说，它至少会折返些许，让剥头皮交易的算法有短暂利润可图。如果不合乎这个标准，我们就不会说该价位存在支撑阻力。那你可能进一步好奇支撑阻力的形成，既然是因为有人在同个价位部署大量的反向订单。那为什么这些反向订单会集聚在这些地方呢？直接举例","p":"p375"},{"t":"可能就会很好理解跟想象。以这张图为例，当价格处在这里的时候，你会怎么用上先前说过的知识来判断当下的脉络与动能呢？聪明的你很可能读得出来，在这边存在还算明确的边线，曾经突破失败。而边线之内的行情是连续性很差的，交替往返的不像是任何一边取得过绝对优势的状态。因此，这是典型的区间特征。在这里出现大阴线，接下来延续下跌，那想必再去更低的地方的可能性就很高。但是突破容易吗？区间倾向突破失败，很可能到了下边线再走一咪咪就终止了。这时候我们就将用上支撑与阻力的逻辑，想到可能潜藏的反向订单。于是开始考虑先前有过价格在区间下半部分屡屡止跌的历史，那到了这个前低点的关口。也或许，突破将会失败。同时，你也可以从另一个角度去考虑。虽然前面的K线没有截到，但你也不难想象，这里收了这么长的下影线，价格应该是下跌到这个最低点之后反转走高的。也就是说，前面其实有过一波下跌的动能，还有可能是某段小型下降趋势的尾巴。那么，既然空头能够打压价格到此处，而价格又折返上涨？那对于第二波下跌来说，这里就是要前去测试的原趋势极值没错吧？那到了这个关口，这个方才下跌的终点，多空又需要重新交战一次。因为空头会希望延续下跌，而多头则希望造就双重底，然后趋势反转。最后是多头胜出了，价格于是上行。可惜没有维持优势太久，又重新到这里来。那么，对这段下跌来说，同样是对原下跌趋势，这个下跌段落极值的测试。多空依然交战，各有各的企图。空头希望创新低，而多头则希望造成三重底或说楔形底，随后反转起高。那好，这次多头同样获胜，价格就收成阳线开始上行。用测试原趋势极值的逻辑去理解，这里依然能说通。这些上涨的走势当然都不是没有原因的。为什么多头能赢？为什么空头要退缩？因为区间倾向突破失败。因为空头刚刚在这些地方已经败下阵来，市场倾向重复方才做过的动作。于是在抵达这里以前，作为价格行为交易者，我们早已经开始考虑此处存在买单的可能性。那当然，那些精明的机构也不例外，他们也会超前部署。基于这样的预期，当看到旋即收出趋势阳线，而后还有跟进，我们的假设就被验证了。在区间的下三分之一部分，尤其背靠支撑入场，对于愿意短打的剥头皮交易者来说。是有利可图的。再来下一个目标可能会是哪里呢？我会说区间上缘也值得注目。不过，方才几次促成回转的价格地带似乎没有如常的发挥压制的效果，反而是直接穿透。此时你能够说刚刚在读图的时候预期这里有阻力的做法是错的吗？不能一方面是因为反向订单本来就是潜在的，我们可以有预期。但市场本来就不保证折回。而另一方面，则是因为如果我们没有做这样的评估，看到这样的结果，想说，哇，太妃，你叫我要预期阻力。可是涨上去了，你害我踏空了。于是下次想着看到强劲阳线，就直接买进去，打算开始无视这里可能存在阻力的可能性。那长期做下来，一定会头破血流。不知何时会出现，何时会发挥作用的第二推陷阱，将会把你给杀死。或许偶尔能对，因为区间总会突破成功，但多数时候突破倾向失败。支撑阻力都能够如期运作，而我们的赌性必然会令我们的资金吃足苦头。好，区间突破了，接下来我们关注什么？一般来讲，你要向左滑动图表看看左边有没有潜在的阻力。如果有的话，就可能至少造成小型趋势反转。但这张图没有左边的资讯，你就想象它是历史新高吧，先关注画面上有的内容就好。我们应该很快反应过来，突破后也倾向有测试。所以突破点也应该被你注意到，这里是潜在支撑所在。而到了这里，多空确实也需要重新交战，看看是趋势发起方的多头，能够维持优势。还是区间均衡的吸引力，能够帮空头一把，最终又把价格落回去。观察反应在这里空头失去动能。所以，多头胜出的可能性更大。这里潜在的买单似乎不只是潜在，而是逐渐能够确认其效用。随后确实又反转向上。之后就不一五一十讲出来了，担心你失去耐心。但在许许多多的等等会教会你如何标记的位置，都潜在有支撑阻力，多数发挥了拦阻的作用。少数则在突破之后加速运行。此间你所要习惯的是建立一个思考流程。如果支撑阻力被越过了，会怎么样？要么突破回调再突破，要么回调撑不住，是由被证明突破失败，于是折返。以及如果没越过又会怎么样？那就是折返前去测试下一个运动路径上会遇到的支撑阻力。随时留心，明哲保身。","p":"p376"}]},{"t":"para","text":"可能就会很好理解跟想象。以这张图为例，当价格处在这里的时候，你会怎么用上先前说过的知识来判断当下的脉络与动能呢？聪明的你很可能读得出来，在这边存在还算明确的边线，曾经突破失败。而边线之内的行情是连续性很差的，交替往返的不像是任何一边取得过绝对优势的状态。因此，这是典型的区间特征。在这里出现大阴线，接下来延续下跌，那想必再去更低的地方的可能性就很高。但是突破容易吗？区间倾向突破失败，很可能到了下边线再走一咪咪就终止了。这时候我们就将用上支撑与阻力的逻辑，想到可能潜藏的反向订单。于是开始考虑先前有过价格在区间下半部分屡屡止跌的历史，那到了这个前低点的关口。也或许，突破将会失败。同时，你也可以从另一个角度去考虑。虽然前面的K线没有截到，但你也不难想象，这里收了这么长的下影线，价格应该是下跌到这个最低点之后反转走高的。也就是说，前面其实有过一波下跌的动能，还有可能是某段小型下降趋势的尾巴。那么，既然空头能够打压价格到此处，而价格又折返上涨？那对于第二波下跌来说，这里就是要前去测试的原趋势极值没错吧？那到了这个关口，这个方才下跌的终点，多空又需要重新交战一次。因为空头会希望延续下跌，而多头则希望造就双重底，然后趋势反转。最后是多头胜出了，价格于是上行。可惜没有维持优势太久，又重新到这里来。那么，对这段下跌来说，同样是对原下跌趋势，这个下跌段落极值的测试。多空依然交战，各有各的企图。空头希望创新低，而多头则希望造成三重底或说楔形底，随后反转起高。那好，这次多头同样获胜，价格就收成阳线开始上行。用测试原趋势极值的逻辑去理解，这里依然能说通。这些上涨的走势当然都不是没有原因的。为什么多头能赢？为什么空头要退缩？因为区间倾向突破失败。因为空头刚刚在这些地方已经败下阵来，市场倾向重复方才做过的动作。于是在抵达这里以前，作为价格行为交易者，我们早已经开始考虑此处存在买单的可能性。那当然，那些精明的机构也不例外，他们也会超前部署。基于这样的预期，当看到旋即收出趋势阳线，而后还
