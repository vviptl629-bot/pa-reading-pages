向订单本来就是潜在的，我们可以有预期。但市场本来就不保证折回。而另一方面，则是因为如果我们没有做这样的评估，看到这样的结果，想说，哇，太妃，你叫我要预期阻力。可是涨上去了，你害我踏空了。于是下次想着看到强劲阳线，就直接买进去，打算开始无视这里可能存在阻力的可能性。那长期做下来，一定会头破血流。不知何时会出现，何时会发挥作用的第二推陷阱，将会把你给杀死。或许偶尔能对，因为区间总会突破成功，但多数时候突破倾向失败。支撑阻力都能够如期运作，而我们的赌性必然会令我们的资金吃足苦头。好，区间突破了，接下来我们关注什么？一般来讲，你要向左滑动图表看看左边有没有潜在的阻力。如果有的话，就可能至少造成小型趋势反转。但这张图没有左边的资讯，你就想象它是历史新高吧，先关注画面上有的内容就好。我们应该很快反应过来，突破后也倾向有测试。所以突破点也应该被你注意到，这里是潜在支撑所在。而到了这里，多空确实也需要重新交战，看看是趋势发起方的多头，能够维持优势。还是区间均衡的吸引力，能够帮空头一把，最终又把价格落回去。观察反应在这里空头失去动能。所以，多头胜出的可能性更大。这里潜在的买单似乎不只是潜在，而是逐渐能够确认其效用。随后确实又反转向上。之后就不一五一十讲出来了，担心你失去耐心。但在许许多多的等等会教会你如何标记的位置，都潜在有支撑阻力，多数发挥了拦阻的作用。少数则在突破之后加速运行。此间你所要习惯的是建立一个思考流程。如果支撑阻力被越过了，会怎么样？要么突破回调再突破，要么回调撑不住，是由被证明突破失败，于是折返。以及如果没越过又会怎么样？那就是折返前去测试下一个运动路径上会遇到的支撑阻力。随时留心，明哲保身。","p":"p376"},{"t":"综合以上，你可能发现，其实关于支撑阻力的作用方式，前面的单元都已经大致涵盖过了。不外乎是测试之后有一方胜出导致成功的突破或失败的突破。而也如同我们一再强调的突破是，意外事件不突破才是常态。因此，意外将导致第二推而折返，则将导引价格前去测试下一个待测试的目标。就这么简单。不过，细究了其中的原理，我们又可以进一步的归结出之所以在这些地方会聚集大量的反向订单。其实不外乎就是基于两大类型的原因，利害关系以及心理预期。这是技术分析经典股价趋势技术分析所使用的语言。利害关系简言之，就是有人要在那里解套。比如，在价格突破以后押注错误方向，以为价格会如常态般折返的人开始亏损。所以他们渴望争取盈亏平衡的离场。这种因为自身利害关系急于弥平浮亏的离场订单部署，在入场价也就是突破点时就会令这附近累积其反向订单。而与之相伴的，则是基于心理预期而部署的反向订单。对于另一批人，比如在这回头测试的过程中做空的人。以及刚刚踏空了，或者还想要加仓的多头，他们都知道强劲突破发起之后，多头们应该要去保护突破点不被跌破。所以在这里预期多头会胜出，应该胜率更高，因而他们也部署多单。那么，相较于这波测试方向是空，做多的订单，就当然是反向订单将托起价格往更高的地方去。这也就符合了前述对支撑的定义。在当前市场价格之下，潜在聚集大量的反向订单，也就是买单的位置。多数人相信，在此处至少能有一波小小的折返，使得剥头皮交易者的短打有利可图。利害关系以及心理预期在这里发挥了作用。这两大因素是隐藏在这些订单背后的基本逻辑与意图。而化为行动，则是有众多交易者急于解套，急于止盈，急于建仓的理由，准备在此逆势而为。因而，放置大量订单。这些订单就是支撑阻力可以运作的唯一原因。没错，是唯一原因。只要这里没有反向订单，那这就只是空气，没有支撑阻力可言，价格当然也不会反向去走。","p":"p377"}]},{"t":"para","text":"综合以上，你可能发现，其实关于支撑阻力的作用方式，前面的单元都已经大致涵盖过了。不外乎是测试之后有一方胜出导致成功的突破或失败的突破。而也如同我们一再强调的突破是，意外事件不突破才是常态。因此，意外将导致第二推而折返，则将导引价格前去测试下一个待测试的目标。就这么简单。不过，细究了其中的原理，我们又可以进一步的归结出之所以在这些地方会聚集大量的反向订单。其实不外乎就是基于两大类型的原因，利害关系以及心理预期。这是技术分析经典股价趋势技术分析所使用的语言。利害关系简言之，就是有人要在那里解套。比如，在价格突破以后押注错误方向，以为价格会如常态般折返的人开始亏损。所以他们渴望争取盈亏平衡的离场。这种因为自身利害关系急于弥平浮亏的离场订单部署，在入场价也就是突破点时就会令这附近累积其反向订单。而与之相伴的，则是基于心理预期而部署的反向订单。对于另一批人，比如在这回头测试的过程中做空的人。以及刚刚踏空了，或者还想要加仓的多头，他们都知道强劲突破发起之后，多头们应该要去保护突破点不被跌破。所以在这里预期多头会胜出，应该胜率更高，因而他们也部署多单。那么，相较于这波测试方向是空，做多的订单，就当然是反向订单将托起价格往更高的地方去。这也就符合了前述对支撑的定义。在当前市场价格之下，潜在聚集大量的反向订单，也就是买单的位置。多数人相信，在此处至少能有一波小小的折返，使得剥头皮交易者的短打有利可图。利害关系以及心理预期在这里发挥了作用。这两大因素是隐藏在这些订单背后的基本逻辑与意图。而化为行动，则是有众多交易者急于解套，急于止盈，急于建仓的理由，准备在此逆势而为。因而，放置大量订单。这些订单就是支撑阻力可以运作的唯一原因。没错，是唯一原因。只要这里没有反向订单，那这就只是空气，没有支撑阻力可言，价格当然也不会反向去走。","pid":"p377"},{"t":"img","src":"assets/img/l09A_130.webp","ilabel":"9-5","icap":"L09　磁铁 支撑与阻力","fid":"fig130","ctx":[{"t":"综合以上，你可能发现，其实关于支撑阻力的作用方式，前面的单元都已经大致涵盖过了。不外乎是测试之后有一方胜出导致成功的突破或失败的突破。而也如同我们一再强调的突破是，意外事件不突破才是常态。因此，意外将导致第二推而折返，则将导引价格前去测试下一个待测试的目标。就这么简单。不过，细究了其中的原理，我们又可以进一步的归结出之所以在这些地方会聚集大量的反向订单。其实不外乎就是基于两大类型的原因，利害关系以及心理预期。这是技术分析经典股价趋势技术分析所使用的语言。利害关系简言之，就是有人要在那里解套。比如，在价格突破以后押注错误方向，以为价格会如常态般折返的人开始亏损。所以他们渴望争取盈亏平衡的离场。这种因为自身利害关系急于弥平浮亏的离场订单部署，在入场价也就是突破点时就会令这附近累积其反向订单。而与之相伴的，则是基于心理预期而部署的反向订单。对于另一批人，比如在这回头测试的过程中做空的人。以及刚刚踏空了，或者还想要加仓的多头，他们都知道强劲突破发起之后，多头们应该要去保护突破点不被跌破。所以在这里预期多头会胜出，应该胜率更高，因而他们也部署多单。那么，相较于这波测试方向是空，做多的订单，就当然是反向订单将托起价格往更高的地方去。这也就符合了前述对支撑的定义。在当前市场价格之下，潜在聚集大量的反向订单，也就是买单的位置。多数人相信，在此处至少能有一波小小的折返，使得剥头皮交易者的短打有利可图。利害关系以及心理预期在这里发挥了作用。这两大因素是隐藏在这些订单背后的基本逻辑与意图。而化为行动，则是有众多交易者急于解套，急于止盈，急于建仓的理由，准备在此逆势而为。因而，放置大量订单。这些订单就是支撑阻力可以运作的唯一原因。没错，是唯一原因。只要这里没有反向订单，那这就只是空气，没有支撑阻力可言，价格当然也不会反向去走。","p":"p377"},{"t":"更进一步说，其实市场上的价格行为一下上行，一下下跌，其实这是在一格又一格的支撑或阻力之间摆荡。到站以后，要么继续前往位于更上方的下一站。要么掉头逆行，重新拜访刚刚走过的来时路。为什么呢？你也当然知道，市场不断探寻支撑和阻力，同样是为了它自身最大的功用，最大的内在驱力，试图找到一个公平的价格地带。尤其你也晓得市场有其惰性，有强烈的倾向去维持现状。所以，在偏向均衡的状态中，它会使多数突破的尝试，尝试挣脱均衡的尝试都败下阵来。你于是可以看见，在宽幅通道中非常平缓的趋势线和通道线会起到规律的作用。引导行情在其所夹出的通道之中震荡。而区间依然夹在上下的支撑和阻力，这是价格运行过渡需要修正的边界。价格会透过折返来重新趋近，作为方向几率均衡为50%的区间中轴。但同时，一旦市场进入趋势状态，惰性同样会发挥作用。一旦趋势强劲，还有健康的动能高低点也不断递进。那么，即使运行过程中触及支撑和阻力。多数反转的尝试也将以失败告终。这绝对会使得每逢阻拦就想要立即压住V型反转的交易者损失严重。大多数支撑和阻力都会在趋势中被突破，只有到趋势末期，如我们前面所教的那样，动能渐弱，逆势压力渐强，而大型趋势反转的条件一一备齐以后，最后有一次对某个支撑/阻力的突破宣告失败导致反转。这么一来，你也将意识到，对交易者来说，时时注意自身足以的存在是非常关键的任务。当顺着趋势交易，你希望看到他们一一被击破，因此你必须意识到这些拦阻的存在，并目睹价格顺利的击穿他们。反之，若是穿过支撑阻力的动作不明确，不强劲甚至很疲弱，那你就也要预期接下来任何小型或大型趋势反转。也将启动于某个潜在的拦阻之上。这些逆势运动可能对持仓的你带来威胁，也可能给到还没持仓的你交易机会。注意他们将使得知悉其所在位置与性质的交易者能够在最优质的价位止盈，乃至于反手交易。这也就是说，你多能够趋吉避凶，就端看你对他们的觉察是否足够锐利。","p":"p378"}]},{"t":"para","text":"更进一步说，其实市场上的价格行为一下上行，一下下跌，其实这是在一格又一格的支撑或阻力之间摆荡。到站以后，要么继续前往位于更上方的下一站。要么掉头逆行，重新拜访刚刚走过的来时路。为什么呢？你也当然知道，市场不断探寻支撑和阻力，同样是为了它自身最大的功用，最大的内在驱力，试图找到一个公平的价格地带。尤其你也晓得市场有其惰性，有强烈的倾向去维持现状。所以，在偏向均衡的状态中，它会使多数突破的尝试，尝试挣脱均衡的尝试都败下阵来。你于是可以看见，在宽幅通道中非常平缓的趋势线和通道线会起到规律的作用。引导行情在其所夹出的通道之中震荡。而区间依然夹在上下的支撑和阻力，这是价格运行过渡需要修正的边界。价格会透过折返来重新趋近，作为方向几率均衡为50%的区间中轴。但同时，一旦市场进入趋势状态，惰性同样会发挥作用。一旦趋势强劲，还有健康的动能高低点也不断递进。那么，即使运行过程中触及支撑和阻力。多数反转的尝试也将以失败告终。这绝对会使得每逢阻拦就想要立即压住V型反转的交易者损失严重。大多数支撑和阻力都会在趋势中被突破，只有到趋势末期，如我们前面所教的那样，动能渐弱，逆势压力渐强，而大型趋势反转的条件一一备齐以后，最后有一次对某个支撑/阻力的突破宣告失败导致反转。这么一来，你也将意识到，对交易者来说，时时注意自身足以的存在是非常关键的任务。当顺着趋势交易，你希望看到他们一一被击破，因此你必须意识到这些拦阻的存在，并目睹价格顺利的击穿他们。反之，若是穿过支撑阻力的动作不明确，不强劲甚至很疲弱，那你就也要预期接下来任何小型或大型趋势反转。也将启动于某个潜在的拦阻之上。这些逆势运动可能对持仓的你带来威胁，也可能给到还没持仓的你交易机会。注意他们将使得知悉其所在位置与性质的交易者能够在最优质的价位止盈，乃至于反手交易。这也就是说，你多能够趋吉避凶，就端看你对他们的觉察是否足够锐利。","pid":"p378"},{"t":"img","src":"assets/img/l09A_131.webp","ilabel":"9-6","icap":"L09　磁铁 支撑与阻力","fid":"fig131","ctx":[{"t":"更进一步说，其实市场上的价格行为一下上行，一下下跌，其实这是在一格又一格的支撑或阻力之间摆荡。到站以后，要么继续前往位于更上方的下一站。要么掉头逆行，重新拜访刚刚走过的来时路。为什么呢？你也当然知道，市场不断探寻支撑和阻力，同样是为了它自身最大的功用，最大的内在驱力，试图找到一个公平的价格地带。尤其你也晓得市场有其惰性，有强烈的倾向去维持现状。所以，在偏向均衡的状态中，它会使多数突破的尝试，尝试挣脱均衡的尝试都败下阵来。你于是可以看见，在宽幅通道中非常平缓的趋势线和通道线会起到规律的作用。引导行情在其所夹出的通道之中震荡。而区间依然夹在上下的支撑和阻力，这是价格运行过渡需要修正的边界。价格会透过折返来重新趋近，作为方向几率均衡为50%的区间中轴。但同时，一旦市场进入趋势状态，惰性同样会发挥作用。一旦趋势强劲，还有健康的动能高低点也不断递进。那么，即使运行过程中触及支撑和阻力。多数反转的尝试也将以失败告终。这绝对会使得每逢阻拦就想要立即压住V型反转的交易者损失严重。大多数支撑和阻力都会在趋势中被突破，只有到趋势末期，如我们前面所教的那样，动能渐弱，逆势压力渐强，而大型趋势反转的条件一一备齐以后，最后有一次对某个支撑/阻力的突破宣告失败导致反转。这么一来，你也将意识到，对交易者来说，时时注意自身足以的存在是非常关键的任务。当顺着趋势交易，你希望看到他们一一被击破，因此你必须意识到这些拦阻的存在，并目睹价格顺利的击穿他们。反之，若是穿过支撑阻力的动作不明确，不强劲甚至很疲弱，那你就也要预期接下来任何小型或大型趋势反转。也将启动于某个潜在的拦阻之上。这些逆势运动可能对持仓的你带来威胁，也可能给到还没持仓的你交易机会。注意他们将使得知悉其所在位置与性质的交易者能够在最优质的价位止盈，乃至于反手交易。这也就是说，你多能够趋吉避凶，就端看你对他们的觉察是否足够锐利。","p":"p378"},{"t":"说了这么多，你也许感到疑问，明明这个单元的标题我们给了一个奇怪的称呼磁体。怎么至今都没有说明这是什么意思？说得好，我们马上展开来谈。事实上，磁体完全就是支撑和阻力。只不过起一个这样的名称，更有助于我们了解它作用的本质，也就是它存在磁力的特性。交易者必须了解到，正如我们前面所讲的，价格的运动实际上就是不断在支撑和阻力之间折返往复。到了一站再去下站，越不过这站就折回上一站。这种价格始终趋近前往，以支撑阻力为运动目标的特性，被我们给洞悉以后。我们于是可以给他一个精准的形容。这些支撑阻力就像是磁铁一样，把波动中的价格给吸过去。不止这样，仔细看，它还能比你想象的更像磁体。我们也许在小时候还拿着磁铁把玩的时候就大概知道距离太远的话，磁力通常会很弱。往往是两块磁铁靠得最近的时候，磁力一下会加强很多。市场也是这样的，非常神奇，价格在前赴支撑阻力的过程中，运动的速度也不是均匀的。很多时候是越接近磁体所受到的牵引力道就越强，运动的速度也就越快。也于是你往往能够看到它慢慢靠近，慢慢靠近，然后一下子加速撞上去。原理是什么呢？你可能在前面的单元或其他地方隐约知悉过，这是真空效应导致的现象。所谓的真空，不一定是一种绝对的真空，不是说价格运动的路径上毫无交投发生。而是交易者基于某种以逸待劳的心理选择，在更利己的位置入场，所导致的价格运动路径上的反向订单。变得比起平常相对更稀薄的现象。我在说什么呢？回想第二推陷阱。区间中屡屡有第二推陷阱的现象，价格看似要强劲突破区间边线，却又马上折回。为什么这第二推会加速？这是因为大家都晓得，一旦价格继续朝边线运动，那触碰边线就是几率很高的事情。对画面中这张图表上想要买进的多头来说。最划算的选择必然是在区间边线上去入场，而非在路途中拦截。毕竟如果能到这里，它能以最便宜的价格买在转折点上，买在转折点附近。那他干嘛提早进去用肉身去弹呢？抢先入场的话，他既要忍受向下这一段距离的浮亏。价格反转走高以后，它也少赚了这一利润，这显然不一定是最聪明的选择。所以同样又是所有人要以真金白银投票的场合。多头必须选择如何舍以及如何得。我比较武断的,化约为这两种选项好了，方便你明白。A做法是他担心踏空，他担心没有能够真的走到边线就形成低点抬高的双重底。自己只能眼巴巴看着利润溜走。所以他宁可忍受短暂的浮亏，宁可少赚，也必须要提早进场才感到心安。那这时候他就会选择在半路先买。而B做法是他不介意踏空，但他不想买在一个不够划算的位置。所以他宁可冒着入不了场的风险，挤出十足的耐心，确切的在区间边线上。才部署反向订单来买进。那大家就投票选A的，提早建仓选B的，乖乖等待。很多时候你会发现选B的人比较多的结果就是大家都在下方守株待兔。中间的买单变得非常稀薄，于是价格穿透的很快。因为一下子就把选A的人的订单，他们所部署的防守给穿了。呈现为K线就是趋向边线的加速运动。这里聚集的大量反向订单还记得吗？我们说支撑跟阻力就是潜在大量反向订单存在的位置。这么多人要买，于是价格出现后就转折。不止如此，你一定还没有忘记我说的磁力这种加速的表现，就是价格越靠近磁体。订单就越稀薄的原理所导致的。这种订单相对真空的状态，我们就称之为真空效应。它成就了吸力，成就了磁力，给了支撑与阻力。磁体的性格。于是你综合起来理解我们，可以说在价格逐步趋近磁体时，也将进入其磁力范围内。并因受到牵引而加速运动，这就是真空效应。而一旦触及磁体，则磁力消失，使价格倾向掉头，而测试其他磁体。或者订单因为消耗完毕而被穿透，也同样将往其他磁体前去。","p":"p379"}]},{"t":"para","text":"说了这么多，你也许感到疑问，明明这个单元的标题我们给了一个奇怪的称呼磁体。怎么至今都没有说明这是什么意思？说得好，我们马上展开来谈。事实上，磁体完全就是支撑和阻力。只不过起一个这样的名称，更有助于我们了解它作用的本质，也就是它存在磁力的特性。交易者必须了解到，正如我们前面所讲的，价格的运动实际上就是不断在支撑和阻力之间折返往复。到了一站再去下站，越不过这站就折回上一站。这种价格始终趋近前往，以支撑阻力为运动目标的特性，被我们给洞悉以后。我们于是可以给他一个精准的形容。这些支撑阻力就像是磁铁一样，把波动中的价格给吸过去。不止这样，仔细看，它还能比你想象的更像磁体。我们也许在小时候还拿着磁铁把玩的时候就大概知道距离太远的话，磁力通常会很弱。往往是两块磁铁靠得最近的时候，磁力一下会加强很多。市场也是这样的，非常神奇，价格在前赴支撑阻力的过程中，运动的速度也不是均匀的。很多时候是越接近磁体所受到的牵引力道就越强，运动的速度也就越快。也于是你往往能够看到它慢慢靠近，慢慢靠近，然后一下子加速撞上去。原理是什么呢？你可能在前面的单元或其他地方隐约知悉过，这是真空效应导致的现象。所谓的真空，不一定是一种绝对的真空，不是说价格运动的路径上毫无交投发生。而是交易者基于某种以逸待劳的心理选择，在更利己的位置入场，所导致的价格运动路径上的反向订单。变得比起平常相对更稀薄的现象。我在说什么呢？回想第二推陷阱。区间中屡屡有第二推陷阱的现象，价格看似要强劲突破区间边线，却又马上折回。为什么这第二推会加速？这是因为大家都晓得，一旦价格继续朝边线运动，那触碰边线就是几率很高的事情。对画面中这张图表上想要买进的多头来说。最划算的选择必然是在区间边线上去入场，而非在路途中拦截。毕竟如果能到这里，它能以最便宜的价格买在转折点上，买在转 试，你可以用来设计建仓，而不用担心资金放进去会被卡很久的临近磁体。并且更重要的要学会妥善的止损，将来在交易方法的板块会好好教会你。第二，这些更关乎你如何正确的使用磁体这项读图工具，我会再分出三项细则供你参考。承上，我需要注意那些离你比较近的磁体，对吧？那当交易者发现价格在运行路径上的不远处存在磁体时，所应遵守的原则是，在价格碰触磁体前，最好只顺着其方向交易。否则，由于磁力由于真空效应，你逆着建仓的话很容易浮亏，很容易被触及止损。再来前面提过的，同样不怕你嫌我啰嗦，我再讲一次。磁体由大量潜在的反向订单构成，但在测试之前，在价格真正行底到位以前。我们都不会确定到底反向订单存在的是多是少，到底价格是会剧烈折返还是悄然无息的穿过去？所以切勿在磁铁处直接逆势入场，切勿挂上限价订单，押注首次入场机会，就能反转成功。尤其在强劲趋势中，更不应该这么做。强劲趋势中的多数磁体最终都会被穿透。你要是长期接刀下来，必定会伤痕累累。而最后不是面对磁体时，顺着它交易就完了，也不是记得不要挂单接刀就好了。你还要眼睛睁大，看着当价格触及磁体时的反应产生的新的价格行为是什么？是顺势动能强劲，还是动能立即停顿，还是逆势力量旋即出现？换句话说，交易者去判断接下来突破盘整反转的几率何止更大。如果对此后知后觉，你一眨眼价格已经在前往其他磁体的路上了，我们也就没有办法完整的掌握运用磁体盈利的方法。你一定还记得突破单元，我们说过交易者所最应该学会的重要技能没有之一。就是判断接下来多头将会胜出，还是空头将会胜出？突破到底会成功还是失败？突破什么呢？就是突破磁体。跟得上，做得准，你就能够盈利。","pid":"p380"}],"wcount":7313},{"id":"l09B","title":"第B段　磁铁 支撑与阻力","blocks":[{"t":"para","text":"L09B 磁铁 支撑与阻力","pid":"p381"},{"t":"para","text":"上一节认识完磁体的原理，按性质来由，接下来就是更实用的重头戏。说明一下磁体有哪些种类，其中哪些更有用处，哪一些则可以忽略。同样在书中，阿尔布克斯列出了十余项可能被用作支撑和阻力的项目。也许作为一本大部头的教科书，它想要尽可能的把知识都包含进去，所以没有在裂点的时候就完全去芜存菁。但读完整部书好几趟，或者甚至购买他的课程follow他和他学生在网志里的读图以后，你会发现最重要，最好用它最常用的磁体就只有这几种。","pid":"p382"},{"t":"img","src":"assets/img/l09B_133.webp","ilabel":"9-8","icap":"L09　磁铁 支撑与阻力","fid":"fig133","ctx":[{"t":"L09B 磁铁 支撑与阻力","p":"p381"},{"t":"上一节认识完磁体的原理，按性质来由，接下来就是更实用的重头戏。说明一下磁体有哪些种类，其中哪些更有用处，哪一些则可以忽略。同样在书中，阿尔布克斯列出了十余项可能被用作支撑和阻力的项目。也许作为一本大部头的教科书，它想要尽可能的把知识都包含进去，所以没有在裂点的时候就完全去芜存菁。但读完整部书好几趟，或者甚至购买他的课程follow他和他学生在网志里的读图以后，你会发现最重要，最好用它最常用的磁体就只有这几种。","p":"p382"},{"t":"前波段高低点，区间的上下缘，趋势线与通道线，均线，还有等距运动目标与50%回调目标。总共五大项目。","p":"p383"}]},{"t":"para","text":"前波段高低点，区间的上下缘，趋势线与通道线，均线，还有等距运动目标与50%回调目标。总共五大项目。","pid":"p383"},{"t":"img","src":"assets/img/l09B_134.webp","ilabel":"9-9","icap":"L09　磁铁 支撑与阻力","fid":"fig134","ctx":[{"t":"前波段高低点，区间的上下缘，趋势线与通道线，均线，还有等距运动目标与50%回调目标。总共五大项目。","p":"p383"},{"t":"除此之外，你也偶尔会听他讲到的次要的磁体则可能包括多头入场K线的低点和空头入场K线的高点。或者多头讯号K线高点与空头讯号K线低点。以及日周月年线的开高低收，还有缺口等等。但说实在的，效用相对有限，一下子要你记住他们，却又其实很难派上超级有效的用场的话。你很可能会感到混淆。因此，如果这是你第一次比较完整，比较深入的学习，阿尔布鲁克斯的价格行为知识体系。但其实你不需要知道那么多，可以等到将来你有余裕，精进以后再去探究。对我个人来说，以及阿尔布鲁克斯在各处呈现的各类证据都揭示了前面提到的那五种最有效。所以除了等距运动，还有50%回调目标，我们会随后用专门的单元处理以外。今天这节就在着重学剩下的四种。光是这五类磁体理应能够在九成的情况下都足够你使用。首先是前波段高低点，最泛用重要性最高。在展开来细讲以前，大家可能对这类磁体的模糊理解就是有转折的地方，就是重要的吧。这某种程度上是对的。比如，当前趋势的极值应该很容易理解。趋势要延续，就必须要突破极值。因此，测试极值的时候会受到一定程度的阻抗，我们在测试的单元就强调过这个观念了。但趋势中段的所有转折都很重要吗？这不尽然。我们其实只希望去筛选出相对足够关键的那一些。既不希望被无数的磁体给弄得眼花缭乱。又不想要太粗枝大叶，跟丢一些小的，但重要的脉动。我们希望找到那个恰到好处的度量。那要怎么做到这一点呢？有一个标准供你参考哦，我们直接进例子来说明。","p":"p384"}]},{"t":"para","text":"除此之外，你也偶尔会听他讲到的次要的磁体则可能包括多头入场K线的低点和空头入场K线的高点。或者多头讯号K线高点与空头讯号K线低点。以及日周月年线的开高低收，还有缺口等等。但说实在的，效用相对有限，一下子要你记住他们，却又其实很难派上超级有效的用场的话。你很可能会感到混淆。因此，如果这是你第一次比较完整，比较深入的学习，阿尔布鲁克斯的价格行为知识体系。但其实你不需要知道那么多，可以等到将来你有余裕，精进以后再去探究。对我个人来说，以及阿尔布鲁克斯在各处呈现的各类证据都揭示了前面提到的那五种最有效。所以除了等距运动，还有50%回调目标，我们会随后用专门的单元处理以外。今天这节就在着重学剩下的四种。光是这五类磁体理应能够在九成的情况下都足够你使用。首先是前波段高低点，最泛用重要性最高。在展开来细讲以前，大家可能对这类磁体的模糊理解就是有转折的地方，就是重要的吧。这某种程度上是对的。比如，当前趋势的极值应该很容易理解。趋势要延续，就必须要突破极值。因此，测试极值的时候会受到一定程度的阻抗，我们在测试的单元就强调过这个观念了。但趋势中段的所有转折都很重要吗？这不尽然。我们其实只希望去筛选出相对足够关键的那一些。既不希望被无数的磁体给弄得眼花缭乱。又不想要太粗枝大叶，跟丢一些小的，但重要的脉动。我们希望找到那个恰到好处的度量。那要怎么做到这一点呢？有一个标准供你参考哦，我们直接进例子来说明。","pid":"p384"},{"t":"img","src":"assets/img/l09B_135.webp","ilabel":"9-10","icap":"L09　磁铁 支撑与阻力","fid":"fig135","ctx":[{"t":"除此之外，你也偶尔会听他讲到的次要的磁体则可能包括多头入场K线的低点和空头入场K线的高点。或者多头讯号K线高点与空头讯号K线低点。以及日周月年线的开高低收，还有缺口等等。但说实在的，效用相对有限，一下子要你记住他们，却又其实很难派上超级有效的用场的话。你很可能会感到混淆。因此，如果这是你第一次比较完整，比较深入的学习，阿尔布鲁克斯的价格行为知识体系。但其实你不需要知道那么多，可以等到将来你有余裕，精进以后再去探究。对我个人来说，以及阿尔布鲁克斯在各处呈现的各类证据都揭示了前面提到的那五种最有效。所以除了等距运动，还有50%回调目标，我们会随后用专门的单元处理以外。今天这节就在着重学剩下的四种。光是这五类磁体理应能够在九成的情况下都足够你使用。首先是前波段高低点，最泛用重要性最高。在展开来细讲以前，大家可能对这类磁体的模糊理解就是有转折的地方，就是重要的吧。这某种程度上是对的。比如，当前趋势的极值应该很容易理解。趋势要延续，就必须要突破极值。因此，测试极值的时候会受到一定程度的阻抗，我们在测试的单元就强调过这个观念了。但趋势中段的所有转折都很重要吗？这不尽然。我们其实只希望去筛选出相对足够关键的那一些。既不希望被无数的磁体给弄得眼花缭乱。又不想要太粗枝大叶，跟丢一些小的，但重要的脉动。我们希望找到那个恰到好处的度量。那要怎么做到这一点呢？有一个标准供你参考哦，我们直接进例子来说明。","p":"p384"},{"t":"这是一波下降趋势，我们有时候会希望在下降趋势中找到可靠的阻力。这有两个用途：比较近期的是，当趋势还在发展，而你已经中途做空的时候。你会希望找到合宜的止损位置。你不会希望止损被随便打到把你扫出场之后，价格继续下跌，对吧？但你又希望止损被触发的时候就是真的价格开始反转，向上去运动的时候。这样一来，你的止损就是有效的，为你挡灾解饿。所以下降趋势中的前波断点作为阻力，可以用以放置止损。第二个用途就是趋势也许开始反转了，那你会想要知道在上涨的过程中，我们能够预期这轮涨势。可能在哪些地方休止？这样一来，如果你持有多头仓位，你会知道在哪些地方止盈会是好的选择。遂此你应该已经意识到，准确找寻磁体的功力，又关你是否能够精准的止损和止盈。要怎么拿捏这之间的度量呢？要怎么要求自己的止损和止盈都不随意触发，最好能让利润最大化。但一旦触发就惊人的准确，用最快的速度截断亏损，截断利润回吐呢？这绝对是个不容易的问题。而这样找寻阻力，找寻磁体的任务，常常是需要在行情发展的过程中做动态发掘的。如果我这样顺着播放一次，把这趟下跌的趋势顺过。请认真的思考，你会考虑将哪些地方标记为前波段高低点。我再播一次，请大家平心静气的当做这是你自己的交易来想。且勿自欺欺人，如实想象，如实作答。好，现在我把大家心中可能的答案都列在上面了，如果有漏很不好意思。接着我们来一一讨论这些选项，并且说明筛选的标准。","p":"p385"}]},{"t":"para","text":"这是一波下降趋势，我们有时候会希望在下降趋势中找到可靠的阻力。这有两个用途：比较近期的是，当趋势还在发展，而你已经中途做空的时候。你会希望找到合宜的止损位置。你不会希望止损被随便打到把你扫出场之后，价格继续下跌，对吧？但你又希望止损被触发的时候就是真的价格开始反转，向上去运动的时候。这样一来，你的止损就是有效的，为你挡灾解饿。所以下降趋势中的前波断点作为阻力，可以用以放置止损。第二个用途就是趋势也许开始反转了，那你会想要知道在上涨的过程中，我们能够预期这轮涨势。可能在哪些地方休止？这样一来，如果你持有多头仓位，你会知道在哪些地方止盈会是好的选择。遂此你应该已经意识到，准确找寻磁体的功力，又关你是否能够精准的止损和止盈。要怎么拿捏这之间的度量呢？要怎么要求自己的止损和止盈都不随意触发，最好能让利润最大化。但一旦触发就惊人的准确，用最快的速度截断亏损，截断利润回吐呢？这绝对是个不容易的问题。而这样找寻阻力，找寻磁体的任务，常常是需要在行情发展的过程中做动态发掘的。如果我这样顺着播放一次，把这趟下跌的趋势顺过。请认真的思考，你会考虑将哪些地方标记为前波段高低点。我再播一次，请大家平心静气的当做这是你自己的交易来想。且勿自欺欺人，如实想象，如实作答。好，现在我把大家心中可能的答案都列在上面了，如果有漏很不好意思。接着我们来一一讨论这些选项，并且说明筛选的标准。","pid":"p385"},{"t":"img","src":"assets/img/l09B_136.webp","ilabel":"9-11","icap":"L09　磁铁 支撑与阻力","fid":"fig136","ctx":[{"t":"这是一波下降趋势，我们有时候会希望在下降趋势中找到可靠的阻力。这有两个用途：比较近期的是，当趋势还在发展，而你已经中途做空的时候。你会希望找到合宜的止损位置。你不会希望止损被随便打到把你扫出场之后，价格继续下跌，对吧？但你又希望止损被触发的时候就是真的价格开始反转，向上去运动的时候。这样一来，你的止损就是有效的，为你挡灾解饿。所以下降趋势中的前波断点作为阻力，可以用以放置止损。第二个用途就是趋势也许开始反转了，那你会想要知道在上涨的过程中，我们能够预期这轮涨势。可能在哪些地方休止？这样一来，如果你持有多头仓位，你会知道在哪些地方止盈会是好的选择。遂此你应该已经意识到，准确找寻磁体的功力，又关你是否能够精准的止损和止盈。要怎么拿捏这之间的度量呢？要怎么要求自己的止损和止盈都不随意触发，最好能让利润最大化。但一旦触发就惊人的准确，用最快的速度截断亏损，截断利润回吐呢？这绝对是个不容易的问题。而这样找寻阻力，找寻磁体的任务，常常是需要在行情发展的过程中做动态发掘的。如果我这样顺着播放一次，把这趟下跌的趋势顺过。请认真的思考，你会考虑将哪些地方标记为前波段高低点。我再播一次，请大家平心静气的当做这是你自己的交易来想。且勿自欺欺人，如实想象，如实作答。好，现在我把大家心中可能的答案都列在上面了，如果有漏很不好意思。接着我们来一一讨论这些选项，并且说明筛选的标准。","p":"p385"},{"t":"此间我想告诉你的是，波段点也就是这些价格的转折处，有重要的与次级的分别。我们只需要先选出重要的。而最重要的标准是，当价格创新低进入回调而后回调结束。又成功有效的创新低之后，我们才回头确认，刚刚这波回调的最高点为重要波段点。再说一次创新低，回调，成功有效的在创新低之后确认，刚刚回调的最高点。按照这样的标准来看，我们只会选出三个。而且不是在大型趋势反转以后才马后炮的选出这三个。是在趋势还没发展完的过程中，就能够标记出来。比如第一个虽然没有截出图表的前半段，但目前的低点是第一根阳线，对吧？我们需要看到，对它的下破，而且是成功的突破。当趋势阴线确认收定而后还有跟进的阴线的时候，我们就可以认为价格确实创新低了。刚刚这波上涨的高点可以被确认为重要波段点。接着跌一跌，又进入回调，此处开始会有不那么好答的陷阱题。比如在这里长了两根K线之后开始转跌，我能不能确认这里为重要波段点？不行，原因是目前的低点还未被成功跌破。之所以这是个至关重要的技能，是因为如果你刚刚在上面有建仓卖出，但当价格创新低之后。你可能面临到我是否可以收紧止损的问题，对吧？这很常见。为了保护利润，你可能会希望在安全以后将原本的止损调整到入场价之下。这样即使你被后续的波动聚集，你也有机会以薄利出场。但这时候就会有心急的交易者，眼看回调或许要结束，就决定直接缩紧止损至盈亏平衡处。也刚好跟箭头所指的波段点相距不远。不过，由于这不是一个重要波段点，新低还未被确认。所以你放在这里是很危险的做法，回调不一定已经结束了。接下来旋即一支短短的上影线，把你刺出场，然后接着下跌，你就被白白清扫出局。那如何正确挑选出重要的波段点呢？同样，你要等待递进的低点，被成功的突破确认。依前头提到的严格标准突破后，还要有跟进，你至少要在这根阴线收定之后才可以调整止损。这次你晓得要选刚刚这波回调的最高点。这么一来，我们就找到第二个重要波段点。再下面一组则同样分别是次级波段点与重要波段点。这下你很快可以明白，在低点再次成功递进以前，我们很容易选到相对无效的波段点。因而产生亏损。除了提早入场的交易者，可能会因为缩紧止损而被扫出去。如果你基于某种原因入场，比如第二入场而将止损，摆放的太近的话，也很容易被触发出局。于是安全起见，你可以先在此时先为自己建立起一个筛选重要波段点的标准。必然是等到极值有效递进之后，才去回顾刚刚回调内部最适合作为重要波段点的是是哪一根K线的顶点？那这些重要波段点哪里重要？它们的意义何在？意义就在于，刚刚所有新段落的下跌，直到能够创出当前新低的下跌，都是起于这些顶点。所以在下降趋势中，空头为了保护趋势的健康，他们应该要去守护这些价位不被多头给击穿。尤其这些都是我们用非常严格的步骤去筛选出来的，特别不应该被突破的高点。所以一旦多头还能够反击触摸到这些位置，那意义就非同小可。用另一个角度来说，既然这些位置是空头重新发起进攻的起点，那对于刚刚踏空的，或者还想要重新建仓加仓的空头来说。他们也有理由去预期，既然刚刚我们的弟兄们认为这是一个好的入场价格，那当价格又复返到这里来。肯定多少还是会有人愿意入场。也加上第一个理由，有人愿意出钱保护这个价位，那我也趁势做空，","p":"p386"},{"t":"应该不错。你发现了吗？这些同样都是利害关系，加上心理预期的逻辑，在支持这些多空行动者。与此些位置部署反向订单。将它们标记出来以后，你以此放置的止损就变得比较有底气。而如果反过来，你是在稍后反转的过程中做多，那你也知道这些地方可能会有空头介入。所以会是适合止盈的地方。不过其实我说这些位置空头倾向去保护，而多头会好自为之，知道此处适合止盈。但难道回到这些地方，价格就必然再次折返向下吗？不一定。空头可能比厂商冲更弱，多头也可能比预期的更强。所以，当价格逼近一个重要波段点，交易者当然还是要密切关注价格在该处的反应。是顺势交易者占据上风，使得突破成功。还是逆势交易者得以掌权造成突破失败，此初双方竞争的成果有目共睹，将决定而后行情将如何发展。","p":"p387"}]},{"t":"para","text":"此间我想告诉你的是，波段点也就是这些价格的转折处，有重要的与次级的分别。我们只需要先选出重要的。而最重要的标准是，当价格创新低进入回调而后回调结束。又成功有效的创新低之后，我们才回头确认，刚刚这波回调的最高点为重要波段点。再说一次创新低，回调，成功有效的在创新低之后确认，刚刚回调的最高点。按照这样的标准来看，我们只会选出三个。而且不是在大型趋势反转以后才马后炮的选出这三个。是在趋势还没发展完的过程中，就能够标记出来。比如第一个虽然没有截出图表的前半段，但目前的低点是第一根阳线，对吧？我们需要看到，对它的下破，而且是成功的突破。当趋势阴线确认收定而后还有跟进的阴线的时候，我们就可以认为价格确实创新低了。刚刚这波上涨的高点可以被确认为重要波段点。接着跌一跌，又进入回调，此处开始会有不那么好答的陷阱题。比如在这里长了两根K线之后开始转跌，我能不能确认这里为重要波段点？不行，原因是目前的低点还未被成功跌破。之所以这是个至关重要的技能，是因为如果你刚刚在上面有建仓卖出，但当价格创新低之后。你可能面临到我是否可以收紧止损的问题，对吧？这很常见。为了保护利润，你可能会希望在安全以后将原本的止损调整到入场价之下。这样即使你被后续的波动聚集，你也有机会以薄利出场。但这时候就会有心急的交易者，眼看回调或许要结束，就决定直接缩紧止损至盈亏平衡处。也刚好跟箭头所指的波段点相距不远。不过，由于这不是一个重要波段点，新低还未被确认。所以你放在这里是很危险的做法，回调不一定已经结束了。接下来旋即一支短短 ,"ilabel":"9-13","icap":"L09　磁铁 支撑与阻力","fid":"fig138","ctx":[{"t":"那再接着来看看图表的全貌。价格在对这个末端旗型发出最后一波的突破尝试以后反转走高。","p":"p388"},{"t":"你也可以很清楚的看见，在前述标记的重要波段点处，价格确实发出了明确的停顿或转折。比如下面这里价格陷入了小型趋势反转。而图表右上角则是形成缕缕的上影线。那对于上升趋势，我们也可以寻找可能作为支撑的重要波段点。从下面开始用同样的标准去看待。创新高，有效突破后采取回溯重要波段点的位置。我们就会选取这个低点来进行关注。此间,比较有争议的是上面这边。价格以比较黏着的形式慢慢走高。发展到这里的时候，我们会拿这个次级波段点就跟银行回调K线作为候选人，期待向上突破以后能够进一步确认。可是好像一次没有两次也没有，那怎么办呢？没关系哟，不急。如果你同样沿用刚刚我们讲的严格标准，那这里就是还没有突破，所以不能算数。要直到图表最后两根K线显露突破以后，还有跟进，我们才回溯刚刚这段调整的过程里。哪里有可以参考的波段低点？这时候，这根阴线就才得到确认，画记为上升趋势中另一个重要波段点。在波段点的地方，我们讨论的比较久，是因为要进行筛选，就要把标准说清楚才好跟上。我猜大家在其他地方应该都没有学过这么严谨的拣选流程。但后续几项磁体就没有这么复杂，我们可以稍微加速。","p":"p389"},{"t":"第二个是区间的上下缘，说了原理就很好掌握。既然区间是均衡的显像。那我们就要有多空都无法控制行情的证据。而证据时常体现为一方进行了失败的突破之后，另一方的突破尝试也同样失败。所以以这张图表为例，在左边的上升急速收止以后，可以看到这轮上涨的最高点。是这一颗十字星的针尖。而回调结束后，理应多头趋势需要延续，但却在方才的针尖止步。接下来换空头发动攻势要考验看看多头是否还愿意守住这波上涨的起点，也就是阳线低点。而结果是，多头发力了，空头的努力未能成功，价格又反转向上。有了这样的四个顶点，作为锚定提供了多头突破失败与空头突破失败的双重证据。区间就有机会确立下来。而后只要等到20根K线的数量，一到我们就能够更加确定双方在此处都失去了优势。而当价格终于向下突破，而非顺着原趋势方向向上去走的时候，区间确实早已维持20多根K线。遂此这也确实就是一个标准的区间。那么，区间边线如何划定呢？我自己的做法是两边突破失败的证据都具足以后。用最远的还未被测试的，而非已经被尝试突破过的顶点作为水平线段的参考。你想想当价格突出去了一点，那下次多空要竞争的就是能不能越过新的这点？总不会是拿旧的已经讨论过的价格去参考。如果区间漫长持续，而宽度有一点一点扩张的意思，那就随之动态修正即可。那么，右下角这个区间也是一样。你不难发现，价格在突破区间底部之后，还有过一次对突破点的测试，这是为突破回调起到了支撑与阻力互换的作用。尔后也有过对原趋势极值的突破失败，以及对回调极值的突破失败，同样又可以划定区间边线。而这些磁体的效用，同样是基于一样的原理，利害关系和心理预期。加上区间倾向突破失败的性格，每每触及后就返回区间内部是较高几率的事件。","p":"p390"}]},{"t":"para","text":"第二个是区间的上下缘，说了原理就很好掌握。既然区间是均衡的显像。那我们就要有多空都无法控制行情的证据。而证据时常体现为一方进行了失败的突破之后，另一方的突破尝试也同样失败。所以以这张图表为例，在左边的上升急速收止以后，可以看到这轮上涨的最高点。是这一颗十字星的针尖。而回调结束后，理应多头趋势需要延续，但却在方才的针尖止步。接下来换空头发动攻势要考验看看多头是否还愿意守住这波上涨的起点，也就是阳线低点。而结果是，多头发力了，空头的努力未能成功，价格又反转向上。有了这样的四个顶点，作为锚定提供了多头突破失败与空头突破失败的双重证据。区间就有机会确立下来。而后只要等到20根K线的数量，一到我们就能够更加确定双方在此处都失去了优势。而当价格终于向下突破，而非顺着原趋势方向向上去走的时候，区间确实早已维持20多根K线。遂此这也确实就是一个标准的区间。那么，区间边线如何划定呢？我自己的做法是两边突破失败的证据都具足以后。用最远的还未被测试的，而非已经被尝试突破过的顶点作为水平线段的参考。你想想当价格突出去了一点，那下次多空要竞争的就是能不能越过新的这点？总不会是拿旧的已经讨论过的价格去参考。如果区间漫长持续，而宽度有一点一点扩张的意思，那就随之动态修正即可。那么，右下角这个区间也是一样。你不难发现，价格在突破区间底部之后，还有过一次对突破点的测试，这是为突破回调起到了支撑与阻力互换的作用。尔后也有过对原趋势极值的突破失败，以及对回调极值的突破失败，同样又可以划定区间边线。而这些磁体的效用，同样是基于一样的原理，利害关系和心理预期。加上区间倾向突破失败的性格，每每触及后就返回区间内部是较高几率的事件。","pid":"p390"},{"t":"img","src":"assets/img/l09B_139.webp","ilabel":"9-14","icap":"L09　磁铁 支撑与阻力","fid":"fig139","ctx":[{"t":"第二个是区间的上下缘，说了原理就很好掌握。既然区间是均衡的显像。那我们就要有多空都无法控制行情的证据。而证据时常体现为一方进行了失败的突破之后，另一方的突破尝试也同样失败。所以以这张图表为例，在左边的上升急速收止以后，可以看到这轮上涨的最高点。是这一颗十字星的针尖。而回调结束后，理应多头趋势需要延续，但却在方才的针尖止步。接下来换空头发动攻势要考验看看多头是否还愿意守住这波上涨的起点，也就是阳线低点。而结果是，多头发力了，空头的努力未能成功，价格又反转向上。有了这样的四个顶点，作为锚定提供了多头突破失败与空头突破失败的双重证据。区间就有机会确立下来。而后只要等到20根K线的数量，一到我们就能够更加确定双方在此处都失去了优势。而当价格终于向下突破，而非顺着原趋势方向向上去走的时候，区间确实早已维持20多根K线。遂此这也确实就是一个标准的区间。那么，区间边线如何划定呢？我自己的做法是两边突破失败的证据都具足以后。用最远的还未被测试的，而非已经被尝试突破过的顶点作为水平线段的参考。你想想当价格突出去了一点，那下次多空要竞争的就是能不能越过新的这点？总不会是拿旧的已经讨论过的价格去参考。如果区间漫长持续，而宽度有一点一点扩张的意思，那就随之动态修正即可。那么，右下角这个区间也是一样。你不难发现，价格在突破区间底部之后，还有过一次对突破点的测试，这是为突破回调起到了支撑与阻力互换的作用。尔后也有过对原趋势极值的突破失败，以及对回调极值的突破失败，同样又可以划定区间边线。而这些磁体的效用，同样是基于一样的原理，利害关系和心理预期。加上区间倾向突破失败的性格，每每触及后就返回区间内部是较高几率的事件。","p":"p390"},{"t":"接着，我们要摆脱水平磁力的范畴，进入斜线与均线的领域了。事实上，我自己更信赖水平磁体的效用，原因是它相对更不受多解性的幽灵所作祟。对于多空的机构算法来讲，此前的最高价是哪个数字？比如标普500指数的2022年最高点，4818。好，那就是4818，这没有意义可言，所有人看到的那个高点都是一样的价格。如果作为多头，如果要证明自己有利能创新高，那我就知道设法攻破4818这个没有悬念，没有多解性的数字关口。但趋势线和通道线呢？只要你连接不同的端点成线，就可能画出各种各样的线。每一家机构划线的方式不同，每一家机构使用的均线参数不同，那就可能导致不同的结果。突破SMA20跟突破EMA20，那意思并不相同。所以也许你将来成为交易宗师，发现过去太妃似乎花了时间在向你解释通道线，趋势线，均线，你将来都觉得用不到，不需要，那是可能的，那也无所谓。我确实看过不少成功的交易者，打开图表干干净净，一条斜线一条均线都没有。你可以之后端看自己的需求决定要不要用上这些技术。不过，阿尔布鲁克斯有在用，那先教会你也是我的职责，且听我向你娓娓道来。","p":"p391"}]},{"t":"para","text":"接着，我们要摆脱水平磁力的范畴，进入斜线与均线的领域了。事实上，我自己更信赖水平磁体的效用，原因是它相对更不受多解性的幽灵所作祟。对于多空的机构算法来讲，此前的最高价是哪个数字？比如标普500指数的2022年最高点，4818。好，那就是4818，这没有意义可言，所有人看到的那个高点都是一样的价格。如果作为多头，如果要证明自己有利能创新高，那我就知道设法攻破4818这个没有悬念，没有多解性的数字关口。但趋势线和通道线呢？只要你连接不同的端点成线，就可能画出各种各样的线。每一家机构划线的方式不同，每一家机构使用的均线参数不同，那就可能导致不同的结果。突破SMA20跟突破EMA20，那意思并不相同。所以也许你将来成为交易宗师，发现过去太妃似乎花了时间在向你解释通道线，趋势线，均线，你将来都觉得用不到，不需要，那是可能的，那也无所谓。我确实看过不少成功的交易者，打开图表干干净净，一条斜线一条均线都没有。你可以之后端看自己的需求决定要不要用上这些技术。不过，阿尔布鲁克斯有在用，那先教会你也是我的职责，且听我向你娓娓道来。","pid":"p391"},{"t":"img","src":"assets/img/l09B_140.webp","ilabel":"9-15","icap":"L09　磁铁 支撑与阻力","fid":"fig140","ctx":[{"t":"接着，我们要摆脱水平磁力的范畴，进入斜线与均线的领域了。事实上，我自己更信赖水平磁体的效用，原因是它相对更不受多解性的幽灵所作祟。对于多空的机构算法来讲，此前的最高价是哪个数字？比如标普500指数的2022年最高点，4818。好，那就是4818，这没有意义可言，所有人看到的那个高点都是一样的价格。如果作为多头，如果要证明自己有利能创新高，那我就知道设法攻破4818这个没有悬念，没有多解性的数字关口。但趋势线和通道线呢？只要你连接不同的端点成线，就可能画出各种各样的线。每一家机构划线的方式不同，每一家机构使用的均线参数不同，那就可能导致不同的结果。突破SMA20跟突破EMA20，那意思并不相同。所以也许你将来成为交易宗师，发现过去太妃似乎花了时间在向你解释通道线，趋势线，均线，你将来都觉得用不到，不需要，那是可能的，那也无所谓。我确实看过不少成功的交易者，打开图表干干净净，一条斜线一条均线都没有。你可以之后端看自己的需求决定要不要用上这些技术。不过，阿尔布鲁克斯有在用，那先教会你也是我的职责，且听我向你娓娓道来。","p":"p391"},{"t":"（继续整理）基本上市场中时刻充满或宽或窄的通道，但通道的运行斜率与规律并不清晰。交易者可以透过绘制线段来理清市场究竟发生了什么。趋势线和通道线处于相反的方向，但共同构成通道。一个上升通道，趋势线在下，通道线在上。将价格拖着向上形成上升趋势的那条线就是趋势线。相反，一个下降通道趋势线在上通道线在下。将价格压着向下形成下降趋势的那条线就是趋势线。请你花点时间，记住别搞混了。","p":"p392"},{"t":"那么，如何绘制并且动态地调整趋势线和通道线呢？我们同样从一个例子看起。就像你在任何地方曾经听闻过的交易者，应该关注反转点，也就是近期的重要波段点与次级波段点。找到至少两点来成一线，越能描绘当下行情运行的旋律的选择会越好。所以在途中当行情走到这里的时候，我们隐约能够察觉这里有成线的可能。把线画上去以后，发现嘟嘟好，那这条线在当下就是能够起到规律作用的。接着看看它的对面，就好像没有那么漂亮，影线有点高低错落参差不齐。那这时候你可以考虑复制一条刚刚画好的趋势线，或以这条平行线到上面来预期通道的发展。随后，当价格又有向上去走的意思的时候，你就可以关注看看它是否能够被触碰到。以及触碰到以后价格是突破停滞还是反转？不过，一次向上没到，另一次向上也没到。这时候，我们就会怀疑这条平行预期的通道线。到底有没有作用了，对吧？观察一下发现，其实这三点好像有另外呈现的可能，于是我们就可以擦掉上面那条改成最符合当前规律的版本。一样，将来如果又出现同样观察它能不能促成价格回落。而接下来，这波下跌比预期的更强一点，一下戳穿了趋势线，但又向上折返。这时候我们就可以考虑判定原先的这条线确实有使价格的运行，因为受到拦阻而怠速，产生偏折。这里涌现的多头可能是基于判定对趋势线的突破或将失败而入场，也可能是基于对次级波段点的测试而入场。但总是价格起高，我们就感谢刚刚这条趋势线的牺牲奉献，然后再次考虑绘制新斜率的线段。而后价格上行出现后又折返下降，然后再上涨，我们这又见识到这些线段的作用。不过你也不能够满足于此，不是画对了一两次之后就可以高枕无忧。后面的行情其实又在以新的斜率运动，你也得要看出来才行。对此，同样两点成一线，两点成一线，必须画出新的通道观察接下来是否以这样的规律震荡下行。","p":"p393"}]},{"t":"para","text":"（继续整理）基本上市场中时刻充满或宽或窄的通道，但通道的运行斜率与规律并不清晰。交易者可以透过绘制线段来理清市场究竟发生了什么。趋势线和通道线处于相反的方向，但共同构成通道。一个上升通道，趋势线在下，通道线在上。将价格拖着向上形成上升趋势的那条线就是趋势线。相反，一个下降通道趋势线在上通道线在下。将价格压着向下形成下降趋势的那条线就是趋势线。请你花点时间，记住别搞混了。","pid":"p392"},{"t":"para","text":"那么，如何绘制并且动态地调整趋势线和通道线呢？我们同样从一个例子看起。就像你在任何地方曾经听闻过的交易者，应该关注反转点，也就是近期的重要波段点与次级波段点。找到至少两点来成一线，越能描绘当下行情运行的旋律的选择会越好。所以在途中当行情走到这里的时候，我们隐约能够察觉这里有成线的可能。把线画上去以后，发现嘟嘟好，那这条线在当下就是能够起到规律作用的。接着看看它的对面，就好像没有那么漂亮，影线有点高低错落参差不齐。那这时候你可以考虑复制一条刚刚画好的趋势线，或以这条平行线到上面来预期通道的发展。随后，当价格又有向上去走的意思的时候，你就可以关注看看它是否能够被触碰到。以及触碰到以后价格是突破停滞还是反转？不过，一次向上没到，另一次向上也没到。这时候，我们就会怀疑这条平行预期的通道线。到底有没有作用了，对吧？观察一下发现，其实这三点好像有另外呈现的可能，于是我们就可以擦掉上面那条改成最符合当前规律的版本。一样，将来如果又出现同样观察它能不能促成价格回落。而接下来，这波下跌比预期的更强一点，一下戳穿了趋势线，但又向上折返。这时候我们就可以考虑判定原先的这条线确实有使价格的运行，因为受到拦阻而怠速，产生偏折。这里涌现的多头可能是基于判定对趋势线的突破或将失败而入场，也可能是基于对次级波段点的测试而入场。但总是价格起高，我们就感谢刚刚这条趋势线的牺牲奉献，然后再次考虑绘制新斜率的线段。而后价格上行出现后又折返下降，然后再上涨，我们这又见识到这些线段的作用。不过你也不能够满足于此，不是画对了一两次之后就可以高枕无忧。后面的行情其实又在以新的斜率运动，你也得要看出来才行。对此，同样两点成一线，两点成一线，必须画出新的通道观察接下来是否以这样的规律震荡下行。","pid":"p393"},{"t":"img","src":"assets/img/l09B_141.webp","ilabel":"9-16","icap":"L09　磁铁 支撑与阻力","fid":"fig141","ctx":[{"t":"（继续整理）基本上市场中时刻充满或宽或窄的通道，但通道的运行斜率与规律并不清晰。交易者可以透过绘制线段来理清市场究竟发生了什么。趋势线和通道线处于相反的方向，但共同构成通道。一个上升通道，趋势线在下，通道线在上。将价格拖着向上形成上升趋势的那条线就是趋势线。相反，一个下降通道趋势线在上通道线在下。将价格压着向下形成下降趋势的那条线就是趋势线。请你花点时间，记住别搞混了。","p":"p392"},{"t":"那么，如何绘制并且动态地调整趋势线和通道线呢？我们同样从一个例子看起。就像你在任何地方曾经听闻过的交易者，应该关注反转点，也就是近期的重要波段点与次级波段点。找到至少两点来成一线，越能描绘当下行情运行的旋律的选择会越好。所以在途中当行情走到这里的时候，我们隐约能够察觉这里有成线的可能。把线画上去以后，发现嘟嘟好，那这条线在当下就是能够起到规律作用的。接着看看它的对面，就好像没有那么漂亮，影线有点高低错落参差不齐。那这时候你可以考虑复制一条刚刚画好的趋势线，或以这条平行线到上面来预期通道的发展。随后，当价格又有向上去走的意思的时候，你就可以关注看看它是否能够被触碰到。以及触碰到以后价格是突破停滞还是反转？不过，一次向上没到，另一次向上也没到。这时候，我们就会怀疑这条平行预期的通道线。到底有没有作用了，对吧？观察一下发现，其实这三点好像有另外呈现的可能，于是我们就可以擦掉上面那条改成最符合当前规律的版本。一样，将来如果又出现同样观察它能不能促成价格回落。而接下来，这波下跌比预期的更强一点，一下戳穿了趋势线，但又向上折返。这时候我们就可以考虑判定原先的这条线确实有使价格的运行，因为受到拦阻而怠速，产生偏折。这里涌现的多头可能是基于判定对趋势线的突破或将失败而入场，也可能是基于对次级波段点的测试而入场。但总是价格起高，我们就感谢刚刚这条趋势线的牺牲奉献，然后再次考虑绘制新斜率的线段。而后价格上行出现后又折返下降，然后再上涨，我们这又见识到这些线段的作用。不过你也不能够满足于此，不是画对了一两次之后就可以高枕无忧。后面的行情其实又在以新的斜率运动，你也得要看出来才行。对此，同样两点成一线，两点成一线，必须画出新的通道观察接下来是否以这样的规律震荡下行。","p":"p393"},{"t":"这里有几点值得拎出来，值得你注意，我们也来快速提醒一下。首先就跟先前说过的对波段点，对突破点的测试可能不及持平或过冲一样。我们在绘制线段的时候，也往往会有影线的毛刺，让你顾此失彼，不太确定要怎么画才工整。就好比我现在呈现的图样，就至少有连接一二推，使第三推不及以及连接一三推，使第二推过冲，这两种做法。那就事后的角度来看，阿尔布鲁克斯本人有说他更倾向选择导致过冲的画法。他认为，这通常更能够描绘通道的轮廓，描绘运行的斜率。但我自己的经验是，事后这样画当然没有问题，可是如果是行情正在走的当下。我们并不晓得第二推会不会过冲，对吧？往往是第三推出现并且结束以后，我们才发现这第三推原来这么没力开始走反。所以在交易现场，我更喜欢不及的画法，并同时注意与第二推同高的水平位置，第三推能不能触及？如此做，就同样能够让你在当下就掌握运行的节奏。但当然，你可能认为阿尔布鲁克斯既然那样说，那他的做法就代表正典。你应该要学它。也没有问题，大家可以自己选择。但总之，我相信原则是不会变的。交易现场就是会出现不止一种绘制线段的选择。这就是我说的多解性作祟，而你要考虑的永远是挑选最能够表达多空静和动态的那一条线。有这样的意识，努力分析那选哪一个方法，应该就都八九不离十。除此之外，我相信你结合前面的单元内容，已经晓得通道的趋势线被突破，并不必然代表大型趋势反转。毕竟反转的前置条件很多，对吧？我们整个反转的单元都在讨论那些要件。所以趋势线被刺透，被突破，很多时候只是说明价格运行的斜率，这个多空原本维持的共识。如今受到的挑战准备开始改变。原本上升的很斜，但现在不那么斜了，多头对行情的宰制力又变弱了。所以相应的，双边交易的性格变强了，接下来转入区间的机会更高了。脑袋里有市场循环的光谱以后你应该想得起来，从绝对急速进到绝对区间。过程必定是趋势线屡屡被刺穿。然后通道就慢慢躺下来，从窄幅变宽幅，从宽幅变更宽幅。但无论如何，一定不是俯突破趋势线就去追进，就与其价格要昂首阔步的反转。要小心赌性作祟，不要去做，我们现在明说不应该做的事情。那最后则是一个实战现场的小提醒，小诀窍。阿尔布鲁克斯本人也告诉我们，不要眷恋你所画的线，不要一直把它们留在画面上。由于他是一个五分钟级别的交易者，他甚至习惯在几秒的时间内就清楚他所绘制的趋势线或通道线。以此去避免，要是线段在画面上停留的太久，会让我们的视觉思考定型，会对我们应有的灵活判断造成干扰。我自己觉得确实很有道理，新手遭遇者常见的一个毛病就是太看重自己的分析，一笔一划把线，把该注意的地方标注出来之后，就标在上面，没照自己的预期，走出来就不放过他。但是我们需要关注的是价格，是K线，是要看他们接近趋势线和通道线之后有什么表现。而不是凝视线段本身，许愿它们能够发挥作用。有作用很好，没作用也罢，画完用完赶快清除，还自己一个干净的版面。","p":"p394"}]},{"t":"para","text":"这里有几点值得拎出来，值得你注意，我们也来快速提醒一下。首先就跟先前说过的对波段点，对突破点的测试可能不及持平或过冲一样。我们在绘制线段的时候，也往往会有影线的毛刺，让你顾此失彼，不太确定要怎么画才工整。就好比我现在呈现的图样，就至少有连接一二推，使第三推不及以及连接一三推，使第二推过冲，这两种做法。那就事后的角度来看，阿尔布鲁克斯本人有说他更倾向选择导致过冲的画法。他认为，这通常更能够描绘通道的轮廓，描绘运行的斜率。但我自己的经验是，事后这样画当然没有问题，可是如果是行情正在走的当下。我们并不晓得第二推会不会过冲，对吧？往往是第三推出现并且结束以后，我们才发现这第三推原来这么没力开始走反。所以在交易现场，我更喜欢不及的画法，并同时注意与第二推同高的水平位置，第三推能不能触及？如此做，就同样能够让你在当下就掌握运行的节奏。但当然，你可能认为阿尔布鲁克斯既然那样说，那他的做法就代表正典。你应该要学它。也没有问题，大家可以自己选择。但总之，我相信原则是不会变的。交易现场就是会出现不止一种绘制线段的选择。这就是我说的多解性作祟，而你要考虑的永远是挑选最能够表达多空静和动态的那一条线。有这样的意识，努力分析那选哪一个方法，应该就都八九不离十。除此之外，我相信你结合前面的单元内容，已经晓得通道的趋势线被突破，并不必然代表大型趋势反转。毕竟反转的前置条件很多，对吧？我们整个反转的单元都在讨论那些要件。所以趋势线被刺透，被突破，很多时候只是说明价格运行的斜率，这个多空原本维持的共识。如今受到的挑战准备开始改变。原本上升的很斜，但现在不那么斜了，多头对行情的宰制力又变弱了。所以相应的，双边交易的性格变强了，接下来转入区间的机会更高了。脑袋里有市场循环的光谱以后你应该想得起来，从绝对急速进到绝对区间。过程必定是趋势线屡屡被刺穿。然后通道就慢慢躺下来，从窄幅变宽幅，从宽幅变更宽幅。但无论如何，一定不是俯突破趋势线就去追进，就与其价格要昂首阔步的反转。要小心赌性作祟，不要去做，我们现在明说不应该做的事情。那最后则是一个实战现场的小提醒，小诀窍。阿尔布鲁克斯本人也告诉我们，不要眷恋你所画的线，不要一直把它们留在画面上。由于他是一个五分钟级别的交易者，他甚至习惯在几秒的时间内就清楚他所绘制的趋势线或通道线。以此去避免，要是线段在画面上停留的太久，会让我们的视觉思考定型，会对我们应有的灵活判断造成干扰。我自己觉得确实很有道理，新手遭遇者常见的一个毛病就是太看重自己的分析，一笔一划把线，把该注意的地方标注出来之后，就标在上面，没照自己的预期，走出来就不放过他。但是我们需要关注的是价格，是K线，是要看他们接近趋势线和通道线之后有什么表现。而不是凝视线段本身，许愿它们能够发挥作用。有作用很好，没作用也罢，画完用完赶快清除，还自己一个干净的版面。","pid":"p394"},{"t":"img","src":"assets/img/l09B_142.webp","ilabel":"9-17","icap":"L09　磁铁 支撑与阻力","fid":"fig142","ctx":[{"t":"这里有几点值得拎出来，值得你注意，我们也来快速提醒一下。首先就跟先前说过的对波段点，对突破点的测试可能不及持平或过冲一样。我们在绘制线段的时候，也往往会有影线的毛刺，让你顾此失彼，不太确定要怎么画才工整。就好比我现在呈现的图样，就至少有连接一二推，使第三推不及以及连接一三推，使第二推过冲，这两种做法。那就事后的角度来看，阿尔布鲁克斯本人有说他更倾向选择导致过冲的画法。他认为，这通常更能够描绘通道的轮廓，描绘运行的斜率。但我自己的经验是，事后这样画当然没有问题，可是如果是行情正在走的当下。我们并不晓得第二推会不会过冲，对吧？往往是第三推出现并且结束以后，我们才发现这第三推原来这么没力开始走反。所以在交易现场，我更喜欢不及的画法，并同时注意与第二推同高的水平位置，第三推能不能触及？如此做，就同样能够让你在当下就掌握运行的节奏。但当然，你可能认为阿尔布鲁克斯既然那样说，那他的做法就代表正典。你应该要学它。也没有问题，大家可以自己选择。但总之，我相信原则是不会变的。交易现场就是会出现不止一种绘制线段的选择。这就是我说的多解性作祟，而你要考虑的永远是挑选最能够表达多空静和动态的那一条线。有这样的意识，努力分析那选哪一个方法，应该就都八九不离十。除此之外，我相信你结合前面的单元内容，已经晓得通道的趋势线被突破，并不必然代表大型趋势反转。毕竟反转的前置条件很多，对吧？我们整个反转的单元都在讨论那些要件。所以趋势线被刺透，被突破，很多时候只是说明价格运行的斜率，这个多空原本维持的共识。如今受到的挑战准备开始改变。原本上升的很斜，但现在不那么斜了，多头对行情的宰制力又变弱了。所以相应的，双边交易的性格变强了，接下来转入区间的机会更高了。脑袋里有市场循环的光谱以后你应该想得起来，从绝对急速进到绝对区间。过程必定是趋势线屡屡被刺穿。然后通道就慢慢躺下来，从窄幅变宽幅，从宽幅变更宽幅。但无论如何，一定不是俯突破趋势线就去追进，就与其价格要昂首阔步的反转。要小心赌性作祟，不要去做，我们现在明说不应该做的事情。那最后则是一个实战现场的小提醒，小诀窍。阿尔布鲁克斯本人也告诉我们，不要眷恋你所画的线，不要一直把它们留在画面上。由于他是一个五分钟级别的交易者，他甚至习惯在几秒的时间内就清楚他所绘制的趋势线或通道线。以此去避免，要是线段在画面上停留的太久，会让我们的视觉思考定型，会对我们应有的灵活判断造成干扰。我自己觉得确实很有道理，新手遭遇者常见的一个毛病就是太看重自己的分析，一笔一划把线，把该注意的地方标注出来之后，就标在上面，没照自己的预期，走出来就不放过他。但是我们需要关注的是价格，是K线，是要看他们接近趋势线和通道线之后有什么表现。而不是凝视线段本身，许愿它们能够发挥作用。有作用很好，没作用也罢，画完用完赶快清除，还自己一个干净的版面。","p":"p394"},{"t":"那最后就是均线的。如果我们说趋势线和通道线是为了描绘价格运行的斜率，那均线更是如此。它解决问题的野心甚至要更大，他希望能够描绘一系列不规则的波动所隐含的趋势斜率。所以它和趋势线，通道线相同的地方在于斜率越缓，双边交易性格越强，越趋近区间。斜率越陡，单边交易性格就越强，越趋近急速。但不同的地方，除了它曲曲折折，它还可以穿过K线，在K线后面绕来绕去。所以把均线想象成是某种自动化的趋势线是有道理的，它的确可以表达趋势状态。而且不用你自己徒手画。不过，此间大致的原理有什么特性，以及它能够不能够做到什么，你还是得要知道。均线的全名是移动平均线。想必不用我说，你应该知道均线是根据若干根K线的收盘价平均所绘制出的一条曲线。所以以SMA20为例，那就是将当前K线回推20根以后，将这段时间内所有K线的收盘价进行简单平均，得到一个数字。然后下一根也这么做，下下根也这么做，最后你就会得到一连串的平均收盘价，可以借以连线。那当然，你不一定要使用收盘价，也不一定是进行简单的算术平均。于是均线其实各种各样千奇百怪，在交易这行并没有定规。只不过在阿尔布鲁克斯的知识体系里用的几乎都是EMA20。除了他在教两分钟级别的剥头皮交易时，有用过EMA10以外其他场合几乎都是如此。所以我们的教学也会沿用这样的做法。EMA即指数移动平均，这种平均方法会透过令过去价格的权重降低并提高近期价格的权重。来使得均线的绘制更能够反映近期价格的变动，避免均线过于滞后。至于为什么是20这个参数，其实他本人没有专门细谈过这个话题，看上去好像只是他的一种习惯。不过，从其他论述中可以侧面推敲出他认为真正能够影响接下来价格走势的。其实主要就是近期几根K线的表现而已。越是久远以前的多空竞合，对于接下来价格要何去何从，影响力只会越远。因此，主要关注近期的事即可。最近是多近呢，最关乎你测算的利润大小，以及你的交易方法。不过他在教两分钟级别的剥头皮交易时，用的是EMA10。而在其他教学里，他通常推荐新手交易者做波段交易，用的是EMA20。于是我们大概可以得知，如果你不是要当那种超级短打分秒必争的剥头皮交易者。你大概必须主要关注近期20根30根K线的表现，并且适配能够表达这近20根K线表现的EMA 20来作为辅助。好，由于EMA20你不需要徒手画，在看盘软体上直接把它叫出来就可以了。所以在这边要教的不是怎么找，而是怎么用。它有一点特性，要注意当价格试图从上向下穿越均线，它通常会遭遇某种程度的阻抗。反过来说也是当价格试图从下向上穿越均线，也通常不会超级顺利。这时候如果再搭配上那种很难突破的市场脉络，那效果就会拔群。所以，阿尔布鲁克斯很常提醒大家。如果你遇到一个铁丝网形成在均线下方，那通常价格最后更可能往远离均线的方向突破。又或者如果你遇到一轮持续已久，比如20根K线都没有碰触到均线的下降趋势。那它回调上涨到触及均线的时候，通常会弹开，不会第一次就穿越。就算是这么强劲的阳性也一样，很常会失去跟进。这些现象都是在建议你最好不要贴着均线，面对着均线开仓，押注价格能够滑顺的穿越过去。更多时候，均线会让持仓起来不太舒服，所以要切记这样的特性。综合这两个节次所讲到的内容，对于关键磁体的原理，用法，注意事项你应该已经有了掌握。听到这里不晓得你有没有在过程中有染一些疑惑，那么这种支撑阻力找法呢？另一种可不可以？希望再为自己的操作增添一些保护性。不过，这堂课程所要提供给你的就是最去芜存菁的做法。不去增加花里胡哨的，不确定是理性还是迷信的画技方式。然后放任工作量增加，边际效应却递减。我可以很负责任的说，光是学会前波段高低点，区间上下缘，还有下个单元所要讲的等距运动目标的寻找方式。你就能够发挥75%的功用。趋势线，通道线，还有均线，只是辅助为你的颈上再添20%的花。","p":"p395"}]},{"t":"para","text":"那最后就是均线的。如果我们说趋势线和通道线是为了描绘价格运行的斜率，那均线更是如此。它解决问题的野心甚至要更大，他希望能够描绘一系列不规则的波动所隐含的趋势斜率。所以它和趋势线，通道线相同的地方在于斜率越缓，双边交易性格越强，越趋近区间。斜率越陡，单边交易性格就越强，越趋近急速。但不同的地方，除了它曲曲折折，它还可以穿过K线，在K线后面绕来绕去。所以把均线想象成是某种自动化的趋势线是有道理的，它的确可以表达趋势状态。而且不用你自己徒手画。不过，此间大致的原理有什么特性，以及它能够不能够做到什么，你还是得要知道。均线的全名是移动平均线。想必不用我说，你应该知道均线是根据若干根K线的收盘价平均所绘制出的一条曲线。所以以SMA20为例，那就是将当前K线回推20根以后，将这段时间内所有K线的收盘价进行简单平均，得到一个数字。然后下一根也这么做，下下根也这么做，最后你就会得到一连串的平均收盘价，可以借以连线。那当然，你不一定要使用收盘价，也不一定是进行简单的算术平均。于是均线其实各种各样千奇百怪，在交易这行并没有定规。只不过在阿尔布鲁克斯的知识体系里用的几乎都是EMA20。除了他在教两分钟级别的剥头皮交易时，有用过EMA10以外其他场合几乎都是如此。所以我们的教学也会沿用这样的做法。EMA即指数移动平均，这种平均方法会透过令过去价格的权重降低并提高近期价格的权重。来使得均线的绘制更能够反映近期价格的变动，避免均线过于滞后。至于为什么是20这个参数，其实他本人没有专门细谈过这个话题，看上去好像只是他的一种习惯。不过，从其他论述中可以侧面推敲出他认为真正能够影响接下来价格走势的。其实主要就是近期几根K线的表现而已。越是久远以前的多空竞合，对于接下来价格要何去何从，影响力只会越远。因此，主要关注近期的事即可。最近是多近呢，最关乎你测算的利润大小，以及你的交易方法。不过他在教两分钟级别的剥头皮交易时，用的是EMA10。而在其他教学里，他通常推荐新手交易者做波段交易，用的是EMA20。于是我们大概可以得知，如果你不是要当那种超级短打分秒必争的剥头皮交易者。你大概必须主要关注近期20根30根K线的表现，并且适配能够表达这近20根K线表现的EMA 20来作为辅助。好，由于EMA20你不需要徒手画，在看盘软体上直接把它叫出来就可以了。所以在这边要教的不是怎么找，而是怎么用。它有一点特性，要注意当价格试图从上向下穿越均线，它通常会遭遇某种程度的阻抗。反过来说也是当价格试图从下向上穿越均线，也通常不会超级顺利。这时候如果再搭配上那种很难突破的市场脉络，那效果就会拔群。所以，阿尔布鲁克斯很常提醒大家。如果你遇到一个铁丝网形成在均线下方，那通常价格最后更可能往远离均线的方向突破。又或者如果你遇到一轮持续已久，比如20根K线都没有碰触到均线的下降趋势。那它回调上涨到触及均线的时候，通常会弹开，不会第一次就穿越。就算是这么强劲的阳性也一样，很常会失去跟进。这些现象都是在建议你最好不要贴着均线，面对着均线开仓，押注价格能够滑顺的穿越过去。更多时候，均线会让持仓起来不太舒服，所以要切记这样的特性。综合这两个节次所讲到的内容，对于关键磁体的原理，用法，注意事项你应该已经有了掌握。听到这里不晓得你有没有在过程中有染一些疑惑，那么这种支撑阻力找法呢？另一种可不可以？希望再为自己的操作增添一些保护性。不过，这堂课程所要提供给你的就是最去芜存菁的做法。不去增加花里胡哨的，不确定是理性还是迷信的画技方式。然后放任工作量增加，边际效应却递减。我可以很负责任的说，光是学会前波段高低点，区间上下缘，还有下个单元所要讲的等距运动目标的寻找方式。你就能够发挥75%的功用。趋势线，通道线，还有均线，只是辅助为你的颈上再添20%的花。","pid":"p395"},{"t":"img","src":"assets/img/l09B_143.webp","ilabel":"9-18","icap":"L09　磁铁 支撑与阻力","fid":"fig143","ctx":[{"t":"那最后就是均线的。如果我们说趋势线和通道线是为了描绘价格运行的斜率，那均线更是如此。它解决问题的野心甚至要更大，他希望能够描绘一系列不规则的波动所隐含的趋势斜率。所以它和趋势线，通道线相同的地方在于斜率越缓，双边交易性格越强，越趋近区间。斜率越陡，单边交易性格就越强，越趋近急速。但不同的地方，除了它曲曲折折，它还可以穿过K线，在K线后面绕来绕去。所以把均线想象成是某种自动化的趋势线是有道理的，它的确可以表达趋势状态。而且不用你自己徒手画。不过，此间大致的原理有什么特性，以及它能够不能够做到什么，你还是得要知道。均线的全名是移动平均线。想必不用我说，你应该知道均线是根据若干根K线的收盘价平均所绘制出的一条曲线。所以以SMA20为例，那就是将当前K线回推20根以后，将这段时间内所有K线的收盘价进行简单平均，得到一个数字。然后下一根也这么做，下下根也这么做，最后你就会得到一连串的平均收盘价，可以借以连线。那当然，你不一定要使用收盘价，也不一定是进行简单的算术平均。于是均线其实各种各样千奇百怪，在交易这行并没有定规。只不过在阿尔布鲁克斯的知识体系里用的几乎都是EMA20。除了他在教两分钟级别的剥头皮交易时，有用过EMA10以外其他场合几乎都是如此。所以我们的教学也会沿用这样的做法。EMA即指数移动平均，这种平均方法会透过令过去价格的权重降低并提高近期价格的权重。来使得均线的绘制更能够反映近期价格的变动，避免均线过于滞后。至于为什么是20这个参数，其实他本人没有专门细谈过这个话题，看上去好像只是他的一种习惯。不过，从其他论述中可以侧面推敲出他认为真正能够影响接下来价格走势的。其实主要就是近期几根K线的表现而已。越是久远以前的多空竞合，对于接下来价格要何去何从，影响力只会越远。因此，主要关注近期的事即可。最近是多近呢，最关乎你测算的利润大小，以及你的交易方法。不过他在教两分钟级别的剥头皮交易时，用的是EMA10。而在其他教学里，他通常推荐新手交易者做波段交易，用的是EMA20。于是我们大概可以得知，如果你不是要当那种超级短打分秒必争的剥头皮交易者。你大概必须主要关注近期20根30根K线的表现，并且适配能够表达这近20根K线表现的EMA 20来作为辅助。好，由于EMA20你不需要徒手画，在看盘软体上直接把它叫出来就可以了。所以在这边要教的不是怎么找，而是怎么用。它有一点特性，要注意当价格试图从上向下穿越均线，它通常会遭遇某种程度的阻抗。反过来说也是当价格试图从下向上穿越均线，也通常不会超级顺利。这时候如果再搭配上那种很难突破的市场脉络，那效果就会拔群。所以，阿尔布鲁克斯很常提醒大家。如果你遇到一个铁丝网形成在均线下方，那通常价格最后更可能往远离均线的方向突破。又或者如果你遇到一轮持续已久，比如20根K线都没有碰触到均线的下降趋势。那它回调上涨到触及均线的时候，通常会弹开，不会第一次就穿越。就算是这么强劲的阳性也一样，很常会失去跟进。这些现象都是在建议你最好不要贴着均线，面对着均线开仓，押注价格能够滑顺的穿越过去。更多时候，均线会让持仓起来不太舒服，所以要切记这样的特性。综合这两个节次所讲到的内容，对于关键磁体的原理，用法，注意事项你应该已经有了掌握。听到这里不晓得你有没有在过程中有染一些疑惑，那么这种支撑阻力找法呢？另一种可不可以？希望再为自己的操作增添一些保护性。不过，这堂课程所要提供给你的就是最去芜存菁的做法。不去增加花里胡哨的，不确定是理性还是迷信的画技方式。然后放任工作量增加，边际效应却递减。我可以很负责任的说，光是学会前波段高低点，区间上下缘，还有下个单元所要讲的等距运动目标的寻找方式。你就能够发挥75%的功用。趋势线，通道线，还有均线，只是辅助为你的颈上再添20%的花。","p":"p395"},{"t":"于是我们接着再复习一下这个单元所说到的内容，确保你没有漏掉关键的重点。支撑与阻力必然是由基于利害关系以及心理预期而放置的大量反向订单所构成。如果不存在这些订单，那预想的支撑与阻力就不会发生作用。你可能原先以为存在，但当价格靠上去，就将轻易穿透。在测试以前，它的效用只是潜在的，只有当你观测以后才会塌缩成有或没有。这两种现实的其中一种。另外，我们引进的一个重要观念就是磁力的作用。支撑与阻力具有一定的吸附力，因此未知磁体可能引发价格在越接近它的时候加速运动。此间你需要理解真空效应的成因，并且知道一旦价格触及磁体，磁力就将消失。接下来，它就会往其他具有吸附力的磁体前去。价格就是不断在此体之间徘徊穿梭，最终构成了这个充满波动的迷人市场。再来我们介绍了许多种磁体的类型，其中最重要的五种中的四种，除了等距运动目标与50%回调目标。这组以外，我们都摆在这个节次进行说明了。前波段高低点是价格所要去测试的最明显标的，多空往往必须争夺这些水平关口。来证明自己能够控制行情。于是我们介绍了一种寻找相对更重要的转折点的方法，就是区分重要与次级的波段点。对于重要波段点的确认，我们希望当趋势创出新的极值以后，价格继续突破该极值。再回头确认回调内部最显著的那个拐点为重要波段点。剩下的不满足条件的则是次级波段点。那么可能可以用于开仓画趋势线与通道线，或者在更小时间级别图表上扮演重要波段点的角色。但总之，在你当前级别的图表上，重要波段点更为重要。如果要避免画面杂乱，避免自己太敏感的关注了过多的水平线，那么你就必须要学会这套趋变的流程。后面几种相对容易，分别是区间上下缘趋势线与通道线以及均线。区间上下缘的确立，你会希望看到对原趋势极值的一次突破失败，以及对回调极值的一次突破失败。双重确认多空都没有办法掌控市场。趋势线与通道线是为了描绘价格运行的斜率，因此在满足最最基本的两点一线的原则以后。你还需要实时修正，实时太旧换新去确保你自己能够跟随到最近的斜率变化。而均线我们采用的是EMA 20，它能够协助你了解与过滤近期的价格走势，指引你方向。交易者需要记得的是，当价格向下或向上穿越均线都多少会受到阻抗。因此进行面朝均线的交易要特别小心。贴着地板，贴着天花板，押注穿透可能会让你持仓持的很难受。碍于篇幅限制，我必须把另一个磁铁类型，也就是等距运动目标按50%回调目标。独立成另一个单元。于是，对于这所有磁体的综合判读，我希望在下个单元一并带大家进行。如果这个单元学到目前，你因为没有实例确认而感到紧张。请不用害怕，先铭记原理，看原则就可以了。稍后我就会再透过实例展示，应该如何流畅的运用这项关键的读图技术。感谢收看磁体支撑与阻力。我们下个单元见。","p":"p396"}]},{"t":"para","text":"于是我们接着再复习一下这个单元所说到的内容，确保你没有漏掉关键的重点。支撑与阻力必然是由基于利害关系以及心理预期而放置的大量反向订单所构成。如果不存在这些订单，那预想的支撑与阻力就不会发生作用。你可能原先以为存在，但当价格靠上去，就将轻易穿透。在测试以前，它的效用只是潜在的，只有当你观测以后才会塌缩成有或没有。这两种现实的其中一种。另外，我们引进的一个重要观念就是磁力的作用。支撑与阻力具有一定的吸附力，因此未知磁体可能引发价格在越接近它的时候加速运动。此间你需要理解真空效应的成因，并且知道一旦价格触及磁体，磁力就将消失。接下来，它就会往其他具有吸附力的磁体前去。价格就是不断在此体之间徘徊穿梭，最终构成了这个充满波动的迷人市场。再来我们介绍了许多种磁体的类型，其中最重要的五种中的四种，除了等距运动目标与50%回调目标。这组以外，我们都摆在这个节次进行说明了。前波段高低点是价格所要去测试的最明显标的，多空往往必须争夺这些水平关口。来证明自己能够控制行情。于是我们介绍了一种寻找相对更重要的转折点的方法，就是区分重要与次级的波段点。对于重要波段点的确认，我们希望当趋势创出新的极值以后，价格继续突破该极值。再回头确认回调内部最显著的那个拐点为重要波段点。剩下的不满足条件的则是次级波段点。那么可能可以用于开仓画趋势线与通道线，或者在更小时间级别图表上扮演重要波段点的角色。但总之，在你当前级别的图表上，重要波段点更为重要。如果要避免画面杂乱，避免自己太敏感的关注了过多的水平线，那么你就必须要学会这套趋变的流程。后面几种相对容易，分别是区间上下缘趋势线与通道线以及均线。区间上下缘的确立，你会希望看到对原趋势极值的一次突破失败，以及对回调极值的一次突破失败。双重确认多空都没有办法掌控市场。趋势线与通道线是为了描绘价格运行的斜率，因此 尝试运行基于先前某个东西的距离。","p":"p399"},{"t":"对不曾理解等距运动的交易者来说，这不过是一张再普通不过的图表。但事实上，我们可以在里头找到开盘之间突破以后，价格旋即在完成等距扩张以后进入整理。而自横向回调顶点开始，也就是我们上个单元教到的重要波段点开始。价格又基于前方，这段下跌再次开展了一段新的等距运动。你也可能发现铁丝网的形成，主要是因等距运动完成而开始。还可能是因为这个调整所构成的小型区间在突破以后再次完成了等距扩张。而要是你将下跌，从当日高点算起，那么说今日低点都在回调结束后的等距运动也很有道理。随后，当价格反转走高，我们就可以看见完成上涨陷入回调以后。自回调低点测量起，收盘也同样收在等距运动附近。当然，所有的等距也许略有误差，就如前面提到的任何测试可能不及持平或过冲。但你应该不难感受出此间一定程度的精准。价格好像确实能被这样的运动模式所描绘。那么，此间的道理是什么呢？我们怎么运用这种现象来建仓平仓呢？","p":"p400"}]},{"t":"para","text":"对不曾理解等距运动的交易者来说，这不过是一张再普通不过的图表。但事实上，我们可以在里头找到开盘之间突破以后，价格旋即在完成等距扩张以后进入整理。而自横向回调顶点开始，也就是我们上个单元教到的重要波段点开始。价格又基于前方，这段下跌再次开展了一段新的等距运动。你也可能发现铁丝网的形成，主要是因等距运动完成而开始。还可能是因为这个调整所构成的小型区间在突破以后再次完成了等距扩张。而要是你将下跌，从当日高点算起，那么说今日低点都在回调结束后的等距运动也很有道理。随后，当价格反转走高，我们就可以看见完成上涨陷入回调以后。自回调低点测量起，收盘也同样收在等距运动附近。当然，所有的等距也许略有误差，就如前面提到的任何测试可能不及持平或过冲。但你应该不难感受出此间一定程度的精准。价格好像确实能被这样的运动模式所描绘。那么，此间的道理是什么呢？我们怎么运用这种现象来建仓平仓呢？","pid":"p400"},{"t":"img","src":"assets/img/l10A_146.webp","ilabel":"10-3","icap":"L10　等距运动原理","fid":"fig146","ctx":[{"t":"对不曾理解等距运动的交易者来说，这不过是一张再普通不过的图表。但事实上，我们可以在里头找到开盘之间突破以后，价格旋即在完成等距扩张以后进入整理。而自横向回调顶点开始，也就是我们上个单元教到的重要波段点开始。价格又基于前方，这段下跌再次开展了一段新的等距运动。你也可能发现铁丝网的形成，主要是因等距运动完成而开始。还可能是因为这个调整所构成的小型区间在突破以后再次完成了等距扩张。而要是你将下跌，从当日高点算起，那么说今日低点都在回调结束后的等距运动也很有道理。随后，当价格反转走高，我们就可以看见完成上涨陷入回调以后。自回调低点测量起，收盘也同样收在等距运动附近。当然，所有的等距也许略有误差，就如前面提到的任何测试可能不及持平或过冲。但你应该不难感受出此间一定程度的精准。价格好像确实能被这样的运动模式所描绘。那么，此间的道理是什么呢？我们怎么运用这种现象来建仓平仓呢？","p":"p400"},{"t":"好抽象的来了，请大家坐稳。一般来说，建构一笔交易的当下，也就是当你发现一个合理的应当有数学优势的交易机会，准备要做进去。但你同时必须要决定止损位置与止盈位置。原因是正如第一单元讲过的，期望由胜率和盈亏比构成。所以如果没有在当下就严肃的决定怎么离场，止损止盈要摆在哪里，你也就无法知道。这笔交易的盈亏比会是多少，从而更无法推测胜率。这好理解，但实物上更难的是，即使我们确知盈亏比。假设我们决定好，我要拿三倍的盈亏比。我们有办法因此确知，在当下的脉络下，胜率是多少吗？其实非常难。根据交易数学，我们晓得三倍盈亏比的交易，对应的盈亏平衡胜率是25%。你必须要确定在这个位置坐进去胜率高于25%，你才能够赚钱。不过你有自信，说得准吗？没有精密的历史数据参考，但得在短时间内运算出估计值的我们。我们的主观感受可靠吗？你认为应该能超过25%。但有没有可能实际上只有22.8%呢？一旦我们讲求准确的数学，那就很容易陷入迷茫。一切好像不可知，变得难以下手。没错，这是交易者必将永恒面对的难题。即使是有强大运算能力的机构交易者，也不可能准确知晓胜率。多多少少可能资料有误，可能运算有误差，可能做进去之后有些微滑点。并且无法预示入场以后的多空竞合。所以你可以追求趋近准确，但想要长期100%的准确知晓胜率是非常困难的。我们也随之难以全面的确知一笔交易的期望是否严格为正。不过，面对这种判断的困境，以均衡市场状态下朝向任意方向走出等距运动的几率为50%的前提去思考。应该会有所帮助。对吧，我们先前提过，在一个全然均衡的情况下，由于多空都不比对方更占优势。因此，价格接下来先向上运动X点，而非先向下运动X点的几率应该是50%，对两者都公平。不过，一旦脉络改变，市场状态从光谱上偏移，那么这个50%的几率就也会变化。如例分析，越是往左边偏移价格，越是接近多头的单边交易状态。那这个50%就会渐渐朝100%靠近。反过来说，越往右边空头，越是主宰行情。那么，先向下移动X点，而非反过来的几率就同样会往100%趋近。所以在实务上，在交易现场，手工交易者要能够快速且相对还算准确的估算胜率，那就仰赖这样的原则。如果单边交易状态很强，让你觉得接下来顺势运行几率更高，那你可以期待此时测算等距利润的胜率是60%。不要再多了，你可能高估，所以假定60%是极限最好。反过来说，如果单边交易状态很强，但你想着的是逆势交易。那么，朝对你有利的方向走出等距运动的几率就是40%。这么一来，无论市场状态如何，对等距运动的方向几率的判断都会落在40%到60%之间。而究竟能够多准确的估算胜率，这成了鉴别交易者能力的指标。","p":"p401"}]},{"t":"para","text":"好抽象的来了，请大家坐稳。一般来说，建构一笔交易的当下，也就是当你发现一个合理的应当有数学优势的交易机会，准备要做进去。但你同时必须要决定止损位置与止盈位置。原因是正如第一单元讲过的，期望由胜率和盈亏比构成。所以如果没有在当下就严肃的决定怎么离场，止损止盈要摆在哪里，你也就无法知道。这笔交易的盈亏比会是多少，从而更无法推测胜率。这好理解，但实物上更难的是，即使我们确知盈亏比。假设我们决定好，我要拿三倍的盈亏比。我们有办法因此确知，在当下的脉络下，胜率是多少吗？其实非常难。根据交易数学，我们晓得三倍盈亏比的交易，对应的盈亏平衡胜率是25%。你必须要确定在这个位置坐进去胜率高于25%，你才能够赚钱。不过你有自信，说得准吗？没有精密的历史数据参考，但得在短时间内运算出估计值的我们。我们的主观感受可靠吗？你认为应该能超过25%。但有没有可能实际上只有22.8%呢？一旦我们讲求准确的数学，那就很容易陷入迷茫。一切好像不可知，变得难以下手。没错，这是交易者必将永恒面对的难题。即使是有强大运算能力的机构交易者，也不可能准确知晓胜率。多多少少可能资料有误，可能运算有误差，可能做进去之后有些微滑点。并且无法预示入场以后的多空竞合。所以你可以追求趋近准确，但想要长期100%的准确知晓胜率是非常困难的。我们也随之难以全面的确知一笔交易的期望是否严格为正。不过，面对这种判断的困境，以均衡市场状态下朝向任意方向走出等距运动的几率为50%的前提去思考。应该会有所帮助。对吧，我们先前提过，在一个全然均衡的情况下，由于多空都不比对方更占优势。因此，价格接下来先向上运动X点，而非先向下运动X点的几率应该是50%，对两者都公平。不过，一旦脉络改变，市场状态从光谱上偏移，那么这个50%的几率就也会变化。如例分析，越是往左边偏移价格，越是接近多头的单边交易状态。那这个50%就会渐渐朝100%靠近。反过来说，越往右边空头，越是主宰行情。那么，先向下移动X点，而非反过来的几率就同样会往100%趋近。所以在实务上，在交易现场，手工交易者要能够快速且相对还算准确的估算胜率，那就仰赖这样的原则。如果单边交易状态很强，让你觉得接下来顺势运行几率更高，那你可以期待此时测算等距利润的胜率是60%。不要再多了，你可能高估，所以假定60%是极限最好。反过来说，如果单边交易状态很强，但你想着的是逆势交易。那么，朝对你有利的方向走出等距运动的几率就是40%。这么一来，无论市场状态如何，对等距运动的方向几率的判断都会落在40%到60%之间。而究竟能够多准确的估算胜率，这成了鉴别交易者能力的指标。","pid":"p401"},{"t":"img","src":"assets/img/l10A_147.webp","ilabel":"10-4","icap":"L10　等距运动原理","fid":"fig147","ctx":[{"t":"好抽象的来了，请大家坐稳。一般来说，建构一笔交易的当下，也就是当你发现一个合理的应当有数学优势的交易机会，准备要做进去。但你同时必须要决定止损位置与止盈位置。原因是正如第一单元讲过的，期望由胜率和盈亏比构成。所以如果没有在当下就严肃的决定怎么离场，止损止盈要摆在哪里，你也就无法知道。这笔交易的盈亏比会是多少，从而更无法推测胜率。这好理解，但实物上更难的是，即使我们确知盈亏比。假设我们决定好，我要拿三倍的盈亏比。我们有办法因此确知，在当下的脉络下，胜率是多少吗？其实非常难。根据交易数学，我们晓得三倍盈亏比的交易，对应的盈亏平衡胜率是25%。你必须要确定在这个位置坐进去胜率高于25%，你才能够赚钱。不过你有自信，说得准吗？没有精密的历史数据参考，但得在短时间内运算出估计值的我们。我们的主观感受可靠吗？你认为应该能超过25%。但有没有可能实际上只有22.8%呢？一旦我们讲求准确的数学，那就很容易陷入迷茫。一切好像不可知，变得难以下手。没错，这是交易者必将永恒面对的难题。即使是有强大运算能力的机构交易者，也不可能准确知晓胜率。多多少少可能资料有误，可能运算有误差，可能做进去之后有些微滑点。并且无法预示入场以后的多空竞合。所以你可以追求趋近准确，但想要长期100%的准确知晓胜率是非常困难的。我们也随之难以全面的确知一笔交易的期望是否严格为正。不过，面对这种判断的困境，以均衡市场状态下朝向任意方向走出等距运动的几率为50%的前提去思考。应该会有所帮助。对吧，我们先前提过，在一个全然均衡的情况下，由于多空都不比对方更占优势。因此，价格接下来先向上运动X点，而非先向下运动X点的几率应该是50%，对两者都公平。不过，一旦脉络改变，市场状态从光谱上偏移，那么这个50%的几率就也会变化。如例分析，越是往左边偏移价格，越是接近多头的单边交易状态。那这个50%就会渐渐朝100%靠近。反过来说，越往右边空头，越是主宰行情。那么，先向下移动X点，而非反过来的几率就同样会往100%趋近。所以在实务上，在交易现场，手工交易者要能够快速且相对还算准确的估算胜率，那就仰赖这样的原则。如果单边交易状态很强，让你觉得接下来顺势运行几率更高，那你可以期待此时测算等距利润的胜率是60%。不要再多了，你可能高估，所以假定60%是极限最好。反过来说，如果单边交易状态很强，但你想着的是逆势交易。那么，朝对你有利的方向走出等距运动的几率就是40%。这么一来，无论市场状态如何，对等距运动的方向几率的判断都会落在40%到60%之间。而究竟能够多准确的估算胜率，这成了鉴别交易者能力的指标。","p":"p401"},{"t":"为什么要说这些呢？因为机构很讲究数学逻辑，这是我们一再强调的事情。所谓讲究数学逻辑，指的是这些算法只是执行具有最低限度数学优势的交易。但是他们也无法绝对精准的估算胜率，他们跟我们一样会被一定程度的不确定性所困扰。只是我们比较烂，我们比他们更不确定一点就是了。那机构同样面临到的问题，是要如何确保最低限度的数学优势呢？最有效的方法是在对接下来一段时间的价格，运动方向拥有高于50%的把握时。采取潜在利润与风险至少一样大的交易，也就是一点零倍以上盈亏比的交易。这样事情就不难理解了。多头强劲，那建立一点零倍盈亏比的多仓胜率理应要大于50%。而要是空头比较强，那建立一点零倍盈亏比的空仓胜率理应也要大于50%。假如只做，就能够确保数学优势。你一定还记得市场爱好均衡80%的情况下，都近似于区间。因此，仅有20%的稀少时刻等距运动的方向几率能提升到60%。这种时候不是没有，比如有效的突破发起，比如过冲区间边线时而需折返。比如，在旗型中找到背靠磁体的反向瞬间。只要熟悉价格行为的运动惯性，熟忍后面单元所教的交易方法，我们就能够在这种时刻之中找到正向期望的瞬间。所以以成功的突破为例，在突破发生之际，将止损放置在运动起点之外。以此测算，等距的利润空间可以有60%的胜率。这就使交易者得以保有最低限度的数学优势。反过来讲，你一定记得先前单元提过鸡生蛋，蛋生鸡的比喻。既然K线都是机构创造的，那么只要机构不认为这么做，有数学优势，那突破就不会发生。同时，我们也知道胜率与亏比之间存在负相关的关系。一旦盈亏比升高到超过一点零倍，太多胜率就将降到50%以下，那个分绩其实不太好拿捏。遂此，为了最大程度的维护数学优势，突破交易者常将止损放置在突破起点之外。也就是急速的那一推起点之外，或形态区间的变现之外。并将盈亏比锁定在一点零倍。只要盈亏比是一点零倍，则这必然是胜率大于50%的入场时机。正向期望也就能够被保证。那么，很多人，很多机构算法都这么做的，结果就是使行情一旦触及等距运动目标。通常就会涌现一批止盈的反向订单。到位以后，他们就离场，否则胜率会降低，变得难以捉摸。这种共同的行动倾向，将使得行情至少进入回调，乃至于大型趋势反转。","p":"p402"}]},{"t":"para","text":"为什么要说这些呢？因为机构很讲究数学逻辑，这是我们一再强调的事情。所谓讲究数学逻辑，指的是这些算法只是执行具有最低限度数学优势的交易。但是他们也无法绝对精准的估算胜率，他们跟我们一样会被一定程度的不确定性所困扰。只是我们比较烂，我们比他们更不确定一点就是了。那机构同样面临到的问题，是要如何确保最低限度的数学优势呢？最有效的方法是在对接下来一段时间的价格，运动方向拥有高于50%的把握时。采取潜在利润与风险至少一样大的交易，也就是一点零倍以上盈亏比的交易。这样事情就不难理解了。多头强劲，那建立一点零倍盈亏比的多仓胜率理应要大于50%。而要是空头比较强，那建立一点零倍盈亏比的空仓胜率理应也要大于50%。假如只做，就能够确保数学优势。你一定还记得市场爱好均衡80%的情况下，都近似于区间。因此，仅有20%的稀少时刻等距运动的方向几率能提升到60%。这种时候不是没有，比如有效的突破发起，比如过冲区间边线时而需折返。比如，在旗型中找到背靠磁体的反向瞬间。只要熟悉价格行为的运动惯性，熟忍后面单元所教的交易方法，我们就能够在这种时刻之中找到正向期望的瞬间。所以以成功的突破为例，在突破发生之际，将止损放置在运动起点之外。以此测算，等距的利润空间可以有60%的胜率。这就使交易者得以保有最低限度的数学优势。反过来讲，你一定记得先前单元提过鸡生蛋，蛋生鸡的比喻。既然K线都是机构创造的，那么只要机构不认为这么做，有数学优势，那突破就不会发生。同时，我们也知道胜率与亏比之间存在负相关的关系。一旦盈亏比升高到超过一点零倍，太多胜率就将降到50%以下，那个分绩其实不太好拿捏。遂此，为了最大程度的维护数学优势，突破交易者常将止损放置在突破起点之外。也就是急速的那一推起点之外，或形态区间的变现之外。并将盈亏比锁定在一点零倍。只要盈亏比是一点零倍，则这必然是胜率大于50%的入场时机。正向期望也就能够被保证。那么，很多人，很多机构算法都这么做的，结果就是使行情一旦触及等距运动目标。通常就会涌现一批止盈的反向订单。到位以后，他们就离场，否则胜率会降低，变得难以捉摸。这种共同的行动倾向，将使得行情至少进入回调，乃至于大型趋势反转。","pid":"p402"},{"t":"img","src":"assets/img/l10A_148.webp","ilabel":"10-5","icap":"L10　等距运动原理","fid":"fig148","ctx":[{"t":"为什么要说这些呢？因为机构很讲究数学逻辑，这是我们一再强调的事情。所谓讲究数学逻辑，指的是这些算法只是执行具有最低限度数学优势的交易。但是他们也无法绝对精准的估算胜率，他们跟我们一样会被一定程度的不确定性所困扰。只是我们比较烂，我们比他们更不确定一点就是了。那机构同样面临到的问题，是要如何确保最低限度的数学优势呢？最有效的方法是在对接下来一段时间的价格，运动方向拥有高于50%的把握时。采取潜在利润与风险至少一样大的交易，也就是一点零倍以上盈亏比的交易。这样事情就不难理解了。多头强劲，那建立一点零倍盈亏比的多仓胜率理应要大于50%。而要是空头比较强，那建立一点零倍盈亏比的空仓胜率理应也要大于50%。假如只做，就能够确保数学优势。你一定还记得市场爱好均衡80%的情况下，都近似于区间。因此，仅有20%的稀少时刻等距运动的方向几率能提升到60%。这种时候不是没有，比如有效的突破发起，比如过冲区间边线时而需折返。比如，在旗型中找到背靠磁体的反向瞬间。只要熟悉价格行为的运动惯性，熟忍后面单元所教的交易方法，我们就能够在这种时刻之中找到正向期望的瞬间。所以以成功的突破为例，在突破发生之际，将止损放置在运动起点之外。以此测算，等距的利润空间可以有60%的胜率。这就使交易者得以保有最低限度的数学优势。反过来讲，你一定记得先前单元提过鸡生蛋，蛋生鸡的比喻。既然K线都是机构创造的，那么只要机构不认为这么做，有数学优势，那突破就不会发生。同时，我们也知道胜率与亏比之间存在负相关的关系。一旦盈亏比升高到超过一点零倍，太多胜率就将降到50%以下，那个分绩其实不太好拿捏。遂此，为了最大程度的维护数学优势，突破交易者常将止损放置在突破起点之外。也就是急速的那一推起点之外，或形态区间的变现之外。并将盈亏比锁定在一点零倍。只要盈亏比是一点零倍，则这必然是胜率大于50%的入场时机。正向期望也就能够被保证。那么，很多人，很多机构算法都这么做的，结果就是使行情一旦触及等距运动目标。通常就会涌现一批止盈的反向订单。到位以后，他们就离场，否则胜率会降低，变得难以捉摸。这种共同的行动倾向，将使得行情至少进入回调，乃至于大型趋势反转。","p":"p402"},{"t":"听起来抽象吗？我自己确实觉得并不好理解。读书过程中，最让我觉得烧脑需要用上充分理解能力，却也最让我惊艳，最启发我的描述。莫过于以上原理。如果没有很明白，再反复看几次也可以，请确保自己有理解。我再换句话说给你听一次，不懂就把握机会，懂了就当复习。为什么等距运动目标往往能够如此精确的发挥作用？这是因为等距运动是机构使期望为正所需的最低限度，否则他们就不会入场交易。而由于他们总的盈利。对吧，市场中90%的成交量有长期盈利，否则就会被淘汰的精明机构所创造。所以它们所有交易的集合，并能满足于一个结果为正的交易者方程式。这代表对于他们所交易的每一块钱，每一美元最小的波动幅度，都必须至少是一段等距运动。不然的话，比如不及等距盈亏比只有0.3倍，那么胜率就需要长期远高于60%，将近90%。但这却并不怎么可能。综合以上，由于许多机构都知道，只要在等距运动目标止盈离场，他们就合乎使其所有交易的集合能够获利的最低限度。于是他们也就真的会如此做，导致许多交易就都刚好只触及等距运动目标。希望在复述一次之后，你有听明白了，也希望你有感受到我从不同角度，不同顺序表达这个坚深道理的努力。总之，无论在极端或不极端的市场状态中，等距运动虽然不时仍会不及或过冲。但也很常几乎丝毫不差。于是既然等距运动目标抵达后，机构倾向集体止盈，召唤逆行。那么，这也就成了交易者们必定要学会寻找的关键的磁体类型之一。回调经常是与等距运动目标的抵达。这下子原理应该明白了。在脉络合一的情境下，争取等距运动利润是机构或任何市场参与者维持最低数学优势要求的便宜方案。于是等距运动目标本身就积累了由止盈构成的大量反向订单，当然也就是磁体的一种。了解成因，接下来我们就可以进一步讨论等距运动目标可以如何测算呢？","p":"p403"}]},{"t":"para","text":"听起来抽象吗？我自己确实觉得并不好理解。读书过程中，最让我觉得烧脑需要用上充分理解能力，却也最让我惊艳，最启发我的描述。莫过于以上原理。如果没有很明白，再反复看几次也可以，请确保自己有理解。我再换句话说给你听一次，不懂就把握机会，懂了就当复习。为什么等距运动目标往往能够如此精确的发挥作用？这是因为等距运动是机构使期望为正所需的最低限度，否则他们就不会入场交易。而由于他们总的盈利。对吧，市场中90%的成交量有长期盈利，否则就会被淘汰的精明机构所创造。所以它们所有交易的集合，并能满足于一个结果为正的交易者方程式。这代表对于他们所交易的每一块钱，每一美元最小的波动幅度，都必须至少是一段等距运动。不然的话，比如不及等距盈亏比只有0.3倍，那么胜率就需要长期远高于60%，将近90%。但这却并不怎么可能。综合以上，由于许多机构都知道，只要在等距运动目标止盈离场，他们就合乎使其所有交易的集合能够获利的最低限度。于是他们也就真的会如此做，导致许多交易就都刚好只触及等距运动目标。希望在复述一次之后，你有听明白了，也希望你有感受到我从不同角度，不同顺序表达这个坚深道理的努力。总之，无论在极端或不极端的市场状态中，等距运动虽然不时仍会不及或过冲。但也很常几乎丝毫不差。于是既然等距运动目标抵达后，机构倾向集体止盈，召唤逆行。那么，这也就成了交易者们必定要学会寻找的关键的磁体类型之一。回调经常是与等距运动目标的抵达。这下子原理应该明白了。在脉络合一的情境下，争取等距运动利润是机构或任何市场参与者维持最低数学优势要求的便宜方案。于是等距运动目标本身就积累了由止盈构成的大量反向订单，当然也就是磁体的一种。了解成因，接下来我们就可以进一步讨论等距运动目标可以如何测算呢？","pid":"p403"},{"t":"img","src":"assets/img/l10A_149.webp","ilabel":"10-6","icap":"L10　等距运动原理","fid":"fig149","ctx":[{"t":"听起来抽象吗？我自己确实觉得并不好理解。读书过程中，最让我觉得烧脑需要用上充分理解能力，却也最让我惊艳，最启发我的描述。莫过于以上原理。如果没有很明白，再反复看几次也可以，请确保自己有理解。我再换句话说给你听一次，不懂就把握机会，懂了就当复习。为什么等距运动目标往往能够如此精确的发挥作用？这是因为等距运动是机构使期望为正所需的最低限度，否则他们就不会入场交易。而由于他们总的盈利。对吧，市场中90%的成交量有长期盈利，否则就会被淘汰的精明机构所创造。所以它们所有交易的集合，并能满足于一个结果为正的交易者方程式。这代表对于他们所交易的每一块钱，每一美元最小的波动幅度，都必须至少是一段等距运动。不然的话，比如不及等距盈亏比只有0.3倍，那么胜率就需要长期远高于60%，将近90%。但这却并不怎么可能。综合以上，由于许多机构都知道，只要在等距运动目标止盈离场，他们就合乎使其所有交易的集合能够获利的最低限度。于是他们也就真的会如此做，导致许多交易就都刚好只触及等距运动目标。希望在复述一次之后，你有听明白了，也希望你有感受到我从不同角度，不同顺序表达这个坚深道理的努力。总之，无论在极端或不极端的市场状态中，等距运动虽然不时仍会不及或过冲。但也很常几乎丝毫不差。于是既然等距运动目标抵达后，机构倾向集体止盈，召唤逆行。那么，这也就成了交易者们必定要学会寻找的关键的磁体类型之一。回调经常是与等距运动目标的抵达。这下子原理应该明白了。在脉络合一的情境下，争取等距运动利润是机构或任何市场参与者维持最低数学优势要求的便宜方案。于是等距运动目标本身就积累了由止盈构成的大量反向订单，当然也就是磁体的一种。了解成因，接下来我们就可以进一步讨论等距运动目标可以如何测算呢？","p":"p403"},{"t":"以下要介绍三种方式，大家可以挑看选看。我们再把前面这个交易日调出来看一下。可以很方便的理解这三种测算方式分别是什么样子？第一种叫做AB=CD的等距运动。这段运行，然后回调，在走出新的一段造成极值递进之后，抵达等距就是属于这一种类型。这一组也是，你也可以这样看。或者这一组也是。此间AB就是第一推起点与终点。CD则是第二推起点与终点。两者成等距关系，所以AB=CD。有时候你会听人家讲ABC回调或者ABC运动。其实也是一样的意思。只不过他们的ABC换了用法，是指A段运行B段回调C段再运行。两者基本没有分别，就看你习惯怎么称呼而已。不过我是更习惯AB=CD。所以在课程里，原则上我都会这么叫。那这种AB=CD的等距运动现象背后的原理基础，其实你已经略懂了。我们在突破的单元里就已经提示过。也就是当强劲的突破发生，而多数交易者评估加入由这段突破所启动的新趋势方向，将更有利可图的时候。他们就会急于在回调中买进去，凭调被套的空单或建立刚才踏空而没来得及开立的多头仓位。这就会导致第二推。在课堂中重复这么多次，以后强劲突破发生，交易者就有信心等待还有第二推。这应该要已经能够内建成你的自然反应了。这确实在图表上分分时时，日日夜夜的反复出现。只不过我在这边告诉你的新资讯是不止会有第二推，他还很长是等距的第二推。凭什么第二推会等距呢？我们还是来细究一下，满足想要打破沙锅问到底的同学。这其实是价值交易者的止损与止盈订单所锚定的。你可以想象，在这一波回调当中，应该有不少希望以划算价格建仓的价值交易者会逢高做空，对吧？只不过每个人入场的时机可能不一样。有人激进一点，他怕踏空，所以在阳线收线以后就主观预期多头会失败。直接在阳线收线时市价做空。第二个人可能又等了一下，看到这根光角阴线以后，才认为空头动能也许将会恢复。所以入场在趋势阴线收线之时。而第三个人可能运气最好，他选择在这个微小的次级波段点被向上突破的时候，预期会形成一个微型双顶。多头再次突破失败。所以透过挂上限价卖单，入场在了以后见之名来看，几乎是最棒的位置。那无论入场理由如何，这些人都预期第一推，以后还有第二推，而自己要获利的方法。就是利用这一点，建立1.0倍盈亏比的仓位测算等距利润。那对于这三个人来说，他们也许都采了胜率最高的止损方式，就是将止损放在这个重要波段点之外。这波下跌的起点之外。那从入场价映射到对面去，止盈位置就会分别落在这三个地方。那由于价值交易者的入场位置各异，第四个人可能将止盈落在这里。第五个人则又是另一个位置。想到这里，你可能觉得眼花缭乱，不晓得怎么选才对。不过我们可以做一个平均的选择。回调作为一种短暂的区间均衡处，应该会同样位于中轴，而均衡处理应能够造就最多的交投。也就是说，最多人选择做空的位置，很可能落在中轴附近。刚刚的前两位同学虽然入场理由不同，但总之位置都差不多，对吧？与中轴入场的交易者人多势众。于是他们的止盈订单数量应该会最多，最能发挥此体效果。于是以中轴上下投影等距其实就跟将AB这段运动的长度复制到C的端点上。认定价格会在低走高是一模一样的事情。到位以后，以这个例子来说，就过冲一下，以后就开始反转。可如果是这样测的话，就是旋即启动反转，显而易见。好，现在你知道AB=CD的结果与自回调中轴向上向下测量等距的结果相同。也已经知道原理是立基于价值交易者的集体等距止盈，那我们还需要知道什么呢？","p":"p404"}]},{"t":"para","text":"以下要介绍三种方式，大家可以挑看选看。我们再把前面这个交易日调出来看一下。可以很方便的理解这三种测算方式分别是什么样子？第一种叫做AB=CD的等距运动。这段运行，然后回调，在走出新的一段造成极值递进之后，抵达等距就是属于这一种类型。这一组也是，你也可以这样看。或者这一组也是。此间AB就是第一推起点与终点。CD则是第二推起点与终点。两者成等距关系，所以AB=CD。有时候你会听人家讲ABC回调或者ABC运动。其实也是一样的意思。只不过他们的ABC换了用法，是指A段运行B段回调C段再运行。两者基本没有分别，就看你习惯怎么称呼而已。不过我是更习惯AB=CD。所以在课程里，原则上我都会这么叫。那这种AB=CD的等距运动现象背后的原理基础，其实你已经略懂了。我们在突破的单元里就已经提示过。也就是当强劲的突破发生，而多数交易者评估加入由这段突破所启动的新趋势方向，将更有利可图的时候。他们就会急于在回调中买进去，凭调被套的空单或建立刚才踏空而没来得及开立的多头仓位。这就会导致第二推。在课堂中重复这么多次，以后强劲突破发生，交易者就有信心等待还有第二推。这应该要已经能够内建成你的自然反应了。这确实在图表上分分时时，日日夜夜的反复出现。只不过我在这边告诉你的新资讯是不止会有第二推，他还很长是等距的第二推。凭什么第二推会等距呢？我们还是来细究一下，满足想要打破沙锅问到底的同学。这其实是价值交易者的止损与止盈订单所锚定的。你可以想象，在这一波回调当中，应该有不少希望以划算价格建仓的价值交易者会逢高做空，对吧？只不过每个人入场的时机可能不一样。有人激进一点，他怕踏空，所以在阳线收线以后就主观预期多头会失败。直接在阳线收线时市价做空。第二个人可能又等了一下，看到这根光角阴线以后，才认为空头动能也许将会恢复。所以入场在趋势阴线收线之时。而第三个人可能运气最好，他选择在这个微小的次级波段点被向上突破的时候，预期会形成一个微型双顶。多头再次突破失败。所以透过挂上限价卖单，入场在了以后见之名来看，几乎是最棒的位置。那无论入场理由如何，这些人都预期第一推，以后还有第二推，而自己要获利的方法。就是利用这一点，建立1.0倍盈亏比的仓位测算等距利润。那对于这三个人来说，他们也许都采了胜率最高的止损方式，就是将止损放在这个重要波段点之外。这波下跌的起点之外。那从入场价映射到对面去，止盈位置就会分别落在这三个地方。那由于价值交易者的入场位置各异，第四个人可能将止盈落在这里。第五个人则又是另一个位置。想到这里，你可能觉得眼花缭乱，不晓得怎么选才对。不过我们可以做一个平均的选择。回调作为一种短暂的区间均衡处，应该会同样位于中轴，而均衡处理应能够造就最多的交投。也就是说，最多人选择做空的位置，很可能落在中轴附近。刚刚的前两位同学虽然入场理由不同，但总之位置都差不多，对吧？与中轴入场的交易者人多势众。于是他们的止盈订单数量应该会最多，最能发挥此体效果。于是以中轴上下投影等距其实就跟将AB这段运动的长度复制到C的端点上。认定价格会在低走高是一模一样的事情。到位以后，以这个例子来说，就过冲一下，以后就开始反转。可如果是这样测的话，就是旋即启动反转，显而易见。好，现在你知道AB=CD的结果与自回调中轴向上向下测量等距的结果相同。也已经知道原理是立基于价值交易者的集体等距止盈，那我们还需要知道什么呢？","pid":"p404"},{"t":"img","src":"assets/img/l10A_150.webp","ilabel":"10-7","icap":"L10　等距运动原理","fid":"fig150","ctx":[{"t":"以下要介绍三种方式，大家可以挑看选看。我们再把前面这个交易日调出来看一下。可以很方便的理解这三种测算方式分别是什么样子？第一种叫做AB=CD的等距运动。这段运行，然后回调，在走出新的一段造成极值递进之后，抵达等距就是属于这一种类型。这一组也是，你也可以这样看。或者这一组也是。此间AB就是第一推起点与终点。CD则是第二推起点与终点。两者成等距关系，所以AB=CD。有时候你会听人家讲ABC回调或者ABC运动。其实也是一样的意思。只不过他们的ABC换了用法，是指A段运行B段回调C段再运行。两者基本没有分别，就看你习惯怎么称呼而已。不过我是更习惯AB=CD。所以在课程里，原则上我都会这么叫。那这种AB=CD的等距运动现象背后的原理基础，其实你已经略懂了。我们在突破的单元里就已经提示过。也就是当强劲的突破发生，而多数交易者评估加入由这段突破所启动的新趋势方向，将更有利可图的时候。他们就会急于在回调中买进去，凭调被套的空单或建立刚才踏空而没来得及开立的多头仓位。这就会导致第二推。在课堂中重复这么多次，以后强劲突破发生，交易者就有信心等待还有第二推。这应该要已经能够内建成你的自然反应了。这确实在图表上分分时时，日日夜夜的反复出现。只不过我在这边告诉你的新资讯是不止会有第二推，他还很长是等距的第二推。凭什么第二推会等距呢？我们还是来细究一下，满足想要打破沙锅问到底的同学。这其实是价值交易者的止损与止盈订单所锚定的。你可以想象，在这一波回调当中，应该有不少希望以划算价格建仓的价值交易者会逢高做空，对吧？只不过每个人入场的时机可能不一样。有人激进一点，他怕踏空，所以在阳线收线以后就主观预期多头会失败。直接在阳线收线时市价做空。第二个人可能又等了一下，看到这根光角阴线以后，才认为空头动能也许将会恢复。所以入场在趋势阴线收线之时。而第三个人可能运气最好，他选择在这个微小的次级波段点被向上突破的时候，预期会形成一个微型双顶。多头再次突破失败。所以透过挂上限价卖单，入场在了以后见之名来看，几乎是最棒的位置。那无论入场理由如何，这些人都预期第一推，以后还有第二推，而自己要获利的方法。就是利用这一点，建立1.0倍盈亏比的仓位测算等距利润。那对于这三个人来说，他们也许都采了胜率最高的止损方式，就是将止损放在这个重要波段点之外。这波下跌的起点之外。那从入场价映射到对面去，止盈位置就会分别落在这三个地方。那由于价值交易者的入场位置各异，第四个人可能将止盈落在这里。第五个人则又是另一个位置。想到这里，你可能觉得眼花缭乱，不晓得怎么选才对。不过我们可以做一个平均的选择。回调作为一种短暂的区间均衡处，应该会同样位于中轴，而均衡处理应能够造就最多的交投。也就是说，最多人选择做空的位置，很可能落在中轴附近。刚刚的前两位同学虽然入场理由不同，但总之位置都差不多，对吧？与中轴入场的交易者人多势众。于是他们的止盈订单数量应该会最多，最能发挥此体效果。于是以中轴上下投影等距其实就跟将AB这段运动的长度复制到C的端点上。认定价格会在低走高是一模一样的事情。到位以后，以这个例子来说，就过冲一下，以后就开始反转。可如果是这样测的话，就是旋即启动反转，显而易见。好，现在你知道AB=CD的结果与自回调中轴向上向下测量等距的结果相同。也已经知道原理是立基于价值交易者的集体等距止盈，那我们还需要知道什么呢？","p":"p404"},{"t":"你还应该要知道的是，由于回调启动证实了顺势动能的溢散。第二推，尽管能够等距，但通常会是稍微疲弱一点的通道。除非第二推的终点有强力的磁体在等它，那可能就会变成因真空效应而导致的，看起来很强的高潮运动，抛物线运动也就是第二推陷阱。但总之，典型是第一推强劲，而第二推弱势的走法，我们称为急速与通道组合。基本上也可以算是一种形态了。而第一推强劲，第二推更强劲的第二推陷阱则是极速与通道的变体。但两者的效果相同，等距到位以后，价格常会陷入某种程度的回调，乃至于大型趋势反转。","p":"p405"}]},{"t":"para","text":"你还应该要知道的是，由于回调启动证实了顺势动能的溢散。第二推，尽管能够等距，但通常会是稍微疲弱一点的通道。除非第二推的终点有强力的磁体在等它，那可能就会变成因真空效应而导致的，看起来很强的高潮运动，抛物线运动也就是第二推陷阱。但总之，典型是第一推强劲，而第二推弱势的走法，我们称为急速与通道组合。基本上也可以算是一种形态了。而第一推强劲，第二推更强劲的第二推陷阱则是极速与通道的变体。但两者的效果相同，等距到位以后，价格常会陷入某种程度的回调，乃至于大型趋势反转。","pid":"p405"},{"t":"img","src":"assets/img/l10A_151.webp","ilabel":"10-8","icap":"L10　等距运动原理","fid":"fig151","ctx":[{"t":"你还应该要知道的是，由于回调启动证实了顺势动能的溢散。第二推，尽管能够等距，但通常会是稍微疲弱一点的通道。除非第二推的终点有强力的磁体在等它，那可能就会变成因真空效应而导致的，看起来很强的高潮运动，抛物线运动也就是第二推陷阱。但总之，典型是第一推强劲，而第二推弱势的走法，我们称为急速与通道组合。基本上也可以算是一种形态了。而第一推强劲，第二推更强劲的第二推陷阱则是极速与通道的变体。但两者的效果相同，等距到位以后，价格常会陷入某种程度的回调，乃至于大型趋势反转。","p":"p405"},{"t":"第二种叫做基于急速高度的等距投影。相较于AB=CD是用价值交易者的逻辑去推算目标。这种方案则是基于动能交易者的止损和止盈选择。怎么说呢，你一定还记得动能交易者是有动能就敢追他们，愿意在每根K线的收线时市价入场。尤其是当收出趋势K线时。所以即使是最不巧的情况，恰巧追在急速结束之前的最后一根K线而下，一根立即就是回调K线。那基于第一推之后倾向还有第二推的道理，也应该让这些人有利可图，否则他们就不会那么做了，对吧？那么，同样以入场价与止损位置之间的距离去投影等距运动就是这种方案的标准流程。你不用等待进入回调哦，不用等待回调结束就可以即刻进行这种丈量。只不过对我来说，这相对是比较不保守的方案。因为在回调中，以划算价格入场的价值，交易者常常能够更显止盈。要是回调较久，累积了比较多的价值，交易者在过程中入场。那么，他们位于更前方的止盈订单数量就会增多，成为动能交易者在较远处止盈的一种障碍。不过这同样只是我个人的爱好，选这种方案还做得好的人也大有人在。尤其选AB=CD，不时会止盈的更早，错失后续的利润。所以就看你觉得早点落袋为安好，还是争取完整，但不一定到的利润好。都可以权衡一下利弊得失即可。","p":"p406"}]},{"t":"para","text":"第二种叫做基于急速高度的等距投影。相较于AB=CD是用价值交易者的逻辑去推算目标。这种方案则是基于动能交易者的止损和止盈选择。怎么说呢，你一定还记得动能交易者是有动能就敢追他们，愿意在每根K线的收线时市价入场。尤其是当收出趋势K线时。所以即使是最不巧的情况，恰巧追在急速结束之前的最后一根K线而下，一根立即就是回调K线。那基于第一推之后倾向还有第二推的道理，也应该让这些人有利可图，否则他们就不会那么做了，对吧？那么，同样以入场价与止损位置之间的距离去投影等距运动就是这种方案的标准流程。你不用等待进入回调哦，不用等待回调结束就可以即刻进行这种丈量。只不过对我来说，这相对是比较不保守的方案。因为在回调中，以划算价格入场的价值，交易者常常能够更显止盈。要是回调较久，累积了比较多的价值，交易者在过程中入场。那么，他们位于更前方的止盈订单数量就会增多，成为动能交易者在较远处止盈的一种障碍。不过这同样只是我个人的爱好，选这种方案还做得好的人也大有人在。尤其选AB=CD，不时会止盈的更早，错失后续的利润。所以就看你觉得早点落袋为安好，还是争取完整，但不一定到的利润好。都可以权衡一下利弊得失即可。","pid":"p406"},{"t":"img","src":"assets/img/l10A_152.webp","ilabel":"10-9","icap":"L10　等距运动原理","fid":"fig152","ctx":[{"t":"第二种叫做基于急速高度的等距投影。相较于AB=CD是用价值交易者的逻辑去推算目标。这种方案则是基于动能交易者的止损和止盈选择。怎么说呢，你一定还记得动能交易者是有动能就敢追他们，愿意在每根K线的收线时市价入场。尤其是当收出趋势K线时。所以即使是最不巧的情况，恰巧追在急速结束之前的最后一根K线而下，一根立即就是回调K线。那基于第一推之后倾向还有第二推的道理，也应该让这些人有利可图，否则他们就不会那么做了，对吧？那么，同样以入场价与止损位置之间的距离去投影等距运动就是这种方案的标准流程。你不用等待进入回调哦，不用等待回调结束就可以即刻进行这种丈量。只不过对我来说，这相对是比较不保守的方案。因为在回调中，以划算价格入场的价值，交易者常常能够更显止盈。要是回调较久，累积了比较多的价值，交易者在过程中入场。那么，他们位于更前方的止盈订单数量就会增多，成为动能交易者在较远处止盈的一种障碍。不过这同样只是我个人的爱好，选这种方案还做得好的人也大有人在。尤其选AB=CD，不时会止盈的更早，错失后续的利润。所以就看你觉得早点落袋为安好，还是争取完整，但不一定到的利润好。都可以权衡一下利弊得失即可。","p":"p406"},{"t":"而我要特别多嘴补充一下的是，这种测算方法的尾段也就是动能交易者的入场处。通常会采实体部分，忽略最后一小段影线。因为动能交易者更常是在收线后就立即市价追进，不会再等影线被重新突破。这点可以稍微注意一下。","p":"p407"}]},{"t":"para","text":"而我要特别多嘴补充一下的是，这种测算方法的尾段也就是动能交易者的入场处。通常会采实体部分，忽略最后一小段影线。因为动能交易者更常是在收线后就立即市价追进，不会再等影线被重新突破。这点可以稍微注意一下。","pid":"p407"},{"t":"img","src":"assets/img/l10A_153.webp","ilabel":"10-10","icap":"L10　等距运动原理","fid":"fig153","ctx":[{"t":"而我要特别多嘴补充一下的是，这种测算方法的尾段也就是动能交易者的入场处。通常会采实体部分，忽略最后一小段影线。因为动能交易者更常是在收线后就立即市价追进，不会再等影线被重新突破。这点可以稍微注意一下。","p":"p407"},{"t":"第三种叫做基于形态或基于区间高度的等距投影。这也更像是基于动能交易者的逻辑去成立的做法。为什么呢？以这个短暂区间，或你说，双重顶的下破为例，这里产生了动能强大的趋势阴线。造成突破成功。背后的原因必然是机构共识的认为。在这里做空有利可图，合理测算等距利润的胜率能够是60%。不然他们就不会做了，趋势阴线就不会形成了，突破也就不会成功了。那么，对于这些突破交易者来说，合理测算等距利润的方法是什么呢？我要拿哪一段空间作为入场和止损之间的距离呢？聪明的你应该想得到，此时极值已经向下递进，那么回头被追认的重要波段点就是方才双重顶的高点。将止损摆在上面，应该是安全的，因为好不容易发起突破的空头会保护避免止损遭到清扫。所以止损距离就刚好是整个形态，整个区间的高度向下翻一个等距。这里也就会是这些人，这些最早在突破瞬间就得以入场的交易者的止盈目标。也确实，无论你要称它为双重顶，认为这是突破颈线之后的等距运动。还是你要称它为区间，认为这是区间边线突破后的等距扩张都可以。你可以看它外观像哪个就叫它哪个，反正效用是一样的。只要知道交易者的止损摆在哪里是合理的，你就能够找到投影等距的正确方法。","p":"p408"}]},{"t":"para","text":"第三种叫做基于形态或基于区间高度的等距投影。这也更像是基于动能交易者的逻辑去成立的做法。为什么呢？以这个短暂区间，或你说，双重顶的下破为例，这里产生了动能强大的趋势阴线。造成突破成功。背后的原因必然是机构共识的认为。在这里做空有利可图，合理测算等距利润的胜率能够是60%。不然他们就不会做了，趋势阴线就不会形成了，突破也就不会成功了。那么，对于这些突破交易者来说，合理测算等距利润的方法是什么呢？我要拿哪一段空间作为入场和止损之间的距离呢？聪明的你应该想得到，此时极值已经向下递进，那么回头被追认的重要波段点就是方才双重顶的高点。将止损摆在上面，应该是安全的，因为好不容易发起突破的空头会保护避免止损遭到清扫。所以止损距离就刚好是整个形态，整个区间的高度向下翻一个等距。这里也就会是这些人，这些最早在突破瞬间就得以入场的交易者的止盈目标。也确实，无论你要称它为双重顶，认为这是突破颈线之后的等距运动。还是你要称它为区间，认为这是区间边线突破后的等距扩张都可以。你可以看它外观像哪个就叫它哪个，反正效用是一样的。只要知道交易者的止损摆在哪里是合理的，你就能够找到投影等距的正确方法。","pid":"p408"},{"t":"img","src":"assets/img/l10A_154.webp","ilabel":"10-11","icap":"L10　等距运动原理","fid":"fig154","ctx":[{"t":"第三种叫做基于形态或基于区间高度的等距投影。这也更像是基于动能交易者的逻辑去成立的做法。为什么呢？以这个短暂区间，或你说，双重顶的下破为例，这里产生了动能强大的趋势阴线。造成突破成功。背后的原因必然是机构共识的认为。在这里做空有利可图，合理测算等距利润的胜率能够是60%。不然他们就不会做了，趋势阴线就不会形成了，突破也就不会成功了。那么，对于这些突破交易者来说，合理测算等距利润的方法是什么呢？我要拿哪一段空间作为入场和止损之间的距离呢？聪明的你应该想得到，此时极值已经向下递进，那么回头被追认的重要波段点就是方才双重顶的高点。将止损摆在上面，应该是安全的，因为好不容易发起突破的空头会保护避免止损遭到清扫。所以止损距离就刚好是整个形态，整个区间的高度向下翻一个等距。这里也就会是这些人，这些最早在突破瞬间就得以入场的交易者的止盈目标。也确实，无论你要称它为双重顶，认为这是突破颈线之后的等距运动。还是你要称它为区间，认为这是区间边线突破后的等距扩张都可以。你可以看它外观像哪个就叫它哪个，反正效用是一样的。只要知道交易者的止损摆在哪里是合理的，你就能够找到投影等距的正确方法。","p":"p408"},{"t":"一口气介绍了三种等距运动目标的找法，分别是AB=CD基于急速高度，以及基于形态。基于区间高度，希望你有听明白。如果听明白了，下一个冒出的疑惑，应该会是既然等距运动有那么多测算方式。那我应该挑哪一个呢？有没有哪一个更加准确？很遗憾的答案是我无法跟你保证。如果有一个方案是保证准每次准，那么就永赚了。机构如此激烈，竞争不会提供这种圣杯般的答案。所以交易者要考虑的是确保自己明白了上述原理，知道价值，交易者与动能，交易者各自的逻辑是什么？然后按照你的风险偏好去选择或近或远的方案。如果你愿意放弃盈亏比去投身胜利的怀抱，那就选最近的。通常AB=CD会比急速实体投影更近。而如果你希望赚到更多的利润胜率折损也可以接受，那就选比较远的那一种。又或者你希望自己在交易现场进行分析的时候，都能够尽量掌握所有的可能性。那可取的做法确实就是标记出所有可能是答案的位置，三种都用。反正你必定会看见，随着趋势运行不同，等距运动目标依需被触及。而每次行抵等距运动目标，就会有顺势止盈，逆势建仓的反向定价生效，使得趋势动能越趋减弱。直到最后有一段运行触及了多重磁体，或总之是更巨量的反向订单聚集处。那行情就会转入大型趋势反转。","p":"p409"}]},{"t":"para","text":"一口气介绍了三种等距运动目标的找法，分别是AB=CD基于急速高度，以及基于形态。基于区间高度，希望你有听明白。如果听明白了，下一个冒出的疑惑，应该会是既然等距运动有那么多测算方式。那我应该挑哪一个呢？有没有哪一个更加准确？很遗憾的答案是我无法跟你保证。如果有一个方案是保证准每次准，那么就永赚了。机构如此激烈，竞争不会提供这种圣杯般的答案。所以交易者要考虑的是确保自己明白了上述原理，知道价值，交易者与动能，交易者各自的逻辑是什么？然后按照你的风险偏好去选择或近或远的方案。如果你愿意放弃盈亏比去投身胜利的怀抱，那就选最近的。通常AB=CD会比急速实体投影更近。而如果你希望赚到更多的利润胜率折损也可以接受，那就选比较远的那一种。又或者你希望自己在交易现场进行分析的时候，都能够尽量掌握所有的可能性。那可取的做法确实就是标记出所有可能是答案的位置，三种都用。反正你必定会看见，随着趋势运行不同，等距运动目标依需被触及。而每次行抵等距运动目标，就会有顺势止盈，逆势建仓的反向定价生效，使得趋势动能越趋减弱。直到最后有一段运行触及了多重磁体，或总之是更巨量的反向订单聚集处。那行情就会转入大型趋势反转。","pid":"p409"},{"t":"img","src":"assets/img/l10A_155.webp","ilabel":"10-12","icap":"L10　等距运动原理","fid":"fig155","ctx":[{"t":"一口气介绍了三种等距运动目标的找法，分别是AB=CD基于急速高度，以及基于形态。基于区间高度，希望你有听明白。如果听明白了，下一个冒出的疑惑，应该会是既然等距运动有那么多测算方式。那我应该挑哪一个呢？有没有哪一个更加准确？很遗憾的答案是我无法跟你保证。如果有一个方案是保证准每次准，那么就永赚了。机构如此激烈，竞争不会提供这种圣杯般的答案。所以交易者要考虑的是确保自己明白了上述原理，知道价值，交易者与动能，交易者各自的逻辑是什么？然后按照你的风险偏好去选择或近或远的方案。如果你愿意放弃盈亏比去投身胜利的怀抱，那就选最近的。通常AB=CD会比急速实体投影更近。而如果你希望赚到更多的利润胜率折损也可以接受，那就选比较远的那一种。又或者你希望自己在交易现场进行分析的时候，都能够尽量掌握所有的可能性。那可取的做法确实就是标记出所有可能是答案的位置，三种都用。反正你必定会看见，随着趋势运行不同，等距运动目标依需被触及。而每次行抵等距运动目标，就会有顺势止盈，逆势建仓的反向定价生效，使得趋势动能越趋减弱。直到最后有一段运行触及了多重磁体，或总之是更巨量的反向订单聚集处。那行情就会转入大型趋势反转。","p":"p409"},{"t":"在这一节的最后，我们简单进一个新的例子来为大家做复习动态的尝试一下如何运用刚刚教的方法。相较于昨天，今天是个跳空高开的交易日。然后走了一连串的阴线，算是一个急速，有一些下影线可能有窄幅通道的性格。不过，总之基于动能交易者的做法，即使他们入场在急速的最后一根阴线旋即就进入回调。他们也依然可以借此进行等距测算，测算的目标会落在这个位置。而回调后续走的蛮漫长的，不过在这个次要波段点处微弱的多头动能无法得到延续。所以造就了一个双重顶的轮廓。倘若下破，那么基于这个双重顶，基于这个区间的高度，也可以进行等距运动的丈量。或者以AB=CD的逻辑与其下跌，可能在这附近结束。你注意到了吗？其实无论哪一种方案，最后价格抵达的位置似乎差距不是太远。这除了是在告诉我们，其实你选择关注哪一个都有道理，都有一定程度的实用性之外。也是告诉我们，即使是精密的交易数学多重精密就有多种可能。这是市场之所以存在多解性的根本道理，很烦人，但也很迷人。总之，第二推是一个强劲的下跌，却在这些磁体处遭到拦阻，遭到多头的反攻。后续行情就开始上扬。折返向上的途中，你也可以根据这些方法同时画记出不同的等距方案，预期上涨可能涨到哪里去？只可惜这是台指期的图表，一天开市的时间比较短一些，所以还没到目标就收盘了。借此也再次提醒你，对于任何磁体本来就可能不及持平或过冲。有道没道都有可能，但重要的是你理解这些技术背后的原理。你能够在读图的当下看懂更多资讯。也于是你将可能比较贴近的去体察市场的脉动。","p":"p410"}]},{"t":"para","text":"在这一节的最后，我们简单进一个新的例子来为大家做复习动态的尝试一下如何运用刚刚教的方法。相较于昨天，今天是个跳空高开的交易日。然后走了一连串的阴线，算是一个急速，有一些下影线可能有窄幅通道的性格。不过，总之基于动能交易者的做法，即使他们入场在急速的最后一根阴线旋即就进入回调。他们也依然可以借此进行等距测算，测算的目标会落在这个位置。而回调后续走的蛮漫长的，不过在这个次要波段点处微弱的多头动能无法得到延续。所以造就了一个双重顶的轮廓。倘若下破，那么基于这个双重顶，基于这个区间的高度，也可以进行等距运动的丈量。或者以AB=CD的逻辑与其下跌，可能在这附近结束。你注意到了吗？其实无论哪一种方案，最后价格抵达的位置似乎差距不是太远。这除了是在告诉我们，其实你选择关注哪一个都有道理，都有一定程度的实用性之外。也是告诉我们，即使是精密的交易数学多重精密就有多种可能。这是市场之所以存在多解性的根本道理，很烦人，但也很迷人。总之，第二推是一个强劲的下跌，却在这些磁体处遭到拦阻，遭到多头的反攻。后续行情就开始上扬。折返向上的途中，你也可以根据这些方法同时画记出不同的等距方案，预期上涨可能涨到哪里去？只可惜这是台指期的图表，一天开市的时间比较短一些，所以还没到目标就收盘了。借此也再次提醒你，对于任何磁体本来就可能不及持平或过冲。有道没道都有可能，但重要的是你理解这些技术背后的原理。你能够在读图的当下看懂更多资讯。也于是你将可能比较贴近的去体察市场的脉动。","pid":"p410"}],"wcount":7321},{"id":"l10B","title":"第B段　等距运动原理","blocks":[{"t":"para","text":"L10B 等距运动原理","pid":"p411"},{"t":"para","text":"经过上一节的说明，您应该已经明白，市场中屡屡出现的等距运动，事实上是市场参与者基于精密的数学逻辑而产生的集体行为的结果。而此间还有一种本质相同的变体，要跟你介绍，那就是50%回调。同样引入范例来说明是最快的。","pid":"p412"},{"t":"img","src":"assets/img/l10B_156.webp","ilabel":"10-13","icap":"L10　等距运动原理","fid":"fig156","ctx":[{"t":"L10B 等距运动原理","p":"p411"},{"t":"经过上一节的说明，您应该已经明白，市场中屡屡出现的等距运动，事实上是市场参与者基于精密的数学逻辑而产生的集体行为的结果。而此间还有一种本质相同的变体，要跟你介绍，那就是50%回调。同样引入范例来说明是最快的。","p":"p412"},{"t":"在画面的最左边，你可以看到一轮拉伸，然后是两根阴线的回调。回调结束以后，价格继续上涨，直到这根上影线收出，然后又下跌到这里来。看起来是平淡无奇的运动，但里面隐藏的讯息还是很精彩的。比如，结合上一节的知识，你会发现这是急速与通道的组合。上涨并转折进入回调后开启通道阶段，通道阶段稍微疲弱了一点。然后一旦用上等距运动的知识，你会发现AB=CD的目标位置正巧落在这里。也就是说，这是一个稍微过冲等距目标以后，就转而向下的行情。不过奇妙且更重要的还在后头。在这里，我们一旦测量一下，就可以发现这里的首次回调正巧是落在这一推上涨的50%回调处。多一点点就开始反转走高。这里也是一样，回调结束，走出第二推以后。第二推与第三推之间被一根长下影线的阴线所隔开，影线所碰触到的位置也刚好是这一波上涨的一半就继续上行。","p":"p413"}]},{"t":"para","text":"在画面的最左边，你可以看到一轮拉伸，然后是两根阴线的回调。回调结束以后，价格继续上涨，直到这根上影线收出，然后又下跌到这里来。看起来是平淡无奇的运动，但里面隐藏的讯息还是很精彩的。比如，结合上一节的知识，你会发现这是急速与通道的组合。上涨并转折进入回调后开启通道阶段，通道阶段稍微疲弱了一点。然后一旦用上等距运动的知识，你会发现AB=CD的目标位置正巧落在这里。也就是说，这是一个稍微过冲等距目标以后，就转而向下的行情。不过奇妙且更重要的还在后头。在这里，我们一旦测量一下，就可以发现这里的首次回调正巧是落在这一推上涨的50%回调处。多一点点就开始反转走高。这里也是一样，回调结束，走出第二推以后。第二推与第三推之间被一根长下影线的阴线所隔开，影线所碰触到的位置也刚好是这一波上涨的一半就继续上行。","pid":"p413"},{"t":"img","src":"assets/img/l10B_157.webp","ilabel":"10-14","icap":"L10　等距运动原理","fid":"fig157","ctx":[{"t":"在画面的最左边，你可以看到一轮拉伸，然后是两根阴线的回调。回调结束以后，价格继续上涨，直到这根上影线收出，然后又下跌到这里来。看起来是平淡无奇的运动，但里面隐藏的讯息还是很精彩的。比如，结合上一节的知识，你会发现这是急速与通道的组合。上涨并转折进入回调后开启通道阶段，通道阶段稍微疲弱了一点。然后一旦用上等距运动的知识，你会发现AB=CD的目标位置正巧落在这里。也就是说，这是一个稍微过冲等距目标以后，就转而向下的行情。不过奇妙且更重要的还在后头。在这里，我们一旦测量一下，就可以发现这里的首次回调正巧是落在这一推上涨的50%回调处。多一点点就开始反转走高。这里也是一样，回调结束，走出第二推以后。第二推与第三推之间被一根长下影线的阴线所隔开，影线所碰触到的位置也刚好是这一波上涨的一半就继续上行。","p":"p413"},{"t":"这就是我们这一节要谈的等距运动原理的变体，50%回调。这跟等距有什么关系呢？难道背后也有类似的数学逻辑吗？有哦，超级有。在这个位置，价格距离原趋势的两端极值最高点和最低点是一样远的。你可以想象这边有影线嘛，代表有交易曾经发生在这里，对不对？那就说明了，这里有人做多，也有人做空。有人已买单，换了对方的卖单，两者成交价格才在这里留下了交易记录。那么，对于在这里做多的交易者来说，他的逻辑可以是我看到这波上行这么强劲，应该还有延续。所以我作为价值交易者，可以逢低逢划算的价格来减仓。止损摆在趋势发起的低点之外，预期价格能测试原趋势极值，换取一比一的等距利润，止盈出场。而对于它的对手呢，也就是空头，它同样可以将止损摆放在高点之外，赚取等距的利润。希望价格回落到急速起点，把多头刚刚所有的努力都退回去。这也就是说，这个价位是一个很特殊的关口。对于多空双方来说，止损和止盈都是同样的点数，是等距的。两者都在这里争取一比一的盈亏比。不过聪明的你一看这张图，结合所有学过的知识，你应该会很直觉的反映，现在应该更可能处在上升趋势里吧。毕竟都是趋势阳线动能饱满，卖压则相对弱很多，看起来做多会更有利一点。没错，这个判断是对的，趋势倾向延续。在此处，价格先向上而非向下运动的方向几率应该可以被认为是60%。于是乎，50%回调对顺势方来说变成一个非常重要的，具有建仓的战术价值的价位。因为在这里止损与止盈距离，对在这里成交的多头与空头来说都是相等的。但因为是上升趋势，所以它会给到多头胜率加持，那他们就在这里买入的理由。分析下来，你应该很能理解，这是具有数学优势的选择。这么看来，第二推的上涨在回调到半山腰以后又涨起来，现在我们也能理解背后的道理是什么了？多头看这波上涨的过程，动能也不错，卖压也少少的，那就倾向相信多方仍然掌控着市场运动的方向。于是他们决定要买入，甚至是直接在50%回调处挂上限价买单来买入。只要趋势仍然健康，交易者有证据认定失衡尚在。那么，他们就可能在50%回调处利用这种数学优势去入场。后面也是一样，处处可见。这波等距的急速与通道上涨结束以后，价格也在50%回调处止跌回升。当然，所有的转折可能都有复合的原因，比如前面这根影线可能是基于对突破点的过冲测试，加上50%回调。这里转涨也可能是因为对前面影线低点的双重底测试，加上50%回调。但总之，你要知道有这么做的道理。50%回调基于数学逻辑，本身就是一个可行的磁体。这里也一样，这波上涨这么强，有人可能预期在看到多头进一步失去动能，以前还有测试原趋势极值的机会。所以在50%回调处又再次买进。只可惜没到，","p":"p414"},{"t":"总有测试不及的时候，价格下落出现大阴线。也顺道复习一下，这是一个区间的等距扩张，在此处有做空交易者的止盈理由。精熟的交易者还可能进一步看出这是某种头肩顶的轮廓。但同样形态的颈线成功突破后，也将出现等距运动。最后反弹也在50%处止步。到这么强的阴线出现，同时前方大型趋势反转的条件俱全以后。对吧，趋势线突破低点，降低有卖压充足的反转形态，这里是三推的楔形顶。还有一次对原趋势极值的测试，构成更大的双重顶。同时，更缓的趋势线也被突破，低点也进一步降低。应该很确定是多头失去主导权了。因此，换成空头，有理由在50%回调处减仓。价格也在缓步调整之后，再次拐向下去。","p":"p415"}]},{"t":"para","text":"这就是我们这一节要谈的等距运动原理的变体，50%回调。这跟等距有什么关系呢？难道背后也有类似的数学逻辑吗？有哦，超级有。在这个位置，价格距离原趋势的两端极值最高点和最低点是一样远的。你可以想象这边有影线嘛，代表有交易曾经发生在这里，对不对？那就说明了，这里有人做多，也有人做空。有人已买单，换了对方的卖单，两者成交价格才在这里留下了交易记录。那么，对于在这里做多的交易者来说，他的逻辑可以是我看到这波上行这么强劲，应该还有延续。所以我作为价值交易者，可以逢低逢划算的价格来减仓。止损摆在趋势发起的低点之外，预期价格能测试原趋势极值，换取一比一的等距利润，止盈出场。而对于它的对手呢，也就是空头，它同样可以将止损摆放在高点之外，赚取等距的利润。希望价格回落到急速起点，把多头刚刚所有的努力都退回去。这也就是说，这个价位是一个很特殊的关口。对于多空双方来说，止损和止盈都是同样的点数，是等距的。两者都在这里争取一比一的盈亏比。不过聪明的你一看这张图，结合所有学过的知识，你应该会很直觉的反映，现在应该更可能处在上升趋势里吧。毕竟都是趋势阳线动能饱满，卖压则相对弱很多，看起来做多会更有利一点。没错，这个判断是对的，趋势倾向延续。在此处，价格先向上而非向下运动的方向几率应该可以被认为是60%。于是乎，50%回调对顺势方来说变成一个非常重要的，具有建仓的战术价值的价位。因为在这里止损与止盈距离，对在这里成交的多头与空头来说都是相等的。但因为是上升趋势，所以它会给到多头胜率加持，那他们就在这里买入的理由。分析下来，你应该很能理解，这是具有数学优势的选择。这么看来，第二推的上涨在回调到半山腰以后又涨起来，现在我们也能理解背后的道理是什么了？多头看这波上涨的过程，动能也不错，卖压也少少的 同时前方大型趋势反转的条件俱全以后。对吧，趋势线突破低点，降低有卖压充足的反转形态，这里是三推的楔形顶。还有一次对原趋势极值的测试，构成更大的双重顶。同时，更缓的趋势线也被突破，低点也进一步降低。应该很确定是多头失去主导权了。因此，换成空头，有理由在50%回调处减仓。价格也在缓步调整之后，再次拐向下去。","p":"p415"},{"t":"现在呢，我将刚刚所有标记所有在50%回调处发生过转折的部分都显露出来。然后再拿掉。您很容易可以发现到，如果没有对等距运动的理解，没有对50%回答的理解，也不用上先前教过的所有知识的话。我们读图又如麻瓜，又如文盲一样。多少人看着一张图表，心想这不就是平淡无奇的走势吗？你跟我说有什么逐根读图的必要？多空哪那么多资讯给你分析都是过度解读，都是强行解读。我的主张是一点都不是。不读，读不出来，是因为懒惰与愚蠢。不好意思，讲的比较重的话。","p":"p416"}]},{"t":"para","text":"现在呢，我将刚刚所有标记所有在50%回调处发生过转折的部分都显露出来。然后再拿掉。您很容易可以发现到，如果没有对等距运动的理解，没有对50%回答的理解，也不用上先前教过的所有知识的话。我们读图又如麻瓜，又如文盲一样。多少人看着一张图表，心想这不就是平淡无奇的走势吗？你跟我说有什么逐根读图的必要？多空哪那么多资讯给你分析都是过度解读，都是强行解读。我的主张是一点都不是。不读，读不出来，是因为懒惰与愚蠢。不好意思，讲的比较重的话。","pid":"p416"},{"t":"img","src":"assets/img/l10B_159.webp","ilabel":"10-16","icap":"L10　等距运动原理","fid":"fig159","ctx":[{"t":"现在呢，我将刚刚所有标记所有在50%回调处发生过转折的部分都显露出来。然后再拿掉。您很容易可以发现到，如果没有对等距运动的理解，没有对50%回答的理解，也不用上先前教过的所有知识的话。我们读图又如麻瓜，又如文盲一样。多少人看着一张图表，心想这不就是平淡无奇的走势吗？你跟我说有什么逐根读图的必要？多空哪那么多资讯给你分析都是过度解读，都是强行解读。我的主张是一点都不是。不读，读不出来，是因为懒惰与愚蠢。不好意思，讲的比较重的话。","p":"p416"},{"t":"但就如我们在第二单元讲过的，阿尔布鲁克斯总是说图表上有大量交易在发生。都是基于精密的数学逻辑在发生。所以假装那些K线不存在，不需要理解，是自欺欺人的行为。作为交易者，我们有义务去读懂，就算耗时，就算困难，这也是基础。","p":"p417"}]},{"t":"para","text":"但就如我们在第二单元讲过的，阿尔布鲁克斯总是说图表上有大量交易在发生。都是基于精密的数学逻辑在发生。所以假装那些K线不存在，不需要理解，是自欺欺人的行为。作为交易者，我们有义务去读懂，就算耗时，就算困难，这也是基础。","pid":"p417"},{"t":"img","src":"assets/img/l10B_160.webp","ilabel":"10-17","icap":"L10　等距运动原理","fid":"fig160","ctx":[{"t":"但就如我们在第二单元讲过的，阿尔布鲁克斯总是说图表上有大量交易在发生。都是基于精密的数学逻辑在发生。所以假装那些K线不存在，不需要理解，是自欺欺人的行为。作为交易者，我们有义务去读懂，就算耗时，就算困难，这也是基础。","p":"p417"},{"t":"那既然话都讲到这了，再来顺便文人相亲一下。其实如果你在交易的领域打滚过一阵子，也接触过不同交易学派的话，你会发现等距运动。50%回调其实在其他体系里也都有类似的影子。比如最基本，最古典的，大家说形态学。头肩顶，杯柄颈线突破后会走出等高的运动，对吧？你很可能听过类似的描述。不过，多数人只把它当做一个现象去描述，然后只要现象反复出现，对耶屡试不爽。那我就用吧。但背后的原理是什么呢？大家通常不在乎这些，只在乎有没有用，下次还能不能用。又或者费波那契交易者。斐波拉契交易者常常提到，并使用50%回调哦，认为回调到0.5处价格就可能折返。不过，严格说起来，0.5根本就不能算作一个斐波拉契数列。但不知道为什么，他们很把零点五当成自己人，跟0.618,0.382或者0.236,0.786,0.886之间的衍生数字掺在一起使用。不是说不能用，可以用的，刚刚我们已经展示过了，它的效力是很明确的。但对于这类交易者来说，他们的学理同样无法说明这种支撑阻力的画技方式为什么可用，原理在哪里,就只是用。翻亚当也是你可能听过，这是一种镜像映射的做法，他们很长在一段行情走出来之后。截下图片，先纵向翻一次对折横轴，再翻一次认为价格接下来会走到那个位置去。现在你应该已经看得很明白，要去解释背后的逻辑，其实就是AB=CD的道理。但你现在能这样从容的反应，是因为你已经经过这么长时间，对于数学，对于价值交易者和动能交易者的意图有所理解。才能够把这些现象通透的贯通起来。通常你去问这些亚当理论的交易者，为什么可以这样翻？原理是什么？同样不能收获能够在理性层次上说服你的答案。多数人更愿意只停在“发现现象”，“使用现象”的层次而非细究背后的原因。但是迈向卓越的路是孤独的。我希望你在乎这些原因，遇到不懂的，也有探究的精神。这么一来，当一个方法，你用起来觉得不顺手，甚至给你带来长期亏损的时候，你才能够透过分析，根据来得出。以后到底还能不能这样用的答案？学而不思则罔就是这个道理。你要避免这种危险。","p":"p418"}]},{"t":"para","text":"那既然话都讲到这了，再来顺便文人相亲一下。其实如果你在交易的领域打滚过一阵子，也接触过不同交易学派的话，你会发现等距运动。50%回调其实在其他体系里也都有类似的影子。比如最基本，最古典的，大家说形态学。头肩顶，杯柄颈线突破后会走出等高的运动，对吧？你很可能听过类似的描述。不过，多数人只把它当做一个现象去描述，然后只要现象反复出现，对耶屡试不爽。那我就用吧。但背后的原理是什么呢？大家通常不在乎这些，只在乎有没有用，下次还能不能用。又或者费波那契交易者。斐波拉契交易者常常提到，并使用50%回调哦，认为回调到0.5处价格就可能折返。不过，严格说起来，0.5根本就不能算作一个斐波拉契数列。但不知道为什么，他们很把零点五当成自己人，跟0.618,0.382或者0.236,0.786,0.886之间的衍生数字掺在一起使用。不是说不能用，可以用的，刚刚我们已经展示过了，它的效力是很明确的。但对于这类交易者来说，他们的学理同样无法说明这种支撑阻力的画技方式为什么可用，原理在哪里,就只是用。翻亚当也是你可能听过，这是一种镜像映射的做法，他们很长在一段行情走出来之后。截下图片，先纵向翻一次对折横轴，再翻一次认为价格接下来会走到那个位置去。现在你应该已经看得很明白，要去解释背后的逻辑，其实就是AB=CD的道理。但你现在能这样从容的反应，是因为你已经经过这么长时间，对于数学，对于价值交易者和动能交易者的意图有所理解。才能够把这些现象通透的贯通起来。通常你去问这些亚当理论的交易者，为什么可以这样翻？原理是什么？同样不能收获能够在理性层次上说服你的答案。多数人更愿意只停在“发现现象”，“使用现象”的层次而非细究背后的原因。但是迈向卓越的路是孤独的。我希望你在乎这些原因，遇到不懂的，也有探究的精神。这么一来，当一个方法，你用起来觉得不顺手，甚至给你带来长期亏损的时候，你才能够透过分析，根据来得出。以后到底还能不能这样用的答案？学而不思则罔就是这个道理。你要避免这种危险。","pid":"p418"},{"t":"img","src":"assets/img/l10B_161.webp","ilabel":"10-18","icap":"L10　等距运动原理","fid":"fig161","ctx":[{"t":"那既然话都讲到这了，再来顺便文人相亲一下。其实如果你在交易的领域打滚过一阵子，也接触过不同交易学派的话，你会发现等距运动。50%回调其实在其他体系里也都有类似的影子。比如最基本，最古典的，大家说形态学。头肩顶，杯柄颈线突破后会走出等高的运动，对吧？你很可能听过类似的描述。不过，多数人只把它当做一个现象去描述，然后只要现象反复出现，对耶屡试不爽。那我就用吧。但背后的原理是什么呢？大家通常不在乎这些，只在乎有没有用，下次还能不能用。又或者费波那契交易者。斐波拉契交易者常常提到，并使用50%回调哦，认为回调到0.5处价格就可能折返。不过，严格说起来，0.5根本就不能算作一个斐波拉契数列。但不知道为什么，他们很把零点五当成自己人，跟0.618,0.382或者0.236,0.786,0.886之间的衍生数字掺在一起使用。不是说不能用，可以用的，刚刚我们已经展示过了，它的效力是很明确的。但对于这类交易者来说，他们的学理同样无法说明这种支撑阻力的画技方式为什么可用，原理在哪里,就只是用。翻亚当也是你可能听过，这是一种镜像映射的做法，他们很长在一段行情走出来之后。截下图片，先纵向翻一次对折横轴，再翻一次认为价格接下来会走到那个位置去。现在你应该已经看得很明白，要去解释背后的逻辑，其实就是AB=CD的道理。但你现在能这样从容的反应，是因为你已经经过这么长时间，对于数学，对于价值交易者和动能交易者的意图有所理解。才能够把这些现象通透的贯通起来。通常你去问这些亚当理论的交易者，为什么可以这样翻？原理是什么？同样不能收获能够在理性层次上说服你的答案。多数人更愿意只停在“发现现象”，“使用现象”的层次而非细究背后的原因。但是迈向卓越的路是孤独的。我希望你在乎这些原因，遇到不懂的，也有探究的精神。这么一来，当一个方法，你用起来觉得不顺手，甚至给你带来长期亏损的时候，你才能够透过分析，根据来得出。以后到底还能不能这样用的答案？学而不思则罔就是这个道理。你要避免这种危险。","p":"p418"},{"t":"不好意思，苦口婆心的碎念了一下，我们还是回归正题，进行磁体的总整理与综合演练。现在你已经晓得使用的磁体有五大类。前波段高低点，区间上下缘，趋势线通道线，均线以及等距运动目标和50%回调。交易者可以透过在读图的时候辨识标记出这些潜在的转折点来，更清楚的跟上价格到底是怎么脉动的。多空到底竞争到哪了？现在是谁更占上风？不过是不是要全部都用上呢？是不是全部都要用来开仓呢？这就不见得个人有个人的做法。以我自己为例，我在实盘中说关注是五类都会关注。但要用来开仓，更多的是用上水平的磁体。那相对的均线大师或趋势线小能手也是大有人在，反正我先教，你也最好都学会。等到后面把交易方法也都学会，以后你可以再百里挑一，你可以再反复斟酌最顺手的武器。把基本功扎稳，发展风格来日方长。","p":"p419"}]},{"t":"para","text":"不好意思，苦口婆心的碎念了一下，我们还是回归正题，进行磁体的总整理与综合演练。现在你已经晓得使用的磁体有五大类。前波段高低点，区间上下缘，趋势线通道线，均线以及等距运动目标和50%回调。交易者可以透过在读图的时候辨识标记出这些潜在的转折点来，更清楚的跟上价格到底是怎么脉动的。多空到底竞争到哪了？现在是谁更占上风？不过是不是要全部都用上呢？是不是全部都要用来开仓呢？这就不见得个人有个人的做法。以我自己为例，我在实盘中说关注是五类都会关注。但要用来开仓，更多的是用上水平的磁体。那相对的均线大师或趋势线小能手也是大有人在，反正我先教，你也最好都学会。等到后面把交易方法也都学会，以后你可以再百里挑一，你可以再反复斟酌最顺手的武器。把基本功扎稳，发展风格来日方长。","pid":"p419"},{"t":"img","src":"assets/img/l10B_162.webp","ilabel":"10-19","icap":"L10　等距运动原理","fid":"fig162","ctx":[{"t":"不好意思，苦口婆心的碎念了一下，我们还是回归正题，进行磁体的总整理与综合演练。现在你已经晓得使用的磁体有五大类。前波段高低点，区间上下缘，趋势线通道线，均线以及等距运动目标和50%回调。交易者可以透过在读图的时候辨识标记出这些潜在的转折点来，更清楚的跟上价格到底是怎么脉动的。多空到底竞争到哪了？现在是谁更占上风？不过是不是要全部都用上呢？是不是全部都要用来开仓呢？这就不见得个人有个人的做法。以我自己为例，我在实盘中说关注是五类都会关注。但要用来开仓，更多的是用上水平的磁体。那相对的均线大师或趋势线小能手也是大有人在，反正我先教，你也最好都学会。等到后面把交易方法也都学会，以后你可以再百里挑一，你可以再反复斟酌最顺手的武器。把基本功扎稳，发展风格来日方长。","p":"p419"},{"t":"第一题，我们先牛刀小试一下，把K线都显露出来，确保你至少先具备事后分析的能力。价格由左到右逐根生成的过程中发生了什么呢？有哪些磁体发挥作用，使价格缓速或折返呢？这是我们现在所要练习思考，以及将来你看到任何一张图表都要反射性拆解的问题。在这个交易日的前几根K线里头，我们看到的是一根大阳线，然后收了一系列包覆在阳线内部的十字星。这是十足的区间，或说铁丝网表现。然后一根阴线生成，曾经试图突破阳线的高点，但失败了。于是随即反转向下，造成了有力的突破。所以显然阳线的高点起到了拦阻的作用，但低点却被穿透，区间被突破。这时候价格开始有所反弹的位置，这一方面重叠了均线，也一方面重叠了区间等距扩张的一比一运动目标。随后，价格在试图翻越到均线之上的过程中，开始走得相当纠结。多头当然想要扭转颓势，但空头好不容易发起急速，他们也想趁着均线可能提供阻抗的压力。进一步发展出向下的第二推。所以我们看到的是价格触及下跌的50%回调处后立即收了趋势阴线向下，然后演变成了某种复杂类似于头肩顶的形态。当然，这也是横向重叠严重的区间环境，因此当价格进一步下破，所要奔赴的目标，所要奔赴的磁体也是复合的。有50%回调启动下跌，突破原趋势极值之后，区间或受形态等距扩张。同时，完成AB=CD的等距运动。然后这两推结束之后，价格旋即收针。甚至这根阳线有比起前一根阴线的收盘价，稍微跳空高开的迹象，显示了多头的踊跃。然后就是一段上行在均线与趋势线处又遭到拦阻。不过，截断上升急速的是一根长下影线的阴线。仔细看就会发现影线止步的位置就正是这段上涨的50%回调处。多头之所以在此买进，应当是认为连续五根阳线的上涨动能还算不错。他们评估再回调到一半的位置入场。至少测试原趋势极值的可能性还是挺高的。而后续虽然又在均线遭到二次阻抗，对吧？还记得吗？我们前面说均线总是比较难以越过。但最终显然，空头的卖压不抵买压，于是一路还涨向上。前区的中点既是前方下跌的重要波段点，也是急速与通道组合的AB=CD等距运动目标。更是重叠这个通道线的位置。如果你已经忘记，在此再为大家复习一下。我们会在极值递进以后，回头确认重要波段点的位置。开盘区间低点成功下破以后，开盘区间高点就变成应该标记出来的价位。而第二个区间或说头肩顶下破以后，同样要回头确认回调高点的位置。现在价格就在这里暂停，可能是因为空头仍然认定上半天的下跌急速更强。在这里有望造就大型的双重顶，打压价格，进一步向下。以后见之明，看来虽然到了交易日结束的时刻，空头的努力最后是失败的。但你必须理解这个波段点之所以重要，之所以有买单聚集的原因。卖单还是发挥了一定的作用，至少下跌到了这根长下影线的低点。那这里为什么又有强劲的买盘介入呢？同样是复合的原因。这里既是上方区间下破之后的等距运动目标，也是截至目前为止整波上涨的50%回调处。多头看见自己在前面的上行中已经几乎要退回，空头上半天的所有努力，并且自反转后卖压如此疲弱。他们开始相信趋势倾向延续的加持，已经站在他们那边。因此，在50%回调处介入能有数学优势。而就这点起涨以来，交易者也不难发现，同样以AB=CD的逻辑，可以根据第二段通道上涨的高度。取两侧第三推上涨的可能目标。然后也别忘记开盘区间的高点也是重要波段点。行情发展到这多头，好不容易绝地反攻，今日高点也变成高几率被测试的强劲磁体。于是一到位，许多多头止盈离场又再一次造就了下跌。但均线仍然发挥了支撑的作用，就如今日下半日一样，每次价格试图向下穿越均线时。均线都提供了向上托起的抗力。后续价格就是震荡到收盘结束了，朴实无华又枯燥的一天。","p":"p420"}]},{"t":"para","text":"第一题，我们先牛刀小试一下，把K线都显露出来，确保你至少先具备事后分析的能力。价格由左到右逐根生成的过程中发生了什么呢？有哪些磁体发挥作用，使价格缓速或折返呢？这是我们现在所要练习思考，以及将来你看到任何一张图表都要反射性拆解的问题。在这个交易日的前几根K线里头，我们看到的是一根大阳线，然后收了一系列包覆在阳线内部的十字星。这是十足的区间，或说铁丝网表现。然后一根阴线生成，曾经试图突破阳线的高点，但失败了。于是随即反转向下，造成了有力的突破。所以显然阳线的高点起到了拦阻的作用，但低点却被穿透，区间被突破。这时候价格开始有所反弹的位置，这一方面重叠了均线，也一方面重叠了区间等距扩张的一比一运动目标。随后，价格在试图翻越到均线之上的过程中，开始走得相当纠结。多头当然想要扭转颓势，但空头好不容易发起急速，他们也想趁着均线可能提供阻抗的压力。进一步发展出向下的第二推。所以我们看到的是价格触及下跌的50%回调处后立即收了趋势阴线向下，然后演变成了某种复杂类似于头肩顶的形态。当然，这也是横向重叠严重的区间环境，因此当价格进一步下破，所要奔赴的目标，所要奔赴的磁体也是复合的。有50%回调启动下跌，突破原趋势极值之后，区间或受形态等距扩张。同时，完成AB=CD的等距运动。然后这两推结束之后，价格旋即收针。甚至这根阳线有比起前一根阴线的收盘价，稍微跳空高开的迹象，显示了多头的踊跃。然后就是一段上行在均线与趋势线处又遭到拦阻。不过，截断上升急速的是一根长下影线的阴线。仔细看就会发现影线止步的位置就正是这段上涨的50%回调处。多头之所以在此买进，应当是认为连续五根阳线的上涨动能还算不错。他们评估再回调到一半的位置入场。至少测试原趋势极值的可能性还是挺高的。而后续虽然又在均线遭到二次阻抗，对吧？还记得吗？我们前面说均线总是比较难以越过。但最终显然，空头的卖压不抵买压，于是一路还涨向上。前区的中点既是前方下跌的重要波段点，也是急速与通道组合的AB=CD等距运动目标。更是重叠这个通道线的位置。如果你已经忘记，在此再为大家复习一下。我们会在极值递进以后，回头确认重要波段点的位置。开盘区间低点成功下破以后，开盘区间高点就变成应该标记出来的价位。而第二个区间或说头肩顶下破以后，同样要回头确认回调高点的位置。现在价格就在这里暂停，可能是因为空头仍然认定上半天的下跌急速更强。在这里有望造就大型的双重顶，打压价格，进一步向下。以后见之明，看来虽然到了交易日结束的时刻，空头的努力最后是失败的。但你必须理解这个波段点之所以重要，之所以有买单聚集的原因。卖单还是发挥了一定的作用，至少下跌到了这根长下影线的低点。那这里为什么又有强劲的买盘介入呢？同样是复合的原因。
