"p314"}]},{"t":"para","text":"首先是剧烈的涨跌。用他本人的话来说，我们直接请他说好了就是。big up,big down,big confusion usually means trading range.一般情况下，我们更常认为一段强劲的上涨发起以后，接下来应该接续弱势的下跌调整。然后进一步发展出同样有力道的上行，对吧？但有时候交易者会遇到强劲上涨，居然马上接的是同样强劲的下跌，并感到惊讶。不晓得发生了什么。这种困惑的感受，正是区间的标志。也因此，区间内常常同时包含小型的上升趋势与下降趋势，但两者往往互相重叠，互相否定。没有持续太久的本钱。如果你回过神，发现怎么加入顺势都不对，不停被突然出现的逆势交易者给痛击，那你就应该意识到这可能正在区间当中。也正是因为区间具有强烈的双边交易性格，多空双方都愿意积极进场。你不难发现，在这上升趋势与下降趋势同时存在的环境里，必定100%同时存在合理的做多与做空建仓形态。","pid":"p314"},{"t":"img","src":"assets/img/l06x_082.webp","ilabel":"6-5","icap":"L06　区间 双边交易地带","fid":"fig82","ctx":[{"t":"首先是剧烈的涨跌。用他本人的话来说，我们直接请他说好了就是。big up,big down,big confusion usually means trading range.一般情况下，我们更常认为一段强劲的上涨发起以后，接下来应该接续弱势的下跌调整。然后进一步发展出同样有力道的上行，对吧？但有时候交易者会遇到强劲上涨，居然马上接的是同样强劲的下跌，并感到惊讶。不晓得发生了什么。这种困惑的感受，正是区间的标志。也因此，区间内常常同时包含小型的上升趋势与下降趋势，但两者往往互相重叠，互相否定。没有持续太久的本钱。如果你回过神，发现怎么加入顺势都不对，不停被突然出现的逆势交易者给痛击，那你就应该意识到这可能正在区间当中。也正是因为区间具有强烈的双边交易性格，多空双方都愿意积极进场。你不难发现，在这上升趋势与下降趋势同时存在的环境里，必定100%同时存在合理的做多与做空建仓形态。","p":"p314"},{"t":"以我们刚刚看的这张图表为例，不就是这样吗？存在骤涨与急坠，同时存在高低点不断抬升的上升趋势。以及高低点递进下降的下降趋势。并且到处都是做多与做空建仓形态。比如这里有个紧接在下降急速之后的双重顶。以及虽然是后面才会遭到，但这里存在急速与等距通道的反转建仓形态。过没多久，这里又出现楔形底。收出内包K线后，令人得以合理做多。而后多头急速拉升，接连创出长度可观的趋势阳线，在这里给到市价追进的急速建仓形态。却立即遭到反转。后面在区间下缘会出现宏观的双重底做多建仓形态。而后续基于这段上涨，所可能起到看涨作用的双重底牛旗，却没有引发强劲的延续走势。如果这是在趋势，通常建仓形态都只会朝向同一个方向。但在区间里，则是错综出现，又为一切增添了一些不确定的色彩。更雪上加霜的是，区间会让建仓形态的成功率改变。还记得先前在讲回调的时候，我们说回调为什么会启动吗？在回调启动以前，顺势交易者判定即刻入场。在行情反方向移动X点以前，先正向运行X点的几率高于60%。因而愿意并且是积极的，如此做以享有正向的期望。但随着趋势运行过远，想止盈的人多了，离对手可能涌现的位置也近了。这个原先在60%上下的胜率会下降到趋近50%，甚至过冲到低于50%的地方。随着大家逐渐发现到价格已经运行过度反向的运动就将启动。因为此时对逆势交易者来说，变成胜率高于60%，而顺势交易者自知理亏赶紧止盈退出。这么一来，价格就又渐次往50%修正。同样甚至可能过冲，再次变成对原趋势放有利。就这样，价格透过不断上下探测来围绕着均衡价格运动。为什么要再次向大家确认这个观念呢？是因为以上的道理暗示我们只要市场处于区间，只要市场正围绕着均衡价格晃荡。那就代表多空此时无论企图什么样的等距利润胜率都不会超过50%太远。当然，在均衡价格之上，空头做空的胜率会率高于50%，可能53。可能55。但随着价格折返，很快又会趋于公平。同样在中轴以下，对多头来说有些赚头。但无论如何不多，很难比急速上涨更加优沃。这就使得同样一个建仓形态，比如在急速运动中，以市价在趋势K线收线时追进为例好了。本来胜率应有60%，在一些极端的情况下，甚至可能高达65%，70%。但在区间内，绝对不会离50%太远，能有55%就要偷笑。这也是为什么在刚刚这个例子里，明明是这么强劲的阳线前，一根K线的力道也很强。市价追进却会伤痕累累。所有在区间内应当有60%胜率的建仓形态，却仅会剩下50%胜率。而那些乍想应该有40%胜率的建仓形态，比如这个在强劲阳线被向下突破时，立即做空。理应并不明智，这反而可能有50%胜率。区间很有趣吧，令人困惑，就是它的魅力之所在。虽然可能让习惯趋势交易的交易者痛苦万分。但也正是因为区间脉络窘然不同的性质好比在月球上人所受的月星引力，只有地球上的六分之一一样。让交易者们不禁感慨，市场真是奇妙，并且值得敬畏。于是顺着上面的话题，我要进一步谈区间脉络中常出现的一种走势，或者说值得引起你注意的机关。叫第二推陷阱。","p":"p315"}]},{"t":"para","text":"以我们刚刚看的这张图表为例，不就是这样吗？存在骤涨与急坠，同时存在高低点不断抬升的上升趋势。以及高低点递进下降的下降趋势。并且到处都是做多与做空建仓形态。比如这里有个紧接在下降急速之后的双重顶。以及虽然是后面才会遭到，但这里存在急速与等距通道的反转建仓形态。过没多久，这里又出现楔形底。收出内包K线后，令人得以合理做多。而后多头急速拉升，接连创出长度可观的趋势阳线，在这里给到市价追进的急速建仓形态。却立即遭到反转。后面在区间下缘会出现宏观的双重底做多建仓形态。而后续基于这段上涨，所可能起到看涨作用的双重底牛旗，却没有引发强劲的延续走势。如果这是在趋势，通常建仓形态都只会朝向同一个方向。但在区间里，则是错综出现，又为一切增添了一些不确定的色彩。更雪上加霜的是，区间会让建仓形态的成功率改变。还记得先前在讲回调的时候，我们说回调为什么会启动吗？在回调启动以前，顺势交易者判定即刻入场。在行情反方向移动X点以前，先正向运行X点的几率高于60%。因而愿意并且是积极的，如此做以享有正向的期望。但随着趋势运行过远，想止盈的人多了，离对手可能涌现的位置也近了。这个原先在60%上下的胜率会下降到趋近50%，甚至过冲到低于50%的地方。随着大家逐渐发现到价格已经运行过度反向的运动就将启动。因为此时对逆势交易者来说，变成胜率高于60%，而顺势交易者自知理亏赶紧止盈退出。这么一来，价格就又渐次往50%修正。同样甚至可能过冲，再次变成对原趋势放有利。就这样，价格透过不断上下探测来围绕着均衡价格运动。为什么要再次向大家确认这个观念呢？是因为以上的道理暗示我们只要市场处于区间，只要市场正围绕着均衡价格晃荡。那就代表多空此时无论企图什么样的等距利润胜率都不会超过50%太远。当然，在均衡价格之上，空头做空的胜率会率高于50%，可能53。可能55。但随着价格折返，很快又会趋于公平。同样在中轴以下，对多头来说有些赚头。但无论如何不多，很难比急速上涨更加优沃。这就使得同样一个建仓形态，比如在急速运动中，以市价在趋势K线收线时追进为例好了。本来胜率应有60%，在一些极端的情况下，甚至可能高达65%，70%。但在区间内，绝对不会离50%太远，能有55%就要偷笑。这也是为什么在刚刚这个例子里，明明是这么强劲的阳线前，一根K线的力道也很强。市价追进却会伤痕累累。所有在区间内应当有60%胜率的建仓形态，却仅会剩下50%胜率。而那些乍想应该有40%胜率的建仓形态，比如这个在强劲阳线被向下突破时，立即做空。理应并不明智，这反而可能有50%胜率。区间很有趣吧，令人困惑，就是它的魅力之所在。虽然可能让习惯趋势交易的交易者痛苦万分。但也正是因为区间脉络窘然不同的性质好比在月球上人所受的月星引力，只有地球上的六分之一一样。让交易者们不禁感慨，市场真是奇妙，并且值得敬畏。于是顺着上面的话题，我要进一步谈区间脉络中常出现的一种走势，或者说值得引起你注意的机关。叫第二推陷阱。","pid":"p315"},{"t":"img","src":"assets/img/l06x_083.webp","ilabel":"6-6","icap":"L06　区间 双边交易地带","fid":"fig83","ctx":[{"t":"以我们刚刚看的这张图表为例，不就是这样吗？存在骤涨与急坠，同时存在高低点不断抬升的上升趋势。以及高低点递进下降的下降趋势。并且到处都是做多与做空建仓形态。比如这里有个紧接在下降急速之后的双重顶。以及虽然是后面才会遭到，但这里存在急速与等距通道的反转建仓形态。过没多久，这里又出现楔形底。收出内包K线后，令人得以合理做多。而后多头急速拉升，接连创出长度可观的趋势阳线，在这里给到市价追进的急速建仓形态。却立即遭到反转。后面在区间下缘会出现宏观的双重底做多建仓形态。而后续基于这段上涨，所可能起到看涨作用的双重底牛旗，却没有引发强劲的延续走势。如果这是在趋势，通常建仓形态都只会朝向同一个方向。但在区间里，则是错综出现，又为一切增添了一些不确定的色彩。更雪上加霜的是，区间会让建仓形态的成功率改变。还记得先前在讲回调的时候，我们说回调为什么会启动吗？在回调启动以前，顺势交易者判定即刻入场。在行情反方向移动X点以前，先正向运行X点的几率高于60%。因而愿意并且是积极的，如此做以享有正向的期望。但随着趋势运行过远，想止盈的人多了，离对手可能涌现的位置也近了。这个原先在60%上下的胜率会下降到趋近50%，甚至过冲到低于50%的地方。随着大家逐渐发现到价格已经运行过度反向的运动就将启动。因为此时对逆势交易者来说，变成胜率高于60%，而顺势交易者自知理亏赶紧止盈退出。这么一来，价格就又渐次往50%修正。同样甚至可能过冲，再次变成对原趋势放有利。就这样，价格透过不断上下探测来围绕着均衡价格运动。为什么要再次向大家确认这个观念呢？是因为以上的道理暗示我们只要市场处于区间，只要市场正围绕着均衡价格晃荡。那就代表多空此时无论企图什么样的等距利润胜率都不会超过50%太远。当然，在均衡价格之上，空头做空的胜率会率高于50%，可能53。可能55。但随着价格折返，很快又会趋于公平。同样在中轴以下，对多头来说有些赚头。但无论如何不多，很难比急速上涨更加优沃。这就使得同样一个建仓形态，比如在急速运动中，以市价在趋势K线收线时追进为例好了。本来胜率应有60%，在一些极端的情况下，甚至可能高达65%，70%。但在区间内，绝对不会离50%太远，能有55%就要偷笑。这也是为什么在刚刚这个例子里，明明是这么强劲的阳线前，一根K线的力道也很强。市价追进却会伤痕累累。所有在区间内应当有60%胜率的建仓形态，却仅会剩下50%胜率。而那些乍想应该有40%胜率的建仓形态，比如这个在强劲阳线被向下突破时，立即做空。理应并不明智，这反而可能有50%胜率。区间很有趣吧，令人困惑，就是它的魅力之所在。虽然可能让习惯趋势交易的交易者痛苦万分。但也正是因为区间脉络窘然不同的性质好比在月球上人所受的月星引力，只有地球上的六分之一一样。让交易者们不禁感慨，市场真是奇妙，并且值得敬畏。于是顺着上面的话题，我要进一步谈区间脉络中常出现的一种走势，或者说值得引起你注意的机关。叫第二推陷阱。","p":"p315"},{"t":"何谓第二推陷阱。这在我们突破的单元时，有稍稍提过。正式说起来就是第一推完成后，紧接动能看起来更强劲的第二推，让交易者认为价格就要出脱区间，但最后并没有旋即折返。同样以刚刚的图表进行举例，我把它稍微压扁一点，希望你不要认不出来。中间有过一段，发起自区间底部的上涨，对吧？后来发生回调，并紧接看起来非常强劲的第二推，动能更流畅，斜率也更陡。正是在这根阳线收出之后，我们讨论到，这里如果不是处于区间内，将非常有市价追进的价值。只可惜在这里只能以止损作结。这个第二推更加强劲的突破假象，就是第二推陷阱。时常会套住新手交易者，并且他们还不晓得发生什么事，只得怨叹市场在整他们。事实上，市场无意针对你，这是自然而然的现象。","p":"p316"}]},{"t":"para","text":"何谓第二推陷阱。这在我们突破的单元时，有稍稍提过。正式说起来就是第一推完成后，紧接动能看起来更强劲的第二推，让交易者认为价格就要出脱区间，但最后并没有旋即折返。同样以刚刚的图表进行举例，我把它稍微压扁一点，希望你不要认不出来。中间有过一段，发起自区间底部的上涨，对吧？后来发生回调，并紧接看起来非常强劲的第二推，动能更流畅，斜率也更陡。正是在这根阳线收出之后，我们讨论到，这里如果不是处于区间内，将非常有市价追进的价值。只可惜在这里只能以止损作结。这个第二推更加强劲的突破假象，就是第二推陷阱。时常会套住新手交易者，并且他们还不晓得发生什么事，只得怨叹市场在整他们。事实上，市场无意针对你，这是自然而然的现象。","pid":"p316"},{"t":"img","src":"assets/img/l06x_084.webp","ilabel":"6-7","icap":"L06　区间 双边交易地带","fid":"fig84","ctx":[{"t":"何谓第二推陷阱。这在我们突破的单元时，有稍稍提过。正式说起来就是第一推完成后，紧接动能看起来更强劲的第二推，让交易者认为价格就要出脱区间，但最后并没有旋即折返。同样以刚刚的图表进行举例，我把它稍微压扁一点，希望你不要认不出来。中间有过一段，发起自区间底部的上涨，对吧？后来发生回调，并紧接看起来非常强劲的第二推，动能更流畅，斜率也更陡。正是在这根阳线收出之后，我们讨论到，这里如果不是处于区间内，将非常有市价追进的价值。只可惜在这里只能以止损作结。这个第二推更加强劲的突破假象，就是第二推陷阱。时常会套住新手交易者，并且他们还不晓得发生什么事，只得怨叹市场在整他们。事实上，市场无意针对你，这是自然而然的现象。","p":"p316"},{"t":"谈及区间，请别忘记价格是围绕公平的，均衡的中轴晃荡。因此，在区间突破以前，越是向上远离中轴做空的胜率会越高。反之，在真正离开区间以前，越是向下远离中轴，则越有利于多头。或者换句话说，区间上缘有个可能清晰，可能模糊存在的阻力。它提醒了所有交易者。在此处，价格过于昂贵了，应该修正。于是多头会在这附近开始止盈，而空头则开始建仓。另一方面，区间下缘作为支撑，则代表价格过于低廉，空头也选择止盈买回他们卖出的空单。而多头也以着划算的价格买进，等待上涨之后出脱仓位。于是当你看到很强的阳线向上逼近区间边线，毕竟可能吸引多空卖出的波段点，你就要心有戒备。这到底是大家真的超级踊跃买进，准备好要突破区间，向高处寻找新的均衡价格了。还是只是因为大家都等着在高处卖出，所以中间没有人要提早卖出，导致近几真空的高潮运动。在区间内，通常是后者，这正是第二推陷阱的由来。","p":"p317"}]},{"t":"para","text":"谈及区间，请别忘记价格是围绕公平的，均衡的中轴晃荡。因此，在区间突破以前，越是向上远离中轴做空的胜率会越高。反之，在真正离开区间以前，越是向下远离中轴，则越有利于多头。或者换句话说，区间上缘有个可能清晰，可能模糊存在的阻力。它提醒了所有交易者。在此处，价格过于昂贵了，应该修正。于是多头会在这附近开始止盈，而空头则开始建仓。另一方面，区间下缘作为支撑，则代表价格过于低廉，空头也选择止盈买回他们卖出的空单。而多头也以着划算的价格买进，等待上涨之后出脱仓位。于是当你看到很强的阳线向上逼近区间边线，毕竟可能吸引多空卖出的波段点，你就要心有戒备。这到底是大家真的超级踊跃买进，准备好要突破区间，向高处寻找新的均衡价格了。还是只是因为大家都等着在高处卖出，所以中间没有人要提早卖出，导致近几真空的高潮运动。在区间内，通常是后者，这正是第二推陷阱的由来。","pid":"p317"},{"t":"img","src":"assets/img/l06x_085.webp","ilabel":"6-8","icap":"L06　区间 双边交易地带","fid":"fig85","ctx":[{"t":"谈及区间，请别忘记价格是围绕公平的，均衡的中轴晃荡。因此，在区间突破以前，越是向上远离中轴做空的胜率会越高。反之，在真正离开区间以前，越是向下远离中轴，则越有利于多头。或者换句话说，区间上缘有个可能清晰，可能模糊存在的阻力。它提醒了所有交易者。在此处，价格过于昂贵了，应该修正。于是多头会在这附近开始止盈，而空头则开始建仓。另一方面，区间下缘作为支撑，则代表价格过于低廉，空头也选择止盈买回他们卖出的空单。而多头也以着划算的价格买进，等待上涨之后出脱仓位。于是当你看到很强的阳线向上逼近区间边线，毕竟可能吸引多空卖出的波段点，你就要心有戒备。这到底是大家真的超级踊跃买进，准备好要突破区间，向高处寻找新的均衡价格了。还是只是因为大家都等着在高处卖出，所以中间没有人要提早卖出，导致近几真空的高潮运动。在区间内，通常是后者，这正是第二推陷阱的由来。","p":"p317"},{"t":"那除了刹停在边线附近的突破尝试，你当然也可以偶尔看到突破以后还有跟进。不过最后仍然又重回区间内部的例子。当然，这有点令人烦躁，市场中满是难以规律化的不确定性，但这确实也是区间的正常表现。就如我们先前不断强调过的区间倾向突破失败。这是因为市场喜欢均衡，使得区间带有磁性。这样的磁性时常会牵引着价格，又重回这个多空胜率，不偏离50%太远的地带。","p":"p318"}]},{"t":"para","text":"那除了刹停在边线附近的突破尝试，你当然也可以偶尔看到突破以后还有跟进。不过最后仍然又重回区间内部的例子。当然，这有点令人烦躁，市场中满是难以规律化的不确定性，但这确实也是区间的正常表现。就如我们先前不断强调过的区间倾向突破失败。这是因为市场喜欢均衡，使得区间带有磁性。这样的磁性时常会牵引着价格，又重回这个多空胜率，不偏离50%太远的地带。","pid":"p318"},{"t":"img","src":"assets/img/l06x_086.webp","ilabel":"6-9","icap":"L06　区间 双边交易地带","fid":"fig86","ctx":[{"t":"那除了刹停在边线附近的突破尝试，你当然也可以偶尔看到突破以后还有跟进。不过最后仍然又重回区间内部的例子。当然，这有点令人烦躁，市场中满是难以规律化的不确定性，但这确实也是区间的正常表现。就如我们先前不断强调过的区间倾向突破失败。这是因为市场喜欢均衡，使得区间带有磁性。这样的磁性时常会牵引着价格，又重回这个多空胜率，不偏离50%太远的地带。","p":"p318"},{"t":"在趋势的末尾，我们常常可以看见一次对回调，对区间的失败突破尝试，最终导致了剧烈的反转。用正式的名称指称它的话这叫做末端旗型。也就是趋势末端的引发衰竭突破的最后一个无法成功延续趋势的旗型。它作用的基础正是区间所带有的磁力。不时能看见的扩张三角或者菱形顶底，也与区间的磁力作用有关。我们可以来思考一下它们形成的具体过程。扩张三角不外乎是这样的，价格先以宽度比较有限的区间进行横向运动。但随着对上下缘不断突破，失败区间的边线也逐渐扩张，直到呈现了开放的外观。那么，要是在扩张以后多空又再次缩小了他们的共识。也就是说，他们逐渐更明确知道均衡在何处了，于是开始围绕公平价格进行更紧密的交投。那区间的范畴就又会缩小菱形的外观，也就如烟成形。你甚至不难发现，右半边就是收敛三角的形成过程，它可以独立于左半边自己存在。而任何一种区间的形式，都可以被存在双边交易所描述。内部也不时存在第二推陷阱。而以上突破后又不断折返回来的运动过程，就是区间磁力的展现，也是市场爱好均衡的证据。","p":"p319"}]},{"t":"para","text":"在趋势的末尾，我们常常可以看见一次对回调，对区间的失败突破尝试，最终导致了剧烈的反转。用正式的名称指称它的话这叫做末端旗型。也就是趋势末端的引发衰竭突破的最后一个无法成功延续趋势的旗型。它作用的基础正是区间所带有的磁力。不时能看见的扩张三角或者菱形顶底，也与区间的磁力作用有关。我们可以来思考一下它们形成的具体过程。扩张三角不外乎是这样的，价格先以宽度比较有限的区间进行横向运动。但随着对上下缘不断突破，失败区间的边线也逐渐扩张，直到呈现了开放的外观。那么，要是在扩张以后多空又再次缩小了他们的共识。也就是说，他们逐渐更明确知道均衡在何处了，于是开始围绕公平价格进行更紧密的交投。那区间的范畴就又会缩小菱形的外观，也就如烟成形。你甚至不难发现，右半边就是收敛三角的形成过程，它可以独立于左半边自己存在。而任何一种区间的形式，都可以被存在双边交易所描述。内部也不时存在第二推陷阱。而以上突破后又不断折返回来的运动过程，就是区间磁力的展现，也是市场爱好均衡的证据。","pid":"p319"},{"t":"img","src":"assets/img/l06x_087.webp","ilabel":"6-10","icap":"L06　区间 双边交易地带","fid":"fig87","ctx":[{"t":"在趋势的末尾，我们常常可以看见一次对回调，对区间的失败突破尝试，最终导致了剧烈的反转。用正式的名称指称它的话这叫做末端旗型。也就是趋势末端的引发衰竭突破的最后一个无法成功延续趋势的旗型。它作用的基础正是区间所带有的磁力。不时能看见的扩张三角或者菱形顶底，也与区间的磁力作用有关。我们可以来思考一下它们形成的具体过程。扩张三角不外乎是这样的，价格先以宽度比较有限的区间进行横向运动。但随着对上下缘不断突破，失败区间的边线也逐渐扩张，直到呈现了开放的外观。那么，要是在扩张以后多空又再次缩小了他们的共识。也就是说，他们逐渐更明确知道均衡在何处了，于是开始围绕公平价格进行更紧密的交投。那区间的范畴就又会缩小菱形的外观，也就如烟成形。你甚至不难发现，右半边就是收敛三角的形成过程，它可以独立于左半边自己存在。而任何一种区间的形式，都可以被存在双边交易所描述。内部也不时存在第二推陷阱。而以上突破后又不断折返回来的运动过程，就是区间磁力的展现，也是市场爱好均衡的证据。","p":"p319"},{"t":"好，接着我们进到这一节的最后部分，谈谈另一种更难搞，但同时非常常见的区间形式。目前为止，我们谈到的区间，无论是嵌于趋势中的持续太久的回调，还是规模更大一点。也许涵盖整张图表的大型区间，它都有一定的体积，一定的高度。至少我们不难想象，能够在其中找到合理的建仓形态。即使看上去比起干净流畅的趋势脉络来了棘手，也肯定有不少厉害的机构交易者能够在其中找到大量盈利的方法。不过有一种区间，它实在是太小了，小到我们难以想象，可以在里头以买低卖高的方式赚取剥头皮利润。这种高度非常局限的区间，我们称它为窄幅区间。或者更形象一点，我们也可以称它为铁丝网。","p":"p320"}]},{"t":"para","text":"好，接着我们进到这一节的最后部分，谈谈另一种更难搞，但同时非常常见的区间形式。目前为止，我们谈到的区间，无论是嵌于趋势中的持续太久的回调，还是规模更大一点。也许涵盖整张图表的大型区间，它都有一定的体积，一定的高度。至少我们不难想象，能够在其中找到合理的建仓形态。即使看上去比起干净流畅的趋势脉络来了棘手，也肯定有不少厉害的机构交易者能够在其中找到大量盈利的方法。不过有一种区间，它实在是太小了，小到我们难以想象，可以在里头以买低卖高的方式赚取剥头皮利润。这种高度非常局限的区间，我们称它为窄幅区间。或者更形象一点，我们也可以称它为铁丝网。","pid":"p320"},{"t":"img","src":"assets/img/l06x_088.webp","ilabel":"6-11","icap":"L06　区间 双边交易地带","fid":"fig88","ctx":[{"t":"好，接着我们进到这一节的最后部分，谈谈另一种更难搞，但同时非常常见的区间形式。目前为止，我们谈到的区间，无论是嵌于趋势中的持续太久的回调，还是规模更大一点。也许涵盖整张图表的大型区间，它都有一定的体积，一定的高度。至少我们不难想象，能够在其中找到合理的建仓形态。即使看上去比起干净流畅的趋势脉络来了棘手，也肯定有不少厉害的机构交易者能够在其中找到大量盈利的方法。不过有一种区间，它实在是太小了，小到我们难以想象，可以在里头以买低卖高的方式赚取剥头皮利润。这种高度非常局限的区间，我们称它为窄幅区间。或者更形象一点，我们也可以称它为铁丝网。","p":"p320"},{"t":"画面上的例子就是窄幅区间的典型样态。诶、顺道复习一下，这是一轮上升的趋势，并开始回调哦。而你一定还记得，这种细碎又微弱，但超过20根K线莫名走的很远的，就是无尽回调。窄幅区间常常是无尽回调的某个组成部分。如果先撇出任何一个窄幅区间，所处的脉络不看的话，让市场陷入窄幅区间，那就代表多空在区间存续的时间之内。没有任何一方能够占有优势。反过来说，如果任何一方有能力控制行情，那市场就不会陷入窄幅区间。这个谁也不能赢过对方的局势，可以持续很短的时间，只有四根五根K线。但当然也可以让你觉得海枯石烂，11根16根更久也可以。而它要结束，就必然是有一方在这轮缠斗之中，把资金耗尽了，无法再透过建立仓位来拦阻对手的进去。那么，他的对手方就会开始占据上风，造就突破。值得提醒的是，千万别被它不起眼的外观给骗了，以为里头没有事情在发生。实际上，多空在窄幅区间中的交投既不清淡，也不随机，不仅每根K线的成交量都其实很可观。参与者也都是极其聪明的高频交易机构。那这些精密机构在里面干嘛呢？他们要赚取什么东西？由于区间幅度很小，他们可能只争取一到三个最小报价单位的利润。但可惜这不是我们可以摄入的世界。之所以这些机构能赚这种钱。除了是因为他们的速度优势非常好，能够在极低延迟的情况下准确执行订单。更多的是因为他们享有某种个体交易者无法禁用的优势。比如它跟交易所有某种合作关系，我作为做市商提供流动性给你的交易场所。而你交易所则给我相当的手续费折免。甚至是你还额外贴钱，请我在这里运行高频订单，提供市场深度。那在这样可以免除滑点，免除手续费等摩擦成本的优势之下，某些过得了这些门槛的高频交易机构。确实可能在窄幅区间中透过，争取仅仅一个最小爆炸单位的利润来长期盈利。但我们没有办法，就别想了。而就算就算我们能找到再宽一点点的区间，比如这个14个最小报价单位高度的好了。扣除手续费还能有毛血般的获利，那我也仍然不建议正在学习的你去尝试。这种交易环境的容错率低，并且可能让你栽在滑点上。就算都没有这些问题，交易起来也实在是又枯燥，又没有什么肥沃的利润可图，实在不止你去辛苦参与。这也就是说，交易者应该近铁丝网而远之，去做盈利空间更大的建仓形态。区间倾向突破失败，在这样的情况下进行突破交易，多半将伤痕累累。看到窄幅区间，交易者还是应该等待强劲突破发生后确定多空已经表态以后再去寻找顺势交易机会，会更加明智。这时候你心想我知道区间倾向突破失败，也认同窄幅区间里头多空都未能占据绝对优势。不过，阿尔布鲁克斯不是说判断脉络非常重要吗？如果前头有还不错的趋势性运行，而窄幅区间只是横向的调整，那我是不是可以认定？之后朝向原趋势方向进行突破的几率还是稍微更大一点。诶，没错，这个观点非常好。我们说趋势倾向延续，而区间倾向突破失败，这种又有趋势又有区间的复合行情。简直就是矛盾大对决。于是，结合以上观点，我们可以保守的这样说，现在趋势中的窄幅区间约有51%到55%的几率延续趋势。只不过也很难再更高了，否则就不会形成窄幅区间。如果几率更高，调整应该更快结束，顺势方应该更有效的展现动能。所以将来你在型塑交易规则的阶段，如果坚持要介入迁移趋势中的窄幅区间。那仅有胜率不会太高的心理准备。尤其当窄幅区间持续越久，趋势恢复的几率也就更低。同时你也别忘了，刚刚我们提过的区间具有磁力的这个观念。很多时候，嵌于趋势中的窄幅区间会演变为趋势末尾的末端旗型，导致顺势突破失败，并甚至引发反转。最保险的做法，而我个人也奉为圭聂，阿尔布鲁克斯，也不断强调的是窄幅区间优于一切。只要市场陷入窄幅区间，你原本以为自己拥有的交易优势就都将消退。价格朝任何一个方向突破的几率永远不会高于55%。一旦看到铁丝网，如果你还未持仓，那你在窄幅区间结束以前最好什么事也别做。可如果你已经持仓，则最佳选择是尽快寻求盈亏，平衡离场的机会。交易者所应该做的是专注于最好的建仓形态，并避免那些最差的。窄幅区间就是最差的是交易者获利的最大阻碍。在外观望肯定是更加明智的选择。","p":"p321"}]},{"t":"para","text":"画面上的例子就是窄幅区间的典型样态。诶、顺道复习一下，这是一轮上升的趋势，并开始回调哦。而你一定还记得，这种细碎又微弱，但超过20根K线莫名走的很远的，就是无尽回调。窄幅区间常常是无尽回调的某个组成部分。如果先撇出任何一个窄幅区间，所处的脉络不看的话，让市场陷入窄幅区间，那就代表多空在区间存续的时间之内。没有任何一方能够占有优势。反过来说，如果任何一方有能力控制行情，那市场就不会陷入窄幅区间。这个谁也不能赢过对方的局势，可以持续很短的时间，只有四根五根K线。但当然也可以让你觉得海枯石烂，11根16根更久也可以。而它要结束，就必然是有一方在这轮缠斗之中，把资金耗尽了，无法再透过建立仓位来拦阻对手的进去。那么，他的对手方就会开始占据上风，造就突破。值得提醒的是，千万别被它不起眼的外观给骗了，以为里头没有事情在发生。实际上，多空在窄幅区间中的交投既不清淡，也不随机，不仅每根K线的成交量都其实很可观。参与者也都是极其聪明的高频交易机构。那这些精密机构在里面干嘛呢？他们要赚取什么东西？由于区间幅度很小，他们可能只争取一到三个最小报价单位的利润。但可惜这不是我们可以摄入的世界。之所以这些机构能赚这种钱。除了是因为他们的速度优势非常好，能够在极低延迟的情况下准确执行订单。更多的是因为他们享有某种个体交易者无法禁用的优势。比如它跟交易所有某种合作关系，我作为做市商提供流动性给你的交易场所。而你交易所则给我相当的手续费折免。甚至是你还额外贴钱，请我在这里运行高频订单，提供市场深度。那在这样可以免除滑点，免除手续费等摩擦成本的优势之下，某些过得了这些门槛的高频交易机构。确实可能在窄幅区间中透过，争取仅仅一个最小爆炸单位的利润来长期盈利。但我们没有办法，就别想了。而就算就算我们能找到再宽一点点的区间，比如这个14个最小报价单位高度的好了。扣除手续费还能有毛血般的获利，那我也仍然不建议正在学习的你去尝试。这种交易环境的容错率低，并且可能让你栽在滑点上。就算都没有这些问题，交易起来也实在是又枯燥，又没有什么肥沃的利润可图，实在不止你去辛苦参与。这也就是说，交易者应该近铁丝网而远之，去做盈利空间更大的建仓形态。区间倾向突破失败，在这样的情况下进行突破交易，多半将伤痕累累。看到窄幅区间，交易者还是应该等待强劲突破发生后确定多空已经表态以后再去寻找顺势交易机会，会更加明智。这时候你心想我知道区间倾向突破失败，也认同窄幅区间里头多空都未能占据绝对优势。不过，阿尔布鲁克斯不是说判断脉络非常重要吗？如果前头有还不错的趋势性运行，而窄幅区间只是横向的调整，那我是不是可以认定？之后朝向原趋势方向进行突破的几率还是稍微更大一点。诶，没错，这个观点非常好。我们说趋势倾向延续，而区间倾向突破失败，这种又有趋势又有区间的复合行情。简直就是矛盾大对决。于是，结合以上观点，我们可以保守的这样说，现在趋势中的窄幅区间约有51%到55%的几率延续趋势。只不过也很难再更高了，否则就不会形成窄幅区间。如果几率更高，调整应该更快结束，顺势方应该更有效的展现动能。所以将来你在型塑交易规则的阶段，如果坚持要介入迁移趋势中的窄幅区间。那仅有胜率不会太高的心理准备。尤其当窄幅区间持续越久，趋势恢复的几率也就更低。同时你也别忘了，刚刚我们提过的区间具有磁力的这个观念。很多时候，嵌于趋势中的窄幅区间会演变为趋势末尾的末端旗型，导致顺势突破失败，并甚至引发反转。最保险的做法，而我个人也奉为圭聂，阿尔布鲁克斯，也不断强调的是窄幅区间优于一切。只要市场陷入窄幅区间，你原本以为自己拥有的交易优势就都将消退。价格朝任何一个方向突破的几率永远不会高于55%。一旦看到铁丝网，如果你还未持仓，那你在窄幅区间结束以前最好什么事也别做。可如果你已经持仓，则最佳选择是尽快寻求盈亏，平衡离场的机会。交易者所应该做的是专注于最好的建仓形态，并避免那些最差的。窄幅区间就是最差的是交易者获利的最大阻碍。在外观望肯定是更加明智的选择。","pid":"p321"},{"t":"img","src":"assets/img/l06x_089.webp","ilabel":"6-12","icap":"L06　区间 双边交易地带","fid":"fig89","ctx":[{"t":"画面上的例子就是窄幅区间的典型样态。诶、顺道复习一下，这是一轮上升的趋势，并开始回调哦。而你一定还记得，这种细碎又微弱，但超过20根K线莫名走的很远的，就是无尽回调。窄幅区间常常是无尽回调的某个组成部分。如果先撇出任何一个窄幅区间，所处的脉络不看的话，让市场陷入窄幅区间，那就代表多空在区间存续的时间之内。没有任何一方能够占有优势。反过来说，如果任何一方有能力控制行情，那市场 的上升与下降的趋势性运动。另外，这三组显然是一次又一次的第二推陷阱，快速逼近边线，却没有后续，立即被逆时方压过。再来，虽然边线好像有屡屡扩张成扩张三角的样子，但终究倾向突破失败。价格还是归附均衡附近。另一方面，不久前才提到铁丝网，在这里头也很常出现，并且它们会扭曲原先的运动脉络，可能能够提供的优势。像是这边急速的下坠，收出光脚阴线，不免让人怀疑是否会有后续，若非陷入铁丝网。原本空头的胜率可能超过50%。但在这里，却是立即向上突破，刚刚铁丝网内部的三次向下突破尝试全部宣告失败。后面三处也都有同样密集重叠的窄幅区间。虽然前两者起到了延续之前趋势性运动的作用，但最后一个则没有成为了末端旗型。引出了衰竭的最后一跌。当然，这里的反转上涨可以被认为是外部这个大型区间的下缘，起到了支撑的作用。但铁丝网的磁力也不容小觑，空头要同时出托这个小区间和大区间绝对不是容易的事。而纵观整张图表，价格确实就是围绕着中轴晃荡，我们也因此可以说这里是市场所喜爱的均衡地带。","p":"p322"}]},{"t":"para","text":"我们试着找一个例子来复习，今天讲到的所有概念。在画面上，你看到的是一个宽幅的区间，内部有多次对区间变线的突破尝试。但似乎即使到了画面的最右侧，也依然没有出脱这个区域。在后面的K线还没显现，以前这显然是个对前方上升急速的一次下降回调。回调结束后，陷入横向的重叠铁丝网接着走出朝向上的窄幅通道。这个通道尝试测试原趋势极值，但未能触及那个应该触碰到的高点，就开始下落。下跌则是一组二推的急速接急速运动。但一样没能有效越过铁丝网的低点，就开始拉伸。这个时候我们就大概会舍弃多头趋势还能延续的观点了，此处有向上的突破失败，也有向下的突破失败。并且回调以来的K线数量早已超过20根，上下涨跌的轨迹也很凌厉。这更像是一个区间，只有区间会向下还是向上突破，并无法在这个时候去推测。突破的时间也未知，只知道有更高的几率在边线附近折返。后面也确实如此，横盘调整一下以后，终于向上触到前波段高点，但旋即没有跟进，反转上下。陷入另一个铁丝网整理后，空头又进一步下跌，接近区间下缘，却又再次开始横向排列。最后有一次对铁丝网对整体区间下缘的突破尝试，但同样失败。马上又是连续性良好的多头窄幅通道上涨。定睛细看的话，所有前述的区间特征都在里头了。比如说拆开看的话，内部有不少明确的上升与下降的趋势性运动。另外，这三组显然是一次又一次的第二推陷阱，快速逼近边线，却没有后续，立即被逆时方压过。再来，虽然边线好像有屡屡扩张成扩张三角的样子，但终究倾向突破失败。价格还是归附均衡附近。另一方面，不久前才提到铁丝网，在这里头也很常出现，并且它们会扭曲原先的运动脉络，可能能够提供的优势。像是这边急速的下坠，收出光脚阴线，不免让人怀疑是否会有后续，若非陷入铁丝网。原本空头的胜率可能超过50%。但在这里，却是立即向上突破，刚刚铁丝网内部的三次向下突破尝试全部宣告失败。后面三处也都有同样密集重叠的窄幅区间。虽然前两者起到了延续之前趋势性运动的作用，但最后一个则没有成为了末端旗型。引出了衰竭的最后一跌。当然，这里的反转上涨可以被认为是外部这个大型区间的下缘，起到了支撑的作用。但铁丝网的磁力也不容小觑，空头要同时出托这个小区间和大区间绝对不是容易的事。而纵观整张图表，价格确实就是围绕着中轴晃荡，我们也因此可以说这里是市场所喜爱的均衡地带。","pid":"p322"},{"t":"img","src":"assets/img/l06x_090.webp","ilabel":"6-13","icap":"L06　区间 双边交易地带","fid":"fig90","ctx":[{"t":"我们试着找一个例子来复习，今天讲到的所有概念。在画面上，你看到的是一个宽幅的区间，内部有多次对区间变线的突破尝试。但似乎即使到了画面的最右侧，也依然没有出脱这个区域。在后面的K线还没显现，以前这显然是个对前方上升急速的一次下降回调。回调结束后，陷入横向的重叠铁丝网接着走出朝向上的窄幅通道。这个通道尝试测试原趋势极值，但未能触及那个应该触碰到的高点，就开始下落。下跌则是一组二推的急速接急速运动。但一样没能有效越过铁丝网的低点，就开始拉伸。这个时候我们就大概会舍弃多头趋势还能延续的观点了，此处有向上的突破失败，也有向下的突破失败。并且回调以来的K线数量早已超过20根，上下涨跌的轨迹也很凌厉。这更像是一个区间，只有区间会向下还是向上突破，并无法在这个时候去推测。突破的时间也未知，只知道有更高的几率在边线附近折返。后面也确实如此，横盘调整一下以后，终于向上触到前波段高点，但旋即没有跟进，反转上下。陷入另一个铁丝网整理后，空头又进一步下跌，接近区间下缘，却又再次开始横向排列。最后有一次对铁丝网对整体区间下缘的突破尝试，但同样失败。马上又是连续性良好的多头窄幅通道上涨。定睛细看的话，所有前述的区间特征都在里头了。比如说拆开看的话，内部有不少明确的上升与下降的趋势性运动。另外，这三组显然是一次又一次的第二推陷阱，快速逼近边线，却没有后续，立即被逆时方压过。再来，虽然边线好像有屡屡扩张成扩张三角的样子，但终究倾向突破失败。价格还是归附均衡附近。另一方面，不久前才提到铁丝网，在这里头也很常出现，并且它们会扭曲原先的运动脉络，可能能够提供的优势。像是这边急速的下坠，收出光脚阴线，不免让人怀疑是否会有后续，若非陷入铁丝网。原本空头的胜率可能超过50%。但在这里，却是立即向上突破，刚刚铁丝网内部的三次向下突破尝试全部宣告失败。后面三处也都有同样密集重叠的窄幅区间。虽然前两者起到了延续之前趋势性运动的作用，但最后一个则没有成为了末端旗型。引出了衰竭的最后一跌。当然，这里的反转上涨可以被认为是外部这个大型区间的下缘，起到了支撑的作用。但铁丝网的磁力也不容小觑，空头要同时出托这个小区间和大区间绝对不是容易的事。而纵观整张图表，价格确实就是围绕着中轴晃荡，我们也因此可以说这里是市场所喜爱的均衡地带。","p":"p322"},{"t":"再次来到单元尾声来做一下整理，也同时再加强一下与前面单元的连接。说过很多次了，市场有80%的时间都处在大大小小的区间状态中。但由于似乎换了更多篇幅，在讨论失衡也就是关于突破的行情应该如何理解。也许会让你产生一种区间不重要或不常见的印象，但并不是这样的。急速之所以启动，就是为了去找到均衡。一旦找到均衡，急速就可以停止。然后多空就在他们共事为甜蜜的区间里上下交投。并且也因为均衡的区间就是多空所要寻找的终点。所以其实进入区间也不尽然，接着进行反转。区间就是区间，均衡就是均衡，下一次的多空共识要将新的均衡决定在何处？以及何时出发去寻找，行进的路线，是笔直还是曲折，这都并不一定。作为交易者，要知道大家津津乐道的大涨大跌，那些突破与反转虽然能够带来可观的利润。但不是天天发生的。你必须学会与均衡共处，并熟悉以上讲到的所有区间，令人困惑甚至讨厌的特质。你才能够在市场里自在的着落。截取上个单元回调，我们讲到的回调启动就是逆势订单的介入。但如果逆势订单作用以后，原本的趋势方还有捍卫趋势的意愿，那价格就会悬停一下，准备等待出方向。同样以上升趋势为例，你不难想象，上升突破发起以后，回调就是短暂的回落。然后多头再次出手，终止了下跌。不过，他们接下来会多有气力，这不一定。突破的单元，我们说第一推后，还有第二推，测试的单元，我们又说这个第二推可以只测试到第一推极值。因此，如果多头不够努力，无法创造新的突破循环，那回调就可能持续的更久。甚至因为持续的时间太漫长而成为区间。区间我们说，对于日内交易来说，嵌于趋势中的回调只要超过20根K线，就会成为区间。这个过久的时长步入了趋势方的迟疑，也随之让局势变成多空势均力敌的情况。今天的所有内容都是在讲这个势均力敌。势均力敌的区间里头，同样有上升的推动，也有下降的推动，它们分别都是小型的，局部的趋势。只不过在区间内，多空力量会相互吞没，相互否决，即使出现看起来很强劲的运动。也可能是紧急奔向上下缘后就失去续航。等到你观察到以上现象，你就会说现在市场已经从趋势状态转入了非趋势状态。恰巧就是市场最喜欢的稳定态。你就要惦记区间倾向突破失败的道理，转而采用高空低多的逻辑，并观察价格在区间中轴上下震荡的节奏。遂此，你已经明白，大大小小的区间，只要具有双边交易的色彩，那就都是均衡的区间。只不过同时你也知道此前的脉络如何颇为重要。如果区间相对于它此前的趋势实在是太小太窄，太像是暂时的停顿。那么，延续趋势的几率就比较高。而如果区间看上去很宽，持续时间也长，那即使前面有这样的趋势性运动。双边交易也依然已经取代为当前市场的主旋律。原趋势在事后看来可能不过是区间内的一次常规推动。所以对待区间最好的方式，除了尽可能远离带刺的可能割伤你的铁丝网。再来就是要时常进行动能的比较，确定逆势方是否已经与你原先判断的趋势可以分庭抗礼。如果是这样，脉络可能已经从趋势转入区间，那你就必须要改变态度。好，说到这里，我们就即将完成第六单元。对于市场最基本的组成要素突破一体两面的LO4测试与LO5回调，再来是L06区间。以及另一个关键动作L07反转，你已经知悉了大半。相信你对于价格行为的核心知识已经有了更透彻的理解。接下来，我们会进一步讨论逆势突破，也就是反转。让你把关键的拼图给拼上。感谢收看区间双边交易地带。我们下个单元见。","p":"p323"}]},{"t":"para","text":"再次来到单元尾声来做一下整理，也同时再加强一下与前面单元的连接。说过很多次了，市场有80%的时间都处在大大小小的区间状态中。但由于似乎换了更多篇幅，在讨论失衡也就是关于突破的行情 你说明反转起末的确切经过。学过前面的单元，加上厘清关于反转的以上关键问题价格行为的原理部分，你就差不多备齐了图表上任何一段行情的发起到结束，到逆转，你都能够知道缘由。我们一起来把他们搞明白。","p":"p326"}]},{"t":"para","text":"这个单元我们会依序讨论的部分，包括何为反转，小型趋势反转和大型趋势反转该如何区分？还有大型趋势反转，有什么前置要件？看到什么迹象会让逆势交易者更加激进？以及如果条件备齐，大型趋势反转的发起将导致什么程度的反向运动？最后则是具体向你说明反转起末的确切经过。学过前面的单元，加上厘清关于反转的以上关键问题价格行为的原理部分，你就差不多备齐了图表上任何一段行情的发起到结束，到逆转，你都能够知道缘由。我们一起来把他们搞明白。","pid":"p326"},{"t":"img","src":"assets/img/l07A_092.webp","ilabel":"7-2","icap":"L07　反转逆势突破","fid":"fig92","ctx":[{"t":"这个单元我们会依序讨论的部分，包括何为反转，小型趋势反转和大型趋势反转该如何区分？还有大型趋势反转，有什么前置要件？看到什么迹象会让逆势交易者更加激进？以及如果条件备齐，大型趋势反转的发起将导致什么程度的反向运动？最后则是具体向你说明反转起末的确切经过。学过前面的单元，加上厘清关于反转的以上关键问题价格行为的原理部分，你就差不多备齐了图表上任何一段行情的发起到结束，到逆转，你都能够知道缘由。我们一起来把他们搞明白。","p":"p326"},{"t":"关于反转的定义，如今不用我多说，你应该也能够自己正确的说中七八成了。所谓反转，正是运动方向的改变，不仅原趋势方无法进一步推动价格，逆势方还反而能够突破成功，反向造成极值递进。就两根K线的尺度来说，就是空头成功突破阳线的低点。而如果这两根阳线是在一系列K线的顶端。那你将它展开为更小时间级别的更多K线，你就会看到方才的回调，使得波段低点开始降低。破坏了多头趋势，应该高低点不断向上递进的要求。反过来说也是一样，多头反转就是阳线突破阴线的高点，在更小时间级别图表上则至少使空头趋势高点开始抬升。对于逆势方来说，成功造就逆势突破一直都是他们的核心意图。这代表他们不仅阻止了顺势方继续占有优势，阻止其顺向突破，还击退他们所有的努力，越过了他们的防线。如果逆势方造成顺势方突破失败的尝试得逞了，那后续的兵败可能如山倒。创造更顺畅的反向突破，也就反转的趋势。不过你肯定也不会忘记，如果趋势仍在，那么反转的尝试都倾向失败，除了最后一次。那么，虽然在趋势的初期与中期，我们能不时看见逆势运动？而且这些逆势运动也或许足以诱使逆势交易者建仓。但怎么样？它毕竟是短暂的，不足以完全改变趋势方向。当然，虽然它也是局部的，小型的逆向趋势没错，逆势方的确暂时主导了行情。但它毕竟这只是局部的，小型的。相对于整体的大型趋势，它最后只会转化为旗型，也就是持续形态，然后价格依然会朝远趋势方向继续突破。所以这个回调我们说是小型趋势反转。仅有部分的片段的运行遭到反转，后面顺势方又会把价格搬回正轨。这也就是说，传统意义上约定俗成之下，我们只会把这说成是回调而非反转。我们耳熟能详的反转，在多数情况下，目指的是所谓大型趋势反转。规模要大，要看见上升趋势的低点开始降低，下降趋势的高点，开始抬升。只有看到这样的迹象，我们才会认为相反的趋势已经发起。接下来，顺势方即将换人做做看。","p":"p327"}]},{"t":"para","text":"关于反转的定义，如今不用我多说，你应该也能够自己正确的说中七八成了。所谓反转，正是运动方向的改变，不仅原趋势方无法进一步推动价格，逆势方还反而能够突破成功，反向造成极值递进。就两根K线的尺度来说，就是空头成功突破阳线的低点。而如果这两根阳线是在一系列K线的顶端。那你将它展开为更小时间级别的更多K线，你就会看到方才的回调，使得波段低点开始降低。破坏了多头趋势，应该高低点不断向上递进的要求。反过来说也是一样，多头反转就是阳线突破阴线的高点，在更小时间级别图表上则至少使空头趋势高点开始抬升。对于逆势方来说，成功造就逆势突破一直都是他们的核心意图。这代表他们不仅阻止了顺势方继续占有优势，阻止其顺向突破，还击退他们所有的努力，越过了他们的防线。如果逆势方造成顺势方突破失败的尝试得逞了，那后续的兵败可能如山倒。创造更顺畅的反向突破，也就反转的趋势。不过你肯定也不会忘记，如果趋势仍在，那么反转的尝试都倾向失败，除了最后一次。那么，虽然在趋势的初期与中期，我们能不时看见逆势运动？而且这些逆势运动也或许足以诱使逆势交易者建仓。但怎么样？它毕竟是短暂的，不足以完全改变趋势方向。当然，虽然它也是局部的，小型的逆向趋势没错，逆势方的确暂时主导了行情。但它毕竟这只是局部的，小型的。相对于整体的大型趋势，它最后只会转化为旗型，也就是持续形态，然后价格依然会朝远趋势方向继续突破。所以这个回调我们说是小型趋势反转。仅有部分的片段的运行遭到反转，后面顺势方又会把价格搬回正轨。这也就是说，传统意义上约定俗成之下，我们只会把这说成是回调而非反转。我们耳熟能详的反转，在多数情况下，目指的是所谓大型趋势反转。规模要大，要看见上升趋势的低点开始降低，下降趋势的高点，开始抬升。只有看到这样的迹象，我们才会认为相反的趋势已经发起。接下来，顺势方即将换人做做看。","pid":"p327"},{"t":"img","src":"assets/img/l07A_093.webp","ilabel":"7-3","icap":"L07　反转逆势突破","fid":"fig93","ctx":[{"t":"关于反转的定义，如今不用我多说，你应该也能够自己正确的说中七八成了。所谓反转，正是运动方向的改变，不仅原趋势方无法进一步推动价格，逆势方还反而能够突破成功，反向造成极值递进。就两根K线的尺度来说，就是空头成功突破阳线的低点。而如果这两根阳线是在一系列K线的顶端。那你将它展开为更小时间级别的更多K线，你就会看到方才的回调，使得波段低点开始降低。破坏了多头趋势，应该高低点不断向上递进的要求。反过来说也是一样，多头反转就是阳线突破阴线的高点，在更小时间级别图表上则至少使空头趋势高点开始抬升。对于逆势方来说，成功造就逆势突破一直都是他们的核心意图。这代表他们不仅阻止了顺势方继续占有优势，阻止其顺向突破，还击退他们所有的努力，越过了他们的防线。如果逆势方造成顺势方突破失败的尝试得逞了，那后续的兵败可能如山倒。创造更顺畅的反向突破，也就反转的趋势。不过你肯定也不会忘记，如果趋势仍在，那么反转的尝试都倾向失败，除了最后一次。那么，虽然在趋势的初期与中期，我们能不时看见逆势运动？而且这些逆势运动也或许足以诱使逆势交易者建仓。但怎么样？它毕竟是短暂的，不足以完全改变趋势方向。当然，虽然它也是局部的，小型的逆向趋势没错，逆势方的确暂时主导了行情。但它毕竟这只是局部的，小型的。相对于整体的大型趋势，它最后只会转化为旗型，也就是持续形态，然后价格依然会朝远趋势方向继续突破。所以这个回调我们说是小型趋势反转。仅有部分的片段的运行遭到反转，后面顺势方又会把价格搬回正轨。这也就是说，传统意义上约定俗成之下，我们只会把这说成是回调而非反转。我们耳熟能详的反转，在多数情况下，目指的是所谓大型趋势反转。规模要大，要看见上升趋势的低点开始降低，下降趋势的高点，开始抬升。只有看到这样的迹象，我们才会认为相反的趋势已经发起。接下来，顺势方即将换人做做看。","p":"p327"},{"t":"那么，大型与小型趋势反转的分界是什么呢？我们如何区别回调与反转？保守的说定义其实可以因人而异。就像阿尔布鲁克斯跟我都说，日内交易的区间要持续20根K线才算数，这肯定有人会反对。但方便起见，我们还是要先提供一个简单的标准给大家参考。首先，作为前置作业，通常大型趋势反转需要比较大规模的酝酿。我们知道回调也就是小型趋势反转，可能突然发起人们急速运行的好好的,可能碰到某个支撑阻力就开始出现反向的趋势K线。但回调毕竟只是回调，倾向演变为旗型，没有办法真正造成大幅的逆势运动。但大型趋势反转呢？它通常需要10根，20根以上的K线组成某种反转形态。且过程中逆势压力足够积累之后，才可能成功。以上升趋势为例，你会希望看到，比如某种双重顶，楔形顶之类的反转形态，有足够数量的K线构成。并且里头要有空头积极进取的证据。这个作为第一个要件，听起来好像是有点抽象的。但我们随后会举例向大家说明这是什么意思，请不要担心。第二点，你要在当前时间级别的图表上看见一次对趋势线的突破。同样以上升趋势为例，就是价格下破上升趋势线。这是反转前戏的第一枪响。虽然对趋势线的突破不必然意味着后续的大型趋势反转绝对成立。但这能够提醒场内的参与者，原先顺势方试图维持的运行斜率已遭挑战。市场将不再由某一方所控制，而至少进入双边交易的区间的几率将大大增加。也正是看到这样的征兆，逆势交易者即使原本保持观望，也会开始变得进取一点。进一步对原趋势方造成压力，可能迫使他们退缩。第三点，顺利的话，你会希望顺势方的重要防线被击破。以空头反转来说，他们的首要目标是造成低点的降低。也必须告诉你的是，对于多头趋势来讲，低点比高点重要，因为多头的止损可能设置在这些低点之下。于是回调开启以后，由K线低点开始降低，以后保卫方才上行的前低点不去降低。比维持高点，继续抬升来得更重要。回调之内的高点降低，这是常见的。但这只代表每逢新高就追进的动能交易者暂时缺席。却不代表那些价值交易者，那些打算等待更划算的价格，再重新买入的买家，没有意愿入场。不过要是多头应该捍卫的前低点开始失守，那就代表这两批人都不在。没有足够的人手，资金，燃料可以维持低点不断抬升的要求。并且多头的止损也可能进一步触发加剧卖出力量。多头原本期待弟兄们只是在等着稍微便宜一点的价格才买进。但到位了，却不见踪影，就让多方更加风声鹤唳，买进的意愿更进一步降低。所以，结合以上反转形态成型趋势线，突破低点开始降低。空头造成大型趋势反转的可能性就大幅提升。","p":"p328"}]},{"t":"para","text":"那么，大型与小型趋势反转的分界是什么呢？我们如何区别回调与反转？保守的说定义其实可以因人而异。就像阿尔布鲁克斯跟我都说，日内交易的区间要持续20根K线才算数，这肯定有人会反对。但方便起见，我们还是要先提供一个简单的标准给大家参考。首先，作为前置作业，通常大型趋势反转需要比较大规模的酝酿。我们知道回调也就是小型趋势反转，可能突然发起人们急速运行的好好的,可能碰到某个支撑阻力就开始出现反向的趋势K线。但回调毕竟只是回调，倾向演变为旗型，没有办法真正造成大幅的逆势运动。但大型趋势反转呢？它通常需要10根，20根以上的K线组成某种反转形态。且过程中逆势压力足够积累之后，才可能成功。以上升趋势为例，你会希望看到，比如某种双重顶，楔形顶之类的反转形态，有足够数量的K线构成。并且里头要有空头积极进取的证据。这个作为第一个要件，听起来好像是有点抽象的。但我们随后会举例向大家说明这是什么意思，请不要担心。第二点，你要在当前时间级别的图表上看见一次对趋势线的突破。同样以上升趋势为例，就是价格下破上升趋势线。这是反转前戏的第一枪响。虽然对趋势线的突破不必然意味着后续的大型趋势反转绝对成立。但这能够提醒场内的参与者，原先顺势方试图维持的运行斜率已遭挑战。市场将不再由某一方所控制，而至少进入双边交易的区间的几率将大大增加。也正是看到这样的征兆，逆势交易者即使原本保持观望，也会开始变得进取一点。进一步对原趋势方造成压力，可能迫使他们退缩。第三点，顺利的话，你会希望顺势方的重要防线被击破。以空头反转来说，他们的首要目标是造成低点的降低。也必须告诉你的是，对于多头趋势来讲，低点比高点重要，因为多头的止损可能设置在这些低点之下。于是回调开启以后，由K线低点开始降低，以后保卫方才上行的前低点不去降低。比维持高点，继续抬升来得更重要。回调之内的高点降低，这是常见的。但这只代表每逢新高就追进的动能交易者暂时缺席。却不代表那些价值交易者，那些打算等待更划算的价格，再重新买入的买家，没有意愿入场。不过要是多头应该捍卫的前低点开始失守，那就代表这两批人都不在。没有足够的人手，资金，燃料可以维持低点不断抬升的要求。并且多头的止损也可能进一步触发加剧卖出力量。多头原本期待弟兄们只是在等着稍微便宜一点的价格才买进。但到位了，却不见踪影，就让多方更加风声鹤唳，买进的意愿更进一步降低。所以，结合以上反转形态成型趋势线，突破低点开始降低。空头造成大型趋势反转的可能性就大幅提升。","pid":"p328"},{"t":"img","src":"assets/img/l07A_094.webp","ilabel":"7-4","icap":"L07　反转逆势突破","fid":"fig94","ctx":[{"t":"那么，大型与小型趋势反转的分界是什么呢？我们如何区别回调与反转？保守的说定义其实可以因人而异。就像阿尔布鲁克斯跟我都说，日内交易的区间要持续20根K线才算数，这肯定有人会反对。但方便起见，我们还是要先提供一个简单的标准给大家参考。首先，作为前置作业，通常大型趋势反转需要比较大规模的酝酿。我们知道回调也就是小型趋势反转，可能突然发起人们急速运行的好好的,可能碰到某个支撑阻力就开始出现反向的趋势K线。但回调毕竟只是回调，倾向演变为旗型，没有办法真正造成大幅的逆势运动。但大型趋势反转呢？它通常需要10根，20根以上的K线组成某种反转形态。且过程中逆势压力足够积累之后，才可能成功。以上升趋势为例，你会希望看到，比如某种双重顶，楔形顶之类的反转形态，有足够数量的K线构成。并且里头要有空头积极进取的证据。这个作为第一个要件，听起来好像是有点抽象的。但我们随后会举例向大家说明这是什么意思，请不要担心。第二点，你要在当前时间级别的图表上看见一次对趋势线的突破。同样以上升趋势为例，就是价格下破上升趋势线。这是反转前戏的第一枪响。虽然对趋势线的突破不必然意味着后续的大型趋势反转绝对成立。但这能够提醒场内的参与者，原先顺势方试图维持的运行斜率已遭挑战。市场将不再由某一方所控制，而至少进入双边交易的区间的几率将大大增加。也正是看到这样的征兆，逆势交易者即使原本保持观望，也会开始变得进取一点。进一步对原趋势方造成压力，可能迫使他们退缩。第三点，顺利的话，你会希望顺势方的重要防线被击破。以空头反转来说，他们的首要目标是造成低点的降低。也必须告诉你的是，对于多头趋势来讲，低点比高点重要，因为多头的止损可能设置在这些低点之下。于是回调开启以后，由K线低点开始降低，以后保卫方才上行的前低点不去降低。比维持高点，继续抬升来得更重要。回调之内的高点降低，这是常见的。但这只代表每逢新高就追进的动能交易者暂时缺席。却不代表那些价值交易者，那些打算等待更划算的价格，再重新买入的买家，没有意愿入场。不过要是多头应该捍卫的前低点开始失守，那就代表这两批人都不在。没有足够的人手，资金，燃料可以维持低点不断抬升的要求。并且多头的止损也可能进一步触发加剧卖出力量。多头原本期待弟兄们只是在等着稍微便宜一点的价格才买进。但到位了，却不见踪影，就让多方更加风声鹤唳，买进的意愿更进一步降低。所以，结合以上反转形态成型趋势线，突破低点开始降低。空头造成大型趋势反转的可能性就大幅提升。","p":"p328"},{"t":"我们同样找一个例子来看看，并且应用上这些要件，借此让你理解的更透彻。这张图有些交易者可能也眼熟能详了，这是比特币在2021年第一轮牛市的图表。我选了三日级别来做，说明这样K线就塞得下画面。显然，价格旱地拔葱而起，以后走出了蛮通畅的连续阳线。我们来复习一下，前面说过的一些概念，确保你没有忘记。第一根停顿K线在哪里呢？这里有一颗阴线，十字星代表价格在这里迟疑了一下。但迟疑就只是迟疑，多头动能都还在，没有出现任何K线的低点降低。而后续出现了严格定义的回调。K线在什么地方呢？是这根长下影线的阳线。我们说回调K线是急速运动中首次K线极值逆向突破的那一根。可以想见，在这里是先下后上完成的一个小小的回调。而不久后，价格终于陷入了更显著的回调。K线高点一路降低，内含两次推动。然后高点才开始抬升。不难想见，内部的运动轨迹应该是这样的，下跌，上涨，下跌。然后橘色的部分是在那根短小的阴线处稍微抖动了一下，再继续上涨，并最终突破了原趋势极值。这里也可以很清楚的看出，突破发起后完成回调，还有第二推。尤其对原趋势极值的测试，是明确成功大幅突破。那就可以开启新的突破循环，突破回调再突破。不过，这次突破或说这是对原趋势极值的测试，多头动能就开始衰减了。越过高点以后，旋即没有跟进，就开始折回。但幸好下跌的这两推结束，在相对高的位置没有威胁到前低点价格，还有继续上涨的空间。不过，接下来多头局势就变得不再乐观了，价格还未碰出原趋势极值就开始有阴线出现，这不是好消息。而突破高点以后，同样没有跟进，反而是收了比上次更强劲的阴线。它强劲到什么程度呢？我们终于拉回正题了，谈大型趋势反转的发生。前面提到的整体顺势动能转弱以后，反转的枪响在这里成立，对趋势线的突破。虽然突破后立即收回下影线非常明显，但在这里透露给交易者的讯息是多头掌权的现况，遭到了挑战。而且就算触线后立即弹起，多头也没有能够将这根K线收成阳线。那这就代表情况不再那么乐观了。你想想，如果你是多头，比如逆境，在这里给予突破回调的理由，建仓好了。看到突破屡屡失败，然后出现这种超级大阴线，一边差点威逼到你的盈亏平衡价位。还一边严苛的挑战了多头试图维持的上升斜率，你会不会害怕？就算你头很铁，决定死拿，但人家机构却不这么想。很大一部分的精明交易者将开始退缩。于是那些人的离场，马上让另一个要件也备齐，低点开始降低。再说一次，现在的趋势方是多头，他们要维持趋势的健全高低点必须不断递进抬升。如果价格在这里撑住，没有进一步穿透，他们还可以拍拍彼此的肩膀，嘴上说着哈哈，我们只是要在这里等一个双重底才买进啊。后面就要往十万去了，兄弟们不怕。但是，但是看到这种情况，即使后面又收了阳线，刚刚在这里建仓的你，有一瞬间都开始浮亏的你。肯定会加倍怀疑。如果多头够强，为什么下跌能够测试到我的盈亏平衡止损？他们真的没钱没力捍卫低点不去降低吗？事实摆在眼前，他们就是着实无法你才会真真切切的担惊受怕。所以与你在同个价位入场的机构也开始打各自的算盘了。有人想着好，那我赶快滚吧，等强劲突破后我再追进就好。为了多贪这一段利润，去死拿一个危险的仓位，绝对并不理智。有人则半信半疑地握着仓位，心想，我就看看你测试原趋势极值的表现如何。太弱我就逃生，大幅超越我就继续握着，反正我静观其变。而还有人则早已清空持仓，认定大型趋势反转可能就要发生。所以反而要找一个好的位置，开始准备做空。总之，看到前面种种的弱势表现突破屡屡失败，趋势线遭穿透低点开始降低。多头的信心就已经大不如前。这时候当然空头也不是吃素的，接下来可能就会更加凶猛。后面的事就很明确了，多头尝试扭转趋势，向上突破，而突破后应该要有两推。第一推走完以后回调，第二推应该去测试原趋势极值。但是哇，才隔了一根阳线，旋即收了一根超级强势的阴线，眼看又要创新低。剖析里头的走势，很明显是这样的。上涨回调测试原趋势极值然后失败。这里出现了一个小型的双重顶熊旗，引发下跌。而一旦收线在这里，刚刚在这根阳线收线后，决定再次给他机会，决定不跑，甚至还加仓的人。绝对是都受不了了。你要是还持仓，到现在应该也受不了了，我怎么会让你测试我的盈亏平衡两次还信你？我是什么很贱的人吗？所以，引发进一步的放弃价格又创新低。低点屡屡递进，高点也开始降低，现在反而是下降趋势的条件备齐了，给的空方十足的理由继续挺进。而下跌急速结束后，就刹停在这个很远的前上升趋势低点，才暂时缓住。","p":"p329"},{"t":"一路看来，你就见证了一次大型趋势反转的发动。这里我们接着把刚刚没有讨论到足够清晰的第一点给讲完。小型趋势反转与大型趋势反转最直观的差异就在于规模的不同。你只要看到很宏观的下跌，就必然要看到更完整，规模更大，耗时更久的趋势衰败过程。那些精明的机构才会同样被说服，认为趋势真的要反转了。所以前面讲的第一个要件大型趋势反转，通常需要10根，20根以上的K线组成，某种反转形态。且过程中逆势压力足够累积之后，才可能成功。用这张图就可以很好的体现。在反转发动以前，这里走出了一个漂亮的熊旗，还记得吗？上升通道都是熊旗。作为熊旗的楔形顶，这是很常见的反转形态。同时，自从急速停止到多头应该防卫的低点被刺破，总共走了21根K线。崭新的突破循环发起后，二十六根K线的二十六分之二十一，也就是百分之八十的数量。同时，逆势压力也充足，积累给了多头很多恫吓。21根K线里有10根K线是阴线，其中不少还很长，甚至比里头最长的阳线更长。以上正是规模卖压充分的具体意思。这样的条件备齐，更容易造成大型趋势反转。为了清除你其他可能的疑问，我要进一步说说为什么我非得将这三个条件绑在一起讲。很多交易者，尤其是操之过急的新手交易者，可能没有耐心等待条件备齐。比如看到趋势线被突破，就迫不及待想要摸底。当然，经过我的解释，似乎在趋势线突破，阴线收定以后，就市价做空。只要止损摆放得当就没有亏损的风险。但这也许是后见之明。有一种可能是在后面行情走出来以前，你的趋势线是这样画的。那么，要是刺破你，就马上追进做空。那随后出现的一波上涨，将会把你清扫出局。而如果交易者稍微稳重一点，愿意等待其他过滤器都发出讯号，帮助你筛选入场时机。那亏损就不会发生。这里低点还未降低，阴线也太少，卖压并不充分。于是在交易者起心动念想，要主观的修改我们提供的要件，以前还是建议你先谨慎一点。考虑照着上述标准多听多看。等到你很熟忍读图知道逆势压力的积累，怎么样才算充分，再让你的经验和学士派上用场？请塑出更适合你的交易规则。下一个段落，我要说明的是，对买压与卖压的判断。但开始以前请容我再啰嗦一下，我还想要再进行第四个要件的补充。在反转成立前，价格通常会对原趋势极值进行结果或为不及持平或过冲的测试。","p":"p330"}]},{"t":"para","text":"我们同样找一个例子来看看，并且应用上这些要件，借此让你理解的更透彻。这张图有些交易者可能也眼熟能详了，这是比特币在2021年第一轮牛市的图表。我选了三日级别来做，说明这样K线就塞得下画面。显然，价格旱地拔葱而起，以后走出了蛮通畅的连续阳线。我们来复习一下，前面说过的一些概念，确保你没有忘记。第一根停顿K线在哪里呢？这里有一颗阴线，十字星代表价格在这里迟疑了一下。但迟疑就只是迟疑，多头动能都还在，没有出现任何K线的低点降低。而后续出现了严格定义的回调。K线在什么地方呢？是这根长下影线的阳线。我们说回调K线是急速运动中首次K线极值逆向突破的那一根。可以想见，在这里是先下后上完成的一个小小的回调。而不久后，价格终于陷入了更显著的回调。K线高点一路降低，内含两次推动。然后高点才开始抬升。不难想见，内部的运动轨迹应该是这样的，下跌，上涨，下跌。然后橘色的部分是在那根短小的阴线处稍微抖动了一下，再继续上涨，并最终突破了原趋势极值。这里也可以很清楚的看出，突破发起后完成回调，还有第二推。尤其对原趋势极值的测试，是明确成功大幅突破。那就可以开启新的突破循环，突破回调再突破。不过，这次突破或说这是对原趋势极值的测试，多头动能就开始衰减了。越过高点以后，旋即没有跟进，就开始折回。但幸好下跌的这两推结束，在相对高的位置没有威胁到前低点价格，还有继续上涨的空间。不过，接下来多头局势就变得不再乐观了，价格还未碰出原趋势极值就开始有阴线出现，这不是好消息。而突破高点以后，同样没有跟进，反而是收了比上次更强劲的阴线。它强劲到什么程度呢？我们终于拉回正题了，谈大型趋势反转的发生。前面提到的整体顺势动能转弱以后，反转的枪响在这里成立，对趋势线的突破。虽然突破后立即收回下影线非常明显，但在这里透露给交易者的讯息是多头掌权的现况，遭到了挑战。而且就算触线后立即弹起，多
