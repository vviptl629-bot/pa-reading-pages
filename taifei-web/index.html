口成立的时候，通常趋势已经较弱，对吧？否则，原趋势方不应该退守至此，令逆势交易者，可以攻陷作为楚河汉界的均线。所以，针对两种看似类似但显然存在不同动能表征的情境，我们在运用上必定要有所调整。我想这一次我们从止损和止盈谈起，逐项倒回来讨论会是个好主意。虽然不是每次都如此。但就首次回调序列的内容排序而言，第一均线缺口时常发生在20均线缺口出现以后。那么，若是在前者入场之后，接着又出现第一均线缺口。那么，交易者会需要比较担心的一件事情是，若是两者都采取宽损押注到原趋势极值之处的过冲测试。却不幸价格未能行抵利润目标，而是陷入无尽回调。那么，我们就有两笔宽幅止损被同时触发的危险。遂此，既然第一均线缺口形成的时候，趋势方已经宝刀稍老。其胜率，就理论比20均线缺口会更低一些。于是，面对胜率的稍显缺失，我们就也许采取更高盈亏比的做法，会更加合适。这也就是说，当然我们可以沿用一模一样的做法去选择宽损的配置。但我个人会更加偏好，对20均线缺口选用比较远的风险距离。而若是以前入场的20均线缺口，但还未止盈就出现第一均线缺口的讯号。那后者可以考虑如大型趋势反转交易那样，改采波段交易的风格。又或者避免两个仓位同时触发宽损的方法。还可以，是只将其中一种纳入规则，放掉另一个。究竟如何选配，你还是有适度的自由空间。我只是想要趁机提醒存在同时亏损的资金压力。所以我们可以如理的适配给这两种方案不同的盈亏比和胜率预期。","p":"p614"},{"t":"那接着再向上面一项继续探讨，则是交易讯号的选择。20均线缺口单纯的多，要是没在原趋势方的那一侧均线处看见出线后的反向高/低一收出。那就直接放掉就可以了。但第一均线缺口却毕竟是要先容忍，对于均线短暂失守，再接着力挽狂澜，回到趋势侧。但就有一种可能性是，价格终究要大幅穿越均线，不再给到原趋势极值测试的利润。毕竟也请别忘掉，如果大型趋势反转，终究要发生它们价格必定是有一刻会穿越均线的。所以我可以直截了当的给出标准。如果你看到强劲的趋势K线穿透均线，那你要忌惮这种不利的动能表现。直接反向吞没或刺透，那就好办。先下跌失去跟进并旋即出现阳线，给出高一，并且发生在与趋势同侧，那就是20均线缺口，按刚才提的方法介入即可。但当实体已经收在均线对侧，还有连续的可观趋势线作为跟进，就恐怕放掉入场机会。即使再有反向高低的机会，也可能是将要对你不定的逆一順一。还有另外两种情况，第一种是K线突破收线在对侧而后只有一根趋势K线跟进。第二种是跟进的有两根，但实体不强，应该归属于非趋势K线。那这两种确实有点暧昧，有点恐怖，要不要割舍掉？你可以自由决定。你也可以再等一根，一样同色才放弃。但总之我觉得比较好的情况可能是趋势K线穿透，但紧接着失去跟进。又或者动能是阴阳交错，整体发展成一个小小的，反复的旗型回调，这些就会是比较理想的动能表现。微观规模多空竞合仅仅存在于不起眼的两根K线之间。就又常常在关键的位置上发烧出截然不同的后续。我想这很值得你仔细考察。最后，我们又回到整轮趋势的K线数量。刚才说20均线缺口是20到30根。那第一均线缺口呢？我列出两种情境给你。其一是出现第一均线缺口时，此前没有20均线缺口。要么仍然会保留20到30根的设定太多或太少都放掉。那如果是先出现20均线缺口，再出现第一均线缺口。那高几率后者出现时趋势早已持续超过30根。说明有必要松动30这个参数，不然几乎根本参与不到。只是说起来容易，其实非常难办。","p":"p615"}]},{"t":"para","text":"那接着再向上面一项继续探讨，则是交易讯号的选择。20均线缺口单纯的多，要是没在原趋势方的那一侧均线处看见出线后的反向高/低一收出。那就直接放掉就可以了。但第一均线缺口却毕竟是要先容忍，对于均线短暂失守，再接着力挽狂澜，回到趋势侧。但就有一种可能性是，价格终究要大幅穿越均线，不再给到原趋势极值测试的利润。毕竟也请别忘掉，如果大型趋势反转，终究要发生它们价格必定是有一刻会穿越均线的。所以我可以直截了当的给出标准。如果你看到强劲的趋势K线穿透均线，那你要忌惮这种不利的动能表现。直接反向吞没或刺透，那就好办。先下跌失去跟进并旋即出现阳线，给出高一，并且发生在与趋势同侧，那就是20均线缺口，按刚才提的方法介入即可。但当实体已经收在均线对侧，还有连续的可观趋势线作为跟进，就恐怕放掉入场机会。即使再有反向高低的机会，也可能是将要对你不定的逆一順一。还有另外两种情况，第一种是K线突破收线在对侧而后只有一根趋势K线跟进。第二种是跟进的有两根，但实体不强，应该归属于非趋势K线。那这两种确实有点暧昧，有点恐怖，要不要割舍掉？你可以自由决定。你也可以再等一根，一样同色才放弃。但总之我觉得比较好的情况可能是趋势K线穿透，但紧接着失去跟进。又或者动能是阴阳交错，整体发展成一个小小的，反复的旗型回调，这些就会是比较理想的动能表现。微观规模多空竞合仅仅存在于不起眼的两根K线之间。就又常常在关键的位置上发烧出截然不同的后续。我想这很值得你仔细考察。最后，我们又回到整轮趋势的K线数量。刚才说20均线缺口是20到30根。那第一均线缺口呢？我列出两种情境给你。其一是出现第一均线缺口时，此前没有20均线缺口。要么仍然会保留20到30根的设定太多或太少都放掉。那如果是先出现20均线缺口，再出现第一均线缺口。那高几率后者出现时趋势早已持续超过30根。说明有必要松动30这个参数，不然几乎根本参与不到。只是说起来容易，其实非常难办。","pid":"p615"},{"t":"img","src":"assets/img/l17B_307.webp","ilabel":"17-13","icap":"L17　首次回调序列与均线交易方法","fid":"fig307","ctx":[{"t":"那接着再向上面一项继续探讨，则是交易讯号的选择。20均线缺口单纯的多，要是没在原趋势方的那一侧均线处看见出线后的反向高/低一收出。那就直接放掉就可以了。但第一均线缺口却毕竟是要先容忍，对于均线短暂失守，再接着力挽狂澜，回到趋势侧。但就有一种可能性是，价格终究要大幅穿越均线，不再给到原趋势极值测试的利润。毕竟也请别忘掉，如果大型趋势反转，终究要发生它们价格必定是有一刻会穿越均线的。所以我可以直截了当的给出标准。如果你看到强劲的趋势K线穿透均线，那你要忌惮这种不利的动能表现。直接反向吞没或刺透，那就好办。先下跌失去跟进并旋即出现阳线，给出高一，并且发生在与趋势同侧，那就是20均线缺口，按刚才提的方法介入即可。但当实体已经收在均线对侧，还有连续的可观趋势线作为跟进，就恐怕放掉入场机会。即使再有反向高低的机会，也可能是将要对你不定的逆一順一。还有另外两种情况，第一种是K线突破收线在对侧而后只有一根趋势K线跟进。第二种是跟进的有两根，但实体不强，应该归属于非趋势K线。那这两种确实有点暧昧，有点恐怖，要不要割舍掉？你可以自由决定。你也可以再等一根，一样同色才放弃。但总之我觉得比较好的情况可能是趋势K线穿透，但紧接着失去跟进。又或者动能是阴阳交错，整体发展成一个小小的，反复的旗型回调，这些就会是比较理想的动能表现。微观规模多空竞合仅仅存在于不起眼的两根K线之间。就又常常在关键的位置上发烧出截然不同的后续。我想这很值得你仔细考察。最后，我们又回到整轮趋势的K线数量。刚才说20均线缺口是20到30根。那第一均线缺口呢？我列出两种情境给你。其一是出现第一均线缺口时，此前没有20均线缺口。要么仍然会保留20到30根的设定太多或太少都放掉。那如果是先出现20均线缺口，再出现第一均线缺口。那高几率后者出现时趋势早已持续超过30根。说明有必要松动30这个参数，不然几乎根本参与不到。只是说起来容易，其实非常难办。","p":"p615"},{"t":"实务上绝对不是简单的放宽参数就可以了。还是要对脉络与动能有综合考察的能力。以图表上呈现的这两个例子来说，你都可以看见先出现了20均线缺口，再接着出现第一均线缺口入场机会。前者重回均线，在第24根的时候，后者则是压线的第30根。那均线对侧缺口的低一入场点又出现在何时呢？左边这个例子，第35根下破就是低一。与前面提及的20到30这个30相去不远，对吧？但右边就差强人意了。似乎要调整到第41根K线被下破以后，才能够成功成立做空的订单。简洁评价两者右边这个耗时更久，其实花了更久时间才启动恢复的尝试。纯就K称数量来说，似乎稍加不利。但是如果我们综合的评估脉络与动能，那其实右边这个例子可能会稍微好一点。它是对20均线缺口这一推动的双重底。刺透后失去跟进。但左例的上涨就稍微更加强势。像图表的左方对去，也似乎无法背靠什么来给予此处存在反向订单，也就是空单助力的信心。也于是，相较于20均线缺口，第一均线缺口其实更难驾驭，更仰赖你综合的读图能力。相对无法用简单的参数去限定它。如果你担心驾驭不来，就不要将这个列入可执行的方案库里。如果你非要我在这边先给出一个数值。那就说30到45根可能都可以允许吧。","p":"p616"}]},{"t":"para","text":"实务上绝对不是简单的放宽参数就可以了。还是要对脉络与动能有综合考察的能力。以图表上呈现的这两个例子来说，你都可以看见先出现了20均线缺口，再接着出现第一均线缺口入场机会。前者重回均线，在第24根的时候，后者则是压线的第30根。那均线对侧缺口的低一入场点又出现在何时呢？左边这个例子，第35根下破就是低一。与前面提及的20到30这个30相去不远，对吧？但右边就差强人意了。似乎要调整到第41根K线被下破以后，才能够成功成立做空的订单。简洁评价两者右边这个耗时更久，其实花了更久时间才启动恢复的尝试。纯就K称数量来说，似乎稍加不利。但是如果我们综合的评估脉络与动能，那其实右边这个例子可能会稍微好一点。它是对20均线缺口这一推动的双重底。刺透后失去跟进。但左例的上涨就稍微更加强势。像图表的左方对去，也似乎无法背靠什么来给予此处存在反向订单，也就是空单助力的信心。也于是，相较于20均线缺口，第一均线缺口其实更难驾驭，更仰赖你综合的读图能力。相对无法用简单的参数去限定它。如果你担心驾驭不来，就不要将这个列入可执行的方案库里。如果你非要我在这边先给出一个数值。那就说30到45根可能都可以允许吧。","pid":"p616"},{"t":"img","src":"assets/img/l17B_308.webp","ilabel":"17-14","icap":"L17　首次回调序列与均线交易方法","fid":"fig308","ctx":[{"t":"实务上绝对不是简单的放宽参数就可以了。还是要对脉络与动能有综合考察的能力。以图表上呈现的这两个例子来说，你都可以看见先出现了20均线缺口，再接着出现第一均线缺口入场机会。前者重回均线，在第24根的时候，后者则是压线的第30根。那均线对侧缺口的低一入场点又出现在何时呢？左边这个例子，第35根下破就是低一。与前面提及的20到30这个30相去不远，对吧？但右边就差强人意了。似乎要调整到第41根K线被下破以后，才能够成功成立做空的订单。简洁评价两者右边这个耗时更久，其实花了更久时间才启动恢复的尝试。纯就K称数量来说，似乎稍加不利。但是如果我们综合的评估脉络与动能，那其实右边这个例子可能会稍微好一点。它是对20均线缺口这一推动的双重底。刺透后失去跟进。但左例的上涨就稍微更加强势。像图表的左方对去，也似乎无法背靠什么来给予此处存在反向订单，也就是空单助力的信心。也于是，相较于20均线缺口，第一均线缺口其实更难驾驭，更仰赖你综合的读图能力。相对无法用简单的参数去限定它。如果你担心驾驭不来，就不要将这个列入可执行的方案库里。如果你非要我在这边先给出一个数值。那就说30到45根可能都可以允许吧。","p":"p616"},{"t":"画面上这个例子就相当理想。先有20均线缺口，给到高一机会。再有一个同时造就双重底的第一均线缺口。而两者在K线数量方面都落在舒适的范畴。后续也就得以比较稳当的以止盈做节。","p":"p617"}]},{"t":"para","text":"画面上这个例子就相当理想。先有20均线缺口，给到高一机会。再有一个同时造就双重底的第一均线缺口。而两者在K线数量方面都落在舒适的范畴。后续也就得以比较稳当的以止盈做节。","pid":"p617"},{"t":"img","src":"assets/img/l17B_309.webp","ilabel":"17-15","icap":"L17　首次回调序列与均线交易方法","fid":"fig309","ctx":[{"t":"画面上这个例子就相当理想。先有20均线缺口，给到高一机会。再有一个同时造就双重底的第一均线缺口。而两者在K线数量方面都落在舒适的范畴。后续也就得以比较稳当的以止盈做节。","p":"p617"},{"t":"接着我们进行搭配建仓方案的案例讲解。在这张图标里，你可以看见价格正在对上方区间，或者你说牛旗进行激烈的下破。却在突破有跟进后嘎然而止。追溯原因主要可能是因为昨日尾盘低点处存在着反向订单。也是因为上方区间的等距扩张已经完成。那显然，即使动能强劲，你也应该忌惮在磁体处，动能遭到截断以后，有几率进入漫长的区间整理。乃至于开启上涨，所以不考虑收线市价追进。而即使之后出现非常戏剧化的高一，完成了对突破点的测试。并随机给到順一做空的讯号。但考量到脉络的尴尬，所以可能还是作罢比较明智。然而，观望一阵子之后，我们却看到价格走成细细碎碎的下降通道。好像有缓慢将可能存在在这附近的反向买单，给消耗完毕的迹象。于是我们便可以开始想象后续是否有机会延续下跌，发展成急速后的等距通道呢？在缓步下行的同时，我想错过这么一大段利润的交易者，很可能已经相当心急。不过终于在此处出现了潜在的20均线缺口。价格在乖离了29根K线之后，终于靠岸，并随后收内包趋势阴线。让我们止损放在上一个重要波段点之外，可止盈在原趋势极值之处的低一订单，可以成功递送出去。后面价格也比较顺利的走到位。成就了这个低盈亏比高胜率的交易。那如果再看看后续，你会发现第一均线缺口可能在这里形成。你很有机会在这根几乎光角的阴线底部以低一持有空仓。不过，如果参照前面设定的条件，此处是第49根K线，实在是比较迟了。加上前面的急速与通道等距已经完成。虽然此处没有对决线让我们得以进行高1的反转波段交易，但还是要忌惮此后一路上行。最终去测试通道起点的可能性。结合这些考虑，此处再以第一均线缺口做空，或许就不再合适。你也接着可以发现到，如果止损就在此处，或者更高一点的波段点之外，最后都没有办法免于止损。隔天价格正式大幅跳过高，开到通道起点。使采用与20均线缺口一样的最宽幅止损，交易者痛不欲生。所以这确实是一个不容易驾驭的建仓方案。使用上要严谨一点，多加小心。","p":"p618"},{"t":"又到单元尾声，再借用各位一点点时间来对今天的内容稍作复习。希望你还记得你在上一节的刚开始，曾经透过一个例子来引出首次回调序列的概念。我想以此作为交易方法的小节，应该再适合不过。可以重新为你贯通市场循环的主轴。整门课程上上下下，我们不断在论及趋使倾向延续而反转，尝试倾向失败。因此，交易者非得要观察到顺势动能的消退，逆势压力的积累。我们才可以怯生生的开始，期待大型趋势反转的成立。否则，各种类型的回调终究只是回调，并不能够颠覆宏观的整体动能。不过，回调也有分疲弱的跟强劲的。对于顺势的多头交易者来说，看到一根长下影线的阳线出现跟连续三根趋势阴线回调。担惊受怕的程度显然会不同。值得我们进行分门别类仔细计较。于是，阿尔布鲁克斯透过列出首次回调序列来让交易者可以依序查阅趋势，从萌生到日暮。应该大致会经历哪些事件？虽然不会每个都真正发生，也不见得非常严格的按照顺序发生。但大方向上为我们揭示了动能逐步衰弱的进程。我想是很有助于交易者理论的认识趋势的消涨。而此前我们谈过的包括收线市价入场，逆一順一以及双重顶底，楔形顶底等方案。其实都可以收拢到这个序列里面去参看。我们也是按着急速到窄幅通道，这样讲下来的。那无论如何，既然各类型回调的第一次发生倾向失败，我们就可以透过看衰他们来争取重新测试原趋势极值的这段利润。","p":"p619"}]},{"t":"para","text":"接着我们进行搭配建仓方案的案例讲解。在这张图标里，你可以看见价格正在对上方区间，或者你说牛旗进行激烈的下破。却在突破有跟进后嘎然而止。追溯原因主要可能是因为昨日尾盘低点处存在着反向订单。也是因为上方区间的等距扩张已经完成。那显然，即使动能强劲，你也应该忌惮在磁体处，动能遭到截断以后，有几率进入漫长的区间整理。乃至于开启上涨，所以不考虑收线市价追进。而即使之后出现非常戏剧化的高一，完成了对突破点的测试。并随机给到順一做空的讯号。但考量到脉络的尴尬，所以可能还是作罢比较明智。然而，观望一阵子之后，我们却看到价格走成细细碎碎的下降通道。好像有缓慢将可能存在在这附近的反向买单，给消耗完毕的迹象。于是我们便可以开始想象后续是否有机会延续下跌，发展成急速后的等距通道呢？在缓步下行的同时，我想错过这么一大段利润的交易者，很可能已经相当心急。不过终于在此处出现了潜在的20均线缺口。价格在乖离了29根K线之后，终于靠岸，并随后收内包趋势阴线。让我们止损放在上一个重要波段点之外，可止盈在原趋势极值之处的低一订单，可以成功递送出去。后面价格也比较顺利的走到位。成就了这个低盈亏比高胜率的交易。那如果再看看后续，你会发现第一均线缺口可能在这里形成。你很有机会在这根几乎光角的阴线底部以低一持有空仓。不过，如果参照前面设定的条件，此处是第49根K线，实在是比较迟了。加上前面的急速与通道等距已经完成。虽然此处没有对决线让我们得以进行高1的反转波段交易，但还是要忌惮此后一路上行。最终去测试通道起点的可能性。结合这些考虑，此处再以第一均线缺口做空，或许就不再合适。你也接着可以发现到，如果止损就在此处，或者更高一点的波段点之外，最后都没有办法免于止损。隔天价格正式大幅跳过高，开到通道起点。使采用与20均线缺口一样的最宽幅止损，交易者痛不欲生。所以这确实是一个不容易驾驭的建仓方案。使用上要严谨一点，多加小心。","pid":"p618"},{"t":"para","text":"又到单元尾声，再借用各位一点点时间来对今天的内容稍作复习。希望你还记得你在上一节的刚开始，曾经透过一个例子来引出首次回调序列的概念。我想以此作为交易方法的小节，应该再适合不过。可以重新为你贯通市场循环的主轴。整门课程上上下下，我们不断在论及趋使倾向延续而反转，尝试倾向失败。因此，交易者非得要观察到顺势动能的消退，逆势压力的积累。我们才可以怯生生的开始，期待大型趋势反转的成立。否则，各种类型的回调终究只是回调，并不能够颠覆宏观的整体动能。不过，回调也有分疲弱的跟强劲的。对于顺势的多头交易者来说，看到一根长下影线的阳线出现跟连续三根趋势阴线回调。担惊受怕的程度显然会不同。值得我们进行分门别类仔细计较。于是，阿尔布鲁克斯透过列出首次回调序列来让交易者可以依序查阅趋势，从萌生到日暮。应该大致会经历哪些事件？虽然不会每个都真正发生，也不见得非常严格的按照顺序发生。但大方向上为我们揭示了动能逐步衰弱的进程。我想是很有助于交易者理论的认识趋势的消涨。而此前我们谈过的包括收线市价入场，逆一順一以及双重顶底，楔形顶底等方案。其实都可以收拢到这个序列里面去参看。我们也是按着急速到窄幅通道，这样讲下来的。那无论如何，既然各类型回调的第一次发生倾向失败，我们就可以透过看衰他们来争取重新测试原趋势极值的这段利润。","pid":"p619"},{"t":"img","src":"assets/img/l17B_310.webp","ilabel":"17-16","icap":"L17　首次回调序列与均线交易方法","fid":"fig310","ctx":[{"t":"接着我们进行搭配建仓方案的案例讲解。在这张图标里，你可以看见价格正在对上方区间，或者你说牛旗进行激烈的下破。却在突破有跟进后嘎然而止。追溯原因主要可能是因为昨日尾盘低点处存在着反向订单。也是因为上方区间的等距扩张已经完成。那显然，即使动能强劲，你也应该忌惮在磁体处，动能遭到截断以后，有几率进入漫长的区间整理。乃至于开启上涨，所以不考虑收线市价追进。而即使之后出现非常戏剧化的高一，完成了对突破点的测试。并随机给到順一做空的讯号。但考量到脉络的尴尬，所以可能还是作罢比较明智。然而，观望一阵子之后，我们却看到价格走成细细碎碎的下降通道。好像有缓慢将可能存在在这附近的反向买单，给消耗完毕的迹象。于是我们便可以开始想象后续是否有机会延续下跌，发展成急速后的等距通道呢？在缓步下行的同时，我想错过这么一大段利润的交易者，很可能已经相当心急。不过终于在此处出现了潜在的20均线缺口。价格在乖离了29根K线之后，终于靠岸，并随后收内包趋势阴线。让我们止损放在上一个重要波段点之外，可止盈在原趋势极值之处的低一订单，可以成功递送出去。后面价格也比较顺利的走到位。成就了这个低盈亏比高胜率的交易。那如果再看看后续，你会发现第一均线缺口可能在这里形成。你很有机会在这根几乎光角的阴线底部以低一持有空仓。不过，如果参照前面设定的条件，此处是第49根K线，实在是比较迟了。加上前面的急速与通道等距已经完成。虽然此处没有对决线让我们得以进行高1的反转波段交易，但还是要忌惮此后一路上行。最终去测试通道起点的可能性。结合这些考虑，此处再以第一均线缺口做空，或许就不再合适。你也接着可以发现到，如果止损就在此处，或者更高一点的波段点之外，最后都没有办法免于止损。隔天价格正式大幅跳过高，开到通道起点。使采用与20均线缺口一样的最宽幅止损，交易者痛不欲生。所以这确实是一个不容易驾驭的建仓方案。使用上要严谨一点，多加小心。","p":"p618"},{"t":"又到单元尾声，再借用各位一点点时间来对今天的内容稍作复习。希望你还记得你在上一节的刚开始，曾经透过一个例子来引出首次回调序列的概念。我想以此作为交易方法的小节，应该再适合不过。可以重新为你贯通市场循环的主轴。整门课程上上下下，我们不断在论及趋使倾向延续而反转，尝试倾向失败。因此，交易者非得要观察到顺势动能的消退，逆势压力的积累。我们才可以怯生生的开始，期待大型趋势反转的成立。否则，各种类型的回调终究只是回调，并不能够颠覆宏观的整体动能。不过，回调也有分疲弱的跟强劲的。对于顺势的多头交易者来说，看到一根长下影线的阳线出现跟连续三根趋势阴线回调。担惊受怕的程度显然会不同。值得我们进行分门别类仔细计较。于是，阿尔布鲁克斯透过列出首次回调序列来让交易者可以依序查阅趋势，从萌生到日暮。应该大致会经历哪些事件？虽然不会每个都真正发生，也不见得非常严格的按照顺序发生。但大方向上为我们揭示了动能逐步衰弱的进程。我想是很有助于交易者理论的认识趋势的消涨。而此前我们谈过的包括收线市价入场，逆一順一以及双重顶底，楔形顶底等方案。其实都可以收拢到这个序列里面去参看。我们也是按着急速到窄幅通道，这样讲下来的。那无论如何，既然各类型回调的第一次发生倾向失败，我们就可以透过看衰他们来争取重新测试原趋势极值的这段利润。","p":"p619"},{"t":"今天教的两种均线缺口建仓方案就是如此。利润的目标都是原趋势极值。既然均线也是磁体，那么潜在的反向订单就可能造成拦阻的效用，使得强劲趋势第一次要被逆势方压过，穿透均线的尝试倾向失败。而双方要到原趋势极值之处，再去战斗一次。遂此，我们以20到30为参数定义第一种情境。倘若价格乖离均线如此之久，那么这应该是一轮强劲的，有顺势方长时间宰制的一段行情。这自然会给我们顺势参与，预期原趋势恢复的优势。不过我们也同时设定上限，避免单一的高/低1讯号，对于整轮趋势的效用太低，有蚍蜉撼树之嫌。就我自己的经验而谈，只要不超过30根，就大致能够避免误入过大结构的窘境。掌握基本原理，就只要接着考量止损和止盈的具体摆放即可。如前所述，止损可以在讯号K线之外，但更推荐在前一个重要波段点，或至少是显眼的次级波段点之外。止盈一般来说都会是原趋势极值，但要是你想要更安全一点。想要包纳进对于原趋势极值的测试，可能不及的情况，那就向内缩一点也可以。交易者可以采用方才趋势及之处的逆时方信号K线高低点。另一种则是第一均线缺口。相较于刚刚讲的20均线缺口，最大的差异就是入场讯号将在均线对侧，而非与趋势同侧。那既然逆势方都可以压制价格穿刺均线，但就更不利于原趋势方一点。第一均线缺口出现的时机也几乎到了首次回调序列的尾巴。于是，交易者在选择入场讯号时，就需要更谨慎，更善于察言观色。如果在第一均线缺口出现当下，你已经入场此前出现的20均线缺口。止损会建议你不放的太宽，改采波段的姿势。避免遭遇反转或者深度回调时，必须同时接受两笔宽幅损失。而若此前没有20均线缺口，也就是当K线终于回调到均线后，就立即产生第一均线缺口。这里可以依风格自由选用与规避。另外，需要注意穿透均线的动能强度与跟进状况。如果是趋势K线击穿均线，而后还有实体可观的同色跟进，那你就要当心了。至于需要容忍一根还是两根，你可以自己决定。最保守者可能光是突破后有跟进，就会考虑放弃。最后则是对脉络的总体判读，将影响一笔第一均线缺口的交易，到底值不值得做？如果非要像20均线缺口那样给一个数字。这当然不太准确，很意义淡薄。你可以考虑在趋势发起后30到45根K线的范畴内捕捉交易机会。太多太少，同样要放弃。","p":"p620"}]},{"t":"para","text":"今天教的两种均线缺口建仓方案就是如此。利润的目标都是原趋势极值。既然均线也是磁体，那么潜在的反向订单就可能造成拦阻的效用，使得强劲趋势第一次要被逆势方压过，穿透均线的尝试倾向失败。而双方要到原趋势极值之处，再去战斗一次。遂此，我们以20到30为参数定义第一种情境。倘若价格乖离均线如此之久，那么这应该是一轮强劲的，有顺势方长时间宰制的一段行情。这自然会给我们顺势参与，预期原趋势恢复的优势。不过我们也同时设定上限，避免单一的高/低1讯号，对于整轮趋势的效用太低，有蚍蜉撼树之嫌。就我自己的经验而谈，只要不超过30根，就大致能够避免误入过大结构的窘境。掌握基本原理，就只要接着考量止损和止盈的具体摆放即可。如前所述，止损可以在讯号K线之外，但更推荐在前一个重要波段点，或至少是显眼的次级波段点之外。止盈一般来说都会是原趋势极值，但要是你想要更安全一点。想要包纳进对于原趋势极值的测试，可能不及的情况，那就向内缩一点也可以。交易者可以采用方才趋势及之处的逆时方信号K线高低点。另一种则是第一均线缺口。相较于刚刚讲的20均线缺口，最大的差异就是入场讯号将在均线对侧，而非与趋势同侧。那既然逆势方都可以压制价格穿刺均线，但就更不利于原趋势方一点。第一均线缺口出现的时机也几乎到了首次回调序列的尾巴。于是，交易者在选择入场讯号时，就需要更谨慎，更善于察言观色。如果在第一均线缺口出现当下，你已经入场此前出现的20均线缺口。止损会建议你不放的太宽，改采波段的姿势。避免遭遇反转或者深度回调时，必须同时接受两笔宽幅损失。而若此前没有20均线缺口，也就是当K线终于回调到均线后，就立即产生第一均线缺口。这里可以依风格自由选用与规避。另外，需要注意穿透均线的动能强度与跟进状况。如果是趋势K线击穿均线，而后还有实体可观的同色跟进，那你就要当心了。至于需要容忍一根还是两根，你可以自己决定。最保守者可能光是突破后有跟进，就会考虑放弃。最后则是对脉络的总体判读，将影响一笔第一均线缺口的交易，到底值不值得做？如果非要像20均线缺口那样给一个数字。这当然不太准确，很意义淡薄。你可以考虑在趋势发起后30到45根K线的范畴内捕捉交易机会。太多太少，同样要放弃。","pid":"p620"},{"t":"img","src":"assets/img/l17B_311.webp","ilabel":"17-17","icap":"L17　首次回调序列与均线交易方法","fid":"fig311","ctx":[{"t":"今天教的两种均线缺口建仓方案就是如此。利润的目标都是原趋势极值。既然均线也是磁体，那么潜在的反向订单就可能造成拦阻的效用，使得强劲趋势第一次要被逆势方压过，穿透均线的尝试倾向失败。而双方要到原趋势极值之处，再去战斗一次。遂此，我们以20到30为参数定义第一种情境。倘若价格乖离均线如此之久，那么这应该是一轮强劲的，有顺势方长时间宰制的一段行情。这自然会给我们顺势参与，预期原趋势恢复的优势。不过我们也同时设定上限，避免单一的高/低1讯号，对于整轮趋势的效用太低，有蚍蜉撼树之嫌。就我自己的经验而谈，只要不超过30根，就大致能够避免误入过大结构的窘境。掌握基本原理，就只要接着考量止损和止盈的具体摆放即可。如前所述，止损可以在讯号K线之外，但更推荐在前一个重要波段点，或至少是显眼的次级波段点之外。止盈一般来说都会是原趋势极值，但要是你想要更安全一点。想要包纳进对于原趋势极值的测试，可能不及的情况，那就向内缩一点也可以。交易者可以采用方才趋势及之处的逆时方信号K线高低点。另一种则是第一均线缺口。相较于刚刚讲的20均线缺口，最大的差异就是入场讯号将在均线对侧，而非与趋势同侧。那既然逆势方都可以压制价格穿刺均线，但就更不利于原趋势方一点。第一均线缺口出现的时机也几乎到了首次回调序列的尾巴。于是，交易者在选择入场讯号时，就需要更谨慎，更善于察言观色。如果在第一均线缺口出现当下，你已经入场此前出现的20均线缺口。止损会建议你不放的太宽，改采波段的姿势。避免遭遇反转或者深度回调时，必须同时接受两笔宽幅损失。而若此前没有20均线缺口，也就是当K线终于回调到均线后，就立即产生第一均线缺口。这里可以依风格自由选用与规避。另外，需要注意穿透均线的动能强度与跟进状况。如果是趋势K线击穿均线，而后还有实体可观的同色跟进，那你就要当心了。至于需要容忍一根还是两根，你可以自己决定。最保守者可能光是突破后有跟进，就会考虑放弃。最后则是对脉络的总体判读，将影响一笔第一均线缺口的交易，到底值不值得做？如果非要像20均线缺口那样给一个数字。这当然不太准确，很意义淡薄。你可以考虑在趋势发起后30到45根K线的范畴内捕捉交易机会。太多太少，同样要放弃。","p":"p620"},{"t":"做完以上复习，我想趁机进行一个跨单元的小结。带你回顾目前教授的所有正常方案。你一定记忆犹新，急速交易方法的部分，我们讨论了首选市价入场以及逆一順一的方案。分别令交易者可以介入到急速以及急速转入窄幅通道的瞬间。而后有通道从窄到宽过渡的双重顶底与楔形顶底阶段。理念是看衰趋势发展中的二三推反转，尝试将旗型回调把握为获利良机。再来当周易走到宽幅通道转入区间的时候，我们以对区间看衰突破，捕捉价格自区间边线，回归均衡中轴的过程。以急赴磁体接入真空。并以“区间突破回调”参与均衡重归失衡的段落。而到反转则使用上磁力叠合的概念，分别利用急速与通道的等距运动目标，以及对末端旗型的真空过冲。还在反转迸发的潜在起点，就早早建立仓位，参与新一轮趋势的早期阶段。最后，我们则补充在大型趋势反转真正成立以前可能还会给到20均线缺口以及第一均线缺口的交易机会。利用首次回调尝试倾向失败而原趋势极值高几率被测试的理由，交易者有望榨出趋势的尾端利润。以上总共11种建仓方案，必须说是我精挑细选后认为最容易学习，最容易在图表上长期系统性把握的做法了。同时，它们不仅比较均匀的分布在一轮趋势的有始至终。不至于有哪一种市场循环阶段是让交易者全无利润可取，使得人受望梅止渴的尴尬。更重要的是，各方案的触发条件几乎各自独立，彼此之间不太会相互矛盾。同时，给到做多和做空的相反理由。也正是在此时，希望你明白我用心良苦的挑选逻辑。并意识到方案之间相互独立，偶合度低的重要性。将来在进行规则的细部设计时，也应该要把握此一原则，避免逻辑打架而造成执行现场的选择困难。那么，对照第12单元的主题，我们也应该为这些方案稍微爬出性格。急速交易的两种方法，由于止损都在趋势极点。但同时争取较遥远的等距利润，可以说是宽损宽盈的方案。于是，严格讲起来，这应该归属于盈亏比大致落在一点零倍附近的剥头皮交易。只是持仓可能会比较久一点。旗型回调则止损止盈都可宽可窄。两类风格的交易者应该都能够找到令自己舒服的选项。区间看衰突破通常是窄损，搭配窄盈。除非距离区间中轴很远，那有可能变成波段交易。而急赴磁体几乎总是宽损窄盈。区间突破回调则是宽损宽盈都更偏向剥头皮交易。但没办法，区间的确黏着难办。在这里想有事可做，必须接受这种必然的风格限制。不过，当说到大型趋势反转，急速与通道肯定是窄损快盈居多。至于末端旗型，则要看利润路径上面的磁体分布。但通常两者皆存在典型的波段利润可供争取。尤其搭配复合的磁体，作为胜率加持，往往期望会挺为优渥。最后20均线缺口，如我推荐会选择止损在前重要波段点之外。而止盈则指在眼前的原趋势极值。会是典型的宽损窄盈的剥头皮交易。第一均线缺口，视此前有无20均线缺口持仓而定。止损可能一样较宽或者窄窄的放在讯号K线之外。但总体而言，也就是宽损窄盈或者窄损窄盈可能更接近于剥头皮交易风格。现在，经过目前所有单元，你不仅超级充分的掌握了原理，习得了太妃建议的执行办法。也对风格的类属，有了鸟瞰的总体认识，这么一来，现在就正是时候，综合的选出合适自己风格的建仓方案。搭配出一个交易频率和使用环境都切合自己个性的组合。在后续的单元，我会接着挑选出交易日对这些建仓方案进行贴合，现场的运用说明。如此做，希望能够协助你体会脉络与动能的综合判读流程。并得以流畅的运用，教给你的原理进行思考。同时，准确介入讯号发出的关键时机。感谢收看首次回调序列与均线交易方法。我们下个单元见 会进行讲解，","pid":"p623"},{"t":"para","text":"确保讲解途中有机会与你的偏好建立起共鸣。那接下来要怎么进行演示呢？我会先用check gpt请他随机抽出流动性造价的品种与日期，抽出什么就读什么。并从交易日开始之前的事前准备讲起。请尤其注意，我是如何先在日线级别图表上面透过真实波幅均值的指标来找到当日可能的波动范围。并提前找出需要去注意的磁体。无论你是不是日内交易者，提前标注带测试的词体都是必要动作。同时，作为一种稍微雨露均沾的尝试，我会挑选一个指数或商品期货品种，以及一个个股品种来进行阅读。希望不同市场的交易者都能够有所收获。","pid":"p624"},{"t":"para","text":"当我抽出之后，你也可以在观看我竹根播放，讲解以前先尝试自己读过一遍，读完以后再来对答案。如此做，应该会是一趟有趣的，而且可以大幅提升收获的旅程。紧接着，我们就赶紧来开始。现在大家对于读图的流程应该都还是比较熟悉了，既然我们已经决定要读的是青原油期货，五分钟级别的图表。发生在二零二四年5月13号，那我们首先要做的第一件事情呢，就是到日间级别图表上面去确认近日的波幅。","pid":"p625"},{"t":"para","text":"这样我们可以呢嗯，在昨天的开收盘价附近去向上跟向下丈量一个atr来，知道向左对过去可能你有哪一些潜在的磁体？会影响到今天的行情，那这边提供的数值是一点八六，所以回到五分钟级别图表上面，我们可能就要做。向上跟向下各五一点八六个点的一个涨量。好，大概是这个范围。那这个范围的话，其实嗯，一点八六个点有点多了，因为这样等于是两倍的atr，可能如果一倍它就开，","pid":"p626"},{"t":"para","text":"正好开在昨天收盘价的话呢。可能上半部的一半跟下半部的一半就已经绰绰有余了，但这样子的话呢，作为一个比较保险的选择，我想还是。值得保留的一个做法，那向上的话呢，可以看到昨天是一个下跌的走势，这个下跌走的比较陡峭，是一个窄幅通道。那窄幅通道的话，我们就应该可以去使用。寻找重要波断点的方法，那首先昨天的高点呢？作为园区式的起点，","pid":"p627"},{"t":"para","text":"应该是要标记出来的。啊，这个地方呢嗯。可以做一个紫色啊，我习惯用紫色作为原趋势解决，那过程之中下跌的嗯，突破后有跟进就会变成我们要去追认。重要不断点的讯号。所以呢，这里呢，应该是首次在经过调整之后突破后有跟进，那我们回去追溯下跌的起点就会是这条线嘛。那后面呢，再下一次，再有突破后跟进应该是。","pid":"p628"},{"t":"para","text":"在这里那同样嗯，这个远知是极值，在这根小小的。小小的阴线，长上影线的阴线下破之后，后面有跟进这一段的过程里头。首次回调的高点就会变成我们要去关注的重要不断点。再往上去找的话，这里有过回调突破跟进，所以呢，这里是下一次下播后有跟进的一个。节点把它放大一点呢，那这里同样也可以去关注。除之外，再下去就是啊，","pid":"p629"},{"t":"para","text":"这根配线有回调突破后跟筋发生在这里。那我们把它标记出来。啊，同样这段的这个。下跌里头回调的极致。这样子的话，下跌的走势里头重要的波段点应该都找到了，那尾盘是一个区间，区间的上下缘，可能我们可以去关注一下啊。啊，下缘的话很清楚，就会是昨日的低点。尾盘的话，这个高点呢，","pid":"p630"},{"t":"para","text":"跟这里你都可以说它是区间的上缘。可能有区间上缘的一个作用。这里的话呢，选择这个会可能比较保险一点点，我们就采用外面。嗯，上半部的部分大概差不多了，那当然，你可以去选择看看，以你自己的习惯了，要不要去标记出这些刺激的波段点？字节波段点，比如这个地方，我觉得可能可以关注一下为什么呢？因为它是一个最久的一个调整。","pid":"p631"},{"t":"para","text":"最久的一个调整，那这个调整呢？我们可以去注记出来它，或许呢？嗯，能够起到一点作用。但如果你不喜欢这么杂乱，我只想留最重要的，那当然是留下重要波段点，看你自己平时的一个。操作都是怎么做的？向下去找的话，上面比较空无一物一点哦。嗯，首先这里向左对过去这个交易日的第一点，","pid":"p632"},{"t":"para","text":"当然要不要记出来？这是上涨趋势的起点。后面的话，这里上涨经过调整后突破后有跟进，那这里也会是一个重要的波段点。好嗯，大概是这样，那再向下的话，向左对过去。哇，好像没有数据哦，我们看一下。哦，对，好像没有数据那嗯。","pid":"p633"},{"t":"para","text":"也可以不管它吧，先不管它 去做这样子的一个空单。当然了，它还是有一定的可能性，在这个地方伸出阳线哈翻转起高。嗯，","pid":"p666"},{"t":"para","text":"只不过呢嗯，我认为在一个先型顶的反转，如我们所教的，它应该至少会有两段的下跌吧。那这段下跌其实已经很强了，到这个地方，所以我想去期盼一个AB=CD的运动，至少到下面这个重要波动点，它可能可以回调到这么高的地方来。完成这个AB的CD，所以这个我可能还是愿意去入场的啊，这会是我们今天做第一笔单子试驾入场。好，这边就是嗯，比较有利的一个持仓的讯号。","pid":"p667"},{"t":"para","text":"好，下一个人就不妙了，看起来啊，我这是在均线附近，然后重叠，快要抵达重要不断点的位置，稍微有一点多头都能出现。那这个对于我们时尚来说就不是一个好的消息，但也是要看接下来的动能怎么样，如果再往上去走，那我们就要去企盼。嗯，去预期刚才说的AB=CD的运动，可能能够让这个BC之间呢哦走到更高的地方去。但是无论如何，","pid":"p668"},{"t":"para","text":"因为我们的支撑很宽嘛，这是一个高胜率的交易，所以我们还是持仓一下，后面如果是阴线的话，对于多头来说就更棒了。因为对多头来讲，这就是一个坏消息。那就能更可能向下去走。啊，是一个稍微有点跳空低开的阴线，这个阴线把前一根的实体都几都几乎涂抹，然后这应该是一个比较好的一个情况。下一个我猜应应该能够指引吧。果然，这边就指引了。","pid":"p669"},{"t":"para","text":"那这边呢，就终于完成了我们的第一个单子，这是一个极富磁体的一个零点二四倍银灰比的一个交易。拿到通道的起点，那这里也再次印证了一件事情啊，就是我们说极速以及等距的通道在经过反转之后呢？通道起点经常被测试的这个。惯性是值得大家去记忆跟学习的，在这个例子上面又可以再次看到，那因为我每次滑鼠滑过去，它可能都会显示这个窗口有点烦。先把它拿掉好不好？然后在这个地方做，稍微做一个注记，就是说我有做嗯，","pid":"p670"},{"t":"para","text":"用什么图示好呢？用这个钱的图示好了。就说在在这边，我有做选个别的颜色。就是我有做单好不好？等一下作为这个嗯，回顾的时候我们再去盘点今天测试的单子里面呢，有哪一些是成功的，哪一些是失败的？那接着我们再继续看哦，这个地方可能反转起高。它变成基于对于这个通道起点测试的一个双重底的行情，有没有可能呢？哦，双重底底在哪啊？","pid":"p671"},{"t":"para","text":"我给你看。上涨调整，然后这整个上涨呢，你把它视作是一个嗯，比较长远的第二段推动的话，这里呢，总之有可能有这样子的走势。那它就是会是。立基于今天这段上场的。比较深的回调之后呢，继续去上线，那如果这个走势走出来了，我们当然就要去评估今日的高点，有没有可能再次被摸到？如果被摸到，","pid":"p672"},{"t":"para","text":"那在上面的话呢，就是下一个磁体。可能要去注意了，用错了。好有这样子的可能性，所以双重底的做多的交易者，你可以评估一下这边能不能做？那也如我自己的习惯啊，双重底我比较喜欢那种一推大概是哦二到五根K线的，这个K线数量明显太多了吧？下上下三推，应该是一个三推的结构，这K线数量稍微多了一点哦，那就可以看到这个下跌的。K线数量比较多，","pid":"p673"},{"t":"para","text":"所以这个应该不是我能够去驾驭的。不是，我可以去尝试做多的一个规模，这个我就不做了，但是呢，如果你的规则允许在这边做多的话呢，或许你可以考虑。但只不过我也提醒一下啊，虽然呢啊，我们提倡以规则为主。但是呢，加入一点点主观的动能的解读呢，可能还是蛮重要的啊，这里这段下跌很强，我们说到一段下跌很强。","pid":"p674"},{"t":"para","text":"经过一个调整之后，可能有等距的推动嘛，所以这个地方做多的话，你必须去思考这个点到底能不能提供？那么有效的一个支撑。我自己聪明了，我觉得可能不行吧，按照我自己的经验，所以总之这个双重礼我不会做，看看你有没有想要做的？我也把它标记出来，然后告诉你这里有做多的可能性。好下一根。这里是一根阳线，但是阳线应该没有触发高一吧哦，","pid":"p675"},{"t":"para","text":"没错，它是一个齐平的一个K线哦，好，那我们接着看看。好啊，跳空低开的阴线，那这里的话就没有高一了哦，所以双重底的朋友应该可以打消念头了，这里没有这个入场的机会。那反倒是这个急速下跌之后，走了一段回调，接着可能更往更低的地方去，更低的地方当然就是今天的低点。那如果到了进日低点，还有回弹的话，","pid":"p676"},{"t":"para","text":"那今天可能是一个宽幅震荡的交易日吧。有这样子的可能性，又或者呢，它就慢慢磨破了，它就变成什么呢？变成下跌，然后有一个比较深的回调，之后呢，再进一步下跌，你也许可以去预期。是这样子的AB=CD。大概是这样那嗯，今天的收盘就在七十七点七块附近哦，可能是至少触触及这个重要不断。可以去这样子设想好，","pid":"p677"},{"t":"para","text":"我们再继续看看。啊，也说一下啊，这根K线呢？有没有做极富磁体的理由呢？哦，我想可能也有啊，对于交易者来说呢？你最保守的情况应该是这样子，就说既然这个下跌是从这根阳线的高点起跌。那到下面的这个地点来想。应该有这样子的。零点二五百分之25的距离做测算，那这边的话应该是刚好落在位置上面啊，所以去做一单应该是可行的。","pid":"p678"},{"t":"para","text":"那我自己的话呢，会去尝试这么做。就拿到这里啊，零点三二倍的盈亏比那有些交易者呢，则可能觉得这里的话只有一根。K线虽然它很强啊，它虽然它光脚，但是呢，不是连续的K线的话，有点担心。你也许会担心现在这个下跌转入的一个。慢慢转入一个宽幅通道，反而把你给套了，然后开始走高也也可以啊，这个担心也合理，","pid":"p679"},{"t":"para","text":"但反正我会做。在这边做一个空单。好，这个地方触发我入场了email这个试驾的时候应该就入场了，往这里呢，是继续持仓。好阴线多头现在都没有这个连续两根的迹象，所以对多多来说嗯，现在比较是疲弱不振的。这里应该就指引了。那我们也同样把这个拿掉，然后在这边呢，去做一个标记啊，就说这里我做一个单子。那到了这边，","pid":"p680"},{"t":"para","text":"这个又比较精彩了，现在呢？走势比较看起来像是什么呢？你有这样子去思考的理由啊，就是呢，下跌这是第一段推动。很长很强，第一段推动，然后呢，经过了这里哦，就从这个高点起，算到这边第二段。然后呢？这是第三段。也就是说，","pid":"p681"},{"t":"para","text":"把这个下跌跟它后面这个小的阴线呢，算作是内部的两小推哦，或者是呢，把它这样子去。思考，这是一推，不好意思。这是一推，然后呢？最后一个小推是一小推。总之是一二三这样子的一个ABC，然后的一个二推的运动都可以了，那总之。这里的话呢，也有一个。","pid":"p682"},{"t":"para","text":"先行底的一个理由。呃，这个就比较。值得我兴奋，为什么呢？因为我自己是对主线的交易者。那这个对角线的话，现在目前满足的是极速后有一个通道，这个通道呢，有三推嗯，这样子就满足了我的嗯条件了。那严格起见，你可以说你希望它是AB=CD。可是AB=CD的话，其实在下面不远处啊，","pid":"p683"},{"t":"para","text":"我觉得今天的这个开盘的高点作为一个区间交易日的基底啊，可能在这里呢，不能走高。所以符合规则，既然是三推的话呢，我就考虑在这里去做一个高一的单子啊，看看能不能到通道的起点。这个影灰笔当然比较夸张哦，所以嗯，止损就算了，感受一下。好嗯，没有入场，那就继续往后挂喽。这里就入场。","pid":"p684"},{"t":"para","text":"当然了，希望他顺利的走到。嗯，下一根是阳线就更好了。好，这边是那既然是这个，你可以看到这些K线其实蛮有趣的吧，它有些下影线都试图要去下坡经距的低点，但是失败。所以这这个地方呢？嗯，你说有多投订单的作用呢？我想应该不至于不相信啊，那现在对于空投来讲的话呢，它可能可以去防守的位置，","pid":"p685"},{"t":"para","text":"首先当然是均线的。均线可能重叠，前面的这段推动的突破点。可能在这个地方呢，有压制的作用也不一定，那我们交易者就要去担心，如果这个上涨以来的这个阳线这段推动。它能够在这个回调不浅不深的情况之下呢？延续是最好，但如果很深，就是需要担心的情况可能。但运动目标不会抵达，但没关系吧哦，总之嗯，作为这种对直线的交易者。","pid":"p686"},{"t":"para","text":"去止损。我自己都觉得不打紧啊，不打紧，反正呢，能到就到嘛，不能到就算了。好，这里有一根蛮戏剧化的一个K线，那它当然了，像刚刚讲到，或许这一段嗯，下跌的这个低点作为突破点哦可能。这里有一点压制的作用吧，以及均线。进去看看会不会？","pid":"p687"},{"t":"para","text":"这个上涨就到这边终结，然后呢，经过某一个调整之后再去更高的地方呢，希望是这样子。然后这也是阳线，那都不做。吗这里就是一个很大的阴线了，而且走到比较低的地方。那这时候可能就要去思考了，不一定能到高处，虽然我没有做这个持仓管理的规则。哦，没没有打算跟大家在这里讨论这件事情啊，我们就拿到指引是哪里就是哪里，但总之嗯，","pid":"p688"},{"t":"para","text":"也许。这个上涨呢，并不一定能够到那么高的地方去，或许在这边呢，形成一个双重。然后呢，下跌变成一个窄的区间，在这边晃荡也是有可能的，要观察一下这种可能性。哦，不过这一空投就没有跟进了，虽然跳空低开。啊，调空低开，但是是一根光头的阳线，","pid":"p689"},{"t":"para","text":"那这样子的话就是多头尝试，在一次翻越。均线，看看能不能成功吗？也不怎么成功好，那这边没有连续的阳线的这个表现，那或许在这里真正进入双边交易地带了吧，多功互不相让。好吧，那我们就看看这个潜在的考点数会不会有什么样的反应？也是阳性。这里有一根很大的阴线。这就比较麻烦，一点点的原因是呢，他对于这一点没有去触碰到那经过了。","pid":"p690"},{"t":"para","text":"上下上，然后呢，一个销量调整之后呢，又上去了一次，你或许可以说这已经是第一推第二推第三推，就是呢，这个第二推从低到高的，这个第二推已经是内缩的。那或许呢，这段上涨已经了解了，那往下去到更低的地方的可能性也是有，如果这根阴线还有后续的话就比较糟糕。好嗯，这里确实是一根阴线，那应该估计下一根会达到我们的止损吧？","pid":"p691"},{"t":"para","text":"在这边也做个补充啊嗯，因为我们吃的是多仓，所以刚才没有去注意提跟这件事情，但是呢，这里呢有一个。高点降低的也就是这个对于低推极值不及的一个双重底。但这上岗顶确实是一个可以做空的，一个建仓方案了，看看你的规则怎么写的，如果你能够接受不及的话，或许这根K线收盘之后。或是你早在遇见它收盘之前呢，你可以在这个地方去挂空单。但是危险性呢嗯，则在于我们现在已经在一个区间的大的区间的下缘，","pid":"p692"},{"t":"para","text":"它反展起高去给到我们这种对局线遭遇者向上争取利润的可能性也是有。这个也给你自己去评估，到底要不要做？这里之后，肝心止损了。那既然这边止损了，就要来问的第二件事情是。首先，先标记一下刚刚在这里有做单。然后这个是止损的，换个颜色。红色啊，既然是止损的，那就来问第二件事情哦。对角线的规则。","pid":"p693"},{"t":"para","text":"对于交易者来说，是否可以接受第四仓再做一次呢？什么是第四仓？不是第四层了，第四推了。去划记一下，就是说嗯，有时候会有这种情况啊，应该在这里下跌，然后呢，经过一个调整之后开启通道阶段。二三，我们在这个地方去做对决性的交易。对不对？做一个背靠磁体的，","pid":"p694"},{"t":"para","text":"对角线的交易，可是呢，这个交易入场之后呢，他来了一次，对于原区市级值的测试。那测试呢？可能测试的比刚才这个第三推的地点还深哦，但是在这个地方弹起来。哦，有这样子的一个可能性，那这是怎么样的一个情况呢？就是其实下跌。转入反转以前，我们说到对于园区是极值，是其中一个要件。","pid":"p695"},{"t":"para","text":"对园区的机制测试是一个要件，对吧？那这个测试有时候是这样子的了。它以一种抬高的形式发生，那这对于多头来说是比较友好的一个情况，因为我们入场之后呢，就是慢慢的看它上升就好了嘛。不会有被打折损的这种情况，但今天的这里呢，则是有可能演变成这个样子。嗯，说这么多，搞不好下一个是一个阴线也不一定哦。希望你不觉得我太啰嗦，但我瞎说，","pid":"p696"},{"t":"para","text":"如果下一个不是阴线的话，那这里呢？对于我的规则来讲，我会有一个再去做一个。啊，同样拿到通道起点的，这样子的一个单子的一个逻辑啊，这是去容忍能够一次被打掉。去做这个对第四推的，第四推的双重底的，这个对第三推及时测试的一个再次的压注。忘所以我先把这个示例图删掉，然后看看这边怎么样，这里的话呢，如果可以做。","pid":"p697"},{"t":"para","text":"高一的单子哦，重挂一次。然后拿到对方来看看情况如何。哦，没有我能够。入场，不过这边也做了一个很漂亮的一个讯号，这个讯号是什么呢？就是突破。突破第三推对吧？收了一根这么强劲的嗯，实体的阴线，而且呢，前面两根更强劲。这么强劲的走势呢，","pid":"p698"},{"t":"para","text":"居然在这个地方被截断了，对于我们来说，可能是一个好消息，今天的区间，大的区间的底部可能还同时发挥着作用。同时，这里也比较棒的地方是。刚才去画的这个AB=CD的目标，在 天呢，虽然嗯。也挺精彩的啊，但是做的早已不多。都是这三笔，不过也也是不错，","pid":"p818"},{"t":"para","text":"对吧？嗯，虽然后两笔收益比较微薄，这笔收益的。也没有说特别特别好，但是至少是规避损失的一天呢嗯，那这样子的话应该。对于这天没有什么太多看漏的部分哈，有的话呢，我们再做讨论好，谢谢大家。","pid":"p819"}],"sections":[],"wcount":11412},{"id":"l20","icon":"L20","title":"L20　以交易为志业","blocks":[{"t":"para","text":"终于来到课程设计的最后一个单元，很开心，很荣幸跟大家一起走过这个艰难又有趣的旅程。只不过，在真正结束以前，我仍然有一些重要的话题想要跟你讨论。打算在你交易之路的行囊里面再放入一点护身的随行小物。因此，今天我们将先对你截至目前为止的学习，做一些简单的回顾。并提点你在刑诉建仓方案的具体执行办法时，可以考虑什么样的架构来指导决策。同时也向你指出课程，它培训之后你还要往何处去，该如何走下去。最后讨论身为一个交易的学习者，","pid":"p820"},{"t":"para","text":"我们可能如何将交易视作一份置业。截至目前为止，我们究竟掌握了哪些知识呢？将单元表列出来，应该就可以有一个总体的浏览。在课程的第一个交易认知板块，我希望学习者能够先具备对于交易这个行当的正确认识。包括市场的机制与目的是什么？谁是你的对手？以及理解相互成反比的盈亏比和胜率是如何共构出正向期望的数学优势。除此之外，我们还讨论到主根K线的阅读何以必要。也在正式进入远理以降的内容以前，先将必须用到的基础术语给具备起来。随后，","pid":"p821"},{"t":"para","text":"在价格行为原理的板块，我们着眼于多空竞合，以市场循环为主轴。谈谈市场，从单边交易的失衡状态，到双边交易的均衡状态，各个脉络中的各类行动者是如何思考，如何举止。以及为这些不同的脉络创造出了什么样的特性。比如趋势倾向延续，区间倾向突破十倍。逆势交易者在宽幅通道中得以获利，等等。了解原理，我们再接着谈读图，","pid":"p822"},{"t":"para","text":"判定脉络与动能必不可少的辅助要素。我自己是称之为读图技术，也就是寻找磁体与未推动技术的方法。好让我们可以更敏锐的去预期价格在何处，在何时去折返或者加速运动。有了以上，我们能够将它们组合起来，先把图读懂了，把多空镜合呈现出来的资讯给翻译出来了。才接着思考自己偏好的风格是什么，要如何介入行情来获利，并在大部分的脉络里面辨识出对应的有数学优势可言的交易机会。所以此经过认知原理，技术与方法的一路走来。应该能够具备对任何图表都独立进行完整，","pid":"p823"},{"t":"para","text":"逐根K线分析的能力。并且也可以随之想象，理解和掌握文件的可盈利方法。然后再发现自己的做法行不通的时候，透过回顾以上知识来自行出错。就在此前的读图示例里面，应该也有注意到，我其实没有用上任何外语课程的价格行为知识。比如缺口封闭，建仓交易日类型的区分等等，这些都没有去提及。但是却能够一样将图表给读明白，找到能让自己坐起来舒服的合理的交易机会。所以其实所需的核心材料你都有了。如何正确的组装它们，","pid":"p824"},{"t":"para","text":"你也已经知道了。接下来就剩下制作出自己用了顺手的武器，并且熟悉其使用日益打磨精良。如此回顾下来，我想顺道提出的是。交易无论从抽象的宏观层面来看待，还是从具体的执行层面来看待。无外乎就是一个输入处理，输出的过程。要将你从一位初学者变成一位有专业能力的交易者，这是需要透过输入好的教材教法开始。这也是我也许还会尽善尽美，但确实弹精竭虑在做的事情。而中间的处理过程，我在培训中是透过辅以卡片笔记，","pid":"p825"},{"t":"para","text":"日常答疑，读读作业规则的引导，撰写和讨论课。来协助你把知识消化，并且能够施展出来。剩下的还有赖你做复习与读读练习，透过增加图表阅读量来将身外的知识转化为身体力行的经验。有了好的输入与处理，最终我也相信能够有好的输出。就是你日渐专业，行止如一。成为你期待自己成为的那一种遭遇者。那么，我们先暂告上述抽象的内容，接着来谈具体的执行层面。","pid":"p826"},{"t":"para","text":"我们日常的交易决断同样也是输入处理输出。输入的是K线透露给你的常人眼里无意义或费解的价格行为资讯。你读到越多越细，就更能免于过度忽略的危险。而这些资讯进到你的脑袋以后，所谓的处理就是判断脉络与动能的表现如何，是能做还是不能做？以及能做的话，要怎么做？最后输出把你的思考与判断快很准的执行出来。使经过测试的期望表现能够真正体现为真金白银的获利。不过这个处理的部分谈何容易，对吧？确保每次的分析品质相同，不会被太浓厚的主观色彩给干扰，","pid":"p827"},{"t":"para","text":"也是相当困难的事情。所以除了在日常社群活动里面，我引导各位撰写规则以外。我在以下还要进一步引入决策树的概念来协助你能够利落的执行优质的处理和输出。各位在画面中看见的是一些动物的图案。在我引导你做任何事情，以前或许你已经自动的进行了一些指认。比如你可以很直觉的发现，有些是猫，有些是狗，有些是蓝色的，有些是红色的。几乎毫不费力，视觉的资料输入进行处理，再输出分类结果流程就已经被你跑完。","pid":"p828"},{"t":"para","text":"事实上，这也正是机器学习运作的概览。假设电脑不自己找出规律的情况下，我们要如何训练？只读得懂零跟一的电脑，像你刚才不假思索的那样。去找出蓝色的猫在哪里呢？想必有任何模糊之处，不懂价格行为的电脑是无法消化的，无法跟你心有灵犀到可以自己运作的程度。于是，我们需要引入决策树清楚的去定下判断的基础与顺序。如图所见，进入第一层，我们称之为节点的第一个圆圈圈，","pid":"p829"},{"t":"para","text":"这里我们需要去定义问题。比如嘴上有没有胡须呢？在这些资料里面有胡须的，就是猫没有胡须的，就是狗。透过问这个问题资料，可以精由分支被分到两边。那接着我们再问下一层颜色是蓝的吗？是再分到左边，不是就分到右边。如此做七只动物就可以合一的被分类完毕了，最后得到我们想要的结果。但事实上，交易也是这样的。市场中我们也要处理各种各样的作为视觉化资料的K线，","pid":"p830"},{"t":"para","text":"并最终做出交易决策。那么，我们当然希望有个清晰易用的决策树，可以流利的把能做与不能做的行情区分出来。使我们可以不假思索的进行决策。因此，我们要练习将一些感受性的判断转化为客观，可以被检验的做法。这里我可以试举两个例子来示范规则，如何清晰画到可以操作的程度。以收线试驾入场为例，我们理想中的交易机会应该是强劲的，对突破对象出脱遥远的趋势性运动。不过何为强劲，何为遥远呢？","pid":"p831"},{"t":"para","text":"这可能有个人见仁见智的空间。甚至有同一个行情，我自己今天判断可能跟三个月前的判断不一样的空间存在。所以，规则决策树可能可以考虑这样书写。首要的基本要件是突破后有跟进的同色K线作为确认。如此一来，第一个图例就无法被认可，我们就归类为无法操作。到了下一层，该确认什么呢？也许是突破与跟进收线的位置距离，突破点是否够远？我们则可以对所突破的双边遭遇地带高度进行丈量。并算出相对于该高度的突破距离是多少。","pid":"p832"},{"t":"para","text":"除非超过你设定的某一个参数，否则也过滤为不可介入的机会。再来我们还可以细致的考虑突破K线与跟进K线的样态。倘若在徒步方向上都存在明显的不利影线。一量发现影线超出实体长度的一半，那就不予介入。而后末两根都是趋势K线，那就正常入场。有一根是区间K线，就用二分之一的仓位接入等等。就这样，一层一层的筛选下来，你就可以用，除非否则的逻辑去定出清晰的边线。由此，","pid":"p833"},{"t":"para","text":"确保自己每次交易都有一致性可言。又或者再举一个极富词体，然后复杂一点的例子。这三者看起来都与下一个待测试的磁体颇为接近。价格都曾经进入25%的射程。只不过细节却有些不同。除了第一张图表是最标准的，最近以后很有望如愿获利。第二张图表最后一根K线就正桥行地某个重要波段点。就让人有些担心，到底会不会因为反向买单的作用，价格就从这一起高，而使我们蒙受损失呢？如果这一层忧虑推进做空，似乎就不是非常明智。","pid":"p834"},{"t":"para","text":"而第三张也有一点尴尬。好不容易进到射程，就开始细碎的整理。当然，如果继续下破了原本的停止订单，放置处也是很有望向下一冲去触及指引目标。但毕竟就是在入场前就进入横盘。动能没有理想中的连续，也让人感到担忧。那么，我们能不能透过撰写规则，树立好决策树？来将这三种情况分开来看待，做交易记录的时候注记一下类型呢。我想这是蛮值得思考的问题。","pid":"p835"},{"t":"para","text":"所以为了区分成三种第一个节点的题目，可以是进入射程而理应发送出订单不置序号的K线。是我正行历某一个磁体。如果是的话，第二种面对不利因素的情况就在这里，被分支出去。不是的，则是一汉三号图表落到右边来。接着我们也可以再问，停止订单挂上之后是接着旋即出发入场。还是进入某种回调和停顿。这次再将一三也给分流。这么想来，一是最优质的，二是比较危险的，","pid":"p836"},{"t":"para","text":"三则介于两者之间。或许在规则里，我们就可以明定将这三种分别注记为type AB和c，并最终最后呈现的数据表现。如果积累数据一多，发现太低，却是因为反向订单的可能作用而更常被止损。但这可以考虑将它移出规则，允许介入的范畴。如果不移出，那你可以调整一下做法。比如遇到这种情况，就自突破磁体的K线起点，再重新计算推动。除非这么做，","pid":"p837"},{"t":"para","text":"也进入25%射程，否则就不介入。透过以上把节点和分支写出来的过程，我们常常可以探照出原本没有想清楚，只是模模糊糊觉得好像有哪里不一样的行情类型。并可能在过程中找到提升期望的方法。反之，不分辨出来，但这得仰赖早已。当下case by case的主观判断。但往往只是这种模糊，在扰乱我们交易的一致性。障碍，我们真正了解价格行为，了解自己正在使用的方法。","pid":"p838"},{"t":"para","text":"这么讲来，你会发现对课程充分理解是必要的。如果写不出决策树，可能是对原理工具建仓方案的不熟悉，或者图表阅读量过于稀薄。以至于获得一张图表的时候没有经验，可以引导下手。因此，我强烈推荐大家在完成课程的过程，与其后多从数量充分的事后读读练习起。请任意找一张图表，尽可能挖掘80根K线中与课程内容相呼应的所有资讯。接着你还要好好的问自己，我想要介入的是众多价格波动中的哪一种段落？仔细思考以后，","pid":"p839"},{"t":"para","text":"比如你也许能够回答我，似乎更喜欢在回调中买进我是个价值交易者。喜欢波段风格，那也许我会考虑双重顶底。于是继续从数十，数百张图表中找到这些双重顶底。并思考它们之间有何差异，你将来如何辨识和处理这些差异。坦白说，这是一个复杂的工作，如果你对这一张图表进行分析，而这整个过程花你不到20分钟。那我敢说你肯定漏掉了，非常非常多的资讯。你最好重新再来过。","pid":"p840"},{"t":"para","text":"但是一旦累积了50张100张双重顶体图鉴，那你对于这单一形态应该就有比较充分的掌握了。在坚守决策树的清晰性的前提之下，能够支持你写出一套可运作，可以捕捉到相对应利润的规则。那下一步是什么呢？就是带着这套规则去做动态的逐根读图。同样思考，每根K线的含义应该如何跟课程所提到的知识相联系。并如实感受和记录自己的规则是如何甄选与太祖可行和不可行的行情。理论上，这样的试验过程也会使你发掘出静态练习时没有想到的问题。比如理想的利润走出之前，其实没有预兆，你无法进入备战的状态，","pid":"p841"},{"t":"para","text":"而总是错过。或者我已经正在持a方案的仓位。但止盈以前b方案的讯号发出了，而且两者的方向还相反想抵触，这该怎么办？等等。由此可见，图表阅读量的增长是一个有机的循环的，无止境的过程。你会不断加强对原生具备的知识的认识，获得新的图例来深化理解。并且让自己越来越接近，什么都看孤儿，见怪不怪的老道状态。任何路途上的新建式都会启发你去调整，","pid":"p842"},{"t":"para","text":"乃至于重新组织你的决策树。直到大多数的可能情况，你都已经设想过，遭遇过，都可以被规则预先涵盖。那么会动用到毫无根据的主观判断的情况，就会几乎不再存在。那显然，如果上述工作都完成了，你已经在读图练习的过程中接受了充分的经验训练。那么，课程起初设定的目标独立分析图表，掌握盈利方法，对自行出错应该就问题不大了。希望你很乐见，","pid":"p843"},{"t":"para","text":"这几个月以来自己有所成长和进步。只不过毕竟学无止境。倘若你还有余力，那在此后一生那么长的时间里面，我们还是有很多关于交易的进阶课题可以去钻研。我可以作为阶段性的亦师亦友角色陪伴你。但我的确不希望这里已经是你的终点。如果你对交易有热情，觉得市场迷人，并且珍惜它，带给你所有的痛苦与快乐。那持续进进就会是必要的。怎么做呢？我想每一位交易者的学习进程都可能可以用这样的一个螺旋模型来概括，以此来回顾自己从哪里来。","pid":"p844"},{"t":"para","text":"将来该往何处去。我相信你记得我刚才才讲过的，我们总是必须先具备基础知识，之后通过增加自己的图表阅读量。来一边理解这些知识，如果体现在现象里面。一边固化我们对知识的熟悉度。于是，学习交易必然会是一个螺旋上升的进程。我们绕着核心原理打转。并随着经验的累积，变得越来越厉害，从全然的小白进阶为未初学者。在缓缓上升到初学者中，比较成熟的那一群人。","pid":"p845"},{"t":"para","text":"可是无论你去到多高的位置，万变都不离其原理。并不会说到了下个阶段之前学过就不必要了，不管用了。所谓的变强，其实就是你串接知识，将其发挥出来的速度增快了。你逐渐能在越来越短的时间中思考越来越多的复杂问题。并比起之前更熟忍的做出越来越优质的决策。这同样是输入处理输出的典型流程。知识有了，接下来输入的就是新的经验与提问。然后再做更充分的思考演练与测试。直到输出更好的规则与操作。是的，","pid":"p846"},{"t":"para","text":"此间使你有资格脱离初阶交易身份的标准就是规则的建立。人家说交易也是二八法则，一九法则。被召唤的太多，而被选取的太少。多数人就是因为懒惰而在这里被过滤掉。那么，实际上更不在乎自己的行为是否如地，是否有统计支持？只凭这似是而非的感受，在行动照顾自己的情绪和体验。你可以说，即使一个人有十年20年的骨龄。去看他天天看着电视名嘴的节目来决定如何买进和卖出。它充其量就只是一个老鸟而已。","pid":"p847"},{"t":"para","text":"资深跟专业是超级两码子事。于是，在培训，在社群日程的后半段，我不断设法引导各位的就是去编写出自己的交易规则，并执行它，验证它。这将充分的带你从摸索这个市场的运作。进入到我如何具体介入的领域？如我提到的搜集建仓方案图鉴，以决策树清除暧昧。广泛测试并调整规则。将带你更上一阶，成为一位更专业的规则教育者。不过，","pid":"p848"},{"t":"para","text":"在跟向上就是比较费解，甚至可能引发争议的部分了。由下到上，依据是基于规则的自由裁量交易者。自由裁量交易者。以及凭直觉，便能知晓如何行动的交易者。由于discretionary更常被翻译为主观，因此对于一个对交易，对价格行为纯无理解的外行人。这三个名词可能会有很大的误会空间。这意思是货交当过规则交易者，那随着年资的增长，我就可以完全凭主观感受行动吗？那着急不是的。","pid":"p849"},{"t":"para","text":"别忘了，这是一阶一阶向上循环，上层都立即与下层的模型。你永远需要环绕着以下建立的基础来行事。升迁并不代表出脱。于是所有的自由裁量和直觉都必然仍然要给予规则。举个例子来说明，在一个典型的对角线反转交易里头，我们是从通道线侧重叠磁体处其他高一发生。并争取向通道起点进发的这段利润。我们知道理论上可以起在十根K线以上的日推反转运动。但这二推到底会怎么开展？会不会夭折？或者比想象中的更强劲？那这其实就比较未知一点。","pid":"p850"},{"t":"para","text":"我们在持仓过程中可能有很多调整姿势的空间。于是，对于一个不希望入场以后就简单任凭直升指引遭到触发的交易者。可能就会为自己留下自由裁量的选项。比如，如果低推走的比较强劲，回调又很疲弱。有望越过通道起点，并开展出更远的等距。那或许你会在第二推又突破确立之后调整止损。直到再有连续两根阴线出现。又比如，如果第一推走的太弱，回调也比较深。你掐指一算，","pid":"p851"},{"t":"para","text":"发现即使AB=CD还能走出指引，目标也会低于原本的指引目标。智能滴答第三推起点。但你可能也会考虑缩进止盈。以上举例就很清楚的展现了酌情决定的思路。但请严加注意，酌情也是有明确选项有边界的。如果a并且b。那我就c直到d发生。绝对不是一觉醒来有一种今天能长的直觉，于是就决定要放宽指引目标。换句话说，反面就是如果a实现了，但b没有同时成立。那c跟d也不该被你执行出来，","pid":"p852"},{"t":"para","text":"因为这不是你允许自由裁量的范围。在没有规则不交行为后果的下面几个阶段。自由裁量或者大家俗称的主观，实际上就相当危险。因为根本还不知道如何运用这种自由。你绝对必须熟认所有的现象以及原理，有能力操作非常复杂的规则，作为整体的系统。你才有资格为自己新增越来越多的酌情空间。最上层就是凭直觉便能知晓如何行动的交易者。但我的理解读图三四十年，一根K线，一个最小爆炸单位都没有落下的阿尔布克斯就已经处在这个位置。他自称已经看过了所有可能的价格行为，开展模式对百种建仓形态进行了难以计量的回测。","pid":"p853"},{"t":"para","text":"直到可以在每个人K线里面都看到建仓价值，甚至不止一种介入方式。所以是的外行人看来，这就是什么都有解释，空间不成体系的任意交易。但理解这样的成长模型，你会知道那是无数规则，但复杂自有裁量，堆叠而成的。并且经受到可以非常迅速反应的成果。当然，或许对于多数只是希望赚钱能有40年的全职光阴，可以去挥霍的人们来说。那不是一个需要去气极的目标。但毕竟止于至善。","pid":"p854"},{"t":"para","text":"我们是可以尽量在往后的日子里细水长流的去累计图表阅读量，优化手上的规则。只要有机会具备18般武艺。总之，就是反复思考，获取经验，习得新知识来解决现有的困惑。如此做，我们就可以步步高升。到了最后，我想附送一下单元的名称，我定为以交易为置业。这是什么意思呢？实际上我是想要致敬社会学家韦伯的著名演讲稿。原本的提名是以学术为置业。","pid":"p855"},{"t":"para","text":"他以这篇文章回应了他的时代问题。当他在一九一七年进行这样演讲的时候，工业革命已经发生了百年。工业化彻底改变了欧陆的社会结构，也造就了工业资本主义的兴起。于是前所未有的历史转折，是过去人们是依赖宗教或者传统来理解世界，诠释意义。但这样的观念却逐渐退场了。人们开始讲理性，讲知识，讲科学。认为凭借着理智和规范的程序，能够逐步揭示世界运作的原理。也正是在这样的背景之下，","pid":"p856"},{"t":"para","text":"科学研究者开始在大学和研究机构舞台上面得以扮演要角。肩负起开疆辟土，深化知识的重要任务。而韦伯作为一位社会科学家，也当然身处这样的队伍里头。以上神看传统的权威遭到松动的过程，就是韦伯所谓的趣昧。不过，在科学带来进步与方便的同时，却也造成了新的空虚和冷漠。那就是尽管实证可以阐明事实是怎么样的，可以计算，可以实验。但是，过去由宗教来回答的人生意义是什么？","pid":"p857"},{"t":"para","text":"我该如何活着？形象的美学的伦理的等等重要问题，科学却无法回应。他们韦伯作为一位服务科学的学术研究者。身处在这样时代巨变的一个个人，就陷入了巨大的茫然。一方面，它乐见于知识的飞跃发展，改善了人们的生活。却一方面，眼见人们在意义层面面临前所未有的空无。这该怎么办呢？这是这篇演讲稿的核心扣问。这是一个峻永的问题。毕竟至今我们仍然活在趣昧的，","pid":"p858"},{"t":"para","text":"理性化的延续里面。更甚至是我们现在不仅依然重视科学与实证。现代化以来，我们还重视物质，重视金钱。将物质与数字视作是衡量人生意义的标杆。你赚多少啊？你在首都有没有几套房啊？活的这么穷森，那你活着还有意义吗？这无可否认的将我们仍然置于庞大的延续，自当时的空虚理念甚至还变本加厉。我是谁？我在为什么而挣扎和打拼？一切意义是什么？","pid":"p859"},{"t":"para","text":"我该往何处去？没有人带我们思考过这些问题，那更黄盾给我们答案了。令人伤心的是，我们仍然继续选择用物质和金钱来评价自己。总是陷入一种我赚的不够多，那我就没用了。我没有出人头地，衣锦还乡，那我怎么抬头挺胸过河？这样的最最不安里面。没错，作为交易者，作为交易的学习者，我们不外乎就是想着要赚钱。","pid":"p860"},{"t":"para","text":"如果有钱，如果我知道人生的意义，如果我予欲思考这些形而上的不食人间烟火的问题，我就不会来学交易了。但是，无论盈利与否，我想你也总有诸多迷茫的时候。信仰市场的表现，我们总是无法事前预知，完美预测。那么，短期看来，所有的盈亏表现都只能是几率，我找不到踏实的确定性感受。于是既然做不到完美的获利，","pid":"p861"},{"t":"para","text":"那我努力究竟是为了什么呢？我究竟要怎么样才能够得到回报呢？这些真的有尽头，或者某个彼岸可以去到达吗？会知道你在无言梦回的时候，眼见亏损的时候挑灯夜战，而感到相当疲倦的时候。会不会思考这些意义问题，并感到虚弱和无畏？说到这里，也许你就可以想象韦伯的困扰以及理解他所思考的问题了。也因此，他在这篇演讲稿里面所提出的可能答案就会值得我们参考。他认为，当然我们不可能再复反传统权威，","pid":"p862"},{"t":"para","text":"为宗教而活的时代。就得继续理性下去。但是，尽管理系分析的学术工作并不能代表宗教来回答意义问题。却可以作为一种置业，一种使命而存在。因为理性化的过程里面探索知识并加以实证的过程，应当不光是拆解和摧毁。也同时带来一条通往不断改进，反复检验自我约束的道路。作为学术工作者，回国的任务不应该是要破坏，而是要建设。所有的结构都是为了建构。如果能够去接受，","pid":"p863"},{"t":"para","text":"我们无法给人关于终极意义的确定答案。但可以用方法论和研究去帮助世界持续进步。那便在这种看似有限的舞台上面找到了自身的使命感。各位交易，我认为亦是如此。我不能够保证自己总是盈利，也无法透过盈利来直接找到人生意义。但我可以自愿的执行高度理性化的实践。这时候充满不确定性的必然。而把交易视为一条值得长期经营，用以自我抵力的道路。对我来说，追逐暴利并不是主要的目标。交易更不是我用你赚到足够的钱，把别人比下去的工具。","pid":"p864"},{"t":"para","text":"我实际上是在不断付出，调整消化知识，转移知识，生产知识的日常中。找到了踏实感和方向感。并同时因着自我成长而感到满足。于是我想要说的是什么呢？我衷心想要传达给你的是什么呢？透过将交易视作为一种置业。我能够比起初学的时候便接受无常。更磨练自己的理性和几率。并在扮演执行者，研究者，教学者的同时，从根源里面找到意义。","pid":"p865"},{"t":"para","text":"因此，无论你接触市场，学习交易的起心动念是什么？如果把交易不只是做一个赚钱的法门，一份工作或许有机会在思考和实践的过程之中。透过将其当做一种置业而找到稍微更多一点点的意义与乐趣。这其实也跟阿尔布克斯说的不谋而合。他常讲要把交易做好，所以要对交易这项事业有正确的认识。还需要得以从中不断收获乐趣。遭遇者不应该时时刻刻担忧，愤怒或激动。而是应该找到能使自己感到放松，舒适，愉悦，","pid":"p866"},{"t":"para","text":"并且匹配自己个性的交易方式。包括建仓方案，时间级别以及交易的频率和风格。对我来说，从交易中获得的乐趣。其实始终来自于自我成长。乃至于我透过跟人们探讨学问而更清楚的认识到了市场，还有我自己。乃至我发现自己有望为传播或开拓价格行为的知识疆界起到一点点渺茫的帮助。于是我也非常决绝的明白。阿尔布鲁克斯所说的乐趣。并不应该全然建筑在盈利与否之上。因为盈亏同源，必定有损有赢。如果我将获胜视为快乐，","pid":"p867"},{"t":"para","text":"那随之而来的败北就会使我痛苦。不过，成长的喜悦是稳赚不赔的。眼见自己为了学好交艺，变成一个克己负义的人，也是稳赚不赔的。我受惠于学习，受惠于作为置业的交易那么多。所以我必然还会在探究相关学问的路上继续前进。随此，我也诚挚的邀请你，不要将这门课程的结束视作是你学习的终点。而是下个阶段的令人雀跃的崭新开始。最后的最后，作为中烟，","pid":"p868"},{"t":"para","text":"我想再次分享这段你可能听我讲过好几次，让我不厌其烦。想要引用的话。过去，在厦门，山东齐鲁大学，后来赴台湾大学中文系任教的老教授柴进农。在替明代文人张岱的陶庵梦忆写序时写道。大概一个人能将寂寞与繁花看作没有两样。才能耐极，默而不热衷，触犯华而不没落。当你选择在尽到遭遇的领域，并将其融入生活。但你一辈子最需要打交道的，","pid":"p869"},{"t":"para","text":"必然就是寂寞与繁华的交互，或者同时来访。对任何一个人来说，冷热交替都是非常折磨的事情。有太多太多的交易者在暴富的狂喜，在亏空的绝望中迷失了自己。但幸好你不会，我对你有信心。你已经掌握了精良的认知原理，工具和方法。也在结业以前遇见了螺旋上山的路径，知道如何踏实的耕耘。所以你肯定能够恬淡的消化情绪的波动，并专注在调整思考，自我抵砺。","pid":"p870"},{"t":"para","text":"以及负重支援的任务上面。是的，我对你有信心。衷心的确信你能够成为出色的，卓越的交易者。我们来日方长，后会有期。感谢收看交易作为置业。我是太妃，我们在市场中见，我们在学习与成长的路上见。","pid":"p871"}],"sections":[],"wcount":9320}]</script>
<script>
const DATA = JSON.parse(document.getElementById('sitedata').textContent);
const paper = document.getElementById('paper');
const toc = document.getElementById('toc');
const searchInput = document.getElementById('search');

// total words across all chapters
const totalWc = DATA.reduce((a,c)=>a+(c.wcount||0),0);
document.getElementById('totalWords').textContent = `全书约 ${totalWc.toLocaleString()} 字 · ${DATA.length} 单元`;

// escape
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// 图号 → 图片锚点映射（img 后紧跟 cap，数据层已打 fid/fig）
const figAnchors = {};        // '图1-1' -> fid
const figIndex = [];          // [{num, cap, fid}]
DATA.forEach(ch=>{
  const collect=bs=>(bs||[]).forEach(b=>{ if(b.t==='img'&&b.fid){
    const num=b.fig||b.ilabel||'';
    const cap=b.cap||b.icap||'';
    figIndex.push({num:num, cap:cap, fid:b.fid});
    if(b.fig && !figAnchors[b.fig]) figAnchors[b.fig]=b.fid;
    if(b.ilabel && !figAnchors[b.ilabel]) figAnchors[b.ilabel]=b.fid;
  }});
  collect(ch.blocks); (ch.sections||[]).forEach(s=>collect(s.blocks));
});
// 正文里的「图X-Y」→ 可点击跳转。先转义，再把图号替换为 <a>
const FIGRE=/图\s*\d+\s*[-－—]\s*\d+/g;
function linkFigNums(text){
  let out='', last=0, m;
  FIGRE.lastIndex=0;
  while((m=FIGRE.exec(text))!==null){
    out+=esc(text.slice(last,m.index));
    const key=m[0].replace(/\s/g,'').replace(/[－—]/g,'-');
    if(figAnchors[key]){
      out+=`<a class="figref" data-fig="${key}" title="跳到图片">${esc(m[0])}</a>`;
    } else {
      out+=esc(m[0]);
    }
    last=m.index+m[0].length;
  }
  out+=esc(text.slice(last));
  return out;
}

// 跳到目标元素：懒加载图片会在滚动中撑高页面，多次校正保证落点精确（topbar 下留 70px）
function jumpTo(el){
  if(!el) return;
  const jump=()=>window.scrollTo({top:Math.max(0,Math.round(el.getBoundingClientRect().top+window.scrollY-70)),behavior:'instant'});
  jump(); setTimeout(jump,120); setTimeout(jump,450); setTimeout(jump,1000);
}
// build content + toc
let secIndex = 0;
let paraCounter = 0;
DATA.forEach((ch, ci)=>{
  // chapter
  const chap = document.createElement('section');
  chap.className='chapter'; chap.id='ch-'+ci;
  const wc = (ch.wcount||0).toLocaleString();
  chap.innerHTML = `<div class="chapter-head"><span class="badge">${esc(ch.icon)} / ${esc(ch.title)}</span><h1>${esc(ch.title)}</h1><div class="wcmeta">本章约 <b>${wc}</b> 字</div></div>`;
  // top-level blocks (before first section) — epub 首段即正文，不跳过
  const topBlocks=(ch.blocks||[]).slice();
  renderBlocks(topBlocks, chap);
  // toc chapter
  const chEl = document.createElement('div');
  chEl.className='toc-ch';
  chEl.innerHTML = `<div class="toc-ch-title"><span class="num">${esc(ch.icon)}</span><span class="name">${esc(ch.title)}</span><span class="wc">${wc}字</span><span class="arrow" title="折叠/展开小节">▾</span></div><div class="toc-secs"></div>`;
  const chTitle=chEl.querySelector('.toc-ch-title');
  chTitle.onclick=(e)=>{
    // 点箭头：仅折叠/展开小节，不跳转
    if(e.target.closest('.arrow')){ chEl.classList.toggle('closed'); return; }
    // 点标题主体：直接跳到对应章节
    jumpTo(document.getElementById('ch-'+ci));
    closeSidebar();
  };
  chEl.querySelector('.arrow').onclick=(e)=>{e.stopPropagation();chEl.classList.toggle('closed');};
  const secsEl = chEl.querySelector('.toc-secs');
  if(ch.sections.length===0){secsEl.innerHTML='<div class="toc-empty">（无小节）</div>';}
  ch.sections.forEach((s)=>{
    const sid='sec-'+secIndex;
    const sNode=document.createElement('article');
    sNode.className='section'+(s.level>=2?' lvl2':''); sNode.id=sid;
    sNode.innerHTML=`<h2>${esc(s.title)}</h2>`;
    renderBlocks(s.blocks, sNode);
    chap.appendChild(sNode);
    const link=document.createElement('a');
    link.className='toc-sec'+(s.level>=2?' lvl2':'');
    link.href='#'+sid; link.textContent=s.title; link.dataset.sid=sid;
    link.dataset.search=(s.title+' '+plainText(s.blocks)).toLowerCase();
    link.onclick=(e)=>{e.preventDefault();jumpTo(document.getElementById(sid));closeSidebar();};
    secsEl.appendChild(link);
    secIndex++;
  });
  paper.appendChild(chap);
  toc.appendChild(chEl);
});

// 将块序列渲染进容器：段落 + 紧随的图 → 左图右文并排
function renderBlocks(blocks, container){
  const arr=blocks||[];
  let i=0;
  while(i<arr.length){
    const b=arr[i];
    // 找「一个文字段 + 后面紧跟 img(可带 cap)」的组合
    if((b.t==='para') && i+1<arr.length && arr[i+1].t==='img'){
      const row=document.createElement('div'); row.className='fig-row';
      const figBox=document.createElement('div'); figBox.className='figmedia'; // 左侧图片容器
      const txtBox=document.createElement('div'); txtBox.className='fig-text';
      // 右栏：连续收集文字段，直到遇到图
      txtBox.appendChild(renderBlock(b));
      let j=i+1;
      // 左栏：图 + 其图注
      figBox.appendChild(renderBlock(arr[j])); j++;
      if(j<arr.length && arr[j].t==='cap'){ figBox.appendChild(renderBlock(arr[j])); j++; }
      // 右栏继续吃后续紧邻的文字段（最多到下一个图前），让讲解与图同框
      while(j<arr.length && arr[j].t!=='img'){
        txtBox.appendChild(renderBlock(arr[j])); j++;
        // 只吃1段，避免把整节文字都塞进右栏导致图过高
        break;
      }
      row.appendChild(figBox); row.appendChild(txtBox);
      container.appendChild(row);
      i=j; continue;
    }
    container.appendChild(renderBlock(b));
    i++;
  }
}

function renderBlock(b){
  if(b.t==='img'){
    const f=document.createElement('div'); f.className='figure';
    if(b.fid) f.id=b.fid;
    if(b.ilabel) f.dataset.label=b.ilabel;
    if(b.ctx && b.ctx.length) f.dataset.ctx=JSON.stringify(b.ctx); // SPLITCTX-FIX-v1
    const alt=b.cap||b.icap||'K线图';
    let html=`<img loading="lazy" src="${b.src}" alt="${esc(alt)}">`;
    if(b.ilabel){ html=`<span class="fig-tag">${esc(b.ilabel)}</span>`+html; }
    if(b.fig){
      html+=`<button class="fig-back" data-back="${b.fig}">↩ 回到正文提到「${b.fig}」处</button>`;
    }
    f.innerHTML=html;
    return f;
  }
  if(b.t==='cap'){
    const p=document.createElement('p'); p.className='cap'; p.dataset.pid=b.pid||('p'+(paraCounter++)); p.textContent=b.text; return p;
  }
  const p=document.createElement('p'); p.className='para'; p.dataset.pid=b.pid||('p'+(paraCounter++)); p.innerHTML=linkFigNums(b.text); return p;
}
function plainText(blocks){
  return blocks.filter(x=>x.t==='para'||x.t==='cap').map(x=>x.text).join(' ');

const SELKEY='pa-excerpts-v1';

/* ===== EXCERPT-ORDER-v1 摘录原文排序 ===== */
function _pidNum(pid){
  var m=/(\d+)/.exec(String(pid||'')); return m?parseInt(m[1],10):-1;
}
function _excerptCmp(a,b){
  var pa=_pidNum(a.pid), pb=_pidNum(b.pid);
  if(pa!==pb) return pa-pb;                    // 段落全局顺序
  var sa=(a.so==null?0:a.so), sb=(b.so==null?0:b.so);
  if(sa!==sb) return sa-sb;                     // 段内字符偏移
  return (a.time||0)-(b.time||0);               // 兜底：时间
}
function sortByDocOrder(arr){ return arr.slice().sort(_excerptCmp); }

/* ===== PID-FIX-v1 旧数据自愈：给空 pid 摘录反查补 pid ===== */
function healMissingPid(){
  try{
    var raw=localStorage.getItem('pa-excerpts-v1'); if(!raw) return;
    var arr=JSON.parse(raw||'[]'); if(!arr||!arr.length) return;
    var bad=arr.filter(function(x){return x && !x.pid;});
    if(!bad.length) return;
    var nodes=[].slice.call(document.querySelectorAll('[data-pid]'));
    if(!nodes.length) return;
    function norm(s){return String(s||'').replace(/\s+/g,'');}
    var changed=false;
    arr.forEach(function(x){
      if(!x || x.pid) return;
      var needle=norm(x.text||'').slice(0,16);
      if(!needle) return;
      for(var i=0;i<nodes.length;i++){
        var el=nodes[i]; var full=norm(el.textContent||'');
        var k=full.indexOf(needle);
        if(k>=0){
          x.pid=el.getAttribute('data-pid');
          x.so=k; x.eo=k+String(x.text||'').length;
          changed=true; break;
        }
      }
    });
    if(changed){
      // 用有序插入重建，保证存储顺序即原文顺序
      var sorted=sortByDocOrder(arr);
      localStorage.setItem('pa-excerpts-v1',JSON.stringify(sorted));
      excerpts=sorted;
      if(typeof renderNotes==='function') renderNotes();
      if(typeof updateNoteCount==='function') updateNoteCount();
    }
  }catch(e){}
}
/* 延迟一拍执行，确保正文段落已渲染；幂等，无坏数据时会自行返回 */
setTimeout(function(){try{healMissingPid();}catch(e){}}, 60);

function insertByOrder(exc){
  var i=0; while(i<excerpts.length && _excerptCmp(excerpts[i],exc)<=0) i++;
  excerpts.splice(i,0,exc);
}

function getChapterInfo(node){

  const spBox=el&&el.closest?el.closest('#spTxt'):null;
  if(spBox) return {ch:spBox.dataset.ch||'', sec:spBox.dataset.sec||''};

// 用 Range 包裹选区，生成带 data-eid 的高亮 span
function wrapSelection(cls){
  const sel=window.getSelection();
  if(!savedRange||sel.isCollapsed) return false;
  const range=savedRange;
  // 不允许跨多个段落的复杂选区
  if(range.startContainer===range.endContainer && range.startContainer.nodeType===3){
    const span=document.createElement('span');
    span.className=cls; span.dataset.eid='e'+Date.now()+Math.random().toString(36).slice(2,6);
    try{range.surroundContents(span);}catch(e){return false;}
    return span;
  }
  // 跨节点：用 extractContents 包住
  try{
    const span=document.createElement('span');
    span.className=cls; span.dataset.eid='e'+Date.now()+Math.random().toString(36).slice(2,6);
    span.appendChild(range.extractContents()); range.insertNode(span);
    return span;
  }catch(e){return false;}
}
function addExcerpt(cls,color){
  const sel=window.getSelection();
  if(!savedRange||sel.toString().trim().length===0){sel.removeAllRanges();selbar.classList.remove('show');return;}
  const text=sel.toString().trim();
  // ⚠️ 必须在 wrapSelection 之前计算：包装会改变 DOM，使 savedRange 容器失效
  const info=getChapterInfo(savedRange.startContainer);
  let pid='', so=0, eo=0;
  const sc=savedRange.startContainer;
  // PID-FIX-v1: 兼容 p 与 h2 小标题，且覆盖选区起点为元素节点的情况
  const para=(function(n){
    if(!n) return null;
    if(n.nodeType===3) n=n.parentElement;
    if(!n) return null;
    if(n.nodeType===1 && n.hasAttribute && n.hasAttribute('data-pid')) return n;
    return n.closest ? n.closest('[data-pid]') : null;
  })(sc);
  if(para){
    pid=para.dataset.pid;
    try{
      const pre=document.createRange();pre.selectNodeContents(para);pre.setEnd(sc,savedRange.startOffset);
      so=pre.toString().length; eo=so+text.length;
    }catch(e){}
  }
  const span=wrapSelection(cls);
  const eid=span?span.dataset.eid:('e'+Date.now());
  if(para && pid && eo>so){
    const spBox=document.getElementById('spTxt');
    const inSplit=!!(para.closest && para.closest('#spTxt'));
    const other=inSplit?paper:spBox;
    if(other) paintMarkInPara(other,pid,so,eo,cls,eid);
  }
  insertByOrder({
    id:eid, text:text, ch:info.ch, sec:info.sec,
    cls:cls, color:color, time:Date.now(), pid:pid, so:so, eo:eo
  });
  saveExcerpts(); renderNotes();
  sel.removeAllRanges(); savedRange=null; selbar.classList.remove('show');
}
// 取消标记：展开 span、移除对应摘录
function unwrapMark(span){
  const parent=span.parentNode;
  while(span.firstChild) parent.insertBefore(span.firstChild,span);
  parent.removeChild(span);
}
// 找出当前选区内(相交)的、指定 class 的高亮 span
function marksInSelection(cls){
  if(!savedRange) return [];
  return [...document.querySelectorAll('span[data-eid]')].filter(s=>{
    if(cls && !s.classList.contains(cls)) return false;
    try{return savedRange.intersectsNode(s);}catch(e){return false;}
  });
}
function removeMarks(spans){
  const ids=new Set(spans.map(s=>s.dataset.eid));
  document.querySelectorAll('span[data-eid]').forEach(s=>{
    if(ids.has(s.dataset.eid)) unwrapMark(s);
  });
  excerpts=excerpts.filter(x=>!ids.has(x.id));
  saveExcerpts(); renderNotes();
}

    if(allMarks.length){

// 在指定容器的对应段落按 pid + 字符偏移套高亮 span（主文档与分屏共用同一套数据）
function paintMarkInPara(root, pid, so, eo, cls, eid){
  if(!root||!pid||so===undefined||eo===undefined||eo<=so) return false;
  const para=root.querySelector('p[data-pid="'+pid+'"]');
  if(!para) return false;
  if(eid && para.querySelector('span[data-eid="'+eid+'"]')) return true;
  const walker=document.createTreeWalker(para,NodeFilter.SHOW_TEXT,null,false);
  let acc=0, sn=null, soff=0, en=null, eoff=0, node;
  while((node=walker.nextNode())){
    const len=node.textContent.length;
    if(sn===null && acc+len>so){sn=node;soff=so-acc;}
    if(acc+len>=eo){en=node;eoff=eo-acc;break;}
    acc+=len;
  }
  if(!sn) sn=en; if(!en) en=sn;
  if(!sn||!en) return false;
  try{
    const r=document.createRange();r.setStart(sn,soff);r.setEnd(en,eoff);
    const span=document.createElement('span');
    span.className=cls;span.dataset.eid=eid;
    span.appendChild(r.extractContents());r.insertNode(span);
    return true;
  }catch(e){return false;}
}
function restoreHighlightsIn(root){
  let ok=0;
  excerpts.forEach(x=>{
    if(!x.cls||!x.pid||x.so===undefined) return;

/* ================= 分屏阅读模式：点图 -> 侧栏折叠 + 左图右文铺满全屏 ================= */
const splitPages=[];
document.querySelectorAll('#paper .figure').forEach((fEl)=>{
  const imgEl=fEl.querySelector('img');

  let ctx=[];

  }
  splitPages.push({
    src:imgEl.src,
    cap:capEl?capEl.textContent:'',

    label:fEl.dataset.label||'',

    ch:ch?(ch.querySelector('h1')?.textContent||''):'',

});
const splitReader=document.getElementById('splitReader');
const spImg=document.getElementById('spImg');
const spTxt=document.getElementById('spTxt');
spTxt.addEventListener('scroll',()=>selbar.classList.remove('show'),{passive:true});
const spTitle=document.getElementById('spTitle');
const spPos=document.getElementById('spPos');
let spCur=0;
function renderSplit(i){
  if(i<0||i>=splitPages.length) return;

  const tag=p.label||p.fig||'';

  spTxt.dataset.ch=p.ch||''; spTxt.dataset.sec=p.sec||'';
  spTxt.innerHTML='<div class="sp-label">'+label+'</div>'+(p.text||'<p class="para">（本图暂无配套正文，可点上方左右箭头继续）</p>');

}
function openSplit(i){
  if(window.matchMedia && window.matchMedia('(max-width:720px)').matches) return; /* MOBUI-v1 手机端不分屏 */
  if(i<0||i>=splitPages.length) return;
  renderSplit(i);
  splitReader.classList.add('show');
  document.body.classList.add('split-mode');
}
function closeSplit(){
  splitReader.classList.remove('show');

}
document.getElementById('spClose').onclick=closeSplit;
document.getElementById('spPrev').onclick=()=>renderSplit((spCur-1+splitPages.length)%splitPages.length);
document.getElementById('spNext').onclick=()=>renderSplit((spCur+1)%splitPages.length);
// 分屏内点图不再放大：保持左图右文，避免图片突然变大铺满屏幕
spImg.addEventListener('click',e=>{
  if(e.target.tagName!=='IMG')return;
  closeSplit(); /* 再点一下左图：关闭分屏回到正文 */
});
document.addEventListener('keydown',e=>{
  if(!splitReader.classList.contains('show'))return;
  if(e.key==='Escape'){closeSplit();}

});

<script>
(function(){
  var KEY='pa-reading-time-v1', BOOK='taifei-web', IDLE=90000, store={};
  try{store=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){store={}}
  var NAMES={'price-action-web':'日本蜡烛图','advanced-trend-web':'高级趋势','wave-range-web':'高级波段','pa-best-trades-web':'最佳交易策略','price-action-kbar-web':'逐K阅读','taifei-web':'太妃课程'};
  function dayStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function today(){return dayStr(new Date());}
  function bucket(day){if(!store[day])store[day]={};return store[day];}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
  function fmt(ms){
    var s=Math.floor((ms||0)/1000);
    if(s<60)return s+' 秒';
    var m=Math.floor(s/60);
    if(m<60)return m+' 分钟';
    var h=Math.floor(m/60),mm=m%60;
    return mm?(h+' 小时 '+mm+' 分'):(h+' 小时');
  }
  var lastAction=Date.now(), lastTick=Date.now(), dirty=0, running=false;
  var btn=document.getElementById('readTimer');
  function tick(){
    var now=Date.now(), gap=now-lastTick; lastTick=now;
    var ok=!document.hidden&&(now-lastAction<IDLE);
    if(ok){
      if(!running){running=true;btn.classList.add('live');}
      var dt=Math.min(gap,3000), day=today();
      bucket(day)[BOOK]=(bucket(day)[BOOK]||0)+dt;
      dirty+=dt;
      if(dirty>=5000){dirty=0;save();paint();}
    }else if(running){
      running=false;save();paint();btn.classList.remove('live');
    }
  }
  function paint(){
    var day=today(), mine=bucket(day)[BOOK]||0;
    document.getElementById('rtToday').textContent=fmt(mine);
    document.getElementById('rtPopTotal').textContent=fmt(mine);
    var obj=store[day]||{};
    var rows=Object.keys(obj).filter(function(k){return obj[k]>0;}).sort(function(a,b){return obj[b]-obj[a];});
    document.getElementById('rtPopBooks').innerHTML=rows.map(function(k){
      return '<div class="rt-row"><span>'+(NAMES[k]||k)+'</span><b>'+fmt(obj[k])+'</b></div>';
    }).join('')||'<div class="rt-row"><span>暂无记录</span><b>—</b></div>';
    var days=[];
    for(var i=6;i>=0;i--){
      var d=new Date(); d.setDate(d.getDate()-i);
      var key=dayStr(d), sum=0, o=store[key]||{};
      Object.keys(o).forEach(function(k){sum+=o[k]||0;});
      days.push({key:key,sum:sum,label:(d.getMonth()+1)+'/'+d.getDate()});
    }
    var mx=Math.max.apply(null,days.map(function(x){return x.sum;}).concat([1]));
    document.getElementById('rtPopBars').innerHTML=days.map(function(x,i){
      var h=Math.max(2,Math.round(x.sum/mx*40));
      return '<div class="rt-bar'+(i===6?' today':'')+'" title="'+x.key+' '+fmt(x.sum)+'"><i style="height:'+h+'px"></i><em>'+x.label+'</em></div>';
    }).join('');
  }
  ['mousemove','mousedown','keydown','scroll','touchstart','wheel'].forEach(function(ev){
    window.addEventListener(ev,function(){lastAction=Date.now();},{passive:true});
  });
  document.addEventListener('visibilitychange',function(){
    lastTick=Date.now();
    if(document.hidden){save();paint();btn.classList.remove('live');running=false;}
  });
  window.addEventListener('blur',function(){save();paint();});
  window.addEventListener('beforeunload',function(){save();});
  btn.addEventListener('click',function(e){
    e.stopPropagation(); paint();
    document.getElementById('rtPop').classList.toggle('show');
  });
  document.addEventListener('click',function(e){
    if(!e.target.closest('.rt-wrap'))document.getElementById('rtPop').classList.remove('show');
  });
  setInterval(tick,1000);
  paint();
})();
</script>

<script>
/* pa-backup-sync-v1 数据备份 + Gist 云同步 v1 ===== */
(function(){
if(window.__PA_BK) return; window.__PA_BK=1;
var KEY_T='pa-reading-time-v1', KEY_E='pa-excerpts-v1', KEY_D='pa-excerpts-tomb-v1';
var KEY_C='pa-corrections-v1';
var KEY_CFG='pa-sync-cfg-v1', GFILE='pa_reader_data.json';
var DEF_TOKEN='', DEF_GIST='c6615575d788f7371bcd8fb4494fedc8';
var NAMES={'price-action-web':'日本蜡烛图','advanced-trend-web':'高级趋势','wave-range-web':'高级波段','pa-best-trades-web':'最佳交易策略','price-action-kbar-web':'逐K阅读','taifei-web':'太妃课程'};

var cfg={}; try{cfg=JSON.parse(localStorage.getItem(KEY_CFG)||'{}')||{}}catch(e){}

if(cfg.enabled===undefined) cfg.enabled=true;
function saveCfg(){try{localStorage.setItem(KEY_CFG,JSON.stringify(cfg));}catch(e){}}

function readLS(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}}
function getT(){return readLS(KEY_T,{});}
function getE(){return readLS(KEY_E,[]);}
function getD(){return readLS(KEY_D,[]);}
function getC(){return readLS(KEY_C,{});}
function setT(v){try{localStorage.setItem(KEY_T,JSON.stringify(v));}catch(e){}}
function setE(v){try{localStorage.setItem(KEY_E,JSON.stringify(v));}catch(e){}}
function setD(v){try{localStorage.setItem(KEY_D,JSON.stringify(v));}catch(e){}}
function setC(v){try{localStorage.setItem(KEY_C,JSON.stringify(v));}catch(e){}}

/* 合并：阅读时长按 天+书 取 max；删除墓碑按 id 取最新；摘录按 id 合并、 tomb 中的剔除 */
/* MERGEFIX-v1: 摘录对象用 time 字段，兼容读取 t/time */
function excTime(x){return (x&&(x.t||x.time))||0;}
function mergeData(a){
  suppressPush=true;
  try{
  var t=getT(), e=getE(), d=getD();
  var _corr=getC(), _corrChanged=false;
  if(a.readingTime&&typeof a.readingTime==='object'){
    Object.keys(a.readingTime).forEach(function(day){
      if(!t[day]) t[day]={};
      var src=a.readingTime[day]||{};
      Object.keys(src).forEach(function(k){ t[day][k]=Math.max(t[day][k]||0,src[k]||0); });
    });
  }
  var dm={}; d.forEach(function(x){dm[x.id]=Math.max(dm[x.id]||0,x.t||0);});
  (a.excTomb||[]).forEach(function(x){dm[x.id]=Math.max(dm[x.id]||0,x.t||0);});
  var em={}; e.forEach(function(x){
    if(!x||!x.id) return;
    if((dm[x.id]||0)>=excTime(x)) return; /* 本地项已被墓碑删除 */
    em[x.id]=x;
  });
  (a.excerpts||[]).forEach(function(x){
    if(!x||!x.id) return;
    if((dm[x.id]||0)>=excTime(x)) return; /* 云端项已被墓碑删除 */
    if(!em[x.id] || excTime(x)>excTime(em[x.id])) em[x.id]=x;
  });
  setT(t); setD(Object.keys(dm).map(function(id){return {id:id,t:dm[id]};}));
  setE(Object.keys(em).map(function(id){return em[id];}));
  if(a.corrections&&typeof a.corrections==='object'){
    Object.keys(a.corrections).forEach(function(k){
      var r=a.corrections[k]; if(!r||typeof r!=='object') return;
      if(!_corr[k] || (r.ts||0)>(_corr[k].ts||0)){ _corr[k]=r; _corrChanged=true; }
    });
    if(_corrChanged) setC(_corr);
  }
  }finally{ suppressPush=false; }
}
/* ===== LOCALSNAP-v1 本地自动快照（保险层，独立于云同步） ===== */
(function(){
  if(window.__PA_LOCALSNAP) return; window.__PA_LOCALSNAP=1;
  var SNAPKEY='pa-local-snaps-v1', CFGKEY='pa-sync-cfg-v1', MAX=5;
  function lcfg(){
    try{var c=JSON.parse(localStorage.getItem(CFGKEY)||'{}')||{};
      if(c.localSnap===undefined) c.localSnap=true; return c;
    }catch(e){return {localSnap:true};}
  }
  function lread(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}}
  function current(){
    try{ if(typeof snapshot==='function') return snapshot(); }catch(e){}
    return {v:1,app:'pa-reader',exportedAt:new Date().toISOString(),
      readingTime:lread('pa-reading-time-v1',{}),excerpts:lread('pa-excerpts-v1',[]),
      excTomb:lread('pa-excerpts-tomb-v1',[]),corrections:lread('pa-corrections-v1',{})};
  }
  function getSnaps(){return lread(SNAPKEY,[]);}
  function setSnaps(a){try{localStorage.setItem(SNAPKEY,JSON.stringify(a));}catch(e){}}
  function saveSnap(force){
    if(!lcfg().localSnap) return false;
    var d=current(), snaps=getSnaps();
    var payload=JSON.stringify([d.excerpts||[],d.corrections||{},d.readingTime||{},d.excTomb||[]]);
    if(snaps[0] && snaps[0].sig===payload && !force) return false;
    snaps.unshift({ts:Date.now(),sig:payload,data:d});
    if(snaps.length>MAX) snaps=snaps.slice(0,MAX);
    setSnaps(snaps);
    return true;
  }
  var _snapTimer=null;
  function scheduleSnap(){clearTimeout(_snapTimer);_snapTimer=setTimeout(function(){saveSnap(false);},1200);}
  // 1) 摘录等数据写入：包装 setItem 捕获（含本页直接写入）
  var _origSI=Storage.prototype.setItem;
  Storage.prototype.setItem=function(k,v){
    _origSI.call(this,k,v);
    if(k==='pa-excerpts-v1'||k==='pa-corrections-v1'||k==='pa-reading-time-v1'||k==='pa-excerpts-tomb-v1') scheduleSnap();
  };
  // 2) 页面刷新统一出口
  window.addEventListener('pa-data-changed',scheduleSnap);
  // 3) 首次基线
  setTimeout(function(){ if(getSnaps().length===0) saveSnap(true); },2500);
  window.PA_SNAP={
    list:getSnaps,
    save:function(){return saveSnap(true);},
    restore:function(idx){
      var s=getSnaps()[idx]; if(!s) return false; var d=s.data;
      try{
        if(d.readingTime)localStorage.setItem('pa-reading-time-v1',JSON.stringify(d.readingTime));
        if(d.excerpts)localStorage.setItem('pa-excerpts-v1',JSON.stringify(d.excerpts));
        if(d.excTomb)localStorage.setItem('pa-excerpts-tomb-v1',JSON.stringify(d.excTomb));
        if(d.corrections)localStorage.setItem('pa-corrections-v1',JSON.stringify(d.corrections));
      }catch(e){return false;}
      try{ if(typeof refresh==='function') refresh(); }catch(e){}
      return true;
    }
  };
  function enh(){
    var panel=document.getElementById('bkPanel'); if(!panel||panel.dataset.snapUI) return;
    panel.dataset.snapUI='1';
    var c=lcfg(), snaps=getSnaps();
    function fmt(ts){var d=new Date(ts);return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
    var box=document.createElement('div');
    box.style.cssText='margin-top:14px;padding-top:12px;border-top:1px solid var(--line)';
    var html='<div class="row" style="font-size:13px;font-weight:700">🛟 本地自动快照（保险层）</div>'+
      '<div class="row"><label style="font-size:12.5px"><input type="checkbox" id="snapOn" '+(c.localSnap?'checked':'')+'> 数据变化时自动存快照（最多5份）</label></div>'+
      '<p style="font-size:11.5px;color:var(--muted);line-height:1.6;margin:6px 0">'+
      '快照仅存本机浏览器，不联网。同步万一看错/丢失，点下方时间可回滚到出错前。<br>'+
      '<b>换电脑</b>：用顶栏「导出备份」把数据存成文件带走，在新电脑「导入」即可恢复——快照本身跨不了设备。</p>'+
      '<div class="row"><button class="bk-btn" id="snapNow">立即存一份</button></div>';
    if(snaps.length){
      html+='<div style="font-size:12px;margin-top:8px">最近快照（点「回滚」恢复）：</div>';
      snaps.forEach(function(s,i){
        var cnt=(s.data&&s.data.excerpts)? s.data.excerpts.length:'?';
        html+='<div class="row" style="justify-content:space-between;font-size:12px">'+
          '<span>'+fmt(s.ts)+' · 摘录'+cnt+'条'+(i===0?' · 最新':'')+'</span>'+
          '<button class="bk-btn snap-restore" data-i="'+i+'">回滚</button></div>';
      });
    } else {
      html+='<div style="font-size:12px;color:var(--muted);margin-top:8px">暂无快照（首次使用约几秒后自动生成）</div>';
    }
    box.innerHTML=html;
    var firstRow=panel.querySelector('.row'); if(firstRow) firstRow.parentNode.insertBefore(box,firstRow); else panel.appendChild(box);
    document.getElementById('snapOn').onchange=function(){
      var cc=lcfg(); cc.localSnap=this.checked;
      try{localStorage.setItem(CFGKEY,JSON.stringify(cc));}catch(e){}

      window.PA_SNAP.save();
      try{ if(typeof closePanel==='function')closePanel(); if(typeof openPanel==='function')openPanel(); }catch(e){}
    };
    box.querySelectorAll('.snap-restore').forEach(function(btn){
      btn.onclick=function(){
        var i=+btn.getAttribute('data-i');
        if(!window.confirm('确定回滚到该快照？当前摘录/修改会被该快照覆盖（快照本身仍保留）。'))return;
        if(window.PA_SNAP.restore(i)){
          try{ if(typeof push==='function') push(); }catch(e){}
          try{ if(typeof closePanel==='function')closePanel(); if(typeof openPanel==='function')openPanel(); }catch(e){}
        }
      };
    });
  }
  var mo=new MutationObserver(function(){ if(document.getElementById('bkPanel')) enh(); });
  mo.observe(document.body,{childList:true,subtree:true});
})();
function snapshot(){
  return {v:1,app:'pa-reader',exportedAt:new Date().toISOString(),readingTime:getT(),excerpts:getE(),excTomb:getD(),corrections:getC()};
}
function refresh(){
  if(window.PAProof&&PAProof.apply){try{PAProof.apply();}catch(e){}}
  if(typeof renderNotes==='function'){try{renderNotes();}catch(e){}}
  if(typeof updateNoteCount==='function'){try{updateNoteCount();}catch(e){}}
  window.dispatchEvent(new CustomEvent('pa-data-changed'));
}

/* --- UI 状态 --- */
function dot(cls,msg,err){var el=document.getElementById('bkDot');if(el)el.className='bk-dot'+(cls?' '+cls:'');var m=document.getElementById('bkMsg');if(m){m.textContent=msg;m.className='bk-msg'+(err?' err':'');}}
function stat(){
  var el=document.getElementById('bkStat'); if(!el)return;
  var t=getT(),days=Object.keys(t).length,total=0;
  Object.keys(t).forEach(function(d){Object.keys(t[d]).forEach(function(k){total+=t[d][k]||0;});});
  el.innerHTML='摘录 <b>'+getE().length+'</b> 条 · 阅读记录 <b>'+days+'</b> 天 · 累计 <b>'+Math.round(total/60000)+'</b> 分钟'+
    ' · 云同步 <b>'+(cfg.enabled?'已开启':'已关闭')+'</b> · Gist <code>'+(cfg.gistId||'未绑定')+'</code>';

/* --- 导出 / 导入 --- */
function doExport(){
  var data=JSON.stringify(snapshot(),null,2);
  var blob=new Blob([data],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='PA阅读数据备份_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);

}
function doImport(){document.getElementById('bkFile').click();}
function handleFile(ev){
  var f=ev.target.files[0]; if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||(!d.readingTime&&!d.excerpts)) throw new Error('文件格式不对');
      var mode=window.confirm('点「确定」= 合并导入（保留双方数据，推荐）\n点「取消」= 覆盖导入（用文件完全替换本机数据）');
      if(mode){ mergeData(d); }
      else { if(d.readingTime)setT(d.readingTime); if(d.excerpts)setE(d.excerpts); if(d.excTomb)setD(d.excTomb); if(d.corrections)setC(d.corrections); }
      refresh(); stat(); dot('ok','导入成功：摘录 '+getE().length+' 条'); push();
      closePanel();
    }catch(err){dot('err','导入失败：'+err.message,true);}
  };
  r.readAsText(f); ev.target.value='';
}

/* --- Gist 同步 --- */
function api(method,path,body){
  var opt={method:method,headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','User-Agent':'pa-reader'}};
  if(body){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
  return fetch('https://api.github.com'+path,opt).then(function(r){
    if(r.status===401) throw new Error('Token 失效');
    if(r.status===403) throw new Error('请求被限流');
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  });
}
var busy=false, dirty=false, timer=null, lastOk=0, suppressPush=false;
function pull(silent){
  if(!cfg.enabled||!cfg.token||!cfg.gistId){if(!silent)dot('err','未开启同步',true);return Promise.resolve(false);}
  if(busy)return Promise.resolve(false); busy=true; dot('busy','正在从云端读取…');
  return api('GET','/gists/'+cfg.gistId).then(function(g){
    var f=g.files&&g.files[GFILE];
    if(!f) throw new Error('云端文件不存在');
    var content=f.truncated?null:f.content;
    var pr=content?Promise.resolve(content):fetch(f.raw_url).then(function(r){return r.text();});
    return pr.then(function(txt){
      var d=JSON.parse(txt); mergeData(d); refresh(); stat();
      lastOk=Date.now(); dot('ok','已同步 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}));
      return true;
    });
  }).catch(function(e){dot('err','云端读取失败：'+e.message+'（本机数据不受影响）',true);return false;})
    .then(function(ok){busy=false;return ok;});
}
function push(){
  if(!cfg.enabled||!cfg.token||!cfg.gistId)return Promise.resolve(false);
  if(busy){dirty=true;return Promise.resolve(false);}
  busy=true; dot('busy','正在保存到云端…');
  var files={}; files[GFILE]={content:JSON.stringify(snapshot(),null,2)};
  return api('PATCH','/gists/'+cfg.gistId,{files:files}).then(function(){
    lastOk=Date.now(); dirty=false; dot('ok','已保存 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})); return true;
  }).catch(function(e){dirty=true;dot('err','保存失败：'+e.message+'（已排队重试）',true);return false;})
    .then(function(ok){busy=false;return ok;});
}
function schedulePush(){dirty=true;clearTimeout(timer);timer=setTimeout(function(){if(dirty)push();},800);}
function syncNow(){ pull(true).then(function(ok){ if(ok&&dirty) return push(); }); }

/* 数据变化时自动推送：监听两种 storage 写入（同页通过包装 setItem） */
var _si=Storage.prototype.setItem;
Storage.prototype.setItem=function(k,v){
  _si.call(this,k,v);
  if((k===KEY_E||k===KEY_T||k===KEY_D||k===KEY_C)&&cfg.enabled&&!suppressPush) schedulePush();
};

  if(!isHub){
