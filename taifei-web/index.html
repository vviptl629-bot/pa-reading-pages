磁体已经大有可为。那现在我再次将所有的标记重新移除，还给你一张干净的图表。希望你也可以练习，屏幕前所学，徒手还原刚刚我们展示过的所有磁体。甚至我还期待你能够读得更细，发现更多刚刚没有顺过的内容。","p":"p421"}]},{"t":"para","text":"这趟读下来，相信你已经体认到多数的转折都有道理。而且我们所教的磁体已经大有可为。那现在我再次将所有的标记重新移除，还给你一张干净的图表。希望你也可以练习，屏幕前所学，徒手还原刚刚我们展示过的所有磁体。甚至我还期待你能够读得更细，发现更多刚刚没有顺过的内容。","pid":"p421"},{"t":"img","src":"assets/img/l10B_164.webp","ilabel":"10-21","icap":"L10　等距运动原理","fid":"fig164","ctx":[{"t":"这趟读下来，相信你已经体认到多数的转折都有道理。而且我们所教的磁体已经大有可为。那现在我再次将所有的标记重新移除，还给你一张干净的图表。希望你也可以练习，屏幕前所学，徒手还原刚刚我们展示过的所有磁体。甚至我还期待你能够读得更细，发现更多刚刚没有顺过的内容。","p":"p421"},{"t":"比如，对于隔天的交易日来说，今天上升趋势的最高点与最低点显然非常重要，会是首要的测试对象。而上升趋势中的重要波段点也应该被辨识出来。如果明天价格触及，很可能会在这些地方又有反弹。多多练习几次，读图的时候该注意什么，就会越来越熟练。我们接下来就带着这份精进的期许继续来读另一张图表。","p":"p422"}]},{"t":"para","text":"比如，对于隔天的交易日来说，今天上升趋势的最高点与最低点显然非常重要，会是首要的测试对象。而上升趋势中的重要波段点也应该被辨识出来。如果明天价格触及，很可能会在这些地方又有反弹。多多练习几次，读图的时候该注意什么，就会越来越熟练。我们接下来就带着这份精进的期许继续来读另一张图表。","pid":"p422"},{"t":"img","src":"assets/img/l10B_165.webp","ilabel":"10-22","icap":"L10　等距运动原理","fid":"fig165","ctx":[{"t":"比如，对于隔天的交易日来说，今天上升趋势的最高点与最低点显然非常重要，会是首要的测试对象。而上升趋势中的重要波段点也应该被辨识出来。如果明天价格触及，很可能会在这些地方又有反弹。多多练习几次，读图的时候该注意什么，就会越来越熟练。我们接下来就带着这份精进的期许继续来读另一张图表。","p":"p422"},{"t":"这里的K线就细了一点，主要是因为有两个交易日，而我先把右半边折起来。接着，我们对第一天先来进行同样的事后角度的练习，标记出你所该观察到的所有磁体。第二天则以逐步显露的方式来确认磁体是否如其发挥作用，追求更逼真于遭遇现场的练习。想要练习看看的朋友，可以先暂停影片仔细的来读一下，第一天左半边的图表。看看能不能把关键位置和价格可能为什么在这些地方转折都研究出来？好，我们来讲解看看。刚刚有试图练习的朋友，应该感受得出来，这天比较没有前个例子那么容易读。比如很容易在这个下降的通道中迷失方向，搞不太清楚价格何以波动。这时候，趋势线与通道线的工具可以派上用场。一旦进行端点的连线，你将发现这其实是一个扩张的下降通道，整体斜率向下。就如均线显示的一样。不过，内部的政府比较大，比较反复，有些双边交易的特征。那你肯定还记得下降通道就是牛旗倾向上破，但有低几率下破。而一旦下破，就如先前说到的区间与形态的突破，同样将造成等距扩张失败的形态毅然。于是，价格最后确实在这附近失去动能，反转向上。为什么失败的形态没有朝预期方向突破的形态也能造就等距运动呢？我们来考验看看空头的止损将摆放于何处。它应该位于某个重要的波段点之外。回顾这段下跌，我们在第一根急速阴线终止进入回调以后，其实每次对于原趋势极值的突破都不太利落。我们很难在真正清晰突破成功以前就确定重要波段点在哪里。所以最保险的方法还是等到真正有顺畅的下跌以后再进行标记。当价格发展到牛旗被向下突破，回头能够确认的回调高点就会是这个位置，即下降通道的起点。所以说做空的交易者会将止损放在这里的话，那么突破瞬间作为最早最幸运一批空头的入场点。它们的止盈位置就将是这段距离的等距。在突破中入场的做空交易者赶上了下跌趋势的60%，胜率优势能够通过争取等剧利润来获得正向期望。于是他们止盈的位置也将会是反向买单聚集的地方。这就造成了无论形态是按预期方向突破，还是按非预期方向反向突破，我们都能够期待等距扩张。好的，总之价格在这里陷入了止盈启动的回调。你可以看得很清楚，是二推的AB=CD回调，价格终结上涨的位置，既是这段窄幅下降通道的50%回调处。同时，受到均线的阻抗，还对刚刚的突破点进行了测试。后续的下跌则同样是AB=CD有点过冲就是了，受到更下方的原趋势极值所吸引。测试了一下，又收起来，最后小幅震荡到收盘。眼看这里运动超过了20根K线,上下各有一次突破失败，你可以将这里视作区间。标记出它的上下缘。又或者你更倾向将它看作有点收敛的下降通道，那也没有问题，同样连接上下各两个转折点。你能够得到比较斜的趋势线以及比较缓的通道线。如果隔天行情也在目前图表的高低范围内震动，那么我们现在所标记出的所有磁体。就会需要重点注意的部分。明天行情在这些地方可能会有转折的迹象。准备好读逐步显露的图表了吗？一起来看看会发生什么事。首先，一根趋势，阳线跳空高开，触及昨日区间的上缘。然后失去跟进，反转向下，在均线处收了下影线。那么显然，上方的转折是对于昨日区间的再次突破失败，预先标记好的磁体的确派上用场。对于空头来说，他们可能是希望造就一个大型的双重顶，然后进一步开启下跌。那的确空头确实又进一步发力，跌破了前五根K线所构成的开盘区间。这时候我们就要紧密关注下方多重磁体重叠的位置，包括开盘区间等距扩张的目标。以及昨天的区间下缘，昨天画记的楔形通道线。而我们看到的是价格确实反转走高，就在这些复合磁体处失去动能。这就让昨天一直延续到今天的这个大区间，这个双重顶变成了末端旗型。过程中也已经有对趋势线的突破，有充足积累的买压，也有对原趋势极值的不及测试。将可能开启大型趋势反转。价格越过均线，一路上行，在今天的高点处，没有遭到阻拦，但是加速往上跑。去测试了，昨天这个失败牛旗的起点，也是昨天画出的重要波段点。这里K线放大，且最后一根K线运动幅度遥远的样子，呈现的就是被磁体吸引的高潮运动。我们可以想象过程中有真空效应的作用。而出现之后，急转直下，可能到哪里去呢？我们也该找到这段上行的所有重要波段点了。从最低点开始是上涨，但K线回调在强劲突破，这里可能是一个。后续同样是回调后再次顺利突破，在此处又留下一个重要波段点。而从顶端折返下降的路程中，在一个关键位置获得撑起，这里是重要波段点，重合50%回调的位置。多头认为，前方的上涨动能十足强劲，再回调到一半的位置继续做多应该是有数学优势的做法。而后续价格就又一路上涨到收盘。同样，如果你希望今天的读图结果对明天的交易也有帮助，你就要更新所有该注意的波段点。我们前头一再强调价格的波动，说穿了，这是从一个磁体运动到另一个磁体的过程。折返往复。所以知道哪里可能存在反向订单是非常重要的关键技能。也是我们要花两个单元的时间细究的根本原因。好的，复习到了这里，关于磁体的内容就到尾声了。","p":"p423"},{"t":"在前面的讲解里，为了节省大家的时间并维持知识密度与节奏，我只进行了必要的举例示范。呈现的例子一点都不算多。所以你要知道，光是看过这几张图表是不够的。你一定要确保你知道所有前述介绍的方法和原理，然后自己找图表来进行大量的练习。大家都走过求学阶段，值得考试前多写题目，习作评量，是考出高分的必经之路。我说我喜欢摄影，我也深知大量阅读摄影集尝试街拍风景人像，也同样是精进摄影之眼的不二法门。所以交易也是这样的，你与阿尔布鲁克斯的距离就是图表阅读量的距离。据他自己说，他已经每天阅读E-min S&P图表持续了30年。扣除节假日从未间断的读，但它已经细致的逐根的读过了7560张图表，超过了60万根K线。所以如果你也希望能够准确地抓到价格行为的脉动,读就对了,阅读和练习能使你富有，我们就从现在开始。下个单元我们要介绍此地之外的另一种重要读图技术，如何数推，如何数K线。如果说磁体是告诉你价格运动从哪里来，要往哪里去，那数推能够一定程度的告诉你。可能怎么到？还有多久到？感谢收看等距运动原理，我们下个单元见。","p":"p424"}]},{"t":"para","text":"这里的K线就细了一点，主要是因为有两个交易日，而我先把右半边折起来。接着，我们对第一天先来进行同样的事后角度的练习，标记出你所该观察到的所有磁体。第二天则以逐步显露的方式来确认磁体是否如其发挥作用，追求更逼真于遭遇现场的练习。想要练习看看的朋友，可以先暂停影片仔细的来读一下，第一天左半边的图表。看看能不能把关键位置和价格可能为什么在这些地方转折都研究出来？好，我们来讲解看看。刚刚有试图练习的朋友，应该感受得出来，这天比较没有前个例子那么容易读。比如很容易在这个下降的通道中迷失方向，搞不太清楚价格何以波动。这时候，趋势线与通道线的工具可以派上用场。一旦进行端点的连线，你将发现这其实是一个扩张的下降通道，整体斜率向下。就如均线显示的一样。不过，内部的政府比较大，比较反复，有些双边交易的特征。那你肯定还记得下降通道就是牛旗倾向上破，但有低几率下破。而一旦下破，就如先前说到的区间与形态的突破，同样将造成等距扩张失败的形态毅然。于是，价格最后确实在这附近失去动能，反转向上。为什么失败的形态没有朝预期方向突破的形态也能造就等距运动呢？我们来考验看看空头的止损将摆放于何处。它应该位于某个重要的波段点之外。回顾这段下跌，我们在第一根急速阴线终止进入回调以后，其实每次对于原趋势极值的突破都不太利落。我们很难在真正清晰突破成功以前就确定重要波段点在哪里。所以最保险的方法还是等到真正有顺畅的下跌以后再进行标记。当价格发展到牛旗被向下突破，回头能够确认的回调高点就会是这个位置，即下降通道的起点。所以说做空的交易者会将止损放在这里的话，那么突破瞬间作为最早最幸运一批空头的入场点。它们的止盈位置就将是这段距离的等距。在突破中入场的做空交易者赶上了下跌趋势的60%，胜率优势能够通过争取等剧利润来获得正向期望。于是他们止盈的位置也将会是反向买单聚集的地方。这就造成了无论形态是按预期方向突破，还是按非预期方向反向突破，我们都能够期待等距扩张。好的，总之价格在这里陷入了止盈启动的回调。你可以看得很清楚，是二推的AB=CD回调，价格终结上涨的位置，既是这段窄幅下降通道的50%回调处。同时，受到均线的阻抗，还对刚刚的突破点进行了测试。后续的下跌则同样是AB=CD有点过冲就是了，受到更下方的原趋势极值所吸引。测试了一下，又收起来，最后小幅震荡到收盘。眼看这里运动超过了20根K线,上下各有一次突破失败，你可以将这里视作区间。标记出它的上下缘。又或者你更倾向将它看作有点收敛的下降通道，那也没有问题，同样连接上下各两个转折点。你能够得到比较斜的趋势线以及比较缓的通道线。如果隔天行情也在目前图表的高低范围内震动，那么我们现在所标记出的所有磁体。就会需要重点注意的部分。明天行情在这些地方可能会有转折的迹象。准备好读逐步显露的图表了吗？一起来看看会发生什么事。首先，一根趋势，阳线跳空高开，触及昨日区间的上缘。然后失去跟进，反转向下，在均线处收了下影线。那么显然，上方的转折是对于昨日区间的再次突破失败，预先标记好的磁体的确派上用场。对于空头来说，他们可能是希望造就一个大型的双重顶，然后进一步开启下跌。那的确空头确实又进一步发力，跌破了前五根K线所构成的开盘区间。这时候我们就要紧密关注下方多重磁体重叠的位置，包括开盘区间等距扩张的目标。以及昨天的区间下缘，昨天画记的楔形通道线。而我们看到的是价格确实反转走高，就在这些复合磁体处失去动能。这就让昨天一直延续到今天的这个大区间，这个双重顶变成了末端旗型。过程中也已经有对趋势线的突破，有充足积累的买压，也有对原趋势极值的不及测试。将可能开启大型趋势反转。价格越过均线，一路上行，在今天的高点处，没有遭到阻拦，但是加速往上跑。去测试了，昨天这个失败牛旗的起点，也是昨天画出的重要波段点。这里K线放大，且最后一根K线运动幅度遥远的样子，呈现的就是被磁体吸引的高潮运动。我们可以想象过程中有真空效应的作用。而出现之后，急转直下，可能到哪里去呢？我们也该找到这段上行的所有重要波段点了。从最低点开始是上涨，但K线回调在强劲突破，这里可能是一个。后续同样是回调后再次顺利突破，在此处又留下一个重要波段点。而从顶端折返下降的路程中，在一个关键位置获得撑起，这里是重要波段点，重合50%回调的位置。多头认为，前方的上涨动能十足强劲，再回调到一半的位置继续做多应该是有数学优势的做法。而后续价格就又一路上涨到收盘。同样，如果你希望今天的读图结果对明天的交易也有帮助，你就要更新所有该注意的波段点。我们前头一再强调价格的波动，说穿了，这是从一个磁体运动到另一个磁体的过程。折返往复。所以知道哪里可能存在反向订单是非常重要的关键技能。也是我们要花两个单元的时间细究的根本原因。好的，复习到了这里，关于磁体的内容就到尾声了。","pid":"p423"},{"t":"para","text":"在前面的讲解里，为了节省大家的时间并维持知识密度与节奏，我只进行了必要的举例示范。呈现的例子一点都不算多。所以你要知道，光是看过这几张图表是不够的。你一定要确保你知道所有前述介绍的方法和原理，然后自己找图表来进行大量的练习。大家都走过求学阶段，值得考试前多写题目，习作评量，是考出高分的必经之路。我说我喜欢摄影，我也深知大量阅读摄影集尝试街拍风景人像，也同样是精进摄影之眼的不二法门。所以交易也是这样的，你与阿尔布鲁克斯的距离就是图表阅读量的距离。据他自己说，他已经每天阅读E-min S&P图表持续了30年。扣除节假日从未间断的读，但它已经细致的逐根的读过了7560张图表，超过了60万根K线。所以如果你也希望能够准确地抓到价格行为的脉动,读就对了,阅读和练习能使你富有，我们就从现在开始。下个单元我们要介绍此地之外的另一种重要读图技术，如何数推，如何数K线。如果说磁体是告诉你价格运动从哪里来，要往哪里去，那数推能够一定程度的告诉你。可能怎么到？还有多久到？感谢收看等距运动原理，我们下个单元见。","pid":"p424"}],"wcount":7473}],"wcount":14794},{"id":"l11","icon":"L11","title":"L11　为推动计数与数K线方法","blocks":[],"sections":[{"id":"l11A","title":"第A段　为推动计数与数K线方法","blocks":[{"t":"para","text":"L11A 为推动计数与数K线方法","pid":"p425"},{"t":"img","src":"assets/img/l11A_166.webp","ilabel":"11-1","icap":"L11　为推动计数与数K线方法","fid":"fig166","ctx":[{"t":"L11A 为推动计数与数K线方法","p":"p425"},{"t":"在进交易方法以前，我们终于来到了读图技术的最后一个单元，数推。结合原理，如果此时你已经学会磁体的标记和运用。应该发现自己读能够看懂图表上发生的所有事情的80%了。那接着将为推动技术的方法也具备起来，你就能够把最后一块拼图也给拼上。这个单元我们讨论的是运动的分割，如何把图表上连续的秘密麻麻的价格运动？拆分开来进行个别的理解，就像解剖学一样，让你具备对图表刨丁解牛的能力。我们会依序讨论的几个问题如下。趋势，波段，推动所指设的到底是什么规模的运动？我们如何为图表中上上下下的运动进行分类，给予适当的指称？把这一段运动与另一段运动区分开来的标准是什么？我们如何数，如何分，又是根据什么样的原则来进行。以及到了数K线的范畴，我们所要讨论的是，如果观察到在当前时间级别图表上。一段推动的内部还有更微观的波折，要如何理解它，如何拆分它，以及如何运用到交易里。数推与数K线的技术又要如何同整起来使用？如何用一个整体的框架来理解它们的作用？邀请你一起来理解。","p":"p426"},{"t":"初入市场的时候，你肯定听过各式各样的名词，大家反复提及，绕都绕不开。除了前面单元讲的突破，反转，支撑阻力等等，最常被提及的应该还有趋势。总有前辈叫你要顺势而为，然后在混的久一点以后，你会听到类似于这段行情，这个波段，这段推动，这一腿这一类的名词。好像都是在讲某一种规模的运动，但具体是走多远，它们之间相互的次序关系是什么？多数人似乎是模模糊糊，从来没有搞懂过。所以第一步我们来解决指称的问题。事实上，就如第二单元说的，所有市场都是碎形的。也就是说，任何运动的分级是大小相嵌，有规模上的主从之分向上可以合并，向下可以拆分。一般来说，依据级别排列会是这样的，最大的是趋势。不过，趋势难道一定要指设日线级别以上大时间级别？图表上的宏观走势吗？不一定哦，30秒级别的图表上也可以有趋势。其实是相对的概念，不是绝对的。那趋势到底多大？很简单，看它在荧幕上，在图表上占的分量，你的荧幕上最好只容纳一轮趋势。如果是多头单边交易状态比较强的情形，你的图表上maybe80根到160根K线的数量之下。这只有一个上升趋势，从荧幕左下长到右上。那最多最多在同样数量K线的图表上，你可以允许容纳一个多头和一个空头趋势。后者把前者给抵消。如果你发现图表上面有太多趟趋势了，那可能代表你关注的K线太多，请不需要关注那么多K线。阿尔布鲁克斯认为，对当前局势有影响的主要都落在近期的20到30根，所以只要把磁体标记完以后，我自己也习惯图表上容纳大概80根左右的K线而已。看起来会比较干净，不会被多余的资讯干扰判断。好总之趋势顶多一上一下，不能再多了。接下来小一点的叫做波段。这些都是上升趋势中顺向的波段。也可以有逆向的，则是这些段落。那波段两个字代表的意思就是“足以测算波段利润”的一段运行。什么叫波段利润？什么叫剥头皮利润呢？这是下个单元的话题。但先简单记一下的话，你可以想象，最好抓一根讯号K线加一根入场K线的两倍长度。比如说这段上涨可以算是一个波段，因为如果你在这里以50%回调的理由买进。出现的十字星作为讯号，后面的阳线则是确认你在阳线收线时追进。那入场点到讯号K线低点，这段距离作为止损的话，向上测量两倍高度的利润空间。这是一笔波段交易的尺寸。再向下，再把波段拆开来的话，更小规模的则是推动。持续的K线数量通常是个位数，就像这样。这个波段的内部可以拆除顺向的两推，而这个向下的波段则是内含三推。后续其他波段也是顺势两推两推两推三推。","p":"p427"}]},{"t":"para","text":"在进交易方法以前，我们终于来到了读图技术的最后一个单元，数推。结合原理，如果此时你已经学会磁体的标记和运用。应该发现自己读能够看懂图表上发生的所有事情的80%了。那接着将为推动技术的方法也具备起来，你就能够把最后一块拼图也给拼上。这个单元我们讨论的是运动的分割，如何把图表上连续的秘密麻麻的价格运动？拆分开来进行个别的理解，就像解剖学一样，让你具备对图表刨丁解牛的能力。我们会依序讨论的几个问题如下。趋势，波段，推动所指设的到底是什么规模的运动？我们如何为图表中上上下下的运动进行分类，给予适当的指称？把这一段运动与另一段运动区分开来的标准是什么？我们如何数，如何分，又是根据什么样的原则来进行。以及到了数K线的范畴，我们所要讨论的是，如果观察到在当前时间级别图表上。一段推动的内部还有更微观的波折，要如何理解它，如何拆分它，以及如何运用到交易里。数推与数K线的技术又要如何同整起来使用？如何用一个整体的框架来理解它们的作用？邀请你一起来理解。","pid":"p426"},{"t":"para","text":"初入市场的时候，你肯定听过各式各样的名词，大家反复提及，绕都绕不开。除了前面单元讲的突破，反转，支撑阻力等等，最常被提及的应该还有趋势。总有前辈叫你要顺势而为，然后在混的久一点以后，你会听到类似于这段行情，这个波段，这段推动，这一腿这一类的名词。好像都是在讲某一种规模的运动，但具体是走多远，它们之间相互的次序关系是什么？多数人似乎是模模糊糊，从来没有搞懂过。所以第一步我们来解决指称的问题。事实上，就如第二单元说的，所有市场都是碎形的。也就是说，任何运动的分级是大小相嵌，有规模上的主从之分向上可以合并，向下可以拆分。一般来说，依据级别排列会是这样的，最大的是趋势。不过，趋势难道一定要指设日线级别以上大时间级别？图表上的宏观走势吗？不一定哦，30秒级别的图表上也可以有趋势。其实是相对的概念，不是绝对的。那趋势到底多大？很简单，看它在荧幕上，在图表上占的分量，你的荧幕上最好只容纳一轮趋势。如果是多头单边交易状态比较强的情形，你的图表上maybe80根到160根K线的数量之下。这只有一个上升趋势，从荧幕左下长到右上。那最多最多在同样数量K线的图表上，你可以允许容纳一个多头和一个空头趋势。后者把前者给抵消。如果你发现图表上面有太多趟趋势了，那可能代表你关注的K线太多，请不需要关注那么多K线。阿尔布鲁克斯认为，对当前局势有影响的主要都落在近期的20到30根，所以只要把磁体标记完以后，我自己也习惯图表上容纳大概80根左右的K线而已。看起来会比较干净，不会被多余的资讯干扰判断。好总之趋势顶多一上一下，不能再多了。接下来小一点的叫做波段。这些都是上升趋势中顺向的波段。也可以有逆向的，则是这些段落。那波段两个字代表的意思就是“足以测算波段利润”的一段运行。什么叫波段利润？什么叫剥头皮利润呢？这是下个单元的话题。但先简单记一下的话，你可以想象，最好抓一根讯号K线加一根入场K线的两倍长度。比如说这段上涨可以算是一个波段，因为如果你在这里以50%回调的理由买进。出现的十字星作为讯号，后面的阳线则是确认你在阳线收线时追进。那入场点到讯号K线低点，这段距离作为止损的话，向上测量两倍高度的利润空间。这是一笔波段交易的尺寸。再向下，再把波段拆开来的话，更小规模的则是推动。持续的K线数量通常是个位数，就像这样。这个波段的内部可以拆除顺向的两推，而这个向下的波段则是内含三推。后续其他波段也是顺势两推两推两推三推。","pid":"p427"},{"t":"img","src":"assets/img/l11A_167.webp","ilabel":"11-2","icap":"L11　为推动计数与数K线方法","fid":"fig167","ctx":[{"t":"在进交易方法以前，我们终于来到了读图技术的最后一个单元，数推。结合原理，如果此时你已经学会磁体的标记和运用。应该发现自己读能够看懂图表上发生的所有事情的80%了。那接着将为推动技术的方法也具备起来，你就能够把最后一块拼图也给拼上。这个单元我们讨论的是运动的分割，如何把图表上连续的秘密麻麻的价格运动？拆分开来进行个别的理解，就像解剖学一样，让你具备对图表刨丁解牛的能力。我们会依序讨论的几个问题如下。趋势，波段，推动所指设的到底是什么规模的运动？我们如何为图表中上上下下的运动进行分类，给予适当的指称？把这一段运动与另一段运动区分开来的标准是什么？我们如何数，如何分，又是根据什么样的原则来进行。以及到了数K线的范畴，我们所要讨论的是，如果观察到在当前时间级别图表上。一段推动的内部还有更微观的波折，要如何理解它，如何拆分它，以及如何运用到交易里。数推与数K线的技术又要如何同整起来使用？如何用一个整体的框架来理解它们的作用？邀请你一起来理解。","p":"p426"},{"t":"初入市场的时候，你肯定听过各式各样的名词，大家反复提及，绕都绕不开。除了前面单元讲的突破，反转，支撑阻力等等，最常被提及的应该还有趋势。总有前辈叫你要顺势而为，然后在混的久一点以后，你会听到类似于这段行情，这个波段，这段推动，这一腿这一类的名词。好像都是在讲某一种规模的运动，但具体是走多远，它们之间相互的次序关系是什么？多数人似乎是模模糊糊，从来没有搞懂过。所以第一步我们来解决指称的问题。事实上，就如第二单元说的，所有市场都是碎形的。也就是说，任何运动的分级是大小相嵌，有规模上的主从之分向上可以合并，向下可以拆分。一般来说，依据级别排列会是这样的，最大的是趋势。不过，趋势难道一定要指设日线级别以上大时间级别？图表上的宏观走势吗？不一定哦，30秒级别的图表上也可以有趋势。其实是相对的概念，不是绝对的。那趋势到底多大？很简单，看它在荧幕上，在图表上占的分量，你的荧幕上最好只容纳一轮趋势。如果是多头单边交易状态比较强的情形，你的图表上maybe80根到160根K线的数量之下。这只有一个上升趋势，从荧幕左下长到右上。那最多最多在同样数量K线的图表上，你可以允许容纳一个多头和一个空头趋势。后者把前者给抵消。如果你发现图表上面有太多趟趋势了，那可能代表你关注的K线太多，请不需要关注那么多K线。阿尔布鲁克斯认为，对当前局势有影响的主要都落在近期的20到30根，所以只要把磁体标记完以后，我自己也习惯图表上容纳大概80根左右的K线而已。看起来会比较干净，不会被多余的资讯干扰判断。好总之趋势顶多一上一下，不能再多了。接下来小一点的叫做波段。这些都是上升趋势中顺向的波段。也可以有逆向的，则是这些段落。那波段两个字代表的意思就是“足以测算波段利润”的一段运行。什么叫波段利润？什么叫剥头皮利润呢？这是下个单元的话题。但先简单记一下的话，你可以想象，最好抓一根讯号K线加一根入场K线的两倍长度。比如说这段上涨可以算是一个波段，因为如果你在这里以50%回调的理由买进。出现的十字星作为讯号，后面的阳线则是确认你在阳线收线时追进。那入场点到讯号K线低点，这段距离作为止损的话，向上测量两倍高度的利润空间。这是一笔波段交易的尺寸。再向下，再把波段拆开来的话，更小规模的则是推动。持续的K线数量通常是个位数，就像这样。这个波段的内部可以拆除顺向的两推，而这个向下的波段则是内含三推。后续其他波段也是顺势两推两推两推三推。","p":"p427"},{"t":"那这个推动呢？原文是leg在阿尔布鲁克斯的书里有时候被翻译成推，有时候直接被翻译成腿。非常乱。但先前我写过一篇小短文，在讨论这件事。结论是认为，翻译成推动会比腿更达意，更准确。所以推荐大家也可以这么使用。而这个推动，实际上就是交易者在阅读图表时所去切分的基本单位。就像是构成世间万物的原子一样，我们通常用推作为最小颗粒去为价格运动分段。这段推动通常不足以测算波段利润，但至少能够测算剥头皮利润。综合以上一轮趋势中，通常包含二到四个顺向的波段。一个波段中，通常包含二到四段顺向的推动。如果有必要的话，或者说你的读图能力够好的话，在一段推动中，你还能够看出，还能够想象。这一推在更小时间级别图表上应该还能够同样再被拆出二到四小推，就像原子之下还有电子，质子，中子对吧？其实是大小嵌套的，就是这个意思。一个套一个分支又分支，这也正是所谓碎形的逻辑。说到这里，我们就可以再次同整一下前面单元带过的知识，确保你能够将它们都联系起来。","p":"p428"}]},{"t":"para","text":"那这个推动呢？原文是leg在阿尔布鲁克斯的书里有时候被翻译成推，有时候直接被翻译成腿。非常乱。但先前我写过一篇小短文，在讨论这件事。结论是认为，翻译成推动会比腿更达意，更准确。所以推荐大家也可以这么使用。而这个推动，实际上就是交易者在阅读图表时所去切分的基本单位。就像是构成世间万物的原子一样，我们通常用推作为最小颗粒去为价格运动分段。这段推动通常不足以测算波段利润，但至少能够测算剥头皮利润。综合以上一轮趋势中，通常包含二到四个顺向的波段。一个波段中，通常包含二到四段顺向的推动。如果有必要的话，或者说你的读图能力够好的话，在一段推动中，你还能够看出，还能够想象。这一推在更小时间级别图表上应该还能够同样再被拆出二到四小推，就像原子之下还有电子，质子，中子对吧？其实是大小嵌套的，就是这个意思。一个套一个分支又分支，这也正是所谓碎形的逻辑。说到这里，我们就可以再次同整一下前面单元带过的知识，确保你能够将它们都联系起来。","pid":"p428"},{"t":"img","src":"assets/img/l11A_168.webp","ilabel":"11-3","icap":"L11　为推动计数与数K线方法","fid":"fig168","ctx":[{"t":"那这个推动呢？原文是leg在阿尔布鲁克斯的书里有时候被翻译成推，有时候直接被翻译成腿。非常乱。但先前我写过一篇小短文，在讨论这件事。结论是认为，翻译成推动会比腿更达意，更准确。所以推荐大家也可以这么使用。而这个推动，实际上就是交易者在阅读图表时所去切分的基本单位。就像是构成世间万物的原子一样，我们通常用推作为最小颗粒去为价格运动分段。这段推动通常不足以测算波段利润，但至少能够测算剥头皮利润。综合以上一轮趋势中，通常包含二到四个顺向的波段。一个波段中，通常包含二到四段顺向的推动。如果有必要的话，或者说你的读图能力够好的话，在一段推动中，你还能够看出，还能够想象。这一推在更小时间级别图表上应该还能够同样再被拆出二到四小推，就像原子之下还有电子，质子，中子对吧？其实是大小嵌套的，就是这个意思。一个套一个分支又分支，这也正是所谓碎形的逻辑。说到这里，我们就可以再次同整一下前面单元带过的知识，确保你能够将它们都联系起来。","p":"p428"},{"t":"还记得我们说成功的突破之后，通常有第二推作为跟进吗？这就是以推动去表述价格行为的惯性。有一通常还有二。二结束之后可能就要回调，要等待一下，让多空重新决定，接下来该由谁主导。而反过来讲，举一反三一下，推动可以组合为波段，对吧？那也就是说，波段通常包含顺向的两段推动。知道这种倾向的交易者就比较容易发现交易机会或者在止盈的时候，可以更有余裕，不会被递推结束以后的回调所吓跑。很多新手交易者的常见困扰是急速启动以后幸运的赶上了，但追进的时间可能比较晚。因而会被回调过程中的偶尔浮亏，弄得七上八下。但你已经知道，等距运动的原理，知道动能机构交易者是因为这样有数学优势才决定追进。同时，你也知道，突破后还有第二推。那你就能够比较放心的持仓等待价格继续顺势去走，还你一个公道。还有什么知识点可以一并复习呢？我们前面偶尔讲到了双重顶底，楔形顶底。如果你还记得定义，我们说过阿尔布鲁克斯认为外观不是重点，里头的推动数量才是区别这些形态的基准。因此，双重顶底和楔形顶底主分别是由二和三段推动所构成。前者的右锋可以不及左锋，可以持平，可以过冲，本质相同。同时，测试原趋势极值，以后无法有效越过。总共两段推动。而三段推动的楔形顶底则形状各异，可以是你脑海中想象的常规的收敛楔形。也可以扩张，也可以二短三长，可以二长三短。同样本质都是一样的，就是顺势方试图推动行情往利于它的方向去三次，但屡屡失败。以三推为组成就可以称作楔形顶底。","p":"p429"}]},{"t":"para","text":"还记得我们说成功的突破之后，通常有第二推作为跟进吗？这就是以推动去表述价格行为的惯性。有一通常还有二。二结束之后可能就要回调，要等待一下，让多空重新决定，接下来该由谁主导。而反过来讲，举一反三一下，推动可以组合为波段，对吧？那也就是说，波段通常包含顺向的两段推动。知道这种倾向的交易者就比较容易发现交易机会或者在止盈的时候，可以更有余裕，不会被递推结束以后的回调所吓跑。很多新手交易者的常见困扰是急速启动以后幸运的赶上了，但追进的时间可能比较晚。因而会被回调过程中的偶尔浮亏，弄得七上八下。但你已经知道，等距运动的原理，知道动能机构交易者是因为这样有数学优势才决定追进。同时，你也知道，突破后还有第二推。那你就能够比较放心的持仓等待价格继续顺势去走，还你一个公道。还有什么知识点可以一并复习呢？我们前面偶尔讲到了双重顶底，楔形顶底。如果你还记得定义，我们说过阿尔布鲁克斯认为外观不是重点，里头的推动数量才是区别这些形态的基准。因此，双重顶底和楔形顶底主分别是由二和三段推动所构成。前者的右锋可以不及左锋，可以持平，可以过冲，本质相同。同时，测试原趋势极值，以后无法有效越过。总共两段推动。而三段推动的楔形顶底则形状各异，可以是你脑海中想象的常规的收敛楔形。也可以扩张，也可以二短三长，可以二长三短。同样本质都是一样的，就是顺势方试图推动行情往利于它的方向去三次，但屡屡失败。以三推为组成就可以称作楔形顶底。","pid":"p429"},{"t":"img","src":"assets/img/l11A_169.webp","ilabel":"11-4","icap":"L11　为推动计数与数K线方法","fid":"fig169","ctx":[{"t":"还记得我们说成功的突破之后，通常有第二推作为跟进吗？这就是以推动去表述价格行为的惯性。有一通常还有二。二结束之后可能就要回调，要等待一下，让多空重新决定，接下来该由谁主导。而反过来讲，举一反三一下，推动可以组合为波段，对吧？那也就是说，波段通常包含顺向的两段推动。知道这种倾向的交易者就比较容易发现交易机会或者在止盈的时候，可以更有余裕，不会被递推结束以后的回调所吓跑。很多新手交易者的常见困扰是急速启动以后幸运的赶上了，但追进的时间可能比较晚。因而会被回调过程中的偶尔浮亏，弄得七上八下。但你已经知道，等距运动的原理，知道动能机构交易者是因为这样有数学优势才决定追进。同时，你也知道，突破后还有第二推。那你就能够比较放心的持仓等待价格继续顺势去走，还你一个公道。还有什么知识点可以一并复习呢？我们前面偶尔讲到了双重顶底，楔形顶底。如果你还记得定义，我们说过阿尔布鲁克斯认为外观不是重点，里头的推动数量才是区别这些形态的基准。因此，双重顶底和楔形顶底主分别是由二和三段推动所构成。前者的右锋可以不及左锋，可以持平，可以过冲，本质相同。同时，测试原趋势极值，以后无法有效越过。总共两段推动。而三段推动的楔形顶底则形状各异，可以是你脑海中想象的常规的收敛楔形。也可以扩张，也可以二短三长，可以二长三短。同样本质都是一样的，就是顺势方试图推动行情往利于它的方向去三次，但屡屡失败。以三推为组成就可以称作楔形顶底。","p":"p429"},{"t":"好，对于运动的各种级别有了概念，也知道推动是我们分割行情的基本单位，以后接下来就要来正式的讨论。到底如何分段？我也不避讳的讲，为推动技术这件事，是阿尔布鲁克斯的整个知识体系里面我认为相对最有主观色彩的一项组成。或者与其说他带有主观的性格，不如说他很大程度上的与你读图的经验相关。阅读量非常丰沛的人数推通常都数的差不多，但他们却说不上来自己是如何数的。而阅读量较低的新手交易者，在尝试数推的过程中，就容易陷入各种困惑，有点摸不清楚怎么数才恰当。那为了解决这个难题，必须说很仰赖我和你的共同努力。我会负责将如何数推的基准尽可能列出来描述给你听，让你不至于无迹可寻。但你也要在看完课程之后尽量练习去扩充自己的阅读量。否则只有我一个巴掌是拍不响的。读越多就越会数跟磁体的画记一样，多练习就能够找到方向。","p":"p430"}]},{"t":"para","text":"好，对于运动的各种级别有了概念，也知道推动是我们分割行情的基本单位，以后接下来就要来正式的讨论。到底如何分段？我也不避讳的讲，为推动技术这件事，是阿尔布鲁克斯的整个知识体系里面我认为相对最有主观色彩的一项组成。或者与其说他带有主观的性格，不如说他很大程度上的与你读图的经验相关。阅读量非常丰沛的人数推通常都数的差不多，但他们却说不上来自己是如何数的。而阅读量较低的新手交易者，在尝试数推的过程中，就容易陷入各种困惑，有点摸不清楚怎么数才恰当。那为了解决这个难题，必须说很仰赖我和你的共同努力。我会负责将如何数推的基准尽可能列出来描述给你听，让你不至于无迹可寻。但你也要在看完课程之后尽量练习去扩充自己的阅读量。否则只有我一个巴掌是拍不响的。读越多就越会数跟磁体的画记一样，多练习就能够找到方向。","pid":"p430"},{"t":"img","src":"assets/img/l11A_170.webp","ilabel":"11-5","icap":"L11　为推动计数与数K线方法","fid":"fig170","ctx":[{"t":"好，对于运动的各种级别有了概念，也知道推动是我们分割行情的基本单位，以后接下来就要来正式的讨论。到底如何分段？我也不避讳的讲，为推动技术这件事，是阿尔布鲁克斯的整个知识体系里面我认为相对最有主观色彩的一项组成。或者与其说他带有主观的性格，不如说他很大程度上的与你读图的经验相关。阅读量非常丰沛的人数推通常都数的差不多，但他们却说不上来自己是如何数的。而阅读量较低的新手交易者，在尝试数推的过程中，就容易陷入各种困惑，有点摸不清楚怎么数才恰当。那为了解决这个难题，必须说很仰赖我和你的共同努力。我会负责将如何数推的基准尽可能列出来描述给你听，让你不至于无迹可寻。但你也要在看完课程之后尽量练习去扩充自己的阅读量。否则只有我一个巴掌是拍不响的。读越多就越会数跟磁体的画记一样，多练习就能够找到方向。","p":"p430"},{"t":"首先，我们先来练习拆解画面上的这几道题目。同样都是下降的走势，但连续性复杂程度就不太一样。最左边是最容易的。你会怎么划分？怎么属内部的推动呢？请在脑中只觉得进行一下画记，暂停画面想一下更好。如果你已经有了直觉的判断，也请仔细思索一下，那是基于什么道理？你能不能把你下判断的那个隐隐约约不太明晰的原因整理出来，列成一个白纸黑字的判断标准？甚至能确保自己在别的情境数推的时候用的也是同一套划分方法呢。来大家想一下。想，好了吗？相信这题多数人应该都会得出相同的答案，就是这样画。","p":"p431"}]},{"t":"para","text":"首先，我们先来练习拆解画面上的这几道题目。同样都是下降的走势，但连续性复杂程度就不太一样。最左边是最容易的。你会怎么划分？怎么属内部的推动呢？请在脑中只觉得进行一下画记，暂停画面想一下更好。如果你已经有了直觉的判断，也请仔细思索一下，那是基于什么道理？你能不能把你下判断的那个隐隐约约不太明晰的原因整理出来，列成一个白纸黑字的判断标准？甚至能确保自己在别的情境数推的时候用的也是同一套划分方法呢。来大家想一下。想，好了吗？相信这题多数人应该都会得出相同的答案，就是这样画。","pid":"p431"},{"t":"img","src":"assets/img/l11A_171.webp","ilabel":"11-6","icap":"L11　为推动计数与数K线方法","fid":"fig171","ctx":[{"t":"首先，我们先来练习拆解画面上的这几道题目。同样都是下降的走势，但连续性复杂程度就不太一样。最左边是最容易的。你会怎么划分？怎么属内部的推动呢？请在脑中只觉得进行一下画记，暂停画面想一下更好。如果你已经有了直觉的判断，也请仔细思索一下，那是基于什么道理？你能不能把你下判断的那个隐隐约约不太明晰的原因整理出来，列成一个白纸黑字的判断标准？甚至能确保自己在别的情境数推的时候用的也是同一套划分方法呢。来大家想一下。想，好了吗？相信这题多数人应该都会得出相同的答案，就是这样画。","p":"p431"},{"t":"不过是为什么呢？为推动技术的第一个参考标准是以阴阳交替的断点来进行划分。道理很简单，因为K线的颜色本身就告诉了你，在该K线的时间尺度内是谁占据控制权，对吧？所以阴线，阴线，阴线，这是空头动能，具有连续性的表现。是直到下一根是阳线的时候，空头的动能才被打断掉，换成由接连的阳线组成回调。那同样，当阳线转阴就又是方向盘异手的时候。这一推就一路算到下一个阴阳交替的地方，在后面也是一样。遂此你就可以透过掌握这个原则来拆解行情，大致把三段推动给正确数出来。但我相信你也可能会主张这是太罕见的干净的例子了。使盘中的K线通常更杂乱，更纠结，不会这么容易可以把推动分清楚。确实，刚刚这是最初阶的题目。","p":"p432"},{"t":"接着我们来看看第二张图。显然，光用阴阳交替的原则去划分，可能会不小心把这波行情切的太碎。那该怎么做呢？请你也同样试试看，然后看看能不能总结出一些原则，既适用于这第二个例子。他回去刚刚那个案例也能够行得通。如果是这张图，那多写信可能就跑出来了。我们先讨论，看看有没有画成四推的画法？","p":"p433"}]},{"t":"para","text":"不过是为什么呢？为推动技术的第一个参考标准是以阴阳交替的断点来进行划分。道理很简单，因为K线的颜色本身就告诉了你，在该K线的时间尺度内是谁占据控制权，对吧？所以阴线，阴线，阴线，这是空头动能，具有连续性的表现。是直到下一根是阳线的时候，空头的动能才被打断掉，换成由接连的阳线组成回调。那同样，当阳线转阴就又是方向盘异手的时候。这一推就一路算到下一个阴阳交替的地方，在后面也是一样。遂此你就可以透过掌握这个原则来拆解行情，大致把三段推动给正确数出来。但我相信你也可能会主张这是太罕见的干净的例子了。使盘中的K线通常更杂乱，更纠结，不会这么容易可以把推动分清楚。确实，刚刚这是最初阶的题目。","pid":"p432"},{"t":"para","text":"接着我们来看看第二张图。显然，光用阴阳交替的原则去划分，可能会不小心把这波行情切的太碎。那该怎么做呢？请你也同样试试看，然后看看能不能总结出一些原则，既适用于这第二个例子。他回去刚刚那个案例也能够行得通。如果是这张图，那多写信可能就跑出来了。我们先讨论，看看有没有画成四推的画法？","pid":"p433"},{"t":"img","src":"assets/img/l11A_172.webp","ilabel":"11-7","icap":"L11　为推动计数与数K线方法","fid":"fig172","ctx":[{"t":"不过是为什么呢？为推动技术的第一个参考标准是以阴阳交替的断点来进行划分。道理很简单，因为K线的颜色本身就告诉了你，在该K线的时间尺度内是谁占据控制权，对吧？所以阴线，阴线，阴线，这是空头动能，具有连续性的表现。是直到下一根是阳线的时候，空头的动能才被打断掉，换成由接连的阳线组成回调。那同样，当阳线转阴就又是方向盘异手的时候。这一推就一路算到下一个阴阳交替的地方，在后面也是一样。遂此你就可以透过掌握这个原则来拆解行情，大致把三段推动给正确数出来。但我相信你也可能会主张这是太罕见的干净的例子了。使盘中的K线通常更杂乱，更纠结，不会这么容易可以把推动分清楚。确实，刚刚这是最初阶的题目。","p":"p432"},{"t":"接着我们来看看第二张图。显然，光用阴阳交替的原则去划分，可能会不小心把这波行情切的太碎。那该怎么做呢？请你也同样试试看，然后看看能不能总结出一些原则，既适用于这第二个例子。他回去刚刚那个案例也能够行得通。如果是这张图，那多写信可能就跑出来了。我们先讨论，看看有没有画成四推的画法？","p":"p433"},{"t":"如果要化成四推，我可能会这样处理。其中的道理在于，我仍然沿用以阴阳交替为断线的方法去做分割。只不过去避开那些整体K线长度太小的十字星，认为那可能只是简单停顿一下。不代表逆势方真的有暂时掌控住行情运行的方向。所以这样切分的话，这同样是下跌后进入回调，回调内部有两小推。有一颗短小的阴线十字星作为中继。但它太小了，空头不能算是有出力，因此可以忽略。将这三根K线合并起来，看作是向上的一次推动。而后续下跌就比较没有悬念，而接下来趋势阳线上涨，比较确实的断掉了空头的运行。只不过接下来的下跌，同样每根K线的高点与低点都是降低的，就算中间有小小的阳线十字星也一样。所以忽视它，同样把这四根K线算作一推也没有问题。但接下来的这根阳线就比较难以忽视一点。毕竟它有着比较显著的上影线和下影线。代表多空争夺的比较激烈。甚至有一瞬间，多头都走到过这里来，并且在那个当下看起来是根光头的趋势阳线。所以空头动能的连续性应该有，在这里暂告终结的意味至少最后是有多头小占优势。才能将K线收成绿色。那这么一来，把它看做一个断点也是可以的。于是我们就总共分出四段推动。那有没有分成三推的方法呢？","p":"p434"}]},{"t":"para","text":"如果要化成四推，我可能会这样处理。其中的道理在于，我仍然沿用以阴阳交替为断线的方法去做分割。只不过去避开那些整体K线长度太小的十字星，认为那可能只是简单停顿一下。不代表逆势方真的有暂时掌控住行情运行的方向。所以这样切分的话，这同样是下跌后进入回调，回调内部有两小推。有一颗短小的阴线十字星作为中继。但它太小了，空头不能算是有出力，因此可以忽略。将这三根K线合并起来，看作是向上的一次推动。而后续下跌就比较没有悬念，而接下来趋势阳线上涨，比较确实的断掉了空头的运行。只不过接下来的下跌，同样每根K线的高点与低点都是降低的，就算中间有小小的阳线十字星也一样。所以忽视它，同样把这四根K线算作一推也没有问题。但接下来的这根阳线就比较难以忽视一点。毕竟它有着比较显著的上影线和下影线。代表多空争夺的比较激烈。甚至有一瞬间，多头都走到过这里来，并且在那个当下看起来是根光头的趋势阳线。所以空头动能的连续性应该有，在这里暂告终结的意味至少最后是有多头小占优势。才能将K线收成绿色。那这么一来，把它看做一个断点也是可以的。于是我们就总共分出四段推动。那有没有分成三推的方法呢？","pid":"p434"},{"t":"img","src":"assets/img/l11A_173.webp","ilabel":"11-8","icap":"L11　为推动计数与数K线方法","fid":"fig173","ctx":[{"t":"如果要化成四推，我可能会这样处理。其中的道理在于，我仍然沿用以阴阳交替为断线的方法去做分割。只不过去避开那些整体K线长度太小的十字星，认为那可能只是简单停顿一下。不代表逆势方真的有暂时掌控住行情运行的方向。所以这样切分的话，这同样是下跌后进入回调，回调内部有两小推。有一颗短小的阴线十字星作为中继。但它太小了，空头不能算是有出力，因此可以忽略。将这三根K线合并起来，看作是向上的一次推动。而后续下跌就比较没有悬念，而接下来趋势阳线上涨，比较确实的断掉了空头的运行。只不过接下来的下跌，同样每根K线的高点与低点都是降低的，就算中间有小小的阳线十字星也一样。所以忽视它，同样把这四根K线算作一推也没有问题。但接下来的这根阳线就比较难以忽视一点。毕竟它有着比较显著的上影线和下影线。代表多空争夺的比较激烈。甚至有一瞬间，多头都走到过这里来，并且在那个当下看起来是根光头的趋势阳线。所以空头动能的连续性应该有，在这里暂告终结的意味至少最后是有多头小占优势。才能将K线收成绿色。那这么一来，把它看做一个断点也是可以的。于是我们就总共分出四段推动。那有没有分成三推的方法呢？","p":"p434"},{"t":"也有哦。如果你的分割标准是在下降的行情中，一旦K线高点抬升就分段。那么结果就会是三推，我们仔细看看就知道了。这里连续的阴线K线高点是这样一路下降。直到这里后一根K线高点抬升，那么我们就分段。这样的道理是，一旦K线高点抬高，就是出现回调K线。用两两阅读K线之间相互关系的逻辑，这就代表多头造成的突破，空头败退。那一旦空头败退，同样也可以视作连续性的终止。将此前独立算作一推。那整趟下跌中有过两次K线高点的抬升，因而能把行情切成三推。而这颗十字星虽然长度是显著的，但由于高点相较于前一根更大的阴线，并没有抬升。所以即使收成阳线多头，也没有能够造成突破，可以忽视。于是这么一来，你就晓得除了阴阳交错可以当做一个分割推动的标准。有没有出现回调K线也可以用作其中一种使用原则。那掌握这两种方法，以后我们再接着讨论这个更复杂更进阶的例题。","p":"p435"}]},{"t":"para","text":"也有哦。如果你的分割标准是在下降的行情中，一旦K线高点抬升就分段。那么结果就会是三推，我们仔细看看就知道了。这里连续的阴线K线高点是这样一路下降。直到这里后一根K线高点抬升，那么我们就分段。这样的道理是，一旦K线高点抬高，就是出现回调K线。用两两阅读K线之间相互关系的逻辑，这就代表多头造成的突破，空头败退。那一旦空头败退，同样也可以视作连续性的终止。将此前独立算作一推。那整趟下跌中有过两次K线高点的抬升，因而能把行情切成三推。而这颗十字星虽然长度是显著的，但由于高点相较于前一根更大的阴线，并没有抬升。所以即使收成阳线多头，也没有能够造成突破，可以忽视。于是这么一来，你就晓得除了阴阳交错可以当做一个分割推动的标准。有没有出现回调K线也可以用作其中一种使用原则。那掌握这两种方法，以后我们再接着讨论这个更复杂更进阶的例题。","pid":"p435"},{"t":"img","src":"assets/img/l11A_174.webp","ilabel":"11-9","icap":"L11　为推动计数与数K线方法","fid":"fig174","ctx":[{"t":"也有哦。如果你的分割标准是在下降的行情中，一旦K线高点抬升就分段。那么结果就会是三推，我们仔细看看就知道了。这里连续的阴线K线高点是这样一路下降。直到这里后一根K线高点抬升，那么我们就分段。这样的道理是，一旦K线高点抬高，就是出现回调K线。用两两阅读K线之间相互关系的逻辑，这就代表多头造成的突破，空头败退。那一旦空头败退，同样也可以视作连续性的终止。将此前独立算作一推。那整趟下跌中有过两次K线高点的抬升，因而能把行情切成三推。而这颗十字星虽然长度是显著的，但由于高点相较于前一根更大的阴线，并没有抬升。所以即使收成阳线多头，也没有能够造成突破，可以忽视。于是这么一来，你就晓得除了阴阳交错可以当做一个分割推动的标准。有没有出现回调K线也可以用作其中一种使用原则。那掌握这两种方法，以后我们再接着讨论这个更复杂更进阶的例题。","p":"p435"},{"t":"同样，红色与绿色是我们在视觉上最一眼可以辨认出的资讯。所以只需要大概看一眼，你眯着眼睛感受一下，就大致能够得出这样划分的结论。","p":"p436"}]},{"t":"para","text":"同样，红色与绿色是我们在视觉上最一眼可以辨认出的资讯。所以只需要大概看一眼，你眯着眼睛感受一下，就大致能够得出这样划分的结论。","pid":"p436"},{"t":"img","src":"assets/img/l11A_175.webp","ilabel":"11-10","icap":"L11　为推动计数与数K线方法","fid":"fig175","ctx":[{"t":"同样，红色与绿色是我们在视觉上最一眼可以辨认出的资讯。所以只需要大概看一眼，你眯着眼睛感受一下，就大致能够得出这样划分的结论。","p":"p436"},{"t":"结合另一个要点，也就是可以以K线高点抬升的时机为阶分的依据双重解释之下。就会发现我们分的还是蛮对的。高点抬升的时机分别在这些地方。第一次高点抬升，然后恢复下跌。第二次高点抬升在这根阳线，后续则分别是这里和这里。如此一来，我们就切出了五段推动。那对于过程中出现的颜色相反的少许K线，它也可以被忽略。或者与其说忽略，不如说他们其实是将推动再切的更小的依据。以这三根下跌推动为例，对娴熟读图技术的交易者来说，可以想象到在更小时间级别图表上。其轨迹必定是下，上，下的顺时两小推运动。而这里的阴线中断了，后续的上涨也同样是把这一大推切做上，下，上，总共两小推。这小小的阳线呢，则造就了此处的微型双重顶。不过要是我们只专注在当前时间级别图表上。以上细节是你应该要期许自己可以读得出来，但实务上可以暂时忽略的资讯。要快速抓住轮廓，重要的是切分出这五推。而除了阴阳交替，除了回调K线的出现，找到一目了然的那些高低点并进行连接也是可以的做法。想象自己现在要画的是趋势线和通道线。那么你一定会很快注意到，这里有些比较显著的低点，可以作为连线的参考。虽然都不是很工整哦，但上面也一样，这些端点值得注意。那么，他们会吸引你的关注，也并非没有原因的。这些就是多头与空头在拉锯的过程中，每一推所达到的最远的位置。因此，直接将它们做连线，也可以切分出相对正确的推动。这个原则套用在前面两个例子上，也能够运作良好。表示高低点连线。这里也一样，找出来后进行连线。这几种原则都熟悉起来，在其中一种方法似乎无法概括的时候，拿出另外两个来尝试解决。大致上就能够克服不同的难题。的确有主观性不好，找到一种屡试不爽的标准。但几种原则的组合还是能够完成任务的。也因此，你要多多练习训练自己对多空镜和转折的敏感度。","p":"p437"}]},{"t":"para","text":"结合另一个要点，也就是可以以K线高点抬升的时机为阶分的依据双重解释之下。就会发现我们分的还是蛮对的。高点抬升的时机分别在这些地方。第一次高点抬升，然后恢复下跌。第二次高点抬升在这根阳线，后续则分别是这里和这里。如此一来，我们就切出了五段推动。那对于过程中出现的颜色相反的少许K线，它也可以被忽略。或者与其说忽略，不如说他们其实是将推动再切的更小的依据。以这三根下跌推动为例，对娴熟读图技术的交易者来说，可以想象到在更小时间级别图表上。其轨迹必定是下，上，下的顺时两小推运动。而这里的阴线中断了，后续的上涨也同样是把这一大推切做上，下，上，总共两小推。这小小的阳线呢，则造就了此处的微型双重顶。不过要是我们只专注在当前时间级别图表上。以上细节是你应该要期许自己可以读得出来，但实务上可以暂时忽略的资讯。要快速抓住轮廓，重要的是切分出这五推。而除了阴阳交替，除了回调K线的出现，找到一目了然的那些高低点并进行连接也是可以的做法。想象自己现在要画的是趋势线和通道线。那么你一定会很快注意到，这里有些比较显著的低点，可以作为连线的参考。虽然都不是很工整哦，但上面也一样，这些端点值得注意。那么，他们会吸引你的关注，也并非没有原因的。这些就是多头与空头在拉锯的过程中，每一推所达到的最远的位置。因此，直接将它们做连线，也可以切分出相对正确的推动。这个原则套用在前面两个例子上，也能够运作良好。表示高低点连线。这里也一样，找出来后进行连线。这几种原则都熟悉起来，在其中一种方法似乎无法概括的时候，拿出另外两个来尝试解决。大致上就能够克服不同的难题。的确有主观性不好，找到一种屡试不爽的标准。但几种原则的组合还是能够完成任务的。也因此，你要多多练习训练自己对多空镜和转折的敏感度。","pid":"p437"},{"t":"img","src":"assets/img/l11A_176.webp","ilabel":"11-11","icap":"L11　为推动计数与数K线方法","fid":"fig176","ctx":[{"t":"结合另一个要点，也就是可以以K线高点抬升的时机为阶分的依据双重解释之下。就会发现我们分的还是蛮对的。高点抬升的时机分别在这些地方。第一次高点抬升，然后恢复下跌。第二次高点抬升在这根阳线，后续则分别是这里和这里。如此一来，我们就切出了五段推动。那对于过程中出现的颜色相反的少许K线，它也可以被忽略。或者与其说忽略，不如说他们其实是将推动再切的更小的依据。以这三根下跌推动为例，对娴熟读图技术的交易者来说，可以想象到在更小时间级别图表上。其轨迹必定是下，上，下的顺时两小推运动。而这里的阴线中断了，后续的上涨也同样是把这一大推切做上，下，上，总共两小推。这小小的阳线呢，则造就了此处的微型双重顶。不过要是我们只专注在当前时间级别图表上。以上细节是你应该要期许自己可以读得出来，但实务上可以暂时忽略的资讯。要快速抓住轮廓，重要的是切分出这五推。而除了阴阳交替，除了回调K线的出现，找到一目了然的那些高低点并进行连接也是可以的做法。想象自己现在要画的是趋势线和通道线。那么你一定会很快注意到，这里有些比较显著的低点，可以作为连线的参考。虽然都不是很工整哦，但上面也一样，这些端点值得注意。那么，他们会吸引你的关注，也并非没有原因的。这些就是多头与空头在拉锯的过程中，每一推所达到的最远的位置。因此，直接将它们做连线，也可以切分出相对正确的推动。这个原则套用在前面两个例子上，也能够运作良好。表示高低点连线。这里也一样，找出来后进行连线。这几种原则都熟悉起来，在其中一种方法似乎无法概括的时候，拿出另外两个来尝试解决。大致上就能够克服不同的难题。的确有主观性不好，找到一种屡试不爽的标准。但几种原则的组合还是能够完成任务的。也因此，你要多多练习训练自己对多空镜和转折的敏感度。","p":"p437"},{"t":"而同时，倘若你还能够学而时习，温故知新一下发现这里是基于极速高度以及AB=CD的等距运动目标。那就更好。","p":"p438"}]},{"t":"para","text":"而同时，倘若你还能够学而时习，温故知新一下发现这里是基于极速高度以及AB=CD的等距运动目标。那就更好。","pid":"p438"},{"t":"img","src":"assets/img/l11A_177.webp","ilabel":"11-12","icap":"L11　为推动计数与数K线方法","fid":"fig177","ctx":[{"t":"而同时，倘若你还能够学而时习，温故知新一下发现这里是基于极速高度以及AB=CD的等距运动目标。那就更好。","p":"p438"},{"t":"那接下来，我们随即进到一个困难的题目来验收一下，各位的理解。这是一个台指期的交易日，从早上8点45分开始到下午13点40分，伸出最后一根K线。整天在图表上，总共59根。不过，这边的趋势性格很弱，不像前几个牛刀小试题那么容易处理。如果连这个你都能够轻松划分，那对于90%的情况，你应该都能掌握的很有水准了。请随机来试试看。想好了吗？","p":"p439"}]},{"t":"para","text":"那接下来，我们随即进到一个困难的题目来验收一下，各位的理解。这是一个台指期的交易日，从早上8点45分开始到下午13点40分，伸出最后一根K线。整天在图表上，总共59根。不过，这边的趋势性格很弱，不像前几个牛刀小试题那么容易处理。如果连这个你都能够轻松划分，那对于90%的情况，你应该都能掌握的很有水准了。请随机来试试看。想好了吗？","pid":"p439"},{"t":"img","src":"assets/img/l11A_178.webp","ilabel":"11-13","icap":"L11　为推动计数与数K线方法","fid":"fig178","ctx":[{"t":"那接下来，我们随即进到一个困难的题目来验收一下，各位的理解。这是一个台指期的交易日，从早上8点45分开始到下午13点40分，伸出最后一根K线。整天在图表上，总共59根。不过，这边的趋势性格很弱，不像前几个牛刀小试题那么容易处理。如果连这个你都能够轻松划分，那对于90%的情况，你应该都能掌握的很有水准了。请随机来试试看。想好了吗？","p":"p439"},{"t":"我自己来画的话，应该会是这个样子。收出阳线后，立即空头突破低点降低，因此能够算是一个空头推动。后续连续四根K线的高低点都不断递进，直到阴线下破，切断了多头的连续动能。于是从低点到高点，这又是上涨的一推。接下来是个铁丝网内部转折比较复杂。不过只要你把高点和低点标示出来，辅以阴阳交替的分割逻辑，你很快就能够发现其实没那么难处理。就是下，上，下，上。然后再出现一根趋势阴线，下破熊旗趋势线。下破以后，同样连接高点与低点，以阴阳交替，以高点抬升为依据去数推。就能够把上下的四段推动给数出来。过程中，这根阴线或许让你困扰。但仔细想想，那不应该是一个类似于这样的轨迹的运动。整体是一个收敛三角，其中空头没有有效下破这个收敛轮廓的尝试。因此，你无需把它算作一推，还是专注在前述降低的显著低点，数出四推就可以。那后续则应该是这样子，总共三推完成上涨。横向的这几根K线比较难办，因为毫无趋势性特征可言，没有谁真正有效突破谁的问题。所以不数其实也没有关系。那对于很想知道答案的同学，你只要知道内部的运动可能是这样子就可以了。前三根是一个向下的微型通道，后续突破趋势线后回调再向上，因而走出了这样的路径。所以从正中间这颗阳线十字星低点算起，后续应该是一个小的多头推动，价格上攻到阴线高点。那向下一推之后，后续这边的上涨，你要说它是两推上去的还是三推上去的都可以？看过程中低点降低才切割，那就会算作两推，因为这颗十字星低点与前一根阳线持平。而看阴阳交错，这分开来则会算作三推。而后续相对就没有什么争议了。下降，上涨，下降，再上涨，完成了这个交易日。不难对吧？把所有推动的轨迹串联起来，你就发现自己能够描绘多空竞合的历程了。这些转折都有故事，比如这里是一推比一推更上不去的样子。于是呈现出楔形顶熊旗的轮廓，后续确实转跌。而往下坠落以后，同样是屡屡无法有效下破，形成了由四次疲弱推动构成的牛旗。随后重新引发上涨。上涨完成进入横向的区间，又是多头与空头的竞争，互不相让，也没有谁能够说服对方。直到最后是多头胜出，延续了前面这段比较强劲的趋势动能，完成了基于急速高度的或者AB=CD的等距运动。","p":"p440"}]},{"t":"para","text":"我自己来画的话，应该会是这个样子。收出阳线后，立即空头突破低点降低，因此能够算是一个空头推动。后续连续四根K线的高低点都不断递进，直到阴线下破，切断了多头的连续动能。于是从低点到高点，这又是上涨的一推。接下来是个铁丝网内部转折比较复杂。不过只要你把高点和低点标示出来，辅以阴阳交替的分割逻辑，你很快就能够发现其实没那么难处理。就是下，上，下，上。然后再出现一根趋势阴线，下破熊旗趋势线。下破以后，同样连接高点与低点，以阴阳交替，以高点抬升为依据去数推。就能够把上下的四段推动给数出来。过程中，这根阴线或许让你困扰。但仔细想想，那不应该是一个类似于这样的轨迹的运动。整体是一个收敛三角，其中空头没有有效下破这个收敛轮廓的尝试。因此，你无需把它算作一推，还是专注在前述降低的显著低点，数出四推就可以。那后续则应该是这样子，总共三推完成上涨。横向的这几根K线比较难办，因为毫无趋势性特征可言，没有谁真正有效突破谁的问题。所以不数其实也没有关系。那对于很想知道答案的同学，你只要知道内部的运动可能是这样子就可以了。前三根是一个向下的微型通道，后续突破趋势线后回调再向上，因而走出了这样的路径。所以从正中间这颗阳线十字星低点算起，后续应该是一个小的多头推动，价格上攻到阴线高点。那向下一推之后，后续这边的上涨，你要说它是两推上去的还是三推上去的都可以？看过程中低点降低才切割，那就会算作两推，因为这颗十字星低点与前一根阳线持平。而看阴阳交错，这分开来则会算作三推。而后续相对就没有什么争议了。下降，上涨，下降，再上涨，完成了这个交易日。不难对吧？把所有推动的轨迹串联起来，你就发现自己能够描绘多空竞合的历程了。这些转折都有故事，比如这里是一推比一推更上不去的样子。于是呈现出楔形顶熊旗的轮廓，后续确实转跌。而往下坠落以后，同样是屡屡无法有效下破，形成了由四次疲弱推动构成的牛旗。随后重新引发上涨。上涨完成进入横向的区间，又是多头与空头的竞争，互不相让，也没有谁能够说服对方。直到最后是多头胜出，延续了前面这段比较强劲的趋势动能，完成了基于急速高度的或者AB=CD的等距运动。","pid":"p440"},{"t":"img","src":"assets/img/l11A_179.webp","ilabel":"11-14","icap":"L11　为推动计数与数K线方法","fid":"fig179","ctx":[{"t":"我自己来画的话，应该会是这个样子。收出阳线后，立即空头突破低点降低，因此能够算是一个空头推动。后续连续四根K线的高低点都不断递进，直到阴线下破，切断了多头的连续动能。于是从低点到高点，这又是上涨的一推。接下来是个铁丝网内部转折比较复杂。不过只要你把高点和低点标示出来，辅以阴阳交替的分割逻辑，你很快就能够发现其实没那么难处理。就是下，上，下，上。然后再出现一根趋势阴线，下破熊旗趋势线。下破以后，同样连接高点与低点，以阴阳交替，以高点抬升为依据去数推。就能够把上下的四段推动给数出来。过程中，这根阴线或许让你困扰。但仔细想想，那不应该是一个类似于这样的轨迹的运动。整体是一个收敛三角，其中空头没有有效下破这个收敛轮廓的尝试。因此，你无需把它算作一推，还是专注在前述降低的显著低点，数出四推就可以。那后续则应该是这样子，总共三推完成上涨。横向的这几根K线比较难办，因为毫无趋势性特征可言，没有谁真正有效突破谁的问题。所以不数其实也没有关系。那对于很想知道答案的同学，你只要知道内部的运动可能是这样子就可以了。前三根是一个向下的微型通道，后续突破趋势线后回调再向上，因而走出了这样的路径。所以从正中间这颗阳线十字星低点算起，后续应该是一个小的多头推动，价格上攻到阴线高点。那向下一推之后，后续这边的上涨，你要说它是两推上去的还是三推上去的都可以？看过程中低点降低才切割，那就会算作两推，因为这颗十字星低点与前一根阳线持平。而看阴阳交错，这分开来则会算作三推。而后续相对就没有什么争议了。下降，上涨，下降，再上涨，完成了这个交易日。不难对吧？把所有推动的轨迹串联起来，你就发现自己能够描绘多空竞合的历程了。这些转折都有故事，比如这里是一推比一推更上不去的样子。于是呈现出楔形顶熊旗的轮廓，后续确实转跌。而往下坠落以后，同样是屡屡无法有效下破，形成了由四次疲弱推动构成的牛旗。随后重新引发上涨。上涨完成进入横向的区间，又是多头与空头的竞争，互不相让，也没有谁能够说服对方。直到最后是多头胜出，延续了前面这段比较强劲的趋势动能，完成了基于急速高度的或者AB=CD的等距运动。","p":"p440"},{"t":"综合以上，如何为推动计数，你应该能够掌握到原则了。除了利用阴阳交替的断点来区分推动，你也可以在上涨的过程中以K线低点降低，也就是出现下降的回调K线来作为断线。反过来，在下跌的过程中，则在遇到K线高点抬升时进行分段。再不然，观察波动的高低点来直接划分，也是一个方法。这三者其实意思相去不远，只是用不同形式来为多空主导节奏的交替进行区段。而也正是因为方法的本质和类似，所以表现起来常有重合的部分。你可以通过大量的练习来尝试融会贯通一下。","p":"p441"}]},{"t":"para","text":"综合以上，如何为推动计数，你应该能够掌握到原则了。除了利用阴阳交替的断点来区分推动，你也可以在上涨的过程中以K线低点降低，也就是出现下降的回调K线来作为断线。反过来，在下跌的过程中，则在遇到K线高点抬升时进行分段。再不然，观察波动的高低点来直接划分，也是一个方法。这三者其实意思相去不远，只是用不同形式来为多空主导节奏的交替进行区段。而也正是因为方法的本质和类似，所以表现起来常有重合的部分。你可以通过大量的练习来尝试融会贯通一下。","pid":"p441"}],"wcount":6428},{"id":"l11B","title":"第B段　为推动计数与数K线方法","blocks":[{"t":"para","text":"L11B 为推动计数与数K线方法","pid":"p442"},{"t":"img","src":"assets/img/l11B_180.webp","ilabel":"11-15","icap":"L11　为推动计数与数K线方法","fid":"fig180","ctx":[{"t":"L11B 为推动计数与数K线方法","p":"p442"},{"t":"那你可能已经好奇许久的是数推到底可以做什么？它对交易的实用意义在哪里？前面零零散散的点到过，但统整起来说明就还没有。所以第二节的开头，我想也正是时候说清楚。基本上数推的本质功能很简单，就是让你自己能够清楚明白，多胜过了空几次，空胜过得多几次。在一轮下降趋势中，如果多头反败为胜越多次，那代表什么呢？代表买家正在积累，对吧？代表空头逐渐不能控制行情，反之亦然。因此，其实多数的波段都会在走出顺势的二或三推被逆势方阻断一到两次以后开启回调。这是价格行为运动的惯性，请你记住。有时候会到四推，但一个波段内含顺势的二到三推是常态。通常数量一到，会开启某种程度的回调，再决定后续的方向要往哪里去。如果觉得抽象，这其实跟我们提到的形态，牛/熊旗所能起到的反向运动作用是一模一样的意思。之所以回调，常在两段顺势推动之后结束，这是因为在第二推结束之际，熟谙交易数学的交易者已经透过AB=CD之类的方法测算合理的利润目标，并且止盈。那么，既然阶段性的利润空间都已经走出,顺势交易者，便多半会谨慎观望，以更加保守的态度等待新的多空竞合结果出现。是要开启新的同向的突破循环呢？还是突破失败转为逆向？而我需要倒戈加入对方。他们会观察考虑，再做出下一步行动。而尤其如果前方趋势都能强劲，那结局大概就会是延续趋势。那有时候在第二推结束以后，好不容易创出这两推的那一方，还会希望能够继续推动行情朝利己方向运动。此时就会走出第三推，尝试开启新的突破循环。不过，这一定会成功吗？那不一定。可能突破原趋势极值，没多远就升高失败了。以三推的楔形底为例，它作为牛旗之所以可以起到引发反向运动的作用，就是因为一推又一推之后。价格仍然没有大幅向下突破的意思。那就代表多空，双方都不认为均衡在更低处嘛，才会跌不下去。那价格就应该逆向探索，去找到更可能到达均衡的价位。综合以上知道一个波段，通常内含两到三次推动，价格可能在二推或三推之后。发生至少小型的趋势反转以后，实用功能就出来了。我们可以借此止盈，甚至借此开仓。","p":"p443"},{"t":"接着我们来看看这个交易日。从左读到右，我们看到的是一个开盘区间的上破。相信你还记忆犹新，知道基于区间的高度可以测算等距运动。因此画记出来之后，我们就看见突破后的价格确实在到位之后被涌现的反向订单拦阻。开始下落，而且是很急坠的下落。如果交易者认为这是空头的急速发起趋势，方向可能转空，那他们或许会跟着这里的空头动能交易者追进。或者他们也可能采取价值交易者的路线，等到价格向上运动，似乎测试不到高点。然后有两根趋势阴线尝试向下突破的迹象，才在下破瞬间入场。（此策略胜率更高）那么问题来了，对于这些在持仓中的空头来说，他们要怎么预期一个合理的止盈位置呢？现在你已经身怀绝技，可以运用磁体，也可以数推。譬如当日低点，应该是下方最重要的一个波段点，对吧？它可能是价格会想要去测试的位置。还有基于急速高度的等距运动目标也很接近当日低点。","p":"p444"}]},{"t":"para","text":"那你可能已经好奇许久的是数推到底可以做什么？它对交易的实用意义在哪里？前面零零散散的点到过，但统整起来说明就还没有。所以第二节的开头，我想也正是时候说清楚。基本上数推的本质功能很简单，就是让你自己能够清楚明白，多胜过了空几次，空胜过得多几次。在一轮下降趋势中，如果多头反败为胜越多次，那代表什么呢？代表买家正在积累，对吧？代表空头逐渐不能控制行情，反之亦然。因此，其实多数的波段都会在走出顺势的二或三推被逆势方阻断一到两次以后开启回调。这是价格行为运动的惯性，请你记住。有时候会到四推，但一个波段内含顺势的二到三推是常态。通常数量一到，会开启某种程度的回调，再决定后续的方向要往哪里去。如果觉得抽象，这其实跟我们提到的形态，牛/熊旗所能起到的反向运动作用是一模一样的意思。之所以回调，常在两段顺势推动之后结束，这是因为在第二推结束之际，熟谙交易数学的交易者已经透过AB=CD之类的方法测算合理的利润目标，并且止盈。那么，既然阶段性的利润空间都已经走出,顺势交易者，便多半会谨慎观望，以更加保守的态度等待新的多空竞合结果出现。是要开启新的同向的突破循环呢？还是突破失败转为逆向？而我需要倒戈加入对方。他们会观察考虑，再做出下一步行动。而尤其如果前方趋势都能强劲，那结局大概就会是延续趋势。那有时候在第二推结束以后，好不容易创出这两推的那一方，还会希望能够继续推动行情朝利己方向运动。此时就会走出第三推，尝试开启新的突破循环。不过，这一定会成功吗？那不一定。可能突破原趋势极值，没多远就升高失败了。以三推的楔形底为例，它作为牛旗之所以可以起到引发反向运动的作用，就是因为一推又一推之后。价格仍然没有大幅向下突破的意思。那就代表多空，双方都不认为均衡在更低处嘛，才会跌不下去。那价格就应该逆向探索，去找到更可能到达均衡的价位。综合以上知道一个波段，通常内含两到三次推动，价格可能在二推或三推之后。发生至少小型的趋势反转以后，实用功能就出来了。我们可以借此止盈，甚至借此开仓。","pid":"p443"},{"t":"para","text":"接着我们来看看这个交易日。从左读到右，我们看到的是一个开盘区间的上破。相信你还记忆犹新，知道基于区间的高度可以测算等距运动。因此画记出来之后，我们就看见突破后的价格确实在到位之后被涌现的反向订单拦阻。开始下落，而且是很急坠的下落。如果交易者认为这是空头的急速发起趋势，方向可能转空，那他们或许会跟着这里的空头动能交易者追进。或者他们也可能采取价值交易者的路线，等到价格向上运动，似乎测试不到高点。然后有两根趋势阴线尝试向下突破的迹象，才在下破瞬间入场。（此策略胜率更高）那么问题来了，对于这些在持仓中的空头来说，他们要怎么预期一个合理的止盈位置呢？现在你已经身怀绝技，可以运用磁体，也可以数推。譬如当日低点，应该是下方最重要的一个波段点，对吧？它可能是价格会想要去测试的位置。还有基于急速高度的等距运动目标也很接近当日低点。","pid":"p444"},{"t":"img","src":"assets/img/l11B_181.webp","ilabel":"11-16","icap":"L11　为推动计数与数K线方法","fid":"fig181","ctx":[{"t":"那你可能已经好奇许久的是数推到底可以做什么？它对交易的实用意义在哪里？前面零零散散的点到过，但统整起来说明就还没有。所以第二节的开头，我想也正是时候说清楚。基本上数推的本质功能很简单，就是让你自己能够清楚明白，多胜过了空几次，空胜过得多几次。在一轮下降趋势中，如果多头反败为胜越多次，那代表什么呢？代表买家正在积累，对吧？代表空头逐渐不能控制行情，反之亦然。因此，其实多数的波段都会在走出顺势的二或三推被逆势方阻断一到两次以后开启回调。这是价格行为运动的惯性，请你记住。有时候会到四推，但一个波段内含顺势的二到三推是常态。通常数量一到，会开启某种程度的回调，再决定后续的方向要往哪里去。如果觉得抽象，这其实跟我们提到的形态，牛/熊旗所能起到的反向运动作用是一模一样的意思。之所以回调，常在两段顺势推动之后结束，这是因为在第二推结束之际，熟谙交易数学的交易者已经透过AB=CD之类的方法测算合理的利润目标，并且止盈。那么，既然阶段性的利润空间都已经走出,顺势交易者，便多半会谨慎观望，以更加保守的态度等待新的多空竞合结果出现。是要开启新的同向的突破循环呢？还是突破失败转为逆向？而我需要倒戈加入对方。他们会观察考虑，再做出下一步行动。而尤其如果前方趋势都能强劲，那结局大概就会是延续趋势。那有时候在第二推结束以后，好不容易创出这两推的那一方，还会希望能够继续推动行情朝利己方向运动。此时就会走出第三推，尝试开启新的突破循环。不过，这一定会成功吗？那不一定。可能突破原趋势极值，没多远就升高失败了。以三推的楔形底为例，它作为牛旗之所以可以起到引发反向运动的作用，就是因为一推又一推之后。价格仍然没有大幅向下突破的意思。那就代表多空，双方都不认为均衡在更低处嘛，才会跌不下去。那价格就应该逆向探索，去找到更可能到达均衡的价位。综合以上知道一个波段，通常内含两到三次推动，价格可能在二推或三推之后。发生至少小型的趋势反转以后，实用功能就出来了。我们可以借此止盈，甚至借此开仓。","p":"p443"},{"t":"接着我们来看看这个交易日。从左读到右，我们看到的是一个开盘区间的上破。相信你还记忆犹新，知道基于区间的高度可以测算等距运动。因此画记出来之后，我们就看见突破后的价格确实在到位之后被涌现的反向订单拦阻。开始下落，而且是很急坠的下落。如果交易者认为这是空头的急速发起趋势，方向可能转空，那他们或许会跟着这里的空头动能交易者追进。或者他们也可能采取价值交易者的路线，等到价格向上运动，似乎测试不到高点。然后有两根趋势阴线尝试向下突破的迹象，才在下破瞬间入场。（此策略胜率更高）那么问题来了，对于这些在持仓中的空头来说，他们要怎么预期一个合理的止盈位置呢？现在你已经身怀绝技，可以运用磁体，也可以数推。譬如当日低点，应该是下方最重要的一个波段点，对吧？它可能是价格会想要去测试的位置。还有基于急速高度的等距运动目标也很接近当日低点。","p":"p444"},{"t":"（该跑路了）","p":"p445"},{"t":"这么一来，当价格以第二个波段，第三个波段的形式往下去走。你就可以想起楔形底形成的可能性，想起行情可以结束于第三段运动，因而将这个范围视作是多重的空头不利因素的汇聚处，高几率引发买单涌入。有了这样的意识，当你看到这根长下影线的收出后，续接了一根粗勇的阳线。那还握持空仓的你就可以警觉的离场了。","p":"p446"},{"t":"掌握磁体，掌握数推的技术，你能够更容易捕捉到价格可能折返的瞬间。用来开仓，用来止盈，都非常好用。说到开仓，这甚至也是一个很棒的入场位置。背靠今日低点的双K线反转，既对这个区间交易日来说是双重底的可能起点。其右峰还是由一个三推的楔形底组成。所以在这里入场，后续可以看到不错的上涨动能，而回调以两推或说三推终结开始转涨。你可以预期还有第二个波段做延续。这么做磁体和数推的技术就能够同时用上。和晓得可行的目标，以后就可以比较心安的盯着目标，让价格自动走到触发止盈。","p":"p447"}]},{"t":"para","text":"（该跑路了）","pid":"p445"},{"t":"para","text":"这么一来，当价格以第二个波段，第三个波段的形式往下去走。你就可以想起楔形底形成的可能性，想起行情可以结束于第三段运动，因而将这个范围视作是多重的空头不利因素的汇聚处，高几率引发买单涌入。有了这样的意识，当你看到这根长下影线的收出后，续接了一根粗勇的阳线。那还握持空仓的你就可以警觉的离场了。","pid":"p446"},{"t":"para","text":"掌握磁体，掌握数推的技术，你能够更容易捕捉到价格可能折返的瞬间。用来开仓，用来止盈，都非常好用。说到开仓，这甚至也是一个很棒的入场位置。背靠今日低点的双K线反转，既对这个区间交易日来说是双重底的可能起点。其右峰还是由一个三推的楔形底组成。所以在这里入场，后续可以看到不错的上涨动能，而回调以两推或说三推终结开始转涨。你可以预期还有第二个波段做延续。这么做磁体和数推的技术就能够同时用上。和晓得可行的目标，以后就可以比较心安的盯着目标，让价格自动走到触发止盈。","pid":"p447"},{"t":"img","src":"assets/img/l11B_182.webp","ilabel":"11-17","icap":"L11　为推动计数与数K线方法","fid":"fig182","ctx":[{"t":"这么一来，当价格以第二个波段，第三个波段的形式往下去走。你就可以想起楔形底形成的可能性，想起行情可以结束于第三段运动，因而将这个范围视作是多重的空头不利因素的汇聚处，高几率引发买单涌入。有了这样的意识，当你看到这根长下影线的收出后，续接了一根粗勇的阳线。那还握持空仓的你就可以警觉的离场了。","p":"p446"},{"t":"掌握磁体，掌握数推的技术，你能够更容易捕捉到价格可能折返的瞬间。用来开仓，用来止盈，都非常好用。说到开仓，这甚至也是一个很棒的入场位置。背靠今日低点的双K线反转，既对这个区间交易日来说是双重底的可能起点。其右峰还是由一个三推的楔形底组成。所以在这里入场，后续可以看到不错的上涨动能，而回调以两推或说三推终结开始转涨。你可以预期还有第二个波段做延续。这么做磁体和数推的技术就能够同时用上。和晓得可行的目标，以后就可以比较心安的盯着目标，让价格自动走到触发止盈。","p":"p447"},{"t":"那这个例子也一样，非常工整。开盘区间突破以后，价格先在等距运动目标位置进入转折。然后以一个急速与通道的小型三推完成了回调，踩到50%回调处。与此也同时，测试开盘区间顶部，也就是刚刚的突破点。反弹之后，第二个波段以两推组成。显示为对于原趋势极值的，不怎么成功的突破之后又进入回调。而回调是等距的二推运动，同样在50%回调处起高。这时候你已经可以料想到，这是一个大型的急速与通道趋势交易日。目前，已有第一和第二个波段，只见东风。将通道线找出来，将AB=CD的目标算好，并且确认接下来这里的重合磁体可能给多方造成压力之后。你就可以想象，既然这轮趋势不是以两个波段告终，那就很可能还有第三段上涨。抵达这个复合磁体区域，演变成一个楔形顶反转。而后却是如此发生，以一个陡峭的三推形式，一举穿破趋势线，挑战前波段点。并在二推回调之后，又转跌完成AB=CD的等距运动，同时测试到通道起点。最后略略反弹，直到图表结束，使整个图表上半部成为一个双边交易性格比较强的宽泛地带。在这个例子，你能够很清楚的看见多数推动内部都是由顺势的二推或三推所构成。而对于整张图表左半边的这一轮大型上涨而言，同样是在顺势的三个波段之后进入深度回调。而右半边的下跌部分也同样能够拆成两个波段。这正是为什么前面我们要强调碎形的概念，强调多数波段都以二或三推终极的原因。知道这种特性的交易者不会着急忙慌的过早止盈，但也不会贪婪的做一次性走出八推十推，远到天边的白日梦。而开仓亦然，学会首推能够优化你的开仓决策，很多时候只要背靠强力的磁体。运用二或三推之后，可能至少会有小型趋势反转的惯性，你就能够争取到剥头皮利润，乃至于波段利润。","p":"p448"}]},{"t":"para","text":"那这个例子也一样，非常工整。开盘区间突破以后，价格先在等距运动目标位置进入转折。然后以一个急速与通道的小型三推完成了回调，踩到50%回调处。与此也同时，测试开盘区间顶部，也就是刚刚的突破点。反弹之后，第二个波段以两推组成。显示为对于原趋势极值的，不怎么成功的突破之后又进入回调。而回调是等距的二推运动，同样在50%回调处起高。这时候你已经可以料想到，这是一个大型的急速与通道趋势交易日。目前，已有第一和第二个波段，只见东风。将通道线找出来，将AB=CD的目标算好，并且确认接下来这里的重合磁体可能给多方造成压力之后。你就可以想象，既然这轮趋势不是以两个波段告终，那就很可能还有第三段上涨。抵达这个复合磁体区域，演变成一个楔形顶反转。而后却是如此发生，以一个陡峭的三推形式，一举穿破趋势线，挑战前波段点。并在二推回调之后，又转跌完成AB=CD的等距运动，同时测试到通道起点。最后略略反弹，直到图表结束，使整个图表上半部成为一个双边交易性格比较强的宽泛地带。在这个例子，你能够很清楚的看见多数推动内部都是由顺势的二推或三推所构成。而对于整张图表左半边的这一轮大型上涨而言，同样是在顺势的三个波段之后进入深度回调。而右半边的下跌部分也同样能够拆成两个波段。这正是为什么前面我们要强调碎形的概念，强调多数波段都以二或三推终极的原因。知道这种特性的交易者不会着急忙慌的过早止盈，但也不会贪婪的做一次性走出八推十推，远到天边的白日梦。而开仓亦然，学会首推能够优化你的开仓决策，很多时候只要背靠强力的磁体。运用二或三推之后，可能至少会有小型趋势反转的惯性，你就能够争取到剥头皮利润，乃至于波段利润。","pid":"p448"},{"t":"img","src":"assets/img/l11B_183.webp","ilabel":"11-18","icap":"L11　为推动计数与数K线方法","fid":"fig183","ctx":[{"t":"那这个例子也一样，非常工整。开盘区间突破以后，价格先在等距运动目标位置进入转折。然后以一个急速与通道的小型三推完成了回调，踩到50%回调处。与此也同时，测试开盘区间顶部，也就是刚刚的突破点。反弹之后，第二个波段以两推组成。显示为对于原趋势极值的，不怎么成功的突破之后又进入回调。而回调是等距的二推运动，同样在50%回调处起高。这时候你已经可以料想到，这是一个大型的急速与通道趋势交易日。目前，已有第一和第二个波段，只见东风。将通道线找出来，将AB=CD的目标算好，并且确认接下来这里的重合磁体可能给多方造成压力之后。你就可以想象，既然这轮趋势不是以两个波段告终，那就很可能还有第三段上涨。抵达这个复合磁体区域，演变成一个楔形顶反转。而后却是如此发生，以一个陡峭的三推形式，一举穿破趋势线，挑战前波段点。并在二推回调之后，又转跌完成AB=CD的等距运动，同时测试到通道起点。最后略略反弹，直到图表结束，使整个图表上半部成为一个双边交易性格比较强的宽泛地带。在这个例子，你能够很清楚的看见多数推动内部都是由顺势的二推或三推所构成。而对于整张图表左半边的这一轮大型上涨而言，同样是在顺势的三个波段之后进入深度回调。而右半边的下跌部分也同样能够拆成两个波段。这正是为什么前面我们要强调碎形的概念，强调多数波段都以二或三推终极的原因。知道这种特性的交易者不会着急忙慌的过早止盈，但也不会贪婪的做一次性走出八推十推，远到天边的白日梦。而开仓亦然，学会首推能够优化你的开仓决策，很多时候只要背靠强力的磁体。运用二或三推之后，可能至少会有小型趋势反转的惯性，你就能够争取到剥头皮利润，乃至于波段利润。","p":"p448"},{"t":"那关于数推，我还有一些事情想要提醒你。可以算是除了阴阳交替出现回调K线连接显著高低点以外的第四个辅助性原则。那就是重视外观的匹配程度。所谓的匹配程度，就是你会大致希望每一段的推动规模长得差不多之间相距，也不要太远，尽量在视觉效果上是匀称的。以这个段落来说，更合意的做法可能是这样算成两推而非三推。虽然纯粹采“关注回调K线”的原则去说，这里就是有一次K线低点降低。此处可以一分为二，我也不能说不对。但就规模的比较来讲，后面这一推有一点太大了，好像跟前面两个小朋友不是一个等级的事情。所以将前面两小推合并为一大推，认为总共两推，而前面这里不过是一推内部的两个分支。应该会是稍微更合意的做法。怎么说呢？因为市场中占据多数成交量的机构，交易者里头不乏有很大的占比，是采取技术分析进行决策的。因此，任何形态看起来越优质，越接近理想中的样貌，那它就越可能被这些算法识别出来。而要是多数人都能够识别出来，并且共同对其采取应对措施，那他就越可能按照期待的方式去运作。这也就是说，要使实际出现的形态与理型相去越远。其表现亦将越不理想。试想，这里走出一个近似于急速运动的窄幅通道之后，有个规模匹配的第二推。你预想价格在第三推碰触到通道线之后，可能会有一定程度的反弹。但如果中间磨蹭了几百根K线，都没有到位。第一推跟第二推之间存续的K线只有四五根。但第二推跟第三推的间距具有130，140根K线。那么，我们还能期待价格出现之后就真的展开反弹吗？必须说有几率但变得很低，不值得你冒险去押注。如果三推之间的间距相距太远，每推的规模包括K线数量和振幅似乎都不起来。那多数机构算法就很可能倾向不将其视为同一组能发挥作用的三推，不认为在这里发生的任何价格行为。会跟这两段小推动有关。既然失去了这种心理预期，那么真正会去部署反向订单的参与者也就会很少。那市场也就可能忽略这个位置。我们总会希望在划定推动的时候被视作同一组的推动成员，匹配度良好，规模相当。如何为推动技术除了有何作用以及应该注意什么事项你都晓得了。","p":"p449"}]},{"t":"para","text":"那关于数推，我还有一些事情想要提醒你。可以算是除了阴阳交替出现回调K线连接显著高低点以外的第四个辅助性原则。那就是重视外观的匹配程度。所谓的匹配程度，就是你会大致希望每一段的推动规模长得差不多之间相距，也不要太远，尽量在视觉效果上是匀称的。以这个段落来说，更合意的做法可能是这样算成两推而非三推。虽然纯粹采“关注回调K线”的原则去说，这里就是有一次K线低点降低。此处可以一分为二，我也不能说不对。但就规模的比较来讲，后面这一推有一点太大了，好像跟前面两个小朋友不是一个等级的事情。所以将前面两小推合并为一大推，认为总共两推，而前面这里不过是一推内部的两个分支。应该会是稍微更合意的做法。怎么说呢？因为市场中占据多数成交量的机构，交易者里头不乏有很大的占比，是采取技术分析进行决策的。因此，任何形态看起来越优质，越接近理想中的样貌，那它就越可能被这些算法识别出来。而要是多数人都能够识别出来，并且共同对其采取应对措施，那他就越可能按照期待的方式去运作。这也就是说，要使实际出现的形态与理型相去越远。其表现亦将越不理想。试想，这里走出一个近似于急速运动的窄幅通道之后，有个规模匹配的第二推。你预想价格在第三推碰触到通道线之后，可能会有一定程度的反弹。但如果中间磨蹭了几百根K线，都没有到位。第一推跟第二推之间存续的K线只有四五根。但第二推跟第三推的间距具有130，140根K线。那么，我们还能期待价格出现之后就真的展开反弹吗？必须说有几率但变得很低，不值得你冒险去押注。如果三推之间的间距相距太远，每推的规模包括K线数量和振幅似乎都不起来。那多数机构算法就很可能倾向不将其视为同一组能发挥作用的三推，不认为在这里发生的任何价格行为。会跟这两段小推动有关。既然失去了这种心理预期，那么真正会去部署反向订单的参与者也就会很少。那市场也就可能忽略这个位置。我们总会希望在划定推动的时候被视作同一组的推动成员，匹配度良好，规模相当。如何为推动技术除了有何作用以及应该注意什么事项你都晓得了。","pid":"p449"},{"t":"img","src":"assets/img/l11B_184.webp","ilabel":"11-19","icap":"L11　为推动计数与数K线方法","fid":"fig184","ctx":[{"t":"那关于数推，我还有一些事情想要提醒你。可以算是除了阴阳交替出现回调K线连接显著高低点以外的第四个辅助性原则。那就是重视外观的匹配程度。所谓的匹配程度，就是你会大致希望每一段的推动规模长得差不多之间相距，也不要太远，尽量在视觉效果上是匀称的。以这个段落来说，更合意的做法可能是这样算成两推而非三推。虽然纯粹采“关注回调K线”的原则去说，这里就是有一次K线低点降低。此处可以一分为二，我也不能说不对。但就规模的比较来讲，后面这一推有一点太大了，好像跟前面两个小朋友不是一个等级的事情。所以将前面两小推合并为一大推，认为总共两推，而前面这里不过是一推内部的两个分支。应该会是稍微更合意的做法。怎么说呢？因为市场中占据多数成交量的机构，交易者里头不乏有很大的占比，是采取技术分析进行决策的。因此，任何形态看起来越优质，越接近理想中的样貌，那它就越可能被这些算法识别出来。而要是多数人都能够识别出来，并且共同对其采取应对措施，那他就越可能按照期待的方式去运作。这也就是说，要使实际出现的形态与理型相去越远。其表现亦将越不理想。试想，这里走出一个近似于急速运动的窄幅通道之后，有个规模匹配的第二推。你预想价格在第三推碰触到通道线之后，可能会有一定程度的反弹。但如果中间磨蹭了几百根K线，都没有到位。第一推跟第二推之间存续的K线只有四五根。但第二推跟第三推的间距具有130，140根K线。那么，我们还能期待价格出现之后就真的展开反弹吗？必须说有几率但变得很低，不值得你冒险去押注。如果三推之间的间距相距太远，每推的规模包括K线数量和振幅似乎都不起来。那多数机构算法就很可能倾向不将其视为同一组能发挥作用的三推，不认为在这里发生的任何价格行为。会跟这两段小推动有关。既然失去了这种心理预期，那么真正会去部署反向订单的参与者也就会很少。那市场也就可能忽略这个位置。我们总会希望在划定推动的时候被视作同一组的推动成员，匹配度良好，规模相当。如何为推动技术除了有何作用以及应该注意什么事项你都晓得了。","p":"p449"},{"t":"那接下来我们来讲它的另一种形式数K线。我在想，多数人对阿尔布鲁克斯的第一印象，对初步的认识很可能就源自于数K线。这是一个很有名的技术，至少比起对决线啦，等距运动啦，急速与通道这些在阿尔布鲁克斯的知识体系里。同样重要的组成部分，更加出圈，更被非价格行为学派的交易者所认识。经过一些三流转译者的夸大，数K线似乎被形容成有什么奇效，学会了就无往不利。但祛魅来看，持平而论，数K线其实就是数推而已，基本上是一模一样。的确好用，但毕竟只是一项工具，平常心理性使用即可。","p":"p450"},{"t":"那同样我们先来说如何数？数K线通常可以分为高一，高二，高三，高四以及低一，低二，低三，低四。根据书中还算蛮清晰的定义，高一指的是在牛旗或区间底部附近出现的。高点高于其前一根K线的K线。也就是说，数K线的时机基本上已经严格的帮你限定好了，它需要在一个看涨的环境下去数。比如什么呢？比如你在上升趋势中出现的阴线作为回调，那么根据趋势倾向延续。反转尝试倾向失败的道理，这样的阴线回调是终究会被多头反超的，对吧？那若是这里出现K线高点抬升，也就是多头发力向上突破，前一根K线终止了被空头暂时控制的局势。那这就是一个牛旗，是一个微型的下降通道，是一个看涨的环境。又比如，他说区间底部。我们知道区间是市场围绕着公平价格震荡区间下缘，代表过度廉价，区间上缘则是过度昂贵。因此，当价格移动到这个过渡的边界，那此时多头争取等剧利润的胜率应高过50%。比做空更有数学优势。于是这里价格就倾向反转向上。所以说在区间下缘，或者你可以笼统的说区间的下三分之一处是个同样偏向看涨的环境。那么你就可以背靠着作为磁体作为支撑的区间下缘去寻找多头突破前一根K线的证据。那在这两个例子里，箭头所指的K线就是造成高一的K线。高一发生的时机就在于前一根K线高点被向上突破的瞬间。这也就是说，高一的本质是空头，试图将趋势反转向下，但失败。它在上升趋势中标志的回调中，第一推的终结以及对区间底部下破尝试的第一推终结。那高二呢？下根K线继续高点抬升，这就是高二吗？并非，根据定义，接下来必须先出现高点下降，再次出现高点抬升时高二才发生。也就是说，如果把后面的内容都先显露出来，我们可以根据刚刚的要求，需要先降低再抬高。这样重新抬高的K线，才算做高二。那高二就在这里。同理，当第三次发生则是高三。如果还有第四次，同样是先降低再抬高，那就是高四。聪明的你意会到了吗？这其实跟数推并无二致。如果我们以数推的角度试着拆解，这里头蕴含的波折，那应该就会是这样的。各有向下的顺势的三推，而多头总共向上突破了三次。这也就是说，如我们先前提到的数推的目的在于用计量的方式让自己明确的心心念念。目前，多头胜过了空头几次，空头又胜过了多头几次。并且结合波段通常在顺势走出两推或三推以后结束的这一点来捕捉小型趋势反转的发生时机。那么，数K线的功用依然它基本上就是更小规模的数推。主要是位于看涨的环境，在微观尺度下，这些较小的下降推动也常常在出现。高二或高三之后反转走高。如果上述内容你听明白了，我们可以重返一下，在前一节看过的这个例子。找找上升趋势中的回调，都是如何结束的。同样突破昨日留下的小区间之后，价格一路向上挺进，直到这里出现了回调。那么，回调以后高一，高二分别出现在何处呢？根据定义，高一是高点第一次重新抬高的位置。因此，在这颗阳线十字星后面，阴线向上突破了阳线高点，这时高一就发生了。而后，我们等待高点重新抬升。也就是说，如果继续抬升，我们先不数，等到降低之后再抬升才去数它。于是接下来我们看到的是K线的一路降低，直到此处又收了一颗阳线十字星。而后形成趋势，阳线上破十字星高点，我们便看见高二成立，后续趋势也就恢复。如此一来，我们就得到一个以高二做节的回调，内部可以区分为两段，推动视为双重底牛旗。眼尖的你应该发现了，或说再次体会到了数K线的方法，其实似乎跟数推的第二项原则非常相近。还记得我们说在这段小型的下降趋势中推动，应该如何数吗？就如刚刚说的，这是一个二推回调。这样话除了规模匹配，也是每逢有K线高点抬升，对于下降趋势来说，出现上升的回调。我们就会推动分段。而K线高点抬深，也正是高一高二的计数时机。于是你也就不难明白，为什么我们说数K线跟数推共享相同的本质？一个高二回调就是一个二推回调，而二推的牛旗又正是所谓双重底牛旗。于是这里你要称它为高二形态，二推回调形态，还是双重底牛旗都可以。总之是空头两次向下打压行情未果，都被多头反超，于是证实了均衡不在下方。价格要往上继续探索。下一次回调发生在哪里呢？发生在这根阳线处。刚刚一路上K线低点，不断抬高，顶多持平。但是这里第一次下降是为回调。那既然我们发现到前方上升趋势很强，几乎没有卖压可言。那我们就可以认为，即使回调开启，也应该终究能够继续引发上涨的突破，此处仍然是看涨的环境。遂此，我们再来找找看高一到四分别在什么地方呢？图片比较小，怕你看不清楚。我把它放大之后拉伸一下高度，这样应该比较好判断。请你试着训练自己在非常短的时间内就能找到答案。接着我们再对对看。想好了吗？我同样标记出来，高一在阳线十字星上破之时。高二则隔了比较久，是发生在这个双K线反转处，趋势阳线向上吞没阴线。再来高三发生以前，价格探的稍微低一点，位置是在这里。高四则稍微高一点，在这根趋势阳线上破前一根小阴线的时候。如果你愿意继续走下去，高五实际上发生在这里。高六则比较不明确，是在最后一根阳线造成高点抬升的地方。但总之，只要掌握重新抬高时才数的原则，那么你就通通都能够将它们给找出来。同样以为推动计数的角度来剖析这轮回调演变为区间的过程，你不难发现。区间的前半部实际上是一个三推的楔形底。那与方才的双重底牛旗同理如果说高二是双重底，那么高三就等同于楔形底。你能够找到三次向下的推动，而也三次都被多头否决反超。那高四是怎么一回事呢？看起来更像是楔形趋势线被上破以后，恢复顺势运动以前的突破回调。而确实，这里也完成了AB=CD的等距运动。只可惜价格才刚次破原趋势极值就失去动力，反转向下。刚刚的楔形底牛旗成为了末端旗型而回调启动之后的K线数量，也因为超过20根还未恢复趋势，而成为了一个区间。通常，阿尔布鲁克斯总结的经验是，当上升趋势的回调出现，高四以后仍然还未恢复。那么就会常常已经超过20根K线转入区间。变成区间，也意味着现在多空势均力敌，多头仍然掌控趋势，主导权的几率下降到趋近于50%。因此，如果高二后趋势还未恢复，高三也失败，那交易者就要预期接下来陷入纠结的可能性大得多。所以数到高四就差不多了。高五六七就不用费心关注。届时，大概已经不是定义所限定的，看涨的环境了。","p":"p451"}]},{"t":"para","text":"那接下来我们来讲它的另一种形式数K线。我在想，多数人对阿尔布鲁克斯的第一印象，对初步的认识很可能就源自于数K线。这是一个很有名的技术，至少比起对决线啦，等距运动啦，急速与通道这些在阿尔布鲁克斯的知识体系里。同样重要的组成部分，更加出圈，更被非价格行为学派的交易者所认识。经过一些三流转译者的夸大，数K线似乎被形容成有什么奇效，学会了就无往不利。但祛魅来看，持平而论，数K线其实就是数推而已，基本上是一模一样。的确好用，但毕竟只是一项工具，平常心理性使用即可。","pid":"p450"},{"t":"para","text":"那同样我们先来说如何数？数K线通常可以分为高一，高二，高三，高四以及低一，低二，低三，低四。根据书中还算蛮清晰的定义，高一指的是在牛旗或区间底部附近出现的。高点高于其前一根K线的K线。也就是说，数K线的时机基本上已经严格的帮你限定好了，它需要在一个看涨的环境下去数。比如什么呢？比如你在上升趋势中出现的阴线作为回调，那么根据趋势倾向延续。反转尝试倾向失败的道理，这样的阴线回调是终究会被多头反超的，对吧？那若是这里出现K线高点抬升，也就是多头发力向上突破，前一根K线终止了被空头暂时控制的局势。那这就是一个牛旗，是一个微型的下降通道，是一个看涨的环境。又比如，他说区间底部。我们知道区间是市场围绕着公平价格震荡区间下缘，代表过度廉价，区间上缘则是过度昂贵。因此，当价格移动到这个过渡的边界，那此时多头争取等剧利润的胜率应高过50%。比做空更有数学优势。于是这里价格就倾向反转向上。所以说在区间下缘，或者你可以笼统的说区间的下三分之一处是个同样偏向看涨的环境。那么你就可以背靠着作为磁体作为支撑的区间下缘去寻找多头突破前一根K线的证据。那在这两个例子里，箭头所指的K线就是造成高一的K线。高一发生的时机就在于前一根K线高点被向上突破的瞬间。这也就是说，高一的本质是空头，试图将趋势反转向下，但失败。它在上升趋势中标志的回调中，第一推的终结以及对区间底部下破尝试的第一推终结。那高二呢？下根K线继续高点抬升，这就是高二吗？并非，根据定义，接下来必须先出现高点下降，再次出现高点抬升时高二才发生。也就是说，如果把后面的内容都先显露出来，我们可以根据刚刚的要求，需要先降低再抬高。这样重新抬高的K线，才算做高二。那高二就在这里。同理，当第三次发生则是高三。如果还有第四次，同样是先降低再抬高，那就是高四。聪明的你意会到了吗？这其实跟数推并无二致。如果我们以数推的角度试着拆解，这里头蕴含的波折，那应该就会是这样的。各有向下的顺势的三推，而多头总共向上突破了三次。这也就是说，如我们先前提到的数推的目的在于用计量的方式让自己明确的心心念念。目前，多头胜过了空头几次，空头又胜过了多头几次。并且结合波段通常在顺势走出两推或三推以后结束的这一点来捕捉小型趋势反转的发生时机。那么，数K线的功用依然它基本上就是更小规模的数推。主要是位于看涨的环境，在微观尺度下，这些较小的下降推动也常常在出现。高二或高三之后反转走高。如果上述内容你听明白了，我们可以重返一下，在前一节看过的这个例子。找找上升趋势中的回调，都是如何结束的。同样突破昨日留下的小区间之后，价格一路向上挺进，直到这里出现了回调。那么，回调以后高一，高二分别出现在何处呢？根据定义，高一是高点第一次重新抬高的位置。因此，在这颗阳线十字星后面，阴线向上突破了阳线高点，这时高一就发生了。而后，我们等待高点重新抬升。也就是说，如果继续抬升，我们先不数，等到降低之后再抬升才去数它。于是接下来我们看到的是K线的一路降低，直到此处又收了一颗阳线十字星。而后形成趋势，阳线上破十字星高点，我们便看见高二成立，后续趋势也就恢复。如此一来，我们就得到一个以高二做节的回调，内部可以区分为两段，推动视为双重底牛旗。眼尖的你应该发现了，或说再次体会到了数K线的方法，其实似乎跟数推的第二项原则非常相近。还记得我们说在这段小型的下降趋势中推动，应该如何数吗？就如刚刚说的，这是一个二推回调。这样话除了规模匹配，也是每逢有K线高点抬升，对于下降趋势来说，出现上升的回调。我们就会推动分段。而K线高点抬深，也正是高一高二的计数时机。于是你也就不难明白，为什么我们说数K线跟数推共享相同的本质？一个高二回调就是一个二推回调，而二推的牛旗又正是所谓双重底牛旗。于是这里你要称它为高二形态，二推回调形态，还是双重底牛旗都可以。总之是空头两次向下打压行情未果，都被多头反超，于是证实了均衡不在下方。价格要往上继续探索。下一次回调发生在哪里呢？发生在这根阳线处。刚刚一路上K线低点，不断抬高，顶多持平。但是这里第一次下降是为回调。那既然我们发现到前方上升趋势很强，几乎没有卖压可言。那我们就可以认为，即使回调开启，也应该终究能够继续引发上涨的突破，此处仍然是看涨的环境。遂此，我们再来找找看高一到四分别在什么地方呢？图片比较小，怕你看不清楚。我把它放大之后拉伸一下高度，这样应该比较好判断。请你试着训练自己在非常短的时间内就能找到答案。接着我们再对对看。想好了吗？我同样标记出来，高一在阳线十字星上破之时。高二则隔了比较久，是发生在这个双K线反转处，趋势阳线向上吞没阴线。再来高三发生以前，价格探的稍微低一点，位置是在这里。高四则稍微高一点，在这根趋势阳线上破前一根小阴线的时候。如果你愿意继续走下去，高五实际上发生在这里。高六则比较不明确，是在最后一根阳线造成高点抬升的地方。但总之，只要掌握重新抬高时才数的原则，那么你就通通都能够将它们给找出来。同样以为推动计数的角度来剖析这轮回调演变为区间的过程，你不难发现。区间的前半部实际上是一个三推的楔形底。那与方才的双重底牛旗同理如果说高二是双重底，那么高三就等同于楔形底。你能够找到三次向下的推动，而也三次都被多头否决反超。那高四是怎么一回事呢？看起来更像是楔形趋势线被上破以后，恢复顺势运动以前的突破回调。而确实，这里也完成了AB=CD的等距运动。只可惜价格才刚次破原趋势极值就失去动力，反转向下。刚刚的楔形底牛旗成为了末端旗型而回调启动之后的K线数量，也因为超过20根还未恢复趋势，而成为了一个区间。通常，阿尔布鲁克斯总结的经验是，当上升趋势的回调出现，高四以后仍然还未恢复。那么就会常常已经超过20根K线转入区间。变成区间，也意味着现在多空势均力敌，多头仍然掌控趋势，主导权的几率下降到趋近于50%。因此，如果高二后趋势还未恢复，高三也失败，那交易者就要预期接下来陷入纠结的可能性大得多。所以数到高四就差不多了。高五六七就不用费心关注。届时，大概已经不是定义所限定的，看涨的环境了。","pid":"p451"},{"t":"img","src":"assets/img/l11B_185.webp","ilabel":"11-20","icap":"L11　为推动计数与数K线方法","fid":"fig185","ctx":[{"t":"那接下来我们来讲它的另一种形式数K线。我在想，多数人对阿尔布鲁克斯的第一印象，对初步的认识很可能就源自于数K线。这是一个很有名的技术，至少比起对决线啦，等距运动啦，急速与通道这些在阿尔布鲁克斯的知识体系里。同样重要的组成部分，更加出圈，更被非价格行为学派的交易者所认识。经过一些三流转译者的夸大，数K线似乎被形容成有什么奇效，学会了就无往不利。但祛魅来看，持平而论，数K线其实就是数推而已，基本上是一模一样。的确好用，但毕竟只是一项工具，平常心理性使用即可。","p":"p450"},{"t":"那同样我们先来说如何数？数K线通常可以分为高一，高二，高三，高四以及低一，低二，低三，低四。根据书中还算蛮清晰的定义，高一指的是在牛旗或区间底部附近出现的。高点高于其前一根K线的K线。也就是说，数K线的时机基本上已经严格的帮你限定好了，它需要在一个看涨的环境下去数。比如什么呢？比如你在上升趋势中出现的阴线作为回调，那么根据趋势倾向延续。反转尝试倾向失败的道理，这样的阴线回调是终究会被多头反超的，对吧？那若是这里出现K线高点抬升，也就是多头发力向上突破，前一根K线终止了被空头暂时控制的局势。那这就是一个牛旗，是一个微型的下降通道，是一个看涨的环境。又比如，他说区间底部。我们知道区间是市场围绕着公平价格震荡区间下缘，代表过度廉价，区间上缘则是过度昂贵。因此，当价格移动到这个过渡的边界，那此时多头争取等剧利润的胜率应高过50%。比做空更有数学优势。于是这里价格就倾向反转向上。所以说在区间下缘，或者你可以笼统的说区间的下三分之一处是个同样偏向看涨的环境。那么你就可以背靠着作为磁体作为支撑的区间下缘去寻找多头突破前一根K线的证据。那在这两个例子里，箭头所指的K线就是造成高一的K线。高一发生的时机就在于前一根K线高点被向上突破的瞬间。这也就是说，高一的本质是空头，试图将趋势反转向下，但失败。它在上升趋势中标志的回调中，第一推的终结以及对区间底部下破尝试的第一推终结。那高二呢？下根K线继续高点抬升，这就是高二吗？并非，根据定义，接下来必须先出现高点下降，再次出现高点抬升时高二才发生。也就是说，如果把后面的内容都先显露出来，我们可以根据刚刚的要求，需要先降低再抬高。这样重新抬高的K线，才算做高二。那高二就在这里。同理，当第三次发生则是高三。如果还有第四次，同样是先降低再抬高，那就是高四。聪明的你意会到了吗？这其实跟数推并无二致。如果我们以数推的角度试着拆解，这里头蕴含的波折，那应该就会是这样的。各有向下的顺势的三推，而多头总共向上突破了三次。这也就是说，如我们先前提到的数推的目的在于用计量的方式让自己明确的心心念念。目前，多头胜过了空头几次，空头又胜过了多头几次。并且结合波段通常在顺势走出两推或三推以后结束的这一点来捕捉小型趋势反转的发生时机。那么，数K线的功用依然它基本上就是更小规模的数推。主要是位于看涨的环境，在微观尺度下，这些较小的下降推动也常常在出现。高二或高三之后反转走高。如果上述内容你听明白了，我们可以重返一下，在前一节看过的这个例子。找找上升趋势中的回调，都是如何结束的。同样突破昨日留下的小区间之后，价格一路向上挺进，直到这里出现了回调。那么，回调以后高一，高二分别出现在何处呢？根据定义，高一是高点第一次重新抬高的位置。因此，在这颗阳线十字星后面，阴线向上突破了阳线高点，这时高一就发生了。而后，我们等待高点重新抬升。也就是说，如果继续抬升，我们先不数，等到降低之后再抬升才去数它。于是接下来我们看到的是K线的一路降低，直到此处又收了一颗阳线十字星。而后形成趋势，阳线上破十字星高点，我们便看见高二成立，后续趋势也就恢复。如此一来，我们就得到一个以高二做节的回调，内部可以区分为两段，推动视为双重底牛旗。眼尖的你应该发现了，或说再次体会到了数K线的方法，其实似乎跟数推的第二项原则非常相近。还记得我们说在这段小型的下降趋势中推动，应该如何数吗？就如刚刚说的，这是一个二推回调。这样话除了规模匹配，也是每逢有K线高点抬升，对于下降趋势来说，出现上升的回调。我们就会推动分段。而K线高点抬深，也正是高一高二的计数时机。于是你也就不难明白，为什么我们说数K线跟数推共享相同的本质？一个高二回调就是一个二推回调，而二推的牛旗又正是所谓双重底牛旗。于是这里你要称它为高二形态，二推回调形态，还是双重底牛旗都可以。总之是空头两次向下打压行情未果，都被多头反超，于是证实了均衡不在下方。价格要往上继续探索。下一次回调发生在哪里呢？发生在这根阳线处。刚刚一路上K线低点，不断抬高，顶多持平。但是这里第一次下降是为回调。那既然我们发现到前方上升趋势很强，几乎没有卖压可言。那我们就可以认为，即使回调开启，也应该终究能够继续引发上涨的突破，此处仍然是看涨的环境。遂此，我们再来找找看高一到四分别在什么地方呢？图片比较小，怕你看不清楚。我把它放大之后拉伸一下高度，这样应该比较好判断。请你试着训练自己在非常短的时间内就能找到答案。接着我们再对对看。想好了吗？我同样标记出来，高一在阳线十字星上破之时。高二则隔了比较久，是发生在这个双K线反转处，趋势阳线向上吞没阴线。再来高三发生以前，价格探的稍微低一点，位置是在这里。高四则稍微高一点，在这根趋势阳线上破前一根小阴线的时候。如果你愿意继续走下去，高五实际上发生在这里。高六则比较不明确，是在最后一根阳线造成高点抬升的地方。但总之，只要掌握重新抬高时才数的原则，那么你就通通都能够将它们给找出来。同样以为推动计数的角度来剖析这轮回调演变为区间的过程，你不难发现。区间的前半部实际上是一个三推的楔形底。那与方才的双重底牛旗同理如果说高二是双重底，那么高三就等同于楔形底。你能够找到三次向下的推动，而也三次都被多头否决反超。那高四是怎么一回事呢？看起来更像是楔形趋势线被上破以后，恢复顺势运动以前的突破回调。而确实，这里也完成了AB=CD的等距运动。只可惜价格才刚次破原趋势极值就失去动力，反转向下。刚刚的楔形底牛旗成为了末端旗型而回调启动之后的K线数量，也因为超过20根还未恢复趋势，而成为了一个区间。通常，阿尔布鲁克斯总结的经验是，当上升趋势的回调出现，高四以后仍然还未恢复。那么就会常常已经超过20根K线转入区间。变成区间，也意味着现在多空势均力敌，多头仍然掌控趋势，主导权的几率下降到趋近于50%。因此，如果高二后趋势还未恢复，高三也失败，那交易者就要预期接下来陷入纠结的可能性大得多。所以数到高四就差不多了。高五六七就不用费心关注。届时，大概已经不是定义所限定的，看涨的环境了。","p":"p451"},{"t":"这一次我们来试试数低一二三四，再换另一个例子来看看。左边看似比较混乱一点，对吧？但其实也没有那么难拆解，只不过是在开盘之际就有些区间性格比较强烈的运动。比较大的十字星急涨急跌，让人有点眼花缭乱而已。但即使如此，把握先前教过的原则，看看阴阳交错之处，看看下跌过程中回调K线出现。造成K线高点抬升的时机等等，应该还是能够辨识出来，大概是这样的三推运动。到了底部开始有比较流畅的反转。一路又再次挺进到当前高点，陷入调整。此时，我们迎着前方具有大量重叠，相互吞没的K线，应该能够意识到这是个多空都很躁进的交易日。而到了刚刚多头在第四根阳线时，未能越过甚至未能触及的前部断点，多头动能就又旋即失去跟进。那么就暗示了此处可能有大量的反向订单在作用，或许造就一个宽幅的区间交易日。后续价格虽然没有立即下跌，但是接续收了一些小K线，都不像是多头展现动能的表现。甚至又对这根看似高潮的阳线进行突破后，失败转成阴线，还有跟进。那这就不是一个很乐观的样子了。在这里，我们想起数低一二三四应该能够在看跌的环境，也就是在熊旗中或者背靠着区间上缘来数。那在这里，似乎正是时候。又该交给你了，低一二三分别发生在哪里呢？请将它们找出来。有了数高的经验，现在你应该已经相当熟悉做法了。差别只在于我们要关注的是低点而非高点。K线低点首次降低时低一确立。然后抬升，抬升又抬升，再次降低时，我们就找到低二。后续同样又是K线低点抬升，直到出现反转，收出阴线也顺道完成空头的突破，创出低三。所以此我们也能够意识到，这里出现的实际上是一个小型的楔形顶。内部三次空头突破否决了三次，多头向上递进的尝试。这件事多空都不认为价格应该继续上行，于是价格反转下跌又往区间交易日的中轴去探。急速下坠之后，在图表正中间，也就是这个区间交易日的可能，中轴附近价格又陷入震荡。由于前头的下跌走的很急，我们或将有理由认为此处的回调可能是趋势中的中继。往后还未下破，继续往当日低点探去。而当这里形成一个微型双重顶，证明多头无法向上进发。旋即就出现一根跳空低开的阴线，造成猛烈的下跌。既然这是双重顶，那也就代表这是一个二推回调。这里存在低二。在下降运动中的熊旗，你数低一也是合宜的做法。节省大家时间，我就直接剧透后续的事情了。这推运动如此强劲，仍然有第二推陷阱的意味。随即，触及区间下缘后反转，又走高。接着进入三推的楔形底，牛旗回调，创出高一，高二，高三后，再次突破上涨。回顾所有的内容，除了区间上下缘，等距运动目标，50%回调屡屡发挥作用以外。波段也大多是在不难辨识的二或三推之后陷入回调，乃至于反转高/低二三也总是很有用处。如果对以上标示出的价格动态反弹理由，你都能够在不依赖我指示的情况下自己辨识出来。那么，应该大部分的图表你都能够凭自己的力量进行细致的拆解了。","p":"p452"}]},{"t":"para","text":"这一次我们来试试数低一二三四，再换另一个例子来看看。左边看似比较混乱一点，对吧？但其实也没有那么难拆解，只不过是在开盘之际就有些区间性格比较强烈的运动。比较大的十字星急涨急跌，让人有点眼花缭乱而已。但即使如此，把握先前教过的原则，看看阴阳交错之处，看看下跌过程中回调K线出现。造成K线高点抬升的时机等等，应该还是能够辨识出来，大概是这样的三推运动。到了底部开始有比较流畅的反转。一路又再次挺进到当前高点，陷入调整。此时，我们迎着前方具有大量重叠，相互吞没的K线，应该能够意识到这是个多空都很躁进的交易日。而到了刚刚多头在第四根阳线时，未能越过甚至未能触及的前部断点，多头动能就又旋即失去跟进。那么就暗示了此处可能有大量的反向订单在作用，或许造就一个宽幅的区间交易日。后续价格虽然没有立即下跌，但是接续收了一些小K线，都不像是多头展现动能的表现。甚至又对这根看似高潮的阳线进行突破后，失败转成阴线，还有跟进。那这就不是一个很乐观的样子了。在这里，我们想起数低一二三四应该能够在看跌的环境，也就是在熊旗中或者背靠着区间上缘来数。那在这里，似乎正是时候。又该交给你了，低一二三分别发生在哪里呢？请将它们找出来。有了数高的经验，现在你应该已经相当熟悉做法了。差别只在于我们要关注的是低点而非高点。K线低点首次降低时低一确立。然后抬升，抬升又抬升，再次降低时，我们就找到低二。后续同样又是K线低点抬升，直到出现反转，收出阴线也顺道完成空头的突破，创出低三。所以此我们也能够意识到，这里出现的实际上是一个小型的楔形顶。内部三次空头突破否决了三次，多头向上递进的尝试。这件事多空都不认为价格应该继续上行，于是价格反转下跌又往区间交易日的中轴去探。急速下坠之后，在图表正中间，也就是这个区间交易日的可能，中轴附近价格又陷入震荡。由于前头的下跌走的很急，我们或将有理由认为此处的回调可能是趋势中的中继。往后还未下破，继续往当日低点探去。而当这里形成一个微型双重顶，证明多头无法向上进发。旋即就出现一根跳空低开的阴线，造成猛烈的下跌。既然这是双重顶，那也就代表这是一个二推回调。这里存在低二。在下降运动中的熊旗，你数低一也是合宜的做法。节省大家时间，我就直接剧透后续的事情了。这推运动如此强劲，仍然有第二推陷阱的意味。随即，触及区间下缘后反转，又走高。接着进入三推的楔形底，牛旗回调，创出高一，高二，高三后，再次突破上涨。回顾所有的内容，除了区间上下缘，等距运动目标，50%回调屡屡发挥作用以外。波段也大多是在不难辨识的二或三推之后陷入回调，乃至于反转高/低二三也总是很有用处。如果对以上标示出的价格动态反弹理由，你都能够在不依赖我指示的情况下自己辨识出来。那么，应该大部分的图表你都能够凭自己的力量进行细致的拆解了。","pid":"p452"},{"t":"img","src":"assets/img/l11B_186.webp","ilabel":"11-21","icap":"L11　为推动计数与数K线方法","fid":"fig186","ctx":[{"t":"这一次我们来试试数低一二三四，再换另一个例子来看看。左边看似比较混乱一点，对吧？但其实也没有那么难拆解，只不过是在开盘之际就有些区间性格比较强烈的运动。比较大的十字星急涨急跌，让人有点眼花缭乱而已。但即使如此，把握先前教过的原则，看看阴阳交错之处，看看下跌过程中回调K线出现。造成K线高点抬升的时机等等，应该还是能够辨识出来，大概是这样的三推运动。到了底部开始有比较流畅的反转。一路又再次挺进到当前高点，陷入调整。此时，我们迎着前方具有大量重叠，相互吞没的K线，应该能够意识到这是个多空都很躁进的交易日。而到了刚刚多头在第四根阳线时，未能越过甚至未能触及的前部断点，多头动能就又旋即失去跟进。那么就暗示了此处可能有大量的反向订单在作用，或许造就一个宽幅的区间交易日。后续价格虽然没有立即下跌，但是接续收了一些小K线，都不像是多头展现动能的表现。甚至又对这根看似高潮的阳线进行突破后，失败转成阴线，还有跟进。那这就不是一个很乐观的样子了。在这里，我们想起数低一二三四应该能够在看跌的环境，也就是在熊旗中或者背靠着区间上缘来数。那在这里，似乎正是时候。又该交给你了，低一二三分别发生在哪里呢？请将它们找出来。有了数高的经验，现在你应该已经相当熟悉做法了。差别只在于我们要关注的是低点而非高点。K线低点首次降低时低一确立。然后抬升，抬升又抬升，再次降低时，我们就找到低二。后续同样又是K线低点抬升，直到出现反转，收出阴线也顺道完成空头的突破，创出低三。所以此我们也能够意识到，这里出现的实际上是一个小型的楔形顶。内部三次空头突破否决了三次，多头向上递进的尝试。这件事多空都不认为价格应该继续上行，于是价格反转下跌又往区间交易日的中轴去探。急速下坠之后，在图表正中间，也就是这个区间交易日的可能，中轴附近价格又陷入震荡。由于前头的下跌走的很急，我们或将有理由认为此处的回调可能是趋势中的中继。往后还未下破，继续往当日低点探去。而当这里形成一个微型双重顶，证明多头无法向上进发。旋即就出现一根跳空低开的阴线，造成猛烈的下跌。既然这是双重顶，那也就代表这是一个二推回调。这里存在低二。在下降运动中的熊旗，你数低一也是合宜的做法。节省大家时间，我就直接剧透后续的事情了。这推运动如此强劲，仍然有第二推陷阱的意味。随即，触及区间下缘后反转，又走高。接着进入三推的楔形底，牛旗回调，创出高一，高二，高三后，再次突破上涨。回顾所有的内容，除了区间上下缘，等距运动目标，50%回调屡屡发挥作用以外。波段也大多是在不难辨识的二或三推之后陷入回调，乃至于反转高/低二三也总是很有用处。如果对以上标示出的价格动态反弹理由，你都能够在不依赖我指示的情况下自己辨识出来。那么，应该大部分的图表你都能够凭自己的力量进行细致的拆解了。","p":"p452"},{"t":"综合以上，我们应该可以做一个总整理，确保你没有漏掉任何内容。","p":"p453"}]},{"t":"para","text":"综合以上，我们应该可以做一个总整理，确保你没有漏掉任何内容。","pid":"p453"},{"t":"img","src":"assets/img/l11B_187.webp","ilabel":"11-22","icap":"L11　为推动计数与数K线方法","fid":"fig187","ctx":[{"t":"综合以上，我们应该可以做一个总整理，确保你没有漏掉任何内容。","p":"p453"},{"t":"经过两个节次的讲解，已经学会为推动技术，也学会数K线方法。前者的原则包括阴阳交替，寻找回调K线的断点，连接显著的高低点以及注意匹配程度。后者则是在看涨的环境，比如牛旗，比如区间底部数高，在看跌的环境。也就是熊旗区间顶部数低。数高时请注意高点重新抬高之时，连续抬高不予计算。数低亦然，只要注意低点，重新降低的时候连续降低，不用计算。而当你数高一二三四低点是升是降都不重要，注意高点即可，反之亦然。这两者虽然在规模上有大小之分。但原理本质和功用都相同，都是在计算多空相互否决的次数。如果价格连续朝同个方向突破失败，那么反转的几率就会提高，这是逆势压力积累之后所将起到的效果。于是你应该不难理解，位于二推的双重顶底对应的则是更大时间级别的低二与高二。三推的楔形顶底则对应更大时间级别的低三与高三。而一旦累积到高低四，则代表多空已经相互否决第四次。这基本上是双边交易性格非常显著的走势。应当在更小时间级别图表上对应为区间。对于任何段落，如果你看上去觉得不是很好，分段。那么，也许切换到更少时间级别图表上看一下，有了更多K线作为线索之后，你就会更容易看见内含的推动次数。一开始总是会不太容易，多少有一点主观成分养赖经验积累。因此，你最需要做的事情就是多练习，将阅读量累积起来。那么，假以时日数推数K线就是呼吸般自然的事情了？这么一来，我们也就把磁体之外的另一项关键读图技术也给学会了。在近期的事例中，你应该不难发现，我们总是会用上前头提过的所有其他概念，使用教过的所有工具。力求将一张图表所要透露给我们的资讯都读明白。也正是在这个时候，我要提醒你再做一次复习，翻看你目前写下的笔记。因为到了下一个板块，我们就要进入具体交易方法的讨论，肯定会需要你将目前所学给融会贯通，一并用上。那么，如果你已经准备好，那我要顺道恭喜你，现在对于价格行为方法，你应该有原理层次与工具层次的深刻掌握了。很快，我们就要开始盈利。请期待往后教授给你的交易方法。感谢收看为推动计数与数K线方法，我们下个单元见。","p":"p454"}]},{"t":"para","text":"经过两个节次的讲解，已经学会为推动技术，也学会数K线方法。前者的原则包括阴阳交替，寻找回调K线的断点，连接显著的高低点以及注意匹配程度。后者则是在看涨的环境，比如牛旗，比如区间底部数高，在看跌的环境。也就是熊旗区间顶部数低。数高时请注意高点重新抬高之时，连续抬高不予计算。数低亦然，只要注意低点，重新降低的时候连续降低，不用计算。而当你数高一二三四低点是升是降都不重要，注意高点即可，反之亦然。这两者虽然在规模上有大小之分。但原理本质和功用都相同，都是在计算多空相互否决的次数。如果价格连续朝同个方向突破失败，那么反转的几率就会提高，这是逆势压力积累之后所将起到的效果。于是你应该不难理解，位于二推的双重顶底对应的则是更大时间级别的低二与高二。三推的楔形顶底则对应更大时间级别的低三与高三。而一旦累积到高低四，则代表多空已经相互否决第四次。这基本上是双边交易性格非常显著的走势。应当在更小时间级别图表上对应为区间。对于任何段落，如果你看上去觉得不是很好，分段。那么，也许切换到更少时间级别图表上看一下，有了更多K线作为线索之后，你就会更容易看见内含的推动次数。一开始总是会不太容易，多少有一点主观成分养赖经验积累。因此，你最需要做的事情就是多练习，将阅读量累积起来。那么，假以时日数推数K线就是呼吸般自然的事情了？这么一来，我们也就把磁体之外的另一项关键读图技术也给学会了。在近期的事例中，你应该不难发现，我们总是会用上前头提过的所有其他概念，使用教过的所有工具。力求将一张图表所要透露给我们的资讯都读明白。也正是在这个时候，我要提醒你再做一次复习，翻看你目前写下的笔记。因为到了下一个板块，我们就要进入具体交易方法的讨论，肯定会需要你将目前所学给融会贯通，一并用上。那么，如果你已经准备好，那我要顺道恭喜你，现在对于价格行为方法，你应该有原理层次与工具层次的深刻掌握了。很快，我们就要开始盈利。请期待往后教授给你的交易方法。感谢收看为推动计数与数K线方法，我们下个单元见。","pid":"p454"}],"wcount":7842}],"wcount":14270},{"id":"l12","icon":"L12","title":"L12　交易风格波段与剥头皮交易的选择","blocks":[{"t":"para","text":"L12 交易风格波段与剥头皮交易的选择","pid":"p455"},{"t":"para","text":"学习交易最令人雀跃难耐的，应该就是真正和对手短兵相接的部分。经过絮絮叨叨，稳扎稳打的认知原理和工具教学，我们终于开始讨论如何建仓，如何获利。","pid":"p456"},{"t":"img","src":"assets/img/l12x_188.webp","ilabel":"12-1","icap":"L12　交易风格波段与剥头皮交易的选择","fid":"fig188","ctx":[{"t":"L12 交易风格波段与剥头皮交易的选择","p":"p455"},{"t":"学习交易最令人雀跃难耐的，应该就是真正和对手短兵相接的部分。经过絮絮叨叨，稳扎稳打的认知原理和工具教学，我们终于开始讨论如何建仓，如何获利。","p":"p456"},{"t":"不过，在真正下单之前，我们还是要对各种建仓方案有个总体的分类框架。同样用来战斗，你用的是钝器还是锐器呢？是近战还是远程呢？要追求快而密集的伤害，还是等待时机一出手就毙命呢？个人肯定有不同的偏好。所以踏入市场前，我们必须先谈谈交易风格。引导你思考如何选择合适自己的定位。这个单元我们要讨论的议题，包括何为波段，何为剥头皮交易。那么，各自的优势和难处在哪里？若生疏的混用错配，会导致什么危险？以及我该如何做出最适合自己的选择。经过对以上问题的充分思考，你才能够保持正确的战斗姿势。争取到你所想，要争取到你所该争取到的那段利润。","p":"p457"}]},{"t":"para","text":"不过，在真正下单之前，我们还是要对各种建仓方案有个总体的分类框架。同样用来战斗，你用的是钝器还是锐器呢？是近战还是远程呢？要追求快而密集的伤害，还是等待时机一出手就毙命呢？个人肯定有不同的偏好。所以踏入市场前，我们必须先谈谈交易风格。引导你思考如何选择合适自己的定位。这个单元我们要讨论的议题，包括何为波段，何为剥头皮交易。那么，各自的优势和难处在哪里？若生疏的混用错配，会导致什么危险？以及我该如何做出最适合自己的选择。经过对以上问题的充分思考，你才能够保持正确的战斗姿势。争取到你所想，要争取到你所该争取到的那段利润。","pid":"p457"},{"t":"img","src":"assets/img/l12x_189.webp","ilabel":"12-2","icap":"L12　交易风格波段与剥头皮交易的选择","fid":"fig189","ctx":[{"t":"不过，在真正下单之前，我们还是要对各种建仓方案有个总体的分类框架。同样用来战斗，你用的是钝器还是锐器呢？是近战还是远程呢？要追求快而密集的伤害，还是等待时机一出手就毙命呢？个人肯定有不同的偏好。所以踏入市场前，我们必须先谈谈交易风格。引导你思考如何选择合适自己的定位。这个单元我们要讨论的议题，包括何为波段，何为剥头皮交易。那么，各自的优势和难处在哪里？若生疏的混用错配，会导致什么危险？以及我该如何做出最适合自己的选择。经过对以上问题的充分思考，你才能够保持正确的战斗姿势。争取到你所想，要争取到你所该争取到的那段利润。","p":"p457"},{"t":"作为开头，我想请大家重新思考过的议题是，为什么高胜率又高盈亏比的交易机会基本并不存在。对第一个单元有过深刻认知的，你应该很直觉可以回答出来。因为市场中充满精明的机构。如果你能够真正掌握一个高胜率又高盈亏比的缝隙。那代表与你成交的对手机构做了一个低胜率又低盈亏比的决定。这显然不符现实。也就是如果你预期数倍于风险的利润。那这代表相应的胜率会变得很低。只有当你愿意舍弃划算执行一个甚至盈亏比不到一倍的交易，才可能让胜率变得比较高。市场是公平的，有一好就没有两好，而你必须做出选择。此间值得细说的是，市场运作的时态常常是低胜率，高盈亏比的交易者与高胜率，低盈亏比的交易者。两者互为对手方。我们可以通过思考实验来理解，这为什么成立？比如你在区间的底部选择，以高一作为讯号来预期，一个区间突破失败。两点换两点的等距利润盈亏比一点零倍。这是符合原理，符合区间特性的做法，理应有利可图。那么是谁在跟你成交呢？如果你能够因此赚钱，那对手难道是脑袋不清楚的弱势交易者吗？肯定不是，它是机构。机构也认为他做的事情有利可图。所以事情可能是这样的。它在你做多的时候，同时做空。其承受的风险也是两个点。你止盈，他就止损。不过，他预期的回报远高于风险。所以当你低几率被止损的时候，它还要更多，它预期价格还能够再走两个点。这也合理，对吧？毕竟区间倾向突破失败。但总有意外行情。也就是当区间向外突破成功了，就会开启长远的运行。那这种就是它能够获利，而你被止损离场的情况。你发现了吗？此间你做的是一个高胜率，低盈亏比的选择，期望值能够为正。而与你成交对手方则承担胜率的劣势，但当低几率事件发生时，即突破，它具有大额利润可图，期望同样为证。甚至对手机构做法还可以更花俏一点。比如，当发现走势不如预期时，透过逆风分批建仓的方法来扩大胜率。用充分的资金顶着第一仓的浮亏压力，之后再分批多下两仓。这么一来，一旦区间继续维持双边交易。价格终究又复返下跌。那么，他的第一仓便可以打平离场，而在后面新建的两个仓位赚取利润。所以你看，无论你如何入场，而且是如例分析，有利可图的入场。对手也总有好的交易顶层设计，持仓管理和资金管理方法来确保自己能够获得正向期望。也正是因为这样，我们说当你选择做一笔高胜率低盈亏比的策略，往往对手方则是一个执行低胜率，高盈亏比策略的机构。所有交易必然是公平的。各自承担了相应的风险，享受对于风险的补偿。如果选择，则端看你愿意承受的风险是哪一种？是一直输，让你比较痛苦。还是一次性输很多，让你比较痛苦。以上问题是值得交易者们细细思考的。对于任何一笔交易，你总会选择站在其中的一边。那么，为了更注意你做出正确的选择。我们要接着细谈这两种类型交易者的本质，并且给予概念化利弊并存。在指称上面，我们可以先简单的称其为波段交易者和剥头皮交易者。这分别是什么意思呢？","p":"p458"}]},{"t":"para","text":"作为开头，我想请大家重新思考过的议题是，为什么高胜率又高盈亏比的交易机会基本并不存在。对第一个单元有过深刻认知的，你应该很直觉可以回答出来。因为市场中充满精明的机构。如果你能够真正掌握一个高胜率又高盈亏比的缝隙。那代表与你成交的对手机构做了一个低胜率又低盈亏比的决定。这显然不符现实。也就是如果你预期数倍于风险的利润。那这代表相应的胜率会变得很低。只有当你愿意舍弃划算执行一个甚至盈亏比不到一倍的交易，才可能让胜率变得比较高。市场是公平的，有一好就没有两好，而你必须做出选择。此间值得细说的是，市场运作的时态常常是低胜率，高盈亏比的交易者与高胜率，低盈亏比的交易者。两者互为对手方。我们可以通过思考实验来理解，这为什么成立？比如你在区间的底部选择，以高一作为讯号来预期，一个区间突破失败。两点换两点的等距利润盈亏比一点零倍。这是符合原理，符合区间特性的做法，理应有利可图。那么是谁在跟你成交呢？如果你能够因此赚钱，那对手难道是脑袋不清楚的弱势交易者吗？肯定不是，它是机构。机构也认为他做的事情有利可图。所以事情可能是这样的。它在你做多的时候，同时做空。其承受的风险也是两个点。你止盈，他就止损。不过，他预期的回报远高于风险。所以当你低几率被止损的时候，它还要更多，它预期价格还能够再走两个点。这也合理，对吧？毕竟区间倾向突破失败。但总有意外行情。也就是当区间向外突破成功了，就会开启长远的运行。那这种就是它能够获利，而你被止损离场的情况。你发现了吗？此间你做的是一个高胜率，低盈亏比的选择，期望值能够为正。而与你成交对手方则承担胜率的劣势，但当低几率事件发生时，即突破，它具有大额利润可图，期望同样为证。甚至对手机构做法还可以更花俏一点。比如，当发现走势不如预期时，透过逆风分批建仓的方法来扩大胜率。用充分的资金顶着第一仓的浮亏压力，之后再分批多下两仓。这么一来，一旦区间继续维持双边交易。价格终究又复返下跌。那么，他的第一仓便可以打平离场，而在后面新建的两个仓位赚取利润。所以你看，无论你如何入场，而且是如例分析，有利可图的入场。对手也总有好的交易顶层设计，持仓管理和资金管理方法来确保自己能够获得正向期望。也正是因为这样，我们说当你选择做一笔高胜率低盈亏比的策略，往往对手方则是一个执行低胜率，高盈亏比策略的机构。所有交易必然是公平的。各自承担了相应的风险，享受对于风险的补偿。如果选择，则端看你愿意承受的风险是哪一种？是一直输，让你比较痛苦。还是一次性输很多，让你比较痛苦。以上问题是值得交易者们细细思考的。对于任何一笔交易，你总会选择站在其中的一边。那么，为了更注意你做出正确的选择。我们要接着细谈这两种类型交易者的本质，并且给予概念化利弊并存。在指称上面，我们可以先简单的称其为波段交易者和剥头皮交易者。这分别是什么意思呢？","pid":"p458"},{"t":"img","src":"assets/img/l12x_190.webp","ilabel":"12-3","icap":"L12　交易风格波段与剥头皮交易的选择","fid":"fig190","ctx":[{"t":"作为开头，我想请大家重新思考过的议题是，为什么高胜率又高盈亏比的交易机会基本并不存在。对第一个单元有过深刻认知的，你应该很直觉可以回答出来。因为市场中充满精明的机构。如果你能够真正掌握一个高胜率又高盈亏比的缝隙。那代表与你成交的对手机构做了一个低胜率又低盈亏比的决定。这显然不符现实。也就是如果你预期数倍于风险的利润。那这代表相应的胜率会变得很低。只有当你愿意舍弃划算执行一个甚至盈亏比不到一倍的交易，才可能让胜率变得比较高。市场是公平的，有一好就没有两好，而你必须做出选择。此间值得细说的是，市场运作的时态常常是低胜率，高盈亏比的交易者与高胜率，低盈亏比的交易者。两者互为对手方。我们可以通过思考实验来理解，这为什么成立？比如你在区间的底部选择，以高一作为讯号来预期，一个区间突破失败。两点换两点的等距利润盈亏比一点零倍。这是符合原理，符合区间特性的做法，理应有利可图。那么是谁在跟你成交呢？如果你能够因此赚钱，那对手难道是脑袋不清楚的弱势交易者吗？肯定不是，它是机构。机构也认为他做的事情有利可图。所以事情可能是这样的。它在你做多的时候，同时做空。其承受的风险也是两个点。你止盈，他就止损。不过，他预期的回报远高于风险。所以当你低几率被止损的时候，它还要更多，它预期价格还能够再走两个点。这也合理，对吧？毕竟区间倾向突破失败。但总有意外行情。也就是当区间向外突破成功了，就会开启长远的运行。那这种就是它能够获利，而你被止损离场的情况。你发现了吗？此间你做的是一个高胜率，低盈亏比的选择，期望值能够为正。而与你成交对手方则承担胜率的劣势，但当低几率事件发生时，即突破，它具有大额利润可图，期望同样为证。甚至对手机构做法还可以更花俏一点。比如，当发现走势不如预期时，透过逆风分批建仓的方法来扩大胜率。用充分的资金顶着第一仓的浮亏压力，之后再分批多下两仓。这么一来，一旦区间继续维持双边交易。价格终究又复返下跌。那么，他的第一仓便可以打平离场，而在后面新建的两个仓位赚取利润。所以你看，无论你如何入场，而且是如例分析，有利可图的入场。对手也总有好的交易顶层设计，持仓管理和资金管理方法来确保自己能够获得正向期望。也正是因为这样，我们说当你选择做一笔高胜率低盈亏比的策略，往往对手方则是一个执行低胜率，高盈亏比策略的机构。所有交易必然是公平的。各自承担了相应的风险，享受对于风险的补偿。如果选择，则端看你愿意承受的风险是哪一种？是一直输，让你比较痛苦。还是一次性输很多，让你比较痛苦。以上问题是值得交易者们细细思考的。对于任何一笔交易，你总会选择站在其中的一边。那么，为了更注意你做出正确的选择。我们要接着细谈这两种类型交易者的本质，并且给予概念化利弊并存。在指称上面，我们可以先简单的称其为波段交易者和剥头皮交易者。这分别是什么意思呢？","p":"p458"},{"t":"当我们说你执行了一笔波段交易，意思就是你争取的是倍数与风险的利润。而愿意承担较低的胜率。如果要给予数字来协助理解，那就是追求二点零倍以上盈亏比付出胜率仅有40%或更低的代价。而相对的剥头皮交易则是利润和风险相当甚至低于风险，仅追求一点零倍或以下的盈亏比换取高于60%的胜率。同样，以前头提到的区间突破失败为例。两点换两点的行为是剥头皮交易。他们占着是区间下缘，难以被穿透，价格倾向受到中轴磁力吸引而往回折返的优势。来快进快出预期高胜率。那对手方则理应是波段交易者。他们明知这里不利于下破。但少数意外能使其盈利。所以他们甘心频繁止损，也要等待出脱的时候。我们记第一单元讲过1.0,60%，2.0，40%，这两组数据。请你再次唤醒记忆。这可以协助你快速辨认一笔交易应该归类于何者。也可以提醒你不要有太夸张的数学优势预期。那么，除了提及这些数字，我们还可以来做一些更直性的描写。协助你揣摩这样一种行动者的心境，以及问问自己可能更像哪一种。刻在希腊德尔菲的阿波罗神庙，最有名的一句真言就是认识你自己。对交易者来说，这种呼吁应该是很具启发性的。知己很多时候跟知彼一样重要。为了确保交易事业长久且稳健的发展与成长。这个单元的任务就是陪同你认识自己做出风格的定位和选择。","p":"p459"}]},{"t":"para","text":"当我们说你执行了一笔波段交易，意思就是你争取的是倍数与风险的利润。而愿意承担较低的胜率。如果要给予数字来协助理解，那就是追求二点零倍以上盈亏比付出胜率仅有40%或更低的代价。而相对的剥头皮交易则是利润和风险相当甚至低于风险，仅追求一点零倍或以下的盈亏比换取高于60%的胜率。同样，以前头提到的区间突破失败为例。两点换两点的行为是剥头皮交易。他们占着是区间下缘，难以被穿透，价格倾向受到中轴磁力吸引而往回折返的优势。来快进快出预期高胜率。那对手方则理应是波段交易者。他们明知这里不利于下破。但少数意外能使其盈利。所以他们甘心频繁止损，也要等待出脱的时候。我们记第一单元讲过1.0,60%，2.0，40%，这两组数据。请你再次唤醒记忆。这可以协助你快速辨认一笔交易应该归类于何者。也可以提醒你不要有太夸张的数学优势预期。那么，除了提及这些数字，我们还可以来做一些更直性的描写。协助你揣摩这样一种行动者的心境，以及问问自己可能更像哪一种。刻在希腊德尔菲的阿波罗神庙，最有名的一句真言就是认识你自己。对交易者来说，这种呼吁应该是很具启发性的。知己很多时候跟知彼一样重要。为了确保交易事业长久且稳健的发展与成长。这个单元的任务就是陪同你认识自己做出风格的定位和选择。","pid":"p459"},{"t":"img","src":"assets/img/l12x_191.webp","ilabel":"12-4","icap":"L12　交易风格波段与剥头皮交易的选择","fid":"fig191","ctx":[{"t":"当我们说你执行了一笔波段交易，意思就是你争取的是倍数与风险的利润。而愿意承担较低的胜率。如果要给予数字来协助理解，那就是追求二点零倍以上盈亏比付出胜率仅有40%或更低的代价。而相对的剥头皮交易则是利润和风险相当甚至低于风险，仅追求一点零倍或以下的盈亏比换取高于60%的胜率。同样，以前头提到的区间突破失败为例。两点换两点的行为是剥头皮交易。他们占着是区间下缘，难以被穿透，价格倾向受到中轴磁力吸引而往回折返的优势。来快进快出预期高胜率。那对手方则理应是波段交易者。他们明知这里不利于下破。但少数意外能使其盈利。所以他们甘心频繁止损，也要等待出脱的时候。我们记第一单元讲过1.0,60%，2.0，40%，这两组数据。请你再次唤醒记忆。这可以协助你快速辨认一笔交易应该归类于何者。也可以提醒你不要有太夸张的数学优势预期。那么，除了提及这些数字，我们还可以来做一些更直性的描写。协助你揣摩这样一种行动者的心境，以及问问自己可能更像哪一种。刻在希腊德尔菲的阿波罗神庙，最有名的一句真言就是认识你自己。对交易者来说，这种呼吁应该是很具启发性的。知己很多时候跟知彼一样重要。为了确保交易事业长久且稳健的发展与成长。这个单元的任务就是陪同你认识自己做出风格的定位和选择。","p":"p459"},{"t":"我们可以说波段交易者真正重视的是盈亏比而非胜率，这是他们的核心意念。所以既然利润暴击是他们的主要追求。那除了就结局而言，他们并不介意常常止损以外。在结局发生以前的持仓过程中，他们也更愿意忍受持续的浮亏。所以当在一轮上升趋势中，他们时常选择当价值交易者，想以更划算的价格建仓。比如买在这里止损，放在触及磁体的讯号K线之外。入场后先浮亏，也可以接受。要花很长时间，可能十，二十，三十根K线才走到利润目标也可以接受。止损多次，想着一次就能够赚尽大笔利润，那被扫出去了也不伤心。我就是要利润挤压代价，可以接受。那显然，如果你看着我的演示和描述，你设想这么做，应该会是舒服的，那你很可能适合做波段。可能适合当价值交易者。如此入场，即使只拿到原趋势极值，都可以说是以薄损换到较宽的利润。而不过要是你看起来觉得提心吊胆。止损这么浅，那不是很容易就被触发离场吗？这样想的朋友，接下来的剥头皮交易可能会更适合你。","p":"p460"}]},{"t":"para","text":"我们可以说波段交易者真正重视的是盈亏比而非胜率，这是他们的核心意念。所以既然利润暴击是他们的主要追求。那除了就结局而言，他们并不介意常常止损以外。在结局发生以前的持仓过程中，他们也更愿意忍受持续的浮亏。所以当在一轮上升趋势中，他们时常选择当价值交易者，想以更划算的价格建仓。比如买在这里止损，放在触及磁体的讯号K线之外。入场后先浮亏，也可以接受。要花很长时间，可能十，二十，三十根K线才走到利润目标也可以接受。止损多次，想着一次就能够赚尽大笔利润，那被扫出去了也不伤心。我就是要利润挤压代价，可以接受。那显然，如果你看着我的演示和描述，你设想这么做，应该会是舒服的，那你很可能适合做波段。可能适合当价值交易者。如此入场，即使只拿到原趋势极值，都可以说是以薄损换到较宽的利润。而不过要是你看起来觉得提心吊胆。止损这么浅，那不是很容易就被触发离场吗？这样想的朋友，接下来的剥头皮交易可能会更适合你。","pid":"p460"},{"t":"img","src":"assets/img/l12x_192.webp","ilabel":"12-5","icap":"L12　交易风格波段与剥头皮交易的选择","fid":"fig192","ctx":[{"t":"我们可以说波段交易者真正重视的是盈亏比而非胜率，这是他们的核心意念。所以既然利润暴击是他们的主要追求。那除了就结局而言，他们并不介意常常止损以外。在结局发生以前的持仓过程中，他们也更愿意忍受持续的浮亏。所以当在一轮上升趋势中，他们时常选择当价值交易者，想以更划算的价格建仓。比如买在这里止损，放在触及磁体的讯号K线之外。入场后先浮亏，也可以接受。要花很长时间，可能十，二十，三十根K线才走到利润目标也可以接受。止损多次，想着一次就能够赚尽大笔利润，那被扫出去了也不伤心。我就是要利润挤压代价，可以接受。那显然，如果你看着我的演示和描述，你设想这么做，应该会是舒服的，那你很可能适合做波段。可能适合当价值交易者。如此入场，即使只拿到原趋势极值，都可以说是以薄损换到较宽的利润。而不过要是你看起来觉得提心吊胆。止损这么浅，那不是很容易就被触发离场吗？这样想的朋友，接下来的剥头皮交易可能会更适合你。","p":"p460"},{"t":"剥头皮交易则是追求胜率而非盈亏比。而既然他们所追求的盈亏比很低，不喜欢忍受回调。但通常在出现回调以前，他们就已经止盈离场。持仓通常仅一到五根K线。相对于波段交易者的价值取向。这更像是动能取向的选择。只要有动能，我就敢追。还能走一点，我就愿意入场。不过我不贪多。有了确定的利润，就先走为妙。我并不愿意看见回调导致的浮亏。于是这种只赚一点就离开了，作为在波段交易者眼里看来，可能也浑身难受。毕竟剥头皮专家是真的不介意平仓之后，看着价格不断朝原本的预期方向继续运动。不介意俗称的踏空。但看到长远的利润失之交臂。却恰恰是最令波段交易者痛苦的。所以这么说来，你是否更能够体会这两种风格的差异了呢？一个不介意止损，另一个却恰巧痛恨输钱。一个不介意踏空，另一个却真心痛恨利润从眼前溜走。你可以扪心自问哪个是你更难受的，哪个是你更想追求的。就会大致映照出你的个性以及倾向，做哪一类型的交易？我也趁机，重申武断，但明晰的二选一选项方便你参考。","p":"p461"}]},{"t":"para","text":"剥头皮交易则是追求胜率而非盈亏比。而既然他们所追求的盈亏比很低，不喜欢忍受回调。但通常在出现回调以前，他们就已经止盈离场。持仓通常仅一到五根K线。相对于波段交易者的价值取向。这更像是动能取向的选择。只要有动能，我就敢追。还能走一点，我就愿意入场。不过我不贪多。有了确定的利润，就先走为妙。我并不愿意看见回调导致的浮亏。于是这种只赚一点就离开了，作为在波段交易者眼里看来，可能也浑身难受。毕竟剥头皮专家是真的不介意平仓之后，看着价格不断朝原本的预期方向继续运动。不介意俗称的踏空。但看到长远的利润失之交臂。却恰恰是最令波段交易者痛苦的。所以这么说来，你是否更能够体会这两种风格的差异了呢？一个不介意止损，另一个却恰巧痛恨输钱。一个不介意踏空，另一个却真心痛恨利润从眼前溜走。你可以扪心自问哪个是你更难受的，哪个是你更想追求的。就会大致映照出你的个性以及倾向，做哪一类型的交易？我也趁机，重申武断，但明晰的二选一选项方便你参考。","pid":"p461"},{"t":"img","src":"assets/img/l12x_193.webp","ilabel":"12-6","icap":"L12　交易风格波段与剥头皮交易的选择","fid":"fig193","ctx":[{"t":"剥头皮交易则是追求胜率而非盈亏比。而既然他们所追求的盈亏比很低，不喜欢忍受回调。但通常在出现回调以前，他们就已经止盈离场。持仓通常仅一到五根K线。相对于波段交易者的价值取向。这更像是动能取向的选择。只要有动能，我就敢追。还能走一点，我就愿意入场。不过我不贪多。有了确定的利润，就先走为妙。我并不愿意看见回调导致的浮亏。于是这种只赚一点就离开了，作为在波段交易者眼里看来，可能也浑身难受。毕竟剥头皮专家是真的不介意平仓之后，看着价格不断朝原本的预期方向继续运动。不介意俗称的踏空。但看到长远的利润失之交臂。却恰恰是最令波段交易者痛苦的。所以这么说来，你是否更能够体会这两种风格的差异了呢？一个不介意止损，另一个却恰巧痛恨输钱。一个不介意踏空，另一个却真心痛恨利润从眼前溜走。你可以扪心自问哪个是你更难受的，哪个是你更想追求的。就会大致映照出你的个性以及倾向，做哪一类型的交易？我也趁机，重申武断，但明晰的二选一选项方便你参考。","p":"p461"},{"t":"波段交易者接受胜率大致只有40%的前提，追求至少十根以上的K线。能带来二点零倍以上盈亏比的二推运动。而剥头皮交易者则接受仅持仓一到五根K线，仅有一点零倍以下盈亏比的前提，就换的至少60%以上的胜率。这两段描述就是对一笔波段交易以及对一笔波头皮交易的简单定义。","p":"p462"},{"t":"再来您可能也关心的是，如果我更像是波段交易者，那什么样的市场脉络更可能会出现我想要的利润。相对的什么场合则更是剥头皮交易者的理想交易环境，而不适合剥段交易者入场呢？这也要仔细介绍一下，方便你避免可能造成劣势的环境。我想都不用我多讲强劲趋势，就是波段交易者的好朋友。虽然我们还没正式开展建仓方案的讲解。但不难想象，只要入场得宜，开始浮盈。波段交易者是有机会可以在强劲趋势中不断持仓的。这是因为他们不介意回调，对吧？他们本来就可以接受适当过程中的利润回吐。所以耐心是他们的武器。他们不会轻易被甩出运行。只要沉住气，等待并握持10到30根K线。那么，强劲趋势倾向延续的魔法会给予丰厚的回报。那过程中有些人会保持初始的止损，避免回调，将其触发出场。有些人则承担可能被扫出场的危险，透过移动止损来确保利润不至于回吐超级多。这也是执行的细则，因人而异。我们会在后面的单元更详细的讨论。但总之，趋势脉络将带给波段交易者丰厚的利润，这是最对其友善的环境。","p":"p463"}]},{"t":"para","text":"波段交易者接受胜率大致只有40%的前提，追求至少十根以上的K线。能带来二点零倍以上盈亏比的二推运动。而剥头皮交易者则接受仅持仓一到五根K线，仅有一点零倍以下盈亏比的前提，就换的至少60%以上的胜率。这两段描述就是对一笔波段交易以及对一笔波头皮交易的简单定义。","pid":"p462"},{"t":"para","text":"再来您可能也关心的是，如果我更像是波段交易者，那什么样的市场脉络更可能会出现我想要的利润。相对的什么场合则更是剥头皮交易者的理想交易环境，而不适合剥段交易者入场呢？这也要仔细介绍一下，方便你避免可能造成劣势的环境。我想都不用我多讲强劲趋势，就是波段交易者的好朋友。虽然我们还没正式开展建仓方案的讲解。但不难想象，只要入场得宜，开始浮盈。波段交易者是有机会可以在强劲趋势中不断持仓的。这是因为他们不介意回调，对吧？他们本来就可以接受适当过程中的利润回吐。所以耐心是他们的武器。他们不会轻易被甩出运行。只要沉住气，等待并握持10到30根K线。那么，强劲趋势倾向延续的魔法会给予丰厚的回报。那过程中有些人会保持初始的止损，避免回调，将其触发出场。有些人则承担可能被扫出场的危险，透过移动止损来确保利润不至于回吐超级多。这也是执行的细则，因人而异。我们会在后面的单元更详细的讨论。但总之，趋势脉络将带给波段交易者丰厚的利润，这是最对其友善的环境。","pid":"p463"},{"t":"img","src":"assets/img/l12x_194.webp","ilabel":"12-7","icap":"L12　交易风格波段与剥头皮交易的选择","fid":"fig194","ctx":[{"t":"波段交易者接受胜率大致只有40%的前提，追求至少十根以上的K线。能带来二点零倍以上盈亏比的二推运动。而剥头皮交易者则接受仅持仓一到五根K线，仅有一点零倍以下盈亏比的前提，就换的至少60%以上的胜率。这两段描述就是对一笔波段交易以及对一笔波头皮交易的简单定义。","p":"p462"},{"t":"再来您可能也关心的是，如果我更像是波段交易者，那什么样的市场脉络更可能会出现我想要的利润。相对的什么场合则更是剥头皮交易者的理想交易环境，而不适合剥段交易者入场呢？这也要仔细介绍一下，方便你避免可能造成劣势的环境。我想都不用我多讲强劲趋势，就是波段交易者的好朋友。虽然我们还没正式开展建仓方案的讲解。但不难想象，只要入场得宜，开始浮盈。波段交易者是有机会可以在强劲趋势中不断持仓的。这是因为他们不介意回调，对吧？他们本来就可以接受适当过程中的利润回吐。所以耐心是他们的武器。他们不会轻易被甩出运行。只要沉住气，等待并握持10到30根K线。那么，强劲趋势倾向延续的魔法会给予丰厚的回报。那过程中有些人会保持初始的止损，避免回调，将其触发出场。有些人则承担可能被扫出场的危险，透过移动止损来确保利润不至于回吐超级多。这也是执行的细则，因人而异。我们会在后面的单元更详细的讨论。但总之，趋势脉络将带给波段交易者丰厚的利润，这是最对其友善的环境。","p":"p463"},{"t":"我们可以直接来看一个例子。虽然我截不了前面的图，实在离得太远了。但观看均线排列，你应该可以猜想得到，这是一个超级跳空低开的交易日。并且纵览全局，你也不难感受到，如果打从一开始就做空整天下来的利润，应该会颇为丰厚。比如第一根K线低开，还有跟进以后。你基于强劲趋势倾向延续的理由，押注这根阳线，无法扭转跌势。所以在之后出现低一时旋即做空。期待一个AB=CD的等距运动。又或者你等待强劲趋势发起后K线首次回归到均线，押注突破均线的尝试将会失败。所以同样以第一入场，预计价格测试原趋势极值。又或者你更不管不顾一点。想着反正跳空突破这么强，而且还要跟进。那高几率还会有后续？市价入场之后，你就去逛超市，打电动，然后几小时回来以后坐收渔利。以上任何一种波段交易逻辑，都可以让你获得比较大段的利润。一路上做多头反转的尝试都倾向失败，成为推动继续下跌的燃料。这种行情就是波段交易者最喜闻乐见的。只要耐心持有利润，便落袋为安。不过，要在趋势交易日中赚大钱，有说起来的那么容易吗？好像也没有。若是在实盘当下，我们可能会有很多混乱的起心动念。比如说跳空低开，除了两根阴线。马上有长下影线的突破失败迹象。会不会是超卖即将反转？后面跌的也不怎么样。这到底算是窄幅通道还是宽幅通道？有没有一点牛旗的意味呢？马上有强劲的连续阳线出现。是不是要微型反转了？果然刚的下跌看起来更像高潮。相信不止荧幕前的你，多数交易者都会有类似的心声。在结局看来，就是趋势倾向延续和所有押注转成功的交易方法。除非你眼明手快。否则，更可能导致损伤。也正是因为如此，这种小幅回调的趋势。看起来空头不到超级强劲，K线细碎，多头有跃跃欲试的模样的行情。最是剥头皮交易者的噩梦。如果你想要争取顺势的剥头皮利润。一点零倍盈亏比左右，那其实还可行，不过赚不到钱。稍微有一点强劲的阴线，或者背靠窄幅通道的趋势线做空，都可能给到你入场理由。不过一旦你顺利止盈，难免会因为踏空后续利润感到有点难受，对吧？至于逆势，如果你想争取的是逆势的剥头皮利润，那就麻烦了。小幅回调趋势中的疲弱下跌外观会让你觉得好像随时要反转，吸引你冒进。但可能多数仓位在入场以后还没抵达，等距利润的止盈目标趋势就先恢复下跌。所以综合以上，我想要表达就是强劲趋势，是老练波段交易者的好朋友。尤其是那种运行的磨磨蹭蹭，但不知不觉间就走了好远的小幅回调趋势。你只要保持波段交易者的专业素养，入场之后平心静气，忍受回调，等待到位。利润就能够到手。但对于菜鸟波段交易者来说，可能会有点难以驾驭。因为所有顺势的讯号K线都不一定强劲到足以提供入场的信心。所以你常会看着看着就被晾在外面，终于踏空大断的遥远运行。那即使是那些老练的剥头皮交易者，尤其是顺势方，也难免可惜。他们或许可以顺利介入好几次，也成功收获利润的一场。但却也因为迅速止盈的倾向而导致收益有限。但最惨的还是菜鸟的逆势剥头皮和波段交易者。他们被看起来不算强劲的趋势迷惑。一直想要押注反转发生，总觉得该出事了。然后就在逆势作战的过程中，千刀万剐，满手是血。于是如果你想要争取不断利润。你请一定要认明强劲趋势就是弱水三千里面，你要取的那一瓢。训练自己能够判读脉络与动能，透过大量复盘来累积果决与信心。介入之后就好好持仓。而如果你更想要做剥头皮交易者。则同样要辨明这种行情。要么顺势多剥几段，要么闪远一点，等待更适合你的行情。什么样是更适合你的行情呢？我们来接着介绍。","p":"p464"},{"t":"相对的，我们再来看一看，可能杀死波段交易者，但对剥头皮交易者来说，这反而是天堂的脉络。想当然而，既然剥头皮交易者享受快进快出的薄利多销，那么80%的时间里面。市场都处在的宽幅通道与区间状态，就会给予其大量的交易机会。无论是在逆势或顺势方向，都可能有利可图。这样的环境还令其可以采取宽幅止损，采用逆风分批建仓的交易方式来让交易更容易以止盈做结。不过也因为没有明确的趋势，所以不会出现加会波段交易者的强劲突破。有时波段交易者在这样子的脉络里面强行押注突破发生，则很容易头破血流。","p":"p465"}]},{"t":"para","text":"我们可以直接来看一个例子。虽然我截不了前面的图，实在离得太远了 喜欢剥头皮，甚至接受一点零倍以下的盈亏比，那你就可以多空都做。就因为不坚持，不期待单笔的大额利润。所以转换姿态都弹性的多。你可以做所有顺向奔向磁体的短单。可以做对原趋势极值的突破失败，背靠通道线的逆势交易。也可以做所有乖离均线之后，再回归均线的交易。当波段交易者还在等待突破，押注突破又屡屡失望的时候，你已经来回薄利多销。然后聚沙成塔。","pid":"p466"},{"t":"img","src":"assets/img/l12x_196.webp","ilabel":"12-9","icap":"L12　交易风格波段与剥头皮交易的选择","fid":"fig196","ctx":[{"t":"对此，我们也来看一个例子。这显然就是双边交易性格很强的行情了。内部有上升的宽幅通道，还有横向的段落。而整体是一个大型的，形状不规则的区间。你也容易想见波段交易者，在这种情况之下，很可能并无用武之地。他们所期待的趋势性运动都发育不起来，每一次对前高点造成突破，多头交易者做的都不是追近，而是止盈离场，给空头趁虚而入的机会。那相对的，如果喜欢剥头皮，甚至接受一点零倍以下的盈亏比，那你就可以多空都做。就因为不坚持，不期待单笔的大额利润。所以转换姿态都弹性的多。你可以做所有顺向奔向磁体的短单。可以做对原趋势极值的突破失败，背靠通道线的逆势交易。也可以做所有乖离均线之后，再回归均线的交易。当波段交易者还在等待突破，押注突破又屡屡失望的时候，你已经来回薄利多销。然后聚沙成塔。","p":"p466"},{"t":"综合以上，你应该不难理解到，不同的市场脉络，会嘉惠不同的建仓方案。有人喜欢大额利润，他善于等待，也有耐心持仓。那作为一位波段交易者，只要他好好甄选一下，能够走出趋势性行情的时机，获利自然就会轻松的多。而有人喜欢频繁一点交易，喜欢赢，喜欢多空转换自如。那作为一位剥头皮交易者，就是心甘情愿放弃利润暴级的美梦。还有在双边交易状态中逐笔积累利润。或许你已经做出初步的选择。但无论现在更清新哪一种。如果想要趋吉避凶，那依然是要如我们所一再强调的“娴熟对于脉络与动能的判断”。","p":"p467"}]},{"t":"para","text":"综合以上，你应该不难理解到，不同的市场脉络，会嘉惠不同的建仓方案。有人喜欢大额利润，他善于等待，也有耐心持仓。那作为一位波段交易者，只要他好好甄选一下，能够走出趋势性行情的时机，获利自然就会轻松的多。而有人喜欢频繁一点交易，喜欢赢，喜欢多空转换自如。那作为一位剥头皮交易者，就是心甘情愿放弃利润暴级的美梦。还有在双边交易状态中逐笔积累利润。或许你已经做出初步的选择。但无论现在更清新哪一种。如果想要趋吉避凶，那依然是要如我们所一再强调的“娴熟对于脉络与动能的判断”。","pid":"p467"},{"t":"img","src":"assets/img/l12x_197.webp","ilabel":"12-10","icap":"L12　交易风格波段与剥头皮交易的选择","fid":"fig197","ctx":[{"t":"综合以上，你应该不难理解到，不同的市场脉络，会嘉惠不同的建仓方案。有人喜欢大额利润，他善于等待，也有耐心持仓。那作为一位波段交易者，只要他好好甄选一下，能够走出趋势性行情的时机，获利自然就会轻松的多。而有人喜欢频繁一点交易，喜欢赢，喜欢多空转换自如。那作为一位剥头皮交易者，就是心甘情愿放弃利润暴级的美梦。还有在双边交易状态中逐笔积累利润。或许你已经做出初步的选择。但无论现在更清新哪一种。如果想要趋吉避凶，那依然是要如我们所一再强调的“娴熟对于脉络与动能的判断”。","p":"p467"},{"t":"如果搞不清楚市场现在处于什么环境，无法辨识哪些地方是关键价位。也对突破时测试的动能表现视若无睹。那你自然会找不到立即的时机与减仓方案。只会反复做错误的事情。","p":"p468"},{"t":"说到这里，结合个性，结合过往观察市场的方式，以结合你做单的习惯。你觉得自己更像是剥断交易者，还是剥头皮交易者呢？或者说你希望自己将来发展成一位波段交易者，还是剥头皮交易者呢？我好奇大家的选择？假设你已经有初步的想法了，那我们接着再谈谈两个选项的B的部分。让你先做比较坏的打算，再思考看看自己是否能够承担或者胜任。高盈亏比低胜率交易系统的难处与危险是什么呢？","p":"p469"}]},{"t":"para","text":"如果搞不清楚市场现在处于什么环境，无法辨识哪些地方是关键价位。也对突破时测试的动能表现视若无睹。那你自然会找不到立即的时机与减仓方案。只会反复做错误的事情。","pid":"p468"},{"t":"para","text":"说到这里，结合个性，结合过往观察市场的方式，以结合你做单的 余次。请千万不要以为这不可能发生。所以你可以说，如果选择低胜率高盈亏比的方案。那运气差的时候，只要你的资金管理不佳，随意重仓，那你很可能就会突然归零了。同时，如果您为睡觉，通勤，上班，洗澡不小心错过了阴阳胜出的交易机会。但你漫长的等待，累积的止损，就会功亏一溃。所以整体说来，我会说波段交易的难处在于交易者很难在不停止损的情况下，依然平心静气的维持交易纪律。尤其你选择的盈亏比越大，这个问题就会越被放大。请千万要有心理准备。那另一边低盈亏比高胜率系统的难处与危险何在？","p":"p470"},{"t":"不难想象，喜欢赢，想要提高胜率，应该是所有交易者的希望。但相伴的必定是低盈亏比，对吧？想维持高胜率这一方面，代表能有能力不断辨识出胜率大于70%的交易机会。才能取得正向期望。还需要在这种机会的密集轰炸之下，维持稳定的执行力。如果你对于刚才双边交易市场有印象。价格处处是反转，因此处处是机会。这却也代表你必须在短时间内做重复的品质精良的决策。于是难以不停的系统性辨识出胜率极高的机会，并且令人疲倦，是剥头皮交易最大的问题。也由于风险和利润相当，甚至可能大过风险。万一不幸止损，也可能会有功过相抵，白费力气的徒劳感受。剥头皮交易者的目标也是赚钱，而非单纯的不停交易。所以赚得稳，赚得准，需要非常精湛的能力与体力。这绝对是痛苦的事情。","p":"p471"}]},{"t":"para","text":"不难想象，喜欢赢，想要提高胜率，应该是所有交易者的希望。但相伴的必定是低盈亏比，对吧？想维持高胜率这一方面，代表能有能力不断辨识出胜率大于70%的交易机会。才能取得正向期望。还需要在这种机会的密集轰炸之下，维持稳定的执行力。如果你对于刚才双边交易市场有印象。价格处处是反转，因此处处是机会。这却也代表你必须在短时间内做重复的品质精良的决策。于是难以不停的系统性辨识出胜率极高的机会，并且令人疲倦，是剥头皮交易最大的问题。也由于风险和利润相当，甚至可能大过风险。万一不幸止损，也可能会有功过相抵，白费力气的徒劳感受。剥头皮交易者的目标也是赚钱，而非单纯的不停交易。所以赚得稳，赚得准，需要非常精湛的能力与体力。这绝对是痛苦的事情。","pid":"p471"},{"t":"img","src":"assets/img/l12x_200.webp","ilabel":"12-13","icap":"L12　交易风格波段与剥头皮交易的选择","fid":"fig200","ctx":[{"t":"不难想象，喜欢赢，想要提高胜率，应该是所有交易者的希望。但相伴的必定是低盈亏比，对吧？想维持高胜率这一方面，代表能有能力不断辨识出胜率大于70%的交易机会。才能取得正向期望。还需要在这种机会的密集轰炸之下，维持稳定的执行力。如果你对于刚才双边交易市场有印象。价格处处是反转，因此处处是机会。这却也代表你必须在短时间内做重复的品质精良的决策。于是难以不停的系统性辨识出胜率极高的机会，并且令人疲倦，是剥头皮交易最大的问题。也由于风险和利润相当，甚至可能大过风险。万一不幸止损，也可能会有功过相抵，白费力气的徒劳感受。剥头皮交易者的目标也是赚钱，而非单纯的不停交易。所以赚得稳，赚得准，需要非常精湛的能力与体力。这绝对是痛苦的事情。","p":"p471"},{"t":"从而以上两者所需具备的素质和技能会有些不同。想要赚到波段等级利润，你得要承受较低的胜率，得承受较长的持长时间，得承受回调。还有非常好的资金管理能力，连续止损也不能崩溃脱蓄。而想要享受高胜率作为剥波头皮交易者，你的需要擅长挑出胜率大于70%的交易机会。以及连续能在短的时间内灵机应变。还要与偶意为之的宽幅风险止损和平共处。我实在无意要恐吓你，也没有要把交易说的比实际情况更难的意思。你是真的必须知道享受什么好处，需要接受什么代价。所有的利润都是对于你承担风险，劳心劳力的补偿。这是盈亏同源的道理，交易者就应该深刻知道。","p":"p472"}]},{"t":"para","text":"从而以上两者所需具备的素质和技能会有些不同。想要赚到波段等级利润，你得要承受较低的胜率，得承受较长的持长时间，得承受回调。还有非常好的资金管理能力，连续止损也不能崩溃脱蓄。而想要享受高胜率作为剥波头皮交易者，你的需要擅长挑出胜率大于70%的交易机会。以及连续能在短的时间内灵机应变。还要与偶意为之的宽幅风险止损和平共处。我实在无意要恐吓你，也没有要把交易说的比实际情况更难的意思。你是真的必须知道享受什么好处，需要接受什么代价。所有的利润都是对于你承担风险，劳心劳力的补偿。这是盈亏同源的道理，交易者就应该深刻知道。","pid":"p472"},{"t":"img","src":"assets/img/l12x_201.webp","ilabel":"12-14","icap":"L12　交易风格波段与剥头皮交易的选择","fid":"fig201","ctx":[{"t":"从而以上两者所需具备的素质和技能会有些不同。想要赚到波段等级利润，你得要承受较低的胜率，得承受较长的持长时间，得承受回调。还有非常好的资金管理能力，连续止损也不能崩溃脱蓄。而想要享受高胜率作为剥波头皮交易者，你的需要擅长挑出胜率大于70%的交易机会。以及连续能在短的时间内灵机应变。还要与偶意为之的宽幅风险止损和平共处。我实在无意要恐吓你，也没有要把交易说的比实际情况更难的意思。你是真的必须知道享受什么好处，需要接受什么代价。所有的利润都是对于你承担风险，劳心劳力的补偿。这是盈亏同源的道理，交易者就应该深刻知道。","p":"p472"},{"t":"说到这里，你可能也已经犹然一些疑问，我们再来解答一下。比如你可能好奇，如果纯以盈亏比来进行波段或剥头皮的划分，有时候可能会违反直觉。如果盈亏比低接近一点零倍。但止损和止盈都超宽。所预测算的利润距离实际上很远。那这还能叫剥头皮吗？又或者如果盈亏比高，但止盈即使很窄，没几根K线，那这也能够叫波段吗？确实，这些都是有些尴尬的情况。好像这么称呼是有点别扭的。不难发现，这是因为用波段，剥头皮这些称呼的时候，我们通常预设的是较大利润，按较少的利润。这是用绝对值而不是用风险和收益之间的比例关系相对值的角度去理解。那当然，这种惯性是很难调整的。为无意规定大家把宽止损，宽止盈的方案也叫做剥头皮，这好像有一点没道理。所以称呼波段的时候，我们所想象的标准方案还是那种四成胜率，两倍盈亏比。而且要持续十根K线以上的版本。而如果是少于十根K线，却同样高盈亏比低胜率，那你还是得要知道，这本质上是个更小时间级别图表，上面的波段交易。相对的宽止损，宽止盈持续非常多根K线。那对应到更大时间级别图表上，这依然是一笔剥头皮交易。划分波段和剥头皮风格的本质上依然是盈亏比。","p":"p473"}]},{"t":"para","text":"说到这里，你可能也已经犹然一些疑问，我们再来解答一下。比如你可能好奇，如果纯以盈亏比来进行波段或剥头皮的划分，有时候可能会违反直觉。如果盈亏比低接近一点零倍。但止损和止盈都超宽。所预测算的利润距离实际上很远。那这还能叫剥头皮吗？又或者如果盈亏比高，但止盈即使很窄，没几根K线，那这也能够叫波段吗？确实，这些都是有些尴尬的情况。好像这么称呼是有点别扭的。不难发现，这是因为用波段，剥头皮这些称呼的时候，我们通常预设的是较大利润，按较少的利润。这是用绝对值而不是用风险和收益之间的比例关系相对值的角度去理解。那当然，这种惯性是很难调整的。为无意规定大家把宽止损，宽止盈的方案也叫做剥头皮，这好像有一点没道理。所以称呼波段的时候，我们所想象的标准方案还是那种四成胜率，两倍盈亏比。而且要持续十根K线以上的版本。而如果是少于十根K线，却同样高盈亏比低胜率，那你还是得要知道，这本质上是个更小时间级别图表，上面的波段交易。相对的宽止损，宽止盈持续非常多根K线。那对应到更大时间级别图表上，这依然是一笔剥头皮交易。划分波段和剥头皮风格的本质上依然是盈亏比。","pid":"p473"},{"t":"img","src":"assets/img/l12x_202.webp","ilabel":"12-15","icap":"L12　交易风格波段与剥头皮交易的选择","fid":"fig202","ctx":[{"t":"说到这里，你可能也已经犹然一些疑问，我们再来解答一下。比如你可能好奇，如果纯以盈亏比来进行波段或剥头皮的划分，有时候可能会违反直觉。如果盈亏比低接近一点零倍。但止损和止盈都超宽。所预测算的利润距离实际上很远。那这还能叫剥头皮吗？又或者如果盈亏比高，但止盈即使很窄，没几根K线，那这也能够叫波段吗？确实，这些都是有些尴尬的情况。好像这么称呼是有点别扭的。不难发现，这是因为用波段，剥头皮这些称呼的时候，我们通常预设的是较大利润，按较少的利润。这是用绝对值而不是用风险和收益之间的比例关系相对值的角度去理解。那当然，这种惯性是很难调整的。为无意规定大家把宽止损，宽止盈的方案也叫做剥头皮，这好像有一点没道理。所以称呼波段的时候，我们所想象的标准方案还是那种四成胜率，两倍盈亏比。而且要持续十根K线以上的版本。而如果是少于十根K线，却同样高盈亏比低胜率，那你还是得要知道，这本质上是个更小时间级别图表，上面的波段交易。相对的宽止损，宽止盈持续非常多根K线。那对应到更大时间级别图表上，这依然是一笔剥头皮交易。划分波段和剥头皮风格的本质上依然是盈亏比。","p":"p473"},{"t":"第二个问题，如果我眼明手快，即使明知逆势是否还是有机会获取剥头皮利润呢？例如，一波强劲的急速发起价格开始乖离均线。然后接着看到一个逆向的K线开始形成。我能不能预期回归均线的利润到位了就赶紧离场。我相信不少朋友会有类似的想法。但实际上，这是很难达成的事情。因为你一定能够感受得出来，这是当前存在强劲趋势的情况。有这样的意识，相伴的就是当前80%的反转尝试都将以失败告终。也代表当前不太可能以停止订单执行逆势剥头皮交易来获利。为什么？这是因为在所有你打算已停止订单入场的逆势剥头皮位置，比如上升趋势中的低一做空建仓形态。都可能有顺势交易者这样的趋势倾向延续，以宽幅止损，以限价订单直接押注你失败。反正他们比你更有数学优势。所以，尤其在急速和窄幅通道中，顺势还是最优先的。我们说观察脉络与动能，不是动能与脉络，那肯定是脉络在前。如果你观察到强劲的逆向动能。但在错误的环境里面，那急剧的逆势K线可能只是暂时的放弃，而顺势价值交易者正在埋伏你。对于新手学习者，尤其如果你是第一次看这个课程，第一次严肃的考虑，我要当波段交易者，还是剥头皮交易者的问题。那请先不要考虑逆势的剥头皮。这需要多年的练习，连我都不喜欢做。你要慎加考虑。","p":"p474"}]},{"t":"para","text":"第二个问题，如果我眼明手快，即使明知逆势是否还是有机会获取剥头皮利润呢？例如，一波强劲的急速发起价格开始乖离均线。然后接着看到一个逆向的K线开始形成。我能不能预期回归均线的利润到位了就赶紧离场。我相信不少朋友会有类似的想法。但实际上，这是很难达成的事情。因为你一定能够感受得出来，这是当前存在强劲趋势的情况。有这样的意识，相伴的就是当前80%的反转尝试都将以失败告终。也代表当前不太可能以停止订单执行逆势剥头皮交易来获利。为什么？这是因为在所有你打算已停止订单入场的逆势剥头皮位置，比如上升趋势中的低一做空建仓形态。都可能有顺势交易者这样的趋势倾向延续，以宽幅止损，以限价订单直接押注你失败。反正他们比你更有数学优势。所以，尤其在急速和窄幅通道中，顺势还是最优先的。我们说观察脉络与动能，不是动能与脉络，那肯定是脉络在前。如果你观察到强劲的逆向动能。但在错误的环境里面，那急剧的逆势K线可能只是暂时的放弃，而顺势价值交易者正在埋伏你。对于新手学习者，尤其如果你是第一次看这个课程，第一次严肃的考虑，我要当波段交易者，还是剥头皮交易者的问题。那请先不要考虑逆势的剥头皮。这需要多年的练习，连我都不喜欢做。你要慎加考虑。","pid":"p474"},{"t":"img","src":"assets/img/l12x_203.webp","ilabel":"12-16","icap":"L12　交易风格波段与剥头皮交易的选择","fid":"fig203","ctx":[{"t":"第二个问题，如果我眼明手快，即使明知逆势是否还是有机会获取剥头皮利润呢？例如，一波强劲的急速发起价格开始乖离均线。然后接着看到一个逆向的K线开始形成。我能不能预期回归均线的利润到位了就赶紧离场。我相信不少朋友会有类似的想法。但实际上，这是很难达成的事情。因为你一定能够感受得出来，这是当前存在强劲趋势的情况。有这样的意识，相伴的就是当前80%的反转尝试都将以失败告终。也代表当前不太可能以停止订单执行逆势剥头皮交易来获利。为什么？这是因为在所有你打算已停止订单入场的逆势剥头皮位置，比如上升趋势中的低一做空建仓形态。都可能有顺势交易者这样的趋势倾向延续，以宽幅止损，以限价订单直接押注你失败。反正他们比你更有数学优势。所以，尤其在急速和窄幅通道中，顺势还是最优先的。我们说观察脉络与动能，不是动能与脉络，那肯定是脉络在前。如果你观察到强劲的逆向动能。但在错误的环境里面，那急剧的逆势K线可能只是暂时的放弃，而顺势价值交易者正在埋伏你。对于新手学习者，尤其如果你是第一次看这个课程，第一次严肃的考虑，我要当波段交易者，还是剥头皮交易者的问题。那请先不要考虑逆势的剥头皮。这需要多年的练习，连我都不喜欢做。你要慎加考虑。","p":"p474"},{"t":"第三题可能有些人好奇，两种风格可不可以都做？能剥断的时候就做剥断，只能剥头皮的时候剥头皮。这个问题实话说是绝对可行的。不过就学习的角度而言，得分阶段。就最老练的交易者来讲，比如你已经到了阿尔布鲁克斯的程度，但你可能不止有18般武艺，武器库里会有多种剥头皮方案，也有多种剥段方案。甚至当原先打算剥头皮，但在持仓过程之中，察觉到可能发展出波段级别利润时。他可以因时制宜的决定调整原先短进短出的止盈计划，变成一部分在争取到剥头皮利润之后先离场。另一部分持续以波段逻辑持仓。反过来说，当原本执行了一笔波段交易而在持仓过程之中辨识出新产生的不利讯号时。这位老练交易者可能认定，原先建立的波段仓位不再合理，市场状态即将转入区间。于是决定先行退出，并将该笔交易变成仅争取剥头皮利润之后就了结。不过，这种三头六臂艺多还不压身的本领，当然很需要丰沛的图表阅读量。我们不能期待才学第一趟就马上变成这种大师。所以我们再退而求其次谈一下，你在精学价格行为的第一到第二年间，可以期待什么样的目标？资深的学徒能够做到的是备好几项武器，应对不同的行情。比如，当他阅读脉络认为当天可能发生反转，那他早已看准下手的位置，打算拿一个高盈亏比的波段利润。可当行情转入区间，给到他剥头皮的交易机会，他也有应对的方案去争取迅速的出入。所以整天下来，他尽管能力还做不到精准的把每一个剥头皮都握成波段，把波段缩短成剥头皮。让动态的策略转换。但其实他也并不需要这么做。光是依着验证过的规则形式，就可以赚到很不错的利润。也于是这应该先成为你的终极目标。达成目标的路径，就是先把前面单元的原理熟练起来，接着从后续教的建仓方案之中挑几招。再根据自己的个性和风格，做出一个组合，专心先把这几种建仓方案练好。这中间的状态持续个一两年，能够比较稳定的赚到收益了，也顺道累积了经验。才慢慢让持仓管理的能力也去养成起来，最终，朝向老练交易者可以收放记录的状态推进。","p":"p475"},{"t":"那在退一步，初期给自己设定什么目标好呢？当然就是先不要想那么多，在波段跟剥头皮之间选一边站就可以，然后把单一一个建仓方案给定好。不难想象，初学者亏损的最大原因之一就是自作聪明，想在第一个月就跟老练交易者一样，操作混淆的波段和剥头皮交易错配了两者的进出场方式。比如，怀揣一点五个点换十个点的野心。认为即使如此，做胜率只有三成。实际上，胜率只有13%。长期下来也能够盈利。然而，却又在仅盈利一个点之后就提前离场，喜滋滋的侥幸起来，甚至为自己对数学的熟虑深思感到骄傲，浑然不觉。实际上，执行的是以一点五个点换一个点的交易。那更糟糕的是，如果价格没有如预期的正向运行，他们甚至会取消原本的止损，逆风加仓，说服自己二次入场的胜率将会更高。于是他们实际上是以两倍仓位承担着更大的风险。然后又继续在某个不明所以毫无道理的价位提前离场。那事后回顾起来，新手交易者对于自己机关算尽所换来的亏损结果感到困惑。而实际上，他们其实或许是曾经建立过期望为正的仓位的，但却因为错误的仓位管理而使其为负。这种愚蠢的操作就是他们的资金逐渐烟消雾散的主因。所以总之小心聪明反被聪明误。更别凭感觉操作。初学阶段，你没有可靠的主观能力可言。可如果非要在这两种风格之中推荐一个我和阿尔布鲁克斯都会建议你考虑精挑细选，耐心等待，一天只做最优质的一到两笔波段交易。这是因为多数交易日中其实都会出现顺率四成到五成，而对应盈亏比是两倍的交易机会。或者与此相近，但盈亏比低一点，一点多倍，但胜率仍有60%。能够满足这种要求的交易类型，后面会陆续介绍给你，包括跟随强劲的突破，在回调中顺势入场，在区间边线预期突破失败或者可靠的大型趋势反转等等。都不算是太难发现，也随之算是容易介入。以波段交易方式管理持仓。将给予新手交易者一定的行动弹性。包括允许你在进步几个月之后，与持仓期间浮盈扩大之下少量的逐步加仓。或者在你离场的时候，让你可以选择一次止盈所有仓位，或者在有浮盈的情况下逐步平仓。总体来说，只要不要中途乱搞，耐心握持仓位。争取波段利润是比较省事的做法。一笔收益抵剥头皮来回三趟。简易的利润总是令人心旷神怡，值得刚起步的你拥有。","p":"p476"}]},{"t":"para","text":"第三题可能有些人好奇，两种风格可不可以都做？能剥断的时候就做剥断，只能剥头皮的时候剥头皮。这个问题实话说是绝对可行的。不过就学习的角度而言，得分阶段。就最老练的交易者来讲，比如你已经到了阿尔布鲁克斯的程度，但你可能不止有18般武艺，武器库里会有多种剥头皮方案，也有多种剥段方案。甚至当原先打算剥头皮，但在持仓过程之中，察觉到可能发展出波段级别利润时。他可以因时制宜的决定调整原先短进短出的止盈计划，变成一部分在争取到剥头皮利润之后先离场。另一部分持续以波段逻辑持仓。反过来说，当原本执行了一笔波段交易而在持仓过程之中辨识出新产生的不利讯号时。这位老练交易者可能认定，原先建立的波段仓位不再合理，市场状态即将转入区间。于是决定先行退出，并将该笔交易变成仅争取剥头皮利润之后就了结。不过，这种三头六臂艺多还不压身的本领，当然很需要丰沛的图表阅读量。我们不能期待才学第一趟就马上变成这种大师。所以我们再退而求其次谈一下，你在精学价格行为的第一到第二年间，可以期待什么样的目标？资深的学徒能够做到的是备好几项武器，应对不同的行情。比如，当他阅读脉络认为当天可能发生反转，那他早已看准下手的位置，打算拿一个高盈亏比的波段利润。可当行情转入区间，给到他剥头皮的交易机会，他也有应对的方案去争取迅速的出入。所以整天下来，他尽管能力还做不到精准的把每一个剥头皮都握成波段，把波段缩短成剥头皮。让动态的策略转换。但其实他也并不需要这么做。光是依着验证过的规则形式，就可以赚到很不错的利润。也于是这应该先成为你的终极目标。达成目标的路径，就是先把前面单元的原理熟练起来，接着从后续教的建仓方案之中挑几招。再根据自己的个性和风格，做出一个组合，专心先把这几种建仓方案练好。这中间的状态持续个一两年，能够比较稳定的赚到收益了，也顺道累积了经验。才慢慢让持仓管理的能力也去养成起来，最终，朝向老练交易者可以收放记录的状态推进。","pid":"p475"},{"t":"para","text":"那在退一步，初期给自己设定什么目标好呢？当然就是先不要想那么多，在波段跟剥头皮之间选一边站就可以，然后把单一一个建仓方案给定好。不难想象，初学者亏损的最大原因之一就是自作聪明，想在第一个月就跟老练交易者一样，操作混淆的波段和剥头皮交易错配了两者的进出场方式。比如，怀揣一点五个点换十个点的野心。认为即使如此，做胜率只有三成。实际上，胜率只有13%。长期下来也能够盈利。然而，却又在仅盈利一个点之后就提前离场，喜滋滋的侥幸起来，甚至为自己对数学的熟虑深思感到骄傲，浑然不觉。实际上，执行的是以一点五个点换一个点的交易。那更糟糕的是，如果价格没有如预期的正向运行，他们甚至会取消原本的止损，逆风加仓，说服自己二次入场的胜率将会更高。于是他们实际上是以两倍仓位承担着更大的风险。然后又继续在某个不明所以毫无道理的价位提前离场。那事后回顾起来，新手交易者对于自己机关算尽所换来的亏损结果感到困惑。而实际上，他们其实或许是曾经建立过期望为正的仓位的，但却因为错误的仓位管理而使其为负。这种愚蠢的操作就是他们的资金逐渐烟消雾散的主因。所以总之小心聪明反被聪明误。更别凭感觉操作。初学阶段，你没有可靠的主观能力可言。可如果非要在这两种风格之中推荐一个我和阿尔布鲁克斯都会建议你考虑精挑细选，耐心等待，一天只做最优质的一到两笔波段交易。这是因为多数交易日中其实都会出现顺率四成到五成，而对应盈亏比是两倍的交易机会。或者与此相近，但盈亏比低一点，一点多倍，但胜率仍有60%。能够满足这种要求的交易类型，后面会陆续介绍给你，包括跟随强劲的突破，在回调中顺势入场，在区间边线预期突破失败或者可靠的大型趋势反转等等。都不算是太难发现，也随之算是容易介入。以波段交易方式管理持仓。将给予新手交易者一定的行动弹性。包括允许你在进步几个月之后，与持仓期间浮盈扩大之下少量的逐步加仓。或者在你离场的时候，让你可以选择一次止盈所有仓位，或者在有浮盈的情况下逐步平仓。总体来说，只要不要中途乱搞，耐心握持仓位。争取波段利润是比较省事的做法。一笔收益抵剥头皮来回三趟。简易的利润总是令人心旷神怡，值得刚起步的你拥有。","pid":"p476"},{"t":"img","src":"assets/img/l12x_204.webp","ilabel":"12-17","icap":"L12　交易风格波段与剥头皮交易的选择","fid":"fig204","ctx":[{"t":"第三题可能有些人好奇，两种风格可不可以都做？能剥断的时候就做剥断，只能剥头皮的时候剥头皮。这个问题实话说是绝对可行的。不过就学习的角度而言，得分阶段。就最老练的交易者来讲，比如你已经到了阿尔布鲁克斯的程度，但你可能不止有18般武艺，武器库里会有多种剥头皮方案，也有多种剥段方案。甚至当原先打算剥头皮，但在持仓过程之中，察觉到可能发展出波段级别利润时。他可以因时制宜的决定调整原先短进短出的止盈计划，变成一部分在争取到剥头皮利润之后先离场。另一部分持续以波段逻辑持仓。反过来说，当原本执行了一笔波段交易而在持仓过程之中辨识出新产生的不利讯号时。这位老练交易者可能认定，原先建立的波段仓位不再合理，市场状态即将转入区间。于是决定先行退出，并将该笔交易变成仅争取剥头皮利润之后就了结。不过，这种三头六臂艺多还不压身的本领，当然很需要丰沛的图表阅读量。我们不能期待才学第一趟就马上变成这种大师。所以我们再退而求其次谈一下，你在精学价格行为的第一到第二年间，可以期待什么样的目标？资深的学徒能够做到的是备好几项武器，应对不同的行情。比如，当他阅读脉络认为当天可能发生反转，那他早已看准下手的位置，打算拿一个高盈亏比的波段利润。可当行情转入区间，给到他剥头皮的交易机会，他也有应对的方案去争取迅速的出入。所以整天下来，他尽管能力还做不到精准的把每一个剥头皮都握成波段，把波段缩短成剥头皮。让动态的策略转换。但其实他也并不需要这么做。光是依着验证过的规则形式，就可以赚到很不错的利润。也于是这应该先成为你的终极目标。达成目标的路径，就是先把前面单元的原理熟练起来，接着从后续教的建仓方案之中挑几招。再根据自己的个性和风格，做出一个组合，专心先把这几种建仓方案练好。这中间的状态持续个一两年，能够比较稳定的赚到收益了，也顺道累积了经验。才慢慢让持仓管理的能力也去养成起来，最终，朝向老练交易者可以收放记录的状态推进。","p":"p475"},{"t":"那在退一步，初期给自己设定什么目标好呢？当然就是先不要想那么多，在波段跟剥头皮之间选一边站就可以，然后把单一一个建仓方案给定好。不难想象，初学者亏损的最大原因之一就是自作聪明，想在第一个月就跟老练交易者一样，操作混淆的波段和剥头皮交易错配了两者的进出场方式。比如，怀揣一点五个点换十个点的野心。认为即使如此，做胜率只有三成。实际上，胜率只有13%。长期下来也能够盈利。然而，却又在仅盈利一个点之后就提前离场，喜滋滋的侥幸起来，甚至为自己对数学的熟虑深思感到骄傲，浑然不觉。实际上，执行的是以一点五个点换一个点的交易。那更糟糕的是，如果价格没有如预期的正向运行，他们甚至会取消原本的止损，逆风加仓，说服自己二次入场的胜率将会更高。于是他们实际上是以两倍仓位承担着更大的风险。然后又继续在某个不明所以毫无道理的价位提前离场。那事后回顾起来，新手交易者对于自己机关算尽所换来的亏损结果感到困惑。而实际上，他们其实或许是曾经建立过期望为正的仓位的，但却因为错误的仓位管理而使其为负。这种愚蠢的操作就是他们的资金逐渐烟消雾散的主因。所以总之小心聪明反被聪明误。更别凭感觉操作。初学阶段，你没有可靠的主观能力可言。可如果非要在这两种风格之中推荐一个我和阿尔布鲁克斯都会建议你考虑精挑细选，耐心等待，一天只做最优质的一到两笔波段交易。这是因为多数交易日中其实都会出现顺率四成到五成，而对应盈亏比是两倍的交易机会。或者与此相近，但盈亏比低一点，一点多倍，但胜率仍有60%。能够满足这种要求的交易类型，后面会陆续介绍给你，包括跟随强劲的突破，在回调中顺势入场，在区间边线预期突破失败或者可靠的大型趋势反转等等。都不算是太难发现，也随之算是容易介入。以波段交易方式管理持仓。将给予新手交易者一定的行动弹性。包括允许你在进步几个月之后，与持仓期间浮盈扩大之下少量的逐步加仓。或者在你离场的时候，让你可以选择一次止盈所有仓位，或者在有浮盈的情况下逐步平仓。总体来说，只要不要中途乱搞，耐心握持仓位。争取波段利润是比较省事的做法。一笔收益抵剥头皮来回三趟。简易的利润总是令人心旷神怡，值得刚起步的你拥有。","p":"p476"},{"t":"从我以上在开始入场以前，你是否对于交易的风格与类型有基本认识呢？我们赶紧来回顾一下前头提及的知识，并进一步收敛给出结论。在一开始我们谈到市场中数学优势太过优异的交易机会，难以存在的原因。正由于机构都极其聪明，不会做蠢事，因而每一笔交易必然是相当接近于公平的。如果一方想有盈亏比优势，那就必须牺牲胜率，让其对手更有机会赢下一城。而选择胜率的代价则同样是放弃盈亏比，其对手一旦得逞，就能够获得大笔利润。这也就是说，两种风格波段和剥头皮交易者时常互为对手方。那究竟何为波段交易，何为剥头皮交易？我们可以先有个简单的定义。在日内波段交易的理型是，两倍盈亏比对应胜率四成，持续10根到30根K线的二推以上运动。剥头皮交易则短小精干的多，一点零倍盈亏比对应胜率有六成，仅持仓一到五根K线就离场。当然，两种类型同样坐落在连续的光谱之上，有介于两者之间的有外于两者。更大盈亏比或更小盈亏比的可能。小复习盈亏比和胜率的大致关系，除了可以参考第一单元提供的数据，你可以透过公式计算。来带入任何盈亏，比算出对应的盈亏平衡胜率。那既然两者的偏重不同，一个是相较于风险更丰厚的利润，一个是更频繁赢钱的稳定发挥。那有舍有得，我们也必须了解甜美果实背后的苦衷。作为波段交易者，你需要忍受屡屡失败，这当中不时的回调，导致利润回吐以及收获以前漫长耗时的等待。作为剥头皮交易者，你只要先备有非常高超的能力，不停的，系统性的辨识出胜率高于70%的交易机会。你还要忍受交易，变得像是一个重复而枯燥的劳力活，以及一旦止损就会损失惨重。不过，虽然看起来各有各的苦，但只要你能够辨识出什么样的市场环境，有利于自己的风格。那么，利润是能够水到渠成的。对波段交易者，请尽量把握急速，窄幅通道等趋势倾向延续的脉络。可这里却是剥头皮，交易者恰恰需要忌惮，不要冒进逆势入场。即使要交易，也必然要顺着趋势方向。相对的宽幅通道和区间则给到剥头皮交易者大量的交易机会。而令期待突破，期待失衡，长久持续的波段交易者感到郁闷。此际，波段风格的朋友，请尽可能保持观望。最后，我们来讨论了是否可以两者兼做的问题。绝对可以的，但应该分阶段来。新手交易者最大的亏损就源自于自以为行，赢者贪婪，想把原先只用来剥头皮的仓位做成波段。因为恐惧而将波段交易做成剥头皮。这种收放自如，需要强大的读图能力，我们难以在初学的前六个月，前12个月就行云流水。你应该考虑的是先选一边，并
