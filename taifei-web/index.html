的在具有数学优势的时候，以正确的仓位管理介入市场，终而能够稳定获利。清楚以上要点以及往后所有单元所要教给你的技能之后，你应该就能够慢慢脱去对于市场的恐惧。我很清楚的晓得，新手交易者害怕非常多的事情。你可能害怕输钱，担心要是把辛辛苦苦积攒下来的储蓄都赔给你的交易对手。你以交易为生的梦想，就互判死刑。你可能害怕自己不够聪明，不够有纪律，不够努力或者不够果决，种种生理和心理的限制。将阻止你成为一位成功的交易者。你可能害怕朋友另一半家人对你感到不理解，担心你是个赌鬼，担心你搞不清楚自己在干什么。担心你是个软弱又愚昧的人，投身了错误的事业。但请你听我说各形各色的恐惧，其实不过是源自于对于市场以及对自己的不了解。一旦你抱持一个认真学习的心情，开始对所有的事物感到好奇，并且不放弃追问和调整。所有的困难都能够慢慢拨云见日。我也愿意不厌其烦的再说一次交易是个辛苦的行当，财富只留给勤恳的人。你如果希望能够长期盈利，我会说这是做得到的。但你必须同样长期稳定的比至少一半，总是盈利的机构表现更好。这代表什么呢？代表你必须忍受辛苦，而且你必须无与伦比的优秀。在最后，我想引用同样出自金融怪杰的一段话。受访者之一的Michael Steinhardt是这样劝诫交易学习者的。股市中最邪门的事情是，有时候你能够以最大的无知赚钱。但这种事却是一个邪恶的陷阱，会使人相信，无需专业知识就可以纵横股市。因此，我的忠告是要认清市场的竞争非常激烈。当你买进或卖出股票时，你的竞争对象都是一些专业的交易者。在许多情况下，这些专业者往往就是你的交易对手，早晚总会给你迎头痛击。","p":"p214"},{"t":"所以我想要诚挚的恭喜你，你已经在正确的道路上。从今天开始，你将会学的更多，问的更多，练习的更多，并且谦卑的更多。你已经是一个不一样的人了，知识不会背弃你，我对你有十足的信心。感谢收看，重新认识你所参与的这场游戏。朋友，预祝你学习顺利。","p":"p215"}]}],"wcount":3988}],"wcount":12412},{"id":"l02","icon":"L02","title":"L02　当我们在谈论图表时，我们在谈论什么","blocks":[],"sections":[{"id":"l02A","title":"第A段　当我们在谈论图表时，我们在谈论什么","blocks":[{"t":"para","text":"LESSON 2 当我们在谈论图表时，我们在谈论什么","pid":"p216"},{"t":"para","text":"作为交易者，你必然常常听到读图一词。不过，当我们谈论读图的时候，我们到底在谈论什么？我们最近希望从阅读图表的过程中取得什么资讯呢？你还可能想要进一步知道的是，光是学会阅读图表，真的就能够赚到钱吗？以及要能够读到什么程度，我们才有机会变得富有。以上这些将是我们在这个单元中所会陆续涵盖到的几个重要问题。接下来的时间里，我会向你介绍何谓价格行为。为什么这是交易者所需要掌握的最重要，也是唯一的分析技术以及说明蜡烛图，也就是我们俗称K线的读法。并介绍所有常见的K线组合。工欲善其事，必先利其器。请千万不要觉得这是太容易的内容，而掉以轻心。对于这些名词，有深刻的理解和记忆。知道定义，并且能够辨识出来，会有助于我们的出入场更加顺利。还记得吗？在上个单元，我们提到市场中百分之八十九十的成交量都是由机构创造的。这代表我们所看见的K线，我们所理解的价格，实际上都是由机构和机构之间。买单与卖单的竞合所决定出来的。也正是因为如此，如果说长期存活能被我们在图表上看见的机构都得以长期获利。那不就代表要是我们也能够揣摩机构的逻辑，跟他们使用类似的甚至相同的方法出入场。就也有机会能够稳定赚到钱吗？没错，答案是肯定的。获利的方法确实就是理解描摹跟随机构。只不过要能够稳定且有效的实现这个目标，有个绕不开的高门槛技术，你必须学会。那就是有能力去阅读图表上的每一根K线。每一根吗？有没有这个必要？有的非常之有。其实，早在2009年，阿尔布鲁克斯出版的第一本著作，这是以逐根K线阅读价格图表来命名的。他非常强调，如此仔细解读的重要性，你可以从他书中的这一个段落理解原因，请你跟我复读过一次。他说，我采取逐根K线阅读的方式，以解析每根K线所传递出的讯息，它们每一根都很重要。在K线收线之际，多数交易者会问自己刚刚发生了什么？对于多数K线，他们的结论是，眼下并不存在交易价值，所以无需费心理解。于是他们选择等待更清晰，更大型的形态就仿佛这些K线根本不存在，或者认定他们仅是机构算法交易的产物，个体交易者无从置喙。在这些时候，交易者认为自己应置身市场之外。但“这些时候”却占据了一天中绝大多数的时间。对吧，你肯定也有类似的感觉。对着一张图表，放眼望去，多数时候我们其实是没有在动脑的。眼看K线就一根接一根形成，然后就没有然后。图表上多数K线都被我们认为是不需要多做解读的杂讯。但真的吗？然而，一旦观察成交量，就会发现这些所有被交易者们忽略的K线。实际上，跟他们拒已交易的K线相同。都拥有可观的成交量。确实哦，你看即使在一分钟级别的图表上。这样一根不起眼的小小阴线也动辙有2000多张合约，六点五亿美金的交投。跟大家更容易注意到的大阴线相去不远。显然，有大量的交易正在发生。但他们无法理解为何如此，因而假装这些交易根本不存在，这纯属自欺欺人。也正是因为这样的理由，阿尔布科斯呼吁你要学会阅读图表上的每一根K线。可以忽略是自我欺骗，这不是杰出交易者应有的习惯。所以他用严肃的口吻告诉你，作为一个交易者，你有义务去理解此间的逻辑，并且找到赚钱的方法。尽管学会了解市场所传递的讯息是耗时且困难的。但这是成为一位成功的交易者所必将打下的基础。如果你愿意接受这样的呼吁，从现在开始，你必须设定更高的标准给自己。这是迈向杰出的必要过程。只要你的读图能力越好，对价格行为的了解越深刻，你就越借机环伺你的强敌，也越可能以交易为生。","pid":"p217"},{"t":"para","text":"那接着我们来更具体的讨论一下我们所说的价格行为，实际上指的到底是什么？","pid":"p218"},{"t":"para","text":"如果要对价格行为给个定义，我会说价格行为是对任何商品，任何时间级别，任何类型，图表上价格运动的任何表现形式。所以其实价格行为是很宽泛的。比如你使用折线图，在以年为季的尺度中观察特斯拉股票的价格变化，这是价格行为。你像蜡烛图的发明者，江户时代的米商本间宗酒，用所谓的刻度去表达每天米价的起落涨跌。这也是对价格行为的分析。你使用最常见的K线图表去理解比特币五分钟级别的多空动态，这也是价格行为。并没有说一定要对哪一种商品时间图表进行限定。任何一种你都能够用绘图，用视觉的方式去表达价格的动态变化过程，而这都是价格行为技术分析的范畴。这些图表总之都描绘了市场参与者，如今主要是机构，他们的行动体现了市场它发掘均衡价格的过程。遂此学会阅读图表，就相当于学会了机构的语言。一般来说，图表的功能只是告诉你多空竞合的结果。比如你看到连绵的阳线。那你就知道在过去这一段时间，多空之间的斗争是由多头胜出，之前买进的机构势如破竹且不断追高。但另一方面，卖出的机构节节败退，或者逐渐抽身。即使空方曾经短暂控制过市场，但他们玄机又失去掌控力。所以渐渐开始认为还是暂时退出好打算，等到更高的地方之后再一举重返市场。于是K线本身就呈现了双方的共识，以及他们战斗的记录。另外，除了过去的状态，当下跳动的这根K线也有话要对你说，它呈现的是正在交锋的多空双方。现场直播本色出演。因此，我们说图表的功能就是呈现过去的结果以及当下的动态。那用途呢？我们怎么使用这些资讯？厉害的交易者懂得分析这些资讯。他们知道，在名人的上升急速中，可以无条件追进。是因为他们能够据此推估市场继续步步高升的几率非常高。所以找任何理由介入会是高几率有利可图的。而如果看到另一种景况，比如市场陷入区间。那他们同样也可以据此推测，现在市场处于均衡状态，多空双方至少还要在这边舒适的，你来我往一阵子。也正是因为这样提前押注朝任何一个方向的突破，都并不明智。这么说来，图表的用途就是让懂得市场语言的交易者，善于阅读多空竞合的交易者，可以形成对于市场将如何发展的推估性看法，并接着产生好的交易决策，借以盈利。要是逐根K线你都能读，你能完全贴着市场的脉动，不落掉任何资讯。那你自然就更有本钱执行更棒的交易。常见的一个疑问是，我能理解价格行为的妙用，这使得交易者得以揣摩可能的机构逻辑。那如果我不只熟悉技术分析，还能够结合新闻结合基本分析因素来行动，那是不是会让我的交易更加稳当呢？嗯，我的答案是不会，这可以从两个角度来回答和解释。首先是在太慢情况下，我们希望使用新闻和基本分析因素进行决策。是因为认为这将使得我们得以未雨绸缪。在价格消化了，我们所归结出的因素，以前只要抢先进场，完成布局之后，就可以躺在床上喝着真奶。等待所分析的因素发酵成为利润。但事实恰恰相反，新闻通常总是滞后于价格，价格通常早已消化预期。早在你看到新闻，听完法说会看完某个财经名嘴的分析，然后将片段的不完整的资讯。经过未经训练的分析，流程得出可能偏颇不可靠的结论。以前多空双方，我指的是那些养了一堆数学家。资料科学家消息，灵通的产业分析师的机构早车都已经事先的充分的采取能够最大化自身效用的行动。在这方面，我们是没有领先他们的机会的。起跑点不平衡，工具也不平衡，资金规模也不平衡，最后的胜率必然会很低。因此，其实新闻如何并不是重点。重点是价格如何在事前还事后呈现，对新闻的反应。为什么？因为无论利好利空好消息，坏消息，都需要透过真金白银的投票订单的真实交投。最后呈现在价格上才算数。不止这样，一旦涉及真实的买卖，那价格就是无延迟的瞬间呈现的。也没有机构可以隐藏自己买卖的踪迹。就这个角度来说，读同样的图表，享有同样的资讯，你才有跟机构平起平坐的可能性。而这些交投的结果，如果事前price in的太低，那即使后续有糟糕的消息释出市场，依然可能骤涨。因为糟糕的消息相比前面太低的price in似乎也没有那么不乐观。而如果price in的太高，那即使后续有极好的消息试出。也可能因为不如预期的好，导致市场依然急跌。遂此，我们很难为价格的涨跌在事前或事后找到可以证成或证伪的基本分析原因。即使可解释，听上去有些道理，你也很难证明这是基于这ABC原因，而非XYZ原因。难道真的一点Y原因的影响都没有吗？有没有可能存在我们都没有考量到的甲原因乙原因呢？我们无法确知，这是基本分析的盲点之一。另外一个原因是同时采用技术分析和基本分析来为你的交易做决策。很可能出现矛盾的情况。比如你基于对利率政策和产业消息的分析认为，日经二二五指数难以维持如此强劲的多头趋势。接下来应该要开始走空。但另一方面，在图表上，它却仍在强劲的多头极速里，还有非常合理的上涨空间。那这时候你该或者你敢空进去吗？反过来说，基于对价格行为分析，你觉得棉花期货此处有个显著的熊旗，从其进一步引发下跌。测试前波段点的可能性很高。但听完你的业者朋友谈及他的业内观察，你又觉得可能前景蛮好，似乎能够止跌回升。那这时候到底该听技术分析还是基本分析的意见呢？有时候两边的分析共振，做进去赚了钱，你便觉得这样的方法有用。但有时候给出了相反的行动指示，你却打结或者偏食的只听信部分资讯。那你决策的稳定性又何在呢？所以，基于刚刚提到的，既然新闻时常滞后于价格，那么基本分析因素也当然常常滞后于价格。参考价值也必将打下折扣。当价格从大型顶部开始反转下跌。基本分析所提供的看涨理由依然可能相当充分。而当价格从大型底部开始反转上涨，基本分析所提供的看跌理由依然可能言之凿凿。结合技术分析与基本分析进行决策，很多时候不过是添麻烦给自己。所以此我只建议遵循图表进行决策。基本分析或许能够在更长的时间跨度上决定价格要前去的目的地。但我们是做交易，不是投资产品的价格波动，如何呈现，这更取决于短时间内的多空竞合。这也就是说，技术分析所决定的是价格抵达目的地的路径与速率。图表已经把多空所有的买进卖出都呈现出来了。谁赢了？谁输了？将来怎么走会更符合几率？你光看图表就能够有正确的判断。所以请尽可能去芜存菁，将精力放置在对少量真正有用的东西进行探究，才更有机会放大你的获利。","pid":"p219"},{"t":"para","text":"说到图表，大家最熟悉的肯定是缘起自18世纪日本的蜡烛图。我们之所以常常称其为K线。是直接取自日文对挂线，也就是隔线的读法。我想你一定知道这种对于价格的记录形式，涵盖了开盘价，最高价，最低价和收盘价四项资讯。而其中开与收之间的这段距离，我们以具有宽度的方块记录之称，其为蜡烛的实体。而实体与最高价，最低价之间的段落，则是所谓的影线。","pid":"p220"},{"t":"para","text":"很多人会将它写成引性的引，这是不对的。实体与影线的关系，就字义来看，这是身体和影子一实一虚。价格上涨到过那里，但又收回来，那就是虚的就像影子一样，所以才这么得名。而如果是引线的话，实体就不是实体，而是炸弹了，这没有什么道理。所以补充这个小知识，给大家知道别搞错了，会显得外行。那或许你也好奇，价格难道只有K线一种表述方式吗？我看确定六上面提供了很多选择，国外有不少遭遇者使用竹截图，那样有什么不好？哦，当然不止一种动，其他的也没有什么不可以教育者可以选择最适合自己的。只不过蜡烛图有它的好处。什么好处呢？好处在于实体跟影线的差异，你可以很明显的看出来。光是根据影线与实体部分的样态，你撇一眼就可以很直观的得知是哪一方在这根K线的时间范畴内。主宰了价格运动的方向，以及它主导的程度如何。比如最左边这根K线，它的实体长，影线短。代表在它上涨的过程中，基本上是多头取得了压倒性的胜利。双方的共识就是，价格应当进一步上涨。但下一根虽然多头，仍然最终控制的行情形成阳线。但中间有过更多的拉锯，对吧？看看下影线这么长，代表可能有过一瞬间是空头取得了优势，曾经是一根饱满的实体阴线。只不过最后还是多头反败为胜了。那在下一根就没有什么多头胜利的迹象可言了。K线收出很长的上下影线，这同样代表犹豫和竞争。第四根则完全反过来换成空头获胜。这是因为这样显而易见的视觉效果，我们说蜡烛图比起其他的绘图方式更容易看出动能的消长。而我们也可以更方便的运用这项有用的资讯。还有一件重要的事值得一提，那就是理论上如果给你一张空有走势的图表，你是没有办法自己通灵出其他资讯的。包括这是什么市场的，什么品种，什么时间级别的图表？这揭示了一个你可能听过的理论意义，那就是所有市场都是“碎型的”。你在左边这张十分钟级别的图表上看到的价格走势，在另一张一周级别的图表上也能看出类似的特征。多空永远都在较劲，永远以影线和实体表达动能展现的程度。永远以一根又一根的K线去记录最靠近当下的竞合结果。因此，价格行为的分析方法对任何时间级别，任何商品的图表都理论适用。多空互动的模式不会因为时空而有本质上的太大不同。除非你看到图表上显示的是大量的十字星，那这就比较特定了。这通常是非常小时间级别或者成交量很低迷的图表才有的特征。交易者千万要避免在这样的环境下交易，这既无利可图，你还可能被糟糕流动性所困住。那么，这又可以导向另一个重要的话题，对于交易者来说，在什么时间级别上交易最好呢？我自己会提供以下几点建议。首先等你最后都学会，并且尝试开始以交易为生了。那在得以持续盈利的最少时间级别图表上进行交易，会是一个好的做法。比如说我自己个人的答案就是五分钟级别图表。为什么呢？如果更小，那我判断的时间就会太有限。在下单的界面上部署入场止损止盈订单的时间就会非常有限，一旦太忙会很容易失误。就算一时半刻不失误交易，整天下来也可能精神偶尔涣散掉，那我就没有办法稳定的拿出最好的表现。很多教学鼓吹执行手动高频交易。嗯，首先那根本就不算高频。这跟毫秒微秒级别的算法完全不是同一回事。再来就像刚刚说的，采用30秒一分钟级别图表，太难进行高品质的连续决策了。甚至连喝口水去洗手间的余域都没有，这就使盈利与长久持续的操作变得几无可能。所以不要太小，以能够稳定发挥为主。即使你是全职五分钟，最低三分钟，那也够小了。但怎么样呢？也不要太大。当然，这随着每个人的条件不同，也没有一定的标准。以我没有正职为例，交易就是我的主业，所以时间上的宽裕是我的优势。如果像这样的全职身份，我却看着日线级别图表进行交易。而一年只出现15次符合系统规则的交易机会。这样一来，一旦运气不好，大部分结果都是止损的，那该怎么办呢？我的收入就糟了个大糕。就这个层面上来看，尽可能在可负担的范围内去增加交易频率，会更好的防止盈利效率折损。也更方便统计优势，能够正常发挥。大数法则要有一定的样本数才能发挥作用。复利也要有充足的招投基数去滚雪球。所以不要太小，也不要太大。","pid":"p221"},{"t":"para","text":"我想多数人的现况可能是上班，上课之余兼职做，将来才逐步考虑靠近全职。那这种条件下，像我一样追求五分钟级别的交易，就没有可行性可言。所以更好的做法是就看你多久方便看盘一次去选择，以一小时两小时为单位的间隔。这样就可以了。如果担心交易机会不够多，那你可以量力而为的多兼顾几个相关性比较低的品种。这种方式也可以比较健康的提升交易频率。同样不要太多有其他事业要兼顾的话，顶多三到五个可能就够你忙了。总而言之，交易那个你得以持续盈利的最少时间级别图表，你就不会做的太痛苦。并且盈利效率较高，经验累积也会比较快。","pid":"p222"},{"t":"para","text":"另一个跟图表的时间级别有关的话题，我需不需要看看更大时间级别的图表，然后再回到小时间级别图表上入场呢？我知道，应该会有很多人这么做。但我的建议是，不要同样有几个原因。首先，你的时间精力都很宝贵。越多资讯加进来，需要你去处理，你就越可能混乱。最后可能做出差强人意的决定，导致亏损。在接下来其他单元中的讲解，你都将能够感受到交易者其实只要专注在近期的80到100根K线的尺度上。所有重点的决策，你就都照顾得到了。看越远以前的K线，它对你当前时间级别的价格走势，影响力就越低。举一个极端一点的例子。如果你是一个五分钟级别的交易者。上星期的1000多根，以前的K线与你当下的行情能有什么关系呢？没有。但一旦你将时间级别往上切到小时级别。这些原本影响不到你的资讯，就会通通介入进来，造成你的混乱。第二个理由，有经验的交易者应该知道，其实那些会真正伤筋动骨的重大亏损。常常是来源于交易者拒绝承受计划中的止损。但好笑的是，这种逾矩的行为常常就源自于交易者的多时间级别决策。为什么呢？假设你在一小时级别图表上做了交易，但在此前看了四小时日线甚至周线级别的图表。试图找到更大时间级别的趋势，方向之类的。好一连串的分析做进去做多。结果不久之后，马上就要碰到止损。那这时候你可能就会开始凹单。这是因为你觉得明明更大时间级别的图表，上面就是上升趋势，做多理应要赚钱。所以你没有办法摸摸鼻子，亏损离开。这时候你可能就会产生其他想法。比如想着好，那我就以日线的原则来持仓好了。反正刚刚看到的是日线周线级别的趋势嘛，甚至再加近基本分析消息面的理由。开始说服自己。好，这是投资，我要沉得住气，成功是熬出来的。是这样吗？才怪呢，这就是我刚刚说到的额外的资讯，会导致你混淆的意思。典型的聪明反被聪明误。因此，时间级别切来换去常常是弊大于利。这种习惯将使一名交易者丧失专注。瘫痪其执行和管理其他交易的能力。最后一个理由，虽然这样的观点也没错，五分钟级别的回调时常结束在15分钟，30分钟，60分钟。甚至日线以上级别图表的重要价位上。但是这些价位相对是很稀少的。不值得交易者花费时间冒分神的风险等待这些点位中，而错过太多五分钟级别的交易机会。综合以上，我会说你就专注在单一时间级别就好。眼下就盯着这跟你比较有关系的80到100根K线即可。人家常说交易要化繁为简。这就是该简洁，该利落的时候。","pid":"p223"}],"wcount":6973},{"id":"l02B","title":"第B段　当我们在谈论图表时，我们在谈论什么","blocks":[{"t":"para","text":"L02B 当我们在谈论图表时，我们在谈论什么","pid":"p224"},{"t":"para","text":"接下来，我们正式进入如何读图的环节。拿到一张任意图表，你通常会怎么下手呢？无论你原先的习惯是什么，请切记我接下来说的话。交易现场最重要的是判断两件事，脉络与动能。什么叫脉络？原文是context这个字。你可以理解为上下文或者市场背景。也就是说，现在往后的价格运动将如何展开，将高度取决于市场当前处在什么状态。是处在趋势中还是区间中？有趋势可以让我们去跟随吗？还是市场其实处在无趋势的状态，我们应该认为价格正处于均衡的震荡里。所以应该低买高卖。以及价格运动的方向，上面有没有潜在的支撑阻力去阻断运行？这些方向上的判断会完全影响后续的操作结果。所以要想建仓判读脉络是第一点。了解市场正处在什么样的状态是第一点。随着接下来所有单元的慢慢展开，你会详细的经熟这个庞大的技能体系。请放心，一步步跟着理解就可以了。","pid":"p225"},{"t":"para","text":"再来同等重要的是判读动能。什么是动能呢？如果你还记得前一节我们在介绍K线实体和影线的时候讲过。这种图表类型最方便的就在于让你判断动能。所谓的动能，就是价格运动的强度。比如，当我们说当前出现了一个强劲的突破行情。这个句子里的强劲，就是我们对于动能的描述词。而这与K线的实体大小，运动的幅度，斜率，连续性等方面都有关系。如果动能强劲，那就倾向还有后续我们可以试图跟随它。如果动能孱弱，那就预期反转更有可能发生。这时候就有做反手交易的理由。对于任何一个交易者，我们说技术好或不好，这是看你整体判断脉络与动能的能力。结合整张图表来评估价格运动的效用与意义的能力。我会逐步教会你，直到你能够判读任何的行情与情境。","pid":"p226"},{"t":"para","text":"那今天我们从最基础的学起，阅读单一根K线的方法。就如刚刚稍微提过的一根K线的实体与影线的比例关系，能够为我们揭示动能的强弱。也因此，实际上我们可以把所有K线都简单的进行二分。实体长于影线的我们称它为趋势K线。代表在这根K线所标记的时间尺度中，有一方宰制了价格运动的方向。而在这段时间里，价格进行的是趋势运动。极端一点的例子。比如，这是一根五分钟级别的大阳线。那在这五分钟的时间内，多头大力掌控了行情。如果你从K线生成的那一瞬间开始盯着这根K线的行程，直到收盘。那他应该总之是个空头疲弱的五分钟。虽然光看K线外观，我们无法得知内部的价格运动轨迹，我现在所显示的两种情况都是可能的。但哪一个都好？结果看来就都是多头击退了空头。差别只在过程是顺畅，渐进的，还是反复但最后一鼓作气的。殊途同归都是多头展现了更强的动能，并且能够控制K线，最终收成这个对多方有利的模样。那相对的影线长于实体，则是区间K线。或者你可以称它为非趋势K线，称它为十字星。同样，虽然我们没有办法确切知道里头实际的价格运动轨迹。但就结果看来，我们都能够断定，这是一个多空动能抵触双方互不相让的状态。所以虽然在上涨的过程中，它有过一瞬间是一根趋势阳线，但最终又被空方的努力压了回来。又有过一瞬间是趋势阴线。但同样没能维持这种优势，直到收线，多方又将价格提了起来。在这根K线所代表的时间尺度中，没有任何一方可以控制行情。价格进行的是一个区间的震荡，因此我们称它为区间K线。你一定想问，区分这个不难啊，但区分这两者有什么实际用途吗？有的，而且至关重要。比如，将来在建仓的时候，你可能会选择使用某种突破入场的策略。在价格突破某一个重要的水平位置以后，选择追进。理由是突破使你认为均衡的状态已经暂时结束。接下来会是短暂但运动遥远的失衡，可能带来大量的利润。这时候突破的力度就是关键。如果突破本身动能强劲而后跟随的K线也是趋势K线。那就代表多空共识坚定，价格着实要大力出脱的可能性，就相应的提升了。不过，要是突破后心急追进，收线之际原本扎实的趋势K线却收成了十字星。那这代表什么呢？代表其实突破方占据优势的时间非常短暂，立刻被逆势的力量给退回。这时候突破成功，走出遥远行情的几率就会大大减低。那相反的，如果你执行的是某种看衰突破成功的反转交易。那你就会乐见背靠着支撑/阻力出现的区间K线。为什么？因为这代表突破的尝试得不到延续，价格接下来更有可能往利于你的方向前进。所以也再次呼应刚刚说到的。对脉络，对动能的判断是最重要的。在趋势的突破交易中，你希望看到顺畅的动能。在区间中，在背靠支撑阻力入场的场合，你则希望看到朝外突破的动能没有办法成功续航。只有扎实的把这两个基本功练会，你才能够在机构竞争的夹缝中稳定的赚取利润。","pid":"p227"},{"t":"para","text":"不过，势必也有一些暧昧不明的情况。比如我现在标记出的这两根K线，左边的实体确实比影线长。但整体运动的距离不远。说它是很强劲的趋势K线嘛，总觉得有点别扭。或者右边这根K线虽然长度可观，但实体跟影线似乎一样长。完全是介于趋势K线和区间K线的正中间。如果对于一根K线究竟属于何者感到模棱两可，那该怎么办呢？这种时候就更应该结合脉络来看待。虽然前者运动距离较短，但它是嵌于一段连续的多头运行之间的。这时候，它就更像是多头动能的延续。所以说它是趋势K线还是稍微有道理一点，你也应该对后续的行情采取延续的观点。而另一根长实体，长影线的这一根，则似乎是生长在某种区间或者宽幅通道的环境里头。所以考虑到脉络状态倾向维持下去。对吧，这是市场的惯性。上个单元，我们花了很多力气讲这件事。那么，我们就着重他的区间性格会更合适。同时，你可以向前看，向后看。发现多空动能似乎一直在转换，没有什么连续性。而出现这根长阴线之后，后头跟进的也不是阴线，所以更不像是趋势状态了。总体说起来，如果你对一根K线究竟属于趋势K线，还是区间K线感到模棱两可，选不出来。那你就该结合脉络去做出符合市场背景的判断。有了对于单根K线如何判读的基础理解后，我们也趁这个单元的机会介绍一下，之后会常常出现的基本术语。常常用到的K线组合。比如你经常听到阿尔布鲁克斯或在讲建仓形态这个词。它跟我们平时理解的形态学的形态是不一样的东西。杯柄形态那种形态对应的英文单词汇是pattern。通常讲的是10几，20根K线排列出的比较大的结构。但建仓形态则是setup。其实我最初在看中文版翻译的时候，心想建仓形态是什么？翻译四个字太长了吧？而且这跟setup这个词有什么关系？原意不是应该直观的翻成某种准备或者组合安排之类的吗？但后来想想之后就比较理解了。setup是建仓以前会显现的由一根或多根K线组成的某种小型形态。让交易者相信，可以据此下单，并且有较高的机会实现盈利。所以好像应该取的是它那个比较偏门的意思。在球类运动中，你传球给你的队友，让你的队友有机会得分。这个传球助攻的动作也可以叫做setup。又或者在撞球的情境里，有些球所处的地方就恰巧是让玩家可以轻易把球击入带的位置。这也可以叫做setup。哦，这样我就想透了，套回交易就是那个让你可以入场盈利的事前迹象。这些K线组合就是为你托球的那个队友替你找好轻松省力的位置，好让你可以盈利得分。这样一来，翻成建仓形态好像就可以理解了，而且也似乎难以再更简洁。毕竟它在某种意义上也是形态，也是某种集体行动的表征。如果你担心跟pattern搞混，称它为建仓设置也是可以的。比如，在一个双重底的牛旗中，整个双重底是pattern。但setup是位于右峰尖端，背靠左峰的这一组K线。这么说明你应该更能理解它们之间大小次序的关系。所以我们已经知道建仓形态是由一根或多根K线组成的组合，让交易者相信可以据此下单，并且有较高的机会实现盈利。那么，他们应该有哪些要素组合在一起呢？介绍一下内容物是——讯号K线，入场K线，以及不真正算在建仓形态内，但是紧跟在建仓形态之后的跟进K线。同样以刚刚这个上升趋势中双重底牛旗的右峰为例。讯号K线是为交易者指出建仓形态的K线。这个长十字星触碰支撑没有收成趋势阴线反而是收针起来，让你见到这个长下影线。在这个脉络里，就是空头无法有效推动价格下破成功。后续可能要么在这里继续徘徊，要么开始上涨，延续前面的上升趋势。所以这颗十字星就变成了通知你后续可能反转走高的K线。他发出了做多的进场讯号。这么一来，你眼看后面确实收了一根阳线，而且还是光头的趋势阳线，代表多头，直到收线的前一刻都抢着入场。那你就也于是跟着入场了。你所买进开始持仓的K线就是入场K线。那入场K线的后一根K线就是跟进K线。我在这边把它用灰字显示，意思是它其实不算是建仓形态的一环。你真正靠讯号看入场K线，这已经建好仓了。这只是作为后续的确认所用。以这个例子为例，跟进的同样是趋势阳线。那我们会说跟进的很不错。它往对你持仓有力的方向收出强劲的实体。后续还有上涨的可能性就提升许多。那如果紧跟的不是趋势阳线，而是十字星，甚至是趋势阴线呢？用阿尔布鲁克斯的话来说就是糟糕的跟进。行情接下来如你意的可能性就随之降低。搞懂以上您就认识了一个建仓形态中包含的组合讯号，入场与此后的跟进K线分别起到提示你交易机会触发进场。与提供确认的作用。在某些情况下，讯号K线可能跟入场K线是同一根。比如你交易的是某一种突破追进。那当重要波段点被突破的瞬间，你就被提示要接着入场。这就是市场向你发出的讯号。但一旦它在收线之际成为了饱满的趋势K线。让你认为这不只是信号发出，你还打算在收线瞬间同时入场？那它就也同时变成了入场K线。又或者你正等待某一个阻力被触碰以后，你要在前一根阳线被下破时入场做空。那你偶尔会遇到价格，先触碰到水平阻力，向你发出建仓讯号后，又旋即下破它的前一根K线。触发你的停止订单的情况。那发出讯号跟触发入场，就又发生在同一根K线。这是可以，也是合理的，你要理解。好的，太妃，现在我理解了一个建仓形态，包含讯号K线和入场K线。他们可能是同一根，而之后还有让我确认情况是否对我有利的跟进K线。那你可不可以告诉我有没有什么关于建仓形态的总体原则，需要先记起来。只要听懂将来，就可能挑到数学优势较高的交易机会呢。哎，还真的有。接下来向你介绍两点。第一点，讯号K线最好跟你建仓的方向同向。这不难理解，我们来举一些例子。比如你想做多，而且做的是突破追近那讯号K线，最好就是一根阳线。你可以想象徒步阻力的，一个是饱满的趋势阳线，一个是长影线的十字星，哪一个更好呢？当然是前者。即使你选择更安全的入场，选择在突破K线高点，继续被上破以后才触发停止订单入场。就这点来看，两者都是满足条件的。但是前者依然胜率更高。这是因为多头的动能，请注意，我讲到动能这个词了。动能更强，连续性也更好。逆势方的力量，也就是我们常说的卖压在前面这个情况里没有展示出来。不过在后面则有可以说是直接在起跑点上就先输了一次。那你可以想见，后续多头要走的顺畅，一定是在前面这个情境下更有可能。再举一个例子，背靠着支撑阻力入场的情况。如果要背靠支撑在讯号K线被上破时，用停止订单做多。我们同样希望讯号K线是阳线，而不是阴线或十字星。最左边这个情境，虽然后续也接着阳线。但在触碰支撑时，多头还没有透过收出阳线来证明自己已经有初步的尝试。中间这个也一样，多空还在交战之中。所以，即使后续有可能确实被阳线上破，在这里挂停止订单入场仍然是稍有危险的。你怎么会知道会不会向上刺一下，触发你的入场之后，价格就继续延续空头的力量？或者陷入纠结的区间之中呢？遂此，先有多头占领讯号K线，证明自己能在这根K线的时间尺度中掌握价格运动的方向。是最好的情况。这么一来，以停止订单入场，做多就会更加安心。希望你记得当要做多请倾向，以阳线为讯号K线。当要做空，则以阴线为讯号K线。尤其当他执行各种各样的逆势交易时，交易者需要更强劲的朝向趋势，方向的讯号K线。来为你本来就相对不高的胜率增色。第二点，在脉络合一的情况下，反转K线常常是非常优质的信号K线。这时候又有新名词要带进来了。什么叫反转K线呢？反转K线就是对当前价格运行方向造成某种程度反转的K线。其实你刚刚已经遇过他们了。这种背靠支撑阻力的建仓形态，使用的都是这些反转K线。比如这就是当价格下落到支撑处，原本向下的运动，因为接触到不属于横线附近的买入订单。所以使得价格有跌转升。这就是原先价格运行的方向被反转的意思。在这根长下影线的阳线内部。可以想象价格大概是这样去走的。在这个局部发生了一次完整的反转，多头击退了空头所有的努力。当然，这种局部的小型反转也有不少的变体。","pid":"p228"},{"t":"img","src":"assets/img/l02B_018.webp","ilabel":"2-1","icap":"L02　当我们在谈论图表时，我们在谈论什么","fid":"fig18","ctx":[{"t":"那今天我们从最基础的学起，阅读单一根K线的方法。就如刚刚稍微提过的一根K线的实体与影线的比例关系，能够为我们揭示动能的强弱。也因此，实际上我们可以把所有K线都简单的进行二分。实体长于影线的我们称它为趋势K线。代表在这根K线所标记的时间尺度中，有一方宰制了价格运动的方向。而在这段时间里，价格进行的是趋势运动。极端一点的例子。比如，这是一根五分钟级别的大阳线。那在这五分钟的时间内，多头大力掌控了行情。如果你从K线生成的那一瞬间开始盯着这根K线的行程，直到收盘。那他应该总之是个空头疲弱的五分钟。虽然光看K线外观，我们无法得知内部的价格运动轨迹，我现在所显示的两种情况都是可能的。但哪一个都好？结果看来就都是多头击退了空头。差别只在过程是顺畅，渐进的，还是反复但最后一鼓作气的。殊途同归都是多头展现了更强的动能，并且能够控制K线，最终收成这个对多方有利的模样。那相对的影线长于实体，则是区间K线。或者你可以称它为非趋势K线，称它为十字星。同样，虽然我们没有办法确切知道里头实际的价格运动轨迹。但就结果看来，我们都能够断定，这是一个多空动能抵触双方互不相让的状态。所以虽然在上涨的过程中，它有过一瞬间是一根趋势阳线，但最终又被空方的努力压了回来。又有过一瞬间是趋势阴线。但同样没能维持这种优势，直到收线，多方又将价格提了起来。在这根K线所代表的时间尺度中，没有任何一方可以控制行情。价格进行的是一个区间的震荡，因此我们称它为区间K线。你一定想问，区分这个不难啊，但区分这两者有什么实际用途吗？有的，而且至关重要。比如，将来在建仓的时候，你可能会选择使用某种突破入场的策略。在价格突破某一个重要的水平位置以后，选择追进。理由是突破使你认为均衡的状态已经暂时结束。接下来会是短暂但运动遥远的失衡，可能带来大量的利润。这时候突破的力度就是关键。如果突破本身动能强劲而后跟随的K线也是趋势K线。那就代表多空共识坚定，价格着实要大力出脱的可能性，就相应的提升了。不过，要是突破后心急追进，收线之际原本扎实的趋势K线却收成了十字星。那这代表什么呢？代表其实突破方占据优势的时间非常短暂，立刻被逆势的力量给退回。这时候突破成功，走出遥远行情的几率就会大大减低。那相反的，如果你执行的是某种看衰突破成功的反转交易。那你就会乐见背靠着支撑/阻力出现的区间K线。为什么？因为这代表突破的尝试得不到延续，价格接下来更有可能往利于你的方向前进。所以也再次呼应刚刚说到的。对脉络，对动能的判断是最重要的。在趋势的突破交易中，你希望看到顺畅的动能。在区间中，在背靠支撑阻力入场的场合，你则希望看到朝外突破的动能没有办法成功续航。只有扎实的把这两个基本功练会，你才能够在机构竞争的夹缝中稳定的赚取利润。","p":"p227"},{"t":"不过，势必也有一些暧昧不明的情况。比如我现在标记出的这两根K线，左边的实体确实比影线长。但整体运动的距离不远。说它是很强劲的趋势K线嘛，总觉得有点别扭。或者右边这根K线虽然长度可观，但实体跟影线似乎一样长。完全是介于趋势K线和区间K线的正中间。如果对于一根K线究竟属于何者感到模棱两可，那该怎么办呢？这种时候就更应该结合脉络来看待。虽然前者运动距离较短，但它是嵌于一段连续的多头运行之间的。这时候，它就更像是多头动能的延续。所以说它是趋势K线还是稍微有道理一点，你也应该对后续的行情采取延续的观点。而另一根长实体，长影线的这一根，则似乎是生长在某种区间或者宽幅通道的环境里头。所以考虑到脉络状态倾向维持下去。对吧，这是市场的惯性。上个单元，我们花了很多力气讲这件事。那么，我们就着重他的区间性格会更合适。同时，你可以向前看，向后看。发现多空动能似乎一直在转换，没有什么连续性。而出现这根长阴线之后，后头跟进的也不是阴线，所以更不像是趋势状态了。总体说起来，如果你对一根K线究竟属于趋势K线，还是区间K线感到模棱两可，选不出来。那你就该结合脉络去做出符合市场背景的判断。有了对于单根K线如何判读的基础理解后，我们也趁这个单元的机会介绍一下，之后会常常出现的基本术语。常常用到的K线组合。比如你经常听到阿尔布鲁克斯或在讲建仓形态这个词。它跟我们平时理解的形态学的形态是不一样的东西。杯柄形态那种形态对应的英文单词汇是pattern。通常讲的是10几，20根K线排列出的比较大的结构。但建仓形态则是setup。其实我最初在看中文版翻译的时候，心想建仓形态是什么？翻译四个字太长了吧？而且这跟setup这个词有什么关系？原意不是应该直观的翻成某种准备或者组合安排之类的吗？但后来想想之后就比较理解了。setup是建仓以前会显现的由一根或多根K线组成的某种小型形态。让交易者相信，可以据此下单，并且有较高的机会实现盈利。所以好像应该取的是它那个比较偏门的意思。在球类运动中，你传球给你的队友，让你的队友有机会得分。这个传球助攻的动作也可以叫做setup。又或者在撞球的情境里，有些球所处的地方就恰巧是让玩家可以轻易把球击入带的位置。这也可以叫做setup。哦，这样我就想透了，套回交易就是那个让你可以入场盈利的事前迹象。这些K线组合就是为你托球的那个队友替你找好轻松省力的位置，好让你可以盈利得分。这样一来，翻成建仓形态好像就可以理解了，而且也似乎难以再更简洁。毕竟它在某种意义上也是形态，也是某种集体行动的表征。如果你担心跟pattern搞混，称它为建仓设置也是可以的。比如，在一个双重底的牛旗中，整个双重底是pattern。但setup是位于右峰尖端，背靠左峰的这一组K线。这么说明你应该更能理解它们之间大小次序的关系。所以我们已经知道建仓形态是由一根或多根K线组成的组合，让交易者相信可以据此下单，并且有较高的机会实现盈利。那么，他们应该有哪些要素组合在一起呢？介绍一下内容物是——讯号K线，入场K线，以及不真正算在建仓形态内，但是紧跟在建仓形态之后的跟进K线。同样以刚刚这个上升趋势中双重底牛旗的右峰为例。讯号K线是为交易者指出建仓形态的K线。这个长十字星触碰支撑没有收成趋势阴线反而是收针起来，让你见到这个长下影线。在这个脉络里，就是空头无法有效推动价格下破成功。后续可能要么在这里继续徘徊，要么开始上涨，延续前面的上升趋势。所以这颗十字星就变成了通知你后续可能反转走高的K线。他发出了做多的进场讯号。这么一来，你眼看后面确实收了一根阳线，而且还是光头的趋势阳线，代表多头，直到收线的前一刻都抢着入场。那你就也于是跟着入场了。你所买进开始持仓的K线就是入场K线。那入场K线的后一根K线就是跟进K线。我在这边把它用灰字显示，意思是它其实不算是建仓形态的一环。你真正靠讯号看入场K线，这已经建好仓了。这只是作为后续的确认所用。以这个例子为例，跟进的同样是趋势阳线。那我们会说跟进的很不错。它往对你持仓有力的方向收出强劲的实体。后续还有上涨的可能性就提升许多。那如果紧跟的不是趋势阳线，而是十字星，甚至是趋势阴线呢？用阿尔布鲁克斯的话来说就是糟糕的跟进。行情接下来如你意的可能性就随之降低。搞懂以上您就认识了一个建仓形态中包含的组合讯号，入场与此后的跟进K线分别起到提示你交易机会触发进场。与提供确认的作用。在某些情况下，讯号K线可能跟入场K线是同一根。比如你交易的是某一种突破追进。那当重要波段点被突破的瞬间，你就被提示要接着入场。这就是市场向你发出的讯号。但一旦它在收线之际成为了饱满的趋势K线。让你认为这不只是信号发出，你还打算在收线瞬间同时入场？那它就也同时变成了入场K线。又或者你正等待某一个阻力被触碰以后，你要在前一根阳线被下破时入场做空。那你偶尔会遇到价格，先触碰到水平阻力，向你发出建仓讯号后，又旋即下破它的前一根K线。触发你的停止订单的情况。那发出讯号跟触发入场，就又发生在同一根K线。这是可以，也是合理的，你要理解。好的，太妃，现在我理解了一个建仓形态，包含讯号K线和入场K线。他们可能是同一根，而之后还有让我确认情况是否对我有利的跟进K线。那你可不可以告诉我有没有什么关于建仓形态的总体原则，需要先记起来。只要听懂将来，就可能挑到数学优势较高的交易机会呢。哎，还真的有。接下来向你介绍两点。第一点，讯号K线最好跟你建仓的方向同向。这不难理解，我们来举一些例子。比如你想做多，而且做的是突破追近那讯号K线，最好就是一根阳线。你可以想象徒步阻力的，一个是饱满的趋势阳线，一个是长影线的十字星，哪一个更好呢？当然是前者。即使你选择更安全的入场，选择在突破K线高点，继续被上破以后才触发停止订单入场。就这点来看，两者都是满足条件的。但是前者依然胜率更高。这是因为多头的动能，请注意，我讲到动能这个词了。动能更强，连续性也更好。逆势方的力量，也就是我们常说的卖压在前面这个情况里没有展示出来。不过在后面则有可以说是直接在起跑点上就先输了一次。那你可以想见，后续多头要走的顺畅，一定是在前面这个情境下更有可能。再举一个例子，背靠着支撑阻力入场的情况。如果要背靠支撑在讯号K线被上破时，用停止订单做多。我们同样希望讯号K线是阳线，而不是阴线或十字星。最左边这个情境，虽然后续也接着阳线。但在触碰支撑时，多头还没有透过收出阳线来证明自己已经有初步的尝试。中间这个也一样，多空还在交战之中。所以，即使后续有可能确实被阳线上破，在这里挂停止订单入场仍然是稍有危险的。你怎么会知道会不会向上刺一下，触发你的入场之后，价格就继续延续空头的力量？或者陷入纠结的区间之中呢？遂此，先有多头占领讯号K线，证明自己能在这根K线的时间尺度中掌握价格运动的方向。是最好的情况。这么一来，以停止订单入场，做多就会更加安心。希望你记得当要做多请倾向，以阳线为讯号K线。当要做空，则以阴线为讯号K线。尤其当他执行各种各样的逆势交易时，交易者需要更强劲的朝向趋势，方向的讯号K线。来为你本来就相对不高的胜率增色。第二点，在脉络合一的情况下，反转K线常常是非常优质的信号K线。这时候又有新名词要带进来了。什么叫反转K线呢？反转K线就是对当前价格运行方向造成某种程度反转的K线。其实你刚刚已经遇过他们了。这种背靠支撑阻力的建仓形态，使用的都是这些反转K线。比如这就是当价格下落到支撑处，原本向下的运动，因为接触到不属于横线附近的买入订单。所以使得价格有跌转升。这就是原先价格运行的方向被反转的意思。在这根长下影线的阳线内部。可以想象价格大概是这样去走的。在这个局部发生了一次完整的反转，多头击退了空头所有的努力。当然，这种局部的小型反转也有不少的变体。","p":"p228"},{"t":"它可以用一根K线的时间完成，你可以慢一点花两根K线来反转。三根K线，四根K线也行。光看价格运动轨迹的话，其实它们的意义都是一样的，都是运行失去跟进，便利释放反超。所以反过来说，无论你当前所处的时间级别图表是什么，假设是一小时好了。只要你看到反转发生，你就都能够在某个时间级别图表上，比如向上切换的过程中。在两小时级别找到那个完美的反转K线。不过就像前面说到的，我不推荐你切来换去，交易者也实在不必非得将这个完美的单K线反转给找出来。只要能够正确的理解脉络，知道市场正在反转，并学会妥善应对即可。价格总之是先朝一个方向剧烈运动，然后再朝反方向剧烈运动。只要配合好的市场环境，那它就将成为最优质的，能带给你丰厚利润的一种讯号K线。提升胜率的秘诀来了，请在脑海里速速考虑一下优质的反转K线，最低的要求应该是什么？阿尔布鲁克斯的答案是多头反转K线，也就是如果你要以反转K线做多的话，最低要求是收线在K线的中点之上。","p":"p229"}]},{"t":"para","text":"它可以用一根K线的时间完成，你可以慢一点花两根K线来反转。三根K线，四根K线也行。光看价格运动轨迹的话，其实它们的意义都是一样的，都是运行失去跟进，便利释放反超。所以反过来说，无论你当前所处的时间级别图表是什么，假设是一小时好了。只要你看到反转发生，你就都能够在某个时间级别图表上，比如向上切换的过程中。在两小时级别找到那个完美的反转K线。不过就像前面说到的，我不推荐你切来换去，交易者也实在不必非得将这个完美的单K线反转给找出来。只要能够正确的理解脉络，知道市场正在反转，并学会妥善应对即可。价格总之是先朝一个方向剧烈运动，然后再朝反方向剧烈运动。只要配合好的市场环境，那它就将成为最优质的，能带给你丰厚利润的一种讯号K线。提升胜率的秘诀来了，请在脑海里速速考虑一下优质的反转K线，最低的要求应该是什么？阿尔布鲁克斯的答案是多头反转K线，也就是如果你要以反转K线做多的话，最低要求是收线在K线的中点之上。","pid":"p229"},{"t":"img","src":"assets/img/l02B_019.webp","ilabel":"2-2","icap":"L02　当我们在谈论图表时，我们在谈论什么","fid":"fig19","ctx":[{"t":"它可以用一根K线的时间完成，你可以慢一点花两根K线来反转。三根K线，四根K线也行。光看价格运动轨迹的话，其实它们的意义都是一样的，都是运行失去跟进，便利释放反超。所以反过来说，无论你当前所处的时间级别图表是什么，假设是一小时好了。只要你看到反转发生，你就都能够在某个时间级别图表上，比如向上切换的过程中。在两小时级别找到那个完美的反转K线。不过就像前面说到的，我不推荐你切来换去，交易者也实在不必非得将这个完美的单K线反转给找出来。只要能够正确的理解脉络，知道市场正在反转，并学会妥善应对即可。价格总之是先朝一个方向剧烈运动，然后再朝反方向剧烈运动。只要配合好的市场环境，那它就将成为最优质的，能带给你丰厚利润的一种讯号K线。提升胜率的秘诀来了，请在脑海里速速考虑一下优质的反转K线，最低的要求应该是什么？阿尔布鲁克斯的答案是多头反转K线，也就是如果你要以反转K线做多的话，最低要求是收线在K线的中点之上。","p":"p229"},{"t":"在我展示的三个情境里，b比a更好，c又比b更好。为什么？因为多头在c的情境里占有更大优势。它不仅将讯号K线扳成阳线收线，还收的很高。价格在逼近收线之际仍然不断的在抬升。这就是最有利于后续上涨的情况。那反过来说，当要做空，而且要以反转K线来做空。空头反转K线的最低要求是收线在K线的中点之下，这证明了卖方的宰制力。结合前一点就是做多的时候最好选阳线收线在中点之上最好。做空时最好选阴线收线在中点之下最好。不过我也仍然在补充两点，让你将来能把这项技术用得更好，同样都是有关于对脉络的强调。首先是无论单K线，双K线还是更多K线的反转组合，不是看到任何反转K线。行情就一定会因着它逆势大幅运行，你必须看他所在的位置。","p":"p230"}]},{"t":"para","text":"在我展示的三个情境里，b比a更好，c又比b更好。为什么？因为多头在c的情境里占有更大优势。它不仅将讯号K线扳成阳线收线，还收的很高。价格在逼近收线之际仍然不断的在抬升。这就是最有利于后续上涨的情况。那反过来说，当要做空，而且要以反转K线来做空。空头反转K线的最低要求是收线在K线的中点之下，这证明了卖方的宰制力。结合前一点就是做多的时候最好选阳线收线在中点之上最好。做空时最好选阴线收线在中点之下最好。不过我也仍然在补充两点，让你将来能把这项技术用得更好，同样都是有关于对脉络的强调。首先是无论单K线，双K线还是更多K线的反转组合，不是看到任何反转K线。行情就一定会因着它逆势大幅运行，你必须看他所在的位置。","pid":"p230"},{"t":"img","src":"assets/img/l02B_020.webp","ilabel":"2-3","icap":"L02　当我们在谈论图表时，我们在谈论什么","fid":"fig20","ctx":[{"t":"在我展示的三个情境里，b比a更好，c又比b更好。为什么？因为多头在c的情境里占有更大优势。它不仅将讯号K线扳成阳线收线，还收的很高。价格在逼近收线之际仍然不断的在抬升。这就是最有利于后续上涨的情况。那反过来说，当要做空，而且要以反转K线来做空。空头反转K线的最低要求是收线在K线的中点之下，这证明了卖方的宰制力。结合前一点就是做多的时候最好选阳线收线在中点之上最好。做空时最好选阴线收线在中点之下最好。不过我也仍然在补充两点，让你将来能把这项技术用得更好，同样都是有关于对脉络的强调。首先是无论单K线，双K线还是更多K线的反转组合，不是看到任何反转K线。行情就一定会因着它逆势大幅运行，你必须看他所在的位置。","p":"p230"},{"t":"比如在我显示的这个例子里，蓝色阴影区中存在着大量的反转K线。但它们都与自身之前的多根K线有严重的重叠。这代表什么呢？这代表价格是处于某种程度的区间之中。这里倾向震荡，正是为在市场本人觉得最舒服的那个均衡价位附近。也因此，这很难导引出有效的给予反转K线而产生的大幅运行。也不是说这些反转K线没有发挥反转效力，它本质上仍然是反转。只是说反转的限度很小，基本上就被局限在这个区间之中，而区间倾向突破失败。在这种市场处于震荡的窄幅区间脉络之中，任何一根反转K线都不应该用作讯号K线。","p":"p231"}]},{"t":"para","text":"比如在我显示的这个例子里，蓝色阴影区中存在着大量的反转K线。但它们都与自身之前的多根K线有严重的重叠。这代表什么呢？这代表价格是处于某种程度的区间之中。这里倾向震荡，正是为在市场本人觉得最舒服的那个均衡价位附近。也因此，这很难导引出有效的给予反转K线而产生的大幅运行。也不是说这些反转K线没有发挥反转效力，它本质上仍然是反转。只是说反转的限度很小，基本上就被局限在这个区间之中，而区间倾向突破失败。在这种市场处于震荡的窄幅区间脉络之中，任何一根反转K线都不应该用作讯号K线。","pid":"p231"},{"t":"img","src":"assets/img/l02B_021.webp","ilabel":"2-4","icap":"L02　当我们在谈论图表时，我们在谈论什么","fid":"fig21","ctx":[{"t":"比如在我显示的这个例子里，蓝色阴影区中存在着大量的反转K线。但它们都与自身之前的多根K线有严重的重叠。这代表什么呢？这代表价格是处于某种程度的区间之中。这里倾向震荡，正是为在市场本人觉得最舒服的那个均衡价位附近。也因此，这很难导引出有效的给予反转K线而产生的大幅运行。也不是说这些反转K线没有发挥反转效力，它本质上仍然是反转。只是说反转的限度很小，基本上就被局限在这个区间之中，而区间倾向突破失败。在这种市场处于震荡的窄幅区间脉络之中，任何一根反转K线都不应该用作讯号K线。","p":"p231"},{"t":"另一个则是担心你过度追求外观超级漂亮的讯号。虽然刚刚说多头反转K线的最低要求是收线在K线中点之上。但其实，只要脉络合宜，而且你经验累积足够，就算是阴线也或许无妨。反过来说，做空的时候遇到阳线，也可能是可以的。虽然胜率一定比同向同色的K线略低，但其实脉络才是比K线外观更重要的事情。毕竟我们也说所有K线的生成都是立基于大量的机构交投。那些不符合最高标准的讯号K线一定也有机构介入它，认为它能带来利润。所以只要脉络合宜，即使信号K线不够强劲，也可能有利可图。反而是最最最优质，同时又适配脉络的讯号K线，其实非常稀少。过度的斟酌与等待，将使交易者不断错过。","p":"p232"},{"t":"太妃，你刚刚又说最好标准高一点，现在又说其实要看情况，那到底是怎么样？提示，这点并不是有意要混淆，你只是担心矫枉过正的可能。先把它提出来，你记得有这件事，将来要撰写交易规则的时候就可以回头参考一下。再思考，看看怎么做对应来说最合适。尤其关于脉络的判断，后续课程会提供你坚实的基础。我们慢慢来，你一定能够学好。在这个阶段，你只要先清楚的晓得最优质的建仓形态，由合一的市场脉络，强劲的讯号与入场K线以及优质的跟进K线所组成即可。","p":"p233"},{"t":"在单元的最后，我们再介绍一些常见的K线组合，可以用作建仓形态。你要知道的分别有内包K线，外包K线以及各种内外包的混搭组合。","p":"p234"}]},{"t":"para","text":"另一个则是担心你过度追求外观超级漂亮的讯号。虽然刚刚说多头反转K线的最低要求是收线在K线中点之上。但其实，只要脉络合宜，而且你经验累积足够，就算是阴线也或许无妨。反过来说，做空的时候遇到阳线，也可能是可以的。虽然胜率一定比同向同色的K线略低，但其实脉络才是比K线外观更重要的事情。毕竟我们也说所有K线的生成都是立基于大量的机构交投。那些不符合最高标准的讯号K线一定也有机构介入它，认为它能带来利润。所以只要脉络合宜，即使信号K线不够强劲，也可能有利可图。反而是最最最优质，同时又适配脉络的讯号K线，其实非常稀少。过度的斟酌与等待，将使交易者不断错过。","pid":"p232"},{"t":"para","text":"太妃，你刚刚又说最好标准高一点，现在又说其实要看情况，那到底是怎么样？提示，这点并不是有意要混淆，你只是担心矫枉过正的可能。先把它提出来，你记得有这件事，将来要撰写交易规则的时候就可以回头参考一下。再思考，看看怎么做对应来说最合适。尤其关于脉络的判断，后续课程会提供你坚实的基础。我们慢慢来，你一定能够学好。在这个阶段，你只要先清楚的晓得最优质的建仓形态，由合一的市场脉络，强劲的讯号与入场K线以及优质的跟进K线所组成即可。","pid":"p233"},{"t":"para","text":"在单元的最后，我们再介绍一些常见的K线组合，可以用作建仓形态。你要知道的分别有内包K线，外包K线以及各种内外包的混搭组合。","pid":"p234"},{"t":"img","src":"assets/img/l02B_022.webp","ilabel":"2-5","icap":"L02　当我们在谈论图表时，我们在谈论什么","fid":"fig22","ctx":[{"t":"太妃，你刚刚又说最好标准高一点，现在又说其实要看情况，那到底是怎么样？提示，这点并不是有意要混淆，你只是担心矫枉过正的可能。先把它提出来，你记得有这件事，将来要撰写交易规则的时候就可以回头参考一下。再思考，看看怎么做对应来说最合适。尤其关于脉络的判断，后续课程会提供你坚实的基础。我们慢慢来，你一定能够学好。在这个阶段，你只要先清楚的晓得最优质的建仓形态，由合一的市场脉络，强劲的讯号与入场K线以及优质的跟进K线所组成即可。","p":"p233"},{"t":"在单元的最后，我们再介绍一些常见的K线组合，可以用作建仓形态。你要知道的分别有内包K线，外包K线以及各种内外包的混搭组合。","p":"p234"},{"t":"内包K线很好理解，你可能听过孕线。像妈妈带着小孩一样，把后一根K线包覆在前一根K线里头。我们取inside的字首I作为简称。你会常常看到阿尔布鲁克斯在各种场合以I代称内包K线。而如果要给严实的定义的话，内包K线就是相较于前一根K线，其高低点是内缩的K线。有一边仅持平也可以。所以最标准没有疑义的版本，我已经显示在页面上了。但右边这两种算是内包K线吗？中间这个也是有一边持平是可以接受的。但后面这个嗯，我自己不习惯把它算成内包。把它当做等长的两根K线即可。","p":"p235"},{"t":"相对的外包，则反过来，右边的K线比前一根更大。严实的定义同样是相较于前一根K线，其高低点是扩张的K线，有一边仅持平亦可。对于外包K线则取outside的自首O作为简称。而之所以有大小写的区分，其实只是内包比前一根K线小，外包则比较大，所以用小i和大O来表示。如果你觉得不统一，看着很烦，都大写或都小写也可以，没有一定要怎么样。掌握这些原则，以后你会发现，其实内包外包可以任意组合。","p":"p236"}]},{"t":"para","text":"内包K线很好理解，你可能听过孕线。像妈妈带着小孩一样，把后一根K线包覆在前一根K线里头。我们取inside的字首I作为简称。你会常常看到阿尔布鲁克斯在各种场合以I代称内包K线。而如果要给严实的定义的话，内包K线就是相较于前一根K线，其高低点是内缩的K线。有一边仅持平也可以。所以最标准没有疑义的版本，我已经显示在页面上了。但右边这两种算是内包K线吗？中间这个也是有一边持平是可以接受的。但后面这个嗯，我自己不习惯把它算成内包。把它当做等长的两根K线即可。","pid":"p235"},{"t":"para","text":"相对的外包，则反过来，右边的K线比前一根更大。严实的定义同样是相较于前一根K线，其高低点是扩张的K线，有一边仅持平亦可。对于外包K线则取outside的自首O作为简称。而之所以有大小写的区分，其实只是内包比前一根K线小，外包则比较大，所以用小i和大O来表示。如果你觉得不统一，看着很烦，都大写或都小写也可以，没有一定要怎么样。掌握这些原则，以后你会发现，其实内包外包可以任意组合。","pid":"p236"},{"t":"img","src":"assets/img/l02B_023.webp","ilabel":"2-6","icap":"L02　当我们在谈论图表时，我们在谈论什么","fid":"fig23","ctx":[{"t":"内包K线很好理解，你可能听过孕线。像妈妈带着小孩一样，把后一根K线包覆在前一根K线里头。我们取inside的字首I作为简称。你会常常看到阿尔布鲁克斯在各种场合以I代称内包K线。而如果要给严实的定义的话，内包K线就是相较于前一根K线，其高低点是内缩的K线。有一边仅持平也可以。所以最标准没有疑义的版本，我已经显示在页面上了。但右边这两种算是内包K线吗？中间这个也是有一边持平是可以接受的。但后面这个嗯，我自己不习惯把它算成内包。把它当做等长的两根K线即可。","p":"p235"},{"t":"相对的外包，则反过来，右边的K线比前一根更大。严实的定义同样是相较于前一根K线，其高低点是扩张的K线，有一边仅持平亦可。对于外包K线则取outside的自首O作为简称。而之所以有大小写的区分，其实只是内包比前一根K线小，外包则比较大，所以用小i和大O来表示。如果你觉得不统一，看着很烦，都大写或都小写也可以，没有一定要怎么样。掌握这些原则，以后你会发现，其实内包外包可以任意组合。","p":"p236"},{"t":"比如双内包，就是ii ,一根比一根小。双外包OO ,一根比一根大。有时候则有ioi先内包再外包再内包，就称它为内外内K线。要iooi也可以，可以有各种组合。听到这里，你可能疑惑又油然而生了。学这个要做什么呢？事实上，这些内与外的K线组合，他们时常可以看作某一种复合的讯号K线来判断。你还记得吧，前面说建仓形态可能有多根K线组在一起。那些为你指出建仓价值的，也可能是一个多K线的组合。同样以上升趋势中双重底的右峰为例。刚刚看到的都是明快简洁的反转K线，作为讯号的例子。但有时候会更纠结一点。它在与左峰同高的价位形成一个糊在一起的内外内组合。这怎么解呢？其实光看脉络，这还是一个可以介入的讯号。它所传达的意思就是在这个空头应该要展现强势，试图打压行情来造成趋势反转的关口。他们退缩了，没有收成非常粗涌的趋势阴线的本钱。这个纠结的小小区间，正是展现了空头的疲弱。所以它也是一个可以做多的讯号。只是这个讯号不如单K线反转漂亮，会让交易学习者有点困惑和退缩。那至于你要不要介入这样的行情？同样会等到你课程结束，着手撰写交易规则的阶段才决定。在这里介绍，这些同样只是告诉你有这种事情，也同时教会你使用各种以I跟O组成的术语。以后我说到或者你听阿尔布鲁克斯说到的时候不会一头雾水，这样就可以了。好了，这个单元讲了很多资讯，我们简单的统整一下，请不要跳过。一起来确认一下，你要把重点都记住。第一个部分讲的比较多，是关于价格行为，技术分析怎么用，为什么有用的相关议题。如今你知道价格行为就是图表上机构交投的痕迹。他们在图表上留下了不可磨灭的指纹脚印。我们透过对这些真金白银的投票结果进行分析来判断，多空竞合的状态。并接着推断，接下来更高几率发生的事情是什么？你一方面必须学会逐根阅读K线，不去忽略任何盘面透露给你的资讯。才能真正掌握理解机构的行踪。也一方面要切记不要混入对新闻，对基本分析的解读。这些通常只会扰乱你的判断，降低决策品质。除此之外，我们还进一步介绍了蜡烛图这种价格的表现形式。提示你如何找到适合自己的单一决策时间级别。将来你要逐步学会的，就是如何照顾好自己的赛场。在你所选的时间级别图表上，学会判读市场的脉络与动能。把这项技术精熟到极致，你就能够找到稳定盈利的方法。而蜡烛图的好处就是它的实体跟影线标示的很清楚。能让你知道价格运动的虚实，判断是哪一方控制的K线，以及其控制的程度如何？这就是我们说的动能。按照动能强弱又可以区分K线为趋势K线和区间K线。将K线组合在一起，理解也就能够读懂连续的市场动态。在特定的位置，特定的脉络中，我们会使用由讯号和入场K线组合成的建仓形态来协助我们得分。后续的跟进K线则起到了确认的作用。而在单元的最后，你还学会了判断讯号优劣的方式。学会了反转K线在什么情况下能用作优质的讯号？如此一来，你就已经大致学会了市场的语言基础。不过这样就完了吗？嗯，还没还差的有点远。如果拿语言作为比喻，今天的部分是最枯燥的ABC。掌握这些最最最基础的工具，以后你才能进入新世界的大门。下个单元我们进一步来谈突破。突破是做市场行动者最核心的行动意图，你一定要透彻了解。感谢收看，当我们谈论读图时我们在谈论什么？我们下个单元见。","p":"p237"}]},{"t":"para","text":"比如双内包，就是ii ,一根比一根小。双外包OO ,一根比一根大。有时候则有ioi先内包再外包再内包，就称它为内外内K线。要iooi也可以，可以有各种组合。听到这里，你可能疑惑又油然而生了。学这个要做什么呢？事实上，这些内与外的K线组合，他们时常可以看作某一种复合的讯号K线来判断。你还记得吧，前面说建仓形态可能有多根K线组在一起。那些为你指出建仓价值的，也可能是一个多K线的组合。同样以上升趋势中双重底的右峰为例。刚刚看到的都是明快简洁的反转K线，作为讯号的例子。但有时候会更纠结一点。它在与左峰同高的价位形成一个糊在一起的内外内组合。这怎么解呢？其实光看脉络，这还是一个可以介入的讯号。它所传达的意思就是在这个空头应该要展现强势，试图打压行情来造成趋势反转的关口。他们退缩了，没有收成非常粗涌的趋势阴线的本钱。这个纠结的小小区间，正是展现了空头的疲弱。所以它也是一个可以做多的讯号。只是这个讯号不如单K线反转漂亮，会让交易学习者有点困惑和退缩。那至于你要不要介入这样的行情？同样会等到你课程结束，着手撰写交易规则的阶段才决定。在这里介绍，这些同样只是告诉你有这种事情，也同时教会你使用各种以I跟O组成的术语。以后我说到或者你听阿尔布鲁克斯说到的时候不会一头雾水，这样就可以了。好了，这个单元讲了很多资讯，我们简单的统整一下，请不要跳过。一起来确认一下，你要把重点都记住。第一个部分讲的比较多，是关于价格行为，技术分析怎么用，为什么有用的相关议题。如今你知道价格行为就是图表上机构交投的痕迹。他们在图表上留下了不可磨灭的指纹脚印。我们透过对这些真金白银的投票结果进行分析来判断，多空竞合的状态。并接着推断，接下来更高几率发生的事情是什么？你一方面必须学会逐根阅读K线，不去忽略任何盘面透露给你的资讯。才能真正掌握理解机构的行踪。也一方面要切记不要混入对新闻，对基本分析的解读。这些通常只会扰乱你的判断，降低决策品质。除此之外，我们还进一步介绍了蜡烛图这种价格的表现形式。提示你如何找到适合自己的单一决策时间级别。将来你要逐步学会的，就是如何照顾好自己的赛场。在你所选的时间级别图表上，学会判读市场的脉络与动能。把这项技术精熟到极致，你就能够找到稳定盈利的方法。而蜡烛图的好处就是它的实体跟影线标示的很清楚。能让你知道价格运动的虚实，判断是哪一方控制的K线，以及其控制的程度如何？这就是我们说的动能。按照动能强弱又可以区分K线为趋势K线和区间K线。将K线组合在一起，理解也就能够读懂连续的市场动态。在特定的位置，特定的脉络中，我们会使用由讯号和入场K线组合成的建仓形态来协助我们得分。后续的跟进K线则起到了确认的作用。而在单元的最后，你还学会了判断讯号优劣的方式。学会了反转K线在什么情况下能用作优质的讯号？如此一来，你就已经大致学会了市场的语言基础。不过这样就完了吗？嗯，还没还差的有点远。如果拿语言作为比喻，今天的部分是最枯燥的ABC。掌握这些最最最基础的工具，以后你才能进入新世界的大门。下个单元我们进一步来谈突破。突破是做市场行动者最核心的行动意图，你一定要透彻了解。感谢收看，当我们谈论读图时我们在谈论什么？我们下个单元见。","pid":"p237"}],"wcount":8194}],"wcount":15167},{"id":"l03","icon":"L03","title":"L03　突破市场参与者的根本意图","blocks":[],"sections":[{"id":"l03A","title":"第A段　突破市场参与者的根本意图","blocks":[{"t":"para","text":"L03A 突破市场参与者的根本意图","pid":"p238"},{"t":"para","text":"我想大家应该多多少少都有些交易经验的。天天在市场里打滚，耳边最常听见，脑袋里最常想的概念是什么呢？立成一张清单的话，我猜突破应该名列前茅。","pid":"p239"},{"t":"img","src":"assets/img/l03A_024.webp","ilabel":"3-1","icap":"L03　突破市场参与者的根本意图","fid":"fig24","ctx":[{"t":"L03A 突破市场参与者的根本意图","p":"p238"},{"t":"我想大家应该多多少少都有些交易经验的。天天在市场里打滚，耳边最常听见，脑袋里最常想的概念是什么呢？立成一张清单的话，我猜突破应该名列前茅。","p":"p239"},{"t":"确实哦，突破非常重要。甚至如果你问我关于交易最像基石一般的观念是什么？精通哪一个概念能让你赚最多的钱？我应该一定会回答突破。不过，最该先厘清的不是怎样抓到突破，赚一段非常长远暴绩的利润。这不是能让你致富的重点，也不是这个单元要教你的。而是要在学理的层次先搞懂突破到底是什么？突破为什么是多空双方行动的核心意图。以及如何在图表上阅读与确认突破。突破以后市场倾向如何运动？如果你已经能够准确地回答这些问题，跟我接下来要说得如出一辙。那你应该已经是非常杰出的交易者。但如果还有困惑，甚至不晓得为什么这些议题是重要的。没关系，在这个单元里，我同样会确保为你打下坚实的基础。首先当然还是绕不开的定义问题，你很可能有过这种困惑。看各种书，听YouTube上的教学者，分析师在讲突破行情怎样怎样，可以赚多少钱？但那个突破指的到底是什么？虽然模糊地有个概念，但你说的突破，他说的突破，跟我心中以为我所理解的那个突破。到底一不一样呢？我们先来理清这一点。","p":"p240"}]},{"t":"para","text":"确实哦，突破非常重要。甚至如果你问我关于交易最像基石一般的观念是什么？精通哪一个概念能让你赚最多的钱？我应该一定会回答突破。不过，最该先厘清的不是怎样抓到突破，赚一段非常长远暴绩的利润。这不是能让你致富的重点，也不是这个单元要教你的。而是要在学理的层次先搞懂突破到底是什么？突破为什么是多空双方行动的核心意图。以及如何在图表上阅读与确认突破。突破以后市场倾向如何运动？如果你已经能够准确地回答这些问题，跟我接下来要说得如出一辙。那你应该已经是非常杰出的交易者。但如果还有困惑，甚至不晓得为什么这些议题是重要的。没关系，在这个单元里，我同样会确保为你打下坚实的基础。首先当然还是绕不开的定义问题，你很可能有过这种困惑。看各种书，听YouTube上的教学者，分析师在讲突破行情怎样怎样，可以赚多少钱？但那个突破指的到底是什么？虽然模糊地有个概念，但你说的突破，他说的突破，跟我心中以为我所理解的那个突破。到底一不一样呢？我们先来理清这一点。","pid":"p240"},{"t":"img","src":"assets/img/l03A_025.webp","ilabel":"3-2","icap":"L03　突破市场参与者的根本意图","fid":"fig25","ctx":[{"t":"确实哦，突破非常重要。甚至如果你问我关于交易最像基石一般的观念是什么？精通哪一个概念能让你赚最多的钱？我应该一定会回答突破。不过，最该先厘清的不是怎样抓到突破，赚一段非常长远暴绩的利润。这不是能让你致富的重点，也不是这个单元要教你的。而是要在学理的层次先搞懂突破到底是什么？突破为什么是多空双方行动的核心意图。以及如何在图表上阅读与确认突破。突破以后市场倾向如何运动？如果你已经能够准确地回答这些问题，跟我接下来要说得如出一辙。那你应该已经是非常杰出的交易者。但如果还有困惑，甚至不晓得为什么这些议题是重要的。没关系，在这个单元里，我同样会确保为你打下坚实的基础。首先当然还是绕不开的定义问题，你很可能有过这种困惑。看各种书，听YouTube上的教学者，分析师在讲突破行情怎样怎样，可以赚多少钱？但那个突破指的到底是什么？虽然模糊地有个概念，但你说的突破，他说的突破，跟我心中以为我所理解的那个突破。到底一不一样呢？我们先来理清这一点。","p":"p240"},{"t":"所谓的突破，你也可以称它为急速运动。以最严格的定义来说，是指由任何穿透支撑阻力的单根或多根趋势K线组成的趋势性运动。我们把重点再拎出来确认一次。条件之一是得要击穿某个支撑或阻力。再来，由趋势K线组成一根或多根都无所谓。结合上个单元，我们说的趋势K线是多空中有一方掌握了一段时间内的价格运动。所以突破跟价格朝某个方向倾倒是高度相关的概念。如果完全没有人占优势全然平手，影线很长，那多空就更趋近于势均力敌的状态，你可以把它归类为震荡，只是突破失败。这时候你可能会问，如果K线小小的算不上是明确的趋势K线，但它仍然有实体而且实体收在支撑阻力之外，那这能算成功的突破吗？勉强，确实有这种暧昧的状态。所以在条件上你不严格裁定趋势K线，那至少突破的这根K线得要收线在你所突破的对象之外。也就是那个支撑或阻力之外才好。以这些图表来说，橘色横线是价格突破的对象，这也就是所谓的突破点。","p":"p241"}]},{"t":"para","text":"所谓的突破，你也可以称它为急速运动。以最严格的定义来说，是指由任何穿透支撑阻力的单根或多根趋势K线组成的趋势性运动。我们把重点再拎出来确认一次。条件之一是得要击穿某个支撑或阻力。再来，由趋势K线组成一根或多根都无所谓。结合上个单元，我们说的趋势K线是多空中有一方掌握了一段时间内的价格运动。所以突破跟价格朝某个方向倾倒是高度相关的概念。如果完全没有人占优势全然平手，影线很长，那多空就更趋近于势均力敌的状态，你可以把它归类为震荡，只是突破失败。这时候你可能会问，如果K线小小的算不上是明确的趋势K线，但它仍然有实体而且实体收在支撑阻力之外，那这能算成功的突破吗？勉强，确实有这种暧昧的状态。所以在条件上你不严格裁定趋势K线，那至少突破的这根K线得要收线在你所突破的对象之外。也就是那个支撑或阻力之外才好。以这些图表来说，橘色横线是价格突破的对象，这也就是所谓的突破点。","pid":"p241"},{"t":"img","src":"assets/img/l03A_026.webp","ilabel":"3-3","icap":"L03　突破市场参与者的根本意图","fid":"fig26","ctx":[{"t":"所谓的突破，你也可以称它为急速运动。以最严格的定义来说，是指由任何穿透支撑阻力的单根或多根趋势K线组成的趋势性运动。我们把重点再拎出来确认一次。条件之一是得要击穿某个支撑或阻力。再来，由趋势K线组成一根或多根都无所谓。结合上个单元，我们说的趋势K线是多空中有一方掌握了一段时间内的价格运动。所以突破跟价格朝某个方向倾倒是高度相关的概念。如果完全没有人占优势全然平手，影线很长，那多空就更趋近于势均力敌的状态，你可以把它归类为震荡，只是突破失败。这时候你可能会问，如果K线小小的算不上是明确的趋势K线，但它仍然有实体而且实体收在支撑阻力之外，那这能算成功的突破吗？勉强，确实有这种暧昧的状态。所以在条件上你不严格裁定趋势K线，那至少突破的这根K线得要收线在你所突破的对象之外。也就是那个支撑或阻力之外才好。以这些图表来说，橘色横线是价格突破的对象，这也就是所谓的突破点。","p":"p241"},{"t":"之所以突破这个概念非常重要，是因为多空双方总是试图向上和向下突破。对于多头来说，盈利的唯一方法就是在竞争之中胜出，让空头放弃抵抗以后，使价格大幅往上运行。这样一来，他们持有的多单就能够在高处获利了结。这是典型的低买高卖的逻辑。相对的空头也想要创造向下的突破，这样他们在高处卖出的订单也可以在低处获利了结。所以机构的做空算法，时时刻刻在设法创造下破，做多算法，则尝试向上造成突破。而一旦有一方胜出，另一方就被迫放弃并止损。这样就会推动突破越发顺利。这也正是为什么成功的突破，通常都以强劲的趋势K线来完成。","p":"p242"}]},{"t":"para","text":"之所以突破这个概念非常重要，是因为多空双方总是试图向上和向下突破。对于多头来说，盈利的唯一方法就是在竞争之中胜出，让空头放弃抵抗以后，使价格大幅往上运行。这样一来，他们持有的多单就能够在高处获利了结。这是典型的低买高卖的逻辑。相对的空头也想要创造向下的突破，这样他们在高处卖出的订单也可以在低处获利了结。所以机构的做空算法，时时刻刻在设法创造下破，做多算法，则尝试向上造成突破。而一旦有一方胜出，另一方就被迫放弃并止损。这样就会推动突破越发顺利。这也正是为什么成功的突破，通常都以强劲的趋势K线来完成。","pid":"p242"},{"t":"img","src":"assets/img/l03A_027.webp","ilabel":"3-4","icap":"L03　突破市场参与者的根本意图","fid":"fig27","ctx":[{"t":"之所以突破这个概念非常重要，是因为多空双方总是试图向上和向下突破。对于多头来说，盈利的唯一方法就是在竞争之中胜出，让空头放弃抵抗以后，使价格大幅往上运行。这样一来，他们持有的多单就能够在高处获利了结。这是典型的低买高卖的逻辑。相对的空头也想要创造向下的突破，这样他们在高处卖出的订单也可以在低处获利了结。所以机构的做空算法，时时刻刻在设法创造下破，做多算法，则尝试向上造成突破。而一旦有一方胜出，另一方就被迫放弃并止损。这样就会推动突破越发顺利。这也正是为什么成功的突破，通常都以强劲的趋势K线来完成。","p":"p242"},{"t":"不过，双方互不相让，突破也不会天天成功。早在第一个单元，我们就说到市场喜欢待在均衡的状态，对吧？所以要成功发起突破，其实需要克服惯性的阻碍。假设你是多头，不只要说服原本在均衡价格买的相安无事的自己人，要他们加入你的突袭大业。你还要击溃所有空头，也就是你的对手逼迫他们乖乖就范。也正是因为这样，我们把前头的突破定义比较严谨的那个版本哦，踩的比较死一点。需要能够成功突破支撑或阻力，还要收成趋势K线。否则，以这个例子来说明。","p":"p243"}]},{"t":"para","text":"不过，双方互不相让，突破也不会天天成功。早在第一个单元，我们就说到市场喜欢待在均衡的状态，对吧？所以要成功发起突破，其实需要克服惯性的阻碍。假设你是多头，不只要说服原本在均衡价格买的相安无事的自己人，要他们加入你的突袭大业。你还要击溃所有空头，也就是你的对手逼迫他们乖乖就范。也正是因为这样，我们把前头的突破定义比较严谨的那个版本哦，踩的比较死一点。需要能够成功突破支撑或阻力，还要收成趋势K线。否则，以这个例子来说明。","pid":"p243"},{"t":"img","src":"assets/img/l03A_028.webp","ilabel":"3-5","icap":"L03　突破市场参与者的根本意图","fid":"fig28","ctx":[{"t":"不过，双方互不相让，突破也不会天天成功。早在第一个单元，我们就说到市场喜欢待在均衡的状态，对吧？所以要成功发起突破，其实需要克服惯性的阻碍。假设你是多头，不只要说服原本在均衡价格买的相安无事的自己人，要他们加入你的突袭大业。你还要击溃所有空头，也就是你的对手逼迫他们乖乖就范。也正是因为这样，我们把前头的突破定义比较严谨的那个版本哦，踩的比较死一点。需要能够成功突破支撑或阻力，还要收成趋势K线。否则，以这个例子来说明。","p":"p243"},{"t":"价格虽然有过一瞬间成功的突破，产生饱满的趋势K线。但最后到了收线的关头，却失败成为影线。这就是突破失败。突破失败就是市场迅速反转，而没有试图延续突破的方向。并且对于防守方来说，他们总是希望面朝他们，试图击溃他们的突破，会失败。空头最乐见向上的突破，不止没能收出趋势阳线，最好还因着空头弟兄的打压。价格直接反向去运行，这样他们就可以获利。于是，如果能够使突破失败这件事情成功，那么趋势就会反转。不过相反的，如果造成突破失败的努力没能成真，也就是突破失败的失败。那么，趋势就会恢复。直到最后，当趋势动能溢散，顺势方已到强弩之末，那么突破失败这件事情总会成立，反转也就发生。这个时候也正是逆势方成功突破的时候。觉得有点抽象吗？我们慢下脚步，具体说明。","p":"p244"}]},{"t":"para","text":"价格虽然有过一瞬间成功的突破，产生饱满的趋势K线。但最后到了收线的关头，却失败成为影线。这就是突破失败。突破失败就是市场迅速反转，而没有试图延续突破的方向。并且对于防守方来说，他们总是希望面朝他们，试图击溃他们的突破，会失败。空头最乐见向上的突破，不止没能收出趋势阳线，最好还因着空头弟兄的打压。价格直接反向去运行，这样他们就可以获利。于是，如果能够使突破失败这件事情成功，那么趋势就会反转。不过相反的，如果造成突破失败的努力没能成真，也就是突破失败的失败。那么，趋势就会恢复。直到最后，当趋势动能溢散，顺势方已到强弩之末，那么突破失败这件事情总会成立，反转也就发生。这个时候也正是逆势方成功突破的时候。觉得有点抽象吗？我们慢下脚步，具体说明。","pid":"p244"},{"t":"img","src":"assets/img/l03A_029.webp","ilabel":"3-6","icap":"L03　突破市场参与者的根本意图","fid":"fig29","ctx":[{"t":"价格虽然有过一瞬间成功的突破，产生饱满的趋势K线。但最后到了收线的关头，却失败成为影线。这就是突破失败。突破失败就是市场迅速反转，而没有试图延续突破的方向。并且对于防守方来说，他们总是希望面朝他们，试图击溃他们的突破，会失败。空头最乐见向上的突破，不止没能收出趋势阳线，最好还因着空头弟兄的打压。价格直接反向去运行，这样他们就可以获利。于是，如果能够使突破失败这件事情成功，那么趋势就会反转。不过相反的，如果造成突破失败的努力没能成真，也就是突破失败的失败。那么，趋势就会恢复。直到最后，当趋势动能溢散，顺势方已到强弩之末，那么突破失败这件事情总会成立，反转也就发生。这个时候也正是逆势方成功突破的时候。觉得有点抽象吗？我们慢下脚步，具体说明。","p":"p244"},{"t":"上个单元我们透过区分趋势K线和区间K线厘清了单根K线的阅读方法。在这里，我们再加入一根K线阅读，两者之间的相对关系。并以此定义突破成功和突破失败，理解它们在图表上应该如何呈现。画面上你应该能看到四组K线。相对于前一根阳线，后一根K线的状态各有不同。用上个单元的话来说，就是多头动能的延续性存在程度不一的消长。请想象自己是站在多头这一方。要描述这四组K线的话，你分别会用什么语汇，什么形容来对其说明呢？可以在心里想一想。身边正好有家人朋友的话，也可以试着用全然白话的方式跟他们说明看看你会如何理解这之间的差异。并且挑战看看能不能说到他们听懂。在这里给大家十秒钟的时间考虑，请尽管暂停。尝试过了吗？现在来说出我的答案。我们试着以突破的角度来思考。在第一根K线收定以后，多空共识已经出现，那就是确认多头获胜，因而产生阳线。但接下来多头跟空头马上要进入下一个阶段的竞争。也就是说，多头已经领导价格运行一根K线的时间，那他们的第一要务是延续刚刚的优势。继续推动价格向上走。而空头呢，相反他们希望让多头的努力以失败作收。所以他们的目标是截断多头的动能，甚至是完全反转多头，反而朝有利于自己的方向，也就是下跌的方向来产生新的突破。于是我们可以接着粗分出几种结果。第一个是多头仍然获胜，价格又向上去运行。并且直到收线的一刻还是能维持优势，收出趋势阳线。这种情况下，空头大获全输。所以对多头来说，就是突破成功。还记得我们刚刚说的突破成功，必须要成功穿透某一个支撑阻力，并且收出趋势K线吗？它突破的对象是谁呢？正是自身前一根K线的高点。你可以想象在更小时间级别图表上。前一根K线的影线与这一根K线的开盘之间应该有过一段小小的折返，然后才突破。以及前一根K线是一段趋势性的上涨，而折返就是回调。最后价格又再次突破原趋势的极值。对多头来说，中间存在这样一个反败为胜的段落，就像拔河运动中突然被对手拉了一小小段过去。但又旋即把优势抢回来一样。所以我们说对第一和第二根K线来说，之间的相互关系是多头突破成功。而另一个极端则是多头楼起楼塌下一根K线就全部还回去了。这种情况下，我们会很直观的说，这是反转。不过反转的意思同时也是空头朝向有利于自己的方向完成了突破成功的任务。你也很容易想见内部的轨迹，可能是这样的。空头同样对于前一根K线的低点，也就是更小时间级别图表上的支撑进行了有效的突破。这是空头的突破成功。那第二个情境呢？我们来检验一下前一根K线的高点有没有被击穿？诶，好像有，但似乎又折回来了，对吧？内部的轨迹可能是这样的。所以多头曾经稍占上风，突破回调后还继续尝试突破。但到了收线之际，却又被空头收了回来，现在反倒是空头占有小小的优势。对多头来说，突破就宣告失败了。第三种情境则是停顿。多头跟空头在这里短暂拉锯，但最后势均力敌，没有人能够更为明显的胜出。进一步说，其实多头没有能力向上突破，阻力空头也没有力气向下突破支撑。这种停顿的状态显现，双方都很犹豫，都很疲弱。所以我们再理一次。从多头的角度来看，这四种情况分别是突破成功，突破失败，停顿以及遭到反转。还跟得上吗？一根K线与它前面这个邻居的关系，就如刚刚说的一样，其实大有讲究。针对刚刚这四种情境，我们还可以再给出另外几种相似，但有些变化的版本。并且再来问问你分别对于多头和空头来说，突破是成功还是失败的？答案如下。多头成功，空头几乎没有做出努力。多头突破成功，空头突破失败。多头突破失败，空头没有努力到能够向下造成突破，但稍微占有优势。多头突破失败，空头也突破失败。多头跟空头都不够有力道创出突破。多头努力不足，空头突破失败。最后则是多头努力不足，空头突破成功。以及多头突破失败，空头突破成功。如果多与空分别有突破成功并未发力以及突破失败，总共三种状态可供选择的话。以加号三角形与减号来表示，就能够有二的三次方种，也就是八种组合。任何一根K线相交于前面一根K线你都能够或说你应该都要有能力用以上方法来描述它们的关系。其中有一点值得补充的是，我们说的突破失败，并不是说接下来要是出现第三根K线，它也必然是失败的会导致反转。有种可能是顺势力量，只是暂时休息一下，接下来还会继续发力，造成进一步突破。那从这个角度来说，它其实不过是一个回调过程中折返的，这一段是一个持续形态。或说旗型。以此为例，如果向上展开突破，则它是一个双重底牛旗。因此，突破失败，你也可以将它理解为突破回调。如果你认为后续应该悲观看待，那突破回调可能进一步演变为逆势方的突破成功。也就是反转。但如果你认为顺势方接下来还有发挥的空间，那这次突破失败，你可能更愿意称它为回调。相信趋势终将恢复。好，如今你已经知道什么叫突破了，也知道突破是多空，双方在每一根K线的征战中最想要实现的核心意图。那接下来我们来试着阅读一下连续的K线。分别说一下后，一根与前一根之间双方的突破关系是什么？（练习）第一根K线是强劲的趋势阳线。后面接着另一根趋势阳线越过了高点，并瘦成光头的样子。所以这是突破成功，对吧？接着虽然不是很强劲，影线蛮明显的，但终归是有实体收在前一根K线的高点之上。所以能算是多头突破成功。不过下一根就不行了，这根本没有向上突破的迹象，实体也不存在。这是所谓的停顿，多头没有出力的意思。而如果你记得这也叫做内包K线，相较于前一根K线高低点，至少有一边是内缩的K线。再来多头就又乏力了。实体收在前方高点之上，而且是趋势阳线，这是没有悬念的多头突破成功。下一根也是实体更强。不过接着收了一根阴线。这根阴线如何看待呢？同样，它是内包K线。虽然是阴线，而且是趋势阴线，但对于前一根K线的高低点来说，都没有试图越过的迹象。所以可以说价格暂时回落，但多头与空头都没有积极进取的意思，没有试着创造突破。凑巧的是，后几根也一样，全是内包K线。连续三根，这就成为了iii ，三内包的组合。也就是说，虽然形状各异，但对它们的前一根K线都没有突破可言，多头跟空头都在待机都没有发力的尝试。这也正是为什么在上个单元里，我们要强调说这种多颗十字星，多根区间K线的组合，它本身就代表动能的停顿。是市场处于局部均衡的意思。虽然不是这个部分的重点，但也顺便说一下，从外观上你可以看出收敛的轮廓，这其实也就是所谓收敛三角的形态。你可能听人家说过三角形倾向突破，而且可能向上突破，也可能向下突破。可以是持续形态，也可以是反转形态。原理上，这是当然的。当多空动能逐步衰减瘫缩到极限，总有一方会先行发力。金融市场，不会从此失去波动。而下一根K线突破就发生了。是多头领军的突破成功。实体确实收在前一根K线高点之上，同时越过了收敛三角这条隐形的边线。后续两根也是多头稍占上风，得出突破成功的结果。不过再下一根就风云变色了。多头甚至没有做出向上突破的动作就被反超。在这里，阴线是实实在在的收在前根影线的下面，这也就是所谓的反转。由于反转是两根K线组成的，结合上个单元的知识，我们可以称其为双K线反转。而下一根同样是空头突破成功，多头已经几乎没有向上发力的迹象。不过空头也好景不长，接下来又是连续两根的内包K线，价格又陷入停顿。停顿结束，多头取得优势，往上收线在前一根K线的高点之上。但又立即找到空头，突破成功，向下反转。反转有持续太久吗？没有下一根阴线，小小的突破成功以后，又被多头向上吞没。接着又陷入停顿。停顿只持续一根K线，就又出现了一根外包K线，这是什么意思呢？多头曾经尝试向上突破，但到了收线之际，又被空头扳了回来。所以这根K线是向上突破失败，而空头突破成功。此后则是连续两根突破成功的趋势，阴线待价格脱离了上面这个纠结的区间。不晓得你觉得枯不枯燥。想当初我学会这样阅读每一根K线的方法，以后我其实是蛮激动的。原来我可以这样细究所有的价格运动。原来影线都是失败的突破尝试，我曾经以为它们并不重要。而实际上，经过刚刚的导览，您应该已经能够清楚的想见这些影线，在收线以前，其实都曾经是强劲的实体。但由于最后突破失败，旋即折返，而最终成为影线。放眼望去，几乎每根K线都有影线。这些都是突破倾向失败的证明。只不过他们频繁出现到多数交易者甚至不会意识到市场曾经尝试突破。原来突破时时刻刻在发生。你在市场中多空参与者，竞争激烈，不是讲假的。他们拳拳到肉，就是要在每一根K线之间拼出个你死我活。而实际上，阿尔布鲁克斯其实也说，交易者所应该学会的最重要技能没有之一。就是判断在前一根K线的上方或下方是多头将会胜出，还是空头将会胜出？如何做到呢？同样是前两个单元说过的老话，判断脉络与动能。以刚刚这张图表为例，用我自己的标准来看的话，这是一根蛮适合在收线时市价追空的K线。原因是前方这波上涨的最后一段推动，对原趋势极值的突破相当失败。无法接绪干净的阳线，而是被大力的吞没。那这就可能预示着比较深的回调，或至少是横盘。横盘也确实来了。区间内部的最后一根K线还记得吗？刚刚说到它是一根外包K线，曾经先向上尝试突破。但又旋即折回。这代表有人看到阳线选择做多以后，却被套在这段失败的运动中。他们因而在价格下跌以后，面临浮亏的压力。这个压力是可能消解的，毕竟我们说区间是均衡的市场状态倾向维持。只要区间没有破掉，价格在里头震荡的几率更大，很可能继续反转走高。但随后却是饱满的趋势阴线突破区间下缘，甚至几乎是一根光脚阴线。这代表空头几乎直到最后一刻还在大力卖出。这是空头乐见的强劲动能表现。于是，基于区间突破之后倾向产生等距运动的惯性。在收线时，最近很容易获得高胜率的一个短打利润，立即在入场之后止盈。突然进行了一连串分析，希望没吓到你。如果有任何地方没搞懂，这是很正常的。因为这些知识，我们大部分都要在后面的单元才会陆续提到。你终究会学会的，尽管放心。我只是想要实际的示范一下判读脉络与动能，并得出突破可能成功或失败的结论到底是什么意思？刚才我分析了对原趋势极值的突破失败，意识到区间的存在。并且在这里看到了多头动能的延续失败。在这里看到强劲的反转下跌，可能套住部分多头。然后我还在这根阴线看到了饱满的突破动能。基于以上综合的因素，我于是可以判断，在这根K线收线以后追进有很高的几率可以止盈。因为我知道在这根K线的下方，空头有稳当的把握，可以胜出。这就是阿尔布克斯说的交易者所应该学会的最重要技能。给予严谨的动能比较后，如果交易者相信在一根K线的上方或下方多头将会胜出。且还能够有后续的跟进，则其应该做多。而如果相信空头将胜出，且还有后续的跟进，则其应该做空。这种判断能力越强，所能够占到的先机也就越大，也就越可能透过交易盈利与维生。而刚刚我们是先从最基本功的部分练起，判断一根K线对它上一根的突破关系是多头强势还是空头强势。这是判断动能的第一课。学会这样的读法，其实你就能读大部分图表了。同样以语言比喻，你已经学会自然发音法。即使出现一个你不会的单字，好比标题里的constitutional，你也能够先念出来。能念你就有机会越读越懂，从与透彻的理解脉络与动能。读懂机构行动的痕迹与意图。","p":"p245"}]},{"t":"para","text":"上个单元我们透过区分趋势K线和区间K线厘清了单根K线的阅读方法。在这里，我们再加入一根K线阅读，两者之间的相对关系。并以此定义突破成功和突破失败，理解它们在图表上应该如何呈现。画面上你应该能看到四组K线。相对于前一根阳线，后一根K线的状态各有不同。用上个单元的话来说，就是多头动能的延续性存在程度不一的消长。请想象自己是站在多头这一方。要描述这四组K线的话，你分别会用什么语汇，什么形容来对其说明呢？可以在心里想一想。身边正好有家人朋友的话，也可以试着用全然白话的方式跟他们说明看看你会如何理解这之间的差异。并且挑战看看能不能说到他们听懂。在这里给大家十秒钟的时间考虑，请尽管暂停。尝试过了吗？现在来说出我的答案。我们试着以突破的角度来思考。在第一根K线收定以后，多空共识已经出现，那就是确认多头获胜，因而产生阳线。但接下来多头跟空头马上要进入下一个阶段的竞争。也就是说，多头已经领导价格运行一根K线的时间，那他们的第一要务是延续刚刚的优势。继续推动价格向上走。而空头呢，相反他们希望让多头的努力以失败作收。所以他们的目标是截断多头的动能，甚至是完全反转多头，反而朝有利于自己的方向，也就是下跌的方向来产生新的突破。于是我们可以接着粗分出几种结果。第一个是多头仍然获胜，价格又向上去运行。并且直到收线的一刻还是能维持优势，收出趋势阳线。这种情况下，空头大获全输。所以对多头来说，就是突破成功。还记得我们刚刚说的突破成功，必须要成功穿透某一个支撑阻力，并且收出趋势K线吗？它突破的对象是谁呢？正是自身前一根K线的高点。你可以想象在更小时间级别图表上。前一根K线的影线与这一根K线的开盘之间应该有过一段小小的折返，然后才突破。以及前一根K线是一段趋势性的上涨，而折返就是回调。最后价格又再次突破原趋势的极值。对多头来说，中间存在这样一个反败为胜的段落，就像拔河运动中突然被对手拉了一小小段过去。但又旋即把优势抢回来一样。所以我们说对第一和第二根K线来说，之间的相互关系是多头突破成功。而另一个极端则是多头楼起楼塌下一根K线就全部还回去了。这种情况下，我们会很直观的说，这是反转。不过反转的意思同时也是空头朝向有利于自己的方向完成了突破成功的任务。你也很容易想见内部的轨迹，可能是这样的。空头同样对于前一根K线的低点，也就是更小时间级别图表上的支撑进行了有效的突破。这是空头的突破成功。那第二个情境呢？我们来检验一下前一根K线的高点有没有被击穿？诶，好像有，但似乎又折回来了，对吧？内部的轨迹可能是这样的。所以多头曾经稍占上风，突破回调后还继续尝试突破。但到了收线之际，却又被空头收了回来，现在反倒是空头占有小小的优势。对多头来说，突破就宣告失败了。第三种情境则是停顿。多头跟空头在这里短暂拉锯，但最后势均力敌，没有人能够更为明显的胜出。进一步说，其实多头没有能力向上突破，阻力空头也没有力气向下突破支撑。这种停顿的状态显现，双方都很犹豫，都很疲弱。所以我们再理一次。从多头的角度来看，这四种情况分别是突破成功，突破失败，停顿以及遭到反转。还跟得上吗？一根K线与它前面这个邻居的关系，就如刚刚说的一样，其实大有讲究。针对刚刚这四种情境，我们还可以再给出另外几种相似，但有些变化的版本。并且再来问问你分别对于多头和空头来说，突破是成功还是失败的？答案如下。多头成功，空头几乎没有做出努力。多头突破成功，空头突破失败。多头突破失败，空头没有努力到能够向下造成突破，但稍微占有优势。多头突破失败，空头也突破失败。多头跟空头都不够有力道创出突破。多头努力不足，空头突破失败。最后则是多头努力不足，空头突破成功。以及多头突破失败，空头突破成功。如果多与空分别有突破成功并未发力以及突破失败，总共三种状态可供选择的话。以加号三角形与减号来表示，就能够有二的三次方种，也就是八种组合。任何一根K线相交于前面一根K线你都能够或说你应该都要有能力用以上方法来描述它们的关系。其中有一点值得补充的是，我们说的突破失败，并不是说接下来要是出现第三根K线，它也必然是失败的会导致反转。有种可能是顺势力量，只是暂时休息一下，接下来还会继续发力，造成进一步突破。那从这个角度来说，它其实不过是一个回调过程中折返的，这一段是一个持续形态。或说旗型。以此为例，如果向上展开突破，则它是一个双重底牛旗。因此，突破失败，你也可以将它理解为突破回调。如果你认为后续应该悲观看待，那突破回调可能进一步演变为逆势方的突破成功。也就是反转。但如果你认为顺势方接下来还有发挥的空间，那这次突破失败，你可能更愿意称它为回调。相信趋势终将恢复。好，如今你已经知道什么叫突破了，也知道突破是多空，双方在每一根K线的征战中最想要实现的核心意图。那接下来我们来试着阅读一下连续的K线。分别说一下后，一根与前一根之间双方的突破关系是什么？（练习）第一根K线是强劲的趋势阳线。后面接着另一根趋势阳线越过了高点，并瘦成光头的样子。所以这是突破成功，对吧？接着虽然不是很强劲，影线蛮明显的，但终归是有实体收在前一根K线的高点之上。所以能算是多头突破成功。不过下一根就不行了，这根本没有向上突破的迹象，实体也不存在。这是所谓的停顿，多头没有出力的意思。而如果你记得这也叫做内包K线，相较于前一根K线高低点，至少有一边是内缩的K线。再来多头就又乏力了。实体收在前方高点之上，而且是趋势阳线，这是没有悬念的多头突破成功。下一根也是实体更强。不过接着收了一根阴线。这根阴线如何看待呢？同样，它是内包K线。虽然是阴线，而且是趋势阴线，但对于前一根K线的高低点来说，都没有试图越过的迹象。所以可以说价格暂时回落，但多头与空头都没有积极进取的意思，没有试着创造突破。凑巧的是，后几根也一样，全是内包K线。连续三根，这就成为了iii ，三内包的组合。也就是说，虽然形状各异，但对它们的前一根K线都没有突破可言，多头跟空头都在待机都没有发力的尝试。这也正是为什么在上个单元里，我们要强调说这种多颗十字星，多根区间K线的组合，它本身就代表动能的停顿。是市场处于局部均衡的意思。虽然不是这个部分的重点，但也顺便说一下，从外观上你可以看出收敛的轮廓，这其实也就是所谓收敛三角的形态。你可能听人家说过三角形倾向突破，而且可能向上突破，也可能向下突破。可以是持续形态，也可以是反转形态。原理上，这是当然的。当多空动能逐步衰减瘫缩到极限，总有一方会先行发力。金融市场，不会从此失去波动。而下一根K线突破就发生了。是多头领军的突破成功。实体确实收在前一根K线高点之上，同时越过了收敛三角这条隐形的边线。后续两根也是多头稍占上风，得出突破成功的结果。不过再下一根就风云变色了。多头甚至没有做出向上突破的动作就被反超。在这里，阴线是实实在在的收在前根影线的下面，这也就是所谓的反转。由于反转是两根K线组成的，结合上个单元的知识，我们可以称其为双K线反转。而下一根同样是空头突破成功，多头已经几乎没有向上发力的迹象。不过空头也好景不长，接下来又是连续两根的内包K线，价格又陷入停顿。停顿结束，多头取得优势，往上收线在前一根K线的高点之上。但又立即找到空头，突破成功，向下反转。反转有持续太久吗？没有下一根阴线，小小的突破成功以后，又被多头向上吞没。接着又陷入停顿。停顿只持续一根K线，就又出现了一根外包K线，这是什么意思呢？多头曾经尝试向上突破，但到了收线之际，又被空头扳了回来。所以这根K线是向上突破失败，而空头突破成功。此后则是连续两根突破成功的趋势，阴线待价格脱离了上面这个纠结的区间。不晓得你觉得枯不枯燥。想当初我学会这样阅读每一根K线的方法，以后我其实是蛮激动的。原来我可以这样细究所有的价格运动。原来影线都是失败的突破尝试，我曾经以为它们并不重要。而实际上，经过刚刚的导览，您应该已经能够清楚的想见这些影线，在收线以前，其实都曾经是强劲的实体。但由于最后突破失败，旋即折返，而最终成为影线。放眼望去，几乎每根K线都有影线。这些都是突破倾向失败的证明。只不过他们频繁出现到多数交易者甚至不会意识到市场曾经尝试突破。原来突破时时刻刻在发生。你在市场中多空参与者，竞争激烈，不是讲假的。他们拳拳到肉，就是要在每一根K线之间拼出个你死我活。而实际上，阿尔布鲁克斯其实也说，交易者所应该学会的最重要技能没有之一。就是判断在前一根K线的上方或下方是多头将会胜出，还是空头将会胜出？如何做到呢？同样是前两个单元说过的老话，判断脉络与动能。以刚刚这张图表为例，用我自己的标准来看的话，这是一根蛮适合在收线时市价追空的K线。原因是前方这波上涨的最后一段推动，对原趋势极值的突破相当失败。无法接绪干净的阳线，而是被大力的吞没。那这就可能预示着比较深的回调，或至少是横盘。横盘也确实来了。区间内部的最后一根K线还记得吗？刚刚说到它是一根外包K线，曾经先向上尝试突破。但又旋即折回。这代表有人看到阳线选择做多以后，却被套在这段失败的运动中。他们因而在价格下跌以后，面临浮亏的压力。这个压力是可能消解的，毕竟我们说区间是均衡的市场状态倾向维持。只要区间没有破掉，价格在里头震荡的几率更大，很可能继续反转走高。但随后却是饱满的趋势阴线突破区间下缘，甚至几乎是一根光脚阴线。这代表空头几乎直到最后一刻还在大力卖出。这是空头乐见的强劲动能表现。于是，基于区间突破之后倾向产生等距运动的惯性。在收线时，最近很容易获得高胜率的一个短打利润，立即在入场之后止盈。突然进行了一连串分析，希望没吓到你。如果有任何地方没搞懂，这是很正常的。因为这些知识，我们大部分都要在后面的单元才会陆续提到。你终究会学会的，尽管放心。我只是想要实际的示范一下判读脉络与动能，并得出突破可能成功或失败的结论到底是什么意思？刚才我分析了对原趋势极值的突破失败，意识到区间的存在。并且在这里看到了多头动能的延续失败。在这里看到强劲的反转下跌，可能套住部分多头。然后我还在这根阴线看到了饱满的突破动能。基于以上综合的因素，我于是可以判断，在这根K线收线以后追进有很高的几率可以止盈。因为我知道在这根K线的下方，空头有稳当的把握，可以胜出。这就是阿尔布克斯说的交易者所应该学会的最重要技能。给予严谨的动能比较后，如果交易者相信在一根K线的上方或下方多头将会胜出。且还能够有后续的跟进，则其应该做多。而如果相信空头将胜出，且还有后续的跟进，则其应该做空。这种判断能力越强，所能够占到的先机也就越大，也就越可能透过交易盈利与维生。而刚刚我们是先从最基本功的部分练起，判断一根K线对它上一根的突破关系是多头强势还是空头强势。这是判断动能的第一课。学会这样的读法，其实你就能读大部分图表了。同样以语言比喻，你已经学会自然发音法。即使出现一个你不会的单字，好比标题里的constitutional，你也能够先念出来。能念你就有机会越读越懂，从与透彻的理解脉络与动能。读懂机构行动的痕迹与意图。","pid":"p245"}],"wcount":6130},{"id":"l03B","title":"第B段　突破市场参与者的根本意图","blocks":[{"t":"para","text":"L03B 突破市场参与者的根本意图","pid":"p246"},{"t":"para","text":"现在你已经知道如何阅读K线跟K线之间的关系。于是我们可以化繁为简一下，认为图表上的所有K线对价格的行进方向来说，也就是对原本的顺势方来说。可能有三种结果。","pid":"p247"},{"t":"img","src":"assets/img/l03B_030.webp","ilabel":"3-7","icap":"L03　突破市场参与者的根本意图","fid":"fig30","ctx":[{"t":"L03B 突破市场参与者的根本意图","p":"p246"},{"t":"现在你已经知道如何阅读K线跟K线之间的关系。于是我们可以化繁为简一下，认为图表上的所有K线对价格的行进方向来说，也就是对原本的顺势方来说。可能有三种结果。","p":"p247"},{"t":"突破成功，实体收在前一根K线的极值之外。或者突破失败，越过了但又收回来。对于突破失败，依照接下来趋势恢复的可能性，你还可以区分出不同的程度。乐观一点，可以称它为突破回调，也就是失败程度比较小的情形，后续恢复趋势的可能性会提升。中性的情况可以就暂时称它为突破失败。而若回调的太深，深到逆势方甚至突破了前一根K线的另一边极值，那你就可以称其为反转。接下来，反向运行的可能性提升。除了突破成功与突破失败以外的情况，只是突破没有发生。那就是停顿，就是犹豫。一般来说，这也跟突破回调比较相近。由于趋势倾向延续，故比较可能朝向原本顺势的方向继续突破。不过，还记得前一节我们也说到，突破其实很常发生，但大多数时候都会失败吗？所有影线都是失败的突破尝试。这时候我要重新引进一个重要的观念，就是市场有其惰性。","p":"p248"}]},{"t":"para","text":"突破成功，实体收在前一根K线的极值之外。或者突破失败，越过了但又收回来。对于突破失败，依照接下来趋势恢复的可能性，你还可以区分出不同的程度。乐观一点，可以称它为突破回调，也就是失败程度比较小的情形，后续恢复趋势的可能性会提升。中性的情况可以就暂时称它为突破失败。而若回调的太深，深到逆势方甚至突破了前一根K线的另一边极值，那你就可以称其为反转。接下来，反向运行的可能性提升。除了突破成功与突破失败以外的情况，只是突破没有发生。那就是停顿，就是犹豫。一般来说，这也跟突破回调比较相近。由于趋势倾向延续，故比较可能朝向原本顺势的方向继续突破。不过，还记得前一节我们也说到，突破其实很常发生，但大多数时候都会失败吗？所有影线都是失败的突破尝试。这时候我要重新引进一个重要的观念，就是市场有其惰性。","pid":"p248"},{"t":"img","src":"assets/img/l03B_031.webp","ilabel":"3-8","icap":"L03　突破市场参与者的根本意图","fid":"fig31","ctx":[{"t":"突破成功，实体收在前一根K线的极值之外。或者突破失败，越过了但又收回来。对于突破失败，依照接下来趋势恢复的可能性，你还可以区分出不同的程度。乐观一点，可以称它为突破回调，也就是失败程度比较小的情形，后续恢复趋势的可能性会提升。中性的情况可以就暂时称它为突破失败。而若回调的太深，深到逆势方甚至突破了前一根K线的另一边极值，那你就可以称其为反转。接下来，反向运行的可能性提升。除了突破成功与突破失败以外的情况，只是突破没有发生。那就是停顿，就是犹豫。一般来说，这也跟突破回调比较相近。由于趋势倾向延续，故比较可能朝向原本顺势的方向继续突破。不过，还记得前一节我们也说到，突破其实很常发生，但大多数时候都会失败吗？所有影线都是失败的突破尝试。这时候我要重新引进一个重要的观念，就是市场有其惰性。","p":"p248"},{"t":"你要称它为惯性也可以。总之是市场倾向维持，它正在进行的动作，直到多空共识改变。共识改变也不是一触可及的，它更像是个缓慢的大轮船，调转方向需要时间，需要蓄力。阿尔布鲁克斯称，市场的惰性为80%法则。也就是区间中80%以上的突破尝试都会失败以及趋势中80%以上的反转尝试都会失败。所谓区间倾向突破失败，我们在第一个单元里就反复提及过了市场爱好均衡，任何一方要强行推动价格远离均衡，都会是相当费力的事情。所以对于区间边线的突破尝试多半无法接续有效的跟进K线，而是会接着折返回到区间内。","p":"p249"}]},{"t":"para","text":"你要称它为惯性也可以。总之是市场倾向维持，它正在进行的动作，直到多空共识改变。共识改变也不是一触可及的，它更像是个缓慢的大轮船，调转方向需要时间，需要蓄力。阿尔布鲁克斯称，市场的惰性为80%法则。也就是区间中80%以上的突破尝试都会失败以及趋势中80%以上的反转尝试都会失败。所谓区间倾向突破失败，我们在第一个单元里就反复提及过了市场爱好均衡，任何一方要强行推动价格远离均衡，都会是相当费力的事情。所以对于区间边线的突破尝试多半无法接续有效的跟进K线，而是会接着折返回到区间内。","pid":"p249"},{"t":"img","src":"assets/img/l03B_032.webp","ilabel":"3-9","icap":"L03　突破市场参与者的根本意图","fid":"fig32","ctx":[{"t":"你要称它为惯性也可以。总之是市场倾向维持，它正在进行的动作，直到多空共识改变。共识改变也不是一触可及的，它更像是个缓慢的大轮船，调转方向需要时间，需要蓄力。阿尔布鲁克斯称，市场的惰性为80%法则。也就是区间中80%以上的突破尝试都会失败以及趋势中80%以上的反转尝试都会失败。所谓区间倾向突破失败，我们在第一个单元里就反复提及过了市场爱好均衡，任何一方要强行推动价格远离均衡，都会是相当费力的事情。所以对于区间边线的突破尝试多半无法接续有效的跟进K线，而是会接着折返回到区间内。","p":"p249"},{"t":"这也就是说，如果你判断出当前的市场脉络处于区间。那就应该背靠着区间的上下缘来进行看衰突破成功的反转交易。也就是说，买低卖高。","p":"p250"}]},{"t":"para","text":"这也就是说，如果你判断出当前的市场脉络处于区间。那就应该背靠着区间的上下缘来进行看衰突破成功的反转交易。也就是说，买低卖高。","pid":"p250"},{"t":"img","src":"assets/img/l03B_033.webp","ilabel":"3-10","icap":"L03　突破市场参与者的根本意图","fid":"fig33","ctx":[{"t":"这也就是说，如果你判断出当前的市场脉络处于区间。那就应该背靠着区间的上下缘来进行看衰突破成功的反转交易。也就是说，买低卖高。","p":"p250"},{"t":"相对的趋势倾向延续，这是指趋势中多数时候出现的逆势K线，最后都没有办法发展成宏大的反转行情。他们通常只会发展成一个动能，斜率，幅度，连续性各方面综合起来不如原趋势强劲的一个小小通道，最后引发趋势延续。以形态的称呼方法来说，这些小小的回调，小小的通道，就是广义的旗型。在上升趋势中的回调就是牛旗起到看涨的效果。反过来说，下降趋势中的回调则是起到看跌效果的熊旗。综合以上，既然趋势倾向延续，那么交易者只要判断出市场处于趋势状态。那就应该预期朝向顺势方向突破的几率更大。所以你应该要跟随趋势，考虑只建立顺势的仓位。","p":"p251"}]},{"t":"para","text":"相对的趋势倾向延续，这是指趋势中多数时候出现的逆势K线，最后都没有办法发展成宏大的反转行情。他们通常只会发展成一个动能，斜率，幅度，连续性各方面综合起来不如原趋势强劲的一个小小通道，最后引发趋势延续。以形态的称呼方法来说，这些小小的回调，小小的通道，就是广义的旗型。在上升趋势中的回调就是牛旗起到看涨的效果。反过来说，下降趋势中的回调则是起到看跌效果的熊旗。综合以上，既然趋势倾向延续，那么交易者只要判断出市场处于趋势状态。那就应该预期朝向顺势方向突破的几率更大。所以你应该要跟随趋势，考虑只建立顺势的仓位。","pid":"p251"},{"t":"img","src":"assets/img/l03B_034.webp","ilabel":"3-11","icap":"L03　突破市场参与者的根本意图","fid":"fig34","ctx":[{"t":"相对的趋势倾向延续，这是指趋势中多数时候出现的逆势K线，最后都没有办法发展成宏大的反转行情。他们通常只会发展成一个动能，斜率，幅度，连续性各方面综合起来不如原趋势强劲的一个小小通道，最后引发趋势延续。以形态的称呼方法来说，这些小小的回调，小小的通道，就是广义的旗型。在上升趋势中的回调就是牛旗起到看涨的效果。反过来说，下降趋势中的回调则是起到看跌效果的熊旗。综合以上，既然趋势倾向延续，那么交易者只要判断出市场处于趋势状态。那就应该预期朝向顺势方向突破的几率更大。所以你应该要跟随趋势，考虑只建立顺势的仓位。","p":"p251"},{"t":"趋势跟区间，何者更常见呢？市场爱好均衡，因此绝对是后者。显示图表上的K线，你不难发现市场处于突破状态，也就是进行急速运动的时间很少，只有不到20%。在这稀缺的时间里，价格能在发生强劲突破后还接续同向的跟进K线，这是我们所谓的偏向单边交易的状态。可是，尽管很少，一旦趋势运动发起，在急速与窄幅通道内进行反转交易很容易伤痕累累。因为趋势倾向延续需要花一点时间才会慢慢转弱，回到相对均衡的通道以及横向的区间状态。而一旦转回相对无趋势的情况，价格就会以震荡形势围绕着均衡价格上下探测。持续更长的时间。此时，即使出现表征突破的趋势K线，也很难接续有效的跟进K线。要知道该价格范围对多头跟空头来说都是具均衡意义的。他们共同认为，价值应该在其他地方突破，才会又发起。","p":"p252"}]},{"t":"para","text":"趋势跟区间，何者更常见呢？市场爱好均衡，因此绝对是后者。显示图表上的K线，你不难发现市场处于突破状态，也就是进行急速运动的时间很少，只有不到20%。在这稀缺的时间里，价格能在发生强劲突破后还接续同向的跟进K线，这是我们所谓的偏向单边交易的状态。可是，尽管很少，一旦趋势运动发起，在急速与窄幅通道内进行反转交易很容易伤痕累累。因为趋势倾向延续需要花一点时间才会慢慢转弱，回到相对均衡的通道以及横向的区间状态。而一旦转回相对无趋势的情况，价格就会以震荡形势围绕着均衡价格上下探测。持续更长的时间。此时，即使出现表征突破的趋势K线，也很难接续有效的跟进K线。要知道该价格范围对多头跟空头来说都是具均衡意义的。他们共同认为，价值应该在其他地方突破，才会又发起。","pid":"p252"},{"t":"img","src":"assets/img/l03B_035.webp","ilabel":"3-12","icap":"L03　突破市场参与者的根本意图","fid":"fig35","ctx":[{"t":"趋势跟区间，何者更常见呢？市场爱好均衡，因此绝对是后者。显示图表上的K线，你不难发现市场处于突破状态，也就是进行急速运动的时间很少，只有不到20%。在这稀缺的时间里，价格能在发生强劲突破后还接续同向的跟进K线，这是我们所谓的偏向单边交易的状态。可是，尽管很少，一旦趋势运动发起，在急速与窄幅通道内进行反转交易很容易伤痕累累。因为趋势倾向延续需要花一点时间才会慢慢转弱，回到相对均衡的通道以及横向的区间状态。而一旦转回相对无趋势的情况，价格就会以震荡形势围绕着均衡价格上下探测。持续更长的时间。此时，即使出现表征突破的趋势K线，也很难接续有效的跟进K线。要知道该价格范围对多头跟空头来说都是具均衡意义的。他们共同认为，价值应该在其他地方突破，才会又发起。","p":"p252"},{"t":"这么说来，既然阿尔布鲁克斯说学会事前便是突破成败是最重要的技能，而顺应脉络进行相应的交易是交易者的盈利之道。那你一定必须知道突破最好有强劲的跟进K线作为确认。交易者之所以喜欢看到强劲的跟进K线，是因为这能够作为突破发起方已有能力控制市场的证明。突破K线和跟进K线越强劲，则突破成功并导致脉络进入趋势倾向延续的可能性越大。这里也简单举个例子。熟悉加密货币的交易者可能记得，这是2021年牛市的周线级别图表。雾掉的部分是2020跟2022的部分，大家可以先不用理会。为什么价格在创新高以后，过没多久就下跌？进入悠长的熊市呢？同样撇除任何消息面，基本分析的因素不谈，纯以价格行为的角度来说，这就是突破后缺乏跟进动能的标志。首先，这根阴线本身就是什么？就是失败的突破。上半年的牛市顶点，作为这轮上涨，该剧突破的对象。价格在越过突破点后，就旋即收回实体，不止未能受在阻力之上，还创出了阴线的实体。后面再给到一次机会，价格再次越过阴线高点，却又收回再次突破失败。即使这一次收成阳线，也没有什么作用。原因是后续没有优质的跟进反倒是产生了一根大阴线，对我现在所指的阳线进行向下的吞没。空头突破成功。这是什么呢？这是背靠阻力的双K线反转。如果你是多头，这对你来说就是糟糕到不行的警讯。在整个2021年的大型区间上缘突破缺乏跟进力量，那就可能印证80%法则的诅咒。让追进区间突破的交易者完全被套在错误的方向。所以如果突破K线，无法紧跟同向的跟进K线，或者跟进K线影线太长，实体太短，那逆势交易者多为趁人之危。采取更激进的行动。也遂此这将加剧双边交易的状态。这根大阴线就是空头激进的证明。与其说激进，你甚至应该说他们聪明，果然是人狠话不多的机构。对于可能的区间，他们实践低买以后应该高卖的原则，在这里大力抛售。不过我也趁机提醒你，如果不是已经在低处建仓，区间顶部打算止盈。而是在这里要建立反转的空头仓位，那你同样会希望上下突破以后能够跟进阴线。实际上，在前头就有过一次空头的向下突破尝试，对吧？只不过后一根K线的实体没有收在前一根阴线的低点之下，空头暂时突破失败。功能疲弱，那后续也当然没有跟进K线。你直接冒进做空会很容易受伤。而强势反转以后，作为一根很优质的讯号K线，向你发出了空头正在大力进场的讯号。那么，当后续有阴线作为确认交易者就也有理由市价跟进。对于个别交易者来说，这样的跟进够不够力，优质与否可能见仁见智。不过它至少是一根阴线。如果是阳线，那就跟前一组讯号一样，失败的机会会大幅增加。那假设突破成功了，趋势K线击穿支撑阻力，而且还有跟进K线，接下来会发生什么事情呢？","p":"p253"}]},{"t":"para","text":"这么说来，既然阿尔布鲁克斯说学会事前便是突破成败是最重要的技能，而顺应脉络进行相应的交易是交易者的盈利之道。那你一定必须知道突破最好有强劲的跟进K线作为确认。交易者之所以喜欢看到强劲的跟进K线，是因为这能够作为突破发起方已有能力控制市场的证明。突破K线和跟进K线越强劲，则突破成功并导致脉络进入趋势倾向延续的可能性越大。这里也简单举个例子。熟悉加密货币的交易者可能记得，这是2021年牛市的周线级别图表。雾掉的部分是2020跟2022的部分，大家可以先不用理会。为什么价格在创新高以后，过没多久就下跌？进入悠长的熊市呢？同样撇除任何消息面，基本分析的因素不谈，纯以价格行为的角度来说，这就是突破后缺乏跟进动能的标志。首先，这根阴线本身就是什么？就是失败的突破。上半年的牛市顶点，作为这轮上涨，该剧突破的对象。价格在越过突破点后，就旋即收回实体，不止未能受在阻力之上，还创出了阴线的实体。后面再给到一次机会，价格再次越过阴线高点，却又收回再次突破失败。即使这一次收成阳线，也没有什么作用。原因是后续没有优质的跟进反倒是产生了一根大阴线，对我现在所指的阳线进行向下的吞没。空头突破成功。这是什么呢？这是背靠阻力的双K线反转。如果你是多头，这对你来说就是糟糕到不行的警讯。在整个2021年的大型区间上缘突破缺乏跟进力量，那就可能印证80%法则的诅咒。让追进区间突破的交易者完全被套在错误的方向。所以如果突破K线，无法紧跟同向的跟进K线，或者跟进K线影线太长，实体太短，那逆势交易者多为趁人之危。采取更激进的行动。也遂此这将加剧双边交易的状态。这根大阴线就是空头激进的证明。与其说激进，你甚至应该说他们聪明，果然是人狠话不多的机构。对于可能的区间，他们实践低买以后应该高卖的原则，在这里大力抛售。不过我也趁机提醒你，如果不是已经在低处建仓，区间顶部打算止盈。而是在这里要建立反转的空头仓位，那你同样会希望上下突破以后能够跟进阴线。实际上，在前头就有过一次空头的向下突破尝试，对吧？只不过后一根K线的实体没有收在前一根阴线的低点之下，空头暂时突破失败。功能疲弱，那后续也当然没有跟进K线。你直接冒进做空会很容易受伤。而强势反转以后，作为一根很优质的讯号K线，向你发出了空头正在大力进场的讯号。那么，当后续有阴线作为确认交易者就也有理由市价跟进。对于个别交易者来说，这样的跟进够不够力，优质与否可能见仁见智。不过它至少是一根阴线。如果是阳线，那就跟前一组讯号一样，失败的机会会大幅增加。那假设突破成功了，趋势K线击穿支撑阻力，而且还有跟进K线，接下来会发生什么事情呢？","pid":"p253"},{"t":"img","src":"assets/img/l03B_036.webp","ilabel":"3-13","icap":"L03　突破市场参与者的根本意图","fid":"fig36","ctx":[{"t":"这么说来，既然阿尔布鲁克斯说学会事前便是突破成败是最重要的技能，而顺应脉络进行相应的交易是交易者的盈利之道。那你一定必须知道突破最好有强劲的跟进K线作为确认。交易者之所以喜欢看到强劲的跟进K线，是因为这能够作为突破发起方已有能力控制市场的证明。突破K线和跟进K线越强劲，则突破成功并导致脉络进入趋势倾向延续的可能性越大。这里也简单举个例子。熟悉加密货币的交易者可能记得，这是2021年牛市的周线级别图表。雾掉的部分是2020跟2022的部分，大家可以先不用理会。为什么价格在创新高以后，过没多久就下跌？进入悠长的熊市呢？同样撇除任何消息面，基本分析的因素不谈，纯以价格行为的角度来说，这就是突破后缺乏跟进动能的标志。首先，这根阴线本身就是什么？就是失败的突破。上半年的牛市顶点，作为这轮上涨，该剧突破的对象。价格在越过突破点后，就旋即收回实体，不止未能受在阻力之上，还创出了阴线的实体。后面再给到一次机会，价格再次越过阴线高点，却又收回再次突破失败。即使这一次收成阳线，也没有什么作用。原因是后续没有优质的跟进反倒是产生了一根大阴线，对我现在所指的阳线进行向下的吞没。空头突破成功。这是什么呢？这是背靠阻力的双K线反转。如果你是多头，这对你来说就是糟糕到不行的警讯。在整个2021年的大型区间上缘突破缺乏跟进力量，那就可能印证80%法则的诅咒。让追进区间突破的交易者完全被套在错误的方向。所以如果突破K线，无法紧跟同向的跟进K线，或者跟进K线影线太长，实体太短，那逆势交易者多为趁人之危。采取更激进的行动。也遂此这将加剧双边交易的状态。这根大阴线就是空头激进的证明。与其说激进，你甚至应该说他们聪明，果然是人狠话不多的机构。对于可能的区间，他们实践低买以后应该高卖的原则，在这里大力抛售。不过我也趁机提醒你，如果不是已经在低处建仓，区间顶部打算止盈。而是在这里要建立反转的空头仓位，那你同样会希望上下突破以后能够跟进阴线。实际上，在前头就有过一次空头的向下突破尝试，对吧？只不过后一根K线的实体没有收在前一根阴线的低点之下，空头暂时突破失败。功能疲弱，那后续也当然没有跟进K线。你直接冒进做空会很容易受伤。而强势反转以后，作为一根很优质的讯号K线，向你发出了空头正在大力进场的讯号。那么，当后续有阴线作为确认交易者就也有理由市价跟进。对于个别交易者来说，这样的跟进够不够力，优质与否可能见仁见智。不过它至少是一根阴线。如果是阳线，那就跟前一组讯号一样，失败的机会会大幅增加。那假设突破成功了，趋势K线击穿支撑阻力，而且还有跟进K线，接下来会发生什么事情呢？","p":"p253"},{"t":"这是我们接下来要谈的重点。此时，我们要先引进一个概念，叫做意外行情。什么叫意外行情？意外指的就是那些低几率的事件发生了。出现了朝向意料之外，方向形成的足以影响乃至于改变当前市场脉络的突破。你可以说所有的意外都是某种突破，所有突破都是某种意外。比如类型一，对难以突破的市场脉络发生了突破。你可以想象价格原本在一个平淡均衡的区间中岁月静好，但突然来了一根趋势阳线。突破区间边缘，而且还有跟进。那这是否正是80%法则的那反面20呢？原本在区间这种情况下，无论多空，多数机构算法在区间上缘做的就是卖出。多头卖出止盈，空头建仓做空。但是价格却突然突破那原本持仓持的好端端的多头，此时就踏空了，过早了结利润。而刚刚建仓的空头则被套在错误的方向，他们很快会面临极大的止损压力。又或者另一种也是对难以突破的市场脉络发生的突破。这在之后的单元讲回调的时候会更详细说明原理。但你可以先知道上升通道通常都是熊旗，倾向向下突破。下降通道通常都是牛旗，倾向向上突破。这同样会使交易者心里有一种共同预期，在上升通道里做多的交易者同样会选择在通道线止盈。与其价格很快要折返下跌。或者有人背靠着通道线建仓做空。希望押住价格向下去突破趋势线。但有时候同样很低的几率价格反而朝向突破通道线的方向加速上涨。这时候也会让刚刚两种行动者踏空和被套，所以这也是一种意外。那还有哪些其他的意外种类呢？我们说反转也是一种突破，对吧？是逆势方对顺势方的突破。有时候价格在上升的趋势中会突然跑出非常强劲的阴线折返，这叫做放弃K线。当然，这不是没有来由的出现的。它可能是碰触到了某种阻力，所以吸引多头平仓，空头减仓。两股力量一下集合就跑出异常强劲的回调。这也是意外造成的多头被套，空头踏空。只不过这并不竟然造成大范围的趋势反转。如果顺势交易者之后有意维持趋势，那这根强劲的放弃K线可能只能造成小型趋势反转。最后转为持续形态，也就是嵌于上升趋势中的牛旗。只有在顺势交易者无意维持趋势的情况下，给到逆势交易者大举进攻的机会，才会导致大型趋势反转。","p":"p254"}]},{"t":"para","text":"这是我们接下来要谈的重点。此时，我们要先引进一个概念，叫做意外行情。什么叫意外行情？意外指的就是那些低几率的事件发生了。出现了朝向意料之外，方向形成的足以影响乃至于改变当前市场脉络的突破。你可以说所有的意外都是某种突破，所有突破都是某种意外。比如类型一，对难以突破的市场脉络发生了突破。你可以想象价格原本在一个平淡均衡的区间中岁月静好，但突然来了一根趋势阳线。突破区间边缘，而且还有跟进。那这是否正是80%法则的那反面20呢？原本在区间这种情况下，无论多空，多数机构算法在区间上缘做的就是卖出。多头卖出止盈，空头建仓做空。但是价格却突然突破那原本持仓持的好端端的多头，此时就踏空了，过早了结利润。而刚刚建仓的空头则被套在错误的方向，他们很快会面临极大的止损压力。又或者另一种也是对难以突破的市场脉络发生的突破。这在之后的单元讲回调的时候会更详细说明原理。但你可以先知道上升通道通常都是熊旗，倾向向下突破。下降通道通常都是牛旗，倾向向上突破。这同样会使交易者心里有一种共同预期，在上升通道里做多的交易者同样会选择在通道线止盈。与其价格很快要折返下跌。或者有人背靠着通道线建仓做空。希望押住价格向下去突破趋势线。但有时候同样很低的几率价格反而朝向突破通道线的方向加速上涨。这时候也会让刚刚两种行动者踏空和被套，所以这也是一种意外。那还有哪些其他的意外种类呢？我们说反转也是一种突破，对吧？是逆势方对顺势方的突破。有时候价格在上升的趋势中会突然跑出非常强劲的阴线折返，这叫做放弃K线。当然，这不是没有来由的出现的。它可能是碰触到了某种阻力，所以吸引多头平仓，空头减仓。两股力量一下集合就跑出异常强劲的回调。这也是意外造成的多头被套，空头踏空。只不过这并不竟然造成大范围的趋势反转。如果顺势交易者之后有意维持趋势，那这根强劲的放弃K线可能只能造成小型趋势反转。最后转为持续形态，也就是嵌于上升趋势中的牛旗。只有在顺势交易者无意维持趋势的情况下，给到逆势交易者大举进攻的机会，才会导致大型趋势反转。","pid":"p254"},{"t":"img","src":"assets/img/l03B_037.webp","ilabel":"3-14","icap":"L03　突破市场参与者的根本意图","fid":"fig37","ctx":[{"t":"这是我们接下来要谈的重点。此时，我们要先引进一个概念，叫做意外行情。什么叫意外行情？意外指的就是那些低几率的事件发生了。出现了朝向意料之外，方向形成的足以影响乃至于改变当前市场脉络的突破。你可以说所有的意外都是某种突破，所有突破都是某种意外。比如类型一，对难以突破的市场脉络发生了突破。你可以想象价格原本在一个平淡均衡的区间中岁月静好，但突然来了一根趋势阳线。突破区间边缘，而且还有跟进。那这是否正是80%法则的那反面20呢？原本在区间这种情况下，无论多空，多数机构算法在区间上缘做的就是卖出。多头卖出止盈，空头建仓做空。但是价格却突然突破那原本持仓持的好端端的多头，此时就踏空了，过早了结利润。而刚刚建仓的空头则被套在错误的方向，他们很快会面临极大的止损压力。又或者另一种也是对难以突破的市场脉络发生的突破。这在之后的单元讲回调的时候会更详细说明原理。但你可以先知道上升通道通常都是熊旗，倾向向下突破。下降通道通常都是牛旗，倾向向上突破。这同样会使交易者心里有一种共同预期，在上升通道里做多的交易者同样会选择在通道线止盈。与其价格很快要折返下跌。或者有人背靠着通道线建仓做空。希望押住价格向下去突破趋势线。但有时候同样很低的几率价格反而朝向突破通道线的方向加速上涨。这时候也会让刚刚两种行动者踏空和被套，所以这也是一种意外。那还有哪些其他的意外种类呢？我们说反转也是一种突破，对吧？是逆势方对顺势方的突破。有时候价格在上升的趋势中会突然跑出非常强劲的阴线折返，这叫做放弃K线。当然，这不是没有来由的出现的。它可能是碰触到了某种阻力，所以吸引多头平仓，空头减仓。两股力量一下集合就跑出异常强劲的回调。这也是意外造成的多头被套，空头踏空。只不过这并不竟然造成大范围的趋势反转。如果顺势交易者之后有意维持趋势，那这根强劲的放弃K线可能只能造成小型趋势反转。最后转为持续形态，也就是嵌于上升趋势中的牛旗。只有在顺势交易者无意维持趋势的情况下，给到逆势交易者大举进攻的机会，才会导致大型趋势反转。","p":"p254"},{"t":"之所以要介绍意外行情，这个你可能听都没有听过的阿尔布鲁克斯术语是因为意外发生以后通常会有进一步的运行。同样以他本人的话来说，就是意外本身是一段推动之后还会有接近等距的第二段运动。而这就是我们可以把握利润的机会。原理是这样的。成功的突破本来就是低几率事件，对吧？只有20%以下的几率。那一旦这种事情发生，就如刚刚说的，会有人被套和踏空。被套和踏空代表什么呢？我们设身处地换位思考一下，这时候这两种交易者会怎么做？对于踏空这边来说，会担心错过利润，对吧？那他们想的就是尽快找一个好的价格买进。而被套的呢，他们也要尽快找一个好的价格止损，尽可能让亏损不要太大。于是这就导致一旦回调启动，这两批人都会争先恐后的买进。一个要把握利润，一个要赶紧买入已止损。那么，双双加入顺势方向的结果就是回调很快就结束了，马上造就作为延续行情的第二段推动。","p":"p255"}]},{"t":"para","text":"之所以要介绍意外行情，这个你可能听都没有听过的阿尔布鲁克斯术语是因为意外发生以后通常会有进一步的运行。同样以他本人的话来说，就是意外本身是一段推动之后还会有接近等距的第二段运动。而这就是我们可以把握利润的机会。原理是这样的。成功的突破本来就是低几率事件，对吧？只有20%以下的几率。那一旦这种事情发生，就如刚刚说的，会有人被套和踏空。被套和踏空代表什么呢？我们设身处地换位思考一下，这时候这两种交易者会怎么做？对于踏空这边来说，会担心错过利润，对吧？那他们想的就是尽快找一个好的价格买进。而被套的呢，他们也要尽快找一个好的价格止损，尽可能让亏损不要太大。于是这就导致一旦回调启动，这两批人都会争先恐后的买进。一个要把握利润，一个要赶紧买入已止损。那么，双双加入顺势方向的结果就是回调很快就结束了，马上造就作为延续行情的第二段推动。","pid":"p255"},{"t":"img","src":"assets/img/l03B_038.webp","ilabel":"3-15","icap":"L03　突破市场参与者的根本意图","fid":"fig38","ctx":[{"t":"之所以要介绍意外行情，这个你可能听都没有听过的阿尔布鲁克斯术语是因为意外发生以后通常会有进一步的运行。同样以他本人的话来说，就是意外本身是一段推动之后还会有接近等距的第二段运动。而这就是我们可以把握利润的机会。原理是这样的。成功的突破本来就是低几率事件，对吧？只有20%以下的几率。那一旦这种事情发生，就如刚刚说的，会有人被套和踏空。被套和踏空代表什么呢？我们设身处地换位思考一下，这时候这两种交易者会怎么做？对于踏空这边来说，会担心错过利润，对吧？那他们想的就是尽快找一个好的价格买进。而被套的呢，他们也要尽快找一个好的价格止损，尽可能让亏损不要太大。于是这就导致一旦回调启动，这两批人都会争先恐后的买进。一个要把握利润，一个要赶紧买入已止损。那么，双双加入顺势方向的结果就是回调很快就结束了，马上造就作为延续行情的第二段推动。","p":"p255"},{"t":"所以结合前面讲的所有东西，在这里要抛出来向你确定的概念是突破是低几率的事件。但一旦有效突破发生，因为有交易者踏空和被套，他们趁着回调期间双双加入趋势的做法。会导致第二段运动出现。更简洁的讲就是突破后倾向产生总共两段推动。突破本身为第一推回调后，还有第二推。而对应前头讲的几种情况，区间突破往往会产生所谓的突破回调，然后朝突破方向再走一段。牛旗或熊旗朝意外的方向突破，也会产生两推行情。放弃与反转也是。前者是顺势交易者，还积极进取的情况。那这根放弃K线走不远，马上回调接下来的第二段行情也会小小的，最后继续恢复上升趋势。而若反转很强劲，逆势突破后还有动能饱满的跟进，那就会造成更大规模的日推运动。所有第二推的驱动力都是踏空和被套的人在推波助澜。他们心急如焚，然后以真金白银推进出这段延续的运动。","p":"p256"}]},{"t":"para","text":"所以结合前面讲的所有东西，在这里要抛出来向你确定的概念是突破是低几率的事件。但一旦有效突破发生，因为有交易者踏空和被套，他们趁着回调期间双双加入趋势的做法。会导致第二段运动出现。更简洁的讲就是突破后倾向产生总共两段推动。突破本身为第一推回调后，还有第二推。而对应前头讲的几种情况，区间突破往往会产生所谓的突破回调，然后朝突破方向再走一段。牛旗或熊旗朝意外的方向突破，也会产生两推行情。放弃与反转也是。前者是顺势交易者，还积极进取的情况。那这根放弃K线走不远，马上回调接下来的第二段行情也会小小的，最后继续恢复上升趋势。而若反转很强劲，逆势突破后还有动能饱满的跟进，那就会造成更大规模的日推运动。所有第二推的驱动力都是踏空和被套的人在推波助澜。他们心急如焚，然后以真金白银推进出这段延续的运动。","pid":"p256"},{"t":"img","src":"assets/img/l03B_039.webp","ilabel":"3-16","icap":"L03　突破市场参与者的根本意图","fid":"fig39","ctx":[{"t":"所以结合前面讲的所有东西，在这里要抛出来向你确定的概念是突破是低几率的事件。但一旦有效突破发生，因为有交易者踏空和被套，他们趁着回调期间双双加入趋势的做法。会导致第二段运动出现。更简洁的讲就是突破后倾向产生总共两段推动。突破本身为第一推回调后，还有第二推。而对应前头讲的几种情况，区间突破往往会产生所谓的突破回调，然后朝突破方向再走一段。牛旗或熊旗朝意外的方向突破，也会产生两推行情。放弃与反转也是。前者是顺势交易者，还积极进取的情况。那这根放弃K线走不远，马上回调接下来的第二段行情也会小小的，最后继续恢复上升趋势。而若反转很强劲，逆势突破后还有动能饱满的跟进，那就会造成更大规模的日推运动。所有第二推的驱动力都是踏空和被套的人在推波助澜。他们心急如焚，然后以真金白银推进出这段延续的运动。","p":"p256"},{"t":"说了这么多，我们来看看实例。实在很难找到一张图表，涵盖所有情况，不过这里有上述的，其中三种已经很难得了。且听我依次道来。首先是对旗型通道线的加速突破。刚刚说到下降通道，通常是牛旗，尤其当前在强劲的上升趋势中更是如此。在看到后续的K线以前，我们会主观认定向上突破的几率更高，有80%左右。不过，这根K线非常有趣。他在旗型内部的三次推动完成以后，试图向上突破。但结果如何呢？赶快学以致用一下，就这根K线跟它前一根阴线的关系。这是多头的突破失败。价格曾经短暂越过趋势阴线高点，但最后收了下来，实体完全处在一个不争气的位置。这也是对于前面提到的另一个观点的强调，所有影线都可能是某种失败的突破。因此，大大小小的突破其实有80%的几率失败发生的，比你想象的更频繁。而当向上突破失败以后，价格朝向意料之外的方向前进。向下也就是朝反方向收出的趋势阴线。而且还有两根跟进的趋势，阴线作为确认。这就属于意外的突破行情，将引发刚刚做多的人恐慌止损，而空头则踏空。想着赶紧追上。于是，当价格进入回调，这两方交易者就终于加入空头方向，促成了另外两根大阴线的等距运动。这正是突破之后，还有第二推的典型例证。二推完成以后，价格逐渐陷入横盘走进区间里。在区间中，同样要记得的是，对区间边线的多数突破都会失败。一旦画上区间边线，你就可以明显的感受到两次对上边线的突破，以失败告终，两次对下边线的突破，也以失败告终。双双无法越过前一次的极值。这就代表市场当下在这个价格地带找到了均衡。找到了能使最多人满意，使总体效益最大化的公平价位。但最后共识改变区间仍然被突破了，突破的方向是朝上。你可以看见，先是一根非常强劲的趋势阳线旱地拔葱而起。而且这还不是朝向区间边线的真空运动。后面还有饱满的光头K线作为确认。当然，突破边线才算突破。所以后续还要有跟进K线才令人安心。结果确实很安心，这根阳线也很强劲。所以在连续四根K线的急速运动以后，刚刚在区间内高抛低吸的交易者，如今同样面临被套和踏空的问题。你甚至可以说，之所以这些K线形成的这么坚决。就是因为有人甚至不等回调，就直接砍仓追涨，才会这么顺利的推动价格离开区间。而进入回调后，同样空头力量疲弱。作为嵌于上升趋势中一个横向的小型区间。向下的突破也统统是失败的。最后，引发朝向的第二推等距运动。测试到前方波段点的时候，刚好停了下来。我们再稍微倒转一下，回来看这个牛旗的那一步。在后续K线还没显露以前，估计突然来了这么一个强劲的趋势，阴线会吓到不少交易学习者。认为趋势将要反转的。不过，一旦趋势发起且趋势动能强劲，根据80%法则反转的尝试倾向失败。无论他看上去多么恐怖。于是这就是一根放弃K线。顺势交易者可能基于止盈的原因。比如，他们认为价格测试到刚刚空头的突破点可能会有所回调。或者认为价格越过这个波段点有一段距离的，每逢阻力应该要调整一下，所以选择放弃离场。我打个岔哦，刚刚说到什么等距运动前波段高低点，可能搞得你有点混乱，很想赶快知道是怎么画出来的，基于什么原理？但请放心，后面的单元通通会涵盖到。所以现在只要知道大致的整体轮廓就可以了。总之，基于这些可能的原因，多头或许认为这里是一个暂时离场的好地方，因此引发了一场强劲的暂时放弃。但放弃以后，他们就必定一路放弃到底吗？不见得。他们可能认为趋势还强，只是想要先止盈一部分，找更低更划算的价格重新入场。所以我们刚刚才会说，只要顺势方，还有维持趋势的意愿。即使出现看似强劲的放弃K线所能导引出的第二段推动，也可能很小，这是突破之后还有第二推的知识点。结合趋势作为脉络前提的用法。你于是可以看到多头很快又出现。这是方才这段上涨中踏空的人，被套的人，以及刚才止盈完，现在要重新建仓的人。共同买进所导致。而作为延续的第二推，这里的下跌力量无法战胜想要买进的积极意愿。所以就又造成了作为第一段突破后续的第二段上涨推动。二推完成后，价格又陷入回调。这里同样是放弃K线，并且同样引出第二段下跌行情。虽然后面多头依然蛮积极，让价格又调转上去。但比起前面这里的回调，你可以看出这次下跌就又更激进了一点。动能更强，斜率更陡，幅度也更深。也作为后续单元的预告，这正是卖压积累的意思。随着趋势发展越久，价格越接近下一个均衡地带，顺势方的力量会越被削弱，而逆势方则更积极进取。所以除了用上突破后，常有第二段行情的知识以外。就这张图来说，你也可以先有一个粗浅的认识趋势的发展，通常会越趋平缓。这时候你可能心生疑问。太妃突破后的推动一定结束，在第二推吗？难道不能还有后续？这个问题很重要，先说答案当然可以有后续。比如刚刚说到的例子，最右边的第二推上涨结束之后，虽然回调加深，但多头似乎还是扭转了颓势。正要引发新的，或者你说第三段推动。因此，突破后倾向有第二推，不代表只能结束在第二推。在很多情况下，只要顺势方强劲，可能会有第三推或者又形成更宏大的突破。开启一组新的二推运动。所以，关于两段推动结束后是否还能有延续的这个问题，交易者应该观察第二推的动能表现如何。并认为可能有以下三种结果。首先，先讲利于顺势方的情况。如果第二推强劲过程中减少回调，而且与第一推合并起来看待形成的是一个窄幅通道。那通常很容易有后续。原因是窄幅通道对应到更大时间级别图表上去看，可能依然是连续顺畅，而且坚决的急速突破走势。那回调以后，当然也还有第二段推动作为延续。请注意顺势方力量越强，只要不是高潮运动，有后续跟进的可能性就很高。那接着我们反过来讲，如果第二推很弱，那会怎么样呢？那有延续行情的可能性就会大幅降低。我现在标出来的就是第二推不够强劲的情况。空头经过横盘调整后，第二推非常弱，没有办法导致跟进。只能造成低点持平的双重底。原则上来说，如果逆势方与顺势方力量相近，那价格很可能转入区间状态。而如果逆势方非常踊跃，甚至可能发展成反转。那就这样的情况来看，虽然突破还有第二推，但第二推太弱了，趋势就终止在第二推。还有没有别种情况呢？有第三点。如果第二推相较于第一推实在太异常强劲，那趋势也有可能出问题。我尽量不要把这讲的很玄，还是清楚一点。这种情况通常出现在趋势末期或者区间脉络当中。通常有这种异常强劲的推动，是因为价格受到真空效应的影响而着急赶忙的奔赴某一个支撑阻力。这种时候这个第二推就会被我们称为第二推陷阱。图中的例子就是深灰色段落比浅灰色段落更强劲的情况。这会让你以为要突破，还有后续，但其实一触碰到支撑阻力就失去跟进。随后是转入区间或者引发深幅回调，或甚至是直接反转。同样，关于真空高潮，第二推陷阱，区间的知识，可以在后面的单元深入讲解。在这里要抛出的重点是作为意外行情突破后，倾向有第二段运动。不过第二推以后是否还有后续要端看第二推的强度，太弱或太强，都不利于趋势健康发展。顺势方可能已经后继无力，或者根本是某种陷阱。我们先具备这样的知识，将来在阅读图表的过程中，时时刻刻会用上这样的知识点。你会发现，从此解读图表起来，能够看懂更多的多空竞合状态。","p":"p257"}]},{"t":"para","text":"说了这么多，我们来看看实例。实在很难找到一张图表，涵盖所有情况，不过这里有上述的，其中三种已经很难得了。且听我依次道来。首先是对旗型通道线的加速突破。刚刚说到下降通道，通常是牛旗，尤其当前在强劲的上升趋势中更是如此。在看到后续的K线以前，我们会主观认定向上突破的几率更高，有80%左右。不过，这根K线非常有趣。他在旗型内部的三次推动完成以后，试图向上突破。但结果如何呢？赶快学以致用一下，就这根K线跟它前一根阴线的关系。这是多头的突破失败。价格曾经短暂越过趋势阴线高点，但最后收了下来，实体完全处在一个不争气的位置。这也是对于前面提到的另一个观点的强调，所有影线都可能是某种失败的突破。因此，大大小小的突破其实有80%的几率失败发生的，比你想象的更频繁。而当向上突破失败以后，价格朝向意料之外的方向前进。向下也就是朝反方向收出的趋势阴线。而且还有两根跟进的趋势，阴线作为确认。这就属于意外的突破行情，将引发刚刚做多的人恐慌止损，而空头则踏空。想着赶紧追上。于是，当价格进入回调，这两方交易者就终于加入空头方向，促成了另外两根大阴线的等距运动。这正是突破之后，还有第二推的典型例证。二推完成以后，价格逐渐陷入横盘走进区间里。在区间中，同样要记得的是，对区间边线的多数突破都会失败。一旦画上区间边线，你就可以明显的感受到两次对上边线的突破，以失败告终，两次对下边线的突破，也以失败告终。双双无法越过前一次的极值。这就代表市场当下在这个价格地带找到了均衡。找到了能使最多人满意，使总体效益最大化的公平价位。但最后共识改变区间仍然被突破了，突破的方向是朝上。你可以看见，先是一根非常强劲的趋势阳线旱地拔葱而起。而且这还不是朝向区间边线的真空运动。后面还有饱满的光头K线作为确认。当然，突破边线才算突破。所以后续还要有跟进K线才令人安心。结果确实很安心，这根阳线也很强劲。所以在连续四根K线的急速运动以后，刚刚在区间内高抛低吸的交易者，如今同样面临被套和踏空的问题。你甚至可以说，之所以这些K线形成的这么坚决。就是因为有人甚至不等回调，就直接砍仓追涨，才会这么顺利的推动价格离开区间。而进入回调后，同样空头力量疲弱。作为嵌于上升趋势中一个横向的小型区间。向下的突破也统统是失败的。最后，引发朝向的第二推等距运动。测试到前方波段点的时候，刚好停了下来。我们再稍微倒转一下，回来看这个牛旗的那一步。在后 易者应该观察第二推的动能表现如何。并认为可能有以下三种结果。首先，先讲利于顺势方的情况。如果第二推强劲过程中减少回调，而且与第一推合并起来看待形成的是一个窄幅通道。那通常很容易有后续。原因是窄幅通道对应到更大时间级别图表上去看，可能依然是连续顺畅，而且坚决的急速突破走势。那回调以后，当然也还有第二段推动作为延续。请注意顺势方力量越强，只要不是高潮运动，有后续跟进的可能性就很高。那接着我们反过来讲，如果第二推很弱，那会怎么样呢？那有延续行情的可能性就会大幅降低。我现在标出来的就是第二推不够强劲的情况。空头经过横盘调整后，第二推非常弱，没有办法导致跟进。只能造成低点持平的双重底。原则上来说，如果逆势方与顺势方力量相近，那价格很可能转入区间状态。而如果逆势方非常踊跃，甚至可能发展成反转。那就这样的情况来看，虽然突破还有第二推，但第二推太弱了，趋势就终止在第二推。还有没有别种情况呢？有第三点。如果第二推相较于第一推实在太异常强劲，那趋势也有可能出问题。我尽量不要把这讲的很玄，还是清楚一点。这种情况通常出现在趋势末期或者区间脉络当中。通常有这种异常强劲的推动，是因为价格受到真空效应的影响而着急赶忙的奔赴某一个支撑阻力。这种时候这个第二推就会被我们称为第二推陷阱。图中的例子就是深灰色段落比浅灰色段落更强劲的情况。这会让你以为要突破，还有后续，但其实一触碰到支撑阻力就失去跟进。随后是转入区间或者引发深幅回调，或甚至是直接反转。同样，关于真空高潮，第二推陷阱，区间的知识，可以在后面的单元深入讲解。在这里要抛出的重点是作为意外行情突破后，倾向有第二段运动。不过第二推以后是否还有后续要端看第二推的强度，太弱或太强，都不利于趋势健康发展。顺势方可能已经后继无力，或者根本是某种陷阱。我们先具备这样的知识，将来在阅读图表的过程中，时时刻刻会用上这样的知识点。你会发现，从此解读图表起来，能够看懂更多的多空竞合状态。","p":"p257"},{"t":"好了，又到了课程收尾的时候。这个单元我们也谈了不少东西，希望你有所收获。首先，我们顺着上次提到的阅读单根K线的方法，进一步谈了如何做K线与K线之间相互关系的解释。对于市场中的多空双方来说，推动价格朝向，有利于自身的方向前进，是盈利的唯一方法。因此，双方总是在试图发起突破。多头希望造就向上的突破，空头希望推动向下的突破。而透过两两检视K线，我们能够在围观的尺度辨明是谁取得了暂时的胜利。相较于前一根K线，如果收线时能将实体收在高点之上，这是多头的突破成功。相反的，如果实体是收在低点之下，那就是空头的突破成功。而所有的影线都是突破失败的表征。而既然说到所有的影线都是突破失败的痕迹，那么你应该很容易可以联想得到。几乎每根K线都有影线。那其实突破常常发生，但也很常失败。用阿尔布鲁克斯的话来说，所谓的80%法则，一部分就包含了突破倾向失败的道理。市场更爱呆在均衡的状态中，任何单方面改变共识的努力都很不容易成真。不过，一旦低几率的事件，也就是突破启动趋势发起。那80%法则的另一半所要指设的就是趋势中的反转尝试倾向失败。既然产生突破，那说明多空已经改变共识。价格要接着朝向新的均衡处探寻。在找到新的公平价格地带，以前趋势也不会任意颠倒，动不动就朝反方向大力运行。关于突破，我们还给出的另一个概念是，既然突破倾向失败，那它就可以被认为是某种意外的行情。这也是为什么很多时候我们会称这些意外事件为pain trade，带来痛苦的交易。因为一旦发生，交易者要么被套，要么踏空，非常痛苦，会需要旋即修正做法来避免账面上或心理上的亏损进一步扩大。不过也正是因为这些调整做法的措施，被套的人止损，踏空的人追进，将导致回调很浅。大家都争先恐后的上车。双方合力会导致价格进一步发展，创造出回调结束后的第二段推动。于是我们可以认为，突破后倾向还有第二推。突破本身就是第一推，回调之后还有第二推。不太可能发生的事，一旦发生就会引发可观的延续。然而，趋势不见得结束在第二段推动。只要顺势力量依然强劲，在第二推极值被越过以后，还可以有新的突破，再引发新的二推组合。开启新的突破循环。所以到底还有没有后续要端看第二推的力道是否足够稳健？强劲的话，就还有后续，疲弱的话，就可能陷入区间或者反转。而在特定的情况下，也就是趋势末尾或区间脉络中，要小心异常强劲的第二推陷阱。这可能会将追入的交易者套在错误的方向。经过讲解，对价格行为的认识是不是更深刻了呢？过去，在自学的过程中，我就曾经对于市场中多数运动都能两两为一组的现象感到困惑。不太知道是基于什么原因。但如今，经过讲解，你应该在相对很短的时间内就明白了困扰我一两年的问题。在下个单元中，我们会接续着突破的话题来谈谈同等关键的测试。我想同样会对于你读图案交易都有莫大的帮助。感谢收看突破市场参与者的根本意图，我们下个单元见。","p":"p258"}]},{"t":"para","text":"好了，又到了课程收尾的时候。这个单元我们也谈了不少东西，希望你有所收获。首先，我们顺着上次提到的阅读单根K线的方法，进一步谈了如何做K线与K线之间相互关系的解释。对于市场中的多空双方来说，推动价格朝向，有利于自身的方向前进，是盈利的唯一方法。因此，双方总是在试图发起突破。多头希望造就向上的突破，空头希望推动向下的突破。而透过两两检视K线，我们能够在围观的尺度辨明是谁取得了暂时的胜利。相较于前一根K线，如果收线时能将实体收在高点之上，这是多头的突破成功。相反的，如果实体是收在低点之下，那就是空头的突破成功。而所有的影线都是突破失败的表征。而既然说到所有的影线都是突破失败的痕迹，那么你应该很容易可以联想得到。几乎每根K线都有影线。那其实突破常常发生，但也很常失败。用阿尔布鲁克斯的话来说，所谓的80%法则，一部分就包含了突破倾向失败的道理。市场更爱呆在均衡的状态中，任何单方面改变共识的努力都很不容易成真。不过，一旦低几率的事件，也就是突破启动趋势发起。那80%法则的另一半所要指设的就是趋势中的反转尝试倾向失败。既然产生突破，那说明多空已经改变共识。价格要接着朝向新的均衡处探寻。在找到新的公平价格地带，以前趋势也不会任意颠倒，动不动就朝反方向大力运行。关于突破，我们还给出的另一个概念是，既然突破倾向失败，那它就可以被认为是某种意外的行情。这也是为什么很多时候我们会称这些意外事件为pain trade，带来痛苦的交易。因为一旦发生，交易者要么被套，要么踏空，非常痛苦，会需要旋即修正做法来避免账面上或心理上的亏损进一步扩大。不过也正是因为这些调整做法的措施，被套的人止损，踏空的人追进，将导致回调很浅。大家都争先恐后的上车。双方合力会导致价格进一步发展，创造出回调结束后的第二段推动。于是我们可以认为，突破后倾向还有第二推。突破本身就是第一推，回调之后还有第二推。不太可能发生的事，一旦发生就会引发可观的延续。然而，趋势不见得结束在第二段推动。只要顺势力量依然强劲，在第二推极值被越过以后，还可以有新的突破，再引发新的二推组合。开启新的突破循环。所以到底还有没有后续要端看第二推的力道是否足够稳健？强劲的话，就还有后续，疲弱的话，就可能陷入区间或者反转。而在特定的情况下，也就是趋势末尾或区间脉络中，要小心异常强劲的第二推陷阱。这可能会将追入的交易者套在错误的方向。经过讲解，对价格行为的认识是不是更深刻了呢？过去，在自学的过程中，我就曾经对于市场中多数运动都能两两为一组的现象感到困惑。不太知道是基于什么原因。但如今，经过讲解，你应该在相对很短的时间内就明白了困扰我一两年的问题。在下个单元中，我们会接续着突破的话题来谈谈同等关键的测试。我想同样会对于你读图案交易都有莫大的帮助。感谢收看突破市场参与者的根本意图，我们下个单元见。","pid":"p258"}],"wcount":7960}],"wcount":14090},{"id":"l04","icon":"L04","title":"L04　测试市场对失衡的自我调节","blocks":[],"sections":[{"id":"l04A","title":"第A段　测试市场对失衡的自我调节","blocks":[{"t":"para","text":"L04A 测试市场对失衡的自我调节","pid":"p259"},{"t":"para","text":"突破的原理是非常关键的。我相信就算没有听过上个单元的课程，没有系统性深入了解过突破的内涵，初学者也可以对突破一词朗朗上口。并且不会忽视这个概念的重要性。不过测试呢，你看重测试吗？或者在我将测试这个单元列在课纲上以前。你可曾经想过，这是个必须透彻了解的概念。我会说，测试与突破密切相关。不只是相生相伴，重要性也绝对不亚于突破。在这个单元，我将依次说明为什么突破后必有测试。测试是怎么发生的？可能有哪些版本的结果？以及突破发生测试也发生以后，接下来市场会怎么样运动？听到这里，或许你感到有些抽象陌生。但很快，我会把一切都解释清楚。请跟随我逐步前进。上一次我们不是说到强劲突破发生以后被套和踏空的交易者会在回调中争先恐后的跟进吗？这种时候如果你已经持仓，那你大可放心，还有第二段推动会接着出现，它将为你创造利润。但是你一定有过类似的经验。发现价格突破某一个价位不久后又折返回突破点。此时回头看看，突破确实是发起了没错。但比起教科书式的毫不犹豫的急速，似乎动能还是差了那么一点。于是，那些所谓应该赶紧挤上趋势，已经被套和踏空的交易者似乎来的没有那么快。你也不确定他们到底还会不会出现。这么一来，你就陷入了某种迟疑，如果你错过了方才入场的时机，这时候你也许一方面谢天谢地。突破终究又回来接你上车。但也一方面担心，要是入场了，那第二推到底还会不会来？而如果你刚刚就已经建仓，这样的折返可能会让你陷入无限焦虑。毕竟你已经开始浮亏，说好的延续行情也还没有出现。这会让你开始着急，我到底该不该先平仓离场？以我的调查，99%的交易者都有这样的经验。被市场的不确定性骚扰无法下果决的决策。但请放心，市场跟大自然一样，它有自己的呼吸脉动倾向，内在的递嬗。但其所有行为绝对无意针对你。他就是这样，只是在做自己。你必须晓得，突破后折返进行所谓的测试是多空集体行为的结果，合乎市场本质，也是必然发生的现象。那么，我们要进一步问的问题是，为什么测试必然发生？是什么样的多空意图与行为导致？每逢突破，就必定有测试。要回答以上问题，我们要来进一步端详这一段突破，回调后又继续突破的行情。并细究ABC这三段推动。","pid":"p260"},{"t":"img","src":"assets/img/l04A_041.webp","ilabel":"4-1","icap":"L04　测试市场对失衡的自我调节","fid":"fig41","ctx":[{"t":"L04A 测试市场对失衡的自我调节","p":"p259"},{"t":"突破的原理是非常关键的。我相信就算没有听过上个单元的课程，没有系统性深入了解过突破的内涵，初学者也可以对突破一词朗朗上口。并且不会忽视这个概念的重要性。不过测试呢，你看重测试吗？或者在我将测试这个单元列在课纲上以前。你可曾经想过，这是个必须透彻了解的概念。我会说，测试与突破密切相关。不只是相生相伴，重要性也绝对不亚于突破。在这个单元，我将依次说明为什么突破后必有测试。测试是怎么发生的？可能有哪些版本的结果？以及突破发生测试也发生以后，接下来市场会怎么样运动？听到这里，或许你感到有些抽象陌生。但很快，我会把一切都解释清楚。请跟随我逐步前进。上一次我们不是说到强劲突破发生以后被套和踏空的交易者会在回调中争先恐后的跟进吗？这种时候如果你已经持仓，那你大可放心，还有第二段推动会接着出现，它将为你创造利润。但是你一定有过类似的经验。发现价格突破某一个价位不久后又折返回突破点。此时回头看看，突破确实是发起了没错。但比起教科书式的毫不犹豫的急速，似乎动能还是差了那么一点。于是，那些所谓应该赶紧挤上趋势，已经被套和踏空的交易者似乎来的没有那么快。你也不确定他们到底还会不会出现。这么一来，你就陷入了某种迟疑，如果你错过了方才入场的时机，这时候你也许一方面谢天谢地。突破终究又回来接你上车。但也一方面担心，要是入场了，那第二推到底还会不会来？而如果你刚刚就已经建仓，这样的折返可能会让你陷入无限焦虑。毕竟你已经开始浮亏，说好的延续行情也还没有出现。这会让你开始着急，我到底该不该先平仓离场？以我的调查，99%的交易者都有这样的经验。被市场的不确定性骚扰无法下果决的决策。但请放心，市场跟大自然一样，它有自己的呼吸脉动倾向，内在的递嬗。但其所有行为绝对无意针对你。他就是这样，只是在做自己。你必须晓得，突破后折返进行所谓的测试是多空集体行为的结果，合乎市场本质，也是必然发生的现象。那么，我们要进一步问的问题是，为什么测试必然发生？是什么样的多空意图与行为导致？每逢突破，就必定有测试。要回答以上问题，我们要来进一步端详这一段突破，回调后又继续突破的行情。并细究ABC这三段推动。","p":"p260"},{"t":"首先A发起的对吧？人们倾向突破失败的区间，似乎正要被突破成功。在这个瞬间，虽然我们可以透过对动能的观察认为这些趋势K线蛮强的，有机会造就成功的突破。不过应该就只是应该。即使我们的信心率高于50%，后面究竟会如何还是谁也不晓得。所以接下来就是考验所有市场参与者信心的时候了。多头扪心自问。你有把握突破成功吗？你的信心有高到不仅愿意继续持有已经开业的仓位。甚至还出钱出力，在建新仓来为你的多头伙伴们助阵，最后一起挤破空头的防守吗？而另一方面，空头也要面临抉择。虽然区间倾向突破失败，但人家现在已经越过了你的防守线。你愿意继续握持刚刚背靠阻力去建立的空单，继续砸下真金白银，把嚣张一时的多头都压回去吗？既然要测试信心，想必有人会开始怯懦。有些多头或许心想，接下来搞不好会上涨失败。还是说我应该先保全自己的利益，跑的比其他多头弟兄快一点，先把这短短的利润赚到再说。而空头可能在考虑，刚刚区间已经突破失败这么多次。搞不好这一次真的就要远离这个震荡的地带了。那我要不要先把刚刚建的空仓关起来，小亏离场，等到更高的地方再观望进场机会？好的，我想这无论是多头还是空头，无论是想着加仓还是偷跑，以上的心理活动你可能都经历过。而事实上，这也是在场内竞争激烈的多空机构所需要不断去烦恼的事。","p":"p261"},{"t":"不过时间不等人，没有人可以慢吞吞的决定。这场真金白银的投票，在非常短的时间内就必须完成并产生结果，而且这个结果就是我们刚刚说的测试这个行为本身。在图表上B段的回调就是测试。测试结果将告诉你，刚刚的突破是否还能有后续。为什么要测试呢？就如我们强调的，市场喜欢待在均衡的状态。因此，突破这种失衡作为异常，市场会自动尝试代谢它，抑制它。这边使用的是拟人化的比喻，好像市场本身有抗体，会像打击病毒一样的去抵抗突破的发生。但就如刚刚说的，其实是多空双方角力斗志的结果。因此，当你看到价格在突破后开始折返这个行为，本身是怕死想跑的那批多头。他们之间在相互竞争，谁能卖得更早更巧？你可以先把它想象成只有三个人就好，罐罐宗玉太妃都已经在上涨过程中建仓。这些人打着算盘都想卖得最晚，在最高处止盈。但彼此都要提防对方抢先离场。假设所有人都相互信任，或许价格能直接上月球。但是罐罐忌惮宗玉和太妃，所以他打算先下手为强，上涨到这里就先跑掉。但宗玉更贼预判了罐罐的预判。所以他心里想的是，在稍微更低一点的地方就先获利了结。而太妃也得同样猜忌自己的两位对手盘算在哪里卖出更好。于是，这种多方奖励的结果就是，当价格突破到某个程度，总会有人先开始离场。而直到继续追进，拖着价格继续升高的交易者，在数量上已经不敌打算先落袋为安的止盈力量。那价格就会开始回落。而回落就会让空方嗅到多头弱势的空隙，开始思考决定要趁人之危并陆续进场。所以我们挂在嘴边的回调就开始产生。突破没有办法顺利一飞冲天。总会有逆势订单的作用导致突破可能失败。也许你会接着产生困惑。为什么太妃不把这个B段叫做回调就好了，而是要叫她测试呢？当然，我没有随便选一个词语来表示它。称它为测试是有原因的。那要测试什么呢？这就关乎到回调的结束。刚刚我们讨论了回调的启动，对吧？开始是浮盈者，相互猜忌。逆势方趁机介入所导致的。那这段回调何时结束？聪明的你只要想一想，就会知道B段结束于多头重新入场，而空头止盈离开的时候。所以使用测试一词，其实是想要测试多头，也就是突破发起者这方力量是否足够充分。是否有意愿捍卫突破的发起？同样，我们可以再把市场中的多头行动者分成两批。第一批是前面提到的罐罐宗玉太妃，这些原本已经入场，但相互猜忌提前止盈的这几位。这段回调作为测试要考验的就是价格刚刚是从这里发起突破。那么，回到这里以后，你们还有没有信心认为其他交易者会惦记，会参考刚刚暂时突破成功的历史。决定在这里重新做多导致突破，再次成功呢。如果你有信心，你就会在这里重新入场。这样你可能不止赚了，刚刚那一小段彻底消灭浮盈之前的利润。你还能够再搭上一波新的上涨列车？所考验的第二批对象是谁呢？是那些从头到尾都没有像我们三个一样贪生怕死，一直坚定持仓的交易者。价格折返到这里，同样是要考验他们现在价格已经威逼到你们突破进场的地方了哦。那谁知道它接下来还会不会下跌的更深。你们愿意承担盈亏平衡甚至是浮亏的风险，也依然要坚定持仓吗？甚至是你们还愿意再跟刚刚同样的价位再次建仓，扩大你们的暴露风险，以争取更高的利润吗？没错，这波折返就是对突破发起方的心灵拷问。你们发起的突破，却因为不团结，有人偷跑，让价格又落了回去。那现在我倒要看看你们愿意共同展现信心了没有？不过难道只有多头要烦恼吗？空头也必须针对这波折回做出反应。你一定还记得上个单元，我们在讨论突破时说过。相对于突破发起方，另一边就是要负责防守的那一方。逆势方在这个例子里是这些空头。他们也永远想要造成突破失败。因为只有多头突破失败，价格才会往低处折返。让这些用钞票相挺建立空仓的空头友军们能够在下跌过程中获利。因此，在突破点处要伤透脑筋的除了上述这两批空仓中跟持仓中的多头。先正握着空单以及还没开仓的空头，也都要考虑接下来该如何行动。对于刚才在区间顶部开空的交易者们。他们原本预期价格下跌，却涨了上去。但幸好价格现在又返了，回来在回调中给他们原地平仓的机会。这时候要逃吗？要立即平仓来抚慰。刚刚担惊受怕的心情吗？还是要进取一点呢。心想着区间本来就倾向突破失败，我先前的判断是正确的。接下来就只会区间内部开启下跌的几率更大，所以我要坚定持仓。用莎士比亚的话来讲，那就是to离场or not to离场that's the question。还有另一批潜在空头也要做出抉择，刚才他们什么也没有做。对于自己什么也没做的事实，他们在上涨过程中或许会觉得幸亏自己没有递送空单。能够逃过一劫。不过现在看到价格折返，他们可能就又见风转舵了。这些人后脑勺一拍，猛然想起来，对耶，区间倾向突破失败，这不就是80%法则的体现吗？那我现在是要不要趁多头力量溢散之际，赶紧建立刚刚没能在高处建立的空仓，准备赚取下跌的利润？还是说有可能我一做进去多头力量就又恢复，直接把我卡在一个很可笑的位置。说到这里，你应该能够清楚的感受到所有行动者都陷入了进退维谷的局面。展示了多空双方持仓者与空仓者的心理活动，以后您应该已经明白，所谓的测试。也就是这段回调的启动，完全是所有利己的参与者自找的。你想如果这三个小朋友早在一开始砸下去买进建立的仓位够大。而且大家都很有义气，谁也不偷跑，突破不就顺利发生了吗？可惜这是不可能的。市场中所有人都很精明，随时用上最顶尖的算法，想着怎么样能从对方的口袋里刮钱。所以要是大家都说好要死死拿着不卖出，而我率先偷偷背叛，那我不就立即成为赢家？所有人都这么想，也于是所有人都互相提防，所有人都试着预判对方的预判。你不难发现，这是最典型的囚徒困境，没有人会抱着善意共建美好未来。你不只要忌惮自己人，你还要跟与你反向的交易者对抗。也正是因为这样回调是一定会启动的，价格就是会折回来，逼迫大家面对新的考验。而且在连续的时间内，所有人要不断以真金白银投票，然后得出一个结果。突破到底是成功还是不成功？这就观看四方行动者的角力了。而且这种投票每逢突破就要重新进行一次，没完没了，每次答案还都不一样。如此一来，市场就能不断保持被不确定性笼罩的状态，永远没有一个固定的做法。比如，每逢突破就无脑买进这种死板的方法，一定没有办法赚到钱。测试的机制将扼杀这种天真的可能性。好，我们在刚刚的例子上转了很久，我们进一步收述一下，梳理成条例的重点，供大家参考。","p":"p262"}]},{"t":"para","text":"首先A发起的对吧？人们倾向突破失败的区间，似乎正要被突破成功。在这个瞬间，虽然我们可以透过对动能的观察认为这些趋势K线蛮强的，有机会造就成功的突破。不过应该就只是应该。即使我们的信心率高于50%，后面究竟会如何还是谁也不晓得。所以接下来就是考验所有市场参与者信心的时候了。多头扪心自问。你有把握突破成功吗？你的信心有高到不仅愿意继续持有已经开业的仓位。甚至还出钱出力，在建新仓来为你的多头伙伴们助阵，最后一起挤破空头的防守吗？而另一方面，空头也要面临抉择。虽然区间倾向突破失败，但人家现在已经越过了你的防守线。你愿意继续握持刚刚背靠阻力去建立的空单，继续砸下真金白银，把嚣张一时的多头都压回去吗？既然要测试信心，想必有人会开始怯懦。有些多头或许心想，接下来搞不好会上涨失败。还是说我应该先保全自己的利益，跑的比其他多头弟兄快一点，先把这短短的利润赚到再说。而空头可能在考虑，刚刚区间已经突破失败这么多次。搞不好这一次真的就要远离这个震荡的地带了。那我要不要先把刚刚建的空仓关起来，小亏离场，等到更高的地方再观望进场机会？好的，我想这无论是多头还是空头，无论是想着加仓还是偷跑，以上的心理活动你可能都经历过。而事实上，这也是在场内竞争激烈的多空机构所需要不断去烦恼的事。","pid":"p261"},{"t":"para","text":"不过时间不等人，没有人可以慢吞吞的决定。这场真金白银的投票，在非常短的时间内就必须完成并产生结果，而且这个结果就是我们刚刚说的测试这个行为本身。在图表上B段的回调就是测试。测试结果将告诉你，刚刚的突破是否还能有后续。为什么要测试呢？就如我们强调的，市场喜欢待在均衡的状态。因此，突破这种失衡作为异常，市场会自动尝试代谢它，抑制它。这边使用的是拟人化的比喻，好像市场本身有抗体，会像打击病毒一样的去抵抗突破的发生。但就如刚刚说的，其实是多空双方角力斗志的结果。因此，当你看到价格在突破后开始折返这个行为，本身是怕死想跑的那批多头。他们之间在相互竞争，谁能卖得更早更巧？你可以先把它想象成只有三个人就好，罐罐宗玉太妃都已经在上涨过程中建仓。这些人打着算盘都想卖得最晚，在最高处止盈。但彼此都要提防对方抢先离场。假设所有人都相互信任，或许价格能直接上月球。但是罐罐忌惮宗玉和太妃，所以他打算先下手为强，上涨到这里就先跑掉。但宗玉更贼预判了罐罐的预判。所以他心里想的是，在稍微更低一点的地方就先获利了结。而太妃也得同样猜忌自己的两位对手盘算在哪里卖出更好。于是，这种多方奖励的结果就是，当价格突破到某个程度，总会有人先开始离场。而直到继续追进，拖着价格继续升高的交易者，在数量上已经不敌打算先落袋为安的止盈力量。那价格就会开始回落。而回落就会让空方嗅到多头弱势的空隙，开始思考决定要趁人之危并陆续进场。所以我们挂在嘴边的回调就开始产生。突破没有办法顺利一飞冲天。总会有逆势订单的作用导致突破可能失败。也许你会接着产生困惑。为什么太妃不把这个B段叫做回调就好了，而是要叫她测试呢？当然，我没有随便选一个词语来表示它。称它为测试是有原因的。那要测试什么呢？这就关乎到回调的结束。刚刚我们讨论了回调的启动，对吧？开始是浮盈者，相互猜忌。逆势方趁机介入所导致的。那这段回调何时结束？聪明的你只要想一想，就会知道B段结束于多头重新入场，而空头止盈离开的时候。所以使用测试一词，其实是想要测试多头，也就是突破发起者这方力量是否足够充分。是否有意愿捍卫突破的发起？同样，我们可以再把市场中的多
