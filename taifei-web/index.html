另一方面，空头也要面临抉择。虽然区间倾向突破失败，但人家现在已经越过了你的防守线。你愿意继续握持刚刚背靠阻力去建立的空单，继续砸下真金白银，把嚣张一时的多头都压回去吗？既然要测试信心，想必有人会开始怯懦。有些多头或许心想，接下来搞不好会上涨失败。还是说我应该先保全自己的利益，跑的比其他多头弟兄快一点，先把这短短的利润赚到再说。而空头可能在考虑，刚刚区间已经突破失败这么多次。搞不好这一次真的就要远离这个震荡的地带了。那我要不要先把刚刚建的空仓关起来，小亏离场，等到更高的地方再观望进场机会？好的，我想这无论是多头还是空头，无论是想着加仓还是偷跑，以上的心理活动你可能都经历过。而事实上，这也是在场内竞争激烈的多空机构所需要不断去烦恼的事。","p":"p261"},{"t":"不过时间不等人，没有人可以慢吞吞的决定。这场真金白银的投票，在非常短的时间内就必须完成并产生结果，而且这个结果就是我们刚刚说的测试这个行为本身。在图表上B段的回调就是测试。测试结果将告诉你，刚刚的突破是否还能有后续。为什么要测试呢？就如我们强调的，市场喜欢待在均衡的状态。因此，突破这种失衡作为异常，市场会自动尝试代谢它，抑制它。这边使用的是拟人化的比喻，好像市场本身有抗体，会像打击病毒一样的去抵抗突破的发生。但就如刚刚说的，其实是多空双方角力斗志的结果。因此，当你看到价格在突破后开始折返这个行为，本身是怕死想跑的那批多头。他们之间在相互竞争，谁能卖得更早更巧？你可以先把它想象成只有三个人就好，罐罐宗玉太妃都已经在上涨过程中建仓。这些人打着算盘都想卖得最晚，在最高处止盈。但彼此都要提防对方抢先离场。假设所有人都相互信任，或许价格能直接上月球。但是罐罐忌惮宗玉和太妃，所以他打算先下手为强，上涨到这里就先跑掉。但宗玉更贼预判了罐罐的预判。所以他心里想的是，在稍微更低一点的地方就先获利了结。而太妃也得同样猜忌自己的两位对手盘算在哪里卖出更好。于是，这种多方奖励的结果就是，当价格突破到某个程度，总会有人先开始离场。而直到继续追进，拖着价格继续升高的交易者，在数量上已经不敌打算先落袋为安的止盈力量。那价格就会开始回落。而回落就会让空方嗅到多头弱势的空隙，开始思考决定要趁人之危并陆续进场。所以我们挂在嘴边的回调就开始产生。突破没有办法顺利一飞冲天。总会有逆势订单的作用导致突破可能失败。也许你会接着产生困惑。为什么太妃不把这个B段叫做回调就好了，而是要叫她测试呢？当然，我没有随便选一个词语来表示它。称它为测试是有原因的。那要测试什么呢？这就关乎到回调的结束。刚刚我们讨论了回调的启动，对吧？开始是浮盈者，相互猜忌。逆势方趁机介入所导致的。那这段回调何时结束？聪明的你只要想一想，就会知道B段结束于多头重新入场，而空头止盈离开的时候。所以使用测试一词，其实是想要测试多头，也就是突破发起者这方力量是否足够充分。是否有意愿捍卫突破的发起？同样，我们可以再把市场中的多头行动者分成两批。第一批是前面提到的罐罐宗玉太妃，这些原本已经入场，但相互猜忌提前止盈的这几位。这段回调作为测试要考验的就是价格刚刚是从这里发起突破。那么，回到这里以后，你们还有没有信心认为其他交易者会惦记，会参考刚刚暂时突破成功的历史。决定在这里重新做多导致突破，再次成功呢。如果你有信心，你就会在这里重新入场。这样你可能不止赚了，刚刚那一小段彻底消灭浮盈之前的利润。你还能够再搭上一波新的上涨列车？所考验的第二批对象是谁呢？是那些从头到尾都没有像我们三个一样贪生怕死，一直坚定持仓的交易者。价格折返到这里，同样是要考验他们现在价格已经威逼到你们突破进场的地方了哦。那谁知道它接下来还会不会下跌的更深。你们愿意承担盈亏平衡甚至是浮亏的风险，也依然要坚定持仓吗？甚至是你们还愿意再跟刚刚同样的价位再次建仓，扩大你们的暴露风险，以争取更高的利润吗？没错，这波折返就是对突破发起方的心灵拷问。你们发起的突破，却因为不团结，有人偷跑，让价格又落了回去。那现在我倒要看看你们愿意共同展现信心了没有？不过难道只有多头要烦恼吗？空头也必须针对这波折回做出反应。你一定还记得上个单元，我们在讨论突破时说过。相对于突破发起方，另一边就是要负责防守的那一方。逆势方在这个例子里是这些空头。他们也永远想要造成突破失败。因为只有多头突破失败，价格才会往低处折返。让这些用钞票相挺建立空仓的空头友军们能够在下跌过程中获利。因此，在突破点处要伤透脑筋的除了上述这两批空仓中跟持仓中的多头。先正握着空单以及还没开仓的空头，也都要考虑接下来该如何行动。对于刚才在区间顶部开空的交易者们。他们原本预期价格下跌，却涨了上去。但幸好价格现在又返了，回来在回调中给他们原地平仓的机会。这时候要逃吗？要立即平仓来抚慰。刚刚担惊受怕的心情吗？还是要进取一点呢。心想着区间本来就倾向突破失败，我先前的判断是正确的。接下来就只会区间内部开启下跌的几率更大，所以我要坚定持仓。用莎士比亚的话来讲，那就是to离场or not to离场that's the question。还有另一批潜在空头也要做出抉择，刚才他们什么也没有做。对于自己什么也没做的事实，他们在上涨过程中或许会觉得幸亏自己没有递送空单。能够逃过一劫。不过现在看到价格折返，他们可能就又见风转舵了。这些人后脑勺一拍，猛然想起来，对耶，区间倾向突破失败，这不就是80%法则的体现吗？那我现在是要不要趁多头力量溢散之际，赶紧建立刚刚没能在高处建立的空仓，准备赚取下跌的利润？还是说有可能我一做进去多头力量就又恢复，直接把我卡在一个很可笑的位置。说到这里，你应该能够清楚的感受到所有行动者都陷入了进退维谷的局面。展示了多空双方持仓者与空仓者的心理活动，以后您应该已经明白，所谓的测试。也就是这段回调的启动，完全是所有利己的参与者自找的。你想如果这三个小朋友早在一开始砸下去买进建立的仓位够大。而且大家都很有义气，谁也不偷跑，突破不就顺利发生了吗？可惜这是不可能的。市场中所有人都很精明，随时用上最顶尖的算法，想着怎么样能从对方的口袋里刮钱。所以要是大家都说好要死死拿着不卖出，而我率先偷偷背叛，那我不就立即成为赢家？所有人都这么想，也于是所有人都互相提防，所有人都试着预判对方的预判。你不难发现，这是最典型的囚徒困境，没有人会抱着善意共建美好未来。你不只要忌惮自己人，你还要跟与你反向的交易者对抗。也正是因为这样回调是一定会启动的，价格就是会折回来，逼迫大家面对新的考验。而且在连续的时间内，所有人要不断以真金白银投票，然后得出一个结果。突破到底是成功还是不成功？这就观看四方行动者的角力了。而且这种投票每逢突破就要重新进行一次，没完没了，每次答案还都不一样。如此一来，市场就能不断保持被不确定性笼罩的状态，永远没有一个固定的做法。比如，每逢突破就无脑买进这种死板的方法，一定没有办法赚到钱。测试的机制将扼杀这种天真的可能性。好，我们在刚刚的例子上转了很久，我们进一步收述一下，梳理成条例的重点，供大家参考。","p":"p262"},{"t":"如今你已经知道测试是必然发生的。多空双方基于自身利益的最大化，导致这种在市场中不断重复的集体行为。而测试的目的就是要确认多空的意图，你们到底准备好要突破了吗？还需要在均衡的区间里再呆一下。当然，市场更喜欢均衡。所以透过测试，它可以抑制失衡，也就是突破的发生。只有在多空真的认定，我们准备好突破了均衡，应该在其他地方突破才会被确认。价格进入急速运动状态。因此，你可以说，每当市场做出某种行为，比如突破。通常都必须对其已完成的事情测试过一次，然后才能决定接下来该做什么。对于所谓的测试，我们也就可以给它一个比较严谨的定义。那就是价格回到一个支撑或阻力区域，比如突破点确认多空双方的意愿究竟如何？刚才我们展示了测试的结果，由四批人的共同决策所产生。不过，发起方有空仓中的和持仓中的他们在价格折返到突破点的时候必须考虑。我是要不要坚持突破能成功的观点，开始建仓加仓，为推动的突破尽一份心力？而防守方也有空仓中和持仓中的，他们也必须决定我要不要继续尝试抵制突破，造成突破失败。如果要，我就同样得开始建空仓加码卖出。这样做明智吗？也许这就像政党政治一样，针对突破能否成功，这项议案过程中有人坚守立场，有人跑票。但无论如何，总归票多的赢票少的输。如果在上升突破中多头压过空头，那突破就成功。最终导致上涨的第二段推动。而反过来，要是买入不够旺盛，被看随突破成功的空头交易者倾压过去。突破就会失败，转回到原本均衡的脉络中。听到这里，你可能觉得测试是个坏东西，它总是威逼你，使你怀疑恐慌。使你可能好不容易建仓，又临阵退缩，使你决心不去参与，但又贪婪冒进。但我自己是觉得这正是市场引人入胜的地方。实在是可爱又迷人的反派角色。测试所带来的不确定性并不是魔咒，不要陷进去，觉得灰心转不出来。聪明的你一定知道该怎么做。","p":"p263"}]},{"t":"para","text":"如今你已经知道测试是必然发生的。多空双方基于自身利益的最大化，导致这种在市场中不断重复的集体行为。而测试的目的就是要确认多空的意图，你们到底准备好要突破了吗？还需要在均衡的区间里再呆一下。当然，市场更喜欢均衡。所以透过测试，它可以抑制失衡，也就是突破的发生。只有在多空真的认定，我们准备好突破了均衡，应该在其他地方突破才会被确认。价格进入急速运动状态。因此，你可以说，每当市场做出某种行为，比如突破。通常都必须对其已完成的事情测试过一次，然后才能决定接下来该做什么。对于所谓的测试，我们也就可以给它一个比较严谨的定义。那就是价格回到一个支撑或阻力区域，比如突破点确认多空双方的意愿究竟如何？刚才我们展示了测试的结果，由四批人的共同决策所产生。不过，发起方有空仓中的和持仓中的他们在价格折返到突破点的时候必须考虑。我是要不要坚持突破能成功的观点，开始建仓加仓，为推动的突破尽一份心力？而防守方也有空仓中和持仓中的，他们也必须决定我要不要继续尝试抵制突破，造成突破失败。如果要，我就同样得开始建空仓加码卖出。这样做明智吗？也许这就像政党政治一样，针对突破能否成功，这项议案过程中有人坚守立场，有人跑票。但无论如何，总归票多的赢票少的输。如果在上升突破中多头压过空头，那突破就成功。最终导致上涨的第二段推动。而反过来，要是买入不够旺盛，被看随突破成功的空头交易者倾压过去。突破就会失败，转回到原本均衡的脉络中。听到这里，你可能觉得测试是个坏东西，它总是威逼你，使你怀疑恐慌。使你可能好不容易建仓，又临阵退缩，使你决心不去参与，但又贪婪冒进。但我自己是觉得这正是市场引人入胜的地方。实在是可爱又迷人的反派角色。测试所带来的不确定性并不是魔咒，不要陷进去，觉得灰心转不出来。聪明的你一定知道该怎么做。","pid":"p263"},{"t":"img","src":"assets/img/l04A_043.webp","ilabel":"4-3","icap":"L04　测试市场对失衡的自我调节","fid":"fig43","ctx":[{"t":"如今你已经知道测试是必然发生的。多空双方基于自身利益的最大化，导致这种在市场中不断重复的集体行为。而测试的目的就是要确认多空的意图，你们到底准备好要突破了吗？还需要在均衡的区间里再呆一下。当然，市场更喜欢均衡。所以透过测试，它可以抑制失衡，也就是突破的发生。只有在多空真的认定，我们准备好突破了均衡，应该在其他地方突破才会被确认。价格进入急速运动状态。因此，你可以说，每当市场做出某种行为，比如突破。通常都必须对其已完成的事情测试过一次，然后才能决定接下来该做什么。对于所谓的测试，我们也就可以给它一个比较严谨的定义。那就是价格回到一个支撑或阻力区域，比如突破点确认多空双方的意愿究竟如何？刚才我们展示了测试的结果，由四批人的共同决策所产生。不过，发起方有空仓中的和持仓中的他们在价格折返到突破点的时候必须考虑。我是要不要坚持突破能成功的观点，开始建仓加仓，为推动的突破尽一份心力？而防守方也有空仓中和持仓中的，他们也必须决定我要不要继续尝试抵制突破，造成突破失败。如果要，我就同样得开始建空仓加码卖出。这样做明智吗？也许这就像政党政治一样，针对突破能否成功，这项议案过程中有人坚守立场，有人跑票。但无论如何，总归票多的赢票少的输。如果在上升突破中多头压过空头，那突破就成功。最终导致上涨的第二段推动。而反过来，要是买入不够旺盛，被看随突破成功的空头交易者倾压过去。突破就会失败，转回到原本均衡的脉络中。听到这里，你可能觉得测试是个坏东西，它总是威逼你，使你怀疑恐慌。使你可能好不容易建仓，又临阵退缩，使你决心不去参与，但又贪婪冒进。但我自己是觉得这正是市场引人入胜的地方。实在是可爱又迷人的反派角色。测试所带来的不确定性并不是魔咒，不要陷进去，觉得灰心转不出来。聪明的你一定知道该怎么做。","p":"p263"},{"t":"你只要观察测试时的价格行为，再选择如何下单就可以了。也就是分析突破发生后，价格回返突破点处的行为。既然我们知道突破成功，必定是突破发起方出钱出力，尽力保护突破的成功。那就很简单，看看他们再次出力了没有？在测试时，假如逆势方看起来很弱，那或许就是我们进行顺势交易，搭上突破后第二推的顺风车的时候。而如果测试过程中突破发起方，看起来没有积极进取的意思，反倒是防守方趁机加大力量。那交易者就不应该朝向突破方向，建立仓位，甚至应该考虑押注反转成立。因此，在关键的位置便是动能强弱的技能又再次派上用场。上个单元里，我们提到阿尔布鲁克斯，认为判断突破能否成功是交易者最应该具备的技能。这一点都不夸张。测试过程中，多空角力的结果也必定会以K线的样态显露痕迹，提供你作为决策的参考。于是以刚刚相同的这个例子来讲，一根贯穿突破点的趋势阴线可能让你紧张。但也请别忘记上个单元，我们一再强调的突破要有跟进，作为确认。所以这里正是我们需要去判断动能，判断测试时多空双方反应的时候。如果接的又是实体不错的阴线，那突破就有很高的几率失败。可如果没有阴线跟进，反而收了阳线，它代表空头或许没什么气力。再如果你看到的是很强劲的阳线，那可能代表买单回来了，是多头交易者重新进场。使空头交易者止盈离开，总之多压过空。我们于是紧盯下一根K线的表现，盘算对各种剧本的应对方式。然后做出迅速专业的判断。结果呢，是一根趋势阳线。马上来检查一下它跟前一根趋势阴线的关系。空头有突破成功吗？价格确实短暂下破过阴线低点，甚至有一点跳空的迹象，阳线开盘低于阴线收盘。但有气无力，立刻被多头扭转。那多头呢，有向上突破成功吗？稍微有一点，可惜努力还不够，没有成功突破阴线高点。对于希望在测试以后顺势加入多头的交易者来说，他们最乐见的可能是阳线再长一点。确实，对趋势应先完成反转。但就动能来说，其实这离完美状态相距不远。开盘与收盘之间依然创出了粗涌的阳线，实体向上拉扯的幅度还是蛮大的。这也算是个好消息，加入趋势不能说十拿九稳，但也有一定的胜算。在讲解原理的阶段，我无意指挥你如何入场？这是课程后半段讲交易方法的时候，才会去深入的话题。但在这里可以跟你先说，依照不同的交易风格或激进或保守，这里至少有两种不同的介入方法。第一种是赶紧买进，胜率低一点也在所不惜的类型。有些多头交易者早在阳线收线以前，就先在阴线顶部放置停止订单买入，准备在上破的瞬间立即入场。为什么可以这样做呢？因为在这根K线生成的过程中，即使还看不到最后的结果，但总之，只要他的买单被触发，那就代表在这段时间中多头发起了突破的尝试。有一瞬间吞没掉了前一根K线。多头都能够从如此低的地方拉起一根阳线，触发我的停止订单，那肯定是空头置身事外才会给多头这样的机会。所以提前挂上停止订单，等待突破后触发入场，这是一种选项。另一种选择就稍微保守一点，眼见为平比较安心。所以第二类的交易者不仅要看到明确的阳线，他还要有后续的跟进，继而确认空头失败，突破成功。只有当跟进K线也确认收线了，而且说的好看，它才以市价追进。两者之间的差异就在一个确定性较低，但可争取的利润空间较大。另一个则是偏好更高的确定性，并以利润空间缩小作为代价。当然咯，更激进或更保守的人也大有人在。比如刚刚说的第一类人，还可以再细分为1a，1b两种。前者继续坚持阴线应该被上破，而后者则取消先前的停止订单，改挂在最新的这根阳线头上，认为这根阳线高点再被突破就可以了，这代表多头依然进去。而我们说的第二种也可能分为2a，2b。一个在跟进阳线收线后，就立刻以市价跟进。另一个则还要再看到跟进阳线高点被突破后才愿意入场。没有一定之规，大家可以按照自己的风险爱好自由选择。我只是想要先趁机提醒你思考跟决定自己的风格，对你总体的交易生涯来说是重要的事。这个例子可以提供一个素材，让你从现在开始考虑。","p":"p264"}]},{"t":"para","text":"你只要观察测试时的价格行为，再选择如何下单就可以了。也就是分析突破发生后，价格回返突破点处的行为。既然我们知道突破成功，必定是突破发起方出钱出力，尽力保护突破的成功。那就很简单，看看他们再次出力了没有？在测试时，假如逆势方看起来很弱，那或许就是我们进行顺势交易，搭上突破后第二推的顺风车的时候。而如果测试过程中突破发起方，看起来没有积极进取的意思，反倒是防守方趁机加大力量。那交易者就不应该朝向突破方向，建立仓位，甚至应该考虑押注反转成立。因此，在关键的位置便是动能强弱的技能又再次派上用场。上个单元里，我们提到阿尔布鲁克斯，认为判断突破能否成功是交易者最应该具备的技能。这一点都不夸张。测试过程中，多空角力的结果也必定会以K线的样态显露痕迹，提供你作为决策的参考。于是以刚刚相同的这个例子来讲，一根贯穿突破点的趋势阴线可能让你紧张。但也请别忘记上个单元，我们一再强调的突破要有跟进，作为确认。所以这里正是我们需要去判断动能，判断测试时多空双方反应的时候。如果接的又是实体不错的阴线，那突破就有很高的几率失败。可如果没有阴线跟进，反而收了阳线，它代表空头或许没什么气力。再如果你看到的是很强劲的阳线，那可能代表买单回来了，是多头交易者重新进场。使空头交易者止盈离开，总之多压过空。我们于是紧盯下一根K线的表现，盘算对各种剧本的应对方式。然后做出迅速专业的判断。结果呢，是一根趋势阳线。马上来检查一下它跟前一根趋势阴线的关系。空头有突破成功吗？价格确实短暂下破过阴线低点，甚至有一点跳空的迹象，阳线开盘低于阴线收盘。但有气无力，立刻被多头扭转。那多头呢，有向上突破成功吗？稍微有一点，可惜努力还不够，没有成功突破阴线高点。对于希望在测试以后顺势加入多头的交易者来说，他们最乐见的可能是阳线再长一点。确实，对趋势应先完成反转。但就动能来说，其实这离完美状态相距不远。开盘与收盘之间依然创出了粗涌的阳线，实体向上拉扯的幅度还是蛮大的。这也算是个好消息，加入趋势不能说十拿九稳，但也有一定的胜算。在讲解原理的阶段，我无意指挥你如何入场？这是课程后半段讲交易方法的时候，才会去深入的话题。但在这里可以跟你先说，依照不同的交易风格或激进或保守，这里至少有两种不同的介入方法。第一种是赶紧买进，胜率低一点也在所不惜的类型。有些多头交易者早在阳线收线以前，就先在阴线顶部放置停止订单买入，准备在上破的瞬间立即入场。为什么可以这样做呢？因为在这根K线生成的过程中，即使还看不到最后的结果，但总之，只要他的买单被触发，那就代表在这段时间中多头发起了突破的尝试。有一瞬间吞没掉了前一根K线。多头都能够从如此低的地方拉起一根阳线，触发我的停止订单，那肯定是空头置身事外才会给多头这样的机会。所以提前挂上停止订单，等待突破后触发入场，这是一种选项。另一种选择就稍微保守一点，眼见为平比较安心。所以第二类的交易者不仅要看到明确的阳线，他还要有后续的跟进，继而确认空头失败，突破成功。只有当跟进K线也确认收线了，而且说的好看，它才以市价追进。两者之间的差异就在一个确定性较低，但可争取的利润空间较大。另一个则是偏好更高的确定性，并以利润空间缩小作为代价。当然咯，更激进或更保守的人也大有人在。比如刚刚说的第一类人，还可以再细分为1a，1b两种。前者继续坚持阴线应该被上破，而后者则取消先前的停止订单，改挂在最新的这根阳线头上，认为这根阳线高点再被突破就可以了，这代表多头依然进去。而我们说的第二种也可能分为2a，2b。一个在跟进阳线收线后，就立刻以市价跟进。另一个则还要再看到跟进阳线高点被突破后才愿意入场。没有一定之规，大家可以按照自己的风险爱好自由选择。我只是想要先趁机提醒你思考跟决定自己的风格，对你总体的交易生涯来说是重要的事。这个例子可以提供一个素材，让你从现在开始考虑。","pid":"p264"},{"t":"img","src":"assets/img/l04A_044.webp","ilabel":"4-4","icap":"L04　测试市场对失衡的自我调节","fid":"fig44","ctx":[{"t":"你只要观察测试时的价格行为，再选择如何下单就可以了。也就是分析突破发生后，价格回返突破点处的行为。既然我们知道突破成功，必定是突破发起方出钱出力，尽力保护突破的成功。那就很简单，看看他们再次出力了没有？在测试时，假如逆势方看起来很弱，那或许就是我们进行顺势交易，搭上突破后第二推的顺风车的时候。而如果测试过程中突破发起方，看起来没有积极进取的意思，反倒是防守方趁机加大力量。那交易者就不应该朝向突破方向，建立仓位，甚至应该考虑押注反转成立。因此，在关键的位置便是动能强弱的技能又再次派上用场。上个单元里，我们提到阿尔布鲁克斯，认为判断突破能否成功是交易者最应该具备的技能。这一点都不夸张。测试过程中，多空角力的结果也必定会以K线的样态显露痕迹，提供你作为决策的参考。于是以刚刚相同的这个例子来讲，一根贯穿突破点的趋势阴线可能让你紧张。但也请别忘记上个单元，我们一再强调的突破要有跟进，作为确认。所以这里正是我们需要去判断动能，判断测试时多空双方反应的时候。如果接的又是实体不错的阴线，那突破就有很高的几率失败。可如果没有阴线跟进，反而收了阳线，它代表空头或许没什么气力。再如果你看到的是很强劲的阳线，那可能代表买单回来了，是多头交易者重新进场。使空头交易者止盈离开，总之多压过空。我们于是紧盯下一根K线的表现，盘算对各种剧本的应对方式。然后做出迅速专业的判断。结果呢，是一根趋势阳线。马上来检查一下它跟前一根趋势阴线的关系。空头有突破成功吗？价格确实短暂下破过阴线低点，甚至有一点跳空的迹象，阳线开盘低于阴线收盘。但有气无力，立刻被多头扭转。那多头呢，有向上突破成功吗？稍微有一点，可惜努力还不够，没有成功突破阴线高点。对于希望在测试以后顺势加入多头的交易者来说，他们最乐见的可能是阳线再长一点。确实，对趋势应先完成反转。但就动能来说，其实这离完美状态相距不远。开盘与收盘之间依然创出了粗涌的阳线，实体向上拉扯的幅度还是蛮大的。这也算是个好消息，加入趋势不能说十拿九稳，但也有一定的胜算。在讲解原理的阶段，我无意指挥你如何入场？这是课程后半段讲交易方法的时候，才会去深入的话题。但在这里可以跟你先说，依照不同的交易风格或激进或保守，这里至少有两种不同的介入方法。第一种是赶紧买进，胜率低一点也在所不惜的类型。有些多头交易者早在阳线收线以前，就先在阴线顶部放置停止订单买入，准备在上破的瞬间立即入场。为什么可以这样做呢？因为在这根K线生成的过程中，即使还看不到最后的结果，但总之，只要他的买单被触发，那就代表在这段时间中多头发起了突破的尝试。有一瞬间吞没掉了前一根K线。多头都能够从如此低的地方拉起一根阳线，触发我的停止订单，那肯定是空头置身事外才会给多头这样的机会。所以提前挂上停止订单，等待突破后触发入场，这是一种选项。另一种选择就稍微保守一点，眼见为平比较安心。所以第二类的交易者不仅要看到明确的阳线，他还要有后续的跟进，继而确认空头失败，突破成功。只有当跟进K线也确认收线了，而且说的好看，它才以市价追进。两者之间的差异就在一个确定性较低，但可争取的利润空间较大。另一个则是偏好更高的确定性，并以利润空间缩小作为代价。当然咯，更激进或更保守的人也大有人在。比如刚刚说的第一类人，还可以再细分为1a，1b两种。前者继续坚持阴线应该被上破，而后者则取消先前的停止订单，改挂在最新的这根阳线头上，认为这根阳线高点再被突破就可以了，这代表多头依然进去。而我们说的第二种也可能分为2a，2b。一个在跟进阳线收线后，就立刻以市价跟进。另一个则还要再看到跟进阳线高点被突破后才愿意入场。没有一定之规，大家可以按照自己的风险爱好自由选择。我只是想要先趁机提醒你思考跟决定自己的风格，对你总体的交易生涯来说是重要的事。这个例子可以提供一个素材，让你从现在开始考虑。","p":"p264"},{"t":"好，我们讲回这张图，我已经分别把1a，1b，2a，2b的做法都标记在图表上。让你可以一目了然。而最后价格确实是继续上涨，直到价格又回到前高点处。这些做法都有合理的原因。在价格测试到突破点时，空头动能确实没有延续，多头动能确实重新涌现。综合在一起给到了突破后加入第二推的利润机会。判读动能就是这个意思。希望你有再次体验到这个技能的重要性。并且开始觉得比较K线和K线之间的相互关系，感受多空之间的微观角力是一件有趣的事情。","p":"p265"}]},{"t":"para","text":"好，我们讲回这张图，我已经分别把1a，1b，2a，2b的做法都标记在图表上。让你可以一目了然。而最后价格确实是继续上涨，直到价格又回到前高点处。这些做法都有合理的原因。在价格测试到突破点时，空头动能确实没有延续，多头动能确实重新涌现。综合在一起给到了突破后加入第二推的利润机会。判读动能就是这个意思。希望你有再次体验到这个技能的重要性。并且开始觉得比较K线和K线之间的相互关系，感受多空之间的微观角力是一件有趣的事情。","pid":"p265"}],"wcount":6511},{"id":"l04B","title":"第B段　测试市场对失衡的自我调节","blocks":[{"t":"para","text":"L04B 测试市场对失衡的自我调节","pid":"p266"},{"t":"para","text":"上个单元讲突破，你已经知道突破作为意外事件，通常成功发起后，至少带来两段顺势推动。而这个单元我们讲测试，你也已经知道突破不必然发起就会成功，会有一段回调转回来测试多空。究竟准备好突破了没有。","pid":"p267"},{"t":"img","src":"assets/img/l04B_045.webp","ilabel":"4-5","icap":"L04　测试市场对失衡的自我调节","fid":"fig45","ctx":[{"t":"L04B 测试市场对失衡的自我调节","p":"p266"},{"t":"上个单元讲突破，你已经知道突破作为意外事件，通常成功发起后，至少带来两段顺势推动。而这个单元我们讲测试，你也已经知道突破不必然发起就会成功，会有一段回调转回来测试多空。究竟准备好突破了没有。","p":"p267"},{"t":"也就是说，你已经知道A很强的话，通常还有B跟C。而B就是为了确定C到底能有多强。C的运行幅度与B的状态高度相关。于是这一节我们来进一步谈C是如何形成的。什么情况下C能够越过A？什么情况下则不能？或许你有注意到，也或许你没有。实际上A转入B的过程也是一次空头突破。注意到这根K线跟它的前一根了吗？趋势阴线强劲的实体收在阳线的最低点之下。我们说这是反转对吧？而且是很强劲的反转。这正是原先顺势运行的多头力量消散，而被他的对手方空头短暂突破的迹象。那既然是突破照理来说，也会符合我们讲的突破后倾向还有第二段推动的法则以及突破后应当有回调作为测试。就这个角度来说，如果B下跌是突破那C上涨就成了测试。依照C的测试结果，市场紧接着告诉你还有没有低下跌。作为B第一推的延续。没错，市场中所有运动都是这样的，突破后总还有测试。谁是突破，谁是测试端。看你所谓的顺势方是哪一方？先把这张图的全貌展示给你看。你可以说这段下跌是前一段上涨的回调。而后面这段上涨也可以被认作是下跌突破后的测试。因此，在上个节次中，我们说B是A发生以后的测试行情。C是A的延续。但你也可以转换视角，认为B是突破C是测试D则是B的第二推延续。会很混乱吗？可能有点实在不好意思。如果还无法跟得上视角的转换很习惯先站在其中一方来理解，那我们可以透过多记一条原则，来让一切更有条理。除了我们说突破点倾向被测试，原趋势极值也倾向被测试。为什么趋势是极值也倾向被测试呢？这是因为价格刚刚在这里转空，多头在这里收手。那么按照市场什么都要测试一下来进行二次确认的特性，他就也要上去摸看看。这就像是空头要跟多头问清楚。诶，你刚才在这里就没力了，真的没力了吗？我来测试一下。如果价格走到这里，你还是没有要向上突破的意思，那我就在同个价位打败你两次喽。该换我进攻了吧？","p":"p268"}]},{"t":"para","text":"也就是说，你已经知道A很强的话，通常还有B跟C。而B就是为了确定C到底能有多强。C的运行幅度与B的状态高度相关。于是这一节我们来进一步谈C是如何形成的。什么情况下C能够越过A？什么情况下则不能？或许你有注意到，也或许你没有。实际上A转入B的过程也是一次空头突破。注意到这根K线跟它的前一根了吗？趋势阴线强劲的实体收在阳线的最低点之下。我们说这是反转对吧？而且是很强劲的反转。这正是原先顺势运行的多头力量消散，而被他的对手方空头短暂突破的迹象。那既然是突破照理来说，也会符合我们讲的突破后倾向还有第二段推动的法则以及突破后应当有回调作为测试。就这个角度来说，如果B下跌是突破那C上涨就成了测试。依照C的测试结果，市场紧接着告诉你还有没有低下跌。作为B第一推的延续。没错，市场中所有运动都是这样的，突破后总还有测试。谁是突破，谁是测试端。看你所谓的顺势方是哪一方？先把这张图的全貌展示给你看。你可以说这段下跌是前一段上涨的回调。而后面这段上涨也可以被认作是下跌突破后的测试。因此，在上个节次中，我们说B是A发生以后的测试行情。C是A的延续。但你也可以转换视角，认为B是突破C是测试D则是B的第二推延续。会很混乱吗？可能有点实在不好意思。如果还无法跟得上视角的转换很习惯先站在其中一方来理解，那我们可以透过多记一条原则，来让一切更有条理。除了我们说突破点倾向被测试，原趋势极值也倾向被测试。为什么趋势是极值也倾向被测试呢？这是因为价格刚刚在这里转空，多头在这里收手。那么按照市场什么都要测试一下来进行二次确认的特性，他就也要上去摸看看。这就像是空头要跟多头问清楚。诶，你刚才在这里就没力了，真的没力了吗？我来测试一下。如果价格走到这里，你还是没有要向上突破的意思，那我就在同个价位打败你两次喽。该换我进攻了吧？","pid":"p268"},{"t":"img","src":"assets/img/l04B_046.webp","ilabel":"4-6","icap":"L04　测试市场对失衡的自我调节","fid":"fig46","ctx":[{"t":"也就是说，你已经知道A很强的话，通常还有B跟C。而B就是为了确定C到底能有多强。C的运行幅度与B的状态高度相关。于是这一节我们来进一步谈C是如何形成的。什么情况下C能够越过A？什么情况下则不能？或许你有注意到，也或许你没有。实际上A转入B的过程也是一次空头突破。注意到这根K线跟它的前一根了吗？趋势阴线强劲的实体收在阳线的最低点之下。我们说这是反转对吧？而且是很强劲的反转。这正是原先顺势运行的多头力量消散，而被他的对手方空头短暂突破的迹象。那既然是突破照理来说，也会符合我们讲的突破后倾向还有第二段推动的法则以及突破后应当有回调作为测试。就这个角度来说，如果B下跌是突破那C上涨就成了测试。依照C的测试结果，市场紧接着告诉你还有没有低下跌。作为B第一推的延续。没错，市场中所有运动都是这样的，突破后总还有测试。谁是突破，谁是测试端。看你所谓的顺势方是哪一方？先把这张图的全貌展示给你看。你可以说这段下跌是前一段上涨的回调。而后面这段上涨也可以被认作是下跌突破后的测试。因此，在上个节次中，我们说B是A发生以后的测试行情。C是A的延续。但你也可以转换视角，认为B是突破C是测试D则是B的第二推延续。会很混乱吗？可能有点实在不好意思。如果还无法跟得上视角的转换很习惯先站在其中一方来理解，那我们可以透过多记一条原则，来让一切更有条理。除了我们说突破点倾向被测试，原趋势极值也倾向被测试。为什么趋势是极值也倾向被测试呢？这是因为价格刚刚在这里转空，多头在这里收手。那么按照市场什么都要测试一下来进行二次确认的特性，他就也要上去摸看看。这就像是空头要跟多头问清楚。诶，你刚才在这里就没力了，真的没力了吗？我来测试一下。如果价格走到这里，你还是没有要向上突破的意思，那我就在同个价位打败你两次喽。该换我进攻了吧？","p":"p268"},{"t":"于是以这张图为例，A是多头突破B是测试A到底是真的假的。C作为A的延续，首要目标就是确认刚刚多头决定在这里收手，是不是因为价格太高了，买不下去？是的话，突破不了，那就代表均衡不在更高处，价格应该向下探测。诶，果真测试到原趋势极值，以后多头就没有再进一步的意思。那这里就形成了一个典型的双重顶，引发价格下落。于是乎，站在多头的视角，这里有过对突破点的测试，也有过对原趋势极值的测试。请你记得，这是价格运动的自然倾向。接着我们还可以再进一步尝试换位。站在空头这边来思考看看。这段下跌是空头的突破，说是对阳线低点的突破，或对趋势线的突破都可以。总之，空头开始掌控方向。那么，同样也要有对突破点的测试，以及对原趋势极值的测试，对吧？这段上涨就是对突破点的测试。测试的结果是，在方才空头开始进场，开始占优势的价位，他们很努力在捍卫仍然团结，愿意再次做空。所以价格要进一步去测试，多头开始占优的价位，多头这次会不会弃手？诶，结果还真的弃手了，他们在此处扭转过一次行情，但这次决定放弃。于是空头就可以更进一步把价格压得更低。那当然，这也是对这个波段点的突破，所以突破后还有测试，测试后再进一步测试原趋势极值。所以你又可以看见价格折返测试突破点，以及再次突破原趋势极值。就这样，一再突破，一再测试，往复循环。这么一来，给你ABCD总共四段推动行情，你应该能够分辨出它们之间的关系。站在多头的角度来看，他们越过了橘色的阻力，因此A段是多头的突破，突破后会有对突破点的测试。这就是B段。价格在碰触突破点后止跌回升，开启了C。它是A段的延续行情，是突破后跟进的第二推。那接下来同样的图，我们换成站在空头的视角想想。刚刚多头的A段确实越过了一个阻力，翻到线上来。但空头也确实暂时发起了反转，反转就是逆势方的突破，","p":"p269"},{"t":"成功是为B段。然而，突破总有测试，对吧？价格应该要再次趋近突破点去检验。作为顺势方的空头，有没有意愿捍卫这段好不容易发起的突破？于是有了C。C折上去也是为了测试空头方采才的突破点。最后，空头确实还有气力没有，要让给多头继续突破的意思。与时价格又开始折返，创出D这段下跌作为B的第二推延续。那综合在一起看呢，我们说突破后先要测试突破点，再测试原趋势极值。因此A作为多头突破，这毋庸置疑。B则有双重身份，那就是空头突破以及对多头突破点的测试。C同样也起到两种作用，其实向上测试空头突破点也是对ABC这轮上升趋势中。A段中点作为原趋势极值的测试。测试以后多头无力，空头占据优势，于是价格又下落，演变成B的延续。同时，这也是对BCD这段下跌趋势中，B段终点作为原趋势极值的测试。为什么要花时间谈这些，听起来有点抽象，不太确定实用性在哪里的内容呢？是因为接下来我希望再进一步抛出一个重要观念给你。无论是测试突破点还是测试原趋势极值，测试的强度幅度将大大的决定突破以及而后延续行情的强度与幅度。","p":"p270"}]},{"t":"para","text":"于是以这张图为例，A是多头突破B是测试A到底是真的假的。C作为A的延续，首要目标就是确认刚刚多头决定在这里收手，是不是因为价格太高了，买不下去？是的话，突破不了，那就代表均衡不在更高处，价格应该向下探测。诶，果真测试到原趋势极值，以后多头就没有再进一步的意思。那这里就形成了一个典型的双重顶，引发价格下落。于是乎，站在多头的视角，这里有过对突破点的测试，也有过对原趋势极值的测试。请你记得，这是价格运动的自然倾向。接着我们还可以再进一步尝试换位。站在空头这边来思考看看。这段下跌是空头的突破，说是对阳线低点的突破，或对趋势线的突破都可以。总之，空头开始掌控方向。那么，同样也要有对突破点的测试，以及对原趋势极值的测试，对吧？这段上涨就是对突破点的测试。测试的结果是，在方才空头开始进场，开始占优势的价位，他们很努力在捍卫仍然团结，愿意再次做空。所以价格要进一步去测试，多头开始占优的价位，多头这次会不会弃手？诶，结果还真的弃手了，他们在此处扭转过一次行情，但这次决定放弃。于是空头就可以更进一步把价格压得更低。那当然，这也是对这个波段点的突破，所以突破后还有测试，测试后再进一步测试原趋势极值。所以你又可以看见价格折返测试突破点，以及再次突破原趋势极值。就这样，一再突破，一再测试，往复循环。这么一来，给你ABCD总共四段推动行情，你应该能够分辨出它们之间的关系。站在多头的角度来看，他们越过了橘色的阻力，因此A段是多头的突破，突破后会有对突破点的测试。这就是B段。价格在碰触突破点后止跌回升，开启了C。它是A段的延续行情，是突破后跟进的第二推。那接下来同样的图，我们换成站在空头的视角想想。刚刚多头的A段确实越过了一个阻力，翻到线上来。但空头也确实暂时发起了反转，反转就是逆势方的突破，","pid":"p269"},{"t":"para","text":"成功是为B段。然而，突破总有测试，对吧？价格应该要再次趋近突破点去检验。作为顺势方的空头，有没有意愿捍卫这段好不容易发起的突破？于是有了C。C折上去也是为了测试空头方采才的突破点。最后，空头确实还有气力没有，要让给多头继续突破的意思。与时价格又开始折返，创出D这段下跌作为B的第二推延续。那综合在一起看呢，我们说突破后先要测试突破点，再测试原趋势极值。因此A作为多头突破，这毋庸置疑。B则有双重身份，那就是空头突破以及对多头突破点的测试。C同样也起到两种作用，其实向上测试空头突破点也是对ABC这轮上升趋势中。A段中点作为原趋势极值的测试。测试以后多头无力，空头占据优势，于是价格又下落，演变成B的延续。同时，这也是对BCD这段下跌趋势中，B段终点作为原趋势极值的测试。为什么要花时间谈这些，听起来有点抽象，不太确定实用性在哪里的内容呢？是因为接下来我希望再进一步抛出一个重要观念给你。无论是测试突破点还是测试原趋势极值，测试的强度幅度将大大的决定突破以及而后延续行情的强度与幅度。","pid":"p270"},{"t":"img","src":"assets/img/l04B_047.webp","ilabel":"4-7","icap":"L04　测试市场对失衡的自我调节","fid":"fig47","ctx":[{"t":"于是以这张图为例，A是多头突破B是测试A到底是真的假的。C作为A的延续，首要目标就是确认刚刚多头决定在这里收手，是不是因为价格太高了，买不下去？是的话，突破不了，那就代表均衡不在更高处，价格应该向下探测。诶，果真测试到原趋势极值，以后多头就没有再进一步的意思。那这里就形成了一个典型的双重顶，引发价格下落。于是乎，站在多头的视角，这里有过对突破点的测试，也有过对原趋势极值的测试。请你记得，这是价格运动的自然倾向。接着我们还可以再进一步尝试换位。站在空头这边来思考看看。这段下跌是空头的突破，说是对阳线低点的突破，或对趋势线的突破都可以。总之，空头开始掌控方向。那么，同样也要有对突破点的测试，以及对原趋势极值的测试，对吧？这段上涨就是对突破点的测试。测试的结果是，在方才空头开始进场，开始占优势的价位，他们很努力在捍卫仍然团结，愿意再次做空。所以价格要进一步去测试，多头开始占优的价位，多头这次会不会弃手？诶，结果还真的弃手了，他们在此处扭转过一次行情，但这次决定放弃。于是空头就可以更进一步把价格压得更低。那当然，这也是对这个波段点的突破，所以突破后还有测试，测试后再进一步测试原趋势极值。所以你又可以看见价格折返测试突破点，以及再次突破原趋势极值。就这样，一再突破，一再测试，往复循环。这么一来，给你ABCD总共四段推动行情，你应该能够分辨出它们之间的关系。站在多头的角度来看，他们越过了橘色的阻力，因此A段是多头的突破，突破后会有对突破点的测试。这就是B段。价格在碰触突破点后止跌回升，开启了C。它是A段的延续行情，是突破后跟进的第二推。那接下来同样的图，我们换成站在空头的视角想想。刚刚多头的A段确实越过了一个阻力，翻到线上来。但空头也确实暂时发起了反转，反转就是逆势方的突破，","p":"p269"},{"t":"成功是为B段。然而，突破总有测试，对吧？价格应该要再次趋近突破点去检验。作为顺势方的空头，有没有意愿捍卫这段好不容易发起的突破？于是有了C。C折上去也是为了测试空头方采才的突破点。最后，空头确实还有气力没有，要让给多头继续突破的意思。与时价格又开始折返，创出D这段下跌作为B的第二推延续。那综合在一起看呢，我们说突破后先要测试突破点，再测试原趋势极值。因此A作为多头突破，这毋庸置疑。B则有双重身份，那就是空头突破以及对多头突破点的测试。C同样也起到两种作用，其实向上测试空头突破点也是对ABC这轮上升趋势中。A段中点作为原趋势极值的测试。测试以后多头无力，空头占据优势，于是价格又下落，演变成B的延续。同时，这也是对BCD这段下跌趋势中，B段终点作为原趋势极值的测试。为什么要花时间谈这些，听起来有点抽象，不太确定实用性在哪里的内容呢？是因为接下来我希望再进一步抛出一个重要观念给你。无论是测试突破点还是测试原趋势极值，测试的强度幅度将大大的决定突破以及而后延续行情的强度与幅度。","p":"p270"},{"t":"画面上有三段不同的行情，我尽可能花了大概五六个小时的时间吧，才找到第一推都差不多等高的范例。这真的很难找。你会怎么描述这三段行情呢？我猜很多人能够直觉反应，一是趋势，二是通道，三是区间。或者说一的多头力量很强，而三的多空动能表现则相当接近。而之所以一能发展成强劲的多头趋势，这是因为突破发生以后，对突破点的测试都很弱。并且后续对原趋势极值测试时多头的表现都很良好，造成进一步突破而非折返。我们来比较一下它们。请想象在我未显示的图表左边都有一个横盘已久的区间。而你所看到的部分就是突破区间上缘以后的表现。图一的第一段推动大幅脱离原区间以后，同样迎来测试，但测试的阴线很弱。回调的幅度也很浅，这就是多头很强的证据。你可以想象，就是因为这段突破很具说服力，所以多数人都认为这会是一次真的突破。同时卖压很少，但被套，踏空的人却十万火急，他们纷纷在回调中不计代价买进。这么一来，于是测试就无法探到更低的地方去，马上就折了上去。那下个目标是什么？测试原趋势极值，对吧？你不难发现，一旦回调结束，开始上涨。但其实也离测试原趋势极值不远了，多头越过去相对容易。但具体到了这边以后，多空竞合如何还是要关注一下。毕竟对某些空头来说，他们想的可能是诶，虽然这段空头突破超级小，但它毕竟是个小型的反转。我们也占着短暂的优势啊。搞不好价格测试到原趋势极值，以后多头就没力了。可以进一步押注下跌，导致形成一个双重顶。所以或许会有部分空头决定再努力一下。但就这个例子来说，没有多头大力压过空头，所以又收出饱满的突破K线。那第一阶段的测试突破点与测试原趋势极值的部分就都完成了。价格进一步突破，等等要在对新的突破点以及新的原趋势极值进行测试。第二个例子有何不同？我相信应该不难回答。测试的比较深，阴线也比较长，空头激进的多。这种情况就代表突破发生以后，踏空跟被套的人其实没有很觉得自己踏空跟被套，对吧？他们没有试图做出紧急的处置。有的话应该争先恐后买进才对，而不是让回调的深度发展到都快要吞没上升运行的程度。所以在第二推发展出来，将要去测试原趋势极值的路上，多头们会怎么想？他们信心会不太足够。刚刚过深的回调，就已经彰显了跟他们站在同一边的人其实不算多，即使有部分多头想要趁胜追击，可能也吸引不到什么同行的援军。那信心不足，反应也会很诚实。多半大家在这里不是用力追近，而是趁高开始平仓导致下跌。换个角度看，空头在价格向上测试原趋势极值的时候，他们在想什么？他们会惊叹哇，我刚刚都没有出什么力，你自己人跑的倒是挺快，看来你们外强中干是吧？那我要趁机建立一点短打的剥头皮仓位，能捞一点是一点。所以咯，第二推突破的很差，第二次回调同样很深。而且大幅击穿所要测试的突破点，这完全就是多头虚弱的标志。那想必第三个就不需多说了。多空力量很均衡，这完全就是区间，几乎没有趋势性格可言。会有这种情况，就是因为多空在相互突破，相互吞没。同样，我们还是站在多头的角度来看好了。上下上，那就是突破测试突破点，跟第二推测试原趋势极值。显然，突破以后开始下修，这段对多头突破的测试非常深。甚至测试到了上涨的起点。于是下一段向上测试原趋势极值的过程也会引发空头更激进的介入，造成了典型的双重顶。那按照空头突破的角度来看，则是下上下，突破测试突破点。跟第二推测是原趋势极值。同样空头的努力也被力量相等的多头给解消，于是形成一个均衡的区间。那三者并置在一起理解测试的作用，以及该如何阅读动能去判读后续能怎么走？你应该都有七八成的把握了。","p":"p271"}]},{"t":"para","text":"画面上有三段不同的行情，我尽可能花了大概五六个小时的时间吧，才找到第一推都差不多等高的范例。这真的很难找。你会怎么描述这三段行情呢？我猜很多人能够直觉反应，一是趋势，二是通道，三是区间。或者说一的多头力量很强，而三的多空动能表现则相当接近。而之所以一能发展成强劲的多头趋势，这是因为突破发生以后，对突破点的测试都很弱。并且后续对原趋势极值测试时多头的表现都很良好，造成进一步突破而非折返。我们来比较一下它们。请想象在我未显示的图表左边都有一个横盘已久的区间。而你所看到的部分就是突破区间上缘以后的表现。图一的第一段推动大幅脱离原区间以后，同样迎来测试，但测试的阴线很弱。回调的幅度也很浅，这就是多头很强的证据。你可以想象，就是因为这段突破很具说服力，所以多数人都认为这会是一次真的突破。同时卖压很少，但被套，踏空的人却十万火急，他们纷纷在回调中不计代价买进。这么一来，于是测试就无法探到更低的地方去，马上就折了上去。那下个目标是什么？测试原趋势极值，对吧？你不难发现，一旦回调结束，开始上涨。但其实也离测试原趋势极值不远了，多头越过去相对容易。但具体到了这边以后，多空竞合如何还是要关注一下。毕竟对某些空头来说，他们想的可能是诶，虽然这段空头突破超级小，但它毕竟是个小型的反转。我们也占着短暂的优势啊。搞不好价格测试到原趋势极值，以后多头就没力了。可以进一步押注下跌，导致形成一个双重顶。所以或许会有部分空头决定再努力一下。但就这个例子来说，没有多头大力压过空头，所以又收出饱满的突破K线。那第一阶段的测试突破点与测试原趋势极值的部分就都完成了。价格进一步突破，等等要在对新的突破点以及新的原趋势极值进行测试。第二个例子有何不同？我相信应该不难回答。测试的比较深，阴线也比较长，空头激进的多。这种情况就代表突破发生以后，踏空跟被套的人其实没有很觉得自己踏空跟被套，对吧？他们没有试图做出紧急的处置。有的话应该争先恐后买进才对，而不是让回调的深度发展到都快要吞没上升运行的程度。所以在第二推发展出来，将要去测试原趋势极值的路上，多头们会怎么想？他们信心会不太足够。刚刚过深的回调，就已经彰显了跟他们站在同一边的人其实不算多，即使有部分多头想要趁胜追击，可能也吸引不到什么同行的援军。那信心不足，反应也会很诚实。多半大家在这里不是用力追近，而是趁高开始平仓导致下跌。换个角度看，空头在价格向上测试原趋势极值的时候，他们在想什么？他们会惊叹哇，我刚刚都没有出什么力，你自己人跑的倒是挺快，看来你们外强中干是吧？那我要趁机建立一点短打的剥头皮仓位，能捞一点是一点。所以咯，第二推突破的很差，第二次回调同样很深。而且大幅击穿所要测试的突破点，这完全就是多头虚弱的标志。那想必第三个就不需多说了。多空力量很均衡，这完全就是区间，几乎没有趋势性格可言。会有这种情况，就是因为多空在相互突破，相互吞没。同样，我们还是站在多头的角度来看好了。上下上，那就是突破测试突破点，跟第二推测试原趋势极值。显然，突破以后开始下修，这段对多头突破的测试非常深。甚至测试到了上涨的起点。于是下一段向上测试原趋势极值的过程也会引发空头更激进的介入，造成了典型的双重顶。那按照空头突破的角度来看，则是下上下，突破测试突破点。跟第二推测是原趋势极值。同样空头的努力也被力量相等的多头给解消，于是形成一个均衡的区间。那三者并置在一起理解测试的作用，以及该如何阅读动能去判读后续能怎么走？你应该都有七八成的把握了。","pid":"p271"},{"t":"img","src":"assets/img/l04B_048.webp","ilabel":"4-8","icap":"L04　测试市场对失衡的自我调节","fid":"fig48","ctx":[{"t":"画面上有三段不同的行情，我尽可能花了大概五六个小时的时间吧，才找到第一推都差不多等高的范例。这真的很难找。你会怎么描述这三段行情呢？我猜很多人能够直觉反应，一是趋势，二是通道，三是区间。或者说一的多头力量很强，而三的多空动能表现则相当接近。而之所以一能发展成强劲的多头趋势，这是因为突破发生以后，对突破点的测试都很弱。并且后续对原趋势极值测试时多头的表现都很良好，造成进一步突破而非折返。我们来比较一下它们。请想象在我未显示的图表左边都有一个横盘已久的区间。而你所看到的部分就是突破区间上缘以后的表现。图一的第一段推动大幅脱离原区间以后，同样迎来测试，但测试的阴线很弱。回调的幅度也很浅，这就是多头很强的证据。你可以想象，就是因为这段突破很具说服力，所以多数人都认为这会是一次真的突破。同时卖压很少，但被套，踏空的人却十万火急，他们纷纷在回调中不计代价买进。这么一来，于是测试就无法探到更低的地方去，马上就折了上去。那下个目标是什么？测试原趋势极值，对吧？你不难发现，一旦回调结束，开始上涨。但其实也离测试原趋势极值不远了，多头越过去相对容易。但具体到了这边以后，多空竞合如何还是要关注一下。毕竟对某些空头来说，他们想的可能是诶，虽然这段空头突破超级小，但它毕竟是个小型的反转。我们也占着短暂的优势啊。搞不好价格测试到原趋势极值，以后多头就没力了。可以进一步押注下跌，导致形成一个双重顶。所以或许会有部分空头决定再努力一下。但就这个例子来说，没有多头大力压过空头，所以又收出饱满的突破K线。那第一阶段的测试突破点与测试原趋势极值的部分就都完成了。价格进一步突破，等等要在对新的突破点以及新的原趋势极值进行测试。第二个例子有何不同？我相信应该不难回答。测试的比较深，阴线也比较长，空头激进的多。这种情况就代表突破发生以后，踏空跟被套的人其实没有很觉得自己踏空跟被套，对吧？他们没有试图做出紧急的处置。有的话应该争先恐后买进才对，而不是让回调的深度发展到都快要吞没上升运行的程度。所以在第二推发展出来，将要去测试原趋势极值的路上，多头们会怎么想？他们信心会不太足够。刚刚过深的回调，就已经彰显了跟他们站在同一边的人其实不算多，即使有部分多头想要趁胜追击，可能也吸引不到什么同行的援军。那信心不足，反应也会很诚实。多半大家在这里不是用力追近，而是趁高开始平仓导致下跌。换个角度看，空头在价格向上测试原趋势极值的时候，他们在想什么？他们会惊叹哇，我刚刚都没有出什么力，你自己人跑的倒是挺快，看来你们外强中干是吧？那我要趁机建立一点短打的剥头皮仓位，能捞一点是一点。所以咯，第二推突破的很差，第二次回调同样很深。而且大幅击穿所要测试的突破点，这完全就是多头虚弱的标志。那想必第三个就不需多说了。多空力量很均衡，这完全就是区间，几乎没有趋势性格可言。会有这种情况，就是因为多空在相互突破，相互吞没。同样，我们还是站在多头的角度来看好了。上下上，那就是突破测试突破点，跟第二推测试原趋势极值。显然，突破以后开始下修，这段对多头突破的测试非常深。甚至测试到了上涨的起点。于是下一段向上测试原趋势极值的过程也会引发空头更激进的介入，造成了典型的双重顶。那按照空头突破的角度来看，则是下上下，突破测试突破点。跟第二推测是原趋势极值。同样空头的努力也被力量相等的多头给解消，于是形成一个均衡的区间。那三者并置在一起理解测试的作用，以及该如何阅读动能去判读后续能怎么走？你应该都有七八成的把握了。","p":"p271"},{"t":"接下来，我们就进一步将刚刚用图像讨论的内容整理成文字，方便你抓出原则。首先，突破越强劲，运行幅度越远，通常越容易引发跟进行情。原理在上个单元提过了，展现猛烈的动能，更容易导致被套和踏空，因而诱发积极的跟进。再来突破，总会休止进入回调，对吧？这是测试，测试是为了考验突破方是否真的这么坚决，而逆势方到底有没有信心能够抑制突破？所以测试越浅同样越容易有后续。这代表顺势方更大程度的压过了逆时方。相对的测试越深，代表踏空跟被套的人不多，因而对于矫正做法意兴阑珊。而同时也代表逆势方越激进，越可能在后续的走势中积极出手。于是我们还可以再指出，第三对原趋势极值的测试，以越常见的方式完成。也就是轻松就大幅越过去了，直接形成对原趋势极值的大力突破，那就更可能进一步引发新的测试与新的第二推延续。我们脑海中所能想象到的那种最健全，最悠长，最可观的趋势就是接连的突破，短浅的回调测试所组成的。那同样，如果对原趋势极值测试很弱，轻轻碰到或甚至没碰到就折返。那就代表顺势方无意维持行情，任逆势方掌控了主导权。这时候就容易产生比较深的逆向走势，乃至于发展成反向的趋势。你想想在同个价位失败了两次，对吧？如果市场的某种尝试失败了两次，它往往会尝试相反的方向，这就是为什么双重顶和双重底如此常见的原因。也是，为什么只有在测试园区是极值以后，交易者才会确信市场将要反转？当然，要是测试三四次都还失败了，那他试图做相反事情的可能性就更高。这也是三重四重顶底能够造成反转的基本原理。以上其实全部都是关乎动能的比较，如今你应该再次理解到了善于阅读动能的重要性。多空之间永远紧盯彼此，只要看到对方稍微弱了一点，就会吸引虎视瞻瞻的自己人。在下肢抓到出手机会的时候，用上更多力气。正是透过测试的动作，多空双方能形成对于行情该如何发展的共识，而善于观察测试的结果。我们也就更容易能够判断后续的可能走势。","p":"p272"}]},{"t":"para","text":"接下来，我们就进一步将刚刚用图像讨论的内容整理成文字，方便你抓出原则。首先，突破越强劲，运行幅度越远，通常越容易引发跟进行情。原理在上个单元提过了，展现猛烈的动能，更容易导致被套和踏空，因而诱发积极的跟进。再来突破，总会休止进入回调，对吧？这是测试，测试是为了考验突破方是否真的这么坚决，而逆势方到底有没有信心能够抑制突破？所以测试越浅同样越容易有后续。这代表顺势方更大程度的压过了逆时方。相对的测试越深，代表踏空跟被套的人不多，因而对于矫正做法意兴阑珊。而同时也代表逆势方越激进，越可能在后续的走势中积极出手。于是我们还可以再指出，第三对原趋势极值的测试，以越常见的方式完成。也就是轻松就大幅越过去了，直接形成对原趋势极值的大力突破，那就更可能进一步引发新的测试与新的第二推延续。我们脑海中所能想象到的那种最健全，最悠长，最可观的趋势就是接连的突破，短浅的回调测试所组成的。那同样，如果对原趋势极值测试很弱，轻轻碰到或甚至没碰到就折返。那就代表顺势方无意维持行情，任逆势方掌控了主导权。这时候就容易产生比较深的逆向走势，乃至于发展成反向的趋势。你想想在同个价位失败了两次，对吧？如果市场的某种尝试失败了两次，它往往会尝试相反的方向，这就是为什么双重顶和双重底如此常见的原因。也是，为什么只有在测试园区是极值以后，交易者才会确信市场将要反转？当然，要是测试三四次都还失败了，那他试图做相反事情的可能性就更高。这也是三重四重顶底能够造成反转的基本原理。以上其实全部都是关乎动能的比较，如今你应该再次理解到了善于阅读动能的重要性。多空之间永远紧盯彼此，只要看到对方稍微弱了一点，就会吸引虎视瞻瞻的自己人。在下肢抓到出手机会的时候，用上更多力气。正是透过测试的动作，多空双方能形成对于行情该如何发展的共识，而善于观察测试的结果。我们也就更容易能够判断后续的可能走势。","pid":"p272"},{"t":"img","src":"assets/img/l04B_049.webp","ilabel":"4-9","icap":"L04　测试市场对失衡的自我调节","fid":"fig49","ctx":[{"t":"接下来，我们就进一步将刚刚用图像讨论的内容整理成文字，方便你抓出原则。首先，突破越强劲，运行幅度越远，通常越容易引发跟进行情。原理在上个单元提过了，展现猛烈的动能，更容易导致被套和踏空，因而诱发积极的跟进。再来突破，总会休止进入回调，对吧？这是测试，测试是为了考验突破方是否真的这么坚决，而逆势方到底有没有信心能够抑制突破？所以测试越浅同样越容易有后续。这代表顺势方更大程度的压过了逆时方。相对的测试越深，代表踏空跟被套的人不多，因而对于矫正做法意兴阑珊。而同时也代表逆势方越激进，越可能在后续的走势中积极出手。于是我们还可以再指出，第三对原趋势极值的测试，以越常见的方式完成。也就是轻松就大幅越过去了，直接形成对原趋势极值的大力突破，那就更可能进一步引发新的测试与新的第二推延续。我们脑海中所能想象到的那种最健全，最悠长，最可观的趋势就是接连的突破，短浅的回调测试所组成的。那同样，如果对原趋势极值测试很弱，轻轻碰到或甚至没碰到就折返。那就代表顺势方无意维持行情，任逆势方掌控了主导权。这时候就容易产生比较深的逆向走势，乃至于发展成反向的趋势。你想想在同个价位失败了两次，对吧？如果市场的某种尝试失败了两次，它往往会尝试相反的方向，这就是为什么双重顶和双重底如此常见的原因。也是，为什么只有在测试园区是极值以后，交易者才会确信市场将要反转？当然，要是测试三四次都还失败了，那他试图做相反事情的可能性就更高。这也是三重四重顶底能够造成反转的基本原理。以上其实全部都是关乎动能的比较，如今你应该再次理解到了善于阅读动能的重要性。多空之间永远紧盯彼此，只要看到对方稍微弱了一点，就会吸引虎视瞻瞻的自己人。在下肢抓到出手机会的时候，用上更多力气。正是透过测试的动作，多空双方能形成对于行情该如何发展的共识，而善于观察测试的结果。我们也就更容易能够判断后续的可能走势。","p":"p272"},{"t":"学以致用一下，我们来练习，在K线形成现场就透过动能的判读以及测试的样态来推测价格，接下来会上涨或下跌。首先，这里我们看到的是连续四根的阳线。其中，突破以后还有跟进。只不过下一根就成了阴线，好像不算是很决绝的突破，对吧？我们于是有必要观察一下他测试突破点的姿势，看看多头有没有意愿捍卫他们的趋势幼苗。后面收了一根带长下影线的阳线，这是什么意思呢？我们再次用上阅读两根K线的方法。请你告诉我这根K线，相较于前一根空头的突破是成功还是失败的？当然哦，这是预录的课程，你没有办法真的告诉我，但我希望你在心中默念的答案是对的。这是失败的突破，空头未能将实体收在前一根K线低点之外，造就阴线。所以在这个围观的格局里，多头有成功守住这个突破点。不过后来又是连续两根阴线，事情好像又有点纠结。因为上涨回调，在上涨的这一次没有能够突破成功。但也很有趣的是，如果这根阴线是空头的突破，那突破测试在测试原趋势极值的过程中。空头同样在上次败阵的价位，也就是这个橘色的突破点处，又向下突破失败了。这于是成为了横向的小型区间。很苦恼对吧？多空这么均衡，到底是什么意思呢？没关系，我们就看接下来是向上还是向下突破就可以了，胜出的那方就是答案。后来又有强劲的阳线向上脱离这个小型区间，而后还有跟进。于是我们知道，从前面算起，这是一次突破，横向回调，再次突破的走势。其中，对于突破点的测试是以微型双重底，也就是空头两次突破失败的形式完成的。你也可以说这是急速牛旗在接另一段急速。我们接着看，刚刚这段上涨又突破了原趋势极值，对吧？这里开启的是新的突破循环，一样关注对突破点以及对原趋势极值的测试。同样对突破点的测试，又是空头失败，所以后续上涨的机会稍微高一些。不过，对原趋势极值的测试有很强吗？好像还好。突破以后立刻收的是十字星，而不是强劲阳线。这会不会代表多头动能正在消散呢？还真的，阴线立即落了下来。站在多头的角度来说，这个对突破点的测试实在是深到不行，完全不是轻轻碰到就反弹的那一种。这就跟我们前面说到的第二种状况，宽幅通道的样态非常接近了。相较之前空头已经更加激进，而多头则更早退缩，更晚重返现场。于是，突破回调测试突破点，在试图创出第二推的时候，第二推对原趋势极值的测试，也就更弱了。根本没有成功的突破可言，收的全是长上影线。这就是多头遭了个大糕的标志，也是典型的双重顶样态。后续就变成空头的主场。变成空头的主场，何以见得？这么强劲的趋势阴线屡屡收在对多头而言重要与次要的波段点之下。而这里又是对重要波段点的突破测试。测试旋即结束，而且突破这根阳线的低点时，也同时就是突破原空头趋势极值。进一步引发强劲的下跌。只不过对于下一个突破目标的突破测试，虽然没有被多头得寸进尺，但空头延续下跌的尝试却失败了。做成一个横向的区间。最后则又是多头取得突破的主导权。而在图表最后结束，在突破点就正要被测试之时。","p":"p273"},{"t":"有过例子，相信你有更感受到阅读动能是多么重要。以及多空确实不断在角力透过测试来试探对方的意图。因此，在单元结束前，我还有一些关于测试的重要知识点要向你补充。总共两个大点，其中第一大点内含两个小点。我来一一向你说明。","p":"p274"}]},{"t":"para","text":"学以致用一下，我们来练习，在K线形成现场就透过动能的判读以及测试的样态来推测价格，接下来会上涨或下跌。首先，这里我们看到的是连续四根的阳线。其中，突破以后还有跟进。只不过下一根就成了阴线，好像不算是很决绝的突破，对吧？我们于是有必要观察一下他测试突破点的姿势，看看多头有没有意愿捍卫他们的趋势幼苗。后面收了一根带长下影线的阳线 稍微高一些。不过，对原趋势极值的测试有很强吗？好像还好。突破以后立刻收的是十字星，而不是强劲阳线。这会不会代表多头动能正在消散呢？还真的，阴线立即落了下来。站在多头的角度来说，这个对突破点的测试实在是深到不行，完全不是轻轻碰到就反弹的那一种。这就跟我们前面说到的第二种状况，宽幅通道的样态非常接近了。相较之前空头已经更加激进，而多头则更早退缩，更晚重返现场。于是，突破回调测试突破点，在试图创出第二推的时候，第二推对原趋势极值的测试，也就更弱了。根本没有成功的突破可言，收的全是长上影线。这就是多头遭了个大糕的标志，也是典型的双重顶样态。后续就变成空头的主场。变成空头的主场，何以见得？这么强劲的趋势阴线屡屡收在对多头而言重要与次要的波段点之下。而这里又是对重要波段点的突破测试。测试旋即结束，而且突破这根阳线的低点时，也同时就是突破原空头趋势极值。进一步引发强劲的下跌。只不过对于下一个突破目标的突破测试，虽然没有被多头得寸进尺，但空头延续下跌的尝试却失败了。做成一个横向的区间。最后则又是多头取得突破的主导权。而在图表最后结束，在突破点就正要被测试之时。","p":"p273"},{"t":"有过例子，相信你有更感受到阅读动能是多么重要。以及多空确实不断在角力透过测试来试探对方的意图。因此，在单元结束前，我还有一些关于测试的重要知识点要向你补充。总共两个大点，其中第一大点内含两个小点。我来一一向你说明。","p":"p274"},{"t":"首先，你应该注意到了，测试可能不及，可能持平，也可能过冲，这全看多空竞合的状态。最强劲的趋势中，对突破点的测试通通会不及。这代表踏空和被套的人很多，他们全都着急加入趋势方向，不等待更深的回调，就赶紧抢着上车。那相对的，要是过冲的很深，那就代表逆势方还蛮用力的，就可能导致更平缓更不常见的趋势。同时，除了突破点，对原趋势极值的测试当然也有不及。持平！过冲！三种情况。依然全与多空竞合的状态有关。虽然我们还未正式进入对形态的细节。但你可以想象，杯柄形态作为一轮上升趋势中的顶。多头在其中的表现肯定比持平的双重顶或者右峰更高的双重顶更弱。否则，多头应该更强势一点，至少使得高点抬升，对吧？但没有多头提前离场。那就更会给到逆势空头进取的理由。那在这个重点之下，有什么细项要向你补充呢？有些朋友可能已经考虑到一个实务层面的问题。我知道测试会发生，但测试有没有可能超级不明显？具体一点说，如果价格远离了突破点，60个单位，那后续接了15个单位的回调，就又恢复原趋势方向。我能够判断说，测试已经发生了吗？换句话问，就是测试要多深，交易者在实务上才能够判断测试已经发生。这确实是个棘手的问题，对阿尔布鲁克斯来说，他认为测试至少要达到三分之一深才算数。你要想，如果真有一轮趋势测试，只有皮毛就延续强劲的顺势运行。那这完全是超强的趋势。而超强趋势照理来说会落在常态分布的极端，也就是数量非常稀少。更多的是回调的更深的那一些。所以当你看到突破发起后，出现了未达三分之一的回调，这时候与其押注测试已经结束。接下来会立即发展为超强趋势。更安全，更符合几率常理的做法，应该是认为测试应该还没完全走完，或许还有第二段小推动。测试到更深的地方去。因此，我们在这个问题上就先依循阿尔布克斯的经验之谈，认为测试至少要达到三分之一，身材算数比较恰当。如果你真的很想要捕捉相对强的趋势，那么以此为标准应该能够为你避掉一些其实测试还要更深。但你因为急躁而过早加入的情况。再来沿着刚刚的话题进一步跟你分享第二点。测试“过冲的”会多上许多。我们先前说，市场喜欢待在均衡的状态，对吧？意思是市场中大部分的时间多空的力量不会太过悬殊，且突破打破均衡的尝试倾向失败。一旦有任何一方尝试发起突破，另一方就都会倚仗着区间倾向突破失败的原理。尝试压制突破发生，继而赚取逆势交易的利润。这也就是说，突破发生多数情况下，逆势方不会太轻易拱手相让。而突破发起方也不会那么信誓旦旦，在突破过程中不止盈，疯狂加仓。所以此测试通常会蛮明显的。甚至我可以更具体的告诉你，过冲突破点，清扫那些突破时就旋即入场的交易者的止损是最为多数的情况。这点倾向就给了你相应的行动指示。如果你是突破时旋即追进的那个交易者。你放置在突破点处的止损，很可能会被测试给清扫。所以别贴的那么近，价格可能在触发你的止损后又反向前进。以及如果你喜欢更保守的交易，那你可以等待突破测试完以后在突破点上看到弱势的逆势力量，再考虑加入。这时候，首波突破交易者的止损也清扫完了，你可以将止损放在刚刚测试完毕的K线之外。这么做胜率会比首次入场机会时就追近来的稍微更高一些。好了，第一大点分享完，我们接着谈，另一个要补充给你的关键知识测试可能不止一次。比如你应该有很高的几率，听过三重底或者三推楔形反转。没听过也不要紧，总之就是价格测试了一个支撑阻力三次，最后才反转逆行。以及虽然一推比一推更远，但在第三推的时候发生反转，就测试原趋势极值的角度来说，如果在一轮下降趋势中遭遇三重底，那代表什么呢？代表趋势，第一次尝试反转后，后面测试了一次原趋势极值，先试图造就双重底。不过没有一猝而就，他又测试了一次，才心甘情愿离开。通常啦，如果测试很明确，那么两推就可以造就反转了，但有时候多空双方需要double check。测试一次不够，再测试一次，确定市场没有悬念了，才往他该去的方向去。尤其在前面的单元说过的市场，在不停寻觅最佳价格的过程中，通常必须运行过渡，以确定均匀的边界何在。这里的过渡除了是运行幅度的过渡，也可能是次数的过渡。总之，如果市场尝试某个动作，两次，三次，四次都失败了，那它通常就会试图做相反的事情。往一个价格多次尝试翻越却越不过去，那就代表均衡，不在那一边。市场就该回头找找多空到底希望价格落在何处。反正应该不会再屡屡尝试未果的那一边。好，终于又到单元尾声，我想大家可能也累了，我们快速做个重点整理。","p":"p275"}]},{"t":"para","text":"首先，你应该注意到了，测试可能不及，可能持平，也可能过冲，这全看多空竞合的状态。最强劲的趋势中，对突破点的测试通通会不及。这代表踏空和被套的人很多，他们全都着急加入趋势方向，不等待更深的回调，就赶紧抢着上车。那相对的，要是过冲的很深，那就代表逆势方还蛮用力的，就可能导致更平缓更不常见的趋势。同时，除了突破点，对原趋势极值的测试当然也有不及。持平！过冲！三种情况。依然全与多空竞合的状态有关。虽然我们还未正式进入对形态的细节。但你可以想象，杯柄形态作为一轮上升趋势中的顶。多头在其中的表现肯定比持平的双重顶或者右峰更高的双重顶更弱。否则，多头应该更强势一点，至少使得高点抬升，对吧？但没有多头提前离场。那就更会给到逆势空头进取的理由。那在这个重点之下，有什么细项要向你补充呢？有些朋友可能已经考虑到一个实务层面的问题。我知道测试会发生，但测试有没有可能超级不明显？具体一点说，如果价格远离了突破点，60个单位，那后续接了15个单位的回调，就又恢复原趋势方向。我能够判断说，测试已经发生了吗？换句话问，就是测试要多深，交易者在实务上才能够判断测试已经发生。这确实是个棘手的问题，对阿尔布鲁克斯来说，他认为测试至少要达到三分之一深才算数。你要想，如果真有一轮趋势测试，只有皮毛就延续强劲的顺势运行。那这完全是超强的趋势。而超强趋势照理来说会落在常态分布的极端，也就是数量非常稀少。更多的是回调的更深的那一些。所以当你看到突破发起后，出现了未达三分之一的回调，这时候与其押注测试已经结束。接下来会立即发展为超强趋势。更安全，更符合几率常理的做法，应该是认为测试应该还没完全走完，或许还有第二段小推动。测试到更深的地方去。因此，我们在这个问题上就先依循阿尔布克斯的经验之谈，认为测试至少要达到三分之一，身材算数比较恰当。如果你真的很想要捕捉相对强的趋势，那么以此为标准应该能够为你避掉一些其实测试还要更深。但你因为急躁而过早加入的情况。再来沿着刚刚的话题进一步跟你分享第二点。测试“过冲的”会多上许多。我们先前说，市场喜欢待在均衡的状态，对吧？意思是市场中大部分的时间多空的力量不会太过悬殊，且突破打破均衡的尝试倾向失败。一旦有任何一方尝试发起突破，另一方就都会倚仗着区间倾向突破失败的原理。尝试压制突破发生，继而赚取逆势交易的利润。这也就是说，突破发生多数情况下，逆势方不会太轻易拱手相让。而突破发起方也不会那么信誓旦旦，在突破过程中不止盈，疯狂加仓。所以此测试通常会蛮明显的。甚至我可以更具体的告诉你，过冲突破点，清扫那些突破时就旋即入场的交易者的止损是最为多数的情况。这点倾向就给了你相应的行动指示。如果你是突破时旋即追进的那个交易者。你放置在突破点处的止损，很可能会被测试给清扫。所以别贴的那么近，价格可能在触发你的止损后又反向前进。以及如果你喜欢更保守的交易，那你可以等待突破测试完以后在突破点上看到弱势的逆势力量，再考虑加入。这时候，首波突破交易者的止损也清扫完了，你可以将止损放在刚刚测试完毕的K线之外。这么做胜率会比首次入场机会时就追近来的稍微更高一些。好了，第一大点分享完，我们接着谈，另一个要补充给你的关键知识测试可能不止一次。比如你应该有很高的几率，听过三重底或者三推楔形反转。没听过也不要紧，总之就是价格测试了一个支撑阻力三次，最后才反转逆行。以及虽然一推比一推更远，但在第三推的时候发生反转，就测试原趋势极值的角度来说，如果在一轮下降趋势中遭遇三重底，那代表什么呢？代表趋势，第一次尝试反转后，后面测试了一次原趋势极值，先试图造就双重底。不过没有一猝而就，他又测试了一次，才心甘情愿离开。通常啦，如果测试很明确，那么两推就可以造就反转了，但有时候多空双方需要double check。测试一次不够，再测试一次，确定市场没有悬念了，才往他该去的方向去。尤其在前面的单元说过的市场，在不停寻觅最佳价格的过程中，通常必须运行过渡，以确定均匀的边界何在。这里的过渡除了是运行幅度的过渡，也可能是次数的过渡。总之，如果市场尝试某个动作，两次，三次，四次都失败了，那它通常就会试图做相反的事情。往一个价格多次尝试翻越却越不过去，那就代表均衡，不在那一边。市场就该回头找找多空到底希望价格落在何处。反正应该不会再屡屡尝试未果的那一边。好，终于又到单元尾声，我想大家可能也累了，我们快速做个重点整理。","pid":"p275"},{"t":"img","src":"assets/img/l04B_051.webp","ilabel":"4-11","icap":"L04　测试市场对失衡的自我调节","fid":"fig51","ctx":[{"t":"首先，你应该注意到了，测试可能不及，可能持平，也可能过冲，这全看多空竞合的状态。最强劲的趋势中，对突破点的测试通通会不及。这代表踏空和被套的人很多，他们全都着急加入趋势方向，不等待更深的回调，就赶紧抢着上车。那相对的，要是过冲的很深，那就代表逆势方还蛮用力的，就可能导致更平缓更不常见的趋势。同时，除了突破点，对原趋势极值的测试当然也有不及。持平！过冲！三种情况。依然全与多空竞合的状态有关。虽然我们还未正式进入对形态的细节。但你可以想象，杯柄形态作为一轮上升趋势中的顶。多头在其中的表现肯定比持平的双重顶或者右峰更高的双重顶更弱。否则，多头应该更强势一点，至少使得高点抬升，对吧？但没有多头提前离场。那就更会给到逆势空头进取的理由。那在这个重点之下，有什么细项要向你补充呢？有些朋友可能已经考虑到一个实务层面的问题。我知道测试会发生，但测试有没有可能超级不明显？具体一点说，如果价格远离了突破点，60个单位，那后续接了15个单位的回调，就又恢复原趋势方向。我能够判断说，测试已经发生了吗？换句话问，就是测试要多深，交易者在实务上才能够判断测试已经发生。这确实是个棘手的问题，对阿尔布鲁克斯来说，他认为测试至少要达到三分之一深才算数。你要想，如果真有一轮趋势测试，只有皮毛就延续强劲的顺势运行。那这完全是超强的趋势。而超强趋势照理来说会落在常态分布的极端，也就是数量非常稀少。更多的是回调的更深的那一些。所以当你看到突破发起后，出现了未达三分之一的回调，这时候与其押注测试已经结束。接下来会立即发展为超强趋势。更安全，更符合几率常理的做法，应该是认为测试应该还没完全走完，或许还有第二段小推动。测试到更深的地方去。因此，我们在这个问题上就先依循阿尔布克斯的经验之谈，认为测试至少要达到三分之一，身材算数比较恰当。如果你真的很想要捕捉相对强的趋势，那么以此为标准应该能够为你避掉一些其实测试还要更深。但你因为急躁而过早加入的情况。再来沿着刚刚的话题进一步跟你分享第二点。测试“过冲的”会多上许多。我们先前说，市场喜欢待在均衡的状态，对吧？意思是市场中大部分的时间多空的力量不会太过悬殊，且突破打破均衡的尝试倾向失败。一旦有任何一方尝试发起突破，另一方就都会倚仗着区间倾向突破失败的原理。尝试压制突破发生，继而赚取逆势交易的利润。这也就是说，突破发生多数情况下，逆势方不会太轻易拱手相让。而突破发起方也不会那么信誓旦旦，在突破过程中不止盈，疯狂加仓。所以此测试通常会蛮明显的。甚至我可以更具体的告诉你，过冲突破点，清扫那些突破时就旋即入场的交易者的止损是最为多数的情况。这点倾向就给了你相应的行动指示。如果你是突破时旋即追进的那个交易者。你放置在突破点处的止损，很可能会被测试给清扫。所以别贴的那么近，价格可能在触发你的止损后又反向前进。以及如果你喜欢更保守的交易，那你可以等待突破测试完以后在突破点上看到弱势的逆势力量，再考虑加入。这时候，首波突破交易者的止损也清扫完了，你可以将止损放在刚刚测试完毕的K线之外。这么做胜率会比首次入场机会时就追近来的稍微更高一些。好了，第一大点分享完，我们接着谈，另一个要补充给你的关键知识测试可能不止一次。比如你应该有很高的几率，听过三重底或者三推楔形反转。没听过也不要紧，总之就是价格测试了一个支撑阻力三次，最后才反转逆行。以及虽然一推比一推更远，但在第三推的时候发生反转，就测试原趋势极值的角度来说，如果在一轮下降趋势中遭遇三重底，那代表什么呢？代表趋势，第一次尝试反转后，后面测试了一次原趋势极值，先试图造就双重底。不过没有一猝而就，他又测试了一次，才心甘情愿离开。通常啦，如果测试很明确，那么两推就可以造就反转了，但有时候多空双方需要double check。测试一次不够，再测试一次，确定市场没有悬念了，才往他该去的方向去。尤其在前面的单元说过的市场，在不停寻觅最佳价格的过程中，通常必须运行过渡，以确定均匀的边界何在。这里的过渡除了是运行幅度的过渡，也可能是次数的过渡。总之，如果市场尝试某个动作，两次，三次，四次都失败了，那它通常就会试图做相反的事情。往一个价格多次尝试翻越却越不过去，那就代表均衡，不在那一边。市场就该回头找找多空到底希望价格落在何处。反正应该不会再屡屡尝试未果的那一边。好，终于又到单元尾声，我想大家可能也累了，我们快速做个重点整理。","p":"p275"},{"t":"前面已经说过很多次，测试是突破以后紧跟着会发生的事件。由于所有人都不确定突破能不能成功，所以各怀鬼胎的交易者会选择最有利于自己的行动。已经持仓的突破方可能止盈偷跑，可能坚持加仓。防守方则可能加强抵御，也可能倒戈加入突破方。而突破终究能不能成功，就看所有人的投票结果。测试突破点时，答案通常就会揭晓。而交易者们又重新根据最新结果进行下一步决策。其中，突破成功的情况就是押注突破成功的机构人数较多，人多势众。被套和踏空的交易者在回调的测试过程中加入顺势方造就第二推。也因此，回调本身通常就是对突破点的测试，而第二推就是进一步运行去测试原趋势极值的过程。你可以这样记成功的突破会有两段推动，也可以拆开来记住细节，成功的突破，在测试时会表现出顺势方强劲的特征。而测试原趋势极值之时，会显著越过造成新的突破循环。反过来说，突破失败的情况就是押住突破失败的机构人数更多。同样，这也会导致两段推动也有测试突破点和测试原趋势极值的必要步骤。只是，测试突破点的这一推，因为防守方非常强劲，从而导致作为延续的第二推行情可能非常短命。有时候甚至测试不到原趋势极值。所有价格方向的决定都取决于多空双方的动能表现。谁更强，谁就能够主导行情，创造出依然强劲的第二推作为延续。而我们所谓强劲的趋势，就是单方面不断创造新的突破循环的过程。而关于测试，最后还有两个小的知识点介绍给你知道了。首先是测试可能不及，持平或者过冲。交易者应该接受此间的多解性，就像理解任何一场比赛或选举都可能有输掉平手。获胜三种结果一样。而且输还分成惨败，暗察之毫厘。赢也分做大赢和低空飞过。不要被多解性给困住，重要的是赢了，我要怎么做？输了，我要怎么做？平手，我要怎么做？市场给你任何结果，你都可以有相应的应对方式，继而逃避亏损，赚取利润。另一点则是测试不见得只有一次。体育竞赛和选举都可能有延长赛，甚至打官司也有上诉的机制。在市场中，决斗的是世界上最贪婪，最聪明的一群人。他们当然可能对仅仅一次确认的结果感到不服气，再要求第二，第三次确认。因此，虽然我们说任何意外行情通常都会派生出第二推，但产生第三推，第四推作为测试的情况也不少见。接受这个概念，对于我们读图将大有帮助。如今，将突破和测试都联系起来理解以后你已经掌握了价格行为中最底层的逻辑。突破作为失衡，而测试作为市场试图抑制失衡的手段将不绝如缕的出现在图表上。随后我们要谈的包括回调，反转等主题，都是测试与突破的变体或其他表现形式。在下个单元中，我们会接续着目前已经掌握的概念来进一步谈谈回调的原理和机制。我想你会越觉得实用，对读图越具信心。感谢收看测试市场对失衡的自我调节，我们下个单元见。","p":"p276"}]},{"t":"para","text":"前面已经说过很多次，测试是突破以后紧跟着会发生的事件。由于所有人都不确定突破能不能成功，所以各怀鬼胎的交易者会选择最有利于自己的行动。已经持仓的突破方可能止盈偷跑，可能坚持加仓。防守方则可能加强抵御，也可能倒戈加入突破方。而突破终究能不能成功，就看所有人的投票结果。测试突破点时，答案通常就会揭晓。而交易者们又重新根据最新结果进行下一步决策。其中，突破成功的情况就是押注突破成功的机构人数较多，人多势众。被套和踏空的交易者在回调的测试过程中加入顺势方造就第二推。也因此，回调本身通常就是对突破点的测试，而第二推就是进一步运行去测试原趋势极值的过程。你可以这样记成功的突破会有两段推动，也可以拆开来记住细节，成功的突破，在测试时会表现出顺势方强劲的特征。而测试原趋势极值之时，会显著越过造成新的突破循环。反过来说，突破失败的情况就是押住突破失败的机构人数更多。同样，这也会导致两段推动也有测试突破点和测试原趋势极值的必要步骤。只是，测试突破点的这一推，因为防守方非常强劲，从而导致作为延续的第二推行情可能非常短命。有时候甚至测试不到原趋势极值。所有价格方向的决定都取决于多空双方的动能表现。谁更强，谁就能够主导行情，创造出依然强劲的第二推作为延续。而我们所谓强劲的趋势，就是单方面不断创造新的突破循环的过程。而关于测试，最后还有两个小的知识点介绍给你知道了。首先是测试可能不及，持平或者过冲。交易者应该接受此间的多解性，就像理解任何一场比赛或选举都可能有输掉平手。获胜三种结果一样。而且输还分成惨败，暗察之毫厘。赢也分做大赢和低空飞过。不要被多解性给困住，重要的是赢了，我要怎么做？输了，我要怎么做？平手，我要怎么做？市场给你任何结果，你都可以有相应的应对方式，继而逃避亏损，赚取利润。另一点则是测试不见得只有一次。体育竞赛和选举都可能有延长赛，甚至打官司也有上诉的机制。在市场中，决斗的是世界上最贪婪，最聪明的一群人。他们当然可能对仅仅一次确认的结果感到不服气，再要求第二，第三次确认。因此，虽然我们说任何意外行情通常都会派生出第二推，但产生第三推，第四推作为测试的情况也不少见。接受这个概念，对于我们读图将大有帮助。如今，将突破和测试都联系起来理解以后你已经掌握了价格行为中最底层的逻辑。突破作为失衡，而测试作为市场试图抑制失衡的手段将不绝如缕的出现在图表上。随后我们要谈的包括回调，反转等主题，都是测试与突破的变体或其他表现形式。在下个单元中，我们会接续着目前已经掌握的概念来进一步谈谈回调的原理和机制。我想你会越觉得实用，对读图越具信心。感谢收看测试市场对失衡的自我调节，我们下个单元见。","pid":"p276"}],"wcount":8455}],"wcount":14966},{"id":"l05","icon":"L05","title":"L05　回调与趋势中的持续形态（旗型）","blocks":[],"sections":[{"id":"l05A","title":"第A段　回调与趋势中的持续形态（旗型）","blocks":[{"t":"para","text":"L05A 回调与趋势中的持续形态（旗型）","pid":"p277"},{"t":"para","text":"接续突破与测试的话题，我们接着来讲回调。你可能多少已经注意到上个单元，我在谈测试的时候，时常将测试回调这两个名词交替使用。而他们在图表上呈现的样貌，也似乎没有什么区别。的确，测试正是一种回调，而任何回调都是测试。使用的指称不同，只是为了强调这个整理的动作所包含的不同性格面向。于是，谈完测试作为对市场失衡的代谢机制，以检验多空双方究竟有无进取意愿以后。我们接着来谈谈回调的其他内涵。","pid":"p278"},{"t":"img","src":"assets/img/l05A_052.webp","ilabel":"5-1","icap":"L05　回调与趋势中的持续形态（旗型）","fid":"fig52","ctx":[{"t":"L05A 回调与趋势中的持续形态（旗型）","p":"p277"},{"t":"接续突破与测试的话题，我们接着来讲回调。你可能多少已经注意到上个单元，我在谈测试的时候，时常将测试回调这两个名词交替使用。而他们在图表上呈现的样貌，也似乎没有什么区别。的确，测试正是一种回调，而任何回调都是测试。使用的指称不同，只是为了强调这个整理的动作所包含的不同性格面向。于是，谈完测试作为对市场失衡的代谢机制，以检验多空双方究竟有无进取意愿以后。我们接着来谈谈回调的其他内涵。","p":"p278"},{"t":"这个单元的内容将会涵盖对什么是回调的定义，界定说明趋势中的回调将在什么样的情况下结束。结束后，价格又倾向如何运动？还有嵌于趋势中的回调，要是没有能够起到持续形态的作用，使趋势进一步延续。那它将发展成什么市场？又该如何进一步运动？还记得我们说逆势方总是希望造成突破失败，以反转趋势吗？虽然反转的难度很高，不止要让自己的对手突破失败，自己还要进一步突破成功。但前半段还是相对容易些。他们不眠不休地努力，总是会在图表上留下很多暂时性突破失败的痕迹。比如任何向前一根K线极值内部折回的尝试都是，比如在连续的趋势中突然出现的逆势运动也是。","p":"p279"}]},{"t":"para","text":"这个单元的内容将会涵盖对什么是回调的定义，界定说明趋势中的回调将在什么样的情况下结束。结束后，价格又倾向如何运动？还有嵌于趋势中的回调，要是没有能够起到持续形态的作用，使趋势进一步延续。那它将发展成什么市场？又该如何进一步运动？还记得我们说逆势方总是希望造成突破失败，以反转趋势吗？虽然反转的难度很高，不止要让自己的对手突破失败，自己还要进一步突破成功。但前半段还是相对容易些。他们不眠不休地努力，总是会在图表上留下很多暂时性突破失败的痕迹。比如任何向前一根K线极值内部折回的尝试都是，比如在连续的趋势中突然出现的逆势运动也是。","pid":"p279"},{"t":"img","src":"assets/img/l05A_053.webp","ilabel":"5-2","icap":"L05　回调与趋势中的持续形态（旗型）","fid":"fig53","ctx":[{"t":"这个单元的内容将会涵盖对什么是回调的定义，界定说明趋势中的回调将在什么样的情况下结束。结束后，价格又倾向如何运动？还有嵌于趋势中的回调，要是没有能够起到持续形态的作用，使趋势进一步延续。那它将发展成什么市场？又该如何进一步运动？还记得我们说逆势方总是希望造成突破失败，以反转趋势吗？虽然反转的难度很高，不止要让自己的对手突破失败，自己还要进一步突破成功。但前半段还是相对容易些。他们不眠不休地努力，总是会在图表上留下很多暂时性突破失败的痕迹。比如任何向前一根K线极值内部折回的尝试都是，比如在连续的趋势中突然出现的逆势运动也是。","p":"p279"},{"t":"事实上，这两者在图表上是完全等效的，只是时间级别的不同而已。将右边这张五分钟级别的图表每12根K线为一组合并起来，你就会得到左边一小时级别的一根大阳线。以及内包的较小阴线。这就是暂时性的多头突破失败，你也可以说它是突破回调。而这个短暂的逆势运动就是回调。","p":"p280"}]},{"t":"para","text":"事实上，这两者在图表上是完全等效的，只是时间级别的不同而已。将右边这张五分钟级别的图表每12根K线为一组合并起来，你就会得到左边一小时级别的一根大阳线。以及内包的较小阴线。这就是暂时性的多头突破失败，你也可以说它是突破回调。而这个短暂的逆势运动就是回调。","pid":"p280"},{"t":"img","src":"assets/img/l05A_054.webp","ilabel":"5-3","icap":"L05　回调与趋势中的持续形态（旗型）","fid":"fig54","ctx":[{"t":"事实上，这两者在图表上是完全等效的，只是时间级别的不同而已。将右边这张五分钟级别的图表每12根K线为一组合并起来，你就会得到左边一小时级别的一根大阳线。以及内包的较小阴线。这就是暂时性的多头突破失败，你也可以说它是突破回调。而这个短暂的逆势运动就是回调。","p":"p280"},{"t":"同时，你也不难想象，一轮趋势中常常兼有多次的回调。而由于趋势倾向延续，大多数逆势方造成突破失败，以及反转趋势的尝试都会失败。直到最后的最后，在趋势的最后阶段，终有一次回调会走的太深太过头，最终演变成反转。因此，你也可以说，一轮趋势总是终结于突破失败。随着趋势动能溢散，越接近末尾则突破失败，终将成功。同时也是逆势方突破成功之时。到课程的后半段，当所有知识都备齐，你会发现交易者每逢回调，每逢暂时的突破失败。就常常需要思考这样的一个问题。这将导致什么程度的反转是小型趋势反转只是暂时的修整，最后会造成持续形态趋势延续。还是说这是大型趋势反转是最后一次将引出失败突破的回调，而将造成逆向趋势发起。","p":"p281"}]},{"t":"para","text":"同时，你也不难想象，一轮趋势中常常兼有多次的回调。而由于趋势倾向延续，大多数逆势方造成突破失败，以及反转趋势的尝试都会失败。直到最后的最后，在趋势的最后阶段，终有一次回调会走的太深太过头，最终演变成反转。因此，你也可以说，一轮趋势总是终结于突破失败。随着趋势动能溢散，越接近末尾则突破失败，终将成功。同时也是逆势方突破成功之时。到课程的后半段，当所有知识都备齐，你会发现交易者每逢回调，每逢暂时的突破失败。就常常需要思考这样的一个问题。这将导致什么程度的反转是小型趋势反转只是暂时的修整，最后会造成持续形态趋势延续。还是说这是大型趋势反转是最后一次将引出失败突破的回调，而将造成逆向趋势发起。","pid":"p281"},{"t":"img","src":"assets/img/l05A_055.webp","ilabel":"5-4","icap":"L05　回调与趋势中的持续形态（旗型）","fid":"fig55","ctx":[{"t":"同时，你也不难想象，一轮趋势中常常兼有多次的回调。而由于趋势倾向延续，大多数逆势方造成突破失败，以及反转趋势的尝试都会失败。直到最后的最后，在趋势的最后阶段，终有一次回调会走的太深太过头，最终演变成反转。因此，你也可以说，一轮趋势总是终结于突破失败。随着趋势动能溢散，越接近末尾则突破失败，终将成功。同时也是逆势方突破成功之时。到课程的后半段，当所有知识都备齐，你会发现交易者每逢回调，每逢暂时的突破失败。就常常需要思考这样的一个问题。这将导致什么程度的反转是小型趋势反转只是暂时的修整，最后会造成持续形态趋势延续。还是说这是大型趋势反转是最后一次将引出失败突破的回调，而将造成逆向趋势发起。","p":"p281"},{"t":"你一定还记得上个单元里，我们对顺势与逆势的各种行动者进行了意图揣摩。拆解测试发生的原因。那既然测试与回调，实际上并无不同，此际我们就来复习一下回调启动的原因。趋势中之所以出现停顿与回调，一方面是导因于持仓中的顺势交易者开始止盈。他们持仓持的好端端的，为什么要止盈？原因是要是自己太松懈，放任利润奔跑，那友军可能提早偷跑，开启猛烈的止盈活动。一旦多数人同时开始止盈，那有可能我好不容易累积起的浮盈会通通回吐。这相当于赚进了钱，又亏了回去跟赔钱没有两样。所以持仓中的顺势交易者也会互相猜忌，基于遏止曝险继续扩大的理由，开始找机会平仓。不止盈就可能白干，而止盈又相当于卖出，那这种卖压将在累积到某个程度后，压过持续入场的顺势订单终于启动小型趋势反转。除了持仓中的顺势交易者开始止盈，另一个关键原因就是顺势交易者停止建立新仓。刚刚这段运行是怎么维持的呢？要是没有了持续买进，要怎么形成阳线？所以肯定是有人不断在买。但如果他们买着买着，发现止盈的人好像越来越多，涨得越来越慢。那他们当然也会嗅到危险，变成开始卖出的那一群人。所以，当顺势交易者认为当前价格已经运行过度而持续买进的数学优势越来越低的时候。他们就会要么停止建仓，要么更狠开始平仓卖出。直到价格回到他们认为划算的位置，可以重新买进，并且还有数学优势的时候才会进场。遂此，顺势交易者止盈也会导致回调的行程。第三股力量则是激进逆势交易者的介入。既然趋势倾向延续，他们通常会先静观其变，不会冒进，但蠢蠢欲动。直到顺势方确实现出颓势，持仓者开始止盈，建仓者开始罢休，而回调确实启动以后。他们就会趁机而入，试图赚一个短小的利润。综合以上这三股力量的共同决策，会导致回调启动。启动以后，顺势交易者会因为看见反转迹象而更积极止盈，更保守建仓。逆势剥头皮交易者，则亦会趁虚而入，使回调的成立越加明确。直到哪里呢？直到顺势交易者觉得修正太多了，现在进场很划算，他们就会愿意重新进场。逆势交易者则认为自己本来就不应该持仓太久，不该造次而开始止盈离场。遂此多空，同时买进的意图就又重新汇合，导致回调结束而趋势延续。这里岔出来，用另一个角度讲一下。刚刚提到数学优势，所有的多空机构都只会做有数学优势的决策。不过，什么叫做有数学优势？没有数学优势。你一定记得第一个单元里，我们讲期望值的公式，对吧？这里我们可以再次用上。","p":"p282"}]},{"t":"para","text":"你一定还记得上个单元里，我们对顺势与逆势的各种行动者进行了意图揣摩。拆解测试发生的原因。那既然测试与回调，实际上并无不同，此际我们就来复习一下回调启动的原因。趋势中之所以出现停顿与回调，一方面是导因于持仓中的顺势交易者开始止盈。他们持仓持的好端端的，为什么要止盈？原因是要是自己太松懈，放任利润奔跑，那友军可能提早偷跑，开启猛烈的止盈活动。一旦多数人同时开始止盈，那有可能我好不容易累积起的浮盈会通通回吐。这相当于赚进了钱，又亏了回去跟赔钱没有两样。所以持仓中的顺势交易者也会互相猜忌，基于遏止曝险继续扩大的理由，开始找机会平仓。不止盈就可能白干，而止盈又相当于卖出，那这种卖压将在累积到某个程度后，压过持续入场的顺势订单终于启动小型趋势反转。除了持仓中的顺势交易者开始止盈，另一个关键原因就是顺势交易者停止建立新仓。刚刚这段运行是怎么维持的呢？要是没有了持续买进，要怎么形成阳线？所以肯定是有人不断在买。但如果他们买着买着，发现止盈的人好像越来越多，涨得越来越慢。那他们当然也会嗅到危险，变成开始卖出的那一群人。所以，当顺势交易者认为当前价格已经运行过度而持续买进的数学优势越来越低的时候。他们就会要么停止建仓，要么更狠开始平仓卖出。直到价格回到他们认为划算的位置，可以重新买进，并且还有数学优势的时候才会进场。遂此，顺势交易者止盈也会导致回调的行程。第三股力量则是激进逆势交易者的介入。既然趋势倾向延续，他们通常会先静观其变，不会冒进，但蠢蠢欲动。直到顺势方确实现出颓势，持仓者开始止盈，建仓者开始罢休，而回调确实启动以后。他们就会趁机而入，试图赚一个短小的利润。综合以上这三股力量的共同决策，会导致回调启动。启动以后，顺势交易者会因为看见反转迹象而更积极止盈，更保守建仓。逆势剥头皮交易者，则亦会趁虚而入，使回调的成立越加明确。直到哪里呢？直到顺势交易者觉得修正太多了，现在进场很划算，他们就会愿意重新进场。逆势交易者则认为自己本来就不应该持仓太久，不该造次而开始止盈离场。遂此多空，同时买进的意图就又重新汇合，导致回调结束而趋势延续。这里岔出来，用另一个角度讲一下。刚刚提到数学优势，所有的多空机构都只会做有数学优势的决策。不过，什么叫做有数学优势？没有数学优势。你一定记得第一个单元里，我们讲期望值的公式，对吧？这里我们可以再次用上。","pid":"p282"},{"t":"img","src":"assets/img/l05A_056.webp","ilabel":"5-5","icap":"L05　回调与趋势中的持续形态（旗型）","fid":"fig56","ctx":[{"t":"你一定还记得上个单元里，我们对顺势与逆势的各种行动者进行了意图揣摩。拆解测试发生的原因。那既然测试与回调，实际上并无不同，此际我们就来复习一下回调启动的原因。趋势中之所以出现停顿与回调，一方面是导因于持仓中的顺势交易者开始止盈。他们持仓持的好端端的，为什么要止盈？原因是要是自己太松懈，放任利润奔跑，那友军可能提早偷跑，开启猛烈的止盈活动。一旦多数人同时开始止盈，那有可能我好不容易累积起的浮盈会通通回吐。这相当于赚进了钱，又亏了回去跟赔钱没有两样。所以持仓中的顺势交易者也会互相猜忌，基于遏止曝险继续扩大的理由，开始找机会平仓。不止盈就可能白干，而止盈又相当于卖出，那这种卖压将在累积到某个程度后，压过持续入场的顺势订单终于启动小型趋势反转。除了持仓中的顺势交易者开始止盈，另一个关键原因就是顺势交易者停止建立新仓。刚刚这段运行是怎么维持的呢？要是没有了持续买进，要怎么形成阳线？所以肯定是有人不断在买。但如果他们买着买着，发现止盈的人好像越来越多，涨得越来越慢。那他们当然也会嗅到危险，变成开始卖出的那一群人。所以，当顺势交易者认为当前价格已经运行过度而持续买进的数学优势越来越低的时候。他们就会要么停止建仓，要么更狠开始平仓卖出。直到价格回到他们认为划算的位置，可以重新买进，并且还有数学优势的时候才会进场。遂此，顺势交易者止盈也会导致回调的行程。第三股力量则是激进逆势交易者的介入。既然趋势倾向延续，他们通常会先静观其变，不会冒进，但蠢蠢欲动。直到顺势方确实现出颓势，持仓者开始止盈，建仓者开始罢休，而回调确实启动以后。他们就会趁机而入，试图赚一个短小的利润。综合以上这三股力量的共同决策，会导致回调启动。启动以后，顺势交易者会因为看见反转迹象而更积极止盈，更保守建仓。逆势剥头皮交易者，则亦会趁虚而入，使回调的成立越加明确。直到哪里呢？直到顺势交易者觉得修正太多了，现在进场很划算，他们就会愿意重新进场。逆势交易者则认为自己本来就不应该持仓太久，不该造次而开始止盈离场。遂此多空，同时买进的意图就又重新汇合，导致回调结束而趋势延续。这里岔出来，用另一个角度讲一下。刚刚提到数学优势，所有的多空机构都只会做有数学优势的决策。不过，什么叫做有数学优势？没有数学优势。你一定记得第一个单元里，我们讲期望值的公式，对吧？这里我们可以再次用上。","p":"p282"},{"t":"在交易的现场动态思考期望是否为证的时候，交易者们常常会扪心自问。价格在逆势运动X点之前，先顺势运动X点的几率是多少？有没有高于50%？比如，当我们在一轮急速的上升运动中，按下时间停止键。请回答我，价格在这里先向上走两个点，跟先向下走两个点，哪个几率更高？我相信你可以很直觉的认定，虽然突然折返的可能性不是零，但先顺着走的几率应该更高。这种直觉的来源就是你脑袋里面已经内见趋势倾向延续的理念。因此，对精明的顺势方机构来讲，只要趋势动能明确，价格在逆势运动X点之前。先顺势运动X点的几率高于50%，那就有不断追进的理由。而且几率越高，追起来越有利可图。但是好景不长，刚刚提到趋势，发展越久，止盈的顺势交易者会越来越多。没钱建新仓的顺势交易者也越来越多。想要趁虚而入的逆势交易者，也更按耐不住。为什么呢？因为有种种迹象，包括阴线越来越多，阳线越来越短,离突破点越来越远。离运动路径上的阻力越来越近。这些都让大家心知肚明，价格在逆势运动X点之前，先顺势运动X点的几率越来越低。在突破瞬间，可能有70%不久之后还有60%，但接下来只会越来越低。直到某个大家说不清楚具体在哪里的位置，顺势交易的胜率优势会下降到50%。甚至因为过冲而不到50%。那这就是修正的开始。因为现在反而是做空的，数学优势更大了。价格先下跌两点，比起先上涨两点的几率更高了。所以说，从纯数学的角度来看，我们也能够解释回调启动的原因。值得顺便抛出来一说的是，趋势中存在两种顺势交易者。一种叫动能交易者，一种叫价值交易者。前者就是追高杀低的那一种。别以为追高杀低是负面的形容，我们说机构都是精明，长期而言盈利的。这些追高杀低的行为，全部都有坚实的数学基础。这些动能交易者的逻辑是认为，只要趋势动能仍然强劲。趋势就应当还有延续性行情。因此，他们愿意在收出顺向趋势K线的时候，每根K线被突破成功的时候，每个原趋势极值被突破的时候追入。也就是说，这种不断突破的迹象被他们的算法判定为顺行几率高于50%的证据。在价格下跌X点之前，先上涨X点的几率高于50%，最近就有利可图。直到这个几率不到50%，他们就会收手，等待下一次的机会。另一种价值交易者希望赚取的是价格回归价值的差价，他们只想做划算的交易。跟前一批人比起来，为了追求更高的胜率，止损通常放得很宽。但价值交易者们并不喜欢这种低盈亏比的做法。所以同样是在上升趋势中，他们寻求正向期望的方式不是拉高胜率而是寻求能用相对窄小止损的交易机会，只在市场过度反应的时候，以划算的价格介入。这也就是说，因此他们倾向仅在回调中入场。最好是能够抓到回调结束的尾巴，愿意牺牲胜率以换得更小的风险。综合起来看，当运行结束，回调启动就是动能交易者退场，而价值交易者等待一个划算价格建仓的过程。而当回调结束以后，价值交易者收手，而动能交易者就又慢慢重新入场。将测试原趋势极值以前的这段上升看作一个小型趋势的人，可能愿意至少追进到测试原趋势极值。而要是有幸强劲突破，更多的动能交易者就会赶紧入场，寻求新一段的突破利润。此间要去争取哪一段利润，想当哪一种类型的交易者，是大家可以在听课期间逐渐去思考，去决定的事情。这关乎你的思考习惯，也关乎你的个性。可以想想怎样做起交易来才舒服。关于这点，更详细的内容会在交易风格的单元深入探讨，可以期待一下。","p":"p283"}]},{"t":"para","text":"在交易的现场动态思考期望是否为证的时候，交易者们常常会扪心自问。价格在逆势运动X点之前，先顺势运动X点的几率是多少？有没有高于50%？比如，当我们在一轮急速的上升运动中，按下时间停止键。请回答我，价格在这里先向上走两个点，跟先向下走两个点，哪个几率更高？我相信你可以很直觉的认定，虽然突然折返的可能性不是零，但先顺着走的几率应该更高。这种直觉的来源就是你脑袋里面已经内见趋势倾向延续的理念。因此，对精明的顺势方机构来讲，只要趋势动能明确，价格在逆势运动X点之前。先顺势运动X点的几率高于50%，那就有不断追进的理由。而且几率越高，追起来越有利可图。但是好景不长，刚刚提到趋势，发展越久，止盈的顺势交易者会越来越多。没钱建新仓的顺势交易者也越来越多。想要趁虚而入的逆势交易者，也更按耐不住。为什么呢？因为有种种迹象，包括阴线越来越多，阳线越来越短,离突破点越来越远。离运动路径上的阻力越来越近。这些都让大家心知肚明，价格在逆势运动X点之前，先顺势运动X点的几率越来越低。在突破瞬间，可能有70%不久之后还有60%，但接下来只会越来越低。直到某个大家说不清楚具体在哪里的位置，顺势交易的胜率优势会下降到50%。甚至因为过冲而不到50%。那这就是修正的开始。因为现在反而是做空的，数学优势更大了。价格先下跌两点，比起先上涨两点的几率更高了。所以说，从纯数学的角度来看，我们也能够解释回调启动的原因。值得顺便抛出来一说的是，趋势中存在两种顺势交易者。一种叫动能交易者，一种叫价值交易者。前者就是追高杀低的那一种。别以为追高杀低是负面的形容，我们说机构都是精明，长期而言盈利的。这些追高杀低的行为，全部都有坚实的数学基础。这些动能交易者的逻辑是认为，只要趋势动能仍然强劲。趋势就应当还有延续性行情。因此，他们愿意在收出顺向趋势K线的时候，每根K线被突破成功的时候，每个原趋势极值被突破的时候追入。也就是说，这种不断突破的迹象被他们的算法判定为顺行几率高于50%的证据。在价格下跌X点之前，先上涨X点的几率高于50%，最近就有利可图。直到这个几率不到50%，他们就会收手，等待下一次的机会。另一种价值交易者希望赚取的是价格回归价值的差价，他们只想做划算的交易。跟前一批人比起来，为了追求更高的胜率，止损通常放得很宽。但价值交易者们并不喜欢这种低盈亏比的做法。所以同样是在上升趋势中，他们寻求正向期望的方式不是拉高胜率而是寻求能用相对窄小止损的交易机会，只在市场过度反应的时候，以划算的价格介入。这也就是说，因此他们倾向仅在回调中入场。最好是能够抓到回调结束的尾巴，愿意牺牲胜率以换得更小的风险。综合起来看，当运行结束，回调启动就是动能交易者退场，而价值交易者等待一个划算价格建仓的过程。而当回调结束以后，价值交易者收手，而动能交易者就又慢慢重新入场。将测试原趋势极值以前的这段上升看作一个小型趋势的人，可能愿意至少追进到测试原趋势极值。而要是有幸强劲突破，更多的动能交易者就会赶紧入场，寻求新一段的突破利润。此间要去争取哪一段利润，想当哪一种类型的交易者，是大家可以在听课期间逐渐去思考，去决定的事情。这关乎你的思考习惯，也关乎你的个性。可以想想怎样做起交易来才舒服。关于这点，更详细的内容会在交易风格的单元深入探讨，可以期待一下。","pid":"p283"},{"t":"img","src":"assets/img/l05A_057.webp","ilabel":"5-6","icap":"L05　回调与趋势中的持续形态（旗型）","fid":"fig57","ctx":[{"t":"在交易的现场动态思考期望是否为证的时候，交易者们常常会扪心自问。价格在逆势运动X点之前，先顺势运动X点的几率是多少？有没有高于50%？比如，当我们在一轮急速的上升运动中，按下时间停止键。请回答我，价格在这里先向上走两个点，跟先向 劲趋势，总是倾向延续，反转尝试总是倾向失败的道理。认为顺势交易者通常能够在几根K线内就有将局势扭转。使这个看似吓人的下跌，终究只是回调，终究只是还能引发趋势恢复的持续形态。因此，遇到这种现象，擅长阅读脉络与动能，知道反转没有那么容易成立的交易者会晓得，可以透过押注反转尝试失败而获利。这种强劲的回调，总是会将懵懂的新手交易者吓跑。甚至转而加入错误的方向。会被套就是因为选择卖出，你卖出的订单是谁给你成交？是那些精明的机构。他们知道这是倾向失败的反转假象。因此，与你进行相反的动作买进。关于回调，我们再进一步靠前放大，看看内部的运作。先解决回调的称呼问题，如何根据它的运动内涵来去指称它？接着再来谈谈回调通常在什么地方结束，结束以后又何去何从？首先稍微有一点读图经验的交易者知道回调可长可短，奇形怪状。而接触过形态学知识的朋友，也可能晓得有交易者会用回调的外观来称呼他。比如要是回调走成一个逆向的，收敛的形状，就称它为楔形回调。水平收敛的则是收敛三角。除此之外，还有扩张三角，双重顶底，头肩顶底，杯柄等等五花八门。但在这里请放心，我们不需要特别去记忆跟纠结这些，根据外观来命名的方式。而是要注意到，它们都有相同的本质。什么样的相同本质呢？相对于前面的趋势性运动，那段动能，斜率，幅度，连续性都更明确的运行来讲。回调具有更严重的双边交易性格。之所以存在双边交易，前面都说得很清楚了。顺势这边有人想要止盈，有人想要加仓。逆势这边有人想要趁人之危，有人被套了，想赶紧离场。大家打成一团，还在等待形成一个结论。那尽管过程中逆势交易者占优势的程度不一定，越占优势就越倾斜。调整的时长也有长有短。但他们毕竟都是某种程度的区间。逆势方会在耗时越来越长的等待过程中显露疲态。所以，相较于原趋势运行，这些回调的共通点就在于逆势方将屡屡缺乏跟进力量。","p":"p284"}]},{"t":"para","text":"谈了这么久的测试与回调，应该是时候来把仔细的定义也过一下。将会更方便，我们沟通也方便，你将来在制定交易规则的时候有个基础可以依循。广义而言，任何趋势中的停顿都是回调。对吧，动能停下来就是有顺势交易者偷懒，有逆势交易者介入。这种双边交易状态，尽管只持续一下下，只持续一根K线，它都可以被视作是某种区间。以暂时停顿的十字星，也就是区间K线为例，思考内部的轨迹可能会是这样的。那里头你必定能够观察到向下调整的痕迹，这是微型的回调。那既然有广义而言，也就随之有严格来讲。阿尔布鲁克斯把回调K线定义的很清楚。只有当上升趋势中的K线低点降低或下降趋势中的K线高点抬高，我们才称在该时间级别图表上发生了回调。表示不满足此条件，所有折返无论是趋势K线或十字星，只能算是隐含回调K线。也就是可以推测，在更小时间级别图表上，应当发生过回调。但总之，在这个级别的图表上面不算。你要叫它停顿K线也可以。与此相对的，就是刚刚讲过的宽松版本定义。将趋势动能的任何停顿都看作是回调。那么，采取何种定义，更有助于交易呢？这就端看交易者的需求与爱好了。可以见得，画面中的逆势力量一次比一次强。最左边还只是十字星停顿，只是隐含回调。但越往右边回调越强，甚至让你怀疑是不是要反转了。必须说，交易者确实常常能够观察到回调系由非常强劲的逆势K线所启动，这是顺势交易者突然踊跃退场的现象。你也可以称它为放弃K线，他们暂时放弃了。这时候，作为急速的逆势运动，逆势交易者发现自己好像突然占了比想象更大的上风。他们也会试图去创造延续性的行情。就如我们先前说过的，突破后还有第二推那样。但是也请记得，趋势倾向延续强劲趋势尤其如此。动能交易者暂时退场，不代表没有价值交易者在低处等待与划算的价位重返。因此，我们还是要搬出强劲趋势，总是倾向延续，反转尝试总是倾向失败的道理。认为顺势交易者通常能够在几根K线内就有将局势扭转。使这个看似吓人的下跌，终究只是回调，终究只是还能引发趋势恢复的持续形态。因此，遇到这种现象，擅长阅读脉络与动能，知道反转没有那么容易成立的交易者会晓得，可以透过押注反转尝试失败而获利。这种强劲的回调，总是会将懵懂的新手交易者吓跑。甚至转而加入错误的方向。会被套就是因为选择卖出，你卖出的订单是谁给你成交？是那些精明的机构。他们知道这是倾向失败的反转假象。因此，与你进行相反的动作买进。关于回调，我们再进一步靠前放大，看看内部的运作。先解决回调的称呼问题，如何根据它的运动内涵来去指称它？接着再来谈谈回调通常在什么地方结束，结束以后又何去何从？首先稍微有一点读图经验的交易者知道回调可长可短，奇形怪状。而接触过形态学知识的朋友，也可能晓得有交易者会用回调的外观来称呼他。比如要是回调走成一个逆向的，收敛的形状，就称它为楔形回调。水平收敛的则是收敛三角。除此之外，还有扩张三角，双重顶底，头肩顶底，杯柄等等五花八门。但在这里请放心，我们不需要特别去记忆跟纠结这些，根据外观来命名的方式。而是要注意到，它们都有相同的本质。什么样的相同本质呢？相对于前面的趋势性运动，那段动能，斜率，幅度，连续性都更明确的运行来讲。回调具有更严重的双边交易性格。之所以存在双边交易，前面都说得很清楚了。顺势这边有人想要止盈，有人想要加仓。逆势这边有人想要趁人之危，有人被套了，想赶紧离场。大家打成一团，还在等待形成一个结论。那尽管过程中逆势交易者占优势的程度不一定，越占优势就越倾斜。调整的时长也有长有短。但他们毕竟都是某种程度的区间。逆势方会在耗时越来越长的等待过程中显露疲态。所以，相较于原趋势运行，这些回调的共通点就在于逆势方将屡屡缺乏跟进力量。","pid":"p284"},{"t":"img","src":"assets/img/l05A_058.webp","ilabel":"5-7","icap":"L05　回调与趋势中的持续形态（旗型）","fid":"fig58","ctx":[{"t":"谈了这么久的测试与回调，应该是时候来把仔细的定义也过一下。将会更方便，我们沟通也方便，你将来在制定交易规则的时候有个基础可以依循。广义而言，任何趋势中的停顿都是回调。对吧，动能停下来就是有顺势交易者偷懒，有逆势交易者介入。这种双边交易状态，尽管只持续一下下，只持续一根K线，它都可以被视作是某种区间。以暂时停顿的十字星，也就是区间K线为例，思考内部的轨迹可能会是这样的。那里头你必定能够观察到向下调整的痕迹，这是微型的回调。那既然有广义而言，也就随之有严格来讲。阿尔布鲁克斯把回调K线定义的很清楚。只有当上升趋势中的K线低点降低或下降趋势中的K线高点抬高，我们才称在该时间级别图表上发生了回调。表示不满足此条件，所有折返无论是趋势K线或十字星，只能算是隐含回调K线。也就是可以推测，在更小时间级别图表上，应当发生过回调。但总之，在这个级别的图表上面不算。你要叫它停顿K线也可以。与此相对的，就是刚刚讲过的宽松版本定义。将趋势动能的任何停顿都看作是回调。那么，采取何种定义，更有助于交易呢？这就端看交易者的需求与爱好了。可以见得，画面中的逆势力量一次比一次强。最左边还只是十字星停顿，只是隐含回调。但越往右边回调越强，甚至让你怀疑是不是要反转了。必须说，交易者确实常常能够观察到回调系由非常强劲的逆势K线所启动，这是顺势交易者突然踊跃退场的现象。你也可以称它为放弃K线，他们暂时放弃了。这时候，作为急速的逆势运动，逆势交易者发现自己好像突然占了比想象更大的上风。他们也会试图去创造延续性的行情。就如我们先前说过的，突破后还有第二推那样。但是也请记得，趋势倾向延续强劲趋势尤其如此。动能交易者暂时退场，不代表没有价值交易者在低处等待与划算的价位重返。因此，我们还是要搬出强劲趋势，总是倾向延续，反转尝试总是倾向失败的道理。认为顺势交易者通常能够在几根K线内就有将局势扭转。使这个看似吓人的下跌，终究只是回调，终究只是还能引发趋势恢复的持续形态。因此，遇到这种现象，擅长阅读脉络与动能，知道反转没有那么容易成立的交易者会晓得，可以透过押注反转尝试失败而获利。这种强劲的回调，总是会将懵懂的新手交易者吓跑。甚至转而加入错误的方向。会被套就是因为选择卖出，你卖出的订单是谁给你成交？是那些精明的机构。他们知道这是倾向失败的反转假象。因此，与你进行相反的动作买进。关于回调，我们再进一步靠前放大，看看内部的运作。先解决回调的称呼问题，如何根据它的运动内涵来去指称它？接着再来谈谈回调通常在什么地方结束，结束以后又何去何从？首先稍微有一点读图经验的交易者知道回调可长可短，奇形怪状。而接触过形态学知识的朋友，也可能晓得有交易者会用回调的外观来称呼他。比如要是回调走成一个逆向的，收敛的形状，就称它为楔形回调。水平收敛的则是收敛三角。除此之外，还有扩张三角，双重顶底，头肩顶底，杯柄等等五花八门。但在这里请放心，我们不需要特别去记忆跟纠结这些，根据外观来命名的方式。而是要注意到，它们都有相同的本质。什么样的相同本质呢？相对于前面的趋势性运动，那段动能，斜率，幅度，连续性都更明确的运行来讲。回调具有更严重的双边交易性格。之所以存在双边交易，前面都说得很清楚了。顺势这边有人想要止盈，有人想要加仓。逆势这边有人想要趁人之危，有人被套了，想赶紧离场。大家打成一团，还在等待形成一个结论。那尽管过程中逆势交易者占优势的程度不一定，越占优势就越倾斜。调整的时长也有长有短。但他们毕竟都是某种程度的区间。逆势方会在耗时越来越长的等待过程中显露疲态。所以，相较于原趋势运行，这些回调的共通点就在于逆势方将屡屡缺乏跟进力量。","p":"p284"},{"t":"来看两个例子，你会很容易明白。这是一轮上升趋势突破下方区间后，运行了一段距离才进入回调的状态。回调结束后恢复了上涨的运行。仔细一点看，回调内部至少可以被粗分出两推下跌的轮廓，对吧？这是空头的两次失利，他们试图要扭转这段上涨发起向下的突破。但观察动能这里的第二段推动对第一段推动的最低点进行了突破以后却失败了，没有跟进。反而是立刻被阳线接着吞没。这是空头的突破失败，也完全就是空方缺乏跟进力量的证据。上个单元讲测试的时候，我们说如果价格尝试了一件事情多次，但没有成果，它往往会开始朝反方向去运动。这里缺乏跟进的下跌，作为对前一推的失败突破，就证明了在这个脉络里均衡不应该在下面。而是在上面。接下来，市场会向上去探索，寻找更多人认可的公平价格。同样，右边这个例子则是嵌于下降趋势中的回调。显得耗时更漫长，但你还是能够大致看出里头的推动轨迹，多头同样屡屡试图反转行情转跌为升。但有成功吗？它花了比前段下跌更长的时间，创造出三次推动，但动能斜率幅度连续性都不如空头急速。每次越过前波断点就失败，很快收阴线下来。这代表多头也没有动真格的意思，或者总之力不从心。以这个范畴中的小型上升趋势来说，每次测试原趋势极值的时候诶，我在这里称原趋势极值。是因为就这个局部来说，它也是一个小型的上升趋势哦，回调在更小时间级别图表上亦是趋势。只不过，相较于当前时间级别图表上的原空头趋势稍微更小更弱。那既然回调，亦是小型的局部趋势，那么就也跟多数趋势相同，拥有至少两段推动。这跟前面单元提过的一样，而这里是三推。好，我们拉回来。每次测试原趋势极值的时候，涌现的不是多头的动能交易者，而是卖单。这些卖单由多头止盈与空头的价值交易者介入组合而成。于是乎，趋势同样倾向延续，反转尝试倾向失败。这段回调就只是回调，成了引出后续行情的持续形态。","p":"p285"}]},{"t":"para","text":"来看两个例子，你会很容易明白。这是一轮上升趋势突破下方区间后，运行了一段距离才进入回调的状态。回调结束后恢复了上涨的运行。仔细一点看，回调内部至少可以被粗分出两推下跌的轮廓，对吧？这是空头的两次失利，他们试图要扭转这段上涨发起向下的突破。但观察动能这里的第二段推动对第一段推动的最低点进行了突破以后却失败了，没有跟进。反而是立刻被阳线接着吞没。这是空头的突破失败，也完全就是空方缺乏跟进力量的证据。上个单元讲测试的时候，我们说如果价格尝试了一件事情多次，但没有成果，它往往会开始朝反方向去运动。这里缺乏跟进的下跌，作为对前一推的失败突破，就证明了在这个脉络里均衡不应该在下面。而是在上面。接下来，市场会向上去探索，寻找更多人认可的公平价格。同样，右边这个例子则是嵌于下降趋势中的回调。显得耗时更漫长，但你还是能够大致看出里头的推动轨迹，多头同样屡屡试图反转行情转跌为升。但有成功吗？它花了比前段下跌更长的时间，创造出三次推动，但动能斜率幅度连续性都不如空头急速。每次越过前波断点就失败，很快收阴线下来。这代表多头也没有动真格的意思，或者总之力不从心。以这个范畴中的小型上升趋势来说，每次测试原趋势极值的时候诶，我在这里称原趋势极值。是因为就这个局部来说，它也是一个小型的上升趋势哦，回调在更小时间级别图表上亦是趋势。只不过，相较于当前时间级别图表上的原空头趋势稍微更小更弱。那既然回调，亦是小型的局部趋势，那么就也跟多数趋势相同，拥有至少两段推动。这跟前面单元提过的一样，而这里是三推。好，我们拉回来。每次测试原趋势极值的时候，涌现的不是多头的动能交易者，而是卖单。这些卖单由多头止盈与空头的价值交易者介入组合而成。于是乎，趋势同样倾向延续，反转尝试倾向失败。这段回调就只是回调，成了引出后续行情的持续形态。","pid":"p285"},{"t":"img","src":"assets/img/l05A_059.webp","ilabel":"5-8","icap":"L05　回调与趋势中的持续形态（旗型）","fid":"fig59","ctx":[{"t":"来看两个例子，你会很容易明白。这是一轮上升趋势突破下方区间后，运行了一段距离才进入回调的状态。回调结束后恢复了上涨的运行。仔细一点看，回调内部至少可以被粗分出两推下跌的轮廓，对吧？这是空头的两次失利，他们试图要扭转这段上涨发起向下的突破。但观察动能这里的第二段推动对第一段推动的最低点进行了突破以后却失败了，没有跟进。反而是立刻被阳线接着吞没。这是空头的突破失败，也完全就是空方缺乏跟进力量的证据。上个单元讲测试的时候，我们说如果价格尝试了一件事情多次，但没有成果，它往往会开始朝反方向去运动。这里缺乏跟进的下跌，作为对前一推的失败突破，就证明了在这个脉络里均衡不应该在下面。而是在上面。接下来，市场会向上去探索，寻找更多人认可的公平价格。同样，右边这个例子则是嵌于下降趋势中的回调。显得耗时更漫长，但你还是能够大致看出里头的推动轨迹，多头同样屡屡试图反转 ，或演变为反转。","pid":"p290"},{"t":"img","src":"assets/img/l05B_062.webp","ilabel":"5-11","icap":"L05　回调与趋势中的持续形态（旗型）","fid":"fig62","ctx":[{"t":"此话怎讲？你应该已经知道答案了，屡屡的突破失败会导致市场尝试反方向的运动。因此，以嵌于上升趋势中的下降通道为例，交易者可以这样去记忆。在80%的情况下，后续行情将以此顺序展开。趋势线被突破原趋势极值遭到测试，而测试后有两种不同结果。如果突破成功，那将会展开新的突破循环。如果失败，则将此段回调当做下降趋势来看的话，对空头来说，下降趋势的原趋势极值要被测试。而此后则转入区间，或演变为反转。","p":"p290"},{"t":"直接来看一些例子，或许你会更明白。过程中，我们也要揣摩多空双方的意图。你可以看到，先是接连的阳线突破这个横向的区间，对吧？比起所突破的水平，整理动能明显干净许多，都是趋势阳线。不过也感受得到，随时间发展动能稍稍有减弱的迹象。何以见得呢？实体变短了。而且很仔细计较的话，上影线好像到了最后一根变得更长了一些，对吧？这些都是买压减弱的提示。虽然这不代表你可以做空哦，我知道有人可能按耐不住了。但随后出现一根更长的趋势，阳线后就进入了连续三根趋势阴线的回调。为什么我们只说这个是回调呢？因为光是这样，没有理由认为趋势要反转了。前面的多头动能干净利落，你也听我说过，急速回调并不罕见。我们仍然更有理由认为，多头趋势延续的可能性更大。所以我们要接着看看空头突破以后，它还有没有能力创造出更多的推动？可惜马上又是阳线。虽然在这里多头也没有立刻返回急速状态，但空头也没有特别争气。下一次对下跌趋势极值的测试只越过一点点就失去跟进。接下来，第三，第四推运动也没有创出有效新低的本事。通通都是马上被阳线扳回一城。这个过程已经揭示了所有回调的特质。空头耗时许久，但成绩不张，突破尝试都没有接续跟进。另一方面，反倒是多头在这趟下跌趋势中屡屡出现中断空头的运作。一测试到关键的价位，也就是先前这段多头急速的突破对象，就立刻收了粗涌的阳线。给到突破回调的建仓形态，由双K线反转所启动。如果你形成了专门处理这种回调的交易规则，就能够透过在这里入场而获利。有机会享受到突破，回调再突破的后续利润。而如果你隐约觉得这张图表太过教科书真实，生活中应该碰不到这么好的交易机会。其实并不尽然。这是2023年台湾指数期货的周线级别图表。即使你是如此大时间级别的交易者，也依然有机会透过正确的交易管理来介入这种优沃的交易机会。它同时也印证了我们刚刚说到的原则，上升趋势中的下降通道，回调都是牛旗。这里正是踩中了那80%的几率。开展趋势线突破。原趋势极值被测试，然后突破成功开启新突破循环的走势。","p":"p291"}]},{"t":"para","text":"直接来看一些例子，或许你会更明白。过程中，我们也要揣摩多空双方的意图。你可以看到，先是接连的阳线突破这个横向的区间，对吧？比起所突破的水平，整理动能明显干净许多，都是趋势阳线。不过也感受得到，随时间发展动能稍稍有减弱的迹象。何以见得呢？实体变短了。而且很仔细计较的话，上影线好像到了最后一根变得更长了一些，对吧？这些都是买压减弱的提示。虽然这不代表你可以做空哦，我知道有人可能按耐不住了。但随后出现一根更长的趋势，阳线后就进入了连续三根趋势阴线的回调。为什么我们只说这个是回调呢？因为光是这样，没有理由认为趋势要反转了。前面的多头动能干净利落，你也听我说过，急速回调并不罕见。我们仍然更有理由认为，多头趋势延续的可能性更大。所以我们要接着看看空头突破以后，它还有没有能力创造出更多的推动？可惜马上又是阳线。虽然在这里多头也没有立刻返回急速状态，但空头也没有特别争气。下一次对下跌趋势极值的测试只越过一点点就失去跟进。接下来，第三，第四推运动也没有创出有效新低的本事。通通都是马上被阳线扳回一城。这个过程已经揭示了所有回调的特质。空头耗时许久，但成绩不张，突破尝试都没有接续跟进。另一方面，反倒是多头在这趟下跌趋势中屡屡出现中断空头的运作。一测试到关键的价位，也就是先前这段多头急速的突破对象，就立刻收了粗涌的阳线。给到突破回调的建仓形态，由双K线反转所启动。如果你形成了专门处理这种回调的交易规则，就能够透过在这里入场而获利。有机会享受到突破，回调再突破的后续利润。而如果你隐约觉得这张图表太过教科书真实，生活中应该碰不到这么好的交易机会。其实并不尽然。这是2023年台湾指数期货的周线级别图表。即使你是如此大时间级别的交易者，也依然有机会透过正确的交易管理来介入这种优沃的交易机会。它同时也印证了我们刚刚说到的原则，上升趋势中的下降通道，回调都是牛旗。这里正是踩中了那80%的几率。开展趋势线突破。原趋势极值被测试，然后突破成功开启新突破循环的走势。","pid":"p291"},{"t":"img","src":"assets/img/l05B_063.webp","ilabel":"5-12","icap":"L05　回调与趋势中的持续形态（旗型）","fid":"fig63","ctx":[{"t":"直接来看一些例子，或许你会更明白。过程中，我们也要揣摩多空双方的意图。你可以看到，先是接连的阳线突破这个横向的区间，对吧？比起所突破的水平，整理动能明显干净许多，都是趋势阳线。不过也感受得到，随时间发展动能稍稍有减弱的迹象。何以见得呢？实体变短了。而且很仔细计较的话，上影线好像到了最后一根变得更长了一些，对吧？这些都是买压减弱的提示。虽然这不代表你可以做空哦，我知道有人可能按耐不住了。但随后出现一根更长的趋势，阳线后就进入了连续三根趋势阴线的回调。为什么我们只说这个是回调呢？因为光是这样，没有理由认为趋势要反转了。前面的多头动能干净利落，你也听我说过，急速回调并不罕见。我们仍然更有理由认为，多头趋势延续的可能性更大。所以我们要接着看看空头突破以后，它还有没有能力创造出更多的推动？可惜马上又是阳线。虽然在这里多头也没有立刻返回急速状态，但空头也没有特别争气。下一次对下跌趋势极值的测试只越过一点点就失去跟进。接下来，第三，第四推运动也没有创出有效新低的本事。通通都是马上被阳线扳回一城。这个过程已经揭示了所有回调的特质。空头耗时许久，但成绩不张，突破尝试都没有接续跟进。另一方面，反倒是多头在这趟下跌趋势中屡屡出现中断空头的运作。一测试到关键的价位，也就是先前这段多头急速的突破对象，就立刻收了粗涌的阳线。给到突破回调的建仓形态，由双K线反转所启动。如果你形成了专门处理这种回调的交易规则，就能够透过在这里入场而获利。有机会享受到突破，回调再突破的后续利润。而如果你隐约觉得这张图表太过教科书真实，生活中应该碰不到这么好的交易机会。其实并不尽然。这是2023年台湾指数期货的周线级别图表。即使你是如此大时间级别的交易者，也依然有机会透过正确的交易管理来介入这种优沃的交易机会。它同时也印证了我们刚刚说到的原则，上升趋势中的下降通道，回调都是牛旗。这里正是踩中了那80%的几率。开展趋势线突破。原趋势极值被测试，然后突破成功开启新突破循环的走势。","p":"p291"},{"t":"下一个例子稍微复杂一点，但其实跟我们前面说的并无二致。这次是一个空头的突破，以单根K线完成初次的突破测试以后，转入一个向下的通道。下降通道作为牛旗促使价格向上突破趋势线以后，然后再进入一个不到20根K线的上升通道回调。二次测试突破点。下降趋势中的上升通道应该起到熊旗的看跌效用，对吧？隔天立即跳空低开，时间的缺口完全等效于急速下跌。借此你可以说趋势转进升幅回调，以前可能或多或少会产生一些迹象，告诉你顺势交易者正在退散。在这里看到的就是空头的动能减弱，从急速转入通道。而通道结束以后，换多头暂时占据上风，创造一个小型的上升趋势。但这个上升趋势很弱，每次创新高就有空头出来跟你say hi，多头得不到有效的跟进。终于有一点点强势的迹象，但也同样没有下文，对前面的下降通道起点，或者你说前方突破点测试一下以后。这就掉头下跌。突破回调再突破是趋势中的日常活动。不过，趋势的第二推不必然能够走得大手大脚。我们多次说过了，测试原趋势极值的时候，要是顺势方不够踊跃，那价格就可能陷入区间。","p":"p292"}]},{"t":"para","text":"下一个例子稍微复杂一点，但其实跟我们前面说的并无二致。这次是一个空头的突破，以单根K线完成初次的突破测试以后，转入一个向下的通道。下降通道作为牛旗促使价格向上突破趋势线以后，然后再进入一个不到20根K线的上升通道回调。二次测试突破点。下降趋势中的上升通道应该起到熊旗的看跌效用，对吧？隔天立即跳空低开，时间的缺口完全等效于急速下跌。借此你可以说趋势转进升幅回调，以前可能或多或少会产生一些迹象，告诉你顺势交易者正在退散。在这里看到的就是空头的动能减弱，从急速转入通道。而通道结束以后，换多头暂时占据上风，创造一个小型的上升趋势。但这个上升趋势很弱，每次创新高就有空头出来跟你say hi，多头得不到有效的跟进。终于有一点点强势的迹象，但也同样没有下文，对前面的下降通道起点，或者你说前方突破点测试一下以后。这就掉头下跌。突破回调再突破是趋势中的日常活动。不过，趋势的第二推不必然能够走得大手大脚。我们多次说过了，测试原趋势极值的时候，要是顺势方不够踊跃，那价格就可能陷入区间。","pid":"p292"},{"t":"img","src":"assets/img/l05B_064.webp","ilabel":"5-13","icap":"L05　回调与趋势中的持续形态（旗型）","fid":"fig64","ctx":[{"t":"下一个例子稍微复杂一点，但其实跟我们前面说的并无二致。这次是一个空头的突破，以单根K线完成初次的突破测试以后，转入一个向下的通道。下降通道作为牛旗促使价格向上突破趋势线以后，然后再进入一个不到20根K线的上升通道回调。二次测试突破点。下降趋势中的上升通道应该起到熊旗的看跌效用，对吧？隔天立即跳空低开，时间的缺口完全等效于急速下跌。借此你可以说趋势转进升幅回调，以前可能或多或少会产生一些迹象，告诉你顺势交易者正在退散。在这里看到的就是空头的动能减弱，从急速转入通道。而通道结束以后，换多头暂时占据上风，创造一个小型的上升趋势。但这个上升趋势很弱，每次创新高就有空头出来跟你say hi，多头得不到有效的跟进。终于有一点点强势的迹象，但也同样没有下文，对前面的下降通道起点，或者你说前方突破点测试一下以后。这就掉头下跌。突破回调再突破是趋势中的日常活动。不过，趋势的第二推不必然能够走得大手大脚。我们多次说过了，测试原趋势极值的时候，要是顺势方不够踊跃，那价格就可能陷入区间。","p":"p292"},{"t":"下个例子就是这样。同样是很踊跃的急速上涨，但显著的上影线结实的动能减弱以后，价格陷入了下降通道。也就是牛旗的回调。空头同样表现出意兴阑珊的样子。向下的突破尝试严重挫败，好几次都没有成绩。而当价格测试到均线形成，这个微型的双重底以后，多头开始有介入的迹象，终于开启对原趋势极值的测试。不过这里甚至没有能够碰到，只有测试不及价格就立刻下坠，进一步又测试方才回调的低点。但是多头虽然在高处没有进取的意思，但这里倒是乐意进场。于是就拖着价格继续向右移动，最终每逢高处附近就下跌，每逢低处就上涨。这是什么意思呢？这是市场找到了均衡。刚刚这段上涨是暂时的失衡。但他们来到这里，上下震荡以后，找到了多空双方都有共识的位置，形成区间。此间的牛旗回调依然有领涨的作用，只是没能开启新的突破循环。预见到区间可能性提早止盈的多头交易者可以获利，但可望突破的交易者则要失望，最终利润回吐。综合以上，你便大概晓得，当在趋势中遇到逆向的回调运动时，可以如何预期后续的发展了。","p":"p293"}]},{"t":"para","text":"下个例子就是这样。同样是很踊跃的急速上涨，但显著的上影线结实的动能减弱以后，价格陷入了下降通道。也就是牛旗的回调。空头同样表现出意兴阑珊的样子。向下的突破尝试严重挫败，好几次都没有成绩。而当价格测试到均线形成，这个微型的双重底以后，多头开始有介入的迹象，终于开启对原趋势极值的测试。不过这里甚至没有能够碰到，只有测试不及价格就立刻下坠，进一步又测试方才回调的低点。但是多头虽然在高处没有进取的意思，但这里倒是乐意进场。于是就拖着价格继续向右移动，最终每逢高处附近就下跌，每逢低处就上涨。这是什么意思呢？这是市场找到了均衡。刚刚这段上涨是暂时的失衡。但他们来到这里，上下震荡以后，找到了多空双方都有共识的位置，形成区间。此间的牛旗回调依然有领涨的作用，只是没能开启新的突破循环。预见到区间可能性提早止盈的多头交易者可以获利，但可望突破的交易者则要失望，最终利润回吐。综合以上，你便大概晓得，当在趋势中遇到逆向的回调运动时，可以如何预期后续的发展了。","pid":"p293"},{"t":"img","src":"assets/img/l05B_065.webp","ilabel":"5-14","icap":"L05　回调与趋势中的持续形态（旗型）","fid":"fig65","ctx":[{"t":"下个例子就是这样。同样是很踊跃的急速上涨，但显著的上影线结实的动能减弱以后，价格陷入了下降通道。也就是牛旗的回调。空头同样表现出意兴阑珊的样子。向下的突破尝试严重挫败，好几次都没有成绩。而当价格测试到均线形成，这个微型的双重底以后，多头开始有介入的迹象，终于开启对原趋势极值的测试。不过这里甚至没有能够碰到，只有测试不及价格就立刻下坠，进一步又测试方才回调的低点。但是多头虽然在高处没有进取的意思，但这里倒是乐意进场。于是就拖着价格继续向右移动，最终每逢高处附近就下跌，每逢低处就上涨。这是什么意思呢？这是市场找到了均衡。刚刚这段上涨是暂时的失衡。但他们来到这里，上下震荡以后，找到了多空双方都有共识的位置，形成区间。此间的牛旗回调依然有领涨的作用，只是没能开启新的突破循环。预见到区间可能性提早止盈的多头交易者可以获利，但可望突破的交易者则要失望，最终利润回吐。综合以上，你便大概晓得，当在趋势中遇到逆向的回调运动时，可以如何预期后续的发展了。","p":"p293"},{"t":"我可以不厌其烦的再次画出两张参考模型，让大家在将来的交易现场有个总体的印象，可以参考。我们说上升通道及熊旗下降通道及牛旗，这里展现的是后者的图例。内部一推又一推的失败突破，揭示的均衡应该不在那个方向，价格接下来该往反方向探索。因此，80%的情况下，后续行情将以此顺序开展。趋势先被突破，然后原趋势极值遭到测试。测试可以分成两种结果，突破成功与突破失败。如果突破成功，那就是突破原趋势极值，以后还有跟进产生新的突破回调，再突破循环。失败的情况则是没有跟进，马上陷入停顿或折返。这时候，由于顺势方的退缩，逆势方会变得进取，直到方才回调的极值被测试。如果没有进一步演变为反转，就会转入区间代表市场找到了均衡。","p":"p294"}]},{"t":"para","text":"我可以不厌其烦的再次画出两张参考模型，让大家在将来的交易现场有个总体的印象，可以参考。我们说上升通道及熊旗下降通道及牛旗，这里展现的是后者的图例。内部一推又一推的失败突破，揭示的均衡应该不在那个方向，价格接下来该往反方向探索。因此，80%的情况下，后续行情将以此顺序开展。趋势先被突破，然后原趋势极值遭到测试。测试可以分成两种结果，突破成功与突破失败。如果突破成功，那就是突破原趋势极值，以后还有跟进产生新的突破回调，再突破循环。失败的情况则是没有跟进，马上陷入停顿或折返。这时候，由于顺势方的退缩，逆势方会变得进取，直到方才回调的极值被测试。如果没有进一步演变为反转，就会转入区间代表市场找到了均衡。","pid":"p294"},{"t":"img","src":"assets/img/l05B_066.webp","ilabel":"5-15","icap":"L05　回调与趋势中的持续形态（旗型）","fid":"fig66","ctx":[{"t":"我可以不厌其烦的再次画出两张参考模型，让大家在将来的交易现场有个总体的印象，可以参考。我们说上升通道及熊旗下降通道及牛旗，这里展现的是后者的图例。内部一推又一推的失败突破，揭示的均衡应该不在那个方向，价格接下来该往反方向探索。因此，80%的情况下，后续行情将以此顺序开展。趋势先被突破，然后原趋势极值遭到测试。测试可以分成两种结果，突破成功与突破失败。如果突破成功，那就是突破原趋势极值，以后还有跟进产生新的突破回调，再突破循环。失败的情况则是没有跟进，马上陷入停顿或折返。这时候，由于顺势方的退缩，逆势方会变得进取，直到方才回调的极值被测试。如果没有进一步演变为反转，就会转入区间代表市场找到了均衡。","p":"p294"},{"t":"刚刚谈的都是回调结束后价格有往原趋势方向突破的例子。无论是长是短，总之至少有第二推，差别只在能不能创造新的突破循环而已。那么，我们可能会进一步好奇，有没有不突破的回调呢？有没有可能价格直接逆向进动变成反转？当然咯，这是可能的，毕竟刚刚也说下降通道，作为牛旗，上升通道作为熊旗是80%的高期率事件，但它的反面就是还留有20%的几率可能发生意外。我们来谈谈怎么进一步理解这件事。正常情况下，尤其在趋势初中期的回调，通常都仅是小型趋势反转。在回调的这个局部里，趋势确实逆转了，这确确实实是个下降的趋势。但它只限定在这个框线柱的范畴中。这种小型的局部的趋势反转确实足以容纳精明的逆势剥头皮交易者，令他们赚到快进快出的利润。而且也可能诱使不懂如何正确管理持仓的新手交易者入场。不过，它逆向运动的动能斜率幅度连续性都没有强到足以完全改变原本那个可观的顺势运动。也就是说，我们这种手工交易者很难在回调中找到非常具有数学优势的逆势建仓形态。你最好避而不作。但是还记得那个永不死心的逆势方吗？这些机构总是希望造成突破失败，最好反转。尽管在过程中看似没有很占上风，但如果他们坚持够用力而顺势方，也刚好愿意松手。那在少数情况下，真的大力出奇迹，直接逆转的可能性也还是有。我们说，所谓多空的竞争，","p":"p295"},{"t":"就是说服对方我有能力控制行情的过程。有时候在上升趋势中，空头仍然有能力将暂时的回调推波助澜成大型趋势反转。不过，既然要说服对手，那他们就要展示出难缠或凶恶的证据。专业一点说就是充分的卖压。卖压可以以两种形式展现出来，够久即在长时间内形成比阳线更多的阴线，或者够远使价格大幅向下运动。这两种情况都会让观察者逐渐认为回调已经过度了，然后断定失效了。接下来，我们就分别谈谈过渡而导致趋势失效的回调。进行一些分类并提示你原理和应对的方法。","p":"p296"}]},{"t":"para","text":"刚刚谈的都是回调结束后价格有往原趋势方向突破的例子。无论是长是短，总之至少有第二推，差别只在能不能创造新的突破循环而已。那么，我们可能会进一步好奇，有没有不突破的回调呢？有没有可能价格直接逆向进动变成反转？当然咯，这是可能的，毕竟刚刚也说下降通道，作为牛旗，上升通道作为熊旗是80%的高期率事件，但它的反面就是还留有20%的几率可能发生意外。我们来谈谈怎么进一步理解这件事。正常情况下，尤其在趋势初中期的回调，通常都仅是小型趋势反转。在回调的这个局部里，趋势确实逆转了，这确确实实是个下降的趋势。但它只限定在这个框线柱的范畴中。这种小型的局部的趋势反转确实足以容纳精明的逆势剥头皮交易者，令他们赚到快进快出的利润。而且也可能诱使不懂如何正确管理持仓的新手交易者入场。不过，它逆向运动的动能斜率幅度连续性都没有强到足以完全改变原本那个可观的顺势运动。也就是说，我们这种手工交易者很难在回调中找到非常具有数学优势的逆势建仓形态。你最好避而不作。但是还记得那个永不死心的逆势方吗？这些机构总是希望造成突破失败，最好反转。尽管在过程中看似没有很占上风，但如果他们坚持够用力而顺势方，也刚好愿意松手。那在少数情况下，真的大力出奇迹，直接逆转的可能性也还是有。我们说，所谓多空的竞争，","pid":"p295"},{"t":"para","text":"就是说服对方我有能力控制行情的过程。有时候在上升趋势中，空头仍然有能力将暂时的回调推波助澜成大型趋势反转。不过，既然要说服对手，那他们就要展示出难缠或凶恶的证据。专业一点说就是充分的卖压。卖压可以以两种形式展现出来，够久即在长时间内形成比阳线更多的阴线，或者够远使价格大幅向下运动。这两种情况都会让观察者逐渐认为回调已经过度了，然后断定失效了。接下来，我们就分别谈谈过渡而导致趋势失效的回调。进行一些分类并提示你原理和应对的方法。","pid":"p296"},{"t":"img","src":"assets/img/l05B_067.webp","ilabel":"5-16","icap":"L05　回调与趋势中的持续形态（旗型）","fid":"fig67","ctx":[{"t":"刚刚谈的都是回调结束后价格有往原趋势方向突破的例子。无论是长是短，总之至少有第二推，差别只在能不能创造新的突破循环而已。那么，我们可能会进一步好奇，有没有不突破的回调呢？有没有可能价格直接逆向进动变成反转？当然咯，这是可能的，毕竟刚刚也说下降通道，作为牛旗，上升通道作为熊旗是80%的高期率事件，但它的反面就是还留有20%的几率可能发生意外。我们来谈谈怎么进一步理解这件事。正常情况下，尤其在趋势初中期的回调，通常都仅是小型趋势反转。在回调的这个局部里，趋势确实逆转了，这确确实实是个下降的趋势。但它只限定在这个框线柱的范畴中。这种小型的局部的趋势反转确实足以容纳精明的逆势剥头皮交易者，令他们赚到快进快出的利润。而且也可能诱使不懂如何正确管理持仓的新手交易者入场。不过，它逆向运动的动能斜率幅度连续性都没有强到足以完全改变原本那个可观的顺势运动。也就是说，我们这种手工交易者很难在回调中找到非常具有数学优势的逆势建仓形态。你最好避而不作。但是还记得那个永不死心的逆势方吗？这些机构总是希望造成突破失败，最好反转。尽管在过程中看似没有很占上风，但如果他们坚持够用力而顺势方，也刚好愿意松手。那在少数情况下，真的大力出奇迹，直接逆转的可能性也还是有。我们说，所谓多空的竞争，","p":"p295"},{"t":"就是说服对方我有能力控制行情的过程。有时候在上升趋势中，空头仍然有能力将暂时的回调推波助澜成大型趋势反转。不过，既然要说服对手，那他们就要展示出难缠或凶恶的证据。专业一点说就是充分的卖压。卖压可以以两种形式展现出来，够久即在长时间内形成比阳线更多的阴线，或者够远使价格大幅向下运动。这两种情况都会让观察者逐渐认为回调已经过度了，然后断定失效了。接下来，我们就分别谈谈过渡而导致趋势失效的回调。进行一些分类并提示你原理和应对的方法。","p":"p296"},{"t":"第一种形式是回调过久。想想我们前面提到的动能交易者和价值交易者。虽然他们的理念不同，介入的时机也不同，但有一点是相通的，就是他们都愿意朝向趋势方向进行交易。只要这段逆势运动看起来比趋势相对更弱，从而使多数交易者相信趋势将会恢复。那放任他们短暂逆向运动也无所谓，反正这只是暂时的，而后仍然倾向顺势突破。这种情况下，我们在指称上会更倾向将这种双边交易地带叫做回调，认为是作为中继的旗型。但过久的话，我们的信心就会越来越流失。什么情况下会越过那个我们能够放心认为趋势将恢复的安全线呢？比如耗时太久，对日内交易者来说，超过20根K线，或者另一种太久的形式，可能是内部有三上二下或三下二上的轨迹。给的顺势方两三次机会却未能成功突破。在这种时候，交易者就会有点难确定趋势到底还走不走得动，有点暧昧，有点昏暗。那保守己见，一定有一部分的顺势交易者决定提前止盈，停止加仓，继而导致逆势交易者则趁虚而入。于是此时对他的称呼与其仍然信心十足的采用回调，这个叫法你可能更愿意将他区间。并认为，向上或向下成功突破的几率逐渐趋近于个半。","p":"p297"}]},{"t":"para","text":"第一种形式是回调过久。想想我们前面提到的动能交易者和价值交易者。虽然他们的理念不同，介入的时机也不同，但有一点是相通的，就是他们都愿意朝向趋势方向进行交易。只要这段逆势运动看起来比趋势相对更弱，从而使多数交易者相信趋势将会恢复。那放任他们短暂逆向运动也无所谓，反正这只是暂时的，而后仍然倾向顺势突破。这种情况下，我们在指称上会更倾向将这种双边交易地带叫做回调，认为是作为中继的旗型。但过久的话，我们的信心就会越来越流失。什么情况下会越过那个我们能够放心认为趋势将恢复的安全线呢？比如耗时太久，对日内交易者来说，超过20根K线，或者另一种太久的形式，可能是内部有三上二下或三下二上的轨迹。给的顺势方两三次机会却未能成功突破。在这种时候，交易者就会有点难确定趋势到底还走不走得动，有点暧昧，有点昏暗。那保守己见，一定有一部分的顺势交易者决定提前止盈，停止加仓，继而导致逆势交易者则趁虚而入。于是此时对他的称呼与其仍然信心十足的采用回调，这个叫法你可能更愿意将他区间。并认为，向上或向下成功突破的几率逐渐趋近于个半。","pid":"p297"},{"t":"img","src":"assets/img/l05B_068.webp","ilabel":"5-17","icap":"L05　回调与趋势中的持续形态（旗型）","fid":"fig68","ctx":[{"t":"第一种形式是回调过久。想想我们前面提到的动能交易者和价值交易者。虽然他们的理念不同，介入的时机也不同，但有一点是相通的，就是他们都愿意朝向趋势方向进行交易。只要这段逆势运动看起来比趋势相对更弱，从而使多数交易者相信趋势将会恢复。那放任他们短暂逆向运动也无所谓，反正这只是暂时的，而后仍然倾向顺势突破。这种情况下，我们在指称上会更倾向将这种双边交易地带叫做回调，认为是作为中继的旗型。但过久的话，我们的信心就会越来越流失。什么情况下会越过那个我们能够放心认为趋势将恢复的安全线呢？比如耗时太久，对日内交易者来说，超过20根K线，或者另一种太久的形式，可能是内部有三上二下或三下二上的轨迹。给的顺势方两三次机会却未能成功突破。在这种时候，交易者就会有点难确定趋势到底还走不走得动，有点暧昧，有点昏暗。那保守己见，一定有一部分的顺势交易者决定提前止盈，停止加仓，继而导致逆势交易者则趁虚而入。于是此时对他的称呼与其仍然信心十足的采用回调，这个叫法你可能更愿意将他区间。并认为，向上或向下成功突破的几率逐渐趋近于个半。","p":"p297"},{"t":"你怎么指称他就暗示了你是乐观或是悲观。回调代表，你认为失衡在短暂的休止后还能够持续。区间则认明，这里是明确的双边交易地带，可能这里就是方才这段趋势性运动所要靠向的均衡目标。","p":"p298"}]},{"t":"para","text":"你怎么指称他就暗示了你是乐观或是悲观。回调代表，你认为失衡在短暂的休止后还能够持续。区间则认明，这里是明确的双边交易地带，可能这里就是方才这段趋势性运动所要靠向的均衡目标。","pid":"p298"},{"t":"img","src":"assets/img/l05B_069.webp","ilabel":"5-18","icap":"L05　回调与趋势中的持续形态（旗型）","fid":"fig69","ctx":[{"t":"你怎么指称他就暗示了你是乐观或是悲观。回调代表，你认为失衡在短暂的休止后还能够持续。区间则认明，这里是明确的双边交易地带，可能这里就是方才这段趋势性运动所要靠向的均衡目标。","p":"p298"},{"t":"那同样看一些例子比较清楚。这是一个平凡的台指期交易日，一路上涨的行情。不过还没涨完，第二个小时价格开始陷入回调，你也清楚可见，这应该是一个牛旗。而且内部有三根被阳线隔开的阴线。如果你经验丰富，会知道这是三段推动的楔形底回调，最终起到看涨的牛旗作用。确实，价格也越过了趋势线。按照我们说过的步骤，要去测试原趋势极值。测了，但不及又开始下落，令人尤其郁闷的是，所有的K线都又碎又小。多空都一样，完全没有开盘第一个小时的气势如虹。那这意思其实也很清楚，就是多头动能消散的意思。这持续了几乎整天，直到最最最后才有一点阳起，但也只是一点。很明显，如果你在急速阶段就已经持仓，或者你是在前面这个小牛旗回调中买进，看到后面如此软烂。你应该会非常焦虑。这焦虑就是从逆境对趋势的延续失去信心来的。随着调整发展到超过20根K线，我们就更认为这是区间是均衡状态。后面要涨要跌都已经难说了。对持仓中的你来说，赶紧找机会离场，会是更好的选择。后续怎么样呢？","p":"p299"}]},{"t":"para","text":"那同样看一些例子比较清楚。这是一个平凡的台指期交易日，一路上涨的行情。不过还没涨完，第二个小时价格开始陷入回调，你也清楚可见，这应该是一个牛旗。而且内部有三根被阳线隔开的阴线。如果你经验丰富，会知道这是三段推动的楔形底回调，最终起到看涨的牛旗作用。确实，价格也越过了趋势线。按照我们说过的步骤，要去测试原趋势极值。测了，但不及又开始下落，令人尤其郁闷的是，所有的K线都又碎又小。多空都一样，完全没有开盘第一个小时的气势如虹。那这意思其实也很清楚，就是多头动能消散的意思。这持续了几乎整天，直到最最最后才有一点阳起，但也只是一点。很明显，如果你在急速阶段就已经持仓，或者你是在前面这个小牛旗回调中买进，看到后面如此软烂。你应该会非常焦虑。这焦虑就是从逆境对趋势的延续失去信心来的。随着调整发展到超过20根K线，我们就更认为这是区间是均衡状态。后面要涨要跌都已经难说了。对持仓中的你来说，赶紧找机会离场，会是更好的选择。后续怎么样呢？","pid":"p299"},{"t":"img","src":"assets/img/l05B_070.webp","ilabel":"5-19","icap":"L05　回调与趋势中的持续形态（旗型）","fid":"fig70","ctx":[{"t":"那同样看一些例子比较清楚。这是一个平凡的台指期交易日，一路上涨的行情。不过还没涨完，第二个小时价格开始陷入回调，你也清楚可见，这应该是一个牛旗。而且内部有三根被阳线隔开的阴线。如果你经验丰富，会知道这是三段推动的楔形底回调，最终起到看涨的牛旗作用。确实，价格也越过了趋势线。按照我们说过的步骤，要去测试原趋势极值。测了，但不及又开始下落，令人尤其郁闷的是，所有的K线都又碎又小。多空都一样，完全没有开盘第一个小时的气势如虹。那这意思其实也很清楚，就是多头动能消散的意思。这持续了几乎整天，直到最最最后才有一点阳起，但也只是一点。很明显，如果你在急速阶段就已经持仓，或者你是在前面这个小牛旗回调中买进，看到后面如此软烂。你应该会非常焦虑。这焦虑就是从逆境对趋势的延续失去信心来的。随着调整发展到超过20根K线，我们就更认为这是区间是均衡状态。后面要涨要跌都已经难说了。对持仓中的你来说，赶紧找机会离场，会是更好的选择。后续怎么样呢？","p":"p299"},{"t":"我把隔天的行情也放上来了。你可以看到，因为前头实在犹豫过久，尽管第二天再次测试区间底部带来汹涌的趋势阳线。也只是测试员趋势极值就衰败，这正是市场处在均衡中的最佳证明。两天加起来总共99根K线的区间盘整，完全让第一天的急速上涨变得意义淡薄。经过多空长时间的新共识，决议最后价格决定向下突破而非上涨。因为回调过久第一天的趋势已无延续可言。","p":"p300"}]},{"t":"para","text":"我把隔天的行情也放上来了。你可以看到，因为前头实在犹豫过久，尽管第二天再次测试区间底部带来汹涌的趋势阳线。也只是测试员趋势极值就衰败，这正是市场处在均衡中的最佳证明。两天加起来总共99根K线的区间盘整，完全让第一天的急速上涨变得意义淡薄。经过多空长时间的新共识，决议最后价格决定向下突破而非上涨。因为回调过久第一天的趋势已无延续可言。","pid":"p300"},{"t":"img","src":"assets/img/l05B_071.webp","ilabel":"5-20","icap":"L05　回调与趋势中的持续形态（旗型）","fid":"fig71","ctx":[{"t":"我把隔天的行情也放上来了。你可以看到，因为前头实在犹豫过久，尽管第二天再次测试区间底部带来汹涌的趋势阳线。也只是测试员趋势极值就衰败，这正是市场处在均衡中的最佳证明。两天加起来总共99根K线的区间盘整，完全让第一天的急速上涨变得意义淡薄。经过多空长时间的新共识，决议最后价格决定向下突破而非上涨。因为回调过久第一天的趋势已无延续可言。","p":"p300"},{"t":"另一个例子是悠长的下跌。我把两个比较明显的调整框起来，我们可以进行一些比较。具体为，推动技术的方式，后面会有专门的单元介绍，先不急着学。但总之，这里也是三段推动的熊旗回调哦，随后确实引入顺畅的下跌。可惜没有跌很远，价格又陷入回调。这个收敛的三推回调，在又一次测试到均线之后开始下跌，但不同于前一次的是这里的K线更多更弱。习惯用20根K线来判定回调是否持续。过久以后，你就很快能意识到这里又成了区间，下跌未能创出突破。如果你正持有空仓，并且有从上个台指期的例子里学到教训，可能会晓得要先走为妙。尽管过了这么久，最后价格确实是以下跌作收，但若是刚刚没有离开而止损又放的太浅的话。就会有被触发亏损的可能性。面对这种持续太久的调整，尽管原先的交易方向是顺势的。最好的做法依然是观望，等待，谨慎行动。这是因为多空已经陷入纠结。尽管在区间高处做空合理，但一旦诱到底部，就可能和有意愿在底部入场的多头正面冲突。你也会被打算在这里止盈买进的空头弟兄扯后腿。如此一来，我们呈着趋势的“势”期待突破带来利润的优势已经被消磨到几乎没有了。","p":"p301"}]},{"t":"para","text":"另一个例子是悠长的下跌。我把两个比较明显的调整框起来，我们可以进行一些比较。具体为，推动技术的方式，后面会有专门的单元介绍，先不急着学。但总之，这里也是三段推动的熊旗回调哦，随后确实引入顺畅的下跌。可惜没有跌很远，价格又陷入回调。这个收敛的三推回调，在又一次测试到均线之后开始下跌，但不同于前一次的是这里的K线更多更弱。习惯用20根K线来判定回调是否持续。过久以后，你就很快能意识到这里又成了区间，下跌未能创出突破。如果你正持有空仓，并且有从上个台指期的例子里学到教训，可能会晓得要先走为妙。尽管过了这么久，最后价格确实是以下跌作收，但若是刚刚没有离开而止损又放的太浅的话。就会有被触发亏损的可能性。面对这种持续太久的调整，尽管原先的交易方向是顺势的。最好的做法依然是观望，等待，谨慎行动。这是因为多空已经陷入纠结。尽管在区间高处做空合理，但一旦诱到底部，就可能和有意愿在底部入场的多头正面冲突。你也会被打算在这里止盈买进的空头弟兄扯后腿。如此一来，我们呈着趋势的“势”期待突破带来利润的优势已经被消磨到几乎没有了。","pid":"p301"},{"t":"img","src":"assets/img/l05B_072.webp","ilabel":"5-21","icap":"L05　回调与趋势中的持续形态（旗型）","fid":"fig72","ctx":[{"t":"另一个例子是悠长的下跌。我把两个比较明显的调整框起来，我们可以进行一些比较。具体为，推动技术的方式，后面会有专门的单元介绍，先不急着学。但总之，这里也是三段推动的熊旗回调哦，随后确实引入顺畅的下跌。可惜没有跌很远，价格又陷入回调。这个收敛的三推回调，在又一次测试到均线之后开始下跌，但不同于前一次的是这里的K线更多更弱。习惯用20根K线来判定回调是否持续。过久以后，你就很快能意识到这里又成了区间，下跌未能创出突破。如果你正持有空仓，并且有从上个台指期的例子里学到教训，可能会晓得要先走为妙。尽管过了这么久，最后价格确实是以下跌作收，但若是刚刚没有离开而止损又放的太浅的话。就会有被触发亏损的可能性。面对这种持续太久的调整，尽管原先的交易方向是顺势的。最好的做法依然是观望，等待，谨慎行动。这是因为多空已经陷入纠结。尽管在区间高处做空合理，但一旦诱到底部，就可能和有意愿在底部入场的多头正面冲突。你也会被打算在这里止盈买进的空头弟兄扯后腿。如此一来，我们呈着趋势的“势”期待突破带来利润的优势已经被消磨到几乎没有了。","p":"p301"},{"t":"接着我们谈过度回调的第二种形式“过远”。这就相对直观一点，即使对日内交易来说，回调的K线数量不超过20根，你可能出现逆势力量过于强劲，运行过远的情况。我想不需要，我再提醒了上升通道即熊旗下降通道即牛旗，有80%的时候，他们能够如此正常运作。但有那20%的低几率，他们反而是加速朝向通道线的方向发生突破。而也因为任何的突破都是意外，意外将导致有人被套，有人踏空，因此通常至少也能开展出两段推动。在这样的情况下，价格终究会被推离的更远，甚至有可能要吞没掉前面趋势方所有的努力。","p":"p302"}]},{"t":"para","text":"接着我们谈过度回调的第二种形式“过远”。这就相对直观一点，即使对日内交易来说，回调的K线数量不超过20根，你可能出现逆势力量过于强劲，运行过远的情况。我想不需要，我再提醒了上升通道即熊旗下降通道即牛旗，有80%的时候，他们能够如此正常运作。但有那20%的低几率，他们反而是加速朝向通道线的方向发生突破。而也因为任何的突破都是意外，意外将导致有人被套，有人踏空，因此通常至少也能开展出两段推动。在这样的情况下，价格终究会被推离的更远，甚至有可能要吞没掉前面趋势方所有的努力。","pid":"p302"},{"t":"img","src":"assets/img/l05B_073.webp","ilabel":"5-22","icap":"L05　回调与趋势中的持续形态（旗型）","fid":"fig73","ctx":[{"t":"接着我们谈过度回调的第二种形式“过远”。这就相对直观一点，即使对日内交易来说，回调的K线数量不超过20根，你可能出现逆势力量过于强劲，运行过远的情况。我想不需要，我再提醒了上升通道即熊旗下降通道即牛旗，有80%的时候，他们能够如此正常运作。但有那20%的低几率，他们反而是加速朝向通道线的方向发生突破。而也因为任何的突破都是意外，意外将导致有人被套，有人踏空，因此通常至少也能开展出两段推动。在这样的情况下，价格终究会被推离的更远，甚至有可能要吞没掉前面趋势方所有的努力。","p":"p302"},{"t":"一样看个例子会清楚很多。在图表左半边是一轮上升趋势。虽然前面的K线没有显示的更多，但光看均线的排列，应该能够略知一二。价格上涨到这轮趋势的最高峰以后，开始一个稍微深一点的回调。在这个局部的下降趋势里，你也可以看到逆势力量，也就是空头力量减弱的迹象。一开始是连续的阴线，但后面反复性更强，下破屡屡失败，发展成下降通道的牛旗形状。因此，当这根阳线向上突破趋势线，突破均线，眼看就要突破牛旗内部的最高点。应该有望延续趋势。但是多头居然退缩了，后面这根外包趋势阴线，尤其这个影线，揭示了多头曾经向上突破。但突破失败，反转直下的历史。下一根K线同样，多头曾经试图向上收复这根阴线，但连实体都超越不了，就又收成长上影线。所有影线都是突破的尝试，但最后失败了。旋即，多头意识到弟兄们不行了，选择放弃，创造出超级强的趋势阴线。这都贯穿了牛旗的通道线，还一并突破了前方上升趋势中一个不应该被攻破的低点。毕竟要是低点开始降低，趋势可能就结束了。于是这根超强阴线作为意外，作为突破，很快在价格测试突破点后。继续引出了第二段下跌。至此，我们可以确认，刚刚这个牛旗有过延续趋势的意图，但失败了，空头太强，导致牛旗失效。遂此趋势也被反转，即使空头后来可能无法长久掌控行情，但也至少让价格调转向下进入激烈的区间。","p":"p303"}]},{"t":"para","text":"一样看个例子会清楚很多。在图表左半边是一轮上升趋势。虽然前面的K线没有显示的更多，但光看均线的排列，应该能够略知一二。价格上涨到这轮趋势的最高峰以后，开始一个稍微深一点的回调。在这个局部的下降趋势里，你也可以看到逆势力量，也就是空头力量减弱的迹象。一开始是连续的阴线，但后面反复性更强，下破屡屡失败，发展成下降通道的牛旗形状。因此，当这根阳线向上突破趋势线，突破均线，眼看就要突破牛旗内部的最高点。应该有望延续趋势。但是多头居然退缩了，后面这根外包趋势阴线，尤其这个影线，揭示了多头曾经向上突破。但突破失败，反转直下的历史。下一根K线同样，多头曾经试图向上收复这根阴线，但连实体都超越不了，就又收成长上影线。所有影线都是突破的尝试，但最后失败了。旋即，多头意识到弟兄们不行了，选择放弃，创造出超级强的趋势阴线。这都贯穿了牛旗的通道线，还一并突破了前方上升趋势中一个不应该被攻破的低点。毕竟要是低点开始降低，趋势可能就结束了。于是这根超强阴线作为意外，作为突破，很快在价格测试突破点后。继续引出了第二段下跌。至此，我们可以确认，刚刚这个牛旗有过延续趋势的意图，但失败了，空头太强，导致牛旗失效。遂此趋势也被反转，即使空头后来可能无法长久掌控行情，但也至少让价格调转向下进入激烈的区间。","pid":"p303"},{"t":"img","src":"assets/img/l05B_074.webp","ilabel":"5-23","icap":"L05　回调与趋势中的持续形态（旗型）","fid":"fig74","ctx":[{"t":"一样看个例子会清楚很多。在图表左半边是一轮上升趋势。虽然前面的K线没有显示的更多，但光看均线的排列，应该能够略知一二。价格上涨到这轮趋势的最高峰以后，开始一个稍微深一点的回调。在这个局部的下降趋势里，你也可以看到逆势力量，也就是空头力量减弱的迹象。一开始是连续的阴线，但后面反复性更强，下破屡屡失败，发展成下降通道的牛旗形状。因此，当这根阳线向上突破趋势线，突破均线，眼看就要突破牛旗内部的最高点。应该有望延续趋势。但是多头居然退缩了，后面这根外包趋势阴线，尤其这个影线，揭示了多头曾经向上突破。但突破失败，反转直下的历史。下一根K线同样，多头曾经试图向上收复这根阴线，但连实体都超越不了，就又收成长上影线。所有影线都是突破的尝试，但最后失败了。旋即，多头意识到弟兄们不行了，选择放弃，创造出超级强的趋势阴线。这都贯穿了牛旗的通道线，还一并突破了前方上升趋势中一个不应该被攻破的低点。毕竟要是低点开始降低，趋势可能就结束了。于是这根超强阴线作为意外，作为突破，很快在价格测试突破点后。继续引出了第二段下跌。至此，我们可以确认，刚刚这个牛旗有过延续趋势的意图，但失败了，空头太强，导致牛旗失效。遂此趋势也被反转，即使空头后来可能无法长久掌控行情，但也至少让价格调转向下进入激烈的区间。","p":"p303"},{"t":"下面这个例子也很有趣，同时显示了一次成功引出顺势运动的回调以及一个失败的版本。左边是一个收敛的调整。作为下降趋势中的中继很顺利，朝趋势方向突破，而且也确实包含两段推动。但接下来的回调就令人意外了。明明很明确的形成了作为熊旗的上升通道外观。同时，测试的突破点和均线但没有成功引发空头突破，反而是价格朝上突破。也很不好意思，画面塞不下，但后续的走势是进一步的二推上涨。借有朝向意外方向突破多头，成功套住了空头引发趋势的完全扭转。","p":"p304"}]},{"t":"para","text":"下面这个例子也很有趣，同时显示了一次成功引出顺势运动的回调以及一个失败的版本。左边是一个收敛的调整。作为下降趋势中的中继很顺利，朝趋势方向突破，而且也确实包含两段推动。但接下来的回调就令人意外了。明明很明确的形成了作为熊旗的上升通道外观。同时，测试的突破点和均线但没有成功引发空头突破，反而是价格朝上突破。也很不好意思，画面塞不下，但后续的走势是进一步的二推上涨。借有朝向意外方向突破多头，成功套住了空头引发趋势的完全扭转。","pid":"p304"},{"t":"img","src":"assets/img/l05B_075.webp","ilabel":"5-24","icap":"L05　回调与趋势中的持续形态（旗型）","fid":"fig75","ctx":[{"t":"下面这个例子也很有趣，同时显示了一次成功引出顺势运动的回调以及一个失败的版本。左边是一个收敛的调整。作为下降趋势中的中继很顺利，朝趋势方向突破，而且也确实包含两段推动。但接下来的回调就令人意外了。明明很明确的形成了作为熊旗的上升通道外观。同时，测试的突破点和均线但没有成功引发空头突破，反而是价格朝上突破。也很不好意思，画面塞不下，但后续的走势是进一步的二推上涨。借有朝向意外方向突破多头，成功套住了空头引发趋势的完全扭转。","p":"p304"},{"t":"那顺道可以作为补充来提一下。前面说到，对于日内交易者来说，20根K线以上的回调可能太久了。那没有类似的标准，可以去判断回调是否太强呢？对阿尔布鲁克斯来说，他认为，如果回调的幅度超过趋势的75%。回调后，市场重回原趋势极值的几率就会大幅下降。这也不难想见，75%的回调就代表逆势方已有四分之三的本事，把顺势方刚刚的努力都退回去。即使不反转，也可能造就区间。于是看到过深超过75%的回调交易者，虽然不至于要立刻反手交易。但应该将其看作新趋势可能发起了，或者现在是区间，或最好谨慎一点的提示。那么，20根K线75%回调这些数字有没有什么必然的道理呢？多一根不行吗？用80%不行吗？没有什么不行，这是可以调整的。原理你已经了解了，过久或过远的回调都会令趋势能否延续的问题增添不确定性。那么在这里就是大致给学习者们一个数字来参考，方便你在交易现场决策时间很有限的情况下进行不假思索的判断。随着经验累积，要如何调整这个参数，才能更适应你的交易习惯？那是等技巧成熟以后可以自由发展的部分。如果你对图表的阅读量和解析能力都还有限，暂时也不确定怎么调整会更好，那你就先用看看。更重要的是，了解背后的逻辑。这是我一直强调的事情。","p":"p305"}]},{"t":"para","text":"那顺道可以作为补充来提一下。前面说到，对于日内交易者来说，20根K线以上的回调可能太久了。那没有类似的标准，可以去判断回调是否太强呢？对阿尔布鲁克斯来说，他认为，如果回调的幅度超过趋势的75%。回调后，市场重回原趋势极值的几率就会大幅下降。这也不难想见，75%的回调就代表逆势方已有四分之三的本事，把顺势方刚刚的努力都退回去。即使不反转，也可能造就区间。于是看到过深超过75%的回调交易者，虽然不至于要立刻反手交易。但应该将其看作新趋势可能发起了，或者现在是区间，或最好谨慎一点的提示。那么，20根K线75%回调这些数字有没有什么必然的道理呢？多一根不行吗？用80%不行吗？没有什么不行，这是可以调整的。原理你已经了解了，过久或过远的回调都会令趋势能否延续的问题增添不确定性。那么在这里就是大致给学习者们一个数字来参考，方便你在交易现场决策时间很有限的情况下进行不假思索的判断。随着经验累积，要如何调整这个参数，才能更适应你的交易习惯？那是等技巧成熟以后可以自由发展的部分。如果你对图表的阅读量和解析能力都还有限，暂时也不确定怎么调整会更好，那你就先用看看。更重要的是，了解背后的逻辑。这是我一直强调的事情。","pid":"p305"},{"t":"img","src":"assets/img/l05B_076.webp","ilabel":"5-25","icap":"L05　回调与趋势中的持续形态（旗型）","fid":"fig76","ctx":[{"t":"那顺道可以作为补充来提一下。前面说到，对于日内交易者来说，20根K线以上的回调可能太久了。那没有类似的标准，可以去判断回调是否太强呢？对阿尔布鲁克斯来说，他认为，如果回调的幅度超过趋势的75%。回调后，市场重回原趋势极值的几率就会大幅下降。这也不难想见，75%的回调就代表逆势方已有四分之三的本事，把顺势方刚刚的努力都退回去。即使不反转，也可能造就区间。于是看到过深超过75%的回调交易者，虽然不至于要立刻反手交易。但应该将其看作新趋势可能发起了，或者现在是区间，或最好谨慎一点的提示。那么，20根K线75%回调这些数字有没有什么必然的道理呢？多一根不行吗？用80%不行吗？没有什么不行，这是可以调整的。原理你已经了解了，过久或过远的回调都会令趋势能否延续的问题增添不确定性。那么在这里就是大致给学习者们一个数字来参考，方便你在交易现场决策时间很有限的情况下进行不假思索的判断。随着经验累积，要如何调整这个参数，才能更适应你的交易习惯？那是等技巧成熟以后可以自由发展的部分。如果你对图表的阅读量和解析能力都还有限，暂时也不确定怎么调整会更好，那你就先用看看。更重要的是，了解背后的逻辑。这是我一直强调的事情。","p":"p305"},{"t":"最后我们再讲一种综合体，又久又远。有时候你会看到这样的情况，明明前方趋势力量很强而回调，看上去都是小K线。逆势方力道理应很弱。但不晓得为什么回调，就是一直蚕食鲸吞得寸进尺。回过头来，已经十万八千里。对于这种持续超过20根K线顺势，动能疲弱且演变为逆势的窄幅通道，我们称它为无尽回调。同样，既然它又久又远，那就跟前面两种情况一样，都会使趋势恢复的几率锐减。从原本也许60%降低到甚至50%都不到。倾向转入区间或者引发逆势突破。所以以此为例，要是你看到回调耗时许久，超过了20根K线，或者你设定的某种数量。那就先走为妙。这种绵长的上涨基本上就是一种窄幅的通道，在更高时间级别图表上，可能相当于急速运动。这对于你朝上原本的方向进行交易，绝对是不利的事情。","p":"p306"}]},{"t":"para","text":"最后我们再讲一种综合体，又久又远。有时候你会看到这样的情况，明明前方趋势力量很强而回调，看上去都是小K线。逆势方力道理应很弱。但不晓得为什么回调，就是一直蚕食鲸吞得寸进尺。回过头来，已经十万八千里。对于这种持续超过20根K线顺势，动能疲弱且演变为逆势的窄幅通道，我们称它为无尽回调。同样，既然它又久又远，那就跟前面两种情况一样，都会使趋势恢复的几率锐减。从原本也许60%降低到甚至50%都不到。倾向转入区间或者引发逆势突破。所以以此为例，要是你看到回调耗时许久，超过了20根K线，或者你设定的某种数量。那就先走为妙。这种绵长的上涨基本上就是一种窄幅的通道，在更高时间级别图表上，可能相当于急速运动。这对于你朝上原本的方向进行交易，绝对是不利的事情。","pid":"p306"},{"t":"img","src":"assets/img/l05B_077.webp","ilabel":"5-26","icap":"L05　回调与趋势中的持续形态（旗型）","fid":"fig77","ctx":[{"t":"最后我们再讲一种综合体，又久又远。有时候你会看到这样的情况，明明前方趋势力量很强而回调，看上去都是小K线。逆势方力道理应很弱。但不晓得为什么回调，就是一直蚕食鲸吞得寸进尺。回过头来，已经十万八千里。对于这种持续超过20根K线顺势，动能疲弱且演变为逆势的窄幅通道，我们称它为无尽回调。同样，既然它又久又远，那就跟前面两种情况一样，都会使趋势恢复的几率锐减。从原本也许60%降低到甚至50%都不到。倾向转入区间或者引发逆势突破。所以以此为例，要是你看到回调耗时许久，超过了20根K线，或者你设定的某种数量。那就先走为妙。这种绵长的上涨基本上就是一种窄幅的通道，在更高时间级别图表上，可能相当于急速运动。这对于你朝上原本的方向进行交易，绝对是不利的事情。","p":"p306"},{"t":"好差不多又到单元尾声，我们又一口气讲了很多东西。希望从原理到实例的演示，你都觉得有所收获。起初，我们承接着上个单元的测试话题，说明了回调跟测试为什么其实指的是同一件事。它究竟是什么？以及如何开始？基本上回调始于顺势交易者的退缩。以多头突破为例，一旦顺势的多方认为突破带来的短暂数学优势，从原先的60%逐渐下降到50%附近，他们就会渐次收手离场。而此间逆势交易者，也就是空头，则趁虚而入。直到价格折返到多头愿意重新进场，而空头也赚得满意愿意离场的地方。两者的买单汇合就又推动价格朝原先的趋势方向前进。以此结合前两个单元提过的知识，你也就于是完整深刻的理解到为什么一段意外的突破通常能够造就至少两推行情。而说到回调的结束，他们也都结束的有理有据。方才说到，打算等到价格够低，重新入场的多头交易者，以及那些趁虚而入的空头交易者。要怎么决定自己该在哪里买进呢？它们会参考支撑和阻力。支撑和阻力的详细原理会在后面的单元解释。此间你只需要知道，当价格趋近某个和双方都有预期价格可能在那里结束的价位，他们的预期会化为行动部署，反向订单准备介入。而当终于到位，反向订单在这个例子里是多单，其数量终究会压过，导致这段下跌回调的空单引发反转。所以说回调总是结束，在某个支撑阻力附近。后面我们还进一步分析了回调的组成。相对于原趋势，它是一个逆向的小型趋势，也是趋势。不过，特色在于通常内部的推动是越来越弱，没有突破尝试，就失去跟进。因而，无法推动价格朝反方向大幅运动。这将导致无论回调的外形如何，家里头的逆势动能相较于原趋势更弱，它就通常能够起到持续形态的作用。上升趋势中的回调是牛旗，水平下降通道尤其如此。下降趋势中的回调则是牛旗，水平上升通道更是。行情有80%的几率朝向趋势线方向进行突破，并至少走出第二段推动。如果第二段推动无法越过原趋势极值，则可能转入区间或反转。如果第二段推动又突破成功，那就会开启新的突破循环。突破回调再突破。剩下20%的几率回调会失效，无法起到反转趋势的作用。要不是过久让交易者失去趋势将会恢复的信心继而改称它为区间。这是朝向反方向的加速突破，开启了新的突破循环。又或者两者兼有发展为持续又久，运动距离又远的无尽回调。但综合以上，只要熟谙原理，交易者就可以趁着趋势还健在的时候，在回调中寻找优质的交易机会。争取朝向趋势方向的利润。即使回调偶尔会过度，无法发挥预期的作用也无所谓。正确的管理交易也能够获得足够的数学优势。综合以上，希望你逐渐将所有的知识模块紧紧相牵在一起了。突破回调再突破的过程看起来稀松平常。但正是因为它很常见，我们更该去思考是什么原因导致这样的价格行为一再上演。背后是不是存在某种定律式的逻辑基础，能够表达多空竞争的基本模式？现在你对这样的模式已经有入木三分的理解了。下两个单元，我们依序接着细究回调，无法起到延续作用，以后所可能转入的两种市场状态。区间以及反转。你同样会有所收获哦，我跟你一样期待。感谢收看回调与趋势中的持续形态旗型，我们下个单元见。","p":"p307"}]},{"t":"para","text":"好差不多又到单元尾声，我们又一口气讲了很多东西。希望从原理到实例的演示，你都觉得有所收获。起初，我们承接着上个单元的测试话题，说明了回调跟测试为什么其实指的是同一件事。它究竟是什么？以及如何开始？基本上回调始于顺势交易者的退缩。以多头突破为例，一旦顺势的多方认为突破带来的短暂数学优势，从原先的60%逐渐下降到50%附近，他们就会渐次收手离场。而此间逆势交易者，也就是空头，则趁虚而入。直到价格折返到多头愿意重新进场，而空头也赚得满意愿意离场的地方。两者的买单汇合就又推动价格朝原先的趋势方向前进。以此结合前两个单元提过的知识，你也就于是完整深刻的理解到为什么一段意外的突破通常能够造就至少两推行情。而说到回调的结束，他们也都结束的有理有据。方才说到，打算等到价格够低，重新入场的多头交易者，以及那些趁虚而入的空头交易者。要怎么决定自己该在哪里买进呢？它们会参考支撑和阻力。支撑和阻力的详细原理会在后面的单元解释。此间你只需要知道，当价格趋近某个和双方都有预期价格可能在那里结束的价位，他们的预期会化为行动部署，反向订单准备介入。而当终于到位，反向订单在这个例子里是多单，其数量终究会压过，导致这段下跌回调的空单引发反转。所以说回调总是结束，在某个支撑阻力附近。后面我们还进一步分析了回调的组成。相对于原趋势，它是一个逆向的小型趋势，也是趋势。不过，特色在于通常内部的推动是越来越弱，没有突破尝试，就失去跟进。因而，无法推动价格朝反方向大幅运动。这将导致无论回调的外形如何，家里头的逆势动能相较于原趋势更弱，它就通常能够起到持续形态的作用。上升趋势中的回调是牛旗，水平下降通道尤其如此。下降趋势中的回调则是牛旗，水平上升通道更是。行情有80%的几率朝向趋势线方向进行突破，并至少走出第二段推动。如果第二段推动无法越过原趋势极值，则可能转入区间或反转。如果第二段推动又突破成功，那就会开启新的突破循环。突破回调再突破。剩下20%的几率回调会失效，无法起到反转趋势的作用。要不是过久让交易者失去趋势将会恢复的信心继而改称它为区间。这是朝向反方向的加速突破，开启了新的突破循环。又或者两者兼有发展为持续又久，运动距离又远的无尽回调。但综合以上，只要熟谙原理，交易者就可以趁着趋势还健在的时候，在回调中寻找优质的交易机会。争取朝向趋势方向的利润。即使回调偶尔会过度，无法发挥预期的作用也无所谓。正确的管理交易也能够获得足够的数学优势。综合以上，希望你逐渐将所有的知识模块紧紧相牵在一起了。突破回调再突破的过程看起来稀松平常。但正是因为它很常见，我们更该去思考是什么原因导致这样的价格行为一再上演。背后是不是存在某种定律式的逻辑基础，能够表达多空竞争的基本模式？现在你对这样的模式已经有入木三分的理解了。下两个单元，我们依序接着细究回调，无法起到延续作用，以后所可能转入的两种市场状态。区间以及反转。你同样会有所收获哦，我跟你一样期待。感谢收看回调与趋势中的持续形态旗型，我们下个单元见。","pid":"p307"}],"wcount":7709}],"wcount":14706},{"id":"l06","icon":"L06","title":"L06　区间 双边交易地带","blocks":[{"t":"para","text":"L06 区间 双边交易地带","pid":"p308"},{"t":"para","text":"我想这个单元会稍微简短一些，但这一点都不代表重要性不如其他章节。今天我们来谈80%的市场所处在的状态：区间。除了说明区间如何形成，区间如何进行定义，我们还会细究区间的特性，方便将来交易者们在图表上可以正确辨识它们。另外，区间的特殊性质可能成为我们交易时阻碍我们或反而利于我们行动的要素。学会活用这些性质的方法，交易者可以趋吉避凶。而最后，我们谈谈区间，除了最普通的版本以外，还有什么值得注意的特殊形式？以及该如何应对他们。","pid":"p309"},{"t":"img","src":"assets/img/l06x_078.webp","ilabel":"6-1","icap":"L06　区间 双边交易地带","fid":"fig78","ctx":[{"t":"L06 区间 双边交易地带","p":"p308"},{"t":"我想这个单元会稍微简短一些，但这一点都不代表重要性不如其他章节。今天我们来谈80%的市场所处在的状态：区间。除了说明区间如何形成，区间如何进行定义，我们还会细究区间的特性，方便将来交易者们在图表上可以正确辨识它们。另外，区间的特殊性质可能成为我们交易时阻碍我们或反而利于我们行动的要素。学会活用这些性质的方法，交易者可以趋吉避凶。而最后，我们谈谈区间，除了最普通的版本以外，还有什么值得注意的特殊形式？以及该如何应对他们。","p":"p309"},{"t":"如今，我们都已经深深地熟悉市场自身的机制与目的。就是为了促进总体效用的最大化。因此，他喜欢呆在能创造最多交易的公平价位，使人们得以效率地进行交投。这种处在共识价格地带的状态正是均衡，而市场爱好均衡，就是多数图表上的K线。都处于区间中的原因。所以何为区间呢？对于区间最宽松但也最实用的定义就是存在双边交易的区域。虽然我们上个单元说对日内交易来讲，尤其是作为嵌于趋势中的回调，区间应至少持续20根K线。但如果单纯就其本质来谈，那其实不论是持续500根K线，或仅仅是急速中断一颗十字星的停顿。都可以呈现出双边交易性格。这也是为什么我们将十字星称作区间K线。500根K线的区间对更大时间级别图表来说，也可能是单独一颗十字星。同时，区间也可以是激烈的震荡，也可以是平静的横向重叠。存在双边交易的区域，正是我们这个单元的副标题。要一语道破的话，这是最精准的讲法。","p":"p310"}]},{"t":"para","text":"如今，我们都已经深深地熟悉市场自身的机制与目的。就是为了促进总体效用的最大化。因此，他喜欢呆在能创造最多交易的公平价位，使人们得以效率地进行交投。这种处在共识价格地带的状态正是均衡，而市场爱好均衡，就是多数图表上的K线。都处于区间中的原因。所以何为区间呢？对于区间最宽松但也最实用的定义就是存在双边交易的区域。虽然我们上个单元说对日内交易来讲，尤其是作为嵌于趋势中的回调，区间应至少持续20根K线。但如果单纯就其本质来谈，那其实不论是持续500根K线，或仅仅是急速中断一颗十字星的停顿。都可以呈现出双边交易性格。这也是为什么我们将十字星称作区间K线。500根K线的区间对更大时间级别图表来说，也可能是单独一颗十字星。同时，区间也可以是激烈的震荡，也可以是平静的横向重叠。存在双边交易的区域，正是我们这个单元的副标题。要一语道破的话，这是最精准的讲法。","pid":"p310"},{"t":"img","src":"assets/img/l06x_079.webp","ilabel":"6-2","icap":"L06　区间 双边交易地带","fid":"fig79","ctx":[{"t":"如今，我们都已经深深地熟悉市场自身的机制与目的。就是为了促进总体效用的最大化。因此，他喜欢呆在能创造最多交易的公平价位，使人们得以效率地进行交投。这种处在共识价格地带的状态正是均衡，而市场爱好均衡，就是多数图表上的K线。都处于区间中的原因。所以何为区间呢？对于区间最宽松但也最实用的定义就是存在双边交易的区域。虽然我们上个单元说对日内交易来讲，尤其是作为嵌于趋势中的回调，区间应至少持续20根K线。但如果单纯就其本质来谈，那其实不论是持续500根K线，或仅仅是急速中断一颗十字星的停顿。都可以呈现出双边交易性格。这也是为什么我们将十字星称作区间K线。500根K线的区间对更大时间级别图表来说，也可能是单独一颗十字星。同时，区间也可以是激烈的震荡，也可以是平静的横向重叠。存在双边交易的区域，正是我们这个单元的副标题。要一语道破的话，这是最精准的讲法。","p":"p310"},{"t":"这时你也许会有所疑问。即使是非常强的趋势K线过程中，也必定多少存在多空的成交，那这不也是双边交易吗？我们难道能说急速运动也是区间吗？确实，只要不是跳空，急速之中依然存在多空交投，必定是存在买卖。趋势方与逆势方成交。不过，双边交易的程度也有高低之分。所以此以上升急速为例，可以说是严重偏向单边交易。想买的人比想卖的人踊跃更多，才能造就快速大幅的价格运动。你也可以说急速发起是一方决定积极入场，另一方同时决定抽身观望的共事所造就的。那么，有没有想要加入趋势？但基于各种理由，没有出手的人。有，但相对少。因为顶尖精明的机构不会错过顺势盈利的大好机会。那有没有明知价格现在如火车一般疾驶而来，却还是舍身阻挡的逆势交易者？有，但同样是少数人。多数机构知道这种极端逆行不易盈利。所以说急速中并不是不存在双边交易，只是相对少很多。急速段落依然有少量的区间性格。而相对的区间内部也可能存在快速涨跌或者略微倾斜，看上去像宽幅通道。这也是单边交易的展现，略有趋势性格，只是相对较少。那当然，距两者之间的通道则是急速与区间的性格兼有。既有多空，你来我往的现实，也有一方在总体上更占优势。好的，总之任何行情必然落在急速与区间，100与0，单边与双边交易的光谱之间。请务必记下这个观念，讨论行情的时候要保留这种弹性的意识。我们也随即找到一张区间的图表来进行进一步的讨论。","p":"p311"}]},{"t":"para","text":"这时你也许会有所疑问。即使是非常强的趋势K线过程中，也必定多少存在多空的成交，那这不也是双边交易吗？我们难道能说急速运动也是区间吗？确实，只要不是跳空，急速之中依然存在多空交投，必定是存在买卖。趋势方与逆势方成交。不过，双边交易的程度也有高低之分。所以此以上升急速为例，可以说是严重偏向单边交易。想买的人比想卖的人踊跃更多，才能造就快速大幅的价格运动。你也可以说急速发起是一方决定积极入场，另一方同时决定抽身观望的共事所造就的。那么，有没有想要加入趋势？但基于各种理由，没有出手的人。有，但相对少。因为顶尖精明的机构不会错过顺势盈利的大好机会。那有没有明知价格现在如火车一般疾驶而来，却还是舍身阻挡的逆势交易者？有，但同样是少数人。多数机构知道这种极端逆行不易盈利。所以说急速中并不是不存在双边交易，只是相对少很多。急速段落依然有少量的区间性格。而相对的区间内部也可能存在快速涨跌或者略微倾斜，看上去像宽幅通道。这也是单边交易的展现，略有趋势性格，只是相对较少。那当然，距两者之间的通道则是急速与区间的性格兼有。既有多空，你来我往的现实，也有一方在总体上更占优势。好的，总之任何行情必然落在急速与区间，100与0，单边与双边交易的光谱之间。请务必记下这个观念，讨论行情的时候要保留这种弹性的意识。我们也随即找到一张区间的图表来进行进一步的讨论。","pid":"p311"},{"t":"img","src":"assets/img/l06x_080.webp","ilabel":"6-3","icap":"L06　区间 双边交易地带","fid":"fig80","ctx":[{"t":"这时你也许会有所疑问。即使是非常强的趋势K线过程中，也必定多少存在多空的成交，那这不也是双边交易吗？我们难道能说急速运动也是区间吗？确实，只要不是跳空，急速之中依然存在多空交投，必定是存在买卖。趋势方与逆势方成交。不过，双边交易的程度也有高低之分。所以此以上升急速为例，可以说是严重偏向单边交易。想买的人比想卖的人踊跃更多，才能造就快速大幅的价格运动。你也可以说急速发起是一方决定积极入场，另一方同时决定抽身观望的共事所造就的。那么，有没有想要加入趋势？但基于各种理由，没有出手的人。有，但相对少。因为顶尖精明的机构不会错过顺势盈利的大好机会。那有没有明知价格现在如火车一般疾驶而来，却还是舍身阻挡的逆势交易者？有，但同样是少数人。多数机构知道这种极端逆行不易盈利。所以说急速中并不是不存在双边交易，只是相对少很多。急速段落依然有少量的区间性格。而相对的区间内部也可能存在快速涨跌或者略微倾斜，看上去像宽幅通道。这也是单边交易的展现，略有趋势性格，只是相对较少。那当然，距两者之间的通道则是急速与区间的性格兼有。既有多空，你来我往的现实，也有一方在总体上更占优势。好的，总之任何行情必然落在急速与区间，100与0，单边与双边交易的光谱之间。请务必记下这个观念，讨论行情的时候要保留这种弹性的意识。我们也随即找到一张区间的图表来进行进一步的讨论。","p":"p311"},{"t":"现在画面中的这张图表应该算是很常见的行情。为了方便说明，我当然有刻意找了一个斜率相对很低的区间。但你应该不难想见，在多数品种的多数时间里，尤其是那些交投比较平淡的时段。走势常常就是这个样子，无聊的稀松平常。但实际上并不枯燥，甚至是挺精彩。多空在这个段落里，不断尝试创造有利于自己的走势。但不时失败，没有后续。以画面最左边我标上箭头的这根趋势阴线为例。它是吞没前一根阳线的外包K线。这代表多头有过向上突破的意图，但马上反转下落，反被空头突破。空头突破作为意外行情，作为急速应当还有后续。后面空头非常努力的在创造出下跌的第二推运动。但走了一段加速下坠以后，收内包阳线还接着被向上突破。接连两根的趋势阳线，看似多头又取得了主动权。更别说后面还有一根更大的趋势阳线。回调以后，换作多头努力创造出向上的第二推。后续运动的内部组成相对复杂一点，但这是很常见的急速与通道组合。两者还略略成等距关系，这在后面的章节会细究。总之，多头在朝上努力造就通道的同时，空头的卖压也在积累，空头也在找机会返攻。而后续又创造出了更深的回调。接着呢，多头马上返攻但到了前方极值处，多头对这个水平价位的测试结果却是没有跟进。反倒还收出了很强的阴线，演变为空头的突破成功。急速发起以后，空头同样努力，争取创造回调后的第二段推动。价格却也仍然在测试前波段低点以后收回，最后又变成多头的走势。但后续看来，多头也没有走的太顺利。这里有三个高点显现突破屡屡失败的痕迹。就这样震荡到图表结束。经过以上，你应该感受到了，就区间内部而言，单边交易性格较强的急速段落以及窄幅通道也都是存在的。但由于整体脉络是位于区间中，这点可以从区间边线无法被突破，价格总是看似强劲，但很快又被对手反转见得。整体呈现的是你买我卖，互相推脱与反击的局势。双方都尝试发起急速，并努力制造出一个朝力于自己方向的等距通道，但二者合力的结果就是导致市场进入区间。如此踊跃的双边交易证明，这是多空都认为有建仓价值的均衡地带，而这将持续好一段时间。","p":"p312"},{"t":"接着来进一步聊聊区间的特性。相较于急速性格很强的段落，区间性格所主导的市场状态必然将呈现很不同的属性。导致原先在趋势中能运作的交易方式失效。甚至别说是失效，说失效好像只是让你赚不了钱而已，应该说是颠倒比较正确。直接搬用原先的做法会让你蒙受重大损失。在书中，阿尔布鲁克斯陈列了将近20项描述区间的特征。有的涉及交易者在当下会有的主观感受情绪层面的内容。有的则非常数学谈的是客观的胜率与盈亏比。但经过化繁为简，同时不丢失重要讯息的整理以后，有以下几点可以直接参考。","p":"p313"}]},{"t":"para","text":"现在画面中的这张图表应该算是很常见的行情。为了方便说明，我当然有刻意找了一个斜率相对很低的区间。但你应该不难想见，在多数品种的多数时间里，尤其是那些交投比较平淡的时段。走势常常就是这个样子，无聊的稀松平常。但实际上并不枯燥，甚至是挺精彩。多空在这个段落里，不断尝试创造有利于自己的走势。但不时失败，没有后续。以画面最左边我标上箭头的这根趋势阴线为例。它是吞没前一根阳线的外包K线。这代表多头有过向上突破的意图，但马上反转下落，反被空头突破。空头突破作为意外行情，作为急速应当还有后续。后面空头非常努力的在创造出下跌的第二推运动。但走了一段加速下坠以后，收内包阳线还接着被向上突破。接连两根的趋势阳线，看似多头又取得了主动权。更别说后面还有一根更大的趋势阳线。回调以后，换作多头努力创造出向上的第二推。后续运动的内部组成相对复杂一点，但这是很常见的急速与通道组合。两者还略略成等距关系，这在后面的章节会细究。总之，多头在朝上努力造就通道的同时，空头的卖压也在积累，空头也在找机会返攻。而后续又创造出了更深的回调。接着呢，多头马上返攻但到了前方极值处，多头对这个水平价位的测试结果却是没有跟进。反倒还收出了很强的阴线，演变为空头的突破成功。急速发起以后，空头同样努力，争取创造回调后的第二段推动。价格却也仍然在测试前波段低点以后收回，最后又变成多头的走势。但后续看来，多头也没有走的太顺利。这里有三个高点显现突破屡屡失败的痕迹。就这样震荡到图表结束。经过以上，你应该感受到了，就区间内部而言，单边交易性格较强的急速段落以及窄幅通道也都是存在的。但由于整体脉络是位于区间中，这点可以从区间边线无法被突破，价格总是看似强劲，但很快又被对手反转见得。整体呈现的是
