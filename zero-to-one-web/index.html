<style>
html{
  --bg:#ffffff; --panel:#f5f6f7; --panel2:#eceef0; --line:#c9ced4;
  --text:#111418; --muted:#555e68; --accent:#0E9488; --deep:#0E9488;
  --amber:#a16207; --green:#15803d;
  --topbar-bg:rgba(255,255,255,.94); --para:#1a1f24;
  --mark-bg:rgba(14,148,136,.08); --badge-bg:rgba(14,148,136,.08); --badge-border:#0E9488;
  --overlay:rgba(0,0,0,.35);
  --mark-text:rgba(251,191,36,.35);
}
:root{--sidebar:280px; --topbar:56px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.85;-webkit-font-smoothing:antialiased;
}
.topbar{
  position:fixed;top:0;left:0;right:0;height:var(--topbar);z-index:50;
  background:var(--topbar-bg);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 20px;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#08110f;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px}
.brand .sub{color:var(--muted);font-weight:400;font-size:13px}
.lib-btn{flex:none;display:inline-flex;align-items:center;gap:5px;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;transition:background .18s}
.lib-btn:hover{background:rgba(14,148,136,.08)}
@media(max-width:720px){.lib-btn{padding:5px 9px;font-size:12px}}
.searchwrap{margin-left:auto;position:relative}
.searchwrap input{
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:8px 12px 8px 34px;width:230px;font-size:14px;outline:none;
  transition:border-color .2s;
}
.searchwrap input:focus{border-color:var(--accent)}
.searchwrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);stroke:var(--muted)}
.menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:6px 10px;font-size:18px;cursor:pointer}
.layout{display:flex;padding-top:var(--topbar);min-height:100vh}
.sidebar{
  position:fixed;top:var(--topbar);bottom:0;left:0;width:var(--sidebar);
  background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:16px 0 40px;z-index:40;
}
.sidebar::-webkit-scrollbar,.main::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb,.main::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.toc-hint{font-size:11px;letter-spacing:2px;color:var(--muted);padding:6px 20px 12px;text-transform:uppercase}
.toc-hint .total{display:block;letter-spacing:0;font-size:11px;color:var(--muted);margin-top:6px;text-transform:none}
.toc-ch{margin-bottom:2px}
.toc-ch-title{
  display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;
  font-weight:600;font-size:14px;user-select:none;color:var(--text);
}
.toc-ch-title:hover{background:var(--panel2)}
.toc-ch-title.active{color:var(--accent);background:var(--mark-bg);font-weight:700}
.toc-ch-title .num{
  flex:none;width:24px;height:24px;border-radius:6px;background:var(--panel2);
  color:var(--accent);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700;
}
.toc-ch-title .name{flex:1;line-height:1.35}
.toc-ch-title .wc{flex:none;font-size:10.5px;color:var(--muted);font-weight:400;opacity:.8}
.toc-ch.hidden{display:none}
.main{margin-left:var(--sidebar);flex:1;padding:44px 24px 120px;min-width:0}
.paper{max-width:820px;margin:0 auto}
.chapter{margin-bottom:80px;scroll-margin-top:80px}
.chapter-head{margin-bottom:36px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.chapter-head .badge{
  display:inline-block;background:var(--badge-bg);color:var(--accent);
  border:1px solid var(--badge-border);border-radius:6px;padding:2px 10px;font-size:12px;
  letter-spacing:2px;margin-bottom:14px;
}
.chapter-head h1{font-size:30px;line-height:1.35;font-weight:800;letter-spacing:.5px}
.chapter-head .wcmeta{font-size:13px;color:var(--muted);margin-top:10px}
.chapter-head .wcmeta b{color:var(--accent);font-weight:700}
.para{margin:0 0 18px;color:var(--para);text-align:justify}
.bookfig{margin:26px 0;text-align:center;cursor:zoom-in}
.bookfig img{max-width:100%;max-height:560px;border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.12)}
.bookfig.bfbig{cursor:zoom-out}
.bookfig.bfbig img{max-width:none;max-height:none;width:auto;box-shadow:0 4px 24px rgba(0,0,0,.3)}
.bookfig figcaption{font-size:12px;color:var(--muted);margin-top:8px}
mark{background:var(--mark-text);color:var(--amber);border-radius:3px;padding:0 2px}
.side-tabs{display:flex;gap:4px;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.side-tabs button{flex:1;background:none;border:1px solid var(--line);color:var(--muted);
  border-radius:7px;padding:7px 4px;font-size:12.5px;cursor:pointer;transition:all .15s}
.side-tabs button.on{color:var(--accent);border-color:var(--deep);background:var(--badge-bg);font-weight:700}
.side-panel{display:none}.side-panel.on{display:block}
.hl-y{background:rgba(251,191,36,.42);border-radius:2px;padding:1px 0;cursor:pointer}
.hl-g{background:rgba(74,222,128,.38);border-radius:2px;padding:1px 0;cursor:pointer}
.hl-b{background:rgba(96,165,250,.32);border-radius:2px;padding:1px 0;cursor:pointer}
.hl-bold{font-weight:800}
.selbar{position:fixed;z-index:155;display:none;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:5px;gap:4px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.selbar.show{display:flex;flex-wrap:wrap;max-width:340px}
.selbar button{border:none;background:var(--panel2);color:var(--text);border-radius:7px;
  padding:7px 10px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:5px}
.selbar button:hover{background:var(--accent);color:#08110f}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.dot.y{background:#fbbf24}.dot.g{background:#4ade80}.dot.b{background:#60a5fa}
.excerpt-item{position:relative;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.excerpt-item:hover{background:var(--panel2)}
.excerpt-item .etext{font-size:13px;line-height:1.7;color:var(--text);word-break:break-word}
.excerpt-item .emeta{font-size:11px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.excerpt-item .edel{color:var(--muted);border:none;background:none;cursor:pointer;font-size:14px;padding:2px 6px}
.excerpt-item .edel:hover{color:#f87171}
.excerpt-item .ecolor{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px}
.excerpt-empty{padding:30px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
.excerpt-tools{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.excerpt-tools button{flex:1;min-width:70px;background:var(--panel2);border:1px solid var(--line);
  color:var(--text);border-radius:7px;padding:7px;font-size:12px;cursor:pointer}
.excerpt-tools button:hover{border-color:var(--accent);color:var(--accent)}
.excerpt-search{margin:10px 16px 4px;width:calc(100% - 32px);background:var(--panel2);
  border:1px solid var(--line);color:var(--text);border-radius:7px;padding:8px 10px;font-size:13px;outline:none}
.progress{position:fixed;top:var(--topbar);left:0;height:2px;background:var(--accent);z-index:60;width:0}
.totop{
  position:fixed;right:24px;bottom:28px;width:44px;height:44px;border-radius:50%;
  background:var(--panel2);border:1px solid var(--line);color:var(--accent);
  font-size:20px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:30;
}
.totop.show{display:flex}
@media(max-width:800px){
  :root{--sidebar:0px}
  .brand .sub{display:none}
  .brand>span:nth-child(2){display:none}
  .topbar{gap:10px;padding:0 12px}
  .searchwrap{margin-left:auto;flex:1;max-width:190px}
  .searchwrap input{width:100%}
  .menu-btn{display:block;flex:none}
  .sidebar{transform:translateX(-100%);transition:transform .25s;width:82vw;max-width:320px}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:30px 16px 100px}
  .chapter-head h1{font-size:24px}
  body{font-size:15.5px}
  .overlay{position:fixed;inset:0;background:var(--overlay);z-index:35;display:none}
  .overlay.show{display:block}
}
/* FOCUS-READ-MODE v1 */
/* ---------- 专注阅读（全屏）模式 ---------- */
.focus-btn{flex:none;display:inline-flex;align-items:center;gap:5px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:700;background:transparent;cursor:pointer;white-space:nowrap;transition:border-color .18s,color .18s;font-family:inherit}
.focus-btn:hover{border-color:var(--accent);color:var(--accent)}
body.focus-mode .topbar,body.focus-mode .sidebar,body.focus-mode .progress,body.focus-mode .overlay,body.focus-mode .selbar,body.focus-mode .totop{display:none!important}
body.focus-mode .layout{padding-top:0}
body.focus-mode .main{margin-left:0;padding:0}
body.focus-mode .paper{max-width:var(--focus-width,760px);margin:0 auto;padding:64px 30px 160px}
body.focus-mode .para{font-size:var(--focus-fs,19px);line-height:var(--focus-lh,2);letter-spacing:.01em}
body.focus-mode .chapter{margin-bottom:100px}
body.focus-mode .chapter-head{margin-bottom:48px}
body.focus-mode .chapter-head h1{font-size:32px}
body.focus-mode .bookfig{margin:36px 0}
.focus-tools{position:fixed;z-index:210;right:18px;top:18px;display:none;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:6px 8px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
body.focus-mode .focus-tools{display:flex}
.focus-tools button{min-width:32px;height:30px;border:none;background:transparent;color:var(--text);border-radius:7px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;padding:0 8px}
.focus-tools button:hover{background:var(--panel2);color:var(--accent)}
.focus-tools .ft-exit{color:var(--accent);border-left:1px solid var(--line);border-radius:0 7px 7px 0;margin-left:2px;padding-left:10px}
.focus-tools .ft-label{font-size:11px;color:var(--muted);padding:0 4px;white-space:nowrap}
.focus-hint{position:fixed;z-index:210;bottom:22px;left:50%;transform:translateX(-50%);display:none;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:7px 16px;font-size:12px;color:var(--muted);box-shadow:0 4px 18px rgba(0,0,0,.1);opacity:.92;pointer-events:none}
body.focus-mode .focus-hint{display:block}
@media print{.book-title{color:#000!important;border-bottom:2px solid #000!important}.book-title:empty::before{content:''!important}}
@media print{.focus-btn,.focus-tools,.focus-hint{display:none!important}body.focus-mode .topbar,body.focus-mode .sidebar,body.focus-mode .progress,body.focus-mode .overlay,body.focus-mode .selbar,body.focus-mode .totop{display:none!important}}

@media print{
  html{
    --bg:#fff;--panel:#fff;--panel2:#fff;--text:#000;--muted:#000;--line:#000;
    --accent:#000;--para:#000;--badge-bg:#fff;--mark-bg:#fff;
  }
  body{background:#fff!important;color:#000!important;font-size:11pt}
  .topbar,.sidebar,.progress,.totop,.overlay,.selbar{display:none!important}
  .layout{display:block;padding:0}
  .main{margin:0;padding:0}
  .paper{max-width:none}
  .chapter{margin-bottom:24px;page-break-after:auto}
  .chapter-head{border-bottom:1px solid #000;padding-bottom:8px;margin-bottom:16px}
  .chapter-head h1{font-size:20pt;color:#000}
  .para{color:#000!important}
  mark{background:none;color:#000;font-weight:bold}
}
.rt-wrap{position:relative;flex:none;display:inline-flex}
.read-timer{display:inline-flex;align-items:center;gap:6px;height:34px;color:var(--muted);font-size:13px;font-weight:600;background:transparent;border:1px solid var(--line);border-radius:8px;padding:0 10px;white-space:nowrap;cursor:pointer;font-family:inherit}
.read-timer:hover{border-color:var(--accent);color:var(--accent)}
.read-timer .rt-dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.read-timer.live .rt-dot{background:var(--accent);box-shadow:0 0 0 3px rgba(14,148,136,.16)}
.read-timer b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:700}
.rt-pop{position:absolute;right:0;top:calc(100% + 8px);z-index:300;width:262px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:0 12px 34px rgba(0,0,0,.13);display:none;text-align:left;font-weight:400;font-size:13px;line-height:1.6}
.rt-pop.show{display:block}
.rt-pop h4{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:700}
.rt-pop .rt-big{font-size:22px;color:var(--accent);font-weight:800;margin-bottom:8px;font-variant-numeric:tabular-nums}
.rt-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.rt-row:last-child{border-bottom:0}
.rt-row span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-row b{color:var(--text);font-variant-numeric:tabular-nums;flex:none}
.rt-bars{display:flex;align-items:flex-end;gap:4px;height:58px;margin:8px 0 6px}
.rt-bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.rt-bar i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.rt-bar.today i{opacity:1;box-shadow:0 0 0 1px var(--deep)}
.rt-bar em{font-size:10px;font-style:normal;color:var(--muted);white-space:nowrap}
.rt-tip{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
@media(max-width:720px){.read-timer{height:30px;padding:0 7px;font-size:12px}.rt-label{display:none}.rt-pop{right:-40px;width:242px}}
@media print{.rt-wrap,.rt-pop{display:none!important}}

/* MOBUI-v1 */@media(max-width:720px){.undo-btn{display:none!important}.split-reader{display:none!important}}
</style>



<style id="simpleEditStyle">
/* ===== SIMPLE-EDIT-v2 默认纯阅读 + 按需改字 ===== */
/* 只有正在编辑的那一段才有提示框；其余段落保持纯阅读，无任何框 */
/* DUPTITLE-v1 正文首段与标题重复时隐藏该行（不删DOM，仅视觉隐藏）*/
.dup-title-line{display:none!important}
.dup-title-line + p{margin-top:0}
@media print{.dup-title-line{display:none!important}}
/* BOOKTITLE-v1 书名大标题（空白可编辑）*/
.book-title{font-size:30px;font-weight:800;line-height:1.35;color:var(--text);
  margin:6px 0 26px;padding:0 0 14px;border-bottom:2px solid var(--accent);
  cursor:text;outline:none;min-height:1em}
.book-title:empty::before{content:'点击此处输入书名大标题…';color:var(--muted);font-weight:600;opacity:.7}
[data-pid].se-editing{outline:1px solid var(--amber);outline-offset:2px;border-radius:2px;cursor:text;background:rgba(251,191,36,.05)}
/* 改过的段落：极轻左边框痕迹（打印去掉） */
/* EDITUI-FIX: 改字后不再显示橙色竖框，段落保持纯阅读外观 */
/* 文字被删空的段落：隐藏整段（含残留竖线装饰），撤销后自动恢复 */
[data-pid].se-empty{display:none!important}
/* 工具条里的改字按钮 */
#editBtn{white-space:nowrap}
/* 顶栏「回到上一版」按钮 */
.undo-btn{flex:none;display:inline-flex;align-items:center;gap:5px;color:var(--muted);border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:border-color .18s,color .18s}
.undo-btn:hover{border-color:var(--accent);color:var(--accent)}
.undo-btn.hasundo{border-color:var(--amber);color:var(--amber)}
.undo-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:370;background:#111418;color:#fff;font-size:12px;padding:7px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
.undo-toast.show{opacity:.94}
@media print{.undo-btn,.undo-toast{display:none!important}p[data-edited="1"],h2[data-edited="1"]{box-shadow:none!important;padding-left:0!important}[data-pid].se-editing{outline:none!important;background:none!important}}
</style>

<!-- EDITUI-FIX-v1 -->
</head>

<div class="overlay" id="overlay"></div>
<div class="layout">
  <nav class="sidebar" id="sidebar">

      <button class="on" data-panel="toc">目录</button>
      <button data-panel="note">摘录<span id="noteCount"></span></button>

<script>
const DATA = [{"icon": "译", "title": "译者序 我为什么要再译《从零到一》？", "paras": ["《从零到一》是硅谷著名投资人彼得·蒂尔（Peter Thiel）2014 年出版的一本书，原书英文名称是《Zero To One》，副标题是《Notes on Startups, or How to Build the Future》。中文译本已经于 2015 年 1 月由中信出版社出版发行。", "那么既然已经出版了，为什么我还要再译一下呢？当然是因为中信出版社的译本不够好！", "要说哪里不够好，第一就应该是从风格说起。《Zero To One》是根据彼得·蒂尔 2012 年在斯坦福大学的一门课程的笔记整理而成，非常口语化，而且最重要的是，直白。原文中很多话就像我批评中译本不够好一样直白，很多句子是褒贬鲜明的犀利断言，而在中译本中却多多少少被软化了。", "例如他说人们应该赶紧离开没前途的地方时，英文原文是“…you shall quit now”，而中译本是“你应该现在就辞职”。意思对，味道不对。", "用“辞职”来翻译当然不算错，但是如果译成“你就该立马撤”或者“你趁早走人”，就更能让人感到明确的倾向性和鼓动性。说夸张一点，原著好比是节奏轻快立场鲜明的进行曲，小号嘹亮鼓点轻快，也许还有口哨伴奏，而中译本虽然是同样的旋律却放慢了节奏，更要命的是改拿二胡来演奏，带来的感受能一样吗？二胡虽好却不是这么用的……", "其次，作为一部中译本，中信出版的这中文版竟然没有任何注解？编者注，译者注，都没有。", "编译外国著作，对于一些专业的术语，如果原文没加注释，译本也就照样不加，这就算了。", "但通常考虑到照顾国内读者的实际情况，中译本一般会多少适当添加一点背景注释，或者追加一些补充信息帮助读者理解，甚至有的译者会提出自己的观点或解读来引发读者思考。而这本书里，全都没有。（好吧，严谨一点，有，但是很少，即使只是从帮助理解的角度讲，也缺的实在太多。）", "比如说到使用咨询公司的顾问人员这事，原文里英语使用的是“Consultant”，这个词的确直译就是“顾问”，但是咨询公司怎么了？顾问怎么了？怎么就“缺乏特定使命”“缺乏长久联系” （注：中译本 168 页）了？", "如果加个注解，说明这里所指的“Consultant”和咨询公司，其实就是通常说的“外包”，是不是会更好理解一点？最后，中译本 173 页，翻译的一个故事，开头和结尾是“因为地球即将被毁灭……最后，B 船降落在地球。”原文是这个意思么？ABC 船的故事原本是个小小的笑话，但是中译本却给 B 船带来了一个正经很悲催的结局。类似这样的例子还有不少，例如对 90 年代的描述，对探索秘密的方法的对比，以及对很多观念和褒贬的理解，中信中译本都让人读起来比较“费劲”。可能是因为编译的太仓促没有注意到，当然相比前面两点来说，这种错误实在可以说是不值一提。", "但是以上三点里的任何一点，都足以让人读中译本的话，会“读不懂”。或者说，读了英文原版再看中译本，感觉会是两本不同的书。所以我觉得再花很多精力换个翻译方式让大家参考参考是很有必要的，毕竟这书原本很不错。那么我会翻译成什么样呢？写这篇文字的时候我也不知道。但是我会先告诉你，这本牛人写的书里分享了很多他自己的观点看法，比如：", "创业的成功有没有规律可循？", "竞争和垄断哪个更有利社会进步？", "技术与销售相比谁更重要？", "开创事业的老板是不是多少会有点怪异？", "人类会不会被电脑取代？", "以及，未来是什么？"], "wcount": 1373}, {"icon": "前", "title": "前言", "paras": ["这世上的每一刻都不会再现，生意更是如此。", "下一个比尔·盖茨注不会再写操作系统，下一个拉里·佩奇、或者赛尔日·布林注不会开发搜索引擎，下一个马克·扎克伯格注要做的也不会再是社交网络。如果你只是试图照抄他们做过的事，那么你就根本不是在向他们学习。", "注：分别是微软公司(Microsoft)、谷歌公司(Google)、脸谱公司(Facebook)创始人，各公司分别靠操作系统、搜索引擎和社交网络起家，而这些人也成为商界巨头。", "显然，照抄成功的样板比去做些新的东西要容易。把已经知道怎么去做的事情做上再多遍，也不过是把 1 变成 n，或者说只是去添加很多类似的东西。而当我们发明创造新的事物时，发生的是从 0 到 1 的转变。发明创造的举动是独一无二的，正如我们刚才说的，这一个时刻不会再现，而发明创造的结果是我们的世界多出了陌生而新鲜的事物。", "注：一旦某一发明创造完成了，这事物也就相应的诞生了，你不可能再次去发明创造一个已经存在的事物。", "创新很难，但如果我们不在这方面加大投入，咱们美国的公司们迟早都会死翘翘，就算今天挣再多钱也一样。那我们是不是把现有的事业做到极致，就能让大家一直活得滋润下去？抱歉让大家失望了，答案是结果恐怕会比 2008 年经济危机时更差。现在的“最佳实践”只不过是在死胡同里打转，最好的道路是没人走过没人开辟过的路。注", "注：现在的“最佳实践”提供的经验教训都只限于当前的胡同，而这些胡同迟早都会变成死胡同，只有开辟新的道路才能持续发展，所以最好的道路是没人走过没人开辟过的路。", "当今社会，无论是公有还是私有的组织，其运作体系都庞大又官僚，想找到一条新路简直就像是祈祷奇迹会发生一样。而事实上咱美国的生意场如果想要继续繁荣下去，恐怕得要成百上千次的奇迹才行。这听起来有点令人沮丧，但是别急，有个极其重要的事实就是：人类能显著不同于其他物种的原因，就是人类有创造奇迹的能力，不是一两个奇迹，而是许多许多。而所有这些人类创造的奇迹们，我们后来给它们专门创造了一个词，科技。", "科技之所以神奇，是因为它让我们能事半功倍，能让我们的基本能力被抬升到另一个高度。其他的动物依靠本能也能建造些东西，像水坝或蜂巢什么的，但是只有我们人类可以创造新事物和改进方法。人类决定要构建什么东西的时候，并不是按照大自然的安排，从预先定好的某个列表里面做个选择就好了，相反，人类要创造新的科技，然后去改写世界。这些观念我们常常讲给一二年级的小朋友们听，说这是基本常识，但事实上我们自己反而经常忘记这些，在现实世界里做些重复重复再重复的事情。", "《从零到一》是关于如何去组建创造新事物的公司的。这里总结了我个人的很多经验心得，其来源是我自己的经历，从最早和别人一起创立 PayPal 以及稍后的 Palantir 、直到后来作为投资人投资 Facebook 和 SpaceX 等上百家创业公司的历程。其中我注意到过有很多的模式，后面我们也会提到一些，但是这本书里不会出现所谓创业秘籍或者成功公式。讲授创业这样的课程的矛盾之处就在于，所谓的秘籍公式是不存着的，因为每次创新都应该是新颖而且独特的，连神仙圣贤也不能详细而准确的预见说，这么做那么做就能创新成功。其实要说模式，我发现的唯一最终极的模式，就是成功人士能从不为人知的角度发现价值，而他们之所以能做到这一点是因为他们考虑的更多的是基本原理，而不是盲从所谓秘籍公式。", "注：PayPal，中文品牌为“贝宝”，全球最大的在线支付平台。本翻译中对大多公司名称都采取相同原则，若其英文标识使用更为广泛，则不做中文翻译。。", "注：Palantir 是一家数据分析公司，提供一系列数据分析平台和软件，帮助企业、政府、非营利机构客户整理、分析、利用不同来源的结构化和非机构化数据。即常说的大数据。目前尚未有正式中文名称，一般译作帕兰提尔。 Palantir 一词来自奇幻小说，是指一种法器，类似水晶球，能看见远方。", "注：Facebook，创办于美国的社交网站。最初起源于哈佛大学，由马克·扎克伯格（Mark Zuckerberg）于 2004 年创建，目前是全球最大的社交网络，有 14 亿用户。2012 年美国上市，近期估值约 2000 亿美金。尚未有中国分支，但国内一般翻译称之为“脸谱”或“脸书”。", "注：SpaceX，美国太空探索技术公司。是一家由 PayPal 早期投资人埃隆·马斯克（Elon Musk）2002 年 6 月建立的美国太空运输公司。它开发了猎鹰运载火箭及“龙”（Dragon）系列的航天器，后获得 NASA 正式合同，并与 2012 年 10 月，用龙飞船将货物送到国际空间站，开启私营航天的新时代。", "注：如同前面说的，“人类用科技改变世界”这样的常识，大家都应该知道，却大多没有去遵从，而是去试图寻找捷径。更何况有更多客观规律是直接被无视了的。", "这本书源自我 2012 年在斯坦福注开授的一门课程。当代大学生们能在某一方面具有非常专业的知识技能，但是大多数学生们却没有学过怎么在广阔的现实世界中运用这些知识技能。当时我开那门课程的主要目的，就是帮学生们开拓视野、活跃思路，跳出学术院校里既定的生活轨迹，来让大家“看”到一个将由他们来创建的未来。那时候的学生里有一位，叫 BlakeMasters，课堂笔记记得非常详细，后来在校外都流传得非常广，所以我写《从零到一》时，和他一起基于当时的笔记，做了一些修订以适应更广泛的读者阅读。毕竟未来没道理说只可能出现在斯坦福，或一定出自某院校，也不一定只在硅谷。", "注：斯坦福大学，全称小利兰·斯坦福大学（Leland Stanford Junior University），坐落于美国加利福尼亚州斯坦福市的私立研究型大学，是世界顶尖大学之一，校友中有很多著名企业家和诺贝尔奖得主。大学于 1891 年创办，位于现在称为“硅谷”地区的西北方，邻近帕罗奥图市。"], "wcount": 2406}, {"icon": "1", "title": "未来的挑战", "paras": ["当我要招人的时候，我喜欢在面试时问一个问题：你有什么独特的见解，是你认为正确，但大部分人却没这么想的？“众人皆醉我独醒”，所以这个问题后续我将其译作“独醒者问题”。", "这个问题看起来挺简单的，因为它很直白。但其实很难。一方面，从知识的角度讲这题目很难，是因为能从学校学到的那些是大家都认可的。另一方面从心理的角度讲这题目很难，是因为要回答这个问题，多少得有点胆量挑战世俗的成见，或者至少做到不人云亦云。智慧的火花虽然很稀缺，但有时候有勇气比有天赋更难得。所以能在学校学到的都不是独特的，所以不是合格答案。", "通常我会得到的答案无非是以下这些：", "“我们的教育体系很糟糕，要赶紧改革”。“美国很独特”。“上帝并不存在”。", "这些答案都很差。头两个也许说的是对的，但是很多人都同意啊；第三个更是，无数人在为此辩论，双方谁都不比另一方人少，这只是选了其中一边儿而已。一个好的答案，大体结构应该是：大多数人的看法是 x，而我认为事实上 x 的对立面才是正确的。", "本章稍后我会给出一个我自己的答案。", "那么我这个有点独醒者味道的问题和未来有什么关系呢？说起“未来”，这个词儿最基本的意思，就是还没到来的所有时刻的集合。但对我们来说，未来之所以独特而重要，并不是因为它还没有到来，而是因为它和今天我们所知所在的世界有所不同。从这个角度讲，如果在接下来一百年之内我们的世界都会没什么变化，那未来指的其实就应该是一百年之后。而如果接下来十来年世界就会发生重大变化，那其实未来就是指日可待的。没人可以准确的预见未来，但是我们知道两点：一是未来与现状不同；二是未来是从今天的世界发展而来。那么其实对于我们刚才说的我那个独醒者问题，大多数人的那些不合格的答案，充其量只是从不同的角度看待当今世界，而那些好的答案，则能让我们站在尽量近的位置去探察未来。", "从零到一：进步的未来", "当我们思考未来的时候，我们希望未来是有所发展进步的。而发展进步的方式可以概括为两种。横向的发展，或者说广度的进步，是指复制当前可行的事物，把 1 变成 n。横向的发展比较容易想象，因为我们已经知道这事物是什么样子的。纵向的发展，或者说深度的进步，则是指去做新的事物，把 0 变成1。纵向的发展就比较难以想象了，因为这要做的是其他人都从来没做过的事情。如果你拿到了一台打字机，你照葫芦画瓢做了 100 台，你进行的是横向的发展；而如果你拿到了这台打字机后，又给它另外制作了一套文字处理器注，那你做的就是纵向的发展。", "注：个人电脑普及之前，老式的键盘打字机必须一个字母一个字母的输入，没有编辑和排版功能。而早期的文字处理器则是另外一台设备，和打字机联合使用，能帮助人们在打字时进行基础文本编辑如复制黏贴，和调整字体等简单排版功能。后来个人电脑普及之后，文字处理器则不再有单独的硬件，其功能由电脑软件完成。", {"img": "p1-1", "cap": "图（第1章）"}, "宏观上讲，有一个单词可以用来描述横向发展，就是“全球化”，把在某处可行的经验模式推广到所有的地方去实施。中国的发展就是全球化的典范，它的 20 年发展计划就是变成今天的美国。中国人很直白的把发达国家的好东西全部照搬过来，从 19 世纪的铁路，20 世纪的空调，乃至整个城市。这的确可能少走几步路，比如不用铺固定电话的线路就能直接上移动通信，但这只是全盘复制。", "而描述纵向发展的，也有一个单词，就是“科技”。最近十几年信息科技的飞速发展，使得硅谷成为广义上的“科技”之都。不过其实并没有理由把科技只限定在计算机领域，正确的理解应当是说，任何新颖并且更好的方法都能被称之为科技。", {"img": "p1-2", "cap": "图（第1章）"}, "全球化或者科技，因为是两种不同的发展方向，所以既可能同时存在，也可以只有其一，或者二者都不在进行中。例如 1815 到 1914 年期间，科技发展和全球化都很迅猛；从第一次世界大战到基辛格 1971访华之间的时代，则科技继续保持高速发展，但是全球化进展迟缓；1971 年之后，全球化持续高速发展，而科技进步成果寥寥，主要都集中在计算机科技方面。", "注：1815 年拿破仑战败，到 1914 年第一次世界大战爆发之间，欧洲和美洲都没有重大战争，如作者所说，是一个各方面发展的高峰期。", "注：亨利·阿尔弗雷德·基辛格，Henry Alfred Kissinger，美国著名外交家、国际问题专家，美国前国务卿。他是德国犹太人后裔，1923 年生于德国费尔特市，后由于纳粹的迫害，1938 年移居美国，1943年入美国籍。原美国国家安全顾问（美国总统国家安全事务助理），后担任尼克松政府的国务卿并在水门事件之后继续在福特政府中担任此职。作为一位现实政治的支持者，1969 年到 1977 年之间，基辛格在美国外交政策中发挥了主导作用，并在中美建交中扮演了极为重要的角色。曾与越南人黎德寿一同获得 1973 年诺贝尔和平奖。当今全球化的发展，让人们觉得在将来的若干年间，世界会变得更加融合和相互类似。甚至我们日常的一些措辞都好像说科技发展的尽头已经到达了：瞧，我们把世界分为所谓发达国家和发展中国家，听起来发达国家是已经到达了可发展的极限，而比较贫穷的发展中国家要做的就是尽力追赶上去。但我不认为真是这样。我对自己之前那个独醒者问题的回答就是，大多数人认为世界的未来将由全球化的进程来定义，但实际情况是科技对未来更加重要。如果没有科技的进步，那当中国能源产量翻番的时候，他们的大气污染排放也会翻番；如果印度上亿的家庭也都按当今美国家庭的方式生活——假设只用现在已有的工具的话——那注定会带来环境灾难。", "用旧的方法就想去在全球都创造财富，那结果的只能是带来毁灭而不是富足。在资源有限的世界里，没有新科技的支撑，全球化是不可持续发展的。", "新科技可从来都不是从石头里自动蹦出来的。我们的远祖们生活的社会一成不变，而且总和为零，就是说成功意味着要能从别人那儿抢来东西。他们很少能开发出新的财富来源，并且在相当长的时间里，因为产能不足，普通人都只能在严酷的生活条件下挣扎着求生存。然后过了大概一万年，我们的祖先磕磕碰碰的从最原始的农业，发展到了中世纪的风车，到 16 世纪还有了观察天文的星盘。然后嘭的一下，1760 年左右，蒸汽机出现了，随之而来的科技进步如雨后春笋一般层出不穷，直延续到 1970 年的摩登时代。所以我们现在能够享受到先祖们做梦也想不到的好日子。", "注：“零和”，“Zero Sum”。博弈论和经济理论中的一个词语，描述特定的活动中，一方的收益必定来自其他方的损失，故而总体的收益总是保持为零。", "但是我们的父辈和祖辈们却是例外，在他们曾经的期待中，当今的日子要更加美好许多，因为直到1960 年代末期，他们都还认为科技的发展还会继续高歌猛进。他们期待着一周只用上四天班，期待着能源会便宜到不用计量，还期待着到月球上去度假。可惜这些都没能实现。智能手机让我们不大注意身边周遭的事物了，所以我们也没发现其实身边的很多事物都陈旧的出奇：只有计算机和通讯在上世纪中期之后有巨大的发展。倒不是说我们的长辈们对美好的未来的那些期许有什么问题，只是说未来这事儿不会自动发生。所以当今我们的挑战就是，展望并且创造新的科技，来使 21 世纪比 20 世纪更加和平和繁荣。", "注：1969 年美国人就登月了。而当今你身边是否有很多“百年品牌”“历史味道”？除了计算机和通讯相关的产品，你身边有什么是你父母所想象不到的？对美国人来说，甚至爷爷奶奶辈们年轻时过的生活都和现在差不多，除了计算机和通讯方面。", "创业思考", "科技险中求。新的科技，往往来自顶着风险的创业。先看看政界的开国元勋们，还有科技界的英国皇家学会，以及商界的飞兆半导体创始的“八叛徒” ，因为相同的使命感，人们凝聚成为一些小团体，然后一起推动了世界的进步。“小团体”才能成功的原因，简单说其实有点消极，不过就是因为大组织很难推动创新，而单枪匹马又搞不定。官僚体系行动迟缓，既得利益者遮遮掩掩还不愿冒险。", "在机能极度失效的单位里，想要事业发展的好，与其去踏踏实实做事，还不如摆好姿态汇报一下哪些活儿就快搞定了（要是你现在的单位就是这样，赶紧走人吧。）而在另一个极端情况下，孤独的天才可以独自完成经典的文学艺术作品，但绝对无法独立支撑起一个产业。所以创业要想能运作下去的原理之一，就是你既需要其他人一起来完成工作，但是也要控制规模，来保证这事业能真的运转下去。", "（注：Fairchild Semiconductor，飞兆半导体公司，或称仙童半导体，50 年代创立，开拓了基于硅的集成电路产业。该公司的八位创始人从之前的单位辞职时被称为“八叛徒”。而在成功创立飞兆之后，他们又陆续离开并分别创立了英特尔（INTEL）和超微半导体（AMD）等芯片巨头。而提出“摩尔定律”的摩尔，也是八个人之一。这一批公司和集成电路产业的发展使得“硅谷”得以成名，所以这八个人故事也可以说是就是硅谷的发展历程。只要是能搞定就行，至于是谁做的？老板不关心的。人浮于事。）", "那最后再从积极的角度来下个定义，创业就是怀着对未来的憧憬，召集一群肯陪你冒险的人一起前进，去构建这个不一样的未来。而这些人就是你的创业团队。新公司最有力的优势就是新思想，而对小的团体来说，比灵巧更重要的优势就是，只有小团体才能提供空间让人思考。这本书要说的，就是那些打算有所创新的业务团体，想要成功就必须提出、并回答的一系列问题，所以接下来的，并不是一本手册，或者一系列参考知识点，而是一些思考练习。因为这正是创业必须要做的事情：质疑既有的想法，从一张白纸开始，思考、规划你的事业。"], "wcount": 3865}, {"icon": "2", "title": "像 1999 年一样开趴", "paras": ["注：“趴”是英语“Party”的谐音，原指聚会，此处也指公司各种活动及庆功会。", "我们的那个独醒者问题——你有什么独特的真知灼见别人却不认同的？——很难正面回答。那我们不妨先从一个分解出来的基本问题开始，这样会容易一些：大多数人都认可什么？“疯狂对于个体，只是相对罕见的事情——而国体、政党、民族、时代的疯狂，那就是规则”，尼采注说的（在他自己疯掉以前。）如果你能发现大众普遍接受的事儿里面其实有虚妄之处，那你就能作为独醒者，揭开其背后隐藏的真相。", "注：弗里德里希·威廉·尼采（Friedrich Wilhelm Nietzsche，1844～ 1900）德国著名哲学家。1889 年精神崩溃。主要著作有：《权利意志》 《悲剧的诞生》《不合时宜的考察》《查拉图斯特拉如是说》《希腊悲剧时代的哲学》《论道德的谱系》等。", "先来看一个非常基本的命题：公司存在的目的是为了赚钱，而不是赔钱。对任何会正常思考的人，这一点都是显而易见的。但是在 1990 年代末期，这一点可就不是那么“显然”了，在当时，无论赔进去多少钱，都会被描述成对美好未来的必要投资。在当时，网站页面的浏览数量，已经被接受成为最权威最具前瞻性的财务指标，比最基本的利润数据还要靠谱，这种做法被当时的“新经济”接受成为了普遍的共识。", "而类似这种普遍的共识，只有到后来回顾历史的时候，才能被发现是武断而错误的；当这种共识崩塌的时候，我们会将之称为“泡沫”。但是被泡沫扭曲的一切，并不会在泡沫破灭的那一刻就恢复原样。90年代末期的互联网狂潮是1929 年经济大危机以来最大的泡沫，它破灭后给了人们的教训，决定、并且扭曲了如今人们对科技的想法。想要思路清晰，第一步我们就应该先反省一下，我们对于过去发生的事情，是否曾经做过认真的思考。", "90 年代简史", "对 90 年代的印象不错。我们感觉那是繁荣昌盛，乐观向上的十年，只是结尾的时候互联网泡沫起来了又破掉了。其实，那些年并不像我们的怀旧思绪刻画的那么美好。很长时间以来，我们都只记住了最后18 个月的.com 狂潮，却忘了那个年代更大的纵深全景。", "注：互联网泡沫的另一个说法。当时互联网产业是以各种网站为代表的，商用网站的域名一般都是", "以“.com”结尾的，故这里以.com指代互联网产业。", "90 年代，从 89 年 11 月柏林墙倒塌带来的欢呼雀跃开始。好景不长。90 年代中期，美国经济陷入衰退。技术上说，经济 91 年 3 月其实就已触底，但是复苏得很慢，失业率持续攀升，直到92 年 7 月。制造业则根本没有完全反弹到位。向服务型经济转变的过程漫长而痛苦。", "1992 年到 1994 年底，总体上是个萎靡的阶段。有线电视里成天播放的是美军大兵死在摩加迪沙注画面。就业机会流向墨西哥更深化了大家对全球化和美国竞争力的担忧。在 92 年的普选里，这股悲观情绪的暗流把时任第 41 任美国总统的老布什给拉下了台，并且给罗斯·佩罗（Ross Perot）赢得了近20%的选票，这是自 1912 年西奥多·罗斯福之后“第三党” 注候选人的最好表现了。而在文化上推崇涅槃乐队、垃圾摇滚、乃至海洛因的年代，反映出的也决不会是希望和信心。", "注：索马里首都。美军 1993 年的军事行动在此遭遇挫败。注：美国将除民主党共和党两大党之外的其他党派的统称为“第三党”。", "那时候硅谷也很低迷，日本似乎就要赢得半导体之战了。而互联网还没有兴起，一方面因为直到 92 年底相关技术才普遍被允许商用，另一方面也因为当时没有好用的网页浏览器。1985 年我进斯坦福读书的时候，经济学才是最热门的专业，可不是什么计算机科学。学校里大部分人都认为，科技类专业真是太冷门了，换句话说就是土掉渣了。", "直到互联网改变了一切。Mosaic 浏览器，1993 年 11 月正式发布，让普通人也能上网了。后来 Mosaic变成了网景公司，在 1994 年发布了领航员（Navigator）浏览器。这一浏览器迅速被广泛采纳——1995年 1 月起，12 个月内从占 20%的浏览器市场份额扩大到了 80%——所以网景公司能在 95 年 8 月，在还没有盈利的情况下，就上市了。接下来的 5 个月里，网景的股票从 28 美元涨到了 174 美元每股。其他科技公司也在纷纷开花结果。96 年 4 月雅虎公司上市时估值为 8.48 亿美元，之后 97 年 5 月亚马逊是4.38亿美元。到 98 年春天的时候，每家公司的股价都翻了两番。有质疑者认为，相对于其他的非互联网企业，这样的估值和实际营收相比过高了。显而易见，当时的市场已经疯了。", "注：互联网早已存在，但是在民间的运用长期局限在院校和专业人士范围，因为一般人谁搞得明白那些Telnet/FTP 命令呢？直到文中所述的浏览器的出现，“上网”冲浪才真正开始在普通人中迅速普及，但是实际上，网页浏览所使用的 Web 和 Http 只是互联网的一种应用方式。", "注：领航员，Navigator，又称导航者，是一种浏览器软件，由网景公司发布。网景公司，1994 年成立于美国加利福利亚州山景城，初期的主要开发人员来自之前开发 Mosaic 的团队，后于 1999 年被美国在线（AOL）收购。", "这一结论真的很好理解，可是却基本上被抛在了一边。96 年 12 月——在泡沫真正破灭前三年多——时任美联储主席艾伦格林斯潘（Alan Greenspan）就曾警告说“非理性繁荣”会“过度拔高资产价值”。那时科技投资者们都在一片繁荣中欢欣鼓舞，但却都没看明白他们自己当时其实是多么的非理性。毕竟当时世界其他地方的发展都没那么顺利，所以这一点被轻易无视了。", "1997 年 7 月，东南亚经济危机爆发。裙带资本主义和巨额外债把泰国、印度尼西亚、韩国的经济都给打趴下了。然后卢布危机 98 年 8 月紧接而来，原因是连年的财政亏空使俄罗斯应接不暇，政府宣布货币贬值、延期国债，结果却引发了危机。美国投资者们也非常紧张，因为那个国家有上万枚核弹头，却没钱了，结果道琼斯工业平均指数也在短短几天里跳水了 10%还多。人们的担心是有道理的，卢布危机引起了一系列的连锁反应，把著名的长期资本管理公司（LTCM, Long Term Capital Management）给放倒了。长期资本管理公司运作高杠杆对冲基金，结果受危机影响，98 年下半年净资产损失了 46 亿美元，而且还有过千亿的债券要支付。为了避免导致系统性灾难，美联储只得斥巨资紧急援助，并且削减了贷款利率。", "欧洲也没好过到哪儿去。欧元是在 1999 年1 月顶着巨大的质疑和冷漠发布的，在上市交易的第一天升到了 1.19 美元，但是接下来两年内贬值到 0.83 美元。到 2000 年中，七国集团的央行只得再动用数十亿美元的资金来支撑它。", "所以我们应该要看到，从 1998 年 9 月开始的短命.com 狂潮，其背后的世界就是这么一幅样子，看起来别的什么都行不通了。旧经济体系无法应对全球化带来的挑战。如果想要未来过得更好，就得找条能行得通的新路才行，而且必须要是条坦荡的大道。所以这些间接的证据表明，基于互联网的新经济，可能是唯一可行的救命稻草。", "狂潮：1998 年 9 月——2000 年 3 月", ".com 狂潮猛烈而短暂，从 98 年 9 月到2000 年 3 月，共持续了 18 个月。那就是一场硅谷淘金热，到处都是钱，到处都是兴高采烈的人，不过大多都很草莽。每周，得有好几十场最豪华的“发布趴” ，都是来自各种初创公司的（而“着陆趴” 则很少见。）这些纸面上的百万富翁动不动就搞出上千美元的饭局账单，然后会打算去用他们的创业公司的股份来支付——有的时候还真做到了。大批的人员离开原本收入不错的岗位，加入到创业的行列，或者进入到创业公司。我认识一个当时 40 来岁的研究生，在 99年的时候开着 6 家不同的公司。（通常 40 来岁的研究生就够怪的了，同时还开着半打的公司就更是疯了，但是在 90 年代末期，人们就偏偏能相信这种组合能够成功。）大家原本应当都知道这狂潮不能持久，但是那些最“成功”的公司似乎引入了一种反商业模式，就是要发展必须要先烧够钱。既然舞曲还在继续播放，我们就不能责备那些还在跳舞的人：想想看当时只要在你名字后面加个“.com”，你的身价就能一夜翻倍，那当时的种种非理性现象也是合乎情理的。", "注：“发布趴” （Launch Party）是公司为宣传公司、产品发布或庆祝融资等举办的社交聚会，而“着陆趴”（Landing Party）是指公司运作开始稳定或产品运营开始有稳定收入时，为庆祝“成功着陆”而举办的聚会。", {"img": "p2-1", "cap": "图（第2章）"}, "PayPal 的狂潮", "1999 年末，那时候我在运营 PayPal，当时我可真是被吓坏了——倒不是因为我不相信我们的公司，而是因为看起来硅谷里其他所有人都是无论什么都敢信。那时候，放眼望去，人们都在无所顾忌的忙着开公司或者捣腾公司。有个熟人曾经告诉过我，说他是怎么怎么在自己家的起居室里进行上市规划的，而那时他甚至连公司还没成立，——而且，他还并不认为这很荒诞。在这样的环境里，理性的做事方式看起来才是怪事儿。", "至少 PayPal 有一个适度宏大的目标——这种尺度是要到泡沫破灭以后才会被视为宏大的：我们想要创造一种新的互联网支付方式来代替美元现金支付。我们的第一个产品是让人们可以从一台 PalmPilot 注转账到另一台。但是没人用这个产品，只有它被记者们评选为 1999 年十大最糟糕商业构想之一的时候才算出了名。那时候PalmPilot 还是太小众，不过电子邮件已经比较普及了，所以我们又决定要找到一个通过电子邮件来完成支付的方法。", "注：PalmPilot，Palm 公司早期的一种掌上电脑。掌上电脑也被称为个人数字助理或者 PDA（Personal DataAssistant）。", "到了 99 年秋天，我们的邮件支付产品运转良好——每个人都可以登录我们的网站轻松完成转账。但是我们的用户不够多，增长也缓慢，花费却在上升。想要让 PayPal 继续运转下去，我们至少得吸收规模达到百万量级的用户群。做广告的效率太低，不划算。预期与大银行们达成的交易也都成为了泡影。于是我们决定直接给钱让人注册。", "我们给新注册用户发 10 美金，如果他们再推荐其他人注册，我们每次再给 10 美金。这样我们一下子就得到了数十万的新用户，和指数级的增长趋势。当然，光靠这样的策略招揽用户并不能持久——当你付钱让人注册时，用户数量的指数增长同时也意味着成本花销的指数级增长。好吧，那时候硅谷里疯狂烧钱的多得是。但是我们认为我们花费的巨额成本还是理性的：一旦有了巨大的用户基数之后，PayPal 的盈利之路就很清晰很平坦，只要对客户交易收取很少量的手续费就行了。", "我们知道我们还需要更多的资金才能达到上述目标。我们也知道泡泡就要破了。我们不敢指望投资者们在危机爆发之后还能保持住对我们投资的念头，所以我们就趁着还能圈钱的时候使劲圈。2000 年 2 月16 日，《华尔街日报》注刊登了一篇文章，盛赞我们的病毒式增长，并且建议给我们估值 5 亿美元。当我们在接下来一个月融资达 1 亿美金的时候，我们的主要投资者把《华尔街日报》的这篇报道里的估值还结结实实当了真。（其他的投资者则更是急切匆忙，有个韩国的公司甚至没有经过任何初步协商，也没签任何文件，就给我们汇过来 5 百万美金。而当我想把钱退回去的时候，他们也不告诉我们该退到哪儿。）2000 年 3 月的这轮融资给我们换取到了成功所需的时间。而当我们的交易刚刚完成，互联网泡沫就破了。", "注：华尔街日报，The Wall Street Journal，是美国发行量最大的付费财经报纸，在国际上也有广泛的影响力。1889 年开始由道琼斯公司（Dow Jones& Company）于美国纽约出版，至今已有 120 多 年，是以财经报道为特色的综合性报纸，侧重金融、商业领域的报导，报导风格以严肃见长，在商业舆论中很有份量，属于美国最高端的报纸之一。", "得到的经验教训", "“他们说/两千年/零点/Party 结束，喔哦！没时间了！那我/今晚/就要开趴/狂欢，就像 1999！” ——普林斯", "注：普林斯·罗杰斯·内尔森（Prince Rogers Nelson），美国著名歌手。这句歌词出自他的歌曲《1999》，但该歌曲及同名专辑实际上是 1982 年发行的。", "纳斯达克指数在 2000 年 3 月达到峰值的5048 点，然后在 4 月中就暴跌到了 3321 点。到 2002 年 10 月以 1114 点见底的时候，整个国家都已经把市场崩盘解读为，某种意义上来说，是老天爷对 90 年代科技乐观主义的惩罚。于是，本来满怀希望的时代被打上了疯狂和贪婪的标签，然后被正式宣告：时代终结。于是人们学会了用非确定性的基础论调看待未来，任何人如果提出宏伟的计划，需要用年度来规划，而不是按季度来度量，那他就会被当成极端主义者而被赶走。全球化代替了科技，成为了未来的希望。既然 90 年代“从砖块到点击”（From Bricks to Clicks）的转变并没有像预期那样成功，那投资者们就又返回头去找砖块（房地产）和金砖（全球化）了。结果就是另一个大泡沫，只是这次是在房地产。", "注：指金砖国家，BRICs，即巴西，俄罗斯，印度和中国。后来也包括南非。", {"img": "p2-2", "cap": "图（第2章）"}, "而剩下的还在硅谷打拼的企业主们从.com泡沫的破灭学到了 4 点主要经验，直到如今仍在主导商业思想：", "1， 增量式前进", "宏大愿景催生泡沫，所以应当克制。任何宣称能做大事的人都很可疑，而想改变世界的人也应该保持低调。只有小步前进增量发展，才是唯一稳妥的发展方式。", "2， 保持精简和灵活", "所有的企业都需要精简灵活，这样才能应对意外变数。既然你无法预知你的事业发展，那再怎么计划也就是空样子，自欺欺人而已。相反，你应该多做各种尝试，遍历试错，把创业看做未知的试验。3， 在竞争中进步", "不要试图去开辟不成熟的市场。从既有的客户为出发点才能保证有切实的商机，所以你应该看看市场上其他竞争者已经被大众认可的产品，在其基础上加以改进，这才是开公司的正道。", "4， 专注产品，而非销售", "如果你的产品需要广告或者销售人员才能卖出去，那说明它不够好。科技企业主要应该专注技术产品开发，而不是如何行销。泡沫年代的广告就被证明了显然是浪费。而唯一可持续的增长模式就是病毒式增长。", "这些经验教训在创业圈里成为教条，无视它们的人注定会自作自受被老天惩罚，就像 2000年的大崩盘一样。但是，这些教条的对立面可能才真真正正是更加正确一些：", "1， 有冒险的魄力强过蝇营狗苟；", "2， 有规划，再差也比没规划强；", "3， 竞争性市场没什么利润；", "4， 行销和产品同样要讲究；", "确实，科技曾有过泡沫。90 年代后期是个自负自满、自大成狂的年代，人们都相信自己能实现从 0 到 1的跨越。结果是太少的创业者能真正的做到这一点，绝大多数都不过是说说而已。但是人们明白，必须找到新方法、新技术来使我们今后事半功倍。2000 年 3 月的股市高位，显然是非理性投资的最高峰，但不那么明显却更重要的是，这也同时是明眼人眼中的最高峰。人们那时有条件去深深的审视未来，去尝试各种可能有价值的新科技，而相信自己有能力将其实现的人们，则毅然投身其中了。", "我们仍然需要新科技，甚至还需要 1999 年那股自负又轻狂的劲头。要建立下一代的企业，我们必须抛弃互联网泡沫破灭后引入的那些陈旧教条。但这并不是说，只要反教条而行之就自然对了：机械的抗拒无法让你逃脱时代的洪流。所以，正确的做法是要问问你自己，对于商机对于创业，你的想法你的认识是怎么构成的，其中有多少是随大流？或者其中有没有对过往的错误矫枉过正的？所以，作为独醒者，最重要的不是抗拒潮流，而是独立思考，认清潮流。", "注：本章的内容多为回顾 90 年代，但是所有的故事还是围绕着作者的问题，什么是只有“独醒者”才能认识到的真相？", "整理一下本章的脉络，基本上就是以下的场景：", "大多数：90 年代是个挺好的时代。", "独醒者：不，那时候世界其实挺低迷颓废的。", "大多数：好在互联网改变了一切！", "独醒者：但有人预言了泡沫的破灭。", "大多数：我们太傻了……", "独醒者：也不是，互联网的确是当时唯一的出路。", "大多数：硅谷烧钱太多，都是骗子！", "独醒者：PayPal 不是。", "大多数：泡泡破了，我们学到了教训！", "独醒者：你们矫枉过正，我们需要新科技，需要烧钱。", "大多数：……", "独醒者：……", "（大家都自个儿再琢磨琢磨吧……）"], "wcount": 6705}, {"icon": "3", "title": "幸福的企业，各有各的幸福", "paras": ["把我们的独醒者问题放到生意场上，就相当于是问：有什么会有价值的公司还没被创建？有什么好生意还没人去做？这个问题也不是那么容易回答的，因为有可能虽然你的公司已经能大量的创造价值了，但是你的公司本身却还不算很值钱。因为单单产生价值还不够，你必须对你产生的价值能有所掌控。也就是说，有的大生意也可能是坏生意。比如说，美国的航空公司们每年要服务数百万的乘客，并且创造了数千亿美元的价值。但是 2012年，尽管当时平均每次飞行的单程票价是 178 美元，航空公司却只能赚到平均 37 美分每人次。拿他们来和谷歌比比，谷歌产生的价值要少得多了，但赚到的却要多得多。谷歌 2012 年收入了 500 亿美元（航空公司们总共收入 1600 亿），但是其中有 21%都是利润——这可是比航空业当年的利润率高出了 100 多倍！谷歌这么能挣钱，所以它现在的市值比所有航空公司加起来还高3倍。", "航空公司们相互竞争，而谷歌却一家独大。经济学家用两个简化了的模型来描述其中的差别：完全竞争和独家垄断。", "在经济学的基本课程里，“完全竞争”既是理想状态，也是缺省状态。所谓的完全竞争市场，就是供应商的供给数量和消费者的需求数量相互作用，以期达到平衡状态。在竞争市场里，所有公司千人一面，卖的产品也大同小异。因为这些公司没有能主导市场的力量，他们只能按“市场价格”销售产品，无论这由市场决定的价格是高是低，他们都只能接受。当能赚钱的时候，就会有更多的公司进入这个行业，供给就会增加，价格就会下降，先前吸引他们加入的那部分利润就又给弄没了。而如果进入这个市场的公司太多了，就会有的亏损，有的倒闭，价格就会回升到可维持的水平。在完全竞争下，从长远来看，没有公司会获得值当的收益。", "与完全竞争相反的就是独家垄断。竞争性公司只能按市场决定的价格来销售产品，而垄断企业则是占有市场的人，所以它们可以自己来决定价格。由于没有竞争，垄断企业可以通过自行决定供应量和价格，来使自己的利润最大化。", "对经济学者来说，所有的垄断都是类似的，无论其登上宝座的方法是巧取豪夺，是靠政府批文，还是靠科技创新。在这本书里，我们对非法的勾当不感兴趣，对政府的亲家也不感冒，我们整本书里说的“垄断”，都是指那些确实因为做得非常出色，以致其他公司无法取而代之的企业。谷歌就是一个好样板，它就成功的从 0 走到了 1：在互联网搜索这一块儿它独孤求败，从 21世纪之初就把微软和雅虎远远抛在了身后。", "美国人神化了竞争，认为我们能免于陷入排队买面包的社会主义就需要归功于竞争。事实上，资本主义自己也站在竞争的对立面。资本主义的根基是资本的积累，但在完全竞争下，所有的利润全被竞争消磨掉了，还积累个啥？所以企业主们要学到的就是：如果你想创造并掌控能持久的价值，就别去做那些无差别的日常生意、别去办那些个无所谓的企业。", "大家的谎言", "这世界上有多少是垄断性的？有多少是纯竞争性的？说不好，因为我们通常谈到这样的内容时总是含糊不清语焉不详。在外行看来，做各种生意的企业原理上都差不多，所以他们会感觉落到各家企业的差别其实也不会大。", {"img": "p3-1", "cap": "图（第3章）"}, "可是事实要更加二元化得多，就是说两极分化。完全竞争和独家垄断之间的差异就像一个在地狱一个在天堂，而不同行业不同产业的业态只会靠近其中一端，而不会是我们通常想象的居于中间，因此每个企业所处的地位，也是如此，两级分化。", {"img": "p3-2", "cap": "图（第3章）"}, "而含糊不清的原因，是因为所有人都自觉不自觉的倾向于把市场情况描述得对自己有利：不管是垄断者还是竞争者，都有动力来歪曲事实。", "垄断说的谎", "垄断者要通过说谎来保护他们自己。他们知道到处炫耀自己的垄断地位会招来各种审计、检查和攻击打击，树大招风嘛。因为他们非常希望他们的垄断利润可以长期逍遥下去，所以他们会尽一切所能来掩盖他们的垄断事实——通常都是通过夸大他们的（并不存在的）竞争对手的实力。", "再回到谷歌身上，来想想它是怎么谈论它的生意的。它当然不会声明自己是个垄断企业。那它是吗？这确实得看。看什么？看它到底是垄断了些什么。", "要说谷歌主要就是个搜索引擎的话，那到2014 年 5 月的时候，它占据了 68%的搜索市场份额。（在它之后两名最强的竞争对手，微软和雅虎，分别占了 19%和 10%）。如果这看起来还不够霸气，那我告诉你，牛津英语词典里已经把“Google”正式收录进去了——作为一个动词。那谁，你就别憋着气等着必应注也被收进去啦！", "注：本段的数据可能没有包括中国。", "注：Google 即谷歌的英文。收录为动词，意即“什么事不知道先Google 一下”，用“Google”来表达“上网搜索”这一动作。注：必应，“Bing”，是微软公司的搜索产品。", "不过如果要说谷歌主要是个广告公司，那就大不一样了。美国在搜索引擎上做广告的市场大概是每年170 亿美元。而整个线上广告市场是370 亿美元。再大一点，整个美国广告市场是1500 亿美元。而全球的广告则达到 4950 亿美元。所以即使谷歌拿下了整个美国的搜索引擎广告，那也不过是全球广告市场的 3.4%。从这个角度讲，谷歌也不过是这个竞技世界里的一个小玩家。", {"img": "p3-3", "cap": "图（第3章）"}, "那如果我们把谷歌形容成一个多元化的科技公司会怎么样？这看起来很有道理啊：除了搜索引擎，谷歌还做很多其他的软件产品，还有无人驾驶汽车，安卓（Android）智能手机，以及可穿戴设备。不过谷歌 95%的收入都是从搜索引擎广告来的，它的其他产品 2012 年只不过带来了 23.5 亿美元的收入，而其中科技类消费品只是其中不大起眼的一块儿。因为全球科技类消费品的市场总额是 9640 亿美元，谷歌只占了不到 0.24%——简直不值得一提，更别说垄断了。谷歌把自己定位成一家科技公司于是让它可以避免吸引过多的关注而成为众矢之的。", "竞争说的谎", "没垄断的份儿的人们则也编了个与之相反的瞎话：“这方面我们自成体系，有自己的一套”。企业主们总是倾向于往“小”里考虑竞争的范畴，但这是创业的大忌。这种致命的诱惑会让你去把想要去占领的市场描绘的非常狭隘，过于细分，这样就会感觉好像它天生就是为你准备的一样。", "注：英文原文“We’re in a league of our won”，字面意思是说在某种联赛里只有自己在玩，意指特定级别里有绝对优势。这里其实是个讽刺，因为这么说看起来不错，但其实也说明在其他条件下不行，例如在“长发少年足球联赛”里总是成绩很好，但这理论上应该是和世界杯无缘的。", "假设你打算在帕罗奥图开家英式餐馆。“还没别人在做这个”，你说的有道理。“所以我们能占领整个市场”，噢，注意，这句话只有当你指的仅限于那儿的英式餐饮的市场的时候，才是对的。当考虑到所处的市场其实是整个帕罗奥图的餐饮市场的时候，会是个什么情况？或者连周边地区的所有餐馆也都是相关市场的一部分的时候，你又是处在什么位置？", "注：帕罗奥图， Palo Alto，美国加利福尼亚州圣克拉拉县内的一座城市，位于旧金山湾区西南部，在山景城和门洛帕克市中间。由于有很多科技公司和机构，被视为是硅谷的中心。由于也毗邻斯坦福大学，所以作者可能因此在斯坦福授课时以该地举例。", "这就很难回答了吧？但是更大的问题是你内心其实根本就想回避这些问题。当你听说大多数新开的餐馆在一两年内就会关门的时候，你就会本能的想找个说法来证明你自己开的肯定会不一样。接下来你就会想方设法的再去说服其他人你自己是如何与众不同，而不是认真考虑你的方案是否行得通。这时候最好停下来，想想，看看，在帕罗奥图，英式食物到底是多少人的最爱，没准根本就没那么几个人。2001 年的时候，我和 PayPal 的同时经常到山景城的卡斯特罗大街去吃午饭。我们可以从很多馆子里慢慢选，先想好想吃什么大的类型，比如是印度菜，吃寿司，还是吃汉堡；选好以后再决定其他的因素，比如是南印度菜，还是北印度菜，是便宜点的，还是花哨点的，等等诸如此类。而与当地竞争激烈的餐饮市场形成鲜明对比的是，我们的 PayPal 公司在当时是全世界唯一的提供邮件支付系统的公司。我们雇的人比卡斯特罗大街上的餐厅们雇的人还要少，但是我们的生意比所有那些餐馆加起来还有价值得多得多。开一家新的南印度风味餐厅真的很难赚钱的。要是你无视总体的竞争态势却只关注那些无关紧要的差异化细节——比如说你觉得你家的馕特别棒，因为你奶奶有独门秘方——那你的生意肯定活不下去。注：山景城，Mountain View，或音译为芒廷维尤，是美国加利福尼亚州圣克拉拉县内的另一座城市，也是硅谷的主要组成部分，许多著名公司和机构都位于该市。", "创意产业也是一样。没有那个编剧愿意承认她的新电影的剧本只不过是把之前用过的内容拆开了揉碎了重新组合一下而已，但是，宣传的噱头往往会说“这部电影将各种激动人心的元素有机的组合起来，产生了前所未有的全新体验”。这倒也许是真的。假设她的想法是让 Jay-Z 去主演一部融合了《黑客》和《大白鲨》的影片：说唱歌手加入黑客精英团队去追捕杀死了他朋友的巨大鲨鱼。这绝对以前没拍过。好在没拍过，就像帕罗奥图没有英式餐厅一样，那都是有原因的。", "注：Jay-Z，美国最著名歌手之一，既是说唱歌手又是唱片制作人、企业家。1969 年生，本名 Shawn CoreyCarter。2014 年被《福布斯》杂志评估身价为 5 亿美金。2008 年与著名女歌手碧昂斯结婚，后育有一女。注：《黑客》，《Hacks》，1995 年美国电影。在互联网尚不普及的年代开创了黑客电影风潮，成为类型片典范。注：《大白鲨》，《Jaws》，是 1975 年美国惊悚电影，本片是史蒂文·斯皮尔伯格拍摄的经典影片之一，根据彼得·本奇利的同名小说改编。", {"img": "p3-4", "cap": "图（第3章）"}, "没垄断的人们总是夸大他们的独特之处，把自己的市场定义为多种不同市场的交集：", "英式饭菜∩餐馆里吃∩帕罗奥图", "说唱明星∩黑客∩鲨鱼", "而垄断的人们呢，则正好相反，把自己的市场描述成若干大市场的并集：", "搜索引擎∪手机∪可穿戴设备∪无人驾驶汽车", "那实际上垄断者采用的并集说法看起来是什么样子呢？来看看谷歌董事长埃里克·施密特在 2011 年美国国会听证会上的发言：", "我们面临的是极端激烈的竞争，消费者们有大量的不同渠道可以获得信息。", "或者，把这种外交辞令翻译成大白话就是：", "谷歌只不过是大池子里的一条小鱼儿，随时都可能会被整个吞下。我们不是政府要找的垄断机构。注：埃里克·施密特，Eric Emerson Schmidt，1955 年出生于美国华盛顿特区。他早期是一位电脑工程师，拥有普林斯顿大学电子电气工程师学士学位，同时有加州大学伯克利分校的计算机科学学士学位和博士学位，也是 UNIX 下词法分析器 Lex 的作者。1997 年到 2001 年在 Novell 公司任董事长兼 CEO，2001 年到 2011 年四月十年间担任谷歌公司（Google）的 CEO，之后任谷歌的执行董事长。同时他也是卡内基梅隆大学和普林斯顿大学理事会理事。", "无情的人们", "竞争性行业里的问题并不止是没有利润而已。想象一下，如果在山景城的那些餐馆里有一家由你来经营，你和广大竞争对手相比也没什么大的不同，而你要想把饭馆开下去，除了努力还应该要怎么办？显然你的东西就得够便宜，但是这样利润率也就低了，于是你付的工资也就只能够个法定最低工资。那你就会绞尽脑汁省钱，或者压榨员工血汗。所以小饭馆经常让老太太在前头张罗招呼，小孩子在后面洗碗刷盘子，就是这样来的。在餐饮行业，就算最牛的馆子也好过不到哪儿去，像米其林的评分系统这样的点评打分，让激烈竞争甚至成为一种公开的文化现象，把大厨们都快给逼疯了。（法国大厨 BernardLoiseau 就说过，“如果我的星级降低了，我就去死”。那时候他的馆子得到了米其林餐厅指南的三星级评价。后来米其林虽然没有降低他的餐厅评级，但是另一个法国餐饮指南在 2003 年把他的餐厅评级给降低了，所以他还是自杀了。）这正是充分说明了，行业里竞争性的业态，才是把人们推向了无情甚至死亡的幕后推手。", "注：米其林，Michelin，著名轮胎品牌，集团总部位于法国。集团拥有著名的米其林轮胎人形象。除生产销售轮胎之外，从一百多年前的 1900 年法国巴黎万国博览会（后称世界博览会）开始，集团创始人米其林兄弟就将各种和汽车旅行相关的信息，包括道路地图，加油站，景点，餐馆，旅馆等等信息编制成手册，称为《米其林指南/Le Guide Michelin》。因信息实用客观而大受欢迎，后来成为系列手册，在全世界广泛流行。其中关于餐馆的指南中，仅收录各地顶尖餐厅，将选中的餐厅分为 1 至 3 星，3 星为最高，并称“即使为其专门规划一次旅行也不为过” (法语原文：\"Une des meilleures tables, vaut le voyage\"。)", "而像谷歌这样的垄断企业就不一样了。因为它不用操心和任何人竞争的事情，所以它能站在更高的高度来关心自己的员工，自己的产品，甚至自己对广大世界的影响。谷歌的口号是——“不作恶”——这既是高明的品牌策略，也是成功企业的特质之一，就是说这企业的成功已经到了相当的层次，这时候遵纪守法道德高尚也不会威胁到公司的生存了。在商言商，钱，要么很重要，要么就是一切。垄断者除了赚钱之外有条件去想其他的事情，没垄断的就别想了。在完全竞争的行业里，企业只能专注于当前的收益，不可能去规划长远的未来。只有一样东西可以把企业从日复一日的角斗中解救出来：垄断利润。垄断资本主义", "那么，垄断看起来是对业内人士挺好的，那对该行业之外的人呢？这么突出的利润是不是从其他人那儿搜刮来的呢？真相是：没错，利润就是从客户的钱包里来的，垄断者的臭名声一点也不冤枉——但是，仅限于没有引入变化的世界。", "在一成不变的世界里，垄断者不过就是收租子的人。如果你拥有某个市场，你就可以操纵价格，反正别人也只能从你这里买。想想那个著名的桌游，各种卡片地契在玩家之间流转来流转去，但是整个游戏总的盘面却一直就是那样。没有说能够通过开发出新的房地产玩儿法来获得胜利的。各种资产的相对价值总是一成不变的，所以你要想赢，要做的就是尽量全买下来。", "注：这个著名的桌面游戏是指大富翁，或者又称强手棋，Monopoly，其英文就是“垄断”的意思。游戏有一个地图似的盘面，各玩家轮流丢骰子在其上行动，并决定地产的买卖，己方房产的建设升级等，而走到其他人的地产时需要付相应租金。各玩家有相同的初始资金，但是通过游戏的过程，资金和地产会在玩家间流转，直到仅一方拥有大量资产，而其他玩家破产退出时，游戏结束。", "可是我们生活的世界是充满变化的：我们可以发明创造更新更好的东西。创新性垄断通过创造新型的事物让世界更加富足，给客户们带来更加多样的选择。创新性的垄断对外界社会不仅仅是有好处而已，他们简直就是让整个社会更加强大美好的强力引擎。", "就连政府也知道这一点：所以尽管政府有部门在努力阻击垄断（进行各种反垄断诉讼和调查），但同时政府也有另一个部门在努力制造垄断（给新发明授予专利）。是不是说只要能第一个想到某个好点子，比如手机软件的某个设计，就应该从法律上给他一些保护措施，这确实还得打个问号。但是很清楚的一点是，苹果公司的垄断利润，就已经是对该公司的认可和奖励，因为这种利润是来自它的 iPhone 手机的设计、制造和营销，而不是操纵市场人为制造短缺，它使世界更加丰盈，所以这奖励就是对它所创造的新体验的认可，归根到底是它使人们总算可以买到非常好用的智能手机了，即使价格贵一些大家也乐意。", "新兴垄断企业的活力又说明了为什么老牌的垄断企业也扼杀不了创新。有苹果公司的 iOS 操作系统冲锋在前，整个移动计算迅速崛起，把微软公司在操作系统上的主导了几十年的地位给冲了个稀里哗啦。在这之前，6、70 年代 IBM 公司的硬件垄断地位就是被微软的软件垄断给取代了的。还有，AT&T 公司在差不多整个 20 世纪里都垄断着（美国的）电话业务，但是现在随便谁都能随随便便找到一大把不同运营商提供的不同手机套餐。如果垄断型行业的总体业态会倾向于阻碍进步，那我们去抵制他们就很正当。但是我们社会进步的历程却正是各个垄断行业里的垄断企业们不断后浪推前浪的过程。", "垄断会推动进步的原因，是因为一旦垄断就能坐收若干年甚至数十年的垄断利润，这可是极大的诱惑，会强力的刺激创新。那接下来垄断企业也有能力不断的投入去创新，是因为垄断利润允许它们去制定长远的计划并投资各种雄心壮志的项目，而这些事儿是陷在竞争中的企业们做梦都不敢去想的。那为啥经济学者们总是叨叨说竞争才是理想状态？这是历史遗留问题。经济学者们的数学是从 19 世纪的物理学家那儿抄来的：他们把个人和企业当做是可以互换的原子，而不是一个个独特的创造者。他们的理论描述了完全竞争下的平衡状态，是因为这种状态最容易建模，而并不意味着这是商业的最佳状态。这里我们值得复习一下物理，19 世纪的物理学家预言过一种长期的均衡状态，这种状态下所有能量平均分布，所有事物也都处于静止——也就是所谓宇宙热寂。不知道你怎么看待热力学，但这就是个很牛的比喻：生意场里，达到平衡态就是完全静止，完全静止就是死。当然，如果你所在的行业是在竞争平衡态，那你的企业死不死对世界其实也没什么影响，总有其他无差别的竞争者随时准备好了来接你的班。", "注：热寂，Heat Death，又称热死，是对宇宙终极命运的一种猜想说 法。作为一个“孤立”的系统，宇宙的总熵会随着时间的流逝而增加，而当所有物质温度达到热平衡时，宇宙的熵达到最大值，此时宇宙中的其他有效能量也已经全都转化为热能。这种状态称为热寂，而这样的宇宙中再也没有任何可以维持运动或是生命的能量存在。", "完美的均衡可以用来描述真空，宇宙的大部分都差不多是这个样子。这也可以说是很多行业或企业的特点。但是每个新事物的出现，都和这种均衡态相差很远。在抛开经济学理论的现实世界里，每个企业成功的程度，恰恰就是它能做到多少其他的企业做不到的事情。因此，垄断绝对不是病态或者异常，垄断是每个成功企业的共性和前提。", "注：真空中不会产生星星或生命。", "托尔斯泰在《安娜卡列宁娜》的开头写到：“幸福的家庭总是相似的，不幸的家庭各有各的不幸。”企业界则相反。每个幸福的公司都各不相同，各有各的法宝来解决特定的问题，从而获得了各自的垄断地位。而失败的企业却都一样，他们都没能逃脱竞争。"], "wcount": 7427}, {"icon": "4", "title": "竞争观念", "paras": ["创新型垄断，意味着能让大家都受益的新产品，并且，对其制造者还意味着可持续的收益。而竞争，则意味着大家都没钱赚，没什么有意义的差异化，以及拼了老命求生存。那为什么人们还相信竞争才是健康的？答案是因为，所谓竞争，并不只是个经济学概念，也不仅仅是人们或者企业们在市场上才要面对的小麻烦。归根到底，竞争是一种观念——于你于我都根深蒂固的观念——它充斥了整个社会，并扰乱了我们的思维。我们称颂竞争，把它奉为金科玉律，强调它的必要性；结果为了它，我们掉在自己刨的坑里了——我们竞争得越多，我们得到的就越少。", "这本是个简单明了的真相，可是我们却都被训练得将它无视了。我们的教育体系，就反映了并且强化了我们对竞争的痴迷。打分，本身就是对学生们的竞争力去做了一个明确的量化；而得高分的学生们也同时收获了文凭和地位。我们用大体相同的方法把相同的内容教授给所有的年轻人，而不去考虑他们各有什么样的天赋和喜好。那些不能在书桌前坐下来一直好好学习的学生难免会感到自己“似乎”比较差劲，而那些能出色完成作业和考试的孩子们，却只能在某个怪异的、叫“好好学习天天向上”的人造平行世界里找到自己。", "当学生们升级到能参加更高层次的竞争的时候，事情就更糟糕了。精英学子们满怀自信的不断向更高处攀登着，而竞争越到高处也越激烈，直到有一天会惨烈无情到将他们的梦想统统打碎。高等教育就是这么一场笼中之斗，高中时满怀宏大规划的年轻人们要去跟那些跟自己同样聪明的同学们热血相搏，只是为了能进入到那些传统的热门职业，比如说管理咨询或者投资银行。而为了能变成这种识时务随大流的人，学生们（和家长们）还要准备至少好几十万美金，而高昂的学费还在急速攀升，其增长速度持续超过通货膨胀。我们这么为难自己，这是何苦来呢？", "我希望我年轻时就这么问过自己。我的人生道路也曾一直按部就班，以致我的朋友在我 8 年注的纪念册上就给我预言说——非常精确地——4 年后我会在斯坦福大学念二年级。接下来在一个传统意义上成功的大学生涯之后，我考进了斯坦福法学院，然后为了赢得奖牌我就得更加拼命竞争了。", "注：大体上相当于中国国内的初中三年级，之后就要上高中了。", "对所有法学院的学生来讲，最高奖励其实非常的明确：就是能成为最高法院的大法官助理，因为每年只有十几个学生能从好几万个法学院学生中脱颖而出得到这样的机会。我在联邦上诉法院当了一年书记员之后，得到了面试机会，见到了肯尼迪大法官和斯卡利亚大法官。面谈进行得不错。我的最终胜利已经近在咫尺了。要是我当上了大法官的助理，我想，我这一辈子就不用多说了。但是我没有。那一刻，我彻底被废了。", "注：美国最高法院现有一名首席大法官和八名大法官，首席大法官最多可聘请 5 名法律助理，而其他大法官最多 4 名，因而的确竞争激烈。大法官是终生任命，到年限也可退休。但是助理不是，而且由于其稀缺性，一般当了一两年大法官助理之后就会被各律师事务所竞相聘请，之后收入甚至远超大法官。", "时间再往后翻，到了 2004 年，在我卖了我们一起创办的 PayPal 之后，我碰见了当年法学院的一个老朋友，他曾经帮我准备过那次没成功的大法官助理面试。我们差不多有十年没联系过了。他的第一句话可不是“最近怎么样”或者", "“时间过得真快啊”什么的，你们猜怎么着？结果他咧着嘴笑着问我：“嘿，彼得，你没当上法官助理挺高兴的吧？”虽然有点事后诸葛亮，但是我们都知道，如果在那次终极竞赛里我成功了，我的人生只怕反而会转上一条比较差的轨道。要是我真的去了最高法院，我这辈子可能都会花在录取证言或者给其他人起草商业协议上，而不会创造任何新的事物。很难说清楚这两条路之间具体会有多少差别，但是里面的机会成本真的是无比巨大。就像所有得到过罗德奖学金的人，他们在过去都曾经有过伟大的未来。注：罗德奖学金，Rhodes Scholarships，世界级奖学金，被誉为本科生的诺贝尔奖，由英国矿业大亨塞西尔·罗德兹在 1902 年创设，专门资助外国学生前往牛津大学研习。得奖者又被称为“罗德学者”（RhodesScholars），美国前总统比尔克林顿也是其中之一。", "注：过去曾有未来。言外之意，就是他们曾经很出类拔萃，所以才能拿奖，应该有着“伟大的未来”，但之后却大部分沦为了相对平凡的人，没有能做出值得称道的贡献。", "战争与和平", "教授们总是爱把学术界的互掐给轻描淡写，而经理人们则总乐于把商场比作战场。MBA（工商管理硕士）学生们更是随身携带克劳塞维茨和孙子的著作。战争词汇，也其实早就作为比喻侵占了我们的日常商务用语，比如我们借助猎头来组建了一只销售大军，让我们能够占领垄断市场，取得决定性战役的胜利注。不过其实真正像打仗的，并不是商场，而是竞争：看起来似乎总是无法避免，说起来总是鼓吹勇往直前，但其实归根结底，总是充斥着大肆的破坏。", "注：卡尔·菲利普·戈特弗里德·冯·克劳塞维茨（1780～1831 年），Carl Philipp Gottfried VonClausewitz，德国军事理论家和军事历史学家，是近代军事战略学的奠基人，西方军事思想的代表，被称作西方兵圣，著有兵学巨著《战争论/Vom Kriege（德）/On War （英）》。", "注：孙武（约公元前 545 年—公元前 470 年），字长卿，齐国乐安人，春秋时期著名的军事家、政治家，尊称兵圣。后人尊称其为孙子、孙武子、百世兵家之师、东方兵学的鼻祖。著有《孙子兵法》十三篇，为后世兵法家所推崇，被誉为“兵学圣典”，置于《武经七书》之首。近年被译为多国文字，成为国际间最著名的兵学典范之书，英文译作《The Art of War》。", "注：此处译文使用的战争相关词语，其英语原文分别为 headhunters,force, captive, make a killing，也都与战争/战斗有关。", "人们为什么要相互争斗？马克思和莎士比亚提供了两种不同的模式来帮我们理解绝大部分冲突的起因。按照马克思的说法，人们争斗是因为他们不同。无产阶级和资产阶级的斗争源自二者完全不同的观点和目标（之所以不同，按马克思的说法，是由于差异巨大的物质环境基础）。差异越大，冲突就越大。和莎士比亚的说法对照一下，对比鲜明：莎士比亚认为参战的各方多少有些相似。也不知道他们为什么要争斗，因为其实他们没什么好争的东西。想想《罗密欧与朱丽叶》的开头，说“两个家族，同样尊贵体面”。这两个家族挺像的，但他们相互憎恨。当仇恨越积越深的时候，他们反而变得更相似了。终于到了后来，他们也记不得最初为什么开战了。", "至少在商场上，还是莎士比亚更有先见之明。在公司内部，人们会为了职业发展而紧盯竞争对手。而公司之间，也相互时时紧盯着竞争对手在市场上的一举一动。在所有的人间悲剧里，人们的目光都没放在关键的地方，却全都聚焦在竞争对手身上了。", "我们把莎翁的套路放到现实世界里来看看。想象一下，一出叫做《盖茨和施密特》戏，改变自《罗密欧和朱丽叶》。蒙太古家族就是微软，凯普莱特就是谷歌。两个伟大的家族，都由业内精英领导，注定会因为如此相似而发生冲突的。", "注：蒙太古是罗密欧的家族姓氏，凯普莱特则是朱丽叶的家族姓氏。", "和所有令人感慨的悲剧一样，冲突总是在当时看起来没有办法不发生的。但其实，这是完全可以避免的。这些家族来自完全不同的地方，蒙太古开发计算机操作系统和办公软件，凯普莱特则在开发搜索引擎。他们有什么好争的呢？", "很多，看起来很多。初创的时候，两个家族很高兴的互不干涉各自发展，但是当他们发展壮大了之后，他们就开始较劲了。蒙太古时时惦记着凯普莱特处处死盯着蒙太古。结果呢？Windows 系统遇上了ChromeOS 系统，必应搜索对上了谷歌搜索，Explorer 浏览器顶住了Chrome 浏览器，Office 工具对战Docs 工具，Surface 设备和 Nexus 设备战成一团。", "注：此处捉对厮杀的分别都是微软公司和谷歌公司的产品。", "就像两个家族的争斗牺牲了两家的孩子们一样，微软和谷歌的争斗牺牲了他们的主导地位：苹果公司冒了出来把市场都给抢了过去。2013 年1 月，苹果公司的市值是 5000 亿美元，微软和谷歌加起来也才4670 亿美元。而在仅仅 3 年以前，微软和谷歌各自都比苹果要有价值得多。战争可真是场成本高昂的买卖啊！", "参与对抗的结果是我们过于关注过去的机会，只知道重复过去成功的经验。想想最近火起来的手机信用卡刷卡器。2010 年 10 月，一家叫 Square 的创业公司发布了一款小小的白色方形产品，让大家可以在iPhone 上刷信用卡收钱。这是可以直接在手机上接受支付的第一个好方法。模仿者们立即展开行动了。一家名叫 NetSecure 的加拿大公司发布了自己的刷卡器，是半月形的。接着 Intuit 公司又用圆柱形刷卡器来参加这场几何图形大会战。2012 年 3 月，eBay 旗下的 PayPal 也跟风推出了自己的刷卡器，这次是三角形的——这对 Square 真是当头一棒啊，显然三条边要比四条边要简洁多了！怎么有种感觉这场莎翁式传奇一时半会儿结束不了呢？估计得等到聪明的猿人们把能想到的形状都用过了才能算完吧。注：刷卡器主要是能让手机能像 POS 终端机一样接受对方的信用卡刷卡支付。这样的产品现在中国的也有数十种之多。", {"img": "z4-1", "cap": "图4.1"}, "这种模仿性竞争带来的危害，可以部分说明为什么那些多少有些社交障碍的人，比如有埃斯博各综合症的人，在硅谷目前看起来比较处于有利地位。因为如果你对小道消息大八卦什么的不敏感，那就不大会去跟风做些周边其他人都在做的事情。那么如果你有兴趣去学点什么或者写个电脑程序什么的，你也不怎么会惧怕孤军奋战，结果反而可以精通成为高手。然后当你想把这些本事施展出来再做点什么的时候，你也不会像其他人那么轻易的放弃自己的信念：这就可以让你摆脱那些为了眼前利益而混战的人群。", "竞争也会让人们产生幻觉，去试图抓住海市蜃楼般的“机遇”。这“狂热 90”版的蜃楼机遇之一，就是网上宠物商店间的一场大乱战，参战的有 Pets.com，PetStore.com，Petopia.com，还有其他好几十家。每一家公司都沉迷于战胜对手，因为他们都没有什么本质性的差异化可以去关注的。在纠结于战术性问题——例如，谁家能给狗狗用的磨牙玩具报个最低价？谁能在超级碗打出最好的广告？——的时候，这些公司都忽视了一个更宽泛的问题：网上宠物用品市场是不是个应该去争的地方。胜利当然要好过失败，但是如果这仗根本就不该打，那结果其实双方都是输家。在.com 泡沫破灭后Pet.com 也关门了，随之消散的还有 3 亿美元的投资。", "注：超级碗（Super Bowl），又称超级杯，是美国国家美式足球联盟（也称为国家橄榄球联盟，NationalFootball League，NFL）的年度冠军赛，一般在每年 1 月最后一个或 2 月第一个星期天举行，那一天称为超级碗星期天（Super Bowl Sunday）。橄榄球是美国最受欢迎的运动，因而超级碗多年来都是全美收视率最高的电视节目，超级碗星期天也逐渐成为一个非官方的全国性节日。所以超级碗中出现的广告有极大影响力，当然费用也最为昂贵。", "有些时候，对手会故意搞怪来让你分神。我们来说说拉里·埃里森（Larry Ellison）和汤姆·西贝尔（Tom Siebel）之间的莎翁剧情。埃里森是甲骨文(Oracle)公司注的创办者和 CEO（首席执行官），西贝尔本来是甲骨文公司的顶尖销售人员，也是埃里森罩着的，后来 1993 年自己离开去创立了西贝尔系统公司（Siebel Systems）。", "埃里森大为光火，觉得西贝尔背叛了他，而西贝尔则很厌恶总是呆在前老板的阴影下。这两个人其实基本上是同类——芝加哥人、作风强硬、热爱营销、憎恨失败——所以他们的仇很深。埃里森和西贝尔在整个 90 年代后期都在相互拆台。有那么一次，埃里森给西贝尔的公司总部送去了整卡车的冰激凌三明治，想劝西贝尔的员工跳槽。包装？哦对了，冰激凌包装上还写着：“夏天来了，甲骨文也来了，来让你的事业和阳光一样灿烂吧！”", "注：甲骨文公司，Oracle Cooperation。西贝尔系统公司，Siebel Systems Inc.两者都是软件公司，主要开发企业级软件，包括数据库系统，企业资源计划(ERP)，客户关系管理系统(CRM)等等。甲骨文公司在企业级软件市场中占有领先地位。", "比较奇怪的是，甲骨文是在有意的积攒敌人。埃里森的理论是，有敌人总是好的，只要它强弱适中：要有点强大，看起来有点威胁（这样才能让员工有干劲），但是不要真的强大到威胁公司发展。所以埃里森估计在 1996 年大大的兴奋了一下，因为有个小公司，做数据库的，叫 Informix，在甲骨文公司位于红木滩的总部旁边立了一块告示牌，写着：“注意：恐龙出没”。然后在向北的 101 号高速上 Informix 又立了另一块牌子，说：“您刚刚越过了红木滩，我们也是”。", "注：红木滩，Redwood Shores，位于美国加利福利亚州，是甲骨文总部所在地。Informix 公司第一块牌子讽刺甲骨文公司及产品太古老，第二块则暗示自己的产品比甲骨文的优越。", "甲骨文于是也回敬了一块告示牌，暗示说Informix 的软件比蜗牛还慢。然后时任 Informix的 CEO 的菲尔·怀特把这个事儿搞成了个人恩怨。当时怀特听说拉里·埃里森喜欢日本武士文化，就又立了一块告示牌儿，画着甲骨文公司的标志和一把断了的武士刀。这么做其实就根本不是把甲骨文公司作为目标了，也更不是给普通大众看的，而根本就是对埃里森个人的人身攻击。不过也许怀特正是在这样的事情上操了太多的心，当他忙着搞这些告示牌儿的时候，Informix 曝出了大规模的财务丑闻，怀特自己也因为证券欺诈的罪名进了联邦监狱。", "如果你无法打败对手，那最好考虑和他联手。1998 年我和麦克斯·列夫琴合作创立的公司叫Confinity，后来在 1999 年我们推出了 PayPal产品。那时候埃隆·马斯克的 X.com 紧跟着我们的脚步，他公司的地址也是在帕罗奥图的学院大道上，离我们只有四个街区，产品的功能特性更是跟我们的针锋相对。到了 1999 年末，我们两家已经陷入了全面战争。我们 PayPal 这边的人们很多都每周工作了100 个小时以上。显然这种工作状态的成果不会高，但是本来这么做就不是为了出什么客观的成果，而就是为了打败 X.com。我们的一个工程师甚至真的为了这个设计了一颗炸弹，好在当他开会展示炸弹设计图的时候，其他人头脑还算冷静，劝他打消了这个念头，说他只是极度缺乏睡眠。", "注：麦克斯·列夫琴，Max Levchin，1975 年出生于前苏联的基辅（现属乌克兰），1991 年在美国申请避难。1998 年于彼得·蒂尔一起创建 PayPal 时担任首席技术官（CTO, Chief Technology Officer），后被认为是“PayPal 帮”的军师。", "注：埃隆·马斯克（Elon Musk），1971 年 6 月 28 日出生于南非，18岁时移民加拿大。除了 Paypal 外，还是SpaceX 太空探索技术公司、环保跑车公司特斯拉（Tesla）以及 SolarCity 公司的创始人、CEO，其 SpaceX 公司的“龙”飞船开启了太空运输的私人商用化时代，而特斯拉的电动跑车也已风靡全球。", "但到了 2000 年 2 月的时候，埃隆和我都感到了深深的不安，其中对迅速膨胀的网络泡沫的担忧，远远超过了对彼此的不爽，因为我们感到如果再继续打下去，还没等我们俩分出胜负，经济危机就会出现并且把我们俩都打垮。所以在 3月初，我们找了个中立的场合——离我们俩公司距离对等的一个咖啡馆——讨论了公司的合并，各占 50%的份额。化干戈为玉帛其实并不那么容易，但是只要能避免更大的危机，那它就是最好的决定。作为一个联合团队，我们后来安然度过了.com 的破灭风潮，并发展出了非常成功的事业。", "注：前面说到的其他公司，Siebel 后来被甲骨文公司收购，Informix 后来则被 IBM（国际商用机器公司）收购。", "有的时候你确实不得不开战。如果是这样，那你还就得去打，而且要打赢。没有什么中间地带：要么就不打，彻底别动手；要打就打赢，一旦动手就得全力出击以争取速战速决。", "但是这样的建议人们往往无法遵从，因为尊严和荣誉会来从中作梗。来看看哈姆雷特：", "注：哈姆雷特，出自莎士比亚同名戏剧《哈姆雷特》，又译作《王子复仇记》。《哈姆雷特》是莎士比亚戏剧中最有影响力的一部，是其四大悲剧作品之首。", "他仗着勃勃之勇气与天命之雄心，罔顾不测之凶险，", "拼着血肉之躯奋然和命运、死神与危机挑战，", "这全为了小小一块弹丸之地！", "真正的伟大，并不只是肯为轰轰烈烈之大事奋斗 而是肯为区区草芥力争一份荣耀。", "注：此段译文来自互联网，英文原文是：Exposing what is mortal and unsure To all that fortune, death anddanger dare, Even for an egg-shell. Rightly to be great Is not to stir without great argument, But greatly tofind quarrel in a straw， When honour's at the stake.", "对哈姆雷特来说，伟大意味着肯为了微薄如蛋壳的理由去战斗：每个人都会为了重要的事情去奋战，只有真正的英雄会把个人荣誉看得如此之重要，以致于可以为了不那么重要的事情去战斗。这种扭曲的罗辑也是人类天性的一部分，不过要是放在商场上，就是灾难。当然如果你能看出来竞争是一股破坏力，而并不是一个指向价值的路标，那你就已经比大多数人要理智得多了。下一章就让我们来探讨如何用清醒的头脑去造就垄断性的事业。"], "wcount": 7273}, {"icon": "5", "title": "后发优势", "paras": ["逃脱了竞争，就会让你拥有垄断地位，但是只有能在未来持续发展，垄断里才会发展出伟大的企业。比较一下纽约时报公司和推特公司，他们都有小几千名员工，并且都是在给数百万人提供新闻资讯。但是当推特公司 2013 年上市的时候，它的估值是 240 亿美元——是纽约时报市值的 12 倍还多——可是纽约时报在 2012 年还赚了 1.33 亿美元，而推特还在亏钱。那么推特有这么高的溢价，该怎什么来解释呢？注：《纽约时报》，The New York Times，美国纽约出版的日报，属于高级报纸、严肃刊物的代表，在美国出版，但在全世界发行，有相当的影响力，良好的公信力和权威性。", "注：推特，Twitter，一个社交网络（Social Network Service）及微博客服务的网站，是全球互联网上访问量最大的十个网站之一。是微博客的典型应用。", "答案就是现金流。这乍听起来更怪了，因为纽约时报当时是赚钱的，而推特不是。不过，企业是不是能够称得上很棒，是要看它在未来产生现金流的能力。投资者期待着推特在接下来十来年时间能持续掌控住垄断利润，而报纸的垄断日子却该结束了。", "简单的说，一个企业现在的价值是其在将来挣的所有钱的总和。（要是想估得更准确，你还需要把将来的现金流折算成当今他们的“现值”，因为今天的 100 块钱，比将来的 100 块钱，要更值钱。）", "注：也就是说，明年的 100 块钱，充其量只相当于今年的 90 块钱。而“现值”是经济学概念，又称在用价值，是将未来的现金按恰当的", "折现率计算得出的其在基准年的价值，而折现率则和经济趋势及利率水平有关。", "比较一下未来现金流经折算后的现值就能一眼看出区别，低增长的企业和高增长的创业公司之间差别巨大。低增长企业的价值分布主要集中在近期，一家旧经济的企业，比如报纸出版企业，如果能连续 5、6年保持住当前这样的现金流就还是有价值的。但是，要记得竞争会消耗利润，与对手贴身肉搏的企业最是这样。夜总会或者餐馆就是比较极端的例子：成功者今天可能日进斗金，但是在接下来两三年时间里就可能会忽然衰败，因为消费者找到了更新更潮的替代方案而致其现金流枯竭。", {"img": "z5-1", "cap": "图5.1"}, "【附图 5-1 注】", "注：此图及下图就是未来现金流折合成现值后的图形，此图中的公司，按作者的说法，其价值就是所有现值的和，即大约125+95+71+53+40……", "科技公司通常会遵从相反的发展轨迹。它们经常是要先赔个好几年的钱的：有价值的东西是需要花些时间来创建的，这就意味着收益会迟到。一家科技公司的大部分价值会在未来至少 10到 15 年间才能体现出来。", "2001 年 3 月，PayPal 还没开始盈利，但是我们的收入已经比上年增加了 100%。当我推演我们未来的现金流的时候，我发现我们的公司的现值有 75%都来自 2011 年以后的收益——这对我们这家才仅仅创建了 27 个月的公司来讲简直难以置信。但即使是这样的计算，如今还是被证明太保守了。现在，PayPal 以每年 15%的速度持续增长，所以计算折损率比 10 年前更低。现在看来，这家公司的大部分价值会体现在 2020 年度之后了。", "注：此处亦指未来现金流的现值的总和。", "领英（LinkedIn）也是一个很好的例子，可以用来说明公司的价值为什么主要在未来。在 2014 年初的时候，它的市场资本估算是 245 亿美元——这简直是太高了，它的营收才不过 10亿美元，净收入更是只有 2160 万美元。你要是光看这几个数字你肯定觉得投资人又都疯掉了。不过你要是看看下面这个关于LinkedIn 未来现金流的推算，你就会觉得这个估值还是很合理的了。", "注：领英，LinkedIn ，创建于 2002 年，是全球最大的职业社交网站，注册会员人数在世界范围内已超过 3亿，每个《财富》世界 500 强公司均有高管加入。于 2011 年在纽约上市。", {"img": "z5-2", "cap": "图5.2"}, "注：按照相同的算法，领英的价值是大约 100+150+200+300+450+…虽然起点比上图的企业低，但显然更有潜力，因而更有价值。", "未来的盈利能力是至关重要的，但是即使在硅谷，也不是人人都能凭直觉就领悟到这一点的。在一个公司具有价值之前，它需要成长并能", "延续，可惜太多的企业主只关注了短期的成长。", "他们有个借口，说成长比较好度量，但是能否延续可没有办法量化。那些屈从于“度量为王”说法的人沉浸在各种数据和报表里：每周的活跃用户数目，每月的盈利目标，每季度的财务报表，等等。不过就算你的上面这些数据都已经很好看了，你还是可能忽视了更深层次的问题，这些问题确实是不那么容易去度量，但是会威胁到你的生意的可延续性。", "举例，Zynga 和 Groupon ，它们的短期成长非常快，所以其领导者和投资人都被迷惑了，忽视了长期发展可能会面临的挑战。Zynga通过《Farmville》在社交游戏上早早拔得头筹，并且宣称有个“心理度量引擎”来严密监测新产品的受欢迎程度。但是，结果他们也跟好莱坞的制片厂一样碰到了这么个问题：面对口味变化无常的观众，怎么才能非常靠谱的推出一系列能持续受到欢迎的流行娱乐？（没人知道。） Groupon 的快速成长则归功于数十万家本地化的商家都去试用了他们的产品，可是，让这些商家成为回头客可比他们最初想象的要难得多。", "注：Zynga，有中文译作“星佳”，是一个美国社交游戏公司，2007 年6 月创立。", "注：Groupon，中文名为“高朋”，2008 年成立的美国团购网站。", "如果你把短期的成长置于其他所有的东西之上，那你肯定就会漏掉你最该问问自己的问题：你的这桩生意 10 年后会不会还在？只去看那些数字，你是找不到答案的，你必须严肃的思考你的公司的一些定性的特征。", "垄断的特征", "未来会有大量现金流的公司看起会是什么样子的？每个垄断企业都不一样，但是通常它们都能把以下几个特征综合起来：独家科技，网络效应，规模经济，和品牌优势。", "这些可不是个检查项列表，你只要打打勾就能把公司开好——垄断没有捷径。但是对照这些特征能够帮你分析你的企业，来让你好好想想怎么样才能让它更长久。", "1， 独家科技", "自己家独有的科技是一个公司最最实质性的优势，因为这让你的产品很难被复制，当然最好是不可能被复制。谷歌的搜索算法，举个例子说，就比其他的搜索工具返回的结果要更好，这当然就是它的核心产品。而谷歌的其他独有技术，例如极短的页面载入时间、高精度的查询自动提示，又给其核心的搜索产品增加了稳健性和防御力。所以现在不管是谁，想要像谷歌在 2000年代初横扫其他搜索引擎公司那样来对付谷歌的话，一个字，难。", "掰着手指头大概算算的话，在最关键的部分，独家科技大概必须得比最接近的替代品好个10 倍以上，才能真正建立垄断优势。如果你的优势达不到一个数量级的差别，那可能就会被认为只是小小的改进，从而没人买账，尤其是在已经饱和的市场上。", "那么最明确的产生 10 倍改善的方法，就是创建全新的东西。如果你创建的东西有价值，但是之前从来没有过，理论上你这一改进的价值就是无限大的。比如说吃了不用再睡觉，也没有副作用的药丸儿，或者哪怕能彻底治疗秃头的方法，显然都是足以撑起一个垄断型的公司的。", "要么你就得彻底改变现有的解决方案：当你改善了 10 倍以上的时候，你就跳出了竞争。PayPal，就是个活生生的例子，让在 eBay 上做买卖的人获得 10 倍以上的便捷。没有 PayPal 的时候，人们邮寄支票得要 7 到 10 天，而 PayPal可以做到让买家立即支付，而卖家则也可以马上就看到买家付款了，然后也就可以发货了。另外，卖家还知道支票有可能造假或者是空头支票，但在 PayPal 里的资金都是货真价实的。", "而亚马逊做到 10 倍改善的方法就很浅显：他们可提供的书籍数量比任何传统的实体书店都要多 10 倍以上。在 1995 年亚马逊网站上线的时候，他们就宣称要做“全球最大的书店”，而他们之所以能真的做到，是因为不像传统书店可能得存放 100000 本书，亚马逊不需要真正物理上的库存，只要列个书目给大家看看，然后有人买哪本的时候它再向供应商去要哪本就行了。这种规模的提升简直太有效了，以至于在亚马逊上市之前三天，郁闷之极的巴诺书店把亚马逊告上了法庭，说亚马逊不正当竞争，因为它虽然号称是书店，但是却没有“店”，充其量只是个“图书中介”。", "注：巴诺书店，Barnes & Noble，美国最大的实体书店，已有整整 130多年的历史，1873 年由查乐斯·巴恩斯创办于伊利诺伊州的家中。现在也是美国第二大网上书店，仅次于亚马逊。", "这种 10 倍改善也可以通过优异的综合设计来获得。2010 年以前，平板电脑的市场可以忽略不计，主要是因为用户体验太差，而不是别的原因。早在 2002 年微软就发布了 WindowsXP 的平板电脑版本“Microsoft Windows XP Tablet PC Edition”，诺基亚也在 2005 年就发布了它的“互联网平板”，但是它们都太难用了。直到苹果公司发布了 iPad 平板。设计上的进步虽然不大好去度量，但是很清楚的事情是苹果把之前有过的东西改善了至少一个量级：平板电脑从基本没法儿用，变成了还挺有用。2， 网络效应", "网络效应是说，一个产品，如果用它的人越多，它就越值得去用。比如说，如果你的朋友们都在用Facebook，那你也去用 Facebook 就很合理，也很有用。而如果这时候你自己一个人去用个其他的社交网络，那无疑就是自绝于群众。", "网络效应可以很强大，但是你要是想要收割这块田地，你得能让你的网络在初期还很幼小时，就对最初的那批用户非常的有用才行。举例说，1960 年的时候，有家叫做 Xanadu 的堂吉诃德式的公司，它开发了一种双向通信的计算机网络——算是当今 WWW 万维网的某种雏形吧，但是它要求同步通信，就是说联网的双方用户要同时在线才行。在超过 30 年的徒劳无功之后，Xanadu 在万维网普及前夕关门了。他们的技术可能在大规模应用之后是有前景的，但却也只有在用户数上了规模之后才好用：他们要求所有用户的计算机同时都连着网在线，这在当时是不可能的。", "注：想象一下，你要给别人发个邮件，只有当对方也连着网在线的时候才能发得过去……", "所以，网络效应的矛盾之处就在于，想利用它的企业必须从非常小的市场入手。像 Facebook 一开始就只面对哈佛大学的学生——马克·扎克伯格最初的产品只是想让他的所有同学都来注册，而不是招来全地球的人们。这就是为什么成功的网络企业大多不是由 MBA 型的人创建的：初始的市场太小了，看起来就不是个像样的商机。", "3， 规模经济", "垄断型企业越大就越强：生成产品的固定成本（包括工程设计、管理、以及办公室租金）可以分摊到越来越大的销售量上去。软件创业企业更可以享受规模效应带来的好处，因为再拷贝一份软件产品的边际成本基本是零。", "而很多行业在规模做大之后的优势却很有限。服务型企业尤其难以做大到垄断。比如你开了家瑜伽训练馆，你只能服务一定数量的客户。", "然后你可以再开几家，再多请些教练，但是你的利润率还就是高不起来，因为你永远不可能就靠着一小群天才人员组成的核心团队，就能去给上百万的不同客户提供有效的服务，而这一点软件工程师们就能做到。", "所以好的创业公司在设计之初，就应该考虑是否有能适应规模经济的潜能。推特公司现在有 2500 万用户。它不需要通过去增加什么定制的功能来招揽更多的用户，而它的内在也没有什么会阻碍用户增长的问题。", "4， 品牌优势", "一个公司对其品牌天生就是垄断的，所以建立起一个强大的品牌就是获取垄断地位的有力手段。当今最强势的品牌就是苹果：一如 iPhone和 MacBook 般诱人产品的外观，精心挑选的上乘材料，时尚透亮又简约的专卖店风格，精心设计的用户体验，无所不在广告宣传攻势，处于高端的价格定位，再加上乔布斯个性魅力的光环笼罩，这一切都营造出一种感受，即：苹果的产品鹤立鸡群，无与伦比。", "很多人想从苹果的成功中去学点什么：付费广告也好，品牌专卖店也罢，或者高端甚至奢华的用料，以及富有玩味的产品发布会，还有高定价，乃至简约的设计风格，都是被不断模仿的元素。但是这些技巧只是能让表面光鲜，如果没有强大的内在实质，是起不到多少作用的。苹果有一整套的独家技术，硬件也有（比如优质的触摸屏材料）软件也有（例如为特定材料优化的触屏界面软件）。它的产品制造也早就具有规模效应了，其规模之大足以主导它所采购的材料器件的价格。而且它的内容生态体系也早早的就已经在享受着网络效应的带来的好处：成千上万的开发者给苹果的产品开发应用软件，是因为有过亿的用户在用苹果的产品；而这些用户会继续使用苹果的产品，又正是因为苹果设备上可用的应用软件又多又好。这些垄断性的优势可不像苹果的品牌那么耀眼夺目，但它们才是苹果品牌能够缔造优势、强化其垄断地位的根基。", "先从品牌而不是内在实质下手是很危险的。自从玛丽莎·梅耶尔 2012 年中担任雅虎公司CEO 之后，她就在努力复苏这个曾经红过的网络巨子，想让它再酷起来。在一条短短的推特消息中，雅虎把梅耶尔的行动方案总结成“人，然后产品，然后流量，然后利润”。人们照说是会为了够酷够时尚的东西而蜂拥而至的：雅虎通过改变 Logo 来展示它的设计意识，通过收购热门新秀 Tumblr 来贴近年轻与活力，并且用梅耶尔个人的明星效应吸引了媒体的关注。但是这儿有个大问题，就是雅虎到底想要做的是什么产品？当史蒂夫·乔布斯回归苹果的时候，他可不止是把苹果公司打造成了一个很酷的工作场所，他还大刀阔斧的削减了产品线，只专注于少数几个能做到 10 倍改善的机会。没有科技公司能够只靠品牌活着。", "注：玛丽莎·梅耶尔，Marissa Mayer，毕业于斯坦福大学，1999 年加入谷歌，是谷歌的第一位产品经理和首位女工程师，也是《商业周刊》“创新产业 25 位领军人物”之一。2012 年 7 月 17 日，玛丽莎出任雅虎 CEO。注：Tumblr，中文名“汤博乐”，成立于 2007 年，是轻博客的始祖，也是目前全球最大的轻博客网站。雅虎公司董事会 2013 年 5 月 19日决定，以 11 亿美元收购 Tumblr。", "如何建立垄断", "品牌，规模，网络效应，还有科技，适当的组合起来可以确立垄断地位，但是要让这几项能够正确的运作，你还需要仔细的选择市场，并且谨慎的扩张。", "从垄断小市场开始", "所有的创业公司一开头都很小。所有的垄断企业都主宰着其所在市场的一大块儿。所以，创业的小公司应该从一块很小的市场开始。理由很简单：要主导一个小小的市场要比占领个大市场要容易。要是你也觉得你的初始市场有点大，基本上那它就确实是太大了。宁可过小也别过大。", "但是“小”也不是说小到不存在。我们在PayPal 早期就犯过这样的错。我们最初的产品是让用户可以用PalmPilot 掌上电脑相互转账，这", "技术挺有趣，而且也没别人在做。但是当时世界上虽然有上百万 PalmPilot 的用户，但是他们既不在同一个地方，又没什么其他交集，而且他们都只是时不时用一下掌上电脑用而已。没人需要我们的产品，所以我们就没客户。", "这教训让我们学乖了，我们把目光盯在放到了 eBay 的拍卖交易上，然后我们收获了我们的第一次成功。那是 1999 年末，eBay 上有几千个交易量很大的“超级卖家”，然后我们只努力了 3个月，就让其中25%来用我们的服务了。而且，和数千个需要我们的产品的人打交道，比费劲去跟散落在全世界的几百万人做宣传，要轻松得多。", "对创业来说，最完美的目标市场就是一小群比较集中的人，而且只有少数竞争者，甚至没有。任何大的市场都是差劲的选择，要是这个市场已经有些公司在里面竞争的话，那就更差劲了。如果听到某些企业主谈到说要从过千亿的市场里面分个 1%，那就应该赶紧给亮红灯。为什么呢？因为在实践中，大的市场往往会缺乏合适的切入点，要不然就是没有什么竞争门槛，所以哪怕 1%也是很难分到的。再说，就算你好不容易站住了脚，那么你接下来肯定也不过是只求能维持下去：就像前面说过的，残酷激烈的竞争会让你毫无利润。", "扩大规模", "如果你已经成功的发掘并占领了一个小小的利基市场，那你就应该逐步的扩张到相关的、但是稍微大一点的市场上去了。亚马逊就示范了一下这是怎么做的。杰夫·贝佐斯注在创立公司时的愿景就是主导所有在线零售，但是他非常深思熟虑的选择了从图书开始。虽然说图书的种类有上百万种，但是它们的形状大体类似，所以很好运输，而一些卖得很少的冷门书籍——对于实体零售书店来说是无利可图的书——又会吸引一些最热忱的读者。所以在亚马逊上买书很快成为那些离书店比较远的人的主要方式，还有就是那些要找一些特定书籍的人也是选择了它。接下来亚马逊就面临两个选择了：是想办法增加读书的人呢？还是去拓展业务到相邻的市场上。他们选择了后者，进入了和图书最类似的市场：CD 光盘，视频碟片，还有软件等等。然后亚马逊逐步逐步的增加商品的种类，直到它成为世界上最大的“百货商店”。其实“亚马逊”这个名字本身就很机智的包含了它的扩张策略：亚马逊河孕育了热带雨林以及丰富的生物物种，就像亚马逊公司从图书开始，到销售全球最多种类的书籍，再到如今销售世界上所有的商品，句号。", "注：利基市场，Niche Market，又称缝隙市场、壁龛市场、针尖市场，是指那些被市场中的统治者、大企业忽略的某些细分市场，或者又翻译做小众市场，“利基”与其英语发音类似故后来被较广泛采用。。", "注：杰夫·贝佐斯，Jeff Bezos，亚马逊（Amazon）的创始人和 CEO。1999 年当选《时代》周刊年度人物。2013 年 8 月，贝佐斯以个人名义花费 2.5 亿美元收购《华盛顿邮报》。", "注：亚马逊，Amazon，这一名字来自亚马逊河，Amazon River，又译作亚马孙河，位于南美洲北部，是世界上流量、流域最大、支流最多的河流。它的流量大约相当于 7 条长江的流量，占世界河流流量的 20%；流域面积达 691.5 万平方千米，占南美州总面积的40%，大部分为热带雨林，生物多样性非常丰富；支流的数量超过1.5 万条。", "eBay 也是从占据一个利基市场开始的。当它在 1995 年发布拍卖市场的时候，它并不需要全世界立即都接受它、使用它；他们的产品当时很好的服务了一些小众客户群体，比如狂热的比尼宝宝收藏者们。而当比尼宝宝的交易被 eBay 垄断之后，它也并没有立即就跳到跑车或者其他工业产品上，而是继续关注并服务于各种小收藏小爱好，直到它成为一个最让人放心去交易的在线拍卖市场，无论双方交易的是什么物件。", "注：比尼宝宝，Beanie Baby，美国 Ty 公司（Ty, Inc）出品的一系列填充型动物玩偶。1995 年开始限量发行收藏版，从而引发收藏及交换热潮。", "而有的时候，在扩张过程中会碰到些隐藏的障碍——eBay 近年来就得到了这样的教训。像所有市场一样，拍卖市场主要是靠自然垄断，也就是说，因为买家是“哪儿卖家多就去哪儿”，而卖家也是“哪儿买家多就去哪儿”，所以自然就会聚成一团了。但是 eBay 后来才终于发现，拍卖的模式只适合独特的、或者是可以作为个人爱好收藏的东西，比如钱币或者邮票。而它对日常用品来说就不那么好使，因为人们不会为了铅笔或者面巾纸来拍卖，还是直接到亚马逊去买这些更方便。因此， eBay 依然还是很有价值的垄断企业，只不过其价值比起 2004 年的时候人们所期待的，会要少了那么点点。", "把进入不同市场的次序放正确是非常重要的，但常常却被低估了，而要切实做到逐步扩张，也需要很好的约束力和自制力。我们所说的最成功的公司，会把它的核心的路线规划——就是先拿下特定的利基市场，再扩张到邻近的市场——写到成立宣言里去。", "别搞破坏", "硅谷现在迷上了“破坏”。起初，“破坏”是个尖端词汇，有点“颠覆性”的意思，说的是某企业用新技术先引入廉价的低端产品，再逐步改进产品并且同时成长，直到最终水到渠成的，把还在用旧技术的昔日霸主连同其“高端产品”一起挑落马下。这基本上就是当年个人电脑（PC）“破坏”主机电脑注市场的套路：刚开头个人电脑好像无关痛痒，而到了如今它们却早已成为主流。当然，看起来现在移动设备也正在这么对付个人电脑。", "注：主机电脑，Mainframe，又称大型计算机。在计算机发展初期，主要还是大的公司和院校才能用计算机，体积巨大耗电也巨大，估称Mainframe，与终端 Terminal 对应。随科技的发展，现已退出市场，被个人电脑和各种（商用）服务器取代。", "但是，“破坏”这词儿现在被用滥了，任何东西都可以号称引领新潮流，每个人都自我恭维说是“破坏性创新” 注。戴不戴这一顶帽子看起来只是鸡毛蒜皮的小事，但是实际影响其实很大，因为一旦头上顶着这么个称谓了，企业主在自我意识里就会自觉不自觉的把“竞争性”看成自己的内在特征。这么说有点拗口，说白了就是企业主们会把自己当成个人物，看成是对现有市场领导者的威胁，但这只是他们自己臆想出来的。而一旦创业者痴迷于颠覆旧企业，那就说明他们只不过是站在旧企业的角度看待自己。怎么说呢，要是你认为自己是对抗黑暗势力的起义者，那就很容易只是在过度的去关注怎么扫平道路上的障碍；而如果你是真的打算创新的人，那就该把精力放在创新行为本身上，这才是最重要的，夕阳企业们喜不喜欢你的东西无所谓。说实话，要是你的企业总结起来无非就是在对抗旧企业的话，那估计其实也没什么真的新东西，所以也没什么机会能成为垄断企业。", "注：破坏性创新，Disruptive Innovation。这一说法由克莱顿·克里斯坦森(Clayton Christensen)于 1995 年提出。上段文中介绍的“破坏”就是指破坏性创新。而本段中自我误导的企业主们，显然是只记住了破坏而忽略了创新。故而本章中加了引号的“破坏”是指破坏性创新，而没加的就是单纯指破坏的本意。", "另外搞破坏也会惹人注意：破坏者本就是指到处找麻烦最后惹一身麻烦的人。搞破坏的小孩儿会被送去校长办公室。搞破坏的企业常常会去打那些打不赢的仗注。想想 Napster 注，起这么个名字意味着麻烦：“Napster”就是进行“nap”的人，那有什么是可以 nap 的呢？打盹？音乐？？绑架？？？英语里就这么几个词和 nap 相关。肖恩·范宁（Shawn Fanning）和肖恩·帕克（Sean Parker）这两个Napster 的创始人那时候才都十几岁，1999 年的时候他们可是把强大的唱片产业给狠狠的破坏了一把。第二年他们上了《时代周刊》的封面。再过了一年半以后，他们就上了破产法庭。", "注：上一章就说到了，要么不打，要打就打赢。", "注：Napster，既是公司名称，也是该公司开发的一款工具软件的名 称。该工具主要是支持用户间的 MP3 文件下载和共享，是 P2P （点对点）文件传输的先驱。Napster 公司后因版权问题不断应对各种官司，并终究于2001 年被迫关闭。后来 2011 年该品牌又被其他公司购买并重新激活，提供合法的在线音乐服务。", "注：好吧，Shawn 和 Sean 都译成肖恩……这是尊重目前对二位人名既有的翻译，不能怨本译者，否则后者应当音译做“辛”或者“西恩”会更加合适。", "PayPal 也可以被看做是有“破坏性”的，但是我们并没有去尝试直接挑战任何强大的对手。确实，当我们的网上支付流行起来的时候，我们从 Visa 那里分流了一部分业务，因为当你在网上买东西的时候你就会用 PayPal，而不是像在商店里买东西一样会用 Visa 卡。不过，因为我们把整个支付市场做得更大了，所以其实算下来我们给 Visa 增加的业务量比我们分走的要多很多。所以说，总体上的动向是正向增益的，不像 Napster 和美国唱片工业间的负和斗争。所以当你计划扩张到相邻市场的时候，请注意不要搞破坏：因为我们要尽量避免竞争。", "注：VISA，又译为维萨、维信，是一个国际财务结算服务组织，位于美国加利福尼亚州圣弗朗西斯科市，主要通过 VISA 认可的信用卡和借记卡进行服务。VISA 组织认可的卡带有 VISA 字样，一般就称为 VISA 卡，但是实际 VISA 机构并不发行卡片，而是由各国银行获得VISA 授权后进行 VISA 卡的发行。VISA 卡于 1976 年开始发行，它的前身是由美洲银行所发行的 Bank Americard。", "注：负和，Negative-sum，比第一章中提到的零和博弈结果还要差，即参与的各方都有损失，而全盘的总损失比总收益还要大。", "后发而至", "你们可能听说过“先发优势”：如果你是第一个进入市场的，那趁着其他竞争者还在手忙脚乱的准备起跑，你就可以一马当先的占领相当可观的市场份额。但是率先行动只是个战术，而不是个目标。我们在前面说过，重要的事情是能在将来持续的产生现金流，所以如果后来的人可以轻易的把你赶下台，那你第一个出手去抢这个宝座也并没什么好处。所以最好是去做那个最后出手的人——就是说，在特定市场内做出最终的重大进步，这么着就可以享受好几年甚至十几年的垄断利润了。而做的这一点的途径，就是从占领一个利基市场开始，有规划的扩张规模，逐步的向你心中的宏伟目标去前进。至少从这一点来看，办企业就像是下棋，国际象棋特级大师卡帕布兰卡（José Raúl Capablanca）就说的很好：要想赢，“首先你就要研究终盘” 。", "注：终盘，endgame，通常称为残局。但是此处其实指的是要知道如何走出致胜的一招，故而取“终盘”这一说法。这致胜的一招，就是前面所说的“最终的重大进步”，而走出这一步的人，当然就是“最后出手的人”。因而并不是所谓“后发先至”，而是其实只有“最后出手的人”能“至”，其他的人都被后浪拍在沙滩上了。"], "wcount": 10457}, {"icon": "6", "title": "你不是张彩票", "paras": ["在业界最有争议的问题就是：成功是靠运气还是能力？", "那成功人士怎么说？马尔科姆·格拉德威尔（Malcolm Gladwell），一位专门给成功人士写传记的成功作家，在《异类（Outliers）》一书中宣称成功是“混杂着无敌的运气和霸道的优势”。沃伦·巴菲特注对自己的成功的调侃也流传很广，他说自己是“幸运精子俱乐部”的成员，而且赢得了“卵子大抽奖”。杰夫·贝佐斯则把亚马逊的成功归结于“神奇的星象”，并且也开玩笑说成功依靠的“一半是运气，一半是时机，剩下的才是脑子”。比尔·盖茨则更夸张的说自己“很幸运的带着些技能出生”，不过也确实不清楚是不是真这么回事☺。", "注：沃伦·巴菲特，Warren Buffett，1930 年 8 月 30 日出生于美国内布拉斯加州的奥马哈市，全球著名的大亨，投资人，慈善家。伯克希尔哈撒韦（Berkshire Hathaway）投资公司主席兼 CEO。而其最为国人所熟知的称号为“股神”。", "当然这些家伙可能是有意谦虚了，不过我们也观察到了一种现象，就是在企业家里有些人能够取得一系列的成功，这就在很大程度上质疑了我们的“机遇造就成功”的说法。有好几百人都曾创办了若干家价值数百万美元的企业，还有少数人，比如史蒂夫·乔布斯，杰克·多西注，还有埃隆·马斯克，他们都创立了好几家价值数十亿的公司。如果成功主要归结于运气，那这种能创立一系列成功公司的企业家就应该根本不存在。", "注：杰克· 多西，Jack Dorsey，于 1976 年 11 月 19 日出生于美国密西西比州，Twitter 和 Square（一家移动支付公司）的创始人，也是后者的 CEO。", "2013 年 1 月的时候，就是这个杰克·多西，Twitter 和 Square 的创始人，发了一条 Twitter微博，说“成功绝非偶然”，他的两百万个粉丝都看见了。", "然后招来一片骂。参考一下《大西洋月刊》注发的 Twitter，记者 Alexis Madrigal 说他的第一反应就是回复“是啊，‘成功绝非偶然’，有钱的白人男子都这么说。”当然确实，已经成功的人再去搞点新东西是要容易得多，因为人脉也多，资产也多，经验也多。但是我们也不能这么着就对成功人士都嗤之以鼻，人家那也是按着规划一步一个脚印走出来的。", "注：大西洋月刊，The Atlantic，是美国一份有关文学、政治、科学与艺术的杂志，第一期出版于 1857年 11 月。《大西洋月刊》坚持无党派、无偏见原则，对于任何事物采取一种超然、充满智力性、幽默的、有艺术感的态度，是美国最受尊敬的杂志之一。", "那有没有什么客观的方法可以平息这场争论呢？对不起，没有。因为公司不是实验品。比如说针对Facebook 要研究它的成功是否偶然，我们得退回到 2004 年，把当时的世界复制1000份，在每一个世界里都开一家 Facebook，然后看看有多少家能成功。这才是客观的方法，但是显然做不到。每家公司都在特定的场景下被创办，而且都只被创办一次注。统计学的方法在样本数为 1 的时候是无效的。注：“这世上的每一个时刻都不会再次出现，做生意更是如此。”，前言开篇第一句。", "从文艺复兴和启蒙运动，到大概 20 世纪中叶，运气是可以被掌握、被支配、被控制的；每一个人都认为你应该要去做些能做到的事情，而别去专注那些不可能的事情。拉尔夫·沃尔多·爱默生注抓住了当时这种社会思潮的要点，他写到：“浅薄的人才相信运气，相信际遇……强者相信原因和结果。”此外，1912 年，在成为第一个到达南极极点的人之后，罗尔德·阿蒙森注写到：“胜利会等人，只要他把一切都安排妥当了——这就是人们说的运气。”没人假装说不幸是不存在的，但是我们的先辈们更相信好运气是可以用自己的努力争取来的。", "注：拉尔夫·沃尔多·爱默生，Ralph Waldo Emerson，1803 年 5 月 6日生于美国波士顿。美国思想家、文学家，诗人。爱默生是确立美国文化精神的代表人物。美国前总统林肯称他为“美国的孔子”、“美国文明之父”。", "注：罗尔德·阿蒙森，Roald Amundsen（1872～1928），挪威极地探险家。", "要是你们相信人生无非就是碰运气，那为什么要读这本书呢？在这儿学习创业毫无意义，因为你们现在读到的无非是些那谁谁谁买彩票中了大奖的故事而已。而且即使是《摇奖傻瓜书》，也只是号称能告诉你哪个幸运符比较好，哪台老虎机比较“顺”，却绝不可能告诉你怎么保证中奖。", "比尔·盖茨会不会只不过是赢了智力大乐透啊？那个那个雪莉·桑德伯格注是不是含着金钥匙出生的呀？还是她有诀窍于是“向前一步”了？当我们争论这样的历史遗留问题的时候，不管怎么说，运气也已经是过去式了。更加重要的问题是关于未来的：未来，主要是基于机遇还是设计？", "注：雪莉·桑德伯格，Sheryl Sandberg，1969 年 8 月 26 日出生于华盛顿。曾任克林顿政府财政部长办公厅主任、谷歌全球在线销售和运营部门副总裁。现任 Facebook 首席运营官，福布斯上榜的前 50名“最有力量” 的商业女精英之一，女权主义者，2013 年曾登上《时代周刊》杂志封面，“向前一步”则是她写的第一本书，英文为《Lean In》。", "注：本章中的“设计”，是指比较宏观意义上的设计和规划，就是类似改革开放总设计师”的那种设计，但是可能会稍小一点。", "你能否掌控你的未来？", "对于未来，你可能会有比较明确的想法或者期待，也可能只是懵懵懂懂雾里看花。如果你认为未来应该是比较明确的，那我们称之为对未来持“可定的”态度，这样去试图尽早了解未来甚至塑造未来，就很合乎情理。反过来如果你认为未来无法预知，主要是由各种偶然因素来主导的，那我们称之为对未来持“不定的”观点，当然你也就不会想去主宰未来。", "注：“可定”与“不定”书中英文原为 definite 和 indefinite。可以采用的中文翻译词汇很多，例如明确，确定，肯定，靠谱，等等。但是由于从本章整体内容上来看，作者并没有强调是“既定的”或者“明显的”的意思，却更接近“可知”和“不可知”的意思，于是选取了“可定”和“不定”作为译文。所以如果出现“可知/不可知”不大通顺不好理解的地方，可以先尝试在脑子里替代成“可知/不可知”,还不行就试试用“靠谱/不靠谱”。", "对于未来的这种“不定”的态度，就能说明什么是当今世界最主要的机能紊乱，即，过程胜于实质。当人们没什么很切实的计划好去执行的时候，就会参照以前的规律组合出一整套的备选方案组合注。这说的就是当今美国。在初中里，我们就被鼓励去参加各种“丰富的课外活动”；到高中了，有点儿想法的学生们更是你争我夺的想表现得无所不能；直到这学生上大学时，他已经花了 10 年来打造一份令人困惑的简历：超级的丰富多元化，正好适合完全不可知的未来。不管怎么说，反正他是准备得很好了——可是毫无目的。", "注：说白了，就是拼凑出个百搭万金油去充个数，这样看起来比较充实而不是无所事事。", "鲜明的对比，“未来是可定的”这种观点，则欣赏坚定的信念。不会去强求各方面都一知半解还自称“多面手”，认为“未来可定”的人会先去明确哪件事是最应该去做的，然后就努力去做这件事了。不会忙了半天却落得个庸庸碌碌，他们会去努力使自己有实质性的专长——也就是建立某种垄断优势。现在的年轻人不是这么做的，因为他们身边所有的人早就不相信可定的世界了。没人能仅仅因为一个方面的特长就能进斯坦福大学，除非这个方面和投接球有关注。", "注：指体育特长生。", "那么人们对未来的期待，也无非是会变得比现在更好，或者是更差。乐观的人欢迎未来，而悲观的人害怕未来。把这两种态度和“可定不可定的”观点结合起来，就得到了对未来的四种不同的观点。", {"img": "z6-1", "cap": "图6.1"}, "不定而悲观", "在各种文化里都有从某种黄金时代走向没落的神话传说，而历史上的各个民族也大部分都是悲观的。即使今天，悲观情绪也笼罩着世界上巨大的区域。未来暗淡无光，人们无能为力，不定而悲观，就是这种观点。这说的就是 1970 年以后的欧洲，从那个时候起整个欧洲大陆就无所适从，只好随着官僚之风飘来荡去。到现在整个欧元区都泡在一场慢性危机里，但就是没人负责。欧洲央行除了救急之外什么也不是：美国财政部在美元上印着“我们信仰上帝”，欧洲央行最好在欧元上印上“放一放再说”。欧洲人只是当事情发生时才做出反应，希望事情不要恶化而已。", "对未来持“不定而悲观”看法的人，不知道这种无法避免的衰退会是快还是慢，是骤然毁灭性的还是逐步侵蚀的。他所能做的就是等着事情发生，所以一边等着，一边他还可以照常吃点儿喝点儿找点儿乐子：所以欧洲才会以狂热于度假而著称。", "可定而悲观", "可定而悲观”的态度认为未来是可知的，但是因为前景黯淡，所以需要早做准备。令人惊讶的是，也许中国是今天这样的观点最盛行的地方。当美国人看见中国的经济疯狂增长的时候（从 2000 年起每年增长 10%），我们猜想这是一个能主宰自己未来的、自信的国度。但是这不过是因为美国人都是乐观主义者，所以把这种乐观情绪投射到中国身上了。从中国的角度看，经济的增速还不够快。其他国家都害怕中国就要接管世界了，中国是唯一的一个害怕自己做不到的国家。", "中国能增长得这么快的原因，是因为他的起点太低了。对中国来说，最简便的发展方法就是不断的照搬西方的成功模式。而且它现在就是在这么做的：明确按照计划执行，烧更多的煤，建更多的工厂，盖更多的高楼。但是因为人口巨大，资源价格被不断推高，中国人民的生活水平真的没办法能全都赶上富裕国家的人，中国人们也知道这一点。", "这就是为什么中国的领导人对当前的发展方式也感到非常的两难。而且，中国稍微年长一点的领导人们都在孩童时期挨过饿，所以当政治局在放眼未来的时候，灾祸绝对不会是个抽象的概念。中国的公众也一样，知道冬天是会来的。当外人还在为中国当前正在创造的巨大财富而着迷的时候，他们没有注意到富裕的中国人正在把钱转移出国，穷一点的中国人则尽量节约，想多存一点以备不时之需。中国各个阶层的人都对未来非常严肃认真。", "可定而乐观", "对“可定而乐观”的人来说未来也是一样可知的，但他们会认为只要他们认真制定计划然后努力去付诸实施，未来就一定会更美好。从 17 世纪到 1950、60 年代，持“可定而乐观”态度的人们一直领导着整个西方世界。科学家、工程师、医生还有商人们一起让世界比以前所能想象的还要更加富裕，更加健康，更加长寿。这正如卡尔·马克思和弗里德里希·恩格斯看到的那样清楚，他们说 19 世纪：资产阶级在它的不到一百年的阶级统治中所创造的生产力，比过去一切世代创造的全部生产力还要多，还要大。自然力的征服，机器的采用，化学在工业和农业中的应用，轮船的行驶，铁路的通行，电报的使用，整个整个大陆的开垦，河川的通航，仿佛用法术从地下呼唤出来的大量人口，——过去哪一个世纪料想到在社会劳动里蕴藏有这样的生产力呢？", "注：出自《共产党宣言》，马克思和恩格斯于 1848 年 2 月 21 日在伦敦发布。德文名为：Manifest derKommunistischen Partei；英文是：The Communist Manifesto 或 Manifesto of theCommunistParty。", "每一代的创新者和有远见的人，都超越了他们的前辈。1843 年，伦敦公众被邀请参加第一次地下穿越泰晤士河，从新挖通的河底隧道走。1869 年，欧亚间的海运不用再绕道好望角了，因为苏伊士运河开通了。1914 年，大西洋到太平洋也有了捷径，巴拿马运河。就算是在大萧条时期，美国不懈前进的脚步也没有被耽搁，因为那时美国是全世界最有远见的“可定乐观派”聚集的地方。国会大厦 1929年动工，1931 年完工。金门大桥 1933 年开工 1937 年建成。曼哈顿计划 1941 年启动，1945 年就造出了全世界第一颗原子弹。到了和平时期美国继续改造世界的面貌：州际高速公路系统 1956 年开始建设，第一期20000 英里的路程 1965 年向公众开放。可定的计划甚至飞出了地球表面：NASA 的阿波罗计划 1961 年开始，到 1972 年结束时已经送了 12个人上月球。", "注：大萧条，Great Depression，是指 1929 年至 1933 年之间发源于美国的经济危机。", "注：NASA，National Aeronautics and Space Administration 的缩写，是美国国家航空航天局，美国联邦政府的一个行政性科研机构，负责制定、实施美国的民用太空计划与开展航空科学暨太空科学的研究。", "注：阿波罗计划，Apollo Program，又称阿波罗工程，是美国从 1961年到 1972 年组织实施的一系列载人登月飞行任务。目的是实现载人登月飞行和人对月球的实地考察，为载人行星飞行和探测进行技术准备，它是世界航天史上具有划时代意义的一项成就。阿波罗计划始于 1961 年 5 月，至 1972 年 12 月第6 次登月成功结束，历时约11 年，耗资 255 亿美元。", "大胆的计划并不只来自政治领袖或者政府科学家。在 1940 年代后期，一位叫做约翰·雷伯（JohnReber）的加利福利亚人，打算改造旧金山整个湾区的地形。雷伯是一位老师，业余戏剧制作人，自学成才的工程师。有没有文凭这件事情并没有让他心里发怵，他公开的提议要在湾区建两个大坝，这样可以生成两个巨大的淡水湖以供饮水和灌溉，同时还可以填出 20000 英亩注的陆地用来发展。尽管他个人并没有什么权威，人们还是非常认真的考虑了“雷伯计划” 。整个加利福利亚州的各个报社的编辑部都对此大加赞赏。美国国会也为此召开了听证会。陆军工兵部队甚至为此在索萨利托城的一个巨大而空旷的仓库里搭建了一个 1.5 英亩的成比例模型来进行模拟实验。这些实验发现了技术上有缺陷，结果这计划就此作罢。", "注：约合 80 平方公里。", "注：雷伯计划，Reber Plan，可以在网上搜到。", "注：据查，该模型东西向 320 英尺（约 96 米），南北向 400 英尺（约120 米）。比例尺在水平方向为1:1000，垂直方向 1:100，时间轴上 1:100。这要是放在今天，还有人会从一开始就把这样的空想计划当回事儿吗？在 1950 年代，人们喜欢宏大的计划并且会去讨论是否可行。而现在，一个学校教员提出的宏伟计划只会被当做奇谈怪论给扔到一边儿去，连有权有势有地位的人提出的长期规划都会被嘲讽为狂妄自大吹牛皮。现在你还可以去索萨利托的仓库里看到这个湾区模型，但是现在它只是为了吸引游客而保留下来的：对未来的宏伟规划已经成了过气的怀旧景点。", {"img": "z6-2", "cap": "图6.2"}, "注：此图即为“雷伯计划”。另外作者在此图之后另附有一行字说“1950 年代，美国人认为关于未来的宏大计划太重要了，不能只是依赖于专家们。", "不定而乐观", "在 70 年代一个短暂的悲观时期之后，从1982 年起，不定乐观主义就主导了美国的思想，直到现在。因为那会儿一个很长期的牛市刚刚开始，所以金融成为了走向未来的最佳途径，从而把工程技术给遮蔽了起来。对不定乐观派来说，未来应该会更美好，但是他不知道具体怎么个更好法儿，所以他也不会去为之去做什么具体的规划。他确实是期望着能从未来得到好处，但是并不觉得须要去踏踏实实的设计未来。", "与其花个好几年去创建个新产品，不定乐观派更愿意去调整已有的东西。银行家赚钱靠的是调整既有公司的资产结构。律师们赚钱是靠着解决财产争端或者帮其他人打理事务。私募基金投资人和管理咨询顾问们也不会去开辟新的业务，而是通过持续的流程改进，试图从旧的业务里面继续挤出点效率来。常青藤院校的高材生们在这些领域里的比例非常高，但是这一点儿也不令人意外：一份以流程为导向、看起来就很精英、还可以为将来保留着“无数可能”的工作，难道不是对你这 20 年来辛辛苦苦堆砌简历的最适当的奖励吗？", "近些年来，毕业生的家长们总是鼓励他们去沿着已经铺好的道路走下去。婴儿潮注这一代人的历程很奇特，他们享受到了很多不费吹灰之力得来的成果，以致于他们觉得这就是理所应当的权益，所以这基本上是属于不定乐观派的一代人。因为不管你是 1945 年出生的，还是 50 年或者55 年，你 18 岁之前的人生总是一年比一年好，但这里头都没你什么事儿注。技术进步的速度增长很快，但似乎是全自动的，所以婴儿潮这代人伴随着各种伟大的期盼成长起来，却很少清楚该怎么用详细的计划来实现它们。然后到了 1970 年代，科技发展是基本停滞不前了，但是收入的逐步两级分化又挽救了这代人里的精英阶层。对他们来说，成年之后依然是每年都自然而然的越来越好，只要一旦挤进了有钱人士和成功人士的行列。虽然那一代人也有很多被抛在底层的人，但是如今的话语权是掌握在成功人士的手中的，他们在引领公众观念的时候显然不会去质疑自己的乐观主义其实很傻很天真。那么问题来了，既然这种一旦步入轨道、就可以顺其自然发展的生涯令他们毕生受益，他们有什么理由会觉得这样的人生会不适用于他们的孩子呢？", "注：婴儿潮，Baby Boom。指二战之后美国的生育高峰，从 1946 年至1964 年，这 18 年间出生的婴儿人口高达 7600 万人，这个人群被通称为婴儿潮一代，Baby Boomer。这代人目前约占全美人口的三分之一，无论从人数、年龄还是事业上看，都是当今美国社会的举足轻重的组成部分。", "注：自从 1945 年二战结束，美国经济进入飞速发展期，大约持续到1973 年。此处因为婴儿潮那代人还未成年，所以确实还“没他们什么事儿”。", "马尔科姆·格拉德威尔说过，你如果不了解比尔·盖茨的个人生长环境有多么幸运，你就不能真正理解他的成功：他在一个优越的家庭出生长大，上的私立学校在那个年代就配有电脑房，还有保罗·艾伦这么一位童年好友。可是同样的，你要是不了解格拉德威尔自己所处的历史环境，你也不能完全的读透他的言论，他也是婴儿潮的一代，出生在1963 年。当这些赶上婴儿潮的孩子们长大了以后，他们在写书来描写一个个的成功人士是怎么成长起来的时候，会强调他们每个人独特的个人环境和家庭背景，而这些是要靠运气的。但是他们所得出的这种结论，实际上却错失了对更大的时代环境的理解：他们这一代人，从小就对于机遇和偶然性的作用估计过高，而把计划和规划的重要性看得太低。格拉德威尔先生起初其实是想以独醒者的姿态来破解这些天才企业家的成功密码，结果其实他自己的思维套路恰恰代表了他们那一整代人的观点。", "注：马尔科姆·格拉德威尔，Malcolm Gladwell，本章一开头就提到说的“一位专门给成功人士写传记的成功作家”。", "注：保罗·艾伦（Paul Allen），生于 1953 年 1 月 21 日，美国企业家、慈善家，与比尔·盖茨共同创立了微软公司，并且微软(Microsoft)这个名字就是他想出来的。现任 Vulcan Inc.的创始人和主席。2014年他宣布捐出至少 1 亿美元用于抗击埃博拉病毒，并于 2015 年在美国旧金山组织了抗击埃博拉的学术峰会。", "注：那么，这是独醒者吗？", "我们不定而乐观的世界", "不定的金融", "一个可定乐观派眼里的未来会需要很多的工程师，因为我们要去建造海底都市和太空基地，而一个不定乐观派的未来会召唤更多的银行家和律师。金融本身就是不可定观点的集中体现，因为如果你没有创造财富的路子，就只能靠钱生钱了。假如没有进法学院，那精明的高等院校的毕业生们就会直接奔着华尔街去了，因为他们再没有什么其他的职业生涯规划了。而一旦他们到了高盛注，他们会发现就算只是在金融界内部，一切也都是不定的。当然整体上还是乐观的——你要是觉得会赔本你也不会掺和进去玩儿的对吧——只是要记得基本信条是：市场是有随机性的，所以没法儿去了解什么有针对性实质性的东西，这样一来多元化或多样性就变得超级重要了。", "注：高盛，Goldman Sachs，指美国高盛集团。成立于 1869 年，是全世界历史最悠久及规模最大的投资银行之一，总部位于纽约，向全球提供广泛的投资、咨询和金融服务。", "注：此处都是指投资和金融的多元化或多样性。", "那这不定的金融会不会有点古怪？我们来想想成功的企业家要是把他的公司卖掉了会发生什么事。他们拿到了钱会怎么用呢？在一个金融化的世界里，故事会这么展开：", "• 拿了钱的人们不大清楚拿这些钱做什么好，他们就把钱交给大银行去打理了；", "• 大银行也不清楚拿这些钱做什么好，所以他们就把钱分散交给多个不同的投资机构去搞搞多元化的组合投资吧；", "• 投资机构其实也不清楚怎么处理这些交给他们打理的资金，所以他们就通过买不同的股票来保证投资的多样性；", "• 各个公司则试图产生自由现金流来提升其股价。要是做到了，那他们要么就分红，要么就回购股票。于是就又有人挣到钱了，然后继续如此循环下去。", "在这样的循环链里，在任何一步中都没有人知道怎么把钱用到实体经济里去。但是在不定乐观派的世界里，人们其实很愿意有这样的“无限可选择性”：金钱本身比任何你可以拿钱去做的事情都要更有价值。只有在可定的未来观里，金钱才会只是一个手段，而不是终极目标本身。", "不定的政治", "对广大民众来说，本来政客们只有在选举期间才是正经说话会负责的人，但是现在他们已经调整到时时刻刻都去留意民意了。现代化的调研系统让政客有办法可以根据既有的民意打造自己的形象，所以大部分时候他们也都确实能做到迎合民意。纳特·希尔弗对选举结果的预测很出名，其精确度非常引人注目，但是更令人瞩目的是，他这每四年一次的预测本身就给人们带来了一个如此巨大的话题。也就是说，我们现在更着迷于用统计数据来预测预测接下来几周民众的想法，而不是用远见卓识去预言一下将来 10 年20年后国家的样子。", "注：纳特·希尔弗，Nate Silver，1978 年 1 月 13 日出生，美国统计学者，作家。因为预测美国总统大选而出名。2008 年大选他预测正确了美国 50 个州中的 49 个州的结果，2012 年 50 个州全部预测正确。", "而且并不是只有选举的过程——政府的各种特征都变得不那么可定了。过去政府可以有能力协调解决像原子能武器或者登月探索计划这样的大问题，而现在，经过了 40 年不定性的蠕动，政府的主要作用就只是提供保障：我们解决各种大问题的方法就是医疗保险、社会保障，还有其他一大堆让人头晕眼花的调整收入分配的方案。自从 1975 年以来，每年财政预算案里的社会福利支出都在侵蚀着可支配开支。要是想增加可支配开支，我们需要确定的计划来有针对性的解决那些特定的问题。可是按照如今政府依赖福利政策的这种不可定逻辑，我们应该只要多寄出些支票，一切自然就会好起来。", "不定的哲学", "这种朝着不定主义观念的转变不只是在政治上可以见到，在政治哲学家们身上也一样可以，而且同时支撑着左右两派。古代世界的哲学是悲观主义的：柏拉图，亚里士多德，伊壁鸠鲁，还有卢克莱修，都接受了人类的潜能是极为有限的这一观点，问题只是如何才能最好的去面对我们悲催的命运而已。而现代的哲学家则们大多数是乐观主义的。从右倾的赫伯特·斯宾塞注到中立的黑格尔，再到左倾的马克思，19 世纪的哲学家都相信人类的进步。（回想一下本章前面说到的马克思和恩格斯对于资本主义科技进步的称道。）这些思想家们期许着物质进步能够让人类的生活更加美好：他们是可定乐观派。", "注：柏拉图，Plato，公元前 427 年-公元前 347 年；亚里士多德，Aristotle，元前 384～前 322；伊壁鸠鲁，Epicurus，公元前 341年-公元前 270 年；还有卢克莱修，Lucretius，约公元前 99 年~约前55年。均为古希腊哲学家。", "注：赫伯特·斯宾塞，Herbert Spencer，1820-1903，英国哲学家。他为人所共知的就是“社会达尔文主义之父”，所提出一套的学说把进化理论适者生存应用在社会学上尤其是教育及阶级斗争。注：格奥尔格·威廉·弗里德里希·黑格尔，Georg Wilhelm FriedrichHegel，1770-1831。德国最伟大哲学家之一，近代客观唯心主义哲学的代表，在客观唯心主义基础上丰富和发展了辩证法。作为德国古典哲学的集大成者，十九世纪末年，在美国和英国，一流的学院哲学家大多被称为黑格尔派。而到了 20 世纪后期，不定的哲学走上了前台。最负盛名的两大政治思想家——约翰·罗尔斯和罗伯特·诺齐克，通常被看做鲜明的对立面：作为左倾的平等主义，罗尔斯最关心的问题是整体的公平和分配；而作为右倾的自由主义，诺齐克专注的则是个人的自由的最大化。他们都相信人类可以和平共处，所以不像古人们，他们俩都是乐观主义者。但是不像斯宾塞和马克斯，罗尔斯和诺齐克都是不定乐观派：在他们脑中，没有未来的确切景象。", "注：约翰·罗尔斯，John Rawls，1921 年 2 月 21 日－2002 年 11 月24日，美国政治哲学家、伦理学家。普林斯顿大学哲学博士，哈佛大学教授，写过《正义论》（《A Theory of Justice》，1971 年出版）等名著，是 20 世纪西方世界最著名的政治哲学家之一。", "注：罗伯特·诺齐克，Robert Nozick，1938 年 11 月 16 日－2002 年1月 23 日，美国的哲学家，毕业于哥伦比亚大学、牛津大学、和普林斯顿大学，也是哈佛大学的教授，当代西方哲学界的主要人物，他对政治哲学、决策论、和知识论都做出了重要的贡献。他最知名的著作是在1974 年撰写的《无政府、国家与乌托邦》一书，当中他以自由意志主义的观点出发，反驳了约翰·罗尔斯在 1971 年出版的《正义论》一书。", {"img": "z6-3", "cap": "图6.3"}, "他们的不定观点采用了不同的形式。罗尔斯的《正义论》以著名的“无知之幕”开篇：对于任何切实了解世界真实情况的人来说，公平的政治推演是不可能成立的。我们这个世界有着独特的人们和切实的科技，罗尔斯却并没有打算去尝试改变它，而是想象出了一个“内在稳定”的社会，在那儿有公平和稳定，但是没有生机和活力。诺齐克反对罗尔斯的“模式化”的公平概念。他认为任何自愿的交换都必须被允许，没有什么社会的“模式”值得用强制的规程来约束、来维护。但是和罗尔斯一样，他对未来美好的社会也没有什么切实而具体的想法：他们俩都只是注重流程。当今的我们实质上是夸大了左倾自由平等主义和自由个人主义之间的差异，因为几乎所有人其实都是不定论者，只是观点大同小异而已。所以在哲学上，当然在政治和经济上也一样，对流程的争论已经无限的耽搁了去制定切实计划来创建美好未来。", "注：无知之幕，Veil of Ignorance，由约翰·罗尔斯在《正义论》中提出。是一种制定规则和流程的假设。意思就是在人们讨论不同角色的权利义务时，最理想的方式是把大家聚集到一个幕布下，谁也不知道自己在幕布撤掉后会位于哪个角色的位置，然后大家讨论每一个角色应该如何如何。这样的好处是大家不会因为自己的既得利益而给出不公正的意见，弱势的角色能得到较好的保护，当然，任何角色也不会得到过多的利益。", "不定的人生", "我们的祖先渴求去了解并延长人类的生命。16 世纪的西班牙征服者曾去佛罗里达的丛林里寻找过不老泉。而弗朗西斯·培根也写过说“长寿药方”应该作为医药的独立分支来研究——并且是最崇高的分支。在1660 年代，罗伯特·波义尔把“延长生命”（和“重返青春”）放在未来科技心愿单的最顶端。不管是去做地理大发现还是做实验室研究，文艺复兴的顶尖英豪们都认为死亡是该要被征服的。（有些斗士阵亡了：培根在 1626 年得肺炎死了，当时他试图把小鸡冻在雪地里看这样会不会让它更长命。）注：弗兰西斯·培根，Francis Bacon，（1561-1626），是一位英国文艺复兴的代表人物，杰出的哲学家，科学家及散文家。", "注：罗伯特·波义耳，Robert Boyle，（1627-1691），英国化学家，其1661 年作品《怀疑派化学家 TheSceptical Chemist》被认为是近代化学的开端，并由此有“波义耳把化学确立为科学”这么一说。我们到现在都还没揭开生命之谜，不过 19世纪的时候保险公司和统计学者却揭晓了一个关于死亡的秘密，而且至今仍在左右我们的想法：他们发现了怎么把死亡简化成数学概率。说白了，就是编制一个“生命表”，来告诉我们在多大年纪有多大几率会死掉，这可真是前人从来都不知道的啊！不过呢，为了得到更有利的保险合同条款，我们似乎只能放弃探求长寿的秘密了。这种对于人类寿命分布的系统性知识，让大家自然就接受了“人能活多久就该是按表上这么列的”这么个观念。所以今天我们的社会弥漫着一对儿孪生的想法：死亡无法避免，死亡随机发生。", "同时，强调概率的态度也影响了生物学本身的研究进程。在 1928 年，苏格兰科学家亚历山大·弗莱明注忘记了给实验室的培养器皿盖上盖子，结果后来在这个培养皿中发现了能抗击细菌的真菌：后来的事大家都知道啦，他碰巧发现的就是青霉素。从此以后科学家们就一直试图再次发挥这种来自机遇的力量。所以现代的医药研究打算把弗莱明千载难逢的场景重现一下，怎么做呢？做 100 万次不同的尝试：制药公司把各种分子式随机组合试验，然后希望能碰上一个管用的。", "注：亚历山大·弗莱明，Alexander Fleming，（1881-1955），英国微生物学家，细菌学家，生物化学家，1923 年发现溶菌酶，1928 年首先发现了青霉素。后英国病理学家弗劳雷、德国生物化学家钱恩进一步研究改进，使青霉素成功的用于医治人类的疾病并成为划时代的的药物，三人因此共获 1945 年诺贝尔生理医学奖。", "可惜，这不像以前那样能够管用。尽管近两百年来生物技术取得了瞩目的进展，这最近的几十年它的发展却一直没能达到投资人的期望，也没能满足患者的期待。“尔摩定律” 发现，自从 1950 年以来，平均每 10 亿美金的研发投入能产生的（获批准的上市）新药数量，每 9 年就会下降一半。既然信息科技在发展的越来越快，那生物科技还有没有机会也出现类似的发展势头，就成为了一个大大的问号。比较一下生物技术的创业公司和同期的计算机软件创业公司：", "注：尔摩定律，Eroom’s Law，倒摩尔定律，真的是把 Moore 逐字母倒过来。摩尔定律，Moore’sLaw，是由英特尔创始人之一戈登·摩尔（Gordon Moore）提出来的，简单说是指集成电路的性能约每隔 18-24 个月便会提升 1 倍。这说明集成电路产业和技术在增速发展，而尔摩定律，或者倒摩尔定律，则是说某产业或技术发展越来越慢。", {"img": "z6-4", "cap": "图6.4"}, "这样的生物科技创业，就是不定性思维的极端例子。研究人员只是拿些有可能会有效的东西来试试，而不是去探寻提炼出关于人体系统如何运作的可定性的理论。生物学者说他们之所以需要采取这种方式，是因为基础生物学太艰深了。按照他们的说法，信息技术创业比较可行，是因为正是我们人类自己设计创造了计算机，并且设计它们就是为了让它们可靠的遵从我们的命令的。而生物科技很难，是因为身体不是我们自己设计的，我们对其了解的越多，就会发现其越加复杂。", "但是我们今天可能要去怀疑的是，这种生物学研究本身的艰深难度，是不是已经成为生物科技公司采用不定性方法来经营的通用借口了？大多数参与的人应该都会期待着其中会有某些东西在某天会被证明有效，但是却只有很少人会为了成功把所需的时间精力如数投入到某一个特定公司里去。首先带头的就是教授们，他们就常常只是担任兼职顾问，而不是全职雇员——即使最初这家企业创办的来由就是他们自己的研究，也一样。于是接下来，所有人都模仿了教授们的这种不定性的态度。自由主义者很轻易的把生物科技的停滞说成是因为严苛的规程扯了后腿——确实也是扯了——但是其实不定乐观主义才是生物科学的未来所要面对的更大的挑战。", "不定而乐观行得通吗？", "我们各种不定而乐观的决定，会给我们带来怎样的未来呢？如果咱们美国的家庭会存钱，那将来大家多少还会有点积蓄可用。要么美国的公司去做了些投资，那他们也可以期待将来收获点果实。但是美国的家庭基本都不存钱，而美国的公司大多就任由现金在财务平衡表上堆积起来，却不去投资新项目。原因：他们对于未来没有任何具体切实的计划。", "在图中，其他三种观点都可以行的通。可定乐观主义在你去着手构建你心目中的未来时，就是很可行的态度。可定悲观态度也会可行，因为你至少还可以去复制那些成功的东西，而不用去操心创新，虽然可能只是短期的。不定的悲观主义也能行，因为它是自我满足式的：如果你是个懒人，但是对生活的期待也不高，那自然也混得下去。但是不定的乐观主义看起来天生就不能持续：没人去计划的未来，怎么会变得更好？", {"img": "z6-5", "cap": "图6.5"}, "其实，对这个问题有这么个回答，大概大家只要是现代世界的人应该都听说过，那就是：“演进”。这个词是来自达尔文的学说，他自己就曾写到，生命就算没有特意准备，也会自然“进步” 。这种没有计划而得来的进步，我们称之为演进，即各种生物都只是在随机的遍历各种有机质的变异途径，而碰上了最佳路径的，最终就会胜出。", "注：达尔文，全名查尔斯·罗伯特·达尔文 Charles Robert Darwin，1809-1882。是英国生物学家、进化论的奠基人。1859 年出版的《物种起源》，提出了生物进化论学说，从而摧毁了各种唯心的神造论以及物种不变论。“物竞天择”“适者生存”作为进化论的主要观点，被广泛用于各种场合，常常用来比喻竞争，而在此受到作者诟病的正是这一比喻是适用还是滥用。“进化”是结果，“演进”，即遍历试错，是其采用的方法。", "达尔文的理论可以解释三叶虫和恐龙的起源，但是它能不能被推广到其他相距甚远的领域呢？就像牛顿的物理学原理不能解释黑洞和宇宙大爆炸之说一样，并不见得达尔文的生物学说就可以被用来解说如何构建更好的社会，或者如何从头开始创业。可是近年来，达尔文学说（或许是伪达尔文学说）在商界被广泛用来做比喻使用，记者们把原本用来描述各种生物在生态系统里面的适者生存，直接套用到企业和竞争性市场上也说是物竞天择，所以就出现了许多诸如“数码进化论”“网络达尔文主义”和“点击量最高者生存”之类的标题。", "就算是以工程为驱动力的硅谷，当前的热门用语也是说要从“单细胞创业”开始，然后逐步“适应”变化的环境，并随之一起“演进”。于是这些准创业者们被告知说：没有什么东西是可以事先预料到的，我们应该去听听客户们说他们想要什么，然后先做出“最简可用版”的产品（像最初的单细胞生物一样），再不断修正不断尝试，直到成功。", "注：这个过程就是所谓“单细胞创业”。这里作者用的英文词其实是Lean Startup，而 Lean Startup 通常被翻译成“精益创业”，并且有这么本同名书籍。但是“精益创业”和本文此处的上下文差别太大，就舍弃不用，翻译成“单细胞”了。下文会过渡到使用“精益”。", "可是，不管说是“单细胞”也好，说是“精益”也好，都只是个方法而不是目的。在既有的事物上做些小小的改进也许能让你占据局部的高点，但是却做不到帮你站上整个全局的最高点。就是说，你也许确实能做出一个 iPhone 上最好的专买手纸的应用程序，但是如果缺乏雄心勃勃的计划，再怎么去尝试、去遍历各种可能，也实现不了从零到一的跨越。对于不定乐观派来说，最奇怪的事情莫过于让他们出现在你的公司里：你怎么能期待着不去做任何计划，你的企业就会成功？所以，达尔文的学说在特定的领域是有效的理论，但是在创业上，富有智慧的设计，才最有效。", "“设计”的回归", "设计重于机遇。可这究竟意味着什么？现在，“设计的不错”好像只是个日常审美用语，而且确实从懒人到雅皮士都在细致的打理自己的外在形象。当然，杰出的企业家往往首先也是个前沿的设计师。任何拿着苹果的智能设备或者苹果笔记本电脑的人，都能切身体会到那种因为乔布斯对于完美的视觉效果和用户体验的执着而带来的最终成果。但是我们从乔布斯身上最应该去学习的东西，其实和美学无关。乔布斯最伟大的设计就是他的企业。苹果公司设想并实施了一系列的、明确的、多年计划，来创造新产品并进行有效的推广。忘了所谓“最小可用的产品”吧——自从 1976 年乔布斯创立苹果公司以来，他的看法就是：人们能够通过仔细的计划来改变世界，而不是通过去听取一堆专门的反馈意见，或者去复制别人的成功。", "长期计划的作用，在我们这个不定而浮躁的短期化世界里是被低估了的。当第一代 iPod 音乐播放器在2001 年 10 月上市的时候，业内分析人士觉得也不过 “对麦金塔什电脑注用户有用”而对其他人“没什么影响”。然而在乔布斯的计划中，iPod 是全新一代便携设备的开山之作，并将由此开启“后 PC 时代”。这个秘密在那个时候大家都有没看出来。那么现在，来，我们一起看一眼苹果公司后来的股价走势，就能看出这个多年计划结出的果实：", "注：iPod 是苹果公司出品的音乐播放器。麦金塔什是苹果公司出品的个人电脑。", "注：“后 PC 时代”，近年来，随着各种移动电子产品（手机，平板电脑）的普及，个人电脑（PC）销量逐渐下滑，主导市场的时代一去不返，因而被称为“后 PC 时代”。", {"img": "z6-6", "cap": "图6.6"}, "计划的力量也可以解释为什么给私人公司估值很难，以致于大公司大集团想要收购成功的创业公司的时候，它们出的价儿总是要么过高，要么过低。因为创业者只有当他们自己对于公司的发展也不再有什么切实的规划的时候，他们才会想把公司卖掉，这种情况下买主出的价往往是过高的；而对明确可定派的创业者来说，只要还有稳健的计划，他们就不会想卖掉公司，这种情况其实也就是出价太低了。当 2006年 7 月雅虎提出以 10 亿美金收购 Facebook 的时候，我觉得我们起码也可以考虑一下，但是马克·扎克伯格溜达着来到董事会上宣布说：“嘿，伙计们，来，我们走个过场，10 分钟都要不了。咳咳，我们显然不会就这么卖了 Facebook。”马克知道Facebook 会走向何方，而雅虎却还不知道。在一个人们把未来看做随机撞大运的世界里，有着良好而明确计划的企业，永远都是被低估了的。", "你不是张彩票", "我们必须找到方法，以回归可定的未来。西方世界也许需要一大场文化革命才能做到这一点。注：一大场文化革命，原文为“nothing short of a culturalrevolution”。", "从哪儿开始呢？约翰·罗尔斯必须得从哲学系下课；马尔科姆·格拉德威尔也必须被说服而去改掉他的理论；各种随民意调研结果见风使舵的政客更必须从政治中清除出去。等等等等。但是，无数的哲学教授们和格拉德威尔式的人物都已经在这世界根深蒂固，更不用说我们的政客们了。所以想要从这些挤破头的地方入手去尝试改变，就算有超强的大脑和美好的意愿，恐怕也是极为极为艰难的。", "创业，于是就成为你能拥有决定性掌握的最佳举措。你不单单能主导自己的人生，还能给周遭的世界带来不一定大、但是一定深远的影响。这一切，从拒绝被那个名为“几率”的昏君所主使开始。你，不是张彩票。"], "wcount": 15768}, {"icon": "7", "title": "向钱看", "paras": ["钱能生钱。“凡是有的，还要加给他，叫他有余。凡没有的，连他所有的，也要夺过来。”（《马太福音》第 25 章 29 节注）阿尔伯特·爱因斯坦也观察到了相同的现象，并且要把复利注称为是“世界第八大奇迹”，要不然就是“有史以来最伟大的数学发现”，甚至是“全宇宙最伟大的力量”。不管你更喜欢上面哪个版本的说法，你都别理解错了他的意思，他要表达的就是：绝对不要低估指数级的增长注。不过其实呢，没有什么证据表明上面的任何一种说法真的是爱因斯坦说过的——这些引言全都来历不明。但是这种张冠李戴倒是正好也强化了上面所说到的信息的内涵：爱因斯坦毕生的智慧形象一旦被投入作为本金，其利息甚至在他去世之后依然会源源不绝，有人会自然的把这些他没有说过的话归功于他。注：《马太福音》为圣经的一部分。此段话由于切合社会学和经济学等领域中的许多现象，故又被称为马太效应，Matthew Effect，代指两级分化。注：复利，Compound Interest，俗称“利滚利”，是指在每过一个计息周期后，都要将所生利息加入本金，以计算下期的利息。从数学上来讲就是指数级增长。注：指数级增长，又称幂增长或幂律，即以 x 的 y 次方增长。网络上有个方法可以很直观很简明的表述幂律的强大：1.01 的 365 次方约为37.8，而 0.99 的 365 次方约为 0.026。每天多一点点还是每天少一点点，经过了幂律之后就会差异如此巨大。", "大多数人说过的话都被遗忘了。而在另一个极端，少数被记住的人，例如爱因斯坦和莎士比亚，他们说过的话会反复、经常、一直、变着法儿的被引用。我们不用感到惊讶，因为少数的人经常能做出不合比例的成果。在 1906 年，经济学家维弗雷多·帕累托发现了一个现象，就是在意大利 20%的人拥有80%的土地，而这个现象在他的花园里也有来自大自然的类似体现，就是 20%的豆荚长出了总量 80%的豌豆。于是他提出了“帕累托法则”，又叫做“80-20 法则”。这种非常明显的模式，即少数完全的超越了剩下的大多数，其实在我们周边的自然世界和人类社会都随处可见。比如最具破坏力的地震，比其他所有小地震加起来的破坏力还大很多倍。比如说最大的城市，比所有的小城镇加起来还要庞大。还有，垄断企业能掌控的利润，比数百万家忙于竞争的企业的利润加起来，也要多。不管爱因斯坦说过还是没说过，幂律法则——这么称呼是因为指数公式，又称幂律，描述的是极为不均等的分布方式——都是全宇宙的法则。它如此彻底的勾勒着我们周遭，以至于我们通常都不会注意到它的存在。", "注：维弗雷多·帕累托，Vilfredo Pareto ，1848-1923 年，意大利经济学家、社会学家，洛桑学派的主要代表之一。", "注：大概是指，如同鱼看不见水，人看不见空气。", "这一章我们将展示一下，当你在向钱看的时候，幂次法则是如何现身说法的：风险投资机构投资给创办初期的公司，希望在其以后的指数级增长中获利，虽然只有少数公司能做的指数级增长，但是这些公司的价值会比其他所有公司加起来都多。虽然大部分企业根本不用和风险投资打交道，但是所有人都应该知道一件事，这件事是就算风险投资者也要努力才能弄明白的：我们生存的世界不那么正常，是被幂律法则在暗中主宰的。", "注：正常的，Normal。此处为双关语，因为正态分布也是用这个词，Normal。而此处正是要说明世界遵从的大多不是正态法则，而是幂律法则。", "风险资金的幂律法则", "风险投资者们需要去识别出前途靠谱的初创公司，然后在其早期就去投资支持他们，然后从中获得回报。他们先从机构和有钱人那儿募集资金，然后把资金汇集起来建立一支基金，再将其中的资金分别投给他们认为以后会变得更值钱的一些公司。如果他们的判断正确，那他们就从回报中抽取提成——通常是 20%。而一支风投基金要赚钱，就是得靠其旗下的公司们变得更有价值了，然后要么上市，要么被其他大公司收购。风投基金的生存期大多在10 年左右，因为需要有充分的时间让成功的公司成长，然后他们再“退出”。", "但是大部分由风投支持的公司都没有上市也没被收购；大部分都失败了，通常就在创办之后不久。因为这些早期的失败，风险基金一开始就会先亏损，这很平常。风投都希望基金的总价值在过了几年后就会开始戏剧性的攀升，先达到收支平衡，再不停向上，因为这时候在他们投资组合里的成功企业应该已经进入了指数级的上升期并开始膨胀规模。", "那么问题又来了，这种腾飞什么时候会出现？对大部分基金来说，答案是“做梦的时候”。大部分创业会失败，然后大部分基金也就随之失败了。当然每个风投都知道要去找到可能会成功的公司来投资才行，但是对于投资失败的现象，即使是资深的投资人也只是能够做到从表面上去理解其原因。他们知道公司和公司是不同的，但对于其间的差异，他们还是大大的低估了。", {"img": "z7-1", "cap": "图7.1"}, "其中的错误就在于，在他们的预期中，各项投资的回报应该大体上符合通常的正态分布，也就是说，两头少中间多，一些次一点的公司会倒掉，比较多的马马虎虎的公司投进去基本不赚不赔，而少数比较好的公司一旦投进去能获得 2倍或者 4 倍的回报。按照这种比较温和比较平均的模式，投资者们去配置出了一套套多元化的资产组合，然后计算出大概成功的投资能弥补失败的投资带来的损失，也许还能赚一点。", "但结果这种“广撒网，多烧香”的方法，网到的通常都是泡沫，没啥值钱的东西。这是因为投资回报的分布根本就不是正态的，相反，它们遵从的是幂律法则：一小小撮公司就能完胜其他所有公司加在一起。所以如果你只是用大撒网式方法的追求多样性，而不是一门心思的去仔仔细细寻找这些将来能以一当百的种子选手的话，那因为他们太少了，所以你在一开头就很可能把他们都给漏掉了。下图展示的就是高冷的现实和温和的猜想：", {"img": "z7-2", "cap": "图7.2"}, "我们的 Founders Fund 基金投资的结果也印证了这种非常倾斜的模式：Facebook，我们用 2005 年度的基金做出的最好的投资，带来的回报超过了其他所有投资的回报之和。Palantir，投资回报第二名，也比除了第一名 Facebook 之外的全部投资加起来的回报要多。这种极不平均的模式并不是异常的：我们在其他投资基金上也都能看到。风险资本最大的秘密就是，在成功的基金里，最好的投资项目带来的回报，等同于、甚至超越了其他所有投资的回报总和。", "这就暗示了关于风投的两条非常奇怪的规矩。第一条，只去投那些回报可以达到整个基金规模的公司。这条规矩很吓人，因为这基本上就把绝大多数可以投资的地方给排除了。（因为通常即使是还算成功的公司，其规模一般也达不到整个基金的规模这么大。）这就引出了第二条：因为第一条太严了，所以不用别的规矩了。", "思考一下如果你违背了第一条规矩会怎么样。安德里森·霍罗威茨投资基金在 2010 年给Instagram 投资了 25 万美元。仅仅两年后Facebook 就花了 1 亿美金把它买下了。所以安德里森基金在 2 年内净赚了7800 万美金，这可是 312 倍的回报率啊。这么显著的回报，于是成就了这支投资基金在硅谷首屈一指的好名声。但是你可能会觉得很诧异，因为我要说的是，这远远不够。因为安德里森基金当时有 15 亿的规模，如果他们开出的支票都是 25 万一张的，那他们要找到 19 个 Instagram 这样的机会才能持平。这就是为什么投资者往往会给值得投资的公司使劲儿砸钱。（说句公道话，其实安德里森基金也打算在Instagram 后几轮融资里多投一点的，但是和之前其他的投资冲突了所以才没投。）风投们必须找到那小小一撮的、能够从 0 跨越到 1 的公司，然后倾尽所有资源去支撑他们。", "注：安德里森·霍罗威茨，Andreessen Horowitz。现资产约 40 亿美金的风险投资机构。2009 年由Marc Andreessen 和 Ben Horowitz共同创建于美国加利福利亚州。", "注：目前国外最流行的手机应用之一，用于分享照片和视频等。", "注：每张支票赚 7800 万的话，15 亿除以 0.78 亿即得到大约 19。", "当然，没有人能够事前知道哪些公司会成功，所以即使是最好的风投公司也会搞一个“组合投资”。但是请注意，好的组合投资里投的每一个公司，都必须有能取得极大规模成功的潜质。在我们的 FoundersFund，我们每期基金只集中去做 5 到 7 家公司，选这些公司的时候我们认定他们每一家都具有独特的基本面，能支撑他们将来成为数十亿美元的企业。当你考察一个企业是否值得投资的时候，如果你关注的不是它的实质，却转而去纯粹从财务上考虑它是否能满足你的“组合”的多样性需求的时候，那么这次投资就已经有点像在买彩票了。而如果你觉得你是在买彩票，那你心理上应该已经准备好接受损失了。", "为什么看不到幂律法则", "为什么所有人里面最专业的风投们，也往往看不到幂律法则？一个原因，就是幂律法则的身影只有在经过了一段时间之后，才能清晰的显现出来，而即使是科技界的投资者们也常常只是活在当下。想象一下，如果一个机构投资了 10 个公司，都有成为垄断企业的潜质——这可已经是很难得很讲究的组合了——这些公司在到达指数级增长之前的很长时间，看起来其实都差不多。", {"img": "z7-3", "cap": "图7.3"}, "接下来再过几年，有些公司会比较失败，同时有些会开始成功；这时候估值开始产生分化，但是这时候还看不出是指数级增长还是线性增长。", {"img": "z
