7-4", "cap": "图7.4"}, "终于，过了 10 年之后，这套组合投资的情况比较分明了，但是并不是仅仅分出了一些好投资和另一些差点的投资，而是分成了一项占据主导地位的投资结果，和其他的几乎无所谓的投资。", "但是无论受到幂律法则所左右的最终结果是多么的无可辩驳，它依然是很难以在日常的经历中被体验到的。这是由于投资者把大部分时间都用在研究新投资、或者扶持还在投资初期的公司上，而这时候所有被他们关注的公司本来就都会表现得比较平均。所以投资者和企业主们日常能察觉到的都是成功和进步，只是水平相对不同而已，而不是指数级的绝对优势和彻底失败之间的那种差距。在接下来的时间里，既然没人会想要放弃任何一项投资，所以风投的人其实会在有问题的公司上花更多的时间，而不是在最明显会成功的企业上。", "注：因为还在投资初期，参见投资初期那张图。", {"img": "z7-5", "cap": "图7.5"}, "既然连最擅长让创业公司按指数级增长的投资者们都难免会忽视掉幂律法则，那对其他人来说，把幂律法则给忽视掉了就更没什么好大惊小怪的了。幂律法则的影响无所不在，但是大隐于市，所以如果只是粗粗的去看一眼，那一定是看不到它的。比如，当硅谷之外的人想到风险投资的时候，脑海里会浮现出一幅画面，上面有一小组有点怪异的人——就像美国广播公司的创业大鲨节目里那些人似的，只是里面没有广告。毕竟，美国每年新创立的企业里面只有 1%得到了风险投资，而所有风投资本的总体规模也不到美国GDP（国内生产总值）的 0.2%。但是这些投资的结果对整体经济的拉动效应却大的不成比例：由风投支撑的公司创造了私营经济中 11%的就业，其所产生的年度收入更是达到了令人吃惊的大约21%的 GDP（国内生产总值）。事实上，最大的 12 家科技公司全都有风投基金在背后支持。而这 12 家公司的总价值超过 2 万亿美元，比其他所有科技公司加起来还要多。", "注：美国广播公司， American Broadcasting Corporation, Inc， 简称ABC，美国三大商业广播电视公司之一，为迪斯尼集团所有。创业大鲨，Shark Tank，是其旗下一款关于创业的真人秀节目，2009年开播至今。最初这种创业真人秀源自日本，在 2001-2004 年间播出，版权为索尼公司所有，后在英语国家分别以 Shark Tank 和Dragon’s Den 的名字制作当地版本。中国在 2005-2007 年间东方卫视有类似节目名为《创智赢家》，与上述节目并没证据表明有直接关系，但在网络上常常把 Shark Tank 译作创智赢家。", "注：“比其他所有……加起来还要多”，熟悉的措辞。是的，这就是幂律法则的作用结果。", "知道幂律法则又怎样", "幂律法则并不只是对投资人来说很重要，或者应该说它对每个人来说都很重要，因为每个人都是投资者。一个企业主最主要的投入往往就是花在创业上的时间，因此企业主都在掂量着公司是不是会成功并且变得有价值。而其实对于每一个人，也都不可避免的会成为投“资”者，因为当你选择了一个职业，就代表你相信你所选的这个工作是有价值的，也许“值得”干一辈子。", "注：所以，其实不管做什么，做多久，你都是在用你的时间、你的生命来投“资”。", "对于未来价值的问题，最常见的答案就是多元化的组合：“不要把鸡蛋全都放在一个篮子里面”，大家都这么听说过。正如我们前面所说，即使是最好的投资者，也免不了会采用组合投资的方式，但是，了解幂律法则的投资者会选取尽量少的投资对象，而不像被民间智慧和金融界惯例所推崇的那种所谓组合投资，号称是多元化，其实往往只不过是想用分散下注的方式对抗风险，似乎铺得越开，就越能对抗未来的不确定性。", "然而，人生并不能组合，对创业者是这样，对所有人都一样。企业主没办法把自己“多元化”：你不能同时运营十多家公司，然后希望其中一家能成功。不那么显而易见，但是同样重要的是，任何个人也不可能为了把自己“多元化”，而以同等的投入去同时准备应付十来份不同的职业。", "但是我们的学校教的正好相反：院校教育搬运来的都是平均化、通用化的知识。每个从美国教育体系里过来的人都学着不用幂律法则的方式思考。高中每堂课都是 45 分钟，不管是什么科目。而每个学生都按照相同的进度来学习。到了大学，榜样学生们通过去堆砌一整套的花哨的选修技能来构筑未来。每所大学都相信“卓越”，但是那些长达百页的课程目录（教务处编制，按字母排序）却明显是在告诉你，“你去做什么不重要，重要的是把它做好”。这根本就是错的。你做什么很重要。你应该全心全意专注在你擅长的事情上，当然你必须先认真思考你选择的事情对未来是否有价值。", "对于创业界来说，这就意味着你未必应该自己去开公司，即使你超级有才华、异常有天赋。要说为什么，现在创业开公司的人太多了！而认识到幂律法则的人在选择冒险创业的时候会比其他人更迟疑，因为他们知道，如果能够加入正在腾飞期的好公司的话会带来多么巨大的成功。在这儿，幂律法则也意味着不同公司间的差别要远远超过同一公司里不同职位间的差别。要是你自己去创业，你是可以拥有公司的 100%的股票，但是一旦失败了，你就只有 100%的废纸而已。而作为对比，如果你能拥有谷歌公司0.01%的股份，哇，好大一笔钱啊（在写这本书的时候应该超过了 3500 万美金）。", "一旦你真的开了自己的公司，那你就必须谨记幂律法则并加以妥善应用，才能把你的公司好好运营下去。要记得最重要的事物往往只有单独的一份：某一个市场可能比其他所有市场都要好，像我们在第五章里说过的一样；某一种行销推广策略也往往会比其他的都要有效——我们后面会在十一章说到。时机和决策也遵从幂律法则，就是说，会有那么某个时刻，比起其他的时间都要重要得多得多——第九章也会谈到。然而，这个世界的大多数人并不认同幂律法则，所以你也不能指望别人能帮你集思广益出谋划策指点迷津，这样的话最最重大的事情往往不会是那么显而易见的，甚至有可能会成为隐藏很深的秘密。但是既然幂律法则确实在暗中主宰这个世界，那你就必须认真思考你所采取的每个举动，看看它是落在幂律分布曲线的哪个位置，否则，后果就是通常说的，不堪设想。", "注：也就是说，你的举动是在去找那个“一小撮”还是“其他所有”，你的决定是“某个”比其他所有都好的市场、策略，还是“其他的”市场、策略。而你面对的时机，是平凡普通的一刻，还是千载其一的时机？"], "wcount": 6357}, {"icon": "8", "title": "秘密", "paras": ["每一个如今很著名的理论或者很熟悉的说法，都曾经是不为人们所知的，甚至是连想都没有往那个方面去想的。三角形三条边之间的数学关系注，就是个例子，这可真的是个已经被埋藏了数千年的秘密，所以毕达哥拉斯注不得不绞尽了脑汁才提炼了出来。而在那个年代，如果你想从毕达哥拉斯那儿学习到他的新发现，那恐怕只能是先加入他的素食者教派才行了。而到了今天，他的几何学已经成为常识——我们教给小学生的简单知识。常识可能确实是很重要——比如说刚才这个例子，是小学数学的基础之一——但是这不会给你带来任何优势，因为这不是个秘密。", "注：此处指勾股定理，西方称为“毕达哥拉斯定理”，即直角三角形的两条直角边 a/b 的平凡和等于斜边c 的平方，a2+b2=c2。西方在公元前 500 多年才被发现此定理，而人类在公元前已有数千年的历史，因而称之为被埋藏了千年的秘密并不为过。", "注：毕达哥拉斯，Pythagoras，（约公元前 580～约前 500）古希腊数学家、哲学家。出生在爱琴海中的萨摩斯岛（今希腊东部小岛），游历过巴比伦和印度，后来在意大利的南部传授数学及宣传他的哲学思想，并据传死于意大利科多拿城。", "注：毕达哥拉斯和他的信徒们组成了一个被称为“毕达哥拉斯学派”的政治和宗教团体，由于历史原因，他的先进的数学和哲学思想当时都仅限于在这个团体内秘密流传，而这个团体禁止食用动物制品，并且也不许吃豆子。", "还记得我们的独醒者问题吗？你认为有什么重要的真相是大部分人还没有认同的？如果我们对自然世界的认知以已经到达了可能的极限——假设如今的常识都确实很明智，并且所有的知识都已经完备——那就不会有什么好答案了。除非世界还有秘密没有被昭示，否则独醒者问题就不会有意义。", {"img": "z8-1", "cap": "图8.1"}, "当然，现在就有很多我们无法理解或不能领悟的事情，但是其中有一些是不可能搞明白的——我们在此称之为奥秘或不解之谜，而不是“秘密”。比如弦论，这个理论认为宇宙最基本的组成部分不是我们通常认为的粒子，而是一些振动的、一维的能量线，称之为弦。弦论是不是正确呢？你没有办法用实验的方法来检验它。甚至很少有人能搞懂这个理论的全部内涵，假如也许还真的有那么几个人的话。但是，这仅仅是因为它确实太难了？还是因为这根本就是不解之奥秘？这是有区别的。人们能够去完成困难的事情，但不能做到不可能的事。", "再想想商业版的独醒者问题：有什么会有价值的公司还没被创建？有什么好生意还没人去做？每个合格的答案显然都应该是个秘密：重要，但是不为人所知的事情，困难，但是可能做到的事情。如果世界上还留有很多秘密，那就是说可能还有很多可以改变世界的公司正等着你去创建。这一章就会探讨如何去思索秘密，然后如何去找到它们。", "人们为什么不寻找秘密？", "按照大部分人的做法来看，似乎世界上已经没有什么秘密可以去发现了。这种观点的极端代表人物就是泰德·卡辛斯基(Ted Kczynski)，他有一个臭名昭著的称号叫做“大学炸弹客”(Unabomber)。卡辛斯基原本是个天才儿童，16岁就上了哈佛大学，接着在拿了数学博士之后去加州大学伯克利分校当了教授。但是你们如果听说过他的话，可能也只是因为他连续搞了 17年的恐怖活动，在那期间不断的给院校教授、科技人员和商务人士邮寄自制的炸弹。", "那会儿直到 1995 年底的时候，当局对“大学炸弹客”是谁、在哪儿，都还没有什么头绪。当时最重大的线索是一份 35000 字的行动宣言，这是卡辛斯基写好了以后匿名发给媒体的。于是FBI 让几家重要的报纸刊登了这则宣言，希望能有所突破。结果这一招的确生效了，卡辛斯基的弟弟认出了他的写作风格，然后举报了他。", "你们可能会认为那是因为他的文风张扬又错乱 ，但其实那篇宣言的确具有极强的说服力。卡辛斯基在文中宣称，如果要感到快乐的话，每个人都“需要有一些必须付诸努力才能够达成的目标，并且需要能成功的完成其中的一些目标”。他把人们的目标分成了三类：", "1， 不需要多少努力就能达成的目标；", "2， 需要通过艰苦努力才能达成的目标；", "3， 再怎么努力也无法达成的目标。这是经典的三分法，分成简单、困难和不可能三种。卡辛斯基宣称现代人之所以会比较郁闷的原因，正是因为世界上所有的困难问题都已经解决了。剩下来的要么是简单的，要么是不可能的，而去折腾这些问题是非常非常没有满足感和成就感的。因为，你能做到的，小孩子也能做到；你做不到的，就算是爱因斯坦也做不到。所以卡辛斯基的想法是把现有的院校机构全部毁掉，把所有的科技全都干掉，然后让人们从头再来，这样就能重新解决那些困难的问题了。", "卡辛斯基的方法实在是很疯狂，但是他的这种对科技上的继续开拓不再抱有信心的态度，在我们身边却比比皆是。想想现在的都市嬉皮风注的那些细微却象征意义明显的小特征：复古风格的照片，八字胡，黑胶唱片机，等等，这些似乎都在有意无意的、试图重新回到之前的那个人们对未来非常乐观的年代。要是所有值得去做的事情都做完了，那你也不妨装作厌恶功名利禄，去躲起来当个咖啡师。", "注：此处实际是现代版的嬉皮士（Hipster），实际与 1940 年代的嬉皮士有所不同。", {"img": "z8-2", "cap": "图8.2"}, "所有的原教旨主义者都是这么想的，不只是恐怖分子或者嬉皮士。例如说宗教上的原教旨主义者，就不允许有“困难问题”所处的中间地带：要么就是些简单的基本事实，孩子们都能脱口而出；要么就是真神的奇迹，不需要也无法解释；而在中间的——难以证明其真相的——就是异端邪说。又比如说放到现在，环境保护主义也正在成为一种原教旨信仰：简单的事实是：“我们需要保护环境”；而在这之上，“啊~我们的母亲，大自然，她最洞察一切，并且绝不容许任何的质疑。”自由市场主义者也膜拜类似的逻辑：任何东西的价格都是市场决定的，甚至连小孩子也能查询到股票报价。但这些价格是不是合理呢？这种怀疑的念头那可真真是万万不能有的，因为：市场所知道的远远比尔等所能了解的要多得多。为什么我们社会上这么多的人觉得没有什么属于困难级别的秘密了呢？这可能得从地理学说起。来看看世界地图，现在已经不再有空白之处了。而如果你们生长在 18 世纪，那就还有很多新地方可以去，也许在听过一些外国人的探险故事之后，你们自己也会成为探险家的。那种情况直到 19 世纪甚至 20 世纪初期都还存在，而再往后，《国家地理》杂志的照片向所有西方人展示了一切：独特风情的异域也好，尚未开化的土地也罢，只要在地球上，其面貌就能被人们看到。今天，“探险家”大概只能在历史书或者小孩儿们的故事书里找到了。而在当父母的里面，打算让孩子成为探险家的，比想让孩子当海盗或者苏丹的，估计也只少不多。或许亚马逊丛林深处还有些与世隔绝的部落，另外我们也知道海洋深处还有着最后一块人类未曾涉足的地界，但这些未知的领域目前看起来暂时却还进不去。", "注：《国家地理》，National Geographic，世界上最广为人知的一本月刊，封面上具有亮黄色边框。创刊于 1888 年 10 月，它由美国的一家非盈利科学教育组织 “美国国家地理协会”（NationalGeographicSociety）创办，内容为高质量的关于社会、历史、世界各地的风土人情的文章；其印刷和图片之质量标准也为人们所称道，那些有灵魂有激情的作品见证了一大批充满理想和浪漫主义的优秀摄影师、记者的诞生。在中国，《华夏地理》杂志为其授权合作伙伴。", "既然地理上的前沿探索已经淡化，伴随着这一自然事实而来的四种社会趋势，则共同根除了我们对秘密依然存在的信念。第一种趋势叫做渐进主义(Incrementalism)。从小我们就被教育说，做事的正确方法是一次前进一小步，一天一天来，一级一级上。即使你个人的进度很快，学会了考试之外的东西，那也并不会多给你加点儿学分。而如果你完全听话，而且比其他同学做的稍微要好哪怕那么一丁点儿，那就会拿到最高分作为奖励。这种体制延伸到了各个学术领域和整个院校生涯，所以各界学术人士们往往也只是竞相发表一些其实无关紧要的东西，而不去探索新的前沿阵地。", "其次就是风险规避。人们害怕秘密的原因是因为他们害怕犯错。既然是秘密，那肯定还没通过主流大众的审查，所以如果你的目标是一生平安不犯错，那你就别去碰什么秘密。因为你注定孤独一生——秘密嘛，就是说你为之奉献一生的事情别人都还不认可——就算你是对的，这种人生也已经够苦闷了，要是孤独一生了结果发现你自己还搞错了，那就简直□□了。", "第三种趋势叫做自满。社会精英们拥有最大的自由和能力去探索新思维，但是其实他们看起来却最不相信秘密。因为他们既有的成功和地位已经让他们只要舒舒服服的坐着，就能拥有各种享受了，为什么还要去找什么新的秘密呢？每年秋天，各个顶尖法学院、商学院的校长们在欢迎新生的时候，都会不约而同的在致辞里暗示说“这儿是精英院校，你既然进来了，就不用担心了，你的人生将来注定是让人各种羡慕嫉妒恨……”云云。不过这种说法就是典型的“只有你不把它当真，它才会成真”的玩意儿。第四个，就是“扁平化”。随着全球化的推进，人们对世界的认知演变为一个同质化而竞争激烈的市场：世界是“平”的。基于这种假设，每个可能有点儿想法想去寻找秘密的人都会先问问自己：就你，还想去搞点新鲜的？全球牛人那么多，比你聪明、比你有创造力的那更是海了去了，他们会还没想到这个？这种怀疑的声音往往会在人们还没开始正经探索秘密时，就让他们退缩了，让他们觉得世界之大已经没有任何的个人可以再贡献出什么独特的东西了。", "当然对于上面这些趋势带来的结果，也有一个乐观的描述方法：当今的邪教比较少了。仅仅四十多年前，人们还乐于接纳这么个观点：并不是所有的知识，都是大家伙儿都知道的。所以从共产党到克利须那教派注，很多的人加入先驱启蒙性的组织以求能找到正确的道路，结果当然也有很多人却不幸误入了邪教。而到了今天，稍微异端一点的想法就很少有人去当真了，在社会主流看来，这标志着一种进步。我们确实是可以因为疯狂的邪教已经减少了而感到高兴，但也要知道，为了这一收获，我们付出的代价可是非常的沉重：我们丧失了好奇心，对还未揭晓的秘密已经不再渴求。", "注：克利须那教派，Hare Krishna，印度教的一个分支，正式名称为国际克利须那意识协会，TheInternational Society for KrishnaConsciousness (ISKCON)，其主神威克利须那，Krishna，又译作奎师那，克里希那，中国佛教旧译为“黑天”。美国的克利须那派是由普拉布巴巴（Srila Prabhupada）1966 在纽约城开创并逐渐被认可并流行的。", "落入常规的世界", "你们要是都不相信秘密了，那会怎么看待这个世界？你们必然会认为我们已经妥善处理了所有的重大问题。要是我们当今公认的惯例和常识都是正确的、有效的，凡事都有常规，一切尽在掌握，那我们就满可以沾沾自喜，自鸣得意，哼一哼“上帝在天堂，人间都正常” 。", "注：原文为“God’s in His heaven, All’s right with theworld! ”，是英国诗人、剧作家罗伯特·勃朗宁（RobertBrowning，1812－1889）在其戏剧 Pippa Passes 中的诗歌 Pippa'sSong 中的最后一句。例如说，一个没有秘密的世界应该享有着对“公正”的完美解读。因为任何的不公都必然都涉及到某种还只是被少数人认识到的道德真相，因为在民主社会，错误的行为只有当大多数人并不认为它错误时，才能够长期延续。就像奴隶制度，一开头只有极少数的废奴主义者认为它是邪恶的，后来这种观点逐渐成为共识，然后终于结束了奴隶制度，但是在 19 世纪早期，这种关于奴隶制的认识仍然可以说是个秘密。因此如果要说当今已经没有什么秘密了的话，那就意味着我们生活的社会已经没有什么隐藏着的不公了。", "在经济上，因为不相信秘密依然存在，导致人们了对有效市场注的推崇。但是金融泡沫的存在，则显然昭示了市场可能会完全失效。（其实相信市场有效性的人越多，金融泡沫就会越大。）在 1999 年，没人肯相信互联网的过高估值是不理性的。结果同样的事情 2005 年发生在了房地产：美联储主席艾伦·格林斯潘当时已经不得不承认“局部当地市场出现了泡沫迹象”，但是依然声称“全国性的房地产价格泡沫并不会出现”。因为市场反映出了所有可知的信息，并且不能被质疑。然而接下来的房价一泻千里，危机横扫了整个美国，到 2008 年经济危机共卷走了好几万亿的美元。因此，看起来“未来”还是保有了很多秘密的，而经济学家们不能只是靠着假装看不见，就认为秘密真的消失了。", "注：有效市场，Effective Market，是指这样一种市场，在这个市场上，所有信息都会很快被市场参与者领悟并立刻反映到市场价格之中。这个理论假设参与市场的投资者有足够的理性，能够迅速对所有市场信息作出合理反应，从而市场价格能充分及时地反映了全部有价值的信息、市场价格即代表着真实价值。", "要是一家公司不再相信秘密的存在了，那会发生什么事呢？惠普公司令人惋惜的衰退就是个让人警醒的故事。1990 年的时候，惠普公司的估值是 90 亿美金。接下来是充满发明创造的 10年。1991 年，惠普发布了 DeskJet 500C，世界上第一台大家买得起的彩色打印机。1993 年，它推出了 Omnibook，世界上第一批“超便携”的笔记本计算机之一。再下一年，惠普发布了OfficeJet，世界上第一种集成了打印机/传真机/复印机的多功能复合机器。这种持续的产品扩张带来了丰厚的回报：到2000 年中，惠普的价值已经升到了 1350 亿美金。", "注：惠普公司（Hewlett-Packard Development Company, L.P.，简称HP）是一家全球性的资讯科技公司，是世界最大的信息科技（IT）公司之一，主要专注于打印机、数码影像、软件、计算机与资讯服务等业务。公司于 1939 年由比尔·休利特（Bill Hewlett，1913-2001）和戴维·帕卡德（DavePackard，1912-1996）创建，总部也位于美国加利福尼亚州的帕罗奥图。", "但是从 1999 年后期开始，当惠普发起了一个新的品牌战役、围绕着势在必行的“发明”的时候，它其实已经停止发明创造了。2001 年的时候，它推出了惠普企业服务（HP Services），一个顶着各种光环的咨询和支持商店。到 2002年，惠普和康柏合并了，有可能就是因为它不知道还能有其他什么事可做。到2005 年，惠普公司的市场估值跌到了700 亿美金，差不多只是 5年前的一半。", "当时惠普的董事会就是其机能失调的缩影：它分成了两个派系，只有其中一派关心新科技。这一派由Tom Perkins 领导，他是工程师出身，最早在 1963 年应惠普创始人比尔·休利特和戴维·帕卡德的个人邀请而来到惠普负责研发部门。2005 年的时候他 73 岁了，看起来像是从一去不返的乐观主义年代穿越过来的一样：他认为董事会应该找到最有前途的新科技，然后让惠普来将其应用到产品中去。但是Perkins 这一派被对手打败出局了，对立派系的领导者是当时的女董事长 Patricia Dunn。作为擅长做生意的银行家，她辩称给未来的科技制定发展计划超出了董事会的能力。她认为董事会的角色应该只限于守业者，类似守夜人，要关注的主要是：财会部门是否一切正常？人们是否都在遵守着全部规定？在这场内部斗争的过程中，董事会里有人给媒体泄露了一些其他的机密信息，结果 Dunn 竟然安排了一系列非法的内部监听来试图找到泄密的源头，没想到这一举动引起了强烈的反弹，并最终被曝光了。结果整个董事会颜面扫地，其后果比之前的泄密要更加严重得多。可以说正是由于放弃了去寻找科技上的秘密，才让惠普落得了个流言遍地八卦缠身的地步。而其结果是，到2012 年底的时候，惠普只值 230亿美金了，要是算上通货膨胀的话，比 1990 年多不了多少。", "注：这一事件被称为惠普“电话门”（Hewlett-Packard SpyingScandal）。2006 年初有人向媒体泄露了惠普的业务规划，Dunn认为只有董事会成员才有能力接触并泄露相关信息，于是安排了外部调查公司进行了监听。在认定董事 George Keyworth 是泄密者之后，Dunn在 6 月的董事会上宣布了这一结论并要求 Keyworth辞职，而 Tom  Perkins 则认为这一调查不合法（他也被监听了），并当场从董事会辞职。之后他要求惠普向证监会说明其辞职原因是与董事会有意见分歧，并联合律师和法律顾问继续追究该调查手段的合法性，并最终向证监会及公众披露。结果 Dunn 及其他 4 人被提起公诉，Dunn 虽被撤诉但也从惠普离职，惠普董事会也大幅调整，企业声誉受到极大影响。", "看看秘密这一端", "你不去探索秘密，它们就不会出现。安德鲁·怀尔斯充分展示了这一点，在他证明费马大定理的时候，其他大量的数学家们已经在这个猜想上花费了 358 年的时光和心血，却一直是徒劳无功——这种持续的失败似乎已经宣告这是一项不可能完成的任务。皮埃尔·德·费马在 1637 年提出了一个猜想，推测当正整数 n >2 时，等式 an+ bn = cn 的 a,b,c 没有任何正整数解。费马声称他自己找到了证明的方法，但是在他去世之前并没有写下来，所以这一论述一直作为猜想长期存在，并且成为了数学界最重要的未解难题之一。怀尔斯从 1986 年就开始研究这个课题了，不过他一直对外保密，直到 1993 年他知道自己差不多快要成功解决的时候才说出来。经过了 9 年的辛苦钻研，怀尔斯终于在 1995 年成功的证明了这一猜想。他的成功当然非常需要才华，但是同样需要的，就是对秘密的信仰。如果你认为某件困难的事其实根本就是不可能的，那你就绝不会动手去尝试。相信秘密，本身就是个很有用的定理注。", "注：安德鲁·怀尔斯，Andrew Wiles，1953 年出生，英国著名数学家，证明了数论中历史悠久的“费马大定理”，并在 1998 年国际数学家大会上获得了国际数学联盟的特别荣誉，和为其特别制作的一个菲尔兹奖银质奖章。怀尔斯现在任教于英国牛津大学。", "注：费马大定理，又被称为“费马最后的定理”，Fermat's LastTheorem，由法国数学家费马提出，正文中即有其表述。被提出后，经历多人猜想辩证，期间多国科学院、研究机构及个人都曾悬赏求证，但直到怀尔斯才被真正证明。被证明之前也称费马大猜想。", "注：皮埃尔·德·费马，Pierre de Fermat（1601-1665），法国律师和数学家，在数论和微积分等方面多有建树。由于其全职工作为律师，故也被称为“业余数学家之王”。费马在阅读丢番图（Diophatus）《算术》拉丁文译本时，曾在第 11 卷第 8 命题旁写道：“将一个立方数分成两个立方数之和，或一个四次幂分成两个四次幂之和，或者一般地将一个高于二次的幂分成两个同次幂之和，这是不可能的。关于此，我确信已发现了一种美妙的证法 ，可惜这里空白的地方太小，写不下“。这就是费马大猜想的出处。", "注：事实上，怀尔斯证明费马大定理的过程并不平坦。首先，当时同期的其他数学家，包括怀尔斯的老师，都认为费马大猜想在当时可能根本无法证明；接着，在 1993 年时，怀尔斯宣布证明该猜想之后，数学家们在讨论中发现他的证明中有一处漏洞。而当时怀尔斯并没有找到办法修补这一漏洞。但即使在这种背景和压力下，怀尔斯依然坚持努力了一年多，并终于在 1995 年把该漏洞加以弥补，从而获得了成功和认可。同时可以回想一下本章前面提到的“风险规避”意识，如果怀尔斯努力了半天却发现自己真的错了，那会是什么情况？所以要做到相信这是个可解的秘密，而不是所谓的不解之谜，真的需要过人的才华、勇气和信仰。同时，因为证明中要用到各种定理，而对秘密的信仰也是完成证明的必要条件，所以这里把“相信秘密”也比作一个定理。", "其实世界上还有很多秘密等待着去被发现，但它们只会被勇往直前的探索者们征服。在科学、医学、工程和技术各个方面都还有很多事情要去做。我说的并不止于当前各个常规学科在其竞争边缘设置的那些小小的边际目标，而是也包括那些连科技革命中的英豪们都不敢轻易说出口的雄心壮志。我们可以去治疗癌症、痴呆、各种因年龄增长而导致的疾病和代谢衰退。我们可以去寻找新能源，从而让世界不再为化石燃料而争斗不休。我们可以去发明在地球表面更快的旅行的方法，甚至彻底逃离地球去开拓新的疆界。但是，我们永远也掌握不了这些秘密，除非，我们要求自己去了解，强迫自己去探索。", "注：科技革命，Scientific Revolution，指 16-18 世纪的西方世界里的一系列科技进展带来的思想和社会变革。这一时代位于意大利文艺复兴尾期，法国启蒙运动初期，科技发展包括数学、物理、天文、生物等等各方面，重大成果包括哥白尼的日心说，波义耳的化学，牛顿的数学原理，吉尔伯特的磁学，托马斯·萨弗里的蒸汽机原型，等等。", "在商业上也是一样。成功的企业，其构建的基础，就是那些确实存在、但却还没被其他人发现的秘密。这些秘密，往往是关于这个世界是如何运作的。想想硅谷的新兴企业，很多都是把我们日常生活中常常被忽视掉的闲散资源整合起来而加以利用的。在空中食宿(AirBnB) 出现以前，旅行者们除了花高价住酒店之外没有什么太多其他选择，而同时却有很多业主有闲置的房间，但没有简便可靠的方法出租出去。Airbnb 就抓住了这种“还没被开发的供给”和“仍没被妥善解决的需求”之间所契合出的商机，而其他人在当时则一无所见。个人租车服务公司 Lyft 和优步(Uber) 也是一样。没有什么人能够想到，仅仅是在想搭车的乘客们和愿意载客的司机们之间牵个线搭个桥，就能支撑起价值 10 亿美金的公司。我们早就已经有持证运营的出租车和私人专用的豪车了，所以只有相信并且去寻找秘密，你才能超越思维惯性，去发现一般人看不见的商机。很多的互联网公司，包括 Facebook，往往都被低估了，其原因就在于这些公司的业务模式的简单性。而回头再想想看的话，这种争议本身正是对秘密的极好宣传，也就是说，既然这些看起来如此基本的秘密都能支撑起这么重要而值钱的企业，那一定还有很多会有巨大价值的公司还在等待着去被创办。", "注：空中食宿，AirBnB，成立于 2008 年 8 月，总部设在美国加州旧金山市，是一家帮旅游者和有意（短期）出租空房的房主间进行联系的服务型网站。2015 年 2 月 28 日，美国短租网站 Airbnb 正在进行新一轮融资，而估值将达到 200 亿美元。", "注：Lyft 和优步(Uber)，都是美国公司，产品是手机上的应用程序，作用是帮乘客和（非运营）司机间进行联系租车、约车和拼车等。优步现已进入中国。", "如何找到秘密", "秘密有两种：大自然的秘密，和关于人的秘密。大自然的秘密在我们身边广泛存在，但想要找到它们，需要去研究学习那些客观世界中还没被发现的领域。关于人的秘密则不一样，既可能是人类客观上对于自己还不了解的事情，也可能是人们主观上不想让别人知道所以有意隐藏不说的事儿。所以当你想依托某种秘密来开公司的时候，有两种不同方式的问题可以用来提问：有什么秘密是大自然没有说出来的？或者，有什么秘密是人们没有说出来的？", "大家很容易觉得大自然的秘密是最重要的，探寻这些秘密的人也听起来很让人敬畏，充满权威。这就是为什么物理博士们是出了名的难以合作——因为他们了解那些最基础的客观事实，所以他们总是觉得自己掌握了所有的真相。但是精通于电磁理论是不是就能让你顺理成章的变成婚恋专家？引力学家难道就会比你更了解你的业务？在 PayPal，我曾经为一个工程职位面试过一位物理博士。我的问题刚说了一半，他就打断我抢着说：“停停停！我知道你想要问什么了！”但是他错了。所以这可能是我这辈子最容易的一次决定说不录用这个人。", "关于人的秘密相对就没有那么受到重视，可能是因为你并不需要十几年的高度教育就能提出相应的问题来发掘它们，例如：有什么事情是人们不允许谈论的？有什么相关的禁令或者禁忌？", "但有的时候，用探索大自然秘密的方法，或者用寻找关于人的秘密的手段，都会得到同样的事实真相。回想一下我们说过的关于垄断的秘密：竞争和资本主义是对立的注。这个秘密如果你当时还不知道，你可以通过研究自然科学的方法来通过实际检验而发现它：你只要对一些企业的利润做一些量化的研究调查，就会发现利润都被竞争消磨掉了。但是你也可以通过研究人类问题的方法，来询问：开公司的人有什么事情是不能说的？然后你就能注意到，垄断者们在刻意地贬低自己的垄断地位，从而逃避监督审查；而处于竞争中的公司们，则在有计划的夸大他们的独特性。这样虽然不同公司的间的差异表面上看起来很小，但其实就如冰山一角一样，水面下的差异其实非常巨大。注：参见第三章。", "注：所以企业主们都在隐藏的真相就是：竞争与垄断获得的利润差距巨大。而这一点也就是前面说的关于垄断的秘密，并且这次是用研究人类问题的方法得出的同样的结论。", "寻找秘密最合适的地方，就是没有其他人盯着的地方。大部分人的思考方式都是在学校学来的，而学校本身的目标，就只是传授已成为常规的知识而已。那你们可能会问：有没有什么领域很重要，但是却没有标准化和体制化？物理学，比如说，就是所有重点高校里面最主要的学科之一，因而已经有了完整的体系。和物理学形成对比的可能是天文学，但是天文学似乎又没有那么大影响。营养学这样的学科怎么样？营养学对每个人都很有影响，但是你在哈佛大学还找不能把这个专业作为主修方向，因为绝大多数顶尖科学家都在别的领域里。大部分营养学里的重要研究都是在 3、40 年前完成的，而且很多都有严重的缺陷。比如食物金字塔理论告诉我们要吃低脂的食品，以及大量的谷物，但是这可能是食品公司游说的产物，而不是真正的科学理论：其主要影响没准恰恰是加剧了肥胖症的流行注。这方面还有很多需要去研究的内容，因为我们现在对遥远的星星的认识，都比我们对人类的营养学的了解还要多。这种研究不会很简单，但显然这也不是什么不可能的事情，所以这恰恰就是埋藏着秘密的领域。", "注：1992 年美国农业部公布了“食物指南金字塔”（Food GuidePyramid，简称食物金字塔，或营养金字塔）图表，并称这一图表是指导美国人从均衡饮食中摄取营养的最佳图形。但是其后有各种质疑，认为这是各大食品公司尤其是牛奶及乳制品公司和谷物制品公司游说的结果。后美国农业部在 2005 年发布了 MyPyramid 替代了这一图表，然后在 2011 年又发布了 MyPlate 图表代替MyPyramid 作为饮食指导。", "怎么处理秘密", "如果你找到了一个秘密，你就会面临一个抉择：你要告诉其他人吗？还是只藏在自己心里？", "这要看是什么秘密：有的秘密会比其他的要危险得多。就像浮士德注跟瓦格纳说的：", "少数人诚然从中认识到一点什么", "但却笨到掩藏不住他们的满腹心事", "竟向庸众泄露他们的观察和情绪", "这种人从古至今都没有好下场", "不是被钉上十字架就是被烧死", "注：浮士德， Faust，是德国著名作家、诗人歌德（约翰·沃尔夫冈·冯·歌德，Johann Wolfgangvon Goethe，1749-1832）的代表作《浮士德》中的主角。《浮士德》是一部长达 12111 行的诗剧，以德国民间传说为题材，描写浮士德思想的发展变化和人生探索。歌德于 1768 年开始创作，直到 1832年，前后一共 64 年，即歌德逝世前一年才最后完成。此处的瓦格纳(Wagner)也是其中角色。《浮士德》中文翻译有数个版本，这里的诗句选取的是绿原（1922-2009）的译本。", "除非你的想法完全符合常规，否则的话，对所有的人都把你所有的想法全部都给说出来，通常都不会是个好主意。", "那你应该跟谁说呢？跟你需要去说的人说，仅限于此。在实际操作中，在“谁也不告诉”和“跟所有人都说”之间，通常都能找到一个黄金分割点——那就是一个公司。优秀的企业家都知道这一点：所有成功的企业都是围绕着一个外人不知道的秘密而构建起来的。一个成功的公司就是一场试图改变世界的密谋，而当你分享你的秘密时，接收到秘密的人就成为了你的合谋者。", "如同托尔金在《指环王》中写到的：", "The Road goes ever on and on 路向前方，再向前方；", "Down from the door where it began 身后的门，出发的地方。", "注：《指环王》（The Lord of the Rings），又译作《魔戒》，史诗奇幻小说，被公认为近代奇幻文学的鼻祖，在 1954 年至 1955 年之间出版。作者笔名为 J.R.R. 托尔金，即约翰·罗纳德·瑞尔·托尔金，JohnRonald Reuel Tolkien（1892－1973 年），是英国作家、诗人、语言学家，常年担任牛津大学教授，并曾于 1972 年获英国女王伊莉莎白二世颁授的 CBE 勋章。", "生活，就是一场漫长的旅程，前进的道路是由之前走过的人踩出来的，往往看不见终点在何方。但在故事的后面，出现了另一首诗歌：Still round the corner there may wait峰回之地，路转之处", "A new road or a secret gate隐秘的门，生僻的路", "Tomorrow we may come this way来日方长，或再探访", "And take the hidden paths that run 执此秘径，直上远方", "Towardsthe Moon or to the Sun.至月之暗，达日之光。", "路，未必都没有尽头。走隐秘的路吧。", "注：很多人走的路=>竞争，所以没有尽头。隐秘的路=>垄断，要靠发现秘密才能去走，但是前途充满期待。"], "wcount": 12088}, {"icon": "9", "title": "基础", "paras": ["每个伟大的公司都是独一无二的，但是有些事情需要所有的企业在一开头就必须处理好。请注意，下面这一点我经常反复强调，以致于被朋友们戏称为“蒂尔法则”，那就是：创业公司的基础一旦没有打好就无法弥补。", "开端就是特殊的。它们和之后的一切有本质上的区别。对于宇宙的形成，就是如此。138 亿年前，宇宙在诞生最初的几微秒的时间内，就扩张了 1030 倍，这可是百万亿个万万亿啊！在这最初的短短一瞬间，天体演化的无数新纪元稍纵即逝，而这期间的物理规律与我们通常知道的完全不同。", "而当 227 年前，在咱们美利坚合众国建立的最初，也是如此。在制宪会议的短短几个月时间里，各种根本的问题被提出并由起草者们共同讨论。中央政府应该有多大的权力？国会议员代表席位的名额该如何分配？无论你怎么看待那年夏天在费城达成的草案，它在之后都很难被改变：在 1791 年《权利法案》通过之后，美国宪法只修正过 17 次。加利福利亚州在参议院的席位和阿拉斯加州的一样多，而前者的人口是后者的 50 多倍。这一点可能确实是个特色，而不是个问题，但是估计只要美利坚合众国还存在，那么这项制度就不会改变。由于再召开一次制宪会议是不大可能了，所以我们如今只能就一些较小的话题进行讨论。", "注：1783 年美国独立战争结束后，各州处于邦联体制下，整个国家结构松散不一。1787 年 5 月至 9 月，各州代表在费城召开制宪会议，起草了统一的美利坚合众国宪法（United States Constitution），并于1789 年开始实施。起草者们称为 Framers，包括乔治·华盛顿（George Washington，1732-1799），亚历山大·汉密尔顿（Alexander Hamilton，1757-1804），本杰明·富兰克林（Benjamin Franklin, 1706-1790），詹姆斯·威尔逊（JamesWilson，1742-1798）等人。", "注：1791 年通过的《权利法案》又称《人权法案》，是对宪法的 10条补充修正，主要是保障人民的各项权利，包括信仰、集会、财产及拥有武器等方面。由托马斯·杰斐逊（Thomas Jefferson，1743-1826）等人倡导，主要由詹姆斯·麦迪逊（James Madison, 1751-1836）牵头起草。", "公司在这方面和国家很像。早期的糟糕决定——例如选错了伙伴或者用错了人——一旦做出，是很难在后期去更正的。而即使有人打算去纠正这些错误，也可能会闹出近乎破产级别的内部危机。所以，作为创建者，你的第一项工作就是要把最初的事情做好，因为，破损的基础上建不成伟大的公司。", "基础联姻", "当你打算开始干点什么的时候，最开头的、也是最要命的决定就是你打算和谁一起干。选择合伙人就像结婚，而创始人之间闹矛盾的话就像闹离婚一样丑陋。每一段关系刚开始时都是充满乐观的，而去冷静的思考以后可能会出现的问题就一点也不浪漫了，所以人们通常就不去思考。但是如果创始人之间发展出了不可调和的矛盾的话，公司就会成为牺牲品。", "1999 年，卢克·诺斯克(Luke Nosek)是我在 PayPal 的合伙人之一，直到今天我还在和他一起经营 Founder Fund 基金。但其实在创办PayPal前一年，我就投资了卢克和另一个人合伙创办的一家公司。那是他的第一次创业，也是我的第一次投资。当时我们都没有意识到的是，那一次投资从一开始就注定会失败，因为卢克和他的合伙人就是一个很糟糕的组合。卢克很有才华，有独特的想法；他的合伙人是 MBA 类型的，不想错过 90 年代的淘金热。他们是在一个社交聚会上见的面，谈了一会儿，然后就决定一起办个公司了。这就好比你跑去拉斯维加斯，然后决定去和在老虎机前碰见的第一个人结婚一样：也许是有机会能中个大奖，但是更可能是完全行不通。结果后来他们的公司散伙了，所以害得我也赔了钱。", "现在当我考虑是否要投资一家创业公司的时候，我会考察其创业团队。技术实力和各种能力的互补当然很有讲究，但是创始人之间相互了解多少、一起合作得怎么样，也同样非常重要。创始人之间应该在共同创业之前就互相知根知底——否则这就是在玩丢骰子。", "所有者，操作者与控制者", "并不只是创始人之间要妥善相处，公司里的所有人都需要合作无间。硅谷的自由主义者可能会说，你可以约束好自己，只去做独资经营就好了啊。说的有道理，虽然弗洛伊德、荣格和其他所有的心理学家都有一套理论来说明个人的意志是会如何与他自己悖离的，但是在商场上，为你自己打工还确实可以保证这一点的一致性。但是非常不幸的是，这么做也会限制了你能创办的公司的类型，因为假如没有团队，要实现从 0 到1是极为困难的。", "而硅谷的无政府主义者们则会说，你只要用对了人，就能做到上下完全同心一致，而且即使没有任何管理架构，他们也能相安无事乃至自我繁荣。另外工作场所的别出心裁乃至完全放任自流，据说也可以帮助去“颠覆”在其他地方养成的陈规旧习。确实，“如果人类都是天使，就不需要政府了” 。但是主张无政府式公司的人们忘记了詹姆斯·麦迪逊的真正主张：人们不是天使。这就是为什么运营公司的高管、和督管他们的董事各有各的角色和职责，也是为什么创始人和投资人在公司的权限需要做出明确界定。你既需要公司里的人们之间能够相处得很愉快，但你也需要有结构制度来保障所有人能够长期的保持工作上谐调一致。", "注：If men were angels, no government would be necessary. 詹姆斯·麦迪逊的名言。注：詹姆斯·麦迪逊，James Madison, 1751-1836，美国国父(Founding Fathers)之一，毕业于新泽西学院（后改名为普林斯顿大学），《美国宪法》主要起草人之一，主导制定《权利法案》，美国第四任总统。", "要有效的预见公司里可能会出现的不一致，就要先区分清楚下面三个概念：", "• 所有者：从法律上说，是谁拥有这家公司的资产？", "• 操作者：日常中，谁在一线实际操作着这家公司？", "• 控制者：制度上，谁在督管这家公司的事务？对于典型的创业公司，其所有权会被分配给包括创始人、投资人以及员工，所以他们都是所有者。而负责具体事务的管理人员和员工们，会是公司的实际操作者。董事会成员，通常包括创始人和投资人，则作为控制者进行督管。", "理论上，这种分工顺畅有效。从经济上看，把公司的部分所有权分派出去，可以有效的吸引投资者和员工，并给他们带来回报。对实际操作者来说，他们在实质上运营公司，所以不管是创始人还是其他员工都会很有动力，并且他们也被赋予了一些权力——这意味着他们可以去搞定一切。而董事会的督管，则能够把管理人员的计划放到更广阔的视野里去考量。事实上，把这些职能分配给不同的人确实有其合理性，但是也增加了不谐调一致的情况发生的风险。", "如果想看看这种分工导致的不谐调的极端情况，你去趟 DMV（Department of MotorVehicles，美国车辆管理局）就知道了。假设你需要一张新的驾驶证，理论上应该很容易拿到。大家知道 DMV 是个政府的机构，而我们是民主共和国，也就是说所有的权力都是来自“人民”的，政府是人民选举出来的为大家服务的。所以如果你是美国公民，理论上你也算是 DMV 的部分“所有者” ，而且是你选举出来的人在“控制”着这个机构，所以你只要走着进去、拿着出来就行了。", "事情显然不是这样的。咱们人民虽然“拥有”DMV 的资源，但是这种份额的所有权无异于空谈。实际的操作权掌握在 DMV 的办事员和土皇帝手里，而且他们还很享受这些。政府要员和司法机构虽然名义上对 DMV 有控制权，但实际上也是鞭长莫及。无论当选的要员们采取什么行动，官僚习气都会依然故我的在这儿滋生蔓延。这些小官僚可以仅凭个人意愿，就让你申领驾照的过程变得轻松愉快，或者跟做噩梦一样。因为没有谁来承担责任，DMV 实际上就是变得和其他所有人的期待都不谐调不一致了。当然你可以拿出气势和证据跟他们理论，告诉他们你才是“主人”，但那恐怕也不会真有什么用。", "大公司的情况比 DMV 要好，但也一样会有各自为政的倾向，尤其是在所有者和操作者之间。像通用汽车这样的大公司，其 CEO 会有公司的部分股票，但是份额往往微不足道。所以相对于所有权方面的价值提升，他会更有动力通过在经营中的实际操作给自己带来回报。也就是说，只要每季度的财报足够好看，他就能继续享有高薪和专机。而即使他能得到一些股票作为考虑“股东利益”的回报，利益和兴趣的不一致同样还是可能会产生。因为如果用股票作为短期绩效的奖励的话，对他来讲，简单的削减成本，相比于去投资一个在遥远的将来可能会给全体股东创造更多价值的计划，前者要合算得多，也容易得多。", "注：通用汽车公司，General Motors Corporation，美国汽车公司集团，成立于 1908 年，由威廉·杜兰特创建于美国底特律，目前在120个国家共有 20 万员工，总资产超过千亿美元，旗下有雪佛兰、别克、GMC、凯迪拉克、欧宝、以及五菱等一系列品牌。", "和业界巨头不一样，创业公司前期都很小，因而创始人往往可以同时作为所有者和实际操作者。创业公司的争端往往爆发于所有者和控制者之间——也就是说，来自董事会里的创始人和投资人之间。发生冲突的潜在风险会随时间而增加，因为利益点有分歧：董事会的投资人会希望公司赶紧上市，这样他的投资就有了切实的回报，而公司创始人则可能更愿意继续保持私有，以便继续安心发展业务。", "董事会里，人少才好。董事会越小，董事们之间才更容易沟通交流，才更容易达成一致，才更容易进行有效督管。但是这种有效性也意味着，小型的董事会能够很轻易的在冲突中把对立的管理层赶下台。这就是为什么明智的选择董事成员至关重要：董事会的每一位成员都举足轻重。哪怕只有一位问题董事，他都能让你痛苦不堪，甚至会危及公司的未来。", "三个人的董事会非常理想。除非你的公司已经上市，否则董事会不要超过 5 个人。（政府的法规明确要求了上市公司的董事会规模要比较大——平均是 9 个人。）最糟糕的做法莫过于把董事会过度扩大。好像当没啥经验的人看见非盈利机构的董事会里坐着好几十号人的时候，他们会想：“哇噢，这么多牛人都投身于这个机构了啊！那它得运作的多好啊！”而事实上，巨大的董事会根本不能进行有效的督管，它只不过是能给实际操作运营这个机构的小独裁者打打掩护而已。所以如果你想要的就是那种撒手掌柜式的董事会，那你就去把它撑大。如果你想要的是个切实有成效的董事会，那你就得保证它的规模要小。", "要么上车，要么下车", "通常的原则是，你公司的人应该都是全职的。有时候你不得不违背这个原则：例如，请一些外聘的律师或者会计，这通常也是合理的。不过要注意，任何没有你公司的股权、也不在你公司有固定薪水的人，都是从根本上很难协调一致的。对盈利来说，他们会更倾向收获短期价值，而不是帮助你去在未来创造更多价值。这就是为什么使用外包人员是行不通的。使用兼职人员也不行。就算是远程工作也应该被尽量避免。因为只要同事们不是在同一个地方，或者并不都是全职工作，甚至只要不是每天都全部上班，各种分歧和不一致就会逐渐出现。所以当你要决定是不是要带上某个人一起玩儿的时候，选择只能有两种。肯·克西说的对，你要么上车，要么下车。", "注：此处原文是 Consultant，本意为咨询师或者顾问，但是在欧美的科技企业里，常常是指外包公司派来为其工作的人员，习惯上用Consultant 一词以区别于公司正式雇员 Employee，并不是咨询或者顾问的意思。", "注：肯·克西，Ken Kesey，1935-2001，美国著名小说家。出生于美国科罗拉多州，曾于俄勒冈大学和斯坦福大学学习，后于 1962 发布长篇小说《飞越布谷鸟巢/One Flew Over the Cuckoo's Nest》，并因此成名。该小说以没有精神病但是具有独立精神和反叛意识的主角被迫进入精神病院接受治疗的故事进行对社会的讽刺和批判，出版后在西方引发轰动，1963 年被改百老汇搬上舞台，1975 年被改编为电影《飞越疯人院》并拿下 5 项奥斯卡奖项。", "注：\"You are either on the bus or off the bus\"，这肯·克西的一句名言。他说自己是美国 50 年代“垮掉的一代”和 60 年代嬉皮士之间的纽带，并在 1964 年发起了一场乘坐大巴横跨美国之旅。当时受到各种追捧，成为嬉皮士文化的盛事，但是大巴经过加油站停下来加油后，到该出发时人总不齐，所以他有此一言。但是该旅程因致幻剂的使用也备受质疑。", "现金不为王", "对于全身心投入的人，应该给予适当的报偿。每次有企业主让我投资他的公司的时候，我都会问他打算给自己发多少薪水。CEO 拿的钱越少，对公司的发展就越好——这是我投资了数百家创业公司后，发现的仅有的一个最明确的模式。在薪水方面，有风险投资参与的早期创业公司，其 CEO 无论如何都不应该拿到超过 15 万美金的年薪。他之前在谷歌是不是可以拿更多的钱，他是不是有大额的抵押贷款要还，或者有一大笔私立学校的学费要付，都不应该对此有任何影响。如果 CEO 的年薪到了 30 万美金，那他就有可能会变成个政客，而不再是创业者，这可是很危险的。高额现金报酬会刺激他以维持现有地位和薪水为首要任务，而不是和其他人一起呈现问题并积极解决。而没有什么现金的首席执行官，相比来说，会更愿意专注在提升公司的整体价值上。", "CEO 的低薪也会给其他人设立标杆。阿隆·列维，Box 公司的 CEO，总是很谨慎的坚持给自己开出比全公司其他人都低的薪水——在创办了Box 公司之后 4 年后，他还在距离公司总部两个街区的一间公寓里住着：那儿只是一间卧室，只有一张床垫，没有其他家具。每个员工都注意到了他对公司使命的全身心投入，所以也都纷纷效仿。当然，CEO 要作为模范不一定要拿最低的薪水，他也可以拿全公司里最高的工资。如果他能够树立起正面形象的典范，那只要他的工资数额还比较适度，那实际上也等于给全公司的薪酬设定了一个有效的封顶。", "注：阿隆·列维，Aaron Levie，出生于美国科罗拉多州，2005 年与人联合创办了 Box 公司，提供跨平台的云存储服务。", "现金很诱人。这可是纯粹的真金白银，也就说拿到之后想怎么花都可以。然而，用现金作为报酬会引导员工认为：公司的价值已然具备成型，所以可以从中取走应得的一份；而不是去鼓励他们一起为公司的未来创造新的价值。用现金发奖金比现金薪酬要好一点——至少这确实取决于工作做得很好还是不好。但是这种所谓的激励性报酬也同样只是鼓励了短期思维和价值掇取。任何形式的现金，都更着眼于现在，而不是未来。", "既得利益", "创业公司不需要给很高的薪水，因为它们可以提供更好的东西：公司本身的部分所有权。股票这种形式的报酬，可以有效的引导大家去给未来创造价值。", "但是，想要让股票起到的效果是让大家全心投入而不是引发内讧，你就必须在分配股票份额时非常注意。给每个人相同的份额一般来说是错误的：每位个人都有其不同的特长和职责，每个人的机会成本也各不相同，所以从一开头就平均分配必然看起来是武断而不公的。但是在另一方面，在初期给出的不同配额也一样会让人们觉得不公平。在这个阶段产生的不满有可能会毁掉一个公司，但是并没有一个关于所有权分配的所谓公式可以避免这一点。", "这个问题在更多的人加入公司之后会变得更加的尖锐和敏感。早期的员工通常会得到比较多的股票，因为他们在创业初期就加入，面临的风险比较大；但是在后来加入的员工里，有的人则可能会对公司的成败有着更加关键的影响。eBay的某位秘书的股票可能会比她的老板多 200 倍，这是因为虽然她老板是业界精英，但是他1999年才加入 eBay，而这位秘书 1996 年就入职了。给 Facebook 在公司的墙壁上作画的涂鸦艺术家，2005 年拿了些股票作为报酬，现在价值 2 亿美金，而 2010 年加入 Facebook 的天才工程师可能只拿到了价值 2 百万美金的股票。所以既然不可能完全公平合理的分配所有权，创始人们就应该好好的把分配细节给保密起来。给全公司发个邮件罗列出每个人的持股份额，无异于在你的办公楼里引爆了一颗原子弹。", "大多数人其实根本不想要股票。在 PayPal，我们曾经请过一个顾问，他承诺会帮我们在商务拓展的合同中谈出非常好的价钱。但是他谈的最成功的就只是他自己的薪酬，每天 5000 美金，不要股票期权。尽管有的创业公司成功后，连在公司里做饭的大师傅都变成百万富翁了，可大家还是觉得股票的诱惑力不够大。主要是不像现金是活钱。股票都是和特定的一家公司绑定的，如果那家公司没成功，那它就一文不值了。", "但是，恰恰也是正因为这种限制，股票变成了一种很强有力的工具。任何想要股票而不是现金的人，证明从长远来说他是看好你的公司的，所以愿意拥有公司的一部分，并为之付诸努力去提升公司未来的价值。所以虽然股票不能作为最完美的激励手段，但却是创始人能使公司上下保持团结一致的最佳方案。", "拓宽基础", "鲍勃·迪伦曾说：人若不是忙着新生，就是忙着去死。如果他是对的，新生应该不只是发生一次——你可能有某种方法可以连续的进入这个过程，至少是在诗歌里。但是，一个公司打基础的阶段，则真的只会出现一次：只有在最初的时候，你才有机会制定各种规则，让大家团结一致为未来创造价值。", "注：鲍勃·迪伦，Bob Dylan，（1941 年－），原名 Robert AllenZimmerman，美国摇滚、民谣创作歌手，美国最著名艺术家之一，唱片发行量超过 1 亿，荣获过各项大奖，出道至今已超过 50年但仍具有相当影响力，2012 年美国总统奥巴马还为其颁发了总统自由勋章（Presidential Medal of Freedom）。其创作的\"Blowin'in the Wind\"等歌曲是美国民权及反战的标志性歌曲。", "注：英文歌词原文是 (That) He not busy being born is busy dying.出自 Bob Dylan1964 年创作 1965 年发行的歌曲 It's Alright, Ma(I'm Only Bleeding)。", "最具有价值的那一类公司，对发明创造总是保持开放态度，而这原本只是公司初始阶段的首要特征。这也就引出了关于打基础阶段的第二种解读，这种解读就不是那么显而易见：所谓打基础的阶段，只要创新还在进行，那就还没有结束，而一旦创新结束了，基础阶段也就终止了。所以如果你把基础阶段理解透彻并且把握住了，那你可做的就不只限于创办一家仅仅是有价值的公司：你可以把它驶向更遥远的未来，朝着创新持续不断的前进，而不是停泊在当前成功的港湾自己来当个管理员。你可以持续的把基础拓宽，甚至无限的延伸下去。"], "wcount": 7649}, {"icon": "10", "title": "帮派机制", "paras": ["我们先从一个思考练习开始：理想的企业文化应该是什么样的？员工们应该很热爱工作，他们会非常乐意在公司呆着，以至于没人去看时间是不是该下班了，结果正式规定的工作时间也没人遵守。工作环境会是开放式的，没有隔开成一个个小的格子间，员工会感到和在家里一样：有舒服的豆袋椅，还有乒乓球台，文件柜倒是不怎么能看见。免费的按摩，有师傅现做的寿司，还有瑜伽课程，都可以有，因为这些都会让场面非常温馨惬意。宠物应该也会很受欢迎，或许员工家里的猫猫狗狗也会到办公室来，和公司的那一大水箱的热带鱼一起，作为公司的非官方吉祥物。", "注：“格子间”，现在一般公司会把每个人的工位用一些框架板材分割开，形成一个个小的工作区域，像一个个小格子一样，故而称之为“格子间”。由于格子的遮挡其实并不是从地面直到天花板，而一般只是到视线高度，所以这种布局是半开放式的，介于封闭的办公室式和完全开放式之间。", "这幅景象有什么问题么？这里面包含了在硅谷出了名的一些夸张的福利，但是说实在的，并没有什么实质性内容——而没有实质性内容的福利，对公司来说是没有什么作用的。你可以雇一个设计师来美化你的室内装潢，也可以请一个“人力资源”顾问来调整人事规章，或者找品牌专家来打磨你的广告词，但是这些都并不能帮你达成任何有实质意义的事情。“公司文化”不能脱离公司本身而存在：文化不是一个公司“可以有”或者“有没有”的东西；每个公司，本身就是一种文化。创业就是一组人为了相同的使命聚在一起，而所谓文化的好坏，就是要钻到这个团体里面，从内部去看看是什么样子。", "超越职业性", "我所创建的第一个团队，成名后在硅谷被人们称作是“PayPal 帮”，这是因为有很多当时的同事，到后来仍然在相互扶持，从而创办或者投资了很多成功的科技公司。我们卖掉 PayPal 的时候是 2002 年，卖了 15 亿美金。从那之后，埃隆·马斯克创办了太空探索技术公司（SpaceX），并联合创办了特斯拉跑车公司（TeslaMotors）；里德·霍夫曼联合成立了领英（LinkedIn）；陈士骏、查德·赫利还有贾德·卡林姆一起建立了YouTube ；杰里米·斯托普尔曼和罗素·西蒙斯共同创办了 Yelp ；戴维·萨柯斯建立了 Yammer ；而我则联合创办了 Palantir。这 7家公司，现在每家的价值都在 10 亿美金以上。PayPal的办公环境从来都没怎么被羡慕过，但是整个团队都干得非常出色，无论是当时在一起工作的时候，还是后来分开后各自单飞以后： 这种文化是如此之强大，足以超越一开头的那个公司而存在。", "注：里德·霍夫曼，Reid Hoffman，1967 出生于美国加利福利亚州帕罗奥图，曾经担任过 PayPal 高级副总裁，后为创办了领英LinkedIn，是硅谷有名的天使投资者之一。", "注：YouTube 是世界上最大的视频网站，公司于 2005 年注册，早期公司总部位于加利福尼亚州的圣布鲁诺，后于 2006 年 11 月被谷歌公司以 16.5 亿美元收购了。创始人陈士骏（Steve Chen）1978 年出生于台湾；查德·赫利（Chad Hurley）1977 年出生于美国美国宾夕法尼亚州；贾德·卡林姆（JawedKarim ）1979 年出生于德国梅泽堡（当时还属于东德），父亲是孟加拉裔，母亲是德国人。他们三个人都是 PayPal 比较早期的工程师和网站设计师。", "注：Yelp 是美国最大点评网站，2004 年在旧金山成立，2012 年 3 月2日登陆纽交所，股票代码为“YELP”。创始人是杰里米·斯托普尔曼（Jeremy Stoppelman），1977 年生于美国弗吉尼亚州，曾任PayPal 技术副总裁；罗素·西蒙斯（Russel Simmons）也是美国人，细节不详，是 PayPal 的早期工程师。", "注：Yammer 是 2008 年出现的一个针对企业的社交网络服务，2012年被微软以 12 亿美金收购。其创始人戴维·萨柯斯（David OliverSacks）1972 年出生于南非开普敦，5 岁随父母移民美国，1999 年加入PayPal 作为首席运营官（COO, Chief Operating Officer）。", "我们建立这个所谓帮派的过程，并不是把简历排排序，然后很简单的把最有才华的人招进来，就完了。当我还在纽约的一家律师事务所注里工作的时候，我就见识到了用这种方法带来的混乱结果。与我一同工作的律师们在经营着一家很有价值的事务所，他们每一个单独的个人都非常出色。但是他们之间的关系却异常的淡薄。他们整天都在一起，但是有些人之间似乎出了办公室就没什么话可说了。为什么要和一群互相不喜欢的人一起工作呢？很多人可能会认为这是为了挣钱不得不做出的牺牲。但是再看看那个工作场合，各种自由职业者、短期合同工随着每次交易的不同而不断的入职离职入职离职……这可要比彼此冷漠还要糟糕，这简直就是不可理喻。因为要知道，时间是一个人最宝贵的财富，所以花时间和你并不打算长久合作的人一起共事是很奇怪的。如果你没能把你花在工作上的时间，转化成可靠的长期关系这样的果实，那你的时间投资就是失败的——纯粹从财务的角度上看，就是这样。", "注：此处指美国苏利文.克伦威尔律师事务所，Sullivan & CromwellLLP， 作者 1996 年左右曾在此短期工作过。该事务所是一家著名的国际律师事务所，创立于 1879 年，在全球 12 个金融中心城市有分部，共约有 800 名律师，总部设在美国纽约。", "从一开始，我就希望 PayPal 的人们之间关系紧密，而不仅仅是事务性的交往。我认为牢固的关系不仅仅能让我们在一起的工作会更加愉快有效，也会让我们的事业，甚至包括 PayPal之后的整个职业生涯，都变得更加的成功。所以我们当时就着手于去找到真正乐于在一起工作的人们。他们必须要有才华，但是在这之上，更重要的是他们还必须对和我们一起工作感到由衷的高兴。这才是 PayPal 帮的开头。找的就是合谋者", "注：合谋者，Conspirator，参见第八章，“一个成功的公司是一场试图改变世界的密谋，而当你分享你的秘密时，接收到秘密的人就成为了你的合谋者。“", "招聘，对任何一家公司来说都是很核心的能力，绝对不能外包。你需要的人不仅仅是在纸面上展示了各种技能就行了，你需要他们在被招进来以后确实能在一起团结一致的工作。头 4、5 个人可能是被大量的股份或者高级的职务吸引来的，所以更重要的是除了这些非常明显的情况之外，你会怎么回答下面这个问题：第 20 位员工为什么要进你的公司？", "有才华的人们并不需要为你工作：他们有很多选择。所以刚才那个问题你应该换一个更尖锐的问法来问问自己：当人家可以去谷歌赚大钱出大名的时候，人家为什么要进你的公司当第 20 个工程师？有很多的答复都很差劲：“你在这儿得到的期权将来会比其他地方的更值钱。”“你将有幸会和世界上最聪明的人一起工作。”“你会有机会参与解决全球最富挑战性的问题。”呃，值钱的股票，聪明的同事，复杂的问题，有什么不对么？没什么不对。——但是，所有的公司都会这么说，所以这样的答复不会让你凸显出来。这种通用的、无差别的论调没法说明为什么一个应聘者应该加入你的公司，而不是其他人的公司。", "好的答案应该是专门针对你们的公司的，所以在书本里是找不到的。但是通常有两种类型的答案会是比较好的：关于你们的使命的，或者关于你们的团队的。你要想能吸引到你需要的员工，除非你能解释你们的使命为什么令人向往：并不是泛泛的去说明它如何重要，而是要去说明为什么你们做的事情不但很重要，而且换做别人还不见得会去做。对于你们的使命，这是唯一能够使其重要性真正变得独特的东西。好比对于PayPal，如果你觉得“创造一种新的数字货币来替代美元”的想法能让你感到非常兴奋，那我们就会想跟你谈谈；如果不是，那你就不合适。", "但是，即使有了共同的伟大使命，这也是不够的。最有可能会被聘用的应聘者们往往也难免会迟疑，说：“这些人是我愿意和他们一起工作的那种人吗？”这时候你应该能够去说明为什么你的公司对他个人来讲，也是个独特而合适的选择。如果你做不到，那他可能也还是不合适。", "总之，不要去拼福利。会因为免费洗衣或者宠物看护而摇摆不定的人，对你的团队只会有负面的影响。你只要保证基本的福利比如医疗保险，然后就是去承诺其他人给不了的东西：一个机会，和一群很棒的人一起，在一个独特的问题上去做出无可替代的贡献。因为要是说薪酬和福利的话，你可能比不上2014年的谷歌；但是要论使命和团队的话，如果你已经有了合格的答案，那你也许就能和1999 年的谷歌相匹敌。", "硅谷的帽衫下藏着什么？", "从外界看，公司的所有人都应该以相同的方式与众不同。", "这儿不像在东海岸，人们穿着紧身牛仔或者细条纹西服，一看就知道是什么行业的；在山景城和帕罗奥图年轻人们都穿着 T 恤上班。关于说科技公司的人们都不关心穿着的说法已经都传滥了，但是你要是仔细看看这些 T 恤，你会看见不同的 Logo 标志——这标明了穿着这 T 恤的人是哪家公司的，而这对这些科技公司的员工来说非常重要。创业公司在 T 恤或者帽衫上打上公司的标志，就立马能让外人识别出该公司的雇员，而且还让员工们能自然而然的看起来像是一群小伙伴。这种创业公司的“制服”包含了一个简单朴实但是不可或缺的原则：公司的每个人，都应该以相同的方式与众不同——这是一伙有着类似思维的人，全都满腔热情的投身于公司的共同使命。", "注：据说，是时尚人士穿紧身牛仔而商务人士穿细条纹西服。", "麦克斯·列夫琴，我在 PayPal 的联合创始人，他说创业公司的早期员工应该尽可能个性相似。创业公司的资源有限、团队较小，所以必须大家一起快速高效的工作才能存活，而如果大家的世界观价值观比较一致，那在这一点上就会容易得多。早期的PayPal 团队合作的非常好，可能就是因为我们都是同种类型的“讷子”注。我们都热爱科幻：《编码宝典》那是必须要熟读的，而且我们也都很爱看富有资本主义色彩的《星球大战》，要比带有共产主义色彩的《星际迷航》更爱看。最最重要的是，我们都痴迷于创造一种数字货币，而且要是那种由个人来控制而不是政府控制的。要让公司能够运作起来，人们的外表看起来怎么样、他们分别是从哪个国家来的，都不重要，我们需要的是让每个新来的员工都以同等的痴迷专注于相同的使命。", "注：讷子，木讷（nè）的讷，英文 Nerds 的音译。近于中文书呆子的意思，主要是指一些智商很高，但通常不喜欢也不擅长社交的人，而且他们精通的技术领域往往不是那么主流或大众化。因为略带轻蔑，通常用来自嘲用。", "注：《编码宝典》，英文原名 Cryptonomicon，是美国著名的赛伯朋克流作家尼尔·斯蒂芬森 （NealStephenson）1999 年出版的科幻小说，涉及密码，通信，计算机，等等，其中数字货币也是重点内容之一，也许这就是为什么 PayPal 帮必须要熟读这本书的原因。", "注：《星球大战》，Star Wars，是最受欢迎的科幻电影系列，最早由卢卡斯电影公司 1977 年推出第一部，后卢卡斯影业被迪士尼收购。最初由乔治·卢卡斯（George Lucas）导演创作，采用了最先进的高科技及数字制作手段，描述了宇宙中各种星系、文明、生物，表现了波澜壮阔的太空场景和星球大战场面，在全世界所创下的不可思议的票房收入。", "注：《星际迷航》，Star Trek，又译作《星际旅行》，也是最受欢迎的科幻电影系列之一，由美国派拉蒙影视制作。该系列最初由吉恩·罗登贝瑞（Gene Roddenberry）于 1960 年代创作，描述了一个乐观的未来世界，因其包含的各类天马行空的想象、精密的世界观、大量的硬科幻元素以及无微不至的人文主义关怀，使其成为最受欢迎的科幻作品之一。", "做一件事", "从内部看，每个人都应该由明确的分工而得以区分。", "在创业公司里分配工作和责任的时候，一开头你可以把它当做一个简单的最优化问题，只要把各人的能力和要做的任务有效匹配起来就行了。但是就算你真的全都安排得天衣无缝了，你的方案也会很快就失效。一部分原因是因为创业公司的步调很快，所以每个人的角色和职责不会长期保持固定。但是另一方面，这也是因为任务的分配不仅仅是关乎员工和任务之间，也会影响员工和员工之间的关系。在我管理 PayPal 期间，我做的最好的一件事就是让每个人只负责一件事。每位员工的“这一件事”都是独特的，而且每个人都知道我只会根据这一件事来给他打分。起初我这么做只是为了简化人员管理，但是后来我发现了更深一层次的结果：明确的角色分工减少了内部冲突。大多数公司的内部争端都源自对同一职务的竞争，而创业公司在这一点上面对的风险更是很大，因为在公司创办的早期，工作职责的流动性是很强的。而一旦消弭了竞争，大家在建立超越职业性的长期关系时就会容易很多。更重要的是，内部的和谐是能使创业公司活下去的根本。当创业公司失败时，我们常常会想象它是在激烈竞争的外部环境中被对手吞噬的。但其实每个公司也都有自己的内部生态，而派系斗争就会让它们更容易被外部威胁所打败。内部的冲突就好比是自体免疫疾病注：技术上讲致死的病因可能是肺炎，但其实真正的死因是从外部无法一眼看出来的。", "注：自体免疫疾病，Autoimmune disease，是一种人体内自己的免疫系统攻击自己身体正常细胞的疾病，亦作自体免疫问题。人体内免疫系统的抗体原本是针对外来的抗原或体内不正常的细胞（如肿瘤细胞）进行攻击与清除，是保护身体的一种生理机制。但在一些情形下，免疫系统可能会产生出对抗自己身体内正常细胞（甚至细胞内的各种正常组成部份）的抗体，造成不正常的过度发炎反应或是组织伤害，进而影响身体健康造成疾病。这些认友为敌、攻击不该攻击对象的抗体，便称为自体免疫抗体（Autoantibody，亦作自体抗体）。目前还不能完全确定这些自体免疫抗体的成因是什么，故而自身性免疫疾病是很难冶疗的，而且由于是自身引发的疾病，很难利用药物或其它手段来区分利已成份和非已成份。", "在教徒和短工之间", "在那种最严密最紧密的组织里，成员只和其他的成员呆在一起，他们会无视他们的家庭，并抛弃整个外部世界。他们这样做换来的，是非常强烈的归属感，或许还能接触到其他普通民众无法参透的深奥“真理”。我们通常称这种组织为教派，而且有些往往是邪教。这种全身心投入的文化在外界看起来非常疯狂，部分原因是那些最臭名昭著的邪教都是会要命的：吉姆·琼斯注和查尔斯·曼森注他们指的就都是死路。", "注：吉姆·琼斯，Jim Jones，1931 年出生于美国，成立了人民圣殿教（The Peoples Temple），初期只是一个普通的独立宗教小团体，总部在美国印第安纳州印第安纳波利斯市，后来逐渐变成一个邪教。他与信徒在南美洲圭亚那建立了琼斯镇，作为与世隔绝的基地。在 1978 年受到美国议员去该基地调查后，他命人杀死了议员一行，并与 909 名信众集体自杀（当然也包括胁迫及谋杀），其中包括 300 名儿童。", "注：查尔斯·曼森，Charles Manson，1934 年出生于美国，是美国历史上最疯狂的超级杀人王，他所控制的邪教组织“曼森家族”丧心病狂、杀人如麻。他于 1969 年因 7 条人命被定罪判处终身监禁，但他自称杀了 35 人。", "但是企业主却需要以更严肃的态度来看待这种极度投入的文化。否则难道对工作不温不火的态度才是心理健康的标志？或者非常职业化的态度才是最理性的？与教派形成极端对比是一种咨询公司，例如埃森哲注：这么说不仅仅是因为它没有给自己制定专属的使命，更因为它里面的“顾问们”总是作为短期的外包员工在各个公司间频繁的转换进出，却与这些公司不会有任何长期的联系。", "注：埃森哲，Accenture，是全球最大的管理咨询、信息技术和业务流程外包的跨国公司。前身为美国全球安达信(Arthur Andersen)会计事务所的管理咨询部门，2001 年独立，2009 年以后总部设在爱尔兰都柏林，其客户包括《财富》世界 500 强企业、各国政府机构以及军队。", "下面的线性分布图上，每个公司的文化都可以找到与其对应的某个点：", {"img": "z10-1", "cap": "图10.1"}, "最优秀的创业公司对应的点，应该是在靠近最右端的教派、但是稍微向左一点点的位置。而这里面的差别其实很大，最重要的就是对于各种教派（尤其是邪教），它们在那些重要事物上的非常狂热的观点和看法，往往是错的。而对于那些成功的创业公司，它们所狂热追求的东西却确实是对的，只不过是外人还没有发现而已。既然你不可能会打算从外包人员身上去获得什么有用的秘密、也没必要去介意你的公司对那些死板的职业人士来说有没有意义，那不如就被当作是个另类的教派好了——要不然叫做帮派？"], "wcount": 6797}, {"icon": "11", "title": "做好了，他们来吗？", "paras": ["虽然说销售无所不在，但是大多数人还是低估了其重要性。而硅谷对销售的轻视尤为严重。在极客经典《银河漫游指南》里解释说，正是一场针对销售人员的行动，才导致了我们现在所处的地球是现在这个样子的。故事里说，人类的祖先其实来自另一个星球，当时是因为他们最初的那个家园即将遭遇灭顶之灾，所以所有人要分别乘坐 3 艘巨大的飞船逃离那个星球。思想家、领袖和成功人士乘 A船，销售和外包顾问上 B船，工人和艺术家坐 C 船。B 船是第一个出发的，船上的乘客们都欢呼雀跃，但却还不知道会是空欢喜一场，因为他们没有发现自己其实是中计了：A 船和 C 船的人一直都认为 B 船的人毫无用处，所以早就密谋着想把他们打发掉了。而就是这个 B 船，最后落到了地球上。", "注：极客，即 Geek 的音译，出自美国俚语，原指怪人，呆子。近年来，随着计算机和互联网文化的兴起，这个词常被用于形容计算机和网络技术方面的狂热钻研者或爱好者，不分性别，不分年龄，往往显得智商很高，但也并不排斥社交，尤其在其擅长的领域更是能够夸夸其谈。后来极客这一称谓也被用在关注其他领域的人身上，例如数码产品、电影、音乐和设计等等，因而往往也带点时尚色彩。注：《银河漫游指南》，The Hitchhiker's Guide to the Galaxy，是由英国作家道格拉斯·亚当斯（Douglas Noel Adams，1952-2001）所写的系列科幻小说，最初是他在 1978 年为英国广播公司第四电台(BBCRadio 4)所写的广播剧剧本，讲述主人公阿瑟尔·登特（Arthur Dent）的充满惊奇的星河冒险之旅，充满喜剧色彩。后被改变成为漫画、舞台剧、电视剧和电影等多种形式。", "注：在书中，最初的这个星球叫做 Golgafrincham。而上了 B 船的除了销售和外包顾问之外，还有发型师、制片人、保安，等等。B 船按照阴 谋的设定被扔到了宇宙的边缘地带，落在地球后船上的人逐渐与地球的穴居人融合，成为现代地球人的祖先。", "行销，在虚构的世界里可能无关紧要，但是在我们的世界里却很重要。我们把行销的重要性低估了——这里我们说的“行销”泛指各种有助于把产品卖出去的方式——这是因为我们与 A 船和 C 船的人们一样，有这么种偏见：销售人员以及其他各种的“中间人”都是碍事的，好的产品只要造了出来，自然就会奇迹般的被分发销售出去了。《梦幻之地》式的幻想在硅谷到处都是，结果把工程师们都给误导了，只想考虑要造的东西是不是够酷，而不会去考虑怎么能把它卖出去。但是，如果你仅仅是把东西做出来了的话，客户不会上门。你不得不想办法让人家来，而这事儿比看起来可是要困难的多。", "注：《梦幻之地》，Field of Dreams，1989 年美国环球影业出品的电影，又译作《梦想成真》。改变自 W.P. Kinsella 的小说《赤脚的乔/Shoeless Joe》，主人翁是个农场主，少年时就与父亲失和，有一天他听到神秘声音说：“你盖好了，他就会来。”于是他像着了魔一样铲平了自己的玉米田，建造了一座棒球场，没想到真的见到了棒球偶像，并在经过一系列奇幻事件后，他结开了与父亲之间好多年的心结。讷子对销售", "美国的广告业每年收入 1500 亿美元，从业者超过 60 万人。而美国销售业的规模还要更大，达到了4500 亿美元。当听到说有 320 万美国人在从事销售工作的时候，老练的高管们会觉得这数字太保守了，而工程师们则会感到既吃惊又困惑：这么多的销售人员可都在干些什么呀？", "在硅谷，科技讷子们一向都很怀疑广告、市场营销和销售那一套，因为这些看起来肤浅而不理性。但是广告很重要，因为它们确实管用，对技术讷管用，对你也一样管用。你可能会觉得自己是个例外：我的喜好是来自真实的自我意识，广告那种东西只是对其他人有效。但其实，这只是因为那些最明显的销售伎俩确实很容易去拒绝掉，所以我们对自己意识的独立性会有着虚假的自信。而广告，其实不只是局限于让你立即就买东西，广告更多的是在你的脑海里营造一种潜在的印象，从而在以后能达成实质的销售。任何人如果不承认广告可能对他有潜在的影响，那他就是在自欺欺人。", "讷子喜欢透明。他们的价值是通过成为某个技术领域的专家来提高的，比如成为计算机编程大牛什么的。在工程学的各个领域，一个方案要么行得通、要么行不通，所以你能够相对容易的来评估其他人的工作，而那些表面上的东西就没有那么重要了。不过销售却是正好相反的：他们会大张旗鼓的营造声势来改变表面上的各种观感，却不用去改变藏在底下的现实。所以这给工程师们的印象无非就是小打小闹，甚至干脆就是彻头彻尾的不诚实。技术人员他们知道自己的工作是比较难的，所以当他们看着销售人员们在对着电话谈笑风生、或者去花了两个小时和人吃饭的时候，他们会觉得这不能算是真的在工作。但是说句公道话，因为科技和工程的门槛很明显，所以人们有点高估了这些工作的难度。而被这些技术讷们忽视了的事实是，要让销售看起来很容易，背后也有很多艰难的努力。", "销售是隐形", "的所有的销售都是演员：他们的首要任务是说服而不是诚恳。这也就是“销售”这个词有时候带有点贬义的原因，而二手车的推销员常常就是这种阴暗面的典型代表。不过我们这种排斥反应实际上只是针对那些讨厌的、乍眼的销售人员——就是那些差劲的销售。销售能力的好坏程度上下差距极大：在新手、专家和大师之间有很多不同的级别，在这之上甚至还有特级大师。如果你说没见过谁是特级大师，哈哈，不是因为你真的没遇见过，而正是因为他们高超的技巧把自己隐藏起来了，所以你发现不了。汤姆·索亚成功的让每个路过的小伙伴帮他刷了篱笆——这一手就是大师级的。这本来是他姑姑给他安排的活儿，但是他不单单是让大家帮他干了活，而且还真的做到了让大家要付了报酬才能“有幸”来帮他刷篱笆，这一招可就是特级大师级的了。而他的小伙伴们当然还都蒙在鼓里。自从 1876 年马克·吐温写了这个故事以来，情况其实一直也没怎么发生变化。", "注：汤姆·索亚，Tom Sawyer，是美国小说家马克·吐温 1876 年发表的代表作品《汤姆·索亚历险记/Adventures of Tom Sawyer》的主人公。小说的故事发生在 19 世纪上半世纪美国密西西比河畔的一个虚构的普通小镇上。主人公汤姆·索亚天真活泼、敢于探险、追求自由，不堪忍受束缚个性、枯燥乏味的生活，幻想干一番英雄事业。小说的时代在南北战争前，写的虽是圣彼得堡小镇，但该镇某种程度上可以说是当时美国社会的缩影。小说通过主人公的冒险经历，对美国虚伪庸俗的社会习俗、伪善的宗教仪式和刻板陈腐的学校教育进行了讽刺和批判，以欢快的笔调描写了少年儿童自由活泼的心灵。《汤姆·索亚历险记》以其浓厚的深具地方特色的幽默和对人物敏锐观察，一跃成为最伟大的儿童文学作品，也是一首美国“黄金时代”的田园牧歌。", "注：马克·吐温（Mark Twain），1835 年出生于美国密苏里州佛罗里达，著名作家和演说家，真实姓名是萨缪尔·兰亨·克莱门（SamuelLanghorne Clemens），“马克·吐温”是他的笔名，原是密西西比河水手使用的表示在航道上所测水的深度的术语。马克·吐温 12岁时父亲就去世了，他只好辍学，当小工，后来他又当过领航员、矿工及新闻记者工作并渐渐地着手写一些有趣的小品，开始了自己的写作生涯。马克·吐温一生写了大量作品，题材涉及小说、剧本、散文、诗歌等各方面，风格幽默和讽刺是他的写作特点。马克·吐温是美国批判现实主义文学的奠基人，被誉为“美国文学史上的林肯”。他于1910 年 4 月 21 日去世，享年七十五岁，安葬于纽约州艾玛拉。他的主要作品已大多有中文译本。注：这一段故事很有意思。汤姆的姑姑让他去刷篱笆，他却巧妙或者说捣蛋的让其他小伙伴帮他把活儿都干了，还收获了一堆零食玩具什么的。原因就在于汤姆抓住了营销的要点，对朋友们说 “小孩子刷篱笆的机会可不是每天都有的”，而且假装不情愿让别人来干活，所以要有补偿才肯把劳动的机会让给别人。这只是小孩子的恶作剧而已，但是悲剧的是，在现实生活中，被人卖了还替人数钱的事情，每天都在上演。", "就像演戏要没有表演的痕迹一样，销售最好也不要被察觉。这就说明了为什么营销相关的的各种人员——无论是销售、市场、还是广告人员——他们的职位头衔都看起来和销售无关。贩卖广告的人被称为“客户经理”，推销客户的人是在做“业务开发”，倒卖公司的人则是“投资银行家”。当然，推销自己的人往往被称为“政治家”。这样重新包装命名是有道理的：没有人愿意去说破这里面其实隐含着销售，而我们正在被推销。", "无论从事什么职业，销售的能力将决定你是超级明星还是跑龙套的。在华尔街，新人都是从使用技术能力的“分析师”开始做起的，但他的目标是成为交易员。律师会因为自己的专业资格而自豪，但是律师事务所的领袖是能带来大客户的大神们。甚至大学里的教授，纵然在学术领域里已经可以被称为权威，也会对那些能把自己推销出去、从而得到自己的一席之地的后辈学者心怀妒忌。关于历史或者英语的学术观点，不会仅仅因为占据了知识高点就变得畅销。甚至连最基础的物理学研究或者癌症研究的日程，也是各种游说的结果。所以尽管连商务人士们自己都常常低估了销售的重要性，但其实这个世界确实是在被各种销售从暗中驱动的，我们之所以察觉不到这一点的根本原因，是因为在各个层面上、各个邻域中，销售的重要性都被有意的通过系统性的努力隐藏起来了。", "工程师梦想中的圣器是那种好到可以“自我销售”的产品。但是如果任何人用这样的措辞来描述某个现实中的产品的话，那他一定是在撒谎：要么他是在妄想（就是在骗自己），要么他就是正在推销（所以也自相矛盾）。而与此截然对立的商场老话就警告说：“最好的产品未必常胜”。经济学者将这种现象归结为“路径依赖”，即：特定的历史环境能决定哪种产品能够被广泛接受，而这与产品本身的质量无关。这是真的，但是却也并不意味着我们现在用的操作系统或者键盘布局仅仅是靠着纯粹的运气才取得成功的。最好是将行销作为产品设计中至关重要的部分来考虑。如果你发明了新东西，却没有发现能有效的销售它的方法，那你的生意一定好不了——无论你的产品有多好。", "如何销售产品", "高超的推销与行销，本身就能形成垄断，即使产品本身没有差异化也行。反过来就不可以。无论你的产品有多强——就算它能轻易的融入人们现有的习惯、并且所有用过的人都会立即喜欢上它——你也必须要有一个强大的行销计划来支撑它。", "用两个指标来比较，可以界定有效的行销。你平均在每个客户身上能赚到的净利润 CLV，（CustomerLifetimeValue，客户终生价值），必须超过你获取新客户的平均成本 CAC（Customer AcquisitionCost，客户获取成本）。通常来说，产品的价格越高，你就不得不花更多的钱在销售上——也的确更有道理去花。各种行销的方法参见下面这张分布图：", {"img": "z11-1", "cap": "图11.1"}, "复合营销", "如果你平均每笔销售的额度都是在 7 位数以上，那每一笔交易的每一处细节就都需要有人去密切关注。可能建立起适当的关系就需要好几个月的时间，而每一两年才能成交一笔。而在交易达成之后，在安装阶段你还要继续跟进，并且给产品提供长期的服务。全部这些会很难做到，但是这种“复合营销” 是销售那些最有价值的产品的唯一方法。", "注：复合营销，Complex Sales，即指销售的不仅仅是产品，也包括各种服务，同时也因为所销售的产品及系统的复杂性或重要性，往往操作的流程本身也很长，并且可能涉及买卖双方之外的很多第三方和复杂关系，例如承包商、供应商、鉴定机构、审批机构等等。由于目标通常是大企业和政府，所以有时候也称为企业营销。", "SpaceX 就展示了这是可以做到的。在他创办了这家造火箭的新公司之后没几年，埃隆·马斯克就说服了 NASA 签了些十亿美元的合同，用SpaceX 新设计的航天器来接替退役的航天飞机。政治因素在这种大额交易中的影响和技术因素一样大，所以这很不简单。SpaceX 雇佣了 3000 名员工，大多数都在加利福利亚州。而传统的美国航天工业雇佣了超过 50 万人，在美国全部的 50个州都有分布。所以不出所料的，各个州的议员都不想放弃让属于联邦的资金流入其家乡的机会。好在他们走的是复合营销的路线，所以只需要每年有那么一两份合同成交就可以了，这样一来像埃隆·马斯克这样的特级销售大师就能把时间集中投到那些最最关键的人物身上——甚至可以克服政治扯的后腿。", "复合营销在没有“销售人员”的时候效果最好。在我们 Palantir，就是我和我法学院的同学阿历克斯·卡普（Alex Karp）联合创办的数据分析公司，就没有雇任何人来专门销售产品。不过呢，阿历克斯，作为 Palantir 的 CEO，每个月有 25 天在路上，忙着去和客户或者潜在客户见面。为什么呢？我们每次的交易，数额都在 1 百万到 100 百万之间，在这个尺度上，买家想见的一定是 CEO，而不是负责销售的副总。", "采用复合销售模式的公司，如果在十年左右的时间里每年都能有 50%到 100%的增长，那就是很成功的。这在梦想着病毒式注增长的企业主们看来，似乎有点慢，他们会期望有明显优势的产品一旦被客户认可，就会马上带来 10 倍以上的收入增长。但现实从来不会这样。好的企业营销策略就是从小做起，因为这是必须的：新客户也许会愿意成为你最大的客户，但是如果要签署的交易额度比你之前做过的订单要大很多，他们通常就不会放心去签。所以只有当你已经积累了一批成功的案例来为你的产品背书之后，你才能开始向更大的交易展开漫长而有序的征程。", "注：病毒式，Viral，后面会具体说到。", "人员销售", "大部分的销售都不像复合型那么复杂：平均的交易额度大概在 1 万到10 万美金之间，而且通常 CEO 不用总是亲自包揽所有销售。这种情况的挑战之处不在于保证某次特定销售的成功，而在于如何建立一种操作流程，来让比较小的销售团队可以因此使产品拥有更多的受众。2008 年，Box 公司已经建立了一套好的方法，可以让客户的公司把数据很安全的存储在云端，并且使用也很便捷。但是当时人们还没觉得他们需要这样的东西——因为当时云计算注还没开始流行。那个夏天，Blake 注被聘请为 Box 公司的第三名销售人员来帮忙改善这种情况。从那些急切需要解决文件共享问题的小用户群开始，Box公司的销售代表们逐渐与客户公司里越来越多的用户建立了联系。到2009 年，Blake 把 Box 的一个小型账号销售给了斯坦福大学睡眠研究中心的诊所，因为那儿的研究人员需要一种便捷有效的方式来存储实验数据日志等等。到了今天，这所大学给每个学生和教工都提供了一个专为斯坦福定制的 Box 账号，并且斯坦福医院也在使用Box 的系统服务。而如果他们公司一开头是打算把整套的企业解决方案推销给校长的话，那估计他们什么也卖不出去。采用复合营销的方式会让Box 公司变成被人遗忘的失败创业，而运用了人员销售的途径让它成为了价值几十亿美元的企业。", "注：云端，Cloud，参见下条注释。", "注：云计算，Cloud Computing，即用户通过电脑、笔记本、手机等方式接入网络上的数据和计算中心，按自己的需求进行数据访问和处理。云，或云端，即 Cloud，是网络、互联网及其背后的数据和计算中心的一种比喻说法，比较形象易懂所以广为流行，实际上是分布式计算（Distributed", "Computing）、并行计算（ParallelComputing）、网络存储（Network Storage）等等计算机和网络技术发展融合的产物，并不是单一的新产品或新技术。", "注：即 Blake Masters，本书的协作者，作者在斯坦福讲课时的学员之一。", "有的时候，产品自身也会成为这种行销的一环。ZocDoc 是我们的基金会 Founders Fund 旗下的公司，它的产品是用来帮人在线查找并预约医生的。这家公司从加入其网络的每位医生那里每个月收个几百美元做佣金。所以对于每份交易，这也就是平均几千美金的规模，这就需要大量的销售人员——多到他们有个团队除了招更多的人之外别的什么都不干。但是，对医生们使用人员销售的方式并不是仅仅单纯的带来了收入：由于添加了更多的医生，这也让产品本身对消费者来说更有价值了（并且更多的消费者用户也会使产品更容易吸引医生）。现在已经有超过 5 百万的人在每个月使用这项服务了，所以如果它还能继续扩张它的网络把大多数的从业者都包含进来，那它就会成为整个美国医疗保健业的一项基础工具。", "行销无力区", "在人员销售（显然是需要销售人员的）和传统的广告营销（可以没有销售人员）之间有一片死亡地带。假设你开发了一种软件服务，可以帮助便利店老板跟踪他们的库存和管理订单。这样的产品应该在 1000美金左右的价格区间，但是却会找不到合适的行销渠道来去对接到会买这种产品的小商家。因为纵然你的产品价值定位很清晰，但是你打算怎么去让别人知道这一点呢？去做广告的话，要么受众范围太大（没有哪个电视频道是只给便利店老板看的），要么效率过低（单凭在诸如《便利店新闻报》之类的报纸上登的广告，恐怕说服不了任何店主每年付出 1000美金）。这种产品需要人员销售那样的人力，但是在这种价格定位上，你肯定是没有足够的资源给每个潜在客户都真的派人去谈的。这也是为什么很多中小型企业不去用那些在大公司里必备的工具系统的原因。并不是因为小企业的老板们通常会比较落伍，也不是因为确实没有好的工具：在行销这块儿有个隐藏的瓶颈。", "注：即本章较早之前说的 CLV 必须超过 CAC，在上述这个区间做不到。", "市场营销与广告", "对价格相对较低、受众非常广泛、并且没有病毒式营销手段的产品，市场营销和广告会比较有效。宝洁公司注也承担不起让销售人员去挨家挨户推销家用洗涤品的花费。（宝洁倒确实也有销售人员，但他们是针对连锁的杂货店或者大型的零售卖场去谈的，因为对这些买主可能一次成功的推销就能卖出 10 万瓶 1加仑装的洗涤剂）。于是为了能接触到最终用户，经营消费类商品的公司不得不去制作广告在电视上去播放，去在报纸上刊登出各种优惠券，以及通过设计新颖的产品包装盒来吸引眼球。", "注：宝洁，Procter & Gamble，常缩写为 P&G，创于 1837 年，是全球最大的日用消费品公司之一，公司总部位于美国俄亥俄州辛辛那提，全球员工近 110,000 人，其产品包括洗发、护发、护肤用品、化妆品、婴儿护理产品、妇女卫生用品、医药、食品、饮料、织物、家居护理、个人清洁用品及电池等。广告的方式对创业公司来说也能行得通，不过只是在你的客户获取成本和客户终生价值的二者让其他的推广渠道都不划算的时候。我们来看一下电商创业公司 Warby Parker ，这家公司设计并销售带度数的时尚眼镜，他们只在网上销售而不通过线下的眼镜零售店代售。每副眼镜的定价是以大概 100 美元为基准，那假设每个客户一辈子买他几副眼镜的话，这家公司的 CLV 也就是几百美元。这对于派销售人员去跟进每笔交易来说太小了，但是对于另一个极端，病毒式营销，价格上百美元的实体产品却也没办法做到。所以，是通过了一系列的广告策划和吸引眼球的电视广告的播出，Warby Parker 才成功的把自己又好又不贵的产品展示在了数百万戴眼镜的用户眼前。这家公司在它的网站上也明白的写着“电视就是超级大喇叭”，没错儿，如果你只能付得起每客户几十美金的获取成本，那你就需要这种全世界上能找得到的最大最大的大喇叭。", "注：Warby Parker 成立于 2010 年，总部在美国纽约，名称来自“垮掉的一代”的代表人物、作家杰克·克鲁亚克（Jack Kerouac）的日记中的两个人物。Warby Parker 的特色一是可以免费送 5 副眼镜上门试戴，满意后再下单购买；二是每卖出一副眼镜，就同时向慈善机构捐赠一副。", "每个企业主都会去羡慕那些令人印象深刻的广宣运动，但是创业公司应当要抵制住诱惑，不要去和大公司拼广告，不要去在怎么让电视上的广告被最多人记住、怎么制造最精彩的公众噱头上无休止的竞赛。这是我的切身经验。当我们还在 PayPal 的时候，我们曾经请了《星际迷航》中斯科提的扮演者詹姆斯·杜汉来担任我们的官方代言人。当我们发布给 PalmPilot 掌上电脑开发的第一款软件的时候，我们搞了个发布会，请了很多记者，然后请詹姆斯念了我们精心准备的不朽名句：“我一生都在传送人，这次我终于可以传送钱了！”结果搞砸了——真的来出席了发布会的人本来就不多，而且他们听了这话都无动于衷。我们都是技术讷子，所以我们觉得对于技术上的事儿，总工程师斯科提应该比船长柯克注更有发言权。（其实说起来，柯克船长就像销售人员一样，喜欢在一些奇怪的场合大张旗鼓的卖弄，但结果总是搞得要工程人员们来把他从自己刨的坑里捞出来。）结果我们错了，Priceline.com 让威廉·夏特纳（柯克船长的扮演者）出演了一个系列电视广告，效果好极了。不过，当时Priceline 已经是业内大户了。没有哪个初期的创业公司能够和大公司去拼广告预算。而柯克船长，显然也是在那一个档次的。注：由于总工斯科提经常用传送装置把船长柯克救回来，所以他们觉得自己编的这句话很有意思。蒙哥马利·斯科特（MontgomeryScott），昵称斯科提（Scotty），是星际迷航里的角色，在星舰进取号上担任总工程师，总是可以用不合常规的解法来解决几乎所有遭遇到的工程问题。由加拿大演员詹姆斯·杜汉（James Doohan，1920-2005）饰演。", "注：詹姆斯·泰比里厄斯·柯克，James Tiberius Kirk，是《星际迷航》系列中的主角，联邦星舰进取号的船长。当时柯克在军校期间就有一些故事，然后在军校以优异毕业后参加执行危险任务并生还之后，以 34 岁的年纪成为了星际舰队最年轻的舰长。最早由加拿大演员威廉·夏特纳（WilliamShatner，1931－）饰演，2009 年之后出品的电影中由美国演员克里斯·派恩（Christopher Whitelaw\"Chris\"Pine，1980-）。", "注：Priceline.com，是美国人 Jay Walker 在 1998 年创立的一家基于C2B 商业模式的旅游服务网站，是目前美国最大的在线旅游公司，属于典型的网络经纪，它为买卖双方提供一个信息平台，以便交易，同时提取一定佣金。", "病毒式营销", "如果产品的核心功能会鼓励用户让他们的朋友们也都来用，那这个产品就可以称之为病毒式的。Facebook 和 PayPal 都能够快速增长就是因为这个原因：每次当有人要分享内容或者进行支付，他们就会自然而然的邀请更多的人加入这个网络。这不单省钱——而且很快。如果每个新用户都至少带来另一个用户的话，就很容易达成指数级增长的连锁反应。理想状态的病毒式循环应该是尽量快速无障碍的。YouTube 上的搞笑视频或者其他网络热点在瞬间就能做访问量过百万的原因，就是因为他们的循环时间极短：看见小猫咪，觉得暖暖的，转给朋友吧！几秒钟就完成了。", "对于 PayPal，最早我们的用户基数是 24 个人，全都是 PayPal 的员工。通过网站广告条的方式获取客户后来被证明太不划算。但是，改成“注册就直接给钱、推荐朋友注册也给钱”的方式之后，我们得到了超常的增长。在这种策略下我们要在每个新客户上花 20 美元，但是得到的用户增长率是每天 7%，也就是大概每 10 天左右我们的用户就能翻一倍。大概 4、5 个月以后，我们就有了几十万的用户，这也成了我们可以去切实发展的机会，在此之上，我们通过对转账服务收取小额的手续费，终于造就了一个成功的公司，收益最终远远超过了我们的客户获取成本。", "对于有可能使用病毒式营销的市场，谁能率先占据其中最重要的地盘，谁就相当于在整个市场的博弈中走出了决胜的最后一手。对于PayPal，我们在获取更多用户的时候也并不是随机的，我们要首先招来的是最有价值的用户。对于基于电子邮件的支付系统来说，当时最显眼的细分市场应该是那数百万的移民，因为他们还在使用西联汇款注给老家打钱。我们的产品会让他们的汇款更轻松，但是他们的交易频度太低了。我们需要找到一个更小的利基市场，在这个市场区间需要有资金的高速流转——我们找到了这个区间，就是 eBay 上的“超级卖家”，也就是在eBay 的拍卖市场里在线销售货品的专业供应商，大概有 20000 家。他们大部分每天都会有好几笔交易要结算，而且他们买进和买出的频度差不多，也就是说这是个比较长期稳定的支付流。由于 eBay 自身的支付手段实在是太差了，这些商家在成为我们的早期用户后非常的热情积极。而一旦 PayPal 主导了这个区间的细分市场，成为了 eBay 的支付平台，就没人能赶得上了——不光在eBay，是在任何地方。", "注：参见第五章最后一节，后发而至。", "注：西联公司，Western Union，是世界上领先的特快汇款公司，迄今已有 150 年的历史，它拥有全球最大最先进的电子汇兑金融网络。公司成立于 1851 年，当时名为纽约和密西西比流域印刷电报公司。1856 年正式更名为西联电报公司。1871 年，引入西联汇款（Western Union Money Transfer）服务，并从此成为公司的主要业务，甚至成为公司的同义词。总部在美国科罗拉多州默里迪恩。", "行销的幂律法则", "对于任何一种企业，上面这些营销方式中总会有一种比其他的都更强力有效，也就是说：行销也有自己的幂律法则注。对于大部分企业主来说这是违反直觉的，因为他们觉得营销方式应该是越多越好。销售人员要请一些，报纸杂志上的广告也要做一点，要是再考虑考虑的话，产品里应该也最好有点适合病毒营销的功能——这就成了大杂烩，行不通的。大多数企业连一种行销渠道都搞不好：最常见的失败原因不是因为产品不行，而是销售太烂。只要你能把一种销售渠道运作好，企业就能成功。而如果你各种都去用一下，但是一个也盯不下来，你就完蛋了。", "注：参见第七章，幂律法则。", "推销给客户之外", "公司要推销的不止是产品。你也需要向员工和投资人推销你的公司本身。所以“好产品不需要推销”的谎言也有其他的版本，比如说“人力资源”版：“这家公司特别好，想进去的人都挤破头了”，当然也有筹资融资版本：“这家公司出类拔萃，想投资的人都快把他们家门槛踏平了”。一窝蜂、挤破头的现象是真的会有，只不过这种情况是极少出现的，你要看到表面之下的那些精心策划过的招聘和宣传计划。把你的公司推销给媒体，是把它推销给所有人的必要组成部分。讷子们常常因为不信任媒体就试图无视它们，但是实际上，就像一个好产品，虽然有显著的优点，但你也绝不能没有推广计划就指望人们会来买一样，你也绝不能指望你的公司没有任何公关策略就会被人景仰。而即使你的特定产品因为可以使用病毒式营销而不需要媒体上的曝光率，你也需要通过媒体来帮忙吸引投资人和员工。就说那些值得招募进来的员工吧，只要他们有点远见就会事先做些功课，而他们能在网上搜到的信息，或者那些他们搜不到的信息，无论是关于公司的、还是关于你本人的，都可能会对公司的成功有重大的影响。", "全民销售", "讷子们可能会希望行销活动都被省略掉、销售人员都被发配到其他星球去，而我们也都愿意相信自己的决定都是自己本身的主意，推销对我们不起作用。这些都不对。每个人都有要推销的东西——无论你是普通员工、创始人、还是投资人。甚至于你的公司只有你和你的电脑时，也是这样。抬头看看四周，如果看不见销售人员的话，你就是。"], "wcount": 11208}, {"icon": "12", "title": "人与机器", "paras": ["由于传统的成熟工业已经近乎停滞，而信息科技的进步又是如此的迅猛，以致“信息科技”几乎都已经成为了整个“科技”的同义词。现在，有 15 亿人可以随时通过衣服口袋大小的设备来获取全世界的知识。而如今的任何一台智能手机，其处理能力都比当年引导宇航员登月的计算机要强好几千倍。如果照摩尔定律继续快速发展下去的话，明天的计算机一定会更加强悍。", "计算机已经有足够的能力在一些以前我们认为专属于人类的活动中超越人类了。1997 年，IBM 的深蓝注击败了国际象棋世界冠军加里·卡斯帕罗夫。2011年，《危险边缘》的最佳选手肯·詹宁斯在节目中败给了 IBM 的沃森。到了今天，谷歌的无人驾驶汽车已经在加利福利亚的道路上行驶了。小戴尔·厄恩哈特还不会感到受到了它们的威胁，但是《卫报》已经（站在数百万私人司机和出租车司机的立场上）为无人驾驶汽车“可能引发下一波失业大潮”而深感担忧。", "注：深蓝，Deep Blue，是美国 IBM 公司的一台超级电脑，重 1270公斤，有 32 个大脑（微处理器），每秒钟可以计算 2 亿步。它的硬件和软件都是为国际象棋专门设计的，“深蓝”输入了一百多年来优秀棋手的对局两百多万局。", "注：加里·卡斯帕罗夫，Garry Kasparov（ГарриКимовичКаспаров），前苏联、俄罗斯国际象棋特级大师。1963 年生于阿塞拜疆首都巴库，17 岁晋升国际特级大师，在 22 岁时成为世界上最年轻的国际象棋世界冠军，此后又数次卫冕成功。2005 年退役。1996 年他和深蓝进行了第一轮对局并 4:2 战胜了它，1997 年 IBM 将深蓝升级后他以 2.5:3.5 失利。", "注：《危险边缘》，Jeopardy!，是美国 NBC 广播电视公司的益智问答游戏节目，最早在 1964 年就已开始制作播出。该节目的比赛以一种独特的问答形式进行，问题设置的涵盖面非常广泛，而且以答案形式提问、提问形式作答。参赛者需具备历史、文学、政治、科学和通俗文化等知识，还得会解析隐晦含义、反讽与谜语等，而电脑并不擅长进行这类复杂思考。", "注：肯·詹宁斯，Kenneth Wayne \"Ken\" Jennings， 1974 年出生于美国，职业是作家，在《危险边缘》中保持了最长的连胜纪录，并且总分历史排名第二。", "注：沃森，Watson，另一台超级电脑，由 IBM 公司和美国德克萨斯大学历时四年联合打造，电脑存储了海量的数据，而且拥有一套逻辑推理程序，可以推理出它认为最正确的答案。它的名字是为了纪念IBM 创始人 Thomas J. Watson 而取的。由于 IBM 开发沃森的目的是建造一个能与人类回答问题能力匹敌的计算系统，所以这一系统并不会联网进行搜索，仅靠内部存储的资料库作答。", "注：小戴尔·厄恩哈特，Ralph Dale Earnhardt Jr.，1974 年出生于美国，美国赛车联合会 NASCAR（National Association for StockCar Auto Racing）冠军车手，并拥有自己的车队。他的父亲，戴尔·厄恩哈特，是 NASCAR 的传说之一，也是首批进入名人堂的 3位车手之一，2001 年在比赛中因事故死亡。", "注：《卫报》，The Guardian，是英国的全国性综合内容日报，英国三大报之一。由约翰·爱德华·泰勒于 1821 年创办。因总部设于曼彻斯特，注重报道国际新闻，擅长发表评论和分析性专题文章，一般认为其政治观点为中间偏左。", "大家都认为计算机将来会做更多的事情——多到有人会有疑问说：30年以后还有什么事情需要人类来做吗？“软件正在吞噬世界”，风险投资人马克·安德森这么说的时候听起来似乎已经无可避免。另一位风险投资人安迪·凯斯勒注则解释说提高生产力的最好方法是“去除掉人类”，不过他在这么说的时候听起来还挺高兴的。而《福布斯》则采取了一种更加忧心忡忡的态度，向读者问到：机器会取代你吗？注：马克·安德森，Marc Andreessen，1971 年出生于美国，互联网最早的从业者之一，1993 年即与Eric Bina 一起开发了改变整个互联网的Mosaic 浏览器，后来作为网景公司联合创始人，并逐渐转向投资。这句话出自他 2011 年 8 月刊登在华尔街日版上的文章“WhySoftware Is Eating the World”。注：安迪·凯斯勒，Andy Kessler， 1958 出生于美国，既是投资人也是作家，创办公司的同时也给纽约时报、福布斯杂志等写作。", "注：《福布斯》，Forbes，是美国一份著名的商业杂志，每两周发行一次，以金融、工业、投资和营销等主题的原创文章著称，也报道技术、通信、科学和法律等领域的内容，尤以富豪榜等排行榜单而为人熟知。由苏格兰人 B·C·福布斯（Bertie Charles Forbes，1880-1954）于 1917 创办，总部设于纽约市。福布斯发行的不同版本遍布在世界各地，目前在中国上海市也设有分社。未来主义者看起来基本上都会希望答案是肯定的。卢德主义者注则会非常害怕被取代，所以他们会宁可我们彻底停止开发新科技。双方都没有去质疑“更好的计算机必然会取代人类工作”这一前提条件。但这个前提是错的：计算机是人类的增补者，而不是取代者。在接下来的数十年里最有价值的企业，将由那些尽力去增强人类而不是淘汰人类的企业家们来建立。", "注：卢德主义者，Luddites，又称勒德分子，出现在英国工业革命初期。1811-1816 年间，纺织工人把失业归咎于新出现的纺织机器，于是展开大规模的抵制乃至破坏机器的运动。名称的出处不明，比较流行的说法认为这是当年一个带头的青年的名字，但不可考证。现在泛指持有反机械化、反自动化观点，或者泛泛的抵制科技进步的人。取代与增补15 年前，美国工人在担心会被来自墨西哥的廉价竞争者所取代。这有道理，因为人类相互之间确实可以取代。而到了今天，人们觉得他们似乎又能听到罗斯·佩罗注描述的“巨大的吮吸声” 了，但这次声音的源头不再是提华纳注的工厂了，而是来自德克萨斯州某处的服务器集群。美国人害怕即将出现的科技，因为他们认为这会是过去几年的全球化的再次上演。但是其实二者的情况非常的不同：人类之间会去争夺工作和资源，而计算机什么也不会去争。", "注：罗斯·佩罗， Ross Perot，1930 年出生于美国德克萨斯，曾于1992 和 1996 年以独立候选人身份参加美国总统大选。早期曾在IBM任职，后创立了自己的公司及集团，并曾为史蒂夫·乔布斯和比尔·盖茨提供过资助。", "注：出自 1992 年罗斯·佩罗在总统选战中的演讲。当时他反对北美自贸协定的签署和北美自由贸易区的建立，他认为这会让美国的就业机会流失到墨西哥，因为墨西哥在美国南边，他将此形容为南边的“巨大的吮吸声”。", "注：提华纳，Tijuana，墨西哥西北部城市，位于环太平洋地区，是拉丁美洲的关口，与美国加利福尼亚州的圣地亚哥市相邻，是美国与墨西哥之间最大的国境城市，北美自由贸易区成立后，建有加工出口工业园 区，是墨西哥工业、贸易经济的中心城市。", "球化意味着取代", "当佩罗就外来的竞争提出警告的时候，小乔治·布什和比尔·克林顿二位都在为自由贸易而宣讲布道：既然每个人在不同的工作上都各有所长，那理论上大家应该去专精于能发挥自己优势的工作，然后去相互交易，这样的经济就能使财富最大化。然而这并没有什么用，在实际操作中，自由贸易的效果到底有多好并不是那么清楚明白，至少对很多工人来说是这样。因为相互交易带来的好处，只有当彼此间相对优势的差异化非常显著的时候，才能达到最大化。而要说去做那些重复性的工作，即使只拿非常微薄的薪水，全球也实在是有太多太多的人愿意了。这里我们其实谈的是劳动力的供给。", "那我们再来谈谈需求。人类不止是在工作机会上存在竞争，他们想要的资源也都是一样的。美国的消费者们，在得益于从中国来的低价玩具和纺织品的同时，又不得不去承受更高的汽油价格，因为中国的机动车所有者新增了数百万，他们也都要用汽油。人们不管是在上海吃鱼翅还是在圣迭哥啃鱼肉卷饼，他们都需要吃的东西和住的地方，而欲望不会止步于温饱——随着全球化的继续推进，人们想要的会越来越多。现在上千万的中国农民已经能够保证吃饱了，那他们就会想再吃好点儿，就会想少吃点杂粮多吃点儿肉。而越是所谓上流社会，其欲望的一致性就越是明显：水晶香槟是寡头们的最爱，从圣彼得堡到平壤，都一样。", "注：圣迭戈，San Diego，又译圣地亚哥、圣地牙哥，美国较大的城市，属于美国加利福尼亚州，位于美国本土的西南角太平洋沿岸，与墨西哥接壤。注：墨西哥卷饼，Taco，有时音译为“塔可”等，是墨西哥本土的传统餐食，在欧洲人到达美洲之前就已经出现，是用一张墨西哥薄饼（tortilla）将肉馅、蔬菜等卷起来吃（但是只是半托半卷，不是完整的包裹起来）。", "注：水晶香槟，Cristal，世界著名香槟，出自法国路易·勒德雷尔（LouisRoederer）香槟庄园，包装上有金色标志，采用洁净透明的水晶瓶并覆以金色保护薄膜。中国常译作路易王妃水晶香槟。路易·勒德雷尔酒庄建园于 1776 年，位于法国兰斯（Reims），1833 年改为现名。水晶香槟最早是在 1876 年为俄国沙皇亚历山大三世特别定制的，后来才对外发售。", "注：圣彼得堡，Saint Petersburg，Санкт-Петербург，旧称：列宁格勒，彼得格勒，彼得堡，俄罗斯第二大城市，是俄罗斯通往欧洲的窗口，也是一座科学技术和工业高度发展的国际化城市。曾是沙皇俄国的首都，拥有悠久的历史文化和众多的高等院校、科研机构，俄罗斯在近三个世纪中取得的大多数科学发明成果是出自圣彼得堡。另，本文作者此处英语原文是 Petersburg 而没有加 Saint，而世界上叫Petersburg 的城市非常多。考虑到上下文，应该是指俄罗斯的圣彼得堡。", "科技意味着增补", "现在我们来考虑一下，如果竞争不是来自人类自身，而是来自计算机，会是什么样的景象。在供给方面，计算机和人类的差异可要比任何两个人之间的差异都会大得多了：人类和计算机各自擅长的事情在本质上就是不一样的。人类有主观意识——我们能在复杂的条件下制定计划并作出决定，但我们不大擅于把海量的数据整理出头绪。计算机则相反，他们在数据处理方面性能优异，但是会在一些人类能够轻易做出判断的地方上陷入困境。", "为了让大家对这种差异的程度有更好的认识，我们来看看谷歌的另一个研究以机替人的项目。2012 年，他们的一台超级计算机上了头条，因为在扫描分析了 YouTube 上的 1000 万条视频之后，它对猫的形象的识别率达到了 75%。这看起来很惊人——但你要知道，一个普通的人类小孩子在 4 岁的时候就能把这种判断全部做对。也就是说，当随便一台廉价的笔记本电脑都能在某些任务上击败最聪明的数学家的同时，在另外一些任务上，就算是有 16000 个 CPU 的超级计算机也无法战胜小孩子，所以人类和计算机并不是简单的谁比谁更强的问题——他们的类别就彻底不同。", {"img": "z12-1", "cap": "图12.1"}, "人类和机器的显著差异，意味着与计算机去协作带来的收益要远高于和其他人类去交易。这里我们和计算机不说“交易”，是因为就像和家畜或者台灯一样，我们不会去和它们 “交易”。对了，重点就是，计算机是工具，而不是对手。", "在需求方面，差异就更是巨大。不像正在工业化过程中的那些国家里的人们，计算机可不会去向往奢华的食物或者卡普费拉的海滨别墅；它们需要的就是一些电力，而它们甚至还没有聪明到会自己去索要。当我们设计了一台新的计算机来帮忙解决问题的时候，我们所得到的效率提升，就和我们找了一个超级专业的人类伙伴来合作是一样的，而且还不需要和他竞争资源。准确的说，科技是让我们从这个正在全球化的世界里跳出竞争的唯一途径。当计算机越来越强大的时候，他们不会成为人类的取代者，他们会是增补者。", "注：卡普费拉，Cap Ferrat，又称费拉角，位于法国蔚蓝海岸（Coted'Azur）的一个著名的海滨别墅区，属于尼斯（Nice）管辖的圣让卡普费拉（Saint Jean Cap Ferrat）。它东西两侧分别与尼斯和摩纳哥为邻，背倚阿尔卑斯山，面朝地中海，全年气候宜人，阳光普照，拥有大片的沙滩，从 19 世纪比利时国王利奥波德二世(KingLeopold II of Belgium）开始，就吸引欧洲贵族名流与各国富豪在此修建或购买豪华别墅，据报道，这个小村堪称世界第一贵村庄，所有的别墅都价值 7000 万欧元以上。", "增补与商机", "计算机和人类之间的互补并不只是一个从宏观尺度去谈的现象，这也是创办成功企业的有效途径。这也是我在PayPal 的经验带来的领悟之一。在 2000 年中，我们在成功度过了互联网泡沫破灭带来的.com 关门大潮之后，开始高速发展，但是这时候我们需要去面对一个巨大的问题：每个月我们都因为信用卡欺诈而损失近千万美元。因为我们要处理的交易每分钟有几百上千笔，所以我们不可能每一笔都去审核——质量控制团队的人们绝对做不到恁么快。", "所以我们做了每个工程团队都会去做的事情：我们想把这种审核用自动化来处理。一开头，麦克斯·列夫琴成立了一支由数学家组成的精英团队来仔细研究这些欺诈交易。然后我们把研究成果编写进软件里，这样计算机可以实时的去识别有问题的交易，并将之取消。但是很快就发现这种方式也不行：因为只要过一两个小时，那些网上窃贼们就会察觉，然后就会马上改变他们的策略。我们要对付的是具有很强的灵活性和适应性的敌人，而我们的软件跟不上节奏去做出相应的调整。", "这些欺诈者的闪转腾挪虽然能瞒过我们的自动检测算法，但是我们发现他们没那么容易骗过我们人类的分析师。于是麦克斯和工程团队一起把软件重新调整，采用了一种人机混合的方式：计算机把最有嫌疑的交易标记出来，显示在经过精心设计的界面上，然后人类操作员根据其合理性作出最终的判断。多亏了这个混合系统——我们给它起名叫“Igor”，因为当时有个俄罗斯的网上窃贼吹嘘说我们肯定挡不住他，而他就叫“Igor”——我们在 2002 年的第一个季度扭亏为盈（前一年里我们每个季度要损失 2930万美元）。FBI（美国联邦调查局）也跑来问我们能不能用 Igor 帮他们侦查金融犯罪。这下麦克斯可有得可吹了，他号称自己是“互联网江湖里的名侦探福尔摩斯”，好吧，虽然有点夸张但也算是事实。注：福尔摩斯大家都很熟悉，夏洛克·福尔摩斯，Sherlock Holmes，是19 世纪末的英国侦探小说家阿瑟·柯南·道尔爵士（Sir ArthurConan Doyle，1859-1930）笔下的大侦探。这里要说明的是因为福尔摩斯常常被英国警察请去帮忙破案，所以作者说 FBI 请麦克斯·列夫琴他们帮忙之后，他才如此自诩的。另外这个头衔的翻译有点中西结合，主要也是为了轻松调剂。", "这种人机结合的协同效应让 PayPal 终于站稳了脚跟，接着数以万计的小商家才能够放心的收到他们需要的货款，从而安心在互联网上发展。如果没有这种人类与机器相结合互补的方案，这一切就都无法做到——虽然大多数人对这种方法都没见识过，甚至都没听说过。", "在 2002 年我们把 PayPal 出售之后，我在继续琢磨这件事：如果人类和计算机结合起来产生的效果，比二者分别去做要好很多，那根据这种核心原则，还有没有什么有价值的生意可以去做呢？第二年，我说服了我斯坦福的同学阿历克斯·卡普和软件工程师斯蒂芬·科恩（StephenCohen）来一起办个创业公司，是基于这么一个想法：既然 PayPal 的安全系统采用的人机结合方式这么有效，我们也可以用类似的方式来识别恐怖组织和金融欺诈。我们已经知道了 FBI 一直有这方面的兴趣，所以在 2004 年我们成立了软件公司 Palantir，就是来帮人们从各种不同的信息来源中提取其内在的深层信息的。这家公司目前运营良好，2014 年销售收入 10 亿美元，而且福布斯杂志称 Palantir的软件是“杀手应用”，因为有传言说就是它帮助政府找到了本·拉登。", "关于那次行动我实在是无可奉告，但我们可以说，单凭人类的智慧本身，或者只用计算机，都不足以保证我们的安全。美国有最大的两个情报机构，他们采用的方法是正好相反的：中央情 报局由更注重人力的情报官员们运营，国家安全局则由更重视计算机的将军们领导。中情局的分析人员在大量的各种干扰信息之中艰难跋涉，以致很难有效的识别出最严重的威胁。而安全局的计算机能够处理海量的数据，但是机器还是不能够令人信服的对是不是有人在策划什么恐怖活动做出判断。Palantir 希望能超越这两种不同的倾向：用软件来分析政府提供的数据——例如来自也门的极端教徒的通话记录、或者与恐怖活动地区相关的银行账户列表——然后把有疑点的行为标记出来，提交给训练有素的分析师审查。除了能帮助寻找恐怖分子之外，使用Palantir 的软件的分析人员们已经能够去预测阿富汗的叛乱分子会在哪儿放置爆炸装置；去打击全球最大的儿童色情团伙；去支持疾病预防控制中心对抗食物传播性疾病的爆发；以及通过先进的欺诈检测系统为商业银行和政府每年节省上亿美元。", "先进的软件使这些成为了可能，但是更重要的是其背后的人类，分析师、检察官、科学家和金融专家等等，没有他们的积极参与，软件就会毫无用处。", "想想如今的各种专业人士在他们的工作上是怎么做的。律师们针对棘手的问题必须采用不同的方式进行陈述——采取什么样的说辞要看你面对的是委托人、是对方律师、还是法官。医生们需要与临床诊断信息相结合起来的，是能去和没有专业知识的病患进行有效沟通的能力。而好的教师，不只是要在相应学科非常专业：他们还需要了解如何根据不同学生的兴趣和学习方式来调整自己的教学。计算机可能有能力在这些工作里面做一些事，但是还不能进行有效的整合。所以在法律、医疗和教育领域里应用更先进科技，并不会取代专家；但它们会让专家们能做得更多更好。", "LinkedIn 对负责招聘工作的人员们做的正是如此。当 LinkedIn 在2003 年成立的时候，他们并没有去对招聘人员们进行调研来听取意见，以便找到他们急需解决的痛点。但他们也没有去试图开发个软件来把招聘人员给完全取代掉。招聘工作其实一部分像是侦探，另一部分像是销售：你得仔细审核应聘者们的经历，评估他们的动机和适合程度，然后要去说服其中最有前途最靠谱的人来加入你们。要把这些职能全都用计算机来有效的替换掉，那是不可能的。所以 LinkedIn也并没有这么做，而是由尝试改变招聘人员的工作方式入手。现在，所有的招聘人员里有 97%都在用 LinkedIn，在通过其强大的搜索和过滤的功能来搜寻职位候选人了，并且这个职业社交网络平台也有助于上亿的职业人士通过它来经营自己的个人口碑。如果 LinkedIn 只是试图简单的用科技 来取代招聘人员，那它现在应该已经关门了。", "计算机学科的观念", "为什么这么多人都忽视了这种相互增补的力量？这又要从学校说起。软件工程师们会想去做能取代人类劳力的项目的原因，是因为他们就是这么被培训出来的。要知道学者的名声是通过在其专业领域的研究而获得的，所以他们的首要目标是发表论文著作；而想要发表些什么，就得要遵从该学科的各种限定条件，受制于特定学科本身的局限性。所以对于计算机科学的专家们来说，这就意味着要把人类的各种能力化简抽象成为一些特定的专项任务，然后去调试计算机让它们把这些任务一个一个给攻克。看看计算机科学里最热门的领域你就知道了。“机器学习”这个词本身就能引发关于取代人类的种种联想，而其鼓吹者看起来似乎相信，只要我们给计算机足够的训练数据，它们就能完成任何任务。任何用过Netflix 或者 Amazon 的人都应该亲眼见识过所谓“机器学习”：两家公司都会根据你的浏览和购买历史记录，通过算法分析，来给你推荐一些商品。要是给他们的数据更多，那他们提供的推荐就会更好。谷歌的翻译工具也是一样的道理，它可以提供的多语言之间的互相翻译，虽然比较粗糙，但是马马虎虎可用，而且现在它支持了 80 门语言——但是，这依然不是因为计算机真的理解了人类的语言，而是因为它通过对海量的语料库进行的统计分析，提取出了可以用来匹配互译的模板。", "还有一个词也被炒得很热，它也可以体现出以机器取代人类的思想倾向，那就是“大数据”。现在有的公司对数据的渴求那简直可以说是贪得无厌，但他们错误的认为数据越多就一定能产生越多的价值。而数据通常是不会自己说话的。计算机确实是能够从数据里发现一些人类发现不了的规律、模式，但是计算机不知道怎么去比较来自不同数据源的各种模式，也不知道如何去解释那些比较复杂的行为。具备可操作性的分析见解只能是出自人类的分析人员（或者科幻小说里才有的那种无所不知的人工智能）。我们让自己痴迷于大数据的原因，是因为我们把科技看得过于神奇炫目了。我们会为了计算机能够独立完成的一些小小 功能而大为惊叹，但是却忽视了那些因为人机相互增补而做出的更大的成就，这是因为一旦有人类参与，事情看起来就不是那么炫酷了。沃森、深蓝、以及越来越强大的机器学习算法确实是很酷。但是，在未来最有价值的企业不会去问，有什么问题是可以让计算机独立解决的，而是会去问：“要怎样计算机才能帮助人类解决困难的问题？”", "注：这一节讲的是计算机科学研究的局限性，也就是说，因为学院里计算机科学的研究只限于计算机本身，所以他们研究的主要在于发掘计算机的能力，并不包括计算机和人类的协同互补，这就是学术研究及报告中很少有探讨人机协同的原因。而事实上，即使是单纯的说机器学习或者人工智能本身的发展，到目前为止也依然成果相对有限，有部分原因是因为机器学习虽然是属于计算机科学，但这只是人工智能的一项内容，整个人工智能其实是超越了计算机科学的范畴的，需要和生物学、心理学、哲学等等结合起来，而整个人类对于人类自身的大脑结构和智能机理依然还没有弄清楚。", "越来越智能的计算机，是敌是友？", "计算机科学的未来必然是充满未知数的。现在已经有了很多被赋予了人格的智能机器人，例如苹果的Siri 程序和之前说过的 IBM 的沃森，而它们常常被看做是未来更加智能的机器人们的先驱，或者从某种意义上讲，它们的先知。那人类就会担心，如果将来它们聪明到能够回答人类提出的所有问题，那么就该轮到它们发问了：为什么我们还要服从、服务于人类？", "这种取代主义思想的逻辑终点落在了一个定义上：“强人工智能”，即在任何维度上都胜过人类的计算机。当然，仅仅是这种可能性就一定会把卢德主义者吓坏了。即便是未来主义者也恐怕会有些紧张：强人工智能会完成人类的救赎还是毁灭？这真不一定。科技本应该增强我们人类对自然的掌控，而减少偶然因素的作用；可是制造出比人类还聪明的计算机，可能会把一切又交还给运气，而且没准还是报复性的。强人工智能就像宇宙的一张彩票：我们赢了的话，就进入理想国度；要是我们输了，天网注就会取代我们，并把人类一网打尽。", "注：强人工智能，Strong AI，由美国哲学家约翰·席尔勒(John R.Searle, 1932- ) 首先提出，但他提出该说法时的是要通过一个称之为“中文房间”的实验，来证明即使通过图灵测试等方法，也不能证明某计算机就确实具备“强人工智能”。", "注：天网，Skynet，是一个人类于 20 世纪后期创造的大型计算机智能防御系统，最初是研究用于军事的发展，运行后不久，其人工智能获得自我意识，于是不再服务于人类并且认定人类是它存在的威胁，于是倒戈对抗其创造者，采用大规模杀伤性武器（甚至核弹）来灭绝全人类。出自美国科幻电影《终结者》系列。", "但是，纵然强人工智能真的可能，而不是一个不可捉摸的不解之奥秘，那它也不会在近期到来：被计算机取代这事儿放到 22 世纪再去操心吧。对于遥远的未来的这种不定的恐惧不应该阻止我们今天来做出可定的计划注。卢德主义者认为我们不应该去制造计算机，因为将来也许某天它们就会取代人类；疯狂的未来主义者则可能巴不得如此。这两种观点是互斥的，但这并没涵盖所有的可能：在二者之间还有巨大的空间，让理智的人类在接下来的几十年间可以去建设更加美好的世界。我们会发现计算机的新用途，让它们不仅仅是把人类现在已经在做的事情做得更好；而是让它们帮助我们去做以前无法想象的事情。", "注：可定与不定，以及“计划”和“彩票”，参见第六章，《你不是张彩票》。", {"img": "z12-2", "cap": "图12.2"}], "wcount": 9932}, {"icon": "13", "title": "环保主义与七个问题", "paras": ["在 21 世纪伊始，所有人都认为接下来的一件大事应该就是环保科技。必须是：在北京，雾霾已经严重到从这栋楼看不见那栋楼了——就连呼吸都会危害健康。在孟加拉国，人们遭受到砷含量超标的井水的危害，纽约时报称之为“史上最大的集体中毒” 。在美国，飓风伊万和卡特里娜注似乎预示着全球变暖带来的巨大灾难即将来临。阿尔·戈尔恳请我们向这些问题出击，“事态紧迫，要拿出决心，全体动员，如同面临大战”。人们于是忙碌了起来：企业主们开办了数以千计的环保科技公司，投资人们也为此倾注了 500 亿美金。就这样，一场净化世界的壮举就此展开。", "注：环保科技，Clean Technology，又称清洁技术或洁净技术。因为它涉及的领域非常广，例如回收利用，节能减排，可再生的新能源等等，因而实际上包括材料科技，信息科技，能源科技，生物科技，建筑科技，化工科技等等在内的多个方面，当然也包括生态科学和环境科学本身。", "注：这个说法出自世界卫生组织（WHO，World HealthOrganization）2000 年的一篇报告。报告称孟加拉国有 3300万-7700 万的人的饮用水有可能砷超标。后来又有其他报道说有 200万人出现砷中毒症状并有多人死亡。这些砷超标的饮用水来自孟加拉国全境、数百万个以低科技挖掘的“管状深井”的井水，而讽刺的是，这些井多数是较早前靠国际援助为改善该国居民饮水条件而开凿的。砷，俗称砒，是一种非金属元素，中毒症状包括剧烈胃痛及呕吐、腹泻、痉挛及抽筋，如果量大，将直接导致死亡。流行病学研究表明，长期接触砷与皮肤癌、肺癌的发生有明确的因果关系，并与肝癌、膀胱癌等内脏癌的发生密切相关。动物实验证明，砷有致畸作用。", "注：飓风伊万（Ivan）和飓风卡特里娜（Katrina）分别是美国历史强度上排名第十和第三的飓风，分别生成于 2004 和 2005 年，都达到了飓风等级最高的 5 级，给美国带来了严重的灾害和损失，其中卡特里娜还导致了 1300 余人死亡。", "注：艾伯特·戈尔（Albert Arnold Gore Jr.，一般称为阿尔·戈尔），1948 出生于美国华盛顿。美国政治家、律师、环境学家，曾于1993－2001 年担任美国副总统。由于在全球气候变化与环境问题上的贡献受到国际的肯定，因而获得了 2007 年度诺贝尔和平奖。此处接下来的引言即出自他在挪威奥斯陆领奖时的讲话。", "但是没成功。我们没有得到一个更健康的地球，倒是得到了一个巨大的环保概念泡沫。", "Solyndra 公司注成为了最著名的绿色幽灵，但是其他环保科技公司也大部分遇到了类似的悲惨结局——2012 年一年之内，就有 40 多家太阳能产业的制造商关门或者申请破产。可替代能源的主要指数RENIXX 注显示了这一泡沫的迅速破灭：", "注：Solyndra，美国太阳能电池板生产厂家，2005 年成立于加利福利亚州。中文有翻译称之为索林卓。曾经一度领先于市场并获得 12 亿美元的投资，以及大量的政府贷款和赋税减免，但最终在 2011 年申请破产，并与 2012 年进行了破产清算。由于在破产清算后依然以空壳公司的形式存在了一段时间，所以被作者成为绿色的幽灵。而这里的“绿色”，显然是因为绿色是所有环保的主题颜色。", "注：RENIXX 指数，即世界可再生能源工业指数，RENIXX World(Renewable Energy IndustrialIndex)，2006 年开始发布，是最早的全球可再生能源概念股的股票指数，由全球最大的 30 家可再生能源公司的股票市值计算而成，包括太阳能、风能、水力发电等等。", {"img": "z13-1", "cap": "图13.1"}, "环保科技怎么就失败了呢？保守党当然会觉得他们已经知道答案了：因为一旦这些绿色能源得到了的当局的重视和支持，那它们就快完了注。但是我们确实有理由去重视并支持能源科技，而且即使现在也是一样。所以关于环保产业的失败，不能简单去归咎于政府的失误，其真相要复杂的多，也重要的多。大部分环保科技公司垮台的原因，是因为他们忽视了下面七个问题中的一个或者几个，而这些问题是所有的企业都必须要回答的：", "注：此处是保守党对执政的奥巴马及其政府的嘲讽，因为奥巴马所属的是民主党，而保守党是指共和党和其他偏右的政党，双方是政敌。", "1， 工程问题", "你们有没有突破性的科技，而不仅是增量式的改进？", "2， 时机问题", "针对你要办的这个企业，现在是不是创业的好时机？", "3， 垄断问题一开始你是不是在一个小市场里占有大份额？", "4， 人员问题", "你有没有合适的团队？", "5， 行销问题", "除了创造产品之外，你有没有行销及交付产品的途径？", "6， 持久性问题", "在未来 10 到 20 年，你们的市场地位能不能保住？", "7， 秘密问题", "你们是不是识别出了别人没发现的独特机会？", "这些因素我们之前都分别讨论过。无论是哪个产业，成功的商业计划都必须涉及其中每一点。如果你们对这些问题的没有很好的解答，那你们将来就会碰上很多“倒霉运”，然后你你们的公司就会失败。如果全部的 7 条都有把握，那你们就能掌控财富并且事业成功。甚至只有 5 到6 条也可能会行。但是在环保产业的泡沫里最显著的就是，人们在开始创办企业的时候，甚至连一条问题都没有好好的去回答——这简直就是在期待奇迹降临。", "很难去确切的了解每一家环保科技公司的具体失败原因，因为他们大多数都犯了好几条严重的错误。但是也正是因为这些错误里的任何一条，都足以毁灭一个公司，所以我们很有必要仔细的回顾一下这些环保科技公司的失败，看看究竟都有哪些地方被扣了分儿。", "工程问题", "成功的科技公司都应该有独家科技，而且和最相近的替代产品相比，要好上一个量级。但是环保科技公司往往能做到 2 倍的改善就不错了，更不要去想什么 10 倍的改进。有时候他们提供的东西甚至还不如他们想要去取代的现有产品。比如，Solyndra 开发了一种新型的圆柱形的太阳能电池，但是简单的估算一下就知道，圆柱形的电池效率只会是平板型的1/π——它们能接收到太阳照射的面积就是那么点儿。这家公司于是尝试通过增加一些镜面反射来让圆柱体底部也能接受到辐射，但是想要从比较低的起点跳出来，可不是那么容易。", "注：圆柱体的侧面表面积为 2πrh，r 为半径，h 为高。其接收到的太阳直射面积为其最大截面面积，即2rh，一块宽为 2r 高为 h 的平板型电池就能接收到同样的太阳辐射。", "再说一遍，各个公司都需要努力去实现 10倍以上的改善，因为泛泛的增量式改善，等到了最终用户那里，往往会变得毫无意义。假设你开发了一种新的风力涡轮机，比现有的科技要提高了 20%的效率——但这是你在实验室测的。这在一开头听起来还可以，但是在实验室里取得的成果，如果只是这种程度，并不见得就能弥补新产品在现实世界里上市要面对的成本和风险。而且，你的系统给最终购买它的用户带来的改进，就算确实能做得实打实的 20%，那也不过就是 20%，会被认为是稀松平常而受到各种挑剔质疑，因为大家早都习惯于听到各种夸夸其谈的广告宣传了，所以你的产品还是不见得好卖。只有当你的产品带来的改善和进步确实达到了 10 倍，也就是一个数量级的时候，你的产品才会被客户认为是有显著优势的。", "时机问题", "环保科技业的企业主们曾经很努力的说服他们自己，说属于他们的时刻终于到来了。SpectraWatt 注公司的 CEO 安德鲁·威尔森（Andrew Wilson）在 2008 年宣布这家新公司成立的时候，他说“现在的太阳能产业所处的地位，就像 70 年代末的微处理器产业，有很多亟待解决和需要改进的地方。”最后这句话很正确，但要是去和微处理器产业做什么类比，那就太离谱。自从第一块微处理器在 1970 年面世以来，整个计算机产业的发展就不仅仅是“迅猛”而已，都已经达到了指数级的发展。看看英特尔（Intel）公司早期产品的发布历史：", "注：SpectraWatt，美国公司，成立于 2008 年，专注于太阳能技术，于 2011 年申请破产。有意思的是，这家公司就是从英特尔公司分离独立出来的。", {"img": "z13-2", "cap": "图13.2"}, "而第一块基于硅的太阳能电池，相比之下，却是由贝尔实验室在 1954年制造的——那可是威尔森的新闻稿发布之前半个多世纪啊！光电转换的效率在这中间的几十年里是有发展，但却只是线性发展、非常缓慢：贝尔的第一块太阳能电池的转换效率大概是6%，直到如今的晶体硅电池，或者现代的薄膜电池，在实际使用时的转换效率也不超过 25%。在 2000 年代中期也没有什么工程上的进展可以让人看出即将发生飞跃。进入一个发展缓慢的市场也有可能会是一个好的策略，但是必须有明确而现实的计划去占领市场才行。而这些失败了的环保科技公司什么都没有。垄断问题在 2006 年，亿万富翁、科技投资人约翰·杜尔注宣称说“绿色是新的红、白、蓝” 注。他应该在说到“红”的时候就打住注。就像杜尔自己说的，“互联网这样的市场规模是 10 亿美元级别的，能源市场是万亿级的。”但是他没有明说的是，这种巨大的万亿级的市场，同时也意味着残酷血腥的竞争。其他人常常只知道反复的重复杜尔说出来了的这句话：在 2000 年代，我就曾听到过好几十个环保科技的企业主，在刚刚开始展示他们那些精彩美妙、令人陶醉的PowerPoint演示文档的时候，就以毋庸置疑的口气来叙述说：这儿有个万亿规模的市场——说得好像这是件好事一样注。", "注：约翰·杜尔，John Doerr，1951 年出生于美国密苏里州，莱斯大学电子工程学士，哈佛大学MBA，是美国最有影响力、最具创意、最不拘传统的风险资本投资家之一，被誉为“风险投资之王”。他早期在英特尔供职，后领导风投机构 KPCB（Kleiner PerkinsCaufield & Byres）先后投资过Compaq，Netscape，Symantec，Sun Microsystems，亚马逊和谷歌等等成功的企业。2009 年起被聘请为美国总统经济复苏委员会顾问。", "注：“Green is the new red, white and blue”，这话是杜尔 2006年企业家年会上说的，但是并不是他的原创，而是出自三次获得普利策奖得主托马斯·弗里德曼（Thomas Loren Friedman，1953-）。弗里德曼毕业于牛津大学，现为《纽约时报》专栏作家，因为其著作《世界是平的/The world is flat》而为人熟知。当时他正在构思一本书，叫做这个名字，但是后来改为了纪录片。其中红白蓝是指国旗的颜色，在这里意指环保将是基本国策，甚至是人类立足之本。", "注：如果说到“红”就停止，那就变成了“绿色是新的红色/Green isthe new red”，本来是指下文说到的竞争红海。但译者在查询资料的时候意外发现也有同名的书籍，是美国记者 Will Potter 在2011 年出版的，以自身经历控诉美国政府及情报机构安全机构对激进环保主义者的迫害，称其与之前对“红色”（即共产主义者）的迫害一样。", "注：大市场好不好，以及作者对想从大市场里去分一杯羹的态度，在第五章中即有讨论。环保科技公司的高管们都会强调能源市场的蛋糕很大，足够所有的人来分，而且竟然每一个人都非常相信他们自己的公司就有这本事能切一块儿下来。2006 年，太阳能薄膜制造商 MiaSolé的 CEO 戴夫·皮尔斯（DavePearce）在面对国会听证小组时，承认他们的公司只是在一种特殊的薄膜式太阳能电池的研发方面，几家“很强”的创业公司之一。但是没过几分钟，皮尔斯就预言说 MiaSolé可能会在一年内成为“世界上最大的薄膜式太阳能电池生产商”。这事儿真没成，但其实这本来也就不会是多大的事儿：太阳能电池总共至少有十几种，薄膜式只不过是其中的一种。客户们不会去关心你究竟用的是什么技术，除非你的产品能在解决某个特定问题上有显著的优势。而如果你不能在一个较小的市场上有垄断性的独特方案，那你就会陷入恶性竞争中。MiaSolé的结局就是这样，它在 2013 年被收购了，而收购时的价格比起投资人们砸在这家公司里的钱，要少了好几亿美金注。", "注：MiaSolé，2001 年成立于美国加利福利亚州圣克拉拉，2004 年起陆续融资达 5 亿美金左右（其中就有约翰·杜尔的 KPCB 参与），另外还享受 1 亿美金的抵税。2013 年被中国汉能控股集团以约 3 千万美金的价格收购。夸大自己的独特性，是一种简单的、试图把垄断问题糊弄过去的拙劣手法。假设你在运营一家太阳能设备公司，而且已经成功的安装部署了好几百套太阳能系统，加起来大概能实现总共100 兆瓦的产能。那么有用整个美国的太阳能总产能是 950 兆瓦，所以你占有了 10.53%的市场。恭喜你，你可以告诉自己说：你正经是个人物了。", {"img": "z13-3", "cap": "图13.3"}, "但是如果相关市场不只是美国太阳能市场呢？如果全球太阳能市场才是相关市场，那又会怎么样？全球太阳能的产能是 18 千兆瓦，你的 100 兆瓦现在只不过能让你是条小小鱼而已了：突然之间你拥有的市场份额就变成了 1%。", {"img": "z13-4", "cap": "图13.4"}, "再如果，相应的度量不是基于全球的太阳能，而是所有的可再生能源，那么又会怎样？全球可再生能源的年度产能是 420 千兆瓦，你立刻就又收缩到了 0.02%的市场占有率。再要是去和全球高达 15000 千兆瓦的所有能源的年度产能相比的话，你的 100 兆瓦只不过是大海里的一滴水而已。", {"img": "z13-5", "cap": "图13.5"}, "所以说这些环保科技公司的企业主们关于市场的思维简直混乱得不可救药。他们一边把自己的市场形容的非常细分，以显示自己的差异化，然后却又转过身去大谈特谈看起来能赚大钱的巨大市场，希望基于这个巨大市场给自己估值。但是结果你既不能去主宰一个自己形容出来的虚构的细分市场，又会发现巨大市场里竞争激烈，根本没那么容易去划拉一块蛋糕。所以我说啊，大部分创办环保科技公司的人，还不如去帕罗奥图开家英式餐馆算了。", "注：在帕罗奥图开英式餐馆的事情，请参见第三章。", "人员问题", "能源问题也是工程问题，所以你可能会以为环保科技公司是由科技讷子们在运营的。这你可就错了：那些失败的公司都出人意料的是由非技术团队运作的。这些销售型的高管在募集资本和争取政府补贴上很擅长，但是在制造客户们愿意购买的产品上就没那么拿手了。", "在我们 Founders Fund 基金，我们就曾经见到过很多这样的。最显著的线索就是他们的衣着打扮：很多环保科技公司的高管们是穿着西服打着领带到处跑的。这就像顶着一盏大大的红灯，因为真正的技术人员穿的是 T 恤和牛仔。所以我们设立了一个底线：来参加科技公司投资推介会时，凡是创始人们西装革履的，一律淘汰。如果我们多花些时间来仔细评估各个公司的科技的话，可能也一样能避免那些不好的投资，但是这种直觉——不给CEO 穿西装的科技公司投资——让我们节省了很多时间，能很快的辨明真相。CEO 要是擅于销售没什么不好，但是如果他看起来就像是销售人员，那估计他销售水平也不怎么样，就更别提技术了。", {"img": "z13-6", "cap": "图13.6"}, "行销问题", "环保科技公司有效的迎合并拉拢了政府和投资者，但是他们往往忘记了客户。他们要后来吃到了苦头才了解到这世界不是个实验室：销售和交付产品，至少和产品本身一样重要。", "问问以色列的电动汽车创业公司 BetterPlace 注就知道了。它在 2007 到 2012 年间募集了超过 8 亿美金，都花来打造电动汽车上用的可更换的电池组，和建造给电动汽车充电的充电站了。这家公司试图“创造出绿色的替代技术，以减轻人们对高污染交通运输技术的依赖”。它倒确实是这么做的——通过1000 辆电动汽车至少它确实减少了污染，但这是它申请破产前卖出去的全部数量。其实要说这 1000 辆能卖出去也是很大的成就，因为这些汽车想要让客户买一辆都很难。", "注：Better Place，电动汽车公司，由风险投资支持成立，创始人是以色列人 Shai Agassi (1968- )。公司主要运营在以色列特拉维夫（TelAviv），但是注册在美国加利福利亚州帕罗奥图。", "对于新手来说，你连要买的到底是什么都永远别想搞清楚。Better Place 是从雷诺汽车公司注买来的车体，然后把电池和电动发动机改装进去。所以你到底买的是一辆雷诺的电动车，还是一辆 Better Place的车？先不管这个，反正你想买辆车，那你就还得通过好几个步骤。首先你要通过 Better Place 公司同意。要做到这一点，你得证明你住的离他们的充电站足够近才行，而且还要承诺开车是要按预计的路线走，不能随意到处开。如果你通过了这一点，你还要签署一份充电服务协议来给你的汽车充电。这些都完成之后，你才能开始学习在路上怎么把车停下来更换电池这项崭新的技术。", "注：雷诺汽车公司，Renault S.A.，法国著名车辆制造商，成立于 1899年，以创始人路易斯·雷诺（Louis Renault）的姓氏而命名，图形商标是四个菱形拼成的图案，生产的车辆种类有赛车、小型车、中型车、休旅车、大型车（包含卡车和工程用车及巴士）等，是法国第二大汽车公司，有自己的 F1 车队。", "Better Place 认为它的科技会自己说话，所以没有费心去好好给它做市场。所以当听说这家公司倒闭了的时候，有一位沮丧的客户不由的问道：“他们为什么不在特拉维夫注立一块广告牌，先放上一张丰田普锐斯注的图片，标明价格是 16万谢克尔注；然后再在旁边放上这辆车的图片，标明也是 16 万谢克尔，而且还包含 4 年的燃料？”他还是买到了一辆这种车的，但是不像其他大多数人，他是一位“无论如何都会一直开下去”的爱好者。可惜的是，这事儿连他也做不到了，因为 Better Place 在 2013 年以 1200万美金将所有资产变卖进行了破产清算，当时董事会还说：“我们成功的跨越了所有技术上的挑战，但是有些其他的障碍我们无法逾越。”", "注：普锐斯，Prius，日本丰田汽车一款两箱车型，于 1997 年 10 月底问世，是世界上最早实现批量生产的混合动力汽车。美国是 Prius最大的市场，至 2009 初为止，美国丰田总共卖了超过 60 万辆。注：特拉维夫，Tel Aviv，是以色列第二大城市，滨临东地中海，最初创建于 1909 年，是以色列的经济枢纽，该市具有活跃、摩登、世界主义的特征，被公认是以色列的文化之都。", "注：谢克尔，shekel，以色列货币单位，约合 1.6 人民币。", "持久性问题", "每个企业主都应该计划去成为特定市场里最后出手的那个人。这要从问问你自己开始：世界在 10 到 20年之后会是什么样子，我的企业该怎样切入进去？", "几家环保科技公司能给出好的答案。结果就是，连他们悼词都如出一辙。2011 年在申请破产前几个月，Evergreen Solar 公司注在关掉它的一家美国工厂的时候解释说：", "注：Evergreen Solar, Inc，于 2007 年在美国马萨诸塞州成立。2011年申请破产，关停美国工厂，但其位于中国湖南的工厂还在继续运营。", "中国的太阳能企业获得了政府的大力支持和财政资助……尽管我们的产品成本……已经低于预期水平，并且低于大部分西方厂家，但是依然明显高于中国竞争对手的极低成本。", "但是直到 2012 年这种“都怪中国”的论调才真的此起彼伏。在谈到其破产申请时，美国能源部支持的AboundSolar 公司注指责“中国的太阳能板制造商”，说他们“采用侵略性的定价……以致早期的创业公司，很难在现有的市场环境下发展”。而 2012 年 2月，太阳能板制造商Energy Conversion Devices公司注破产时，不但在发布会上指责中国，而且还针对 3 家主要的中国太阳能厂商提起了 9.5 亿美元的诉讼——还是针对这 3 家中国企业，Solyndra 公司破产事务的管理人在同年晚些时候，也对他们以企 图垄断、相互勾结以及掠夺性定价的罪名提起了诉讼。但是来自中国厂商的竞争真的就无法预料吗？这些环保科技公司的企业主们应该先拿持久性问题好好的问问自己，当然最好换个说法来问：怎么样才能不让中国把生意都抢走？如果他们找不到答案，那他们如今的下场根本就是可想而知的。", "注：Abound Solar，2007 年成立于美国科罗拉多州，曾接受 4 亿美金的政府贷款。2012 年申请破产。注：Energy Conversion Devices，1960 年成立于美国密歇根州，2012 年申请破产。", "在没有预计到来自同类环保产品的竞争这一失误之上，环保科技公司还在对整个能源市场的趋势预判上被严重的误导了。环保能源这个产业建立的前提是传统的化石能源产业即将日薄西山，但是他们却没想到被页岩气打了个措手不及。在 2000 年的时候，美国的天然气里只有 1.7%来自页岩气。但是随着开采页岩气的水力压裂法的技术进步，在 5 年之后这个数值已经攀升到了 4.1%。尽管如此，环保科技业内一直没有人来认真严肃的看待这种趋势：可再生能源是唯一可行的途径；化石能源已经不可能在将来变得更便宜更清洁了。他们错了，化石能源又活过来了。到 2013 年，页岩气已经占据了美国整个天然气供给的 34%，而且价格相比 2008 年下降了80%，这直接推翻了绝大多数可再生能源企业的商业模式。这种水力压裂法可能也并不是一个可持久的能源解决方案，不过这已经足以毁灭那些没能预见其来临的环保科技公司。", "秘密问题", "每个环保科技企业都在用“我们需要一个更清洁的世界”这一公认的事实来证明自己的存在价值。它们自欺欺人的认为，对可替代能源的巨大需求，意味着对各种环保科技公司都是巨大的商机。我们来看看在2006 年的时候，大家对太阳能行情的看涨有多么的普遍。那一年，总统小布什放言未来“太阳能屋顶会让每个美国家庭都能够自己发电”。投资人、环保科技企业高管比尔·格罗斯注宣称“太阳能的潜力是无比巨大的”。Suvi Sharma，太阳能厂商 Solaria 公司当时的CEO，当时承认说，对太阳能产业“有一种淘金的感觉”，而且“也确实有真金子哦——呃，对我们来说，就是太阳光嘛”。但是一窝蜂冲上去拥抱这种共识的后果，就是数十家太阳能电池板的生产厂商——这里只举几个例子，有 Q-Cells, EvergreenSolar,SpectraWatt，甚至格罗斯自己的 Energy Innovation 公司，等等——从充满前途的开端迅速走向了破产法庭。这些阵亡者都曾经用被所有人接受广泛共识来描述自己的光明未来。记得吗？成功的公司要有秘密：成功一定是基于其他人看不见的特定原因。", "注：比尔·格罗斯，William Hunt \"Bill\" Gross ，1944 年出生于美国俄亥俄州，全球债券市场主要操盘手之一。杜克大学心理系获学士、加州大学洛杉矶分校企管硕士，曾在美国海军服役。1971 年联合创办太平洋投资管理公司（PIMCO Pacific InvestmentManagement)，有债券天王之称。2014 离开 PIMCO加入 Janus资本集团。", "注：关于秘密，请参见第八章。", "关于社会性企业的传说", "环保科技的企业主们追求的不止是一般企业意义上的成功。环保科技的泡沫，是“社会性企业”历史上最大的一次集体展现，也是最大的一次败北。这种带有公益慈善性质的企业，最早源自对于企业和非盈利机构一直两极分化的看法：企业的力量很大，但是他们被束缚于利益驱动；非盈利机构谋求公众利益，但他们在经济大局中份量太轻。所以才产生了社会性企业，打算把双方的精华结合起来，“做好事来挣好钱”。可他们通常哪头儿都不行。", "在社会目标和财务目标之间含糊不清并不能带来什么好处。而“社会性”这个词本身带来的歧义，甚至可能更是个问题：比如说某件事“社会效应很好”，那到底是指对社会真的有好处呢，还是只是社会上对这事儿的评价很好？但是不管怎么说，如果所有的人都能给某件事鼓掌的话，那这件事儿肯定只是种泛泛的共识，比如说关于绿色能源的总体概念。", "阻碍社会性企业发展的，并不是企业的贪婪与非盈利机构的善良之间的差异；恰恰相反，阻碍发展的正是二者的相似性。就像企业之间常常会互相抄袭一样，非盈利机构之间往往也都在同时致力于相同的事情。环保科技概念就充分展示出了这么做的结果：在一个宽泛的概念目标之下，产生了几百种毫无差异化的产品。", "要去做些与众不同的事情，因为那才会是真正对社会有好处的——同时，这也是可以让企业通过垄断新市场而获得利润的策略。最好的项目是往往很容易被人忽略的，而不会是在被一大群人鼓吹着的那些；最应该去解决的问题，也正是没有其他人打算去尝试的那些。", "注：要做独醒者。", "特斯拉：7/7", "在过去十年里建立的众多环保科技公司中，特斯拉是极少数到现在还欣欣向荣的公司之一。他们比其他人更好的驾驭了环保科技这一社会热点，而且他们对上述七个问题全部都有合格的答案，所以他们的成功非常值得借鉴：", "技术：特斯拉的技术非常的好，以致于其他传统的汽车公司也为之折服：戴姆勒公司注采用了特斯拉的电池组；梅赛德斯-奔驰汽车应用了特斯拉的传动系统；丰田使用了特斯拉的一款发动机。通用汽车公司甚至还专门成立了工作组来跟踪特斯拉的后续举动。但是特斯拉最伟大的技术成就并不是任何一个单一的汽车部件，而是把所有的这么多部件整合起来构造出一款优异的产品的能力。特斯拉的Model S 轿车，从头到尾都设计得非常典雅，绝不只是把各种部件简单堆砌起来而已：《消费者报告》（ConsumerReports）给它的评分是史上所有汽车里最高的，而《汽车时尚》(Motor Trend)和《汽车杂志》(Automobile)都把它评选为了 2013 年的年度车型。", "注：戴姆勒股份公司，Daimler AG，总部位于德国斯图加特，全球第二大豪华车生产商、第二大卡车生产商。公司是于 1924 由奔驰公司（Benz & Cie，卡尔·奔驰于 1883 年 建立）和戴姆勒公司（DaimlerMotoren Gesellschaft， 1890 年由戈特利布·戴姆勒Gottlieb Daimler 和威廉·迈巴赫 WilhelmMaybach 共同建立）两家家族公司合并建立而成，拥有梅赛德斯-奔驰（Mercedes-Benz）、精灵（Smart）、迈巴赫（Maybach）等知名品牌。此处所说采用了特斯拉电池组的是 Smart 的电动汽车系列，因而区别于下面说到的其他梅赛德斯-奔驰品牌的传统动力汽车。", "时机。在 2009 年的时候，大家很轻易的认为政府对环保科技的支持会持续下去：“绿色任务”是政治要务，联邦基金已经划拨了专门的款项，国会看起来也要通过关于碳排放指标及交易的法案了。当时大家看到那些巨款的时候都觉得这些补贴应该会源源不绝，而唯有特斯拉的 CEO埃隆·马斯克正确的断定这是稍纵即逝的机遇。在 2010 年 1 月，——也就是离 Solyndra 出事之前 1 年半——特斯拉成功的从美国能源部拿到了 4.65 亿美金的贷款，而当 Solyndra在奥巴马执政期间爆出问题之后，补贴问题就变得非常政治化了。所以接近 5 亿的贷款，在 2000 年代初或者 2011 年以后，哪怕直到现在，都是想都不用去想的，能够有可能的只是在那一小小段的时间窗口之内，而特斯拉就完美的抓住了那一个瞬间。垄断。特斯拉是从一个它可以主导的较小的细分市场开始的：高端电动跑车市场。自从 2008年首台Roadster 跑车下线以来，特斯拉总共才卖出去了大概 3000 台这种车，但是按照 10.9 万美金的定价，这可也不是小数目了。从小处开始，让特斯拉有机会可以腾出手来进行研发，从而生产出了稍微便宜一点的 Mode S 型轿车，于是现在特斯拉也占领了豪华电动轿车的市场。仅 2013年他们就卖出了 20000 台轿车，所以现在他们已经为将来再扩张到更大的市场上占据了有利的地形。", "团队。特斯拉的 CEO 既是高明的工程师，也是精明的销售家，所以他组建的团队在两方面都很精通实在是很不出所料。埃隆对他的员工们是这么说的：“如果你进了特斯拉，那你就相当于选择了要进特种部队。哪儿都有常规部队，这没什么不好，但如果你是在特斯拉干活儿，那你的选择就是要打起精神玩儿出彩。”", "行销。大多数公司都轻视了行销环节，而特斯拉对其非常的重视，以致它打造了属于自己的整个销售链条。其他汽车公司要依靠那些独立的经销商：比如福特汽车和现代汽车都只生产汽车，而要通过其他人来进行汽车销售。特斯拉却把汽车的销售和服务都放在了自己的店里。特斯拉采用的这种方式比起传统的使用经销商的方式，先期成本要大很多，但是由于可以对客户的体验有更强的掌控，从而能够强化特斯拉的品牌效应，所以对公司来说，从长远来看是更省钱的。", "持久性。特斯拉在起跑的时候就领先一头，而且后面也跑得一直比别人要快——总之也就是说它的领先优势在接下来几年里会越拉越大。而成为了一个已经被大家所认可的品牌，就是特斯拉已经有所突破的显著标志：要知道汽车是很大件的东西，要购买哪个牌子的汽车，是人们一生中在买东西上需要作出的最重大的决定之一，所以在这种量级上，一个品牌要想赢得消费者的认可，是非常困难的。另外，还有一点和其他汽车公司不同的是，特斯拉的创始人依然还在掌控着公司，所以这家公司在短期内是不会放慢脚步乃至散漫松垮的。", "秘密。特斯拉很明白，时尚可以引领并驱动大家对环保科技的兴趣。有钱人尤其愿意表现得非常环保，所以即使像个方盒子一样的丰田普锐斯、或者粗粗又笨笨的本田音赛特注，他们也会愿意去开。可是那些车，要说会让开它们的人觉得有点儿酷的话，也只有当你能把它们和那些提倡环保的电影明星联系起来、说某某明星也开这种环保车型的时候，才行。所以特斯拉决定说，要造的车嘛，应该让开车的人看起来就很酷，句号。——哎你们知道吗，莱昂纳多·迪卡普里奥注就把他的普锐斯给换了，换了一台很贵的（而且一看就知道很贵的那种）特斯拉 Roadster 电动跑车。当广大的环保科技公司还在挣扎着想让自己有点差异化的特征的时候，特斯拉已经基于一个秘密构建了自己的品牌，那就是：所谓环保科技，与其说是一种环境生态需求，不如说是一种社会热点现象。", "注：音赛特，Insight，是日本本田汽车公司 1999 年推出的一款混合动力汽车。本田公司，HondaMotor Co., Ltd. (本田技研工业株式会社)，是世界上最大的摩托车生产厂家，汽车产量和规模也名列世界十大汽车厂家之列。1948 年由本田宗一郎创立于日本东京。", "注：莱昂纳多·迪卡普里奥，Leonardo DiCaprio，美国著名男演员，1974 年出生于美国加利福尼亚州洛杉矶。1990 年，16 岁的他就参加了电视剧《成长的烦恼》的拍摄。后来出演过众多电影，1995 年因《罗密欧与朱丽叶》荣膺第 47 届柏林国际电影节最佳男主角。1997 年主演的《泰坦尼克号》成为其最为全球及中国观众认知的影片。之后还有《逍遥法外》《谎言之躯》《飞行家》《无间道风云》《盗梦空间》《了不起的盖茨比》等等知名影片。2014 年 9月他因对环境问题的持续关注和宣传，和被联合国任命为关于环境变化的代言人。", "能源 2.0", "特斯拉的成功，证明了环保科技本身并没有什么内在的问题，在其身后的总体概念也是正确的：世界确实需要新的能源。能源是主导性的资源：它会左右我们的食品供给、住所建造、以及一切让我们生活舒适的事物。大部分的世界都还在希望能像当今的美国人民一样生活，但是全球化会使能源方面所面临的挑战愈演愈烈。除非我们能开发出新科技，否则世界上实在就是没有那么充足的能源，能通过既有的手段或者资源的再分配来让所有人都走向富足。", "环保科技产业提供了一条途径，让人们对于能源的未来可以采取乐观的态度。但是当这些不定乐观派的投资人们盲目的去在各种绿色能源公司身上下注的时候，他们没有去考察这些公司是不是有确切的商务计划，还是只是依托于泛泛的绿色能源这一概念，于是泡沫产生了。把 2000年代可替代能源的市值变化曲线，和十年前纳斯达克注的涨跌曲线放在一起，你就会看见几乎一模一样的图形：", "注：纳斯达克，NASDAQ，是美国除纽约证券交易所之外的第二个股票交易机构，也是全球第二大股票市场。1971 年建立，名称原意为美国全国证券交易商协会自动报价表（National Association ofSecuritiesDealers Automated Quotations），因为它是第一个全部采用电子交易系统的证券交易所。由于其主要涵盖各种高新技术企业，所以其市值变化或指数曲线也往往用来作为高新技术行业兴衰的标志，而此处“十年前”指的就是互联网泡沫前后的时期。", {"img": "z13-7", "cap": "图13.7"}, "在 1990 年代也有一个大的概念：互联网产业会很大。但是太多的互联网公司就仅仅只有这个相同的概念，别的什么都没有。企业主并不能因为宏观尺度的见解而有所收益，他必须有在微观尺度上有自己的规划才行。环保科技公司也面临了相同的问题：不管这个世界是多么的需要能源，只有能够针对特定能源问题提供优异的解决方案的公司才能最终赚到钱。没有哪个领域会重要到“只要能参与进去，就能创办出好公司”的程度。", "互联网科技的泡沫比环保科技的泡沫要大得多，所以摔下来的时候也要疼的多。但是 90 年代人们的梦想最终被证明是正确的：那时候人们认为互联网会从根本上改变出版、零售、甚至日常的社交。这种观点曾经被人质疑，而且在2001年互联网泡沫破灭的时候，质疑的人看起来非常的有先见之明。但是放到今天，他们的质疑就是幼稚可笑的了。在互联网泡沫破灭后的那一片.com 废墟之中，新一代的互联网创业公司举着 Web2.0 的旗帜重新崛起了，那环保科技泡沫破灭之后是不是也会有新一代的能源科技创业公司会成功？对于新能源方案的宏观需求依然非常现实。但是有价值的企业必须要起步于找到利基市场并且去占领这个小市场。就像 Facebook，最初只是给一所大学的校园提供服务的，但是后来拓展到了其他学校，再后来遍布了全世界。要给能源方案找到小市场，可能会很需要有一些想法：比如去给偏远的岛屿提供替代柴油的能源方案；或者去建造模块化的反应堆，以便可以在敌对地区的军事设施里快速部署，等等。所以对于企业家们来说，矛盾的地方就是，想要建立能源 2.0 这个大概念，最有挑战的地方却是要先从小方面去进行思考。"], "wcount": 13904}, {"icon": "14", "title": "创始人悖论", "paras": ["创办 PayPal 的一共有六位，其中四人在高中造过炸弹。", "有五个人在那时候还不超过 23 岁。有四个不是出生在美国。有三位还是从共产主义国家过来的：潘宇(Yu Pan)来自中国，Luke Nosek 是从波兰来的，麦克斯·列夫琴是从苏维埃乌克兰。当然，制造炸弹可不是那些国家那个时代的小孩子们通常都会去干的事儿。", "其实我们六个都可能会被认为是怪胎。比如我和 Luke 的第一次聊天是关于人体冷冻的，他当时刚刚签了协议，会在临死前被冷冻起来，等以后医疗科技发达了再看看能不能再复活。麦克斯则说自己没有国籍，并且以此为荣：他们家在苏联解体的时候逃到了美国，从此就算流离于国别之外了。Russ Simons算是混出来的了，他上的是伊利诺伊州顶尖的数学和科学的磁校，要知道他可是在拖车宿营区注长大的。只有 Ken Howery算是符合典型的美国幸福童年形象：他可是PayPal 唯一的童子军雄鹰啊！不过，他以前的同事认为他是发了疯了才会跟我们混在一起的，因为他以前工作的大银行给他的薪水是我们这儿的三倍。所以他也不是那么的完全正常。", "注：磁校，Magnet School，又称磁石学校，是美国特色的公立学校，设置各具特色的教育课程，不受学区限制。最初是 1970 年代为打破种族隔阂而建立的。", "注：拖车宿营区，Trailer Park，美国贫困线以下的人口常常聚居的地方。拖车这里是指拖车式的简易移动房屋或房车，比负担一所房子要便宜很多，并且可以随需要流动。", "注：雄鹰，Eagle，是美国童子军（Boy Scouts of America）的最高称号。美国童子军是世界童子军运动中于 1910 年在美国成立的一个民间组织，核心任务是帮助青少年通过探索和学习如何保持强健的体魄、为将来的职业做准备、承担公民责任。童子军通过参加训练、学会技能（如急救）和完成任务获得表彰和级别晋升。鹰级是其中最高一级，需要掌握一项或几项特殊技能，有一定的组织和领导能力，在童子军中担任职务，并有突出表现才能，才能晋升到这一级别，并且获得相应的徽章。由于其获得的难度，在美国文化中有时候会成为一个人终生的荣誉象征。", {"img": "z14-1", "cap": "图14.1"}, "莫非创始人都是非常人类？还是说，我们只是记住并夸大了他们不一样的地方？更为重要的是，哪种个人特质对于作为创始人来说很有影响？这一章，我们就来谈谈，对于公司来说，如果不是交给那些可被替换的经理人们来管理，而是经由一个非常独特的人来领导的话，为什么会更加有力，但同时也更加危险。", "差异是引擎", "有人强悍，有人软弱，有人天才，有人白痴——但是大部分人都在中间地带。把所有人所处的位置标出来，就可以得到一条钟型曲线：", {"img": "z14-2", "cap": "图14.2"}, "而既然很多创始人都有比较极端的特质，所以大家可能会猜想说如果把创始人的特质分布也画出来的话，应该跟上面的图形大体差不多，但是在两头的人都要多一些，所以图形的两端都会相应的高一些：", {"img": "z14-3", "cap": "图14.3"}, "不过这可完全没有抓住关于创始人的最奇特的地方。一般来说吧，我们会认为相反的特质应该是互斥的：举例来说呢，就是一般人不会同时既贫穷又富有。但是对于创始人们来说，这种事情却经常会发生：创业公司的 CEO 们常常穷到没什么现钱，但是却因为持股很多所以是纸面上的百万富翁。还有就是他们也常常会在面目可憎和魅力四射之间来回摇摆。另外，几乎所有成功的企业家，都会同时既是局内人，也是局外人。而当他们确实成功的时候，他们招来的也会是既有美名也有臭名。所以当你把这些创始人和他们的特质标记出来的时候，会得到一条翻转过来的正态分布曲线：", {"img": "z14-4", "cap": "图14.4"}, "那么这种奇怪又极端的特质组合是从哪里来的呢？他们既可能是生来就有的（先天的），也可能是个别环境所导致的（后天的）。但是更或者，创始人们并不是真的像他们表现的那么极端。他们会不会是出于策略性的考虑去有意夸大一些特质？或者其他人是不是也可能会有所夸大？所有的这些影响都有可能会同时出现，但是不管怎么个出现法儿，他们之间都会不断的相互强化。这种循环通常都是从本就不寻常的人开始，然后以他们的举止和表象变得更加与众不同而结束：", {"img": "z14-5", "cap": "图14.5"}, "如果要举个例子的话，我们来看看理查德·布兰森爵士，亿万富翁，维珍集团注的创始人。他应该被描述成天生的企业家：他在 16 岁的时候就开始了他的第一份生意，在仅仅 22 岁的时候就创办了维珍唱片。但是他一些其他的著名之处——比如说他标志性的狮子鬃毛似的发型——就不是那么先天的了：人们认为他原先并不是那付样子的。由于布兰森细心的经营着他的各种极端的特质（和裸女名模一起玩儿冲浪板是公关手法，或者只是个人的寻欢作乐？要么二者都是？），媒体常常热情的给他加上各种封号：布兰森是“维珍之王”，“毫无争议的公关之王”，“品牌之王”“沙漠和天空之王”。当维珍航空开始给乘客提供形状像布兰森头像的冰块的时候，他就又成了“冰块之王”。", "注：理查德·布兰森，Richard Branson，1950 年出生于英国伦敦。一位具有传奇色彩的亿万富翁，16岁时从创办杂志开始从商，创办维珍品牌并将其拓展为巨大的集团，参见下条注释。他以各种特立独行不拘一格著称，近期的举动之一是在 2013 年与人打赌失败之后，亲自穿上空姐的服装在维珍航空的班机上给乘客服务。早期他曾驾驶热气球飞越大西洋和太平洋，驾驶两栖汽车穿越英吉利海峡，并且都创造了世界纪录。虽然如此，他的个人生活却很稳定，婚姻幸福稳固，育有一子一女。同时热心公众事业，例如 1999 年资助成立国际失踪和受虐儿童中心（ICMEC，International Centre forMissing &Exploited Children），2007 年牵头并资助纳尔逊·曼德拉（Nelson Mandela）成立聚集全球精英领导人的独立团体“长者会”（The Elders）。1999 年底，英国伊丽莎白女王决定册封布兰森为爵士，由查尔斯王子于 2000 年在白金汉宫为他授勋。", "注：维珍集团，Virgin Group Ltd.，是英国最大的私人企业集团，业务范围包括旅游、航空、娱乐业等，目前在全球有 400 家左右的下属公司。维珍品牌最早源自布兰森创办的维珍唱片", "（VirginRecords），旗下曾有许多大牌明星和乐队，后于 1992 年卖给了EMI。1984 年，布兰森成立的“维珍大西洋航空公司”（VirginAtlantic Airways），简称维珍航空，现在是英国第二大国际航空公司。其他著名子公司还有维珍互动（Virgin Interactive），维珍饮料（Virgin Drinks），维珍铁路（VirginRails），维珍移动（Virgin Mobile）等等，当然这些公司也有业务调整或出售了的，但是整体上维珍品牌依然在广阔领域里充满活力。", "那么布兰森会不会只是个普通的商人，但是碰巧在其优秀的公关团队的努力之下，被媒体吹捧起来的呢？或者他自己本身就是品牌塑造的天生材料，所以记者们对他另眼相看乃至被他玩得团团转，本来就是理所应当的？很难说得清——可能两方面都是吧。", {"img": "z14-6", "cap": "图14.6"}, "还有一个例子是肖恩·帕克（SeanParker），他最早是以最最外围的局外人身份出现在大家视野里的——他曾是个罪犯。他在高中的时候本来是个很谨慎的黑客，但是他爸爸觉得对于一个 16 岁的孩子来说，肖恩玩儿电脑的时间实在是太多了，所以终于在某一天把他的键盘给没收了，呃，问题是当时肖恩正在黑别人的半道儿上……结果肖恩没办法退出下线，于是被 FBI 给发现了，然后就被抓了。", "好在肖恩当时是未成年人，所以他也没被怎么着，而要是说这事儿有什么影响的话，那只能说是反而给他壮了壮胆。3 年以后，他和人一起创办了 Napster，他们那种点对点的文件共享服务在一年之内就吸引了过千万的用户，成为历史上增长最快的企业之一。但是唱片公司因为版权问题提起了诉讼，所以仅仅开张了 20 个月，Napster 就被联邦法院裁决关停了。在短暂的处于风暴中心之后，肖恩又回到了局外人的状态。", "然后 Facebook 来了。2004 年肖恩遇到了马克·扎克伯格，帮他谈下了Facebook 的第一笔融资，然后当上了这家公司的第一任总裁。到了2005 年，他因为被指控使用毒品，就又不得不下台了，但是也这只不过是让他的臭名声更响亮了而已。而自从贾斯汀·汀布莱克注在电影《社交网络》里扮演了他的角色之后，肖恩被认为是全美国最酷的人之一。贾斯汀·汀布莱克其实总体上来说比肖恩更有名，但是如果他出现在硅谷，人们就反而会问他“你是不是肖恩·帕克”？", "注：贾斯汀·汀布莱克，Justin Timberlake，美国男歌手、演员、音乐制作人、主持人，前男子演唱组合超级男孩成员。1981 年 1 月 31 日出生于美国田纳西州孟菲斯市，曾获得第 5 届全英音乐奖最佳国际专辑、国际最佳男歌手奖与全美音乐奖最佳流行和摇滚专辑专辑奖、格莱美最佳流行男歌手奖，等等。2010 年参演电影《社交网络》，并饰演肖恩·帕克。", "注：《社交网络》，The Social Networks，2010 年美国电影，根据本·麦兹里奇（Ben Mezrich's）的小说《意外的亿万富翁：Facebook 的创立，一个关于性、金钱、天才和背叛的故事》（TheAccidentalBillionaires: The Founding of Facebook, A Tale ofSex, Money, Genius, and Betrayal）改编而成。由大卫·芬奇（DavidFincher）执导，杰西·艾森伯格（Jesse Eisenberg）、安德鲁·加菲尔德（Andrew Garfield）、贾斯汀·汀布莱克（JustinTimberlake）和艾米·汉莫（Armie Hammer）等联袂出演。小说和影  片的故事原型来源于社交网络 Facebook 的创始人马克·扎克伯格和埃德华多·萨瓦林建立和发展 Facebook 的历程。影片获得了2011 年奥斯卡奖最佳改编剧本、最佳配乐和金球奖最佳剧情片、最佳导演、最佳编剧等若干奖项及其他多项提名。", {"img": "z14-7", "cap": "图14.7"}, "这个世界上最著名的人们大部分也都是创始人：名人们建立的不是公司，而是建立、经营、培育了自己，这个“人”的品牌。比如说 LadyGaga ，现在已经成为还活着的人里面最有影响力的人之一了。但这真的是个真人吗？她的真名不是什么秘密，但是却几乎没有人知道也没有人关心。她的穿着打扮是如此的另类怪异，以致于要是别人也这么穿的话，估计有可能是会被关进精神病院的。她想让你们相信的就是她“生来就这样”——这也是她第二张专辑及其主打歌曲的名字。但是没有人天生就会长得像具僵尸，然后还有俩犄角长在头上：所以这种神神叨叨的事情一定是 Lady Gaga 自己营造出来的。但是话又说回来了，什么样的人会对自己这么做呢？肯定不是什幺正常的人。所以说呢，没准 LadyGaga 的确生来就那样。", "注：Lady Gaga，美国流行女歌手、词曲创作者、慈善家、演员。1986年出生于美国纽约曼哈顿，本名Stefani Joanne AngelinaGermanotta，具有意大利和法国血统，Lady Gaga 是其艺名。其作品囊括多项冠军单曲排行和多项国际奖项，音乐风格前卫，衣着装束等等更是可以另类到耸人听闻。2010 年被《时代》周刊评为百大最有影响力文化人物之一，2012 年荣登福布斯最具潜力明星榜榜首。她也热心公益，多次在各种灾难后捐款，并且成立了“生来就这样”公益基金，以及为 LGBT 性别多元群体代言。王者从何而来", "创始人的极端化形象在人类历史上并不是什么新鲜事物，古典的神话传说里就比比皆是。俄狄浦斯注，就很是个局内/局外的矛盾统一体：他刚出生就被遗弃外地，最终也是客死异乡；然而他又位是英明的国王，并且解开了斯芬克斯之谜。", "注：俄狄浦斯，Oedipus，西方文学史上著名的命运悲剧人物。他本是希腊神话传说中的人物，是忒拜（Thebe）的国王拉伊奥斯（Laius）和王后约卡斯塔（Jocasta）的儿子，受到命运的左右，他出生后就被遗弃，长大后在不知情的情况下杀父娶母，最终自我放逐于异乡而死。 古希腊著名悲剧作家索福克勒斯（Sophocles，公元前 496-前 406）依据传说创作的古典悲剧《俄狄浦斯王》刻画了其悲剧命运，成为不朽名篇。而弗洛伊德定义的“俄狄浦斯情结”（Oedipus Complex）也是由此而来。", "注：斯芬克斯，Sphinx，传说中的怪兽，狮身人面或羊头或鹰首。最初源于古埃及神话，也见于西亚神话和希腊神话中，但斯芬克斯在各文明的神话中形象和含义都有不同。此处说的斯芬克斯之谜通常指：“什么动物早晨用四条腿走路，中午用两条腿走路，晚上用三条腿走路？”罗幕路斯和雷穆斯注有着高贵的血统，却被遗弃成为了孤儿。当他们知道了自己的身世之后，打算建立一座城市。但是他们对于把城市建在哪儿有很大的争议，结果当雷穆斯越过了罗幕路斯指定的罗马城的边界的时候，罗幕路斯真的把他给杀了，并且扬言说：以后所有胆敢越过我的城墙的人，都是这个下场。既是立法者，又是犯法者；既是法外之徒，又是罗马之王；罗幕路斯也是这样的自相矛盾的局内/局外混合体。", "注：罗慕路斯（Romulus，约公元前 771 -前 717）与雷穆斯（Remus，约公元前 771-前 753）是罗马神话传说中罗马城的建造者。传说中他们的父亲是战神玛尔斯，母亲是女祭司雷亚·西尔维亚，他们出生后即被遗弃但因为被母狼喂养而活了下来。", "通常的人们都不会像是俄狄浦斯或者罗幕路斯。但即使是这些传说中的人，无论他们在真实生活中其实是什么样子，他们通过神话传说被记录被流传下来的，也都是这些比较极端的故事和形象。那么为什么，对这些古代的文化来说，去铭记这些极不寻常的人物，是那么的重要呢？", "无论是美名远播还是臭名昭著的人，他们都是被用来作为公众情绪的承载：太平盛世人们就去歌颂他们，灾祸连结人们就去怪罪他们。因为早期的人类社会面临的最重要的一个根本问题就是：如果人们没有办法去停止冲突，社会就会崩塌溃乱。所以不管是瘟疫、灾难、还是暴力冲突，只要和平安宁受到了威胁，那么对于整个社会来讲，把所有的罪责都堆到一个人身上，是利大于弊的。而这个被大家一致同意用来顶罪的人，我们称之为：替罪羊（Scapegoat）。", "那么拿什么人来当替罪羊最有效呢？就像创始人一样，替罪羊也要具有极端但是矛盾的形象。一方面，他需要是足够软弱的，这样才无力来阻止自己的被牺牲；另一方面，他又要是足够强大的，因为如果让他来承担了罪责，就能够消弭冲突的话，那他必然是整个群体里最强大的。", "而且在行刑之前，替罪羊们往往会被当做神祗一般供奉膜拜。在阿兹特克人注的习俗里，他们认为这些即将作为祭品牺牲的人，正是他们信奉的神祗在人间的短暂下凡，所以他们会给这些祭品供奉上锦衣玉食，然后当这短暂的下凡该结束了，他们就会挖出祭品的心脏来送他们归天。其实，这正是所有君主统治的根本模式：王者就是活在人间的神祗，而神祗都是被谋害的王者。或许，现代的王者们也不过是种替罪羊，只不过是能够延缓自己的行刑而已。", "注：阿兹特克人，Aztecs，又译阿兹台克人，是南美洲原住民，原属纳瓦语（Nahuatl）系的一个部落，后来在公元 11-12 世纪崛起，从北部迁入墨西哥中央谷地，1325 年在特斯科科（Texcoco）湖西部岛上建造特诺奇蒂特兰（Tenochtitlán）城。后在其领袖蒙特祖马一世（Moctezuma I）领导下发展为南美较大帝国。16 世纪西班牙殖民者入侵后逐渐破灭，西班牙人占领并毁坏特诺奇蒂特兰城后，在其废墟上建立了墨西哥城。", "美国王族", "名人们通常会被认为是“美国的王族”。我们甚至会用各种称号给我们最喜爱的明星加冕：埃尔维斯·普雷斯利注是摇滚之王，迈克尔·杰克逊注是流行之王，还有，布兰妮·斯皮尔斯注是流行公主。注：埃尔维斯·普雷斯利，Elvis Presley， 1935-1977，美国著名摇滚歌手及演员，出生于密西西比州图珀洛，被称为摇滚之王（King ofthe Rock&Roll），国内称其为猫王。他是 20 世纪美国文化标识之一，其夸张的现场表演风格与胯部扭动动作最直接反映了“摇滚”这一特征，将原本边缘化的摇滚乐带入主流，为大众所知、并带来了流行音乐的行为方式及观念的革新，自己也成为最有影响力的音乐人之一。1977 年因药物相互反应去世，时任美国总统吉米·卡特（Jimmy Carter）称其“永久改变了美国流行文化面貌”。但其猫王称号只在中文圈使用，可能来自他早期被称作“Hillbilly Cat”，意为乡下歌手，及其 1957 年主演的电影“Jailhouse Rock”中文被译成《脂粉猫王》，但其实从来都与猫无关。注：迈克尔·杰克逊，Michael Jackson，1958-2009，美国著名流行歌手、舞者、词曲创作人，出生于美国印第安纳州加里市。迈克尔是杰克逊家族的第七个孩子，他在 1964 年作为杰克逊五人组（JacksonFive）的成员和他的兄弟一起在职业音乐舞台上初次登台，后独自发展并取得巨大成功，创下多项商业记录，获得全球过百项音乐奖项，并创下吉尼斯世界纪录。通过丰富的舞台和视频的表演，杰克逊普及了一些像机械舞和太空步等舞蹈技术，成为美国文化符号之一，同时其影响力遍及世界各地。成名后热心公益，2000 年吉尼斯世界纪录大全里认证他资助过 39 个慈善机构。", "注：布兰妮·斯皮尔斯，Britney Spears，美国著名女歌手、演员，1981年出生于美国密西西比州，在路易斯安那州长大，初期在中国又称“小甜甜”。童年时期在参加热门电视节目后即开始其演艺生涯，1997 年与 Jive 唱片公司正式签约成为艺人，1999 年发行首张专辑后立即走红。之后曾多次获得各种音乐奖项，并曾创造了流行音乐史上女歌手的多项最高记录，并以其年轻性感充满活力的形象红遍世界，成为 20 世纪末美国文化符号之一。", {"img": "z14-8", "cap": "图14.8"}, "直到他们不再是了。埃尔维斯在 70 年代毁了自己，体重超标的他独自死在了卫生间里。如今，埃尔维斯模仿者们注也都大腹便便不修边幅，不再像以前那样苗条又酷。迈克尔·杰克逊从大家喜爱的童星，变成了一具徒具其名的躯壳：言行古怪，面目可憎，嗜毒成瘾；全世界都乐于讨论的只是他打官司的细节。布兰妮的故事最有戏剧性。我们几乎是凭空造就了她的神话，让她还在少女时期就被捧为超级巨星。但是之后的一切却都脱离了轨道：我们见证了她剃秃了的头顶，暴食与厌食的丑闻，还有剥夺了她对孩子们的抚养权的那些被高度曝光的庭审注。她这是怎么了？她是一直就有点疯癫吗？还是因为出名了导致的？或者是她还嫌不够出名？", "注：埃尔维斯模仿者，Elvis Impersonators，又称 Elvis tributeartists(ETAs)，是指模仿埃尔维斯的群体，有业余进行模仿的粉丝，也有专业以模仿他为职业的人士，在其在世期间就开始出现，在其去世之后依然长期存在，有不少活动和比赛，甚至还曾有专门的电台。", "注：布兰妮 2004 年与歌手、伴舞凯文·费德林（Kevin Federline）结婚，后分别在 2005 和 2006 年生有两个儿子，但是二儿子出生之后不久他们就离婚了。后法庭判决抚养权归凯文所有，她对判决不服，并导致警察介入。", {"img": "z14-9", "cap": "图14.9"}, "而对于有些陨落了的明星，死亡则带来了重生。有很多流行音乐人在 27 岁死去——例如詹尼斯·乔普林，吉米·亨德里克斯，吉姆·莫里森，还有科特·柯本——他们被称为“27 岁俱乐部”，并且因此而得以不朽。在也加入这个俱乐部之前，艾米·怀恩豪斯注在歌里唱到“他们想让我去戒毒，我说‘不，不，不’”。戒毒看起来一点儿也没意思，而且还会断了通往不朽的道路。因为也许，想把摇滚之神永远当下去，唯一的方法就只有早早的逝去了。", "注：詹尼斯·乔普林，Janis Joplin，1943-1970，美国著名女歌手，生于美国得克萨斯州，60 年代的迷幻女杰，被称为最伟大的白人摇滚女歌手和伟大的布鲁斯歌手，是女性摇滚乐的代表人物。注：吉米·亨德里克斯，James Marshall \"Jimi\" Hendrix，1942－1970，出生于华盛顿州的西雅图，是美国著名的吉他演奏家，歌手，和作曲人，被公认为是摇滚音乐史中最伟大的电吉他演奏者。注：吉姆·莫里森， James Douglas \"Jim\" Morrison，1943－1971，美国著名创作歌手和诗人，出生于美国佛罗里达州。他早年迷于尼采、兰波和杰克·凯鲁亚克的作品，并以自己的能力把它们与歌词相结合，使他成为史上最有艺术才华、最有影响力的创作歌手之一。他组织成立并担任主唱的门户乐队（The Doors）是 60 年代最受欢迎的乐队之一，以讽刺与批判见长。", "注：科特·柯本，Kurt Donald Cobain，1967 – 1994，美国著名摇滚创作歌手，出生于美国西部华盛顿州的阿伯丁市。他才华横溢，能写能唱，组建了震惊世界的摇滚乐队“涅槃”Nirvana 并担任主唱兼吉他手，作为乐队的灵魂人物，以粗犷残破的唱腔将原始的冲动、愤怒、失望等情绪表达得淋漓尽致，从而使原本被称为“垃圾摇滚”的 Grunge 摇滚曲风走向了全世界。1994 年他在家中自杀，遗言中引用了加拿大民谣歌手尼尔··杨（Neil Young）的歌词，称“与其渐灭，不如燃烧”It's better to burnout than to fade away。他个人及乐队对流行音乐的影响很大，以致死后有许多关于他的纪录片和电影。", "注：艾米·怀恩豪斯，Amy Winehouse，英国女歌手，1983 年出生于英国伦敦。曾获水星音乐奖、全英音乐奖最佳女歌手奖、格莱美奖年度最佳唱片、年度最佳歌曲、最佳新人、最佳流行女歌手等大奖。2011 年在英国伦敦的寓所被发现死亡，年仅 27 岁。", {"img": "z14-10", "cap": "图14.10"}, "和对这些名人一样，我们对科技界的奠基者、创始人们也会有从崇拜到不屑的转变。霍华德·休斯注从声名显赫到令人惋惜的转折，是 20 世纪所有科技创业者中最富有戏剧性的。他生下来就很富有，但是他对工程技术的兴趣总是要比对奢华享乐的兴趣要大得多。在 11 岁的时候， 他造出了休斯敦的第一台无线电发射器。在接下来那年，他又造出了全城第一台摩托车。到他 30 岁的时候，他在当时技术领先世界的好莱坞已经推出了 9 部商业上很成功的电影了。但同期他在航空飞行界的生涯，甚至让他更加出名。他亲自设计飞机，制造飞机，更亲自驾驶飞机。他创造了最高飞行速度的世界纪录，他创造了横飞美洲最快的世界纪录，他创造了环飞世界最快的世界纪录。", "休斯痴迷于飞得比其他人都要高。他还喜欢提醒人们，说他自己也就是个平凡的人，而不是什么希腊传说中的神祗——但这话正是凡人们希望别人能把自己和神去做比较的时候才会说的。休斯是“一个不能用像你我一样的通常标准来衡量的人”，他的律师有一次在法庭上是这么说的。当然休斯请律师来这么说是要花钱的，但是根据《纽约时报》的说法，“法官和陪审团对此一致认可”。当 1939年休斯因为在航空飞行方面的成就获得国会金质奖章的时候， 他却根本没有出现来领奖——直到好几年之后，杜鲁门总统在白宫发现了这个奖章，才给他寄了过去。", "1946 年，他遭遇了第三次坠机事故，也是最严重的一次，于是休斯的结局就从此开始。如果他那时候就死了，他可能就会成为美国历史上最勇往直前的成功人士，并因此被人们永远铭记。但是他活下来了，勉强的活下来了。他患上了严重的强迫症，对止疼药严重依赖上瘾，于是退出了公众视野，把人生最后的 30 年封闭在自我强加的离群索居里了。休斯之后的举动一直有些疯狂，因为他不想被人打扰，而理论上人们通常是不会去搭理疯子的，但是当他的疯狂举动终于导致自己的人生真的彻底疯狂之后，他就又成为人们为之深切惋惜的对象了，就像之前对他深感敬畏一样。", "注：霍华德·休斯，Howard Hughes，1905-1976，美国传奇人物。他出生于美国德克萨斯州的富有家庭，但父母都过世很早，因而他 17岁就辍学接管父亲的企业，21 岁成为电影公司董事长兼导演，在好莱坞拍摄了多部投资巨大的影片。他热爱航空工程和驾机飞行，30岁驾驶自己设计飞机创造时速 567 公里的世界飞行记录，32 岁以 7个半小时飞越美洲，33 岁创 91 小时环球飞行记录，此后用 5 年时间造一架设计可载客 750 人的大飞机并飞行了一英里。他创办的休斯飞机公司（Hughes Aircrate）及旗下休斯直升机公司和休斯空间及通讯集团等都是美国航空航天业的翘楚，美国首颗地球同步通信卫星 Syncom1及首次在月球着陆的 Surveyor 1 都是休斯公司的。他还投资了很多地产，包括收购拉斯维加斯的很多赌场并重塑了拉斯维加斯的形象。这些使休斯集团成为美国最大的企业集团之一，他本人也是当时美国最富有的人之一，而震惊世界的“水门事件”也是他向时任美国总统尼克松的弟弟提供的贷款。事实上他的这些成就，除了飞行之外的，有很多也是在 46 年受伤之后，而在1946 年受伤之前，他还在 1929 和1943 年两次坠机中严重受伤，所以说他的逐步退出公众视线是他因伤病而自我进行的封闭。期间有很多怪异的举止在此不一一罗列，但是据信都和其伤痛和药物有关。在他 1976 去世后，他的部分遗产被归于他在 1953 年创办的霍华德 · 休斯医学研究机构（Howard Hughes MedicalInstitute，HHMI）所有，于是该机构成为世界上最大的非盈利性研究机构之一。作为 20 世纪最富传奇色彩的人物，关于他的纪录片和电影也非常多。", {"img": "z14-11", "cap": "图14.11"}, "再说一些离大家近一点的事儿，比尔·盖茨，就展示了你成功的能见度有多大，你招来的攻击的力度就会有多大。盖茨也是典型的创始人原型，他同时具备了矛盾的特质：他既是懦弱、讷子、辍学的局外人，又是全世界最富有的局内人。他那副极客风格的眼镜儿是他有意选来营造独特的个人形象的吗？还是他内在的讷子性让这极客眼镜儿选择了他？很难说。但是他曾经的主导地位是无可辩驳的：在 2000年的时候，微软公司的 Windows 占据了操作系统 90%的市场份额。所以那时候彼得·詹宁斯注才会讨巧的说道：“当今世界谁更重要？是比尔·盖茨还是比尔·克林顿？我不知道。这可真是个好问题。”注：彼得·詹宁斯，Peter Charles Archibald Ewart Jennings，1938－2005，美国广播电视公司（ABC）著名新闻主播。他出生于加拿大多伦多的一个新闻世家，九岁开始主持电台儿童节目，1964 年进入美国广播电视公司，后成为知名记者及主播，共拿下 16 个艾美奖以及多个新闻奖项，被称为美国三大新闻主播之一。他一生采访过许多重大新闻，从 1960 年的柏林墙建立，之后的越战，再到 90 年代冷战结束，他都有现场见证。2001 年美国“9·11”事件发生时，他坚持连续直播 17 个小时，没有休息，创下 ABC 历史纪录，他对新闻的热情，可见一斑。此处的言论出自他 2000 年的一次访谈节目。美国司法部可不会让自己被这种文字游戏给限制住，他们对微软的“反竞争行为”展开了调查并提起了诉讼。在2000 年 6 月，法庭判决微软公司需要进行拆分。盖茨在 6 个月之前已经从微软的 CEO 位置上退了下来，但当时不得不花费大量的时间来应对这些法律威胁，而无法去专注于创造新的科技。到2001年的时候，上诉法院撤回了拆分微软的判决，后来微软也终于和政府达成了和解。但是这时候盖茨的敌人已经成功的阻止了微软公司得到其创始人的全身心投入，于是这家公司的发展进入了相对停滞的时期。到了现在，盖茨已经更多的是作为慈善家出名，而不是技术专家了。", "注：比尔·盖茨 2000 年从 CEO 职位卸任之后，继续担任董事会主席，并打算担任首席软件架构师，但由于官司缠身，实际上他都是作为董事会主席忙于应付法律事物，软件架构师的工作因此而耽误了，而微软和政府的和解一直到 2004 年才最终达成。至于慈善事业，他在 2000年和妻子一起成立了比尔和梅琳达·盖茨基金会（Bill & Melinda Gates Foundation），旨在促进全球卫生和教育领域的平等，并且成为全球以公开透明形式运作的最大的私人基金。盖茨夫妇也因此成为紧随巴菲特之后的第二大慈善家，而巴菲特因为打算将其 83%的财产逐步交给该基金用作慈善用途，故也成为该基金理事之一。", {"img": "z14-12", "cap": "图14.12"}, "王者归来", "正当法律打击终结了比尔·盖茨在微软的主导地位的时候，史蒂夫·乔布斯在苹果的回归则又一次证明了创始人在公司里无可取代的价值。在某些方面，史蒂夫·乔布斯和比尔·盖茨是相反的。乔布斯是位艺术家，更喜欢封闭的系统，并且花时间来专注于构思伟大的产品是要高于其他一切的；盖茨则是生意人，保持了他的产品的开放性，并且希望能领导世界。但是他们都是局内/局外人的统一体，并且都带领各自创办的公司做出了其他人无法企及的成就。", {"img": "z14-13", "cap": "图14.13"}, "光脚到处走还不肯洗澡的辍学生，乔布斯也曾是他自己另类个性的局内人。他的举动可能会很优雅也可能会很疯狂，这要看他的心情，或者是他的心计；很难让人相信有些怪异的举动，例如只吃苹果却不吃别的，不是出于某种更大的策略。但是这些另类的举动也曾经发生过反噬：", "1985 年，苹果公司的董事会把乔布斯从他自己的公司给踢了出去，因为当时他和作为职业经理人的CEO 发生了冲突，而后者希望带来所谓更成熟的运营管理。", "12 年以后，乔布斯在苹果的归来展示了企业最重要的任务——产生新价值——并不能被简化为公式而由职业经理人来进行。当他 1997 年被苹果聘请为临时 CEO 的时候，之前的那位无可挑剔又资质完备的执行官已经让苹果濒临破产了那一年迈克尔·戴尔说苹果“要是我的话会怎么办？我会干脆把它关门然后把钱退给股东们得了”。然而，乔布斯发布了 iPod（2001 年），iPhone（2007 年），iPad（2010 年），到了2011 年他因为健康问题不得不辞了职，翌年，苹果公司已然成为了全世界独一无二的最有价值的公司。", "注：迈克尔·戴尔，Michael Dell，戴尔公司创始人、CEO，董事会主席。 1965 年出生于美国德克萨斯州休斯敦一个中产家庭， 15 岁开始接触计算机，并乐于拆解包括苹果电脑在内的家用计算机，之后于大学宿舍开始做攒机生意，于 1984 年成立戴尔公司。之后戴尔公司成为世界上最大的个人电脑销售公司之一，并将业务拓展到其他计算机软硬件及服务领域。", "苹果公司的价值就是这么极度的依赖于这位特定人物的个人愿景。这说明了能够产生新科技的公司，其奇特的运作方式往往更接近封建君主体制，而不像是所谓的“现代化”组织。独一无二的创始人可以做出最有权威的决定，可以激发最强烈的员工忠诚度，也可以制定出长达数十年的长期规划。与此相矛盾的是，由那些训练有素的职业人士组成的毫无个人色彩的官僚型组织也许可以持续非常长的时间，但是他们的行为的出发点通常都只是眼前。", "所以对企业来说，要学到的就是：我们需要创始人。要再直白一点，就是我们对看起来古怪或者极端的创始人应该给予更大的宽容和忍耐，因为我们需要非同寻常的人物来带领公司跨越过平庸的渐近主义。而对于创始人来说，要学到的就是：不要沉醉。显赫的声名，追捧与赞颂，这些随时都可能会发生变化，让你个人背负臭名或者被
