<script id="sitedata" type="application/json">[{"id":"c1","title":"第1章　什么是价格行为","icon":"1","sections":[],"blocks":[{"t":"para","text":"第一章 什么是价格行为","pid":"p0"},{"t":"para","text":"目录：趋势K线和十字星，K线基础知识：信号K线，入场K线，建仓形态和蜡烛形态（K线形态）。信号K线：反转K线。信号K线：其他类型K线。外包K线。K线收盘价的重要性。交易ETF和反向图表。二次入场。迟到和错过的交易。","pid":"p1"},{"t":"para","text":"趋势K线和十字星K线","pid":"p2"},{"t":"para","text":"K线分为两种，趋势K线和十字星K线。趋势K线是指由多头或空头主导的一根K线，这种K线实体很大，但影线很短。这些K线代表了小周期图表上的趋势。他们从最高价和最低价开盘，一路奔向极端，并以强势收盘。十字星是一种盘整期间出现的中性方向的K线，它通常只有1tick的实体，上下都有长影线。这表明市场在两个方向上都进行了交易，但最终收盘在中间价位。影线更长，实体更小的K线应该被视为十字星。下面是一个上升趋势，下降趋势，和十字星。","pid":"p3"},{"t":"img","src":"assets/img/c01_000.webp","ilabel":"C1-1","icap":"什么是价格行为","fid":"fig1","ctx":[{"t":"趋势K线和十字星K线","p":"p2"},{"t":"K线分为两种，趋势K线和十字星K线。趋势K线是指由多头或空头主导的一根K线，这种K线实体很大，但影线很短。这些K线代表了小周期图表上的趋势。他们从最高价和最低价开盘，一路奔向极端，并以强势收盘。十字星是一种盘整期间出现的中性方向的K线，它通常只有1tick的实体，上下都有长影线。这表明市场在两个方向上都进行了交易，但最终收盘在中间价位。影线更长，实体更小的K线应该被视为十字星。下面是一个上升趋势，下降趋势，和十字星。","p":"p3"}]},{"t":"img","src":"assets/img/c01_001.webp","ilabel":"C1-2","icap":"什么是价格行为","fid":"fig2","ctx":[]},{"t":"img","src":"assets/img/c01_002.webp","ilabel":"C1-3","icap":"什么是价格行为","fid":"fig3","ctx":[{"t":"我们可以看到他们在低位开盘，在高位收盘，重叠非常小，这表明市场正在脱离当前价格。在同1分钟时间周期上，这是相同的多头趋势。这些都是趋势K线。而且在中间的回调区域出现了一些十字星，所以这是一种很好的比较方式。（中间）是一个下降趋势的例子。你看到在高位开盘，低位收盘，接着一个回调。然后市场就向下趋势运行。同样的道理，1分钟图中价格也处于下降趋势。（最右）是十字星K线，先是大涨后是大跌，在中间区域表现的犹豫不决。","p":"p4"},{"t":"K线基础知识：信号K线、入场K线、建仓形态K线和K线形态","p":"p5"},{"t":"信号K线和建仓形态K线告诉我们何时入场。只有当订单在下一个K线成交时，它们才能成为信号K线或建仓形态K线。这意味着信号K线和建仓形态K线是事后回看时才被标记出来的。","p":"p6"},{"t":"入场方式有两种：顺势入场和逆势入场。顺势入场是指顺着当前趋势的方向进行交易，而逆势入场则是指逆着主要趋势进行交易。新手交易者应该只专注于顺势交易。入场时，使用止损订单在在信号K线上方或下方一个Tick入场。当市场形成与交易方向一致的趋势K线时，订单就会成交。（顺势入场是最好的选择）。","p":"p7"},{"t":"K线形态是由价格行为形成的，K线形态只有在背景支持的状态下才有效，先观察背景，再根据K线形态进行交易。","p":"p8"},{"t":"建议新手如何交易的图例：","p":"p9"}]},{"t":"para","text":"我们可以看到他们在低位开盘，在高位收盘，重叠非常小，这表明市场正在脱离当前价格。在同1分钟时间周期上，这是相同的多头趋势。这些都是趋势K线。而且在中间的回调区域出现了一些十字星，所以这是一种很好的比较方式。（中间）是一个下降趋势的例子。你看到在高位开盘，低位收盘，接着一个回调。然后市场就向下趋势运行。同样的道理，1分钟图中价格也处于下降趋势。（最右）是十字星K线，先是大涨后是大跌，在中间区域表现的犹豫不决。","pid":"p4"},{"t":"para","text":"K线基础知识：信号K线、入场K线、建仓形态K线和K线形态","pid":"p5"},{"t":"para","text":"信号K线和建仓形态K线告诉我们何时入场。只有当订单在下一个K线成交时，它们才能成为信号K线或建仓形态K线。这意味着信号K线和建仓形态K线是事后回看时才被标记出来的。","pid":"p6"},{"t":"para","text":"入场方式有两种：顺势入场和逆势入场。顺势入场是指顺着当前趋势的方向进行交易，而逆势入场则是指逆着主要趋势进行交易。新手交易者应该只专注于顺势交易。入场时，使用止损订单在在信号K线上方或下方一个Tick入场。当市场形成与交易方向一致的趋势K线时，订单就会成交。（顺势入场是最好的选择）。","pid":"p7"},{"t":"para","text":"K线形态是由价格行为形成的，K线形态只有在背景支持的状态下才有效，先观察背景，再根据K线形态进行交易。","pid":"p8"},{"t":"para","text":"建议新手如何交易的图例：","pid":"p9"},{"t":"img","src":"assets/img/c01_003.webp","ilabel":"C1-4","icap":"什么是价格行为","fid":"fig4","ctx":[{"t":"K线形态是由价格行为形成的，K线形态只有在背景支持的状态下才有效，先观察背景，再根据K线形态进行交易。","p":"p8"},{"t":"建议新手如何交易的图例：","p":"p9"},{"t":"（牛旗和熊旗）所以我们看到一个多头推动一个两段式的回调。然后在主要的牛旗内部还有一个小牛旗，如果交易者认为价格会继续上涨，他们应该在信号K线的高点上方设置一个买入突破单，这个订单会在下一根K线突破时被成交。一旦订单成交，这根K线就成为了入场K线，而之前的信号K线则成为了一个建仓形态和信号K线。如果价格意外反转未能触发你的订单，那么它就不能算作建仓形态或信号K线，只需取消订单，然后等待下一个交易机会。熊旗也是同样的道理，我们可以看到一个熊旗，一个空头突破以及一个小幅回调。市场在多头十字星后出现回调，随后继续下降新低。当市场创下新低时，交易者应在此十字星下方一个点处设置突破单，并且会在这一根K线上成交，这是信号K线，就是入场K线。","p":"p10"},{"t":"信号K线：反转K线","p":"p11"},{"t":"反转K线可以用于顺势或逆势建仓。所有反转K线都应有强劲的收盘价，且顶部或底部的影线较短。这表明市场试图朝一个方向移动，但却出现了相反的方向上强劲收盘。","p":"p12"},{"t":"在分析之前的价格行为之后，不应贸然进行反转交易。反转K线以及所有交易只有在符合市场逻辑的情况下才能有效。初学者往往会在强劲的趋势中寻找反转，但实际上应该等待趋势方向上的反转K线出现。初学者应避免逆势交易。","p":"p13"},{"t":"多头反转和空头反转：","p":"p14"}]},{"t":"para","text":"（牛旗和熊旗）所以我们看到一个多头推动一个两段式的回调。然后在主要的牛旗内部还有一个小牛旗，如果交易者认为价格会继续上涨，他们应该在信号K线的高点上方设置一个买入突破单，这个订单会在下一根K线突破时被成交。一旦订单成交，这根K线就成为了入场K线，而之前的信号K线则成为了一个建仓形态和信号K线。如果价格意外反转未能触发你的订单，那么它就不能算作建仓形态或信号K线，只需取消订单，然后等待下一个交易机会。熊旗也是同样的道理，我们可以看到一个熊旗，一个空头突破以及一个小幅回调。市场在多头十字星后出现回调，随后继续下降新低。当市场创下新低时，交易者应在此十字星下方一个点处设置突破单，并且会在这一根K线上成交，这是信号K线，就是入场K线。","pid":"p10"},{"t":"para","text":"信号K线：反转K线","pid":"p11"},{"t":"para","text":"反转K线可以用于顺势或逆势建仓。所有反转K线都应有强劲的收盘价，且顶部或底部的影线较短。这表明市场试图朝一个方向移动，但却出现了相反的方向上强劲收盘。","pid":"p12"},{"t":"para","text":"在分析之前的价格行为之后，不应贸然进行反转交易。反转K线以及所有交易只有在符合市场逻辑的情况下才能有效。初学者往往会在强劲的趋势中寻找反转，但实际上应该等待趋势方向上的反转K线出现。初学者应避免逆势交易。","pid":"p13"},{"t":"para","text":"多头反转和空头反转：","pid":"p14"},{"t":"img","src":"assets/img/c01_004.webp","ilabel":"C1-5","icap":"什么是价格行为","fid":"fig5","ctx":[{"t":"在分析之前的价格行为之后，不应贸然进行反转交易。反转K线以及所有交易只有在符合市场逻辑的情况下才能有效。初学者往往会在强劲的趋势中寻找反转，但实际上应该等待趋势方向上的反转K线出现。初学者应避免逆势交易。","p":"p13"},{"t":"多头反转和空头反转：","p":"p14"},{"t":"作为新手，应避免逆势交易。我想聊聊这句话，相反要等待趋势方向上的反转K线。我花了好一阵子才明白。所以我想给大家展示一下，因为它真的很重要。这是一个多头反转，空头反转，我们能看到一个牛旗正在形成，这里有一个双底。我选定的K线其实是一个空头通道。所以我们认为这个通道是从这里开始到这里结束，这实际上变成了一根反转K线，空头们试图下跌，但是多头强行拉升，强劲收盘在高位。为他且没有上影线影线，所以这是一个在多头趋势中出现的强劲的多头反转K线。空头反转的情况也类似，我看到了一个熊旗以及随后的回调，多头们试图冲高，突破市场结构。但空头们进行反击，最终形成了一个失败的突破，反转K线收盘价非常强劲，K线末端还有一个细微的影线，（一个tick）。大家能看到鼠标指向的位置，所以这是一个强劲的空头反转K线，这是一根顺势的空头反转K线。这是一根在熊旗中的空头反转K线。这就是逆势反转K线，在你更好的读懂盘面之前，交易者应该避免他们，顺势交易总是更优的选择。","p":"p15"}]},{"t":"para","text":"作为新手，应避免逆势交易。我想聊聊这句话，相反要等待趋势方向上的反转K线。我花了好一阵子才明白。所以我想给大家展示一下，因为它真的很重要。这是一个多头反转，空头反转，我们能看到一个牛旗正在形成，这里有一个双底。我选定的K线其实是一个空头通道。所以我们认为这个通道是从这里开始到这里结束，这实际上变成了一根反转K线，空头们试图下跌，但是多头强行拉升，强劲收盘在高位。为他且没有上影线影线，所以这是一个在多头趋势中出现的强劲的多头反转K线。空头反转的情况也类似，我看到了一个熊旗以及随后的回调，多头们试图冲高，突破市场结构。但空头们进行反击，最终形成了一个失败的突破，反转K线收盘价非常强劲，K线末端还有一个细微的影线，（一个tick）。大家能看到鼠标指向的位置，所以这是一个强劲的空头反转K线，这是一根顺势的空头反转K线。这是一根在熊旗中的空头反转K线。这就是逆势反转K线，在你更好的读懂盘面之前，交易者应该避免他们，顺势交易总是更优的选择。","pid":"p15"},{"t":"img","src":"assets/img/c01_005.webp","ilabel":"C1-6","icap":"什么是价格行为","fid":"fig6","ctx":[{"t":"作为新手，应避免逆势交易。我想聊聊这句话，相反要等待趋势方向上的反转K线。我花了好一阵子才明白。所以我想给大家展示一下，因为它真的很重要。这是一个多头反转，空头反转，我们能看到一个牛旗正在形成，这里有一个双底。我选定的K线其实是一个空头通道。所以我们认为这个通道是从这里开始到这里结束，这实际上变成了一根反转K线，空头们试图下跌，但是多头强行拉升，强劲收盘在高位。为他且没有上影线影线，所以这是一个在多头趋势中出现的强劲的多头反转K线。空头反转的情况也类似，我看到了一个熊旗以及随后的回调，多头们试图冲高，突破市场结构。但空头们进行反击，最终形成了一个失败的突破，反转K线收盘价非常强劲，K线末端还有一个细微的影线，（一个tick）。大家能看到鼠标指向的位置，所以这是一个强劲的空头反转K线，这是一根顺势的空头反转K线。这是一根在熊旗中的空头反转K线。这就是逆势反转K线，在你更好的读懂盘面之前，交易者应该避免他们，顺势交易总是更优的选择。","p":"p15"},{"t":"这也是一个糟糕的空头反转K线。市场强劲上涨，随后出现了一根反转K线，多头试图创下新高。空头将他们打压下去。并且收盘价强劲，没有影线，这看起来像熊旗中的前一根K线。这里是一根糟糕的多头反转K线。空头试图通过这根K线的下影线压低价格，但多头买高了，这根影线把价格推高了。他们以此强劲的收盘价推高了价格，这根K线的顶部没有出现上影线。所以这些指前两根K线和上页展示的K线是完全一样的。但他们所处的背景却非常糟糕，我展示给你们看的有个对比。","p":"p16"}]},{"t":"para","text":"这也是一个糟糕的空头反转K线。市场强劲上涨，随后出现了一根反转K线，多头试图创下新高。空头将他们打压下去。并且收盘价强劲，没有影线，这看起来像熊旗中的前一根K线。这里是一根糟糕的多头反转K线。空头试图通过这根K线的下影线压低价格，但多头买高了，这根影线把价格推高了。他们以此强劲的收盘价推高了价格，这根K线的顶部没有出现上影线。所以这些指前两根K线和上页展示的K线是完全一样的。但他们所处的背景却非常糟糕，我展示给你们看的有个对比。","pid":"p16"},{"t":"img","src":"assets/img/c01_006.webp","ilabel":"C1-7","icap":"什么是价格行为","fid":"fig7","ctx":[{"t":"这也是一个糟糕的空头反转K线。市场强劲上涨，随后出现了一根反转K线，多头试图创下新高。空头将他们打压下去。并且收盘价强劲，没有影线，这看起来像熊旗中的前一根K线。这里是一根糟糕的多头反转K线。空头试图通过这根K线的下影线压低价格，但多头买高了，这根影线把价格推高了。他们以此强劲的收盘价推高了价格，这根K线的顶部没有出现上影线。所以这些指前两根K线和上页展示的K线是完全一样的。但他们所处的背景却非常糟糕，我展示给你们看的有个对比。","p":"p16"}]},{"t":"img","src":"assets/img/c01_007.webp","ilabel":"C1-8","icap":"什么是价格行为","fid":"fig8","ctx":[{"t":"所以这是第一个多头反转信号是哪个好的？这是那个糟糕的多头反转信号。我们可以看到这两根K线看起来几乎一模一样。我们可以看到这两根K线看起来几乎一模一样，底部有下影线收盘价强劲，底部有下影线，收盘价强劲，这是一个反转K线，所以是一个不错的做多机会。这是一个糟糕的反转K线，或者这是一个失败的反转。这是一个逆势反转，你看多头们在这个K线里被套住了，但他们立刻就处于亏损状态了，他们根本来不及出场，说实话，如果你没有做一两个点的点差交易（scalp out），你就会被两根巨大的空头K线套牢，这可不是什么好事儿。同样也适用于空头反转，这是强劲的空头反转，多头被套，先是诱多陷阱，然后是突破失败，这变成了一个延续形态，这是反转，在熊旗中这里却成了延续。空头K线也是如此，在牛旗中，出现了这个空头K线。看起来非常相似，事实上，这个（空头K线）的收盘价更低，这个K线没有影线，但他处在牛旗中，所以最终成了一个诱空陷阱，他们甚至都没能跌破那个十字星，这个十字星表明市场处于一个震荡区间，这是一个陷阱。这是一个糟糕的空头反转信号，这是一个逆势反转。这是一个有效的空头反转，顺着旗型趋势交易。","p":"p17"},{"t":"信号K线：其他形态","p":"p18"},{"t":"理论上只要交易者选择每一根K线都可以成为信号K线，并非每一根信号K线都能带来盈利的交易。只是选择与当前市场背景相匹配的优质信号K线。理解信号K线，要先看其所处的交易背景，然后再看K线本身的形态，回顾一下前面讲过的两个图表。逆势反转的信号看起来很完美，他们看起来和你做趋势交易时的信号一模一样，但实际上他们的交易背景非常糟糕，你会亏钱。","p":"p19"},{"t":"这些是其他类型的信号K线：","p":"p20"},{"t":"外包K线：一根K线的波动范围完全覆盖了前一根K线。","p":"p21"},{"t":"看涨的两根K线反转形态：第一根K线是空头K线，第二根K线是一根多头K线，两根5分钟K线组合在10分钟图表上就会形成一个反转形态。","p":"p22"},{"t":"看跌两根K线反转形态：第一根K线是一根多头K线，第二根K线是一根空头K线，两根5分钟K线组合在10分钟图标上就会形成一个反转形态。","p":"p23"},{"t":"光头光脚K线：指K线顶部和底部没有上下影线。","p":"p24"},{"t":"看涨的外包K线：这表明顺势交易的紧迫性，多头们不希望K线顶部有上影线，空头希望K线底部没有影线，收盘价要强劲。","p":"p25"},{"t":"衰竭K线：这种K线出现在趋势的末端，并可能快速触及支撑和阻力位。它通常比趋势末期的其他K线都要大。","p":"p26"},{"t":"信号K线：外包K线","p":"p27"}]},{"t":"para","text":"所以这是第一个多头反转信号是哪个好的？这是那个糟糕的多头反转信号。我们可以看到这两根K线看起来几乎一模一样。我们可以看到这两根K线看起来几乎一模一样，底部有下影线收盘价强劲，底部有下影线，收盘价强劲，这是一个反转K线，所以是一个不错的做多机会。这是一个糟糕的反转K线，或者这是一个失败的反转。这是一个逆势反转，你看多头们在这个K线里被套住了，但他们立刻就处于亏损状态了，他们根本来不及出场，说实话，如果你没有做一两个点的点差交易（scalp out），你就会被两根巨大的空头K线套牢，这可不是什么好事儿。同样也适用于空头反转，这是强劲的空头反转，多头被套，先是诱多陷阱，然后是突破失败，这变成了一个延续形态，这是反转，在熊旗中这里却成了延续。空头K线也是如此，在牛旗中，出现了这个空头K线。看起来非常相似，事实上，这个（空头K线）的收盘价更低，这个K线没有影线，但他处在牛旗中，所以最终成了一个诱空陷阱，他们甚至都没能跌破那个十字星，这个十字星表明市场处于一个震荡区间，这是一个陷阱。这是一个糟糕的空头反转信号，这是一个逆势反转。这是一个有效的空头反转，顺着旗型趋势交易。","pid":"p17"},{"t":"para","text":"信号K线：其他形态","pid":"p18"},{"t":"para","text":"理论上只要交易者选择每一根K线都可以成为信号K线，并非每一根信号K线都能带来盈利的交易。只是选择与当前市场背景相匹配的优质信号K线。理解信号K线，要先看其所处的交易背景，然后再看K线本身的形态，回顾一下前面讲过的两个图表。逆势反转的信号看起来很完美，他们看起来和你做趋势交易时的信号一模一样，但实际上他们的交易背景非常糟糕，你会亏钱。","pid":"p19"},{"t":"para","text":"这些是其他类型的信号K线：","pid":"p20"},{"t":"para","text":"外包K线：一根K线的波动范围完全覆盖了前一根K线。","pid":"p21"},{"t":"para","text":"看涨的两根K线反转形态：第一根K线是空头K线，第二根K线是一根多头K线，两根5分钟K线组合在10分钟图表上就会形成一个反转形态。","pid":"p22"},{"t":"para","text":"看跌两根K线反转形态：第一根K线是一根多头K线，第二根K线是一根空头K线，两根5分钟K线组合在10分钟图标上就会形成一个反转形态。","pid":"p23"},{"t":"para","text":"光头光脚K线：指K线顶部和底部没有上下影线。","pid":"p24"},{"t":"para","text":"看涨的外包K线：这表明顺势交易的紧迫性，多头们不希望K线顶部有上影线，空头希望K线底部没有影线，收盘价要强劲。","pid":"p25"},{"t":"para","text":"衰竭K线：这种K线出现在趋势的末端，并可能快速触及支撑和阻力位。它通常比趋势末期的其他K线都要大。","pid":"p26"},{"t":"para","text":"信号K线：外包K线","pid":"p27"},{"t":"img","src":"assets/img/c01_008.webp","ilabel":"C1-9","icap":"什么是价格行为","fid":"fig9","ctx":[{"t":"衰竭K线：这种K线出现在趋势的末端，并可能快速触及支撑和阻力位。它通常比趋势末期的其他K线都要大。","p":"p26"},{"t":"信号K线：外包K线","p":"p27"},{"t":"外包K线是指其价格范围低于并高于前一根K线的K线。这是一根长的外包K线，如果我们看到这边中间的K线，空头向下打压，然后多头向上拉伸，空头在低位被平仓，在高位被套，也就形成了一个区间震荡的行情，外包K线可能出现在区间震荡。你看，它跌破了前一根K线，又突破了前一根K线，这是一个看跌的外包K线，它突破了前一根K线，又跌破了前一根K线，多头被套，空头被套，这就形成了一个大区间。空头可以高抛，多头可以低吸。","p":"p28"}]},{"t":"para","text":"外包K线是指其价格范围低于并高于前一根K线的K线。这是一根长的外包K线，如果我们看到这边中间的K线，空头向下打压，然后多头向上拉伸，空头在低位被平仓，在高位被套，也就形成了一个区间震荡的行情，外包K线可能出现在区间震荡。你看，它跌破了前一根K线，又突破了前一根K线，这是一个看跌的外包K线，它突破了前一根K线，又跌破了前一根K线，多头被套，空头被套，这就形成了一个大区间。空头可以高抛，多头可以低吸。","pid":"p28"},{"t":"img","src":"assets/img/c01_009.webp","ilabel":"C1-10","icap":"什么是价格行为","fid":"fig10","ctx":[{"t":"外包K线是指其价格范围低于并高于前一根K线的K线。这是一根长的外包K线，如果我们看到这边中间的K线，空头向下打压，然后多头向上拉伸，空头在低位被平仓，在高位被套，也就形成了一个区间震荡的行情，外包K线可能出现在区间震荡。你看，它跌破了前一根K线，又突破了前一根K线，这是一个看跌的外包K线，它突破了前一根K线，又跌破了前一根K线，多头被套，空头被套，这就形成了一个大区间。空头可以高抛，多头可以低吸。","p":"p28"},{"t":"信号K线：看涨的双K线反转形态","p":"p29"},{"t":"看涨的双K线反转，第一根是看跌K线，第二根是看涨K线，两根5分钟K线会形成一根看涨反转K线，并显示在10分钟的图表上。这是第一根空头K线，他们试图向下试探，最后多头买入空头K线，价格反转回到高位。在10分钟时间周期上，这看起来像一个反转形态，如果背景合适，这可能是一笔好交易，如果背景糟糕，你可能在高点买入，在低点做空。","p":"p30"},{"t":"信号K线：看跌的双K线反转","p":"p31"}]},{"t":"para","text":"信号K线：看涨的双K线反转形态","pid":"p29"},{"t":"para","text":"看涨的双K线反转，第一根是看跌K线，第二根是看涨K线，两根5分钟K线会形成一根看涨反转K线，并显示在10分钟的图表上。这是第一根空头K线，他们试图向下试探，最后多头买入空头K线，价格反转回到高位。在10分钟时间周期上，这看起来像一个反转形态，如果背景合适，这可能是一笔好交易，如果背景糟糕，你可能在高点买入，在低点做空。","pid":"p30"},{"t":"para","text":"信号K线：看跌的双K线反转","pid":"p31"},{"t":"img","src":"assets/img/c01_010.webp","ilabel":"C1-11","icap":"什么是价格行为","fid":"fig11","ctx":[{"t":"看涨的双K线反转，第一根是看跌K线，第二根是看涨K线，两根5分钟K线会形成一根看涨反转K线，并显示在10分钟的图表上。这是第一根空头K线，他们试图向下试探，最后多头买入空头K线，价格反转回到高位。在10分钟时间周期上，这看起来像一个反转形态，如果背景合适，这可能是一笔好交易，如果背景糟糕，你可能在高点买入，在低点做空。","p":"p30"},{"t":"信号K线：看跌的双K线反转","p":"p31"},{"t":"第一根是多头K线，第二根是空头K线，两个5分钟K线组合起来就能在10分钟图上形成一个反转K线。来看这个多头K线之后，空头反攻，把价格打下来，创了新低。收盘价很强，只有一点点上影线。在10分钟图上，这看起来像个反转K线，如果我们看到这种情况出现在阻力位，那可能是一个不错的做空机会，具体还要看左侧的走势，看看市场怎么把这个点推上去的。大家看到的这个影线是这根多头K线留下的，然后这个大家看到的收盘价是空头K线剩下的部分，所以空头赢得了这5分钟到10分钟的这场较量。他们在这两三根K线内掌控着市场。","p":"p32"},{"t":"信号K线：光头光脚K线","p":"p33"}]},{"t":"para","text":"第一根是多头K线，第二根是空头K线，两个5分钟K线组合起来就能在10分钟图上形成一个反转K线。来看这个多头K线之后，空头反攻，把价格打下来，创了新低。收盘价很强，只有一点点上影线。在10分钟图上，这看起来像个反转K线，如果我们看到这种情况出现在阻力位，那可能是一个不错的做空机会，具体还要看左侧的走势，看看市场怎么把这个点推上去的。大家看到的这个影线是这根多头K线留下的，然后这个大家看到的收盘价是空头K线剩下的部分，所以空头赢得了这5分钟到10分钟的这场较量。他们在这两三根K线内掌控着市场。","pid":"p32"},{"t":"para","text":"信号K线：光头光脚K线","pid":"p33"},{"t":"img","src":"assets/img/c01_011.webp","ilabel":"C1-12","icap":"什么是价格行为","fid":"fig12","ctx":[{"t":"第一根是多头K线，第二根是空头K线，两个5分钟K线组合起来就能在10分钟图上形成一个反转K线。来看这个多头K线之后，空头反攻，把价格打下来，创了新低。收盘价很强，只有一点点上影线。在10分钟图上，这看起来像个反转K线，如果我们看到这种情况出现在阻力位，那可能是一个不错的做空机会，具体还要看左侧的走势，看看市场怎么把这个点推上去的。大家看到的这个影线是这根多头K线留下的，然后这个大家看到的收盘价是空头K线剩下的部分，所以空头赢得了这5分钟到10分钟的这场较量。他们在这两三根K线内掌控着市场。","p":"p32"},{"t":"信号K线：光头光脚K线","p":"p33"},{"t":"指的是K线的顶部或底部没有任何影线，这表明了趋势方向上的紧迫性。多头希望K线的顶部没有影线。所以看这第一根K线它是有影线的，所以这个上影线表明了多头突破失败，随后多头们积极介入，顶部没有影线，这表明了紧迫性。市场愿意一直买入，直到K线收盘前的最后一刻，顺便说一句，这些都是在5分钟K线上完成的。空头们的情况也是一样，我们看到抛售和抛压加剧，然后这三根K线上都有影线。然后看我用箭头指向的这根K线，底部没有成交，所以他们愿意在最后一刻抛售。他们正在抛售，让我看到了更低的价格。","p":"p34"},{"t":"信号K线：衰竭","p":"p35"}]},{"t":"para","text":"指的是K线的顶部或底部没有任何影线，这表明了趋势方向上的紧迫性。多头希望K线的顶部没有影线。所以看这第一根K线它是有影线的，所以这个上影线表明了多头突破失败，随后多头们积极介入，顶部没有影线，这表明了紧迫性。市场愿意一直买入，直到K线收盘前的最后一刻，顺便说一句，这些都是在5分钟K线上完成的。空头们的情况也是一样，我们看到抛售和抛压加剧，然后这三根K线上都有影线。然后看我用箭头指向的这根K线，底部没有成交，所以他们愿意在最后一刻抛售。他们正在抛售，让我看到了更低的价格。","pid":"p34"},{"t":"para","text":"信号K线：衰竭","pid":"p35"},{"t":"img","src":"assets/img/c01_012.webp","ilabel":"C1-13","icap":"什么是价格行为","fid":"fig13","ctx":[{"t":"指的是K线的顶部或底部没有任何影线，这表明了趋势方向上的紧迫性。多头希望K线的顶部没有影线。所以看这第一根K线它是有影线的，所以这个上影线表明了多头突破失败，随后多头们积极介入，顶部没有影线，这表明了紧迫性。市场愿意一直买入，直到K线收盘前的最后一刻，顺便说一句，这些都是在5分钟K线上完成的。空头们的情况也是一样，我们看到抛售和抛压加剧，然后这三根K线上都有影线。然后看我用箭头指向的这根K线，底部没有成交，所以他们愿意在最后一刻抛售。他们正在抛售，让我看到了更低的价格。","p":"p34"},{"t":"信号K线：衰竭","p":"p35"},{"t":"这根K线出现在趋势的末端，并且能迅速触及支撑和阻力位。通常出现在趋势的末端比所有K线都更大，那么我们现在看到这个K线还不错，随着突破的开始，然后我们看到一些回撤和一些重叠，然后这根线突然就冲向了阻力位，这个K线明显比左边的所有K线都大，而且涨得更快。因为市场涨得这么快，他们会觉得这是个礼物，然后大家就会获利了结。这通常会在重要的阻力位停下，所以看到空头们纷纷做空，多头正在获利了结，他们正在卖出他们的仓位，然后空头们也在卖出，所以这就造成了同一时间点有两种人在卖出。这个熊旗也是同理，我们可以看到一根强劲的空头K线，开启了这波趋势，然后我们一路下行，期间有几次回调。然后在趋势末端出现了一个漂亮的K线，这些K线看起来几乎一样，但它仍然比之前的10根K线都大。这根K线也快速下探至支撑位，大家可以看到空头们正在获利了结，而多头们正在逢低买入。这些是衰竭K线的迹象，交易者应该考虑平仓，并等待新的建仓形态。","p":"p36"},{"t":"外包K线：","p":"p37"},{"t":"外包K线是指在较小的时间周期上出现的大幅波动，这些K线可能会被误认为是突破K线，导致交易者在高点买入，在低点做空，止损通常设在离入场点较远的位置，综上所述，外包K线可能构成陷阱。外包K线常常是绝佳的信号K线，如果交易背景合适的话，要让交易背景变得合适，这根K线必须出现在趋势反转之后，在趋势线被突破之后，我会在第一章里单独开辟一个章节来讲外包K线，因为交易者很容易在外包线上被套牢。在一个糟糕的外包K线上，亏损的风险非常高，因为他们看起来很像突破K线。","p":"p38"}]},{"t":"para","text":"这根K线出现在趋势的末端，并且能迅速触及支撑和阻力位。通常出现在趋势的末端比所有K线都更大，那么我们现在看到这个K线还不错，随着突破的开始，然后我们看到一些回撤和一些重叠，然后这根线突然就冲向了阻力位，这个K线明显比左边的所有K线都大，而且涨得更快。因为市场涨得这么快，他们会觉得这是个礼物，然后大家就会获利了结。这通常会在重要的阻力位停下，所以看到空头们纷纷做空，多头正在获利了结，他们正在卖出他们的仓位，然后空头们也在卖出，所以这就造成了同一时间点有两种人在卖出。这个熊旗也是同理，我们可以看到一根强劲的空头K线，开启了这波趋势，然后我们一路下行，期间有几次回调。然后在趋势末端出现了一个漂亮的K线，这些K线看起来几乎一样，但它仍然比之前的10根K线都大。这根K线也快速下探至支撑位，大家可以看到空头们正在获利了结，而多头们正在逢低买入。这些是衰竭K线的迹象，交易者应该考虑平仓，并等待新的建仓形态。","pid":"p36"},{"t":"para","text":"外包K线：","pid":"p37"},{"t":"para","text":"外包K线是指在较小的时间周期上出现的大幅波动，这些K线可能会被误认为是突破K线，导致交易者在高点买入，在低点做空，止损通常设在离入场点较远的位置，综上所述，外包K线可能构成陷阱。外包K线常常是绝佳的信号K线，如果交易背景合适的话，要让交易背景变得合适，这根K线必须出现在趋势反转之后，在趋势线被突破之后，我会在第一章里单独开辟一个章节来讲外包K线，因为交易者很容易在外包线上被套牢。在一个糟糕的外包K线上，亏损的风险非常高，因为他们看起来很像突破K线。","pid":"p38"},{"t":"img","src":"assets/img/c01_013.webp","ilabel":"C1-14","icap":"什么是价格行为","fid":"fig14","ctx":[{"t":"外包K线：","p":"p37"},{"t":"外包K线是指在较小的时间周期上出现的大幅波动，这些K线可能会被误认为是突破K线，导致交易者在高点买入，在低点做空，止损通常设在离入场点较远的位置，综上所述，外包K线可能构成陷阱。外包K线常常是绝佳的信号K线，如果交易背景合适的话，要让交易背景变得合适，这根K线必须出现在趋势反转之后，在趋势线被突破之后，我会在第一章里单独开辟一个章节来讲外包K线，因为交易者很容易在外包线上被套牢。在一个糟糕的外包K线上，亏损的风险非常高，因为他们看起来很像突破K线。","p":"p38"},{"t":"所以这是一个例子，这些都是较好的外包K线案例，你看到一个强劲的空头趋势，伴随着通道线被突破以及一次回测，这根K线正在回测低点，但没能成功。空头们试图在低点做空，多头们将K线拉回到其高点，而且市场缺乏进一步的下行动力，所以他们愿意在空头通道之后以最后一个收盘价为主。随着这表明市场可能正在区间内转变，或者是一个小幅回调。这是一个看涨吞噬K线，吞噬了之前所有K线的高点和低点，并且收盘价非常强劲，这是一个看跌吞噬K线，在这里我们可以看到多头正试图推高，而空头们实现了趋势线突破，然后由回升至此进行回测，这根看跌的K线比这个十字星高了几个点。所以多头被套住了，空头们将价格强行拉至低点。这里有一个小小的波动，但没关系，因为我可以看到整体行情背景很好，我们知道多头被套住了，多头买入这根K线，结果在这个十字星处被套，他们又试图加仓买入，结果再次被套，空头们将价格猛的压了下来。所以买入这根K线的那些多头，现在账面亏损，我们看到这导致了价格下跌，所以这是一个好的外包K线。","p":"p39"}]},{"t":"para","text":"所以这是一个例子，这些都是较好的外包K线案例，你看到一个强劲的空头趋势，伴随着通道线被突破以及一次回测，这根K线正在回测低点，但没能成功。空头们试图在低点做空，多头们将K线拉回到其高点，而且市场缺乏进一步的下行动力，所以他们愿意在空头通道之后以最后一个收盘价为主。随着这表明市场可能正在区间内转变，或者是一个小幅回调。这是一个看涨吞噬K线，吞噬了之前所有K线的高点和低点，并且收盘价非常强劲，这是一个看跌吞噬K线，在这里我们可以看到多头正试图推高，而空头们实现了趋势线突破，然后由回升至此进行回测，这根看跌的K线比这个十字星高了几个点。所以多头被套住了，空头们将价格强行拉至低点。这里有一个小小的波动，但没关系，因为我可以看到整体行情背景很好，我们知道多头被套住了，多头买入这根K线，结果在这个十字星处被套，他们又试图加仓买入，结果再次被套，空头们将价格猛的压了下来。所以买入这根K线的那些多头，现在账面亏损，我们看到这导致了价格下跌，所以这是一个好的外包K线。","pid":"p39"},{"t":"img","src":"assets/img/c01_014.webp","ilabel":"C1-15","icap":"什么是价格行为","fid":"fig15","ctx":[{"t":"所以这是一个例子，这些都是较好的外包K线案例，你看到一个强劲的空头趋势，伴随着通道线被突破以及一次回测，这根K线正在回测低点，但没能成功。空头们试图在低点做空，多头们将K线拉回到其高点，而且市场缺乏进一步的下行动力，所以他们愿意在空头通道之后以最后一个收盘价为主。随着这表明市场可能正在区间内转变，或者是一个小幅回调。这是一个看涨吞噬K线，吞噬了之前所有K线的高点和低点，并且收盘价非常强劲，这是一个看跌吞噬K线，在这里我们可以看到多头正试图推高，而空头们实现了趋势线突破，然后由回升至此进行回测，这根看跌的K线比这个十字星高了几个点。所以多头被套住了，空头们将价格强行拉至低点。这里有一个小小的波动，但没关系，因为我可以看到整体行情背景很好，我们知道多头被套住了，多头买入这根K线，结果在这个十字星处被套，他们又试图加仓买入，结果再次被套，空头们将价格猛的压了下来。所以买入这根K线的那些多头，现在账面亏损，我们看到这导致了价格下跌，所以这是一个好的外包K线。","p":"p39"},{"t":"这是背景不好的外包K线，没有趋势通道线突破，市场只是在横盘整理。由于市场在横盘整理，多头买入了这根K线，所以他们低位买入，高位卖出。如果你是一个多头，认为这是一个突破前一根K线的最佳机会并追高买入，你就会被套牢，如果你是一个空头，在这里做空，低点就会被震荡出局。在不利的背景下出现了看涨的外包K线，这是一个看跌的外包K线，思路完全一样，市场处于横盘整理，价格没有向上拓展，记住，我们知道趋势K线是什么样子的，这看起来有很多重叠，情况不妙，多头一个tick上成交，空头也在一个tick上成交，那这个K线和这张K线上，交易者被套住了。如果空头在这里做空，他会把止损设在这里，然而市场立即就反转了，如果多头在这里做多，它会在下方设置止损，触发后市场会立刻反转。基于这些原因，不好的外包K线可能变成陷阱。并且确保出现趋势通道线突破，这一点非常重要。","p":"p40"},{"t":"K线收盘价的重要性","p":"p41"},{"t":"在入场前等待K线收盘很重要，因为收盘价能提供很多信息。这种情况发生的速度通常太快，交易者来不及转向正确方向。就会产生两个后果，交易者想多赚几个点，现在他处于亏损头寸，并且错过了能盈利的入场机会。交易者想多赚的那几个点根本不值得，这部分我没准备PPT，因为内容比较简短。是brooks讲解的一小部分内容，请等K线收盘，因为5分钟K线可能在最后一秒就崩盘。到时候你可能高位接盘或者低位站岗，最后发现是假突破。","p":"p42"},{"t":"交易所交易基金etf和反向图表","p":"p43"},{"t":"有时看看etf可以帮助我们更好的理解价格走势。Spy和E-mini几乎一模一样，如果你在看时遇到困难，有时反向图表能提供更清晰的视角。大家都知道Spy是什么，它是一种ETF，有时在一个交易品种上看到的价格行为比在另一个交易品种上更清晰。我认为Spx也是如此。对，坚持你交易的那个品种，坚持你的券商允许你下单的那个。如果你在看图时遇到困难，有谁可以翻转图表来看。","p":"p44"}]},{"t":"para","text":"这是背景不好的外包K线，没有趋势通道线突破，市场只是在横盘整理。由于市场在横盘整理，多头买入了这根K线，所以他们低位买入，高位卖出。如果你是一个多头，认为这是一个突破前一根K线的最佳机会并追高买入，你就会被套牢，如果你是一个空头，在这里做空，低点就会被震荡出局。在不利的背景下出现了看涨的外包K线，这是一个看跌的外包K线，思路完全一样，市场处于横盘整理，价格没有向上拓展，记住，我们知道趋势K线是什么样子的，这看起来有很多重叠，情况不妙，多头一个tick上成交，空头也在一个tick上成交，那这个K线和这张K线上，交易者被套住了。如果空头在这里做空，他会把止损设在这里，然而市场立即就反转了，如果多头在这里做多，它会在下方设置止损，触发后市场会立刻反转。基于这些原因，不好的外包K线可能变成陷阱。并且确保出现趋势通道线突破，这一点非常重要。","pid":"p40"},{"t":"para","text":"K线收盘价的重要性","pid":"p41"},{"t":"para","text":"在入场前等待K线收盘很重要，因为收盘价能提供很多信息。这种情况发生的速度通常太快，交易者来不及转向正确方向。就会产生两个后果，交易者想多赚几个点，现在他处于亏损头寸，并且错过了能盈利的入场机会。交易者想多赚的那几个点根本不值得，这部分我没准备PPT，因为内容比较简短。是brooks讲解的一小部分内容，请等K线收盘，因为5分钟K线可能在最后一秒就崩盘。到时候你可能高位接盘或者低位站岗，最后发现是假突破。","pid":"p42"},{"t":"para","text":"交易所交易基金etf和反向图表","pid":"p43"},{"t":"para","text":"有时看看etf可以帮助我们更好的理解价格走势。Spy和E-mini几乎一模一样，如果你在看时遇到困难，有时反向图表能提供更清晰的视角。大家都知道Spy是什么，它是一种ETF，有时在一个交易品种上看到的价格行为比在另一个交易品种上更清晰。我认为Spx也是如此。对，坚持你交易的那个品种，坚持你的券商允许你下单的那个。如果你在看图时遇到困难，有谁可以翻转图表来看。","pid":"p44"},{"t":"img","src":"assets/img/c01_015.webp","ilabel":"C1-16","icap":"什么是价格行为","fid":"fig16","ctx":[{"t":"交易所交易基金etf和反向图表","p":"p43"},{"t":"有时看看etf可以帮助我们更好的理解价格走势。Spy和E-mini几乎一模一样，如果你在看时遇到困难，有时反向图表能提供更清晰的视角。大家都知道Spy是什么，它是一种ETF，有时在一个交易品种上看到的价格行为比在另一个交易品种上更清晰。我认为Spx也是如此。对，坚持你交易的那个品种，坚持你的券商允许你下单的那个。如果你在看图时遇到困难，有谁可以翻转图表来看。","p":"p44"},{"t":"我个人更看涨，所以如果我遇到如何解读下跌行情的问题，我可能会反转图表来帮助自己看的更偏向看涨。这其实是一张看涨图表的镜像，这些箭头指向了数轴点，关键价位。所以你可以看到这两张图表是相同的，一张看起来是上涨趋势，另一张看起来是下跌趋势，但他们的价格走势却是翻转过来的。","p":"p45"},{"t":"二次入场：是更好的入场机会，因为它表明市场已经尝试两次，但都没能朝一个方向突破。如果二次入场的价格更好，这可能是一个诱多或诱空陷阱。二次入场时，成交价应该会差一些，因为需要等待着，他帮我省了很多钱，也找到了更好的交易机会。","p":"p46"}]},{"t":"para","text":"我个人更看涨，所以如果我遇到如何解读下跌行情的问题，我可能会反转图表来帮助自己看的更偏向看涨。这其实是一张看涨图表的镜像，这些箭头指向了数轴点，关键价位。所以你可以看到这两张图表是相同的，一张看起来是上涨趋势，另一张看起来是下跌趋势，但他们的价格走势却是翻转过来的。","pid":"p45"},{"t":"para","text":"二次入场：是更好的入场机会，因为它表明市场已经尝试两次，但都没能朝一个方向突破。如果二次入场的价格更好，这可能是一个诱多或诱空陷阱。二次入场时，成交价应该会差一些，因为需要等待着，他帮我省了很多钱，也找到了更好的交易机会。","pid":"p46"},{"t":"img","src":"assets/img/c01_016.webp","ilabel":"C1-17","icap":"什么是价格行为","fid":"fig17","ctx":[{"t":"我个人更看涨，所以如果我遇到如何解读下跌行情的问题，我可能会反转图表来帮助自己看的更偏向看涨。这其实是一张看涨图表的镜像，这些箭头指向了数轴点，关键价位。所以你可以看到这两张图表是相同的，一张看起来是上涨趋势，另一张看起来是下跌趋势，但他们的价格走势却是翻转过来的。","p":"p45"},{"t":"二次入场：是更好的入场机会，因为它表明市场已经尝试两次，但都没能朝一个方向突破。如果二次入场的价格更好，这可能是一个诱多或诱空陷阱。二次入场时，成交价应该会差一些，因为需要等待着，他帮我省了很多钱，也找到了更好的交易机会。","p":"p46"},{"t":"这是一个牛旗，一次是好的二次入场，一次是坏的二次入场。这里我们看到第一次回调形成了一个高一，这是第二次入场，然后又一次回调，又形成了一个高点。也形成了第二次入场。这表明空头的一次突破失败。上涨，并且第二次也未能突破。这造成了套牢，并打破了空头通道，这是一个好的买入点。这是一个糟糕的买入点，这仍然是一个牛旗，但你可以看到高点就在这儿。然后深度回调也形成了一个高点。你可能会想到这是一个震荡区间里的操作，我应该买在这个高点，因为这个K线很强，是光头光脚K线。顶部没有影线，这正是我们刚才在前面几页讲过的，然而这两者的区别在于突破时没有趋势通道。在多头趋势之后，我们仍然处于一个宽幅的空头通道里，这更像是一个震荡区间的一个操作，你看，买在这个高点，如果你进场了，就会被套牢，变成亏损的头寸。如果在创出新高后，价格在此处形成了一个更高的低点，那么这将是一个盈利的交易头寸。这是一个不错的机会，这是一个陷阱，空头们被套住了，未能实现突破。在这里空头的突破仍在进行中，这实际上只是空头趋势中的一次回调，对空头来说这是第一段行情，第二段行情。","p":"p47"}]},{"t":"para","text":"这是一个牛旗，一次是好的二次入场，一次是坏的二次入场。这里我们看到第一次回调形成了一个高一，这是第二次入场，然后又一次回调，又形成了一个高点。也形成了第二次入场。这表明空头的一次突破失败。上涨，并且第二次也未能突破。这造成了套牢，并打破了空头通道，这是一个好的买入点。这是一个糟糕的买入点，这仍然是一个牛旗，但你可以看到高点就在这儿。然后深度回调也形成了一个高点。你可能会想到这是一个震荡区间里的操作，我应该买在这个高点，因为这个K线很强，是光头光脚K线。顶部没有影线，这正是我们刚才在前面几页讲过的，然而这两者的区别在于突破时没有趋势通道。在多头趋势之后，我们仍然处于一个宽幅的空头通道里，这更像是一个震荡区间的一个操作，你看，买在这个高点，如果你进场了，就会被套牢，变成亏损的头寸。如果在创出新高后，价格在此处形成了一个更高的低点，那么这将是一个盈利的交易头寸。这是一个不错的机会，这是一个陷阱，空头们被套住了，未能实现突破。在这里空头的突破仍在进行中，这实际上只是空头趋势中的一次回调，对空头来说这是第一段行情，第二段行情。","pid":"p47"},{"t":"img","src":"assets/img/c01_017.webp","ilabel":"C1-18","icap":"什么是价格行为","fid":"fig18","ctx":[{"t":"这是一个牛旗，一次是好的二次入场，一次是坏的二次入场。这里我们看到第一次回调形成了一个高一，这是第二次入场，然后又一次回调，又形成了一个高点。也形成了第二次入场。这表明空头的一次突破失败。上涨，并且第二次也未能突破。这造成了套牢，并打破了空头通道，这是一个好的买入点。这是一个糟糕的买入点，这仍然是一个牛旗，但你可以看到高点就在这儿。然后深度回调也形成了一个高点。你可能会想到这是一个震荡区间里的操作，我应该买在这个高点，因为这个K线很强，是光头光脚K线。顶部没有影线，这正是我们刚才在前面几页讲过的，然而这两者的区别在于突破时没有趋势通道。在多头趋势之后，我们仍然处于一个宽幅的空头通道里，这更像是一个震荡区间的一个操作，你看，买在这个高点，如果你进场了，就会被套牢，变成亏损的头寸。如果在创出新高后，价格在此处形成了一个更高的低点，那么这将是一个盈利的交易头寸。这是一个不错的机会，这是一个陷阱，空头们被套住了，未能实现突破。在这里空头的突破仍在进行中，这实际上只是空头趋势中的一次回调，对空头来说这是第一段行情，第二段行情。","p":"p47"},{"t":"这是第二次入场机会，是看跌的，这是一个不错的第二次入场机会，我们可以到双顶和熊旗。这个形态有点难以辨认，但如果我们在这根K线上入场，我们的价格会还算可以，但得再等等（更多信号）。我们得等回调，第二次入场价格更差，但信息更多，两根K线反转，小影线导致了又一次下跌。如果我们现在进场，成交价会更差，所以入场点更差。这是一个更好的入场点，但我们为此付出了代价。糟糕的二次入场。强劲的多头K线，这里可以尝试做空，多头又推上了一波，你再试一次。你看价格更好，可以做空，因为这个K线比那个线高，所以这可能真是个多头趋势，看到了双顶和旗型，最终形成牛旗。所以也就是说第二次入场的话，价格会更好。这次二次入场价格比上次高，这样你就能多赚几点，这个价格更好，这个二次入场点更差，它比这个低，所以价格更差。而且我们掌握了更多信息，现在我们看到了双顶形态，伴随着两根反转K线，这里也是一样，价格更差。所以，如果你在这里入场，你将损失几个点，因为这是一个低价K线入场。理论上，这是一个好入场点，因为你可以买的更低。但因为你买的更低，后续你实际上是买在了空头趋势的一段。你掌握了更多信息，为什么还要以更好的时机去获取信息呢？","p":"p48"},{"t":"入场太晚或错过了入场时机","p":"p49"},{"t":"在交易趋势行情时很容易错过最佳入场点，如果交易者错过入场时机或者入场太晚，那应该以部分仓位或设置好止损的方式市价入场，在使用正确止损的情况下，AL遵循一个经验法则，即入场时使用20%的仓位，一份mini合约相当于10个微型合约，两个微型合约相当于1份E-mini合约的20%，所以这意味着如果你想在趋势的后期再进入，并且看到市场已经跑得飞快了，就用20%的仓位进入趋势，并设好止损。如果你想在E-mini合约已经跑出一段距离后才入场，你的止损可能需要设置10-15个点。仅仅一个合约就可能让你亏损500~600美元，为了那几个点这么做不值得，所以你要建议开两个微型合约，因为这相当于一个E-mini合约的20%。一个E-mini合约等于10个微型合约。","p":"p50"}]},{"t":"para","text":"这是第二次入场机会，是看跌的，这是一个不错的第二次入场机会，我们可以到双顶和熊旗。这个形态有点难以辨认，但如果我们在这根K线上入场，我们的价格会还算可以，但得再等等（更多信号）。我们得等回调，第二次入场价格更差，但信息更多，两根K线反转，小影线导致了又一次下跌。如果我们现在进场，成交价会更差，所以入场点更差。这是一个更好的入场点，但我们为此付出了代价。糟糕的二次入场。强劲的多头K线，这里可以尝试做空，多头又推上了一波，你再试一次。你看价格更好，可以做空，因为这个K线比那个线高，所以这可能真是个多头趋势，看到了双顶和旗型，最终形成牛旗。所以也就是说第二次入场的话，价格会更好。这次二次入场价格比上次高，这样你就能多赚几点，这个价格更好，这个二次入场点更差，它比这个低，所以价格更差。而且我们掌握了更多信息，现在我们看到了双顶形态，伴随着两根反转K线，这里也是一样，价格更差。所以，如果你在这里入场，你将损失几个点，因为这是一个低价K线入场。理论上，这是一个好入场点，因为你可以买的更低。但因为你买的更低，后续你实际上是买在了空头趋势的一段。你掌握了更多信息，为什么还要以更好的时机去获取信息呢？","pid":"p48"},{"t":"para","text":"入场太晚或错过了入场时机","pid":"p49"},{"t":"para","text":"在交易趋势行情时很容易错过最佳入场点，如果交易者错过入场时机或者入场太晚，那应该以部分仓位或设置好止损的方式市价入场，在使用正确止损的情况下，AL遵循一个经验法则，即入场时使用20%的仓位，一份mini合约相当于10个微型合约，两个微型合约相当于1份E-mini合约的20%，所以这意味着如果你想在趋势的后期再进入，并且看到市场已经跑得飞快了，就用20%的仓位进入趋势，并设好止损。如果你想在E-mini合约已经跑出一段距离后才入场，你的止损可能需要设置10-15个点。仅仅一个合约就可能让你亏损500~600美元，为了那几个点这么做不值得，所以你要建议开两个微型合约，因为这相当于一个E-mini合约的20%。一个E-mini合约等于10个微型合约。","pid":"p50"}],"wcount":7247},{"id":"c2","title":"第2章　趋势线与通道线","icon":"2","sections":[],"blocks":[{"t":"para","text":"第二章 趋势与趋势通道线","pid":"p51"},{"t":"para","text":"目录：1.趋势线，微观趋势线，短小陡峭的趋势线与强劲的趋势2.水平线，波动点及其他关键价格水平。3.趋势通道线4.最后还有双线交汇于趋势线和趋势通道线。","pid":"p52"},{"t":"para","text":"趋势线：实现最赚钱的交易，永远是顺势而为。一旦画出趋势线，就等价格回踩趋势线，如果市场给出好的顺势信号，就进场交易。我们可以通过趋势线的倾斜度或平衡度来判断趋势的强弱。当趋势线被打破时，我们可以借此看到另一方的力量。逆势交易者有时用K线的实体来画趋势线效果很好。","pid":"p53"},{"t":"img","src":"assets/img/c02_018.webp","ilabel":"C2-1","icap":"趋势线与通道线","fid":"fig19","ctx":[{"t":"目录：1.趋势线，微观趋势线，短小陡峭的趋势线与强劲的趋势2.水平线，波动点及其他关键价格水平。3.趋势通道线4.最后还有双线交汇于趋势线和趋势通道线。","p":"p52"},{"t":"趋势线：实现最赚钱的交易，永远是顺势而为。一旦画出趋势线，就等价格回踩趋势线，如果市场给出好的顺势信号，就进场交易。我们可以通过趋势线的倾斜度或平衡度来判断趋势的强弱。当趋势线被打破时，我们可以借此看到另一方的力量。逆势交易者有时用K线的实体来画趋势线效果很好。","p":"p53"},{"t":"这里举例说明，这里和这里有多条宽阔的多头趋势线，然后在此之内我们用细微的多头趋势线，最终被陡峭的空头趋势线打破。这里是空头的一条细微趋势线，被包含在更宽阔的空头趋势线内。这些全都是多头趋势线，非常强劲的多头趋势，并且在此之内我们也看到了强势的多头通道。这里，这里和这里绘制了趋势线。","p":"p54"}]},{"t":"para","text":"这里举例说明，这里和这里有多条宽阔的多头趋势线，然后在此之内我们用细微的多头趋势线，最终被陡峭的空头趋势线打破。这里是空头的一条细微趋势线，被包含在更宽阔的空头趋势线内。这些全都是多头趋势线，非常强劲的多头趋势，并且在此之内我们也看到了强势的多头通道。这里，这里和这里绘制了趋势线。","pid":"p54"},{"t":"img","src":"assets/img/c02_019.webp","ilabel":"C2-2","icap":"趋势线与通道线","fid":"fig20","ctx":[{"t":"这里举例说明，这里和这里有多条宽阔的多头趋势线，然后在此之内我们用细微的多头趋势线，最终被陡峭的空头趋势线打破。这里是空头的一条细微趋势线，被包含在更宽阔的空头趋势线内。这些全都是多头趋势线，非常强劲的多头趋势，并且在此之内我们也看到了强势的多头通道。这里，这里和这里绘制了趋势线。","p":"p54"},{"t":"空头趋势线：我们可以看到，行情从一个波动高点开始，然后我们回落，其中包含一条趋势线。一条趋势线会包容所有的价格行为，在这条趋势线内部存在多条更小的趋势线，同样包容了看跌的价格行为。","p":"p55"},{"t":"微观趋势线：在强劲的趋势中，那些细小而陡峭的趋势线，微观趋势线可以在任何时间周期上绘制，它是一条画在2~10根K线之间，位于更大趋势内部的较小趋势线。当一条微观趋势线出现假突破时，这可能会形成一个好的多头或熊旗打下基础，至少可以带来几个点的收益，当趋势线很陡时，顺着趋势方向操作。新手应该避免逆势交易。随着趋势的延续，趋势线会逐渐变得平缓，最终市场会出现反向的趋势线。观察微观趋势线时，没必要切换到更小的时间周期，在5分钟图上就能看到，并进行交易，更小的时间周期会产生更多假信号。","p":"p56"}]},{"t":"para","text":"空头趋势线：我们可以看到，行情从一个波动高点开始，然后我们回落，其中包含一条趋势线。一条趋势线会包容所有的价格行为，在这条趋势线内部存在多条更小的趋势线，同样包容了看跌的价格行为。","pid":"p55"},{"t":"para","text":"微观趋势线：在强劲的趋势中，那些细小而陡峭的趋势线，微观趋势线可以在任何时间周期上绘制，它是一条画在2~10根K线之间，位于更大趋势内部的较小趋势线。当一条微观趋势线出现假突破时，这可能会形成一个好的多头或熊旗打下基础，至少可以带来几个点的收益，当趋势线很陡时，顺着趋势方向操作。新手应该避免逆势交易。随着趋势的延续，趋势线会逐渐变得平缓，最终市场会出现反向的趋势线。观察微观趋势线时，没必要切换到更小的时间周期，在5分钟图上就能看到，并进行交易，更小的时间周期会产生更多假信号。","pid":"p56"},{"t":"img","src":"assets/img/c02_020.webp","ilabel":"C2-3","icap":"趋势线与通道线","fid":"fig21","ctx":[{"t":"空头趋势线：我们可以看到，行情从一个波动高点开始，然后我们回落，其中包含一条趋势线。一条趋势线会包容所有的价格行为，在这条趋势线内部存在多条更小的趋势线，同样包容了看跌的价格行为。","p":"p55"},{"t":"微观趋势线：在强劲的趋势中，那些细小而陡峭的趋势线，微观趋势线可以在任何时间周期上绘制，它是一条画在2~10根K线之间，位于更大趋势内部的较小趋势线。当一条微观趋势线出现假突破时，这可能会形成一个好的多头或熊旗打下基础，至少可以带来几个点的收益，当趋势线很陡时，顺着趋势方向操作。新手应该避免逆势交易。随着趋势的延续，趋势线会逐渐变得平缓，最终市场会出现反向的趋势线。观察微观趋势线时，没必要切换到更小的时间周期，在5分钟图上就能看到，并进行交易，更小的时间周期会产生更多假信号。","p":"p56"},{"t":"看涨微观趋势线：这里可以看到一条强劲的看涨趋势线，通过这些K线影线处，多次出现的趋势线突破，我想说的是，我画的这些箭头。原本是在5分钟图上画的，后来我切换到了1分钟的时间周期，我并没有重新画这个箭头。所以就意味着这些K线的下影线向下突破。确实能形成漂亮的牛旗，我看到趋势线突破。这个箭头指向了漂亮的牛旗回调。强劲的回调形成了更高的低点，这是一个牛旗，强劲的回调，随后又一次突破和牛旗，和上一个情况一样，我们在这里看到的是5分钟图上的这些小K线，影线。","p":"p57"}]},{"t":"para","text":"看涨微观趋势线：这里可以看到一条强劲的看涨趋势线，通过这些K线影线处，多次出现的趋势线突破，我想说的是，我画的这些箭头。原本是在5分钟图上画的，后来我切换到了1分钟的时间周期，我并没有重新画这个箭头。所以就意味着这些K线的下影线向下突破。确实能形成漂亮的牛旗，我看到趋势线突破。这个箭头指向了漂亮的牛旗回调。强劲的回调形成了更高的低点，这是一个牛旗，强劲的回调，随后又一次突破和牛旗，和上一个情况一样，我们在这里看到的是5分钟图上的这些小K线，影线。","pid":"p57"},{"t":"img","src":"assets/img/c02_021.webp","ilabel":"C2-4","icap":"趋势线与通道线","fid":"fig22","ctx":[{"t":"看涨微观趋势线：这里可以看到一条强劲的看涨趋势线，通过这些K线影线处，多次出现的趋势线突破，我想说的是，我画的这些箭头。原本是在5分钟图上画的，后来我切换到了1分钟的时间周期，我并没有重新画这个箭头。所以就意味着这些K线的下影线向下突破。确实能形成漂亮的牛旗，我看到趋势线突破。这个箭头指向了漂亮的牛旗回调。强劲的回调形成了更高的低点，这是一个牛旗，强劲的回调，随后又一次突破和牛旗，和上一个情况一样，我们在这里看到的是5分钟图上的这些小K线，影线。","p":"p57"},{"t":"微观的下降趋势线，空头的情况也类似，我们这里有一条不错的趋势线，我们这里和这里出现了几次突破。这里有一次更深的回调以及这里更小的突破，所有这些都导致了1分钟时间周期上盈利的看跌旗型，但同样我们不必盯着1分钟时间周期来理解这些K线影线，在更小的时间周期上正在形成看跌旗型，这些形态最终都演变成了带有双顶的熊旗，这些熊旗会发生空头突破，并带来盈利的交易机会。","p":"p58"}]},{"t":"para","text":"微观的下降趋势线，空头的情况也类似，我们这里有一条不错的趋势线，我们这里和这里出现了几次突破。这里有一次更深的回调以及这里更小的突破，所有这些都导致了1分钟时间周期上盈利的看跌旗型，但同样我们不必盯着1分钟时间周期来理解这些K线影线，在更小的时间周期上正在形成看跌旗型，这些形态最终都演变成了带有双顶的熊旗，这些熊旗会发生空头突破，并带来盈利的交易机会。","pid":"p58"},{"t":"img","src":"assets/img/c02_022.webp","ilabel":"C2-5","icap":"趋势线与通道线","fid":"fig23","ctx":[{"t":"微观的下降趋势线，空头的情况也类似，我们这里有一条不错的趋势线，我们这里和这里出现了几次突破。这里有一次更深的回调以及这里更小的突破，所有这些都导致了1分钟时间周期上盈利的看跌旗型，但同样我们不必盯着1分钟时间周期来理解这些K线影线，在更小的时间周期上正在形成看跌旗型，这些形态最终都演变成了带有双顶的熊旗，这些熊旗会发生空头突破，并带来盈利的交易机会。","p":"p58"},{"t":"这些是陡峭的趋势线，我们只应该顺着这个方向操作。这里有一条整体的趋势线，然后是更小的趋势线，包含在更大的趋势线内。你可以尝试做空，但它需要非常快速的短线交易。这样做不值得，因为顺势操作能赚更多钱，顺着大趋势的方向，这里可能是一根2~3个点的多头K线，但你做空就能赚到5~6个点，趋势线突破后形成一个双顶看跌旗型。","p":"p59"}]},{"t":"para","text":"这些是陡峭的趋势线，我们只应该顺着这个方向操作。这里有一条整体的趋势线，然后是更小的趋势线，包含在更大的趋势线内。你可以尝试做空，但它需要非常快速的短线交易。这样做不值得，因为顺势操作能赚更多钱，顺着大趋势的方向，这里可能是一根2~3个点的多头K线，但你做空就能赚到5~6个点，趋势线突破后形成一个双顶看跌旗型。","pid":"p59"},{"t":"img","src":"assets/img/c02_023.webp","ilabel":"C2-6","icap":"趋势线与通道线","fid":"fig24","ctx":[{"t":"这些是陡峭的趋势线，我们只应该顺着这个方向操作。这里有一条整体的趋势线，然后是更小的趋势线，包含在更大的趋势线内。你可以尝试做空，但它需要非常快速的短线交易。这样做不值得，因为顺势操作能赚更多钱，顺着大趋势的方向，这里可能是一根2~3个点的多头K线，但你做空就能赚到5~6个点，趋势线突破后形成一个双顶看跌旗型。","p":"p59"},{"t":"强劲的趋势线趋于平缓，从看涨转为看跌，看跌趋势线只能变得越来越强，看涨趋势线正在变得平缓且宽阔。所以你看看趋势持续的时间越长，它就变得越平缓，然后有一天空头们确实开始赚钱了。这最终演变成了一次回调幅度非常大的回调，回调到了一个更宽阔的看涨趋势线。","p":"p60"}]},{"t":"para","text":"强劲的趋势线趋于平缓，从看涨转为看跌，看跌趋势线只能变得越来越强，看涨趋势线正在变得平缓且宽阔。所以你看看趋势持续的时间越长，它就变得越平缓，然后有一天空头们确实开始赚钱了。这最终演变成了一次回调幅度非常大的回调，回调到了一个更宽阔的看涨趋势线。","pid":"p60"},{"t":"img","src":"assets/img/c02_024.webp","ilabel":"C2-7","icap":"趋势线与通道线","fid":"fig25","ctx":[{"t":"强劲的趋势线趋于平缓，从看涨转为看跌，看跌趋势线只能变得越来越强，看涨趋势线正在变得平缓且宽阔。所以你看看趋势持续的时间越长，它就变得越平缓，然后有一天空头们确实开始赚钱了。这最终演变成了一次回调幅度非常大的回调，回调到了一个更宽阔的看涨趋势线。","p":"p60"},{"t":"对空头而言，情况也是如此，我们可以看到一开始他的斜率非常陡峭，但随着多头开始发力，价格波动变得越来越小，越来越平缓，并且多头趋势线也随之变得更加稳固。这显示了所有的回调情况，最后的空头趋势线几乎触及了区间的高点。","p":"p61"},{"t":"水平线波动点以及其他关键价格水平：","p":"p62"},{"t":"市场更多时候处于区间震荡，而非趋势行情。水平线可以为设置好的交易提供依据，交易者应等待近期波动高点或低点的测试机会，然后顺势而为，朝那个方向进行交易，要想建立一个看涨头寸交易者，可关注双底形态，这说明困难了两次都没能创新低。要想建立一个看跌头寸，交易者会关注双顶形态，这说明多头们没能创新高。","p":"p63"}]},{"t":"para","text":"对空头而言，情况也是如此，我们可以看到一开始他的斜率非常陡峭，但随着多头开始发力，价格波动变得越来越小，越来越平缓，并且多头趋势线也随之变得更加稳固。这显示了所有的回调情况，最后的空头趋势线几乎触及了区间的高点。","pid":"p61"},{"t":"para","text":"水平线波动点以及其他关键价格水平：","pid":"p62"},{"t":"para","text":"市场更多时候处于区间震荡，而非趋势行情。水平线可以为设置好的交易提供依据，交易者应等待近期波动高点或低点的测试机会，然后顺势而为，朝那个方向进行交易，要想建立一个看涨头寸交易者，可关注双底形态，这说明困难了两次都没能创新低。要想建立一个看跌头寸，交易者会关注双顶形态，这说明多头们没能创新高。","pid":"p63"},{"t":"img","src":"assets/img/c02_025.webp","ilabel":"C2-8","icap":"趋势线与通道线","fid":"fig26","ctx":[{"t":"水平线波动点以及其他关键价格水平：","p":"p62"},{"t":"市场更多时候处于区间震荡，而非趋势行情。水平线可以为设置好的交易提供依据，交易者应等待近期波动高点或低点的测试机会，然后顺势而为，朝那个方向进行交易，要想建立一个看涨头寸交易者，可关注双底形态，这说明困难了两次都没能创新低。要想建立一个看跌头寸，交易者会关注双顶形态，这说明多头们没能创新高。","p":"p63"},{"t":"水平线波动点，这里有一个活动高点，然后把这条线向外延伸，这就确定了区间的顶部，而多头们则拿下了区间的底部。所以这些交易都是一次回测，这是对这个区域的回测，这是对该区域的更高高点回测。我们正在重新测试这个波动低点，我们正在重新测试这个波动低点和波动高点。这三笔交易都是熊旗双顶形态，这表明多头尝试了一次，又尝试了一次，但他们退出了仓位。被空头们制造了抛压，空头们看到多头被套在这里，于是纷纷做空，行情下跌了几段。多头们的情况则正好相反，多头看到空头们在这里做空，他们想在这里平仓离场，这就制造了买盘，当空头的回补空单，多头买入低位，行情上涨了两段。这里也是一样，在这里市场出现了假突破。然后拉伸至低点，然后多头向上走了几段，这是从这个波动高点形成的双底，上涨，回调，触及波动高点，双底形态促使价格测试近期高点。而那时空头就会接管。拉升者将在近期高点退出，空头则在近期高点做空，准备两段下跌，我们可以在所有时间周期中看到这种情况。这是对近期波动低点的双重底部测试。多头买入低点，然后向上走了两段，直至之前的波动高点。空头建立空头仓位，然后会进行两段下跌，所以你看多头和空头正是需要相互配合才能赚钱。这更像是我们日常会看到的盘整行情，而不是趋势。","p":"p64"},{"t":"趋势通道线：画多头趋势线是趋势线要画在K线下方，与之相反的那条线就叫做趋势通道线，它位于K线上方。画空头趋势线是趋势线要画在K线上方。逆势相反的，那条线就叫做趋势通道线，它位于空头K线下方。交易并进行逆势交易，直到出现强劲突破并回测通道线，在形成双顶后，多头通道会转变为空头通道。在形成双底后，空头通道会转变为多头通道。这两种形态都表明了一个楔形顶部或底部。","p":"p65"}]},{"t":"para","text":"水平线波动点，这里有一个活动高点，然后把这条线向外延伸，这就确定了区间的顶部，而多头们则拿下了区间的底部。所以这些交易都是一次回测，这是对这个区域的回测，这是对该区域的更高高点回测。我们正在重新测试这个波动低点，我们正在重新测试这个波动低点和波动高点。这三笔交易都是熊旗双顶形态，这表明多头尝试了一次，又尝试了一次，但他们退出了仓位。被空头们制造了抛压，空头们看到多头被套在这里，于是纷纷做空，行情下跌了几段。多头们的情况则正好相反，多头看到空头们在这里做空，他们想在这里平仓离场，这就制造了买盘，当空头的回补空单，多头买入低位，行情上涨了两段。这里也是一样，在这里市场出现了假突破。然后拉伸至低点，然后多头向上走了几段，这是从这个波动高点形成的双底，上涨，回调，触及波动高点，双底形态促使价格测试近期高点。而那时空头就会接管。拉升者将在近期高点退出，空头则在近期高点做空，准备两段下跌，我们可以在所有时间周期中看到这种情况。这是对近期波动低点的双重底部测试。多头买入低点，然后向上走了两段，直至之前的波动高点。空头建立空头仓位，然后会进行两段下跌，所以你看多头和空头正是需要相互配合才能赚钱。这更像是我们日常会看到的盘整行情，而不是趋势。","pid":"p64"},{"t":"para","text":"趋势通道线：画多头趋势线是趋势线要画在K线下方，与之相反的那条线就叫做趋势通道线，它位于K线上方。画空头趋势线是趋势线要画在K线上方。逆势相反的，那条线就叫做趋势通道线，它位于空头K线下方。交易并进行逆势交易，直到出现强劲突破并回测通道线，在形成双顶后，多头通道会转变为空头通道。在形成双底后，空头通道会转变为多头通道。这两种形态都表明了一个楔形顶部或底部。","pid":"p65"},{"t":"img","src":"assets/img/c02_026.webp","ilabel":"C2-9","icap":"趋势线与通道线","fid":"fig27","ctx":[{"t":"水平线波动点，这里有一个活动高点，然后把这条线向外延伸，这就确定了区间的顶部，而多头们则拿下了区间的底部。所以这些交易都是一次回测，这是对这个区域的回测，这是对该区域的更高高点回测。我们正在重新测试这个波动低点，我们正在重新测试这个波动低点和波动高点。这三笔交易都是熊旗双顶形态，这表明多头尝试了一次，又尝试了一次，但他们退出了仓位。被空头们制造了抛压，空头们看到多头被套在这里，于是纷纷做空，行情下跌了几段。多头们的情况则正好相反，多头看到空头们在这里做空，他们想在这里平仓离场，这就制造了买盘，当空头的回补空单，多头买入低位，行情上涨了两段。这里也是一样，在这里市场出现了假突破。然后拉伸至低点，然后多头向上走了几段，这是从这个波动高点形成的双底，上涨，回调，触及波动高点，双底形态促使价格测试近期高点。而那时空头就会接管。拉升者将在近期高点退出，空头则在近期高点做空，准备两段下跌，我们可以在所有时间周期中看到这种情况。这是对近期波动低点的双重底部测试。多头买入低点，然后向上走了两段，直至之前的波动高点。空头建立空头仓位，然后会进行两段下跌，所以你看多头和空头正是需要相互配合才能赚钱。这更像是我们日常会看到的盘整行情，而不是趋势。","p":"p64"},{"t":"趋势通道线：画多头趋势线是趋势线要画在K线下方，与之相反的那条线就叫做趋势通道线，它位于K线上方。画空头趋势线是趋势线要画在K线上方。逆势相反的，那条线就叫做趋势通道线，它位于空头K线下方。交易并进行逆势交易，直到出现强劲突破并回测通道线，在形成双顶后，多头通道会转变为空头通道。在形成双底后，空头通道会转变为多头通道。这两种形态都表明了一个楔形顶部或底部。","p":"p65"},{"t":"如何绘制上升通道线：我们从左下角开始，并将其延伸至右上角。这是多头的趋势线，而另一条线则限制了价格的波动，这就是趋势通道线。","p":"p66"}]},{"t":"para","text":"如何绘制上升通道线：我们从左下角开始，并将其延伸至右上角。这是多头的趋势线，而另一条线则限制了价格的波动，这就是趋势通道线。","pid":"p66"},{"t":"img","src":"assets/img/c02_027.webp","ilabel":"C2-10","icap":"趋势线与通道线","fid":"fig28","ctx":[{"t":"如何绘制上升通道线：我们从左下角开始，并将其延伸至右上角。这是多头的趋势线，而另一条线则限制了价格的波动，这就是趋势通道线。","p":"p66"},{"t":"看涨通道线突破，这里我们可以看到刚才提到的那个通道，然后价格出现了强劲突破，并回测了高点。这就是那个楔形顶部，它让空头下跌了两段。（优质的交易策略）","p":"p67"}]},{"t":"para","text":"看涨通道线突破，这里我们可以看到刚才提到的那个通道，然后价格出现了强劲突破，并回测了高点。这就是那个楔形顶部，它让空头下跌了两段。（优质的交易策略）","pid":"p67"},{"t":"img","src":"assets/img/c02_028.webp","ilabel":"C2-11","icap":"趋势线与通道线","fid":"fig29","ctx":[{"t":"看涨通道线突破，这里我们可以看到刚才提到的那个通道，然后价格出现了强劲突破，并回测了高点。这就是那个楔形顶部，它让空头下跌了两段。（优质的交易策略）","p":"p67"},{"t":"如何绘制空头通道线：从这里开始，我们向下画线将价格走势包含在内。这条线也起到了阻力作用，与这条相对的线叫做趋势通道线，在我们画了第一条包含空头价格走势的线之后，再画这条线。空头通道线被突破，通道线在这里被突破了，我们可以看到和刚才一模一样的通道。多头强力的两段上攻，突破了空头通道，然后他们会回踩测低点。这就形成了一个近期低点的双重底部，这里是楔形底部，为我们提供了第一次，第二次触及，以及第三次下探，这同时也为多头提供了两次上涨的机会，这更像是一种内部的观察，我们来看看图表，刚才我们看了包含所有信息的横盘价格行为。","p":"p68"},{"t":"对峙的趋势线：相交的趋势线和趋势通道线","p":"p69"},{"t":"对峙的线条由两条趋势线构成，通常是一条长期趋势线和一条短期的方向相反的趋势线，我们的目标是观察价格行为在交汇处如何反应，然后果断出手。","p":"p70"}]},{"t":"para","text":"如何绘制空头通道线：从这里开始，我们向下画线将价格走势包含在内。这条线也起到了阻力作用，与这条相对的线叫做趋势通道线，在我们画了第一条包含空头价格走势的线之后，再画这条线。空头通道线被突破，通道线在这里被突破了，我们可以看到和刚才一模一样的通道。多头强力的两段上攻，突破了空头通道，然后他们会回踩测低点。这就形成了一个近期低点的双重底部，这里是楔形底部，为我们提供了第一次，第二次触及，以及第三次下探，这同时也为多头提供了两次上涨的机会，这更像是一种内部的观察，我们来看看图表，刚才我们看了包含所有信息的横盘价格行为。","pid":"p68"},{"t":"para","text":"对峙的趋势线：相交的趋势线和趋势通道线","pid":"p69"},{"t":"para","text":"对峙的线条由两条趋势线构成，通常是一条长期趋势线和一条短期的方向相反的趋势线，我们的目标是观察价格行为在交汇处如何反应，然后果断出手。","pid":"p70"},{"t":"img","src":"assets/img/c02_029.webp","ilabel":"C2-12","icap":"趋势线与通道线","fid":"fig30","ctx":[{"t":"对峙的趋势线：相交的趋势线和趋势通道线","p":"p69"},{"t":"对峙的线条由两条趋势线构成，通常是一条长期趋势线和一条短期的方向相反的趋势线，我们的目标是观察价格行为在交汇处如何反应，然后果断出手。","p":"p70"},{"t":"这是一条看涨的趋势通道线，这里有一个非常强势的多头通道，串联起所有的低点。这里我们发现一条较小的空头通道线，正切入这条多头通道线，我们可以看到，多头强势突破了这条通道线，随后进行回踩确认，并继续上涨。","p":"p71"}]},{"t":"para","text":"这是一条看涨的趋势通道线，这里有一个非常强势的多头通道，串联起所有的低点。这里我们发现一条较小的空头通道线，正切入这条多头通道线，我们可以看到，多头强势突破了这条通道线，随后进行回踩确认，并继续上涨。","pid":"p71"},{"t":"img","src":"assets/img/c02_030.webp","ilabel":"C2-13","icap":"趋势线与通道线","fid":"fig31","ctx":[{"t":"这是一条看涨的趋势通道线，这里有一个非常强势的多头通道，串联起所有的低点。这里我们发现一条较小的空头通道线，正切入这条多头通道线，我们可以看到，多头强势突破了这条通道线，随后进行回踩确认，并继续上涨。","p":"p71"},{"t":"看跌对峙趋势线","p":"p72"},{"t":"这里有一条强劲的空头趋势线，由三个点连接二次，分别是点123。以及在这条空头趋势线内部的一条较小的多头趋势线，目前空头动能更强，我们应该避免进行，逆势交易。这使得市场呈现出一个双顶形态，或者是一个微型双顶。在这里空头们顺着大趋势线，开启了第二次下跌。","p":"p73"}]},{"t":"para","text":"看跌对峙趋势线","pid":"p72"},{"t":"para","text":"这里有一条强劲的空头趋势线，由三个点连接二次，分别是点123。以及在这条空头趋势线内部的一条较小的多头趋势线，目前空头动能更强，我们应该避免进行，逆势交易。这使得市场呈现出一个双顶形态，或者是一个微型双顶。在这里空头们顺着大趋势线，开启了第二次下跌。","pid":"p73"}],"wcount":3052},{"id":"c3","title":"第3章　趋势","icon":"3","sections":[],"blocks":[{"t":"para","text":"第三章 趋势","pid":"p74"},{"t":"para","text":"目录：两段式走势形态，强劲信号，常见的趋势形态，开盘及形成的趋势，反转日，趋势延续日，趋势中的交易区间日，窄幅通道及通道内的急速（多头或空头）。楼梯：宽通道趋势。","pid":"p75"},{"t":"para","text":"两段式走势形态：","pid":"p76"},{"t":"para","text":"两段式走势可能出现在任何时间周期，趋势，回调或反转中。一旦趋势线被突破，就会形成新的走势，两段式走势可能会很复杂，比如说一个趋势形态可能包含两段走势，而且内部的回调也可能包含两段走势。","pid":"p77"},{"t":"img","src":"assets/img/c03_031.webp","ilabel":"C3-1","icap":"趋势","fid":"fig32","ctx":[{"t":"两段式走势形态：","p":"p76"},{"t":"两段式走势可能出现在任何时间周期，趋势，回调或反转中。一旦趋势线被突破，就会形成新的走势，两段式走势可能会很复杂，比如说一个趋势形态可能包含两段走势，而且内部的回调也可能包含两段走势。","p":"p77"},{"t":"这是一个看涨的两段式走势，所以我们看到一个强烈的突破。趋势线被突破，伴随一个独立的K线，然后对其进行预测，结果得到了验证。（右图）这是又一次看涨的突破，我将它从突破的底部投射到这根K线的高点。就是因为我看到了一个强劲的趋势线突破从这里到这里，所以从这根强劲K线的底部到趋势线突破之前。我拉了回调的底部，并且他得到了满足。这是大段（leg）的预期移动。","p":"p78"},{"t":"看跌两段式：","p":"p79"}]},{"t":"para","text":"这是一个看涨的两段式走势，所以我们看到一个强烈的突破。趋势线被突破，伴随一个独立的K线，然后对其进行预测，结果得到了验证。（右图）这是又一次看涨的突破，我将它从突破的底部投射到这根K线的高点。就是因为我看到了一个强劲的趋势线突破从这里到这里，所以从这根强劲K线的底部到趋势线突破之前。我拉了回调的底部，并且他得到了满足。这是大段（leg）的预期移动。","pid":"p78"},{"t":"para","text":"看跌两段式：","pid":"p79"},{"t":"img","src":"assets/img/c03_032.webp","ilabel":"C3-2","icap":"趋势","fid":"fig33","ctx":[{"t":"这是一个看涨的两段式走势，所以我们看到一个强烈的突破。趋势线被突破，伴随一个独立的K线，然后对其进行预测，结果得到了验证。（右图）这是又一次看涨的突破，我将它从突破的底部投射到这根K线的高点。就是因为我看到了一个强劲的趋势线突破从这里到这里，所以从这根强劲K线的底部到趋势线突破之前。我拉了回调的底部，并且他得到了满足。这是大段（leg）的预期移动。","p":"p78"},{"t":"看跌两段式：","p":"p79"},{"t":"两段式看跌：我从顶部开始，我把它拉到底部，而这根K线是一次趋势线突破，一次陡峭的趋势线突破，所以我从回撤的顶部投射他，并且他得到了满足。（右图）这是又一次看跌，我从突破的最高点开始，然后向下回调，然后这两根多头K线形成了一个趋势线突破，所以这就成了回调的顶部，然后向下预测并在该处达到目标。","p":"p80"},{"t":"两段式复杂的形态：看涨","p":"p81"}]},{"t":"para","text":"两段式看跌：我从顶部开始，我把它拉到底部，而这根K线是一次趋势线突破，一次陡峭的趋势线突破，所以我从回撤的顶部投射他，并且他得到了满足。（右图）这是又一次看跌，我从突破的最高点开始，然后向下回调，然后这两根多头K线形成了一个趋势线突破，所以这就成了回调的顶部，然后向下预测并在该处达到目标。","pid":"p80"},{"t":"para","text":"两段式复杂的形态：看涨","pid":"p81"},{"t":"img","src":"assets/img/c03_033.webp","ilabel":"C3-3","icap":"趋势","fid":"fig34","ctx":[{"t":"两段式看跌：我从顶部开始，我把它拉到底部，而这根K线是一次趋势线突破，一次陡峭的趋势线突破，所以我从回撤的顶部投射他，并且他得到了满足。（右图）这是又一次看跌，我从突破的最高点开始，然后向下回调，然后这两根多头K线形成了一个趋势线突破，所以这就成了回调的顶部，然后向下预测并在该处达到目标。","p":"p80"},{"t":"两段式复杂的形态：看涨","p":"p81"},{"t":"请看看，所以这是相同的图表。但我希望你们能明白我是如何绘制的，因为这个形态看起来很复杂，最底端的两个主要波段是从这根K线的底部到这根K线的顶部，因为这个波段是趋势线突破。我将其一下下投影至回调的底部。而且你看在这里就达到了。现在在这个区间里有好几段行情。这是一段，红线从空头过来的顶部到底部开始延伸至回调的最高点，因为那是一个趋势线突破并被向下预测，所以来到这里的最高点，延伸到这条腿的底部。这段趋势线被多头打破了，我从回调的顶部开始预测，并且在这里得到了满足。再请大家把目光聚焦到这个橙色的两段式回调上。我从这根K线的底部拉到底部，然后拉到趋势线突破点。这根空头K线代表着一个更小级别的时间周期上的趋势线突破，所以从这里到这里，把它设置在这里的底部，正好精确地出现。在这个多头上涨趋势中，有一个多头回调，一个多头两推走势，现在这里又出现了一个嵌套在多头两段走势中的空头两段式走势。所以这是一个两段式走势，这也是一个两段式走势，这条绿线我从多头上涨的顶部开始标记。这个K线影线代表着一个回调，所以这构成了一个趋势线突破，所以这就是我标记两段式走势顶部的位置，它在此处受阻回落，然后市场就开始下跌了。这是一个复杂的多头两段式回调，在主要的两段式回调内部又包含了多个两段式走势。","p":"p82"}]},{"t":"para","text":"请看看，所以这是相同的图表。但我希望你们能明白我是如何绘制的，因为这个形态看起来很复杂，最底端的两个主要波段是从这根K线的底部到这根K线的顶部，因为这个波段是趋势线突破。我将其一下下投影至回调的底部。而且你看在这里就达到了。现在在这个区间里有好几段行情。这是一段，红线从空头过来的顶部到底部开始延伸至回调的最高点，因为那是一个趋势线突破并被向下预测，所以来到这里的最高点，延伸到这条腿的底部。这段趋势线被多头打破了，我从回调的顶部开始预测，并且在这里得到了满足。再请大家把目光聚焦到这个橙色的两段式回调上。我从这根K线的底部拉到底部，然后拉到趋势线突破点。这根空头K线代表着一个更小级别的时间周期上的趋势线突破，所以从这里到这里，把它设置在这里的底部，正好精确地出现。在这个多头上涨趋势中，有一个多头回调，一个多头两推走势，现在这里又出现了一个嵌套在多头两段走势中的空头两段式走势。所以这是一个两段式走势，这也是一个两段式走势，这条绿线我从多头上涨的顶部开始标记。这个K线影线代表着一个回调，所以这构成了一个趋势线突破，所以这就是我标记两段式走势顶部的位置，它在此处受阻回落，然后市场就开始下跌了。这是一个复杂的多头两段式回调，在主要的两段式回调内部又包含了多个两段式走势。","pid":"p82"},{"t":"img","src":"assets/img/c03_034.webp","ilabel":"C3-4","icap":"趋势","fid":"fig35","ctx":[{"t":"请看看，所以这是相同的图表。但我希望你们能明白我是如何绘制的，因为这个形态看起来很复杂，最底端的两个主要波段是从这根K线的底部到这根K线的顶部，因为这个波段是趋势线突破。我将其一下下投影至回调的底部。而且你看在这里就达到了。现在在这个区间里有好几段行情。这是一段，红线从空头过来的顶部到底部开始延伸至回调的最高点，因为那是一个趋势线突破并被向下预测，所以来到这里的最高点，延伸到这条腿的底部。这段趋势线被多头打破了，我从回调的顶部开始预测，并且在这里得到了满足。再请大家把目光聚焦到这个橙色的两段式回调上。我从这根K线的底部拉到底部，然后拉到趋势线突破点。这根空头K线代表着一个更小级别的时间周期上的趋势线突破，所以从这里到这里，把它设置在这里的底部，正好精确地出现。在这个多头上涨趋势中，有一个多头回调，一个多头两推走势，现在这里又出现了一个嵌套在多头两段走势中的空头两段式走势。所以这是一个两段式走势，这也是一个两段式走势，这条绿线我从多头上涨的顶部开始标记。这个K线影线代表着一个回调，所以这构成了一个趋势线突破，所以这就是我标记两段式走势顶部的位置，它在此处受阻回落，然后市场就开始下跌了。这是一个复杂的多头两段式回调，在主要的两段式回调内部又包含了多个两段式走势。","p":"p82"},{"t":"两段式复杂的形态：看跌","p":"p83"},{"t":"还是同一张图。第一个大的两段式就是我从这个顶部蓝线画到这个底部。到回调的顶部趋势线突破了，从这个顶部到这个底部，再到这个顶部，而这个开场的走势就是一次趋势线突破。而这个看涨走势本身也包含了两段式的运动，然而这个大的两段式都是在第一条腿内部又包含了两段式的运动，我开始画线。我正在看绿色标记的部分，我们现在有三条线，我从这里顶部量到这里底部。这根多头K线突破的趋势线，所以回到顶部就在这里，他在这根K线上遇到了阻力。所以这是两段式，第一段回调第二段，然后我们刚才看的那一波，是第一段，回调，第二段。现在如果我们看红线，这表示在一个两段式走势中又出现了一个两段式回调。我从这根多头K线的底部开始，到底部趋势线突破了。然后回调设定目标还没有达到。我从这根多头K线的底部开始，到顶部，趋势线突破了，然后回调目标没有达到。这很有意思，因为这个交易的入场时机不太好，我们正处于强烈的空头趋势中。所以如果大环境不利，这个形态就可能失败，最终演变成了一个两根K线的反转，并且这个目标未能达成。所以仅仅因为你看到了一个看起来可能形成第二波的走势，并不意味着他一步形成第二波。在市场中很多事情都会失败，最后这一波是橙色的，这波走势他非常迅猛，但如果我们考虑趋势线突破，这里有一个强劲的突破，从橙色线的顶部到其底部，然后这根K线的上线和那边K线的上线形成一个趋势线突破，这可以看就是一次回调。而且你可以看到K线的实体在逐渐缩小，所以在经历了一波爆发式上涨后，它该回调了。我把它设在顶部，结果它正好达到了他正好在这根K线的底部。两段式的上涨/下跌，非常好。你可以慢慢来，你可以做逆势的短线交易，但要做好他们会失败的准备，顺势而为总是更好的选择。","p":"p84"},{"t":"强劲信号：一天结束时很容易就能判断出当前是否形成的趋势，目标是找到能早期识别趋势的特征。","p":"p85"},{"t":"趋势特征：开盘出现巨大缺口并且有后续跟进，回调幅度很小，趋势K线排列有序。随着趋势的推进，不会连续出现收盘价在EMA的另一侧的情况。","p":"p86"}]},{"t":"para","text":"两段式复杂的形态：看跌","pid":"p83"},{"t":"para","text":"还是同一张图。第一个大的两段式就是我从这个顶部蓝线画到这个底部。到回调的顶部趋势线突破了，从这个顶部到这个底部，再到这个顶部，而这个开场的走势就是一次趋势线突破。而这个看涨走势本身也包含了两段式的运动，然而这个大的两段式都是在第一条腿内部又包含了两段式的运动，我开始画线。我正在看绿色标记的部分，我们现在有三条线，我从这里顶部量到这里底部。这根多头K线突破的趋势线，所以回到顶部就在这里，他在这根K线上遇到了阻力。所以这是两段式，第一段回调第二段，然后我们刚才看的那一波，是第一段，回调，第二段。现在如果我们看红线，这表示在一个两段式走势中又出现了一个两段式回调。我从这根多头K线的底部开始，到底部趋势线突破了。然后回调设定目标还没有达到。我从这根多头K线的底部开始，到顶部，趋势线突破了，然后回调目标没有达到。这很有意思，因为这个交易的入场时机不太好，我们正处于强烈的空头趋势中。所以如果大环境不利，这个形态就可能失败，最终演变成了一个两根K线的反转，并且这个目标未能达成。所以仅仅因为你看到了一个看起来可能形成第二波的走势，并不意味着他一步形成第二波。在市场中很多事情都会失败，最后这一波是橙色的，这波走势他非常迅猛，但如果我们考虑趋势线突破，这里有一个强劲的突破，从橙色线的顶部到其底部，然后这根K线的上线和那边K线的上线形成一个趋势线突破，这可以看就是一次回调。而且你可以看到K线的实体在逐渐缩小，所以在经历了一波爆发式上涨后，它该回调了。我把它设在顶部，结果它正好达到了他正好在这根K线的底部。两段式的上涨/下跌，非常好。你可以慢慢来，你可以做逆势的短线交易，但要做好他们会失败的准备，顺势而为总是更好的选择。","pid":"p84"},{"t":"para","text":"强劲信号：一天结束时很容易就能判断出当前是否形成的趋势，目标是找到能早期识别趋势的特征。","pid":"p85"},{"t":"para","text":"趋势特征：开盘出现巨大缺口并且有后续跟进，回调幅度很小，趋势K线排列有序。随着趋势的推进，不会连续出现收盘价在EMA的另一侧的情况。","pid":"p86"},{"t":"img","src":"assets/img/c03_035.webp","ilabel":"C3-5","icap":"趋势","fid":"fig36","ctx":[{"t":"强劲信号：一天结束时很容易就能判断出当前是否形成的趋势，目标是找到能早期识别趋势的特征。","p":"p85"},{"t":"趋势特征：开盘出现巨大缺口并且有后续跟进，回调幅度很小，趋势K线排列有序。随着趋势的推进，不会连续出现收盘价在EMA的另一侧的情况。","p":"p86"},{"t":"这里出现了一个巨大的跳空上涨，并且后续跟进，这是一个30个点的大幅上涨突破了。然后市场进入通道。所有的图表都将呈现相同的多头趋势，这样我们就能更好的理解。所以这里的跳空上涨，我们看到了非常好的后续走势，而空头们的回调则很乏力，他们没有获得持续的动力，所以市场在均线上方买入，我的意思是在跳空上涨的上方。并且在均线上方回调形成了牛旗。在这里，我们可以看到空头们很难交易这次的回调。他们在均线上找到支撑并成功突破。空头K线非常小，他们代表着回调。","p":"p87"},{"t":"趋势K线排列有序","p":"p88"}]},{"t":"para","text":"这里出现了一个巨大的跳空上涨，并且后续跟进，这是一个30个点的大幅上涨突破了。然后市场进入通道。所有的图表都将呈现相同的多头趋势，这样我们就能更好的理解。所以这里的跳空上涨，我们看到了非常好的后续走势，而空头们的回调则很乏力，他们没有获得持续的动力，所以市场在均线上方买入，我的意思是在跳空上涨的上方。并且在均线上方回调形成了牛旗。在这里，我们可以看到空头们很难交易这次的回调。他们在均线上找到支撑并成功突破。空头K线非常小，他们代表着回调。","pid":"p87"},{"t":"para","text":"趋势K线排列有序","pid":"p88"},{"t":"img","src":"assets/img/c03_036.webp","ilabel":"C3-6","icap":"趋势","fid":"fig37","ctx":[{"t":"这里出现了一个巨大的跳空上涨，并且后续跟进，这是一个30个点的大幅上涨突破了。然后市场进入通道。所有的图表都将呈现相同的多头趋势，这样我们就能更好的理解。所以这里的跳空上涨，我们看到了非常好的后续走势，而空头们的回调则很乏力，他们没有获得持续的动力，所以市场在均线上方买入，我的意思是在跳空上涨的上方。并且在均线上方回调形成了牛旗。在这里，我们可以看到空头们很难交易这次的回调。他们在均线上找到支撑并成功突破。空头K线非常小，他们代表着回调。","p":"p87"},{"t":"趋势K线排列有序","p":"p88"},{"t":"这里我们又看到了一个急速拉升，这看起来不像是(价格的)高潮，他们的大小都差不多。这里我看到了更多急速拉升。这两根K线等于这根K线，那根K线看起来和这个K线差不多，以此类推，这些K线看起来差不多。","p":"p89"}]},{"t":"para","text":"这里我们又看到了一个急速拉升，这看起来不像是(价格的)高潮，他们的大小都差不多。这里我看到了更多急速拉升。这两根K线等于这根K线，那根K线看起来和这个K线差不多，以此类推，这些K线看起来差不多。","pid":"p89"},{"t":"img","src":"assets/img/c03_037.webp","ilabel":"C3-7","icap":"趋势","fid":"fig38","ctx":[{"t":"这里我们又看到了一个急速拉升，这看起来不像是(价格的)高潮，他们的大小都差不多。这里我看到了更多急速拉升。这两根K线等于这根K线，那根K线看起来和这个K线差不多，以此类推，这些K线看起来差不多。","p":"p89"},{"t":"没有连续两个收盘价都位于EMA的另一侧。所以空头们没法收盘在EMA下方，移动平均线在这里起到了支撑作用。当价格回落到EMA附近时，多头买方便开始买入，试图维持平均价格，市场已经呈现了一段时间的上涨趋势，所以他们多头想抓住机会在平均价位附近买入，然后推动价格继续上涨。","p":"p90"}]},{"t":"para","text":"没有连续两个收盘价都位于EMA的另一侧。所以空头们没法收盘在EMA下方，移动平均线在这里起到了支撑作用。当价格回落到EMA附近时，多头买方便开始买入，试图维持平均价格，市场已经呈现了一段时间的上涨趋势，所以他们多头想抓住机会在平均价位附近买入，然后推动价格继续上涨。","pid":"p90"},{"t":"img","src":"assets/img/c03_038.webp","ilabel":"C3-8","icap":"趋势","fid":"fig39","ctx":[{"t":"没有连续两个收盘价都位于EMA的另一侧。所以空头们没法收盘在EMA下方，移动平均线在这里起到了支撑作用。当价格回落到EMA附近时，多头买方便开始买入，试图维持平均价格，市场已经呈现了一段时间的上涨趋势，所以他们多头想抓住机会在平均价位附近买入，然后推动价格继续上涨。","p":"p90"},{"t":"出现大幅跳空下跌，并且后续的跟进行情，所以现在这构成了一个看跌趋势。所以我们看到了一个17个点的跳空下跌，这下跌突破了两个EMA指数移动平均线，并且有后续的跟进，我想要指出的一点是之前的那个跳空上涨幅度是38点。而这次是17个点，在这两个跳空（下跌和上涨）中，我都用了大跳空这个词。相对于当前市场价位而言的，所以我们会回顾前几天的行情，如果当天的波动在10~15点之间17个点就算很大了，如果当天的波动在20~25个点之间，38个点就算很大了，所以对于空头来说，这可能是一个大幅跳空地方。17个点，并且持续下跌。","p":"p91"}]},{"t":"para","text":"出现大幅跳空下跌，并且后续的跟进行情，所以现在这构成了一个看跌趋势。所以我们看到了一个17个点的跳空下跌，这下跌突破了两个EMA指数移动平均线，并且有后续的跟进，我想要指出的一点是之前的那个跳空上涨幅度是38点。而这次是17个点，在这两个跳空（下跌和上涨）中，我都用了大跳空这个词。相对于当前市场价位而言的，所以我们会回顾前几天的行情，如果当天的波动在10~15点之间17个点就算很大了，如果当天的波动在20~25个点之间，38个点就算很大了，所以对于空头来说，这可能是一个大幅跳空地方。17个点，并且持续下跌。","pid":"p91"},{"t":"img","src":"assets/img/c03_039.webp","ilabel":"C3-9","icap":"趋势","fid":"fig40","ctx":[{"t":"出现大幅跳空下跌，并且后续的跟进行情，所以现在这构成了一个看跌趋势。所以我们看到了一个17个点的跳空下跌，这下跌突破了两个EMA指数移动平均线，并且有后续的跟进，我想要指出的一点是之前的那个跳空上涨幅度是38点。而这次是17个点，在这两个跳空（下跌和上涨）中，我都用了大跳空这个词。相对于当前市场价位而言的，所以我们会回顾前几天的行情，如果当天的波动在10~15点之间17个点就算很大了，如果当天的波动在20~25个点之间，38个点就算很大了，所以对于空头来说，这可能是一个大幅跳空地方。17个点，并且持续下跌。","p":"p91"},{"t":"回调幅度很小：EMA移动平均线正在充当阻力位，而牛旗正在转变为熊旗。这是一个双顶熊旗，正好出现在均线处。","p":"p92"}]},{"t":"para","text":"回调幅度很小：EMA移动平均线正在充当阻力位，而牛旗正在转变为熊旗。这是一个双顶熊旗，正好出现在均线处。","pid":"p92"},{"t":"img","src":"assets/img/c03_040.webp","ilabel":"C3-10","icap":"趋势","fid":"fig41","ctx":[{"t":"回调幅度很小：EMA移动平均线正在充当阻力位，而牛旗正在转变为熊旗。这是一个双顶熊旗，正好出现在均线处。","p":"p92"},{"t":"K线排列有序","p":"p93"},{"t":"没有出现极端情况，空头K线排列有序，这里我们可以看到当K线出现剧烈波动时，市场出现了回调。然后我们又迎来了一次有序的突破，并且价格持续向下通道运行。","p":"p94"}]},{"t":"para","text":"K线排列有序","pid":"p93"},{"t":"para","text":"没有出现极端情况，空头K线排列有序，这里我们可以看到当K线出现剧烈波动时，市场出现了回调。然后我们又迎来了一次有序的突破，并且价格持续向下通道运行。","pid":"p94"},{"t":"img","src":"assets/img/c03_041.webp","ilabel":"C3-11","icap":"趋势","fid":"fig42","ctx":[{"t":"K线排列有序","p":"p93"},{"t":"没有出现极端情况，空头K线排列有序，这里我们可以看到当K线出现剧烈波动时，市场出现了回调。然后我们又迎来了一次有序的突破，并且价格持续向下通道运行。","p":"p94"},{"t":"未出现连续两个收盘在均线另一侧的情况：多头未能收盘在均线之上，一旦多头触及均线，空头们便视此为逢低做空，并在均价处卖出的好机会，多头经常了，结果市场却下跌了。","p":"p95"},{"t":"常见的趋势形态：","p":"p96"},{"t":"熟悉开盘时的市场行为，如果看到某个形态出现，就按形态交易，如果没有出现明确形态，那这一天就可能变成区间震荡日。只进行顺应趋势的交易入场。一次成功的顺势波段交易收益可能相当于10次甚至更多的短线剥头皮交易。所有逆势交易的入场都应该以短线剥头皮为主，如果你进行了两次以上甚至三次的逆势操作，说明你很可能错过了主趋势，这一节内容非常简短，接下来的章节将在此基础上进一步展开。","p":"p97"},{"t":"开盘趋势：（四种形态）","p":"p98"},{"t":"当出现大缺口时，市场可能呈现开盘趋势。市场方向不一定是缺口方向。跳空上涨可能继续上涨，也可能反弹下跌。跳空下跌可能继续下跌，也可能反转上涨。顺势而为有时会让人感到害怕，在多头中追高买入或在空头中追低卖出。交易者应先用小部分资金试水，若行情有利再逐步加仓。","p":"p99"}]},{"t":"para","text":"未出现连续两个收盘在均线另一侧的情况：多头未能收盘在均线之上，一旦多头触及均线，空头们便视此为逢低做空，并在均价处卖出的好机会，多头经常了，结果市场却下跌了。","pid":"p95"},{"t":"para","text":"常见的趋势形态：","pid":"p96"},{"t":"para","text":"熟悉开盘时的市场行为，如果看到某个形态出现，就按形态交易，如果没有出现明确形态，那这一天就可能变成区间震荡日。只进行顺应趋势的交易入场。一次成功的顺势波段交易收益可能相当于10次甚至更多的短线剥头皮交易。所有逆势交易的入场都应该以短线剥头皮为主，如果你进行了两次以上甚至三次的逆势操作，说明你很可能错过了主趋势，这一节内容非常简短，接下来的章节将在此基础上进一步展开。","pid":"p97"},{"t":"para","text":"开盘趋势：（四种形态）","pid":"p98"},{"t":"para","text":"当出现大缺口时，市场可能呈现开盘趋势。市场方向不一定是缺口方向。跳空上涨可能继续上涨，也可能反弹下跌。跳空下跌可能继续下跌，也可能反转上涨。顺势而为有时会让人感到害怕，在多头中追高买入或在空头中追低卖出。交易者应先用小部分资金试水，若行情有利再逐步加仓。","pid":"p99"},{"t":"img","src":"assets/img/c03_042.webp","ilabel":"C3-12","icap":"趋势","fid":"fig43","ctx":[{"t":"开盘趋势：（四种形态）","p":"p98"},{"t":"当出现大缺口时，市场可能呈现开盘趋势。市场方向不一定是缺口方向。跳空上涨可能继续上涨，也可能反弹下跌。跳空下跌可能继续下跌，也可能反转上涨。顺势而为有时会让人感到害怕，在多头中追高买入或在空头中追低卖出。交易者应先用小部分资金试水，若行情有利再逐步加仓。","p":"p99"},{"t":"跳空上涨后继续上涨","p":"p100"},{"t":"我们看到市场处于区间排列，出现了跳空上涨，伴随着三根强劲的多头K线，中间仅有小幅回调。这些都是趋势的信号，多头们守住了跳空缺口。在高位做多可能会让人心生畏惧，担心市场会反转，但多头们在开盘既展现出了强劲势头。","p":"p101"}]},{"t":"para","text":"跳空上涨后继续上涨","pid":"p100"},{"t":"para","text":"我们看到市场处于区间排列，出现了跳空上涨，伴随着三根强劲的多头K线，中间仅有小幅回调。这些都是趋势的信号，多头们守住了跳空缺口。在高位做多可能会让人心生畏惧，担心市场会反转，但多头们在开盘既展现出了强劲势头。","pid":"p101"},{"t":"img","src":"assets/img/c03_043.webp","ilabel":"C3-13","icap":"趋势","fid":"fig44","ctx":[{"t":"跳空上涨后继续上涨","p":"p100"},{"t":"我们看到市场处于区间排列，出现了跳空上涨，伴随着三根强劲的多头K线，中间仅有小幅回调。这些都是趋势的信号，多头们守住了跳空缺口。在高位做多可能会让人心生畏惧，担心市场会反转，但多头们在开盘既展现出了强劲势头。","p":"p101"},{"t":"跳空上涨后反转","p":"p102"},{"t":"这是一个巨大的跳空上涨，但后续乏力。前两根天线是空头K线，这对于多头趋势来说并非好兆头，多头们试图阻止，但最终反转成了一次两段式回调，突破后继续上涨。","p":"p103"}]},{"t":"para","text":"跳空上涨后反转","pid":"p102"},{"t":"para","text":"这是一个巨大的跳空上涨，但后续乏力。前两根天线是空头K线，这对于多头趋势来说并非好兆头，多头们试图阻止，但最终反转成了一次两段式回调，突破后继续上涨。","pid":"p103"},{"t":"img","src":"assets/img/c03_044.webp","ilabel":"C3-14","icap":"趋势","fid":"fig45","ctx":[{"t":"跳空上涨后反转","p":"p102"},{"t":"这是一个巨大的跳空上涨，但后续乏力。前两根天线是空头K线，这对于多头趋势来说并非好兆头，多头们试图阻止，但最终反转成了一次两段式回调，突破后继续上涨。","p":"p103"},{"t":"跳空下跌+延续行情","p":"p104"},{"t":"交易者们看到价格跳空低开，跌破了EMA均线，并且有持续下跌的走势。最后价格出现回到交易成本，继续向下操作。他们未能实现多次收盘价站上EMA均线。","p":"p105"}]},{"t":"para","text":"跳空下跌+延续行情","pid":"p104"},{"t":"para","text":"交易者们看到价格跳空低开，跌破了EMA均线，并且有持续下跌的走势。最后价格出现回到交易成本，继续向下操作。他们未能实现多次收盘价站上EMA均线。","pid":"p105"},{"t":"img","src":"assets/img/c03_045.webp","ilabel":"C3-15","icap":"趋势","fid":"fig46","ctx":[{"t":"跳空下跌+延续行情","p":"p104"},{"t":"交易者们看到价格跳空低开，跌破了EMA均线，并且有持续下跌的走势。最后价格出现回到交易成本，继续向下操作。他们未能实现多次收盘价站上EMA均线。","p":"p105"},{"t":"跳空下跌+反转：","p":"p106"},{"t":"前一天多头强势拉升，但市场却跳空低开，我们认为这是一个逢低买入的机会，并且进行了回测，随后价格开始反转，他们在此时买入，随后出现回调。这是一个更高位形成的低点，并且他们正在填补空缺口。因此多头们正在展现出强势，他们呈现上涨趋势。","p":"p107"},{"t":"四种形态补充：","p":"p108"}]},{"t":"para","text":"跳空下跌+反转：","pid":"p106"},{"t":"para","text":"前一天多头强势拉升，但市场却跳空低开，我们认为这是一个逢低买入的机会，并且进行了回测，随后价格开始反转，他们在此时买入，随后出现回调。这是一个更高位形成的低点，并且他们正在填补空缺口。因此多头们正在展现出强势，他们呈现上涨趋势。","pid":"p107"},{"t":"para","text":"四种形态补充：","pid":"p108"},{"t":"img","src":"assets/img/c03_046.webp","ilabel":"C3-16","icap":"趋势","fid":"fig47","ctx":[{"t":"前一天多头强势拉升，但市场却跳空低开，我们认为这是一个逢低买入的机会，并且进行了回测，随后价格开始反转，他们在此时买入，随后出现回调。这是一个更高位形成的低点，并且他们正在填补空缺口。因此多头们正在展现出强势，他们呈现上涨趋势。","p":"p107"},{"t":"四种形态补充：","p":"p108"}]},{"t":"img","src":"assets/img/c03_047.webp","ilabel":"C3-17","icap":"趋势","fid":"fig48","ctx":[{"t":"反转日：","p":"p109"},{"t":"一些最强劲的趋势可能在一天当中（午盘）启动，开盘可能在区间内震荡，然后午盘出现强劲突破。在强趋势日要尽早入场，并且预期市场会朝趋势方向大幅移动。","p":"p110"}]},{"t":"para","text":"反转日：","pid":"p109"},{"t":"para","text":"一些最强劲的趋势可能在一天当中（午盘）启动，开盘可能在区间内震荡，然后午盘出现强劲突破。在强趋势日要尽早入场，并且预期市场会朝趋势方向大幅移动。","pid":"p110"},{"t":"img","src":"assets/img/c03_048.webp","ilabel":"C3-18","icap":"趋势","fid":"fig49","ctx":[{"t":"反转日：","p":"p109"},{"t":"一些最强劲的趋势可能在一天当中（午盘）启动，开盘可能在区间内震荡，然后午盘出现强劲突破。在强趋势日要尽早入场，并且预期市场会朝趋势方向大幅移动。","p":"p110"},{"t":"这是一个看涨的午盘反转，我们可以看到市场开盘时区间震荡，空头的获得了突破，但后续乏力。多头在太平标准时间上午10点左右，（中午时分）开始发力，随后向上突破，并一路震荡上行至收盘。","p":"p111"}]},{"t":"para","text":"这是一个看涨的午盘反转，我们可以看到市场开盘时区间震荡，空头的获得了突破，但后续乏力。多头在太平标准时间上午10点左右，（中午时分）开始发力，随后向上突破，并一路震荡上行至收盘。","pid":"p111"},{"t":"img","src":"assets/img/c03_049.webp","ilabel":"C3-19","icap":"趋势","fid":"fig50","ctx":[{"t":"这是一个看涨的午盘反转，我们可以看到市场开盘时区间震荡，空头的获得了突破，但后续乏力。多头在太平标准时间上午10点左右，（中午时分）开始发力，随后向上突破，并一路震荡上行至收盘。","p":"p111"},{"t":"这是一次午间反转，看起来像是多头掌控了全天行情，但在中午10点左右空头形成了一个楔形顶。一个双顶和一个更低的高点，显示出市场正转向看跌。这本可能是一波跌至此处的下行趋势，但最终却演变成了一次非常强劲的下行趋势，并在收盘时创下新低。","p":"p112"},{"t":"趋势恢复日：","p":"p113"},{"t":"趋势恢复日通常从开盘就开始呈现趋势，在趋势之后，市场可能会横盘整理二三个小时。一旦市场进入横盘震荡，就等它朝着开盘时的趋势方向突破。有时在横盘整理的价格走势中，我们能看到一些特定的形态，可能是双顶，双底或者任何一种反转形态。","p":"p114"}]},{"t":"para","text":"这是一次午间反转，看起来像是多头掌控了全天行情，但在中午10点左右空头形成了一个楔形顶。一个双顶和一个更低的高点，显示出市场正转向看跌。这本可能是一波跌至此处的下行趋势，但最终却演变成了一次非常强劲的下行趋势，并在收盘时创下新低。","pid":"p112"},{"t":"para","text":"趋势恢复日：","pid":"p113"},{"t":"para","text":"趋势恢复日通常从开盘就开始呈现趋势，在趋势之后，市场可能会横盘整理二三个小时。一旦市场进入横盘震荡，就等它朝着开盘时的趋势方向突破。有时在横盘整理的价格走势中，我们能看到一些特定的形态，可能是双顶，双底或者任何一种反转形态。","pid":"p114"},{"t":"img","src":"assets/img/c03_050.webp","ilabel":"C3-20","icap":"趋势","fid":"fig51","ctx":[{"t":"趋势恢复日：","p":"p113"},{"t":"趋势恢复日通常从开盘就开始呈现趋势，在趋势之后，市场可能会横盘整理二三个小时。一旦市场进入横盘震荡，就等它朝着开盘时的趋势方向突破。有时在横盘整理的价格走势中，我们能看到一些特定的形态，可能是双顶，双底或者任何一种反转形态。","p":"p114"},{"t":"看涨恢复交易日：","p":"p115"},{"t":"这里可以看到一个开盘形成的趋势，多头们守住了他们的跳空缺口，然后市场进入了横盘整理。市场横盘整理了二个小时，可能是2小时45分钟，从这个点开始到这个点结束，就像这个箭头指示的。这里形成了一个双底牛旗或者可能是一个楔形底部由三次推动构成，随后出现突破，市场在当天剩余时间里都保持着趋势。","p":"p116"}]},{"t":"para","text":"看涨恢复交易日：","pid":"p115"},{"t":"para","text":"这里可以看到一个开盘形成的趋势，多头们守住了他们的跳空缺口，然后市场进入了横盘整理。市场横盘整理了二个小时，可能是2小时45分钟，从这个点开始到这个点结束，就像这个箭头指示的。这里形成了一个双底牛旗或者可能是一个楔形底部由三次推动构成，随后出现突破，市场在当天剩余时间里都保持着趋势。","pid":"p116"},{"t":"img","src":"assets/img/c03_051.webp","ilabel":"C3-21","icap":"趋势","fid":"fig52","ctx":[{"t":"看涨恢复交易日：","p":"p115"},{"t":"这里可以看到一个开盘形成的趋势，多头们守住了他们的跳空缺口，然后市场进入了横盘整理。市场横盘整理了二个小时，可能是2小时45分钟，从这个点开始到这个点结束，就像这个箭头指示的。这里形成了一个双底牛旗或者可能是一个楔形底部由三次推动构成，随后出现突破，市场在当天剩余时间里都保持着趋势。","p":"p116"},{"t":"看跌趋势恢复日：","p":"p117"},{"t":"这是空头趋势重启的一天，我们可以看到一个强劲的跳空下跌。市场先是震荡了一个小时左右，然后进入了更长时间的区间震荡，持续了2小时10分钟。我开始计算，区间是从这根K线开始的，多头们开始找到支撑，但随后空头们突破了。那是我结束交易的时间点，这两个时间段都持续了大约2~3个小时之后，他们在一天结束时引发了一个趋势，这里是突破口，那里是楔形顶。区间内有助于我们做空的形态。","p":"p118"},{"t":"趋势交易区间日：","p":"p119"},{"t":"是指那些略微朝一个方向倾斜的交易区间，这些日子应该像对待一般的交易区间日一样进行操作。并从极端位置进行交易。价格行为通常会横盘足够长的时间，使得我们可以进行逆势交易，这与正常的趋势日不同，在正常的趋势日，交易者应该只进行顺势交易。","p":"p120"}]},{"t":"para","text":"看跌趋势恢复日：","pid":"p117"},{"t":"para","text":"这是空头趋势重启的一天，我们可以看到一个强劲的跳空下跌。市场先是震荡了一个小时左右，然后进入了更长时间的区间震荡，持续了2小时10分钟。我开始计算，区间是从这根K线开始的，多头们开始找到支撑，但随后空头们突破了。那是我结束交易的时间点，这两个时间段都持续了大约2~3个小时之后，他们在一天结束时引发了一个趋势，这里是突破口，那里是楔形顶。区间内有助于我们做空的形态。","pid":"p118"},{"t":"para","text":"趋势交易区间日：","pid":"p119"},{"t":"para","text":"是指那些略微朝一个方向倾斜的交易区间，这些日子应该像对待一般的交易区间日一样进行操作。并从极端位置进行交易。价格行为通常会横盘足够长的时间，使得我们可以进行逆势交易，这与正常的趋势日不同，在正常的趋势日，交易者应该只进行顺势交易。","pid":"p120"},{"t":"img","src":"assets/img/c03_052.webp","ilabel":"C3-22","icap":"趋势","fid":"fig53","ctx":[{"t":"趋势交易区间日：","p":"p119"},{"t":"是指那些略微朝一个方向倾斜的交易区间，这些日子应该像对待一般的交易区间日一样进行操作。并从极端位置进行交易。价格行为通常会横盘足够长的时间，使得我们可以进行逆势交易，这与正常的趋势日不同，在正常的趋势日，交易者应该只进行顺势交易。","p":"p120"},{"t":"看涨多头趋势交易区间日：","p":"p121"},{"t":"在这里我们可以看到很多的拉锯式波动，但多头最终还是创下了新高。他们进行了三次推动。你可以选择在低位买入，或者在均线处做空获利。之后回到底部你可以建仓买入，并在回测均线时通过多空操作两头获利。所以市场上有大量的双向交易机会，但多头们一直到收盘都在创出新高。","p":"p122"}]},{"t":"para","text":"看涨多头趋势交易区间日：","pid":"p121"},{"t":"para","text":"在这里我们可以看到很多的拉锯式波动，但多头最终还是创下了新高。他们进行了三次推动。你可以选择在低位买入，或者在均线处做空获利。之后回到底部你可以建仓买入，并在回测均线时通过多空操作两头获利。所以市场上有大量的双向交易机会，但多头们一直到收盘都在创出新高。","pid":"p122"},{"t":"img","src":"assets/img/c03_053.webp","ilabel":"C3-23","icap":"趋势","fid":"fig54","ctx":[{"t":"看涨多头趋势交易区间日：","p":"p121"},{"t":"在这里我们可以看到很多的拉锯式波动，但多头最终还是创下了新高。他们进行了三次推动。你可以选择在低位买入，或者在均线处做空获利。之后回到底部你可以建仓买入，并在回测均线时通过多空操作两头获利。所以市场上有大量的双向交易机会，但多头们一直到收盘都在创出新高。","p":"p122"},{"t":"看跌空头趋势交易区间日：","p":"p123"},{"t":"在这里空头们获得了一个强劲的突破，但早盘却出现了大量的看涨价格行为。上午的交易时段。我们看到多头们已经在低位买入，并且他们正在进行剥头皮交易，目标是均线。在这里他们大约赚了10个点，完成了两波上涨。所以你可以选择做空，或者买入做多。如果你想在反趋势时买入做多，你就想在两种情况下，都要从极端部位进行短线交易，然后离场。","p":"p124"},{"t":"窄幅通道和急速通道：","p":"p125"},{"t":"无论是多头还是空头，最强的通道形态是在一次急速之后出现的窄幅通道。急速是指朝一个方向的强劲走势。这些通道经常把反趋势交易者套在亏损的交易里。看起来趋势好像要反转了，但实际总是却远超预期。只考虑顺势交易。","p":"p126"}]},{"t":"para","text":"看跌空头趋势交易区间日：","pid":"p123"},{"t":"para","text":"在这里空头们获得了一个强劲的突破，但早盘却出现了大量的看涨价格行为。上午的交易时段。我们看到多头们已经在低位买入，并且他们正在进行剥头皮交易，目标是均线。在这里他们大约赚了10个点，完成了两波上涨。所以你可以选择做空，或者买入做多。如果你想在反趋势时买入做多，你就想在两种情况下，都要从极端部位进行短线交易，然后离场。","pid":"p124"},{"t":"para","text":"窄幅通道和急速通道：","pid":"p125"},{"t":"para","text":"无论是多头还是空头，最强的通道形态是在一次急速之后出现的窄幅通道。急速是指朝一个方向的强劲走势。这些通道经常把反趋势交易者套在亏损的交易里。看起来趋势好像要反转了，但实际总是却远超预期。只考虑顺势交易。","pid":"p126"},{"t":"img","src":"assets/img/c03_054.webp","ilabel":"C3-24","icap":"趋势","fid":"fig55","ctx":[{"t":"窄幅通道和急速通道：","p":"p125"},{"t":"无论是多头还是空头，最强的通道形态是在一次急速之后出现的窄幅通道。急速是指朝一个方向的强劲走势。这些通道经常把反趋势交易者套在亏损的交易里。看起来趋势好像要反转了，但实际总是却远超预期。只考虑顺势交易。","p":"p126"},{"t":"多头急速通道：","p":"p127"},{"t":"这里我可以看到好几个急速，显示出多头的动能。空头没法把价格收回去，所以趋势还在继续。然后在一次结束之后是通道期。我看到了好几个急速，通道，还有更多的急速。做空这些会非常难赚钱，你得赶紧做剥头皮交易。EMA指数移动平均线被碰到了一次，如果那会是你的反向交易目标的话，所以最好顺着趋势交易，才能在你的头寸上赚到很多钱。","p":"p128"}]},{"t":"para","text":"多头急速通道：","pid":"p127"},{"t":"para","text":"这里我可以看到好几个急速，显示出多头的动能。空头没法把价格收回去，所以趋势还在继续。然后在一次结束之后是通道期。我看到了好几个急速，通道，还有更多的急速。做空这些会非常难赚钱，你得赶紧做剥头皮交易。EMA指数移动平均线被碰到了一次，如果那会是你的反向交易目标的话，所以最好顺着趋势交易，才能在你的头寸上赚到很多钱。","pid":"p128"},{"t":"img","src":"assets/img/c03_055.webp","ilabel":"C3-25","icap":"趋势","fid":"fig56","ctx":[{"t":"多头急速通道：","p":"p127"},{"t":"这里我可以看到好几个急速，显示出多头的动能。空头没法把价格收回去，所以趋势还在继续。然后在一次结束之后是通道期。我看到了好几个急速，通道，还有更多的急速。做空这些会非常难赚钱，你得赶紧做剥头皮交易。EMA指数移动平均线被碰到了一次，如果那会是你的反向交易目标的话，所以最好顺着趋势交易，才能在你的头寸上赚到很多钱。","p":"p128"},{"t":"空头急速通道：","p":"p129"},{"t":"这里可以看到多次急速拉升，这些急速拉升的价格在这一区间跌破了均线。然后他们形成通道，这可以看作是获利了结，多头们差点就赚到钱了。他们只触碰到均线一次均线，就是说除非你能精准捕捉这唯一的多头行情，多头们将很难赚钱，而且他们都被套牢，加剧了抛售压力。多头会在这里买入，然后止盈。空头们在多头止盈的地方做空，这样他们就能赚钱。这是一个空头急速加通道形态，最好顺着趋势方向交易。","p":"p130"},{"t":"楼梯宽幅通道趋势：","p":"p131"},{"t":"当市场出现三个或更多连续的单边走势时，这看起来就像楼梯。这表明多空双方都在交易，但其中一方略占优势。随着波段的持续，动能会逐渐减弱，最终逆势交易者会突破趋势通道线并进行回测。","p":"p132"}]},{"t":"para","text":"空头急速通道：","pid":"p129"},{"t":"para","text":"这里可以看到多次急速拉升，这些急速拉升的价格在这一区间跌破了均线。然后他们形成通道，这可以看作是获利了结，多头们差点就赚到钱了。他们只触碰到均线一次均线，就是说除非你能精准捕捉这唯一的多头行情，多头们将很难赚钱，而且他们都被套牢，加剧了抛售压力。多头会在这里买入，然后止盈。空头们在多头止盈的地方做空，这样他们就能赚钱。这是一个空头急速加通道形态，最好顺着趋势方向交易。","pid":"p130"},{"t":"para","text":"楼梯宽幅通道趋势：","pid":"p131"},{"t":"para","text":"当市场出现三个或更多连续的单边走势时，这看起来就像楼梯。这表明多空双方都在交易，但其中一方略占优势。随着波段的持续，动能会逐渐减弱，最终逆势交易者会突破趋势通道线并进行回测。","pid":"p132"},{"t":"img","src":"assets/img/c03_056.webp","ilabel":"C3-26","icap":"趋势","fid":"fig57","ctx":[{"t":"楼梯宽幅通道趋势：","p":"p131"},{"t":"当市场出现三个或更多连续的单边走势时，这看起来就像楼梯。这表明多空双方都在交易，但其中一方略占优势。随着波段的持续，动能会逐渐减弱，最终逆势交易者会突破趋势通道线并进行回测。","p":"p132"},{"t":"多头宽幅通道趋势：","p":"p133"},{"t":"这是一个多头的急速通道趋势，它是多头趋势但幅度很大。空头们通过做空这个顶部赚到了钱，他们通过做空这个顶部赚到了钱。然后通过做空这个顶部赚到了钱，而且他们通过做空这个顶部也赚到了钱，这就是我们看到突破和回测的地方，这是通道线的突破，这是突破，这是回测，就造成了一个更低的低点，空头在此位置形成高点，随后迎来向下突破。","p":"p134"}]},{"t":"para","text":"多头宽幅通道趋势：","pid":"p133"},{"t":"para","text":"这是一个多头的急速通道趋势，它是多头趋势但幅度很大。空头们通过做空这个顶部赚到了钱，他们通过做空这个顶部赚到了钱。然后通过做空这个顶部赚到了钱，而且他们通过做空这个顶部也赚到了钱，这就是我们看到突破和回测的地方，这是通道线的突破，这是突破，这是回测，就造成了一个更低的低点，空头在此位置形成高点，随后迎来向下突破。","pid":"p134"},{"t":"img","src":"assets/img/c03_057.webp","ilabel":"C3-27","icap":"趋势","fid":"fig58","ctx":[{"t":"多头宽幅通道趋势：","p":"p133"},{"t":"这是一个多头的急速通道趋势，它是多头趋势但幅度很大。空头们通过做空这个顶部赚到了钱，他们通过做空这个顶部赚到了钱。然后通过做空这个顶部赚到了钱，而且他们通过做空这个顶部也赚到了钱，这就是我们看到突破和回测的地方，这是通道线的突破，这是突破，这是回测，就造成了一个更低的低点，空头在此位置形成高点，随后迎来向下突破。","p":"p134"},{"t":"空头宽幅通道趋势：","p":"p135"},{"t":"这是一个看跌的快速通道趋势，这也是同样的情况，它看起来像一连串的台阶。多头通过买入每一个新低来赚钱，因此他们会等待共同的创新低，他们在此处买入一部分，再加仓买入，并在50%的回调位置，卖出获利。双方可以反复的进行操作，直到动量发生改变。这里出现了一个双底形态，并伴随着通道线突破和回测，这是在空头末期出现的看涨价格行为，并且突破了均线。动能越来越弱，弱到他们无法创新低。多会把这看做一个做多机会。","p":"p136"}]},{"t":"para","text":"空头宽幅通道趋势：","pid":"p135"},{"t":"para","text":"这是一个看跌的快速通道趋势，这也是同样的情况，它看起来像一连串的台阶。多头通过买入每一个新低来赚钱，因此他们会等待共同的创新低，他们在此处买入一部分，再加仓买入，并在50%的回调位置，卖出获利。双方可以反复的进行操作，直到动量发生改变。这里出现了一个双底形态，并伴随着通道线突破和回测，这是在空头末期出现的看涨价格行为，并且突破了均线。动能越来越弱，弱到他们无法创新低。多会把这看做一个做多机会。","pid":"p136"}],"wcount":5661},{"id":"c4","title":"第4章　回调","icon":"4","sections":[],"blocks":[{"t":"para","text":"第四章 回调","pid":"p137"},{"t":"para","text":"目录：首次回调序列：K线 ，次要趋势线，EMA回调，EMA缺口，主要趋势线。双顶看跌旗型与双顶看涨旗型。EMA与EMA缺口回调。2小时。若价格远离EMA达2小时或更久，则顺势反向操作，卖在EMA或首个EMA缺口K线处。趋势日，11：30止损扫荡，诱空回调。识别趋势的构成。高点/低点1234。高二，低点二形态的变体，以及三推回调。","pid":"p138"},{"t":"para","text":"首次回调序列：K线 ，次要趋势线，EMA，EMA缺口，主要趋势线。","pid":"p139"},{"t":"para","text":"回调是指趋势中，首根反向K线突破了前一根K线的极值。回调通常发生在趋势序列中，首次回调通常幅度较小。随着趋势的发展，回调的幅度会逐渐加大。首次回调通常很短暂，一般只有1-2根K线，随后可能出现极端行情。","pid":"p140"},{"t":"para","text":"次要趋势线的回调通常是3~5根K线之后会迎来极端行情。","pid":"p141"},{"t":"para","text":"EMA回调是指市场偏离EMA趋势一段时间后首次回踩EMA。","pid":"p142"},{"t":"para","text":"EMA缺口是指回调幅度超过了EMA。主要趋势线回调被反向运动打破，我们经常会重新测试之前的波动高点和低点。","pid":"p143"},{"t":"img","src":"assets/img/c04_058.webp","ilabel":"C4-1","icap":"回调","fid":"fig59","ctx":[{"t":"EMA回调是指市场偏离EMA趋势一段时间后首次回踩EMA。","p":"p142"},{"t":"EMA缺口是指回调幅度超过了EMA。主要趋势线回调被反向运动打破，我们经常会重新测试之前的波动高点和低点。","p":"p143"},{"t":"在整个下跌过程中，我使用了相同的看法来看图表，因为本章内容是在同一张图表的基础上逐步深入的。所以我想在这些图表中不断挖掘更深层次的内容。","p":"p144"},{"t":"首次回调序列：看涨。","p":"p145"},{"t":"这里我们看到价格突破了均线，并且后续走势强劲。这是第一次回调，因为这是第一根空头K线，然后这也导致了对前期高点的测试，并创下新高。然后价格回调至均线，这变成了次级趋势线的回调。回调非常浅，空头K线没有延续，你可以逢低买入，并获利。市场在此区域围绕均线横盘了大约2小时，并未触及它。在这里形成了第一次回调至均线。你可以看到一根非常大的跳空K线，但多头买入它,这也测试了前期高点并创下新高。我们看到在一天结束时，这是一个均线缺口。空头K线跌破了EMA均线，并且开始出现跳空。","p":"p146"}]},{"t":"para","text":"在整个下跌过程中，我使用了相同的看法来看图表，因为本章内容是在同一张图表的基础上逐步深入的。所以我想在这些图表中不断挖掘更深层次的内容。","pid":"p144"},{"t":"para","text":"首次回调序列：看涨。","pid":"p145"},{"t":"para","text":"这里我们看到价格突破了均线，并且后续走势强劲。这是第一次回调，因为这是第一根空头K线，然后这也导致了对前期高点的测试，并创下新高。然后价格回调至均线，这变成了次级趋势线的回调。回调非常浅，空头K线没有延续，你可以逢低买入，并获利。市场在此区域围绕均线横盘了大约2小时，并未触及它。在这里形成了第一次回调至均线。你可以看到一根非常大的跳空K线，但多头买入它,这也测试了前期高点并创下新高。我们看到在一天结束时，这是一个均线缺口。空头K线跌破了EMA均线，并且开始出现跳空。","pid":"p146"},{"t":"img","src":"assets/img/c04_059.webp","ilabel":"C4-2","icap":"回调","fid":"fig60","ctx":[{"t":"首次回调序列：看涨。","p":"p145"},{"t":"这里我们看到价格突破了均线，并且后续走势强劲。这是第一次回调，因为这是第一根空头K线，然后这也导致了对前期高点的测试，并创下新高。然后价格回调至均线，这变成了次级趋势线的回调。回调非常浅，空头K线没有延续，你可以逢低买入，并获利。市场在此区域围绕均线横盘了大约2小时，并未触及它。在这里形成了第一次回调至均线。你可以看到一根非常大的跳空K线，但多头买入它,这也测试了前期高点并创下新高。我们看到在一天结束时，这是一个均线缺口。空头K线跌破了EMA均线，并且开始出现跳空。","p":"p146"},{"t":"这是下跌趋势中的首次回调。跌破EMA的走势从这里开始。第一次回调发生在首次多头K线被买入之后。最后看到了突破的多头K线。第一次回调，现在我们处于通道交易区间。在这里，我们可以看到E-mini回落至均线后开始下跌。这将是空头的次要趋势线回调。第一次回调至EMA是一个不错的卖点，但并未触及绝对低点。这里我们看到一个小小的回调。虽然已是趋势尾声，但仍带来了一次盈利的剥头皮交易，这就是EMA均线缺口K线。这是这根强劲的多头K线。多头走出了一根不错的K线，但后续没有延续。并且当天剩余时间里都在下跌。","p":"p147"},{"t":"双顶看跌旗型和双底看涨旗型。双底和双顶是顺势建仓形态。趋势过后，市场可能会进入横盘整理。在多头趋势中寻找双底形态。在空头趋势中寻找双顶形态。第一个急速（或飙升）会像磁铁一样吸引价格，当市场回测之前的波动点时，之前的交易者会试图守住他们的止损位，并压倒反趋势交易者。这些交易者是造成趋势中出现双顶或双底的原因。","p":"p148"}]},{"t":"para","text":"这是下跌趋势中的首次回调。跌破EMA的走势从这里开始。第一次回调发生在首次多头K线被买入之后。最后看到了突破的多头K线。第一次回调，现在我们处于通道交易区间。在这里，我们可以看到E-mini回落至均线后开始下跌。这将是空头的次要趋势线回调。第一次回调至EMA是一个不错的卖点，但并未触及绝对低点。这里我们看到一个小小的回调。虽然已是趋势尾声，但仍带来了一次盈利的剥头皮交易，这就是EMA均线缺口K线。这是这根强劲的多头K线。多头走出了一根不错的K线，但后续没有延续。并且当天剩余时间里都在下跌。","pid":"p147"},{"t":"para","text":"双顶看跌旗型和双底看涨旗型。双底和双顶是顺势建仓形态。趋势过后，市场可能会进入横盘整理。在多头趋势中寻找双底形态。在空头趋势中寻找双顶形态。第一个急速（或飙升）会像磁铁一样吸引价格，当市场回测之前的波动点时，之前的交易者会试图守住他们的止损位，并压倒反趋势交易者。这些交易者是造成趋势中出现双顶或双底的原因。","pid":"p148"},{"t":"img","src":"assets/img/c04_060.webp","ilabel":"C4-3","icap":"回调","fid":"fig61","ctx":[{"t":"这是下跌趋势中的首次回调。跌破EMA的走势从这里开始。第一次回调发生在首次多头K线被买入之后。最后看到了突破的多头K线。第一次回调，现在我们处于通道交易区间。在这里，我们可以看到E-mini回落至均线后开始下跌。这将是空头的次要趋势线回调。第一次回调至EMA是一个不错的卖点，但并未触及绝对低点。这里我们看到一个小小的回调。虽然已是趋势尾声，但仍带来了一次盈利的剥头皮交易，这就是EMA均线缺口K线。这是这根强劲的多头K线。多头走出了一根不错的K线，但后续没有延续。并且当天剩余时间里都在下跌。","p":"p147"},{"t":"双顶看跌旗型和双底看涨旗型。双底和双顶是顺势建仓形态。趋势过后，市场可能会进入横盘整理。在多头趋势中寻找双底形态。在空头趋势中寻找双顶形态。第一个急速（或飙升）会像磁铁一样吸引价格，当市场回测之前的波动点时，之前的交易者会试图守住他们的止损位，并压倒反趋势交易者。这些交易者是造成趋势中出现双顶或双底的原因。","p":"p148"},{"t":"这是一个双顶熊旗。我把线画的高一点，以便我们观察K线的影线。理解人们是如何被套住的，以及第一个急速如何充当磁铁。这市场在这里制造了一个空头回调，并伴随一次突破。然后是回调。多头们正被套在这里，你看这影线。这给多头们造成了一个吸铁石效应。这是双顶的第一个尖角。市场又回到了这个位置。多头们在最初的入场价位纷纷离场。这制造了足够的抛压促使空头们进一步下行。多头们在平掉多头仓位，空头们在做空。情况差不多。这就是形成双顶趋势交易形态的背景。多头们被套住了。空头们发起了反攻，形成了顶部，随后价格回落并被压低。","p":"p149"}]},{"t":"para","text":"这是一个双顶熊旗。我把线画的高一点，以便我们观察K线的影线。理解人们是如何被套住的，以及第一个急速如何充当磁铁。这市场在这里制造了一个空头回调，并伴随一次突破。然后是回调。多头们正被套在这里，你看这影线。这给多头们造成了一个吸铁石效应。这是双顶的第一个尖角。市场又回到了这个位置。多头们在最初的入场价位纷纷离场。这制造了足够的抛压促使空头们进一步下行。多头们在平掉多头仓位，空头们在做空。情况差不多。这就是形成双顶趋势交易形态的背景。多头们被套住了。空头们发起了反攻，形成了顶部，随后价格回落并被压低。","pid":"p149"},{"t":"img","src":"assets/img/c04_061.webp","ilabel":"C4-4","icap":"回调","fid":"fig62","ctx":[{"t":"这是一个双顶熊旗。我把线画的高一点，以便我们观察K线的影线。理解人们是如何被套住的，以及第一个急速如何充当磁铁。这市场在这里制造了一个空头回调，并伴随一次突破。然后是回调。多头们正被套在这里，你看这影线。这给多头们造成了一个吸铁石效应。这是双顶的第一个尖角。市场又回到了这个位置。多头们在最初的入场价位纷纷离场。这制造了足够的抛压促使空头们进一步下行。多头们在平掉多头仓位，空头们在做空。情况差不多。这就是形成双顶趋势交易形态的背景。多头们被套住了。空头们发起了反攻，形成了顶部，随后价格回落并被压低。","p":"p149"},{"t":"对多头来说情况正好相反，但原理是相同的。这是一个双底牛旗，我们看到了一波强劲上涨和随后的回调。在这里，我可以看到价格回调至了均线。空头们在均线处选择做空，结果他们被套住了。就形成了一个磁铁效应。市场价格回升，为他们解套，使他们得以在盈亏持平点位离场。随后多头们在均线处买入。空头们回补了他们的空头头寸，这足以形成买盘，推动价格进一步走高。趋势是由被套的交易者制造的，他们推高了价格，你看空头在这里被套。他们回补空单，多头则在低位接盘，然后价格又继续上涨，这里形成了一个双底，这里，还有这里，这里又是一个。空头被套牢。价格回落到这里。他们有机会回补空单。多头买入了这个牛旗，空头们退出了一个糟糕的交易。价格继续走高。这里的情况也一样。这些情况也一样。","p":"p150"},{"t":"EMA和EMA缺口，回调缺口。图表上有两点距离。开盘价高于昨日高点会形成一个缺口开盘价低于昨日低点，会形成一个缺口。K线与EMA之间也可能存在缺口。","p":"p151"}]},{"t":"para","text":"对多头来说情况正好相反，但原理是相同的。这是一个双底牛旗，我们看到了一波强劲上涨和随后的回调。在这里，我可以看到价格回调至了均线。空头们在均线处选择做空，结果他们被套住了。就形成了一个磁铁效应。市场价格回升，为他们解套，使他们得以在盈亏持平点位离场。随后多头们在均线处买入。空头们回补了他们的空头头寸，这足以形成买盘，推动价格进一步走高。趋势是由被套的交易者制造的，他们推高了价格，你看空头在这里被套。他们回补空单，多头则在低位接盘，然后价格又继续上涨，这里形成了一个双底，这里，还有这里，这里又是一个。空头被套牢。价格回落到这里。他们有机会回补空单。多头买入了这个牛旗，空头们退出了一个糟糕的交易。价格继续走高。这里的情况也一样。这些情况也一样。","pid":"p150"},{"t":"para","text":"EMA和EMA缺口，回调缺口。图表上有两点距离。开盘价高于昨日高点会形成一个缺口开盘价低于昨日低点，会形成一个缺口。K线与EMA之间也可能存在缺口。","pid":"p151"},{"t":"img","src":"assets/img/c04_062.webp","ilabel":"C4-5","icap":"回调","fid":"fig63","ctx":[{"t":"对多头来说情况正好相反，但原理是相同的。这是一个双底牛旗，我们看到了一波强劲上涨和随后的回调。在这里，我可以看到价格回调至了均线。空头们在均线处选择做空，结果他们被套住了。就形成了一个磁铁效应。市场价格回升，为他们解套，使他们得以在盈亏持平点位离场。随后多头们在均线处买入。空头们回补了他们的空头头寸，这足以形成买盘，推动价格进一步走高。趋势是由被套的交易者制造的，他们推高了价格，你看空头在这里被套。他们回补空单，多头则在低位接盘，然后价格又继续上涨，这里形成了一个双底，这里，还有这里，这里又是一个。空头被套牢。价格回落到这里。他们有机会回补空单。多头买入了这个牛旗，空头们退出了一个糟糕的交易。价格继续走高。这里的情况也一样。这些情况也一样。","p":"p150"},{"t":"EMA和EMA缺口，回调缺口。图表上有两点距离。开盘价高于昨日高点会形成一个缺口开盘价低于昨日低点，会形成一个缺口。K线与EMA之间也可能存在缺口。","p":"p151"},{"t":"这是一个看涨缺口：我们可以看到市场处于区间震荡，收盘价就在此处。这里有一个大的向上跳空。一次回调以测试高点。接着出现了一个多头趋势。跳空上涨不代表每天都会出现趋势。在这种情况下，这样是合理的，我们可以看到跳空上涨突破了昨天的当日高点。","p":"p152"}]},{"t":"para","text":"这是一个看涨缺口：我们可以看到市场处于区间震荡，收盘价就在此处。这里有一个大的向上跳空。一次回调以测试高点。接着出现了一个多头趋势。跳空上涨不代表每天都会出现趋势。在这种情况下，这样是合理的，我们可以看到跳空上涨突破了昨天的当日高点。","pid":"p152"},{"t":"img","src":"assets/img/c04_063.webp","ilabel":"C4-6","icap":"回调","fid":"fig64","ctx":[{"t":"这是一个看涨缺口：我们可以看到市场处于区间震荡，收盘价就在此处。这里有一个大的向上跳空。一次回调以测试高点。接着出现了一个多头趋势。跳空上涨不代表每天都会出现趋势。在这种情况下，这样是合理的，我们可以看到跳空上涨突破了昨天的当日高点。","p":"p152"},{"t":"这是一个看跌缺口：这是昨天的波动低点，我们可以看到绝对的最低点就在这里。这里有一个很大的跳空下跌，但没有延续。这可以被视为一个缺口。这些K线可以被视为一个缺口，在多头将他们买回之前。这里也有一个缺口，价格脱离了均线。跳空缺口是显示哪一方力量的信号,所以他们非常重要。他们不仅仅是开盘时的跳空缺口。图表上到处都可能出现跳空缺口。","p":"p153"},{"t":"2小时EMA：如果价格远离EMA超过2小时，则应逆势操作，目标看向第一个EMA跳空K线。当市场处于强劲的趋势中时，他可能会在均线的一侧停留2小时或更长时间。这表明趋势强劲，并且价格与均线之间存在跳空缺口。第一次触及均线时，交易者应该将其作为一次快速交易，目标是最近的波动点。2小时只是一个参考而已。这并非一个神奇的数字，即便趋势如此，也可能同样强劲，即使在2小时内触及EMA四次。每一次触及EMA都可以比前一次出去穿透的更深。一旦在强劲趋势后出现跳空K线，就极度逆势做空。","p":"p154"}]},{"t":"para","text":"这是一个看跌缺口：这是昨天的波动低点，我们可以看到绝对的最低点就在这里。这里有一个很大的跳空下跌，但没有延续。这可以被视为一个缺口。这些K线可以被视为一个缺口，在多头将他们买回之前。这里也有一个缺口，价格脱离了均线。跳空缺口是显示哪一方力量的信号,所以他们非常重要。他们不仅仅是开盘时的跳空缺口。图表上到处都可能出现跳空缺口。","pid":"p153"},{"t":"para","text":"2小时EMA：如果价格远离EMA超过2小时，则应逆势操作，目标看向第一个EMA跳空K线。当市场处于强劲的趋势中时，他可能会在均线的一侧停留2小时或更长时间。这表明趋势强劲，并且价格与均线之间存在跳空缺口。第一次触及均线时，交易者应该将其作为一次快速交易，目标是最近的波动点。2小时只是一个参考而已。这并非一个神奇的数字，即便趋势如此，也可能同样强劲，即使在2小时内触及EMA四次。每一次触及EMA都可以比前一次出去穿透的更深。一旦在强劲趋势后出现跳空K线，就极度逆势做空。","pid":"p154"},{"t":"img","src":"assets/img/c04_064.webp","ilabel":"C4-7","icap":"回调","fid":"fig65","ctx":[{"t":"这是一个看跌缺口：这是昨天的波动低点，我们可以看到绝对的最低点就在这里。这里有一个很大的跳空下跌，但没有延续。这可以被视为一个缺口。这些K线可以被视为一个缺口，在多头将他们买回之前。这里也有一个缺口，价格脱离了均线。跳空缺口是显示哪一方力量的信号,所以他们非常重要。他们不仅仅是开盘时的跳空缺口。图表上到处都可能出现跳空缺口。","p":"p153"},{"t":"2小时EMA：如果价格远离EMA超过2小时，则应逆势操作，目标看向第一个EMA跳空K线。当市场处于强劲的趋势中时，他可能会在均线的一侧停留2小时或更长时间。这表明趋势强劲，并且价格与均线之间存在跳空缺口。第一次触及均线时，交易者应该将其作为一次快速交易，目标是最近的波动点。2小时只是一个参考而已。这并非一个神奇的数字，即便趋势如此，也可能同样强劲，即使在2小时内触及EMA四次。每一次触及EMA都可以比前一次出去穿透的更深。一旦在强劲趋势后出现跳空K线，就极度逆势做空。","p":"p154"},{"t":"所以这是我们一直在看的同一张图。我们看到了所有这些新的建仓形态，趋势线。","p":"p155"},{"t":"这是一个2小时看涨：所以当市场趋势持续2小时，我们关注第一次触及。看看市场被触及了多少次，但价格依然上涨。所以市场被触及的次数越多，并不意味着它就越弱。然而就在这里市场实际上持续了两个小时，并且保持了一个非常好的看涨缺口。然后看看第一个空头K线出现时发生了什么，他被买入，因为他已经持续了两个小时。这是第一个回调。","p":"p156"}]},{"t":"para","text":"所以这是我们一直在看的同一张图。我们看到了所有这些新的建仓形态，趋势线。","pid":"p155"},{"t":"para","text":"这是一个2小时看涨：所以当市场趋势持续2小时，我们关注第一次触及。看看市场被触及了多少次，但价格依然上涨。所以市场被触及的次数越多，并不意味着它就越弱。然而就在这里市场实际上持续了两个小时，并且保持了一个非常好的看涨缺口。然后看看第一个空头K线出现时发生了什么，他被买入，因为他已经持续了两个小时。这是第一个回调。","pid":"p156"},{"t":"img","src":"assets/img/c04_065.webp","ilabel":"C4-8","icap":"回调","fid":"fig66","ctx":[{"t":"所以这是我们一直在看的同一张图。我们看到了所有这些新的建仓形态，趋势线。","p":"p155"},{"t":"这是一个2小时看涨：所以当市场趋势持续2小时，我们关注第一次触及。看看市场被触及了多少次，但价格依然上涨。所以市场被触及的次数越多，并不意味着它就越弱。然而就在这里市场实际上持续了两个小时，并且保持了一个非常好的看涨缺口。然后看看第一个空头K线出现时发生了什么，他被买入，因为他已经持续了两个小时。这是第一个回调。","p":"p156"},{"t":"2小时看跌：所以在这里我们可以看到空头趋势已经持续了一段时间。这里已经大约两个小时了。我们触及了EMA,空头们认为这是一个立即做空的绝佳机会，他们之所以这么做，是因为这是他们2小时以来遇到的最佳买入价。市场又延续了2小时的趋势，随后开始进入盘整。这是自此处以来他们遇到的最佳价格，你可以在这里卖出，但从技术上看，我们是以低于平均价的价格。所以这些将是短线交易剥头皮，随后空头们开始在EMA指数移动平均线上方获得有利的入场点。前提是市场背景和逻辑都说得通。在这里我们可以看到多头缺乏后续跟进的动力。价格回调，空头们得以在他们的高点或低点入场。所以这就形成了那个缺口，并且趋势得以延续。","p":"p157"},{"t":"趋势日：","p":"p158"},{"t":"11点半时价格会有一个止损扫荡的回调，目的是把你震出局，在强趋势大约上午11点~11点半，太平洋标准时间之间可能会出现一个反趋势的走势。有时这个走势会提前或推后出现。机构会利用这次回调来加仓。他们会寻找测试前期高点/低点的机会。我想特别强调交易时间。","p":"p159"}]},{"t":"para","text":"2小时看跌：所以在这里我们可以看到空头趋势已经持续了一段时间。这里已经大约两个小时了。我们触及了EMA,空头们认为这是一个立即做空的绝佳机会，他们之所以这么做，是因为这是他们2小时以来遇到的最佳买入价。市场又延续了2小时的趋势，随后开始进入盘整。这是自此处以来他们遇到的最佳价格，你可以在这里卖出，但从技术上看，我们是以低于平均价的价格。所以这些将是短线交易剥头皮，随后空头们开始在EMA指数移动平均线上方获得有利的入场点。前提是市场背景和逻辑都说得通。在这里我们可以看到多头缺乏后续跟进的动力。价格回调，空头们得以在他们的高点或低点入场。所以这就形成了那个缺口，并且趋势得以延续。","pid":"p157"},{"t":"para","text":"趋势日：","pid":"p158"},{"t":"para","text":"11点半时价格会有一个止损扫荡的回调，目的是把你震出局，在强趋势大约上午11点~11点半，太平洋标准时间之间可能会出现一个反趋势的走势。有时这个走势会提前或推后出现。机构会利用这次回调来加仓。他们会寻找测试前期高点/低点的机会。我想特别强调交易时间。","pid":"p159"},{"t":"img","src":"assets/img/c04_066.webp","ilabel":"C4-9","icap":"回调","fid":"fig67","ctx":[{"t":"趋势日：","p":"p158"},{"t":"11点半时价格会有一个止损扫荡的回调，目的是把你震出局，在强趋势大约上午11点~11点半，太平洋标准时间之间可能会出现一个反趋势的走势。有时这个走势会提前或推后出现。机构会利用这次回调来加仓。他们会寻找测试前期高点/低点的机会。我想特别强调交易时间。","p":"p159"},{"t":"接下来是两个不同的图表。这里我们看到一个强趋势进的趋势，已经持续了大约两个小时，而且这波上涨走势在这一点变得非常迅猛，价格出现了三次上涨，而且收出了非常漂亮的多头K线。我们看到空头在价格高位给出强烈拒绝，以及一次深度的三浪回调。这次回调幅度不大，空头未能将任何K线收在EMA均线下方，最终他测试了看涨旗型。就是图表左侧区域。看涨旗型大约五六根K线，回调后向上突破。多头的止损位就是在这里，都在这附近。机构投资者会知道这一点。他们会猎杀你的止损单，触及你的离场价，然后获取他们的低价筹码，然后去测试之前的极值。我们看到这一天最终并没有发生什么。但第二天就跳空高开，他们就赚不到钱了。","p":"p160"}]},{"t":"para","text":"接下来是两个不同的图表。这里我们看到一个强趋势进的趋势，已经持续了大约两个小时，而且这波上涨走势在这一点变得非常迅猛，价格出现了三次上涨，而且收出了非常漂亮的多头K线。我们看到空头在价格高位给出强烈拒绝，以及一次深度的三浪回调。这次回调幅度不大，空头未能将任何K线收在EMA均线下方，最终他测试了看涨旗型。就是图表左侧区域。看涨旗型大约五六根K线，回调后向上突破。多头的止损位就是在这里，都在这附近。机构投资者会知道这一点。他们会猎杀你的止损单，触及你的离场价，然后获取他们的低价筹码，然后去测试之前的极值。我们看到这一天最终并没有发生什么。但第二天就跳空高开，他们就赚不到钱了。","pid":"p160"},{"t":"img","src":"assets/img/c04_067.webp","ilabel":"C4-10","icap":"回调","fid":"fig68","ctx":[{"t":"接下来是两个不同的图表。这里我们看到一个强趋势进的趋势，已经持续了大约两个小时，而且这波上涨走势在这一点变得非常迅猛，价格出现了三次上涨，而且收出了非常漂亮的多头K线。我们看到空头在价格高位给出强烈拒绝，以及一次深度的三浪回调。这次回调幅度不大，空头未能将任何K线收在EMA均线下方，最终他测试了看涨旗型。就是图表左侧区域。看涨旗型大约五六根K线，回调后向上突破。多头的止损位就是在这里，都在这附近。机构投资者会知道这一点。他们会猎杀你的止损单，触及你的离场价，然后获取他们的低价筹码，然后去测试之前的极值。我们看到这一天最终并没有发生什么。但第二天就跳空高开，他们就赚不到钱了。","p":"p160"},{"t":"看跌的11.30止损。早盘我们看到这里有一个强劲的空头趋势，全天都在下跌，大概是11点半~12点之间就在这里。就在那里是那个时间点。我们正在跌破第一段下跌，第二段下跌，第三段下跌，然后他们进行了一次深度回调。这是一个熊旗，并且这是一个强劲的K线。止损位会在这里和这里。多头知道这一点，机构也知道这一点。一次深度的回调可能就要来了，而这正式会发生的，你看EMA实际上成了阻力。他会扫掉所有不好的止损位，然后他会再下跌几个波段。","p":"p161"},{"t":"计算趋势的波段：","p":"p162"},{"t":"趋势通常包含两个波段。通常如果一次反趋势的走势足够强劲，交易者就会开始琢磨还能出现多少个波段。","p":"p163"}]},{"t":"para","text":"看跌的11.30止损。早盘我们看到这里有一个强劲的空头趋势，全天都在下跌，大概是11点半~12点之间就在这里。就在那里是那个时间点。我们正在跌破第一段下跌，第二段下跌，第三段下跌，然后他们进行了一次深度回调。这是一个熊旗，并且这是一个强劲的K线。止损位会在这里和这里。多头知道这一点，机构也知道这一点。一次深度的回调可能就要来了，而这正式会发生的，你看EMA实际上成了阻力。他会扫掉所有不好的止损位，然后他会再下跌几个波段。","pid":"p161"},{"t":"para","text":"计算趋势的波段：","pid":"p162"},{"t":"para","text":"趋势通常包含两个波段。通常如果一次反趋势的走势足够强劲，交易者就会开始琢磨还能出现多少个波段。","pid":"p163"},{"t":"img","src":"assets/img/c04_068.webp","ilabel":"C4-11","icap":"回调","fid":"fig69","ctx":[{"t":"计算趋势的波段：","p":"p162"},{"t":"趋势通常包含两个波段。通常如果一次反趋势的走势足够强劲，交易者就会开始琢磨还能出现多少个波段。","p":"p163"},{"t":"两段式上涨：这是看涨的两个波段。他们有一个强劲的拉伸，从突破的底部一直到最强回调的顶部。到最强回调的顶部。就是看起来足够强，足以让空头们发动第二次下跌，但最终失败了。而多头们在一天之内就完成了他们的等距移动，所以这是一个非常强的趋势。并且他们之间有复杂的波段。","p":"p164"}]},{"t":"para","text":"两段式上涨：这是看涨的两个波段。他们有一个强劲的拉伸，从突破的底部一直到最强回调的顶部。到最强回调的顶部。就是看起来足够强，足以让空头们发动第二次下跌，但最终失败了。而多头们在一天之内就完成了他们的等距移动，所以这是一个非常强的趋势。并且他们之间有复杂的波段。","pid":"p164"},{"t":"img","src":"assets/img/c04_069.webp","ilabel":"C4-12","icap":"回调","fid":"fig70","ctx":[{"t":"两段式上涨：这是看涨的两个波段。他们有一个强劲的拉伸，从突破的底部一直到最强回调的顶部。到最强回调的顶部。就是看起来足够强，足以让空头们发动第二次下跌，但最终失败了。而多头们在一天之内就完成了他们的等距移动，所以这是一个非常强的趋势。并且他们之间有复杂的波段。","p":"p164"},{"t":"两段式下跌：空头两次下跌。这里我们可以看到从跳空下跌处进行了测量，因为这是一种非常强的拉伸，而这些K线真的非常强。所以空头们正在获得跟进。这是第一根多头K线。这说明就是一次回调，所以我从缺口底部开始向下测量。测量到回调开始之前，我将其测量线拉到更深的回调点，也就是均线所在的位置。这个点位就在这里。我没看到多头试图设下陷阱，但最终失败了，趋势得以延续。所以两段腿部的测量移动很容易计算，如果你不想精确计算每一段腿的长度，你可以测量已显示的移动幅度。前提是你能判断出当天处于趋势行情中。","p":"p165"},{"t":"高点/低点，1234：","p":"p166"},{"t":"高1234出现在下跌后的回调以及多头趋势中。也在趋势交易设置中效果很好。低1234出现在上涨后的回调以及空头趋势中。这在趋势交易设置中效果很好。高点，低点，1234。","p":"p167"}]},{"t":"para","text":"两段式下跌：空头两次下跌。这里我们可以看到从跳空下跌处进行了测量，因为这是一种非常强的拉伸，而这些K线真的非常强。所以空头们正在获得跟进。这是第一根多头K线。这说明就是一次回调，所以我从缺口底部开始向下测量。测量到回调开始之前，我将其测量线拉到更深的回调点，也就是均线所在的位置。这个点位就在这里。我没看到多头试图设下陷阱，但最终失败了，趋势得以延续。所以两段腿部的测量移动很容易计算，如果你不想精确计算每一段腿的长度，你可以测量已显示的移动幅度。前提是你能判断出当天处于趋势行情中。","pid":"p165"},{"t":"para","text":"高点/低点，1234：","pid":"p166"},{"t":"para","text":"高1234出现在下跌后的回调以及多头趋势中。也在趋势交易设置中效果很好。低1234出现在上涨后的回调以及空头趋势中。这在趋势交易设置中效果很好。高点，低点，1234。","pid":"p167"},{"t":"img","src":"assets/img/c04_070.webp","ilabel":"C4-13","icap":"回调","fid":"fig71","ctx":[{"t":"高点/低点，1234：","p":"p166"},{"t":"高1234出现在下跌后的回调以及多头趋势中。也在趋势交易设置中效果很好。低1234出现在上涨后的回调以及空头趋势中。这在趋势交易设置中效果很好。高点，低点，1234。","p":"p167"},{"t":"我强烈建议如果你想练习学习如何数浪，就去实盘操作，并自己标记图表。所以我们能看到突破和回调，而这根K线形成了一个高一。那不是一个好的交易机会，因为高一通常出现在反向通道中。所以这是多头趋势后的空头通道中的高一，是一个回调。这里我们可以看到高二，这是在空头通道形成后的一个新高。所以这说明因为我们以更差的价格获得了它。这可能是一个更好的入场点，因为它包含了更多信息。到了高三，我们看到回调，然后出现了一个新价格。它的价格和高二差不多，但期间出现了一个回调。最后的高四出现在最差的价格，但我们获得了最多的信息。多头们正在均线附近买入，并且他们正在买入更高的价位。这就是你付出的代价，你等待高一的时间越长，第234浪你获得的信息越多，但价格却越差。所以这里会形成一个高一。这里是另一个回调，形成了一个高二。这时候我们知道市场正在上涨。但此时我们不知道这是否会是突破失败。所以说，你是在为信息付费。高三比高二稍差一些，他出现在牛旗之后。看高四，这是趋势末期最不利的价格，但也出现了持续跟进，所以在强势趋势中你能获利，但问题是你能识别出强势趋势并做出相应的反应吗？你会被套在这个区间里吗？这是一个窄幅区间，AL要说在这种区间里很容易被套牢，而且很容易开始做空这些K线。所以这种情况就是一个在窄幅区间里不该做空的例子。","p":"p168"}]},{"t":"para","text":"我强烈建议如果你想练习学习如何数浪，就去实盘 "t":"para","text":"一天中的大部分时间时常会运行在区间的中部，如果市场开始下跌，它可能会继续下跌，如果市场在一天中间时的横盘，并向EMA均线靠近，出现K线买入的机会很高，如果市场没有处于明显的趋势中，交易者在一天中间时段交易时应该谨慎。","pid":"p187"},{"t":"img","src":"assets/img/c05_081.webp","ilabel":"C5-6","icap":"交易区间","fid":"fig82","ctx":[{"t":"一天中的中间时段处于区间的中部","p":"p186"},{"t":"一天中的大部分时间时常会运行在区间的中部，如果市场开始下跌，它可能会继续下跌，如果市场在一天中间时的横盘，并向EMA均线靠近，出现K线买入的机会很高，如果市场没有处于明显的趋势中，交易者在一天中间时段交易时应该谨慎。","p":"p187"},{"t":"一天中间时段的交易区间，我们来看看这是最近这一天的情况，分别是6号和7号。市场出现了一个跳空高开，市场回落至EMA然后价格小幅走高，直到大约太平洋标准时间上午8点。一直持续到上午13时左右，这是长达2小时的横盘震荡，很容易在高位被套牢，并在EMA附近做空，即使你等到突破，仍然有价格重叠，因此如果市场表现出日内震荡的迹象，就要准备好应对大量的价格重叠和快速的交易。","p":"p188"},{"t":"大涨大跌：","p":"p189"},{"t":"在经历了一次大涨之后，又出现了一次大跌，通常会跌到之前上涨的低点附近，这可能会导致市场进入区间震荡。有时这可能是一个新趋势的开始，如果发生这种情况，寻找反转形态。","p":"p190"}]},{"t":"para","text":"一天中间时段的交易区间，我们来看看这是最近这一天的情况，分别是6号和7号。市场出现了一个跳空高开，市场回落至EMA然后价格小幅走高，直到大约太平洋标准时间上午8点。一直持续到上午13时左右，这是长达2小时的横盘震荡，很容易在高位被套牢，并在EMA附近做空，即使你等到突破，仍然有价格重叠，因此如果市场表现出日内震荡的迹象，就要准备好应对大量的价格重叠和快速的交易。","pid":"p188"},{"t":"para","text":"大涨大跌：","pid":"p189"},{"t":"para","text":"在经历了一次大涨之后，又出现了一次大跌，通常会跌到之前上涨的低点附近，这可能会导致市场进入区间震荡。有时这可能是一个新趋势的开始，如果发生这种情况，寻找反转形态。","pid":"p190"},{"t":"img","src":"assets/img/c05_082.webp","ilabel":"C5-7","icap":"交易区间","fid":"fig83","ctx":[{"t":"大涨大跌：","p":"p189"},{"t":"在经历了一次大涨之后，又出现了一次大跌，通常会跌到之前上涨的低点附近，这可能会导致市场进入区间震荡。有时这可能是一个新趋势的开始，如果发生这种情况，寻找反转形态。","p":"p190"},{"t":"这里我们看到了一波大涨，接着又是一波大跌，市场快速上涨，随后又迅速跌至支撑位，并进入了一个15个点的区间，有了这个15个点的区间，这意味着你可以抓住低点和高点，实际上如果你在这里买入或者在这里买入，也许能抓住5~10个点。这波行情走得太快了。这个窄幅交易时间一直持续第二天，直到市场最终突破，窄幅区间交易情况非常普遍。而且就在这里我们可以看到，在经历了一波大幅上涨之后，市场实际上进入了横盘整理状态，在那之后市场就经历了一波大幅下跌，同样也是横盘整理。我指的是这种横盘的价格走势以及随后的这种横盘价格走势，这是一个没有重叠的突破，这是一种横盘整理的价格行为，没有很大的重叠，没有重叠，有重叠，我们开始识别差异非常重要。在突破和重叠之间。当市场在一个方向上移动并开始反转时，这可能是一个趋势的建仓形态。对于多头来说，市场可能会冲向支撑位或者反转成一个趋势，对于空头来说，市场可能会冲向阻力位，然后反转成一个趋势。","p":"p191"}]},{"t":"para","text":"这里我们看到了一波大涨，接着又是一波大跌，市场快速上涨，随后又迅速跌至支撑位，并进入了一个15个点的区间，有了这个15个点的区间，这意味着你可以抓住低点和高点，实际上如果你在这里买入或者在这里买入，也许能抓住5~10个点。这波行情走得太快了。这个窄幅交易时间一直持续第二天，直到市场最终突破，窄幅区间交易情况非常普遍。而且就在这里我们可以看到，在经历了一波大幅上涨之后，市场实际上进入了横盘整理状态，在那之后市场就经历了一波大幅下跌，同样也是横盘整理。我 d":"p196"},{"t":"para","text":"强势趋势中的突破建仓：","pid":"p197"},{"t":"para","text":"当市场价格突破前期高点或低点即为突破，处处皆有建仓机会，但优秀的价格行为交易者能比突破更早入场。在趋势强劲的日子里，有很多机会可以把握，只要止损设置得当，交易者就能盈利。寻找好的高点一，高点二以及低点一，低点二的入场机会。突破点通常会被重新测试，这可能成为一个不错的入场点。","pid":"p198"},{"t":"img","src":"assets/img/c06_085.webp","ilabel":"C6-1","icap":"突破","fid":"fig86","ctx":[{"t":"强势趋势中的突破建仓：","p":"p197"},{"t":"当市场价格突破前期高点或低点即为突破，处处皆有建仓机会，但优秀的价格行为交易者能比突破更早入场。在趋势强劲的日子里，有很多机会可以把握，只要止损设置得当，交易者就能盈利。寻找好的高点一，高点二以及低点一，低点二的入场机会。突破点通常会被重新测试，这可能成为一个不错的入场点。","p":"p198"},{"t":"看涨突破入场：","p":"p199"},{"t":"这是一个非常强烈的趋势，但持续不了多久。下一个会是更长一些的多头趋势。突破入场机会随处可见，我不想让图表显得太拥挤，不过我们会把止损设在突破价下方，这些点可能在这里，也可能在这里。就算没在这里，因为之后还会回测。正确的止损位应该在这里，但需要等高点形成。把止损设在正确的位置很重要。这里有一个微趋势线突破，你可以顺势入场，因为它有跟随效应，不过这个行情有点儿接近尾声，所以我认为还是等个小回调。你可以在任何地方入场，甚至如果你在那个信号K线的收盘价买入，你会在这两段行情中获利，我其实做了这笔交易，我在这波高点买入，后来不得不以更低的价格买入，但我仍然获利，因为我的止损设在那里。","p":"p200"}]},{"t":"para","text":"看涨突破入场：","pid":"p199"},{"t":"para","text":"这是一个非常强烈的趋势，但持续不了多久。下一个会是更长一些的多头趋势。突破入场机会随处可见，我不想让图表显得太拥挤，不过我们会把止损设在突破价下方，这些点可能在这里，也可能在这里。就算没在这里，因为之后还会回测。正确的止损位应该在这里，但需要等高点形成。把止损设在正确的位置很重要。这里有一个微趋势线突破，你可以顺势入场，因为它有跟随效应，不过这个行情有点儿接近尾声，所以我认为还是等个小回调。你可以在任何地方入场，甚至如果你在那个信号K线的收盘价买入，你会在这两段行情中获利，我其实做了这笔交易，我在这波高点买入，后来不得不以更低的价格买入，但我仍然获利，因为我的止损设在那里。","pid":"p200"},{"t":"img","src":"assets/img/c06_086.webp","ilabel":"C6-2","icap":"突破","fid":"fig87","ctx":[{"t":"看涨突破入场：","p":"p199"},{"t":"这是一个非常强烈的趋势，但持续不了多久。下一个会是更长一些的多头趋势。突破入场机会随处可见，我不想让图表显得太拥挤，不过我们会把止损设在突破价下方，这些点可能在这里，也可能在这里。就算没在这里，因为之后还会回测。正确的止损位应该在这里，但需要等高点形成。把止损设在正确的位置很重要。这里有一个微趋势线突破，你可以顺势入场，因为它有跟随效应，不过这个行情有点儿接近尾声，所以我认为还是等个小回调。你可以在任何地方入场，甚至如果你在那个信号K线的收盘价买入，你会在这两段行情中获利，我其实做了这笔交易，我在这波高点买入，后来不得不以更低的价格买入，但我仍然获利，因为我的止损设在那里。","p":"p200"},{"t":"这是一个拉伸的比较长，而且比较分散的趋势，这样我们就能获得一个更宏观的视角，我们可以几乎在任何位置上，如果我们回顾上一张图，并把止损设在正确的位置，止损会设在这里，一旦出现新高。之所以说在这里一旦出现新高这种情况比较棘手，因为它有点像一个通道，而且有很多重叠，止损设在这里，然后你会被止损出局。你可以把止损这里，这样会比较安全，但在这里也是一个新高了，所以你会被止损。实际上并不会。这个点位比那个点位高，所以正确的止损应该在这里，因为它是一个更高的点。先创新低，然后创出新高，如果你把止损设在正确的位置，我甚至一度真的以为我们会被套在这里，但你不会。这里的价格更高，这个低点比之前的那个低点更高。所以如果你把止损设在新高之后任何地方，只要趋势够强，就不会被止损。我可以买入任何K线，任何一些空 势。支撑位，空头获得回调，并且它是趋势性的，这是第一次回调，所以你可以看到无论在哪里，你都在任何地方卖出。你可以卖出获利，卖出获利，卖出这些K线，你有能赚钱，甚至可以设置一个宽止损在这里卖出，所以再多一点点，你就有可能非常幸运的抓住一个突破，那是一笔非常低概率的交易，我认为更好的卖出点位出现在这里附近。也许在第一次反弹之后，这就是一个高潮。","pid":"p203"},{"t":"img","src":"assets/img/c06_088.webp","ilabel":"C6-4","icap":"突破","fid":"fig89","ctx":[{"t":"空头突破入场：","p":"p202"},{"t":"空头突破建仓，再次强调这是一个极端行情。接下来我会展示一个更宽泛的趋势图，因为我想放大展示入场点，在这里我们可以看到市场大部分时间都在盘整，然后在一天临近收盘时突破涨势变得非常迅猛，K线实体越来越大。而且这种上涨趋势一直持续到第二天。正确的止损位置应该是在这里，还有这里。而这一段很关键，因为他到达了高潮，那既然已经创下新低，你的止损，就是在这里当创下新低时，你会把止损向下移动，所以你把止损移到这里。一路下移止损，这是一个强劲的趋势。支撑位，空头获得回调，并且它是趋势性的，这是第一次回调，所以你可以看到无论在哪里，你都在任何地方卖出。你可以卖出获利，卖出获利，卖出这些K线，你有能赚钱，甚至可以设置一个宽止损在这里卖出，所以再多一点点，你就有可能非常幸运的抓住一个突破，那是一笔非常低概率的交易，我认为更好的卖出点位出现在这里附近。也许在第一次反弹之后，这就是一个高潮。","p":"p203"},{"t":"这是一个更宽的通道，或者说是空头趋势的意思一样，急速上涨通道，所以止损会设置在新低点之后，空头形成了一个低点，你把止损设在这里。空头们直到第二天都没有创造新低，如果你想进行波段交易，你实际上根本不会被止损。然后这里又出现了一个新低，然后你可以把损失在这里，因为那是波段。回调形成了一个双顶，随后创下新低，止损就设在这里。如果你把止损设的位置在任何价位卖出都能赚钱。如果你在提前高点卖出，然后在第三段下跌后又加仓卖出，你就能赚钱，但这笔交易很难做，或者你可以等待空头反转信号。在这里测试均线。AL说过如果突破后的均线测试，只要点数接近就是不错的交易。这一点在接下来的幻灯片中会清楚地展示出来，这里是对这个形态的一个突破测试，这是一笔不错的交易，你的止损就设在那里，无论何时卖出，都能赚钱，随便何时卖出都能赚钱。一直持续到空头趋势结束。","p":"p204"},{"t":"突破回调和突破测试：","p":"p205"},{"t":"突破后的回调可能发生在离最初突破价仅几个点的地方，测试可能在一根K线后或20根K线后发生。测试入场价的K线可能成为一个好的信号K线，并且应该结合一个好的趋势建仓形态，在K线之上或之下一个tick下单。如果突破K线后出现回调，这次突破可能要失败了。有时非常强劲的突破，在经历1~2根K线的失败后，又回到趋势的延续，这些随后就变成了突破回调。","p":"p206"}]},{"t":"para","text":"这是一个更宽的通道，或者说是空头趋势的意思一样，急速上涨通道，所以止损会设置在新低点之后，空头形成了一个低点，你把止损设在这里。空头们直到第二天都没有创造新低，如果你想进行波段交易，你实际上根本不会被止损。然后这里又出现了一个新低，然后你可以把损失在这里，因为那是波段。回调形成了一个双顶，随后创下新低，止损就设在这里。如果你把止损设的位置在任何价位卖出都能赚钱。如果你在提前高点卖出，然后在第三段下跌后又加仓卖出，你就能赚钱，但这笔交易很难做，或者你可以等待空头反转信号。在这里测试均线。AL说过如果突破后的均线测试，只要点数接近就是不错的交易。这一点在接下来的幻灯片中会清楚地展示出来，这里是对这个形态的一个突破测试，这是一笔不错的交易，你的止损就设在那里，无论何时卖出，都能赚钱，随便何时卖出都能赚钱。一直持续到空头趋势结束。","pid":"p204"},{"t":"para","text":"突破回调和突破测试：","pid":"p205"},{"t":"para","text":"突破后的回调可能发生在离最初突破价仅几个点的地方，测试可能在一根K线后或20根K线后发生。测试入场价的K线可能成为一个好的信号K线，并且应该结合一个好的趋势建仓形态，在K线之上或之下一个tick下单。如果突破K线后出现回调，这次突破可能要失败了。有时非常强劲的突破，在经历1~2根K线的失败后，又回到趋势的延续，这些随后就变成了突破回调。","pid":"p206"},{"t":"img","src":"assets/im
