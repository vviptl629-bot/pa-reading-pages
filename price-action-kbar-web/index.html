img/c06_092.webp","ilabel":"C6-8","icap":"突破","fid":"fig93","ctx":[{"t":"空头突破后在几个点内就回调了，这是同一张图，这里和这里。我们看到在这段趋势中，价格重叠的区域更多。我的意思是这更像是一个震荡区间，这样我们就能看到更多的测试，稍微多一些回调，但这个概念完全一样。市场开始在这里跌破EMA，我想重点看看这些影线和K线，因为他们在测试这个跌破点，他们在测试这里的这些K线，这同时也是一个双顶。这就是在跌破EMA后形成的一个双顶，所以我可以预期会继续下行的正好是第二波下跌。他们迎来了第二波下跌，这根K线测试的那个价格，这是一个低一。而这将是低二，因为它出现在了一个更差的价格。而这将是低二，因为它出现在了一个更差的价格。如果低二出现在更好的价格，就是它可能是一个陷阱。在这种情况下，这是一笔不错的背景交易。所以这只是一个回调至EMA。双顶有许多好理由可以这么做。而AL提到的其中一点是他出现在距离突破点一个tick之内。我在这里画这条线，这样你们就能看到它与突破点对齐，因为这可能是一个交易区间。EMA被拉入后突破了。所以我认为这里会是空头的测试区域。它测试后就下跌了。完全一样，你可以看到低点。我想强调这个影线以及这些K线是如何测试这个影线的。","p":"p209"},{"t":"这是又一次突破后的回调。空头突破后的回调仅差几个点，这种情况整天都在发生。在这些空头趋势中有很多重叠，因为我们已经看涨了相当长一段时间了。这里可以看到重叠，但空头成功突破后又回调至EMA形成了一个双顶并再次突破。这个双顶正在测试最初的支撑位,就在这里。价格向下突破了几段后又回升来测试。可以看到多头在这里逐渐减弱，当价格第一次实际进入这根K线时，第二次就没有了。所以空头正在卖的越来越多。你可以看到我高亮了这根K线的上影线，以展示他与这里的支撑线对齐的位置。这和多头空头们一直在做的事情是同一个道理，他们正在测试之前的那个跌破位就在这里。那个跌破位在这里被测试过，而那个跌破位在这里也得到了他自己的测试。所以他在测试这个影线，这根K线的低点。它有点和EMA指数移动平均线对齐。你可以开始看到随着时间的推移，这些水平位是如何逐渐对齐的。EMA指数移动平均线总是很好用的，我喜欢在突破的时候围绕EMA进行交易。这里是同样的拉回，在突破之后，然后他就做空了。这里是测试。强调一下这个低点。","p":"p210"}]},{"t":"para","text":"这是又一次突破后的回调。空头突破后的回调仅差几个点，这种情况整天都在发生。在这些空头趋势中有很多重叠，因为我们已经看涨了相当长一段时间了。这里可以看到重叠，但空头成功突破后又回调至EMA形成了一个双顶并再次突破。这个双顶正在测试最初的支撑位,就在这里。价格向下突破了几段后又回升来测试。可以看到多头在这里逐渐减弱，当价格第一次实际进入这根K线时，第二次就没有了。所以空头正在卖的越来越多。你可以看到我高亮了这根K线的上影线，以展示他与这里的支撑线对齐的位置。这和多头空头们一直在做的事情是同一个道理，他们正在测试之前的那个跌破位就在这里。那个跌破位在这里被测试过，而那个跌破位在这里也得到了他自己的测试。所以他在测试这个影线，这根K线的低点。它有点和EMA指数移动平均线对齐。你可以开始看到随着时间的推移，这些水平位是如何逐渐对齐的。EMA指数移动平均线总是很好用的，我喜欢在突破的时候围绕EMA进行交易。这里是同样的拉回，在突破之后，然后他就做空了。这里是测试。强调一下这个低点。","pid":"p210"}],"wcount":3604},{"id":"c7","title":"第7章　价格的磁性","icon":"7","sections":[],"blocks":[{"t":"para","text":"第七章 价格的磁性","pid":"p211"},{"t":"para","text":"目录：基于第一次回调的等距移动AB=CD。基于薄弱区域和旗型的突破等距移动。反转常在前期失败，反转的信号K线处终结。其他价格磁铁。","pid":"p212"},{"t":"para","text":"基于第一次回调的等距移动AB=CD：","pid":"p213"},{"t":"para","text":"AB=CD等同于第一段与第二段等长的移动。第一段是AB段，第二段就是CD段，这些都是顺势而为的方法。在至少达到一个等距移动之前，应避免逆势交易。","pid":"p214"},{"t":"img","src":"assets/img/c07_093.webp","ilabel":"C7-1","icap":"价格的磁性","fid":"fig94","ctx":[{"t":"基于第一次回调的等距移动AB=CD：","p":"p213"},{"t":"AB=CD等同于第一段与第二段等长的移动。第一段是AB段，第二段就是CD段，这些都是顺势而为的方法。在至少达到一个等距移动之前，应避免逆势交易。","p":"p214"},{"t":"这里可以看到看涨的AB=CD形态，AB段从这里开始下跌。然后我们看到一次深幅回调形成了一个CD等距移动。ABCD的形态有两种，一种是你刚才看到的。","p":"p215"}]},{"t":"para","text":"这里可以看到看涨的AB=CD形态，AB段从这里开始下跌。然后我们看到一次深幅回调形成了一个CD等距移动。ABCD的形态有两种，一种是你刚才看到的。","pid":"p215"},{"t":"img","src":"assets/img/c07_094.webp","ilabel":"C7-2","icap":"价格的磁性","fid":"fig95","ctx":[{"t":"这里可以看到看涨的AB=CD形态，AB段从这里开始下跌。然后我们看到一次深幅回调形成了一个CD等距移动。ABCD的形态有两种，一种是你刚才看到的。","p":"p215"},{"t":"另一种可能是一个震荡区间内的形态，那么AB就是这个交易区间的低点和高点。而多头突破就是CD形态，并且这个形态在这里得到了验证。","p":"p216"}]},{"t":"para","text":"另一种可能是一个震荡区间内的形态，那么AB就是这个交易区间的低点和高点。而多头突破就是CD形态，并且这个形态在这里得到了验证。","pid":"p216"},{"t":"img","src":"assets/img/c07_095.webp","ilabel":"C7-3","icap":"价格的磁性","fid":"fig96","ctx":[{"t":"另一种可能是一个震荡区间内的形态，那么AB就是这个交易区间的低点和高点。而多头突破就是CD形态，并且这个形态在这里得到了验证。","p":"p216"},{"t":"这是看跌的AB等于CD形态：","p":"p217"},{"t":"这是第一段AB回调CD。这将是第一段到第二段的移动。书中提到了AB等于CD。注意AB等于CD的形态通常伴随着更深的回调。","p":"p218"}]},{"t":"para","text":"这是看跌的AB等于CD形态：","pid":"p217"},{"t":"para","text":"这是第一段AB回调CD。这将是第一段到第二段的移动。书中提到了AB等于CD。注意AB等于CD的形态通常伴随着更深的回调。","pid":"p218"},{"t":"img","src":"assets/img/c07_096.webp","ilabel":"C7-4","icap":"价格的磁性","fid":"fig97","ctx":[{"t":"这是看跌的AB等于CD形态：","p":"p217"},{"t":"这是第一段AB回调CD。这将是第一段到第二段的移动。书中提到了AB等于CD。注意AB等于CD的形态通常伴随着更深的回调。","p":"p218"},{"t":"这里是在看跌区间内的ABC形态。所以我们看到一个看跌的趋势进入交易区间，我们突破了这个交易区间，准备进行一次等距移动，而且最好是顺势交易，直到达到等距移动目标。你可以看到一旦达到目标，多头确实迎来了一个跳空高开，并在第二天赚到了钱。","p":"p219"},{"t":"基于薄弱区域和旗型的突破所产生的等距移动：","p":"p220"},{"t":"基于突破的等距移动指在让我们处于有利地位。这是趋势。窄的交易时间意味着突破的发生，突破时没有价格重叠，并且价格在一个方向上急剧变动。宽阔的交易区间是一个震荡区间，价格在此区间内来回波动，这意味着多头和空头都达成了共识。","p":"p221"}]},{"t":"para","text":"这里是在看跌区间内的ABC形态。所以我们看到一个看跌的趋势进入交易区间，我们突破了这个交易区间，准备进行一次等距移动，而且最好是顺势交易，直到达到等距移动目标。你可以看到一旦达到目标，多头确实迎来了一个跳空高开，并在第二天赚到了钱。","pid":"p219"},{"t":"para","text":"基于薄弱区域和旗型的突破所产生的等距移动：","pid":"p220"},{"t":"para","text":"基于突破的等距移动指在让我们处于有利地位。这是趋势。窄的交易时间意味着突破的发生，突破时没有价格重叠，并且价格在一个方向上急剧变动。宽阔的交易区间是一个震荡区间，价格在此区间内来回波动，这意味着多头和空头都达成了共识。","pid":"p221"},{"t":"img","src":"assets/img/c07_097.webp","ilabel":"C7-5","icap":"价格的磁性","fid":"fig98","ctx":[{"t":"基于薄弱区域和旗型的突破所产生的等距移动：","p":"p220"},{"t":"基于突破的等距移动指在让我们处于有利地位。这是趋势。窄的交易时间意味着突破的发生，突破时没有价格重叠，并且价格在一个方向上急剧变动。宽阔的交易区间是一个震荡区间，价格在此区间内来回波动，这意味着多头和空头都达成了共识。","p":"p221"},{"t":"这是一个多头行情，这里是交易稀疏区，那是突破一个有很多成立的密集交易区，所以我可以看到空头在推高价格，多头在低位接盘，双方在价格上达成一致。最终价格会小幅上涨，然后价格通过这里就变成了交易稀疏区域，你看这里没有重叠区域，K线之间彼此远离，呈上升趋势，而这里却有很多重叠。","p":"p222"}]},{"t":"para","text":"这是一个多头行情，这里是交易稀疏区，那是突破一个有很多成立的密集交易区，所以我可以看到空头在推高价格，多头在低位接盘，双方在价格上达成一致。最终价格会小幅上涨，然后价格通过这里就变成了交易稀疏区域，你看这里没有重叠区域，K线之间彼此远离，呈上升趋势，而这里却有很多重叠。","pid":"p222"},{"t":"img","src":"assets/img/c07_098.webp","ilabel":"C7-6","icap":"价格的磁性","fid":"fig99","ctx":[{"t":"这是一个多头行情，这里是交易稀疏区，那是突破一个有很多成立的密集交易区，所以我可以看到空头在推高价格，多头在低位接盘，双方在价格上达成一致。最终价格会小幅上涨，然后价格通过这里就变成了交易稀疏区域，你看这里没有重叠区域，K线之间彼此远离，呈上升趋势，而这里却有很多重叠。","p":"p222"},{"t":"这是一波下跌行情，等距移动目标已达成。较宽的区域是交易区间。K线重叠很多，空头K线与多头K线重叠，多头在低位买入，空头在高位做空。突破开始在这里附近加速，然后当价格突破这个区间时，较窄的区域是实际的突破区域。没有重叠，所有K线都在顺势上涨，下跌，他们在这里开盘，收盘价走低，开盘价高，收盘价低。这是一个小幅回调，他在这里开盘，收盘价走低，所以这些都是趋势K线，一直到达到等距移动。实际上走的更远了一点，然后就反转了。AL说在至少达到等距移动之前，我们都不应该做逆势交易。如果你在这里做多就会被套牢。如果你等达到目标位，这根K线才说得通。","p":"p223"},{"t":"反转往往结束于先前反转失败的信号K线：","p":"p224"},{"t":"当市场朝着一个方向发展时，之前会出现多次反转失败。这些失败的反转伴随着趋势回调。当市场最终反转趋势时，先前的反转失败点将成为目标位。","p":"p225"}]},{"t":"para","text":"这是一波下跌行情，等距移动目标已达成。较宽的区域是交易区间。K线重叠很多，空头K线与多头K线重叠，多头在低位买入，空头在高位做空。突破开始在这里附近加速，然后当价格突破这个区间时，较窄的区域是实际的突破区域。没有重叠，所有K线都在顺势上涨，下跌，他们在这里开盘，收盘价走低，开盘价高，收盘价低。这是一个小幅回调，他在这里开盘，收盘价走低，所以这些都是趋势K线，一直到达到等距移动。实际上走的更远了一点，然后就反转了。AL说在至少达到等距移动之前，我们都不应该做逆势交易。如果你在这里做多就会被套牢。如果你等达到目标位，这根K线才说得通。","pid":"p223"},{"t":"para","text":"反转往往结束于先前反转失败的信号K线：","pid":"p224"},{"t":"para","text":"当市场朝着一个方向发展时，之前会出现多次反转失败。这些失败的反转伴随着趋势回调。当市场最终反转趋势时，先前的反转失败点将成为目标位。","pid":"p225"},{"t":"img","src":"assets/img/c07_099.webp","ilabel":"C7-7","icap":"价格的磁性","fid":"fig100","ctx":[{"t":"反转往往结束于先前反转失败的信号K线：","p":"p224"},{"t":"当市场朝着一个方向发展时，之前会出现多次反转失败。这些失败的反转伴随着趋势回调。当市场最终反转趋势时，先前的反转失败点将成为目标位。","p":"p225"},{"t":"马上在这里开盘画出这条K线。知道何时突破关键位，稍作试探，观察即可。否则就是一个回调，然后创新高，再回调再创新高，不断回调再创新高。市场横盘整理，然后出现空头目标。这些回调位会变成支撑位，空头会去测试他们。最初的突破点就在这里被测试了，那是空头有效突破的低点，然后他就起飞了。","p":"p226"}]},{"t":"para","text":"马上在这里开盘画出这条K线。知道何时突破关键位，稍作试探，观察即可。否则就是一个回调，然后创新高，再回调再创新高，不断回调再创新高。市场横盘整理，然后出现空头目标。这些回调位会变成支撑位，空头会去测试他们。最初的突破点就在这里被测试了，那是空头有效突破的低点，然后他就起飞了。","pid":"p226"},{"t":"img","src":"assets/img/c07_100.webp","ilabel":"C7-8","icap":"价格的磁性","fid":"fig101","ctx":[{"t":"马上在这里开盘画出这条K线。知道何时突破关键位，稍作试探，观察即可。否则就是一个回调，然后创新高，再回调再创新高，不断回调再创新高。市场横盘整理，然后出现空头目标。这些回调位会变成支撑位，空头会去测试他们。最初的突破点就在这里被测试了，那是空头有效突破的低点，然后他就起飞了。","p":"p226"},{"t":"这里是一个下跌趋势，所以这些失败的反转都变成了熊旗。多头想把价格推高，但没成功，结果形成了一个熊旗，双顶形态伴随熊旗，价格下跌并创下新低，这里多头成功守住了更低的低点，这是看涨的价格走势，然后他们试图去测试那个熊旗，这也是之前的那个跌破位，看看这根K线。在这里多头想突破这个波动高点。市场快速冲向阻力位，价格有所回调，但最终还是突破了。你甚至可以看到市场回来测试了这个跌破位，所以当左边出现下跌趋势时，右边所以在这个例子里，它将是多头这边会面临空头，所以那是一个熊旗，那是他们的目标。双顶熊旗，那是他们的目标。","p":"p227"},{"t":"其他的价格磁铁：","p":"p228"},{"t":"市场里有很多价格磁铁。这些价格磁铁的设计目的，是为了让我们顺着趋势的正确方向前进。在触及价格磁铁之前，应该避免逆势建仓形态，我最喜欢的一些磁铁（关键价位）包括之前的价格高点，之前的价格低点，以及交易区间的等距移动，还有之前的波动高点和低点，正如AL提到的。有10~15个这样的关键价位，我建议大家去看看这一章里面有很多可以寻找的磁铁关键价位，并围绕他们构建交易（见原书籍或者视频课文字稿）。","p":"p229"}]},{"t":"para","text":"这里是一个下跌趋势，所以这些失败的反转都变成了熊旗。多头想把价格推高，但没成功，结果形成了一个熊旗，双顶形态伴随熊旗，价格下跌并创下新低，这里多头成功守住了更低的低点，这是看涨的价格走势，然后他们试图去测试那个熊旗，这也是之前的那个跌破位，看看这根K线。在这里多头想突破这个波动高点。市场快速冲向阻力位，价格有所回调，但最终还是突破了。你甚至可以看到市场回来测试了这个跌破位，所以当左边出现下跌趋势时，右边所以在这个例子里，它将是多头这边会面临空头，所以那是一个熊旗，那是他们的目标。双顶熊旗，那是他们的目标。","pid":"p227"},{"t":"para","text":"其他的价格磁铁：","pid":"p228"},{"t":"para","text":"市场里有很多价格磁铁。这些价格磁铁的设计目的，是为了让我们顺着趋势的正确方向前进。在触及价格磁铁之前，应该避免逆势建仓形态，我最喜欢的一些磁铁（关键价位）包括之前的价格高点，之前的价格低点，以及交易区间的等距移动，还有之前的波动高点和低点，正如AL提到的。有10~15个这样的关键价位，我建议大家去看看这一章里面有很多可以寻找的磁铁关键价位，并围绕他们构建交易（见原书籍或者视频课文字稿）。","pid":"p229"},{"t":"img","src":"assets/img/c07_101.webp","ilabel":"C7-9","icap":"价格的磁性","fid":"fig102","ctx":[{"t":"其他的价格磁铁：","p":"p228"},{"t":"市场里有很多价格磁铁。这些价格磁铁的设计目的，是为了让我们顺着趋势的正确方向前进。在触及价格磁铁之前，应该避免逆势建仓形态，我最喜欢的一些磁铁（关键价位）包括之前的价格高点，之前的价格低点，以及交易区间的等距移动，还有之前的波动高点和低点，正如AL提到的。有10~15个这样的关键价位，我建议大家去看看这一章里面有很多可以寻找的磁铁关键价位，并围绕他们构建交易（见原书籍或者视频课文字稿）。","p":"p229"},{"t":"这里是我最喜欢的几个磁铁，关键价位的例子以及他们为何是我最喜欢的，这是一个之前在不同低点以及一个之前的波动高点，多头成功突破，然后价格实现了等距移动，这个很简单，这种情况不常发生，但之前的盘整高点和低点确实会被触及。","p":"p230"}]},{"t":"para","text":"这里是我最喜欢的几个磁铁，关键价位的例子以及他们为何是我最喜欢的，这是一个之前在不同低点以及一个之前的波动高点，多头成功突破，然后价格实现了等距移动，这个很简单，这种情况不常发生，但之前的盘整高点和低点确实会被触及。","pid":"p230"},{"t":"img","src":"assets/img/c07_102.webp","ilabel":"C7-10","icap":"价格的磁性","fid":"fig103","ctx":[{"t":"这里是我最喜欢的几个磁铁，关键价位的例子以及他们为何是我最喜欢的，这是一个之前在不同低点以及一个之前的波动高点，多头成功突破，然后价格实现了等距移动，这个很简单，这种情况不常发生，但之前的盘整高点和低点确实会被触及。","p":"p230"},{"t":"这个空头也是同样的道理。之前的盘整高点，之前的盘整低点，空头们获得了突破，并且在价格进入横盘整理之前，等距目标已经达成。之前的盘整高点和低点往往像磁铁一样，因为市场会快速奔向支撑或阻力位。总结一下：这种磁铁效应随处可见，他们的目的就是引导我们顺势交易，我在达到目标价位之前就进行了逆势交易，结果损失惨重。AB=CD也是一种第一段等于第二段的等距移动，这样的方法都让我们顺应趋势。但市场最终还是反转了。之前的旗型形态或失败的反转信号可能会成为新趋势的交易目标，我补充了这个总结，书都没有，但我打算在每章末尾都加一个总结。这样重点就能更突出。其中一个让我印象深刻的观点是，AL总是说我们应该顺势交易并衡量已完成的行情。并且AB=CD也是一种第一段等于第二段的行情。","p":"p231"}]},{"t":"para","text":"这个空头也是同样的道理。之前的盘整高点，之前的盘整低点，空头们获得了突破，并且在价格进入横盘整理之前，等距目标已经达成。之前的盘整高点和低点往往像磁铁一样，因为市场会快速奔向支撑或阻力位。总结一下：这种磁铁效应随处可见，他们的目的就是引导我们顺势交易，我在达到目标价位之前就进行了逆势交易，结果损失惨重。AB=CD也是一种第一段等于第二段的等距移动，这样的方法都让我们顺应趋势。但市场最终还是反转了。之前的旗型形态或失败的反转信号可能会成为新趋势的交易目标，我补充了这个总结，书都没有，但我打算在每章末尾都加一个总结。这样重点就能更突出。其中一个让我印象深刻的观点是，AL总是说我们应该顺势交易并衡量已完成的行情。并且AB=CD也是一种第一段等于第二段的行情。","pid":"p231"}],"wcount":2142},{"id":"c8","title":"第8章　趋势判断","icon":"8","sections":[],"blocks":[{"t":"para","text":"第八章 趋势判断","pid":"p232"},{"t":"para","text":"目录：趋势线突破。趋势通道线突破失败：高潮，抛物线形态，V型顶部。反转第一腿中的强劲信号：趋势反转。趋势突破测试反转：凸刺或过冲。双顶和双底回调。高潮：急速和交易区间反转。高潮：三次推升和楔形 —— 趋势通道线过冲与反转。扩张三角形 / 喇叭形。","pid":"p233"},{"t":"para","text":"本书最重要的原则是顺势交易。在出现显著的趋势线突破前，切勿进行逆势交易。几乎所有的趋势反转都始于趋势线突破，如果没有突破，则表明原有的强劲趋势仍在持续。在强劲的趋势线突破及回调之后，可能会出现第二次入场机会。趋势线突破的力度越强，二次反弹或下跌的概率就越高。","pid":"p234"},{"t":"img","src":"assets/img/c08_103.webp","ilabel":"C8-1","icap":"趋势判断","fid":"fig104","ctx":[{"t":"目录：趋势线突破。趋势通道线突破失败：高潮，抛物线形态，V型顶部。反转第一腿中的强劲信号：趋势反转。趋势突破测试反转：凸刺或过冲。双顶和双底回调。高潮：急速和交易区间反转。高潮：三次推升和楔形 —— 趋势通道线过冲与反转。扩张三角形 / 喇叭形。","p":"p233"},{"t":"本书最重要的原则是顺势交易。在出现显著的趋势线突破前，切勿进行逆势交易。几乎所有的趋势反转都始于趋势线突破，如果没有突破，则表明原有的强劲趋势仍在持续。在强劲的趋势线突破及回调之后，可能会出现第二次入场机会。趋势线突破的力度越强，二次反弹或下跌的概率就越高。","p":"p234"},{"t":"趋势线突破：看跌。","p":"p235"},{"t":"我们看到这里有一个上升趋势，然后它被打破了，这时候进入了区间震荡，然后市场回测之前的高点，并大幅下跌。","p":"p236"}]},{"t":"para","text":"趋势线突破：看跌。","pid":"p235"},{"t":"para","text":"我们看到这里有一个上升趋势，然后它被打破了，这时候进入了区间震荡，然后市场回测之前的高点，并大幅下跌。","pid":"p236"},{"t":"img","src":"assets/img/c08_104.webp","ilabel":"C8-2","icap":"趋势判断","fid":"fig105","ctx":[{"t":"趋势线突破：看跌。","p":"p235"},{"t":"我们看到这里有一个上升趋势，然后它被打破了，这时候进入了区间震荡，然后市场回测之前的高点，并大幅下跌。","p":"p236"},{"t":"趋势线突破看涨：","p":"p237"},{"t":"这里我们看到一个下降通道。看在最后出现了一个外包K线。强劲的趋势线突破，并且价格突破了均线，价格回落进行回测，随后形成上升通道，直至当天收盘。","p":"p238"},{"t":"趋势通道线突破失败：高潮，抛物线形态，V型顶部：","p":"p239"},{"t":"它们的共同点是都伴随着高潮的价格行为，这些形态可能出现价格过冲并连续趋势，然后迅速反转。如果反转的第一段走势未能突破趋势线，那么主趋势可能仍在继续。","p":"p240"}]},{"t":"para","text":"趋势线突破看涨：","pid":"p237"},{"t":"para","text":"这里我们看到一个下降通道。看在最后出现了一个外包K线。强劲的趋势线突破，并且价格突破了均线，价格回落进行回测，随后形成上升通道，直至当天收盘。","pid":"p238"},{"t":"para","text":"趋势通道线突破失败：高潮，抛物线形态，V型顶部：","pid":"p239"},{"t":"para","text":"它们的共同点是都伴随着高潮的价格行为，这些形态可能出现价格过冲并连续趋势，然后迅速反转。如果反转的第一段走势未能突破趋势线，那么主趋势可能仍在继续。","pid":"p240"},{"t":"img","src":"assets/img/c08_105.webp","ilabel":"C8-3","icap":"趋势判断","fid":"fig106","ctx":[{"t":"趋势通道线突破失败：高潮，抛物线形态，V型顶部：","p":"p239"},{"t":"它们的共同点是都伴随着高潮的价格行为，这些形态可能出现价格过冲并连续趋势，然后迅速反转。如果反转的第一段走势未能突破趋势线，那么主趋势可能仍在继续。","p":"p240"},{"t":"看涨突破：我们这个通道交易几个小时，然后我们在通道的低点遭遇了突破失败，（只好做反转了）我们足够强势的突破了这条趋势线，最后出现了向上的一小波反弹。","p":"p241"}]},{"t":"para","text":"看涨突破：我们这个通道交易几个小时，然后我们在通道的低点遭遇了突破失败，（只好做反转了）我们足够强势的突破了这条趋势线，最后出现了向上的一小波反弹。","pid":"p241"},{"t":"img","src":"assets/img/c08_106.webp","ilabel":"C8-4","icap":"趋势判断","fid":"fig107","ctx":[{"t":"看涨突破：我们这个通道交易几个小时，然后我们在通道的低点遭遇了突破失败，（只好做反转了）我们足够强势的突破了这条趋势线，最后出现了向上的一小波反弹。","p":"p241"},{"t":"看跌突破：","p":"p242"},{"t":"这是一个空头突破。这是几天的时间跨度，价格出现了三次上涨，第二段上涨幅度过大，通道顶部出现的其他突破。然后价格出现了一段两段下跌，我也画出了这个图，因为它的情况类似。123次上冲，跌破第一段下跌，回调，第二段下跌。","p":"p243"},{"t":"反转第一段行情中的强行信号：","p":"p244"},{"t":"如果趋势线强力突破，可能会带来一次不错的波段交易机会，如果突破很多，可能会在趋势方向上出现几个低点强劲的趋势线突破，会EMA和之间形成的价格结构，在二次入场时，留意强烈的反转K线。","p":"p245"}]},{"t":"para","text":"看跌突破：","pid":"p242"},{"t":"para","text":"这是一个空头突破。这是几天的时间跨度，价格出现了三次上涨，第二段上涨幅度过大，通道顶部出现的其他突破。然后价格出现了一段两段下跌，我也画出了这个图，因为它的情况类似。123次上冲，跌破第一段下跌，回调，第二段下跌。","pid":"p243"},{"t":"para","text":"反转第一段行情中的强行信号：","pid":"p244"},{"t":"para","text":"如果趋势线强力突破，可能会带来一次不错的波段交易机会，如果突破很多，可能会在趋势方向上出现几个低点强劲的趋势线突破，会EMA和之间形成的价格结构，在二次入场时，留意强烈的反转K线。","pid":"p245"},{"t":"img","src":"assets/img/c08_107.webp","ilabel":"C8-5","icap":"趋势判断","fid":"fig108","ctx":[{"t":"反转第一段行情中的强行信号：","p":"p244"},{"t":"如果趋势线强力突破，可能会带来一次不错的波段交易机会，如果突破很多，可能会在趋势方向上出现几个低点强劲的趋势线突破，会EMA和之间形成的价格结构，在二次入场时，留意强烈的反转K线。","p":"p245"},{"t":"这是同一样图表，但指出了不同的地方。这里是趋势末端的一个外包K线。所以这里有三次下跌，一次，两次，三次。趋势末期的外包K线有利于反转。然后就带来了第二次上涨，所以我在看第一段上涨回调，第二段触及均线。然后空头迎来深度回调，重新测试低点。然后他们会发起第二次进攻，这里有多个建仓机会，可以在这里，这里，这里入场，说实话，在多头趋势上，任何时候低位买入就好。","p":"p246"}]},{"t":"para","text":"这是同一样图表，但指出了不同的地方。这里是趋势末端的一个外包K线。所以这里有三次下跌，一次，两次，三次。趋势末期的外包K线有利于反转。然后就带来了第二次上涨，所以我在看第一段上涨回调，第二段触及均线。然后空头迎来深度回调，重新测试低点。然后他们会发起第二次进攻，这里有多个建仓机会，可以在这里，这里，这里入场，说实话，在多头趋势上，任何时候低位买入就好。","pid":"p246"},{"t":"img","src":"assets/img/c08_108.webp","ilabel":"C8-6","icap":"趋势判断","fid":"fig109","ctx":[{"t":"这是同一样图表，但指出了不同的地方。这里是趋势末端的一个外包K线。所以这里有三次下跌，一次，两次，三次。趋势末期的外包K线有利于反转。然后就带来了第二次上涨，所以我在看第一段上涨回调，第二段触及均线。然后空头迎来深度回调，重新测试低点。然后他们会发起第二次进攻，这里有多个建仓机会，可以在这里，这里，这里入场，说实话，在多头趋势上，任何时候低位买入就好。","p":"p246"},{"t":"看跌强势信号：","p":"p247"},{"t":"看到一个大的空头通道，在大趋势之后出现的外包K线很难看清,但就是这根黑色的K线，它的交易价高于多头K线,然后继续向上走高几段，我的意思是横盘整理。然后跌破均线，但随后又回到横盘整理，多头们上冲，突破了前高的位置，这形成了一个双顶形态，让他们连续下跌了好几天。这个过程大约花了2~3天时间才完成。","p":"p248"},{"t":"趋势反转：通常伴随着一次测试，要么是向上试探不足，要是向上试探过度，在趋势线被突破后，寻找对前一个波动高点和低点的回测。市场有时会过度反应或不足，为了达到预期的波动高点或低点高潮反转，通常会过度突破前期的极端价位。","p":"p249"}]},{"t":"para","text":"看跌强势信号：","pid":"p247"},{"t":"para","text":"看到一个大的空头通道，在大趋势之后出现的外包K线很难看清,但就是这根黑色的K线，它的交易价高于多头K线,然后继续向上走高几段，我的意思是横盘整理。然后跌破均线，但随后又回到横盘整理，多头们上冲，突破了前高的位置，这形成了一个双顶形态，让他们连续下跌了好几天。这个过程大约花了2~3天时间才完成。","pid":"p248"},{"t":"para","text":"趋势反转：通常伴随着一次测试，要么是向上试探不足，要是向上试探过度，在趋势线被突破后，寻找对前一个波动高点和低点的回测。市场有时会过度反应或不足，为了达到预期的波动高点或低点高潮反转，通常会过度突破前期的极端价位。","pid":"p249"},{"t":"img","src":"assets/img/c08_109.webp","ilabel":"C8-7","icap":"趋势判断","fid":"fig110","ctx":[{"t":"看到一个大的空头通道，在大趋势之后出现的外包K线很难看清,但就是这根黑色的K线，它的交易价高于多头K线,然后继续向上走高几段，我的意思是横盘整理。然后跌破均线，但随后又回到横盘整理，多头们上冲，突破了前高的位置，这形成了一个双顶形态，让他们连续下跌了好几天。这个过程大约花了2~3天时间才完成。","p":"p248"},{"t":"趋势反转：通常伴随着一次测试，要么是向上试探不足，要是向上试探过度，在趋势线被突破后，寻找对前一个波动高点和低点的回测。市场有时会过度反应或不足，为了达到预期的波动高点或低点高潮反转，通常会过度突破前期的极端价位。","p":"p249"},{"t":"看涨测试：","p":"p250"},{"t":"这是一条非常陡峭的趋势线，起始于这个波段。强劲下跌，出现跳空下跌。然后他们用第一段下跌打破了趋势线，他重新测试了波动低点，也就是这里的价格行为，他们进行了多次波段反弹，推高价格填补的缺口，价格回升至之前跌破的波动高点。","p":"p251"}]},{"t":"para","text":"看涨测试：","pid":"p250"},{"t":"para","text":"这是一条非常陡峭的趋势线，起始于这个波段。强劲下跌，出现跳空下跌。然后他们用第一段下跌打破了趋势线，他重新测试了波动低点，也就是这里的价格行为，他们进行了多次波段反弹，推高价格填补的缺口，价格回升至之前跌破的波动高点。","pid":"p251"},{"t":"img","src":"assets/img/c08_110.webp","ilabel":"C8-8","icap":"趋势判断","fid":"fig111","ctx":[{"t":"看涨测试：","p":"p250"},{"t":"这是一条非常陡峭的趋势线，起始于这个波段。强劲下跌，出现跳空下跌。然后他们用第一段下跌打破了趋势线，他重新测试了波动低点，也就是这里的价格行为，他们进行了多次波段反弹，推高价格填补的缺口，价格回升至之前跌破的波动高点。","p":"p251"},{"t":"看空测试：","p":"p252"},{"t":"这里有一个多头通道，然后出现了过冲。一个突破，然后出现的过冲，并且这成为了一个高潮。然后在这个牛旗里，我们看到的趋势线被突破了，就形成了一个双顶，重新测试了波段高点，然后市场下跌了两段，第一段回调，第二段。这同时也是一个楔形顶，它是由三次推升组成的。","p":"p253"},{"t":"双顶和双底的回调：","p":"p254"},{"t":"如果市场在抛售之后形成了一个双底形态，这表明市场两次试图下跌，但都失败了。抛售之后买盘力量压倒了卖盘。这可能表明市场正在反转，多头即将占据主导。如果市场在上涨之后形成了一个双顶形态，这表明市场两次试图上涨，但都失败了。上涨之后，卖盘力量压倒了买盘。这可能表明市场正在反转，空头即将占据主导。","p":"p255"}]},{"t":"para","text":"看空测试：","pid":"p252"},{"t":"para","text":"这里有一个多头通道，然后出现了过冲。一个突破，然后出现的过冲，并且这成为了一个高潮。然后在这个牛旗里，我们看到的趋势线被突破了，就形成了一个双顶，重新测试了波段高点，然后市场下跌了两段，第一段回调，第二段。这同时也是一个楔形顶，它是由三次推升组成的。","pid":"p253"},{"t":"para","text":"双顶和双底的回调：","pid":"p254"},{"t":"para","text":"如果市场在抛售之后形成了一个双底形态，这表明市场两次试图下跌，但都失败了。抛售之后买盘力量压倒了卖盘。这可能表明市场正在反转，多头即将占据主导。如果市场在上涨之后形成了一个双顶形态，这表明市场两次试图上涨，但都失败了。上涨之后，卖盘力量压倒了买盘。这可能表明市场正在反转，空头即将占据主导。","pid":"p255"},{"t":"img","src":"assets/img/c08_111.webp","ilabel":"C8-9","icap":"趋势判断","fid":"fig112","ctx":[{"t":"双顶和双底的回调：","p":"p254"},{"t":"如果市场在抛售之后形成了一个双底形态，这表明市场两次试图下跌，但都失败了。抛售之后买盘力量压倒了卖盘。这可能表明市场正在反转，多头即将占据主导。如果市场在上涨之后形成了一个双顶形态，这表明市场两次试图上涨，但都失败了。上涨之后，卖盘力量压倒了买盘。这可能表明市场正在反转，空头即将占据主导。","p":"p255"},{"t":"双顶：","p":"p256"},{"t":"这里我们看到了一次上涨，我们看到价格向上走了几段，并且出现了一个突破，多头们在追高买入，我们可以从这些K线影线看出来，然后市场又回落了，之前被套在这里的多头将会在成本价附近离场，我们会在前一个波段高点做空，这样的一个导致卖方多于买方。","p":"p257"}]},{"t":"para","text":"双顶：","pid":"p256"},{"t":"para","text":"这里我们看到了一次上涨，我们看到价格向上走了几段，并且出现了一个突破，多头们在追高买入，我们可以从这些K线影线看出来，然后市场又回落了，之前被套在这里的多头将会在成本价附近离场，我们会在前一个波段高点做空，这样的一个导致卖方多于买方。","pid":"p257"},{"t":"img","src":"assets/img/c08_112.webp","ilabel":"C8-10","icap":"趋势判断","fid":"fig113","ctx":[{"t":"双顶：","p":"p256"},{"t":"这里我们看到了一次上涨，我们看到价格向上走了几段，并且出现了一个突破，多头们在追高买入，我们可以从这些K线影线看出来，然后市场又回落了，之前被套在这里的多头将会在成本价附近离场，我们会在前一个波段高点做空，这样的一个导致卖方多于买方。","p":"p257"},{"t":"双底：","p":"p258"},{"t":"这里出现了一轮抛售，空头在低位做空被套。市场价格又回到了他们那里。空头会回补空单，多头会买入前一个波段低点。这带来了更多的买家，市场将向上走几段。","p":"p259"},{"t":"高潮：急速和交易区间反转","p":"p260"},{"t":"在趋势后期，高潮伴随着强劲的势头。这种急速意味着价格真正开始波动时动能非常强劲，此前的价格行为之后是向相反方向的强劲移动，这种价格行为可能导致市场进入一个窄幅震荡区间。交易者应避免在窄幅震荡区间进行交易，窄幅震荡区间可能向任何方向反转。","p":"p261"}]},{"t":"para","text":"双底：","pid":"p258"},{"t":"para","text":"这里出现了一轮抛售，空头在低位做空被套。市场价格又回到了他们那里。空头会回补空单，多头会买入前一个波段低点。这带来了更多的买家，市场将向上走几段。","pid":"p259"},{"t":"para","text":"高潮：急速和交易区间反转","pid":"p260"},{"t":"para","text":"在趋势后期，高潮伴随着强劲的势头。这种急速意味着价格真正开始波动时动能非常强劲，此前的价格行为之后是向相反方向的强劲移动，这种价格行为可能导致市场进入一个窄幅震荡区间。交易者应避免在窄幅震荡区间进行交易，窄幅震荡区间可能向任何方向反转。","pid":"p261"},{"t":"img","src":"assets/img/c08_113.webp","ilabel":"C8-11","icap":"趋势判断","fid":"fig114","ctx":[{"t":"高潮：急速和交易区间反转","p":"p260"},{"t":"在趋势后期，高潮伴随着强劲的势头。这种急速意味着价格真正开始波动时动能非常强劲，此前的价格行为之后是向相反方向的强劲移动，这种价格行为可能导致市场进入一个窄幅震荡区间。交易者应避免在窄幅震荡区间进行交易，窄幅震荡区间可能向任何方向反转。","p":"p261"},{"t":"看涨急速：","p":"p262"},{"t":"我看到一个急速，随后是横盘整理，急剧反转，然后几个小时都是交易重叠，这里有价格重叠，又出现了一个急速。","p":"p263"}]},{"t":"para","text":"看涨急速：","pid":"p262"},{"t":"para","text":"我看到一个急速，随后是横盘整理，急剧反转，然后几个小时都是交易重叠，这里有价格重叠，又出现了一个急速。","pid":"p263"},{"t":"img","src":"assets/img/c08_114.webp","ilabel":"C8-12","icap":"趋势判断","fid":"fig115","ctx":[{"t":"看涨急速：","p":"p262"},{"t":"我看到一个急速，随后是横盘整理，急剧反转，然后几个小时都是交易重叠，这里有价格重叠，又出现了一个急速。","p":"p263"},{"t":"这里出现了两次空头下跌，急速巨大的K线，动能十足，但这是在一个大涨之后出现的。大幅上涨下跌后看到一个窄幅区间，伴随着大量的价格重叠，这是一个限价订单驱动的市场，如果你在高点买入，你就被套牢了。如果你在收盘价卖出，你就被套牢了。这种情况会持续几个小时。","p":"p264"},{"t":"高潮：三次推升和楔形（趋势通道线价格过冲以及趋势反转）","p":"p265"},{"t":"趋势在触及极端价位后往往会结束趋势，可能先朝一个方向发力，然后出现两个较小的回调或反弹。这被称为楔形，他表明市场是否朝同一个方向三次发力。","p":"p266"}]},{"t":"para","text":"这里出现了两次空头下跌，急速巨大的K线，动能十足，但这是在一个大涨之后出现的。大幅上涨下跌后看到一个窄幅区间，伴随着大量的价格重叠，这是一个限价订单驱动的市场，如果你在高点买入，你就被套牢了。如果你在收盘价卖出，你就被套牢了。这种情况会持续几个小时。","pid":"p264"},{"t":"para","text":"高潮：三次推升和楔形（趋势通道线价格过冲以及趋势反转）","pid":"p265"},{"t":"para","text":"趋势在触及极端价位后往往会结束趋势，可能先朝一个方向发力，然后出现两个较小的回调或反弹。这被称为楔形，他表明市场是否朝同一个方向三次发力。","pid":"p266"},{"t":"img","src":"assets/img/c08_115.webp","ilabel":"C8-13","icap":"趋势判断","fid":"fig116","ctx":[{"t":"高潮：三次推升和楔形（趋势通道线价格过冲以及趋势反转）","p":"p265"},{"t":"趋势在触及极端价位后往往会结束趋势，可能先朝一个方向发力，然后出现两个较小的回调或反弹。这被称为楔形，他表明市场是否朝同一个方向三次发力。","p":"p266"},{"t":"楔形顶部形态：","p":"p267"},{"t":"这里有一波多头上涨，一个巨大的跳空上涨形成了第一段上涨，随后是回调，第二段上涨回调，第三段上涨。在这个巨大的楔形里，还有一个嵌套的楔形。第一波上涨回调，第二波上涨，回调第三波上涨。第三段上涨正在测试第二段上涨的高点，就像双顶形态一样，买家在盈亏平衡点纷纷离场，卖家占据主导，市场向下走了几个波段。","p":"p268"}]},{"t":"para","text":"楔形顶部形态：","pid":"p267"},{"t":"para","text":"这里有一波多头上涨，一个巨大的跳空上涨形成了第一段上涨，随后是回调，第二段上涨回调，第三段上涨。在这个巨大的楔形里，还有一个嵌套的楔形。第一波上涨回调，第二波上涨，回调第三波上涨。第三段上涨正在测试第二段上涨的高点，就像双顶形态一样，买家在盈亏平衡点纷纷离场，卖家占据主导，市场向下走了几个波段。","pid":"p268"},{"t":"img","src":"assets/img/c08_116.webp","ilabel":"C8-14","icap":"趋势判断","fid":"fig117","ctx":[{"t":"楔形顶部形态：","p":"p267"},{"t":"这里有一波多头上涨，一个巨大的跳空上涨形成了第一段上涨，随后是回调，第二段上涨回调，第三段上涨。在这个巨大的楔形里，还有一个嵌套的楔形。第一波上涨回调，第二波上涨，回调第三波上涨。第三段上涨正在测试第二段上涨的高点，就像双顶形态一样，买家在盈亏平衡点纷纷离场，卖家占据主导，市场向下走了几个波段。","p":"p268"},{"t":"楔形底部形态：","p":"p269"},{"t":"这个形态有多种计数方法。你有一个第一波上涨回调，第二波上涨，回调第三波上涨。或者可以是第一波上涨回调，第二波上涨，然后第三波上涨。而且这里还有一个微型楔形底部形态有点像第一波上涨。回撤，第二次推升，回撤第三次推升。这里我想向大家展示一下这个形态的威力以及空头们三次受挫意味着什么。","p":"p270"}]},{"t":"para","text":"楔形底部形态：","pid":"p269"},{"t":"para","text":"这个形态有多种计数方法。你有一个第一波上涨回调，第二波上涨，回调第三波上涨。或者可以是第一波上涨回调，第二波上涨，然后第三波上涨。而且这里还有一个微型楔形底部形态有点像第一波上涨。回撤，第二次推升，回撤第三次推升。这里我想向大家展示一下这个形态的威力以及空头们三次受挫意味着什么。","pid":"p270"},{"t":"img","src":"assets/img/c08_117.webp","ilabel":"C8-15","icap":"趋势判断","fid":"fig118","ctx":[{"t":"楔形底部形态：","p":"p269"},{"t":"这个形态有多种计数方法。你有一个第一波上涨回调，第二波上涨，回调第三波上涨。或者可以是第一波上涨回调，第二波上涨，然后第三波上涨。而且这里还有一个微型楔形底部形态有点像第一波上涨。回撤，第二次推升，回撤第三次推升。这里我想向大家展示一下这个形态的威力以及空头们三次受挫意味着什么。","p":"p270"},{"t":"他已经突破了好几天，这是一个非常强劲的多头趋势，我们离开那个楔形底部已经大约两天半。这种情况并非每次都会发生，但我认为是真的很有意思，这个形态很漂亮。","p":"p271"},{"t":"扩张三角形：","p":"p272"},{"t":"有5个波段组成，可以是反转形态或持续形态。每个波段都会达到一个新的极端。这使得这个三角形看起来像在扩张。","p":"p273"}]},{"t":"para","text":"他已经突破了好几天，这是一个非常强劲的多头趋势，我们离开那个楔形底部已经大约两天半。这种情况并非每次都会发生，但我认为是真的很有意思，这个形态很漂亮。","pid":"p271"},{"t":"para","text":"扩张三角形：","pid":"p272"},{"t":"para","text":"有5个波段组成，可以是反转形态或持续形态。每个波段都会达到一个新的极端。这使得这个三角形看起来像在扩张。","pid":"p273"},{"t":"img","src":"assets/img/c08_118.webp","ilabel":"C8-16","icap":"趋势判断","fid":"fig119","ctx":[{"t":"扩张三角形：","p":"p272"},{"t":"有5个波段组成，可以是反转形态或持续形态。每个波段都会达到一个新的极端。这使得这个三角形看起来像在扩张。","p":"p273"},{"t":"这是一个扩张三角形开始信号。这是放大来看的图像跨度大约10天。我们看到多头趋势中的一波上涨，随后市场开始收缩，并出现几次波动。12345。这可以说是第6次波动，这比第四次波动形成了一个更低的高点，所以又出现了一个更低的高点，市场几次未能向下突破，随后向上突破了。价格跳空上涨并持续了一段时间。","p":"p274"}]},{"t":"para","text":"这是一个扩张三角形开始信号。这是放大来看的图像跨度大约10天。我们看到多头趋势中的一波上涨，随后市场开始收缩，并出现几次波动。12345。这可以说是第6次波动，这比第四次波动形成了一个更低的高点，所以又出现了一个更低的高点，市场几次未能向下突破，随后向上突破了。价格跳空上涨并持续了一段时间。","pid":"p274"},{"t":"img","src":"assets/img/c08_119.webp","ilabel":"C8-17","icap":"趋势判断","fid":"fig120","ctx":[{"t":"这是一个扩张三角形开始信号。这是放大来看的图像跨度大约10天。我们看到多头趋势中的一波上涨，随后市场开始收缩，并出现几次波动。12345。这可以说是第6次波动，这比第四次波动形成了一个更低的高点，所以又出现了一个更低的高点，市场几次未能向下突破，随后向上突破了。价格跳空上涨并持续了一段时间。","p":"p274"},{"t":"这是一个扩张三角形，出现了看跌突破信号，每一次的波段交易都创下了新的高点和低点，你可能会说，哦，这是一个三重顶 ，还有点像，这是第一个。然后如果你看第三个波段，它差不多在第5个波段很高，它在底部不断扩大，所以我把它看做一个扩张三角形，就像1234是这个价格区间内的波动，然后是第5个。多头遭遇了突破失败，然后价格下跌了好几天，不错，那将是一笔很棒的波段交易，或者你知道一笔为期数日的波段交易，这是一个熊旗，这里还有一个三角形的还没有过来，因为价格没有创新高。价格被限制在这一段行情内。","p":"p275"},{"t":"总结。在强劲的趋势线被突破之前，只顺着趋势交易很重要，即便趋势线被突破了，也要等待回踩和二次入场。反转行情会发生在测试了前期高点和低点之后，反转行情出现，二次下跌或上涨的概率会更高。（如果趋势线突破是强劲。突破均线和价格结构）","p":"p276"}]},{"t":"para","text":"这是一个扩张三角形，出现了看跌突破信号，每一次的波段交易都创下了新的高点和低点，你可能会说，哦，这是一个三重顶 ，还有点像，这是第一个。然后如果你看第三个波段，它差不多在第5个波段很高，它在底部不断扩大，所以我把它看做一个扩张三角形，就像1234是这个价格区间内的波动，然后是第5个。多头遭遇了突破失败，然后价格下跌了好几天，不错，那将是一笔很棒的波段交易，或者你知道一笔为期数日的波段交易，这是一个熊旗，这里还有一个三角形的还没有过来，因为价格没有创新高。价格被限制在这一段行情内。","pid":"p275"},{"t":"para","text":"总结。在强劲的趋势线被突破之前，只顺着趋势交易很重要，即便趋势线被突破了，也要等待回踩和二次入场。反转行情会发生在测试了前期高点和低点之后，反转行情出现，二次下跌或上涨的概率会更高。（如果趋势线突破是强劲。突破均线和价格结构）","pid":"p276"}],"wcount":3162},{"id":"c9","title":"第9章　次要反转与失效","icon":"9","sections":[],"blocks":[{"t":"para","text":"第九章 次要反转与失效","pid":"p277"},{"t":"para","text":"目录：失效的信号与入场K线，1tick的失败建仓。失败的高1高2。失败的更高高点和更低低点突破。失败的趋势线和通道线。失败的反转。末端旗型失败：窄幅交易区间。末端旗型失败：猛烈的空头趋势。失败的楔形。失败的剥头皮交易：5tick失败突破和未能达到的止盈目标。","pid":"p278"},{"t":"para","text":"失效的信号与入场K线，1tick的失败建仓：","pid":"p279"},{"t":"para","text":"1tick失败会将心急的交易者诱骗至趋势的错误一方。","pid":"p280"},{"t":"para","text":"在窄幅交易区间中很容易被套。交易者在进场前应等待清晰的突破。","pid":"p281"},{"t":"para","text":"当市场向上交易1Tick后随即反转，这可以构成一个很好的剥头皮交易机会。","pid":"p282"},{"t":"para","text":"多头会从失败的突破（BO）交易中止损离场，而空头则会顺势做空进行剥头皮交易。","pid":"p283"},{"t":"img","src":"assets/img/c09_120.webp","ilabel":"C9-1","icap":"次要反转与失效","fid":"fig121","ctx":[{"t":"当市场向上交易1Tick后随即反转，这可以构成一个很好的剥头皮交易机会。","p":"p282"},{"t":"多头会从失败的突破（BO）交易中止损离场，而空头则会顺势做空进行剥头皮交易。","p":"p283"},{"t":"因此我们在这里看到一个下跌趋势和一个上升趋势。这个上升趋势在之前的高点处受阻。这个看起来像一个上升通道，但实际上是一个测试，空头趁势卖当天的又一个新低。多头在这里买入了旗型形态，结果被套住了，不得不平仓离场。这也属于震荡区间。","p":"p284"}]},{"t":"para","text":"因此我们在这里看到一个下跌趋势和一个上升趋势。这个上升趋势在之前的高点处受阻。这个看起来像一个上升通道，但实际上是一个测试，空头趁势卖当天的又一个新低。多头在这里买入了旗型形态，结果被套住了，不得不平仓离场。这也属于震荡区间。","pid":"p284"},{"t":"img","src":"assets/img/c09_121.webp","ilabel":"C9-2","icap":"次要反转与失效","fid":"fig122","ctx":[{"t":"因此我们在这里看到一个下跌趋势和一个上升趋势。这个上升趋势在之前的高点处受阻。这个看起来像一个上升通道，但实际上是一个测试，空头趁势卖当天的又一个新低。多头在这里买入了旗型形态，结果被套住了，不得不平仓离场。这也属于震荡区间。","p":"p284"},{"t":"信号失效，空头转为多头。","p":"p285"},{"t":"这是一个空头趋势，空头趋势第一段，第二段回调，第三段回调。空头们可能会说这是跌破均线的突破，但后续跟随乏力，而且这是一根区间K线。所以这就是他们被套牢的地方。市场随即反转，测试了之前的极端高点。","p":"p286"},{"t":"高点二和低点二信号失效。","p":"p287"},{"t":"高点二和低点二是可靠的交易机会。如果这些形态失败，市场可能就会进入一个反向的趋势通道。如果高点或低点二失败，可能会出现二条腿或更多腿的走势。沿着趋势的方向等待高点四或低点四的出现。如果高点四或低点四失败，市场可能处于一个小的回调趋势中。并且只进行区间内的交易。","p":"p288"}]},{"t":"para","text":"信号失效，空头转为多头。","pid":"p285"},{"t":"para","text":"这是一个空头趋势，空头趋势第一段，第二段回调，第三段回调。空头们可能会说这是跌破均线的突破，但后续跟随乏力，而且这是一根区间K线。所以这就是他们被套牢的地方。市场随即反转，测试了之前的极端高点。","pid":"p286"},{"t":"para","text":"高点二和低点二信号失效。","pid":"p287"},{"t":"para","text":"高点二和低点二是可靠的交易机会。如果这些形态失败，市场可能就会进入一个反向的趋势通道。如果高点或低点二失败，可能会出现二条腿或更多腿的走势。沿着趋势的方向等待高点四或低点四的出现。如果高点四或低点四失败，市场可能处于一个小的回调趋势中。并且只进行区间内的交易。","pid":"p288"},{"t":"img","src":"assets/img/c09_122.webp","ilabel":"C9-3","icap":"次要反转与失效","fid":"fig123","ctx":[{"t":"高点二和低点二信号失效。","p":"p287"},{"t":"高点二和低点二是可靠的交易机会。如果这些形态失败，市场可能就会进入一个反向的趋势通道。如果高点或低点二失败，可能会出现二条腿或更多腿的走势。沿着趋势的方向等待高点四或低点四的出现。如果高点四或低点四失败，市场可能处于一个小的回调趋势中。并且只进行区间内的交易。","p":"p288"},{"t":"这里我们看到了一个失败的高2，这是一轮下跌，一次看跌突破。一次回调形成了一个高1，第二次回调形成了一个高2。这个高点2是个陷阱，因为它出现在EMA下方,价格很差。多头被套住了，我们又来了一波下跌。这是高3。又来了一波下跌以及一个高4。在这里如果你做多，你得在更低的位置加仓，但我们已经长时间处于EMA下方了。所以我们可能处于空头趋势中，最好还是等等。","p":"p289"}]},{"t":"para","text":"这里我们看到了一个失败的高2，这是一轮下跌，一次看跌突破。一次回调形成了一个高1，第二次回调形成了一个高2。这个高点2是个陷阱，因为它出现在EMA下方,价格很差。多头被套住了，我们又来了一波下跌。这是高3。又来了一波下跌以及一个高4。在这里如果你做多，你得在更低的位置加仓，但我们已经长时间处于EMA下方了。所以我们可能处于空头趋势中，最好还是等等。","pid":"p289"},{"t":"img","src":"assets/img/c09_123.webp","ilabel":"C9-4","icap":"次要反转与失效","fid":"fig124","ctx":[{"t":"这里我们看到了一个失败的高2，这是一轮下跌，一次看跌突破。一次回调形成了一个高1，第二次回调形成了一个高2。这个高点2是个陷阱，因为它出现在EMA下方,价格很差。多头被套住了，我们又来了一波下跌。这是高3。又来了一波下跌以及一个高4。在这里如果你做多，你得在更低的位置加仓，但我们已经长时间处于EMA下方了。所以我们可能处于空头趋势中，最好还是等等。","p":"p289"},{"t":"失败的低2：","p":"p290"},{"t":"这里是多头趋势。哪里有不同的？回调到指数移动平均线，并且形成一个低点，又一波多头上涨，并且形成了一个低二。在这里做空的，空头被套住了。这里多头带来了又一波上涨。这是低3和低4。你也许能持仓进行一次快速的剥头皮交易，但最终多头又迎来了一波上涨。并在第二天突破。他们需要高点或低点的突破。大部分时间市场都处于震荡。","p":"p291"},{"t":"失败的更高高点和更低低点突破：","p":"p292"},{"t":"这是一个逆势做空新高和新低的良好交易机会。不过交易者应该等待趋势线被明确突破。如果在趋势线突破前进行交易，很也能导致逆势操作，这会导致亏损。","p":"p293"}]},{"t":"para","text":"失败的低2：","pid":"p290"},{"t":"para","text":"这里是多头趋势。哪里有不同的？回调到指数移动平均线，并且形成一个低点，又一波多头上涨，并且形成了一个低二。在这里做空的，空头被套住了。这里多头带来了又一波上涨。这是低3和低4。你也许能持仓进行一次快速的剥头皮交易，但最终多头又迎来了一波上涨。并在第二天突破。他们需要高点或低点的突破。大部分时间市场都处于震荡。","pid":"p291"},{"t":"para","text":"失败的更高高点和更低低点突破：","pid":"p292"},{"t":"para","text":"这是一个逆势做空新高和新低的良好交易机会。不过交易者应该等待趋势线被明确突破。如果在趋势线突破前进行交易，很也能导致逆势操作，这会导致亏损。","pid":"p293"},{"t":"img","src":"assets/img/c09_124.webp","ilabel":"C9-5","icap":"次要反转与失效","fid":"fig125","ctx":[{"t":"失败的更高高点和更低低点突破：","p":"p292"},{"t":"这是一个逆势做空新高和新低的良好交易机会。不过交易者应该等待趋势线被明确突破。如果在趋势线突破前进行交易，很也能导致逆势操作，这会导致亏损。","p":"p293"},{"t":"他们形成了更高的低点。这里我们看到一个强劲的多头趋势，包含第一段上涨（leg1）回调，第二段上涨（leg2）回调，第三段上涨三（leg3）。这一下跌趋势突破了趋势线。然后多头会进行回测，届时你可以开始逆势操作。所以你可以看到这个高点是一个很好的逆势做空点。你可以逆势做空，博取第二段下跌。逆势做空，进行短线交易，在这里逆势做空，会迎来一段不错的下跌行情。","p":"p294"}]},{"t":"para","text":"他们形成了更高的低点。这里我们看到一个强劲的多头趋势，包含第一段上涨（leg1）回调，第二段上涨（leg2）回调，第三段上涨三（leg3）。这一下跌趋势突破了趋势线。然后多头会进行回测，届时你可以开始逆势操作。所以你可以看到这个高点是一个很好的逆势做空点。你可以逆势做空，博取第二段下跌。逆势做空，进行短线交易，在这里逆势做空，会迎来一段不错的下跌行情。","pid":"p294"},{"t":"img","src":"assets/img/c09_125.webp","ilabel":"C9-6","icap":"次要反转与失效","fid":"fig126","ctx":[{"t":"他们形成了更高的低点。这里我们看到一个强劲的多头趋势，包含第一段上涨（leg1）回调，第二段上涨（leg2）回调，第三段上涨三（leg3）。这一下跌趋势突破了趋势线。然后多头会进行回测，届时你可以开始逆势操作。所以你可以看到这个高点是一个很好的逆势做空点。你可以逆势做空，博取第二段下跌。逆势做空，进行短线交易，在这里逆势做空，会迎来一段不错的下跌行情。","p":"p294"},{"t":"他们需要创下更低的低点。这里我们看到了强劲的空头趋势。第一段下跌回调，第二段下跌回调，第三段下跌。第四段下跌突破了趋势线并回踩的低点。在趋势线被回踩之后，你可以开始买入看跌K线进行短线交易，而且效果很好。你在低点买入，你在低点买入，你在低点买入。你可以在低点买入，继续在更低处买入，然后在这里离场。你可以低位买入，低位买入，你可以低位买入。因为这显示的空头压力，抓住他们你得做短线交易。这是一个宽多头通道。","p":"p295"},{"t":"失败的趋势线和通道线：","p":"p296"},{"t":"他们拥有趋势线和趋势通道线。趋势线应该包含之前的价格走势，当趋势线被突破时，这表明你的反转正在发生。这并不意味着在第一次突破时就建仓，市场通常会回测之前的极端价位，然后反转。","p":"p297"}]},{"t":"para","text":"他们需要创下更低的低点。这里我们看到了强劲的空头趋势。第一段下跌回调，第二段下跌回调，第三段下跌。第四段下跌突破了趋势线并回踩的低点。在趋势线被回踩之后，你可以开始买入看跌K线进行短线交易，而且效果很好。你在低点买入，你在低点买入，你在低点买入。你可以在低点买入，继续在更低处买入，然后在这里离场。你可以低位买入，低位买入，你可以低位买入。因为这显示的空头压力，抓住他们你得做短线交易。这是一个宽多头通道。","pid":"p295"},{"t":"para","text":"失败的趋势线和通道线：","pid":"p296"},{"t":"para","text":"他们拥有趋势线和趋势通道线。趋势线应该包含之前的价格走势，当趋势线被突破时，这表明你的反转正在发生。这并不意味着在第一次突破时就建仓，市场通常会回测之前的极端价位，然后反转。","pid":"p297"},{"t":"img","src":"assets/img/c09_126.webp","ilabel":"C9-7","icap":"次要反转与失效","fid":"fig127","ctx":[{"t":"失败的趋势线和通道线：","p":"p296"},{"t":"他们拥有趋势线和趋势通道线。趋势线应该包含之前的价格走势，当趋势线被突破时，这表明你的反转正在发生。这并不意味着在第一次突破时就建仓，市场通常会回测之前的极端价位，然后反转。","p":"p297"},{"t":"趋势线和趋势通道线都显示看涨。这里我们看到一个多头上涨，随后是深度的回调。这些K线显示买方力量正在增强，这根K线显示多头上涨，正在测试EMA。空头们又向下了一小段，这形成了一个双底，这时你可以开始买入，并寻求多头上涨的重测点，所以这可能导致后续几个小时的横盘整理或上涨行情。","p":"p298"}]},{"t":"para","text":"趋势线和趋势通道线都显示看涨。这里我们看到一个多头上涨，随后是深度的回调。这些K线显示买方力量正在增强，这根K线显示多头上涨，正在测试EMA。空头们又向下了一小段，这形成了一个双底，这时你可以开始买入，并寻求多头上涨的重测点，所以这可能导致后续几个小时的横盘整理或上涨行情。","pid":"p298"},{"t":"img","src":"assets/img/c09_127.webp","ilabel":"C9-8","icap":"次要反转与失效","fid":"fig128","ctx":[{"t":"趋势线和趋势通道线都显示看涨。这里我们看到一个多头上涨，随后是深度的回调。这些K线显示买方力量正在增强，这根K线显示多头上涨，正在测试EMA。空头们又向下了一小段，这形成了一个双底，这时你可以开始买入，并寻求多头上涨的重测点，所以这可能导致后续几个小时的横盘整理或上涨行情。","p":"p298"},{"t":"趋势线和趋势通道线都显示看跌，所以这里我们看到一个多头上涨，随后形成了一个双顶。这个双顶形态显示的回测同时也是一个更低的高点。双顶形成后，多头就会被套牢。他们进一步买入，然后离场。多头在这里被震仓离场，空头则在之前的波动高点处做空，这足以形成下行压力，引发几波下跌。","p":"p299"},{"t":"反转失败","p":"p300"},{"t":"无论一个形态看起来多么完美，它都有可能失败。这为精明的交易者提供了一个机会，在弱势交易者设置止损的地方进行头皮交易（Scalp）。身手敏捷的交易者会将限价单（Stop order）精准地放置在“弱手”们设置保护性止损的位置，从而进行一次头皮交易。","p":"p301"}]},{"t":"para","text":"趋势线和趋势通道线都显示看跌，所以这里我们看到一个多头上涨，随后形成了一个双顶。这个双顶形态显示的回测同时也是一个更低的高点。双顶形成后，多头就会被套牢。他们进一步买入，然后离场。多头在这里被震仓离场，空头则在之前的波动高点处做空，这足以形成下行压力，引发几波下跌。","pid":"p299"},{"t":"para","text":"反转失败","pid":"p300"},{"t":"para","text":"无论一个形态看起来多么完美，它都有可能失败。这为精明的交易者提供了一个机会，在弱势交易者设置止损的地方进行头皮交易（Scalp）。身手敏捷的交易者会将限价单（Stop order）精准地放置在“弱手”们设置保护性止损的位置，从而进行一次头皮交易。","pid":"p301"},{"t":"img","src":"assets/img/c09_128.webp","ilabel":"C9-9","icap":"次要反转与失效","fid":"fig129","ctx":[{"t":"反转失败","p":"p300"},{"t":"无论一个形态看起来多么完美，它都有可能失败。这为精明的交易者提供了一个机会，在弱势交易者设置止损的地方进行头皮交易（Scalp）。身手敏捷的交易者会将限价单（Stop order）精准地放置在“弱手”们设置保护性止损的位置，从而进行一次头皮交易。","p":"p301"},{"t":"反转失败，看涨者司机短线交易。这里出现了一个跳空下跌，由三段下跌组成。手里的筹码不稳的散户会在这里做空。这会是全天空头的开端。多头知道止损单就埋伏在这里。他们会在这里进行多头短线交易。他们把买入止损单设在空头保护性止损的价位。并伺机进行多头短线交易。","p":"p302"}]},{"t":"para","text":"反转失败，看涨者司机短线交易。这里出现了一个跳空下跌，由三段下跌组成。手里的筹码不稳的散户会在这里做空。这会是全天空头的开端。多头知道止损单就埋伏在这里。他们会在这里进行多头短线交易。他们把买入止损单设在空头保护性止损的价位。并伺机进行多头短线交易。","pid":"p302"},{"t":"img","src":"assets/img/c09_129.webp","ilabel":"C9-10","icap":"次要反转与失效","fid":"fig130","ctx":[{"t":"反转失败，看涨者司机短线交易。这里出现了一个跳空下跌，由三段下跌组成。手里的筹码不稳的散户会在这里做空。这会是全天空头的开端。多头知道止损单就埋伏在这里。他们会在这里进行多头短线交易。他们把买入止损单设在空头保护性止损的价位。并伺机进行多头短线交易。","p":"p302"},{"t":"反转失败，空头伺机而动。空头们看到了这强劲的下跌走势，市场正处于一个窄幅震荡区间。多头看见EMA被突破了，并希望回测一下高点。这是第一段上涨回调，第二段上涨回调，第三段上涨，这是一个楔形顶部。那些不太强的多头会追高买入，而强势的多头则会把止损设在这里，他们知道市场很快就会回测EMA。市场有很大的抛压，这是一个楔形顶部。聪明的空头会伺机而动。","p":"p303"},{"t":"末端旗型失效，窄幅震荡区间。","p":"p304"},{"t":"市场常会形成窄幅震荡区间，预示着潜在的趋势。关键在于末端旗型通常呈水平形态。水平区域是一种双边交易的形态。末端提前构成了两段式反转。这为交易者提供了反转获利的机会。","p":"p305"}]},{"t":"para","text":"反转失败，空头伺机而动。空头们看到了这强劲的下跌走势，市场正处于一个窄幅震荡区间。多头看见EMA被突破了，并希望回测一下高点。这是第一段上涨回调，第二段上涨回调，第三段上涨，这是一个楔形顶部。那些不太强的多头会追高买入，而强势的多头则会把止损设在这里，他们知道市场很快就会回测EMA。市场有很大的抛压，这是一个楔形顶部。聪明的空头会伺机而动。","pid":"p303"},{"t":"para","text":"末端旗型失效，窄幅震荡区间。","pid":"p304"},{"t":"para","text":"市场常会形成窄幅震荡区间，预示着潜在的趋势。关键在于末端旗型通常呈水平形态。水平区域是一种双边交易的形态。末端提前构成了两段式反转。这为交易者提供了反转获利的机会。","pid":"p305"},{"t":"img","src":"assets/img/c09_130.webp","ilabel":"C9-11","icap":"次要反转与失效","fid":"fig131","ctx":[{"t":"末端旗型失效，窄幅震荡区间。","p":"p304"},{"t":"市场常会形成窄幅震荡区间，预示着潜在的趋势。关键在于末端旗型通常呈水平形态。水平区域是一种双边交易的形态。末端提前构成了两段式反转。这为交易者提供了反转获利的机会。","p":"p305"},{"t":"末端旗型失效，窄幅震荡，区间看跌","p":"p306"},{"t":"这里我们看到第一段上涨（或下跌）回调，第二段上涨（或下跌）回调，第三段上涨（或下跌）。在楔形底部，市场通常会横盘整理。这是一个窄幅的交易区间。多头们向上走了几步。","p":"p307"}]},{"t":"para","text":"末端旗型失效，窄幅震荡，区间看跌","pid":"p306"},{"t":"para","text":"这里我们看到第一段上涨（或下跌）回调，第二段上涨（或下跌）回调，第三段上涨（或下跌）。在楔形底部，市场通常会横盘整理。这是一个窄幅的交易区间。多头们向上走了几步。","pid":"p307"},{"t":"img","src":"assets/img/c09_131.webp","ilabel":"C9-12","icap":"次要反转与失效","fid":"fig132","ctx":[{"t":"末端旗型失效，窄幅震荡，区间看跌","p":"p306"},{"t":"这里我们看到第一段上涨（或下跌）回调，第二段上涨（或下跌）回调，第三段上涨（或下跌）。在楔形底部，市场通常会横盘整理。这是一个窄幅的交易区间。多头们向上走了几步。","p":"p307"},{"t":"末端旗型失败：窄幅区间看涨。这里我们看到多头们走出了第一段回踩，走出了第二段，再回踩，走出了第三段。嵌套的楔形就在这儿。空头跌破趋势线，进入了一个交易区间。多头们试图突破，但失败了。这导致空头们下跌了好几段。","p":"p308"},{"t":"末端旗型失败：猛烈的空头趋势。","p":"p309"},{"t":"末端旗型通常只有1~2根K线。他们会很快发生。K线会异常粗大。并且当他们失败时，可能会导致后续几个小时的交易方向相反。这是一个逆势的建仓形态。不是顺势入场。市场可能走到极端，然后反转。","p":"p310"}]},{"t":"para","text":"末端旗型失败：窄幅区间看涨。这里我们看到多头们走出了第一段回踩，走出了第二段，再回踩，走出了第三段。嵌套的楔形就在这儿。空头跌破趋势线，进入了一个交易区间。多头们试图突破，但失败了。这导致空头们下跌了好几段。","pid":"p308"},{"t":"para","text":"末端旗型失败：猛烈的空头趋势。","pid":"p309"},{"t":"para","text":"末端旗型通常只有1~2根K线。他们会很快发生。K线会异常粗大。并且当他们失败时，可能会导致后续几个小时的交易方向相反。这是一个逆势的建仓形态。不是顺势入场。市场可能走到极端，然后反转。","pid":"p310"},{"t":"img","src":"assets/img/c09_132.webp","ilabel":"C9-13","icap":"次要反转与失效","fid":"fig133","ctx":[{"t":"末端旗型失败：猛烈的空头趋势。","p":"p309"},{"t":"末端旗型通常只有1~2根K线。他们会很快发生。K线会异常粗大。并且当他们失败时，可能会导致后续几个小时的交易方向相反。这是一个逆势的建仓形态。不是顺势入场。市场可能走到极端，然后反转。","p":"p310"},{"t":"这里我们看到很多横盘震荡，但EMA指数移动平均线目前更像是一个阻力位。空头们完成了第一波下跌，然后回调，接着是第二波下跌，再次回调，最后是第三波下跌，成功实现突破。第三波下跌是隐藏的，那我们可以看到买盘压力正在明显增强。不，他们会在这个低点。并且他们成功反弹，随后出现了几个小时的交易行情。他们触及了之前的高点","p":"p311"},{"t":"失败的楔形。","p":"p312"},{"t":"新手交易者会在上升趋势和下降趋势中寻找楔形形态。他们常常因此亏损，因为他们急于抓住一波行情，而不是等待趋势线被突破。当出现三次推动时，就会形成一个TTR(趋势反转信号)，然而当推动力度很小时，他们很少会发生反转。交易者应该在趋势线被突破前寻找顺势入场的机会。之后再寻找楔形或反转形态。意志不坚定的交易者会试图寻找反转，结构被套牢。他们会成为顺势交易者的“燃料”。","p":"p313"}]},{"t":"para","text":"这里我们看到很多横盘震荡，但EMA指数移动平均线目前更像是一个阻力位。空头们完成了第一波下跌，然后回调，接着是第二波下跌，再次回调，最后是第三波下跌，成功实现突破。第三波下跌是隐藏的，那我们可以看到买盘压力正在明显增强。不，他们会在这个低点。并且他们成功反弹，随后出现了几个小时的交易行情。他们触及了之前的高点","pid":"p311"},{"t":"para","text":"失败的楔形。","pid":"p312"},{"t":"para","text":"新手交易者会在上升趋势和下降趋势中寻找楔形形态。他们常常因此亏损，因为他们急于抓住一波行情，而不是等待趋势线被突破。当出现三次推动时，就会形成一个TTR(趋势反转信号)，然而当推动力度很小时，他们很少会发生反转。交易者应该在趋势线被突破前寻找顺势入场的机会。之后再寻找楔形或反转形态。意志不坚定的交易者会试图寻找反转，结构被套牢。他们会成为顺势交易者的“燃料”。","pid":"p313"},{"t":"img","src":"assets/img/c09_133.webp","ilabel":"C9-14","icap":"次要反转与失效","fid":"fig134","ctx":[{"t":"失败的楔形。","p":"p312"},{"t":"新手交易者会在上升趋势和下降趋势中寻找楔形形态。他们常常因此亏损，因为他们急于抓住一波行情，而不是等待趋势线被突破。当出现三次推动时，就会形成一个TTR(趋势反转信号)，然而当推动力度很小时，他们很少会发生反转。交易者应该在趋势线被突破前寻找顺势入场的机会。之后再寻找楔形或反转形态。意志不坚定的交易者会试图寻找反转，结构被套牢。他们会成为顺势交易者的“燃料”。","p":"p313"},{"t":"失败的楔形顶部","p":"p314"},{"t":"这里有很多的楔形，但我只画出了这一个和那一个。我们这里有另一个楔形顶部和一个嵌套的楔形。如果你在这些楔形中的任何一个顶部做空，你得赶紧平仓，不然就会被套牢。在三个大的波段的末尾，第一波回调，第二波回调第三波，我们看到趋势线被跌破，伴随着下跌的一波。多头试图回测，你就也可以开始在创新高时做空。这是一次不错的短线交易。","p":"p315"}]},{"t":"para","text":"失败的楔形顶部","pid":"p314"},{"t":"para","text":"这里有很多的楔形，但我只画出了这一个和那一个。我们这里有另一个楔形顶部和一个嵌套的楔形。如果你在这些楔形中的任何一个顶部做空，你得赶紧平仓，不然就会被套牢。在三个大的波段的末尾，第一波回调，第二波回调第三波，我们看到趋势线被跌破，伴随着下跌的一波。多头试图回测，你就也可以开始在创新高时做空。这是一次不错的短线交易。","pid":"p315"},{"t":"img","src":"assets/img/c09_134.webp","ilabel":"C9-15","icap":"次要反转与失效","fid":"fig135","ctx":[{"t":"失败的楔形顶部","p":"p314"},{"t":"这里有很多的楔形，但我只画出了这一个和那一个。我们这里有另一个楔形顶部和一个嵌套的楔形。如果你在这些楔形中的任何一个顶部做空，你得赶紧平仓，不然就会被套牢。在三个大的波段的末尾，第一波回调，第二波回调第三波，我们看到趋势线被跌破，伴随着下跌的一波。多头试图回测，你就也可以开始在创新高时做空。这是一次不错的短线交易。","p":"p315"},{"t":"失败的楔形底部","p":"p316"},{"t":"这里我们有一推，二推，三推。这里有一个楔形底部，还有一个非常陡峭的楔形底部。如果你要买这个其中的任何一个，你必须迅速的剥头皮离场，否则就会被套牢。当你退出多头头寸时，你增加了卖压，多头们在此突破了趋势线，你可以看到逢低买入最终带来了多头突破。","p":"p317"},{"t":"失败的剥头皮交易：5tick失败突破和未能达到的止盈目标。","p":"p318"},{"t":"在E-mini期货里，一次剥头皮交易是4个点，当交易者挂出限价单准备离场，但市场之道理他们的入场价位却未能成交时，这表明动能正在减弱，导致交易者被震出获利交易。","p":"p319"}]},{"t":"para","text":"失败的楔形底部","pid":"p316"},{"t":"para","text":"这里我们有一推，二推，三推。这里有一个楔形底部，还有一个非常陡峭的楔形底部。如果你要买这个其中的任何一个，你必须迅速的剥头皮离场，否则就会被套牢。当你退出多头头寸时，你增加了卖压，多头们在此突破了趋势线，你可以看到逢低买入最终带来了多头突破。","pid":"p317"},{"t":"para","text":"失败的剥头皮交易：5tick失败突破和未能达到的止盈目标。","pid":"p318"},{"t":"para","text":"在E-mini期货里，一次剥头皮交易是4个点，当交易者挂出限价单准备离场，但市场之道理他们的入场价位却未能成交时，这表明动能正在减弱，导致交易者被震出获利交易。","pid":"p319"},{"t":"img","src":"assets/img/c09_135.webp","ilabel":"C9-16","icap":"次要反转与失效","fid":"fig136","ctx":[{"t":"失败的剥头皮交易：5tick失败突破和未能达到的止盈目标。","p":"p318"},{"t":"在E-mini期货里，一次剥头皮交易是4个点，当交易者挂出限价单准备离场，但市场之道理他们的入场价位却未能成交时，这表明动能正在减弱，导致交易者被震出获利交易。","p":"p319"},{"t":"这里我们看到一个空头下跌，交易者可能认为我们可以继续下跌一波。这是双向交易，他们正在做空区间的低位，空头们在这里争夺了一点利润，但由于价格之移动了5tick，他们没有成交，交易失败了。这里我们看到一个多头趋势，多头们可能会将此视为第一段回调，第二段回调，并寻求继续上涨。多头们买入这个高点，会设置一个限价单，期望获利一点。要让他们成交，市场必须上涨5ticks,超过他们的限价单，然后调头向下。市场只移动了一点。这样交易者被套，只是失去动能的迹象，将本该盈利的交易者震出局。他们不得不退出市场，随即暴跌。","p":"p320"}]},{"t":"para","text":"这里我们看到一个空头下跌，交易者可能认为我们可以继续下跌一波。这是双向交易，他们正在做空区间的低位，空头们在这里争夺了一点利润，但由于价格之移动了5tick，他们没有成交，交易失败了。这里我们看到一个多头趋势，多头们可能会将此视为第一段回调，第二段回调，并寻求继续上涨。多头们买入这个高点，会设置一个限价单，期望获利一点。要让他们成交，市场必须上涨5ticks,超过他们的限价单，然后调头向下。市场只移动了一点。这样交易者被套，只是失去动能的迹象，将本该盈利的交易者震出局。他们不得不退出市场，随即暴跌。","pid":"p320"}],"wcount":3648},{"id":"c10","title":"第10章　日内交易","icon":"10","sections":[],"blocks":[{"t":"para","text":"第10章日内交易","pid":"p321"},{"t":"para","text":"目录：选择交易品种。时间周期与图表类型。GLOBEX，盘前，盘后及隔夜交易时段。剥头皮交易，波段交易日内交易与长线投资。时刻持仓交易至少要有两个理由才能入场。止损单入场保护性止损以及被套或踏空离场。","pid":"p322"},{"t":"para","text":"选择交易品种。选择交易品种时，请考虑一个能与你共同成长的交易品种，并且能够容纳你未来所需交易的合约量。交易者们应该考虑交易spy，而不是E-mini。你在学习E-mini的价格行为时，可以承担更少的风险。E-mini微型E-mini和微型NASA都是不错的交易品种。","pid":"p323"},{"t":"para","text":"时间周期与图表类型","pid":"p324"},{"t":"para","text":"5分钟图表对很多交易者来说都很实用。剥头皮交易者可以用它来刮一个k线，而波段交易者可以用它来观察多只股票。如果你考虑使用更短的时间周期，比如3分钟或1分钟。考虑一下你是否能驾驭超过100股的快速价格变动？5分钟图表能提供更好的交易信号。","pid":"p325"},{"t":"img","src":"assets/img/c10_136.webp","ilabel":"C10-1","icap":"日内交易","fid":"fig137","ctx":[{"t":"时间周期与图表类型","p":"p324"},{"t":"5分钟图表对很多交易者来说都很实用。剥头皮交易者可以用它来刮一个k线，而波段交易者可以用它来观察多只股票。如果你考虑使用更短的时间周期，比如3分钟或1分钟。考虑一下你是否能驾驭超过100股的快速价格变动？5分钟图表能提供更好的交易信号。","p":"p325"},{"t":"所以这里我们展示的是5分钟图表，它被放大到了1分钟的级别。这个箱体就是这个箱体。你可以在这里做空，然后持有等待价格下跌几个波段，你可以在这里卖出100股，然后持有等待价格下跌几个波段。这看起来可能像是一个趋势，但就在它形成的过程中，多头却在突破。他们正在EMA上方形成大k线。空头K线正在快速反转，你是会用100股快速操作，还是会持有你的仓位？它会变成亏损的交易，或者你可以加仓摊薄成本，或者你可以反手操作。所以你可以用SPY（标普500ETF）从小额开始交易，学习如何逐步加仓亏损的交易和盈利的交易。","p":"p326"},{"t":"收盘后的回落，盘前交易，盘后交易以及隔夜市场。","p":"p327"},{"t":"价格行为适用于所有市场和所有时间周期。你可以交易ETH欧洲交易时段或RTH常规交易时段。不过最好还是专注于其中一种。盘前和隔夜的价位可能会在常规交易时段RTH内被测试。剥头皮交易，波段交易，日内交易和投资。","p":"p328"},{"t":"投资者指着那些着眼于长期的人。他们会持仓超过6个月，并且在头寸亏损时进行加仓操作。他们的持仓时间可能长达数年。交易者指那些寻求快速获利或持续几天的波段交易机会的人。交易者会快速获利了结，并将持仓移至成本价位。","p":"p329"},{"t":"时刻保持持仓。波段交易是剥头皮交易的一种替代选择。波段交易指的是持仓以博取比回调更大的行情。交易者希望尽可能长时间的留在交易市场中，为此他们应该在剥头皮交易者的目标位获利了结部分仓位，其余仓位则移至盈亏平衡点。","p":"p330"}]},{"t":"para","text":"所以这里我们展示的是5分钟图表，它被放大到了1分钟的级别。这个箱体就是这个箱体。你可以在这里做空，然后持有等待价格下跌几个波段，你可以在这里卖出100股，然后持有等待价格下跌几个波段。这看起来可能像是一个趋势，但就在它形成的过程中，多头却在突破。他们正在EMA上方形成大k线。空头K线正在快速反转，你是会用100股快速操作，还是会持有你的仓位？它会变成亏损的交易，或者你可以加仓摊薄成本，或者你可以反手操作。所以你可以用SPY（标普500ETF）从小额开始交易，学习如何逐步加仓亏损的交易和盈利的交易。","pid":"p326"},{"t":"para","text":"收盘后的回落，盘前交易，盘后交易以及隔夜市场。","pid":"p327"},{"t":"para","text":"价格行为适用于所有市场和所有时间周期。你可以交易ETH欧洲交易时段或RTH常规交易时段。不过最好还是专注于其中一种。盘前和隔夜的价位可能会在常规交易时段RTH内被测试。剥头皮交易，波段交易，日内交易和投资。","pid":"p328"},{"t":"para","text":"投资者指着那些着眼于长期的人。他们会持仓超过6个月，并且在头寸亏损时进行加仓操作。他们的持仓时间可能长达数年。交易者指那些寻求快速获利或持续几天的波段交易机会的人。交易者会快速获利了结，并将持仓移至成本价位。","pid":"p329"},{"t":"para","text":"时刻保持持仓。波段交易是剥头皮交易的一种替代选择。波段交易指的是持仓以博取比回调更大的行情。交易者希望尽可能长时间的留在交易市场中，为此他们应该在剥头皮交易者的目标位获利了结部分仓位，其余仓位则移至盈亏平衡点。","pid":"p330"},{"t":"img","src":"assets/img/c10_137.webp","ilabel":"C10-2","icap":"日内交易","fid":"fig138","ctx":[{"t":"投资者指着那些着眼于长期的人。他们会持仓超过6个月，并且在头寸亏损时进行加仓操作。他们的持仓时间可能长达数年。交易者指那些寻求快速获利或持续几天的波段交易机会的人。交易者会快速获利了结，并将持仓移至成本价位。","p":"p329"},{"t":"时刻保持持仓。波段交易是剥头皮交易的一种替代选择。波段交易指的是持仓以博取比回调更大的行情。交易者希望尽可能长时间的留在交易市场中，为此他们应该在剥头皮交易者的目标位获利了结部分仓位，其余仓位则移至盈亏平衡点。","p":"p330"},{"t":"这里展示了两种时刻保持持仓的交易的实力。波段交易者可能会选择在此处突破时买入，或者在此处突破时买入，或者在回测时买入。那就是时刻持有多头，并且他们的趋势线得到了支撑。日内交易者会认为这是在昨天高点处的失败突破。并会视为反转下跌，开始瞄准此前突破的价位。这就是空头们所遭遇的。这个市场环境对日内交易者来说一直是偏空的。而这个市场环境对波段交易者来说则一直是偏多的。","p":"p331"},{"t":"至少要有两个理由才能进场交易。交易者应该寻找两个理由来进场交易。只有一个理由是远远不够的，而且往往会导致糟糕的交易。如果你看到两个进场理由，那就大胆进场，并相信他会成功。将限价单设在你的利润目标位。有很多充分的理由可以进场交易，我个人最喜欢的两个进场理由是第一次回撤至EMA指数移动平均线以及这是一个强劲的趋势，并且突破了关键价位。","p":"p332"},{"t":"按止损价位建仓。","p":"p333"},{"t":"用止损单入场是“一路持多”交易策略的好方法。用止损单入场时，将止损设在信号K线之上一个点。一旦成交，那根K线就成了你的入场K线。有时交易者可能会被套牢。市场会先成交你的订单，然后掉头向下。","p":"p334"}]},{"t":"para","text":"这里展示了两种时刻保持持仓的交易的实力。波段交易者可能会选择在此处突破时买入，或者在此处突破时买入，或者在回测时买入。那就是时刻持有多头，并且他们的趋势线得到了支撑。日内交易者会认为这是在昨天高点处的失败突破。并会视为反转下跌，开始瞄准此前突破的价位。这就是空头们所遭遇的。这个市场环境对日内交易者来说一直是偏空的。而这个市场环境对波段交易者来说则一直是偏多的。","pid":"p331"},{"t":"para","text":"至少要有两个理由才能进场交易。交易者应该寻找两个理由来进场交易。只有一个理由是远远不够的，而且往往会导致糟糕的交易。如果你看到两个进场理由，那就大胆进场，并相信他会成功。将限价单设在你的利润目标位。有很多充分的理由可以进场交易，我个人最喜欢的两个进场理由是第一次回撤至EMA指数移动平均线以及这是一个强劲的趋势，并且突破了关键价位。","pid":"p332"},{"t":"para","text":"按止损价位建仓。","pid":"p333"},{"t":"para","text":"用止损单入场是“一路持多”交易策略的好方法。用止损单入场时，将止损设在信号K线之上一个点。一旦成交，那根K线就成了你的入场K线。有时交易者可能会被套牢。市场会先成交你的订单，然后掉头向下。","pid":"p334"},{"t":"img","src":"assets/img/c10_138.webp","ilabel":"C10-3","icap":"日内交易","fid":"fig139","ctx":[{"t":"按止损价位建仓。","p":"p333"},{"t":"用止损单入场是“一路持多”交易策略的好方法。用止损单入场时，将止损设在信号K线之上一个点。一旦成交，那根K线就成了你的入场K线。有时交易者可能会被套牢。市场会先成交你的订单，然后掉头向下。","p":"p334"},{"t":"按止损价位建仓。这是一个多头趋势，当使用止损单时，在这里你不会成交，但如果你在该K线高一档挂单进入就能成交。然后你就能顺势而为。这也是一样，你会成交，回调时持仓，然后顺势而为。挂单交易就是顺应市场，顺势交易更好。（右图）这里是区间震荡的价格行为，所以挂单交易可能会让你被套。这里如果你挂单进入，会立刻成交或反转。这里如果你认为这是一个创新高的新突破，你会立刻成交或反转，价格会跌给你看，如果你认为这是一个双底回调，这里的情况也是如此。所以在止损单上入场就是在有止损单的市场里入场。","p":"p335"},{"t":"保护性止损和被套牢后被震出局。","p":"p336"},{"t":"每笔交易都应该使用保护性止损。一个好的保护性止损设置在信号K线的上方或下方一个tick，并且在市场成交后迅速移动。如果信号K线过大，考虑使用资金止损。这是一个固定点数的保护性止损。如果你被震出市场，可以考虑在回调位设置限价单重新入场。","p":"p337"}]},{"t":"para","text":"按止损价位建仓。这是一个多头趋势，当使用止损单时，在这里你不会成交，但如果你在该K线高一档挂单进入就能成交。然后你就能顺势而为。这也是一样，你会成交，回调时持仓，然后顺势而为。挂单交易就是顺应市场，顺势交易更好。（右图）这里是区间震荡的价格行为，所以挂单交易可能会让你被套。这里如果你挂单进入，会立刻成交或反转。这里如果你认为这是一个创新高的新突破，你会立刻成交或反转，价格会跌给你看，如果你认为这是一个双底回调，这里的情况也是如此。所以在止损单上入场就是在有止损单的市场里入场。","pid":"p335"},{"t":"para","text":"保护性止损和被套牢后被震出局。","pid":"p336"},{"t":"para","text":"每笔交易都应该使用保护性止损。一个好的保护性止损设置在信号K线的上方或下方一个tick，并且在市场成交后迅速移动。如果信号K线过大，考虑使用资金止损。这是一个固定点数的保护性止损。如果你被震出市场，可以考虑在回调位设置限价单重新入场。","pid":"p337"},{"t":"img","src":"assets/img/c10_139.webp","ilabel":"C10-4","icap":"日内交易","fid":"fig140","ctx":[{"t":"保护性止损和被套牢后被震出局。","p":"p336"},{"t":"每笔交易都应该使用保护性止损。一个好的保护性止损设置在信号K线的上方或下方一个tick，并且在市场成交后迅速移动。如果信号K线过大，考虑使用资金止损。这是一个固定点数的保护性止损。如果你被震出市场，可以考虑在回调位设置限价单重新入场。","p":"p337"},{"t":"保护性止损和被套牢或被震出局。在这里如果你想买入这个牛旗，你会在这个K线之上一个点位入场，并把你的止损单放在这里。市场成交了你的订单。假设你错过了这次突破，但你看到了这个双底牛旗。这些影线显示了这里的支撑，你可以设置一个限价单放在这里。如果这个风险对你来说太大了，你可以使用5个点的止损。就像我在这笔交易中做的那样，我们在低点成交，止损点位可以是这里，这里，这里或者这里。如果需要承担的点数太多，你可以设置一个5个点的止损，就在这里。","p":"p338"}]},{"t":"para","text":"保护性止损和被套牢或被震出局。在这里如果你想买入这个牛旗，你会在这个K线之上一个点位入场，并把你的止损单放在这里。市场成交了你的订单。假设你错过了这次突破，但你看到了这个双底牛旗。这些影线显示了这里的支撑，你可以设置一个限价单放在这里。如果这个风险对你来说太大了，你可以使用5个点的止损。就像我在这笔交易中做的那样，我们在低点成交，止损点位可以是这里，这里，这里或者这里。如果需要承担的点数太多，你可以设置一个5个点的止损，就在这里。","pid":"p338"}],"wcount":1991},{"id":"c11","title":"第11章　开盘第一小时","icon":"11","sections":[],"blocks":[{"t":"para","text":"第十一章 开盘首小时","pid":"p339"},{"t":"para","text":"目录：与昨日盘前形态相关的盘前形态。跳空开盘的趋势K线。开盘首根或次根K线的反转与延续。开盘趋势或首根K线趋势。日内第三根K线在15-16分钟收盘。开盘首小时的强劲趋势K线预示当日后续同向强势。开盘形态与反转。双重底部和双重顶部形态。交易区间突破。首次回调。","pid":"p340"},{"t":"para","text":"盘前交易相关的形态。","pid":"p341"},{"t":"para","text":"在决定交易哪个图表时，是选择盘前时段还是常规交易时段？最好只选择一个，并坚持交易。开盘时快速分析两个图表会很困难。开盘节奏很快，交易者应该接受错过偶发的交易信号。","pid":"p342"},{"t":"img","src":"assets/img/c11_140.webp","ilabel":"C11-1","icap":"开盘第一小时","fid":"fig141","ctx":[{"t":"盘前交易相关的形态。","p":"p341"},{"t":"在决定交易哪个图表时，是选择盘前时段还是常规交易时段？最好只选择一个，并坚持交易。开盘时快速分析两个图表会很困难。开盘节奏很快，交易者应该接受错过偶发的交易信号。","p":"p342"},{"t":"这是盘前时段这个黑色的盒子，然后这是常规交易时段。这里有几个交易信号，但也很容易被行情震荡洗盘，而且这个交易区间非常窄。","p":"p343"}]},{"t":"para","text":"这是盘前时段这个黑色的盒子，然后这是常规交易时段。这里有几个交易信号，但也很容易被行情震荡洗盘，而且这个交易区间非常窄。","pid":"p343"},{"t":"img","src":"assets/img/c11_141.webp","ilabel":"C11-2","icap":"开盘第一小时","fid":"fig142","ctx":[{"t":"这是盘前时段这个黑色的盒子，然后这是常规交易时段。这里有几个交易信号，但也很容易被行情震荡洗盘，而且这个交易区间非常窄。","p":"p343"},{"t":"交易信号在这里，我们可以选择买入均线支撑，逢低买入或者在均线处做空。如果你要做逆势交易，你必须快速做短线交易，以防行情突然反转让你被套。这里有一个在支撑位做空的绝佳机会，之后你也可以选择买入。这是非常震荡反复的价格走势，如果你看这里行情先是急速，然后横盘整理，接着再次急速又横盘。","p":"p344"}]},{"t":"para","text":"交易信号在这里，我们可以选择买入均线支撑，逢低买入或者在均线处做空。如果你要做逆势交易，你必须快速做短线交易，以防行情突然反转让你被套。这里有一个在支撑位做空的绝佳机会，之后你也可以选择买入。这是非常震荡反复的价格走势，如果你看这里行情先是急速，然后横盘整理，接着再次急速又横盘。","pid":"p344"},{"t":"img","src":"assets/img/c11_142.webp","ilabel":"C11-3","icap":"开盘第一小时","fid":"fig143","ctx":[{"t":"交易信号在这里，我们可以选择买入均线支撑，逢低买入或者在均线处做空。如果你要做逆势交易，你必须快速做短线交易，以防行情突然反转让你被套。这里有一个在支撑位做空的绝佳机会，之后你也可以选择买入。这是非常震荡反复的价格走势，如果你看这里行情先是急速，然后横盘整理，接着再次急速又横盘。","p":"p344"},{"t":"与常规交易时段相比，在常规交易时段买入均线支撑或者买入突破行情会更倾向于容易。所以在常规交易时段，你应该可以接受错过那些更难的交易，去抓住那些更容易的交易。","p":"p345"},{"t":"与昨日价格行为相关的模式。","p":"p346"},{"t":"开盘1小时内的交易都与昨日的价格行为模式有关。昨日的突破，突破失败以及反转，可能在开盘1小时内完成。有时这些价格行为模式会发展到当天的极端。日线图交易者会在昨日的高低点和收盘价附近下单，这就使得这些关键价位非常重要。","p":"p347"}]},{"t":"para","text":"与常规交易时段相比，在常规交易时段买入均线支撑或者买入突破行情会更倾向于容易。所以在常规交易时段，你应该可以接受错过那些更难的交易，去抓住那些更容易的交易。","pid":"p345"},{"t":"para","text":"与昨日价格行为相关的模式。","pid":"p346"},{"t":"para","text":"开盘1小时内的交易都与昨日的价格行为模式有关。昨日的突破，突破失败以及反转，可能在开盘1小时内完成。有时这些价格行为模式会发展到当天的极端。日线图交易者会在昨日的高低点和收盘价附近下单，这就使得这些关键价位非常重要。","pid":"p347"},{"t":"img","src":"assets/img/c11_143.webp","ilabel":"C11-4","icap":"开盘第一小时","fid":"fig144","ctx":[{"t":"与昨日价格行为相关的模式。","p":"p346"},{"t":"开盘1小时内的交易都与昨日的价格行为模式有关。昨日的突破，突破失败以及反转，可能在开盘1小时内完成。有时这些价格行为模式会发展到当天的极端。日线图交易者会在昨日的高低点和收盘价附近下单，这就使得这些关键价位非常重要。","p":"p347"},{"t":"与昨日价格行为相关的模式。这里我们看到一个楔形底部。发生在昨日价格行为的初期。然后出现了一个突破。一波深度回调，然后今天这里的这条线是分界线，出现了一个跳空上涨。价格回落至美EMA指数移动平均线，该均线充当了支撑。昨天形成的这条趋势线在今天依然有效。在收盘时得到了支撑。","p":"p348"}]},{"t":"para","text":"与昨日价格行为相关的模式。这里我们看到一个楔形底部。发生在昨日价格行为的初期。然后出现了一个突破。一波深度回调，然后今天这里的这条线是分界线，出现了一个跳空上涨。价格回落至美EMA指数移动平均线，该均线充当了支撑。昨天形成的这条趋势线在今天依然有效。在收盘时得到了支撑。","pid":"p348"},{"t":"img","src":"assets/img/c11_144.webp","ilabel":"C11-5","icap":"开盘第一小时","fid":"fig145","ctx":[{"t":"与昨日价格行为相关的模式。这里我们看到一个楔形底部。发生在昨日价格行为的初期。然后出现了一个突破。一波深度回调，然后今天这里的这条线是分界线，出现了一个跳空上涨。价格回落至美EMA指数移动平均线，该均线充当了支撑。昨天形成的这条趋势线在今天依然有效。在收盘时得到了支撑。","p":"p348"},{"t":"这里有一个形态也和昨天一样，但昨天是震荡区间，所以昨天主要是震荡日伴随小幅抛售。在支撑位出现了一根大反转K线后续走势不明，继续横盘。这里有三波上涨，第一波回调，第二波回调。但回调幅度很大。所以它更像是横盘整理，而不是单边上涨，每次创新高都伴随着新低。所以在这个区间交易，一旦被套。昨天的价格行为能提供一些帮助。","p":"p349"},{"t":"跳空开盘时的趋势K线","p":"p350"},{"t":"通常是第一或第二根K线。当出现跳空开盘且第一根K线是趋势K线时，这可能引发一波行情。即使开盘时没有跳空，开盘形成的趋势K线可能会持续下去，为一次不错的交易做好准备。如果出现跳空交易，成功的几率会增加。他之所以更有可能成功，是因为市场已经超出了正常范围。","p":"p351"}]},{"t":"para","text":"这里有一个形态也和昨天一样，但昨天是震荡区间，所以昨天主要是震荡日伴随小幅抛售。在支撑位出现了一根大反转K线后续走势不明，继续横盘。这里有三波上涨，第一波回调，第二波回调。但回调幅度很大。所以它更像是横盘整理，而不是单边上涨，每次创新高都伴随着新低。所以在这个区间交易，一旦被套。昨天的价格行为能提供一些帮助。","pid":"p349"},{"t":"para","text":"跳空开盘时的趋势K线","pid":"p350"},{"t":"para","text":"通常是第一或第二根K线。当出现跳空开盘且第一根K线是趋势K线时，这可能引发一波行情。即使开盘时没有跳空，开盘形成的趋势K线可能会持续下去，为一次不错的交易做好准备。如果出现跳空交易，成功的几率会增加。他之所以更有可能成功，是因为市场已经超出了正常范围。","pid":"p351"},{"t":"img","src":"assets/img/c11_145.webp","ilabel":"C11-6","icap":"开盘第一小时","fid":"fig146","ctx":[{"t":"跳空开盘时的趋势K线","p":"p350"},{"t":"通常是第一或第二根K线。当出现跳空开盘且第一根K线是趋势K线时，这可能引发一波行情。即使开盘时没有跳空，开盘形成的趋势K线可能会持续下去，为一次不错的交易做好准备。如果出现跳空交易，成功的几率会增加。他之所以更有可能成功，是因为市场已经超出了正常范围。","p":"p351"},{"t":"跳空开盘时的趋势K线通常是第一根和第二根K线。趋势K线是指实体部分比影线部分更长的K线，比如这根黑色的K线。那是一根趋势K线。然后你看这个K线，那就算是一个区间K线。所以当我们看到开盘时出现趋势K线就在这里我可以寻找趋势，这里行情延续，然后出现了一个回调，价格先是反转下跌，然后全天都在走弱。","p":"p352"},{"t":"跳空开盘反转和趋势延续。","p":"p353"},{"t":"开盘时的巨幅跳空表明了市场的极端情绪。这种跳空可能引发趋势延续和价格反转，跳空的涨跌方向并不能决定后续趋势的方向。跳空后的走势可能延续，也可能反转。开盘初期的几根K线能帮助我们判断市场动向。有时需要一个小时跳空开盘的趋势才能显现。","p":"p354"}]},{"t":"para","text":"跳空开盘时的趋势K线通常是第一根和第二根K线。趋势K线是指实体部分比影线部分更长的K线，比如这根黑色的K线。那是一根趋势K线。然后你看这个K线，那就算是一个区间K线。所以当我们看到开盘时出现趋势K线就在这里我可以寻找趋势，这里行情延续，然后出现了一个回调，价格先是反转下跌，然后全天都在走弱。","pid":"p352"},{"t":"para","text":"跳空开盘反转和趋势延续。","pid":"p353"},{"t":"para","text":"开盘时的巨幅跳空表明了市场的极端情绪。这种跳空可能引发趋势延续和价格反转，跳空的涨跌方向并不能决定后续趋势的方向。跳空后的走势可能延续，也可能反转。开盘初期的几根K线能帮助我们判断市场动向。有时需要一个小时跳空开盘的趋势才能显现。","pid":"p354"},{"t":"img","src":"assets/img/c11_146.webp","ilabel":"C11-7","icap":"开盘第一小时","fid":"fig147","ctx":[{"t":"跳空开盘反转和趋势延续。","p":"p353"},{"t":"开盘时的巨幅跳空表明了市场的极端情绪。这种跳空可能引发趋势延续和价格反转，跳空的涨跌方向并不能决定后续趋势的方向。跳空后的走势可能延续，也可能反转。开盘初期的几根K线能帮助我们判断市场动向。有时需要一个小时跳空开盘的趋势才能显现。","p":"p354"},{"t":"跳空高开看涨信号，这是个反转。巨幅跳空低开，并且延续下跌。但随后多头收出了一个更高的低点，这同时也是一个头肩顶突破了EMA，并且全天趋势走高。尾盘的极端价格行为极具爆发力。所以跳空开盘是看跌的。你有一个跳空上涨，但收出了一根空头K线。也许你期待这两根多头K线能延续涨势啊，最后看看这根K线。强劲突破了更高时间周期的EMA，并延续到了低时间周期。我们横盘整理，形成了一个双顶熊旗。所以这可能是1小时左右的横盘整理。我觉得你现在还可以做空并继续持有，也许你可以先出来，再重新做空，这样就能抓住趋势了。开盘趋势或首根K线趋势","p":"p355"},{"t":"有时候如果第一根K线是趋势K线，它可能会成为当天的最高价和最低价。这根K线可能会引领一波趋势。如果市场先是横盘整理，然后再开盘时出现趋势，这仍然可以算作是开盘趋势。这种横盘的走势可能只是一个回调。","p":"p356"}]},{"t":"para","text":"跳空高开看涨信号，这是个反转。巨幅跳空低开，并且延续下跌。但随后多头收出了一个更高的低点，这同时也是一个头肩顶突破了EMA，并且全天趋势走高。尾盘的极端价格行为极具爆发力。所以跳空开盘是看跌的。你有一个跳空上涨，但收出了一根空头K线。也许你期待这两根多头K线能延续涨势啊，最后看看这根K线。强劲突破了更高时间周期的EMA，并延续到了低时间周期。我们横盘整理，形成了一个双顶熊旗。所以这可能是1小时左右的横盘整理。我觉得你现在还可以做空并继续持有，也许你可以先出来，再重新做空，这样就能抓住趋势了。开盘趋势或首根K线趋势","pid":"p355"},{"t":"para","text":"有时候如果第一根K线是趋势K线，它可能会成为当天的最高价和最低价。这根K线可能会引领一波趋势。如果市场先是横盘整理，然后再开盘时出现趋势，这仍然可以算作是开盘趋势。这种横盘的走势可能只是一个回调。","pid":"p356"},{"t":"img","src":"assets/img/c11_147.webp","ilabel":"C11-8","icap":"开盘第一小时","fid":"fig148","ctx":[{"t":"跳空高开看涨信号，这是个反转。巨幅跳空低开，并且延续下跌。但随后多头收出了一个更高的低点，这同时也是一个头肩顶突破了EMA，并且全天趋势走高。尾盘的极端价格行为极具爆发力。所以跳空开盘是看跌的。你有一个跳空上涨，但收出了一根空头K线。也许你期待这两根多头K线能延续涨势啊，最后看看这根K线。强劲突破了更高时间周期的EMA，并延续到了低时间周期。我们横盘整理，形成了一个双顶熊旗。所以这可能是1小时左右的横盘整理。我觉得你现在还可以做空并继续持有，也许你可以先出来，再重新做空，这样就能抓住趋势了。开盘趋势或首根K线趋势","p":"p355"},{"t":"有时候如果第一根K线是趋势K线，它可能会成为当天的最高价和最低价。这根K线可能会引领一波趋势。如果市场先是横盘整理，然后再开盘时出现趋势，这仍然可以算作是开盘趋势。这种横盘的走势可能只是一个回调。","p":"p356"},{"t":"市场跳空高开，并且持续了一段时间，但随后横盘了大约30分钟。在这里我们看到多头们冲高，然后被抛售，然后回调至均线附近，这样一来，那些被套的交易者就会在更低的位置买入，从而启动了趋势，我们实现突破，并开启了全天的上涨行情。我们可以看到昨天多头们也在EMA附近买入了，所以当一天刚开始的时候开盘时我们应该持看涨观点，或者至少考虑看涨。我们不一定要市价买入，但我们没有这样做空，做空这些疲软的空头K线会是不错的选择。","p":"p357"},{"t":"第三根K线收盘，也就是15分钟的收盘。","p":"p358"},{"t":"当5分钟图上的第三根K线形成后，这就构成了15分钟的第一根K线。这可能会在当日第三根K线附近引发一些价格波动。这并不是说要围绕当天的第三根K线来构建交易，但这可能有一些值得关注的地方。如果当天前两根K线都是看跌的，而第三根K线是十字星。","p":"p359"}]},{"t":"para","text":"市场跳空高开，并且持续了一段时间，但随后横盘了大约30分钟。在这里我们看到多头们冲高，然后被抛售，然后回调至均线附近，这样一来，那些被套的交易者就会在更低的位置买入，从而启动了趋势，我们实现突破，并开启了全天的上涨行情。我们可以看到昨天多头们也在EMA附近买入了，所以当一天刚开始的时候开盘时我们应该持看涨观点，或者至少考虑看涨。我们不一定要市价买入，但我们没有这样做空，做空这些疲软的空头K线会是不错的选择。","pid":"p357"},{"t":"para","text":"第三根K线收盘，也就是15分钟的收盘。","pid":"p358"},{"t":"para","text":"当5分钟图上的第三根K线形成后，这就构成了15分钟的第一根K线。这可能会在当日第三根K线附近引发一些价格波动。这并不是说要围绕当天的第三根K线来构建交易，但这可能有一些值得关注的地方。如果当天前两根K线都是看跌的，而第三根K线是十字星。","pid":"p359"},{"t":"img","src":"assets/img/c11_148.webp","ilabel":"C11-9","icap":"开盘第一小时","fid":"fig149","ctx":[{"t":"第三根K线收盘，也就是15分钟的收盘。","p":"p358"},{"t":"当5分钟图上的第三根K线形成后，这就构成了15分钟的第一根K线。这可能会在当日第三根K线附近引发一些价格波动。这并不是说要围绕当天的第三根K线来构建交易，但这可能有一些值得关注的地方。如果当天前两根K线都是看跌的，而第三根K线是十字星。","p":"p359"},{"t":"所以我想展示一下我们该如何看15分钟图。5分钟和15分钟图的对比，这些都是相同的图表。这条红线和这个红色的，所以这是第一根K线，这是第三根K线。这是第2根K线，这是它的高点和低点。所以第一根K线的低点和第二根K线的高点会形成这个十字星。因为第三根K线是内包K线，所以没有极端行情。所以到了第6根K线，当第6根K线出现时，我们现在看的是这个十字星，抱歉，是看这个K线。这是第四根K线的低点和第5根K线的高点，而第6根K线是内包K线。所以这条蓝线和那两条蓝线是重合的。所以15分钟图表呈现的是一个震荡日，并且在价格行为中我们看到了更多的震荡区间。5分钟图表也是如此，同样是震荡行情，价格行为更偏横盘整理，并且这里呈现出更强的震荡特征。","p":"p360"},{"t":"第一个小时出现了强劲的趋势K线","p":"p361"},{"t":"开盘时的强劲K线可能带来好的波段交易机会。这种情况最常见于跳空开盘。如果开盘头几根K线开始反转了，当天第一根K线就可能成为极端走势。如果市场在开盘时出现回撤，这可能形成一个双顶或双底，然后朝缺口方向形成一波行情。","p":"p362"}]},{"t":"para","text":"所以我想展示一下我们该如何看15分钟图。5分钟和15分钟图的对比，这些都是相同的图表。这条红线和这个红色的，所以这是第一根K线，这是第三根K线。这是第2根K线，这是它的高点和低点。所以第一根K线的低点和第二根K线的高点会形成这个十字星。因为第三根K线是内包K线，所以没有极端行情。所以到了第6根K线，当第6根K线出现时，我们现在看的是这个十字星，抱歉，是看这个K线。这是第四根K线的低点和第5根K线的高点，而第6根K线是内包K线。所以这条蓝线和那两条蓝线是重合的。所以15分钟图表呈现的是一个震荡日，并且在价格行为中我们看到了更多的震荡区间。5分钟图表也是如此，同样是震荡行情，价格行为更偏横盘整理，并且这里呈现出更强的震荡特征。","pid":"p360"},{"t":"para","text":"第一个小时出现了强劲的趋势K线","pid":"p361"},{"t":"para","text":"开盘时的强劲K线可能带来好的波段交易机会。这种情况最常见于跳空开盘。如果开盘头几根K线开始反转了，当天第一根K线就可能成为极端走势。如果市场在开盘时出现回撤，这可能形成一个双顶或双底，然后朝缺口方向形成一波行情。","pid":"p362"},{"t":"img","src":"assets/img/c11_149.webp","ilabel":"C11-10","icap":"开盘第一小时","fid":"fig150","ctx":[{"t":"第一个小时出现了强劲的趋势K线","p":"p361"},{"t":"开盘时的强劲K线可能带来好的波段交易机会。这种情况最常见于跳空开盘。如果开盘头几根K线开始反转了，当天第一根K线就可能成为极端走势。如果市场在开盘时出现回撤，这可能形成一个双顶或双底，然后朝缺口方向形成一波行情。","p":"p362"},{"t":"强劲的趋势K线，看涨。所以我想展示一下这个双底。我看到了一个跳空下跌。强劲的趋势K线是看跌的，但没有延续在这里高位做空的空头选择在此处离场。当空头回补空单，多头买入双底，这足以启动趋势。","p":"p363"}]},{"t":"para","text":"强劲的趋势K线，看涨。所以我想展示一下这个双底。我看到了一个跳空下跌。强劲的趋势K线是看跌的，但没有延续在这里高位做空的空头选择在此处离场。当空头回补空单，多头买入双底，这足以启动趋势。","pid":"p363"},{"t":"img","src":"assets/img/c11_150.webp","ilabel":"C11-11","icap":"开盘第一小时","fid":"fig151","ctx":[{"t":"强劲的趋势K线，看涨。所以我想展示一下这个双底。我看到了一个跳空下跌。强劲的趋势K线是看跌的，但没有延续在这里高位做空的空头选择在此处离场。当空头回补空单，多头买入双底，这足以启动趋势。","p":"p363"},{"t":"强劲的趋势K线，看跌。所以我们这里看到了一个跳空上涨以及一个失败。这对想买入的多头来说相当不利，但他们却没有买。我们没看到任何看涨的K线，然后价格回落到EMA指数移动平均线后进入横盘整理。在横盘价格行为之后，价格突破了交易区间，并在当天剩余的时间里持续下跌。","p":"p364"},{"t":"开盘模式与反转","p":"p365"},{"t":"开盘时的行情可能波动更快，不过他们仍应按照其他价格行为模式来处理。有时市场会延续前一天的极端走势，然后反转。这看起来可能像是突破，但实际上可能导致在相反方向出现一波不错的反转行情。","p":"p366"}]},{"t":"para","text":"强劲的趋势K线，看跌。所以我们这里看到了一个跳空上涨以及一个失败。这对想买入的多头来说相当不利，但他们却没有买。我们没看到任何看涨的K线，然后价格回落到EMA指数移动平均线后进入横盘整理。在横盘价格行为之后，价格突破了交易区间，并在当天剩余的时间里持续下跌。","pid":"p364"},{"t":"para","text":"开盘模式与反转","pid":"p365"},{"t":"para","text":"开盘时的行情可能波动更快，不过他们仍应按照其他价格行为模式来处理。有时市场会延续前一天的极端走势，然后反转。这看起来可能像是突破，但实际上可能导致在相反方向出现一波不错的反转行情。","pid":"p366"},{"t":"img","src":"assets/img/c11_151.webp","ilabel":"C11-12","icap":"开盘第一小时","fid":"fig152","ctx":[{"t":"开盘模式与反转","p":"p365"},{"t":"开盘时的行情可能波动更快，不过他们仍应按照其他价格行为模式来处理。有时市场会延续前一天的极端走势，然后反转。这看起来可能像是突破，但实际上可能导致在相反方向出现一波不错的反转行情。","p":"p366"},{"t":"开盘模式与反转看涨。所以这里我们看到大幅跳空高开，随后大幅下跌，急剧向上反转。我觉得很多空头被套牢了。这根K线看起来足以让多头买入。并且价格上涨了两段。非常深的回调，然后进入区间震荡，价格行为更偏向看涨。","p":"p367"}]},{"t":"para","text":"开盘模式与反转看涨。所以这里我们看到大幅跳空高开，随后大幅下跌，急剧向上反转。我觉得很多空头被套牢了。这根K线看起来足以让多头买入。并且价格上涨了两段。非常深的回调，然后进入区间震荡，价格行为更偏向看涨。","pid":"p367"},{"t":"img","src":"assets/img/c11_152.webp","ilabel":"C11-13","icap":"开盘第一小时","fid":"fig153","ctx":[{"t":"开盘模式与反转看涨。所以这里我们看到大幅跳空高开，随后大幅下跌，急剧向上反转。我觉得很多空头被套牢了。这根K线看起来足以让多头买入。并且价格上涨了两段。非常深的回调，然后进入区间震荡，价格行为更偏向看涨。","p":"p367"},{"t":"开盘形态和看跌反转。这里我们有一个多头趋势。急剧下跌了两段，第一段下跌回调，第二段下跌回落至EMA均线。第二天，出现了一根带有巨大抛售的十字星K线，多头因此反弹，而空头则选择了做空。我认为多头在第二根K线时被套住了。并且没有看到后续的延续性，他们退出了多头头寸，这形成了一个双顶。空头在高位抛售，多头也在高位抛售，这形成了一个非常强劲的趋势，第一段上涨回调，第二段上涨回调，第三段上涨。","p":"p368"},{"t":"双底和双顶形态","p":"p369"},{"t":"双底和双顶表明市场两次尝试朝同一方向移动，但都失败了。双底和双顶可以被视为反转形态。然而在趋势行情中，他们是顺势交易。他们在行情启动后形成。","p":"p370"}]},{"t":"para","text":"开盘形态和看跌反转。这里我们有一个多头趋势。急剧下跌了两段，第一段下跌回调，第二段下跌回落至EMA均线。第二天，出现了一根带有巨大抛售的十字星K线，多头因此反弹，而空头则选择了做空。我认为多头在第二根K线时被套住了。并且没有看到后续的延续性，他们退出了多头头寸，这形成了一个双顶。空头在高位抛售，多头也在高位抛售，这形成了一个非常强劲的趋势，第一段上涨回调，第二段上涨回调，第三段上涨。","pid":"p368"},{"t":"para","text":"双底和双顶形态","pid":"p369"},{"t":"para","text":"双底和双顶表明市场两次尝试朝同一方向移动，但都失败了。双底和双顶可以被视为反转形态。然而在趋势行情中，他们是顺势交易。他们在行情启动后形成。","pid":"p370"},{"t":"img","src":"assets/img/c11_153.webp","ilabel":"C11-14","icap":"开盘第一小时","fid":"fig154","ctx":[{"t":"双底和双顶形态","p":"p369"},{"t":"双底和双顶表明市场两次尝试朝同一方向移动，但都失败了。双底和双顶可以被视为反转形态。然而在趋势行情中，他们是顺势交易。他们在行情启动后形成。","p":"p370"},{"t":"这里是第一次突破和一次回撤。如果你错过了这些交易中的任何一个，这里在均线上有一个双底，你可以入场。一个双底看涨旗型，我实际上是实盘操作了，这笔交易也很好，因为空头他们会在这里被套牢，他们在这里止损离场。他们回补空头头寸，然后价格就开始上涨。","p":"p371"},{"t":"这是另一种形态的双底，但这更像是一次回测。这里还有一个双底。这是一个区间震荡的双底，重要的是买入双底，而不是做空他们以为他会反转至EMA。","p":"p372"}]},{"t":"para","text":"这里是第一次突破和一次回撤。如果你错过了这些交易中的任何一个，这里在均线上有一个双底，你可以入场。一个双底看涨旗型，我实际上是实盘操作了，这笔交易也很好，因为空头他们会在这里被套牢，他们在这里止损离场。他们回补空头头寸，然后价格就开始上涨。","pid":"p371"},{"t":"para","text":"这是另一种形态的双底，但这更像是一次回测。这里还有一个双底。这是一个区间震荡的双底，重要的是买入双底，而不是做空他们以为他会反转至EMA。","pid":"p372"},{"t":"img","src":"assets/img/c11_154.webp","ilabel":"C11-15","icap":"开盘第一小时","fid":"fig155","ctx":[{"t":"这里是第一次突破和一次回撤。如果你错过了这些交易中的任何一个，这里在均线上有一个双底，你可以入场。一个双底看涨旗型，我实际上是实盘操作了，这笔交易也很好，因为空头他们会在这里被套牢，他们在这里止损离场。他们回补空头头寸，然后价格就开始上涨。","p":"p371"},{"t":"这是另一种形态的双底，但这更像是一次回测。这里还有一个双底。这是一个区间震荡的双底，重要的是买入双底，而不是做空他们以为他会反转至EMA。","p":"p372"},{"t":"双顶形态的旗型。这是一个为期两天的旗型。我们有一个大的跳空下跌。回调，这是第一次回调，然后价格下跌，第二天我们有一个大的跳空上涨，然后这是一个更低的高点，价格未能达到前一天的最高价，形成了双顶。所以这里是抛售和双顶。回调，双顶，抛售。所以多头在第一个顶部买入。他们买在更低的位置，他买的更多，抱歉，他们在这里买，他们在这里买。他们纷纷离场，制造了巨大的抛压，导致价格连续下跌。在这根K线中被套的多头在这根K线里继续加仓，然后他们在这里做短线交易，获利了结。这进一步加剧了抛压。我觉得这波操作很精彩，这是一个非常好的分形价格行为的例子，展示了如何在更大周期和5分钟图上双顶形态是如何发挥作用的。","p":"p373"},{"t":"交易区间突破","p":"p374"},{"t":"有时候，市场在开盘时可能会形成一个交易区间，如果这个交易区间的平均K线宽度比平时要窄，这可能会导致突破。你可以选择逆势交易，也可以等到突破后再入场。","p":"p375"}]},{"t":"para","text":"双顶形态的旗型。这是一个为期两天的旗型。我们有一个大的跳空下跌。回调，这是第一次回调，然后价格下跌，第二天我们有一个大的跳空上涨，然后这是一个更低的高点，价格未能达到前一天的最高价，形成了双顶。所以这里是抛售和双顶。回调，双顶，抛售。所以多头在第一个顶部买入。他们买在更低的位置，他买的更多，抱歉，他们在这里买，他们在这里买。他们纷纷离场，制造了巨大的抛压，导致价格连续下跌。在这根K线中被套的多头在这根K线里继续加仓，然后他们在这里做短线交易，获利了结。这进一步加剧了抛压。我觉得这波操作很精彩，这是一个非常好的分形价格行为的例子，展示了如何在更大周期和5分钟图上双顶形态是如何发挥作用的。","pid":"p373"},{"t":"para","text":"交易区间突破","pid":"p374"},{"t":"para","text":"有时候，市场在开盘时可能会形成一个交易区间，如果这个交易区间的平均K线宽度比平时要窄，这可能会导致突破。你可以选择逆势交易，也可以等到突破后再入场。","pid":"p375"},{"t":"img","src":"assets/img/c11_155.webp","ilabel":"C11-16","icap":"开盘第一小时","fid":"fig156","ctx":[{"t":"交易区间突破","p":"p374"},{"t":"有时候，市场在开盘时可能会形成一个交易区间，如果这个交易区间的平均K线宽度比平时要窄，这可能会导致突破。你可以选择逆势交易，也可以等到突破后再入场。","p":"p375"},{"t":"这里出现了一个跳空上涨，市场横盘整理了大约两三个小时。你可以卖出强劲的多头K线，买入强劲的空头K线，或者你可以等待突破后进行回测。这里市场突破了EMA，回测了一下就继续走了。","p":"p376"}]},{"t":"para","text":"这里出现了一个跳空上涨，市场横盘整理了大约两三个小时。你可以卖出强劲的多头K线，买入强劲的空头K线，或者你可以等待突破后进行回测。这里市场突破了EMA，回测了一下就继续走了。","pid":"p376"},{"t":"img","src":"assets/img/c11_156.webp","ilabel":"C11-17","icap":"开盘第一小时","fid":"fig157","ctx":[{"t":"这里出现了一个跳空上涨，市场横盘整理了大约两三个小时。你可以卖出强劲的多头K线，买入强劲的空头K线，或者你可以等待突破后进行回测。这里市场突破了EMA，回测了一下就继续走了。","p":"p376"},{"t":"交易区间突破看跌，这里是一个交易区间，原理也是一样的。你可以做空强劲的多头K线，然后快速获利了结，或者买入空头K线。如果你被套在这个交易模式里，我们可以借鉴之前的经验，看看前一天的收盘价，昨天也是一个震荡区间。昨天的波动高点被多次尝试触及。因此这里有多个做空汇聚点，可以避免被震荡。","p":"p377"},{"t":"第一次回调","p":"p378"},{"t":"趋势中的第一次回调是一个可靠的交易机会，并可能开启第二波上涨。强劲的趋势应该有2~3段行情。在第一次回调时入场，表明市场已经朝你的方向运行了。如果你错过了开盘的趋势，第一次回撤是入场的绝佳时机。","p":"p379"}]},{"t":"para","text":"交易区间突破看跌，这里是一个交易区间，原理也是一样的。你可以做空强劲的多头K线，然后快速获利了结，或者买入空头K线。如果你被套在这个交易模式里，我们可以借鉴之前的经验，看看前一天的收盘价，昨天也是一个震荡区间。昨天的波动高点被多次尝试触及。因此这里有多个做空汇聚点，可以避免被震荡。","pid":"p377"},{"t":"para","text":"第一次回调","pid":"p378"},{"t":"para","text":"趋势中的第一次回调是一个可靠的交易机会，并可能开启第二波上涨。强劲的趋势应该有2~3段行情。在第一次回调时入场，表明市场已经朝你的方向运行了。如果你错过了开盘的趋势，第一次回撤是入场的绝佳时机。","pid":"p379"},{"t":"img","src":"assets/img/c11_157.webp","ilabel":"C11-18","icap":"开盘第一小时","fid":"fig158","ctx":[{"t":"第一次回调","p":"p378"},{"t":"趋势中的第一次回调是一个可靠的交易机会，并可能开启第二波上涨。强劲的趋势应该有2~3段行情。在第一次回调时入场，表明市场已经朝你的方向运行了。如果你错过了开盘的趋势，第一次回撤是入场的绝佳时机。","p":"p379"},{"t":"这也是刚才的同一个例子，开盘后出现强劲趋势突破，然后是回调旗型。又一次上涨，然后是回调。在第一次回调时可以入场，博取下一段上涨行情。第一次回调具有分形特征，例如这里是一个EMA突破，紧接着就是一次第一次回撤，所以你也可以在这个K线买入，然后抓住这一波行情。或者你可以看到这一波行情，并将其作为第一次回撤时买入。然后他们有第二波和第三波行情，就非常具有爆发性。","p":"p380"}]},{"t":"para","text":"这也是刚才的同一个例子，开盘后出现强劲趋势突破，然后是回调旗型。又一次上涨，然后是回调。在第一次回调时可以入场，博取下一段上涨行情。第一次回调具有分形特征，例如这里是一个EMA突破，紧接着就是一次第一次回撤，所以你也可以在这个K线买入，然后抓住这一波行情。或者你可以看到这一波行情，并将其作为第一次回撤时买入。然后他们有第二波和第三波行情，就非常具有爆发性。","pid":"p380"},{"t":"img","src":"assets/img/c11_158.webp","ilabel":"C11-19","icap":"开盘第一小时","fid":"fig159","ctx":[{"t":"这也是刚才的同一个例子，开盘后出现强劲趋势突破，然后是回调旗型。又一次上涨，然后是回调。在第一次回调时可以入场，博取下一段上涨行情。第一次回调具有分形特征，例如这里是一个EMA突破，紧接着就是一次第一次回撤，所以你也可以在这个K线买入，然后抓住这一波行情。或者你可以看到这一波行情，并将其作为第一次回撤时买入。然后他们有第二波和第三波行情，就非常具有爆发性。","p":"p380"},{"t":"第一次回撤是看跌的，现在我们看到价格急剧下跌，触及EMA，我们已经错过了这个机会。你可以做空这根K线，期待价格下跌更多。这确实是个艰难的卖出操作，但你可以做到，因为市场上有足够的抛压。或者你可以等待价格进一步回撤，突破后第一次回撤到EMA。并做空以期待再创新低。我想指出这个第一次回撤，因为你突破了之后来自EMA，这是我们第一次回调。我们迎来了一波下跌，现在我们有了这第一次回调。这个区域就是一个交易区间。而这波下跌突破了这个交易区间，只有在这里形成了一个新的第一次回调，这也导致了非常强烈的抛售，第一次回调值得进一步下跌。他变得越来越弱，这是一轮相当急剧的抛售，这可以被看作是高潮行为，最后是横盘整理或下跌的走势。","p":"p381"}]},{"t":"para","text":"第一次回撤是看跌的，现在我们看到价格急剧下跌，触及EMA，我们已经错过了这个机会。你可以做空这根K线，期待价格下跌更多。这确实是个艰难的卖出操作，但你可以做到，因为市场上有足够的抛压。或者你可以等待价格进一步回撤，突破后第一次回撤到EMA。并做空以期待再创新低。我想指出这个第一次回撤，因为你突破了之后来自EMA，这是我们第一次回调。我们迎来了一波下跌，现在我们有了这第一次回调。这个区域就是一个交易区间。而这波下跌突破了这个交易区间，只有在这里形成了一个新的第一次回调，这也导致了非常强烈的抛售，第一次回调值得进一步下跌。他变得越来越弱，这是一轮相当急剧的抛售，这可以被看作是高潮行为，最后是横盘整理或下跌的走势。","pid":"p381"}],"wcount":4536},{"id":"c12","title":"第12章　日内交易实例","icon":"12","sections":[],"blocks":[{"t":"para","text":"第12章 日内交易实例。","pid":"p382"},{"t":"para","text":"目录：日内交易实例。","pid":"p383"},{"t":"para","text":"市场周期趋势中的突破通道及震荡区间。我想说明的是这些PPT都是我自己的，这本书里的PPT实例则完全不同。我利用市场周期来把握节奏，并演示如何进行交易。所以在书中AL只是展示图表并加以讲解。我想构建一个流程，我将要讲解在市场周期中我们可以进行的各种交易类型。但这些内容书里没有。我要通过一些演示来展示日内交易的技巧。","pid":"p384"},{"t":"img","src":"assets/img/c12_159.webp","ilabel":"C12-1","icap":"日内交易实例","fid":"fig160","ctx":[{"t":"目录：日内交易实例。","p":"p383"},{"t":"市场周期趋势中的突破通道及震荡区间。我想说明的是这些PPT都是我自己的，这本书里的PPT实例则完全不同。我利用市场周期来把握节奏，并演示如何进行交易。所以在书中AL只是展示图表并加以讲解。我想构建一个流程，我将要讲解在市场周期中我们可以进行的各种交易类型。但这些内容书里没有。我要通过一些演示来展示日内交易的技巧。","p":"p384"},{"t":"总体概述市场周期已突破开始，然后进入通道和震荡区间。每个阶段都有不同类型的交易机会，突破阶段可以是收盘价买入或收盘价卖出。在这种情况下是收盘价买入。通道交易具有双向性，我们可以选择在收盘价走强时买入，或者在价格触及均线时买入。使用限价单进行买入，我不做限价单交易，所以我等到出现好的收盘价再买入。在交易区间内，我们可以进行两种类型的交易，我们可以在高点卖出，当均线转为阻力时，就可以在均线处卖出。然后我们可以买入这个双底形态，并将其价格推升至顶部。也可以在这里使用限价单，但目前处于下降趋势。你可以使用市价单来交易获利，或者当前高点和前期高点设置限价单。就在这个位置。而突破标志着新市场周期的开始，市场周期以突破开始以区间震荡结束。","p":"p385"}]},{"t":"para","text":"总体概述市场周期已突破开始，然后进入通道和震荡区间。每个阶段都有不同类型的交易机会，突破阶段可以是收盘价买入或收盘价卖出。在这种情况下是收盘价买入。通道交易具有双向性，我们可以选择在收盘价走强时买入，或者在价格触及均线时买入。使用限价单进行买入，我不做限价单交易，所以我等到出现好的收盘价再买入。在交易区间内，我们可以进行两种类型的交易，我们可以在高点卖出，当均线转为阻力时，就可以在均线处卖出。然后我们可以买入这个双底形态，并将其价格推升至顶部。也可以在这里使用限价单，但目前处于下降趋势。你可以使用市价单来交易获利，或者当前高点和前期高点设置限价单。就在这个位置。而突破标志着新市场周期的开始，市场周期以突破开始以区间震荡结束。","pid":"p385"},{"t":"img","src":"assets/img/c12_160.webp","ilabel":"C12-2","icap":"日内交易实例","fid":"fig161","ctx":[{"t":"总体概述市场周期已突破开始，然后进入通道和震荡区间。每个阶段都有不同类型的交易机会，突破阶段可以是收盘价买入或收盘价卖出。在这种情况下是收盘价买入。通道交易具有双向性，我们可以选择在收盘价走强时买入，或者在价格触及均线时买入。使用限价单进行买入，我不做限价单交易，所以我等到出现好的收盘价再买入。在交易区间内，我们可以进行两种类型的交易，我们可以在高点卖出，当均线转为阻力时，就可以在均线处卖出。然后我们可以买入这个双底形态，并将其价格推升至顶部。也可以在这里使用限价单，但目前处于下降趋势。你可以使用市价单来交易获利，或者当前高点和前期高点设置限价单。就在这个位置。而突破标志着新市场周期的开始，市场周期以突破开始以区间震荡结束。","p":"p385"},{"t":"突破表明有动量，既然有动量，我们就假设不会出现回调，回调导致交易者的陷阱。所以这些空头都被套住了，他们正在回补空单，而多头则在买入他们的多单。这回知道动量。所以我们必须市价入场，而不是等待回调。如果我们等待回调，将永远无法成交，因为这是一个动量交易，所以我们必须市价入场或买入止损单，在此之后第一根K线是通道阶段。你可以看到双向交易开始出现，但我们仍然可以买入强劲的收盘价，这就是第一次反转。又一次，这是市场周期的第一阶段，我们正处于低谷。","p":"p386"}]},{"t":"para","text":"突破表明有动量，既然有动量，我们就假设不会出现回调，回调导致交易者的陷阱。所以这些空头都被套住了，他们正在回补空单，而多头则在买入他们的多单。这回知道动量。所以我们必须市价入场，而不是等待回调。如果我们等待回调，将永远无法成交，因为这是一个动量交易，所以我们必须市价入场或买入止损单，在此之后第一根K线是通道阶段。你可以看到双向交易开始出现，但我们仍然可以买入强劲的收盘价，这就是第一次反转。又一次，这是市场周期的第一阶段，我们正处于低谷。","pid":"p386"},{"t":"img","src":"assets/img/c12_161.webp","ilabel":"C12-3","icap":"日内交易实例","fid":"fig162","ctx":[{"t":"突破表明有动量，既然有动量，我们就假设不会出现回调，回调导致交易者的陷阱。所以这些空头都被套住了，他们正在回补空单，而多头则在买入他们的多单。这回知道动量。所以我们必须市价入场，而不是等待回调。如果我们等待回调，将永远无法成交，因为这是一个动量交易，所以我们必须市价入场或买入止损单，在此之后第一根K线是通道阶段。你可以看到双向交易开始出现，但我们仍然可以买入强劲的收盘价，这就是第一次反转。又一次，这是市场周期的第一阶段，我们正处于低谷。","p":"p386"},{"t":"通道阶段是市场周期的第二部分，这是我们关注中间区域，在通道阶段我们能看到各个波段。突破就是第一次推动（乐观），然后我们有第二第三第四次推动。这是一个非常强的通道，所以很难数出推动（leg）。在强劲的趋势中，我们通常不数推动（leg），我们只能等到出现衰竭缺口，或者当风险过大时就退出。因为这种推动（leg）的计数可以没完没了，我相信我们都尝试过做空上升趋势。所以通道阶段会在第一次回车后开始。通道显示双边交易，并坚持趋势入场。经验丰富的交易，你们会看这个，不过你们当然可以按自己的想法。每次创出新高就做剥头皮交易上，这是个可行的策略，我不这么做。所以我们可以在这里做多，在EMA的第一次回撤时做多，在双底形态时做多。这根空头K线可以买入，因为它正在EMA处获得支撑并反弹，我只是举例添加了一些限价单交易，我本人并不进行这些操作。这里有一个限价单，我们正在测试这个突破形成的高点，也就是说这是经历了一个突破回踩，然后触及EMA后反弹。之前每次价格触及EMA反弹时，多头们都会买入，所以这或许是一个不错的限价单机会。而且这个位置确实又被测试了一次，所以如果你在这里买了，你可能得忍受一阵回调，或者选择平仓离场或者逢低加仓。这是一个突破。这很难。你看这次突破之后，市场变得更加双向了，这更适合用限价单交易。在这里用市价单依然可以成交。但如果你在这根K线的最高价买入，你就要经历一次回调，你在这根K线的最高价买入，你就要经历一次回调。你买入这个是希望能突破，结果立刻就回调了。所以这是更双向的交易。","p":"p387"}]},{"t":"para","text":"通道阶段是市场周期的第二部分，这是我们关注中间区域，在通道阶段我们能看到各个波段。突破就是第一次推动（乐观），然后我们有第二第三第四次推动。这是一个非常强的通道，所以很难数出推动（leg）。在强劲的趋势中，我们通常不数推动（leg），我们只能等到出现衰竭缺口，或者当风险过大时就退出。因为这种推动（leg）的计数可以没完没了，我相信我们都尝试过做空上升趋势。所以通道阶段会在第一次回车后开始。通道显示双边交易，并坚持趋势入场。经验丰富的交易，你们会看这个，不过你们当然可以按自己的想法。每次创出新高就做剥头皮交易上，这是个可行的策略，我不这么做。所以我们可以在这里做多，在EMA的第一次回撤时做多，在双底形态时做多。这根空头K线可以买入，因为它正在EMA处获得支撑并反弹，我只是举例添加了一些限价单交易，我本人并不进行这些操作。这里有一个限价单，我们正在测试这个突破形成的高点，也就是说这是经历了一个突破回踩，然后触及EMA后反弹。之前每次价格触及EMA反弹时，多头们都会买入，所以这或许是一个不错的限价单机会。而且这个位置确实又被测试了一次，所以如果你在这里买了，你可能得忍受一阵回调，或者选择平仓离场或者逢低加仓。这是一个突破。这很难。你看这次突破之后，市场变得更加双向了，这更适合用限价单交易。在这里用市价单依然可以成交。但如果你在这根K线的最高价买入，你就要经历一次回调，你在这根K线的最高价买入，你就要经历一次回调。你买入这个是希望能突破，结果立刻就回调了。所以这是更双向的交易。","pid":"p387"},{"t":"img","src":"assets/img/c12_162.webp","ilabel":"C12-4","icap":"日内交易实例","fid":"fig163","ctx":[{"t":"通道阶段是市场周期的第二部分，这是我们关注中间区域，在通道阶段我们能看到各个波段。突破就是第一次推动（乐观），然后我们有第二第三第四次推动。这是一个非常强的通道，所以很难数出推动（leg）。在强劲的趋势中，我们通常不数推动（leg），我们只能等到出现衰竭缺口，或者当风险过大时就退出。因为这种推动（leg）的计数可以没完没了，我相信我们都尝试过做空上升趋势。所以通道阶段会在第一次回车后开始。通道显示双边交易，并坚持趋势入场。经验丰富的交易，你们会看这个，不过你们当然可以按自己的想法。每次创出新高就做剥头皮交易上，这是个可行的策略，我不这么做。所以我们可以在这里做多，在EMA的第一次回撤时做多，在双底形态时做多。这根空头K线可以买入，因为它正在EMA处获得支撑并反弹，我只是举例添加了一些限价单交易，我本人并不进行这些操作。这里有一个限价单，我们正在测试这个突破形成的高点，也就是说这是经历了一个突破回踩，然后触及EMA后反弹。之前每次价格触及EMA反弹时，多头们都会买入，所以这或许是一个不错的限价单机会。而且这个位置确实又被测试了一次，所以如果你在这里买了，你可能得忍受一阵回调，或者选择平仓离场或者逢低加仓。这是一个突破。这很难。你看这次突破之后，市场变得更加双向了，这更适合用限价单交易。在这里用市价单依然可以成交。但如果你在这根K线的最高价买入，你就要经历一次回调，你在这根K线的最高价买入，你就要经历一次回调。你买入这个是希望能突破，结果立刻就回调了。所以这是更双向的交易。","p":"p387"},{"t":"这让我们来看最后一张幻灯片区间。交易区间所以我们现在处于市场周期，市场周期的尾声，并且存在双向交易，还记得我们之前在通道页面上说的那根K线吗？我说如果你在那个K线买，就会出现很多双向交易，那就是这根K线。或者我们讨论的是这个K线，你看，如果你在那根K线买入，你买的就是区间高点。所以这个交易区间真的从这里开始，然后我们回升触及了区间下轨性反弹。这个交易区间在我们回过神来之前就已经启动了，我们当时还在通道里，但空头们又卷土重来了。当空头们成功突破时，他们会瞄准之前的所有回调位。震荡区间是市场周期的尾声，低吸高抛，多空双方都能赚钱。而且缺口都封住了。所以这里有跳空缺口回补了。然后这些多头就去追逐趋势了，然后价格跳空开盘。空头们成功突破，然后获利了结，所以这是一个市价单。而且由于存在双向交易，你也可以使用限价单。你可以在50%或25%的价位设置限价单进行卖出。在这里多头形成了双底形态，并成功突破，并且突破获得了上涨动能，所以它变成了一个止损单。出现第一个反转K线时，你可以开始在回撤的50%处买入。如果你在这里等待你的订单就会被成交，只要能扛住一波回调就能盈利，但目前市场仍是双边交易。","p":"p388"}]},{"t":"para","text":"这让我们来看最后一张幻灯片区间。交易区间所以我们现在处于市场周期，市场周期的尾声，并且存在双向交易，还记得我们之前在通道页面上说的那根K线吗？我说如果你在那个K线买，就会出现很多双向交易，那就是这根K线。或者我们讨论的是这个K线，你看，如果你在那根K线买入，你买的就是区间高点。所以这个交易区间真的从这里开始，然后我们回升触及了区间下轨性反弹。这个交易区间在我们回过神来之前就已经启动了，我们当时还在通道里，但空头们又卷土重来了。当空头们成功突破时，他们会瞄准之前的所有回调位。震荡区间是市场周期的尾声，低吸高抛，多空双方都能赚钱。而且缺口都封住了。所以这里有跳空缺口回补了。然后这些多头就去追逐趋势了，然后价格跳空开盘。空头们成功突破，然后获利了结，所以这是一个市价单。而且由于存在双向交易，你也可以使用限价单。你可以在50%或25%的价位设置限价单进行卖出。在这里多头形成了双底形态，并成功突破，并且突破获得了上涨动能，所以它变成了一个止损单。出现第一个反转K线时，你可以开始在回撤的50%处买入。如果你在这里等待你的订单就会被成交，只要能扛住一波回调就能盈利，但目前市场仍是双边交易。","pid":"p388"}],"wcount":1855},{"id":"c13","title":"第13章　日线 周线 和月线","icon":"13","sections":[],"blocks":[{"t":"para","text":"第13章 日线，周线和月线。","pid":"p389"},{"t":"para","text":"目录：巨量反转","pid":"p390"},{"t":"para","text":"巨量反转，当某只股票出现巨大跳空，且成交量是平时5~10倍时，这可能预示着底部或顶部的出现。交易者应时刻关注盘面，让价格行为告诉他们市场是否出现反转，而不是在出现巨大跳空的交易日里寻找反转信号。很多时候如果反转的成交量巨大，这可能导致一波持续数日的行情。","pid":"p391"},{"t":"img","src":"assets/img/c13_163.webp","ilabel":"C13-1","icap":"日线 周线 和月线","fid":"fig164","ctx":[{"t":"目录：巨量反转","p":"p390"},{"t":"巨量反转，当某只股票出现巨大跳空，且成交量是平时5~10倍时，这可能预示着底部或顶部的出现。交易者应时刻关注盘面，让价格行为告诉他们市场是否出现反转，而不是在出现巨大跳空的交易日里寻找反转信号。很多时候如果反转的成交量巨大，这可能导致一波持续数日的行情。","p":"p391"},{"t":"这里我们有一个跳空上涨，然后是反转。空头们强力突破了两条指数移动平均线，随后价格出现回撤。我们崩盘争议了一周左右，随后空头们再次实现突破，趋势也变得更加陡峭。这一切都始于4号的调控上涨。","p":"p392"}]},{"t":"para","text":"这里我们有一个跳空上涨，然后是反转。空头们强力突破了两条指数移动平均线，随后价格出现回撤。我们崩盘争议了一周左右，随后空头们再次实现突破，趋势也变得更加陡峭。这一切都始于4号的调控上涨。","pid":"p392"},{"t":"img","src":"assets/img/c13_164.webp","ilabel":"C13-2","icap":"日线 周线 和月线","fid":"fig165","ctx":[{"t":"这里我们有一个跳空上涨，然后是反转。空头们强力突破了两条指数移动平均线，随后价格出现回撤。我们崩盘争议了一周左右，随后空头们再次实现突破，趋势也变得更加陡峭。这一切都始于4号的调控上涨。","p":"p392"},{"t":"这里是跳空下跌，这张图是45分钟图。我们正在看这根K线。空头们已经下跌了几天，随后出现了一个跳空下跌，多头们反转向上，今天是成交量大的一天。你可以看到这发生在13号。","p":"p393"}]},{"t":"para","text":"这里是跳空下跌，这张图是45分钟图。我们正在看这根K线。空头们已经下跌了几天，随后出现了一个跳空下跌，多头们反转向上，今天是成交量大的一天。你可以看到这发生在13号。","pid":"p393"},{"t":"img","src":"assets/img/c13_165.webp","ilabel":"C13-3","icap":"日线 周线 和月线","fid":"fig166","ctx":[{"t":"这里是跳空下跌，这张图是45分钟图。我们正在看这根K线。空头们已经下跌了几天，随后出现了一个跳空下跌，多头们反转向上，今天是成交量大的一天。你可以看到这发生在13号。","p":"p393"},{"t":"这是同一张图表，从3月13日放大到8月。也就是今天。在经历了巨大的跳空下跌之后，你可以看到我们已经处于多头趋势中有多久了。伴随着高成交量和反转。","p":"p394"}]},{"t":"para","text":"这是同一张图表，从3月13日放大到8月。也就是今天。在经历了巨大的跳空下跌之后，你可以看到我们已经处于多头趋势中有多久了。伴随着高成交量和反转。","pid":"p394"}],"wcount":396},{"id":"c14","title":"第14章　期权","icon":"14","sections":[],"blocks":[{"t":"para","text":"第14章 期权","pid":"p395"},{"t":"para","text":"期权交易的方法有很多。还可以用于在日线图上进行波段交易。期权的一个优势在于能确切地知道自己的风险。","pid":"p396"},{"t":"para","text":"如果你想成为一名日内交易者，最好专注于5分钟图，并在单一图表和单一时间周期上精通交易执行。","pid":"p397"}],"wcount":101},{"id":"c15","title":"第15章　最好的交易","icon":"15","sections":[],"blocks":[{"t":"para","text":"第十五章 最好的交易","pid":"p398"},{"t":"para","text":"目录：主要反转形态，震荡日内的微型反转，短线交易。趋势中的回调。日内交易的股票。","pid":"p399"},{"t":"para","text":"主要反转形态","pid":"p400"},{"t":"para","text":"当趋势持续了一两个小时或几天后，寻找趋势线突破，然后回测，在回测时出现一个好的反转K线。等待反趋势交易者突破主要趋势的趋势线。这表明反趋势交易者现在实力占优。等待极端价位回测后再进行反趋势交易。进行反趋势交易很容易导致当天所有利润尽失。","pid":"p401"},{"t":"img","src":"assets/img/c15_166.webp","ilabel":"C15-1","icap":"最好的交易","fid":"fig167","ctx":[{"t":"主要反转形态","p":"p400"},{"t":"当趋势持续了一两个小时或几天后，寻找趋势线突破，然后回测，在回测时出现一个好的反转K线。等待反趋势交易者突破主要趋势的趋势线。这表明反趋势交易者现在实力占优。等待极端价位回测后再进行反趋势交易。进行反趋势交易很容易导致当天所有利润尽失。","p":"p401"},{"t":"这是一个主要的反转信号。价格向上突破后冲向阻力位，但空头成功反转的局势。他们抛售了几个小时，直到触及支撑位。所以我可以看到一个双底形态，还有一个楔形底形态。这里有一个双底形态。而这条趋势线正是空头被压制的区间。多头突破了趋势线，然后市场进入横盘整理。突破点被回踩确认，随后多头趋势开启。在这个形态里还嵌套了更多楔形。一个，两个，再来一个。还有一个大的，第二个，第三个。在一次成功的触及回踩后，出现了一个外包K线。所以这里又一次趋势线被打破，这是做空信号，这根K线突破了趋势线，然后进行了回踩。双重底部突破，然后是更大的回踩，又一个双重底部。","p":"p402"}]},{"t":"para","text":"这是一个主要的反转信号。价格向上突破后冲向阻力位，但空头成功反转的局势。他们抛售了几个小时，直到触及支撑位。所以我可以看到一个双底形态，还有一个楔形底形态。这里有一个双底形态。而这条趋势线正是空头被压制的区间。多头突破了趋势线，然后市场进入横盘整理。突破点被回踩确认，随后多头趋势开启。在这个形态里还嵌套了更多楔形。一个，两个，再来一个。还有一个大的，第二个，第三个。在一次成功的触及回踩后，出现了一个外包K线。所以这里又一次趋势线被打破，这是做空信号，这根K线突破了趋势线，然后进行了回踩。双重底部突破，然后是更大的回踩，又一个双重底部。","pid":"p402"},{"t":"img","src":"assets/img/c15_167.webp","ilabel":"C15-2","icap":"最好的交易","fid":"fig168","ctx":[{"t":"这是一个主要的反转信号。价格向上突破后冲向阻力位，但空头成功反转的局势。他们抛售了几个小时，直到触及支撑位。所以我可以看到一个双底形态，还有一个楔形底形态。这里有一个双底形态。而这条趋势线正是空头被压制的区间。多头突破了趋势线，然后市场进入横盘整理。突破点被回踩确认，随后多头趋势开启。在这个形态里还嵌套了更多楔形。一个，两个，再来一个。还有一个大的，第二个，第三个。在一次成功的触及回踩后，出现了一个外包K线。所以这里又一次趋势线被打破，这是做空信号，这根K线突破了趋势线，然后进行了回踩。双重底部突破，然后是更大的回踩，又一个双重底部。","p":"p402"},{"t":"这是一个多头趋势。不要反转，看跌。过去一年我们一直处于多头趋势。我不得不缩小图标范围来给你们展示那些看跌趋势线的突破，那概念是一样的。这张图表上其实有很多东西可以看，所以我先指出显而易见的几个，这里有一条趋势线，它起到了支撑作用。多头们试图再次突破，但空头们将其反转。在创下新低之前，他们回升并重新测试了趋势线的低点。所以突破后回踩，然后空头就继续向下卖。这种相同的模式一直在这里上演。这里有一条更陡的多头趋势线。空头们打破了多头趋势线，他们上来回测，然后价格就跌到了这个通道的底部。我们可以看到这里同样的一幕重演了。所以，价格向上推升。空头们打破了趋势线，这是一条陡峭的曲线。他们在这里获得了回测的机会。继续上涨，又一次突破了趋势线再次测试。继续上涨。趋势线突破，这次直接跳空上涨，一路高歌。趋势线突破，再次测试。趋势线突破，再次测试，实际上这里还有一个。这是一个放大的图表。空头趋势线，回踩，双重底，多头趋势。","p":"p403"},{"t":"小幅反转震荡区间日","p":"p404"},{"t":"试探性入场。在震荡区间日波段交易最多只能持续几个小时或者最长1小时，在极端位置可以放心大胆的做突破失败的交易。安逸有时也会引发波动。在震荡市中最佳的入场时机是极端位置出现的失败楔形，楔形表明市场在同一方向上三次尝试突破，均宣告失败。","p":"p405"}]},{"t":"para","text":"这是一个多头趋势。不要反转，看跌。过去一年我们一直处于多头趋势。我不得不缩小图标范围来给你们展示那些看跌趋势线的突破，那概念是一样的。这张图表上其实有很多东西可以看，所以我先指出显而易见的几个，这里有一条趋势线，它起到了支撑作用。多头们试图再次突破，但空头们将其反转。在创下新低之前，他们回升并重新测试了趋势线的低点。所以突破后回踩，然后空头就继续向下卖。这种相同的模式一直在这里上演。这里有一条更陡的多头趋势线。空头们打破了多头趋势线，他们上来回测，然后价格就跌到了这个通道的底部。我们可以看到这里同样的一幕重演了。所以，价格向上推升。空头们打破了趋势线，这是一条陡峭的曲线。他们在这里获得了回测的机会。继续上涨，又一次突破了趋势线再次测试。继续上涨。趋势线突破，这次直接跳空上涨，一路高歌。趋势线突破，再次测试。趋势线突破，再次测试，实际上这里还有一个。这是一个放大的图表。空头趋势线，回踩，双重底，多头趋势。","pid":"p403"},{"t":"para","text":"小幅反转震荡区间日","pid":"p404"},{"t":"para","text":"试探性入场。在震荡区间日波段交易最多只能持续几个小时或者最长1小时，在极端位置可以放心大胆的做突破失败的交易。安逸有时也会引发波动。在震荡市中最佳的入场时机是极端位置出现的失败楔形，楔形表明市场在同一方向上三次尝试突破，均宣告失败。","pid":"p405"},{"t":"img","src":"assets/img/c15_168.webp","ilabel":"C15-3","icap":"最好的交易","fid":"fig169","ctx":[{"t":"小幅反转震荡区间日","p":"p404"},{"t":"试探性入场。在震荡区间日波段交易最多只能持续几个小时或者最长1小时，在极端位置可以放心大胆的做突破失败的交易。安逸有时也会引发波动。在震荡市中最佳的入场时机是极端位置出现的失败楔形，楔形表明市场在同一方向上三次尝试突破，均宣告失败。","p":"p405"},{"t":"在震荡室中进行的小幅反转，剥头皮交易。空头在跌破EMA后成功突破第一根反向K线，开启了通道行情。通道行情结束后，市场进入盘整阶段。昨天收盘时，市场呈横盘状态。并形成了区间高点和区间低点。今日开盘后，市场维持在该区间内运行。市场在区间中段开盘。多头在日中给空头们制造了一个楔形顶。第一推，第二推，第三推。你可以从这些K线中的任意一条开始做空，这是一个突破。第一段，第二段，第三段。这就是那个日中的楔形顶，接着又出现了一个反转形态，一个楔形底。一个嵌套的楔形。这是另一个楔形，第一推。第一推，第二推，第三推。形成了一个双底。现在多头获得了他们的波段反弹，多头创出新高，随后又形成了一个楔形顶部。第一推，第二推，第三推。第二天开盘出现跳空下跌。所以那些做楔形顶部波段交易的交易者赚到钱了。价格随后反转了。我们看到了另一个分形楔形有这里的这一推，这一推和这一推组成。价格一度下跌，又形成了一个楔形底部，所以在我们所处的交易区间内存在着许多嵌套的形态。我们得耐心等待这个形态走出来，而且市场的波动会来的稍微快一些。因此我们宁愿花更长的时间去捕捉更短线的交易机会。","p":"p406"}]},{"t":"para","text":"在震荡室中进行的小幅反转，剥头皮交易。空头在跌破EMA后成功突破第一根反向K线，开启了通道行情。通道行情结束后，市场进入盘整阶段。昨天收盘时，市场呈横盘状态。并形成了区间高点和区间低点。今日开盘后，市场维持在该区间内运行。市场在区间中段开盘。多头在日中给空头们制造了一个楔形顶。第一推，第二推，第三推。你可以从这些K线中的任意一条开始做空，这是一个突破。第一段，第二段，第三段。这就是那个日中的楔形顶，接着又出现了一个反转形态，一个楔形底。一个嵌套的楔形。这是另一个楔形，第一推。第一推，第二推，第三推。形成了一个双底。现在多头获得了他们的波段反弹，多头创出新高，随后又形成了一个楔形顶部。第一推，第二推，第三推。第二天开盘出现跳空下跌。所以那些做楔形顶部波段交易的交易者赚到钱了。价格随后反转了。我们看到了另一个分形楔形有这里的这一推，这一推和这一推组成。价格一度下跌，又形成了一个楔形底部，所以在我们所处的交易区间内存在着许多嵌套的形态。我们得耐心等待这个形态走出来，而且市场的波动会来的稍微快一些。因此我们宁愿花更长的时间去捕捉更短线的交易机会。","pid":"p406"},{"t":"img","src":"assets/img/c15_169.webp","ilabel":"C15-4","icap":"最好的交易","fid":"fig170","ctx":[{"t":"在震荡室中进行的小幅反转，剥头皮交易。空头在跌破EMA后成功突破第一根反向K线，开启了通道行情。通道行情结束后，市场进入盘整阶段。昨天收盘时，市场呈横盘状态。并形成了区间高点和区间低点。今日开盘后，市场维持在该区间内运行。市场在区间中段开盘。多头在日中给空头们制造了一个楔形顶。第一推，第二推，第三推。你可以从这些K线中的任意一条开始做空，这是一个突破。第一段，第二段，第三段。这就是那个日中的楔形顶，接着又出现了一个反转形态，一个楔形底。一个嵌套的楔形。这是另一个楔形，第一推。第一推，第二推，第三推。形成了一个双底。现在多头获得了他们的波段反弹，多头创出新高，随后又形成了一个楔形顶部。第一推，第二推，第三推。第二天开盘出现跳空下跌。所以那些做楔形顶部波段交易的交易者赚到钱了。价格随后反转了。我们看到了另一个分形楔形有这里的这一推，这一推和这一推组成。价格一度下跌，又形成了一个楔形底部，所以在我们所处的交易区间内存在着许多嵌套的形态。我们得耐心等待这个形态走出来，而且市场的波动会来的稍微快一些。因此我们宁愿花更长的时间去捕捉更短线的交易机会。","p":"p406"},{"t":"这是今天在我们交易区间内进行另一种剥头皮交易的图表。昨天市场是横盘整理的，今天我们以跳空下跌开盘，然后又再次横盘。这是一个宽幅的多头通道，所以你可以选择做空或做多。最好继续做多，你可以买入这个突破，做一次剥头皮交易，这笔交易持续了5根K线。然后午间出现了一个空头波段。这波行情只持续了大约1小时，并且市场出现了大量的横盘震荡。多头构筑了双底形态，市场再次进入横盘整理。当市场进入午间的震荡区间时，最好还是耐心等待突破。因为在这个窄幅震荡区间里很容易被套。多头在这里构筑了一个抛物线楔形，这是三推上涨形态123。这导致了在此处卖出。这个嵌套的底部在第二天就被突破了。他最终测试了区间高点后便回落了，这里又形成了另一个嵌套底部处于支撑位。我们看到了一次强劲的突破，但这次突破之后，市场陷入了更长时间的横盘整理，因为之前有过一次大幅上涨和一次大幅下跌。","p":"p407"},{"t":"回调以及强劲的趋势","p":"p408"},{"t":"在趋势中的这些入场点非常好。有时需要几个小时才能确认，市场正在形成趋势。一旦交易就能确认市场处于趋势中，就寻找回调至EMA指数移动平均线。当回调走完两段后就可以进场交易，并持有至新高。等待两段回调，说明市场在同一个方向上已经两次尝试失败，这为我们我们提供了高二或低二的交易信号。","p":"p409"}]},{"t":"para","text":"这是今天在我们交易区间内进行另一种剥头皮交易的图表。昨天市场是横盘整理的，今天我们以跳空下跌开盘，然后又再次横盘。这是一个宽幅的多头通道，所以你可以选择做空或做多。最好继续做多，你可以买入这个突破，做一次剥头皮交易，这笔交易持续了5根K线。然后午间出现了一个空头波段。这波行情只持续了大约1小时，并且市场出现了大量的横盘震荡。多头构筑了双底形态，市场再次进入横盘整理。当市场进入午间的震荡区间时，最好还是耐心等待突破。因为在这个窄幅震荡区间里很容易被套。多头在这里构筑了一个抛物线楔形，这是三推上涨形态123。这导致了在此处卖出。这个嵌套的底部在第二天就被突破了。他最终测试了区间高点后便回落了，这里又形成了另一个嵌套底部处于支撑位。我们看到了一次强劲的突破，但这次突破之后，市场陷入了更长时间的横盘整理，因为之前有过一次大幅上涨和一次大幅下跌。","pid":"p407"},{"t":"para","text":"回调以及强劲的趋势","pid":"p408"},{"t":"para","text":"在趋势中的这些入场点非常好。有时需要几个小时才能确认，市场正在形成趋势。一旦交易就能确认市场处于趋势中，就寻找回调至EMA指数移动平均线。当回调走完两段后就可以进场交易，并持有至新高。等待两段回调，说明市场在同一个方向上已经两次尝试失败，这为我们我们提供了高二或低二的交易信号。","pid":"p409"},{"t":"img","src":"assets/img/c15_170.webp","ilabel":"C15-5","icap":"最好的交易","fid":"fig171","ctx":[{"t":"回调以及强劲的趋势","p":"p408"},{"t":"在趋势中的这些入场点非常好。有时需要几个小时才能确认，市场正在形成趋势。一旦交易就能确认市场处于趋势中，就寻找回调至EMA指数移动平均线。当回调走完两段后就可以进场交易，并持有至新高。等待两段回调，说明市场在同一个方向上已经两次尝试失败，这为我们我们提供了高二或低二的交易信号。","p":"p409"},{"t":"首次看涨回调","p":"p410"},{"t":"这是我最喜欢的一种交易方式。我从中赚到的利润最多。第一次回调会伴随突破，也就是说我们先看到价格突破，然后会一条这里我们看到价格向下走了两段，这是第一段，接着回调，这是第二段。这表明这里的价格行为形成了一个高二，鉴于空头两次都没能成功，而且价格已经创下新高。这是一个绝佳的顺势入场机会，你可以继续持有，等待它再上涨几个波段。随着趋势的发展，回调会越来越深，但仍然是两段式回调，第一段回调，第二段。这里也有分形波段，我只是跳过了他，因为这些回调幅度更大，所以这里是一段回调，二段回调，三段突破，一段回调，二段突破。这是一个非常强势的趋势，所以回调很浅。我们在这里进入区间震荡，但它仍然是两段式的回调，第一段回调，第二段。多头们正在测试高点。","p":"p411"}]},{"t":"para","text":"首次看涨回调","pid":"p410"},{"t":"para","text":"这是我最喜欢的一种交易方式。我从中赚到的利润最多。第一次回调会伴随突破，也就是说我们先看到价格突破，然后会一条这里我们看到价格向下走了两段，这是第一段，接着回调，这是第二段。这表明这里的价格行为形成了一个高二，鉴于空头两次都没能成功，而且价格已经创下新高。这是一个绝佳的顺势入场机会，你可以继续持有，等待它再上涨几个波段。随着趋势的发展，回调会越来越深，但仍然是两段式回调，第一段回调，第二段。这里也有分形波段，我只是跳过了他，因为这些回调幅度更大，所以这里是一段回调，二段回调，三段突破，一段回调，二段突破。这是一个非常强势的趋势，所以回调很浅。我们在这里进入区间震荡，但它仍然是两段式的回调，第一段回调，第二段。多头们正在测试高点。","pid":"p411"},{"t":"img","src":"assets/img/c15_171.webp","ilabel":"C15-6","icap":"最好的交易","fid":"fig172","ctx":[{"t":"首次看涨回调","p":"p410"},{"t":"这是我最喜欢的一种交易方式。我从中赚到的利润最多。第一次回调会伴随突破，也就是说我们先看到价格突破，然后会一条这里我们看到价格向下走了两段，这是第一段，接着回调，这是第二段。这表明这里的价格行为形成了一个高二，鉴于空头两次都没能成功，而且价格已经创下新高。这是一个绝佳的顺势入场机会，你可以继续持有，等待它再上涨几个波段。随着趋势的发展，回调会越来越深，但仍然是两段式回调，第一段回调，第二段。这里也有分形波段，我只是跳过了他，因为这些回调幅度更大，所以这里是一段回调，二段回调，三段突破，一段回调，二段突破。这是一个非常强势的趋势，所以回调很浅。我们在这里进入区间震荡，但它仍然是两段式的回调，第一段回调，第二段。多头们正在测试高点。","p":"p411"},{"t":"首次回调看跌","p":"p412"},{"t":"大家可能对这张图有点眼熟，我喜欢展示相同的图表，这样我可以一层层的讲解，所以多头们突破后冲向阻力位，而空头们则实现了反转。这次突破导致了全天候的抛售。第一次回调就发生在这一点，它有两段组成第一段回调第二段。空头在这根K线上的低点形成了，然后价格就下跌了。你可以在支撑位获利了结或者继续持有，等待更极端的走势。继续持有，等待更极端的走势，意味着你预期会出现空头趋势，但是这是横盘整理的走势，所以价格可能会向上突破。如果价格突破了这个交易区间，就会开启新的趋势，这里出现了新的第一次回调，就是这根K线。做空这根K线的高度，做空第一次回调，这导致了向下好几波下跌。","p":"p413"}]},{"t":"para","text":"首次回调看跌","pid":"p412"},{"t":"para","text":"大家可能对这张图有点眼熟，我喜欢展示相同的图表，这样我可以一层层的讲解，所以多头们突破后冲向阻力位，而空头们则实现了反转。这次突破导致了全天候的抛售。第一次回调就发生在这一点，它有两段组成第一段回调第二段。空头在这根K线上的低点形成了，然后价格就下跌了。你可以在支撑位获利了结或者继续持有，等待更极端的走势。继续持有，等待更极端的走势，意味着你预期会出现空头趋势，但是这是横盘整理的走势，所以价格可能会向上突破。如果价格突破了这个交易区间，就会开启新的趋势，这里出现了新的第一次回调，就是这根K线。做空这根K线的高度，做空第一次回调，这导致了向下好几波下跌。","pid":"p413"},{"t":"img","src":"assets/img/c15_172.webp","ilabel":"C15-7","icap":"最好的交易","fid":"fig173","ctx":[{"t":"首次回调看跌","p":"p412"},{"t":"大家可能对这张图有点眼熟，我喜欢展示相同的图表，这样我可以一层层的讲解，所以多头们突破后冲向阻力位，而空头们则实现了反转。这次突破导致了全天候的抛售。第一次回调就发生在这一点，它有两段组成第一段回调第二段。空头在这根K线上的低点形成了，然后价格就下跌了。你可以在支撑位获利了结或者继续持有，等待更极端的走势。继续持有，等待更极端的走势，意味着你预期会出现空头趋势，但是这是横盘整理的走势，所以价格可能会向上突破。如果价格突破了这个交易区间，就会开启新的趋势，这里出现了新的第一次回调，就是这根K线。做空这根K线的高度，做空第一次回调，这导致了向下好几波下跌。","p":"p413"},{"t":"这是另一个第一次回调的例子，因为存在多个第一次回调，但我们必须将它们串联起来。所以在多头跳空上涨后，空头在顶部成功反转，所以这是一个跳空上涨后的反转或者说反转式突破均线进入的一种形式。这是这次反转之后的第一次回调。这次第一次回调，导致了又一波下跌。当我们跌破均线时，我们可以说这是市场周期重置。这里是第一波，第二波，当市场进入盘整区间时，通常会先出现两次下跌或上涨，然后迎来反转。第一段行情回调，第二段行情然后反转。事实上这又是一次回调，对多头来说，第一段行情第一次回调，第二段行情出现在区间的顶部。现在整个市场结构可能演变成一次回调，这是一个巨大的熊旗。第一段行情突破，第二段行情。由于市场周期会重置并进入盘整区间，这次突破之后会迎来它自身的第一次回调。第一段行情回调，第二段行情，然后就反转了。这就将是低点一，这就将是低点二。这次突破非常强劲，反而引发了价格下跌。但是你得问问自己，如果今天一整天都在抛售空头，还能有多少子弹？这次突破足够强劲，可以形成自己的第二段行情。第二段行情不像第一段那样对称，这意味着我们可能进入一个震荡区间。然后出现楔形底部并进入横盘整理。","p":"p414"},{"t":"日内交易的股票","p":"p415"},{"t":"如果交易者能将自己限制在之前提到的三笔交易内，它可以获利丰厚。主要的趋势反转，震荡日里的短期回调，以及均线的价格回落。在挑选股票时要确保他们的成交量足够大，超过500万股是比较好的。配置一个包含5只左右股票的投资组合，并寻找这些交易形态。我这里没有图表，因为这只是说明，如果你交易股票可以用同样的方法来应用，只是把均线换成交量。","p":"p416"}]},{"t":"para","text":"这是另一个第一次回调的例子，因为存在多个第一次回调，但我们必须将它们串联起来。所以在多头跳空上涨后，空头在顶部成功反转，所以这是一个跳空上涨后的反转或者说反转式突破均线进入的一种形式。这是这次反转之后的第一次回调。这次第一次回调，导致了又一波下跌。当我们跌破均线时，我们可以说这是市场周期重置。这里是第一波，第二波，当市场进入盘整区间时，通常会先出现两次下跌或上涨，然后迎来反转。第一段行情回调，第二段行情然后反转。事实上这又是一次回调，对多头来说，第一段行情第一次回调，第二段行情出现在区间的顶部。现在整个市场结构可能演变成一次回调，这是一个巨大的熊旗。第一段行情突破，第二段行情。由于市场周期会重置并进入盘整区间，这次突破之后会迎来它自身的第一次回调。第一段行情回调，第二段行情，然后就反转了。这就将是低点一，这就将是低点二。这次突破非常强劲，反而引发了价格下跌。但是你得问问自己，如果今天一整天都在抛售空头，还能有多少子弹？这次突破足够强劲，可以形成自己的第二段行情。第二段行情不像第一段那样对称，这意味着我们可能进入一个震荡区间。然后出现楔形底部并进入横盘整理。","pid":"p414"},{"t":"para","text":"日内交易的股票","pid":"p415"},{"t":"para","text":"如果交易者能将自己限制在之前提到的三笔交易内，它可以获利丰厚。主要的趋势反转，震荡日里的短期回调，以及均线的价格回落。在挑选股票时要确保他们的成交量足够大，超过500万股是比较好的。配置一个包含5只左右股票的投资组合，并寻找这些交易形态。我这里没有图表，因为这只是说明，如果你交易股票可以用同样的方法来应用，只是把均线换成交量。","pid":"p416"}],"wcount":3238}]</script>
<script>
const DATA = JSON.parse(document.getElementById('sitedata').textContent);
const paper = document.getElementById('paper');
const toc = document.getElementById('toc');
const searchInput = document.getElementById('search');

// total words across all chapters
const totalWc = DATA.reduce((a,c)=>a+(c.wcount||0),0);
document.getElementById('totalWords').textContent = `全书约 ${totalWc.toLocaleString()} 字 · ${DATA.length} 章`;

// escape
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// 图号 → 图片锚点映射（img 后紧跟 cap，数据层已打 fid/fig）
const figAnchors = {};        // '图1-1' -> fid
const figIndex = [];          // [{num, cap, fid}]
DATA.forEach(ch=>{
  const collect=bs=>(bs||[]).forEach(b=>{ if(b.t==='img'&&b.fid){
    const num=b.fig||b.ilabel||'';
    const cap=b.cap||b.icap||'';
    figIndex.push({num:num, cap:cap, fid:b.fid});
    if(b.fig && !figAnchors[b.fig]) figAnchors[b.fig]=b.fid;
    if(b.ilabel && !figAnchors[b.ilabel]) figAnchors[b.ilabel]=b.fid;
  }});
  collect(ch.blocks); (ch.sections||[]).forEach(s=>collect(s.blocks));
});
// 正文里的「图X-Y」→ 可点击跳转。先转义，再把图号替换为 <a>
const FIGRE=/图\s*\d+\s*[-－—]\s*\d+/g;
function linkFigNums(text){
  let out='', last=0, m;
  FIGRE.lastIndex=0;
  while((m=FIGRE.exec(text))!==null){
    out+=esc(text.slice(last,m.index));
    const key=m[0].replace(/\s/g,'').replace(/[－—]/g,'-');
    if(figAnchors[key]){
      out+=`<a class="figref" data-fig="${key}" title="跳到图片">${esc(m[0])}</a>`;
    } else {
      out+=esc(m[0]);
    }
    last=m.index+m[0].length;
  }
  out+=esc(text.slice(last));
  return out;
}

// 跳到目标元素：懒加载图片会在滚动中撑高页面，多次校正保证落点精确（topbar 下留 70px）
function jumpTo(el){
  if(!el) return;
  const jump=()=>window.scrollTo({top:Math.max(0,Math.round(el.getBoundingClientRect().top+window.scrollY-70)),behavior:'instant'});
  jump(); setTimeout(jump,120); setTimeout(jump,450); setTimeout(jump,1000);
}
// build content + toc
let secIndex = 0;
let paraCounter = 0;
DATA.forEach((ch, ci)=>{
  // chapter
  const chap = document.createElement('section');
  chap.className='chapter'; chap.id='ch-'+ci;
  const wc = (ch.wcount||0).toLocaleString();
  chap.innerHTML = `<div class="chapter-head"><span class="badge">${esc(ch.icon)} / ${esc(ch.title)}</span><h1>${esc(ch.title)}</h1><div class="wcmeta">本章约 <b>${wc}</b> 字</div></div>`;
  // top-level blocks (before first section) — epub 首段即正文，不跳过
  const topBlocks=(ch.blocks||[]).slice();
  renderBlocks(topBlocks, chap);
  // toc chapter
  const chEl = document.createElement('div');
  chEl.className='toc-ch';
  chEl.innerHTML = `<div class="toc-ch-title"><span class="num">${esc(ch.icon)}</span><span class="name">${esc(ch.title)}</span><span class="wc">${wc}字</span><span class="arrow" title="折叠/展开小节">▾</span></div><div class="toc-secs"></div>`;
  const chTitle=chEl.querySelector('.toc-ch-title');
  chTitle.onclick=(e)=>{
    // 点箭头：仅折叠/展开小节，不跳转
    if(e.target.closest('.arrow')){ chEl.classList.toggle('closed'); return; }
    // 点标题主体：直接跳到对应章节
    jumpTo(document.getElementById('ch-'+ci));
    closeSidebar();
  };
  chEl.querySelector('.arrow').onclick=(e)=>{e.stopPropagation();chEl.classList.toggle('closed');};
  const secsEl = chEl.querySelector('.toc-secs');
  if(ch.sections.length===0){secsEl.innerHTML='<div class="toc-empty">（无小节）</div>';}
  ch.sections.forEach((s)=>{
    const sid='sec-'+secIndex;
    const sNode=document.createElement('article');
    sNode.className='section'+(s.level>=2?' lvl2':''); sNode.id=sid;
    sNode.innerHTML=`<h2>${esc(s.title)}</h2>`;
    renderBlocks(s.blocks, sNode);
    chap.appendChild(sNode);
    const link=document.createElement('a');
    link.className='toc-sec'+(s.level>=2?' lvl2':'');
    link.href='#'+sid; link.textContent=s.title; link.dataset.sid=sid;
    link.dataset.search=(s.title+' '+plainText(s.blocks)).toLowerCase();
