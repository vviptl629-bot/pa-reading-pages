<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- MOBUI-v1 -->
<!-- ICONV2-v1 -->
<!-- ICONPUB-v1 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- PWA-v1 -->
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0E9488">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PA阅读">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/vviptl629-bot/pa-icons/main/apple-touch-icon.png?v2">
<title>最佳交易策略 · 读书笔记</title>
<link rel="icon" href="https://raw.githubusercontent.com/vviptl629-bot/pa-icons/main/icon-192.png?v2">
<style>
html{
  --bg:#ffffff; --panel:#f5f6f7; --panel2:#eceef0; --line:#c9ced4;
  --text:#111418; --muted:#555e68; --accent:#0E9488; --deep:#0E9488;
  --amber:#a16207; --green:#15803d;
  --topbar-bg:rgba(255,255,255,.94); --para:#1a1f24;
  --mark-bg:rgba(14,148,136,.08); --badge-bg:rgba(14,148,136,.08); --badge-border:#0E9488;
  --img-shadow:0 2px 10px rgba(0,0,0,.12); --overlay:rgba(0,0,0,.35);
  --mark-text:rgba(251,191,36,.35);
}
:root{--sidebar:280px; --topbar:56px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.85;-webkit-font-smoothing:antialiased;
}
/* ---------- Top bar ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;height:var(--topbar);z-index:50;
  background:var(--topbar-bg);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 20px;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
.brand .mark{
  width:30px;height:30px;border-radius:8px;background:var(--accent);color:#08110f;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;
}
.brand .sub{color:var(--muted);font-weight:400;font-size:13px}
.lib-btn{flex:none;display:inline-flex;align-items:center;gap:5px;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;transition:background .18s}
.lib-btn:hover{background:rgba(14,148,136,.08)}
@media(max-width:720px){.lib-btn{padding:5px 9px;font-size:12px}}
.searchwrap{margin-left:auto;position:relative}
.searchwrap input{
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:8px 12px 8px 34px;width:230px;font-size:14px;outline:none;
  transition:border-color .2s;
}
.searchwrap input:focus{border-color:var(--accent)}
.searchwrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);stroke:var(--muted)}
.menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:6px 10px;font-size:18px;cursor:pointer}
/* ---------- Layout ---------- */
.layout{display:flex;padding-top:var(--topbar);min-height:100vh}
.sidebar{
  position:fixed;top:var(--topbar);bottom:0;left:0;width:var(--sidebar);
  background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:16px 0 40px;z-index:40;
}
.sidebar::-webkit-scrollbar,.main::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb,.main::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.toc-hint{font-size:11px;letter-spacing:2px;color:var(--muted);padding:6px 20px 12px;text-transform:uppercase}
.toc-ch{margin-bottom:2px}
.toc-ch-title{
  display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;
  font-weight:600;font-size:14px;user-select:none;color:var(--text);
}
.toc-ch-title:hover{background:var(--panel2)}
.toc-ch-title .num{
  flex:none;width:24px;height:24px;border-radius:6px;background:var(--panel2);
  color:var(--accent);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700;
}
.toc-ch-title .name{flex:1;line-height:1.35}
.toc-ch-title .arrow{transition:transform .2s;color:var(--muted);font-size:12px}
.toc-ch-title .wc{flex:none;font-size:10.5px;color:var(--muted);font-weight:400;opacity:.8}
.toc-total{font-size:11.5px;color:var(--muted);padding:0 20px 12px;line-height:1.6}
.toc-ch.closed .arrow{transform:rotate(-90deg)}
.toc-ch.closed .toc-secs{display:none}
.toc-secs{padding:2px 0 6px}
.toc-sec{
  display:block;padding:6px 20px 6px 54px;font-size:13px;color:var(--muted);
  cursor:pointer;line-height:1.5;border-left:2px solid transparent;
}
.toc-sec:hover{color:var(--text);background:var(--panel2)}
.toc-sec.lvl2{padding-left:70px;font-size:12.5px}
.toc-sec.active{color:var(--accent);border-left-color:var(--accent);background:var(--mark-bg);font-weight:600}
.toc-sec.hidden{display:none}
.toc-empty{padding:10px 20px;color:var(--muted);font-size:13px}
/* ---------- Main ---------- */
.main{margin-left:var(--sidebar);flex:1;padding:44px 24px 120px;min-width:0}
.paper{max-width:820px;margin:0 auto}
.chapter{margin-bottom:80px;scroll-margin-top:80px}
.chapter-head{margin-bottom:36px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.chapter-head .badge{
  display:inline-block;background:var(--badge-bg);color:var(--accent);
  border:1px solid var(--badge-border);border-radius:6px;padding:2px 10px;font-size:12px;
  letter-spacing:2px;margin-bottom:14px;
}
.chapter-head h1{font-size:30px;line-height:1.35;font-weight:800;letter-spacing:.5px}
.chapter-head .wcmeta{font-size:13px;color:var(--muted);margin-top:10px}
.chapter-head .wcmeta b{color:var(--accent);font-weight:700}
.toc-hint .total{display:block;letter-spacing:0;font-size:11px;color:var(--muted);margin-top:6px;text-transform:none}
.section{margin:0 0 38px;scroll-margin-top:80px}
.section h2{
  font-size:21px;font-weight:700;line-height:1.5;margin:0 0 18px;
  padding-left:14px;border-left:3px solid var(--accent);
}
.section.lvl2 h2{font-size:18px;border-left-color:var(--deep)}
.para{margin:0 0 18px;color:var(--para);text-align:justify}
.cap{
  font-size:13px;color:var(--muted);text-align:center;margin:6px 0 26px;
  padding:0 16px;line-height:1.7;
}
/* FIGFLOW-v1 流式图文：图全宽在上、正文照常排在下方；点击图片进分屏 */
.fig-row{display:block;margin:22px 0 26px}
.fig-row>.figmedia{max-width:100%;margin:0 0 18px}
.fig-row>.figmedia .figure{margin:0;text-align:center}
.fig-row .fig-text{min-width:0}
.fig-row .fig-text .para:last-child{margin-bottom:0}
.fig-row .figmedia .figure img{
  max-width:100%;width:auto;height:auto;border-radius:8px;background:#fff;
  border:1px solid var(--line);cursor:zoom-in;display:block;margin:0 auto;
  box-shadow:var(--img-shadow);
}
.fig-row .fig-back{margin-top:8px}
/* 独立图（无配对段落）正常居中 */
.fig-tag{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);
  background:var(--badge-bg);border:1px solid var(--badge-border);border-radius:5px;
  padding:1px 8px;margin-bottom:6px;letter-spacing:.5px}
.figure{margin:22px 0 8px;text-align:center;cursor:zoom-in}
.figure img{
  max-width:100%;height:auto;border-radius:8px;background:#fff;
  border:1px solid var(--line);cursor:zoom-in;display:inline-block;
  box-shadow:var(--img-shadow);
}
@media(max-width:1100px){
  .fig-row{margin:18px 0}
  .fig-row>.figmedia{max-width:100%;margin:0 0 14px}
}
.top-para{margin:0 0 18px;color:var(--para);text-align:justify}
/* ---------- Search highlight ---------- */
mark{background:var(--mark-text);color:var(--amber);border-radius:3px;padding:0 2px}
/* ---------- Side tabs (目录/图表/摘录) ---------- */
.side-tabs{display:flex;gap:4px;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.side-tabs button{flex:1;background:none;border:1px solid var(--line);color:var(--muted);
  border-radius:7px;padding:7px 4px;font-size:12.5px;cursor:pointer;transition:all .15s}
.side-tabs button.on{color:var(--accent);border-color:var(--deep);background:var(--badge-bg);font-weight:700}
.side-panel{display:none}.side-panel.on{display:block}
/* figure index */
.figidx{padding:8px 0}
.figidx-hint{font-size:11.5px;color:var(--muted);padding:4px 20px 10px;line-height:1.5}
.fig-item{display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;
  padding:8px 20px;color:var(--text);border-left:2px solid transparent;font-size:12.5px;line-height:1.4}
.fig-item:hover{background:var(--panel2)}
.fig-item .fnum{color:var(--accent);font-weight:700;margin-right:8px}
.fig-item .fcap{color:var(--muted)}
.fig-item.hidden{display:none}
/* figure number links in text */
.figref{color:var(--accent);border-bottom:1px dashed var(--deep);cursor:pointer;padding:0 1px}
.figref:hover{background:var(--badge-bg)}
.figure.hl-flash{animation:figflash 1.6s ease}
@keyframes figflash{0%,100%{box-shadow:var(--img-shadow)}30%,70%{box-shadow:0 0 0 5px var(--accent),0 0 30px var(--accent)}}
.fig-back{display:block;margin:10px auto 0;font-size:12px;color:var(--muted);cursor:pointer;
  background:none;border:1px solid var(--line);border-radius:6px;padding:3px 12px}
.fig-back:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- Highlights / excerpt ---------- */
.hl-y{background:rgba(251,191,36,.42);border-radius:2px;padding:1px 0;cursor:pointer}
.hl-g{background:rgba(74,222,128,.38);border-radius:2px;padding:1px 0;cursor:pointer}
.hl-b{background:rgba(96,165,250,.32);border-radius:2px;padding:1px 0;cursor:pointer}
.hl-bold{font-weight:800}
.selbar{position:fixed;z-index:155;display:none;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:5px;gap:4px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.selbar.show{display:flex;flex-wrap:wrap;max-width:340px}
.selbar button{border:none;background:var(--panel2);color:var(--text);border-radius:7px;
  padding:7px 10px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:5px}
.selbar button:hover{background:var(--accent);color:#08110f}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.dot.y{background:#fbbf24}.dot.g{background:#4ade80}.dot.b{background:#60a5fa}
/* excerpt drawer */
.excerpt-item{position:relative;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.excerpt-item:hover{background:var(--panel2)}
.excerpt-item .etext{font-size:13px;line-height:1.7;color:var(--text);word-break:break-word}
.excerpt-item .emeta{font-size:11px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.excerpt-item .edel{color:var(--muted);border:none;background:none;cursor:pointer;font-size:14px;padding:2px 6px}
.excerpt-item .edel:hover{color:#f87171}
.excerpt-item .ecolor{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px}
.excerpt-empty{padding:30px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
.excerpt-tools{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.excerpt-tools button{flex:1;min-width:70px;background:var(--panel2);border:1px solid var(--line);
  color:var(--text);border-radius:7px;padding:7px;font-size:12px;cursor:pointer}
.excerpt-tools button:hover{border-color:var(--accent);color:var(--accent)}
.excerpt-search{margin:10px 16px 4px;width:calc(100% - 32px);background:var(--panel2);
  border:1px solid var(--line);color:var(--text);border-radius:7px;padding:8px 10px;font-size:13px;outline:none}
/* ---------- Lightbox ---------- */
.lightbox{
  position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:160;display:none;
  align-items:center;justify-content:center;padding:40px;cursor:zoom-out;
}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lightbox .close{position:absolute;top:20px;right:26px;font-size:34px;color:#fff;cursor:pointer}
/* ---------- Split reading mode (click image -> full-screen split) ---------- */
body.split-mode .sidebar{transform:translateX(-100%);pointer-events:none}
body.split-mode .main{margin-left:0}
.split-reader{
  position:fixed;inset:0;z-index:150;background:var(--bg);
  display:none;flex-direction:column;
}
.split-reader.show{display:flex}
.sp-bar{
  height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel);gap:16px;
}
.sp-title{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.sp-ctrl{display:flex;align-items:center;gap:8px;flex:none}
.sp-ctrl button{
  background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:6px 13px;font-size:17px;line-height:1;cursor:pointer;transition:all .15s;
}
.sp-ctrl button:hover{color:var(--accent);border-color:var(--accent)}
.sp-ctrl #spPos{font-size:12px;color:var(--muted);min-width:56px;text-align:center}
.sp-body{flex:1;display:flex;min-height:0}
.sp-img{
  flex:0 0 56%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px 22px;overflow:auto;
}
.sp-img img{
  max-width:100%;max-height:calc(100vh - 150px);width:auto;height:auto;object-fit:contain;
  border-radius:8px;background:#fff;border:1px solid var(--line);box-shadow:var(--img-shadow);
  display:block;cursor:zoom-in;
}
.sp-img .cap{margin:12px 0 0;max-width:100%;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
.sp-txt{flex:1;min-width:0;overflow-y:auto;border-left:1px solid var(--line);padding:34px 38px 90px}
.sp-txt .sp-label{font-size:12px;letter-spacing:1px;color:var(--accent);margin-bottom:20px;font-weight:700;line-height:1.6}
.sp-txt .para{font-size:17.5px;line-height:2.05;color:var(--para);text-align:justify;margin-bottom:20px}
/* ---------- Progress ---------- */
.progress{position:fixed;top:var(--topbar);left:0;height:2px;background:var(--accent);z-index:60;width:0}
/* ---------- Back to top ---------- */
.totop{
  position:fixed;right:24px;bottom:28px;width:44px;height:44px;border-radius:50%;
  background:var(--panel2);border:1px solid var(--line);color:var(--accent);
  font-size:20px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:30;
}
.totop.show{display:flex}
/* ---------- Mobile ---------- */
@media(max-width:800px){
  :root{--sidebar:0px}
  .brand .sub{display:none}
  .brand>span:nth-child(2){display:none}
  .topbar{gap:10px;padding:0 12px}
  .searchwrap{margin-left:auto;flex:1;max-width:190px}
  .searchwrap input{width:100%}
  .menu-btn{display:block;flex:none}
  .sidebar{transform:translateX(-100%);transition:transform .25s;width:82vw;max-width:320px}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:30px 16px 100px}
  .chapter-head h1{font-size:24px}
  .section h2{font-size:19px}
  body{font-size:15.5px}
  .overlay{position:fixed;inset:0;background:var(--overlay);z-index:35;display:none}
  .overlay.show{display:block}
}
/* ---------- Print: pure white, ink-saving ---------- */
@media print{.book-title{color:#000!important;border-bottom:2px solid #000!important}.book-title:empty::before{content:''!important}}
@media print{
  html{
    --bg:#fff;--panel:#fff;--panel2:#fff;--text:#000;--muted:#000;--line:#000;
    --accent:#000;--para:#000;--badge-bg:#fff;--mark-bg:#fff;--img-shadow:none;
  }
  body{background:#fff!important;color:#000!important;font-size:11pt}
  .topbar,.sidebar,.progress,.totop,.lightbox,.overlay,.chapter-head .badge{display:none!important}
  .layout{display:block;padding:0}
  .main{margin:0;padding:0}
  .paper{max-width:none}
  .chapter{margin-bottom:24px;page-break-after:auto}
  .chapter-head{border-bottom:1px solid #000;padding-bottom:8px;margin-bottom:16px}
  .chapter-head h1{font-size:20pt;color:#000}
  .section h2{border-left:2px solid #000;color:#000;font-size:14pt}
  .para,.top-para,.cap{color:#000!important}
  .figure img{border:1px solid #000;box-shadow:none;max-width:100%}
  mark{background:none;color:#000;font-weight:bold}
}

/* ===== reading time ===== */
.rt-wrap{position:relative;flex:none;display:inline-flex}
.read-timer{display:inline-flex;align-items:center;gap:6px;height:34px;color:var(--muted);font-size:13px;font-weight:600;background:transparent;border:1px solid var(--line);border-radius:8px;padding:0 10px;white-space:nowrap;cursor:pointer;font-family:inherit}
.read-timer:hover{border-color:var(--accent);color:var(--accent)}
.read-timer .rt-dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.read-timer.live .rt-dot{background:var(--accent);box-shadow:0 0 0 3px rgba(14,148,136,.16)}
.read-timer b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:700}
.rt-pop{position:absolute;right:0;top:calc(100% + 8px);z-index:300;width:262px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:0 12px 34px rgba(0,0,0,.13);display:none;text-align:left;font-weight:400;font-size:13px;line-height:1.6}
.rt-pop.show{display:block}
.rt-pop h4{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:700}
.rt-pop .rt-big{font-size:22px;color:var(--accent);font-weight:800;margin-bottom:8px;font-variant-numeric:tabular-nums}
.rt-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.rt-row:last-child{border-bottom:0}
.rt-row span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-row b{color:var(--text);font-variant-numeric:tabular-nums;flex:none}
.rt-bars{display:flex;align-items:flex-end;gap:4px;height:58px;margin:8px 0 6px}
.rt-bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.rt-bar i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.rt-bar.today i{opacity:1;box-shadow:0 0 0 1px var(--deep)}
.rt-bar em{font-size:10px;font-style:normal;color:var(--muted);white-space:nowrap}
.rt-tip{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
@media(max-width:720px){.read-timer{height:30px;padding:0 7px;font-size:12px}.rt-label{display:none}.rt-pop{right:-40px;width:242px}}
@media print{.rt-wrap,.rt-pop{display:none!important}}

/* MOBUI-v1 */@media(max-width:720px){.undo-btn{display:none!important}.split-reader{display:none!important}}
</style>



<style id="simpleEditStyle">
/* ===== SIMPLE-EDIT-v2 默认纯阅读 + 按需改字 ===== */
/* 只有正在编辑的那一段才有提示框；其余段落保持纯阅读，无任何框 */
/* DUPTITLE-v1 正文首段与标题重复时隐藏该行（不删DOM，仅视觉隐藏）*/
.dup-title-line{display:none!important}
.dup-title-line + p{margin-top:0}
@media print{.dup-title-line{display:none!important}}
/* BOOKTITLE-v1 书名大标题（空白可编辑）*/
.book-title{font-size:30px;font-weight:800;line-height:1.35;color:var(--text);
  margin:6px 0 26px;padding:0 0 14px;border-bottom:2px solid var(--accent);
  cursor:text;outline:none;min-height:1em}
.book-title:empty::before{content:'点击此处输入书名大标题…';color:var(--muted);font-weight:600;opacity:.7}
[data-pid].se-editing{outline:1px solid var(--amber);outline-offset:2px;border-radius:2px;cursor:text;background:rgba(251,191,36,.05)}
/* 改过的段落：极轻左边框痕迹（打印去掉） */
/* EDITUI-FIX: 改字后不再显示橙色竖框，段落保持纯阅读外观 */
/* 文字被删空的段落：隐藏整段（含残留竖线装饰），撤销后自动恢复 */

<script id="sitedata" type="application/json">[{"id":"u1","title":"Unit 1　最佳交易策略概览简介","icon":"1","sections":[],"blocks":[{"t":"para","text":"价格行为最佳交易策略","pid":"p0"},{"t":"para","text":"Unit 1 最佳交易策略概览/简介","pid":"p1"},{"t":"para","text":"4种最佳交易形态","pid":"p2"},{"t":"para","text":"1.主要趋势反转","pid":"p3"},{"t":"img","src":"assets/img/u01_000.webp","ilabel":"U1-1","icap":"最佳交易策略概览简介","fid":"fig1","ctx":[{"t":"4种最佳交易形态","p":"p2"},{"t":"1.主要趋势反转","p":"p3"},{"t":"交易者只在趋势初期入场，多数反转尝试会失败，交易者仅等待主要趋势反转也可以获利，若能掌握多种交易形态和策略，将更为完善。","p":"p4"},{"t":"2.回调（当价格接近趋势线或EMA均线时入场的策略）","p":"p5"}]},{"t":"para","text":"交易者只在趋势初期入场，多数反转尝试会失败，交易者仅等待主要趋势反转也可以获利，若能掌握多种交易形态和策略，将更为完善。","pid":"p4"},{"t":"para","text":"2.回调（当价格接近趋势线或EMA均线时入场的策略）","pid":"p5"},{"t":"img","src":"assets/img/u01_001.webp","ilabel":"U1-2","icap":"最佳交易策略概览简介","fid":"fig2","ctx":[{"t":"交易者只在趋势初期入场，多数反转尝试会失败，交易者仅等待主要趋势反转也可以获利，若能掌握多种交易形态和策略，将更为完善。","p":"p4"},{"t":"2.回调（当价格接近趋势线或EMA均线时入场的策略）","p":"p5"},{"t":"3.震荡区间反转","p":"p6"}]},{"t":"para","text":"3.震荡区间反转","pid":"p6"},{"t":"img","src":"assets/img/u01_002.webp","ilabel":"U1-3","icap":"最佳交易策略概览简介","fid":"fig3","ctx":[{"t":"3.震荡区间反转","p":"p6"},{"t":"4.突破 （需要技巧和情绪的把控）若能将前面3种结合，将覆盖大多数交易日的行情。","p":"p7"}]},{"t":"para","text":"4.突破 （需要技巧和情绪的把控）若能将前面3种结合，将覆盖大多数交易日的行情。","pid":"p7"},{"t":"img","src":"assets/img/u01_003.webp","ilabel":"U1-4","icap":"最佳交易策略概览简介","fid":"fig4","ctx":[{"t":"4.突破 （需要技巧和情绪的把控）若能将前面3种结合，将覆盖大多数交易日的行情。","p":"p7"}]}],"wcount":178},{"id":"u2","title":"Unit 2　价格行为本质解析（问题1-3）- 日内交易洞见","icon":"2","sections":[],"blocks":[{"t":"para","text":"Unit 2 价格行为本质解析（问题1-3）- 日内交易洞见","pid":"p8"},{"t":"para","text":"1.价格行为是什么?","pid":"p9"},{"t":"para","text":"价格行为：图表上每个上涨会下跌的tick跳动就是价格行为，市场在运动，运动就是行为，阿尔所感兴趣的是市场在过去多根K线中的表现，交易者认为市场的运动并非随机，而是基于动量进行交易，押注市场会延续之前的走势。图表上最近的K线会很重要，左边10-20根K线比前100根K线更重要，代表背景。","pid":"p10"},{"t":"para","text":"为什么有志成为交易者的新手，应该对价格行为产生兴趣？","pid":"p11"},{"t":"para","text":"因为几乎所有的盈利交易者在交易时，都在某种程度上使用价格行为，机构会看支撑和阻力，当价格到达这一区域是反转还是突破。他们想在支撑位买入阻力位卖出。","pid":"p12"},{"t":"para","text":"2.交易者能否仅靠这里介绍的4种最佳交易形态谋生？如果可以应该如何学习和应用这些形态？","pid":"p13"},{"t":"para","text":"交易者一开始都是从1-2种交易形态开始的，但是掌握的工具越多，你获利的机会就越多。一开始交易一种自己觉得交易起来比较舒服的形态。直到你能熟练，能够盈利，然后再开始尝试添加其他的交易形态。","pid":"p14"},{"t":"para","text":"3.在市场背景中解读价格行为非常重要，如果背景是指左边的所有K线，那我们应该回溯多远的左侧，交易者如何知道何时或在何处停止向左看？你对此的看法是否同样适用于所有市场，所有时间框架？","pid":"p15"},{"t":"para","text":"当我谈论背景时，我指的是左边的K线，最近的K线比很久以前的K线更重要，你偶尔会看看周线图和月线图，市场常常会在月线支撑阻力位发生大幅波动。日内交易观察左边50,80，100根左右的K线。价格行为在所有市场和时间框架都成立。交易是基于基因的，基于人类的理想行为，这种行为导致了图表上可预测可重复的形态。价格行为是一种可靠的交易方式。","pid":"p16"}],"wcount":673},{"id":"u3","title":"Unit 3　价格行为本质解析（问题4-6）- 日内交易洞见","icon":"3","sections":[],"blocks":[{"t":"para","text":"Unit 3 价格行为本质解析（问题4-6）- 日内交易洞见","pid":"p17"},{"t":"para","text":"4.许多交易者发现学习价格行为非常困难，学习K线形态常被宣传为一种简单的交易方式，交易价格行为和K线交易有何不同？","pid":"p18"},{"t":"para","text":"如果简单记住10-15种交易形态就可以赚钱，那么所有机构都会这样做，这样就没人来做交易的对手盘了，交易永远都是困难的，没有完美的交易。一笔完美的交易意味着你有很高的概率获得大回报，同时风险却很小，你认为会有机构做这笔交易的对手盘吗？市场总是在对抗完美交易，总是在对抗高盈亏比风险回报比的交易，正因如此，市场通常在一个概率介于40%-60%之间，且风险回报比不是特别理想的区间内运行。作为交易者要赚钱，你只需要比普通人做得更好，只要非常努力，任何人都可以做到。交易并不轻松，你是在与比你聪明试图拿走你钱的人竞争，他们试图从所有人那里赚钱，并且不会让你轻易得手。你必须非常努力，不仅需要大量学习和研究，还必须培养个人性格技能，最重要的是必须感到舒适自在，这需要不断地尝试，找到适合自己的交易形态和管理策略。","pid":"p19"},{"t":"para","text":"如果把这件事当做终身职业，除了赚钱，快乐也很重要。不要与市场对抗，不要与任何事情对抗，必须坦然接受市场的走势，必须以一种让你快乐的方式进行交易。你必须不断地尝试，尝试不同的时间框架，不同的风格，押注突破，押注主要趋势反转，押注震荡区间反转，不要交易低于5分钟的时间框架，低时间框架会让你没办法快速决策，并犯很多的错误。大多数交易者一开始不应该进行剥头皮交易，不要参与幅度小于最小剥头皮幅度的交易，这样赚钱会非常困难。大多数交易者的目标至少应该是其风险的两倍。","pid":"p20"},{"t":"para","text":"5.你广受欢迎的价格行为交易书记提到了为严肃交易者提供的技术分析，你如何定义严肃交易者？你是否暗示不够严肃的交易者，不应该尝试学习价格行为？","pid":"p21"},{"t":"para","text":"在我的第一本书中，我谈到了为严肃交易者而交易，但是因为我认为除非你认真对待此事，否则你无法赚钱，这不是一种爱好，因为你是在与非常聪明的人竞争，你必须严肃对待你必须致力于做好它。如果你没有投入大量时间学习就去做，那你就是在赌博，而且你会亏钱，例如如果你去赌场赌博，你会输钱，如果你去赌场玩21点，但没有非常努力和长期的研究如何玩好21点你也会输钱。然而真正优秀的21点玩家可以在赌场持续赚钱，尽管从理论上讲胜算对他们不利。真正优秀的体育博彩玩家也能在赌场赚钱，尽管他们必须克服大约10%的交易成本。但这可以做到，真正优秀的交易者如果非常努力，也能赚钱，并且他们可以持续赚钱。我经常收到一些做的非常非常好的交易者的消息，他们几乎每个人都花费大量时间研究图表。他们每天都打印图表，他们寻找形态，然后他们会回顾一周前，两周前，一个月前就说，嘿，我看到过相同的形态，该形态的某种变异，交易者工作都非常努力，这意味着工作时间要比你认为要的更长，每天只交易1小时左右也能盈利，多年前我有个朋友，我和他在一个聊天室里一起交易了好几年，他每一笔交易都做100手债券合约。他每天只想着赚点蝇头小利，钱一到手就立马收工，他亲口跟我说，我收工是因为复盘多年，发现每天85%的利润都来自开盘第1小时。我不想为剩下15%的利润耗一整天，否则第二天会精疲力尽，我必须保持精神抖擞的状态，这样才能在早盘黄金时段稳稳赚钱。","pid":"p22"},{"t":"para","text":"第6个问题，普通人能靠价格行为交易谋生吗？若学习需要具备哪些特质？","pid":"p23"},{"t":"para","text":"我认为任何人都能学会价格行为，就像人们能掌握各种技能，学会开车，掌握外语。价格行为交易同样可以学会，但这需要时间沉淀，如同学习外语需要持续投入。做好交易都需要大量时间。没错，任何人都可能成为稳定盈利的交易者，但必须全情投入且个性契合。关键要找到让自己舒适的交易模式，乐在其中，毫无压力，能持续盈利的操作方式。","pid":"p24"},{"t":"para","text":"需要具备哪些个人特质？最重要的特质是全力以赴的决心，必须有破釜沉舟的意志。此外，极度坦诚也至关重要。你必须对自己100%诚实，犯错时不要自责，初学阶段犯错很正常，就像刚学外语，会说错话。苛责自己毫无意义。要做自己最坚定的支持者，相信只要坚持做对的事，修正错误终将盈利。新手用不了多久就能赚到可观收入。但起步时亏损往往盖过所有正确操作。早期盈利的诀窍在于减少错误交易。如果只看上周盈利的交易，你会惊叹自己表现出色，但检视亏损单时又会懊恼，这里犯错，那里失误，若能剔除这些失误，剩下的都是盈利单，自然就持续赚钱了。而纠正错误需要严格纪律。接受常犯的毛病，是抱着这次或许能成的侥幸心理开仓，心想一两小时没交易了，该有好机会的话就做这单，这绝非正确交易方式，在我的聊天室里，交易员常听我说。这单我不做，那单放弃，或者市场横盘震荡，没有交易机会，我交易只为赚钱，当前形态根本赚不到钱，学会按兵不动，耐心等待才是真本事。新手的通病是死亡恐惧。害怕交易梦想破灭，他们初始账户通常很小，总担心亏光本金。生怕账户余额跌破保证金门槛，被经纪商禁止交易。这种亏损焦虑导致他们只盯着风险。结果总是设置极小止损点。这种止损常与市场走势脱节。止损设得太紧，必然亏钱。过早平掉盈利单同样导致亏损。根源就在于新手过度关注风险，其实每笔交易都需权衡三大要素，而非单看风险。需综合考量风险，盈利空间和概率。概率永远存在不确定性，因此必须平衡风险与回报，算清每笔交易的风险回报比。唯一不确定的是概率，但任何图表上90%时段的多头盈利概率在40%-60%之间。空头盈利概率也在40%-60%，这意味着除了10%的强势突破行情，无论做多做空，你至少有40%盈利概率。要确保盈利公式成立，只需设定两倍与风险的盈利目标。任何交易都追求风险回报比，用两倍盈利空间覆盖风险。因为图表90%时段的盈利概率在40%-60%区间，即使概率低至40%，坚持剩下10%的情况概率会突破40%-60%区间，当市场出现强烈突破走势时，延续概率往往超70%，这种时候必须顺突破方向交易。","pid":"p25"}],"wcount":2378},{"id":"u4","title":"Unit 4　价格行为本质解析（问题7-9）- 日内交易洞见","icon":"4","sections":[],"blocks":[{"t":"para","text":"Unit 4 价格行为本质解析（问题7-9）- 日内交易洞见","pid":"p26"},{"t":"para","text":"第7个问题，有些菜鸟交易员苦于抽不出时间去交易，也许正职工作消耗太多时间和精力。若新手每天只能投入2小时交易，您有何建议？","pid":"p27"},{"t":"para","text":"我提过有位朋友每天只交一个小时，却赚得盆满钵满。他住着豪宅，日子过得相当滋润，我还有位70多岁的退休老友，与他线上交易多年。他习惯每天开盘交易2小时之后出门办事。重点在于当你掌握正确的交易技巧并善加管理时，根本无需全天盯盘。许多无法全天盯盘的交易者会选择操作大周期图表，比如60分钟图，4小时图或日线图。这也是最佳的交易方式，例如我常根据日线，周线图操作期权，持仓数日甚至数周。只要管理得当，就同样是高盈利模式。认真考虑交易者必须保证日均投入2小时以上。但是时间越长越好，可交易2小时，但每日或尽可能抽更多时间学习，这是合理的学习节奏。常收到交易者来信，他们身兼正直数月后每隔一两小时交易，稳定盈利，问我该何时辞职？我的回答始终如一，当交易收入，持平正职薪资，尤其日均只需工作2小时时，就该削减正职时间，增加交易，市场才是你的收入源泉。多位交易员来信提到他们在其他领域表现优异，但转战交易后收益激增，最终选择转行。成为职业交易员。","pid":"p28"},{"t":"para","text":"第8个问题，新手常听专家说要爆仓几次。甚至多次爆仓才能真正学会交易，您认同吗？","pid":"p29"},{"t":"para","text":"认为必须反复亏光本金才能稳定盈利的人，简直愚蠢。尤其在当下外汇市场支持微型手数交易时，更不必经历多次爆仓。外汇市场其实是绝佳的新手起步地。比如欧元兑美元交易，许多经纪商提供1万甚至1000单位的微型合约。我知道有人会说交易1万单位根本赚不到钱，确实如此，但你收获的是宝贵经验。在训练交易技巧的同时保住账户。单笔风险仅10美元，目标盈利10-30日美元时，小账户能支撑很久而不爆仓。都为你培养稳定盈利能力提供成长空间。这正是外汇市场的魅力所在，你能找到支持微型交易的经纪商。虽难致富，但更不易破产。且获得真金白银的实战机会。必须严格控制模拟交易量。务必尽早用实盘操作，因为人性会说谎。我自己的手法，初学交易时做模拟盘，收盘后总把亏损交易换掉，借口说实盘绝不会做这笔。还添加漏掉的盈利交易辩称这单明显能赚，只是上厕所，错过了模拟交易，必然导致自欺欺人。但操作外汇微型账户时，你无需欺骗自己，每分盈亏都清晰可见，这使你更快走上正道。","pid":"p30"},{"t":"para","text":"第9个问题，在您的交易成长路上，何时顿悟放弃原有方法而专注价格行为？","pid":"p31"},{"t":"para","text":"我的交易始于80年代，约30年前，那时充斥欺诈，虽无网络，但杂志书籍把交易说得轻松简单，我聘请导师购买各类课程，耗费巨资，却全是垃圾，交易领域并非简单线性关系，工作10小时赚X美元，20小时赚2X美元，收益从不与时长成正比，单纯拼命绝不保证盈利，盲目模仿他人同样不行。交易生涯的转折点在于，当你看着图表，感觉这是合理交易，不再翻书查资料，不看技术指标，不盲从电视荐股，完全自主决策并承担盈亏后果。当你自行出手并妥善管理交易时，就迎来重大突破。任何时候市场涨跌概率都是五五开，明日上涨概率50%，下跌同样50%，电视荐股毫无价值，记得我说过，任何时刻买卖都有40%-60%盈利概率，真正关键是交易管理。止损设在哪里，顺势如何移动止损？走势背离预期时何时离场？当行情远超预期强度时，是否调整盈利目标，扩大盈利空间，交易管理才是盈利核心。如前所述，日内任何点位买卖可能盈利90%，管理得当就能赚钱。买入后下跌逢低加仓仍可盈利，做空后上涨，高位加仓仍能赚钱。买卖时机并非关键，因为任意时间买卖可能通过管理盈利，核心在于科学管理，懂得设置止损位，移动止损时机，调整盈利目标和调整原则，洞悉前提条件失效的时刻，当市场变化否定原有判断时，果断离场，这才是真正的盈利之道。","pid":"p32"}],"wcount":1520},{"id":"u5","title":"Unit 5　价格行为本质解析（问题10-13）- 日内交易洞见","icon":"5","sections":[],"blocks":[{"t":"para","text":"Unit 5 价格行为本质解析（问题10-13）- 日内交易洞见","pid":"p33"},{"t":"para","text":"第10个问题。若您现在是30岁的新手交易员，面对众多交易品种会如何学习交易？实现稳定盈利需要多久？","pid":"p34"},{"t":"para","text":"新手起步时面对海量信息其中多数要么无用，要么欺诈，要么与个性不符。因成功交易者都深谙价格行为，初学者必须掌握此道。K线形态纯属骗局，死记硬背形态根本赚不到钱。关键要懂形态何时有效并学会管理交易，最核心的是每日复盘图表，寻找重复形态并思考若在此处买入止损该设哪里？若在此处卖出止损点何在？合理盈利目标如何设定？需领悟支撑阻力原理，洞悉交易启动特征，终结信号及离场时机。这才是核心要义，我的brooks trading course应是首选教材，也属业内最系统课程，实为理想起点。稳定盈利需要耗时多久？个体差异极大，我耗时10载才摸出门道。你只需专注看盘，CNBC频道成功交易员。他们只用线图,不看K线图，关注支撑阻力与动量，这正是你该效仿的。掌握这些便是通晓价格行为，做到便能稳定盈利，在1-3年内达成属合理预期。","pid":"p35"},{"t":"para","text":"第11个问题，若只能给新手一条建议会是什么？","pid":"p36"},{"t":"para","text":"忠于本心。词语出自沙翁哈姆雷特,与交易者尤为真理，此乃弱肉强食的行当。你需为每笔交易负全责，若总想有人牵手引导，渴望神明庇护，期盼导师相助。这绝非职业之道，真正职业是练就本领，笃信技能，妥善管理交易，保持客观，坚守判断。学会正确操作，无需太久。能在关键时刻严格执行。人总自欺欺人，找借口，突破规则。但规则永远适用，故纪律当为第一素养。坚守规则，相信概率终将兑现，即使仅40-50%胜率，合理交易与管理，必能盈利。","pid":"p37"},{"t":"para","text":"第12个问题，经历众多访谈，可有您期待却被忽视的重要问题？","pid":"p38"},{"t":"para","text":"常人畅想职业交易员时，总先浮现富豪形象。自然关联金钱带来的收益生活。令我惊讶的是众人沉迷金钱愉悦，却无人问及赚钱过程是否有趣。他们跳过赚钱过程，只聚焦金钱带来的享受。竟无人问我交易是否快乐。生命漫长，若长期从事某事，必须确保乐在其中。意味着找到契合个性的交易方式。我每日期待开盘下单。交易过程愉悦，时刻保持松弛，从不惊诧于行情纵欲罕见波动。感觉新奇有趣，但绝不焦躁抗争。若市场走势超预期，立刻调整策略，顺应趋势。故建议每位志向交易者莫仅憧憬暴富后的欢愉，更要追求赚钱过程的幸福感。人生重在旅程而非终点，需构建让自己乐在其中的方式，让每日交易成为快乐源泉，必须享受过程。","pid":"p39"},{"t":"para","text":"第13个问题，还有何话想对听众说。","pid":"p40"},{"t":"para","text":"最后强调，幸福乃是人生要义。你选择此为职业，固然图谋致富，但致富途径万千，可收购运输公司，创立保洁企业，投资房地产等。经营连锁赛百味或理发店即可致富。行行皆通财富路。若你志在以交易致富，切记保持快乐的心境。需找到让自己享受其中内心平和的交易方式，每笔交易总有焦虑。纵使交易30载，我每每开单仍会兴奋。但终日心态平和且快乐，我真心热爱这份事业，生以为乐死，当为终极目标，超越金钱，重在立德，适合个性。乐在其中的事业之道。","pid":"p41"}],"wcount":1204},{"id":"u6","title":"Unit 6　捕捉波段交易机会","icon":"6","sections":[],"blocks":[{"t":"para","text":"Unit 6：捕捉波段交易机会","pid":"p42"},{"t":"img","src":"assets/img/u06_004.webp","ilabel":"U6-1","icap":"捕捉波段交易机会","fid":"fig5","ctx":[{"t":"Unit 6：捕捉波段交易机会","p":"p42"},{"t":"我认为对多数交易者而言，波段交易应是业务根基，这意味着每天应寻找一至三笔交易机会。若遇此般多头趋势未及早入场，则捕捉多头旗型，静待趋势延续，当旗型出现突破回测时二次买入，持仓直至趋势失效或交易时段结束。盈亏比至少二，切忌过早离场，若在此处波段建仓，别因蝇头小利再次了结，此为刮头皮行为，同理，此处买入后莫因K线有上影线而匆忙抛售，需持仓量至交易时段终止或原交易逻辑失效，切记要等待符合技术逻辑的出场位置，再获利了结.例如时段末的高潮和反转点，即理想止盈位，待反转下行时获利了结。(可以忽略看总结即可）","p":"p43"},{"t":"(此段总结：当市场否定原有的判断时，应该果断离场。最重要的是每日复盘图表，并思考在此处买入/卖出的止损位置，合理的盈利目标。需要理解支撑阻力原理。","p":"p44"},{"t":"练就本领，笃信技能，妥善管理交易，保持客观，坚守判断。难在坚持执行。真正做到职业，享受赚钱的过程。","p":"p45"},{"t":"波段交易：2倍盈亏比，一天至少会有1-3次的波段交易机会。（上涨趋势中不要因为出现长上影线就提前离场，只有在原先逻辑不存在，或是达到目标位后再离场。)","p":"p46"}]},{"t":"para","text":"我认为对多数交易者而言，波段交易应是业务根基，这意味着每天应寻找一至三笔交易机会。若遇此般多头趋势未及早入场，则捕捉多头旗型，静待趋势延续，当旗型出现突破回测时二次买入，持仓直至趋势失效或交易时段结束。盈亏比至少二，切忌过早离场，若在此处波段建仓，别因蝇头小利再次了结，此为刮头皮行为，同理，此处买入后莫因K线有上影线而匆忙抛售，需持仓量至交易时段终止或原交易逻辑失效，切记要等待符合技术逻辑的出场位置，再获利了结.例如时段末的高潮和反转点，即理想止盈位，待反转下行时获利了结。(可以忽略看总结即可）","pid":"p43"},{"t":"para","text":"(此段总结：当市场否定原有的判断时，应该果断离场。最重要的是每日复盘图表，并思考在此处买入/卖出的止损位置，合理的盈利目标。需要理解支撑阻力原理。","pid":"p44"},{"t":"para","text":"练就本领，笃信技能，妥善管理交易，保持客观，坚守判断。难在坚持执行。真正做到职业，享受赚钱的过程。","pid":"p45"},{"t":"para","text":"波段交易：2倍盈亏比，一天至少会有1-3次的波段交易机会。（上涨趋势中不要因为出现长上影线就提前离场，只有在原先逻辑不存在，或是达到目标位后再离场。)","pid":"p46"}],"wcount":462},{"id":"u7","title":"Unit 7　主要趋势反转","icon":"7","sections":[],"blocks":[{"t":"para","text":"Unit 7：主要趋势反转","pid":"p47"},{"t":"img","src":"assets/img/u07_005.webp","ilabel":"U7-1","icap":"主要趋势反转","fid":"fig6","ctx":[{"t":"Unit 7：主要趋势反转","p":"p47"},{"t":"（顶部）主要趋势反转的构成要件：","p":"p48"},{"t":"1.需要先有上涨趋势，后跌破上涨趋势线，观察后续走势恢复的情况。","p":"p49"},{"t":"2.观察是否形成低点抬高/降低的高点，是否形成双顶。","p":"p50"},{"t":"3.好的反转信号K线（光头光脚K线，K线的实体大于前面的多数K线）。","p":"p51"},{"t":"几乎所有的反转都是主要趋势反转的变体（三角形，楔形牛旗，双底，更高低点主要趋势反转）","p":"p52"}]},{"t":"para","text":"（顶部）主要趋势反转的构成要件：","pid":"p48"},{"t":"para","text":"1.需要先有上涨趋势，后跌破上涨趋势线，观察后续走势恢复的情况。","pid":"p49"},{"t":"para","text":"2.观察是否形成低点抬高/降低的高点，是否形成双顶。","pid":"p50"},{"t":"para","text":"3.好的反转信号K线（光头光脚K线，K线的实体大于前面的多数K线）。","pid":"p51"},{"t":"para","text":"几乎所有的反转都是主要趋势反转的变体（三角形，楔形牛旗，双底，更高低点主要趋势反转）","pid":"p52"},{"t":"img","src":"assets/img/u07_006.webp","ilabel":"U7-2","icap":"主要趋势反转","fid":"fig7","ctx":[{"t":"3.好的反转信号K线（光头光脚K线，K线的实体大于前面的多数K线）。","p":"p51"},{"t":"几乎所有的反转都是主要趋势反转的变体（三角形，楔形牛旗，双底，更高低点主要趋势反转）","p":"p52"},{"t":"下跌趋势中，空头突破趋势线需要足够的强劲，可以在突破趋势线上方买入，止损设于多头趋势底部下方。或在此K线上方二次入场，经历一轮，两轮，三轮，四轮推升，当前尝试突破多头通道顶部75%概率，并在5根K线内失败，最终向下突破。可沿这些K线绘制趋势线，关键在出现大幅抛售。虽为深度跌破趋势线，但高位快速回落，显示强劲卖压能否在楔形下方做空？此属微型双顶小阳线上涨后回落大阳线再涨后下跌。通道顶部是做空位，此为楔形形态可再次做空，亦可视为更高高点主要趋势反转，此处强势下跌，趋势突破更高高点。通道如此狭窄时属低概率交易，然而当前再度上行形成系列顶部。又称双顶，微型双顶，次高点主要趋势反转或头肩顶形态。（下跌趋势中，向上突破必须强而有力，突破后多头若在通道顶部连续失败、出现楔形与微型双顶，并伴随高位快速回落和强劲卖压，则该区域更倾向于主要趋势反转，通道顶部与楔形下方都是合理的做空区域，但需警惕狭窄通道下的整体低概率环境。）","p":"p53"},{"t":"所有头肩顶皆为次高点主要趋势反转无一例外，但非所有次高点趋势反转都是头肩顶。可能缺左肩。反转下行，做空首次入场效果欠佳，此处上升通道极窄，二次或三次入场更佳，此处出现阴线属高概率做空点。预期至少两段下跌，但凡三段推升，即三推楔形，即便形态不明显。楔形反转下行时通常至少两段下跌，一回调二回调三。（所有的头肩顶都属于次高点趋势反转，上涨趋势中楔形反转至少会有两段式下跌。）","p":"p54"}]},{"t":"para","text":"下跌趋势中，空头突破趋势线需要足够的强劲，可以在突破趋势线上方买入，止损设于多头趋势底部下方。或在此K线上方二次入场，经历一轮，两轮，三轮，四轮推升，当前尝试突破多头通道顶部75%概率，并在5根K线内失败，最终向下突破。可沿这些K线绘制趋势线，关键在出现大幅抛售。虽为深度跌破趋势线，但高位快速回落，显示强劲卖压能否在楔形下方做空？此属微型双顶小阳线上涨后回落大阳线再涨后下跌。通道顶部是做空位，此为楔形形态可再次做空，亦可视为更高高点主要趋势反转，此处强势下跌，趋势突破更高高点。通道如此狭窄时属低概率交易，然而当前再度上行形成系列顶部。又称双顶，微型双顶，次高点主要趋势反转或头肩顶形态。（下跌趋势中，向上突破必须强而有力，突破后多头若在通道顶部连续失败、出现楔形与微型双顶，并伴随高位快速回落和强劲卖压，则该区域更倾向于主要趋势反转，通道顶部与楔形下方都是合理的做空区域，但需警惕狭窄通道下的整体低概率环境。）","pid":"p53"},{"t":"para","text":"所有头肩顶皆为次高点主要趋势反转无一例外，但非所有次高点趋势反转都是头肩顶。可能缺左肩。反转下行，做空首次入场效果欠佳，此处上升通道极窄，二次或三次入场更佳，此处出现阴线属高概率做空点。预期至少两段下跌，但凡三段推升，即三推楔形，即便形态不明显。楔形反转下行时通常至少两段下跌，一回调二回调三。（所有的头肩顶都属于次高点趋势反转，上涨趋势中楔形反转至少会有两段式下跌。）","pid":"p54"},{"t":"img","src":"assets/img/u07_007.webp","ilabel":"U7-3","icap":"主要趋势反转","fid":"fig8","ctx":[{"t":"下跌趋势中，空头突破趋势线需要足够的强劲，可以在突破趋势线上方买入，止损设于多头趋势底部下方。或在此K线上方二次入场，经历一轮，两轮，三轮，四轮推升，当前尝试突破多头通道顶部75%概率，并在5根K线内失败，最终向下突破。可沿这些K线绘制趋势线，关键在出现大幅抛售。虽为深度跌破趋势线，但高位快速回落，显示强劲卖压能否在楔形下方做空？此属微型双顶小阳线上涨后回落大阳线再涨后下跌。通道顶部是做空位，此为楔形形态可再次做空，亦可视为更高高点主要趋势反转，此处强势下跌，趋势突破更高高点。通道如此狭窄时属低概率交易，然而当前再度上行形成系列顶部。又称双顶，微型双顶，次高点主要趋势反转或头肩顶形态。（下跌趋势中，向上突破必须强而有力，突破后多头若在通道顶部连续失败、出现楔形与微型双顶，并伴随高位快速回落和强劲卖压，则该区域更倾向于主要趋势反转，通道顶部与楔形下方都是合理的做空区域，但需警惕狭窄通道下的整体低概率环境。）","p":"p53"},{"t":"所有头肩顶皆为次高点主要趋势反转无一例外，但非所有次高点趋势反转都是头肩顶。可能缺左肩。反转下行，做空首次入场效果欠佳，此处上升通道极窄，二次或三次入场更佳，此处出现阴线属高概率做空点。预期至少两段下跌，但凡三段推升，即三推楔形，即便形态不明显。楔形反转下行时通常至少两段下跌，一回调二回调三。（所有的头肩顶都属于次高点趋势反转，上涨趋势中楔形反转至少会有两段式下跌。）","p":"p54"},{"t":"4.主要趋势反转需要背景和信号：","p":"p55"},{"t":"若交易主要趋势反转，需先确认背景，多头趋势及跌破上涨趋势线，力度越强越好，K线数量越多越好。建议至少5-20根K线，波动幅度显著，虽多数横盘，仍属有效跌破上涨趋势线，且持续时间长，理想情况下，跌破趋势线应触及均线。若触及则越多越好，K线越多表明空方势力越强，越可能掌控局面。观察跌破多头趋势线，趋势恢复失败。创新高后失败，是更高高点主要趋势反转。此例是次高点主要趋势反转，二次入场做空点，首次入场后在此K线下方二次入场，在此做空合理,最后出现第二段下跌，第一次回调，楔形推升，后两段下跌。40%主要趋势反转引发大幅波动，60%导致小赚小亏，打平离场。本例即小额盈利案例。此观点极具实操价值，观察此K线高点，高点与均线兼存缺口，存在缺口K线，此乃强势信号，空方不仅跌破多头趋势线及均线，更能将K线实体完全压制于均线下方，预示多头动能衰竭。通常多头中出现缺口K线后趋势恢复。恢复通常常导致主要趋势反转或反转尝试。缺口K线出现往往预示多头终结或至少转入交易区间。本例转为空头趋势。重回趋势线后可确认跌破。随后多头趋势恢复，两度尝试转跌，首次，二次入场做空点，二次入场概率稍高。配合优质卖出信号K线。","p":"p56"},{"t":"此段落总结：典型结构总结：多头趋势 → 强力跌破趋势线（触及均线）→ 楔形推升回抽（趋势恢复尝试）→ 二次入场信号 → 两段式下跌反转。","p":"p57"},{"t":"核心：主要趋势反转的核心在于观察原趋势破位后的恢复力度，通过“次高点”与“均线缺口 K 线”确认多头终结，并优先选择二次信号入场。","p":"p58"},{"t":"（跌破趋势线力量越强越好，阴线数量越多越好，理想情况下跌破趋势线最好触及均线。40%的情况下会引发大幅波动。）","p":"p59"}]},{"t":"para","text":"4.主要趋势反转需要背景和信号：","pid":"p55"},{"t":"para","text":"若交易主要趋势反转，需先确认背景，多头趋势及跌破上涨趋势线，力度越强越好，K线数量越多越好。建议至少5-20根K线，波动幅度显著，虽多数横盘，仍属有效跌破上涨趋势线，且持续时间长，理想情况下，跌破趋势线应触及均线。若触及则越多越好，K线越多表明空方势力越强，越可能掌控局面。观察跌破多头趋势线，趋势恢复失败。创新高后失败，是更高高点主要趋势反转。此例是次高点主要趋势反转，二次入场做空点，首次入场后在此K线下方二次入场，在此做空合理,最后出现第二段下跌，第一次回调，楔形推升，后两段下跌。40%主要趋势反转引发大幅波动，60%导致小赚小亏，打平离场。本例即小额盈利案例。此观点极具实操价值，观察此K线高点，高点与均线兼存缺口，存在缺口K线，此乃强势信号，空方不仅跌破多头趋势线及均线，更能将K线实体完全压制于均线下方，预示多头动能衰竭。通常多头中出现缺口K线后趋势恢复。恢复通常常导致主要趋势反转或反转尝试。缺口K线出现往往预示多头终结或至少转入交易区间。本例转为空头趋势。重回趋势线后可确认跌破。随后多头趋势恢复，两度尝试转跌，首次，二次入场做空点，二次入场概率稍高。配合优质卖出信号K线。","pid":"p56"},{"t":"para","text":"此段落总结：典型结构总结：多头趋势 → 强力跌破趋势线（触及均线）→ 楔形推升回抽（趋势恢复尝试）→ 二次入场信号 → 两段式下跌反转。","pid":"p57"},{"t":"para","text":"核心：主要趋势反转的核心在于观察原趋势破位后的恢复力度，通过“次高点”与“均线缺口 K 线”确认多头终结，并优先选择二次信号入场。","pid":"p58"},{"t":"para","text":"（跌破趋势线力量越强越好，阴线数量越多越好，理想情况下跌破趋势线最好触及均线。40%的情况下会引发大幅波动。）","pid":"p59"},{"t":"img","src":"assets/img/u07_008.webp","ilabel":"U7-4","icap":"主要趋势反转","fid":"fig9","ctx":[{"t":"核心：主要趋势反转的核心在于观察原趋势破位后的恢复力度，通过“次高点”与“均线缺口 K 线”确认多头终结，并优先选择二次信号入场。","p":"p58"},{"t":"（跌破趋势线力量越强越好，阴线数量越多越好，理想情况下跌破趋势线最好触及均线。40%的情况下会引发大幅波动。）","p":"p59"},{"t":"第二高点低于第一高点,是次高点主要趋势反转，多头趋势，空头突破，次高点微型双顶，K线下方二次入场做空。（双顶很少是完美的，通常是高点抬高，高点降低的双顶。所有主要趋势反转顶部皆为双顶变体，无论第二顶部低于或等于还是高于前顶。）","p":"p60"}]},{"t":"para","text":"第二高点低于第一高点,是次高点主要趋势反转，多头趋势，空头突破，次高点微型双顶，K线下方二次入场做空。（双顶很少是完美的，通常是高点抬高，高点降低的双顶。所有主要趋势反转顶部皆为双顶变体，无论第二顶部低于或等于还是高于前顶。）","pid":"p60"},{"t":"img","src":"assets/img/u07_009.webp","ilabel":"U7-5","icap":"主要趋势反转","fid":"fig10","ctx":[{"t":"第二高点低于第一高点,是次高点主要趋势反转，多头趋势，空头突破，次高点微型双顶，K线下方二次入场做空。（双顶很少是完美的，通常是高点抬高，高点降低的双顶。所有主要趋势反转顶部皆为双顶变体，无论第二顶部低于或等于还是高于前顶。）","p":"p60"},{"t":"此案例中，多头趋势跌破趋势线，K线数量少，可能在此形成小型反转。（注：小型反转指回调和交易区间，而非反向趋势。）此间上下震荡皆属小型反转，跌破均线后约10根K线时，需警惕主要反转可能。另持续约20根K线的窄幅交易区间出现后趋势恢复概率降至近50%，与空头反转概率持平。多头趋势后出现20根K线的交易区间，表明多头动能减弱。有趋势恢复的概率，但基本各占50%。此处出现优质做空信号K线，窄幅区间内做空合理。盈利概率多数主要趋势反转，仅40%概率引发盈利波段交易。余下60%为小赚小亏。欲提高胜率，需放弃此类机会，40%胜率过低，应等待此形态，大阴线收于最低点，跌破前20-30根K线低点。此时做空盈利概率极高，止损可设于此或此上方，皆属合理止损位。这次至少预期测量移动的目标。一段下跌回调，第二段下跌，基于此K线实体高度向下投射在强势空头突破后做空可显著提升胜率。大阴线突破后做空此处概率远高于窄幅区间内做空。选择高概率做空点需接受更差的风险回报比。可收盘做空或等待小幅反弹后与阴线反转位做空。两根收于最低点的大阴线，跌破前低下行概率极高，此可称低一，低二做空，第一段下跌回调，第二段下跌或第一段回调，第二段回调，第三段形态命名非关键，本质是次高点主要趋势反转。","p":"p61"}]},{"t":"para","text":"此案例中，多头趋势跌破趋势线，K线数量少，可能在此形成小型反转。（注：小型反转指回调和交易区间，而非反向趋势。）此间上下震荡皆属小型反转，跌破均线后约10根K线时，需警惕主要反转可能。另持续约20根K线的窄幅交易区间出现后趋势恢复概率降至近50%，与空头反转概率持平。多头趋势后出现20根K线的交易区间，表明多头动能减弱。有趋势恢复的概率，但基本各占50%。此处出现优质做空信号K线，窄幅区间内做空合理。盈利概率多数主要趋势反转，仅40%概率引发盈利波段交易。余下60%为小赚小亏。欲提高胜率，需放弃此类机会，40%胜率过低，应等待此形态，大阴线收于最低点，跌破前20-30根K线低点。此时做空盈利概率极高，止损可设于此或此上方，皆属合理止损位。这次至少预期测量移动的目标。一段下跌回调，第二段下跌，基于此K线实体高度向下投射在强势空头突破后做空可显著提升胜率。大阴线突破后做空此处概率远高于窄幅区间内做空。选择高概率做空点需接受更差的风险回报比。可收盘做空或等待小幅反弹后与阴线反转位做空。两根收于最低点的大阴线，跌破前低下行概率极高，此可称低一，低二做空，第一段下跌回调，第二段下跌或第一段回调，第二段回调，第三段形态命名非关键，本质是次高点主要趋势反转。","pid":"p61"},{"t":"img","src":"assets/img/u07_010.webp","ilabel":"U7-6","icap":"主要趋势反转","fid":"fig11","ctx":[{"t":"此案例中，多头趋势跌破趋势线，K线数量少，可能在此形成小型反转。（注：小型反转指回调和交易区间，而非反向趋势。）此间上下震荡皆属小型反转，跌破均线后约10根K线时，需警惕主要反转可能。另持续约20根K线的窄幅交易区间出现后趋势恢复概率降至近50%，与空头反转概率持平。多头趋势后出现20根K线的交易区间，表明多头动能减弱。有趋势恢复的概率，但基本各占50%。此处出现优质做空信号K线，窄幅区间内做空合理。盈利概率多数主要趋势反转，仅40%概率引发盈利波段交易。余下60%为小赚小亏。欲提高胜率，需放弃此类机会，40%胜率过低，应等待此形态，大阴线收于最低点，跌破前20-30根K线低点。此时做空盈利概率极高，止损可设于此或此上方，皆属合理止损位。这次至少预期测量移动的目标。一段下跌回调，第二段下跌，基于此K线实体高度向下投射在强势空头突破后做空可显著提升胜率。大阴线突破后做空此处概率远高于窄幅区间内做空。选择高概率做空点需接受更差的风险回报比。可收盘做空或等待小幅反弹后与阴线反转位做空。两根收于最低点的大阴线，跌破前低下行概率极高，此可称低一，低二做空，第一段下跌回调，第二段下跌或第一段回调，第二段回调，第三段形态命名非关键，本质是次高点主要趋势反转。","p":"p61"},{"t":"此案例多头趋势跌破趋势线。但首次反转转为多头旗型，实为多头趋势中的回调，观察趋势恢复，并在前高附近再次失败，此形态规模较小，难以判断主要反转或区间内小型反转，但做空逻辑成立。形成楔形顶部，价格在2-3次推升后跌破趋势线，多根阴线后恢复上行，但力度疲弱。阳线实体不大，持续收缩，顶部出现长上影线，可见交易者在此处持续卖出。存在主要趋势反转可能，做空合理。更高概率做法是等待强势突破后，做空，此处三根阴线，且实体扩大。至少再有一段下跌。后续两段下跌。可称楔形顶部反转形态，但简化为次高点主要趋势反转。重申主要趋势反转仅40%概率引发反向波段交易。此处做空40%概率波段下跌到60%概率横盘小赚小亏，打平离场。但40%波段交易概率仍具价值。","p":"p62"},{"t":"交易主要趋势反转，时间站在你这边，可从容观察形态展开充分预判，准备深度思考策略，且管理相对简单，规则体系不复杂。","p":"p63"}]},{"t":"para","text":"此案例多头趋势跌破趋势线。但首次反转转为多头旗型，实为多头趋势中的回调，观察趋势恢复，并在前高附近再次失败，此形态规模较小，难以判断主要反转或区间内小型反转，但做空逻辑成立。形成楔形顶部，价格在2-3次推升后跌破趋势线，多根阴 幅度至少达到1/3，在2次入场的阳线上方买入。成功反转通常至少两段上涨，最终多数反转演变成大型交易区间。","p":"p74"}]},{"t":"para","text":"底部主要趋势反转形成的条件：","pid":"p73"},{"t":"para","text":"1.需要有一段空头趋势。2.强势突破，回调后至少有第二段上涨，回调幅度至少达到1/3，在2次入场的阳线上方买入。成功反转通常至少两段上涨，最终多数反转演变成大型交易区间。","pid":"p74"}],"wcount":766},{"id":"u9","title":"Unit 9　小幅趋势反转","icon":"9","sections":[],"blocks":[{"t":"para","text":"Unit 9：小幅趋势反转","pid":"p75"},{"t":"img","src":"assets/img/u09_016.webp","ilabel":"U9-1","icap":"小幅趋势反转","fid":"fig17","ctx":[{"t":"Unit 9：小幅趋势反转","p":"p75"}]},{"t":"img","src":"assets/img/u09_017.webp","ilabel":"U9-2","icap":"小幅趋势反转","fid":"fig18","ctx":[{"t":"反转信号K线或结构不够清晰、力度不足，通常意味着趋势不会立刻反转。小反转只是暂停下跌，常见于下跌后横盘或形成继续下跌前的旗形整理。布鲁克斯强调，多头要反转空头趋势，必须连续多根带有下影线或阳线的K线，显示持续买盘。如果买盘不强，多头的小趋势通常只能用于短线剥头皮，而不是能持有的波段行情。","p":"p76"}]},{"t":"para","text":"反转信号K线或结构不够清晰、力度不足，通常意味着趋势不会立刻反转。小反转只是暂停下跌，常见于下跌后横盘或形成继续下跌前的旗形整理。布鲁克斯强调，多头要反转空头趋势，必须连续多根带有下影线或阳线的K线，显示持续买盘。如果买盘不强，多头的小趋势通常只能用于短线剥头皮，而不是能持有的波段行情。","pid":"p76"}],"wcount":157},{"id":"u10","title":"Unit 10　主要趋势反转示例","icon":"10","sections":[],"blocks":[{"t":"para","text":"Unit 10：主要趋势反转示例","pid":"p77"},{"t":"para","text":"在本视频中，我将展示几个主要趋势反转的例子，我给出一个更高高点主要趋势反转，首先你需要一个多头趋势，然后需要跌破多头趋势线，你希望在这次突破中看到空头展现力量的一些迹象，其中之一是你希望这次下跌去测试移动平均线的有时它未能触及移动平均线，如果能触及甚至跌破移动平均线是更好，因为那将是空头强劲的信号。并且增加了他们很快就能控制市场的可能性。所以在跌破趋势线之后，你希望多头趋势恢复并测试多头趋势的高点，由于这是一个更高高点主要趋势反转，我寻找一个测试向上超过先前高点的走势，最后我需要一个好的做空信号K线。","pid":"p78"},{"t":"img","src":"assets/img/u10_018.webp","ilabel":"U10-1","icap":"主要趋势反转示例","fid":"fig19","ctx":[{"t":"Unit 10：主要趋势反转示例","p":"p77"},{"t":"在本视频中，我将展示几个主要趋势反转的例子，我给出一个更高高点主要趋势反转，首先你需要一个多头趋势，然后需要跌破多头趋势线，你希望在这次突破中看到空头展现力量的一些迹象，其中之一是你希望这次下跌去测试移动平均线的有时它未能触及移动平均线，如果能触及甚至跌破移动平均线是更好，因为那将是空头强劲的信号。并且增加了他们很快就能控制市场的可能性。所以在跌破趋势线之后，你希望多头趋势恢复并测试多头趋势的高点，由于这是一个更高高点主要趋势反转，我寻找一个测试向上超过先前高点的走势，最后我需要一个好的做空信号K线。","p":"p78"},{"t":"这里我们有一个多头趋势，它跌破了移动平均线，那是空头强劲的信号，它不仅跌破了移动平均线而且形成了一根K线完全处于移动平均线之下，这个线的高点在移动平均线之下方，形成均线缺口，是空头相当强劲的情况，60%的情况下，当你获得多头趋势的恢复，市场在出现缺口K线后会尝试某种类型的主要趋势反转。当多头趋势恢复时，你预期一个反转的尝试，所有主要顶部趋势反转都是双顶的变体，因此即使这个高点远高于此高点，我仍然认为它是一种双顶，而这轮上涨仅仅是对旧高点的测试。一个相当窄的通道，我不会在阳线下方做空，我至少希望看到一个小型的双顶，在这里，我们有一个上涨到这里下跌，然后再次上涨。然后我在这里得到了一个微型双顶，所以在那个阴线下方做空具有更高概率，因为这是第二次入场做空，如果有第二次入场，你经历了上涨下跌再上涨则是多头趋势进一步走弱的信号。大多数更高高点主要趋势反转最终都会跟随一个更低高点主要趋势反转。","p":"p79"}]},{"t":"para","text":"这里我们有一个多头趋势，它跌破了移动平均线，那是空头强劲的信号，它不仅跌破了移动平均线而且形成了一根K线完全处于移动平均线之下，这个线的高点在移动平均线之下方，形成均线缺口，是空头相当强劲的情况，60%的情况下，当你获得多头趋势的恢复，市场在出现缺口K线后会尝试某种类型的主要趋势反转。当多头趋势恢复时，你预期一个反转的尝试，所有主要顶部趋势反转都是双顶的变体，因此即使这个高点远高于此高点，我仍然认为它是一种双顶，而这轮上涨仅仅是对旧高点的测试。一个相当窄的通道，我不会在阳线下方做空，我至少希望看到一个小型的双顶，在这里，我们有一个上涨到这里下跌，然后再次上涨。然后我在这里得到了一个微型双顶，所以在那个阴线下方做空具有更高概率，因为这是第二次入场做空，如果有第二次入场，你经历了上涨下跌再上涨则是多头趋势进一步走弱的信号。大多数更高高点主要趋势反转最终都会跟随一个更低高点主要趋势反转。","pid":"p79"},{"t":"img","src":"assets/img/u10_019.webp","ilabel":"U10-2","icap":"主要趋势反转示例","fid":"fig20","ctx":[{"t":"这里我们有一个多头趋势，它跌破了移动平均线，那是空头强劲的信号，它不仅跌破了移动平均线而且形成了一根K线完全处于移动平均线之下，这个线的高点在移动平均线之下方，形成均线缺口，是空头相当强劲的情况，60%的情况下，当你获得多头趋势的恢复，市场在出现缺口K线后会尝试某种类型的主要趋势反转。当多头趋势恢复时，你预期一个反转的尝试，所有主要顶部趋势反转都是双顶的变体，因此即使这个高点远高于此高点，我仍然认为它是一种双顶，而这轮上涨仅仅是对旧高点的测试。一个相当窄的通道，我不会在阳线下方做空，我至少希望看到一个小型的双顶，在这里，我们有一个上涨到这里下跌，然后再次上涨。然后我在这里得到了一个微型双顶，所以在那个阴线下方做空具有更高概率，因为这是第二次入场做空，如果有第二次入场，你经历了上涨下跌再上涨则是多头趋势进一步走弱的信号。大多数更高高点主要趋势反转最终都会跟随一个更低高点主要趋势反转。","p":"p79"},{"t":"大多数更高高点主要趋势反转最终都会跟随一个更低高点主要趋势反转。","p":"p80"},{"t":"我们有一个多头趋势，我们跌破了趋势线，我们有一个更高的高点，这里你可以称之为三角形态，我们有一个空头突破，所以这是一个更高高点主要的趋势反转，我不会在第一次卖出，但第二次概率更高或第三次概率甚至更高。现在开始下跌，然后我们得到一个更低高点，再继续下跌更多，所以这是一个更低高点主要趋势反转。你无法看到这里有多少根K线，你无法看到信号K线的样子，让我们看这边放大的部分。你可以看到这里的三重顶或三角形态，以及这里的更低高点主要趋势反转。你有一个K线两段上涨退出一次回调对移动平均线进行测试。在阴线下方卖出是合理的，这里你试图反转向上，我们有一个双顶，更低高点，主要趋势反转和一个微型双顶上涨，然后下跌，然后再上涨，你可以在这个微型双顶的颈线下方卖出，也就是在这根阳线的下方或者你可以等待在那个阴线下方卖出。","p":"p81"}]},{"t":"para","text":"大多数更高高点主要趋势反转最终都会跟随一个更低高点主要趋势反转。","pid":"p80"},{"t":"para","text":"我们有一个多头趋势，我们跌破了趋势线，我们有一个更高的高点，这里你可以称之为三角形态，我们有一个空头突破，所以这是一个更高高点主要的趋势反转，我不会在第一次卖出，但第二次概率更高或第三次概率甚至更高。现在开始下跌，然后我们得到一个更低高点，再继续下跌更多，所以这是一个更低高点主要趋势反转。你无法看到这里有多少根K线，你无法看到信号K线的样子，让我们看这边放大的部分。你可以看到这里的三重顶或三角形态，以及这里的更低高点主要趋势反转。你有一个K线两段上涨退出一次回调对移动平均线进行测试。在阴线下方卖出是合理的，这里你试图反转向上，我们有一个双顶，更低高点，主要趋势反转和一个微型双顶上涨，然后下跌，然后再上涨，你可以在这个微型双顶的颈线下方卖出，也就是在这根阳线的下方或者你可以等待在那个阴线下方卖出。","pid":"p81"},{"t":"img","src":"assets/img/u10_020.webp","ilabel":"U10-3","icap":"主要趋势反转示例","fid":"fig21","ctx":[{"t":"大多数更高高点主要趋势反转最终都会跟随一个更低高点主要趋势反转。","p":"p80"},{"t":"我们有一个多头趋势，我们跌破了趋势线，我们有一个更高的高点，这里你可以称之为三角形态，我们有一个空头突破，所以这是一个更高高点主要的趋势反转，我不会在第一次卖出，但第二次概率更高或第三次概率甚至更高。现在开始下跌，然后我们得到一个更低高点，再继续下跌更多，所以这是一个更低高点主要趋势反转。你无法看到这里有多少根K线，你无法看到信号K线的样子，让我们看这边放大的部分。你可以看到这里的三重顶或三角形态，以及这里的更低高点主要趋势反转。你有一个K线两段上涨退出一次回调对移动平均线进行测试。在阴线下方卖出是合理的，这里你试图反转向上，我们有一个双顶，更低高点，主要趋势反转和一个微型双顶上涨，然后下跌，然后再上涨，你可以在这个微型双顶的颈线下方卖出，也就是在这根阳线的下方或者你可以等待在那个阴线下方卖出。","p":"p81"},{"t":"这是一张欧元兑美元的15分钟图表，你有一个多头趋势,市场横盘，三推上涨持续20或30根K线，空头力量不够强大，无法让市场大幅下跌，但（窄交易区间）足够强大，阻止了多头趋势长达20或30分K线的上涨，所以这仍然是空头合理的力量。我将寻找多头趋势的恢复，然后等待多头趋势失败，它确实失败，这是一种双顶，是一个更高高点的主要趋势反转。如果你愿意，你可以称此为最后的多头趋势，或者你可以称其为一个最终旗型主要趋势反转。你可以称其为楔形更高高点的趋势反转，但这是一个合理的主要趋势反转，再出现一个主要趋势反转，下跌后通常在更高高点主要趋势反转之后，你会得到一个更低高点主要趋势反转。它是三次推高，上涨，下跌，上涨，停顿然后再上涨。在这里卖出可能不是一个高概率交易，但风险回报比不错，你的止损就在上方一点点。大家看到一个强劲的空头突破之后卖出具有更高的概率，可在第一次突破这里，但我在二次突破位置做空，所有这些做空点位概率都更高，因为此时我们知道空头很强劲，属于一个空头趋势，即使在这下跌也是空头趋势，而且通道相当紧密，所以很可能我们至少会走低一点点。","p":"p82"}]},{"t":"para","text":"这是一张欧元兑美元的15分钟图表，你有一个多头趋势,市场横盘，三推上涨持续20或30根K线，空头力量不够强大，无法让市场大幅下跌，但（窄交易区间）足够强大，阻止了多头趋势长达20或30分K线的上涨，所以这仍然是空头合理的力量。我将寻找多头趋势的恢复，然后等待多头趋势失败，它确实失败，这是一种双顶，是一个更高高点的主要趋势反转。如果你愿意，你可以称此为最后的多头趋势，或者你可以称其为一个最终旗型主要趋势反转。你可以称其为楔形更高高点的趋势反转，但这是一个合理的主要趋势反转，再出现一个主要趋势反转，下跌后通常在更高高点主要趋势反转之后，你会得到一个更低高点主要趋势反转。它是三次推高，上涨，下跌，上涨，停顿然后再上涨。在这里卖出可能不是一个高概率交易，但风险回报比不错，你的止损就在上方一点点。大家看到一个强劲的空头突破之后卖出具有更高的概率，可在第一次突破这里，但我在二次突破位置做空，所有这些做空点位概率都更高，因为此时我们知道空头很强劲，属于一个空头趋势，即使在这下跌也是空头趋势，而且通道相当紧密，所以很可能我们至少会走低一点点。","pid":"p82"},{"t":"img","src":"assets/img/u10_021.webp","ilabel":"U10-4","icap":"主要趋势反转示例","fid":"fig22","ctx":[{"t":"这是一张欧元兑美元的15分钟图表，你有一个多头趋势,市场横盘，三推上涨持续20或30根K线，空头力量不够强大，无法让市场大幅下跌，但（窄交易区间）足够强大，阻止了多头趋势长达20或30分K线的上涨，所以这仍然是空头合理的力量。我将寻找多头趋势的恢复，然后等待多头趋势失败，它确实失败，这是一种双顶，是一个更高高点的主要趋势反转。如果你愿意，你可以称此为最后的多头趋势，或者你可以称其为一个最终旗型主要趋势反转。你可以称其为楔形更高高点的趋势反转，但这是一个合理的主要趋势反转，再出现一个主要趋势反转，下跌后通常在更高高点主要趋势反转之后，你会得到一个更低高点主要趋势反转。它是三次推高，上涨，下跌，上涨，停顿然后再上涨。在这里卖出可能不是一个高概率交易，但风险回报比不错，你的止损就在上方一点点。大家看到一个强劲的空头突破之后卖出具有更高的概率，可在第一次突破这里，但我在二次突破位置做空，所有这些做空点位概率都更高，因为此时我们知道空头很强劲，属于一个空头趋势，即使在这下跌也是空头趋势，而且通道相当紧密，所以很可能我们至少会走低一点点。","p":"p82"},{"t":"我想稍微谈谈更低高点主要趋势反转。这里我们有一个疲弱的多头趋势，你不知道左边的K线是什么样子，他们可能是一个非常强劲的多头趋势的一部分，但无论如何我们有一个多头趋势，一个非常强劲的空头突破，一个更低高点以及一个微型双顶。这是恢复多头趋势的尝试，我们有一个双顶,第二个高点低于第一个高点，但它仍然是一个试图恢复多头趋势，但在前高点附近失败的尝试，所以它是一种双顶形态。这轮上涨未能超过空头腿顶部，它位于空头腿边中部某个位置，作为空头会卖出，他们会卖出每次反转尝试，押注每次尝试都会失败并形成另一个更低高点，并且空头通道将继续下行。交易者会下一个止损单在卖出信号K线的低点之下卖出，这里有个内包K线ib，然后是一个小型微型双顶的突破，两段上涨相当于一次两段回调，带有一个微型双顶，是合理的卖出点位。这里有一个更大的双顶是合理的卖出点位，然后这里两段上涨，一次两段回调然后横盘。这里一个小的双顶带有一个做空信号K线构成了一个更低高点。","p":"p83"}]},{"t":"para","text":"我想稍微谈谈更低高点主要趋势反转。这里我们有一个疲弱的多头趋势，你不知道左边的K线是什么样子，他们可能是一个非常强劲的多头趋势的一部分，但无论如何我们有一个多头趋势，一个非常强劲的空头突破，一个更低高点以及一个微型双顶。这是恢复多头趋势的尝试，我们有一个双顶,第二个高点低于第一个高点，但它仍然是一个试图恢复多头趋势，但在前高点附近失败的尝试，所以它是一种双顶形态。这轮上涨未能超过空头腿顶部，它位于空头腿边中部某个位置，作为空头会卖出，他们会卖出每次反转尝试，押注每次尝试都会失败并形成另一个更低高点，并且空头通道将继续下行。交易者会下一个止损单在卖出信号K线的低点之下卖出，这里有个内包K线ib，然后是一个小型微型双顶的突破，两段上涨相当于一次两段回调，带有一个微型双顶，是合理的卖出点位。这里有一个更大的双顶是合理的卖出点位，然后这里两段上涨，一次两段回调然后横盘。这里一个小的双顶带有一个做空信号K线构成了一个更低高点。","pid":"p83"},{"t":"img","src":"assets/img/u10_022.webp","ilabel":"U10-5","icap":"主要趋势反转示例","fid":"fig23","ctx":[{"t":"我想稍微谈谈更低高点主要趋势反转。这里我们有一个疲弱的多头趋势，你不知道左边的K线是什么样子，他们可能是一个非常强劲的多头趋势的一部分，但无论如何我们有一个多头趋势，一个非常强劲的空头突破，一个更低高点以及一个微型双顶。这是恢复多头趋势的尝试，我们有一个双顶,第二个高点低于第一个高点，但它仍然是一个试图恢复多头趋势，但在前高点附近失败的尝试，所以它是一种双顶形态。这轮上涨未能超过空头腿顶部，它位于空头腿边中部某个位置，作为空头会卖出，他们会卖出每次反转尝试，押注每次尝试都会失败并形成另一个更低高点，并且空头通道将继续下行。交易者会下一个止损单在卖出信号K线的低点之下卖出，这里有个内包K线ib，然后是一个小型微型双顶的突破，两段上涨相当于一次两段回调，带有一个微型双顶，是合理的卖出点位。这里有一个更大的双顶是合理的卖出点位，然后这里两段上涨，一次两段回调然后横盘。这里一个小的双顶带有一个做空信号K线构成了一个更低高点。","p":"p83"},{"t":"这里有一个多头趋势强劲的空头突破，我们有一个双顶更低高点,我可以这样画趋势线，这是跌破多头趋势线，并且这次突破仅仅走向了横盘，没关系，这是一个双顶更低高点主要趋势反转，每当你有一个常见的多头趋势，然后是一个持续大于20根K线左右的紧密交易区间，在这个紧密交易区间内部有一个双顶，你必须时刻考虑主要趋势反转的可能性，这里的双顶略低于此高点。对我来说这是所谓带有双顶高点的紧密交易区间，形成更低高点的主要趋势反转，这是一个合理的做空点，有40%概率走出一段下跌波段。只要市场持续形成更低高点，它就仍处于空头通道中，波段交易者将继续持仓，而其他交易者将继续卖出，卖出每次回调后然后在每次强劲突破之后，比如这里我们获得了一次跌至新低的强劲突破。交易者会将他们止损收紧至前高点上方。强劲突破后，也会将止损设在这里上方，强劲突破，因此这成为一个主要的更低高点，交易者将止损设在此处。强劲突破主要的更低高点，交易者将止损设在那儿上方一点，你在寻找向下的反转，你希望空头趋势恢复，你希望所有试图反转进入多头趋势的努力都失败，以寻求在卖出时将止损设在前一根K线低点下方一点，只要市场继续形成主要的更低高点，空头就仍在掌控之中。","p":"p84"}]},{"t":"para","text":"这里有一个多头趋势强劲的空头突破，我们有一个双顶更低高点,我可以这样画趋势线，这是跌破多头趋势线，并且这次突破仅仅走向了横盘，没关系，这是一个双顶更低高点主要趋势反转，每当你有一个常见的多头趋势，然后是一个持续大于20根K线左右的紧密交易区间，在这个紧密交易区间内部有一个双顶，你必须时刻考虑主要趋势反转的可能性，这里的双顶略低于此高点。对我来说这是所谓带有双顶高点的紧密交易区间，形成更低高点的主要趋势反转，这是一个合理的做空点，有40%概率走出一段下跌波段。只要市场持续形成更低高点，它就仍处于空头通道中，波段交易者将继续持仓，而其他交易者将继续卖出，卖出每次回调后然后在每次强劲突破之后，比如这里我们获得了一次跌至新低的强劲突破。交易者会将他们止损收紧至前高点上方。强劲突破后，也会将止损设在这里上方，强劲突破，因此这成为一个主要的更低高点，交易者将止损设在此处。强劲突破主要的更低高点，交易者将止损设在那儿上方一点，你在寻找向下的反转，你希望空头趋势恢复，你希望所有试图反转进入多头趋势的努力都失败，以寻求在卖出时将止损设在前一根K线低点下方一点，只要市场继续形成主要的更低高点，空头就仍在掌控之中。","pid":"p84"},{"t":"img","src":"assets/img/u10_023.webp","ilabel":"U10-6","icap":"主要趋势反转示例","fid":"fig24","ctx":[{"t":"这里有一个多头趋势强劲的空头突破，我们有一个双顶更低高点,我可以这样画趋势线，这是跌破多头趋势线，并且这次突破仅仅走向了横盘，没关系，这是一个双顶更低高点主要趋势反转，每当你有一个常见的多头趋势，然后是一个持续大于20根K线左右的紧密交易区间，在这个紧密交易区间内部有一个双顶，你必须时刻考虑主要趋势反转的可能性，这里的双顶略低于此高点。对我来说这是所谓带有双顶高点的紧密交易区间，形成更低高点的主要趋势反转，这是一个合理的做空点，有40%概率走出一段下跌波段。只要市场持续形成更低高点，它就仍处于空头通道中，波段交易者将继续持仓，而其他交易者将继续卖出，卖出每次回调后然后在每次强劲突破之后，比如这里我们获得了一次跌至新低的强劲突破。交易者会将他们止损收紧至前高点上方。强劲突破后，也会将止损设在这里上方，强劲突破，因此这成为一个主要的更低高点，交易者将止损设在此处。强劲突破主要的更低高点，交易者将止损设在那儿上方一点，你在寻找向下的反转，你希望空头趋势恢复，你希望所有试图反转进入多头趋势的努力都失败，以寻求在卖出时将止损设在前一根K线低点下方一点，只要市场继续形成主要的更低高点，空头就仍在掌控之中。","p":"p84"},{"t":"这里我们有一个多头趋势，我们跌破了一个非常紧密的多头通道。这里正在发生一些重要的事情，这些K线的高点都在移动平均线下方，所以空头不仅阻止了多头趋势长达20根K线，而且强大到足以形成一根K线完全处于移动平均线下方，当这种情况发生时，有60%的概率多头趋势的恢复，将产生一个主要趋势反转的做空形态。因此多头趋势出现空头突破，趋势恢复X形成更高高点主要趋势反转。这是一种双顶，连接这个高点和那个高点，这是一个双顶。在下跌过程中情况相同，所以我们一路到这里都是空头趋势，多头非常强劲，值得一些K线包完全处于移动平均线上方，这些K线的低点在移动平均线上方，所以与移动平均线之间存在缺口，当空头趋势恢复时有60%的概率空头失败，而多头将能够至少尝试一次主要趋势反转，而这里多头成功了。一个双重底其中第二个底部略低于第一个，因此它是一个更低低点主要趋势反转。","p":"p85"}]},{"t":"para","text":"这里我们有一个多头趋势，我们跌破了一个非常紧密的多头通道。这里正在发生一些重要的事情，这些K线的高点都在移动平均线下方，所以空头不仅阻止了多头趋势长达20根K线，而且强大到足以形成一根K线完全处于移动平均线下方，当这种情况发生时，有60%的概率多头趋势的恢复，将产生一个主要趋势反转的做空形态。因此多头趋势出现空头突破，趋势恢复X形成更高高点主要趋势反转。这是一种双顶，连接这个高点和那个高点，这是一个双顶。在下跌过程中情况相同，所以我们一路到这里都是空头趋势，多头非常强劲，值得一些K线包完全处于移动平均线上方，这些K线的低点在移动平均线上方，所以与移动平均线之间存在缺口，当空头趋势恢复时有60%的概率空头失败，而多头将能够至少尝试一次主要趋势反转，而这里多头成功了。一个双重底其中第二个底部略低于第一个，因此它是一个更低低点主要趋势反转。","pid":"p85"},{"t":"img","src":"assets/img/u10_024.webp","ilabel":"U10-7","icap":"主要趋势反转示例","fid":"fig25","ctx":[{"t":"这里我们有一个多头趋势，我们跌破了一个非常紧密的多头通道。这里正在发生一些重要的事情，这些K线的高点都在移动平均线下方，所以空头不仅阻止了多头趋势长达20根K线，而且强大到足以形成一根K线完全处于移动平均线下方，当这种情况发生时，有60%的概率多头趋势的恢复，将产生一个主要趋势反转的做空形态。因此多头趋势出现空头突破，趋势恢复X形成更高高点主要趋势反转。这是一种双顶，连接这个高点和那个高点，这是一个双顶。在下跌过程中情况相同，所以我们一路到这里都是空头趋势，多头非常强劲，值得一些K线包完全处于移动平均线上方，这些K线的低点在移动平均线上方，所以与移动平均线之间存在缺口，当空头趋势恢复时有60%的概率空头失败，而多头将能够至少尝试一次主要趋势反转，而这里多头成功了。一个双重底其中第二个底部略低于第一个，因此它是一个更低低点主要趋势反转。","p":"p85"},{"t":"向上突破趋势线，然后创出新低，这是一个更低低点主要趋势反转，它没有演变成多头趋势，而是变成了一个双顶空头旗型，然后我们得到另一个下跌腿，目标位是根据那个双顶空头旗型颈线高度计算的测量移动下跌目标。现在我们正试图获得另一个更低低点，主要趋势反转的尝试机会。一个跌破双重底的空头突破头突破，但目前失败，如果你愿意可以称其为楔形，因为这是三次向下推动，每当你有一个双重底，你经历了两次向下推动，第一次推动回调，第二次推动，而当双重底开始反转向上失败，你得到一个空头突破，然后这个空头突破也是失败了，你就经历了三次向下推动第一次，第二次，第三次，即使他看起来不像楔形，但市场力量与楔形相同，我个人在这种情况中会称其为跌破双重底的失败突破，或一个更低点主要趋势反转，你得到了一个多头趋势的开端，并且大多数更低低点主要趋势反转，最终会跟随更高低点主要趋势反转。","p":"p86"}]},{"t":"para","text":"向上突破趋势线，然后创出新低，这是一个更低低点主要趋势反转，它没有演变成多头趋势，而是变成了一个双顶空头旗型，然后我们得到另一个下跌腿，目标位是根据那个双顶空头旗型颈线高度计算的测量移动下跌目标。现在我们正试图获得另一个更低低点，主要趋势反转的尝试机会。一个跌破双重底的空头突破头突破，但目前失败，如果你愿意可以称其为楔形，因为这是三次向下推动，每当你有一个双重底，你经历了两次向下推动，第一次推动回调，第二次推动，而当双重底开始反转向上失败，你得到一个空头突破，然后这个空头突破也是失败了，你就经历了三次向下推动第一次，第二次，第三次，即使他看起来不像楔形，但市场力量与楔形相同，我个人在这种情况中会称其为跌破双重底的失败突破，或一个更低点主要趋势反转，你得到了一个多头趋势的开端，并且大多数更低低点主要趋势反转，最终会跟随更高低点主要趋势反转。","pid":"p86"},{"t":"img","src":"assets/img/u10_025.webp","ilabel":"U10-8","icap":"主要趋势反转示例","fid":"fig26","ctx":[{"t":"向上突破趋势线，然后创出新低，这是一个更低低点主要趋势反转，它没有演变成多头趋势，而是变成了一个双顶空头旗型，然后我们得到另一个下跌腿，目标位是根据那个双顶空头旗型颈线高度计算的测量移动下跌目标。现在我们正试图获得另一个更低低点，主要趋势反转的尝试机会。一个跌破双重底的空头突破头突破，但目前失败，如果你愿意可以称其为楔形，因为这是三次向下推动，每当你有一个双重底，你经历了两次向下推动，第一次推动回调，第二次推动，而当双重底开始反转向上失败，你得到一个空头突破，然后这个空头突破也是失败了，你就经历了三次向下推动第一次，第二次，第三次，即使他看起来不像楔形，但市场力量与楔形相同，我个人在这种情况中会称其为跌破双重底的失败突破，或一个更低点主要趋势反转，你得到了一个多头趋势的开端，并且大多数更低低点主要趋势反转，最终会跟随更高低点主要趋势反转。","p":"p86"},{"t":"空头趋势，你在这里得到一个双重底，是对双重底主要趋势反转的一次尝试，行情考验了一个底部，但失败了，然后一个强劲的反转向上形成了一个更低低点主要趋势反转，你可以称其为一个双重底。连接这个底部和那个底部，即使他们价格不同，我只是称其为一个更低低点，主要趋势反转，但我会将其视为一种双重底，或者我这里有一个双重底，或失败的双重底。或者我也将其视为楔形，稍微有三次向下推动，一次推动回调是第二次，再回调是第三次，无论如何它是一个更低低点主要趋势反转。之后反转向上相当强劲，大多数更低低点主要趋势反转之后会跟随更高低点主要趋势反转。并且你通常会得到多个更高低点，所以这是主要反转吗？还是这个才是，有些计算机会说这实在不足以构成一个主要反转。也许这个才是更高低点主要趋势反转，没关系，这个无关紧要，你得到了一个更低低点主要趋势反转，也许这里是一个微小的更高低点。我不知道这个，我看到这个低点与那个突破点之间存在缺口，所以反转相当强劲。关键在于每当你有一个更低低点主要趋势反转时，要关注买入更高低点主要趋势反转的机会，因为大多数更低点主要趋势反转之后会跟随更高低点主要趋势反转，所以你可以设置止损（突破）买单不买在这个阳线高点上方一个点，或者在这根阳线上方，或者在那根阳线上方，或者在这里在那根K线上方获得了一个多头旗型。你也可以在K线下方买入押注当一轮上涨像这样强劲时空头反转会失败，所以你可以简单的下一个限价单在K线的低点买入，并将止损设置在最近的一个主要更高低点下方。主要的更高低点，一个更高低点之后伴随了一轮强劲的上涨，创出高于前高点的新高，强劲上涨创出新高，因此这里成为一个主要的更高低点。在此之后，任何时间点买入，你的止损都应设在此下方。同样你可以在阳线收盘时买入，也可以在阴线收盘买入。这里反转向上，相当强劲，K线实体在变大，K线收盘在自身高点，然后出现一个阴性，这有多大可能会反转向下，概率很小，所以多头会在阴线收盘时买入，这里的情况也一样，非常强劲的上涨，空头有多大，可能用这次突破获得一次成功的反转，这个空头趋势K线是一次突破啊，正式成为跌破一个多头旗型。空头突破成功的概率有多大？可能只有40%或更低，所以多头会在那个阴线收盘时买入押住空头会失败。","p":"p87"}]},{"t":"para","text":"空头趋势，你在这里得到一个双重底，是对双重底主要趋势反转的一次尝试，行情考验了一个底部，但失败了，然后一个强劲的反转向上形成了一个更低低点主要趋势反转，你可以称其为一个双重底。连接这个底部和那个底部，即使他们价格不同，我只是称其为一个更低低点，主要趋势反转，但我会将其视为一种双重底，或者我这里有一个双重底，或失败的双重底。或者我也将其视为楔形，稍微有三次向下推动，一次推动回调是第二次，再回调是第三次，无论如何它是一个更低低点主要趋势反转。之后反转向上相当强劲，大多数更低低点主要趋势反转之后会跟随更高低点主要趋势反转。并且你通常会得到多个更高低点，所以这是主要反转吗？还是这个才是，有些计算机会说这实在不足以构成一个主要反转。也许这个才是更高低点主要趋势反转，没关系，这个无关紧要，你得到了一个更低低点主要趋势反转，也许这里是一个微小的更高低点。我不知道这个，我看到这个低点与那个突破点之间存在缺口，所以反转相当强劲。关键在于每当你有一个更低低点主要趋势反转时，要关注买入更高低点主要趋势反转的机会，因为大多数更低点主要趋势反转之后会跟随更高低点主要趋势反转，所以你可以设置止损（突破）买单不买在这个阳线高点上方一个点，或者在这根阳线上方，或者在那根阳线上方，或者在这里在那根K线上方获得了一个多头旗型。你也可以在K线下方买入押注当一轮上涨像这样强劲时空头反转会失败，所以你可以简单的下一个限价单在K线的低点买入，并将止损设置在最近的一个主要更高低点下方。主要的更高低点，一个更高低点之后伴随了一轮强劲的上涨，创出高于前高点的新高，强劲上涨创出新高，因此这里成为一个主要的更高低点。在此之后，任何时间点买入，你的止损都应设在此下方。同样你可以在阳线收盘时买入，也可以在阴线收盘买入。这里反转向上，相当强劲，K线实体在变大，K线收盘在自身高点，然后出现一个阴性，这有多大可能会反转向下，概率很小，所以多头会在阴线收盘时买入，这里的情况也一样，非常强劲的上涨，空头有多大，可能用这次突破获得一次成功的反转，这个空头趋势K线是一次突破啊，正式成为跌破一个多头旗型。空头突破成功的概率有多大？可能只有40%或更低，所以多头会在那个阴线收盘时买入押住空头会失败。","pid":"p87"},{"t":"img","src":"assets/img/u10_026.webp","ilabel":"U10-9","icap":"主要趋势反转示例","fid":"fig27","ctx":[{"t":"空头趋势，你在这里得到一个双重底，是对双重底主要趋势反转的一次尝试，行情考验了一个底部，但失败了，然后一个强劲的反转向上形成了一个更低低点主要趋势反转，你可以称其为一个双重底。连接这个底部和那个底部，即使他们价格不同，我只是称其为一个更低低点，主要趋势反转，但我会将其视为一种双重底，或者我这里有一个双重底，或失败的双重底。或者我也将其视为楔形，稍微有三次向下推动，一次推动回调是第二次，再回调是第三次，无论如何它是一个更低低点主要趋势反转。之后反转向上相当强劲，大多数更低低点主要趋势反转之后会跟随更高低点主要趋势反转。并且你通常会得到多个更高低点，所以这是主要反转吗？还是这个才是，有些计算机会说这实在不足以构成一个主要反转。也许这个才是更高低点主要趋势反转，没关系，这个无关紧要，你得到了一个更低低点主要趋势反转，也许这里是一个微小的更高低点。我不知道这个，我看到这个低点与那个突破点之间存在缺口，所以反转相当强劲。关键在于每当你有一个更低低点主要趋势反转时，要关注买入更高低点主要趋势反转的机会，因为大多数更低点主要趋势反转之后会跟随更高低点主要趋势反转，所以你可以设置止损（突破）买单不买在这个阳线高点上方一个点，或者在这根阳线上方，或者在那根阳线上方，或者在这里在那根K线上方获得了一个多头旗型。你也可以在K线下方买入押注当一轮上涨像这样强劲时空头反转会失败，所以你可以简单的下一个限价单在K线的低点买入，并将止损设置在最近的一个主要更高低点下方。主要的更高低点，一个更高低点之后伴随了一轮强劲的上涨，创出高于前高点的新高，强劲上涨创出新高，因此这里成为一个主要的更高低点。在此之后，任何时间点买入，你的止损都应设在此下方。同样你可以在阳线收盘时买入，也可以在阴线收盘买入。这里反转向上，相当强劲，K线实体在变大，K线收盘在自身高点，然后出现一个阴性，这有多大可能会反转向下，概率很小，所以多头会在阴线收盘时买入，这里的情况也一样，非常强劲的上涨，空头有多大，可能用这次突破获得一次成功的反转，这个空头趋势K线是一次突破啊，正式成为跌破一个多头旗型。空头突破成功的概率有多大？可能只有40%或更低，所以多头会在那个阴线收盘时买入押住空头会失败。","p":"p87"},{"t":"这里是一个周线图，你有一个宽阔的熊市通道，你也可以将其视为一个空头趋势，然后我们有一段下跌腿，本身也是一个空头趋势，接着一个多头突破和一个更低低点，你可以称其为楔形，如果你想称其为跌破空头通道的失败突破的也可以，你可以简单的称其为一个更低低点主要趋势反转。这里有一条空头趋势线强劲的突破然后是对新低的测试，在这里有一个微型的双重底，你可以在那个十字星线上方或那根阳线上方买入，你得到了一个更低低点主要趋势反转。一种于此处前低点构成的双重要底之后，相当好的反转向上，接着你在这里得到了一个更高低点主要趋势反转，而现在我们又有一个双重底更高低点主要趋势反转，所以你可以在那个反转K线上方买入，现在这只有5根K线下跌，当你有一个主要趋势反转。希望形态中尽可能包含更多K线，你希望一个大形态，因为你寻找的是一个大幅度的主要的测量移动，因此这可能只是一个微小的更高低点，导致一个交易区间，而事实也的确如此。但此刻从这次初始突破的回调中，我们已有许多K钱。而这是一个更具重要性的反转，这更有高概率。所以你可以在那里的向上反转买入，我们有一个双重底，颈线测量移动最低目标，你希望从底部起至少两段上涨，而至少10根上涨K 线，你寻找一个测量移动上涨。因此获利了结在附近，你可以称之为头肩底左肩，头，然后一个双重底右肩颈线，在这里指这个双顶的位置，测量移动，但是上涨目标这也可能仅仅是一个基于该双重底颈线的测量移动，目标位大约在这里。","p":"p88"}]},{"t":"para","text":"这里是一个周线图，你有一个宽阔的熊市通道，你也可以将其视为一个空头趋势，然后我们有一段下跌腿，本身也是一个空头趋势，接着一个多头突破和一个更低低点，你可以称其为楔形，如果你想称其为跌破空头通道的失败突破的也可以，你可以简单的称其为一个更低低点主要趋势反转。这里有一条空头趋势线强劲的突破然后是对新低的测试，在这里有一个微型的双重底，你可以在那个十字星线上方或那根阳线上方买入，你得到了一个更低低点主要趋势反转。一种于此处前低点构成的双重要底之后，相当好的反转向上，接着你在这里得到了一个更高低点主要趋势反转，而现在我们又有一个双重底更高低点主要趋势反转，所以你可以在那个反转K线上方买入，现在这只有5根K线下跌，当你有一个主要趋势反转。希望形态中尽可能包含更多K线，你希望一个大形态，因为你寻找的是一个大幅度的主要的测量移动，因此这可能只是一个微小的更高低点，导致一个交易区间，而事实也的确如此。但此刻从这次初始突破的回调中，我们已有许多K钱。而这是一个更具重要性的反转，这更有高概率。所以你可以在那里的向上反转买入，我们有一个双重底，颈线测量移动最低目标，你希望从底部起至少两段上涨，而至少10根上涨K 线，你寻找一个测量移动上涨。因此获利了结在附近，你可以称之为头肩底左肩，头，然后一个双重底右肩颈线，在这里指这个双顶的位置，测量移动，但是上涨目标这也可能仅仅是一个基于该双重底颈线的测量移动，目标位大约在这里。","pid":"p88"}],"wcount":4719},{"id":"u11","title":"Unit 11　回调","icon":"11","sections":[],"blocks":[{"t":"para","text":"Unit 11 回调 重看核对图表","pid":"p89"},{"t":"img","src":"assets/img/u11_027.webp","ilabel":"U11-1","icap":"回调","fid":"fig28","ctx":[{"t":"Unit 11 回调 重看核对图表","p":"p89"},{"t":"我们看到的是一段多头趋势，市场试图反转，试图反转，更猛烈的试图反转。当市场呈现这种形态时，最好持仓做波段，尽管有经验的交易者可进行剥头皮操作即反复买入并止盈，再买入并止盈。多数交易者做不到这点，因为他们会买入，止盈后不再入场，从而错过大部分趋势。当出现如此紧密的多头通道时，表明这是强劲的多头趋势，这其实是更高时间周期图表的突破，更好的策略是在任何点位任何理由下只做买入操作，并简单持有做波段交易。反之，当市场开始过渡到双向波动及交易区间时，交易者会转向剥头皮。他们希望低买高卖，低买力，建立多头仓位，高卖实为多头仓位止盈或建立空头仓位。强劲的下跌推动可能意味着卖方在上方将推动第二段下跌，因此需在高点或相对高点卖出。当我回调持续约20根K线时，我改称其为交易区间而非回调。回调本质是趋势中的交易区间，本例中先有多头趋势，随后形成交易区间，若交易区间不足20根K线。多头突破概率较高，趋势将延续。一旦回调达到或超过20根K线，则视为交易区间，此时多头突破概率降至接近50%。换言之，交易区间导致反转的概率与其导致趋势恢复的概率大致相当。","p":"p90"}]},{"t":"para","text":"我们看到的是一段多头趋势，市场试图反转，试图反转，更猛烈的试图反转。当市场呈现这种形态时，最好持仓做波段，尽管有经验的交易者可进行剥头皮操作即反复买入并止盈，再买入并止盈。多数交易者做不到这点，因为他们会买入，止盈后不再入场，从而错过大部分趋势。当出现如此紧密的多头通道时，表明这是强劲的多头趋势，这其实是更高时间周期图表的突破，更好的策略是在任何点位任何理由下只做买入操作，并简单持有做波段交易。反之，当市场开始过渡到双向波动及交易区间时，交易者会转向剥头皮。他们希望低买高卖，低买力，建立多头仓位，高卖实为多头仓位止盈或建立空头仓位。强劲的下跌推动可能意味着卖方在上方将推动第二段下跌，因此需在高点或相对高点卖出。当我回调持续约20根K线时，我改称其为交易区间而非回调。回调本质是趋势中的交易区间，本例中先有多头趋势，随后形成交易区间，若交易区间不足20根K线。多头突破概率较高，趋势将延续。一旦回调达到或超过20根K线，则视为交易区间，此时多头突破概率降至接近50%。换言之，交易区间导致反转的概率与其导致趋势恢复的概率大致相当。","pid":"p90"},{"t":"img","src":"assets/img/u11_028.webp","ilabel":"U11-2","icap":"回调","fid":"fig29","ctx":[{"t":"我们看到的是一段多头趋势，市场试图反转，试图反转，更猛烈的试图反转。当市场呈现这种形态时，最好持仓做波段，尽管有经验的交易者可进行剥头皮操作即反复买入并止盈，再买入并止盈。多数交易者做不到这点，因为他们会买入，止盈后不再入场，从而错过大部分趋势。当出现如此紧密的多头通道时，表明这是强劲的多头趋势，这其实是更高时间周期图表的突破，更好的策略是在任何点位任何理由下只做买入操作，并简单持有做波段交易。反之，当市场开始过渡到双向波动及交易区间时，交易者会转向剥头皮。他们希望低买高卖，低买力，建立多头仓位，高卖实为多头仓位止盈或建立空头仓位。强劲的下跌推动可能意味着卖方在上方将推动第二段下跌，因此需在高点或相对高点卖出。当我回调持续约20根K线时，我改称其为交易区间而非回调。回调本质是趋势中的交易区间，本例中先有多头趋势，随后形成交易区间，若交易区间不足20根K线。多头突破概率较高，趋势将延续。一旦回调达到或超过20根K线，则视为交易区间，此时多头突破概率降至接近50%。换言之，交易区间导致反转的概率与其导致趋势恢复的概率大致相当。","p":"p90"},{"t":"观察这个多头趋势，约9根K线未出现回调。每根K线低点均高于前一根低点。直至此处该低点跌破前低，这是多头趋势的首次回调，此处为空头趋势，而该高点突破前高。因此这是空头","p":"p91"},{"t":"突破后的首次回调。","p":"p92"}]},{"t":"para","text":"观察这个多头趋势，约9根K线未出现回调。每根K线低点均高于前一根低点。直至此处该低点跌破前低，这是多头趋势的首次回调，此处为空头趋势，而该高点突破前高。因此这是空头","pid":"p91"},{"t":"para","text":"突破后的首次回调。","pid":"p92"},{"t":"img","src":"assets/img/u11_029.webp","ilabel":"U11-3","icap":"回调","fid":"fig30","ctx":[{"t":"观察这个多头趋势，约9根K线未出现回调。每根K线低点均高于前一根低点。直至此处该低点跌破前低，这是多头趋势的首次回调，此处为空头趋势，而该高点突破前高。因此这是空头","p":"p91"},{"t":"突破后的首次回调。","p":"p92"},{"t":"这里呈现多头趋势和一根阴线，其低点未跌破前K线低点，这算回调吗？严格按此图表不算。但若观察更小时间周期图表，这属于回调，故我视其为隐含回调。每当出现阴线或犹豫K线如十字星，即使其低点未破前低，本例中K线低点被跌破前一根K线低点，他们在更小时间周期图表中即为实际回调，假设这是5分钟图。其在1分钟或3分钟图上会显现为回调。在更低时间周期中，这些都是明确回调，例如这是1分钟图，正符合上述情况。上图是5分钟图，这是1分钟图，5分钟图上的阴线对应1分钟处的回调。该K线低点跌破前低，实际上这根K线也跌破了前低。","p":"p93"}]},{"t":"para","text":"这里呈现多头趋势和一根阴线，其低点未跌破前K线低点，这算回调吗？严格按此图表不算。但若观察更小时间周期图表，这属于回调，故我视其为隐含回调。每当出现阴线或犹豫K线如十字星，即使其低点未破前低，本例中K线低点被跌破前一根K线低点，他们在更小时间周期图表中即为实际回调，假设这是5分钟图。其在1分钟或3分钟图上会显现为回调。在更低时间周期中，这些都是明确回调，例如这是1分钟图，正符合上述情况。上图是5分钟图，这是1分钟图，5分钟图上的阴线对应1分钟处的回调。该K线低点跌破前低，实际上这根K线也跌破了前低。","pid":"p93"},{"t":"img","src":"assets/img/u11_030.webp","ilabel":"U11-4","icap":"回调","fid":"fig31","ctx":[{"t":"这里呈现多头趋势和一根阴线，其低点未跌破前K线低点，这算回调吗？严格按此图表不算。但若观察更小时间周期图表，这属于回调，故我视其为隐含回调。每当出现阴线或犹豫K线如十字星，即使其低点未破前低，本例中K线低点被跌破前一根K线低点，他们在更小时间周期图表中即为实际回调，假设这是5分钟图。其在1分钟或3分钟图上会显现为回调。在更低时间周期中，这些都是明确回调，例如这是1分钟图，正符合上述情况。上图是5分钟图，这是1分钟图，5分钟图上的阴线对应1分钟处的回调。该K线低点跌破前低，实际上这根K线也跌破了前低。","p":"p93"},{"t":"分析空头趋势时，逻辑完全相反。观察这段空头趋势。随后反弹至此约中点位置，这是50%回调，此时空头止损设于此处预期测试前低。其盈亏比为1。因回调仅持续6-7根K线，尚未构成交易区间，此刻我仍称其为回调。市场跌至下方（非上方）的概率达60%。实际未发生，但当时确有60%概率。因此对空头而言，风险等于回报。且胜率高于反向操作。对空头来说，市场跌至此处的概率超50%。多头此时买入目标是测试空头趋势高点，旨在触发空头止损，多头止损设于下方，其风险与回报相等，如同空头（一比一盈亏比）。区别在于因只是回调(K线数不足彻底反转)，市场先跌后涨的概率更高。市场确实尝试下行，但空头恐慌止盈。多头认为动能充足，反转向上强劲，他们买入并获胜。于是回调演变为交易区间。持续约20根K线后，我改称其为交易区间。此时趋势反转与趋势恢复概率相等。任何交易区间总存在买入形态与卖出形态，本例中多头属高位或低位主要趋势反转。空头趋势可能突破形成更高低点，空头在此处是低2，空头旗型，后发展为双顶空头旗型，最终多头实现突破。这可视为早期多头趋势交易者倾向在50%回调位买入。50%回调是交易者计算每笔交易的数学基础。可参考布鲁克斯交易课程关于测量移动和交易者方程式的视频，其中详细阐述了相关数学原理。斐波那契回调常被提及，但我认为无实质意义，部分算法交易追随使其具有参考性，但核心回调位50%最重要。50%回调位远比38%或62%关键，因其逻辑与数学基础更坚实。","p":"p94"}]},{"t":"para","text":"分析空头趋势时，逻辑完全相反。观察这段空头趋势。随后反弹至此约中点位置，这是50%回调，此时空头止损设于此处预期测试前低。其盈亏比为1。因回调仅持续6-7根K线，尚未构成交易区间，此刻我仍称其为回调。市场跌至下方（非上方）的概率达60%。实际未发生，但当时确有60%概率。因此对空头而言，风险等于回报。且胜率高于反向操作。对空头来说，市场跌至此处的概率超50%。多头此时买入目标是测试空头趋势高点，旨在触发空头止损，多头止损设于下方，其风险与回报相等，如同空头（一比一盈亏比）。区别在于因只是回调(K线数不足彻底反转)，市场先跌后涨的概率更高。市场确实尝试下行，但空头恐慌止盈。多头认为动能充足，反转向上强劲，他们买入并获胜。于是回调演变为交易区间。持续约20根K线后，我改称其为交易区间。此时趋势反转与趋势恢复概率相等。任何交易区间总存在买入形态与卖出形态，本例中多头属高位或低位主要趋势反转。空头趋势可能突破形成更高低点，空头在此处是低2，空头旗型，后发展为双顶空头旗型，最终多头实现突破。这可视为早期多头趋势交易者倾向在50%回调位买入。50%回调是交易者计算每笔交易的数学基础。可参考布鲁克斯交易课程关于测量移动和交易者方程式的视频，其中详细阐述了相关数学原理。斐波那契回调常被提及，但我认为无实质意义，部分算法交易追随使其具有参考性，但核心回调位50%最重要。50%回调位远比38%或62%关键，因其逻辑与数学基础更坚实。","pid":"p94"},{"t":"img","src":"assets/img/u11_031.webp","ilabel":"U11-5","icap":"回调","fid":"fig32","ctx":[{"t":"分析空头趋势时，逻辑完全相反。观察这段空头趋势。随后反弹至此约中点位置，这是50%回调，此时空头止损设于此处预期测试前低。其盈亏比为1。因回调仅持续6-7根K线，尚未构成交易区间，此刻我仍称其为回调。市场跌至下方（非上方）的概率达60%。实际未发生，但当时确有60%概率。因此对空头而言，风险等于回报。且胜率高于反向操作。对空头来说，市场跌至此处的概率超50%。多头此时买入目标是测试空头趋势高点，旨在触发空头止损，多头止损设于下方，其风险与回报相等，如同空头（一比一盈亏比）。区别在于因只是回调(K线数不足彻底反转)，市场先跌后涨的概率更高。市场确实尝试下行，但空头恐慌止盈。多头认为动能充足，反转向上强劲，他们买入并获胜。于是回调演变为交易区间。持续约20根K线后，我改称其为交易区间。此时趋势反转与趋势恢复概率相等。任何交易区间总存在买入形态与卖出形态，本例中多头属高位或低位主要趋势反转。空头趋势可能突破形成更高低点，空头在此处是低2，空头旗型，后发展为双顶空头旗型，最终多头实现突破。这可视为早期多头趋势交易者倾向在50%回调位买入。50%回调是交易者计算每笔交易的数学基础。可参考布鲁克斯交易课程关于测量移动和交易者方程式的视频，其中详细阐述了相关数学原理。斐波那契回调常被提及，但我认为无实质意义，部分算法交易追随使其具有参考性，但核心回调位50%最重要。50%回调位远比38%或62%关键，因其逻辑与数学基础更坚实。","p":"p94"},{"t":"试图将斐波那契技术强行套用于股市或任何市场，是愚蠢的，其与交易逻辑无关，而50%回调直接相关。空头趋势中50%回调，是空头期望卖出后市场在触及趋势高点前先跌至低点。此时判断正确，部分空头会以限价单在50%位卖出，盈亏比合理。同理，多头会在50%回调位买入，从此处到这条绿色虚线，是初始移动段，多头见此认为，这属有效反转。很可能出现至少小型第二上涨推动，于是挂限价单再回调50%位买入，如图此处成交，后于高位止盈。同理，此段反弹从此处启动，至此结束，多头认为反弹强劲且通道紧密。首次向下反转大概率不会彻底跌至起点，至少会反弹测试前高，因此会挂限价单在50%回调位买入，他们买入50%回调位。因确信市场将先达目标位（非止损位），此时风险等于回报。买入此处止损设于下方，目标位设于上方，但胜率超50%。故数学上在此处买入50%回调位，此处买入50%回调位及此处卖出50%回调为均合理。另一个多头上涨推动中，部分多头挂限价单于50%回调位买入，成交点如图，不确定是否精准到位，但若触及是其买入点。","p":"p95"}]},{"t":"para","text":"试图将斐波那契技术强行套用于股市或任何市场，是愚蠢的，其与交易逻辑无关，而50%回调直接相关。空头趋势中50%回调，是空头期望卖出后市场在触及趋势高点前先跌至低点。此时判断正确，部分空头会以限价单在50%位卖出，盈亏比合理。同理，多头会在50%回调位买入，从此处到这条绿色虚线，是初始移动段，多头见此认为，这属有效反转。很可能出现至少小型第二上涨推动，于是挂限价单再回调50%位买入，如图此处成交，后于高位止盈。同理，此段反弹从此处启动，至此结束，多头认为反弹强劲且通道紧密。首次向下反转大概率不会彻底跌至起点，至少会反弹测试前高，因此会挂限价单在50%回调位买入，他们买入50%回调位。因确信市场将先达目标位（非止损位），此时风险等于回报。买入此处止损设于下方，目标位设于上方，但胜率超50%。故数学上在此处买入50%回调位，此处买入50%回调位及此处卖出50%回调为均合理。另一个多头上涨推动中，部分多头挂限价单于50%回调位买入，成交点如图，不确定是否精准到位，但若触及是其买入点。","pid":"p95"}],"wcount":1888},{"id":"u12","title":"Unit 12　数K线","icon":"12","sections":[],"blocks":[{"t":"para","text":"Unit 12 数K线","pid":"p96"},{"t":"img","src":"assets/img/u12_032.webp","ilabel":"U12-1","icap":"数K线","fid":"fig33","ctx":[{"t":"Unit 12 数K线","p":"p96"},{"t":"我喜欢数回调波段的段数，我称作数K线法。为什么这么做？因为它有助于寻找回调入场点，有助于找到交易进场的依据。有时趋势仅回调一段就会恢复，有时回调会更复杂。比如试图恢复趋势，但失败。再次下跌形成两段下行。这下影线处尝试后，趋势再次恢复。看这里案例，多头趋势中出现回调，回调时这些K线跌破前根K线低点。这是多头首次尝试恢复上涨趋势，但未成功，价格继续走低，回调扩大，第二次尝试反转。反转失败后创更低低点，第三次尝试反转。我认为这是高一多头旗型，可在这根K线上方买入，止损设此处下方，注意这是第二次尝试，我称之为高而多头旗型及空头通道中的多头旗型，第一次反转尝试高一失败后，第二次反转尝试高二出现，当这根K线突破前高时，形成高三入场K线，即高三多头旗型，空头通道中的多头旗型，而且仍处于于始终看多种价格仍在多头通道底部之上，仍高于多头趋势起始点，在跌至此位前上涨概率更大。因此可做多，在这根阴线上方买入合理，该阴线上方买入也合理。回调5-6段。有时手段回调会细分。此处细分为三部分，首次恢复尝试失败后出现第二段下跌，这可视作高4形态，或在更高时间周期图上假设这是5分钟图，若看15分钟图。这可能是高一，这些回调会被忽略，而这里形成高二。可称作大型高二买入位，这是大型高一，此处是大型高二，或称其高四，1234尝试，仍属空头通道中的多头旗型。在低位形成双K反转，且未破多头趋势底部，尝试冲高概率依然存在。","p":"p97"}]},{"t":"para","text":"我喜欢数回调波段的段数，我称作数K线法。为什么这么做？因为它有助于寻找回调入场点，有助于找到交易进场的依据。有时趋势仅回调一段就会恢复，有时回调会更复杂。比如试图恢复趋势，但失败。再次下跌形成两段下行。这下影线处尝试后，趋势再次恢复。看这里案例，多头趋势中出现回调，回调时这些K线跌破前根K线低点。这是多头首次尝试恢复上涨趋势，但未成功，价格继续走低，回调扩大，第二次尝试反转。反转失败后创更低低点，第三次尝试反转。我认为这是高一多头旗型，可在这根K线上方买入，止损设此处下方，注意这是第二次尝试，我称之为高而多头旗型及空头通道中的多头旗型，第一次反转尝试高一失败后，第二次反转尝试高二出现，当这根K线突破前高时，形成高三入场K线，即高三多头旗型，空头通道中的多头旗型，而且仍处于于始终看多种价格仍在多头通道底部之上，仍高于多头趋势起始点，在跌至此位前上涨概率更大。因此可做多，在这根阴线上方买入合理，该阴线上方买入也合理。回调5-6段。有时手段回调会细分。此处细分为三部分，首次恢复尝试失败后出现第二段下跌，这可视作高4形态，或在更高时间周期图上假设这是5分钟图，若看15分钟图。这可能是高一，这些回调会被忽略，而这里形成高二。可称作大型高二买入位，这是大型高一，此处是大型高二，或称其高四，1234尝试，仍属空头通道中的多头旗型。在低位形成双K反转，且未破多头趋势底部，尝试冲高概率依然存在。","pid":"p97"},{"t":"img","src":"assets/img/u12_033.webp","ilabel":"U12-2","icap":"数K线","fid":"fig34","ctx":[{"t":"我喜欢数回调波段的段数，我称作数K线法。为什么这么做？因为它有助于寻找回调入场点，有助于找到交易进场的依据。有时趋势仅回调一段就会恢复，有时回调会更复杂。比如试图恢复趋势，但失败。再次下跌形成两段下行。这下影线处尝试后，趋势再次恢复。看这里案例，多头趋势中出现回调，回调时这些K线跌破前根K线低点。这是多头首次尝试恢复上涨趋势，但未成功，价格继续走低，回调扩大，第二次尝试反转。反转失败后创更低低点，第三次尝试反转。我认为这是高一多头旗型，可在这根K线上方买入，止损设此处下方，注意这是第二次尝试，我称之为高而多头旗型及空头通道中的多头旗型，第一次反转尝试高一失败后，第二次反转尝试高二出现，当这根K线突破前高时，形成高三入场K线，即高三多头旗型，空头通道中的多头旗型，而且仍处于于始终看多种价格仍在多头通道底部之上，仍高于多头趋势起始点，在跌至此位前上涨概率更大。因此可做多，在这根阴线上方买入合理，该阴线上方买入也合理。回调5-6段。有时手段回调会细分。此处细分为三部分，首次恢复尝试失败后出现第二段下跌，这可视作高4形态，或在更高时间周期图上假设这是5分钟图，若看15分钟图。这可能是高一，这些回调会被忽略，而这里形成高二。可称作大型高二买入位，这是大型高一，此处是大型高二，或称其高四，1234尝试，仍属空头通道中的多头旗型。在低位形成双K反转，且未破多头趋势底部，尝试冲高概率依然存在。","p":"p97"},{"t":"交易者常说的abc回调即三段式修正，两段下跌加一段反弹。本质就是高2多头骑旗型。当空头尝试反转时，若K线突破前高，则形成高一买入信号K线。若未闯新高，继续下跌，二次反转尝试出现。此K线上方买入即高二多头旗型，多头旗型起点再此，回调起点在此，高一过渡到高二，回调中的双底即高二多头旗型，也可称为abc回调。多头趋势中的abc回调。当回调延续过大，第三次反转尝试再次出现。任意方向出现三段走势，如下跌123段即三角形。三段横向波动构成三角形，略带倾斜则称楔形，有人纠结1，3低点连线是否穿过低二低点，不必在意。形态本来就不完美，苛求完美将无法交易，此为三角形买入信号K线。可做高一，高二或在突破此K线时买入。","p":"p98"}]},{"t":"para","text":"交易者常说的abc回调即三段式修正，两段下跌加一段反弹。本质就是高2多头骑旗型。当空头尝试反转时，若K线突破前高，则形成高一买入信号K线。若未闯新高，继续下跌，二次反转尝试出现。此K线上方买入即高二多头旗型，多头旗型起点再此，回调起点在此，高一过渡到高二，回调中的双底即高二多头旗型，也可称为abc回调。多头趋势中的abc回调。当回调延续过大，第三次反转尝试再次出现。任意方向出现三段走势，如下跌123段即三角形。三段横向波动构成三角形，略带倾斜则称楔形，有人纠结1，3低点连线是否穿过低二低点，不必在意。形态本来就不完美，苛求完美将无法交易，此为三角形买入信号K线。可做高一，高二或在突破此K线时买入。","pid":"p98"},{"t":"img","src":"assets/img/u12_034.webp","ilabel":"U12-3","icap":"数K线","fid":"fig35","ctx":[{"t":"交易者常说的abc回调即三段式修正，两段下跌加一段反弹。本质就是高2多头骑旗型。当空头尝试反转时，若K线突破前高，则形成高一买入信号K线。若未闯新高，继续下跌，二次反转尝试出现。此K线上方买入即高二多头旗型，多头旗型起点再此，回调起点在此，高一过渡到高二，回调中的双底即高二多头旗型，也可称为abc回调。多头趋势中的abc回调。当回调延续过大，第三次反转尝试再次出现。任意方向出现三段走势，如下跌123段即三角形。三段横向波动构成三角形，略带倾斜则称楔形，有人纠结1，3低点连线是否穿过低二低点，不必在意。形态本来就不完美，苛求完美将无法交易，此为三角形买入信号K线。可做高一，高二或在突破此K线时买入。","p":"p98"},{"t":"再看回调案例，多头趋势出现回调，因K线低点跌破前低，形成高一信号K线。当K线突破前高时回调结束，多头会在其高点上方挂买入止损单，赌趋势恢复。有时初始恢复失败，演变成第二或第三段下跌。若出现4~6段下跌可能已非回调而是逆转为新趋势。","p":"p99"}]},{"t":"para","text":"再看回调案例，多头趋势出现回调，因K线低点跌破前低，形成高一信号K线。当K线突破前高时回调结束，多头会在其高点上方挂买入止损单，赌趋势恢复。有时初始恢复失败，演变成第二或第三段下跌。若出现4~6段下跌可能已非回调而是逆转为新趋势。","pid":"p99"},{"t":"img","src":"assets/img/u12_035.webp","ilabel":"U12-4","icap":"数K线","fid":"fig36","ctx":[{"t":"再看回调案例，多头趋势出现回调，因K线低点跌破前低，形成高一信号K线。当K线突破前高时回调结束，多头会在其高点上方挂买入止损单，赌趋势恢复。有时初始恢复失败，演变成第二或第三段下跌。若出现4~6段下跌可能已非回调而是逆转为新趋势。","p":"p99"},{"t":"现在看空头案例，空头趋势中价格突破前高形成回调。此K线为卖出信号K线,若跌破其低点，形成低一空头旗型，此为入场K线。交易者在下方挂卖出止损单，赌趋势恢复，有时会失败。跌破后横盘演变成低二/低三。若回调中出现四段以上横盘或上涨，需警惕可能以逆转成多头趋势。","p":"p100"}]},{"t":"para","text":"现在看空头案例，空头趋势中价格突破前高形成回调。此K线为卖出信号K线,若跌破其低点，形成低一空头旗型，此为入场K线。交易者在下方挂卖出止损单，赌趋势恢复，有时会失败。跌破后横盘演变成低二/低三。若回调中出现四段以上横盘或上涨，需警惕可能以逆转成多头趋势。","pid":"p100"},{"t":"img","src":"assets/img/u12_036.webp","ilabel":"U12-5","icap":"数K线","fid":"fig37","ctx":[{"t":"现在看空头案例，空头趋势中价格突破前高形成回调。此K线为卖出信号K线,若跌破其低点，形成低一空头旗型，此为入场K线。交易者在下方挂卖出止损单，赌趋势恢复，有时会失败。跌破后横盘演变成低二/低三。若回调中出现四段以上横盘或上涨，需警惕可能以逆转成多头趋势。","p":"p100"},{"t":"当价格跌破前低，形成高一买入信号K线并触发时，或突破前高时，交易者将重新关注回调机会。这里是个小型回调，但此低点未跌破前低。这算高一买入吗？算高一买入，但不少交易者认为,此K线未跌破前根K线低点，但该K线确实跌破了前低点，因此在当前时间周期下的构成首次技术性回调，此时应开始关注突破前高买入机会，每根K线的高点上方都可设置买入止损单，在此K线高点上方设买入止损成交于此位置，此K线成为高一买入信号K线。但趋势未持续恢复，价格再度回调走低，实际已跌破该K线低点，只要价格守住最近主要波段低点。如此处或此处仍处于始终看多状态。跌破该K线形成的空头反转，回调及首段下跌。随后出现第二段下跌，下跌过程中，交易者持续在前K线高点上方设买入止损单成交于此。形成高二买入信号，交易者在突破K线高点时买入，小型多头旗型演变为大型旗型后，多头趋势最终恢复。","p":"p101"}]},{"t":"para","text":"当价格跌破前低，形成高一买入信号K线并触发时，或突破前高时，交易者将重新关注回调机会。这里是个小型回调，但此低点未跌破前低。这算高一买入吗？算高一买入，但不少交易者认为,此K线未跌破前根K线低点，但该K线确实跌破了前低点，因此在当前时间周期下的构成首次技术性回调，此时应开始关注突破前高买入机会，每根K线的高点上方都可设置买入止损单，在此K线高点上方设买入止损成交于此位置，此K线成为高一买入信号K线。但趋势未持续恢复，价格再度回调走低，实际已跌破该K线低点，只要价格守住最近主要波段低点。如此处或此处仍处于始终看多状态。跌破该K线形成的空头反转，回调及首段下跌。随后出现第二段下跌，下跌过程中，交易者持续在前K线高点上方设买入止损单成交于此。形成高二买入信号，交易者在突破K线高点时买入，小型多头旗型演变为大型旗型后，多头趋势最终恢复。","pid":"p101"},{"t":"img","src":"assets/img/u12_037.webp","ilabel":"U12-6","icap":"数K线","fid":"fig38","ctx":[{"t":"当价格跌破前低，形成高一买入信号K线并触发时，或突破前高时，交易者将重新关注回调机会。这里是个小型回调，但此低点未跌破前低。这算高一买入吗？算高一买入，但不少交易者认为,此K线未跌破前根K线低点，但该K线确实跌破了前低点，因此在当前时间周期下的构成首次技术性回调，此时应开始关注突破前高买入机会，每根K线的高点上方都可设置买入止损单，在此K线高点上方设买入止损成交于此位置，此K线成为高一买入信号K线。但趋势未持续恢复，价格再度回调走低，实际已跌破该K线低点，只要价格守住最近主要波段低点。如此处或此处仍处于始终看多状态。跌破该K线形成的空头反转，回调及首段下跌。随后出现第二段下跌，下跌过程中，交易者持续在前K线高点上方设买入止损单成交于此。形成高二买入信号，交易者在突破K线高点时买入，小型多头旗型演变为大型旗型后，多头趋势最终恢复。","p":"p101"},{"t":"此处曾尝试恢复多头趋势，但失败。回调延续，新增更多K线。交易者尝试突破此K线高点买入，未成交，尝试突破该K线高点也未成交，在此K线高点上方设买入止损单后，最终成交，形成高二多头旗型。因高一形态失效。交易者转而在高二形态上方买入。成功捕捉多头趋势恢复，无论买在高一或高二都无妨，止损始终设在最近上涨波段底部，如此处。此处设止损虽可，但属于次级回调的次高点上。止损位有效性存疑。市场一跌后该K线后仍处回调区间，并恢复上行趋势。因此我不会在此设止损而是下移至此处。","p":"p102"}]},{"t":"para","text":"此处曾尝试恢复多头趋势，但失败。回调延续，新增更多K线。交易者尝试突破此K线高点买入，未成交，尝试突破该K线高点也未成交，在此K线高点上方设买入止损单后，最终成交，形成高二多头旗型。因高一形态失效。交易者转而在高二形态上方买入。成功捕捉多头趋势恢复，无论买在高一或高二都无妨，止损始终设在最近上涨波段底部，如此处。此处设止损虽可，但属于次级回调的次高点上。止损位有效性存疑。市场一跌后该K线后仍处回调区间，并恢复上行趋势。因此我不会在此设止损而是下移至此处。","pid":"p102"},{"t":"img","src":"assets/img/u12_038.webp","ilabel":"U12-7","icap":"数K线","fid":"fig39","ctx":[{"t":"此处曾尝试恢复多头趋势，但失败。回调延续，新增更多K线。交易者尝试突破此K线高点买入，未成交，尝试突破该K线高点也未成交，在此K线高点上方设买入止损单后，最终成交，形成高二多头旗型。因高一形态失效。交易者转而在高二形态上方买入。成功捕捉多头趋势恢复，无论买在高一或高二都无妨，止损始终设在最近上涨波段底部，如此处。此处设止损虽可，但属于次级回调的次高点上。止损位有效性存疑。市场一跌后该K线后仍处回调区间，并恢复上行趋势。因此我不会在此设止损而是下移至此处。","p":"p102"},{"t":"数回调段数时往往存在多种标记方式。核心是勿忘交易目标，在趋势中寻找入场时机，押注趋势将在回调后恢复。在多头趋势中，若不愿追高可数回调段数，高一可买，高二也可买，但当出现高4，高5时，风险递增。趋势恢复概率降低，可能进入交易区间甚至空头趋势。我还会统计阴线后接阳线十字星的数量。多头趋势中的阴线若未创新低，仍属隐性回调，在较小时间周期上则属明确回调，可视作高一买入形态。这是内包型（ii）多头旗型，此K线被前K线内包，而该阴线又被后K线内包,构成ii高一多头旗型。尽管多头趋势仅短暂恢复后又深度回调，演变为高二多头旗型，随着持续横盘，最终形成高三形态。交易者可买在高一，二或三，多头终将恢复趋势。若回调超20根K线，趋势恢复概率降至50%。若延续至此，恢复上行与反转下行概率各半。继续概率说明，强劲多头突破后大概率续涨，小周期图表上的阴线可视作隐性高一。作为内包线（ib），可突破其高点买入，尽管未破前低，仍具实际高一属性。是否算回调？严格说未破前低不算。但实际功能等同回调，我将其标记为高一买入形态，后续演变为高二形态，两段下跌，形成小型双底。即此阴线与彼阴线构成支撑。多头趋势中任何双底结构皆视为为高2多头旗型，此处低点虽未破前低，仍视为高一多头旗型。会因这些K线未突破前高而否认其高一属性吗？可能该K线已突破前高，虽图表难辨，假设未突破。标记为高一或高二均可。标记首段，横盘后二次下探，此段下跌再创新低，即构成高三。标记方式可灵活，本质仍是强多头趋势中的回调，续涨概率较高。突破此处彼处或任意K线高点买入皆可。多头趋势终将恢复，构成高一买入机会，再现线阴线则标记为二次回调，因此突破此K线，该K线，或此K线高点均构成高二形态，随后价格创新低后反转上行，我认为这是第三段下跌，首段下跌由阴线开启，后接十字星，在出现阴线构成第二段下跌，跌破前数K线低点后反转上行，形成第三段下跌。此处出现买入信号K线，但多头反攻失败，第二次买入信号K线再次出现，多头仍失败，第三次买入信号K线出现时，多头终于成功，此处为高一，此处形成高二，该处构成高三。也可直接统计下跌段数,首段下跌-反弹-更大级别第二段下跌，这属于第二段下跌的延续扩展。至此完成第二段下跌，在更高时间周期图上，此结构视为小型高二多头旗型及下阶段1-反弹-下阶段2。此为较窄通道。在更高时间图表上仅呈现为单段下跌，其中细微的反弹尝试将被忽略。当多头趋势出现回调，必须紧盯反转上行买入机会，此刻可能处于交易区间，区间底部或在a处或在b处。位于区间下半部，尤其下1/3区域是仍应寻找做多机会，可在区间底部捕捉高一，高二或高三买入形态。交易者会在下列位置挂买入止损单。若相信市场将上涨，回调时突破前高入场是有效策略。","p":"p103"}]},{"t":"para","text":"数回调段数时往往存在多种标记方式。核心是勿忘交易目标，在趋势中寻找入场时机，押注趋势将在回调后恢复。在多头趋势中，若不愿追高可数回调段数，高一可买，高二也可买，但当出现高4，高5时，风险递增。趋势恢复概率降低，可能进入交易区间甚至空头趋势。我还会统计阴线后接阳线十字星的数量。多头趋势中的阴线若未创新低，仍属隐性回调，在较小时间周期上则属明确回调，可视作高一买入形态。这是内包型（ii）多头旗型，此K线被前K线内包，而该阴线又被后K线内包,构成ii高一多头旗型。尽管多头趋势仅短暂恢复后又深度回调，演变为高二多头旗型，随着持续横盘，最终形成高三形态。交易者可买在高一，二或三，多头终将恢复趋势。若回调超20根K线，趋势恢复概率降至50%。若延续至此，恢复上行与反转下行概率各半。继续概率说明，强劲多头突破后大概率续涨，小周期图表上的阴线可视作隐性高一。作为内包线（ib），可突破其高点买入，尽管未破前低，仍具实际高一属性。是否算回调？严格说未破前低不算。但实际功能等同回调，我将其标记为高一买入形态，后续演变为高二形态，两段下跌，形成小型双底。即此阴线与彼阴线构成支撑。多头趋势中任何双底结构皆视为为高2多头旗型，此处低点虽未破前低，仍视为高一多头旗型。会因这些K线未突破前高而否认其高一属性吗？可能该K线已突破前高，虽图表难辨，假设未突破。标记为高一或高二均可。标记首段，横盘后二次下探，此段下跌再创新低，即构成高三。标记方式可灵活，本质仍是强多头趋势中的回调，续涨概率较高。突破此处彼处或任意K线高点买入皆可。多头趋势终将恢复，构成高一买入机会，再现线阴线则标记为二次回调，因此突破此K线，该K线，或此K线高点均构成高二形态，随后价格创新低后反转上行，我认为这是第三段下跌，首段下跌由阴线开启，后接十字星，在出现阴线构成第二段下跌，跌破前数K线低点后反转上行，形成第三段下跌。此处出现买入信号K线，但多头反攻失败，第二次买入信号K线再次出现，多头仍失败，第三次买入信号K线出现时，多头终于成功，此处为高一，此处形成高二，该处构成高三。也可直接统计下跌段数,首段下跌-反弹-更大级别第二段下跌，这属于第二段下跌的延续扩展。至此完成第二段下跌，在更高时间周期图上，此结构视为小型高二多头旗型及下阶段1-反弹-下阶段2。此为较窄通道。在更高时间图表上仅呈现为单段下跌，其中细微的反弹尝试将被忽略。当多头趋势出现回调，必须紧盯反转上行买入机会，此刻可能处于交易区间，区间底部或在a处或在b处。位于区间下半部，尤其下1/3区域是仍应寻找做多机会，可在区间底部捕捉高一，高二或高三买入形态。交易者会在下列位置挂买入止损单。若相信市场将上涨，回调时突破前高入场是有效策略。","pid":"p103"}],"wcount":2882},{"id":"u13","title":"Unit 13　多头通道回调","icon":"13","sections":[],"blocks":[{"t":"para","text":"Unit 13 多头通道回调","pid":"p104"},{"t":"img","src":"assets/img/u13_039.webp","ilabel":"U13-1","icap":"多头通道回调","fid":"fig40","ctx":[{"t":"Unit 13 多头通道回调","p":"p104"},{"t":"市场正在一个相当紧密的多头通道中上扬，我将简要讨论多头通道中的K线计数。例如此处有一段上涨，此处是一次回调这个低点跌破前根K线的低点，因此这是回调，此处形成高一买入信号。市场继续上涨，但幅度有限。尚不足以判断趋势恢复。我更倾向于认为这波上涨是次要波动，小幅反转，且回调仍在延续扩大。部分交易者会说需要重新开始计数，他们称此为高一买入信号，当价格跌破前根K线低点，交易者会将止损位设在当前K线高点上方并买入。在多头K线上方买入长更稳妥，因此他们在此处买入，另有观点认为这是突破多头旗型后的回调。他们将其标注为高一信号，在我看来这波上涨更像是交易区间或回调中的多头行情，我认为这更接近双底多头旗型。此处是高一，而此处形成高二，具体名称并不重要，关键要牢记目标，目标是寻找合理方式进场做多，多头趋势可能持续很久，不能始终观望。犹豫如何进场，这才是逻辑进场点在高一或高二位置买入。要明白市场当前处于始终持多状态，后续很可能继续走高。再次出现两根多头K线，这是新趋势起点吗？这是回调吗？类似此前行情这波上涨力度不足，我不认为趋势恢复仍将其视为同轮回调的延续。你愿称之为高一吗？也可解读为双底多头旗型突破，尽管弱势，但仍属突破，当前是对该突破的回调。部分量化系统如此判定，其他系统则认为第一推，第二推，第三推对应形成高三或三角形。这显然是突破，出现明确突破需要重新计数，而该空头K线跌破前跟低点。此处形成高一买入形态。另一波创新高的突破力度欠佳，出现停顿K线，空头K线在小周期图表上，这属于回调。严格来说，突破该线高点可做高一买入交易的，通常在该K线高点上方一档设置止损多单。此处同理三根多头K线组合。虽未跌破前低，但已显疲态。这是大胆突破后形成的双内包线停顿信号，对我来说这是一个高一多头旗型，在较小的时间框架图上，这两根小K线构成了三角形。交易者会在前一根K线高点略上方买入，并在该处直接做多，因此这是一个高一多头旗型。这里我们有一个高一多头旗型，止损设在最近关键较高低点的底部，下方可能低至此处，也许在这里。你可以说这里形成了突破，止损或许已经设在此下方，所有这些位置都是合理的，唯一不合理且错误的止损是当你在这个线上到买入并再次做多时，不要将其低点下方设为止损位，因为市场有时会出现第二或第三下跌腿。而这里确实出现了至少进行第二次上尝试，这是高二多头旗型或高二入场形态，这是合理的做多方式之后甚至出现了高三形态，若你愿意，也可称为楔形，因为是横向下移的三段推动。但所有这些都是合理的入场位，记住个新目标，目标在于你身处多头趋势中，你需要建立多仓，而这是在多头趋势中建立多仓的逻辑策略。市场再次上涨创出新高，形成相当不错的突破，因此若在此区域任何位置买入，止损应设在最近关键较高低点的底部下方，关键较高低点之所谓关键是因为我们创了新高，且涨势相当强劲，这根K线跌破了前一根K线的低点，所以就是股票交易者将考虑在前一根K线高点上方买入，但这根K线未能突破该高点，因此止损挂单未被成交，多头并未进场，他们持续调整至首位，在每根K线收盘时，他们挂单略高于该K线高点买入，最终会在这根外包阳线多头其形态处成交。重申我仍不需要此处的向上突破，并不强势，更大，可能只是回调段的延伸。我会称之为高二失效形态，另外需牢记。","p":"p105"}]},{"t":"para","text":"市场正在一个相当紧密的多头通道中上扬，我将简要讨论多头通道中的K线计数。例如此处有一段上涨，此处是一次回调这个低点跌破前根K线的低点，因此这是回调，此处形成高一买入信号。市场继续上涨，但幅度有限。尚不足以判断趋势恢复。我更倾向于认为这波上涨是次要波动，小幅反转，且回调仍在延续扩大。部分交易者会说需要重新开始计数，他们称此为高一买入信号，当价格跌破前根K线低点，交易者会将止损位设在当前K线高点上方并买入。在多头K线上方买入长更稳妥，因此他们在此处买入，另有观点认为这是突破多头旗型后的回调。他们将其标注为高一信号，在我看来这波上涨更像是交易区间或回调中的多头行情，我认为这更接近双底多头旗型。此处是高一，而此处形成高二，具体名称并不重要，关键要牢记目标，目标是寻找合理方式进场做多，多头趋势可能持续很久，不能始终观望。犹豫如何进场，这才是逻辑进场点在高一或高二位置买入。要明白市场当前处于始终持多状态，后续很可能继续走高。再次出现两根多头K线，这是新趋势起点吗？这是回调吗？类似此前行情这波上涨力度不足，我不认为趋势恢复仍将其视为同轮回调的延续。你愿称之为高一吗？也可解读为双底多头旗型突破，尽管弱势，但仍属突破，当前是对该突破的回调。部分量化系统如此判定，其他系统则认为第一推，第二推，第三推对应形成高三或三角形。这显然是突破，出现明确突破需要重新计数，而该空头K线跌破前跟低点。此处形成高一买入形态。另一波创新高的突破力度欠佳，出现停顿K线，空头K线在小周期图表上，这属于回调。严格来说，突破该线高点可做高一买入交易的，通常在该K线高点上方一档设置止损多单。此处同理三根多头K线组合。虽未跌破前低，但已显疲态。这是大胆突破后形成的双内包线停顿信号，对我来说这是一个高一多头旗型，在较小的时间框架图上，这两根小K线构成了三角形。交易者会在前一根K线高点略上方买入，并在该处直接做多，因此这是一个高一多头旗型。这里我们有一个高一多头旗型，止损设在最近关键较高低点的底部，下方可能低至此处，也许在这里。你可以说这里形成了突破，止损或许已经设在此下方，所有这些位置都是合理的，唯一不合理且错误的止损是当你在这个线上到买入并再次做多时，不要将其低点下方设为止损位，因为市场有时会出现第二或第三下跌腿。而这里确实出现了至少进行第二次上尝试，这是高二多头旗型或高二入场形态，这是合理的做多方式之后甚至出现了高三形态，若你愿意，也可称为楔形，因为是横向下移的三段推动。但所有这些都是合理的入场位，记住个新目标，目标在于你身处多头趋势中，你需要建立多仓，而这是在多头趋势中建立多仓的逻辑策略。市场再次上涨创出新高，形成相当不错的突破，因此若在此区域任何位置买入，止损应设在最近关键较高低点的底部下方，关键较高低点之所谓关键是因为我们创了新高，且涨势相当强劲，这根K线跌破了前一根K线的低点，所以就是股票交易者将考虑在前一根K线高点上方买入，但这根K线未能突破该高点，因此止损挂单未被成交，多头并未进场，他们持续调整至首位，在每根K线收盘时，他们挂单略高于该K线高点买入，最终会在这根外包阳线多头其形态处成交。重申我仍不需要此处的向上突破，并不强势，更大，可能只是回调段的延伸。我会称之为高二失效形态，另外需牢记。","pid":"p105"},{"t":"img","src":"assets/img/u13_040.webp","ilabel":"U13-2","icap":"多头通道回调","fid":"fig41","ctx":[{"t":"市场正在一个相当紧密的多头通道中上扬，我将简要讨论多头通道中的K线计数。例如此处有一段上涨，此处是一次回调这个低点跌破前根K线的低点，因此这是回调，此处形成高一买入信号。市场继续上涨，但幅度有限。尚不足以判断趋势恢复。我更倾向于认为这波上涨是次要波动，小幅反转，且回调仍在延续扩大。部分交易者会说需要重新开始计数，他们称此为高一买入信号，当价格跌破前根K线低点，交易者会将止损位设在当前K线高点上方并买入。在多头K线上方买入长更稳妥，因此他们在此处买入，另有观点认为这是突破多头旗型后的回调。他们将其标注为高一信号，在我看来这波上涨更像是交易区间或回调中的多头行情，我认为这更接近双底多头旗型。此处是高一，而此处形成高二，具体名称并不重要，关键要牢记目标，目标是寻找合理方式进场做多，多头趋势可能持续很久，不能始终观望。犹豫如何进场，这才是逻辑进场点在高一或高二位置买入。要明白市场当前处于始终持多状态，后续很可能继续走高。再次出现两根多头K线，这是新趋势起点吗？这是回调吗？类似此前行情这波上涨力度不足，我不认为趋势恢复仍将其视为同轮回调的延续。你愿称之为高一吗？也可解读为双底多头旗型突破，尽管弱势，但仍属突破，当前是对该突破的回调。部分量化系统如此判定，其他系统则认为第一推，第二推，第三推对应形成高三或三角形。这显然是突破，出现明确突破需要重新计数，而该空头K线跌破前跟低点。此处形成高一买入形态。另一波创新高的突破力度欠佳，出现停顿K线，空头K线在小周期图表上，这属于回调。严格来说，突破该线高点可做高一买入交易的，通常在该K线高点上方一档设置止损多单。此处同理三根多头K线组合。虽未跌破前低，但已显疲态。这是大胆突破后形成的双内包线停顿信号，对我来说这是一个高一多头旗型，在较小的时间框架图上，这两根小K线构成了三角形。交易者会在前一根K线高点略上方买入，并在该处直接做多，因此这是一个高一多头旗型。这里我们有一个高一多头旗型，止损设在最近关键较高低点的底部，下方可能低至此处，也许在这里。你可以说这里形成了突破，止损或许已经设在此下方，所有这些位置都是合理的，唯一不合理且错误的止损是当你在这个线上到买入并再次做多时，不要将其低点下方设为止损位，因为市场有时会出现第二或第三下跌腿。而这里确实出现了至少进行第二次上尝试，这是高二多头旗型或高二入场形态，这是合理的做多方式之后甚至出现了高三形态，若你愿意，也可称为楔形，因为是横向下移的三段推动。但所有这些都是合理的入场位，记住个新目标，目标在于你身处多头趋势中，你需要建立多仓，而这是在多头趋势中建立多仓的逻辑策略。市场再次上涨创出新高，形成相当不错的突破，因此若在此区域任何位置买入，止损应设在最近关键较高低点的底部下方，关键较高低点之所谓关键是因为我们创了新高，且涨势相当强劲，这根K线跌破了前一根K线的低点，所以就是股票交易者将考虑在前一根K线高点上方买入，但这根K线未能突破该高点，因此止损挂单未被成交，多头并未进场，他们持续调整至首位，在每根K线收盘时，他们挂单略高于该K线高点买入，最终会在这根外包阳线多头其形态处成交。重申我仍不需要此处的向上突破，并不强势，更大，可能只是回调段的延伸。我会称之为高二失效形态，另外需牢记。","p":"p105"},{"t":"以下是使用外汇图表的案例，原理相同，也处于多头趋势，我们始终持有多仓，当前出现回调，这根K线跌破了前一根K线的低点，交易者将在此K线上方设置买入止损（突破单）单建立多仓，但未成交。此处同理，在此K线上方设置买入止损单以建立多仓，未能成交，最终他们在上方挂出买入止损单并在此处成交。这是高一入场点，也是高一多头旗型。强劲突破创新高后形成重要更高低点，交易者从此刻起可在任意位置建仓，止损设于该低点下方，目标建立多头仓位，具体操作方式多样，可买入K线收盘价，可在该K线低点下方挂限价单买入，K线计数体系中，我主要考量止损入场策略(stop order)，本视频聚焦K线及重点讨论止损入场。交易者持续挂买入止损单，该K线收盘即刻挂单于其高点上方，随后再此处成交，形成小型双底结构，此时可作为高二入场点，突破跟随走势。回调出现后，在回调K线高点上方挂买入止损单，建立多仓，成交于次，此为高一形态，回调持续演进，尽管创出新高，回调幅度进一步扩大。可是做高二形态。首次上攻尝试未果，此为二次上攻尝试突破形成关键高点/低点。构成高一买入信号，所以此处再次突破，可以新计视作新高一。若是突破后延续回调，我倾向于视作同一回调波段。故计数保持为高一，高二，高三乃至高四形态，若愿意也可称三角整理本质相同，核心目标是建立多头仓位，当前没有任何迹象显示空头掌控局面。价格仍远高于均值水平，且处于有效多头突破结构中，尚未形成可信底部，任何反转下跌尝试都可能失败，最终演变为多头旗型并恢复上涨趋势。回调阶段，每根K线交易者都关注前根K线高点上方的买入机会，无需捕捉所有入场点，但因至少参与一次，市场明确看涨，且潜在空间巨大。此处出现阴线回调。且跌破前跟K线低点，交易者开始在前期高点上方挂买入止损单，K线收盘立即在其高点上方挂止损买单成交于此，此乃高一多头旗型。多头趋势未延续转为横盘，当前二次尝试做多即为高二买入信号，建仓位可任选。多数交易者不会两次建仓，仅选择其一。这是高二形态，二次做多尝试，亦属双底结构。首次下推——回调——二次下推，所有双底均为高二买入形态。买入形态。","p":"p106"}]},{"t":"para","text":"以下是使用外汇图表的案例，原理相同，也处于多头趋势，我们始终持有多仓，当前出现回调，这根K线跌破了前一根K线的低点，交易者将在此K线上方设置买入止损（突破单）单建立多仓，但未成交。此处同理，在此K线上方设置买入止损单以建立多仓，未能成交，最终他们在上方挂出买入止损单并在此处成交。这是高一入场点，也是高一多头旗型。强劲突破创新高后形成重要更高低点，交易者从此刻起可在任意位置建仓，止损设于该低点下方，目标建立多头仓位，具体操作方式多样，可买入K线收盘价，可在该K线低点下方挂限价单买入，K线计数体系中，我主要考量止损入场策略(stop order)，本视频聚焦K线及重点讨论止损入场。交易者持续挂买入止损单，该K线收盘即刻挂单于其高点上方，随后再此处成交，形成小型双底结构，此时可作为高二入场点，突破跟随走势。回调出现后，在回调K线高点上方挂买入止损单，建立多仓，成交于次，此为高一形态，回调持续演进，尽管创出新高，回调幅度进一步扩大。可是做高二形态。首次上攻尝试未果，此为二次上攻尝试突破形成关键高点/低点。构成高一买入信号，所以此处再次突破，可以新计视作新高一。若是突破后延续回调，我倾向于视作同一回调波段。故计数保持为高一，高二，高三乃至高四形态，若愿意也可称三角整理本质相同，核心目标是建立多头仓位，当前没有任何迹象显示空头掌控局面。价格仍远高于均值水平，且处于有效多头突破结构中，尚未形成可信底部，任何反转下跌尝试都可能失败，最终演变为多头旗型并恢复上涨趋势。回调阶段，每根K线交易者都关注前根K线高点上方的买入机会，无需捕捉所有入场点，但因至少参与一次，市场明确看涨，且潜在空间巨大。此处出现阴线回调。且跌破前跟K线低点，交易者开始在前期高点上方挂买入止损单，K线收盘立即在其高点上方挂止损买单成交于此，此乃高一多头旗型。多头趋势未延续转为横盘，当前二次尝试做多即为高二买入信号，建仓位可任选。多数交易者不会两次建仓，仅选择其一。这是高二形态，二次做多尝试，亦属双底结构。首次下推——回调——二次下推，所有双底均为高二买入形态。买入形态。","pid":"p106"},{"t":"img","src":"assets/img/u13_041.webp","ilabel":"U13-3","icap":"多头通道回调","fid":"fig42","ctx":[{"t":"以下是使用外汇图表的案例，原理相同，也处于多头趋势，我们始终持有多仓，当前出现回调，这根K线跌破了前一根K线的低点，交易者将在此K线上方设置买入止损（突破单）单建立多仓，但未成交。此处同理，在此K线上方设置买入止损单以建立多仓，未能成交，最终他们在上方挂出买入止损单并在此处成交。这是高一入场点，也是高一多头旗型。强劲突破创新高后形成重要更高低点，交易者从此刻起可在任意位置建仓，止损设于该低点下方，目标建立多头仓位，具体操作方式多样，可买入K线收盘价，可在该K线低点下方挂限价单买入，K线计数体系中，我主要考量止损入场策略(stop order)，本视频聚焦K线及重点讨论止损入场。交易者持续挂买入止损单，该K线收盘即刻挂单于其高点上方，随后再此处成交，形成小型双底结构，此时可作为高二入场点，突破跟随走势。回调出现后，在回调K线高点上方挂买入止损单，建立多仓，成交于次，此为高一形态，回调持续演进，尽管创出新高，回调幅度进一步扩大。可是做高二形态。首次上攻尝试未果，此为二次上攻尝试突破形成关键高点/低点。构成高一买入信号，所以此处再次突破，可以新计视作新高一。若是突破后延续回调，我倾向于视作同一回调波段。故计数保持为高一，高二，高三乃至高四形态，若愿意也可称三角整理本质相同，核心目标是建立多头仓位，当前没有任何迹象显示空头掌控局面。价格仍远高于均值水平，且处于有效多头突破结构中，尚未形成可信底部，任何反转下跌尝试都可能失败，最终演变为多头旗型并恢复上涨趋势。回调阶段，每根K线交易者都关注前根K线高点上方的买入机会，无需捕捉所有入场点，但因至少参与一次，市场明确看涨，且潜在空间巨大。此处出现阴线回调。且跌破前跟K线低点，交易者开始在前期高点上方挂买入止损单，K线收盘立即在其高点上方挂止损买单成交于此，此乃高一多头旗型。多头趋势未延续转为横盘，当前二次尝试做多即为高二买入信号，建仓位可任选。多数交易者不会两次建仓，仅选择其一。这是高二形态，二次做多尝试，亦属双底结构。首次下推——回调——二次下推，所有双底均为高二买入形态。买入形态。","p":"p106"},{"t":"按此下推，所有双底均为高二买入形态。此前展示紧密通道案例，现切换至宽幅通道场景及回调幅度更深，且持续周期更长，这轮回调持续10根K线，但核心原理不变。当市场处于宽幅多头通道时，通常会出现强度足以让交易者误以为当前始终看空的逆转，虽然出现强势多头突破，但该低点已跌破此前强势多头突破的低点，我们仍处于始终看到状态吗？可能在当前位置已转为始终看空，大概在这根K线收盘时确定，然而整体市场仍在尝试走高。这个低点或许略低于前低，但我们仍在构筑更高的高点，此刻开始形成更高的低点，若愿意称此为交易区间，也可将整体视为宽幅多头通道，尽管此处出现较低的低点，我们仍持续创造更高的高点。宽幅多头通道通常包含大量交易区间性质的价格行为，此处基本属于从起点延续至此的交易区间，但它同时也构成宽幅多头通道。非常强势的突破走势，抛盘强度足以触发始终看空，但市场仍在构筑更高的高点与低点，此刻该低点似乎低于前位，尚难定论，明确跌破前低段更高的高点持续形成，即便遭遇这轮回调，鉴于更高的高点存在，我仍认为可能是宽幅多头通道，现在正开始形成更高的低点。在通道形态确认前，更宜为暂时视为交易区间，这意味着应采取低买高卖策略，并分批操作。整轮回调包含两段下跌走势，此处为高一形态，属于高一的第二次入场机会，最后出现新的空头突破，此处则转化为高二买入位，这是明确位于交易区间，可能属于多头通道的高点买入位。当前市场正蓄势上攻，多头突破伴随多根阳线形成更高的低点，又一波多头突破足够强劲确立此为主要更高的低点，只要市场不跌破主要更高的低点，就仍处多头通道。再度有效突破，多头突破跟随走势，创出新高，虽有两段下跌，但形成更高的低点，因此仍数宽幅多头通道。任何在此区域买入的交易者，止损应设于最近主要高点或低点下方，此处创新高时出现力度上佳的多头K线，该位置随之成为主要更高的低点，故当前在此区域买入者需将止损设于此位。此为高一还是高二形态，由于此前K线未突破前高，可视为高一形态即首根突破前高的K线。K线组合成阴线，阳线，阴线排列，须知在更小周期图表中视为两段下跌走势，第一段下跌和第二段下跌，若愿意可称为高二多头旗型，亦可为高一多头旗型。当市场处于看似交易区间的宽幅通道时，可运用区间策略低买高卖，并分批操作。当下出现多头突破后的回调，随后创新高，有回调至此低点下方。后续数次回调均跌破该低点。可视作首段下跌-回调-第二段下跌，此形态将构成高二或高三买入位。高一回调和高二回调并未触发，现在是高三回调，或者说这实际上是一轮回调中的第三段下跌走势，尽管价格曾突破前高，但它仍属于楔形的一部分。我倾向于这样解读。空头尚未展现出足够力量，让我相信多头与持续控制我们仍在形成更高的低点，价格仍处于关键波段低点上方，且持续创出更高的高点，因此我仍倾向做多，因为做多的盈利概率高于做空。我可以在高一，高二或高三回调位置做多。我通常不会在高一回调买入，因为这里出现了几根有利的阴线，首次反转上行可能力度有限，预计还会有小幅下跌，当前已形成两个小型下推结构，若愿意一个将其视作大楔形内部的小型三角形中，核心目标是建立多仓，通过识别下跌段来辅助做多决策。当下跌段力度强劲时，我通常不会在高一回调买入，我会等待第二次入场信号，例如双底结构。这样在新高位置出现空头反转信号，但低点持续上移，且高点不断抬高，仍处于宽阔的多头通道中，这个位置可视为高一点，连续三根一线出现在买入高潮后，我将等待第二次入场机会，或许在该位置上方买入，出现两根有效阴线，可能需要等待第三次入场信号。你可以称此为高一，高二，高二，第二次入场亦可成为高三，高一，高二回调序列。若进行分段，第一段下跌走势，第二段下跌走势，第三段下跌走势，最终构成大型高三回调结构。根本目标仍是建立多头三位，虽然出现强烈的空头反转信号，但价格仍坚守在关键波段低点之上。我们始终维持多头主导格局，最佳交易策略是捕捉趋势恢复信号做多，买入时将止损失设在当前K线高点上方，以上任意入场方式均可接受。若不确定，可等待第二次信号确认，例如当前位置出现强烈下行走势，我通常不会采用首次入场策略，更倾向于第二次入场，尤其当信号K线呈现阳线实体时，同理双重高潮后连续三根阴线，我宁愿在此处阳线上方进行第二次入场，我在更低位进行第三次入场。当前下行力度强劲，我是否应该在首次反弹时买入？通常不会，但价格再次下探后回升，随后又因这根阴线再度回落，与此前低点形成微型双底结构，而此阴线高点构成双底颈线位。突破该阴线高点，即形成高二买入信号。两段下跌走势配合两根阴线后出现阳线，那么一个下跌走势结束，随后出现更多阴线，这里形成高二形态，另一个微型双底后出现阴线。随后上涨又出现阴性，这是微型双底的颈线位，可在该阳线高点上方买入，或直接在阴线高点上方买入。宽幅多头通道正如我所言，通常伴随长时间横盘震荡，当市场处于宽幅多头通道时，多数K线往往也处于交易区间内。正经处于交易区间，空方也会择机卖出，三段推升结构，这是第三做空位，空方将卖出，并预期两段下跌走势。就是下跌走势。","p":"p107"}]},{"t":"para","text":"按此下推，所有双底均为高二买入形态。此前展示紧密通道案例，现切换至宽幅通道场景及回调幅度更深，且持续周期更长，这轮回调持续10根K线，但核心原理不变。当市场处于宽幅多头通道时，通常会出现强度足以让交易者误以为当前始终看空的逆转，虽然出现强势多头突破，但该低点已跌破此前强势多头突破的低点，我们仍处于始终看到状态吗？可能在当前位置已转为始终看空，大概在这根K线收盘时确定，然而整体市场仍在尝试走高。这个低点或许略低于前低，但我们仍在构筑更高的高点，此刻开始形成更高的低点，若愿意称此为交易区间，也可将整体视为宽幅多头通道，尽管此处出现较低的低点，我们仍持续创造更高的高点。宽幅多头通道通常包含大量交易区间性质的价格行为，此处基本属于从起点延续至此的交易区间，但它同时也构成宽幅多头通道。非常强势的突破走势，抛盘强度足以触发始终看空，但市场仍在构筑更高的高点与低点，此刻该低点似乎低于前位，尚难定论，明确跌破前低段更高的高点持续形成，即便遭遇这轮回调，鉴于更高的高点存在，我仍认为可能是宽幅多头通道，现在正开始形成更高的低点。在通道形态确认前，更宜为暂时视为交易区间，这意味着应采取低买高卖策略，并分批操作。整轮回调包含两段下跌走势，此处为高一形态，属于高一的第二次入场机会，最后出现新的空头突破，此处则转化为高二买入位，这是明确位于交易区间，可能属于多头通道的高点买入位。当前市场正蓄势上攻，多头突破伴随多根阳线形成更高的低点，又一波多头突破足够强劲确立此为主要更高的低点，只要市场不跌破主要更高的低点，就仍处多头通道。再度有效突破，多头突破跟随走势，创出新高，虽有两段下跌，但形成更高的低点，因此仍数宽幅多头通道。任何在此区域买入的交易者，止损应设于最近主要高点或低点下方，此处创新高时出现力度上佳的多头K线，该位置随之成为主要更高的低点，故当前在此区域买入者需将止损设于此位。此为高一还是高二形态，由于此前K线未突破前高，可视为高一形态即首根突破前高的K线。K线组合成阴线，阳线，阴线排列，须知在更小周期图表中视为两段下跌走势，第一段下跌和第二段下跌，若愿意可称为高二多头旗型，亦可为高一多头旗型。当市场处于看似交易区间的宽幅通道时，可运用区间策略低买高卖，并分批操作。当下出现多头突破后的回调，随后创新高，有回调至此低点下方。后续数次回调均跌破该低点。可视作首段下跌-回调-第二段下跌，此形态将构成高二或高三买入位。高一回调和高二回调并未触发，现在是高三回调，或者说这实际上是一轮回调中的第三段下跌走势，尽管价格曾突破前高，但它仍属于楔形的一部分。我倾向于这样解读。空头尚未展现出足够力量，让我相信多头与持续控制我们仍在形成更高的低点，价格仍处于关键波段低点上方，且持续创出更高的高点，因此我仍倾向做多，因为做多的盈利概率高于做空。我可以在高一，高二或高三回调位置做多。我通常不会在高一回调买入，因为这里出现了几根有利的阴线，首次反转上行可能力度有限，预计还会有小幅下跌，当前已形成两个小型下推结构，若愿意一个将其视作大楔形内部的小型三角形中，核心目标是建立多仓，通过识别下跌段来辅助做多决策。当下跌段力度强劲时，我通常不会在高一回调买入，我会等待第二次入场信号，例如双底结构。这样在新高位置出现空头反转信号，但低点持续上移，且高点不断抬高，仍处于宽阔的多头通道中，这个位置可视为高一点，连续三根一线出现在买入高潮后，我将等待第二次入场机会，或许在该位置上方买入，出现两根有效阴线，可能需要等待第三次入场信号。你可以称此为高一，高二，高二，第二次入场亦可成为高三，高一，高二回调序列。若进行分段，第一
