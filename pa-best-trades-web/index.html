不称之为回调，给你一个机会认识，但在更高时间的框架上形态会更清晰，当回调持续时间过长，难以区分是回调还是已转为交易区间时。查看更高时间框架图表通常有助于判断两段下跌走势，注意，这是单日走势，E-mini图表81根K线,回调或持续20-30根K线，这算回调吗？还是空头趋势？此处可能以本为始终看空状态，当前并非典型的高一，高二多头趋势形态。当回调持续50/100/200根K线时，我不会在当前时间框架使用高一，高二策略，但整体形态仍明确属于多头趋势。转换到更高时间框架可更易识别回调。","p":"p108"},{"t":"接下来我将分析同品种的60分钟图。5分钟图的宽幅多头通道，在60分钟图上转为较紧密的多头通道。5分钟图的复杂回调在60分钟图更易识别。上涨波段-此处回调，价格试图上攻，此处，回调加深，形成高二形态，多头突破-回调。60分钟图15根K线回调，相当于5分钟图200根K线，不过这个形态仍然相当容易辨认。通过60分钟的图表可以看清行情，这是高一买入形态，也可称为双顶或高二形态，无论你将其称作高一，高二，高三都无关紧要，市场显然处于上涨趋势中，此时应建立多仓，将止损设在最近多头波段低点下方。这是最近的主要更高低点，或许在此处设置止损。在这里出现了有效突破，无论如何，无论基于高一，高二或高三何种理由做多，关键在于必须采用正确止损，设在此处或彼处低点下方。又一次多头突破，构成高一形态。此次突破力度强劲，交易者视其为关键节点，他们不愿看到市场跌破此低点，若破位则判定多头通道终结，行情将演变为交易区间甚至下降趋势，此时不应在高点买入。更不该继续持仓于高位。在此更高时间框架图表，K线实体更大，止损位需下移，因此需减少仓位规模，确保单笔交易风险可控。若无法调整它的规模，不必勉强，放弃此笔交易即可，等待能使用恰当仓位和止损的形态出现。","p":"p109"}]},{"t":"para","text":"接下来我将分析同品种的60分钟图。5分钟图的宽幅多头通道，在60分钟图上转为较紧密的多头通道。5分钟图的复杂回调在60分钟图更易识别。上涨波段-此处回调，价格试图上攻，此处，回调加深，形成高二形态，多头突破-回调。60分钟图15根K线回调，相当于5分钟图200根K线，不过这个形态仍然相当容易辨认。通过60分钟的图表可以看清行情，这是高一买入形态，也可称为双顶或高二形态，无论你将其称作高一，高二，高三都无关紧要，市场显然处于上涨趋势中，此时应建立多仓，将止损设在最近多头波段低点下方。这是最近的主要更高低点，或许在此处设置止损。在这里出现了有效突破，无论如何，无论基于高一，高二或高三何种理由做多，关键在于必须采用正确止损，设在此处或彼处低点下方。又一次多头突破，构成高一形态。此次突破力度强劲，交易者视其为关键节点，他们不愿看到市场跌破此低点，若破位则判定多头通道终结，行情将演变为交易区间甚至下降趋势，此时不应在高点买入。更不该继续持仓于高位。在此更高时间框架图表，K线实体更大，止损位需下移，因此需减少仓位规模，确保单笔交易风险可控。若无法调整它的规模，不必勉强，放弃此笔交易即可，等待能使用恰当仓位和止损的形态出现。","pid":"p109"},{"t":"img","src":"assets/img/u13_044.webp","ilabel":"U13-6","icap":"多头通道回调","fid":"fig45","ctx":[{"t":"接下来我将分析同品种的60分钟图。5分钟图的宽幅多头通道，在60分钟图上转为较紧密的多头通道。5分钟图的复杂回调在60分钟图更易识别。上涨波段-此处回调，价格试图上攻，此处，回调加深，形成高二形态，多头突破-回调。60分钟图15根K线回调，相当于5分钟图200根K线，不过这个形态仍然相当容易辨认。通过60分钟的图表可以看清行情，这是高一买入形态，也可称为双顶或高二形态，无论你将其称作高一，高二，高三都无关紧要，市场显然处于上涨趋势中，此时应建立多仓，将止损设在最近多头波段低点下方。这是最近的主要更高低点，或许在此处设置止损。在这里出现了有效突破，无论如何，无论基于高一，高二或高三何种理由做多，关键在于必须采用正确止损，设在此处或彼处低点下方。又一次多头突破，构成高一形态。此次突破力度强劲，交易者视其为关键节点，他们不愿看到市场跌破此低点，若破位则判定多头通道终结，行情将演变为交易区间甚至下降趋势，此时不应在高点买入。更不该继续持仓于高位。在此更高时间框架图表，K线实体更大，止损位需下移，因此需减少仓位规模，确保单笔交易风险可控。若无法调整它的规模，不必勉强，放弃此笔交易即可，等待能使用恰当仓位和止损的形态出现。","p":"p109"},{"t":"强劲多头趋势，美元/日元5分钟图。多次反转，尝试接连出现。此类窄通道在更高时间框架视为强势突破，此时不应考虑做空，每次反转尝试均可能失败，最终成为旗型回调的一部分。与其尝试做空，不如将其视为买入机会，即高一，高二，高三买入形态。高一或高二均可，每当出现反转尝试，先假设其为小幅调整，并将形成多头旗型，停止做空念头，耐心等待买入机会。","p":"p110"}]},{"t":"para","text":"强劲多头趋势，美元/日元5分钟图。多次反转，尝试接连出现。此类窄通道在更高时间框架视为强势突破，此时不应考虑做空，每次反转尝试均可能失败，最终成为旗型回调的一部分。与其尝试做空，不如将其视为买入机会，即高一，高二，高三买入形态。高一或高二均可，每当出现反转尝试，先假设其为小幅调整，并将形成多头旗型，停止做空念头，耐心等待买入机会。","pid":"p110"}],"wcount":5424},{"id":"u14","title":"Unit 14　空头通道回调","icon":"14","sections":[],"blocks":[{"t":"para","text":"Unit 14 空头通道回调","pid":"p111"},{"t":"img","src":"assets/img/u14_045.webp","ilabel":"U14-1","icap":"空头通道回调","fid":"fig46","ctx":[{"t":"Unit 14 空头通道回调","p":"p111"},{"t":"我现在要讲的是下跌通道中的回调。紧密下跌通道第一次回调是低一回调，第二次回调是低二空头旗型。这根小阳线上穿的那根阳线的高点，他就演变成了低一空头旗型。交易者在略低于其低点处挂止损空单，并在该位置成交，这里出现一根阳线，市场突破了它的高点，因此尽管这是多头反转K线，它仍属于低一空头旗型。交易者会在略低于其低点处卖出。如果愿意，你可将其称为低二形态，市场下跌，但幅度不大，价格再次回升，形成第二次入场做空机会，通常只要看到微型双顶形态，我就将其视作空头旗型。因此可在略低于那根K线低点处卖出。这里出现阳线，内包线，这是趋势中的停顿，也属于低一空头旗型。多头尝试反转，但处在紧密下跌通道中，任何上涨反转都可能是小幅调整，随后趋势将延续，因此每次反转更可能形成空头旗型，而非多头趋势。同理此处也是停顿形态，交易者在略低于前一根K线低点处挂止损K空单，最终再次成交，逻辑相同，逻辑相同。再看这里，市场在下跌通道下方出现空头突破，形成竭尽型缺口K线，卖出高潮后强势反转上涨，但它仍属于低一空头旗型。我认为这仍然是小幅反转，通常在此类持久下跌通道后发生首次上涨反转，即使强劲结束小幅调整，市场将向下回撤，通常多头需要主要趋势反转信号。这里形成突破下跌通道上轨的走势，市场通常仍会测试前低。因此这仍是合理的低点做空位置，但需警惕可能出现主要趋势反转。本例实际发生了，这仍是盈利空单，尤其适用剥头皮策略。","p":"p112"}]},{"t":"para","text":"我现在要讲的是下跌通道中的回调。紧密下跌通道第一次回调是低一回调，第二次回调是低二空头旗型。这根小阳线上穿的那根阳线的高点，他就演变成了低一空头旗型。交易者在略低于其低点处挂止损空单，并在该位置成交，这里出现一根阳线，市场突破了它的高点，因此尽管这是多头反转K线，它仍属于低一空头旗型。交易者会在略低于其低点处卖出。如果愿意，你可将其称为低二形态，市场下跌，但幅度不大，价格再次回升，形成第二次入场做空机会，通常只要看到微型双顶形态，我就将其视作空头旗型。因此可在略低于那根K线低点处卖出。这里出现阳线，内包线，这是趋势中的停顿，也属于低一空头旗型。多头尝试反转，但处在紧密下跌通道中，任何上涨反转都可能是小幅调整，随后趋势将延续，因此每次反转更可能形成空头旗型，而非多头趋势。同理此处也是停顿形态，交易者在略低于前一根K线低点处挂止损K空单，最终再次成交，逻辑相同，逻辑相同。再看这里，市场在下跌通道下方出现空头突破，形成竭尽型缺口K线，卖出高潮后强势反转上涨，但它仍属于低一空头旗型。我认为这仍然是小幅反转，通常在此类持久下跌通道后发生首次上涨反转，即使强劲结束小幅调整，市场将向下回撤，通常多头需要主要趋势反转信号。这里形成突破下跌通道上轨的走势，市场通常仍会测试前低。因此这仍是合理的低点做空位置，但需警惕可能出现主要趋势反转。本例实际发生了，这仍是盈利空单，尤其适用剥头皮策略。","pid":"p112"},{"t":"img","src":"assets/img/u14_046.webp","ilabel":"U14-2","icap":"空头通道回调","fid":"fig47","ctx":[{"t":"我现在要讲的是下跌通道中的回调。紧密下跌通道 倾向在第二次入场做空点进场或等待此处机会，当反弹如此强劲时，即使这是第二形态，我仍标注为低一信号在更高时间周期上，这属于低一结构，强力反弹后首次反转下行通常幅度有限，需等待回调阶段，交易者会更积极参与第二次入场做空。两段上涨配合一次回调或可称低一双顶组合，因此是低二形态，最后突破双顶失败，形成低三形态，突破双顶失败即构成低三信号，这属于三推上涨楔形，也可称为低一低二低三序列，价格仍位于强烈下跌趋势高点下方，因此即便当前明显处于交易区间，仍可能维持下跌趋势。此处明确形成交易区间，交易者等待反转下行做空机会，若上升通道强劲，他们更倾向第二次入场做空点位，故不再跌破此K线时卖出，而等待跌破该K线时空单再次成交。双顶结构可称为低二形态，也可称为三角形，第一段推升回调后，第二段推升再回调，第三段推升时只要出现水平紧密盘整区间并形成低三结构，我视其为三角形形态。此属扩张三角形顶部，123段结构，若要命名可称楔形，但此低点已跌破前低，我认为这是扩张三角形，此处更符合楔形特征，123推升，因此选择做空，扩张三角形形态下做空。这显然是交易区间，许多交易者会按区间策略操作，低买高卖进行剥头皮交易。虽然总体上仍在形成略低的低点和略低的高点，市场略微偏空，但交易者仍会双向操作，在区间的上1/3区域卖出，在下1/3区域买入，主要进行剥头皮。长期反转上涨后首次回调下行，幅度有限，后市至少还有上行空间，因此他们会买入双底形态，出现时买入反转上涨，尤其作为第二次入场机会更佳，此处第一次信号，此处是第二次入场。交易区间内双底是合理的买入机会。","p":"p114"}]},{"t":"para","text":"从图表可见，市场持续形成更低低点和更低高点，该高点看似略高于前高，但整体仍在构筑更低低点与更低高点，有时市场看似处于始终看多状态，却持续创新低与新低高点，这实际是宽幅下跌通道，形成宽幅下跌通道。宽幅下跌通道，常出现多头强劲时段，让交易者误判始终看多，但拉长周期观察，可见市场始于左上角，经历大幅震荡，跌至右下角。部分回调结构极其复杂，多次上涨推升可能形成低三形态。强劲反弹既可称作低一形态，也可视为第二次入场。低一机会，亦可称为低二形态约50%幅度回调，尽管反弹强劲，仍未突破主要更低高点顶部。随后强势突破创新低。因此该点位确立为主要更低高点，只要市场位于该高点下方，空头仍视其为潜在宽幅下跌通道，做空者继续持仓，未进场者伺机做空。我更倾向在第二次入场做空点进场或等待此处机会，当反弹如此强劲时，即使这是第二形态，我仍标注为低一信号在更高时间周期上，这属于低一结构，强力反弹后首次反转下行通常幅度有限，需等待回调阶段，交易者会更积极参与第二次入场做空。两段上涨配合一次回调或可称低一双顶组合，因此是低二形态，最后突破双顶失败，形成低三形态，突破双顶失败即构成低三信号，这属于三推上涨楔形，也可称为低一低二低三序列，价格仍位于强烈下跌趋势高点下方，因此即便当前明显处于交易区间，仍可能维持下跌趋势。此处明确形成交易区间，交易者等待反转下行做空机会，若上升通道强劲，他们更倾向第二次入场做空点位，故不再跌破此K线时卖出，而等待跌破该K线时空单再次成交。双顶结构可称为低二形态，也可称为三角形，第一段推升回调后，第二段推升再回调，第三段推升时只要出现水平紧密盘整区间并形成低三结构，我视其为三角形形态。此属扩张三角形顶部，123段结构，若要命名可称楔形，但此低点已跌破前低，我认为这是扩张三角形，此处更符合楔形特征，123推升，因此选择做空，扩张三角形形态下做空。这显然是交易区间，许多交易者会按区间策略操作，低买高卖进行剥头皮交易。虽然总体上仍在形成略低的低点和略低的高点，市场略微偏空，但交易者仍会双向操作，在区间的上1/3区域卖出，在下1/3区域买入，主要进行剥头皮。长期反转上涨后首次回调下行，幅度有限，后市至少还有上行空间，因此他们会买入双底形态，出现时买入反转上涨，尤其作为第二次入场机会更佳，此处第一次信号，此处是第二次入场。交易区间内双底是合理的买入机会。","pid":"p114"},{"t":"img","src":"assets/img/u14_048.webp","ilabel":"U14-4","icap":"空头通道回调","fid":"fig49","ctx":[{"t":"从图表可见，市场持续形成更低低点和更低高点，该高点看似略高于前高，但整体仍在构筑更低低点与更低高点，有时市场看似处于始终看多状态，却持续创新低与新低高点，这实际是宽幅下跌通道，形成宽幅下跌通道。宽幅下跌通道，常出现多头强劲时段，让交易者误判始终看多，但拉长周期观察，可见市场始于左上角，经历大幅震荡，跌至右下角。部分回调结构极其复杂，多次上涨推升可能形成低三形态。强劲反弹既可称作低一形态，也可 三角形做空机会以及双顶做空机会，此区域双顶配合多头突破失败，属于楔形变体，123推上构成低三做空形态，此处小型双顶，低二做空机会。又出现小型双顶，低二做空信号，此处楔形结构，三次推升低三做空点。再次三波推升，接下来微型三角形，低三做空位，双顶结构，此高点与彼高点，第二做空机会，另一双顶空头旗型。市场持续下行，连续创更低点与更低高点，即使出现强劲反转上涨，整体趋势仍然向下。交易者应坚持寻找做空机会，例如在最新下跌波段，中段逢高做空。由于更高时间周期图表止损位较远，若在此区域做空，止损需设在此上方，止损幅度大时必须相应缩小仓位。若无法将仓位降至足够小的，应该放弃交易，因外汇市场支持微小仓位交易，多数交易者可执行，若参与交易必须采用合理仓位并设置对应止损，即使止损幅度较宽。","pid":"p116"},{"t":"img","src":"assets/img/u14_050.webp","ilabel":"U14-6","icap":"空头通道回调","fid":"fig51","ctx":[{"t":"这是120分钟图，更清晰显示为宽幅下跌通道。事实上在120分钟图上通道相当紧密。此时间周期下形态和K线组合更易识别。当现行时间周期出现过多细小反转信号，且需借助K线组合入场时，切换高时间周期通常更优。三次小幅推升123，构成小型低三形态，三角形结构出现属于低三做空信号，此处双顶形态也可视为三角形。三波推升123，尽管此低点低于前低，仍属三角形，因此这是三角形做空机会以及双顶做空机会，此区域双顶配合多头突破失败，属于楔形变体，123推上构成低三做空形态，此处小型双顶，低二做空机会。又出现小型双顶，低二做空信号，此处楔形结构，三次推升低三做空点。再次三波推升，接下来微型三角形，低三做空位，双顶结构，此高点与彼高点，第二做空机会，另一双顶空头旗型。市场持续下行，连续创更低点与更低高点，即使出现强劲反转上涨，整体趋势仍然向下。交易者应坚持寻找做空机会，例如在最新下跌波段，中段逢高做空。由于更高时间周期图表止损位较远，若在此区域做空，止损需设在此上方，止损幅度大时必须相应缩小仓位。若无法将仓位降至足够小的，应该放弃交易，因外汇市场支持微小仓位交易，多数交易者可执行，若参与交易必须采用合理仓位并设置对应止损，即使止损幅度较宽。","p":"p116"},{"t":"欧元兑美元5分钟图，明确显示下跌趋势，此处出现看似漂亮的反转形态。当下跌通道如此紧密时，切勿买入，否则必然亏损，每一次反转尝试实质都是空头获利了结。当止损距离过大时，空头必须缩减风险，最简单方式是部分平仓获利，这形成空头旗型，并吸引新空头进场，空头一直等待回调做空机会，现在得到回调试探。因此不要尝试买入，即便出现漂亮的反转，K线下跌通道过于紧密，任何上涨反转都是次要走势，最终将演变为空头旗型而非多头趋势。正确做法是每当看到买入形态时，等待其失败并反手做空，持续做空，做空，做空，做空。","p":"p117"}]},{"t":"para","text":"欧元兑美元5分钟图，明确显示下跌趋势，此处出现看似漂亮的反转形态。当下跌通道如此紧密时，切勿买入，否则必然亏损，每一次反转尝试实质都是空头获利了结。当止损距离过大时，空头必须缩减风险，最简单方式是部分平仓获利，这形成空头旗型，并吸引新空头进场，空头一直等待回调做空机会，现在得到回调试探。因此不要尝试买入，即便出现漂亮的反转，K线下跌通道过于紧密，任何上涨反转都是次要走势，最终将演变为空头旗型而非多头趋势。正确做法是每当看到买入形态时，等待其失败并反手做空，持续做空，做空，做空，做空。","pid":"p117"}],"wcount":2752},{"id":"u15","title":"Unit 15　交易区间","icon":"15","sections":[],"blocks":[{"t":"para","text":"Unit 15 交易区间","pid":"p118"},{"t":"img","src":"assets/img/u15_051.webp","ilabel":"U15-1","icap":"交易区间","fid":"fig52","ctx":[{"t":"Unit 15 交易区间","p":"p118"},{"t":"我将从交易区间的总体概念开始讲解，交易区间指任何双向交易区域，哪怕仅由单根K线构成。例如市场在这根K线上涨，在那根K线下跌，这就是单K线交易区间。每根十字星都是单K线交易区间，市场先下跌后上涨。其他例子：单根K线内上下波动,也构成单K线交易区间，若切换至足够小的时间框架图表，这类区间可能延伸至20或30根K线，当交易区间规模较小，如上涨趋势中的1根5根或10根K线。上涨趋势延续的概率较高，我倾向于仅当回调持续20根或更多K线时才使用交易区间这一术语，若仅持续5或10根K线，则趋势很可能延续，例如在上涨趋势中出现单K线回调。虽是小规模交易区间，但市场继续走高的概率更大。","p":"p119"}]},{"t":"para","text":"我将从交易区间的总体概念开始讲解，交易区间指任何双向交易区域，哪怕仅由单根K线构成。例如市场在这根K线上涨，在那根K线下跌，这就是单K线交易区间。每根十字星都是单K线交易区间，市场先下跌后上涨。其他例子：单根K线内上下波动,也构成单K线交易区间，若切换至足够小的时间框架图表，这类区间可能延伸至20或30根K线，当交易区间规模较小，如上涨趋势中的1根5根或10根K线。上涨趋势延续的概率较高，我倾向于仅当回调持续20根或更多K线时才使用交易区间这一术语，若仅持续5或10根K线，则趋势很可能延续，例如在上涨趋势中出现单K线回调。虽是小规模交易区间，但市场继续走高的概率更大。","pid":"p119"},{"t":"img","src":"assets/img/u15_052.webp","ilabel":"U15-2","icap":"交易区间","fid":"fig53","ctx":[{"t":"我将从交易区间的总体概念开始讲解，交易区间指任何双向交易区域，哪怕仅由单根K线构成。例如市场在这根K线上涨，在那根K线下跌，这就是单K线交易区间。每根十字星都是单K线交易区间，市场先下跌后上涨。其他例子：单根K线内上下波动,也构成单K线交易区间，若切换至足够小的时间框架图表，这类区间可能延伸至20或30根K线，当交易区间规模较小，如上涨趋势中的1根5根或10根K线。上涨趋势延续的概率较高，我倾向于仅当回调持续20根或更多K线时才使用交易区间这一术语，若仅持续5或10根K线，则趋势很可能延续，例如在上涨趋势中出现单K线回调。虽是小规模交易区间，但市场继续走高的概率更大。","p":"p119"},{"t":"此处存在上涨趋势，彼处存在下跌趋势，期间出现小型回调。每个小型回调都是多头旗型，包括当前这个旗型，市场延续升势的概率较高，概率并非70%或80%，可能在60%左右，这意味着40%的概率不会延续，出现多头旗型后，市场未实现向上突破延续趋势，反而出现向下突破，这根K线代表多头放弃,而空头掌控局面。记住，回调是趋势中的停顿，通常趋势会延续，因此趋势延续，回调后趋势延续,，回调后趋势延续，回调后趋势反转，这种情况偶有发生，但非主流。随后出现下跌趋势，可认为下跌趋势始于此，因此此处是停顿性回调，接着再次出现小型回调，它逐渐演变为更大规模的回调，小型回调接续小型回调，规模逐步扩大，谨记一旦回调持续约20根K线，趋势延续下行的概率将与趋势反转上行的概率趋近。但多数空头旗型后会延续下跌趋势。","p":"p120"}]},{"t":"para","text":"此处存在上涨趋势，彼处存在下跌趋势，期间出现小型回调。每个小型回调都是多头旗型，包括当前这个旗型，市场延续升势的概率较高，概率并非70%或80%，可能在60%左右，这意味着40%的概率不会延续，出现多头旗型后，市场未实现向上突破延续趋势，反而出现向下突破，这根K线代表多头放弃,而空头掌控局面。记住，回调是趋势中的停顿，通常趋势会延续，因此趋势延续，回调后趋势延续,，回调后趋势延续，回调后趋势反转，这种情况偶有发生，但非主流。随后出现下跌趋势，可认为下跌趋势始于此，因此此处是停顿性回调，接着再次出现小型回调，它逐渐演变为更大规模的回调，小型回调接续小型回调，规模逐步扩大，谨记一旦回调持续约20根K线，趋势延续下行的概率将与趋势反转上行的概率趋近。但多数空头旗型后会延续下跌趋势。","pid":"p120"},{"t":"img","src":"assets/img/u15_053.webp","ilabel":"U15-3","icap":"交易区间","fid":"fig54","ctx":[{"t":"此处存在上涨趋势，彼处存在下跌趋势，期间出现小型回调。每个小型回调都是多头旗型，包括当前这个旗型，市场延续升势的概率较高，概率并非70%或80%，可能在60%左右，这意味着40%的概率不会延续，出现多头旗型后，市场未实现向上突破延续趋势，反而出现向下突破，这根K线代表多头放弃,而空头掌控局面。记住，回调是趋势中的停顿，通常趋势会延续，因此趋势延续，回调后趋势延续,，回调后趋势延续，回调后趋势反转，这种情况偶有发生，但非主流。随后出现下跌趋势，可认为下跌趋势始于此，因此此处是停顿性回调，接着再次出现小型回调，它逐渐演变为更大规模的回调，小型回调接续小型回调，规模逐步扩大，谨记一旦回调持续约20根K线，趋势延续下行的概率将与趋势反转上行的概率趋近。但多数空头旗型后会延续下跌趋势。","p":"p120"},{"t":"交易区间本质上是一个水平通道，这里存在上涨通道，下跌通道和水平通道。当市场处于上涨趋势时，交易者倾向于在通道下半部买入，此为下半部，虽未标注上半部分，但此区域属下半部。在下跌通道中，若回调幅度足够，大多头也会在上涨通道下半部寻求买入机会。当然在下跌通道中，多头会在上半部或中部获利了结，空头则在上半部分卖出。在深度回调的上涨通道中，空头会寻求在上半部分卖出相同逻辑适用于交易区间，在交易区间内，交易者尝试在下1/3区域买入，在上1/3区域卖出。通常应避免在中部1/3区域入场，但若在中部买入仓位需足够轻易便在更低位置加仓，若在中部卖出头寸需足够小，以便在更高位置加仓。","p":"p121"}]},{"t":"para","text":"交易区间本质上是一个水平通道，这里存在上涨通道，下跌通道和水平通道。当市场处于上涨趋势时，交易者倾向于在通道下半部买入，此为下半部，虽未标注上半部分，但此区域属下半部。在下跌通道中，若回调幅度足够，大多头也会在上涨通道下半部寻求买入机会。当然在下跌通道中，多头会在上半部或中部获利了结，空头则在上半部分卖出。在深度回调的上涨通道中，空头会寻求在上半部分卖出相同逻辑适用于交易区间，在交易区间内，交易者尝试在下1/3区域买入，在上1/3区域卖出。通常应避免在中部1/3区域入场，但若在中部买入仓位需足够轻易便在更低位置加仓，若在中部卖出头寸需足够小，以便在更高位置加仓。","pid":"p121"},{"t":"img","src":"assets/img/u15_054.webp","ilabel":"U15-4","icap":"交易区间","fid":"fig55","ctx":[{"t":"交易区间本质上是一个水平通道，这里存在上涨通道，下跌通道和水平通道。当市场处于上涨趋势时，交易者倾向于在通道下半部买入，此为下半部，虽未标注上半部分，但此区域属下半部。在下跌通道中，若回调幅度足够，大多头也会在上涨通道下半部寻求买入机会。当然在下跌通道中，多头会在上半部或中部获利了结，空头则在上半部分卖出。在深度回调的上涨通道中，空头会寻求在上半部分卖出相同逻辑适用于交易区间，在交易区间内，交易者尝试在下1/3区域买入，在上1/3区域卖出。通常应避免在中部1/3区域入场，但若在中部买入仓位需足够轻易便在更低位置加仓，若在中部卖出头寸需足够小，以便在更高位置加仓。","p":"p121"},{"t":"交易区间是水平通道，有别于上涨或下跌通道。如同任何通道交易区间即可是宽幅通道，也可是极窄通道。当呈现如此宽幅时，交易者可用止损单在下反转点或上反转点入场，也可市价单入场，限价单入场。并在区间足够大时进行剥头皮或波段交易。但当通道收至极窄时，盈利空间有限，若交易者要在如此窄幅通道操作，应仅进行剥头皮交易，且优先采用限价单入场，例如在多头旗型上方卖出，押注其将反转在空头旗型底部买入，押注空头失败且市场反转上行。许多交易者采用宽止损并分批建仓，多数交易者尤其新手，不应尝试此类操作。如此窄幅的交易区间，本质上是限价单市场。参与交易的通常是经验丰富的剥头皮者，且多数采用限价单入场，区间过窄时盈利困难。风险回报与精力投入不匹配。交易者不如等待宽幅通道或趋势行情。因此，当出现此类情况时停止交易，尤其当交易区间已持续20，30，40根K线时，通常应停止交易。","p":"p122"}]},{"t":"para","text":"交易区间是水平通道，有别于上涨或下跌通道。如同任何通道交易区间即可是宽幅通道，也可是极窄通道。当呈现如此宽幅时，交易者可用止损单在下反转点或上反转点入场，也可市价单入场，限价单入场。并在区间足够大时进行剥头皮或波段交易。但当通道收至极窄时，盈利空间有限，若交易者要在如此窄幅通道操作，应仅进行剥头皮交易，且优先采用限价单入场，例如在多头旗型上方卖出，押注其将反转在空头旗型底部买入，押注空头失败且市场反转上行。许多交易者采用宽止损并分批建仓，多数交易者尤其新手，不应尝试此类操作。如此窄幅的交易区间，本质上是限价单市场。参与交易的通常是经验丰富的剥头皮者，且多数采用限价单入场，区间过窄时盈利困难。风险回报与精力投入不匹配。交易者不如等待宽幅通道或趋势行情。因此，当出现此类情况时停止交易，尤其当交易区间已持续20，30，40根K线时，通常应停止交易。","pid":"p122"},{"t":"img","src":"assets/img/u15_055.webp","ilabel":"U15-5","icap":"交易区间","fid":"fig56","ctx":[{"t":"交易区间是水平通道，有别于上涨或下跌通道。如同任何通道交易区间即可是宽幅通道，也可是极窄通道。当呈现如此宽幅时，交易者可用止损单在下反转点或上反转点入场，也可市价单入场，限价单入场。并在区间足够大时进行剥头皮或波段交易。但当通道收至极窄时，盈利空间有限，若交易者要在如此窄幅通道操作，应仅进行剥头皮交易，且优先采用限价单入场，例如在多头旗型上方卖出，押注其将反转在空头旗型底部买入，押注空头失败且市场反转上行。许多交易者采用宽止损并分批建仓，多数交易者尤其新手，不应尝试此类操作。如此窄幅的交易区间，本质上是限价单市场。参与交易的通常是经验丰富的剥头皮者，且多数采用限价单入场，区间过窄时盈利困难。风险回报与精力投入不匹配。交易者不如等待宽幅通道或趋势行情。因此，当出现此类情况时停止交易，尤其当交易区间已持续20，30，40根K线时，通常应停止交易。","p":"p122"},{"t":"关于极窄区间剥头皮，我有几条规则，这是E-mini合约图表，在E-mini的多数K线波动大于最小剥头皮幅度。E-mini的最小波头皮幅度为四个最小价位（1个点），若要在极窄区间剥头皮，我需要K线波动大于最小剥头皮幅度，同时要求区间高度至少为最小剥头皮幅度的三倍。E-mini的最小剥头皮幅度为四个最小价位（1个点），我要求区间高度至少达3点。区间高度还需至少达到平均K线高度的三倍。外汇市场最小波头皮幅度为10点，因此理想情况下K线高度应达10点，在外汇市场可能难见此类K线。且整个区间高度需至少30点最小剥头皮幅度的三倍，才会考虑剥头皮交易。当区间如此窄时，多数交易者根本不应入场，即便用限价单。若执意在窄幅交易区间操作，限价单卖出更稳妥，你在多头旗型上方卖出并剥头皮，在区间中部获利了结，即在此处卖出，此处加仓，随后在盈亏平衡点至中部区域平仓。同时可在底部附近买入，此处出现第二空头旗型，但在交易区间底部附近买方更可能在该空头信号K线下方，此K线低点下方及彼K线低点下方介入。交易者会在该空头卖出信号K线低点。此处低点或彼处低点，若触及开始买入并剥头皮。在E-mini市场剥头皮目标为1-2点，若为外汇市场目标为10-20点。","p":"p123"}]},{"t":"para","text":"关于极窄区间剥头皮，我有几条规则，这是E-mini合约图表，在E-mini的多数K线波动大于最小剥头皮幅度。E-mini的最小波头皮幅度为四个最小价位（1个点），若要在极窄区间剥头皮，我需要K线波动大于最小剥头皮幅度，同时要求区间高度至少为最小剥头皮幅度的三倍。E-mini的最小剥头皮幅度为四个最小价位（1个点），我要求区间高度至少达3点。区间高度还需至少达到平均K线高度的三倍。外汇市场最小波头皮幅度为10点，因此理想情况下K线高度应达10点，在外汇市场可能难见此类K线。且整个区间高度需至少30点最小剥头皮幅度的三倍，才会考虑剥头皮交易。当区间如此窄时，多数交易者根本不应入场，即便用限价单。若执意在窄幅交易区间操作，限价单卖出更稳妥，你在多头旗型上方卖出并剥头皮，在区间中部获利了结，即在此处卖出，此处加仓，随后在盈亏平衡点至中部区域平仓。同时可在底部附近买入，此处出现第二空头旗型，但在交易区间底部附近买方更可能在该空头信号K线下方，此K线低点下方及彼K线低点下方介入。交易者会在该空头卖出信号K线低点。此处低点或彼处低点，若触及开始买入并剥头皮。在E-mini市场剥头皮目标为1-2点，若为外汇市场目标为10-20点。","pid":"p123"},{"t":"img","src":"assets/img/u15_056.webp","ilabel":"U15-6","icap":"交易区间","fid":"fig57","ctx":[{"t":"关于极窄区间剥头皮，我有几条规则，这是E-mini合约图表，在E-mini的多数K线波动大于最小剥头皮幅度。E-mini的最小波头皮幅度为四个最小价位（1个点），若要在极窄区间剥头皮，我需要K线波动大于最小剥头皮幅度，同时要求区间高度至少为最小剥头皮幅度的三倍。E-mini的最小剥头皮幅度为四个最小价位（1个点），我要求区间高度至少达3点。区间高度还需至少达到平均K线高度的三倍。外汇市场最小波头皮幅度为10点，因此理想情况下K线高度应达10点，在外汇市场可能难见此类K线。且整个区间高度需至少30点最小剥头皮幅度的三倍，才会考虑剥头皮交易。当区间如此窄时，多数交易者根本不应入场，即便用限价单。若执意在窄幅交易区间操作，限价单卖出更稳妥，你在多头旗型上方卖出并剥头皮，在区间中部获利了结，即在此处卖出，此处加仓，随后在盈亏平衡点至中部区域平仓。同时可在底部附近买入，此处出现第二空头旗型，但在交易区间底部附近买方更可能在该空头信号K线下方，此K线低点下方及彼K线低点下方介入。交易者会在该空头卖出信号K线低点。此处低点或彼处低点，若触及开始买入并剥头皮。在E-mini市场剥头皮目标为1-2点，若为外汇市场目标为10-20点。","p":"p123"},{"t":"每个交易区间终将演变为趋势，牢记市场周期，市场在趋势与交易区间交替运行。当市场处于市场在趋势与交易区间交替运行，当市场处于极窄区间时，若坚持交易，必须低买高卖，进行剥头皮，此操作持续至出现强势突破并伴随跟随走势为止。在突破确认前,押注交易区间延续且突破失败是更优策略。谨记我的80%法则，80%尝试突破交易区间的行动会失败，例如区间下方跳空试图突破，结果失败。突破区间顶部后同样失败，因此押注交易区间，延续横盘走势更为明智。空头将押注突破失败，强劲多头收盘出现时，空头会押注无跟随走势，他们将在该强势多头收盘处卖出或在高一买入信号K线高点上方卖出，此处出现双底形态，先是空头K线构成首次下推，回升后再次出现空头K线形成第二次下推，这属于高概率买入点。但多数交易者知晓其失败概率，故会在高概率买入信号K线上方卖出，多头则反向操作，押注空头突破失败，在区间下半部下1/3区域寻求买入。此处为极窄区间，多头会再次买入，并计划在更低位置加仓，他们将向下分批建仓，押注交易区间，突破将失败。当出现大阴线并伴随跟随性卖盘时，交易区间大概率终结，市场将至少走出第二段下跌。此时在低点买入的多头，此处成交，若再次加仓，很可能面临亏损。他们应寻求最小化止损离场。换言之，当在该空头K线收盘价买入后，需立即准备离场。不采用分批建仓策略，能在此多头K线上方小幅加仓，若市场未达目标位且开始停滞，直接止损，在此区域内任意位置离场。这根空头K线及后续阴线代表多头放弃抵抗，再次买入的多头预期形成更高低点的主要趋势反转与此位置认输，其他分批建仓的多头在低点买入，可能在更低位置加仓或于空头收盘价介入也再次放弃。当多头放弃时，他们不会在随后几根K线再次买入，他们预期至少出现小幅第二段下跌，很可能是测量移动下行，此缺口可能是测量缺口位于K线收盘价与这些低点之间。测量移动目标或从此高点至彼低点指向此处区域。多头正在溃退，空头察觉相同信号，猜猜他们的行动，他们将开始抛售，在该空头收盘价或此空头收盘价卖出并预期每次向上反转尝试，因其知晓多头正节节败退，且短期内不会返场。前文提及在此类交易区间操作时，交易者用限价单在高点卖出，低点买入，但这要求快速决策能力。例如若多头再次买入并于此加仓，必须能迅速判读错误，市场性质已从交易区间转变为趋势行情，多数新手交易者难以做到，正因如此，他们最好避免在极窄交易区间使用限价单交易最终必将遭遇成功突破，若等到此处才确认突破有效，单次亏损将远超此前所有盈利总和。限价单入场的前提是押注突破失败的同时能快速止损离场。理想状况是最终亏损前的累计盈利超过该笔损失。但是决策迟缓或立场不够果断，单次亏损将抵消此前全部盈利。","p":"p124"}]},{"t":"para","text":"每个交易区间终将演变为趋势，牢记市场周期，市场在趋势与交易区间交替运行。当市场处于市场在趋势与交易区间交替运行，当市场处于极窄区间时，若坚持交易，必须低买高卖，进行剥头皮，此操作持续至出现强势突破并伴随跟随走势为止。在突破确认前,押注交易区间延续且突破失败是更优策略。谨记我的80%法则，80%尝试突破交易区间的行动会失败，例如区间下方跳空试图突破，结果失败。突破区间顶部后同样失败，因此押注交易区间，延续横盘走势更为明智。空头将押注突破失败，强劲多头收盘出现时，空头会押注无跟随走势，他们将在该强势多头收盘处卖出或在高一买入信号K线高点上方卖出，此处出现双底形态，先是空头K线构成首次下推，回升后再次出现空头K线形成第二次下推，这属于高概率买入点。但多数交易者知晓其失败概率，故会在高概率买入信号K线上方卖出，多头则反向操作，押注空头突破失败，在区间下半部下1/3区域寻求买入。此处为极窄区间，多头会再次买入，并计划在更低位置加仓，他们将向下分批建仓，押注交易区间，突破将失败。当出现大阴线并伴随跟随性卖盘时，交易区间大概率终结，市场将至少走出第二段下跌。此时在低点买入的多头，此处成交，若再次加仓，很可能面临亏损。他们应寻求最小化止损离场。换言之，当在该空头K线收盘价买入后，需立即准备离场。不采用分批建仓策略，能在此多头K线上方小幅加仓，若市场未达目标位且开始停滞，直接止损，在此区域内任意位置离场。这根空头K线及后续阴线代表多头放弃抵抗，再次买入的多头预期形成更高低点的主要趋势反转与此位置认输，其他分批建仓的多头在低点买入，可能在更低位置加仓或于空头收盘价介入也再次放弃。当多头放弃时，他们不会在随后几根K线再次买入，他们预期至少出现小幅第二段下跌，很可能是测量移动下行，此缺口可能是测量缺口位于K线收盘价与这些低点之间。测量移动目标或从此高点至 关键点是确认市场处于交易区间，而非已转为趋势。理想情况下风险回报比至少一。观察此处明显交易区间，但随后发生什么？强劲多头突破，巨型阳线，不仅突破前根K线高点，更突破过去30-40根K线高点收盘。继而出现跟随K线,突破阳线后的又一根阳线，市场至少走出第二段上涨的概率极高，这时市场大概率已脱离交易区间，进入上涨趋势。","p":"p127"}]},{"t":"para","text":"交易反转与区间关键点是确认市场处于交易区间，而非已转为趋势。理想情况下风险回报比至少一。观察此处明显交易区间，但随后发生什么？强劲多头突破，巨型阳线，不仅突破前根K线高点，更突破过去30-40根K线高点收盘。继而出现跟随K线,突破阳线后的又一根阳线，市场至少走出第二段上涨的概率极高，这时市场大概率已脱离交易区间，进入上涨趋势。","pid":"p127"},{"t":"img","src":"assets/img/u16_059.webp","ilabel":"U16-3","icap":"交易区间反转策略","fid":"fig60","ctx":[{"t":"交易反转与区间关键点是确认市场处于交易区间，而非已转为趋势。理想情况下风险回报比至少一。观察此处明显交易区间，但随后发生什么？强劲多头突破，巨型阳线，不仅突破前根K线高点，更突破过去30-40根K线高点收盘。继而出现跟随K线,突破阳线后的又一根阳线，市场至少走出第二段上涨的概率极高，这时市场大概率已脱离交易区间，进入上涨趋势。","p":"p127"},{"t":"此处是明确交易区间，反复反转，缺乏连续的趋势K线。未见持续性大实体趋势K线。区间幅度较宽，（上涨10-15根K线，下跌20-40根K线）宽幅区间既可剥头皮也可不断操作。此处形成微型双底。跳空下跌-反弹-再次探底-回升。可买入进行波段或剥头皮。同理，在此位置跌破前低但反转回升，形成微型双底且市场停滞，可能启动波段上涨，再次测试底部可能构成双底。小型双底嵌套于大型双底中，构成买入信号。可用止损单入场，在信号K线高点上方入场，进行剥头皮或波段交易。顶部同理，双高潮伴随弱势跟随突破区间顶部失败，适合卖出（尤其波段操作），此处两次上攻失败，形成第二次入场做空点，且位于此段趋势的50%回撤位略超，但仍属50%回撤区域，构成卖出信号，随后两次尝试突破区间顶部，均以空头K线告终，在交易区间顶部形成第二次入场做空点，配合良好的卖出信号K线时，此为高胜率策略。该空头K线收盘后立即挂止损单于其低点下方卖出。入场K线在此处成交。经验丰富者也会用限价单入场，例如此处4-5根阳线后出现良好反转，交易者押注首次下跌尝试失败，在彼K线低点挂限价买单。此处观察到市场跌破次K线后回升，跌破彼K线后回升，限价单多头持续盈利。在前低，挂限价单的多头正进行剥头皮交易，当接近区间底部时，跌破此K线会如何？大概率反弹回升，故多头将在该K线下方买入，此处是交易区间底部减弱，是下跌通道底部的第一做空点。配合十字星卖出信号K线多头将买入，押注该K线下方买方力量占优。顶部同理，弱势反弹，（实体K线，长影线，多根阴线，）小空头将在前高点挂限价买单，即在彼高点挂限价买单。看似强势的阳线，但紧随两根阴线，且位于发展中的区间底部，空头将在该阳线上方卖出，押注多头失败，在此高点，买入高潮后出现十字星内包线，空头将在该十字星高点挂限价买单，押注高一形态，至少会失败至可剥头皮程度。","p":"p128"}]},{"t":"para","text":"此处是明确交易区间，反复反转，缺乏连续的趋势K线。未见持续性大实体趋势K线。区间幅度较宽，（上涨10-15根K线，下跌20-40根K线）宽幅区间既可剥头皮也可不断操作。此处形成微型双底。跳空下跌-反弹-再次探底-回升。可买入进行波段或剥头皮。同理，在此位置跌破前低但反转回升，形成微型双底且市场停滞，可能启动波段上涨，再次测试底部可能构成双底。小型双底嵌套于大型双底中，构成买入信号。可用止损单入场，在信号K线高点上方入场，进行剥头皮或波段交易。顶部同理，双高潮伴随弱势跟随突破区间顶部失败，适合卖出（尤其波段操作），此处两次上攻失败，形成第二次入场做空点，且位于此段趋势的50%回撤位略超，但仍属50%回撤区域，构成卖出信号，随后两次尝试突破区间顶部，均以空头K线告终，在交易区间顶部形成第二次入场做空点，配合良好的卖出信号K线时，此为高胜率策略。该空头K线收盘后立即挂止损单于其低点下方卖出。入场K线在此处成交。经验丰富者也会用限价单入场，例如此处4-5根阳线后出现良好反转，交易者押注首次下跌尝试失败，在彼K线低点挂限价买单。此处观察到市场跌破次K线后回升，跌破彼K线后回升，限价单多头持续盈利。在前低，挂限价单的多头正进行剥头皮交易，当接近区间底部时，跌破此K线会如何？大概率反弹回升，故多头将在该K线下方买入，此处是交易区间底部减弱，是下跌通道底部的第一做空点。配合十字星卖出信号K线多头将买入，押注该K线下方买方力量占优。顶部同理，弱势反弹，（实体K线，长影线，多根阴线，）小空头将在前高点挂限价买单，即在彼高点挂限价买单。看似强势的阳线，但紧随两根阴线，且位于发展中的区间底部，空头将在该阳线上方卖出，押注多头失败，在此高点，买入高潮后出现十字星内包线，空头将在该十字星高点挂限价买单，押注高一形态，至少会失败至可剥头皮程度。","pid":"p128"},{"t":"img","src":"assets/img/u16_060.webp","ilabel":"U16-4","icap":"交易区间反转策略","fid":"fig61","ctx":[{"t":"此处是明确交易区间，反复反转，缺乏连续的趋势K线。未见持续性大实体趋势K线。区间幅度较宽，（上涨10-15根K线，下跌20-40根K线）宽幅区间既可剥头皮也可不断操作。此处形成微型双底。跳空下跌-反弹-再次探底-回升。可买入进行波段或剥头皮。同理，在此位置跌破前低但反转回升，形成微型双底且市场停滞，可能启动波段上涨，再次测试底部可能构成双底。小型双底嵌套于大型双底中，构成买入信号。可用止损单入场，在信号K线高点上方入场，进行剥头皮或波段交易。顶部同理，双高潮伴随弱势跟随突破区间顶部失败，适合卖出（尤其波段操作），此处两次上攻失败，形成第二次入场做空点，且位于此段趋势的50%回撤位略超，但仍属50%回撤区域，构成卖出信号，随后两次尝试突破区间顶部，均以空头K线告终，在交易区间顶部形成第二次入场做空点，配合良好的卖出信号K线时，此为高胜率策略。该空头K线收盘后立即挂止损单于其低点下方卖出。入场K线在此处成交。经验丰富者也会用限价单入场，例如此处4-5根阳线后出现良好反转，交易者押注首次下跌尝试失败，在彼K线低点挂限价买单。此处观察到市场跌破次K线后回升，跌破彼K线后回升，限价单多头持续盈利。在前低，挂限价单的多头正进行剥头皮交易，当接近区间底部时，跌破此K线会如何？大概率反弹回升，故多头将在该K线下方买入，此处是交易区间底部减弱，是下跌通道底部的第一做空点。配合十字星卖出信号K线多头将买入，押注该K线下方买方力量占优。顶部同理，弱势反弹，（实体K线，长影线，多根阴线，）小空头将在前高点挂限价买单，即在彼高点挂限价买单。看似强势的阳线，但紧随两根阴线，且位于发展中的区间底部，空头将在该阳线上方卖出，押注多头失败，在此高点，买入高潮后出现十字星内包线，空头将在该十字星高点挂限价买单，押注高一形态，至少会失败至可剥头皮程度。","p":"p128"},{"t":"此处出现强劲反转，牢记交易区间核心是低买高卖。但当潜在趋势指向下行时，可反常规在低位卖出，此位置相对低位，小型双顶空头旗型配合标准阴线，空头将在其下方卖出，同理，低二做空点配合下跌通道。空头将在该阴线下方卖出，此处强劲反转下行一做空点虽处区间中部，交易者仍将卖出，押注价格至少小幅走低，多头则反向操作。此处双底突破颈线后形成强劲双K反转。多头将在该阴线低点买入，押注空头反转尝试失败，且价格至少小幅回升，此处强劲突破，伴随跟随走势，价格大概率至少小幅走低，虽处交易区间下1/3交易者仍将卖出，选择低位而非高位卖出。总体而言，交易者追求高位卖出并低位买入，此为最佳交易方式，经验丰富者见强劲反转，下行时愿在区间下半部甚至底部1/3区域卖出。多头同理，当出现强势上涨腿时，他们会在交易区间中部买入，即使低位买入更易。可在特定形态中用止损单入场，如此处双顶空头旗型，配合标准阴线及空头反转，可能演变为急速与通道下行，实际如此。故可用止损单入场或同样使用限价单。强劲反转上行（虽显阴线），但强度足以支撑至少小幅续涨，多头将在该空头K线低点买入。区间极窄时最好放弃交易，若执意操作，优先在底部K线下方位用限价单买入。顶部区域用限价单卖出，配合宽止损更加。如能分批建仓则更理想，但此组合对新手过于复杂，属高阶交易手法。","p":"p129"}]},{"t":"para","text":"此处出现强劲反转，牢记交易区间核心是低买高卖。但当潜在趋势指向下行时，可反常规在低位卖出，此位置相对低位，小型双顶空头旗型配合标准阴线，空头将在其下方卖出，同理，低二做空点配合下跌通道。空头将在该阴线下方卖出，此处强劲反转下行一做空点虽处区间中部，交易者仍将卖出，押注价格至少小幅走低，多头则反向操作。此处双底突破颈线后形成强劲双K反转。多头将在该阴线低点买入，押注空头反转尝试失败，且价格至少小幅回升，此处强劲突破，伴随跟随走势，价格大概率至少小幅走低，虽处交易区间下1/3交易者仍将卖出，选择低位而非高位卖出。总体而言，交易者追求高位卖出并低位买入，此为最佳交易方式，经验丰富者见强劲反转，下行时愿在区间下半部甚至底部1/3区域卖出。多头同理，当出现强势上涨腿时，他们会在交易区间中部买入，即使低位买入更易。可在特定形态中用止损单入场，如此处双顶空头旗型，配合标准阴线及空头反转，可能演变为急速与通道下行，实际如此。故可用止损单入场或同样使用限价单。强劲反转上行（虽显阴线），但强度足以支撑至少小幅续涨，多头将在该空头K线低点买入。区间极窄时最好放弃交易，若执意操作，优先在底部K线下方位用限价单买入。顶部区域用限价单卖出，配合宽止损更加。如能分批建仓则更理想，但此组合对新手过于复杂，属高阶交易手法。","pid":"p129"},{"t":"img","src":"assets/img/u16_061.webp","ilabel":"U16-5","icap":"交易区间反转策略","fid":"fig62","ctx":[{"t":"此处出现强劲反转，牢记交易区间核心是低买高卖。但当潜在趋势指向下行时，可反常规在低位卖出，此位置相对低位，小型双顶空头旗型配合标准阴线，空头将在其下方卖出，同理，低二做空点配合下跌通道。空头将在该阴线下方卖出，此处强劲反转下行一做空点虽处区间中部，交易者仍将卖出，押注价格至少小幅走低，多头则反向操作。此处双底突破颈线后形成强劲双K反转。多头将在该阴线低点买入，押注空头反转尝试失败，且价格至少小幅回升，此处强劲突破，伴随跟随走势，价格大概率至少小幅走低，虽处交易区间下1/3交易者仍将卖出，选择低位而非高位卖出。总体而言，交易者追求高位卖出并低位买入，此为最佳交易方式，经验丰富者见强劲反转，下行时愿在区间下半部甚至底部1/3区域卖出。多头同理，当出现强势上涨腿时，他们会在交易区间中部买入，即使低位买入更易。可在特定形态中用止损单入场，如此处双顶空头旗型，配合标准阴线及空头反转，可能演变为急速与通道下行，实际如此。故可用止损单入场或同样使用限价单。强劲反转上行（虽显阴线），但强度足以支撑至少小幅续涨，多头将在该空头K线低点买入。区间极窄时最好放弃交易，若执意操作，优先在底部K线下方位用限价单买入。顶部区域用限价单卖出，配合宽止损更加。如能分批建仓则更理想，但此组合对新手过于复杂，属高阶交易手法。","p":"p129"},{"t":"此处为窄幅区间，彼处为宽幅区间，整个屏幕可视作大区间，现聚焦此小型区间。遵循低买高卖剥头皮原则，多空双方均在低位买入，亦同在高位卖出。当市场处高位时，空头因处交易区间高位，且突破尝试多失败而卖出，多头同样卖出，低位建仓的多头正高位获利了结。之间底部多头买入，押注突破失败，例如在该K线低点挂限价买单，此处成交或在反转上行时买入。值得注意的是空头也在买入，因其知晓交易区间特性，且空头突破将失败，故高位做空的空头正回补空头头寸进行剥头皮。此时区间扩大，此区域为上半部，彼区域为下半部。最后区间进一步拓宽，此区域转为上面最后区间进一步拓宽，此区域转为上半步，交易者将在此卖出，必须准备下一步交易者将再次买入。思考本质，当多空双方均低买高卖，快速获利剥头皮时，市场必然横盘跌，每次上涨都遭遇多空双卖压，每次下跌都迎接多空双买盘，双方皆确信市场难有单边行情，故专注5分钟剥头皮，即使急速下跌，空头也会获利了结，而多头买入，当价格冲向底部时，多头获利了结，而空头卖出。交易者发现区间证据时，应效仿机构行为，低买高卖剥头皮。","p":"p130"}]},{"t":"para","text":"此处为窄幅区间，彼处为宽幅区间，整个屏幕可视作大区间，现聚焦此小型区间。遵循低买高卖剥头皮原则，多空双方均在低位买入，亦同在高位卖出。当市场处高位时，空头因处交易区间高位，且突破尝试多失败而卖出，多头同样卖出，低位建仓的多头正高位获利了结。之间底部多头买入，押注突破失败，例如在该K线低点挂限价买单，此处成交或在反转上行时买入。值得注意的是空头也在买入，因其知晓交易区间特性，且空头突破将失败，故高位做空的空头正回补空头头寸进行剥头皮。此时区间扩大，此区域为上半部，彼区域为下半部。最后区间进一步拓宽，此区域转为上面最后区间进一步拓宽，此区域转为上半步，交易者将在此卖出，必须准备下一步交易者将再次买入。思考本质，当多空双方均低买高卖，快速获利剥头皮时，市场必然横盘跌，每次上涨都遭遇多空双卖压，每次下跌都迎接多空双买盘，双方皆确信市场难有单边行情，故专注5分钟剥头皮，即使急速下跌，空头也会获利了结，而多头买入，当价格冲向底部时，多头获利了结，而空头卖出。交易者发现区间证据时，应效仿机构行为，低买高卖剥头皮。","pid":"p130"},{"t":"img","src":"assets/img/u16_062.webp","ilabel":"U16-6","icap":"交易区间反转策略","fid":"fig63","ctx":[{"t":"此处为窄幅区间，彼处为宽幅区间，整个屏幕可视作大区间，现聚焦此小型区间。遵循低买高卖剥头皮原则，多空双方均在低位买入，亦同在高位卖出。当市场处高位时，空头因处交易区间高位，且突破尝试多失败而卖出，多头同样卖出，低位建仓的多头正高位获利了结。之间底部多头买入，押注突破失败，例如在该K线低点挂限价买单，此处成交或在反转上行时买入。值得注意的是空头也在买入，因其知晓交易区间特性，且空头突破将失败，故高位做空的空头正回补空头头寸进行剥头皮。此时区间扩大，此区域为上半部，彼区域为下半部。最后区间进一步拓宽，此区域转为上面最后区间进一步拓宽，此区域转为上半步，交易者将在此卖出，必须准备下一步交易者将再次买入。思考本质，当多空双方均低买高卖，快速获利剥头皮时，市场必然横盘跌，每次上涨都遭遇多空双卖压，每次下跌都迎接多空双买盘，双方皆确信市场难有单边行情，故专注5分钟剥头皮，即使急速下跌，空头也会获利了结，而多头买入，当价格冲向底部时，多头获利了结，而空头卖出。交易者发现区间证据时，应效仿机构行为，低买高卖剥头皮。","p":"p130"},{"t":"交易区间常在强势走势后出现深度回调，此时应瞄准底部1/3区域买入，可进一步精确至底部三分之一（而非简单二分之一）。例如强势上涨后深度回调，良好反弹后深度回调，强势上涨后深度回调，强势下跌可视作抛售后的深度回调。此刻区间上1/3在此，交易者将在此区域卖出，底部1/3区域买入，随着区间扩展。上1/3移至此处，下1/3移至彼处，交易者愿在此低位买入，在此高位卖出。区间继续扩大后，上三之一移至此处，交易者将在此高位卖出，并在市场下探至底部1/3区域时买入或与反转上行时介入。","p":"p131"}]},{"t":"para","text":"交易区间常在强势走势后出现深度回调，此时应瞄准底部1/3区域买入，可进一步精确至底部三分之一（而非简单二分之一）。例如强势上涨后深度回调，良好反弹后深度回调，强势上涨后深度回调，强势下跌可视作抛售后的深度回调。此刻区间上1/3在此，交易者将在此区域卖出，底部1/3区域买入，随着区间扩展。上1/3移至此处，下1/3移至彼处，交易者愿在此低位买入，在此高位卖出。区间继续扩大后，上三之一移至此处，交易者将在此高位卖出，并在市场下探至底部1/3区域时买入或与反转上行时介入。","pid":"p131"}],"wcount":2589},{"id":"u17","title":"Unit 17　交易区间价格行为","icon":"17","sections":[],"blocks":[{"t":"para","text":"Unit 17 交易区间价格行为","pid":"p132"},{"t":"img","src":"assets/img/u17_063.webp","ilabel":"U17-1","icap":"交易区间价格行为","fid":"fig64","ctx":[{"t":"Unit 17 交易区间价格行为","p":"p132"},{"t":"很多时候当你观察图表时，会认为它处于多头趋势或空头趋势，但情况令人崩溃。你得怀疑每当市场令人困惑时，很可能正处于交易区间，我关注的要素之一是趋势K线，例如这里出现一根空头趋势K线，随后呢小型目标K线出现，实体显得过小或者影线显得过长。此处的多头K线实体略小，这里空头K线的实体大小尚可，但上下影线非常显著。以下是其他例证，你会看到带长下影线的多头K线，带长上影线的另一个多头K线，带下影线的空头K线，这意味着在该K线收盘阶段，空头正在回补空仓，他们不相信市场会继续下跌，同时多头在这个小型交易区间底部买入押注能获取剥头皮利润，若此处未盈利，他们可采用宽止损并分批减仓，然后在首次入场点保本离场，并在第二次入场时获利了结。此外我会寻找大量十字星，小型实体,显著影线，以及实体不足K线高度1/3的形态，观察到密集的紧密交易区间，3-5根K线构成的窄幅交易区间，10根K线构成的多次反转K线重叠,每隔1-3根K线就反转，这进一步佐证市场呈中性。且该紧密交易区间可能是更大交易区间的组成部分。","p":"p133"}]},{"t":"para","text":"很多时候当你观察图表时，会认为它处于多头趋势或空头趋势，但情况令人崩溃。你得怀疑每当市场令人困惑时，很可能正处于交易区间，我关注的要素之一是趋势K线，例如这里出现一根空头趋势K线，随后呢小型目标K线出现，实体显得过小或者影线显得过长。此处的多头K线实体略小，这里空头K线的实体大小尚可，但上下影线非常显著。以下是其他例证，你会看到带长下影线的多头K线，带长上影线的另一个多头K线，带下影线的空头K线，这意味着在该K线收盘阶段，空头正在回补空仓，他们不相信市场会继续下跌，同时多头在这个小型交易区间底部买入押注能获取剥头皮利润，若此处未盈利，他们可采用宽止损并分批减仓，然后在首次入场点保本离场，并在第二次入场时获利了结。此外我会寻找大量十字星，小型实体,显著影线，以及实体不足K线高度1/3的形态，观察到密集的紧密交易区间，3-5根K线构成的窄幅交易区间，10根K线构成的多次反转K线重叠,每隔1-3根K线就反转，这进一步佐证市场呈中性。且该紧密交易区间可能是更大交易区间的组成部分。","pid":"p133"},{"t":"img","src":"assets/img/u17_064.webp","ilabel":"U17-2","icap":"交易区间价格行为","fid":"fig65","ctx":[{"t":"很多时候当你观察图表时，会认为它处于多头趋势或空头趋势，但情况令人崩溃。你得怀疑每当市场令人困惑时，很可能正处于交易区间，我关注的要素之一是趋势K线，例如这里出现一根空头趋势K线，随后呢小型目标K线出现，实体显得过小或者影线显得过长。此处的多头K线实体略小，这里空头K线的实体大小尚可，但上下影线非常显著。以下是其他例证，你会看到带长下影线的多头K线，带长上影线的另一个多头K线，带下影线的空头K线，这意味着在该K线收盘阶段，空头正在回补空仓，他们不相信市场会继续下跌，同时多头在这个小型交易区间底部买入押注能获取剥头皮利润，若此处未盈利，他们可采用宽止损并分批减仓，然后在首次入场点保本离场，并在第二次入场时获利了结。此外我会寻找大量十字星，小型实体,显著影线，以及实体不足K线高度1/3的形态，观察到密集的紧密交易区间，3-5根K线构成的窄幅交易区间，10根K线构成的多次反转K线重叠,每隔1-3根K线就反转，这进一步佐证市场呈中性。且该紧密交易区间可能是更大交易区间的组成部分。","p":"p133"},{"t":"交易区间的另一个特点是突破概率不在极端化，有时40%，有时60%。因此看似40%概率的入场形态实际概率往往接近50%，形势看似糟糕，实则没有表面那么差，此处你可能认为连续5根下跌推线后反转上涨概率极低，但反转仍频繁发生，这里出现大空头K线时，你会认为第一根多头K线不足以引发反转上涨，看似低概率交易，但价格依然上涨，此处同理，大空头K线后看似低概率的做多交易最终实现上涨，精明交易者凭借经验识别价格行为呈交易区间特征时，会参与这些低概率买入。他们深知实际概率高于表象。同样看似高概率60%以上的入场形态，实际概率也更接近50%，因此看似理想的形态未必优异，看似糟糕的形态未必恶劣，例如强劲黄金突破后的50%回调价格会上涨而下跌，在强势空头K线的双顶空头旗型，价格未下跌反而上涨,突破交易区间下沿失败后出现优质多头反转K线，价格却继续下行。","p":"p134"}]},{"t":"para","text":"交易区间的另一个特点是突破概率不在极端化，有时40%，有时60%。因此看似40%概率的入场形态实际概率往往接近50%，形势看似糟糕，实则没有表面那么差，此处你可能认为连续5根下跌推线后反转上涨概率极低，但反转仍频繁发生，这里出现大空头K线时，你会认为第一根多头K线不足以引发反转上涨，看似低概率交易，但价格依然上涨，此处同理，大空头K线后看似低概率的做多交易最终实现上涨，精明交易者凭借经验识别价格行为呈交易区间特征时，会参与这些低概率买入。他们深知实际概率高于表象。同样看似高概率60%以上的入场形态，实际概率也更接近50%，因此看似理想的形态未必优异，看似糟糕的形态未必恶劣，例如强劲黄金突破后的50%回调价格会上涨而下跌，在强势空头K线的双顶空头旗型，价格未下跌反而上涨,突破交易区间下沿失败后出现优质多头反转K线，价格却继续下行。","pid":"p134"},{"t":"img","src":"assets/img/u17_065.webp","ilabel":"U17-3","icap":"交易区间价格行为","fid":"fig66","ctx":[{"t":"交易区间的另一个特点是突破概率不在极端化，有时40%，有时60%。因此看似40%概率的入场形态实际概率往往接近50%，形势看似糟糕，实则没有表面那么差，此处你可能认为连续5根下跌推线后反转上涨概率极低，但反转仍频繁发生，这里出现大空头K线时，你会认为第一根多头K线不足以引发反转上涨，看似低概率交易，但价格依然上涨，此处同理，大空头K线后看似低概率的做多交易最终实现上涨，精明交易者凭借经验识别价格行为呈交易区间特征时，会参与这些低概率买入。他们深知实际概率高于表象。同样看似高概率60%以上的入场形态，实际概率也更接近50%，因此看似理想的形态未必优异，看似糟糕的形态未必恶劣，例如强劲黄金突破后的50%回调价格会上涨而下跌，在强势空头K线的双顶空头旗型，价格未下跌反而上涨,突破交易区间下沿失败后出现优质多头反转K线，价格却继续下行。","p":"p134"},{"t":"我判断市场是否属于交易区间的最低标准是困惑感，困惑与失望是交易区间的两大标志。这里曾出现多头趋势及回调，当回调不足20根K线时，我是极为趋势延续性回调。回调本质是小规模交易区间，但通常需积累约20根K线才称其为交易区间，因达到此规模方能引发市场困惑，这是回调后的多头趋势恢复，接着出现新下跌，但此刻整体结构已演变为交易区间。你可将其起点定在此处，或此处，且当前尚未触底，关键问题是此时该如何操作？连续七八根下跌空头K线后，你是否仍持多头观点？尽管存在更高低点或更高高点，但真正多头趋势不应出现如此多下跌K线，回调深度也不应如此之大，这种形态旨在让交易者相信市场进入交易区间，空头需在回调中积累足够K线以制造疑虑。诱使交易者认为回调规模已扩大至引发困惑，进而将其判定为交易区间，而非趋势回调，在多头趋势回调中，你坚信市场将继续走高，一旦回调K线累计成交易区间，市场即进入突破模式。此时趋势延续，上涨的概率与反转下跌的概率基本持平。这就是突破模式的含义，趋势恢复上涨与趋势反转下跌的机会均等。每个交易区间都存在同样充分的买入和卖出理由，当你看到某个形态/入场信号后，又出现与之对立且同样有效的非信号时，必须认定市场处于交易区间。交易区间永远存在优质买入和卖出形态。对空头而言这是楔形顶部,对多头则是双底多头旗型，这个矛盾令人困惑，你无法确定多头突破或空头突破谁会成功。交易区间的另一问题是疲软的跟随走势，三根强势空头K线后价格反转上涨，两根大实体多头K线后价格反转下跌。市场不断生成新的对立信号，买入信号与卖出信号交替出现，每次强势上涨或下跌后均缺乏持续动能，此处上攻尝试后立即出现反转下跌，可将其解读为头肩顶，左肩，头部，右肩，而我的定义是此处多头趋势后出现空头突破，构成更低高点，主要趋势反转。","p":"p135"}]},{"t":"para","text":"我判断市场是否属于交易区间的最低标准是困惑感，困惑与失望是交易区间的两大标志。这里曾出现多头趋势及回调，当回调不足20根K线时，我是极为趋势延续性回调。回调本质是小规模交易区间，但通常需积累约20根K线才称其为交易区间，因达到此规模方能引发市场困惑，这是回调后的多头趋势恢复，接着出现新下跌，但此刻整体结构已演变为交易区间。你可将其起点定在此处，或此处，且当前尚未触底，关键问题是此时该如何操作？连续七八根下跌空头K线后，你是否仍持多头观点？尽管存在更高低点或更高高点，但真正多头趋势不应出现如此多下跌K线，回调深度也不应如此之大，这种形态旨在让交易者相信市场进入交易区间，空头需在回调中积累足够K线以制造疑虑。诱使交易者认为回调规模已扩大至引发困惑，进而将其判定为交易区间，而非趋势回调，在多头趋势回调中，你坚信市场将继续走高，一旦回调K线累计成交易区间，市场即进入突破模式。此时趋势延续，上涨的概率与反转下跌的概率基本持平。这就是突破模式的含义，趋势恢复上涨与趋势反转下跌的机会均等。每个交易区间都存在同样充分的买入和卖出理由，当你看到某个形态/入场信号后，又出现与之对立且同样有效的非信号时，必须认定市场处于交易区间。交易区间永远存在优质买入和卖出形态。对空头而言这是楔形顶部,对多头则是双底多头旗型，这个矛盾令人困惑，你无法确定多头突破或空头突破谁会成功。交易区间的另一问题是疲软的跟随走势，三根强势空头K线后价格反转上涨，两根大实体多头K线后价格反转下跌。市场不断生成新的对立信号，买入信号与卖出信号交替出现，每次强势上涨或下跌后均缺乏持续动能，此处上攻尝试后立即出现反转下跌，可将其解读为头肩顶，左肩，头部，右肩，而我的定义是此处多头趋势后出现空头突破，构成更低高点，主要趋势反转。","pid":"p135"},{"t":"img","src":"assets/img/u17_066.webp","ilabel":"U17-4","icap":"交易区间价格行为","fid":"fig67","ctx":[{"t":"我判断市场是否属于交易区间的最低标准是困惑感，困惑与失望是交易区间的两大标志。这里曾出现多头趋势及回调，当回调不足20根K线时，我是极为趋势延续性回调。回调本质是小规模交易区间，但通常需积累约20根K线才称其为交易区间，因达到此规模方能引发市场困惑，这是回调后的多头趋势恢复，接着出现新下跌，但此刻整体结构已演变为交易区间。你可将其起点定在此处，或此处，且当前尚未触底，关键问题是此时该如何操作？连续七八根下跌空头K线后，你是否仍持多头观点？尽管存在更高低点或更高高点，但真正多头趋势不应出现如此多下跌K线，回调深度也不应如此之大，这种形态旨在让交易者相信市场进入交易区间，空头需在回调中积累足够K线以制造疑虑。诱使交易者认为回调规模已扩大至引发困惑，进而将其判定为交易区间，而非趋势回调，在多头趋势回调中，你坚信市场将继续走高，一旦回调K线累计成交易区间，市场即进入突破模式。此时趋势延续，上涨的概率与反转下跌的概率基本持平。这就是突破模式的含义，趋势恢复上涨与趋势反转下跌的机会均等。每个交易区间都存在同样充分的买入和卖出理由，当你看到某个形态/入场信号后，又出现与之对立且同样有效的非信号时，必须认定市场处于交易区间。交易区间永远存在优质买入和卖出形态。对空头而言这是楔形顶部,对多头则是双底多头旗型，这个矛盾令人困惑，你无法确定多头突破或空头突破谁会成功。交易区间的另一问题是疲软的跟随走势，三根强势空头K线后价格反转上涨，两根大实体多头K线后价格反转下跌。市场不断生成新的对立信号，买入信号与卖出信号交替出现，每次强势上涨或下跌后均缺乏持续动能，此处上攻尝试后立即出现反转下跌，可将其解读为头肩顶，左肩，头部，右肩，而我的定义是此处多头趋势后出现空头突破，构成更低高点，主要趋势反转。","p":"p135"},{"t":"所有交易区间内部都包含多头和空头趋势。以及买入和卖出形态，当存在充分买入理由与充分卖出理由时，即可确认交易区间。多次突破，尝试创新，高看新低，再创新高，再探新低均告失败，或至少有80%尝试失败。最终会出现一次成功突破。多头趋势中的每个交易区间都包含双底，双底多头旗型预示趋势恢复上涨。通常还伴随主要趋势反转可能以更高高点形式呈现，可称为更高点主要趋势也可称为楔形顶部或更低高点主要趋势反转，此时多头实现突破的概率与空头实现突破的概率大致相同。","p":"p136"}]},{"t":"para","text":"所有交易区间内部都包含多头和空头趋势。以及买入和卖出形态，当存在充分买入理由与充分卖出理由时，即可确认交易区间。多次突破，尝试创新，高看新低，再创新高，再探新低均告失败，或至少有80%尝试失败。最终会出现一次成功突破。多头趋势中的每个交易区间都包含双底，双底多头旗型预示趋势恢复上涨。通常还伴随主要趋势反转可能以更高高点形式呈现，可称为更高点主要趋势也可称为楔形顶部或更低高点主要趋势反转，此时多头实现突破的概率与空头实现突破的概率大致相同。","pid":"p136"},{"t":"img","src":"assets/img/u17_067.webp","ilabel":"U17-5","icap":"交易区间价格行为","fid":"fig68","ctx":[{"t":"所有交易区间内部都包含多头和空头趋势。以及买入和卖出形态，当存在充分买入理由与充分卖出理由时，即可确认交易区间。多次突破，尝试创新，高看新低，再创新高，再探新低均告失败，或至少有80%尝试失败。最终会出现一次成功突破。多头趋势中的每个交易区间都包含双底，双底多头旗型预示趋势恢复上涨。通常还伴随主要趋势反转可能以更高高点形式呈现，可称为更高点主要趋势也可称为楔形顶部或更低高点主要趋势反转，此时多头实现突破的概率与空头实现突破的概率大致相同。","p":"p136"},{"t":"每个交易区间内部既包含多/空趋势，也蕴含买卖形态。当存在充分买卖理由时，市场即处于交易区间。这是交易区间内的空头趋势，而每个演变为交易区间的空头趋势都包含双顶，空头旗型。同时也存在主要趋势反转，因此空头趋势后多头突破构成高点或低点，主要趋势反转双底形态后出现高点或低点，主要趋势反转头肩底形态。此时市场恢复下跌。或反转上涨的概率均等，这就是突破模式，当回调积累至20根或更多K线时，多头与空头的成功概率趋于相等。例如空头趋势回调中，回调持续延伸扩展，最终多头突破概率将与空头突破概率持平。","p":"p137"}]},{"t":"para","text":"每个交易区间内部既包含多/空趋势，也蕴含买卖形态。当存在充分买卖理由时，市场即处于交易区间。这是交易区间内的空头趋势，而每个演变为交易区间的空头趋势都包含双顶，空头旗型。同时也存在主要趋势反转，因此空头趋势后多头突破构成高点或低点，主要趋势反转双底形态后出现高点或低点，主要趋势反转头肩底形态。此时市场恢复下跌。或反转上涨的概率均等，这就是突破模式，当回调积累至20根或更多K线时，多头与空头的成功概率趋于相等。例如空头趋势回调中，回调持续延伸扩展，最终多头突破概率将与空头突破概率持平。","pid":"p137"}],"wcount":2039},{"id":"u18","title":"Unit 18　楔形与最终旗形反转","icon":"18","sections":[],"blocks":[{"t":"para","text":"Unit 18 楔形与最终旗形反转","pid":"p138"},{"t":"img","src":"assets/img/u18_068.webp","ilabel":"U18-1","icap":"楔形与最终旗形反转","fid":"fig69","ctx":[{"t":"Unit 18 楔形与最终旗形反转","p":"p138"},{"t":"我来谈谈交易区间内的楔形和最终旗型反转。楔形是非常常见的形态，有时并不明显，但他们确实存在。再次向下推动123小型阳线在两根大阴线后可能不足以反转向上，通常最好等待第二次入场机会，比如这样。你可以在这个小型阳线上方买入，但很可能会出现小幅反转，意味着反弹后再次向下测试，现在楔形底部出现双底结构，同时还有微型双底，这是更高概率的买入机会。但也存在楔形底部形态，比如三次向上推动123出现阴线，与此高点构成双顶，形成更低高点的双顶。合理的卖出点相当紧密的通道，可能预示小幅反转，因此价格很可能回落至此区域，随后会反弹，我们回撤幅度略超50%后开始反弹。不过还存在其他形态，你必须时刻保持思考，楔形三次向上推动123，我知道你会问阿尔当下跌趋势创新低时，这怎么算楔形，实际上楔形在下跌趋势延续时就开始形成了，因此我们得到的是楔形空头通道，在第三次下推前楔形顶部的第一次上推已开始，这很常见。","p":"p139"}]},{"t":"para","text":"我来谈谈交易区间内的楔形和最终旗型反转。楔形是非常常见的形态，有时并不明显，但他们确实存在。再次向下推动123小型阳线在两根大阴线后可能不足以反转向上，通常最好等待第二次入场机会，比如这样。你可以在这个小型阳线上方买入，但很可能会出现小幅反转，意味着反弹后再次向下测试，现在楔形底部出现双底结构，同时还有微型双底，这是更高概率的买入机会。但也存在楔形底部形态，比如三次向上推动123出现阴线，与此高点构成双顶，形成更低高点的双顶。合理的卖出点相当紧密的通道，可能预示小幅反转，因此价格很可能回落至此区域，随后会反弹，我们回撤幅度略超50%后开始反弹。不过还存在其他形态，你必须时刻保持思考，楔形三次向上推动123，我知道你会问阿尔当下跌趋势创新低时，这怎么算楔形，实际上楔形在下跌趋势延续时就开始形成了，因此我们得到的是楔形空头通道，在第三次下推前楔形顶部的第一次上推已开始，这很常见。","pid":"p139"},{"t":"img","src":"assets/img/u18_069.webp","ilabel":"U18-2","icap":"楔形与最终旗形反转","fid":"fig70","ctx":[{"t":"我来谈谈交易区间内的楔形和最终旗型反转。楔形是非常常见的形态，有时并不明显，但他们确实存在。再次向下推动123小型阳线在两根大阴线后可能不足以反转向上，通常最好等待第二次入场机会，比如这样。你可以在这个小型阳线上方买入，但很可能会出现小幅反转，意味着反弹后再次向下测试，现在楔形底部出现双底结构，同时还有微型双底，这是更高概率的买入机会。但也存在楔形底部形态，比如三次向上推动123出现阴线，与此高点构成双顶，形成更低高点的双顶。合理的卖出点相当紧密的通道，可能预示小幅反转，因此价格很可能回落至此区域，随后会反弹，我们回撤幅度略超50%后开始反弹。不过还存在其他形态，你必须时刻保持思考，楔形三次向上推动123，我知道你会问阿尔当下跌趋势创新低时，这怎么算楔形，实际上楔形在下跌趋势延续时就开始形成了，因此我们得到的是楔形空头通道，在第三次下推前楔形顶部的第一次上推已开始，这很常见。","p":"p139"},{"t":"这是美元兑日元的路线图，交易者将寻找向上的反转买入机会。强势阴线不良跟随走势，强势阴线不良跟随走势，成对强势阴线不良跟随走势，三次向下推动123，交易区间价格行为。交易者会寻找楔形底部买入，因此他们会带止损买入，微型双底，阳线上涨，阴线下跌，阴线反包上涨，微型双顶颈线是那根阴线的高点，交易者会在价格突破该高点时买入。三次向下推动123，但这里同样存在三次向下推动123，这个楔形有不同画法，可以从这里开始绘制顶部连接这次。我在此处绘制更小的楔形，这是嵌套楔形，我知道你会质疑阿尔第一次下推后出现强势反弹，这怎能算楔形空头通道？楔形通道的第一段腿，在多头趋势结束前就开始形成，这非常普遍。无论如何，这里存在楔形底部，市场明显处于交易区间，交易者将在这个嵌套楔形上方寻找买入机会，这有个楔形，这里也有楔形，我们处于交易区间底部，多头在此处，此处，此处多次买入。他们这次会如何操作？他们会像前几次那样买入，尤其因为这是嵌套楔形，小楔形套大楔形。楔形顶部123，再次强调楔形顶部-楔形反弹，楔形多头通道在下跌趋势结束前就开始形成。也可用自高点和那个高点绘制楔形，三次向上推动，若连接第1和第3点，第二次推动会突破趋势线，但这无关紧要。算法识别为三次上推一推动两回撤，三回撤，因此功能上等同于楔形。","p":"p140"}]},{"t":"para","text":"这是美元兑日元的路线图，交易者将寻找向上的反转买入机会。强势阴线不良跟随走势，强势阴线不良跟随走势，成对强势阴线不良跟随走势，三次向下推动123，交易区间价格行为。交易者会寻找楔形底部买入，因此他们会带止损买入，微型双底，阳线上涨，阴线下跌，阴线反包上涨，微型双顶颈线是那根阴线的高点，交易者会在价格突破该高点时买入。三次向下推动123，但这里同样存在三次向下推动123，这个楔形有不同画法，可以从这里开始绘制顶部连接这次。我在此处绘制更小的楔形，这是嵌套楔形，我知道你会质疑阿尔第一次下推后出现强势反弹，这怎能算楔形空头通道？楔形通道的第一段腿，在多头趋势结束前就开始形成，这非常普遍。无论如何，这里存在楔形底部，市场明显处于交易区间，交易者将在这个嵌套楔形上方寻找买入机会，这有个楔形，这里也有楔形，我们处于交易区间底部，多头在此处，此处，此处多次买入。他们这次会如何操作？他们会像前几次那样买入，尤其因为这是嵌套楔形，小楔形套大楔形。楔形顶部123，再次强调楔形顶部-楔形反弹，楔形多头通道在下跌趋势结束前就开始形成。也可用自高点和那个高点绘制楔形，三次向上推动，若连接第1和第3点，第二次推动会突破趋势线，但这无关紧要。算法识别为三次上推一推动两回撤，三回撤，因此功能上等同于楔形。","pid":"p140"},{"t":"img","src":"assets/img/u18_070.webp","ilabel":"U18-3","icap":"楔形与最终旗形反转","fid":"fig71","ctx":[{"t":"这是美元兑日元的路线图，交易者将寻找向上的反转买入机会。强势阴线不良跟随走势，强势阴线不良跟随走势，成对强势阴线不良跟随走势，三次向下推动123，交易区间价格行为。交易者会寻找楔形底部买入，因此他们会带止损买入，微型双底，阳线上涨，阴线下跌，阴线反包上涨，微型双顶颈线是那根阴线的高点，交易者会在价格突破该高点时买入。三次向下推动123，但这里同样存在三次向下推动123，这个楔形有不同画法，可以从这里开始绘制顶部连接这次。我在此处绘制更小的楔形，这是嵌套楔形，我知道你会质疑阿尔第一次下推后出现强势反弹，这怎能算楔形空头通道？楔形通道的第一段腿，在多头趋势结束前就开始形成，这非常普遍。无论如何，这里存在楔形底部，市场明显处于交易区间，交易者将在这个嵌套楔形上方寻找买入机会，这有个楔形，这里也有楔形，我们处于交易区间底部，多头在此处，此处，此处多次买入。他们这次会如何操作？他们会像前几次那样买入，尤其因为这是嵌套楔形，小楔形套大楔形。楔形顶部123，再次强调楔形顶部-楔形反弹，楔形多头通道在下跌趋势结束前就开始形成。也可用自高点和那个高点绘制楔形，三次向上推动，若连接第1和第3点，第二次推动会突破趋势线，但这无关紧要。算法识别为三次上推一推动两回撤，三回撤，因此功能上等同于楔形。","p":"p140"},{"t":"交易区间，每当出现大量交易区间价格行为，我总是关注顶部的多头旗型和底部的空头旗型，预期他们将失败反转。这里顶部出现多头旗型，但观察左侧，我们并未突破最近空头腿的高点，尽管强势多头反转至空头最高点之上，但未突破下跌趋势高点上方存在多头旗型，许多交易者会押注这更像是交易区间，且是区间顶部的买压真空测试，而非新多头趋势的起点，观察这波上涨。连续的大实体多头趋势K线在哪里。出现过强势阳性，但不良跟随走势。几根阳线实体不大，且影线显著，这更像是交易区间中的多头腿，而非强势多头趋势，下跌过程同理，阴线后接十字星，阴线后接阳线，带影线的阴线，后接阳线。每次空头突破后，都是不良跟随走势，因此这项是空头腿即形成交易区间或交易区间中的空头腿。多头预期顶部多头旗型将失败，部分交易者会在那根阴线高点上方做空，其他人会在阴线下方挂止损空单，底部出现空头旗型第二做空形态。若再次做空，必须意识到对象是即将形成交易区间的空头腿，意味着下行空间可能有限，因此若做空需剥头皮操作，否则应等待向上反转，这成为最终空头旗型，已处于交易区间底部虽创微幅新低，但整段跌势始终伴随不良跟随走势，交易者判定下行空间有限，许多人将等待买入反转机会。阳线收盘接近其高点，在其高点上方挂止损买单。","p":"p141"}]},{"t":"para","text":"交易区间，每当出现大量交易区间价格行为，我总是关注顶部的多头旗型和底部的空头旗型，预期他们将失败反转。这里顶部出现多头旗型，但观察左侧，我们并未突破最近空头腿的高点，尽管强势多头反转至空头最高点之上，但未突破下跌趋势高点上方存在多头旗型，许多交易者会押注这更像是交易区间，且是区间顶部的买压真空测试，而非新多头趋势的起点，观察这波上涨。连续的大实体多头趋势K线在哪里。出现过强势阳性，但不良跟随走势。几根阳线实体不大，且影线显著，这更像是交易区间中的多头腿，而非强势多头趋势，下跌过程同理，阴线后接十字星，阴线后接阳线，带影线的阴线，后接阳线。每次空头突破后，都是不良跟随走势，因此这项是空头腿即形成交易区间或交易区间中的空头腿。多头预期顶部多头旗型将失败，部分交易者会在那根阴线高点上方做空，其他人会在阴线下方挂止损空单，底部出现空头旗型第二做空形态。若再次做空，必须意识到对象是即将形成交易区间的空头腿，意味着下行空间可能有限，因此若做空需剥头皮操作，否则应等待向上反转，这成为最终空头旗型，已处于交易区间底部虽创微幅新低，但整段跌势始终伴随不良跟随走势，交易者判定下行空间有限，许多人将等待买入反转机会。阳线收盘接近其高点，在其高点上方挂止损买单。","pid":"p141"}],"wcount":1482},{"id":"u19","title":"Unit 19　菜鸟被套 高手反做","icon":"19","sections":[],"blocks":[{"t":"para","text":"Unit 19 菜鸟被套 高手反做","pid":"p142"},{"t":"img","src":"assets/img/u19_071.webp","ilabel":"U19-1","icap":"菜鸟被套 高手反做","fid":"fig72","ctx":[{"t":"Unit 19 菜鸟被套 高手反做","p":"p142"},{"t":"交易区间中第二段走势陷阱非常常见，第二段走势看起来特别强劲，似乎将是新趋势的开始，但如果是一波上涨，它会诱使交易者高位买入，并且它诱使交易者低位卖出，所以你得到的是一个反转。一个竭尽缺口，而不是一个测量缺口。新手看到一段强劲的上涨走势就买入，预期会出现测量缺口和测量移动上涨。所以第一段走势回调至一个更高的低点，也是一段非常强劲的走势，所以新手在这里买入，心想天呐，这将是一个测量缺口，这些收盘价和这个高点将引发一个测量移动上涨，而专家说我不知道，这里有很多交易区间价格的行为，这可能是一个第二段走势陷阱，所以专家们正准备卖出或者正在卖出。新手看到一根突破的大阳线，他看到一个楔形底，三次向下推动123或者一个高二买入，高一，高二，然后一根强劲的突破K线以及一根跟随K线，于是他买入，并且他持仓止损设在这个低点下方，而专家说我不知道。考虑到所有这些K线的交易区间价格行为，这可能是多头在诱捕交易者在顶部买入。所以新手在多头的突破之后买入那些大阳线的收盘价，那里还有另一根大阳线，他们买入其收盘价线下就是它，这是一波多头趋势的开始。这真是个问题，他们把止损设在哪里？设在这里下方这是合理的，这在这个下方这也很合理，如果他们被止损出去，他们必须在反转上涨时买入，但新手不会那样做，他们只会被止损出局，并接受亏损，一个专家交易者在这里买入，知道这可能是个交易区间，我们可能会得到一个深度回调，甚至低于这个低点的一个在这里买入的专家交易者要么在向下反转时迅速出场，要么会把止损设在原低于这些低点的下方，然后再反转上涨时买入更多。两段上涨走势，一个持续很长时间的多头通道，一个回调，现在是一个非常紧密的多通道甚至更强的第二段上涨走势，先手看到多头趋势的开始，而专家看到一个带有深度回调的宽多头通道，并且他们看到每一个新高都被卖出，新高卖出，新高卖出，新高卖出，所以专家预期这次强劲的多头突破仅仅是测试这个高点的一个买入真空测试。而新手在那里买入，在这个高点买入，突破了那个高点，我们将迎来一波测量移动上涨，而专家看到的恰恰相反，第一段上涨回调强劲的第二段上涨，新手在买入，而专家在卖出。新手看到一个双底颈线突破颈线上方，所以他们在那个高点买入，在那个高点上方一点，专家看到一个低二空头旗型，他在向下反转时卖出。","p":"p143"}]},{"t":"para","text":"交易区间中第二段走势陷阱非常常见，第二段走势看起来特别强劲，似乎将是新趋势的开始，但如果是一波上涨，它会诱使交易者高位买入，并且它诱使交易者低位卖出，所以你得到的是一个反转。一个竭尽缺口，而不是一个测量缺口。新手看到一段强劲的上涨走势就买入，预期会出现测量缺口和测量移动上涨。所以第一段走势回调至一个更高的低点，也是一段非常强劲的走势，所以新手在这里买入，心想天呐，这将是一个测量缺口，这些收盘价和这个高点将引发一个测量移动上涨，而专家说我不知道，这里有很多交易区间价格的行为，这可 调，接着一个楔形三次向上推动，它又细分为两个更大的上涨段。第一段第二段或者甚至是第一段，然后第二段交易区间总是细分为两段式波动，第一段回调第二段一段回调第二段。新手卖出收盘价，我们有一根大阴线下，一根也是阴线，所以他可能在那根K线一收盘就卖出，预期这是空头趋势的开始，或者他可能在这根K线的低点卖出，说如果是多头趋势，他就不应该跌破这个低点。而如果跌破，也许我们将迎来一波测量移动下跌，所以新手就在那个低点下方卖出，他做的正是有经验交易者的反面。","p":"p144"}]},{"t":"para","text":"在下跌途中情况相反，抛售回调，更强劲的抛售，这里有一个小的双顶或者一个低二做空，你得到一个双顶，每个双顶都是一个低二，这是一次强劲的抛售和一个双顶空头旗型，然后是一段强劲的第二段下跌走势，而新手想天呐，我们正在突破，我必须卖出，而专家说我不知道，看左边我们仍然没有跌破任何重要位置，所以这可能只是交易区间中的第二段下跌，知道交易区间通常包含多次两段式或三段式波动，例如第一段，第二段两段上涨，然后回调，接着一个楔形三次向上推动，它又细分为两个更大的上涨段。第一段第二段或者甚至是第一段，然后第二段交易区间总是细分为两段式波动，第一段回调第二段一段回调第二段。新手卖出收盘价，我们有一根大阴线下，一根也是阴线，所以他可能在那根K线一收盘就卖出，预期这是空头趋势的开始，或者他可能在这根K线的低点卖出，说如果是多头趋势，他就不应该跌破这个低点。而如果跌破，也许我们将迎来一波测量移动下跌，所以新手就在那个低点下方卖出，他做的正是有经验交易者的反面。","pid":"p144"},{"t":"img","src":"assets/img/u19_073.webp","ilabel":"U19-3","icap":"菜鸟被套 高手反做","fid":"fig74","ctx":[{"t":"在下跌途中情况相反，抛售回调，更强劲的抛售，这里有一个小的双顶或者一个低二做空，你得到一个双顶，每个双顶都是一个低二，这是一次强劲的抛售和一个双顶空头旗型，然后是一段强劲的第二段下跌走势，而新手想天呐，我们正在突破，我必须卖出，而专家说我不知道，看左边我们仍然没有跌破任何重要位置，所以这可能只是交易区间中的第二段下跌，知道交易区间通常包含多次两段式或三段式波动，例如第一段，第二段两段上涨，然后回调，接着一个楔形三次向上推动，它又细分为两个更大的上涨段。第一段第二段或者甚至是第一段，然后第二段交易区间总是细分为两段式波动，第一段回调第二段一段回调第二段。新手卖出收盘价，我们有一根大阴线下，一根也是阴线，所以他可能在那根K线一收盘就卖出，预期这是空头趋势的开始，或者他可能在这根K线的低点卖出，说如果是多头趋势，他就不应该跌破这个低点。而如果跌破，也许我们将迎来一波测量移动下跌，所以新手就在那个低点下方卖出，他做的正是有经验交易者的反面。","p":"p144"},{"t":"所以新手买在高点，卖在低点，在一个交易区间里，你不应该买高卖低，你应该买低卖高，这就是专家们做的，那叫做逆势交易——赌突破尝试会失败。而新手们他们被突然的反转震惊了，这怎么可能反转呢？这么强劲的空头突破怎么可能反转呢？新手因恐惧而僵住，存在情感冲突，他认为这是一笔好交易，他终于做对了，他终于入场，他在买入前等待了很久的强势，所以他以为他做的完全正确，他终于买入了，结果他买在了顶部，然后价格就下跌了，然后当价格跌到底部时，他说好吧，我认输，空头赢了。我要在这里卖出，他在这里买入，可能直到跌到这里才出场，然后他在这里卖出，可能直到涨到这里才出场。他做的正是专家行为的反面，新手依赖的是希望，他在这里买入心想是强劲的多头趋势，这是个好买点，如果你能管理好你的交易，这是个好买点，如果你认为存在交易区间的可能性，你决定依赖设在下方某处的止损，然后你被止损出局了，你就必须在反转上涨时买入，如果你一直持仓到这里，然后它确实反转上涨了，而你没有买入，那说明你根本没打算正确管理交易。下次不要在高位买入，因为你还没准备好正确管理交易。如果你没有持仓，看到市场这样走，你会想，天呐，那些在我们这个价位买入的交易者真的有麻烦了，或者如果你没有在这里做空，而是坐视旁观看着他，你会想哇，那些在底部做空的空头又麻烦了，问题在于你是客观的。而在这里卖出的或者在这里高位买入的新手则不是客观的他在否认图表上对任何其他人来说都很清楚的事情，他在高位买入并持仓希望趋势恢复他在低位卖出并持仓，希望下跌趋势恢复，但很明显他错了，他只是否认对其他人来说如此明显的事情。结果他损失了很多钱。","p":"p145"}]},{"t":"para","text":"所以新手买在高点，卖在低点，在一个交易区间里，你不应该买高卖低，你应该买低卖高，这就是专家们做的，那叫做逆势交易——赌突破尝试会失败。而新手们他们被突然的反转震惊了，这怎么可能反转呢？这么强劲的空头突破怎么可能反转呢？新手因恐惧而僵住，存在情感冲突，他认为这是一笔好交易，他终于做对了，他终于入场，他在买入前等待了很久的强势，所以他以为他做的完全正确，他终于买入了，结果他买在了顶部，然后价格就下跌了，然后当价格跌到底部时，他说好吧，我认输，空头赢了。我要在这里卖出，他在这里买入，可能直到跌到这里才出场，然后他在这里卖出，可能直到涨到这里才出场。他做的正是专家行为的反面，新手依赖的是希望，他在这里买入心想是强劲的多头趋势，这是个好买点，如果你能管理好你的交易，这是个好买点，如果你认为存在交易区间的可能性，你决定依赖设在下方某处的止损，然后你被止损出局了，你就必须在反转上涨时买入，如果你一直持仓到这里，然后它确实反转上涨了，而你没有买入，那说明你根本没打算正确管理交易。下次不要在高位买入，因为你还没准备好正确管理交易。如果你没有持仓，看到市场这样走，你会想，天呐，那些在我们这个价位买入的交易者真的有麻烦了，或者如果你没有在这里做空，而是坐视旁观看着他，你会想哇，那些在底部做空的空头又麻烦了，问题在于你是客观的。而在这里卖出的或者在这里高位买入的新手则不是客观的他在否认图表上对任何其他人来说都很清楚的事情，他在高位买入并持仓希望趋势恢复他在低位卖出并持仓，希望下跌趋势恢复，但很明显他错了，他只是否认对其他人来说如此明显的事情。结果他损失了很多钱。","pid":"p145"},{"t":"img","src":"assets/img/u19_074.webp","ilabel":"U19-4","icap":"菜鸟被套 高手反做","fid":"fig75","ctx":[{"t":"所以新手买在高点，卖在低点，在一个交易区间里，你不应该买高卖低，你应该买低卖高，这就是专家们做的，那叫做逆势交易——赌突破尝试会失败。而新手们他们被突然的反转震惊了，这怎么可能反转呢？这么强劲的空头突破怎么可能反转呢？新手因恐惧而僵住，存在情感冲突，他认为这是一笔好交易，他终于做对了，他终于入场，他在买入前等待了很久的强势，所以他以为他做的完全正确，他终于买入了，结果他买在了顶部，然后价格就下跌了，然后当价格跌到底部时，他说好吧，我认输，空头赢了。我要在这里卖出，他在这里买入，可能直到跌到这里才出场，然后他在这里卖出，可能直到涨到这里才出场。他做的正是专家行为的反面，新手依赖的是希望，他在这里买入心想是强劲的多头趋势，这是个好买点，如果你能管理好你的交易，这是个好买点，如果你认为存在交易区间的可能性，你决定依赖设在下方某处的止损，然后你被止损出局了，你就必须在反转上涨时买入，如果你一直持仓到这里，然后它确实反转上涨了，而你没有买入，那说明你根本没打算正确管理交易。下次不要在高位买入，因为你还没准备好正确管理交易。如果你没有持仓，看到市场这样走，你会想，天呐，那些在我们这个价位买入的交易者真的有麻烦了，或者如果你没有在这里做空，而是坐视旁观看着他，你会想哇，那些在底部做空的空头又麻烦了，问题在于你是客观的。而在这里卖出的或者在这里高位买入的新手则不是客观的他在否认图表上对任何其他人来说都很清楚的事情，他在高位买入并持仓希望趋势恢复他在低位卖出并持仓，希望下跌趋势恢复，但很明显他错了，他只是否认对其他人来说如此明显的事情。结果他损失了很多钱。","p":"p145"},{"t":"这里还有其他情况发生。多头突破，是的，但是扩张三角形一次回调，两次回调，更深的回调三次回调。扩张三角形顶部之后通常跟随扩张三角形多头旗型或扩张三角形底部，新手在可能的扩张三角形顶部买入。并且他在可能的扩张三角形底部卖出，他没有意识到正在展开的形态。在这里是一个买入入场形态，而不是卖出，并且我们有一个多头突破，在这里是一个卖出入场形态，而不是买入，我们有一个强劲的空头反转。在这里买入的新手没有意识到空头在每一个新高卖出都在赚钱。空头剥头皮，甚至在这个高点上方卖出赚钱，它回落到那个低点下方，并且每一个新高，空头都在赚钱，在这里买入的新手忽视了这里一直发生的情况，那些限价单空头一直在每一个新高卖出赚钱，使用宽止损和分批建仓，当这种情况发生时，意味着无论你有什么通道或趋势，可能很快会转化为交易区间，还有这个我们有一个高点，更高的高点，更高的高点，我们有一个低点更低的低点，这是一个扩张三角形顶部，一旦你看到两根或三根阴线，特别是三根阴线收盘在低点附近，我们这里有三根连续的阴线，如果你确实买入了，你必须出场，像那样收盘在低点的三根阴线，特别是两根有相当大小实体的阴线，通常是一个信号，表明你至少会得到几段下跌，对，如果你在高位买入，并且看到三根四根或五根连续的阴线，你必须 交易区间，他将会在低位买入，所以在这个低点买入，甚至在这个低点买入，它会下一个限价单买入，预期第二段下跌腿是走势的结束，记住主要交易品种有很多两段式波动，所以当你看到第二段腿时，专家预期他很快会反转向上，所以他们可以在先前低点用限价单买入。或者他们可以在反转向上时买入。就在那里。我想让你看看这根大阳线，看看你是否能理解那里发生了什么，我们有一个低一空头旗型，但在一波高潮抛售之后，并且支撑在交易区间的底部，那是一个低概率的赌注。这下跌相当强劲，并且有空头在卖出，收盘赌他会无限期继续下跌，但如果你在这个收盘卖出一根十字星，K线不太好，而下一根K线是阳线，你在想什么？并且想哦，这令人失望，我在交易区间的底部卖出的K线底部有一个长下影线，而下一根K线是阳线实体，也许我应该出场，然后下一根可以选你有一个低一做空。他触发了并立即反转向上，形成一根大外包上涨K线收盘在阴线的高点上方，这里发生的是那些卖出这根阴线收盘的空头，对下一根K线感到失望。然后他们决定最好设置限价单出场，这就是这根K线上发生的情况，空头正在放弃,那些卖出这根阴线收盘的空头，他们感到失望，并决定买入价格跌至那个小K线收盘价附近，接近他们最初的卖出位。他们买入后在阴线下方设置止损单卖出的空头明白，他们正在交易区间底部做空一个空头旗型。这不是强势交易，当市场并未崩溃时，他们恐慌性回补买入，他们放弃了，因此空头在这里放弃抵抗相当紧密的裸K通道可能是个小幅反转，意味着首次反转上涨后可能需要回测下方，但这仍表明空头不愿在此做空，也不愿在持空头仓位，市场很可能将向上运行。多头会买入这根大阳线的收盘，深知这根大阳线代表空头投降。卖出收盘的空头已放弃，低一空头旗型的空头已放弃。","p":"p148"}]},{"t":"para","text":"看看下跌腿。第一段腿有两个小部分，第二段腿专家会看所有这些价格行为，并认为是交易区间，他将会在低位买入，所以在这个低点买入，甚至在这个低点买入，它会下一个限价单买入，预期第二段下跌腿是走势的结束，记住主要交易品种有很多两段式波动，所以当你看到第二段腿时，专家预期他很快会反转向上，所以他们可以在先前低点用限价单买入。或者他们可以在反转向上时买入。就在那里。我想让你看看这根大阳线，看看你是否能理解那里发生了什么，我们有一个低一空头旗型，但在一波高潮抛售之后，并且支撑在交易区间的底部，那是一个低概率的赌注。这下跌相当强劲，并且有空头在卖出，收盘赌他会无限期继续下跌，但如果你在这个收盘卖出一根十字星，K线不太好，而下一根K线是阳线，你在想什么？并且想哦，这令人失望，我在交易区间的底部卖出的K线底部有一个长下影线，而下一根K线是阳线实体，也许我应该出场，然后下一根可以选你有一个低一做空。他触发了并立即反转向上，形成一根大外包上涨K线收盘在阴线的高点上方，这里发生的是那些卖出这根阴线收盘的空头，对下一根K线感到失望。然后他们决定最好设置限价单出场，这就是这根K线上发生的情况，空头正在放弃,那些卖出这根阴线收盘的空头，他们感到失望，并决定买入价格跌至那个小K线收盘价附近，接近他们最初的卖出位。他们买入后在阴线下方设置止损单卖出的空头明白，他们正在交易区间底部做空一个空头旗型。这不是强势交易，当市场并未崩溃时，他们恐慌性回补买入，他们放弃了，因此空头在这里放弃抵抗相当紧密的裸K通道可能是个小幅反转，意味着首次反转上涨后可能需要回测下方，但这仍表明空头不愿在此做空，也不愿在持空头仓位，市场很可能将向上运行。多头会买入这根大阳线的收盘，深知这根大阳线代表空头投降。卖出收盘的空头已放弃，低一空头旗型的空头已放弃。","pid":"p148"},{"t":"img","src":"assets/img/u19_077.webp","ilabel":"U19-7","icap":"菜鸟被套 高手反做","fid":"fig78","ctx":[{"t":"看看下跌腿。第一段腿有两个小部分，第二段腿专家会看所有这些价格行为，并认为是交易区间，他将会在低位买入，所以在这个低点买入，甚至在这个低点买入，它会下一个限价单买入，预期第二段下跌腿是走势的结束，记住主要交易品种有很多两段式波动，所以当你看到第二段腿时，专家预期他很快会反转向上，所以他们可以在先前低点用限价单买入。或者他们可以在反转向上时买入。就在那里。我想让你看看这根大阳线，看看你是否能理解那里发生了什么，我们有一个低一空头旗型，但在一波高潮抛售之后，并且支撑在交易区间的底部，那是一个低概率的赌注。这下跌相当强劲，并且有空头在卖出，收盘赌他会无限期继续下跌，但如果你在这个收盘卖出一根十字星，K线不太好，而下一根K线是阳线，你在想什么？并且想哦，这令人失望，我在交易区间的底部卖出的K线底部有一个长下影线，而下一根K线是阳线实体，也许我应该出场，然后下一根可以选你有一个低一做空。他触发了并立即反转向上，形成一根大外包上涨K线收盘在阴线的高点上方，这里发生的是那些卖出这根阴线收盘的空头，对下一根K线感到失望。然后他们决定最好设置限价单出场，这就是这根K线上发生的情况，空头正在放弃,那些卖出这根阴线收盘的空头，他们感到失望，并决定买入价格跌至那个小K线收盘价附近，接近他们最初的卖出位。他们买入后在阴线下方设置止损单卖出的空头明白，他们正在交易区间底部做空一个空头旗型。这不是强势交易，当市场并未崩溃时，他们恐慌性回补买入，他们放弃了，因此空头在这里放弃抵抗相当紧密的裸K通道可能是个小幅反转，意味着首次反转上涨后可能需要回测下方，但这仍表明空头不愿在此做空，也不愿在持空头仓位，市场很可能将向上运行。多头会买入这根大阳线的收盘，深知这根大阳线代表空头投降。卖出收盘的空头已放弃，低一空头旗型的空头已放弃。","p":"p148"},{"t":"当你使用止损单入场时，就是在押注突破和趋势延续，在紧密交易区间中，用止损单剥头皮是亏钱策略。在紧密交易区间中用止损单入场很难盈利，因为你最终会买在顶部，卖在底部。如果在紧密交易区间中交易，必须使用限价单入场或者直接观望。当区间如此紧密时，这是限价单主导的市场，我不想在底部用止损单做空，我不想在顶部用止损单做多，如果交易此形态我会反向操作，但先前高点设置限价买单，例如在多头旗型，高一买入形态上方卖出，同时在先前低点或低一低二空头旗型下方设置限价买单，押注市场反转上涨。此处同理，这是限价单市场一个紧密交易区间，用限价单更易盈利，在K线上方卖出，在K线下方买入，押注突破失败。我在此处K线上方卖出，在下方买入，在此处上方卖出。在下方买，如果在这个新高位置卖出，我在那个先前低点买入。另一个常见问题是常出现巨型信号K线，比如这根大阴线信号K线。市场直接跌破阴线低点，迫使交易者在过低位置做空，这是交易区间中的典型陷阱，这些大K线频繁出现,底部附近的大阴线或使交易者在阴线下方做空，导致卖在过低位置或顶部附近的大阳线，迫使他们买在过高位置，至少这会迫使新手如此操作。专业交易者的完全反向行动，为何这种策略数学期望差？若市场主要处于紧密交易区间，而你在底部阴线下方做空，由于是交易区间，这是个低概率押注，大多数突破终将失败，且风险回报比恶劣，K线实体大止损位远，对使用止损单的交易者数学期望不利，意味着反向操作的限价单交易者占优。与其在这根大阴线下方做空，不如在下方买入押注突破失败更合理，因此相比用止损单做空，在该K线低点设限价买单更有意义。","p":"p149"}]},{"t":"para","text":"当你使用止损单入场时，就是在押注突破和趋势延续，在紧密交易区间中，用止损单剥头皮是亏钱策略。在紧密交易区间中用止损单入场很难盈利，因为你最终会买在顶部，卖在底部。如果在紧密交易区间中交易，必须使用限价单入场或者直接观望。当区间如此紧密时，这是限价单主导的市场，我不想在底部用止损单做空，我不想在顶部用止损单做多，如果交易此形态我会反向操作，但先前高点设置限价买单，例如在多头旗型，高一买入形态上方卖出，同时在先前低点或低一低二空头旗型下方设置限价买单，押注市场反转上涨。此处同理，这是限价单市场一个紧密交易区间，用限价单更易盈利，在K线上方卖出，在K线下方买入，押注突破失败。我在此处K线上方卖出，在下方买入，在此处上方卖出。在下方买，如果在这个新高位置卖出，我在那个先前低点买入。另一个常见问题是常出现巨型信号K线，比如这根大阴线信号K线。市场直接跌破阴线低点，迫使交易者在过低位置做空，这是交易区间中的典型陷阱，这些大K线频繁出现,底部附近的大阴线或使交易者在阴线下方做空，导致卖在过低位置或顶部附近的大阳线，迫使他们买在过高位置，至少这会迫使新手如此操作。专业交易者的完全反向行动，为何这种策略数学期望差？若市场主要处于紧密交易区间，而你在底部阴线下方做空，由于是交易区间，这是个低概率押注，大多数突破终将失败，且风险回报比恶劣，K线实体大止损位远，对使用止损单的交易者数学期望不利，意味着反向操作的限价单交易者占优。与其在这根大阴线下方做空，不如在下方买入押注突破失败更合理，因此相比用止损单做空，在该K线低点设限价买单更有意义。","pid":"p149"},{"t":"img","src":"assets/img/u19_078.webp","ilabel":"U19-8","icap":"菜鸟被套 高手反做","fid":"fig79","ctx":[{"t":"当你使用止损单入场时，就是在押注突破和趋势延续，在紧密交易区间中，用止损单剥头皮是亏钱策略。在紧密交易区间中用止损单入场很难盈利，因为你最终会买在顶部，卖在底部。如果在紧密交易区间中交易，必须使用限价单入场或者直接观望。当区间如此紧密时，这是限价单主导的市场，我不想在底部用止损单做空，我不想在顶部用止损单做多，如果交易此形态我会反向操作，但先前高点设置限价买单，例如在多头旗型，高一买入形态上方卖出，同时在先前低点或低一低二空头旗型下方设置限价买单，押注市场反转上涨。此处同理，这是限价单市场一个紧密交易区间，用限价单更易盈利，在K线上方卖出，在K线下方买入，押注突破失败。我在此处K线上方卖出，在下方买入，在此处上方卖出。在下方买，如果在这个新高位置卖出，我在那个先前低点买入。另一个常见问题是常出现巨型信号K线，比如这根大阴线信号K线。市场直接跌破阴线低点，迫使交易者在过低位置做空，这是交易区间中的典型陷阱，这些大K线频繁出现,底部附近的大阴线或使交易者在阴线下方做空，导致卖在过低位置或顶部附近的大阳线，迫使他们买在过高位置，至少这会迫使新手如此操作。专业交易者的完全反向行动，为何这种策略数学期望差？若市场主要处于紧密交易区间，而你在底部阴线下方做空，由于是交易区间，这是个低概率押注，大多数突破终将失败，且风险回报比恶劣，K线实体大止损位远，对使用止损单的交易者数学期望不利，意味着反向操作的限价单交易者占优。与其在这根大阴线下方做空，不如在下方买入押注突破失败更合理，因此相比用止损单做空，在该K线低点设限价买单更有意义。","p":"p149"},{"t":"市场具有惯性倾向于延续当前走势，抗拒改变，在交易区间中80%的向上或向下突破会失败。反复出现剧烈反转，强劲空头突破后2-3根K线即反转上涨，强劲多头突破后1-3根K线即下跌，这些强势波动仅持续数根K线变反转，缺乏连续的同向强势趋势K线。此处虽属例外，但多数情况下大阳线后缺乏有效跟随，大阴线后缺乏跟随，大阳线后缺乏跟随，这正是交易区间的典型特征。你同时看到多头波段与空头波段,再次强调空头波段中明显缺乏连续大阴线，阴线，十字星阴线，阳线阴线十字星，而在上涨过程中大阳线何在？最终再次出现大阳线，按上方留下长影线和小K线，缺乏连续的强势趋势K线是交易区间的核心标志。强势趋势K线后缺乏有效跟随。如前所述，在先前高点上方和先前低点下方常出现假突破，因此与其在低点下方做空，不如买入更合理，与其在高点买入不如卖出更明智，因为大量交易区间价格行为表明，在下方买入的多头会在先前高点卖出多头平仓，而空头始终在伺机做空。","p":"p150"}]},{"t":"para","text":"市场具有惯性倾向于延续当前走势，抗拒改变，在交易区间中80%的向上或向下突破会失败。反复出现剧烈反转，强劲空头突破后2-3根K线即反转上涨，强劲多头突破后1-3根K线即下跌，这些强势波动仅持续数根K线变反转，缺乏连续的同向强势趋势K线。此处虽属例外，但多数情况下大阳线后缺乏有效跟随，大阴线后缺乏跟随，大阳线后缺乏跟随，这正是交易区间的典型特征。你同时看到多头波段与空头波段,再次强调空头波段中明显缺乏连续大阴线，阴线，十字星阴线，阳线阴线十字星，而在上涨过程中大阳线何在？最终再次出现大阳线，按上方留下长影线和小K线，缺乏连续的强势趋势K线是交易区间的核心标志。强势趋势K线后缺乏有效跟随。如前所述，在先前高点上方和先前低点下方常出现假突破，因此与其在低点下方做空，不如买入更合理，与其在高点买入不如卖出更明智，因为大量交易区间价格行为表明，在下方买入的多头会在先前高点卖出多头平仓，而空头始终在伺机做空。","pid":"p150"}],"wcount":5281},{"id":"u20","title":"Unit 20　什么是突破？","icon":"20","sections":[],"blocks":[{"t":"para","text":"Unit 20 什么是突破？","pid":"p151"},{"t":"img","src":"assets/img/u20_079.webp","ilabel":"U20-1","icap":"什么是突破？","fid":"fig80","ctx":[{"t":"Unit 20 什么是突破？","p":"p151"},{"t":"首先，我将阐述我对突破的定义。请看这张图表，这里出现了一次突破，突破本质上就是一根趋势线，突破可以是小型的如此处，也可以是大型的如此处，若出现连续K线则力度更强。此时我们观察到一次突破市场曾尝试再次筑底，但未上行反而下跌极速，因此形成下跌，继而演变为楔形通道，未出现多头突破，反而形成空头突破，这是低概率事件。当低概率事件发生时，通常会出现跟随走势，并往往呈现某种测量移动，一根大阴线收盘于最低点，四根K线开盘立即抛售，即使实体较小，光头光脚形态仍收于最低点。仅凭光头光脚形态本身即可确认突破有效性，并增加价格继续下跌的概率。当见到此类强势突破时，可知市场下跌概率达60%以上。此时必须卖出，且需不计缘由的卖出。可采用任何订单类型市价卖出，在K线收盘时卖出，设置限价单于本K线收盘价卖出，并成交。四根K线开盘后立即执行，在该K线低点下方突破位，卖出。最简易入场方式突破K线，我跟随K线收盘瞬间市价卖出。","p":"p152"}]},{"t":"para","text":"首先，我将阐述我对突破的定义。请看这张图表，这里出现了一次突破，突破本质上就是一根趋势线，突破可以是小型的如此处，也可以是大型的如此处，若出现连续K线则力度更强。此时我们观察到一次突破市场曾尝试再次筑底，但未上行反而下跌极速，因此形成下跌，继而演变为楔形通道，未出现多头突破，反而形成空头突破，这是低概率事件。当低概率事件发生时，通常会出现跟随走势，并往往呈现某种测量移动，一根大阴线收盘于最低点，四根K线开盘立即抛售，即使实体较小，光头光脚形态仍收于最低点。仅凭光头光脚形态本身即可确认突破有效性，并增加价格继续下跌的概率。当见到此类强势突破时，可知市场下跌概率达60%以上。此时必须卖出，且需不计缘由的卖出。可采用任何订单类型市价卖出，在K线收盘时卖出，设置限价单于本K线收盘价卖出，并成交。四根K线开盘后立即执行，在该K线低点下方突破位，卖出。最简易入场方式突破K线，我跟随K线收盘瞬间市价卖出。","pid":"p152"},{"t":"img","src":"assets/img/u20_080.webp","ilabel":"U20-2","icap":"什么是突破？","fid":"fig81","ctx":[{"t":"首先，我将阐述我对突破的定义。请看这张图表，这里出现了一次突破，突破本质上就是一根趋势线，突破可以是小型的如此处，也可以是大型的如此处，若出现连续K线则力度更强。此时我们观察到一次突破市场曾尝试再次筑底，但未上行反而下跌极速，因此形成下跌，继而演变为楔形通道，未出现多头突破，反而形成空头突破，这是低概率事件。当低概率事件发生时，通常会出现跟随走势，并往往呈现某种测量移动，一根大阴线收盘于最低点，四根K线开盘立即抛售，即使实体较小，光头光脚形态仍收于最低点。仅凭光头光脚形态本身即可确认突破有效性，并增加价格继续下跌的概率。当见到此类强势突破时，可知市场下跌概率达60%以上。此时必须卖出，且需不计缘由的卖出。可采用任何订单类型市价卖出，在K线收盘时卖出，设置限价单于本K线收盘价卖出，并成交。四根K线开盘后立即执行，在该K线低点下方突破位，卖出。最简易入场方式突破K线，我跟随K线收盘瞬间市价卖出。","p":"p152"},{"t":"难点在于其突发性，图表显示市场正在筑底，却突然强势破位下行。需时间确认当前走势真实性，市场是否真将如预期展开测量移动式下跌。多数交易者犹豫不决，行情急速发展，若此处卖出，止损需设在上方较远位置。导致风险扩大。突破的优势在于盈利概率超60%，通常触发测量移动。且潜在回报巨大，我惯常测算突破幅度，首根K线开盘价至末根K线收盘价60%概率下跌目标约等距于此幅度。目标位可看至此区域。","p":"p153"}]},{"t":"para","text":"难点在于其突发性，图表显示市场正在筑底，却突然强势破位下行。需时间确认当前走势真实性，市场是否真将如预期展开测量移动式下跌。多数交易者犹豫不决，行情急速发展，若此处卖出，止损需设在上方较远位置。导致风险扩大。突破的优势在于盈利概率超60%，通常触发测量移动。且潜在回报巨大，我惯常测算突破幅度，首根K线开盘价至末根K线收盘价60%概率下跌目标约等距于此幅度。目标位可看至此区域。","pid":"p153"},{"t":"img","src":"assets/img/u20_081.webp","ilabel":"U20-3","icap":"什么是突破？","fid":"fig82","ctx":[{"t":"难点在于其突发性，图表显示市场正在筑底，却突然强势破位下行。需时间确认当前走势真实性，市场是否真将如预期展开测量移动式下跌。多数交易者犹豫不决，行情急速发展，若此处卖出，止损需设在上方较远位置。导致风险扩大。突破的优势在于盈利概率超60%，通常触发测量移动。且潜在回报巨大，我惯常测算突破幅度，首根K线开盘价至末根K线收盘价60%概率下跌目标约等距于此幅度。目标位可看至此区域。","p":"p153"},{"t":"如前所述，若在此处卖出，止损位可能需设在上方。但若在低位卖出，实际风险将远超预期承受范围。这造成心理压力，止损应置于突破起点上方，可能是首根阴线高点，甚至更高位置，通常原则是市场不应回升至突破K线或其前一根K线高点之上。若突破始于首根阴线，止损应设于该处，若价格触及止损，则证明预判错误，市场不会展开测量移动，下跌更可能转入交易区间，而非下跌趋势，反之维持跌势概率超60%。因止损位较远，需减小头寸规模。若已达最小交易单位仍无法承受风险，则放弃交易。等待回调出现更小止损的入场机会。行情骤变，令人措手不及，预期筑底时出现下跌小十字星，市场看似平静，却突然剧烈扩张，引发恐慌与压力。K线实体大且波动急速，决策时间显得不足。","p":"p154"}]},{"t":"para","text":"如前所述，若在此处卖出，止损位可能需设在上方。但若在低位卖出，实际风险将远超预期承受范围。这造成心理压力，止损应置于突破起点上方，可能是首根阴线高点，甚至更高位置，通常原则是市场不应回升至突破K线或其前一根K线高点之上。若突破始于首根阴线，止损应设于该处，若价格触及止损，则证明预判错误，市场不会展开测量移动，下跌更可能转入交易区间，而非下跌趋势，反之维持跌势概率超60%。因止损位较远，需减小头寸规模。若已达最小交易单位仍无法承受风险，则放弃交易。等待回调出现更小止损的入场机会。行情骤变，令人措手不及，预期筑底时出现下跌小十字星，市场看似平静，却突然剧烈扩张，引发恐慌与压力。K线实体大且波动急速，决策时间显得不足。","pid":"p154"},{"t":"img","src":"assets/img/u20_082.webp","ilabel":"U20-4","icap":"什么是突破？","fid":"fig83","ctx":[{"t":"如前所述，若在此处卖出，止损位可能需设在上方。但若在低位卖出，实际风险将远超预期承受范围。这造成心理压力，止损应置于突破起点上方，可能是首根阴线高点，甚至更高位置，通常原则是市场不应回升至突破K线或其前一根K线高点之上。若突破始于首根阴线，止损应设于该处，若价格触及止损，则证明预判错误，市场不会展开测量移动，下跌更可能转入交易区间，而非下跌趋势，反之维持跌势概率超60%。因止损位较远，需减小头寸规模。若已达最小交易单位仍无法承受风险，则放弃交易。等待回调出现更小止损的入场机会。行情骤变，令人措手不及，预期筑底时出现下跌小十字星，市场看似平静，却突然剧烈扩张，引发恐慌与压力。K线实体大且波动急速，决策时间显得不足。","p":"p154"},{"t":"必须迅速抉择是否卖出。止损位如何设置？目标位如何设定？头寸规模如何控制？虽看似数秒可决断，实盘操作尤其对新手而言极为困难。我将阐述应对策略，明确止损位后必须严格执行，同时根据风险承受度确定头寸规模。","p":"p155"}]},{"t":"para","text":"必须迅速抉择是否卖出。止损位如何设置？目标位如何设定？头寸规模如何控制？虽看似数秒可决断，实盘操作尤其对新手而言极为困难。我将阐述应对策略，明确止损位后必须严格执行，同时根据风险承受度确定头寸规模。","pid":"p155"},{"t":"img","src":"assets/img/u20_083.webp","ilabel":"U20-5","icap":"什么是突破？","fid":"fig84","ctx":[{"t":"必须迅速抉择是否卖出。止损位如何设置？目标位如何设定？头寸规模如何控制？虽看似数秒可决断，实盘操作尤其对新手而言极为困难。我将阐述应对策略，明确止损位后必须严格执行，同时根据风险承受度确定头寸规模。","p":"p155"},{"t":"突破常表现为大实体趋势K线，如此处长阴线，但有时由一系列小趋势K线构成，例如此处。看似平淡的突破却引发强劲趋势，市场持续上行，每根K线收盘价均持平或高于前根收盘价。虽K线实体不大，但涨势绵延不绝，需知多数图表是时间与价格的结合体。趋势由二者共同塑造，有时时间维度比价格更重要，前例中价格变动剧烈，急跌，此处时间维度凸显。多头主导大量K线长期控盘，最终引发大级别行情。此处小K线后接续系列K线。","p":"p156"}]},{"t":"para","text":"突破常表现为大实体趋势K线，如此处长阴线，但有时由一系列小趋势K线构成，例如此处。看似平淡的突破却引发强劲趋势，市场持续上行，每根K线收盘价均持平或高于前根收盘价。虽K线实体不大，但涨势绵延不绝，需知多数图表是时间与价格的结合体。趋势由二者共同塑造，有时时间维度比价格更重要，前例中价格变动剧烈，急跌，此处时间维度凸显。多头主导大量K线长期控盘，最终引发大级别行情。此处小K线后接续系列K线。","pid":"p156"},{"t":"img","src":"assets/img/u20_084.webp","ilabel":"U20-6","icap":"什么是突破？","fid":"fig85","ctx":[{"t":"突破常表现为大实体趋势K线，如此处长阴线，但有时由一系列小趋势K线构成，例如此处。看似平淡的突破却引发强劲趋势，市场持续上行，每根K线收盘价均持平或高于前根收盘价。虽K线实体不大，但涨势绵延不绝，需知多数图表是时间与价格的结合体。趋势由二者共同塑造，有时时间维度比价格更重要，前例中价格变动剧烈，急跌，此处时间维度凸显。多头主导大量K线长期控盘，最终引发大级别行情。此处小K线后接续系列K线。","p":"p156"},{"t":"在更高时间框架图表上，这10根大阳线收于最高点，本时间框架则呈现紧密通道。此类紧密通道在高级别图表及对应大阳线，所有紧密通道在高级别图表皆显现为大趋势K线，所有趋势必处于通道中，即便不明显。","p":"p157"}]},{"t":"para","text":"在更高时间框架图表上，这10根大阳线收于最高点，本时间框架则呈现紧密通道。此类紧密通道在高级别图表及对应大阳线，所有紧密通道在高级别图表皆显现为大趋势K线，所有趋势必处于通道中，即便不明显。","pid":"p157"},{"t":"img","src":"assets/img/u20_085.webp","ilabel":"U20-7","icap":"什么是突破？","fid":"fig86","ctx":[{"t":"在更高时间框架图表上，这10根大阳线收于最高点，本时间框架则呈现紧密通道。此类紧密通道在高级别图表及对应大阳线，所有紧密通道在高级别图表皆显现为大趋势K线，所有趋势必处于通道中，即便不明显。","p":"p157"},{"t":"如图中下跌趋势及空头通道。所有反转皆为突破形态，即突破通道。首次突破后回撤。第二次突破空头通道上方形成多头突破，空头通道本质是多头旗型，最终向上突破概率达75%，随后三根K线均收阳。","p":"p158"}]},{"t":"para","text":"如图中下跌趋势及空头通道。所有反转皆为突破形态，即突破通道。首次突破后回撤。第二次突破空头通道上方形成多头突破，空头通道本质是多头旗型，最终向上突破概率达75%，随后三根K线均收阳。","pid":"p158"},{"t":"img","src":"assets/img/u20_086.webp","ilabel":"U20-8","icap":"什么是突破？","fid":"fig87","ctx":[{"t":"如图中下跌趋势及空头通道。所有反转皆为突破形态，即突破通道。首次突破后回撤。第二次突破空头通道上方形成多头突破，空头通道本质是多头旗型，最终向上突破概率达75%，随后三根K线均收阳。","p":"p158"},{"t":"不仅以光头阳线突破通道，跟随K线亦全部收阳。只有两根十字形成，表明多头积极进取，突破意味着空头放弃抵抗。此区间空头持续在K线上方卖出，押注反转失败，延续跌势，他们曾在此处押注做空。但当前出现阳线，突破阳线和跟随阳线，空头即将弃守，此刻已然发生。连续两根光头光脚阳线，虽实体不大，却标志着空头投降。原分批加仓的空头见价格突破前低点，高点后选择离场，他们将等待多头趋势转弱信号再行做空。若无转弱迹象，趋势将持续攀升。此时不仅多投激进买入,空头也积极回补。迫切希望平仓止损，因担忧市场深幅上涨，导致亏损扩大。连续两根光头阳线连续两根光头阳线，使市场形态转变，从每1-2根K线反转。转为两根K线反转，高级别图表呈十字星，再续十字星，此区域约15根K线构成系列十字星，最终出现连续光头光脚K线，市场性质由交易区间转变为多头趋势，多空双方均激进买入。因共识认为市场有60%概率展开测量移动式上涨。因为他们都认为市场有60%的可能性会上涨，而且涨幅会达到一定的幅度。","p":"p159"}]},{"t":"para","text":"不仅以光头阳线突破通道，跟随K线亦全部收阳。只有两根十字形成，表明多头积极进取，突破意味着空头放弃抵抗。此区间空头持续在K线上方卖出，押注反转失败，延续跌势，他们曾在此处押注做空。但当前出现阳线，突破阳线和跟随阳线，空头即将弃守，此刻已然发生。连续两根光头光脚阳线，虽实体不大，却标志着空头投降。原分批加仓的空头见价格突破前低点，高点后选择离场，他们将等待多头趋势转弱信号再行做空。若无转弱迹象，趋势将持续攀升。此时不仅多投激进买入,空头也积极回补。迫切希望平仓止损，因担忧市场深幅上涨，导致亏损扩大。连续两根光头阳线连续两根光头阳线，使市场形态转变，从每1-2根K线反转。转为两根K线反转，高级别图表呈十字星，再续十字星，此区域约15根K线构成系列十字星，最终出现连续光头光脚K线，市场性质由交易区间转变为多头趋势，多空双方均激进买入。因共识认为市场有60%概率展开测量移动式上涨。因为他们都认为市场有60%的可能性会上涨，而且涨幅会达到一定的幅度。","pid":"p159"}],"wcount":1821},{"id":"u21","title":"Unit 21　强势突破，比如入场","icon":"21","sections":[],"blocks":[{"t":"para","text":"Unit 21 强势突破，比如入场","pid":"p160"},{"t":"img","src":"assets/img/u21_087.webp","ilabel":"U21-1","icap":"强势突破，比如入场","fid":"fig88","ctx":[{"t":"Unit 21 强势突破，比如入场","p":"p160"},{"t":"当突破强劲时，你必须训练自己入场。这里我们看到一系列阳线强度并不特别突出，随后突然出现一根更大的阳线，收盘于最高点，且超越日内高点，紧接着又是一根收盘于最高点的阳线以及一根更大的阳线。此刻观察这根K线，你面临两个选择，要么做空，押注这是对昨日收盘价的多头真空测试，市场将回落，要么做多押注市场将走出侧移动上涨。那么你是否会买入收盘押注测量移动上涨，将止损设在底部下方，假设你在此处设置利润目标，使其等于风险值，你买入此收盘价，止损设在此处，你预期测量移动上涨，因此利润目标在此处。此时盈亏比是一，利润目标设在多头突破底部，风险值可能相同，多头与空头的风险和回报相同。你会选择哪笔交易？此刻你会买入还是卖出？区别何在？","p":"p161"}]},{"t":"para","text":"当突破强劲时，你必须训练自己入场。这里我们看到一系列阳线强度并不特别突出，随后突然出现一根更大的阳线，收盘于最高点，且超越日内高点，紧接着又是一根收盘于最高点的阳线以及一根更大的阳线。此刻观察这根K线，你面临两个选择，要么做空，押注这是对昨日收盘价的多头真空测试，市场将回落，要么做多押注市场将走出侧移动上涨。那么你是否会买入收盘押注测量移动上涨，将止损设在底部下方，假设你在此处设置利润目标，使其等于风险值，你买入此收盘价，止损设在此处，你预期测量移动上涨，因此利润目标在此处。此时盈亏比是一，利润目标设在多头突破底部，风险值可能相同，多头与空头的风险和回报相同。你会选择哪笔交易？此刻你会买入还是卖出？区别何在？","pid":"p161"},{"t":"img","src":"assets/img/u21_088.webp","ilabel":"U21-2","icap":"强势突破，比如入场","fid":"fig89","ctx":[{"t":"当突破强劲时，你必须训练自己入场。这里我们看到一系列阳线强度并不特别突出，随后突然出现一根更大的阳线，收盘于最高点，且超越日内高点，紧接着又是一根收盘于最高点的阳线以及一根更大的阳线。此刻观察这根K线，你面临两个选择，要么做空，押注这是对昨日收盘价的多头真空测试，市场将回落，要么做多押注市场将走出侧移动上涨。那么你是否会买入收盘押注测量移动上涨，将止损设在底部下方，假设你在此处设置利润目标，使其等于风险值，你买入此收盘价，止损设在此处，你预期测量移动上涨，因此利润目标在此处。此时盈亏比是一，利润目标设在多头突破底部，风险值可能相同，多头与空头的风险和回报相同。你会选择哪笔交易？此刻你会买入还是卖出？区别何在？","p":"p161"},{"t":"空头的风险位于此处高点，多头的利润目标在此处，多头的风险在此处，空头的利润目标在此处，可见多头与空头的风险回报完全相同。你会选择哪笔交易？买入还是卖出？当然选择买入，因为交易者方程式的第三变量是概率，而概率明显偏向多头，在此强劲突破配合良好背景下，有60%概率在跌K线低点前走出测量移动上涨。因此做多获利容易的多，尽早判定市场将上涨，行情瞬息万变，决策难度很高。开盘平静后出现相当强劲的突破，你必须训练自己，果断买入，任何理由皆可。采用适当止损和仓位管理，保持耐心，若趋势强劲，买在高位并不重要，在此处或此处买入无关紧要，关键在于你必须买入。因为存在正向的交易者方程式。","p":"p162"}]},{"t":"para","text":"空头的风险位于此处高点，多头的利润目标在此处，多头的风险在此处，空头的利润目标在此处，可见多头与空头的风险回报完全相同。你会选择哪笔交易？买入还是卖出？当然选择买入，因为交易者方程式的第三变量是概率，而概率明显偏向多头，在此强劲突破配合良好背景下，有60%概率在跌K线低点前走出测量移动上涨。因此做多获利容易的多，尽早判定市场将上涨，行情瞬息万变，决策难度很高。开盘平静后出现相当强劲的突破，你必须训练自己，果断买入，任何理由皆可。采用适当止损和仓位管理，保持耐心，若趋势强劲，买在高位并不重要，在此处或此处买入无关紧要，关键在于你必须买入。因为存在正向的交易者方 准阳线。多数情况下系列阳线属于交易区间或通道的一部分。","pid":"p164"},{"t":"img","src":"assets/img/u21_091.webp","ilabel":"U21-5","icap":"强势突破，比如入场","fid":"fig92","ctx":[{"t":"开盘跳空下跌后反转上行，并加速攀升，虽无法看到左侧全部K线，但明显是跳空下跌后的反转上行。背景支持更高价格。开盘强势反转上行，我将展示左侧K线形态。这是当前行情的全景图。对应此区域，跳空，下跌，反弹，跳空，下跌，反弹实际上属于扩张三角形结构，尽管此处不可见，此处是三角形底部对应此趋势线。因此背景对多头有利，当前是扩张三角形，多头旗型，强劲多头趋势中，横盘整理，现正从扩张三角形反转上行，延续趋势。背景预示更高价格。关于市场周期需牢记关键点，任何图表中仅约10%的K线属于强劲突破。此处出现强劲突破，此处也出现强劲突破，任何图表中仅约5%的K线处于多头趋势初期的强劲突破段。这正是当前状态，本图表约含100根K线，此处出现两根极强劲的多头突破K线，随后五六根标准阳线。多数情况下系列阳线属于交易区间或通道的一部分。","p":"p164"},{"t":"我认为至关重要的是尽早判定市场始终做多。如何决策连续两根阳线收盘于最高点，阳线实体大影线重叠少，且背景良好，从扩张三角形多头旗型反转上行，处于持续数日的多头趋势中。开盘时空头看到跳空下跌和大阴线显示出反弹疲弱，他们认定是空头旗型将向下突破，结果却出现多头突破，不仅突破第二根阳线实体更大。原本的空头旗型被向上突破。且背景支持强劲多头趋势后，处于近日交易区间底部。正从昨日低点下方反转上行。","p":"p165"}]},{"t":"para","text":"我认为至关重要的是尽早判定市场始终做多。如何决策连续两根阳线收盘于最高点，阳线实体大影线重叠少，且背景良好，从扩张三角形多头旗型反转上行，处于持续数日的多头趋势中。开盘时空头看到跳空下跌和大阴线显示出反弹疲弱，他们认定是空头旗型将向下突破，结果却出现多头突破，不仅突破第二根阳线实体更大。原本的空头旗型被向上突破。且背景支持强劲多头趋势后，处于近日交易区间底部。正从昨日低点下方反转上行。","pid":"p165"},{"t":"img","src":"assets/img/u21_092.webp","ilabel":"U21-6","icap":"强势突破，比如入场","fid":"fig93","ctx":[{"t":"我认为至关重要的是尽早判定市场始终做多。如何决策连续两根阳线收盘于最高点，阳线实体大影线重叠少，且背景良好，从扩张三角形多头旗型反转上行，处于持续数日的多头趋势中。开盘时空头看到跳空下跌和大阴线显示出反弹疲弱，他们认定是空头旗型将向下突破，结果却出现多头突破，不仅突破第二根阳线实体更大。原本的空头旗型被向上突破。且背景支持强劲多头趋势后，处于近日交易区间底部。正从昨日低点下方反转上行。","p":"p165"},{"t":"每次新突破后，交易者上移止损，出现两根强势阳线，买入位置无关紧要，假设你在此处买入，初始止损应设在此处，强劲突破后可将止损上移至此，突破起点下方，当行情再次反转，上行至此，将止损移至近期关键更高低点下方。即此处。强劲突破创出新高，因此此处是关键的更高低点，若你市场处于多头趋势的前提正确，则不应跌破关键更高低点。若在此区域买入，止损仍设于此处下方，但当出现系列强劲阳线后，需将止损上移至该关键更高低点下方。若跌破该位置，则市场不再处于强劲多头趋势，可能转为交易区间，甚至空头趋势。无需纠结，无论在此处，此处和此处买入皆可，当行情运行至此区域或许更接近这根或那根K线时，必须将止损移至突破起点下方。此处出现小型突破如何应对？止损是在此处，还是此处，实际上并不明确，本次突破幅度较小，多数交易者可能将止损设于此或此处。只要市场持稳于近期关键更高低点上方即持续形成新的关键更高低点，该低点后伴随强劲突破，则多头趋势延续。若跌破止损位和前提错误，需离场，接受亏损退出，若再次高位买入，且止损失已被触发，立即退出，坦然承担损失，务必焦虑。你的前提有误，但若在此处买入后行情上涨，回落触及新设止损，此处则可带着可观利润离场。若你认为市场已脱离强劲多头趋势，则不应继续持有多头趋势头寸。若行情转为交易区间，需按区间交易策略管理，而非趋势交易。","p":"p166"}]},{"t":"para","text":"每次新突破后，交易者上移止损，出现两根强势阳线，买入位置无关紧要，假设你在此处买入，初始止损应设在此处，强劲突破后可将止损上移至此，突破起点下方，当行情再次反转，上行至此，将止损移至近期关键更高低点下方。即此处。强劲突破创出新高，因此此处是关键的更高低点，若你市场处于多头趋势的前提正确，则不应跌破关键更高低点。若在此区域买入，止损仍设于此处下方，但当出现系列强劲阳线后，需将止损上移至该关键更高低点下方。若跌破该位置，则市场不再处于强劲多头趋势，可能转为交易区间，甚至空头趋势。无需纠结，无论在此处，此处和此处买入皆可，当行情运行至此区域或许更接近这根或那根K线时，必须将止损移至突破起点下方。此处出现小型突破如何应对？止损是在此处，还是此处，实际上并不明确，本次突破幅度较小，多数交易者可能将止损设于此或此处。只要市场持稳于近期关键更高低点上方即持续形成新的关键更高低点，该低点后伴随强劲突破，则多头趋势延续。若跌破止损位和前提错误，需离场，接受亏损退出，若再次高位买入，且止损失已被触发，立即退出，坦然承担损失，务必焦虑。你的前提有误，但若在此处买入后行情上涨，回落触及新设止损，此处则可带着可观利润离场。若你认为市场已脱离强劲多头趋势，则不应继续持有多头趋势头寸。若行情转为交易区间，需按区间交易策略管理，而非趋势交易。","pid":"p166"}],"wcount":1948},{"id":"u22","title":"Unit 22　弱势入场形态与失败的突破","icon":"22","sections":[],"blocks":[{"t":"para","text":"Unit 22 弱势入场形态与失败的突破","pid":"p167"},{"t":"img","src":"assets/img/u22_093.webp","ilabel":"U22-1","icap":"弱势入场形态与失败的突破","fid":"fig94","ctx":[{"t":"Unit 22 弱势入场形态与失败的突破","p":"p167"},{"t":"并非所有入场形态都很强势，并非所有突破都很强势，可能存在弱势入场形态和失败突破，大型阳线收盘于最高点，良好的跟随K线，更多跟随走势。这是强势突破，最终会出现回调，此时我认为突破已失败。出现阴线后，这根K线跌破前低，因此这是回调，此时形成突破失败做空信号。理论上交易者会在阴线下方做空，在此处成交视其为失败的多头突破。我会做这笔交易吗？不仅看此处不会，但如果处于巨大空头趋势中，我会入场。仅观察此处，每次看到突破后回调反转尝试，我都称之为失败突破，但强势趋势中多数失败突破会演变为多头旗型。若失败未能阻止多头趋势，换言之，若失败无效，且多头趋势恢复，则形成趋势延续。如此图所示。失败的多头突破，此K线跌破前K线低点，该阴线收盘于最低点，但仅演变为回调，形成多头旗型后趋势恢复上行，这很合理，因为该阴线强度不足以反转如此强势的突破。","p":"p168"}]},{"t":"para","text":"并非所有入场形态都很强势，并非所有突破都很强势，可能存在弱势入场形态和失败突破，大型阳线收盘于最高点，良好的跟随K线，更多跟随走势。这是强势突破，最终会出现回调，此时我认为突破已失败。出现阴线后，这根K线跌破前低，因此这是回调，此时形成突破失败做空信号。理论上交易者会在阴线下方做空，在此处成交视其为失败的多头突破。我会做这笔交易吗？不仅看此处不会，但如果处于巨大空头趋势中，我会入场。仅观察此处，每次看到突破后回调反转尝试，我都称之为失败突破，但强势趋势中多数失败突破会演变为多头旗型。若失败未能阻止多头趋势，换言之，若失败无效，且多头趋势恢复，则形成趋势延续。如此图所示。失败的多头突破，此K线跌破前K线低点，该阴线收盘于最低点，但仅演变为回调，形成多头旗型后趋势恢复上行，这很合理，因为该阴线强度不足以反转如此强势的突破。","pid":"p168"},{"t":"img","src":"assets/img/u22_094.webp","ilabel":"U22-2","icap":"弱势入场形态与失败的突破","fid":"fig95","ctx":[{"t":"并非所有入场形态都很强势，并非所有突破都很强势，可能存在弱势入场形态和失败突破，大型阳线收盘于最高点，良好的跟随K线，更多跟随走势。这是强势突破，最终会出现回调，此时我认为突破已失败。出现阴线后，这根K线跌破前低，因此这是回调，此时形成突破失败做空信号。理论上交易者会在阴线下方做空，在此处成交视其为失败的多头突破。我会做这笔交易吗？不仅看此处不会，但如果处于巨大空头趋势中，我会入场。仅观察此处，每次看到突破后回调反转尝试，我都称之为失败突破，但强势趋势中多数失败突破会演变为多头旗型。若失败未能阻止多头趋势，换言之，若失败无效，且多头趋势恢复，则形成趋势延续。如此图所示。失败的多头突破，此K线跌破前K线低点，该阴线收盘于最低点，但仅演变为回调，形成多头旗型后趋势恢复上行，这很合理，因为该阴线强度不足以反转如此强势的突破。","p":"p168"},{"t":"此处突破后出现两根阳线，再次突破，随后又一次突破，此处出现失败。回调低点跌破前低至此。此低点跌破前低点，会有人在此做空吗？不会，这是5根K线构成的多头微型通道，四根阳线中有三根收盘于中点上方。你不会在该K线下方做空，因此这更像是止损位已远离的多头获利了结，而非反转。市场企图某些时刻出现急速回调通道形态，形成三推，急速为第一推，第二推，第三推是形态良好的阴线，某些时刻失败突破将导致突破失效。当前仍处于突破状态，仍处于较紧密的多头通道，但终将出现足够获利了结，通道转为交易区间。这是常见形态突破形成急速，随后三推123，市场演变为交易区间，走出数段下跌，这可能是第一段，市场通常回到通道起点。即突破回调通道形态，三推走势后出现形态良好的做空信号K线，大量多头将再次获利了结，部分空头再次做空，其他空头会等待连续三根阴线收盘于低点附近再入场做空。或在此弱势多头旗型上方做空，该阳线强度不足以反转三根阴线，且此后至少预期两段横盘至下跌走势。测试通道底部，并转为交易区间。","p":"p169"}]},{"t":"para","text":"此处突破后出现两根阳线，再次突破，随后又一次突破，此处出现失败。回调低点跌破前低至此。此低点跌破前低点，会有人在此做空吗？不会，这是5根K线构成的多头微型通道，四根阳线中有三根收盘于中点上方。你不会在该K线下方做空，因此这更像是止损位已远离的多头获利了结，而非反转。市场企图某些时刻出现急速回调通道形态，形成三推，急速为第一推，第二推，第三推是形态良好的阴线，某些时刻失败突破将导致突破失效。当前仍处于突破状态，仍处于较紧密的多头通道，但终将出现足够获利了结，通道转为交易区间。这是常见形态突破形成急速，随后三推123，市场演变为交易区间，走出数段下跌，这可能是第一段，市场通常回到通道起点。即突破回调通道形态，三推走势后出现形态良好的做空信号K线，大量多头将再次获利了结，部分空头再次做空，其他空头会等待连续三根阴线收盘于低点附近再入场做空。或在此弱势多头旗型上方做空，该阳线强度不足以反转三根阴线，且此后至少预期两段横盘至下跌走势。测试通道底部，并转为交易区间。","pid":"p169"},{"t":"img","src":"assets/img/u22_095.webp","ilabel":"U22-3","icap":"弱势入场形态与失败的突破","fid":"fig96","ctx":[{"t":"此处突破后出现两根阳线，再次突破，随后又一次突破，此处出现失败。回调低点跌破前低至此。此低点跌破前低点，会有人在此做空吗？不会，这是5根K线构成的多头微型通道，四根阳线中有三根收盘于中点上方。你不会在该K线下方做空，因此这更像是止损位已远离的多头获利了结，而非反转。市场企图某些时刻出现急速回调通道形态，形成三推，急速为第一推，第二推，第三推是形态良好的阴线，某些时刻失败突破将导致突破失效。当前仍处于突破状态，仍处于较紧密的多头通道，但终将出现足够获利了结，通道转为交易区间。这是常见形态突破形成急速，随后三推123，市场演变为交易区间，走出数段下跌，这可能是第一段，市场通常回到通道起点。即突破回调通道形态，三推走势后出现形态良好的做空信号K线，大量多头将再次获利了结，部分空头再次做空，其他空头会等待连续三根阴线收盘于低点附近再入场做空。或在此弱势多头旗型上方做空，该阳线强度不足以反转三根阴线，且此后至少预期两段横盘至下跌走势。测试通道底部，并转为交易区间。","p":"p169"},{"t":"此处多头突破后出现空头突破。观察图表，每根K线。任何图表中几乎所有K线,突破及失败突破或回调旗型。此处正在突破K线，此处出现多头突破，彼处形成空头突破。这是尝试使多头突破失败，最终演变为多头旗型，交易者会在任何阳线，尤其强势阳线高点上方买入，押注趋势恢复上行。他们在该处成交。无人预期首次反转尝试会成功。此处连续6根阳线首次反转尝试通常失败。因此需假设下方存在多头强势突破后形成楔形多头旗型，趋势恢复，多头趋势楔形。多种方法突破时，交易者买入押注趋势恢复上行。此处反转下行，形成空头突破，随后再次突破，可将四根K线整体视为空头突破，你会在此阳线上方买入吗？不会，通道过于紧密属于小幅反转。小幅反转意味多头至多形成交易区间或空头旗型，空头则会判定为空头突破失败，空头突破后出现回调K线高点突破前高形成突破尝试失败，但突破力度远强于失败尝试。因此失败可能演变为空头旗型，交易者会在前根K线低点下方做空。他们在该K线下方设止损单，最终再次成交，失败的空头突破尝试演变为空头旗型。","p":"p170"}]},{"t":"para","text":"此处多头突破后出现空头突破。观察图表，每根K线。任何图表中几乎所有K线,突破及失败突破或回调旗型。此处正在突破K线，此处出现多头突破，彼处形成空头突破。这是尝试使多头突破失败，最终演变为多头旗型，交易者会在任何阳线，尤其强势阳线高点上方买入，押注趋势恢复上行。他们在该处成交。无人预期首次反转尝试会成功。此处连续6根阳线首次反转尝试通常失败。因此需假设下方存在多头强势突破后形成楔形多头旗型，趋势恢复，多头趋势楔形。多种方法突破时，交易者买入押注趋势恢复上行。此处反转下行，形成空头突破，随后再次突破，可将四根K线整体视为空头突破，你会在此阳线上方买入吗？不会，通道过于紧密属于小幅反转。小幅反转意味多头至多形成交易区间或空头旗型，空头则会判定为空头突破失败，空头突破后出现回调K线高点突破前高形成突破尝试失败，但突破力度远强于失败尝试。因此失败可能演变为空头旗型，交易者会在前根K线低点下方做空。他们在该K线下方设止损单，最终再次成交，失败的空头突破尝试演变为空头旗型。","pid":"p170"},{"t":"img","src":"assets/img/u22_096.webp","ilabel":"U22-4","icap":"弱势入场形态与失败的突破","fid":"fig97","ctx":[{"t":"此处多头突破后出现空头突破。观察图表，每根K线。任何图表中几乎所有K线,突破及失败突破或回调旗型。此处正在突破K线，此处出现多头突破，彼处形成空头突破。这是尝试使多头突破失败，最终演变为多头旗型，交易者会在任何阳线，尤其强势阳线高点上方买入，押注趋势恢复上行。他们在该处成交。无人预期首次反转尝试会成功。此处连续6根阳线首次反转尝试通常失败。因此需假设下方存在多头强势突破后形成楔形多头旗型，趋势恢复，多头趋势楔形。多种方法突破时，交易者买入押注趋势恢复上行。此处反转下行，形成空头突破，随后再次突破，可将四根K线整体视为空头突破，你会在此阳线上方买入吗？不会，通道过于紧密属于小幅反转。小幅反转意味多头至多形成交易区间或空头旗型，空头则会判定为空头突破失败，空头突破后出现回调K线高点突破前高形成突破尝试失败，但突破力度远强于失败尝试。因此失败可能演变为空头旗型，交易者会在前根K线低点下方做空。他们在该K线下方设止损单，最终再次成交，失败的空头突破尝试演变为空头旗型。","p":"p170"},{"t":"前文提及突破可能单K线完成，也可能由系列K线构成。任何空头趋势K线都是空头突破，此处三根连续阴线，两根实体巨大，构成三连阴线趋势K线。这就是突破，甚至无需观察左侧走势，这就是突破，如同此处小型多头突破，此属小型多头突破。每根趋势线都是突破，而这是系列大型空头趋势K线，故属强势空头突破。多头正在投降，左侧走势力无关紧要，多头拒绝买入，如果判断错误，他们正在抛售，空头也在同步做空，因此这些是投降K线。出现反转尝试，此K线突破前高开启回调。你认为此反转会逆转整个空头突破吗？我认为反转尝试将失败。空头即将开始抛售，而入场多头将获利了结，换言之，多头也将卖出。弱势反转，非理想买入信号K线，系列十字星尝试突破，但观察跟随走势，三推上行，可称楔形，或低一低二低三形态。可视作50%回调，无论如何多头突破尝试的跟随走势极弱，相较空头突破K线此阳线实体微小，主要是空头在强势突破后部分获利了结。假设空头在此区域做空，现价位已下跌至此，他们不愿承担反弹至此处风险，故减仓控制风险，但终将寻求再次做空机会。","p":"p171"}]},{"t":"para","text":"前文提及突破可能单K线完成，也可能由系列K线构成。任何空头趋势K线都是空头突破，此处三根连续阴线，两根实体巨大，构成三连阴线趋势K线。这就是突破，甚至无需观察左侧走势，这就是突破，如同此处小型多头突破，此属小型多头突破。每根趋势线都是突破，而这是系列大型空头趋势K线，故属强势空头突破。多头正在投降，左侧走势力无关紧要，多头拒绝买入，如果判断错误，他们正在抛售，空头也在同步做空，因此这些是投降K线。出现反转尝试，此K线突破前高开启回调。你认为此反转会逆转整个空头突破吗？我认为反转尝试将失败。空头即将开始抛售，而入场多头将获利了结，换言之，多头也将卖出。弱势反转，非理想买入信号K线，系列十字星尝试突破，但观察跟随走势，三推上行，可称楔形，或低一低二低三形态。可视作50%回调，无论如何多头突破尝试的跟随走势极弱，相较空头突破K线此阳线实体微小，主要是空头在强势突破后部分获利了结。假设空头在此区域做空，现价位已下跌至此，他们不愿承担反弹至此处风险，故减仓控制风险，但终将寻求再次做空机会。","pid":"p171"},{"t":"img","src":"assets/img/u22_097.webp","ilab 线内包于前K线，未出现回调，此低点未跌破前K线低点，我仍试其为回调，横盘式回调，在更小时间图表上价格上涨后实际已回调，若切换至足够小时间框架，可见K线却已跌破前低。当前图表属隐含回调，我将其视为回调或停顿及部分获利了结，因止损未过远。多头尝试减仓。突破力度强劲，后续至少有60%概率实现某种测量移动涨幅。谨记，被套多空双方皆期待回调，他们期望价格跌破前K线低点，期望此K线跌破前低点。多空双方在低位设限价买单，空头寻求减少亏损离场。多头试图逢低买入。但市场未给予机会，后续如何发展？空头无法承受压力，价格持续上涨，被迫不计成本回补空仓，多头则懊悔。必须追高进场，最终多空合力推升，空头再次恐慌性回补，催生第二段上涨。","p":"p174"}]},{"t":"para","text":"多空双方均急切买入。但终将出现停顿或回调，此处形成内包结构，此K线内包于前K线，此K线内包于前K线，未出现回调，此低点未跌破前K线低点，我仍试其为回调，横盘式回调，在更小时间图表上价格上涨后实际已回调，若切换至足够小时间框架，可见K线却已跌破前低。当前图表属隐含回调，我将其视为回调或停顿及部分获利了结，因止损未过远。多头尝试减仓。突破力度强劲，后续至少有60%概率实现某种测量移动涨幅。谨记，被套多空双方皆期待回调，他们期望价格跌破前K线低点，期望此K线跌破前低点。多空双方在低位设限价买单，空头寻求减少亏损离场。多头试图逢低买入。但市场未给予机会，后续如何发展？空头无法承受压力，价格持续上涨，被迫不计成本回补空仓，多头则懊悔。必须追高进场，最终多空合力推升，空头再次恐慌性回补，催生第二段上涨。","pid":"p174"}],"wcount":2405},{"id":"u23","title":"Unit 23　所有突破皆为高潮","icon":"23","sections":[],"blocks":[{"t":"para","text":"Unit 23 所有突破皆为高潮","pid":"p175"},{"t":"img","src":"assets/img/u23_100.webp","ilabel":"U23-1","icap":"所有突破皆为高潮","fid":"fig101","ctx":[{"t":"Unit 23 所有突破皆为高潮","p":"p175"},{"t":"每个突破都是一个高潮，每个趋势K线都是一个突破，每个趋势K线都是一个高潮，有时候会导致趋势停顿，有时它会导致反转。有时他之后会延续趋势。这是欧元兑美元的5分钟图。高潮只是任何上涨或下跌走势的加速，这是行为的极端变化，每个突破一根大实体的K线就是一个高潮，每个趋势K线都是一个高潮，这是一个阳线，它是一个高潮，阳线它是一个双高潮，阴线是一个卖出高潮。显然大多数趋势K线并不会导致强劲趋势，他们是交易区间内的K线，通道内的K线。例如我们来看这张图，绿色买入高潮，买入高潮导致反赚，空头高潮导致的交易区间，空头高潮反转，买入高潮向下反转，买入高潮或确认趋势，空头高潮，卖出高潮变成了一个多头旗型，卖出高潮变成了一个双底多头旗型，买入高潮导致了回调，也许是反转。我这里要说明的是大多数突破高潮都是小幅的，他们要么是交易区间的一部分，要么是通道的一部分，并且大多数之后跟随的是小幅趋势或小幅反转。","p":"p176"}]},{"t":"para","text":"每个突破都是一个高潮，每个趋势K线都是一个突破，每个趋势K线都是一个高潮，有时候会导致趋势停顿，有时它会导致反转。有时他之后会延续趋势。这是欧元兑美元的5分钟图。高潮只是任何上涨或下跌走势的加速，这是行为的极端变化，每个突破一根大实体的K线就是一个高潮，每个趋势K线都是一个高潮，这是一个阳线，它是一个高潮，阳线它是一个双高潮，阴线是一个卖出高潮。显然大多数趋势K线并不会导致强劲趋势，他们是交易区间内的K线，通道内的K线。例如我们来看这张图，绿色买入高潮，买入高潮导致反赚，空头高潮导致的交易区间，空头高潮反转，买入高潮向下反转，买入高潮或确认趋势，空头高潮，卖出高潮变成了一个多头旗型，卖出高潮变成了一个双底多头旗型，买入高潮导致了回调，也许是反转。我这里要说明的是大多数突破高潮都是小幅的，他们要么是交易区间的一部分，要么是通道的一部分，并且大多数之后跟随的是小幅趋势或小幅反转。","pid":"p176"},{"t":"img","src":"assets/img/u23_101.webp","ilabel":"U23-2","icap":"所有突破皆为高潮","fid":"fig102","ctx":[{"t":"每个突破都是一个高潮，每个趋势K线都是一个突破，每个趋势K线都是一个高潮，有时候会导致趋势停顿，有时它会导致反转。有时他之后会延续趋势。这是欧元兑美元的5分钟图。高潮只是任何上涨或下跌走势的加速，这是行为的极端变化，每个突破一根大实体的K线就是一个高潮，每个趋势K线都是一个高潮，这是一个阳线，它是一个高潮，阳线它是一个双高潮，阴线是一个卖出高潮。显然大多数趋势K线并不会导致强劲趋势，他们是交易区间内的K线，通道内的K线。例如我们来看这张图，绿色买入高潮，买入高潮导致反赚，空头高潮导致的交易区间，空头高潮反转，买入高潮向下反转，买入高潮或确认趋势，空头高潮，卖出高潮变成了一个多头旗型，卖出高潮变成了一个双底多头旗型，买入高潮导致了回调，也许是反转。我这里要说明的是大多数突破高潮都是小幅的，他们要么是交易区间的一部分，要么是通道的一部分，并且大多数之后跟随的是小幅趋势或小幅反转。","p":"p176"},{"t":"看这根K线，一根极大的阴线，实体超过K线长度的一半，并且收盘接近其低点。每当出现这样的大突破时，尤其是在趋势持续20根或更多K线之后，交易者就会开始思考这个缺口或是测量缺口，并导致测量移动或者是一个竭尽缺口，这个突破会失败并反转吗？缺口，我说缺口，这个收盘价与前一根K线低点之间的缺口，这个收盘价和这根K线的低点，一个突破点，这个收盘价与左侧所有K线低点之间的缺口，所有这些都是缺口。看看接下来发生什么，我总是关注突破尝试之后的情况。紧接着下一根K线是一根阳线，收盘接近其高点，并且是一根相当大的K线，如果你是空头，希望这根阴线将导致测量移动下跌，那么这是极其糟糕的跟随。一旦你看到这个阳线，很可能这个缺口将被回补，至少是部分缺口。我们这里有多个缺口，到这个低点，到那个低点，到这个低点，到那个低点。最终他回补了所有缺口，所以在那时你可以称此为高潮反转，一个竭尽缺口，而非测量缺口。我这里还有另一个缺口，市场已经上涨了大约15-20根K线，我们有一个多头突破。看待缺口的方式有很多种，不同的计算机交易系统关注不同的缺口，这跟K线的收盘价与第一个突破点，那个突破点，那个突破点的收盘价之间的缺口。这会是一个测量缺口吗？我们会得到一个测量移动上涨吗？也许我们得到一个区间，我们得到了一个突破，也许是测量移动上涨，，或者我们得到一个双顶，这仅仅是第二个上涨推动吗？一回调二，一回调二，然后是一个双顶空头旗型，跌破颈线导致测量移动下跌。在这个特定案例中，市场上涨的幅度大约是基于突破一根K线的开盘价到突破最后一根K线收盘价的测量移动。这个缺口是一段新上涨推动的开始。而这个突破一个双高潮变成了一个测量缺口，这个卖出高潮是一个竭尽缺口，所有缺口都会回补，这个突破变成了一个作为测量缺口的双高潮，它导致了一个测量移动上涨。高潮导致了反转，高潮导致了一个新趋势。","p":"p177"}]},{"t":"para","text":"看这根K线，一根极大的阴线，实体超过K线长度的一半，并且收盘接近其低点。每当出现这样的大突破时，尤其是在趋势持续20根或更多K线之后，交易者就会开始思考这个缺口或是测量缺口，并导致测量移动或者是一个竭尽缺口，这个突破会失败并反转吗？缺口，我说缺口，这个收盘价与前一根K线低点之间的缺口，这个收盘价和这根K线的低点，一个突破点，这个收盘价与左侧所有K线低点之间的缺口，所有这些都是缺口。看看接下来发生什么，我总是关注突破尝试之后的情况。紧接着下一根K线是一根阳线，收盘接近其高点，并且是一根相当大的K线，如果你是空头，希望这根阴线将导致测量移动下跌，那么这是极其糟糕的跟随。一旦你看到这个阳线，很可能这个缺口将被回补，至少是部分缺口。我们这里有多个缺口，到这个低点，到那个低点，到这个低点，到那个低点。最终他回补了所有缺口，所以在那时你可以称此为高潮反转，一个竭尽缺口，而非测量缺口。我这里还有另一个缺口，市场已经上涨了大约15-20根K线，我们有一个多头突破。看待缺口的方式有很多种，不同的计算机交易系统关注不同的缺口，这跟K线的收盘价与第一个突破点，那个突破点，那个突破点的收盘价之间的缺口。这会是一个测量缺口吗？我们会得到一个测量移动上涨吗？也许我们得到一个区间，我们得到了一个突破，也许是测量移动上涨，，或者我们得到一个双顶，这仅仅是第二个上涨推动吗？一回调二，一回调二，然后是一个双顶空头旗型，跌破颈线导致测量移动下跌。在这个特定案例中，市场上涨的幅度大约是基于突破一根K线的开盘价到突破最后一根K线收盘价的测量移动。这个缺口是一段新上涨推动的开始。而这个突破一个双高潮变成了一个测量缺口，这个卖出高潮是一个竭尽缺口，所有缺口都会回补，这个突破变成了一个作为测量缺口的双高潮，它导致了一个测量移动上涨。高潮导致了反转，高潮导致了一个新趋势。","pid":"p177"},{"t":"img","src":"assets/img/u23_102.webp","ilabel":"U23-3","icap":"所有突破皆为高潮","fid":"fig103","ctx":[{"t":"看这根K线，一根极大的阴线，实体超过K线长度的一半，并且收盘接近其低点。每当出现这样的大突破时，尤其是在趋势持续20根或更多K线之后，交易者就会开始思考这个缺口或是测量缺口，并导致测量移动或者是一个竭尽缺口，这个突破会失败并反转吗？缺口，我说缺口，这个收盘价与前一根K线低点之间的缺口，这个收盘价和这根K线的低点，一个突破点，这个收盘价与左侧所有K线低点之间的缺口，所有这些都是缺口。看看接下来发生什么，我总是关注突破尝试之后的情况。紧接着下一根K线是一根阳线，收盘接近其高点，并且是一根相当大的K线，如果你是空头，希望这根阴线将导致测量移动下跌，那么这是极其糟糕的跟随。一旦你看到这个阳线，很可能这个缺口将被回补，至少是部分缺口。我们这里有多个缺口，到这个低点，到那个低点，到这个低点，到那个低点。最终他回补了所有缺口，所以在那时你可以称此为高潮反转，一个竭尽缺口，而非测量缺口。我这里还有另一个缺口，市场已经上涨了大约15-20根K线，我们有一个多头突破。看待缺口的方式有很多种，不同的计算机交易系统关注不同的缺口，这跟K线的收盘价与第一个突破点，那个突破点，那个突破点的收盘价之间的缺口。这会是一个测量缺口吗？我们会得到一个测量移动上涨吗？也许我们得到一个区间，我们得到了一个突破，也许是测量移动上涨，，或者我们得到一个双顶，这仅仅是第二个上涨推动吗？一回调二，一回调二，然后是一个双顶空头旗型，跌破颈线导致测量移动下跌。在这个特定案例中，市场上涨的幅度大约是基于突破一根K线的开盘价到突破最后一根K线收盘价的测量移动。这个缺口是一段新上涨推动的开始。而这个突破一个双高潮变成了一个测量缺口，这个卖出高潮是一个竭尽缺口，所有缺口都会回补，这个突破变成了一个作为测量缺口的双高潮，它导致了一个测量移动上涨。高潮导致了反转，高潮导致了一个新趋势。","p":"p177"},{"t":"这根K线，非常漂亮的阳线收盘于其高点，非常大的阳线实体，并且是最大的K线，也许是20-30根的可能最大了，多头趋势可能从很早这里开始，而不仅仅是从这个更高的低点，主要趋势反转开始，无论如何，这是在其趋势后期出现的最漂亮的阳线。每当你在趋势运行了20根K线或更多K线后出现最漂亮的阳线时，它更可能是一个竭尽缺口，并导致缺口回补，而非新上涨的开始。我也会寻找其他线索，例如他正试图突破一个持续了很长时间，60根K线，70根K线的交易区间的顶部，其次这是突破一个宽通道的顶部。我们这里有两个上推，然后你画出通道顶部，我们正在突破顶部，一般来说多头通道是空头旗型，70%的概率会出现空头突破，70%的概率突破多头通道顶部的多头突破会失败。如果一个交易者将此视为趋势的潜在终点，而非新上涨推动的开始，他应该考虑平掉他的多头仓位，而不是寻求买入，如果他空仓他不该在这里买入，一个专业交易者会说啊，多头通道的多头突破，最漂亮的阳线出现在多头趋势后期，伴随着大量交易区间价格行动，突破区间顶部，这很可能会反转，专业交易者正在寻求卖出。持有多头的交易者应该在那个阴线下方出场，而经验丰富的交易者实际上会考虑做空，押注至少我们会回到通道底部。也许回到双高潮的底部。","p":"p178"}]},{"t":"para","text":"这根K线，非常漂亮的阳线收盘于其高点，非常大的阳线实体，并且是最大的K线，也许是20-30根的可能最大了，多头趋势可能从很早这里开始，而不仅仅是从这个更高的低点，主要趋势反转开始，无论如何，这是在其趋势后期出现的最漂亮的阳线。每当你在趋势运行了20根K线或更多K线后出现最漂亮的阳线时，它更可能是一个竭尽缺口，并导致缺口回补，而非新上涨的开始。我也会寻找其他线索，例如他正试图突破一个持续了很长时间，60根K线，70根K线的交易区间的顶部，其次这是突破一个宽通道的顶部。我们这里有两个上推，然后你画出通道顶部，我们正在突破顶部，一般来说多头通道是空头旗型，70%的概率会出现空头突破，70%的概率突破多头通道顶部的多头突破会失败。如果一个交易者将此视为趋势的潜在终点，而非新上涨推动的开始，他应该考虑平掉他的多头仓位，而不是寻求买入，如果他空仓他不该在这里买入，一个专业交易者会说啊，多头通道的多头突破，最漂亮的阳线出现在多头趋势后期，伴随着大量交易区间价格行动，突破区间顶部，这很可能会反转，专业交易者正在寻求卖出。持有多头的交易者应该在那个阴线下方出场，而经验丰富的交易者实际上会考虑做空，押注至少我们会回到通道底部。也许回到双高潮的底部。","pid":"p178"},{"t":"img","src":"assets/img/u23_103.webp","ilabel":"U23-4","icap":"所有突破皆为高潮","fid":"fig104","ctx":[{"t":"这根K线，非常漂亮的阳线收盘于其高点，非常大的阳线实体，并且是最大的K线，也许是20-30根的可能最大了，多头趋势可能从很早这里开始，而不仅仅是从这个更高的低点，主要趋势反转开始，无论如何，这是在其趋势后期出现的最漂亮的阳线。每当你在趋势运行了20根K线或更多K线后出现最漂亮的阳线时，它更可能是一个竭尽缺口，并导致缺口回补，而非新上涨的开始。我也会寻找其他线索，例如他正试图突破一个持续了很长时间，60根K线，70根K线的交易区间的顶部，其次这是突破一个宽通道的顶部。我们这里有两个上推，然后你画出通道顶部，我们正在突破顶部，一般来说多头通道是空头旗型，70%的概率会出现空头突破，70%的概率突破多头通道顶部的多头突破会失败。如果一个交易者将此视为趋势的潜在终点，而非新上涨推动的开始，他应该考虑平掉他的多头仓位，而不是寻求买入，如果他空仓他不该在这里买入，一个专业交易者会说啊，多头通道的多头突破，最漂亮的阳线出现在多头趋势后期，伴随着大量交易区间价格行动，突破区间顶部，这很可能会反转，专业交易者正在寻求卖出。持有多头的交易者应该在那个阴线下方出场，而经验丰富的交易者实际上会考虑做空，押注至少我们会回到通道底部。也许回到双高潮的底部。","p":"p178"},{"t":"新手可以卖出这个向下反转，我们有一个楔形大量交易区间价格行为，然后我们有一个阴线，我们也有一个微型双顶，阳线，然后在阴线上向下，在阳线上再次向上，然后在这里向下，那么这里发生了什么？你有一些买入收盘的多头，他们买入了这个收盘，然后他在这里看到阴线，他说糟糕，这很不利，我对这种跟随感到失望，那时其中一些多头挂限价单，准备在他们最初买入的那个收盘价附近，盈亏平衡出场。那个小阳线让他们得以出场，空头也看到这一点，他们看到失望的多头，他们知道多头会在接近这个收盘价的位置出场，而这正是导致那个小型空头突破的原因，多头和空头都可以在里面卖出，多头可以平掉多仓，空头可以卖出，预期可能有两段下跌，这是双高潮的底部。想要更高概率就等待连续出现几根阴线，例如如果开始出现2-3根收盘于低点的阴线，也许在第三根K线收盘时卖出，你必须假设这是一个高潮，概率上我们会得10根K线两段式下跌的，我这里大约10根K线，但只有一段下跌。交易者很可能会卖出第一个向上反转。这意味着空头可以卖出向下反转，或者他们可以等待连续三根收盘于低点的阴线，然后在那里卖出。这真的是一个低点或高点的主要趋势反转吗？多头趋势，你可以说这里是一个多头趋势，空头突破，我们回调了8-10根K线，但上涨只有几根K线。这可能是一个小幅反转，但有时小幅反转会导致持续多根K线的有利可图的交易，卖出这个位置预期在买入高潮后出现第二段下跌是可以的。反转发生后，稍晚卖出，概率更高，你开始看到连续出现收盘于低点的阴线，很可能我们将得到两段下跌，但你的止损位更远，你的止损位在这里，上方，在这个收盘价或者这根阳线下方或者微型双顶下方，提前卖出，止损位没那么远，但概率没那么好。一般来说，每当交易者想要更高概率时，他将以更差的风险回报比为代价。交易剩余的利润空间更小，止损位更远，因此风险更大。而选择较早入场的交易者寻求的是更好的风险回报比交易，他们知道这总是伴随着较低的概率，两种交易方式都是可接受的。经验丰富的交易者会考虑在这个收盘价卖出，押注突破失败，也许设置一个止损位，对应一个测量移动上涨幅度，因此从这根K线低点到他们再次入场点的测量移动幅度，止损设在这里或略高于此，他们有信心在止损被击中前有60%的概率会回到这里。他们寻求与风险相等的回报，但有60%盈利概率。","p":"p179"}]},{"t":"para","text":"新手可以卖出这个向下反转，我们有一个楔形大量交易区间价格行为，然后我们有一个阴线，我们也有一个微型双顶，阳线，然后在阴线上向下，在阳线上再次向上，然后在这里向下，那么这里发生了什么？你有一些买入收盘的多头，他们买入了这个收盘，然后他在这里看到阴线，他说糟糕，这很不利，我对这种跟随感到失望，那时其中一些多头挂限价单，准备在他们最初买入的那个收盘价附近，盈亏平衡出场。那个小阳线让他们得以出场，空头也看到这一点，他们看到失望的多头，他们知道多头会在接近这个收盘价的位置出场，而这正是导致那个小型空头突破的原因，多头和空头都可以在里面卖出，多头可以平掉多仓，空头可以卖出，预期可能有两段下跌，这是双高潮的底部。想要更高概率就等待连续出现几根阴线，例如如果开始出现2-3根收盘于低点的阴线，也许在第三根K线收盘时卖出，你必须假设这是一个高潮，概率上我们会得10根K线两段式下跌的，我这里大约10根K线，但只有一段下跌。交易者很可能 fid":"fig107","ctx":[{"t":"Unit 24 第二段走势与第二段走势陷阱","p":"p182"},{"t":"我认为理解第二段走势和第二段走势陷阱很重要，现在就来讲这个。这里有一段上涨走势，然后是一次回调，这就是我们在这里得到第二段上涨走势。当通道如此紧密时，它属于更高时间框架的突破，通常是一段更大两段走势的第一段，是的，我们有两段上涨，一次回调，通道非常紧密，它可能实际上只是第一段上涨，而且它肯定只是更高时间框架图表上的第一段上涨，我会将此视为一个复杂的上涨第一段，任何回调之后都会跟随第二段上涨。而这就是我们看到情况，第一段上涨回调，第二段上涨，通道非常紧密，约十根K线中仅有一根阴线，很可能第一次反转尝试会被买入，然后我们将迎来第二段上涨。","p":"p183"}]},{"t":"para","text":"我认为理解第二段走势和第二段走势陷阱很重要，现在就来讲这个。这里有一段上涨走势，然后是一次回调，这就是我们在这里得到第二段上涨走势。当通道如此紧密时，它属于更高时间框架的突破，通常是一段更大两段走势的第一段，是的，我们有两段上涨，一次回调，通道非常紧密，它可能实际上只是第一段上涨，而且它肯定只是更高时间框架图表上的第一段上涨，我会将此视为一个复杂的上涨第一段，任何回调之后都会跟随第二段上涨。而这就是我们看到情况，第一段上涨回调，第二段上涨，通道非常紧密，约十根K线中仅有一根阴线，很可能第一次反转尝试会被买入，然后我们将迎来第二段上涨。","pid":"p183"},{"t":"img","src":"assets/img/u24_107.webp","ilabel":"U24-2","icap":"第二段走势与第二段走势陷阱","fid":"fig108","ctx":[{"t":"我认为理解第二段走势和第二段走势陷阱很重要，现在就来讲这个。这里有一段上涨走势，然后是一次回调，这就是我们在这里得到第二段上涨走势。当通道如此紧密时，它属于更高时间框架的突破，通常是一段更大两段走势的第一段，是的，我们有两段上涨，一次回调，通道非常紧密，它可能实际上只是第一段上涨，而且它肯定只是更高时间框架图表上的第一段上涨，我会将此视为一个复杂的上涨第一段，任何回调之后都会跟随第二段上涨。而这就是我们看到情况，第一段上涨回调，第二段上涨，通道非常紧密，约十根K线中仅有一根阴线，很可能第一次反转尝试会被买入，然后我们将迎来第二段上涨。","p":"p183"},{"t":"这里存在多头趋势，以及一次深达50%左右回调，高二买入形态，两段下跌，一次回调，两段。交易者会在下跌通道反转时买入，可能是多头旗型的高点或低点，预期趋势恢复上涨。合理通道很可能出现多头突破，这正是我们此处所见。尤其在这个位置，多头和空头都预计价格会走高，他们知道市场至少小幅走高的概率很大，连续三根阳线，这根收盘于最高的，所以比这个更强，而这根实体更大，收盘于最高点，因为我们走高的概率更大。当我说走高概率更大时，指这个多头旗型的多头突破导致价格上涨的概率约为60%，这意味着有40%的几率不会上涨，是否40%的几率出现突破并实现测量移动下跌，可能接近这个概率，因为此处开始出现大量交易区间价格行为。","p":"p184"}]},{"t":"para","text":"这里存在多头趋势，以及一次深达50%左右回调，高二买入形态，两段下跌，一次回调，两段。交易者会在下跌通道反转时买入，可能是多头旗型的高点或低点，预期趋势恢复上涨。合理通道很可能出现多头突破，这正是我们此处所见。尤其在这个位置，多头和空头都预计价格会走高，他们知道市场至少小幅走高的概率很大，连续三根阳线，这根收盘于最高的，所以比这个更强，而这根实体更大，收盘于最高点，因为我们走高的概率更大。当我说走高概率更大时，指这个多头旗型的多头突破导致价格上涨的概率约为60%，这意味着有40%的几率不会上涨，是否40%的几率出现突破并实现测量移动下跌，可能接近这个概率，因为此处开始出现大量交易区间价格行为。","pid":"p184"},{"t":"img","src":"assets/img/u24_108.webp","ilabel":"U24-3","icap":"第二段走势与第二段走势陷阱","fid":"fig109","ctx":[{"t":"这里存在多头趋势，以及一次深达50%左右回调，高二买入形态，两段下跌，一次回调，两段。交易者会在下跌通道反转时买入，可能是多头旗型的高点或低点，预期趋势恢复上涨。合理通道很可能出现多头突破，这正是我们此处所见。尤其在这个位置，多头和空头都预计价格会走高，他们知道市场至少小幅走高的概率很大，连续三根阳线，这根收盘于最高的，所以比这个更强，而这根实体更大，收盘于最高点，因为我们走高的概率更大。当我说走高概率更大时，指这个多头旗型的多头突破导致价格上涨的概率约为60%，这意味着有40%的几率不会上涨，是否40%的几率出现突破并实现测量移动下跌，可能接近这个概率，因为此处开始出现大量交易区间价格行为。","p":"p184"},{"t":"而实际情况正是如此。出现了多头旗型的空头突破，空头试其为双顶空头旗型，颈线测量目标下跌，这是个意外，巨大的阴线，收盘低于这根K线的低点，实际上它收盘低于所有这些K线以及这里大部分K线的低点，这是个意外，根据定义，任何意外事件都属于低概率事件。这是你认为本不该发生的事，然而它确实发生了。我始终关注任何突破后的下一个K线，这里出现强劲的空头突破，但看这根K线是根阳性，这是空头希望看到的，我们跌破了这根K线的低点，在所有K线下方都存在缺口，但跟随走势却如此，总体跟随乏力，略显混乱，许多交易者会希望获取更多信息。更多信息意味着更多K线。","p":"p185"}]},{"t":"para","text":"而实际情况正是如此。出现了多头旗型的空头突破，空头试其为双顶空头旗型，颈线测量目标下跌，这是个意外，巨大的阴线，收盘低于这根K线的低点，实际上它收盘低于所有这些K线以及这里大部分K线的低点，这是个意外，根据定义，任何意外事件都属于低概率事件。这是你认为本不该发生的事，然而它确实发生了。我始终关注任何突破后的下一个K线，这里出现强劲的空头突破，但看这根K线是根阳性，这是空头希望看到的，我们跌破了这根K线的低点，在所有K线下方都存在缺口，但跟随走势却如此，总体跟随乏力，略显混乱，许多交易者会希望获取更多信息。更多信息意味着更多K线。","pid":"p185"},{"t":"img","src":"assets/img/u24_109.webp","ilabel":"U24-4","icap":"第二段走势与第二段走势陷阱","fid":"fig110","ctx":[{"t":"而实际情况正是如此。出现了多头旗型的空头突破，空头试其为双顶空头旗型，颈线测量目标下跌，这是个意外，巨大的阴线，收盘低于这根K线的低点，实际上它收盘低于所有这些K线以及这里大部分K线的低点，这是个意外，根据定义，任何意外事件都属于低概率事件。这是你认为本不该发生的事，然而它确实发生了。我始终关注任何突破后的下一个K线，这里出现强劲的空头突破，但看这根K线是根阳性，这是空头希望看到的，我们跌破了这根K线的低点，在所有K线下方都存在缺口，但跟随走势却如此，总体跟随乏力，略显混乱，许多交易者会希望获取更多信息。更多信息意味着更多K线。","p":"p185"},{"t":"对于空头而言，这是空头突破后的回调，因此是低点，空头旗型在这根线低点下方做空，对多头而言，这是突破失败，他们预期反转回升至高潮高点。他们也在想大涨后大跌，极度混乱，尤其空头突破后紧跟这根阳线，极度混乱，意味着交易区间，两段下跌，一次回调两段，这可能只是发展中交易区间的第二段走势陷阱，诱使空头在底部卖出，诱使多头平掉多头仓位。局面混乱，因此许多交易者会等待更多信息，这意味着更多K线，然后我们看到这个这根K线出现跟随性卖盘，空头主导这根K线实体阴线收盘于最低点，是的，实体虽小，但增加了空头胜算，他还制造了缺口，这根K线高点与所有这些低点之间，这增加了出现第二段下跌的概率。如果你是持仓观望，跟随K线的多头，或是在这根K线上方买入押注突破失败和第二段走势陷阱的多头，你必须做出决定，如果市场跌破这根K线低点，你该怎么办？多数多头会离场，空头会卖出，预期第二段下跌。合理突破，第一根跟随K线疲弱，跟随走势出现的第二根K线，我们制造了这个高点与这些低点之间的缺口，增加的价格至少再下跌一段的概率，因此空口上卖出，低点做空，接着出现微型双顶，又一根阴线，空头会在那根阴线下方卖出。预期至少出现第二段下跌。","p":"p186"}]},{"t":"para","text":"对于空头而言，这是空头突破后的回调，因此是低点，空头旗型在这根线低点下方做空，对多头而言，这是突破失败，他们预期反转回升至高潮高点。他们也在想大涨后大跌，极度混乱，尤其空头突破后紧跟这根阳线，极度混乱，意味着交易区间，两段下跌，一次回调两段，这可能只是发展中交易区间的第二段走势陷阱，诱使空头在底部卖出，诱使多头平掉多头仓位。局面混乱，因此许多交易者会等待更多信息，这意味着更多K线，然后我们看到这个这根K线出现跟随性卖盘，空头主导这根K线实体阴线收盘于最低点，是的，实体虽小，但增加了空头胜算，他还制造了缺口，这根K线高点与所有这些低点之间，这增加了出现第二段下跌的概率。如果你是持仓观望，跟随K线的多头，或是在这根K线上方买入押注突破失败和第二段走势陷阱的多头，你必须做出决定，如果市场跌破这根K线低点，你该怎么办？多数多头会离场，空头会卖出，预期第二段下跌。合理突破，第一根跟随K线疲弱，跟随走势出现的第二根K线，我们制造了这个高点与这些低点之间的缺口，增加的价格至少再下跌一段的概率，因此空口上卖出，低点做空，接着出现微型双顶，又一根阴线，空头会在那根阴线下方卖出。预期至少出现第二段下跌。","pid":"p186"},{"t":"img","src":"assets/img/u24_110.webp","ilabel":"U24-5","icap":"第二段走势与第二段走势陷阱","fid":"fig111","ctx":[{"t":"对于空头而言，这是空头突破后的回调，因此是低点，空头旗型在这根线低点下方做空，对多头而言，这是突破失败，他们预期反转回升至高潮高点。他们也在想大涨后大跌，极度混乱，尤其空头突破后紧跟这根阳线，极度混乱，意味着交易区间，两段下跌，一次回调两段，这可能只是发展中交易区间的第二段走势陷阱，诱使空头在底部卖出，诱使多头平掉多头仓位。局面混乱，因此许多交易者会等待更多信息，这意味着更多K线，然后我们看到这个这根K线出现跟随性卖盘，空头主导这根K线实体阴线收盘于最低点，是的，实体虽小，但增加了空头胜算，他还制造了缺口，这根K线高点与所有这些低点之间，这增加了出现第二段下跌的概率。如果你是持仓观望，跟随K线的多头，或是在这根K线上方买入押注突破失败和第二段走势陷阱的多头，你必须做出决定，如果市场跌破这根K线低点，你该怎么办？多数多头会离场，空头会卖出，预期第二段下跌。合理突破，第一根跟随K线疲弱，跟随走势出现的第二根K线，我们制造了这个高点与这些低点之间的缺口，增加的价格至少再下跌一段的概率，因此空口上卖出，低点做空，接着出现微型双顶，又一根阴线，空头会在那根阴线下方卖出。预期至少出现第二段下跌。","p":"p186"},{"t":"这里再次展示欧元兑美元的5分钟图。整个图表呈现交易区间，我们经历下跌波段，上涨波段小幅回落后，强势拉升，回调极深。这是交易区间，且只要市场处于交易区间，任何方向上涨或下跌的第二段走势往往非常强劲。此时虽不在区间内，但我们仍看到极强的第二段走势，这段走势包含连续阴线，更大阴线，更少十字星，处于强劲的第二段下跌。然而他却导致反转，然而请看这里，一段上涨回调，第二段上涨强劲，多头突破K线，强势跟随K线，却再次遭遇反转，此时市场处于交易区间，大跌后大涨，进而进一步下跌。现在我们正试图突破进入趋势，当出现大量交易区间价格行为后发生突破，尤其是强劲突破时，你必须意识到这可能只是陷阱，诱使新手在过高位置买入，同时逼空头离场。因此许多分批建仓的空头，在这根K线上方卖出，在那根K线上方卖出，在这根K线上方卖出，将会放弃，这也是这两根K线，如此形态的部分原因，这是空头回补空单，至少是弱势空头。多头和空头都在买入，空头正在止损回补空单，多头正在买入，期待测量移动上涨，可能形成头肩底，左肩，头部，右肩，随后突破颈线，实现测量移动上涨。但当你看到异常强劲的第二段上涨，且市场存在大量交易区间价格行为时，必须意识到这可能是陷阱。而这里这根K线完全逆转的那根K线。","p":"p187"}]},{"t":"para","text":"这里再次展示欧元兑美元的5分钟图。整个图表呈现交易区间，我们经历下跌波段，上涨波段小幅回落后，强势拉升，回调极深。这是交易区间，且只要市场处于交易区间，任何方向上涨或下跌的第二段走势往往非常强劲。此时虽不在区间内，但我们仍看到极强的第二段走势，这段走势包含连续阴线，更大阴线，更少十字星，处于强劲的第二段下跌。然而他却导致反转，然而请看这里，一段上涨回调，第二段上涨强劲，多头突破K线，强势跟随K线，却再次遭遇反转，此时市场处于交易区间，大跌后大涨，进而进一步下跌。现在我们正试图突破进入趋势，当出现大量交易区间价格行为后发生突破，尤其是强劲突破时，你必须意识到这可能只是陷阱，诱使新手在过高位置买入，同时逼空头离场。因此许多分批建仓的空头，在这根K线上方卖出，在那根K线上方卖出，在这根K线上方卖出，将会放弃，这也是这两根K线，如此形态的部分原因，这是空头回补空单，至少是弱势空头。多头和空头都在买入，空头正在止损回补空单，多头正在买入，期待测量移动上涨，可能形成头肩底，左肩，头部，右肩，随后突破颈线，实现测量移动上涨。但当你看到异常强劲的第二段上涨，且市场存在大量交易区间价格行为时，必须意识到这可能是陷阱。而这里这根K线完全逆转的那根K线。","pid":"p187"},{"t":"img","src":"assets/img/u24_111.webp","ilabel":"U24-6","icap":"第二段走势与第二段走势陷阱","fid":"fi 件充分，任何原因再次做多的多头都会在其低点下方止损。突破模式意味着多空概率基本持平，再次买入的多头可能在双底下方止损，在此阴线下方做空的空头会在双顶顶部上方止损。如果你是强势多头，请思考，你将在该阴线下方离场，但部分机构多头可能故意制造此类阴线，诱使交易者在收盘时离场。离场点在其低点下方，若出现如此明显的卖出形态，却未触发说明什么？说明空头没有极佳的卖出机会，熊旗一个良好的卖出信号K线，若未能触发，则证明多头极为强势。我认为有时机构多头刻意制造此类卖出信号K线试图诱骗空头，在K线收盘时而非低点下方做空。","p":"p191"}]},{"t":"para","text":"我想谈谈强势多头和强势空头，让我们回到这张图表，这里有一个熊旗，一段下跌趋势，另一个熊旗以及双顶熊旗或三角形形态123，这里还有一个三角形形态正在形成123，一个小型双底，处于突破模式，向下突破的概率是50%，向上突破的概率也是50%，多头认为这是更高的低点，与此前上涨趋势的底部相比，而空头试其为下跌通道中的熊旗形态，多空双方胜率大致相当。空头希望突破小型交易区间，三角形下沿，并跌破整个交易区间，随后走出测量下跌。多头明白，多数突破尝试会失败。他们预期即便熊旗向下突破，也可能在反转上涨前难以深跌。许多多头会在该阴线下方离场，我认为这根阴线实体足够大，且背景条件充分，任何原因再次做多的多头都会在其低点下方止损。突破模式意味着多空概率基本持平，再次买入的多头可能在双底下方止损，在此阴线下方做空的空头会在双顶顶部上方止损。如果你是强势多头，请思考，你将在该阴线下方离场，但部分机构多头可能故意制造此类阴线，诱使交易者在收盘时离场。离场点在其低点下方，若出现如此明显的卖出形态，却未触发说明什么？说明空头没有极佳的卖出机会，熊旗一个良好的卖出信号K线，若未能触发，则证明多头极为强势。我认为有时机构多头刻意制造此类卖出信号K线试图诱骗空头，在K线收盘时而非低点下方做空。","pid":"p191"},{"t":"img","src":"assets/img/u25_114.webp","ilabel":"U25-2","icap":"强势的多头与空头","fid":"fig115","ctx":[{"t":"我想谈谈强势多头和强势空头，让我们回到这张图表，这里有一个熊旗，一段下跌趋势，另一个熊旗以及双顶熊旗或三角形形态123，这里还有一个三角形形态正在形成123，一个小型双底，处于突破模式，向下突破的概率是50%，向上突破的概率也是50%，多头认为这是更高的低点，与此前上涨趋势的底部相比，而空头试其为下跌通道中的熊旗形态，多空双方胜率大致相当。空头希望突破小型交易区间，三角形下沿，并跌破整个交易区间，随后走出测量下跌。多头明白，多数突破尝试会失败。他们预期即便熊旗向下突破，也可能在反转上涨前难以深跌。许多多头会在该阴线下方离场，我认为这根阴线实体足够大，且背景条件充分，任何原因再次做多的多头都会在其低点下方止损。突破模式意味着多空概率基本持平，再次买入的多头可能在双底下方止损，在此阴线下方做空的空头会在双顶顶部上方止损。如果你是强势多头，请思考，你将在该阴线下方离场，但部分机构多头可能故意制造此类阴线，诱使交易者在收盘时离场。离场点在其低点下方，若出现如此明显的卖出形态，却未触发说明什么？说明空头没有极佳的卖出机会，熊旗一个良好的卖出信号K线，若未能触发，则证明多头极为强势。我认为有时机构多头刻意制造此类卖出信号K线试图诱骗空头，在K线收盘时而非低点下方做空。","p":"p191"},{"t":"他们正在测试空头的决心，试图恐吓多头离场，并驱赶交易者做空。但结果显而易见，下一根K线是阳线，空头开仓从未触发，如今价格突破双顶顶部空头未能成功开仓。因此在此阴线期间，做空的空头被迫回补买入而被套。随后出现强劲的向上突破。穿越熊旗顶部突破模式确立后，交易者预期测量上涨，双顶颈线存在，测量移动目标可基于此处或熊旗整体底部计算。那些在此低位买入的多头，若价格跌破该阴线，他们本将离场。但市场未跌破阴线低点这些多头持仓，并在测量目标附近获利了结，制定计划至关重要，在此买入的多头见到大阴线时会警觉。若跌破该阴线，我将离场，但价格未跌破阴线低点。因此至少强势多头明智多头为立场，他们坚守仓位并达成目标，而试图在阴线下方做空的空头未能成交，价格被跌破在阴线低点，此处空头本有良好机会，熊旗下跌趋势，熊旗形态配合完美的卖出信号K线，然而空头未能触发做空，市场反而反转向上。这彰显多头强势，空头疲弱。","p":"p192"}]},{"t":"para","text":"他们正在测试空头的决心，试图恐吓多头离场，并驱赶交易者做空。但结果显而易见，下一根K线是阳线，空头开仓从未触发，如今价格突破双顶顶部
