<script>
const DATA = [{"icon": "序", "title": "序幕", "paras": ["「我想告诉你一个故事。」", "迦勒的大脸若隐若现的在餐桌上晃动。几缕蒸气从它下方一空一满的两个拉面碗冉冉上升，与他露出白牙的笑容共舞。我一点仪态也没有的瘫在椅子上。从我的视角，一双插在我碗里的筷子看似几乎要戳入他的下巴。他的笑容愈发灿烂。", "「我曾经认识一位非常优秀的交易员，非常、非常厉害。他在德意志银行上班。很聪明、很年轻。就像你一样。」", "迦勒粗壮的前臂圈住他面前温暖的空碗，用力将它往桌面挤压。他的双手离我的脸不远，紧紧交握在一起。我至今仍然记得那些手指的样子：粉红色，又粗又圆，像尚未煮熟的香肠。看起来仿佛下一秒就会爆开。", "「你知道的，这家伙是个非常棒的交易员。赚了很多钱。不只为自己赚了很多钱，也为德意志银行赚了很多钱。他的职业生涯本来应该十分光明。」", "我们四周围充斥餐厅的喧嚣。这里不是那种存在于日本大城市后巷质朴简陋的拉面店，而是一家位在巨型企业摩天大楼六楼的大型商业餐厅。拉松领带的男人举著啤酒和他们的老板干杯，并在老板讲笑话时适时捧场大笑。几个美国银行家夹杂在日本上班族里高谈阔论，不仅话太多，声音也太大。我一言不发，看著那张巨大的脸穿过黑暗，穿过桌子，向我逼近。", "「可是你知道吗？这家伙，这个年轻的交易员。即使他很优秀，但他有一个非常严重的问题。你甚至可以说他有一个致命的缺点……你知道吗？这家伙，他以为他想走就可以走。他以为他可以离开。你懂我的意思吗？」", "迦勒身材高大。我前面形容那么多，可能已经将这点说得很清楚，但他的「大」不仅呈现在脸和手指，而是身上所有的一切似乎都比应有的尺寸大两倍。他的眉毛很大，下巴很大。不知道为什么，连头上的头发都显得太大、太黑、太浓密。更重要的是，他的笑容太过灿烂，嘴咧得太开，两排巨大的白牙闪烁著珍珠般的光芒。我觉得他的嘴咧得几乎比他的脸还宽，仿佛《爱丽丝梦游仙境》里的妙妙猫出现在周二晚上的拉面店，以过大的微笑照亮整个阴暗的餐厅。", "「所以这家伙，决定拿了钱就走。离开这个行业，你知道，想得挺好的。找个地方安定下来，结婚生子，组织小家庭。很美好。嗯，问题是，这家伙根本不了解这行业的运作规则。德意志银行可不想见到他离开。你懂吧？」", "不需天才也能看得出来他说这些话的意思。我感觉自己的胃开始下沉，身体愈来愈不舒服，嘴里突然尝到或闻到什么不寻常的味道。是血吗？我深埋在椅子里，睁大眼睛看他。迦勒仍然在微笑，而且笑容似乎一瞬间变得更大。", "「嗯，德意志银行回头查看他所有的交易，你想像得到吗？他的每一则聊天记录、每一封电子邮件。他在那里工作过很长的时间，你知道的，做过很多很多交易。他们设法在里头找到一些不是太完美的东西。你知道我在说什么吧？就是一些理论上他不应该做的事。」", "我开始感觉仿佛有一把火在我的双腿内部燃烧。在我的脚上。一种灼热的、逐渐扩大的、发痒的感觉。一种刺痛感，但我维持原来的姿势，文风不动。", "「所以，你知道的，这么做当然不对，可是德意志银行真的拿了其中几件当证据，将年轻交易员告上法院。老实说，他并没有做过什么十恶不赦的坏事，可是银行想方设法罗织一些似是而非的罪名到他身上。案子在法院来来回回审理很多年。你知道我的意思吧？审判、宣判，上诉、驳回。完全是一场恶梦。于是，这个交易员，优秀的年轻交易员，从来没有得到真正离开的机会，从来没有得到组织梦想小家庭的机会，得到的只是不断进出法院的折磨。在他一生中本该是最美好的年纪。你能想像吗？盖瑞？你能想像吗？案子虽然最终没有成立，可是他依旧失去所有的钱，因为全付给了律师。他损失全部的钱，甚至还欠债。最后，他破产了。到头来，这家伙失去一切。」", "现在那把火已经蔓延至我的全身，想吐的感觉和血腥味也愈发强烈。然而，我依旧动也不动，只是抬头看他的脸。", "「盖瑞，我说的你听到了吗？你明白我说这么多，想表达什么吧？」", "那张大圆脸朝我的方向逼近。", "「盖瑞。我喜欢你。我认为你是一个好人。可惜有时候，坏事同样会发生在好人身上。你很快就会学到这个教训。我们可以让你的生活变得异常艰难。」", "刹那间，许多回忆涌上心头，带著我飞越万里，离开东京，回到东伦敦的伊尔福德（Ilford）。十八岁的我，在铁路旁的死巷里，坐在一颗足球上，听哈利告诉我，他妈妈得了癌症，当时的我不知该如何回应，只好问他：「你现在想踢足球吗？」我记得在一个漆黑的夜里，我站靠在小巷的墙上，看著正威胁要捅我一刀的萨拉万；他的两只手都插在口袋里，他真的有刀吗？我不知道。我记得我在排屋＊的街道上被追著跑，跳过一排又一排的花园栅栏，布拉塔普就是在那一次被车碾过，他受重伤的身体躺在地上不停抽搐。我记得发生过的所有愚蠢暴力、血腥事件，以及邻居孩子们的满嘴胡说八道，还有我做过的每个承诺，以及我认识的所有人。我记得和杰米夜里坐在多层停车场的屋顶上，看著我们城市新建的摩天大楼在周围愈盖愈高。我告诉他，总有一天我会成为举足轻重的人物；我向他保证，我会做到。他嘲笑我，在月光下吸了一口烟。可是他知道我会成功的。我也是。", "不，我心想。事情不会在这里结束。", "我不会让它在这家冰冷的餐厅里结束。我不会任由迦勒脸上微笑的重量将我就地掩埋。", "＊译注：住宅的一种样式，由多幢相连的双层或多层房屋所组成，这些一排排相邻的房屋会共用同一堵墙。⤴"], "wcount": 2112}, {"icon": "1", "title": "第1章 登上金融交易的舞台", "paras": ["小节 1", "从许多方面来说，我天生就应该是交易员。", "我长大的那条街尽头是一排高大的回收子母车组成的凹墙。它和一盏路灯、一根电线杆彼此相距四公尺，形成一组完美的即兴球门柱。", "如果你站在两根柱子之间，往后退十大步，抬头凝望它们的正上方，金丝雀码头＊最高的摩天大楼的灯光会从远处透过那堵高墙，对著你眨眼。", "小时候，我会在放学之后，穿著破烂的校鞋和我哥哥的旧校服，在漫长的傍晚绕著球门柱，里里外外、一趟又一趟的踢著破旧的软式安全足球。妈妈来叫我回家吃饭时，我总会习惯性的回头望著那栋对我眨眼的摩天大楼。它在我眼中是一种全新生活的象征。", "我和那些闪烁金光、高耸的资本主义寺庙共享的，可不只是东伦敦的街道，还有其他东西，某种共同的信念。关于钱的信念。关于渴望的信念。", "金钱的重要性，以及我家并不富裕的认知，从小就深深的刻在我的骨头里。我最早的记忆之一是爸妈给我一枚一英镑硬币，叫我去埃索加油站买柠檬汁。在路上，我弄丢那枚硬币，它不见了。我还记得为了那枚一英镑硬币找了好久好久，甚至钻进汽车底下爬行，在排水沟里乱挖，感觉我找了好几个小时才放弃，两手空空的回家，泪流满面。虽然事实上我大概只找了三十分钟。不过我想，当你还是个孩子时，三十分钟是一段很长的时间，而一英镑则是很多很多钱。", "我不知道我是否真的失去过对金钱的热爱。虽然，现在回想起来，我不确定是不是应该用「爱」这个字。也许，尤其当我还是小孩子，我觉得它更可能是一种恐惧。无论我对钱抱持的是恐惧、热爱或渴望，随著我长大，那种情绪也就愈来愈强烈，驱使我不停的去追逐那些我从未拥有过的英磅。十二岁，我开始在学校卖廉价糖果给同学；十三岁，我开始一年三百六十四天的派送报纸，赚取每周十三英镑的工资；到了十六岁，我在高中的销售业务变得更激进、更有利可图，却也更不正当。但这些小打小闹从来都不是我的真正目标。每天晚上，太阳下山后，我总会抬头凝望那些在街道尽头对我眨眼的摩天大楼。", "然而，从现实面来说，我并非天生就会成为交易员。因为这些背景，不管过去或现在，对个人成就而言都非常重要。", "因为在东伦敦摩天大楼的阴影中，在路灯柱和汽车周围踢著破旧足球，满怀渴望、野心勃勃的年轻男孩很多、很多。他们之中许多人都很聪明，许多人都意志坚定，几乎每个人都愿意牺牲一切，只为了能够系上领带、戴上袖扣，走进那些高大、闪亮的金钱巨塔。可是在走进闪亮摩天大楼的交易大厅、每年赚取数百万英镑之后仍以东伦敦港区人自居的年轻人，却再也听不到来自米尔沃尔区和堡区、斯特普尼区和麦尔安德区、沙德韦尔区和波普拉区的熟悉口音。我知道，因为我曾经在其中一个交易大厅工作过。曾经有人对我的口音感到好奇，问我是哪里来的，而他才刚从牛津大学毕业。", "金丝雀码头的花旗银行大楼共有四十二层。在我进入花旗的二○○六年，它是英国并列第二高的建筑。二○○七年的某一天，我决定登上大楼楼顶看看风景如何，顺便看看能否从那里看到我的家。", "花旗银行中心顶楼仅供会议和活动使用。换句话说，当没人用它时，整层楼都是空的。铺满松软细致蓝色地毯的地板，宛如一个辽阔而连绵的国度，四周则是厚厚的落地玻璃圈成的围墙。我无声的走过地毯，来到窗前，却发现我无法看到我的家。从花旗银行中心的四十二楼看不到东伦敦，只能看到汇丰银行大楼的四十二楼。东伦敦野心勃勃的孩子们仰望在他们房屋上投下巨大阴影的摩天大楼，可是摩天大楼却不会看向他们。它们只会互相看著彼此。", "这是我如何从在摩天大楼阴影下踢足球、在学校卖糖果的所有孩子里脱颖而出，在花旗银行交易大厅找到一份工作的故事。这是一个关于我如何成为花旗银行全球最赚钱的交易员的故事。这也是一个关于我为什么在经历这一切之后，选择离开的故事。", "在那些年，全球经济开始从悬崖上滑落。不幸的是，直到今天它仍在继续的往下掉。有时候，我的理智也随之下滑。直到今日，有时依然如此。天知道，我当初并没有做到对每个人都问心无愧。哈利、巫师、ＪＢ、我自己，以及所有我没在书上写出名字的人。我希望你们能原谅我将你们的故事说出来，因为它们也是我故事里不可或缺的一部分，你们懂的，对吧？", "我要将这个故事献给安尼诗的祖父。在我们还是喝得醉醺醺的青少年时，他是一个喝得更醉醺醺的老人，只会没完没了、口齿不清的向我们重复他唯一熟悉的英文句子。", "「生活就是生活，游戏就是游戏。」", "我们从来没有真正弄懂那是什么意思。我仍旧希望将来有一天我们能够明白。", "小节 2", "我进入交易大厅的道路始於伦敦政经学院。", "伦敦政经学院并不是一所寻常大学。由于没有绿树成荫的宏伟校园，大学建筑物将自己伪装成一群普通办公室，偷偷藏身在伦敦西区的小巷里。", "即使学校环境相对不起眼，全球精英仍以惊人的热情想尽办法将他们的孩子塞进这里。似乎没有一个俄罗斯大老、巴基斯坦空军指挥官或中国政治局委员，会拒绝将胸怀大志的儿子、女儿、侄子或侄女送到伦敦市中心这个不起眼的角落去研究几年联立方程式的机会，也许毕业后还会让他们留在高盛或勤业众信工作几年，再飞回去接管祖国的一切。", "我在二○○五年进入大学主修数学和经济时，并不是伦敦政经学院的典型新生。我在三年前因出售价值三英镑的大麻，被明星高中开除。在那之前，我曾试著创办一个车库饶舌乐团；我甚至特别订制一件连帽衫，正面印著「饶舌歌手盖瑞」，背面印著极有设计感的「惨白组员」几个大字。我第一天上课时穿著犀牛牌运动服，搭配蓝白相间的连帽衫和慢跑裤。白色连帽衫正面印了一头很大的深蓝色犀牛。在去上学前，我对这所大学其实并不怎么了解，不过有个高中同学告诉过我，伦敦政经学院的学位是通往高薪金融工作的单程票。对我来说，这个理由已经足够。", "我无法融入大家似乎是很理所当然的事。就像是俄罗斯大老不在伊斯兰教徒开的炸鸡店吃饭，新加坡人听不懂我的口音。为了省钱，我依旧和父母住在大学东边十英里的伊尔福德。我才刚交到人生第一个真正的女朋友。她同样来自伊尔福德。我将大一的大部分时间花在和她一起坐在公园的长椅上喝酒，以及在我妈妈下班回家时，陪她从我卧室的窗户偷偷爬出去，越过铁轨闲晃；只有在上课和听讲座时我才会出现在校园里。", "尽管如此，我还是下定决心要在伦敦政经学院取得好成绩。我没有任何可以攀附的家庭关系，对金融城也不了解。我个子不高，也不帅，既没有合身的西装，也没有圆滑的社交技巧。我的履历表上最令人印象深刻的课外活动其实极为普通，不过是当了一阵子的车库饶舌歌手，以及在贝克顿区的ＤＦＳ品牌沙发店拍松了两年的靠枕。然而，数学对我来说却一直是易如反掌的科目，所以在我看来，进入伦敦金融城只有一条路，我必须打败所有阿拉伯亿万富翁和中国企业家，以优异的成绩拿到学位，然后向上帝祈祷高盛会注意到我。", "我实现目标的计划相当简单：每次听讲座和上课都坐在第一排，确保我听懂每位教授和老师所说的每句话。", "策略奏效。我以极优异的成绩拿到大一系排名的前几名。如果要我老实讲，我要说做到这点完全不难。当时我在放暑假前，仍觉得自己的计划很有可能成功。", "可是当我回到伦敦政经学院展开大二生活时，却注意到情况发生明显的变化。", "第一，毫无前兆且看似无缘无故的，几乎每个大二学生突然间全变成认真学习的新进银行家。我并不是说所有人真的都在金丝雀码头或伦敦金融城的闪亮摩天大楼里找到工作，但完全出乎意料的，至少出乎我的意料，每个人都开始表现得仿佛他们已经进入某家银行。大家开始参加每周三、每周五由金融协会（Finance Society）举办的活动，以及每周一由投资协会（Investment Society）举办的社交聚会。他们在说话时开始使用几乎全由三个字母组成的缩写──ＡＢＳ（资产抵押债券）、ＩＢＤ（投资银行部门）、ＣＤＳ（信用违约交换）、ＣＤＯ（担保债务凭证）、Ｍ＆Ａ（合并与收购）──并高谈「销售交易部」和「证券化」。出于某种莫名其妙的原因，许多人开始穿全套西装来上课。谣言四起，到处都有人在讨论那些身材高大、胸肌发达、发型精美、穿著得体、国籍不明且显然很富有的学生，已经在高盛、德意志银行、摩根大通或雷曼兄弟拿到极佳的实习机会。甚至有传言指出，其中一些人已经找到全职工作。", "所有学生都开始申请实习。不只向一家、两家公司申请，而是向十五至二十家投履历，有的人甚至投更多。模拟面试题目开始在学生社团中流传，据称是某位主修统计或国际关系的神秘学长之前的真实经历。人们普遍相信，面试候选人很可能被问到维吉尼亚州有多少人秃头。据说曾有一名学生必须在五秒内回答出四十九乘以四十九是多少，每个学生当然都认真的将二四○一这个答案牢牢记在脑子里。校园里出乎意料的区域开始出现莫名其妙的自发性排队长龙。通常你若询问为什么在排队，人龙中大多数的学生都不确定。但是也许，最终会有人因此得到实习的机会，也许会有和银行从业人员交流的机会。我还看过一群二十名左右的学生拿著笔电，聚集在图书馆的电脑周围，大喊各种数字和字母，他们在参加摩根史坦利举办的线上算数能力团体竞赛。", "我完全不知道该如何应对身边同学在求学态度、行事方法和优先事项上的彻底转变。许多人再也不参加讲座，以便能将时间和精力更充分的投入拓展人际关系，寻找求职机会，以及学习金融世界的用语和专业名词的缩写。我开始明白迄今为止看似成功的策略，也就是单纯的参加讲座和课程，充分理解教材内容，这些是如此的贫乏和天真。", "我满心困惑，不得不向大一结识的少数好友之一求救。高大英俊的马蒂兹是我在数学系的同学。他虽是斯洛维尼亚人，却在英国长大。虽然马蒂兹并没有像其他许多学生那样穿著「全套正式西装」上学，但他的穿著风格却明显变得更为干练时尚。他是金融协会成员。他说话时会用缩写。他提出实习申请。他去过好几个面试。他参加不少活动。", "我问马蒂兹，这个夏天究竟发生什么事，使得全年级的学生产生如此翻天覆地的变化。", "「盖瑞，你这么问是什么意思？你不知道吗？大二是实习年！」", "现在让我来解释一下它的运作规则。或者，至少，当时马蒂兹是这样告诉我的。", "在伦敦政经学院念书的每个人都想为高盛工作，或德意志银行，或摩根史坦利，或摩根大通，或瑞银集团。不仅是伦敦政经学院的每个人，还有帝国理工学院的每个人，还有沃里克大学的每个人。当然，诺丁汉、达勒姆和巴斯的每个人也这么想。还有曼彻斯特和伯明翰的人自然也这么想，只不过他们一点机会都没有，嗯，除非他们认识业内人士，有后门可以走。牛津大学和剑桥大学的人如果没有富裕到永远不必工作，自然也想在这些地方上班。", "问题是，没有足够的职位提供给所有的人。事实上，僧多粥少。不仅如此，也不是每份工作都一样。最好的职位在「销售交易部」，它不但工作时间最佳（每天只需工作十二个小时，周末还可以休息），而且只要你够优秀，也能在最短的时间内赚到大钱。如果没进销售交易部，就一定要进「投资银行部」或「合并与收购部」，每周工作一百小时，直到你觉得自己会过劳死，可是仍然还在加班。如果你挤不进这些部门，你就只能去「顾问部」。", "我根本不知道顾问是干什么的。依马蒂兹说到这个词的语调判断，可能和打扫厕所差不多？", "除非你有私人关系，否则没有实习过，就找不到工作。得到实习的唯一时机，就是现在。如果你在大二结束时，还没有得到实习机会，你一定要在大三结束前找到一个。实习结束后，约有五成的实习生会得到十二个月后入职的正式工作邀约，所以如果你在大三结束时＊才开始实习，你将面临毕业后失业一整年的窘境。不过说实在的，这只是理论，因为没有一家投资银行会雇用大三结束时才开始的实习生──他们心知肚明，你显然在大二时被所有银行拒绝，没有一家银行会想要被其他同业拒绝的实习生。", "他继续说：「就是这样。不成功便成仁，情况可说是孤注一掷。你的未来会在这一年被决定。忘记你的『数学和经济学』。你需要知道的是什么叫做『信用违约交换』？什么是『合并与收购』？什么是『投资银行部门』？你怎么不知道呢？盖瑞？每个人都知道啊！而且你需要向各家银行提交申请。每个实习机会都有成千上万的申请者在争夺，加上你又没有任何用得上的私人关系。你得到实习机会的唯一可能，是至少向三十家银行提出申请，然后希望至少可以拿到其中一个。你到目前为止申请几家？什么？一家都没有!?」", "我给他的答案是零家。听完他的话，我更徬徨了。", "数学，我很擅长；经济学，也难不倒我。但在这个充满缩写的新世界里，我什么都不会。高中老师告诉我「努力学习，考试取得好成绩，你就会找到好工作」时，我相信了。我真是个白痴。我简直傻得无可救药。", "马蒂兹虽然有点激进，却是个善良的好人。他很同情我。他带我参加一场金融协会举行的演讲，主题为「如何在投资银行找到工作」。", "这场活动选在伦敦政经学院一个较为宏伟明亮的古老演讲厅举行，参加人数众多。主讲人是一位前投资银行家，他看起来仿佛才从描述华尔街故事的好莱坞电影中走出来。一身细条纹西装，后梳的油头，高大强壮。", "在我看来，这场演讲就是一场以努力工作为主题的意识流独白，每句话的单字和缩写都让我觉得似曾相识，却还是听不懂其中含意，仿佛他说的不是英文，而是某种我在高中学过，却只懂一点皮毛的第二外国语。主讲人在舞台上不停的走来走去，速度很快，说话起伏很大，强度高到令人难以置信。我从他那里得到的讯息简单且直白：阅读所有书籍，了解所有缩写词及其含义，和每个人建立关系，向每家银行提出申请，拚命工作，不要浪费时间睡觉。我不确定我是否误解了他想向群众传达的意思。演讲结束后，我带著万分沮丧的心情离开会场。", "我让马蒂兹失望了，事实上，就某种程度而言，我也让自己失望了。我决定放弃实习申请。我做不到。我一直不擅长记忆缩写，我的灵魂负担不起它的重量。况且申请流程的第一阶段是履历表和自我推荐信，这是除了我以外的其他同学，大概从四岁就开始为此做准备。他们似乎都曾横越撒哈拉沙漠，或在学生联合国担任要职，或在皇家亚伯特音乐厅吹奏过双簧管，做的全是这类轰轰烈烈的大事。我的履历则包括送了六年的报纸、当了一年没没无闻的车库饶舌歌手、在贝克顿污水处理厂旁的沙发店拍了两年靠枕。何必呢？不过是自取其辱。", "后来拯救我的，是我在大学里遇上的第二个转机，有趣的是，它和第一个一样，发生的无缘无故且看似毫无前兆。在大二学期开始之后，突然间，每个人都知道我是谁。我这辈子从没见过的学生，甚至有几个穿西装来上课的家伙，会在图书馆走到我身边，开始和我交谈。有一次，一个中国学生在走廊上拦下我，一言不发的以愤怒的眼光上下打量我；十秒钟后，什么也没说，转头就走。还有一次，一位身材高䠷、口音不明、发型超酷的欧洲女孩主动来找我，说要和我一起念书。我想不明白为什么会发生这些事。", "我满心困惑的向我的朋友兼同学萨加尔．马尔德请教。萨加尔是肯亚印第安裔，身材高大魁梧，说起英文带著美妙的花腔口音，他的父亲是整个东非的肥皂业霸主。", "「他们当然都认识你！」萨加尔大喊，好像这是非常显而易见的事。「他们都知道你的考试成绩有多好。」", "这个答案并没有完全解开我的困惑。我的成绩确实很好，但据我所知，它们并未被公开，而且离全校第一名还很远。像是说这句话的萨加尔本人，成绩就比我好很多。", "「当然，盖瑞。」我把想法告诉他时，他很和善的回答：「可是没有人想到你居然能做得到。」", "萨加尔的个性相当可爱，我们至今仍然是好朋友。不过在听见他的话那一刻，我的心里其实非常震惊。从我有记忆以来，我的数学程度就一直很好，非常好。我小学里的每个人都知道我数学程度很好，念同一所高中的每个人也都知道。我以前常常参加各种数学竞赛，而且通常会赢。老师、家人、朋友都认为我能做到这些事，是理所当然的。我也一直这么想。可能有人会嫉妒我，但不会有人对此感到惊讶。", "然而，萨加尔的随口评论，让我第一次意识到一件我以前从未想过的事：很多有钱人都认为穷人是笨蛋。伦敦政经学院一年级经济学讲座的规模相当庞大，参加的学生超过千名。在这些讲座中，我坐在第一排，穿著运动服，背著 Nike 抽绳后背包，用独特的东伦敦口音向主讲人提问，看在那些富有的学生眼中，显然是一个很有趣、但算不上真正威胁的存在。不过，我出色的大一成绩让他们明白，情况似乎和他们以为的不一样。", "我在脑子里思考这个新发现，问自己接下来该怎么做。就在那一刻，我决定向他们展示：我们这些穿著运动服的穷孩子不全是笨蛋。没错！我确实不知道信用违约交换是什么，但是如果有需要，解一些数学问题对我完全不是问题。我们会让他们看见，是的，我们会让他们好好看看。我们要让那些人看见我们能做什么。", "因此，当其他同学都在向三十七家投资银行提出实习申请时，我却开始以相当夸张的方式，向每个会注意到我的人展示我在经济学，尤其是在数学相关方面的超强实力。有生以来第一次，我开始在课堂外自主学习。我更频繁的在讲座上提出问题。当主讲者出现错误时，我便开始挑战他们。老实说，我从未想过它是否或者将如何引导我走上职业生涯，但在那时，我的心思也不在那里。我只是想让他们知道，他们并不比我们优秀，因为事实就是如此。", "无论如何，有一天怪事发生了。一个穿著凌乱西装、顶著拖把似的浓密黑发、看上去仿佛身高多长了十五公分的瘦高北方男孩在图书馆里找到我。他叫路克．布莱克伍德，来自格林斯比，是比我高一届的数学系学长。", "「你是盖瑞吗？」他问我，我点头承认。", "「听著！花旗银行下周要举办一个竞赛，被称为『交易游戏』，但基本上就是数学游戏。如果你赢了，会被邀请去参加全国决赛；如果你又赢了，就能拿到实习机会。我听说你的数学非常好。你应该去试一试。」", "在此之前，我从未见过路克，但他坐在我身边，告诉我比赛日期和时间，并简单的向我解释比赛规则。我对交易一无所知，但是，正如路克所说，我不需要知道什么，因为本质上它就是一个相对简单的数学游戏。在向我展示它是如何运作之后，路克站起身来，直接走开，留下我坐在闪烁的电脑前，面对几张印在Ａ４纸上、还未完成的数学作业。", "不知道为什么，也许是我太过自大且自信，我立刻就相信自己会赢得比赛。我可能对信用违约交换、担保债务凭证或资产支持证券一无所知，但我了解赛局，也了解数学。就我来看，总算出现一条不需要我会吹他妈的双簧管也能通往金融城的路。总算出现公平的竞争环境，可以展开一场真正的游戏。我知道我能赢。我阖上课本，收起数学作业。我建立一个新的试算表档案，开始列出游戏里会用到的所有数学公式。", "路克找我谈话后没过几天，就是交易游戏的初赛日。这是我第二次参加金融相关活动。入秋的夜晚还算温暖，尽管这个比赛并未被广为宣传（或者应该说，至少我不晓得），但一条中等规模的人龙已经从伦敦政经学院的一栋大型办公大楼蜿蜒而出。很寻常的伦敦政经学院金融协会类型的队伍：中国人、俄罗斯人和巴基斯坦人的国际大杂烩，以及更多从口音和服装上就能看出不管国藉是什么，名下显然都有信托基金的人。", "我很清楚自己比这些人更具优势，已经有人向我解释过游戏规则，而这些人却一无所知。的确是不公平，但人生本来就不公平。天知道在这些人的人生中有多少早有专人向他们解释过、但我却永远不会知道的规则。我仿佛在人生中第一次拥有优势。我一边享受著这种感觉，一边随著队伍前进，兴奋到手指和脚趾都在颤抖。", "满怀抱负和渴望的年轻预备役交易员排队进入一间没有窗户的挑高大房间。虽然我之前没来过，不过这里像是大楼深处的某个演讲厅。每五人分成一组，在不同的桌子坐下。一个身材魁梧的男人神气的站在大房间前方的一张大挂图前。他是我生平见到的第一位交易员。我心想，原来交易员长这样啊！", "我们坐下之后，交易员解释游戏规则。当然，我已经知道规则，所以我在他说话时还有余裕上下打量他。他在房间里缓慢又沉重的走来走去。他精准的露出微笑，目光明亮的扫视人群，逐一打量每个学生。我几乎可以看到一股自信，宛如蜡烛生出的烟雾从他身上冉冉升起，在大房间里蜿蜒盘旋。它呈现出一种厚重、黏稠的黑暗，却又像玻璃罐里的糖蜜带著清晰闪耀的明亮光泽，同时伴随著露出大白牙、似乎永远挂在脸上的巨大微笑。看到那种阴暗、黏稠的自信，让我瞬间仿佛回到老家，回到伊尔福德，回到高中时代喜欢装酷的孩子变成卖一次大麻赚十英镑、一百英镑不等的小药头的时候。可是它带著我在伊尔福德从未见过的深度。那是我在进入伦敦政经学院之后，才开始有能力看到的。是一种不仅今天能赢、明天也能赢的人的自信。一种知道自己不会输的人的自信。不知道为什么，即使在我对交易一无所知的最初阶段，我也觉得那种自信注定属于我。", "不过，眼前还有任务要先完成。这场比赛，我一定要赢。", "我该怎么做才能赢呢？嗯，首先你需要了解这场比赛的规则。", "理论上，交易游戏应该要模拟巿场交易；然而实际上，它只是数字组成的游戏。", "它使用一套特制的编号卡牌，数字大小不一，共十七张。如果哪天你也想参与，我可以告诉你：这十七张分别是负十、二十以及一至十五的所有数字。每个选手都会得到一张牌，只有他们自己可以看得到，然后桌子中央会放著三张数字朝下盖著的牌。游戏规则为每个选手各自猜测八张牌加起来的总数（五名选手每人一张牌，加上桌子上的三张牌），以此为基础下赌注，互相竞争。", "你可以将牌局的概念想成这样：所有人都在买卖某些资产，该资产的总值即为游戏卡牌的总和。你手上只有部分资讯（你自己的牌）；随著游戏的进行，更多资讯（中间的牌）会随之揭露。如果你拿到一张数字很大的牌，例如：十五或二十，那么便暗示总金额可能会很高的讯息，你认为总金额可能很高，因此你会想「买进」赌注。如果你有像负十这样数字很小的牌，你可能认为总金额应该较低，你会想「卖出」赌注。如果你拿到一张像六或七中间数字的牌，我猜你就得另外找理由说服自己了。", "投注系统是这个游戏之所以被称为「交易游戏」的主因，因为它的设计宗旨就是在模仿交易员在市场上进行投注的行为，也就是在「双向市场」中进行「决定价格」和「接受价格」。", "让我先很快的介绍一下，在真正的金融市场里交易是如何发生的。像是退休基金、对冲基金或大企业等大客户想要购买或出售某样资产，交易标的可以是任何东西。但在这个例子里，让我们假设他们想用美元购买一千万英镑好了。正常来说，他们不会打电话给银行说：「你好，我想用美元买一千万英镑。」他们不这么做的理由有二：", "1. 如果交易员知道你想购买英镑，他可能会试著推高英镑价格。", "2. 如果交易员知道你想购买英镑，他甚至可能抢先进入市场，很快买进大量英镑，希望推高市场价格，然后以更高的价格卖给你。这种做法被称为「抢先交易」，虽然它在许多情况下是违法的，可是在现实中还是时常发生。", "说得更清楚一点，如果你是客户，你不会想在真正有机会购入之前，就告诉交易员你想买进。为了避免这种情况，你可以说：「嗨，请告诉我一千万英镑的价格。」", "当你这么说时，交易员（理论上）不会知道你是想买进，还是想卖出。按照惯例，他必须给你两个价格──一个是你可以买进的价格，另一个是你可以卖出的价格。这种做法被称为「双向价格」，几乎所有大型金融市场都是这么运作。如果你仔细想想，当你在机场走近外汇柜台时，你应该就会看到类似的告示栏：一个可以用美元「购入」英镑的价格，另一个可以「出售」英镑以换取美元的价格。当然，他们（银行）购入的价格总是远低于出售的价格，毕竟外汇柜台就是靠这个价差赚钱的。交易员也是一样。", "花旗银行的交易游戏也以同样的方式运作。每个选手都可以随时询问其他选手：「你现在的价格是多少？」另一个选手就必须以双向价格的格式，提供有价差的买进价和卖出价。", "假设你是一个渴望成功、想成为交易员的伦敦政经学院年轻学生，你正在玩这个游戏。你穿著一套你身为中国政治局委员的父亲重金从伦敦最好的裁缝店买来的昂贵西装，坐在桌子后面。一个看上去极其自信的魁梧男人向你简单解释一套看似相当简单的数学游戏规则，还有一个看上去咄咄逼人、穿著印有蓝犀牛的白色连帽衫的瘦小少年，以你几乎听不懂的口音询问：「你的价格是多少？」", "你会怎么应对？", "对于大多数受过良好经济、数学和统计训练的伦敦政经学院学生来说，答案显而易见。你看著自己手中的牌，想著这副牌中可能出现的牌，然后做一个简单的统计速算，得出总数的「期望值」。这个数学计算一点都不难。整副牌的平均点数为七．六五。游戏只会用到其中八张牌，因此平均总数应为六十一．二。你已经知道其中一张牌的数目，因此，如果你手上的牌数字特别大或特别小，你就得适当的往上或往下调整。如果你手上的牌为二十，你的期望值是六十八，你可能会以为应该调至七十三，因为二十比七．六五多了十二，可是二十在你手上，意味著其他人都没有二十，所以它只会将期望值往上加七。如果你手上拿著负十的牌，则你的期望值应为五十一．二。", "这些都是简单的数学，一点都不难。桌边的每个人都能轻易算出来。", "不过这么想其实很愚蠢。我待会再向你解释为什么。", "比赛前，我已经在伦敦政经学院研读数学、经济学和财务相关知识一年。我知道他们会怎么想，所以我认为这就是他们会采取的战术。想像一下你正在玩这个游戏，桌上的某个人手上拿著二十，他会立刻给你一个介于六十七至六十九（记住，他的期望是六十八）的价格。另一个人有负十，他会给你介于五十至五十二的价格。你要怎么应对？", "嗯，第一点，你马上就会察觉这个人有负十，另一个人有二十。他们说出来的第一句话，已经毫无疑问的向你揭示他们手上的牌。然而，这还不是重点。关键是，你可以去找提出五十至五十二价格的人，和他对赌总值会高于五十二。然后你可以转向提出六十七至六十九价格的人，和他对赌总值会低于六十七。以五十二买进，以六十七卖出。这两个赌注在做出的同时立即抵消，你将获利十五。无论游戏最后出现的实际总额是多少，这种情况都会发生，这笔十五的利润完全无风险。然后你看准时机，再做一次。", "如果和你同桌游戏的其他选手够聪明，他们就会意识到你已经很快赚了一笔。他们会意识到，当另一个人提出以六十七购入时，还回答愿意以五十二出售简直愚蠢。如果其他选手够聪明，他们会意识到那个穿犀牛连帽衫的小个子在一分钟内已经询价十五次，并且已经赚了毫无风险的利润一百。他们会意识到也许他知道自己在做什么。他们会想，说不定他们应该调整应对策略。", "可惜那些在伦敦政经学院主修经济、参加金融协会活动的人不够聪明。或者更确切的说，他们聪明在不同的地方。他们很擅长使用电脑，也很会编写试算表。为他们系上精致的领带，在他们手里放一杯酒，将他们和德意志银行的招聘人员放入同一空间，他们很快就能找到话题和对方热烈交谈。让他们和一个已经先用三天时间解出答案的东伦敦男孩玩投资纸牌游戏，他们会在他极快话速的迷惑下，一小时后才意识到自己已经输掉比赛。", "就这样，我赢了第一轮比赛。低买，高卖，低买，高卖，再低买，再高卖。实在太荒谬。其他选手的目光都钉在计算机上，几乎连头都没抬起来过。当他们在算著他们的期望值时，我只是平心静气的将大把大把的积分收进口袋。", "虽然这个游戏只是一个数学赛局，但它确实可以告诉你一些关于市场的教训：", "1. 个别交易员不设定价格。如果你认为某物值六十，但其他人都以五十的价格出售，你就不会以五十九的价格购入。如果其他人以五十的价格出售，你最应该的报价为五十至五十二。如果有人以五十的价格出售，你就不该提出以五十一的价格购入。这点显示金融市场的有趣之处，那就是：个别交易员不应以他们认为某物的价值为它定价，应该以其他人认为的价值来定价。", "2. 因此，如果你向十个不同的交易员询价，你不应该得到十个不同的价格：它们应该都集中在一个相似的价格带上。即使十个不同的交易员对实际价格应该或多或少有完全不同的看法，情况依旧如此。", "3. 如果另一个人看起来知道自己在做什么，而且赚很多钱，但如果你不知道自己在做什么，也许你应该模仿那人的行为。", "4. 大多数金融市场主要是靠前面的第三点在驱动。", "我知道第一轮交易比赛并不公平。我在三天前就知道规则，其他人却是当场才听到。我知道这大概是我那天赢得比赛的主要原因，我知道这是我最终找到变成百万富翁的工作的第一步。我知道这不公平。但是，老实说，我一点都不在乎。那个房间里的其他人后来也都成为百万富翁，因为他们的爸爸就是百万富翁。他们之中的一些人后来也成为交易员，因为他们的父亲就是交易员。我爸爸在邮局工作，我家里甚至没有一张可以让我写数学作业的书桌。我认为你当然可以将所有你能掌握的优势物尽其用。我走向大房间前面那个交易员，和他的大手相握。", "「干得好！」他说：「决赛见。」", "「谢谢。」我说：「我们到时候见。」", "伦敦政经学院的交易游戏比赛结束，到全国决赛之前只隔三周。在这段时间，我几乎没去参加任何一场讲座或课程。马蒂兹也拿到决赛资格。我教我所有其他朋友如何玩这个游戏，然后在图书馆的一个房间里，和我认识的任何愿意参加的人，一起持续玩了三周。当我找不到人一起玩时，我就整理相关试算表，再三背诵。它只是花旗银行里某个人想出的愚蠢数字游戏。我相信等到交易游戏决赛日，我一定已经是世界上最厉害的专家。", "决赛在花旗集团大楼举行。在二○○六年，花旗大楼是英国最高的三栋建筑之一，仅次于汇丰银行大楼和在金丝雀码头顶著闪亮金字塔屋顶的加拿大广场一号摩天大楼。它们就是我当初站在伊尔福德街道尽头的路灯柱间所看到的建筑物。像是命中注定，只不过我得先赢得这场比赛，才有资格走进去。", "决赛那日，天气已从温暖的秋天变成寒冷的初冬。我穿上深蓝格子衬衫，系上蓝黄色宽领带。这是我以前在ＤＦＳ沙发店拍松靠枕时穿的衣服。当我搭乘地铁从伦敦政经学院出发，前往金丝雀码头时，天色已暗。银禧线的列车发出的声音，与每天早上经过我床边的列车完全不同。银禧线在加速和减速时，会发出螺旋般逐渐加大的呼呼声。听起来很新潮、很高科技。对我来说，听起来就像是金钱的响声。", "决赛在顶层的其中一个房间举行。从那个高度看出去，伦敦在冬夜里只剩下数不尽的窗户和路灯。我在童年时期，日日仰望这些摩天大楼，如果我是其他日子来，说不定我会想从这里向外看，尝试辨认出我父母的房子。但我不是来观光的，我的脑子里塞满数字。而且，我也不知道我家在大楼的哪一个方向。", "比赛前，花旗银行举办提供香槟和法式开胃小点心的简短招待会。我既不懂法式开胃小点心是什么，也没有喝任何香槟。其他候选人则与在场的交易员打成一片，轻声谈笑。我猜想，可能是在嘲笑担保债务凭证之类的吧？不过我没在听。我去那里是为了赢得比赛。伦敦政经学院、牛津大学、剑桥大学、达勒姆大学、沃里克大学，这五家大学各派来五位参赛者。我想对花旗银行而言，其他大学不够重要。这样包括我在内就有二十五名参赛者，而我已经和伦敦政经学院的所有人都交过手。我对自己非常有信心。", "我们在指定的桌子坐下。出现在伦敦政经学院初赛的那位高大交易员微笑发表一些激励人心的话，我同时悄悄打量同桌的选手。我必须在决赛采取不同于初赛的策略。这里的每个人都参加过初赛，并且表现出色才晋级。他们应该优秀到足以意识报价和桌面上其他人不同是件蠢事。这意味著只透过在不同的选手间低买高卖，是不可能赚得到钱的。", "然而，选手意识到「给出和别人相差甚远的价格很蠢」的事实，却为我创造新的机会。透过我持续不懈的练习，我意识到，大多数选手都表现出严格遵守周围选手报价范围的意愿，即使有差距，也都不会太大。他们主要依靠听力来做到这一点，聆听周围选手的报价，以便将自己的价格维持在同一范围。这给我一个机会，只要自己大声报价，就可干扰、甚至进一步操纵其他人的报价。游戏以人人皆可参与的方式进行（类似真正的市场），如果价格介于六十二至六十四之间，大声报出介于五十八至六十的价格，只要次数够多，通常可以顺利将价格拉低至这个范围。在游戏一开始时，立即非常大声的报价，也是设定价格水准的另一个好机会。", "这让我想出一种相当有利可图的新策略。如果我拿到一张大牌，我会在游戏开始时喊出低价。说白了就是一种简单的虚张声势──暗示别人我手上的牌数字很小，将整体期望值拉低，然后在所有人都守著我最初喊出的低价范围后，我就可以持续从各选手那边以低价买进。当然这么做的风险是，其他选手可能意识到我在唬人，以低价从我这里买进，转身高价卖给别人。我在这里依靠的是几周前我的朋友萨加尔．马尔德给我的那条直白讯息：有钱人认为穷人都是笨蛋。如果一个长得像我这样、说话像我这样的人，在游戏开始时大声嚷出听起来过低的价格，其他选手更有可能只会嗤之以鼻，认为是一个傻瓜廉价的亮出自己的底牌，不会想到我其实是不怀好意的在误导他们。", "走完第一步，之后的计划只剩不断的向其他人询问价格，试图推测他们所采取的战术，以及他们手上的牌的大小。在这里，我依靠的是其他伦敦政经学院选手给我的另一个讯息：这些选手中大多数都不认为自己可以赢，只是想利用决赛做为拓展人脉的机会。有鉴于此，我相信大多数选手应该会采用相对简单的策略：如果他们手上是大牌，报价会略高于平均；如果是小牌，报价则会略低于平均。有些人为了避免泄露消息，可能会报出中立价格，但这种情况应该不多。很少人会虚张声势。你得记得，这些人是经济系学生，而不是职业扑克选手。", "这里最重要的关键点是，现在的经济学家其实都是数学家，而不是伟大的思想家或赛局高手。其他参赛者都在飞快的按计算机，在他们按计算机时，我却在努力误导他们的耳朵，观察他们的眼神。从大声而虚假的报价开始，进而快速评估每个选手的智力、复杂程度和手上可能有的牌。一旦心里有底，我便会决定是否向此人买进（赌总数会较高）或卖出（赌总数会较低）。如果我是买家，我会透过大声报低价来压低价格，同时积极的以拉低的价格从其他选手那边买进。如果我是卖家，则做完全相反的事。", "这个战术非常有效。赢得五局胜利之后，我顺利进入总决赛，也就是决赛中的决赛。现在只剩五个人竞争，抢夺一个实习生的位子。情势相当乐观。", "当我们五个走向房间中央那张桌子时，被淘汰的选手纷纷抓起法式开胃小点心，围拢观赛。", "我打量周围对手。我在之前的几场比赛已经和他们大部分人交过手。他们都很优秀，能够很快弄懂价格走势，并且对牵涉其中的数学知识非常了解──不过我认为，他们之中没有人聪明到懂得虚张声势或看穿我的虚张声势。我想我的机会还是很大。", "牌卡发下来，我拿到负十。这是一张好牌。负十是距离平均值最远的牌，意味著它最有能力改变游戏的总值。但当然，只有当其他人没有意识到你已经拿到它时，它才有价值。否则，他们会立刻开始降低自己的价格，你就无法从中获利。这是交易时的另一准则：你是对的，不一定能赚到钱；但是在别人犯错时你是对的，就一定可以赚钱。", "我坚持我一贯的策略，立即宣布了一个高报价。如果我能让整局游戏维持在高价范围，我就有希望持续以高价「出售」，充分利用我的负十这张卡。", "令人惊讶的是，尽管我的价格开得很高，但第一个选手并不想「卖」给我。我问他的价格，甚至比我的报价更高。他很显然已经揭开自己的底牌：他手上的牌数字一定很大。", "我向另外三名选手询价。所有人都报出高价，看起来每个人手上的牌数字应该都相当大。换句话说，如果忽略我的负十，这局的总数将会很高，我若要获得利润，必须尽可能的推高价格。我开始将价格报得愈来愈高，声音愈来愈大，直到最后其他人开始同意卖给我。我努力将价格再推高一点之后，我开始使劲的卖。在这种价格下，加上我手上的负十，我几乎不可能输。我的诀窍是大声报出高价，假装自己是一个激进买家似的推高市场，可是实际上却在向其他选手询价时，尽可能的卖出。游戏进行时场面既混乱又吵杂，其他选手无法根据自己的报价记得谁在买、谁在卖，可是不断重复的报价却能对推动价格产生极大的影响。", "我开始累积大量「卖出」赌注，自信的认为最终总额会比这个价格低上许多。差不多是时候翻开桌上三张牌中的第一张了。结果是十三。", "对我来说，十三不是个好数字。比平均卡牌数值七．六五明显高太多，以它一己之力就能将期望总值拉高三。我的记分卡画上大量「卖出」的赌注，这可真不是什么好消息。不过，没人知道我手上有一张负十，而且我卖出的价格都很高。以数学逻辑来说，一切优势都还站在我这边。我利用这个机会进一步提高价格，并且继续卖出。", "当桌上的第二张牌被翻开时，我已经画满两张卖出赌注记分卡上的所有格子。第二张牌是十四。", "看到这个数字，我当时或许就该心生怀疑，但是我没有。而且，我也没时间多想。我需要它开出的总值偏低，不然我就得和我的职业生涯说再见了；然而即使总值不低，我也不打算因此停下脚步。我再次将价格提高，并开始以更高的价格、更激进的态度卖出。到比赛结束时，我一共卖出大约三百个赌注。", "最后一张牌被翻开。数字为二十。其他四位选手也翻开他们手上的牌。十、十一、十二、十五。怎么可能？除了我手上的负十，其他七张牌就是整副牌里最大的七张。发生这种情况的机率是一万一千四百四十分之一。也就是○．○○八七％。有人对这场比赛动手脚。", "我不知道该如何处理这个情况。刹那间，我只觉得如坠冰窟。群众却爱死这么戏剧性的转折。其他选手当然也很开心。我进行如此多笔的销售，不可避免的，他们的记分卡上自然是一大串的购入。最终，开出来的总值非常高。是谁操纵比赛？为什么？这又代表什么？", "当交易员和其他花旗集团员工聚集在房间后方计算分数时，选手也离开总决赛桌，融入人群之中。", "「真遗憾，老兄。」马蒂兹将手放在我的肩膀上。「运气实在是太不好了，伙计。不过你已经尽力了。」", "我不确定我当时回应马蒂兹什么。也许我什么也没说。", "长达五分钟的时间，我感觉房间似乎在融化。我发现自己手拿高脚香槟杯，看著小气泡不断冒出，好像怎么都不会停似的往上飞。刚刚发生什么事？到底是谁干的？他们为什么要骗我？", "不久之后，担任主持人的交易员大步走到房间中央，他巨大的身影让大家立即安静下来，周围的人群散开，为他让出一个空间。", "「我要感谢每一个参与的人。」他大喊，响亮的美国腔将我的思绪拉回现实。「我们已经算出每个人的积分，现在我将宣布最终赢家。」", "我不记得其他人得到几分。但我的应该比负一千少一点。那是……相当不好。事实是，我并不觉得尴尬。毕竟如果你连试都不试，你就真的一点机会都没有。你懂我的意思吧？", "读完分数后，这位身材魁梧的交易员宣布获胜者，他喊出来的名字居然是我。我赢了，是我。", "我茫然的往前走。", "交易员一边与我握手，一边向群众解释。", "「盖瑞在前几场比赛的得分遥遥领先其他人，所以我们决定测试他。我们想看看当所有发展都对他不利时，他会如何反应，于是我们操控游戏。了解一位交易员是否会坚持自己的决定或让步很重要。盖瑞，你坚持自己的信念，我们很高兴看到这一点。做得好。」", "交易员再次向我伸出他的大手，我握住它。", "「我是迦勒．祖克曼，我们在交易部见。」", "那天晚上非常冷，但我和几个朋友相约在公园喝酒。我醉得很厉害，所以不太记得发生什么事。不过有段记忆却一直清晰的印在我的脑海里。我记得自己跑得飞快，冷空气不断扑面而来。在那段记忆中，我伸出双手紧紧抓住朋友的肩膀：「我就要成为百万富翁了！」我大喊。我朝他尖叫，他却在大笑。「我就要成为百万富翁了！」", "小节 3", "二○○七年三月初清晨，我在日出前就醒来。", "我爸妈家那时还没有淋浴设备。我们从阿尔格斯零售店买了小型橡胶水管（现在还买得到，价格为六英磅），把它接在水龙头上。那天清晨我坐在冰冷的塑胶浴缸里洗澡，洗到一半，爸爸就来敲浴室的门。他也一样很早就得去上班。", "我拿出以前在ＤＦＳ沙发店打工穿的旧衣服：深蓝衬衫、蓝黄宽领带。外面套上我在 Next 平价成衣店买来的一件不合身的廉价黑西装外套，然后涂上发胶。离开家门时，天还没亮。", "我在伊尔福德长大，但离我家最近的车站却是七王站。在冬阳升起前，早起的上班族站在黑暗中瑟瑟发抖，等待火车。他们呼出的空气全化成白雾。这列车会经过我的卧室墙外。我试著寻找我的窗户，但失败了。", "我在斯特拉特福换乘银禧线，再次听见那股逐渐加大的螺旋呼呼声。列车潜入地下，往金丝雀码头前进。二○○七年三月，我只有二十岁，那天的列车声音给我的感觉却和以往大不相同。在那一天，我觉得自己听见未来。", "列车在金丝雀码头站前一小段转入地下。那时当地的车站才刚建好不久，金丝雀码头站又大又宽敞，加上超高天花板，简直像一座地下大教堂。你可以看得出来走出列车、排队在月台上移动的人全在银行上班。昂贵低调的发型和衬衫。他们排著长长的队伍，蜿蜒穿过车站，走向出口。我加入其中一条人龙，和他们一同前进。", "出了车站，朝大楼方向走去，在黎明的第一道曙光中，我看见它──花旗银行中心，四十二层的摩天大楼，由暗灰色钢铁和玻璃建造而成，座落在金丝雀码头最精华的摩天大楼三角的南端。大楼顶端镶有巨大的红色发光字母，拼出「花旗集团」，末端还画著一把发光的红色小雨伞。不知道为什么，冬季的早晨和夜晚，楼顶便会冒出浓浓的白色蒸气。地铁站有四道长长的上行电扶梯，人们乘著它们从悬挂在车站上方的巨大圆形发光开口进入地面，因此在离开车站时，你会产生仿佛正在登上太空船的错觉。然后当你出来时，你会发现自己身处一个宽阔的开放式广场，有树木，有喷泉，最引人瞩目的是，还有许许多多拔地而起的巨大灰色金属柱，往上冒出大把大把的蒸气，不停飞向深蓝色的天空。", "我穿过街道，走向大楼。强风在摩天大楼之间呼啸而过，当我走进花旗集团大楼宽敞、温暖、灯火通明的接待处时，感觉像是终于进入避难所。里面摆满一看就知道很昂贵的家具、色彩缤纷的抽象艺术品，还有训练有素的员工。一位温柔细致的接待员引我走到一张柔软细致的沙发前，我坐下来调整领带。", "一位名叫史蒂芬妮的女士来接我。她看起来很亲切，递给我一张访客通行证。她带我通过好几个安全检查哨，绕过一个转角，进入看在我眼里仿佛是全世界最大的巨型中庭，到处都是手扶梯和玻璃。这是一栋全新建筑，我可以一眼看到至少比我所在之地高出二十层楼的屋顶。每一层楼巨大而明亮的房间，都可从两侧窗户组成的厚墙看向一片广阔、高大、开放的空旷空间，我站著往上看的中庭，便是空间的底部。玻璃和金属组成的走道和阳台穿插延伸，将办公室连接起来。我当时并不知道，就在不到一年前，花旗集团一名员工跳楼自杀，从那个中央开放空间一路往下掉。他甚至还没出大楼就已经坠落二十层楼。一些交易员在事发后特地走到阳台往下张望。我猜，他应该就是从那里跳下去的。", "史蒂芬妮领著我换了三次电扶梯，来到二楼的玻璃走道。巨大的玻璃门上蚀刻水晶盐白色的「固定收益交易大厅」几个字。我其实看不懂那是什么意思。但之后，我会在此度过生命中的四年。", "交易大厅是一个极大的房间。从中间进入后，感觉房间似乎向三个方向各延伸五十公尺：我的左边，我的右边，还有正前方。我注意到的第一件事是萤幕。每个交易员面前都有八个、九个、十个、甚至十二个萤幕，在他们面前排列成一个巨大的正方形或长方形。一排又一排的交易员，每个人都抬著头观看上方及左右、将他们圈在里头的萤幕墙。", "交易员的座位背靠背的排成一长排，与头顶天花板上悬挂的一长排照明灯相映成趣。每个人都拱著身子抬头看著萤幕。外墙全是落地大玻璃窗，虽然从我站著的入口望过去那些窗户显得非常非常遥远。宽大的黑色数位看板等距离的悬吊在天花板下，显示世界不同城市的时间：伦敦、纽约、雪梨、东京。每位交易员的萤幕下方都有一个巨大而沉重的黑色扬声器，宽约一公尺，上面布满按钮、刻度盘和开关。当天早上更晚一点的时候，房间里会充斥扬声器发出的噪音，愈来愈大的叮叮声、哔哔声、金属摩擦声，以及大声喊出的数字声。然而，现在是早上七点半，我站在那里，四周异常宁静。最响亮的不过是照明灯发出的嗡鸣声，以及音量更小的低沉震动声。", "史蒂芬妮领我绕到交易大厅的右侧，走了一段距离后，向左切入分隔通道中的一条。我们朝著交易大厅的中心前进。我一边走，一边观察两侧背靠背坐著的交易员：白衬衫，白衬衫，浅粉衬衫，白衬衫。我心忖，原来交易员就是长这样的。", "我们进入交易大厅中比较吵闹的区域。电子讯号和警报，以及人类大笑和播报数字的大叫所形成的杂乱旋律，这些成了我后来生命中的主旋律。当噪音开始变大时，我环顾四周，史蒂芬妮径直走到其中一张桌子前。", "我们直接走在交易员背部和背部之间的狭窄走道里。噪音愈来愈大，我可以看到巨大的萤幕墙上闪烁著五彩缤纷的数字。这个座位区位于交易大厅靠后的角落，旁边就是一扇巨大的窗户。透过落地窗，我可以看到外面的景色，车站、广场上的树木和喷泉，我甚至可以看到太阳正在冉冉升起。", "史蒂芬妮停下脚步，稍微弯曲膝盖，微倾靠向一位交易员巨大且笨重的背影，在他耳边轻轻说了些什么。", "交易员将双臂抵在桌子边缘，用力一推，他的电脑椅朝后滑动六十公分后旋转半圈。他从椅子上起身，高大且魁梧的身体挡在我和窗户之间。阳光透过窗户照在他身上，我几乎看不清他灿烂又巨大的笑容，但我知道那是迦勒。他伸出巨大的右手，继决赛后我再次握住这只手。", "「嗨！盖瑞。欢迎来到 STIRT（短期利率交易）小组。」", "小节 4", "史蒂芬妮离开了。我没注意到她什么时候走的，但她肯定走了。我站在迦勒的影子里，瞇起眼睛，向上打量。", "迦勒沉重的手搭在我的肩膀上，领著我离开窗边，回到交易大厅的中央走道。STIRT 小组共有大约十名交易员，背靠背的坐在我们经过的两侧。我们一边走，迦勒一边做出手势介绍每一个人。", "「这是比尔，他交易英镑。」", "「这是ＪＢ，他交易Aussie（澳币）、Kiwi（纽西兰币）、Yen（日币）。」", "「这是惠利（Wheeley），他交易 Skandis（北欧货币）。」", "在大多数情况下，我其实听不懂他们负责交易的是什么。", "当我们走过时，没有一个交易员跟我说话。其中两、三个听到自己的名字时很本能的转过头来看一眼，却又很快的转回去。每个人都全神贯注在他们的工作站所发出的闪烁灯光和声音中：其中一个人拿著一部又厚又重的棕色手提电话；另一个人则对著他的巨大扬声器大喊好几个数字。", "迦勒停在队伍的尾端。有个男人（虽然我事后想想，那时的他应该只能说是男孩）的座位与其他交易员之间隔一个明显的空位，他的一半身子其实已经坐在走道上。他将成为第一个在交易领域指导我的前辈。", "「史努比（Snoopy）！」", "迦勒大喊，史努比的椅子猛然转了半圈，他立刻站起来，双手在长裤前擦一擦。我很庆幸的注意到，他的身形是正常人的尺寸，只比我高几公分。他一边介绍自己，一边和我握手，微笑点头。事实证明，他真正的名字不是史努比，而是桑迪普（Sundeep）。不知道为什么，他在向我介绍自己后，居然转身去和迦勒握手，而且不断的微笑点头。", "迦勒就这么走了，和史蒂芬妮一样，将我留给桑迪普。尽管我仍是一头雾水，也没人指导，桑迪普很快的离开我，回到自己的萤幕墙内。我独自站在桌边，不清楚我应该做什么，或者更现实的问题，我应该坐在哪里。", "不过，没有关系。之前就有人告诉我这件事，我已经被警告过，这就是「什么都没有」。我曾听一群伦敦政经学院的巴基斯坦金融学会成员在图书馆挤在一起填写申请表时，谈论过这个问题。你填写三十五份申请表，写了三十五封求职信，记住大约一百个缩写词的意义，进行二十或三十次面试。然后，当你终于第一次走进交易大厅，开始你的第一次实习时，满怀热情的迎接你的第一支团队，准备赚入你的第一个百万美元，可是你面对的却是……什么都没有：没有为你安排的工作，没有明确的指示，没有明显的职责。而且很多人遇过的，就像我现在，也没有座位。当你只是实习生时，不会有人把工作交给你。你要靠自己的本事让工作变成你的。我猜想，你得靠自己在交易大厅找到赚钱的门路。", "史努比的左边有个空位，甚至具备整套电脑和萤幕，不过根据我的推断，那位子可能是有主人的。于是我趁著没人注意的时候，从交易大厅的其他地方拖来一把空椅子，将它滑到史努比右边的一个小文件柜前。我半靠在中央通道上，从这位置我可以看到我需要的所有东西：史努比的萤幕就在我的前方，左边则是坐满交易员的办公区。我为自己找到的工作就是密切注意各个交易员，并且在看到有人不忙时，就偷偷溜过去和他们交谈。我也可以使用文件柜充当临时办公桌。我从记事本上撕下一张纸，画了简单的图表，写下我能记住的所有交易员相关资讯：他们的名字、他们的职责，以及他们的座位。我把它拿给史努比看，问他我有没有画错。他觉得很有趣，为我做一些更正。我把它放在面前的文件柜上，拿出另一张纸，重画一份干净的副本，然后将它折好，放进口袋。", "毫无疑问的，史努比显然是新进人员。他最多比我大三、四岁，其他交易员看起来至少都比他大七、八岁。我好几次试著靠近史努比的眼角余光，问他在做什么，但他每次都露出羞涩的微笑避开。他看起来像一个在偷抄作业的男孩，我立刻对他心生好感。但我和史努比都清楚的知道，我的未来不会掌握在他手中。他知道，我知道；他知道我知道……", "我必须寻找更大的鱼。", "我转向左边，打量 STIRT 小组的成员。", "即使我当时还年轻，涉世未深，也看得出来他们满身不受控的暴民气质。远处的角落，一个矮小的中年男子坐在迦勒身后靠窗的座位。他的满头白发近乎球形，身材有如哈比人般的矮小，坐在摇摇晃晃的办公椅上将头歪向左边，用力将巨大的棕色手提电话夹在耳朵和左肩之间，疯狂的敲击键盘。他调整角度，让身体朝向窗户而不贴著桌子，时不时以怀疑的目光偷看其他交易员，仿佛正在做什么坏事，担心被抓住似的。另一个中年男子身材高瘦、脸色红润、完全秃头。他没坐在椅子上，反而直挺挺的站著，一片粉色衬衫下摆垂在外头。他靠在电脑上，用明显的澳洲腔拖著长长的尾音，对著萤幕大喊大叫，不停咒骂。离我三个座位远的一个义大利人，皮肤黝黑，看上去很昂贵的衬衫皱巴巴的挂在身上，对著耳机大笑，他看似已经很久没有好好睡过一觉。就连在交易游戏时表现得光彩十足、魅力四射、有如万人迷的迦勒，穿著超大号的美国西装友善的讲电话时，看起来也没之前那么年轻、那么优雅。", "其实这不是我第一次进入交易大厅。交易游戏比赛冠军的奖品是两次为期一周的实习，当时是第二次。我现在要面对的挑战是，将它由两周变为暑期实习，然后将暑期实习变成一份全职工作。去年十二月，我的第一周实习是在「信贷交易」小组度过的。当然，我并不知道，大约再过一年十个月，那个小组就会摧毁世界经济。当时我对世界经济即将死亡一无所知。三个月后的现在，当我坐在 STIRT 小组最边缘的角落时，我自然依旧什么都不知道。我只是一直在想「STIRT」到底代表什么，以及为什么这里的交易员看起来与大厅另一头的信贷交易员如此不同。", "信贷交易员和伦敦政经学院的学生很类似。举止合宜、衣著得体、类型统一、圆滑世故。STIRT 交易员，嗯，他们不符合这样的形象。他们说话有口音，来自真正地方的真正口音。我喜欢。但我也想知道为什么。", "不过，现在不是进行社会学分析的时候。时间一点一滴的流逝。我需要让情况有所突破。", "至少，选出第一个人非常简单。当大多数交易员全神贯注盯著萤幕或讲著电话时，高瘦、光头、红脸的粉红衬衫男却做出许多突兀的动作。他对著扬声器大声讲笑话，隔著萤幕墙对其他交易区的交易员大喊我听不懂的话，又突然伸手拍打其他交易员的背部。他一直站著，一直在移动。他似乎很想被人打扰。我从口袋里掏出那张纸，复习一下。「ＪＢ，Aussie，Kiwi，Yen。」不管这句话到底是什么意思。", "我移动到他的身后，站在他的右边。他依旧站著，这样我就能不动声色的偷窥他的视线看向何处。在他不停的喧闹和动作中，似乎完全没有注意到我。我靠向他。", "「ＪＢ。」", "ＪＢ仿佛突然看到一只小动物冲出似的，猛然停下动作，透过萤幕凝视著远方至少五、六秒钟的时间。他突然把头迅速转向右边，也就是我站的地方，然后又转向左边，然后又转向右边。老实说，我不确定他是在演哪出默剧，还是他真的没有看到我。没人注意到我们，其他人还继续盯著萤幕。", "「ＪＢ。」我又叫他一遍，ＪＢ慢慢将目光转向我。我抬头看ＪＢ，他低头看我。", "「嗨！ＪＢ。我叫盖瑞。」我伸出手，结结巴巴的说。", "ＪＢ看著我的手。我感觉他看了好久，比他应该看的时间还长许多。他再次将目光转向我的脸。我的手已经伸出一段时间，我也再次看著他。不管出于什么原因，他的脸上一直保持震惊的表情。", "然后，突然，那张脸露出笑容。他用力抓住我的手，好像要把它拔下来一样。", "「他妈的小伙子！你这条领带他妈的是从哪里弄来的？」", "我低头看著我的领带。蓝色的，宽的，黄色条纹。ＪＢ的手仍然握住我的手。", "「嗯。我不太确定，老兄。我记得是 Next 成衣店买来的？」", "ＪＢ挥挥手，我猜应该是要我把椅子搬过来的意思，于是我将椅子拉过去，在他的文件柜前坐下，倾身去看他的萤幕。我当时想，这些闪烁的线条和数字看起来真像赛马场下注的萤幕啊！事后回想，至少其中一个可能还真的就是。", "随著我的到来，ＪＢ似乎立刻对那些闪烁的数字失去兴趣。他稍微转动椅子，用侧脸对著我，然后维持这样的姿势，前一秒还在转头从右肩对我说话，下一秒就越过左肩对著电脑大喊大叫，对我进行一次令人意外的私人访问。ＪＢ想知道我是从哪里来的，以及我为什么会出现在这里。他想知道我支持的职业足球队是哪支，并对我的衣服来源产生浓厚的兴趣。", "他的行为令当时的我困惑。我之前在交易大厅的经验大多是乏味的试算表计算，以及对信用违约交换＊的粗浅接触。从来没人问过我的领带是哪里来的。在我已经拥有六年的交易大厅工作经验，回想起这件事，总算能看出强尼（ＪＢ的全名是强尼．布莱克斯通［Johnny Blackstone］）的问题所代表的真正意义。一般来说，交易大厅里不会允许二十岁的孩子随意进出。尤其像我一样外表和穿著一副是被父母送到当地的房仲办公室、想找个打工机会的二十岁孩子。你在交易大厅里能看到的二十岁，孩子通常出自父母也在交易大厅工作的家庭，他们的外表和谈吐跟我没有丝毫相似之处。我认为ＪＢ看到我，觉得有趣，又有点好奇。现在回想起来，如果我是他，我想我也会有同样的反应。", "ＪＢ听说我来自伊尔福德，他花了点时间弄清楚这里至少在某层意义上属于埃塞克斯郡，立刻表示他很开心。ＪＢ的女朋友，还有他的许多经纪人（无论是什么行业的经纪人）都来自埃塞克斯郡。他按下萤幕下方大黑盒子上数百万颗按钮之一，询问一个神秘人物是否去过伊尔福德。回答他的低沉嗓音带著明显的东伦敦腔。", "「噢，是的，伊尔福德。我年轻时经常去伊尔福德宫夜店，可是现在一切都变了……」", "ＪＢ发现我是莱顿东方足球队的球迷后，又更开心了。「东方！」他大喊，刻意将「东」拉得超长，仿佛他以前从不知道这个字怎么发音似的。接下来好几天，他都暱称我为「东方人」。", "ＪＢ告诉我他所有的背景。他在二十年前为了在牛津大学研读法律，移居英国。光听他浓厚的澳洲口音，我还以为他才刚搬离昆士兰不久呢！他发现自己讨厌法律，因此退学加入伦敦爱尔兰人队打橄榄球。然后，他进入经纪业；然后，当了交易员。当然，这不是伦敦政经学院的传统风格，也就是在研究反转矩阵的同时，撰写三十五份履历表及求职信。我相信这里头一定有曲折动听的故事，但和之前一样，我没有深入探究的时间。最后，ＪＢ终于告诉我「STIRT」代表的意思是「短期利率交易」（Short Term Interest Rates Trading）。我因此大大松了一口气。", "当ＪＢ得知我是因为赢了「交易游戏」才拿到实习机会，他再次表示开心。这个话题引起他的兴趣，让他开始长篇大论的表演一出关于交易和他的交易之旅的独白，虽然老实说，我看不太懂。他给我看许多图表，讲很多故事。我看看强尼的眼睛，再看看图表。我望著两者之间的距离，思考，或者该说是，我瞇起眼睛做出我在思考的假象。我在想，他能不能看出我其实听不懂呢？", "聆听其他交易员的谈话占了我早期的交易经验中极重的比例。静静的聆听，睿智的点头，做出一副深思好男孩的模样，虽然实际上脑子里一片空白。当时的我对自己的理解力如此贫乏感到绝望，以致一直无法理解，为什么没人发现我明明听不懂还要装懂的行为。然而，在金融界和经济领域工作十五年后，我终于知道原因。因为每个人都在这么做，无时无刻。", "话说回来，想必我掩饰得相当不错，因为我的连连点头显然让他很开心。ＪＢ和我一见如故，相处得十分融洽（在初次谈话的十五年后，我为了自己的「十二步康复计划」中第九步，约ＪＢ在一家俯瞰泰晤士河的老酒吧见面。他告诉我一些当时我并不知道的事，解释他为什么会这么快就喜欢上我，以及他以前说话的速度为何会那么快。不过在我们刚认识时，我以为只是因为他人很好，而且也许我真的很有魅力）。", "经过大约两小时的热烈交谈后，ＪＢ决定该把我送走。他将椅子转了一圈，挡住中央通道，然后对著他身后的交易员以毫无必要的音量大喊。", "「霍布西（Hobbsy）！」", "霍布西的身体微微抖了一下，几秒钟后，他以非常缓慢的速度转动椅子，面向我们。", "「来认识加札＊。东方足球队球迷。」", "我飞快起身，伸出手，等待霍布西和我相握。", "霍布西没有握住我的手，而是以一种无论现在或当时在社交上都算无礼的方式，慢慢的看了我一眼。他坐著，我伸长手站著，他非常缓慢的从我的头一路打量到我的脚。然后，他停下来，或许是在思考。接著，再从我的脚一路往上看回我的头。", "他又停顿一下，转身回到自己的座位，拉开文件柜抽屉，拿出一张名片，站起来，不急不缓的转身，把名片放在我手上。", "我看一看名片，上面印著：「欧元利率交易组长。鲁伯特．霍布豪斯（Rupert Hobhouse）。」", "我抬起头，视线越过名片上方，看向鲁伯特．霍布豪斯──也就是「霍布西」的脸。", "直到那时，鲁伯特．霍布豪斯才向我伸出自己的手。", "「我是鲁伯特．霍布豪斯。」他说：「欧元利率交易组。」", "「嗨！鲁伯特。」在鲁伯特几乎捏碎我的手时，我说：「我是盖瑞，很高兴认识你。」", "在鲁伯特扫视我的同时，我也有很多时间观察他的脸。娃娃脸，却又一副严肃忧虑的模样，英俊，但有点过胖。他应该三十出头。厚厚的黑框眼镜在专业打理的棕色短发下框住他的眼睛。他看起来很像在六岁时被父母出乎意料的送到寄宿学校，直到二十一岁才接他回家的那种典型富家子弟。我后来才发现他的经历其实和我猜测的相去不远。他的体格看起来就是那种从出生就吃得很好，使得原本的肌肉浮上一层油，仿佛身体很努力的想找出新方法来用掉所有的营养。他的体型就像他身上那件显然很昂贵的衬衫一样，在某些接缝处都显得太过紧绷，明显在试探暴力拉扯的忍耐上限。", "鲁伯特一言不发的转回去，ＪＢ则出去上厕所。我想这是要我坐在鲁伯特旁边的意思。既然距离这么近，我只需稍微转动一下椅子，就能坐在他后方，望向他肩膀上方的萤幕墙。", "鲁伯特的肢体语言并没有因为我的存在而有所不同，但他立即展开一段关于他工作性质的独白。考虑到我们当时的特定周围环境，他的独白应该只说给我一个人听。因为两人并没有眼神交流，所以我用不著努力点头，于是我决定有时做点笔记，有时前倾观察萤幕。", "鲁伯特．霍布豪斯是资深欧元汇率交易员。这一点至少已经被确认过两次。迄今为止，欧元是交易小组中最大、最重要的货币，责任由他和他的下属阮洪共同、但非均分的承担。鲁伯特没有看向阮洪便对他做了个手势，于是我转过身来看著那个人。我认出阮这个姓氏应该属于越南人，我猜想他是否是伦敦政经学院国际学生那种类型，但他很快就笑著对我说：「你好吗，老兄？叫我洪哥就好！」后来我才知道他根本来自英格兰的诺维奇。", "做欧元换汇交易涉及大量交易、重大风险和巨额交易量（我一直到此时才了解该小组的主要功能是进行换汇交易，嗯，尽管我还是不知道换汇交易是什么），他们必须持续和欧洲所有的大银行保持互动。", "鲁伯特此时对著他的一个萤幕挥手，上面有一长串随机单字和数字，我后来知道它是一份交易纪录：一份逐项列出他当天所做的全部交易的完整纪录。我点点头，随便选了几个数字，写在笔记本上。", "鲁伯特到现在还是没看我一眼，他和阮洪──老实说，尤其是阮洪──看起来确实比ＪＢ忙碌多了。小组其他交易员经常会对他俩喊出一些数字和单字，这些似乎都需要沉思、消化和回应。他们的萤幕和扬声器定期会发出哔哔声来指挥他们，而且似乎每个哔哔声都必须得到后续动作的回应。", "在接下来的半小时里，鲁伯特简洁紧凑的阐述他的交易哲学，他以愈来愈长的单字清单和彩色数字来举例。虽然比ＪＢ的解释稍微容易理解一点点，但两者的风格截然不同。ＪＢ的独白充满情感和激情；鲁伯特的，却是精确到让我怀疑他有强迫症。我无法判断谁是更好的交易员，但我可以猜测在酒吧里，哪一个人会比较容易交到朋友。", "等鲁伯特说完他对换汇交易的分析，反而让我比之前更加困惑。", "鲁伯特没有问过任何关于我的事情，因为他已经了解我的一切。或者应该说，他已经知道我对ＪＢ说过的一切。这有点令人不安，因为我当时并不知道他，或者居然有任何其他人一直在听我和ＪＢ的对话。在每个人的扬声器不断发出的哔哔声中，他竟然能分辨我的声音，著实叫人无法置信。", "即使难度很高，鲁伯特显然还是做到了，因为他记得我对ＪＢ说过的大部分细节。如我预料的，他想补的部分是我之前念过的学校。这个问题对我来说，是一个潜在陷阱，我曾因销售毒品而被一流明星高中开除，我从一流明星高中转到综合高中的事实，明白的列在我的履历表上。不只迦勒，说不定鲁伯特都有机会看到。不过我已经为这问题做好准备，我告诉鲁伯特，我之所以离开一流明星高中转去综合高中，是因为我听说大学招生时对综合高中的学生有预留名额。鲁伯特的脸几乎没有表情，但我看得出来他喜欢我的答案──他紧闭的唇角轻轻浮现一丝英式的微笑，仿佛不经意间漏出的一点乐音。", "在问完我的学历后，鲁伯特开始谈论他真正想问我的问题。直到现在，他才第一次正眼看我。他打开办公桌抽屉最上层放名片的托盘，拿出一叠交易游戏卡，将它们放在我面前的桌子上，然后像猫头鹰一样只转动脖子，第一次将他的脸转过来面对我。", "「告诉我你是如何当上交易游戏冠军的。」", "突然的眼神交流加上他怪异的动作，打得我措手不及，一时间说不出话来。但我很快稳住自己，并开始向他解释我的思路：理想的策略取决于对手的程度；如果对手很弱，光是简单的套利就可致胜；比赛时，即使心思缜密一点的选手通常还是会不知如何应付我的虚张声势，并且可能受到我激进的大声叫价干扰。我在解说时，鲁伯特一直盯著我看，动也不动。当他的电脑哔哔叫时，他也不理睬。洪哥代他接了起来。令我惊讶的是，不知道出于什么原因，鲁伯特选择完全忘记「倾听」和「忽略」之间存在的所有细微灰色地带。一年后，无缘无故，鲁伯特．霍布豪斯带我去拉斯维加斯，并向我解释，只需十个问题，他就可以肯定一个女人是否会愿意和他上床。不过，他从未告诉我这十个问题是什么。", "在解释完我的交易游戏策略后，鲁伯特不发一言，只是重回他的电脑前继续工作，仿佛他从未离开过它们一样。我们之间陷入沉重的静默。我仍然笨拙的跨坐在鲁伯特左方、属于另一边不知名交易员的文件柜上。周围完全没有人搭理我，让我原本就已经可笑的姿态更加引人瞩目。", "那时已接近午休时间，为了缓解尴尬，我挤进鲁伯特的眼角余光里说：「呃……你想要我去……帮你买午餐吗？」", "对于这句话，鲁伯特少见的出现实际反应。他将整个身子一转，自然的扬起一侧眉毛，从口袋掏出钱包，递给我一张五十英镑钞票。", "「好。顺便也为迦勒、洪哥和ＪＢ买午餐。」", "老实说，听到他的答复我松了一大口气。我以前也经常为ＤＦＳ沙发的门巿人员买午餐，这似乎是一种既能吸引前辈注意，又能让大家对你有好感的简单方法。我迅速转身，搜集所有人的午餐订单，然后溜出交易大厅。", "金丝雀码头上的摩天大楼全和一个巨大的地下商城连接在一起。我想这在某种程度上使它们变成一座极大的建筑。当我走过这些巨大、宽阔、人工照明的走廊，从一家外带餐厅转到另一家外带餐厅时，我感到我的平衡感终于又回来了。和鲁伯特的对谈，嗯，如果你可以称它是对谈，它将我肺里的空气全部抽光。", "买完，我赶紧回到交易大厅，一言不发的将每个交易员的午餐放到他们旁边的桌子上。我走到鲁伯特身边时，放下他的午餐，还有找回来的零钱：一张十英镑纸钞，以及纸钞上堆著的硬币。", "鲁伯特以一种人们听到钱掉在地上时会有的本能反应，很快的转头看著硬币。", "「那是什么？」", "「呃……是找给你的零钱。」", "鲁伯特没有动，也没有说话，只是继续盯著那堆硬币。我觉得我可能给错答案，于是我尝试其他的说法。", "「呃……十一英镑七十四便士。」", "我知道是十一英镑七十四便士，因为我记下每个人点的午餐价格，很快的做了心算，以确保鲁伯特得到正确的找零。", "鲁伯特打开最上层的抽屉，将钱一路滑过桌子，从边缘掉进抽屉里。然后他转向我，一副好像要告诉我什么秘密似的，却又用一种与我们所处的情况完全不相符的凶猛眼光打量我。", "「在我们这里，从来不需要找零的。」", "这种事我还真是一辈子都没听说过。", "接下来的几天流程都差不多。早上醒来，坐在冰冷的浴缸里用橡胶管冲澡。我会很早抵达办公室──事实上，我每天抵达的时间愈来愈早，原因我待会再解释。迦勒还是有点同情心的，他让我处理一些复杂但最终没什么用的试算表，所以我每天早上都会花两、三个小时，研究如何在 Excel 试算表上将间隔的横行填上柔和的颜色。等早晨的时光匆匆过去后，我会视鲁伯特和ＪＢ的心情，判断当天谁比较乐意和我坐在一起。虽然每次看起来似乎都是ＪＢ更愿意些，但我学会判断鲁伯特不外露的微妙情绪。让这两位前辈留下深刻印象，将会是我迈向百万富翁生活的通行证，所以我竭尽全力的想让他们满意。", "陪ＪＢ工作很轻松。他只想有个观众可以听他的故事和笑话，而且老实说，他的故事和笑话都还满有趣的。他想听我说东伦敦的生活，想听ＤＦＳ沙发店的枕头大战，想听我和父亲在周末一起看东方足球队在雪地里跟达格纳姆与红桥队零比零踢和的故事。陪伴鲁伯特的情况就复杂多了，我很快发现，鲁伯特最喜欢的是抓到我犯错的时候。事实上，他喜欢的不是我犯错的事，而是「我」错了，然后完全且彻底的接受指责，毫无保留且虔诚的道歉，收起我的矜持和悔恨，用坚忍的表情凝视空中，保证我会改正，成为一个更好的人。鲁伯特非常喜欢这套把戏，所以我打定主意要经常这么做，下定决心要让自己犯错的次数远超过做对的次数。", "度过一个这样的早上后，基于第一天的良好经验，我会主动提议出去帮每个人买午餐。每个交易员会从不同的餐厅点不同的食物，不只要确定大家拿到的餐点都是正确的，事实上，光是要将它们全带回交易大厅就很不容易，不过这是展现我的基本能力和可靠形象的最简单方法；直到今天，我仍坚信它是我在第二次实习那周所扮演的最重要角色。一开始，我对是否该遵循鲁伯特留下找零的指示感到犹豫，但他说那句话的态度是如此直接明白，使我别无选择，只能照做。几天后，迦勒评论说现在的午餐变得愈来愈贵，而且找零都没拿回来，但是他说这句话的时候，以看著长子的温暖眼神看著我，于是我那时就知道，虽然难以置信，但是我的做法一定是对的。这群人真是奇怪，我心想。感谢他们的午餐不找零惯例，我每天的收入硬是多出二十英镑。", "透过不时的闲聊，我搜集到一些讯息，进一步认识这个小组的人。我了解到，二十八岁的迦勒是交易大厅有史以来最年轻的董事总经理。虽然我不知道董事总经理或「ＭＤ」到底是什么，但显然是极为重大的成就。他在日本花旗集团表现得非常杰出，最近才被调到伦敦，担任部门主管。那个坐在角落沉默寡言的银发比尔，是花旗几年前从哈里法克斯银行挖角过来的，但令鲁伯特既懊恼又高兴的是，他并没有交出好成绩。我也听说，比尔从未上过大学，在学历上显然比小组其他交易员逊色。也许这就是他为何总是沉默。", "下午通常安静许多，迦勒会散步到我的角落，检查试算表中的数学计算和令人印象深刻的配色，并对我使用的公式发表评论。迦勒拥有美国史丹佛大学的经济学学位，他的背景与我最为接近。他说的语言是数学、数字和公式，但不知道为什么，丝毫无损他的魅力。迦勒希望我能快速掌握逻辑和数学之间的关系，以及小组金融商品的操作理论。这一点，总算和我的实际训练搭上线。在所有和我交谈过的交易员里，我觉得迦勒是唯一一个能够真正看透「我了解你在说什么」面具的人。不知道为什么，你能感觉到他知道你懂什么，不懂什么。你会感觉他真的了解你。", "小组里还有另一个交易员，完全看穿我其实不知道自己在做什么，那就是史努比。我听说史努比并不是透过正常的毕业生招募计划进来。银行原本聘请他的职位是电脑程式工程师，只是迦勒很快就将他转为交易员。这或许可以解释为什么他总是一副十六岁的孩子想偷买伏特加的样子。史努比没有金融和经济背景，在交易大厅工作的时间也不长。因此，他的思维还不习惯绝望的点头，他立刻就发现我听不懂谈话内容。对我来说，幸运的是，史努比也同样听不懂。", "天知道史努比和我的背景并没有丝毫相似之处，史努比长大的世界和我截然不同。他家位于风景如画的牛津郡乡村高尔夫球场社区，和前外交部长大卫．卡麦隆是邻居。他的祖先连续十七代全是广受爱载的高收入医生。他从来没有饿著肚子上床睡觉过（从外表就看得出来）。不知道为什么，尽管我们之间有许多不同，但我们还是立刻对彼此产生好感，建立起密切的关系。我知道史努比一无所知，史努比也知道我一无所知。我知道史努比不应该出现在交易大厅，史努比也知道我不应该出现在交易大厅。我们都知道，在某种深层且本能的层面上，周围的人全是真正的疯子，千万不能让他们发现我们的真正情况。我俩是正驶向埋藏宝藏的海盗船上的偷渡者，我们必须保持镇静，直到抵达目的地。也许，如果我们坚持得够久，我们就有可能抢在其他疯子前面找到宝藏。", "由于史努比的位子和小组其他人有些距离，所以在第一天结束时我就坦白告诉史努比，我那天分别和ＪＢ、鲁伯特互动满长一段时间，可是我几乎听不懂他们说的任何一句话。", "「听好了，兄弟。」史努比仿佛在密谋什么似的靠过来轻声说：「用不著担心。没有人真的明白任何事。你看到那边那个人了吗？」", "史努比的大拇指抵在左肩上，悄悄做了个手势；他指的是那个肤色黝黑、声音低沉的义大利人。", "「那人叫罗伦佐．迪．卢卡。他是我见过最蠢的人了。他唯一会做的事就是出去玩女人。我甚至不确定他是否会说英语。有一天，他上班迟到了三小时，当迦勒问他为什么，他只是耸耸肩说『瑞典新年』。那家伙是个十足的白痴，但他还是为这个小组赚了好几百万。如果那个人能做到，任何人都能做到。别担心，兄弟，我们可以的，保持冷静。」", "我看著罗伦佐．迪．卢卡。他是还算英俊，嗯，看起来确实有点傻。我看著他以低沉的义大利语对著耳机大笑。好，我想。嗯，的确有趣。", "史努比继续说：「还有啊！兄弟，你永远不会从ＪＢ和鲁伯特那里学到任何东西，他们根本不知道自己在做什么。如果你真的想学，你应该去找比尔谈谈。」", "又是这个名字。比尔。我转头看他。他还是老样子，顶著球形白发，像个哈比人似的，坐在办公椅上朝著窗户将巨大的棕色手提电话夹在耳朵和肩膀之间。每个人都对我提到比尔，但我还没找到和他说话的机会。每次我一靠近，他总会像只被抓到在舔自己的猫似的飞快转头，我只好迅速的朝另一个方向走开。", "好，比尔。为了接近比尔，我想出一个计划。", "我注意到比尔喝很多咖啡。我问史努比他喝哪一种咖啡，他回答是卡布奇诺。于是我第二天早上六点三十分就到办公室，这样我就能在比尔进来前在他的桌子上放一杯卡布奇诺。问题是六点三十分时，比尔已经到了。整个交易大厅里只有他一个人，矮小的身影独自坐在黑暗的角落里。他妈的，这家伙什么时候来的？但至少他手上还没有咖啡，也还没在讲电话。我走上前问他是否可以为他准备咖啡。比尔没有转身，只是将识别证摔在桌上。在交易大厅楼层有家小咖啡店，只要出示识别证就能购买。", "「好，你去吧！也帮自己买一杯，伙计。」", "我拿起识别证。照片里的比尔皱著眉头。上面写著「威廉．道格拉斯．安东尼．盖瑞．托马斯」。", "隔天，星期三，我在五点四十五分抵达。谢天谢地，那家伙还没到。于是我买了一杯卡布奇诺，放在他的桌上。六点五分，比尔还没到，咖啡肯定已经冷了，所以我把它丢掉，再买一杯。六点十五分，我重复刚才的动作，幸运的是，比尔接著就走了进来。当比尔坐下看到咖啡时，我故意转开目光，因为我不想让他看到我在看他。但他肯定已经坐下来，因为我听到他用浓重的利物浦腔大喊：", "「谢谢盖尔。」", "我装出一脸惊讶，转过身来回应：「喔，嗯，不用客气。比尔。不用客气。」", "隔天，我六点进办公室，做了同样的事。", "隔天，星期五，是我在小组的最后一天。比尔已经带著自己买的卡布奇诺进来了。他走过时将杯子放在我桌上。", "「谢谢盖尔。你回来时，就过来和我一起坐吧！」", "我成功了。", "我想再讲一个比尔的小故事，好让大家能更了解他一点，也许能更能理解为什么我这么想给他留下好印象。", "比尔是英镑交易员，他是观察英国经济的主要负责人。我进小组上班的第二天，是周二，当天早上会公布一些英国的经济数据。具体而言是什么，我不记得，好像是通货膨胀之类的。", "就在数据出来之前，隔壁部门的人玩得很开心，听音乐、大笑、跳舞。尽管我当时不知道他们其实是销售员，不是交易员，不过他们这种行为并不罕见。", "比尔和我一样，比交易大厅平均的巨人身高矮了二十多公分。他站起来，走到隔壁部门，请他们把音乐关小声一点。", "他们照做，比尔走回来坐下，像只老鹰一样，继续观察，等待数据。数据应该是延迟发布了，因为几分钟后，音乐又变大声。比尔再度过去，态度更加坚决的要求把音乐关小声点。", "乐音再度被调降，比尔继续全神贯注的等待。", "几分钟后，音量再次变大。比尔没有站起来。销售部门正好坐在比尔对面，只不过被两堵巨大的萤幕墙隔开，分别是比尔的和他们自己的萤幕，电线都汇集到萤幕之间的桌子中央一个圆孔，播放音乐的扬声器的连接线也是如此。", "比尔一言不发的拉开办公桌抽屉，拿出一把剪刀，剪断扬声器的连接线。态度平静得不得了。你甚至猜不到他刚才在做什么。他的目光几乎没从萤幕上移开。", "音乐当然立刻停下，销售人员过了好几秒才意识到发生什么事。当然，最终他们还是发现真相。他们的部门主管，一个高大、金发、大鼻子、优雅得难以形容的英国人阿奇博尔德．奎格利，冲过来大吼大叫，好像要和我们打一架似的。", "迦勒当然注意到这个不寻常的状况，只得迅速从座位上跳起来，动手阻止他。阿奇当著他的面破口大骂。", "比尔继续盯著萤幕，眼睛眨都没眨一下。", "我认为他真是个他妈的伟大传奇。", "在我实习的最后一天，鲁伯特和迦勒为我准备一个惊喜。", "他们两个似乎从我的午餐之旅中找到某种奇怪的乐趣，并且故意让事情一天比一天更加复杂。他们会要求从不同且遥远的餐厅购买某种食物，或者对他们的餐点进行特殊调整。他们会请我为分散在交易大厅各个位置的朋友提供午餐。有时候，我甚至怀疑他们是不是真的认识他们白送午餐的那些人。我猜他们可能是想测试我能否胜任（我当然能。毕竟这是我在那个实习周必须做且唯一称得上还算复杂的事）。最重要的是，我认为他们就是喜欢看到我慌张的样子。", "十点三十分，迦勒叫我过去。", "「我要请整层楼的人吃午餐。」", "他说得好像这只是一件小事，但交易大厅楼层可真是他妈的大啊！", "我没有翻脸。他想看到我翻脸，我知道。我只是回望他，看著他的眼睛，说：", "「好的，没有问题。」", "他很喜欢我的回应。", "这是一次大规模行动，我不可能独自完成。我去交易大厅的每个小组，向他们解释即将发生的事。迦勒为了请这顿饭，至少要花上数千英镑。我必须说服各部门经理将他们组内的新进员工借给我一个小时。这是唯一可行的操作方法。我没办法借到每一组的人，最后我肯定至少自己送了一百个汉堡。回想起来，我觉得当时多多少少有些故意羞辱的成分，但老实说，我并不在乎。就在两年前，我每年三百六十四天每天早上七点出门派送报纸，赚取每周十二英镑的工资。我还记得有一天，在我送完报纸后，老板叫我进办公室，告诉我他要把我的薪水从十三英镑减成十二英镑。我曾将一大份周日报纸误送到错误的地址，结果当天的薪水就被扣光。这些家伙一周付我七百英镑叫我送汉堡。他们是我成为百万富翁的最好机会，如果他们想要的话，叫我去扫厕所，我都没有意见。", "当我送完所有的汉堡时，已是下午二点。我筋疲力尽的坐在我半靠著走道的角落位子上，喘著气。鲁伯特和迦勒把椅子都转了九十度，这样他们面对的就不是电脑，而是我了。但我没理他们。", "「嘿！盖瑞！」迦勒大喊。他坐在远远的另一头。", "我转身看著他，看到他在鲁伯特身后露出一个大大的笑容。他们两个都将身子往后靠在椅背上。", "「你有护照吗？」", "我有办护照。两年前我和朋友们为了庆祝大学预科会考结束，而吐遍西班牙特内里费岛的每个角落。", "「回家去拿吧！你要去滑雪了。」", "★★★★★", "我在开往斯特拉特福的列车上，传简讯给我老爸。", "「我的护照在哪里？」我问他。", "「在我床底下的抽屉里。」他回答。", "它就在那里。埋在他的内裤下面。", "你知道吗？当人们去滑雪时，他们真的是从山顶滑下来的。当他们这么做时，可以看到周围所有被雪覆盖的其他山脉。我不知道情况居然是这样的，但这就是事实。这就是他们的日常。", "我妈妈传简讯给我。", "「意思是你拿到这份工作了？」", "「我不确定。大概是。」", "然后，她开始向我要钱。", "＊编注：Canary Wharf；伦敦重要的商务区之一，数栋英国最高的建筑物坐落于此。⤴", "＊译注：英国大部分的学士课程只需三年。⤴", "＊编注：credit default swaps；一种保护投资者免受债务违约风险的衍生性金融商品。⤴", "＊译注：Gazza；澳洲腔发音的盖瑞。⤴"], "wcount": 30879}, {"icon": "2", "title": "第2章 正式成为交易的猴子", "paras": ["小节 1", "三月那一周让我得到在 STIRT 小组暑期实习的机会。暑假时，当我出现在交易大厅，每个人都已经知道我是谁：我是那个帮所有人都买汉堡的孩子。迦勒的小动作让大家知道他想要我，既然迦勒想要我，每个人都想要我。信贷交易小组因此大力争取我，却让迦勒更想要我。即使我还是完全不知道大家究竟在做什么，可是似乎没人在乎，或者更准确的说，没人将这个事实列入考虑。我猜这种情况其实就是「投机泡沫」，如果你坐下来仔细思考，就能从这个例子看透比特币背后的运作原理。", "通往成功的道路已经出现，我可以闻到未来每一步的味道。我在期末考大杀四方，现在我要好好享受我的暑期实习。以它为起点，我会得到一份全职工作；一年后，也就是我大学毕业的时候，我就会开始这份工作。我会拚命努力成为全世界最棒的交易员，然后在某个时间点就会变成百万富翁。我的计划确实缺乏细节，比如我不知道如何交易，但我绝不会让这种小事阻扰我。无论如何，我都会迎难而上。", "那年夏天，我埋头苦干，全力赢得所有的实习竞赛。「交易比赛」一共办了三场，我每场都赢。其实每场都有一些小技巧，只要你搞得够清楚，就能善加利用，毕竟它们也不过是被设计出来的游戏。我还另外赢得一场公开演讲比赛。关于那场，我就真的不知道该告诉你什么了。我猜，可能因为我就是个竞争心极重的人，怎么样都要赢？", "马蒂兹也在花旗实习。他肯定在交易游戏决赛时结识什么大人物，他真的很长袖善舞。整个实习期间，他都在拥有超高科技、大量试算表、数百万条公式的超新潮「信贷结构」部门喝咖啡和吃咖啡因药丸。当时他们被视为世界之神。马蒂兹在实习期间几乎没回过家。他整天都挂在微软的 Excel 上忙个不停，晚上则直接睡在桌子底下。他会将闹钟设在凌晨五点，以便在任何人进来之前清醒，这样就没人知道他在办公室待一整晚。实习结束时，花旗给了他一份全职工作，但他拒绝，转身去剑桥大学攻读资讯硕士学位。然后，隔年夏天，他又回花旗实习。我猜，有的人就是脑袋不正常。", "晚上，当所有人都回家后，在马蒂兹还在和试算表奋战时，我常常走过去坐在他身边。他是个高大强壮的家伙，但那时他搁在滑鼠和键盘上的手也会微微颤抖，疲倦的眼睛常常无神的四处张望。", "在一次这种场景的谈话中，我问马蒂兹，他觉得我应该怎么利用我最近获得的新人气。", "马蒂兹的观点很明确：「不要加入 STIRT 小组。」他以「不合时宜」来形容这些交易员，指他们还「停留在一九八○年代」。我一点都不在乎这方面的看法，但马蒂兹的下一个论点却令我颇为不安：", "「外汇交易员赚不到任何钱。」", "尽管 STIRT 代表「短期利率交易」，但它仍然属于外汇部门。交易大厅里天才信贷交易员的普遍共识是：外汇交易员都是白痴，他们的角色很快就会被电脑取代。这条路没有未来。他们提到外汇交易员时，真的就叫他们「猴子」，毕竟这个暱称是外汇交易员兴高采烈为自己取的绰号。然而，比这一切更危险、更尖锐的严厉控诉是外汇交易员都很穷。马蒂兹说了这么多，我在乎且担心的就只有这一点。", "尽管如此，出于某些我实在无法告诉你的原因，我想在那个阶段我已经下定决心。", "通常在闲聊之后，我会给马蒂兹留下一瓶蛮牛，或一杯咖啡。然后我就滚回家，他则继续留下来，睡在地板上。", "虽然在实习结束时，我已经拿到花旗毕业生培训计划的全职工作名额，可是在我不得不返回伦敦政经学院完成我最后一年的学业时，STIRT 的所有人依旧密切关注著我。每个男人都相信，如果不是因为年少时不幸受伤，或者命运的残酷考验，他们本来会成为一名职业运动员的。经由我的介绍，他们终于凑齐正常足球赛所需要的人数：只要承诺一场免费比赛和几杯啤酒，不管他们缺多少人，我都能从伊尔福德街上找到足够的孩子。足球赛意味著我每周都会见到大多数的 STIRT 成员。最好的球员是洪哥，以及你想不到的，顶著圆圆的小肚子到处跑的利物浦小个子比尔。在比赛时，你总能很快判断追在身后的是不是鲁伯特，因为他粗重的喘气声实在太过明显。", "迦勒和鲁伯特对我的关注尤其密切，甚至在我未入职的这一年里提出不少要求。当时我以为他们关系友好，直到过一段时间我才意识到，这两个人互相憎恨，他们对我做的事，其实更像是竞标。", "鲁伯特叫我和伊尔福德街上的孩子一起粉刷他在克莱姆的家。虽然我不是油漆工，但他愿意付我们每天一百英镑。他拿五十英镑的大钞给我，导致我根本找不到任何地方愿意找零。我拿著三张连号的五十英镑新钞去博姿药妆店买保湿霜，店员不肯卖我，我最后只能放弃，转身回家。鲁伯特的家超级大，共有三层楼，底层甚至有一个巨型影视厅。除了浴室之外，房子里没有任何的门，其他该装门的地方都装了可旋转的墙壁。他想要我们把它漆成白色，尽管它已经是白色的。随便他。我想，反正是他的钱。", "大约在四月时，迦勒叫我进公司一趟。他让我坐在一间全是玻璃墙的小办公室里。远远望去，可以看到码头另一边其他建筑物里的其他玻璃墙小办公室。", "一般来说，当你得到大型投资银行的工作机会时，你并不知道自己会被分派什么职位。你必须参加该银行的大型「研究生培训／轮调计划」，他们会在顶楼教室教你一些没人关心的废话，然后你得花上一年半的时间在交易部各小组之间轮调，希望有人看上你，给你一份工作。", "迦勒不希望我走这条路，他要我直接进他们小组。我不确定他知不知道，我其实清楚他们小组并不是最有前景的选择，但他给我两个明确的诱因：第一、我随时可以开始；第二、只要进他们小组，从第一天开始我就可以交易。这意味著损益试算表上会有一行列出我的名字，以及名字旁的清晰数字。这就是交易员获得报酬的方式，清清楚楚的金额，在你的名字旁边。一般人通常要花上好几年，才有机会走到这一步。", "也许这就是为什么马蒂兹告诉我那么多事后，我还是选择 STIRT 小组。也许在我二十一岁的幼稚、过度自信中，我认为如果他们让我上了损益表，几年内我就能将那一行变成银行里最大的数字。这个预感后来成为事实。也许不是原本我想的这样。也许理由是我喜欢比尔的利物浦口音和ＪＢ的足球故事，也许是鲁伯特的影视厅和他的旋转墙。也许只是迦勒在那个明亮的四月下午，在那个小玻璃办公室，挂上灿烂微笑看我的方式，他的眼睛就像我从窗户看到的码头水面一样闪闪发光。", "二○○八年六月二十六日星期四，是我在伦敦政经学院的最后一场考试，科目为「ＭＡ三○三：动态系统中的混沌理论」。我告诉迦勒下周一就会去上班。我得利用周末去买新裤子和新衬衫。", "迦勒和我谈过后，鲁伯特带我去洛杉矶和拉斯维加斯。在我们去女演员卡门．伊莱克特拉的生日派对时，一位交易员在加长型礼车里突然流鼻血，我想可能是因为海拔之类的原因，于是我递给他一张纸巾。不过，他没有接受。大概是因为我当时穿著一件二十英镑的Ｈ＆Ｍ灰色西服背心吧？", "当时的我应该要念书准备期末考的。", "我就这么进了 STIRT 小组。二十一岁，头发刚剃短，穿著 Topman 平价连锁店的尖头新皮鞋，在二○○八年六月三十日，距离我最后一次大学考试仅剩四天。我走进交易大厅，成为全金融城最年轻的交易员。我不知道为什么我把头发剃得那么短，只是感觉这么做是对的。", "在一年半前，也就是我第一次为期一周的实习结束后，我拿出那段时间所有搜集来的名片，一一向每个人发送电子邮件，表示感谢。我在这些电子邮件中写了不少内容，其中我特别要求他们提供我任何可能对职业生涯有帮助的建议，以及推荐值得阅读的书籍。", "外表看起来不太和善的中年英国人克拉基给我一封简短的回复。全部内容只有：", "很高兴认识你，盖瑞。不要急著进交易大厅。", "慢慢来，看看世界，享受青春。", "一旦你进去了，你就再也出不来了。", "祝你一切顺利！", "克拉基", "嗯，我没有采纳克拉基的意见。如今回想起来，那真是个聪明的忠告，只可惜我当时并不这么想。以前的我怎么这么不听劝呢？", "如果我试著解读自己二十一岁时的想法，我只能告诉你：我太过渴望了，也许已经渴望很久很久。睡在破旧的床垫上会让你产生这种心情。你懂我的意思吗？懂吗？", "如果你想抢劫银行，并且看到金库大门敞开，你会怎么做？你会站在那里等吗？", "再说了，没钱要怎么去看世界呢？", "去他的，该是我发光发热的时候了。", "从第一天起，我就知道一切都不一样了。任务不再只是「给他们留下好印象──买一些汉堡──得到一份工作」。现在我名字旁边的栏位明白列出盈利与亏损。那是我的钱。要发给我的钱。", "所以，我该怎么做呢？以下是我双管齐下的攻击计划：", "1. 学习交易。", "2. 掌控帐本。", "这个计划简单吧？不过，帐本又是什么？", "嗯，在 STIRT 小组里，每个人都是换汇交易的交易员。如果你不知道什么是换汇交易，请不要担心，这个阶段的我其实也不太清楚。你只需要知道，每种货币都是可以买卖的。STIRT 小组一共交易十种货币──欧元（ＥＵＲ）、英镑（ＧＢＰ）、瑞士法郎（ＣＨＦ）、三种北欧货币（瑞典克朗、挪威克朗、丹麦克朗）、日圆（ＪＰＹ），以及澳币（ＡＵＤ）、纽西兰币（ＮＺＤ）和加拿大币（ＣＡＤ）；这些货币都以强大的美元（ＵＳＤ）来买或卖。", "每个交易员都负责一种或多种货币。所以，如你所知，鲁伯特是资深欧元交易员，他和洪哥共享一本帐本；比尔负责英镑帐本；迦勒掌控瑞士法郎帐本；ＪＢ手下则有澳币、纽西兰币和日圆帐本。", "那么，一本帐本又有什么大不了的呢？", "帐本的重要之处在于，当你负责某种货币的帐本时，所有以该货币进行交易的客户和交易员都会直接来找你。为什么这是一件好事？", "嗯，记得我们从交易游戏中学到的知识吗？任何人可以随时向任何人询价，而那个人必须以「两点价差」来定价。例如，六十七－六十九，六十七意思是「我会以六十七元的价格买进，或者我会以六十九元的价格卖出」。现在，想像一下，有一群外部客户愿意以更大的价差进行交易游戏。例如，四点价差六十六－七十，表示「我愿以六十六元的价格买进，或以七十元的价格卖出」。这就是真实市场的大致运作方式。如果这种情况发生，你可以用六十六美元的价格从外部客户那里购入，转身立刻以六十七美元的价格售出，立即确保获得一美元的无风险利润。如果你愿意承担风险，持有一段时间，你甚至可能找到愿意支付六十八或六十九美元的客户，如此一来，你的利润便能变成两倍或三倍。这就是「掌控帐本」的意义。它意味著你能够接触到愿意以低于市场价格进行交易的客户，换句话说，几乎保证你一定能得到无风险的利润。应该不用我告诉你，这是一件非常好的事（顺带一提，如果你仔细想想，会发现这正是每次去国外度假时，汤玛斯．库克旅游集团在客人换汇时所做的事情）。", "此时你可能会问自己，为什么客户会愿意以低于市场的价格来进行交易？这是一个非常好的问题，但我在二十一岁时并没有想到要问这个问题。不过不必担心。再给它一点时间。", "现在，我们来谈谈如何才能掌控帐本。", "嗯，所有的无风险利润的另一面是，一旦你掌控某个货币的帐本，你就有义务随时提供报价。你永远不知道什么时候有人会需要瑞士法郎、或澳币、或任何你负责的货币的换汇交易。花旗银行提供二十四小时报价服务（纽约、雪梨和东京也设有换汇交易柜台），即使在你上厕所或在拉斯维加斯，都要有人提供报价。这就是为什么每个小组成员都有一个指定的合作伙伴，以防他们出于某种原因离开交易厅或失去行为能力（正如我们之后会看到的，有些交易员丧失行为能力的频率比其他交易员高出许多）。", "这个被称为「掩护交易员」的职务代理人负责的工作很重要。如果你不在办公室，掩护交易员为你的货币报价，该笔交易还是会记入你的帐本，而不是他的帐本，利润（或损失）同时也归你所有。因此，对初级交易员来说，掩护交易便成了大展身手的舞台。你可能会为同组的资深交易员赚钱（或亏钱）。你可以证明你身为报价交易员的能力，所以基本上可以将你掩护的交易当成自己的帐本。如果你能证明你是一个合格的、能为公司带来利益的掩护交易员，资深交易员会争取在他们离开座位时让你掩护他们。这会让每个人立刻明白，你理所当然的会是下一个拥有自己帐本的人，甚至可能会去帮你提醒老板，角落里那个看上去疲惫不堪、头发花白的交易员，可能不需要一个人掌控三种货币的帐本。", "但当你还是新人的时候，没有人会想要你当掩护。你本身就是一个风险，一种负债。你必须先赢得其他人的信任，这便成了两个目标的交会点：赢得其他人的信任，向他们证明你是一个优秀的掩护交易员；然后，希望他们会教你如何交易。", "好，我再一次需要在小组里锁定一个目标。让我们先暂停，分析一下现有的选择。", "第一个选项，很简单：比尔。比尔已经是我眼中的传奇人物，并被史努比（我尊重且信任他的意见）正式认证为外汇小组中最聪明的交易员。不仅如此，他是英国人，小个子，并不是个时髦的白痴。我们确实有很多共同点，应该可行。唯一的问题是，当我出现在他附近时，我看到史努会比很快的靠近那个角落，而且显然想占据那个位子。史努比的经验和资历比我多一年半。我要争赢他并不容易。", "另外两个显而易见的选项是鲁伯特和ＪＢ。我给这两人都留下深刻的印象，他们似乎都颇热中和我合作。我可能可以加入其中一个，但同样还是有一些问题。最明显的是他俩看起来都有点不正常。先来讲ＪＢ；ＪＢ毫无疑问的是一个可爱的人，到目前为止我已经听过他所有的故事，并且和他喝了不少啤酒。请记住，暑假实习期间我在这个小组待了整整五周。问题是，他说话的时速每小时快达一百万英里，不管他说的是关于交易的事，或其他话题，我通常完全听不懂。他可能不是心灵导师的好选择。不仅如此，还有一个似乎是从纽约调来的年轻交易员，他的外表神似科学怪人，就坐在ＪＢ旁边，所以那个位置可能也有人。", "那么，就剩下鲁伯特。他这边的正面理由很明显。第一，这家伙带我去过拉斯维加斯；第二，我帮忙粉刷他的卧室。这似乎是友谊的良好基础，不是吗？鲁伯特与洪哥一起负责欧元，但洪哥已经三十多岁，所以增加一个初级交易员似乎合情合理。他是资深欧元利率交易员，掌控小组里最重要的交易货币，所以他一定相当优秀，而且他的交易风格似乎很明智、有纪律，足以为我的学习奠定良好的基础。然而，另一方面，他却可能是个精神有问题的疯子。到目前为止，我已经和他相处足够长的时间，知道风险绝对存在。不过没有人是完美的，你懂吧？", "当然，我也可以考虑迦勒。迦勒一直被我当成备用选项。但是，算了吧！迦勒是老板。我不能那样做──当马屁精这种事，我做不来。", "所以我最终选了鲁伯特。或者我应该说，鲁伯特选择了我。", "史努比的位子移到比尔座位靠窗的角落，我被安排到接替他远离窗户、半坐在走道上的旧位子。我和大多数交易员之间隔著我左手边的空位。我不知道他们为什么要让这个位子永远空著。也许这是对我，以及之前对史努比的一种现实上的提醒，让小组里的初级交易员看清自己的地位。那个空位的左边就是鲁伯特，他在我上班的第一天的前半段时间完全忽视我。", "那天我到下午二点才吃午饭。在我回来时，鲁伯特正坐在我旁边的空办公椅上，在上面左右摇摆，叫人看了十分担心，但我试著装出一切正常的模样，坐下来，直视我的萤幕墙，但当他两个巨大的圆胖膝盖都向著我时，要假装他不存在就太难了。", "「你去哪里？」", "我转向他，假装没什么，一切都很正常。他拿著一个霓虹橙色的压力球，用力挤压。", "「喔，我只是去吃午饭，怎么了？」", "「你吃什么？」鲁伯特回答得有点太快，我还来不及把语调上扬就将问号说出来。", "「嗯，有……香肠和……豆类和……番茄？」", "「你从哪里弄来的？」", "「呃……我在楼下餐厅买的。」", "鲁伯特又用力捏了捏压力球，然后沉默不语的盯著我看很久。任何人在这种情况下都难免觉得尴尬，还好现在这里只有我和他两个人。", "「我在这个组工作十二年。我从来没有去过那个餐厅。我们．就．在．办公桌上．吃午饭。」", "然后他继续盯著我看，很久，我真的不知道该说什么。", "你知道吗？就在两个月前，我和鲁伯特在一个温暖而黑暗的夜晚，站在洛杉矶的 Jay-Z 庆功派对的游泳池边。鲁伯特一直在问一个穿著黄色比基尼的漂亮女孩她的生肖是什么。顺便说一下，鲁伯特属虎。我也是。", "不过，我不记得那女孩属什么了。", "好吧！我想。所以，以后都要这样，是吧？", "没问题。", "这并非单一事件。在我刚开始上班的几天，大部分时间都花在尝试在电脑上安装软体，和远在印度班加罗尔、名叫吉米．约翰的外包工程师通电话。鲁伯特养成一种习惯，他会突然而坚定的直接从我背后抓住我的双肩，大声喊叫一些像是：", "「英国消费者信心如何？」", "或：", "「美国服务业的ＰＭＩ（采购经理人指数）是多少？」", "我当然知道正确答案是「我不知道」。可怕的是，事实证明，这个答案已经远远不够。", "「这样的回答已经不够好了，盖瑞！你现在是交易员了！你必须知道！」", "这种要求因为几个原因令我感到不适。第一，「我不知道」策略在我整个实习过程中非常成功，以致放弃它感觉像是失去一条腿；其次，我甚至不知道ＰＭＩ代表什么，三个字母的缩写向来是我的弱点。有一次，当我在讲一通长途电话时，他又抓住我，并将我拖离座位。我惊慌失措，连忙采取另一种策略，大声喊：", "「四十七点一！」", "当然是随便猜测的。", "他的回应只能以暴跳如雷来形容，因为我喊出的数字既不正确又是随意编造的（无论何时，这两种都不该混在一起使用）。事后回想起来，我会挨骂也很正常。", "为了拯救我的神经系统，我做了两件事。", "第一，我偷偷去找史努比，问他ＰＭＩ到底是什么；以及我要怎么做，才能找到任何一天的确切数字。", "史努比给我看一份「经济数据公布日历」，上面完整列出全世界每天发布的所有经济数据，以及发布的确切时间。每一天公布的数据数量都很大，通常超过五十或六十个，不过它们通常在任何特定国家都是同一时间发布的，这意味著每天数据出来通常就是那三到四个重要的时间点。从那时起，我每天早上做的第一件事就是检查所有数据发布的时间，在我的诺基亚小手机上设定一堆提前五分钟的闹钟。从那以后，我再也没有弄错过数据资料；两周之后我的肩膀终于从鲁伯特的魔爪下解脱，实在让我大大松一口气。不过，在那之后整整三年，每一个工作日我都还是设定这些闹钟，虽然那时我已经不在乎数据发布，反正也没有人敢再抓我了。", "你知道吗？即使那是很久以前的事了，但有时候，甚至是现在，当我坐在笔记型电脑前，注意力不集中时，我发现自己会无意识的打开那个日历。今天，就在我写这篇文章的这一天，英国投入生产者物价指数（UK Inputs PPI）于上午七点公布，二二．六％，相当高。", "我做的第二件事是，我决定，如果有任何其他选择，任何选择，我都不要向鲁伯特．霍布豪斯学习怎么进行交易。", "小节 2", "这就是为什么我最后会和史宾格勒在一起的原因。", "西奥多．巴纳比．史宾格勒三世是，嗯，因为缺乏更贴切的形容词，所以只能说他是个白痴。", "老实说，这可能不太公平。他其实更像是一个白痴学者。", "在我的理想导师名单中，史宾格勒并不是第一选择，也不是第二选择，甚至第三选择。", "一旦我决定远离鲁伯特，我就想找机会试试和比尔能不能成为搭档。我设法说服他让我帮忙，将他的一些交易输入系统，但我在第一周就搞砸，导致他隔著大半个交易厅对我尖叫：「你让我赔了四万英镑，你他妈的混蛋！」", "四万英镑他妈的是我爸年薪的两倍。因此，我只好夹著尾巴回到最后的安全港，就像我第一天上班时那样，把我的椅子拉到ＪＢ旁边。", "可是现在ＪＢ旁边的位子有人占据──身材魁梧、神似科学怪人的西奥多．史宾格勒。", "西奥多．史宾格勒看起来和电视剧《怪胎一族》里的赫曼．蒙斯特一模一样。当我成为全职员工重返交易厅时，我立刻就注意到他晃著一个宛如鬼脸的大头在ＪＢ旁边走动。前一年冬季，迦勒解雇了三名交易员。我猜史宾格勒一定是上级眼中的明日之星，才会被请来取代这些人。", "我很快就发现，事实并非如此。", "实际情况是，史宾格勒在一年前被纽约分公司 STIRT 小组的美国毕业生培训计划录取，但他们很快发现这是一次严重的判断失误，并以某种方式说服迦勒接手。我一直不知道迦勒为了接收这份被诅咒的礼物，得到的回报是什么，但我真心希望他拿到的东西价值不菲。", "这孩子到底有什么不好？", "史宾格勒的身体形状像个巨大而笨重的马芬，走路姿势像一个随时会摔倒的农夫。他每天早上七点二十九分准时走进交易厅，只比正式迟到早一分钟。当他跌坐在位子上时，总会顺手压下扬声器上的按钮，并且呼叫他的其中一位经纪人。他喜欢在每个经纪人的名字后面加个「ｙ」，所以他会喊出类似这样的话：", "「嘿！格兰蒂（Granty）！」或是「嘿！米尔西（Millsy）！」或是「嘿！乔纳森尼（Johnathany）！」", "他来自南非约翰尼斯堡或开普敦之类的地方，所以他的口音我完全无法理解。", "不知道为什么，有一半的经纪人都来自埃塞克斯或东伦敦。他们几乎都是这么回应：", "「嘿！史宾格勒！你现在如何？你这个老流氓／你这个大帅哥／你这个疯子，昨晚太疯狂了，不是吗？你回家路上还好吗？」", "在我和史宾格勒坐在一起的第一个早晨，我得知他前一天晚上没有顺利回家，因为他在计程车上尿裤子。我会知道，是因为他非常公开的、甚至相当高兴的向他的经纪人讲述这件事。经纪人似乎觉得很好笑的反应让我惊讶极了，因为我只觉得非常恶心。ＪＢ回头看了史宾格勒一眼，他的眼神让我明白，我并不是唯一有那种感觉的人。", "我不记得史宾格勒是向哪个经纪人讲述这个故事，我想应该是格兰蒂。不过，这不是重点，因为史宾格勒随后一次又一次的压下别颗按钮，并以相同的词汇向七个不同的经纪人讲述同一个故事。每个经纪人都笑得很开心，甚至包括三个都叫卡斯滕的丹麦经纪人。整个过程持续半个小时。我到此时才明白，经纪人只要笑，就可以领到薪水。", "公开自己的不良卫生习惯，并不是史宾格勒唯一的问题。他会不由自主的、不断的、没完没了的跟我讲许多糟糕的笑话，不恰当的笑话、令人不能接受的笑话。ＪＢ每次都会骂他，但对他似乎完全没有影响，他似乎很享受别人的鄙视。每次ＪＢ责备他时，他痛苦的鬼脸会慢慢展开折缝，呆滞的眼睛也会开始发光，甚至露出微笑。", "他有时会讲反犹太主义的笑话。对于一个座位距离不到三公尺、有权决定他薪水的犹太老板兼南非巨人来说，无疑是非常不明智的行为。有一次，在他开这样的玩笑时，刚好迦勒走过他身后。迦勒一把抓住他的椅子靠背，瞬间将他旋转一百八十度。迦勒一言不发，只是低头瞪他。史宾格勒抬头看那张只比他大三岁的男人的脸，凝视他的眼睛，他张嘴，似乎想说话，却什么声音都没发出来，最后连他的嘴唇也完全停止动作。他看起来仿佛下一秒就要开始吸他的大拇指。他们就这样对望十五秒，然后迦勒深深叹一口气，将史宾格勒的椅子转回去，嘴里嘟嘟哝哝的走开。", "「想想你他妈的在做什么，你这个该死的智障！」", "史宾格勒无时无刻都在抓他的屁股，并以令人不安的速度吞吃汉堡。不过，最让我印象深刻的是史宾格勒和他妈妈之间的电话。每天一次，下午三点，史宾格勒的妈妈就会打电话进来。不知道为什么，他们会用佛拉蒙语＊聊上整整一小时。我很庆幸自己不会说佛拉蒙语，即使现在，直到今天，都觉得还好自己听不懂。", "最疯狂的是，我非常喜欢史宾格勒。为什么？", "可能因为他是一位极为出色的交易员。", "在我和史宾格勒、ＪＢ坐在一起大约十天后，鲁伯特突然过来，将一只胖手放在我的肩膀上，说：", "「今天中午，来跟我及几个经纪人一起吃饭。」", "我以前也见过经纪人。我们去拉斯维加斯时就有几个经纪人同行，我们去滑雪时也有经纪人同行。但我从未参加过经纪人午餐会，而且从来不曾只有我、鲁伯特和经纪人。", "我们乘坐一辆高级古典计程车进入市区，虽然搭地铁可能更快一点。当汽车缓缓驶进车流时，鲁伯特庞大的身躯将他向前的座位塞得满满的，我则坐在一张向后看的可折叠小椅子上。", "我看起来一定很紧张，因为鲁伯特突然问我：「你在紧张吗？」", "我告诉他我没事，然后他问我之前是否吃过日本料理，我诚实的回答说没有。然后他问我：「是因为你从来没用过筷子吗？」", "我第一次在他身上看到这种真正关心的表情。在我眼中，像是一种兄弟情谊，甚至是父爱。", "他把看起来很昂贵的棕色皮包放在计程车的地板上，拿出两枝钢笔。", "「看！」他对我说：「把你的小指和无名指弯成这样。」然后他把两根胖手指捏在一起，示范给我看。", "「这会在两根手指之间产生一个折缝，看到了吗？你可以将第一根筷子放进这个弯处，就像这样，然后用拇指底部将它固定在那里。」", "他用其中一枝钢笔示范一遍。", "「如此一来，你的拇指尖和另外两根手指就可以空出来，去握住另一根筷子。」他一边说，一边弯曲手指：「然后你就可以用这两根筷子来夹东西。」", "他用两枝钢笔的前端夹住我左手的皮肤。", "「来！」他把钢笔递给我。「你试试。」", "我试著照他的话做，结果两枝钢笔都掉到地上，鲁伯特露出微笑。", "鲁伯特不知道，令我焦虑的真正原因是我不知道在这家餐厅吃饭要花多少钱。它的店名由晦涩的日语组成，连用英文拼写出来我都做不到，根本无法先用 Google 查询，尽管我怀疑可能查了也没有帮助。离开花旗之前，我去趟提款机，从我的银行帐户里领了两百英镑的现金。因为我的每日提款上限就这么多。我担心再加上我钱包里原有的四十英镑，是不是还不够。", "我把地板上的两枝钢笔捡起来，还给鲁伯特。", "鲁伯特将它们放回皮包里，然后靠在计程车的座位上，深深呼出一口气，张开双臂搁在椅背上。", "「别担心那些经纪人。」他对我说：「不过是一群经纪人罢了。如果他们不当经纪人，就只能当公车司机。」", "直到现在，我还是用他教我的姿势拿筷子。", "经纪人到底是什么呢？", "人们有时会交替使用「经纪人」和「交易员」，可是事实上，这两种人的世界完全不同。这一点，即使是刚入行的我，也看得相当清楚，因为似乎所有经纪人都来自埃塞克斯或东伦敦。有趣的是，我们的交易大厅其实也在东伦敦，却根本听不到这些区域的口音。", "事实上，正如鲁伯特之前一针见血的评论，两种人的差异可不只是职称而已。至少在二○○八年，你若没有「顶级」大学的学位，几乎不可能进入交易大厅。即使在 STIRT 小组，除了比尔是个例外，包括我在内的每个交易员学历都相当辉煌。但大多数的经纪人根本没上过大学。", "办公区的扬声器传出经纪人的东伦敦腔。他们以悦耳的音调唱出数字，一个接著一个绵延不绝，让人不由得想起街头市场的蔬果摊贩。草莓，一斤一英镑；三个月欧元，四．三和四．六。我在伦敦的交易大厅工作已经是十年前的事，我好奇，如今那些声音是否还带著那么浓厚的东伦敦腔。我希望它们还是，但恐怕已经不是。", "经纪人的雇主不是银行，而是被称为「经纪公司」的同业联盟。严格来说，他们的角色就是为交易员搭起桥梁。不同交易员进行交易，经纪人负责将他们匹配在一起。重要的是，如果交易失利，经纪人不用承担任何风险，只有交易员会被追究。经纪人有点像房地产仲介。佣金是他们的主要收入来源，这表示他们希望你进行的交易愈多愈好，至于交易是赚是赔，他们一点都不在乎。", "理论上来说，因为有经纪人的存在，你才能在不让交易对象知道你想购入的情况下购入。如果是像花旗银行这样的大公司，而且想在不影响市价的情况下购入，这一点非常关键。比如说，如果你想以三十六的价格买进，你告诉你的经纪人后，他开始在金融城的每个扬声器大喊「三十六购入、三十六购入、三十六购入」，希望能找到愿意以这个价格售出的人。交易可以在没有任何人知道谁想购入的情况下发生，这样很好，因为如果每个人都知道买家是你，他们可能会在你购入之前推高价格。", "理论上是这样。实际上呢？", "实际上嘛……他们会组织经纪人午餐会。", "再把场景拉回和鲁伯特共乘的计程车。我们最后在伦敦市中心一家高档餐厅前停下。我很想告诉你这个地方的名字，但我真的不知道它叫什么。", "我可以告诉你的是，那是一家日本餐厅，一位穿著完美服饰的完美女服务生在一个小而完美的接待区完美的接待我们，只不过大白天的，接待区里还这么暗，让我有些不习惯。太过完美的一切令我头晕，有人领著我上楼，或者也可能是下楼，进入一个巨大的用餐区，光线从超大的窗户洒进来，但由于所有家具都是黑色的，让内部显得出奇的幽暗。", "还不到正中午，那些巨大的、漆黑的、造型前卫的完美圆形桌子旁几乎没有客人。女服务生带我们穿过宽敞的用餐区，走了很长一段路后，绕过一堵由玻璃瓶组成的墙。转弯后，我们进入一个隐蔽的区域，落地窗洒入的阳光照射在餐厅里最大、最黑的桌面，明亮刺眼的光线投射在挤成一堆、坐在桌子最远端的三个经纪人的脸上。", "我们一走进去，那三个人立刻分开，同时站起来，纷纷冲过来与我们握手。", "我仔细打量他们。一个满脸困惑的粗壮年轻人，一个有魅力但看起来有点阴险的中年人，还有一个至少六十岁的老人，他有一头浓密的白发，发量多到令人怀疑他的头是不是从未停止生长。", "那个大头的老人，以低沉到不可思议的声音自我介绍：", "「嗨，我叫大头（Bighead）。」", "当然，他的「ｈ」是不发音的。", "接下来，我们五个人试著找出一种不会太尴尬的方式坐下，因此围著巨大的圆桌展开一段舞蹈。这很困难，我发现自己的位子和桌子对面的鲁伯特隔了一大段距离。我的旁边坐著大头，我喜欢他，因为他浓重的东伦敦口音，浓密的白发，以及头的尺寸都让我想起我死去的爷爷，使我心情放松不少。虽然这也代表我不能坐在鲁伯特旁边。谈话像一条河流，从上游的经纪人流向下游的鲁伯特，我也喜欢这样，因为这意味著我不必回应什么，并且给了我很多时间观察。", "尽管大头的年纪最长，但主导谈话的并不是他，而是一个叫提摩西．特温汉姆的中年人。他的头发也很浓密，却黑得不可思议。双方交流极为顺畅，像蜂蜜一样细腻绵延，没有任何尴尬或停顿。有时，说话的人为了制造戏剧效果，会故意留下空白，这时大头便会以他低音大提琴般的声音来填补。坐在提摩西和鲁伯特中间的年轻经纪人什么也没说，只是在两人之间来回转动他的脸，像在观赏一场网球比赛似的，不停的点头，满脸热诚，偶尔猛的将头往后拉，发出咯咯笑声。", "当年轻经纪人这么做时，我也会笑，但态度温和许多。鲁伯特则从头到尾都没笑过。", "我们点了白酒，还有一大盘生鱼片。那时我还不知道生鱼片是什么，以为基本上就是没有米饭的寿司。鲁伯特向我解释（有点困难，因为我们的距离确实相当远）生鱼片比寿司对健康更好，而且吃生鱼片可以减肥。我看看盘子的大小，又看看鲁伯特的大小。我深深的点了点头。我向桌子中间伸长手，用一根完美的筷子刺向一小块粉白色的鱼，并试著将它平衡的移到我的盘子上。", "白酒很快的喝完，我也喝一点，尽管我不太喜欢葡萄酒，可是我不想失礼。餐厅播放一种节拍明显的低音音乐，从这天起，我就特别留意，发现这种背景音乐在伦敦昂贵的餐厅中几乎无处不在。过一段时间后，音乐、葡萄酒和谈话声开始融为一体，我发现我几乎听不见任何人说的任何话，还好我不必发言，所以发生这种情况也没什么关系。我只要认真向前倾身，靠著桌边，凝视说话的人，有时将眼光移向远处，然后点点头。我试著用鲁伯特教我的方法拿筷子，结果把三块鱼片掉到桌子上，其中一块甚至直接掉到地板上。", "第二道菜隔了一段时间才来，我一直热切的等待，因为那时我已经有些醉了，而且我在享用第一道菜时遇到一些技术性问题，主要是生鱼片很滑溜，而且离我很远。", "不幸的是，第二道菜并没有那么直截了当，因为端上桌的一个大盘子上，只放了生鸡肉和生牛肉。嗯，你可能知道生鸡肉不可直接食用，或者至少生吃是不安全的，我也确实怀疑这一点。可是直到一个小时前，我对生鱼也抱持相同的强烈信念，然而事实证明我是错的。所以我等了几分钟，想看看其他人会怎么做，但他们正热火朝天的在聊一个摩根史坦利资深欧元交易员的事，最终我不得不放弃等待。我伸长手，用两根筷子夹起一块生鸡肉，这是我第一次能够用筷子完好无损的夹起食物，送到我的盘子上。我把它吞下去了。天啊！实在是太恶心了。", "因为过于恶心，恶心到足以让我怀疑是否真有这个日本传统的存在，于是我靠向我很快和他建立起祖孙般好感的大头，伸手在桌子下轻轻推他。", "他转过身来靠向我，一脸要和我密谈的表情。", "「这鸡肉，」我低声对他说：「你不觉得它……有一点……恶心？？」", "也喝了不少酒的大头疑惑的看我，然后他看了看那一大盘生牛肉和生鸡肉，又转过身来看我。", "「你吃了鸡肉吗？」他看起来很困惑。", "「是啊，我当然吃了，那是鸡肉。我他妈的不吃它还能做什么？」", "我的新爷爷用发自丹田的力量大笑起来。他起身，掀开部分桌面。你相信吗？下面居然有一整片他妈的铁板，居然没有人告诉我。他笑了好久好久，却没有人知道他到底在笑什么，因为他没有将我刚才吃生鸡肉的事告诉任何人。老实说，我对此相当感激。", "这顿午餐吃了整整两个小时，没有人付钱。", "好吧！肯定有人付钱，但我没看到是谁付的。我唯一确定的是那个人不是我。而且没有人要求我付钱。", "然后我们所有人都喝得酩酊大醉，回到办公室继续工作。", "我真的不知道这顿饭背后的意义到底是什么。", "知道鲁伯特带我出去后，史宾格勒也同样跃跃欲试。", "嗯，你得明白，史宾格勒很寂寞。若不是因为寂寞，不会有人每天在上班时间用佛拉蒙语和妈妈讲上一小时的电话。如果你的工作场所有人这么做，你应该去关心一下，确保他们的精神没出大问题。史宾格勒和他妈妈相隔万里，离他的家乡很远很远，而且他不知道怎么做才能交到朋友。", "不过，如果你是伦敦大型投资银行的交易员，从某些角度来看，你其实不需要交朋友，因为多的是拿薪水来和你交朋友的人。对，我说的就是经纪人。史宾格勒觉得现在更多了一个我，他对此感到开心。", "因此，就在我与鲁伯特第一次共进午餐的两天后，史宾格勒就带我去了他自己的午餐会。史努比必须掩护北欧货币交易（那是史宾格勒的帐本，北欧货币），我和史宾格勒一样坐上计程车，这次的目的地是牛排馆。", "在计程车上，史宾格勒没有教我如何吃牛排（虽然老实说，如果他教我，我大概还真的能从中受益）。相反的，他详细向我介绍我们即将会面的三位经纪人和一位交易员的背景，以及他们在瑞典克朗换汇交易市场所扮演的重要角色。只有我和他单独在一起时，史宾格勒谈论的就是这些：瑞典换汇交易市场，以及牵涉其中的人。我觉得这实在是太棒了。", "我们将会见到：", "1. 格兰蒂：皮肤黝黑，中年，有魅力，瑞典换汇交易经纪业务主管。", "2. 琼西：秃头，明显老了，喜欢自嘲。他正在办第三次离婚手续，实在很不应该。", "3. 灌木头：年轻，利物浦口音，瑞典外汇经纪人。另一个因为头部大小和颜色而被取名的家伙。", "4. 西蒙．张：年轻、有前途的汇丰银行瑞典外汇交易员。非常聪明，小腿肌肉发达。来自香港。大家都叫他李连杰，不过没什么关系，因为他不介意。", "没有任何人在乎这次的午餐会没有一个瑞典人。话说回来，不到十八个月后，我也被任命为负责瑞典换汇交易巿场的资深交易员，我这辈子也没在瑞典待过一天。", "这家牛排馆藏在伦敦市区深处，绕过许多蜿蜒小巷的尽头，一进门就看到埋在地下如洞穴般的用餐区。大房间里没有一丝阳光，虽然我确信里面一定有电灯，但光线颇为昏暗。我记得因为周遭氛围，让我一直觉得这地方使用蜡烛照明。正中午时间在这里用餐，总让人有种超现实的错觉，仿佛正在策划什么阴谋似的。", "我们向桌子走去，我看到坐在一起的四个人，开始将他们的外表和我听到的描述相互对比。我一下子就认出灌木头那颗红色球根状的大头，史宾格勒并不知道他曾经和我、鲁伯特一起去过拉斯维加斯。", "我注意到经纪人的同时，他们也看到我们。他们在见到史宾格勒走向他们的桌子时，立刻站起来，开始欢呼、起哄、呼喊、鼓掌，大吼大叫。我没想到他们会这么做──史宾格勒在交易厅可从未得到这种规格的待遇。我困惑的转向史宾格勒，看到他那张科学怪人的脸露出灿烂的笑容，我甚至观察到他脸上因不好意思而出现的红晕。", "和史宾格勒一起吃饭时发生几件事。", "第一是和我在拉斯维加斯一起待了三天的灌木头，没有向任何人提起他本来就认识我。", "我认识灌木头，而且我喜欢他。你甚至可以说我很了解他，因为我曾经见过他在凌晨三点洛杉矶一家夜总会外面喝得酩酊大醉，右手对著女明星琳赛．萝涵的女性朋友做了个转动的手势，示意她摇下车窗，然后在得到她还算和善的回应后，对著她的脸大喊：「妳的车真是他妈的丑！」然后转身走向灌木丛尿尿。", "老实说，他根本不知道她是谁。他只是单纯的不喜欢她的车。", "我以为那段经历会加深我们的羁绊，加上我们的背景相似，应该可以巩固我们的友谊，可是在我坐下来的那一刻，灌木头看了我一眼，我立刻就明白他的意思。彼时是彼时，现在是现在。我本能的明白他是对的。", "对史宾格勒的热闹欢迎持续十分钟，各式各样的逗弄夹杂开玩笑似的脏话，史宾格勒在整个过程中一直在蠕动、微笑、咯咯笑，全程低头，像一个害羞的年轻新娘。你可以看得出来，他心里其实满高兴的。", "闹完史宾格勒后，真正的谈话才得以展开。瑞典换汇交易和红酒。对于这两者，史宾格勒都是魔鬼。我从未见过任何人比他还能消耗这两种东西的。", "史宾格勒和西蒙．张像两部机器：重型机器。一旦你让他们开始谈论换汇交易，谈话速度永远不会减慢。我在这个阶段仍然不清楚什么是换汇交易，也没有参与对话。但我就坐在桌子对面，盯著他们，可以看到他们眼中明显的激情和热爱。他们想知道九月底那三天是不是因为报价错误而特别便宜，或者斯德哥尔摩商业银行的英格玛是不是知道什么他们不知道的事情。他们想知道瑞典央行是否会在十月再举办一次晚宴，如果是的话，哪些交易员会参加。丹麦中央银行哥本哈根的安德斯最近怎么样？他的酗酒情况比较改善了吗？他和妻子之间的关系如何？", "他们是魔鬼，他们什么都想知道。虽然我几乎听不懂他们在说什么，但我也什么都想知道，就像他们一样，我睁大眼睛看，竖起耳朵听，随著时间的流逝，盘子被送上来又被收走，红酒一瓶又一瓶的喝光，我开始心想，也许我在别无选择的情况下坐进的那个位子，那个在ＪＢ的左肩后方、在史宾格勒的右肩后方的位子，或许没有那么糟。", "整个过程中，我几乎没开口。我不需要开口。史宾格勒和西蒙疯狂的热情塞满整个空间。我起初打算依照史宾格勒同样的速度喝酒，但在看到他灌完前三杯酒的速度后，我立即意识到我无法和他比肩，我找不到参考对象，而且太过全神贯注的倾听他们的谈话，最后我根本一口没喝。", "我看著他们交谈超过一个小时，食物也已经吃完很久，这时，史宾格勒才第一次将他的大脸转向我，试著咧嘴对我微笑，他的牙齿染成紫色，看起来相当可怕。他用低沉的南非荷兰语拖长声调对我说：「盖瑞……这红酒非常非常的……昂贵，你居然……不喝。」", "我做了在那种情况下我唯一能做的事，就是转身面对我的酒杯，看著它，伸手将它高举在空中，对著他的方向，微微倾斜表示致意，然后啜饮两口再将它放下，将目光投向他那张容光焕发的紫色脸孔，微笑说：「喝起来真棒，史宾格勒。口感非常非常好。」", "从那时起，他们带我外出喝酒的次数便成倍数增长，甚至建立一种反比例原则，那就是：我和每个交易员外出的频率，跟如果我有选择的话我会选择的频率成反比。", "史宾格勒和鲁伯特至少每周带我出去一次（当然是各自分开的）。他们的行为都以他们特有的方式变得愈来愈难以招架。", "经纪人午餐会变成经纪人晚餐会，史宾格勒晚上的情况比白天糟糕多了，他的牙齿会染得更红，而且他在喝醉时，会踢一个来自埃塞克斯看似没有超过十九岁的年轻经纪人的屁股，并大声喊：「带我去喝酒吧！经纪贱人！」", "当这种情况发生时，那男孩不会回头看史宾格勒，但他会转身看著我。他没有比我年轻多少，脸上会出现一种仿佛我俩是共谋的严肃表情，他不笑，我也不笑，我只能努力承受他严厉而灼热的目光，我会尽力表现出和他同等的严肃，然后在对视中，彼此点头。", "鲁伯特常想在晚上带我去他住的克莱姆附近玩，可是那里与伊尔福德在伦敦地图上是两个完全相反的方向。", "我要搭好久好久的火车才能从那里回到家。有时我们在外面玩得太晚，连末班车都赶不上，鲁伯特只能付钱叫计程车送我回家，所以我并不喜欢去克莱姆，但我真的没有选择，因为鲁伯特想让我认识他所有的朋友。", "他的朋友们全都穿著绣有花押字、仔细熨烫过的漂亮衬衫，发型一看就很昂贵；我的衬衫是在 Topman 平价连锁店买的，「免烫」是我挑选时的第一前提。他们全都开始叫我「老头盖瑞」，我开始模仿他们的埃塞克斯腔，试图掩盖我真正的口音。", "有个曾经和我们一起去过拉斯维加斯的朋友是高盛的交易员，名字叫皮皮．霍洛威之类的，就是那个在加长型轿车里流鼻血的人。只要我们出去玩，他总在现场。有一天，鲁伯特在他的豪宅里举行一个变装派对，我打扮成罗宾汉，鲁伯特允许我带著打扮成蝙蝠侠的邻居哈利一起参加。这是我们第一次看到有人吸食古柯碱。皮皮．霍洛威向我介绍他的女朋友。", "她当然很漂亮，像瓷器一样精致，一身白衣，宛如仙女。在见过他在拉斯维加斯做的事情后，发现皮皮竟然有女朋友令我大感震惊。我看著她，心里有点为她难过，但她似乎很高兴的样子。你知道吗？她满脸微笑，所以我能做什么呢？我也微笑回应，伸出手，然后两人握手。我说：「嗨！我是盖瑞，很高兴认识妳。」", "我和她闲聊的时间并不长，但我问她和皮皮．霍洛威在一起多久了，因为我从见到她就在想这个问题，结果发现他们已经在一起很多年了。", "然而，不只是鲁伯特和史宾格勒会带我出去，小组里的每个人多多少少也都开始带我出去。ＪＢ向来在酒吧和经纪人一起喝酒，我随时可以加入，洪哥会来，史努比也会来，有时甚至迦勒也会来。只要有机会，史努比也会带我参加他的经纪人餐会。我很乐意和他一起出去，因为和他在一起让我安全感满满，而且他只要吃上那些昂贵的食物，总是会表现得很开心。每周三我们还会一起踢足球，我的邻居哈利每场比赛都来，有时街上一些其他孩子也会参加，还有几个经纪人，然后大家再一起去喝啤酒。", "和经纪人来往让我觉得最神奇的部分是，你经常看到同一个经纪人在不同的地方和不同的交易员在一起。例如，灌木头是史宾格勒的经纪人，因为他代理北欧货币，但他却曾经和我、鲁伯特，以及一群欧元交易员一起去拉斯维加斯旅游。尽管琼西曾和史宾格勒共进午餐，但他其实是加拿大币经纪人，换句话说，他是史努比的经纪人，而且经常和史努比一起出去吃午饭。我新认的金融城爷爷大头，之前和我、鲁伯特一起吃午饭，可是实际上他并不是鲁伯特的经纪人，而是比尔的英镑经纪人。", "有趣的是，经纪人不只会参加不同交易员的午餐会和晚餐会，而且经纪人参加每次餐会时还会表现出不同的人格。和我一起在拉斯维加斯肆意侮辱名人选车眼光的灌木头，与出现在史宾格勒牛排餐厅里的灌木头，根本判若两人。用寿司引诱鲁伯特的大头，和比尔在河边老酒吧喝酒的大头，两种人格完全不同。当经纪人与鲁伯特在一起时，他们相当自制、坚忍，他们以尖锐、愤世嫉俗、严厉的方式谈论德意志银行的欧元交易员；当他们和史宾格勒在一起时，他们却变得狂野、粗暴、满口脏话，而且刻意将谈论话题局限在史宾格勒身上和市场；当他们和ＪＢ在一起时，他们讨论橄榄球；当他们和史努比在一起时，讲的全是高尔夫和美食。经纪人全是变色龙，他们连声线都能改变。他们似乎很确切的知道每个交易员想要什么：史宾格勒想要红酒和高雅的白桌布，吃完饭还要去夜店；鲁伯特想要昂贵的寿司和酒吧；迦勒想要观赏有名的体育赛事；比尔想要在酒吧吃午餐并欣赏泰晤士河的景色。经纪人似乎从来不问交易员想要什么，或他们想去哪里。他们似乎渗透所有人的喜好。他们什么都知道。", "曾经有个经纪人向我提供古柯碱，仅此一次。我拒绝了。之后，就再也没有人问过我。我在想它是否已经永久记录在我的档案里。我在想，那里头不知道还写些什么。", "小节 3", "下班后和鲁伯特一起出去玩的频率愈来愈高，结束的时间愈来愈晚，终究不可避免的出了事。我虽然年轻，但也只是凡人，而且我仍然坚持每天早上六点半就要抵达办公室。", "和史宾格勒一起出去时最棒的一点是，他总在晚上九点前就差不多醉了。我可以什么都不说的回家睡个好觉，他甚至不会意识到我已经走了。和鲁伯特在一起时，却不能这么做。他会喝酒，一杯接著一杯喝，可是他永远不会醉。哪个时间点你在哪里，他都一清二楚。他什么都知道。只有在他允许我回家时，我才能回家。", "一天晚上，我们坐在克莱姆一家高档酒吧里，肚子里塞满生鱼片和莫希托鸡尾酒，眼看著最后一班列车的时间就要到了。提摩西．特温汉姆和皮皮．霍洛威也都还在。我总会在末班车时间接近时试著行动，因为我知道，如果我在那时离开可以省下鲁伯特一笔计程车费，换句话说，他允许我离开的可能性会高一点。", "问题是，他不让我走。", "「留下来。待会儿我帮你叫计程车。」", "可是我没有叫到计程车。", "一段时日之后，「叫辆计程车」变成「住在我家」，表示我们会喝到凌晨四点才散场。请记住，我在六点半就要开始工作。", "我的闹钟在凌晨五点十分响起，当时我睡在巨大影视厅的巨大沙发上，立刻感觉不舒服。不过，在鲁伯特的影视厅里呕吐似乎有让我有丧命的风险，于是我忍住。我强压下恶心，没吐在地铁上，顺利进到办公室。", "我没能坚持多久。", "到了七点四十五分，我将自己锁在厕所的小房间里，不停的把昨晚吃下的生鱼片吐进马桶。大约半小时后，我摇摇晃晃的走回办公室，我刚才去做什么应该相当明显，因为迦勒叫我马上回家。他看起来并未生气，只是我一从厕所回来，他就朝我走来，把手搭在我的肩膀上，对我说：「回家吧！」", "说实话，我认为这是最正确的决定，所以我离开了。", "但这并不是什么大问题。更大的问题是之后发生的事。", "我显然很想在第二天重新证明自己，所以早上六点我就抵达办公室，成为小组第一个上班的人。", "比尔一如往常的在我之后抵达，他从我身边走过时什么也没说，只是拿著卡布奇诺轻笑两声，在我脖子后面捏了一下。请记住，我的座位在小组办公区域的最边缘，因此每个交易员在走进去时都必须从我身后经过，多多少少都会和我聊两句轻松的废话。当迦勒走过时，心情显然不错，他以一种比较像评论而非询问的口气对我说：「加札，你昨天到底怎么了？今天感觉好些了吗？是鲁伯特害的吗？」", "我只是笑笑，当时并没有多想。五分钟后，鲁伯特走进来。", "「早安，鲁伯特。」迦勒的视线还盯在他的萤幕上，并未转过身来：「盖瑞今天回来了。他告诉我，他昨天会生病都是你害的。」", "我和迦勒一样，不需要转身面对鲁伯特就知道他会有什么反应。我开始假装自己正非常专心的看著前方。", "大约过了紧张的五分钟，什么事也没发生。小组里没人开口说一句话，而我固定每一块可用的肌肉直直盯著我的萤幕，所以什么都没看到。我当时的座位左边有一个空位，鲁伯特就坐在那个空位的左边。我很相信只要我稍微将头往左转，哪怕只转三公分，都能看到鲁伯特正在瞪我。", "我在第六或第七分钟后开始听到声音，一种从喉咙发出的低沉呻吟。听到之后很难没有反应，不过我竭尽全力的压抑自己，成功的装做没有听见。呻吟的音量开始愈来愈大，逐渐变成愈来愈清晰、愈来愈明显的咆哮。多年之后，我在京都附近的山上寺庙遇过一头野猪，牠发出的声音让我想起这次听到的咆哮声。我必须再次强调，听到咆哮声要表现得若无其事真的很难，但我觉得我已经装做听不到了，如果此刻再转身面对鲁伯特，只会让情况变得更糟。而且我不可能是唯一听到咆哮声的人，可是周围却没有任何人说任何话。于是我继续坐在那里，额头开始冒汗，目不转睛的直视前方，努力不做出任何回应。", "然后开始传来敲击声。一个重击声和一个爆裂声，然后停了几秒，又传来两个更响的重击声和两个爆裂声。对人类来说，要做到完全无动于衷是不可能的，而且我也本能的想到，自己可能正面临生命受到威胁的紧急状况，于是我转向左边看鲁伯特在做什么，下面则是我看到的画面：", "鲁伯特的大手摊开压在桌面上，手肘向外成直角，手臂固定住向前倾斜并扭转的上半身。他的脖子往前伸得极长，但不是朝向萤幕，而是向上、绕过我们之间没人坐的空位，将我们面对面的距离缩至六十公分以下。他像一只狗似的咬牙切齿，大声咆哮。每个交易员的桌子下面都有两扇可以向内打开的小门，里头放置我们使用的电脑桌机，鲁伯特刚才一定用腿大力踢过那些门，因为他的身体不时抽搐，而且小门撞上后面的金属支架所发出的巨大爆裂声不时从下方传来。", "当然，我在那一瞬间就看到一切，只是在那一瞬间，我不知道接下来该怎么做。因为，眼前的画面，实在太过不真实、太过骇人。我完全无法将目光移开。", "我在年轻时也曾多次惹上麻烦。其中几次，牵扯到真正的凶恶之徒，我也见过因此身受重伤的人。我知道受到威胁是什么感觉，但我从没遇过有人像狗一样对我咆哮，露出獠牙威吓。", "我知道我应该将头转回去看萤幕，可是我却只能一直看著他。他也看著我，扭过头来看著我，咬牙切齿的瞪著我至少二十秒，我唯一的视觉记忆只剩鲁伯特紧绷、痉挛、野兽般的身体，奋力想从牠粉红衬衫的囚笼中挣脱出来。可是什么事也没发生。没人出面制止。", "然后，突然间，在疯狂的二十秒惊吓之后，我猛然回过神来，记起自己出现在这个地方的原因，我看向这个挥舞拳头、摇晃身体、失去理智的狼人，果断的将视线转回萤幕上。我仍然能听到咆哮声，但咬牙切齿的声音却停了下来。慢慢的，咆哮声也逐渐淡去。在那之后整整一个小时，我的视线刻意固定在前方，然后，所有噪音渐渐平息，最后终于完全停止。", "之后，我和鲁伯特从未向对方提起过那诡异的二十秒。", "最疯狂的是，在事情发生后，在当天剩下的时间里，以及之后十多年里，他却表现得似乎对这件事一点都不在意。", "不过我可以告诉你，在此之后，我去克莱姆的频率降低不少。", "情况很快的出现变化。", "我之所以在书中提到经纪人、经纪人午餐会和经纪人晚餐会，是因为许多交易大厅里发生的重要事件，实际上不是发生在交易大厅里。它们发生的地点，可能是在伦敦金融城的酒吧、餐厅和夜店，也可能是在温布顿网球场、温布利足球场，或者拉斯维加斯的威尼斯人赌场，甚至是瑞典巴斯塔德的游艇上。这一切中，经纪人是维持交易大厅社交结构的重要组成元素。更重要的是，在不久之后，一位特别的经纪人将在我的生命里扮演一个重要角色。", "如今回想起来，许多我记得或不记得的事，其实相当有趣。", "我几乎不记得任何一家我去过的酒吧、餐厅或酒馆的名字。多年后，我从交易界退休一段时间后，因为一个朋友的生日派对，我去伦敦市中心一家高档中国餐馆「客家人」。进去后，我产生强烈的似曾相识感，那时我才意识到我曾经去过那里，而且不只一次，可能相当多次，就在那时，我才发现我可能造访过伦敦大部分最顶级的昂贵餐厅。只不过当时，我并未将这些地方视为真正的餐馆，视为可以享受的地方。我只是一直将它们当成工作场所，史宾格勒和鲁伯特啜饮的昂贵葡萄酒喝在我口中，只觉得味道奇差无比，我去那些地方是为了学习，为了给人好印象，为了融入其他人。", "餐厅的名字我只记得两、三个。L'Anima 是我第一次吃到小牛肉＊的地方，非常美味。我在 Locanda Locatelli 被经纪人偷了鞋子，他要求我承诺会和他做更多生意才肯还给我，后来我只能穿著一只鞋回家。", "我还记得其中的几个晚上。当比尔第一次带我出去时，我才意识到他并非总是沉默寡言、意识清醒；相反的，他有酗酒倾向。那天晚上和我们在一起的是一位非常罕见的年轻女经纪人。她身上有种东伦敦斗士的气质。不幸的是，喝醉的比尔不小心将他的第八杯酒全倒进她昂贵的手提包里。我以生命发誓，我真的看到她将一滴快流出的泪水吸回眼眶里。这种特异功能，著实让我衷心佩服。", "不过，我之后就再也没见过她。", "我也记得迦勒第一次带我去球场，观赏我人生中的第一场英格兰足球联赛，实现我童年时期认为是遥不可及的梦想。", "我还记得，中场休息时，迦勒、我和好几个经纪人在温布利足球场的豪华企业包厢后头的舒适酒吧区喝酒，我查看手机，突然发现下半场已经开始，我抓住迦勒的手腕说：「下半场开始了！我们得赶快走了！」", "我记得迦勒和其他几个手里拿著啤酒杯的大个子一起发出低沉的笑声，互相干杯，说等酒喝完了，他们自然会走。我也记得球赛还没结束，我们就提前离开了。", "我不记得那天是哪两支球队比赛，或者有哪些球员上场，或者谁赢了、谁得分。不过我记得东方足球队同一天也有比赛。从我开始上班之后，我就再也没有时间和父亲一起去看东方队的比赛。以前，当我和父亲一起看比赛时，我们从来没有错过任何一分钟：上半场开球、下半场开球、下半场结束。即使还落后几球，即使天气很冷，我们仍会坚持留到最后。而且我记得父亲永远不会忘记任何一场比赛的得分或哪一球是谁踢进去的，不管是在主场和北安普顿争斗，或是在客场和格林斯比对抗。", "我还记得，在那些漫长的夜晚结束后，我会搭火车回家，有时也会搭计程车，经常要到凌晨一点或更晚才会到家，房子里的每个人都睡了，我的父母、我的姐姐早已进入梦乡，还好我已经在那间房子住了很久，清楚的知道在黑暗、陡峭、狭窄的楼梯要踩哪些地方才能避免它咯吱作响。第五阶、第六阶的外侧，还有第九阶、第十一阶，我记得即使是漆黑一片，我也能踩对台阶的位置往上爬，以免吵醒我的父母或姐姐，然后我记得我上了床，将闹钟设定在早上五点十分。", "小节 4", "虽然上面提到的事发生地点遍布各地，但在办公室里，情况也在逐渐改变。", "我仍然每天早上七点前就会进办公室，坐在史宾格勒身后，试图搞懂什么是换汇交易。尽管史宾格勒有很多缺点，但他确实是位好老师，同时也是位好交易员，最重要的是，他愿意教我。", "换汇交易其实很简单，说穿就是一种贷款。说得更详细一点，是一种抵押贷款。你可以这样想：你去当铺将金表典当给他们，他们借你两百英镑，这也是一种抵押贷款。你收到两百英镑贷款的现金，并将你的金表当成「抵押品」押给当铺。在这种情况下，「抵押品」代表的是你向贷方提供的担保，如果你不偿还贷款，他们便可以将它留下。如此一来，大幅降低将钱借出去的风险。从某种意义来说，这种贷款也是一种「互换」。贷方将钱借给你使用一段时间，你在那段时间里将你的金表交给贷方。然后双方再将东西还给彼此，所以这是一种互换，不是吗？就是「现金换金表」的互换。换汇交易和这完全相同，只是你提供的抵押品，不是金表，而是外币。你借入两百英镑，提供等值的欧元为抵押品，以今天的汇率计算，相当于两百三十二欧元。它是抵押贷款，也是「货币对货币」的互换，就是「外汇互换」。", "不过，这种说法有个问题。当你去当铺时，支付利息的人是你，而非当铺，因为你是借钱的人。可是在换汇交易中，双方都在借钱，只是一个借英镑，另一个借欧元，那么应该由谁支付利息呢？答案很简单：双方都要付！借英镑的人支付英镑的利率，当时的英镑利率在四．五％左右徘徊，借欧元的人则支付欧元的利率，差不多在三．五％上下。如此一来，两者便相互抵消，不是吗？所以到了最后，只需让利率较高的英磅借款人支付约一％的差额付给欧元借款人即可。", "那么，谁会用上这些东西呢？嗯，基本上，每个人都会。对任何以一种货币为收入、另一种货币做投资的投资基金、对冲基金或企业来说，换汇交易都是它们的首选产品。不管是成衣品牌 Gap 在孟加拉开设血汗工厂，或是你祖父用退休基金购买日本股票，全都用得上换汇交易。若以每日交易量为衡量基准，它们绝对是世界上最大的金融产品之一。", "懂了吗？很好。我可以向你保证，关于换汇交易，这几乎是你所能得到的最佳解释，和当初史宾格勒向我解释的相差无几，只不过他的解释比起我的更无聊、更冗长。", "事实证明，我刚好赶上学习换汇交易的好时机，因为长期以来在交易大厅有如一潭死水的换汇交易，不知道为什么突然变得有利可图。", "我之所以知道这一点，是因为身为小组里最资浅的新人，搜集小组的 PnL 就是我的任务之一。PnL 代表「利润和损失」，它是世界上唯一且最重要的事。每天下班前，我会去找每位交易员，搜集他们当天的 PnL 估算。", "在我实习的二○○七年，银行认为一个优秀的 STIRT 交易员一年至少要赚一千万美元，相当于每天四万美元。交易员确实时常能赚到这个数目。当然，没有一个交易员能每天都达标，每个交易员都有亏损的时候，但是一个优秀的交易员会努力达到这个估计值，将一千万或 STIRT 交易员戏称的「十美元」当成他们的目标。", "我可能应该补充一点，这是交易员为银行赚的钱，而非落入自己口袋的钱。交易员的薪水是固定的（我当时的年薪三万六千英镑，我打从心底认为这个数字相当庞大），不过每个人还会依据年底结算的个人 PnL 表现，得到「分红奖金」。至于如何从 PnL 推算分红奖金是一个非常神秘的过程，当时的我完全不了解。", "大约在进入二○○八年夏末时，交易员的每日 PnL 开始往上爬。以前赚了五万美元就会兴高采烈告诉我的交易员，现在可能一周会有一到两次赚到十万美元，甚至二十万美元。比尔在八月底的某一天，获利甚至超过一百万美元。这种事以前从未发生过。", "我搜集的 PnL 数据只是估算值，整理之后要以电子邮件汇报给纽约总公司。但是电脑系统会为每个交易员计算出每日、每月和每年的精确 PnL，并在每天结束后透过电子邮件发送给每个人。到了八月底，我们组里已经有五位交易员──鲁伯特、比尔、ＪＢ、史宾格勒、洪哥──当年获利超过一千万美元。其中三人──比尔、史宾格勒和洪哥──更是超过二千万美元。", "不只是 STIRT 小组的交易员可以看到彼此的 PnL。整个交易楼层的人都有权限登录内部网站看到这些资料。换句话说，整个楼层的每一个交易员都知道，在进入二○○八年最后三分之一的那一刻，我们银行获利最高的前三名交易员依次是：一个看起来像哈比人的利物浦白发老人、一个南非白痴，以及一个初级欧元交易员，全在 STIRT 小组。", "我在六月入职时，STIRT 的 PnL 已经高得很不正常，不过大部分的钱还都是在那之后赚的，也就是说，大多是在七月份和八月份赚的，我不太明白为什么。比尔和迦勒似乎是唯一有能力理性解释此事的人，他们坚持「伦敦银行同业拆借利率飙升」是主要原因。据我所知，这种说法和「因为金星逆行」一样不可靠。至于其他交易员似乎既不知道，也不关心为什么会发生这种情况；他们只专注于唯一重要的事，那就是：经过多年被其他交易员看贬之后，终于可以扬眉吐气的创造他们认为自己该有的 PnL。你可以从他们的行为，以及他们在交易大厅走动时被人注视的方式中看到这一点。ＪＢ比以往任何时候都要活泼，因此他几乎从来不在位子上；原本就是交易大厅明星的迦勒，被愈来愈多的同事视为传奇；连比尔的话都变多了；鲁伯特是唯一一个看起来不太开心的人，正如你可能已经注意到的，他并没有进入前三名。", "这个发展趋势令我感到惊讶，说得更正确一些，是惊喜，但其他人似乎一点都不吃惊。他们全表现出一副十年风水轮流转，「终于等到了」的样子。话说回来，其实又有什么好惊讶的？英国有句谚语：「你必须趁著太阳大时赶紧晒好干草。」意思是要好好把握时机。我猜，小组的人不过是在尽可能的晒好干草罢了。", "老实说，如果我也能有一点自己的干草，那就太棒了，不过虽然我现在知道换汇交易是什么，我仍不了解这些钱到底是怎么赚到的，即便我想拜托史宾格勒教我，但他和其他人一样，全心全意的在努力赚钱。而且，赶紧学会如何掩护交易，才是我目前的当务之急。", "日子就这样一天一天的过去。我通常在早上六点二十分左右上班，所以我会有一段和比尔单独相处的时间。在进入八月之后，他愈来愈常告诉我全球经济即将崩溃。我听了之后，本来应该担心的，然而他说这话的时候是笑著的，他说会因此赚到很多钱，所以我以为那不过是另一种修饰说法而已。", "等其他人到达后，我会在电脑上处理一至二小时的行政杂务，然后剩下的时间，我会和史宾格勒坐在一起，试著学习掩护交易，直到我们之中的一个去参加经纪人午餐会。", "老实说，掩护交易并不困难。有人要求你报价，你向几个经纪人（我现在都认识了）询问现在的价格大约在哪里，然后将换汇交易的日期填入一个我们小组专用的小程式里，等它回馈一些价格建议，你可以依照你借入或贷出的意愿，将该价格稍微往上或往下调整，便完成报价。之后，你再决定是否要继续持有该笔交易（因为你想这么做），还是要立即对冲好赚点数目不大却能马上入袋的利润，或是要试著再略为操作，以赚取更大的利润。没过多久，只要迦勒、史宾格勒和史努比离开交易大厅，我就会为他们进行掩护交易。", "进入九月之后，发生好几件事。首先，行之有年的毕业生培训计划开始，一群与我年龄相仿的青涩新人被带去顶楼做大量的学习作业，为财务考试做准备。当然，我也得参加财务考试，所以我也必须到顶楼上课。其次，世界末日以相当严重的态势来临。", "所有扬声器箱上都有一个小按钮，它和经纪人的按钮相邻，长得还一模一样。按下它之后，你就可以「即时播音」，意味著你的声音会从交易大厅的每个扬声器中传出来。每次有交易员参加完经纪人午餐会回来，肚子里多装了四杯啤酒，想以口无遮拦的脏话试著联络刚刚和他出去喝酒的经纪人时，一不小心常会按错按钮，于是让他后悔莫及的尴尬内容立刻从交易大厅的每一个扬声器播放出来。相当有趣。", "迦勒开始每天早上利用「即时播音」举行小型会议。他会在里头谈论我听不太懂的「伦敦银行同业拆放利率＊」，以及它对全球银行体系和世界经济有何影响。", "全球银行体系的崩溃明显而迅速的从「不可能」的领域进入「几乎肯定不会发生」的领域，然后再退到事实上无法让我真的放心的「非常、非常不可能」领域。", "然而，STIRT 小组似乎没人真正关心这个问题。事实上，他们看起来非常开心。因为伦敦银行同业拆借利率的数字愈高，全球银行体系的屈服程度就愈大，小组里每个人赚的钱也就愈多。", "出事的原因是那些做信贷的家伙（就是我去年夏天实习过的信贷交易小组，马蒂兹时常睡在办公桌下的信贷结构小组）将许多显然毫无价值的垃圾以数十亿美元的价格卖给全世界。这本来是件好事，问题是他们将其中相当多的部分卖给我们自己的银行。这一点确实是个很大的错误。而且不只他们这么做，瑞士信贷、德意志银行和摩根大通的人也都做相同的事情，现在情况愈来愈清楚，每个人都看得出来每家银行都将走上破产之路。", "STIRT 小组对此的看法很微妙。首先，我们认为我们的雇主在全球银行体系和全球经济的灭亡中，扮演是代表人类道德沦丧的角色。这样的说法显然是在开笑话。当然没有人真的这么认为。我们他妈的为什么要这么想？信贷交易员全是混蛋，他们坐在交易大厅的另一边，穿著粉红衬衫，胖得像猪一样。他们长久以来赚的钱比我们多太多，所以去他的，现在轮到我们赚大钱了。", "小组的交易员开始每周有两、三天的单日获利可达一百万美元。没有人关心我们的雇主即将破产。我们都知道一定会有人帮助银行纾困。", "「接下来他们会怎么做？」他们互相开玩笑。「派那些穿棕色工作服的人来接管一切吗？」", "然后每个人都大笑，每个人都赚很多钱。", "嗯，除了我。我没赚到任何钱，我只是非常努力的想弄清楚他们到底做了什么，才能赚到这么多钱，可惜要搞清楚实在太难。不过，当大家在笑时，我还是跟著笑。", "然后，就在此时，出大事了。", "★★★★★", "没有人预想得到雷曼兄弟会倒闭。", "我有两个朋友在雷曼兄弟上班。还记得伦敦政经学院的萨加尔．马尔德吗？那个来自肯亚的小伙子。他妈的好人。他当时就在雷曼兄弟任职。他被录取为交易员，才刚开始参加毕业生培训计划。我的另一个朋友贾尔佩什．帕特尔是我在伊尔福德的高中同学，他也才刚开始到雷曼兄弟工作。他是通过少数民族保障名额进去的。", "他们都不认为雷曼兄弟会破产。", "几个月前，一家规模稍小的美国投资银行贝尔斯登濒临破产，可是最后政府介入救助该家银行，所以每个人都认为雷曼兄弟也会得到纾困。", "至少，迦勒在每天早上的会议都是这么说的。", "然而，雷曼兄弟并没有得到纾困。萨加尔．马尔德丢了工作，贾尔佩什．帕特尔也被辞退。他们几周前才加入雷曼兄弟，公司允许他们带走每个新人从入职时就一直随身携带、印有「雷曼兄弟」大字的圆筒袋。", "我心里对他们的失业感到有些难过，但同时也想，好吧！事情都这样了，只能接受，不是吗？你们当初应该睁大眼睛，选择更好的银行。", "可是另一部分的我却指责自己，你他妈的在胡说什么啊？你靠著一场该死的纸牌游戏赢得这份工作，在加入银行前你也没做过任何研究，不但如此，你的雇主同样濒临破产，小伙子，如果你运气差一点，在电视上打包东西收进印有「花旗银行」袋子里的，就是你。", "但是我不太确定我内心是否真的说过这些，还是只为了让自己好受一点才编造出来的。因为我当时最主要的想法是，谢谢老天，我还好好的活著，还能在这里继续赚钱，花旗银行到目前为止也还营运正常。", "当然，这计划有一个明显的问题，像房间里站一头大象那么明显，那就是：我的雇主此时显然也快要破产，只要稍微有点头脑的人都知道。连我都知道。", "因此，当迦勒在早晨会议中突然改口，指称我们银行的近期止赎机率不再是「非常非常不可能」，而是变成「我们估计可能性不到二五％」时，我听完心里反而升起一种奇怪的感觉，仿佛它比之前的「非常非常不可能」更让我放心一点。", "但在九月十五日星期一上午九点，当我到顶楼和毕业生培训计划中所有其他二十一岁的孩子一起学习债券计算时，我告诉他们「机会不到二五％」。很明显的，他们肯定不知道这个消息。你真该看看他们脸上的表情。", "迦勒是对的，又或许他是不对的。从学理上来说，要准确判断这样的机率预测是否正确，实在太难。", "不过我们确实得到纾困。我保住工作。我不必把东西打包装进印有「花旗银行」的圆筒袋里。除了感谢上帝之外，还有什么好说的呢？", "只是，我们当时没有一个人那么做。", "二○○八年十月初，花旗银行得到纾困之后的星期一，我在早上六点十分抵达办公室。我仍然只有二十一岁。比尔已经来了。当我走进我们的办公区时，只有他和我两个人，时间还很早，外头还是一片漆黑。比尔坐在角落，显得他个子特别小，我可以透过他身后的窗户看到黑暗的天空，他朝我的方向看，像利物浦足球队的小猴子吉祥物似的，嘴角几乎咧到眼角对我微笑，并像个疯子般对我猛点头。正常的比尔是不会做这些完全不符合他性格的动作，不过比尔在上周赚了三千万美元，现在银行不会倒闭，他可能拿得到他的分红奖金。这就是为什么他这么开心。直到今天，我仍然相当确信，比尔在那一周其实赚超过一亿美元，并且花整整一周的时间隐藏现金。我很快就会解释比尔是如何赚到这么多钱的，但是你现在只需要知道比尔很开心。我非常喜欢比尔，所以意味著我也很开心。", "下一个抵达的是迦勒。不到六点半他就到了，这个时间对他来明显过早。其他交易员在不久之后也到齐，每个人进来的时间都比平常早很多。整个交易大厅里几乎没有其他人，我们都坐在那里，在黑暗中，坐在发光的萤幕墙前。仿佛在举行午夜弥撒。", "没有人发出声音，然后就在这时，比尔将他的椅子滑到通道上，让自己移到迦勒旁边，他以浓浓的利物浦口音对著迦勒大喊：「那么迦勒，你对纾困有何看法？」", "我们全转过身来看他们，但迦勒并没有转头看比尔，目光还是朝前看。他伸出左手支撑下巴，想了一下，露出有点悲伤的表情，然后说：「我不知道，比尔……感觉就像出了事，被自己老爸保释出来一样。」", "这是我第一次、也是最后一次、也是唯一一次在交易大厅里听到有人以类似道德的角度评论纾困。", "然后每个人又将目光转回自己的萤幕上，所有人又开始忙著交易，而且他们借此赚到的钱，比这一生中任何时候都还要多。", "雷曼危机和纾困为什么是 STIRT 小组有利可图的好时机？", "嗯，当时，全世界所有主要银行几乎都破产了，尤其在美国。后果便是银行停止相互借贷，其原因有二：", "1. 如果你知道某人即将破产，你大概不会想借钱给他们。", "2. 如果你知道自己即将破产，你大概不会想借钱给别人。", "同样的规则也适用在日常生活上。你不妨牢记在心。", "于是，在没有人愿意贷款给他人的情况下，贷款变得非常昂贵。正如我向你解释的，换汇交易本质上就是一种贷款。它不仅是一种贷款，它还是抵押贷款，意思是如果借款人破产，你不会遭受过于巨大的损失，而且，当整个世界都处于破产边缘时，这些将会是你所能提供的唯一贷款。", "我们是金融城里唯一还能正常运行的交易。", "我们可以明白看出这种情况正在发生，因为所有的价差都失控了。还记得交易游戏中的「两点价差」吗？六十七－六十九？我愿以六十七美元的价格买进，或以六十九美元的价格卖出？想像一下，如果它突然变成了四十七－八十九，而且不管买或卖，都会有人正常的与你进行交易。一旦你找到一个买家、一个卖家，你就能得到四十二美元的保证利润；相较之下，你以前却只能赚微薄的两美元。哈！欢迎来到吃到饱的自助天堂，敞开你的肚子，尽情的吃吧！", "他们确实也吃了，而且没有人比史宾格勒吃得更多。", "史宾格勒一直是个恶魔。他喜欢赚钱，也喜欢洗劫客户。他从里到外，都是一名不折不扣的交易员。话说七月时，他狠狠洗劫一位顾客，狠到销售人员特地回来向迦勒告状。迦勒问史宾格勒他为什么这么做时，坐在座位上的史宾格勒抬头看著他，一脸委屈。他张开双臂，对他说：「这不是我的错，迦勒，这是我的工作！」", "迦勒低头，以一种父亲低头看著自己儿子的姿态看著史宾格勒，伸出手臂搂住他的肩膀，倾身靠向他：「洗劫顾客不是你的工作，史宾格勒。你的工作是洗劫他们，但要让他们微笑离去。」", "我一直记得这一幕，但我认为史宾格勒有时会忘记这一点。雷曼兄弟事件后，他更是将它完全抛诸脑后。", "在纾困之后的那一周某一天，史宾格勒狠狠洗劫一位顾客，因此赚了两百万美元。单单一笔交易就赚到两百万美元！", "交易完成后，他兴奋异常，从转椅上跳起来，以蹲马步的姿态降落在通道上。他的马步开得如此之大，我猜他的乳白色斜纹棉裤一定看到自己的一生在眼前飞快闪过。他沉重的头开始摇晃，嘴巴张得极开，双手握成拳头挥舞，画面太过令人震惊，荒唐的恐怖，于是所有人都不禁转动椅子瞪著他。", "迦勒立刻从椅子上跳起来，像足球场保全抓捕、制伏裸奔者一样抓住史宾格勒，然后双手固定住他的肩膀，倾身靠向他，直到两个人的鼻子几乎碰在一起，轻声问：「你他妈的在做什么？你他妈的在做什么？」", "他一遍又一遍的问，史宾格勒向后仰起头，嘴唇颤抖，试著说话，但什么也没说出来，只是不断重复著「但──但──但是──我──但──但──但──但是我──」。", "「你他妈的闭嘴。」迦勒压低声音回应他，指著交易大厅的另一头对史宾格勒说：「看那边，你看那边。你看到那些家伙了吗？他们这周就要失业了。你明白吗？他们这周就要他妈的失业了，而你却在这里，像个疯子一样挥舞拳头庆祝。你他妈的在做什么？史宾格勒？你想拿到分红吗？嗯？你想拿到分红吗？」", "记住这个问题。「你想拿到分红吗？」", "经过这些事情后，出现一个问题，一个很大很大的问题。你可能已经发现到。", "STIRT 小组的交易员们在这段时间赚到不少钱，因为报价的价差非常大。那么大的价差让谁获利？答案是帐本的拥有者。史宾格勒赚走所有北欧货币价差的钱，因为他是负责北欧货币的交易员；ＪＢ赚走所有日币价差的钱，因为他是负责日币的交易员；鲁伯特赚走欧元价差；比尔则赚走英镑价差。", "我是负责什么的交易员？什么都没有。我赚到什么？什么都没赚到。", "这就是问题。", "所以，我们需要一个新的计划。", "好，在每个人都忙著赚钱时，如果我没有动用帐本上资金的权力，我要怎么做才能赚得到钱？", "嗯，有一个人赚的钱比任何人都多，那个人就是比尔。", "比尔是怎么做的？", "嗯，后来我才知道，比尔是这么做的。", "比尔一直对全球经济抱持怀疑的态度。他不相信将钱借给一堆白痴就足以支撑经济，而且他看得出来全球负债在逐渐上升。长期以来，他一直怀疑那些所谓的数学天才信贷交易员其实是一群被宠坏的有钱白痴，事后看来，他们大概真的是。比尔一直预期他们做的混帐事总会有爆开的一天。", "问题是，他预期得太早，导致他多年来一直将钱押在这次的爆发上。在过去的三年里，这种行为让他每年都背负好几百万美元的损失。这不仅解释为什么他迄今没有为花旗银行带来什么巨额的利润，也解释为什么鲁伯特会认为他是个白痴。", "然而，比尔并不是个白痴。", "比尔一直在做的，就是持续下注在「不同类型的利率终会出现差异」的预测上。好，你想像一下：假设你需要借钱周转三个月。你会怎么做？嗯，你会去你的银行，或去找你妈妈，或去找黑手党，总之任何你可以借得到钱的地方，要求三个月的贷款，对吗？很简单。但如果你是一家大银行、投资基金或公司，你还有另一个选择。如果你是这样的大型机构，你可以致电如花旗银行等大型贷款机构，向他们要求一天的借款。好，你可能会想，这并不能解决问题，因为我需要的周转时间是三个月，而不是一天。嗯，实际上这不是什么大问题。在明天贷款到期时，你可以再去找另一家大型贷款机构，这次可能是德意志银行，再借一天的钱。现在你已经安然度过两天了。在三个月内，你每天都重复一次这个动作，问题便解决了。基本上，如果你想借三个月的钱，你有好几种选择──你可以申请为期三个月的贷款，或者你可以申请九十次单日贷款。", "你会怎么选择呢？你比较喜欢哪一种？你可能会想，我会选一次借三个月，因为这样我就能事先将一切都整理好，提前知道我需要付出的利率是多少。不过在国际货币市场上，提前安排九十笔单日贷款，也是相当轻松容易的事。所以不管你选择哪一种，你都可以提前确定利率。", "这一题的正确答案是，如果你是借款人，你会更喜欢三个月的贷款；如果你是放款人，你会更喜欢九十笔单日贷款。原因是，如果你借钱给某人九十天，而他们在第二十五天破产，你就完蛋了，但如果你只借给他们一天，你不会受到波及。如果你是借款人，你一天一天的借钱，到了第二十五天，人们意识到你要破产了，你就完蛋了，但如果你一次借了九十天的钱，你可能还有撑过去的机会。", "当然，在二○○八年之前，这些都不重要，因为那时银行还没有破产。但是到了二○○八年，一切都变了。九十天贷款市场彻底蒸发，单日贷款市场却几乎没有变化。白发小老头比尔似乎是整个金融城里唯一意识到会发生这种情况的人，他在过去多年里一直预期这种事迟早会发生，也把钱押在上头。于是当它终于发生时，他在一周内就赚到数千万美元，下一周赚得更多。事实证明，当他告诉我全球经济即将崩溃时，居然不是一种修辞，而是真的。在被嘲笑多年后，大家终于知道他是对的。让我告诉你，他可是扬眉吐气，他妈的非常享受。", "如果换成你，你不会吗？", "然而，问题是，它无法解决我的问题。因为下注的时机已经过了，我应该在两周前动手的。一旦一个人可以靠单一交易就赚了四千万美元，不需天才也能猜到现在进场已经太晚。", "那么，我采取什么行动？我回去找史宾格勒。", "除了比尔之外，史宾格勒是我们小组里另一位赚得比他之前多许多的交易员。", "严格来说，我们之中赚第二多的交易员并不是史宾格勒，是洪哥。他和比尔一样，当年的收入超过一亿美元。但是洪哥负责的是欧元帐本，史宾格勒负责的却是北欧货币。在过去的纪录里，哪些帐本最赚钱其实非常清楚，而北欧货币的获利能力几乎总是垫底。", "那么，史宾格勒是怎么赚到这么多钱呢？如果我能说服他告诉我，也许我自己也可以赚一点。", "在雷曼兄弟刚破产时，人们还没有足够时间思考。没有人愿意帮其他人掩护交易，因为他们忙著为自己负责的帐本赚大钱。迦勒则时常离开办公桌去和大人物开会，试图确保每个人都能拿到应有的报酬。正因为如此，我大部分时间都在为他掩护。", "一旦进入十一月，市场局势开始稍微平静下来，迦勒再度回到交易大厅。这意味著我只能再回去坐在已经赚得满坑满谷的史宾格勒身后。很明显的，尽管他是最年轻的交易员之一，但他即将成为当年花旗银行最赚钱的交易员之一。这让他兴奋异常。但对我来说，这不是个问题。当史宾格勒端著架子，自我感觉良好时，他只想谈论两件事：交易和他自己。刚好和我想听的完全一致。", "我问史宾格勒他是怎么赚到这么多钱的，他给我看了一个他在用的巨大试算表档案。它是一部伟大的杰作，以「天」为单位，拆解整个瑞典币（又称为「Stokkie」）换汇交易市场。十二月十四日借瑞典币成本多少？五月二十三日呢？每一天都经过单独分析，并且和市场上的即时价格，以及史宾格勒心中的应有价格进行比较。他给我那张试算表的档案，我后来用了很多年。", "当我们在检视试算表时，史宾格勒解释所有他的「部位」特征。所谓的「部位」，指的是交易员在任何特定时间手上持有不同的交易清单。就瑞典币换汇交易市场而言，代表他在任何一天借入或贷出多少瑞典克朗。他的每一笔交易都有一些各自不同的深奥理由。", "但是在我们审视史宾格勒的部位时，我注意到一件事：他每天都借入瑞典克朗。请记住，换汇交易是一种贷款，没错吧？可是它也是一种互换，意味著它是双向贷款。你不只借入，你还得贷出。在史宾格勒的瑞典克朗帐本中，他借入瑞典克朗；相对的，贷出美元。我觉得这种情况有点不寻常。你可能以为他会在瑞典克朗便宜时借入，并在其他日子昂贵时贷出；可是他并没有这么做，他为接下来两年的每一天都借入瑞典克朗，贷出美元。唯一的不同只有他借贷的金额。", "为什么要这么做？", "那天下午更晚时，我利用空闲时间去查看其他交易员的换汇交易帐本。比尔每天贷出美元；史努比的数目虽然小一点，也是如此；迦勒和ＪＢ也这么做。他们在接下来的两年内每天都贷出美元。", "那天结束前，我回去找史宾格勒，虚心求教。", "「为什么每个人都在贷出美元？为什么没有人借入美元？」", "史宾格勒以一种仿佛见到白痴的眼神看著我。", "「我们为什么他妈的要借入美元？借入美元未免太他妈的弱智。」", "我试著调整表情，好让自己看起来不那么「弱智」。但显然我没有成功，因为史宾格勒深深叹一口气，打开他的试算表。", "「你看，现在的美元利率是多少？是一％，对吧？而且它还会再降，降到零。可是你看看透过换汇交易，我们可以拿到的利率是多少？」他开始在表格角落输入一些数字。「我们可以拿到超过三％。而且完全没有风险的。」", "我不需要他解释第二次。他还在说话，只是我没在听，因为我正在想要怎么开口问他，我是否可以自己进行一些交易。", "但我没有想太久，因为我还在思考措词时，突然发现他正看著我，对我说：「所以？你也想来一点吗？」", "嗯，那还用问？", "让我们在这里敞开心扉，以确保你听得懂我在说什么。", "换汇交易是一种贷款，一种双方互相借贷某种货币的双向贷款。双方都支付利息，意味著最终只有一方需要支付利差。如果借英镑的利率为三％，借美元的利率为二％，英镑借款人就必须支付差额，也就是一％。", "可是每一种货币的利率又是由谁决定呢？", "你有没有注意过在每个国家的首都，嗯，或者如果你是欧洲人的话，那就是在法兰克福，有一栋典雅精致、被称为「中央银行」的古老建筑吗？它可能还会被称为「英格兰银行」或「日本银行」──基本上银行名称就是你故乡的国名。在美国，它被称为美国联邦准备会，简称「联准会」；在欧洲，则是欧洲中央银行。在那栋古典大建筑里，一群从未真正离开过大学的上流社会妈宝男每年都在尝试阻止经济慢慢崩溃，但都以失败告终。然后，他们移动到豪华的木头嵌墙大厅享用一顿丰盛的晚餐。即使你不知道，这些人对你的生活影响甚大，他们在这个故事里也扮演相当重要的角色。", "不过，此时此刻，关于这些人，你只需要了解他们为世界上每个国家（包括你的国家）设定利率（还有另一个你虽然不需要知道，但大概会觉得很有趣的相关事实：比尔有个专用的计程车司机，每当他错过末班车时，他就联络那位司机在经纪人晚宴后送他回到他在赫特福德郡的豪宅。有一次我和那位司机一起喝酒，他叫做希德；他告诉我，每次比尔喝得醉醺醺时，他会坚持希德将车在英格兰银行外停下，这样他就可以偷溜进去它旁边的一条小巷，在银行后墙上小便。希德说比尔对此事异常坚持，即使要绕路也非做不可。我对这点相当佩服）。", "因此，在这个时期，即二○○八年年底，全世界的中央银行都以极快的速度将利率削减至零，绝望的希望能以这种方式刺激经济，但终究是徒劳无功。这种情况几乎发生在我们小组交易的所有货币上：英镑、欧元、瑞士法郎、瑞典克朗和丹麦克朗，美元和加币。一旦你将已经零利率近二十年的日币也算上去，几乎所有主要货币的利率都迅速归零。", "这对换汇交易又意味著什么呢？如果外汇互换的支付额等于利差，而且几乎所有利率都将为零，利差也必须全部为零，对吧？于是，所有的换汇交易的成本都应该变成零。", "但是，正如史宾格勒向我指出的，并不是所有的换汇交易都没有风险。非常非常短期的外汇互换，也就是一日外汇互换，确实没有风险，实际上付出的代价几乎为零。然而，如果时间超过两周或一个月，借入美元的贴水＊就很高了。这同时也为换汇交易的交易员创造出获得巨大利益的机会，他们可以一次性的贷出三个月的美元，然后每天借回来。正如史宾格勒向我解释的，这么做一点风险都没有。", "可惜的是，世上并没有什么事真的完全无风险，不是吗？赚钱哪能真的那么容易？如果这么容易，为什么不是每个人都在做呢？嗯，事实是每个人的确都在做。但它真的没有风险吗？如果有，风险是什么？", "这些都是那天我坐在史宾格勒身后，看他操控那张巨大试算表时应该问自己的问题。但我却什么都没有问，只是点点头，说：「是的，老兄，我当然也想要来一点。」", "史宾格勒按下按钮，与格兰蒂交谈，他直接为我完成交易，几秒钟后，我贷出两亿四千万美元，为期三个月，跟哥本哈根的丹麦银行进行美元／瑞典克郎的换汇交易。我高高兴兴的回家，这是我一生中的第一笔中型交易。", "我回到家，和父母一起吃晚饭，一起看著黑白小电视上模糊的节目，就是要转换频道还得起身去转旋钮的那种。直到这时，我才突然反应过来，心想：「等等！我他妈在做什么？我对美元／瑞典币换汇交易一无所知。我一生中从未去过瑞典。我到底了解哥本哈根丹麦银行什么？两亿四千万美元，那是好大好大一笔钱，不是吗？」", "事实上，史宾格勒建议的两亿四千万美元的交易规模，对于 STIRT 小组来说并不算是多大的交易。他们经常进行数十亿美元的交易，并以十亿为一单位，称之为「码」。不过，这对我来说可是一笔大钱，而且嘴上谈论交易和实际进行交易的感觉非常不同。那天晚上我彻夜难眠。", "第二天我比平常更早就进办公室。我必须找比尔谈一谈。", "那天早上比尔进来时，看到我眼巴巴的在等他，让他惊讶极了。前一天该问的所有问题终于在我脑海中具体化。拿你自己的钱、你的声誉和你的职业生涯出来赌博，只因为你认同一种说法，这会让你花上许久的时间，去认真思考这种说法是否真的正确。当你看到电视新闻时，不妨也多想想这一点。", "比尔走进来时，用斜眼看我，他见我已经坐在他的位子旁边，甚至等不及他坐下，我就告诉他我昨天做了什么事。", "「我贷出两亿四千万美元、为期三个月的瑞典克郎。」", "比尔立刻笑出来。他觉得这真他妈的好笑。", "「去他的，是吗？你该死的睪丸终于长出来，有胆子去贷出一些该死的美元，是吧？那么，你他妈的为什么要这么做呢？嘿，盖尔？」", "他显然在生气。", "我并没有为自己掩饰。", "「史宾格勒告诉我这么做稳赚不赔。」", "我告诉他实话，他以看白痴的眼光看著我。为了帮自己辩白，我补充说：", "「每个人都在做。我查看大家的部位。每个人都在做。而且，你也在做！」", "然后，比尔微笑，点头，改变态度。我猜如果我没有将头发剃光，他甚至可能会伸手来挠乱我的头发。不过我的头发实在太短，所以他只是捏了捏我的鼻子。他转过身去，看著萤幕。", "「你并没有像你外表看起来的那么蠢，你这个该死的东伦敦混蛋。我们都在这么做，是吗？好吧！看起来你也在这么做。」他笑了，启动他面前的九个萤幕，然后从包包里拿出《金融时报》。", "「那么，为什么每个人都这么做呢？又有什么风险呢？」", "比尔将《金融时报》扔到地板上，转过身来，一脸严肃的看著我。", "「好，好，好，好，」比尔显然他对这个发展感到很开心：「看起来真的有人一夜之间睪丸就长出来了，是不是吗？你认为风险是什么？」", "「我不知道。史宾格勒说稳赚不赔的。也许这意味著没有任何风险。」", "「回答得真他妈的好，如果你不知道该死的风险是什么，你他妈的为什么要这么做？」", "「我这么做是因为你也在这么做，比尔。」", "比尔听到后，露出微笑。「另一个他妈的好答案。好，我会告诉你我为什么这么做。我这么做是因为这个世界需要美元，我们是他妈的花旗银行，我们是全世界最大的美国银行，我们有美元，他们却他妈的没有，所以我们可以向他们收取任何我们想要的费用，我们都会因此赚到钱。懂吗？你听明白吗？」", "我点了点头。", "「现在我要告诉你一些比那还重要的事，懂吗？你可别他妈的告诉过我，在你他妈的一生中，有任何一笔交易是他妈的没有风险。明白吗？这就是那些信用混蛋的想法，看看他们到底干了什么鸟事。我要再告诉你最后一件事，也是最重要的一件事，然后你就可以滚回去你自己的角落。只有在一种情况下，这笔交易将会完蛋，我们都会失去我们他妈的一切。那就是：如果全球银行体系崩溃，这笔交易必然惨赔。可是如果发生这种情况，所有的银行都会破产。你会失去你的工作，我也会失去我的工作，全球经济也会跟著大崩溃。我们都在赌这种情况不会发生。我们会是正确的，懂吗？我们会拿到分红。然后我们就一起去喝几杯。现在既然你也在这么做，也许你应该回到座位上，好好思考这一切代表的意义。而且你要向自己保证，这是最后一次你在不知道风险的情况下进行交易。不过，盖尔，这笔交易做得不错。干得好。」", "他将视线转回萤幕墙，我也回到自己的座位上。可惜它并不是我最后一次在不知道风险的情况下进行交易，不然的话，我后面几年就不会惹上那么多大麻烦了。尽管如此，正如比尔和史宾格勒告诉我的，它确实是一笔很棒的交易，到耶诞节时，这笔交易的帐面获利已经上升至七十万美元。", "回顾刚进花旗的头几个月：出去喝酒，吃生鸡肉，学习交易，在所有不同交易员去上厕所时跑来跑去的，为他们进行掩护交易，赚到我第一个出现在 PnL 的七十万美元利润。那时候，我简直不敢相信一切居然这么有趣。白天变成夜晚，然后又变成白天，再变成夜晚，日子过得飞快，细节似乎变得好模糊。ＪＢ每次见到我总会微笑的打趣；而迦勒似乎对我出色的工作能力十分满意；即使鲁伯特很危险，史宾格勒很讨人厌，但相较之下似乎一点都不重要，因为每个人都在赚大钱。", "嗯，当然，那时的我赚得不多，但我可以感觉到我赚大钱的时代即将来临。属于我的 PnL 即将出现，我的三万六千英镑年薪比我前半生拥有过的钱还要多。我一天到晚造访伦敦最高级的餐厅，这是我从未有过的体验。我穿著尖头皮鞋，戴著蓝牙小耳机，在交易大厅里走来走去，进行交易。这么美好的生活，我还能要求什么？", "更重要的是，比其他任何事都重要的是，长久以来，这是我第一次找到归属感，是大家庭里的一份子。比尔和迦勒就像两个截然不同的父亲：一个身材矮小，爱讲脏话，斗志旺盛；另一个身材高大，圆滑的令人难以置信；鲁伯特和ＪＢ则是耶诞节时才会碰面的叔叔，只不过一个刻薄，另一个友善；史努比和史宾格勒则像两个大哥哥。", "在我极少数回家和亲生父母一起吃饭的晚上，他们会骚扰我，要求我付房租，还会要我拿钱出来修车。我确实给他们修车的钱，但我告诉妈妈我把房租拿给爸爸，然后我告诉爸爸我把房租拿给妈妈，他们很长一段时间都没发现我在说谎。我感觉，仿佛世界上所有一切，到了此时才落入它们原本应该在的位子。", "小节 5", "然后，史宾格勒突然不见了。", "一开始时，我并没有发现，因为史宾格勒总是最后一个进办公室的，所以在史宾格勒通常会出现的十五分钟前，迦勒走过来，对我说「你今天替史宾格勒做掩护」时，我并没有多想。尽管史宾格勒迟到的情况并不罕见，毕竟他若前一晚喝太多酒，这种情况就会发生，但他一整天都不来，尤其是完全没有和我联络，就很不寻常。但我只是以为人吃五谷杂粮，哪有不生病的。", "奇怪的是，没有人说什么。史宾格勒总是惹大家生气，他在完全没有通知任何人的情况下不来上班，大家应该会拿这件事开玩笑。可是事实并非如此。一整天都没人提起他。", "那时我已经习惯为所有交易员做掩护，因此我在扬声器上为每种不同货币各设定两个经纪人。它的操作方式是这样的：每个经纪人都有一条通往银行的开放线路，你可以将它加入你的扬声器里，每当该经纪人对著我们大喊大叫时，声音就会从有将那条线路加入他们控制面板的交易员的扬声器里播出来。你可以将任何一条线路的音量调高或调低，甚至将它完全关闭（这是每个经纪人内心最大的恐惧）。因此，在我收到指令，去帮北欧货币做掩护交易时，就像史宾格勒没有出现的这一天，我所要做的，就是将我控制面板上的两家北欧货币经纪人的音量调高。", "专门负责北欧货币的史宾格勒，在他的控制面板上设定五到六名北欧货币经纪人。我告诉其中两个我正在帮他掩护，但其他的三、四个并不知道，即使没人回应，叽叽喳喳的声音还是一直从史宾格勒的扬声器传出，流到他空下来的座位上。大约一个小时后，丹麦经纪人中某一位卡斯滕开始想知道他为什么一直没有得到回应，于是开始大喊：「史宾格勒！史宾格勒！你在吗？你在吗？」大约吵了十五分钟后，坐在扬声器旁的ＪＢ愤怒的将双手用力拍在桌上，一言不发的站起来，倾身靠向史宾格勒的扬声器，将每一条经纪线路的音量钮都转到「关闭」，然后才坐回去。就在那时，我才意识到一定是出事了。", "那一天，除了不可避免的叫喊数字，小组成员几乎没人说话。就连ＪＢ，平常最吵闹、最善于交际的ＪＢ，也整天保持沉默。", "早上的交易高峰过去之后，比尔在下午三点出现在走道上，抓住我的右耳，将我从转椅上拉起来。", "交易大厅里有一家小型的星巴克，一位身材魁梧的巴西咖啡师会在为你冲泡咖啡时，一边听著森巴音乐，一边以假音高歌。每次我和比尔想喝咖啡，都会去那里。但那天我们没有去那里，我们去一家离银行很远，位于宽阔、开放的金丝雀码头广场上的义大利小咖啡馆。一路上，比尔没说什么，然后他买了两杯卡布奇诺，示意我坐下。当时正值十二月初，低垂的午后阳光从天空中穿透故意设计出怀旧感的白色大木窗，洒在我们的木头桌面上。", "「你知道出了什么事吗？」比尔问我。", "「不。我不知道出了什么事。到底发生什么事？」", "「鲁伯特搞了史宾格勒。」", "这和我预料的完全不同。在我看来，史宾格勒光自己就能把生活搞得够糟糕了。我尽量不流露出任何情绪，只是说：「嗯，到底出了什么事？」", "「你还记得史宾格勒上次帮鲁伯特掩护的时候吗？」", "我确实记得。大约三周前，鲁伯特请了两周特休，尽管鲁伯特通常不会在如此重要的时候休假，但是法律规定每个交易员每年至少都要休两周的假，而鲁伯特今年从未排休。因为只留洪哥一人负责欧元帐本显然忙不过来，无法完成所有的欧元交易，而且这些交易太过重要，不能由我掩护，所以一直在北欧货币帐本表现得非常出色的史宾格勒
