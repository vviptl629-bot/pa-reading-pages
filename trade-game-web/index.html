是「无风险」的。", "他们错了。", "他们为什么认为贷款给政府无风险？理论上，在紧急情况下，政府有能力加印钞票。如果它们遇到大麻烦，并且欠你很多钱，它们可以印钱，然后拿来还给你。", "问题是义大利做不到，西班牙不行，希腊不能，葡萄牙也束手无策。欧元的诞生导致欧洲国家失去合法印钞的能力。因为这些国家的信用程度一直被认为是超级安全的等级，所以从来也没有人真正担心过这一点。直到它们不再安全。", "二○一一年，当人们意识到这些国家已经破产时，很快就有人质疑，提供贷款给这些国家，并且被它们的政府欠下巨额债务的银行是否也会跟著破产。此时距离雷曼危机过去还不到三年，没有人希望有更多的银行破产。欧洲中央银行必须采取行动。", "欧洲中央银行接下来的做法非常不符合它之前的惯例。它们向所有欧洲银行提供利率为一％的无限制贷款。", "这不是中央银行正常的运作方式。设定利率对央行来说是一件大事，他们喜欢研究个体的细节，他们通常会密切监控银行相互借贷的利率。如果利率太高，他们就会在系统中注入一点廉价资金，压低利率；如果利率太低，就会采取相反的做法，减少放款或借回资金，从而提高市场利率。因此，中央银行控制利率的方式是操纵系统中的贷款数量。如果你控制数量，你就能控制价格。类似于 iPhone 和 Nike 运动鞋的行销策略。", "然而，一旦你提供无限制贷款，你就失去控制数量的能力。如果你不控制数量，你就无法控制价格。欧洲中央银行肯定认为他们必须这么做才能保证没有银行破产，结果却反而造成市场陷入疯狂。", "欧洲中央银行和商业银行联合上演一场愚蠢的游戏。欧洲中央银行在它所谓的「拍卖」中提供无限制的一％贷款──尽管它并非真正的拍卖，因为所有人都能无限制的得到他们想要的东西。随著希腊政府破产的明朗化，银行蜂拥至央行的拍卖市场上竞标贷款。它们借了太多钱，导致大量资金涌入金融体系，欧洲利率跌至零，有时甚至低于零，比欧洲央行订定的一％的「官方」利率，也就是贷款成本，整整低了一个百分点。看到利率已跌至零，欧洲中央银行的下一场拍卖便变得乏人问津。如此一来，导致市场资金严重短缺，利率随之飙升至二％以上。这种情况每周都在上演，每家银行都在试图计算其他银行会借多少钱。如果你知道其他银行都会借钱，你便会尝试不去借钱，因为你预期市场上会出现廉价资金；如果你认为其他银行都不会去借钱，你就想尽可能多借一点现金。每家银行都在试图去做和其他银行相反的事，最终的结果便是全军覆没。", "欧洲央行有时甚至一周举办多次拍卖。没有人能够事先知道哪一天的利率会是多少，它可以是从略低于零到略高于二％的任何数字，它会连续几天都在这两个极端之间剧烈波动。老实说，我不懂为什么情况会变成这样。不过没关系，因为我有蒂兹。蒂兹像猎犬一样对这一切紧追不舍。一整天，每一天。", "ＪＢ没有蒂兹。ＪＢ什么都没有，那时的ＪＢ已经变成老人。之前的利率从来没有像现在这样过。在他的时代，中央银行每个月设定利率一次，然后它们就停留在原来的点，直到下一次央行开会。我们所有的估值体系和定价系统都是为这样的世界设计的。ＪＢ无法适应。我的工作职责必须提供头一个月的报价──大约是二十六或二十七个工作日。面对动荡的巿场，我只能叫蒂兹每天不断手动更新才能完成任务，因为现存系统根本做不到。ＪＢ却需要提供那之后的二十三个月的报价，差不多是六百个工作日。完全超出他的能力范围。", "他日复一日的遭受打击。他的价格是错的，而且我知道价格是错的。同样被汇丰银行晋升为欧元交易员的西蒙．张每天透过ＩＢ聊天室和我闲聊，问我为什么提供错误的价格。", "「那不是我。」我打字回复，「是ＪＢ。」", "「那他妈的ＪＢ为什么提供错误的报价？他会赔死的。你为什么不告诉他!?」", "好问题。我为什么不告诉他？", "你知道吗？事实是，我从来没有想过要告诉他。我也不知道为什么，也许我就是这样的人。", "ＪＢ在挣扎。他挣扎著想浮出水面喘口气。他日复一日的赔钱，我却春风得意，赚得盆满钵满。我靠蒂兹输入的报价赚钱，我坚信灾难的部位让我每天踏入交易大厅就赚进大量现金。ＪＢ从来没有转过头来问我为什么。", "真相是，他几乎不在座位上。", "ＪＢ在过去几年赚到不少钱，小组的每个人其实都赚到不少，包括我在内。ＪＢ已经实现他的梦想，他过得如此的好，说不定连你的梦想都帮你实现一部分。", "ＪＢ买下好几户俯瞰泰晤士河的豪华公寓。他搞大我们一位秘书同事的肚子，即将为他生下他的第一个孩子。", "他现在经常不在办公室，他会花很长的时间参加经纪人午餐会。当他回来时，他全身都是红的，然后他会像虫子撞上挡风玻璃似的投入巿场。光在旁边看，就令人感到痛苦。", "我告诉史努比我很担心。", "「用不著担心ＪＢ。」史努比微笑说：「在所有我认识的人中，他是最富有的一个。」", "所以事情就这样了。我想，就这样吧！", "当ＪＢ不在办公区时，我必须掩护他。他不在的时间比在的时间还要长。请记住，我负责的帐本，也就是短期欧元交易帐本，在欧元市场陷入疯狂之前，就已经是小组里交易量最大的帐本了。现在，宛如又坐上一圈又一圈永远停不下来的疯狂云霄飞车，我还另外承担ＪＢ超过半数的工作量。我简直要过劳死。", "但是你能怎么办？你还有什么选择？只能努力工作。随著欧洲的崩溃，我的 PnL 急剧上升；到了六月，我的累积获利已达两千两百万美元。那时的我成为整个交易楼层赚最多钱的交易员，虽然只领先第二名一点点。这是我人生中的重要时刻，我正在大赚特赚，我不会让来自昆士兰的酒鬼成为我的阻碍。", "我完成我的工作，同时也完成ＪＢ的工作。我每天很早很早去上班，我要求蒂兹必须早到。我从自行车上跳下来，直接进入交易大厅。我把自己锁在萤幕墙、扬声器、对讲机、蜂鸣声和叮当声之内，不久之后我就统治市场。我的每日交易金额超过五兆欧元。我不是很清楚这东西在全球有没有排名，但我猜想五兆欧元应该足够让我成为全世界最大金额的交易员之一了。确实没有其他方法来进行交易，当时的市场实在太过疯狂。", "我开始忘了换下骑车的运动服；不久之后，我根本一点都不在乎。我甚至不再把工作服带进办公室。我每天穿著灰色连帽衫和褪色的旧鬼冢虎运动鞋，戴著黑色露指手套进行交易。我在电脑上设定声音警报，只要某些情况发生，它就会出声警告。我的工作站变得很热闹喧嚣，每当我的 PnL 往上增加五十万美元时，它就会发出「叮铃当啷」的钱币撞击声。它时常发出这种噪音。在大赢的日子里，我们会在下午没有交易时，将扬声器音量开至最大，播放雷鬼音乐，我和蒂兹会把脚搁在办公桌上，一次喝两杯单份浓缩咖啡，然后起身跳舞。Harry J All-Stars 的〈Liquidator〉、Lee Perry 的〈Return of Django〉，以及 Toots &amp; The Maytals 的〈54-46〉，都在我们的歌单上。我是整个楼层排名第一的交易员，是交易大厅之王，蒂兹是我的得力助手。当然，蒂兹本身并没有赚到钱，他只是个孩子，只要让他跟在旁边一起玩，他就很开心。妈的，我说他还是个孩子是什么意思？蒂兹的年龄其实还比我大一点。我们当时都是二十四岁。我回到家，上床睡觉都会梦见市场。每晚都会。", "「有没有人说过你很……狂妄自大？」", "ＪＢ刚从厕所回来。每次ＪＢ从厕所回来时，脾气总是很暴躁。", "我对ＪＢ已经忍无可忍。他的人从来不在座位上，订的价格都是错的，日复一日的赔钱。虽然少数时候他也有赚钱，但那一点钱还不够付给经纪人，他现在居然骂我他妈的狂妄自大。", "我没有看他。我能感觉到他的目光盯在我左脸上的灼热感，但我只是把手放在滑鼠上，看著前方。我戴著我的小蓝牙耳机，我把耳机从左耳拿下来，以示尊重。", "「没有。从来没有。没人这么说过。」", "「嗯，我必须说我觉得这非常令人惊讶。你不觉得你这样回答就很狂妄自大吗？」", "我从抽屉里拿出一枝蓝色原子笔，用它的笔尖在塑胶桌面敲两下。我想过把它折成两半，但我决定不这么做。我放下它，转身看著ＪＢ。", "「ＪＢ，你什么时候才能摆脱赤字？」", "我们的脸相距不到三十公分。他鼻子上破裂的静脉血管像疾病一样蔓延到他脸上，我突然想起这人之前对我的帮助有多大，我为刚才脱口而出的话感到难过，但我没有让它表现出来。", "「你不用担心这个。我以前也不是没有由负转正过，以前可以，现在当然也可以。我知道我在做什么。」", "「那么你打算做什么交易呢？说来听听！ＪＢ。什么交易？」", "ＪＢ看著我的眼睛，我也看著他的眼睛。我们的脸现在距离更近了，几乎碰在一起，我可以听到他缓慢而有节奏的呼吸声。我注意到他的眼睛是多么的蓝，一双渗透这个世界很多年的老年淡蓝色眼睛。他暂停许久。我不确定他是在打量我，还是在思考。我也不确定我是否想从他脸上看出什么。", "「股票。」", "「股票？」", "「股票。」ＪＢ果断重复。", "「你要做的交易是股票？」", "「股票。它们过高了。」", "「你说股票过高是什么意思？」", "「看看它们！太他妈的高了！它们几乎没怎么下跌，可是全世界的经济都崩溃了！它们一定会下跌的。」", "我转身将视线从ＪＢ身上移开，再次拿起原子笔，在光秃秃的桌子上敲击了大约二十次。", "「ＪＢ，你还是没搞懂，是不是？世界不是那样运作的。股票永远不会跌，股票只会往上涨。当经济好的时候，股票就会上涨；当经济不好的时候，政府印出那么多的钞票，股票只会涨得更多。和他妈的房地产一样，一切都在上涨。资产持有者永远不会赔钱。有钱人永远不会输，只有富人才能获胜。你应该做的是买他妈的股票，老兄。它们会一路涨到月球。你只会大赚特赚，一点都不需担心。」", "然后，我起身去买四杯单杯浓缩咖啡。", "老实告诉你。当ＪＢ不在办公区时，我既要为他报价，也要为自己报价，我对他的工作确实不如对我自己的那般用心。他的交易记入他的帐本和他的 PnL，我的交易记入我的帐本和我的 PnL。孰重孰轻，我心里自有一把尺。虽然对不起他，但我就是这么想。", "ＪＢ也知道这一点。事情其实已在爆炸边缘。", "你可能还记得，身为「造市者」，我们将价差收入自己的口袋。假设真正的价格是七十一，我给你的报价是七十至七十二，你用七十二买，我找人用七十一卖给我，交易便完成。你买到你想要的东西，我赚到我的利润。每个人都高兴。", "问题是，所谓的「真正的价格」并不存在。或者说得更精准一点，它一直在移动。如此说来如果它在移动，你却没有发现它移动，又会发生什么事？", "假设现在真正的价格应是七十四。当我上厕所时发生糟糕的大事，但莫利还来不及更改萤幕上的价格，因为他太忙了，而且事情才刚刚发生。你联系我，要我报价，我查看萤幕，上面显示七十至七十二。我告诉你七十至七十二，你接受我要求的七十二，所以我现在想用七十一买进。", "我向莫利询价，他给我七十三至七十五．五。", "他妈的。", "如果不损失三．五，我就无法脱身。", "我告诉莫利，我付七十三。", "「太晚了。其他人已经出价七十四。」", "「好，真他妈的，你刚才说七十五．五的报价还有吗？告诉他们我会付七十五。」", "他沉默两分钟。", "「抱歉，伙计，七十五．五不见了。我现在拿到最好的价钱是七十七。」", "由此可知，要当造市者并不容易，你连去上厕所都不能松懈，必须小心谨慎，考虑长远。", "ＪＢ不在办公室。他出去喝酒，天知道他在哪里喝酒，将肚子灌满啤酒、清酒，可能还塞满生鱼片和天知道他妈的什么。", "有人打来要ＪＢ报价，我很忙。我在做什么？我不知道。也许我正在想那天的晚餐要煮点什么，我很努力的在改良我的柳橙鸭胸。", "我飞快的将食谱放在桌边，拉出价格萤幕。询问经纪人：", "「三个月期的价格？」", "「三十四至三十七。」", "三十四至三十七，嗯，听起来是对的，便随口重复一遍给销售人员。", "「三十四至三十七。」", "「我要三十七，两码。」", "销售人员切断通话，扬声器上发出短促而刺耳的无线电杂音。", "两码就是二十亿美元。相当多。我们应该马上处理其中一部分，降低风险。我压下扬声器开关，联络经纪人。", "「马可。你还在三个月期的萤幕上吗？」", "「对，现在还是三十四至三十七。」", "「好，我要一码。」", "无线电杂音。两分半钟的寂静。你看著电脑萤幕上的价格，可以看到它们正在改变。三十五至三十八，三十六至三十九。去他的马可，他从来没有收到过三十七的报价。去他的胡说八道。", "「马可，我他妈的三个月期呢？」", "「伙计，我真的很抱歉它不见了，现在我能拿到最好的价钱是三十九。」", "「他妈的！那你他妈的为什么告诉我你拿到三十七!?」", "「伙计，我拿到过的，我真的拿到过的，只是它后来消失了。」", "去他的，他从来没有拿到过。我立刻知道不可能再有这个价钱。", "我重新加载ＪＢ的 PnL 他的 PnL 下降十万美元。他在不久前才刚把自己的数字从红色变回黑色。这十万几乎足以让他再次陷入亏损。我倾身靠向蒂兹。", "「蒂兹！」", "「嗯？」", "蒂兹正拿著塑胶叉子吃装在厚纸食盒里的烤千层面。", "「蒂兹，我为ＪＢ接了一笔三个月期的交易，现在赔了，原来的报价失效，他的 PnL 跌掉十万美元。我们该怎么办？」", "「啊，干！他才刚刚变回正数。你能买回来吗？」", "「如果我们现在买回来，会损失二十万，PnL 会再次变回赤字。你觉得呢？」", "「你应该发简讯通知他。」", "我开始打字编辑简讯。", "「你在三个月期的交易赔钱，现在下跌十万。」", "在发送简讯之前，我又重新加载他的 PnL。跌掉二十万。我把「现在下跌十万」删除，替换为「看起来不太乐观」。", "然后，送出简讯。", "当ＪＢ回到办公区时，已经是下午四点，那笔交易总共赔四十万。ＪＢ喝了不少酒，看起来既开心，却又是一副随时会倒下的样子。我立刻就知道他没有读简讯。我往右看著蒂兹，他也在看著我。我把衬衫上打开的三颗钮扣中扣上两颗，蒂兹也做同样的事。我将电脑设为静音，现在可不是发出「叮铃当啷」的好时机。", "「好吧！混蛋们，世界看来如何？」", "ＪＢ坐在椅子上，重新加载自己的 PnL。我克制自己不去看他，但在我的眼角余光中，我看到他的脸上瞬间血色全无。他本能的按下马可的按钮。", "「马可，三个月期的价钱？」", "无线电杂音。沉默好一阵子。「四十一至四十四。」", "「这他妈是什么？」", "我的目光不在ＪＢ身上，而是看著他的扬声器，马可的灯没亮，表示这句话他是对我说的。", "「这是三个月期的交易。你在三个月期的交易赔了钱。我告诉过你了──在简讯里。天啊！你没看简讯吗!?」", "我抓到他的疏失。他没有看简讯。我们都知道他没看简讯，我们都知道他应该要看的。", "ＪＢ慢慢站起来，把手伸进口袋，以拿枪的姿势掏出手机。他慢慢念出简讯，一次一个字。", "「你．在．三个月期．的交易．赔了钱．现在．看起来．不太．乐观。」", "ＪＢ放下手机，继续站著，我也站起来。他转身面对我，两个人正面交锋。ＪＢ当著我的面，重复最后几个字。", "「看起来．不太．乐观。」", "我在脑子里咀嚼一会儿。", "「嗯……我的意思是……确实不太好……不是吗？」", "ＪＢ紧抿嘴唇，开始很快的点头，快到几乎看不见。", "「你打算要怎么办？」", "他说这话的意思很明显。我自己的 PnL 高达两千四百万美元，但这笔交易将ＪＢ打回赤字。然而，我毫不怀疑，百分之百肯定，如果中午在场的是ＪＢ本人，他也会做这笔交易。", "我还记得我第一次见到ＪＢ的情景。他是如何接纳我的。他是如何成为小组里第一个和我交谈的交易员，他是如何给我第一本帐本。我记得当我损失八百万美元时他是怎么安慰我的。我记得他对我说的话，一个字都没忘──「艰难的时刻总会过去，坚强的人才能永存」。然后我看著他的红脸，我看到四户俯瞰大笨钟的奢华公寓。", "我把舌头伸入脸颊深处，用力咬下去。", "「艰难的时刻总会过去，ＪＢ，坚强的人才能永存。」", "ＪＢ瞬间炸裂。他拿起沉重的棕色手提电话，使尽力气将它掷向萤幕。手提电话撞上他萤幕墙正中心那一片的正中央，弯曲裂开的萤幕将完好的手提电话弹回他的桌子上。没有其他东西被砸碎。嗯，萤幕当然不再是以前的模样。我清楚的记得我的脑子当时还在想，ＪＢ的动作迅速、果断、充满行动力，可惜发出的声音小得令人失望。", "ＪＢ显然和我一样觉得失望。他再度拿起手提电话，用尽全身力气，将它砸在桌上至少七、八次，每一次都伴随著他浓浓澳洲口音的：「干！」", "如果目的在于噪音的输出量，这么做的效果显然好太多。", "四周立刻安静下来，每个人都看著ＪＢ，而ＪＢ却在思考未来。他的右手仍拿著手提电话。他的左手仿佛是身体反射般的伸向扬声器，右手则将手提电话移至耳边。", "「罗比，三个月期的价钱？」", "他按下另一位经纪人的按钮。声音更大。", "「罗比，三个月期的价钱!?」", "短暂的停顿，然后ＪＢ的「干！」和手提电话砸上桌子的「砰！」同时响起。真是令人欣慰。", "「蒂米，三个月期的价钱？干！」砰！", "「米尔齐，三个月期的价钱？干！」砰！", "他一个接一个的询问经纪人。创造出一种真正的音乐，展现出一种不寻常的美。", "「ＪＢ，发生什么事？」", "查克用双手在嘴巴旁围成一圈，以一种相当自然的方式呼叫ＪＢ，就好像所有的骚动和我们无关。ＪＢ很忙，所以他没回应。", "「盖瑞，发生什么事？」", "这可不是个简单的问题。我在心里盘算几种可行的回应，最终我决定告诉查克：「我猜ＪＢ的手提电话可能坏了。」", "我想，就事论事，至少我说的是实话。", "查克十分理解的点点头，仿佛ＪＢ的举动是一个手提电话坏了的交易员应有的自然反应。他吃力的从椅子上站起来，慢慢走到办公区的另一端，经过ＪＢ和我，走向放著办公备品的小柜子。他费了好大的力气才把身体靠向底部的抽屉，从里头拿出一部又大又重的全新棕色手提电话，顺带拉出垂挂在手提电话上的卷曲长电话线。", "我永远无法理解查克接下来做的事。任何一个正常人应该会走过办公区，将手提电话递给ＪＢ，可是他没有，相反的，他只是大喊：", "「ＪＢ，这个给你。」", "然后将手提电话用力往空中一扔。", "手提电话在我眼前仿佛慢动作似的飞著，极高的弧线甚至刮过交易大厅的挑高天花板，它在蒂兹的正上方到达顶点，开始向我的右边坠落。蒂兹直直盯著上方。它从我头顶落下时，我敏捷的躲开了，并向后退了一大步。", "我根本用不著后退的，因为查克从来没有失手过。手提电话完美的在ＪＢ的光头中央著陆。", "我等著，大家也都等著。一时间交易大厅里鸦雀无声。我在想，不知道ＪＢ会不会杀了查克。", "然而，他没有。他只是停下动作，什么也没做。他不再压下按钮，不再砸手提电话。他轻轻坐回椅子上，似乎在思考非常非常重大的事。接著他掰起其中一个开关，不再使用按钮，使他可以不用透过坏掉的手提电话就能和经纪人对话。事实上，这个选项一直都在。", "「三个月期的价钱？」", "「四十一至四十四。」", "「你能在四十四时帮我买两码吗？」", "短暂的停顿，然后：「可以，你要吗？」", "「买进两码。四十四。」", "在这之后，ＪＢ没再做什么。他只是静静坐在位子上，深呼吸五分钟。中间有一度他抬起右手摸摸头顶，然后看看手指，好像在检查他有没有流血。然后，他站起来，回家。", "我不认为你可以透过敲打人们的头部使他们恢复理智。我以为只有在动画里才会出现这种情节。但谁知道呢？说不定真的可以。", "这是查克所做的最后倒数第三件事。", "私生活方面，哈利愈来愈担心我的状况。我不出门。我唯一做的两件事就是做饭和赚钱。", "关于我的传说在业界传得沸沸扬扬，哈利也听到了。很明显的，我即将成为一个大人物。哈利不明白为什么我不想享受它带来的好处。老实说，我也不明白。他常常邀请我的朋友们一起喝酒，并试著说服我夜店。他在 Cargo 俱乐部订一个昂贵的ＶＩＰ包厢，为我举办一场盛大而惊喜的生日派对，邀请许多人一起庆祝。我却只待一下就假装去洗手间，然后偷偷溜走，独自搭公车回家。", "哈利不断向我洗脑，说个不停，我看得出来他的出发点是好的，于是最后我答应他，好吧！我们可以选个派对去参加。我们住的火柴工厂即将举办某种夏日活动。我去楼下健身房时，总遇到一个女孩对我微笑，所以我想她应该会去。我只是想让哈利那孩子知道，只要我愿意，我还是很有魅力的。", "我们去了，那女孩和她的朋友也在。我带了一瓶一公升的百加得兰姆酒，我问她们要不要一起喝一杯。她们说好。我其实不算英俊，但有必要时，我还是可以散发一点魅力。", "我们四个人去酒吧玩到凌晨，远超过我平常的上床时间。我其实很困，我看得出来哈利喜欢她，所以我想我就放手吧！我问女孩的朋友（后来才知道是她的室友）要不要一起去麦当劳，于是我们决定搭夜班巴士回家。我一坐上公车就睡著了，当我醒来时，她正在抚摸我的头发。", "史努比在那年的夏天结婚。他只邀请比尔观礼，没有邀请我们其他人。", "史努比仍然在赌经济会复苏，我则坐在角落试图说服他复苏不会发生，此时查克走过来说：「现在结了婚，感觉如何？」", "史努比坐著，查克就站在他身后，所以他不得不扭转身体，将脖子扬得高高的。", "「呃嗯……还不错，查克，是的。还不错，还不错……满好的。」", "「啊，拜托，你说满好的是什么意思？告诉我一些细节啊！」", "「我不知道，查克，你想让我说什么？就很不错！我工作了一整天，回到家，她已经做好晚餐……感觉很好！」", "查克对此并不满意。", "「那么，她煮了什么？」", "「你这么问是什么意思？她煮了什么？她每天煮的东西不一样！」", "「嗯……她昨晚为你煮了什么？」", "史努比想了一下。", "「昨晚……昨晚她煮……烤义大利面。」", "查克的脸皱起来，额头也皱起来。他搔搔头，眼睛往外转。", "「义大利面？」他难以置信的问：「义大利面!?」又重复一次。", "他把沉重的身躯靠在桌子上，使自己能够直视史努比的眼睛，然后以带一点稚气的认真态度问他：「义大利面……上面淋咖哩吗？!?」", "我和史努比因为这件事笑了很久，久到不得不暂时离开办公区，出去回避一阵子。", "这是查克所做的倒数第二件事。", "「她有一种特殊的气质。我认为她是个巫师。」", "哈利有次喝醉时是这样描述她的。那个我们在派对上遇见、带我搭公车回家的女孩。从那之后，我们便一直暱称她「巫师」。", "巫师的皮肤很白，两颗极大的绿色眼睛，还有一头又长又直的金发。她在月光下全身会散发淡蓝色的光。", "我试著向她解释我的工作。", "「听起来你不是很喜欢它。」她对我说。", "「妳说我不喜欢它是什么意思？我当然喜欢！」", "「如果你不喜欢它，你知道的，你就应该辞职。若是我，我就会那么做。」", "我对她说：「听著！我现在并不想发展认真的男女关系。我不认为我还会在这里待很久。我必须搬去某个地方，可能很快就会离开，但是我还不晓得我会去哪里。我觉得妳应该多去认识其他人。」", "查克把小组所有人叫进一个房间。这一次我不再是小组里最资浅的人了，所以守著办公区的是蒂兹，我则被允许入内。", "房间里布满阳光。查克总是能够找到最好的房间。里头有一张长会议桌，查克坐在最前方，背靠一扇大窗户。我站在ＪＢ旁边，比尔和史努比坐在我们对面。其他交易员零零散散的站在四周。", "查克告诉我们，两周前他在回家时迷路。查克说，这不是他第一次迷路，却是第一次被他太太发现。她送他去医院检查，查克的脑袋里长了一颗网球大小的肿瘤。", "「所以我必须请假一段时间。」", "我看看比尔，发现他的视线已经在我身上；他看我，看了好一会儿。ＪＢ将他手肘贴在我的上臂，透过衣袖的布料，我仍可以感受到他皮肤传来的暖意。", "「没什么大不了的。医生说他们可以把它拿掉，所以我应该不会离开办公桌太久。」", "他说完，我将视线移回查克的方向，窗外的光线洒在查克背上，让他只剩一个黑色的剪影。我看著他厚厚的眼镜、宽大的笑容，还有和我父亲一模一样的发型。", "这是查克所做的最后一件事。之后，我再也没有见过他。", "小节 4", "巫师的卧室和我的卧室隔著花园相望，只是她的比我的高三层楼。当我躺在床上时，可以看到她家在飘动的窗帘。我们常常去格林威治公园，看著太阳从世界中线的山顶上越过摩天大楼落下。", "「当你说你必须搬去某个地方时，是什么意思？」", "「我不知道。我的意思是，我得去某个地方。我不能一辈子待在这里。」", "「你要去哪里？」", "「我不知道。日本？航行去智利？反正是某个很远的地方，不是这里的某个地方。」", "「这和你的工作有关，是不是？你讨厌那份工作。为什么不干脆辞职呢？」", "她不明白。我的心里藏著两千九百万美元，每毛钱都在尖叫：「你不能辞职。」", "我和史努比恳求比尔。我们知道如果他不点头，那就会是青蛙。我们没想到他真的会答应，但他确实松口了。比尔接任我们小组的新主管。", "我不知道他为什么答应，比尔其实非常讨厌行政职务。他会对销售人员和其他小组的交易员说脏话。每次电话响起，我或蒂兹接听时，他会疯狂比划，用手划过喉咙，好像在说：「告诉他我不在。」", "当鼻涕虫打电话来时，没有人想跟他说话。比尔不跟他说话，ＪＢ也不跟他说话。没有人赚到钱，没有人期待分红，所以自然也没有人在乎。当然，除了我以外，我很在乎。", "所以当鼻涕虫打电话来时，是我去接电话。我会对他说：「比尔不在座位上，老板，不过有什么是我能帮您的吗？」", "鼻涕虫告诉我，他想要花旗银行成为全球交易量最大的外汇银行。于是，从那之后，我每天的交易金额上升至近兆美元。", "哈利想要追求巫师的室友，但我觉得他似乎没有取得任何进展。他开始频繁的拜托我安排四个人一起出去玩，不久之后我们几乎是隔周周末就会出去一次。", "我们还未成年时，哈利和我从来没有真正一起出去过。我们那时不是一起踢足球，就是一起玩 PlayStation。他刚到合法喝酒的年纪没几年，所以我从来没有真的和他一起出去喝过酒。结果，我这辈子第一次意识到这家伙是恶魔。他喝的量比我的体重还多，喝起来还特别凶狠，不留情面。", "一旦他喝下满到鼻孔的酒，他的左眼就开始无法聚焦，他和我说话时不会看著我，而是直接靠在我身上，对著我身后三十公分处说个不停。他将额头用力压在我的额头上，过了一会儿，他冲进舞池，扑向巫师的室友，她推开他，表情厌恶。", "我不在乎。我唯一在乎的只有数字。交易量和我的 PnL 数据，中央银行的拍卖，还有每天七千亿、八千亿、九千亿美元的单日贷款。实习生或毕业生培训计划的孩子常常三三两两的坐在我身后，他们会问：「盖瑞，你是怎么想出这个交易的？你的入场点是多少？」", "我会回答：「谁在乎我他妈的入场点？入场点已经是过去的事了。我只关心今天和明天，我不会把不需要的数字记在脑子里。」", "然后实习生就会被吓到，借口要吃午餐，赶紧小跑步离开。", "蒂兹说：「你不该对实习生这么刻薄。你知道吗？他们都叫你『传奇人物』。」", "我知道。不过我一点都不在乎。", "「听著！你是个很好的交易员。也许不只是好，应该说是相当厉害。但你其实不如自己想像的那么聪明。我看到你能慧眼独具的辨识出高点和低点，这并不是因为你是天才，而是出于你的本能。对你来说，交易就是一场游戏。」", "我什么也没说。他的废话不值得回应。", "「你有一个大问题，盖瑞，你必须面对它、解决它。」", "蒂兹继续他妈的说个不停。", "「什么问题？」", "「以我们的话来说，就是『凡人皆狼』＊。」", "这家伙，真让人受不了。", "「『凡人皆狼』到底是他妈的什么东西？」", "「这是拉丁语，盖瑞。它的意思是『对人来说，人就是狼』。」", "我觉得自己已经听够了这些屁话。", "「蒂兹，站起来，看看你的四周。」", "我站起来，张开双臂。", "「看看这些家伙。看看这些混蛋。他们每个人都把手伸进我的口袋里。他们每个人都在偷我的钱。所以不要跟我谈什么凡人皆狼，小子，我们两个早就被狼群包围了。」", "当时，我觉得那是一个令人信服的论点。我想，也表示蒂兹说的可能是对的。", "不过我说的确实没错。突然间，我成为全世界交易金额最大的交易员之一，所有人都想从中分一杯羹。年轻的孩子们会出现在交易大厅，友善的拍著我的背，回忆我们在伦敦政经学院共度的美好时光，但我甚至不记得见过他们的脸。当鼻涕虫来出差时，我不得不和他单独吃午餐。实在太恶心了。", "经纪人们为了分一杯羹，比任何人更疯狂，想摆脱他们是不可能的。他们简直像湿疹一样爬满我的身体。有一家公司聘请一个没那么出名的公众人物来负责与我通话，想要赢得我的业务。我在搜索引擎上调查他的资料，看到一张他在海滩上用吸管喝凤梨鸡尾酒的照片；另一家公司雇用我以前的高中校友，只因为他说他认识我。每个人都想带我出去，上餐厅、看足球赛、一起度假。这些行为开始让我感到恶心，于是我立下「仅限南多斯＊」的规则。你想见我吗？可以，我们在南多斯的金丝雀码头分店碰面，帐单各付各的。但最终我吃了太多烤鸡，所以不得不把这条路也堵死，之后不管任何人想见我，我一律拒绝。", "高层们派青蛙来取代比尔，我心知肚明这是必然的结果。比尔仍旧坚持经济即将复苏，他很勉强的将自己的 PnL 维持在黑字。他和ＪＢ几乎惹怒交易厅里所有的人。没有人处理小组的行政庶务，但因为我还想拿到分红，所以我几乎接管一切。银行自然不会永远让一个二十四岁的人管理整个小组。", "对我来说，光是和青蛙待在同一层楼都让我难以忍受。他让我感到恶心想吐。我永远不会忘记那家伙是怎么陷害我的，只要他一开口，我就浑身发痒。他做的第一件事是把我拖进会议室，告诉我他打算自己接手ＪＢ的工作。他没有告诉ＪＢ，却告诉我，也就是我必须坐在ＪＢ旁边整整一个月，却不告诉他他即将被解聘。", "经纪人们不只想带我出去，他们也想带哈利出去。我不知道他们是想利用他来接近我，还是单纯的喜欢他，不过哈利和经纪人们显然一拍即合。经纪人们擅长挖掘你的恶习。他们用肮脏的手摸遍你全身，直到发现一处弱点，然后他们就把他们胖胖的手指塞进去，拿任何你想要的东西满足你。哈利有很多弱点。他们带他去什么地方，他就乖乖跟去──酒吧、餐厅、俱乐部、妓院，他甚至在吸食我连听都没听过的毒品。我很清楚他什么时候吸嗨了，因为我早上醒来会看到四十七条不知所云的简讯，他却站在他的房间里扭动身体。", "我应该挺ＪＢ吗？大概应该；如果情况反过来，他会挺我吗？百分之百会。但是到那时候，我的年度 PnL 已经超过三千一百万美元，我非常渴望能拿到分红。只要青蛙开口要求，他想要接手我妈妈的工作我可能都会同意。", "于是青蛙接手ＪＢ的欧元帐本。这使他成为我的搭档，意味著我必须每天坐在他旁边。他将ＪＢ贬到角落交易澳币，直到他能找到一个很好的理由解雇他。", "在扫除ＪＢ这个障碍之后，他立刻来找我。", "「听著，盖瑞，我们遇到一个问题。你知道的，你是一位很棒的交易员，今年也赚了不少，可是整个小组却在苦苦挣扎……银行也没赚到什么钱……我不确定我们有没有办法给你今年的分红。」", "我感觉血液瞬间涌向我的双手和头部，开始有点头昏。我想吐在地板上。", "我看著青蛙。他穿的所有东西都黏在他身上，却又从他身上掉下来，仿佛他的身体是由错误的乐高积木组成的。那混蛋脸上还挂著微笑。", "这家伙他妈的以为自己是谁？一个头发蓬乱、脸颊松垮的宽嘴混蛋，居然敢来告诉我他付不起该给我的钱。他知道我为了赚这些钱经历过什么吗？不，他不知道，对他来说，这只是一场游戏。这笔钱比我二十五代祖先赚的加起来还他妈的多，但对这家伙而言，它不过是一场游戏。", "嗯，我会让你知道，对我来说，这可不是游戏。", "在此我学到一个教训。那就是：当你周围的人被搞的时候，你应该挺身保护他们，否则轮到你被搞的时候，也不会有人为你出头。", "不，去你妈的，我可不是来学教训的，我也不会挺身保护任何人。我只保护自己。我向来如此。", "从那之后，哈利几乎永远不在家。即使是他罕见的出现在家里时，也多半是无知无觉的趴在地板上流口水。", "每天晚上公寓都由我独享，我和巫师，一起煮义大利面，看电影。说实话，在这之前，我从来没有看过电影。", "我告诉她，某个状似肥青蛙的混蛋想搞我，不把该付给我的钱给我，但我不会就这么接受。她对我说：", "「那些家伙，他们只是不了解你。除了我，没有人了解你。听著，我买了一些棕色油漆，打算粉刷客厅的一面墙。你想过来一起刷吗？」", "那段期间，我常接到猎才顾问的电话。每周都有，一周好几次。在这之前，我向来直接挂断电话，但是现在我开始和他们交谈。我让他们将资料寄到我的个人电子邮件地址，那时我使用的信箱是「Thegazman1000@hotmail.com」，他们会要求我仔细为他们拼出来，然后他们会问，「是 Thegazman1000@hotmail.com吗？」", "我会回答，「是的，没错，Thegazman1000@hotmail.com。你是觉得 Thegazman1000@hotmail.com 有什么问题吗？」", "然后他们会说：「不不不，不不不。当然没问题。」", "然后他们会为我安排面试。", "我去过巴克莱银行面试，去过美国银行面试，去过高盛面试。我穿著连帽衫和运动鞋参加高盛的面试，当场告诉他们我一点也不想要那份工作。之后，他们还是请我回去第二轮复试。", "每次面试时，我都会拿一张他们董事总经理的名片，给它拍张照片，再将它带进办公室，隔天一早放在青蛙的桌子上。他需要知道，如果我没拿到我应得的分红，会有什么后果在等他。", "我问猎才顾问，公平的分红应该有多少，他们告诉我七％。三千两百万美元的七％。它必须是我的。", "小节 5", "我将今年稍早透过哈利交易的巨额美元隔夜指数交换获利了结。光是那一笔交易，我就赚进九百万美元。我故意透过哈利，找到当初和我对赌的那位德意志银行交易员了结交易。然后我让哈利计算 PnL，看看我从那人手中，光靠这笔交易就赚多少钱。我想告诉你，我这么做是因为我想给他目标，希望激发他努力向上。事实却是，我知道他将会在金丝雀码头广场的每家酒吧里为我吹牛，而我想在分红日之前刻意推高我在圈子里的名声。", "哈利的情况变得愈来愈棘手，他的神智几乎一直都不怎么清醒。他会满眼红丝的在半夜回家，吵醒我后，我会问他：「兄弟，你刚才吸了古柯碱吗？」", "他会回答：「不，我不吸古柯碱的。」", "我会说：「你说谎，你他妈的吸了，伙计，你现在就是他妈的刚吸过吧？如果你妈妈知道你吸食古柯碱，她会说什么？」", "然后他会转移话题，结结巴巴的说：「兄弟，你今年能拿到多少钱？」", "我会回答：「我不知道，伙计，两百万美元？」", "然后他会一边笑，一边戳著我的胸口说：「你他妈的为什么能拿这么多钱？我工作比你努力十倍！」", "我会说：「这不是你工作有多努力的问题，伙计，从来都不是。」然后我会回卧室，上床睡觉，让他穿著鞋子趴在地板上。", "办公室里的情况也变得愈来愈棘手。坐在青蛙旁边让我恶心想吐。他总讲一些可怕的笑话，我别无选择，只能跟著笑。每次我这么做时，我都感到从胃里涌出的酸性胆汁的锐利刺痛感，穿过我的心脏，进入我的喉咙。我别无他法，只能把它咽下去。时间进入十二月，我已经赚将近三千五百万美元。我不能让任何一件小事出差错。", "ＪＢ还坐在青蛙指派的角落。他看起来有些不对劲，他体重减轻许多，变得非常瘦。我回头看他时，常看到他的嘴在微微的移动，仿佛在用气音说话，他的眼睛还会不时出现抽搐现象。", "我在夜里开始失眠。", "一天晚上，我在凌晨一点半被吵醒，客厅传来一阵骚动。我打开房门，哈利和一群我之前从未见过、看起来像住在克莱姆的白痴，正在我的餐桌上吸食古柯碱。", "哈利抬起头，面无表情的看著我，露齿微笑。", "「你没事吧？盖尔！」", "我身上只穿一条内裤。其他经纪人（因为他们一定是经纪人）显然没有哈利吸得那么嗨，他们有些尴尬的向我点点头，左右张望。", "我在门口站了一阵子，然后我越过他们，走进厨房。我从柜子里拿出一个玻璃杯，用力放在柜台上，在里头倒满牛奶。我端著它走回客厅中央，只穿著内裤慢慢喝下去，然后我站在那群人中间，一个、一个轮流盯著那些垃圾的脸。", "他们开始四处寻找外套，穿上鞋子，然后说：「差不多了，哈利哥儿们，我想我得走了。」", "哈利回应：「喔，别走，伙计，我们才刚开始呢！」", "不到一分钟，他们全都走光。我正要回去睡觉，哈利在我身后大喊：「为什么我找乐子，你总要搞破坏!?」", "隔天青蛙不在办公室，只剩我一个人负责全部的欧元交易。我很生气，拒绝和任何人对话，甚至连蒂兹也遭受池鱼之殃。我只是坐在那里，一言不发的进行交易。", "下午两点左右，我的萤幕上弹出ＩＢ聊天室的讯息。上面写著：「昨晚遇见你的妞，老兄，她身材真辣，好眼光。」", "对话框旁边显示的名字是「昆汀．本廷」。", "我不认识任何一个叫昆汀．本廷的傻瓜。", "我盯著萤幕的眼光一定凌厉如刀吧？因为ＪＢ经过时，他注意到了，他问我：「去他的，伙计。出了什么事？」", "我什么也没说，只是指著萤幕上的讯息，ＪＢ瞇起他的老花眼，看著萤幕，说：「去他的，该死的家伙！昆汀．本廷到底是谁？」", "我摇摇头：「他妈的我根本不认识。」然后我点开聊天室。他名字的后面有一个括弧，里头的大写字母显示公司名称：（ＩＣＡＰ上巿股份有限公司）。", "我们两个沉默好一会儿，只是并肩站著，双手托住下巴，思考下一步该做什么。然后ＪＢ靠过来，按下我扬声器上ＩＣＡＰ的开关：「从现在开始，花旗银行和ＩＣＡＰ之间的所有业务全部停止。永久停止。如果你们想知道为什么，去问昆汀．本廷。」", "然后他转身，向其他小组成员宣布：「每个人都按下你的ＩＣＡＰ开关，告诉他们花旗从此不再和他们做生意。如果他们想知道原因，请告诉他们去问昆汀．本廷。」", "然后他将双手圈成筒状，围在嘴边，对著整个交易楼层大喊：", "「花旗到ＩＣＡＰ的所有线路现在开始全面关闭。如果有人想知道为什么，请告诉他们去问昆汀．本廷。」", "一大排ＩＢ聊天的请求如瀑布般在我的萤幕倾泻而下。前一个的提示音还未消失，后一个的提示音就已响起。ＪＢ在我的后颈拍了两下，直接走向洗手间去吸食古柯碱。", "ＩＣＡＰ是一家大型经纪公司，它是伦敦最大的两家经纪公司之一。每种产品他们都有经纪人，表示交易大厅里的每个交易员都至少有一位ＩＣＡＰ经纪人。就在这一刻，那些肥胖混球中的每一个都发疯似的扔下手上的起司汉堡，穿过经纪大厅，怒气冲冲的走向昆汀．本廷。紧挨他的座位，坐的便是非常年轻、非常宿醉，而且现在紧张得不得了的哈利．桑比。", "我发简讯给巫师。显然她和她的室友去酒吧时，遇上哈利和一群喝醉且吸毒吸得神志恍惚的经纪人。女孩们想走，但因为她们和哈利住同社区，所以那些人就跟在她们后头回家，最后所有人都进了我的公寓。女孩们只短暂停留一会儿，所以当我醒来时，只看到一群吸毒的胖子。我猜昆汀．本廷也是其中的一个。", "我回到家时，哈利很沮丧。他穿著过大的皮鞋在公寓里来回踱步，双手抱著头，声音嘶哑的抽泣。", "「你他妈的在做什么？你他妈的在做什么！我们会被解雇的！我们两个都会被解雇的！！」", "「你问我在做什么是他妈的什么意思？你自己才是他妈的在做什么！昆汀．本廷这个混蛋到底是谁？而且事情也不是我做的，是他妈的ＪＢ干的！」", "「是，但你他妈的可以阻止他啊！他妈的阻止他，你可以阻止他！把线路放回去，重新开通它们！」", "「我他妈的为什么要把那些该死的线路放回去!?那个该死的白痴必须得到教训，你也是。你他妈的到底在做什么!?」", "「你问我在做什么是什么意思？我什么都没做！我他妈的到底做过什么？」", "「听著，你这个该死的白痴，」我的脸正对著他的脸：「我他妈的还有一个月就要成为他妈的百万富翁了。我不能犯任何他妈的错误，而你他妈的在做什么？你他妈的在一个上班日的晚上，在他妈的凌晨，把四个他妈的同业胖子带进我他妈的房子，然后你在我他妈的餐垫上吸食古柯碱，这就是你他妈的做过的事。你他妈的是傻了还是怎么的!?」", "哈利什么也没说。我们只是鼻子碰鼻子的站在那里。", "「你妈妈会怎么想？如果你妈妈知道你做了什么，她会怎么想？别以为我不知道你他妈的都做些什么，因为我知道。我知道你晚上去哪里，我知道你做了什么。她会怎么想？如果她现在能看到你，也能看到我，她会怎么想？她会为我们感到骄傲吗？如果她知道你现在是怎么过日子的？」", "哈利伸手在我胸口上用力一推，我努力保持平衡，不往后退。", "「别和我谈论我妈妈，你又不是我爸！照顾我不是你他妈的责任，我会照顾我自己！」", "「喔？是吗？那么你做得怎么样？你把自己照顾得怎么样？你他妈的爸爸在哪里？谁他妈的在照顾你？谁给你做饭？谁帮你付他妈的帐单？谁帮你得到你他妈的现在的工作，谁在你爬不起来时他妈的载你去上班？对，他妈的就是我在做这些事。我才是他妈的照顾你的人，我才是赚这些钱的人，你现在做的只会搞砸一切！」", "「是吗？为什么呢？盖瑞？为什么盖瑞？为什么？你他妈的为什么要赚这些钱？盖瑞？你他妈的从来不花钱啊！你他妈的从来不享受！你他妈的从来不去任何地方，你他妈的从来不做任何事情，你甚至从来不跟你自己的妈妈说话！我们最后一次和你爸爸一起去看东方队比赛是什么时候？他妈的从来没有！我们再也不去看球赛，我们再也不做任何事！你他妈的再也不跟你的朋友说话！你他妈的在做什么？这一切到底是为了什么？你谈论伊尔福德的样子好像它对你来说很他妈的重要，表现得一副你他妈的正在为他们做什么事一样。你他妈的再也不回去他的伊尔福德！你最后一次去是什么时候？你再也不和来自伊尔福德的任何人说话，你根本不和任何人说话！这到底是怎么回事盖瑞？这他妈的到底是为什么？」", "我不想回应他的话，于是我扔下他走了。我离开公寓，去健身房。当我回来时，他已经趴在沙发上不省人事，他的口水都流到地板上。", "隔天，我安排我、昆汀．本廷和他的老板在码头碰面。我直接和他老板安排碰面，而不是和昆汀，因为我不想跟那烂人说话。", "昆汀三十五岁上下，他老板四十多了。他们知道，我知道他们知道。他们知道哈利的状况，知道他没有家人，他们知道他们其实应该以更好的方式照顾他。", "我告诉他们，我向他妈妈承诺过我会照顾他，如果我允许两个胖子将他带进嫖妓、吸毒的深渊，我永远不会原谅自己。我问他们是怎么看待自己的，他妈的成年男人居然这样对待一个二十岁的孩子。", "他们向我保证他们会以更好的方式照顾他。我不知道他们后来是否真的这么做了。我走回办公室，对著整层楼的交易员大喊：「和ＩＣＡＰ的线路现在重新全面开通。」", "小节 6", "然后是分红奖金日。", "关于那一天，我只记得几个数字。我的 PnL 刚超过三千五百万美元，我的分红应该是获利的七％。我记得的差不多就是这样。我不记得那间会议室，我不记得有收到分红，我不记得青蛙那张丑陋的脸。", "我记得我当时心里有一个清楚到个位数的金额，那就是我想要的。我现在不记得它是多少了，但它应该是三千五百万美元多一点点的百分之七，所以一定是在两百四十五万美元上下。", "在分红的数字出现的那一瞬间，我就把它忘了。它成了另一个过去的、不再有影响力的数字。我向来不把不再需要的数字记在脑子里。三千五乘以○．○七，这就是我得到的。这就是我应得的。", "大家都很满意。", "任务完成。", "那天晚上，我在又黑又冷的一月夜色中骑自行车穿过东伦敦回家，每次呼吸都带著白色的蒸气。我一如往常的经过克里斯普街市场，那里的一幅巨大壁画是我最喜欢的涂鸦：一只高达六层楼的吉娃娃，用后腿站立，伸出舌头，底部是一家清真炸鸡店。我看著炸鸡店在黑暗中洋溢热腾腾的红光，店门旁一个白发老人正忙著将一床棉被塞进一个破旧的大床垫边缘。棉被套的布料会发光，是一种闪亮的白，或者更准确的说，在月光下是一种明亮的蓝。它肯定是刚从包装袋里拿出来的。我不禁在想，一个住在炸鸡店旁边小巷里的白发老人怎么会有这样一床全新的、闪亮的白色棉被。然后，突然间，在我生活二十五年的这座城市里，我第一次在吸气时感觉到伦敦的冷冽空气灌入身体，充满我的肺部，燃烧起来。我不明白我为什么会有这种感觉。", "回到家后，我坐在客厅角落的小书桌考虑要怎么投资。这是一大笔钱，我得好好规划，好好投资。", "巫师来了。当她进门时，我看著她，我注意到，当她看到我时，她的脸上浮现一抹担心的神色。我将视线转回萤幕。她走过来，抚摸我的头发。", "「事情顺利吗？你心情还好吗？」", "「很顺利。太好了。我拿到应得的份了。」", "「你看起来不太开心的样子。」", "「嗯，妳知道，这是很多钱，我必须将它投资出去。感觉有点压力。」", "巫师听完，只停顿几秒钟。她的手依旧搁在我的头发上。", "「你知道吗？如果我赚和你一样多的钱，我最不想做的一件事，就是独自一人坐在客厅角落，觉得压力很大。」", "她的话一出口，我就知道她是对的。我真讨厌她就这么一针见血的戳破真相。", "第二天，办公室里一切如昔。", "同样的人，同样的噪音，同样的粉红和白色衬衫。", "同样的经济，同样他妈的交易。", "年底时，我已经将帐本全清理干净。不过现在是新的一年，所以我需要新的交易。", "不，实际上，我并不需要新的交易。我不需要新的交易，因为一切都和之前相同，没有改变。", "同样的贫富不均在持续恶化。同样的家庭失去他们同样的家园。同样的无力消费。同样的没有钱。经济没有成长，也没有他妈的任何改善。我拿起手机又将它放回去，灾难交易已经持续两年。", "你知道吗？但它让我赚得荷包满满。", "关于我对世界经济的看法中，有一部分是富人会变得愈来愈有钱，其他人却会变得愈来愈穷，言下之意是利率将永远保持在零，因为经济永远不会有足够的消费力去促使价格大幅上涨。", "然而，在此的价格并不是指所有东西的价格。当贫富不均加剧时，价格难以上涨的原因是，富人花在商品和服务上的支出占他们收入的比例，远较一般人的比例更低。相反的，他们花在资产上的支出则要多出许多。富人以愈来愈快的速度累积资金，更何况现在还可以拿到超低利率的贷款。两件事不可避免的将加乘起来，大幅推高包括股票和房地产在内的资产价格。", "这件事让我很担心，因为我刚刚得到一大笔钱，可是我名下没有任何房产，所以我在办公室附近的豪华码头上找了一户豪华公寓，直接在卖方要价上加五％，就这样买下房子。", "有一天晚上，我带哈利去看那户公寓。我们站在阳台上看著外面的船，他在抽烟，我没有。我对他说：「我要买下这地方，哈利。你知道这是什么意思，对吧？」", "他对我说：「是的，兄弟，这里太棒了！我们会玩得很开心的！它好大啊！我等不及要搬进来了！」", "我对他说：「不，哈利，我要买下这地方。我，不是你。我要买下这个地方，而你要回家了。」", "直到今天，我都还记得月亮落在他眼睛里的样子。", "我懒得在办公室花费任何心力。我不和任何人说话，甚至连蒂兹也不怎么交谈。蒂兹和我的经纪人为我做所需的最低限度交易，然后钱就一直流进我的 PnL。我每天只是戴著耳机坐在位子上看报纸。到了三月底，我又赚进九百万美元。", "青蛙从没问过我是怎么赚到这么多钱的，鼻涕虫也没有。我相信为了以防万一，他们宁愿不知道。但我听到青蛙讲笑话时，再也不跟著笑了。事实上，除非绝对必要，否则我根本不和他说话。他把我拖进办公室，对我说：「我们很担心你，盖瑞。我们担心你没有团队精神。我们希望你能真正成为我们之中的一员。」", "我其实没在听他说话，但他的最后一句还是引起我的注意，所以我问他：「你说『我们之中的一员』是什么意思？」", "青蛙垂下他长方形的头，像要告诉我什么秘密似的倾身靠向我，他说：「听著，盖瑞，你是一个很厉害的交易员，你非常聪明，有一个光明的未来。你可以像我们一样，你可以升上管理阶层。但是，我不知道……我们觉得你有问题。我们真的不知道你想要什么。」", "「你是什么意思，我想要什么？」", "「嗯……金钱似乎无法驱动你……我不确定我是否真的了解你。我和其他高阶管理人员……我们想知道……你想要什么？」", "我看著那个家伙，脑子显然在想，「嗯，如果你以后不再是个令人难以忍受的混蛋，那就太好了。」", "但是我累了。我真的、真的感到非常疲倦。尽管我不再跟著青蛙的笑话假笑，但那股灼热疼痛的感觉却一直在我的胸口盘旋。那一刻真的很难受，于是我握紧拳头用力按在心脏上搓揉。我对他说：「青蛙，我会努力培养团队精神的。我想成为团队的一份子，为银行赚更多的钱。」", "一群其他银行的金牌交易员想见我，所以他们让比尔的经纪人问他有没有办法带我出去聚一聚。在那个阶段，我其实已经不太常出去，但因为是比尔，所以我答应了。", "餐厅包厢是一个洞穴般的大房间，又低又暗，以烛火照明。一张直长的桌子摆在正中央，上头摆满食物，一路延伸到房间的后方。", "交易员分坐在桌子两边，当比尔和我走进去时，他们已经在吃东西。我可以看到交易员背对著我们，弯腰倾身拿取食物时肌肉将白衬衫撑得鼓鼓的。", "一个身材高大的男人站起来，把手伸过桌子，他对面的两个经纪人在他将手伸向我时，立刻像红海一样往两边分开。", "「我是卡洛．兰格尔，瑞士信贷资深英镑交易员。」", "「盖瑞。盖瑞．史蒂文森。」我告诉他，比尔什么也没说，我们走向各自的椅子。", "我们的座位在最后面的右侧，我可以很清楚的看到整张桌子和桌边的两排宾客。", "我对这群人印象最深的，是他们的体型，宛如和牛一般丰富的肌肉和脂肪完美和谐的交错交融。和他们丰富的身体对映的是丰富的餐桌、一盘又一盘的肉、由看不见的侍者斟满源源不断的美酒。", "我很快就明白这是卡洛主办的聚会。卡洛坐在桌子正中央，大声说话，时不时挑选一些人让他们加入谈话。他又吃又喝，一边讲话，一边掌控谈话的节奏，除了在旁观看外，没什么可做的。比尔去吧台，买了两瓶啤酒回来给我们。", "卡洛赚很多钱，很多很多钱，从他的言行举止都可以看出这一点。他希望身边环绕的都是最优秀的交易员，世界级的，他一一轮流的和我们交谈。", "他很了解我，也很了解比尔，尽管我对他一无所知。因为我们坐在桌子的最末端，所以他用非常大的音量谈论我们是多么棒的交易员，有多么了不起。比尔和我点点头，举起啤酒向他致意。", "比尔很快就喝醉。非常快，不到一个小时，就已经神智不清，他站起来，含糊的用利物浦口音说一些什么，我很快的跟著起身，说一些比他说的更有礼貌、更容易理解的话，然后扶他走到前门。", "「去你妈妈妈妈妈的……卡尔……去你妈妈……卡尔．兰格尔！！」", "我用比尔的手机打电话给比尔的计程车司机，比尔选择利用等待的时间疯狂的指指点点并且跳舞。他抓住我的衬衫领子两侧，为了强调他的论点，决定当我的面再重复一遍。", "「去你妈的卡尔．兰格尔！干！他妈的他妈的卡尔．兰格尔！他看起来就像一个该死的罗马胖皇帝！他妈的，他妈的……他妈的……白痴……他妈的……贱人？」", "最后一句话说到一半时，他看到一个性感女郎在黑暗中拖著脚步离开，瞬间走神，不幸的是，这在一定程度上影响他咒骂的重点。不过他仍然抓著我的衣领，所以我轻轻在他脸上拍一下，提醒他：「比尔！」", "这一掌成功的让他回神。", "「听著！盖尔。如果你以后变成像那个罗马胖子，我会他妈的他妈的亲手杀死你。就用这双手！」", "然后他把他的两只哈比人小手从我的衣领上移开，疯狂挥舞，我想，「好吧！那么我最好小心点了。」然后比尔的计程车司机终于出现，我将他身体打横、头部朝前的放入计程车后座，然后车子便轰隆隆的载他去英格兰银行撒尿。", "我回到洞穴，准备和他们吃一大堆食物，谈论我们这群交易员有多么了不起。", "也许你会觉得这听起来很糟糕，也许这听起来很恶心，但是其实也没有那么恶心。我在那个时期已经不再觉得任何事情恶心。在那个时期，我只觉得无聊至极。无聊，无聊，无聊，无聊，无聊。我真希望比尔还没走。我想回到有巫师的家。", "终于到了晚上十点。我觉得现在离开应该可以被接受吧？", "「喔，别走！」卡尔尖叫。此时，他喝得满脸通红，胖嘟嘟的脸简直像一只已经烤熟准备下架的乳猪。", "「我很抱歉，卡尔。我真的得走了。明天早上还要工作，你知道的。」", "卡尔对此并不满意，他将自己从桌边挣脱出来，越过成堆食物，摇摇晃晃的向我走来，从后面将我揽入他宛如和牛的怀抱里。我只记得我对他的温暖和柔软大感惊讶。", "「别走，盖瑞。」我感觉到他湿漉漉的呼吸喷在我的耳边。", "「听著，我本来不想告诉你这个，」他用气音说著，语气亲密：「但是我和一些小伙子之后要去续摊。我们要去多佛街酒吧。你去过多佛街酒吧吗？」", "我没去过。", "「听著，它真的非常棒，你一定要一起来。每家都有一堆漂亮的妞。以十分为满分，至少可拿八分，甚至八分半的都有。」", "然后他制止我的动作，把我转过来，让我们两个变成面对面，他毫不犹豫的看著我的眼睛，带著一种慈父般的纠正态度补充：「你知道的，我在这里谈论的可是严格的一到十分呢！」", "我没有去。", "我坐火车直接回到堡区的家。从车站走回家的路上，在黑夜中，我顺手抓住一辆汽车的后视镜，毫无理由的用力将它扯下来。", "小节 7", "我告诉哈利，在公寓共度的最后一晚，我们可以办一场告别狂欢派对。他很高兴，邀请所有人参加，包括我们以前的邻居，还有金融城里的孩子。他有点兴奋过头，甚至邀请在离公寓不远的连锁轻食餐厅 Pret A Manger 打工的女孩们。", "蒂兹来了，花旗的其他一些孩子也来了，还有几个自称来自花旗但说实话我根本不认识的年轻人。伊尔福德的阿萨德来了。贾尔佩什、艾登和马什菲克都来了。巫师的妹妹远从诺维奇来参加。我哥哥来了之后却整个晚上都坐在厨房喝茶。我们将所有门窗打开，一直播放音乐直到深夜，大量抱怨蜂拥而至，但我不在乎，因为我已经把所有东西都搬出去了，第二天我们就会永远离开这里。", "在派对当中，有那么一瞬间，一切看起来都很好，一切看起来似乎都没问题。小时候的邻居和金融城里的人一起聊天喝酒，看起来相当正常。阿萨德的时髦乌克兰时装设计同学们一边跳舞一边吸毒，我在寒冷的夜色中和巫师一起靠在阳台上，仰望著有两百年历史的高耸火柴厂红砖圆柱体烟囱，心里想著，不知道之后我们还会不会有相聚的机会。", "但是在实际的答案揭晓之前，在更深的夜里，我就已经看到注定的结局。我可以看到他的眼睛逐渐失焦，说出的话也开始语无伦次，我可以看到他的脚已经抓不住地板。我知道我就要失去他了。老实说，我知道他已经神智不清。我知道他即将倒地。他将威士忌酒瓶举得高高的，然后和它一起坠落地面。酒瓶和男孩摔在地上，棕色的玻璃碎片在他手里炸开。", "鲜血滴滴答答的流向地毯。巫师走向他，我却钉在原地，动也不动。当她拿著厨房毛巾试图包住他的手时，他却对她上下其手，抱著她的身体摩蹭摇晃。等她止住他的血时，我抓住她的手，然后我抓住她妹妹的手，我说：「走吧！我们他妈的离开这里。」", "之后，我有八年没再和哈利说一句话。", "我搬进新公寓，将里面拆得一干二净。墙壁、地板、灯、厕所、厨房水槽。我把它们全部清空，直到什么都没有，只剩下一个干净的灰白水泥石膏空屋。", "灰色的水泥地板。白色的石膏墙。", "拆光后，我应该打电话给建筑商，装上新东西。新的厨房，新的地板。", "但我没有。我不知道为什么。我做不到。", "我在裸露的水泥地板上放一台电视，在卧室里摆一张床垫。每天我在凌晨五点半起床，然后我会坐在地板上阅读五百封电子邮件。", "有一天，巫师来看我，她说：「你在做什么！你不能这样过日子！」", "我笑著回答：「没什么不行的。」", "于是她打开她的笔记型电脑，找到一个名为「免费回收」的网站，做了一些安排。一张老旧破烂的红色灯芯绒沙发便被送进我的客厅，摆在电视前面。每天五点半下班回家后，我会迳自倒在沙发上呼呼大睡，然后我会在凌晨一、两点醒来，月光从全部拉开的窗帘倾泻进宽敞的空房间，我会发现巫师蜷缩成一个小球，和我一起躺在破烂的红色沙发上。我会抚摸她的头发，叫醒她，然后带她回卧室睡觉。", "人力资源部门要求我做各式各样的事情：发表演讲，和刚入职的毕业生对谈。谁他妈的知道为什么，也许是他们认为我平易近人？", "有一次，他们安排一大群当地学童参观花旗大楼，他们问我那一天有没有空，能不能带他们到顶楼，为他们演讲。", "我当然说：「好啊！有什么不行的呢？」反正像我这样的混蛋，就应该做这样的事。", "然而，就在那个活动举行的前两天，我才发现它和欧洲中央银行会议撞期了。", "对一个负责欧元的 STIRT 交易员来说，欧洲中央银行会议向来是一等一的重要大事。在它举办期间，你应该仔细聆听，不该是对当地学童分享你的生活。但是，你知道吗？去他的不应该。我都已经答应了。", "老实说，我本来有机会侥幸逃脱的，可是正如你知道的，STIRT 的欧元交易员不只我一个，青蛙也是，所以在我为波普拉区学童提供正面男性榜样时，青蛙却在交易大厅里放声尖叫：「盖瑞他妈的在哪里？」他破音的感叹句很快的透过简讯传到我的手机上。", "我以所有能想到的、最礼貌的方式回复青蛙：「真的很抱歉，但是我答应人力资源部今天会为当地贫困学童提供支援。」", "青蛙相当不礼貌的回应：「滚回他妈的办公区！」", "他的态度显然是一种对我们公司所在地的贫困儿童的高度社会排斥，既粗鲁又麻木不仁，然而透过他简讯传达的指示却也是相当明确，所以我别无选择，只能放弃我的公民责任，转身下楼，回到交易大厅。", "结果他妈的欧洲中央银行会议什么都没发生，于是我一边听著会议进行，一边给人力资源部写了以下的道歉电子邮件：", "「亲爱的＊名字省略＊", "对于我在这么短的时间里通知您我无法参加您精心安排的活动，", "请接受我十二万分的歉意。", "发生这种情况是因为我的上司＊省略真实姓名＊（副本收件人）", "认为与当地贫困学童对话，并非在有效利用我的精力和时间。", "祝一切顺利。", "致上亲切的问候。", "盖瑞」", "青蛙大声尖叫，扯开喉咙的叫嚣。他站起来，坐下，哀号，身体拱起，倾身靠近我，焦虑踱步，挥舞双臂。", "我并没有在听他说什么。我时不时看他一眼，假装自己正在思考，然后点点头。这么做只是为了表示尊重，你知道的，让他知道我正在反省。虽然说实话，我一点都不在乎。", "他把我拖进一个小房间里对我大吼大叫，让我觉得仿佛回到学生时代。", "我以前在学校时常常挨骂。迟到，不交作业，和老师顶嘴。还有，虽然只发生过一次，贩卖毒品。", "我经常迟到是因为我必须先送完报纸，然后冲刺二．四公里试图准时到达学校，至于我很多作业缺交的原因，嗯，老实说，是因为我从来没有一个真正安全的地方可以坐下来写作业。", "但是，你知道的，他们并不在乎这类的事，不是吗？所以我就乖乖的听他们大吼大叫。我有时会充满同情心的抬头看著他们，我会点点头，然后我会想，嗯，你知道的，也许这样对他们也好。说不定他们可以借此发泄一些压力。", "不过，大多数时候，我只是坐著，用双手撑著下巴，手肘搁在膝盖上，低头看著地板。我任由他们大吼大叫，直到他们再也骂不出任何话，就像当时我在那个办公室对青蛙做的那样。", "他大吼大叫，不时哀嚎，我则凝视地板。", "然后，我第一次注意到一些以前没有注意到的细节。", "原来我的鞋子也有破洞。", "就在那里，在我的两只鬼冢虎运动鞋的外角处，在我两脚小姆趾所在的位置，出现两个完全对称、直径大约两公分的破洞。我的两个小脚趾裹著莱顿东方队的红色袜子，正试图从洞里色彩鲜明的探出头来尖叫。", "去他的！这双运动鞋我穿多久？从大学第一年吧？这两个洞已经存在多久？我甚至不晓得它们何时破的。", "然后我抬起头来，我记得青蛙还在大吼大叫，我看著他的眼睛说：「老板，我想我没有办法再继续这样下去……老板，我想我得辞职。」", "这句话狠狠击中青蛙，他的表情仿佛天外突然飞来一支手机打到他的头，我不禁笑了出来。", "「你刚刚说什么？」", "小节 8", "我从来没有想过我还会再见到他，但那个人就站在那里。", "他妈的大头，他妈的宽厚肩膀，他妈的大手上长著他妈的肥大手指。", "他站著，姿势一如既往，在阳光的照耀下只见一道黑色的剪影，不过这次的窗户距离更远了。迦勒．祖克曼。", "我没看到他走进来，也没看到他走向我们的办公区，因为我进行交易时，习惯戴著耳机，将兜帽拉起来罩住整颗头。年轻且易受影响的蒂兹学我戴上耳机，可是他对自己还没有足够的信心，不敢像我那么狂妄的把兜帽拉起来，所以当ＪＢ、青蛙、史努比和比尔都站起来，跑向办公区末端的那个男人时，他注意到了。", "他扯了扯我的衣袖，我拿掉一侧耳机，听见他对我说：", "「嘿！那家伙是谁？」", "就在那时，我转过身来，看到他们站在办公区末端兴高采烈的狂拍对方背部。距离我上次见到这个男人已经过了三年。他看起来没什么变，只是稍微缩小一点，有点像你进入青春期开始抽高后，再次见到你祖父时的那种感觉。", "所有的交易员都离开自己的座位涌向他，除了之前没见过他的蒂兹，以及我。", "我虽然没有站起来，但我转动椅子，直勾勾的看著他。一股灼热的痛感在我的胸口盘旋。", "我需要问那个人：「为什么？」", "然而，你不能直接问他：「你为什么回来？」", "这么做显得很不尊重。", "这么做暗示那个人决定离开是一次完全失败的冒险。你不能对迦勒这样的人做这样的事，你必须为你的问题加上巧妙的掩饰。", "同样的，向来是谈话艺术大师的迦勒也意识到，不能够直接问身为花旗现今最赚钱的交易员的我，为什么要在一周前告诉青蛙我不想再当交易员，然后在他追问我做出如此重大决定的原因时，只是指著我鞋子上的破洞（这个理由普遍被认为不怎么令人满意），并迅速将要求从草率的自我解雇，降级为申请休长假。到目前为止的官方说法是，他们仍在审慎考虑我的这个请求。", "基于这些原因，几个小时后，在那个温暖的夏日，迦勒、ＪＢ、比尔和我坐在一家日本料理餐厅的阳台上，看著月亮从泰晤士河面冉冉升起，我们喝了许多酒，直到深夜，但四个人心中最想知道的真实问题，还是没人开口。", "你相信日本人会饮用木盒里的米酒吗？他们真的会。他们将一个玻璃杯放进一个方形木盒里，慢慢将米酒倒入玻璃杯中，直至满到边缘，但他们不会停手，反而继续倒，米酒溢出来，顺著玻璃杯侧流下来，开始填满木盒。持瓶者仍继续将酒倒入玻璃杯中，直到玻璃杯和木盒都装满才住手。我一直很喜欢这种做法。我猜它应该代表热情好客之类的意思。但是，对于那天晚上第一次目睹这种行动的我来说，却总是让我联想起那些无法溢出人们心头的问题。", "三个人想知道迦勒为什么回来，第四个人则想知道，我为什么从未透露任何想法却突然决定辞职。可是没人提起这些，相反的，我们谈论迦勒在加州的生活，以及比尔和我在交易大厅里的英雄事迹，讨论ＪＢ刚出生的孩子，以及青蛙如何卑鄙的将他拉下宝座，当然还有ＪＢ未来的复仇计划。", "不过，我们没有谈及他失败的婚姻，也没有讨论当时在他血管中涌动的古柯碱。我们没有谈到我们面容的变化，指出我和ＪＢ变得多么憔悴。我们没有谈到迦勒眼中失去的光芒，也没谈到这种失去如何让我联想起更年轻、更快乐的自己。", "在那个温暖的夏夜，泰晤士河将城市闪烁的灯光反射在我们身上，我们不去谈论已经不属于我们的东西。我们沉浸在我们的荣耀中，不去管我们的失败。我们让它们沉入河中，无人提出，无人知晓。", "尽管如此，我的心中仍旧隐隐作痛。", "当时，我们都知道，迦勒会将我带走，这显然就是他接下来要做的事。不管他要去哪里──花旗银行、德意志银行或其他机构──他都会带著我。这就是他回来的目的，为了把我从青蛙身边拯救出来。", "可是在我问他之前，我无法离开，所以我耐心等待时机。", "然后，突然间，机会来了。当我看到ＪＢ和比尔的注意力都放在喝酒和彼此的对话时，我将自己的脸贴在迦勒的脸上，轻声问他。", "「告诉我，真正的加州生活到底是什么样子？」", "那一段时间只剩下我们两人，他告诉我：「很美，盖瑞。我们有一栋美丽的豪宅，前廊全由巨大的石柱支撑，相当壮观。我们特地将它盖在乡间，专为我们量身设计。屋子里非常开阔，向外可以看到美丽的大花园。后花园绵延数英里，深入高大的森林。在英国你见不到那样的树。孩子们整天在花园里一起玩耍，直到入夜，佛萝伦斯会为我们一家四口做饭，我才出去叫孩子们进来用餐。一年四季都很漂亮、很温暖。」", "他停顿一下，在那瞬间，他似乎有些颤抖。我看著他巨大的眼睛和巨大的笑容，我稳稳的和他对视，没有退缩。", "「但是有一个问题。那些帮我们建造房子的人，你知道的……我不确定他们是不是行业里的佼佼者。他们是我妻子娘家的朋友，你知道吗？有一些小事……那个地方……设计……我不确定，你知道吗？我觉得他们并不太行……」", "他又停顿一下，他移开视线，我催促他再多说一些。", "「为什么你会这么想？迦勒？你这么说是什么意思？」", "「嗯，我的意思是，举例来说……自动调温器。他们把自动调温器放在离壁炉太近的地方。当你在冬天使用壁炉时，自动调温器就会被触动，中断二楼的暖气供应，让楼上房间变得很冷。」", "我直视他的眼睛。不让它们有机会逃开。", "「我们叫他们回来移动自动调温器，可是问题还是无法解决。无论我们把自动调温器放在哪里，都无法让它正常发挥效果。」", "迦勒继续说著，不过我已经放空，脑袋里只剩一个画面：一栋巨大而美丽的房子，一个巨大而美丽的厨房，推门出去就是美丽的花园；两个美丽的金发男孩充满活力的玩闹，金色的阳光洒在他们身上，后头是巨大的异国树木的剪影；美丽的妈妈走进花园。", "「提摩西！雅各！晚餐准备好了！赶快进来！」", "毗邻厨房的大房间里摆著一张超大餐桌，之后便是一个极大的客厅。", "客厅中央，闪闪发光的水晶大吊灯下，身材高大的有钱大头男子坐在巨大的豪华单人沙发椅上。", "他的眼睛盯著墙面的某样小东西。就在壁炉上方，更高一点，偏左之处。", "他盯著它看，像一头狼注视著猎物，恶狠狠的盯著。然后，一根粗大的手指在沙发扶手上抽搐一下。", "自动调温器。", "这一刻，我突然明白为什么迦勒决定回到交易大厅。", "他回来，是因为他必须来。", "「我想坦白一件事。」", "我突然宣布，尖锐的声音引起比尔和ＪＢ的注意，将他们再度拉回我们的时空。", "「你们还记得我之前告诉过你们，我当初离开一流明星高中，是因为我认为这么做可以提高进入伦敦政经学院的机会？」", "三个人都点头。", "「那是一个谎言，事实根本不是这样。我离开，是因为我被开除了。我因为贩卖毒品而被学校开除。」", "ＪＢ和迦勒以非常缓慢的速度，露出微笑。他们的脸仿佛被火光照到似的，突然亮起来。", "可是比尔没有微笑，他深深的凝视著我。当我回望他的眼睛时，我可以看得出来他很害怕。", "小节 9", "当我还是个很小的孩子时，我有一个和我住在同一条街上的朋友。他叫杰米．西尔弗曼。", "杰米在各方面都是最厉害的──足球、投掷、攀爬、骑自行车、吐口水。他可以把尿撒得超高，几乎能越过街道远处的墙，撒进回收子母车里。他在学校也表现良好，总能拿到最好的成绩。每个人都爱他。因为我哥哥有点怪，经常被其他孩子欺负；我个子太小太瘦，又过于年幼，无法保护他，所以杰米经常保护我们兄弟。从小到大，我都视他为偶像。", "随著年龄的增长，每当有新事物出现时，新的运动或新的比赛、新的学校科目或新的流行；例如，直排轮──杰米总是立志成为这方面的第一名，而且，他也总是毫不费力的做到。对他来说，没有什么事太难而做不到的。他获选进入学科竞赛和运动比赛的地方代表队，尤其是投掷项目，他似乎不费吹灰之力就能表现出众。", "当女孩子成为我们的讨论焦点时，他的异性缘无人能敌。当毒品成为我们的热门话题时，他同样是我们之中最擅长的那个人。", "他从不抛弃我，总是带著我。不管他在做什么，总会教导我一起做。", "在我十六岁因为贩毒而被学校开除之后，我再也不碰毒品。杰米和我不同，他反而沾染更多。愈来愈多。愈来愈多。这小子确实连毒品都擅长。确实是。", "事情终于发展到我再也无法忍受看到他的地步。他的体重一天天减轻。每一次我见到他，他都比上一次更高、更瘦。每一次我见到他，他不是在火车货站场，就是在别人家的屋顶上吸大麻。", "我当时就在想，我再也不要见他。我当然爱他，但是我真的不想再见到他。每次我看见他，心里就难过得不得了。", "几年之后，他得了肺气肿，那是一种因为吸毒过量导致肺部崩坏的病。我去医院看他，我带了葡萄和该死的鲜花，那家伙看起来像一具鼻子里插著管子的骷髅。", "但是他仍然还想和我说笑，回忆以前的时光。每次我见到他时，依旧如此。仿佛什么都没有改变。", "当我看到他躺在医院，瘦得可怕，浑身插满管子，皮肤是病态的黄色时，我的脑子里唯一的念头，是他曾经是整个该死的行政区里最厉害的投掷运动员。", "真是他妈的可惜。", "小节 10", "青蛙让我在房间里坐下。", "「鼻涕虫说你不能休长假。」", "不要回应，点头就好。", "「他说他上一次核准某人休长假时，那人再也没有回来。他不希望这种事发生在你身上。」", "再一次点头。", "「不过你还有另一个选择。迦勒要回来了，他将成为 STIRT 的东京负责人。他想将你调去那里。」", "我再次点头。", "「那么，你觉得呢？」", "深深叹一口气，想了好久。", "「老实说，青蛙，我不认为这是一个好主意。我已经不行了。我没办法再这样下去。」", "现在轮到青蛙叹一口气。他低下头，一边假装自己在思考，一边将指关节压得啪啦作响。过一会儿，他抬头看我，露出一个比他那张丑陋的脸还要大的笑容。", "「你不明白，盖瑞。你必须去。」", "好。", "没问题。", "就这样吧！", "我带我的父母去伦敦巿中心的一家高级日本餐厅，通知他们，我要搬到日本。", "他们两个穿得像要上教堂似的，极不自在的在长得像凳子的高脚椅上调整姿势。", "「你搬去那里能够适应吗？」", "我妈妈问。", "「当然可以。不管什么状况，我都有能力应付的。」", "整个晚上，他们似乎完全无法放松，我猜是因为他们不知道要如何使用筷子。", "「没关系，」我告诉他们：「你们可以直接用手拿寿司。」", "我随手拿起寿司，放进嘴里，亲自示范，让他们放心这么做并不失礼。不过，那时我爸爸忙著把玩酱油瓶，所以他错过我的表演。", "我把服务生叫过来，要了两把叉子。但是，似乎也没有什么帮助。", "距离我离开的时间只剩两周。我计划告诉巫师我们得分手。", "我选择开口谈论这件事时，已是深夜，我们两个都在床上。", "「嘿……妳知道我要去日本，对吧？」", "「是的，当然，我知道你要去。」", "她躺在床上。我坐著，俯身看她。所有窗帘都拉开，房间里满是蓝色月光。她的话悬在空中，我仿佛可以看到它们，我试著想抓住它们。我记起我似乎该说些什么，似乎该做些什么，但我却怎么都不记得到底要做什么、要说什么，于是她接手，填满所有的空白。", "「你知道我也会去，不是吗？你知道我也要去日本吧？」", "我仿佛从另一个房间听到这句话，仿佛声音是从梦里传出的，它惊醒我。我低头看著她，心里想的是：", "「妳知道我配不上妳，妳应该去找其他更好的人。」", "但我说出的却是：", "「我觉得……我需要……妳一起来。」", "我不知道我为什么这么说，因为它和我原来的计划背道而驰。我想，我这么说是因为，那是真的。", "二○一二年九月下旬，我在花旗银行伦敦交易大厅的最后一个上班日。收拾好东西。和几个人互拍背膀。在我离开办公区时，ＪＢ突然大声喊：「盖瑞．史蒂文森即将离开本大楼！」", "我知道当我走出去时，他们全都站起来欢呼鼓掌。我可以听到他们的声音，我的眼角余光可以看到他们，站在每条通道的两侧。白色衬衫、白色衬衫、粉红衬衫、蓝色衬衫。", "可是我没有回头，只是直接走出大门。", "＊编注：Lake Como；自罗马帝国开始就是贵族和富人喜爱的度假胜地，具有众多的艺术和文化瑰宝。⤴", "＊译注：green Eurodollars；此期货有时以色码表示，绿色代表三年期四季度合约。⤴", "＊译注：Homo Homini Lupus；指人在自然状态下具有掠夺、残忍和不人道等和狼相似的行为。⤴", "＊译注：Nando's；英国连锁烤鸡店。⤴"], "wcount": 39353}, {"icon": "5", "title": "第5章 下台前的最后一战", "paras": ["小节 1", "当你沮丧的时候，东京是一个好地方。尤其在秋天。", "银行聚集在东京市区一个名叫「丸之内」的区域，意思是「圆圈之内」。这个名字源自该区域在历史上的某段时期全落在皇宫外护城河的范围之内。至于那条护城河现在在哪里？我不知道，我一直没找到它。", "有很长一段时间，法律禁止在丸之内建造可以俯瞰皇宫的高楼，另外，我猜可能是怕有人试著用十字弓或其他东西暗杀天皇吧？到了一九八○年代，因为该地区的土地价值变得如此之高，开始出现例外。当我到达那里时，那个区域已经有高达五十层的大厦。传统和天皇当然很重要，但我想，金钱也一样重要。", "花旗东京分公司座落在深灰色金属框架的新丸之内大厦里。如果我离开办公室向西走，可以直接走进皇宫的外花园，也就是「皇居外苑」。这个花园其实是一大片修剪整齐的草地，被两条繁忙的道路分成三块，里头种满上百万棵独特、但一模一样的树木，树与树之间则完美的相距七或八公尺。", "每棵树都不大，比人高不了多少，复杂精致，是我在英国从未见过的类型。第一次走进花园时，我以为它们是盆栽，但是我后来才知道，盆栽实际上是一种培养袖珍小树生长的日本艺术形态，并不是一种树的分类，所以我想它们一定是其他种类的日本树木。", "穿过花园，走个大约十分钟，经过数百棵独特却相同的树木，你会抵达一座古老的石桥。它横跨内护城河，通往皇宫建筑的内部。那里竖立一扇门，常年关闭，外人无法进出。", "我经常去那里，坐在碎石地上的小台阶，转身看著丸之内。从那里，你可以拥有不错的视角。你能够以皇居外苑的绿草和树木为前景，看到巨型摩天大楼耸立在东京的蓝天。", "丸之内不像金丝雀码头。金丝雀码头没有那么多摩天大楼，而且我看过它们一栋一栋拔地而起的过程。对我来说，它们全是独立存在的个体，尤其是我小时候看著它们盖起来的三栋核心建筑──花旗银行大楼、汇丰银行大厦，以及中间的金字塔大厦。丸之内有许多摩天大楼，整个区域是摩天大楼的地方，远比不是摩天大楼的地方还要多。至少有三十栋，或四十栋，或五十栋，每栋都有四十层或更高，整个区域就像一整块积木似的矗立。尽管东京的天气从夏到冬的变化很大，但我记忆中的天空总是温暖的，总是蓝色的。或许是因为我在二○一二年九月底刚到的时候，它就是这样的。", "当我坐在皇居外的小阶梯上，看著丸之内时，我总会想到同样的事。", "「天啊！」我会想：「窗户真多。」", "那么多的摩天大楼，那么多的楼层，那么多的窗户。在每一扇窗户后面，一排排的男男女女日复一日的在一排排的电脑前工作，从清晨一直到深夜。", "世界问题怎么还没被他们解决呢？", "我站起来，掸掉裤子腿上的白色碎石，走回办公室。在回到交易大厅后，我开始做交易，押注世界末日即将来临。", "小节 2", "在我搬到东京时，以我当时的状况，其实真的不应该搬家的。我的体重已经连续下降好几个月，到东京时我不足六十公斤，即使我个子偏小，这样的体重也是过轻。", "我不确定当时知不知道自己出问题。我的确有想过，无法购买沙发，或者实际上无法购买任何家具，可能是病态的、不正常的。然而，想是想过，却没有进一步做什么，就像许多我心生怀疑的时刻，想著，却也让它就那么过去。如果我没有轻忽，事情也许不会恶化得如此严重、如此迅速。只不过当时的我还有其他更紧迫的问题要烦恼，例如：利率。", "我胸口的灼痛感可以透过名为「ＰＰＩ」＊的药丸来缓解，它可以阻止胃酸呈现酸性，虽然胃酸本来就应该是酸的。我从一年前开始使用这种药丸，效果很好，可以立即缓解我的疼痛。我搬到日本前正处于第三个疗程，可是效果却不如之前那么好。我当时问医生：「只能这样吗？我必须一辈子都吃这种药吗？」", "他将处方笺递给我，面带微笑说：「可能吧！」", "在这段期间，我依旧不断的在进行交易，交易，交易，交易。交易成了我唯一仅剩的真正朋友：客观、冷静、安全。", "交易的特点是，它一直存在。你知道的，市场永远不会停止。", "嗯，我猜，它们确实会在周末停下来，即便如此，至少经济永不停歇。", "经济已经成为我的一种执著，像漏油一样，随著胸口的灼痛感在心里蔓延。", "我的确已经完全不在乎办公室里发生的事。但是，经济呢？我对经济的热情从未消逝。", "当我第一次意识到经济已经崩溃，会年复一年的变得愈来愈糟时，我并没有想太多。我的意思是，我确实想过，我当然想过。可是，我从来没有问过自己这代表什么。", "它是我的工作，你知道吗？你看著经济，你会说──好吧，今年会怎么样？经济表现强劲还是疲软？明年呢？我的说法是稍微简化一点，但归根究柢，利率交易的本质差不多就是这样。这是我的工作。", "假设你的工作是测量游泳池的深度，你不会到处测量游泳池，然后问自己「这表示什么？」假设你的工作是修理沙发。你不会问你的朋友：「这张沙发是什么意思？」", "当我意识到经济将永远恶化时，我充满信心，我有足够的信心去下大赌注。我可以看到让它发生的机制，而且我可以清楚知道为什么大多数受过训练的经济学家都没有发现它。我看得很透澈，我现在也依旧能看到。可是我从未问过自己：「这表示什么？」", "我只是进行交易，我只是在做我的工作。", "但是，当那笔交易开始让我成为整个花旗全球外汇交易部门最赚钱的交易员时，人们逐渐意识到，它不仅是一个理论，而是正在发生的事实。", "我因此赚得一大笔钱，然后我用这笔钱进行投资。当我在为自己进行投资时，我曾问自己：「我为什么要投资这笔钱？我将来会把它拿出来花掉吗？可能不会。」", "然后我想：「嗯，既然如此，我就把它当成留给子女的投资。」", "然后，非常短暂的，我想到：「但是，如果我是对的呢？我的孩子将会生活在一个什么样的世界？」", "不过，我很快甩掉这个念头，将注意力放回投资上，因为投资和数字是我喜欢且擅长的东西。数字是我安全的藏身之所。", "虽然也有少许的时刻，微小而短暂的时刻，茂密的树冠在我上方展开，让我瞥见黑暗的星空。在那些时候，我确实梦想辞职。我想我那天在青蛙办公室里发生的事，就是这种时刻之一。在我因胸口灼痛带来的短暂清明中，我看到天空。我意识到，一个二十五岁的百万富翁穿著破鞋工作、住在没有铺地板的房子里，是不对的。晚上睡在破烂的红色沙发上，半夜被冷醒，整夜梦见数字。不时忍受胸口灼痛，有时甚至吃不下东西。这可能就是为什么，在那一刻，我告诉他我想辞职。", "但是，辞职的大问题是──我不能。你知道吗？我的双手被铐住。二○一二年初，当花旗银行付给我那笔记不清实际数目的巨额分红时，他们便小心翼翼的设计好，将我紧紧绑在我的萤幕墙上。一部分的奖金已经给我，就是那笔我拿去投资的钱，其余的款项却被严重的延迟支付。二○一三年付四分之一，二○一四年付四分之一，二○一五年付四分之一，二○一六年付四分之一。所以你看，在当时我真的无法离开。银行欠我超过一百万英镑，如果我辞职，我就会失去所有的钱。", "所以，这也许是为什么，那天我坐在那间办公室里，我的鞋子上有洞，我的胃上也有洞，灼热酸液冲过我的胸口，我感觉异常沮丧，觉得自己像只老鼠似的落入尘埃，所以当青蛙告诉我公司一定要将我调到东京时，我答应了，即使我知道我没有精力去做这件事。我什么都没有，连拒绝的力气都没有。我被铐住了。", "可是你知道吗？即使是老鼠也有牙齿，我也有。我利用不上班的时间搜集资料。", "如果交易员都被铐住，无法离开，二○○九年迦勒是怎么离职的呢？迦勒又怎么能在美丽的树林里建造他那栋美丽的房子？", "我查了一下，询问几个人──好吧！我承认，我只是去问比尔。", "比尔告诉我，合约中有一条条款，可以让你离职并保留所有现金，那就是你必须辞职后去为慈善机构工作。知道这个条款的人不多，但迦勒知道，不过无法得知他做了什么而触动该条款。每个人都知道，他后来并没有去为慈善机构工作，但鼻涕虫却还是放过他。没有人知道确切的原因，没有人可以肯定。也许迦勒手上有鼻涕虫的把柄。", "这是我在独自飞往东京的长途飞行中所携带的细长逃生绳。如果迦勒能带著他的钱离开，我当然也可以。不只如此，接下来，迦勒还会是我的上司。如果一切进展得不顺利，或者，如果一切都很顺利，我会等到下一次领完分红奖金后再辞职，去为慈善机构服务。迦勒一定能理解的，不是吗？", "他当然能。迦勒会理解的。", "★★★★★", "在飞往东京的航班上，我确实是孤单一人。巫师并没有和我在一起。巫师如她承诺的将会搬到日本，但我去的时候她并没有随行。她自己买机票前往，安排自己的工作，由于某种原因她找到的职位不在东京，而且要等到二○一三年一月才能开始。", "我几乎什么都没带。为了帮助我搬家，银行给我一个八立方公尺的空运货柜，我不知道应该在里头装些什么？我最喜欢的家具？可是我需要带去的东西，几乎没有不能直接装进背包里的，所以我只要求他们把我的自行车运过来。不过，我的自行车花了两周才到达，所以当我抵达东京时，只有我的背包，以及金融市场在等著我。", "在那个阶段（其实到现在还是如此），我在观察市场，看到的不再是一组数字，而是对世界的一系列预测，感觉很像你查看天气预报，并理解它告诉你即将会发生什么一样。利率预测是一张清晰的地图，可以准确显示每个经济体何时、以多快的速度复苏，而且它们每天都在变化。如果利率下降，可能表示前景不乐观，或者可能表示央行之前已经出面宣布不会升息。至于是哪一个？你只要看看股票巿场，可能就会找到答案：若是第一种原因，股巿可能下跌；若是第二种原因，则会上涨。", "真正的交易员不看新闻，他们看市场。去他的《经济学人》，去他的《金融时报》，去他的《华尔街日报》。你唯一需要看的就是市场。它们才会告诉你什么是真的。", "虽然它是错的，但它是真的。那时候，我正在努力研究到底为什么错。在拥有正确预测经济的能力之后的一年半，我搬到东京。我需要更深入的观察它，挑战自己的理论。我需要确认。我需要亲眼看著经济消亡。", "这就是我的计划。尽管我除了半空的背包外一无所有，但我知道，我永远、永远可以进行交易，我知道我一定会赚钱。我想在接下来的一年里，再次看到现实证明我的预测是正确的。我希望上帝揭示祂的真理。", "这就是我想要的。没有别的，只有市场。", "小节 3", "东京不流行穿粉红衬衫，至少我在那里的时候不流行。蓝色衬衫也是。日本人基本上只穿白衬衫。白衬衫文化。整齐的搭配著黑色长裤和黑色修身西装外套的白衬衫，从早上八点、九点的地铁出口倾泻而下，像瀑布一样向上淌流，流入现实世界。在洪水中，男男女女如鲤鱼般逆流而上，撑著雨伞，查看手机，手提整洁的长方形公事包，用白色小手帕擦拭眉头。", "我也是其中的一份子。", "花旗银行已经将一切安排妥当。他们为我在保诚大厦三十楼找到一户内装是奶油白的干净公寓。它是一栋摩天大楼，主业为出售保险，里头其实不该住人的，但它最上面的几层楼却被规划成住宅。我在大楼顶层，从事诸如每晚在高空中睡觉和醒来的冒险活动。我们每天早上都能看到富士山，但我们却呼吸不到东京的高空空气，因为窗户是完全封死的，根本打不开。", "保诚大厦经由赤坂见附站直接和广阔、庞大、高效率的东京地铁系统相接。车站本身位于市中心高档商业区赤坂的核心地带，到处都是传统的寿司店、狭窄的店铺小巷，以及飞涨的租金。", "事实上，大厦真的与地铁直接连接。我可以从卧室外的走廊乘电梯往下进入地铁站，乘坐丸之内线，在八分钟内到达东京车站，换乘另一部电梯直接抵达我的办公室。从我的床上到交易大厅完全不需要出到户外，见到天空。你不觉得很方便吗？或者，如同日本人的口气所说：「真是太便利了呢！」", "东京分公司的交易大厅位于新丸内大楼二十四楼，面积并不小，但是我总感觉它很小。如果你站在门口，将背部直挺挺的靠在门板上，后脑勺抵住门，你就能够同时看到房间的最后面，以及它的右侧和左侧。对我来说，表示它很小。", "事实上，这种「小」的感觉可能不能归咎于实际尺寸，而是由于天花板过低，还有太过安静。因为天花板太矮，导致你从不面向丸之内其他摩天大楼的那两侧窗户看出去，可以看得更远、更广，反而会觉得外头的景色离你特别遥远。不知道为什么，从进办公室的第一天起，我就感觉东京的天空高得异常。", "非常的高，非常的安静，沉重到让我难以承受。当然，光是地上铺设的昂贵地毯，就足以让我明白我不可能听到针掉落在地上的声音，可是我却老是觉得自己可以。", "在交易大厅里不时能见到几件粉红衬衫，这样的画面多少提供一点慰藉，一点熟悉感。这当然不是日本交易员具有时尚冒险精神，而是因为交易大厅里有很多「外人」，也就是外国人。这个日语词汇有时候代表白人，有时候代表美国人。一般情况下并没有贬义，不过少数时候确实带著一丝恶意。", "交易大厅里有三分之一是外国人，外国人中则约有三分之二是美国人；其余的是被公司放弃的欧洲人，像我这样的人。整个交易大厅里我只认识迦勒，还有我在两年前的世界巡回旅行中认识的日本交易员渡边久和金泽乔伊。", "STIRT 的办公区位于交易大厅的最后面，靠近窗户。如果我愿意，我可以走到窗户旁，往外眺望皇居。我没有十字弓，所以不会对天皇构成威胁。称这里为办公区其实有点用词不当，因为包括我在内也不过三个交易员，更别提我们之中真的在进行交易的仅有一人。", "当时，花旗 STIRT 的亚洲业务由东京和雪梨负责。所有单一货币均在雪梨进行交易，唯一例外是在日本进行交易的日圆。换句话说，东京只需要一个交易员，也就是日圆交易员，但是这里却有我们三个人，坐成一排：渡边久、亚瑟．卡波夫斯基，还有被塞在他们两人之间的我。", "从大家有记忆以来，渡边久就一直是日圆交易员。他是个身材矮小、个性胆怯的人。他的英语莫名其妙的带著一九二○年代纽约黑帮的口音，真是令人猜不透的奇怪选择。而且他是一个非常、非常糟糕的交易员。不，我这么说不公平。他根本不算是交易员。他是一个店小二、会计员，一个整天处理文件的家伙。", "当渡边久的工作交接给我后，他应该直接被解雇的。可是，没有。他反而得到侧面晋升。整件事简直不能再更符合字面意义了：他把位子让给我，然后改坐到我右边的椅子上，宣布他是「我的经理」，只管理我一个人的经理。我的班机抵达东京时，渡边久带著他的妻子，抱著哭闹的婴儿来机场接我。我也许应该在那时就意识到这代表什么，可惜我没有。那家伙后来不停的在我进行交易时比手画脚，在接下来的六个月里，像痔疮一样卡在我该死的屁股上。", "我的左边坐的是亚瑟．卡波夫斯基。亚瑟是澳洲人。他的父亲是矿业巨头、名人整形外科医生或报业大亨之类的大人物。我不知道到底是什么，反正是一个有影响力的低调有钱人，看起来好像要把他的儿子培养成澳洲某个相当于美国共和党的那个党的下一代领导人。他有一种世界上最高、最有声望的十五岁少年气质，不过我猜他至少二十五岁。你只要想像杰瑞德．库许纳＊有个更棒的私人教练，将体形练得更加完美，就是他的模样。亚瑟是我所认识中最右翼的人。亚瑟很棒，他超搞笑的。", "亚瑟根本没有被调到东京的理由，除了可能因为鲁伯特．霍布豪斯（是的，就是他，克莱姆区最优秀的狼人）仍然是 STIRT 的亚洲区负责人，而且他喜欢像下棋似的移动人们。他安排亚瑟过来，可能是为了帮助我在东京安顿下来；也可能是鲁伯特想向迦勒炫耀，他以某种方式雇用一个显然注定成为自由世界未来领袖的人，来当他在 STIRT 的下属。亚瑟本人似乎很高兴能被调到东京，他说这使他离他的女朋友更近些；他的女朋友住在纽约。", "所以就是这样，三个 STIRT「东京交易员」──一位交易员、他的经理，还有他的下属。三个没有太多食材可用的该死厨师。", "好像三人做一份工作还不够过分似的，远在五千英里外，在某种程度上也算是「我的老板」的鲁伯特，居然坚持在他和我的办公桌之间安装一个即时影像萤幕。这如此一来我珍贵的萤幕之一现在没有选择的只能永久播放「鲁伯特的日常时刻」，包括诸如「鲁伯特吃面吃得太快」、「鲁伯特打出完美的温莎领带的艺术」，以及「鲁伯特突然关掉静音，对你大喊『欧元区的ＣＰＩ是多少？』就像童年时期反复出现的可怕恶梦，在你长大后莫名其妙的再次困扰你」等高光时刻。", "我们左边坐著外汇部门的其他人员。由于东京外汇团队的规模非常小，小到我们无法拥有单独的办公区，因此我们与两位不怎么讨人厌的中年日本销售员坐在一起。随著我的日语水准逐渐提高，我开始意识到，他们整天无所事事，一进公司总是先讨论午餐要吃什么，然后吃完午餐后，再把时间花在对午餐进行彻底的评论上。他们旁边坐的是两位日本货币交易员，其中包括半个传奇人物、狂热的暴力份子金泽乔伊；在他们的左边，办公区的最末端，则是已被任命为外汇及利率部门负责人的迦勒．祖克曼。身材魁梧、健壮的他像世界上最大的书挡似的，立在办公区的末端，使得可以直接管辖我的老板总数达到三个。毫无疑问，我将会受到很好的照顾。", "小节 4", "日本文化里有一种被称为「おもてなし＊」的概念。不知道为什么，日本人说到这个字时，总是一次一音节的发音，而且在说的时候，必然会做出一个特定的有趣手势。有人告诉我，它代表「日本人的好客精神」。我猜那动作应该和「请喝茶」脱不了关系。", "金泽乔伊向我展示一些日本人的好客精神，但我认为，它应该不是おもてなし。至少，我认为他展示的，应该是另一种不同的好客。", "金泽乔伊身材矮小，眼神锐利，行动敏捷。他是「现货交易员」，表示他就是个单纯的货币交易员。他们负责的是最简单、最不复杂的交易，这群人以粗鲁和愚蠢而闻名。所有的交易员都称外汇交易员为猴子，外汇交易员则称现货交易员为猴子，所以他们是猴子中的猴子。但金泽乔伊并不符合这个典型。他很酷。很圆滑。很安静。", "在我进入交易大厅的第一天，乔伊几乎没对我说一句话，或者应该说，他没对任何人说一句话。然后，在这天结束，正好六点三十分时，他以一种简洁、流畅、精确的动作站起来，将椅子推进去，向右走了三步，用日语喊了一句什么。", "我周围的三个日本男人──渡边久和两位午餐鉴赏家──以响亮的声量回复一句军国主义式的口号，将结尾的嘶声拖得极长。他们俐落的站起来，把自己的椅子推进去。", "四个人的动作如芭蕾舞般同时流畅的进行。我既震惊又钦佩，转身面对乔伊，直直盯著他的脸。", "乔伊向我伸出右臂，完全笔直，手掌向上，拇指、食指和中指伸出，很明显在模仿枪的指向。他与我对视一下，眼睛闪烁熊熊烈火般的光芒，倏的将模仿枪的右手举向空中。", "他的手势清晰且果断，突破我们之间的语言障碍。我抓起放在桌子下的小背包，跟在他身后走入夜色。", "九月底的东京，六点半时已经暗下，你可以看到空气中最后一丝蓝色正在消散。", "天色变黑，街道上满是霓虹灯，宛如千万颗星星落到地面。", "如果我当时就有现在的认识，我可以看得出来我们正在走的宽阔大街，位在丸之内以东的银座。毕竟它是整个东京最宏伟、最著名的购物区域之一；事实上，在全世界也排得上名次。", "但当时的我并没有现在的认识，我只看到一条宏伟又宽阔的街道，人行道上点缀完美的树木，两侧全是高楼大厦。悬挂的霓虹灯招牌数不胜数，写著我看不懂的文字，像瀑布一样从建筑物的侧面流洒下来。四个日本男子分成两列行走，全穿著白衬衫和黑西装。我则走在他们身后，环顾四周，仰头张望，穿著破烂的白色运动鞋，身上裹的依旧是 Topman 平价连锁店买来的薄薄黑色紧身双排钮扣厚呢短大衣。", "走入东京第一个温热的夜晚，我跟在四个白衬衫男人身后，期待什么呢？也许我期待的是一些おもてなし，日本人的好客精神。这不是每个愚蠢的白人小男孩在收拾一切搬到日本时都会期待的吗？受到一个全新的、不同的地方欢迎，被它温暖的空气拥抱。", "右转进入一条窄到不该存在的小巷子，宽度只够两人勉强并肩行走。四个男人在大红柜台前齐声吸著面条，男孩的面条却掉到地板上。我问渡边久，「黑胡椒」的日文怎么说，他说念做「burakku peppaa」。走了一小段路，来到第二条小巷，五名男子挤进一部电梯。没有人想到应该告诉我要去哪里。事情从那时起，便开始一路往下。", "关于陪酒卡拉ＯＫ、泡泡浴和女公关酒店，我能够告诉你们什么呢？可能远超过我们任何人想知道的。里头全是女人，非常多的女人。我有没有清楚的告诉过你们，在去之前，没有任何人警告过我？", "有年长的女人，也有年轻的女人；事实上，应该说是女孩更为贴切。其中有一些和巫师差不多年龄的女孩。有装饰豪华的大房间，也有较小的私人包厢。分配，这么多人要分配，总有一个会被分配给我。", "点燃香烟，倒出鸡尾酒，在背后讲笑话──抱歉，我不会说日语，我只会一边咯咯笑，一边抚摸我的大腿。", "在这种情况下，你们会怎么做？我也许应该回家，但我没有。为什么我没有？", "我继续留下，试著慢慢啜饮，可是杯子一放下立刻就被倒满，我很难衡量自己到底喝了多少。午餐鉴赏家们将领带绑在头上。我听到身边的女人带著浓浓日本腔的英文，努力的在告诉我：「我的朋友。我的朋友。她是．成人．小电影．明星。」", "带著醉意看出去的影像很模糊。我们跌跌撞撞的挤上计程车，没多久就到下一个地方。渡边久唱著绿洲合唱团的《迷墙》（Wonderwall），金泽乔伊则像一只不受控的动物从座位上跳起来，一把撕开同事的衬衫领口。坐在我旁边的女孩刻意将她的肩膀压在我的肩膀上。她看起来二十岁上下，非常漂亮。抱歉，我不会说日语。", "我试著离她远一点，她紧张的看著门上的小舷窗，所以我也看了看，有一双男人的眼睛在看著我们，几分钟后门被打开，我的女孩起身离开，另一个女孩被送进来给我。", "「听著！妳看起来真的非常非常可爱，我真的很抱歉我不会说日语，但是，我只是想告诉妳，我很好，我不需要任何人，所以……嗯，我真的不知道这边的规矩是怎样，但是，嗯，妳可以做妳想做的事，或者如果妳愿意，妳也可以现在就回家。」", "但是她听不见，音乐声音太大，午餐鉴赏家们正对著麦克风尖声高唱某种日本传统民谣，于是我凑近她，对著她的耳朵，再将同样的话说一遍，然后我看著她，她微笑，把手放在我的肩膀上，微微偏著头。他们第四次帮我又换了另一个女孩。", "在那个不断重复的回圈里，我的灵魂更进一步走向死亡，如果说我的灵魂还有任何剩下的话。最终来了一个会讲一点点英语的女孩子。光是这一点，她绝对应该排在更前面的位置。", "「拜托，拜托，拜托，不要让他们把妳换下去。」", "「拜托，拜托，拜托。是……你应该……更……开心一点。」", "那时，我突然想到，我似乎从来没有尝试过这个建议。我在想，会不会已经太晚了。", "小节 5", "「所以，你是怎么赚到这么多钱的？」", "亚瑟和我之前共事过的其他交易员不同，他会提出这个问题就足以证明这一点。直到他问出口的那一天，将近两年的时间，我一直是花旗最赚钱的交易员之一，可是从来没人问过我这个问题。一次都没有。", "「很简单。我只是赌利率会永远维持在零。」", "「哈！」", "亚瑟以夸张的态度放声大笑。发出颇具澳洲私立学校特色的笑声，尖锐且刺耳。", "「利率不可能永远维持在零。」", "亚瑟问很多愚蠢的问题，也发表很多大胆的言论。我还满喜欢的。他之所以这么做，是因为他从来没有学过经济学。他在大学主修音乐，是一位钢琴演奏家之类的。在当今社会里，钢琴演奏家能找到的最好工作是花旗银行的交易员。它的报酬可谓相当丰厚。", "现在的经济学是一门学生永远无法真正理解的科目，因为教导他们的人，也就是以前的经济系学生，同样从未真正彻底弄明白。如果一个学生足够聪明意识到自己的理解不足，并且足够勇敢，可能会在难得的清醒时刻向教授坦白此事，短暂引发教授的心理折磨，因为教授多年来一直试图压抑自己对所教的科目并不真正了解的愧疚感，同时还会提醒他，他的父亲从未为子女感到骄傲的痛苦事实。为了将这些出逃的情绪重新关回安全的压抑地牢，教授要么羞辱和他对话的人，要么迫使对方屈服（这是智力上缺乏安全感的人面对问题时的一贯做法）。透过这个过程，经济学家学到永远不要问愚蠢问题的教训。但当然，毫不意外的，这些问题其实才是最重要、最该被问出口的。", "亚瑟不明白这一点，而且他的钢琴弹得非常好。多么幸运。真是个运气极佳的小男孩。", "「利率当然可以永远保持在零。有什么理由不行？」", "「嗯……」说到这里，亚瑟沉思好一会儿。我喜欢这孩子，你可以看得出来他的脑袋正在转动。", "「嗯，因为它只是暂时性的。主要是公债危机导致的，等这一波低潮过去了，经济就会复苏。然后利率自然会跟著回升。」", "「聪明的孩子，这段话你又是从哪里读来的？经济只会一蹶不振。」", "「哈！」", "这孩子不认同别人时，很爱捧腹大笑，而且笑得特别大声。事实上，他的所有行为都很大声。东京交易大厅比我去过的任何交易大厅都安静一百万倍，当亚瑟说话时，每个人都能听到他的声音。不过亚瑟并不在意。他为什么要花那种力气去关心别人？他可是自由世界的下一代领导人。", "「你说经济会一蹶不振是什么意思？」", "「你他妈的认为我是什么意思？它永远不会变好。这不是暂时性的，而是永久性的。从这里一路往下。一年差过一年。」", "「什么会一路往下？利率？股票市场？」", "「去他的股票市场，拜托你，亚瑟，你应该没有那么蠢吧？过去五年，你他妈的都在睡觉吗？烂经济对股市来说是大大的好事。股市都涨到月球了。」", "我提出一个很好的观点，让真相变得愈来愈显而易见。亚瑟停下来仔细思考。", "「可是，经济为什么会变这么糟呢？没人这样说过。到底他妈的为什么？」", "「去你的亚瑟。如果你只相信别人相信的事情，你这辈子永远都赚不到钱。你无法顺应市场来打败市场。只有在别人犯错时，你才能够赚得到钱。」", "亚瑟看起来真的很困惑，我在想，他是不是应该坐在某个音乐厅里，而不该和我坐在一起。", "「好吧！我们继续往下说。我他妈的告诉你，是因为贫富不均。这是唯一的重要因素。以此概念进行交易，你就能成为百万富翁。」", "亚瑟再一次大笑起来，但这是最后一次，因为他很快就意识到我是认真的。", "「贫富不均!?」", "「是的，亚瑟，是的，贫富不均。富人得到资产，穷人得到债务，穷人只是为了有房子住，就必须每年将所有工资都缴给富人。富人用这些钱从中产阶级手上买下剩余资产，然后问题一年比一年严重。中产阶级消失了，消费能力也从经济世界里永远消失，富人变得他妈的更富；穷人，嗯，我猜他们只有死路一条。」", "我的话悬浮在空中好一会儿，我可以看到亚瑟的大脑里齿轮在缓缓转动。", "「那么……利率会怎么样？」", "「利率保持在零。」", "「嗯……那么你觉得我们应该买点绿色欧洲美元期货吗？」", "该死的亚瑟，居然真的比他看起来还要聪明。", "我们的谈话引起鲁伯特的注意，他一如既往的可以在即时影像萤幕上看到我俩。他取消静音，喊出我的名字。很不幸，他似乎很喜欢这个新养成的习惯。", "「盖瑞！很高兴看到你和亚瑟相处融洽！你们在聊什么？」", "在那个阶段，我发现自己不在脸上透露出对鲁伯特的蔑视变得愈来愈难。不过，我相信鲁伯特从来没注意到，他可能以为每个人的脸都是长那样的。我的眼睛和嘴唇奇怪的抽搐，所以我没有回答，于是亚瑟填补空白，大喊：", "「经济学！」", "「啊……经济学！我喜欢经济学！我知道盖瑞会成为一位伟大的经济学家。这就是我雇用他来银行工作的原因！告诉我盖瑞……你认为花旗银行里最好的经济学家是谁？」", "到那时为止，共有七个人声称是他决定雇用我到花旗银行工作的。鲁伯特是其中之一，但我认为他似乎比其他人都更有说服力，毕竟他确实带我去了拉斯维加斯。我设法让自己的眼睛不再抽搐，然后奋力吐出：「比尔。」", "鲁伯特很震惊。", "「比尔不是经济学家！」他以为我在开玩笑。", "「好。如果不是比尔，那就是我了。」", "鲁伯特和亚瑟都喜欢这个答案，他们兴高采烈的一起嘲笑我。鲁伯特出现的萤幕上有一小角是我们这边的摄影机镜头，我可以看到亚瑟美丽的珍珠贝齿微笑。鲁伯特搬到澳洲后也去做牙齿美白。非常完美，就像钢琴键一样。", "突然间，小萤幕镜头里迦勒的脸出现在我身后，我感受到他的手放在我肩上的那股沉重压力。", "「鲁伯特！最近好吗？你们在谈什么事这么高兴？」", "「迦勒！你好吗？我刚刚在和盖瑞聊天，他说他是银行里最好的经济学家！」", "迦勒和其他人一样觉得这句话很有趣，他们都笑得合不拢嘴。", "「嗯，确实如此，他是一位优秀的经济学家。我一直都知道他很有潜力，从一开始我们在交易游戏比赛里认识，我就知道。这就是我雇用他来银行工作的原因。」然后，迦勒停下来，重新调整自己的姿势，以便让他看起来更有说服力。", "「你知道的，我永远记得盖瑞领第一笔分红奖金那天。我知道我给他的，对他来说是一大笔钱，但我希望他能感受到我们对他的欣赏。我永远不会忘记，当他看到我们给他五万英镑时的表情。」", "三个人脸上都带著温暖的微笑，他们都看著我，但我只是直视萤幕。不是五万英镑，而是一万三千英镑，我在想为什么迦勒会如此厚颜无耻的对一个明知这句话是谎言的人撒谎。三张灿烂的笑容，每一张都如此完美。我没有笑，对比之下，我简直像一只猥琐的老鼠。", "大约在那个时候，全球利率为我崩溃最后一次，让我大赚一笔，为我赢得亚瑟永远的忠诚。这大概是发生在我身上最糟糕的一件事。", "你明白吗？一旦预测利率降至零，其他人就不会继续错下去。每个人变成都是对的。终于，在我开始下赌注将近两年之后，第一次每个人都同意我的观点：经济永远疲软，永远没有恢复的可能。没有什么比你自己是正确的、并且每个人都同意你的观点更糟糕。如此一来，再也没办法赚到任何钱。", "就在几个月前，我还是全世界交易金额最大的交易员之一。我每天都在瞬息万变的市场进行数千亿美元的交易。现在一切都结束了。我只是一个日圆交易员，为一家美国银行工作，而非日本银行。日本的利率根本没动过，市场死气沉沉。况且即使我报价，渡边久也会否定它们，而我无法反击。", "所以就这样。没有可以一起玩交易游戏的客户。没有可以赌它即将死亡的经济。只有我、亚瑟、渡边久，以及两个总在谈论午餐的男人。", "没有交易。这是很长一段时间以来，我第一次没有可以进行的交易。我低头看著我的双手、滑鼠和键盘，意识到它们变得多么空虚。", "我环顾四周。渡边久正拿筷子从一个厚纸碗里吸食面条，听起来很恶心。我并不想太讨厌他，因为我知道他为什么要监视我，并否决我所有的交易。我被调到这里，对他来说并不是一件好事，我取代他，做他的工作；即使我没在工作，赚的钱还是比他赚的更多。他的太太为了他的那份交易员薪水才嫁给他，他无论如何一定要留住这笔收入。天知道他并不是第一个遇到这种困境的交易员。去他的，但也祝他好运。", "我往左边看去。亚瑟．卡波夫斯基，这孩子正因我们赌世界末日即将到来而赚到的钱，感到异常开心。我不禁回想，我之前赚钱有没有像他那么高兴过。上帝知道，那些受苦的人全是像我父母那样的老百姓，而不是像他父母那样的有钱人。", "我看向萤幕墙的左上角。鲁伯特．霍布豪斯。巧合的是，这家伙也正在从厚纸碗里吃面，我他妈的心怀感谢，至少他的萤幕现在是静音。有生以来，我第一次意识到我恨他。我恨他，还是鄙视他？他妈的，我不知道，他妈的又有什么区别？我在想他是否知道我恨他，我在想我为什么恨他。天知道这家伙在我的职业生涯刚开始时帮了大忙。可是他为我做的愈多，我就愈恨他。反正就是这样，我想。", "我将视线再往亚瑟的左边移动，看向午餐鉴赏家。他们谈论午餐吃的炸虾盖饭，认为它十分美味。我知道他们是对的，因为他们也买了一份给我。不，这不是他们的错，没有人可以恨他们。", "越过他们，我看向金泽乔伊。他的眼睛紧盯萤幕，显得很紧张。我不能怪金泽乔伊，他已经尽最大的努力想让我融入这里。", "最后，坐在最末端的迦勒．祖克曼，我所认识的第一个交易员。他怎么会认为我能融入这里？没有市场，没有客户，没有真正的交易员，没有战斗，没有可以取得的胜利。我的脑海里第一次闪过一个想法：也许他不是我见过的第一个交易员，也许他根本就没有当过交易员。", "我将视线转回萤幕，却发现自己已经将手机从口袋里掏出来，并且在快速浏览。但我找不到一个人可以说话：之前的家人、之前的朋友、之前的女友，每一个已经被我推开的人。虽然我可以随时发简讯给巫师，她向来是能够理解我的。", "我却没有传简讯给她。我把手机收起来，继续等待。如果等得够久，另一笔交易总会到来。也许，从那时起，我的精神状态就不正常。", "我想有人可能已经注意到我不太对劲，因为高阶管理层决定分派一个名叫田村孝介的年轻日本孩子，来当我的初级交易员。于是这个工作量只需一人的团队人数增加至四个，像一套该死的俄罗斯娃娃。孝介当然无事可做，所以孝介每天用一整天的时间创建一个庞大的交易试算表，分析 STIRT 中的所有市场。", "有天下午，我看到孝介全选整个试算表，又删除全部内容，然后从头来过。第二天，我找到一个渡边久不在场的时机，把孝介拉到一边，非常轻声的问他：「嘿，听著，你昨天是将整个试算表删除了吗？」", "孝介没有片刻的犹豫，表情如复活节岛雕像似严肃的点点头。我很困惑。", "「你搞什么？他妈的，……到底为什么？」", "孝介向左转头，向右转头，然后深深的盯著我的眼睛。", "「不要完成工作，永远不要完成工作。一旦你完成工作，你就会有更多的工作要做。」", "对我来说，这是一个真正的问题。因为我已经有一年多没有做过任何工作。即使是在伦敦的最后九个月，我也几乎没有进行过什么交易，因为蒂兹为我做了大部分工作。现在，甚至没有任何交易可做。", "并不是我懒惰。不知道为什么，我失去能力，我失去工作的能力。我失去在乎任何事的能力。看在老天的份上，我甚至无法出门去买他妈的沙发。如果不是因为超过三个小时不吃饭，我的心脏就会灼痛得不得了，我可能会连进食都停止。现在，连强迫自己每天洗一次澡，都成为极为严峻的挑战。", "不过我还是赚到钱。我一直很能赚钱的。很简单。你所要做的就是赌灾难会发生。经济死亡。世界末日。它是连结我和人类世界的最后一条丝线，可是突然间，我连这条线都断了。", "我通常在早上八点进公司。每个人都是早上八点到，尽管根本没有他妈的事情要做。市场上的所有活动都发生在伦敦和纽约的交易时间，也就是东京的下午和晚上。整个世界除了海里的鱼，没有人在他妈的东京早上八点是醒著的。尽管如此，我们还是必须准时上班。", "还是有一些超级小的交易要做。日圆换汇交易业务很少。本来可以在二十分钟内完成的事，我会故意慢吞吞的进行，拖到上午十点才做完。在那之后，还能做什么呢？什么都没有。我会和亚瑟和孝介一起谈论经济，和午餐鉴赏家们练习我的日语。事实上，他们看起来都和我一样忙碌，只不过在假装工作这一方面，他们真的很专业。", "和他们相比，我差太多了。所以在早上十点之后，我就开始睡觉。我会直接把脚放在桌上打盹。我也会把脚放在地上打盹。等到胸口的灼痛感唤醒我时，我会跑出去买面。我会从系统拉出伦敦小组的 PnL，看看蒂兹在接替我原来的工作后表现如何。我拿著搜集来的三百枚一日圆硬币的小袋子，到交易楼层的自助餐厅，随意购买一些日本零食和绿茶。没事可做。他妈的没有任何事情可以做。", "渡边久很讨厌我的所作所为。渡边久很讨厌我做的每一件事。", "日本文化中有一个奇怪的现象，他们不会告诉你他们看你不顺眼，至少绝对不会直接告诉你。相反的，他们常做的反应，是表现出一副自己很痛苦的样子。", "我来举个例子。如果你正在学习初级日语，在教科书中，第一课的单字表里必然有「いいえ」，也就是「不」。严格来说，根据字典，拒绝时就该使用这个单字，但是在现实生活里，从来没有人真正使用它。为什么？因为在日本，没有人会真的对你说「不」！人们只会发出一种颤抖的鼻音，在国际上这种声音被公认为「拒绝」，但是只有和朋友、熟人在一起时，才能使用。对于那些关系和你并不亲近的人，你再怎么样都不会说「不」。", "那么，如果有人约你星期六出去玩，可是你那天已经安排好要和性感女郎约会的话，你该怎么做？你会说「不」吗？当然不是。你要做的就是把头偏向一边，挤眉弄眼，然后像牙痛一样，从齿缝中狂吸气。对方看到你突然表现出的疼痛，就明白他的提议行不通，便会自行撒回邀约。", "渡边久开始不断的这么做。问题是，他的暗示我一点都不看懂。我一把脚放上桌面，渡边久就会发出像我踩到他的脚似的嘶嘶声。我转过身来，困惑的看著他，然后继续试著打瞌睡。渡边久接下来会扭曲身体，发出缓慢且嘶哑的呼吸声，好像他是什么日本的殉道圣人，有人正在拔除他背上的箭似的。我会张开一只眼睛，关切的看著他。渡边久始终无法顺利传达自己的不满，于是他一次又一次的加强力度，甚至到了令人怀疑他是否正在经历器官衰竭的程度。这个过程慢慢把我逼疯。我开始经常离开办公桌到厕所刷牙，可惜一个人能刷牙的次数毕竟还是有限的。", "没有其他事情可做，最后我尝试做其他人都在做的事，也许是每一扇摩天大楼窗户后的人今天仍在做的事。我坐下来，假装我忙著工作。", "这对我来说并不是件好事。胸口的灼痛感日趋严重。我本来就没剩多少的体重再度下降。为了拿到更多的ＰＰＩ药丸，我不得不去看私人医生。", "我试著在家烹饪来转移注意力。在伦敦时我常自己煮饭，但在日本我总是买错食材──当我想买牛肉时，会买到猪肉；当我想买猪肉时，会到买牛肉。去他的，为什么日本牛肉看起来会那么像猪肉？", "做饭总以失败收场，我每天晚上就像饿鬼一样，在赤坂的小巷里徘徊，寻找食物。赤坂是个高级区，有很多餐馆，但没有一家会说英语，也没有一家有英文菜单。我最后总是飘进一家寿司店，耸耸肩，他们很无奈，但还是会让我坐下来，给我食物。价格很贵，而且份量永远不足以让我吃饱。我只得在飘回家的路上，停在麦当劳买一个大麦克。", "我老是在办公室打瞌睡，后来也影响我在家的睡眠。我会在凌晨两、三点全身冒冷汗醒来。当这种情况发生时，我就穿上运动鞋，跑到皇居外苑，然后一路绕著皇宫跑。跑一圈大约是五公里。之后，我可以睡上一小时左右。我住的大楼顶楼有健身房，如果它还在开放时间，我会去跑步机上跑个五公里。我成功的将跑五公里的时间缩短到十八分钟。有一天早上，我试著少于十八分钟，但我不得不停下来，回到房间呕吐。我的牙龈开始流血，只好去看医生，他告诉我不要再那么用力刷牙。", "人们开始担心我。我现在只剩五十五公斤。迦勒很担心，管理阶层也很担心。我不确定他们是否注意到我瘦得像具骷髅，但我缺乏职业道德的行为，却让所有人尴尬不已。迦勒之前向老板们保证，我是那种能在午休时间运送一百个汉堡的孩子。结果被他送来东京的这个，大多数时间不是在打瞌睡，就是在刷牙。", "迦勒邀请我去他位于东京代代木区的家。那个区域很靠近市内最大的神社──明治神宫，以及最大的公园──代代木公园。我见到美丽的妻子和可爱的孩子，和迦勒一起分享自动调温器放错地方的痛苦经验。", "他们很可爱，我们一起吃晚餐，一起喝酒。", "可是少了一些什么……有什么重要的东西不见了。我日渐消瘦，却没有人注意到，没有人看得出来我的灵魂逐渐溃散。", "那天晚上我试著想抓住一些什么，一些我可以在迦勒身上找到的、一些重要的东西。我伸出手，试著在他身上寻找任何可以留住我的东西──比如人性，比如能让我产生情绪的感觉。", "可是那里什么都没有。他的灵魂也早就不在。", "小节 6", "为了让我振作起来，他们又尝试了两、三次。其中，弗洛伦特．勒博夫主导的活动最值得一提。弗洛伦特．勒博夫和我同时期在伦敦政经学院就读，他表现出一副我们是老朋友的样子，虽然事实上我之前从未见过他。", "弗洛伦特又矮又胖，老是站不直，就像一只不修边幅的泰迪熊。他搬到日本的目的是想和大量女人发生性关系，愈多愈好（对于东京的「外人」来说，这种野心并不罕见），但却深受自己的偏执妄想困扰，他认为日本妓女想窃取他的精子。我非常喜欢他用来平衡梦想和恐惧的诗意。", "对于需要做什么来提振我的精神，弗洛伦特显然很有把握。他召集一群年轻的「外人」交易员，带我去了六本木。", "六本木位于赤坂以南，是东京几个夜生活的重要据点之一。一条宽阔的高架公路横夸六本木上方，高架桥下就是出售女人和烤肉串的地方。一座巨大的、亮橙色的铁塔高耸入云，站在道路的尽头，俯瞰一切。", "六本木因「外人」而闻名，也就是东京外国人的聚集地。当我住在东京时，或者说，即使是现在，大多数日本人都不太习惯说英语，而且事实上，许多日本人对外国人敬而远之。但东京有三千八百万人口，即使只有百分之一的百分之一是对外国人有特殊癖好的年轻女性，也还有三千八百个女人。这些女人几乎全集中在六本木。", "我们去的第一家是个小酒吧。这家酒吧的装潢很奇怪，看起来宛如火车车厢内部。顾客都是典型混迹六本木的人：看似外国银行家的人（当然，我就是其中之一），以及长相很有攻击性的日本女性。我们在去那家店的路上，每个人都喝一罐从便利商店买来的酒（这种葡萄柚气泡酒无处不在，名字取得颇为恰当，就叫 Strong）。弗洛伦特在酒吧点了我们的第二轮。在等酒的同时，弗洛伦特传授我他的泡妞秘诀。", "「你看到那边两个女孩了吗？你可以拿下她们。嗯，其中一个，任何一个。你喜欢哪一个？由你决定。总而言之，你走过去。和她们打招呼。你微笑，略微鞠躬，进行眼神交流。自我介绍，告诉她们你的名字。询问她们是否可以买酒请她们，帮她们买饮料。选中其中一个，和她多说一点话，触碰她的手臂，请她和你一起移动到那边那个角落。然后带她回家。宾果！」", "我并没有请他为我上这堂课，但他在讲解时呈现出的点描风格＊，让我相当欣赏。离开酒吧后，我们去一家名为「气体恐慌」的夜店。其中一位交易员仿佛故意要戳破弗洛伦特精心设计的策略，他走到一个从未见过的女孩面前，一句话都没说，就直接开始和她亲热。", "我的胃开始觉得不舒服，也许它反映在我的脸上。弗洛伦特伸出沉重的手臂搂住我。", "「别担心，伙计，你不需要那么做。来吧！兄弟，我们去脱衣舞俱乐部吧！」", "★★★★★", "「你认为我们应该做点什么吗？」", "既然孝介已经被任命为我的初级交易员，上级决定将亚瑟调回雪梨，拉大他与女友的距离，真是令人伤心。这是他在东京上班的倒数第二天，他正拿著一个透明塑胶盒，吃里头的寿司。", "「关于什么？」他满嘴食物，大声问我。", "「我不知道……你知道的……关于经济。」", "「我们不是已经做好安排了吗？我们买了绿色欧洲美元期货。」", "「是『你』买了绿色欧洲美元期货，我本来就持有。以现在的价钱来看，再买更多没有什么意义。而且，我在说的不是这个。」", "「那么你在说的到底是什么？」他用筷子将最后的米饭堆在一起。", "「你知道的，我说的是经济！你觉得我们应该对经济做点什么吗？」", "亚瑟已经吃完寿司，顺手将筷子折成两半，扔进塑胶垃圾桶里，将盖子关上。", "「我听不懂你在说什么。」我左边的太阳穴开始出现刺痛感。", "「亚瑟。我在说经济。我们是不是应该做点什么？关于经济。你他妈的到底是哪里听不懂？」", "亚瑟想了好久，然后将椅子移到离我更近的地方，仿佛我们正要做毒品交易似的靠过来。", "「所以……我们现在讨论的不是绿色欧洲美元期货……我说的对吗？」", "「看在他妈的份上，亚瑟，这和他妈的绿色欧洲美元期货没关系！经济将永远他妈的一团糟！你认为我们应该为此做点什么吗？」", "亚瑟将椅子退开一公尺，瞇著眼睛仔细打量我。有那么一瞬，他试著挤出微笑。他的笑容是犹豫的，带著一点沉思。亚瑟将双臂靠在桌上。", "「你是他妈的认真的，是不是？」", "「是的，亚瑟，我是他妈的认真的，你认为我们他妈的应该为他妈的经济做点什么吗!?去他的……」", "亚瑟停顿一下，以便吸气，发出音量更大的笑声。", "「你要做什么，老兄？你他妈的要当下一任首相吗？你想拯救整个他妈的世界吗？」", "「嗯，我他妈的不知道，你他妈的认为我们应该做什么？只是坐在这里，什么都不做？」", "「啊啊啊老兄。一切都很好，老兄。我们并没有什么都不做，我们买了绿色欧洲美元期货！我们赚很多钱。你不用担心，老兄，你做得很完美。你已经把这一切都搞清楚了！」", "「是，但是……」是，但是，突然间，我脑子一片空白。我原先提出的问题丢下我，自行离开。我知道他是对的。「我不知道……我只是……我不知道，伙计。只是……？总觉得这样不对。」", "「你只是在钻牛角尖，老兄。你他妈的在说什么啊？他妈的还有什么是你能做的呢？」", "「我不知道。或许，我可以回去，回去大学……？试著让那里的人知道他们错了。」", "我想起大学生涯，想起被锁在柜子里布满灰尘的关键词索引，在没有窗户的小房间里推算可逆矩阵，以及我居然想利用它们改变世界？然后，轮到我发出笑声。", "之后，亚瑟就回家了。我很确定他现在还是一名交易员，尚未成为自由世界的领导人。不过，我相信，在他赚到一千万或一千五百万英镑之后，他还是会成为我们的领袖。", "小节 7", "亚瑟离开，然后冬天到来。天气很冷，树木光秃秃的，东京的冬天和伦敦的冬天不一样，天空是蓝的，整天都有阳光。", "亚瑟走后，我就只剩孝介。孝介看起来是个不错的男孩：认真、诚实、努力工作。他拥有日本青少年动漫主角那种平凡但顽强的意志力。无论他完成那个试算表多少次，我确信他永远不会放弃。", "我想认识这个人。他看起来不像个疯子，这在当时的圈子里相当少见。问题是他不太会说英语，但随著我的日语愈来愈好，我们能够聊的也愈来愈多。有一天，他告诉我，他每天都背五个新的英语单字，并且已经这么做了十五年。我对此感到震惊，因为他的英语看起来实在不太好。我请他给我看看他当天要背的单字，他的单字清单上的第一个字是「notwithstanding」＊。我这才意识到他的英语实际上相当好，只不过全被他的日本发音拖累。", "一旦解决这个问题，我们的沟通能力便开始迅速升级。我渐渐适应他断断续续的片假名式英语，我自己也开始在说话时使用片假名式的发音。这不仅让我俩的交流产生重大的突破，也使我与整个日本的沟通产生实质性的提升。", "日本人会告诉你，他们听不懂英语，但如果你用片假名式的发音，他们多半听得懂。片假名是一种日语拼音字母，日本人生活中的外来语都是用片假名。片假名式的发音可以使英文单字听起来就像日文一样──不要念「black pepper」，而要念「bu-rak-ku-pep-paa」。不要念「table」（桌子），要念「te-e-bu-ru」。如果你向饭店柜台要一个「iron」（熨斗），他们只会困惑的看著你；可是如果你向他们要「a-i-ro-n」，熨斗马上就会被送到你的房门口。", "能够和孝介顺畅交谈，真是让我松了一大口气。除非你也有好长一段时间都没和正常人交流过，否则你不会意识到，和那些不疯狂的人交谈有多么必要。我邀请孝介一起吃晚餐。", "孝介在东京的东区出生长大。那一带是老城区，人们称之为「下町」，他带我去那里吃御好烧。御好烧是一种日本风味的煎饼，我猜主要食材是高丽菜。它的尺寸很大，很好吃，而且相当便宜。在伦敦，同样的东西要卖二十五英镑。", "我们离开街道，爬一段又小又窄的木楼梯。推开一扇滑动木门，听到银铃叮当作响，店员响亮的呼喊「いらっしゃい！」表示欢迎。我可以看到他们在布帘后面弯腰鞠躬。", "室内全是木头装潢，温暖的照明灯光，每一面墙都贴满日本老电影的海报，看起来像是，嗯，我不知道，一九五○年代的装潢？顾客们靠著矮桌坐下，巨大的煎饼在桌面的铁板上冒著热气。", "孝介在办公室里向来表现得很安静自持。可是当我们在餐厅坐下时，他却无缘无故的发出一声刺耳的尖叫，吓我一大跳。一位女服务生像一只猫似的悄然无声的出现。「とりあえず ビール」嗯，这句话意思我知道，总之先来杯啤酒。", "我有很多事想说。我向孝介解释，我在家乡有个女朋友，她会来日本，但还要过一段时间才会来。我很确定我没有向任何人隐瞒这个事实，但东京办公室里不知道为什么似乎人人都想将奇怪的女人推给我。孝介开心的喝著啤酒，不时若有所思的哼两声，表示他在听。", "我告诉他，我无法忍受渡边久不停的扭动身体、挤眉弄眼和持续监视。康介对这一点深表同感。任何人都看得出来，渡边久是「一个心胸狭窄的人」。", "我进一步告诉他，我曾经一度将迦勒视为导师兼偶像，我一直希望能重建我们的关系，可是他的心并不在这里。", "我猜我的话可能在翻译中遗漏什么，但无论如何，孝介表达他的同情。他的同情如此真诚、深刻，让我觉得也许我应该振作起来。", "我要求他来陪我吃这顿饭，原因是我需要告诉一个人，任何人都好，我想辞职。这一次，我真的要离开。我会等到一月份的分红奖金日，然后，在奖金存进银行时，我要去找迦勒，告诉他我已经受够了，我要走了。我要去慈善机构工作，如此一来，我就能保留我所有的递延股票。迦勒自己过去也做过同样的事，因此，他一定会允许我这么做的。", "你通常很难看出日本人在想什么，他们不会在脸上表达出自己的情绪。可是当孝介看我，挣扎著找不到合适的话回应我时，我可以看得出来他很为我担心。", "那时，我的自行车已经抵达日本。它被从伦敦一路空运过来。我经常整个周末都在骑车。", "我会往南骑至比艾菲尔铁塔还高九公尺的亮橘色东京铁塔。它就在我的医生诊所旁边，一楼有一家全家便利商店。你可以到那里买盒牛奶，休息一下。它的下方有一座公园，里头还有座名为增上寺的古庙。我曾好几次听见和尚在庙里念经。到了晚上，东京铁塔会点灯，在橙色灯光的映照下，增上寺的屋瓦散发著乌黑的幽光。", "我会往西骑去明治神宫的巨大鸟居，或熙熙攘攘的竹下通。如果是周日，我也可能会骑去代代木公园入口处的开阔广场，观看留著猫王发型的中年男子聚集在老式大型手提式喇叭周围，使出浑身解数，互别苗头的跳舞。", "我会往东骑去人工填入大海所造出的汐留，看看那里废弃的摩天大楼，再往前到筑地市场，看堆放在桶子里、脸颊已经被刮掉的巨大鲔鱼头。然后到滨离宫恩赐庭园的小茶馆，只要五百日圆，一个日本老太太就会为你奉上漂亮的小糖果和绿茶。", "我会往北骑去上野公园，看看池塘里可喂食的乌龟和鲤鱼；或者去浅草寺，欣赏冒烟的巨大香炉，以及经过香炉时，看到在摇晃算命小木箱的灰色、干瘪、驼背的男人和女人。", "有时，我会一路骑到台场。它是位于东京湾的一座巨大假岛。因为不能骑自行车过桥，所以得花很长的时间绕路。那里有一片禁止游泳的假海滩，还有一个假的自由女神像，我会坐在假海滩旁边的一根小木杆上，看著太阳越过城巿，从海平面落下，然后我会等待彩虹桥上的灯亮起。", "十二月底，我飞回伦敦过耶诞节。我在斯特拉特福的韦斯特菲尔德购物中心的一家旅馆住两周。那真是全世界最糟糕的地方。巫师来了，她拥抱我，当她这么做时，我的两条腿不禁开始颤抖。", "小节 8", "终于进入二○一三年。算总帐的时间到了。我知道决战日即将来临。", "关于分红奖金日，我唯一记得的是青蛙出现在大萤幕上，将它发给我，迦勒也和我待在同一个办公室。分红数目以日圆为单位，所以看起来非常非常大。我完全不记得那数字是多少，但我当然记得我的 PnL。在停止交易之前我已经赚了一千八百万美元，所以我应该得到多少？一千八百万乘以百分之七，一百二十六万美元……之类的。", "那天是一月下旬，一旦收到金额通知，剩下的便是倒数计时，等著钱存入银行，通常会是二月初的某一天。我每天登入帐户查看余额。钱是在星期四进去的，所以隔天是星期五，我应该在那天去找迦勒谈一谈──但我没有。能说什么呢？我猜，我是个胆小鬼。", "我度过一个很艰难的周末，无时无刻不觉得战战兢兢，仿佛有什么东西在我的皮肤下移动。巫师当时已经来到日本，可是她不在东京，她搬到大阪东边、靠近奈良的地方，也就是在我的西方三百英里之处。我不清楚她为什么要这么做。我透过 Skype 电话告诉她我打算辞职，她很高兴，她一直希望我不要再做。", "周一，迦勒同意与我在他的转角大办公室会谈。迦勒重返银行时，坚持要求一间转角办公室。我知道这一点，因为去年夏天我们在泰晤士河边喝酒的那个晚上，他告诉过我、ＪＢ和比尔。西方和南方几英里外的风景从他的办公室一览无遗。一张坚固的木头桌子，两个僵硬如木头的肩膀。在我们身后的远处，隐隐约约还能见到被高大树木遮掩的皇宫。", "我一进房间就注意到迦勒的态度很严肃，身上明显透露出一种警戒感，让我相当不习惯。事后回想，考虑到我约谈他的时间，他一定已经晓得我打算做什么。荒谬的是，我当时居然从未想过他可能已经知晓。我将所有的注意力放在眼睛和嘴巴的控制上，努力让它们不抽搐，将肌肉维持在适当的中速运动。像一位西洋棋棋手，一位扑克选手，一匹狼。", "我坐下。一如往常，他低头看我，我抬头看他。", "他知道我要说什么吗？", "我当然说了。", "我从来不擅长做计划，我的演讲也没有经过精密的排练。我告诉自己我一定要提到的几个重点：我要离开、我很抱歉、我会换到慈善机构工作（我想找一个致力于改善贫富不均的机构）、为了感谢他和花旗为我做的一切，我会做满这一年，并且不拿这一年的分红奖金，可是在那之后我真的非走不可。这一次，我是认真的。我最后加上的条件，也就是不拿分红再做一年，是一种锦上添花的艺术手法──这正是迦勒在二○○九年时提供鼻涕虫的。", "这些是我必须强调的重点，可是我无法掌握节奏，叙述时一直磕磕绊绊。我不该谈到我的病，不该滔滔不绝的告诉他，我的胃和心脏出问题。我提到一些绝对不该提及的事：我的运动鞋（为什么我每次都要提起它？）、名为「气体恐慌」的夜店，还有昆汀．本廷。我想我的精神状态看起来已经不是很正常。", "当我在迦勒面前崩溃时，他软化了吗？当我告诉他我生病了，他的眼里可曾闪过关心的光芒吗？真相是，说实话，我不知道，仿佛我根本不在场。我对我说了什么，记忆相当模糊；对他听到什么，一样不清楚。我不记得自己是怎么说的，我只是很吃力的把字和字串连在一起。", "但是我清楚的记得，在我说完后，他在椅子上挪动身体的方式。他拿出一张通知，空气中隐约流动同情的气氛，可是我立刻知道他不过是在演戏。同情是一种愿意伸手去拉别人一把的美德，这个男人身上显然没有任何这类的东西。", "迦勒说很抱歉，他非常、非常的抱歉。他知道这对我来说很艰难。当他以前年轻时，也曾经只身一人搬到东京。他知道这个地方可以多么不友善，让你感到既孤独又寒冷。可是，银行不希望我离开，他们重视我的努力和工作成就。放轻松一点，多花点时间。别急著做决定，两周以后再回来，我们到时再好好谈一谈。", "我感觉自己就像一个卡通人物，从建筑物跳下来，落在弹跳床上，又被弹回原来的位置。于是，我又回到 STIRT 的办公区。", "不过我并没有被弹回原处。不。有什么东西改变。", "沙漏被一百八十度翻转，有些事开始启动。在那个时候，我的脑袋还不知道，但我的内心深处却已经知晓。", "我本能的感觉到事情不太对劲，却又不清楚到底是哪里出问题。我写了一封电子邮件给人力资源部，要求咨询。我想确定迦勒不能对我做任何事，像是取消我的递延股票，封锁我的离职之路等。", "我只能偷偷的去找人力资源部。我不能将我的不信任显露出来。", "在没有窗户的房间里，一根冰柱模仿椅子的形态坐在我面前。她是高䠷的金发女郎，看起来像瑞士人？还是瑞典人？她的手指又细又长。不管在举止或仪容上，她都无懈可击。她一边翻阅文件，一边打量我的眼神。", "管理阶层可以取消你的递延股票吗？不，他们当然不能。有没有可能我从银行辞职，改为慈善机构工作，并保留所有的递延股票？我从未听过这种事，让我回去再查一查。但是盖瑞，你还好吗？你好像很紧张、很不安的样子。有什么问题都可以告诉我，你看起来似乎不太好。没事的，我们的工作就是要保护你们。", "我并不是很相信她说的话。", "小节 9", "接下来的两周伴随凛冽的冬风猛烈来袭。我搭上西行的火车，前往东大阪的瓢箪山探望巫师。先搭新干线在京都站下车，在大和西大寺站再换一次车。", "巫师住在奈良附近。当时那里正在举行「烧山祭」。巫师在当地中学担任英语老师。那天她要上课，所以我便一个人去了。他们点燃整座若草山，猛烈的火燄极为明亮，使得奈良古庙在橙色的映照下散发乌黑的幽光。", "画面令人震撼，整座山都著火了。烟火。人山人海。不断升起的黑烟。放火烧整座山一定很危险，但消防车全部在旁边待命。山周围的干草已经全部被砍掉，以确保火势不会蔓延。", "那么我呢？我把我的干草都清理干净了吗？会有消防车来救我吗？", "两个星期转瞬即逝，我又回东京上班。进行第二次会谈的时间也到了。", "迦勒并没有在他的办公室和我谈。大概是不想让天皇看到吧？他领我走进大楼内部一间没有窗户的白色房间。", "「经过两周的考虑后，你现在还是想走？你确定你要离开？」", "有什么可能改变？有什么可能在两周内就改变？", "「是。我确定。」", "「好。嗯……我彻底研究离开银行去为慈善机构工作的细节。我很遗憾的告诉你，只有在银行高层批准的情况下，你才有这个选项。可是银行高层不会批准的。」", "他笑了。又大又白的钢琴键牙齿闪闪发光。此时，我想，银行欠我的钱，已经超过一百五十万英镑，可能更接近两百万一些。当时的我无法像以前那般轻易的记住数字，即使如此，我也明白，它已经超出我「比很多还要多」的门槛。", "他的意思很清楚。你可以走，但是钱要留下。", "我不喜欢那样。不，我不喜欢那样。这不是抢劫银行该有的方式。", "之前我内心深处已经意识到的事，终于在这一刻涌进我的大脑。", "所以，宣战了。他们想要开战。", "我对自己说，没问题。反正，这也不是你一生中遇到的第一次战争。", "之后发生的事情，很快的将整个生活变成一场闹剧。我进入我后来将其命名为「会议时期」的阶段。在人生中那段时间，除了开会，再也没有其他的事。", "突然间，我每天都会被叫去参加三到四次会议。不一定总是三到四次，有时可能两次，有时可能五次，但开会取代交易，成为我生活里的主轴。", "所有会议都是和资深主管一起开的，但参加的组合变化很大。例如，我早上可能与渡边久进行一对一的面谈：他会微笑，拍拍我的背。吃过午饭，我会与鲁伯特．霍布豪斯和青蛙开视讯会议，他们会以严肃的语气苛刻的指责我，说我不该拒绝；我会盯著自己的鞋子，不时跟著点头。傍晚时分，迦勒和我待在同一房间里，鼻涕虫则出现在萤幕上对我信心喊话：我们相信你可以的！你绝对做得到！", "渡边久、鲁伯特、迦勒、青蛙、鼻涕虫，以及许许多多我以前从未见过、但突然非常热中于参与其中的经理，排列出无穷无尽的组合，而且还发明各式各样的玩法。鲁伯特和青蛙喜欢传递智慧，总括来说，就是喜欢谈论自己；渡边久和鼻涕虫热中于支持和鼓励，态度总是表现得非常友善。令人惊讶的是，迦勒居然是会发怒尖叫且喋喋不休的类型，还喜欢找人唱双簧，一人扮白脸、一人扮黑脸的联手对付我。", "其中我最喜欢的是「喊叫会议」，喊叫会议总是非常有趣。迦勒开很多次这样的会，他总在里头大喊大叫：「我们就是对你太好了！」「你怎么敢！」等等。开会的人处在同一个空间里，可以将手指戳到对方脸上时，效果最好。如果是视讯会议，人们可能不小心将麦克风关成静音，影响力就大打折扣，遇上这种情况，我会特别努力帮忙提升效果。是的，我很喜欢喊叫会议，它们让我想起小时候的事；在成年之后，那些事就几乎绝迹。我在想，它们真的产生过任何实际效果吗？人们若因此改变想法，岂不是很奇怪？只因为有人当你的面大喊大叫？我不禁怀疑，真的有人因此改变过吗？", "所有会议的主题都是我需要提振精神，做出选择。我能够当个真男人并做好这份工作吗？还是我要一蹶不振，认输滚蛋？", "嗯，真是棘手的选择。", "这种氛围的好处在于传递智慧，因为你可借此看到其他人的些许想法。在和伦敦的视讯会议里，青蛙让我坐下，试图以事实说服我，即使我能保留所有的钱（当然，我绝对不可能拿得到的），那个数量的钱绝对不够。在交了税后，我能剩下多少？本来可以拿多少？两百万英镑？他看著这个数字，大笑起来。这还不够维持我五年的花费！我在不久后便会跪下求银行再让我回来！我们两个都笑了，我低头看著我的运动鞋。", "鲁伯特也很有趣。我喜欢和他开会。他花很多时间谈论他职业军人退役的父亲。他曾经告诉他爸爸，他对自己的分红奖金不满，他爸爸则告诉他要「像个男人」。我不确定这两件事有什么关联性。我猜意思是，我也应该要像个男人？", "不过毫无疑问的，所有会议的最大特点是「角色明显不一致」。这不是花旗银行的官方策略，所以我其实不该过度强调，但它确实给我活下去的期待。如此多彩多姿！如此戏剧化！如此唱作俱佳！你永远不知道下一次你会遇到谁！迦勒唱完黑脸的表演之后，鼻涕虫的白脸往往紧随而至，甚至在为数不多的愉悦时刻里，两场会议都幸运的有迦勒出席。这种情况提供的强烈戏剧化反差，堪称精妙绝伦。看迦勒从咆哮的狼瞬间变成温顺的泰迪熊，真的会让你觉得人性还是有希望的。没有人关心这些矛盾之处。攻击若是有效，诚实与否又有什么关系呢？况且唯一会注意到的，不过只有我一人而已，自然更无所谓。那么，对我来说呢？嗯，我只能说，我真的很喜欢他们的表演。", "为了应对这些多样化的战略，我为自己创造出一种叫「尽可能什么都不说」的游戏，我小时候非常擅长这种游戏。游戏名称已经将它的目的解释得很清楚──不说话，只能发出咕哝声。为自己设下的规则激起我的挑战欲，不过，有时候，像是与青蛙或鲁伯特的一对一会议实在太容易获胜，我反而会觉得乏味。我最喜欢的，是和迦勒的对抗性会议，因为你必须用眉毛表达许多情绪，挑战性最高。", "在这些会议中，我从未以任何方式参与过他们强加在我身上的「离开／留下」二分法。想都别想。去他们的。我绝不可能不拿钱就离开，也不会再为那些混蛋工作。事实上，对我来说最好的结果就是被解雇。若是非自愿离职，我不但可以离开，还能拿走银行欠我的钱。所以他们到底打算怎么做？不，不，不行。没办法。去他们的。", "去他们的。去他们的。去他们的。去他们的。", "那些混蛋再怎么对我大喊大叫，我都不会屈服。", "最后，因为我一直不肯做选择，也可能是因为我几乎什么话都没说，引发一场每位资深经理要么亲自出席，要么视讯出席的最终巨型会议。", "鼻涕虫主导这场会议，这意味著过程将会非常温和愉快。", "鼻涕虫叫齐所有人，然后提出他最大的恳求。他说他了解我，也知道我生病了。他相信我。他也认为我是真的病了。银行会尽一切努力做我的后盾，帮助我，改善我的状况。医疗支援、物质支援、情感支援等。无论需要什么，他们都会提供给我。他所需要的只是我的承诺。我还会回来。交易。赚钱。", "慢慢来，他说，放轻松，顺其自然。不要给自己压力，你需要多长的时间都没关系。别担心，他说，没事的。我们所有人都会站在你身后。", "之后，他又点了每一位资深经理的名字，他们一个接一个的告诉我他们对我的看重。太棒了，充实我的心灵，温暖我的心。轮到迦勒说话时，他的眼睛里甚至含著泪水。", "之后，我决定尝试一个新游戏。我对鼻涕虫的信任到目前为止并无瑕疵，尚称完整，因此，我决定相信他的话。既然需要多长的时间都没关系，我就放手去做吧！花所有我需要的时间来改善我的状况，好好照顾自己。", "我开始按照我签的合约上所规定的时间工作。", "合约上，我的工作时间是朝九晚五。我想，很可能每个日本人合约上的工作时间都是朝九晚五。", "然而，没有人朝九晚五的工作。", "有了每一位资深经理在背后全力且坚定的支持我，我全面改采轻松惬意的工作方式。我每天午休都离开办公室一小时，有时甚至一个半小时！我在东京冷冽的冬季里去皇居外苑散步，数著一棵又一棵的树。有时我觉得累了，想要靠著休息一下，我便拉上兜帽，开始睡觉。", "很美妙，真的很放松。那一周的 PnL 是我搬到东京后赚得最多的一周，也是我职业生涯里上满五天班的最后一周。", "再下一周。周一上午刚过九点，迦勒走到我身边，轻轻碰一下我的肩膀，问我明天能否和他一起吃晚餐。", "然后，当然，就在那个时候出事了。", "小节 10", "二○一三年二月中旬，一个寒冷且漆黑的周二夜晚，在丸之内购物中心六楼的匿名拉面餐厅里，一位身材高大、非常富有、手指粗壮的男人，怀著对于自动调温器位置不当的仇恨，为我描绘出我可能面临的未来人生。", "在他的叙述中，我的未来只剩法院和贫穷，多年来从银行抢到的钱全部打水漂。", "很残酷。可是支撑它的权力来自全世界最大的企业之一。", "你会怎么想？当你从一无所有，每周骑脚踏车送报赚取十二英镑，直到成为世界上最赚钱的交易员之一，为世界上最大的银行之一工作，一位二十六岁的成年男子，看著曾经是你的偶像的男人，隔著桌子坐在你的对面，吃了两碗拉面，直视你的眼睛，说：「有时候，坏事同样会发生在好人身上。我们可以让你的生活变得异常艰难。」你会怎么想？", "仿佛他是个帮派份子。仿佛他是混黑社会的。", "你会怎么想？", "你知道吗？那时距离我被高中开除刚好整整十年。我不是毒贩，和毒品交易也扯不上任何关系，但在一流的明星高中，就读的学生几乎都来自上流社会，他们知道我拿得到毒品。", "我确实拿得到毒品。他们没说错，这是真的，我可以拿得到毒品，因为我住的社区马路上就有人在贩毒。事实上，还不只一个人。他们住的社区没有毒贩，可是我的社区有。这就是为什么那些有钱的孩子会要求我为他们购买毒品，这就是为什么被开除的人会是我。", "你知道吗？那些毒贩，他们没有我所拥有的选择，也没有那些有钱孩子所拥有的选择。他们不能上伦敦政经学院。他们无法靠纸牌游戏赢得投资银行的实习机会。他们没有摆脱贫穷的可靠途径，他们只能贩卖毒品。有时他们也会走上其他的歧路──诈欺、入室偷窃。其中有些人赚钱，有些人不赚钱；其中有些人进监狱，有些人没有进监狱。有时，像这样的孩子，会遇到非常糟糕的事情。有时他们会被刺伤，有时他们会被杀，有时遇到有人坐在夜店外的车里埋伏，等他们过马路，就开车从他们身上碾过去，然后看著他们的身体在地上抽搐。", "在那一刻，我意识到我们是一样的人。我们都一样。毒贩、银行家、交易员、现在的我、过去的我、迦勒、萨拉万、布拉塔普、鲁伯特．霍布豪斯、杰米、伊布兰、ＪＢ，我们都一样。唯一的区别只是每个人父亲的财力。如果那些毒贩去了伊顿公学，或者圣保罗学院，或者鲁伯特去过的任何他妈的寄宿学校，他们可能就会和我一起出现在交易大厅里，坐在亚瑟旁边，坐在ＪＢ旁边，买他妈的绿色欧洲美元期货。如果那些交易员出生在我出生的东伦敦巴金医院，也是足球明星博比．摩尔、约翰．泰利，以及其他一百万个在下课时卖便宜糖果给同学的小骗子出生的地方，他们也会在街角贩售毒品。我们是一样的人。我们都是一样的，愚蠢、聪明、年轻、野心勃勃。想要闯出一点名堂，却不太确定该做什么。追逐目标，却不知道自己在追求什么。尽全力跑向目标，最后却又仓皇的转身逃开。", "对渴望成功的年轻孩子来说，不同的只是走上的路，是贩卖毒品，还是贩卖该死的债券，不是吗？我们都一样。我们他妈的没什么不同。只是有时候在不知何处的错误寺庙里，神明摇动错误的盒子，于是像我或比尔这样的人，便从盒子里向后摔出来，脸朝地面的落入错误的游戏中，落在错误的棋盘上。", "我们是一样的。你们没有比我们好，你们一点都不比我们好。从一开始，这就是两个不同的游戏。从非常早的开始。从诞生的那一刻开始。但是你当下并不会想到这一切，这些东西全部只会在你的梦里反复流过你的心。", "当你盯著那张胖脸的时候，你会想：", "「兄弟，如果你不是混黑社会的，就不要模仿帮派份子说话。」", "我立刻知道我会迎战。", "它不是一个决定，从来不是一个决定。有时候，你就是必须直接与魔鬼对峙。", "这么做聪明吗？和花旗银行对抗是否明智？毕竟它可是世界上最大的公司之一。", "嗯，我不知道。去他的。我从来没有声称自己是个智者。", "那天晚上我一夜没睡，连一秒钟也没睡。我直接回家，呕吐。我吐不出任何他妈的食物，只吐出一些胆汁，看起来像浅色的尿。因为吃了药，吐出来的东西甚至没有酸味。我擦一擦嘴，开始踱步。然后踱步，踱步，来回踱步。", "我要对抗它。我真的要他妈的对抗它。目前为止，我一点计划都没有。现在的状况，他妈的还能采取什么行动？", "我已经和人力资源部确认过，他说的那些都是合法的。除非他们签字同意，否则我不能去为慈善机构工作。 一场游戏。然而，也许它不是游戏，也许那就是我的人生。", "他写好假条，给我三个月的带薪病假。", "在那之后，我克制不住的颤抖好久。我的身体微微摇晃，但我没有动。", "我又一次发现自己站在中庭边缘。我低头看，但没有往下跳。", "我拿到了。我手上有病假核准单，不过我没有立刻请假。", "从医生办公室出来后，我回到交易大厅，拿起我的抽绳后背包，直接回家。", "秘密肯定在那天被泄漏，我的情况不再只有高阶管理层知道。我确信这一点，是因为我开始收到来自伦敦的简讯。", "史努比的简讯写：「不要放弃！你可以打败他们的！你比那些混蛋聪明多了！」", "蒂兹的简讯说：「如果你离开真的就太可惜了，兄弟，我还以为你将来会成为这个地方的头儿呢！」", "我以为比尔的简讯会跟著传来，却一直等到很晚的夜里才收到。他写：「你还好吧？盖尔？管理阶层说你想离开，他们一直要求我说服你留下。他们说你因为压力太大，想请病假。出了什么事？盖尔。你还好吗？」", "这是我唯一回复的讯息。", "「不用担心我，老大，我一直很好。」", "那也许是谎言。", "所以，我为什么没有立刻去请病假？", "我当时告诉自己，这么做是有风险的。我担心如果我请病假，可能会引发银行的法律诉讼。", "不过，是真的吗？这种危险真的存在吗？你不会因为请病假就被起诉吧……会吗？", "如今回想起来，我想原因不止于此。我猜在某种程度上，我知道这表示什么。不再有 PnL，不再有清算权，不再有野心勃勃的年轻人投射过来的羡慕目光。", "永无止境的会议尚未结束。这一次轮到我和鲁伯特开会。会议上没有其他人，只有鲁伯特和我。他以视讯的方式出现在迦勒明亮的高空办公室的萤幕上。", "我坐下来，看著我的鞋子。", "「你知道吗？盖瑞，没有人相信你，没有人相信你真的生病了。他们认为整件事都是你的战术，为了拿到更多钱，或是离开银行并拿走你的递延股票，然后转到高盛工作。」", "我什么也没做，我瞪著鞋，点点头。有时候，我会在脑子里做长除法。", "「但我相信你。」", "这句话引起我的注意。我抬起头，看著萤幕。「盖瑞，如果你可以选择任何地方，你现在想去哪里？」", "我想了好久，然后诚实的回答他的问题。", "「哪里都不想。任何地方我都不想去。说实话，霍布豪斯，我一点都不在乎。」", "「哈利最近如何？」", "「哈利最近如何!?他还好……对，他很好。」", "当然，鲁伯特不知道我们闹翻，也不知道我已经将近一年没和哈利说过话。", "「回去伊尔福德你长大的街上和哈利一起踢足球如何？你会想回去那个地方吗？」", "当我们开始一起踢足球时，哈利多大？他当时肯定只有五、六岁。那样的话，我就是九岁或十岁。后来他踢得比我更好时，他那时几岁？", "「会。会，我想应该会。是的，我会的。」", "在街上踢足球的日子已经是很久很久以前的事。灯柱、电线杆、回收中心的凹墙，如此遥不可及。我们经常把球踢到回收中心里，只能从它的侧边爬进去，才能把球拿回来。你必须越过一座大铁桥，穿过一位老人的花园，听到他从窗户里对你大喊大叫，然后才能进到立著许多由旧报纸堆成的六公尺高墙的回收中心。你奋力一踢，将球踢回街道，然后循原路爬回去，再次开始踢球。冬天时，我们会一直玩到太阳下山，直到有人的妈妈出来叫孩子回家吃饭，才会停止。有时是我妈妈，有时是哈利的妈妈。有时我们会一起吃饭，有时我们各自回家吃饭。", "「你可以回去那里。你可以回到那个地方。」", "不，我他妈的不能，我再也不愿意和那孩子说话。", "「没关系的。一切都会好起来的。你只需要振作起来，度过难关。你会没事的。」", "他为什么要这么做？鲁伯特为什么要这么做？", "「谢谢霍布豪斯。我很感激。谢谢。」", "「没关系的，你会没事的。」", "视讯结束。", "我独自坐在办公室里，凝视天皇的宫殿。我的私人手机收到一则简讯，来自鲁伯特。", "「请病假吧！银行不能做什么的。他们没找到你的任何把柄。」", "于是我递出假条，请了病假。", "＊译注：氢离子帮浦阻断剂。⤴", "＊译注：Jared Kushner；美国前总统川普的女婿。⤴", "＊译注：「款待」之意。⤴", "＊译注：pointillistic；是一种以原色彩点堆砌，营造出远观时仿佛融为一体的油画技巧。⤴", "＊译注：「尽管」之意。⤴", "小节 12", "三个月。", "三个月的时间并不长，但是我却觉得像是永远。", "自十九岁以来，我从未享受过三个月的空闲。我大部分的时间都忙著拍松靠枕。", "感觉像从水底浮上来，呼吸到新鲜空气。", "我做的第一件事就是去瓢箪山。在京都换车，在大和西大寺换车。", "巫师住在学校分配的制式小公寓。睡觉的地方在木梯顶部的架子上，鼻子几乎可以碰到天花板。很多日本年轻人都是这么生活的，没有真正的厨房，窗户镶嵌磨砂玻璃，所以没人看得到里头。", "唯一的热源来自一台小暖气机，冬天时房间里总是很冷。但是它属于我们。我们不必和任何人分享。", "我去找她，我想我甚至没有事先告诉她我要过来，所以她有些惊讶，但没被吓到。", "我们爬上梯子，将日式床垫丢下去。有很长的时间，我都待在下面的地板上，她会在周围走来走去，煮水泡一杯拉面，然后问我最近有没有看过什么好电影。", "天气很冷，但我们会穿上很多衣服，跑去瓢箪山的一个小公园。她铺好一张小野餐毯，然后俯卧著，我把头靠在她单薄的背上，我们两个就躺在那里看书。有时我们也会去奈良的大公园，看看宏伟而古老的木造寺庙。顺便喂一喂四处乱走的鹿。", "但是除了这些，我还是得开会。尽管我已经请病假，可是会议没有停止，只是现在的开会形式变成手机通讯。我会把免持功能打开，将手机放在地板的日式床垫上，然后在它旁边躺下。我会像海星一样伸展手脚，然后越过自己的头顶从下往上看，这样在管理阶层喋喋不休的背景音效中，我就能从磨砂窗户看出去，看著扭曲的蓝天慢慢变黑。", "巫师有时会过来，坐在我身边。当她这么做时，她会拿起手机，直接挂断电话，然后她会说：「可以了，盖瑞，已经够了。」", "我飞回英国探望妈妈。我不知道为什么，但我们母子关系从来都不亲密。我骑著用第一笔分红奖金买的伟士牌黑色小摩托车载她兜风，一路穿过伦敦市中心抵达摄政公园。我们在花园里散步，绕湖走一圈。我问她为什么从没学过弹吉他。", "她用奇怪的眼光打量我。那时候，所有人都用奇怪的眼光打量我。然后她问我：「盖瑞，你还好吗？」", "我回答：「好，好，好。是的，我很好。妳知道我的，我一直都很好。」", "我在回东京的飞机上第一次看了全世界最帅的男人保罗．纽曼主演的《铁窗喋血》（Cool Hand Luke）。他在剧中被送进监狱，我不知道为什么，好像是因为他破坏公物？最后他被和其他犯人炼在一起做工。", "犯人们的老大个性霸道，他挑战保罗．纽曼，要和他比一场拳击。保罗的体型小很多，看起来似乎一点机会都没有。恶霸一次又一次的打他，只是他每次倒下，都会再站起来，一百次、一千次、无数次，直到他被打得鼻青脸肿。最后恶霸终于放弃。", "我在心里想，保罗．纽曼真是个男子汉啊！实在是太棒了。太帅了。", "我允许自己在那段时间稍微放纵一些，睡眠和饮食都不正常。我在白天睡觉，晚上便四处游荡，寻找食物。", "没有比这里更棒的地方。我说真的。我确确实实这么认为。", "对一个孤单的人来说，东京可以吃的东西太多。而且随著春季到来，温暖的天气也重回人间。", "我住的大楼附近有一家小拉面店。他们卖猪肉拉面，也卖鸡肉拉面。高汤清澈细致，带著明显的醋味。非常好吃。可惜它后来关门了。", "那家拉面店的营业时间不长。在它开门的时候，我通常还未醒来，可是我还有吉野家。可爱的吉野家，我的夜晚女王，你明亮的橙色窗户永远不会让我失望。吉野家是二十四小时营业的牛肉盖饭餐厅。一直是这么的美味、快速、便宜。不限量的腌制红姜。有时候，他们也会提供鳗鱼饭。", "有些东西你在日本找不到，像是豌豆。我有时候会很想念它。最后，我终于在世界上最日本化的义大利连锁餐厅萨莉亚找到了。价格便宜，份量十足，深受学生喜爱。他们把豌豆和培根混在一起，加上一个温泉蛋，做成沙拉。", "我不一定都在速食店用餐。有时我会在正常时间起床，然后我就能吃到一些精致美食，比如去虎之门的法国餐厅吃牛排、炸薯条。你知道，花旗银行还在付薪水给我。", "虽然在东京并不需要花大钱才能吃得像个国王，就算是寿司也可能非常便宜。我每周至少去神谷町「寿司三味」三次。腌鲔鱼盖饭，加量不加价，还附味噌汤和绿茶，只要五百日圆。每次去他们都会给我一张一百圆的折价券，所以下次就只要四百日圆，相当于才二．五英镑！我喜欢坐在柜台，和寿司师傅说笑。", "给自己一个机会，去居酒屋点梅干茶泡饭。用不著谢我，你好好享受就行了。", "新鲜现做的汉堡。味噌／盐味／酱油／豚骨拉面，以上排列便是我的喜好顺序。神田的鬼金棒拉面无人能敌。高田马场小巷子里的法式越南三明治。冷荞麦面配上７－11便利商店的棕色酱汁。７－11便利商店的鲔鱼蛋黄酱饭团。全家便利商店的炸鸡排。麻布十番那家店的饺子。每天早餐吃鲔鱼盖饭（不管几点起床，只要刚起来的第一餐就是早餐）。风云儿的沾面。弥生轩的烤鲭鱼定食。", "这些地方都开著，里头满是一个人用餐的孤独者。拉面店尤其如此。深夜的吉野家，孤独的人们一个挨著一个的坐下，狼吞虎咽吃著美味的食物。在他们拿著筷子大快朵颐时，他们的肩膀和手肘相互碰触摩擦。然后他们站起来，付六百日圆，转身离开。", "当你沮丧时，全世界找不到比这里更好的地方吧？", "有一天，我穿著整套外出服在中午醒来。我看看手机，中午十二点三十七分。我有一百二十七通未接电话，全是哈利打来的。", "我在床上坐起，想了好久，才想起前一天是他的生日。", "小节 13", "好，我想，差不多是时候采取行动。一个人不该拖到等报复上门。", "对，对。我已经吃够拉面了。是时候去请律师了。", "我发讯息给萨加尔．马尔德。还记得他吗？我在伦敦政经学院的肯亚同学。他在二○○八年雷曼兄弟倒闭前在那里工作两个月，他认识那些起诉银行的人。我需要一个了解这类事务的人，所以我请他帮我搭线。", "最后，我请了三位律师，一位在英国，一位在美国，一位在日本。虽然很贵，但花旗银行在我调到日本时，将我的薪水调高到十二万英镑，所以在某种程度上，花旗支付所有的钱：律师、寿司、拉面。我猜，我确实应该谢谢他们。", "律师们并没有告诉我任何我没有弄清楚的事。", "银行可以因为你什么都不做而起诉你吗？", "嗯，显然，从法律上讲，他们不应该这么做。但你绝对不会是第一个。", "我可以去为慈善机构工作，并保留我的递延股票吗？", "严格来说，根据文件，是的。但是可以对抗花旗银行的文件又是什么？", "我应该起诉银行吗？", "你可以这么做，但大概会缠讼好几年，而且他们还欠你两百万英镑。", "嗯，必须一直进出法院。你对一直进出法院有什么看法？那不是我们该尽量避免的吗？", "但在这种情况下，你还有什么选择呢？除了等，其实也没什么可以做。三个月病假剩下的时间你什么也不做，白天睡觉，尝试恢复一些体重。等三个月病假结束后，你回去向银行申请转到慈善机构（你必须先找到一家慈善机构）工作，希望事情能够被顺利解决。", "这并不是一个万无一失的计划。", "我在网路上找到一段讨论贫富不均的影片，那时几乎没有人注意到贫富不均的问题。它是一位在伦敦政经学院教人类学的南非教授录制的。我发了电子邮件给他，告诉他我正在寻找致力于解决贫富不均问题的慈善机构工作的机会。他帮我牵线，请我联络一个人，我们一起开了一场会，他们说他们会帮助我离开花旗。", "那是我手上唯一的工作机会。我等著三个月的病假耗尽。", "在律师、慈善机构，以及我增加的体重的帮助下，我的信心程度稍微获得提升。我现在有计划。我能和他们较量。可是，不舒服的感觉并没有消失，我的胃和心脏仍然在剧烈跳动。我猜我当时的感受应该是恐惧。我感觉大腿隐隐作痛。", "我那时经常躺在地板上。在窗边的阳光照拂中，肚子朝下的俯卧。就像小时候一样，就像我被开除，没有学校可去时一样。趴在靠窗的地板上，在一块小木板上写数学作业。", "承认这一点并不让我感到自豪，但想到要回去，我很害怕。我很怕这三个月即将结束，也很怕我必须回银行上班。", "很快的，三个月的时间过去。回到银行后，第一个和我碰面的是银行的医生。我走进他的办公室，诚实的告诉他，我的心里有多害怕。我有多害怕回银行工作。他看著我的眼睛，点点头，又写了三个月的假条给我。", "那时已是五月下旬，正是东京最美好的季节。许多日本人不喜欢它，因为这是雨季的开始。这座城市很快的就会变得非常炎热。太阳炽热的火力让你无处可逃，空气变得极为潮湿。你一走出户外，踏进这个世界，就会立刻感觉仿佛有条热毛巾落在肩膀上。", "可是我喜欢。我真的非常喜欢。", "日文的雨季念成「つゆ（tsuyu）」，以他们使用的汉字来写就是「梅雨」，翻译回英文便是「plum rain」。我在英国从未见过这样的雨，雨滴如温热的梅子般落下。炎热的大雨犹如来自大海的波浪，密密实实的倾泻而下。", "雨势实在太大，如果我在骑车时遇上暴雨，只要十秒钟就会浑身湿透。为了应付这种状况，我会用塑胶袋紧紧包住一整套备用衣物，放在背包内。等我到达目的地时，再彻底换一身衣服。我最喜欢的是既下大雨又吹强风的时候，温热的雨打在脸上，感觉真是棒极了。", "我在拿到接下来三个月的病假核准单时，当然会想，「可以就这么一直下去吗？」", "我难道就这样生活，一年又一年，一季又一季，一直生病？只要我永远在生病，我就永远不需要回去工作。世界会像季节交替一样流过我身边，我则在雨中骑自行车度过一生。", "若是如此，又会如何？会是一件好事吗？若是如此，我算是赢了这场较量吗？那样的生活算得上美好吗？", "我更频繁的在夜间骑车，借以避开白天炙热的阳光。新宿和涩谷是我最喜欢的骑车路线，这两个区域简直像霓虹灯组成的大皇宫。在雨中，你的眼睛根本来不及辨认，放眼看去只剩模糊一片。有一次我骑自行车去新宿的歌舞伎町，那里有许多小酒吧，里面全是喝醉的日本人，是练习日语的最佳场所。", "我把自行车停在那区域的最南端，靠近王子大饭店，距离小酒吧满远的地方。我想走过人潮汹涌、霓虹闪烁的小巷，享受和更多孤独的人摩肩擦踵的接触。", "我把自行车锁在面向饭店的宽阔广场边缘的栏杆上。在它前面是一条挤满计程车的宽阔马路，它们分成三列停靠，引擎轰隆隆的响著。山手线的绿色车身在它侧边的铁桥上缓缓驶过。到处都是高耸的大楼，到处都是巨大的霓虹灯。我站在马路旁看向西方，也就是我的右边，摩天大楼区在高空中若隐若现，一栋黑色的塔楼整个被白色的金属蜘蛛网包裹在里面。隔著马路，吉野家的招牌散发著温暖的橘光，厨师正将更多的牛肉放在米饭上。一个有五栋房子那么大的巨型ＬＥＤ萤幕竖立在它的上方，不停的滚动发光。卡莉怪妞头上戴著巨大的红色蝴蝶结，在萤幕上快乐的跳舞。", "另一列火车驶过时，带来一阵热风吹拂我的脸。", "我想我应该把这里当成另一个家。", "之后，我尝试做更多事。多学一些日语，多交一些朋友。", "我为自己找了一位可爱的中年日语家教，名叫上野洋子。不管什么季节，她都戴著口罩：夏天是为了防湿气，秋天是防感冒和流感，冬天是因为太过干冷，春天则是为了阻挡花粉。", "然后，我发现「英语会话吃茶屋」的存在。那里是东京的疯子练习外语的场所。你点一杯茶，和疯子聊天，这样的安排对当时的我来说再完美不过。", "我最喜欢的英语会话吃茶屋位于新宿北边学生聚集的高田马场。我很喜欢观察学生。他们在夏天时会成群结队的喝得烂醉，摇摇晃晃的一起走在街上，然后总会有人直接倒地。当这种情况发生时，他们的朋友必须把他们拉起来，但他们会躺在那里大喊：「我没事！」游戏规则就是尽全力的赖在地上，留在原地。通常，你的朋友会设法把你拉起来；如果他们不这么做，你就只好整夜睡在马路上。", "我的情况愈来愈好。我以为我正在好转。但是我已经五个月没去上班。", "我离开办公室的时间愈长，回去工作似乎就变得愈不可能。当我和巫师说到我的病假即将结束时，心里有些不知所措。我的左眼眼角开始感觉到非常轻微的刺痛，手臂也会不由自主的颤抖。", "当这种情况发生时，巫师会握住我的手。她从来不问它怎么在颤抖，但她会说：「你为什么还要和他们斗呢？盖瑞？你不需要和他们斗啊！你得到的已经够多了。为什么你不干脆就离开呢？」", "她错了，永远不够多。我绝对不会离开的。如果这意味著我要让他们赢，那就不离开。", "小节 14", "我的第二回三个月病假即将结束，我相当肯定可以再次延长。我确实还好，但是也真的还生病。可是在我打算回去看银行医生的前一周，我收到一封来自凯尔．齐默尔曼的电子邮件。", "凯尔．齐默尔曼是美国人。他是东京分公司的人力资源主管，也是冰柱的老板。他个子很小，看起来像一只老鼠，这让我想起在那段时期的自己。这个念头让我觉得事情似乎变得公平一点。", "他的电子邮件对于银行欠我的钱非常详细的解释相关法律细节。电邮夹带大量的文件，但他将结论说得非常清楚。", "带薪休假一旦超过六个月，银行欠我的钱将从此一笔勾销，一毛钱都不剩。", "我真的不认为它是「带薪休假」，但我想没有任何人在乎。", "我进公司，找银行医生复诊。他说明得相当清楚：我不应该回去工作。我告诉他这并不取决于我。我必须回去，我别无选择。", "他对我说话时，将手轻轻放在我的肩膀上。这样的动作对日本人来说是非常罕见的。他看著我好一会儿，才开口。", "「那么，我想，这也是没有办法的事。」", "巫师来到东京。我告诉她我必须回去上班。", "我看得出来她看得出我很害怕，我也看得出来她很伤心。", "「别回去，」她说：「千万别这么做。」", "从她绿色的眼睛里，我们都能看出我的状况并不好。我长期失眠，体重愈来愈轻。", "「这和那无关，巫师，这不是一个选择题，而是我非做不可的事。」", "「它不是你非做不可的事，是你选择要这么做！这些事没有一件是你非做不可的！你得到的已经够多！你随时都可以离开！为什么你要这样虐待自己!?」", "「无所谓。我对自己做了什么并不重要。重点是，这件事我非做不可。」", "她看我，一脸快哭出来的表情，可是她没有哭，她只是紧抿嘴唇，没有将她想说的话说出来。我猜我这辈子可能都会一直在想，她那时想说的到底是什么。", "我在那天主动和她分手。一周后，我回花旗银行上班。", "就在我回办公室的前一天，发生一件怪事。我在居住的大楼顶楼餐厅吃饭，那时我已经从保诚大厦的高楼公寓搬出来，换到另一个叫爱宕的地方。那里的山顶有一座要爬上一大段非常陡峭的台阶才会抵达的小神社。听说曾经有位武士骑马爬上去送梅花，结果花了四十五分钟才下完台阶。", "我的新住处不再位于三十楼，而在八楼，仍然很高，它在一片墓地的正上方，面对一座小山。这意味著，我可以从窗户看到树顶。我非常喜欢这样的景色。", "我住的是专门出租给企业的高级公寓，顶楼有一家私人餐厅，价格却出奇的合理。只要在它的营业时间内我还醒著，我就经常在那里吃饭。我每次都点同样的东西：一点鲑鱼、酪梨，以及配上梅干的丼饭。梅干是全世界最酸、最美味的圆形食物了。可是它实在太酸了，每次吃的时候我的脸都会不由自主的扭曲。餐厅里有个二十多岁或三十出头的日本女服务生，总觉得我的表情很有趣。", "在我回去上班的前一天，在餐厅吃完饭后的夜里，我注意到一封手写的小信放在我门下。它只写了短短几句话：", "「在餐厅里，你看起来很悲伤。我希望你一切都好。如果你需要找人谈谈，可以发讯息给我的帐号。真希。」", "隔天，我依照原订计划，回去上班。", "小节 15", "我请病假已经将近六个月。到了此时，再也没有人会打电话烦我。迦勒没有和我联络，鼻涕虫也没有。和管理阶层的会议更是彻底消失。", "我现在完全归属于人力资源部管辖。人力资源部的超级老鼠凯尔．齐默尔曼成了我的上司。冰柱似乎已经被从棋盘上移除。就我来看，这步棋倒是走得颇为巧妙。", "比尔最早给我的忠告之一是：「找人力资源部介入绝对没有好处。」我没听他的话，显然把事情搞砸。", "东京分公司的人力资源部规模很小。凯尔．齐默尔曼的办公室位于它的角落。我必须穿过整个部门才能走到他的办公室；我想和冰柱建立眼神交流，但她却自始至终低著头。", "办公室虽小，却有扇窗户，一切收拾得井然有序。文件柜横跨一整面墙。桌子很简陋，什么装饰品都没有。一本记事本，一枝昂贵的笔。我走进门时，凯尔的眼里充满活力，他微笑欢迎我。", "当然，我的录音笔全程开启。我想过在进他的办公室后大喊大叫，高声指责，希望能逼得他失言承认，就像当初我试著对迦勒做的那样。但是我太想知道他们对我的计划是什么，所以我决定先坐下来听听看。他们肯定不会叫我回 STIRT 小组的，对吧？", "凯尔说话时语气流畅，既有效率，又有活力。他很高兴看到我已经康复。这句话很有趣，我差点笑出声。他很愉快的说，他们为我找到一个新职位。这也非常有趣。我喜欢凯尔．齐默尔曼的黑色幽默，我真希望之前他参与我的会议次数多一点。", "凯尔带我上楼，引领我走到交易大厅。我不能撒谎，我的心脏当时漏了一拍。我可以看到每一个人，尤其是在远处角落迦勒巨大的身躯。", "STIRT 小组的办公区就在我的正前方，但我们没有去那里。相反的，凯尔领著我右转，然后再右转。绕过放印表机的角落，转进一个隐蔽的空间。我就是在这里认识杰拉德．冈特。", "毫无疑问的，杰拉德．冈特是我在交易大厅或其他任何地方所见过最无聊的人。他脸上戴的眼镜都比他的眼睛更具生命力，他的灵魂似乎很渴望死亡的来临。", "真的吗？我心想，我知道我还没有恢复到最佳状态，但真的吗？现在……他们为我找的一个像他这样的对手!?我感觉血液再次回到我的手指。我想，这场比赛我绝对能赢。", "在那时，我已经有一段时间没赢过，所以这个念头让我不禁从心底感到愉悦。我伸出手，紧紧和他的手相握：「你好，杰拉德，我叫盖瑞。」", "他们决定将我转入「行政管理」部门。不要问我什么是行政管理；我当时不知道，现在还是不知道。我只知道杰拉德就在这个部门。他们做试算表，也处理文书工作。", "杰拉德没有对我报以微笑。事实上，我从来没有见过杰拉德笑过。他看著地面，把眼镜推到鼻梁上。他慢慢将身体从椅子上撑起来，仿佛用尽他最后一丝的意志力。他开始往前走，我跟著他，来到全世界最令人沮丧的办公室。", "杰拉德．冈特办公室里唯一的光源，来自一颗病态的蓝色卤素灯泡。它嗡嗡作响，清楚表达它在墙上垂死挣扎的痛苦。天花板的吸顶灯坏了。其实我们不都也是如此？", "杰拉德．冈特说话的语气既长又宽，而且单调。他的声音令人感到无聊至极，带著回声般深沉的悲伤；宛如一头迷路的孤独鲸鱼发出的绝望呻吟。", "他向我解释我接下来要负责的工作。我根本没在听，我打量房间四周。你在下地狱之前，如果遇上某种作业疏失，他们叫你稍候的房间，应该就长这样吧？完全没有装饰，唯一的例外是，桌上摆了一个杰拉德和他妻子合照的相框。", "照片中他的妻子很年轻，也许二十四、五岁。非常漂亮的日本女性。她微笑，他也在微笑。他在照片中看起来和太太年龄差不多。天哪！他现在几岁了？很难说。发生了什么？杰拉德？到底出了什么事？你去了哪里？你是不是走错什么路？", "我不知道我在他的办公室里凝视那张照片多久，但肯定是很长一段时间，因为杰拉德已经将话讲完。我对他微笑，真诚且深沉的，然后我使尽全力想捏碎他的手。", "我并未从杰拉德向我解释的新工作内容的独白中，了解任何我应该负起的责任。即使，事实上，整个过程都被我录音，但我这辈子从没再听过一次，因为我非常害怕再听一次，可能会让我老上好几岁。", "因此，至少从方便办事的角度，我看到杰拉德在我们会面后发送一封电子邮件给我。他明白列出我要负责的项目时，我确实松了一大口气。", "他要我创造出一个冗长、艰难、满是细节的试算表档案。嗯，非常合理，因为杰拉德本身就是一个冗长、艰难、注重细节的试算表拥护者。我很快浏览完他的电子邮件，发现他分配给我的工作量极大，需要至少六、七周，甚至好几个月才有可能完成。", "就这样吗？在我对回来工作那么恐惧，承受那么久的惴惴不安之后，他们就打算这么对付我？他们只能想出他妈的这样水准的把戏？强迫我坐在回收箱附近的角落，叫我在 Excel 上写下一行又一行的指令，仿佛我被判了一辈子的课后辅导似的，他们却要为此付我一年十二万英镑的薪水？嗯，他妈的。我这辈子被学校留下来的次数可不少，但它们从来没能强迫我真心反省，阻止我不变成一个混蛋。", "我打开 Microsoft Excel 建立一个新档案，在十五分钟内做完整个试算表。", "两周后，杰拉德把我叫进他的办公室，要求检查我的试算表。我一直在等这一刻，老实说，我相当期待。", "我在碰面前，就先将档案附在电子邮件上寄给他。", "他打开一看，瞬间愣住。", "「这是什么？我要的东西在哪里？你就只做这些吗？」", "我看著他眼里黯淡的灰黑色，露出微笑。", "「是的，杰拉德，我就只做这些。」", "「可是这里面什么都没有啊！该做的完全都没有做到！」", "我皱起眉头，抓抓头发，表现出一副忧心忡忡的样子。", "「我很抱歉，杰拉德……你确定档案有问题吗？我相信你要求我做的都在上面了！」", "我再次微笑，杰拉德只能承认他输了。《马太福音》上不是说吗？「温柔的人有福了，因为他们必承受地土。」", "从那之后，杰拉德再也没有指派任何工作给我。其他人也没有。", "事实上，银行里再也没有任何人与我交谈。我完全无事可做。只有孝介会在确定没人看见的时候，偷偷溜过来，在我的桌上留下饭团之类的东西，但其实也没有几次。从交易大厅要到厕所，必须经过一条长长的走道，有时在我去刷牙或刷完牙回来的路上，会看到迦勒从相反的方向走来，他一见到我，总会突然假装他忘了拿识别证或别的东西，转身往回走。", "一旦了解目前的情况，我发一封电子邮件给凯尔，问他，我已经累积多少天的特休。", "在我担任交易员期间，我不常休假，真的不常。当然，之前的六个月都是病假，并不算在特休里。他告诉我，我已经累积五十多天，于是我便为接下来的六周请特休。", "时序进入秋天，我决定去旅行。我和巫师一起去过京都很多次，所以这次我想去更远的地方。我想去广岛，听说那里的御好烧会放面条。", "我没有料到回银行工作这么容易。我还以为我一回来就会有警察之类的人，带著律师，直接将我扭送监狱。没想到我还能拿高薪，但完全不需要工作，并且可以自由使用印表机。到底代表什么？是否代表他们真的找不到我的任何把柄？是不是他们已经搜查过一遍，却什么都没有发现呢？", "我经常去高田马场的英语会话吃茶屋，和各式各样、许许多多的人交谈。和我对话的通常是日本人，但那家吃茶屋也是来自世界各角落的怪人聚集地。有一次，我发现自己和一位有沙棕色头发、高耸鼻子的中年荷兰人喝了好几个小时的茶。他年轻时认识一位日本女孩，他们后来结婚，又离婚，他成为牧师，决定留在日本。", "我发现自己一直说个不停，将我的整个故事都说出来。在这之前，我从未告诉过任何人完整的故事，我从未告诉过任何人我是百万富翁。我向他倾诉一个多小时，荷兰神父点点头，喝了几杯啤酒。最后，我终于说完，我等待他的回应。他说：「真是他妈的，兄弟。这实在是太糟糕了。」", "我姐姐来日本看我。因为我真的很喜欢广岛，所以我带她去那里，去神圣的宫岛。宫岛又叫做严岛，以矗立在海里的巨大红色鸟居闻名于世。我脱掉衣服，游过鸟居下方。太阳下山后，我们拿著仙贝喂鹿。", "我姐姐问我，工作进行得如何，我给她看一些我在上班时间画的画。一幅是约翰．蓝侬，另一幅是保罗．麦卡尼。", "我没有向姐姐解释我真正面对的状况，她瞇著眼睛看著我的画，又瞇著眼睛看著我。然后她问我，我还好吗？我笑著回答：「是的，黛比兹，我一直都很好。」", "她笑了，因为她知道这是真的。", "★★★★★", "我在秋末初冬时休完假，回到办公室。之后，我便全心投入在学习日语、学习汉字，以及画披头四团员的肖像画上。", "我其实还满会画画的。有一次，一个应该不知道我被为什么被留校查看的新进职员经过我的办公桌，注意到我的画。", "「嘿！你画得真好！这是林哥．史达＊，对吧？」", "「谢谢。对，就是他。」", "「画得真好！你太厉害了，老兄！这画是要拿来做什么的？」", "「老实说，我不太确定……我猜也许是像……创意开发之类的？我正在努力让它看起来像这张照片。」", "我给他看我用来做为参考的原始照片。他露出困惑的表情。", "「是的……但……这是做什么用的？你知道吗？银行要怎么使用它？」", "我没有回话。我对这个问题也感到困惑，于是我们短暂的分享一段亲密且共同的困惑期。过了一会，他点点头，慢慢后退，然后离开。", "几周后，我开始意识到，由于没有实际工作，我有很多空闲时间。因此，在与办公室里所有还和我交谈的人（并没有这样的人存在）开会讨论后，我们一致同意我应该把工作时间缩减至每日一至二小时即可。", "之后，我每天十点左右进办公室，开始学习日语或画画。有时律师会发文件给我，我就用近在咫尺的印表机列印出来，真是太方便了！到了十二点，我就离开去吃午餐，然后直接回家。我最喜欢去神田区的鬼金棒吃辣麻味噌拉面。在烟雾缭绕、光线昏暗、墙上挂著红色恶魔面具的小餐馆里，坐满一边挥汗如雨，一边吃著辣得不得了的拉面的白衬衫上班族。辛辣的拉面会让我的身体感到疲倦，刚好让我回家就能爬上床好好睡个午觉。", "我这么度过好几个星期。到了晚上，我会去会话吃茶屋，周末我则会和一个在六本木披头四酒吧当服务生的日本女孩见面。她长得很可爱，而且不会说英语，不过我的日语却进步许多。她常常来公司帮我付钱的大公寓，总喜欢坐在地板而非沙发上。有一天，她转过身来问我：「嘿，你几乎没怎么在工作，怎么负担得起这个地方？」", "渐渐的，我开始怀疑我是不是找到世界上最棒的工作。", "小节 16", "二○一三年十二月的某一天，凯尔把我叫进他的办公室。我希望他能通知我已经被解雇了，那将会是我赢得的最终胜利。", "凯尔请我坐下，露出他一贯的微笑。以一只老鼠的标准来说，笑得相当美观。", "「你的工作情况如何？」他问。", "「嗯，相当好。我的工作真的很不错。你呢？」", "「是，很好。是的，这样很好。」他收起微笑。「我想问你，你为什么到现在都还没有申请慈善路线呢？」", "「慈善路线？」", "「是的，慈善路线。冰柱说你想申请。」", "「喔！那个慈善路线！是的，确实如此。我非常想申请。」", "「太好了，那么你为何到现在还不申请呢？」", "「嗯，你知道的……我手上还有很多工作要做……」", "「什么样的工作？盖瑞，你现在手头上还有什么？」", "「我不太确定你能理解，凯尔……你知道的，它和创意有很大的关系。」", "他再次微笑，转身面对他的电脑，然后他将文件给我，请我离开。", "正如你可能在想的，我对这个进展感到非常满意。离开的门已经出现，我只要走过去就行了。", "问题是，我想离开吗？", "如今回头看，我能看得出来我那时的身心状况并不健康。严格来说，我活得很压抑，我一直担心自己会被起诉。高阶主管会一时兴起来瞪我一眼；而我，出于理智，不得不屈服，压下我想回瞪的冲动。", "这让我很痛苦，但是，在某种程度上，我当时的生活品质真的挺不错的。我即将交到第一个日本女朋友，我的日语突飞猛进，我在会话吃茶屋里结识许多聊得来的朋友，我还有一张足够让你既羡慕又嫉妒的美食清单。还有，你知道的，耶诞节就快到了。于是我决定先将这事暂时搁置，过一段时间再去想。", "日本人其实并不擅长过耶诞节。他们其实分不清楚耶诞老人和肯德基上校。一群疯子在会话吃茶屋里相遇，吵著要去卡拉ＯＫ庆祝。", "我还是不喜欢卡拉ＯＫ。虽然我满会唱歌的，但我之前太放不开，一轮到我就浑身不自在。我唱完歌，顶著一头傲人白发的六十多岁日本老先生弘，拉我在他身边坐下。", "「你知道吗？来卡拉ＯＫ玩，唱得好或唱得不好其实无关紧要。你的客人玩得开心，才是最重要的。」", "从那以后，我去卡拉ＯＫ时，更懂得享受放开的乐趣。也许，这也是一个能让我受益一生的教训。", "除夕夜，我和会话吃茶屋的一群人一起在午夜到花园神社参拜。", "在除夕的午夜去神社参拜是日本人的固有习俗，即使又冷又黑，神社里依旧大排长龙。许多人穿著传统和服。", "花园神社的旧神社位于东京最大的红灯区歌舞伎町。新宿黄金街就在歌舞伎町，是大家聚集喝酒之处，里面有很多专业小酒吧，它的四周则挤满各种提供酒精、性爱和美食的店面。", "那些酒吧才是我真正学习日语的好地方，尤其是看起来摇摇欲坠，却总是热情好客的「袋鼠非法审判」是我最喜欢的一家。我每次去那里都点日本烧酎加葡萄柚，他们的葡萄柚存货不足，所以我拿到的饮料日本烧酎的比例愈来愈高，直到葡萄柚完全用完，店主只得赶快跑去７－11补货。", "我和会话吃茶屋相熟的朋友们一起在花园神社排队，人龙很长。日本人的除夕夜通常都是全家团圆守岁，所以那天晚上，我们一群聚在神社的人都有一个共同点：我们全是没有家人、被冷落的人。", "轮到我参拜时，我将一枚五日圆的小金币抛进小木盒里，它弹了两下才滑进去。金属撞击木头。我抓牢又粗又重的绳子，用力摇晃，上头的大铃铛发出细碎的叮叮声。我鞠躬，两次，拍手，两次，然后我定在原地，等待。突然，在那一瞬间，我感觉寒冽的空气再次涌入我的肺部。寒冷、潮湿的午夜空气。不过，这一次，却没有带来丝毫的灼痛感。", "「我想，差不多该回家了。」", "直到一月底，我才把所有的文件整理好。老实说，我并不著急。之前提过的一个美国慈善机构提供我工作机会，他们说，我可以在伦敦远距上班，负责撰写关于贫富不均的文章。全球经济继续以缓慢的速度崩塌，一切都是老样子，经济没有成长，生活水准下降。虽然我必须承认，生活在日本让我很容易忘记这些。有时候我不禁在想，不知道银行是保留我的旧交易，还是已经全部获利了结。他们应该保留的，但我猜他们没有。不晓得为什么，离开银行、前往慈善机构的申请文书牵涉到的数量异常多。我费力的完成一切，正式提出申请。", "我等了一个月，才收到电子邮件的回复。", "「你的申请已经遭到拒绝。」", "我猜你看到这里，可能也会产生和我当时相同的疑问。", "「如果打算他妈的拒绝我，为什么还要叫我提出申请呢？」这是一个愚蠢的问题，因为答案显而易见。他们这么做，纯粹是想让我知道我被他们困住。", "他们这么做是为了让我明白，当然，如果我愿意，我可以吃遍他妈的东京所有的饺子。我可以连续几个月在东京都里骑自行车，我可以与当地的披头四歌迷嬉闹，我可以在除夕夜拉响神社的大铃铛，我可以逛完所有历史悠久的圣地。只要我愿意，这些我都能做，但我不能离开。不，我不能回家。", "我需要多长的时间才能拿到全部的钱？还要三年？那时我已经三十岁。不，他妈的。那个该死的男人。去他的。这场争斗的意义到底在哪里？", "我按下一直带在身上的录音笔的红色按钮，然后将它放回口袋，毫无预警的冲向凯尔的办公室。", "「你他妈的在做什么!?」", "凯尔很开心。这几乎让我也很开心。", "「盖瑞！真高兴见到你！我们要开会吗？来！先坐下吧！」", "我坐下来。", "「你他妈的在做什么？」", "「你在说什么？盖瑞？到底出了什么事？」", "「你他妈的怎么会不知道出了什么事！你他妈的在做什么？」", "「我很抱歉，盖瑞，但我不知道你在说什么。我们并没有事先约好今天要开会吧？是不是？你有什么问题吗？到底发生什么事？」", "「为什么拒绝我的慈善申请？」", "「噢，慈善申请！」他微笑，往后靠在椅子上。「我现在明白了，你是为了这件事才来找我的。有什么问题吗？」", "「为什么我的申请会被拒绝？」", "「嗯，等等，我先看一下。」", "他转向他的电脑。我当然看不见他的萤幕。他一边看，一边哼一首我认不出来的欢快曲调。我在想，会不会是日本的曲子。", "「好，我明白了。不幸的是，你想去工作的慈善机构并没有在美国正式注册。它不符合规定。很不幸的，你不能为他们工作。真是遗憾。」", "我们互相瞪著对方。他再度露出微笑。以老鼠的标准来说，相当美观的微笑。", "「我知道你他妈的在做什么。」", "「抱歉，我不明白你的意思。」", "「你骗我，冰柱骗我，迦勒也骗我。冰柱将应该保密的会议内容告诉迦勒，这是违法的。你对此有何看法？」", "「抱歉，盖瑞，我对那些事一无所知。你到底在说什么？」", "「你他妈的很清楚我在说什么，你他妈的心知肚明！你们从一开始就他妈的狼狈为奸，你也知道你们一直在这么做，你他妈的对此有何看法？」", "没有办法。完全没有办法抓住他，激怒他，抓住他的尾巴将他拖出来。他喜欢这样，他绝对他妈的喜欢这样。就像一头猪，喜欢在屎尿中打滚。", "「对不起，盖瑞，我真的很抱歉，但我真的不明白你的意思。」", "他露出堪称美丽的笑容。我发誓那个混蛋开心得差点就眨眼了。", "我无计可施，只能再度回到办公桌前，写电子邮件询问花旗银行人力资源部门对慈善机构的正式定义。他们过三周才回复我。我和我的日本女友在那个周末分手了。在我的生活毫无希望时，我不能再让另一个女孩双眼含泪的看我。我又开始绕著皇居跑来跑去，把身上的脂肪全部减掉，消灭所有该死的脂肪。我把所有甚至不存在的脂肪减掉，将所有不需要的东西全部剔除。", "如果我走不掉，代表什么？我该怎么办？我应该起诉该死的银行吗？我会像过去的圣诞节幽灵一样，在交易大厅里再坐个三年吗？我会变成什么？我会变成什么样子？我会放弃吗？会回头吗？我会变成另一个迦勒？还是像杰拉德．冈特一样变成满头白发的老头？", "我的睡眠时间几乎立刻荡然无存，我再次成为夜行性动物。那时正逢冬末，夜晚依旧很冷，我在寒风和霓虹灯中飞来飞去，骑著脚踏车寻找食物。", "就在那时，警察偷走我的自行车。", "在日本，没有人会偷东西。没有人会他妈的偷任何东西。你可以把钱包扔在地上，三天后再回来，里头的现金一毛钱都不会少。但警察会偷你的脚踏车，所以你最好还是小心点，千万不要把车停在车站前面。", "我向我居住的大楼柜台询问，要如何从警察手中拿回我的自行车。他们给我一个地址，我只好搭他妈的火车去那里。", "到达之后，我见识到世界上最大的自行车违停扣押场。我从来没有见过，甚至无法想像，一个地方能有这么多自行车。一个由自行车组成的世界，甚至可以说是宇宙。在历史的长河中，肯定没有比东京警察更贪婪的自行车窃贼。治安这么好，我想他们还是得找点什么事情来杀时间吧？", "他们带我去牵我的自行车。至于他们怎么知道它到底被放在哪里，只能说是现代工程的奇迹。光是走到放我自行车的地方，就走了十五分钟。", "轮子坏了。我不太确定怎么坏的。我试著想修好它，但它似乎是什么特殊尺寸所以无法修理，只能再订购一个一模一样的。在人生的那个阶段，我拥有那辆自行车的时间比拥有女朋友的时间还要长。它是我唯一从伦敦运来的东西，说它是我的老朋友也不为过。", "我牵走自行车，再次把它留在车站外面，就是我把它弄丢的那个他妈的车站。东京警察！再给你们一个任务，再偷一次吧！然后我去一家老旧的二手自行车行。它在代代木公园后方一个安静的住宅区，很靠近迦勒的家。老板是个走路摇摇晃晃的驼背老男人，我用日语请他让我看一下店里最便宜的自行车。", "他带我去看一辆颇具喜感、被日本人暱称为「淑女车」的黄色小脚踏车，车篮和车铃在出厂时就已安装在上头。我试著拨一下车铃，声音有点破损。然而，我们又有谁是完好无缺的？我问他多少钱，他说五千日圆，以当时汇率，大约是三十英镑。我付完钱，将它骑回家。毕竟人生难免有失去老朋友的时候。", "二○一四年春天。在盛开的樱花之中，我迎来世界上速度最慢的电子邮件战争。", "花旗银行花上三周才告诉我他们对于慈善机构的定义。我几乎可以肯定，我选的慈善机构完全符合这个定义。我必须把所有相关文件一部分、一部分的剪贴在一起，使这个事实变得异常明显，然后将它们寄回给凯尔．齐默尔曼。他拖一个月都没有回复我。然后，他给我的理由是，我在第二份申请中的第一页和第三十六页之类的，签名签错了地方。", "我非常清楚他们在做什么，而且也明白这个过程可能会拖得非常久。我在想，不知道这种情况会不会永远持续下去，他们是否会继续付钱让我坐在冈特部门的角落。樱花开始逐渐凋落。", "我的精神状态恶化得相当快。自从和冰柱会面，她告诉我没有什么可以阻止我离开时，我觉得我抓到逃生绳。我确实不知道它有多坚固，但我一直都知道它就在那里。有这样的保证，我感觉自己经过很长一段时间以来第一次可以远离狼群，稍微喘口气。但是现在我又回到交易大厅，而且我似乎怎么找都找不到出口。", "尽管没有什么事情可做，我待在办公室的时间却比以往更长。我的精神紧绷，无法继续享受学日文或画画的乐趣。于是只要一空下来，我就去跑步。树上的樱花全部凋谢，东京再一次进入梅雨季节。", "就在那时，花旗银行采取下一步行动。他们取消我的住房津贴。", "自从我搬来日本后，我的房租一直由花旗银行支付。对于在日本工作的银行业外籍人士来说，由公司负担房租很正常，而且理论上高额的住房津贴，加上我仍在领取的高薪，应该是我当初愿意接受外派的巨大诱因之一。", "我很喜欢这户从阳台可以看到墓地的公寓，也喜欢它顶楼供应梅干饭的餐厅。如果我趴在阳台，将身子探出去，用力转头，甚至还能看到东京铁塔。至于位在四十二楼的餐厅则是观察人们的好地方。我曾经看过一位美国银行家花一小时和一对日本夫妻谈论小说《白鲸记》，这对夫妇自始至终都没开口说一句话，只是不时的点头应和。银行家走出去时，脸上带著灿烂的笑容，还姿态悠闲的向我颌首致意。然而，我的视线穿过他肩膀上方，却看到那个在他身后的日本人正张开双手，痛苦的抱住自己的头。", "晚上的餐厅通常很空。在烟火绽放的夏季，我有时会独自在幽暗的餐厅观看远处东京湾上空的绚丽烟火。", "我猜，以后大概看不到烟火了，这里的租金真的很贵。如果银行不支付，我又不愿继续待在这个行业，我大概只能付得起两个月的房租。到这时，我知道我已经完蛋，而且极有可能未来很多年都无法再正常工作。我开始盘算如果我的健康状况再也无法恢复到可以工作，甚至一辈子都不能再工作时，要怎么分配我的钱。", "我有一个朋友，来自离我家乡不远的埃塞克斯郡罗姆福德。他从儿时就立下志向，长大后要当电影《超级战队》（Power Rangers）里的替身演员。为了实现梦想，他毅然决然的搬到日本。他在韩国人聚集的新大久保一户破旧公寓里分租一个破旧的房间。那个地区可以算是东京市中心的贫民窟，不过至少离他工作的英语会话吃茶屋很近。我发简讯问他，能不能收留我睡在他家的地板上。他回复我：「好，当然可以，老兄。没问题。」", "我在想，不知道花旗银行是不是会继续使出这类的手段打击我，想让我受不了，决定放弃，自行离开。好吧！我想，就让他们打击我吧！我不会放弃的。反正我也不是没遇过他们这样的人。", "小节 17", "在那之后，天气非常热，非常潮湿。而我开始，再一次的，变成疯子。", "我厌倦被动等待，于是我决定尝试一些新玩法。", "我开始发送电子邮件。每天给不同的人写信。给很多人写信。我发给首席执行长好几次电邮，全球人力资源主管也是我的收信人。这些战术并不是我的律师团的提议，也没得到他们的批准，只不过是我自己的小小创意。", "我不太记得我在这些电子邮件里写些什么。有时候，我会自行编造一些时髦且创新的暱称来称呼对方，或者含糊的提起一些隐秘的事。有时候，我会具体谈论迦勒、冰柱和凯尔．齐默尔曼所做过的行为。有时候，我会不怀好意的暗示那些事情如果出现在报纸上，会让银行陷入丑闻。其他时候，我会尝试以轻松的态度，写一些幽默的轶事，或是介绍及评论食物。在我晓得全球人力资源主管是摩门教徒后，我甚至会在给他的电子邮件中穿插摩门教经文的摘录。我觉得这是个可以拉近双方距离的好方法。", "这么执行两周之后，在夏季最炎热的日子，凯尔．齐默尔曼把我叫进他的办公室。", "我知道凯尔．齐默尔曼见到我的时候会表现得很开心。他向来如此。", "到了此时，我对凯尔的办公室已经非常熟悉，我注意到他的办公桌上多一张全家福照片。我现在可以看得出来，凯尔和杰拉德一样，都娶了日本太太。他有三个孩子，我猜，一定有一半的日本血统。进到办公室后，我弯腰，仔细看著这张新照片，看了很久很久很久。然后，我才抬头望向凯尔。", "凯尔看起来和以前不同。他一如既往的微笑，只是这一次和以往只有嘴巴在笑不同，这一次他的笑意直达眼底。这不太对，完全打破常态。凯尔．齐默尔曼是被鬼附身吗？", "如此不寻常的样子迷惑我，我在他办公桌前坐下，好一会儿，我们都没开口，只是看著彼此。", "然后，我们进行一次很长的谈话。经过那次谈话后，一切都变了。", "不管是在故事中或是在现实生活里，有时会发生一些我们说不出口的事。我们都知道，它们发生在你身上，也发生在我身上。", "发生这种情况的原因很多。也许是因为我们不能背叛他人的信任，也许想保存爱人或非常亲密的朋友所留下的记忆。也许牵涉的感情对我们来说太过深刻，无法言说，不能被提及。", "有时候，我们不能说的原因和情感无关，而是理性的抉择。这就是为什么当年我拿到四十万英镑的分红，却对妈妈只字不提。", "然而，还有其他的时候，不能说的原因不在自身，而在环境。有时候，社会将我们的名字写在纸上，然后把纸揉成一个球，塞进我们的嘴里，让我们什么都不能说。", "发生在我身上的是哪一个？是其中之一吗？", "我不能告诉你这个问题的答案。对不起，真的，我很抱歉。我想当我们割断绑住我们的绳子时，有时也会误伤自己，割破皮肤。", "我永远不会忘记在那次面谈结束时，凯尔看起来有多开心。不是装出来的开心，不是表面的开心，而是发自内在的、很真挚的、很真诚的开心。他和我握手，我在他脸上看到仿佛父亲为儿子感到骄傲的自豪。", "我心想，去你的，你就是一只该死的老鼠。你就是一只和我一样该死的老鼠。", "然后，就这样，我自由了。", "小节 18", "我是怎么赢的？我是如何赢得这场战争的？", "我很想告诉你，是因为我是个疯子。因为我很聪明，因为我很勇敢。更进一步的说，因为我独一无二。因为我很有创意，个性狂放。因为我挣脱束缚我的人为限制，决定彻底的疯狂一回。", "可是，其实我不知道正确答案，而且上述大概也都是错的。", "在我获得自由的前一周，就在我向花旗最高管理阶层疯狂发送电子邮件的同时，鼻涕虫被解雇。我不确定为什么，但我喜欢将自己想成原因之一；不过，同样的，这个想法也可能是错的。", "多个可靠的消息来源告诉我，鼻涕虫在被解雇后，还安排一场与花旗银行全球销售及交易部门所有员工的视讯会议，他在其中表示衷心感谢大家为他完成的工作。然后，在那之后，就在那场视讯会议里，当著所有人的面，他情绪崩溃，泪流满面。每一个高阶主管都参加这场会议，几乎没有例外的每个人都讨厌他。他就那样当著所有人的面，擦去他眼里那滴冰冷而悲伤的泪水。", "虽然鼻涕虫被开除和我的彻底发疯是两个独立事件，但是当它们合在一起之后，我有些搞不清楚赢得自由的人到底是谁。是我吗？还是鼻涕虫？", "在和我开会时，鼻涕虫向来表现和善。因此，我或许太过天真的以为，是迦勒，而不是鼻涕虫，宁愿每年付我十二万英镑，外加住房津贴，也要将我留在银行。除了公开羞辱我外，没有任何其他原因，也许只是为了阻止我从他手中溜走逃脱。", "可是也许我猜错，也许从来都不是迦勒；也许全是一出戏；也许想要留下我的是鼻涕虫，毕竟他一离开，迦勒就立刻放了我。", "我不知道。我永远都不会知道。我永远都不会知道我到底是怎么赢的。", "但事情就是这样，不是吗？你永远不知道运气占的比重是多少，真正靠实力的又是多少，不是吗？比如，如果一九六六年那个俄罗斯巡边员（他根本不是真正的俄罗斯人）没有判定进球有效，英格兰就永远不会赢得世界杯。也许，如果和我同一个医院出生的约翰．泰利没有在莫斯科举行的欧洲冠军联赛决赛中失利，艾林．格兰特就会是世界上最伟大的教练。也许，如果伊尔福德县立高中在二○○二年十月那天决定向警方报案，我就会留下犯罪纪录，我就会成为那些没有选择只能在街角贩卖毒品的男孩之一，这本书的故事根本不会发生。你永远不会知道的，不是吗？运气占的比重是多少，真正靠实力的又是多少？", "也许我确实打败花旗银行；也许我靠的是智取；也许我真的在这场比赛中表现出色；也许和上述说的都没关系；也许我只是不停的挨打，倒下后又站起来，像英俊的保罗．纽曼一样。如何知道我们的哪些胜利和哪些失败，是因为运气，还是因为实力？", "交易也是如此，不是吗？当然，我在二○一一年和二○一二年透过押注全球经济崩溃，预测普通民众、一般家庭的生活水准会缓慢但持续且必然的下跌，全球数亿家庭不可避免的陷入贫困之中，因此赚了大钱。后来这些不幸也确实全在现实世界里发生，但是，说到底，这是否表示我就是对的？", "当然，我后来几乎每一年依旧持续下注在同样的预测上，从我的沙发，从我的卧室，直到现在，直到二○二三年；当然，我预见的景象也确确实实持续在发生，每年陷入日益恶化的贫困之中的家庭愈来愈多，付不起房贷，无法养活自己的孩子。然而，这是实力，还是纯粹的运气？", "我们不知道，不是吗？也许我们永远都不会知道。在这种情况下，我们该怎么办？我们是让它发生，还是阻止它发生？我们会不会闭上眼睛说，这只是一场游戏？我们是否会告诉自己，全然取决于运气？", "毕竟，那些心胸狭窄、穿著考究、口音高尚的富裕经济学家也相信自己是对的。当他们告诉大众情况会好转，目前的问题只是暂时的时候，他们和我一样充满信心。当然，自二○○八年以来，他们每年都错了，当然，即使他们错了，他们和他们的阶级却在这段期间变得愈来愈有钱，所以，这难道不是纯粹的运气吗？", "永远没有办法知道，不是吗？谁是对的，谁是错的，或者我们应该做什么，或者我们是否应该改变。我们只能等待，看看接下来会发生什么事，不是吗？", "亚瑟说我们什么都不能做，说不定他也是对的。嗯，但是他可没说，你什么都不可以做，不是吗？我们还是可以做点什么，你也可以。我们可以下注。我们可以赌世界末日即将来临。我们可以赌利率将永远低于通货膨胀率，赌经济会一直崩溃下去。房地产价格、股票价格和黄金价格将会上涨，使有钱人变得更有钱，但薪资却停滞不前。若以实际价值来看，经济自然会支撑不住。我们可以那么做，不是吗？所有人都可以那么做。如果我们那么做，我们所有人都可以因为下这样的赌注而致富，不是吗？我们不能吗？只要我们够幸运，所有人都可以从世界末日里获利。只不过，还是无法阻止它发生，只能眼睁睁的看著它崩溃。", "你知道吗？我小时候有个朋友，他没有爸爸，只有妈妈，而且他家比我家穷很多。为了让孩子能吃得上饭，他的妈妈经常不吃饭，她认为我的朋友和他的姐妹们不会注意到，但他们还是注意到了。我知道。因为他告诉过我。", "我不知道，我想，游戏就是那样。有时你会赢，有时你会输。而且，你知道的，还有什么事比赢更重要呢？我不知道。我什么都想不出来。", "小节 19", "我告诉凯尔，再给我两周的时间。", "我不知道为什么我会开口要求那两周。我猜，大概是因为我还没有准备好。我不知道我会在那一天突然就赢了，就自由了。我需要一点时间来接受这个事实。", "在那两周里，我每天都去上班，依照我的合约工时，朝九晚五的待在办公室里。", "我为什么这么做？我不确定。我猜，我只是想多听一点交易大厅的声音。当然，东京交易大厅不是我的交易大厅，不是我打出名号的交易大厅，也不是我做梦时会看到的交易大厅。", "尽管如此，它仍然是一个货真价实的交易大厅。人们在这里相互竞争，试著赚大钱，试著做出正确的预测，试著比同事表现得更好，买下没有门但有旋转墙的大公寓。然而，他们所有的梦想却无法在这里实现。虽然如凤毛麟角般稀少，但是在这里，还是有年轻人可以从一无所有，一跃成为世界上最优秀的交易员。然后，那些有钱的老男人和富家少爷们在年轻人走向厕所时，都会盯著他看，在心里怀疑：「看看这家伙，穿著一件 Topman 平价连锁店买来的愚蠢衬衫。他到底有什么是我没有的？」", "而且，你知道吗？正如我们刚才说过的，也许他们是对的，也许这一切真的单纯只是因为我运气好。", "有时候，你知道的，我会希望真的只是因为我运气好。天知道如果不是的话，世界的未来显然并不美好。", "然后，我在交易大厅的最后一天终于来临。我不必向很多人道别。我去找弗洛伦特．勒博夫，两个人就他最近的艳遇说笑几句。他说下次回伦敦时再联系我，但从那之后我就再也没听过他的任何消息。", "我去找午餐鉴赏家，聊最近午餐吃过的东西，他们说：「喔，盖瑞，你的日语说得真好。」", "最后我去找孝介，告诉他，我非常感谢他为我做的一切。他微笑著抬手，在自己鼻子前面挥了两下，用日语回应「没事的，没事的」。从那之后，我再也没见过他。", "没有掌声送我走出交易大厅。不过，这一次我却停下来回头看了一眼。再看最后一眼。", "小节 20", "我离开大楼，打开我拴在河边一根灯柱上黄色小脚踏车的锁。我放下包包，解开条纹白衬衫的扣子，脱下它，把它揉成一团，放进包包里。天气非常非常炎热，我拿出一件巫师刚来日本
