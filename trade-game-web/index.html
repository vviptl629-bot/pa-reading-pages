舒适的靠在大转椅上的鲁伯特，心里想著不知道他的孩子是否真的全是男孩。毕竟这是几年前的事，他现在说不定真的有了孩子。我想知道他们是不是全部男孩。我希望他们一切都好。", "史宾格勒失踪的第二天，鲁伯特邀请我出去和他一起吃午餐。", "我突然意识到，鲁伯特这么做可能是为了向我解释发生什么事，为什么他选择搞死史宾格勒。他当然知道，在某种程度上，我和史宾格勒关系密切，我甚至短暂考虑过他是不是打算道歉。但鲁伯特没有道歉，也没有解释任何事情。相反的，他这么做……", "鲁伯特想去一家位于犬之岛西岸的昂贵西班牙餐厅吃饭。犬之岛是在东伦敦金丝雀码头附近、被泰晤士河环绕的巨大圆形半岛。意味著我们无法搭乘火车或计程车前往，而是得在摩天大楼下行走。那天的天气很晴朗，不过由于是十二月，我们走路时几乎没有阳光照射到地面。", "我们在步行时，鲁伯特没对我说任何话。这并不罕见。鲁伯特和我在一起时，不管是在什么地方，只有在鲁伯特想说话时，我们才会说话。而且这种时间通常不太多。", "突然鲁伯特开口对我说话，不过既没转头，也没停下脚步。", "「盖瑞。你知道吗？当你第一次进银行工作时，我们曾经像这样走过金丝雀码头。我记得那时候的你还会一边走，一边抬头张望，眺望高楼。」", "然后，他不再说话，也没有问任何问题。他的话像一阵烟雾般，悬停在我面前。", "我以无关紧要的评论填补沉默，过了一段时间，他才继续自己刚才的话，仿佛我什么也没说。「你不再这么做了。你不会再抬头眺望摩天大楼。」", "他再一次的没有提出任何问题，这次我只是静静等待，最后他说：「你知道吗？这个地方，就像《瓦特希普高原》一样。你在这里看到的唯一人类就是幸存者，失败的人不会出现在这里。」", "我心想，「《瓦特希普高原》是他妈的什么东西？」我回家后查了一下，那是一本又名《兔子共和国》的书，讲的是野兔寻找新家的故事。", "我们之后沉默好一会儿，两个人只是并肩，冒著寒气前进。最终我们将摩天大楼甩在身后，终于有一点阳光照射到我们身上，然后，落到地上。", "「你知道的，盖瑞，我有一个心理问题。」", "这并不像鲁伯特平时会说的话，我听到后颇感惊讶。他没有看著我，而是看著前方和上方，望向天空。", "「每次我认识一个人时，」他继续说：「我必须立刻知道他们是比我好，还是比我差，在我见到他们的那一刻，我就想知道。」", "我没有开口。我们一边走路，我一边看著他。我真的很想知道他接下来会说什么。", "「然后，如果他们比我优秀，我就会恨他们。我恨他们，只因为他们比我优秀。」", "然后，他停顿一下。", "「但如果他们比我差，那么，我就鄙视他们。这样甚至更糟。就因为他们比我差，我就鄙视他们。」", "我没有对此做出任何回应。毕竟，我也想不出我能说什么。我们一起走到犬之岛的西端，抵达那家临河的昂贵西班牙餐厅，然后，在那里一起吃了一整头的小乳猪。", "小组其他成员随后多少表示不满。除了我，或许还有ＪＢ，剩下的人都不太喜欢史宾格勒，但每个人都知道鲁伯特所做的事是错的。你不应该直接搞死这样的人。至少，在举报之前，应该先拿出来讨论。", "事实证明，鲁伯特甚至没有先和迦勒打声招呼。他越过迦勒，直接去找迦勒在纽约的老板──一个如果不发出极大的声音就无法呼吸，所到之处都留下银色痕迹，体型如巨大鼻涕虫的男人。鼻涕虫一周前刚好到伦敦出差，鲁伯特直接找他。这意味著没有人可以为此事说上话，甚至连迦勒也不行。ＪＢ不行，比尔不行，当然史宾格勒本人也不行。", "空气中满是不安的氛围，和交易大厅里每年这个时候总会浮现的另一个大问题纠缠在一起。这个问题在不久的将来会成为我生活中的主宰。一个不容忽视的大问题。", "你想拿到分红吗？", "在当时的交易大厅里有许多疯狂的事情，其中最疯狂的事情之一，就是银行付给交易员的报酬计算方式。", "那一年，比尔和洪哥各为银行赚超过一亿美元，其他几个人也相差无几。但是除非你真的能拿到分红，否则这些数字并没有任何实际意义。我确信这些人的薪水比我高许多。虽然我真的不知道，但我猜测他们的年薪大概有七万至八万英镑。可是即使比这个数字还多几倍，和一亿美元相比，也是太少。", "那么，帮银行赚了一亿美元，你能得到多少分红呢？我完全不知道。这些数字比 STIRT 小组上任何人之前赚过的都要多，所以我猜想，很可能没有人知道。", "甚至连有没有分红都没人能确定。你还记得我在史宾格勒晚宴上认识的西蒙．张吗？三年之后，他成为汇丰银行中最赚钱的交易员。可是在分红奖金应该发放的时候，银行没有付他任何钱，只是俐落的将他解雇。", "这种情况不可避免的制造不少紧张气氛。每个人帐户里的 PnL 数字都非常庞大，比他们之前为银行赚的钱全加起来还要多上十倍。但没有人知道他们能拿多少钱回家。每个人都在问这个问题：我们能拿到分红吗？", "你是否能拿到分红，以及你到底会拿到多少分红，牵涉到的许多影响因素似乎都相当神秘。我知道这一点，是因为交易员们总是将它们挂在嘴上。当然，显而易见的，我们小组表现得很好，可是更明显的事实是，这一年内银行整体表现不佳。这当然会是一个影响因素，而且是看起来很负面的影响因素。", "许多人为因素也牵涉其中。高阶管理人员和各交易小组之间的关系如何？鼻涕虫决定分给迦勒多少钱后，迦勒再分配给下面的人。那么鼻涕虫是怎么想的？他喜欢我们吗？他知道我们叫他「鼻涕虫」吗？但愿他不晓得。这就是迦勒大部分时间不在交易大厅的原因。他必须讨好鼻涕虫和其他大人物，这就是能让我们所有人拿到分红的方法。没有人比迦勒更擅长拍马屁。没有人比他更适合这份工作。", "不过，鲁伯特和史宾格勒的纠纷显然不会为我们加分。", "每个人都在谈论这件事，永远的热门话题，但没有人谈过具体数字。交易大厅里有个奇怪的惯例：没有人会告诉你他们实际拿了多少钱，绝对不会。我一直以为说了可能会被解雇。这不是开玩笑。所有的毕业生都认为告诉别人你的分红奖金是多少，便足以构成被解雇的罪行。直到多年之后，我才发现事实并非如此。但这表示我对它们一无所知，我甚至从未想过我为银行赚的七十万英镑会为我带来任何报酬，因为比尔的 PnL 至少是我的一百五十倍以上。", "当然，我还是希望他们都能拿到分红。如果他们今年拿到分红，代表我明年就会拿到分红。", "然后，突然间，就在我们紧张的等待分红日到来时，史宾格勒一声不响的回来了。", "迦勒并不特别喜欢史宾格勒，没有人特别喜欢他。但是迦勒绝对不会让鲁伯特就这么越级告状成功。他一定在鼻涕虫身上撒了一些特制的魔法盐。于是，有一天，史宾格勒在没有任何预警的情况下回来，带著羞涩的笑容，摇摇晃晃的走向我们的位子。", "迦勒没有提前告诉任何人史宾格勒要回来，或者至少他没有告诉我，我很确定他这么做单纯只是想看看鲁伯特会有什么反应。ＪＢ看到史宾格勒出现时，很开心，他跳起来，抓住他的肩膀，拍打他的侧脸。比尔大笑出声，史努比忍著不敢笑。我和每个人一样，试著偷偷观察鲁伯特。他像个木头人似的，一动不动的坐著，眼睛直视前方，一只手放在键盘上，一只手放在滑鼠上，脸上没有任何表情，但他的衬衫领子紧到快被撑破。不到两个月，离开的人变成鲁伯特。我在想当时的他是否早有预感。", "然后迦勒继续去为每个人争取分红。", "小节 6", "分红奖金通常在一月下旬发放，被视为是那段日子里唯一重要的大事。虽然英国后来通过法律，限制分红奖金只能为年薪的几倍，导致银行大幅调整交易员的年薪，据我所知，分红奖金日的戏剧性和重要性在那之后便下降了。不过在当时，二○○九年初，它仍是一个令所有交易员疯狂的宗教活动。", "发放分红奖金当天，每个小组主管都会分配到一间小型会议室，然后他们一次指定一个交易员进去。STIRT 小组的交易员一一进去和迦勒面谈，出来后再回到我们的办公区。当然，在他们重新出现时，每个人都会试著观察他们的身体语言，找寻线索。", "为了叫第一个交易员进去，迦勒拿起会议桌上的电话打给服务台。当时，我的职责之一是接听所有打进我们小组的电话，不过这个任务对我来说有点小问题，因为没有人听得懂我的「花旗」发音。在分红发放日那天，我有幸成为目送第一个交易员进会议室见迦勒的那个人。他先选比尔。", "当比尔回到办公桌时，我无法强迫自己去看他。我不知道为什么，但我就是不能。比尔回来后，他叫洪哥进去；洪哥回来后，他叫鲁伯特进去；鲁伯特回来后，他叫史宾格勒进去；就像这样，交易员一个接著一个，按照 PnL 的降序去小会议室报到。", "我无法强迫自己看向他们其中任何一个。我不知道我为什么会这么关注。我知道，今年的分红与我无关，但我还是觉得恶心。", "当最后一个交易员史努比结束面谈后，他走回来，然后，他叫我进去。我没想到我会被叫进去。", "迦勒分派到的房间位于交易大厅深处。这里不是迦勒平常的办公室，我花了一点时间才找到位置。我一走进去，就先惊讶的注意到这间只有人工照明、没有窗户的房间是多么的黑暗和压抑，和迦勒灿烂的笑容和闪闪发光的眼睛完全不相称。", "闪闪发光，没错。迦勒很开心。很明显的，他要告诉我的是好消息。", "他示意我坐下，然后把一张纸推过桌面。一万三千英镑。我并未抱持任何期待，因此惊讶极了。", "一万三千英镑是很大一笔钱。我知道。可是我不记得当时心里有任何高兴的感觉。老实说，我根本不记得有什么感觉。我只记得房间好暗，还有迦勒脸上的微笑。", "奇怪的是，在那一刻，在那个狭窄阴暗的小房间里，我想起自己因为出售和吸食大麻而被学校开除的那一天。我刚满十六岁，学校打电话给信教非常虔诚的父亲，请他来接我。在回家的路上，他什么也没说。我当时神志恍惚，只是木然看著车窗外的房子飞驰而过，他转过身来，问我一个问题。", "「感觉如何？」", "我直截了当的回答：", "「感觉很好。」", "那天晚上，半夜，我醒了，看见同样虔诚的妈妈坐在我睡的双层床的下铺床尾哭泣。", "我看到她坐在那里时，心想的是：「妳哭什么？要解决这个问题的人是我。不是妳。」", "当迦勒给我一万三千英镑时，我也是这么想的。", "发放分红奖金后，发生了两件事：第一，我拥有属于我的第一本帐本。那天，在拿到奖金后，ＪＢ立刻带我去小星巴克喝咖啡。他告诉我，他看到我的优秀表现，注意到我的进步，他想将纽西兰币的帐本移交给我。", "纽西兰币的帐本，更准确的说，纽西兰币换汇交易帐本，是一本垃圾帐本。他知道，我也知道。它是小组里最糟糕的帐本。但在某种程度上，这仍然是一件大事，我认为它代表肯定我的能力。", "第二件虽然不是什么大事，但却一直让我记在心里。ＪＢ和迦勒坚持我必须为我的父母准备一份礼物，「款待」他们。", "根据他们的说法，因为我拿到人生的第一笔奖金，这是我一定要做的事。", "在我的一生中，截至那时，从来没有买过任何礼物「款待」任何人，甚至连自己也没有。我完全不知道该买什么。", "于是迦勒问我：「你爸爸喜欢什么？」", "我告诉他：「我猜他喜欢足球。」", "这就是为什么我订阅天空体育频道送给老爸。在那之后，我会利用原本周六我、老爸和邻居哈利一起去看东方队比赛的时间，去伊尔福德健身中心做重量训练。当我出门时，我爸爸就会坐在沙发上看英超联赛的现场直播。这可是我们一生中从未做过的事情。我会问他比分是多少，然后推门离开。", "一年后，在搬出家里那天，我取消订阅天空体育频道。", "我不怎么在乎那一万三千英镑，也不关心天空体育频道。我有点在乎纽西兰币帐本，但也只是一点点。我唯一真正关心的，或者说我真正非常关心的，是我赚到的那七十万美元，以及我是多么容易就赚到它。如果我这样就能赚到七十万美元，我当然可以赚到七百万。这，就是我的下一个目标。", "就在这时，哈利的妈妈过世。我其实不记得是谁将消息告诉我的。有人打电话通知我。是打来银行？还是打来手机？我猜应该是我妈妈。", "哈利和我在同一条街上长大。他比我小四岁。在我的脑子里，一直将他当成十岁的孩子，可是他那时已经快满十八，身材魁梧，肩膀肌肉强壮，脸颊红润，只要一有空，他不是在踢球，就是在喝啤酒。", "当我们还是孩子时，他和有一头漂亮棕色卷发的律师妈妈住在一起。他家和我家之间隔著七户人家。从他四、五岁开始上学后，我妈妈就开始帮忙照顾他。他放学后会和我们一起回家，等他妈妈晚上下班时才来接他。", "我没有弟弟，哈利就变成我的弟弟。我从小就一直很喜欢电玩游戏，但我的父母永远买不起游戏机之类的东西，所以当哈利的妈妈买了一台 PlayStation 给他，却不知道如何安装时，我便成了去他家搞妥一切的人。从此之后，我们几乎形影不离。每个晚上不是在他家玩 PlayStation，就是在街上踢足球。", "哈利家和我家的大小、隔间完全一样，除此之外，两家没有任何相似之处。他家只住了他们母子，感觉安静，我家却总是拥挤得不得了。他妈妈向来理智和平静，我妈妈却总是行事粗鲁，言语疯癫。有时候，她会问我愿不愿意留在他们家一起吃晚饭，因为她做了好吃的义大利面肉酱。我们吃饭时她会拿著一个大玻璃杯喝红酒，然后谈论她看过的书。", "我很早之前就知道她得癌症，可是不知道为什么，我从未想过她真的会死。或许哈利也是这么想的，我不知道。但我同样有一头漂亮棕色卷发的妈妈却告诉我，事情发生时，哈利哭了。我听到时非常生气，因为我觉得这不是她应该说的话。", "我站起来，告诉迦勒我有事必须先回家。我没有给他理由，但他只是看著我，点点头，意思是：「好，你回去吧！」", "哈利和他爸爸的关系很疏离，所以葬礼上坐在他旁边的人是我。他的衬衫顶端有两颗扣子扣不上，他系了一条又宽又大的橙色领带将缝隙遮住。他没有哭。我不知道他之后要去哪里，但他搬到埃塞克斯，和父亲一起住。", "我和ＪＢ谈过，我和鲁伯特谈过，我和比尔谈过。我一次一个的和他们每个人谈，告诉他们我不知道哈利的未来该怎么办。他们都认识他，因为他每周都和我们一起踢足球。他们都喜欢他，因为他是那种优秀的足球员，在他可以射门的时候依旧会将球传给你，总是笑脸迎人，随时准备好和你嬉戏打闹。", "当哈利下一次来和我们踢足球时，小组的每一个人都轮流上前和他说话，一次一个。我记得我看著鲁伯特一只沉重的手搭在他的肩膀上，和他说话，脸上流露出真挚的接纳及深切的关心，我希望这就是哈利需要而我却无法给他的。直到那时，我才注意到哈利已经长大，不再是十岁的孩子。我在想，不知道我们能不能从这里开始，继续在往后的人生中一起前进。", "我不知道是谁安排的。是鲁伯特？ＪＢ？还是比尔？总之，他们之中一个为他找到一份经纪人的工作。", "哈利就这样加入我的游戏。", "在哈利入行时，鲁伯特却走了。也许真的很像《瓦特希普高原》的剧情。", "自从鲁伯特试著搞死史宾格勒却失败后，他的好日子也到尽头了。迦勒下定决心要找他麻烦。", "可是迦勒却找不到弄掉鲁伯特的高明办法。鲁伯特太优秀了，很难对付。鲁伯特完全知道如何擦干净自己的屁股。于是迦勒玩了一招明升暗降，这是金融城的经典操作：有一份新的工作机会，只不过在很远的地方。你不想去吗？不，你不懂，你必须去。", "迦勒为鲁伯特找到一个地理位置远到不能再远的新工作，他把他扔到澳洲去当雪梨分公司 STIRT 小组的新负责人。", "我并不知道鲁伯特是否真的想去，但他最后还是去了。至少他摆出一脸很勇敢的样子。他告诉我，这对他的职业生涯有好处，而且那里离拉斯维加斯很近。", "我查看地图，发现事实似乎并非如此。", "鲁伯特的离开意味著每个人的晋升。ＪＢ晋升为资深欧元交易员；史努比晋升为初级欧元交易员；洪哥得到ＪＢ的旧工作──澳币及日圆交易员。每个人都升职，拿到新的帐本。对我则没影响；不过，史努比接手欧元后，我终于实现渴望已久的心愿。我可以搬到比尔旁边的位置。", "然后，震撼弹毫无预警的爆开。它应该算是我交易生涯中遭遇的第一次巨大冲击。", "我完全没想过会发生这种事。你知道的，迦勒才二十九岁。某一天，他在小组刚进入全天最忙碌的七点半时突然站起来，带领整个团队离开办公区，走向角落一间小会议室时，我当时真心以为一定是有人死了。", "我已经搬到比尔旁边的靠窗角落，迦勒正领著一串交易员离开办公区，所以在我急忙吞下咖啡，摘下耳机要起身追赶时，不是迦勒，而是ＪＢ阻止我。他转身对我大喊：「你不必，盖瑞，必须有人留在这里。」", "所以我只能站在原地目送他们离开，心里想著，「他妈的到底是怎么了？」", "可是我没有时间多想，因为史努比的扬声器开始哔哔叫，然后是洪哥的，然后是史宾格勒的，然后是比尔的，我在它们之间跑来跑去，用欧元、日圆、克朗或英镑计算价格，然后按下每个不同经纪人的开关，向那些我现在全都认识的人提供报价。那一刻我感觉自己就像足球中场明星罗伊．基恩或史蒂文．杰拉德，站在场中央组织整支队伍的行动。我不时对自己喊话：「我办到了，我办得到，我可以的，我都弄懂了。」", "然后，我又想，「真该死，我一个人就能完成所有的事，也许我不需要其他人。也许这里只需要我、史努比和比尔……」", "我全神贯注的在各个扬声器之间跳著狂野的舞蹈，以致没注意到所有的交易员鱼贯的回到办公区。比尔狠狠的在我肩膀上打了一拳，打得我的蓝牙耳机都从头上掉下来。他对我大喊：「迦勒要走了，那家伙他妈的辞职了！」", "迦勒要走了。才二十九岁的迦勒要退休了。迦勒已婚，不久前才喜获麟儿，打算在美国加州建造一栋大房子，和他的家人开心的在那里度过余生。对他来说真是棒极了，我想。", "可是，对我来说代表什么？", "我的第一个想法，当然，是担心。", "迦勒是决定雇用我的人。迦勒是我的主要赞助者。迦勒向我保证，我从入职的第一天就能进行交易。我依然只有二十二岁。以我这样的年纪和经验，上司允许你拥有自己的交易、拥有自己的 PnL，是极不寻常的待遇。如果新老板不遵守这些协议，我该怎么办？", "下一个问题是，接任的新老板会是谁。会是小组里的某个人吗？还是从外面聘来的人？比尔是全银行去年最赚钱的交易员，理所当然的会得到这份工作，但我们都知道他不会接受。比尔讨厌上头的高层，也无意隐瞒他的厌恶，他只想做交易，升职意味著他得花费更多时间和人周旋，得到更少的时间交易。那不行。不，比尔不可能接受。史努比确信，如果比尔不接受，他们就会把这职位送给纽约鼻涕虫手下的交易员，一个外型像青蛙的可怕家伙。", "当然，这件事带给我的新讯息并不只是迦勒的离职。迦勒才二十九岁，他要走了，要去北加州盖一栋属于自己的大房子，之后也不打算再工作。这家伙他妈的到底赚走多少钱？我知道前一年我们小组赚很多钱，总共大约五亿美元，但我从不知道这种事情在现实中是可能的，甚至无法接受居然有人二十九岁就离职、退休。到底是什么意思？", "我和迦勒共吃过两次送别宴。其中一次在我和鲁伯特吃乳猪的那一家西班牙餐厅，整组人在五月初的黄昏阳光下一起出发，食物异常丰盛。", "天气渐好，景色很美。阳光中再次带著暖意，太阳下山的时间愈来愈晚，餐会上满是欢乐的庆祝气氛。每个人都为迦勒高兴。迦勒的美梦成真。", "交易大厅里的交易员们时常将离职挂在嘴上。他们常说：「我明年就走，拿到下一次分红奖金后。这些混蛋不值得我卖命，我明年就走……」", "但没有人真的会走，除非他们被迫离开。", "交易员谈论著他们想在山上或海边建一栋房子，谈论他们想在乡间享受家庭生活。可能还单身的年轻交易员则谈论旅行，谈论如何骑自行车游印度，如何驾游艇前往智利。", "可是，从来没有人真的实现过。", "然后迦勒出现了，他就要走了。二十九岁，依然年轻，依然英俊。他的头发尚未脱落，甚至没有一根白发。他成为大家的英雄。他正在做每个人都想做的事情，而且还是在没有得罪任何人的情况下。嗯，至少他没得罪任何我喜欢的人。", "我们坐在一张长方形的餐桌周围，数不清的盘子上各装一点点的奶酪、香肠、橄榄和其他我不认识的东西。说实话，我很不喜欢这种吃法，我宁愿好好吃一顿像样的晚餐，但我很高兴能和大家在一起，有说有笑，边吃边闹，看著落日沉入河中，而且至少桌上没有小乳猪。", "吃到一半时，比尔问迦勒：「你的递延股票呢？」", "我听不懂这个问题所代表的意思，但迦勒脸上的笑容我曾在交易游戏里见过，挂著那种笑容的人是不会输的，于是我将注意力移到他身上，看著他回答。", "「别担心，我已经处理好了。」", "「慈善？」", "「慈善。」", "「但是鼻涕虫呢？」", "「一年没有分红。」", "「他愿意？」", "「愿意。」", "其他交易员都没有在听，但我将目光集中在迦勒和比尔之间，迦勒微笑著深深点头，比尔看上去比较严肃，但也在点头，虽然我听不懂他们在说什么，但我小心的将它记住。后来的事实证明，这么做非常重要。", "然后，天色已经几乎完全暗下来时，大家都喝得酩酊大醉，ＪＢ问迦勒：「你还有什么遗憾吗？」", "迦勒望著只剩下一点点的夕阳，想了一会儿，然后说：「只有一个，我们没有搞死鲁伯特。不过不用担心。给他一点时间，将来有机会的。」", "我们全都笑了，大家一起举起酒杯，喝著啤酒，聊到深夜。", "我和迦勒之后又一起吃了一顿送别晚餐，这次只有我和他。事实上，应该说是送别午餐才对。", "迦勒在向小组成员宣布消息之后，还特地来找我。他为在他告诉所有人时我却不能参加会议向我道歉，我表示理解。他也为雇用我后自己却这么快离职，以及做出的承诺现在却无法兑现而道歉。他告诉我，他将去确认我会被善待，为了补偿我，他要带我去任何我想去的地方吃午饭，而且我可以问他一个问题，任何问题，他都会如实回答。", "我请他带我去美式餐厅 Chili's。他们那里的辣鸡翅做得很好，沾上蓝纹乳酪酱美味极了。我们就这样决定好餐厅。", "由于 STIRT 小组开始工作的时间很早，所以我们吃午餐的时间也比一般人早。Chili's 是一家座落在金丝雀码头购物中心高楼层的美式快餐店，空间巨大且光线充足。我们进去时还不到正午，整家店空荡荡的。我得到馋了许久的辣鸡翅。", "在开放的大餐厅里，只有我们两个人坐在那里，令人有些伤感。我们隔著一张方形塑胶小桌面对面坐著，桌上摆了二十四只辣鸡翅和两小罐蓝纹乳酪沾酱。我们只相差七岁，但他坐在我对面，体型是我的两倍，看在陌生人眼中，可能会有人误会他是我的父亲。", "我看著他。浓密的黑发包围著他巨大的头部。他看起来很疲倦，但十分开心的样子。他看起来就像一个已经圆满达成任务的人。到了此时，我们相识已经两年半。我知道我会想念他，有点像小学毕业典礼前一天的感觉。你知道你会想念你的朋友和老师，但你不知道该说什么。", "当然，我没有告诉他这些。", "「那么，」我盯著他的眼睛：「我得到一个问题的发问权，是吗？」", "「是的。」", "他笑容满面，微微瞇起眼睛抵抗从天窗射进来的明亮阳光。刺眼的光线散射到我们的桌子上。", "「你会诚实的回答吗？」", "「当然会，加扎。」", "灿烂的笑容还在扩大。", "「任何我想问的都可以吗？」", "「任何问题都可以。」", "我放下手中的辣鸡翅。", "「我需要做什么才能拿到十万英镑？」", "迦勒大笑起来，身体往后靠。他放下手中吃到只剩⻣头的辣鸡翅。", "「十万英镑？分红奖金？？」", "「十万英镑，分红奖金。」", "他停顿好一会儿，难以置信的看著我。", "「这是不可能的。你不可能在第一年就做得到。」迦勒又笑了，但我没有笑，只是死死盯著他。即使我年仅二十二，我还是尽力让自己看起来像个成熟的男人。", "迦勒不笑了。", "「你只要告诉我需要做什么，我就会去做。」", "他现在看得出来我是认真的，但他的回答依旧不变。", "「你不可能在你当交易员的第一年，就拿到十万英镑的分红奖金。那是不可能的。没有人做得到。」", "「告诉我需要做什么，我就会去做。」", "迦勒一时间没有说话。他把手放在下巴上，看著我。", "「你必须为银行赚到一千万美元。」", "那天下午，我走到小组办公区旁的印表机前，打开它，拿出两张空白的Ａ４白纸。", "我在第一张纸的顶部用大写字母写上「一千两百万美元」。额外的两百万美元是为了给自己预留一点犯错的空间。在此之下，我写了五笔计算后得出当年利润刚好为一千两百万美元的交易。它们分别是：", "贷出10亿美元，为期一年的瑞士法郎换汇交易", "贷出10亿美元，为期一年的日圆换汇交易", "贷出13亿美元，为期一年的英镑换汇交易", "贷出15亿美元，为期一年的加拿大元换汇交易", "贷出14亿美元，为期一年的瑞典克朗换汇交易", "我把那张纸折起来，放进办公桌的抽屉里。", "我拿出第二张纸，将同样的东西再写一次，把这张纸折起来，放进裤子后面的口袋，带回家，放进我的床下专门装内裤的抽屉里。", "它们的交易金额太过庞大，我的资历太浅，没有执行它们的授权。除此之外，它们不是我负责交易的货币。帐本在别人手中。", "我要怎样做，才能得手其中之一？", "小节 7", "迦勒最后一天上班是在五月下旬。他在前一周就已经把所有私人物品从公司搬走，所以到了那天，除了和大家握手道别之外没什么可做的。他在下班前几小时离开，大约下午三点左右。", "当他离开小组办公区，开始沿著通道往前走时，ＪＢ出声大喊：「迦勒．祖克曼即将离开本栋楼！」", "我们全站起来鼓掌，然后整层楼的其他人也都站起来鼓掌。", "我看著那个魁梧男人的巨大背影独自沿著走道离去。我认识的第一位交易员。他没有转身，没有挥手，没有以任何形式接受掌声。他直接离开，没有回头。", "我们都想知道新老板是谁。比尔果然如我们预料的那般拒绝。我们都担心会是那个来自纽约的青蛙，可是接手的不是青蛙，而是查克。", "查克．马蒂森是一个巨人。", "我知道我在书中很随意的用「大」这个形容词来描述周围的交易员，可能是因为几乎所有交易员都比我高大许多。在这之中，查克是最大的，而且差距不只一点点。", "查克是加拿大人。当时的我还未去过加拿大。他可能来自多伦多、温哥华或其他大城市，但我看到他的那一刻，直觉想像的画面是一个伐木工，在白雪皑皑的冰冻荒地上，扛著巨大的树木回家。他的身高大约两公尺，尽管以优雅的姿态挺著球状的肚子到处走动，但他并没有给人留下「胖」的印象，纯粹只是个巨人。一个诚实的巨人。藏在他巨大身躯上的是一张友善的脸孔，成功的让他所接触的人不会被吓到，尽管我只能从它的下方仰望。他五十岁出头，方下巴，灰白色的头发俐落的侧分，看起来有点像我父亲的放大版。他和蔼可亲的巨人形象很吸引我，使我不禁想更深入的了解他。", "查克是交易界的传奇人物。他交易俄罗斯卢布。如你所知，STIRT 小组仅交易「富裕国家」、「西方国家」的货币，也就是火车准时行驶的地方。俄罗斯、印度和巴西等国家的货币由「新兴市场」小组进行交易。虽然他们的办公区实际上离我们的不远，可是两者之间简直是天差地别。查克从我出生之前就一直在交易卢布。谣传他甚至认识俄罗斯总统普丁。", "虽然 STIRT 小组的人都不认识查克，但他的名声和尺寸却让所有人难以忽视。每当他站起来在交易大厅里走来走去时，高人一等的头颅总会出现在萤幕墙的顶端，不管是什么时候，交易大厅里的每个人都能轻易看到他的所在位置。在迦勒离开后的几周内，关于他可能成为我们新老板的传言四起。我则是在经过下列的事之后，才确认传闻是真的。", "迦勒离开后，在新主管被正式任命之前，我们没有领导人，也没有瑞士法郎交易员。到最后，比尔不得不担任临时经理，我则不得不担任临时瑞士法郎交易员。这不是为某人掩护：交易本身并不会计入已经不存在的迦勒帐本里；相反的，它们被计入我的帐本。在当时，瑞士法郎帐本的利润非常丰厚，我借此赚了相当多的钱。", "比尔讨厌行政工作，比尔讨厌处理行政杂务，由于我是比尔的初级交易员，所以他将很多行政工作都推给我。这意味著我经常得在每个人离开后继续留下。我其实不怎么介意，因为正如我刚才说过的，现金一直不停的流进我的口袋。", "在进入这种工作型态两、三周后的某天晚上，我又成了小组唯一留下加班的人，一边处理著无聊的行政杂务，一边发送电子邮件并设定一些将来的交易。尚未被正式宣布为 STIRT 小组新负责人的查克走到我们的办公区，走近我身边。", "我抬头看著查克。我坐著，他站著，我们两人的脸距离拉得非常大。为了看我，查克必须将脖子尽力向前弯，就像低头看自己的鞋子一样。看到他脸上挂著鼓励的笑容，我也露出微笑。", "查克向我伸出手，我伸手回握。他已经知道我的名字。", "「嗨，盖瑞，我是查克。」", "然后他走到旁边，想拉张椅子在我身边坐下。因为其他 STIRT 交易员都已经回家，空椅子到处都是，所以这应该不是一件难事，可是不知道为什么，他居然就这样不见了，消失两分钟之久。也许他想找一把坚固一点的椅子？", "查克终于再次出现。他慢慢的将椅子滑到我旁边，小心的、一点一点的将身体重量压到椅子上。他惊人的体型和体重使他的每一个动作都带著巨大的重力。和他相比，我觉得自己娇小得有如孩童。", "查克坐到椅子上后，什么也没说，只是对我笑了好一会儿，不知道为什么，我总觉得他的笑容里带著点恶作剧的味道。", "我不知道该怎么应对，略显尴尬的报以微笑，然后继续预订我的交易。", "这种荒谬的情况持续两分钟，然后查克倾身靠过来，发出一声：「嘿！」", "他仍然像个疯子般微笑，或者该说更像一个小学生？所以我转身回应他：「嘿？」", "查克突然举起右手，我到这时才意识到他之前一直将手藏在背后。他手里拿著一本《体育画报》。你大概知道，它是一本泳装杂志。", "我看看杂志封面，又看看查克的脸，发现他的两条眉毛居然像毛毛虫似的不停蠕动。", "查克翻开杂志。他的姿势很明白的传达出，他并不打算自己阅读，而是想要和我一起看这些照片。展露在我面前的是一张跨页的比基尼模特儿的大照片。", "我看了看照片，又回头看了看查克。他的眉毛依旧在蠕动。我看著他，两条毛毛虫又蠕动好一会儿，然后，他对我说：", "「对。你喜欢这样的，是不是？」", "当然，我只能回答：「是的。很不错。」", "然后，查克伸手翻页。", "下一页是另一张跨页的比基尼模特儿的大照片。我看著查克抖动的眉毛，他说：「嗯，对。这真是太美了。」", "所以我说：「是，真不错。」", "然后点头表示同意。", "这个场景持续很长一段时间，远远超过能够合理解释的长度。我搞不清楚发生什么事，但我在第三张或第四张比基尼照片时意识到，查克已经确定自己要来当我们小组的新主管。没有其他可能的解释。在我们一起浏览杂志时，我对这个推测愈来愈深信不疑。", "最后我们看完整本杂志，没有错过任何一张比基尼照片，查克卷起杂志塞进他宽大的裤子口袋。然后，收起脸上的笑容，意味深长的将视线投向远方，仿佛寒暄时间已经结束，他终于可以开始谈正事。", "「那么，你在小组里负责什么呢？」", "我看著查克的脸，查克看著我。突然间，查克看起来显得很年轻。", "一周内将接管 STIRT 小组的查克，竟然不知道我的工作是什么？真令人难以置信。不是吗？或者，该说，是吧？", "我凝视他的脸，试著评估这个人的深浅。他来这里做什么？这是一个圈套吗？", "因为迦勒以前是瑞士法郎交易员，所以我以为新老板也将接手这个角色，我则会卑微的继续担任纽西兰币交易员，并不时为比尔做掩护。查克应当知道那就是我的工作。嗯，还是他真的不知道？", "我的目光始终固定在他身上。这是一场游戏吗？难道他真的一无所知？我试著从他的表情判断。我看著他的时间可能比应该看的时间要长，因为过一阵子，他又开始微笑。那个大大的、宽阔的、恶作剧似的、孩子气的笑容再度回到他脸上。然后，当他对我微笑时，我也开始微笑，我对他说：「我是瑞士法郎交易员，查克。我是瑞士法郎交易员。」", "查克继续微笑，深深的点头，然后他慢慢的、分解动作似的、一点一点的从转椅上站起来。在这么做的过程中，他时不时抬头看看我，点点头。当他终于离开椅子，站到它的侧边后，便开始一边走，一边将它推开。在离开前，他最后一次转向我，对我说：「很高兴认识你，盖瑞。我很期待与你共事。」", "查克离开后，办公区又只剩下我一个人。我坐下来思考刚刚发生的事。", "然后我将扬声器上的开关往上扳，联络一个叫莫利的人，他是我最喜欢的瑞士法郎经纪人，我开始喊他的名字：「莫利！莫利！你还在那里吗？」", "然后，我将开关往下压，过一阵子，莫利的东伦敦腔声音对我响起：「你还好吗？盖尔？这么晚了，你还在这里做什么？」", "「别担心那个，伙计，听著，你觉得你能给我找些一年期的交易吗？我想贷出美元。」", "「嗯，大家都回家了，伙计，但我也许可以从纽约给你弄一些过来。你想做多少？」", "「我想做一码。」", "一码就是十亿美元。", "我真的做了。我真的成为瑞士法郎交易员。我真的完成自己写下的清单里的第一笔交易。", "到了那年年底，它刚好让我赚进一千二百万美元。", "完全符合我当初写在清单上的数字。", "小节 8", "在我之前，从来没有任何交易员在入职第一年就赚到一千万美元。在我实现这个目标时，他们是这么告诉我的。", "然后，我就在想一个不可避免的问题：为什么我是第一个？", "我想告诉你，那是因为我很聪明，或者我很勇敢。", "我想告诉你，因为以前从来没有人有勇气在这么年轻的时候，就进行如此大笔的交易。", "然而，事实是，这些都不是主要原因，尽管我认为它们多多少少有发挥推波助澜的效果。我那一年之所以能赚这么多钱，主要原因有二：一是很容易，二是被允许。", "赚钱很容易，因为每个人都在这么做。每个人仍然继续做著同样的交易：以二％的利率长期贷出美元，然后不花费任何成本的每天借回。", "我想，我会被允许，应该也是出于同样的原因。因为我周围的每个人都在这么做，而且他们的交易规模都比我的还大。二○○九年，比尔连续第二年再次赚到一亿美元，再次成为花旗银行当年最赚钱的交易员。除了他，没有人赚到一亿美元，不过有两个人赚了七千五百万美元。谁会花力气来在乎坐在角落，勉强赚一千二百万美元的我？没人在乎。去他的，连史努比在那一年也赚到三千万美元。即使查克有时会像一棵松树般笨重的向我走来，将巨大的身影投射在我的萤幕墙上，他也从来不会说什么，只会露出疯子似的谜样微笑，然后看著远方，轻轻的前后摇动我的椅子。我认为他确实极有可能至今仍不知道我的工作是什么。", "当然，除了我是如何做到这一点的问题之外，还有一个更大的问题：为什么我们小组全部的人都能做到这一点？为什么我们会被允许进行同样的巨额交易，并且赚这么多钱？如果我们全在进行同样的交易，一旦情况有变，引发雪崩似的风险不是很大吗？", "我一直忍到二○○九年年中，才终于忍不住去问比尔。他告诉我，在金融危机开始时，迦勒就去找过大老板。不只是鼻涕虫，还有鼻涕虫的老板，还有鼻涕虫的老板的老板，然后获得小组所有人做同样交易的特殊许可。依照比尔的说法，如果交易赚钱，我们所有人都会拿到分红：比尔、我、查克、鼻涕虫、鼻涕虫的老板，一路往上。去他的，就连首席执行长也会从我们的 PnL 中分到钱。如果真的出了问题，整个银行系统就会崩溃，全部的人都会失业，所以谁在乎呢？这就是为什么它会被允许。我猜人们总说上梁不正下梁歪，果然是有道理的。", "我看著查克，心想不知道查克正在做的事，以及我们所有人都在做的事，会不会其实是错的。查克一如往常的对大家微笑点头。他拉出抽屉，把一大堆零钱倒在桌上，现在正一枚一枚的清点，将硬币分成好几叠。", "你可能会认为，对我来说，赚到第一个一千两百万美元是一件大事，一件我会永远记得的事。你可能会认为，我的脑海里能清晰浮现一个代表这个开创性时刻的重大画面，是我至今仍珍惜收藏的宝贝。", "然而，实际上，它发生的速度极为缓慢，一次只前进一小步，是一点点、一点点的往前移，龟速般慢慢实现的。", "我花了六个多月才赚足一千两百万美元。换算下来，每个月只赚两百万。那是什么意思？一天十万？是不是少了一点？", "事实就是如此，一天一天的滴水穿石。这里十万美元，那里十万美元。有时候，也许一天只有五万美元。", "在赚钱时，我在做什么？我还记得那段时期的什么事情？", "你知道吗？数字拥有强大的力量。数字可以催眠你。我还记得每天更新的试算表，明白列出每个人的名字和 PnL 金额，属于我的数字正在慢慢的往上升：一百万美元，两百万美元。", "一个周末傍晚，我看到我最好的朋友的车，一辆小小的银色标致一○六，停在肖尔迪奇等红灯，于是我跑过去敲车窗。车窗摇下，出现一张女孩的脸，直视我，丰满的唇形，黑色的短发，是我此生见过最美丽的女人。她成为我这辈子第一个认真交往的女朋友。", "三百万美元，四百万美元。", "英国首相戈登．布朗在国会提起对银行征税的议案。我刚听闻此事时，心中慌乱，但我环顾四周寻找比尔，看他正抓著ＪＢ的肩膀摇晃，两个人都在大笑，巨人查克也在笑，尽管我不太明白发生什么事，但我还是深深吸一口气，慢慢把它吐出来。我们应该会没事的。", "五百万美元，五百五十万美元。", "我的女朋友住在伦敦西北区，所以我需要买一辆车才能去找她。我的朋友在中央圣马丁学院主修时装设计，他需要七百五十英镑购买一个肩膀可折叠的人体模型，于是我给他七百一十英镑买下他的标致汽车，不足的部分他请他妈妈先借给他。", "六百万美元，七百万美元。", "哈利现在和他爸爸住在埃塞克斯，但只要我有时间，我就会开车去接他，再一起去健身房。我会问他工作情形如何，他会说一切都很顺利，我问他和他父亲相处得怎么样，他会说一切都好。", "八百万美元，九百万美元。", "每个周末我都会开车去她位於伦敦西北的小套房。我整个周末都待在那里。墙上挂满手绘的鹿的骨架图，地板上全是衣料碎布。冬天来了，她拒绝开暖气，她说太贵了，不开暖气可以省点钱。", "一千万美元，一千一百万美元。", "我爸爸每晚和周末仍旧在收看天空体育频道，不过这对我没有影响，反正我也不怎么在家。我的朋友们因为金融危机而找不到工作，所以每当我有空，我就会和他们一起出去玩，打电玩游戏，讲讲笑话。", "一千二百万美元。", "目标达成。", "在累积利润达到一千万美元之前，我其实没怎么去想这件事。那时已经是十一月底。", "对交易员来说，冬天是一个奇怪的时期。赶来上班的路上寒冷漆黑，下班回家的路上一样寒冷漆黑。", "那时我还没有一件真正的长外套。平日穿的是我从 Topman 平价连锁店买来的黑色紧身双排钮扣厚呢短大衣，我记得买的时候花了三十英镑。我到现在还留著那件衣服。为了避免早上受凉感冒，我常常一路冲刺到车站，并算好时间在火车到达时跑进月台。不过，进入早就等在斯特拉特福的月台、已经冻成冰棒的第二班火车后，我就只能硬撑了。我还记得在等待火车启动驶入地下前，我坐在车厢末端靠窗的小座位上，瑟瑟发抖，身体感觉到刺骨寒意。", "最初的两个小时，我们会在黑暗的天色中工作。太阳慢慢从地平线升起，但被厚厚的云层遮挡，所以我们看不到太阳，只能看到天空从漆黑转成深灰。我们会在浓灰的天色中工作五个小时，然后继续在漆黑的天色中工作，直到所有人起身回家。", "到了此时，迦勒和鲁伯特都已经离开伦敦，我成了比尔手下的初级交易员。唯一要我帮忙买午餐的人只剩比尔，而且我每天都会这么做。外带餐厅都埋在地下购物中心里，虽然可以从花旗集团大楼直接进出，但我还是选择绕远路，故意穿过大楼后面的公园，只为了出去看看能否见到太阳。比尔很少离开办公室。我在想他什么时候可以晒到阳光。我想像他住在又大又豪华的乡村庄园里，那些地方周末还是会有阳光吧？", "到了十二月，交易大厅开始变得愈来愈冷清，世界仿佛只剩下永无止境的经纪人午餐会。到了那时，我的帐面获利已达一千万美元，但离一千两百万尚有一段距离，于是我将它当成我的新目标，所以我仍然将注意力放在进行交易上，不过实行起来有些困难，因为金融城里的每个经纪人和交易员都说，我应该在耶诞节前出去和他们喝一杯，清偿欠他们的酒债。", "比尔和ＪＢ经常带我出去，相较于鲁伯特和史宾格勒，我受到的待遇可说是显著改善，我到这时才开始意识到这两个人有多能喝。有一次我收到洪哥的简讯，说他在金丝雀码头广场的一家酒吧里和ＪＢ一起喝酒，可是现在他一定要回家了，问我可不可以过去代替他陪著ＪＢ？当我抵达时，ＪＢ一边摇晃身体，一边脏话连篇。洪哥将他的手搭在我的肩膀上，然后自己去洗手间。", "我将ＪＢ放在高脚凳上，以平衡花瓶底座的方式调整他的肩膀，让他不至于摔下来。他轻微的摇晃，然后从椅子上向前跌，又压回我身上，我看得出来他快哭了。", "他开始说他在澳洲的姐姐生病了，他实在好想回去探望她，我将头右转向后看，再左转向后看，想知道是不是有人在看我们，然后我看到洪哥正往我们的方向走来，于是我开始拍打ＪＢ的脸颊，低声说：「好了，兄弟。洪哥回来了。不要再说了，懂吗？不要再说了。」", "ＪＢ向左看，看到洪哥，他开始大笑，然后他用力捏住我的鼻子，力道之大，在我鼻子上留下接下来四天都消不掉的明显瘀青。", "我们小组那年去伦敦市中心的 Nobu 吃耶诞晚餐。那是一家超高级餐厅，主打日本料理，但老实说，为了迎合伦敦社交圈而大幅调整过的味道已不再道地。比尔喝得太多、太猛，我不得不带他去洗手间。当我像物理治疗师抱著受伤足球员般一瘸一拐的把他拖到厕所时，他突然尖叫一声，跳起来，抓住我的肩膀，开始在我耳边大喊：「迈──凯肯恩！」", "「迈凯姆！迈柯肯恩！」他口齿不清的大喊，那个「Ｋ」在他嘴里绕了许多圈。", "我不知道他在说什么。我在想是在说「古柯碱」吗？但我很确定比尔不碰毒品，所以我靠过去问他，叫他说清楚一点，但他所能做的，就是再次大声喊叫「迈凯凯凯肯恩恩恩」，嗯，大约七次。", "然后，突然间，著名的老牌男演员米高．肯恩爵士从黑暗中走出来，直接穿过比尔身边。我太过震惊，不知不觉的放开比尔。他开始向后倒退，然后指著我的脸，大喊：「是米高．肯恩，你这个该死的东伦敦蠢蛋！」", "然后他向后倒，躺在地板上。", "回到家里，我的父母已经把耶诞树立起来，墙上还挂了三只大袜子：一只是哥哥的，一只是姐姐的，一只是我的。", "耶诞树并不算大，却占满客厅的所有空间，以致你坐在沙发上无法看到电视，只能把自己挤在电视和耶诞树之间。这对我来说没什么影响，反正我从来不看电视。", "那年临近耶诞节时，每当我喝完酒很晚才回到家，屋子里所有的灯都已经熄灭，可是耶诞树上的彩灯仍在闪耀，照亮客厅。先是紫色，后是橙色，最后是粉色。这画面让我忆起小时候。也许我的内在还是个孩子。", "那一年，我没有买礼物送给任何人，但他们都还是为我准备礼物。", "小节 9", "对于分红奖金日，我并不害怕。我的意思是，我知道的，不是吗？我知道会发生什么事，不是吗？迦勒告诉过我。赚一千万美元，分红十万英镑。所以一千二百万美元大概是十二万。", "我在那天与迦勒谈话时选择十万英镑，其实并没有什么特殊的原因。我猜大概是因为它是我当时能想像到的最大金额。这对我来说已经是一笔无法想像的大钱。你必须记住，就在四年之前，为了一周十二英镑的工资，我每天都得天未亮就起床送报。在那之后，为了赚取四十英镑的日薪，我每天都在拍松靠枕，即使是四十英镑，对当时的我来说，也是一大笔钱了。我还和妈妈住在一起，你知道吗？十万英镑根本是无法想像的巨款。我甚至不晓得有这么大一笔钱，你能拿来做什么。", "所以到了那天，我并不害怕，一点也不。我只记得，我以为我会是最后一个被叫进房间的人，因为前一年是按照交易员 PnL 的高低顺序进行的，而我的 PnL 是小组最低的。可是实际发生的状况却是，如我所料的，比尔第一个被叫进去，当比尔回来时，他叫我进去。", "那一年的分红奖金并不在前一年那个阴暗小房间发放。巨人查克不晓得用什么办法，在大楼的转角处弄到一间两扇窗户可以看到码头景色的漂亮办公室。很典型的巨人查克作风。我记得那天天气晴朗。巨人查克坐在阳光下，双手平放在膝盖上，超级镇静，带著温和的笑容，像一尊巨大的金色佛像。说实话，整件事情我历历在目，仿佛是昨天才发生的一样。", "巨人查克什么也没说，他只是微笑。我在他对面坐下，双手放在膝盖上，模仿他的样子。一张Ａ４白纸完美的放在我们之间的桌子正中央，倾斜的角度不偏向我们任何人，而是指著房门。", "我看著查克，他平静的低头看著我，很快我明白他不打算说话。所以，我低头看著那张纸。", "纸的上面写著一些字。我的名字，很正式，包括我的中间名，盖瑞．沃尔特．史蒂文森。下面印了一个小表格，上面有一些数字。没有一个是我所预期的数字，就是那个你知道的，十二万英镑。", "我意识到在最上面的那张纸之下，还有几张纸，但我几乎可以肯定最重要的数字会出现在第一页。我指著表格顶部的第一个、也是最大的数字：三十九万五千英镑。", "「是这个金额吗？」", "我没有事先想过。事实上，我不记得我当初是怎么说的。我只记得这件事正在发生。我只记得看到自己伸出手臂，指向那个数字，同时听到自己说出的话。", "我抬头看查克。查克的整张脸和眼睛都发出灿烂的微笑，非常和蔼的，然后大笑出声。", "「是的，就是那个金额。」", "「哇！」我说：「很多钱。」", "我记得那个画面。我记得好清楚。但在那之后发生的事，却全变成一片空白。", "我记得的下一个画面是我回到座位上。我坐在办公桌前，右手放在滑鼠上，左手放在键盘上，但是很荒谬的、可笑的又可悲的是，我感觉自己就要哭出来了，即使我非常努力的想将这种情绪压制下去。", "我的右脸感受到比尔的目光。我本能的转过头来，看看他是否真的在看我，他确实在看我，所以我立刻过快的回望他。我还在忍住不哭，但显然我就快忍不住了。", "比尔站起来，走到我的左手边，将我和小组其他交易员隔开，挡住其他交易员的视线。他双手朝下平放在桌面，倾身靠向我，在离我很近的距离，对我说：「出去走走。去公园里坐一下吧！给自己一点时间。你会感觉好些的。去吧！没关系的。」", "我的下一个记忆片段是，我像个孩子似的坐在公园草地上。严格来说，它根本不是一个公园，而是一块三方都被巨大摩天楼包围的中等正方形草地。很幸运的是，当时的太阳刚好在第四面，所以我得以在长长的影子之间沐浴阳光。", "我迷迷糊糊的走出来，什么都忘记带，没有围巾，没有外套，甚至没戴我工作觉得冷时会戴的黑色露指手套，我突然意识到自己有多冷，不过至少还有阳光。", "当我的神智恢复正常时，我第一个想到的，是我爸爸。", "他在邮局工作三十五年。从我很小的时候，他就每天很早离家上班，往往在我醒来之前出门。如你所知，从七王站出发往巿区的火车会从我卧室的窗户旁经过。我妈妈时常走进我的房间，在漆黑的夜色中，在还很早的时候轻声叫醒我，让我看著窗外，看看能不能捕捉到火车飞驰而过时，爸爸在车厢里的身影。", "火车的速度有时很快，一切都变得很模糊，我找不到他。但有些时候，在火车速度较慢的时候，我能够看到他在火车车厢温暖的灯光下，他总是会回头望向窗外的我，微笑挥手。", "然后，因为时候尚早，又黑又冷，尤其是在冬天，我会躺回去继续睡觉，爸爸则去上班，直到深夜我才会再见到他。至少对儿童时期的我来说，是很晚很晚的时候。他到家时总是很累，但他总是很温和的对待我们，尽管他已经很疲倦了。", "我想著这些年来他所付出的一切，早起，在黑暗中，在寒冷中，赶早班火车，在黑暗中，在寒冷中，拖著疲惫的身子晚归。为了养活一家人，为了养活我。代价是什么？一年两万英镑？", "我坐在这里，在我从小看习惯的摩天大楼的阴影之下，显得如此渺小。我盘腿坐著，没有大衣，没有围巾，在一个小三角形的阳光中，在一小块草地上，刚刚满二十三岁，刚刚收到三十九万五千英镑的红利奖金。", "这意味著什么？", "我在冷风中坐一会儿，让自己平静下来。然后，我想到其他人的爸爸。我想到和我一起上小学的伊布兰．可汗，父亲身有残疾，他没有自己的卧室，为了不爬楼梯，他就睡在前厅的沙发上。但他们一家人对我都很好。他们给我的食物太辣，我不能吃；他们给我的茶也太辣，我不能喝。我为什么没有和他保持联络？他们现在在哪里？", "我想起另一个叫穆扎米尔的男孩。他们家是在我们七、八岁时从巴基斯坦搬来的。他不会说英语。每一节下课时间和午餐时间，他都在不停的跑来跑去，不停的侧翻筋斗，嘴里大喊他说出来且我们能理解的唯一英文单字，也就是他自己的名字。「穆扎米尔！穆札米尔！穆札米尔！」", "这一切又意味著什么？", "然后，脑子里跳出的下一个念头是，我现在该怎么办？", "再之后的想法是，小组其他人拿到多少红利奖金？如果我的一千二百万美元赚了三十九万五千英镑，洪哥的七千万，帮他赚了多少？鲁伯特去年的八千万美元，让他拿到多少？比尔连续两年各赚一亿美元，他又领到多少分红？", "那些穿著花押字粉红衬衫、最终摧毁全世界的信贷交易员呢？他们在毁灭世界之前，又有多少钱流入他们的口袋？", "然后，我开始想：赚一千二百万美元就是这么容易，我可以赚二千万，我可以赚五千万，也许我可以赚一亿。我比鲁伯特聪明，我比ＪＢ聪明。我知道的。也许我没有比尔那么聪明，但如果我全心全意的投入，我就能做得到。我绝对比那些穿粉红衬衫的信贷交易员聪明。我可以赚得更多。", "如果我能赚到五千万，代表什么？也许我能拿到两百万英镑的分红。我可以用那两百万英镑做什么？应该说，到时有什么是不能做的？有了两百万英镑，你可以做任何事。你可以退休了。你可以自由了。你可以做自己，想做什么，就做什么。也许你可以在北加州盖一栋大房子。你可以驾著船航行到智利。应该可以吧？可是智利又在哪里呢？也许我能做得到。不，不是也许，我知道我能做得到！为什么那些穿粉红衬衫的家伙和姓鲁伯特的人就该成为百万富翁，而不是伊布兰和穆扎米尔，为什么不是我？为什么不能是我？我并不比他们差。我比他们都好。我们都比他们好。我比他们所有人都好。我是最棒的。我绝对能够成为最厉害的一个。", "在那年一月寒冷的阳光下，我想，我身上的某些东西发生变化，我的职业生涯也发生变化。从那之后，它不再只是单纯的工作。从那之后，我打算开始抢劫银行。", "＊译注：Flemish；带有比利时口音的荷兰语，为比利时北部的主要语言。⤴", "＊译注：veal；通常指小于一岁的牛犊的肉，无腥骚味。⤴", "＊编注：LIBOR；伦敦银行业之间在货币市场的无担保借贷利率。随著全球各大国际银行的资金来源产生结构性改变，导致银行同业拆款量快速萎缩，LIBOR 已宣布退场。⤴", "＊译注：premium；指为远期利率高于即期利率的部分。⤴"], "wcount": 57380}, {"icon": "3", "title": "第3章 看见世界的真实面目", "paras": ["小节 1", "那天，不知道为什么，我不想回家。所以我发一封简讯给女朋友，问她我是否可以在她家过夜，然后我搭乘银禧线列车前往伦敦西北部。", "那天晚上很冷，是伦敦典型的寒冷夜晚，头顶没有一片云。很难得的，你可以看到天空中有几颗星星，可以感受到宇宙是多么的寒冷。", "到达之后，我就像失去行动能力一样，什么都没做，只是躺在她的小套房的床上。为了筹措进修时装设计课程的学费，她曾经兼职当过手绘Ｔ恤设计师，她将所有的旧画稿贴在墙上。全是马的骷髅、鹿的骷髅，以及其他我认不出是什么动物的骷髅。我躺在那边，数著骷髅，一个小型携带式电热风扇在它们身上投下舞动的暖橙色光影，她冰冷且赤裸的双脚踩在木地板上走来走去，为我们两人准备晚餐。", "我们之前谈过分红奖金日，她知道我一直很期待。她说过，我不必告诉她最后我领到多少钱。当我们坐在她的小桌子边吃饭时，缝纫机、布料和衣服碎片都被推到一旁，她不知道我对此有多么感激。我想她不明白我为什么这么安静。我想我自己也不知道为什么。", "我在半夜醒来，发现她在哭。她的哭声很大，我用手将她的身体翻过来，再将自己的身体撑起来，如此一来，变成她在我的下方，我在她的上方。我低头看她，问她到底怎么了。", "「你为什么不告诉我？你为什么不告诉我？」", "她一边抽泣，一边说话，抬头看著我，我伸手抚摸她的头发，试图让她平静下来。我还没想好我要把这件事告诉谁。我不知道我是否会告诉任何人。但我想，至少，这算是我欠她的，或者我只是想让她停止哭泣，或者我只是想在现实世界中说出这个数字，看看它是否真的存在，看看它是否有效。", "于是我告诉她。", "她立刻不哭了，啜泣声瞬间停止。她的脸完全平静下来，一动也不动，仿佛正在接收什么幻象，她只是静静的仰头看我，眼神穿过我，看向我身后。在那一刻，她看起来非常像一个年幼的孩童。她的眼睛愈睁愈大，直到大到不能再大，我可以看到她没有移动的虹膜的整个圆圈，以及它们周围仿佛延伸出去的广阔白色海洋，我从未见过眼睛可以像这样移动的。", "我立刻后悔，真希望自己没有告诉她。", "两个月后，我们分手。", "在那之后，我想我可能不应该随便告诉任何人。可是就在那个周末，我的朋友贾尔佩什打电话给我，邀请我和一些老同学去他妈妈家玩，一起打世界足球竞赛系列的电玩游戏。贾尔佩什在二○○八年金融危机时失去在雷曼兄弟的工作，但之后又在德意志银行交易部找到另一份工作。我们的另外几个朋友也设法在投资银行找到工作，尽管职位不如交易员那样光鲜亮丽。当我们轮流玩 PlayStation 游戏时，话题不知不觉的转向分红奖金。", "贾尔佩什拿到六千英镑，他对此表示非常满意。他把问题抛向赫马尔，赫马尔只拿到三千英镑。当他们问马什菲克时，他说他没拿到一毛钱。看得出来他很生气，不过他这个人一天到晚都在生气。", "整个过程我不发一语，只是坐在那里玩游戏。最后，这个问题还是来到我的面前。", "「你的分红有多少？加兹？你有拿到奖金吗？」", "当然，我已经决定不告诉任何人。可是我不太确定该怎么做。这个房间里的所有人是我最好的朋友。我们从小一起长大，我认识他们十多年。你想，我还能怎么做？难道我要对他们说谎吗？", "在那一刻，我决定，直接说出来，试试看，给彼此一个机会。", "「我拿到三十九万五千英镑。」", "你可以感觉到，仿佛整个房间的氧气在那一秒钟被抽光，你可以听到它像风一般的离去。之后是长达十秒的沉默，然后是 PlayStation 的遥控器掉到地板上时弹跳两次的塑胶声。", "从那以后，所有的一切都变了。", "小节 2", "不过，我还是得再告诉一个人，哈利．桑比。我必须让哈利知道。我不会告诉他确切数字，我已经见识过它的威力。但我必须告诉他我有一大笔进帐，而且它是一件好事。我认识哈利时，我八岁，他四岁。我什么都告诉他：第一次亲吻女孩、第一次喝醉、第一次吸大麻，什么都不瞒他。你知道吗？那孩子把我当偶像，而且我们现在也算同行。我必须给他一些让他可以打起精神、陪我一起前进的动力。", "于是，我在周六早晨开车前往哈利父亲位于艾塞克斯的家。我没有事先告诉他我要来，但是我一大早就到他家门口，所以我知道他一定在里头。", "我按了门铃，哈利的爸爸开门。我对哈利的父亲其实没什么了解。他的衣服有点破旧，看起来不太有精神。他靠在门框上，当我问他能不能进去看看哈利时，他抓了抓自己凌乱的头发，摸了摸满是胡渣的下巴，仿佛不太确定这是谁的名字。", "他想了好一下总算反应过来，他说哈利正在客厅睡觉。我很疑惑哈利为什么会睡在客厅，而不在卧室，但我在想这一题时，他爸爸已经拖著脚步爬上楼梯。我之前从未来过哈利父亲的家。我走进空无一人的阴暗走廊，去找哈利。", "客厅布置得很简朴。仿木地板、白色墙壁、电视机、棕色旧沙发。深红色的窗帘在明亮的冬日早晨被拉得密密实实的，只有一道光束从窗帘接合处悄悄爬了进来，劈开房间里的黑暗。", "哈利脸朝下，趴在沙发上。我说得一点都不夸张。他将整张脸深深埋入一个深棕色的旧靠枕里。在那一瞬间，我不禁在想，不知道他怎么还能呼吸。相较于沙发，他的身体实在过长，所以双脚只能架在沙发的扶手上，让他的姿态看起来有一种仿佛正在祈祷的感觉。他穿戴整齐：长裤子、上班白衬衫、一双大的惊人的黑色皮鞋。其中一只鞋子半挂在脚上，似乎曾草率的试著要将它脱掉，却没有真正完成动作。他弯曲的右臂垂落地面，手放在地上，手腕弯曲成直角。", "尽管哈利非常邋遢，但他的外表只是客厅里第二引人瞩目的东西。进入这个空间后，我立刻注意到的不是穿戴整齐的哈利对著沙发五体投地的祈祷，而是来自沙发后面和上面的白色墙面，无声却又巨大的喧哗。", "一只疯狂而颤抖的手，写下的一排巨大、鲜红、厚重的字母，从墙的边缘一直延伸到敞开的房门。上面写著：", "「哈利王是冠军桑比。」", "我一言不发的站在那里好一阵子，仔细打量眼前的画面。晨曦中唯一的光束照在哈利的腰线上，照在墙上，往上指著「王」这个字。看起来简直像一幅艺术品。", "哈利移动了一下。压抑而痛苦的呻吟从枕头内传出。", "我握紧拳头，侧抵在哈利的髋关节上，试著抓住他的头发，抬起他的头。", "「哈利！哈利你他妈的在做什么？你他妈的为什么要穿著鞋子睡觉？」", "哈利撑起他沉重的身体，转向一边侧躺，微微抬头对我微笑。沙发靠枕的缝线押印在他的脸颊上。", "我们两个一起施力，总算让哈利坐起身子。他一直在微笑，发出一些声音，却不是在说话。很明显的，他还未从酒醉中清醒。过了好一会儿，他总算恢复语言能力，我问出我想问的问题。", "「哈利，你他妈的在做什么？为什么睡在沙发上？」", "「喔喔，嗯……喔，别担心这事，兄弟。只……只是和几个人一起去喝酒，几个同事！」", "他在说这句话时，先指了指左边，又指了指右边。口齿不清，含糊难辨。", "「为什么你还穿著鞋子？」", "他对我露齿一笑，踢掉右脚的鞋子，它飞起来，差一点撞上电视机。他踢踢左脚，鞋子却没有掉下来。他咯咯笑两声，果断放弃。", "「哈利。你知道你在他妈的墙上用巨大的红色字母写著『哈利王是冠军桑比』吗？你他妈的红色油漆是从哪里弄来的？这句话他妈的在文法上根本没有意义！」", "哈利很短暂的露出惊讶表情，然后他扭转身体，打量自己的作品。他的惊讶似乎很快褪去，他停下来，欣赏一下，然后缓慢且大声的对我念出墙上的字：", "「哈利．王．是．冠军．桑比。」", "他转回来，若有所思的点点头，用手揉揉太阳穴。", "「你是对的，兄弟。在文法上它没有任何意义。我认为『王』和『冠军』应该要互换。不过别担心那个了，兄弟。那是我在他妈的好几个月前写的。它已经存在很久了。你不喜欢吗？我还觉得挺不错的！」", "于是，我从父母家搬出来，在东伦敦堡区旧火柴工厂改建成的公寓群中租了一户。所有车库饶舌歌手几乎都出自这个区域。我将快满十九岁的哈利．桑比带过去，让他和我同住。从此之后，我们就是一个团队。", "然后，我不得不学习如何做饭。", "不过，这些都不重要，所有的这些都不重要。当我回到交易大厅的那一刻我就知道了。我为自己的情绪外露感到尴尬，也为比尔看到我情绪外露而感到尴尬。那天，在发放分红奖金后，当我从金丝雀码头的草地站起来，大步走回交易大厅时，我知道比尔在右侧看我，ＪＢ和史努比大概也在左侧看我。比尔站起来，走到我的左边，再次为我挡住其他小组同事的视线，就像他不久前才做的那样。他倾身问我：「盖尔，你还好吗？」", "我没有转头看他，只是回答：「还好。我没事了。有什么交易可做？」", "因为这就是我们现在在做的事。我们全心全意的交易。我们会赚到一亿美元的，我们一定能够成为百万富翁。", "要怎么做才能达成目标呢？", "如你所知，截至目前为止的交易背景尚称单纯：我们利用换汇交易长期贷出美元，然后每天借回美元。那是一个非常可靠的赚钱机制。不幸的是，良好的交易就像柳橙，再好的柳橙也有果汁被榨光的一天。", "在二○○八年金融风暴之后，所有人都需要美元，可是除了我们之外，没人有美元，所以我们赚到非常非常多的钱。然而，这个赚钱的管道无法永远持续下去。世界各地的中央银行没过多久就意识到，缺乏可贷出的美元大幅提高全球银行体系的破产风险，美国联准会很快的决定，开始向其他国家的中央银行贷出美元。他们透过换汇交易做到这一点，推出与我们小组完全相同的交易产品。借入这些美元的各国央行，将它贷给各自国家的商业银行。不久之后，对美元的需求程度，便从一度危及生命的绝望，降级为迫在眉睫。这样做自然削减我们的利润。不仅如此，在二○○九年期间，世界各地的政府和中央银行贷出如此多的廉价资金，吞下如此多银行体系的不良资产，人们开始愈来愈清楚的认知到，银行体系绝对不会真的崩毁。", "这一方面是件好事。因为我们一直在赌这种情况会发生，意味著我们的赌注都将得到回报。它也是进行 STIRT 交易的所有人（包括我）为什么能在二○○九年赚这么多钱的原因之一。另一方面，却又是件糟糕的坏事，获利满满的列车从此停驶。随著全球对美元需求的迫切程度愈来愈低，全球银行体系稳定下来的迹象愈来愈明显，加入贷出美元游戏的交易员和银行也就愈来愈多了，曾经带来巨额利润的业务开始变得愈来愈难以获利。利润愈来愈少。我们再也不能以二％的利率贷出美元，并以零利率借回。如果能够以一％的利率贷出美元，就已经算运气不错。", "与这个坏消息相伴的是，二○一○年初，在我刚决定要成为世界上最伟大的交易员时，我之前赚到的一千两百万美元在帐面上已经归零。你看，之前的年度过去了，银行为了这一千两百万美元付给你分红后，那一千两百万美元就不再是你的。时间重置，你的帐户归零。", "这对于交易员来说是个问题。我来告诉你为什么。", "交易不是免费的午餐。没有一种交易可以让你在不冒很大风险的情况下赚很多钱。这是另一条可以适用在日常生活的好规则──如果有人告诉你，他们有这样的赚钱门道，赶紧和那个人绝交吧！", "贷出美元也是如此。这是有风险的。尽管从长远来看它似乎总能赚到很多钱，但它每天的波动却也相当大。若以六个月为期，它几乎肯定赚钱，但若将时间缩短至一个月或一周，你无法保证它不赔钱。", "这样的波动在你的累积损益是一千两百万美元时，影响不大。可是当你帐户为零时，它就成了一个大问题。因为如果你在累积损益为零时赔钱，你的帐户便会出现亏损红字，最终可能因此陷入可怕的处境。", "出现红字，意味著你在新的一年有所亏损。意味著每天、每个交易员拿到那张试算表时，在所有交易员的姓名和损益中，你的 PnL 会以红色的数字显示（还带著括号）。", "相信我，你绝不会想成为括号里的小红字。", "当你成为括号里的小红字，你的老板就会出现在你的身后。他会询问你进行的每一笔交易，然后他会和他的老板讨论你的交易。每个人都在怀疑你的交易是否真的有利可图，或者你的理由只是顺口编造的（顺便告诉你，其实全部都是编造的）。你必须向你的老板，以及你老板的老板，发送一封解释你交易理由的电子邮件。你必须告诉他们，在你「停损」（透过结束交易来确定损失）之前，你愿意承受多少钱的损失。最糟糕的是，有时候你的老板，或者是你老板的老板，会动手介入你的交易。没有人愿意自己的交易被老板喊停。那种羞辱简直和让你妈妈帮你擦屁股差不多。", "所以，不行，出现亏损从来不是一个选项，它会限制你在累积损益为零时的行动。比尔不喜欢零，所以比尔的 PnL 从来都不是零。我先澄清，我没有指责任何人的意思，也不是在暗示什么，但我要说的是，比尔总能在每年的第一周就赚到一千万美元。我不知道他是怎么做到的，我也不想知道。我只知道自己不晓得要怎么做才能和他一样，所以我每年都是从零开始，就像其他的正常人。", "每年从零开始意味著你必须从规模较小的交易做起。这对我来说是一个问题，因为我想在接下来的一年，也就是二○一○年，赚到一亿美元。这是另一个大问题，因为我的主要交易之一，即贷出美元，不仅现在的利润比二○○九年低许多，风险也更大。这个问题不只提高我赚钱的难度（毕竟如果只是交易利润较低，我将买卖金额加倍就能弥补），而且会使我、我们所有人更难进行大规模交易。", "对于刚入行的交易员来说，我在二○○九年进行的交易非常、非常巨大。银行绝对不该允许。由于疏忽、善意和我的老板将大部分时间花在将硬币摆整齐，我才得以侥幸逃脱。最重要的是，因为我周围的交易员全都承受极大的风险，赚了很多很多钱，所以我才能成功避开所有的侦查雷达。", "但是如今这种情况，人们一定会注意到。首先，为了使我的 PnL 维持在和前一年同样的水准，我必须把对于一个二十三岁的交易员来说已经是大得不得了的交易规模再增加一倍。其次，小组的每个人现在都必须降低暴险，这意味著交易规模必须缩小，每个人的 PnL 也会跟著缩水。我无法再藏身于其他人的阴影之下。", "这就是为什么，二○一○年初我在金丝雀码头加拿大广场的草地咽下眼泪之后，怀抱成为花旗顶级交易员的新雄心壮志，回到办公区，盯著萤幕墙时，我会请教比尔：「有什么交易可做？」", "比尔总是在赚钱，而且他总能找到赚钱的交易。", "至于我们其他人，老实说，就是一群猴子，一群没有文化素养的莽夫。我们贷出美元，我们赚走利润。我们决定买公寓时，甚至不在乎它有没有大门。", "但比尔不同。比尔是一位艺术家。他不只是一位艺术家，他还有怎么都不放弃的坚持。", "到了二○一○年初，我坐在比尔旁边的位子已经快满一年，我开始欣赏他所做的事情。", "比尔贷出美元。比尔当然贷出美元，因为贷出美元是一种很棒的交易，只要有很棒的交易机会出现，比尔就会把握。但比尔不只贷出美元，他还贷出英镑。比尔对英镑了如指掌。比尔了解英格兰银行货币政策委员会每位成员的个性和习惯，「这群笨蛋」（用比尔的话来讲）负责决定英国利率。比尔了解他们的一切。他甚至可能知道每个成员上床睡觉的时间。", "比尔还贷出其他货币，却并不是什么都会贷出。比尔说，什么都贷出就像是「猪吃猪肉」。我们先暂停，谈谈什么是「猪吃猪肉」。", "当你贷出某一种货币时，你在赌它的利率会下降。运作方式是这样的：当你想要贷款时，你去银行申请，嗯，假设五年到期的贷款好了。在目前这个时间点上，银行并不知道实际上未来五年的市场利率会是多少。因为利率是由中央银行每个月设定的，你的银行此时并不知道央行将来会设定多少。于是你的银行会找到像我们这样的交易员，也就是风险承担者，要求我们承担风险，去赌利率会是多少。", "当时，二○一○年初，包括英国在内世界各地的利率几乎都为零。但每个人都（错误的）认为，它们会上升。假设交易员认为利率将在未来五年内，从零逐渐上升至五％，表示该时期的平均利率将达二．五％。他们可能会愿意以二．五五％的利率将钱贷给你的银行，银行则转头以二．八％的利率贷款给你。每个人都从中拿走属于自己的一部分利润。", "但是在交易员承诺以二．五五％的利率将钱贷给你的银行之后，他在什么情况下会赚钱呢？", "答案是：如果利率上升幅度低于预期，交易员就会赚钱。如果实际利率并没有上升，而是保持在零，同意以二．五五％的利率贷出的交易员，最终可以透过每天以零利率借入的现金，来为你的五年期二．八％抵押贷款提供资金。他为自己赚进二．五五％，你的银行则赚了○．二五％。很神奇吧？赚不赚！", "当然，世界上从来没有真正的稳赚不赔。如果利率上涨的速度比预期的快许多，例如：立刻涨至五％，而不是在五年之内平缓上涨，交易员可能就必须以五％的成本为他的二．五五％利率的贷款提供资金，就此陷入困境，遭受损失。", "我们在这里学到的教训是，贷出就是在赌利率会维持低点。", "什么时候利率会维持在低点？一般来说，在经济疲软的时候，利率就会保持在较低水准。因为这就是央行设定利率的方式。当他们认为经济疲软时，他们会降息；当他们认为经济正在走强或通膨过热时，他们会升息。他们降低利率是为了吸引你花钱，他们提高利率是为了让你不再花钱。", "这就是为什么比尔没有什么都贷出。经济体之间的联系非常紧密，意思是它们往往同时强劲或同时疲软。如果美国利率维持在低位，表示美国的经济疲软，表示英国和欧洲的经济也可能疲软，表示英国和欧洲的利率也将维持低点。某种程度上，贷出美元、贷出英镑和贷出欧元其实是同样的交易。或者更精准的说，三者是高度相关的交易。如果你同时进行这些交易，你可能会认为自己拥有三种不同的交易。然而，事实上，你不过是将相同的交易进行三次。这就是比尔所谓的「猪吃猪肉」。", "比尔从来不做「猪吃猪肉」这种事。比尔打造营养均衡的美食皇宫。首先，他会从他最喜欢的交易，也就是当时市场上最好的交易下手。将它铺成皇宫的基底。然后，比尔会问自己，这笔交易的风险是什么？举例来说，比尔知道贷出美元的风险是全球银行体系进一步崩溃。于是他会开始研究在银行体系崩溃时，还能表现良好的所有交易，并且从中选择在银行体系没有崩溃时也可能表现良好的那个。随后，他会将这笔交易加入他的投资组合中，因此无论银行体系崩溃或不崩溃，他都会赚钱。", "他以这样的手法继续建造自己的投资组合：现实世界里哪些情况会对我的交易组合构成风险？在这种情况下，有什么好的交易还是可以表现得很好？透过这种方式，他建立一座涵盖所有风险的交易皇宫。这就是比尔总是赚钱的原因：无论发生什么悲剧，无论对系统造成什么冲击，比尔手上总有可以应对的王牌。他似乎无论如何都能赚钱。", "能够做到这样并不容易。我尝试这么做过，但你需要了解一切的一切。我做不到。我不是比尔。", "史努比知道比尔是最棒的交易员。史努比是一个机灵鬼。史努比试著成为另一个比尔，但他也做不到。过去二十五年来，比尔每天早上六点开始工作，在座位上蜷缩成一个灰色的小球，用手拿著电话连讲十一个小时，同时还利用他的第九个萤幕赌马。我和史努比凑在一起讨论要如何才能接管那个位置，花了几个小时讨论如何成为比尔。可是我们不能。我们只是史努比和盖瑞。", "我们只能选择次优的策略：尽可能多贷出美元，并且观察比尔的交易。凡是我们能发觉的，跟著依样画葫芦的照做。", "比尔所赌最大的交易都和货币政策委员会有关。英格兰银行的一群笨蛋。对那些人，比尔既恨又爱。他认为他们与他完全不同：享有特权、自以为是、受过良好教育、享有声望、有权有势，但追根究柢的说，他们很愚蠢。不管他们要采取什么行动，比尔都会比他们更早知道。他借此赚很多很多钱。他超级喜欢这种感觉。", "你可以在每一次货币政策委员会开会的结果下注赚钱。比尔总是这么做，一次都不错过。假设英国利率为一％，并且即将召开会议。每个人都认为他们会削减至○．七五％，但比尔不知道为什么晓得他们会削减至○．五％。你可以出去以○．七五％的利率贷出大量现金，将日期设得和会议相关的确切日期相同，然后再以○．五％的利率借回。轻松大赚一笔。这么做的最大好处是你根本不必等。在会议结果宣布的那一天，你就能轻轻松松的赚很多钱。比尔会大声拍手，假装在拍掉灰尘，然后轻声说：「满嘴蠢话。」或者他会转过来对我说：「叫他们上绞刑台吧！」我很喜欢听他这么说，因为我通常也会跟在他后头进行交易。我会转身看著史努比，他则会像个孩子一样露出大大的笑容。", "这就是我们的计划，执行效果相当好。我这么做是为了在 PnL 累积一点钱，同时提高我的声誉，然后用这些钱扩大美元交易。一开始慢慢增加交易金额，之后迅速加大，在年底之前，赚一些大钱。简单而直接的计划。", "在下午交易完成后，我会去维特罗斯超巿买食材，回家，试著亲手为自己和哈利做晚餐。一切进展顺利。我的梅酱炒猪肉做得相当不错。我们每周一起踢一次足球，我会去健身房。感觉很好，就像拥有一个小家庭。", "小节 3", "可是后来，发生一件疯狂的大事。", "在最初的几个月里，我一直踩著稳健步伐慢慢提高我的 PnL。到了四月中旬，我已经赚将近四百万美元，平均每个月赚一百万美元，与二○○九年下半年的一千两百万美元相比，并不算特别出色，但它符合我预想的速度。那一年所有交易员赚的钱都比前一年少很多，所以四个月四百万美元第一次将我的排名推至中间位置，而不是垫底。", "既然已经累积四百万美元，我便稍微调高风险承受度。多贷出一点美元，不过不是什么大数目，只是多一点点。我把进行高风险交易的机会留给今年的下半年。", "一天晚上，我为自己和哈利做了义大利肉酱面，我们喝一些苹果酒，在太阳下山时打开电视收看欧洲冠军联赛的准决赛。我们在堡区租下一户漂亮的公寓。旧工厂规模庞大，占地广阔，一栋巨型红砖大楼拔地而起，高高的红砖塔楼和烟囱已经空置一百多年。早在维多利亚时代，工厂生产的火柴数量就比世界其他地方的火柴加起来还要多。我们的公寓在二楼，意味著整个工厂以砖块、窗户和花园包围我们，我们与树桠分枝齐平，上头的花朵含苞待放，生气勃勃。", "我和哈利现在从事同一个行业，所以我们两人都在太阳出来前起床。在堡区的公寓距离我的办公室近到我可以骑自行车上班。每天早上，我穿著蓝色滑雪夹克和鬼冢虎的运动鞋，沿著东伦敦的脉络，经过克里斯普街市场巨大的小狗壁画，穿过传统的比林斯盖特鱼市场的黄色低矮仓库，然后爬上陡峭的坡道，抵达金丝雀码头。", "哈利下班后，有一半以上的机率必须出去喝酒。在他不用去应酬的日子，我们会在五点半左右回到家。如果电视上有足球赛转播，我们便一起观赛。如果没有，我们就会收看真人实境电视连续剧《埃塞克斯是唯一之路》。我在九点半上床睡觉。有的时候，哈利若还没从宿醉中清醒，我就得骑著我用分红奖金买的伟士牌黑色小摩托车，将他送到车站。", "那天晚上，足球比赛才刚开始，我就接到电话。来电显示一个美国号码。我接起来，是青蛙打的。如果你还记得这个人的话，应该知道青蛙是纽约 STIRT 交易台上最资深的交易员。他也交易瑞士法郎，瑞士法郎和日圆。我伸手拿起遥控器，将电视调成静音，并示意哈利闭嘴，别发出声音。", "青蛙非常兴奋，语速极快。我还未在真实世界里见过他，但他一向很有风度，像迦勒以前一样叫我加札。", "他显然刚去过瑞士国家银行，也就是瑞士的中央银行。我对此感到惊讶，因为我甚至不知道他来到欧洲，但他说个不停，所以我找不到时间发问。", "青蛙表示瑞士国家银行即将做一件大事，他们决定维持瑞士的高利率。这对我来说是新闻，这对每个人来说都是新闻。当时的经济大屠杀导致瑞士法郎大幅升值。自第二次世界大战以来，瑞士货币一直被视为避险天堂，每个人都认为瑞士国家银行会大幅降低利率，甚至可能出现负利率，以阻止人们购买太多瑞士法郎推高其价值。", "青蛙说不会发生这种事。青蛙说利率会维持在高位。青蛙想要大赚一笔，他想让我也跟著赚一点。", "至少青蛙是这么告诉我的。", "青蛙透过瑞士换汇交易借了一大笔瑞士法郎。现在，请记住，当你在换汇交易中借入一种货币时，你就必须贷出另一种货币，这就是我已经进行将近一年的「贷出美元」交易。可以说，迄今为止，「贷出美元」成就我整个职业生涯，也是我想继续扩大的交易。青蛙告诉我，他成交巨量的一年期交易。青蛙告诉我，我也应该跟他做一点。", "现在回想起来，如果我当时年纪更大一点，或者更聪明些，或者只要不那么贪心，我的脑海可能就会闪过以下想法：", "「我，盖瑞．史蒂文森，二十三岁，穿著被义大利面肉酱汁污渍的东方队运动短裤，喝著苹果酒，和一个十九岁的酒鬼一起看欧洲冠军联赛准决赛转播，一个我从未见过的人为什么会打电话给我，硬要把一个绝对可靠的赚钱消息塞给我？」", "可惜的是，当时我的年纪还不够成熟，显然也不够聪明。", "「好，我跟你做两亿美元。」", "青蛙对此非常高兴。我解除电视的静音，和哈利看完剩下的比赛。", "★★★★★", "两亿美元并不算巨额交易。我过去做过不少比它还大的交易。谈到利率时，也就是谈到借贷时，重要的不只是贷款的规模，还有贷款的期限，青蛙卖给我的是两亿美元一年期的贷款。一年的期限虽然很长，但两亿美元并不算大。问题是，我之前其实已经在做这类交易，规模不小，而且随著时间一直往上加码，导致规模愈来愈大。我非常有条理的在做这类交易，非常循序渐进，已经将规模扩张到我想要的大小。当我吃下青蛙的两亿美元时，交易变得更大，大到比它应有的规模还大。", "重点是，你知道的，它应该稳赚不赔。贷出的美元次次都赚。史努比曾经对我这样说：「谈到利率交易时，只需要考虑两件事：现在的市场利率，以及期限到时的实际利率。如果市场利率高于实际利率，你就贷出，就这么简单，轻松赚大钱。」", "我们都知道换汇交易的美元利率过高。透过这次青蛙的交易，我还借入一些瑞士法郎，不过利率超级低，而且青蛙确信利率一定会上升。", "感觉有点不对劲，但我还是让它运行一周左右。", "我不该这么做的。", "时间是在青蛙交易事件发生后大约一周。我在小组办公区。五月份的下午。", "一如既往，下午的伦敦 STIRT 小组总是非常安静。到了此时，美国纽约团队已经开始上班，要询价的人大多会去找他们，而不是我们。我们放松心情等待下班。比尔在赌马；ＪＢ瘫在椅子上，一边咬著牙签，一边说故事；查克眼神放空，凝视远方的空气，也许他正在冥想；我和史努比在打听比尔进行过的交易；史宾格勒在和他妈妈讲电话。没什么大事发生。时至五月，到我们下班前，阳光都还透过窗户从高处洒下。我的位子在窗边，所以很温暖。当你的 PnL 已经累积到四百万美元，并稳定向五百万迈进时，你沐浴在阳光下，自然会感觉相当惬意。", "我通常会在这样的下午浏览一下我的部位和交易。我仍然使用著史宾格勒给我的试算表，利用它来计算哪些日子便宜、哪些日子贵，以确保我的部位不出差错。有的销售人员会试著以错误的价格将交易记入你的帐本里，好从你身上偷一点钱，所以我会浏览所有的交易，试著寻找任何可疑之处。这是我从鲁伯特身上学来的。", "那天我赚了七万美元，相当美好的一天。我并没有做什么特别的事。一如既往，我持有大量美元部位，它正慢慢的朝我想要的方向前进。", "我机械化的行动著，检查交易纪录，重新载入，检查我的部位，重新载入，检查我的每日 PnL，重新载入。", "突然间，我的 PnL 下降三十万美元。", "这不是什么问题，有时候会短暂发生这种状况。系统更新有点不同步。我又重新载入一次。数字没变，下降三十万美元。", "PnL 计算需要从外部抓取资料来评估你的部位。它需要随时知道市场价格，以便计算你的部位价值。至于资料来源使用的是我们称为「经纪人萤幕」的清单，也就是一份由经纪人不断更新所有不同期限的所有不同换汇交易的即时价格清单。选择以经纪人为资料来源相当合理，因为经纪人会不断听取所有交易员的报价，在任何时间点，他们都是最了解价格的人。", "只要市场发生变化，经纪人就会不断更新消息，有时他们可能输入错误，导致你的 PnL 大幅下降。我猜现在一定是这种状况。我知道用来评估我的瑞士换汇交易部位价值的经纪人资讯来自莫利。从二○○九年开始，他就是我进行瑞士法郎大额交易时的经纪人。我点开他的萤幕。", "他的一年期价格大幅向左跃升，表示美元利率涨得更高，瑞士法郎利率降得更低。我看到这个，认为它一定是输入错误。然后我检查其他期限──三个月、六个月、九个月。他把它们也全移向左边了。看到这里，我意识到情况不可能是输入错误造成的。我按下莫利的对讲机开关。", "「出了什么事，莫利？为什么你把一年期的改成负四十？到底怎么回事？」", "莫利沉默好几秒后才回答。这很不寻常。当他终于回答时，他试著装出没什么大不了的语气，但我听得出来他其实很慌张，句子和句子之间相隔的时间太短了。", "「你好吗？啊！盖尔，不知道为什么，我好像突然间拿不到任何价格，我不确定出了什么事，愿意交易左边的人一下子全不见了。」", "我关掉莫利的频道，按下另一个开关，对另一家公司的另一位瑞士法郎经纪人发问。", "「一年期现在的价格？」", "另一次异常漫长的沉默。然后是一串长长的东伦敦腔的搪塞。", "「哎呀呀呀呀呀呀呀，我们似乎找不到左边伙伴。要做的话，可能要到负五十了。」", "真糟糕。", "换汇交易的报价分为「左」价格和「右」价格，而不是「买进」和「卖出」。因为不管你是哪一方，都是贷出一种货币并借入另一种货币，因此并不存在真正的「买进」和「卖出」。在美元／瑞士法郎换汇交易中，左边是贷出美元、借入法郎；没有左边，也就是没有人愿意贷出美元。我贷出很多美元，随著时间过去，我必须将它们借回来。莫利将他的萤幕往下调至负四十五。我再次重新载入我的 PnL，现在下降六十万美元。我从没有在一天内损失这么多过。这比我之前的纪录多太多了。", "「莫利，到底他妈的是怎么回事？」", "又一次长时间的沉默。至少我觉得非常漫长。", "「好吧！伙计，伙计，我想我搞清楚了。瑞士国家银行在它的官网上宣布一些东西，关于三个月期的交易的新消息。来！我把连结放在ＩＢ聊天室里给你了。」", "ＩＢ聊天室是一种设计得不怎么聪明的网路讯息服务。他的讯息在我的萤幕上弹出，我移动滑鼠在连结上点了两下。如他所说，连结将我带到瑞士国家银行的官网。页面走极简风格，简单而干净，上面有一小段文字，我猜应该是瑞士德语，再下面则是英文。瑞士国家银行走朴素风格、简单而干净的标志出现在网页下缘的角落。", "那串英文字的意思大概是这样：「瑞士国家银行将以负三十五的利率提供三个月期的美元兑瑞士法郎换汇交易。如有需要，请拨打此电话号码。」", "我坐下来浏览网站。看起来简直像某种恶作剧。中央银行的货币政策通常不会以这种方式执行。中央银行一般都是在会议上宣布政策，举行记者会。他们不会只是把政策上传到他们的官网，就像在更新什么他妈的 MySpace 社交网站一样。", "我叫出史宾格勒的试算表。换汇交易的价格由两种货币之间的利差决定。因此，如果你知道价格及其中一种货币的利率，便可以推算出另一种货币的隐含利率。瑞士国家银行贷出瑞士法郎的隐含利率为负四．五％。负的百分之四点五！", "我转头看向右边，比尔正把脚搁在垃圾桶上，阅读《赛马邮报》。我回头看一眼查克。他一脸冷漠的盯著萤幕。我拿起连接在工作站的棕色大手提电话，拨打网站上的那个号码。", "一位听起来很有礼貌的女士说了一串我猜应该是德语的话。", "「妳好，我叫盖瑞．史蒂文森，我是伦敦花旗银行的瑞士法郎换汇交易的交易员。请问这是三个月期的换汇交易专线吗？」", "我用手摀住嘴，以免被其他人发现。", "「是的，这是三个月期的换汇交易专线，你想做换汇交易吗？」", "「呃……价格是负三十五吗？」", "「是的，价格是负三十五。你想要做多少金额？」", "「我不知道，我能做多少金额？」", "「我们没有设定上限。」", "我又转头看一下查克。", "「呃……我待会再打给妳。」", "我挂断电话。", "负四．五％是一个非常非常低的利率。在此之前，没有哪个国家曾经设下负四．五％的利率；在这之后，也没有哪个国家再出现过。", "我从办公桌抽屉拿出一张白纸。像这样重要的数学计算还是得用手写才行。当我贷出美元并借入瑞士法郎时，两者的预期利率几乎都是零。但我仍然获得大约一．一％的美元贴水。请记住，重要的是差距──我贷出美元的利率，比借入法郎的利率高了一．一％。为了完成这笔交易，我需要以较低的差距借回这些美元（并将这些法郎贷出去）。如果美元利率下降（当然，向来如此）或瑞士利率上升，我就可以获利。", "好，让我们乐观一点。假设我可以像我预期的那样以零利率借回美元。如果我需要以负四．五％的利率贷出瑞士法郎，会发生什么事？差距为负四．五％。我有一．一％的贴水，所以我的净损失为三．四％。届时，我有十二亿美元的一年期交易额。一年期的十二亿美元损失三．四％，那就是……四千零八十万美元。这是我在现实世界里的交易里可能损失的最大金额。是的，很糟糕。会非常非常的糟糕。", "你可能会想：「好吧！给瑞士国家银行打电话，把这笔他妈的交易了结吧！」如果你这么想，显然你不明白发生什么事。我贷出美元，借入瑞士法郎，瑞士国家银行则愿意借入美元并贷出瑞士法郎，利率比我借钱时付过的利息都便宜，而且便宜非常多。没有上限。我不能和他们交易来结清自己的损益。他们正在做的交易和我需要做的完全一致。而且目前，市场上没有人愿意交易左边。", "我无法和任何人交易来结清自己的交易。", "我不能说谎。的确有那么一瞬间，我的心脏一紧，手臂上的汗毛全都竖了起来。", "我知道有些人，像我最好的朋友们，在他们意识到自己可能损失四千万美元时，他们会惊慌失措，仓皇逃走。", "可是我没有。", "我必须承认，它让我兴奋不已。", "你不能将利率保持在负四．五％。这是不可能的，实在太低了。", "这里有个关于金钱的大哉问。你可以把钱从银行领出来，藏在床底下，埋在花园里。当你这么做时，你得到的利率为零。当你把钱放在枕头下就是零利率时，有什么理由你要选择负四．五％呢？当然，你不是银行。银行本身并没有正常的银行帐户。他们无法提取现金，将钱藏在床底下。商业银行在中央银行有帐户，如果瑞士国家银行愿意，也可以将这些帐户的利率降成负四．五％。可是他们没有那么做。瑞士国家银行仍对商业银行持有的任何现金支付零利率，同时却提出三个月期的换汇交易，以负四．五％的利率贷出瑞士法郎。", "这表示我不必承担损失。我很肯定。瑞士法郎在三个月期的交易中变成令人难以置信的负值，而且在更长期的交易里也变成负值，但若是以一天为期，我还是可以用零利率贷出瑞士法郎。", "我想起史努比教过我的：最重要的只有现在的市场利率，以及到期时的实际利率。这两者之间的差距就是你能赚钱的地方。我原本就在赌一．一％的差距会降到零，现在差距一举扩大到四．五％。我唯一要做的就是等，等它终究会回到零。它没有选择的。不是吗？", "我甚至还想多做一些。", "我又看了看比尔。他正在打电话给赛马公司。我从椅子上站起来，转身看著查克。", "「查克，我今天损失六十万。」", "查克慢慢从他的冥想中醒来，他对我露出一个温暖的笑容。", "「发生什么事？」", "「瑞士国家银行在官网上发布讯息，他们以负四．五％的利率，在三个月期换汇交易中贷出瑞士法郎。」", "「负四．五％!?」", "说话的不是查克，而是史努比。他本来在处理去马尔地夫度假的事，但我似乎引起他的注意。", "查克抚摸著下巴。他没有从椅子上站起来，但他将椅子转过来看著我。", "「你打算怎么办？」", "「我想再多做一点。」", "查克觉得这件事真的很有趣。比尔已经赌完马，转头直视我；ＪＢ也在看我；史宾格勒的手提电话贴在他的耳朵上，可是转过身来静静的瞪我。在查克的寂静沉思中，我隐约听到史宾格勒的妈妈讲佛拉蒙语的声音。", "「为什么？」", "「他们没有对隔夜市场采取任何行动。我们仍然可以将瑞士法郎定为○％。即使三个月期的市场保持在负四．五％的水准，我们也还是可以继续做，再每天贷出。」", "「我也想做一些。」", "那是史努比说的。史努比也想参一脚。", "「如果他们降低隔夜利率怎么办？」", "「不可能。他们无法将隔夜利率降至负四．五％。银行系统会崩溃的。」", "「我同意。」", "ＪＢ一边说，一边还咬著牙签。他说完又转回自己的萤幕墙。", "查克还在思考。他没有看我，想了很久很久。「好。你可以去做。祝你好运。」", "于是史努比加入，ＪＢ加入，我也加入。", "我投入的钱大约是其他人的二十倍。", "比尔决定他不参加。", "所以，到此为止究竟发生什么事？", "瑞士国家银行采取行动保护他们的货币。不是为了阻止它贬值，而是为了阻止它升值。如果你的货币升值，对外国人来说，什么东西都太贵了。你的出口会变得没有竞争力，你的出口生意可能陷入困境。瑞士国家银行已经将官方利率降至零，他们想进一步尝试一些快速生效的措施。出于某种原因，一个我永远不会知道的真正原因，他们选择在换汇交易市场上采取这个疯狂的举动。", "在三个月期的换汇交易中以负四．五％贷出瑞士法郎，基本上就是将三个月的贷款利率降低至负四．五％。但他们仍以零利率接受商业银行的每日存款。这似乎为「套利」创造机会。套利是指你可以进行一系列不同交易，它们会相互抵消，而且最终能获取利润。在这种情况下，你以一％或其他利率大量借入美元，以四．五％的差价向瑞士国家银行兑换瑞士法郎，然后每天以零利率将瑞士法郎留在瑞士国家银行。这样你手上就有三．五％的利润。", "套利的问题在于它几乎从来都不是无风险的。如果它没有风险，那么它就不会存在。有人会这么做并且继续这么做，直到价格恢复正常，所有利润消失为止。第二个问题是套利要求你进行大量不同的交易，STIRT 小组只被允许进行换汇交易。我们不被允许出去借入美元，也不被允许向瑞士国家银行贷出法郎。类似的交易由另一个小组负责。", "因此我必须进行期限更长的换汇交易，例如：三个月和一年，并且希望我可以每天以零利率贷出一天期的瑞士法郎。希望其他能将瑞士法郎以零利率留在瑞士国家银行的交易员，能够以接近零的价格和我交易。", "这笔交易的风险如此明显，连查克也注意到了。如果瑞士国家银行大幅削减瑞士法郎隔夜存款利率怎么办？他们已经对三个月期的换汇交易市场，做了一些疯子才会做的事，如果他们也对一天期的利率下手，又该怎么办？", "我给查克的理由是，如果他们真的这样做，将会导致银行体系崩溃。我认为它背后的逻辑是这样的：负四．五％是一个极低的负利率。如果瑞士国家银行强迫下面的商业银行为其所有瑞士法郎存款支付四．五％的利率，银行就必须将其转嫁给客户。但客户不可能接受每年所有的储蓄都被扣除四．五％的费用，他们会取出所有存在银行的现金。如果所有人同时从银行领钱，导致挤兑，银行体系将因此崩溃。", "至少我希望会是如此。不然的话，我铁定完蛋。", "现在回想起来，我真的不知道我的逻辑正不正确。从那时起，负利率在西欧大部分地区变得相当普遍，尽管从未接近过负四．五％。也许我是对的，负四．五％的利率是不可行的。但也许我坚持相信这一点，纯粹是因为我想赚回我的钱。", "无论如何，事情就这样发生了。", "当我回到座位上时，我已经赔掉八十万美元。但我让自己相信这其实是件好事，反而可以让我能更容易贷出更多的美元，况且这也表示我可以用更好的条件拉史努比和ＪＢ一起入局。", "那天我回家后没有对任何人说起这件事。我去游泳，游了很久很久。", "隔天的市场还是对我不利，但幅度不大。我又损失二十万美元。这使我的总损失达到略高于一百万美元，将我当年的 PnL 拉低至略高于三百万美元。我觉得相对平静的市场是个好兆头，多少叫人放心一点。我向查克、史努比和ＪＢ报告当前情况。我回家，开始翻阅伦敦政经学院的旧教科书，寻找任何关于负利率的部分。什么都找不到。", "再隔天并不平静。市场跌破底线。我又损失二百五十万美元。一天之内。史努比和ＪＢ可能损失几十万。我的当年的 PnL 剩不到一百万美元。查克没说什么，但他开始时不时就出现在我身后。", "「你认为接下来会发生什么事？」", "「它会回来的。一定会回来的。」", "我加码进行更多交易。", "那天晚上，哈利邀请我的几个朋友来吃披萨、喝啤酒、一起打世界足球竞赛系列电玩游戏。过去三天我损失三百五十万美元。来了六、七个我高中时期的好朋友，大家不停的开玩笑，互相传递披萨和 PlayStation 控制器。但我心不在焉。", "我人在场，我的意思是，但我的心不在。我损失三百五十万美元，帐面利润只剩下六十万美元。在我的 PnL 变成零之前，我还能再承受多少百分比的变动？如果你的 PnL 变成红字，会发生什么事？你要选择哪一支球队来玩？经典英格兰队。我一向都只玩经典英格兰队的球员，像是巴比．查尔顿，再困难的情况他都可以得分。", "负四．五％的利率真的不可行吗？真的是这样吗？不要把这件事告诉你的朋友。问问安德烈亚斯要不要再来一罐啤酒。他当然要，他总是点头。", "明天我要早点进办公室，赶在比尔之前进去。我希望现在每个人都离开，回自己的家。", "你觉得如果我变成红字，他们会强迫我停损吗？如果他们不会，我该怎么办？我的 PnL 会降到多低？我不会被开除吧？我从来没有想过自己可能被开除。", "我真希望每个人都离开，回自己的家。", "再隔天，我又损失两百万美元。我现在已经变成红字，赔了一百五十万。查克什么也没说，他只是一直站在我身后。史努比来过一次。到目前为止，他大概损失三十万美元。", "「你认为接下来会发生什么？」", "「它会回来的。一定会回来的。负四点五的利率是不可行的，不可能持续的。银行体系将会崩溃。」", "「是啊，你说的对。它会回来的。」", "我们分别又再加码。", "那天是星期五。那个周末我没做什么事，我没有出门。我传简讯给前女友。我不记得我对她说了什么。", "做这种事未免也太可悲。", "周一我又损失两百三十万美元，使得我的总损失达到将近八百万美元。在不到一周的时间内，我的年度 PnL 现在亏损三百八十万美元。", "那天下午，查克离开一段时间，大约半小时后，他回来了，只是把手放在我的肩膀上说：「高层的决定，你知道什么意思。」", "「是的。我知道什么意思。」", "查克的手仍放在我的肩膀上，「我知道你会从中汲取教训的。」", "我花了两天才将交易全部清空。到最后，我的年度 PnL 降为红字四百二十万美元。", "然后那该死的混蛋就一路涨回来了。", "所以，我从这件事汲取的教训是什么呢？有教训吗？总有一个教训的。", "这个教训是，史努比错了。现在的价格和最终的价格并不是唯一重要的两件事，除了它们之外，你必须拥有战到最后的能力。", "这场交易很棒，是正确的交易。史努比和ＪＢ没有被停损，两个人都赚很多钱。因为那是一笔非常好的交易。ＪＢ甚至搞不太清楚在交易什么，但他一边咬牙签，一边赚很多钱。", "然而，并不是拥有正确的交易就好，你有没有能力存活下去也非常关键。", "每个交易员都有一个「疼痛阈值」，它表示银行对每个交易员都预设一个允许损失的金额。你可以找到世界上最好的交易，可是如果你触动疼痛阈值，交易再好都不重要，你就是会失去你所有的资金。", "因此，我学到的教训是：永远不要触动你的疼痛阈值。自从那次交易之后，我再也没有被强迫停损过。每次进行交易时，你都必须问自己：从现在到事实证明我是对的之前，这笔交易可能发生的最糟糕状况是什么？这个估计符合现实吗？我在对自己说谎吗？情况还能更糟吗？考虑最坏的情况，并假设损失是前述情况时的两倍。", "我很清楚自己是什么样的人。当一笔交易让我赔钱时，我只会加码更多；如果它让我赔更多，我只会再加码。我不知道我为什么会这样，也许我就是死不认输。我所知道的是，如果一笔交易要搞死我，我就会转头搞死它，而且我会一直搞它，搞到我赢为止。但如果我真的要这么做，我最好确定我负担得起。还有，当然，我最好确定，最后的结果一定能证明我是对的。", "以及，人生两大法则：", "1. 到最后，证明你是对的。", "2. 到最后，还活著。", "你最好记下来。", "还有什么？还有其他的教训吗？", "有，没错，还有两个：第一，当比尔说不要在不了解风险的情况下进行交易时，我实在应该听他的话，但我没有。不过，没关系，我们都会犯错。只是不要重复同样的错。", "第二，该死的青蛙。在我连续大赔三天后，我突然意识到我的交易里有很大的一部分是青蛙推给我的。那么，青蛙的现况如何？他肯定也吃了不少苦头吧？他一定已经快要气死了吧？我进入系统，查看青蛙的部位。", "他手上有什么？", "他什么都没有。他当然他妈的什么都没有了。早在一周之前，该死的青蛙就已经清空他手中的交易。他的部位他妈的都去哪里了？全部扔给我。他把一大堆交易丢到市场上，然后利用我当垃圾箱回收所有他剩下、却找不到人接手的交易。", "干！", "该死的臭青蛙。", "小节 4", "所以，如果是你，现在打算怎么办呢？你二十三岁半。你的年度 PnL 是惨赔四百二十万美元。你打算怎么办呢？", "你他妈的还能怎么办？", "努力工作吧！", "我对人生的下一个阶段，二○一○年剩下的日子，几乎没有记忆。很疯狂吧？我几乎什么都不记得。", "我只知道有几件事确实发生了。", "我开始很早就进办公室，非常非常早。在比尔抵达前，我就到了。我骑车上班时，初夏的太阳刚刚升起。到达交易大厅后，就戴上我的小耳机，把自己固定在座位上。四周都没有人，所以我甚至不先换衣服。每天上班的前两个小时，我就直接穿著骑车时穿的廉价普利马克灰色连帽衫和破烂的鬼冢虎运动鞋，阅读、交谈和交易。", "当时的我急于成事，面对市场，只想抓紧一切钻营的机会。说实话，在我的职业生涯中，除了那段短暂的时期，我从来不擅长这种事。我不是一个善于交际的人。我不像史宾格勒，我无法知道每个人在做什么，以及何时在做那些事。但在我人生的那一刻，我没有选择。", "我开始花大量时间关注任何和美元、美国经济有关的消息。由于小组里每个人进行的都是自己负责的特定货币兑美元的交易，因此我们并没有人特别关注美元。我们雇一个人专门来做这件事，但他没有赚到钱，于是我决定自己来。我想彻底了解联准会，就像比尔了解英格兰银行一样。", "我勉强维持我的瑞士法郎部位。我虽然已经被强制停损，但想要完全阻止整本外汇远期合约的交易，基本上是不可能的。我们每天交易超过百笔，所以在未来的每一天都会有大量的资金进进出出，而且每天的金额都不相同。当你在未来一千多个不同日子里有不同的现金流入流出时，你无法真正「停损」整个帐本的部位。", "这意味著当我被强制停损时，我有所选择：哪些天了结，哪些天保留？我选择将所有风险最小的交易了结，保留所有风险大的。实际上，这表示我留下很大部分有风险的交易。有些人可能会说，我这么做并没有真正停损。以我的角度来看，我不是道德哲学家，我是个交易员。你认为我会乖乖的让那些交易把我搞得屁滚尿流，却不在它涨回去时趁机赚一点吗？", "当然不，我没那么傻。", "这就是我对那段时间的全部记忆。该死的八个月。交易和部位，交易和部位。橘色小萤幕上的小绿线。哔哔声和数字。部位和交易。我有时连做梦都摆脱不了它们。", "我想骗谁呢？我每天晚上他妈的都梦见它们。", "到了年底。我的 PnL 又恢复成黑字。正的四百五十万美元。", "达标，干！", "不过，那段时期里，倒是发生一件让我至今难忘的事。这是一次简短的对话。其实，更贴切的说，是一段独白。它发生在我惨赔八百万美元之后不久，我印象深刻，可能是我这一生中听过最重要的一段话。", "在那笔巨额损失发生后，我立刻执著于找出为什么会赔这么多钱的原因，以及我能不能、要怎么做才能将它赚回来。", "因为这种执念，也因为我是个服从且遵守纪律的前伦敦政经学院学生，所以我采取的行动之一，就是回到书本里找答案。", "我开始阅读我所有的旧教科书，试图理解到底发生什么事。瑞士法郎为何升值？瑞士国家银行为何采取这样的行动？负四．五％的利率是否可以持续？换汇交易价格真的能议价吗？我把旧课本塞进公事包，在下午交易清淡的时候，在晚上大家都下班的时候，我坐在自己的位子上仔细阅读。", "这样的情况持续两天。", "第三天，比尔看不下去了。", "当我专心研究书中探讨远期利率比价的数学细微差异的那一章时，书本被人强势的从我双手间夺走，直接被丢进我脚边的垃圾箱。取代它位置的是一颗正圆形、满头白发、满脸暗红的利物浦人头。", "「你这个他妈的混球到底他妈的在做什么？你几岁，伙计！」", "比尔时常说脏话，但他通常说脏话时脸却不会红。我有点吓一跳，心理上还没准备好面对私人问题，所以我必须暂停一下，想一想才能回答。", "「呃……我二十三岁。」", "「那么，你他妈的为什么还在这里念这些他妈的书呢？老兄？这里看起来像他妈的《杰克诺里》＊拍摄现场吗？」", "比尔是站著的，但他像个疯子似的将腰弯成九十度，左手疯狂的朝交易大厅比划著。我不确定我是否应该环顾四周，但我决定最好不要。", "「不。不像。」", "比尔叹一口气，将双手深深埋进白发里，然后一路滑下他红通通的脸颊。他看起来很疲倦，坐了下来。", "「听著！你不再是个死小孩。我知道你赔很多，但你在这些书里找不到一分钱的。你想知道这个世界到底发生什么事，你就去他的看一看这个世界。你想知道经济到底发生什么事吗？它毁了。你不管去他的哪里，都可以看到它毁了，伙计，去街上散散步。看到所有该死的店都拉下铁门，看看该死的桥下那些该死的流浪汉，看看地铁里的广告：债务减免，房屋净值贷款，债务减免。人们只是为了养孩子，就失去他们的家。回家问问你妈妈她的经济状况如何。问问你的朋友，问问你朋友的妈妈。在书中找答案的阶段已经结束了，伙计，你不再是个该死的孩子。你现在在这里，你在大联盟里，你要用自己该死的眼睛去观察世界。」", "就是这个。", "我一生中听过最重要的一段话。", "那一年还发生一些其他的事。史宾格勒搬回美国。比尔连续三年成为花旗银行最赚钱的交易员。", "史宾格勒搬回美国很合理。那个时候，他已经过了将近三年没有妈妈的生活，这对他来说实在太困难。他把他的瑞典克朗和挪威币交易帐本留给我，还有我之后整个职业生涯都在使用的试算表。丹麦帐本变成史努比的，即使我俩仍然没有去过斯堪的纳维亚半岛。", "到了年底，为了彰显比尔为银行赚取巨额收入的伟大贡献，高层决定任命比尔为董事总经理。在银行界成为ＭＤ，或董事总经理，是件大事。上头的人可能并不想把这个职位给比尔，因为他摆明讨厌他们，可是他们没有太多选择。", "十二月初，他们透过扩音器宣布几位新晋升的董事总经理。他们并不明说：「这些人全晋升为董事总经理。」他们只是说：「请某人、某人、某人和某人立刻来办公室报到。」所有人都知道它代表什么意思。", "当比尔的名字被叫到时，我们欢呼鼓掌，但他只是一言不发的放下手上的报纸，起身离开。", "一小时后，他回到办公区，手里拿著一个沉重的玻璃物体。他看起来很生气，在位子上坐下，同时将手上的东西扔进垃圾桶。垃圾桶发出当啷一声，倒在地上，一小堆用过的卫生纸落到我的鞋子上。", "我开口想说点什么，但比尔打断我。", "「盖尔他妈的给我闭嘴，你这个东伦敦笨蛋。」", "等到他去上厕所时，我偷偷的将那东西从垃圾桶里捡出来。看起来应该是个奖座。一个大玻璃球体里头装饰了数千个吹入内部的小气泡，在底部，小泡泡组成了比尔的名字：", "威廉．道格拉斯．安东尼．盖瑞．托马斯──二○一○年董事总经理", "我将垃圾桶立直摆正，然后轻轻的将奖座放进去。", "这件事发生后不久，在更接近年底的时候，查克把我叫到他的办公室。我猜他要和我进行「年终绩效面谈」。", "因为这一年我的收入比前一年少很多，我对自己的表现其实很失望，但我的 PnL 已经从四百万美元的亏损成功翻红，所以我认为我的绩效应该不算太糟。", "我们两个一坐下，查克的目光就直直盯在我脸上，并开始道歉。", "「听著，我只是想告诉你，我真的很抱歉。我真的很抱歉。我应该早点知道的，但说实话，我一直到现在才晓得。」", "我看著查克，完全不知道他在说什么。他的脸上没有任何在开玩笑的意思。他的眉头紧皱，于是我也跟著皱起眉头。", "「我无能为力。我真的无能为力。我已经去找过人力资源部，也和高阶主管们谈过，但他们都表示他们也无能为力。毕竟这政策适用于公司的每一个人。」", "我现在开始有点担心了，想在脑海中列出所有可能发生的事情，结果脑子一片空白。", "「听著，我真的很抱歉，我对此无能为力。但我只想知道，你还好吗？」", "我看著查克，他在说什么我完全听不懂。我试著从他的眼神寻找额外的资讯。嗯，我放弃。", "「我很抱歉，查克，但是，你能告诉我，你在说的是什么事吗？」", "查克张开他的大手，难以置信的笑了两声。", "「我在说的是，当然，盖瑞，当然是你的薪水。可是，你知道的，我们无能为力。公司决定今年要冻结所有雇员的薪资！」", "我慢慢开始意识到现在的状况。查克很担心我和我的薪水。他的担忧，似乎是出自基本的人道关怀。我的薪水是三万六千英镑。当然，我还有四十万英镑的分红奖金。", "「我只是想知道你还好吗？」", "我盯著查克的脸看了一会儿。我在想这一切代表什么。他显然不是在开玩笑。我叹口气，低头看著自己的脚。我抬起手，捏捏额头。", "「说实话，查克，我过得很辛苦。」", "我把埋在双手里的脸抬起来。查克点点头，看得出来他真的很关心。", "当我凝视窗外时，查克将手搭上我的肩膀。", "「别担心，盖瑞，我会想办法，看看公司还能做什么。」", "查克为了我去找高阶主管，最后他们决定由公司出钱，送我去环游世界。", "小节 5", "于是，我的二○一一年一月份，在雪梨的夏天和东京的冬天中度过。我在新加坡一家俯瞰著滨海湾的超大饭店十八楼领取我的分红奖金。", "鲁伯特见到时我开心极了。他在澳洲过得非常好。他拥有一户漂亮的公寓、一艘漂亮的船和一个漂亮的女朋友，他很友善的把三者依序排列，方便我一口气专心欣赏。我们搭乘游船前往植物湾，鲁伯特在船上详细向我介绍船只的维护费用，我则不停的给自己补涂防晒油，到最后两只手的手背都晒伤了。", "一月份的东京非常冷，像一座灰色的乐高城市，灯光明亮，北风强劲。我遇见无趣的渡边久和热情的金泽乔伊。关于他们两个，你在本书后半部还会再见到。", "我没有理由去新加坡，一个都没有。那里甚至没有 STIRT 小组。不过查克有一次问我最想去世界上的哪个地方，我随口回答他「新加坡」，即使我其实不知道它在哪里。所以查克把它加进公司送给我的旅行目的地。这有点像我告诉我奶奶我喜欢狮子牌的焦糖脆米夹心巧克力棒，然后她每年都会送它当我的耶诞礼物，直到她去世。", "新加坡很美。有几个伦敦政经学院的朋友住在那里，我便和他们一起出去玩。当查克打电话到我的饭店房间，通知我分红奖金的数额时，我正坐在云端高楼的大床上。", "查克在电话里告诉我，他对我从四百万美元的亏损一路爬回来的方式感到非常骄傲。他说大家都有注意到，不仅是我们小组的每个人，还有整个交易楼层的每个人。这对我来说算是新闻，我完全没有意识到。说不定是他胡诌的，只是想说点什么好听的安抚我。他告诉我，他真的相信我的能力。他认为我将来有成为大人物的潜力。他真的希望我明年能一鸣惊人，他知道我一定会，然后他给我四十二万英镑。", "我眺望码头。阳光如此耀眼，将所有景物倒映在水面上：海水、摩天大楼、花园、从嘴里喷水的鱼尾狮。", "这不是我的太阳，这是其他人的太阳。我在想，不知道这一切代表什么。", "好吧！我想，差不多该回家了。差不多是成为世界上最棒的交易员的时候。", "＊译注：Jackanory；以激发阅读兴趣为主旨的英国儿童电视连续剧。⤴"], "wcount": 21603}, {"icon": "4", "title": "第4章 觉醒的前奏曲", "paras": ["小节 1", "当我回到伦敦时，整个小组都不见了。我的意思是──成员都不坐在原本的地方。窗边变成坐了一群他妈的销售人员，我们的办公区域直接被搬到交易大厅的正中央。我们赚太多钱，不能再躲在角落。他们希望我们就在他们抬头就能看到的地方。", "我为失去靠窗的座位感到难过，但更糟糕的是，我失去比尔旁边的座位。", "查克在我还来不及说什么之前，就把我拉进办公室。比尔即将进入半退休状态，他将不再为英镑换汇交易报价。他要移到角落的位子，只大量押注在英国经济上；史努比则会坐在他旁边，为英镑帐本报价。", "混帐东西。那个时候，我当比尔的掩护交易员已经足足一年。在我忙著把自己从赤字坟墓里挖出来的同时，还在尽心尽力的为他做掩护交易，现在这群混蛋甚至没跟我说一声，就把帐本给史努比。混帐东西。", "他们商量一个计划来安抚我。史努比接手英镑帐本，也表示缺了一个和ＪＢ合作欧元交易的人。他们希望我成为初级欧元交易员。我不想成为欧元交易员，我想成为英镑交易员。是，我知道这地方是个粪坑，但它是我的粪坑。我把我的想法告诉查克，他只是不停的摸自己的下巴。", "我两天没和比尔说一句话，我没和任何人说一句话。我想我就是在那时开始出现折断笔的习惯。连续两天英镑和欧元的报价都是史努比在做。最后，比尔将我拉进一个房间，警告我不要再耍脾气。", "这就是我变成初级欧元交易员的始末。", "初级欧元交易员是一份好工作。洪哥是除了比尔之外，唯一一个能在一年内赚到一亿美元的交易员。他之所以能做到这一点，就是因为他是初级欧元交易员。这里点出一个问题：如果初级欧元交易员这么好，为什么他妈的他们要把它塞在我手里？", "答案是，初级欧元交易员的工作量实在太大。", "它的工作流程如下：初级欧元交易员只为非常短期的欧元换汇交易提出报价，一个月或更短；资深欧元交易员则负责所有其他部分。短期换汇交易的风险低、利润低，没什么好令人兴奋的，但它们的数量非常、非常的庞大。", "正如我们之前讨论过，企业、退休基金和对冲基金都会利用换汇交易来借钱。不过，换汇交易被视为短期工具，主要为一年期或更短；另一方面，企业需要借钱的时间通常更长。这并不是什么问题，因为你可以一次借三个月，然后三个月到了再借一次。有些公司选择按季进行交易，有些选择每年或每半年进行交易，不过也有些公司则选择每周、甚至每天交易。如果你一次借钱六个月，一年只需要进行两次交易；但如果你每天借钱，你一年就需要进行两百五十次交易（假日和周末不营业）。这就是初级欧元交易员的工作量为什么这么他妈的多。同样风险的交易金额，ＪＢ每年可能只需要做二到四次交易，我却需要进行两百五十次。毫不夸张的说，初级欧元交易员进行的交易数量比小组所有其他交易员加起来的还要更多。如果你能坚持，你确实可以赚很多钱。重点在于，你要能坚持下去。史努比和洪哥放弃这本帐本不是没有原因的。", "我就这样成为欧元交易员。但我来这里并不是为了一个头衔，我来这里是为了成为世界上最棒的交易员。所以，我接下来又该如何安排？", "首先，我必须想办法移动座位。他们安排给我的新位子介于ＪＢ和查克之间。我爱ＪＢ，也爱查克，可是我还是想换位子。但ＪＢ总是在我耳边喋喋不休，查克则一直散发「与其他世界交流」的冥想气息，两者都很干扰我繁忙的日常。我告诉查克，我需要一个属于我的后辈，我打算要和他一起坐在小组办公区的末端。", "我相中的新人是蒂兹．拉扎里。", "蒂兹．拉扎里的真名是法布里齐奥。我故意叫他蒂兹，因为他讨厌这个暱称。", "二○○九年，二十二岁的蒂兹以暑期实习生的身分，穿著世界上最闪亮的银色西装，出现在我们的小组。当查克要求他把他故意留的短胡须刮干净，免得看起来邋邋遢遢时，他拒绝了。我当场就决定我想要这个孩子当我的部下。", "蒂兹的外型和脾气都可以用满身硬毛和精瘦来形容。尽管他颇为帅气，却会让人联想到老鼠，总是一天到晚不停的与我、史努比争论不休。", "蒂兹习惯喝单份义式浓缩咖啡。史努比告诉他，双份义式浓缩咖啡只贵十便士。蒂兹回答说他知道，但他只想喝单份的。史努比告诉他，如果他喜欢单份浓缩咖啡，他可以买一杯双份的，然后将一半倒入一个单独的杯子里，这样他就有两杯，每杯只要六十五便士，比买一杯一．二○英镑划算多了。蒂兹承认在数学计算上，史努比的理论是对的，但他坚信，对他来说，喝一杯就够。史努比听了之后很不高兴，他说这不合理，因为他明明看到蒂兹在前一天喝了四杯浓缩咖啡。「是的，」蒂兹回答：「可是如果我把它放在旁边两小时，咖啡就冷了，不是吗？」史努比说他可以拿去微波炉加热。他们就这样争论一个小时。", "他喜欢和我争论经济学，我们常就经济问题争辩不休。蒂兹毕业于米兰的博科尼大学。基本上，那就是义大利的伦敦政经学院。不过从蒂兹的表现来看，博科尼似乎尚未成功的向学生传达伦敦政经学院的核心讯息：经济学学位不过是进入银行业工作的彩券。蒂兹仍然太过在乎理论、在乎学说！", "你能想像吗？可怜的蒂兹。在银行里，二十多年来都没人在乎那些垃圾。", "那么，我为什么想要将这个邋邋遢遢、穿著银色西装、把钱浪费在咖啡上的义大利人留在身边呢？其实只是因为我喜欢和他争辩。我的家族里也有几个义大利人，我一直喜欢故意惹恼他们。怎么说呢？我天性如此。我喜欢看著他因辩论通货膨胀的本质而怒气冲冲，或者在足球赛进行到一半时生气大喊我们连为他擦鞋都不配（公平一点讲，他说的可能没错）。", "但这些都不是我想要蒂兹的主要原因。我想要蒂兹，因为他是街头代言人。", "我这里说的可不是拿坡里的后街，蒂兹其实更像是精致优雅的科莫湖＊类型。我这里指的是华尔街。", "蒂兹总认为市场是正确的。自始至终。就像他一直认为课本上写的都是对的。我认为他有某种根深柢固且与生俱来的渴望，想要相信、依靠更高级的智慧。他相信楼上的管理高层有能力控制一切。上帝保佑他，他的父亲显然是个好人。", "这正是我想要的。我想要一个会在早上读《金融时报》，然后花一整天的时间打电话给他商学院同学的孩子。", "让我向你解释一下原因。", "当我惨赔八百万美元时，我意识到一件事：你不会因为模仿别人而成为任何领域的佼佼者。我无法藉著模仿比尔，变成比比尔更好的交易员；我也不会因为模仿史宾格勒，变得比史宾格勒更棒。说到底，当事情发生时，我被强制停损，但其他人没事。比尔和史宾格勒并没有来救我。这就是你在模仿别人时会得到的结果。二手战术，二手技巧。完全不够好。", "我需要一些只属于自己的东西。", "当比尔把教科书从我手中夺走，扔进垃圾桶时，我便意识到我需要的是什么。", "没错，比尔对教科书的看法是正确的。它们全是胡说八道。教科书是给孩子看的。如果你想了解真实的世界，在觉醒的那一刻，你必须亲眼去看它、感受它。属于我的那一刻已经来临。", "富有的爸爸。私立学校。普林斯顿金融学会。花旗银行。", "代数。微积分。分析力学。数学证明。", "交易大厅里大多数的笨蛋仍然活在他们爸爸的保护伞下。他们相信所读到的一切，接受所听到的每一句话。他们为什么不呢？这么做让每个人都拿到分红。这就是为什么比尔能够年复一年击败他们的原因。", "但是在比尔把我的书丢进垃圾桶时，我却发现另一个事实。我从他的眼睛里看到的事实。", "你知道吗？当我们在学术城堡里背诵代数时，在排队进入金融协会活动会场时，十几岁的小比尔并没有做过这些事。他在约克郡荒凉的乡下，坐在一片大玻璃后面，将一把一把的现金递给客户。他是一名出纳，一个收银员。", "比尔从未拥有那些教科书。", "我当时看得出来：比尔其实很嫉妒。", "现在，我要告诉你一个关于交易的秘密：交易能够获利并不是因为你是对的，而是在每个人都错了的时候，你是对的。", "比尔是对的。年复一年，比尔都是对的，但他什么时候才赚到大钱？只有在其他人没有预见到的事情发生，当全球银行体系崩溃时，他才赚到大钱。", "当人们出错时，他们的预测也是错的。当人们的预测错误，他们给的价格也会是错的。当价格错误时，我们就能赚到数百万美元。", "比尔能够年复一年的在其他人都看错时还能眼光独到，是因为比尔知道经济是真实存在的。经济就是人、房屋、企业、贷款。其他人在受过学术训练后，早已习惯性的将经济视为数字。除此之外，在这些交易员的生活中，如果不计入打扫阿姨，他们认识的人里就没有一个不是有钱人。他们对现实世界又能有多少了解？", "这是比尔和我相对于他们的优势之一。我们不必去问清洁工也能看到世界的真相。", "不过我还有别的东西，比尔从未拥有过的东西。比尔知道他周围的人全是白痴。但我上过大学，我学过这些课程，我记得教科书上的知识。我看过白痴的黑暗心理。我认得它，它的味道，它的口感。", "最好的交易，要靠你的鼻子才能达成。必须找到散发「愚蠢」味道的交易。", "那时，二○一一年初，整个世界都散发那种臭味。", "你瞧，二○一○年发生一件令我耿耿于怀的事。", "利率全年保持为零。", "这对你来说可能毫无意义。毕竟在过去近十五年来，利率一直维持在零。零利率对你来说很正常。", "可是，当时它们并不正常。", "更重要的是，没人预测到事情会变成这样的。", "二○一○年初，每个人都认为那年的利率会回升。每个人在二○○九年时也都这么想。", "可是利率并没有上升。连续两年，每个人都错了。", "为什么？", "好吧！我读过教科书，就像蒂兹和华尔街上每个穿粉红衬衫的白痴一样。让我告诉你他们所相信的理论。", "利率控制经济。如果你控制利率，你就控制经济。我们很擅长这一点，我们已经很妥当的控制这一点。", "人们有时会失去信心，停止消费。当人们停止消费时，企业就会失去顾客并倒闭。这表示人们失去工作，消费金额压缩得更小；同时也这表示更多企业倒闭，可能导致失业率和贫穷迅速上升。如此一来，可能会导致国家经济崩溃。一九三○年代的经济大萧条就是这么来的，最终导致欧洲法西斯主义的崛起和第二次世界大战的爆发。", "这种情况在二○○八年很可能再次上演，但它没有发生，因为我们已经知道如何控制它。我们知道该怎么处理这个问题。当这种情况发生时，我们会降低利率。降息是件好事，因为它会降低储蓄的吸引力，降低借贷的成本，因此人们和企业会减少储蓄，增加借贷和消费。如此一来，问题的根本原因，也就是人们停止消费，便被完美抵消。透过对利率的积极管理，这里调整一点，那里调整一点，我们总是能够达到刺激经济的最佳结果，也就是所有可能的结果中最好的一个。", "经济学家早在二○○八年就对自己实现这个目标的能力充满信心。在那之前的二十年，被公认是经济学家最成功的黄金时代，在此期间他们成功的：", "1. 战胜通货膨胀。", "2. 结束景气循环。", "3. 实现经济持续成长。", "所有的一切都是透过利率管控的奇迹，才得以顺利实现。", "考虑到世人已普遍接受的利率策略的美妙之处，面对二○○八年大规模且无人预期的金融危机时，经济学家们会一致同意最正确的应对措施就是大幅削减利率，并不足为奇。利率因此被大幅削减。在此之前，各中央银行行长会采取的措施不过是将利率从五．七五％减至五．五％之类的，但是到了此时，他们却会将利率直接从五．五％砍成零。这种情况在已开发的富裕国家屡见不鲜。", "每个人都相信它会起作用。", "我不想讲太多细节免得你觉得无聊，简单的说，大幅削减利率等于多印钞票。中央银行降低利率的做法就是等同印出大量现钞，然后以超低价格贷给银行。", "每个人都非常有信心，这么做一定会起作用。", "当时班．柏南克的一句话，或许可以很贴切的表达人们对这计划的信心程度。学界出身的（前普林斯顿大学教授、哈佛大学硕士、麻省理工学院博士）班．柏南克是当时的美国联准会主席，是公认世界上最有权势、最聪明的经济学家。他是这么说的：", "「美国政府拥有一种技术，我们称之为『超级印钞机』，", "它可以在几乎无成本的情况下制造出任何你想要的数量的美元……", "在纸币体系下，决心坚定的政府总有办法进一步提高支出。」", "每个人都非常相信它一定会起作用。", "可是，它失败了。", "这就是为什么我想和蒂兹．拉扎里坐在一起。我想和蒂兹．拉扎里旁坐在一起，因为蒂兹是错的。", "好吧！理由其实和蒂兹．拉扎里个人无关，而是与整个市场有关。到二○一一年初，我开始清楚的意识到市场错了。不只是市场，还有经济学家、大学研究所、英格兰银行他妈的货币政策委员会、新闻里的白痴专家、整个他妈的狗屎世界，全错了。", "这些混蛋认为的所有事情，全是错的。从我出现在交易大厅的那天起，每一件该死的事，都是错的。我初次踏足大厅时，每个人都认为那些穿粉红衬衫的白痴是天之骄子。接下来，那些家伙只用数学、愚蠢和傲慢就毁掉全世界。接下来两年半，全世界的每一位经济学家都在不断预测什么时候经济会复苏，可惜它从未发生。有一天，我坐下来研究利率预测的历史资料，发现每个预测都比实际高出许多。他们看错一切。我们看错一切。", "我必须找出原因。", "这就是为什么我需要蒂兹。我需要衡量真正的经济与学术界之间、现实世界与市场之间的距离。基于这个原因，我需要一个刚从大学毕业、完全信奉学说的人陪在我身边。一个了解每一种经济理论，阅读每一份商业报纸的人。一个朋友都刚从商学院毕业、父亲会从游艇上传讯息问他股票内线交易的人。一个穿著银色西装、对学术盲目崇拜的人。", "是的，我需要蒂兹。我需要蒂兹，因为他是错的。", "小节 2", "在二○○九年、二○一○年、二○一一年时，人们到底为什么不消费？蒂兹认为它是一场信任危机。二○○八年发生的事对体制来说是个巨大的冲击。消费者信心受到严重的打击。现在，到了二○一一年初，信心回归，两年多过去，人们已经准备好，要再度出门消费。", "我想，这是一种看法。", "比尔怎么想？", "银行系统的崩塌使得人们深受其害。许多人失去家园和工作，但这些房屋现在有新的人接手，失业率在下降，通货膨胀在上升。既然银行体系已经修复，经济和利率的反弹只是时间问题。", "我想，这是另一种看法。", "七年后的二○一八年，在我有机会请教系著蛇皮腰带的牛津大学总体经济学教授安东尼奥．曼奇尼时，这位有钱的教授告诉我：「我们一直都知道利率会维持在零！人们的消费储蓄偏好受到巨大的冲击！」", "嗯……我想，这也是另一种看法。", "ＪＢ曾用一句话形容什么是「看法」，他说：「看法就像肛门，每个人都有自己的一个。」", "我问哈利．桑比。哈利还只是个孩子，他脚上的鞋子有破洞，不时跳过地铁闸门逃票；这就是为什么他不花钱。我问阿萨德，阿萨德说，他妈妈卖掉家里的房子来养活他和他的姊妹，现在他睡在沙发上，想先存点钱当租屋押金；这就是他们不花钱的原因。我问艾丹，艾丹的妈妈失业，虽然知道现在房贷利率更低，却无法重新贷款，如今每个月要付的房贷金额高得不得了，艾丹却只能一个人扛下；这就是他们不花钱的原因。", "他们正在失去他们的家，我甚至没有注意到。", "我想，看法的确像肛门，每个人都有一个。", "在二月的一天下午，我坐在办公区，决定在蒂兹身上测试一下。", "「蒂兹。你认为人们不敢消费的原因，会是因为没有人手上有钱吗？」", "「你他妈的在说什么，Geeza（老兄）？怎么可能没有人有钱？」", "他的英文带著浓浓的义大利口音。「Geeza」是他最近学到的一个新俚语，他很热中尝试。", "「嗯，你知道的，我最近一直在问周围的人，他们全都回答我：『我他妈的根本没有钱。』」", "「『我他妈的根本没有钱。』」蒂兹试著模仿我的口音，结果听起来义大利腔反而更浓了。「哎呀，老兄。这是一个货币体系。都没有钱是不可能的，你必须把所有人都加在一起。」他的脚还搁在桌子上，却试图弯下身子从地板捡报纸，结果差点从椅子上摔下来。", "没过多久，花旗银行在伦敦郊外租借一个巨大的庄园，邀请全球的交易员参加会议，一起饮酒狂欢。鼻涕虫来了，我终于明白为什么他们会叫他鼻涕虫；青蛙来了，我终于明白为什么他们会叫他青蛙。", "我们的大老板，也就是鼻涕虫的上司，发表一场盛大的演讲，他告诉我们所有人要勇于承担更高、更多的风险。", "「如果你愿意承担一百万美元的风险，你就该勇于承担一千万美元的风险！」", "银行发给每个人一顶军用迷彩棒球帽，正面印著「要么做大，要么不做」的标语。", "我没有留下来参加派对。我戴上棒球帽，爬进我的小标致一○六，一路开回家。", "回到交易大厅，每个人都依照大老板的吩咐，投下巨额赌注。全都在赌经济即将复苏。比尔赌了，史努比赌了，ＪＢ赌了，查克也赌了。干！连洪哥都赌了，他从来不参加任何赌注的。不仅仅是 STIRT 小组这么做，每个小组都在这么做：即期小组、选择权小组、新兴市场小组，全部加入。我决定继续等。我不喜欢这种氛围。我没赌，所以蒂兹也没赌。", "隔周我被叫去参加一场会议。交易部每两周就有一次所有小组负责人都要参加的例行会议。当迦勒还在时，我必须参加每次例会，并为大家提供三明治。后来换成查克，我从未告诉他关于这个例会的事，我只是默默的继续执行。我不知道为什么，但我总觉得有一天它可能会给我什么助力。", "那周的会议由全花旗银行里我唯一真正尊敬的经济学家主持。他隶属信贷部，我在第一次实习时就认识他。他是提摩西．普林斯。", "提摩西准备一堆图表，他一次讲解一张。每一张都是一个国家的财政状况：义大利、西班牙、希腊、葡萄牙、爱尔兰。还有英国、美国、日本。", "它们听起来像同一个故事的不同版本。所有这些政府的支出，年复一年的超过它们的收入，而且债务也不断增加。如果事情的发展方向不变，它们的债务利率就会开始上升。人们将不再借钱给政府，政府迫不得已只能出售资产。情况将会很糟糕。", "我把没人拿的三明治装进棕色纸袋，带回办公区。", "我无法把听到的内容从脑海中驱逐出去。不是西方国家福利系统的崩溃，不，我对此并不担心。我无法驱逐的是那种相似感。全都一样：西班牙政府、美国政府、日本政府。情况就像阿萨德的妈妈，就像艾丹的妈妈。支出超过收入，失去借钱的能力，愈来愈多的收入用在偿还债务上，逐渐失去资产。情况是一样。破洞的不只是哈利的鞋，还有整个世界。", "不过这显然与蒂兹信仰的经济学智慧相互违背。我们处于更大的货币体系里，整个系统必须永远保持平衡。每出现一个负债的人，就必定会出现一个债主。每个人都在赔钱，就一定有人在赚钱。整个系统就是被设计来维持平衡的。不仅如此，那么那些房子呢？一路上涨的股市呢？这些资产并没有消失。可是如果拥有它们的不是我们，不是其他人，不是政府……那么它们的拥有者又是谁呢？", "我想，我就是在这一刻觉醒的。在被百万富翁和三明治包围的这一刻。", "我转头看我的左边：粉红衬衫、粉红衬衫、白衬衫、淡蓝衬衫。我转头看我的右边：白衬衫、白衬衫、粉红衬衫，喔，细条纹衬衫，嗯，这种现在已经很少见了。他的衣领上用绣著四个字母「A.I.E.Q.」，谁他妈的姓氏是以Ｑ开头的？", "全是百万富翁。他们之中的任何一个。", "我也是。什么？你怀疑我？没过多久，我的资产确实超过百万。", "是我们，就是我们，不是吗？我们就是维持平衡的那个点。在一个充满穷孩子的世界里，我们比我们的上一代更加富有。我们的银行帐户余额不停的增加，平衡义大利政府的债务。我们赚走艾丹妈妈付出的高额房贷利息，艾丹本人现在也必须继续将利息缴给我们，缴给我们的孩子，也包括我的孩子。也许他们会拥有阿萨德的妈妈不得不卖掉的房子。还有那栋房子的租金，还有义大利政府付的利息。也许我们的孩子可以把钱贷给阿萨德的孩子，然后我们就同时拥有房子和债权，而且它还会不断成长，这就是复利的作用。我们会利用从资产收到的现金购买剩下的资产。你会将资产卖给我们，以支付你的贷款、你的房租。付钱给我们。事情就是这样。情况会变得愈来愈糟。它会成长，成长到失控的地步。这不是信任危机，这不是银行体系问题，这不是「对消费储蓄偏好的外来冲击」。这是贫富不均。贫富不均的现象会愈来
