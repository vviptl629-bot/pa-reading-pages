他的律师们与霍根的团队协商和解方案。", "据纠纷双方的知情人士透露，一开始，这位摔跤选手似乎愿意甚至热切地想要和解，至少在某一时刻，他已经同意通过赔偿金解决。但是，就在和解即将达成的时候，他的律师不见了，然后又回到谈判桌前宣布和解失败。这让高客传媒的员工感觉有人在做局。", "高客传媒的保险合同并不包含侵犯隐私的诉讼，但这家媒体网站还有一个普通责任保险，可以保护它免遭人身伤害索赔。而且，在努力争取法院驳回霍根诉讼的同时，该公司也曾与责任保险公司抗争，主张因为霍根曾申请“精神伤害”保险，所以责任保险应该理赔。但接着霍根做了一件出乎意料的事：2014年12月，他主动放弃了对高客传媒引起他情感困扰的声索。", "这对高客传媒是一大打击，并且有效地扼杀了保险赔付的机会。这一点也非常奇怪。通常情况下，如果原告还想要得到最后判决或实现和解，是不会想要把被告搞到破产的，但霍根突然表现得好像非把高客传媒搞破产，而不是得到大量的现金赔付。他为什么要试图限制高客传媒向其支付的能力呢？", "还有一点让人想不明白，哈德公司手上的案子很少，但预算似乎要多少有多少。在出庭时，霍根的律师会住在这个城市最高档的酒店。这些钱是从哪里来的呢？难道有人因为霍根提起诉讼给他补偿吗？", "2015年年初，高客传媒的记者开始调查此案。他们想知道，霍根打官司是自己掏腰包付律师费吗？若不是，那会是谁呢？高客传媒的记者开始拼凑其雇主的敌人名单。", "瑞安·霍利迪的书中顺带提到了高客传媒还有其他敌人。这些人中包括影响力越来越大的查尔斯·约翰逊，他与年轻的另类右翼运动成员过从甚密。这场运动既充满恶意和愚蠢，又危险至极。该运动的成员跟种族主义甚至纳粹主义眉来眼去，激怒了自由派，其领导人则利用社交媒体攻击所有他们认为属于中左翼主流的人，其中包括民主党人士、“黑人的命也是命”运动分子及相当一批高客传媒的写手。蒂尔宣称这帮家伙也让他感到十分厌恶，他对霍利迪说：“就是这些人，不是说他们愿意以意识形态的名义做任何事情……看似相同的就是这个虚无主义——一副根本没有意识形态的面具。”霍利迪指出约翰逊也曾起诉高客传媒，但称他为“与彼得·蒂尔毫无瓜葛的”几个人之一。", "这即便不是谎言，也是一种非常谨慎的遁词。在现实中，约翰逊和蒂尔关系密切已近十年，而且时至今日，约翰逊已是一个重要的政治顾问和知己，还即将在针对高客传媒的行动中承担角色，其重要性可以说与德索萨不分伯仲。他们初次相见是在2008年，当时约翰逊还只是一名19岁的大学新生，两年后，在保守的克莱蒙特研究所举办的一次会议上，他们建立了联系。像蒂尔的许多追随者一样，约翰逊才华横溢，但好斗、喜欢长篇大论，并对周围的自由主义世界感到愤愤不平。", "约翰逊在中产阶级聚集的马萨诸塞州米尔顿长大，那里是波士顿城外的郊区，他获得了当地一所预科学校的部分奖学金。他在米尔顿高中学习成绩优异，该校是当地每年学费为2.5万美元的常春藤盟校的新生输送者。（现在这个学费价格已经翻了一番。）这一转变并不容易。他认为自己是跻身在银行家子女中的平民小子，也许正因为如此，他采取了一种强烈的、对抗性的保守主义，这是《斯坦福评论》的读者都熟悉的。", "在学校曲棍球队的5名队员因与15岁的高中二年级学生发生性关系而被开除后，约翰逊在学校大会上为他们辩护。他还引发过另一场丑闻，当时，他在一个网上论坛为比尔·贝内特的有关言论辩解。2005年，蒂尔在教育部的这位老上司曾建议医生们“将美国所有的黑人胎儿都流产”（贝内特狡辩说这只是一个思想实验，而不是严肃的政策方案）。令人难以置信的是，在因O.J.辛普森被判无罪而出名的哈佛法学院教授艾伦·德肖维茨来校演讲之后，约翰逊居然和他成了朋友。", "从米尔顿高中毕业后，约翰逊进入了克莱蒙特麦肯纳学院，这所位于洛杉矶郊外的文理学院以培养右翼知识分子而著称。在那里，约翰逊开设了博客“克莱蒙特保守党”，并逐渐确立了校园右翼煽动者的身份。有一次，他在一个网上论坛发表的有关同性婚姻的评论被该论坛的学生版主删除，他说这个名叫罗斯·布默的学生版主就是同性恋，所以才会带有偏见。布默认为这只是一次尝试，因为他的家人不知道他的性取向。当《琼斯夫人》杂志报道这件事时，约翰逊说他以前并不认识布默，布默的情况对其同龄人是公开的，却瞒着家人。约翰逊说，他的同班同学“像同性恋一样在校园里到处乱跑”。多年后，约翰逊告诉我，他对这件事感到后悔，觉得这件事被放大了。在这些年里，约翰逊还将自己沉浸在保守的知识分子生活中，参加专门讨论斯特劳斯和马基雅维利著作的研讨会。正是在他大三即将结束时的一次研讨会上，他第一次与彼得·蒂尔进行了长时间的深入交谈。在一次酒宴上，他们讨论了对精英机构，尤其是自由派大学的共同敌意。", "约翰逊毕业后和蒂尔一直保持着联系。他定期为塔克·卡尔森的保守派新闻栏目《每日传讯》撰稿，并出版了一本关于卡尔文·柯立芝的书。此时，约翰逊在右翼圈子里的影响力已经上升到如此高度，以致卡尔森、参议员特德·克鲁兹及为布什政府在伊拉克战争中实施的酷刑辩护的律师柳约翰等人都纷纷发声为其背书。约翰逊终于创立了属于他自己的网站GotNews，有点儿右翼的“高客传媒”的意思，他在此引发了针对迈克尔·布朗案的一大反转，这位18岁的黑人男子在未持有武器的情况下被一名警官开枪射杀于密苏里州的弗格森，引起了一波“黑人的命也是命”的抗议。约翰逊起诉圣路易斯县，要求其提供未成年人法庭记录中涉及布朗的内容，但这一请求被拒绝，因为法官说布朗并不存在重罪记录。此外，约翰逊还搜集了显示布朗有“暴力倾向”的截图。他声称自己的信源人士说布朗是黑帮成员。", "2014年年底，约翰逊报告说，《滚石》杂志上一篇描述弗吉尼亚大学一起所谓的轮奸案的文章存在缺陷，而且没有证据。当年12月，他打破了新闻和执法部门长期以来的禁忌，公布了受害者的全名并附上了一张照片，他说这张照片是她在一次反性暴力集会上的照片。约翰逊似乎没弄错名字，但照片看走眼了，照片上的并不是受害者。他为照片的事道了歉。", "这引起了高客传媒的注意。就在约翰逊曝光上述受害人姓名之后不久，高客传媒就以“约翰逊是干啥的，为什么这样？”为题发帖，将他说成“互联网上最糟糕的记者”。六天后，该网站又发布了一篇帖子，其中包括一系列传言，约翰逊全部予以否认，这些传言来自匿名人士。这篇帖子试图让约翰逊尝一尝“以其人之道还治其人之身”的讽刺味道，其中一篇声称他在大学宿舍的地板上大便，另一篇指他有兽交行为。“没有证据表明，约翰逊在2002年因把一只羊绑在栅栏上奸淫而被捕，”高客传媒的记者J.K.特罗特写道，“然而，约翰逊就是那种家伙，随便什么人都会针对他编造和散布谣言。”", "约翰逊在推特上向高客传媒宣战，猛烈地攻击特罗特和丹顿。“你们肯出多少钱来结束一个自由主义记者的职业生涯？”他一度问道。他执迷于这项事业，即谴责高客传媒毁掉了他的婚姻，并向朋友们保证他一定会以牙还牙地干掉这家媒体。“我讨厌他们！”他说。2016年年初，在高客传媒从与普京关系密切的亿万富翁维克多·维克塞尔伯格那里筹集到资金之后，约翰逊发布说高客传媒与俄罗斯情报部门有联系。大约就在此时，蒂尔的老朋友、20世纪90年代末曾在蒂尔的对冲基金工作的杰夫·吉西亚通过推特与约翰逊取得了联系，告诉他应该和彼得·蒂尔好好谈谈。", "他们第二次共进晚餐是在蒂尔的旧金山家中，坐在桌边的还有布莱克·马斯特斯和其他几位蒂尔的员工，约翰逊一眼看出了玄机。“你在资助各方起诉高客传媒。”他说，眼睛直视蒂尔的眼睛。", "“我……”蒂尔磕磕巴巴地说，脸涨得通红，也承认了，但请约翰逊保守秘密。约翰逊告诉他，自己也想加入。“这个我在行！”约翰逊说。", "两人同仇敌忾，见面和交谈更加频繁。在对抗高客传媒的行动中，约翰逊成为第二大助力。在蒂尔位于洛杉矶和旧金山的家中，他们时常在一起吃晚餐和早餐，通电话——有时一打就是好几个小时。蒂尔觉得约翰逊既可怕又有趣。每当约翰逊大嗓门地描述他幻想的尼克·丹顿之死，或者解释彼得为何应将“20岁以下20人”计划改为“20岁以下20个100万”计划，又或者他是多么不在意“蒂尔江湖”的其他成员时，蒂尔就会说：“查尔斯，你简直太绝啦！”", "约翰逊当然也可以像蒂尔的其他跟班那样奉承他，他管他叫“蒂尔老师”，但又不像“蒂尔江湖”里的其他圈内人，他更愿意当面让蒂尔出丑。约翰逊会对彼得说，科技公司都是寄生的，也就是指那些蒂尔建立起来的公司及他圈子里的所有人尊敬的公司。当蒂尔阐述完一个观点时，约翰逊会告诉蒂尔说他简直就是在“胡说八道”，而疯狂的是，蒂尔对此似乎并不介意。", "蒂尔身边的许多人很担心约翰逊的网络形象会在公开场合伤害到蒂尔，但他们更有可能是对约翰逊的影响力越来越大感到愤愤不平。尽管反击高客传媒的行动在名义上仍然由德索萨负责，但约翰逊开始提倡更强硬的策略。", "与德索萨“一丝不苟地坐实案件，并不惜一切代价保守蒂尔的秘密”的计划不同，约翰逊更倾向于开打“全面战争”。他在社交媒体上嘲讽奚落高客传媒的高管们。高客传媒的总法律顾问希瑟·迪特里克在一次和解谈判中情绪失控，指出如果霍根把高客传媒搞垮了，大家都会丢了工作的。这个说法当然不成立，也不知怎么的，有些话传到了约翰逊耳朵里，于是他在推特上表示，听说高客传媒的律师一直在哭。", "有了蒂尔撑腰，约翰逊开始在全美各地奔波，寻找任何被高客传媒欺负而愤愤不平的人和地方。其中包括《商业内幕》杂志前高管帕克斯·迪金森，在高客传媒的记者挖出其在推特上常以粗鲁的方式攻击女权主义及警醒文化后，他被解雇了。迪金森曾在一篇推文中使用侮辱非裔美国人的单词，并在一篇深情回顾蒂尔论文的推文中写道：“女性选举权和个人自由是不相容的。”对约翰逊有潜在帮助的还有霍安·同—代特，他是一位年轻的互联网开发人员，后来成为勇于挑战极限的企业家。高客传媒不仅当众嘲笑霍安创建的应用是垃圾，还拿他在推特上的自我介绍说事，指他把自己称为“无政府主义的变性人”。用欧文·托马斯的话说，他就是“典型的旧金山软件开发人员”。约翰逊跟霍安成了朋友，顺带还有迈克·切尔诺维奇，他也是一个保守派，高客传媒攻击他支持所谓的男性权利运动“别再当基佬了！”切尔诺维奇曾在推特上写道，“谁会在乎乳腺癌和性侵？反正我不会。”切尔诺维奇在约会性侵问题上的立场与蒂尔和戴维·萨克斯在《多元神话》中表达的观点大致相同，但他后来删除了这条推特，转而关注起政治来。", "蒂尔对约翰逊行动主义的个人风格非常满意，乐意向他提供资金支持。约翰逊被推特禁言的原因是他提议为一个项目筹集资金，目的是要揪出“黑人的命也是命”运动的组织者德雷·麦克森，他创建了众筹网站WeSearchr，与同是众筹网站的Kickstarter不同，WeSearchr宣扬自己是不受监管的，因此对另类右翼的内容完全开放。大约在这个时候，蒂尔给了他一张10万~20万美元的支票。约翰逊说，这只是一份礼物，算不得投资，但对蒂尔来说，这就是一种尴尬。后来，约翰逊在红迪网上表示，犹太人在大屠杀中死亡的人数远低于600万，随即引起了人们的关注。而且，他的众筹公司将帮助新纳粹主义网站“每日冲锋”筹集15万美元。就像1992年的拉布瓦一样，约翰逊说这两起事件都是挑衅，就是想检验一下言论自由的底线。他在红迪网上的评论是一场表演，旨在确定该网站是否会审查其用户；他的众筹网站对所有意识形态开放。约翰逊说，这两件事都并不反映其真实的信仰。", "这种怪诞的形象让蒂尔感到不舒服，但它也带来了好处。第二年，就是约翰逊把蒂尔带进了唐纳德·J.特朗普的圈子。", "蒂尔从未完全接受另类右翼。“他认为这些人都是失败者，”约翰逊说，“但他也发现他们很有趣，甚至可能还有潜在的价值。”2015年，蒂尔与马库斯·爱泼斯坦建立了友好关系。爱泼斯坦是致力于反对种族多样性的活动组织“西方文明青年力量”的创始人，也是极右翼网站VDARE的写手，该网站2005年左右在克莱瑞姆的员工中很受欢迎。爱泼斯坦还成立了另一个组织——罗伯特·A.塔夫脱俱乐部，成员包括著名的白人民族主义者凯文·迪安娜和理查德·斯宾塞。爱泼斯坦坚决否认自己的文章是种族主义的，但是在2007年的一个晚上，他在华盛顿特区散步时偶遇一名黑人女性后辱骂她。然后，他靠近这名女子（她的姓名由警方保密），根据一份法庭文件表述：“辱骂后，他用空手道招式劈砍了这位女士的头部。”爱泼斯坦提出了所谓的阿尔弗德抗辩，本质上是承认案件，但不承认罪行。", "2016年年中，蒂尔与迪安娜共进晚餐，迪安娜是塔夫脱俱乐部的共同发起人，也是在VDARE上发稿活跃的写手。南方贫困法律中心认为迪安娜是白人民族主义运动重要的“意识形态设计师”。在此前后，约翰逊安排蒂尔与米洛·扬诺普洛斯会面，此人是布赖特巴特新闻网的科技编辑，因帮助推动玩家门事件而出名，该事件导致新闻和电子游戏领域的几名女性受到骚扰。", "蒂尔拒绝与理查德·斯宾塞见面，斯宾塞可能是这个小集团中最臭名昭著的成员。2016年，他曾带领一群人搞了一场胜利万岁礼式的致敬仪式，口中高喊：“特朗普万岁！我们的人民万岁！”约翰逊说：“彼得不是纳粹，但也许是纳粹好奇者。”他后来跟我说自己有点儿故弄玄虚了，其实就是想说蒂尔的知识分子兴趣十分广泛。蒂尔的另一位朋友给出了类似的评价，指出尽管蒂尔会见了另类右派成员，但会面很少有深入的进展。这个人说：“另类右翼的支持率正在上升，他与这些人见面对我来说一点儿也不奇怪，反而更能说明接下来会发生什么。”", "但蒂尔的亲密助手、蒂尔资本早期的员工杰夫·吉西亚认识斯宾塞。据《赫芬顿邮报》报道，吉西亚向斯宾塞的非营利组织国家政策研究所捐赠了5 000美元。前白人民族主义者凯蒂·麦克休后来成了“吹哨人”，称吉西亚是一本广为流传的指南《如何资助另类右翼》的作者，该指南列出了不少团体，其中包括斯宾塞的团体及“每日冲锋”，并解释了对捐款保密的方法。吉西亚否认写过这本指南。", "在这段时间里，蒂尔也与柯蒂斯·雅文走得更近，雅文成为另类右翼的御用哲学家。2014年年末，理想主义少年约翰·伯纳姆与雅文就他们的Tlon公司的管理发生了商业纠纷。三年前，伯纳姆还是蒂尔奖学金项目的代表人物之一。2014年雅文提起的一项诉讼称，尽管他们是权利平等的合伙人，而且伯纳姆还是公司的首席执行官，雅文还是想要解雇伯纳姆。在为自己的理由辩护的法律文件中，雅文说伯纳姆承诺，如果有人要求，他将随时辞职。他还指出，当他们创建公司时，伯纳姆缺乏经验，而且“几乎没有接受过大学教育”。", "从蒂尔奖学金项目的角度来看，这是一种奇怪的抱怨。毕竟，没有大学学历，尤其是对伯纳姆这样一个与蒂尔密切相关的企业家来说，完全是可取的。但当伯纳姆拒绝离开时，雅文的投资者小组，包括蒂尔和另一位自由意志主义风险投资家巴拉吉·斯里尼瓦桑在内，站在了雅文一边。伯纳姆于2013年10月被从Tlon公司办公室调离。一个月后，雅文与蒂尔和其他投资者分享了他所谓的“约翰灾难”的拯救计划，即剥夺伯纳姆在该公司50%的股权。伯纳姆最终离开了这家公司，诉讼也被撤销。", "但这一事件与扎克伯格解雇爱德华多·萨维林类似，不说别的，首先就肯定有损于蒂尔帮助保护创始人权利的声誉。他不仅是赶走一位创始人行动的同谋，而且伯纳姆还是他年轻的门徒之一。人家放弃了大学，甚至放弃了一切，只为和这位伟人一起追逐梦想。然而，蒂尔竟然站在了雅文一边，而雅文是一个拥护奴隶制的人。或许这也是蒂尔真正的信仰？难道他真有什么信仰吗？", "泰勒·考恩是乔治梅森大学的经济学家，还经营着由蒂尔提供100万美元种子资金成立的风险公司Emergent Ventures。"], "wcount": 12744}, {"icon": "14", "title": "第14章 未来主义的后备计划", "paras": ["当地人称之为“等离子屏屋”，它被嵌入在皇后镇的山上，可以俯瞰世界上最美丽的地方之一——瓦卡蒂普湖，这是一个很深的冰川水体，一直伸入新西兰崎岖不平的南岛山脉。“等离子屏屋”这个称谓源自该房屋的突出特点：一个长度15米左右的落地窗，从外面看有点儿像一块巨大的平板电视屏幕。彼得·蒂尔买下这幢房子后又增加了一样东西：避难密室。", "他在世界各地都有家宅，日本，巴西，美国的纽约、旧金山、洛杉矶，生活得很滋润。除了不断的人际交往，蒂尔还参加聚会。这些并不是充满渴望的企业家们摩肩接踵的“绝望之夜”；两名知情人士透露，这些人都是暴怒之徒。虽然不清楚蒂尔参与这些纵欲狂欢到什么程度，但当时他仍在和丹泽森约会。他往往会带着一群帅气的年轻男子随行，然后就消失在某个密室中。", "他在新西兰的房子，以及后来在往北约65千米购置的大约2平方千米的农田，并不是用来开派对的；正如避难密室本身就表明的那样，这一切都是为了避祸逃生。与其社交圈子中的许多人一样，蒂尔也多少是个“有备者”——这个词专门用来描述那些相信世界或者至少文明的末日会在其有生之年到来的人，所以他们囤积黄金和武器，有的时候就放在地下的保险密室里。换句话说，这是另一种对冲，而新西兰地处偏远，通行英语，而且当时的政府是由一位富有的前外汇交易员约翰·基领导的右翼政府，所以对于一位有偏执倾向的保守派亿万富翁来说，这里就是一个极具吸引力的目的地。蒂尔要找的不只是一个地堡，他想要一个后备国家。", "但蒂尔在公开场合对此从未吐露半个字。就连在那次和泰勒·考恩一起做问答活动时，尽管当时已经说到新西兰，他也压根儿没提到他的新西兰国籍。他成为美国军方重要的软件供应商，并且是极右翼政客的赞助人，这些政客抨击周游全球的精英，这在非逆向投资者看来可能是前后矛盾的。另外，抛弃美国的想法在“蒂尔江湖”中已经流行多年。这为蒂尔在PayPal的大部分工作奠定了基础，PayPal承诺所有人的瑞士银行账户都无法追踪，并预示着更广泛的“对民族国家的侵蚀”。当然，这也是“海上家园”的基础之一，那些“海上家园”的支持者都希望他们那锚浮于公海之上的定居点可以为居民提供避税庇护（以及为制药公司希望在不受监管的情况下进行人体实验提供总部基地，当然还有许多其他想法）。", "蒂尔从1997年的《主权个人》一书中了解了这个概念。这本书是他最喜欢的书之一，建议精英们寻求外国公民身份，把自己从国家意识的过度负担中解脱出来。这本书的影响在蒂尔的朋友巴拉吉·斯里尼瓦桑的一次访谈中也有所体现。斯里尼瓦桑是一位自由意志主义风险投资家，曾与蒂尔一起投资过柯蒂斯·雅文的公司。2013年，在Y Combinator为年轻企业家举办的一次活动上，斯里尼瓦桑曾将“民主参与”（即他所说的“发声”）与离国或移民（也可称“退出”）区分开来。他提倡听众考虑后者，通过创办能够成功抵制监管的公司，甚至完全离开自己的国家，来摆脱自己身上的传统公民身份的束缚。", "蒂尔的退出计划始于2010年，当时他开始对新西兰高新技术规模很小且相对鲜为人知的状况产生兴趣。那一年，这位“PayPal黑帮”的大佬向惠灵顿一家名不见经传的会计软件制造商投资了300万美元。《商业内幕》杂志一位友好的记者出面解释说，蒂尔喜爱新西兰，而且“显然会长期待在新西兰”。这篇文章称，蒂尔正在启动一个新西兰风投基金Valar Ventures，以寻找更多的交易，所有这些都是他把这个国家变成其梦想的自由意志主义乌托邦的计划的一部分。2011年4月，蒂尔开出一张80万美元的支票，用于基督城地震灾民的救援工作。这两项投资和捐款都不符合蒂尔的性格，他很少会把钱花在商业软件上，而且迄今为止他的几乎所有慈善行为都是明确地跟意识形态有关。（卡特里娜飓风造成的死亡人数是基督城地震的10倍，如果说他曾为新奥尔良的灾后重建工作提供援助，那他也一定是私下做的。）2011年夏，蒂尔飞往奥克兰参加一个由政府支持的、非营利组织举办的会议，该组织致力于支持新西兰的创业精神。具有讽刺意味的是，蒂尔14分钟的演讲聚焦于全球化的危险，这是这次活动的核心。", "现在回想起来，蒂尔对新西兰及其高新技术领域的兴趣似乎并没有那么真诚。尽管有《商业内幕》杂志的报道，但Valar Ventures在新西兰并没有员工，而是由一群忠实亲信在管理，其中包括他交往多年的男友马特·丹泽森，以及创办了Frisson并在其对冲基金工作的助理安德鲁·麦科马克。当时，蒂尔正在秘密推动新西兰政府准许他成为该国公民。新西兰拥有世界上最开明的移民法，允许技术工人或任何拥有200万美元以上投资资本的人无限期居留。但要获得完全的公民身份，通常需要有移居新西兰的意向，并要在该国停留很长时间，还要遵守执行蒂尔根本无意遵守的规定。因此，在6个月的时间里，他的律师极力游说新西兰政府，考虑以他最近的投资和慈善记录来折抵相关的法定要求。于是，蒂尔并没有像通常要求的那样在这个国家待够1 350天，而是只待了12天。", "移民官员起初对这一大胆的要求感到吃惊，但在蒂尔和新西兰总理约翰·基坐下来交谈后，他们最终还是同意了。另外，其他政府高层人士也与蒂尔进行了会谈，确保蒂尔同意向一家政府支持的创业资本基金投资。在一个秘密仪式上，这位未来的“美国第一”的民族主义者将在美国圣莫尼卡的新西兰领事馆内宣誓效忠新西兰。", "这实际上是蒂尔对这个国家求爱的终结。Valar Ventures只在新西兰进行了一次投资，并且从未在那里开展过其他业务。蒂尔最终执行了他在这个政府基金所持股份的收购条款。正如《新西兰先驱报》所言，蒂尔“像幽灵一样消失”在他的新祖国。", "在新西兰，为蒂尔快速办理国籍身份的决定将被视为一件丑闻，证明该国实际上是向一位外国亿万富翁卖了护照。在美国，这被解释为蒂尔有备者冲动的表现。记者们写了一些报道，想象他可能会在他新获得的土地上建造地下掩体。然而，那些非常了解他的人怀疑，真正的原因怕是与核战争、疾病大流行或革命的前景并没有什么关系，而只关乎蒂尔最害怕的东西——美国政府。", "对外而言，蒂尔从未像现在这样成功过；从内部来看，他的帝国却很脆弱。2014年，风险投资及其资助的科技行业正在发生变化，这对蒂尔构成了威胁。蒂尔的财富在很大程度上是这样获得的，一方面是培植一个“PayPal黑帮”网络，另一方面利用他的口才和逆向投资本能扩大影响力，而这也为他赢得了接触最有前途的初创公司的机会。但由于有了社交媒体，尤其是推特，建立网络和扩大影响力突然变得更容易，蒂尔也不再是唯一一个被年轻拥趸们追捧的风险投资家。与此同时，富达和老虎全球管理基金等公开市场投资者因受到私募市场的新产物“独角兽”公司增长潜力的吸引，突然开始争夺那些通常是硅谷风投专属领域的公司的股份。为了保持这种势头，同时不让自己在基金中获利丰厚的所有者份额缩水，风险投资家开始筹集越来越大的基金。蒂尔可以玩这个游戏，2014年3月，创始人基金公司为其第五支基金筹集了10亿美元，但与富达操控的2万亿美元相比，不过是九牛一毛。", "然后还有政治。蒂尔对奥巴马既鄙视又害怕，而奥巴马之所以赢得大选，根本原因是其竞选活动在某种程度上迎合了多元文化主义，蒂尔认为这具有侵蚀性。上任之后，奥巴马推行了一系列政策，包括医疗体制改革和拯救经济，用政府的资金救助银行、支持汽车制造商，同时向消费者提供刺激经济的支票。奥巴马还策划了经济救助计划，避免了经济崩溃，却导致了克莱瑞姆资本的崩溃。让情况更糟的是，在希拉里·克林顿明确为下任总统候选人的情况下，奥巴马总统的成功似乎能够更加持久。尽管在蒂尔得以创立PayPal的那个经济繁荣时期就是希拉里的丈夫在担任美国总统，但她对蒂尔的利益表现出了比奥巴马更强烈的敌意，人们认为她会对科技公司进行反垄断审查，并提高资本利得税税率。正如蒂尔在2013年国家评论研究所的一次活动上所说，他感觉“上层阶级和极端贫穷的人在两面夹击中间阶层”，尽管不切实际，但他似乎认为自己属于中间阶层。", "蒂尔有理由对此耿耿于怀。在2012年总统大选期间，米特·罗姆尼曾透露自己的个人退休账户中有1亿美元，这对大多数美国人（甚至一些私募股权界人士）来说是惊人的数字，他们很难想象一个人怎样做才能积累这么多钱，因为政府限定每年往账户中注资不得超过3万美元。负责监督奥巴马政府汽车业救助计划的资金经理史蒂芬·拉特纳当时指出，和他一样通过私募股权投资而致富的罗姆尼，似乎以道德上可疑的方式把“极限推到了边缘”。“我问过私募股权公司的同行，”拉特纳告诉美国有线电视新闻网，“我们甚至都不知道这是一个可行的伎俩。”罗姆尼是如何做到这一点的呢？答案就藏在对《大西洋月刊》的威廉·科汉所说的私募股权的“炼金术”的理解之中，即假设投资者选对了投资的公司，他们只需要少量的资本投入就能获得巨大的回报。", "蒂尔当然明白罗姆尼的“伎俩”，但他积蓄的金钱比罗姆尼要多好多倍。罗姆尼使用的是传统的个人退休账户，这意味着他从该账户提款要作为普通收入纳税，而蒂尔使用的是罗斯个人退休账户，这意味着当时他是在更严格的每年注资不得超过5 000美元的限制下这样做。这同时也意味着他不用缴更多的税。据四位熟悉其财务结构的知情人士透露，蒂尔的罗斯个人退休账户里至少有35亿美元，还有可能更多。当他年满65岁后取钱时，这些钱都是免税的——只要政府不改变规则就行。", "在蒂尔的关系网中，许多人认为这是一桩正在演进的丑闻。罗斯个人退休账户创立于20世纪90年代末，是经共和党占主导的国会通过并由克林顿总统签署的一系列减税政策的组成部分。作为“与美国的契约”的一部分，众议院议长纽特·金里奇试图在削减资本利得税的同时平衡预算，但这需要在其他地方增加收入，因此就有了罗斯个人退休账户。它允许投资者将传统个人退休账户转换为罗斯个人退休账户，只要他们事先缴纳税款。这就是蒂尔能够最终拥有一大笔免税的储蓄金的原因。", "罗斯个人退休账户在创立之初就受到了人们的欢迎，但在奥巴马的第二个任期内受到了越来越多的审查，总统曾多次提议限制往罗斯个人退休账户的注资。与此同时，2014年，美国政府责任办公室发布了一份报告，宣布它已经确定了大约314名纳税人的个人退休账户余额超过2 500万美元，还特意提到“某些公司的创始人通过使用个人退休账户来投资其新成立公司的非公开交易股票”。也就是说，他们和蒂尔在PayPal做的事情一模一样。报告指出，美国联邦税务局计划调查这些资产，并建议国会通过法律打击这种做法。不久之后，蒂尔告诉一位朋友，他正在接受美国联邦税务局的审计。", "他从未受到制裁，对他的审计显然没有发现任何非法的内容，但这似乎让他变得偏执。正如蒂尔投资脸书和帕兰提尔那样，投资那些能成为创始人或关键投资者之一的初创公司，理论上是没问题的，因为蒂尔小心地将自己的持股比例控制在50%以下。但这种做法是灰色地带中的灰色地带，每个人都知道蒂尔对这些公司有着巨大的影响力。", "只要美国联邦税务局改变关于公司控制规则的解释，就能迫使蒂尔按其罗斯个人退休账户中的全部30亿美元或更多的资金缴税。又或者，投资公司里心怀不满的前合伙人可能会引人关注蒂尔对他的公司施加的影响到底有多大，以至于让这种影响看起来像是控制。熟悉相关政策安排的人士透露：“哪怕蒂尔违反了一条规则，或脚踩在了错误的方向上，政府就可以对他的这一块整体征税。”", "这是很可怕的，据几位和他长期共事的员工说，对于税收政策的变化或联邦税务局执法方式的转变，蒂尔的应对能力极其薄弱，这一点似乎受制于他与周围人的所有关系。有人说，这是唯一的压倒性因素，他似乎总是在担心，怕一些前同事或朋友会跟他反目，因此，他倾向于通过慷慨地为前员工创办的基金开出支票，诱使他们不要这么做。", "如果较真的话，那就正如他的一位密友所说，蒂尔其实是“深深寂寞的”孤家寡人。作为一个依靠关系网成就事业的人，蒂尔与他人几乎没有真正的友谊，也没有任何与其职业生活完全不相关的人际关系。蒂尔相恋多年的男友马特·丹泽森不仅是他的伴侣，还和其身边几乎所有人一样，也是他的员工。“蒂尔江湖”的一名成员注意到，丹泽森和蒂尔在公共场合似乎有意拉开距离，很少站在一起，也很少牵手。", "在日常管理层面，蒂尔的焦虑对他所投资的公司几乎没有直接的影响。帕兰提尔的基层员工，甚至是创始人基金的员工，对蒂尔的那些政治痴迷考虑得极少，如果说还有人想过的话。但蒂尔帝国", "的本质是，蒂尔的感情有一种向下沉淀的趋势，即使他没有直接控制。这就是帕兰提尔正在发生的事情，该公司急于寻找一种方式来证明自己的高估值是合理的，仿佛是对蒂尔的脆弱感做出了回应。这样一来，便会进一步加剧这种脆弱感。", "表面上，帕兰提尔是蒂尔的纯种“独角兽”，是他长期财务成功的关键，也是他作为杰出的未来主义者的声誉之源。帕兰提尔的故事众所周知，它也因此备受钦羡，据说正是其超级机密的技术追踪到了本·拉登，而且其创始人是美国最前沿的公共知识分子。2013年年底，帕兰提尔以90亿美元的估值融资超过1亿美元，是当时走红的初创公司优步的身价的3倍。蒂尔挑选出来担任帕兰提尔首席执行官的亚历克斯·卡普正凭借自己的实力成为商界名人。同年早些时候，《福布斯》推出过一篇浮夸的文章，将卡普描述成硅谷坏男孩，一个吹嘘会去“肮脏的”柏林夜总会的“离经叛道的哲学家”，他还强烈暗示自己偶尔吸大麻，而他恰好管理着一家大型数据公司。有些名言出自著名将军之口，戴维·彼得雷乌斯告诉《福布斯》：“当需要更好的捕鼠器时，这就是一个更好的捕鼠器。”这篇文章还提到了一个庞大的、不断增长的公司业务线。《福布斯》称，帕兰提尔“正从间谍和特种部队的阴影世界中崛起，迅猛席卷美国企业界”。", "这一切都让帕兰提尔的员工感到惊讶，因为他们知道摩根大通已经基本停止使用该技术。事实上，卡普和“盗梦空间”团队达成的大多数大型公司交易都以失败告终。“基础非常不稳，”2013年加入帕兰提尔以协助在欧洲建立新业务线的阿尔弗雷德斯·奇美柳斯卡斯说，“我们一无所有，那真是让人感到绝望。”直到我在奇美柳斯卡斯位于西班牙农村的家中找到他之前，他从未公开谈论过这种绝望的影响，他告诉我的故事揭示了蒂尔崛起过程中最奇怪的一章：剑桥分析丑闻。", "帕兰提尔被卷入这家英国公司意欲操纵2016年美国大选的个中缘由其实就是这种绝望。帕兰提尔的主要产品Metropolis最初由克莱瑞姆资本孵化，但用一位高管的话来说，这就是“一场灾难”。该产品旨在帮助对冲基金经理根据价格或历史天气报告等大数据建模。为了开发为摩根大通分析抵押贷款的软件，帕兰提尔不得不对其进行普遍修改，并派遣一支靠前部署的工程师队伍进驻摩根大通来维护代码，他们更像是技术咨询员，而不是硅谷的产品开发人员。要想定制Metropolis，比如跟踪大公司供应链所需的原材料，就需要做出更大的调整，而且似乎永远达不到卡普推销术的魔力。“做当然也能做到，但需要付出很多努力，”一名前工程师表示，“有点儿像一头跳舞的熊。”", "帕兰提尔的政府产品效果稍好一些，但该公司在这一领域也是举步维艰，尤其是跟美国陆军和奥巴马政府内部最重要的决策者打交道。诚然，情报机构和少数特种部队喜欢该软件，但陆军作为美军中最大的一支，以及帕兰提尔最大的潜在收入来源，并没有表现出要放弃为其开发了主要数据库软件分布式通用地面系统的承包商的意愿。事实上，在2013年的国会听证会上，陆军参谋长雷蒙德·奥迪尔诺对帕兰提尔的最高政治盟友、加利福尼亚州众议员邓肯·亨特大发雷霆，因为亨特曾暗示，陆军不允许他们购买帕兰提尔软件就是对不起战场上的士兵。", "“我听腻了别人对我说‘我不关心我们的士兵’！”奥迪尔诺将军提高了嗓门说。他还为分布式通用地面系统辩护，称它比2003年他在伊拉克当师长时使用的技术有了极大的进步，并说亨特根本就不懂。奥迪尔诺将军的这一说法让亨特看起来一脸错愕，并在国防圈内迅速传开。《陆军时报》的头条标题就是“奥迪尔诺在国会听证会上发飙”，陆军部长约翰·麦克休也替奥迪尔诺辩护，称亨特的分析“不正确”。", "“奥迪尔诺发声之后，将领们团结一致，这下永远地改变了局面。”某位参与帕兰提尔在五角大楼项目工作的人说。在之后的几年里，在准备就80亿美元潜在价值的新版本分布式通用地面系统公开招标之际，陆军开始释放信号，表示其打算雇用一家传统国防承包商来构建定制的系统，而不是向帕兰提尔这样的商业供应商购买软件。", "这对帕兰提尔来说不啻灾难性的转变，它会被挡在外面，甚至连投标合同都提交不了。该公司试图通过其在国会的盟友（包括亨特）来施加压力，并通过蒂尔的朋友格伦·贝克的媒体公司播出了一部纪录片《全副武装和不负责任》，声称政府不购买帕兰提尔的软件就是腐败的证据。这些努力并没有起作用，帕兰提尔的高管们便开始考虑一种可能性，即他们不得不放弃争取成为政府主要承包商的想法，从而将自己重塑为一家咨询公司。但由于风险资本家认定软件公司的价值要远高于咨询公司，所以采取这种行动（尽管它是拯救帕兰提尔以维持其经营的必要之举）会抹掉一大块公司估值和蒂尔的净资产。", "2014年，卡普停掉了公司在美国的商业业务，掉头转战欧洲，在那里帕兰提尔的品牌和缺点鲜为人知，他悄悄地要求高级工程师们将Metropolis的代码全都扔掉，重新打造一个替代品。他的计划是借助公司在情报工作方面的声誉，以及卡普和他所雇用的人的魅力，重点将Gotham这款情报机构曾经购买过的软件，推销给欧洲的大型工业公司。", "这就是阿尔弗雷德斯·奇美柳斯卡斯的切入点。他和卡普及其他许多进入蒂尔圈子的人一样，都是特立独行的。他出生在苏联时期的立陶宛，1999年到西方上大学，和蒂尔一样，在进入学术界并攻读经济学博士课程前，他在2005年左右创办了一个宏观对冲基金。他是政治上的不可知论者，一头乱发，渴望冒险。他很快得出结论——帕兰提尔的软件存在缺陷，但他很接受了该公司的文化，尤其是在推动其情报工作时培育出的神秘身份，他喜欢扮演间谍的想法。", "卡普的一大特点就是随心所欲的自由精神，但这一点在欧洲并没有得到很好的发挥。在欧洲，高管们都期望商业伙伴遵循正式礼仪，而不是像在美国那样穿着运动装到处跑。奇美柳斯卡斯与卡普的合作非常密切，他表示自己参与到一项新的方案中，该方案在公司内部被称为“无赖小队”，这大致意味着做任何一定要做的事，甚至不惜挑战道德底线。蒂尔似乎对“无赖小队”并不知情，但奇美柳斯卡斯说帕兰提尔的高管们肯定都知道，而且无论如何，奇美柳斯卡斯遵循了“蒂尔江湖”最重要的法则之一：在必要时抛弃规则。帕兰提尔为其估值正名的行动出于同一种精神，而这种精神曾激励PayPal在蒂尔的领导下努力从危机中满血复活。", "欧洲的一家大银行希望利用帕兰提尔的软件发现不遵守协议的交易员，在参与竞标这个项目时，奇美柳斯卡斯的团队开发出一个工具，可以让该银行的IT部门读取员工的电子邮件。这其实并不是最初竞标项目的一部分，原项目只涉及交易模式分析，并不包含情报搜集，而且这还有可能涉嫌侵犯个人隐私，因为帕兰提尔的软件很容易窥探个人问题，比如该银行的谁跟谁发生了不正当关系，但毕竟客户喜欢它。“当时我们什么都想试试，要怎么做都行。”奇美柳斯卡斯回忆道。帕兰提尔最终拿下了这项业务，这是其在欧洲的第一个大单。", "换句话说，奇美柳斯卡斯行动迅速，并且打破了比他能想象的还要大得多的东西。由于帕兰提尔与美国中情局有合作，客户就想当然地认为帕兰提尔专门从事反间谍的活动，如果有生意可做，帕兰提尔也很乐意尽力满足对方的要求。“在与剑桥分析合作之前，我做过很多更见不得光的交易。”奇美柳斯卡斯说。", "剑桥分析公司由英国贵族亚历山大·尼克斯创立，奇美柳斯卡斯于2013年首次与尼克斯见面。尽管名字听起来很有派头，但其实该公司与剑桥大学毫无关系，公司的办公室设在伦敦。但尼克斯的计划是推销在剑桥大学里酝酿出的那些点子，即利用人们在脸书上的数据来推测他们的性格类型。他将从极端保守的默瑟家族那里筹集资金。默瑟家族由通过定量对冲基金暴富的族长罗伯特及其女儿丽贝卡领导，默瑟家族是布赖特巴特新闻网的支持者，并为剑桥分析投资，期望用于选举政治，使政治运动可以扫描人们的社交网络资料，从而预测他们会投票给谁，然后就向他们推送广告，催促他们去投票。", "尼克斯说他将以帕兰提尔为榜样来推动其设想，这使奇美柳斯卡斯立刻怀疑剑桥分析可能基本上就是忽悠人的，因为他很清楚帕兰提尔的软件并不总是像卡普大肆宣传的那样给力。不过，尼克斯对帕兰提尔的推崇使他颇具吸引力，奇美柳斯卡斯便开始培养他。奇美柳斯卡斯说自己这么做一方面是出于好奇，另一方面是因为他觉得剑桥分析有一天可能会成为客户。的确，2013—2014年，两家公司讨论过合作，但帕兰提尔的高管们拒绝了，一位发言人后来说这是因为帕兰提尔并不想掺和政治。", "即便如此，2014年，奇美柳斯卡斯开始向尼克斯发送建议，告诉他如何最高效地搞到公司认为需要的数据。脸书不向外部营销人员出售数据，扎克伯格曾表示这是一个重要的原则问题，尽管部分原因可能是通过为自家保留数据，脸书可以为广告商提供向其用户推送精准定向信息的独家能力。尼克斯原先计划从剑桥大学的两位教授迈克尔·科辛斯基和戴维·史迪威那里购买或争取授权使用相关数据，这些数据都是他们在脸书上合法收集的。脸书允许以研究为目的进行数据收集。但当两位教授要求其支付50万美元，外加剑桥分析一半的产品时，尼克斯就决定一分钱也不付。", "奇美柳斯卡斯提供了一个替代方案：为什么不创建另一个类似脸书的应用程序，然后通过收集使用者的个人信息及他们所有使用脸书的朋友的个人信息从社交网络中抓取数据呢？在接下来的几个月里，尼克斯采纳了奇美柳斯卡斯的想法并将其付诸实践。他没有去买科辛斯基的数据，而是找到另外一位研究员亚历山大·科根来创建一个应用程序，以大面积获取8 700万美国人的脸书数据，最终目的是支持唐纳德·特朗普，而特朗普将靠使用精准定向的脸书广告来筹集资金和争取选民，为此他在这一社交媒体平台上花掉了大约1亿美元。", "剑桥分析丑闻被尘封多年，直到该公司的吹哨人向《纽约时报》和伦敦的《观察家报》揭露了他们的所作所为后才得以曝光。从脸书获取的数据成功帮助特朗普获胜这件事一经披露，便引起轩然大波，尤其是在民主党人中，他们大骂扎克伯格。", "这位脸书的创始人曾坚称，他的公司是剑桥分析窃取美国人数据的不端行径的受害者，但随着脸书董事会的一名成员涉及该丑闻的事实越发明确，他的这种说辞变得不那么有力。剑桥分析前员工克里斯托弗·怀利，即那位吹哨人说，他曾在剑桥分析的办公室里看到过帕兰提尔的工程师，他们在那里帮助剑桥分析进行登录操作并帮助构建另外的应用程序，比如科根设计的测试小程序，以便从脸书用户那里获取更多的隐私数据。假如脸书是受害者，而不是剑桥分析的主动同谋，那剑桥分析为什么要和扎克伯格的导师控制的公司合作呢？", "奇美柳斯卡斯最终被解雇了，帕兰提尔说他是一个无赖员工，一直“完全以个人名义”工作。他告诉我这种说法在某种程度上没错，因为他在剑桥分析的工作没有被记录在案，也没有涉及更深，但同时也有让人误解的地方。他拿工资就是做这种业务开发的，而且事实上，帕兰提尔过去也曾使用社交媒体数据为其他客户服务，一直也没有受到任何政策的限制。是的，他是个无赖员工，但他做那份工作一直都是以半官方身份。他说：“他们把我推下了车。”", "这一切都无法解决帕兰提尔的各种潜在问题。时至2016年年初，该公司的困难，或推而广之，更有蒂尔的困难，已经被新闻界发现。据美国新闻聚合网站BuzzFeed 5月6日报道，帕兰提尔的很多主要企业客户最近纷纷与其解约，其中包括美国运通公司、可口可乐和纳斯达克。也就是在这个时候，蒂尔正秘密地试图安排将帕兰提尔出售给大型数据库提供商甲骨文公司，而从中牵线搭桥的是好莱坞大亨迈克尔·奥维茨，他与蒂尔和甲骨文的联合创始人拉里·埃利森都是好朋友。", "这三个男人和另一位投资者马克·阿布拉莫维茨聚在一起吃了一顿午餐，但潜在的交易还是没有达成。然而，由于美国总统大选越来越热，蒂尔需要找到一个候选人来确保他的财富受到万全的保护，而且对购买帕兰提尔正在推销的软件持开放态度。卡莉·菲奥莉娜、特德·克鲁兹、兰德·保罗和不确定人选唐纳德·特朗普，这几位均不能完美地符合蒂尔一直在培育的反动思想。但在过去十年里，蒂尔一直在积累社会和政治资本，并构建了一个随时准备并愿意帮助他的极右翼政治盟友网络。他突然有机会使用了。", "蒂尔帝国里的人将自己的信仰和行为塑造得与他一样，并将他的认可视为自我价值和未来前途的核心。"], "wcount": 9959}, {"icon": "15", "title": "第15章 硅谷的政治时代", "paras": ["关于2016年美国总统大选的共和党候选人提名争夺战，蒂尔在其最初的评估中全力支持著名的科技公司高管卡莉·菲奥莉娜，她曾于1998年登上《财富》杂志刊有“最强势女性”专题那一期的封面，当时菲奥莉娜在美国朗讯科技公司担任高管，朗讯是美国电话电报公司剥离出来的电信设备业务版块。菲奥莉娜后来担任了惠普的首席执行官。她是唯一明白算法到底是什么的人，跟蒂尔灵犀相通。", "但蒂尔并没有完全倾心于菲奥莉娜。2005年，在极力推动惠普收购康柏之后，菲奥莉娜的商业职业生涯灾难性地结束了，当时个人计算机行业开始萎缩。这次并购被许多人视为现代史上最糟糕的商业交易之一，同时正好遭遇了几波裁员潮，总共有近3万人失去工作，其中包括菲奥莉娜，她当时已将自己重塑为一名主流的保守派共和党人。这使得她在贸易和移民等问题上比蒂尔更左倾。“他认为卡莉根本不可能胜选，”一位朋友说，“支持她不过是换一种方式说‘我不选边站队’。”", "2015年8月，蒂尔向菲奥莉娜的超级政治行动委员会捐赠了200万美元，这促成了一笔巨额广告采购，加上她在辩论中的出色表现，从而推动了其民调结果的短暂上升。到9月，菲奥莉娜的支持率排名第三，落后于两位热门候选人——特朗普和神经外科医生本·卡森。在短时间内，她被视为共和党建制派有可能选择的人。9月中旬，她的民调支持率达到了巅峰，而就在此之前，特朗普因对她的崛起大感慌张，而在《滚石》杂志上对她的外表进行了极尽性别歧视性的嘲讽。他说：“你瞧她那张脸！难道有谁会投票给她吗？”", "但到了9月底，当特朗普调低了厌恶女性的调门，转而攻击菲奥莉娜的职业生涯后，她的民调支持率陡然下跌。特朗普称她的职业生涯是“一场灾难”。当媒体随后对并购康柏进行详细的报道时，蒂尔本来应该是能够帮助她回应这些攻击的天然代理人。菲奥莉娜糟糕的工作表现是在残酷的高新科技低迷时期出现的，当时PayPal也差一点儿被扼杀。蒂尔本可以站出来证明这一点，但他拒绝追加更多的捐款，也不代表菲奥莉娜发声。她在艾奥瓦州的党团会议上只得到了2%的选票，在新罕布什尔州也只获得了4%的选票。", "菲奥莉娜退出后，竞选很快就只剩下三名候选人：中间派俄亥俄州州长约翰·卡西奇、特朗普和特德·克鲁兹。当然，蒂尔和克鲁兹也有过一段交情，包括2012年支持克鲁兹竞选参议员时捐款。蒂尔钦佩克鲁兹，因为他身上也体现了一些存在于蒂尔自己与精英机构之间的矛盾。与蒂尔一样，克鲁兹也是常春藤盟校中的民粹主义者，普林斯顿大学培养了他对于自由主义精英和普通美国人之间阶级斗争的感知力，也与蒂尔一样，他曾就读于顶级法学院。2014年，在接受《每日传讯》采访时，蒂尔对克鲁兹大加夸赞，将他与国会中典型的共和党人进行了正面的比较，他说：“这些人的智商比另一方的人略低。”这一切让克鲁兹自然成为下一个选择。", "继菲奥莉娜2月11日退出竞选后，蒂尔和查尔斯·约翰逊在达拉斯与投资者兼克鲁兹的财务主管哈尔·兰伯特共进晚餐。蒂尔曾经说他计划捐赠100万美元，支持这位得克萨斯州参议员，希望他能抓牢共和党内“拒绝特朗普”的党派人士的选票，赢得主流共和党人的支持，从而获得提名。但在这次晚宴结束时，蒂尔却并没有做出任何实际的支持举动。", "“你在想什么呢？”约翰逊在喝酒的时候问道，此前，兰伯特在没有得到任何承诺的情况下就离席了。", "蒂尔说，他在想奥巴马总统关于工薪阶层白人选民的那些臭名昭著的言论。“你去宾夕法尼亚州的一些小城镇看看，就像中西部的许多小城镇一样，那里的工作岗位已经消失了25年，也没有什么能填补这些空缺，”奥巴马2008年在旧金山的一次筹款活动上说，“于是人们的日子更苦了，他们只能倚靠枪支、宗教或对一切异于他们的人的反感，或者说用反移民情绪和反贸易情绪来解释他们的沮丧，这不足为奇。”", "令人惊讶的是，蒂尔认同奥巴马的这一分析。事情不在于执着于枪支和信仰，而在于意识到两党在全球化问题上已无法达成共识。蒂尔说，美国人对贸易和移民感到愤怒，他们指责贸易和移民让他们变得更穷，在他看来，这完全正确。他们也对信息全球化感到愤怒，因为他们的文化更多地被大型互联网公司所定义。在一个以跨国界转移资金为业的移民技术企业家看来，这一承认相当有力，几乎就是一个自我憎恨的评论。蒂尔并不在意。", "“政治将完全与全球化有关，”他对约翰逊说，“特朗普会赢的。”", "蒂尔虽然还没有准备好公开支持特朗普，但还是向约翰逊提出了帮忙的请求。约翰逊能确保蒂尔在共和党全国代表大会上成为支持特朗普的代表吗？", "蒂尔从来都不是特别“喜欢”特朗普，并且他们几乎在所有方面都截然相反：特朗普是一个好色的纽约人，肚子里什么话也藏不住；蒂尔是拥有三重国籍的内向公民，每说一句话都要经过深思熟虑，并且绝不把话说满。在同一篇《每日传讯》的专栏文章中，他既称赞了克鲁兹的智慧，又贬低特朗普，说在他身上“几乎体现了纽约市所有的问题”。然而，在很多方面，特朗普又都是蒂尔一直追求的政治项目的完美化身：他和罗恩·保罗一样，支持对非法移民进行极端打击；他的竞选纲领和保罗2012年的一样，其中包括终结出生公民权和强化边境。特朗普不像保罗那样反对白人身份政治，但他对20世纪八九十年代纽约的种族问题的看法，与同一时期保罗在时事通讯中所表达的立场大致相同。首先，也是最重要的，特朗普和保罗一样，可以完美地出演“这场竞选中最疯狂的家伙”。他是总统候选人，却总爱说些不该说的话，蒂尔也就是冲这个才喜欢他的。“这差不多就是所谓的惺惺相惜吧，”约翰逊说，“他认为特朗普很特别。”", "这位真正的房地产大亨的参选，是为了直接解决在蒂尔政治发展中最早让其活力四射的那个问题：自由派政治正确的巨大祸害。“我们必须重振我们的国家！”特朗普在接受新闻访谈节目《与媒体见面》的采访时这样表示。当时共和党总统候选人的提名竞选活动正在进行。特朗普说：“我们必须让我们的国家再次伟大起来，我们需要能量和热情。这种政治正确绝对是在扼杀我们这个国家。你什么都不能说。不管你今天说什么，他们都会找到理由说它不好。”", "在蒂尔悄悄向特朗普靠拢的同时，他也在关注高客传媒案的情况，当时距开庭审理只剩几周时间。霍根的法律团队找到了某个突破点。他的案子被一名联邦法官驳回，所以他向州法院起诉高客传媒，这意味着审判将在霍根居住的坦帕湾地区进行。负责本案的法官帕梅拉·坎贝尔似乎很有可能会同情霍根，而且一点儿也不反对媒体大肆炒作。她是特丽·夏沃父母的代理人，而就在医生宣布夏沃脑死亡后，夏沃的父母提起诉讼，要求阻止夏沃的丈夫移除她的生命支持系统。考虑到审判地点，以及陪审团几乎肯定会包括一些胡克·霍根的死忠粉的情况，霍根的法律团队似乎一定会辩称，一家满是虐待狂的纽约媒体公司竟然如此粗暴地攻击了一位当地的英雄。", "高客传媒的编辑们真没把这件事当作难事。在做证期间，尼克·丹顿更是表现得油嘴滑舌、毫无悔意。", "如果能够证明霍根的案子得到了秘密资金，那么高客传媒就有可能自救，而且该公司正尽力这样做。1月，高客传媒聘请的危机公关专员戴维·戈尔丁从一位在坦帕有不少关系的当地律师那里听到了一个传言：霍根的这场官司得到了一个亿万富翁的幕后支持，其儿子的同性恋身份就是高客传媒曝光的。", "高客传媒的执行编辑约翰·库克和记者J.K.特罗特疯狂地查找了该网站的档案，也没能找到一个完全符合条件的亿万富翁，但他们确实找到了几个可能人。他们认为最有可能的就是对冲基金经理彼得·布兰特，其子彼得·布兰特二世是同性恋。在高客传媒发布了狗仔队拍摄的时年18岁的彼得亲吻其超模母亲斯蒂芬妮·西摩的照片后，他还给他们写了一封愤怒的信。另有一种看起来不大像的可能性：彼得·蒂尔，他不是哪个亿万富翁的同性恋儿子，而他本身就是同性恋亿万富翁，显然还非常憎恨高客传媒，2009年曾把高客传媒比作恐怖组织，并将它的灭亡作为“一个有趣的理论问题”进行思考。至3月该案开始审判之时，有关证据也就搜集到这种程度，根本不足以将他们的怀疑公之于众。", "在法庭上，高客传媒永远不会有机会。霍根的法律团队由哈德领衔，提出了一个既微妙又粗俗的论点。哈德认为，当霍根谈到他的性生活时，比如在一次电台采访中吹嘘他的阴茎长度，在接受娱乐新闻网站TMZ采访时为其录音的出版而扬扬自得，他和“绿巨人”一样，是个肌肉发达性欲旺盛的疯子。是的，也许胡克·霍根确有新闻价值，哈德也承认这一点。但是他指出，高客传媒过去也侵犯了胡克·霍根的个人隐私。“特里·博莱亚的阴茎不是25厘米。”这位前摔跤选手告诉陪审团，这是审判期间一些超现实的时刻之一。", "这一论点中不那么微妙的部分就是民粹主义者对一家纽约媒体公司的攻击。霍根的团队认为高客传媒是邪恶的，它由色情之王丹顿经营，“毁了很多人的生活”。陪审团花了6个小时才给了这些外乡人致命一击：高客传媒应赔偿霍根1.15亿美元，另外，还增加了2 500万美元的惩罚性赔偿，使得赔偿总额高达1.4亿美元。蒂尔得知判决结果后如释重负，甚至感到高兴。“这是我做过的最慈善的事情。”他开始这样对他的朋友说。", "他没有公开谈论有关此事的任何一点，至少至今还没有。不过，私下里，他却在极力炫耀，结果有些话就这样传了出去。在审判刚开始时，律师兼媒体企业家丹·艾布拉姆斯在博客上发了一个帖子，推测有个“痛恨高客传媒的人”在为霍根支付法律费用。审判结束后，有高客传媒销售团队的员工报告说：“在和最近出席过脸书公司聚会的朋友聊天时，听到了蒂尔在幕后的消息。”高客传媒的这名员工说，这件事的蹊跷之处就在于，友人提到此事就当是题外话一般，好像无人不知、无人不晓一样。", "高客传媒将在6月申请破产，但其网站依然还在更新，丹顿也宣布计划对判决提出上诉。约翰逊敦促蒂尔发挥自己的优势，哈德仍在进攻。他不再特别关注自由裁量权，而是开始代表一些客户提起诽谤诉讼，但这些客户远不如霍根那么让人同情。", "其中之一涉及自由撰稿人阿什莉·特里尔，她声称高客传媒的一名员工在一篇关于她和手机交友程序Tinder争论的文章中诽谤了她。另外一起诉讼是替企业家希瓦·阿亚杜拉代理的，阿亚杜拉说他在1978年发明了电子邮件，尽管大多数历史学家认为电子通信早在几年前就开始使用了。这两起诉讼都涉及高客传媒的编辑约翰·库克和山姆·比德尔，后面这位高客传媒年轻的写手经常批评蒂尔的朋友和另类右翼的成员。高客传媒根据比德尔自己写的一篇关于焦虑和抑郁的文章，把他描绘成一个靠不住的麻醉品滥用者。这正是高客传媒炉火纯青的含沙射影手法，现在就连该网站的初级雇员对此都训练有素了。", "5月9日，特朗普竞选团队提交了加利福尼亚州共和党初选代表的名单。在所列出的加利福尼亚州第三国会选区的三名候选人中，有一位就是彼得·蒂尔。这引发了一些令人挠头的头条新闻，把蒂尔对特朗普的支持与他的其他反向赌注相提并论，比如“海上家园”和“20岁以下20人”项目。但事实证明，这只不过是两周后发生的事情的前奏。《纽约时报》的安德鲁·罗斯·索尔金发表了对丹顿的采访，丹顿说他怀疑有一位硅谷亿万富翁一直在为针对高客传媒的诉讼提供资金。索尔金的文章可能迫使蒂尔的一个亲信最终泄露了他就是幕后主使的消息，因为第二天，瑞安·马克和马特·德兰格就在《福布斯》上爆料说，那人就是蒂尔。", "蒂尔随后给索尔金打了电话，索尔金在第二天就发表了对蒂尔的采访。在索尔金的专栏文章中，蒂尔使用了与审判当天相同的表述。因为一篇负面报道就整死一家小型媒体公司，这并不是什么典型的寡头的不满，他坚持认为这是一种公共服务。他并不是在攻击传媒界，而是在帮传媒界清除掉一个坏演员。“正是因为我尊重记者，所以我不相信他们会因为反击而身陷绝境，”蒂尔说，“这并不完全是报复，更多的是特定的威慑。”", "对于蒂尔同时成为特朗普的支持者，以及历时10年摧毁一家媒体公司的阴谋策划者，人们的反应非常强烈。Glitch软件公司的首席执行官阿尼尔·达什在推特上写道：“当反弹真的开始，科创行业的每个人都被痛恨时，一切都是拜这样的邦德式恶棍所赐。”《卫报》专栏作家玛丽娜·海德很有先见之明地警告说，这起案件或将预示着一个有权势的人利用法庭来欺凌传媒机构的时代的到来。“对于蒂尔专横的‘慈善’主张，那些哪怕表示出些许同情的人都应该好好想想，如果下一个愤怒的亿万富翁效仿他的做法，开始摧毁他们尊重的媒体，他们是否还会使用同样的称谓，”海德写道，“当然可以想象，比方说，落败的唐纳德·特朗普欲开始一轮秋后算账，蒂尔就把路线图递到了他手上。”", "这种蔑视并非记者的专利。杰夫·贝索斯在Recode公司的年会上表示，他认为蒂尔追求的这种秘密诉讼应该是非法的。“作为公众人物，对于那些涉及自己而你又不喜欢的言论，最好的防御就是厚脸皮，”贝索斯说，“你根本阻止不了它。”", "既然人们都在挖掘，蒂尔与另类右翼的联系也就渐渐浮出水面。同年早些时候，蒂尔同意在土耳其举行的一次主题为“企业垄断”的会议上发表演讲，该会议是由财产和自由协会组织的。在蒂尔被揭露为高客传媒案的幕后支持者之后，南方贫困法律中心发表了一篇文章指出，该会议常常吸引白人民族主义者到场，包括理查德·斯宾塞。蒂尔在次月退出了该活动。", "约翰逊仍在幕后工作，他确保蒂尔从这场争议中获得尽可能多的好处。利用其右翼活动人士的关系网，他在推特上传播信息，感谢蒂尔干掉了高客传媒。“感谢你彼得”的标签飞速传开，成为推特网站上的热门话题。斯宾塞、米洛·扬诺普洛斯和迈克·切尔诺维奇都在推特上发文，敦促粉丝们感谢蒂尔。扬诺普洛斯将蒂尔比作蝙蝠侠，并在发给布赖特巴特新闻网的一篇帖子中写道：“蝙蝠侠是硅谷需要的英雄！”", "约翰逊还利用他的众筹公司WeSearchr资助了一场行动，旨在发现丹顿犯罪的证据，以便把他送进监狱。WeSearchr的网页上有一张丹顿穿着条纹服蹲监狱的图片，共募集了5万美元，其中大部分是约翰逊本人捐出来的。由于在极右政治的阴暗世界之外，很少有人知道蒂尔支持另类右翼，传媒界误以为这是一场草根起义。据约翰逊透露，蒂尔秘密资助的在线期刊Quillette拿热门话题标签作为普通读者站在蒂尔一边的证据，使得约翰逊的信息战看起来很自然。布赖特巴特新闻网和《财富》杂志刊登了同样说法的多个版本。", "到此时为止，约翰逊和蒂尔的关系仍然是一个秘密，但约翰逊觉得很安全，稍微暴露一点儿自己也没事。他在接受塔克·卡尔森的《每日传讯》采访时表示，他愿意伸出“橄榄枝”。他还表示，如果丹顿能发表被其网站诽谤的每位受害者写的文章，他就放弃诉讼。“丹顿说他想和彼得·蒂尔见面？”约翰逊说，“我倒是准备好随时跟他见面呢。”", "这话说得有点儿奇怪，丹顿从未公开提过要和蒂尔会面的事。但事实上，他们已定于当月晚些时候会面。这次谈话是由一位中间人安排的，他是蒂尔在PayPal的老同事杰里米·斯托普尔曼，他仍然经营着Yelp网站，与丹顿的关系也很好。他鼓励他们两人努力达成和解，以避免继续打官司的痛苦。达成和解的理由也显而易见：丹顿可以在财务上解救自己，让蒂尔放弃对其网站写手的起诉，并以某种形式留住高客传媒。而蒂尔只需略微仁慈一点儿，就能在不用真的毁掉一家媒体公司的情况下表达他的“慈善”观点，也不会冒在上诉法庭上尴尬败诉的风险。这将会是个双赢的结局。", "但当时实际发生的情况与此毫不沾边。会面期间，以及之后的几个月里，蒂尔依然仗势欺人，明确表示自己没有兴趣让高客传媒作为公司保留下来，也无意让丹顿有任何机会保住尊严。他就是要这家媒体公司消失，就是要尼克·丹顿穷困潦倒。", "“听着！”他说，此时正值达成和解的可能性出现之际。他发誓要“抹杀你的一切出版物”。", "此时，高客传媒已申请破产，但是它的旗舰网站还在继续发帖。丹顿已将该公司的其他博客挂牌出售，并计划对佛罗里达州的判决提起上诉。但是，横下一条心的蒂尔使丹顿的意志崩溃，迫使他在8月初进入个人破产程序。三周后，即在他50岁生日之前，他发表了高客传媒的最后一篇文章。丹顿在文中指出：“彼得·蒂尔按照他的主张重构了双方的争论，这样一来，他便侥幸逃脱了原本会被视为小人报复行为的恶名。”他认为蒂尔是新精英阶层中的一员，他们是一群“拥有垄断利润的技术巨头”，“与任何其他统治阶级一样对批评极为敏感，但有信心改变和破坏任何东西——从政府直到媒体”。", "在高客传媒放弃上诉并同意支付给霍根3 100万美元，外加丹顿额外支付一笔费用之后，丹顿最终退出了破产程序。阿什莉·特里尔得到了50万美元，希瓦·阿亚杜拉得到了75万美元，约翰逊得到了大约80万美元。丹顿在11月的一篇描述和解方案的博客文章中解释说，他已经放弃上诉，因为蒂尔明确表示他永远不会让步。考虑到蒂尔的绝不妥协及他掌握的无限资源，丹顿根本就不可能再筹集到继续打官司所需的资金。事情就这样结束了：蒂尔实际上彻底毁掉了一家大型媒体公司的所有者。", "蒂尔这是怎么了？他的一些密友想不通。他好像突然要跟整个世界开战了，他不仅对高客传媒绝不妥协，而且全力支持特朗普，还越来越轻率地和另类右翼搅和在一起。“每次我看到”彼得·蒂尔支持特朗普的消息时，马克斯·列夫琴说，“我都会看日历，因为我不确定今天不是4月1日”。其他人，尤其是那些从对冲基金领域认识蒂尔的人，则没那么震惊。蒂尔看起来没有那么像疯子，而更像是一个在打赌的人。也许他知道一些他们不知道的事。", "那年夏天，我和彭博社的利泽特·查普曼开始给蒂尔的朋友和前同事打电话，试图弄清楚他在2016年总统大选中的做法。我们曾报道，蒂尔认为他押注特朗普一定是高收益、低风险的买卖。蒂尔在“海上家园”、妇女权益、移民等问题上的观点已经把硅谷能得罪的人都得罪了个遍。再多一个诡异的选边站队，又会对他的地位有什么影响呢？我们写道，他是“硅谷里堪称超凡脱俗的古怪自由意志主义者”。但是，如果特朗普当选，他就会成为“美国总统的古怪自由意志主义者”。", "这也许意味着SpaceX和帕兰提尔有可能更容易拿到合同，这也将使脸书有机会像谷歌那样接近白宫。蒂尔后来开玩笑说：“这是我最不逆向的押注。”", "当然，蒂尔做任何事都离不开对冲，尤其是帕兰提尔，需要有一个后备预案，以防押错了宝——特朗普落选。帕兰提尔仍然在欧洲艰难地推销其软件产品，而且尽管已成功地以更高的估值（200亿美元）筹集到了更多的资金，但在美国陆军那里还是没有取得任何进展。由于蒂尔对帕兰提尔的前景非常不看好，创始人基金对帕兰提尔的估值要比官方公布的200亿美元低40%。帕兰提尔在华盛顿特区的职员们也陷入了绝望，他们设计了一种内部称为“特洛伊木马”的策略。帕兰提尔将尝试修补与陆军高层的关系，并试图将自己打造成分包商，向拿下80亿美元的分布式通用地面系统合同的赢家负责。然后，无论如何，往后总有一天该公司会拿下整个合同。", "但在6月下旬，即蒂尔透露他资助起诉高客传媒并转而支持特朗普仅一个月之后，蒂尔的公司在国防界做了一件令人震惊的事，其震撼程度丝毫不亚于他在传媒界对高客传媒的攻击。他起诉了美国陆军！在一份法律诉状中，帕兰提尔的律师们认为，陆军不让帕兰提尔投标其大型软件数据库合同，违反了1994年通过的一项防止联邦政府过度开支的法律。这支律师团队由强大的博伊斯，席勒和弗莱克斯纳律师事务所的哈米什·休姆领导。该法案是在反对五角大楼拟购买600美元的马桶座圈的抗议声中通过的，根据该法案，陆军必须尽可能地考虑价格更低廉的市场产品，而非那些被大型国防承包商加价的产品。该诉讼称，陆军通过将分布式通用地面系统设置为一种咨询安排，从而排除了帕兰提尔的软件这种商业产品。", "陆军及更广泛的国防界对此大为震惊。承包商通常都试图引诱官僚，有时甚至不惜越线行贿。帕兰提尔虽然还没有玩过这一套，但在卡普的领导下，它也曾以自己的极客方式去引诱别人。现在，它却对一个潜在客户发起了攻击。", "要说这一举动令陆军感到惊讶的话，那么一直密切关注“蒂尔江湖”的人则都见怪不怪了。两年前，由埃隆·马斯克创办、蒂尔支持的SpaceX也曾玩过同样的伎俩，在美国空军将一份合同授予其竞争对手联合发射联盟后，该公司便起诉了美国空军。“每个人都说：‘如果你起诉你未来的客户美国国家航空航天局，他们就永远也不会和你再次合作，’”马斯克回忆道，“那我就想：‘好吧，既然就算我们不告他们，他们也肯定不会与我们合作，那么要是我们告他们并且赢了，这样至少还有机会使他们和我们合作。’所以，这样机会虽小，但比没有强。”马斯克将打官司与在国会出场相结合，他在国会指出联合发射联盟使用俄罗斯制造的发动机。美国空军做出让步，同意确保SpaceX可以竞标其合同，该公司的估值随即飙升。", "现在，帕兰提尔也在如法炮制。诉状中包含了帕兰提尔一直在拉拢的中层指挥官的一连串证词，并引用了迈克尔·弗林的支持备忘录。该公司还称，陆军曾压制赞扬帕兰提尔的主要政府产品Gotham的相关报道。帕兰提尔希望联邦法官判决现在的分布式通用地面系统招标合同无效，重新启动招标程序。", "据参与本次诉讼的人说，这是一项“经过测算的风险”，也起到了潜在的对冲作用，无论11月发生什么，它都给蒂尔呈上了获胜的机会。特朗普有可能获胜并扰乱陆军，但即便他落选，帕兰提尔的诉讼也能带来同样的结果。", "7月中旬，在克利夫兰举行的共和党全国代表大会上，上演了一出疯狂的真人秀，非常适合这位电视明星出身的候选人。特朗普轻而易举地赢得了提名，但他之所以赢了，部分原因是他侮辱了一大群共和党精英。提名分别位列第一、第二的候选人卡西奇和克鲁兹表示，他们无意支持这位候选人。特朗普还多次嘲笑前总统乔治·W.布什，以及先前的两名候选人米特·罗姆尼（“最愚蠢、最糟糕的候选人之一”）和约翰·麦凯恩（“我喜欢没有被俘经历的人”）。", "美国主流商界也对特朗普敬而远之。美国100家大型公司的首席执行官中没有一人向他的竞选活动捐款，而且共和党的长期赞助人也拒绝提供支持。有些人，比如梅格·惠特曼（蒂尔在她掌管易贝时曾与她发生争执），还公开表示了批评。", "硅谷对特朗普尤其反感。同年早些时候，扎克伯格批评过他，尽管言辞中带着从蒂尔那里学来的那种故意的含糊其词。4月，扎克伯格就特朗普提出在美墨边境建造隔离墙一事不点名地表示：“与其建高墙，不如帮助人们建桥梁。”6月，在美国拥有大量制造业务的英特尔时任首席执行官布莱恩·科兹安尼克似乎随时准备从特朗普的经济民族主义中获益，并计划在家中接待这位候选人和其他科技公司高管。但该消息走漏后，科兹安尼克在最后一刻取消了活动。", "克利夫兰的空缺被特朗普的直系亲属填补了，六位姓特朗普的人被列为主要发言人，整个现场被支持者们弄得“一片狼藉”。这些人中包括亚利桑那州著名的反移民警长乔·阿尔帕约，他因藐视法庭审判而被拘捕；20世纪90年代的内衣模特小安东尼奥·萨巴图；因出演《快乐时光》中的查奇而为人熟知的斯克特·拜奥。", "就克利夫兰所拥有的企业领袖而言，下列各位的形象可都够狼狈不堪的，包括狩猎装备业创始人威利·罗伯逊，他因《鸭子王朝》剧情真人秀而闻名，终极格斗大师白大拿，拉斯维加斯马戏团娱乐场酒店的老板菲尔·拉芬，以及把特朗普介绍给保罗·马纳福特的房地产大亨托马斯·巴拉克。这些人似乎都不太可能领导特朗普所承诺的美国制造业复兴，而且很大程度上仍然会把票投给希拉里·克林顿，或者干脆在大选中作壁上观。就在共和党大会召开的几天前，大约150名知名科技公司的高管和投资者发表了一封公开信，谴责特朗普“易怒、偏执、害怕新思想和新人物，以及从根本上认为美国国力疲软且日渐衰落”。", "当然，美国国力疲软且日趋衰落是蒂尔多年来一直极力宣扬的观点。他虽不是硅谷唯一信奉特朗普这一基本观念的首席执行官，却是唯一愿意公开说出来的人。据特朗普的圈内人说，这使得蒂尔的支持极其宝贵，也是大会组织者邀请他发言的原因。他是商界名人，却没有特朗普圈内许多人都有的那种有点儿谄媚的一面。“在特朗普的世界里，有很多想要成就大事但在圈外世界没有出色业绩的人，”解释说，“只有很少的人能够上常春藤盟校，在资本市场或企业界取得成就的人也很少。他把所有这些天才都带到了这场运动中。”", "蒂尔被安排在了周四的黄金时段演讲，当晚特朗普将正式接受提名。他将排在利伯缇大学校长小杰里·福尔韦尔之后、托马斯·巴拉克之前发表讲话。当年早些时候，小杰里·福尔韦尔站队离婚两次的特朗普，而不是特德·克鲁兹，他推动了关键的福音派教徒对特朗普的支持。技术专家蒂尔和房地产企业家巴拉克将反复强调特朗普的关键信息：他在商业上的成功，大家都有目共睹，使他有资格成为美国总统。伊万卡·特朗普紧随其后发言，然后是特朗普本人。", "蒂尔在开始演讲时表示自己是一名“建设者”，就像特朗普一样，然后发表了非同寻常的个人观点。他谈到了自己的父母克劳斯和苏珊，他们最早就是移民到他现在正向听众发表演讲的这座城市。“他们在我1岁时把我带到这里，”他指的是克利夫兰，“这里就是我成为美国人的地方。”", "会议大厅里闹哄哄的，蒂尔看上去有点儿不自然，尤其是刚开始的时候。他站在讲台上，微微弓着腰，脸上挂着僵硬的笑容，露出满口的牙齿，目光机械地在两个提词器间切换。他事先显然做过排练，故而成功地克服了平时讲话不流畅的缺点，甚至通常大量出现的填充词也不见了，但他说得太快，忘了在句子之间停顿，以致除了抨击“希拉里邮件门”的那段，他讲的话都好像在飞一样，落地的似乎很少。", "镜头摇向人群，小唐纳德·特朗普和他当时的妻子瓦妮莎与蒂芙尼·特朗普一起在台下就座。当蒂尔对美国的科技状况发出尖锐的谴责时，他们却扭转身体开始聊天，似乎只用了一半的注意力在听。对那些关注并追随其文章的人来说，这一主题听起来耳熟能详：美国在20世纪80年代的某个时候迷失了方向，不再有实现未来壮志的雄心，而特朗普将是把这一切带回来的人。", "“我们的政府崩溃了！”蒂尔宣称。美国的核电站仍然在使用软盘，一些喷气式战斗机在雨中根本不起作用，政府的软件毫无用处。“对一个曾经完成了曼哈顿计划的国家来说，这是惊人的衰退，”蒂尔说，“我们不接受硅谷如此无能，我们也绝不接受我国政府如此无能。”", "在这个时间点上，即演讲进行了大约三分钟，他隐去了做作的微笑，更加严肃，但同时看起来好像他其实开始欣赏自己。人们安静下来听蒂尔说，当他还是个孩子的时候，“最重要的争论就是如何打败苏联”。他接着说：“现在有人告诉我们，最大的争论是谁可以使用哪个卫生间。这是在分散我们对真正的问题的注意力。谁在乎呢？”他大声地，也几乎是愤怒地说出了最后几个字，并得到了他平生头一回真正的掌声，就连特朗普家的孩子们都在鼓掌。", "接着，蒂尔说出了那句每个人都会记住的话。“诚然，”他说，“每个美国人都有自己独特的身份。我为自己是同性恋而自豪！我为自己是共和党人而自豪！最重要的是，我为自己是美国人而自豪！”一阵微弱的“美国！美国！美国！”的欢呼声为一位同性恋移民响起，而呼喊的人就是原本对同性恋及移民都怀有敌意的某政党的成员。特朗普一家也站了起来，所有人都站了起来。", "查尔斯·约翰逊在贵宾区观看蒂尔的演讲，一起的还有被高客传媒嘲弄过的霍安·同—代特。他们成了朋友，并计划在蒂尔的帮助下创办一家公司。那一周，约翰逊把同—代特引见给了蒂尔，于是这三人便为了共同摧毁高客传媒而携起手来。", "“如果我跟你够熟的话，我会吻你的。”同—代特当时说。", "蒂尔有点儿别扭，但还是热情地点了点头，笑着说：“可以，可以，可以。”", "他苦苦思索着有关他身份的最后几行文字。“我想让他们知道，同性恋一直是美国的一部分，美国是最适合同性恋的国家。”蒂尔告诉约翰逊。他从来没有在公开场合这样说起过自己的性取向，甚至他从来没有和他的大多数朋友直接说过，但他想“让人们了解完整的我”。“他一直以来没有出柜的时机，”约翰逊说，“而这就是。”", "个人的转变是有用的，赋予蒂尔关于政治正确正以某种方式阻碍美国再次伟大的论点权威性，并使特朗普免受他只是在利用不宽容的批评。特朗普领导下的共和党平台支持“传统的婚姻和家庭”，谴责美国最高法院2015年宣布同性恋婚姻在所有50个州均合法并宣称变性美国人享有平等的法律权利，这是奥巴马政府试图根据1972年教育法第九条的解释予以确立，重塑美国“以适应与美国历史和传统格格不入的意识形态模式”计划的一部分。突然间，这令特朗普更容易辩称，反政治正确不仅关乎冒犯受保护群体的自由。", "更重要的是，这次演讲将使蒂尔及其公司在战略上处于优势地位，假定特朗普能够克服困难并获得大选胜利的话。除了那一堵边境墙，特朗普对他将如何执政的具体计划一直含糊其词。蒂尔的演讲提出了一个可能的框架，即特朗普可以接受蒂尔长期呼吁的那种大型技术项目。当然，是要建造一堵漂亮的高墙，但特朗普的基础设施项目可以也应该包括对政府所使用的软件进行升级换代。华盛顿可以把目光投向硅谷，尤其是蒂尔持股的那些领域。"], "wcount": 11616}, {"icon": "16", "title": "第16章 蒂尔的政府理论", "paras": ["“你太棒啦！”特朗普在大会结束时对蒂尔说，“我们是一生的朋友。”", "不过，总的来说，这位纽约房地产大亨似乎对他的硅谷支持者也没那么当回事。蒂尔不在特朗普所真正感兴趣的范围内。特朗普关心的似乎只是蒂尔的钱，包括由此赋予特朗普的合法性，以及利用蒂尔作为其接触其他科技亿万富翁的渠道的潜在可能性。", "就蒂尔而言，他也没有立即认识到特朗普的价值。在共和党全国代表大会之后，蒂尔很享受自己打破界限的角色——他是第一个在共和党全国代表大会上公开谈论自己性取向的同性恋，但当其他竞选班子成员试图让他进一步参与时，他拒绝了。大会结束后，特朗普立即在投票中追上了希拉里，但随后又大幅落后。蒂尔告诉助手们，他担心特朗普会输，决心与他保持距离。", "然后，在10月初的一个周五下午，蒂尔和大多数美国人一起观看了《华盛顿邮报》流出的一段视频。在视频中，特朗普向《走进好莱坞》节目的主持人比利·布什吹嘘自己的出轨行为，包括带着一名电视主持人去买家具，试图和她上床。“我确实想睡她，”9个月前才刚与梅拉尼娅结婚的特朗普解释说，“可最后没成。”他还吹嘘自己曾对女性霸王硬上弓。“我只是开始亲吻他们，”他说，“如果你是明星，他们会让你这么做，抓住她们的私处。你可以干任何事。”", "人们一致认为特朗普完蛋了。美国参议院多数党领袖米奇·麦康奈尔称特朗普的这番言论“极度让人反感”，并敦促特朗普“对自己在录像中表现出的对女性的完全不尊重承担全部责任”。众议院议长保罗·瑞安宣称自己感到“恶心透了”，并说第二天在自己的家乡举行的活动将不再欢迎特朗普。许多著名的共和党人敦促特朗普让位，让他的副总统提名人迈克·彭斯再上一个台阶。", "约翰逊鼓励蒂尔换个角度看这件事。约翰逊对他说，从政治观点来看，这段录像最糟糕的地方并不是对性侵犯的明显认可，也不是通奸。用另类右翼的说法，这是一次失败的性诱惑，是一次“测试版”的举动。他说，剩下的就是异性恋男性私下里的谈话方式。异性恋男性对特朗普的尊重只会更多，而不是更少。“你应当加倍下注。”约翰逊建议道。", "约翰逊提出了一个计划，说蒂尔应该向丽贝卡·默瑟的政治行动委员会“让美国成为第一”", "做出重大捐献。由于默瑟是布赖特巴特新闻网的长期赞助人，一笔可观的捐款有助于蒂尔进入特朗普的核心圈子，而如果特朗普最终以某种方式胜出，那蒂尔就将是其竞选团队的救星。", "此次拟议的捐款将是约翰逊为这位四面楚歌的总统候选人恢复名誉所发挥的作用的第一部分，而第二部分将涉及下一场在圣路易斯举行的总统辩论。约翰逊和保守派作家坎迪斯·杰克逊安排多年来指控比尔·克林顿性侵的三名女性，以及第四名女性凯西·谢尔顿，在辩论前前往圣路易斯参加一场新闻发布会。", "控告克林顿的三个人凯瑟琳·威利、保拉·琼斯和胡安妮塔·布罗德里克在克林顿的批评者中可谓家喻户晓，但谢尔顿的事不太为人所知。谢尔顿指控一个41岁的男人在1975年性侵她，她当时才12岁。希拉里·克林顿当时是一名年轻律师，经营着一家法律援助事务所，她为这名男子辩护，理由之一是谢尔顿“情绪不稳定，有寻觅年长男性的倾向”。她的当事人最终承认了一项较轻的指控。", "约翰逊的WeSearchr公司为谢尔顿筹集了前往圣路易斯的旅费，并在其网站上宣传了她的故事。特朗普和这几名女子一起出现在脸书直播视频中，该视频在他上台之前播出。在辩论中，当被问及他粗俗的用语时，他提起了谢尔顿的事。“凯西·谢尔顿，那个年轻的女人，今晚和我们在一起，”特朗普说，“所以别跟我扯什么用语。”", "接下来的一周，蒂尔承受了最后一击。同性恋新闻杂志《倡导者》发表了一篇文章，批评他对特朗普的支持。“因在共和党全国代表大会上支持唐纳德·特朗普，彼得·蒂尔成为今年夏天的一大新闻，这位硅谷亿万富翁是一个与其他男性发生性关系的男人，但他是同性恋吗？”盖茨堡学院美国研究教授、作家吉姆·唐斯写道。唐斯认为，蒂尔的政治，尤其是他在大会演讲中对变性人权利的排斥，构成了对同性恋文化的背叛。蒂尔把这次演讲看作其个人的出柜时刻，唐斯则将其描述成对性少数群体的一次重击，而不是打破界限的时刻。", "第二天，蒂尔身边的人透露说，他将向特朗普的竞选活动提供125万美元，其中大部分资金将按照约翰逊的要求，指定用于默瑟的政治行动委员会。几周后，他在美国国家新闻业俱乐部的一次演讲中解释了自己的行为。“并不是唐纳德·特朗普所说和所做的每一件事我都同意，我想其他数百万投票给他的人也都一样，”蒂尔说，“我们投票给特朗普是因为我们认为我们国家的领导失败了。”", "在演讲中，他坚持认为，说特朗普就因为“抓住她们的私处”这句话而不能当选的那些自由派抨击者是一些无视国家更紧迫问题的无德小人。他提到了《倡导者》杂志的那篇专栏文章，反驳道：“‘多样性’这个流行词背后的谎言再清楚不过了，如果你不随大流，那么无论你的个人背景如何，你都不能算是多样的。”这与其说是在为特朗普辩护，不如说是在为特朗普的辩护人辩护，这是他从斯坦福时代起就一直坚持的相关论点的又一个版本。", "在演讲结束后的问答环节，蒂尔表示媒体应该忽略特朗普的愤怒，把注意力集中在他批评的实质上，即对待特朗普“要严肃认真，但不能死抠字眼”。举例来说，蒂尔说，特朗普关于禁止穆斯林移民或建设美墨边境墙的言论，应该抽象地解读。特朗普并不是真的想要禁止穆斯林入境，或者真的造1 600千米长的高墙，正如蒂尔所说，他只是想要“更理智、更合理的移民政策”且“其成本与收益之间要实现平衡”。蒂尔的这句“严肃但不抠字眼”极有可能是从《大西洋月刊》记者萨莱娜·齐托的一篇文章中抄袭而来的。齐托在文中解释了内陆地区的选民如何才能够忽略特朗普持续不断的搪塞之词。但这句话还是像病毒一样传播开来。“彼得·蒂尔以寥寥数语完美概括了唐纳德·特朗普”就是美国消费者新闻与商业频道的新闻标题。", "这笔钱和演讲都是意义重大的新闻，因为就在蒂尔捐款之前，特朗普并没有集中召集任何主要的科创界大佬为其捐款，这有助于扭转特朗普的竞选活动给人的正在崩溃的感觉，但这不是蒂尔的帝国帮助这位总统的唯一途径。马克·扎克伯格最初似乎是反特朗普的，后来却以自己的方式支持了这位候选人。", "曾有这样一个秘密，那就是脸书的一些自由派员工采取的行动跑偏了。对此，那些曾参加2016年5月和平峰会的保守派人士表示理解，但脸书的实际高管们似乎还想不通。那次峰会是在蒂尔的帮助下，由有影响力的右翼权威人士和脸书高管们召开的。脸书对保守媒体没有偏见，它本身就是保守媒体。因为脸书的动态新闻本质上是人气竞赛，而在脸书内部，混合了白人身份政治和经济民粹主义的“特朗普意识形态”比任何东西都有市场。", "“我认为硅谷还未意识到这一点。”曾出席那次会议的戴维·博泽尔说。在处理新闻方面，谷歌长期以来都聚焦于老牌媒体，相比之下，脸书则侧重于能带起一时热点的特刊新闻或右翼的网络爆料，这些可能比《纽约时报》的文章或左翼的网络爆料更易被人们分享。右翼内容的点击率最高。“热门话题”就是意图纠正这种情况的一种努力，既偏向脸书又不与右翼为敌，只是转向表面上更加合法的新闻来源。但是，扎克伯格似乎听从了蒂尔的建议，选择终结这一努力，并重回人气流量竞争中去，这给了“为网络爆料而生”的总统候选人特朗普巨大的优势。", "特朗普通过吸引能够找到的援助来建立这一优势。其中就包括臭名昭著的俄罗斯政府援助，即把用黑客手段攫取来的材料在社交媒体上分发，并通过脸书上的虚假账户和群组最终传给了1.26亿人，这些虚假网络和群组旨在阻止自由派支持希拉里，并煽动保守派投票给特朗普。此外，剑桥分析也卷入其中。在特朗普获提名后，剑桥分析将一些选民数据提供给了特朗普的竞选团队，并利用这些数据于2016年7月筹集到了8 000万美元。在此期间，在帕兰提尔的帮助下，一些选民信息也许就是剑桥分析利用脸书盗来的，并赫然出现在特朗普的竞选捐赠者名单上。", "但最重要的帮助至此还是来自脸书本身。脸书能够实现定位的算法远远优于剑桥分析所能提供的服务。脸书工程师团队曾进驻特朗普的竞选团队，为其培训竞选经理布拉德·帕斯卡尔，目的是让其能够使用一种使广告商可以精准地找到极端特定的潜在选民群体的技术。其中包括支持特朗普的群体，比如访问竞选网站但还没有捐款的人，以及特朗普认为对希拉里有利的群体，包括妇女和黑人，那些定向投给他们的广告提醒他们，希拉里曾针对性骚扰指控为其丈夫辩护，并在1996年描述帮派暴力时使用了“超级捕食者”这一种族主义措辞。", "希拉里竞选团队之前却拒绝了这种帮助，而脸书高管们后来做出的这个决定可能导致她输了大选。扎克伯格的亲密盟友安德鲁·博斯沃思曾在一份备忘录中称赞帕斯卡尔的工作，称其为“数字广告活动的高水平标志”。“脸书应当为唐纳德·特朗普的当选负责吗？”他问道。“我想答案是肯定的。”", "大选之夜，蒂尔在他位于旧金山的普雷西迪奥宅邸举办了一场聚会，邀请了所有他认识且有可能是特朗普支持者的人。参加的人并不多，大概20人，其中有蒂尔的助手、几位英俊的大学生模样的人及一些知名公司的首席执行官。当时，创投平台AngelList的首席执行官纳瓦尔·拉威康特和说服蒂尔支持埃隆·马斯克的SpaceX的PayPal联合创始人卢克·诺塞克也在场。新反动主义博主、蒂尔曾投资的Tlon公司的首席执行官柯蒂斯·雅文也参加了。", "起初会场的气氛有点儿沉闷。在一台调到美国有线电视新闻网的大电视前摆了几排椅子。蒂尔坐在前排，在等待选举结果时眼睛一直盯着屏幕。在私底下，他对待这位候选人的极端立场比在公开场合更友好些。当然，如果是在美国国家新闻业俱乐部演讲，他兴许就会与特朗普的“建墙论”撇开关系。但当他和朋友们在一起时，就像现在这样，他会澄清说他可能不同意那些具体的政策方案，但对特朗普坦率地谈论移民问题感到兴奋。蒂尔会说：“我喜欢他这样说。”", "晚上8点左右，一种兴奋感开始形成，此时各大新闻媒体宣布特朗普已接连快速赢下北卡罗来纳州和俄亥俄州，在密歇根州和威斯康星州的领先优势也越来越显著，这两个州原是希拉里志在必得的。而在希拉里本应轻松获胜的宾夕法尼亚州，双方也几乎打成平手。蒂尔对特朗普及坚决拥枪的中西部选民的预测正在变成现实。", "“这一切真的在发生吗？”有人问。", "香槟酒在会场传递着，电视也转到了福克斯新闻频道。还有人想知道蒂尔到底有多大把握，蒂尔说：“你永远不可能完全确定，但他拥有所有这些要素。他是真够傻，才能引起这么多人的注意。他也是够认真，才会那样去做。”气氛变得欢快起来，这不仅是因为他们的人赢了。“主要大家的心态都是‘我这么高兴，那是因为硅谷的每个人都对此不高兴’。”一位与会者说。", "蒂尔的电话一刻没停。参加聚会的人都在说，其中一位来电者是大名鼎鼎的伊拉克战争的公开支持者、美国驻联合国前鹰派大使约翰·博尔顿。他打电话来联系蒂尔，是想请蒂尔支持他到国务院任职。（博尔顿的发言人后来表示，博尔顿当时正在福克斯新闻台现场，选举之夜没有给蒂尔打过电话。）不久之后，蒂尔就不见了。", "这群人移步到附近的创始人基金的办公室，继续喝酒，并试图复盘刚刚爆冷而出的情况。彼得·蒂尔这个书呆子、不善交际的技术人员怎么就被约翰·博尔顿等人追捧了呢？毕竟，此前，蒂尔一直是个毫不讳言的鸽派，而且他在共和党全国代表大会上的演讲中还曾严厉谴责“愚蠢的战争时代”。难道博尔顿，也就是那个时代的缔造者，现在会向一个风险投资家、政治新手致敬吗？这也太离谱了。不仅蒂尔几无胜算的下注得到了回报，他还成了美国新政府中的关键声音，哪怕在一些看似与其专长领域相去甚远的事情上也是如此。", "蒂尔的助手们至此已经当特朗普胜选了，就好像这是世界上最自然不过的事。蒂尔年轻的幕僚长迈克尔·科雷特西奥斯和蒂尔基金会总裁詹姆斯·奥尼尔已经在兴奋地谈论交接仪式，他们说蒂尔将在几天内被任命为执行委员会成员，而特朗普的竞选团队已经承诺给他一个可观的一揽子大礼包。", "一位参加那次聚会的人说：“聊天的内容基本上就是，‘你想在哪里工作？’”他们算是明白了，假如愿意，他们将有机会获得一份行政工作。", "在“蒂尔江湖”里，还从来没有过比这更令人兴奋的时刻。在蒂尔的核心圈里，极少的自由派对此勉强认可——“嘿，他也就那么一说吧”，保守派则欣喜若狂。他们中几乎没有人喜欢特朗普，但这场胜选及蒂尔的参与让他们看到了新总统上台后的可能性。毕竟，特朗普是一个不按常理出牌的人，而且还是一个商人。按照“蒂尔江湖”的逻辑，这让他有可能比普通政客更优秀，尽管他也不完全是他们真正中意的那一类商人。也许他会欣然接受硅谷知识分子心心念念想要得到的那些政策。", "他们设想能有4~8年的有利于企业的税收政策、军工结合体能张开双臂拥抱硅谷，以及美国食品药品监督管理局放松监管，这对风险资本支持的生物技术公司来说是潜在的福音。也许，尽管实在是在做梦，但特朗普或有可能支持比特币这样的加密货币。美国的相关政策可能会损害中西部的工厂，但对像SpaceX和特斯拉汽车这样在美国本土从事生产的科技公司及英特尔等芯片制造商来说，这可能是一件好事。谁知道这些对科技友好的政策能延伸到什么程度。即使是那些反对特朗普的硅谷领军人物，也倾向于把蒂尔在白宫的影响力视为一个令人鼓舞的迹象。", "“他是唯一的技术领域支持者！”“蒂尔江湖”的一名成员说，这话概括了人们普遍的情绪，“这就是要靠近蒂尔的全部原因。如果你得到他的支持，那么特朗普大概率会照他说的去做。”在创始人基金，蒂尔的这种影响力非常明显，以至于员工们给他起了一个新绰号——“影子总统”。", "11月11日，特朗普宣布，蒂尔将与丽贝卡·默瑟、特朗普的子女、贾里德·库什纳、雷恩斯·普利巴斯等人一起进入其过渡团队执行委员会。蒂尔的职责是任命能够彻底改变“行政国”（即比内阁低一级的以缩略字母简称的各种机构）的人士，其中包括美国联邦贸易委员会、美国联邦通信委员会、美国证券交易委员会、美国食品药品监督管理局及更小的机构，如白宫科技政策办公室等。这些机构雇用了数以万计的人，包括数百名政务官，他们代表着政府中的某种政府。蒂尔的工作就是任命能够“打破此局面”的人。", "作为一个自由意志主义者，蒂尔似乎很享受这个角色。在其职业生涯中，他一直都没有停止攻击政府的监管权力，从最早创建PayPal及他的瑞士银行账户梦开始，一直到2009年撰文抨击民主，以及2015年接受泰勒·考恩采访时谴责“这些机构已经变得僵化，功能深度丧失”。", "特朗普政府采纳了这种说法，抱怨一个如此强大的行政架构，就算用“深层政府”这个词来形容都嫌不够。“它才不深呢，它就在你的烤架上！”这要归功于“彼得·蒂尔的政府理论”。", "进步人士明白了一些事情，他们说，有时我们赢得选举，有时我们输掉选举，但如果我们把联邦政府的职能扩展到这些以缩略字母简称的机构中去，那么在其内部本身，我们就将拥有我们自己的立法部门、我们自己的行政部门及我们自己的法院。这就是彼得想要追求的东西。", "蒂尔建议任命那些有意从内部瓦解“新政”和“伟大社会”架构的行政官员，特朗普要任命那些希望推翻雷佛龙尊让原则的自由意志主义法官。这一判决先例是在1984年确立的。当时，美国最高法院裁定，里根政府的国家环境保护局可以改变其对于由吉米·卡特签署成为法律的《清洁空气法》的解释，从而使该法对雪佛龙石油公司更宽松。该裁决允许联邦机构调整执法方式，只要对法律的解释是合理的，这便给了政务官更宽泛的自由度。倾向于自由意志主义的法律团体，如联邦主义者协会，多年来一直反对这一点。蒂尔是联邦主义者协会的长期成员，可以从内部消除“行政国”。", "彼得·蒂尔在大选后一周左右现身于特朗普大厦，准备即刻开始工作。当时，特朗普的工作人员不知道该怎么看他。他们认为，虽然他可能会兴致勃勃地向国家环境保护局局长等人提出建议，但他真正的目的只是拍拍照、在总统身边露露脸，并有机会提出一些于己有利的政策主张。毕竟，在特朗普的圈子里，许多人都是机会主义者和厚颜无耻的自我推销者。过渡团队的工作人员不断地想方设法地凑上去和特朗普待上几分钟，奇怪的是蒂尔根本就没提过要见特朗普。", "这固然奇怪，但远没有蒂尔带来的随从那么奇怪。当然，执行委员会成员带一两个随从出场很常见，但蒂尔一带就是五六个。他们都是年轻人，而且个个英气逼人，看起来都像男模特似的。特朗普大厦14楼一间混乱的办公室被分配给了蒂尔，这里之前一直归斯蒂芬·米勒、彼得·纳瓦罗和柯特·埃利斯等特朗普政策团队成员使用。一条长桌在这里支了起来，那几位帅哥摆上了硅谷风格的笔记本电脑。从11月到1月，他们肩并肩地工作，炮制一份拟任命的官员名单，常常工作到晚上，那时大多数员工都已回家。", "蒂尔列出了一份150人的名单，供特朗普考虑任命他们担任高级政府官员。其中许多人是极端自由意志主义者或反动派，其他人则很难归类。彼得瓦解政府的想法就明明白白地摆在那儿。人们以为特朗普是一个颠覆者，他们根本不知道蒂尔正在使劲推销的是什么。", "为特朗普的科学顾问这个职位，他推荐了美国最著名的气候变化怀疑论者、普林斯顿大学的威廉·哈珀。哈珀在气候变化问题上持极端相反的立场，他认为二氧化碳不仅对地球无害，而且实际上对地球有益，因为树木生长需要二氧化碳。他将“对化石燃料的妖魔化”与希特勒对待犹太人的做法相提并论。蒂尔造访时似乎对这位物理学家很着迷，却没有意识到，无论特朗普或其工作人员认为这个人有多么聪明，他们也不会把一个否认人为气候变化的人的名字加入呈参议院批准的名单中。2018年，特朗普任命哈珀担任国家安全委员会新兴技术高级总监，职位较低。哈珀后来对我说：“我从来不认为彼得在技术方面有多牛，除非你把技术的定义缩小到从互联网上获利的方式。”哈珀在2019年离开了特朗普政府，抱怨自己受到了白宫官员的打击，这些官员被“洗脑”了，才会相信气候变化的种种危险。", "蒂尔还推荐了另一位总统科学顾问的候选人——耶鲁大学的戴维·格勒恩特尔，他是一位反政治正确的斗士，著有《精简版美国：帝国学界如何摧毁我们的文化》，这本书读起来就像是《多元神话》的21世纪第一个十年的更新版。格勒恩特尔指责是“后宗教、全球主义知识分子”造成了自由派对学术界的全面接管。更具争议的是，格勒恩特尔明确表示，他所说的全球主义者指的是犹太人，他认为犹太人天生就天真且好斗。在有关地球科学的问题上，他没有哈珀那么极端，但他也认为气候变化怀疑论是“许多平凡的真理之一，多年来每一个阅读客观无偏见新闻的人都明白这一点”。", "格勒恩特尔的名字被披露之后，新闻媒体指出他并不隶属于任何主要的科学社团，这一点或许已被证明会有问题，如果白宫需要紧急处理危机，诸如自然灾害石油泄漏，抑或像《华盛顿邮报》有预见地指出的那样——一场疾病大流行的话。有人最初试图说服蒂尔不要将格勒恩特尔带到特朗普面前，但蒂尔坚持己见，他说格勒恩特尔是他所认识的最聪明的计算机科学家，除此之外，他还说格勒恩特尔曾被大学炸弹客炸过。1993年，在他出版了一本关于虚拟现实即将流行的书《镜像世界》后不久，他收到了特德·卡钦斯基寄来的一个包裹。卡钦斯基曾任教于加州大学伯克利分校，一直在给技术专家和其他他认为对去乌托邦未来做出贡献的人寄炸弹邮件。格勒恩特尔受了重伤，在爆炸中失去了右手的一部分。", "在某种意义上，这让格勒恩特尔成了技术殉道者，给蒂尔留下了深刻的印象，尽管这完全打乱了与特朗普的对话。特朗普对格勒恩特尔的伤势表示关注，向他询问了爆炸事件、健康状况、大学炸弹客等一系列问题，然后草草地将其打发。“你没有得到这个职务。”特朗普说。", "这已然成为一种模式：蒂尔往往会提出某个大胆而荒谬的名字，但立刻就被否掉，取而代之的是一个更容易被接受的人。对于美国食品药品监督管理局局长这一职位，他试图提名一些与自己持同样观点的人，他们和他一样认为食品药品监督管理局管制新药测试的主要职责根本就没有必要。", "癌症大数据公司Flatiron Health的联合创始人扎克·温伯格说，在药物开发商中，甚至在硅谷的许多人中，存在一种共识，那就是“不希望把个人置于风险之中”。Flatiron Health是一家由硅谷支持的医疗研究公司，现在归制药巨头罗氏所有。“但彼得·蒂尔认为管制新药测试将放慢事情的进度。他的整个策略就是，虽然会伤及一些人，但只要能创造进步，他就愿意接受这笔交易。”", "巴拉吉·斯里尼瓦桑是蒂尔领导的这场改革的盟友之一，也是蒂尔推举担任食品药品监督管理局负责人的第一人选。他是斯坦福大学计算机科学系讲师、加密货币企业家，与蒂尔一起投资了柯蒂斯·雅文的公司，并在评价硅谷精英们离开美国的睿智上看法一致。他在2013年的一次演讲中敦促科技人员离开“纸张地带”，“在美国以外建立一个由技术运作的选择性加入的社会”。斯里尼瓦桑对食品药品监督管理局也有一些怀疑。也就是说，他认为其根本就不应该存在。“就每一种沙利度胺而言，”他发推特说，“总是会有许多人因审批速度太慢而死亡。”他在接受特朗普面试前删除了这些推文。", "蒂尔的主张也大致相同，但由于早在20世纪60年代初，美国食品药品监督管理局就曾拒绝批准沙利度胺这种镇静剂，而且此案被认为是了不起的行政成功案例之一，因此对一个将要执掌食品药品监督管理局的严肃的提名人来说，这种立场太离谱了。在欧洲这个监管较宽松的市场，允许给孕妇开沙利度胺，结果数以千计的婴儿在出生时四肢还没有完全成形。这一事件促使国会要求药品制造商在提出药物批准申请之前必须自证其药物有效，这在实质上建立了现代药品监管制度。但是，斯里尼瓦桑曾认为，食品药品监督管理局可以由一个去中心化的数据库来替代，无须再通过严格控制的临床试验取得疗效证据，而是由医生和患者为他们参与实验治疗的体验进行评估，他称之为“为药物呐喊”，实际指的是蒂尔资助的餐馆评级服务。", "蒂尔推举的食品药品监督管理局负责人职位的另一人选是詹姆斯·奥尼尔，他具体运作蒂尔基金会，并一直作为投资者在阿贾伊·罗恩的风险投资公司Mithril工作。与斯里尼瓦桑相比，奥尼尔更谨慎一些，同时他也有实际的政府经验，曾在教育部、卫生与人类服务部担任演讲稿撰写人，但他从未接触过与宏观科技管理相关的岗位，而且其大部分职业生涯都与公共关系有关。奥尼尔也主张收回食品药品监督管理局监管药品疗效的授权。", "奥尼尔和斯里尼瓦桑去见特朗普，但这两个候选人并没有得到支持。巴拉吉是个天才，但这太离谱了。提名一位暗示要撤销食品药品监督管理局的计算机科学家（斯里尼瓦桑被称为“双脑人”）来管理该机构是不现实的。", "这样做会让特朗普被贴上激进分子的标签，而且还不是在正面意义上。相关人士认为：“这可不是在前100天内就能赢得的人事审议听证会。别忘啦，我们是一个联合政府，共和党建制派对我们的所作所为感到震惊。蒂尔对此心灰意冷。”", "在1月，蒂尔的长期合作伙伴杰夫·吉西亚为年轻的另类右翼活动分子举办了一场被他称为“糟透了”的聚会。希拉里曾用“一帮糟透了的人”来贬低特朗普的支持者，她还明确说，这指的就是“大老党”（即共和党）里的“种族主义者、性别歧视者、恐同者、仇外者、恐伊斯兰者”。吉西亚半开玩笑地借用希拉里的叫法，表明这个聚会就是专为蒂尔一直在培养的保守媒体人士组织的特朗普就职派对。蒂尔当然会出席。", "即便如此，甚至就在蒂尔因白宫内部出现极度混乱而焦急不安，并企图将“横扫一切”的自由意志主义者塞进特朗普政府的时候，他的关系网开始紧密合作。12月，吉西亚政治团体的组织者之一蒂姆·吉奥内特，即人们所知的另类右翼推特账户Baked Alaska的幕后人物，一直在发推文时使用“JQ”（另类右翼提及犹太问题时的简称）来阴谋论地谈论犹太人控制媒体。对于这个问题，希特勒曾试图通过他1942年的最终解决命令来回答。作为回应，吉西亚和迈克·切尔诺维奇把吉奥内特从演讲者名单上去掉，并通知他不受欢迎。他们还否掉了理查德·斯宾塞，因为此人向特朗普致以希特勒式的举手礼。", "蒂尔出席了那次聚会，但始终待在一旁，而且半个小时后就离场了。在其幕僚们的心里，蒂尔一直当了两个月的“影子总统”，但付出的努力几乎毫无成果。尽管他确实取得了一些令人欣慰的成功，但在他推荐的150个行政职位人选中，只有十几个人得到了实际任命。长期以来为他提供对冲基金创意的凯文·哈林顿将被任命为国家安全委员会的总统副助理，他的幕僚长迈克尔·科雷特西奥斯将担任副首席科技官。科雷特西奥斯最终在2019年被提拔为国家首席科技官，这是蒂尔努力争取到的唯一由参议院批准的任命。到2020年年中，科雷特西奥斯的权限进一步扩大，担任了国防部主管研究和工程的代理副部长，负责特朗普总统任期最后数月中五角大楼的研发经费预算。", "哈林顿赢得了蒂尔那些长期助手的普遍尊重，但除了他之外，上述那些人都不是蒂尔圈子里小有成就的人，也不是蒂尔试图安插在高层职位上的天才颠覆者。他们大多是平庸的事务官僚。或许是出于一厢情愿的想当然，又或许是出于职业嫉妒，“蒂尔江湖”的一个绝不支持特朗普的成员推测，蒂尔在白宫里安排了“他手下的一群无用之人”，借以给总统挖坑。", "蒂尔圈子里的其他更激进的成员认为，蒂尔未能在特朗普的白宫内安置更多的盟友，这是导致其失败的原因。有人认为：“他打响了一枪，也赢了几场小胜，但更多的还是败仗，他败就败在特朗普其实并不是一个革命者。”", "当然蒂尔最终彻底失败，是因为选择了破坏而不是维持常态，结果适得其反。这样看来，是特朗普圈内的温和派在其女儿和女婿的领导下粉碎了蒂尔策划的革命。", "但蒂尔其实从未指望一场革命，他总是备有后手，那就是对冲。特朗普政府上台之时，即蒂尔自己正遭遇政治挫折之际，他已经准备好了下一步行动的棋子。", "政治行动委员会“让美国成为第一”（Make America Number 1）最初被命名为“击败不诚实的希拉里”（Defeat Crooked Hillary），但后来改成了现在这个稳妥的名称。当时，一位官员对彭博社表示：“如果将其称为‘击败不诚实的希拉里’，就违反了联邦选举委员会的规定。”"], "wcount": 10495}, {"icon": "17", "title": "第17章 有争议的政策", "paras": ["12月14日，即蒂尔加入过渡团队一个月后，此时距新总统就职典礼还有一个月，在特朗普大厦25层的一间会议室里，当选总统依惯例在正中间就座，看上去春风得意。他最亲密的顾问悉数到场，有彭斯、普利巴斯、库什纳、斯蒂芬·米勒、伊万卡·特朗普，还有埃里克·特朗普和小唐纳德·特朗普。但真正的明星是美国最大、最重要的科技公司的首席执行官们，以及他们在特朗普一应事务上的导师彼得·蒂尔。", "蒂尔坐在特朗普的左手边，彭斯坐在他对面。蒂尔的左侧是苹果公司的蒂姆·库克。其他与会者则围着长桌与特朗普的顾问和孩子们交错就座，其中有脸书的谢丽尔·桑德伯格、亚马逊的杰夫·贝索斯及微软、思科、甲骨文、英特尔、IBM等公司的首席执行官。", "“这些公司都是巨无霸！”特朗普喜不自禁地说，接着不吝溢美之词地对蒂尔大加赞扬。他认为这位硅谷投资者“很早就看出了一些东西，甚至比我们明白得还要早”。为了给特朗普宽阔的肩膀让出空间，蒂尔把手臂缩到桌子下面，好像在躲开总统，而特朗普一边说着，一边伸手到桌子下面去摸索蒂尔的手，抓住后就拉到了桌面上。“他太棒了，太出色了，在共和党全国代表大会上得到了最热烈的掌声！”特朗普深情地摸着蒂尔的拳头说，“我要谢谢你，兄弟！你真的太出类拔萃啦！”", "虽然蒂尔觉得这兄弟的柔情有点儿令人尴尬，但他还是被感动到了。那年早些时候，他俩在脸书的会面既尴尬又紧张，但现在硅谷最优秀、最睿智的精英们来到特朗普大厦，向他们曾经嘲笑的场景表示敬意。蒂尔面带微笑。在没有人相信特朗普的情况下，他把宝押在了特朗普身上，而且还押对了。", "除了扮演权力掮客，蒂尔也有机会捞金进账。与会者中包括美国市值最大的几家科技公司的代表。蒂尔还邀请了两家较小公司的代表，他在这两家公司都有股份。蒂姆·库克左边坐着埃隆·马斯克，他的特斯拉汽车公司当时的市值约为第二大受邀公司思科的1/5。坐在马斯克对面的是一家规模更小的公司的首席执行官亚历克斯·卡普。", "当然，卡普是蒂尔的密友之一，他经营的公司是由蒂尔创建的，而且迄今公众并不了解蒂尔仍然实际控制着这家公司。然而，卡普也突然从唐纳德·特朗普身上得到了很多好处。就在大选之前，联邦法官在帕兰提尔起诉陆军的案件中做出了有利于帕兰提尔的判决。这意味着陆军将不得不重新对其合同进行招标，并将帕兰提尔和其他商业软件制造商纳入潜在候选人，以使之共同竞标这个价值能达到数亿美元的项目。", "法院的判决并不意味着美国陆军一定要购买帕兰提尔的软件，而只是表示军方将对该公司“仔细研究”，这是帕兰提尔的律师哈米什·休姆的说法。现在卡普有机会当面向美军总司令提出请求。他向特朗普保证，他的公司可以“帮助加强国家安全，减少浪费”。当有人问及，卡普就说，他也不清楚自己为什么会被邀请参会，他只知道这次会议是蒂尔组织的。“或许有好多我不知道的情况，但甄选过程肯定是有的，反正问到我，我就答应了。”当然，蒂尔没有邀请其他国防承包商参加这次会议，包括卡普的主要竞争对手雷神公司。", "2016年总统大选期间，硅谷和特朗普之间的鸿沟引发了很多争论。人们都知道特朗普非常鄙视亚马逊及其创始人杰夫·贝索斯，因为贝索斯手中握有自由派的《华盛顿邮报》，而且正如特朗普所说，亚马逊的“垄断倾向导致了百货商店和零售业的毁灭”。在竞选活动中，特朗普曾多次暗示，针对《华盛顿邮报》的那些负面文章，他将提起反垄断诉讼，借以反击贝索斯。而且，他曾攻击苹果公司将手机生产线安置在中国，并提议撤销最受大型科技公司青睐的项目之一——H-1B签证。脸书和谷歌认为，这种向科技人员授予临时居留权的签证在硅谷特别受欢迎，实际上应该扩大才是。", "考虑到特朗普对科技公司创始人倾向的立场及对科技公司创始人本身的敌意，几乎所有在场的人在大选时都支持希拉里也就不足为奇了。大选结束几天后，拉里·佩奇和他的谷歌联合创始人谢尔盖·布林主持了一次全员会议。布林在会上表示，他认为特朗普当选是“一种极大的冒犯，与我们的许多价值观相冲突”。贝索斯也曾开玩笑说，他真想把特朗普送到外太空去。", "专家预测，大选后的骚乱将使特朗普与这些自由派领袖对立，因为他们都赞成全球化、移民、毒品合法化及同性恋权利。事实上，关于此次会议的最早报道（基本上依据媒体被允许留在会场的那三四分钟）也印证了实际情况的确如此。《商业内幕》杂志发布了一张桑德伯格、佩奇和贝索斯同框扮鬼脸的照片，照片上方的标题是“完美地捕捉到特朗普和所有反对他的科技公司首席执行官的首次会面”。", "但在媒体被赶出去后，会场里的情况变了。随着镜头的消失，科技公司的首席执行官们立马变得热心体贴，一再感谢特朗普给他们这次见面的机会，尽管特朗普还在继续挤对他们。特朗普斥责贝索斯不该拥有《华盛顿邮报》，说库克搞不定苹果的资产负债表。“蒂姆也有问题，”特朗普厉声说，“他的现金流太多。”他还一度把这些人称作“世界历史上最伟大的自由主义者”。", "科技公司的首席执行官们自始至终面带微笑，奉承特朗普，取悦他的助手，还尽量避免私下显露分歧。大多数人都没有投特朗普的票，而现在他们又想向他表示他们可以与他一起工作。这些人太激动了，就好像他们终于被邀请和橄榄球队的四分卫共进午餐。特朗普已经做好因其关于H-1B签证的言论而遭受围攻的准备，然而这些高管反而表示他们愿意接受。“我们有些员工非常担心这个问题，”思科的首席执行官罗卓克说，他指的就是H-1B签证，“如果您能谈谈这个问题，可能对安抚情绪有帮助。”这是特朗普在整个一小时的会议中遇到的最大难题，他毫不让步地避而不谈，他说：“我们将在移民问题上干一件大事，我们要抓住那些坏蛋。”特朗普指的是他已经做过无数次的竞选承诺：驱逐数百万在美国的无证人士。", "没有人反对此事，也没有哪位首席执行官试图抨击特朗普表示他正在考虑的另一项政策，即建立登记制度，以便跟踪穆斯林进入美国的情况。相反，他们都试图避免讨论这一问题，暗示只要特朗普能够为他们的公司提供足够多的熟练人手，打击非法移民就没问题。“我们应该把边境安全与人才分开。”库克说，他建议美国应努力建立“对人才的垄断”。蒂尔私下里经常将接受美国价值观的移民和不接受美国价值观的移民区分开。他提出，美国可以采取一种与新西兰相似的体系，即使用积分制，不仅使受过良好教育、语言技能良好的移民更容易进入美国，而且使低技能移民更难进入。", "斯蒂芬·米勒完全支持蒂尔提出的积分制，并补充说特朗普将打击滥用H-1B签证的外包公司。总统大选期间，米勒曾因其在移民问题上的极端主张而引起人们的关注。他坚持要把墙建得越高越好，这无疑激怒了民众。另有资料显示，米勒在大学期间曾写过一系列专栏文章，似乎走的是一条种族主义路线，包括为比尔·贝内特关于打掉黑人胎儿的言论辩护，但他说被别人断章取义了。这些科技公司的首席执行官不仅没有一个为那些在这项计划下被拒绝入境甚至驱逐出境的墨西哥移民发声，而且似乎对此十分赞赏。谷歌董事长埃里克·施密特为特朗普的“胡萝卜加大棒”移民改革方案想了一个名字，他说：“就叫‘就业法案’吧！”", "这些科技公司的首席执行官本可以向特朗普提出其他一些他们所关切的问题。他们完全可以问他，为何要威胁利用反垄断法来损害他们，或者问他是否意识到他的反移民言论对他们现有的员工会造成多么大的伤害。他们完全还可以把特朗普许诺要退出《巴黎协定》的事提出来，或者探讨一下他在2014年就发推文阐述过的拟终结网络中立的计划，即要废除一项被在座的科技界人士视为现代互联网根基的法律，抑或讨论一下特朗普在竞选期间对于技术、科学及未来表现出的种种敌视。但是整个会场的人都忽略了这一切，而把话题转向了特朗普的标志性问题——中国。贝索斯抱怨说，亚马逊花了许多年时间试图在中国获得营业执照，并指责中国政府保护中国电商巨头阿里巴巴。他还称中国公司正在窃取其公司的知识产权，并抱怨美国邮政总局向中国制造商收取的货物航运到美国的资费太低。其他首席执行官也有类似的抱怨。", "蒂尔对特朗普总统任期所做出的最重要的贡献并不是提出了十几个建议任命的人选，而是能够让美国最有权势、最受尊敬的商界人士加入特朗普的圈子，尽管他们私底下都瞧不起他。在奥巴马总统的2011年硅谷晚宴上，虽然也有重量级人物参加，但并没有一个不落，而且那次晚宴还导致奥巴马总统和史蒂夫·乔布斯之间出现意见不合。与那次晚宴不同，此次会议几乎没有出现明显的分歧。", "这不是硅谷的官方立场，硅谷将自己定位为一场迅速兴起的抵制运动的一部分；这也不是特朗普的官方立场，在后来四年的大部分时间里，他一直在威胁要对大型科技公司征税、监管甚至将其拆分。描述这种情况可以用蒂尔喜欢的一个词——kayfabe，这是一个职业摔跤术语，指的是摔跤比赛按提前编写的脚本进行以更具观赏性。", "2017年1月，特朗普签署了一项行政命令，暂停来自七个以穆斯林人口为主的国家的公民入境，包括伊朗、伊拉克、利比亚、索马里、苏丹、叙利亚和也门。该命令适用于难民，而且在白宫收回成命之前，也适用于绿卡持有者。该命令还指出，当这些国家向美国的移民恢复时，凡因“少数宗教”而受到迫害的难民将享有优先权。特朗普澄清说，他的意思是说基督徒比穆斯林更容易获得美国签证。", "这就是特朗普在竞选活动中大肆兜售的承诺要实施的穆斯林禁令。此禁令立即受到自由派和公民自由意志主义者的谴责，他们指出这看起来不仅已经越线到宗教歧视地步，还把那些已经在美国生活多年但恰巧于1月出国旅行的人推入了极其糟糕的境地。700多名合法前往美国的人被扣留在机场，其中许多人在美国还有家人，当局却准备将他们遣返出境。", "次日，示威人群聚集在美国纽约肯尼迪国际机场的国际到达区。出租车司机罢工，数千人当晚举行集会，联邦法官下令停止遣返。纽约的示威被广泛报道，抗议者也纷纷出现在各地的机场，在旧金山国际机场，谷歌联合创始人谢尔盖·布林在此对记者们说：“我来这里，就是因为我也是难民。”布林还表示他是以“个人身份”来的。谷歌首席执行官桑达尔·皮查伊明确表示这一切反映了谷歌的企业价值观，皮查伊在写给员工的电子邮件中表示：“对这一命令的影响及任何可能对谷歌员工及其家人强加限制的提议感到忧心忡忡。”网飞、苹果和微软也发表了类似的声明。", "各大公司的反应受到旧金山科技媒体的猛烈赞扬，这些媒体偏向左倾，并仍然把硅谷的高管们捧为英雄。《连线》杂志宣称：“科技抵抗开始了！”实际情况则复杂得多。没错，有些公司，尤为突出的是谷歌，为了响应员工的维权行动，将自己摆在了特朗普的对立面，但大多数公司还是试图找到某种中间立场，希望能避免惹怒总统。", "这在那些蒂尔具有影响力的公司中尤为明显。作为支持移民的政治权益组织FWD.us的共同创建人，马克·扎克伯格似乎理应是这项行政命令的反对者，但他的反对声明明显比他的大多数同行要弱。他在脸书上发帖写道：“很担心特朗普总统近期签署的一系列行政命令所带来的影响。”但他也赞扬特朗普承诺要为那些儿时就来到美国的非法移民“拿出一些办法来”，其实这些人曾被奥巴马总统的行政命令赋予了合法地位。特朗普并没有兑现这一含糊的承诺，并于当年9月取消了该项目。扎克伯格在他的声明中还赞扬特朗普支持吸引高技能移民，这是脸书的业务重点。当时美国科技媒体网站TheVerge的科技专栏作家凯西·牛顿指出，脸书首席执行官的帖子“远没有达到批评的程度”。", "埃隆·马斯克更是直截了当地反对禁穆令，称这“不是应对国家挑战的最佳方式”。但马斯克在其他领域找到了与特朗普的共同立场，他加入了特朗普的经济顾问委员会，一起共事的是一群重量级人物，其中包括IBM的罗睿兰和迪士尼的鲍勃·伊格尔。此外，他还加入了另一个有关制造业的顾问委员会，共事的有英特尔的布莱恩·科兹安尼克和通用电气的首席执行官杰夫·伊梅尔特。这两个委员会将在2017年年底前解散，马斯克却在年中因抗议特朗普退出《巴黎协定》而辞职，但当时他们都受到了白宫的称赞。", "卡普似乎看不起特朗普，大选前夕，他在与帕兰提尔的员工开会时，把特朗普大骂了一通。他夸口说自己曾拒绝与特朗普见面，还称特朗普的财富都是“瞎编的”，把他描述成一个“恶霸”。卡普说：“我一点都不敬重这家伙，要编一个让我觉得没那么有吸引力的人出来还真是难。”但经卡普在特朗普大厦的一番表演之后，帕兰提尔开始利用蒂尔的一切可能的人脉，积极地向特朗普政府兜售。", "在过渡期之初，蒂尔曾敦促特朗普将长期担任美国国立卫生研究院院长的弗朗西斯·柯林斯解职。柯林斯是一位颇有建树的遗传学家，在比尔·克林顿和乔治·W.布什任期内领导了人类基因组计划，之后在奥巴马任期内接手了美国国立卫生研究院。蒂尔认定国立卫生研究院已经变得暮气沉沉，需要重整旗鼓。蒂尔建议由共和党国会议员、前麻醉医师安迪·哈里斯接任院长，此人来自马里兰州东岸一个极端保守的乡村地区。哈里斯是特朗普的坚定支持者，也是众议院自由党团会议的成员之一。2016年年初，他引起了公众的注意。当时在一场常规的普通投票程序中，他是8名反对以诗人和民权活动家玛雅·安吉罗的名字来命名某邮局的共和党人之一。他声称，安吉罗是美国历史上最著名的黑人艺术家之一，也是共产主义的同情者。在特朗普总统任期内，哈里斯通过对一项谴责匿名者Q的决议投考虑票，反对抗击新冠肺炎疫情的居家令和他所说的“口罩崇拜”，以及支持特朗普企图推翻2020年大选结果的努力等，进一步获得了知名度。他也是国立卫生研究院改革的长期倡导者，他建议国会强制该机构为年轻的研究人员提供更多的资助，这可是蒂尔钟爱的事业。", "解雇一位在政府工作了20多年的备受赞誉的遗传学家，并用一名以挑起与美国邮政总局之间的文化战争而闻名的极右翼煽动者来取代他，这样“亮眼的”动作也太过分了。但哈里斯1月初被允许来纽约参加应聘面试。", "根据特朗普政府后来披露的文件，对哈里斯的审查包括在特朗普大厦接受采访，以及与蒂尔和布莱克·马斯特斯共进午餐。在午餐后的一封后续邮件中，哈里斯同意蒂尔关于国立卫生研究院的某些方面已过时的看法，并提到非常渴望能更多地了解帕兰提尔。他说，他正在与帕兰提尔的最高业务开发主管希亚姆·桑卡尔接触。回过头来看，这似乎是一次非常成功的商业推销的开场。2018年，美国国立卫生研究院与帕兰提尔签订了一份价值700万美元的合同，帮助该公司跟踪其正在收集的研究数据。后续还会带来更多的订单合同。", "蒂尔的确试图在移民政策上与特朗普拉开距离。在一次采访中，他甚至赞扬起这位总统的一些值得怀疑的品行，比如他与普京的亲密关系，他与其企业在利益上的密集冲突，甚至他的发型。蒂尔指出，特朗普计划建立穆斯林登记制度是不可能实现的，至少在帕兰提尔是不可能的。“我们不会那样做！”他告诉《纽约时报》的专栏作家陶曼玲。", "但是，这位现在批评穆斯林登记制度的人却是该计划最著名的支持者克里斯·科巴赫背后的关键人物之一。这位堪萨斯州州务卿认识蒂尔10多年了，两人第一次见面时，科巴赫是美国移民改革联合会的律师，蒂尔曾于2005年左右向该组织捐款。", "蒂尔和科巴赫成为朋友的那段时间，科巴赫通过几件事引起了人们的注意，其中就包括起诉加利福尼亚州以阻止非法移民以州内学费标准上州立大学，以及为那些试图阻止非法移民获得住房的城市辩护。据一位了解蒂尔政治运作的人估计，蒂尔至少向科巴赫提供了500万美元用于其政治活动和事业，而这些都是蒂尔在2005—2020年一直倡导的。2016年总统大选后不久，科巴赫被拍到走进特朗普在新泽西的高尔夫俱乐部，随身携带一份“最初365天的策略规划”，其中包括一项具体计划，拟恢复“9·11”事件后一段时期的数据库来追踪“来自高风险地区的外国人”，并询问潜在移民对伊斯兰教教法的看法。特朗普的支持者为此项提议进行了辩护，指出同样的注册做法已经在第二次世界大战中被用于日裔美国人。", "此外，帕兰提尔已经开始与一些政府机构开展业务，而这些机构都是特朗普想要在打击非法移民行动中投入使用的。在竞选过程中，特朗普曾夸口组建一支大规模的“遣返部队”，这是一项需要依靠美国移民和海关执法局完成的警务工作。帕兰提尔与该局已经签订一份价值4 100万美元的合同，这得益于双方自2014年以来签署的一项合作协议。", "2017年2月，白宫宣布了将导致更多遣返和突袭行动的政策变化。此前，奥巴马政府曾指示移民和海关执法局重点遣返那些被视为威胁的无证移民，例如帮派成员或被判犯有暴力罪行的无证移民，被判犯有轻罪的一般不会被遣返。特朗普改变了这一切，命令移民和海关执法局遣返所有犯罪的无证移民，无论其所犯罪行大小；终止“抓了就放”政策，根据该政策，移民局官员可以让在越境时被抓到但向美国申请政治避难的人获得自由。新的指示要求，要么将这些人留置在拘留中心，要么将他们送到墨西哥去等待结果。政策备忘录指出，带孩子越过边境的父母可能会被遣返，即使他们的孩子被留在了美国。", "不管蒂尔做没做保证，帕兰提尔都将在这个强力执行计划中发挥重要的作用。公共记录显示，帕兰提尔创建了一个名为FALCON的数据库，与其为军方和情报部门创建的数据库没什么不同，该数据库旨在帮助移民局官员抓捕走私犯和其他边境犯罪分子。该公司还秘密帮助创建了第二个数据库——智能分析框架，该数据库创建了个人风险评分，海关和边境保护局用其评估旅行者和移民。", "上述内幕被披露，加之蒂尔支持特朗普，便引发了强烈的抗议声浪，首先是在硅谷，然后传到了硅谷之外。2017年1月，激进组织技术工人联盟在帕兰提尔总部门前举行示威游行，抗议该公司与特朗普沆瀣一气。两个月后，FALCON数据库建设被曝光，一群示威者出现在蒂尔的旧金山宅邸外，手持标语牌——“帕兰提尔：醒醒吧！你是同谋，不要为魔多开发软件，彼得·蒂尔是吸血鬼！”随后四年间出现了许许多多类似的抗议活动，而这两次是最早的，它们将巩固帕兰提尔与特朗普时代一些最具争议的政策之间的联系。", "帕兰提尔对特朗普政府的支持仍然是间接的，蒂尔却并不吝于直接将其商业利益与特朗普最有争议的政策挂钩。2017年，查尔斯·约翰逊说服蒂尔投资他与霍安·同—代特（在共和党全国代表大会上见过蒂尔的反高客狂热者）共同开发的新公司Clearview，约翰逊向蒂尔解释说他们的构想很简单：他和同—代特撰写应用软件，以便浏览脸书上的个人简历文件，以及上传到其他社交网络的此类文件，然后下载每个用户发布的照片，并根据照片上的名字保存相应的文件副本。他们将把这个数据库连同面部识别算法提供给警察局和其他执法机构。如果配合使用这些工具软件，警方可以拍下身份不明的罪犯的照片后上传，便可获取其姓名。两人将聘请纽约市前共和党政治活动人士理查德·施瓦茨担任联合创始人和总裁，同—代特担任首席执行官。约翰逊将获得该公司1/3的股权，但他不担任任何正式的运营职务，他的工作就是为公司筹集资金，并协助争取更多客户签约。", "约翰逊声称，这个软件对于特朗普的移民整肃行动是非常理想的。“其实就是构建算法，使遣返小队能直接甄别所有的非法移民。”他在脸书上发帖进行描述。约翰逊后来还说：“本来是开玩笑，可后来竟然成真了。”事实上，Clearview最终与移民和海关执法局签订了一份合同，允许它使用其技术，并得到了蒂尔的帮助。听了约翰逊的介绍，蒂尔提供了20万美元的启动资金。", "蒂尔对特朗普的好感，以及他与约翰逊等人的热络，足以让他众叛亲离。几个经年密友干脆不再和他说话，其他人只是避开与蒂尔相关的政治，试图将他对特朗普的看法同他作为技术专家的工作区分开来。", "蒂尔从不善于接受批评，这使得公开批评他几乎不可能，如果你还想要拿他的钱的话。他的一些密友却迈出了这一步。2016年总统大选后不久，曾负责管理对来福车投资的创始人基金合伙人杰夫·刘易斯写了一篇博客文章抨击特朗普，同时含沙射影地批评了他自己的老板。“如果我们认真对待特朗普。”刘易斯写道，暗指蒂尔曾提出的对特朗普“要严肃认真，但不能死抠字眼”的建议。“一年后写这样一篇文章对我来说可能不安全……如果一些流传的最可怕的谣言已然成真，那么我就会因今天写下的这些话而面临报复，”刘易斯表示，他希望证明自己是错的，但仍补充说，“就我迄今所见而言，特朗普总统当政的无厘头世界并不是我希望自己的孙辈后代延续继承的世界。”他后来编辑了这篇帖文，删除了批评蒂尔的文字，以及涉及其孙辈的话。", "2015年，蒂尔接受了Y Combinator的一个兼职职位，这家初创孵化器有时被人比作“蒂尔奖学金项目”。后来，Y Combinator扩大了风险投资领域，取代创业者基金成为硅谷名噪一时的公司。这家公司和创业者基金一样，致力于企业家和企业控制，对雄心勃勃的公司非常狂热。创始人基金的宣言中提到了快速飞机，实际上Y Combinator 还投资了一家超声速飞机制造商Boom Supersonic、一家核聚变发电公司、一家无人驾驶汽车公司，以及比任何投资者都多的种子期生物技术公司。", "蒂尔与年轻的Y Combinator 总裁山姆·阿尔特曼关系密切。阿尔特曼曾在2016年总统大选期间支持希拉里，他将蒂尔视为导师，并曾在大选前为他辩护，还承诺“不会因某人支持主要政党候选人而解雇他”。但在随后而来的秋天，Y Combinator悄悄地将蒂尔的名字从合伙人名单中删除，并修改了欢迎他加入公司时的博客文章。“编者按：彼得·蒂尔不再属于Y Combinator。”一则更新写道。虽然阿尔特曼始终没有对此做过公开解释，但人们普遍认为这一动作是对蒂尔政治的否定。", "这种反应更加强烈地表现在“蒂尔江湖”内部的进一步疏离上。曾经将蒂尔当作偶像崇拜的路易斯·安斯洛曾梦想能从蒂尔那里得到一份投资意向书。现在他大反转了。安斯洛提出要反对“PayPal黑帮”，敦促那些和他一样有着创业头脑的未来主义者加入“抵制蒂尔”运动，要拒绝接受来自蒂尔所属公司的任何资本。“我的梦想是从他那里拿到一份投资意向书，然后对他说：‘滚！’”安斯洛在一篇博客文章中这样写道。他将蒂尔支持特朗普与亨利·福特支持阿道夫·希特勒，以及蒂尔和特朗普都仇视政治正确与福特和希特勒都反对犹太人相提并论。这并不微妙，但它反映了科技行业对蒂尔影响力的一种严重的排斥。", "蒂尔奖学金学员们曾经得到保证，如果他们提出想要和风险投资家或潜在的商业合作伙伴见面，就一定会接到回应的电话。但在2017年，这样的回电都姗姗来迟。当我问及针对蒂尔与特朗普和极右翼关系的潜在负面反应时，一位继续成功创办科技公司的前2016届蒂尔奖学金学员这样说：“要说这个，我有一句标准的台词，我总是表示‘我是蒂尔奖学金项目的一部分，但当时蒂尔还只是个科技人物，而并非政治人物’，这样人们大概就能理解了。”", "他还表示，直到大选之前，他都一直认为那些描述蒂尔冷漠无情的报道没有说服力。“这绝对改变了我对他的看法，”他说，“这是我头一回觉得这个超级负面的帖子是可信的。”其他人更愿意将蒂尔下注特朗普看作纯粹与权力有关。一位著名的硅谷软件企业家说，他也许意识到了“我只要支付100万美元，就可以成为内阁成员”。", "对于蒂尔对一位保守的真人秀明星的支持，硅谷的大多数人最终的反应是冷嘲热讽。他们选择忽略蒂尔亲近极右翼的行为，以及特朗普的白人至上主义主张是多么贴合蒂尔对移民的情绪。这些也可能是真正的破坏者必须做出的道德妥协，与PayPal的增长黑客行为、脸书侵犯隐私的行为，以及蒂尔及其同事在整个职业生涯中有关要加速未来到来的谎言毫无二致。“你是否同意他的观点根本不重要，他总是对的。”曾为蒂尔奖学金学员的奥斯汀·拉塞尔说，他现在是专为自动驾驶汽车制造传感器的Luminar公司的首席执行官。拉塞尔说：“如果你真的想改变世界，你必须先在谈判桌上拥有一席之地。”", "事实上，也许就是为了安抚他的朋友，蒂尔才试图同特朗普拉开距离，并解释说示好只是与可能的赢家搭上关系的实用主义手段而已，就像奥斯汀·拉塞尔曾经做的那样。“支持特朗普是我做过的最不逆潮流而动的事情。”蒂尔经常这样说，别忘了，毕竟，半个美国都同意他的观点。他私下里更加直言不讳。在蒂尔基金会的一次晚宴上，有一位在蒂尔公司工作的长期投资人告诉一群企业创始人，其老板把支持特朗普当作向他始终鄙视的精英机构发起本能的攻击——“他想看着罗马被焚毁”。", "罗马在夏末开始燃起熊熊大火，当时蒂尔正在被试图确保任命为白宫情报顾问委员会主席。这个职位虽然是兼职，声望却很高，在他之前担任此职的人包括前参议员查克·哈格尔、前国家安全事务助理布伦特·斯考克罗夫特和前参谋长联席会议主席威廉·克罗。此职位本身具有巨大的潜在影响力，而且与他共事的还有甲骨文公司的萨弗拉·卡兹——除蒂尔之外唯一来自杰出科创行业的特朗普支持者，这些都给了蒂尔一个平台来号召为硅谷类型的软件注入更大规模的投资，同时能够帮到帕兰提尔，并给了他削弱公司竞争对手的机会。", "但随后在夏洛茨维尔发生了“团结右翼”集会事件，抗议者希瑟·海尔被白人至上主义者杀害，而特朗普在事后发表的评论中称“双方都有非常好的人”。这一事件也切断了蒂尔与白宫之间最重要的联系渠道。", "蒂尔开始胡扯，担心拟议中的职位将如何影响他的公司，当然，当帕兰提尔赢得又一个合同时，肯定会有人指控其间存在腐败行为。他告诉一名亲信，他担心这个职位对他的个人生活和隐私将意味着什么。2017年秋，蒂尔通知白宫说他将退出情报顾问委员会主席职位的角逐。2017年10月，蒂尔年满50岁。对一个一辈子都生活在死亡恐惧中的人来说，这一里程碑事件并非完全受欢迎，但他和他的长期伴侣马特·丹泽森还是邀请了朋友到奥地利维也纳来庆祝。当客人们纷纷到场时，他们被告知这不是生日聚会，而是婚礼。蒂尔要结婚了。", "从表象看，很容易误将蒂尔转身远离特朗普政府当成退却。他其实再也不想因为职位原因而不得不为特朗普总统极具争议的移民政策辩护，也不想再面对罗伯特·穆勒的“通俄门”调查不断加码时的审查。他安定下来了，至少在社交方面，他和丹泽森考虑要孩子。不过，尽管他远离了公众生活，但他并没有离开政治或科技领域。相反，他正在发起一场运动，以巩固自己在华盛顿的影响力，并确保他的公司能够从这种影响力中受益。特朗普政府越来越丑陋，但这也是彼得·蒂尔职业生涯中最有利可图的四年。"], "wcount": 10591}, {"icon": "18", "title": "第18章 “蒂尔江湖”信条：被骂邪恶总比被骂无能强", "paras": ["2019年年初，我沿着日落大道来到一座玻璃办公大楼，这里离西好莱坞那些风景优美的俱乐部不远。蒂尔资本的大套房位于大楼的11层，是崭新的，里面摆满了看起来十分昂贵的20世纪中期的家具，却明显缺少生气，这一点和人们对蒂尔家的描述一模一样。这里寂静得仿佛掉根针都能听得见，而且大多数办公室似乎空无一人。一位助手出现了，把我领到一间玻璃会议室，那里可以看到令人叹为观止的峡谷景色，他还给我端来了一杯用漂亮碟子托着的浓缩咖啡。几分钟后，蒂尔走了进来，身穿一件开领Polo衫和牛仔裤，脸上笑意盈盈。我们的谈话未作记录，持续了一个多小时，接着突然就结束了，蒂尔起身径直走了出去，把我丢在那儿尴尬地琢磨还有没有人会过来送我出去，又或许人家想的本来就是我自己离开。这是一种非常奇怪的退场方式，倒也不是说完全粗鲁的那种，但就好像他已经没有更多的话要说，却也没想到要道个别。", "在采访中，我尝试引导他说出对未来的看法，也就是说特朗普之后会怎样。我还想弄明白他为什么总跟谷歌过不去，两者之间公开的敌对状态始于2012年，当时蒂尔正在斯坦福大学开讲座。在其中一场讲座中，他提到了谷歌在互联网搜索领域的垄断地位，然后坚称谷歌把自己伪装成一家通用技术公司，根本就是为了避开美国司法部和其他反垄断监管机构的审查。蒂尔说，这种自我表述就是一个谎言，谷歌在无人驾驶汽车和社交网络等领域都有业务，其原因就是“政治要求资金必须分散开来”。", "当时，大多数听到或读到蒂尔上述说法的人都以为他只是把这当成一种有意思的观察结果，甚至是某种褒奖，但事实并非如此。2001年，蒂尔在PayPal与易贝的争斗中以反垄断审查相威胁；2011年，当年曾具体负责此事的高管文斯·索利托现身夏威夷，代表另一家蒂尔投资的公司Yelp在西部总检察长会议上做演讲。该公司首席执行官杰里米·斯托普尔曼做过网站X.com的初级工程师。虽然是被埃隆·马斯克招入公司，但他挺过了公司的内部变局。后来，在公司被卖掉且他在商学院学习了一年之后，他来到克莱瑞姆资本的办公室实习。蒂尔没有让斯托普尔曼着手实际工作，而是把他交给了列夫琴。列夫琴创建了一个企业孵化器。正是在这里，斯托普尔曼萌生了创建一个用户可以点评餐馆和其他商户的网站的想法。", "Yelp发展得一直很顺利，直到谷歌仿照它搞出了一个Google Places，而且就安排在其针对餐厅和其他商户的搜索结果旁边。索利托在2011年的那次演讲中指出，Google Places正在从Yelp上提取点评，本质上是窃取其内容，然后利用这些内容从竞争对手那里吸走流量（和收入）——这是典型的非法垄断行为。", "谷歌停止了这种做法，但那年秋天晚些时候，斯托普尔曼出现在参议院司法委员会面前。他表示，谷歌存在不公平竞争行为，应该阻止它利用自身的市场实力抢夺互联网的其他领域。“今天是政府保护创新的难得机会，”斯托普尔曼说，“允许一个拥有垄断市场份额的搜索引擎开发和扩展其主导地位会阻碍创业活动。”", "2012年7月，即蒂尔在斯坦福大学抨击谷歌几个月后，他与谷歌董事长埃里克·施密特同时出现在科罗拉多州阿斯彭某个会议的主席台上，该会议被标榜为一场关于技术未来的辩论。施密特首先发言，赞扬了科技产业，尤其是谷歌，在不断发展的世界中的存在。他说：“在我们有生之年，我们将从只有极少数人能接触到全球信息，走向世界上几乎每人都能用母语接触到全球所有的信息。”", "蒂尔的衬衫外面套了一件运动服，衬衫上的两个扣子解开着，他牙关紧咬，然后才露出了笑容。“埃里克，作为谷歌的宣传部长，你干得非常好！”他说，由此开始阐述他认为科技行业已经停止创新的观点，“很明显，个别公司确实做得很好，尤其是如果他们有像谷歌在搜索领域那样的世界级垄断的话。”", "“合法垄断。”主持人亚当·拉辛斯基纠正他说。", "“只要他们不通过不公平的扩大垄断势力来拉拢和压迫其他公司，那就是合法的，”蒂尔面带微笑地说，“只要不滥用，垄断就是合法的。”", "施密特对此一笑置之，说他当这是好话，但蒂尔的猛烈抨击持续了半个小时。他说，施密特及其同事“在很多情况下更喜欢的是电脑而不是人”，然后暗指施密特不恰当地将席卷中东的革命热潮归功于自己。“实际发生的情况是，食品价格在前一年上涨了30%~50%，”蒂尔说，“人们基本上变得……人在绝望时会变得更加饥饿，而不是害怕，于是开始反抗。埃里克却跑过来说：‘让他们吃苹果手机吧。’”", "最后，蒂尔集中诟病了谷歌的资产负债表，表明该公司有300亿美元的现金，却不知道该如何使用这些钱。“理智而诚实的做法应该是宣布谷歌不再是一家科技公司，”蒂尔说，“这就像一家每年产生大量现金流的银行，但你不能分红，因为在你收回300亿美元并返还的那一天，你已经承认自己不再是一家科技公司。”", "五年后，谷歌不再只是Yelp的威胁，它已然成为一个庞大的企业集团，与脸书竞争广告收入，似乎还信誓旦旦地要抢夺原本有可能归帕兰提尔的那些高科技国防合同。事实上，它以这样或那样的方式对蒂尔资产组合中的几乎所有公司都构成了威胁。", "谷歌也特别脆弱。施密特与巴拉克·奥巴马，以及后来与希拉里·克林顿的关系十分密切，他甚至因一张在希拉里竞选晚会上戴着工作人员徽章的照片被曝光而声名狼藉，这让特朗普极不待见他，并在竞选期间斥责“谷歌过滤了有关希拉里的负面结果”。同时，谷歌也成了大型科技公司所犯原罪的现成替身，这些原罪是蒂尔非常不情愿承认的。和脸书一样，谷歌也收集了海量数据，这些数据往往来自那些可能没有意识到自己被监视的用户；和脸书一样，谷歌实际上也让广告商获得了这些数据；还是和脸书一样，谷歌也被俄罗斯的网络恶意挑衅者（通过优兔）操纵了。", "蒂尔在特朗普当选总统后，开始对那些愿意听他说话的人表示：“公众，尤其是在2016年总统大选中感到痛苦的自由主义者，通常把怒火都撒到脸书身上，但真正邪恶的大型科技公司并不是脸书。”扎克伯格的公司“受了太多不该受的不公正责骂”。他暗示，如果有人应该受到监管，那也不是扎克伯格，而是他的主要竞争对手。在幕后，那人做的不仅是动动嘴而已。", "蒂尔在2017年离开特朗普的白宫后，这场运动变得更加激烈，而一开始的方式与他自大学时代以来的许多公司和政治项目最初开始的方式如出一辙——打一场文化战。谷歌和斯坦福大学一样，充满了左派理想主义者，他们致力于公司的崇高使命：“将全世界的信息组织起来，使其随处可用及有用”，以及听上去略微有点儿进步的承诺“不行恶”的政治。", "但谷歌也有一股保守力量，那就是年轻的大学毕业生们，他们被这家不断成长的公司吸引，因为它的薪酬高、工作稳定，而且以聘用精英工程师而闻名。他们中的许多人擅长将繁荣福音与彼得·蒂尔的自由意志主义政治融为一体，他们看了影片《社交网络》，读了《从0到1》这本书，为罗恩·保罗欢呼，为唐纳德·特朗普欢呼，也为高客传媒的毁灭而欢呼。", "2017年7月，来自芝加哥郊区的28岁谷歌工程师詹姆斯·达莫尔散发了一份备忘录，称公司一直在系统性地歧视某些员工。这类抱怨在这家理想主义的公司里很常见，这里的员工在虚假的学术氛围中把20%的工作时间花在做个人项目上，还针对公司邮件列表上的各种主题发表自己的想法。谷歌的大多数员工都认为公司歧视少数族裔和女性，这一点在公司有关多元化的统计数据中得到了证实，该数据显示白人和亚裔男性在公司员工中占比极高。但和蒂尔一样，从小就下国际象棋，最近又加入了男权运动的达莫尔认为谷歌是在歧视保守派人士。他观看了纪录片《红色药丸》，这部纪录片的导演是坚定的女权主义者，但随着拍摄的深入，她开始质疑自己的信仰。这部影片的片名采用了柯蒂斯·雅文喜欢用来指代“启蒙”的词语。他还观看了乔丹·彼得森的演讲。乔丹是一位有争议的加拿大心理学家和文化评论家，经常猛烈抨击平权法案。", "彼得森的观点说服了达莫尔，他写道，谷歌的经理们一直在“羞辱”保守派人士，要他们对谷歌中女性占比过低的情况保持沉默，因为女性占比低并非因为歧视，而是因为女性对编程的兴趣不如男性。这在达莫尔看来是说得通的，因为女性似乎更外向、更易情绪化，而且达莫尔声称这些特质与成为优秀的程序员并不相符。8月初，谷歌员工将备忘录予以公开，从而揭穿了这一扭曲的逻辑。", "谷歌解雇了达莫尔，他便去找了媒体。他在接受彭博电视台采访时表示“他们出卖了我”。达莫尔还说：“我分发这份备忘录是出于良善的本意，却受到了不公正的惩罚。”蒂尔资本的总经理埃里克·温斯坦在推特上发文称，谷歌解雇达莫尔，是在“教育我的女儿说，她通往财务自由之路不在于编程，而在于向人力资源部门投诉”。他签名落款：“谨致谢忱，一位父亲。”温斯坦虽然有上面这样的头衔，但他今天最重要的角色是播客“门户”的主持人。在该播客中，他采访了反主流人士，包括蒂尔，他还带领了一群优兔名人，其中包括彼得森，他们致力于抨击政治正确，他戏称这些人为“知识分子暗网”。", "蒂尔的朋友杰夫·吉西亚后来成为一名另类右翼分子，他借用蒂尔在20世纪90年代中期对多元文化主义的悲观论调，发表了一系列为达莫尔辩护的推文。吉西亚写道：“让我们去找更多的人来谈论谷歌备忘录吧，主题标签：#多元化神话。”他后来删除了这些推文。", "查尔斯·约翰逊接下了培养达莫尔的任务，在其得到蒂尔支持而建立的WeSearchr网站上，他以达莫尔的名义开设了一个法律辩护基金，谴责“激进左派一直在煽动可恶的网络暴民公开羞辱和欺凌独立派、自由意志主义者、保守派及单纯的反主流人士，还害他们被解雇”。此基金共筹集了6万美元。他还安排达莫尔与蒂尔及著名的劳工律师兼加利福尼亚州共和党主席哈米特·迪隆会面。大约在同一时间，蒂尔邀请了一群愤愤不平的保守派谷歌员工到他家，约翰逊出面接待了这些人。", "2018年1月，达莫尔和另一名前工程师对谷歌提起集体诉讼，称该公司歧视白人男性和保守派，指出该公司的多元化举措，包括讨论白人男性特权和表扬女性员工占比50%的部门等，违反了反歧视法。", "约翰逊一直在敦促蒂尔为高客式的法律攻击再找一个抓手，并建议他支付达莫尔的法律费用，但蒂尔拒绝了。“我不知道他为什么不支持我们。”达莫尔说。部分原因可能是蒂尔另有更大的计划，这些计划当时正在密苏里州杰斐逊城的一座政府大楼里展开。", "2017年11月，当达莫尔正在策划其诉讼时，曾在《斯坦福评论》工作的乔希·霍利宣布，作为密苏里州司法部长，他将以收集私人数据为由，对这家占主导地位的搜索引擎公司展开反垄断调查。霍利说：“在世界历史上，还没有任何一家实体像谷歌这样收集了如此多的个人消费者信息。”他的这番话也可以轻松地套用于脸书或帕兰提尔，但霍利还没打算捎带上它们。“我们不应该就这么接受这些企业巨头所说的话，什么他们把我们的最大利益放在心上。”他发誓要调查各搜索引擎如何使用竞争对手网站的内容，然后带有倾向性地让搜索结果对其产生不利影响。这与Yelp几年前就提出的指责如出一辙，而这已成为支持反垄断行动的人常用的攻击路线。", "霍利的诉讼在硅谷被一笑置之。他当时刚刚宣布他正在考虑竞选参议员，而37岁的他被认为是一个没有经验的机会主义者。但他认识彼得·蒂尔，蒂尔也为他制订了一项庞大的计划。霍利进斯坦福大学比蒂尔晚了10年，他也为《斯坦福评论》撰稿。2015年，当霍利宣布竞选司法部长时，蒂尔为其竞选捐赠了30万美元，这可是一大笔捐款，霍利在两年的竞选期间总共筹集了400万美元。2017年11月9日，蒂尔给予霍利两笔总额达到联邦最高限额的捐款，即每笔2 700美元，用于他的初选和大选竞选。四天后，霍利宣布了他的诉讼。", "霍利否认蒂尔的捐款影响了他的行动，但在谷歌内部，员工们发现了协调一致的攻击，在背后支持的就是蒂尔，毕竟他已经进入谷歌的主要竞争对手脸书的董事会。", "2018年1月，蒂尔出现在斯坦福大学，和他的老朋友里德·霍夫曼在台上对谈。两人对特朗普的看法一直存在分歧，霍夫曼和他的妻子米歇尔·伊强烈反对特朗普，并在大选后避免与蒂尔交往，但现在他们又和好如初了。在由蒂尔的朋友、保守派历史学家尼尔·弗格森主持的活动中，蒂尔与霍夫曼就社交网络是否应该试图管制虚假信息的问题展开辩论。霍夫曼认为这样做是明智的，但蒂尔不同意并再次攻击谷歌的“宣传”。蒂尔还表示人工智能被谷歌视为核心竞争力，“人工智能关乎大数据，关乎大政府控制所有数据，比你还要了解你”。", "后来，当弗格森问蒂尔，假设民主党赢回白宫控制权，反垄断的前景会如何时，蒂尔在回答时却把这个问题反转过来。如果特朗普转而追捧科技公司呢？", "蒂尔：让我感到震惊和担心的是，大型科技公司在政治博弈中的表现简直太过糟糕……有件事或许很理想，又或许很愚蠢，甚至可能根本就是错的，那就是硅谷是一个“一党制”王国。在我们的社会，当你遇到麻烦，政治方面的，当你什么事都一边倒的时候，一切都由一个政党说了算。你说监管可能来自左翼。在这一点上，也很可能来自共和党。如果共和党想要管制你，那你真的就麻烦大了。", "弗格森：他们会怎么做？我想象不出共和党会采取大规模的反垄断行动。", "蒂尔：你知道的，办法很多哦，不过，我才不会给他们出主意。", "这个欲言又止的假设未能明确点出蒂尔在共和党打压科技公司（尤其是谷歌）中所发挥的作用。正如当时他身处一场10年前他当对冲基金经理时就预警过的民粹主义起义的中心，还秘密地为该起义提供资金那样，蒂尔现在又身处这场监管科技公司运动的中心。他提及这个“一党制”王国就是对达莫尔所表达的且被约翰逊和蒂尔圈子里的其他人放大了的那些不满的一种认可，但对观察细致的人来说，这也是一个忠告：要么搭上特朗普的列车，要么就等着美国联邦贸易委员会找上门来。", "几周后，蒂尔重新打响了文化战争。他开始告诉朋友们，他打算从科技行业急流勇退，而朋友们又把这一消息透露给了媒体。对于互联网造成美国社会两极分化的那些行为，以及网络如何系统性地削弱人们的隐私，蒂尔的内心感到十分矛盾。于是，他打算出走，离开硅谷到日落街上面的山上安家，还会把蒂尔资本和他的基金会也搬到那里。他卖掉了普雷西迪奥的房子，这所房子曾是他作为对冲基金经理和技术专家的勃勃雄心的象征。", "这一举动是纯粹的“剧本摔跤”式的安排。蒂尔总是到处旅行，他在五大洲拥有10多处房产，2012年就拥有了位于好莱坞的宅所，而且在旧金山仍然另有一处居所。他没想搬迁创始人基金，这是他最重要的投资利器，就在搬家之后，那里的员工们都说他好像不曾离开过，他待在办公室里的时间和以前一样多。但此次搬迁给了他一个现成的话题：这个建立了硅谷的人却已然成为硅谷最直言不讳的批评者，即使这些批评差一点儿就让他离开脸书的董事会，或者与帕兰提尔拉开距离。几乎无人注意到这种前后矛盾的情况。", "他有时会把搬家同湾区不断攀升的房地产价格联系起来，抱怨作为一个风险投资家，他的大部分投资资本都流进了“城市恶房东”的腰包，表现形式就是商业租金及员工为抵消住房成本所必需的高薪，但他的大部分抱怨还是涉及政治的，几乎就是他在斯坦福大学读本科时开始精心构写的那些冷嘲热讽的忠实再现，而且完美地推销给了保守媒体。他经常说硅谷在意识形态上让人感到如此压抑，那里充满了非常聪明但“被洗脑”的工作者，他们被驱使着走入政治正确，蒂尔认为这是美国社会中最重要的一个问题。他对左派的批评会揭露出这一明显的伪善：这个因为人家写了自己不喜欢的东西，就报复性地弄垮了那家媒体的男子，却正在抱怨自由主义者的压迫，但在福克斯频道和布赖特巴特新闻网上，以及在另类右派评论和“知识分子暗网”中，他却是一个敢讲真话的人，甚至是一个英雄。“当人们一致地站在某一边时，这并不是说他们找出了真相，而是说他们处于某种极权主义的境地，”蒂尔对福克斯商业频道主持人玛利亚·巴蒂罗姆说，“硅谷已经从一个相当自由的地方转变为一个‘一党制’王国。”", "虽然蒂尔要让朋友、追随者、亲信在特朗普政府内部担任权力职务的努力并没有完全成功，但也没有完全失败。除了凯文·哈林顿和迈克尔·科雷特西奥斯，创始人基金合伙人、帕兰提尔前员工特雷·斯蒂芬斯（被蒂尔圈内人称为“迷你版蒂尔”）在过渡期内被派往五角大楼。蒂尔还帮忙在国家安全委员会中安插了他的朋友、保守派煽动者迈克尔·安东，此人发表过一篇题为“93号航班的选举”的文章，将希拉里·克林顿比作“9·11”事件恐怖分子，从而使一些温和派共和党人转向支持特朗普的立场。先前曾在海军服役的帕兰提尔前营销人员贾斯汀·米科莱进入国防部担任国防部长吉姆·马蒂斯的演讲稿撰写人和通信战略顾问。", "马蒂斯认同蒂尔、亚历克斯·卡普及与该公司关系密切的其他人10年来一直宣扬的开拓创新精神，但他也并非唯一的认同者。他的高级幕僚中还包括国防部办公厅主任安东尼·徳马蒂诺和高级顾问萨莉·唐纳利，二人都曾在帕兰提尔担任过顾问。2017年年初，蒂尔和斯蒂芬斯访问了五角大楼，敦促那里的官员考虑围绕计算机对政府进行重新布局，让硅谷公司更容易与它们开展业务。“错误总会犯，但更有不犯任何错的错误，这才是非常大的错误。”蒂尔在演讲中说。为了开创新时代，就得“行动迅速，打破常规”。", "帕兰提尔可以说在美国国家安全委员会还有一个更重要的盟友，尽管时间非常短暂。他就是迈克尔·弗林，这位好斗的中将在被迫离开奥巴马统率的军队后，将自己重塑为一个环游世界的、亲俄的“让美国再次伟大”主题演讲家。当然，在此变化之前，他是第一位公开呼吁军队采用帕兰提尔的软件的高层军官。弗林上任仅三周后就辞去了国家安全事务助理一职，原因是他在上任前与俄罗斯大使多次交谈的问题上撒谎。他被赫伯特·雷蒙德·麦克马斯特取代，麦克马斯特在很多方面都不像弗林，他是一个制度主义者和职业军人，从来没有参加过选举。但在第一次海湾战争及在伊拉克战争期间名声大振的麦克马斯特与他的前任有一个共同点：他也是一个热情的帕兰提尔用户和拥护者。", "当然，任命这些对帕兰提尔创新品牌抱有好感的军事官员也许与蒂尔没有任何关系。这些创意想法即使在奥巴马当政时期的政府机构中也是非常赚钱的，但在接受采访时，帕兰提尔的高管们坚称他们并没有从优惠待遇中得到好处。“这简直荒唐透顶！”卡普对我说，“建立这种业务需要10年的时间。”特朗普做出的这些任命却达到了在其政府中安插认为帕兰提尔极为有利的专家顾问的客观效果。军方在帕兰提尔和原分布式通用地面系统的承包商雷神公司之间举行了一场实力大比拼：两家公司都要建立一个原型系统，并将它呈现给一组士兵。这种比拼正是帕兰提尔早在好几年前的一场诉讼中就呼吁过的。", "军方原本对帕兰提尔心存疑虑，但负责分布式通用地面系统的官员们现在突然变得热心起来。帕兰提尔内部人士担心自己的优势能否让这些人信服——帕兰提尔的软件在过去10年里确实有极大的改进，也担心他们能否承受得住政治压力。不管怎样，2019年年初，军方宣布帕兰提尔完胜：该公司将获得有史以来最大的一单合同，价值高达8亿美元甚至更多。这次胜利令帕兰提尔一时间风头无两，该公司突然开始寻找更多五角大楼的项目，价值上亿美元。", "帕兰提尔并不是蒂尔从特朗普总统任期中捞好处的唯一途径。作为国防承包商的初创公司，安杜里尔对外推广的力度与帕兰提尔相当（甚至也借用了《魔戒》中的一个名字——“安督利尔”就是纳西尔圣剑，在精灵语中意为“西方之焰”），它由特雷·斯蒂芬斯和帕尔默·洛基创立。帕尔默是约翰逊的密友，其先前的虚拟电影工作室Oculus曾接受创始人基金的投资，并且已经被脸书收购。安杜里尔公司被“蒂尔江湖”的成员称为“彼得的下一个帕兰提尔迭代项目”，它增加了三个合伙人（其中两人此前曾在帕兰提尔工作），并从蒂尔的风投公司迅速筹集了1 750万美元。正如帕兰提尔当初精准地抓住一个新的政治机会，即美国人因“9·11”事件而突然对数字监控和数据挖掘采取开放态度一样，安杜里尔为美国边境开发硬件和软件，正好迎合特朗普要“修墙”的狂热，蒂尔曾说这不应完全照字面来理解，但他很乐意在资金上予以支持并从中获利。这套软硬件装备已经开始在技术层面协助警戒美国的边境，并将进行商业定价，而不是像SpaceX的火箭和帕兰提尔的软件那样基于合同。", "当然，帕兰提尔在最早的那些年里主要依靠美国中央情报局的赞助；对安杜里尔来说，持续提供支持的政府部门是美国海关和边境保护局。美国海关和边境保护局的资金充裕，特朗普总统新近授权该机构改善边境安全，遣返非法移民，最具争议的是将移民儿童与他们的父母分开。作为一个实际问题，美国政府通常要么在有孩子的家庭出庭受审前释放他们，要么将他们作为一个群体拘押。但2018年4月宣布的一项新的“零容忍”政策，要求警方将涉嫌犯罪并将被执行遣返的父母同其子女分开。这被设计成一种威慑手段，却非常残忍。“如果不想与孩子分开，就不要带着他们非法越界入境，”美国司法部长杰夫·塞申斯表示，“有人非要这样做，那就不是我们的错。”", "直到2018年6月特朗普改变立场之前，该政策在2017—2018年共导致数千名儿童被隔离和强制拘留，包括蹒跚学步的幼童和襁褓中的婴儿，引发了公共卫生倡导者的强烈抗议，他们警告称政府将不可避免地对儿童造成创伤。6月，一段8分钟的录音被公布，可以听到年幼的孩子们绝望地呼喊着他们的父母：“妈妈！爸爸！”边境执法人员则在开玩笑，一个边境执法者说：“嘿，我们这里有支管弦乐队，就缺一个指挥啦。”", "蒂尔从未谴责过这一政策，多位与他亲近的政治顾问还称赞这一政策。蒂尔的老朋友安·库尔特在福克斯新闻频道说，那些啼哭的婴幼儿是“儿童演员”。科巴赫说，照片中的那些关着非常年幼的被拘留者的笼子纯粹是为了“孩子们的安全”而设置的。蒂尔的公司也很乐意从海关和边境保护局拿钱。根据民权组织Mijente发布的文件，2018年，安杜里尔获得了价值500万美元的合同，以提供设备作为虚拟边境墙的一部分，其中包括廉价的摄像头和其他传感器，并配有先进的人工智能。该组织还发布了一份文件，显示警方人员利用帕兰提尔的软件在美国境内找到无人陪伴儿童的父母，将之逮捕和遣送出境。", "2019年，针对该公司的抗议活动加剧。帕兰提尔与硅谷很多公司一样，也使用在线软件资源库GitHub，这是一个专门面向程序员的社交网络，他们在这里分享自己开发的软件并解决技术问题。5月，数十名技术工人联盟的成员向GitHub上的帕兰提尔页面发送了同一条信息：“美国移民和海关执法局使用帕兰提尔的软件遣返移民子女的父母。”2个月后，示威人群出现在纽约的一家亚马逊书店，要求向蒂尔的数据挖掘公司提供云计算服务的公司与前者断绝关系。帕兰提尔已经快要登上网络杂志Slate的“邪恶名单”榜首了。在左派那里，帕兰提尔（甚至连蒂尔也算上）都已经成为极右翼威权主义和硅谷恐怖的代名词，他的名字经常成为偏激的左翼政治播客的笑料。", "整个夏天，对帕兰提尔的不满之声一直在其各部门的员工中蔓延，他们散发了一份请愿书，要求公司将从美国移民和海关执法局项目取得的利润捐给慈善组织。遭到卡普拒绝后，一些人便心灰意冷地辞职了。一位前工程师告诉我：“这种感觉真的很糟糕。”他和其他几名员工私下承诺，要将卖股票赚到的钱捐给RAICES。RAICES是一家总部位于得克萨斯州的组织，为移民提供法律服务，以帮助他们抗争。“这感觉就像是赃钱。”这正是蒂尔所想要的：一场全面的硅谷文化战争，一场他将在特朗普总统任期的剩余时间里继续获利的战争。", "2019年7月，蒂尔飞往华盛顿，现身于首届美国全国保守主义大会的第一天晚上。这是一种新保守主义的新集会，正如会议组织者解释的那样，旨在迎合美国和欧洲兴起的民粹主义和民族主义运动。正如蒂尔对朋友和同事所说的，这种“民族保守主义”试图在特朗普主义的基础上进一步拓展，以寻找“特朗普之外的特朗普主义”。这是与自巴里·戈德华特崛起以来一直盛行的自由意志主义政治分道扬镳，同时趋向于蒂尔自从发出其反动的告投资者书并培植柯蒂斯·雅文等人物以来的愿景，那就是包含封闭的边界、商品贸易政策及民粹主义产业政策的一种政治。", "“蒂尔江湖”中的很多人出席了这个民族主义的会议。雅文和杰夫·吉西亚都在观众席上。演讲者名单中有将发表主旨演讲的密苏里州初级参议员乔希·霍利，还有迈克尔·安东和J.D.万斯。万斯曾是Mithril公司的总经理，后来凭借《乡下人的悲歌》这本书将自己重塑为民粹主义作家。就连约翰·博尔顿也参与了相关议程。", "当然，上新闻头条的都是蒂尔，他演讲的焦点毫不意外就是他最喜欢的垄断。按照蒂尔的说法，谷歌正在建造“《星际迷航》中的计算机”。这给了他一个机会再次发表他对技术停滞的标准描述，即或许会有一台无所不知的计算机，但我们没有曲速引擎，甚至连协和式超声速飞机都没有了！当然，在蒂尔看来，《星际迷航》里面没有国界，也没有资本主义；他认为谷歌自以为高于并超越美利坚合众国的影响力范围。（这一批评带有讽刺意味：蒂尔才经常寻求让自己的利益高于并超越美利坚合众国的影响力范围，而且事实上为了达成这一点，还培育出一种完整的意识形态。）", "一年前，在员工施加的压力下，谷歌取消了与美国国防部的合同，该合同要求谷歌帮助军方处理无人机拍摄的图像。抗议者曾指出，谷歌技术有可能被用于定点杀戮，迫于压力，首席执行官桑达尔·皮查伊被他们的观点说服了。与此同时，谷歌一直在推进一项建立中文搜索引擎的计划——“蜻蜓计划”。在退出美国军方项目后，谷歌仍然试图继续建立一个中文搜索引擎，蒂尔想知道个中原因：为什么谷歌对中国比对美国军方更友好？在坐满民族主义者和民粹主义者的礼堂，蒂尔对谷歌的诘问引爆了一阵掌声。", "蒂尔以他典型的东拉西扯式风格发表了演讲，换句话说，就是演讲得一塌糊涂。他把自己的笑话讲砸了，讲得磕磕巴巴，更是漏掉了好多笑点，然而观众们却一样听得入迷。这位全球最著名的风险投资家不仅正在攻击他亲手打造的产业，而且提议对他的主要竞争对手展开调查，或许还得是非常强硬的那种，而且必须由联邦政府实施。尽管仍然绕不开蒂尔最津津乐道的一些主题，并且还是针对他通常嘲笑的那些对象，但他的这场演讲与他作为“公共知识分子”曾经采用的那套说辞截然不同。自然，约翰逊也发挥了作用，他深知特朗普是福克斯的忠实观众，便安排蒂尔第二天在塔克·卡尔森主持的福克斯新闻节目中将此演讲再讲一遍。蒂尔全程汗流浃背，浑身极不自在，但毕竟还是把想要传达的信息传达到了。他不仅指控谷歌背叛，还提示“有一大批谷歌员工在意识形态上超级左倾，有点儿唯我独醒的意思”，他还补充说“都是反美的”。", "第二天早上，特朗普做的正如约翰逊所愿。“一个伟大而又聪明的家伙，他比谁都更懂这件事儿！”特朗普在推特上这样提到蒂尔。", "但此事也就到此为止了。美国财政部长史蒂芬·姆努钦很快表示，他调查了谷歌，并没有发现存在令人担忧的地方。但他的这番话没有坏了帕兰提尔的大好机会，帕兰提尔依然在竞争几十个政府合同，其代理人也乐于不断重复蒂尔提到的指控。乔·朗斯代尔是蒂尔在克莱瑞姆资本的老员工，也是帕兰提尔的联合创始人，他跑到美国消费者新闻与商业频道参加节目，他说：“彼得和我建立了一个爱国的公司，而谷歌显然不是一家爱国的公司。”", "几个月后，帕兰提尔接手了谷歌正在着手的Maven项目，这是一个每年价值4 000万美元的买卖。这事居然就这样成了，尽管帕兰提尔在高端图像识别软件，尤其是将Maven用于识别目标方面的经验有限。一名政府官员给军方高层发送了一份匿名备忘录表示担忧，认为帕兰提尔在获得合同时得到了优惠待遇，《纽约时报》率先披露了此事。", "那又如何，Maven终究成了帕兰提尔的一款新产品，并且进一步加深了军方对蒂尔公司的依赖。蒂尔国防投资组合的最新成员安杜里尔也在Maven项目的合同中分得了一杯羹。对帕兰提尔而言，还有12月宣布的一项庞大交易，需数年才能完成，其价值高达4.4亿美元，其中1 000万美元来自特朗普的新军事部门太空军，8 000万美元来自海军。帕兰提尔还不顾自己的员工和移民活动者的反对，与美国移民和海关执法局续签了合同，又有5 000万美元进账。毕竟，“蒂尔江湖”的信条就是：被骂邪恶总比被骂无能要强。"], "wcount": 11340}, {"icon": "19", "title": "第19章 背水一战", "paras": ["这段关系从来就不完美。扎克伯格几乎从一开始就对蒂尔抱有戒心，蒂尔也从未认可过脸书的功能或理念，即使这是他职业生涯中一次下注最成功的投资。对时常痴迷于模仿和竞争的破坏力、别人想要的他都想要的人来说，对曾经抱怨这个日益无国界世界的种种危险的人来说，对抱怨他这一代最优秀、最聪明的人都把时间浪费在琐碎的软件公司上的人来说，脸书到底是什么样的存在？这是一个拥有20亿用户的社交网络，建立在超越国界的前提下，用户们争相查看他人晒出的自拍，或者对着海浪翘起的脚，又或者只是为了让平淡无奇的早餐能得到最多的点赞。这正是彼得·蒂尔曾经着重警告过的，然而这使他变得富有。", "蒂尔似乎也并未对扎克伯格的观点完全买账，即认为脸书最终将成为把大部分互联网内容囊括进来的一股力量。在雅虎开价10亿美元后，他曾敦促扎克伯格考虑把公司卖掉，扎克伯格却断然拒绝，“8点30分似乎是拒绝10亿美元的最佳时机”，他在凌晨召开的董事会会议上说，从而终止了所有辩论。此后不久，蒂尔就立即开始抛售其持有的股份。", "2012年脸书最终上市时，蒂尔曾是该公司股票的最大卖家之一，他立即以每股38美元的价格抛售了约1 700万股，价值6.4亿美元，这与他突然从PayPal退出转而投资对冲基金的做法如出一辙。大多数首次公开募股都是以略低于其真实市值的价格出售给投资者的，这使得那些同意在首次公开募股前购买的投资者可以获得一定的利润，以换取他们早期押注，并让上市公司在金融媒体上看起来不错。但就这么说吧，脸书的首次公开募股根本就未“爆响”。随着包括蒂尔在内的内部人士抛售股份，该公司的股价在几个月内暴跌至每股20美元以下。", "脸书的问题是没有一以贯之地坚持其原初网站，这一点比内部人士对公司的不信任更严重。Facebook.com网站是该公司几乎全部收入的来源，但智能手机的兴起意味着桌面网页浏览变得越来越不常见，特别是在年轻人当中，这威胁到了该公司的收入。在小屏幕上向人们展示大量广告要困难得多。“如果没有脱胎换骨的想法，”《麻省理工学院科技评论》在脸书首次公开募股后不久预测道，“这家公司就会崩溃。”两家养老基金和一群阿肯色州教师提出了集体诉讼，称扎克伯格、蒂尔、谢丽尔·桑德伯格和脸书的银行家们在首次公开募股期间出售股票时低估了脸书在智能手机领域遭遇的困难。脸书最终支付了3 500万美元以了结这起诉讼。“那年夏天真是糟透了，”脸书的一名前员工说，“人们都在谈论我们，就好像我们会成为垃圾股一样。”", "为了给士气低落的员工鼓劲儿，脸书组织了一系列振奋士气的全体大会。亚马逊前高管、脸书合作关系副总裁丹·罗斯，坦诚地向员工们回忆说，在互联网泡沫破灭之际，他原来就职的在线零售商的股价也是跌宕起伏，最后才又东山再起。罗斯要求他们把一切噪声屏蔽掉，并相信公司正走在正确的道路上。“虽然世界不清楚，但我们知道自己在做什么。”罗斯说。", "也有一些谈话不是那么鼓舞人心。通讯部门的某个人想到了一个好主意，认为公司里服务期最长的那位投资者、一个挺过了互联网泡沫破灭的人，也许会有一些鼓舞人心的话可说。", "可惜的是，彼得·蒂尔并没有接他的话。在被扎克伯格介绍后，他说：“有人曾许诺带我们这一代人移民月球，可结果，我们却有了脸书。”", "脸书员工们惊讶地面面相觑。蒂尔，这位美国伟大的公共知识分子、硅谷教父，刚刚竟然对着过去10年最成功的公司之一的员工们说，他们……糟透了。他们听过创始人基金的一句老话：“有人向我们承诺造会飞的汽车，可结果，我们得到的却是140个字符。”这话是挺好笑的，因为它挖苦了脸书的竞争对手推特，脸书没人会太在意。“一辆小丑车翻在了金矿里。”扎克伯格就曾这样说推特。但蒂尔改动了他自己的话来羞辱脸书，难不成还真有非激励性演讲这种东西？", "蒂尔的观点似乎是，在茫茫世事之中，脸书根本就无关宏旨，既非改变世界的技术，也非突破性的技术，它不过就是一个社交网络而已。因此，他说不值得那么紧张。这一切都会过去，员工们应该让来自媒体和投资者的批评在他们的背后消散。", "但这可不是脸书员工们听到的意思。已经有人在该公司为保障员工提出问题和发表评论而坚持设置的内部论坛上质问：一个认为女性投票权阻碍了自由事业的男人是否根本就不应该进入董事会？现在，他告诉他们，他们这样做一点儿意义也没有。", "蒂尔的话也可以解释为“mea culpa”（拉丁语：我之错）。他倾向于将技术停滞描述为自由主义者因痴迷于他们的种族、民族和性别的身份认同而排斥优秀创意的不可避免的结果。但是，在他的整个职业生涯中，他都在为文化战争煽风点火。他砸钱豪赌技术停滞，与其把全部资金投入美国的初创公司，他宁愿做空美国经济，转而投资加拿大的油砂。当然，他曾经给马克·扎克伯格提供过资金。技术停滞，譬如脸书，或许对美国很不利，但对彼得·蒂尔来说可是太好了。", "作为首次公开募股的一部分，脸书内部人士不得不同意，在该公司股票开始交易后再等待90天，才能出售他们的股票。90天后，即8月16日，蒂尔以每股20美元左右的价格出售了其剩余的大部分股份，变现共4亿美元。事后表明，这是一个超级糟糕的时机。在2021年3月底，脸书股票的交易价已达每股300美元左右。很明显，蒂尔并没有利用好这个曾让他发财的网络服务，而且似乎从来没能够公开地赞扬它。即使你不是那么了解他，也能理解他对这项被同行们视为风投有史以来最好的投资感到很矛盾。", "有意思的是，至少对那些与董事会的关系密切到可以参透这一点的员工来说，扎克伯格从未因此惩罚过蒂尔。当然，蒂尔实际上被禁止在未来的全体会议上发表演讲，而每当他的名字出现在媒体上，他对女性的看法就会再次出现在脸书内部的留言板上。但扎克伯格继续与他保持密切的联系，事实上，扎克伯格似乎更加认真地对待蒂尔的建议。", "这一决定在某种程度上是一种策略，因为有一个持蒂尔这种政治立场的人在身边可以替扎克伯格挡掉保守派的愤怒攻击，但这同时也是一种情绪化的决定。在蒂尔也曾发挥作用而建立的脸书架构中，扎克伯格拥有近乎绝对的权力。这位脸书的创始人控制着大部分股权，可以随意解职董事会，他还是一位商业名人，这意味着无论何时他在脸书说了什么，他周围的高管都会竞相表示最热烈的赞同。“这就像和国王的宫廷打交道一样，”他身边的一个人说，“虽然派系不同、利益也不同，但他们都不会真正挑战国王。因此，位居中心的人很难得到不加掩饰的建议。”", "当然，这在整个“蒂尔江湖”也是一个问题，蒂尔自己的下属有时会用朝臣的比喻来描述他们与赞助人的关系。但当扎克伯格和蒂尔交谈时，这是国王对国王。蒂尔被扎克伯格明显不关心他人想法的做法所吸引；现在，扎克伯格在蒂尔身上发现了同样的品质。蒂尔的忠告可能是粗鲁的，但它总是真实的。", "然而，人们并不总是清楚蒂尔的忠诚到底在何处，尤其是现在当他抛售了大部分脸书股票的时候。当他在“热门话题”风波后招待保守派专家时，他并没有向脸书上的任何人提及自己正在努力成为保守派政治中的主要拥护者，并向另类右翼献殷勤。这一疏漏使得“热门话题”会议看起来不太像是要利用其人脉来帮助脸书，而更像是试图利用脸书来巩固蒂尔在保守媒体人物中的地位。", "蒂尔在共和党全国代表大会上支持特朗普的数周后，在脸书董事会召开的前一天，网飞董事兼首席执行官里德·黑斯廷斯给蒂尔发来一封电子邮件，暗示蒂尔对特朗普的支持可能会令他失去继续任职的资格。“我对你支持特朗普当我们的总统感到很困惑，在我看来，这是从‘不同的判断’变成了‘错误的判断’，”黑斯廷斯写道，“观点多样固然是健康的，但（依我看）灾难性的错误判断是任何人都不想从一位共事的董事会成员那里看到的。”", "8月，黑斯廷斯的电子邮件被人泄露给了《纽约时报》，而直到这时，扎克伯格都一直没把这种紧张关系当回事儿。就在蒂尔在脸书蛊惑动荡之际，尼克·温菲尔德的文章一如其标题那样指出——“文化战争已经在硅谷打响”，并试图通过指出脸书还有另外两个著名的政治争端，而将谷歌解雇达莫尔一事放到更广阔的背景下。一个争端是脸书解雇了Oculus的创始人帕尔默·勒基，这家公司是扎克伯格两年前斥资20多亿美元收购的。2017年年初，扎克伯格解雇了勒基，因为勒基被曝光是某亲特朗普政治行动委员会的捐款者，该委员会是由红迪网为另类右翼活动人士举办的论坛“唐纳德”的成员创建的。另一个争端是黑斯廷斯发给蒂尔的电子邮件，《纽约时报》全文刊登了这封邮件。串起这一切的主线就是蒂尔的朋友查尔斯·约翰逊，他不仅支持达莫尔，也与勒基关系密切，更拥有黑斯廷斯的邮件副本。", "扎克伯格怀疑蒂尔可能与这篇文章有关，他向蒂尔索要一份与他分享过黑斯廷斯电子邮件的人的名单，然后要求他考虑退出董事会。蒂尔拒绝了，他告诉扎克伯格：“我是不会辞职的，要么你解雇我。”脸书的创始人让步了，允许蒂尔继续留任。黑斯廷斯于2019年离开了董事会。", "在与扎克伯格发生冲突后不久，蒂尔把约翰逊请到他位于旧金山的家中喝一杯，还跟他讲了与扎克伯格的那次谈话。“查尔斯，你我的关系很奇怪哦，”蒂尔说，他戴着一副深色的太阳镜，面露微笑，“马克问我那封邮件我都发给谁了，我唯一没有给他的就是你的名字。”", "约翰逊开发面部识别应用程序Clearview时也得到过蒂尔的投资，而这些计划也都是与脸书为敌的。霍安·同—代特开发出一款软件，可以从脸书（以及推特、Instagram等社交应用程序）抓取数以百万计的照片。脸书不鼓励人们使用假名登录其网站，这对于这家初创公司来说尤其有用，因为脸书上的每张照片都很容易与用户的实名相匹配，这使得约翰逊能够完美地为每张美国人的面孔制作一份全面档案。", "使用这些照片，然后把它们提供给警方建立一个大型刑事调查数据库，这也许会令一些人感到厌恶，而且根据脸书的说法，这相当于违反了该公司禁止抓取的服务条款。但约翰逊知道，考虑到脸书上的个人资料照片在互联网上是可以公开获得的，这么做有可能就是合法的。可以说，抓取这些信息与谷歌所谓的“索引”网站并没有什么不同，后者涉及为每个网站创建一个副本，并将这些信息存储在其服务器上。不仅如此，正如他向蒂尔解释的那样，这么做还有一个令人开心的副作用，那就是揭露马克·扎克伯格正是约翰逊所认定的那个骗子。扎克伯格一向鼓励用户尽可能多地分享个人信息，同时向他们保证，他们永远能够控制自己在网络上分享的内容及这些信息的使用方式。Clearview表明事实并非如此，某人在脸书上公开发布的一张照片（当时也许还在读高中或大学）现在已成为庞大执法数据库的一部分。若干年后，这张照片就有可能被政府或警察部门用来破案，或者用来驱逐非法打工者。约翰逊告诉蒂尔，现实可能会让人们不那么愿意分享照片，从长远来看，这也许就能“毁掉”脸书。", "尽管与蒂尔对脸书的义务有明显的冲突，但他还是为该公司投了一笔不大的启动资金，并承诺通过创始人基金追加后续投资。但在2019年11月《纽约时报》的一名记者深挖Clearview之后，蒂尔就与约翰逊和该公司拉开了距离。约翰逊原计划作为创始人基金合伙人锡恩·巴尼斯特的客人参加该公司的圣诞晚会，但在最后一刻，蒂尔打电话给他，让他不要来。创始人基金会放弃这笔投资，巴尼斯特也会离开公司，加入一家初创阶段的风险投资基金。《纽约时报》后来报道称，蒂尔的发言人描述说他给了“一位才华横溢的年轻创始人20万美元，两年后这笔钱变成了Clearview AI的股权”，这张支票是蒂尔“唯一的贡献”。约翰逊在该公司中扮演的角色，以及他与蒂尔的关系都未被提及。", "扎克伯格可能还没有意识到蒂尔与Clearview的关系有多深，但无论怎么说，他从未因为Clearview、帕兰提尔涉嫌卷入“剑桥分析”事件及最终向媒体泄密而惩罚蒂尔。", "旨在制作揭露媒体和科技领域所谓左翼偏见的讽刺视频的美国右翼组织“真相工程”炮制了一份报告，报告显示脸书在2019年年初压制保守派内容，并解雇了一名在镜头前声称其违反用工政策的承包商，但它没有对蒂尔采取任何行动。几年前，蒂尔曾向“真相工程”的创始人詹姆斯·奥基夫提供了1万美元的资金。", "2019年4月，里德·黑斯廷斯和曾支持遏制扎克伯格权力的克林顿政府前官员厄斯金·鲍尔斯都从脸书董事会辞职了。次年3月，美国运通前首席执行官肯尼斯·切诺尔特和另一位曾担心“脸书无意停止虚假信息”的董事会成员也步前两位的后尘辞职了。扎克伯格用以取代这些批评者的都是他的朋友和商业伙伴，其中包括多宝箱（Dropbox）37岁的创始人德鲁·休斯敦，以及在他的营利性慈善机构“陈—扎克伯格行动”工作的PayPal高管佩姬·奥尔福德。到2020年年初，除了扎克伯格和谢丽尔·桑德伯格，董事会成员中只有蒂尔的盟友马克·安德森和蒂尔本人的任期可以追溯到2019年之前。", "扎克伯格之所以容忍了蒂尔的不忠行为，可能是因为他在政治上不堪一击。如果说特朗普在2016年当选是因为美国选民转而反对全球化，那么几乎没有哪家公司会比脸书更容易受到这种风向变化的影响，个中原因除了涉及脸书的用户基础，还有扎克伯格之前对移民的倡导，以及扎克伯格在大选期间不甚明确的反特朗普言论，即“要建桥，而非筑墙”。", "扎克伯格在2016年竭尽全力避免被视为反保守派，但越来越明显的是，保守派操纵他帮助特朗普赢得了竞选。在总统大选期间，脸书允许大量虚假报道在其平台上大肆传播，其中大多数是歪曲民主党的内容。脸书还对俄罗斯宣传人员渲染亲特朗普的恶作剧视而不见。大选后，扎克伯格并没把针对其公司败绩的抗议当回事儿，还称脸书上的假新闻影响了大选的说法是“非常疯狂的想法”。2017年年初，他搞了一场全国巴士巡游，以期重塑自己的形象，还与小戴尔·恩哈特一起在北卡罗来纳州的纳斯卡赛道上跑了几圈。“这太好玩啦！”他说，“我总算明白为什么这么多人都喜欢这个了。”", "在巡游期间，一所历史悠久的黑人学院的学生问他，他个人在鼓励多样性方面做了些什么。他的回答却是把蒂尔夸了一通，他说“我们有一名董事会成员是特朗普政府的顾问”，他指的就是那位写了一本书来说明尊崇多样性有多么危险的人。扎克伯格还说：“有些人说，我们不应该让某某加入我们的董事会，因为他是共和党人，我想这也太疯狂了。我认为，如果一个社会想要共同进步，就需要具备多样性。”", "自始至终，特朗普都在持续施压，使劲儿压在扎克伯格身上，以确保脸书对保守派保持有利的平衡。脸书“一直是反特朗普的”，这位总统在9月的推文中如是说，还将脸书与以“假新闻”著称的《纽约时报》和《华盛顿邮报》相提并论。有人建议，白宫可以更进一步，像对待公用事业公司一样监管脸书和谷歌，从根本上控制广告价格，并确保这两家公司不会在意识形态上歪曲内容（也就是说，不会针对保守派）。特朗普在整个总统任期内都会着眼于这一威胁。", "随着2020年总统大选正式开始，特朗普邀请一批具有影响力的社交媒体出席社交媒体峰会，其中就包括那些推广伪宗教式的右翼阴谋论“匿名者Q”的媒体，这一阴谋论将总统看作弥赛亚似的救世主。在此次峰会上，特朗普总统声称科技公司，包括脸书，都在审查他的支持者。他承诺将利用总统的权力来保护他们。", "即使面对来自白宫的反手一击，扎克伯格也有理由相信民主党人对脸书构成的威胁要比特朗普更大。截至2019年4月底，已经有20名民主党候选人宣布参选，其中排名靠前的几位似乎特别渴望控制脸书。5月，曾被视为对科技行业友好的加利福尼亚州参议员卡玛拉·哈里斯在接受美国有线电视新闻网采访时表示，脸书“本质上是一家未受监管的公用事业公司，而在我看来这种情形必须停止”。伯尼·桑德斯曾承诺“要在美国实施强有力的反垄断立法”，还单独点到了脸书。“我们每天都要面对它，”他说，“他们决定我们可以和谁交流，他们对这个国家的经济，还有政治生活，有着不可思议的影响力，而且极其危险。”", "尽管在奥巴马总统任期内，这些看法听起来可能有些激进，但这两位候选人在竞选中对脸书的态度都不是最强硬的。最狠的非马萨诸塞州参议员伊丽莎白·沃伦莫属，她在当年早些时候发布了一份详细的计划，呼吁拆掉脸书。她承诺要将脸书明确为公用事业公司，然后强迫其剥离Instagram和WhatsApp，这两家是脸书于2012年和2014年收购的图片分享和社交信息服务公司，两者共同为脸书的增长做出了很大贡献。", "扎克伯格认真对待了这些警告。几个月后，在与员工的一次会议上，他警告说，沃伦要是当了总统，“那我们可就大难临头了”。“如果她当选总统，我敢打赌我们将面临法律挑战，”扎克伯格说，“但是，不管怎么说，如果有人试图威胁到我们的生存，你们就要背水一战。”扎克伯格已经为这场战斗做好准备，蒂尔也随时可以提供帮助。", "蒂尔陶醉于在民族主义会议上的演讲所引起的关注，遂在《纽约时报》上发表了一篇评论文章，重申了这个观点——“对谷歌有利，对美国不利”，这也是文章的标题。他对2020年有很宏伟的计划，曾有传言说他要创办一家保守的媒体公司，或者再写一本书。但越来越难以忽视的一个灾祸正悄然临近，那就是特朗普总统任期的终结。就这样，蒂尔做了一件每次他看上去就要赌输的时候都会做的事：知难而退。", "在2018年中期选举之前，蒂尔信心满满地宣称特朗普的总统任职“相对成功”，把有关与俄罗斯勾结的说法称作“阴谋论”，而在回答“特朗普总统是否有撒谎倾向”这一问题时，蒂尔努力绷起面孔，把特朗普的“谎言”描述成“对事实的夸大其词”。不过，尽管中期选举对蒂尔来说进展顺利，蒂尔最喜欢的候选人之一霍利当选为参议员，但对特朗普政府来说是一场灾难，民主党人重新夺回了众议院。新一届国会一开始拒绝弹劾特朗普，即使在特别检察官罗伯特·穆勒暗示特朗普在2016年接受了俄罗斯特工的帮助，然后试图控制和最小化调查之后。但是，2019年9月有猛料爆出，指特朗普总统与乌克兰总统进行了“完美的”通话，要求对方调查其政敌之后，民主党最终采取了行动。", "蒂尔在2019年及2020年年初的大部分时间里都保持低调，只在公共场合出现过两三次，而且总是面对友好的观众。他经常与保守派人士见面，但都是在家里，这样可以避免被人看到，也不必刻意表现。事实上，他甚至不用穿得那么正式。有一次，蒂尔接待了一批客人，其中包括佛罗里达州共和党人马特·盖兹，而他只穿了一件T恤衫和内裤。“太奇怪了，不过还好！”盖兹后来写道。另一位经受过这种待遇的来访者是时任美国商务部长的威尔伯·罗斯。83岁的罗斯在会面后对一位同事说：“这样穿是一种非常不正统的着装。”", "虽然他的客人，尤其是来自华盛顿的新来者，可能会对他的服装选择感到奇怪，但同时他们惊诧于蒂尔独特的谈话方式。他似乎什么都不想要，只是想跟人谈话。华盛顿来的人将这解读为一种倦怠，尽管它实际上可能就是一种满足。据朋友们说，蒂尔正在享受生活的新阶段，那就是天伦之乐。最近，他和丹泽森通过代孕有了一个女儿。", "尽管与外界鲜有接触，蒂尔仍然精力充沛，2019年10月，他飞往华盛顿与扎克伯格和特朗普会面。脸书的首席执行官来到华盛顿是为了说明脸书推出虚拟加密货币“天秤币”（Libra）的计划。有批评人士警告说，天秤币有可能取代美元成为世界储备货币。自第二次世界大战结束以来，外国政府购买并持有大量美元，这意味着美国可以有效地借入几乎无限的资金，并可以将“流氓国家”从全球金融体系中剔除出去。如果人们开始通过天秤币这样的数字货币来持有其资金，美国的借贷成本就会更高，全球金融体系也将脱离美国的控制。当然，这正是蒂尔在PayPal提出的做法，当时他说要给每个人提供自己的虚拟瑞士银行账户。", "扎克伯格还有一项任务，就是要应对民主党针对脸书明显故意放大总统谎言的批评。10月初，特朗普竞选团队曾刊登广告称，前副总统拜登曾向乌克兰政府施压，要求对方放弃对其儿子亨特·拜登的商业活动的调查。这是一个谎言。美国有线电视新闻网拒绝播放这些广告，脸书却允许播放，就是根据所谓的不对政客们说的话进行事实核查的政策。参议员沃伦给扎克伯格打电话，称脸书是“一个以虚假信息牟利的机器”。她表示，该公司已经通过视而不见的做法帮了当选总统唐纳德·特朗普一回，而现在又通过不对广告进行事实核查，再次将该公司利润置于公民责任感之上。", "扎克伯格在乔治敦大学的演讲中对此做出回应：“我知道很多人不同意，但总的来说，我认为在一个民主国家，由一家私营公司来审查政治家或者新闻是不合适的。”他还援引了马丁·路德·金写的《来自伯明翰监狱的信》、越南战争时期的校园抗议及他自己反对伊拉克战争的言论，暗示这一切正是他创办脸书的原因。无论是在风格上，还是实质上，蒂尔的影响都清晰可见，这体现在扎克伯格反复使用“声音”一词来表示“民主参与”上，而这是蒂尔和他的朋友们在讨论“海上家园”时经常使用的提法。扎克伯格阐明的政策正是蒂尔和特朗普想要的。", "在扎克伯格造访华盛顿期间，蒂尔和丹泽森见到了扎克伯格和普莉希拉·陈、贾里德·库什纳和伊万卡·特朗普，当时他们一起与总统和第一夫人在白宫共进晚餐。讨论的具体细节是保密的，但蒂尔后来告诉一位密友，扎克伯格在用餐期间与库什纳达成了共识。他承诺，脸书将避免对政治性演讲进行事实核查，从而让特朗普的竞选团队可以想宣传什么就宣传什么。如果这一承诺能够得到遵守，特朗普政府就会放弃严厉的监管。", "那次晚餐之后，扎克伯格对保守派网站就采取了放手不管的态度。10月下旬，脸书推出了一个新闻应用程序，专门展示那些被该公司称为“报道深入、信源丰富”的媒体机构。在一系列被推荐的发布者中，布赖特巴特新闻网也赫然在列，尽管该网站曾将自己宣传为另类右翼的盟友，并曾开设过一个专门讨论黑人犯罪的版块。脸书似乎也曾不遗余力地帮助每日连线——这个更年轻、更新潮的布赖特巴特新闻网的翻版，它也许将成为脸书平台上最大的发布者之一。长期以来，脸书一直把自己视作独立的政府；现在，在特朗普的庇佑下，该网站将推动蒂尔圈内某人在跟他谈及此次会面时所说的“国家认可的保守主义”。", "扎克伯格否认有任何交易，称上述说法“相当可笑”，尽管来自新闻聚合网站BuzzFeed、彭博网和其他媒体网的报道表明，脸书政策团队的成员确实出手保护过保守派网站，使其不因违反该公司反对错误信息的规则而被罚。（该公司多次拒绝要其就此事发表评论的要求。）在大选的剩余时间里，脸书会比其同行更温和地对待特朗普。推特隐去了特朗普针对“黑人的命也是命”抗议者的一条帖子，这条帖子似乎很赞赏地引用了亚拉巴马州种族隔离主义者乔治·华莱士等人曾使用的一句威胁性的话：“抢劫开始，枪击就开始。”脸书允许了这个帖子的发布，扎克伯格对此解释说，虽然他与总统的看法不同，“但我认为应该让人们能够自己看到这个帖子，因为最终对于身居高位者的追责只能在他们的言行被公开审查时进行”。他继续频繁地与贾里德·库什纳交谈，而蒂尔继续公开和私下里强调脸书还没有其竞争对手那么恶劣。", "至2020年3月初，该计划似乎开始奏效。伊丽莎白·沃伦和卡玛拉·哈里斯竞选遭挫，伯尼·桑德斯语无伦次，而被蒂尔视为弱者的约瑟夫·拜登似乎已经做好赢得提名的准备。特朗普，尤其在保守派中，被认为有可能连任，而蒂尔对右派的影响力比以往任何时候都要大。需要使用一些完全出乎意料的东西，甚至末日启示，来摆脱他四年前在脸书开启的这个计划。一切进展顺利。"], "wcount": 9394}, {"icon": "20", "title": "第20章 危机管理", "paras": ["正当美国公众开始意识到新冠病毒正在迅速传播，生活将在一段不确定的时间内变得完全不同时，彼得·蒂尔离开了洛杉矶。按普通人的认知，他应该是去了他在新西兰的等离子大宅和里面的“避难室”，或者也可能是去了他在南岛买下的那个农场里的一处地堡。新西兰不愧是躲避世界末日的理想栖息地。该国很早就封锁了，并对非本国公民关闭了边境。到2020年年底，新西兰只有25人死于新冠病毒。", "但蒂尔并未跑到新西兰，事实上，自2017年年底以来，他基本上就把这个他新认下的“祖国”抛在了一边，当时他出席了西蒙·丹尼的艺术展“创始人的悖论”，该艺术展探索科技公司创始人的神话，他们都是神一般的人物，也是硅谷，尤其是蒂尔所极力提携的。丹尼独辟蹊径的艺术媒介是棋盘游戏，他改编了少数有名的热门游戏，包括《行动》和《生命游戏》，以及在“蒂尔江湖”很流行的一些游戏，其中就有《卡坦岛定居者》和《深入绝地：黑暗之旅》，以及一个类似《龙与地下城》的棋盘游戏。生活被重新想象为一个年轻的斯坦福大学毕业生的一系列选择，要么是具有社会意识的行动，比如缴税，要么是自由意志主义的行动，比如逃往避税天堂。在《深入绝地：黑暗之旅》的续集《上行战场：国家之上》中，蒂尔的形象出现在一尊塑料雕像上，这位“反潮流英雄”同贴着“民主”标签的龙、贴着“公平选举”标签的狮子及贴着“货币政策”标签的怪物战斗。“这实际上是一件细节非凡的作品！”蒂尔曾对一位参观者说道。", "大片农田仍然原封未动，没有做任何开发。这里根本没有什么地堡，而且在特朗普当选后不久，报道蒂尔入籍新西兰的《新西兰先驱报》记者马特·尼珀特就开始怀疑蒂尔已经放弃这个想法。“那是一个对冲措施。”他告诉我，他得出的结论是蒂尔曾担心民主党人会改变美国的税收政策。但是，特朗普当选后，新西兰右翼的国家党政府也于2017年被杰辛达·阿德恩所领导的左翼工党所取代，于是蒂尔便失去了兴趣。", "其实，蒂尔是躲到他位于夏威夷毛伊岛的庄园去了。2011年，他以2 700万美元的价格买下了这里的一套海景房，居住面积约420平方米，成交价创下了当时的纪录。这个豪宅位于该岛一片未开发的区域，高高的石墙将蒂尔与该地区唯一的道路隔开。房子的另一边有一个游泳池和近7 000平方米的土地，几乎与海滩连成一片。", "简而言之，这是观察随后几个月美国混乱局面的完美居所。从3月中旬开始，纽约和美国其他主要城市几乎全部封城。新闻节目冷漠地展示着战场一般的医院，尸体堆积在冷藏车里，护士们用垃圾袋来代替手术服，因为个人防护用品紧缺。4月中旬，当最初的疫情达到高峰时，仅在美国，每天就有2 200多人死亡。", "最终，政府的封禁措施奏效了。确诊病例数和死亡人数双双下降，到5月初，已经有理由开始考虑重新开放。是的，在此之前已有7万美国人死去，但疫情已经趋缓，只要按照保持社交距离和佩戴口罩的指南去做，加上官方持续关闭经济活动的某些领域，如酒吧和餐馆，并限制举办室内活动，回归常态似乎指日可待。现在回过头来看，这想法显然有点儿一厢情愿，但上班的人们似乎有可能在夏天开始重返办公室。9月学校重开似乎也毫无悬念。", "在这段谨慎乐观的时期，我通过中间人了解到，蒂尔正在考虑与我正式谈论新冠病毒。他将新冠病毒视为一种证明，这有一定的道理：一场不太可能发生的与全球化有关的灾难，造成了世界各个经济体的突然崩溃。早在12年前，作为一名对冲基金经理，他就在自己发表的一系列狂放的文章中预言了某种版本的当今局面。他写了《乐观的思想实验》，对世界末日表达出担忧，这在他的同伴们看来十分可笑，而在其员工们看来是让人不爽的诡异。蒂尔是一位成功的对冲基金经理，坐拥数十亿美元的资本利得，却以一个宗教复兴主义布道者的口吻，对推动他致富的那些力量（科创行业的崛起、贸易的爆炸式增长、信息的自由跨境流动）的危险夸夸其谈。但现在是谁在大笑呢？不是蒂尔所描述的那些“世界性的”人，他们认为“这种关于世界末日的歇斯底里的言论……已成为那些要么愚蠢、要么邪恶、要么疯狂的人的专属领地（尽管大多数人都只是愚蠢）”。蒂尔因其强硬的移民立场而受到批评，而当他取得新西兰国籍时，又被嘲笑为一个末日准备者。现在，特朗普因只对中国而未对欧洲关闭美国边境而饱受诟病，普通美国人正在囤积卫生纸，并就在哪里能买到最好的干豆子交流攻略。", "10年前，蒂尔奖学金项目被认为是任性鲁莽的。但蒂尔每年也只能说服20名学生不去哈佛大学读书。现在，哈佛被迫关闭了整个校区，实际上是以仍需付5万美元的线上视频课程，来取代学费5万美元的世界顶级教育和2.5万美元的食宿。蒂尔认为，大学是一种以超高学费来强化阶级差别的机制，这一观点似乎比2010年时更有道理，而且似乎可以相信他曾警告的所谓的教育“泡沫”可能会破裂。这次不是区区20名学生了，哈佛大学新生中有20%的人选择2020—2021学年休学，其中一些人再也不会回来了，那些已经在苦苦挣扎的规模较小、名气较小的大学更面临着严重的财政困难。正如蒂尔预测的那样，整个美国的教育行业似乎都有可能崩溃。", "就连蒂尔试图把特朗普政府推向极右方向的那些徒劳的努力，突然间看起来也更有理由了。甚至连特朗普最嚣张的顾问都认为“太疯狂”的美国食品药品监督管理局局长候选人巴拉吉·斯里尼瓦桑，在大多数政府专家建议保持冷静的情况下，却于2020年1月拉响了新冠大流行的警报。在美国疾病控制与预防中心坚持开发更加复杂并最终有缺陷的检测方法，以及美国食品药品监督管理局拒绝批准世界其他国家都在使用的更简单的检测方法之后，蒂尔关于政府卫生机构早已僵化，需要彻底改革的本能反应似乎至少更靠谱一些。上述做法使得美国落后韩国大约6周，韩国很快就控制住了本国的疫情。", "接下来就轮到硅谷。工厂工人被解雇，餐馆关门，购物中心被废弃，但彼得·蒂尔居住的世界绝对繁荣。正如风险投资家马克·安德森所说，“软件正在吞噬这个世界”，所有关于科技将占据我们生活的方方面面的预言都突然有力地变成了现实。一夜之间，美国所有的中小学都需要建立网课教学账户，每个孩子都需要平板电脑。亚马逊所有的商品，从棉布手帕到1 000块的拼图，销量都急剧上升，以至于该公司不得不分类安排送货时间。许多公司争相签约使用聊天群组Slack，我们还开玩笑说网飞已经被“干掉”了。线上社交网络可以作为真实社交生活的替代品，但突然之间，它们就成了我们唯一拥有的东西。斯里尼瓦桑在推特上幸灾乐祸地表示：“技术抵制已经结束。”", "科技热潮既是一种金融现象，也是一种文化现象。继2020年3月实行封禁引起其断崖式下跌之后，标普500指数逐渐回升，并在7月实际上实现了全年上涨。几乎所有这些上涨都要归功于少数几家主导该指数的大型科技公司：亚马逊上涨了71%，苹果上涨了51%，脸书上涨了31%。接下来的一个月，扎克伯格的净资产超过了1 000亿美元。这一切都发生在失业率超过10%的情况下。", "蒂尔也越发富有。电子商务的突然受宠当然有利于亚马逊，但同样有利于在线支付公司Stripe。蒂尔持有该公司大量股份，该公司融资6亿美元，估值达360亿美元。据蒂尔身边的一位人士估计，他所持有的Stripe股份价值约15亿美元，但这只是2020年11月之前的数据，当时Stripe据传将进行新一轮融资，这次的估值约为1 000亿美元。爱彼迎比传统酒店行业更好地扛过了旅游业的突然崩溃，并准备以据称约350亿美元的估值上市。至该公司于12月真正上市时，其市值已达到870亿美元。截止到2021年3月，这一数字更是达到了1 100亿美元。创始人基金也拥有其中5%的份额。", "与此同时，蒂尔几十年来对军工复合体的押注看起来从未像现在这么好。在特朗普总统承诺加强边境安全的背景下，约翰逊的朋友帕尔默·勒基建立了初创公司安杜里尔，在7月就筹集了2亿美元，使其估值翻了一番，达到20亿美元。SpaceX成为第一家将人类送入地球轨道的私营公司，成功将两名美国国家航空航天局宇航员鲍勃·本肯和道格·赫尔利送入太空，并与国际空间站对接。任何与新冠大流行无关的消息都令特朗普感到高兴，他与迈克·彭斯一起观看了在佛罗里达州卡纳维拉尔角的这次发射。“这技术，这实力，简直不可思议！”特朗普在发射几小时后如是说，并把马斯克称为“我们最了不起的超级大脑之一”。不久之后，美国国防部宣布SpaceX又赢得了一份价值超过3亿美元的发射合同，该公司的估值将攀升至740亿美元，而创始人基金也将从其必然的公开售股中受益。", "除了这些收益，蒂尔的大部分净资产仍锁定在帕兰提尔，这家公司拥有几乎得天独厚的从新冠大流行中获利的能力。蒂尔持有该公司略低于20%的股权，其中他本人直接持有一部分，其余通过其投资的公司持有。新冠病毒本应是由医生、病毒学家和流行病学家来解决的问题，但它却成为一个大数据问题。当科学家们竞相研制疫苗时，政府和大型医院系统必须弄清楚热点出现在哪里，然后相应地分配资源。在帕兰提尔试图赢得欧洲业务之后，它的软件已经被重写，并被用于对某些医疗供应链的管理。但从2020年3月初开始，该公司将所有研发人员都调去攻克与新冠病毒相关的各种问题，还将新的功能添加到现有的产品中，例如，允许企业客户轻松地获取有关病例和住院人数的政府数据，然后将其纳入公司的销售预测。对竞相寻找有效方法来支撑其供应链和建模的政府卫生部门来说，这一软件自然就再适合不过了，已被用于分发呼吸机和个人防护用品。这一举措在短短几个月内就促成了100多笔交易，新客户中包括数十家公共卫生机构。", "“我们公司是在危机中得到锻炼和再锻炼的。”卡普的副手希亚姆·桑卡尔在一次采访中告诉我，并语速飞快地报出了一系列的灾难：“9·11”事件（即帕兰提尔存在的理由）、金融危机、网络攻击的泛滥、帕兰提尔协助军方打击“伊斯兰国”等。“从某种程度上说，此次新冠肺炎大流行就是这种情况的最新版本。”", "除了危机管理方面的专业知识，蒂尔的公司还有一个可以说更重要的优势，那就是从美国政府，尤其是特朗普政府那里攫取巨额资金。5月初，在蒂尔和桑卡尔会见了美国国立卫生研究院院长弗朗西斯·柯林斯之后，已经给过帕兰提尔一个合同的美国卫生与人类服务部又再次奖赏给该公司另外两个价值共2 500万美元的合同，要其设计一个新的软件系统，由白宫新冠病毒特别工作组使用来跟踪相关病例、医院数据、个人防护用品的供应及测试场地等。这些交易被归类为“紧急收购”，意味着是在没有竞标的情况下达成的。", "特朗普政府竟然让政治盟友在如此人命关天的问题上发挥作用，再考虑到特朗普总是倾向于淡化疫情的严重性，这种政治敏感性到7月就变得更加强烈。当时，美国南方各州的确诊病例数激增，美国政府却命令医院停止向美国疾病控制与预防中心报告，而将报告发到卫生与人类服务部的新系统。此前一直由疾控中心负责数据收集，并公开提供给外界。几名议员和疾控中心一名前主任指责特朗普做出这一改变就是为了向公众隐瞒疫情的严重性。疾控中心前主任托马斯·弗里登在推特上写道：“政府不是通过加强公共卫生数据系统来改善医院报告，而是选择将数据交给一个未经证明的商业实体，并要求向政务官员，而不是科学专家报告。亚利桑那州、得克萨斯州、南卡罗来纳州、佛罗里达州和其他地方的人们已经为此付出了代价。”", "白宫有意避开对其管理不善的指责，并在将疾控中心的数据暂时下线后，又允许该机构再次开始披露数据。与此同时，帕兰提尔否认其获得无竞标合同是得益于优惠待遇。公司代表在接受采访时强调说，蒂尔的参与其实微乎其微。“太有意思啦！”桑卡尔说，“如果你看看前特朗普时期的帕兰提尔，那总是被描述为亚历克斯·卡普的帕兰提尔，当然，也确实是。而说到后特朗普时期的帕兰提尔，就突然来了个大翻转，成了彼得·蒂尔的帕兰提尔。我认为这更多地与外部认知有关，而不是与某种内部现实有关。”", "从某种意义上来说，这的确也是事实，因为帕兰提尔的员工很少见到蒂尔，但这仍然是一种深深的误导。在2020年6月末，帕兰提尔宣布已任命了一位女性进入董事会，如果公司想要上市的话，这就是一个必要的步骤，因为加利福尼亚州法律规定上市公司要有至少一位女性董事会成员。曾有传言说，该公司可能会巴结前国务卿康多莉扎·赖斯，但帕兰提尔提名亚历山德拉·沃尔夫·希夫，她是蒂尔的老朋友，写过一本大肆吹捧蒂尔奖学金项目的书。在7名董事会成员中，她将是与蒂尔关系密切的6名董事之一。（11月，《斯坦福评论》前主编亚当·罗斯将离开董事会；1月，埃森哲董事总经理劳伦·弗里德曼填补了罗斯的空缺，此人与蒂尔没有明显关联。）", "在那些了解蒂尔的人看来，任命沃尔夫·希夫做董事似乎特别厚颜无耻。据记者费利克斯·萨尔蒙透露，家住纽约的沃尔夫·希夫只要去西海岸，就经常住在蒂尔的家里。在2005年左右，那时蒂尔还没有公开出柜，她就在达沃斯论坛上假扮成蒂尔的女友。董事任命宣布后不久，有位助手给蒂尔发短信，问他是否故意用任命沃尔夫·希夫来恶心某些人。毕竟，沃尔夫·希夫作为首位女性进入帕兰提尔董事会这件事，对那些政治正确的警察可真够窝心的。蒂尔回复了一个眨眼吐舌的表情符号。", "像所有人一样，蒂尔在新冠肺炎大流行期间也是忧心忡忡，尤其担心他那个最重要的投资的未来。有的日子里，他似乎确信特朗普会大获全胜，这位总统所说的“法律与秩序”是对尼克松政府的一种回归，将说服民主党在种族政治上转向左倾。而在另一些日子里，他又坚信新冠病毒及随之而来的经济衰退会让特朗普无法连任。", "很难做到平心静气。蒂尔预见到一场全球性的危机会把世界经济拖垮，而将自己定位于乱中获利，就像他所说的金融危机发生时那样，让自己靠危机的后果发财。但是，就像2008年那样，他一方面秘密怂恿鼓动破坏势力，向克莱瑞姆的投资者发出措辞冷静的信件，警告反移民民粹主义的危险，另一方面又在暗中资助民粹主义运动，助力种下新冠大流行后大混乱局面的种子。他帮助特朗普压制了那些担心他的自恋和专制倾向会在危机中造成灾难性后果的共和党人；他帮助创建和保护了脸书，而正是脸书使得错误信息的传播更加便利，从而鼓励美国人不戴口罩，并接受未经证实的、可能有害的治疗，比如使用抗疟疾的羟氯喹甚至工业漂白剂。如果特朗普总统最终失败，蒂尔也会失败。", "他开始告诉朋友们，他正在考虑在瑞士购买房产，如果特朗普败选，他有可能会搬到那里去，大概是为了保护他的个人退休账户不受拜登政府政策改变的影响，他担心拜登政府可能会试图完成奥巴马已经开始做的事情。帕兰提尔2020年9月递交上市申请就是这种想法的体现，这再清楚不过了，他的几位同事称，蒂尔希望赶在资本利得税调高或个人退休账户规定修改之前，尽可能多地变现其资产。他花了20年时间积累了数十亿美元的免税资产，他现在也绝不打算交税。", "在与朋友的交谈中，他把特朗普的白宫比喻为电视剧集《吉利根岛》中不幸搁浅的小渔船“米诺号”。当然，在这个比方中，特朗普就是那位船长，而正像蒂尔在短信中对一个朋友说的那样——“吉利根却有很多”。蒂尔用一个离谱的比喻说，特朗普竞选班子的改变等同于“重新安置泰坦尼克号上的躺椅”。", "最终，蒂尔的员工将他的这些抱怨捅给了媒体，希望为他们的老板和共和党候选人之间撇清一点儿关系。在新闻网站每日野兽和《华尔街日报》等媒体报道了蒂尔对特朗普的不满后，有人推断蒂尔把特朗普对新冠肺炎大流行的应对看作其总统任期衰败的迹象。但其实并非如此，蒂尔赞同特朗普的看法，认为对大流行的担忧被放大了，他告诉朋友，他认为封禁措施“很疯狂”，范围也太广。", "蒂尔的核心圈子也不消停，他们似乎对特朗普感到失望，因为他将自己置身于中间派，而没有推动极右翼民粹主义。特朗普任命尼尔·戈萨奇为最高法院大法官，此人支持自由派和温和派的观点，裁定同性恋和变性劳动者也应得到公民权利保护，蒂尔的顾问、《从0到1》的共同作者布莱克·马斯特斯对此抱怨说，共和党背叛了保守派。他讽刺地写道，看起来，共和党的重点似乎就是“保护私募股权、低税收和免费色情”。", "搬到亚利桑那州的马斯特斯在抱怨共和党参议员玛莎·麦克萨利对特朗普不够忠诚后，一直在考虑向她的连任竞选发起初选挑战。他决定反对，蒂尔在堪萨斯却支持一个类似的候选人克里斯·科巴赫，此人曾帮特朗普打造最极端的移民提案（且还有反对同性恋权利的历史），现正在竞选特朗普一派的参议员，竞选对手是温和的共和党人罗杰·马歇尔。", "蒂尔向科巴赫捐赠了210万美元，成为他的主要资助人，其中包括7月共和党初选前两笔总计125万美元的捐款。尽管蒂尔在2019年直接向科巴赫的竞选活动捐赠了5 600美元，但上述这些捐款都通过新创建的“永远自由”政治行动委员会注入，它承诺“确保我国的边境安全，制定美国优先的移民政策，照顾我们的退伍军人，结束无休止的战争，建立一个对美国广大工作者行之有效的经济”。", "除了通常坚持的本土主义立场，科巴赫为了能获得提名，还给有关新冠病毒的阴谋论火上浇油。在竞选一周前，即从蒂尔的行动委员会接受支票两周后，科巴赫对采访他的人表示，他认为医院和医生把意外死亡，比如交通事故等，记录为新冠死亡，从而通过夸大新冠的严重程度来打击特朗普。“我相信这些数字是杜撰出来的。”他说。在初选当天，他以14个百分点之差输给了马歇尔。", "专家们曾呼吁逐步恢复经济，并继续依赖保持社交距离和戴口罩。特朗普将这一切当作“政治姿态”而加以排斥，并在不同的场合坚称这种可怕的病毒正在被他的政府打败，要么说它实际上并不比流感更严重，或者两者兼而有之。他蔑称戴口罩是所谓的政治正确，并鼓吹未经证实的治疗方法和神奇的想法。至少在特朗普看来，美国已经不断“接近最后的拐点”。他鼓励各州州长不要做核酸检测（并记录病例），在疫苗推出的6个月前，特朗普坚持举行有数千人参加的室内集会，并且大多数人都不戴口罩。", "而且，美国的大部分地区同一时间重新开放，对这种毫不谨慎的做法，蒂尔的朋友圈却经常大声叫好。蒂尔的斯坦福老友基思·拉布瓦总是没完没了地发推文宣传羟氯喹的预防作用，尽管一项又一项的研究表明羟氯喹对预防和治疗新冠毫无帮助。对此，拉布瓦的回应和蒂尔提名的美国食品药品监督管理局官员的说法如出一辙——都是指责药物试验的官僚主义。“随机对照试验是可怕的想法。”他在推特上说。当罗氏公司的高管温伯格与他争论时，拉布瓦反驳道：“显然有人嫉妒我的成功。”", "马斯克利用他的平台来淡化新冠大流行的严重程度，吹捧羟氯喹并呼吁全面重启经济，这是他特别感兴趣的一点，因为特斯拉面临大量订单积压。“立刻解封美国吧！”他在推特上说。大约一周后，他无视封禁命令，重新启动了位于加利福尼亚州弗里蒙特的特斯拉工厂。这样做的结果十分严重：根据作为获取信息自由的一部分而公布的公共健康数据，5—12月，在弗里蒙特的特斯拉工厂，约有440名员工确诊感染新冠病毒。", "仿佛有预谋似的，确诊病例又再次激增。从5月下旬开始，第二波疫情冲击阳光地带，得克萨斯州和佛罗里达州在几周时间内分别记录了数千例死亡；随着大选临近，第三波疫情汹涌而至，开始于中西部，并于12月蔓延至全美。在这个疫情峰值，每天有超4 000名美国人死亡。到目前为止，蒂尔的朋友圈却对如此情形保持沉默，并重新开始在推特上大谈加密货币、“黑人的命也是命”运动的可怕，以及社交媒体对那些将民主党总统候选人约瑟夫·拜登之子亨特与腐败联系起来的相关报道进行的审查。", "特朗普政府对新冠大流行的应对受到隶属胡佛研究所的放射科专家斯科特·阿特拉斯的影响，已彻底放弃了阻止新冠大流行的努力。特朗普将群体免疫吹嘘为一种策略，即允许病毒大范围传播，以使民众普遍具备免疫力，从而保护整个社会，并错将其称为“从众心理”。2020年10月，特朗普感染了新冠病毒，去了医院，后来没怎么样就好了；当有报道称他的儿子巴伦也感染了病毒时，他还把这种潜在的致命病毒当成“普通感冒”。特朗普总统的办公厅主任马克·梅多斯当天在美国有线电视新闻网上对戴口罩和医生推荐的其他基本缓解措施的有效性进行了质疑。“我们不打算控制了。”梅多斯说，他拿新冠当流感了。", "在国家举步维艰的时候，蒂尔却在忙着套现。8月25日，在全美死亡人数超过175 000人之际，帕兰提尔向美国证券交易委员会提交了S-1申请报告，即宣布其打算上市的正式文件。几个月来，卡普一直说他在考虑是否要跟着蒂尔离开硅谷，现在他透露了自己的目的地——丹佛。S-1材料中还包括一封批评他以前的大本营的信件。“我们的公司
