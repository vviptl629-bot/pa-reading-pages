<style>
html{
  --bg:#ffffff; --panel:#f5f6f7; --panel2:#eceef0; --line:#c9ced4;
  --text:#111418; --muted:#555e68; --accent:#0E9488; --deep:#0E9488;
  --amber:#a16207; --green:#15803d;
  --topbar-bg:rgba(255,255,255,.94); --para:#1a1f24;
  --mark-bg:rgba(14,148,136,.08); --badge-bg:rgba(14,148,136,.08); --badge-border:#0E9488;
  --overlay:rgba(0,0,0,.35);
  --mark-text:rgba(251,191,36,.35);
}
:root{--sidebar:280px; --topbar:56px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.85;-webkit-font-smoothing:antialiased;
}
.topbar{
  position:fixed;top:0;left:0;right:0;height:var(--topbar);z-index:50;
  background:var(--topbar-bg);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 20px;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#08110f;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px}
.brand .sub{color:var(--muted);font-weight:400;font-size:13px}
.lib-btn{flex:none;display:inline-flex;align-items:center;gap:5px;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;transition:background .18s}
.lib-btn:hover{background:rgba(14,148,136,.08)}
@media(max-width:720px){.lib-btn{padding:5px 9px;font-size:12px}}
.searchwrap{margin-left:auto;position:relative}
.searchwrap input{
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:8px 12px 8px 34px;width:230px;font-size:14px;outline:none;
  transition:border-color .2s;
}
.searchwrap input:focus{border-color:var(--accent)}
.searchwrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);stroke:var(--muted)}
.menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:6px 10px;font-size:18px;cursor:pointer}
.layout{display:flex;padding-top:var(--topbar);min-height:100vh}
.sidebar{
  position:fixed;top:var(--topbar);bottom:0;left:0;width:var(--sidebar);
  background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:16px 0 40px;z-index:40;
}
.sidebar::-webkit-scrollbar,.main::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb,.main::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.toc-hint{font-size:11px;letter-spacing:2px;color:var(--muted);padding:6px 20px 12px;text-transform:uppercase}
.toc-hint .total{display:block;letter-spacing:0;font-size:11px;color:var(--muted);margin-top:6px;text-transform:none}
.toc-ch{margin-bottom:2px}
.toc-ch-title{
  display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;
  font-weight:600;font-size:14px;user-select:none;color:var(--text);
}
.toc-ch-title:hover{background:var(--panel2)}
.toc-ch-title.active{color:var(--accent);background:var(--mark-bg);font-weight:700}
.toc-ch-title .num{
  flex:none;width:24px;height:24px;border-radius:6px;background:var(--panel2);
  color:var(--accent);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700;
}
.toc-ch-title .name{flex:1;line-height:1.35}
.toc-ch-title .wc{flex:none;font-size:10.5px;color:var(--muted);font-weight:400;opacity:.8}
.toc-ch.hidden{display:none}
.main{margin-left:var(--sidebar);flex:1;padding:44px 24px 120px;min-width:0}
.paper{max-width:820px;margin:0 auto}
.chapter{margin-bottom:80px;scroll-margin-top:80px}
.chapter-head{margin-bottom:36px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.chapter-head .badge{
  display:inline-block;background:var(--badge-bg);color:var(--accent);
  border:1px solid var(--badge-border);border-radius:6px;padding:2px 10px;font-size:12px;
  letter-spacing:2px;margin-bottom:14px;
}
.chapter-head h1{font-size:30px;line-height:1.35;font-weight:800;letter-spacing:.5px}
.chapter-head .wcmeta{font-size:13px;color:var(--muted);margin-top:10px}
.chapter-head .wcmeta b{color:var(--accent);font-weight:700}
.para{margin:0 0 18px;color:var(--para);text-align:justify}
.bookfig{margin:26px 0;text-align:center;cursor:zoom-in}
.bookfig img{max-width:100%;max-height:560px;border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.12)}
.bookfig.bfbig{cursor:zoom-out}
.bookfig.bfbig img{max-width:none;max-height:none;width:auto;box-shadow:0 4px 24px rgba(0,0,0,.3)}
.bookfig figcaption{font-size:12px;color:var(--muted);margin-top:8px}
mark{background:var(--mark-text);color:var(--amber);border-radius:3px;padding:0 2px}
.side-tabs{display:flex;gap:4px;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.side-tabs button{flex:1;background:none;border:1px solid var(--line);color:var(--muted);
  border-radius:7px;padding:7px 4px;font-size:12.5px;cursor:pointer;transition:all .15s}
.side-tabs button.on{color:var(--accent);border-color:var(--deep);background:var(--badge-bg);font-weight:700}
.side-panel{display:none}.side-panel.on{display:block}
.hl-y{background:rgba(251,191,36,.42);border-radius:2px;padding:1px 0;cursor:pointer}
.hl-g{background:rgba(74,222,128,.38);border-radius:2px;padding:1px 0;cursor:pointer}
.hl-b{background:rgba(96,165,250,.32);border-radius:2px;padding:1px 0;cursor:pointer}
.hl-bold{font-weight:800}
.selbar{position:fixed;z-index:155;display:none;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:5px;gap:4px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.selbar.show{display:flex;flex-wrap:wrap;max-width:340px}
.selbar button{border:none;background:var(--panel2);color:var(--text);border-radius:7px;
  padding:7px 10px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:5px}
.selbar button:hover{background:var(--accent);color:#08110f}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.dot.y{background:#fbbf24}.dot.g{background:#4ade80}.dot.b{background:#60a5fa}
.excerpt-item{position:relative;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.excerpt-item:hover{background:var(--panel2)}
.excerpt-item .etext{font-size:13px;line-height:1.7;color:var(--text);word-break:break-word}
.excerpt-item .emeta{font-size:11px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.excerpt-item .edel{color:var(--muted);border:none;background:none;cursor:pointer;font-size:14px;padding:2px 6px}
.excerpt-item .edel:hover{color:#f87171}
.excerpt-item .ecolor{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px}
.excerpt-empty{padding:30px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
.excerpt-tools{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.excerpt-tools button{flex:1;min-width:70px;background:var(--panel2);border:1px solid var(--line);
  color:var(--text);border-radius:7px;padding:7px;font-size:12px;cursor:pointer}
.excerpt-tools button:hover{border-color:var(--accent);color:var(--accent)}
.excerpt-search{margin:10px 16px 4px;width:calc(100% - 32px);background:var(--panel2);
  border:1px solid var(--line);color:var(--text);border-radius:7px;padding:8px 10px;font-size:13px;outline:none}
.progress{position:fixed;top:var(--topbar);left:0;height:2px;background:var(--accent);z-index:60;width:0}
.totop{
  position:fixed;right:24px;bottom:28px;width:44px;height:44px;border-radius:50%;
  background:var(--panel2);border:1px solid var(--line);color:var(--accent);
  font-size:20px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:30;
}
.totop.show{display:flex}
@media(max-width:800px){
  :root{--sidebar:0px}
  .brand .sub{display:none}
  .brand>span:nth-child(2){display:none}
  .topbar{gap:10px;padding:0 12px}
  .searchwrap{margin-left:auto;flex:1;max-width:190px}
  .searchwrap input{width:100%}
  .menu-btn{display:block;flex:none}
  .sidebar{transform:translateX(-100%);transition:transform .25s;width:82vw;max-width:320px}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:30px 16px 100px}
  .chapter-head h1{font-size:24px}
  body{font-size:15.5px}
  .overlay{position:fixed;inset:0;background:var(--overlay);z-index:35;display:none}
  .overlay.show{display:block}
}
/* FOCUS-READ-MODE v1 */
/* ---------- 专注阅读（全屏）模式 ---------- */
.focus-btn{flex:none;display:inline-flex;align-items:center;gap:5px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:700;background:transparent;cursor:pointer;white-space:nowrap;transition:border-color .18s,color .18s;font-family:inherit}
.focus-btn:hover{border-color:var(--accent);color:var(--accent)}
body.focus-mode .topbar,body.focus-mode .sidebar,body.focus-mode .progress,body.focus-mode .overlay,body.focus-mode .selbar,body.focus-mode .totop{display:none!important}
body.focus-mode .layout{padding-top:0}
body.focus-mode .main{margin-left:0;padding:0}
body.focus-mode .paper{max-width:var(--focus-width,760px);margin:0 auto;padding:64px 30px 160px}
body.focus-mode .para{font-size:var(--focus-fs,19px);line-height:var(--focus-lh,2);letter-spacing:.01em}
body.focus-mode .chapter{margin-bottom:100px}
body.focus-mode .chapter-head{margin-bottom:48px}
body.focus-mode .chapter-head h1{font-size:32px}
body.focus-mode .bookfig{margin:36px 0}
.focus-tools{position:fixed;z-index:210;right:18px;top:18px;display:none;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:6px 8px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
body.focus-mode .focus-tools{display:flex}
.focus-tools button{min-width:32px;height:30px;border:none;background:transparent;color:var(--text);border-radius:7px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;padding:0 8px}
.focus-tools button:hover{background:var(--panel2);color:var(--accent)}
.focus-tools .ft-exit{color:var(--accent);border-left:1px solid var(--line);border-radius:0 7px 7px 0;margin-left:2px;padding-left:10px}
.focus-tools .ft-label{font-size:11px;color:var(--muted);padding:0 4px;white-space:nowrap}
.focus-hint{position:fixed;z-index:210;bottom:22px;left:50%;transform:translateX(-50%);display:none;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:7px 16px;font-size:12px;color:var(--muted);box-shadow:0 4px 18px rgba(0,0,0,.1);opacity:.92;pointer-events:none}
body.focus-mode .focus-hint{display:block}
@media print{.book-title{color:#000!important;border-bottom:2px solid #000!important}.book-title:empty::before{content:''!important}}
@media print{.focus-btn,.focus-tools,.focus-hint{display:none!important}body.focus-mode .topbar,body.focus-mode .sidebar,body.focus-mode .progress,body.focus-mode .overlay,body.focus-mode .selbar,body.focus-mode .totop{display:none!important}}

@media print{
  html{
    --bg:#fff;--panel:#fff;--panel2:#fff;--text:#000;--muted:#000;--line:#000;
    --accent:#000;--para:#000;--badge-bg:#fff;--mark-bg:#fff;
  }
  body{background:#fff!important;color:#000!important;font-size:11pt}
  .topbar,.sidebar,.progress,.totop,.overlay,.selbar{display:none!important}
  .layout{display:block;padding:0}
  .main{margin:0;padding:0}
  .paper{max-width:none}
  .chapter{margin-bottom:24px;page-break-after:auto}
  .chapter-head{border-bottom:1px solid #000;padding-bottom:8px;margin-bottom:16px}
  .chapter-head h1{font-size:20pt;color:#000}
  .para{color:#000!important}
  mark{background:none;color:#000;font-weight:bold}
}
.rt-wrap{position:relative;flex:none;display:inline-flex}
.read-timer{display:inline-flex;align-items:center;gap:6px;height:34px;color:var(--muted);font-size:13px;font-weight:600;background:transparent;border:1px solid var(--line);border-radius:8px;padding:0 10px;white-space:nowrap;cursor:pointer;font-family:inherit}
.read-timer:hover{border-color:var(--accent);color:var(--accent)}
.read-timer .rt-dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.read-timer.live .rt-dot{background:var(--accent);box-shadow:0 0 0 3px rgba(14,148,136,.16)}
.read-timer b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:700}
.rt-pop{position:absolute;right:0;top:calc(100% + 8px);z-index:300;width:262px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:0 12px 34px rgba(0,0,0,.13);display:none;text-align:left;font-weight:400;font-size:13px;line-height:1.6}
.rt-pop.show{display:block}
.rt-pop h4{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:700}
.rt-pop .rt-big{font-size:22px;color:var(--accent);font-weight:800;margin-bottom:8px;font-variant-numeric:tabular-nums}
.rt-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.rt-row:last-child{border-bottom:0}
.rt-row span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-row b{color:var(--text);font-variant-numeric:tabular-nums;flex:none}
.rt-bars{display:flex;align-items:flex-end;gap:4px;height:58px;margin:8px 0 6px}
.rt-bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.rt-bar i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.rt-bar.today i{opacity:1;box-shadow:0 0 0 1px var(--deep)}
.rt-bar em{font-size:10px;font-style:normal;color:var(--muted);white-space:nowrap}
.rt-tip{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
@media(max-width:720px){.read-timer{height:30px;padding:0 7px;font-size:12px}.rt-label{display:none}.rt-pop{right:-40px;width:242px}}
@media print{.rt-wrap,.rt-pop{display:none!important}}

/* MOBUI-v1 */@media(max-width:720px){.undo-btn{display:none!important}.split-reader{display:none!important}}
</style>



<style id="simpleEditStyle">
/* ===== SIMPLE-EDIT-v2 默认纯阅读 + 按需改字 ===== */
/* 只有正在编辑的那一段才有提示框；其余段落保持纯阅读，无任何框 */
/* DUPTITLE-v1 正文首段与标题重复时隐藏该行（不删DOM，仅视觉隐藏）*/
.dup-title-line{display:none!important}
.dup-title-line + p{margin-top:0}
@media print{.dup-title-line{display:none!important}}
/* BOOKTITLE-v1 书名大标题（空白可编辑）*/
.book-title{font-size:30px;font-weight:800;line-height:1.35;color:var(--text);
  margin:6px 0 26px;padding:0 0 14px;border-bottom:2px solid var(--accent);
  cursor:text;outline:none;min-height:1em}
.book-title:empty::before{content:'点击此处输入书名大标题…';color:var(--muted);font-weight:600;opacity:.7}
[data-pid].se-editing{outline:1px solid var(--amber);outline-offset:2px;border-radius:2px;cursor:text;background:rgba(251,191,36,.05)}
/* 改过的段落：极轻左边框痕迹（打印去掉） */
/* EDITUI-FIX: 改字后不再显示橙色竖框，段落保持纯阅读外观 */
/* 文字被删空的段落：隐藏整段（含残留竖线装饰），撤销后自动恢复 */
[data-pid].se-empty{display:none!important}
/* 工具条里的改字按钮 */
#editBtn{white-space:nowrap}
/* 顶栏「回到上一版」按钮 */
.undo-btn{flex:none;display:inline-flex;align-items:center;gap:5px;color:var(--muted);border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:border-color .18s,color .18s}
.undo-btn:hover{border-color:var(--accent);color:var(--accent)}
.undo-btn.hasundo{border-color:var(--amber);color:var(--amber)}
.undo-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:370;background:#111418;color:#fff;font-size:12px;padding:7px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
.undo-toast.show{opacity:.94}
@media print{.undo-btn,.undo-toast{display:none!important}p[data-edited="1"],h2[data-edited="1"]{box-shadow:none!important;padding-left:0!important}[data-pid].se-editing{outline:none!important;background:none!important}}
</style>

<!-- EDITUI-FIX-v1 -->
<style data-mobovf>
/* MOBOVF-v1 防止手机横向滑动 */
html,body{overflow-x:hidden!important;max-width:100%!important}
body{position:relative}
.mob-topbar{max-width:100vw!important;box-sizing:border-box!important}
</style>

</header>
<div class="overlay" id="overlay"></div>
<div class="layout">
  <nav class="sidebar" id="sidebar">

<script>
const DATA = [{"icon": "荐", "title": "推荐序 美国新镀金时代的“离经叛道”", "paras": ["吴晨", "中国读者通过《从0到1》认识了彼得·蒂尔这位硅谷教父级人物，也通过他和埃隆·马斯克的交往了解到当年“PayPal黑帮”在硅谷的影响力。相对于马斯克成功地持续创业，蒂尔则转身成为投资人和导师，收获了一批年轻的门徒，包括2023年大红大紫的OpenAI首席执行官山姆·阿尔特曼、大数据分析公司帕兰提尔的首席执行官乔·朗斯代尔，以及在线支付公司Stripe的创始人帕特里克·克里森等。", "《彭博商业周刊》专栏记者查夫金的这本有关蒂尔的传记，可以丰富我们对硅谷、对创新、对商业成功带来的影响力，对美国政商互动的认知。蒂尔是多重身份、多重光谱的合集：白手起家的亿万富翁，离经叛道的创业者，洞若观火的战略投资家（准确地预测了2008年金融危机的爆发，却没有像《大空头》里描述的那些人那样通过做空赚钱），继乔布斯之后的硅谷教父（包括脸书创始人扎克伯格在内的不少创业者的引路人），《从0到1》的布道者（强调创业的目标是找到垄断的市场并构建维护垄断的护城河），富可敌国的风投家，特朗普在硅谷的知音，新时代数字军工复合体的塑造者（创建了帕兰提尔），用金钱碾压媒体的大亨（为了报复媒体爆料他为同性恋），担心世界毁灭的偏执狂（在新西兰修建地堡），追求长生不老的显贵，鼓吹解构政府、在海上构建没有监管的“伊甸园”的自由意志主义者，极少数出柜的共和党人（保守派歧视同性恋，反对同性婚姻）……", "蒂尔身上所具备的这种少有的多样性，被查夫金称为“逆向思考者”，或者矛盾综合体。他和一个世纪前美国镀金时代的强盗大亨有类似之处，都鼓吹垄断带来的超额利润，运用超级财富施加政治影响，成为密室政治的幕后金主以确保自己的商业利益，精明地投资而变得富者恒富。但蒂尔身上也有鲜明的时代烙印，他和他的门徒在推动科技变革中收获了亿万财富，其致富之速，历史罕见，这也让他有更多时间超越财富，在思想界留下自己的遗产，当然也有更多财富去塑造他理想中的未来，推动社会的改变。", "西方商业语境中的“学而优则仕”通常指向哲人王这一终极目标。成功的商人希望自己留给未来的遗产不只是商业传奇，更有影响后世的思想。蒂尔显然有类似的抱负。问题是，他有机会成为新镀金时代的“哲人王”吗？", "通过梳理蒂尔的经历，我们能对美国科技公司主导的金权世界有更透彻的理解。", "首先，蒂尔很早就确立了自己的思想，财富让他可以更好地推进和传播自己的思想，无论是参与政治，还是推动“海上家园”，都是其思想的实践。蒂尔在大学时就成了自由意志主义者，并在斯坦福大学创建了《斯坦福评论》这一保守主义阵地，《斯坦福评论》的历任主编中很多更是成为“蒂尔江湖”的成员。", "其次，蒂尔是天生的少数派，他背离了大多数精英沿袭的职业生涯。他有机会按部就班上法学院，在大法官身边做实习生，加入知名律所，一步步向上爬到合伙人的位置，成为富裕阶层的一分子。但他很快就发现自己与那些精英不同，他并不适应“枯燥”的职业生涯，也不具备在名校毕业生中脱颖而出的特点，所以在律所工作7个月后，他选择离开，到硅谷创业。他知道要真正出人头地，需要成为有行动力的少数派。美国律师从政者如过江之鲫，的确不稀罕多一个、少一个。相比之下，硅谷的成功创业者、投资人加教父的身份在数字经济时代的影响力要大得多。", "再次，蒂尔虽然创建了不少公司——PayPal、帕兰提尔，但他不是贝索斯或马斯克那种推动一家公司发展、从成功到卓越的创始人。创业对他而言只是为了致富，致富之后则另有宏图。他用出售PayPal的第一桶金转身成为对冲基金经理，随后又成为成功的硅谷投资人，滚雪球一样地致富。蒂尔是那种很快套现的投资人，PayPal上市后不久就被卖给易贝的原因之一就是为了套现。他成功投资了脸书，如果选择在脸书上市后持续持有其股票，蒂尔的财富至少可以再多十倍。从某种意义上讲，投资变现获得的回报可以让他有更多子弹，投入他看中的创业公司。在蒂尔的财富观中，拥有塑造未来的子弹，以及投向他看准的年轻人帮助他们成功，比从长期持续的成功中挣钱更重要。", "蒂尔成立的创始人基金的投资策略在硅谷独树一帜。一般而言，基金总希望对创始人有一定约束，在公司发展出问题的时候也可能推动“宫廷政变”，迫使创始人下台。两大著名硅谷独角兽优步和众创空间WeWork都上演过类似的戏码。蒂尔的基金却以对创始人异常友善著称，他的投资哲学认为创始人不需要培养，更不需要空降成熟的首席执行官帮助实现规模化，真正优秀的公司、能实现指数级增长的公司，其创始人一定是卓越的。创始人基金从没有在董事会上针对创始人投过反对票。", "最后，致富可以满足自己富豪的生活方式，但更是为了实现政治理想。蒂尔是商人参与政治的典范，尤其以其右翼政治观点而“鹤立鸡群”。大多数人眼中的硅谷富豪是科技乌托邦主义者（以谷歌为代表），或者是极客型（书呆子），认为科技能解决各种社会问题。蒂尔则不同，他拥有明确的政治主张，认为美国政府的各种监管日益膨胀，不易于创新发展，希望推动减少监管。他自己并不投身政治，却是幕后的大金主和策划师。在2016年特朗普竞选美国总统时，蒂尔是硅谷为数不多明确表示支持特朗普的企业家。", "蒂尔代表了一种另类的“理想主义”吗？他的门徒显然是这么认为的，他们相信拥有金钱和才智就能够推动社会进步，而他们在商业领域的成功证明了自己的才智，也拥有了亿万金钱。但蒂尔身上的自相矛盾之处又让人担心，这种商而富则学——成为“哲人王”的冲动本身并不那么纯粹。", "积极构建全新的数字军工复合体是蒂尔的一个自相矛盾之处。一方面，作为保守派，他不认同大政府，也积极推动去监管的政策；另一方面，他努力帮助硅谷的高科技公司赢得五角大楼的巨额投资，甚至他支持特朗普也带有某种政治投机的私心。", "蒂尔帮助创建的帕兰提尔在美国中央情报局抓捕本·拉登的过程中起到了重要作用，蒂尔和公司高管毫不掩饰地推销其情报分析的背景，希望在军方数据分析和情报分析中抢占巨大的市场。特朗普政府第一任国家安全事务助理迈克尔·弗林在阿富汗担任美军情报主管时就对这一软件的功效大为赞赏，并且在阿富汗推广。但是帕兰提尔的软件在美国陆军的推广却遭遇重重阻碍。蒂尔下注特朗普，目的之一也是为了进一步打开军方市场。", "马斯克的SpaceX其实也是美国军工复合体的受益者。军方仍然是美国创新模式背后的主要推动力之一，没有军方/美国航空航天局的巨额经费支持，SpaceX根本不可能实现大发展。马斯克曾经为了入局航天采购而对美国航空航天局提出诉讼（因为它倾向于使用波音等既有供应商）。这为蒂尔打开了新思路，他在2016年起诉美国陆军，就是为自己的数据库和情报分析软件入局做准备。", "蒂尔在商业领域推崇的颠覆也不乏自相矛盾之处。虽然他似乎与马斯克一样都是商业推动变革的鼓吹者，但仔细分析不难发现，蒂尔推崇的颠覆与乔布斯和马斯克很不同。", "乔布斯推崇的颠覆是通过创业让每个人都能够挖掘自己的潜力，也可以通过设计思维为大众提供真正具有变革性的产品和服务；蒂尔推崇的颠覆则是打破当下的常态，单点突破，在新秩序中作为先行者而赚大钱。", "乔布斯拓展的是那种希望给人类赋能的价值创造的思路，执着于提供更好的产品和服务，执着于改变世界、实现理想、创造价值，执着于艺术与技术的十字路口。从这一意义上而言，马斯克的确是乔布斯的传人，他甚至认为烧投资人的钱是可耻的，他也一而再、再而三地为自己投资的事业不惜倾家荡产，包括2022年在收购推特上砸下440亿美元。", "蒂尔布道的“从0到1”则把颠覆本身作为创业的目的，而不是因创业而带来的成果。改变成为一种宣言——挑战既有秩序的宣言。扎克伯格和优步的创始人特拉维斯·卡兰尼克就是蒂尔式颠覆的拥趸，他们找到了现有秩序中的薄弱环节，想方设法用更好的方式来取代，无论是广告（脸书）还是打车（优步），或是住宿（爱彼迎）和办公室（WeWork）。当然，在颠覆既有秩序的过程中，他们也会赚得盆满钵满。", "马斯克颇得乔布斯的真传，无论是电动车致力于应对气候变暖问题，还是可回收的火箭让人类有可能成为跨行星生物，都给人以一种正向突破的激励。相反，蒂尔的拥趸所创建的公司，无论是社交媒体滥用的“眼球经济”，还是出行、办公、住所推崇的“分享经济”，都呈现出优劣并呈的状态，离经叛道在所不惜。", "换句话说，两者之间的本质区别是乔布斯和马斯克拥抱极致的企业家精神，蒂尔则积极投身于找到赚钱的全新风口，赢得财富以实现其他宏大的目标。虽然企业家精神的极致也是利用积累的财富回馈社会，像盖茨基金会那样，但其前提和出发点是做出极致的企业。然而，蒂尔所呈现的则是硅谷最近10年快速致富的道路，虽然运用财富带来改变的理想主义不乏真诚之处，但快速致富的过程可能毁誉参半。", "蒂尔的自相矛盾之处也恰恰是硅谷的自相矛盾之处：一边是自负的科技万能主义者，另一边是寻求快速致富的“淘金者”。财富具有巨大的吸引力，成功则有自信的光环加持，与镀金时代相比，硅谷的年轻优势也让他们可以更早地运用财富推动实现自己的理想。只是这种理想仍然和蒂尔一样，有些离经叛道，本质上是“少数派”。", "整体而言，查夫金的这本蒂尔的另类传记可以让中国读者更好地理解新一代硅谷创业者超越财富的抱负背后的思想来源。在未来与硅谷的合作中，对中国的投资人和创业者来说，蒂尔无疑是一个值得细细品味的人物。", "吴晨", "《经济学人·商论》总编辑，著有《超越乌卡》《潜流》"], "wcount": 3780}, {"icon": "序", "title": "序言", "paras": ["也许人们已经不太记得，但确曾有那么一段时间，整个世界好像已经准备把一切掌控权都交到了硅谷手中。那是2016年，当时商业杂志称之为“独角兽时代”，独角兽指的是那些成长迅速且自身价值变得不可估量的科技公司，它们几乎就是神话般的存在。杰夫·贝索斯拯救了美国的一张大报，马克·扎克伯格与旧金山的政客们打得火热，后者还用他的名字为一家医院命名，交通维权者在美国各大城市抗议，支持优步（Uber）打破原有交通出行格局的做法。彼时，美国总统巴拉克·奥巴马的任期即将结束，在考虑自己的去向时，他打算移居加利福尼亚，成为一名科技投资者。那一年的春天，他对记者们说，风险投资听起来可能会“令人非常满意”。", "但是，正当这位自由世界的领袖踌躇满志、时代思潮为硅谷的无限前景和潜力高唱赞歌之际，硅谷的一位先驱者却早已将目光越过硅谷投向远方。在之前的20年里，彼得·蒂尔积累了数十亿美元的财富，投资了一些卓越的大型科技公司，包括脸书、PayPal和SpaceX（美国太空探索技术公司）。由此，他建立了一个人际关系网，使其能够接触到世界上最好的企业家和最富有的投资者，也让一代有抱负的创业者对他顶礼膜拜。但蒂尔想要的可不仅是在硅谷呼风唤雨，他想要的是真正的权力——政治的权力。他眼看就有机会抓住权力了。", "起初，这一机会是以脸书的一桩小丑闻的形式到来的，而蒂尔正是脸书的早期投资者。2016年5月，科技博客Gizmodo发表了一篇文章，声称保守派的观点被脸书系统性地压制了。正在制作“热门话题”项目的编辑团队说，他们受命采用来自美国有线电视新闻网和《纽约时报》这样的主流媒体的报道，但要屏蔽来自右翼媒体的报道，以及那些流行于保守派中的边缘话题，比如那个未经证实的说法，即美国联邦税务局一直在针对茶党附属的非营利组织。", "这一独家报道其实已经很含蓄了，因为“热门话题”与常规的新闻递送没有任何关系，后者是由算法来筛选组织的，往往充斥着右翼内容。但即便如此它依然激怒了保守派，他们认为这是脸书在更广泛层面上存在偏见的证据。此前被禁的媒体“德拉吉报道”以扎克伯格的副手、《向前一步》一书的作者谢丽尔·桑德伯格有损形象的大幅照片作为头条，列出尖刻的标题：“不是向前一步……而是向左一步！”“脸书惹火上身”则是福克斯新闻频道的标题字幕。", "脸书否认了这些指控，但扎克伯格意识到这是一场需要化解的危机，于是他向蒂尔求助。5月18日，星期三，16位著名的右翼媒体人士被召集到门洛帕克开会。他们中有脱口秀主持人塔克·卡尔森、格伦·贝克和达娜·佩里诺，有“茶党爱国者联盟”、美国企业研究所和美国传统基金会的主席们，以及其他人。按官方说法，他们去那里是为了见扎克伯格和桑德伯格，但其实去见蒂尔才是他们中很多人愿意走这一趟的真正原因。", "蒂尔比扎克伯格年长10多岁，但两人有很多共同之处。与扎克伯格一样，蒂尔也是一个无情的竞争对手，但在社交场合又十分笨拙。他们的关系一直非常密切，蒂尔是扎克伯格的导师和赞助人，也是其公司的第一个外部投资人，还是第一个意识到扎克伯格明白自己在做什么的权威人士。", "多年前，扎克伯格在蒂尔眼中还只是一个举止粗鲁、不善交际的年轻人，他发明了一种方法，用来给他哈佛女同学的吸引力打分，而这就是他当时的主要从商资历。在投资脸书之后，蒂尔让扎克伯格对脸书拥有了绝对的掌控权，并帮助这个在名片上印着“我就是CEO……混球”的毛头小子华丽转身，变成一个光鲜得体的资本家。这段关系让他们都变得非常富有，尽管蒂尔不再持有脸书的很多股份，但他仍然是公司董事会的一员，并为了提升公司的影响力投入了大量资金。", "扎克伯格和蒂尔在前些年分道扬镳，因为蒂尔在保守派政治世界里越来越稳固，扎克伯格则接受了奥巴马时代的精神，成立了一个旨在促进对工商业有利的移民改革的游说团体，并承诺为“提高人类潜能和促进平等”的事业投入数十亿美元。", "尽管扎克伯格主要致力于培植与奥巴马和其他左翼人士的关系，但他仍继续仰赖蒂尔作为他与美国右翼的联络人。扎克伯格的亲信们说，蒂尔是该公司的保守派良心。“马克希望在脸书里能实现左右两派间的平衡，”脸书的一位前高管说，“他认为，如果每个人都是心地温良的民主党人，健康的辩论就无法开展。”扎克伯格的批评者认为，蒂尔对公司的影响更深远且更有害。以这种观点来看，蒂尔才是那个支配大师：要推动一个年轻的、意识形态不确定的创始人与共和党的一个极端主义派别结盟。", "当保守派领袖们抵达由弗兰克·盖里设计的占地开阔的脸书总部时，蒂尔和扎克伯格恰好是研究如何改变一代人对商务休闲装概念的态度的绝好对象。扎克伯格穿着他一贯的标准搭配——灰色T恤和牛仔裤；蒂尔则穿着一件正装衬衫，袖子卷起，脚上穿着一双麻底鞋。和往常一样，他端出一副准备迎接碰撞的架势，双肩前倾，头总微微内收。", "这一行人在一张大桌子前坐下，扎克伯格和桑德伯格带领他们听完了一场信息量大得难以理解的技术演讲，旨在解释是脸书的软件，而不是编辑人员，选择了绝大多数出现在脸书上的文章。扎克伯格询问大家有没有问题要问，在场的专家们认为，这是在邀请他们对脸书公司左倾的员工及有关硅谷支持自由事业的普遍感觉展开批评。", "“他们就是要让他求仁得仁，”电台谈话节目名人、福克斯新闻频道前主持人格伦·贝克这样回忆道，他以其戏剧性的阴谋论和在镜头前傻乎乎的滑稽动作而闻名，“他也确实有些活该。”", "贝克是蒂尔一直在暗中培养的那一小部分与会者之一。当他在剑拔弩张的局势下离开福克斯新闻频道后，就有传言说，鲁珀特·默多克的妻子邓文迪曾于奥巴马执政期间要求将他换掉，当时正是他主持的节目遭人算计的当口儿，是蒂尔说服他专注于流媒体视频和播客。“你必须做出决断，是要走向未来，还是留在过去。”蒂尔对贝克说。", "贝克很喜欢蒂尔，在会议中扮演了扎克伯格辩护人的角色。“你们有30位数十年来始终捍卫言论自由的人，”他一边跟扎克伯格讲话，一边朝他的同事们打手势，“而且，你们拥有的这个平台给了亿万人民言论自由。”", "扎克伯格似乎被贝克表现出的同理心感动了。“我们创建脸书就是为了让它成为包罗各种思想的平台，”在一行人离开后，他在自己的脸书页面上这样写道，“我们社区的成功取决于每个人都能轻松愉快地分享他们想要分享的任何东西。”", "这句话向员工和外部世界传达的信息是明确的，即脸书打算允许唐纳德·特朗普的支持者在其平台上畅所欲言。当时，特朗普已经是事实上的共和党提名候选人。在之后的几个月里，脸书上的虚假信息（大部分对特朗普有利）完全盖过了真正的新闻。一项研究显示，那段时间脸书上最火的美国大选头条的标题，就是“教皇方济各震惊世界，支持特朗普竞选总统”，当然，从来就没有这回事。还有一条消息则错误地声称，维基解密的电子邮件显示，希拉里·克林顿曾向“伊斯兰国”恐怖分子出售武器。", "扎克伯格最终道歉了，姑且算是吧，他后来在被召去回答国会关于脸书是如何被用来操纵大选的质询时这样表示：“我们对自己的责任没有足够全面的认识，这是一个很大的错误。”但当时脸书否认帮助传播错误信息，还淡化了俄罗斯政府介入的程度。", "在门洛帕克会议两个月之后，蒂尔正式宣布支持特朗普，成为克利夫兰的共和党全国代表大会明星。10月中旬，在特朗普炫耀性侵犯的《走进好莱坞》视频曝光仅几天后，蒂尔就向特朗普的竞选团队捐赠了100万美元。此举帮助扭转了这一波负面新闻的浪潮，并为相关竞选行动注入了资金，作为压制选民策略的一部分，该行动将购买脸书大量有针对性的广告，意在打击希拉里的潜在支持者。", "大选结束后，蒂尔得到了特朗普核心圈子的款待，并在特朗普大厦有了一间办公室，还获得了在新政府中安插亲信的自由。蒂尔为竞选带来了知识的可信度和严肃性，而这两者有时都很难传达。对特朗普主义右翼人士来说，蒂尔堪称大英雄，是促成特朗普意外获胜的关键性人物。", "但对左派而言，蒂尔却是极端邪恶的：他是硅谷的权力掮客，曾依靠大量技术服务来帮助吸引美国人，然后利用他对这些服务的影响力，选出了一位承诺禁止穆斯林进入美国并驱逐数百万非法移民的总统候选人。多年来，激进组织一直在对此类情况发出警告，称硅谷正在积聚越来越强大的力量，而且在一股中间偏左的理想主义光芒之下，民族主义的暗流正在膨胀。自科技行业存在以来，极右翼思想就从未缺位，这一直可以追溯到斯坦福大学成立之时。但是彼得·蒂尔让这一思想不再仅停留于表面，并将它们“武器化”。", "蒂尔有时被描述为科技行业的标志性保守派，实际上这一观点严重低估了他的影响力。比起硅谷的其他投资者和企业家，甚至杰夫·贝索斯，或谷歌的创始人拉里·佩奇和谢尔盖·布林，抑或扎克伯格本人，蒂尔在创立最终定义硅谷的根本观念中所负的责任要大得多。而这一根本观念就是：应该不惜一切代价追求技术进步，而不要有哪怕一点点对于可能给社会造成潜在危害或导致其付出代价的顾虑。", "蒂尔不是最富有的科技巨头，尽管他几乎肯定比硅谷的普通亿万富翁更善于保护自己的资产，并且有本事为价值100亿美元左右的投资组合缴纳很少的税，但是他在许多方面始终是最有影响力的。他的第一家公司PayPal曾是电子商务的先驱，PayPal自打从蒂尔当时出售时接盘的易贝（eBay）剥离出来后，至2021年年初，市值已接近3 000亿美元。他的第二家公司帕兰提尔（Palantir）在“9·11”事件后普及了数据挖掘技术的概念，并为科技行业批评人士所说的“监控资本主义”铺平了道路。该公司成为当时特朗普政府移民和国防项目中的关键力量，其市值约为500亿美元，由作为该公司最大股东的蒂尔全面掌管。", "蒂尔的创业履历令人印象深刻，尤其是其作为投资者和幕后交易撮合人，影响力更大。他领导着所谓的“PayPal黑帮”，这是一个金融及个人关系纵横交织的非正式网络，最早可以追溯到20世纪90年代末。这个群体的成员包括埃隆·马斯克及优兔（YouTube）、Yelp和领英（LinkedIn）的创始人。他们将向爱彼迎（Airbnb）、来福车（Lyft）、声田（Spotify）、Stripe和深度思考（DeepMind）提供资金，而深度思考现在以谷歌领先世界的人工智能项目而闻名，当然他们也会向脸书提供资金。", "由此，蒂尔和朋友们合力把一个曾经的地区性商业中心（规模约等于波士顿或其他一些美国中等都市区）改造成为无可争辩的美国经济和文化引擎。1996年，美国股票市场上市值最高的五家上市公司中没有一家科技公司，而到2021年，市值前五名已全部是美国科技公司。如今，最高产的好莱坞制片商是网飞（Netflix）。更多的美国人从社交媒体（主要是脸书）获取新闻，而不是有线电视。", "这种增长并非一直都是完全良性的。现今的科技行业，尽管仍被很多人视作充斥着不善交际、心地纯良的书呆子的文化荒漠，但已经成为一股贪婪且貌似不道德的力量，这股力量能产生出新的娱乐形式、沟通交流的新媒介及叫出租车的更好办法，同时也对伴随着这些进步而来的行为成瘾、激进化和经济贫困熟视无睹。美国2016年接纳了优步和爱彼迎，却为此付出了代价：这两家公司以低工资和低保障的工作取代了拿固定工资的出租车司机和酒店从业者的工作，接着又极力阻挠政府将它们纳入监管的努力。", "这种转变是蒂尔另外一个项目必不可少的组成部分，即试图强行推进一种极端的自由主义，将权力从传统机构转移到初创公司和在背后控制它们的亿万富翁手中。蒂尔的基本理念相当复杂，而且在某些方面自相矛盾，后文将深入探讨，但其对技术进步的痴迷是与民族主义政治交织在一起的，此种政治理念有时似乎与白人至上主义纠缠不清。将原本或许很酸涩的东西变得甜美，这就是蒂尔的个人经历，一场从不得志的公司律师到互联网亿万富翁的人生蜕变之旅，他在大学上课、演讲及其著作《从0到1》中讲述了很多次。这本自由意志主义者的成功手册还认为，垄断是好事，君主制是最有效的政府形式，科技创始人就如同神一般。这本书的全球销量已经超过125万册。", "对那些崇拜他、反复观看他的演讲、在社交媒体上为他的才华大唱赞歌并购买他的书的年轻人来说，蒂尔犹如安·兰德和她所虚构的小说人物的结合体。他既是自由主义哲学家，也是建筑师，就像优兔上粉丝如潮的建筑家霍华德·罗克。在这些追随者中，最狂热的是蒂尔奖学金学员们（Thiel Fellows），蒂尔的基金会给他们每人10万美元，让他们辍学创立公司。其他人则在他的谋士圈子里工作，他在经济上支持这些谋士，他们则宣传和捍卫他、他的朋友及他的思想。这些人有时会谈论所谓的“蒂尔江湖”，这是一个有自己的法则和道德标准的世界，并始终存在一种朝向这位资助者的万有引力。随着蒂尔变得越来越强大，这些法则已经成为整个硅谷的法则。他们从中获得的优势似乎越来越多地超越其本身。", "蒂尔的世界观的影响力如此之大，甚至影响到他的对手。谷歌前首席执行官埃里克·施密特曾被蒂尔讥讽为垄断者和“宣传部长”，但施密特宣称自己是蒂尔的“超级粉丝”，尤其是对于蒂尔对高客传媒所采取的报复行动大加赞赏。在那场行动中，蒂尔秘密资助摔跤选手胡克·霍根（Hulk Hogan）起诉高客传媒，导致该公司在2016年破产。蒂尔的努力结合了财政压力和欺骗，这是一种言论自由倡导者们强烈抨击的方式，但施密特说这给他留下了“深刻的印象”。“我们需要不仅能够挑战正统，而且本身也有意愿并乐于这样做的人。”施密特说。这位曾担任希拉里竞选顾问的自由派人士告诉我，在他看来，蒂尔对特朗普的支持令人钦佩，而这也是“他反主流世界观的一部分”。", "人们对蒂尔的看法相当一致，即他是一位完美的自由思想者，也是一个天生就不会随波逐流的人。对此，蒂尔本人偶尔也是赞同的。“也许我确实一直在后台运行这个程序，同时总是这样思考：‘好吧，那与你所说的正好相反的又是什么呢？’于是，我就会去尝试。”他在2016年总统大选后不久这样表示。“这办法经常出乎意料地奏效。”", "即便如此，蒂尔在特朗普当选的过程中扮演的角色，还是让科技媒体和蒂尔的一些朋友感到震惊。他们想不通，一个来自加利福尼亚最自由地区、在世界上全球化程度最高的产业中发家致富并似乎如此坚定地承诺争取美好未来的、一身书生气的同性恋移民，怎么会支持那么一个反动的、可能成为独裁主义者的人？我则是对另一个问题感到震惊：蒂尔在20世纪90年代中期来到硅谷时还只是名不见经传的失败的金融从业者，他是如何玩转如此大的权力的？没错，他是一个逆向思考者，但逆向思维只是一种方法论，而不是意识形态。我想知道蒂尔到底信奉什么，以及这些信念在硅谷本身到底有多么根深蒂固。", "2007年，我在小型商业杂志《公司》（Inc.）当初级记者，有一次我坐在埃隆·马斯克的办公小隔间里，那时这里正是SpaceX条件非常简陋的总部。马斯克正一边开电话会议，一边查看电子邮件。在等他的时候，我盯着一张电影《感谢你抽烟》（Thank you for Smoking）的海报看。这部电影改编自克里斯托弗·巴克利的小说，他是威廉·F.巴克利的儿子，曾担任乔治·H.W.布什的演讲撰稿人。", "海报上的演职员表中有马斯克的名字，也有其他几位“PayPal黑帮”成员的名字，包括PayPal副总裁马克·乌尔韦和首席运营官戴维·萨克斯，蒂尔的名字也赫然在列。当时，他已经有了“炸弹投掷者”的名声，因此出现在这部以烟草业说客为主角的讽刺电影里看起来很合适。彼得·蒂尔就是大烟草公司的粉丝，或者至少，他完全可以接受别人这样看他。", "当天晚些时候，马斯克向我讲述了自己被PayPal解职的往事。他是董事会的一个秘密阴谋的受害者，蒂尔策划了这一切，而他当时正在度蜜月。马斯克最终原谅了蒂尔，他说“我没找他们算账”，意指蒂尔及其同谋。马斯克把手伸到身后，做了一个从左后背拔下暗箭的动作。在那次采访及为写本书而做的另一次最近的采访中，马斯克完美地展现出他的优雅大度，但也明确表示他并不完全信任这位硅谷最重要的风险投资家。", "从那时起，在我报道的几乎每个科技行业的事件中，蒂尔要么隐身幕后，要么居高临下，要么坐镇中央，并且越来越多地出现在科技行业以外的报道中。2011年，在进步人士开始谈论免费大学的数年前，蒂尔就对学费上涨提出了警告，称高等教育行业的泡沫比房地产行业的更加令人不安。2014年，他出手引爆了人们对大型科技公司的怒火，他当时就把谷歌称为垄断者，这比伊丽莎白·沃伦或伯尼·桑德斯要早好多年。当然，接下来的就是他对高客传媒的摧毁及特朗普的当选。", "2018年，在硅谷、华盛顿特区等地方，我开始采访蒂尔的前雇员、商业伙伴和合伙人，试图了解这一切是如何发生的。蒂尔在刚进入科技行业时，并没有多少钱，也谈不上有什么工程能力。他没有独特的社交风度，似乎也很少享受生活。他说话支支吾吾。至少在传统意义上，他完全没有魅力。", "我所了解到的情况却令我大开眼界，蒂尔的朋友们说，他才华横溢，有远见卓识，而且有一种不可思议的、知道该如何取胜的本事。他有一种特殊的本事，能将人生视作一场象棋比赛，他的朋友、商业伙伴和旗下的投资组合公司都可被他用来达到目的。当然，这也有不那么吸引人的一面。马基雅维利主义的倾向也许使他做交易时冷酷无情，有时甚至达到残忍的地步。", "我本以为蒂尔的密友们都会殷勤地赞美他。有些人的确是这么做的。但对于我的问题，蒂尔的朋友们——那些身处政治权力阶层的人、身价成百上千万美元的工商业主，以及能够吸引亿万富翁关注的投资者，确切地说，他们更加普遍的反应并不是羡慕，而是恐惧！他们告诉我，他们很怕他。他是那么强大，报复心又是那么强。", "在早期的一次采访中，有一个认识蒂尔多年的人，他在硅谷的职业生涯相当成功，这在一定程度上得益于他和蒂尔人际关系网之间的协同，而就是他让我把采访的数字录音机关掉。“我是偏执狂。”他说。接着，他与我分享了一系列旧时逸事，把他的赞助人描绘成一位令人难以置信的投资者，拥有识别和培养年轻人才的诀窍，但他的冷酷无情让人感到不舒服。", "接着，他开始针对个人。“你为什么要写这本书？”他问我，“我是说，你难道就不担心他会来……找你麻烦吗？”", "在我走笔至此时，硅谷的一大帮与蒂尔在经济和社交上过从甚密的投资者和企业家认为，即便是对蒂尔和他的朋友们进行批评性报道本身，也不再被接受。巴拉吉·斯里尼瓦桑曾被蒂尔选中而掌管特朗普治下的美国食品药品监督管理局，他主张摧毁媒体，用他所谓的“全堆栈叙事”公关取而代之。他在推特上说，“建设者必须以批评对付这些批评者”，以及“要阻止那些站在未来对立面的人大声喊停。对此，你们义不容辞”。", "在某些圈子里，蒂尔的名字本身就是动词。说要“彼得·蒂尔”某个媒体或某个记者，意思就是要把他们搞破产，譬如针对高客传媒的诉讼导致它被判赔偿1.4亿美元，起因是高客传媒曾发表一系列帖文，暗指蒂尔不过是个“所谓的有远见卓识的人”，还透露他是同性恋。这向那些公开批评蒂尔或他朋友的人传达了一个明确的信息：只要敢这样做，就会有同样危险的下场。", "就因为蒂尔总是试图打击那些揭露其斑斑劣迹的人，所以在我为写作本书所做的数百小时的采访中，150多名接受采访的前雇员、商业伙伴、朋友和其他人中的许多人都坚持要匿名，连其最有权势的亲信都害怕他，他的那些中学同学自然也害怕他。在整个过程中，我主要通过中间人与蒂尔沟通。2011年，我见过他一次，第二次面对面是在2019年，他坚持那次会晤不留任何记录，我提了一长串问题想核实某些事情，他全都拒绝回答。", "我的目标就是，在本书正文中尝试去解析一个在某种程度上凭借高深莫测而赚了数十亿美元的人。我想知道，他究竟是如何建立起如此高的追随度，又是如何做到持续地每赌必中的——即使这些决定看起来很疯狂。我想知道，一个如此受人尊敬和爱戴的人是怎么做到同时又表现得那般冷酷无情的。蒂尔是一个值得钦佩和研究的天才，还是一个反社会的虚无主义者？他是两者兼而有之吗？", "这些问题很重要，因为它们也是我们向“蒂尔江湖”所打造的那些大型科技公司提出的问题。其中一部分原因是他在建立硅谷的过程中发挥了重要作用，另一部分原因则是许多有权势的人开始崇拜和模仿他，今天的硅谷在很大程度上反映了蒂尔的世界观——无论好坏。如果我们想了解扎克伯格，或者新的垄断资本主义，甚至特朗普式的极右倾向（蒂尔也在秘密培植），我们就需要了解彼得·蒂尔。"], "wcount": 8173}, {"icon": "1", "title": "第1章 最伟大的冒险就在眼前", "paras": ["1980年，在加利福尼亚福斯特城，彼得·蒂尔和一小群八年级的男孩挤在小得像个箱子似的厨房的一张桌子旁。他们的脸为了不让人发现而藏在竖起的三环活页文件夹后面，眼睛老练地盯着一张地图和一套多面骰子。", "旧金山郊区的房屋都极不起眼，密密匝匝地挤在笨重的圣马特奥海沃德大桥下。这片区域一直从硅谷连到奥克兰和工业集中的东湾，而“硅谷”这个名字指的就是旧金山半岛上聚集在101高速公路沿线的各军事研究院所和企业园区。福斯特城似乎离上述地方都不近，是20世纪60年代建成的，当时房地产开发商通过开挖一系列狭窄的潟湖，排干了这一带沼泽里的水。那时还是海边的莱维敦的居住者大多是白人工薪阶层，他们被体面的学校、安全的环境和海滨房产的前景所吸引。这群围坐在厨房餐桌旁的福斯特城的孩子并非创建了英特尔或惠普的天才们的子女，他们的父辈可能是消防员或教师，拿彼得·蒂尔来说，他父亲就是一个脚蹬胶靴、头戴安全帽上班的采矿工程师。", "蒂尔的朋友们都是书呆子，在1980年，作为书呆子，他们会在周末晚上一起玩《龙与地下城》。《龙与地下城》可以被称为一款棋盘游戏，但与其说它关乎输赢，倒不如说是与奇幻故事有关。游戏要求每个男孩为自己创造一个虚构的角色，众多角色选择中包含巫师、野蛮人、德鲁伊和僧侣，各自具备不同的技能：巫师装神弄鬼，野蛮人凶残搏杀，等等。最后一名玩家扮演叙述者和仲裁员的角色，他负责为这些角色设计一场冒险。", "这个叙述者被称为“地下城主”，尽管它应该由大家轮流扮演，但瘦削、聪明且严肃得一脸痛苦状的彼得·蒂尔总是试图独揽这一角色。一个曾经和他一起玩的人说：“你得认清现实，他就喜欢那种不露声色的控制。”", "除了是一种逃避，《龙与地下城》还隐含一点儿危险，至少对这些男孩的父母来说是这样。1980年，密歇根州一名17岁的游戏玩家自杀身亡，在基督教保守派中引发了道德恐慌，他们担心这类游戏怂恿青少年去捣鼓魔术、巫术或其他亵渎神明的把戏，进而扭曲他们的心智。福斯特城的孩子们则对此一笑了之，但这或许可以解释蒂尔为什么从来不请大家到家里来玩，那是因为他的父母笃信宗教。", "他说他来自克利夫兰，尽管他的英语没有口音，但显然还是外国人。他既聪明又自律，但似乎并不快乐。蒂尔当时的一位朋友回忆说：“我不记得他大笑过，从来都是不苟言笑。你也看得出，他们家有些事儿……往好了说，那就是别具一格。”", "1968年，他的父亲克劳斯·蒂尔和母亲苏珊·蒂尔从德国法兰克福来到美国，就在前一年的10月，彼得·安德烈斯·蒂尔出生了。克劳斯当时30岁出头，为亚瑟·G.麦基公司工作。该公司是一家美国工程咨询公司，专门从事炼油厂、钢铁厂和其他重工业的建设。克劳斯毕业于德国多特蒙德国家工程师学院，获得学士同等学位。多特蒙德国家工程师学院是现代多特蒙德工业大学的前身。第二年，也就是1968年，因工作原因，这个小家庭迁往美国，克劳斯在凯斯西储大学攻读工程学研究生课程。", "举家迁美一时显得不合潮流。联邦德国一直忙于战后重建，对大众社会运动持怀疑态度，反主流文化起步较晚，而且几乎没有影响到西柏林，更不用说其经济中心了。20世纪50年代末60年代初，法兰克福是一座新兴城市，到处都是像蒂尔一家这样虔诚的白人基督徒。", "相比之下，克利夫兰却激荡在自由恋爱、黑人权力及对任何好的联邦德国人来说都最糟糕的激进主义浪潮中。两年前，也就是1966年，在霍夫（距凯斯西储大学工程学院约2.4千米），一家老板是白人的酒吧拒绝为黑人服务，并张贴了一纸告示：“无水供黑——”一群暴徒聚集起来，打砸了这家酒吧后又转到其他商户，继续抢劫和纵火。1968年夏，警察和激进组织“新利比亚黑人民族主义者”进行了长达4小时的枪战和对峙，校园附近发生骚乱，共导致7人死亡，并引发连续多日的抢劫、纵火和真枪实弹的警察行动。种族矛盾看来会进一步激化，记者们后来得知，“新利比亚黑人民族主义者”获得了6 000美元的重建拨款（作为该市新当选的黑人市长卡尔·斯托克斯制订的一项计划的组成部分），而他们却用这笔钱购买了武器。", "同年8月，理查德·尼克松接受了共和党总统候选人提名。当时，他作为一位选民意向一致的候选人参选，但含蓄地承诺要阻止黑人、嬉皮士和少数性取向者在美国恣意泛滥。“我们看到许多城市都笼罩在烟雾和火焰之中。”尼克松说，并赞扬了“绝大多数美国人，那些被遗忘的美国人，那些不呐喊、不示威的人”。蒂尔的父母是狂热的共和党人，蒂尔也秉承了这种情感，从而视不呐喊的人为己类，崇拜尼克松时代和尼克松的政治继任者罗纳德·里根。", "1971年，蒂尔家又添了第四个成员——蒂尔的弟弟帕特里克。弟弟出生后不久，父亲就给蒂尔解释了死亡是怎么回事，所用的措辞显得很冷酷，甚至近乎残忍（蒂尔多年后也照搬挪用了）。蒂尔也许是第一次以涉及生命形态的方式向克劳斯问起他们公寓里的小地毯，克劳斯解释说那是用一头死奶牛的皮做的。", "“所有动物都会死亡，包括所有的人，”克劳斯说，“我总有一天会死去，你也一样。”", "那一刻，对当时年仅3岁的小男孩来说，是非常难过的，几十年后，对这个男人来说，依然如此。大多数孩子，要么通过父母的爱，要么通过一种快乐的认知失调，就能从这些早期涉及自身死亡的遭遇中恢复过来。蒂尔却一直没有恢复过来，甚至人到中年，他还会一次又一次地回想起那头奶牛残酷的结局。", "经过6年时间，克劳斯获得了硕士学位，成为一名项目经理，负责管理矿山项目的工程师团队。他的专长是建设露天矿，包括挖掘大量的泥土和岩石，然后对它们进行化学处理，以提取矿物质。蒂尔一家经常搬家，克劳斯更是经常外出，往往在离家很远的工作地一待就是好几个星期。", "离开克利夫兰，这家人选择了一个与蒂尔童年生活过的那个相对多元化的城市截然不同的地方安家，那就是种族隔离制度下的南非。克劳斯被分配到纳米布沙漠的铀矿搞建设，那里离如今纳米比亚的斯瓦科普蒙德不远。", "彼得·蒂尔先在约翰内斯堡的普里德温白人精英英语预科学校待了一段时间，然后又在斯瓦科普蒙德的公立德语学校德意志小学学习了两年。那是一段孤独的时光，可以看到那时拍摄的照片：闷闷不乐的男孩穿着短衫、短裤，打着领带，提着一个成年人用的大号公文包。蒂尔在纳米比亚时的小学同学格奥尔格·厄尔布回忆说他聪明但内向。“他的样子总是与众不同、引人注目且十分聪明，但好像他对什么都没兴趣，”厄尔布说，“在学校里，我们和彼得并没有太多交集。我们都知道矿工的孩子们在这儿是待不久的。”", "克劳斯受雇从事的工作非常敏感。南非曾将被称为“西南非洲”的纳米比亚当作附属国进行管理，现在却已面对反对种族隔离制度的压力，并一直在试图推进秘密的核武器计划。克劳斯正在参与建造的勒辛矿场是该计划的重要组成部分，它使得南非能够在美国意图切断其经济时挺过来，苏联如果进攻也能自卫。矿工们对此不抱幻想。“在勒辛开采铀的行为直接违反了联合国的规定，”20世纪80年代初曾在联合国工作过的该矿的公关主管皮埃尔·马辛说，“我的工作就是告诉全世界，我们的存在是正当的。”", "在西南非洲开采铀矿，这不仅是为了维持种族隔离制度，也是为了利用这个制度。据说，勒辛矿的用工情况比南非的强制劳动要好，但仍然是以与契约奴役相差不多的劳工状况而声名狼藉。在被迫返回他们的“故乡”（即被种族隔离政权描述为半自治的只允许黑人居住的地区）之前，移民劳工要按合同在此干满一年。那些白人经理（如蒂尔一家）可以享受斯瓦科普蒙德全新的医疗和牙科中心的服务，还可以成为公司乡村俱乐部的会员。黑人劳工，包括一些拖家带口的黑人劳工，则住在矿场附近劳动营的宿舍里，不能使用专为白人提供的医疗设施。工人离开工作岗位是一种刑事犯罪，未带身份证就进入矿区通常也会被关进监狱一天。", "铀矿开采本质上是有风险的。在种族隔离制度终结后，纳米比亚支持委员会（一个支持独立的组织）发表了一份报告，用严厉的措辞描述了该矿场的条件，还引用了一位合同工的叙述，他说没人告诉劳工他们是在建设铀矿，因此他们对辐射的危险一无所知。唯一的线索是，白人员工会隔着玻璃发放工资，似乎是为了避免自己受到污染。这份报告提到，1976年，在兴建矿场期间，工人们“像苍蝇一样死去”。", "彼得·蒂尔在南部非洲的两年半生活经历完全不同。他会回忆起，在自家屋后尘土飞扬的河床上，一连几个小时独自读书或玩耍的时光，又或是如果克劳斯或苏珊愿意，他也会跟他们下棋。", "矿场开业的那年，蒂尔一家回到了克利夫兰，但他们在这里只待了一年，他们的下一站是加利福尼亚。在位于萨克拉门托以西的沙漠高地的荒凉一隅——诺克斯维尔，克劳斯被派去建设一座新的金矿。也许是从克利夫兰的生活中吸取了经验教训，蒂尔一家在福斯特城定居下来，这个田园诗般的郊区非常适合当时的“里根革命”。他们花了12万美元，在捕鲸人岛买了一座三居室的房子，这个小岛像一只拳头似地伸入人工湖，其周围的四个小半岛，每个都有一条通到尽头的死路。", "在福斯特城的鲍迪奇中学，蒂尔踏上了一条充满天赋和才华的成长之路，他一次又一次地听到人们说他注定会成就一番伟大的事业。“我们都强烈地感觉到，你一定得取得好成绩，考进好大学，你的整个人生幸福全都取决于此。”蒂尔的同学尼尚嘉·布利斯说。有一年春天，蒂尔的历史老师开了个玩笑，他对全班说，这次考试谁都得不了A，一时间全班鸦雀无声，然后才哄堂大笑：“愚人节快乐！”", "在学业成绩出类拔萃的学生中，蒂尔被普遍认为是最优秀的，他的成绩和考试分数都是最高的。与其朋友圈里的其他人不同，那些人心里都明白自己是书呆子，并为此感到些许羞愧，但蒂尔似乎并不在意。在朋友们的毕业纪念册上，除了写下“今年夏天再见”和“很高兴与你相识”之类的话，蒂尔还嘲笑道：“也许你会缩小一点点和我的差距。”", "“在我们这一代，聪明并不酷，”他的一位朋友说，“我记得我努力掩饰自己的聪明。彼得是我们当中最聪明的人，但他从不刻意掩饰这一点。”每个人，即便是那些书呆子，也都会去踢足球或打棒球，还要假装很喜欢的样子，但蒂尔是个例外。", "他对下棋情有独钟。1972年，在蒂尔5岁之前，曾经的神童——遁世且好斗的鲍比·费舍尔成为首位赢得世界国际象棋锦标赛的美国人。美国首次在黄金时段直播了这场“世纪大对决”，在美国人的注视下，费舍尔击败了苏联国际象棋世界冠军鲍里斯·斯帕斯基。这是自1948年以来苏联以外的国家首次获得这一殊荣，它被视为美国资本主义成就的证明。这位新晋冠军回国后在“鲍比·费舍尔日”中受到了热烈欢迎，还登上了《体育画报》的封面。全美高中和初中国际象棋队的成员也随之激增。", "蒂尔1981年进入圣马特奥国际象棋俱乐部，该俱乐部有数十名成员，他们在午餐时段聚在一起进行比赛，吸引了大批观众。他们要么玩快棋，一种玩家时间有限的变种玩法，通常在5~10分钟内完成一局对弈；要么玩“四狂象棋”，一种团队运动，玩家可以抓抢棋子，并将其传给队友来下。该俱乐部排名榜的插槽上留有30个点位，蒂尔总是能让自己的名片保持在第1个点位，而他的国际象棋棋盘上还贴着一张纸，上面写着“天生会赢”。他是学校里最好的棋手，而且至少一度是美国13岁以下的最佳棋手之一。", "如果真的遭遇失败，这个惯常坚忍的年轻人也会失去冷静。有一次，在一届锦标赛的比赛间隙，蒂尔为了好玩打了一场练习比赛，而且好像根本没有用心。他的对手缺乏经验，对当下的局面也完全没有概念，横冲直闯就出了一着。接着，他意识到，且令他们双方都大感惊讶的是，这一着实际上就是制胜的一击。蒂尔明显变得心烦意乱，无法在后续的正式比赛中保持镇静，最终输掉了剩余的所有比赛。一次失败，即便是毫无意义的失败，也让他难以化解。", "不忙于在棋盘上所向披靡时，他就会沉浸在幻想和科幻小说的世界里。除了《龙与地下城》，当然还有约翰·罗纳德·瑞尔·托尔金，他痴迷于托尔金的作品，一遍又一遍地读，后来甚至吹嘘自己能背下《魔戒》三部曲。他还玩电子游戏，包括《魔域帝国》，这是一款粗糙的自选项目冒险游戏，他在克劳斯带回家的坦迪TRS80上玩。", "计算机革命就发生在向南几千米之外的地方，另一位美国天才史蒂夫·乔布斯在那里创立了苹果电脑公司，现在该公司的销售额超过了1亿美元。克劳斯是计算机技术的早期应用者，他敦促加利福尼亚金矿的同事们都来使用电脑，他的儿子也延续了他对科技的兴趣。彼得·蒂尔编写过一些程序，但真正吸引他的是对未来的憧憬。他读了艾萨克·阿西莫夫和亚瑟·C.克拉克的作品，这两位作家用想象勾画了人形机器人、太空旅行、月球定居点、能填饱肚子的石油源食物、飘浮在空中而不靠轮子行驶的汽车，甚至长生不老。", "蒂尔不是个招人喜欢的男孩。一位同学（也是极客）说，他和其他人都很“敬畏”彼得，但发现他高深莫测、拒人于千里之外，还很高傲。“我不知道他有没有亲密的朋友。”他说。蒂尔的头脑和体格使他成为霸凌的目标，读中学那会儿，他很瘦小。他的朋友凯文·瓦克诺夫回忆说，蒂尔在刚上高中时就被人欺负。", "所有这一切，尽管从未被人评说过，但他举手投足间表现出的那种微妙的娘娘腔，使他成为众人嘲弄的对象，就连那些自认为是蒂尔朋友的人也概莫能外。他的同学们最喜欢搞的一个把戏就是在晚上开车到附近转悠，寻找前院竖有待售标志的房子，他们拔起尽可能多的标志牌，有时能搜罗十几个，然后直接开车到捕鲸人岛，把牌子插在蒂尔家的前院。", "“彼得，我听说你要搬家了！”第二天他们会这么说。他们第一次这么做时，让人感觉很好笑。“现在回想起来，很明显我们是在欺负人，”一名恶作剧参与者说，“我一直在想，他也许在某处放着一张他想要杀掉的人的名单，而我赫然在列。”", "随着身体逐渐发育成熟，蒂尔的自信心越来越强。到高三的时候，他已经变得英俊帅气，下巴轮廓分明，鼻子棱角坚挺，一头浅棕色的头发梳到一边。他的成绩也是一路高歌猛进：在国际象棋上最强，在数学团队中也最优秀，在SAT考试中更是获得近乎完美的成绩，还得到了美国优秀学生奖。他不仅自信，更多的是倨傲不恭，用一个朋友的话来说，那就是走在哪里都带着那副表情，好像在说：“去你的，世界！”", "1984—1985年版的圣马特奥高中年鉴《榆树》里，满满都是对舞蹈表演、足球比赛、学校草坪上的午餐及在半岛另一侧沙滩外冲浪的回忆。彼得·蒂尔并没有出现在任何一个这样的社交场景的页面上，但在几乎所有纪念圣马特奥国际象棋俱乐部及各学术社团活动的页面上都有他的身影。这与前几年迥然相异，同学们猜测，这或许正是所有人都认为最不全面的那个人为了向大学招生人员展示自己有多么全面刻意为之的努力。", "他充满自信地站在航天俱乐部的前排，穿着一件会员专属定制的蓝色风衣，戴着卡西欧电子表；在一副棋盘前，他摆出沉思状；他时常出现在德语俱乐部和拉丁语俱乐部的成员合影中。他还出现在科学俱乐部、模拟联合国、执行理事会，并在该年鉴的最高级页面上拿着一支笔和一堆文件摆姿势，就好像他准备提交一份法律摘要似的。他被票选为“最有可能成功的人”。", "蒂尔最看重的一句引语出自《霍比特人》：“最伟大的冒险就在眼前／今天和明天还未可知。”若干年后，他会说这一整段他都能背诵，这段话接下来是：“机会和改变都在你的手中有待创造／生活的模式亦在你的手中有待打破。”在某种程度上，这段话将成为他的座右铭，尽管在这一点上，这仍然是一种混乱的生活。事实上，这段文字并非出自令蒂尔痴迷不已的《霍比特人》和《魔戒》三部曲的作者托尔金，它其实源自朱尔斯·巴斯为1977年上映的动画版《霍比特人》创作的主题曲，朱尔斯是20世纪80年代的动画片《霹雳猫》的天才制作人。1985年春，蒂尔考入斯坦福大学，这是他梦寐以求的学校。在他的同学中流传着这样一种说法：在填写入学申请表时，蒂尔按要求必须选一个最能恰当描述自己的词，他选择了“聪明”。", "从那以后，朋友们注意到蒂尔与他们越来越疏远，好像他已经从福斯特城搬走。他从来没有想过要跟谁秋后算账，也从来没有与以前折磨过他的人发生正面冲突。在毕业纪念册上，蒂尔除了像往常那样嘲讽他们的分数没有他的高，还提到他一点儿也不想再见到他们。“祝你今夏快乐，生活愉快！”他这样给布利斯题写留言，显得既冷血又温存，“我绝不会（哪怕假设）打掉你。”布利斯认为这一定是因为她跟蒂尔讲了她母亲怀上她是个意外，并认为蒂尔试图以一种非常奇怪的方式表现他的良善。他在留言下面签了名：“爱你的，彼得·蒂尔。”", "蒂尔一直很冷漠，但现在他似乎对一切都无所谓了，包括高中、朋友和老师，他开始挑战各种底线。据一位同学说，蒂尔曾对低年级的学生说，他愿意代他们参加SAT考试，每次收费500美元。那年秋天，在斯坦福大学，两位同学回忆起蒂尔谈论搞副业的情景，其中一人说他四处讨教该如何“安排无法追踪的付款”。", "在他漫长的职业生涯中，这是他第一次利用自己的智慧和对规定的不可抑制的蔑视来获利。考虑到蒂尔的野心和丢掉斯坦福大学学籍的可能性，这么做有难以置信的风险。但蒂尔似乎并不在乎。他对学术规则并不忠诚，就像他对自己忽视的其他社会礼仪一样。也许这就是他与众不同的地方，也是他自诩的“天生会赢”的题中之义。"], "wcount": 6870}, {"icon": "2", "title": "第2章 重新定义投资和生活的指导原则", "paras": ["1907年5月的一个星期三，在斯坦福大学一年一度的毕业典礼上，大约200名青年男子和少数女子聚集在学校大礼堂，聆听旧金山湾区最初的右翼无政府主义者的演讲。", "在简短地讲解了“maverick”（特立独行者）这个词的历史之后，斯坦福大学校长戴维·斯塔尔·乔丹建议，该校第16届毕业生应当效仿那些热爱自由的牛（“maverick”这个词曾经是指那些尚未被牧场打上烙印的自由散养的牛）。“我今天早上的演讲主题是人类的特立独行者——那些生而自由的人、那些没有被打上人类烙印或标签的人，他们是美国自由制度的希望。”乔丹在演讲中说，此演讲文稿后发表于《斯坦福日报》。", "按照学术培训的标准，乔丹是一名鱼类研究者，即鱼类生物学家，但他以神童般的大学校长而闻名，他首次担任校长时年仅34岁，是在印第安纳大学；6年后，他又成为可与常春藤盟校相媲美的加利福尼亚大学的第一任校长。乔丹后来作为优生学家的名声很差，2020年10月，斯坦福大学宣布将他的名字从校园建筑物上去除。但相比于他的种族主义理论，那次的毕业典礼演讲更关注的是一个非常具体的自由概念，即斯坦福大学的毕业生应在不受政府干预或监管的情况下自由行动。", "1906年，厄普顿·辛克莱出版了《屠场》一书，全面揭露了芝加哥肉类加工业的劳作条件。乔丹认为，这本书的“真正寓意”不在于工人被工厂主和其他资本家剥削，而在于工人本身就是问题。乔丹说：“成群结队的人没有也不可能有自由，他们挤在大城市的贫民窟里，他们不可能维护自己的权利，这些人的存在威胁着自由制度，从中可以找到这本书的寓意。”换言之，真正的受害者是工厂主，他们因为按照工人应有的待遇对待工人而受到不公平的诽谤。“人类所有的种族生来就是要被剥削的，”乔丹说，“但剥削他们的国家倒霉了。”", "毫无疑问，在乔丹的头脑中，也许还有他的听众的头脑中，新毕业生注定会成为剥削者，他感兴趣的就是如何捍卫他们的权利。乔丹说，他们是“头脑贵族”的新成员，他将此称为“民主的最终目的”。他敦促这些新晋贵族把美国当作个人自由的堡垒，尤其是免除高税收的自由。他们将“站在一起，做财政部的监督者，做加利福尼亚纳税人权利的守护者”。", "这种极端保守的世界观，尽管已在官方历史中与乔丹的白人至上主义一起被抹去，但从未在心理上完全消失，并完全嵌入了斯坦福大学的格调之中。后来，斯坦福大学引入了赫伯特·胡佛的保守派智囊团。", "胡佛研究所由胡佛——这位后来的美国总统和新政的坚定反对者，在1919年创立，它当时还只是一家专门收藏第一次世界大战档案文献的资料馆。但在20世纪四五十年代，胡佛研究所野心膨胀，无论是从字面还是从现实来看，它都变得越来越政治化，也越来越阴森可怖，其对学生生活的影响贯穿了整个20世纪。胡佛研究所所在的塔楼高约87米，是斯坦福大学校园里最高的建筑物，也是其地标性建筑物。在1964年的总统大选中，胡佛研究所的执行理事W.格伦·坎贝尔曾担任巴里·戈德华特的高级顾问。10年后，他又提名戈德华特的意识形态后继者、时任加利福尼亚州州长的罗纳德·里根为胡佛研究所的名誉研究员。", "1985年9月，蒂尔入读斯坦福大学时，里根已进入第二届总统任期，白宫里到处都是胡佛研究所的校友和研究员，包括以撰写那份促成里根经济学的政策备忘录而闻名的经济学家马丁·安德森。里根任命了至少30名安德森在斯坦福大学的同事担任政府要职，他认为是斯坦福大学“奠定的知识基础，使得华盛顿当下所发生的变化成为可能”，这是里根在白宫为这批人举行的招待会上说的。斯坦福大学被推测为未来里根总统图书馆的选址地，也是许多聪明绝顶的保守派人士接受权力职位培训的地方。", "对蒂尔来说，重要的是，斯坦福大学也是一所优中之优的顶尖大学。《美国新闻与世界报道》在两年前将该校名次排在了哈佛、耶鲁和普林斯顿之前。这地方应该完美地适合他。", "然而，蒂尔却发现斯坦福大学令他失望透顶，他从入学第一天起就不开心。他被分配到布兰纳宿舍，这是一座教会风格的建筑，住着147名大学一年级学生，距离主院有好几个街区。他和另外两名学生合住在240室：格雷格·劳登是个行进乐队极客，而克里斯·亚当森是个颇有抱负的喜剧创作者，那年春天亚当森还在一个平台上竞选学生会职位，而就是这个平台竟呼吁在全校范围内开展捉迷藏游戏，而校长必须在游戏中找到每一个注册的学生。他们对待蒂尔好像既嘲笑又惊奇。", "蒂尔原以为在这里可以好好读些经典好书，四周也应该是充满书卷气的宁静氛围。可谁承想，他在宿舍生活中看到的竟然全是荒唐愚蠢。斯坦福大学的各个宿舍楼里都有晒日光浴的场地，那里挤满了光着膀子的男生和穿着比基尼的女生，在本该上课学习的时间里，他们播放喧闹的音乐、喝酒、谈情说爱。不消说，这些蒂尔一样也没有参与，他似乎对交朋友真的不感兴趣。“在他看来，很多人（包括我）都极不正经。”当年同住在布兰纳宿舍的一个同学说道。", "每天清晨，蒂尔都从240室出来走到喷泉边，然后刻意作秀似地服用维生素，一粒接一粒，而且总是在同一时间，以相同的顺序，总是在两粒之间喝一口水。这一切好像就是要向同学们证明，他在各方面都比那些宿醉不醒的同龄人优秀。“搞得像某种仪式，”他的同学梅甘·马克斯韦尔说，“他就是一个特别奇怪的男生。”", "蒂尔以同样的强度来完成课业。他想要学到东西，更重要的是，他想要超越、支配他的同龄人。他早上8点离开宿舍，而且通常不到图书馆关门是不会回来的。1986年年初，圣诞节假期结束后，蒂尔打开了一个装着成绩单的信封，得知他的平均学分绩点为4.0，这一成绩将使他作为一年级拔尖的学生之一获得当年的校长奖。为了庆祝，他找到了他唯一认识的另一个平均学分绩点也是4.0的同学，并花了10分钟向对方论证为什么他的4.0更好，因为其中包含了更多他得了A+的课程。“一言以蔽之，这就是新生彼得！”一位同学回忆说。", "除了争最好的成绩，彼得只有两个爱好，至少在他的同学看来是这样，那就是国际象棋和政治。他是保守派，支持里根，反对1986年第四次当选的加利福尼亚州参议员艾伦·克兰斯顿，尽管这些观点使他在斯坦福大学显得相当传统守旧。里根刚刚以自1820年詹姆斯·门罗无对手选举以来最大的绝对优势胜选，而这个本科生班里也有不少颇有抱负的“威廉·F.巴克利”。", "这倒不是说蒂尔也花了很多时间和他们混在一起，至少一开始没有。大一的每个星期五下午，他都会开着他那辆旧的大众兔子汽车，驱车32千米回到福斯特城，与克劳斯、苏珊和已上初中的帕特里克一起在捕鲸人岛的小房子里过周末。蒂尔对社交缺乏兴趣，加上他刻意表现出的优越感和一本正经，这一切都使他成为同伴们嘲弄的对象。他的一群同学录制了一盘反映布兰纳宿舍狂欢作乐的搞笑录音带，其中出现蒂尔的地方只有几秒：只听有人傲慢地说了声“再见”，又“砰”的一声关上车门，发动车子开走了。“天哪，”其中一个录音带制作者说，“我们对他来说就是一群浑蛋。”", "还有一次，蒂尔在转述一个室友的话时爆粗口。对此，室友打印了一张纪念贴纸，并把它粘到了天花板上。贴纸上标着“1986年1月”，并注明“就在此地，彼得·蒂尔第一次说脏话”。这张纸在那儿贴了一整个学期，就好像高中同学在他父母家门前插上的“此屋出售”的牌子一样。整个宿舍楼里的人都被逗笑了，只有蒂尔除外，他没注意到，也没有人告诉他。5月，他收拾好行李准备离开宿舍时，才有人把那标志指给他看。", "他的一个室友说：“哥们儿，往上瞧！”他抬头看了看，一言不发地把桌子挪到那张贴纸下面，站上去将它一把撕了下来，然后离校去过暑假了。", "他的虚荣心使他容易受到更多的嘲弄，也容易被人家不露声色地操纵。有一回，他的几个同学搞鬼下套，假意挑战蒂尔，跟他们下所谓的“啤酒象棋”，其实是想骗他喝醉。规则是，每输一子，就得喝酒，但真实动机是想看彼得·蒂尔能否放松一两个小时。当然，蒂尔是国际象棋高手，不过，格雷格的水平也算过得去，他们以为他或许能在比赛中早早地拿下彼得足够多的棋子，让他们好好乐呵一晚上。蒂尔架不住他们一直挑战，喝了不少啤酒，但也轻松地赢了比赛。他一直都皱着眉头。", "对他的嘲弄与政治无关，至少一开始是如此，但蒂尔恰恰搞得像与政治有关似的。“他透过有色眼镜把自由主义者都看作对自己不好的人，”一位同学说，“在斯坦福大学人们那样对待他，造成的影响非常大。直到现在还影响着他。”他在高中时并不积极参与政治活动，但在斯坦福大学，他开始接受了一个新的身份——右翼煽动者。", "他开玩笑说要建立一个假的慈善机构——“和平自由派”，仅基于一个含糊其词的左翼事业议程来募集资金，然后除了付钱给他，根本不用拿这些钱去做任何事。至少有两次，他对同学说，他认为他们对种族隔离的担忧有些过头。", "在一次有关推动大学和公司停止与南非这个施行种族隔离的国家做生意的交谈中，他对梅甘·马克斯韦尔说：“这招儿管用。”当时，包括斯坦福大学在内的全美各高校的黑人学生会组织一直在举行静坐活动，鼓动投资者从南非撤资，而这些抗议活动让蒂尔感受到一点点针对个人的意味，因为他经常满是怀念地谈起自己在南非的童年。马克斯韦尔说，当他实事求是地解释说那个国家不应该按照美国学生的道德标准行事时，她着实大吃一惊，而且他在任何时候都没有承认过，作为黑人女性，马克斯韦尔有可能会把此话当成一种冒犯。“他说得那样心安理得，”马克斯韦尔回忆说，“这可能才是此事最诡异之处。”", "另一名非洲裔美国学生朱莉·利思科特—海姆斯对蒂尔支持种族隔离的立场提出疑问，一天晚上，她敲开240室的房门，要求他解释清楚。根据利思科特—海姆斯的描述，蒂尔一脸茫然地看着她，跟她说，南非制度性地拒绝给予黑人公民权从经济上说是正确的。任何道德问题都无关宏旨。有这么个说法，通常那些替这个种族隔离国家辩解的人都会拿它来说事，好像就是说南非要比邻国发达得多，那里的生活，即便是对那些被制度性地剥夺了权利的人而言，也要比其他地方（比如埃塞俄比亚和布隆迪）好得多。", "在之后的若干年里，在成为畅销书作家之前，利思科特—海姆斯曾就读于哈佛大学法学院，后在知名的科律律师事务所从事法律实践，并担任过斯坦福大学法学院院长。（她所著的《如何让孩子成年又成人》一书就是对所谓的“直升机式父母”的批评。）尽管如此，她照样在2016年写道，那一次打交道“对我来说就是如鲠在喉30年”。蒂尔的发言人回应说，蒂尔“不记得有陌生人询问过他对种族隔离的看法”，他也“从来没有支持过种族隔离”。", "蒂尔最终加入了“大学共和党”组织，并结识了安·兰德。他还与南非学者、神学家罗伯特·哈默顿—凯利以友相待，此人曾担任斯坦福大学教堂的教长和校内大型无教派教会的牧师，他认为该教会成员人数不断增加与“促成罗纳德·里根当选总统的力量一脉相承”。哈默顿—凯利在南非问题上持温和的态度，他反对种族隔离制度，但坦承自己感到有“矛盾心理”，赞成部分而非全面撤资。", "除了有共同的南非之根，蒂尔和这位牧师还有一些共同点，即他们都仰慕和迷恋校内另一位反传统者勒内·基拉尔，此人经常在学生宗教团体组织的活动中发表演讲。基拉尔是法国文学教授，虽然在斯坦福大学还算不上尽人皆知，但在法国可是赫赫有名的知识分子。他在校园里与众不同，因为他毫不掩饰地表达自己对宗教的虔诚，并把基督教作为其世界观的核心。", "基拉尔的一大观念是人们在自己的内心深处总是受相互模仿的欲望驱动，蒂尔将其内化并作为其投资和生活的指导原则。基拉尔争辩说，我们不要我们想要的东西是因为我们认定它们是好的，我们想要它们则是因为其他人也想要它们。这种“模仿欲望”是普遍的，导致嫉妒，进而引发暴力。历史上，各种社会曾使用替罪羊的方式，即将暴力冲动转向社区中某位无辜的成员，以疏导和控制这些情绪，为避免战争和大规模杀戮提供了一个发泄口。根据基拉尔的说法，俄狄浦斯、圣女贞德和玛丽·安托瓦内特都是替罪羊，但最重要的替罪羊是耶稣，他的牺牲确保了引领人类超越过去的嫉妒暴力。这些观点大多体现于文学作品当中，但对于那些觉得自己形单影只的人，对于那些有受害者情结的人，对于那些了解其福音书——塑造了本科生蒂尔的所有特质的人来说，这些观点不可否认地引起了共鸣。", "虽然蒂尔说他的成长经历是福音派的，但他似乎一直封存着自己的信仰。当时的朋友们都不记得他谈论过宗教，也不记得在学校的《圣经》学习小组中见过他。他冷静理性，给人的印象更像是一个有信仰的人，而不是无神论者。但基拉尔的发现似乎唤醒了蒂尔身上的某些新东西，如果不是一种对于个人热情的深刻感知，就是对宗教在其公众身份中发挥的作用的认识。做保守的基督徒，或许就是对他所鄙视的校园文化的一种挑衅。这对彼得·蒂尔来说极具吸引力。他后来把基拉尔描述成“一位对世界有着不同描述的、非常有趣的教授。这一点与时代极不合拍，故而它对有点儿叛逆的本科生有一种天然的吸引力”。", "他就是这样开始看待自己的：他不是一个彬彬有礼、骨瘦如柴的书呆子，而是一个叛逆的人。在斯坦福大学，他成了健身房的常客，身上绑着举重腰带，大汗淋漓，一边举铁健身一边滔滔不绝地谈论柏拉图。若不在健身房，那他一定在“咖啡屋”（其实就是该校学生会的别称），那里有一个摆满棋盘的房间。每到晚上，蒂尔都会到那儿去，在一张桌子旁与人捉对厮杀。", "当时玩的是闪电棋，也叫极速国际象棋，蒂尔会在那里一坐就是几个小时，连续下几十局5分钟棋，从这种极限烧脑的活动中汲取经验教训。在闪电棋中，诀窍就是尽可能地快速走棋，这不仅是为了节省自己的时间，也是为了限制对手在双方换手之间的思考能力，迫使他们在耗掉时间的同时直冒冷汗。由于这种动态，一开始看似要赢的棋局可能瞬间一败涂地。如果你落于下风，那基本上你唯一的希望就是装出一副笃定、果断的样子。快速且有目的地走棋，就好像你胸有成竹一般，即便你其实根本无计可施。让他们认为你知道自己要往哪儿走，并指望他们犯错。", "在他大学二年级的第一个学期，他和另外几个学生组成团队，在每星期二晚上组织一场俱乐部比赛，并开始努力宣传这支团队。虽然他们只吸纳了为数不多的选手，但把蒂尔推到了斯坦福大学国际象棋舞台的中心位置。", "精英象棋需要将头脑规划和直觉判断结合起来。你不仅要记住每个常见的开局，以及可能的攻防组合，还必须能够随着棋局的变化快速调整。蒂尔强在前者，而非后者，所以假若对手出其不意，他很容易就被打乱阵脚。正如另一名学生亚当·利夫所说，“他完全按照教科书的规则”，使用事先准备好的开局，尤其是鲁伊·洛佩斯开局，也叫西班牙开局，一上来就使出王兵，这是鲍比·费舍尔喜欢的战术。“在我看来，他完全是自学成才，很有竞争力，也喜欢攻击。”蒂尔的队友格里沙·科特利亚尔说。科特利亚尔毕业于莫斯科的国立石油天然气大学，并在一家州立国际象棋学院接受过训练，后到斯坦福大学读研究生。", "读大学三年级时，蒂尔和利夫（所有本科生里唯一排名比他高的）有时会在宿舍里摆开棋盘对弈，这便成了当晚整个宿舍楼的一大娱乐活动。“场面非常壮观。”利夫说。据利夫回忆，有一次，他还播放霍华德·琼斯的唱片做背景音乐。这期间，还听到了这位英国低吟男歌手1985年最火的那首《无人应受责备》。“你可以看到巅峰，但你无法企及/拼图已是最后一块，可你就是无法将它拼起，”琼斯悲伤地唱道，接着，吸引人的来了，“别怪，别怪，谁也别怪！”", "蒂尔的视线离开棋盘，他抬起头来。“这也太扯了吧，”他说，“总归有人要怪的。”在他们几千场比赛中，这是利夫记得的唯一一次蒂尔的注意力被分散。", "另一位国际象棋选手也分享了他对那个时代的蒂尔的美好回忆。大约在1988年春，国际象棋团队开车去蒙特雷参加一场比赛，蒂尔驾驶着那辆大众兔子车。他们走的是加利福尼亚州17号公路，一条穿越圣克鲁斯山脉的四车道高速公路，人称加利福尼亚最危险的公路之一。", "他们并不需要特别赶路，但蒂尔开车时就像着了魔。他像迈克尔·安德雷蒂一样过弯，在车道上左突右冲，超车时几乎追尾，而且好像大部分路段都在踩油门。不出所料，一辆加利福尼亚州公路巡警的车灯闪现在他的后视镜中。蒂尔被拦截到路边停车，交警问他知不知道自己开得有多快。坐在车里的年轻人一边为车被拦下而松了一口气，一边又害怕那个交警，他们紧张地面面相觑。", "“嗯，”蒂尔以他平静而稳重的男中音回答道，“我不确定限速是否有意义。”", "交警什么也没说。蒂尔接着说：“这可能是违反宪法的。这绝对是对自由的侵犯。”", "交警看了看蒂尔和车里的极客们，觉得为这件事浪费时间不值当。他告诉蒂尔减速行驶，并祝他愉快。当时坐在副驾驶位置上、现已50多岁的男子说：“对于那次国际象棋比赛，我什么都不记得了，但我永远不会忘记那次乘车经历。”", "这件事真正令人难忘的是，当蒂尔成功辩解并奇迹般地只得到口头警告就被放行后，蒂尔照样像之前一样重重地踩下油门。就好像他不但确信加利福尼亚州的法律奈何不了他，而且相信物理学定律也拿他没招儿似的。", "当不下国际象棋的时候，他就会被知识界的反叛者所吸引。大学二年级时，蒂尔结识了极具极客气质的计算机科学家、国际象棋高手巴尼·佩尔，从而接触到反熵主义，即认为技术的进步将使人类获得永生，应该使用人体冷冻法来冻结人体解剖后的大脑，以便将来再次激活它，或者将他们的思想上传到计算机里。", "与此同时，他和里德·霍夫曼也走得很近。他们虽在同一个班级，但直到大二第二学期（4—6月）才在一次题为“心灵、物质及意义”的哲学导论讲座上开始交谈。下课后，他们一起走出去，在院子里又聊了一个小时。“争论着生命、宇宙和一切。”蒂尔后来回忆道。", "霍夫曼在高中时也曾被人欺负，他在伯克利的一个激进活动分子家庭长大，曾就读于一所进步的新英格兰预科学校。他对蒂尔的宿舍极端主义有所耳闻，所以认为他是一个“自由意志主义的疯子”，这是他后来说的原话。但霍夫曼与蒂尔的室友不同，他对待蒂尔的保守主义是非常认真的。", "在之后的几年里，他俩一起度过了很多时间且相互仰慕，以至于决定联手造势竞选学生会职位。他们的平台是反官僚主义的：据他们了解，斯坦福大学的学生自治机构，官称“斯坦福大学学生联合会”，仅翻修办公室就花掉了大约8万美元。霍夫曼扮演着进步分子的角色，用这件事指摘斯坦福学联没有把预算花在改善学生生活上。蒂尔的论调则听起来更像典型的茶党人士，声称自己“极为反感”有些学生“帮朋友包装简历来获取学联官僚机构的职位”。", "他们都胜选了，但蒂尔进入这个左倾的机构却是有点儿奇怪。就在这场选举中，学生们以压倒性的票数通过了要求从南非撤资的决议，并否决了将里根图书馆建在校园里的计划。蒂尔欣然接受了他的反对派角色，但常常感到沮丧。在里根总统基金会宣布取消在斯坦福大学设立里根图书馆，转而选址南加州后，蒂尔发表了一场演讲，称斯坦福的自由派领袖们犯了一个严重的错误，结果他被轰下台来，他后来把这件事告诉了一位朋友。带着高中时输棋后时常表现出的沮丧，蒂尔走了出去。这位知情人士说，这一事件影响深刻。蒂尔认为斯坦福大学从根本上说就是一个充满敌意的地方。“很多同学对他很不友好。”这位朋友说。", "他在《斯坦福评论》上大肆抱怨了一通。《斯坦福评论》是一份八卦小报风格的月报，主要面向保守派读者，是蒂尔和一位高中时的朋友（斯坦福大学准新生）诺曼·布克在那年春天创立的。这是他第一次创业，将纳入后来主宰硅谷的那张庞大的人脉网的最初一批节点。1987年6月9日出版的创刊号的报头位置列有一份12人的名单，其中蒂尔任主编。这12个人都是男性，这种模式贯穿了蒂尔的整个职业生涯。", "创刊号的内容既有政治评论，也有校园新闻，包括一篇关于某班级赴萨尔瓦多旅行的头版报道，作者认为这篇报道向读者展示了一种对拉丁美洲政治“不平衡”的看法。有一篇涉及性的专栏讽刺文章《性变态者的自白》，讲述了一位选择独身的年轻异性恋男子的故事，还有一份“另类的”夏季读物清单。（可能有些奇怪的是，鉴于《斯坦福评论》对性的故作正经，布莱特·伊斯顿·埃利斯探索情欲的处女作《零下的激情》竟有资格与托尔金、T.H.怀特和埃德蒙·伯克的作品比肩入选。）“少数声音成功地主导了讨论，”蒂尔在编者按中写道，“他们的观点往往与斯坦福大学的主流观点截然不同。斯坦福大学社区中许多更为温和的学生保持沉默，认为他们说不说出自己的想法都没什么分别。”", "蒂尔对《斯坦福评论》的主要创新是将小众精英群体（保守的斯坦福大学本科生）的狭隘关切与国家主流政治联结起来。因此，这个左倾的学生组织收取的会费就成为税收与消费自由主义的缩微版本，即使涉及的金额微乎其微（每个学生每年可选择性地支付29美元）。因拟在斯坦福的“西方文化”课程中增加佐拉·尼尔·赫斯顿等非白人作家的作品，斯坦福大学一项关于课程设置的计划就此演变成“圣诞节之战”。《斯坦福评论》以“悬而未决的西方文化课”为题，刊发了专题封面报道，并附有大幅配图：一边是《圣经》、柏拉图和莎士比亚，另一边是隐约可见的大问号。", "《斯坦福评论》将用支持校园保守派的美国院际研究协会的拨款，以及借由自由主义正在斯坦福大学蔓延的警告而向校友们募集的捐款来维持运营。几年后，一封特别成功的筹款信提醒校友，斯坦福大学的一位教授正在教授一门关于黑人发型的课程，这意味着斯坦福大学实际上已经用关于卷发的讲座取代了传统的西方文化课。无论从何种角度看，这种说法都是假的，但不管怎样，捐款还是会滚滚而来。", "关于斯坦福大学核心课程的争论，最终引起了教育部长比尔·贝内特的注意，他在1988年春同意参加《斯坦福评论》主办的活动。之后，贝内特在美国公共电视网的《麦克尼尔/莱勒新闻一小时》节目上说，他的听众举着双手表示他们是被“吓到了”才去改变斯坦福的课程。斯坦福大学校长唐纳德·肯尼迪试图反驳，他准确地指出听众中都是被《斯坦福评论》诱导才做出如此反应的右翼学生。蒂尔在接受合众国际社、《华盛顿邮报》和《洛杉矶时报》的采访时为贝内特的话辩解。他对《华盛顿邮报》的采访者说：“有一方施加了相当大的压力。”那年夏天，他被贝内特的教育部录用为实习生。", "蒂尔毕业于1989年，但他并没有离开学校，而是在斯坦福大学法学院继续读书。他后来承认，自己并没有特别深入地考虑申请法学院的这个决定。他认为自己“仍旧还是做本科生时的模式，只想怎样才能拿到A，怎样才能在法学院入学考试中取得好成绩”。他说：“也许我被法学院吸引是因为它在某种程度上非常精准地按顺序排名。”", "但这不仅是为了自我超越。蒂尔现在有了一个对手，他想继续战斗。西方文化课的相关变化将于1989年秋生效，而那些佐拉·尼尔·赫斯顿的书是不可能控告自己的。在斯坦福大学的4年里，他逐渐认识到该校的多元文化自由主义格外卑劣，甚至还很危险。", "在斯坦福大学1989年的年鉴中，有一部分是专门纪念该校首个百年校庆的内容，其中包括学生事务主任迈克尔·杰克逊的档案照片。杰克逊是一名黑人，20世纪60年代在斯坦福大学读本科，后又回到母校担任大学行政管理人员。几年后，蒂尔专门就这幅画撰文，尤其着重于杰克逊个人风格的演变。“在杰克逊主任摄于1969年并被收入百年纪念年鉴的这张照片中，他是激进的时尚派，留着蓬乱的非洲头，穿着色彩艳丽的喇叭裤，”蒂尔这样写道，“现如今，大约过了20年后，这位主任衣冠楚楚地在校园里漫步，与学生们交谈，他的头发梳得一丝不苟，双排扣的西装也熨烫得整整齐齐。许多60年代的激进分子从未离开过校园，现在都当上了教授和老师。”", "蒂尔的观点似乎是，在斯坦福大学本科学位之外又拥有了马萨诸塞大学阿默斯特分校教育管理学博士学位的杰克逊主任，根本就是20世纪60年代决意要将斯坦福大学文化多元化的某种“潜伏”力量的一分子。蒂尔说，自由主义者也许看起来令人尊敬，但他们其实很危险。定义这种危险会消耗他几十年的时间。他认为斯坦福和其他精英大学并不是培养人才的机构，而是令人窒息和危险的权力结构的基本组成部分，是一种“就像500年前的天主教会一样腐败的”祭司体系。蒂尔最终会发现技术和金钱的诱惑，一旦他找到融入现实世界的路径，摧毁或取代这种祭司体系的意愿只会变得更加强烈。"], "wcount": 9679}, {"icon": "3", "title": "第3章 自由意志的世界观", "paras": ["1992年1月，《斯坦福评论》出版了一期特刊《现实世界》，专门讨论蒂尔特别感兴趣的话题——找工作。他在斯坦福大学的第七个年头已经过去一半，但他像是被封冻在时间里了。他是法律学院三年级生，却仍在与那些将Polo衫套穿的10多岁预科生一起打校园文化战争。他还在为《斯坦福评论》撰写“编辑来信”，尽管严格说来，他已经有两年半的时间没有担任编辑了，而且更准确地说，这是本科生的出版物。", "蒂尔在一篇编者按中写道：“在政治上不正确是一种解脱，因为这样一来，人们就不能被禁止去做那些有可能让校园思想警察失望的事情。”他的专栏名为“从政治正确到就业”，在此可以展开对其政治正确的同龄人另类的循规蹈矩的嘲讽。按照蒂尔的说法，优秀的自由主义者可以接受的工作选择是攻读人类学研究生、清点斑点猫头鹰的数量及“教人们如何使用避孕套”。", "蒂尔作为一个热爱里根的保守派，又就读于一所热爱里根的大学，当然会百思不得其解地发现，斯坦福竟然是一场恶毒的自由主义阴谋的中心，其目标就是全力攻击像他这样的人，而这至少有一部分肇始于其自身的不安全感。在21岁开始读法学院时，蒂尔仍然封闭自我，似乎对自身感到不舒服。他不跟别人约会，尽管可以在法律和政治问题上口若悬河，但他并不热情。多年后，他的同学们说，这就好像他要把自己的一切都与世界隔绝开似的。这不仅关乎他的性取向，而且似乎涉及人类大多数的正常情感和亲密关系，例如喜悦、友谊、愚蠢、愤怒、仇恨等。", "但蒂尔肯定也认为，这种在斯坦福受迫害的感觉是有用的，而且似乎还有意识地营造了这种感觉。保守主义的不满，特别是大学校园里的人所表达的不满，在20世纪80年代末90年代初都极有市场，其中打头阵的就是艾伦·布卢姆1987年出版的《美国精神的封闭》一书。布卢姆是芝加哥大学教授，也是新保守主义先驱列奥·斯特劳斯的门徒。他在书中抱怨学生们因为沉迷于摇滚乐而变得愚蠢，并将校园左派与20世纪30年代的希特勒青年团相提并论。", "当时，对评论家来说，称嬉皮士和纳粹一样思想封闭的观点似乎很聪明，而且出乎意料地吸引了厌恶反主流文化的那部分美国民众。布卢姆的书收获了评论家们的高度好评，在《纽约时报》畅销书排行榜上连续数月位居榜首，并帮助培养了整整一代抱怨自己的声音被左翼思想警察夺走的信徒。", "显然，这是一个矛盾，但似乎并没有困扰蒂尔或他的保守派同龄人。“这是一次大规模的普遍对话，”曾就读于斯坦福大学法学院并为非营利组织提供咨询的唐·奇鲁瓦说，“我们班上的保守派相当直言不讳。我还以为他们是爱发牢骚的宝宝呢。”另外，对像蒂尔这样的人来说，指责自由派同学可能是进入共和党精英圈最直接的途径。“他这是在趁火打劫，”当时任斯坦福大学招生负责人和讲师的乔恩·雷德说，他曾有一次在校园里就多元化问题与蒂尔进行面对面的公开辩论，“《斯坦福评论》中有时会出现明智的保守主义。但彼得不是，他要向政府扔石头。”", "所有这一切的典型代表是一个名叫迪内希·德索萨的年轻保守主义者，他比蒂尔大6岁，在20世纪80年代初，作为《达特茅斯评论》的创始编辑，在美国东海岸扮演了与蒂尔几乎相同的角色。《达特茅斯评论》成为《斯坦福评论》等创办于同一时代的同类校园出版物的模板，它的反动明目张胆，还充满无情的挑衅，往往还极为残酷。在德索萨担任编辑期间，《达特茅斯评论》还发表过一篇白人学生恶意模仿黑人的英语撰写的反平权运动的专栏文章、一篇对前三K党领袖大卫·杜克的采访录，以及一份机密的男同性恋学生团体的成员名单，其中有些人的名字没有披露。", "当蒂尔1985年入读斯坦福大学的时候，德索萨已经凭借自己尽情发挥的吸睛才能，在《展望》杂志觅得了一份编辑工作，这是一本由富有的保守派资助的、面向普林斯顿大学校友的右翼杂志。1987年，德索萨成为白宫政策顾问，与曾同在《达特茅斯评论》工作的校友劳拉·英格拉哈姆和彼得·鲁宾逊在白宫会合，这两个人后来还做过保守派电视评论员，在白宫担任演讲稿撰写人。", "为撰写涉及校园左翼偏狭态度的《非自由教育》一书（于1991年年初出版），德索萨进行了调研，其间他曾到访斯坦福大学，当时蒂尔还在法学院读二年级。该书获得主流媒体的好评，登上了畅销书排行榜，这些成功无疑影响了蒂尔，也有助于解释为什么《斯坦福评论》描述的斯坦福大学与其他亲历者记忆中的那所真实的大学如此不同。", "1987年年初，就在关于以新课程（即在《圣经》、柏拉图和莎士比亚之外增加非白人作家的作品内容）来取代旧课程的投票即将进行之前，民权活动家杰西·杰克逊出现在一个集会上。“嘿嘿，嗬嗬，”学生们齐声喊道，“西方文化必须滚出去。”他们指的是“西方文化”课程，但在他自己关于那个时代的书中，蒂尔声称学生抗议者“指的是西方本身，指的是西方的历史和成就，指的是西方的自由市场资本主义和立宪民主制度，指的是基督教和犹太教”。", "为了保守派读者的利益，蒂尔总是耸人听闻地炒作自己的在校时光，描述对杰西·杰克逊的示威场面并不是他唯一的方式。现实中，斯坦福大学并不是一个性泛滥的地方，本科生中就流传着一个笑话（精英大学里很常见的那种），调侃这些奋斗者太笨拙或太书呆子气，根本找不到情人。但是《斯坦福评论》把大学生的性生活描述得放纵不羁，给人的印象竟然是：去男厕所却没看到同性恋在苟且，是绝对不可能的；要是你从楼宇之间的空地穿过，却没有人硬塞给你一把免费的避孕套，那也是绝对不可能的。", "斯坦福大学发放避孕套是有充分理由的。艾滋病在旧金山湾区肆虐，估计已经有4%的人感染了艾滋病。在男同性恋中，这一比例被认为接近50%。到1988年，旧金山死于艾滋病的人数超过了20世纪所有战争中死亡人数的总和。专家们警告说，旧金山可能会出现劳动力短缺和内乱。《斯坦福评论》对此的反应是哈哈大笑和摇动手指。“如果这一疾病的传播如此令人担忧，为什么主流媒体不主张禁欲呢？”一位专栏作家这样问道。他将同性恋描述为一种上瘾，这位专栏作家写道，男同性恋进行过“不自然的性行为”，“多次屈服于诱惑，欲火在他们体内燃烧，使他们确实难以控制自己”。", "“当时普遍存在‘恐同’情绪，”梅甘·马克斯韦尔说，“但《斯坦福评论》对此的评价很尖刻。”对《斯坦福评论》而言，恐同不是一种需要克服的偏见，而是一种自由主义的阴谋。蒂尔的报纸指出，真正的灾难是“恐同恐惧症”，即害怕被贴上恐同者的标签。在1992年的一篇专栏文章中，后来在多家蒂尔的公司工作的时任主编内森·林建议，反同性恋偏见应该被更名为“厌女—鸡奸”（miso sodomy），即对肛交的憎恶，以关注这种“越轨的性行为”。", "20世纪90年代初，所有这些都与职业生涯不相容——至少是与蒂尔憧憬的那种职业生涯不相容。当时跟他相熟的朋友说，蒂尔认为自己是巴克利式的人物，或者也有可能是未来的最高法院大法官。", "他也想要钱。在《从政治正确到就业》专栏中，他抱怨说，斯坦福大学的校友中仅有四分之一是百万富翁。他称赞这一阶层是斯坦福大学保守主义的伟大传统，可以追溯到戴维·斯塔尔·乔丹和赫伯特·胡佛，认为他们在道德上优于自由主义群体。“正是这些人支付了本国大部分的政府转移支付项目，并帮忙资助了像我们这样的大学，”蒂尔说，“贪婪并不像迈克尔·道格拉斯扮演的戈登·盖柯在电影《华尔街》里夸耀的那样好，但比他所知道的自由主义者的普遍情绪——嫉妒要好。”", "蒂尔认为，他将以声望很高的助理开启自己的职业生涯，供职于顶级律师事务所，年薪数百万美元，以及在那之后收获无尽的荣耀。在法学院时，他结识了最高法院大法官安东尼·肯尼迪的儿子格雷戈里·肯尼迪，成为《法律评论》的编辑，并加入了联邦主义者协会。他还继续培养他能发现的最保守的大学生，尤其是比他小两岁的基思·拉布瓦，此人在很多方面堪称他的缩影。", "拉布瓦也是一名有抱负的律师，和蒂尔一样，本科毕业后即入读斯坦福大学法学院。他也自我封闭。蒂尔的一位朋友说，《斯坦福评论》在这些年里是“如此男同化”，这既奇怪又完全在预料之中，都是拜该报对同性恋问题所做的牢骚太盛的报道所赐。然而，在个人气质上，蒂尔和拉布瓦又截然不同。拉布瓦比他的导师更外向一些，他甚至是一个学生兄弟会的成员，他也没有一丁点儿蒂尔那样的冷静。他是《斯坦福评论》的驻报写手，他的专栏文章通常包含一系列侮辱性嘲讽，主要针对校园内的不同群体，包括少数族裔、文科生、同性恋、女权主义者、《斯坦福日报》的员工及斯坦福大学的行政管理人员，此外也会夹杂一些体育方面的内容。", "1992年3月，在蒂尔发表了他关于就业前景的编者按一个月后，当时还是法律专业一年级学生的拉布瓦决定把他的恶意攻击延展到《斯坦福评论》的版面之外。几年前，他在兄弟会里的一个哥们儿的兄弟被赶出了大学宿舍，因为那个人用不敬的言语描述了一个同性恋宿管助理。现在，当结束了一晚上的社交活动，并从这座涉事的奥特罗公寓楼走过时，拉布瓦决定挑明立场。他站在奥特罗公寓楼的宿管指导员丹尼斯·马蒂斯的家门外，反复喊叫着那个词。", "“鬼基佬！”拉布瓦扯着嗓门喊着，“你会死于艾滋病的。你会得到报应的！你会得到报应的！该死的鬼基佬！”在这番长时间的叫骂中，他还时不时地加上一句挑衅的奚落：“看你们能不能把我也赶出宿舍！”", "马蒂斯是一名讲师，他教授名著典籍课程，据大家所知，他并不是同性恋。当时他还没有回来，但学生们报告了这起事件，《斯坦福日报》报道称，此事可能涉嫌违反学校禁止仇恨言论的规定。拉布瓦坚称自己没有做错任何事，并表示他特意校准了自己的羞辱方式，以避免与相关规定发生冲突。他对《斯坦福日报》表示，他的那些评论是被允许的，因为主要是说同性恋总体上是不好的，并没有特别针对马蒂斯。他说自己之所以发飙，就是想要抗议校园内相关的言论规定。“我可是法学院一年级学生，”他自负地说，“知道什么能说，什么不能说。”他在随后的信中写道：“我并非完全讨厌同性恋，但我认为他们不应该当教师。”", "可想而知，校方的反应是有多么严厉。拉布瓦说的没错，大声喊叫反同性恋的话语并不违反斯坦福大学的政策，但这可挡不住斯坦福大学行政管理人员公开谴责他的行为。有一份新闻稿不仅历数了他的言论，还附上了迈克尔·杰克逊校长的反驳，称拉布瓦的情绪爆发是“幼稚且野蛮的”。他所在的兄弟会也出面道歉，法学院的学生则在社交场合回避他。“他是个不受欢迎的人！”一位学生说道。", "这件事及其后果与德索萨在书中描写的如出一辙，这本书是前一年在美国密歇根大学出版的《非自由教育》，在这本书中，发表恐同言论的学生被迫公开道歉，在德索萨看来，这是一场悲剧。拉布瓦才不会这么做，他离开了斯坦福大学，轻松地考入哈佛大学法学院，随后在联邦政府担任助理，并在一家知名的律师事务所谋得一份工作。但在之后的几年里，蒂尔将这件事描述为一种迫害，其利用此事的手法与德索萨利用密歇根案的套路几乎如出一辙。", "《斯坦福评论》虽然没有直接为拉布瓦的言论辩护，但其指责杰克逊发出那篇新闻稿，并将针对拉布瓦言论的口诛笔伐视为“政治正确”的疯狂行为。当《斯坦福评论》的一位前作者写了一封批评拉布瓦的信时，另一位专栏作者就发表了一篇回应，指责写信人是在提倡“一种生活方式，其中常常包括多个性伴侣、匿名的厕所性行为、吃下身体排泄物、施虐受虐狂、恋童癖和虐待沙鼠”。", "在拉布瓦发飙骂人两天后，《斯坦福评论》发表了《性侵问题》一文。在此文中，与蒂尔关系密切的另一位保守派本科生戴维·萨克斯为斯图尔特·托马斯进行了一番慷慨激昂的辩护。托马斯是斯坦福大学的大四学生，他对依法认定他性侵一名一年级学生没有提出抗辩，于是他能否拿到毕业证就成了问题。萨克斯认为托马斯值得同情，也应该获得学位，因为所谓法定性侵就是个“狗屁”罪名，简直就是“性革命前的甲壳纲动物留在书本上的道德指令”，而且至少根据他的说法，受害者并没有反抗。为了说明这一点，萨克斯对此事进行了生动的描述，指出17岁的受害者“仍然具备进行口交的身体协调能力”且“想必可以说出‘不要’这个词”。", "在看起来比较轻松的话题上，编辑们还为那些希望避免卷入女权主义政治迫害的男性提供了一本指南，书中插入了一个融合在纳粹万字符上的女性气质符号。“女权纳粹将此定义扩大化，于是所有的男人现在都成了性侵者。”迈克·纽曼抱怨说，他建议《斯坦福评论》的读者远离斯坦福大学的女性，反正她们中很多人都“太丑”了。相反，他们应该把自己的情爱之意投向当地专科学院的女性，“这些女性忙于秘书职业的培训，才没有那个时间去看贝蒂·弗里丹的作品”。拉布瓦也为该报撰写了一篇专栏文章，他与另一位合著者开玩笑说，萨帕塔公寓楼就是托马斯欺负那位比他小的女生的地方，也许那里有“解决一年级新生无性恋困扰的办法”。", "今天，关于蒂尔时代的《斯坦福评论》并没有完整的档案记录。与提供在线档案（包括自1892年以来的每一期的扫描件）的《斯坦福日报》不同，凡是1999年之前在《斯坦福评论》上发表的内容，都只能到斯坦福大学图书馆的一个特殊区域才能阅读，那里存放着斯坦福大学的记录档案和珍本书籍。要阅读这些资料，你必须事先提出查阅申请，签署一份冗长的警告不得复印任何资料的协议，然后在一堆破损的纸箱中翻检这些旧时报纸，它们完全不按时间顺序存放，甚至还有几期不见了踪影。多年来，斯坦福大学的校园里一直有传闻说丢失的那些都是为保护蒂尔的声誉而故意从档案中删除的。但是，考虑到仍有尚待发现的东西，这些传闻也就无关紧要了。", "2019年年底，我用了一整天来翻阅这些旧报纸，其间不断被惊得目瞪口呆，因为在其后的几十年里，这些作者竟然设法积聚了如此强大的力量，却没有受到任何明显的冲击。但也有个例外：2018年被提名为联邦法官的联邦检察官瑞安·邦兹1995年发表在《斯坦福评论》上的一篇专栏文章浮出水面后，特朗普政府就把他的名字从候选名单中删除了。在这篇专栏文章中，邦兹抱怨校园多元化举措“更进一步助长限制意识、加剧不宽容及文化认同上的对号入座，其影响远甚于纳粹焚书”。以特朗普政府的标准来看，这是令人反感的，但并不比拉布瓦的所作所为更极端。", "蒂尔原谅了这一切吗？多少有点儿吧。他似乎对拉布瓦的上蹿下跳感到尴尬，他自己永远也不可能干出那样的事，但他也发现这么干挺管用。他一直告诉朋友们，保守派的一个问题就是，他们对自己的社团过于保守。他的一位同学、《斯坦福评论》的前工作人员说，在蒂尔的心中，他认为主流自由主义者已经接受了共产主义，但保守派无法让自己与极右翼成员握手言和。“他真希望右翼变得更像左翼，”此人说道，“他们会说，虽然我不认同这个观念超前的人，但我们可以一起做事。”这位前工作人员认为，正是这样一种“核心”思路，促成了蒂尔在25年后对特朗普的全力支持。", "蒂尔本人没有卷入这场争斗，而是朝着自己的职业目标努力。他会时不时地参加一些社交活动，但活动主题几乎都是严肃的，如案例法、政治学、政治哲学等。从法学院毕业后，他直接成为设在亚特兰大的美国第十一巡回上诉法院法官詹姆斯·拉里·埃德蒙森的助理。1992—1993年，蒂尔一直住在布鲁克黑文北郊的一套公寓里。埃德蒙森和蒂尔一样，也是雄心勃勃的保守派，当年作为年轻的律师，在里根提名他为法官之前，他曾主持里根在亚特兰大郊区的竞选活动。", "联邦法律助理通常不像有抱负的法学院学生或第一年参加工作的公司律师那样玩儿命，所以蒂尔为自己创造了一点儿额外的强度。他的一位同事告诉我，每次他去看蒂尔时，他的厨房桌子上都堆着一摞书。“他说他需要充实自己，”这位知情人士说，“所以他正在重读《尤利西斯》。”", "蒂尔在现实世界的经历始于第二年秋天，当时他搬到纽约，开始在大名鼎鼎的苏利文·克伦威尔律师事务所担任第一年的助理。蒂尔在现实世界中的经历并不像他在大学校园里想象的无政治正确地带那么光彩夺目。他曾经把律所想象成一个充满正义的行业；事实上，这是一种折磨。在现实世界中实践的法律有着斯坦福大学那种赤裸裸、卑微的雄心壮志，但没有那种令人愉快的自以为是。这里没有自由主义者需要对抗，有的只是如流水般的青年男女，分散在一个个耳熟能详的顶级精英律所中，人人拥有近乎完美的成绩，同样近乎完美的法学院入学考试分数，同样愿意每周工作80个小时，而不管执行的任务多么无聊。蒂尔没有明显的过人之处，就好像他无足轻重似的。", "蒂尔告诉一个朋友，作为一名公司律师，他觉得自己就像一个齿轮、一个公务员，没有希望对任何事情产生任何影响。从某种意义上说，能成功地找到一个好搭档还是令人兴奋的，但这个目标感觉也没有任何真正的意义。如果他对自己诚实，他就会变得沮丧。“我认为，许多传统的竞争方式导致太多的人去做传统的事情，”几年后他这样说，“于是你就会陷入激烈的竞争，然后即使你赢了，也不太值得。你也许会得到一份薪水稍高的工作，但你不得不出卖自己的灵魂。听起来这桩买卖无论在经济上还是在道德上都不划算。”", "法官助理的任期结束后，蒂尔本以为自己会顺理成章地走向成为世界一流年轻律师的下一步：担任最高法院的法律助理。他接受了大法官安东尼·肯尼迪（他的朋友格雷格的父亲）和安东宁·斯卡利亚对他的面试，觉得自己发挥得很好。但在1994年春，正当他还在律师事务所苦苦打拼时，他收到了求职拒绝信。“我崩溃了。”他后来说，并把接下来的那段时间描述为“四分之一人生的危机”。他突然意识到，他的律师生涯到此结束了。七个月零三天之后，他走出了苏利文·克伦威尔律师事务所，而这期间他一直在数日子（这本身就不是什么好兆头）。", "他在纽约又待了一年左右，在瑞士信贷金融产品公司找到一份衍生品交易员的工作，但他在那里也很不开心、很沮丧，工作中的大部分时间都在走过场。要是以前的同事还记得的话，那对他的印象也就是彬彬有礼但印象不深。“他就是个无名小卒。”一个人说。", "蒂尔在瑞士信贷短暂任职期间学习了商业知识——至少他的同事是这么认为的。事实上，他已在谋划，他打算搬回到旧金山湾区。他想出版一本讲述他在斯坦福大学经历的书。他非常怀念宿舍里的辩论，很想再回去和朋友们好好唇枪舌剑一番。他还想要钱，他每年挣10万美元，却不知为什么还是觉得自己很穷。如果他留下来，就算有他那样的血统和才华，也还得10年甚至更长时间，他才有可能掌管一些事情。所以他又辞职了，这一次他告诉同事，他要回加利福尼亚创办一家对冲基金。他们礼貌地点了点头。前文提到的那位银行前同事说：“比他级别高的交易员都在背后耻笑他，就好像在说‘真是个白痴！’”", "在纽约，蒂尔很难交到朋友。他后来抱怨说，在苏利文·克伦威尔律师事务所，似乎没有人彼此喜欢，甚至在他们不写备忘录或起草合同时，彼此之间也好像无话可说。杰克·雷南是蒂尔在纽约的室友，他是房地产商之子，比蒂尔早几年在斯坦福大学读书。他在汉普顿斯度过了一个悲惨的周末，但也就仅此而已。他似乎没有过任何形式的约会生活，这一定使他感到痛苦，但也可能是当时负责任的选择。纽约的同性恋群体比世界其他地方都大，也更活跃，当然也是艾滋病病毒活跃的热点地区。", "当蒂尔将自己完全隔绝于社交之外时，他一直在写一部把拉布瓦的恐同情绪爆发描绘成殉道的书稿，尽管拉布瓦其实并没有受到斯坦福大学的惩罚，还和蒂尔一样取得了传统意义上的成功。但不管怎样，在蒂尔的笔下，斯坦福大学决定评论拉布瓦的言论是不合情理的，尽管这些言论是作为言论自由噱头的一部分公开发表的。用如今的话来说，拉布瓦被取消了（即某人因其言论或行为违反了一些社会规范，而不再受到支持）。专门讨论他的案例的那一章题为“欢迎来到塞勒姆”，拉布瓦作为“该书采访过的多元文化主义受害者之一，无私地分享了自己的独特见解”，故而在致谢中得到了特别感谢。", "虽然《多元神话——校园的多元文化主义和政治不宽容》一书只做了有限的尝试来捍卫言论的实质，但它将蒂尔和合著者戴维·萨克斯对同性恋权利的信念展露无遗：", "有一种模糊的不安感、一种不祥的预感，认为“容忍”和“接受”（通常理解为“你别管我，我也不管你”）不足以满足一些更好斗的同性恋活动家。许多同性恋维权运动似乎超出了公共教育或公民意识所需要的范围，看起来更像是刻意要让普通公众感到震惊。许多美国人都想知道，如果同性恋仅仅是想和其他人一样被宽容，那么他们为什么还要想尽办法，不仅把自己定义为寻求自由生活的个体，而且把自己定义为要求赔偿的一群特殊的受害者。", "当然，蒂尔认为自己是受压迫的不是因为他是同性恋，而是因为他是一个白人、保守派、非政治正确人士。“他有一种受害者的核心心态。”《斯坦福评论》的一位前同事说。在网上社区出现的几十年前，这些自封的“非自愿独身者”通常是右翼男性，他们将自己糟糕的约会前景归咎于不断变化的道德观念。而《多元神话》一书指出，大学校园里存在一种“对约会场景的公开敌意”。用蒂尔和萨克斯的话说，这种敌意正在毁掉年轻人的浪漫前景。", "尤其是，蒂尔和萨克斯指责自由派在性侵犯问题上的主张过度，他们说，如此一来“调情”就被重新定义为“性侵”，让他们认为正常的性行为变得不再可能。他们写道：“当口头施压意味着胁迫，而胁迫意味着性侵，那么性侵的数量就会和事后反悔的调情的数量一样多。”2016年，在蒂尔向特朗普竞选团队捐款后，这段文字出现在各种专栏文章中，表明他似乎和特朗普一样对性侵漠不关心，于是蒂尔做出道歉，萨克斯也表示道歉。蒂尔在一份声明中说：“我希望我从来没有写过这些东西。”然而，第二年，据称在《斯坦福评论》的一次活动上，他告诉一名学生编辑，道歉不过是做做样子，蒂尔说：“有时你得跟他们说些他们想听的。”", "与此同时，按照《多元神话》的说法，同性恋享受着所有的乐趣。蒂尔和萨克斯还在这本书中抱怨：“尽管对那些想要正常使用公共卫生间的人产生了不良影响，但斯坦福大学未能封死许多公共卫生间中的‘寻欢洞’。”当然，这很容易被用作心理学分析。一些认识蒂尔的人很有说服力地推测，蒂尔在20世纪90年代中期的恐同症是一种自我厌恶的表达。但《多元神话》的煽动性特质很可能只是蒂尔一门心思想要有所成就的产物。蒂尔想要成名，他当然明白，应届毕业生们的前景会因力挺一个在精英大学校园里高喊“去死吧，鬼基佬”的人而备受关注。保守派的媒体会接受的。", "《多元神话》于1995年由独立研究所出版。独立研究所是旧金山湾区的保守派智库，该智库聘请蒂尔为研究员，给他开少量的工资并为他提供了一个推广自己想法的平台。从那年秋天开始，他和萨克斯在《华尔街日报》上发表了一系列专栏文章，首篇题为“快乐的土著人民日”，这篇文章针对大学校园里与“反西方”节日挂钩的新多元文化主义进行了轻蔑的调查。斯坦福大学校长格哈德·卡斯珀和教务长康多莉扎·赖斯给《纽约时报》写了一封信，称他们的文章“妖言惑众”。由此，双方开始针锋相对。", "致力于培养“反知识分子”的保守派非营利组织约翰·M.奥林基金会，以及德索萨的《非自由教育》一书的资金提供者，曾向独立研究所提供4万美元，以资助其宣传推广《多元神话》。蒂尔充分利用了这一点。这本书得到了德索萨的支持，当然支持者还有勒内·基拉尔、《旗帜周刊》的威廉·克里斯托尔、《美国观察者》的埃米特·蒂勒尔及时任国会众议员克里斯托弗·考克斯。（考克斯后来在乔治·W.布什总统任期内担任美国证券交易委员会主席。）《国家评论》、《华盛顿时报》和10多家地方报纸都刊登了专栏文章，帕特·罗伯逊的《700俱乐部》节目及右翼广播电台也有所提及。《多元神话》是由青年美国基金会和美国院际研究协会共同推广，蒂尔本人也参与其中，他站在学生会前面，守着一大摞书向路过的人分发。准确地说，这还算不上名人效应，但蒂尔是如此喜欢这种反应，以至于想在他和大学老友、自由主义者里德·霍夫曼合办的政治脱口秀节目中也充分利用，遂于1996年在湾区公共频道短暂播放。（想象一下：双雄斗智，但肯定更加自负。）", "当然，蒂尔可不只是想在知识界功成名就，他还想成为富人，这似乎是一个遥不可及的目标。1995年重回旧金山湾区后，蒂尔曾短暂地和父母住在一起。之后，他和室友合住在离圣马特奥市高速公路很近的一间低矮的公寓里，吃饭就订中餐外卖，需要发泄情绪时就到帕洛阿尔托城里去下象棋。", "就这样，1996年的一天，他和另一位前法律助理走进了斯坦福法律图书馆，开始研究如何创建对冲基金。他聘请野心勃勃的保守派、《斯坦福评论》的总编辑杰夫·吉西亚担任自己的助理，并在沙山路上租了一个衣帽间大小的办公室，作为该基金的通信地址。", "随后的一年里，蒂尔忙着从朋友、朋友的家人及任何他能找到的人那里筹集足够的资金。表面上看，这或许并没有那么高大上，他的那些瑞士信贷的前同事，以及苏利文·克伦威尔律师事务所的那些充满野心的初级律师同事肯定也都不怎么看好，但是蒂尔并不在乎，他选择拒绝那些曾经拒绝过他的人，并决心不把自己未能获得最高法院法律助理一职视为失败，反而视为一种幸运。自视清高的东海岸当权派可能不想要他。这也没问题。一位当时与他关系密切的朋友说：“在纽约的经历并没有让他感到自卑，他已经准备好接手一切。”", "在这方面，蒂尔并不是独一无二的。此时此刻，硅谷满是成就卓著的年轻人，他们对自己的天赋深信不疑，并决心不懈地努力致富，而硅谷也刚刚开始回馈他们。蒂尔当时还不清楚这一点，但对于不劳而获的自信，从来没有比这更好的天时地利了。"], "wcount": 10177}, {"icon": "4", "title": "第4章 找到自己的“黄金极客”：转战科创投资", "paras": ["“黄金极客”是《时代》周刊在其1996年2月的一篇封面报道中对他们的称呼，他们便是美国工商业新时代的先驱。这些年轻的科技企业家积累的财富规模甚至超过了铁路和钢铁巨头。历史学家艾伦·布林克利在接受《时代》周刊采访时表示：“在世纪之交，确实有很多人穷尽一生由身家平平而致巨富。但这与今天的这些人完全不同，他们前一天身家还只有几十万美元，第二天公司一上市，就转瞬成为亿万富翁。”", "极端富有并不是唯一令美国最具影响力的周刊编辑们印象深刻的东西。他们不仅比强盗大亨们还有钱，而且这些年轻的科创者更酷。《时代》周刊称：“这些新贵并没有在纽波特、棕榈滩或阿斯彭建造品位堪忧的豪宅，他们仍住在两居室的公寓里，还穿着T恤和牛仔裤。”这种低调看起来是真诚的。如今的超级富豪们是自由企业家的典范，但有一点除外：他们似乎对金钱不那么感兴趣。“有人告诉我们，这是一个新的‘镀金时代’，却没有任何那个时代的负罪感。”", "过去，如《时代》周刊所说的，首次公开募股一直是贪婪的银行家们试图将劣质证券兜售给普通投资者的粗略尝试。但现在，它已经成为一种平等主义的东西，不仅让高管和银行家发财，也使持有股票期权的底层员工致富。《时代》周刊称，那种激动是如此深入人心，以至于有可能打破传统的党派之争。保守派和自由派对此意见统一：硅谷企业家是“理想的经济代理人”。", "“黄金极客”最初的典型是马克·安德森。年仅24岁的他就以安坐在红天鹅绒宝座上的形象登上了杂志封面。他光着脚，一副狂野的、张着嘴的表情，似乎混合了惊奇与好斗的情绪。读者了解到，安德森发明了第一个商用网络浏览器——网景浏览器，它将互联网带入了主流。", "1993年，马克·安德森还是伊利诺伊大学厄巴纳—香槟分校的学生，在大学附属的实验室工作，时薪为6.85美元，他帮助开发了一款早期浏览器——马赛克浏览器。由于当时网络上无钱可赚，实验室便把马赛克浏览器提供给搞学术的人免费使用，他们几乎就是唯一使用互联网的人。安德森明白，互联网其实可以成为一个巨大的产业，于是他创造了对使用者更友好的网景浏览器，并以每份50美元的价格出售。", "安德森的每一步都恰好踩在了点儿上。随着计算机拥有率的爆发式增长，几乎每家大公司和诸多小公司都开始使用网络。报纸和杂志媒体开始在网上发布文章，餐馆菜单逐渐数字化，目录零售商开始接受电子订单。到1994年，网景浏览器已无处不在，第二年，该公司上市了，银行家们最初计划将发行价定为每股28美元。然而，开盘时股票价格直接翻了一番还多。数小时之后，安德森的净资产就飙升至5 800万美元。", "与此同时，蒂尔一直在努力维持自己的地位。在帕洛阿尔托，他似乎是唯一一个没打算在科技领域发大财的人，他的老把戏也有点儿快要绷不住了。文化斗士们在20世纪80年代和90年代初表现不错。1992年，比尔·克林顿因批评撤资活动人士兼说唱歌手修女索尔佳而与杰西·杰克逊决裂，并轻松赢得了总统大选。接着，在1993年，他敦促美国人：“现在已经到了别再为你认为的政治正确担心的时候了。”蒂尔和他的同伴们赢得了这场争论，但这意味着到《多元神话》1996年出版时，这本书似乎已不再那么具有挑战性。在短暂的火爆过后，人们对《多元神话》的兴趣迅速消退，甚至在蒂尔的母校也不例外。正如一位专栏作家所说，蒂尔的抱怨都是“斯坦福大学近10年前的文化阶段”的产物。", "蒂尔打算利用他在政治上的名声，将自己打造成一个严肃的宏观投资者，即那种专门对全球经济大波动下注的基金经理，而这些大波动往往与政治密切相关。他曾与萨克斯在《华尔街日报》上共同发表了一篇评论文章，将民主党的预算挥霍与同一时期亚洲经济的失败联系起来，并在《旧金山纪事报》上发表了另一篇文章，利用莫妮卡·莱温斯基的丑闻事件大谈互联网的破坏性力量。但几乎没有人注意到这些专栏文章，而且由于没有以往的投资记录，蒂尔艰难地为自己的基金筹集初始资金，起初只是从朋友和家人那里东拼西凑了100万美元左右。为了增强吸引力，蒂尔承诺拿出一部分绩效奖金分给投资者，而这些奖金通常都是基金经理留给自己的。", "蒂尔作为投资者的表现，至少一开始并不令人看好。在纳斯达克指数上涨40%、旧金山半岛所有的餐馆和酒吧几乎全靠银行家的公司信用卡撑起的一年里，蒂尔却把投资者的钱赔在了外汇交易上。", "因此，1998年，随着互联网的蓬勃发展，蒂尔决定从对冲基金投资转向这个当时最热门的领域——他会找到自己的“黄金极客”。", "事实证明，科创投资者比马克·安德森等人干得更好。虽然《时代》周刊几乎忽略了他，但安德森在网景浏览器上的联合创始人吉姆·克拉克发展得更成功，是他聘请安德森创办了这家公司，提供了初始资金，并安排从风险投资家那里筹集资金。为此，克拉克最终在网景上市时获得了约6亿美元的股票，是安德森收入的10倍。", "克拉克并不符合当时的文化原型：他已经不是20多岁的人，不再写代码，也不是那种住着两居室公寓的人。他用从网景赚来的钱买了一艘约46米长的游艇，带遥控驾驶功能，而且最终花费1.25亿美元与第三任妻子离了婚。蒂尔将以克拉克（而非安德森）为榜样，去开创自己职业生涯的新阶段，在某些方面，甚至是开创他的人生。蒂尔既不是一个理想主义的技术迷，也不是《时代》周刊上那种穿着破洞牛仔裤、一心只想造出酷炫产品的硅谷企业家，他是这些人背后的投资者。因此，在1998年一个令人汗流浃背的夏日，他在斯坦福大学弗雷德里克·E.特曼工程中心的教室里，试图和一个局促却才华横溢的程序员聊天。", "马克斯·列夫琴当时23岁，刚从伊利诺伊大学毕业，获得了计算机专业学士学位，比安德森略晚几年。在某些方面，他比安德森更加令人印象深刻。在苏联解体前几年，列夫琴出生在乌克兰的一个犹太家庭。他的父母买不起电脑，所以列夫琴学会了用纸和笔编程。1991年，随父母移民到美国后，他自学了英语，而且大部分英语是通过观看电视剧集《细路仔》学到的。", "在伊利诺伊大学厄巴纳—香槟分校，他对密码学产生了兴趣。密码学是一门制造和破译密码的科学，这是一个神秘的领域，对任何希望建立安全运行的互联网服务的人来说，都是至关重要的。列夫琴确信，他注定会创办一家公司，这意味着他必须尽快搬到旧金山湾区。列夫琴后来回忆说：“我毕业那会儿，如果你是计算机专业的优等生，你一定会到帕洛阿尔托去找最便宜的公寓。”", "列夫琴口中最便宜的公寓就是睡在朋友家的地板上。但在此之前，他的朋友斯科特·巴尼斯特已经卖掉了一家小微公司，转型成为一名投资者；因为房间没有空调，所以为了熬过那个夏天，列夫琴不得不花很多时间在斯坦福大学校内旁听客座讲座。他常常只是摸到某个教室的后面，假装感兴趣几分钟，然后就打起瞌睡，享受凉爽的冷气。当他刚坐下来听一位才从斯坦福毕业的学生谈论外汇交易时，他或多或少也还是这么打算的，他隐约听过那人的名字。他是这间教室里的六位听众之一。", "出于道义，他一直没有睡觉，在这么小的房间里打瞌睡似乎有些奇怪。当蒂尔结束他的演讲后，列夫琴做了自我介绍。他告诉蒂尔，他们有个共同的朋友——企业家卢克·诺塞克。诺塞克创办了一家公司，而蒂尔当时正好资助了这家公司，列夫琴说自己也想创办一家公司。蒂尔似乎随着话题的转变而轻松了许多，他俩一起走出教室去停车场。分手前，蒂尔说对列夫琴说：“我们一起吃个早饭吧。”", "“好啊。”列夫琴应声道。", "“明天怎么样？”蒂尔问。", "第二天早上，他们在斯坦福大学校园南部的一家小餐馆见了面。蒂尔啜饮着一份浆果香蕉奶昔，列夫琴则谈到他对“掌上电脑”的迷恋，这种掌上电脑对极客来说具有一定的吸引力。他自学了在这种数字规划器上编程，数字规划器有点儿像苹果手机的原型，上面有应用程序，用户可以写备忘录、设定约会提醒，以及“神奇中的神奇”——远程发送信息。这个过程很笨拙：你必须买一个特殊的调制解调器，接在设备的终端，把整个华夫饼烘烤模具大小的设备插到一个电话插孔上，然后忍受拨号调制解调器传输数据时嘈杂且缓慢的过程。但列夫琴认为这简直太棒了。", "“总有一天，”列夫琴对蒂尔说，“人人都会在工作中使用这些东西。”", "列夫琴说，但掌上电脑有一个问题，它没有内置的安全系统，这使得它实际上对企业毫无用处。作为密码学者，列夫琴认为解决方案就是建立一个加密网络，使掌上电脑可与大公司运行的大型计算机系统进行通信。蒂尔目不转睛地看着列夫琴。", "“太棒了，”蒂尔说，“我想投资。”", "不到24小时，蒂尔就同意为列夫琴的构想投入25万美元，这就像是在快速下注，把宝押在一位完全没有经验的创始人身上，而蒂尔后来也因此而出名。列夫琴将公司命名为F ieldlink，因为他的构想就是将分散于工作点（即现场）的PalmPilot（掌上电脑）与公司系统连接起来。这个想法远远超前于它的时代：掌上电脑还需要10年才能在企业环境中普及，企业系统和个人设备之间的安全通信问题直到21世纪10年代中期才会被广泛认识。但从其他方面来说，列夫琴和蒂尔的合伙人关系还有其他好处。", "在1998年年底与蒂尔和列夫琴会面后，斯坦福大学计算机学教授马丁·赫尔曼签约担任Fieldlink的顾问，条件是获取少量股权。赫尔曼以发明构成网上银行和电子商务基础的加密技术而闻名。“5分钟后，我就明白了，列夫琴比大多数密码学博士懂得都多，”赫尔曼说，“他如饥似渴。”", "蒂尔和列夫琴认为，他们需要一个与赫尔曼一样有信誉的人，来说服像微软这样的商业软件大供应商与他们合作。但是大的软件公司几乎对他们的询问不理不睬，几个月之后，他们转向了列夫琴加密技术的新用途，这种加密技术不需要任何大型软件公司的许可，也不需要任何中介机构。", "当年早些时候，美国手持设备制造商Palm公司宣布其最新设备Palm III不仅将配备2兆字节的内存（这在当时是巨大的），还将配备一个红外发射器，类似常见于车库门遥控器中的那种。这个功能可以用来在设备之间发送数据，比如联系人信息，而无须拨号。自1998年年底开始，列夫琴和蒂尔试验使用同样的技术发送借据的想法，一旦PalmPilot连接到数据坞，借据就可以与银行账户相联。他们将Fieldlink更名为“康菲尼迪”（Conf inity），这是列夫琴为了表达“无限的自信”而发明的新词，并任命蒂尔担任首席执行官。", "列夫琴的技术应用窄得离谱，当时只有超级书呆子才用Palm Pilot，但蒂尔仍然认为这个基本理念具有潜在的颠覆性。列夫琴后来并没有发明新的借据，而是发明了一种新货币。一旦你在掌上电脑上安装了康菲尼迪的支付应用程序（可从朋友的手持设备上下载），你就可以用数字借据而不是美元来购物。", "他们将这种转账服务称为PayPal，但从最开始，蒂尔就明白它可能不仅是一种聪明的兑现支票的方式。在亚洲、俄罗斯、中南美洲等地的金融危机期间，担心恶性通货膨胀的国民未能将资金转换成美元存入外国银行。而有了PayPal，他们要做的就是在他们的PalmPilot上操作，它也就变成一个口袋大小的瑞士银行账户。蒂尔曾向记者夸耀说，如果该计划得以实施，政府将无法调控经济，这将导致“民族国家的衰落”。", "对留意他这番说辞的人来说，这句话的含义深远，当然，也有引发动乱之嫌。蒂尔想让所有人都能拥有匿名的外国银行账户，但这样的账户也被偷税者、洗钱者、军火交易商和其他国际罪犯所使用。按照蒂尔的逻辑，政府将无法阻止各种灰市和黑市的交易，而这些交易的费用将成为PayPal的收入。这是蒂尔在《斯坦福评论》时期所发表的疯狂论点的现实版。忘掉打倒道德沦丧的大学管理者吧，PayPal现在有潜力打倒政府。20年后，比特币的狂热者们也用类似的逻辑来追求同样的目标。", "蒂尔毫不掩饰自己的革命性抱负，直率地与早期员工和投资者交流解释。1999年7月，这些投资者在一次新闻发布会上用PalmPilot转账给蒂尔300万美元，这是他们给该公司的投资。“纸币是一种古老的技术。”同年晚些时候蒂尔在一次会议上这样解释道，他认为PayPal完全可以成为“支付领域的微软”。但这只是个开始，因为纸币也是政府实施控制的一种手段。“当然，我们所说的对美国用户而言的‘便利’对发展中世界来说将是革命性的。”他继续说道，政府“利用通货膨胀，有时还利用大规模货币贬值……来夺走其公民的财富”。PayPal会让这一切变得不可能。", "蒂尔将这种自由意志主义的精神推行于大大小小的各个方面。在PayPal，员工可以随意在全体会议上迟到，只要每迟到1分钟支付1美元就行。尼尔·斯蒂芬森的新赛博朋克流惊悚小说《编码宝典》几乎成了必读书目，当然还有《阿特拉斯耸耸肩》。斯蒂芬森的书主要讲述了一群企业家，他们是第二次世界大战的密码破译者的后代，他们建立了一个秘密的离岸“数据避风港”，以保护加密的网上银行系统免受独裁政府的干预。", "大多数（但并非全部的）早期雇员认为自己是自由意志主义者，包括列夫琴，他在苏联成长的经历使他对大多数形式的权威持怀疑态度。最终，蒂尔雇用了许多他在斯坦福大学就读时期《斯坦福评论》的编辑，包括基思·拉布瓦、戴维·萨克斯、内森·林、诺曼·布克、戴维·华莱士，以及6名年轻的《斯坦福评论》前员工，包括保罗·马丁、肯·豪厄里和埃里克·杰克逊。列夫琴带来了几个他以前在伊利诺伊大学厄巴纳—香槟分校的同学，包括诺塞克、潘宇和拉塞尔·西蒙斯。", "康菲尼迪在帕洛阿尔托闹市区的一家文具店和一家法式面包店的楼上租了第一间办公室。没过多久，这20来个年轻人就被堆得齐腰高的油腻腻的比萨盒包围了，四周还有成堆的空可乐罐。“那里看起来就像科技联谊会会场。”马丁说。他大学三年级时在《斯坦福评论》工作，曾经来拜访这家公司，后来干脆退学并全职加入了这家公司。PayPal的员工年龄都不超过35岁，大多数人也就20岁出头。“经验被视为污点，”另一位早期员工托德·皮尔逊说，“如果他们发现你有工商管理硕士学位，可能会炒了你。”", "除了年轻，PayPal的另一个特点是其员工基本上是白人男性。这位《多元神话》的作者充分利用了他对多元文化主义的厌恶。在早期，PayPal没有聘用女性，也没有一个黑人员工。多年后，列夫琴吹嘘自己拒绝了一个使用“hoops”（篮框）来代替“basketball”（篮球）这个词的求职者。他说：“没有一个PayPal人会使用‘hoops’这个词。也许甚至没有人知道怎么打‘hoops’。说‘basketball’就够糟的了，更不用说‘hoops’了！那家伙显然不适合这里。”", "列夫琴后来说，他对多样性的看法是短视的，但在当时，对PayPal的招聘方式感到不舒服的只有那些担心蒂尔是在招自己的跟班儿的人。“我过去觉得这是个错误，因为一个在周报工作的人怎么会懂得技术支持呢？”赫尔曼说，“但彼得很聪明，他能雇到那些视他为领袖而不与他作对的人。”", "硅谷引以为豪的是其精英管理方式，以及它能聘用超级聪明的怪人和书呆子，而不管他们是什么性格类型的人。这包括照顾困难员工的需求，只要这些人有生产力。埃里克·施密特在《重新定义公司：谷歌是如何运营的》一书中说：“只要人们能想出与著名女歌唱家合作的方法，而且著名女歌唱家的成就超过了她们以著名女歌唱家的方式所造成的附带伤害，你就应该为她们而战。”但是除了能力，蒂尔看重的还有忠诚和同质性。他后来写道，也许并没意识到这可能会被误解为有偏见，“我们都是那种一模一样的书呆子”。", "除了看似随意的文化测试，例如“你会打乒乓球吗”，蒂尔还拿当时在华尔街很常见的脑筋急转弯题目来测试新员工。他会目不转睛地盯着一个年轻人说：“你有一张圆桌，还有无限提供的25美分硬币。你和一个竞争对手轮流在桌子上放置一枚硬币，硬币不能重叠。最后那位放好25美分硬币却没有碰到其他硬币的人就是获胜者。你是先放还是后放？”解决方法是：要先放，并把硬币精准地置于桌子的正中央，接着就完全模仿对手的动作即可。那些回答正确的人将被要求集中精力于摧毁PayPal的众多竞争对手。", "在过去20年里，你只要在硅谷待上几天，就会有一种被空投进了一场秘密革命的感觉。从外表看，帕洛阿尔托和介于圣何塞和旧金山之间的半岛的其他地区跟图森或塔尔萨的郊区一样，到处遍布着小房子、单排商业街和办公园区。但随后你会走到一家帕尼拉面包店或万怡酒店的自助早餐厅，只消瞥一眼某人笔记本电脑上的演示，就能看到要么是3D打印房屋的规划图——这种房屋价格低廉，可以终结无家可归的窘况，又或者是实验室人造肉的分子结构。", "那些准备抑或接受演示的企业家和金融家一定会兴高采烈地谈论如何推翻他们称之为“纸张地带”的旧秩序。他们指的是纽约、洛杉矶和华盛顿特区，他们相信这些地方总有一天会步弗林特、伊利和扬斯敦的后尘。而且，当你想象着你的生命在你的面前延展1 000年，而且完全摆脱了无知、疾病和不便时，你真的很难不这样想：“谢天谢地！”（总算摆脱了！）即使你来自那些正在衰亡的地方。", "但稍微多走走看看，你就会注意到两件事：首先，实际上大多数的初创公司起步时并没有那么雄心勃勃，他们大多试图选取旧经济中的一些体量很小但可期利润丰厚的部分，在互联网上做营销（例如20世纪90年代中期的亚马逊网上售书、21世纪初的谷歌广告业务，以及21世纪10年代以优步为代表的网约车业务）。其次，这些自由思考者往往并不是特别具有独创性。他们几乎全都是斯坦福大学、加州大学伯克利分校、加州理工学院、哈佛大学、麻省理工学院这五所高校的毕业生，而且都得到了同一拨风险投资公司的支持。众所周知，风险投资公司言必称颠覆和发明，但其实它们经常支持当下最流行的东西。", "在硅谷，在20世纪90年代和21世纪初科技繁荣的鼎盛时期，支付显然是下一个将被征服的市场角落。互联网的发展已经覆盖数以亿计的人，他们在线阅读新闻、发送信息和浏览色情内容，但尚未利用这种新媒体来周转资金。硅谷的企业家们开发出许多不同的选项，包括PayMe、Ecount和eMoneyMail这样的纯支付公司，像Flooz这样的在线礼品卡公司，以及像Beenz这样基于积分的数字货币公司。（不知何因，当时美国最聪明的人都对字母z情有独钟。）每家大型零售和金融公司都有数字支付部门。亚马逊的支付服务叫作Accept.com，雅虎有一家被称为PayDirect的公司，易贝也有了跟PayPal叫板的自家的新武器Billpoint。", "市场上提供几近相同服务的竞争对手简直太多了，以至于PayPal甚至都不是其所在楼宇中的唯一一家此类型的公司。1999年年初，但凡要去位于大学大道394号的蒂尔办公室，就得从一家小文具店旁边的门道进入。往里面有一段楼梯，上去就是二楼的楼梯平台。这儿一边是蒂尔和列夫琴正在建立的公司，另一边是一家名为X.com的公司，创始人是一位在各方面都和彼得·蒂尔一样野心勃勃的企业家——埃隆·马斯克。", "马斯克17岁时离开了位于南非比勒陀利亚的家，经由加拿大来到硅谷。和蒂尔一样，他也通过了斯坦福大学的招生考核，并于1995年，即蒂尔回到加利福尼亚的这一年，以研究生的身份入学。他原本打算在斯坦福攻读物理学博士学位，但后来放弃了，转而创办了Zip2公司，这是一个商业目录网站，相当于纸质黄页的线上版本。马斯克几乎从一开始就与他的投资者意见不和，他想把Zip2打造成一个目标网站，像雅虎一样，风投资本却想与媒体公司合作。1996年，他们聘用了一位专业人士担任首席执行官，取代了马斯克，并最终解雇了担任董事长的马斯克。马斯克内心受到了伤害，但财务方面的回报还算不错，1999年年初，当公司被以大约3亿美元的价格卖给康柏时，他拿回了2 200万美元。", "尽管马斯克和蒂尔有相似之处，但两人在气质上截然相反。马斯克天生好斗且有点愚笨，有一种热情洋溢的富有青少年气息的幽默感。相比之下，即使在密友之间，蒂尔也会流露出遮遮掩掩的神秘感，马斯克却从不会刻意修饰自己。蒂尔倾向于从限制风险的角度考虑问题，马斯克则总是孤注一掷。卖掉Zip2后，他花了100万美元买了一辆迈凯伦F1，然后将余下的大部分钱投入了X公司，该公司不仅提供电子支付服务，还提供支票账户、股票交易和X.com共同基金。", "马斯克的愿望就是，凡是从朋友那里收钱的用户都可以把钱留在自己的账户里，慢慢地再把钱转到网上银行。有条新闻标题宣称，“高新科技的‘IT新人物’：埃隆·马斯克准备成就硅谷的下一个大事件”。1999年年中，凭借一个演示网站，马斯克从红杉资本的迈克尔·莫里茨领导的一群投资者那里筹集到2 500万美元。对蒂尔和PayPal来说，这是个不好的消息。莫里茨是硅谷最受尊敬的风险投资人之一，因为是他投资了雅虎及突然崛起的搜索引擎谷歌。", "一如既往，马斯克花X公司的钱花得潇洒大方。新注册的用户只要开通账户就可以直接获得20美元。然后，该服务鼓励用户添加朋友的电子邮件地址并邀请他们也来使用该平台，用户每推荐一人，平台奖励10美元。马斯克选择无视大多数既定的银行业惯例。金融机构历来被要求通过查验身份证明来核实客户的真实身份——这种做法被称为“充分了解你的客户”。如果金融机构未能向政府报告客户的不当行为，他们可能会因此被追究责任。如果有人走进银行，把600美元扔在柜台上，要求以“米老鼠”的名字开一个支票账户，出纳员不应该只是微笑着将钱接过来。马斯克不熟悉正常的银行业惯例，他创建了一家允许这种事情发生的公司。1999年年底，他向哥伦比亚广播公司新闻频道吹嘘，在X公司获得信用额度比注册一个电子邮件账户还要容易。“你只要填写相关的表格，两分钟就能搞定，然后就可以进入你的账户，而且资金瞬时就能到账。”马斯克说。", "当然，没有什么能阻止使用X网站的客户在注册账户时谎报自己的身份和住址信息，他们一直都是这样做的。每天，邮差都会停在大学大道394号，将一大包X公司寄给客户的信件再投递回来，这些信件都是送达假地址后被退回给寄件人的。由于不知道该怎么办，X公司的一名员工购买了一个保险箱，把这类信件都塞了进去。", "X公司为其大多数客户提供支票账户，因此能够收到他们邮件的客户有时就会马上开出一系列空头支票，以从中获利。一位专门负责处理欺诈行为的早期员工说：“我当时就想，我这到底是进了什么公司？根本就没有适当的风险缓解措施。”当员工们告诉马斯克“与X公司合作处理支票账户的银行抱怨收到空头支票”时，他似乎对此完全没有概念，马斯克说：“我真不明白，要是账户里没有钱，为什么还要开支票呢？”", "马斯克和他的员工不知道，二楼楼道对面的工程师们也在进行数字化资金转账，只不过是通过PalmPilot。他们只知道这家公司的门上有一块牌子，上面写着“康菲尼迪”。“我们不知道他们在做什么，他们也不知道我们在做什么，”一位X公司的前员工说，“直到他们在垃圾桶里找到了一份商业计划书。”", "X公司和康菲尼迪在大楼后面的巷子里共用一个垃圾桶。后来，康菲尼迪的工程师们向X公司的员工们吹嘘说，他们发现了描述X公司的网络支付和客户扩流方案的文件，并将之整合进了PayPal的总体战略中。这件事发生在康菲尼迪在394号的办公空间不足而搬到大学大道的另一头之后。虽然马斯克对这一说法表示怀疑，但与我交谈过的X公司员工们却挺当回事的。“我敢肯定这99.9%是真的！”其中一位说道。马斯克则表示：“我想有这可能，不过有点儿像在说‘你窃取了我的登月构想’。”", "无论如何，那年秋天，蒂尔和列夫琴转而关注X公司的商业模式。11月，他们还创建了一个粗糙的互联网页面，模仿掌上电脑的转账服务功能。之后一个月，他们又从高盛集团和科技孵化器创新实验室获得了2 300万美元的风险投资，同时，聘请在《星际迷航》中饰演斯科蒂的演员詹姆斯·杜汉出席一场首发式，给一群幸运的客户送钱，他说：“在我的整个职业生涯中，我一直在传送人，但这是我第一次能传送金钱！”斯科蒂在新闻发布会上说。", "这个笑话在蒂尔的“和平自由党”老笑话中不起作用，但PayPal最终撞上了成功的受众：易贝平台的卖家。当时，为在线上拍卖中购得的东西付款的主要方式就是到邮局购买一张汇票，然后把它寄给卖家，卖家还得拿着它到银行去兑换成现金。“这也太离谱了，”易贝的一位高管说，“卖个东西竟然需要几个星期。”", "为了加快购物交易速度，列夫琴编写了一个自动软件程序，可以自动给卖家发送信息，表示有买家要购买他们的物品，条件就是卖家要接受PayPal。如果PayPal在竞拍中获胜，它将把拍得的物品捐赠给红十字会，这是好事，因为这个计划有点儿上不了台面（更不用说还违反了易贝的服务条款）。列夫琴并不是想要赢得竞拍，他只是试图让卖家注册一个PayPal账户。", "PayPal进一步加速了自己的增长，其方法就是利用X公司的主动进攻策略，即付给每位新用户10美元，若成功介绍了新用户则每介绍一位用户再给10美元。为了让这一做法更加诱人，PayPal允许用户立即提现，这些钱可以以支票的形式寄给他们，或者以退款的形式直接转入他们的信用卡账户。这么做成本很高，PayPal每增加一个新用户平均要支出20美元。", "这样很快就积累了很多用户。卢克·诺塞克是列夫琴和蒂尔共同的朋友，现在是PayPal的营销主管。他开发了一个应用程序，用它来追踪新注册账户的数量。它以标注为“世界支配指数”的小方框的形式出现在员工的电脑显示器上。每当有新用户加入，计数器显示的数量增加时，应用程序就会播放敲钟的声音。", "整个11月，PayPal的用户不过几千人。到次年1月时，世界支配指数上升到10万，仅仅3个月后，这个数字已达100万。即使在硅谷，这也是前所未有的增长速度，但这意味着至此PayPal筹集的2 800万美元中约2 000万美元已成为客户介绍费。早期员工们纷纷讲述，每当走进公司，看到一夜之间新增成千上万的用户，内心便感到敬畏和恐惧。", "PayPal通过一种比X公司所追求的更极端的监管套利形式加速了增长。X公司至少还注册为银行，PayPal却连这个也懒得做。在收集用户信息或阻止他们将钱用于非法目的方面，PayPal几乎没有做出任何明显的努力，而且至少在一些员工看来，它这是在公然蔑视银行业的规则。事实上，PayPal用来返还给用户现金的信用卡退款机制被信用卡公司在技术上禁止了。第二年，当这些公司抱怨时，PayPal只是简单地道歉了事。“他们说：‘你们他妈的在干吗？’”皮尔逊回忆道，“我们则说：‘我们正试图利用你们不可思议的系统来为支付提供便利。’然后我们就谈判，我们已经这样做很多次了。”", "当然，有这么一片领地，这种公然的侵犯行为在那里被视为合法，甚至值得庆贺，这就是蒂尔和许多PayPal高管都非常熟悉的领地：激进的保守派政治。《斯坦福评论》关于“黑头发”危险的筹款邮件是直接从理查德·维格里的剧本中抄袭而来的。理查德·维格里是著名的支持戈德华特和里根的反叛保守主义的筹款人。维格里运营着美国青年争取自由组织，该组织曾向《斯坦福评论》和其他保守派大学校园刊物提供资助，并通过在众议院书记官办公室抄写记录建立了一份筹款名单。他想要一份所有已经向戈德华特捐款的人的姓名和地址清单，然而复印相关记录涉嫌违法，所以他就带着一帮秘书走进众议院书记官办公室，直接手抄那些记录，最后形成了一个邮件地址列表。他将它卖给了右翼激进组织及亚拉巴马州的种族隔离主义者乔治·华莱士。", "维格里和他在华盛顿政界的崇拜者几十年来一直将此事作为保守派勇气的例子反复提及，事实上，据说迪内希·德索萨也曾在《达特茅斯评论》中如法炮制。当然，任何一位硅谷企业家现在都会用另一个名称来形容这种手段：求增长的黑客行为。如今，使用不可持续的或道德上存疑的手段来启动一家初创公司已被广泛接受，甚至在某些科技圈子里还备受推崇，甚至被普遍认为滥觞于蒂尔和他的同僚们在PayPal开发的“增长黑客”。", "但在当时，竞争对手们对他的公司的做法极为不满。PayPal不计后果地花钱，允许通过它的系统进行交易，而这在普通银行是绝对不可能被允许的，而且在没有遵守许多基本规则的情况下就与用户签约。从本质上讲，蒂尔向他们传达的信息就是，要把关注的目光投向世界支配指数，权当它是记分牌。有记者注意到，其他许多在线支付公司选择遵守联邦银行的规定，例如，在允许用户支付前要求其提供社会安全号码并核实其地址，蒂尔却说他们是“脑子不正常吧”，并暗指这就是它们增长缓慢的原因。当记者提示PayPal也应该这么做时，蒂尔耸了耸肩说：“没有人清楚银行到底应该是什么样，根本就没有明确的标准。”就算PayPal违反了法律，现在也不是道歉的时候，更不是循规蹈矩的时候。繁荣开始了。"], "wcount": 11526}, {"icon": "5", "title": "第5章 风险投资", "paras": ["时至2000年年初，在硅谷的企业家、投资者和工程师中，普遍的前景就是有“无限的机会”。股票市场如火如荼，纳斯达克指数在过去两年中增长了200%，10亿美元级别的公司横空出世。“很难形容当时的疯狂程度，”X.com的投资人、风险投资家迈克尔·莫里茨说，“在那些公司里，每个人都很年轻，一天工作24小时，吃得也非常差。所有这些全都碰撞在一起，造成了一场令人不安的情感混乱。有些人非常自信，相信自己所向披靡，有些人则认为自己会失去一切。”", "这是新千年的肇始，但似乎完全没有那种感觉。阿尔·戈尔似乎已为克林顿的第三届总统任期做好准备，“千年虫”问题（即人们担心计算机编码日期发生故障会导致全球网络崩溃，进而引发一场末日灾难）则被证明是危言耸听。千禧时刻如期而至，但什么也没有发生。", "2000年1月，PayPal又融资2 300万美元，火爆一时。每天都有大约9 000名用户加入，其中大部分是易贝的买家和卖家，他们都要求兑现那10美元的新人费，继而再推荐一些新用户，以充分利用每介绍一名新用户奖励10美元的政策。因此，用户数量增长达到了硅谷历史上前所未有的水平，甚至可能达到世界历史上前所未有的水平。蒂尔向《华尔街日报》吹嘘说：“这比得感冒还容易，而且扩散得就像病毒一样迅疾。”该报指出，投资者根据用户数量多少来评估在线金融服务公司，这意味着仅在开放此服务几个月后，PayPal的价值就达到了1亿~10亿美元之间，虽然这只是假设PayPal在某种情况下至少还是能够赚到一些钱的。", "对科技公司来说，寻求收入的飞速增长，同时承受一定的亏损，即著名的曲棍球杆形模式，这是很典型的做法。从长远来看，这可能行得通，因为随着亏损公司不断发展，它可以利用规模经济，其亏损也会缩小。公司只要保持增长，最终就能够盈利。但PayPal并没有遵循这一套路，因为与它之前成立的大多数快速增长的初创公司不同，PayPal没有任何收入，它的服务是免费的。蒂尔曾正式告知投资者和公众，该公司计划通过收取用户留在系统中的现金利息来赚钱。银行将这些现金称为浮款。不幸的是，几乎没有人在PayPal里面存钱。", "更糟糕的是，系统中仅有的那一点点钱都来自PayPal本身。2000年2月，它每天都要支付10万美元的奖励金，而这只是为了吸引新用户注册。一旦用户开始使用PayPal付款购买商品，该公司的损失就会更大。信用卡处理机构收取高达3%的所谓交换费，这意味着一笔100美元的“免费”交易也要PayPal支付3美元。人们转付的钱越多，PayPal的损失就越大。假如PayPal用户实施欺诈，盗用别人的信用卡，然后在PayPal上进行交易支付（这种情况似乎越来越有规律地出现，尽管还没有人能确定到底有多频繁），那么信用卡发行商通常会迫使PayPal赔偿被盗付的金额，如此便使PayPal的损失雪上加霜。", "所有这一切的结果就是，PayPal越接近于替代金融系统，它在财务上就越不成功。由于一直在密切关注该公司的发展，易贝高层管理人员对这种战略感到困惑不解。他们将Billpoint的使用限制在顶级卖家，以阻隔系统中可能出现的可疑人物，防止欺诈行为的发生。同时，PayPal似乎没有采取任何措施来确保自己的运营有利可图，或者遵守银行业的规章制度。“他们可真是花了一大笔钱呢！”易贝的一位高管告诉我。", "有一个办法可以摆脱这一困境，也就是说，既然PayPal能够搞得这么大，那其他竞争对手也就维持不下去了。如果PayPal一家独大，就没有人还会想用Billpoint付账；一旦出现这种情况，PayPal就会垄断整个市场，并且很容易就能找到为其服务收费的方法。这一手法在互联网公司中非常普遍，甚至还围绕它形成了具体的完整理念，但在当时，蒂尔甚至不确定这是否奏效。他认为，还是真金白银地套现比较好，也可将PayPal的损失转嫁他人。", "他的一位同事说：“他似乎害怕失去这项业务。”把PayPal卖给一个更大的收购者的想法一直贯穿PayPal历史的大部分时间，并成为蒂尔与其投资者之间紧张关系的根源。他请大学时的朋友、当时的副手之一里德·霍夫曼试着把PayPal兜售给潜在的收购者，很多公司都接到了霍夫曼的电话。处理在线信用卡交易的威瑞信公司刚刚推出了针对PayPal的竞品服务，似乎对此交易持开放态度，雅虎也是如此。但在谈判即将进行时，埃隆·马斯克半路杀了出来，他听说了这笔可能达成的交易，并担心如果PayPal成为雅虎的一部分，那X公司就会被挤出市场。2000年2月，他找到了蒂尔，并安排与他在大学大道上的一家餐厅见面。", "合并的逻辑无可拒绝。PayPal和X公司的用户规模大致相同——各有20万人，市场份额大致相同——各占易贝支付额的50%。两家公司都在亏损，合并后的公司在2000年第一季度的亏损约为2 500万美元。马斯克认为，如果能够合并，他们生存的概率会更大，而且就算有朝一日政府要打击新的数字支付技术，他们一起与联邦监管机构打交道也能更容易些。", "马斯克和蒂尔达成协议，两家以50%对50%进行合并。但X公司拥有更知名的投资者和一位著名的创始人，故正式成为收购方。后来，“康菲尼迪”这个名字被取消，PayPal也成为X.com金融服务部门的一部分。马斯克独自创办了X公司，因此拥有更多股权，他成为该公司的董事长和最大股东。两个月后，他任命自己为首席执行官。", "这种合作关系对投资者来说很有吸引力，那年春天，他们又向合并后的公司投入了1亿美元的风险投资，但事实证明这种关系在个人层面上很尴尬。或许并不令人意外，埃隆·马斯克和彼得·蒂尔相处得不太好。一天，当蒂尔坐着马斯克价值100万美元的迈凯伦去红杉资本和迈克尔·莫里茨开会时，埃隆为了炫耀汽车的加速性能，撞到了沙丘路的路堤上。撞击后的迈凯伦飞了出去，完全报废了。他们离开汽车残骸时，马斯克告诉蒂尔：“我读过很多这种故事，说有人赚了钱，买了跑车，然后就撞车了。但我知道这种事永远不会发生在我身上，所以没有投保。”", "这件事令蒂尔感到震惊，他开始认为马斯克做事莽撞；马斯克则认为蒂尔就是喜欢赚钱，只把技术当作赚钱的工具。“我不是说我俩是油和水——不相容，但的确存在相当大的分歧，”多年后马斯克告诉我，他的评价更加谨慎全面，但也令人沮丧，“彼得喜欢搞点儿投资的小把戏，就好像我们都在下棋一样。我不介意，但我从根本上还是喜欢做工程和设计。我不是一个投资玩家，我觉得用别人的钱一点儿也不酷。”一个和这两人都分别谈到过对方的人则说得更加直白：“马斯克认为蒂尔是个反社会者，而蒂尔认为马斯克是个善于欺诈、好吹牛的人。”", "这些感觉自上而下地蔓延开来，一些曾经的康菲尼迪的员工认为，马斯克和他们的老板一样自大、爱哗众取宠。他们对被迫放弃公司名称感到愤懑。PayPal现在被称作“PayPal by X.com”，这个拗口的名字似乎就是照顾到马斯克的自负。他们怀念蒂尔的低调。PayPal的营销经理、《斯坦福评论》前编辑保罗·马丁说，马斯克完全不适合这家公司。“埃隆给人的印象是，他最了解情况，你最好按他说的做。而彼得给人的印象是你才最清楚情况。”", "但蒂尔给马斯克设了一个陷阱。虽然马斯克成了首席执行官，但蒂尔的副手们，包括霍夫曼、列夫琴、萨克斯等人，大部分成了高管。X公司的前高管被边缘化了，马斯克身边的团队对蒂尔比对他更忠诚。", "崩盘来得如此之快，以至于大多数硅谷人都没有意识到它已经发生了。纳斯达克指数在3月达到顶峰，当时，蒂尔和马斯克正在完成PayPal的合并和1亿美元的投资。几周后，在4月初，一名联邦法官裁定微软违反了美国反垄断法，这增加了政府将其拆分的可能性。微软的股价下跌了15%，纳斯达克指数也下挫了350点，跌幅达到了8%，创下了有史以来的最大跌幅。", "当时，人们很容易将这一切当成一种反常现象，此种市场调整更多的与比尔·盖茨有关，而不是与向尚未完全成熟的网络公司注入的愚蠢资金有关。但11天后的星期五，也就是4月14日，纳斯达克指数再次下跌350点。该指数当周跌幅达25%，使得这次的突然调整比1987年的黑色星期一崩盘还要糟糕。即便如此，对科创股持乐观态度的人仍能将这些亏损视为获利回吐、税务筹划或市场已经触底的迹象。美国金融服务公司坎托·菲茨杰拉德的一位分析师对美国有线电视新闻网表示：“现在是该乐观的时候了。”PayPal这样的初创公司在银行里仍有资金，人们普遍有一种感觉（尽管不那么现实）：没有理由惊慌失措，信息革命还会继续。虚拟货币初创公司Beenz从拉里·埃利森等人那里又筹集了5 100万美元，用于重塑金融体系。2000年8月，英国《卫报》援引伟大的自由主义经济学家弗里德里希·哈耶克的话报道说：“Flooz有机会实现哈耶克关于‘企业向政府挑战货币发行权’的梦想。”这两家公司年底之前都不会遇到大麻烦。", "事实上，在第一批互联网公司资金告罄之前，几乎没有人注意到这一次崩盘。Pets.com突然宣布破产，开张仪式也变得越来越少，科创者开始紧张地查看一个新的恶搞新闻网站——FuckedCompany.com。", "但是，蒂尔已经注意到了。其实，几乎就在他刚刚筹集到1亿美元，并且泡沫就要破灭之前，他消失了。他不再来办公室，也切断了与员工和董事会的定期联系。他告诉几个同事他在巴西，其他人则听说他在下棋。那年春天，莫里茨打电话请求他回来，蒂尔回绝了。接着在5月，蒂尔发了一封形式上的备忘录邮件，标题显得冷淡无情：“执行副总裁辞呈”。", "蒂尔告诉员工，他已经“筋疲力尽”，他认为自己“更多的是个愿景家，而不是管理者”。他说，现在是时候让马斯克掌舵，以继续“实施我们主宰世界的计划了”。员工和投资者对他的突然离职感到难以理解，这种感觉肯定不会持续太久。但是，就目前而言，如何应对经济低迷及其可能产生的所有后果，这将完全是马斯克的问题。", "对天生乐观、一心只想当首席执行官的马斯克来说，这似乎非常自然，而且一开始一切都进展得很顺利。PayPal开发出了一种创新但有点儿麻烦的系统，用来验证用户是否提供了被盗的银行信息。其中包括将两笔各有几美分的小额存款存入一个银行账户，然后要求新用户提供该账户准确的实际金额。该公司还削减了付给新用户的奖励，由之前的10美元减至5美元。", "可惜的是，这未能完全解决PayPal真正的软肋——欺诈。蒂尔过去并不太担心康菲尼迪的欺诈，而马斯克也继承了他这种自由放任的态度。事实上，PayPal里没有人真正知道有多少欺诈行为。", "2000年夏，由刚从斯坦福大学商学院毕业的南非年轻人鲁洛夫·博塔领导的该公司财务部门开始比较PayPal预测的返款率和公司实际亏损的金额。当某个卡号被用来给PayPal账户转账后，一旦被报失，就会发生返款。根据信用卡行业的协议，如果发生这种情况，信用卡服务提供商就会直接拒绝付款，这对PayPal来说是一个难题，因为到那时，提供假名字的客户可能早已经把钱花光了（连同他们的开户奖金）。", "起初，情况看起来很糟糕，但还不是灾难性的，以任意一周为例，PayPal支付退款的损失大约为其收入的1%。这一比例虽然不算高，但已经接近行业标准。不过，博塔随后意识到，这些计算是在有缺陷的前提下进行的：欺诈报告是即时的。如果去咨询银行业人士的意见，他们没有一个人会做出这种假设。因为用户有长达120天的时间来对一笔信贷费用提出异议，这意味着在给定的期限结束后，PayPal还将继续记录亏损达几个月之久。公司没有考虑到这一点，而是简单地将某个月的退款金额除以同期的总收入，这是一种错误的计算方法，因为公司发展非常迅速。事实证明，欺诈率至少是博塔猜测的两倍，而且还在继续上升。“天哪，”博塔想，“我们就要破产了。”", "随着蒂尔的离开，这一切都落在了马斯克的肩上，他转而集中精力拓展PayPal的野心。由于马斯克一向认为X公司不仅是一家支付公司，他要求公司营销部门重新设计PayPal的标志，要在其中加入X公司的元素，并将该服务更名为X-PayPal，还逐步开始了彻底取消PayPal名称的进程。", "对蒂尔雇用的团队来说，这么做简直是疯了。易贝的卖家早已经习惯说“把钱PayPal给我”之类的话，直接拿公司名字当动词用，这可是语言学家的噩梦，但对初创公司来说恰恰是里程碑式的成就。与此同时，X公司进行了一系列焦点小组调查，结果显示消费者并不喜欢这个品牌名称，因为它让他们产生色情的联想。马斯克不为所动，员工们这样私下议论也许是沉没成本的缘故。公司内部有传言说他至少花了100万美元购入X.com的域名。PayPal的营销人员马丁说：“什么都说服不了他。”", "当时，蒂尔在沙丘路为他的对冲基金设立了一间办公室，但他仍与这支忠诚的团队保持着联系，其中包括不满马斯克重塑品牌的《斯坦福评论》的前编辑们，以及对重新编写PayPal软件极为愤慨的列夫琴。这些矛盾冲突使公司陷入瘫痪，导致因欺诈造成的损失持续增长，1亿美元的储蓄金也不见了。一位前高管说：“这就像一张水床，你刚堵住一个漏洞。砰！人家又会发现其他漏洞。我们需要重整旗鼓，而马斯克对此丝毫不在意。”", "1月，马斯克与大学时的女友朱斯蒂娜结婚，但他几乎立刻就被PayPal掏空了，连蜜月也没了。这时，马斯克夫妇正在筹划为期两周的假期，其中包括去观看2000年悉尼奥运会，并在新加坡和伦敦与投资者会面，马斯克希望这些投资者能帮助PayPal维持偿付能力。", "后来回想起来，马斯克承认，他对整件事都考虑不周。他知道员工们不开心，所以应该留下来。“那段时间我可能不应该离开办公室，”他说，“我们做了不少冒险的事。这太可怕了。”蒂尔和列夫琴的老朋友卢克·诺塞克秘密委托他人进行了一项新调查，目的是向马斯克表明他贬损PayPal品牌的做法是错误的。马斯克发现后就把它丢掉了，命令产品经理删除公司网站上PayPal的名称。然后，他就去了机场。", "在马斯克旅行期间，这个团队在博塔女友的家里聚会。她家住在帕洛阿尔托市中心以南大约8千米的地方，这意味着他们不太可能被马斯克的人发现。除了博塔是马斯克在合并前聘用的人，霍夫曼、萨克斯和列夫琴等人都是蒂尔的亲信。他们绕着桌子来回走，针对公司目前错误的品牌重塑、代码重写、不严肃对待欺诈行为及现金储备不断减少等情况，大声地发泄着心中的不满。这期间，有人打电话给蒂尔，征询他的想法：如果董事会解雇马斯克，他会回来担任首席执行官吗？蒂尔说他会的。", "这个计划直截了当：他们威胁要辞职，除非董事会同意这个计划。“作为一个团队，我们为什么不能把彼得重新请回来担任乐队的指挥呢？”博塔说，“是的，他没有超凡的首席执行官经验，他只掌管过一家很小的初创公司，而且仅一年就与X公司合并了，但我们认为这事能成。”", "第二天，他们开始游说其他员工，请他们都来签署请愿书，以敦促董事会撤换现任首席执行官马斯克。在正常情况下，如果马斯克出席会议，那这一切将困难重重，但他将离开办公室两周。大多数仍然忠于马斯克的X公司前员工被蒙在鼓里，他们什么也不知道。", "当马斯克已经登上航班时，包括博塔和列夫琴在内的一群同谋者就开车到城外沙丘路上的红杉资本办公室，直接与莫里茨对峙。他们给了他一个夹着辞职信和请愿书的文件夹。莫里茨看了看文件夹，把它收了起来。蒂尔的支持者们提出了强有力的理由。PayPal现金即将告罄，如果继续目前的做法，公司将重蹈Flooz和Beenz的覆辙。而且，如果公司的联合创始人、最有天赋的工程师列夫琴，以及那些顶尖的程序员和业务开发团队的一半都一起离开，那公司就绝无生还的机会了。", "随后，双方进行了一场谈判。在谈判中，莫里茨告诉阴谋者，他可以同意更换领导者，但对蒂尔的安置只是临时的，公司还需要面试其他候选人。这一点对蒂尔来说已经足够，他便接受了。日后，他会找到办法让对他的这一安排永久化。这伙人在当地的一家廉价酒吧“安东尼奥坚果屋”庆祝。", "马斯克并没有一声不吭地平静离场，他怒不可遏：“这种做法恶劣至极！”他在董事会上为自己的决定辩护，并对蒂尔一伙人没有与他正面交锋表示失望。这些阴谋者专门等到他与外界切断联系，而且是在他度蜜月时下的手。", "他宣布要飞回帕洛阿尔托，一下飞机就把自己的团队召集来，策划重新掌权。莫里茨不为所动，没过几天，董事会就投票罢免了马斯克。蒂尔出任临时首席执行官。", "在接下来的几天里，蒂尔试图劝说马斯克雇用的那些人不要辞职。他无奈地坐在那儿，员工们陆续跟他提出辞职。他们对秘而不宣的“政变”表示强烈不满，并为马斯克的战略辩解。", "蒂尔会平静地说“谢谢你”，然后敦促那个人留下来。蒂尔说，他的计划就是放弃马斯克关于超级银行的想法，转而一心一意地把PayPal搞好。他指出，PayPal已经取得巨大的成功，拥有400万用户，而且就算马斯克费了那么大的力气来削弱它，它依然是互联网上的知名品牌之一。这个方法奏效了，几乎没有人离职。X公司的一位前职员表示：“我对他非常尊敬，那是一段成长的经历。”", "但是，留住公司的工程师只是蒂尔面临的最小的挑战。公司需要解决欺诈问题，还需要更多的现金。幸运的是，蒂尔已经想好一个计划。在被任命为永久首席执行官后不久的一次董事会会议上，他建议PayPal将所有现金交给他的对冲基金蒂尔资本，这样他就可以利用后互联网泡沫造成的经济动荡。", "莫里茨认为蒂尔在开玩笑，但蒂尔平静地解释说，他的计划是要增加公司的“跑道”（创业术语，指在没有筹集额外资本或实现盈利的情况下，公司能够存续的月数），办法就是赌利率下跌，而考虑到美国经济似乎正走向衰退，蒂尔认为这差不多是板上钉钉的事。", "了解董事会审议情况的人士透露，董事会否决了这一提议，莫里茨更是非常愤怒。一个拥有巨大的机会的首席执行官居然要把有限的现金放在投机上，尤其是有可能让其个人大赚的投机上，这种想法是任何一个硅谷风投者和有自尊的科创企业家都不曾尝试的。事实上，蒂尔拿到这个职位的方式本身就不体面，他却在被任命为首席执行官仅仅几周后就提出了这个建议，这一点更是让人倍感难堪。“从管理的角度来看，这事着实奇怪，”一位知情人士说，“就连想要提出这样建议的念头都让迈克尔十分恼火。”这表明，对莫里茨和其他董事会成员来说，赞同他的观点，就是没有道德准则。", "在接下来的一年里，乔治·W.布什在一场有争议的投票中当选总统，这场投票一直闹到了美国最高法院，蒂尔却在默认方式下赢得了永久首席执行官的职位。即使在被提名为首席执行官后，他和莫里茨仍然冲突不断。他们之间的分歧在一定程度上是私人恩怨，因为毕竟莫里茨最初投资的是马斯克的公司，而不是蒂尔的公司。但这也反映出，蒂尔与莫里茨、马斯克及几乎所有先于他来到硅谷的重要人物都截然不同。", "在几年后的一次采访中，莫里茨表示，“说到底，彼得就是一个对冲基金人士”，而非企业家。人们期望企业家将全部的身家和精力都投入公司，甘愿冒财务的甚至个人的风险，一切旨在尽可能地将公司做大做强，如果说还有理想情怀的话，那就是要让世界变得更美好。这就是马斯克的看法，这就是为什么他在职业生涯中多次濒临破产，也是为什么他跟我说他认为接受投资者的钱“一点儿也不酷”。", "按照这种逻辑，蒂尔应该是在为事业流血，而不是在一旁算计着如何增加他的投资组合。但是，蒂尔并不在意莫里茨的感受和硅谷的规矩。他是从权力的角度来构想投资者和企业家之间的关系，他也不把创建一家公司看得那么浪漫。", "PayPal之所以能走得这么远，是因为它对效率低下颇有思考，很好地利用了监管漏洞，并且做了一些正常且有自尊的公司不屑于尝试的事情。这一切与讲规矩毫不相干。从那时起，蒂尔就开始从心所欲，无论多么受人尊敬或经验丰富的风投公司都无法控制得了他。"], "wcount": 7943}, {"icon": "6", "title": "第6章 灰色地带市场的力量", "paras": ["在蒂尔发动PayPal“政变”前后，硅谷的神话或多或少是由一个人定义的，这个人就是史蒂夫·乔布斯，他在20世纪80年代初创造了个人电脑，在“流亡”中创建了皮克斯，归来后又开发了苹果电脑iMac、苹果音乐播放器iPod，将苹果变成了有史以来最大的消费品公司。根据流行的说法，乔布斯之所以成功，应归功于他对反主流文化的忠诚——他是一个骄傲的嬉皮士、一个禅宗信徒、一个电话飞客，而且他有意愿把所有这些古怪的东西都培植到一个盈利的企业身上。", "乔布斯不是一个自由主义者，但他的理想主义帮助硅谷从旧式研究园区的“口袋保护器”保守主义转变为一个充满新时代热情的地方。在乔布斯之前，对科技公司来说，最高的使命可能就是一份大型军事合同；在乔布斯之后，最高的使命则转变为类似于对大众的启蒙。苹果公司及后来的所有科技公司都开始告诉用户，其产品可以改变他们的生活和世界。", "这是一种“头脑的自行车价值体系”，风险投资家罗杰·麦克纳米解释说。他与U2乐队主唱博诺共同创立了高地风险投资公司（Elevation Partners）。“头脑的自行车”是乔布斯发明的词，用来描述可以拓展人类潜能的机器，他曾用“自行车”作为苹果Mac电脑的原始名称，因为他认为电脑会使人的头脑更加高效，就好比自行车能够让人们的出行速度更快、出行距离更远。", "根据麦克纳米的说法，蒂尔代表了一种与上述思维截然不同的强硬路线。他对人的潜力没有兴趣，他感兴趣的只是市场的力量。在收购易贝后，硅谷几乎每家有远大目标的公司都会有类似PayPal的世界支配指数。蒂尔的终极追随者马克·扎克伯格将其发挥到了极致，将自己塑造成罗马皇帝奥古斯都的样子。他剪了一个奥古斯都式的发型，甚至用古罗马的战争口号“Carthage delenda est”（迦太基必须毁灭）来激励他的员工与谷歌作战。", "这种帝国式的科技资本主义有其商业原理。互联网让新产品如“病毒式传播”，故而单独一家公司往往就可以主导某个特定领域。一旦PayPal达到一定的规模，一旦你所有的朋友都拥有PayPal账户，那么再尝试竞争产品就毫无意义了。即使你喜欢Billpoint，要是其他人不用它，你的偏好也就变得无关紧要。这一点不仅适用于支付，实际上也适用于互联网上的一切，包括社交网络、外卖、网约车等。这意味着想要成功的科技企业家都必须尽可能快速地、无情地成长。", "对于这种现象，可以用一个专门的术语来形容，那就是“闪电式扩张”，这个词是由蒂尔的好朋友、PayPal的副总里德·霍夫曼发明的。许多公司将其解释为试图投入巨额资金来占领市场，一旦获得市场主导地位，就尝试提高价格。但有相当一部分企业家，如扎克伯格和优步前首席执行官特拉维斯·卡兰尼克，似乎也看到了闪电式扩张蕴含的道德哲学。乔布斯把商业看作一种文化表达形式，甚至是艺术，但对蒂尔和他的同人来说，这是一种越界模式，甚至是激进主义，是他在《斯坦福评论》所表现的又一版本。", "创办公司不再是为了帮助人们挖掘其真正的潜力，而是要蔑视规则，进而改变规则，并让自己在改变规则的过程中借助新秩序发达致富。脸书将形成对社交媒体的垄断，并利用这种垄断地位碾压竞争对手，向广告商收取越来越高的费用，同时告诉全世界，这种掠夺行为对社会有益。", "正如脸书的格言所说，科技将“快速行动，打破局面”，企业家将被告知，与其请求许可不如请求原谅。这个行业将被这些陈词滥调所定义，并使自己相信，美国非营利组织TED举办的TED大会的演讲者常挂在嘴边的流行词“颠覆”不仅是创新的不幸结果，也是其本身的目的。它会出现在无耻地向儿童推销电子烟的Juul公司，也会出现在用有问题的金融产品吸引新手投资者的在线交易平台罗宾汉，还会出现在优步，这家公司显然违反了市政法规，不仅付给司机过低的工资、忽视共同的安全标准，还时时处处都在庆祝这些越界行径。当许多城市抱怨优步违法时，卡兰尼克把自己的推特头像换成了安·兰德的作品的封面照片。正如我发表在《商业周刊》上的文章所写，优步无人驾驶部门的员工到处分发上面豪横地写着“安全第三”的贴纸。在某种程度上，这些都是PayPal的延伸。“PayPal的黑帮哲学成为整整一代科技公司的创立原则。”麦克纳米说。", "即便如此，在2000年年末，蒂尔还没有考虑要快速行动和打破局面。科技崩溃已在进行中，他正在考虑如何挺过去。如果蒂尔想避免像Pets.com这样的公司的命运，他迫切需要减少PayPal的损失，也就是说要处理欺诈行为。犯罪分子已经注意到该公司的成长黑客行为，其中之一就是决定在用户开户时不核验他们的身份，使它成为利用身份盗窃受害者洗钱的理想场所。他们会盗用信用卡信息为每个人开通PayPal账户，这些空壳账户将试图向其他诈骗者控制的PayPal账户付款。当然，被盗信用卡的提供者有时会拒绝收费，例如，如果有人报告了一起失窃案，但通常在受害者还没意识到发生什么之前，这些被指控的行为就已经得逞。当受害者意识到这一点时，他
