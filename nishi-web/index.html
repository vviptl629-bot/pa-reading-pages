成立于硅谷，”卡普写道，“但我们在技术领域能分享到的价值观和承诺似乎越来越少了。”该信继续陈述如下：", "我国国防和情报机构的软件项目已经出现争议，而这些机构的使命就是要保护我们的安全，但现在以捞取广告费为根本的公司已经司空见惯。就许多消费类互联网公司而言，我们的思想和倾向、行为和浏览习惯，这些都是他们要推销的产品。硅谷许多大型科技公司的口号和营销手法都在试图掩盖这一简单的事实。世界上那些最大的消费类互联网公司，从未像现在这样深入我们生活中最隐秘的方方面面。而且，这些技术进步的速度早已超过了对其进行控制所使用的政治控制形式的发展速度。", "这是对硅谷，尤其是对脸书的猛烈攻击，发起者恰是脸书最早、最重要的支持者一手创立的一家公司的首席执行官。这也让人回想起一直令蒂尔感兴趣的硅谷愿景：军工复合体中刻板的保守主义。", "而且对我来说，这已经很熟悉，就在几个月前，查尔斯·约翰逊曾给我发过一份有关Clearview的类似备忘录。“硅谷的公司都说要让世界变得更美好，他们却把丰厚的广告利润置于民主和安全之上，”他这样写道，“在硅谷，他们攫取私人数据，并转卖给广告商。”另外，“谷歌讨厌军方”。申请报告被披露后，约翰逊给我打来电话，他说“看起来好像都是我写的东西”，并表示自己也给蒂尔写了同样的信。", "帕兰提尔的申请报告不只是一份意识形态声明，它还展示了一家利用新冠大流行，甚至更广泛的意义上，利用特朗普政府牟利的公司的形象。桑卡尔曾夸口说的“在危机中茁壮成长”是准确的。帕兰提尔2016年的收入达4.66亿美元，而仅在2020年上半年，其收入就已超过这一数字。其中，7 900万美元来自美国陆军，在总收入中的占比超过15%；其他政府合同，包括Maven项目交易及该公司携手移民和海关执法局和卫生与人类服务部的合作，还将另外增加数千万美元。", "的确，对帕兰提尔来说可谓财源滚滚，那段时期它的收入为1.65亿美元，亏损也在收窄。但这些损失对蒂尔来说无关紧要，无论帕兰提尔的长期运势如何，他都能从该公司的上市中获得丰厚的利润。S-1申请报告展示了一大堆错综复杂的风险投资公司、投资工具及与他有这种或那种联系的众多实体。他通过与其个人退休账户相关联的多个Rivendell基金，以及Mithril公司、创始人基金、克莱瑞姆资本、PT风投、STS控股等机构持有股份。", "这些加起来大约占该公司的20%，但长期对独裁情有独钟的蒂尔还是会通过某些安排使自己拥有更大的控制权，甚至大到超出合理限度。除了对创始人效忠的董事会，帕兰提尔还创造了一个新的股份类型，可以控制50%以下的投票权。这些股份将由卡普、斯蒂芬·科恩和蒂尔三人控制的信托基金持有，在任何时候，蒂尔都可以选择使用他的其他股份来增加这一比例，从而使他拥有事实上的控制权。令人难以置信的是，即使他们大量出售股票，他们也能保持这种水平的控制权，而蒂尔正打算马上这么干。", "帕兰提尔的股票开盘价为每股10美元，这使其市值达到大约200亿美元。蒂尔立即开始套现，出售了价值超过2.5亿美元的个人股票，然后又通过创始人基金出售了大约2 000万美元的股票。正当这个国家或许已经陷入危机，他的政治计划也正走向崩溃，他个人却依然好得很。", "其实是好得不能再好。在11月的第一周统计选票时，整个美国都充满了不确定性，但有一点对特朗普及“蒂尔江湖”中的许多人之外的所有人来说，已经越来越清晰，那就是特朗普已经败选，新冠大流行也变得越来越糟，总统却没有兴趣做任何事情来延缓疫情蔓延，或在与拜登的交接过渡期内为工作人员提供进一步的援助。", "就在特朗普及其下属机构大肆散布有关选票作弊的错误信息，声称大选被少数几个黑人人口占多数的不正经城市窃取时，蒂尔保持了沉默。“蒂尔江湖”里却在嚷嚷关键摇摆州有选票未经计数的所谓秘密，并认为约瑟夫·拜登这位得到决定性多数美国人支持的候选人已经赢得了大选的这一基本事实在某种意义上依旧存疑。蒂尔的员工、播客“知识分子暗网”主持人埃里克·温斯坦在推特上发布了几则据称是邮件“吹哨人”的视频（起初由保守派记者、挑事儿者詹姆斯·奥基夫发布，蒂尔曾经也是他的赞助人）。他警告称，特朗普被媒体不讲规矩地“玩坏了”。在蒂尔的支持下，布莱克·马斯特斯正准备再次竞选参议员，他在推特上暗暗地谈论了亚利桑那州使用的多米宁投票系统，最后搞出一个阴谋论的结论，指责该投票系统的制造商以某种方式改变了投票结果，并在没有提供任何证据的情况下宣称，死人也在密尔沃基和底特律“参加投票”了。所有这些原来都是假的。", "新反动知识分子、蒂尔的老朋友柯蒂斯·雅文的所作所为更加过分，他发表了一篇文章，声称“城市社区”的选民通过组织者的各种操纵和实际的选票欺诈为拜登窃取了选举。雅文还建议共和党搞一次他所说的“非常合法的政变”，把大选再偷回来，具体做法就是让共和党控制的州议会宣布本次投票无效，接着再让特朗普宣布行使紧急状态权力，无视来自国会或司法部门的干预，并让国民警卫队去执行他的命令。雅文认为，在那之后，特朗普就可以“在当前正式政府内外，清算那些有权势、有名望及有钱的旧政府机构”，在此之后就会实现“非凡的乌托邦愿景”。", "这也许是个笑话，或许还可能是一个思想实验，雅文不无遗憾地承认，可惜特朗普太无能、太软弱，根本无法实现这一目标。但这近乎完美地呼应了蒂尔旧有的思想实验，即先是故意败选，随后军事政变。雅文说，整个局势都会进展顺利，而且无论如何，一直都是有利于拜登的。如果特朗普败选，特朗普主义就会像蒂尔一直期望的那样繁荣起来。他预测，到2024年特朗普将会卷土重来。“红色美国的故事变得更简单、更容易推销。”他写道。", "在不确定性和死亡人数不断上升的情况下，帕兰提尔的股票价格由于一连串与新冠大流行相关的合同而开始攀升，其中包括最近公布的一个与卫生与人类服务部签署的合同，目的是帮助追踪疫苗效果。到1月初，该合同的价值已超过400亿美元。有一个头条标题简洁地概括了这一趋势：“彼得·蒂尔的帕兰提尔飞涨，特朗普却前景渺茫。”在其整个职业生涯之中，蒂尔始终在支持那些看似胜算不大的项目，并从它们不太可能的成功中获利，然后在情况进一步恶化之前抽身离去。现在他又对美国总统来了这一手。", "然而，特朗普政府还未彻底结束，尽管蒂尔可能已经成功地从特朗普主义政治中隐退，转而集中精力于他的生意，但在华盛顿依然可以强烈地感受到“蒂尔江湖”的影响力。", "依其盟友和员工的看法，蒂尔仍然在默默地支持特朗普，尽管他没有大声表白。在“蒂尔江湖”，各色人等争先恐后地讨好他，就是希望能确保从他这里获得进一步的资助，这种性质就意味着，即使蒂尔无限期地隐身于哪个地堡，他们也将确保其从大学时代就开始培育的白人身份政治继续下去。蒂尔的意识形态并不是特别连贯，但在某种程度上就是有这样一种意识形态，即一个不那么民主的美国，在清除其多元文化的虚幻和虚假的虔诚之后，总会带来经济和技术的进步。批评者也许会称之为法西斯主义，而蒂尔说是“回归未来”。", "对于2024年美国总统大选，蒂尔更喜欢的候选人一直是密苏里州的民粹主义参议员、特朗普坚定的盟友乔希·霍利。霍利与克鲁兹有着相同的政治立场和知识分子背景，但他比克鲁兹年轻10岁。他长着方下巴，身材修长，嗓音低沉。在美国全国保守主义大会上，霍利选择了他所谓的“世界性共识”作为攻击目标，他反复使用这个反犹太的比喻来指代一批商界领袖和大学校长，他声称这些人忠于的不是美国，而是他们自己的精英项目。当犹太团体要求霍利为他的言论道歉时，霍利却看到了一个给反政治正确加分的机会，他在推特上说：“自由主义言论的警察已经失去理智。”", "蒂尔在参议院做出的支持就是宣称要从特朗普手中接过“让美国再次伟大”的大旗，并一直暗示即便计票结束很久之后，特朗普仍有可能赢得大选。12月底，尽管没有任何证据表明多米宁公司改变了佐治亚州、亚利桑那州和密歇根州的投票结果，甚至尽管情况越来越明朗，那些称已经过世的民主党人“参与”了密尔沃基和底特律投票的报道纯粹都是胡说八道，霍利仍然宣布他将反对1月6日国会对选举的认证，这将一个通常的例行程序变成了一个极富戏剧性的时刻。几天后，克鲁兹和其他10名共和党参议员发表了类似的声明。", "当时，特朗普试图向副总统迈克·彭斯施压，让他设法破坏选举认证，他还鼓励支持者当天到华盛顿聚集。成千上万的支持者出现了，他们都是从“匿名者Q”和极右翼的“停止偷窃”网上群组聚拢而来，这些群组都是在脸书上成立和壮大的。这些人非常愤怒，有些人还带着武器准备战斗。大约中午时分，就在国会准备投票之际，特朗普发表了一篇火药味十足的演讲，进一步煽动抗议者。他感谢参议员和其他人坚守防线，并敦促人群向国会大厦行进。“拼死一搏吧！”特朗普说，“如果你不拼死战斗，那国将不国！”当霍利走进国会大厦时，他举起拳头向抗议者致意。", "在接下来的几个小时里，雅文的思想实验，以及在某种意义上，长达20年的蒂尔主义突然间变得残酷而真实。一群暴民高喊着“叛国罪、叛国罪”和“绞死迈克·彭斯”等口号闯入国会，企图终止选举认证，确保特朗普继续担任总统。他们恶毒地攻击记者和国会警察，其中包括布莱恩·西克尼克警官，他后来因伤势过重而殉职，此后几天他的两名同事也在暴乱中丧生。暴徒中有四人死亡。", "从某种角度来看，这次企图推翻美国民主的失败行动与蒂尔没有任何关系，他在2020年全年都一直保持沉默。但在数年前，他以实际行动参与了一系列事件，从而不可避免地促发了2014年剑桥分析窃取用户数据和2016年总统大选期间与脸书共谋发布亲特朗普的虚假信息，他由此埋下了许多种子，直接导致这次失败的暴乱。1月11日，霍利的职业生涯已明显被毁，随着温和的共和党人开始公开谈论他和其他人搞出的一个“大谎言”，美国数字新闻网站Axios发表了一篇简短的文章——《彼得·蒂尔误解了唐纳德·特朗普什么》，文章指责蒂尔“帮助建立并巩固了一种观点，通过这一观点，即便是特朗普最恶劣的言论，也不会被按照表面意思来理解”。那个月，虽然彼得·蒂尔的政治计划显然已经失效，但帕兰提尔的市值达到了680亿美元。"], "wcount": 12353}, {"icon": "结", "title": "结语 投资未来的生命", "paras": ["尽管蒂尔本人的影响范围广泛，并拥有数十家关联公司，赚到的钱也已达数十亿美元，而且在另类右翼的崛起中扮演过重要角色，但是许多人知道他仍然是通过一件事，也就是他正涉猎其中的一种新颖的生物学实验，通常被称为“连体共生”。", "这个术语所指的是通过外科手术将两个躯体连接起来，使它们共用循环系统，实际上创造出人工合成的连体双胞胎。根据20世纪70年代进行的一项将年长的小鼠与年轻的小鼠对接的实验，科学家和抗衰老热衷者推测，这种恐怖的过程可能掌握着阻止衰老过程的关键，甚至可能是终结死亡的关键。无论如何，对信徒来说，它代表着一个可能的青春之泉。", "2016年在小鼠身上进行的一项研究，使人们对将其中的基本理念应用于人类的前景产生了强烈的兴趣，即通过把年轻人的血液输给老年人，或许能够让后者焕发青春活力。换言之，这就是一种“吸血鬼”行为。蒂尔在那年发表的一个访谈录中说：“我正在研究连体共生的资料，我觉得它真的很有趣。”他表示自己会考虑将输入年轻人的血液作为自己健康养生的一部分，但指出他还没有这样做。", "蒂尔对连体共生的兴趣引起了疯狂的猜测和大量的嘲讽。高客传媒听到一个传言，说蒂尔在支付4万美元之后，一直在每季度定期输入采自一名18岁年轻人的血。第二年，HBO电视网的剧集《硅谷》专门为这个话题制作了一整集，剧中邪恶的企业家加文·贝尔森就是从一个身材魁梧的“血童”（或按贝尔森所说的“我的输血助手”）那里采血。（扮演蒂尔这个人物的演员在剧集第一季时就去世了，于是蒂尔的一些怪癖就出现在贝尔森身上。）", "蒂尔在新冠疫情暴发前最后一次接受美国主要媒体的采访是在《纽约时报》的财经博客DealBook的年度会议上，他讲到了这一问题。会议主持人、金融专栏作家安德鲁·罗斯·索尔金一上来就问了他一个有关延长寿命研究的问题。然后，他说到一半又停了下来，就提起了那些传言。“顺便问一下，是真的，还是假的？”", "蒂尔傻笑了一下，开始挥着手。“我都不知道该说什么好，”他说，“我想公开告诉你，我不是吸血鬼。”", "2016年的小鼠研究项目确实跟蒂尔有关，资助该项目的是非营利组织SENS研究基金会，这个组织由奥布里·德·格雷创办，蒂尔曾给予支持。我是在2020年年初，也就是因疫情被封禁之前参观了这个实验室，不说有多么豪华，但设备还是挺齐全的，这是一幢位于加利福尼亚州芒廷维尤外高速公路立交桥旁的平房。留着瑞普·凡·温克尔（美国作家华盛顿·欧文作品中的人物）式大胡子的德·格雷一直在实验室旁边一间狭窄的办公室里工作，一个满满当当的书架和一辆自行车靠在墙上。他认为是蒂尔在他的事业中播下了整整一代信徒的种子。他告诉我，“蒂尔江湖”是由这样一些人组成的——“他们在成长过程中逐渐明白，衰老是一个医学问题，我们离解决这个问题还有极漫长的路要走。根本无须说服他们”。", "蒂尔宣布，他把SENS研究基金会的工作视为自己最重要的遗产中的一部分，也是其宗教信仰的核心。“我最坚信的一个基督教观点，”他在2015年与神学家N.T.赖特一起亮相时说，“就是认为死亡是邪恶的，是错误的，我们不应该接受它。我们应该穷尽一切可能的方法与之斗争。”2019年年底，该组织聘请了一位新的首席执行官詹姆斯·奥尼尔，他是蒂尔公司的长期员工（也是蒂尔推举的美国食品药品监督管理局局长候选人之一）。在我到访的时候，SENS研究基金会已经取得一定的成功，并已经将几个研究项目发展成初创阶段的公司，吸引了一批新的捐赠者，包括以太币背后技术的开创者维塔利克·布特林。数年前，他曾是蒂尔奖学金学员。", "但蒂尔本人并不在这些最近的捐助人之列。他最后一次向SENS研究基金会捐款是在2016年。德·格雷还提到，尽管蒂尔经常在媒体上对SENS的工作高谈阔论，实际上却从未造访过这家非营利组织的实验室，而这里距帕兰提尔在帕洛阿尔托的办公室仅有约13千米。这让我怀疑蒂尔关于“长生不老”的一套说辞是否出自真心。他真的想要治愈死亡吗？抑或只是帮他打造逆向投资者招牌的一个有用的故事——就像棋盘上的一枚棋子，只要有机会便可随时弃之？", "在接下来的几个月里，当特朗普面对美国历史上前所未有的人道主义危机而无动于衷时，蒂尔一声不吭，这让人们很难不质疑他对于人类死亡灾难的真情。一个致力于延长生命的人怎么能不被这么多原本可以预防的死亡所触动呢？截至3月底，超过55万美国人死于新冠大流行，比美国在第一次世界大战和第二次世界大战中伤亡人数的总和还要多得多。在新冠大流行期间，美国是世界上人均死亡率最高的国家之一。这些可怕的数字为什么竟然没能让蒂尔与特朗普决裂，或至少加大资金投入去提供帮助呢？为什么蒂尔2020年最大手笔的捐款却是给了美国最著名的本土主义者之一的克里斯·科巴赫的政治行动委员会？", "当然，我尝试问过蒂尔这件事。但他曾答应的采访从未兑现，随着新冠病例数再次飙升，蒂尔的代表干脆不再回复我的邮件。然而，蒂尔却接受了瑞士媒体《国际周报》的采访，该报编辑罗杰·克佩尔是瑞士保守政党——人民党的成员。在接受克佩尔采访时，蒂尔将这种疾病表述为一种精神病态，而不是生理病态。“我认为这是一种心理指标，”蒂尔说，“人们在内心深处都知道：曾经的常态是绝不可能再回去了。”", "蒂尔继续说：“新冠大流行造成了一种转变。人们曾经都有这样一种感觉，即未来在某种程度上被阻滞了。由于存在阻力，本来早就应该发生的变化却没有发生。现在，未来自由了。”他似乎很欢迎新冠大流行，认为这也许是一次按照其理想和规划进行社会重构的机会。", "他也没有像其员工曾引导媒体相信的那样与特朗普决裂。“我仍然支持他。”蒂尔说的是特朗普，还把当时的候选人拜登形容为“年纪略小几岁，但更老朽无用的美国版贝当”，贝当是纳粹占领下的法国的傀儡国家元首。而说到特朗普，蒂尔对其“务实”的回应只有赞扬：特朗普“没有和那些主张全面停摆的极端的卫生专家一条道走到黑”。", "蒂尔直到最后都对特朗普忠心不二。在特朗普总统任期的最后一天，他协助搞定了对无人驾驶汽车工程师安东尼·莱万多夫斯基的赦免。莱万多夫斯基在承认窃取谷歌的知识产权后，被判处了18个月监禁。这是对其长期的宿敌谷歌的最后一击，同时也表明，尽管蒂尔可能已经沉默，但他并没有放弃自己的极端信仰。", "蒂尔公开表示憎恶死亡，这与他对数十万人死于新冠大流行的冷漠形成鲜明的对比，也是我在本书的写作过程中所见到的许多例子之一，反映出蒂尔根深蒂固的信念似乎与他的马基雅维利行为相矛盾。这些矛盾大多被忽视了，蒂尔被认为是一个逆向思维的自由思想者，而不是一个算计家，这证明了他独特的个人品牌打造能力。他是一个自创出道的硅谷魔法师，他通过自己的人脉和讲故事的能力，塑造了一个如此引人注目的形象，以至于模糊了背后那个真实的人。这使他成为一个典型的美国人物，即使在某一时刻，由于税收规划的紧迫性，德国或新西兰（或某个尚未建立的海滨国家）也会对他提出要求。", "蒂尔的神话包含了大量的事实。例如，在过去25年里，蒂尔创立的那些公司定义了我们的文化和经济，而他帮助打造的这个行业创造了数万亿美元的财富，以及数十万个就业岗位。他是真正加速了未来的罕见的未来主义者，为此，他至少应该得到历史的尊重。", "然而，这只是故事的一半，因为蒂尔也促成了我们的政治和社会的一种反动转变，这种转变使美国处于一个比他在20世纪90年代中期自我创业时更不确定的境地。蒂尔是大型科技公司的批评者，但他为确立大型科技公司的主导地位所做的努力比任何在世的人都要多。他自诩为隐私倡导者，却创建了世界上最大的监控公司之一。他是精英政治和知识分子多样性的拥护者，身边却围绕着一群自称忠诚的黑手党。他是言论自由的捍卫者，却秘密地干掉了美国一家主要媒体。反垄断运动家、《歌利亚：垄断权力与民主之间的百年战争》的作者马特·斯托勒评价说：“蒂尔是虚无主义者——非常聪明的虚无主义者。他完全是为了权力——这是弱肉强食的法则，即‘我是掠食者，掠食者必胜’。”最重要的是，这是蒂尔的追随者们学到的一个经验，从中领悟到了“快速行动，打破现状”的真谛。", "目前，蒂尔已经退出公共生活。2021年春，他和丹泽森已为人父母，而且据“蒂尔江湖”的传言，他的家庭也在扩大，他们又添了第二个孩子。做父母甚至可以颠覆一个人的雄心壮志，考虑到蒂尔对死亡的执念，这种转变也许就更加明显。毕竟，为人父母提供了一个留下生命遗产的机会，也就是真正意义上的“死后生命”。我们大多数人认为，生一个孩子并好好抚养他是对永恒生命的投资，甚至远远好过小鼠实验手术中最具开创性的成就。蒂尔的朋友们说，他们见证了一种性情柔化，蒂尔现在看起来更放松，甚至更快乐。这可能是一种投射——蒂尔的天赋之一就是提供一张画布，让其他人可以将自己的想法尽情展示在上面，但其实可能并非如此。", "此外，即使蒂尔完全隐退，他的政治遗产也得到了保证。他的追随者们是一些来自硅谷的极负盛名的思想领袖。埃隆·马斯克用一条推文就能够左右市场，既可以推动安全短信应用Signal的下载量，也可以帮助说服红迪网的投资者购买正在亏损的购物中心零售商GameStop的股票。基思·拉布瓦是“蒂尔江湖”最初的一颗卫星，现在是创始人基金的合伙人，他每天都在大肆宣扬蒂尔的观点，即旧金山湾区应该被富有或有雄心壮志的人抛弃。拉布瓦2020年12月在迈阿密海滩买入一套住宅，他抱怨加利福尼亚州的高税收和防疫限制措施。蒂尔也搬家了，还于2020年年末购入了迈阿密海滩的两处房产，对他来说，此处可是福地，因为佛罗里达州与加利福尼亚州不同，这里不征收资本利得税，而且距离共和党的实际总部——唐纳德·特朗普的海湖庄园也不远。创始人基金也将在南佛罗里达开设办事处。", "与此同时，蒂尔的PayPal联合创始人马克斯·列夫琴想要通过其公司Aff irm摧毁信用卡和算法信用评级。Aff irm于2021年1月上市，市值约250亿美元。Stripe公司是蒂尔投资组合中的另一家金融颠覆者，它正寻求用自己的高科技支付系统取代现有的支付网络，就像蒂尔几十年前设想的那样。Stripe是世界上最有价值的私人控股公司之一，其联合创始人帕特里克·克里森本身就是一个权力中心，他通过自己的书商Stripe出版社推动了蒂尔式的技术进步愿景。除了他的主要投资组合，蒂尔还投资了许多由其门徒运营的基金，包括山姆·阿尔特曼、威廉·伊登和萨拉·科恩等人，而他经常会持有上述公司未来业绩奖金的大量份额，从而确保他能享受到比普通投资者更高的回报。他雇用了新一代的“掷弹手”，包括迪利安·阿斯帕罗霍夫和迈克·索拉纳，他们的使命就是传播关于未来和“警醒暴民”之危险的蒂尔式福音书。", "甚至在与蒂尔从未见过面的创业者中，也能感受到他的影响力。就像史蒂夫·乔布斯激发起一代苦行僧般的产品构想者那样，蒂尔激发起一代科技逆行者，他们渴望获得同等水平的成功和实力，而且他们像20世纪80年代《斯坦福评论》最熟练的专栏作家那样，随时可以借助（或暗示）性别主义和种族主义来展示他们思想的独立性。就有这样一位年轻的科技创始人，他在2020年11月下旬劝导成千上万的推特粉丝不要在公司草创时期“雇用热辣的年轻女孩”，因为她很自然会让男性首席执行官分心，将注意力偏离干正事。之后，他如是说：“智商是真实的，生物性别是真实的，要争取自由派，哈耶克/弗里德曼就是王道，特朗普再干4年。”", "在科技产业之外，蒂尔的政治前景在2021年1月6日之后一下子变得极其糟糕。霍利根本不把批评者放在眼里，甚至对待他政治上的导师、前参议员约翰·丹福思也是如此，这位导师曾说支持霍利是“我一生中犯下的最大错误”。霍利拒绝道歉，然后利用这一争议为自己牟利。当西蒙与舒斯特出版社取消了他即将出版的新书《科技巨头的暴政》的出版计划时，霍利找到了新的出版商莱格里尼出版社，并进行了一次媒体巡回宣传，在数百万美国人面前，他把自己描绘成所谓“取消文化”的受害者。这本书成为《纽约时报》的畅销书。", "霍利曾表示，他不会参加2024年的总统竞选，尽管他有足够的时间改变主意。特德·克鲁兹很可能仍然是共和党政坛的一股力量，也可能参加总统竞选，还有其他亲蒂尔的政客也在伺机而动，其中包括福克斯新闻频道主持人塔克·卡尔森。", "此外，还有美国参议院，蒂尔为这里制订了2022年的大计划，他已经有两位候选人：一位是其长期助手和合作者布莱克·马斯特斯，另一位是《乡下人的悲歌》的作者、Mithril公司前合伙人J.D.万斯，他曾和蒂尔一起在美国全国保守主义大会上发言，被视为有可能取代俄亥俄州温和派参议员罗布·波特曼的竞争者。3月，新成立的“保护俄亥俄价值观”超级政治行动委员会表示，为支持万斯参选参议员，蒂尔承诺提供1 000万美元。据说，作为布赖特巴特新闻网和剑桥分析的长期支持者，以及蒂尔的盟友，默瑟家族的成员也是捐赠者。当时，蒂尔圈子里的两个人告诉我，如果马斯特斯参加竞选，他们觉得蒂尔也会向他捐款，而过了一个月《政客》杂志就报道说，蒂尔确实会这么做，他将向一个新成立的“拯救亚利桑那州”政治行动委员会捐款1 000万美元。", "马斯特斯是坚定的特朗普支持者，他在蒂尔捐款的消息宣布后不久就去走访了边境墙，他在推特上发布的一段视频中说：“显然这么做是有效的。”万斯则曾在2016年反对特朗普，但现在又从这一反对的立场折返回来，他在塞巴斯蒂安·戈尔卡的播客中就拜登总统的“全民儿童保育计划”的危险性发出警告，并在推特上发表了看似对“匿名者Q”的隐晦辩护。他在春天到海湖庄园与特朗普见了面，是蒂尔陪着他去的。", "如果两人都胜选，马斯特斯和万斯将成为得益于蒂尔大手笔赞助才当选的四名美国参议员之一。但马斯特斯和万斯与霍利和克鲁兹又有所不同，他们不只是得了蒂尔的好。正如两位“蒂尔江湖”的圈内人向我指出的那样，他们还是蒂尔本人的外延。在本书即将出版之际，马斯特斯是蒂尔资本的首席运营官和蒂尔基金会的总裁；当然，万斯是蒂尔的前雇员，并将蒂尔视为他的风险投资公司的投资者。", "虽然很难想象蒂尔在拜登政府里还能像在特朗普坐镇白宫时那样发挥同样的影响力，但更难以想象的是他其实连一点影响力都没有了。2021年春，约翰逊告诉我，他已经与蒂尔握手言和。蒂尔克服了对于Clearview的内心不安，并对约翰逊最新创立的基因测序初创公司Traitwell进行了种子投资。Traitwell拥有多项能赢得军方合同的设计，都是以蒂尔在帕兰提尔开发出来后在安杜里尔和Clearview投入使用的模型为蓝本。约翰逊还提到他最近对政治有了惊人的重新认识，他还说曾经帮助蒂尔培植了另类右派的那个人现在却成了约瑟夫·拜登的支持者。他赞扬了这位民主党总统对国防部和情报部门做出的人事安排，以及他要建立一个类似于美国国防部高级研究计划局的机构，来专注于为新的医疗保健技术提供资金支持的计划。他说，拜登具备一位真正的伟大总统的素质。", "尽管出现了这样的转向，但蒂尔还是有与拜登政府关系密切的其他关系人。2021年1月，2020年的大选顾问艾薇儿·海恩斯出任新的国家情报总监，她曾经也是帕兰提尔的顾问。据披露，在加入拜登团队之前，她曾为蒂尔的国防承包商工作，该公司在2017年7月至2020年6月向她支付了18万美元的费用。与此同时，2020年大选期间最大手笔的捐赠者之一是里德·霍夫曼，他个人花了大约700万美元，还筹集了数百万美元帮助拜登和民主党。蒂尔和霍夫曼可能有分歧，但他们依然保持着密切的关系。“PayPal黑帮”建立起来的关系都将在持续数年之后——如果不是数十年之后的话——才会见到回报。", "早在2005年，当蒂尔正在尝试作为宇宙主宰的新身份时，史蒂夫·乔布斯在他的母校发表了毕业典礼演讲。直到今天，乔布斯在斯坦福大学的演讲仍然备受推崇，因为它既是了解苹果创始人心灵的一扇窗，也是20世纪90年代和21世纪初硅谷叛逆精神的结晶。科技界的每个人都至少看过一次这场演讲，许多人更是几乎烂熟于心。", "“说实话，我从来没有从大学毕业，”乔布斯开始说，“在我的生命中，今天是离大学毕业最近的一天。”在解释了他在20世纪70年代初创办苹果公司之前决定从里德学院辍学的原因后，乔布斯透露自己已被诊断患有胰腺癌，并且一直在思考自己的死亡。他认为死亡是一种礼物，用他的话说，是“生命最好的发明”。“想着自己将很快逝去，这是我所遇到的最重要的工具，可以让我做出人生中的重大抉择，”乔布斯继续说，“因为几乎所有的一切，包括所有的外在期许、所有的荣耀、所有的对于困窘和失败的恐惧，在死亡的面前都会烟消云散，留下的唯有真正重要的东西。”他还说：“你已经是赤子之身，没有理由不听从自己的内心。”", "一年后，蒂尔在一场婚礼上短暂地邂逅了乔布斯，但彼时的乔布斯似乎没有兴趣与蒂尔搭上关系。但是，11年后的2016年5月，当蒂尔迈上纽约州北部汉密尔顿学院的讲台，准备发表他的毕业典礼演讲时，乔布斯的那篇演讲似乎就萦绕在他的脑海中。这件事出现于蒂尔生活和事业的一个转折点，那时他刚刚成为特朗普的代表，与被曝光是高客传媒毁灭的幕后设计师仅差几天，他试图利用这次演讲埋葬乔布斯的新时代价值体系，同时为一个崭新的科技行业提供一种新的创始神话。", "乔布斯当年演讲时，一上台就宣称自己没有资格，因为他从来没有从大学毕业。蒂尔也以类似的自谦开场，他说：“你们即将开始工作，而我不为任何人工作已经有21年。”", "然后，他讲述了自己为何决定辍学的故事，不是从大学辍学，而是从公司法的世界辍学。乔布斯将自己离开大学的决定归结于经济原因，他觉得接受似乎没有什么价值的教育是在浪费父母的积蓄。与之相反，蒂尔放弃了高薪的工作，以此作为一种对建制现实的反叛。“熟悉的路径和传统就像是陈词滥调。”蒂尔说，他指的是自己早年为了事业有成而循规蹈矩地生活。", "乔布斯当时引用了左翼刊物《全球概览》的一句口号：“求知若渴，虚心若愚。”蒂尔则引用了美国诗人埃兹拉·庞德的话：“日日新。”然后，蒂尔虽未指名道名，却抨击了乔布斯演讲中提到的两条格言。乔布斯曾告诉毕业生要跟从自己的内心，但蒂尔说的恰好相反，他反驳说：“不要对自己太实诚，你要自律，要培育内心，呵护它，而不是盲目地跟从它。”", "接着，蒂尔把话题转到乔布斯关于死亡的建议上。“要接受这一建议，最好的办法就是反其道而行之，”他说，“要过好每一天，就像你会永远活着一样。”他还说，采取这种世界观“意味着你得善待周围的人，就好像他们也会长久地陪伴着你”，“你会从投入时间去建立历久弥坚的友谊和关系中得到最好的人生回报”。", "这种观点完美地贴合蒂尔逆势反转的独特形象，也表明他对延长寿命的确有兴趣，这还表明他很清楚自己的深远影响。蒂尔身边有很多支持者和仰慕者，他们保护了他，也让他发了大财。这一切，包括“PayPal黑帮”、“蒂尔江湖”和硅谷本身，以及其中所有的虚伪和贪婪，当然，也有硅谷的辉煌，都是他的遗产的一部分。", "然而，这是一项让人感觉有点儿肤浅的遗产。蒂尔到处传播他的逆反思想，也赚了很多钱，但他也许会永远被困在自己的逆反主义意识形态中，毕竟这种意识形态在其内在本质上是孤独的。这使得蒂尔在汉密尔顿学院的演讲令人惊讶，因为它竟然还谈到了友谊。在蒂尔的交易往来中，他倾向于用明确的交易术语来处理人际关系，他自己选择的说辞也暴露了这样一个事实：善待他人本身并不是目的，而是为了获得“回报”而做的一件事。当然，言外之意就是，如果你不认为你还会被迫再次与他人打交道，你也就没必要善待他们。就我为本书收集的报道素材而言，蒂尔的生活中充满了重要的人脉关系，但似乎还没有什么人脉关系能重要得超越金钱和权力。与他自己的建议正好相反，在他建立的世界里，按照他的定义，成功取决于一种意愿，或者实际上是一种需要，即摆脱关系，自己单干。"], "wcount": 7980}, {"icon": "谢", "title": "致谢", "paras": ["本书是15年来对硅谷企业家、初创公司、投资者的世界进行报道的成果汇总。简·贝伦森给了我从事新闻工作后的第一个机会，让我在《公司》杂志的网站做一名事实核准员，并让我相信撰写工商业报道也不一定就枯燥乏味。她成了我的导师、朋友，有时甚至客串家长。要不是凯瑟琳·斯特林（我在《名利场》杂志时的编辑）和戴维·利德斯基（我在《快公司》时的编辑），今天也不会有我这样一个记者。他们不仅教会我如何写得更好，而且成了与我关系最好的两位友人。", "我确信，当今世界干新闻这一行没有比彭博社更好的地方了，在这里，上司慷慨地给了我充足的时间和支持，让我完成了这一项目。我尤其感谢布拉德·斯通、吉姆·艾利、乔尔·韦伯、克里斯汀·鲍尔斯和雷托·格利高里及一些极有才华的同事，尤其是乔希·格林、阿什莉·万斯、乔希·布鲁斯坦、艾米丽·张、莎拉·弗莱尔、奥斯汀·卡尔、马克·伯根、马克·米利安、卡罗琳·温特和亚历克斯·舒卡，他们为本项目最终成书奉献了许多创意、提供了资料来源，有时候还提供了许多笑料。", "本书最初的框架和结构源于我与RossYoon文创社的策划伊桑·巴索夫的一系列谈话。如果没有伊桑早期的编辑和建议，也就不会有本书的面世。我还要感谢达拉·凯和霍华德·尹，我想将来他们也会做我孩子的代表。", "我再也找不出比企鹅出版集团更好的合作伙伴。感谢安·戈多夫、斯科特·莫耶斯、利兹·卡拉马里、达尼埃尔·普拉夫斯基和希纳·帕特尔，尤其要特别感谢我的编辑艾米莉·坎宁安。艾米莉在其编辑过程中不知疲倦、视角敏锐，以良好的幽默感、智慧和谦逊的态度来对待这个项目。本书之所以成功，主要是她的功劳。", "贾娜·卡斯珀科维奇负责调查和事实核准，从一开始就常常与我并肩合作。凯尔西·库达克是我在事实核准过程中出色的向导。考拉·恩洪戈贡献了从斯瓦科普蒙德发来的报道。戴安娜·苏丽雅库苏玛策划了这些图片。戴维·利德斯基一直是我的师傅，他为我做了关键的早期审读，并在一些最难懂的部分帮我做了注释。布拉德·斯通投入了很多时间给我以激励和安慰，并且做了难能可贵的早期审读。伯特·赫尔姆和吉尔·施瓦茨曼提供了情感上的支持。", "本书记述的大量信息均来自拥有数百个信源的关系人脉。大多数与我通电话、回复我的邮件或与我见面的人都冒着巨大的风险，然而无论从个人还是职业角度看，他们都得不到明显的好处，他们慷慨而无畏的精神令我感动。谢谢你们重视新闻工作，也谢谢你们信任我。", "我还得到了一些机构和非营利组织的研究人员的帮助，其中包括斯坦福大学图书馆的特别馆藏部、凯斯西储大学档案馆和加州大学伯克利分校保存的《20世纪的西部矿业》。美国政治捐献数据库及新闻网站ProPublica是我每天都离不开的资源，也是现代记者的工具箱中不可或缺的项目。", "许多记者曾广泛地报道过蒂尔的世界，他们的成果也对我的工作有所启示。当我还在斯坦福大学读本科时，安德鲁·格拉纳托就曾详尽地描述了蒂尔在《斯坦福评论》所扮演的角色，这也是我对《斯坦福评论》进行研究的起点。安德鲁通过一项公共记录请求得到了涉及蒂尔与美国国立卫生研究院之间关系的电子邮件，这也使得我的报道从中受益。《新西兰先驱报》的马特·尼珀特曝光了蒂尔的新西兰国籍，并慷慨地与我分享了文件和观点。科里·佩恩所著的《我在硅谷的最后一周》启发我构思了本书的一些主题。我还查阅了利泽特·查普曼、威尔·奥尔登、迪帕·西萨拉曼、瑞安·麦克、杰夫·贝尔科维奇、布莱恩·多尔蒂和乔治·帕克所写的所有文章、他们永远都是我崇拜的对象。", "本书将永远与两个事件联系在一起，一是我的儿子利昂的出生，他于2020年3月整个世界陷于崩溃之际呱呱坠地；二是我的弟弟杰克逊·特纳的去世，他在利昂出生几个月后永远地离开了我们。杰克逊走时37岁，比我小一岁。他激励了我，也激励了很 function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

  if(!el) return;
  const jump=()=>window.scrollTo({top:Math.max(0,Math.round(el.getBoundingClientRect().top+window.scrollY-70)),behavior:'instant'});
  jump(); setTimeout(jump,120); setTimeout(jump,450); setTimeout(jump,1000);
}

let paraCounter = 0;

/* ============ 摘录：选中文字 → 标记 + 存入摘录本 ============ */
const SELKEY='pa-excerpts-v1';
let excerpts=[];
try{excerpts=JSON.parse(localStorage.getItem(SELKEY)||'[]');}catch(e){excerpts=[];}

/* ===== EXCERPT-ORDER-v1 摘录原文排序 ===== */
function _pidNum(pid){
  var m=/(\d+)/.exec(String(pid||'')); return m?parseInt(m[1],10):-1;
}
function _excerptCmp(a,b){
  var pa=_pidNum(a.pid), pb=_pidNum(b.pid);
  if(pa!==pb) return pa-pb;                    // 段落全局顺序
  var sa=(a.so==null?0:a.so), sb=(b.so==null?0:b.so);
  if(sa!==sb) return sa-sb;                     // 段内字符偏移
  return (a.time||0)-(b.time||0);               // 兜底：时间
}
function sortByDocOrder(arr){ return arr.slice().sort(_excerptCmp); }

/* ===== PID-FIX-v1 旧数据自愈：给空 pid 摘录反查补 pid ===== */
function healMissingPid(){
  try{
    var raw=localStorage.getItem('pa-excerpts-v1'); if(!raw) return;
    var arr=JSON.parse(raw||'[]'); if(!arr||!arr.length) return;
    var bad=arr.filter(function(x){return x && !x.pid;});
    if(!bad.length) return;
    var nodes=[].slice.call(document.querySelectorAll('[data-pid]'));
    if(!nodes.length) return;
    function norm(s){return String(s||'').replace(/\s+/g,'');}
    var changed=false;
    arr.forEach(function(x){
      if(!x || x.pid) return;
      var needle=norm(x.text||'').slice(0,16);
      if(!needle) return;
      for(var i=0;i<nodes.length;i++){
        var el=nodes[i]; var full=norm(el.textContent||'');
        var k=full.indexOf(needle);
        if(k>=0){
          x.pid=el.getAttribute('data-pid');
          x.so=k; x.eo=k+String(x.text||'').length;
          changed=true; break;
        }
      }
    });
    if(changed){
      // 用有序插入重建，保证存储顺序即原文顺序
      var sorted=sortByDocOrder(arr);
      localStorage.setItem('pa-excerpts-v1',JSON.stringify(sorted));
      excerpts=sorted;
      if(typeof renderNotes==='function') renderNotes();
      if(typeof updateNoteCount==='function') updateNoteCount();
    }
  }catch(e){}
}
/* 延迟一拍执行，确保正文段落已渲染；幂等，无坏数据时会自行返回 */
setTimeout(function(){try{healMissingPid();}catch(e){}}, 60);

function insertByOrder(exc){
  var i=0; while(i<excerpts.length && _excerptCmp(excerpts[i],exc)<=0) i++;
  excerpts.splice(i,0,exc);
}

const selbar=document.getElementById('selbar');
let savedRange=null;
const HL_CLASSES=['hl-bold','hl-y','hl-g','hl-b'];

function saveExcerpts(){
  try{localStorage.setItem(SELKEY,JSON.stringify(excerpts));}catch(e){}
  updateNoteCount();
}
function updateNoteCount(){
  const el=document.getElementById('noteCount');
  el.textContent=excerpts.length?(' '+excerpts.length):'';
}
function getChapterInfo(node){
  let el=node.nodeType===3?node.parentElement:node;
  const ch=el&&el.closest?el.closest('.chapter'):null;
  return {ch:ch?ch.querySelector('h1').textContent:'',sec:''};
}
function wrapSelection(cls){
  const sel=window.getSelection();
  if(!savedRange||sel.isCollapsed) return false;
  const range=savedRange;
  if(range.startContainer===range.endContainer && range.startContainer.nodeType===3){
    const span=document.createElement('span');
    span.className=cls; span.dataset.eid='e'+Date.now()+Math.random().toString(36).slice(2,6);
    try{range.surroundContents(span);}catch(e){return false;}
    return span;
  }
  try{
    const span=document.createElement('span');
    span.className=cls; span.dataset.eid='e'+Date.now()+Math.random().toString(36).slice(2,6);
    span.appendChild(range.extractContents()); range.insertNode(span);
    return span;
  }catch(e){return false;}
}
function addExcerpt(cls,color){
  const sel=window.getSelection();
  if(!savedRange||sel.toString().trim().length===0){sel.removeAllRanges();selbar.classList.remove('show');return;}
  const text=sel.toString().trim();
  const info=getChapterInfo(savedRange.startContainer);
  let pid='', so=0, eo=0;
  const sc=savedRange.startContainer;
  // PID-FIX-v1: 兼容 p 与 h2 小标题，且覆盖选区起点为元素节点的情况
  const para=(function(n){
    if(!n) return null;
    if(n.nodeType===3) n=n.parentElement;
    if(!n) return null;
    if(n.nodeType===1 && n.hasAttribute && n.hasAttribute('data-pid')) return n;
    return n.closest ? n.closest('[data-pid]') : null;
  })(sc);
  if(para){
    pid=para.dataset.pid;
    try{
      const pre=document.createRange();pre.selectNodeContents(para);pre.setEnd(sc,savedRange.startOffset);
      so=pre.toString().length; eo=so+text.length;
    }catch(e){}
  }
  const span=wrapSelection(cls);
  const eid=span?span.dataset.eid:('e'+Date.now());
  insertByOrder({
    id:eid, text:text, ch:info.ch, sec:info.sec,
    cls:cls, color:color, time:Date.now(), pid:pid, so:so, eo:eo
  });
  saveExcerpts(); renderNotes();
  sel.removeAllRanges(); savedRange=null; selbar.classList.remove('show');
}
function unwrapMark(span){
  const parent=span.parentNode;
  while(span.firstChild) parent.insertBefore(span.firstChild,span);
  parent.removeChild(span);
}
function marksInSelection(cls){
  if(!savedRange) return [];
  return [...document.querySelectorAll('span[data-eid]')].filter(s=>{
    if(cls && !s.classList.contains(cls)) return false;
    try{return savedRange.intersectsNode(s);}catch(e){return false;}
  });
}
function removeMarks(spans){
  const ids=new Set(spans.map(s=>s.dataset.eid));
  document.querySelectorAll('span[data-eid]').forEach(s=>{
    if(ids.has(s.dataset.eid)) unwrapMark(s);
  });
  excerpts=excerpts.filter(x=>!ids.has(x.id));
  saveExcerpts(); renderNotes();
}
selbar.addEventListener('mousedown',e=>e.preventDefault());
selbar.querySelectorAll('[data-hl]').forEach(b=>{
  b.onclick=()=>{
    const cls=b.dataset.hl;
    const allMarks=marksInSelection(null);
    const sameMarks=allMarks.filter(s=>s.classList.contains(cls));
    if(sameMarks.length && sameMarks.length===allMarks.length){
      removeMarks(sameMarks);
      window.getSelection().removeAllRanges(); savedRange=null; selbar.classList.remove('show');
      return;
    }
    if(allMarks.length){
      const sc=savedRange.startContainer, so=savedRange.startOffset;
      const ec=savedRange.endContainer, eo=savedRange.endOffset;
      removeMarks(allMarks);
      try{
        const r2=document.createRange();r2.setStart(sc,so);r2.setEnd(ec,eo);
        const s2=window.getSelection();s2.removeAllRanges();s2.addRange(r2);savedRange=r2.cloneRange();
      }catch(e){}
    }
    const color=cls==='hl-y'?'#fbbf24':cls==='hl-g'?'#4ade80':cls==='hl-b'?'#60a5fa':'#2DD4BF';
    addExcerpt(cls,color);
  };
});

  Object.keys(byCh).forEach(ch=>{

      md+='> '+(x.text||'').replace(/\n/g,'\n> ')+'\n\n';

    const p=s.parentNode;while(s.firstChild)p.insertBefore(s.firstChild,s);p.removeChild(s);

function renderNotes(){
  const list=document.getElementById('noteList');
  const q=(document.getElementById('noteSearch').value||'').trim().toLowerCase();
  const ordered=sortByDocOrder(excerpts);
  const items=q?ordered.filter(x=>(x.text||'').toLowerCase().includes(q)||(x.ch||'').toLowerCase().includes(q)||(x.sec||'').toLowerCase().includes(q)):ordered;
  if(items.length===0){
    list.innerHTML='<div class="excerpt-empty">'+(q?'没有匹配的摘录':'还没有摘录。<br>在正文中选中文字，即可加粗/标色并摘录到此处。')+'</div>';
    return;
  }
  list.innerHTML='';
  items.forEach(x=>{
    const d=document.createElement('div');d.className='excerpt-item';
    const color=x.color||'#9aa6b2';
    d.innerHTML=`<div class="etext"><span class="ecolor" style="background:${color}"></span>${esc(x.text)}</div>
      <div class="emeta"><span>${esc(x.ch||'')}${x.sec?' · '+esc(x.sec):''}</span><button class="edel" title="删除摘录">×</button></div>`;
    d.onclick=e=>{
      const allSp=[...paper.querySelectorAll('span[data-eid="'+x.id+'"]')];
      if(e.target.classList.contains('edel')){
        excerpts=excerpts.filter(y=>y.id!==x.id);saveExcerpts();renderNotes();
        allSp.forEach(sp=>{const p=sp.parentNode;while(sp.firstChild)p.insertBefore(sp.firstChild,sp);p.removeChild(sp);});
        return;
      }
      const sp=allSp[0];
      if(sp){sp.scrollIntoView({behavior:'smooth',block:'center'});
        sp.style.outline='2px solid var(--amber)';setTimeout(()=>sp.style.outline='',1600);}
      closeSidebar();
    };
    list.appendChild(d);
  });
}
document.getElementById('noteSearch').addEventListener('input',renderNotes);
updateNoteCount();

function paintMarkInPara(root, pid, so, eo, cls, eid){
  if(!root||!pid||so===undefined||eo===undefined||eo<=so) return false;
  const para=root.querySelector('p[data-pid="'+pid+'"]');
  if(!para) return false;
  if(eid && para.querySelector('span[data-eid="'+eid+'"]')) return true;
  const walker=document.createTreeWalker(para,NodeFilter.SHOW_TEXT,null,false);
  let acc=0, sn=null, soff=0, en=null, eoff=0, node;
  while((node=walker.nextNode())){
    const len=node.textContent.length;
    if(sn===null && acc+len>so){sn=node;soff=so-acc;}
    if(acc+len>=eo){en=node;eoff=eo-acc;break;}
    acc+=len;
  }
  if(!sn) sn=en; if(!en) en=sn;
  if(!sn||!en) return false;
  try{
    const r=document.createRange();r.setStart(sn,soff);r.setEnd(en,eoff);
    const span=document.createElement('span');
    span.className=cls;span.dataset.eid=eid;
    span.appendChild(r.extractContents());r.insertNode(span);
    return true;
  }catch(e){return false;}
}
function restoreHighlights(){
  let ok=0;
  excerpts.forEach(x=>{
    if(!x.cls||!x.pid||x.so===undefined) return;
    if(paintMarkInPara(paper,x.pid,x.so,x.eo,x.cls,x.id)) ok++;
  });
  return ok;
}

(function(){

})();

<script>
(function(){
  var KEY='pa-reading-time-v1', BOOK='nishi-web', IDLE=90000, store={};
  try{store=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){store={}}
  var NAMES={'price-action-web':'日本蜡烛图','advanced-trend-web':'高级趋势','wave-range-web':'高级波段','pa-best-trades-web':'最佳交易策略','price-action-kbar-web':'逐K阅读','taifei-web':'太妃课程','ghost-web':'华尔街幽灵','zero-to-one-web':'从0到1','cz-web':'币安人生','nishi-web':'逆势者彼得·蒂尔传'};
  function dayStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function today(){return dayStr(new Date());}
  function bucket(day){if(!store[day])store[day]={};return store[day];}
  var lastSaved={}; try{lastSaved=JSON.parse(JSON.stringify(store));}catch(e){lastSaved={}} /* TIMEMERGE-v1 */
  function save(){ /* TIMEMERGE-v1 会话增量叠加到最新localStorage(含云端pull)，避免覆盖/丢失 */
    try{
      var disk={}; try{disk=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){disk={}}
      var merged={};
      Object.keys(disk).forEach(function(d){ merged[d]=Object.assign({},disk[d]||{}); });
      Object.keys(store).forEach(function(d){
        if(!merged[d]) merged[d]={};
        var ss=store[d]||{}, ls=lastSaved[d]||{};
        Object.keys(ss).forEach(function(bk){
          var delta=(ss[bk]||0)-(ls[bk]||0);
          if(delta>0) merged[d][bk]=(merged[d][bk]||0)+delta;
        });
      });
      store=merged;
      localStorage.setItem(KEY,JSON.stringify(store));
      lastSaved=JSON.parse(JSON.stringify(store));
    }catch(e){ try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e2){} }
  }
  function fmt(ms){
    var s=Math.floor((ms||0)/1000);
    if(s<60)return s+' 秒';
    var m=Math.floor(s/60);
    if(m<60)return m+' 分钟';
    var h=Math.floor(m/60),mm=m%60;
    return mm?(h+' 小时 '+mm+' 分'):(h+' 小时');
  }
  var lastAction=Date.now(), lastTick=Date.now(), dirty=0, running=false;
  var btn=document.getElementById('readTimer');
  function tick(){
    var now=Date.now(), gap=now-lastTick; lastTick=now;
    var ok=!document.hidden&&(now-lastAction<IDLE);
    if(ok){
      if(!running){running=true;btn.classList.add('live');}
      var dt=Math.min(gap,3000), day=today();
      bucket(day)[BOOK]=(bucket(day)[BOOK]||0)+dt;
      dirty+=dt;
      if(dirty>=5000){dirty=0;save();paint();}
    }else if(running){
      running=false;save();paint();btn.classList.remove('live');
    }
  }
  function paint(){
    var day=today(), mine=bucket(day)[BOOK]||0;
    document.getElementById('rtToday').textContent=fmt(mine);
    document.getElementById('rtPopTotal').textContent=fmt(mine);
    var obj=store[day]||{};
    var rows=Object.keys(obj).filter(function(k){return obj[k]>0;}).sort(function(a,b){return obj[b]-obj[a];});
    document.getElementById('rtPopBooks').innerHTML=rows.map(function(k){
      return '<div class="rt-row"><span>'+(NAMES[k]||k)+'</span><b>'+fmt(obj[k])+'</b></div>';
    }).join('')||'<div class="rt-row"><span>暂无记录</span><b>—</b></div>';
    var days=[];
    for(var i=6;i>=0;i--){
      var d=new Date(); d.setDate(d.getDate()-i);
      var key=dayStr(d), sum=0, o=store[key]||{};
      Object.keys(o).forEach(function(k){sum+=o[k]||0;});
      days.push({key:key,sum:sum,label:(d.getMonth()+1)+'/'+d.getDate()});
    }
    var mx=Math.max.apply(null,days.map(function(x){return x.sum;}).concat([1]));
    document.getElementById('rtPopBars').innerHTML=days.map(function(x,i){
      var h=Math.max(2,Math.round(x.sum/mx*40));
      return '<div class="rt-bar'+(i===6?' today':'')+'" title="'+x.key+' '+fmt(x.sum)+'"><i style="height:'+h+'px"></i><em>'+x.label+'</em></div>';
    }).join('');
  }
  ['mousemove','mousedown','keydown','scroll','touchstart','wheel'].forEach(function(ev){
    window.addEventListener(ev,function(){lastAction=Date.now();},{passive:true});
  });
  document.addEventListener('visibilitychange',function(){
    lastTick=Date.now();
    if(document.hidden){save();paint();btn.classList.remove('live');running=false;}
  });
  window.addEventListener('blur',function(){save();paint();});
  window.addEventListener('beforeunload',function(){save();});
  btn.addEventListener('click',function(e){
    e.stopPropagation(); paint();
    document.getElementById('rtPop').classList.toggle('show');
  });
  document.addEventListener('click',function(e){
    if(!e.target.closest('.rt-wrap'))document.getElementById('rtPop').classList.remove('show');
  });
  setInterval(tick,1000);
  paint();
})();
</script>

/* 合并：阅读时长按 天+书 取 max；删除墓碑按 id 取最新；摘录按 id 合并、 tomb 中的剔除 */
/* MERGEFIX-v1: 摘录对象用 time 字段，兼容读取 t/time */
function excTime(x){return (x&&(x.t||x.time))||0;}
function mergeData(a){
  suppressPush=true;
  try{
  var t=getT(), e=getE(), d=getD();
  var _corr=getC(), _corrChanged=false;
  if(a.readingTime&&typeof a.readingTime==='object'){
    Object.keys(a.readingTime).forEach(function(day){
      if(!t[day]) t[day]={};
      var src=a.readingTime[day]||{};
      Object.keys(src).forEach(function(k){ t[day][k]=Math.max(t[day][k]||0,src[k]||0); });
    });
  }
  var dm={}; d.forEach(function(x){dm[x.id]=Math.max(dm[x.id]||0,x.t||0);});
  (a.excTomb||[]).forEach(function(x){dm[x.id]=Math.max(dm[x.id]||0,x.t||0);});
  var em={}; e.forEach(function(x){
    if(!x||!x.id) return;
    if((dm[x.id]||0)>=excTime(x)) return; /* 本地项已被墓碑删除 */
    em[x.id]=x;
  });
  (a.excerpts||[]).forEach(function(x){
    if(!x||!x.id) return;
    if((dm[x.id]||0)>=excTime(x)) return; /* 云端项已被墓碑删除 */
    if(!em[x.id] || excTime(x)>excTime(em[x.id])) em[x.id]=x;
  });
  setT(t); setD(Object.keys(dm).map(function(id){return {id:id,t:dm[id]};}));
  setE(Object.keys(em).map(function(id){return em[id];}));
  if(a.corrections&&typeof a.corrections==='object'){
    Object.keys(a.corrections).forEach(function(k){
      var r=a.corrections[k]; if(!r||typeof r!=='object') return;
      if(!_corr[k] || (r.ts||0)>(_corr[k].ts||0)){ _corr[k]=r; _corrChanged=true; }
    });
    if(_corrChanged) setC(_corr);
  }
  }finally{ suppressPush=false; }
}

(function(){

  function lcfg(){
    try{var c=JSON.parse(localStorage.getItem(CFGKEY)||'{}')||{};

    }catch(e){return {localSnap:true};}

  }
  function getSnaps(){return lread(SNAPKEY,[]);}
  function setSnaps(a){try{localStorage.setItem(SNAPKEY,JSON.stringify(a));}catch(e){}}
  function saveSnap(force){
    if(!lcfg().localSnap) return false;
    var d=current(), snaps=getSnaps();
    var payload=JSON.stringify([d.excerpts||[],d.corrections||{},d.readingTime||{},d.excTomb||[]]);
    if(snaps[0] && snaps[0].sig===payload && !force) return false;
    snaps.unshift({ts:Date.now(),sig:payload,data:d});

  }
  var _snapTimer=null;
  function scheduleSnap(){clearTimeout(_snapTimer);_snapTimer=setTimeout(function(){saveSnap(false);},1200);}
  // 1) 摘录等数据写入：包装 setItem 捕获（含本页直接写入）
  var _origSI=Storage.prototype.setItem;

    _origSI.call(this,k,v);
    if(k==='pa-excerpts-v1'||k==='pa-corrections-v1'||k==='pa-reading-time-v1'||k==='pa-excerpts-tomb-v1') scheduleSnap();

  // 2) 页面刷新统一出口

    restore:function(idx){

        if(d.excerpts)localStorage.setItem('pa-excerpts-v1',JSON.stringify(d.excerpts));
        if(d.excTomb)localStorage.setItem('pa-excerpts-tomb-v1',JSON.stringify(d.excTomb));
        if(d.corrections)localStorage.setItem('pa-corrections-v1',JSON.stringify(d.corrections));
      }catch(e){return false;}
      try{ if(typeof refresh==='function') refresh(); }catch(e){}
      return true;
    }
  };
  function enh(){
    var panel=document.getElementById('bkPanel'); if(!panel||panel.dataset.snapUI) return;
    panel.dataset.snapUI='1';
    var c=lcfg(), snaps=getSnaps();
    function fmt(ts){var d=new Date(ts);return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
    var box=document.createElement('div');
    box.style.cssText='margin-top:14px;padding-top:12px;border-top:1px solid var(--line)';
    var html='<div class="row" style="font-size:13px;font-weight:700">🛟 本地自动快照（保险层）</div>'+
      '<div class="row"><label style="font-size:12.5px"><input type="checkbox" id="snapOn" '+(c.localSnap?'checked':'')+'> 数据变化时自动存快照（最多5份）</label></div>'+
      '<p style="font-size:11.5px;color:var(--muted);line-height:1.6;margin:6px 0">'+
      '快照仅存本机浏览器，不联网。同步万一看错/丢失，点下方时间可回滚到出错前。<br>'+
      '<b>换电脑</b>：用顶栏「导出备份」把数据存成文件带走，在新电脑「导入」即可恢复——快照本身跨不了设备。</p>'+
      '<div class="row"><button class="bk-btn" id="snapNow">立即存一份</button></div>';
    if(snaps.length){
      html+='<div style="font-size:12px;margin-top:8px">最近快照（点「回滚」恢复）：</div>';
      snaps.forEach(function(s,i){
        var cnt=(s.data&&s.data.excerpts)? s.data.excerpts.length:'?';
        html+='<div class="row" style="justify-content:space-between;font-size:12px">'+
          '<span>'+fmt(s.ts)+' · 摘录'+cnt+'条'+(i===0?' · 最新':'')+'</span>'+
          '<button class="bk-btn snap-restore" data-i="'+i+'">回滚</button></div>';
      });
    } else {
      html+='<div style="font-size:12px;color:var(--muted);margin-top:8px">暂无快照（首次使用约几秒后自动生成）</div>';
    }
    box.innerHTML=html;
    var firstRow=panel.querySelector('.row'); if(firstRow) firstRow.parentNode.insertBefore(box,firstRow); else panel.appendChild(box);
    document.getElementById('snapOn').onchange=function(){
      var cc=lcfg(); cc.localSnap=this.checked;
      try{localStorage.setItem(CFGKEY,JSON.stringify(cc));}catch(e){}
      if(this.checked) window.PA_SNAP.save();

    };

function handleFile(ev){
  var f=ev.target.files[0]; if(!f)return;

/* --- Gist 同步 --- */
function api(method,path,body){
  var opt={method:method,headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','User-Agent':'pa-reader'}};
  if(body){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
  return fetch('https://api.github.com'+path,opt).then(function(r){
    if(r.status===401) throw new Error('Token 失效');
    if(r.status===403) throw new Error('请求被限流');
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  });
}
var busy=false, dirty=false, timer=null, lastOk=0, suppressPush=false;
function pull(silent){
  if(!cfg.enabled||!cfg.token||!cfg.gistId){if(!silent)dot('err','未开启同步',true);return Promise.resolve(false);}
  if(busy)return Promise.resolve(false); busy=true; dot('busy','正在从云端读取…');
  return api('GET','/gists/'+cfg.gistId).then(function(g){
    var f=g.files&&g.files[GFILE];
    if(!f) throw new Error('云端文件不存在');
    var content=f.truncated?null:f.content;
    var pr=content?Promise.resolve(content):fetch(f.raw_url).then(function(r){return r.text();});
    return pr.then(function(txt){
      var d=JSON.parse(txt); mergeData(d); refresh(); stat();
      lastOk=Date.now(); dot('ok','已同步 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}));
      return true;
    });
  }).catch(function(e){dot('err','云端读取失败：'+e.message+'（本机数据不受影响）',true);return false;})
    .then(function(ok){busy=false;return ok;});
}
function push(){
  if(!cfg.enabled||!cfg.token||!cfg.gistId)return Promise.resolve(false);
  if(busy){dirty=true;return Promise.resolve(false);}
  busy=true; dot('busy','正在保存到云端…');
  var files={}; files[GFILE]={content:JSON.stringify(snapshot(),null,2)};
  return api('PATCH','/gists/'+cfg.gistId,{files:files}).then(function(){
    lastOk=Date.now(); dirty=false; dot('ok','已保存 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})); return true;
  }).catch(function(e){dirty=true;dot('err','保存失败：'+e.message+'（已排队重试）',true);return false;})
    .then(function(ok){busy=false;return ok;});
}
function schedulePush(){dirty=true;clearTimeout(timer);timer=setTimeout(function(){if(dirty)push();},800);}
function syncNow(){ pull(true).then(function(ok){ if(ok&&dirty) return push(); }); }

/* 数据变化时自动推送：监听两种 storage 写入（同页通过包装 setItem） */
var _si=Storage.prototype.setItem;
Storage.prototype.setItem=function(k,v){

  if(!isHub){

<script id="simpleEditScript">
/* ===== SIMPLE-EDIT-v2 极简勘误：默认纯阅读 + 按需改字 + 回到上一版 ===== */
(function(){

/* ===== CHDEL-v1 整章删除（复用 corrections：跨设备同步 + 可撤销） ===== */
(function(){
  var st=document.createElement('style');

   +'.chapter-head{position:relative}'
   +'.chapter-head h1{padding-right:44px}'

   +'.ch-del::before{content:"×"}'

   +'.ch-del:hover{color:#f87171;border-color:#f87171}'

  document.head.appendChild(st);

function chapterSections(){return document.querySelectorAll('.chapter');}
function chapterTocItems(){return document.querySelectorAll('#toc .toc-ch');}
function chKey(ci){return PREFIX+'CH#'+ci;}
function applyChapterDel(){
  var C=getC();
  var secs=chapterSections();
  for(var i=0;i<secs.length;i++){
    var rec=C[chKey(i)];
    secs[i].classList.toggle('ch-deleted', !!(rec&&rec.t===1));
  }
  var items=chapterTocItems();
  for(var j=0;j<items.length;j++){
    var rec2=C[chKey(j)];
    items[j].classList.toggle('ch-deleted', !!(rec2&&rec2.t===1));
  }
}
function attachChapterDel(){
  var secs=chapterSections();
  for(var i=0;i<secs.length;i++){
    var head=secs[i].querySelector('.chapter-head');
    if(!head || head.querySelector('.ch-del')) continue;
    var b=document.createElement('button');
    b.type='button'; b.className='ch-del';
    b.title='删除整个章节（可点「回到上一版」恢复）';
    b.setAttribute('aria-label','删除章节');

      b.addEventListener('click',function(e){
        e.preventDefault(); e.stopPropagation(); deleteChapter(ci);
      });

    head.appendChild(b);
  }
}
function deleteChapter(ci){
  var C=getC(), k=chKey(ci), rec=C[k];
  if(rec && rec.t===1) return; /* 已删 */
  var hist = rec && Array.isArray(rec.hist) ? rec.hist.slice() : [];
  hist.push(rec ? rec.t : 0);
  C[k]={o:0, t:1, hist:hist, ts:Date.now(), ch:1};
  setC(C);
  applyChapterDel();
  lastEl=null;
  updateBtn(countEdits());
  toast('已删除该章节 · 点「↺回到上一版」可恢复');
}
function undoChapter(ci){
  var C=getC(), k=chKey(ci), rec=C[k];
  if(!rec||!rec.hist||!rec.hist.length){toast('该章节已是最初状态');return;}
  var prev=rec.hist.pop();
  if(rec.hist.length===0 && prev===rec.o){ delete C[k]; }
  else { rec.t=prev; rec.ts=Date.now(); C[k]=rec; }
  setC(C);
  applyChapterDel();
  updateBtn(countEdits());
  toast('已恢复该章节');
}

  var BOOK='nishi-web', KEY='pa-corrections-v1', PREFIX=BOOK+'||';
  var origStore={}, toastEl=null, toastTimer=null, lastEl=null, editingEl=null;

  function getC(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){return {};}}
  function setC(v){try{localStorage.setItem(KEY,JSON.stringify(v));}catch(e){}}
  function toast(msg){
    if(!toastEl){toastEl=document.createElement('div');toastEl.className='undo-toast';document.body.appendChild(toastEl);}
    toastEl.textContent=msg;toastEl.classList.add('show');
    clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastEl.classList.remove('show');},1600);
  }
  function allParas(){return document.querySelectorAll('p[data-pid],h2[data-pid],h1.book-title[data-pid]');}
  function captureOriginals(){
    allParas().forEach(function(el){var pid=el.getAttribute('data-pid');if(pid&&origStore[pid]===undefined)origStore[pid]=el.textContent;});
  }
  // 替换段文字，保留段内已有高亮 span
  function setParaText(el,text){
    var spans=el.querySelectorAll('span[data-eid]');
    if(!spans.length){el.textContent=text;return;}
    var first=null;
    for(var i=el.childNodes.length-1;i>=0;i--){
      var nd=el.childNodes[i];
      if(nd.nodeType===3){if(!first){first=nd;}else{el.removeChild(nd);}}
    }
    if(first){first.nodeValue=text;}else{el.insertBefore(document.createTextNode(text),el.firstChild);}
  }
  function cleanText(el){return el.textContent.replace(/\u00a0/g,' ');}
  // 文字删空的段落隐藏（连残留竖线一起去掉）
  function syncEmpty(el){
    if(!el||!el.getAttribute||!el.getAttribute('data-pid'))return;
    if(el.classList&&el.classList.contains('book-title')){el.classList.remove('se-empty');return;} // BOOKTITLE-v1
    if(!cleanText(el).trim()) el.classList.add('se-empty');
    else el.classList.remove('se-empty');
  }

  // DUPTITLE-v1 隐藏与标题重复的正文首行
  function _normTitle(s){
    s=String(s==null?'':s);
    // 中文数字 -> 阿拉伯数字（第一章 -> 第1章）
    var cn={'一':'1','二':'2','三':'3','四':'4','五':'5','六':'6','七':'7','八':'8','九':'9','十':'10','零':'0'};
    s=s.replace(/[一二三四五六七八九十零]/g,function(c){return cn[c]||c;});
    // 去空白/全角空格/常见标点
    s=s.replace(/[\s\u3000:：,，。.、·\-—_（）()\[\]【】'"“”‘’?!！?]/g,'');
    return s.toLowerCase();
  }
  function _isDupText(txt,title){
    var a=_normTitle(txt), b=_normTitle(title);
    if(!a||!b) return false;
    // 标题通常是首段的子串或完全相等；首段不宜过长（避免误删正文）
    if(a===b) return true;
    if(txt.length<=title.length+10 && (a.indexOf(b)===0 || b.indexOf(a)===0)) return true;
    return false;
  }
  function hideDupTitles(){
    // 先清除旧标记：apply 重算时用户可能已改过某段，必须撤销旧的隐藏
    document.querySelectorAll('.dup-title-line').forEach(function(el){ el.classList.remove('dup-title-line'); });
    var groups=[];
    // 章级：.chapter 容器 -> 标题 h1 + 首个正文 para/subhead
    document.querySelectorAll('.chapter').forEach(function(ch){
      var h=ch.querySelector(':scope > .chapter-head h1, .chapter-head h1');
      if(h) groups.push({title:h.textContent, box:ch});
    });
    // 节级：.section 容器 -> 标题 h2 + 首个正文 para
    document.querySelectorAll('.section, article.section').forEach(function(sec){
      var h=sec.querySelector(':scope > h2, h2');
      if(h) groups.push({title:h.textContent, box:sec});
    });
    var done={};
    groups.forEach(function(g){
      var box=g.box;
      // 只取容器内第一个正文块（p.para 或 h2.subhead），排除章头/节标题本身
      var first=box.querySelector('p.para, h2.subhead, p[data-pid]:not(.cap)');
      if(!first) return;
      var pid=first.getAttribute&&first.getAttribute('data-pid');
      if(!pid||done[pid]) return;
      // 保护用户改过的段落
      if(first.getAttribute('data-edited')==='1') return;
      if(_isDupText(first.textContent, g.title)){
        first.classList.add('dup-title-line');
        done[pid]=1;
      }
    });
  }
  // 应用勘误覆盖（同步 pull 后由 refresh 调 PAProof.apply）
  function apply(){
    var C=getC(), edited=0;
    allParas().forEach(function(el){
      var pid=el.getAttribute('data-pid');if(!pid)return;
      if(origStore[pid]===undefined)origStore[pid]=el.textContent;
      var rec=C[PREFIX+pid];
      if(rec&&typeof rec.t==='string'){
        if(el.textContent!==rec.t)setParaText(el,rec.t);
        el.setAttribute('data-edited','1'); edited++;
      }else{
        if(origStore[pid]!==undefined && el.textContent!==origStore[pid]) setParaText(el, origStore[pid]);
        if(el.getAttribute('data-edited')==='1')el.removeAttribute('data-edited');
      }
      syncEmpty(el);
    });
    updateBtn(edited);
    try{ hideDupTitles(); }catch(e){}
    try{ attachChapterDel(); applyChapterDel(); }catch(e){}
  }
  // 保存单段改动（失焦时触发），把改前文本压入 hist
  function saveOne(el){
    var pid=el.getAttribute('data-pid');if(!pid)return;
    var txt=cleanText(el);
    var C=getC(), k=PREFIX+pid, rec=C[k];
    var old = rec ? rec.t : (origStore[pid]!==undefined?origStore[pid]:txt);
    if(old===txt){return;}
    var hist = rec && Array.isArray(rec.hist) ? rec.hist.slice() : [];
    hist.push(old);
    var orig = rec ? rec.o : old;
    C[k]={o:orig, t:txt, hist:hist, ts:Date.now()};
    setC(C);
    el.setAttribute('data-edited','1');
    syncEmpty(el);
    updateBtn(countEdits());
    toast('已保存 · 正在同步');
  }
  // 回到上一版：退回最近一次改动（约1分钟前的版本）
  function undoLast(){
    var C=getC();
    var target=lastEl;
    if(target && (function(){var r=C[PREFIX+target.getAttribute('data-pid')];return r&&r.hist&&r.hist.length;})()){
      undoOne(target); return;
    }
    var cands=Object.keys(C).filter(function(k){return k.indexOf(PREFIX)===0&&C[k].hist&&C[k].hist.length;});
    if(!cands.length){toast('没有可撤销的修改');return;}
    cands.sort(function(a,b){return (C[b].ts||0)-(C[a].ts||0);});
    var pid=cands[0].slice(PREFIX.length);
    if(pid.indexOf('CH#')===0){ undoChapter(pid.slice(3)); return; }
    target=document.querySelector('[data-pid="'+cssEsc(pid)+'"]');
    if(!target){toast('该段已不在当前页面');return;}
    undoOne(target);
  }
  function undoOne(el){
    var pid=el.getAttribute('data-pid');if(!pid)return;
    var C=getC(), k=PREFIX+pid, rec=C[k];
    if(!rec||!rec.hist||!rec.hist.length){toast('这一段已是最初版本');return;}
    var prev=rec.hist.pop();
    if(rec.hist.length===0 && prev===rec.o){
      delete C[k];
      setParaText(el,rec.o);
      el.removeAttribute('data-edited');
    }else{
      rec.t=prev; rec.ts=Date.now(); C[k]=rec;
      setParaText(el,prev);
    }
    syncEmpty(el);
    setC(C);
    updateBtn(countEdits());
    toast('已回到上一版');
  }
  function countEdits(){
    var C=getC(),n=0;
    Object.keys(C).forEach(function(k){if(k.indexOf(PREFIX)===0&&C[k]&&(typeof C[k].t==='string'||C[k].ch===1))n++;});
    return n;
  }
  function updateBtn(n){
    var b=document.getElementById('undoBtn');
    if(b) b.classList.toggle('hasundo',n>0);
    var t=document.getElementById('undoCount');if(t)t.textContent=n;
  }
  function cssEsc(s){try{return CSS.escape(s);}catch(e){return String(s).replace(/["\\]/g,'\\$&');}}

  // 进入编辑：仅把选区所在段临时设为可编辑，光标定位到选中文字
  // WORDLIKE-v1 双击正文任意位置直接改字（无需先选中）；手机仍用长按工具条 ✎
  function startEditAtPoint(e){
    try{
      var t=e.target;
      if(!t||!t.closest) return;
      // 排除所有交互控件 / 非正文区域（图片点图进分屏、按钮、目录、侧栏等照旧）
      if(t.closest('button,.selbar,.topbar,.sidebar,#toc,#bkPanel,#bkMask,a,.undo-btn,.undo-toast,.book-title,.figure,img,.chapter-head,.ch-del,.split-reader,.read-timer,.rt-wrap,.totop,.lightbox,.rt-pop')) return;
      var el=t.closest('p[data-pid],h2[data-pid]');
      if(!el) return;
      if(el.closest && el.closest('#spTxt')) return; // 分屏内不改，避免与正文 pid 冲突
      if(editingEl===el) return;                     // 已在该段编辑
      e.preventDefault();
      if(editingEl) endEdit(editingEl);
      captureOriginals();
      editingEl=el; lastEl=el;
      el.setAttribute('contenteditable','true');
      el.setAttribute('spellcheck','false');
      el.classList.add('se-editing');
      el.focus();
      // 光标落到双击的确切位置（不依赖是否选中文字，更接近 Word）
      var r=null;
      try{ r=document.caretRangeFromPoint?document.caretRangeFromPoint(e.clientX,e.clientY):null; }catch(_){}
      if(r && el.contains(r.startContainer)){
        var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
      }
      // 双击往往会选中一个词并弹出工具条，这里收起，避免与改字态打架
      var sb=document.getElementById('selbar');
      if(sb){ sb.classList.remove('show'); setTimeout(function(){ sb.classList.remove('show'); },40); }
      toast('直接改字 · 点别处自动保存');
    }catch(err){}
  }
  document.addEventListener('dblclick', startEditAtPoint, false);

  function startEdit(){
    var sel=window.getSelection();
    var range=null;
    try{ range=(typeof savedRange!=='undefined'&&savedRange&&!sel.isCollapsed)?savedRange:(sel.rangeCount?sel.getRangeAt(0):null); }catch(e){}
    if(!range||sel.isCollapsed||!sel.toString().trim()){toast('先选中要改的文字');return;}
    var node=range.startContainer;
    if(node.nodeType===3)node=node.parentNode;
    var el=node&&node.closest?node.closest('p[data-pid],h2[data-pid],h1.book-title[data-pid]'):null;
    if(!el){toast('请选中正文里的文字');return;}
    if(editingEl&&editingEl!==el) endEdit(editingEl);
    captureOriginals();
    editingEl=el; lastEl=el;
    el.setAttribute('contenteditable','true');
    el.setAttribute('spellcheck','false');
    el.classList.add('se-editing');
    try{ el.focus(); var s2=window.getSelection(); s2.removeAllRanges(); s2.addRange(range); }catch(e){ try{el.focus();}catch(_){} }
    var sb=document.getElementById('selbar');if(sb)sb.classList.remove('show');
    toast('直接改字 · 点别处自动保存');
  }
  // 退出编辑：保存 + 还原为不可编辑
  function endEdit(el){
    if(!el)return;
    saveOne(el);
    el.removeAttribute('contenteditable');
    el.classList.remove('se-editing');
    syncEmpty(el);
    if(editingEl===el) editingEl=null;
  }

  function init(){
    if(document.getElementById('undoBtn'))return;
    // BOOKTITLE-v1 顶部空白书名大标题
    try{
      var paperEl=document.getElementById('paper');
      if(paperEl && !document.getElementById('bookTitle')){
        var bt=document.createElement('h1');
        bt.className='book-title'; bt.id='bookTitle'; bt.dataset.pid='booktitle';
        bt.setAttribute('contenteditable','true');
        bt.setAttribute('spellcheck','false');
        bt.setAttribute('title','点击输入书名大标题');
        paperEl.insertBefore(bt, paperEl.firstChild);
      }
    }catch(e){}

    // 顶栏「回到上一版」按钮
    var lib=document.querySelector('.topbar .lib-btn');
    var btn=document.createElement('button');
    btn.className='undo-btn';btn.id='undoBtn';btn.type='button';
    btn.title='回到上一版：撤销最近一次改字（约1分钟前的版本），可逐级退回';
    btn.innerHTML='↺ 回到上一版<span id="undoCount" style="font-weight:800;margin-left:3px"></span>';
    btn.addEventListener('click',undoLast);
    if(lib&&lib.parentNode){lib.parentNode.insertBefore(btn,lib.nextSibling);}
    else{var tb=document.querySelector('.topbar');if(tb)tb.appendChild(btn);}

    // 段落默认【纯阅读】，不设 contenteditable —— 保证多段选区/加粗顺畅
    allParas().forEach(function(el){syncEmpty(el);});

    // 选区工具条新增「✎改字」按钮
    var sb=document.getElementById('selbar');
    if(sb && !document.getElementById('editBtn')){
      var eb=document.createElement('button');
      eb.id='editBtn'; eb.title='改错别字：选中文字后点这里';
      eb.innerHTML='<b>✎</b> 改字';
      eb.addEventListener('click',startEdit);
      sb.appendChild(eb);
    }

    // 失焦：结束编辑（保存并退出）；非编辑段仅记录焦点
    document.addEventListener('focusout',function(e){
      var el=e.target;
      if(el&&el.classList&&el.classList.contains('book-title')){ saveOne(el); lastEl=el; return; } // BOOKTITLE-v1
      if(el&&el.classList&&el.classList.contains('se-editing')){ endEdit(el); return; }
      if(el&&el.getAttribute&&el.getAttribute('data-pid')){ lastEl=el; }
    },true);

    window.PAProof={apply:apply, count:countEdits};
    captureOriginals();
    requestAnimationFrame(function(){requestAnimationFrame(function(){captureOriginals();apply();});});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
