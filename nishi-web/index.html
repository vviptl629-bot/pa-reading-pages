们会打电话给银行，银行则会要求偿还。PayPal作为记录在案的商家，要承担损害赔偿的连带责任。", "蒂尔本可以实施严厉打击，比如强迫所有用户上传驾驶证照片，但他也认识到PayPal的部分吸引力就是比竞争对手更宽松的用户政策。因此，列夫琴专注于如何在不惩罚匿名用户的情况下阻止大规模欺诈。他与另一位工程师戴维·高斯贝克合作，编写了一款软件，迫使新用户复制在屏幕上纵横交错的图案背景下出现的一系列字母。PayPal称之为高斯贝克—列夫琴测试，计算机几乎不可能通过，但对人类来说就很容易。这一技术被科创行业广泛采用，并被称为验证码。这就是为什么你必须点击屏幕上的消防栓图片才能登录银行账户，有点儿烦人，但这是打击网络欺诈的重大创新。", "尽管如此，这项努力并没有解决掉作案最多的犯罪团伙，他们从PayPal窃取了数百万美元。2000年年末，PayPal的首席安全调查员约翰·科塔内克对此有所察觉。科塔内克曾是军事情报官员，同年早些时候加入了PayPal。他在一个会议室里工作了数周，对涉嫌欺诈的数千笔交易进行了筛选。这个过程是人工进行的，简直令人抓狂。", "科塔内克想到了一个主意，试图对涉嫌欺诈的行为做可视化的表述，于是便在白板上绘制了蛛网图，以勾勒出账户之间的关联。他的发现令人吃惊，所有的账户都回指一个单一的幕后黑手，即一个明显以俄罗斯为基地的主谋。据一位熟悉该欺诈案的知情人士透露，这一主谋化名为“Igor”，独自从PayPal侵吞了1 500万~2 000万美元。", "这是一个突破，并不仅因为PayPal的安全团队能够斩断这个用户。俄罗斯行动的诸多挑战之一就是，欺诈者经常会掺入一些与老牌商户的真实交易，让调查人员无迹可寻，也令PayPal更难区分哪些交易是合法的。你可以把全世界的Igor都切断，但前提是你也要切断数千家合法商户，还有可能将他们拱手让给Billpoint或其他竞争对手。科塔内克的可视化方法却可以让分析师既关闭坏账户又把真正的商户保留在线。", "列夫琴和一个工程师团队开始编写软件，以实现这一方法的自动化。该软件将识别来自可疑地点（如俄罗斯）的账户，然后会在每个人的屏幕上创建与科塔内克蛛网图相当的图表，这样PayPal的安全团队（至2001年已有75名分析师）就能迅速拦截欺诈者，而并不妨碍合法用户。他们称这个系统为“Igor”，它非常新颖，以至于美国联邦调查局也开始用它来寻找洗钱者。一小队执法人员在PayPal总部拥有一间自己的会议室，专门来使用这一系统。", "Igor系统使欺诈行为在原有的基础上减少了50%，并引发了几起刑事调查。其中一起是针对一名洛杉矶用户的，该用户在PayPal上接受了价值120万美元的索尼PlayStation 2视频游戏机订单，却没有交付任何东西；另一起是针对两名俄罗斯人的，他们似乎正在大规模窃取信用卡号码，并利用这些号码为PayPal账户提供资金。游戏机一案没有提出任何指控，但俄罗斯人阿列克谢·伊万诺夫和瓦西里·戈尔什科夫被起诉，其中部分证据是PayPal提供的信息，两人随后被联邦调查局设局诱骗到美国，最终被判犯有阴谋罪、黑客罪和欺诈罪：25岁的戈尔什科夫被判处三年监禁，20岁的伊万诺夫被判四年。从某种角度来看，PayPal使这些犯罪成为蒂尔的超自由主义愿景的一部分，即金融体系不受任何权威的控制。但现在，蒂尔公开了其公司与当局一起开展的工作，以便宣传PayPal是多么安全并吓退诈骗者。蒂尔说：“我们已经能够阻止大量蠢蠢欲动的犯罪活动，并起诉那些暂时得逞的人。”", "当时，科技公司收集数据的范围并没有被广泛认知，PayPal愿意与执法部门分享相关数据这件事被视为一个经典的硅谷创新故事，而不是潜在的隐私侵犯。《新闻周刊》的一篇题为“打击网络强盗”的赞扬文章，就犹如《执法先锋》剧集的基调一样，把蒂尔和列夫琴描绘成选择严厉打击骗子的极客。这篇文章的结论是“也许PayPal根本就不是一个容易受害的伟大网站”。《华尔街日报》援引一位隐私专家的话说，这种信息共享是一个“灰色地带”，但他指出“PayPal表示自己在保护客户隐私方面付出了极大的努力”。这样信誓旦旦的说法再过十多年也不会受到质疑，直到与蒂尔相关的一项风险投资牵涉更广泛（对某些人来说，甚至更可怕）的隐私问题，才导致人们开始质疑这些保证。", "互联网的繁荣都与免费赠品有关，但风险资本用于支付这些免费赠品的资金正在枯竭。因此，2000年年底，PayPal开始迫使易贝卖家注册商业账户，这样一来他们就要支付大约每笔交易2%的费用，从而使PayPal至少在某些交易中获得一定的利润。易贝卖家虽然抱怨，但几乎所有人都无可奈何，因为PayPal已经近乎垄断了竞拍网站的支付服务。“这是一个纯免费的东西。使用它，爱上它，让它成为你生活的一部分（如上瘾）吧！”一位易贝卖家抱怨道，他把PayPal的经营者比作毒品贩子，“然后，我们就开始用收费来一点点榨干你的钱。”", "这听起来很夸张，却完全正确，并成为硅谷闪电式扩张剧本的标准桥段。但这并不是PayPal试图增加收入的唯一途径。当时，色情和赌博在互联网上蓬勃发展，但一些银行和信用卡处理机构都拒绝批准任何被标明为以上两种类别的网上购物。也就是说，色情和赌博供应商已无路可走，除非他们选择使用PayPal，因为PayPal将每笔交易都简单地编码为电子商务，即使这种交易涉及赌某球员的个人得分或下载一段淫秽视频。", "这不一定是故意的，PayPal发展得太快了，根本没有人会费心关注合规性。“我们只是大规模地给物品编错了码。”托德·皮尔逊说，他的工作就是要让PayPal达到正常的银行标准。即使在PayPal清理并开始对交易进行准确归类编码后，也还是有一个变通的办法。如果客户通过银行转账给PayPal账户注资，然后再通过PayPal购买色情商品或下赌注，银行也无法阻止交易，而且由于并不涉及任何信用卡，PayPal负担的成本基本为零。这使得这些购买变得有利可图，而且完全不同于PayPal上发生的其他事情。", "这对PayPal来说是一大福音，它开始直接面向赌博和成人娱乐业进行推销。向赌博用户收取更高的每笔交易4%左右的费用，相比之下，向一般卖家只收取2%的费用；此外，PayPal还要另收10%~15%的费用，以弥补潜在欺诈行为造成的银行退款。据PayPal的一名前职员称，由于这种收费结构，再加上在线赌博的发展，使得仅在线赌博这一项收入就能占到PayPal总利润的30%左右。这也是该公司没有受到信用卡手续费和欺诈行为影响的一部分业务。", "这给PayPal办公室造成了一些尴尬。在线赌博在美国许多州都是非法的，而且尽管很多PayPal员工是坚定的自由意志主义者，不一定在意严格遵守涉及网上扑克和性爱视频的监管法规，但也还是有一群基督教徒在公司会议室定期举行小组祈祷活动。当与更虔诚的信教员工交谈时，蒂尔和其他人会小心地避免提及赌博和色情占到公司销售额与增长的很大一部分。", "网络色情尽管不完全合法，但普遍来讲，联邦和州当局也都宽容以待，但PayPal还是因其赌博业务受到纽约州检察长艾利奥特·斯皮策和密苏里州东区检察官雷蒙德·格林德尔的传唤。在这两起案子中，PayPal都将支付和解费用。纽约州、路易斯安那州、加利福尼亚州和爱达荷州也都对PayPal进行了审查，因为它允许用户在其账户中持有资金，以便其开展与博彩有关的业务，根据这些州的说法，这意味着它是一家无照银行。", "蒂尔进行了反击，游说国会议员保持在线赌博的合法性，并防止PayPal被联邦监管机构列为银行。蒂尔通过独立研究所在华盛顿建立了诸多关系，基思·拉布瓦也是如此。拉布瓦在加入PayPal之前，曾在苏利文·克伦威尔律师事务所任职，是专职的反垄断诉讼律师，并兼任丹·奎尔短暂的总统竞选的政策主管。PayPal高管还联系了得克萨斯州众议员、极端的自由主义者罗恩·保罗的办公室。罗恩·保罗曾涉足许多边缘事业，包括结束美联储的主导地位和回归金本位制度。保罗在共和党内是边缘人物，但PayPal的政策团队认为他也许是在线赌博合法化的可能倡导者。其他几位《斯坦福评论》的前编辑也都曾为一些有影响力的众议员工作，包括萨克斯，他曾在实习期间为加利福尼亚州众议员、后来的美国证券交易委员会主席克里斯托弗·考克斯工作。文斯·索利托于2000年开始担任交流和公共事务主管，他曾为考克斯和乔恩·凯尔工作，凯尔曾在参议院司法委员会和财政委员会任职。皮尔逊说，在PayPal的敦促下，参议院财务委员会成员致函维萨和万事达的首席执行官，威胁如果信用卡公司阻止PayPal交易，将举行反垄断听证会。这些议员都收到了PayPal政治行动委员会的竞选捐款。", "这种政治钻营活动在当时是不寻常的。硅谷的企业家往往以不沾政治而自豪，像PayPal这样一个小小的初创公司还积极游说国会，这种事几乎闻所未闻。一些员工认为，考虑到蒂尔的理念，这也是一种虚伪。为了实现针对其竞争对手的反垄断审查，自由意志主义者真的就应该花钱去游说吗？难道这不就是蒂尔等自由意志主义者所反对的“规制俘虏”的定义吗？", "皮尔逊记得，在他和蒂尔一起去面见一位董事会成员的途中，政治问题竟然出现了。皮尔逊大抵是个自由主义者，当他说出要投票给民主党人时，心里便做好准备等着看蒂尔的反应。令他惊讶的是，蒂尔并没有批评支持表面上错误的政党的选择，而是批评支持任何政党的选择。他还说，投票毫无意义，“你们在支持这个腐败的制度”。", "皮尔逊大吃一惊。他知道，在PayPal，自由主义者的身份让他属于少数派，但蒂尔认为任何一种政治都是不道德的，这可是个新的观念，尤其是自从他加入PayPal以来，该公司就一直热衷于政治。2001年，该公司成立了一个政治行动委员会，筹集了大约4万美元，并将这笔钱分发给了参众两院有影响力的政客。没有人被硬性要求进行捐赠，那样是违法的，但强烈鼓动高管们这样做，可以使公司里一部分人感到不舒服。“我们确实是在督促员工做出捐献，”多年后皮尔逊在一次采访中回忆道，他个人给这项事业捐了500美元，“我们一边参与政府工作，一边却持有这种愤世嫉俗的观点。”", "另一方面，蒂尔的政治套话是否注定要从字面上理解，这一直都不清楚。还有一次，他建议说（也许是开玩笑），或许政治上的保守派应该干脆把接下来的几次选举抛到一边，让自由派为所欲为。然后，他希望发生军事政变。蒂尔说：“也许美国军方比政客们能更好地管理这个国家。”", "如果说互联网崩溃，以及随之而来的增加现金流的需求，从未远离蒂尔内心的想法，那么易贝也一样，其几乎所有上得了台面的用户（如为色情和赌博以外的东西付费方面）都在使用PayPal的服务，但易贝有实力随时抛弃PayPal。", "拍卖巨头易贝由拥有普林斯顿大学和哈佛大学学位的著名首席执行官梅格·惠特曼经营，她曾在迪士尼、宝洁及玩具制造商孩之宝工作过，在那里她令人难以置信地把讲述四个胸口装着电视机的大型生物的超现实冒险故事的英国儿童节目《天线宝宝》打造成了全球热播节目。在加入易贝之前，她从来没有在科创行业工作过，她周围都是像她这样的中年工商管理硕士，他们穿着卡其裤，通常都会避开网上赌场。PayPal的许多人都认为，惠特曼是典型的常春藤盟校里的墨守成规者，也正是蒂尔和《斯坦福评论》的校友们决意与之死战的那种人。“梅格就是敌人的化身，”PayPal的营销副总监比尔·翁德多克说，“她已成为众矢之的。”", "与其照章办事的性格相比，更糟糕的是，惠特曼显然对易贝实际上的支付平台是一家外部公司极为不满。作为“易贝网店”服务的一部分，易贝会为卖家提供个人电商网址，同时要求卖家注册Billpoint。PayPal认为这是一种挑衅行为，与易贝高层保持联系的里德·霍夫曼向他们明确表示，此举可能导致通过PayPal在华盛顿的人脉关系引发的反垄断审查。“里德干得漂亮，他总是能唤起人们对反垄断的恐惧。”一位易贝当时的高级职员说。", "惠特曼不仅退让了，还表示她更乐于买下PayPal，而不是与之对抗。2000年年末，她向蒂尔出价约3亿美元收购PayPal。这低于PayPal的估值，但惠特曼用威胁来证明这个报价是合理的。一位熟悉谈判情况的知情人士透露，惠特曼对蒂尔说：“我们正与富国银行携手合作，将把你们打得屁滚尿流！你们根本没戏！”", "蒂尔几乎被说服了。“我们感觉自己正从一个濒死时刻走向另一个濒死时刻，”一位前高管表示，“当时并不清楚我们是否还有把握盈利。”同时，莫里茨极力反对。互联网泡沫的破灭对红杉资本来说是毁灭性的，该公司除了对X.com的投资，在1999年前后进行的所有投资几乎全都失败了或接近于失败，PayPal仍然是一个能产生巨大回报的机会，莫里茨花了几个小时来说服蒂尔和列夫琴相信PayPal有潜力。", "“马克斯，马克斯，马克斯，”当列夫琴建议莫里茨卖掉PayPal后再搞一个新的PayPal时，他争辩道，“请相信我，像PayPal这样的机会不是每天都会出现的。就算你可以再活十辈子，你也不会再遇到PayPal这么大的机会了。”", "2001年，蒂尔继续拿PayPal待价而沽。他们与花旗集团时任董事长兼首席执行官桑迪·威尔及美国在线的代表进行了会谈，但没有取得任何成果。那年夏天，蒂尔还开始与银行家讨论首次上市募股的事宜，其招股说明书显示，PayPal的财务状况稍有起色：2001年第二季度，该公司亏损2 800万美元，收入为2 000万美元。按照美国证券交易委员会的规定，招股说明书还对该公司所面临的法律和监管风险进行了较长篇幅的讨论，指出PayPal存在极大可能被利用于毒品交易、软件盗版、洗钱、银行欺诈、证券欺诈和儿童色情。即便如此，银行家们仍然相信，PayPal有足够的潜能以比易贝开价更高的价格达成目标。", "蒂尔被说服了，但在同意首次公开募股之前，他要求董事会大幅增加他的薪酬。当时，蒂尔和列夫琴各自持有约3%的公司股份。相比之下，自掏腰包支付X.com早期费用的马斯克的股份则多得多，占比达14%。熟悉谈判情况的三位知情人士透露，蒂尔认为这种差距简直太荒谬了。董事会正在敦促蒂尔拒绝有可能给他和列夫琴带来数百万美元的收购交易，而这对他和PayPal的员工们来说，可都是能够改变人生的大钱，尽管这对红杉资本来说微不足道。如果莫里茨要他继续担任首席执行官，他需要拥有更多的股权。如果不要他继续当了，他说那他当天就辞职。", "这一威胁震惊了董事会，而自从蒂尔试图将PayPal的现金投入他自己的对冲基金之后，其中有些人就对他产生了怀疑。如果创始人兼首席执行官突然辞职，投资者们会认为这是一场灾难，有可能危及PayPal的资金筹措能力，而且考虑到公司的亏损和科创行业的危险状况，甚至有可能导致公司破产。“当时的阵仗就像是‘要么给我钱，要么我开枪自杀’，但你也死定了。”一位知情人士说。", "当然，董事会选择了给钱，PayPal以巨大的折扣价奖励其首席执行官近450万股股票，使他在公司的股份占比增加到5.6%。PayPal为这些股票向蒂尔收取了135万美元，上市后其价值为2 100万美元，而就算这笔钱也都是PayPal贷给他的。有点儿令人好奇的是，蒂尔只贷了85万美元，其余的50万美元，他用的是他在罗斯个人退休账户里的收入，这个账户大约可以追溯到他在纽约的时候。这意味着他从最后一分钟“人质谈判”中赚得了2 000万美元，并且未来的任何升值都将完全免税。", "撇开最后11个小时的威胁不说，蒂尔动用个人退休账户的资金就使他处在了法律的灰色地带——用罗斯个人退休账户购买你所控制的公司的股票是违法的。虽然蒂尔对PayPal没有法定的控制权，但也有充分理由说他拥有PayPal的实际控制权。对蒂尔来说，幸运的是，直到10多年后才有人注意到，而到那时他的免税收入已达数十亿美元。", "当PayPal准备提交上市申请时，蒂尔与首席财务官鲁洛夫·博塔一起前往纽约，与摩根士丹利的银行家们会面。那是2001年9月10日，那天下午的会议是彻底失败的。PayPal令银行家们困惑不已，他们搞不懂，这到底是一家科技公司，还是一家无照银行，而且蒂尔和博塔都没有给人留下特别深刻的印象，33岁的蒂尔是个一门心思要当政客的保守派，而作为一家上市公司的首席财务官，27岁的博塔年轻得近乎荒唐，也缺乏必要的经验。", "摩根士丹利的银行家们表示不感兴趣，于是蒂尔和博塔在雨中驱车前往肯尼迪国际机场，心情沮丧极了。他们乘坐的飞机是当天美联航的最后一个航班，在机坪上延误了好几个小时，他们越发感到凄凉悲苦。最后，机组人员允许乘客自行选择下机并改乘早班飞机，有几名乘客选择了离开，蒂尔和博塔却选择留下坐等。", "第二天早上，他们很早就回到了旧金山。几小时后，蒂尔获悉一架从纽瓦克机场飞往旧金山的美联航飞机（UA93航班）被劫持，并在宾夕法尼亚的一个机场坠毁。似乎至少有一些前一天晚上曾与他们在一起的人现在已经遇难了。", "这次袭击和他差一点儿就成了遇难者的感觉使上市的想法更加令人望而却步，但蒂尔坚持继续推进，9月28日，PayPal向美国证券交易委员会提交了招股说明书。该公司现在由所罗门美邦公司代表，预期筹资8 050万美元，但并没有多少人对它有深刻印象。美国股票市场很糟糕，自“9·11”事件以来就没有新股上市，PayPal也从未盈利。《从地球到帕洛阿尔托》，这篇文章的标题暗示上市代表着网络公司过度发展的回归。", "惠特曼让事情变得更加棘手，她又向PayPal抛出了一个收购报价，这回大约是9亿美元。蒂尔意欲接受，但被董事会否决了。在PayPal为上市路演期间，惠特曼变换了另一种手法，她抢在PayPal向主要投资者进行电话推销之前亲自去各家跑了一圈，到处表明自己的看法，说PayPal的大部分业务都依赖于易贝，要是作为一个独立的实体，它注定会完蛋。“梅格上个星期来过了，”银行家们直言不讳，“把你们好一通贬损。”", "这些伎俩无一奏效。2002年2月14日，PayPal的股票开始交易，股价从每股13美元暴涨到20美元左右。帕洛阿尔托的办公室里气氛异常热烈，员工们在停车场喝啤酒、抽雪茄。蒂尔头戴皇冠向一群员工挑战，要和他们同时下10盘国际象棋。在斯坦福大学，他曾怀着敬畏和仰慕之情观看超级优秀的国际象棋选手完成这一壮举，但在PayPal，蒂尔自己就是超级大师。最终，他的战绩是9胜1负。", "股票上市从另一个方面解放了他。尽管法律上不允许蒂尔单方面出售自己的股票（高管需遵行6个月的锁定期），但只要易贝提供高于该公司股价的报价，他就可以将公司全部出售。蒂尔甚至都不需要莫里茨的祝福。没过几周，他就等来了报价，这次惠特曼同意支付约12亿美元，略高于公司当时的市值。蒂尔同意了，但在这场交易的消息于4月中旬泄露，并且PayPal的股价随之开始上涨后，他又反悔了，进而要求对方支付更多的钱。惠特曼非常愤怒，把交易信息泄露怪到蒂尔头上，并指责他未能履行协议。她决定不再和蒂尔做生意，并命令副手们切断与他的一切联系。", "尽管如此，惠特曼还是允许PayPal保留为举办eBay Live大会而租赁的9平方米多的展位。eBay Live大会是易贝召开的卖家年会。PayPal充分利用了这个机会，在阿纳海姆会议中心对面租了一个酒店的宴会厅，会议就在此举行。这一计划就是为了让易贝在自己的地盘上难堪。“人们开完eBay Live大会后，应该更喜欢PayPal，而不是易贝。”当时担任PayPal首席运营官的戴维·萨克斯这样对员工们说。", "在会议的第一天（21日）晚上，PayPal邀请了1 000多人出席鸡尾酒会，不仅免费提供酒水饮料，还送给每位来宾一件背后印有PayPal标志和“新世界货币”字样的T恤衫。但实际到会的人数要多得多，大概有2 500人。席间，酒水饮料无限供应，参与者还被告知，PayPal第二天还会举办抽奖活动，获奖者的名字会从帽子里抽出，奖金为250美元。不过，为了具备抽奖资格，他们必须在早上穿上这件T恤衫。", "比尔·翁德多克说，这么做就是要“造成一种视觉上的冲击：整个业界想要的就是这个”。第二天，当惠特曼上台做主旨演讲时，她看到了数百个PayPal的标识出现在眼前，大约1/4的参会者都穿着这件免费的赠品。PayPal公司客户服务中心负责人阿普丽尔·凯莉说：“就好像用户都在问梅格，‘你为什么还不把PayPal买下来？’”", "事实就是这样。在惠特曼演讲的第二天，萨克斯找到了在易贝的首席运营官杰夫·乔丹。", "“我们要不要再试一次？”萨克斯问。", "7月2日，两人再次会面，商定了大约15亿美元的价格，以易贝股票的形式支付。谈判一直持续到周末，他们策略性地选择了时间框架：市场将在7月4日闭市，7月5日周五交易清淡，大部分华尔街人士将在这一天休息，这样就能把消息泄露的可能性降到最低。最重要的是，蒂尔届时可能在夏威夷，因此无法与惠特曼产生正面冲突，惠特曼也正好在洛杉矶的一个静修处所——无法联系到。", "由于两位首席执行官交恶，惠特曼自己也退避三舍，仅让乔丹代表她进行谈判。两家公司的董事会于周末批准了这笔交易，到周日，交易就完成了：彼得·蒂尔将变得非常富有。公司上市后，他将拥有4%的股份，这意味着他的股票价值超过5 000万美元。", "按照官方说法，蒂尔将留下来，至少这是他和惠特曼在接下来的周一对PayPal员工说的话。在场的人对此表示怀疑。工程师们都穿着蓝色牛津衬衫和卡其裤，这是对拍卖网站严肃氛围的一种挑衅。但是蒂尔安抚了他们，承诺不会裁员——“除了Billpoint”，他高兴地告诉他们将会关闭Billpoint。", "惠特曼走进会场后表现得很好，没有理会工程师们的着装，愉快地戴上了一顶PayPal的棒球帽，对蒂尔、萨克斯和PayPal的员工大加赞扬。她说：“尽管我们有时会设置一些障碍，但你们应该为自己创建的公司感到自豪。”", "演讲结束后，惠特曼和蒂尔走进蒂尔的办公室。惠特曼坐下来时注意到地板上一个打开的公文包里有什么东西露了出来。她说，看起来像是一张飞机票。", "“你是要去哪里吗？”惠特曼问。", "蒂尔冷静地回答，是的。收购之后，以及随着中东爆发战争的可能性越来越大，他不打算留在易贝。蒂尔解释说，他想挤出时间去与当地的投资者见面。", "蒂尔说：“我决定创立对冲基金。”", "惠特曼接受了这一解释。“彼得，”她问，“你打算告诉PayPal团队吗？”", "他疑惑地看着她，说：“问得好，梅格，问得好。”", "惠特曼离开时还以为蒂尔会听从她的建议，可他并没有，而是继续给高层员工留下他打算留下不走的印象，就连他与易贝谈退出条件时依然如此。", "10月3日，也就是易贝宣布交易完成的那天，高级经理们聚集在一间会议室，等待新闻发布。他们认为新的结构完全说得通，即PayPal将以全资子公司的身份加入易贝，并由彼得·蒂尔担任首席执行官。", "当信息发布时，新闻稿中还说了些别的：“彼得·蒂尔今天宣布，他已辞去PayPal首席执行官一职。”接替他的将是易贝的一位副总裁，之前曾在麦肯锡咨询公司担任咨询顾问。换句话说，正是蒂尔训练他的追随者要去鄙视的那种经理人。", "蒂尔向一名PayPal员工解释说，之所以要谈判离职，是有经济方面的原因。他认为易贝——这家他将PayPal卖给它并公开称赞其为最理想搭档的公司，其价值被高估了。他计划利用看跌期权来对冲自己在易贝的头寸，这种衍生品能够让投资者在股价下跌时赚钱。换言之，正如这位员工所说，蒂尔想做空他的新同事，以便“优化自己的对冲基金”。有些人认为这合情合理，尽管有点儿冷酷；有些人则更直白地看待这一切：他们理想主义的首席执行官不仅放弃了PayPal，还放弃了一个将创造力和创新视为最高目标的价值体系。在硅谷，任何一个称职的人都明白选择对冲基金而非科创意味着什么——贪婪！", "“我们心里一沉。”那位工作人员说。就连蒂尔最好的朋友、PayPal的联合创始人列夫琴也是一脸震惊。“我们谁也不知道。”", "其实蒂尔并不只是在保护自己的经济利益。他正确地意识到，他在PayPal的成功给了他在硅谷以外的天空翱翔的通行证，他想要抓住这个机会。在当时，甚至直到今天，在科创行业的某些领域，蒂尔仍然被视为技术专家。当然，科创只是他当作投资机会偶然闯入的，并不是一个他真正怀有激情的领域。这场繁荣已经结束，但新的繁荣已经崭露头角。"], "wcount": 11845}, {"icon": "7", "title": "第7章 对冲", "paras": ["当乔治·W.布什走出来的时候，白宫东厅已经挤满了人，只见他身着深色西装，系着一条淡蓝色领带，面带他那标志性的憨笑。蒂尔已经在此等了很久，他是被白宫邀请与新总统见面的约200名科技公司高管之一。布什是哈佛大学工商管理硕士，即使在担任得克萨斯州州长之后，他也仍然标榜自己为商人。在竞选总统期间和竞选之后，他积极主动地向硅谷示好，聘请了凯鹏华盈公司的风险投资家弗洛伊德·夸默担任他的技术和科学顾问。这是一种背离传统的做法，因为以往的美国总统科学技术顾问委员会主席都是科学家，而夸默并不是。", "布什以互联网泡沫破灭作为开场白，指出“本届政府对美国科技产业的未来充满信心，尽管目前股市可能发出了一些别样的信息”。2001年3月，在就任总统仅仅两个月后，布什在演讲中承诺，将扩大化石燃料的生产，减少企业税收，并追求不受限制的自由贸易。他警告说，如果经济持续低迷，“美国周边的保护主义情绪可能会浮出水面”。这位商人总统承诺要予以抵制，他慢慢从朴素的演讲台上走下来：“我们不应该试图在我们的国家四周建立围墙，也不鼓励其他人这样做，我们要做的是拆除它们。”", "当时，有一些地位重要的硅谷精英对政治感兴趣，但他们中的大多数人都支持布什的对手阿尔·戈尔，以及他所倡导的中间派的以技术官僚理政的民主党政治构想。硅谷的其他人则表现出自由意志主义的倾向，至少在公开场合，他们从来不做任何政治表达。这就是《连线》杂志所称的“技术未来主义”，它夹杂着“爱之夏季时代”的嬉皮士区的个人自由，以及戴维·斯塔尔·乔丹时代以来定义了加利福尼亚州政治的“不要践踏我”精神。", "于是，无论是在政治上重拾活力，还是与戈尔之类软弱无力的“雅达利民主党人”分道扬镳，蒂尔都是一个异类。他一直沉浸在新保守主义思想中，阅读保守派哲学家（纳粹法律学者）卡尔·施密特和列奥·斯特劳斯的著作，施密特有时被认为是布什政府扩大行政权力的灵感来源，而斯特劳斯——这位芝加哥大学的德裔犹太人政治学教授——认为西方在拥抱自由价值观的时候已经迷失了方向。蒂尔对被邀参加布什的会见活动兴高采烈，即便那其实就是拍张大合影而已，次年他被布什极力推进的先发制人的伊拉克战争的前景迷住了，他对员工明确表示自己完全赞成。对PayPal的自由意志主义的员工来说，这简直太过奇怪了，他们不明白为什么一个意识形态上的同路人会主张军事扩张。其中一人说道：“这太奇怪了！你在胡说些什么，彼得？你这是在为大政府站台。”", "这是蒂尔从2002年前后开始做出的众多意识形态妥协之一，目的是要适应他同时在尝试的各种项目。这些项目既相关又有所不同，每一个都需要一套略有差异的信念，并迫使他根据当时的听众呈现出稍微不同的形象。其中包括：一个赚钱的项目，目标是增加蒂尔的财富，有时要求他接受华尔街大亨的品位和举止；一个科技项目，旨在互联网泡沫破灭后，让他自己成为硅谷的权力掮客；还有一个政治项目，他需要用到两样东西——他的金钱和技术信誉——来确立自己思想领袖的地位，并在华盛顿积蓄影响力。当他接受了自己作为对冲基金经理的身份时，这三种努力往往会处于紧张状态。蒂尔会离开硅谷，去拥抱巨富的装备，购买豪宅、豪车和虚荣的玩意儿。但这一切是相互交织在一起的，以这样或那样的方式将蒂尔的反主流思想提升为一种本身就值得颂扬的美德。", "互联网泡沫破灭后，华尔街使硅谷遭到重创。据估计，在前几年创建的公司中，有80%预计会失败，将工商管理硕士和其他西方人士带到互联网发家的“淘金热”正在回流，甚至甲骨文等老牌科技公司也在苦苦挣扎。然而，当PayPal成为运气好的幸存者之一时，蒂尔开始接受华尔街的“兄弟会式审美”。当PayPal在2002年2月上市时，蒂尔以一种书生气的方式庆祝首次公开募股，还在公司的停车场举行了一场同时对弈多方的国际象棋大战。不过，到了那年夏天，他在圣克鲁斯山的一家酒坊主持公司的外出团建活动，包括蒂尔在内的高级员工都穿上了宽松的衣服，进到一个围起来的圈子里进行相扑比赛，员工们则在一旁欢呼雀跃。", "一年前，他在接受《连线》杂志采访时，扮出一副科创界异类的模样，承诺如果PayPal能够盈利，他将把自己的头发染成蓝色。（此事并未兑现。）“彼得·蒂尔并不经常对冲。”该杂志对这个即将启动名副其实的对冲基金的人表示赞许。《连线》杂志发现，蒂尔在担任PayPal的首席执行官时，衣着普通，上身穿着的是没有塞进裤子的T恤衫，下面穿着的则是一条褪了色的李维斯牛仔裤，而且他的大部分时间都在帕洛阿尔托周边活动，住的也只是一间简朴的一居室公寓。现在，蒂尔有整整一衣橱的西装，还有一辆银色法拉利360Spider敞篷跑车。2005年，蒂尔在接受《纽约时报杂志》采访时表示：“要是红色的，那就太夸张了。”", "在PayPal的这次外出活动中，他提到一年前媒体在他提交上市申请后对他的贬损——就是那篇《从地球到帕洛阿尔托》，然而结局逆转了。根据《支付战争》一书的记述，蒂尔曾说：“我想从帕洛阿尔托向地球发个信息。帕洛阿尔托这里的生活很美好，我们已经能够改进你们做事情的方式。有时间来帕洛阿尔托参观，学习一些东西。我想你们会发现这里比地球好得多。”", "在他说完这番话后不久，蒂尔就搬到了旧金山北边，在四季酒店的一套三居室公寓里安顿下来，并创办了克莱瑞姆资本管理公司。", "蒂尔最终将公寓换成了一幢900多平方米的玛丽娜风格的豪宅，从这里可以俯瞰堪称1916年世博会的美术纪念碑的艺术宫，还可以看到雾中若隐若现的金门大桥。这个地段刚好就在旧金山由军事基地改造而成的公园边缘，正如蒂尔有时提醒人们的那样，它唤起了一种边界感，这种感觉很恰当，因为旧金山在经历了经济萧条后再次被边缘化。", "蒂尔在房子里摆满了当代艺术品和现代主义家具，诸如Parzinger扶手椅、Niedermaie餐具等，并重新进行了装修，包括一间专门用来开会的董事会会议室、一间专为客座讲师设计的会客厅、一间各种配置都适应自助餐式服务的餐厅，以及屋顶上供聚会之用的“昼夜休息室”。访客们注意到，有一种东西缺失了，那就是带有情感意义的物品。这里没有纪念品、没有杂志，也没有家庭照片。“蒂尔的家，”一位访客说道，指的是蒂尔在普雷西迪奥的房子和纽约的豪华公寓，“看起来就像舞台上的布景，很难说真的有人住在里面。”", "现在，几乎蒂尔拥有的所有东西都是由年轻的助理安德鲁·麦科马克为他挑选的。麦科马克是几乎立刻就随蒂尔离开易贝的六名前PayPal员工之一。“安德鲁帮他挑选家具，选的就是他那辆法拉利的颜色，”斯科特·凯斯特说。凯斯特是纽约一家餐厅的设计师，蒂尔聘请他来设计另一处资产，即一家名为“Frisson”的休息室风格的夜总会，蒂尔将用它来展示自己的新身份。", "当麦科马克向凯斯特介绍Frisson的情况时，他滔滔不绝地谈起了位于纽约肉类加工业区的夜总会Lotus，它因其男女混合浴室而臭名昭著，蒂尔说那里是深夜幽会的理想场所。麦科马克要求凯斯特在旧金山为蒂尔打造类似的场所。在这位设计师看来，这一切似乎是超现实的，所以他对麦科马克说，只要蒂尔在旧金山为他提供一套公寓和一辆崭新的杜卡迪摩托车，他就设计这间“休息室”。令他惊讶的是，蒂尔竟然同意了，“真不敢相信这家伙是动真格的”。为了设计Frisson的菜单，蒂尔聘请了旧金山城里炙手可热的年轻大厨丹尼尔·帕特森，并不惜一切代价购置家具。这里有一幅巨大的灯光壁画、一位著名的景观设计师，还有一套价值100万美元的音响系统。Frisson早期的一位服务员回忆说：“对一家餐厅来说，这笔花销数目惊人。”", "2004年，当Frisson开张营业时，评论家们对它印象深刻，只是对其过于铺张略感震惊。“伊恩·施拉格和菲利普·斯塔克的餐厅（Asia de Cuba）开业后，设计、艺术、照明、音响和室内建筑就再未出现过如此清晰的融合”，一位评论家如是写道，并指出凯斯特的浴室似乎是“特意为寻求快速性爱的情侣”设计的，配有镜子、不雅艺术品及一个迷人的浴室服务员。", "在这个显然是寻欢聚会的场所却搞了那么多极度精致的美食，这个决策最终注定了Frisson生意上的失败，但它达到了它的目的。几年来，这里经常吸引各界名流光顾，如拉斯·乌尔里克、罗伯特·雷德福、凯文·史派西及科创业的百万富翁们，因此也就成了蒂尔常去的会面地点。如果他想说服别人在他的其他公司工作，他会邀请他们去Frisson，再点上一杯饮料和一堆帕特森制作的奇奇怪怪的小碟菜。然后，他拿出支票簿，夸张地开始填写。“我现在就给你写一张支票。”他对一位刚毕业的学生说。考虑一下这份工作吧，他劝说道，但不管来不来，这钱你都拿好。“这是一个零风险的机会。”他解释说。", "豪宅、夜总会、西装，这一切都适合一个宇宙的主人，也适合一个不会对任何人甚至最亲密的朋友真正敞开心扉的人。蒂尔名义上是直男，有时还被人看到和女性在一起，包括一个特别有魅力的年轻女性，世界上大多数人都以为她就是蒂尔的女朋友。凯斯特认为安德鲁·麦科马克也选中了她。", "不过，蒂尔的大多数朋友都知道他只是宁愿完全避开性这个话题。2006年，列夫琴承认，他记得蒂尔从来不曾提到过他的个人生活。有一次，就一次！蒂尔问起过列夫琴的女朋友。“我惊呆了！”列夫琴说。", "互联网时代的另一个牺牲品是平面新闻，科创繁荣时期的两家幸存者克雷格列表和谷歌也都开始抢夺起广告收入，而媒体巨头们在20世纪90年代曾认为这些收入会永远延续下去。也许比起开夜总会，蒂尔更让人感到好奇的是他竟然创办了一本名为“美国雷霆”的杂志，其目标读者是美国职业汽车大赛纳斯卡的粉丝，他为此投资了1 000万美元。该杂志创刊引起了一些人的窃笑，《纽约时报》的记者戴维·卡尔写道：“即使理查德·佩蒂从他身上轧过，蒂尔也可能不认识他。”为了经营这本杂志，蒂尔雇用了《斯坦福评论》前总编辑阿曼·维吉（维吉是在蒂尔将PayPal出售给易贝之前不久加入的），以及29岁的卡托研究所分析师卢卡斯·马斯特，他也曾经是《斯坦福评论》的工作人员。作为这本新杂志的编辑，马斯特在传达自己内心深处的想法时承诺该杂志“不会体现任何政治正确感”。", "事实证明，赛车迷们更感兴趣的是赛车，而不是在宿舍里大声争论要把不可说之话说出来的重要性。该杂志的“真男人”专栏并不是由一位汽车记者写的，而是由《旗帜周刊》的在线编辑写的。他的第一篇专栏文章是关于娱乐与体育电视网已经被“脆弱的政治正确”“阉割”的观点。在该杂志的“美食”页面上，不像一般杂志那样只刊登些烧烤食谱，而是放了一篇首刊专栏文章，半开玩笑似地讨论起人类学，以及为什么在家做饭应该被认为是“女性的工作”。这篇文章指出：“每天做饭是一件苦差事，很少有男性有时间去做，甚至很少有人愿意去做。我们很感激事情就这样习惯成自然了。我们真的很感激，所以时不时地也会帮忙做做菜。”即使是一页满是趴在赛道边拍摄的衣着清凉的观众的照片——“赛道外的分心风景”，也不足以让读者或广告商驻足。", "到年底，这本杂志已经没钱了，蒂尔便停刊了事。丹尼尔·帕特森在Frisson也只是又多待了几个月，2005年年初就离开了。Frisson撑到了2008年。如果说这些都是失败的话，那也是战略上的失败，因为它们完善了蒂尔真正的赚钱规划，这要求他开始像他想要成为的对冲基金经理那样行事。", "此时，信息时代已经来到了投资基金界，领头的是文艺复兴科技公司的大奖章基金，该基金每天使用计算机进行数千笔交易，蒂尔却将自己塑造成回归传统的“全球宏观”投资者，也就是说，他要预测经济和政治领域的重大变化，例如巴西的经济衰退或阿拉伯半岛的战争，然后再根据预测下注。宏观投资者一周可能只会尝试做一次交易，对于蒂尔不寻常的犹豫不决及对风险的高容忍度，这种方法完美地适合他。“他的世界观是，如果你做对了一件大事，并且坚定不移地努力前行，那么其他任何事都可忽略不计。”克莱瑞姆早期的一名员工说。", "这也符合他对权力的渴望：量化交易对市场的影响在大多数情况下难以分析，而宏观投资者所下的赌注往往很大，甚至涉及整个经济体，因此就有可能改变这些经济体，极少数情况下也可将其摧毁。作为宏观投资者，如果你在经济衰退上押了足够多的钱，那你最终有可能真的会引发衰退。", "另外，蒂尔的战略选择是逆势而动。当时，最著名的宏观投资者是超级自由主义者乔治·索罗斯。2003年，索罗斯的左翼激进主义一直聚焦于美国之外，他本人将成为促成乔治·W.布什下台的行动的最重要的资金支持者。他还是以正确预测并进而加速英镑贬值而闻名的金融家，他的方法就是借贷了数十亿英镑，并用这笔钱购买其他欧洲货币。这个“造成英格兰银行破产的人”后来预见到（同时也被指造成）了东南亚的经济崩盘，但他在20世纪90年代末做空科技股，并在市场见顶时买入生物科技股，因此蒙受了巨大损失。", "蒂尔的悲观情绪导致他与PayPal的莫里茨之间的关系紧张，现在这成了他的秘密武器。克莱瑞姆的投资理论认为，科技泡沫的破灭必将导致经济萧条，而美国消费者的低利率和高借贷水平阻止了萧条的发生。与此同时，由于发展中国家的需求增加和中东局势的不稳定，油价势必上涨，并将对美国的长期经济前景造成更大的影响。索罗斯押注英国和亚洲股市下跌，蒂尔则赌美国输。", "与索罗斯一样，蒂尔自诩为知识分子。正如其首席运营官拉尔夫·何所说，克莱瑞姆“集初创公司、智库和对冲基金于一身”。何自1999年以来一直担任PayPal的副总裁，也是蒂尔带来的一群忠实拥趸中的一员。这些人中还有曾担任PayPal首席财务官的肯·豪厄里、《斯坦福评论》那篇警告同性恋“越轨性行为”的专栏文章的作者及PayPal后来的律师内森·林，以及《斯坦福评论》的另一位校友乔·朗斯代尔，他曾在PayPal实习。蒂尔还聘请了斯坦福大学物理学研究生凯文·哈林顿担任副手，哈林顿曾为《斯坦福评论》撰稿。", "理论上，应该由蒂尔的员工帮助他想出交易和其他投资的点子，可实际上所有重大的决策都是他自己做出的。克莱瑞姆的员工只是看书、下棋和辩论（例如这个话题：如果要你从一张白纸开始设计一个国家，它会是什么样）。每个人都花了很多时间谈论政治，尽管重要的是这些政治总是属于右翼的范畴。一名员工告诉我，人们经常听到否认气候变化的言论，也经常看到网页浏览器对VDARE开放（VDARE是一个极右翼网站，长期以来发布白人民族主义的文章）。克莱瑞姆内部也有一些自由派人士，但他们都明白有些观点最好还是别说出来。如果蒂尔像往常一样在晚餐时问你，你已经改变的观点是什么，你知道最好是想到一个你已经偏向右倾的问题，不管这个问题有多模糊。如果你认为有组织的劳动力的衰落对美国是不利的，而蒂尔又以某种方式把对话引向了那个方向，那么你就该明白应将话题转移到一个双方都感兴趣的潜在领域，比如延长人类的寿命。蒂尔早已开始向致力于治愈衰老的非营利组织玛土撒拉基金会捐款，该基金会声称主流科学忽视了衰老这一问题；包括蒂尔在内的一些克莱瑞姆员工都是名为“阿尔科生命延续基金会”的人体冷冻中心的客户。", "至于能够被这样认可的工作，其实并没有多少。大多数时候，他们会在下午3点左右离开。实际的投资，如果不被反对的话，那也只是工作中相对较小的一部分。“每隔两年，我才搞一项投资，”2003年加入该公司的阿贾伊·罗恩说，“接着就只有观望。”", "当时，罗恩刚20岁出头，是克莱瑞姆的典型雇员，因为他有令人印象深刻的学历证书和正确的政治立场，即使没有任何传统的资历。罗恩去见了蒂尔，向他推介了投资一家通过邮寄方式运送素食套餐的初创公司的想法。罗恩不会做饭，但他在耶鲁大学的保守圈子里很活跃，在高中也做过一些投资。这种共同的相似经历就足够了。“为什么不来克莱瑞姆创业呢？”蒂尔说。蒂尔的瑜伽食品公司后来倒闭了，这并不奇怪，但罗恩留了下来。", "对蒂尔来说，这种随心所欲在当时是很典型的，他在公司上的花费就像他在个人生活上的花费一样，爱怎么花就怎么花。而对员工来说，额外的待遇简直太棒了：合伙人的助理不仅要安排会议，还要打理他们的家。每个人都有免费的食物、免费的假期，还有蒂尔极其英俊的私人教练的免费课程。“他待员工比我以前所有的老板都要好。”他的一位前员工告诉我。", "2004年年初，金融媒体开始关注蒂尔。克莱瑞姆当时管理着2.6亿美元，回报率增长了125%，蒂尔出现在《巴伦》的专栏上，还配有一张他穿着白裤子和白衬衫的照片。鉴于他的世界观，他应该穿黑色衣服才是，专栏作家开玩笑说，并把他描述成一名恰巧也是互联网百万富翁的知识分子。“有很多基金都在追求令人不安的相似策略，”这篇文章援引蒂尔的话说，“没有多少人会提出重大问题。”", "PayPal在去中心化的方式下蓬勃发展，至少在克莱瑞姆，蒂尔给了员工更多的回旋余地，并成立了若干个小研究室团队，请一两个人研究某项交易的思路，或者管理一小笔资金。做得好的人得到的更多，而表现差的人都会被忽视（尽管很少有人被解雇，因为蒂尔似乎厌恶冲突）。", "这是一种非常规的方法，可能是源于蒂尔缺乏作为管理者的信心，或者是源于某种宏大的战略，但直到2005年，这种方法都一直非常有效。蒂尔曾想押注油价上涨，他的交易员在加拿大遥远贫瘠的北部找到了一个完美的方法。该地区从未生产过大量的常规原油，但这里储藏着巨量的被称为沥青的非常重的石油，混合分布在沙质土壤中。人们知道，这些焦油砂含油量高，但在20世纪的大部分时间里，没有人知道如何以足够低的成本将它们从泥土中分离出来。在20世纪50年代，加拿大政府曾考虑在艾伯塔省引爆一枚9 000吨当量的核弹头，那是多达100次的预设核爆炸中的第一次，至少在理论上，爆炸将熔化土壤，使钻探变得容易。正如人们可以想象的，有人对此持怀疑态度，该计划在核武器被部署之前就取消了。", "但在2005年左右，随着石油价格接近每桶100美元，从开采出含油沙，用卡车将沙子运到加工厂，在那里与热水混合后分离出石油，再到最后将石油运到炼油厂，这一过程代价极高，并且对环境非常不利，因此被《国家地理》杂志称为“世界上最具破坏性的石油作业”，但这种做法似乎开始有利可图。克莱瑞姆购买了几家新上市的加拿大矿业公司的股票，其中包括在艾伯塔省拥有大型采矿业务的西方油砂公司和加拿大欧普提公司，欧普提是一家以色列—加拿大合资公司，开发出了一种提取沥青的新工艺。那一年，这两家公司的价值都翻了一番，蒂尔看起来就像天才，实现了近60%的回报率。", "他接受了自己作为一个思想自由的叛变者的身份，把克莱瑞姆从金融区搬到了普雷西迪奥的一间空气清新的办公室，那里离《星球大战》的制作公司卢卡斯影业的总部不远。他卖掉了四季公寓的房子，搬到了新办公室附近的一栋房子里，鼓励公司的人都效仿他。对于那些住在离公司新址约800米内的克莱瑞姆员工，他每个月再额外给他们每人1 000美元，而不管他们本身薪资多少。他将环境的改变描述为大战略的一部分。正如彭博社在2006年解释的那样，其根本想法就是“让他的团队远离其他可能影响他们思维的基金经理和投资银行家”。那时，该基金管理着超过20亿美元的资金，蒂尔被称为下一个索罗斯。", "随着公司不断发展，蒂尔的名气越来越大，他自己也过得越来越舒服。他开始向关系亲密的朋友和同事依次坦言，他是同性恋，并且经常在酒吧或新宅的屋顶与他雇用过的英俊年轻男子交往，许多人都已经离开了。“这是我有过的最好的家庭式经历，”其中一人说道，“我们中的许多人真的很合拍。”", "蒂尔的自我实现将得到回报。2007年8月，即经济衰退开始的四个月前，也是大多数美国人意识到经济正在崩溃的近一年前，他给投资者写了一封信，宣布经济扩张正式结束。他在信中写道：“我们已经进入可以被称为‘漫长告别’的‘后长期繁荣’阶段。”不幸的是，普通美国人似乎并没有意识到这一点，仍然在疯狂地借贷，这意味着将出现所谓“痛苦的去杠杆化和流动性减少”，也就是书呆子口中的金融危机。", "蒂尔想到一个主意，即使以他的标准来衡量，那也是很出色的。该公司开始做空美元，并做空所有借入大量资金的公司。回报率近乎疯狂，几乎瞬间就从11月的5%飙升至12月的13%，进而又在1月飙升至令人瞠目结舌的24%。2008年上半年，大部分对冲基金都在亏钱，蒂尔的收益率却接近60%。那时，克莱瑞姆管理着64亿美元的资产。“这太不可思议了！”一位分析师称，“他的生意做得简直神了！”", "为了庆贺一番，蒂尔租了一架通常由达拉斯独行侠队使用的私人飞机，让整个公司（当时大约有80人）都飞往毛伊岛去过一个长周末。当一行人到达四季酒店时，他们被告知一切花销都由公司买单，可以尽情去按摩、冲浪和畅饮。到了晚上，高管们把钱像糖果一样扔来扔去。其间，乔·朗斯代尔悬赏1万美元给能在掰手腕中战胜他的人。另一位合伙人给一名员工开了一张1万美元的支票，请他唱一场特别精彩的卡拉OK。", "还在PayPal时，蒂尔曾疯狂地试图卖掉那家公司，尽管它以令人难以置信的速度增长，然而在卖给易贝后，他又试图做空自己的头寸。现在他又要故伎重演，即使他的投资引来了一片赞誉。这或将成为一种模式：当蒂尔手中有大钱时，他会寻求出售，或以某种方式对冲他的赌注。", "因此，尽管作为一名看跌的对冲基金人，蒂尔的成就还是受到了普遍赞扬——“硅谷风险投资家彼得·蒂尔似乎能将一切点石成金”，但《纽约邮报》报道称蒂尔开始更加认真地投资初创公司。", "蒂尔不露声色地做了这件事，起初给人的印象是，他认为购买科技公司的股票是愚蠢的游戏。2004年，他曾说，“现在是风险投资家最糟糕的时期”。他拒绝投资埃隆·马斯克生产电动汽车的特斯拉汽车公司，也拒绝投资由前PayPal员工陈士骏和查德·赫利共同创办的在线视频初创公司优兔。", "不过也有例外，尤其是对社交网络这类新兴的、被大肆炒作的科技初创公司。即便在经济低迷的后泡沫时代，社交网络似乎也很有前途。他对领英和Friendster进行了小规模投资。领英是一个专注于商业的网站，人们可在领英上发布简历，Friendster则允许朋友们通过数字方式密切关注彼此。但蒂尔最重要的举措涉及一个以大学生为目标客户的社交网络。", "脸书引起蒂尔的注意是因为年轻企业家肖恩·帕克。帕克19岁时与他人共同创立了纳普斯特，这款软件可供高中生和大学生免费下载及与世界上任何一个人分享数字音乐，从而将他们变成了知识产权窃贼。风险投资家们普遍认为帕克非常危险，因为他有打破规则的癖好，正好又是那种既年轻又有进取心的人，显然不会把规则甚至法律放在眼里，而这正合彼得·蒂尔的心意。", "在纳普斯特被唱片公司起诉而灰飞烟灭后，帕克创立了另一个社交网络原型——Plaxo。它声称帮助人们管理联系人，但实际上更像是一台巨大的滥发垃圾邮件的机器。一旦你注册并上传你的联系人信息，该服务就会不管不顾地给他们发送邮件，直到他们也注册，结果出现了类似PayPal的增长。", "迈克尔·莫里茨也积极资助社交媒体公司，所以在Plaxo于2002年成立后不久，他就把蒂尔介绍给了帕克，希望蒂尔能对其投资。蒂尔没理他，似乎没有心情与莫里茨和解，但他还是与帕克友好相处，尤其是在蒂尔了解到帕克也不那么待见莫里茨之后，两人的友谊进一步加深了。莫里茨也许希望帕克会因纳普斯特的这段经历而变得谦逊，但恰恰相反，据说帕克的做派就好像他真是自己所认为的那样，是个知名首席执行官。2004年年初，Plaxo解雇了帕克，理由是他不去办公室上班，还向员工分发可卡因。帕克否认了这些指控，声称这些指控是为了逼他离开而捏造的。但董事会最终还是解雇了他。", "帕克和蒂尔因为都有与莫里茨打交道的经历而变得亲密起来，并问他应该怎么做。不要起诉，蒂尔对他说，新开一家公司吧。几个月后，帕克再次联系蒂尔，还带来了一份提案。他遇到了一个名叫马克·扎克伯格的哈佛大学本科生，扎克伯格的网站在常春藤盟校里相当火爆。蒂尔会有兴趣投资吗？", "“你知道这就是他们拍摄电影《火烧摩天大楼》的地方吗？”在大卫·芬奇导演的关于脸书的电影《社交网络》中，当他们进入蒂尔的办公室时，由流行歌星贾斯汀·汀布莱克扮演的帕克与杰西·艾森伯格扮演的扎克伯格产生了分歧。这是真的——《火烧摩天大楼》就是在美国银行大厦拍摄的，尽管他们的这次会面的其余部分与电影中的表现有些不同。与帕克关系密切的里德·霍夫曼是以经纪人的身份出现的，领英早期员工马特·科勒也是如此。", "扎克伯格穿着灰色T恤衫、牛仔裤和阿迪达斯拖鞋慢吞吞地走进来，在整个会面的大部分时间里都盯着桌子，不过期间他也有过一次高调发声，告诉蒂尔他正在开发的另一个想法，即文件共享网站Wirehog。", "“不，不感兴趣。”蒂尔说，他就想谈谈脸书。", "帕克讲了一下整体情况。脸书最初要求来自几所大学的用户要拥有一个电子邮件地址，一开始只有哈佛、哥伦比亚、斯坦福和耶鲁。截至那时，脸书已经在数十所大学站稳脚跟，每增加一所大学，几天内就会有80%的本科生注册加入。更令人印象深刻的是，这些用户每天都会使用它。", "扎克伯格的沉默和笨拙给蒂尔留下了深刻的印象，他从这位年轻人的冷漠中看到了智慧。他们志同道合，的确如此：扎克伯格就像蒂尔，他利用黑客技术进入哈佛大学的在线目录导出女同学的照片创建的FaceMash网站，令他的那些政治正确的同龄人感到触目惊心。该网站会随机向用户展示两张哈佛大学一年级女生的大头照，一般为18岁和19岁，然后让用户为谁更性感投票。“我们被哈佛录取是因为长相吗？不是！”该网页上的横栏标题写道，“我们会因长相而被评判吗？是的！”（2003年的这件事发生后不久，扎克伯格就道歉了，声称他并没有打算把网站的流传范围扩大到一小群朋友之外。他对哈佛校报《哈佛深红》说：“我当然清楚别人是如何用错误的眼光看待我的意图的。”", "“别搞砸了！”蒂尔在会议结束时对扎克伯格说。他同意用罗斯个人退休账户的收益投资50万美元。PayPal被易贝收购后，其罗斯个人退休账户金额大幅增长。霍夫曼投入了4万美元。", "几个月后的12月，蒂尔在Frisson举办了一个派对，庆祝脸书的第100万名大学生用户成功注册（以及帕克的25岁生日）。不久之后，红杉资本的莫里茨临时聘请鲁洛夫·博塔建议扎克伯格过来推介其公司。扎克伯格同意见面，但到了约定的时间没有出现。博塔打电话催促他后，他穿着睡裤就走进了红杉资本的办公室，称自己睡过头了，然后做了一场演示，列出了要该公司不投资的理由。最后一张幻灯片表示：“肖恩·帕克也参与了。”这是对莫里茨的侮辱，红杉资本也遭到了这家21世纪最初十年最成功的初创公司的拒绝。", "虽然蒂尔对脸书的投资最终转化为10%的公司股份，但最初是以贷款形式进行的。扎克伯格不得不偿还这笔钱，除非他能够在年底前使用户数达到150万，并重组公司以使其总部得以落户于宜商的特拉华州，从而拥有其提供服务背后的根本知识产权。脸书的股权结构表十分混乱，在硅谷这是众所周知的，意味着它的创始人放弃了太多的股权。扎克伯格虽然拥有脸书背后的技术，但该公司是一家成立于佛罗里达州的有限责任公司，由扎克伯格和其室友达斯汀·莫斯科维茨及另一位同学爱德华多·萨维林共同拥有。萨维林最初负责该公司的运营业务，但那年夏天他并没有到帕洛阿尔托去为脸书工作，而是去了一家投资银行实习。", "扎克伯格觉察到他的合伙人缺乏责任心，就想把萨维林逼出局。于是，他和帕克重组公司，并占有了新公司51%的股权。萨维林最终获得30%的股权，但他将会看到其股权因脸书向扎克伯格、帕克、莫斯科维茨和其他早期员工额外赠股而被稀释。同时，扎克伯格最终拥有了公司董事会4个席位中3个的任命权。蒂尔是唯一的外部董事。", "萨维林和扎克伯格之间的争执，以及帕克为扎克伯格打气，构成了影片《社交网络》的核心冲突。但电影中没有提到的是，这场股权相争像极了蒂尔和莫里茨在PayPal上市前进行的高风险谈判，扎克伯格自觉自愿地追随蒂尔。2004年6月，他在与肖恩·帕克的一次短信聊天中承认了这一点。帕克提到蒂尔在谈判中喜欢玩些“肮脏的伎俩”，然后把这些伎俩描述为“经典的莫里茨狗屎”。", "“我打赌蒂尔一定是从迈克尔那里学来的。”帕克说。", "“是啊，”扎克伯格回答，“现在我跟他学，也会对爱德华多这么做。”", "这也许是蒂尔使用某种软实力的众多例子中的第一个，这些动态的事件最终都会在他无法控制的情况下发生，但这些做法也将使他更加富有，并进一步提升他的影响力。他并没有强迫扎克伯格扳倒萨维林，但在贷款过程中，他将扎克伯格置于“要么重组脸书，要么偿还50万美元贷款”的境地。更重要的是，或许，蒂尔以自己为例给这些行为编织了道德上的正当性，那就是为了无情地捍卫自己在PayPal的利益，他不惜牺牲马斯克和莫里茨等人的利益。遵循蒂尔模式的那些创始人不仅被允许为保护他们的事业而违背正常的礼仪规则，而且他们还被期望这么做。"], "wcount": 11613}, {"icon": "8", "title": "第8章 盗梦空间：“风险投资2.0”", "paras": ["在“9·11”事件后的那段时期，大多数美国人都遭受了一场国家创伤，那就是经济衰退、一场不得人心的战争及一种愈演愈烈的世界末日感。邮件不安全，有人通过发送带有炭疽杆菌的信件杀死了五个人；首都周围的街道也不安全，一名狙击手在那里随机射杀家庭主妇和学生。尽管这两起袭击案都与恐怖组织无关，但公众认为它们与似乎无处不在的宗教极端主义的兴起脱不了干系。", "就蒂尔而言，他发现自己逐渐被宗教极端主义及他可能利用这一时刻的各种方式构成的威胁所吞噬。2004年7月，他和保守派斯坦福牧师罗伯特·哈默顿—凯利与勒内·基拉尔组织了一次为期六天的研讨会，会上蒂尔批评了布什不够强硬，并抱怨“美国公民自由联盟的宗教激进主义民权狂热”。", "这些评论来自蒂尔基于这次会议撰写并发表的一篇文章，他在文中主张美国尝试使用司法之外及法律之外的方法，如他所说，要找到“一个在高中教科书中都有所描述的、运作于代议制民主督察与制衡之外的政治框架”，以便对付恐怖主义。他写道：“我们应该考虑的，不是以联合国，而是以非官方承认的美国领导的全球间谍网络Echelon，即多国情报部门秘密协作，作为通往真正的全球性‘美式和平’的决定性路径。”", "文中提到了冷战时期的一个情报网络，即美国联合澳大利亚、加拿大、新西兰和英国利用卫星侦察苏联的通信，但同时呼吁警惕《爱国者法案》——美国国会在“9·11”事件后迅速通过并由布什签署为法律的反恐法。除此之外，这部法律允许政府机构从疑似恐怖分子及美国公民（后来有证实）那里搜集大量数据，既包含电话记录也包含电子通信记录。", "PayPal曾经是一家自由意志主义公司——在蒂尔最极端的想象中，这是一种单方面剥夺政府控制自己货币供应的权力的方式。但是，不管怎么说，如果说蒂尔曾经是一个自由意志主义者，那么在“9·11”事件之后，他也不再是一个完全意义上的自由意志主义者。他越来越怀疑民主，怀疑移民，也怀疑其他一切形式的全球化；就在那时，他正在为创办一家新公司而努力，以便适应他的新政治。", "就在马克·扎克伯格和肖恩·帕克向蒂尔推销他们为大学生建立的新社交网络时，另一群年轻人正坐在离43楼会议室不到3米远的一排桌子旁，就在那个提供素食套餐的人旁边。蒂尔给了他们一项特别的任务：看看列夫琴为挫败那些威胁到PayPal业务的俄罗斯网络欺诈者而开发的Igor能否抓到恐怖分子。", "最初的团队由斯坦福大学保守派和天才程序员组成，有时也在帕洛阿尔托的办公室里工作。斯蒂芬·科恩是一名本科生，在前一年春天曾担任《斯坦福评论》的编辑，乔·朗斯代尔曾是PayPal的实习生，比科恩早两年担任《斯坦福评论》的主编。团队的高级成员内森·格廷斯20多岁快30岁的样子，曾为列夫琴的反欺诈行动工作，他毕业于伊利诺伊大学。", "蒂尔给这个项目取名为“帕兰提尔”，是源于《魔戒》中的那些古灵精怪的帕兰蒂魔石，它们可以让作品中的角色观察到遥远的事件或看到未来。这是一个奇怪的选择：虽然托尔金笔下的帕兰蒂魔石很强大，但它们并非完全的善良。在书中，这些石头主要为撒旦式的邪恶角色索伦使用，他渴望征服中土世界，从事间谍活动，与阴谋家沟通，或者操纵其他人，而他们并不知道这些石头是危险的。", "正如蒂尔向早期员工和潜在合作伙伴解释的那样，他的想法是通过挖掘政府几乎无穷尽的海量数据，包括财务记录和手机记录，再利用网络分析来找出恐怖分子。从公民权利的角度来看，这种做法在很多方面都明显存在问题，但这一点没有被提及；事实上，人们认为这也许与“9·11”事件前的隐私准则相悖，但在后“9·11”事件的世界里，这完全没问题。“涉及个人的这类信息有很多，我们想要了解它。”某个听过蒂尔解释的人这样总结道。", "至2004年，“9·11”事件委员会的报告已经明确指出，在袭击发生前的几年里，如果特工们哪怕只是稍微多重视一点儿政府已经搜集到的有关嫌疑人的信息，美国执法和情报机构就可以事先抓获一些劫机者，甚至瓦解其阴谋。袭击发生前不久，美国逮捕了萨卡里亚斯·穆萨维，他显然是一名宗教极端分子，还曾尝试学习如何驾驶波音747飞机，但后来未能将他与“基地”组织或正在策划当中的阴谋联系起来。蒂尔的想法是改进Igor系统，并将其出售给当时过分紧张的间谍机构。美国联邦调查局在20世纪90年代末曾利用Igor寻找洗钱者。为什么不把它卖给中央情报局呢？看看他们能不能找到恐怖分子。", "格廷斯建起一个早期原型，并开始向潜在投资者和客户展示。反馈十分明确：想法很有趣，但永远不会奏效。PayPal的数据库非常复杂，似乎涵盖了来自世界各地的买家和卖家，其中一些拥有信用卡，另一些拥有银行账户；与由美国中央情报局、国家安全局及国防部运维的迷宫一般的数据库相比，PayPal的数据库简单明了。", "与防止金融欺诈不同，情报工作非常混乱。它由人类分析员撰写的报告组成，他们有自己的想法和风格缺陷。在PayPal，用户要么是信用卡诈骗者，要么是易贝的普通用户；在情报界，对于一个人是否构成威胁或两个人之间是否有联系，分析员们通常持不同意见。此外，情报数据存储在数十种不同的软件和硬件设备中，其中许多基本上是互不兼容的。分析员可能会同时访问IBM大型机、甲骨文数据库或笔记本电脑上电子表格中的数据。这意味着蒂尔设想的方案需要大量员工清理和处理进入系统的所有数据，这样的更新升级几乎毫无效率可言。即使这样，数据也会模棱两可。", "至少对格廷斯、朗斯代尔和科恩来说，情况就是这样的，但蒂尔并没有被吓倒。一天早上，当许多员工外出工作时，他开车到帕洛阿尔托的大学俱乐部去见他在斯坦福大学法学院就认识的亚历克斯·卡普。在几乎完全由忠诚的保守派和自由意志主义者组成的“蒂尔江湖”里，卡普是个不寻常的人。卡普有自由意志主义的信仰，但他认为自己是自由派，而非保守派，在一群有抱负的巴克利追随者中，他显得格格不入。在上斯坦福大学法学院之前，他曾就读于哈弗福德学院。哈弗福德学院是位于费城郊外的一所小型文理学院，基本上与野心勃勃的斯坦福大学截然相反，所以几乎从一开始，卡普在法学院的日子就极不好过，这令他成为一个局外人，就像蒂尔一样。正是这种共同的厌世心理，而非他们的政治观点，成为他们友谊的基础。", "卡普和蒂尔从法学院毕业后就断了联系，因为卡普去了德国的法兰克福大学学习。（他后来告诉人们，他曾师从法兰克福学派哲学家尤尔根·哈贝马斯，不过他的博士学位是从法兰克福大学另外一个系获得的。）在从祖父那里继承了一笔不甚丰厚的财产之后，卡普将它用作种子资本，将自己重新塑造成投资者。卡普作为哲学家可能是失败者，但作为资金筹措人，他精力充沛，有着狂野的发型和与生俱来的面对观众表演的能力。他从少数局外人那里筹集到资金，成立了以古代英国诗人凯德蒙的名字命名的凯德蒙集团公司（凯德蒙也是卡普的中间名）。", "卡普在柏林过了一段放荡不羁的生活，然后就回国了。他一边继续投资，一边又在一家非营利性机构兼了一份发展官员的工作。他还重新与蒂尔取得联系，蒂尔问他是否可以为另一个基金筹集资金，这是一个投资于科技初创公司的基金。一开始并不容易。蒂尔是一位成功的企业家，但他没有风险投资家的过往记录，因此卡普发挥了他怪异的天才品质，把蒂尔描绘成同路的盟友——既古怪又聪明，并把相对缺乏经验变成了一个卖点。在卡普看来，蒂尔很古怪，但很聪明，这一点对其以后的职业生涯大有好处。但蒂尔现在想要的不仅是让卡普帮他筹集资金，他想把这个基金交给卡普来管理，卡普当场接受了。", "尽管卡普作为一名推销员表现极为出色，但他早期为帕兰提尔筹款的努力大多以失败告终。莫里茨自然表示拒绝，另一家硅谷顶级公司凯鹏华盈也拒绝了。帕兰提尔在华盛顿的运气更好，蒂尔在这里主要依靠他在PayPal建立的人脉，并主动结识了布什政府在反恐战争中大量使用监控措施的关键设计师。其中包括里根的白宫顾问约翰·波因德克斯特，他被控在向伊朗秘密出售武器的问题上对国会撒谎。波因德克斯特就此上诉并获胜，并被副总统迪克·切尼招募进行反恐行动，重新开始了他的职业生涯。波因德克斯特是布什政府“全信息识别”项目的策划者，该项目涉及搜集大量数据，并试图找到可能暗示恐怖主义的模式。对公民自由权倡导者来说，这是一场隐私噩梦，因为它有可能构成对所有美国人的监视，该计划于2003年正式终止。", "波因德克斯特认为蒂尔和卡普为人傲慢，但他喜欢他们的想法，并对他们向他展示的可视化说明印象深刻。波因德克斯特作为非正式顾问参与协助帕兰提尔项目，这为他们在华盛顿建立了更多的联系。蒂尔和卡普与新近卸任的布什政府中情局局长乔治·特尼特交上了朋友，并在中情局风险投资公司In-Q-Tel招募了投资人，该公司于2005年根据一个粗略的原型投入了200万美元。唯一的其他主要投资者就是蒂尔本人，他通过罗斯个人退休账户投入了一些资本金。", "帕兰提尔最终在位于帕洛阿尔托大学大道的脸书旧总部设立了一个办公室，并围绕隐私重塑了自己的品牌。该公司仍将帮助政府挖掘海量数据，这仍存在侵犯普通美国人隐私的潜在风险，但该公司添加了软件，以跟踪哪些信息正在被访问及被谁访问。这一系统后来被称为“Gotham”，每次分析员在查找某个信息时，系统都会创建一个记录。从理论上讲，这会阻遏政府使用该系统查找个人的详细信息，如果确实发生了滥用情况，也可以审查。这是卡普为解决日益高涨的公民自由权对《爱国者法案》的强烈反弹而采取的策略，他坚信如果没有保护公民自由权的策略，帕兰提尔是不会成功的。", "在随后的几年里，蒂尔强烈暗示，他从一开始就支持保护隐私的措施，但事实上他起初对此持怀疑态度，认为没有人会相信声称保护隐私的产品会真正起作用。卡普赢得了蒂尔的支持，帕兰提尔的隐私记录将成为该公司向公众宣传的核心内容。卡普似乎很诚恳，但不清楚客户对这个想法的认真程度。帕兰提尔的一位前工程师回忆说，在那些客户见面会上，刚刚听完有关个人隐私保护的长篇大论之后，有的政府客户就立即请求使用数据库查找前女友。这位工程师说，帕兰提尔的员工永远不会拒绝这些请求。相反，他们会提醒客户搜索已被记录，然后允许他们查找他们想要查找的任何人，不管其借口是多么站不住脚。", "帕兰提尔的高管们以其他方式推动了道德边界的设立。根据i2公司提起的诉讼，2006年，帕兰提尔的业务开发主管希亚姆·桑卡尔冒充一家安全公司的创始人，从这家更成熟的竞争对手公司购买了软件。帕兰提尔表示，并没有发生任何不当行为，但最终还是支付了1 000万美元的和解金。", "大约在这段时间，蒂尔参与了另一项促销努力。他请乔·朗斯代尔开发帕兰提尔的另一版本，以便用于对冲基金，通过它来分析其投资组合，克莱瑞姆就是供测试的客户。尽管Palantir Finance", "并没有真正发挥作用，并且一位高管还将之描述为“一场灾难”，但它有助于卡普向政府机构证明帕兰提尔值得购买。", "“如果只想着卖给政府，那你一定在政府那儿卖不出去，”一个熟悉此项目的人说，“政府永远不想成为唯一能让公司生存下去的客户。我不想说这是一个诡计，但那确实是经过深思熟虑的戏码。”", "这段描述凸显了帕兰提尔早期许多产品的特点。多年来，帕兰提尔的情报软件实际上毫无用处，算不上真正的产品，最多就是一个演示品，但美国政府不顾一切地想避免再次发生“9·11”事件，并愿意扶持一个由一些头脑明显聪明的人在幕后支撑的有希望的创意。慢慢地，该公司赢得了几份合同，与其他几家情报机构一样，曾为帕兰提尔提供资金的中情局也开始试用其软件。在2005年左右，当硅谷大部分的企业仍然受到网络泡沫破灭的影响，而唯一成功的那些公司也就搞出了一套被称为Web2.0的小型社交媒体应用程序之际，能做到这样也就足够了。当时，图片分享网站Flickr和掘客网站Digg是旧金山湾区炙手可热的两家公司，所以帕兰提尔的招聘人员会这样询问有前途的学生：“当可以致力于保护人们的安全时，你为什么还要去开发照片分享应用程序或帮助跟踪你书签的网站呢？”", "在“9·11”事件之后，纽约警察局的运作更像是一个情报机构，他们也购买了帕兰提尔的使用许可。这项交易没有什么意义，纽约警察局最终会放弃帕兰提尔，但这件事足以引起摩根大通的杰米·戴蒙的注意，他在2009年邀请卡普向该银行推介其服务。", "卡普与银行高管一起喝酒，不仅成功地推销了帕兰提尔的主要安全产品，还成功地推介了朗斯代尔日渐失败的Palantir Finance。员工们都知道，卡普是一位优秀的推销员，他“人畜无害”的模样令人不设防，经常穿着越野滑雪装备就直接出现在会面场合。但这次的大功直接促成了一份每年1 000万美元的合同，被视为反地心引力之举。帕兰提尔的商业团队负责向私营部门销售该公司的软件，最终获得了一个新的代号——“盗梦空间”，源于克里斯托弗·诺兰执导的一部关于公司间谍在目标潜意识中植入想法以操纵目标的电影。", "帕兰提尔很酷，甚至可能还有点儿危险，这种感觉可以从身着T恤衫的人们开始围着帕兰提尔那间办公室转来转去中总结出来，那间办公室使人联想到惊悚电视剧集《24小时》。在该剧的每一集中，异常强悍的情报官员杰克·鲍尔都能够疯狂地铤而走险，在24小时内拯救美国免遭灾难性的恐怖袭击。“如果杰克·鲍尔有帕兰提尔，”T恤衫们宣称，“他们就得改称这部剧集为《1小时》。”", "尽管如此大张旗鼓，但仍不清楚帕兰提尔是否在做它所声称的事情。最初的“盗梦空间”交易对摩根大通来说并不顺利，在得知该公司安全团队的一名成员一直在使用帕兰提尔查看员工的私人数据，甚至以此作为监视员工的借口后，摩根大通减少了对该软件的使用。正如《彭博商业周刊》报道的那样，帕兰提尔并没有努力阻止这种滥用行为。毕竟，该公司客户利用该软件做什么是客户自己的事。", "如果说帕兰提尔曾是一种努力，即重新配置PayPal背后的安全技术，并将其提供给布什政府进行反恐战争的话，那么蒂尔的风险投资公司——创始人基金就将是另一种努力，即将他自认为从PayPal学到的关键管理经验转化为一种投资理念。", "创始人基金一开始只是克莱瑞姆的一个分支，最初在与蒂尔的对冲基金隔着大厅相对的办公室里运营。它的员工包括PayPal前员工卢克·诺塞克、肯·豪厄里及刚刚离开脸书的肖恩·帕克。帕克是在有争议的情况下离开的，2005年年中，他因涉嫌在租用的海滩别墅里私藏可卡因而被捕，当时他与其在脸书的助手合住在这栋别墅里。尽管他否认有刑事不法行为，而且从未被起诉，他还是辞职了。", "如果这些滥用毒品的指控（以同样的理由，莫里茨也将他赶出了Plaxo）损害了他在硅谷某些角落的地位，那么蒂尔选择将帕克的名声视为一种资产，并利用帕克的“坏男孩”形象将创始人基金与被视为硅谷顶级公司的红杉资本区别开来。蒂尔大肆渲染帕克阻止红杉资本投资脸书“是因为他们不能公平地对待他”，并暗示帕克的批评者不喜欢他是“因为他太成功了”。所有这一切令莫里茨大为恼火。当我问到蒂尔是如何定义帕克与红杉资本的关系时，莫里茨说：“这段叙述被刻意地严重扭曲了。肖恩当时有严重的毒品问题，几乎很少到公司来上班。他的联合创始人想要他离开，肖恩让我们别无选择。这是任何投资者都最不愿意做的事情。”帕克曾经说过，这是“抹黑运动”的一部分。莫里茨没有回应置评请求。", "与他所描述的红杉资本正好相反，蒂尔的公司承诺永远不会解雇创始人，他还吹嘘创始人基金正在寻找“风险更高、更创新、真正有潜力改变世界的公司”。这是一个很好的品牌化举措，新闻界开始把蒂尔写成一个敢于承担风险责任的投资家，正如《旧金山纪事报》所说，他开创了一个崭新的行业——“风险投资2.0”。", "然而，蒂尔私下可能是保守派，有时是冷淡的马基雅维利主义者。他最早的交易之一是和巴尼·佩尔做的，此人是他在斯坦福大学的老棋友，已经创立了一个新的搜索引擎Powerset。这是一次大胆的赌博，号称“谷歌杀手”，所以非常符合创始人基金风险承担的品牌理念，尤其是红杉资本在早期还投资过谷歌的背景下。在宣传这笔交易时，蒂尔和帕克大肆宣扬他们对创始人非常友好的做法，还引述佩尔关于创始人基金对企业家的利益更敏感的赞扬之词。但不到一年，该公司就陷入困境，佩尔从首席执行官被降级为首席技术官，蒂尔也从董事会辞职。", "一道类似的鸿沟横亘在创始人基金的营销之道与蒂尔和埃隆·马斯克的交易现实之间。当蒂尔还在创建他的投资公司时，马斯克已经着手开发可以与最快的燃油动力汽车正面抗衡的电动汽车。说来似乎没有可能，但特斯拉汽车公司确实成功了。到2006年，特斯拉开始试驾其跑车原型，它可以在不到4秒的时间内从0加速到每小时约97千米。", "在此之前，该公司几乎完全依靠马斯克在PayPal的盈利维持。但随着汽车接近投产，马斯克需要资金，遂询问蒂尔是否有兴趣投资。蒂尔一口回绝，这表明他不愿投资的部分原因，按马斯克的话来说就是“他并不完全认同气候变化的观点”。由于蒂尔拒绝投资，并且选择了自己的政治偏见，而不是马斯克的大胆一搏（更不用说主流气候科学提供的压倒性证据），他输惨了，失去了在一家2020年年底前市值为8 000亿美元的公司拥有大量股份的机会。马斯克将这笔交易交给了优点资本，而不是创始人基金。优点资本是一家鲜为人知的公司，以投资绿色能源公司而闻名，它最终在特斯拉上市时持有其9%的股份。", "马斯克倾向于私下接受任何非难，而蒂尔的公然拒绝似乎使本来就别扭的关系变得紧张起来。马斯克投资了克莱瑞姆公司和影片《感谢你抽烟》，其部分原因就是为了掩饰对于那次“政变”不好的感觉，他说：“常言道，冤家宜解不宜结。”但在2007年，他开始抱怨在PayPal的历史记录中他被彻底抹去了。几年前，蒂尔曾资助《斯坦福评论》前编辑兼营销人员埃里克·杰克逊出版了《支付战争》。在一封写给新近落户于硅谷并抨击蒂尔的科技八卦博客“硅谷闲话”的信中，马斯克称呼杰克逊为“马屁精”，并抱怨在《支付战争》一书中“彼得听起来就像是《勇敢的心》中的梅尔·吉布森，而我的角色却介于微不足道和坏种之间”。", "当《财富》杂志召集“PayPal黑帮”拍摄一张《教父》主题的照片时，蒂尔的做派酷似马龙·白兰度饰演的唐·柯里昂，马斯克则以事先有约为由回避了照片拍摄。“彼得的理念很奇怪，”马斯克当时说，“这不正常。从投资的角度来看，他是一个逆势而上的投资者，对奇点做了大量思考。我对此不太感冒，我更相信人的因素。”", "但随着全球经济步履蹒跚，马斯克需要蒂尔的帮助。他的SpaceX曾在2006年和2007年尝试发射，但两枚原型火箭都在进入地球轨道前爆炸。现在他已经没有现金，并开始试探蒂尔和创始人基金的卢克·诺塞克的态度。蒂尔对这个想法很冷淡，导致他与诺塞克之间爆发了争吵，这件事在“蒂尔江湖”成了传奇。“卢克为此付出了很多。”马斯克说。诺塞克赢得了这场争辩，最后蒂尔也让步了，为马斯克的太空事业投入了2 000万美元。", "2008年8月，第三枚SpaceX火箭爆炸后，马斯克利用这笔资金坚持了下来。“SpaceX将在进入地球轨道和展示可靠的空间运输方面占据上风，这一点绝对没有问题，”他在发射失败后不久这样表示，“对我来说，我永远不会放弃，我是说永远。”一个月后，他成功了，SpaceX成为第一家将火箭送入地球轨道的私营公司。", "这次发射对马斯克和蒂尔来说都是一个转折点，马斯克走上了一条使其初创公司成为主要的太空探索公司的道路，也使作为投资者的蒂尔首次获得了清楚无误的胜利。他投资了两个快速成长的国防承包商，这个故事甚至比他所讲的对冲基金经理的故事还要好。他不仅是一个拥有数十亿资金的逆势投资者，还是一个风险承担者，把宝押在最疯狂的技术和最大胆的创始人身上，他本人在华盛顿特区的影响力也越来越大。", "这一人设将定义他未来十年的职业生涯，即使其中包含明显的矛盾：一个实际上做空美国经济的对冲基金人，怎么可能同时是一个视野开阔的未来主义者？什么样的自由意志主义者会向中情局出售间谍技术？什么样的疯狂风险承担者会拒绝向特斯拉做早期投资？这些矛盾，再加上蒂尔的自负，使他容易受到下决心要揭露这些矛盾的人的攻击，而就在此时，一家新晋的传媒类博客——高客传媒正打算这么干。", "Palantir Finance后改名为Palantir Metropolis，主要是为金融业设计，帮助进行欺诈检测。——编者注"], "wcount": 8189}, {"icon": "9", "title": "第9章 新疯狂而准确的预测，放手管理模式的胜利", "paras": ["“玛丽莎·梅耶尔曾经和拉里·佩奇约会。是的，我们说的。”", "2006年，高客传媒就是这样来到硅谷，并声嘶力竭地叫喊着权力、性和伪善。在一篇关于佩奇（谷歌的联合创始人）和梅耶尔（谷歌的高层管理者）之间浪漫关系的文章中，高客传媒针对有关媒体对科技行业的谄媚报道的争论放出了一则低俗的八卦爆料。“真正尴尬的是硅谷人微言轻的记者团，”高客传媒的新硅谷博客“硅谷闲话”继续写道，“吃惯了那些经过包装的奇闻逸事。哦，对了，你知道吗？谷歌曾聘请一位厨师随感恩而死乐队旅行——他们就没能力去咀嚼真实的事件了。”几天后，“硅谷闲话”曝光了另一段被指出轨的感情，涉及已婚的首席执行官埃里克·施密特，这再次被定调为媒体批评。", "这是高客传媒创始人尼克·丹顿自创立该公司以来的一贯做法，该公司还运作一些涉及政治、媒体和好莱坞的违规网络出版物。高客传媒，正如丹顿喜欢说的那样，发表了许多人人都知道是真的却又不敢写的事情。其旗下的不同博客，包括报道纽约媒体的同名旗舰博客，以及Gizmodo（科技类）、Deadspin（体育类）、Wonkette（政治类）和Fleshbot（色情类）等，同《纽约邮报》第6版的八卦专栏或《太阳报》一样，都总是喜欢刨根问底且内容低俗。", "但高客传媒又不同于那些八卦刊物，因为它并非只关注政客和名人。作为传媒博客，高客传媒也发表涉及记者本身的八卦，尖刻地描述了新闻业界的大牌人物。它宣称《纽约客》的亚当·戈普尼克（犯有“知识分子的恶行罪”），指责《纽约时报》的戴维·卡尔是“咖啡因上瘾的灵长类动物”，并促使其另一个目标、《纽约》杂志的瓦妮莎·格里戈里亚迪斯撰写一篇题为“每个人都很糟糕”的长篇文章。尽管该网站的评论刻薄，但往往也很有趣，主流媒体对过度讽刺所表现出的歇斯底里只会吸引更多读者的注意。至2006年年中，仅高客传媒一家每月就吸引了900万的浏览量。", "与高客传媒相比，“硅谷闲话”的规模较小，但它对丹顿来说很重要。丹顿毕业于牛津大学，曾为英国《金融时报》报道硅谷。2006年11月，他接手了“硅谷闲话”。“硅谷，”他说，“无论好与坏，都是新世界的中心。”", "丹顿领导下的“硅谷闲话”透露出典型的恶毒和愤世嫉俗，但有一件事它说对了：对于审视科技巨头掌门人这一新崛起的阶层，硅谷的记者们几乎什么也没有做。其中部分原因是很自然的，因为从传统上来说，技术新闻大多是报道一些技术创新，而想要报道这些就需要接触到它，这意味着必须不断地请求人家同意。涉嫌对苹果进行负面报道的记者经常会被禁止出席产品发布活动，也会被从观摩演示的参加者名单中删掉，最糟糕的是被史蒂夫·乔布斯彻底屏蔽，他只和那些能够使苹果公司在投资者和公众面前保持负责任形象的记者维持密切的个人关系。报道方兴未艾的互联网初创公司的业内记者通常都认为自己是硅谷技术发展的参与者，而非旁观者；他们自己也会投资初创公司，或者从其冠冕堂皇地报道过的风险投资公司那里为自己的媒体筹集资金。", "这种情形对像蒂尔这样的人来说很好，他被描述成一个古怪但有趣的人，而不是一个保守派的煽风点火者。其实，他是乔治·W.布什政府的中情局的主要商业伙伴，也是一家拥有10亿美元航空航天公司的主要投资者，同时主张在美国和伊斯兰世界之间建立截然不同的关系。但在2007年曾造访克莱瑞姆办公室的著名科技作家卡拉·斯威舍看来，蒂尔就是“硅谷最有趣的风险投资家、全能的伟大人物”。", "“我得说，彼得，你很有品位！”斯威舍热情地赞扬蒂尔的办公室，后来又在采访中说，“我喜欢你积极的态度。”", "丹顿尊重蒂尔，但并不喜欢他。两人拥有相同的自由意志主义的世界观，同样对精英教育机构持极端怀疑态度，并愿意公开抨击这些机构。例如，似乎跟蒂尔一样，丹顿对常春藤盟校和《纽约时报》也是不屑一顾。和蒂尔一样，丹顿也心怀大志，这也许就是他能理解蒂尔绝不只是一个古怪的富人（他正在为权力奠定基础）的部分原因，而这一点其他媒体是看不到的。", "丹顿也是同性恋，但与蒂尔不同的是，他毫不掩饰自己的性取向。“也许因为我是同性恋，我从小就讨厌公开的秘密，”丹顿后来说，“通常如果一个人是同性恋，那差不多就是尽人皆知的秘密。他们的朋友知道，他们的家人知道，但出于某种不合时宜的体面，没有人谈论它。一般来说，我的观点是，让我们把它讲出来。真相会让你自由。”", "所有这一切令丹顿对彼得·蒂尔几乎构成了独特的危险，因为蒂尔并没有大范围与人分享有关自己性取向的信息，他的父母和朋友都很保守，他在中东国家也有投资者，而在那里同性恋是绝对的禁忌。蒂尔花了数年时间精心打造不同版本的自己，并将它们呈现给不同的支持者。对华尔街而言，他是睿智的逆势对冲基金经理；对硅谷来说，他是一个只关心赋予年轻创业者权力的风险承担者；对于华盛顿特区，他就是能把我们从恐怖主义中拯救出来的技术天才。这些都是刻意打造出来的，尼克·丹顿的任务就是要让它们暴露于光天化日之下。", "“硅谷闲话”在2006年对蒂尔的早期报道是典型的科技媒体的做法，该网站曾惊叹于他古怪的慈善捐款和作为投资者的成功。但丹顿在当年年底到来后，该博客变得更加多疑，在早期的一篇文章中，丹顿称蒂尔为“一位已蜕变为投资天才的创始人”。", "丹顿很擅长键入可能破坏这段叙述的信息，他发表了马斯克在PayPal的“一段别样历史”，并告诉读者他们最喜欢的古怪风投家与基思·拉布瓦在斯坦福喊出来的恐同诽谤有关。“硅谷闲话”给他取名叫“基思·‘带着艾滋去死’·拉布瓦”。丹顿还抖出了蒂尔的“放纵弱点”，这与肖恩·帕克涉嫌滥用可卡因有关，他嘲笑了“洞窟”——一座创始人基金的两个合伙人共同拥有的派对房子。", "高客传媒最终为“硅谷闲话”聘请了一名全职编辑，丹顿也回到高客媒体继续承担管理工作，但他的技术博客继续批评和嘲笑“蒂尔江湖”里的所有人，并且开始暗示蒂尔的性取向。2007年7月，同为同性恋的新编辑欧文·托马斯有所隐喻地提到“7月4日在蒂尔家举行了盛大的聚会”。接着，同年10月，该网站注意到蒂尔在田纳西大学查塔努加分校发表了一篇演讲，却未能吸引到大量听众，这是标准的“硅谷闲话”式挖料。但接下来，托马斯又提到一个想要签名的单身女孩，他说：“如果那个女孩想要的不只是蒂尔的签名，那她一定会收获双倍的失望。”之后，托马斯又再次回到这个隐喻上，针对一位男性房地产博主称蒂尔“如梦似幻”，他继续发挥：“是哦，我们得说他真够帅的。不管怎么说，我们真不愿意对你挑破……但蒂尔就是。他要真的不是，你就比那个排队要他签名的田纳西女孩更有机会。”", "托马斯告诉我，写这些都是为了开玩笑，因为蒂尔的性取向在当时已经是公开的秘密。托马斯，还有许多旧金山的科技和金融圈的人都知道蒂尔有一个男朋友，是贝莱德集团的副总裁马特·丹泽森。他住在纽约，蒂尔在纽约有个家。丹泽森飞往加利福尼亚州参加在蒂尔家举行的克莱瑞姆圣诞聚会，而且托马斯在Friendster上看到了蒂尔的个人简介，明确无误地表明他对男性有兴趣。一位在蒂尔手下工作多年的前雇员表示：“这连公开的秘密都算不上，它本身就不是秘密。”", "蒂尔从来不是一个忽视潜在对手的人，于是他开始要求员工想办法让高客传媒别再找他麻烦。一位曾参与此事的克莱瑞姆的知情人士告诉我，公司曾访谈过安全专家，还一度雇用了一家私人调查公司，力图挖到丹顿在个人生活和财务方面的黑料。这开启了一场完全符合极右政治的卑鄙下作的暗中行动，而且持续了十年之久。可惜未能如蒂尔所愿，这些私家侦探没能找到任何有用的线索。丹顿，正如他所说，昭昭然如一本翻开的书。", "12月，托马斯明确表示，他这一年来一直在委婉地暗示什么。“彼得·蒂尔就是一个彻头彻尾的同性恋，伙计们”，他的标题这样写着。做这样一个报道的想法出自丹顿，他向托马斯提起，说这也许是“硅谷闲话”可以报道的一个选题。托马斯觉得这个任务还算合理，因为他完全赞成将身份密柜彻底敞开。托马斯说：“在我看来，所谓存在一个人们在或不在其中的身份密柜的假设，整个就是异性恋正统主义问题的具体化。”在这种观点中，隐瞒自己是同性恋的做法只会令不平等和歧视永久化。丹顿提议的这种揭秘在当时并不罕见。六个月前，主打同性倾向的时尚杂志Out的封面以“玻璃密柜”为题刊登了有关安德森·库珀和朱迪·福斯特的文章，众所周知，这两位名人都是同性恋，但他们从未公开过自己的同性恋身份。", "托马斯将其帖子搞成了对硅谷的不宽容现象的评论。他说，科技人员能接受各种各样的逆向思维，但出于一些看似奇怪和虚伪的原因，他们对待性却有点儿假装正经。托马斯认为，这是一种软性的偏执。风投家并不是完全憎恶同性恋，但他们通常会拒绝投资同性恋创始人，因为他们担心其他更为保守的交易者，比如后期的投资者、客户、银行家无法容忍。蒂尔作为一个同性恋亿万富翁和逆向投资者，无须担心那些二流的偏见，这就是他能够在某种程度上公开自己的同性恋身份的原因：", "你认识的出柜的同性恋风投家能有几个？我认为这解释了很多与蒂尔有关的事情：他对传统的蔑视，对推翻既定规则的追求。就像一个世纪前创造了好莱坞的犹太移民一样，同性恋投资者无法融入旧体制，这促使其建立一个不同的、有望更好的体制来识别和奖励有才能的人，并将他们的成就释放到全世界。这就是为什么我认为有必要说出：彼得·蒂尔，世界上最睿智的风投家，就是同性恋。让他更有力量吧。", "托马斯并不认为这是一次传统意义上的出柜。他认识的每个人就和克莱瑞姆的每个人一样，都知道蒂尔的性取向。相反，托马斯坚持说，他就是在打破一个假正经的禁忌，硅谷的其他人却还在不必要地尊崇这个禁忌。蒂尔并不在柜中，是他的同行们实际上选择了将其藏在柜中。“这是一个奇怪的保守行业，”托马斯这样对我说，算是对他当时的想法的总结，“我们来谈谈这个吧。”", "这篇文章并没有被广泛阅读，最初发表时浏览量只有1 000次左右，即使以“硅谷闲话”这样的小博客的标准来看，也算是“垃圾”。它也没有在新闻界引起多大的轰动。高客传媒发表的内容经常会推测那些尚未出柜的公众人物的性取向，包括安德森·库珀，甚至在蒂姆·库克公开出柜的几年前就揭秘了他。蒂尔的一名代表私下向托马斯抱怨，但托马斯说他从未因揭秘蒂尔的身份而受到指责，他认为不存在任何感情上的伤害。几天后，托马斯发表了一篇另一高客传媒写作者的模仿之作，说蒂尔钟情于安·兰德：“彼得·蒂尔是个彻头彻尾的客观主义者，伙计们！”在一篇后续跟帖中，该网站称蒂尔是“公开的客观主义者”。", "起初，蒂尔在克莱瑞姆并没有让自己的愤怒显露出来。没有人会认为蒂尔是个有秘密的人，而且公司发展一直顺风顺水，以至于大多数员工压根都没有意识到老板还是“柜中人”，也就更不知道他还出柜了。蒂尔是《华尔街日报》和《巴伦》周刊的常客，相比之下，“硅谷闲话”简直微不足道。第二天，办公室里没有人谈论这件事，大多数员工都还幸福满满地没有意识到有些不稳定之事已然发生。", "但私下里，蒂尔感到非常震惊，尤其是在他看到丹顿在文章底部的评论区留下的加注之后。丹顿写道：“蒂尔的性取向唯一奇怪的地方就是，究竟为什么这么长时间以来，他一直对同性恋身份被发现如此偏执？”蒂尔对此话深有所悟，在他看来，这是一种含蓄的暗示，是在说他的心理不稳定。在蒂尔看来，丹顿并不只是揭开了他的秘密，而是以一种体现了自由派精英最恶劣冲动的方式揭开了他的秘密。这一博客暗示，若想要生活于隐私中（至少在一定程度上），那一定是什么地方不对了。这既残忍又不公平。", "蒂尔很恼火，这可能就是在接下来的1月，他做了一件在员工看来几乎无法理解的事情的原因。他把克莱瑞姆的交易员们都召集起来，告诉他们，他将把该基金迁移到纽约去。员工可以随公司搬家，也可以获得可观的遣散费。蒂尔说原因很简单：“你如果想成为电影明星，就搬到好莱坞去；你如果想成为政治家，就搬到华盛顿去；你如果想成为对冲基金经理，就搬到纽约去。”", "这些话出自一个反向投资者之口，听起来就更别扭了。毕竟，克莱瑞姆才刚刚从旧金山市中心迁出，据说是为了远离对冲基金的客户群，现在蒂尔却声称想要加入他们。其中真正的原因，一些员工后来才逐渐明白，就是出于个人的考虑。“他从来没有说过，但真正的原因就是高客传媒，”其中一人说，“他想逃之夭夭。”", "与此同时，蒂尔向克莱瑞姆的投资者发出了一封热情洋溢的信，描述了该公司的经济前景。克莱瑞姆经常这样做，但一般是分析师来写，这回是蒂尔首次亲自写信，结果非常极致。在这篇一万字的文章《乐观的思想实验》中，蒂尔认为世界正走向终结时代。投资分析师通常使用宗教隐喻，会说债券收益率的“基督再次降临”或股市“毁灭”，但蒂尔并不是在打比方，他写道：“整个人类秩序终究会崩溃于冷酷无情的暴力升级，即饥荒、疾病、战争和死亡……面对如此的未来，拯救不朽的灵魂并积累财富于上天，于永恒的上帝之城，要远远好过积聚转瞬即逝的财富于短暂而消亡的人类之城。”他通过历史的论述和对《启示录》引文的自由运用来证明这一点。", "蒂尔指出，由于投资者不能期望在未来一切都会崩溃的情况下还能获利，他们会继续系统性地高估一切，导致房地产、科技和金融泡沫的出现。文章的标题反映了蒂尔所认为的最佳情况，即在“乐观的”未来会出现抵御全球化和灾难性的金融危机的政治反冲力。在这种情况下，可以有许多种赚钱的方法，比如克莱瑞姆就可以做空股票，但蒂尔把重点放在最坏的情况下，建议以祈祷和忏悔来代替投资分析，从而削弱了这一分析。“全球化及其替代品之间的争斗将是势均力敌的，至少在个人的选择将被证明是至关重要的这个意义上是这样，”他总结道，“有鉴于此，我们反对对有效市场的主导信念。然而，与对有效市场的信念不同，我们的信念似乎仍无法命名。”", "朋友们认为，这证明了蒂尔的无畏及思想的独创性，事实也的确如此。客观地说，作为一封致投资者的信，这也太离谱了，几乎相当于金融行业自杀前的遗书。蒂尔向2008年年中之前对他信任有加并将80亿美元托付给他的那些机构坦承他没有信心保住他们的这笔钱。", "就在这时候，在一次全体人员会议上，蒂尔预测市场将会“爆雷”，并警告员工，克莱瑞姆用来进行股票交易的经纪人可能会崩溃。克莱瑞姆将不得不立即转向持有现金，并应考虑其他措施。一位分析师建议他们购买金砖并埋起来，另一名前雇员回忆当时的心情说：“这就像某种安·兰德式的狂热之梦。”", "这场狂热之梦传遍了“蒂尔江湖”。与此同时，乔·朗斯代尔出现在位于帕洛阿尔托的帕兰提尔总部，命令管理人员从公司账户中取出10万美元。他们的想法是，一旦美国经济全面崩溃，只要手头有现金，员工们就不会挨饿。“我们为每人准备了1 000美元，”帕兰提尔的一名工作人员说，“他们认为世界末日即将来临。”", "事实证明，蒂尔的疯狂预测在很大程度上是正确的。9月15日，曾在美国内战、大萧条和“9·11”事件中幸存下来，但一直积极承销与次级抵押贷款相关证券的华尔街金融机构雷曼兄弟破产，并申请破产保护。当月晚些时候，成立于1889年，并于21世纪头几年还吹嘘自己将成为银行业沃尔玛的华盛顿互助银行也倒闭了，引发了一场银行挤兑。", "一场严重的经济衰退随之而来，普通民众失去了工作，被无法偿还的抵押贷款牢牢困住，失去了自己的家。那些预见到这种苦难并发现利用这种苦难进行交易的基金经理们暴富得令人瞠目结舌，其中最出名的就是约翰·保尔森，他在市场崩溃时购买了40亿美元的信用违约互换，这激发了格里高利·祖克曼的创作灵感，出版了《史上最伟大的交易》一书。不知名的对冲基金经理史蒂夫·艾斯曼也干了一票类似的豪赌，并因迈克尔·刘易斯的《大空头》一书而闻名。", "但蒂尔并没有致富，这正是因为他无法将自己的伟大想法转化为交易策略。用其前同事的话来说，这不是想象力的失败，而是管理的失败。早期的一位雇员说：“这是太阳王的王宫。”另一位则表示：“我们的组织结构不是为了寻找微观机会。我们本可以做大空头的，也看到了一些类似的机会，却没有好好利用。”", "在PayPal，蒂尔允许员工在几乎完全自由的情况下运作，其结果是惊人的。PayPal开发了独创性的反欺诈算法、具有开创性（虽然在道德上存疑）的病毒式增长机制，以及一种狡猾的企业发展战略，从而迫使易贝在科技行业崩溃之际将其全部收购。这是蒂尔放手管理模式的胜利。但在克莱瑞姆，交易员和分析师做得太过分了，他们看着蒂尔想出一个出色的反向投资论点，却并没有按照蒂尔的世界观来进行投资，而是在他最初的反向投资想法的基础上再设计反向投资。", "知情人士提到，他们“想得太多”，“试图抓住那把刀”。克莱瑞姆曾考虑做空银行，但最终认为这是一个坏主意，因为银行将被国有化，这实际上可能会推高它们的股价，挤压做空的空间。蒂尔认为，政府会在泡沫濒临破灭之前再次吹大泡沫。在2008年9月中旬雷曼兄弟破产而引发金融危机之前，蒂尔只把投资组合中的极小一部分投在公开交易的股票上。然而，他突然意识到，自前一年10月以来一直在贬值的股票现在已经跌无可跌，于是开始疯狂买入。他向谷歌和雅虎各投了8亿美元，并向一揽子银行股投了10亿美元，赌政府不得不出手相助时，它们都会反弹。", "事实证明，这些举动终结了他作为对冲基金经理的职业生涯。股市持续下跌，到2008年年底时，蒂尔已经把上半年赚的钱都赔光了。他错失了一大笔巨额利润，而这本来可以得自于他对金融行业正在崩溃的信念。至年底，他的资产下跌了大约5%。等到股市反弹的时候，蒂尔又开始抛售股票，错过了股市复苏的机会。一波赎回风潮放大了他的损失。养老金和主权财富投资者陆续从克莱瑞姆撤资，因此到年底，这个原本60亿美元的基金只剩下20亿美元，而投资者仍在要求收回他们的资金。", "虽然这可能是蒂尔的投资失误，但由于克莱瑞姆的实际表现要好于股市和大多数对冲基金，因此很难将赎回风潮归因于业绩不佳。（标准普尔500指数在2008年损失了近40%的价值，对冲基金的平均损失为18%。）此外，蒂尔关于股价将反弹（2008年12月开始）的预测是正确的，这要归功于美联储及布什和奥巴马两届政府的行动。他的预测离市场触底只差一两个月的时间。", "不管是对是错，蒂尔开始相信，导致大规模赎回风潮的真正原因是高客传媒。据其前雇员称，克莱瑞姆的一些大投资者都是阿拉伯国家的主权财富基金，全部由那些视同性恋为犯罪的政府控制。蒂尔从未明确承认过这一点，但他暗示过这就是他把自己的性取向隐藏起来的原因。“如果要谈论出柜，它可从来就不单纯是一个事实那样简单。”蒂尔在2018年的一次访谈中说，“绝不可能只是‘彼得是同性恋’，供你参考。而更可能是这样：彼得·蒂尔是同性恋，但我们不明白他为什么不想让我们谈论这件事。也许是因为他的父母还不知道，他们会感到难堪，也可能是他为了从沙特阿拉伯捞钱。”", "此外，正如托马斯后来所说，不仅是他那篇关于蒂尔性取向的文章让蒂尔觉得“自己被针对了”，高客传媒旗下的那些子公司继续故意刺激他和他的亲信，2008—2009年，他们从来没有错过一个机会来指出克莱瑞姆的失败，或者蒂尔最新的虚伪，以及肖恩·帕克最新的恶名。在2008年的马丁·路德·金日，“硅谷闲话”无事生非地指出，蒂尔最近向罗恩·保罗的竞选活动提供了一笔捐款，因为保罗与种族主义新闻媒体有关。同年9月，该博客指出，克莱瑞姆在脸书上的损失高达9亿美元，比蒂尔在脸书上赚的还多。在最近的一次科技大会上，甚至无人向蒂尔打听这些损失。2009年年初，蒂尔飞往瑞士达沃斯，这是一个向投资人阶层展示实力的关键机会，“硅谷闲话”称蒂尔是一个“所谓的有远见的人”，指出他的基金在过去6个月里缩水了50亿美元。2009年晚些时候，“硅谷闲话”声称蒂尔一直在夸大自己的净资产。", "在此期间，“蒂尔江湖”中的人们也说不清楚高客传媒到底是在报道蒂尔作为投资者的失败，还是通过削弱投资者对克莱瑞姆及蒂尔对自己的信心从而引发了失败。克莱瑞姆的一位前分析师在谈到2008年蒂尔公司的亏损时表示：“我个人认为他是因为遭受了严重的打击，被打乱了阵脚，要想扳回来很难。”", "硅谷也失去了一些信心。2008年10月，红杉资本开始分发一份题为“安息吧！好时光”的演示文稿，鼓励下属公司削减成本、保存现金，它暗示了对闪电式扩张剧本的拒绝。初创公司再也没有足够的资金毫不犹豫地购买市场份额，相反，他们必须创造收入。脸书似乎注定要进行首次公开募股，现在这已经不在讨论范围内。脸书从与克里姆林宫有关系的俄罗斯投资者尤里·米尔纳那里筹集了2亿美元。蒂尔要想通过首次公开募股实现公司股票的部分账面收益，还需要等上好几年。", "后来，2008年11月，在一场被视为否定布什执政时期国家安全政策的总统大选中，巴拉克·奥巴马轻松击败约翰·麦凯恩。奥巴马赢得了民主党的提名，部分原因是他反对伊拉克战争，同时得益于硅谷的支持。社交媒体在其竞选活动中所做的努力，代表着第一次有总统候选人拿这类媒体当回事儿。领导他们的是扎克伯格的哈佛同学、脸书联合创始人克里斯·休斯，《快公司》杂志称其为“让奥巴马成为总统的孩子”。有些人把2008年大选称为“脸书选举”，而硅谷的创业精英们为奥巴马的竞选投入了大量资金，因此《大西洋月刊》将此称为“今年最热门的创业”。蒂尔从来没有像现在这样与他的同行们如此格格不入。", "奇怪的是，在这段时间里，蒂尔似乎并不感到痛苦；这么多年来，他第一次感到自由。他的对冲基金，以及被华尔街媒体反复报道和不得不取悦投资者的双重压力迫使他回归自己的本心。退出PayPal后，他到处撒钱，而且是那样没心没肺地撒钱，购买了与极度富有的身份相匹配的各种装备，却并没有从中获得明显的快乐。现在，既然他已经亏掉大部分投资者的钱，也不再试图隐藏自己的秘密，他便可以追随自己的学术激情，再一次扮演一个煽动者的角色。", "在斯坦福大学，蒂尔曾被年轻的右翼知识分子深深吸引，现在他又一次被他们吸引。起初是谷歌工程师帕特里·弗里德曼，他个头不高，但身体健硕且相貌堂堂，在斯坦福大学获得计算机科学硕士学位后，他将读研期间所学用于为谷歌编写质量控制软件，也尝试好出风头者的另类生活方式，他探索了搭讪艺术、杂技、职业扑克、旧石器时代饮食、集体生活，以及多元之爱，并把这一切写在博客上。弗里德曼对我说：“我不知道10年后我会如何看待自己，可能我就想说，‘我是个叛逆的知识分子，我想写什么就写什么’。”", "弗里德曼长期热衷于“海上家园”，即在漂浮于国际水域的大型平台上建立自由意志主义乌托邦的想法。这些被其追随者们形容为开放水域定居点的“海上家园”将不受任何政府的控制，让入住者有试验非法物质的完全自由，并享受被当今世界上200多个国家和地区所拒绝的其他乐趣。他和另外两三个科技乌托邦主义者一起写了一篇论文，并将其发布在网上，解释了“基于海面之上的生活方式的理念和实践性”，内容涵盖了焚烧处理人类粪便的利与弊、使用中国制造的价格低廉的巡航导弹来抵御敌方海军舰队攻击的可能性，以及创建一个无税社会的承诺。", "弗里德曼的博客在蒂尔的自由意志主义员工中很有市场，他开始与帕兰提尔创始人乔·朗斯代尔的弟弟、克莱瑞姆的副总裁杰夫·朗斯代尔通信。杰夫邀请他到克莱瑞姆的办公室里会面。弗里德曼最初希望能在这次会面中得到一份工作，不过他得到的是与蒂尔共进晚餐的机会。用餐期间，蒂尔事无巨细地打听弗里德曼的计划，其中包括建立一系列比例模型，从置于浴缸内的一个比例平台起步，然后逐渐发展到亚特兰蒂斯岛的比例规模。", "蒂尔喜欢弗里德曼，和他的许多追随者一样，弗里德曼是年轻、有魅力的男性，他能言善辩，并肯说出上流社会中没人会说的话。此外，“海上家园”的想法令人发自内心地感兴趣，也是PayPal绕开金融法律之道的具体外化表现。无须发动一场政治运动来争取对亿万富翁减税，或减少对人体冷冻术提供者的监管，无论如何，在理论上，“海上家园”就可以让这些政策成为现实，并挑战政府能否将其关闭。蒂尔认为，等到世界其他地方注意到正在发生的事情时，已经为时太晚。而且还有一个终极诱惑，那就是弗里德曼是伟大的自由主义经济学家米尔顿·弗里德曼的孙子，小弗里德曼的项目为蒂尔提供了一个更深入地与保守主义运动结盟的机会。", "晚餐结束时，蒂尔对弗里德曼说“你应该离开谷歌”，并给了他50万美元，让他创办一家非营利组织。蒂尔承诺未来还会给他更多捐款，并表示将借用他的名义开展筹款行动。“几十年后，那些回望21世纪初的人们将会明白，‘海上家园’计划是鼓励世界各地发展更高效、更实用的公共部门模式的显著一步，”蒂尔在宣布捐赠的新闻稿中说，“我们正处在一个令人着迷的转折点：政府的本质将在一个非常根本的层面发生改变。”", "批评人士认为“海上家园”计划是危险且反动的，而且简直愚蠢。《连线》杂志写道，“海上家园”研究所的成立“应该流传在互联网传说中，因为它证实了两个拥有博客和热爱安·兰德的人可以轻而易举地获得50万美元来追求他们的梦想，无论这个梦想是多么不靠谱或多么出格”。美国国家公共广播电台发表了一篇戏谑的报道，一上来就像促销文案似的开起了玩笑，主持人迈克·佩斯卡问道：“厌倦了你死我活的竞争，那就去遵守此人强加的所有规则吗？厌倦了被拒绝给予住在漂浮的海洋胶囊里的机会吗？”高客传媒无情地嘲笑弗里德曼，挖掘他的自白博客和社交媒体中最可笑的愚蠢细节。“自由意志主义乌托邦分子帕特里·弗里德曼想成为你孩子的爸爸”，这一标题所指的就是其主张的多元之爱。", "克莱瑞姆的员工原本以为这些媒体的关注会令蒂尔感到惊恐。“多年来，我们一直试图压下某些报道，但从某种程度上说，他根本不在乎，”一名前雇员在谈到他们努力压制媒体的负面报道时说，“他就这样照单全收了，不单是同性恋的事，还有‘海上家园’和他的政治作为，总之所有的一切。”蒂尔似乎已经准备好“让他那异帜高扬起来”。此人说道。", "蒂尔还更深入地投身于另一项兴趣，资助可能让他长寿的相关技术和研究。他持续向玛土撒拉基金会及其研究衰老的分支SENS研究基金会投入资金，这两个组织是由奥布里·德·格雷创建的。奥布里·德·格雷是剑桥大学培养的学者，他曾在2005年的一次TED演讲中提出衰老是可以逆转的。蒂尔在2007年和2008年捐赠了100多万美元，2010年又捐赠了200万美元。", "2008年，创始人基金向Halcyon Molecular公司投资了约50万美元，这是一家由威廉·安德雷格创办的初创公司，安德雷格在19岁时和他的兄弟迈克尔一起创办了这家公司，他有一个适度发展的计划，要开发出价格不贵的基因组测序技术来治疗衰老。2009年，就在蒂尔的“异帜高扬”阶段，他遇到了安德雷格夫妇，几乎立刻被他们的热情和方法所吸引。蒂尔通常不太情绪化，但这次他很情绪化。“他简直就是在上蹿下跳，”威廉·安德雷格回忆说，“他还说：‘我们必须解决这个问题，否则我们都会死。’那是我们第一次交谈。”", "蒂尔个人将投资500万美元到这个研究抗衰老的公司，并经常出现在该公司的办公室里，而创始人基金又在此基础上追加投资了500万美元。“他花了很多时间，好像在说‘好吧，你能给的建议也就这么多’，”安德雷格说，“我们还是开始干点儿实事吧。”", "他还向奇点研究所捐赠了100多万美元，这是一家致力于研究超级智能计算机的非营利组织，这种计算机有朝一日可以承载我们的大脑，并使我们在软件中实现永生。从这些捐赠招致嘲笑的程度来看，蒂尔似乎对此表示欢迎。在奇点研究所的一次活动上，他向一群人吹嘘，他不顾父母的反对资助了德·格雷。他说：“我住在湾区的父母吓坏了，他们打电话给我，‘这太尴尬了！邻居们会怎么想？’”", "在早期的对冲基金生涯中，蒂尔的政治立场相对低调，但在离职后，他又故态复萌。克莱瑞姆2008年5月致投资者的信宣告“一场政治牛市在即”，这一“政治牛市”将以“全球主义精英们”的共识瓦解为特征。几十年来，这些全球主义者一直认为开放边境和增加贸易会带来繁荣。这些政策曾受到比尔·克林顿和乔治·W.布什的支持，但蒂尔看到了一个转折点。一年前，布什曾试图颁布全面的移民改革法案，其中包括为非法移民提供获得公民身份的通道、加强边境执法，并增加一个输入外籍工人的计划。但是布什的努力失败了，蒂尔认为这是“已经持续数月的前所未有的网络运动的结果”。", "蒂尔对反移民改革运动的熟悉程度远远超过他在信中所表现出来的。在过去的几年里，他一直在悄悄地培植一批新的本土主义政治家，其中包括堪萨斯州共和党主席克里斯·科巴赫，他曾是反移民组织美国移民改革联合会的律师。他们一直在起诉州政府允许非法移民支付州内大学学费。美国移民改革联合会隶属于极右翼非营利组织数字美国，其坚持主张美国应该减少每年允许进入美国的移民总数。南方贫困法律中心曾表示，数字美国通过其创始人与白人民族主义者保持联系。在布什推进全面移民改革之前，数字美国的知名度较低。它主动代表支持者向美国参议员发送传真，抱怨移民问题有失控的危险。通过这种方式发送的传真超过100万份，以至于在投票前夕，参议院的电话网络都被搞瘫痪了。", "2008年，“硅谷闲话”报道，蒂尔通过中介向数字美国捐赠了100万美元。（蒂尔当时没有对该报道做出评论，但了解他的政治活动的知情人士告诉我，报道的捐款确有其事。）“硅谷闲话”指出，这不符合蒂尔的自由意志主义价值观，建议他“放弃拥抱自由主义”，蒂尔却以加大赌注来回应。2009年年初，他和弗里德曼为卡托研究所的网站Cato Unbound撰稿。卡托研究所是查尔斯·科赫与他人共同创办的自由意志主义智库。Cato Unbound网站每月都会发表一篇思想家撰写的主题文章，这期的主题是“从头做起”，即在正常的民主框架外简单地创建自由意志主义飞地的想法，弗里德曼认为这是有瑕疵的“民间激进主义”。弗里德曼既不主张投票也不主张成立政党，而是主张一个被称为“竞争治理”的概念：坚定的自由意志主义者将离开自己的国家，去开创新的国家，就好像一个不喜欢当地咖啡店的企业家也许能从中看到市场机会，并营造出一个竞争对手那样。", "蒂尔的文章《论一名自由意志主义者的养成》也是围绕类似的主题展开，但更有针对性，似乎就是为了引起反响。“我不再相信自由和民主是相容的。”蒂尔写道，他认为美国在20世纪的大部分时间里一直在走下坡路。他写道：“20世纪20年代是美国历史上人们可以真正对政治持乐观态度的最后十年。自1920年以来，福利受益人的大幅增加，以及女性选举权的扩大，对自由意志主义者来说是出了名的难对付，并使得资本主义民主的概念成为一种矛盾修辞法。”", "蒂尔认为，有三种并非没有道理的希望领域（对这些领域，他都有投资），或许能让人类回归自由和财富，并推翻女性选民和福利受益人的暴政。这些领域，一是互联网，尤其是脸书；二是外层空间，他认为新的火箭技术使太空殖民地更有可能实现；三是“海上家园”。这与《斯坦福评论》的荒诞言论一脉相承，但与蒂尔在这份校报上发表的极具煽动性的文章不同，他本人就是这篇文章的作者。", "毋庸置疑，人们应该庆祝彼得·蒂尔建立离岸避税天堂的努力，同时哀悼《第十九修正案》的通过，这种想法并没有得到普遍的认可。“脸书支持者们希望女性不能投票。”托马斯在“硅谷闲话”上这样写道，还骂蒂尔“犯傻”。", "蒂尔在卡托研究所的网站上发表了一篇澄清文章，但并没有为自己关于女性的言论道歉。“虽然我不认为有哪个阶层的人应该被剥夺公民权，但我也没指望投票能让事情变得更好。”他写道。令人惊讶的是，无论这番解释多么站不住脚，却竟然奏效了。乔治·帕克在《纽约客》上对蒂尔的思想进行了缜密的阐述，他表示“蒂尔不是想剥夺女性的选举权，相反，他是想找到一条出路，以绕过与自由不相容的民主”，好像这样说就可以为他开脱似的。其实，蒂尔想要夺走的并不仅是女性的选票，他似乎想要夺走所有人的选票。", "在任何情况下，蒂尔在这件事上的观点都无关紧要，因为根据他的这篇文章，他永远脱离了政治：", "我认为政治简直太惨烈了，这就是我为什么是自由意志主义者的原因。政治让人愤怒，政治破坏人际关系，政治使人们的观念两极化：这个世界有我没他，好人与坏人不共戴天。政治就是不经过别人的同意就干涉别人的生活。这也许就是自由意志主义者过去在政治领域里没有什么建树的原因所在。因此，我主张把精力集中在其他地方，集中在某些人认为是乌托邦式的和平项目上。", "几个月后，蒂尔接受一家私募资本行业杂志采访时说“硅谷闲话”是“硅谷的‘基地’组织”，他还说“硅谷闲话”的员工“都应该被描述为恐怖分子，而不是作家和记者”。蒂尔说：“这里所说的‘恐怖主义’显然是一种带有强烈刺激性的比喻，但它的确与真的恐怖主义如出一辙，因为在这种恐怖主义当中，人们就是想要比别人更卑鄙、更耸人听闻，就好像恐怖分子总是想要站出来恐吓平民。这是一个有趣的理论问题，要是‘硅谷闲话’消失了，无论如何，也还会有其他东西取而代之。”", "在未来10年的大部分时间里，蒂尔将致力于回答这个问题，同时大幅扩大他的政治计划，尽管他声称将会逐步结束它。蒂尔不仅是为了保护自己的形象，也是为了消灭那些试图破坏他的形象的人；他不仅想要实现与政府签约的零的突破，还想接下政府全部的合同订单；他不仅想说服大学管理人员根除校园政治正确，还想把对政治正确性的担忧变成一个可能左右美国大选的问题。"], "wcount": 13393}, {"icon": "10", "title": "第10章 新军工复合体", "paras": ["美国科技产业的历史肇始于1957年9月，当时，在加利福尼亚芒廷维尤的一个实验室里，肖克利半导体实验室的一群非常优秀的年轻工程师宣布，他们决定辞职。这八个人以“八叛逆”的名号而为世人所知，他们后来成立了仙童半导体公司。在杰出的物理学家罗伯特·诺伊斯的领导下，该小组开发了一种将晶体管（计算机的组成部分）蚀刻到一块玻璃上的方法。这是首个具有商业可行性的计算机芯片，即诞生了硅谷的硅芯片。", "阿波罗计划购买了成千上万个仙童半导体公司设计的芯片，在旧金山半岛掀起了经济繁荣的波涛，最终促成了个人计算机、网站、加密货币、智能手表及21世纪资本主义的出现。仙童的员工就是“PayPal黑帮”之前的“PayPal黑帮”，他们在硅谷四下扩张，创办了许多最重要的科技公司和风投公司。", "由于深受随之而来的成功（尤其是乔布斯的成功）的影响，在大众的想象中，“八叛逆”的故事据说已经成为遍及科技行业的叛逆精神的代表。当我在2005年左右投身新闻业时，硅谷，究其核心，被视为一场反建制运动。正如未来主义者（也是反文化活动家）斯图尔特·布兰德的那句名言所说：“这一切都要归功于嬉皮士，20世纪60年代那一代人的真正遗产就是计算机革命。”", "但真正的硅谷从来就不是要颠覆军工复合体。硅谷最纯粹的形式就是军工复合体，它的创始人们是骄傲的守旧派，其政治倾向更接近于戴维·斯塔尔·乔丹，而非斯图尔特·布兰德想象中的那些激进分子。发明了“八叛逆”这个词的人（即那八个人所背叛的老板）是威廉·肖克利，他在第二次世界大战期间从事B—29轰炸机雷达的研发工作，后来他发明了一种新的晶体管，再后来，他关掉了自己的公司，在斯坦福大学担任电子工程学教授，并继承乔丹的衣钵成为校园优生学家。从20世纪60年代末开始，他就主张，美国的政策制定者不应该通过社会福利项目来解决种族不平等问题，而应该付钱给黑人让他们接受绝育手术。", "这太极端了，虽说科技行业的很多人都非常保守，而且对反主流文化怀有特别的敌意。仙童、惠普和英特尔等公司的员工能吃饱穿暖，都得感谢冷战时期源源不断的国防预算，他们对此心存感激。他们生产的晶体管为左派一心想要废掉的导弹导航。1968年，诺伊斯离开仙童半导体公司，创办了英特尔。英特尔最初也主要是国防承包商。诺伊斯视左派为一股对抗技术进步的力量。正如汤姆·沃尔夫1983年在《时尚先生》杂志上介绍诺伊斯时所说的：“他们想毁掉这些新机器，他们想要取消未来。”时至21世纪初，这些事在硅谷差不多被遗忘了。", "蒂尔对科技的看法和诺伊斯一模一样，两人都认为科技是西方文明和美国力量崛起的基础。而且，反主流文化让科技止步不前。在登月3周后，蒂尔在《国家评论》杂志的一篇文章中将美国的衰落溯源至伍德斯托克音乐节，他写道：“这就是嬉皮士接管美国之时，也是关乎进步的真正的文化战争失败之时。”他在《多元神话》一书中指出进步的敌人是“围绕身份政治，无休止的虚假文化战争”，在他看来，多元文化主义的价值观不再只是对斯坦福的威胁，现在也构成了对美国霸权本身的威胁。", "蒂尔开始相信，解决的办法包括将政府支出从社会项目转向大规模的技术项目，而这类项目正是诺伊斯和他同时代的人当时正在做的。他写道：“国家可以成功地推动科学发展，否认这一点毫无意义。”但是，他还说：“我不知道在美国有哪个政治领导人，不管是民主党人还是共和党人，会为了给生物技术研究挪出资金而减少卫生保健开支，或者在更一般的意义上，为了给重大工程项目注资而严重削减社会福利。”", "这将成为蒂尔最重要的项目之一，那就是把军工复合体带回硅谷，并以他自己的公司为中心。", "蒂尔不仅预测了房地产市场的崩溃，还预测了国防支出的上涨。2008年，克莱瑞姆曾在一封信函中称赞国防支出“是美国在熟练劳动力、技术、贸易途径等方面享有优势的主要领域”。这是对时代的精明解读。虽然巴拉克·奥巴马是以反战候选人的身份参加总统大选的，但相较于布什向“基地”组织发动的战争，他谈论更多的是伊拉克战争。事实上，奥巴马认为布什做得还不够。这个国家“分散了我们的注意力”，使得本该用来抓捕奥萨马·本·拉登的军事资源被用在了伊拉克。这意味着要大量投资于情报工作和“激增”兵力，其中奥巴马于2009年向阿富汗派遣了3万名士兵。", "帕兰提尔几乎处于完美的位置，可以利用不断变化的政治风向。他们参与了一项历时数年的行动，目的是说服世界（尤其是美国陆军）抛弃现有的数据分析软件，转而把原先花在软件上的那笔钱交给彼得·蒂尔。", "这并非易事，部分原因是美国陆军已经同意花费大约100亿美元来打造自己的分布式通用地面系统，使用包括洛克希德·马丁公司、雷神公司和诺思罗普·格鲁曼公司在内的一批传统国防承包商。这意味着帕兰提尔要想获得一份庞大的军队合同几乎是不可能的，也就是说，如果帕兰提尔沿用老一套的方法来解决问题，那么就得游说五角大楼的官员，并对自己的软件进行修改，以使其能与现有的系统协同一致。相反，蒂尔采用了曾对PayPal很有用的一种变通方法，即投入大量资金直接向潜在用户推广其服务，希望能通过网络效应影响军方高层，就像当初因为易贝的卖家都接受了PayPal，所以梅格·惠特曼只能放弃做PayPal的竞争对手。", "帕兰提尔对此策略稍加调整，将目标对准了那些可能愿意尝试新事物的军队中层指挥官，提供免费的软件版本供他们试用。帕兰提尔为他们提供培训，并让工程师在需要的时候对软件进行调整，以满足他们的需求。其中一名指挥官是陆军第2步兵师第5斯特赖克旅战斗队队长哈里·滕内尔上校。", "滕内尔的职业生涯不同寻常，他曾在伊拉克服役，2003年，他的巡逻小队遭到伏击，他在战斗中腿部中弹。两名士兵救了滕内尔，把他拖进了沟里，之后，他被空运到一家德国医院。2006年，他在养伤期间就读于美国海军战争学院，写了一本书讲述这段经历。这段经历让他得出结论，美国的反叛乱策略依赖于培养当地盟友和赢得“民心”，所以不够积极主动。他提倡一种“反游击战”的方法，旨在找出叛乱分子并杀死他们，他的座右铭更加简单直白：“打击和消灭。”", "滕内尔的鹰派态度及打破常规的意愿使他成为帕兰提尔部署在前沿的软件工程师的完美目标，帕兰提尔将这些工程师定义为“工程师兼销售人员”。2007年，滕内尔的第5斯特赖克旅战斗队开始为部署到伊拉克的任务展开训练，软件工程师们就在此时与他见面了。滕内尔咨询帕兰提尔能否修改其软件，以便他在战场上发现叛乱分子。这是一项艰巨的任务：情报分析人员通常使用高速运行的计算机工作，它们与大型政府服务器通过互联网高速连接，而战地指挥官使用笔记本电脑工作，通常没有任何形式的网络连接。“最初的答复是‘不能’。”一位参与该项目的工作人员表示。", "然而，在几个月的时间里，帕兰提尔的工程师修改了他们的软件，实现离线访问数据库，在搜查房屋追捕反叛分子时可添加信息，等回到基地可使用互联网后立即上传修改后的数据。结果，每个单独行动的班长都可以在彼此工作的基础上协同动作，就像整个团队在谷歌文档或Slack", "上合作一样。帕兰提尔免费做了这项工作，并向滕内尔提供了用于培训的软件。滕内尔及其战斗队于2009年被部署到阿富汗前线，并说服陆军在2010年年初购买帕兰提尔的软件用于阿富汗作战。该战斗队的士兵后来称，这几个月的拖延导致该战斗队的伤亡超过30人。这也是帕兰提尔在后来几年里售卖其服务时采用的说法。", "消息在阿富汗传开了，其他战斗队也拿到了这个软件，这使得他们可以互相分享情报，并创造了PayPal式网络效应的开端。这引起了驻阿富汗美军情报主管迈克尔·弗林将军的注意。与滕内尔一样，弗林也抨击美国镇压叛乱的方式，并一直主张采取更强势的行动，利用士兵在战场上搜集的情报。2010年年初，部署在前沿的帕兰提尔的工程师给弗林做了演示，他的回应是紧急请求国防部购买足够的帕兰提尔软件使用许可，以供驻阿富汗的全体部队使用，同时批评五角大楼现有的数据库软件不够好。“一线情报分析员手中没有需要的工具，无法对目前可获得的大量情报信息进行全面深入的分析，”弗林写道，“这种短缺不仅贻误战机，还会造成军人丧生。”", "尽管军方领导层试图不理会弗林，但弗林的发声对帕兰提尔和蒂尔本人来说是一笔巨大的财富。他们找到了愿意倾听他们讲话的邓肯·亨特，这位圣迭戈众议员是通过游说者特里·保罗培植的。帕兰提尔于2011年雇用保罗，他与亨特的父亲老邓肯关系密切。滕内尔离开军界后抱怨说，他在军队的上级磨磨蹭蹭地处理他关于配发更好的软件的请求，这促使亨特要求举行听证会。弗林则在升任奥巴马政府的美国国防情报局局长后，继续推动美国陆军采用帕兰提尔的软件。", "滕内尔和弗林与军方意见相左，不仅是因为他们都喜欢帕兰提尔的软件。弗林后来被迫离开国防情报局，表面上是因为管理不善，但美国联邦调查局最终调查了弗林在国防情报局任局长及之后担任说客期间与俄罗斯人的接触。同一时期，他还非正式地为帕兰提尔进行游说。与此同时，滕内尔所在的战斗队里的不少成员被指控犯有战争罪行，他也将离开军队。滕内尔并未受到牵连，但在他退休后，一份陆军报告称他更具进攻性的姿态使士兵更容易越界。身为帕兰提尔在国会的拥护者，亨特最终被指控在竞选中财务违规、搞阴谋，以及电信欺诈。亨特承认了一项较轻的指控，并于2020年年初辞职。", "这些不端行为没有一件与帕兰提尔扯上关系，但那些与该公司关系密切的人士承认，那些行为表明帕兰提尔培植的都是什么类型的人。“我们找了些变幻莫测的人，不是有点儿异乎寻常，就是善于夸大其词，却可以与我们合作。”帕兰提尔一位负责此事的前高管说。蒂尔把肖恩·帕克因毒品被捕的事变成了一个卖点，他从来没有因为带着道德包袱做生意而感到有问题，也从来没有做任何事情来阻止这一切。在与帕兰提尔的员工开会时，蒂尔总是喜欢用带有意识形态和革命色彩的词语表述公司目前的工作。“他是我们精神上的导师，让我们认识到当下的制度是腐败的。”一位员工说。", "无可避免，这种草根方式及急切地要找到搅局者的愿望，使帕兰提尔做出了后来被其员工发现不妥的安排。2010年，帕兰提尔的员工开始与另外两家安全公司HBGary和Berico合作，以获得一个每月收入200万美元的合同，任务是协助建立一个智能行动机制，以便挖出由美国商会的批评者发在社交媒体上的破坏性帖子。在起草这项提案的同时，这三家公司还向美国银行推销了一项针对维基解密的类似行动。帕兰提尔提出要向支持维基解密的记者施压，包括普利策奖得主格伦·格林沃尔德。“这些人都是有自由主义倾向的专业人士，”帕兰提尔的演示幻灯片上这样写着，“但最终，如果被逼无奈，其中大多数人就将选择保全职业，而不是事业。”", "2011年2月，由于黑客组织匿名者的成员将HBGary首席执行官的电子邮件公之于众，这一项目在外界看来就成了一桩丑闻。格林沃尔德写了一篇言辞激烈的专栏文章，抨击他所看到的“无法无天和不受约束的……政府和企业权力的沆瀣一气”。", "但在帕洛阿尔托的公司总部，这起事件没怎么被当作一桩丑闻，而是更多地被视为帕兰提尔的销售方式不走运的结果，就像“蒂尔江湖”中所有的东西一样，这种销售方式是发散式的。一位前工程师表示：“为了能干成事，我们赋予业务开发人员很大的自由，但也给他们施加了很大的压力。这些人真的很努力，很难去指责他们。”", "亚历克斯·卡普公开道歉，切断了与HBGary的联系，并告诉员工，他不知道这个恐吓记者的提议。他在一份声明中表示：“言论自由权和隐私权对民主的繁荣至关重要。”卡普还宣布，帕兰提尔将建立一个道德热线，以便员工举报这一类招惹麻烦的工作。尽管如此，卡普或蒂尔是否真的对强势压制记者的提议感到后悔，尚不得而知。这位前工程师还说，有些员工私下悄悄说，被卷入该事件的帕兰提尔员工包括26岁的工程师马修·斯特克曼和经理伊莱·宾厄姆，他们也只是做了自己的本职工作而已。帕兰提尔让斯特克曼休假，他却回到公司，后来还被提拔，最终在2017年离职前成为业务主管和卡普的高级顾问。宾厄姆也得到了提拔，被任命为公司“机器学习操作”项目的负责人。", "他们一直受到蒂尔的青睐。斯特克曼后来成为安杜里尔的首席营收官，安杜里尔是类似于帕兰提尔的国防承包商，而且是蒂尔资助的。宾厄姆成为类似PayPal的金融科技公司Affirm的工程部副总裁，Affirm由列夫琴创立，蒂尔给予了支持。他们不会是最后一个在公开场合受到惩罚却在私下得到奖励的蒂尔的副手。", "如果说帕兰提尔的员工因HBGary事件而气馁，他们的不满也并没有持续太久。4月底，员工们开始窃窃私语，说公司最神秘的客户之一做了一件大事。一名员工回忆说：“大家都在之后一两天里等着看惊天大新闻。”", "5月的第一个星期天晚上，奥巴马总统出现在白宫东厅，宣布美国击毙了全球通缉的世界头号恐怖分子。美国海豹突击队发现奥萨马·本·拉登时，他正躲在巴基斯坦阿伯塔巴德一处有围墙的院落里。奥巴马语调郑重地描述了由中情局领导的一次“艰苦的”情报搜集行动，该行动在当天早些时候的一次秘密突袭中结束。", "“在这样的夜晚，”奥巴马总统说，“我们可以对那些因‘基地’组织的恐怖袭击而失去亲人的家庭说：正义终于得到了伸张。”在之后的几个小时里，帕兰提尔的气氛激动人心。在电子邮件中，在内部论坛上，在帕洛阿尔托和华盛顿的公司办公室里，员工们纷纷开始问一个显而易见的问题：是我们干的吗？那些可以接触到真相的人的回答是“也许吧”，尽管他们说这话的样子几乎肯定意味着“是的”。", "记者马克·鲍登在当年10月出版的讲述追捕本·拉登过程的畅销书《终结》中将成功归于两项技术突破，他说正是这两项突破让分析人员找到了这个“基地”组织的领导人。第一项是“捕食者”无人机的研发，这种无人机可以在城镇上空持续盘旋，让指挥官可以详细观察进出往来的任何人或任何东西。第二项就是“全信息识别”技术，可与无人机一起协同作业，创建数据记录，以感知潜在目标的移动和接触情况。", "从官方来说，白宫顾问波因德克斯特的概念已经被扼杀，但鲍登认为，在硅谷的帮助下，其基本的方法保存了下来。“例如，有一家名为帕兰提尔的初创公司构想出了一个计划，优雅地完成了‘全信息识别’研究业已着手要做的事情，”鲍登写道，“这个由难以置信的源头产生的软件，将有助于将美国特种部队打造成致命有效的猎手。”", "在奥巴马新闻发布会后的全体会议上讲话时，卡普尽量谨慎地不去抢功，同时小心翼翼地不去不抢功。他指出，帕兰提尔曾与情报机构合作无人不知，而这些机构的确干成了惊天大事。“那个微笑真腼腆，”另一个目击者说，“这是卡普‘盗梦空间’般的推销手法的又一个例子。”", "帕兰提尔在接受媒体采访时沿用了这一套路，既拒绝回答有关追捕本·拉登的问题，又让记者们私下明白这不是空穴来风。早期的一位员工告诉我，员工不允许直接让别人去看鲍登的书，因为其中涉及的信息是保密的，但他们可以让别人在谷歌上直接键入“帕兰提尔、本·拉登”等字眼，这样就能将他们直接引向鲍登书中宣称该公司出产“绝对名不虚传的杀手级应用”的那几段文字。谷歌搜索的最终结果就是帕兰提尔的估值已达数十亿美元，这一说法因记者们反复提及而弄得就跟真的一样。不过，高客传媒是个罕见的例外，它指出帕兰提尔利用这一说法来大肆推销，但其实这一说法“根本就是子虚乌有”。多年后，《纽约时报》记者沙伦·温伯格这样写道：“没有一个接受我采访的国家安全或情报部门人员认为，帕兰提尔在发现本·拉登的行动中发挥了重要作用。”", "事实上，鲍登在谈到帕兰提尔的确切作用时含糊其词，也并没有真正仔细地讨论过那个应用软件。那么这个软件到底干了些什么呢？事实证明，它干的并不像说的那么多。一位那些年里一直使用帕兰提尔软件的前情报分析员说，帕兰提尔的软件能做的是极其有限的。尽管人们普遍认为它是一种可消化处理原始情报数据的工具，但这位分析员表示，其实它更像是一种可视化辅助手段，即在军方已经建立的数据库的基础上创建图表来显示关联的方式。帕兰提尔内部人士认为这种描述是不客观的，帕兰提尔提供了有价值的分析工具，尽管他们也承认其软件不像当时许多人认为的那样自动化。", "分析师找出他们想要的目标，在帕兰提尔的软件上创建一个蛛网图，然后发给他们的上级。对那些喜欢图表的上司来说，这还是有价值的，但你还得或多或少动手制作图表。“这就是个整理最终报告用得着的工具。”这位分析师对我说，并称那些关于帕兰提尔具有超凡情报能力的说法“全都是假的”。在现实中，帕兰提尔在击毙本·拉登这件事上的作用仅限于“制作一张漂亮的图片，然后截屏，再将其加入一份演示报告的末尾，最后呈递给领导层”。", "但是，不管帕兰提尔有什么作用（如果确实有的话），对卡普而言已是绰绰有余。帕兰提尔一副“你懂的”的腔调令媒体对这家公司的兴趣爆棚。与《魔戒》的主题相似，帕兰提尔将其政府工作称为“保护夏尔行动”，将其员工称为“霍比特人”，而卡普的古灵精怪，外加公司被普遍认为参与了悬疑刺激的秘密行动，这一切都让人欲罢不能。《商业周刊》的一篇文章称之为“反恐战争的秘密武器”，并借用帕兰提尔的推销说辞，描述了一场由它加持的行动，中情局在行动中使用帕兰提尔的软件阻止了恐怖分子对迪士尼乐园的袭击。这当然是一个假想的例子，但为了保护“其客户的敏感工作”，这样做是必要的。", "美国公民自由联盟警告说，帕兰提尔支持“对数百万无辜民众的通信和活动进行甄别的错误策略”。媒体对帕兰提尔技术的危险含义也多有不祥的解读，他们在当时并不知道帕兰提尔的技术在很大程度上还处于开发阶段。《卫报》警告这是“一项险恶的网络监视”，《福布斯》在封面上刊登了卡普的笑脸，并发表了一篇题为“会见大哥”的人物特写。文章以各种“传闻”开篇，当然，这些都最早源自帕兰提尔的员工，不外乎是说该公司“曾协助击毙奥萨马·本·拉登”。", "对于帕兰提尔的技术使政府把手伸得过长的说法，卡普和蒂尔并没有做多少反击，而且事实上有时还予以鼓励，理由就是隐私恐慌可能有助于帕兰提尔宣称这是一个改变游戏规则的监视技术。如果人们认为这很危险，那就更好了。这就是他们把它命名为“索伦之球”的原因。正如蒂尔向朋友解释其策略时说的那样：“我宁肯别人觉得我邪恶，也不愿别人当我无能。”", "他说得没错。包括金融服务公司、企业安全部门等在内的潜在客户并不在意帕兰提尔是不是太好了。事实上，如果软件的侵入性真的特别大，那就更好了。他们都想要军事级的技术，以便雇用抓到了本·拉登的公司，而蒂尔和卡普已经准备好将软件卖给他们。“当时感觉我们就像站在了世界之巅，”一名长期员工说，“很多人开始敲我们公司的大门。”帕兰提尔的成功极大地增加了蒂尔的财富，两年后，该公司的估值从2011年的25亿美元增长到两年后的90亿美元。", "这也会带给他更多的东西。多年来，蒂尔一直在展示比其实际拥有的还要强的实力，比如自己出版图书、花钱举办会议，只要有可能，就下血本在任何时候、任何场合营造影响力。但时至现在，随着帕兰提尔的崛起和成功，蒂尔突然有了实际的影响力。多年来，帕兰提尔一直努力地吸引将军们和政治家们的关注，现在反倒是那些将军纷纷打电话找他。蒂尔已不再只是技术人员，他是一家公司的幕后掌门人，事实证明，这家公司改变了国家安全领域的“游戏规则”，而且他对如何利用自己的名声有宏伟的计划。", "Slack整合了聊天群组、大规模工具集成、文件整合、统一搜索等功能，可以把企业沟通和协作集中到一起。——编者注"], "wcount": 7838}, {"icon": "11", "title": "第11章 新的创业“黑帮”", "paras": ["2010年夏，我在纽约西村的一家咖啡店见到了蒂尔。我带着一个模糊的想法前往，我想在《公司》杂志的连续特辑《我是如何做到的》中为他写一篇人物专访。在这一期特辑中，成功的工商业人士讲述了他们通向名誉和财富的曲折之路。这些文章难免有些粗劣，但在经济崩溃的当下，这种粗劣似乎让人耳目一新。", "从技术上讲，大萧条已经过去了，但事情似乎有些令人感到绝望，至少从我在纽约这一观察事物的有利位置来看是这样。我28岁了，还算年轻，但也算不上那么年轻。我的朋友们大多手握名牌大学的文凭，但似乎又全都在苦苦挣扎，经历着爱情和职业上的挫败。他们在考虑回家或申请去读研。在过去的18个月里，媒体公司似乎每隔几周就会萎缩一点，或者裁员一半。我发现自己忧心忡忡，还有点儿爱瞎琢磨，不过很难说，说不定哪天我也被解雇了。", "蒂尔穿着一件干净利落的蓝色正装衬衫出现了，在我对面落座，却没有点任何东西，也丝毫没有要跟我寒暄的意思。接着，他就针对最近的三大经济泡沫发表了一通即席演讲：首先当然是科技泡沫，其次是次贷泡沫，最后便是我们目前深陷其中的高等教育泡沫。", "他解释了他的想法，这期间有好几次中途停下来，在我的笔记本上涂涂写写。学费一直在涨，我们用联邦政府担保的学生贷款来支付不断上涨的生活费，贷款债务也就越来越多，而这些债务即便在破产的情况下也是无法免除的。这一切到底是为了什么？政府为何要资助那些毫无用处的艺术史学位呢？说到底，这些学位其实就是关于饮酒和性的。我们究竟为什么要心甘情愿地花费15万美元来享受这四年的派对特权呢？", "蒂尔说：与次贷泡沫不一样，高等教育泡沫更糟。次级抵押贷款至少让你拥有了房子，可是读大学，即便读的是常春藤盟校，你也照样一无所有。他说，最聪明的人选择辍学创业。采访完离开的时候，我虽然被蒂尔的论点说服了，但对刚才所经历的感到困惑。我原本期待像普通访谈一样互有问答，结果得到的却是这么一场冗长的宏观经济探讨，而且似乎注定要以我哭诉自己的文科学位告终。", "对任何花费整块时间与蒂尔在一起的人来说，这种感觉都是再熟悉不过的，因为蒂尔的主要对话模式就是单方面的颠来倒去，随着时间的推移不断重复和完善其观点。反正，我当时就是这么认为的。但蒂尔的反大学高论不仅是即兴的碎碎叨叨，它是其设计的更宏大的战略的一部分，旨在极大地扩展其影响力，使之远远超出投资和技术的领域。这将在三个新领域中展开，即政治、法律及我正要了解的教育，或者说针对教育的运动。我当时并没有意识到这一点，但我其实不经意间已经抢先窥见了蒂尔迄今为止最雄心勃勃的创业计划：企图赢得美国每个不满现状的年轻人的支持。", "同年10月，《社交网络》首映。大卫·芬奇导演的这部电影改编自《意外的亿万富翁》一书，该书取材于马克·扎克伯格与爱德华多·萨维林就脸书的所有权发生争执时所公开的文件。总之，这是对硅谷最怯懦的冲动的尖酸描绘。贾斯汀·汀布莱克在片中饰演肖恩·帕克，一个贪得无厌、寻欢作乐的大骗子；杰西·艾森伯格饰演的扎克伯格冷酷无情、反社会，最重要的是孤独。华莱士·朗翰以在《犯罪现场调查》中出演实验室技术员的角色而闻名，他把蒂尔描绘成一个穿着蓝色领扣衬衫的古板守旧型投资者。", "正如阿伦·索尔金的剧本所说，创办脸书的灵感来自一场分手后的性别歧视幻想。然后，他又引入了一些来源可疑的知识产权，创造出了吞噬了整整一代人的社会结构的某种东西，并代之以一个悲伤的、闪烁的“喜欢”按钮。这就是大多数影评人对《社交网络》的看法，不无道理，因为它或多或少就是发生在现实生活中的事情。但这绝对不是美国新兴技术专家观看这部影片的感受，他们会将其视为一个可以效仿的榜样，出于这种信念，扎克伯格可以带领他们，蒂尔更是如此。", "蒂尔的策略很简单，他犯不着去攻击电影制片人对事实做了随心所欲的处理；相反，他重点关注的是他所看到的对扎克伯格思想的错误解读。根据蒂尔的说法，扎克伯格创建脸书并不是为了报复或追女孩儿——就像电影中暗示的那样，他创办这家公司是出于一种想要创造某种促进人类发展的东西的纯粹愿望。如果不相信这一点，就会沦为“好莱坞或政府的非赢即输心态”的牺牲品，蒂尔说正是这种心态指导了这部电影的制作。“这部电影也有非常积极可取的一面，那就是尽管制片人的本意很坏，但影片将鼓励很多人进入科技行业，”他当时这样表示，“因此，我认为这是一件非常积极的事情。”", "在电影上映前几天，蒂尔在各方人士广泛参加的TechCrunch Disrupt大会上开始了一波媒体宣传，该会议是新闻网站TechCrunch在旧金山举办的。在台上发言时，他批评了这部电影，接着宣布，和《社交网络》的那些不知情的制片人一样，他也要尽自己所能，引导胸怀大志的“扎克伯格们”进军科技。“未来几周内，我们将开启一系列行动，其中之一是一个奖学金项目，将向多达20名20岁以下的年轻人提供最高达10万美元的奖学金，以支持他们开创新事物，”蒂尔说，“很多伟大的公司都是由非常年轻的人创立的，我们认为（我们应当）鼓励这一点。”", "蒂尔其实一直在做这样的事情。2009年，创始人基金与Tech Crunch合作，共同开展名为“天才极客奖学金”的项目，奖励有前途的科技人才5万美元，让他们投资一家初创公司。这个主意是肖恩·帕克提出的，他认为这是一种公司寻找新投资的不动声色的方式，这个项目的结构是这样的，风险投资公司可得到一半的股权，但一年后蒂尔又增加了一个变化。新的“20岁以下20人”项目将仅限于青少年，而且完全是慈善性质的。他们把这些年轻的企业家称作“蒂尔奖学金学员”，资助将不带任何附加条件，唯一的要求就是他们必须辍学，就像扎克伯格那样。", "这个项目被科技媒体和蒂尔一直在培养的自由意志主义博客写了下来。更妙的是，在蒂尔看来，主流记者纷纷对它进行了嘲讽。网络杂志Slate的主编、现任播客制作公司普希金工业首席执行官的雅各布·韦斯伯格在Slate上撰文，指责蒂尔试图克隆他自己，“这或许是真的”。韦斯伯格也是耶鲁大学的毕业生和罗德奖学金的获得者。蒂尔奖学金学员“将有机会效仿他们的资助人，在成年期开始时即停止智力开发，保持一种狭隘的心态，专注于在尽可能年轻时变得富有，从而避免了帮助他人或为基础科学的进步做出贡献的诱惑，这些进步使巨大的科技财富成为可能”。这篇文章雄辩有力，吸引了更多的申请者。蒂尔会在一个宣传视频中放入其中的一些摘录。挑衅攻击起作用了。", "2011年3月，蒂尔用飞机将44名青少年和他们的父母送到旧金山。他们在那里发表想法，聆听演讲，与大约50名“PayPal黑帮”成员聚在一起，这些青少年相互竞争，以成为最终的24名获胜者之一。他们是从大约400名申请者中挑选出来的，他们在网上提交申请时回答的问题包括“你会如何改变世界”“什么是你坚信而别人不相信的”。", "当蒂尔走上讲台欢迎他们时，坐在他对面的那满屋子人，与其说反映了知识分子的多样性，不如说反映了他自己独特古怪的兴趣和虚荣心。他们与蒂尔有着相同的政治主张和兴趣爱好。在他们的论文中，学生们写到了激进的自由意志主义，或者大学是多么愚蠢，或者长寿是多么美好。他们绝大部分是男孩，而且在面对他人时，他们和蒂尔一样，都表现出社交方面的窘迫。", "“我们无意与教育作对，”蒂尔告诉大家，但又补充说，“伟大的教育往往有一种自修成才的成分。”这一奖学金项目“对你们每个人来说都是一小步，对人类来说却是一大步”。", "不久之后，蒂尔发出了入选通知书。“未来不会自顾！”他写道，“现在，让我们改变世界吧。”他的基金会公布了22名男生和2名女生的名单，这些人将从几所美国著名的顶级大学辍学。新闻稿指出，他们来自麻省理工学院、哈佛大学和耶鲁大学，甚至还有一位十几岁的斯坦福大学已经上博四的神经科学专业的博士候选人，他也正在休学并尝试创业。一个18岁的学生想在小行星上采矿，一个学生想要自制质谱仪，还有个17岁的学生希望将人类的寿命至少延长300年。", "新闻稿中还包括了该计划创始人的长篇传记，以及蒂尔（Thiel）这个姓该如何发音的说明（其中的“h”不发音）。蒂尔接受了一些采访，这些采访强调了这一项目的跨学科性。“在美国，教育可能是人们仍然相信的唯一的东西，”他说，“质疑教育是非常危险的。这是绝对的禁忌，这就像告诉全世界说根本没有圣诞老人一样。”", "蒂尔聘请了当地的一个影视摄制组跟随第一组入选者拍摄，制作了一些短纪录片来美化这个项目。他在一间设置了舞台灯光的黑暗房间里接受采访，其中一些入选者在各自的家乡被拍摄下来，就像真人秀节目一样，包括他们收拾行李、跟父母告别等场景。蒂尔还与一位友好的记者亚历山德拉·沃尔夫·希夫，即汤姆·沃尔夫的女儿合作，就这个项目写了一本书。蒂尔的想法是要搞个老沃尔夫的《刺激酷爱迷幻考验》的新版本，不过，主要人物是蒂尔，他就像当今的肯·凯西，乘着大巴在国内旅行，去各地接奖学金项目入选者，并把他们带到硅谷。", "这一奖学金计划，以及随之而来的媒体推广，构成了蒂尔试图改变公众看法的一个主要因素。在21世纪初，他扮演的角色并非他自己的本色，那只是一个生活奢侈的异性恋对冲基金经理，而现在，他正在打造一个全新的角色：一个大胆进取、敢于冒险的投资者，对于摧毁整个制度有着无比强烈的愿望。", "事实上，蒂尔的形象确实需要重塑。创始人基金一直在拼命吸引新的投资者，部分原因就是蒂尔被认为是造成美国国内最热门的对冲基金倒闭的责任人。是的，蒂尔投资了脸书，但他在2006年的融资中不愿投入太多，因为他认为这家公司5亿美元的估值高得离谱。到2010年，事情已经很清楚，这就是一个愚蠢的决定。“这是彼得的遗憾之一。”创始人基金的一位前投资人说。", "蒂尔最近的投资看起来也没有那么火爆。在马斯克的第三枚火箭爆炸前，蒂尔购买了SpaceX的股份，但马斯克一直等到事故发生后才对外宣布，就是想向美国国家航空航天局和其他潜在客户发出信号，表明他有足够的资金维持公司的运营。对SpaceX来说，这是很好的营销手段，但对蒂尔来说就没那么好了，他现在看起来就像花钱买了一个巨大的火球。在这次火箭发射失败后不久，一位一直考虑支持该基金的投资者写了一封电子邮件，抱怨蒂尔把公司带得偏离了轨道，“这就是我为什么没向你们提供资金，下这样的注简直太可笑啦”。", "重塑形象使蒂尔能够将这种担忧重新定义为一个卖点。2011年7月，蒂尔和他的同事发表了一篇5 000字的宣言，专门阐述技术创新放缓的原因，题目为“未来发生了什么”。尽管这篇文章是由创始人基金的合伙人布鲁斯·吉布尼执笔，但其中的主要论点是蒂尔多年来一直在思考的东西。文章的标志性口号将蒂尔年轻时的科幻梦想与全球最成功的科技公司明显弱化的目标做了比较：“我们想要会飞的汽车，结果却得到了140个字符（这指的是推特，此前媒体曾将其视为脸书的潜在杀手）。”", "蒂尔认为，风投过去曾资助雄心勃勃的半导体公司、药品开发商和硬件制造商，比如鼎鼎大名的英特尔、美国基因泰克公司、微软和苹果。现在，他们支持的却是蹩脚的消费软件，全是些解决“虚假问题”的“虚假技术”。因此，自1999年以来，投资回报率一直平平。“20世纪60年代的人们希望看到的未来，仍然是半个世纪之后的今天，我们所等待的未来，”吉布尼写道，“虽然没有柯克舰长和‘企业号’星舰，但我们可以靠‘Priceline议价者’以及廉价航班去卡波。”", "这篇文章的修辞极好，但它没有准确地描述创始人基金的投资组合，其中大部分都是蒂尔批评的公司，只有少数几家体现了他的雄心壮志。创始人基金支持的脸书就像推特及Path、Gowalla和Slide一样，都是社交媒体公司。最后一个是由PayPal的联合创始人马克斯·列夫琴创立的，它以一种名为“超级戳”的游戏应用而闻名。它允许用户虚拟地“打”“揍”“摸”他们的脸书好友，这与人们所能想象到的“兰德式理想”相差甚远。", "蒂尔奖学金项目也存在类似的言辞与现实之间的脱节，被选中的那些幸运的青少年很快就会发现这一点。蒂尔在TechCrunch Disrupt大会上宣布了一个重大的奖学金项目，为此，20多人将会为了接受这笔资助而颠覆自己的生活。这一计划并不是经过深思熟虑的产物，而是在会议前一天飞返旧金山的航班上萌发的想法。尽管蒂尔一直在深入思考与高等教育有关的问题，但正如多年后他的一位亲密顾问在接受保守派刊物《城市杂志》采访时坦言，蒂尔真正想要解决的这个问题却要平庸得多。他拿到了阿伦·索尔金的《社交网络》电影脚本（这是该片制作者与脸书共享的），就担心自己会被描绘成一个冷血的投资者，在电影中展开一场该片认为相当于盗窃公司权力的游戏。这当然还是准确的，但这与蒂尔作为知识分子中的激进分子的新形象并不相符。“他想在这件事上抢先一步，带来一些好消息，”该奖学金项目前联合负责人迈克尔·吉布森如是说，“我们去了他家，上了一辆车，然后就赶去参加这个会议了。在飞行途中，我们突然就有了这个……好吧，我们管它叫什么？得多少钱？搞多少年？”", "吉布森和蒂尔圈子里的那些人为该奖学金项目突发奇想的性质而自鸣得意，认为这证明蒂尔就处在生活的最前沿，于一飞冲天之际便在思想上超越了自由派的好莱坞。但对于那些为了能参与其中而颠覆人生的孩子们和年轻人来说，缺乏准备是显而易见的，并且对某些人来说还可能是一场灾难。他们到了加利福尼亚之后却发现，一旦蒂尔实现了他的推广目标，接下来如何落实奖学金项目基本上是还需要再考虑的事。", "除了这个建议本身，根本没有其他的项目架构可言，而且还要求他们不上学，也不做全职工作。这里既没有阅读方面的要求，也没有行为指南；既不上课，也没有点卯报到的时间要求，当然也没有教员，有的只是负责这个项目的蒂尔基金会的四名工作人员：吉姆·奥内尔和乔纳森·凯恩是蒂尔在内部搞的伪权力操作的一部分；吉布森是个辍学的博士生，他被蒂尔招到克莱瑞姆时还只是个倡导“海上家园”的博主；达尼埃尔·斯特拉赫曼曾在圣迭戈开办了一所K—8特许学校，她也因此成为四人中唯一一个有相关经验的人。", "获得蒂尔奖学的这些年轻人被允许每季度与吉布森和达尼埃尔会面，并被邀请参加在蒂尔家举行的一些联谊活动。这些听起来让人充满期待，但往往是让人绝望的事情，几十个年轻人为了跟老板待上几分钟而各显神通。“这些都是你参加过的最令人沮丧的聚会，”一位获得蒂尔奖学金的年轻人对我说，“无论任何时候，任何人跟他说话，总是有目的的。”如果幸运的话，他们可以和蒂尔共进早餐，包括与其他5~10个企业家同桌。蒂尔会滔滔不绝地说个不停，喋喋不休地谈论一些宠物政策问题，也许只有在讲了45分钟后，他才会停下来吃上一口早餐，却发现早就凉了，只好再点一份。", "10万美元的支票每年分两期支付，意味着蒂尔奖学金学员可以有5万美元过日子。这固然不错，但扣除税金和旧金山的房租后，也就不算很多了，如果你过去从来都不用自己管理开支的话，那就更不多了。为了让事情变得简单些，有一年夏天，基金会在旧金山郊区租了一栋房子，四个人睡一间卧室。但到秋天，他们就只能靠自己了。“当时就好像说：‘这儿就是一栋房子，好好做你的事吧！’”托马斯·索默斯说。2010年，14岁的他第一次申请蒂尔奖学金，两年后在第三期被选中。", "此事也有很多优点。围绕该项目的种种传闻意味着，蒂尔奖学金学员至少可以与几乎任何投资者或科技公司会面。另外，人们很难不认为这本身就有点儿令人失望。一位蒂尔奖学金学员说，蒂尔的奖学金项目承诺尊崇自由资本主义并打造一个支持社区，收获的将是创造力，而非马基雅维利式的操纵。“可笑的是，我的所见所闻并非如此。”他说。这是一所没有课程、没有居住社区甚至没有学习的大学，简而言之，没有大学里能让人充实起来的一切。这并不是对文凭制度的打击，它本身就是另一类文凭。", "其他许多人，尤其是年轻的蒂尔奖学金学员们，感到的只有迷茫。就像托马斯·索默斯那样，16岁来到旧金山，没有朋友，没有家，也没有老板，不仅如此，还被要求创办一家比谷歌更有雄心的公司，这是一个多么令人生畏的指令。索默斯被指派给一位导师，这位导师23岁。2011年，另一位待聘导师、英俊的澳大利亚青年阿伦·德索萨以知识产权法专家的身份为蒂尔奖学金学员们做了一场演讲，尽管当时他自己也刚从研究生院毕业。他获得了墨尔本大学的博士学位、牛津大学的法学学位，但在蒂尔奖学金学员们看来，德索萨似乎没有任何明显能使其有资格做初创者导师的经验，当然，有一点除外，那就是他人长得特帅，很讨蒂尔的欢心。", "这一奖学金项目经常被拿来与初创公司孵化器Y Combinator相比较：它会向初创早期的公司投资10万美元，并以放手而闻名；Y Combinator要求初创公司每两周“报到”一次，这给初创业者营造了一种纪律感，并帮助他们结交朋友和建立联系。蒂尔奖学金项目不提供这些东西。“我就想说‘我此刻就在硅谷’，”一位学员说，“我不认识斯坦福大学的任何人。我不能随便去酒吧，因为我还不到21岁。我可以与任何一位首席执行官会面，但我不需要这个。我只是需要有人陪我。”", "当蒂尔奖学金学员抱怨或寻求帮助时，蒂尔的员工们的反应恰恰就是人们能够指望从一群极端自由主义者那里得到的反应。他们会说：“这是一个很好的问题，你可以通过商业途径来解决。”这种反应在意识形态层面完全合理，但对一个孤独的青少年没有任何帮助。", "这些年轻人当中，有人遭受了痛苦。我听说有一位蒂尔奖学金项目的早期学员似乎正在与心理健康问题和毒瘾斗争，根据两位早期学员的说法，管理人员的干预过于迟缓。还有一位蒂尔奖学金学员被悄悄地从该项目中除名，那是在警察出现在他和其他几位学员合住的房子里之后。有两位学员说，旧金山警方告诉他们，他们正在调查他与一起加密货币庞氏骗局的关联。", "许多蒂尔奖学金学员都说，在蒂尔的圈子里，他们感觉自己就像二等公民。有人告诉他们，作为一项规矩，创始人基金是不会投资任何一位蒂尔奖学金学员的，因为他们担心这会让人觉得他们有投己所好之嫌。但规矩总是在变，少数几家公司筹到了小笔投资，蒂尔本人则更是将200万美元投入Hello公司，这是一家由詹姆斯·普劳德创立的专门生产售价149美元的闹钟和睡眠记录器的制造商。普劳德19岁入选该奖学金项目，蒂尔称他“从一开始就脱颖而出”。对普劳德的初创公司（后于2017年倒闭）来说，这是件大好事，但这也意味着任何没有从蒂尔那里筹集到资金的人，看起来都是表现不佳的。如此一来，其中的许多公司要想筹到资金，就会相当困难。", "在蒂尔奖学金项目创立之际，蒂尔大量借用Halcyon Molecular公司举例，该公司由十几岁的威廉·安德雷格与人共同创办，承诺要解决老龄化问题。2011年，为配合《纽约客》刊登乔治·帕克的人物专访，蒂尔甚至让帕克参加了一次会议，并且在会议快结束时敦促安德雷格兄弟及他们的员工积极招募更多的工程师。蒂尔曾说，写下你所认识的三个最聪明的人的名字，然后聘用他们。", "但在帕克的人物专访于2011年发表几个月后，一家英国公司在营销上击败了Halcyon Molecular公司，开始推广小型的一次性DNA测序机器，售价有望达到900美元，远高于Halcyon Molecular公司一直致力要达到的100美元目标，却远低于这些机器之前10 000美元的售价。安德雷格试图转换聚焦点，但蒂尔最终不得不关掉该公司——用第二好的测序方法毫无意义。直到2012年8月，安德雷格都一直试图在蒂尔帝国内部为其员工寻找新的工作岗位。蒂尔聘请了曾在Halcyon Molecular公司工作的物理学博士阿龙·范德文德，让其成为Halcyon Molecular的首席科学家和主要投资者。在该公司宣布关闭的那天，他邀请安德雷格到家里来，并在一场国际象棋的对弈中无情地击败了安德雷格，然后利用这盘棋给他上了一堂商业课。蒂尔指出，在最终将死安德雷格前的几个回合中，这个年轻人原本有十几种可能的走法。“当你决定下一步做什么的时候，你应该非常谨慎地出着儿，因为你最终可能陷入一种被掣肘的境地。”蒂尔如是说。他把安德雷格兄弟俩送到现实世界中，让他们去揣摩下一步该怎么做。", "安德雷格拟成立Fathom Radiant公司，为超级计算机制造先进的人工智能芯片，并邀请蒂尔投资。蒂尔同意与他见面，但在最后一刻又取消了这次会面，后来没再重新安排过。安德雷格总结说，创始人基金已经变得“更以商业为重”。", "安德雷格对蒂尔并无恶意，却后悔将自己20岁出头的日子——人生中最美好的时光，虚掷在回想起来似乎考虑不周的商业模式上，并因此最终也没有发现自己的青春之泉。“不要按照你自己在19岁时制定的策略行事，”他说，“这当然是事后诸葛亮的想法。”", "就在蒂尔远离安德雷格兄弟及其大学时代的朋友巴尼·佩尔的公司时，即两者显然都已实现了其目标之际，蒂尔最终还放弃了“海上家园”研究所。这家由帕特里·弗里德曼创立的热爱自由的非营利组织，曾被蒂尔用来打磨他的激进知识分子形象。2011年，他离开了基金会的董事会。他告诉弗里德曼，他的非营利组织将不得不“自负盈亏”，最终蒂尔还缩减了自己的捐款。弗里德曼试图创办一家营利公司，以在洪都拉斯建立一座私密小城，蒂尔对此进行了投资。但是，由于洪都拉斯最高法院判定此设想违宪，并将该公司关闭，从而导致它陷入法律纠纷。弗里德曼破产了，他有两个孩子，又正在闹离婚，在过去的五年里，他的年薪平均只有3.5万美元。“无论怎么说，这都是彻底的山穷水尽。”弗里德曼说。因此，他于2013年又回到谷歌，就是为了那里的薪资和福利。他几乎不跟蒂尔说话已经好多年了。", "蒂尔奖学金项目收获的成功如此稀少，以至于到2015年，蒂尔对吉布森和斯特拉赫曼已经完全失望，并让杰克·亚伯拉罕取代了他们。亚伯拉罕是一颗冉冉升起的风险投资新星，与蒂尔在政治观点上志同道合。他改变了规则，将蒂尔奖学金学员的入选年龄放宽至22岁——原先的20岁听起来很擅长“标新立异”，但在实践中还太年轻，并且开始招募已经筹集到资金的创业者。蒂尔用他们自己的1517基金资助了吉布森和斯特拉赫曼，该基金专门投资年轻人创办的公司。", "那些未能成功创办震撼世界的初创公司的人，最终会被悄无声息地挤出项目关系网，他们不会再收到电子邮件，也不会再被邀请参加年度联谊聚会。正如其中一人告诉我的，他们开始不再把与蒂尔在一起的时间看作深刻的心智历练，而更像是“一次超级聪明的公关行动”。这位前学员还说：“他每年花200万美元，买到了巨大的体面。如果没有这个奖学金项目，他就教不了这门课了。”", "这门课指的就是蒂尔努力争取美国青年的第二个步骤。2012年3月，在斯坦福大学的课程表上，新纳入了一门设在计算机科学系的名为“计算机科学183：创业”的课程，将蒂尔列为授课教师，并承诺课程内容源自“早期的创业公司，包括PayPal、谷歌和脸书”，并着重介绍“所创立的公司价值超过10亿美元的企业家，以及曾投资于包括脸书和声田这样的初创公司的风险资本”。在过去一年半的时间里，蒂尔一直在抨击精英大学，还写了一本专门指责斯坦福大学的书以及多篇专栏文章和演讲稿，然而，在做完这一切之后，他竟然还说服了母校，让他教授一门关于创业精神的课程。", "这门课非常受欢迎，几天内报名人数就达到了250名学生的上限，并在教职工中引起了骚动，有些人对蒂尔当学生时的古怪行为还记忆犹新。但斯坦福大学并不是蒂尔的目标受众。路透社的头条标题是“讨厌大学的彼得·蒂尔前往校园”。“如果我的工作做得好，”一位发言人以蒂尔的名义向这家新闻通讯社吹嘘道，“这将是你们必须上的最后一门课。”媒体的关注也越来越多，他出现在《60分钟》节目上，以及《纽约时报》专栏作家戴维·布鲁克斯的一篇文章里。", "蒂尔在社交媒体上更成功。课程一开始，网上就出现了由他的年轻门生布莱克·马斯特斯撰写的文字整理稿。马斯特斯是斯坦福大学法学院的学生，上一学期就在创始人基金打工，是一个典型的蒂尔助手：长相英俊、极端保守、文质彬彬，还雄心勃勃。马斯特斯是在斯坦福大学读的本科，专业是政治学，后来在美国某检察官办公室任职。他和蒂尔一样，都是校内联邦主义者协会的会员，也是健身馆的常客。然而，从那年春天开始，他成了蒂尔的“鲍斯韦尔”，将每堂课的详细笔记发到网上，并附上蒂尔提供的图表和图形。这些笔记几乎立即走红网络，几乎每周都会出现在黑客资讯网站的首页，黑客资讯是一个阅读量非常大的科技和企业家精神论坛，当然这些笔记也出现在脸书、推特、红迪网和其他一切胸怀大志的年轻人相互联系的地方。", "蒂尔的授课也可能会有不确定的地方，他准备好的讲稿虽然在纸面上简洁明了，但在讲课过程中时常会离题扯远，而且演讲的结构也有些凌乱松散，尤其是在初期。蒂尔一开始给出的大多是标准的创业建议。在一次关于企业文化的授课中，他建议企业应该拥有企业文化。但即便是这样乏味的课程，他也能通过邀请朋友和前员工（包括马克斯·列夫琴、里德·霍夫曼和马克·安德森等）来做客而让其变得生动起来。", "然而，随着课程的进行，蒂尔不再只是给出随口一说的建议，而是变得更有哲学意味，他将其独特的末日政治理论注入商业建议。第十一讲是关于秘密的，5月底的第十三讲则是关于个人动力的首要性。在“成功不是中彩票”那一讲中，蒂尔认为，自打他出生以来，世界基本上就一直在走下坡路，而那时的人们对进步有着明确的看法。当时所说的进步，意味着打败苏联人和驾驶飞行汽车。也就是从那时起，世界开始接受他所谓的“不确定的乐观主义”。蒂尔声称，这是一种具有欺骗性的有害的世界观，其表现形式多样，包括指数投资的兴起、那种认为变老和去世是正常的普遍认知，以及洛杉矶的交通状况。蒂尔说整个世界都被搞砸了，然后他又说，在当时挤满教室过道席地而坐的听众中那些有动力的学生，以及在网上听讲座的成千上万的年轻人，有能力改变这个世界。他们可以解决洛杉矶的交通问题，甚至可以长生不老，而且一路越发暴富。只要他们把自己从自由、政治正确的高等教育世界中解放出来，任何事情似乎都是有可能的。", "通向经济稳定甚至巨大财富及后衰退时代的希望之途，再加上令精英阶层可以坚守下去的机会，这一切都让年轻一代和科技天才难以抗拒。在英国南部读大学的20岁大学生路易斯·安斯洛表示：“现在很多年轻人都有雄心抱负，而且都想要有壮志凌云的感觉。”安斯洛喜欢蒂尔理想式的未来主义和科学可以战胜死亡的自信，而且安斯洛也讨厌上大学。于是他退学了，决定接受蒂尔为自己的导师。", "安斯洛开始给蒂尔的员工和助手写信，主动提出可由他来组织当地的活动。“我只是下定决心要尽可能地接近他。”他说。最终，安斯洛被邀请参加蒂尔基金会峰会——这是一个为有抱负的学员举办的活动，以及随后的一些聚会。", "对安斯洛和其他像他一样的人来说，不只是蒂尔的想法完美地契合了当时的情况，就连推广这些想法的方式也是那样完美。蒂尔是一个跨界多能的、内涵深邃的人，在其人脉圈子中的那些人似乎能接触到外界无法接触到的秘密。2014年，蒂尔的一名员工给了安斯洛一本《从0到1》的售前样书，这本书是根据蒂尔在斯坦福大学教授的课程改编的。安斯洛告诉我，他内心充满了崇敬之情。“你崇拜这个人，就会得到这份神圣文本的独家副本，”他说，“这一切都充满了宗教色彩。”", "蒂尔一直都不太可能是那种领导者，但几十年来，他一直在创建基于忠诚的人脉网络。在蒂尔奖学金项目成立之前，就已经有了“PayPal黑帮”，在那之前，他还借助《斯坦福评论》聚集了一小群愤怒的年轻大学生。现在，蒂尔正在以产业化的规模行事，培养年轻、有抱负、志同道合的人。正如斯坦福大学的马丁·赫尔曼观察到的，这些人“视蒂尔为领导者，不会与之唱反调”。那些入选了蒂尔奖学金项目的学生，以及那些像安斯洛一样对该项目心生向往的青年，不仅放弃了学业，也抛弃了正常的青少年社交，还将自己的信仰改造得与蒂尔的思想一致，并将实实在在地致力于为蒂尔及其公司工作许多年，如果不是当终身职业干一辈子的话。安斯洛说这感觉就像投身于一场群众运动，这场运动将成为一个新的、更大的“黑帮”的核心，而蒂尔将把这个“黑帮”部署于商业和政治领域。"], "wcount": 11342}, {"icon": "12", "title": "第12章 政治天赋", "paras": ["2011年年底，现已不复存在的《细节》杂志——《纽约时报》曾称其为“都市丽男圣经”，打算为蒂尔编发一篇人物专访。在此过程中，蒂尔在普雷西迪奥公园里一边散步一边接受了采访，那里离创始人基金办公室不远。蒂尔成功地遵循了一个屡试不爽的套路，他将自己描绘成胸怀大志的投资者，专访的标题为“科技乌托邦的亿万富翁之王”。但被问及工作之外的生活时，他愣住了。“你知道，结果就是……结果就是很多……很多的……大部分吧，都是相当简单的基本社交活动，”他磕磕巴巴地说着，直到最后把结语带出来，“没那回事儿……没有那么疯狂，那么激动。”", "也许很难理解，一个连自己的兴趣都说不顺溜的人，怎么就成了一代年轻人心目中有魅力的人。当然，蒂尔最忠实的追随者并不是都市月刊的典型读者，他们是不一定能融入传统社会场景的工程师。这些有抱负的创业者一遍又一遍地观看了影片《社交网络》，并接受了这样一个得到蒂尔奖学金项目加持的信息，即聪明的厌世者可以成就一番事业。在哈佛大学混不下去并不重要，事实上，被这个体制拒绝（或者更好的是主动自绝于体制）会让你比那些无趣的、循规蹈矩的同龄人更有优势。", "蒂尔意识到这种态度是有市场的，于是便通过其员工的博客帖子及一系列主要为了宣传蒂尔和他的兴趣而组织的活动积极地将奖学金项目推向公众。其中既有蒂尔基金会员工负责组织、志愿者参与的欢乐时光，也有蒂尔基金会峰会，这是一种小型联盟会议，专门面向有抱负的奖学金学员或已经申请奖学金却被拒绝的人。当然，对那些讨厌专业媒体的人来说，这里还有社交媒体可用。蒂尔广泛结交了许多人，比如迈克尔·吉布森和帕特里·弗里德曼，他们经常使用社交媒体（如在博客和推特上发帖）来宣传蒂尔的想法。", "所传递的信息总是很简单，往最好的一面说，上大学和传统的追求事业毫无意义；往最坏的一面说，这是在债务积累中的智力破产练习。你有雄心壮志，想要改变世界，让自己成为富人，这当然是好的。换句话说，这是一种客观主义，它对于年轻奋斗者的吸引力丝毫不亚于蒂尔年轻时读过的安·兰德。", "在全美国及美国以外的地方，青少年们都想接近蒂尔。他们响应并放大了蒂尔的代理人发表的博客文章。他们在推特上跟踪他的核心圈子，采用他的语言作为他们自己的语言。一大批年轻的蒂尔追随者，其中大多数人只是想创办公司致富，而且最理想的是用蒂尔的钱，他们开始像科技乌托邦主义者或逆向投资者那样说话。", "他们有自己的语言，很多人被认为是“理性主义者”，他们也有自己的文学经典。其中包括托尔金和兰德，当然，也有崇敬科技的神秘文本，《哈利·波特与理性之道》就是这样一部60万字的粉丝小说。它改编自J.K.罗琳的魔法故事，想象哈利·波特把科学方法融入他的魔法。还有一部很受欢迎的作品《最后的魔戒持有者》，它是《魔戒》系列粉丝小说的一部分，似乎很适合帕兰提尔的创始人。这本书于1999年在俄罗斯首次出版，2010年在网络上被翻译成英文。在这本书中，托尔金笔下的“好人们”——甘道夫和精灵们，由于魔多的和平发展威胁到他们的封建统治，遂成了试图摧毁魔多的战争贩子。“甘道夫是个疯子，他想发动战争，”蒂尔对《细节》杂志说，“魔多是一个建立在理性和科学基础上的技术文明。在魔多之外，一切都是神秘的，什么都不起作用。”", "蒂尔喜欢阅读《主权个人》这本书，它是一本鲜为人知的关于政治的鸿篇巨制。1997年，风险投资家詹姆斯·戴尔·戴维森和记者威廉·里兹—莫格共同出版了这本书，这是一份网络自由主义的宣言，预言了民族国家的终结。《主权个人》在2020年重新出版发行，并附有蒂尔写的序言。这本书很有可能影响了蒂尔在20世纪90年代末和21世纪初对PayPal使命的大胆评论。戴维森和里兹—莫格认为，富人应该把自己从国籍的束缚中解放出来，当然也应该从“民族主义的税负”中解放出来、从“工人对资本家的剥削”中解放出来，其路径包括雇用私人民兵、在低税或无税国家获得公民身份，以及在一个新的自由意志主义天堂中尽情享受。这些思想不仅影响了“海上家园”，也影响了由蒂尔出资、弗里德曼领导的Pronomos资本项目，该项目寻求在发展中国家建设“特许城市”。", "在蒂尔异军突起的运动中，还有一个政治哲学家柯蒂斯·雅文。雅文当时以笔名“孟子·莫尔德布格”为外界所知。像许多蒂尔的圈内人一样，雅文是一个啰唆又脾气不好的极客，长期厌恶主流左派。他毕业于布朗大学，后在加州大学伯克利分校攻读计算机科学博士学位时辍学。在一家互联网泡沫期间上市的科技初创公司就职后，他成为全职博主，专写政治理论、文化、种族等方面的文章，多取材于名不见经传的19世纪和20世纪的哲学家，以及“蒂尔江湖”平时常常引用的《星球大战》、《魔戒》和《源泉》。“孟子·莫尔德布格的文字，读起来就像一个过于自信的自学成才的人在模仿刘易斯·拉普曼的论文，”左翼杂志《异见者》上的一篇文章这样写道，这里指的是那位《哈泼斯》杂志前编辑的难懂冗文，“就好像刘易斯·拉普曼是个法西斯青年地下城管理员。”", "雅文的博客“无条件保留”集中讨论了他称之为“形式主义”的理论，他将其定义为减少暴力的项目。雅文认为，美国的政府应该被公司架构组织和独裁者所取代，民主是“一种无效的和破坏性的政府系统”。蒂尔在Cato Unbound网站上发表的关于民主和自由的不兼容性的评论与雅文的观点如出一辙，帕特里·弗里德曼也在同期的一篇文章中推荐“无条件保留”。在斯坦福大学授课期间，蒂尔抨击公司内部的民主决策。“初创公司和创始人都倾向于独裁的一面，”他说，这当然是一种美德，“它比暴民更专制，因为它本应如此。”", "雅文的看法最终固化为一种成熟的意识形态，即所谓的“新反动”，其主要观点包括：认为气候科学在很大程度上是精英们制造的骗局；通胀的货币，比如美元，是“恶魔”；遗传基因上的差异导致某些群体“更适合掌控”，而其他人（他说包括非洲人）“更适合被奴役”。蒂尔就算不支持第三种观点，当然也支持前两种观点。雅文对种族隔离的看法可追根溯源到本科生蒂尔（尽管被蒂尔否认了），他将纳尔逊·曼德拉与挪威爆炸和枪击事件的行凶者安德斯·布雷维克进行比较。“新反动”思想有其专属的词语：用“红色药片”（redpill）治某人，意味着让他面对这种新的世界观睁开双眼；“大教堂”（The Cathedral）是指由政府官员、媒体，尤其是大学教授占据的精英轨道。", "蒂尔还与其他极右翼煽动者建立了联系。2010年，他给了新成立的同性恋保守派组织GOProud 10万美元，这让他成了该组织的最大捐赠者，同时他还提议并在他家里搞了一次聚会，最大的亮点是安·库尔特也来参加了，她是煽动专家、康奈尔大学仿《达特茅斯评论》风格的《康奈尔评论》的创始人。GOProud在同性恋政治团体中独树一帜，与更主流的“木屋共和党人”大相径庭，因为它并不专注于倡导同性恋权利。", "蒂尔对参加聚会的一名《政客》杂志的记者说：“总体上来说，有太多共和党人想要普遍摆脱同性恋问题。”蒂尔邀请其好友安·库尔特出席，就很好地说明了这一点。2007年，库尔特在保守派政治行动会议上发表演讲时，曾开玩笑地称2008年民主党总统候选人约翰·爱德华兹为“同性恋”，那是个玩笑，她告诉蒂尔家里的来宾。在讲话中，她表达了对同性婚姻的反对，并试图拿种族讲个笑话，以驳斥美国同性恋是受压迫群体的观点。她调侃说：“那黑人一定会盯着同性恋说，‘我们怎么受不到那样的压迫呢？’”", "蒂尔的思想非常极端，不那么容易符合任何政治理念。新反动派或右翼反对派没有自己的政党，却有一个候选人——罗恩·保罗。像蒂尔（和雅文）一样，这位眉毛低低的得克萨斯州众议员喜欢奥地利经济学派的极端自由市场资本主义，也喜欢一般的末世预言。保罗和蒂尔一样，都是气候变化的怀疑论者，而且长期以来都是极右翼的煽动者。", "从20世纪70年代末到90年代中期，保罗发表了很多时事通讯，其中有名的包括《罗恩·保罗自由报告》和《罗恩·保罗生存报告》等，在这些通讯中，他将“小马丁·路德·金日”称为“我们每年的仇恨白人日”，并声称1992年的洛杉矶骚乱结束于“黑人该去领取福利支票的时候”。在南非种族平等问题上，保罗也持怀疑态度，将种族隔离的终结称为“对文明的毁灭”，也是撒哈拉以南非洲有史以来最大的悲剧。他后来声称，他从未写过这些时事通讯，尽管它们经常以他的名义和第一人称发表。", "保罗在其胜算极小的2008年总统大选中略去了这段历史，把重点放在其鹰派的经济主张上。他赞成恢复金本位制并要求终结美联储，并且反对伊拉克战争。保罗的这些思想让他脱离了共和党的主流，但在互联网上炙手可热，保罗自己的社交媒体账户吸纳了数以万计的追随者，其中大多数是被他的反战和反建制的言论吸引的年轻选民。在整个竞选过程中，他的支持率都在个位数以下，但辩论后进行的网上民调显示他始终领先。保罗还通过被他的竞选团队称为“金钱轰炸”的网上筹款活动，从捐赠者那里筹集了数百万美元。2007年12月16日，在波士顿倾茶事件发生234周年之际，5.7万名保罗的支持者平均每人捐款50美元，帮助他筹集了600万美元，创下了单日筹款最高纪录。保罗没有得到来自主流政党或捐赠阶层的支持，但一周后，彼得·蒂尔捐赠了2300美元，这是他第一次支持总统候选人。", "保罗2008年的竞选失败了，但大萧条使他的形象大幅提升。他出席茶党的民众集会，在大学校园里吸引了大量的人。他的书《定义自由：影响我们自由的50个重要议题》在2011年成为畅销书。在媒体上露面时，保罗表现出捕捉和放大年轻人对其痴迷的天赋。他呼吁终止联邦学生贷款，他认为这使学费变得负担不起，并进行了一场欲让所有毒品合法化的疯狂探索。", "当时，一些自由派民主党人站出来支持医用大麻和民事结合。2011年5月，罗恩·保罗走上南卡罗来纳州格林维尔的一个辩论舞台，对福克斯新闻的克里斯·华莱士表示，他支持废除那些不仅禁止大麻和同性婚姻，也禁止可卡因、海洛因和卖淫的联邦法律。他将阻止人们使用非法药物的努力与政府对宗教自由的侵犯进行类比。“我们希望自由地以精神的方式选择未来，但涉及个人习惯时不希望这样，这非常令人惊讶。”保罗如是说，迎来了满堂欢呼和笑声。", "“我从没想过海洛因会在南卡罗来纳州这里得到掌声。”华莱震惊地说。", "到了12月，离艾奥瓦州党团会议还有不到一个月的时间，保罗在艾奥瓦州的民调很有竞争力，在筹款方面超过了除领跑者米特·罗姆尼以外的所有人。在兴奋中，蒂尔看到了一个扩大影响力的机会，更重要的是，他要利用保罗日益增长的名气来提升自己的影响力。", "12月12日，他向支持保罗竞选的革命政治行动委员会捐款5万美元。4天之后，正值又一个波士顿倾茶事件周年纪念日之际，保罗的竞选团队举行了一次“金钱轰炸运动”，但这次不是只有小额捐赠者参加。除了从通常的支持者那里筹集到400万美元，蒂尔还向该组织捐赠了8.5万美元。他还悄悄地开始资助一个超级政治行动委员会——“支持自由”，提供的资金高达260万美元，比保罗从其他人那里募集到的资金多得多。“凡是想要自由和经济增长的人们都应该采取行动，”蒂尔在2012年1月底的一份声明中说，“投票给罗恩·保罗是一个很好的开始。”", "保罗和他的亲信们发现，科技亿万富翁全力支持他们的竞选活动，这既令人兴奋又令人困惑。保罗在商界没有主要支持者，尽管这是他反建制候选人资格的一部分意义所在。而且，蒂尔的超级政治行动委员会也很古怪。掌管其运转的不是政治人士或坚定的自由意志主义活动家，而是一群政治新手，其中包括斯蒂芬·奥斯古尔，他是毕业于斯坦福大学的网络营销人员，也是创始人基金的卢克·诺塞克的朋友，还有杰弗里·哈蒙，是他让口腔刷风靡市场，口腔刷是一款据说可消除口臭的舌头清洁工具，每支仅售5美元。早期，口腔刷主要通过电视购物广告来销售，哈蒙是在杨百翰大学读书时了解到这款产品的，他在优兔上制作了一系列视频，主角是一个巨大的会说话的舌头。（“我们能找到的最大的舌头。”）继口腔刷之后，他和几个兄弟又一起创办了一家数字广告公司，专门推广其他新奇的产品，包括神奇噗噗丽（厕所除臭喷雾剂）和蹲坑式马桶凳（科学家表示这种流行的卫生间配件确实能帮助使用者更好地排便）。", "哈蒙的独门绝技就在于他能把奇奇怪怪的、令人不爽的东西变得赏心悦目。《从大便到黄金》是一本讲述哈蒙及其广告公司的书，这本书的书名也是他的播客名称。哈蒙用蒂尔的钱来推销保罗，就像卖那些卫生间用品一样。蒂尔资助的政治行动委员会制作了一系列低成本的恶搞视频，打着“虚假政客网络”的幌子，请人模仿其他候选人拍摄了纪录片风格的视频，宣传保罗是一个真正的保守派，不会向民主党、银行家或媒体屈服。", "这些视频有的长达10分钟，有的甚至更长，这样的片长和互动性在当时是不同寻常的。哈蒙率先使用了一种新的谷歌广告类别，允许营销商家付费后在视频中添加链接。纪录片风格的商业广告《致敬我们的军队》将“9·11”事件归咎于美国的军事行动，还拍摄了投票给保罗的退伍军人的感言。观众可以点击并立即在脸书上分享该视频，这在政治广告上还是第一次。", "最终，由于蒂尔和保罗的竞选活动在行动上南辕北辙，结果并没有掀起多大的浪花。保罗把重点放在党团会议较小的州，这些州的竞选成本较低，热情的志愿者可以赢得代表。之所以决定不考虑佛罗里达州，是因为佛罗里达州的三大媒体市场坦帕、迈阿密和奥兰多的广告费用较高。但佛罗里达州是超级政治行动委员会“支持自由”重点关注的州之一。保罗完败，只赢得了7%的选票，在该州排名第四。“这很奇怪，”《理性》杂志跟踪竞选活动的编辑布莱恩·多尔蒂说，他还著有《罗恩·保罗的革命：他所激励的人和运动》一书，“我很想知道那些家伙是怎么让蒂尔给他们几百万美元的。”", "保罗的竞选班子也同样感到困惑。当然，从官方层面来看，超级政治行动委员会和竞选活动是各自独立运作的，但通常委员会领导人都是候选人的亲密盟友，这就确保了即使他们不说话，他们也会按照相同的剧本操作。“在彼得身上我们找不到这种感觉。”保罗竞选团队的主席杰西·本顿说。在2012年总统大选之前，本顿和保罗都没有和蒂尔握过手。“我们都是在报纸上看到的。”本顿告诉我。当时，本顿接受《理性》杂志采访时表示，“支持自由”净帮倒忙。保罗败选已成定局后不久，本顿说：“我们没有看到他们花的那些钱有什么效果。”", "超级政治行动委员会在那之后不久就停止了运作。“没什么好说的，”哈蒙说，“我和彼得的关系维持的时间很短暂。”问题是，蒂尔并不是真的关心帮助罗恩·保罗获得共和党提名。他找到了一种相对廉价的方法来汲取保罗的运动能量，最终目标是将其融入自己的运动。在2月下旬的自由学生大会上，蒂尔对年轻的激进分子讲话时甚至都没有提到保罗，而是专注于他的技术停滞论。蒂尔抱怨客机的速度越来越慢，还建议说如果美国食品药品监督管理局停止对药品的有效性和安全性进行管制，就能开发出更好的药品。为了说明这一点，他建议学生们试着想象一下，如果食品药品监督管理局强迫流行的脸书上的电子游戏《开心农场》自证它不会造成伤害，那世界将会变得多么可怕。他说：“如果把生物技术标准应用到电子游戏上，那就不会有电子游戏产业了。”", "当记者问及保罗时，蒂尔几乎毫无热情，这无关乎保罗，也无关乎民主本身。“我怀疑投票到底能起到多大作用，”蒂尔说，接着便又给出了一个仿佛直接来源于雅文的博客的科技乌托邦式回答，“我喜欢科技的一个原因就是，当科技不受管制时，你无须征得别人的同意而改变世界。在最好的情形下，它可以不受民主的控制，也不受多数人的控制，我认为多数人往往敌视变革。”", "那么他和保罗到底在做什么呢？蒂尔解释说：“我们只是试图为下一个周期奠定自由意志主义的基础。这场大选真的是为了2016年。”", "2012年共和党全国代表大会于8月底在坦帕举行，因艾萨克飓风推迟了一天半，大会的主题是“更美好的未来”。在三天时间里，一连串的发言者，包括南卡罗来纳州州长妮基·黑利、新泽西州州长克里斯·克里斯蒂，还有对着一把空椅子演讲的演员兼导演克林特·伊斯特伍德，他们都试图证明奥巴马总统在任期内未能兑现其任职承诺，以及罗姆尼作为一名有钱有势的商人的看法是有缺陷的。坦帕非常著名的名人之一、最近成为罗姆尼支持者的摔跤选手胡克·霍根在福克斯新闻频道发表讲话，大谈特谈他的商业投资及他对这次选举的兴奋之情。他说：“美国获得了进行自我改造的机会，就像曾经的我一样。这只是一个新的开端。”", "值得注意的是，没有在官方程序上露面的是保罗，他拒绝支持罗姆尼，也没有得到发言的机会。就在竞选委员会做出判定，在缅因州的选举过程中，候选人的选拔方式存在不当之处之后，保罗在该州失去了一半的代表，而就是在缅因州，他曾赢得了几乎所有的代表，尽管在该州党团会议中位列第二。一群缅因州代表中途退会以示抗议，支持者们高呼：“给缅因州位置！给缅因州位置！”罗姆尼的竞选团队愿意和解，同意在党纲中增加保罗审计美联储的计划——这可是蒂尔帮忙奠定基础的“红肉”，还制作了一个时长四分钟的纪念视频，并在会议第三天晚上，在保罗之子、参议员兰德·保罗发表讲话前播放。", "所有这一切都是为了安抚聚集在坦帕的数千名保罗的支持者，他们包括100多名代表、竞选工作人员和志愿者，以及一位不善社交的亿万富翁，此人对建设“更美好的未来”有着自己的想法。保罗中断竞选后，克莱瑞姆的合伙人、蒂尔当时的政治调停人之一罗伯·莫罗打电话给保罗的政治主管本顿，告诉他蒂尔想来坦帕。他请本顿帮忙弄张入场券。", "不管保罗的顾问们对蒂尔在竞选期间的做法有什么保留意见，他们看到了一个加深关系的机会。7月，保罗暗示他将不再强调终结美联储，而将专注于争取“互联网自由”的事业，或确保大型科技公司受到尽可能少的监管。保罗做出保证，一是将反对网络中立性，即阻止大型科技公司为使自己的网站和应用加载速度快于竞争对手而付费的一系列规则；二是将反对监管科技公司搜集私人信息的努力。", "这是一种公然讨好蒂尔及其圈内其他人的无耻行径，而且在共和党全国代表大会期间还在继续，保罗的竞选阵营为蒂尔和莫罗骗来了所有的通行证，并给他们寄去了一份年轻活动家的名单。罗恩·保罗的一名工作人员还安排蒂尔和兰德·保罗会面。兰德·保罗将接手其父亲的组织，并参加2016年的总统竞选。虽然正式的话题是自由意志主义运动的未来，但保罗的盟友将其理解为某种形式的采访。", "据熟悉两人会面细节的人士透露，他们的想法是“兰德将掌舵并扩大”这项运动，蒂尔似乎也上了船，“他们的关系似乎很好”。在坦帕，蒂尔为保罗的竞选志愿者举办了派对，与年轻的代表们合影留念。", "保罗竞选失败后，蒂尔将他的努力转向共和党的未来。他聚焦于参众两院极端保守的候选人，向茶党附属的增长行动俱乐部基金捐赠了100万美元，用于资助特德·克鲁兹获胜概率不大的初选活动。蒂尔曾于2009年拿出总计24万美元来全力支持克鲁兹竞选得克萨斯州检察长，因帮助推翻了华盛顿特区的手枪禁令，并为一名墨西哥死刑犯的上诉案件辩护而在全国崭露头角，该案件是基于墨西哥死刑犯声称得州侵犯了其国际法权利。", "在萨拉·佩林等茶党人士的支持下，克鲁兹在与副州长的初选竞争中排名第二，此人是民主党支持的一大热门人物。但在5月底，克鲁兹曾获得了足够多的选票，以强势进行决选，并发起了一场由蒂尔继续资助的疯狂竞选活动。就在7月的初选之前，蒂尔通过增长行动俱乐部又捐赠了100万美元。克鲁兹以14个百分点的优势获胜，《华盛顿邮报》称“这可以说是参议院颠覆了这一循环”。克鲁兹在大选中轻松获胜，就像这样，彼得·蒂尔帮他的第一位参议员成功当选。高客传媒自然而然地站出来对蒂尔大加奚落，嘲讽他给坚决反对扩大同性恋权利的候选人撑腰，并指出：“这并不比给钱让孩子辍学、治愈死亡、创造‘海上家园’的自由意志主义的乌托邦更疯狂。”", "对兰德·保罗的顾问们来说，从蒂尔对克鲁兹（也被视为2016年总统大选候选人）的支持不难看出，蒂尔可能不仅是他们原以为的硬核自由意志主义者那样简单。例如，罗恩·保罗就反对死刑，并认为克鲁兹对金融服务业过于友好。“他们以为他会支持自由市场呢，”保罗后来在2016年怒斥道，“他是属于高盛集团的人。”相反，保罗团队认为蒂尔将支持兰德必定参加的2016年总统大选。", "但是，2013年3月，随着时来运转，兰德·保罗试图扩大自己的影响力。他打算在美国拉丁裔商会召集的一次活动上发表演讲，他的顾问希望这次演讲能表明他作为全国候选人的认真态度。这也将向主流共和党人传达一个信息：他没有其父亲那样的种族包袱。他这样做将会失去潜在赞助人的支持。", "在演讲开始时，保罗用西班牙语为自己没能更好地掌握这门语言而致歉。他回忆起自己小时候和拉丁裔孩子一起玩耍，十几岁的时候和移民一起修剪草坪。保罗说，他曾问一个西班牙语裔劳工能挣到多少钱，那人告诉他挣3美元，保罗还以为他说的是每小时3美元，事实上，这是一整天的报酬。他说，这些经历让他亲眼见识到，美国，尤其是共和党，是如何让移民失望的。保罗说：“共和党人在某些方面一直未能理解和阐明移民是美国的财富，而不是债务。”他还建议改善签证制度和边境安全，他说：“这将使我们能够让更多的人入境，并使我们承认我们不会驱逐已经在这里的数百万人。”保罗引用了加夫列尔·加西亚·马尔克斯和巴勃罗·聂鲁达的话，呼吁“对移民要采取新的态度，真正把移民视为财富，而非债务”。", "与对政策的描述相比，这次演讲的语气更具安抚性。保罗并没有像某些人期望的那样，主张允许大赦目前的非法移民。人们希望这个演讲既能赢得一些温和派的选票，又让极端保守派满意。大约就在这个时候，蒂尔停止参加财务委员会的电话会议，并通过中间人宣布他将支持另一位候选人。一位熟悉保罗竞选团队的人士表示，他认为是保罗的演讲和蒂尔反对扩大移民规模的立场引发了两人之间的不和。多年后，保罗开玩笑说，蒂尔的移民策略相当于“计划把自由女神像变成一个数字停车标志”。他后来删除了这条推文。", "保罗拒绝与蒂尔重修旧好，似乎是假设他会继承他父亲所开创的青年运动，却没有意识到其实他根本就没有真正拥有过它。“一直以来，我都以为他们会投票给自由意志主义的共和党人，”肯塔基州的众议员、保罗的盟友托马斯·马西这样评价竞选活动的支持者，“但经过一番灵魂拷问后，我意识到当他们在初选中投票给兰德、罗恩和我时，他们不是在投票支持自由意志主义思想，而是在投票给这场竞选中最疯狂的家伙。”", "这才是蒂尔的政治天赋，也是当他说要聚焦2016年总统大选时，他所要表达的真实意思。他并不是像媒体那样看待罗恩·保罗的运动，将之看作理想主义，而当它是可以利用的东西。这个新兴的政治基础不是自由意志主义，而是与蒂尔一样，是新反动主义。保罗已经矢口否认有关其种族主义的新闻报道，并且基本上清理了他那部分不光彩的过往。但保罗的支持者们更喜欢那个曾经的罗恩·保罗，这样的保罗曾像《斯坦福评论》的那些专栏作家一样发声，他也曾发表过一份时事通讯，称华盛顿特区95%的黑人男性都是罪犯，并针对同性恋的权利说过“我想念壁柜”。和蒂尔一样，他们想坚守“大教堂”。他随时准备出手相助。"], "wcount": 9338}, {"icon": "13", "title": "第13章 公共知识分子，既完全是局内人，又完全是局外人", "paras": ["“让我们进去，让我们进去，”他们喊道，“反对国家安全局！反对警察国家！”", "抗议者虽然是在礼堂外面，但他们的口号声传到了蒂尔就座的舞台上，意指帕兰提尔涉嫌侵犯普通美国人的公民权利。在2014年12月的那天晚上，除了出现二十几个示威者，加州大学伯克利分校的礼堂里挤满了数百名学生，都在观看伯克利论坛的嘉宾就蒂尔的新书《从0到1：开启商业与未来的秘密》采访他。该论坛是一个本科生的公共事务组织。", "上述抗议活动发生在因纽约和圣路易斯的大陪审团拒绝起诉埃里克·加纳和迈克尔·布朗致死案的涉事警察而在全国各大城市出现的示威活动之后，而蒂尔似乎为自己也被卷入其中而感到好笑。“哇！”他傻笑着说，“这还真是伯克利风格！”", "一名大学负责人出现在舞台上，建议大家应该谨慎地结束这场活动。蒂尔耸了耸肩，举起双手，宣布道：“我想我们应该继续下去！”", "人群中响起欢呼声，蒂尔点点头，坐在椅子上等待下一个问题。但几秒后，礼堂内一名富有同情心的学生为抗议者打开了门，他们喊着口号走上舞台。在一阵混乱中，蒂尔的麦克风被切断，他很快被人护送了出去。活动结束了。", "这一插曲显然令蒂尔兴奋不已，证明了他关于激进分子有力量的观点，但这也暗含了其地位的不稳定性。多年来，他一直在走极端，试图通过不断挑衅来赢得主流的认可。蒂尔的反主流思维对他的影响力至关重要，就像他面对抗议仍然坚持继续活动那样。但他对极端主义政治和道德上可疑的商业行为的操弄也带来了风险。他总是有可能把事情做得太过头，要么是支持某件事，要么是支持某个人，尽管真的很讨厌，但他无法退缩，或说更有可能的是不愿意退缩，因为他做事易冲动。", "总体上来说，蒂尔在更广阔世界里的声誉从未像现在这样好。在HBO电视网同年早些时候首映的反映高新技术产业的剧集《硅谷》中，他被克里斯托弗·埃文·韦尔奇精心地演绎为一个脱离现实但才华横溢的投资者。在剧集开头的一个场景中，剧中的角色彼得·格里高利与蒂尔一样，有着冷酷无情的做派、对“海上家园”情有独钟、对精英大学无比蔑视，却被一个威胁要重返大学的有前途的工程师成功地操纵了。该剧集的编剧们对其他高新技术业人物毫不留情，将谷歌的几位创始人和甲骨文的拉里·埃利森的不同特征加以整合，塑造了一个邪恶的角色加文·贝尔森，这是一个贪婪的、患有被迫害妄想症的大型科创公司的高管兼全职精神导师，他残忍地嘲弄投资者兼NBA球队老板马克·库班，库班在剧中的角色是一个只知道痴迷于自己的净资产和其在20世纪90年代创造的一款失败但赚钱的科技产品的人。另外，蒂尔的剧中角色看上去“人畜无害”，顶多不那么接地气，但绝非阴险狡诈。", "尽管高客传媒对蒂尔的批驳一如既往，如2014年年末，“硅谷闲话”就曾抱怨蒂尔关于创新放缓的观点，说“蒂尔又在大放厥词了”，然而其他媒体大多认可了好莱坞对蒂尔的看法。《华盛顿邮报》推出了一系列有关蒂尔的问答专访，对象都是些“撼动慈善事业的人”，重点聚焦于他对延长生命研究的支持。“我一直有种强烈的感觉，那就是死亡是一件非常可怕的事情，”蒂尔说，“我认为这有点儿不同寻常。”他补充说，他希望其延长人类寿命的工作将成为他的遗产。", "当时，蒂尔的投资公司创始人基金正投资于硅谷最热门的趋势——“共享经济”。该词指的是一批初创公司，由失业者或寻找额外收入的人通过智能手机应用程序提供专业服务。蒂尔的公司投资了大部分此类规模较大的公司。来福车是一款打车应用程序，它用驾驶私家车的普通人取代了出租车司机。（来福车开发出这个想法，优步则仿效它，并让这个想法闻名于世。）创始人基金的投资组合还包括一家让人们出租多余卧室或度假屋的住宿服务公司爱彼迎、一家专门提供零碎小工服务（比如洗衣服和遛狗）的公司“任务兔子”（Task Rabbit），还有Postmates提供类似的服务，只是工作人员为用户配送美食，而不是帮用户组装宜家家具。", "尽管针对这些应用程序都有一些批评的声音，但媒体几乎只关注它们的承诺。一直对全球化持乐观态度的《纽约时报》专栏作家托马斯·弗里德曼表示“这是一种强大的力量”，并预言“共享经济将使没有熟练技能的劳动者适应现代经济”。《连线》较少关注经济，而更多地关注文化潜力。“爱彼迎和来福车最终是如何让美国人彼此信任的。”一篇报道这样提到，该文章认为这些硅谷公司有潜力将我们带回一种“定义了前工业社会的”邻里友好的互动形式。", "当然，爱彼迎和来福车的影响也远不止这种邻里关系。这些项目旨在重塑劳动力市场，取消自新政以来工人享有的保护。至少在蒂尔看来，新政是美国政治史上最糟糕的发展之一。优步和来福车的司机、任务兔子和Postmates的工作人员、爱彼迎的兼职民宿经营者都不是雇员，也不可能是真正意义上的雇员，这意味着他们为之工作的应用程序公司没有义务为他们提供健康保险或养老保险，也没有义务与代表他们的工会谈判。零工工人没有最低工资，因为他们是按零工来获取薪酬的。此外，这种新兴劳动模式并不局限于共享经济，各地的企业都在剥夺工人的权利，方式就是从全职员工转为零工合同工。现在，爱彼迎、来福车和蒂尔的其他投资组合提供了一种支持这种转变的意识形态：剥夺工人的权利与企业的贪婪无关，这本身就是未来。", "蒂尔的新书《从0到1》试图在挑衅主流和接受主流之间走一条中间道路。他和他现在实际上的幕僚长布莱克·马斯特斯一起，将他在斯坦福大学授课的内容重塑成一种创业宣言，并且比当初的课上实际讲授的温和一些。他们删减了关于活人祭祀的冗长历史、关于古代苏格兰人和他们的血祭仪式的讨论，以及“创始人是上帝”的短语。相反，蒂尔着重讲到竞争，他认为成功人士应该尽其所能地避免竞争，要做到这一点，就必须实现对市场的垄断。蒂尔把谷歌作为一家科技公司的原型，他说这家公司通过消除或避免与潜在竞争对手的对抗，为自己创造了垄断。", "新闻界认为《从0到1》是一本很好的机场商务图书。“是的，这是一本为企业家写的自励图书，充满了陈词滥调和对只有初创公司才能创造的未来的阳光自信。”《大西洋月刊》的高级财经编辑德里克·汤普森如是指出，接着他赞扬该书“具有挑衅意味的言论”是“一种巧妙的框架设计，其本身的争议性足以引起大辩论，但同时其常识性又足以让渐进主义者承认其优点”。汤普森继续说：“企业家首先应该寻求主导一个小市场。换句话说，他们应该尝试建立一种小型的垄断。”", "自入学斯坦福以来，蒂尔就一直对上流社会“狂轰滥炸”，现在却突然受到上流社会的欢迎，故而对这种反应，他既感到高兴又感到失望。他曾经指望《从0到1》这本书能多少有点儿煽动性，但读者们在很大程度上忽略了他关于科技停滞的观点，他的观点将此现象归咎于应享权益支出，汤普森称这可以“忽略不计”。读者们似乎也没明白蒂尔是指责谷歌垄断的。要是一位知名风险投资家收购了最大、最受欢迎的高新科技巨头，就可能会导致监管部门采取行动，或在国会引发一场辩论，或至少会招来一波有争议的专栏文章。", "不！令蒂尔大失所望，没有人呼吁要解散谷歌，甚至没有人会真的费心指出蒂尔是一个骄傲的斯特劳斯主义者，喜欢隐藏的含义，所以他也许有他的潜台词。相反，读者们可是把他当成一个自励作家来阅读的：谷歌是垄断的，你也可以！", "蒂尔没有公开纠正任何人，2014—2015年间，他的一些副手关注着他，感觉他在退缩，就像他初涉对冲基金时退缩那样。威廉·安德雷格是蒂尔推荐的有可能治愈死亡的企业家，他觉得这本书本身及其首发式都令人费解，他说：“就像有人作梗似的。”这就是那个一向虚张声势抨击高等教育的人，常常喜欢说哈佛大学基本上就是精英们的54俱乐部，而且由于他对PayPal的工商管理硕士是如此发自内心的不屑一顾，以致那些为他工作的工商管理硕士都会对他隐瞒自己的学位，但他偏偏把《从0到1》的首发仪式放在了管理科学的伟大地标哈佛商学院。这就是那个颠覆者，现身于《财富》杂志的人物特写中，被描述为“美国公共知识分子的领军人物”，在该文中，蒂尔似乎对“海上家园”这个备受争议的项目感到尴尬，其目的是要打造漂浮在海上的自由意志主义乌托邦。正如《财富》杂志所说，现在他谈起这件事“几乎用的都是过去时”。", "9月，蒂尔现身纽约技师和商人总协会，与曾助力发起“占领华尔街”运动的左翼学者大卫·格雷伯展开辩论，并找到了共同点。当《纽约时报》的一位记者询问蒂尔其对一篇文章的看法时，蒂尔一笑而过。这篇文章发表在此次活动的赞助商《异见者》杂志上，文中称蒂尔喜欢新反动派，尤其是柯蒂斯·雅文。这篇文章的标题是“愚蠢透顶的硅谷帝国的马基雅维利之梦”，蒂尔说它“隐隐约约在奉承”，但其实是“彻头彻尾的阴谋论”。事实上，蒂尔说：“根本就没有人坐在那里谋划未来，尽管有时我想要是有人这么做该多好。”", "蒂尔喜欢玩这个特别的把戏，一边宣称自己已经完全恢复，一边经常眨眼示意，也许在其内心深处，他并不像他看起来那样完全顺从。2015年4月，在一次他与泰勒·考恩", "一起参加的问答活动中，有人就卡托上的一篇文章向他提问，因为他在该文中跳出来反对女性的选举权和民主。“写作总是一件很危险的事情。”蒂尔面带愧色地说，接着话锋一转，老调重弹地说美国政府为何根本就不是一个真正的民主政府，因为它是由这些“完全未经选举的技术官僚机构运作的”。", "蒂尔没有使用尚未被特朗普政府加入词典的“深层政府”一词，也没有向同样主张大幅减少联邦官僚层级而将权力集中在行政首长手中的雅文颔首赞同。但对追随极右翼和新反动运动的人来说，这种批评听起来很熟悉。在活动一开始，考恩就不吝辞藻地称赞蒂尔是“我们这个时代最伟大、最重要的公共知识分子之一”，但他并没有给别人质疑此评价的机会，立刻就把话题转到一个有关新西兰的问题上。“评价高了，还是低了？”考恩问道。低了，蒂尔回答。", "蒂尔经常形容自己“既完全是局内人，又完全是局外人”，他在玩一场微妙的游戏。例如，作为局外人，即在考恩的受众或《CBS早晨秀》节目主持人看来，蒂尔是一个日渐重要的思想领袖，他充满争议的过去已经翻篇。但是，事实上，在他充当公共知识分子并与媒体人一起狂欢的同时，蒂尔也在秘而不宣地采取行动。他不仅是“喜欢”新西兰，还秘密地获得了新西兰国籍。而且，他一方面与记者们在各种签售会上唇枪舌剑，另一方面偷偷地发动了一场媒体政变，目的就是要在受了多年的抨击之后跟高客传媒算总账，同时也给其他打算发文骂他的记者传递一个信息。", "反对高客传媒的运动，至少在最开始，是由一位英俊的知识产权法律专家领导的，他神秘地出现在蒂尔奖学金项目的一次活动上。2011年4月，阿伦·德索萨和蒂尔在柏林共进晚餐，当时蒂尔正在柏林参加一个会议，当时就读于牛津大学的德索萨前往柏林看望他。德索萨说，他们是通过一位不愿透露姓名的共同的朋友认识的。“彼得吸引的就是这种类型的人。”作者瑞安·霍利迪在其关于蒂尔和高客传媒的书中写到了德索萨，他这里所指的就是“来历不明、身强体壮的年轻人”，而且此人显然13岁就读过马基雅维利的《君主论》，并“着迷于权力”。霍利迪是蒂尔聚会的常客，享受了与蒂尔频繁接触的机会，并在离开时以史诗般的词语描述蒂尔。在该书中，他多次称这位风险投资家堪比谢尔曼将军、基督山伯爵、安德鲁·卡耐基、约翰·D.洛克菲勒和科尼利尔斯·范德比尔特等人的集合体。", "德索萨出席了那天的晚宴聚会，总共有八道菜，之后又在酒店内的酒吧里待了好几个小时。他此番为蒂尔带来了一个向高客传媒复仇的计划，他建议蒂尔将他当作一个替身来使用。德索萨将建立一个秘密的控股公司，然后由这家公司匿名出资与高客传媒打官司，以不断的起诉压倒高客传媒，直至其破产关门。他要求得到1 000万美元的支持。那天凌晨3点，蒂尔同意了。", "德索萨在新西兰和旧金山造访了蒂尔，两人一起调整改进了他们的计划。他们考虑通过贿赂员工来破坏高客传媒的业务、通过暗中监视丹顿来找到破绽让其难堪，甚至连窃听新闻编辑室都想到了。“你可能会忍不住去做所有这些事情，但不清楚它们是否会有更好的效果，”蒂尔后来说，“所以我们很早就明确只做完全合法的事情，这是一个很大的限制。”", "好吧，这是蒂尔自己的说辞，其他人却说他也采取了至少在道德上有问题的手段。确实发生过这样一件事，高客传媒的一位系统管理员收到了一封帕兰提尔招聘人员发来的电子邮件。邮件上提供的待聘职位比他在当前这家媒体公司的职位要高得多，这位工程师担心自己可能资格不够。", "从那以后，后续的五轮面试越发诡异。该工程师告诉我，帕兰提尔高管一再把对话引向高客传媒：他们的服务器是什么样的？他们使用了哪些安全供应商？晚上有多少人在办公室加班？他们运行的是哪个版本的Linux？他参加了所有面试直到最后一轮，之后就再也没有收到帕兰提尔的回复。后来，他才意识到他所泄露的信息足以帮助帕兰提尔成功地进行黑客攻击。“你真的可以用这些东西来攻击一个地方。”他说。这件事被曝光后，该工程师告诉高客传媒的高管，他认为自己无意中成了某个情报行动的信息源。硅谷的一家律师事务所也搞了一个类似的调查，该律所声称代表私人股本投资者，试图采访高客传媒的高管。高客传媒后来得出结论，这很可能也是在试图搜集情报。", "对蒂尔而言，有一个重要的道德底线就是（至少他会这样告诉你），他和德索萨不会资助任何针对高客传媒的诽谤或诽谤索赔，尽管这些都是那些对高客传媒不满的人最常发起的诉讼。蒂尔会跟朋友们说，做出这一决定是出于一个高尚的愿望，即限制诉讼裁决的范围，以便阻止搞出有可能破坏新闻自由的先例；但有时他又说，他之所以会接这样的案子，倒不是因为他对美国宪法有什么特别的忠诚，而是因为官司能打赢。", "通过德索萨，蒂尔委托诉讼律师查尔斯·哈德进行一项反向研究行动，涉及的范围比他数年前在克莱瑞姆所做的广泛得多。哈德及其团队搜罗了高客传媒最丑陋的帖子并寻找潜在的原告，挖出创始人尼克·丹顿的备忘录和公开声明，这些在法庭上都对丹顿不利。丹顿在一份致员工的备忘录中写道：“旧黄色新闻的主料也是新黄色新闻的主料，即性和犯罪，如果再好一点，那就是性犯罪。”最终，为蒂尔资助的这个活动工作的调查人员采访了高客传媒前雇员，进而发现高客传媒一直在使用无薪资实习生，于是便安排这些人起诉这家公司。", "哈德带来了一些针对高客传媒的案子，其中有一个案子来自一名声称发明了电子邮件的人，他称受到了高客传媒网站的大肆嘲笑；另一个案子来自一位独立记者，高客传媒曾说他可能患有“偏执癫狂”。不过，其中最有希望的案子是关于特里·博莱亚的，也就是广为人知的职业摔跤手胡克·霍根。", "2012年10月4日，就在霍根在坦帕共和党大会上华丽亮相几个月后，高客传媒发表了一段一分半钟的剪辑视频，内容为霍根和朋友之妻希瑟·克莱姆做爱的场面，并加了一个讽刺的标题——“即使只有一分钟，在工作时观看胡克·霍根在四柱床上做爱也不安全，但管它呢，看就是了”。总编A.J.多勒里奥如是写道。高客传媒起初根本没理会霍根删除视频的要求，霍根说，对于视频拍摄，他不知情也没同意过，并强调那对夫妇是公众人物（克莱姆的丈夫是坦帕电台的主持人）。霍根向媒体投诉了这段视频之事，这引起了哈德的注意。", "当月晚些时候，哈德起诉了克莱姆，霍根指控克莱姆未经他同意擅自录下了那次幽会。12月，他提交了一份修改后的诉状，其中提到丹顿、多勒里奥和克莱姆三人。该诉讼尤其指出霍根“作为12次世界摔跤冠军”的地位，并要求1亿美元的损失赔偿。", "高客传媒的员工，连同外界，都一致认为霍根的诉讼是他的另一场表演，或者再不济，也要从这家高度资本化的媒体公司讹出几百万美元。事实证明，霍根还曾试图压下另一份更具破坏性的录音，他在这份录音中发表了种族歧视言论。（“在某种程度上，我是种族主义者，”霍根在录音中说，“该死的……”霍根后来承认讲了这些话。“我说了些可怕的话，”他说，“但那不是我，那不是本来的我。”）丹顿认为霍根的诉讼针对的是克莱姆和其他泄密者，故而指示
